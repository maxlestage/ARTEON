# La version Flutter d'ARTEON (flutter/), gardée pour Android : analysée, testée et
# compilée pour iOS à chaque push qui la touche. L'application iOS officielle, celle qui
# part sur TestFlight, est en Swift (ios/, workflow ios.yml).

name: Application Flutter

on:
  push:
    paths:
      - "flutter/**"
      - ".github/workflows/ipad.yml"
  workflow_dispatch:

concurrency:
  group: ipad-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  check:
    name: Analyse et tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  ios:
    name: iOS (iPad et iPhone)
    needs: check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Construire sans signature (vérification)
        run: flutter build ios --release --no-codesign --build-number "${{ github.run_number }}"
