# Publie ARTEON sur GitHub Pages : le site complet (présentation, galerie 3D, catalogue,
# guide « Ajouter une œuvre ») exporté en fichiers statiques, avec les îlots 3D
# compilés en WebAssembly. Modifier expositions/*.toml ou public/tableaux/ sur master
# republie le musée.
#
# - À chaque push, le site est compilé, testé et exporté (vérifie que tout marche).
# - Sur la branche par défaut (et à la demande), il est en plus déployé sur Pages.
# - Chaque lundi, il est refait et redéployé : les expositions éphémères
#   (outils/ephemeres.py) changent avec ce que les musées exposent cette semaine.
#
# Réglage unique du dépôt : Settings → Pages → Source : « GitHub Actions ».
# (L'étape `configure-pages` essaie de l'activer toute seule si ce n'est pas fait.)
name: GitHub Pages

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

# Un seul déploiement à la fois ; celui en cours va jusqu'au bout.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Compiler, tester et exporter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Les expositions éphémères de la semaine, d'après les collections ouvertes des musées.
      # Un musée qui ne répond pas est sauté ; si le résultat ne se compile pas, on s'en passe.
      - name: Expositions éphémères
        run: |
          python3 outils/ephemeres.py || echo "pas d'exposition éphémère cette fois"
          if ! cargo check --quiet --lib; then
            echo "::warning::les expositions éphémères ne se compilent pas : elles sont retirées"
            rm -f expositions/ephemere-*.toml
            rm -rf public/tableaux/ephemere-*
          fi

      # wasm-bindgen-cli doit avoir exactement la version de Cargo.lock : on télécharge
      # le binaire officiel de cette version (pas de compilation, quelques secondes).
      - name: Installer wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$version" || { echo "wasm-bindgen absent de Cargo.lock"; exit 1; }
          echo "wasm-bindgen $version"
          curl -sSfL --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          wasm-bindgen --version

      - name: Tests
        run: cargo test --locked

      - name: Îlots 3D (WebAssembly)
        run: |
          cargo build --locked --lib --target wasm32-unknown-unknown --profile wasm-release
          wasm-bindgen --target web --no-typescript --remove-name-section --remove-producers-section \
            --out-dir pkg target/wasm32-unknown-unknown/wasm-release/arteon.wasm

      # Donne le chemin du site (`/ARTEON` pour https://<compte>.github.io/ARTEON/, ou
      # rien avec un domaine personnalisé). Seulement là où l'on déploie.
      - name: Configurer Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref_name == (github.event.repository.default_branch || 'master')
        uses: actions/configure-pages@v5
        # Si Pages ne peut pas être activé automatiquement, l'export continue avec le
        # chemin `/<dépôt>` (le bon pour https://<compte>.github.io/<dépôt>/).
        continue-on-error: true
        with:
          enablement: true

      - name: Export statique
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
        run: |
          echo "BASE_PATH=$BASE_PATH"
          cargo run --locked --release -- export dist
          ls -R dist

      - name: Vérifier l'export
        run: |
          for f in index.html ajouter/index.html credits/index.html 404.html .nojekyll pkg/arteon.js pkg/arteon_bg.wasm \
            manifest.webmanifest sw.js icons/icon-192.png icons/icon-512.png icons/icon-maskable-512.png; do
            test -e "dist/$f" || { echo "manquant : dist/$f"; exit 1; }
          done
          # L'application installable : le manifeste et le service worker portent le préfixe du site.
          grep -q '"start_url":"/ARTEON/"' dist/manifest.webmanifest || { echo "manifeste sans le préfixe"; cat dist/manifest.webmanifest; exit 1; }
          grep -q '"/ARTEON/pkg/arteon_bg.wasm"' dist/sw.js || { echo "service worker sans le préfixe"; exit 1; }
          grep -q 'register("/ARTEON/sw.js")' dist/index.html || { echo "service worker non inscrit"; exit 1; }
          # Chaque exposition a ses trois pages, sa scène 3D et toutes ses images.
          for toml in expositions/*.toml; do
            slug=$(basename "$toml" .toml)
            for f in "$slug/index.html" "$slug/galerie/index.html" "$slug/oeuvres/index.html"; do
              test -e "dist/$f" || { echo "manquant : dist/$f"; exit 1; }
            done
            grep -q 'pkg/arteon_bg.wasm' "dist/$slug/galerie/index.html"
            test -s "dist/donnees/$slug.bin" || { echo "données manquantes : $slug.bin"; exit 1; }
            for src in $(grep -o 'src="[^"]*/tableaux/[^"]*"' "dist/$slug/oeuvres/index.html" | sed 's/.*\/tableaux\///; s/"$//'); do
              test -s "dist/tableaux/$src" || { echo "image manquante : $src"; exit 1; }
            done
            # Chaque œuvre a sa page, liée depuis le catalogue.
            pages=0
            for href in $(grep -o "href=\"[^\"]*/$slug/oeuvres/[^\"#][^\"#]*\"" "dist/$slug/oeuvres/index.html" | sed "s/.*\/$slug\/oeuvres\///; s/\"$//" | sort -u); do
              test -s "dist/$slug/oeuvres/$href/index.html" || test -s "dist/$slug/oeuvres/${href}index.html" || { echo "page d'œuvre manquante : $slug/oeuvres/$href"; exit 1; }
              pages=$((pages + 1))
            done
            test "$pages" -gt 0 || { echo "aucune page d'œuvre pour $slug"; exit 1; }
            echo "✓ $slug ($pages pages d'œuvres)"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déployer sur GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == (github.event.repository.default_branch || 'master')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
