# L'application iOS en Swift (ios/) : compilée et testée sur un Mac de GitHub avec Xcode
# 27.2 (SDK iOS 27.2, Swift 6.4), captures d'écran sur le simulateur iPad, et envoi sur
# TestFlight quand les clés d'Apple sont là. Tout se règle et se lance depuis un téléphone.
#
# Pour l'installer sur l'iPad par TestFlight (compte Apple Developer, 99 € par an) :
#   1. App Store Connect → Apps → « + » → Nouvelle app : iOS, nom ARTEON, identifiant de
#      bundle com.maxlestage.arteon (le créer dans Certificates, IDs & Profiles →
#      Identifiers s'il n'est pas proposé).
#   2. App Store Connect → Users and Access → Integrations → App Store Connect API → « + »,
#      rôle Admin (Xcode crée lui-même certificat et profil). Noter l'Issuer ID et le Key
#      ID, télécharger le fichier .p8.
#   3. GitHub → Settings → Secrets and variables → Actions :
#      - secrets  APP_STORE_CONNECT_KEY (le contenu du .p8), APP_STORE_CONNECT_KEY_ID,
#                 APP_STORE_CONNECT_ISSUER_ID
#      - variable APPLE_TEAM_ID (Membership details sur developer.apple.com)
#   4. Actions → Application iOS (Swift) → Run workflow.
# Sans compte : Swift Playgrounds ouvre ios/ARTEON.swiftpm sur l'iPad (ios/README.md).

name: Application iOS (Swift)

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Envoyer sur TestFlight (si les clés d'Apple sont réglées)"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE: /Applications/Xcode_27.2.app
  XCODEGEN_VERSION: "2.46.0"
  IPAD: "iPad Pro 13-inch (M5)"
  IOS: "27.2"

jobs:
  ios:
    name: Compiler, tester, capturer
    # L'image Xcode 27 de GitHub (macOS 27, Apple Silicon).
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios
    env:
      KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Xcode 27.2
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Le projet Xcode (XcodeGen)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec project.yml

      - name: Tests sur le simulateur iPad
        run: |
          set -o pipefail
          xcodebuild test -project ARTEON.xcodeproj -scheme ARTEON \
            -destination "platform=iOS Simulator,name=$IPAD,OS=$IOS" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Captures d'écran (iPad)
        run: |
          set -euo pipefail
          app=build/Build/Products/Debug-iphonesimulator/ARTEON.app
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          d = json.load(sys.stdin)['devices']
          for runtime, devices in d.items():
              if runtime.endswith('iOS-' + os.environ['IOS'].replace('.', '-')):
                  for dev in devices:
                      if dev['name'] == os.environ['IPAD']:
                          print(dev['udid']); sys.exit()
          ")
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          mkdir -p captures
          shoot() {
            xcrun simctl terminate "$udid" com.maxlestage.arteon 2>/dev/null || true
            xcrun simctl launch "$udid" com.maxlestage.arteon "$@"
            sleep 25
            xcrun simctl io "$udid" screenshot "captures/$name.png"
          }
          name=1-accueil shoot
          name=2-exposition shoot -ouvrir van-gogh
          name=3-oeuvre shoot -ouvrir van-gogh/tournesols
          ls -la captures

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-ipad
          path: ios/captures
          if-no-files-found: ignore

      # Le dossier ARTEON.swiftpm seul, à télécharger sur l'iPad et à ouvrir dans Swift
      # Playgrounds (Actions → ce run → Artifacts → ARTEON-swift-playgrounds).
      - uses: actions/upload-artifact@v7
        with:
          name: ARTEON-swift-playgrounds
          path: |
            ios/ARTEON.swiftpm
            !ios/ARTEON.swiftpm/.swiftpm
          include-hidden-files: false

      - name: Compiler pour l'appareil (sans signature)
        run: |
          set -o pipefail
          xcodebuild build -project ARTEON.xcodeproj -scheme ARTEON -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: L'App Playground (Swift Playgrounds)
        # Le même code, ouvert comme dans Swift Playgrounds : vérifie Package.swift.
        continue-on-error: true
        working-directory: ios/ARTEON.swiftpm
        run: |
          set -o pipefail
          xcodebuild -list
          xcodebuild build -scheme ARTEON -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/playground" CODE_SIGNING_ALLOWED=NO

      - name: Signer et envoyer sur TestFlight
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.testflight) ||
          (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ] || [ -z "${KEY_ID:-}" ] || [ -z "${ISSUER_ID:-}" ] || [ -z "${TEAM_ID:-}" ]; then
            echo "::notice::TestFlight n'est pas réglé : ajoutez les secrets APP_STORE_CONNECT_KEY, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID et la variable APPLE_TEAM_ID (voir l'en-tête de ce workflow)."
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY" > "$key"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")
          # L'archive signée par Xcode (signature automatique avec la clé d'API).
          xcodebuild archive -project ARTEON.xcodeproj -scheme ARTEON -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ARTEON.xcarchive" \
            "${auth[@]}" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          # L'export envoie directement l'application à App Store Connect (TestFlight).
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ARTEON.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          rm -f "$key"
          echo "### 📲 ARTEON (Swift) ${{ github.run_number }} envoyée sur TestFlight" >> "$GITHUB_STEP_SUMMARY"
