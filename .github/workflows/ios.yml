# L'application iOS en Swift (ios/), avec tout le musée embarqué (elle se visite sans
# Internet) :
#   1. job « musee » (Linux) : le site exporté (catalogue, images, galeries 3D en
#      WebAssembly) devient ios/ARTEON.swiftpm/Musee (ios/preparer-musee.sh) ; tests du
#      modèle en Swift ;
#   2. job « ios » (Mac) : compilée et testée avec Xcode 27.2 (SDK iOS 27.2, Swift 6.4),
#      captures d'écran sans réseau sur le simulateur iPad, l'App Playground complet à
#      télécharger (artefact, et release « ipad » sur la branche par défaut), et envoi sur
#      TestFlight quand les clés d'Apple sont là. Tout se règle et se lance depuis un
#      téléphone.
#
# Pour l'installer sur l'iPad par TestFlight (compte Apple Developer, 99 € par an) :
#   1. App Store Connect → Apps → « + » → Nouvelle app : iOS, nom ARTEON, identifiant de
#      bundle com.maxlestage.arteon (le créer dans Certificates, IDs & Profiles →
#      Identifiers s'il n'est pas proposé).
#   2. App Store Connect → Users and Access → Integrations → App Store Connect API → « + »,
#      rôle Admin (Xcode crée lui-même certificat et profil). Noter l'Issuer ID et le Key
#      ID, télécharger le fichier .p8.
#   3. GitHub → Settings → Secrets and variables → Actions :
#      - secrets  APP_STORE_CONNECT_KEY (le contenu du .p8), APP_STORE_CONNECT_KEY_ID,
#                 APP_STORE_CONNECT_ISSUER_ID
#      - variable APPLE_TEAM_ID (Membership details sur developer.apple.com)
#   4. Actions → Application iOS (Swift) → Run workflow.
# Sans compte : Swift Playgrounds ouvre ios/ARTEON.swiftpm sur l'iPad (ios/README.md).

name: Application iOS (Swift)

on:
  push:
    paths:
      - "ios/**"
      - "expositions/**"
      - "public/tableaux/**"
      - "modeles/**"
      - "outils/**"
      - "src/**"
      - "build/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: "Envoyer sur TestFlight (si les clés d'Apple sont réglées)"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  XCODE: /Applications/Xcode_27.2.app
  XCODEGEN_VERSION: "2.46.0"
  IPAD: "iPad Pro 13-inch (M5)"
  IOS: "27.2"

jobs:
  musee:
    name: Le musée embarqué
    runs-on: ubuntu-latest
    # La première moisson des collections du monde (fiches, vignettes et images en grand)
    # est longue ; ensuite, le cache.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Les expositions éphémères de la semaine, comme sur le site ; on s'en passe si un
      # musée ne répond pas ou si le résultat ne se compile pas.
      # Toujours : l'application embarque toutes les œuvres, éphémères comprises.
      - name: Expositions éphémères
        run: |
          timeout 1500 python3 outils/ephemeres.py || echo "pas d'exposition éphémère cette fois"
          if ! cargo check --quiet --lib; then
            echo "::warning::les expositions éphémères ne se compilent pas : elles sont retirées"
            rm -f expositions/ephemere-*.toml
            rm -rf public/tableaux/ephemere-*
          fi

      - name: Installer wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$version" || { echo "wasm-bindgen absent de Cargo.lock"; exit 1; }
          curl -sSfL --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${version}/wasm-bindgen-${version}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin"
          wasm-bindgen --version

      # Le site exporté pour la racine de arteon://musee/, réduit à ce que lit l'application.
      - name: Préparer le musée embarqué
        run: ios/preparer-musee.sh

      # Les collections du monde : des dizaines de milliers d'œuvres du domaine public
      # (Chicago, Cleveland, le Met, Washington), fiches et vignettes. Le cache garde les
      # vignettes d'une fois sur l'autre et les fiches une semaine.
      - uses: actions/cache/restore@v4
        with:
          path: target/collections-cache
          key: collections-v1-${{ github.run_id }}
          restore-keys: collections-v1-

      # Au plus 25 minutes de fiches (les musées ralentissent les machines de GitHub) ; ce
      # qui manque sera pris au run suivant, grâce au cache.
      - name: Les collections du monde
        continue-on-error: true
        timeout-minutes: 240
        run: |
          python3 -c "import PIL" 2>/dev/null || python3 -m pip install --quiet pillow \
            || python3 -m pip install --quiet --break-system-packages pillow
          python3 outils/collections_monde.py --total 50000 --minutes 25 \
            --sortie ios/ARTEON.swiftpm/Musee/collections --cache target/collections-cache
          du -sh ios/ARTEON.swiftpm/Musee ios/ARTEON.swiftpm/Musee/collections

      # Le cache est gardé même si la moisson a été coupée.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: target/collections-cache
          key: collections-v1-${{ github.run_id }}

      # Le modèle (catalogue, index, jeu, musée embarqué) sous Linux, sur le vrai musée.
      - name: Tests du modèle (Swift)
        working-directory: ios
        run: |
          if command -v swift >/dev/null; then
            swift --version
            swift test
          else
            echo "::notice::Swift n'est pas installé sur cette image : les tests tournent sur le Mac."
          fi

      # Sur Nuage : l'app iOS n'embarque plus le musée, elle le lit là (puis le garde).
      # Seules les nouveautés partent. Il faut le secret NUAGE_TOKEN : un jeton
      # lecture-écriture de l'application arteon (console Nuage → arteon → Tokens).
      - name: Envoyer sur Nuage
        if: github.event_name != 'pull_request'
        env:
          NUAGE_TOKEN: ${{ secrets.NUAGE_TOKEN }}
        run: |
          if [ -z "$NUAGE_TOKEN" ]; then
            echo "::notice::Pas de secret NUAGE_TOKEN : le musée n'est pas envoyé sur Nuage (Settings → Secrets → Actions)."
            exit 0
          fi
          python3 outils/nuage_envoyer.py ios/ARTEON.swiftpm/Musee

      - uses: actions/upload-artifact@v4
        with:
          name: musee
          path: ios/ARTEON.swiftpm/Musee
          retention-days: 7
          if-no-files-found: error

  ios:
    name: Compiler, tester, capturer
    needs: musee
    # Un simulateur qui gèle la machine n'immobilise pas le run pendant des heures.
    timeout-minutes: 75
    permissions:
      contents: write
    # L'image Xcode 27 de GitHub (macOS 27, Apple Silicon).
    runs-on: xcode-27
    defaults:
      run:
        working-directory: ios
    env:
      # Le jeton Nuage en lecture seule, dans l'Info.plist de l'app (jamais dans le code).
      NUAGE_READ_TOKEN: ${{ secrets.NUAGE_READ_TOKEN }}
      KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      # L'app est 100 % hors ligne : le musée préparé par le job « musee » (catalogue,
      # images, galeries 3D, collections du monde) est embarqué dans l'application.
      - uses: actions/download-artifact@v4
        with:
          name: musee
          path: ios/ARTEON.swiftpm/Musee

      - name: Le musée embarqué est là
        run: |
          test -s ARTEON.swiftpm/Musee/catalogue.json
          test -s ARTEON.swiftpm/Musee/pkg/arteon_bg.wasm
          test -s ARTEON.swiftpm/Musee/collections/collections.json || echo "::warning::pas de collections du monde"
          du -sh ARTEON.swiftpm/Musee

      - name: Xcode 27.2
        run: |
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version

      - name: Le projet Xcode (XcodeGen)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec project.yml

      # Sur une branche, on compile seulement (les tests du modèle tournent déjà sous Linux,
      # dans le job « musee ») ; sur la branche par défaut, tous les tests sur le simulateur.
      - name: Compiler pour le simulateur
        if: ${{ !(github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch') }}
        run: |
          set -o pipefail
          xcodebuild build -project ARTEON.xcodeproj -scheme ARTEON \
            -destination "platform=iOS Simulator,name=$IPAD,OS=$IOS" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO NUAGE_READ_TOKEN="$NUAGE_READ_TOKEN" -quiet

      - name: Tests sur le simulateur iPad
        if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          # Le simulateur démarré d'avance : l'application (avec son musée de 200 Mo) s'y
          # installe avant que les tests ne cherchent à s'y connecter.
          xcrun simctl boot "$IPAD" 2>/dev/null || true
          xcrun simctl bootstatus "$IPAD" -b || true
          run_tests() {
            xcodebuild test -project ARTEON.xcodeproj -scheme ARTEON \
              -destination "platform=iOS Simulator,name=$IPAD,OS=$IOS" \
              -derivedDataPath build CODE_SIGNING_ALLOWED=NO NUAGE_READ_TOKEN="$NUAGE_READ_TOKEN" 2>&1 | tee "$RUNNER_TEMP/tests.log"
          }
          if ! run_tests; then
            # Un simulateur qui ne répond pas : on recommence une fois. Un vrai test en
            # échec, lui, fait échouer l'étape.
            if grep -q "establish communication with the test runner\|Channel disconnected" "$RUNNER_TEMP/tests.log"; then
              echo "::warning::le simulateur n'a pas répondu : nouvel essai"
              xcrun simctl shutdown all || true
              xcrun simctl boot "$IPAD" 2>/dev/null || true
              xcrun simctl bootstatus "$IPAD" -b || true
              run_tests
            else
              exit 1
            fi
          fi

      - name: Captures d'écran (iPad et iPhone)
        # Les captures ne bloquent jamais la suite (compilation, App Playground, TestFlight).
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -uo pipefail
          # Une commande qui ne rend pas la main est arrêtée au bout de $1 secondes.
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          app=build/Build/Products/Debug-iphonesimulator/ARTEON.app
          # Le simulateur demandé (son nom exact), ou le premier dont le nom commence ainsi.
          device() {
            xcrun simctl list devices available -j | WANT="$1" python3 -c "
          import json, os, sys
          d = json.load(sys.stdin)['devices']
          want = os.environ['WANT']
          found = [dev for runtime, devs in d.items()
                   if runtime.endswith('iOS-' + os.environ['IOS'].replace('.', '-'))
                   for dev in devs]
          exact = [dev for dev in found if dev['name'] == want]
          close = [dev for dev in found if dev['name'].startswith(want) and 'Pro' in dev['name']]
          pick = (exact or close or [dev for dev in found if dev['name'].startswith(want)] or [None])[0]
          if pick: print(pick['udid'])
          "
          }
          mkdir -p captures
          # -horsligne : l'application ne touche pas au réseau ; tout vient du musée embarqué.
          shoot() {
            echo "▶ $prefix-$name"
            limit 30 xcrun simctl terminate "$udid" com.maxlestage.arteon 2>/dev/null || true
            limit 60 xcrun simctl launch "$udid" com.maxlestage.arteon -horsligne "$@" || return 0
            sleep "${wait:-8}"
            limit 60 xcrun simctl io "$udid" screenshot "captures/$prefix-$name.png" || echo "capture $name impossible"
          }
          for prefix in ipad iphone; do
            if [ "$prefix" = ipad ]; then udid=$(device "$IPAD"); else udid=$(device "iPhone"); fi
            [ -n "$udid" ] || { echo "pas de simulateur $prefix"; continue; }
            limit 60 xcrun simctl boot "$udid" || true
            limit 240 xcrun simctl bootstatus "$udid" -b || true
            limit 180 xcrun simctl install "$udid" "$app" || continue
            name=01-accueil wait=12 shoot
            name=03-oeuvre shoot -ouvrir van-gogh/tournesols
            name=04-musees shoot -onglet musees
            name=05-musee-plan shoot -ouvrir musee:Rijksmuseum
            name=06-grand-musee shoot -ouvrir grand-musee
            if [ "$prefix" = ipad ]; then
              name=02-exposition shoot -ouvrir van-gogh
              name=07-artistes shoot -onglet artistes
              name=08-explorer shoot -onglet explorer
              name=09-chronologie shoot -ouvrir chronologie
              name=10-jeu shoot -ouvrir jeu
            fi
            name=12-collections shoot -ouvrir collections
            name=13-collection-met shoot -ouvrir collection:met
            limit 60 xcrun simctl shutdown "$udid" || true
          done
          ls -la captures

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures
          path: ios/captures
          if-no-files-found: ignore

      # Le dossier ARTEON.swiftpm seul, à télécharger sur l'iPad et à ouvrir dans Swift
      # Playgrounds (Actions → ce run → Artifacts → ARTEON-swift-playgrounds).
      - uses: actions/upload-artifact@v7
        with:
          name: ARTEON-swift-playgrounds
          path: |
            ios/ARTEON.swiftpm
            !ios/ARTEON.swiftpm/.swiftpm
          include-hidden-files: false

      # Sur la branche par défaut : l'App Playground complet (avec le musée) dans la release
      # « ipad », à une adresse fixe, à ouvrir sur l'iPad avec Swift Playgrounds.
      - name: Publier l'App Playground (release « ipad »)
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Un fichier de release ne dépasse pas 2 Go : l'App Playground part sans les images
          # en grand des collections (vignettes seulement) ; TestFlight a tout.
          zip -qry "$RUNNER_TEMP/ARTEON.swiftpm.zip" ARTEON.swiftpm -x 'ARTEON.swiftpm/.swiftpm/*' \
            -x 'ARTEON.swiftpm/Musee/collections/grandes-*'
          ls -la "$RUNNER_TEMP/ARTEON.swiftpm.zip"
          gh release view ipad >/dev/null 2>&1 || gh release create ipad --latest=false \
            --title "ARTEON pour iPad (Swift Playgrounds)" \
            --notes "Toucher ARTEON.swiftpm.zip sur l'iPad, l'ouvrir dans Fichiers, puis toucher ARTEON.swiftpm : Swift Playgrounds l'ouvre. ▶ lance le musée, entièrement hors ligne. Refait à chaque push sur la branche par défaut."
          gh release upload ipad "$RUNNER_TEMP/ARTEON.swiftpm.zip" --clobber

      - name: Compiler pour l'appareil (sans signature)
        if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          xcodebuild build -project ARTEON.xcodeproj -scheme ARTEON -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            NUAGE_READ_TOKEN="$NUAGE_READ_TOKEN"
          du -sh build/Build/Products/Release-iphoneos/ARTEON.app

      - name: L'App Playground (Swift Playgrounds)
        # Le même code, ouvert comme dans Swift Playgrounds : vérifie Package.swift.
        if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        working-directory: ios/ARTEON.swiftpm
        run: |
          set -o pipefail
          xcodebuild -list
          xcodebuild build -scheme ARTEON -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/playground" CODE_SIGNING_ALLOWED=NO

      - name: Signer et envoyer sur TestFlight
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.testflight) ||
          (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ] || [ -z "${KEY_ID:-}" ] || [ -z "${ISSUER_ID:-}" ] || [ -z "${TEAM_ID:-}" ]; then
            echo "::notice::TestFlight n'est pas réglé : ajoutez les secrets APP_STORE_CONNECT_KEY, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID et la variable APPLE_TEAM_ID (voir l'en-tête de ce workflow)."
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY" > "$key"
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")
          # L'archive signée par Xcode (signature automatique avec la clé d'API).
          xcodebuild archive -project ARTEON.xcodeproj -scheme ARTEON -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ARTEON.xcarchive" \
            "${auth[@]}" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            NUAGE_READ_TOKEN="$NUAGE_READ_TOKEN" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          # L'export envoie directement l'application à App Store Connect (TestFlight).
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ARTEON.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" "${auth[@]}"
          rm -f "$key"
          echo "### 📲 ARTEON (Swift) ${{ github.run_number }} envoyée sur TestFlight" >> "$GITHUB_STEP_SUMMARY"
