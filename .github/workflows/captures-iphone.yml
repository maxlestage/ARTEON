# Les captures d'écran de l'application sur iPhone, à part : elles reprennent le musée
# embarqué (collections comprises) d'un run du workflow « Application iOS (Swift) », sans
# le refaire, et ne touchent pas à ce run.
#
# Actions → Captures iPhone → Run workflow, avec le numéro d'un run d'ios.yml (dans son
# adresse : …/actions/runs/<numéro>).

name: Captures iPhone

on:
  push:
    paths:
      - ".github/workflows/captures-iphone.yml"
  workflow_dispatch:
    inputs:
      run:
        description: "Le run d'ios.yml dont reprendre le musée embarqué"
        required: true

permissions:
  contents: read
  actions: read

env:
  XCODE: /Applications/Xcode_27.2.app
  XCODEGEN_VERSION: "2.46.0"
  IOS: "27.2"
  # Le run d'ios.yml en cours au moment où ce workflow a été ajouté (les 50 000 œuvres).
  RUN: ${{ inputs.run || '43946450737' }}

jobs:
  iphone:
    name: Captures sur iPhone
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v7

      # Le musée embarqué arrive à la fin du job « musee » de ce run : on l'attend.
      - name: Attendre le musée embarqué
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            id=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN/artifacts" \
              --jq '.artifacts[] | select(.name == "musee") | .id' 2>/dev/null || true)
            if [ -n "$id" ]; then echo "musée embarqué : artefact $id"; exit 0; fi
            echo "pas encore là ($i)…"
            sleep 60
          done
          echo "::error::le musée embarqué du run $RUN n'est jamais arrivé"
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: musee
          path: ios/ARTEON.swiftpm/Musee
          run-id: ${{ env.RUN }}
          github-token: ${{ github.token }}

      - name: Xcode, XcodeGen, compilation pour le simulateur
        run: |
          set -o pipefail
          sudo xcode-select -s "$XCODE"
          du -sh ARTEON.swiftpm/Musee
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate --spec project.yml
          xcodebuild build -project ARTEON.xcodeproj -scheme ARTEON \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet

      - name: Captures d'écran (iPhone)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set -uo pipefail
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          app=build/Build/Products/Debug-iphonesimulator/ARTEON.app
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          d = json.load(sys.stdin)['devices']
          found = [dev for runtime, devs in d.items()
                   if runtime.endswith('iOS-' + os.environ['IOS'].replace('.', '-'))
                   for dev in devs if dev['name'].startswith('iPhone')]
          pro = [dev for dev in found if 'Pro' in dev['name'] and 'Max' not in dev['name']]
          pick = (pro or found or [None])[0]
          if pick: print(pick['udid']); print(pick['name'], file=sys.stderr)
          ")
          test -n "$udid"
          limit 60 xcrun simctl boot "$udid" || true
          limit 240 xcrun simctl bootstatus "$udid" -b || true
          limit 240 xcrun simctl install "$udid" "$app"
          mkdir -p captures
          shoot() {
            echo "▶ $name"
            limit 30 xcrun simctl terminate "$udid" com.maxlestage.arteon 2>/dev/null || true
            limit 60 xcrun simctl launch "$udid" com.maxlestage.arteon -horsligne "$@" || return 0
            sleep "${wait:-10}"
            limit 60 xcrun simctl io "$udid" screenshot "captures/iphone-$name.png" || echo "capture $name impossible"
          }
          name=01-accueil wait=15 shoot
          name=02-exposition shoot -ouvrir van-gogh
          name=03-oeuvre shoot -ouvrir van-gogh/tournesols
          name=04-musees shoot -onglet musees
          name=05-musee-plan shoot -ouvrir musee:Rijksmuseum
          name=06-grand-musee shoot -ouvrir grand-musee
          name=07-artistes shoot -onglet artistes
          name=08-explorer shoot -onglet explorer
          name=09-jeu shoot -ouvrir jeu
          name=10-collections wait=14 shoot -ouvrir collections
          name=11-collection-met wait=14 shoot -ouvrir collection:met
          ls -la captures

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: captures-iphone
          path: ios/captures
          if-no-files-found: ignore
