[exposition]
ordre = 45
nom_court = "Armes et armures"
mouvement = "Armes et armures"
cadre = "vitrine"
couleur = "#6a3b22"
titre = "Armes et armures, l'art de la guerre"
artiste = "Greenwich, Paris, Bourgogne, Japon, Empire ottoman, Inde…"
dates = "VIIᵉ siècle av. J.-C. – 1819"
accroche = "Exposition virtuelle · Metropolitan Museum of Art, New York"
introduction = """
Une armure, un casque, un sabre sont des outils de guerre, mais aussi des œuvres \
d'orfèvres, de ciseleurs, de laqueurs et de peintres, faites pour protéger, \
impressionner et dire le rang de celui qui les porte. La visite réunit dix objets, du \
casque d'un hoplite grec aux pistolets d'ivoire de Catherine II, en passant par le roi \
anglo-saxon de Sutton Hoo, les samouraïs, les ducs de Bourgogne, les rois de France et \
d'Angleterre, les Ottomans et l'Inde. Le bâtiment s'inspire des galeries des armes et \
armures du Metropolitan Museum of Art de New York : une grande cour haute où se \
dressent deux armures royales, d'où l'on gagne quatre galeries. Les objets y sont \
présentés en vitrine."""
vitrine = "armure-henri-ii.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Metropolitan Museum of Art"
ville = "New York, États-Unis"
construction = "Fondé en 1870 ; installé sur la Cinquième Avenue en 1880"
presentation = """
Fondé en 1870 par un groupe de citoyens new-yorkais qui voulaient doter leur ville d'un \
grand musée d'art, le Metropolitan Museum of Art s'installe en 1880 dans un bâtiment de \
brique dessiné par Calvert Vaux et Jacob Wrey Mould, en bordure de Central Park. \
Agrandi sans cesse, il reçoit en 1902 sa grande façade de style Beaux-Arts sur la \
Cinquième Avenue, due à Richard Morris Hunt. Les armes et armures y ont un département \
propre depuis 1912, sous la conduite de Bashford Dean, zoologiste passionné d'armures \
japonaises. La collection s'enrichit de l'achat de la collection du duc de Dino en \
1904, puis du legs de l'ingénieur George Cameron Stone, en 1935, riche en armes d'Asie \
et du monde islamique. Au rez-de-chaussée, une grande cour réunit des armures équestres \
européennes, cavaliers et chevaux bardés d'acier ; autour, des galeries sont consacrées \
à l'Europe, au Japon, au monde islamique et aux armes à feu."""
ici = """
Le bâtiment d'ARTEON reprend l'idée de la cour du Met, d'où rayonnent les galeries. On \
entre par le sud dans « La cour des armures », large de vingt mètres et haute de onze, \
aux murs couleur de pierre, où se font face deux armures royales, française et \
anglaise. À l'ouest s'ouvre « Casques de héros », consacrée à la Grèce et au roi de \
Sutton Hoo ; à l'est, « Le Japon des samouraïs ». Au nord, « Le bouclier et le \
pistolet » réunit un pavois bourguignon et les pistolets de Catherine II, puis mène à \
la dernière salle, « D'Istanbul à Lucknow »."""

