# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Armuriers de la cour de France"
vie = "Paris, milieu du XVIᵉ siècle"
biographie = """
Sous François Iᵉʳ et Henri II, la cour de France veut rivaliser avec l'Italie et avec \
l'empereur Charles Quint jusque dans les armures. Les rois font travailler des \
armuriers installés à Paris, parfois venus d'Italie ou d'Allemagne, et les associent \
aux artistes de la cour. Le décor des armures de parade naît alors sur le papier : \
orfèvres, graveurs et peintres dessinent des projets complets, plastron, épaulières, \
casque, bouclier, que les armuriers et les ciseleurs traduisent ensuite dans l'acier. \
Parmi ces dessinateurs, on cite l'orfèvre et graveur Étienne Delaune (1518 ou 1519 – \
1583), qui travailla pour la Monnaie royale, le peintre Jean Cousin l'Ancien et \
l'enlumineur Baptiste Pellerin. Plusieurs armures et boucliers de ce groupe sont \
parvenus jusqu'à nous et sont conservés au Louvre, au musée de l'Armée, à Vienne ou à \
New York ; leurs dessins préparatoires, dispersés dans plusieurs musées d'Europe et \
d'Amérique, permettent de suivre le passage du projet à l'objet. Les guerres de \
Religion, à partir de 1562, ralentissent cette production somptueuse sans l'interrompre \
tout à fait."""
style = """
Les armures de la cour de France se reconnaissent à leur décor couvrant, en faible \
relief, où se mêlent figures mythologiques, trophées, rinceaux et grotesques, dans \
l'esprit de l'école de Fontainebleau. L'or, l'argent et l'acier bleui y jouent comme \
les couleurs d'une peinture. Ces armures font de l'acier un support d'images, au même \
titre que l'émail ou la tapisserie, et ont été admirées et imitées dans toute l'Europe."""

[[artistes]]
nom = "Ateliers royaux de Greenwich"
vie = "Greenwich, près de Londres, vers 1515 – milieu du XVIIᵉ siècle"
biographie = """
Le jeune Henri VIII, couronné en 1509, veut des armures dignes des plus grands princes, \
alors fournies par les ateliers de Milan, d'Augsbourg ou de Nuremberg. Vers 1515, il \
installe dans son palais de Greenwich, sur la Tamise, un atelier d'armuriers venus \
d'Allemagne, qu'on appelle les « Almains ». L'atelier travaille d'abord pour le roi \
lui-même, puis, sous Élisabeth Iʳᵉ, pour les grands seigneurs de la cour, qui \
obtiennent la permission de s'y fournir. Le maître armurier Jacob Halder le dirige à la \
fin du XVIᵉ siècle ; un album de dessins réalisé à cette époque, conservé au Victoria \
and Albert Museum, montre une trentaine de garnitures commandées par des courtisans. \
L'atelier décline au XVIIᵉ siècle, quand l'armure perd son utilité sur les champs de \
bataille, et disparaît avec la guerre civile anglaise. Ses armures sont aujourd'hui \
conservées notamment aux Royal Armouries, à Londres et à Leeds, dans la collection \
royale et au Metropolitan Museum."""
style = """
Les armures de Greenwich associent des formes amples et nettes, héritées des modèles \
allemands, à des décors gravés à l'eau-forte et dorés, disposés en bandes sur un acier \
souvent bleui ou noirci. Elles sont souvent livrées en garnitures, avec des pièces de \
rechange pour la guerre et les différents jeux du tournoi. Leur élégance sobre en a \
fait le symbole de la chevalerie élisabéthaine."""

[[artistes]]
nom = "Pays-Bas bourguignons"
vie = "États des ducs de Bourgogne, de Dijon à Bruges, 1363–1477"
biographie = """
En 1363, le roi Jean II le Bon donne le duché de Bourgogne à son fils Philippe le \
Hardi. Par mariages, héritages et conquêtes, ses descendants, Jean sans Peur, Philippe \
le Bon et Charles le Téméraire, réunissent un ensemble immense : la Bourgogne et la \
Franche-Comté, mais surtout les riches provinces des Pays-Bas, la Flandre, l'Artois, le \
Brabant, la Hollande. Leur cour, le plus souvent à Bruxelles, Bruges ou Lille, est \
l'une des plus brillantes d'Europe : on y voit Jan van Eyck, Rogier van der Weyden, les \
tapissiers d'Arras et de Tournai, les orfèvres et les enlumineurs. En 1430, Philippe le \
Bon fonde l'ordre de la Toison d'or. Son fils Charles le Téméraire, duc en 1467, \
cherche à relier ses territoires et à obtenir une couronne royale ; il se heurte aux \
villes rhénanes, aux Suisses et au roi Louis XI. Battu à Grandson et à Morat en 1476, \
il est tué devant Nancy le 5 janvier 1477. Les Pays-Bas passent alors aux Habsbourg par \
le mariage de sa fille Marie avec Maximilien d'Autriche."""
style = """
L'art bourguignon associe luxe et emblèmes. Les ducs multiplient les signes de \
reconnaissance, croix de saint André, briquets et étincelles, devises et couleurs de \
livrée, peints sur les étendards, les tentes, les vêtements de leurs gens et les armes \
de leurs soldats. Le même goût du faste et de la précision anime la peinture des \
primitifs flamands, la tapisserie et l'orfèvrerie de leur cour."""

[[artistes]]
nom = "Russie, armuriers de la cour impériale"
vie = "Saint-Pétersbourg et Toula, XVIIIᵉ siècle"
biographie = """
Au début du XVIIIᵉ siècle, Pierre le Grand dote la Russie d'une industrie d'armement \
moderne, autour de la manufacture d'armes de Toula, fondée en 1712, et de celle de \
Sestroretsk, près de Saint-Pétersbourg. À côté des fusils de l'armée, ces ateliers et \
ceux de la capitale produisent des armes de luxe pour la cour : fusils et pistolets de \
chasse, armes de présent, garnitures assorties. Certains armuriers viennent d'Allemagne \
ou d'autres pays d'Europe, et tous travaillent dans le goût des cours européennes, \
rocaille puis néoclassique. Johan Adolph Grecke, auteur des pistolets exposés ici, est \
l'un de ces artisans : armurier de la cour à Saint-Pétersbourg, il est connu par des \
œuvres et des documents de 1755 à 1790. Sous Catherine II, impératrice de 1762 à 1796, \
ces armes servent aux chasses de la cour et surtout aux cadeaux : on les offre à des \
souverains, à des ambassadeurs, à des favoris. Le musée de l'Ermitage et l'Armurerie du \
Kremlin en conservent aujourd'hui des ensembles importants."""
style = """
Les armes de luxe russes du XVIIIᵉ siècle rivalisent avec celles de Paris et de Londres \
par la qualité de leurs mécanismes, mais s'en distinguent par la richesse des \
matériaux : ivoire, acier bleui et doré, nacre, ciselures d'or et d'argent. Elles \
reprennent les formes et les ornements à la mode en Europe, rocailles puis motifs \
antiques, avec un goût marqué pour le faste."""

[[artistes]]
nom = "Grèce archaïque"
vie = "Monde grec, vers 800–480 av. J.-C."
biographie = """
On appelle époque archaïque les trois siècles qui précèdent les guerres médiques. Les \
Grecs, répartis en centaines de cités indépendantes, fondent des colonies tout autour \
de la Méditerranée et de la mer Noire, adoptent l'alphabet et voient naître les poèmes \
d'Homère et d'Hésiode. Dans les cités apparaît une nouvelle manière de combattre : la \
phalange des hoplites, fantassins lourdement armés, rangés en lignes serrées, chacun \
protégé par un grand bouclier rond, une cuirasse, des jambières et un casque de bronze. \
Ces soldats sont des citoyens assez aisés pour payer leur équipement, et leur rôle \
militaire va de pair avec leur place dans la vie de la cité. Corinthe, cité commerçante \
sur l'isthme qui relie le Péloponnèse au reste de la Grèce, est alors l'un des grands \
centres d'art et d'artisanat, réputée pour ses vases peints et ses bronzes. Les grands \
sanctuaires, Olympie, Delphes, reçoivent en offrande des armes par milliers. L'époque \
s'achève avec les victoires grecques sur les Perses à Marathon, en 490, et à Salamine, \
en 480 av. J.-C."""
style = """
L'art archaïque aime les formes nettes, les contours tendus et la stylisation : kouroi \
au sourire figé, vases à figures noires, bronzes aux surfaces lisses. Les armuriers \
partagent ce goût pour des formes simples et puissantes, où la beauté naît de \
l'adaptation à la fonction. Le casque corinthien, avec ses courbes enveloppantes et ses \
ouvertures en amande, en est l'un des exemples les plus accomplis."""

[[artistes]]
nom = "Royaume d'Est-Anglie"
vie = "Est de l'Angleterre (Norfolk et Suffolk), VIᵉ–IXᵉ siècle"
biographie = """
Après le départ des Romains de Bretagne, au début du Vᵉ siècle, des peuples venus des \
rivages de la mer du Nord, Angles, Saxons et Jutes, s'installent dans l'est de l'île. \
Au VIᵉ siècle se forment plusieurs royaumes, dont celui des Angles de l'Est, \
l'Est-Anglie, qui correspond à peu près aux actuels comtés de Norfolk et de Suffolk. Sa \
dynastie connaît son apogée sous Rædwald, mort vers 624, que l'historien Bède le \
Vénérable compte parmi les rois qui exercèrent une suprématie sur les autres royaumes \
anglais. Rædwald se fit baptiser mais garda, selon Bède, un autel pour les anciens \
dieux à côté de celui du Christ. La cour royale entretient des liens avec la \
Scandinavie, le monde franc et jusqu'à Byzance, comme le montrent les objets de Sutton \
Hoo. L'Est-Anglie se convertit au christianisme au cours du VIIᵉ siècle. Au IXᵉ siècle, \
elle est conquise par les Vikings, qui tuent en 869 le roi Edmond, honoré ensuite comme \
saint."""
style = """
L'art des Anglo-Saxons païens est un art d'orfèvres : boucles, fermoirs, fibules et \
armes sont couverts d'entrelacs d'animaux stylisés et de cloisonnés d'or et de grenats. \
Les figures humaines et animales se décomposent en motifs qui s'enroulent et \
s'imbriquent, à déchiffrer de près. Cet art, partagé avec la Scandinavie, nourrira plus \
tard les enluminures des manuscrits chrétiens d'Irlande et de Northumbrie."""

[[artistes]]
nom = "Japon, époque de Kamakura"
vie = "Japon, 1185–1333"
biographie = """
En 1185, au terme de la guerre de Genpei entre les clans Taira et Minamoto, Minamoto no \
Yoritomo l'emporte et installe son gouvernement militaire à Kamakura, loin de la cour \
impériale de Kyoto ; il reçoit en 1192 le titre de shogun. Pour la première fois, les \
guerriers, les bushi ou samouraïs, gouvernent le pays aux côtés de l'empereur, dont le \
rôle devient surtout religieux et symbolique. Après la mort de Yoritomo, le pouvoir \
passe à la famille Hōjō, régents du shogunat. Le Japon repousse en 1274 et en 1281 deux \
tentatives d'invasion mongole, au prix d'un lourd effort militaire. Mécontentements et \
dettes affaiblissent ensuite le régime. En 1333, l'empereur Go-Daigo, aidé de guerriers \
ralliés comme Ashikaga Takauji et Nitta Yoshisada, renverse le shogunat de Kamakura. \
L'époque voit aussi l'essor du bouddhisme zen et des écoles de la Terre pure, d'une \
sculpture réaliste et des grands récits guerriers comme le Dit des Heike."""
style = """
L'art de Kamakura est marqué par le goût des guerriers pour le vigoureux et le vrai : \
sculptures d'Unkei aux muscles tendus, rouleaux peints racontant les batailles, \
portraits sans flatterie. Les armuriers produisent alors les grandes armures ō-yoroi \
aux laçages colorés, et les forgerons des lames tenues pour les plus belles de \
l'histoire du sabre japonais, comme celles de Masamune."""

[[artistes]]
nom = "Japon, époque d'Edo"
vie = "Japon, 1603–1868"
biographie = """
En 1603, Tokugawa Ieyasu, vainqueur à Sekigahara trois ans plus tôt, reçoit le titre de \
shogun et installe son gouvernement à Edo, l'actuelle Tokyo. Ses descendants gouvernent \
le Japon pendant plus de deux siècles et demi. Le pays se ferme presque entièrement aux \
étrangers, les guerres intérieures cessent, et la société est divisée en ordres : \
guerriers, paysans, artisans et marchands. Les samouraïs, qui ne combattent plus guère, \
deviennent des administrateurs au service du shogun et des daimyos, seigneurs des \
provinces ; le port des deux sabres reste leur privilège et leur signe distinctif. La \
paix favorise l'essor des villes, Edo, Osaka, Kyoto, et d'une culture urbaine \
brillante : théâtre kabuki, estampes, poésie, arts décoratifs. Les artisans du sabre, \
forgerons, polisseurs, laqueurs et ciseleurs de montures, travaillent alors autant pour \
l'apparat que pour l'usage. En 1868, la restauration de Meiji rend le pouvoir à \
l'empereur ; en 1876, le port du sabre est interdit, et les samouraïs disparaissent en \
tant que classe."""
style = """
Les armes de l'époque d'Edo associent la tradition des lames anciennes, conservées et \
remontées, au raffinement des montures, véritables bijoux de métal. Ciseleurs et \
laqueurs rivalisent d'invention dans les gardes, les petites pièces de poignée et les \
fourreaux, tantôt sobres, tantôt couverts de paysages ou d'animaux. Chaque détail du \
sabre devient un objet de collection."""

[[artistes]]
nom = "Empire ottoman"
vie = "Anatolie, Balkans et Proche-Orient, vers 1300–1922"
biographie = """
Vers 1300, un chef turc nommé Osman fonde dans le nord-ouest de l'Anatolie une petite \
principauté, aux confins de l'Empire byzantin. Ses descendants, les Ottomans, \
s'étendent dans les Balkans et en Asie Mineure ; en 1453, le sultan Mehmed II prend \
Constantinople, qui devient Istanbul, capitale de l'empire. Au XVIᵉ siècle, Sélim Iᵉʳ \
conquiert la Syrie et l'Égypte, et Soliman le Magnifique pousse jusqu'à Bagdad, Buda et \
les portes de Vienne. L'armée ottomane, avec ses janissaires, son artillerie et sa \
cavalerie, est alors l'une des plus puissantes du monde. Les ateliers impériaux \
d'Istanbul réunissent des artisans venus de tout l'empire et des pays conquis, \
notamment d'Iran et du Caucase, et produisent armes, armures, céramiques, tissus et \
manuscrits pour le palais. Affaibli à partir du XVIIIᵉ siècle face à l'Autriche et à la \
Russie, l'empire survit jusqu'à la Première Guerre mondiale ; il disparaît en 1922, et \
la République de Turquie est proclamée l'année suivante."""
style = """
L'art ottoman des armes mêle la puissance des formes, héritée des Turkmènes et de \
l'Iran, à un décor précieux : dorure, incrustations d'argent, calligraphies, rinceaux \
floraux et, plus tard, pierres précieuses. Les inscriptions, prières, versets ou titres \
du sultan, sont un élément essentiel de ce décor. L'arme devient ainsi un objet de \
prestige et de piété autant qu'un outil de guerre."""

[[artistes]]
nom = "Inde du Nord, Lucknow"
vie = "Lucknow, royaume d'Awadh (nord de l'Inde), XVIIIᵉ–XIXᵉ siècle"
biographie = """
Au XVIIIᵉ siècle, l'Empire moghol, qui dominait la plus grande partie de l'Inde depuis \
le XVIᵉ siècle, se morcelle. Ses gouverneurs de province deviennent des princes presque \
indépendants : c'est le cas des nawabs d'Awadh, dans la riche plaine du Gange. En 1775, \
le nawab Asaf-ud-Daula fait de Lucknow sa capitale ; il y bâtit le Bara Imambara et \
attire poètes, musiciens, architectes et artisans venus de Delhi, alors en déclin. La \
ville devient l'un des grands foyers de la culture indo-persane : poésie en ourdou, \
musique, danse kathak, cuisine raffinée, orfèvrerie et émaillerie. Les nawabs \
entretiennent des relations étroites, et de plus en plus inégales, avec la Compagnie \
anglaise des Indes orientales. En 1818-1819, Ghazi-ud-Din Haidar prend le titre de roi, \
rompant symboliquement avec l'empereur moghol. En 1856, les Britanniques annexent \
l'Awadh ; l'année suivante, Lucknow est l'un des foyers de la grande révolte de 1857."""
style = """
Les ateliers de Lucknow sont réputés pour leurs émaux sur argent, aux bleus et aux \
verts transparents, souvent ornés d'oiseaux, de poissons et de fleurs. Les armes de \
luxe associent des lames anciennes, persanes ou indiennes, à des montures neuves \
d'ivoire, de jade, d'argent émaillé ou d'or. Ces sabres d'apparat disent le raffinement \
d'une cour où l'arme était d'abord un insigne de rang."""
