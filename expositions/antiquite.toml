# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « ANTIQUITÉ » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/antiquite/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /antiquite.
#
#  Les objets sont présentés en vitrine (cadre = "vitrine") ; les peintures et
#  les reliefs ont leur propre cadre. Les photographies viennent des musées
#  (Metropolitan Museum of Art, en CC0) et du British Museum (domaine public).
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 5
nom_court = "Antiquité"
mouvement = "Antiquité : Égypte, Orient, Grèce, Rome"
cadre = "vitrine"
couleur = "#8a5416"
titre = "L'Antiquité, des bords du Nil à la baie de Naples"
artiste = "Égypte, Sumer, Assyrie, Grèce, Rome…"
dates = "vers 2090 av. J.-C. – 120 apr. J.-C."
accroche = "Exposition virtuelle · British Museum, Londres"
introduction = """
Deux mille ans d'art autour de la Méditerranée et du Proche-Orient : un hippopotame \
de faïence bleue et un Livre des morts égyptiens, un prince sumérien en prière et un \
génie ailé du palais de Nimroud, des vases grecs à figures noires et rouges, une \
danseuse de bronze, une fresque peinte près de Pompéi, un pichet de verre signé et un \
portrait du Fayoum. Ces dix objets, faits par des artisans le plus souvent anonymes, \
racontent la mort et l'au-delà, le pouvoir des rois, la musique et les fêtes. Le \
bâtiment s'inspire du British Museum à Londres : on franchit un portique, puis on \
débouche dans une vaste cour couverte, la Great Court, sur laquelle s'ouvrent les \
galeries de l'Égypte, de la Grèce et de Rome."""
vitrine = "hippopotame-william.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "British Museum"
ville = "Londres, Royaume-Uni"
architecte = "Robert Smirke ; Foster + Partners pour la Great Court"
construction = "1823–1852 ; Great Court ouverte en 2000"
presentation = """
Le British Museum naît en 1753, par une loi du Parlement, des collections léguées \
par le médecin Hans Sloane, et ouvre en 1759 dans un hôtel particulier du quartier \
de Bloomsbury. Les acquisitions affluent, de la pierre de Rosette aux sculptures du \
Parthénon : à partir de 1823, l'architecte Robert Smirke élève un vaste quadrilatère \
de style néo-grec, dont la façade sud aligne une colonnade ionique, autour d'une \
cour intérieure. En 1857, son frère Sydney y construit la salle de lecture ronde, \
sous une coupole, bientôt entourée de magasins de livres. Après le départ de la \
British Library, l'agence de Norman Foster dégage la cour et la couvre d'une \
verrière de plus de trois mille vitres triangulaires : la Great Court, ouverte en \
2000, est présentée comme la plus grande place couverte d'Europe. Tout autour, les \
galeries égyptiennes, assyriennes, grecques et romaines comptent parmi les plus \
riches du monde, et l'entrée est gratuite."""
ici = """
Le bâtiment d'ARTEON reprend l'enchaînement du British Museum : un portique, puis une \
grande cour couverte d'où partent les galeries. On entre par le sud dans le Portique, \
aux murs de pierre claire, puis dans la Great Court, carrée, haute de seize mètres, où \
attendent les reliefs de l'Orient. À l'ouest, la Galerie égyptienne, longue de \
vingt-quatre mètres et couleur de sable ; au nord, la Salle grecque, aux murs ocre \
rose ; à l'est, la Salle romaine, d'un rouge pompéien adouci."""

