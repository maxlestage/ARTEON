[exposition]
ordre = 20
nom_court = "Renaissance"
mouvement = "Renaissance italienne"
couleur = "#7a2e2e"
titre = "La Renaissance italienne, l'invention de l'homme"
artiste = "Botticelli, Léonard, Raphaël, Michel-Ange, Titien…"
dates = "1460–1538"
accroche = "Exposition virtuelle · Galerie des Offices, Florence"
introduction = """
Au XVe siècle, Florence redécouvre l'Antiquité, invente la perspective et place \
l'homme au centre du tableau ; un siècle plus tard, Rome et Venise portent cette \
révolution à son sommet. De Filippo Lippi à Titien, dix peintures racontent ce \
passage, des madones du Quattrocento aux nus vénitiens. Le bâtiment s'inspire de la \
Galerie des Offices de Vasari : un long corridor en U bordé de salles, la salle \
Botticelli, la Tribune octogonale des Médicis et le petit corridor qui longe l'Arno."""
vitrine = "naissance-de-venus.jpg"

