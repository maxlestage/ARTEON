Les grenats démantoïdes, d'un vert vif et brillant, venaient alors des monts Oural, en \
Russie. La résille des boules de pissenlit, avec ses grains d'émail, suppose un travail \
patient, entièrement fait à la main. L'ensemble mêle les savoir-faire de l'orfèvre, du \
