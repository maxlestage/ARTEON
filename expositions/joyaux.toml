# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Égypte, Moyen Empire"
vie = "Vallée du Nil, vers 2030–1650 av. J.-C."
biographie = """
Le Moyen Empire commence lorsque le roi thébain Montouhotep II réunifie l'Égypte, \
divisée depuis la fin de l'Ancien Empire, vers 2030 avant notre ère. Sous la XIIᵉ \
dynastie, celle des Amenemhat et des Sésostris, le pays connaît deux siècles de \
stabilité et de prospérité. Les rois installent leur capitale près de l'entrée du \
Fayoum, une vaste dépression fertile qu'ils mettent en valeur par de grands travaux, et \
se font enterrer dans des pyramides de brique crue, à Licht, à Illahoun, à Dahchour ou \
à Hawara. L'Égypte étend son autorité sur la Nubie, riche en or, et commerce avec le \
Levant. Les orfèvres des ateliers royaux maîtrisent la soudure, le filigrane, la \
granulation et l'incrustation de pierres dures. Les plus beaux bijoux de l'époque ont \
été retrouvés dans les tombes de princesses, à Dahchour en 1894 et 1895 par Jacques de \
Morgan, et à Illahoun en 1914. Plus tard, les Égyptiens eux-mêmes considéreront le \
Moyen Empire comme l'âge classique de leur langue et de leur littérature."""
style = """
La joaillerie du Moyen Empire est d'une élégance et d'une précision rarement égalées. \
Elle repose sur un vocabulaire de signes hiéroglyphiques, faucons, scarabées, \
cartouches, signes de vie, qui font de chaque bijou une amulette et une phrase. Les \
couleurs ont un sens : le rouge de la cornaline, le bleu du lapis-lazuli, le vert-bleu \
de la turquoise. Le cloisonné aux pierres découpées une à une, sans émail, en est la \
grande spécialité."""

[[artistes]]
nom = "Rome impériale"
vie = "Rome et l'Empire romain, Iᵉʳ siècle av. J.-C. – IIIᵉ siècle apr. J.-C."
biographie = """
L'art de la pierre gravée vient de la Grèce et de l'Orient hellénistique, où les rois \
faisaient graver leur portrait sur des gemmes. À Rome, il connaît son apogée sous \
Auguste, premier empereur, de 27 avant J.-C. à 14 après J.-C., et sous ses successeurs \
de la dynastie julio-claudienne. Les meilleurs graveurs, souvent grecs, comme \
Dioscouride, qui grava le sceau d'Auguste, travaillent pour la famille impériale et \
signent parfois leurs œuvres. Ils produisent deux sortes d'objets : les intailles, \
gravées en creux pour servir de sceaux, et les camées, sculptés en relief dans des \
pierres à couches. Les grands camées impériaux, offerts à des proches ou à des alliés, \
sont de véritables tableaux politiques : la Gemma Augustea, conservée à Vienne, montre \
Auguste trônant auprès de la déesse Rome, et le Grand Camée de France, à la \
Bibliothèque nationale, la famille impériale sous Tibère. Au Moyen Âge, de nombreux \
camées antiques furent sertis sur des croix, des reliquaires et des couronnes ; à la \
Renaissance, les princes et les papes les collectionnèrent avec passion."""
style = """
Le camée romain associe la virtuosité technique à la propagande. Le graveur exploite \
les couches de la pierre comme un peintre ses couleurs : figure blanche sur fond \
sombre, parfois une troisième couche pour un détail. Les portraits, idéalisés et \
sereins, s'inspirent de la sculpture grecque classique ; les attributs divins, égide, \
couronne de laurier, transforment l'empereur en héros ou en dieu. Ce langage a inspiré \
les camées de la Renaissance et ceux de l'époque napoléonienne."""

[[artistes]]
nom = "Basse-Saxe, orfèvrerie du XIᵉ siècle"
vie = "Saxe (nord de l'Allemagne actuelle), XIᵉ siècle"
biographie = """
Au XIᵉ siècle, la Saxe est l'une des régions les plus riches du Saint-Empire romain \
germanique. Les empereurs de la dynastie ottonienne en étaient issus, et les mines \
d'argent du Harz, exploitées depuis la fin du Xᵉ siècle, nourrissent une activité \
artistique intense autour des grands sièges épiscopaux et des abbayes : Hildesheim, \
Magdebourg, Essen, Brunswick. L'évêque Bernward de Hildesheim, mort en 1022, fait \
fondre des portes de bronze et commande croix et chandeliers d'orfèvrerie. Les \
orfèvres, laïcs ou moines, travaillent pour les évêques et pour les grandes familles \
nobles, qui offrent aux églises des autels, des croix et des reliquaires afin d'assurer \
leur salut et d'affirmer leur rang. À Brunswick, la famille des comtes Brunon, puis les \
Guelfes, ducs de Saxe et de Bavière, enrichissent pendant des siècles le trésor de \
l'église Saint-Blaise, que le plus célèbre d'entre eux, Henri le Lion, fait \
reconstruire au XIIᵉ siècle. Ce trésor des Guelfes, riche d'autels portatifs, de croix \
et de bras-reliquaires, est aujourd'hui partagé entre Berlin, Cleveland et d'autres \
musées."""
style = """
L'orfèvrerie saxonne du XIᵉ siècle hérite du luxe ottonien : or, gemmes en cabochon, \
perles, émail cloisonné et nielle composent des surfaces éclatantes où la matière \
précieuse elle-même est une image de la lumière divine. Les figures, en repoussé, sont \
alignées sous des arcades, dans des poses frontales et solennelles. Cette rigueur \
annonce l'art roman, dont l'orfèvrerie des vallées de la Meuse et du Rhin sera, au \
siècle suivant, le grand foyer."""

[[artistes]]
nom = "Limoges, ateliers d'émaillerie"
vie = "Limoges (Limousin), XIIᵉ–XIVᵉ siècle"
biographie = """
Vers le milieu du XIIᵉ siècle, des ateliers d'émailleurs se développent à Limoges, \
ville de pèlerinage active autour de l'abbaye Saint-Martial. Ils ne travaillent pas \
l'or, mais le cuivre, plus économique, qu'ils couvrent d'émail et de dorure. Leur \
production, abondante et de qualité constante, conquiert toute l'Europe chrétienne : on \
la désigne sous le nom latin d'opus lemovicense, l'œuvre de Limoges. Les ateliers \
fabriquent des châsses, des croix, des crosses d'évêques, des ciboires, des \
chandeliers, des plaques de reliure et même des effigies funéraires. On en trouvait en \
Italie, en Espagne, en Angleterre et en Scandinavie. Les artisans restent presque tous \
anonymes ; quelques noms apparaissent parfois, comme celui d'Alpais, qui signe un \
célèbre ciboire conservé au Louvre. La production décline au XIVᵉ siècle, pendant la \
guerre de Cent Ans. Limoges retrouve la gloire à la fin du XVᵉ siècle avec une \
technique nouvelle, l'émail peint, que Léonard Limosin illustrera au siècle suivant."""
style = """
L'émail de Limoges se reconnaît à sa palette dominée par le bleu, du lapis au bleu \
clair, relevé de vert, de jaune, de rouge et de blanc, sur le fond doré du cuivre gravé \
de rinceaux. Les figures, au dessin clair et ferme, s'inscrivent sous des arcades ou \
dans des médaillons. Cette production en série, aux modèles répétés, n'empêche pas \
l'éclat : elle a mis la splendeur de l'orfèvrerie à la portée d'innombrables églises."""

[[artistes]]
nom = "Allemagne, orfèvres de la Renaissance"
vie = "Saint-Empire romain germanique (Nuremberg, Augsbourg, Munich…), XVIᵉ siècle"
biographie = """
Au XVIᵉ siècle, les villes libres d'Allemagne du Sud, enrichies par le commerce et les \
mines d'argent, deviennent de grands centres de l'orfèvrerie européenne. À Nuremberg et \
à Augsbourg, des centaines de maîtres, réunis en corporations strictes, doivent \
produire un chef-d'œuvre pour être admis et poinçonner leurs ouvrages. Le plus célèbre, \
Wenzel Jamnitzer, travaille pour quatre empereurs successifs. Les princes, comme les \
ducs de Bavière à Munich, les électeurs de Saxe à Dresde ou l'archiduc Ferdinand II au \
château d'Ambras, réunissent dans leurs cabinets de curiosités des coupes, des \
automates et des bijoux. Les formes de la Renaissance italienne, colonnes, frontons, \
grotesques, arrivent dans les ateliers par les gravures : des ornemanistes comme Virgil \
Solis, à Nuremberg, ou Erasmus Hornick publient des modèles de pendentifs que les \
orfèvres copient et combinent. Les portraits peints par Holbein ou Cranach montrent ces \
bijoux portés sur la poitrine, aux chapeaux ou aux manches. Fondus, transformés ou \
remontés au gré des modes et des besoins d'argent, ils ne nous sont parvenus qu'en \
petit nombre."""
style = """
Le bijou de la Renaissance allemande est une petite sculpture : figures en ronde-bosse \
émaillées de blanc, architectures miniatures, monstres marins et grotesques. L'émail \
aux couleurs vives, blanc, rouge, vert, bleu, couvre l'or ciselé, et les pierres, \
taillées en table ou en cabochon, sont accompagnées de perles, souvent irrégulières et \
pendantes. L'effet recherché est l'abondance et la surprise, à regarder de près, comme \
les objets des cabinets de curiosités."""

[[artistes]]
nom = "Popayán, orfèvres de la Nouvelle-Grenade"
vie = "Popayán (Colombie actuelle), XVIᵉ–XVIIIᵉ siècle"
biographie = """
Fondée en 1537 par le conquistador Sebastián de Belalcázar dans une haute vallée des \
Andes, au sud de l'actuelle Colombie, Popayán devient une ville de notables, de \
couvents et d'églises. Sa richesse vient de l'or, extrait dans les mines et les \
rivières des régions voisines, en particulier vers la côte pacifique, par des Africains \
réduits en esclavage. Les élites de la ville, propriétaires de mines et de domaines, \
rivalisent de générosité envers les églises et les confréries, ces associations de \
fidèles qui organisent le culte d'un saint ou de la Vierge et entretiennent ses \
ornements. Les orfèvres locaux, dont les noms sont presque tous oubliés, fabriquent \
pour elles des ostensoirs, des calices, des couronnes et des parures de statues. Les \
émeraudes viennent des mines de la région de Muzo, au nord de Bogota, déjà exploitées \
avant l'arrivée des Espagnols. Rattachée au XVIIIᵉ siècle à la vice-royauté de \
Nouvelle-Grenade, Popayán reste célèbre pour ses processions de la Semaine sainte, \
inscrites en 2009 au patrimoine culturel immatériel de l'UNESCO."""
style = """
L'orfèvrerie religieuse de la Nouvelle-Grenade adopte les formes européennes, baroques \
puis rocaille, connues par les objets importés et les gravures, mais les traite avec \
une prodigalité propre au Nouveau Monde : or épais, émeraudes en abondance, effets de \
profusion. Le repoussé, les ajours et les pierres en table ou en goutte donnent à ces \
objets un éclat fait pour être vu de loin, dans la lumière des cierges et des \
processions."""

[[artistes]]
nom = "Paris, orfèvres-bijoutiers du XVIIIᵉ siècle"
vie = "Paris, XVIIIᵉ siècle"
biographie = """
Au XVIIIᵉ siècle, Paris domine la fabrication des objets de luxe en Europe. Les \
orfèvres-bijoutiers, membres de la puissante corporation des orfèvres, se spécialisent \
dans les « bijoux » au sens de l'époque : tabatières, étuis, boîtes à mouches, \
nécessaires et pommeaux de canne. Leurs ouvrages d'or portent des poinçons \
obligatoires, celui du maître et ceux du contrôle, avec une lettre qui change chaque \
année : on peut ainsi les dater avec précision. La tabatière devient l'accessoire \
indispensable de l'homme et de la femme du monde, et le roi offre aux ambassadeurs des \
boîtes ornées de son portrait. Les orfèvres travaillent avec des miniaturistes, des \
émailleurs et des graveurs. Pierre-François Delafons, reçu maître en 1732 et mort en \
1787, est l'un de ces fabricants. La famille Van Blarenberghe, originaire de Lille, \
s'est fait une spécialité des vues minuscules : Louis-Nicolas, né en 1716, peintre des \
batailles pour le ministère de la Guerre, et son fils Henri-Joseph peignent des fêtes, \
des ports, des batailles et des châteaux pour les couvercles des boîtes."""
style = """
La tabatière parisienne est un chef-d'œuvre de miniaturisation et de précision : \
charnière parfaite, couvercle qui se ferme sans jeu, or de plusieurs couleurs ciselé de \
fleurs, émail, laque ou miniatures sous verre. Elle suit les modes, rocaille vers 1750, \
puis néoclassique. Les vues des Van Blarenberghe, d'une exactitude topographique, en \
font aussi des documents précieux sur les lieux et les fêtes de l'époque."""

[[artistes]]
nom = "Maison Fabergé"
vie = "Saint-Pétersbourg, 1842–1918"
biographie = """
Gustav Fabergé, joaillier d'une famille d'origine huguenote établie dans les pays \
baltes, ouvre sa boutique à Saint-Pétersbourg en 1842. Son fils Carl, né en 1846, suit \
sa famille à Dresde, la ville de la Voûte verte, où il fréquente une école de commerce, \
se forme chez un joaillier de Francfort puis voyage en Europe pour étudier les \
collections, avant de prendre la tête de la maison en 1872. Il veut que la valeur d'un \
objet tienne à son invention et à sa perfection plutôt qu'au poids des pierres. En \
1885, le tsar Alexandre III lui commande un œuf de Pâques pour l'impératrice Maria \
Feodorovna, l'œuf à la poule, et Fabergé devient fournisseur de la cour. Nicolas II \
poursuit la tradition, en offrant chaque année un œuf à sa mère et un à sa femme : une \
cinquantaine d'œufs impériaux sont fabriqués jusqu'en 1916. La maison emploie jusqu'à \
cinq cents personnes, dans des ateliers dirigés par des chefs comme Mikhaïl Perkhine et \
Henrik Wigström, et ouvre des succursales à Moscou, à Odessa, à Kiev et à Londres. \
Nationalisée par les bolcheviks en 1918, elle disparaît ; Carl Fabergé fuit la Russie \
et meurt à Lausanne en 1920."""
style = """
Le style Fabergé puise dans le XVIIIᵉ siècle français, la Renaissance, l'art russe \
ancien et parfois l'Art nouveau. Il se reconnaît à ses émaux translucides sur fond \
guilloché, d'une palette très étendue, à ses ors de couleurs différentes, à ses fleurs \
et à ses animaux en pierres dures de Russie, et à une finition irréprochable. Ses œufs \
impériaux, avec leurs surprises, sont devenus le symbole du luxe des derniers Romanov."""

[[artistes]]
nom = "René Lalique"
vie = "Aÿ (Marne), 6 avril 1860 – Paris, 1ᵉʳ mai 1945"
biographie = """
Né en Champagne, René Lalique perd son père à seize ans et entre en apprentissage chez \
le joaillier parisien Louis Aucoc, tout en suivant des cours à l'École des arts \
décoratifs. Il passe ensuite deux ans à Londres, où il étudie au Sydenham College. \
Revenu à Paris, il dessine des bijoux pour de grandes maisons, comme Cartier ou \
Boucheron, puis reprend en 1885 l'atelier du joaillier Jules d'Estape. Dans les années \
1890, il invente une joaillerie nouvelle, où les insectes, les fleurs, les femmes et \
les paysages remplacent les rivières de diamants. Sarah Bernhardt porte ses bijoux ; à \
l'Exposition universelle de 1900, sa vitrine fait sensation, et il est promu officier \
de la Légion d'honneur. Le collectionneur Calouste Gulbenkian devient son grand mécène. \
Après 1905, Lalique se tourne vers le verre : il dessine des flacons de parfum pour \
François Coty, puis fonde ses propres verreries, à Combs-la-Ville, puis à \
Wingen-sur-Moder, en Alsace. Ses vases, ses luminaires et ses bouchons de radiateur \
font de lui l'un des maîtres de l'Art déco. Il meurt à Paris en 1945."""
style = """
Lalique a libéré la joaillerie de la tyrannie du diamant. Il choisit ses matériaux pour \
leur effet, émail plique-à-jour, corne, ivoire, verre, opale, pierre de lune, et les \
associe à l'or avec une liberté totale. Ses motifs, empruntés à la nature et au \
symbolisme, libellules, paons, femmes-fleurs, serpents, font du bijou une œuvre d'art à \
part entière. Son influence sur l'Art nouveau européen fut immense, et son travail du \
verre ouvrit la voie à l'Art déco."""

[[artistes]]
nom = "Louis Comfort Tiffany"
vie = "New York, 18 février 1848 – New York, 17 janvier 1933"
biographie = """
Fils de Charles Lewis Tiffany, fondateur de la maison Tiffany & Co., Louis Comfort \
Tiffany préfère la peinture à l'entreprise familiale. Élève de George Inness et de \
Samuel Colman, il voyage en Europe et en Afrique du Nord, dont il rapporte des toiles \
orientalistes. Dans les années 1870, il s'intéresse au verre et cherche à obtenir la \
couleur dans la masse même du matériau, sans peinture. Il fonde en 1879 une entreprise \
de décoration intérieure, qui réaménage des salons de la Maison-Blanche en 1882, puis \
se consacre au vitrail et au verre soufflé, auquel il donne le nom de Favrile. Ses \
ateliers, devenus Tiffany Studios, produisent des vitraux, des mosaïques, des vases et \
les célèbres lampes à abat-jour de verre. Après la mort de son père, en 1902, il \
devient directeur artistique de Tiffany & Co. et se lance dans la joaillerie, présentée \
pour la première fois à Saint-Louis en 1904. Il construit alors Laurelton Hall, sa \
demeure de Long Island, véritable manifeste de son art. Passé de mode après la Première \
Guerre mondiale, il crée une fondation pour de jeunes artistes et meurt à New York en \
1933."""
style = """
Tiffany voulait faire entrer la beauté de la nature dans les objets de tous les jours. \
Peintre de la couleur, il en cherche les effets dans le verre irisé, les opales et les \
émaux, et ses motifs, libellules, glycines, pivoines, pissenlits, viennent de \
l'observation directe des jardins. Son œuvre est la grande contribution américaine à \
l'Art nouveau, plus naturaliste et moins littéraire que l'art français."""
