[exposition]
ordre = 55
nom_court = "Joyaux"
mouvement = "Joyaux, orfèvrerie et trésors"
cadre = "vitrine"
couleur = "#7a5a1c"
titre = "Joyaux et trésors, quatre mille ans d'orfèvrerie"
artiste = "Fabergé, Lalique, Tiffany, orfèvres d'Égypte, de Limoges, de Popayán…"
dates = "vers 1887 av. J.-C. – 1907"
accroche = "Exposition virtuelle · Voûte verte (Grünes Gewölbe), Dresde"
introduction = """
Depuis l'Égypte des pharaons, les orfèvres transforment l'or, les pierres et l'émail en \
objets de pouvoir, de foi et de séduction. La visite réunit dix trésors, du pectoral \
d'une princesse égyptienne aux bijoux Art nouveau de Lalique et de Tiffany, en passant \
par un camée d'Auguste, un autel roman, une couronne d'émeraudes des Andes et un œuf \
impérial de Fabergé. Le bâtiment s'inspire de la Voûte verte de Dresde, le trésor des \
princes de Saxe : une enfilade de cabinets bas que l'on traverse comme on ouvrirait des \
coffrets, jusqu'au salon des précieux, plus vaste et plus haut. Chaque objet, souvent \
minuscule, y est présenté agrandi dans une vitrine profonde, sur un fond de velours \
sombre."""
vitrine = "couronne-des-andes.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Voûte verte (Grünes Gewölbe)"
ville = "Dresde, Allemagne"
construction = "1723–1729"
presentation = """
En 1547, l'électeur Maurice de Saxe fait ajouter une aile au château de Dresde ; au \
rez-de-chaussée, des salles voûtées abritent le trésor secret des princes. On les \
appelle la Voûte verte, d'après la couleur verte de leurs bases et de leurs chapiteaux \
de colonnes. De 1723 à 1729, Auguste le Fort, électeur de Saxe et roi de Pologne, les \
transforme en une suite de salles d'apparat ouvertes aux visiteurs : c'est l'un des \
plus anciens musées d'Europe. On y passe du cabinet de l'ambre à la salle de l'ivoire, \
des salles d'argent au salon des précieux, tapissé de miroirs, puis à la chambre des \
joyaux. Le trésor compte aussi la Cour de Delhi, théâtre miniature d'or et de \
pierreries de Johann Melchior Dinglinger, et le Diamant vert de Dresde, de 41 carats. \
Le bombardement de février 1945 détruit trois salles ; les collections, emportées en \
URSS, reviennent en 1958. La Voûte verte historique, restituée dans son état du XVIIIᵉ \
siècle, rouvre en 2006."""
ici = """
Le bâtiment d'ARTEON reprend l'idée de la Voûte verte : une enfilade de cabinets que \
l'on traverse d'ouest en est. On entre par le sud dans le vestibule vert, aux murs \
couleur de malachite pâle, puis on passe au cabinet des antiques, aux murs d'ambre \
clair, et à la chambre du trésor, couleur d'ivoire : trois salles de 10 mètres sur 8, \
hautes de 5,5 mètres. Vient ensuite le salon des précieux, plus vaste et plus haut, aux \
murs gris argent comme les miroirs de son modèle. La visite s'achève dans le cabinet \
des joyaux, d'un vert tendre. Les objets reposent dans des vitrines murales tendues de \
velours sombre."""

# ─── Le plan du musée ────────────────────────────────────────────────────────
