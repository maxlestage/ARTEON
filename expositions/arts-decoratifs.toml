# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « ARTS DÉCORATIFS » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/arts-decoratifs/). Le
#  nom du fichier donne l'adresse de l'exposition sur le site : /arts-decoratifs.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 165
nom_court = "Arts décoratifs"
mouvement = "Art nouveau et Art déco, les arts décoratifs"
cadre = "vitrine"
couleur = "#566b34"
titre = "De l'Art nouveau à l'Art déco, l'art dans la maison"
artiste = "Tiffany, Gallé, Daum, Guimard, Mackintosh, Ruhlmann, Lalique…"
dates = "1897–1926"
accroche = "Exposition virtuelle · Musée des Arts décoratifs, Paris"
introduction = """
Vers 1890, des artistes refusent de copier les styles du passé et veulent mettre l'art \
partout : dans une lampe, une chaise, un vase ou une affiche. L'Art nouveau puise ses \
lignes dans les plantes et les insectes, de Nancy à Glasgow et de Paris à New York ; \
dans les années 1920, l'Art déco lui répond par la géométrie, les bois précieux et le \
verre moulé. La visite réunit dix objets, de 1897 à 1926, présentés en vitrine. Le \
bâtiment s'inspire du musée des Arts décoratifs de Paris, installé dans le pavillon de \
Marsan, au Louvre : une grande nef haute de quatorze mètres, d'où l'on gagne les \
galeries."""
vitrine = "magnolias-et-iris.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Musée des Arts décoratifs"
ville = "Paris, France"
construction = "Ouvert en 1905 dans le pavillon de Marsan du Louvre"
presentation = """
En 1864, des industriels, des artistes et des collectionneurs fondent à Paris l'Union \
centrale des beaux-arts appliqués à l'industrie : ils veulent que les objets fabriqués \
en France restent beaux à l'heure de la machine. Devenue en 1882 l'Union centrale des \
arts décoratifs, l'association réunit des collections et obtient de l'État le pavillon \
de Marsan, à l'extrémité ouest de l'aile du Louvre qui longe la rue de Rivoli. Ce \
pavillon, incendié en 1871 avec le palais des Tuileries pendant la Commune, avait été \
reconstruit peu après. Le musée y ouvre en 1905. Au cœur du bâtiment, une vaste nef \
couverte d'une verrière dessert des galeries sur plusieurs niveaux. On y suit \
l'histoire des objets du Moyen Âge à nos jours : mobilier, céramique, verre, \
orfèvrerie, papiers peints, jouets, affiches. Les salles Art nouveau et Art déco sont \
réputées, avec les pièces de l'appartement de la couturière Jeanne Lanvin, dessinées \
par Armand-Albert Rateau. Rénové pendant dix ans, le musée a rouvert en 2006."""
ici = """
Le bâtiment d'ARTEON reprend l'idée de la nef du musée parisien. On entre par le sud \
dans « La nef », longue de vingt mètres, haute de quatorze, aux murs couleur de \
pierre, où une affiche de Mucha et un grand vase de Guimard accueillent le visiteur. À \
l'ouest s'ouvre la galerie « Nancy, le verre et la nature », d'un vert pâle ; à l'est, \
« Tiffany, la lumière de New York », couleur de miel. Au nord, la galerie « Paris et \
Glasgow, la ligne » met face à face deux sièges, puis mène à la dernière salle, \
« 1925, l'Art déco »."""

