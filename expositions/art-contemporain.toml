# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « ART CONTEMPORAIN » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/art-contemporain/). Le
#  nom du fichier donne l'adresse de l'exposition sur le site : /art-contemporain.
#
#  Les œuvres exposées sont protégées par le droit d'auteur : elles sont toutes
#  installées à demeure dans l'espace public d'un pays dont la « liberté de
#  panorama » autorise à les photographier, et chaque photographie est publiée
#  sur Wikimedia Commons sous licence libre (crédit, licence et source indiqués).
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 210
nom_court = "Art contemporain"
mouvement = "Art contemporain"
cadre = "aucun"
couleur = "#9a4a2c"
titre = "L'art contemporain, des œuvres pour la ville"
artiste = "Bourgeois, Gormley, Kapoor, Chillida, Whiteread, Shonibare, Botero, Yue Minjun…"
dates = "1976–2010"
accroche = "Exposition virtuelle · Tate Modern, Londres"
introduction = """
L'art contemporain est sorti des musées : depuis les années 1970, les grands \
sculpteurs travaillent pour la rue, la colline, le rivage. La visite réunit dix œuvres \
monumentales installées en plein air, de Gateshead à Vancouver et de Saint-Sébastien à \
Madrid, par des artistes venus d'Europe, d'Inde, d'Afrique, de Chine et d'Amérique \
latine. Ces œuvres étant protégées par le droit d'auteur, on les découvre à travers \
des photographies publiées sous licence libre, qui les montrent dans leur lieu. Le \
bâtiment s'inspire de la Tate Modern à Londres : un hall, puis la nef immense de \
l'ancienne salle des turbines, et trois galeries en enfilade au nord."""
vitrine = "maman.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Tate Modern"
ville = "Londres, Royaume-Uni"
architecte = "Giles Gilbert Scott (la centrale) ; Herzog & de Meuron (le musée)"
construction = "1947–1963 (la centrale) ; musée ouvert en 2000"
presentation = """
Sur la rive sud de la Tamise, face à la cathédrale Saint-Paul, la centrale électrique \
de Bankside est construite en deux étapes, de 1947 à 1963, sur les plans de Sir Giles \
Gilbert Scott, l'architecte de la centrale de Battersea. Ce long bâtiment de brique, \
dominé par une cheminée de 99 mètres, cesse de fonctionner en 1981. En 1995, la Tate \
choisit les architectes suisses Herzog & de Meuron pour en faire son musée d'art \
moderne et contemporain. Ils gardent l'enveloppe de brique, posent sur le toit une \
longue boîte de verre lumineuse et font de l'ancienne salle des turbines, vidée de ses \
machines, une nef de 3 400 mètres carrés qui traverse tout le bâtiment et où l'on \
descend par une rampe en pente douce. La reine Élisabeth II inaugure la Tate Modern le \
11 mai 2000. Chaque année, un artiste est invité à occuper cette nef : Louise \
Bourgeois ouvre la série en 2000. En 2016, une tour de brique ajourée, aujourd'hui le \
Blavatnik Building, agrandit le musée, dont les collections permanentes sont \
gratuites."""
ici = """
Le bâtiment d'ARTEON reprend l'idée maîtresse de la Tate Modern : une nef immense \
entre la rue et les galeries. On entre par le sud dans le hall sud, puis on débouche \
dans le Turbine Hall, long de 44 mètres et haut de 20, aux murs de béton clair, où \
sont accrochés les géants : l'araignée de Bourgeois, l'ange de Gormley, la tête de \
Plensa et le miroir de Kapoor. Au nord, comme les galeries tournées vers la Tamise, \
trois salles blanches communiquent en enfilade, d'ouest en est : « Mémoire et \
empire », « Le corps et le rire », puis « La mer et le vent »."""

