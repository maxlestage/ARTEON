# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Maman"
artiste = "Louise Bourgeois"
annee = "1999"
image = "maman.jpg"
cadre = "noir"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:NGC_Maman.JPG"
technique = "Bronze, acier inoxydable et marbre ; environ 9,3 × 8,9 × 10,2 m"
collection = "Musée des beaux-arts du Canada, Ottawa (sur le parvis, en plein air)"
note = "Une araignée de plus de neuf mètres, des œufs de marbre sous le ventre : Louise Bourgeois l'a dédiée à sa mère."
description = """
Sur le parvis de pierre du Musée des beaux-arts du Canada, une araignée géante enjambe \
le passage. Huit longues pattes de bronze sombre, fines, noueuses et coudées, \
retombent sur le sol en pointes aiguës, comme des aiguilles. Le corps, petit par \
rapport à l'ensemble, est suspendu très haut au-dessus des visiteurs. Sous l'abdomen \
pend un sac ajouré de métal qui contient des œufs de marbre blanc. À l'arrière-plan, à \
droite, on aperçoit la tour de verre aux facettes pointues du musée et ses longues \
façades de pierre claire. Le ciel est gris et doux, le parvis presque vide : \
l'araignée paraît seule maîtresse des lieux. On peut passer sous elle, entre ses \
pattes, et lever les yeux vers son ventre : elle domine et protège à la fois."""
evocation = """
Le titre dit tout. Louise Bourgeois a expliqué que l'araignée était une ode à sa \
mère : comme elle, sa mère tissait et réparait sans relâche, dans l'atelier familial \
de restauration de tapisseries ; elle était patiente, habile, protectrice. Chez \
Bourgeois, l'araignée n'est donc pas un monstre, mais une présence utile, qui détruit \
les moustiques et refait sans cesse sa toile. Pourtant la sculpture inquiète aussi : \
sa taille, ses pattes en pointe, son ventre au-dessus de nos têtes évoquent la \
puissance écrasante de la mère vue par l'enfant. Cette ambivalence, tendresse et \
menace, fragilité et force, est au cœur de toute l'œuvre de l'artiste, nourrie de ses \
souvenirs d'enfance. On y a vu aussi un autoportrait de l'artiste elle-même, mère et \
créatrice."""
histoire = """
Louise Bourgeois a près de 88 ans quand elle conçoit Maman, en 1999, pour l'ouverture \
de la Tate Modern à Londres : en mai 2000, l'araignée, alors en acier, inaugure avec \
trois hautes tours la série d'œuvres commandées pour la salle des turbines. La \
sculpture est ensuite fondue en bronze en six exemplaires. Le Musée des beaux-arts du \
Canada en acquiert un en 2004, pour 3,2 millions de dollars, une somme considérable \
pour le musée, et l'installe sur son parvis, au cœur d'Ottawa. D'autres exemplaires \
veillent devant le musée Guggenheim de Bilbao, au Mori Art Museum de Tokyo, au musée \
Crystal Bridges dans l'Arkansas ou au Leeum de Séoul, et l'araignée a voyagé dans le \
monde entier, de Saint- Pétersbourg à Mexico."""
facture = """
L'original présenté à Londres était en acier ; les exemplaires suivants, coulés à la \
Modern Art Foundry de New York, sont en bronze, avec un sac d'acier inoxydable et des \
œufs de marbre. Les pattes gardent une surface irrégulière, striée, presque végétale, \
qui rappelle les nœuds d'une branche ou les articulations d'un corps âgé. La sculpture \
ne touche le sol que par huit pointes, d'où son allure à la fois instable et aérienne. \
Bourgeois dessinait déjà des araignées dans les années 1940 et en avait sculpté de \
plus petites au milieu des années 1990 : Maman est la plus grande d'entre elles."""
details = [
  "Le sac ajouré sous l'abdomen, qui renferme des œufs de marbre.",
  "Les pattes coudées qui se terminent en pointe, comme des aiguilles.",
  "Les surfaces striées et noueuses du bronze.",
  "La tour de verre du musée, dessinée par Moshe Safdie, à l'arrière-plan.",
]
themes = ["mère", "araignée", "mémoire", "tissage", "protection"]
anecdote = """
Louise Bourgeois disait des araignées qu'elles étaient des présences amicales, qui \
mangent les moustiques. Enfant, dans l'atelier de ses parents, elle avait appris à \
redessiner les parties usées des tapisseries anciennes, en particulier les pieds des \
personnages, souvent abîmés."""
salle = 2
mur = "ouest"
place = 3
largeur = 3.2

[[oeuvres]]
titre = "L'Ange du Nord (Angel of the North)"
artiste = "Antony Gormley"
annee = "1998"
image = "ange-du-nord.jpg"
cadre = "noir"
credit = "Photo : saw2th"
licence = "CC BY-SA 2.0"
source = "https://commons.wikimedia.org/wiki/File:Angel_of_the_North_2010.jpg"
technique = "Acier Corten ; hauteur 20 m, envergure 54 m, 208 tonnes"
collection = "Espace public, Low Eighton, Gateshead (Royaume-Uni)"
note = "Sur une colline au bord de l'autoroute A1, un homme d'acier aux ailes d'avion veille sur l'ancien bassin minier de la Tyne."
description = """
Sur une butte herbeuse, au sud de Gateshead, se dresse une figure humaine de vingt \
mètres de haut, plantée droit, les pieds joints. À la place des bras, deux ailes \
immenses, rigides et plates, s'étendent à l'horizontale sur cinquante-quatre mètres, \
plus que les ailes de bien des avions de ligne. Le corps n'a ni visage ni détail : une \
silhouette lisse, parcourue de nervures verticales. L'acier a pris une teinte de \
rouille brun orangé qui tranche sur le bleu du ciel. Sur la photographie, prise par un \
jour de nuages rapides, l'ange est vu de biais : l'aile la plus proche fend le ciel en \
diagonale, tandis qu'à ses pieds de minuscules promeneurs donnent l'échelle. Les ailes \
ne sont pas tout à fait dans l'axe du corps : elles s'avancent légèrement vers le \
spectateur."""
evocation = """
Gormley a rappelé que, sous la colline, des mineurs de charbon avaient travaillé dans \
l'obscurité pendant deux siècles : l'ange dressé dans la lumière leur rend hommage. \
L'acier, ses nervures et sa couleur de rouille évoquent aussi les chantiers navals et \
les usines qui ont fait la richesse de la région avant leur déclin. On y a vu le \
passage d'une époque industrielle à une autre, et un signe d'espoir pour un territoire \
durement touché par les fermetures. L'artiste disait que l'inclinaison des ailes \
donnait le sentiment d'une étreinte. Mais l'ange n'a pas de visage : chacun, \
automobiliste ou voyageur du train, y projette ce qu'il veut. Critiqué avant sa \
construction, il est devenu l'emblème du Nord-Est de l'Angleterre."""
histoire = """
Le conseil municipal de Gateshead confie en 1994 à Antony Gormley la création d'un \
monument à l'entrée de la ville. Le projet suscite une vive opposition : on le compare \
aux statues des régimes totalitaires, on critique son coût, 800 000 livres, financé \
surtout par l'Arts Council England et par des fonds européens. Le conseil l'approuve \
en 1995. Les pièces, fabriquées à Hartlepool, sont acheminées de nuit par la route le \
14 février 1998, et l'ange est dressé le lendemain, ailes comprises, au sommet d'une \
butte formée sur le site d'une ancienne mine. On estime aujourd'hui qu'environ \
trente-trois millions de personnes le voient chaque année depuis la route A1 et la \
grande ligne ferroviaire de la côte Est."""
facture = """
L'ange a été conçu à partir d'un moulage du corps de l'artiste, agrandi. Il est en \
acier Corten, un acier qui se couvre d'une couche de rouille protectrice et n'a pas \
besoin de peinture. Il pèse 208 tonnes : 100 pour le corps, 50 pour chaque aile. Il \
n'a pas d'ossature intérieure : ce sont les nervures verticales, visibles à \
l'extérieur, qui transmettent la poussée du vent aux fondations, calculées pour \
résister à des rafales de plus de 160 km/h. Sous la butte, 600 tonnes de béton \
l'ancrent dans la roche, à une vingtaine de mètres de profondeur. La structure a été \
étudiée par les ingénieurs d'Ove Arup."""
details = [
  "Les nervures verticales, qui servent de squelette extérieur.",
  "L'inclinaison des ailes vers l'avant, de 3,5 degrés.",
  "Le corps sans visage ni mains, simple silhouette.",
  "Les promeneurs au pied de la statue, qui donnent l'échelle.",
  "La couleur de rouille de l'acier sur le bleu du ciel.",
]
themes = ["ange", "industrie", "mémoire", "paysage", "corps"]
anecdote = """
Sollicité par Gateshead, Antony Gormley a d'abord refusé la commande, en répondant \
qu'il ne faisait pas de « sculpture d'autoroute ». Il s'est finalement laissé \
convaincre, et l'ange, visible de l'autoroute A1, est devenu son œuvre la plus \
célèbre."""
salle = 2
mur = "est"
place = 3
largeur = 3.2

[[oeuvres]]
titre = "Dream"
artiste = "Jaume Plensa"
annee = "2009"
image = "dream.jpg"
cadre = "noir"
credit = "Photo : Christian Keenan"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:20090614_The_Dream_Sutton_011.jpg"
technique = "Béton coulé et dolomite blanche d'Espagne ; hauteur 20 m, environ 500 tonnes"
collection = "Espace public, ancienne mine de Sutton Manor, St Helens (Royaume-Uni)"
note = "Sur le site d'une ancienne mine, une tête de jeune fille aux yeux clos, haute de vingt mètres, rêve au-dessus de l'autoroute."
description = """
Au sommet d'une colline boisée, une tête blanche, très allongée, se dresse comme une \
colonne. C'est le visage d'une jeune fille aux yeux fermés ; le cou se prolonge \
jusqu'au socle. Les traits sont étirés vers le haut, comme dans un miroir déformant, \
et la tête, vue de côté, paraît étonnamment mince. De fines lignes horizontales la \
divisent en tranches : ce sont les joints entre les éléments qui la composent. Sur la \
photographie, prise depuis le chemin qui monte vers elle, la statue se détache sur un \
ciel bleu limpide, encadrée par les arbres. Au pied du socle, quelques visiteurs \
minuscules donnent la mesure : vingt mètres, la hauteur d'un immeuble de six ou sept \
étages."""
evocation = """
Le site est celui de la mine de charbon de Sutton Manor, fermée en 1991. Plensa a \
voulu que quelque chose sorte de la terre et s'élève vers la lumière. Les yeux clos \
évoquent le sommeil, le rêve, la méditation : là où des hommes descendaient chaque \
jour dans le noir, une enfant rêve à l'avenir. Plensa a dit avoir représenté la tête \
d'une fillette de neuf ans ; on y a vu la génération qui ne connaîtra pas la mine. Le \
visage, serein et silencieux, contraste avec le flot incessant des voitures sur \
l'autoroute voisine. Ses promoteurs espéraient qu'il devienne pour le Nord-Ouest de \
l'Angleterre ce que l'Ange du Nord de Gormley est pour le Nord-Est : un symbole de \
renouveau après l'industrie."""
histoire = """
L'œuvre naît du Big Art Project, un programme de la chaîne de télévision Channel 4 qui \
finançait, avec l'Arts Council England et l'Art Fund, de grandes œuvres publiques \
choisies avec les habitants. À St Helens, d'anciens mineurs de Sutton Manor ont pris \
part au choix de l'artiste et du projet. Le coût, environ 1,8 million de livres, est \
couvert par ces partenaires. La sculpture est inaugurée en 2009 sur le site de \
l'ancienne mine, reconverti en espace boisé, au bord de l'autoroute M62 entre \
Liverpool et Manchester. La même année, Plensa reçoit pour Dream le prix Marsh de la \
sculpture publique. Un faisceau lumineux, prévu à l'origine au sommet de la tête, a \
été abandonné après les objections de l'agence des routes."""
facture = """
La tête est faite d'éléments de béton coulé, revêtus de dolomite blanche venue \
d'Espagne, qui lui donne son éclat de marbre ; du dioxyde de titane, ajouté au \
mélange, aide la surface à rester blanche. Les éléments sont empilés en assises, et \
leurs joints, visibles comme des lignes fines, rythment le visage. La forme, aplatie, \
change selon le point de vue : de face, un visage paisible ; de profil, presque une \
lame. Plensa a supprimé tout détail superflu : ni cheveux ni expression, seulement des \
paupières closes et des lèvres fermées, pour que l'attention se porte sur le silence."""
details = [
  "Les yeux fermés, aux paupières à peine dessinées.",
  "Les lignes horizontales des joints entre les assises.",
  "Le cou très long, qui fait de la tête une colonne.",
  "Les visiteurs minuscules au pied de la statue.",
]
themes = ["rêve", "enfance", "mine", "paysage", "visage"]
anecdote = """
Le titre de travail de l'œuvre était Ex Terra Lucem, « de la terre, la lumière » : \
c'était l'ancienne devise de la ville de St Helens, cité du charbon et du verre, que \
la sculpture semble mettre en image."""
salle = 2
mur = "sud"
place = 4
largeur = 2.9

[[oeuvres]]
titre = "Sky Mirror"
artiste = "Anish Kapoor"
annee = "2001"
image = "sky-mirror.jpg"
cadre = "noir"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Sky_Mirror,_Nottingham.jpg"
technique = "Acier inoxydable poli ; diamètre 6 m, 10 tonnes"
collection = "Espace public, Nottingham Playhouse, Wellington Circus, Nottingham (Royaume-Uni)"
note = "Un immense disque d'acier poli, tourné vers le ciel, renverse la ville et les nuages devant le théâtre de Nottingham."
description = """
Devant un théâtre, sur une petite place plantée d'arbres, un disque d'acier inoxydable \
de six mètres de diamètre se dresse sur la tranche, légèrement incliné vers le ciel. \
Sa face creuse, polie comme un miroir, ne montre pas ce qu'on attend : les maisons de \
brique voisines, les arbres nus de l'hiver et le ciel pâle y apparaissent la tête en \
bas, comme aspirés au fond d'une cuvette. Les bords du disque s'amincissent jusqu'à \
n'être plus qu'une ligne argentée, si bien que l'objet semble presque sans épaisseur. \
Autour, la rue, les grilles, les façades : la vie ordinaire continue. Selon l'heure, \
la saison et le temps, l'image change sans cesse : le miroir n'a pas de sujet fixe, il \
montre ce qui passe au-dessus de lui."""
evocation = """
Depuis ses débuts, Kapoor cherche à rendre sensible le vide, ce qui se trouve au-delà \
de l'objet. Ici, la sculpture s'efface presque : son contenu, c'est le ciel. Le miroir \
concave renverse le monde et oblige à regarder en haut, là où, dans une rue, on ne \
regarde jamais. On y a vu une manière de faire descendre le ciel dans la ville, ou \
d'ouvrir une fenêtre dans le décor urbain. Devant un théâtre, le choix a du sens : \
comme la scène, le miroir montre un monde familier rendu étrange. L'œuvre joue enfin \
avec le passant : quand il s'approche, son propre reflet bascule, grandit, se déforme, \
et il devient un instant l'acteur de la sculpture."""
histoire = """
Le Nottingham Playhouse, théâtre installé depuis 1963 dans un bâtiment moderne de \
Wellington Circus, commande l'œuvre à Anish Kapoor. Il faut six ans entre la première \
idée et l'inauguration, le 27 avril 2001. Le disque, fabriqué en Finlande, coûte 921 \
000 livres : la subvention de la Loterie nationale qui le finance est alors la plus \
importante jamais accordée à une seule œuvre d'art. Les habitants l'adoptent vite. \
Kapoor a ensuite repris l'idée ailleurs et à d'autres échelles, notamment au \
Rockefeller Center de New York en 2006, puis dans les jardins de Kensington, à \
Londres, en 2010 et 2011 ; mais le miroir de Nottingham, le premier, est resté à sa \
place, devant le théâtre."""
facture = """
Le miroir est une calotte d'acier inoxydable, formée puis polie jusqu'à ce que la \
surface ne garde plus aucune trace de fabrication : ni soudure, ni joint, ni marque \
d'outil. Cette perfection est la condition de l'illusion. La face creuse agit comme le \
miroir d'un télescope : de loin, elle renverse l'image ; de près, elle l'agrandit et \
la déforme. Le disque pèse dix tonnes, mais son bord aminci et son inclinaison lui \
donnent la légèreté d'un objet simplement posé. Kapoor emploie le même acier poli dans \
Cloud Gate, à Chicago."""
details = [
  "Le ciel et les arbres renversés au creux du disque.",
  "Les maisons de brique voisines, la tête en bas.",
  "Le bord aminci du disque, réduit à une ligne.",
  "Le socle discret, qui laisse croire que le miroir tient seul.",
]
themes = ["miroir", "ciel", "ville", "reflet", "vide"]
anecdote = """
En 2007, six ans à peine après son installation, Sky Mirror a été désigné par un \
sondage comme le monument préféré des habitants de Nottingham, une ville qui possède \
pourtant un château et de nombreux édifices anciens."""
salle = 2
mur = "sud"
place = 10
largeur = 2.9

[[oeuvres]]
titre = "Monument aux victimes juives autrichiennes de la Shoah"
artiste = "Rachel Whiteread"
annee = "2000"
image = "bibliotheque-sans-nom.jpg"
cadre = "noir"
credit = "Photo : C.Stadler/Bwag"
licence = "CC BY-SA 4.0"
source = "https://commons.wikimedia.org/wiki/File:Wien_-_Holocaust-Mahnmal_(1).JPG"
technique = "Béton sur structure d'acier ; base de 10 × 7 m, hauteur 3,8 m"
collection = "Espace public, Judenplatz, Vienne (Autriche)"
note = "Une bibliothèque coulée en béton et retournée comme un gant : ses livres ont le dos tourné, ses portes n'ont pas de poignée."
description = """
Au milieu de la Judenplatz, une petite place pavée du vieux Vienne bordée d'immeubles \
clairs, se dresse un bloc de béton gris pâle, de la taille d'une pièce, posé sur un \
socle bas. De loin, c'est une construction aveugle. De près, ses murs se révèlent \
faits de rangées de livres alignés sur des étagères, mais on ne voit que la tranche \
des pages : les dos, avec les titres, sont tournés vers l'intérieur, invisibles. Au \
centre de la façade, une double porte à panneaux, elle aussi moulée, n'a ni poignée ni \
serrure. Sur le pourtour du socle sont gravés les noms des lieux où des Juifs \
d'Autriche ont été assassinés. Le béton nu contraste avec les façades anciennes et les \
fenêtres de la place."""
evocation = """
Le monument rend hommage aux plus de 65 000 Juifs autrichiens assassinés par les nazis \
entre 1938 et 1945. On rapproche souvent le choix de la bibliothèque de l'expression \
« peuple du Livre » ; chaque livre est aussi une vie, une mémoire, un savoir, et ces \
livres-là ne pourront jamais être ouverts ni lus. Les portes sans poignée disent qu'on \
ne peut pas entrer, que les disparus ne reviendront pas. Le monument n'a rien de \
triomphal : c'est un vide rendu solide, ce que les historiens appellent un \
contre-monument, qui montre l'absence au lieu de glorifier. Simon Wiesenthal, à \
l'origine du projet, déclara lors de l'inauguration que ce monument ne devait pas être \
beau, mais faire mal."""
histoire = """
L'idée vient de Simon Wiesenthal, après la polémique suscitée par le monument d'Alfred \
Hrdlicka sur l'Albertinaplatz, inauguré en 1988, jugé peu digne envers les victimes. \
La Ville de Vienne organise un concours international ; le jury, présidé par \
l'architecte Hans Hollein, retient à l'unanimité le projet de Rachel Whiteread. \
L'inauguration, prévue pour le 9 novembre 1996, anniversaire de la Nuit de cristal, \
est retardée de quatre ans par les débats et par une découverte : sous la place, les \
fouilles mettent au jour les fondations de la synagogue médiévale, détruite lors des \
persécutions de 1420-1421. Le monument est enfin inauguré le 25 octobre 2000. Les \
vestiges de la synagogue se visitent sous la place, au musée Judenplatz."""
facture = """
Whiteread est la sculptrice du moulage en creux : plutôt que de représenter un objet, \
elle moule l'espace qui l'entoure ou qu'il contient. Ici, elle a moulé l'intérieur \
d'une bibliothèque imaginaire, puis l'a retourné : ce que nous voyons de l'extérieur \
est l'empreinte des rayonnages, comme si les murs de la pièce avaient disparu. Le \
béton est coulé sur une structure d'acier, à l'échelle d'une vraie pièce. Les livres, \
tous semblables, sont alignés avec une régularité d'archive. À la demande de \
l'artiste, aucun revêtement anti-graffiti ne protège le béton."""
details = [
  "La tranche des livres, toutes identiques, sans titre lisible.",
  "La double porte à panneaux, sans poignée ni serrure.",
  "Les noms des camps et des lieux de massacre gravés autour du socle.",
  "Le contraste du béton nu avec les façades anciennes de la place.",
]
themes = ["mémoire", "shoah", "livres", "absence", "vienne"]
anecdote = """
En 1993, Rachel Whiteread est devenue la première femme à remporter le Turner Prize, \
le grand prix britannique d'art contemporain décerné par la Tate. Elle avait alors \
trente ans."""
salle = 3
mur = "nord"
place = 2
largeur = 2.8

[[oeuvres]]
titre = "Le Vaisseau de Nelson en bouteille (Nelson's Ship in a Bottle)"
artiste = "Yinka Shonibare"
annee = "2010"
image = "bateau-de-nelson.jpg"
cadre = "noir"
credit = "Photo : Elliott Brown"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Nelson's_Ship_in_a_Bottle_-_National_Maritime_Museum.jpg"
technique = "Techniques mixtes (bouteille transparente, maquette, tissus imprimés) ; 2,8 × 5 × 2,5 m"
collection = "National Maritime Museum, Greenwich, Londres (en plein air)"
note = "Le vaisseau amiral de Nelson à Trafalgar, enfermé dans une bouteille géante, porte des voiles taillées dans des tissus « wax »."
description = """
Une bouteille transparente géante, couchée sur un berceau de bois sombre percé \
d'ouvertures rondes, contient un trois-mâts de guerre toutes voiles dehors. C'est la \
réplique du HMS Victory, le vaisseau de l'amiral Nelson. Mais ses voiles ne sont pas \
blanches : elles sont taillées dans des tissus imprimés de motifs colorés, rouge, \
ocre, bleu, comme ceux qu'on porte en Afrique de l'Ouest. Le goulot est fermé par un \
gros bouchon de liège, entouré de cordage et scellé d'un cachet rouge. L'ensemble \
repose sur un haut piédestal de pierre claire, devant le musée. Sur la photographie, \
prise en contre-plongée, la bouteille se découpe sur un ciel bleu traversé de nuages, \
comme si le navire voguait dans les airs."""
evocation = """
Nelson est le héros national britannique : sa victoire de Trafalgar, en 1805, où il \
trouva la mort, assura à la Grande-Bretagne la maîtrise des mers pour un siècle. \
Shonibare met ce symbole en bouteille, comme un souvenir de marin, et le pare de \
tissus « wax », dont l'histoire résume la mondialisation coloniale : inspirés du batik \
indonésien, fabriqués en Europe et vendus en Afrique de l'Ouest, ils y sont devenus un \
emblème d'identité africaine. L'œuvre rappelle que la puissance de l'Empire et la \
richesse de Londres se sont construites sur le commerce maritime avec l'Afrique et \
l'Asie. Shonibare l'a présentée comme une célébration de la diversité de Londres : \
l'équipage du Victory comptait déjà des marins d'une vingtaine de nationalités."""
histoire = """
En 2009, l'autorité du Grand Londres commande l'œuvre pour le quatrième socle de \
Trafalgar Square, un piédestal resté vide pendant plus d'un siècle et demi, qui \
accueille depuis 1999 des œuvres contemporaines temporaires. Installé en mai 2010 face \
à la colonne de Nelson, le navire y reste jusqu'au début de 2012. Pour le garder à \
Londres, l'Art Fund lance une souscription publique : 264 300 livres sont réunies \
auprès des particuliers, auxquelles s'ajoutent 50 000 livres du fonds, sur un prix de \
362 500 livres. Le National Maritime Museum de Greenwich acquiert ainsi l'œuvre et \
l'installe à demeure, le 23 avril 2012, devant sa nouvelle aile Sammy Ofer."""
facture = """
Shonibare travaille avec une équipe d'artisans et de techniciens. La maquette du \
Victory, détaillée jusqu'à ses quatre-vingts canons, est gréée de trente-sept voiles \
en tissu wax, chacune d'un motif différent. Le principe est celui des bouteilles de \
marin, mais à l'échelle d'un monument : l'ensemble mesure environ cinq mètres de long \
et près de trois mètres de haut. Le contraste entre la précision de la maquette, digne \
d'un musée de la marine, et l'éclat des imprimés est le ressort de l'œuvre. Comme \
souvent chez Shonibare, le tissu wax remplace l'étoffe attendue pour faire surgir une \
autre histoire."""
details = [
  "Les trente-sept voiles, toutes en tissus imprimés différents.",
  "Le bouchon de liège entouré de cordage et le cachet rouge.",
  "Les ouvertures rondes du berceau de bois, comme des sabords.",
  "Les rangées de canons sur les flancs du vaisseau.",
]
themes = ["empire", "mer", "tissu", "histoire", "londres"]
anecdote = """
Le vrai Victory existe toujours : conservé en cale sèche à Portsmouth, il est encore \
inscrit au service actif de la Royal Navy, ce qui en fait le plus ancien navire de \
guerre en service au monde."""
salle = 3
mur = "nord"
place = 3
largeur = 2.8

[[oeuvres]]
titre = "Femme au miroir (Mujer con espejo)"
artiste = "Fernando Botero"
annee = "1987"
image = "femme-au-miroir.jpg"
cadre = "noir"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Madrid_-_Mujer_con_Espejo_(Fernando_Botero)_1.jpg"
technique = "Bronze, environ 1 000 kg"
collection = "Espace public, place de Colón, Madrid (Espagne)"
note = "Allongée sur le ventre, une femme aux formes immenses se regarde dans un petit miroir : Botero l'a offerte à Madrid en 1994."
description = """
Sur une dalle de pierre posée au ras du trottoir, une femme nue est allongée sur le \
ventre, appuyée sur ses avant-bras. Tout en elle est volume : le dos, les hanches, les \
cuisses forment une suite de collines lisses et luisantes. La tête, en revanche, est \
petite, avec un visage rond et paisible, de petits yeux, une petite bouche et des \
cheveux sagement coiffés en boucles. Dans sa main, minuscule à côté de son corps, elle \
tient un petit miroir rond où elle se contemple, indifférente aux passants. Le bronze \
sombre a pris par endroits une patine verte, et brille là où la lumière glisse sur les \
rondeurs. La sculpture, vue en perspective sur la photographie, semble s'étirer sans \
fin sur les dalles claires de la place."""
evocation = """
Botero répétait qu'il ne représentait pas des gros, mais le volume, la sensualité et \
la plénitude des formes. La femme au miroir reprend un grand thème de la peinture \
européenne, Vénus à sa toilette, que Botero connaissait bien pour avoir copié \
Velázquez au Prado ; on peut penser à la Vénus au miroir du maître sévillan, elle \
aussi allongée. Mais ici le sujet est traité avec humour et tendresse : la femme se \
regarde avec satisfaction, sans honte de son corps, à rebours des canons de minceur. \
Posée au milieu de la circulation, à hauteur de passant, elle oppose sa lenteur \
tranquille à l'agitation de la ville. Les Madrilènes l'ont adoptée comme une figure \
familière du quartier."""
histoire = """
Au printemps 1994, Madrid accueille l'exposition « Botero en Madrid » : vingt et une \
sculptures monumentales installées en plein air pendant environ trois mois. Devant le \
succès de ses « grosses », l'artiste promet d'en offrir une à la ville : ce sera cette \
Femme au miroir, créée en 1987. Elle est installée au débouché de la rue Génova sur la \
place de Colón, d'abord sur une pelouse fleurie, puis, après le réaménagement de la \
place, sur un îlot entre deux passages piétons. D'autres sculptures de l'exposition \
sont restées en Espagne : La Main, prêtée à la ville par Telefónica, sur le paseo de \
la Castellana, et L'Enlèvement d'Europe, à l'aéroport de Madrid-Barajas."""
facture = """
Botero modèle ses figures puis les fait fondre en bronze. Son principe est simple : \
gonfler les volumes et réduire les détails. Les petits yeux, la petite bouche et le \
miroir minuscule font paraître le corps encore plus immense. Les surfaces sont lisses, \
sans trace d'outil, pour que la lumière glisse sur les rondeurs comme sur une peau. La \
pose basse, presque à même le sol, et la longueur de la figure invitent le passant à \
en faire le tour. La sculpture pèse environ une tonne."""
details = [
  "Le petit miroir rond, tenu au bout des doigts.",
  "Les boucles régulières de la coiffure.",
  "Le contraste entre la tête menue et les hanches énormes.",
  "La patine verdâtre du bronze exposé aux intempéries.",
]
themes = ["corps", "femme", "miroir", "humour", "volume"]
anecdote = """
En 1995, à Medellín, sa ville natale, une bombe placée sous un oiseau de bronze de \
Botero fit de nombreuses victimes. Le sculpteur laissa l'oiseau éventré à sa place, en \
mémoire, et en offrit une copie intacte, installée à côté."""
salle = 4
mur = "nord"
place = 2
largeur = 2.8

[[oeuvres]]
titre = "A-maze-ing Laughter"
artiste = "Yue Minjun"
annee = "2009"
image = "a-maze-ing-laughter.jpg"
cadre = "noir"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:A-Maze_ing_-Laughter.English_Bay_Vancouver._(13079518644).jpg"
technique = "Bronze patiné ; quatorze figures plus grandes que nature"
collection = "Espace public, Morton Park, English Bay, Vancouver (Canada)"
note = "Quatorze statues de bronze, toutes à l'image de l'artiste, rient aux éclats au bord de la baie de Vancouver."
description = """
Dans un petit parc au bord de la mer, quatorze hommes de bronze plus grands que nature \
se dressent sur un sol de terre brune. C'est toujours le même homme : crâne rasé, yeux \
plissés jusqu'à disparaître, bouche grande ouverte sur deux rangées de dents. Chacun \
rit aux éclats dans une pose différente : l'un se plie en deux, un autre lève les bras \
ou se tient la tête, un autre se renverse en arrière. Ils sont torse nu et pieds nus, \
vêtus d'un simple pantalon. Derrière eux, au-delà des arbres et de la promenade, \
s'étendent les eaux de la baie, où mouillent des cargos, et des montagnes bleues à \
l'horizon. Des promeneurs se mêlent aux statues et deviennent, un instant, des figures \
parmi d'autres."""
evocation = """
Le rire figé est la signature de Yue Minjun, qui le peint depuis le début des années \
1990. Ce rire n'est pas joyeux : les yeux fermés, la bouche forcée, il ressemble à un \
masque. On l'a lu comme une réponse à la Chine d'après 1989, où l'on rit de ce qu'on \
ne peut pas dire, et comme une satire de l'homme moderne, souriant sur commande. \
Multipliés par quatorze, les doubles de l'artiste évoquent aussi la foule, \
l'uniformité, la perte de l'individu. Mais à Vancouver, le public a pris l'œuvre au \
premier degré : on vient y rire, imiter les poses et se photographier parmi les \
statues, et le rire, contagieux, finit par devenir réel."""
histoire = """
L'œuvre est créée pour la Biennale internationale de sculpture de Vancouver, qui \
installe des œuvres contemporaines dans les rues et les parcs de la ville. Elle est \
placée en 2009 dans Morton Park, à l'angle des rues Davie et Denman, face à English \
Bay. Prévue pour la durée de la biennale, elle devient vite l'une des œuvres les plus \
populaires de la ville. Un couple de mécènes, Chip et Shannon Wilson, l'achète par \
l'intermédiaire de sa fondation et l'offre à la Ville de Vancouver le 11 août 2012. \
Une inscription sur les bancs de béton souhaite qu'elle inspire le rire, l'espièglerie \
et la joie à tous ceux qui la découvrent. En 2013, elle est la seule œuvre d'art \
public nommée au concours des « Grands lieux du Canada »."""
facture = """
Yue Minjun est d'abord peintre : ses toiles aux couleurs vives, rose chair et bleu \
ciel, répètent son propre visage hilare. Pour Vancouver, il transpose cette figure en \
bronze, en corps entiers. Chaque statue pèse plus de 250 kilos. La patine brun cuivré, \
assez brillante, accroche la lumière sur les crânes et les joues. Le modelé est \
simplifié, presque caricatural, comme celui d'une figurine ou d'une affiche de \
propagande, avec des muscles lisses et des plis de vêtement sommaires. Tout l'effet \
vient de la répétition : la même tête, encore et encore, sous des angles différents."""
details = [
  "Les yeux plissés, réduits à deux fentes.",
  "Les dents alignées dans les bouches grandes ouvertes.",
  "Les cargos à l'ancre dans la baie, à l'arrière-plan.",
  "Les promeneurs qui se glissent entre les statues.",
]
themes = ["rire", "autoportrait", "foule", "chine", "ville"]
anecdote = """
En 2007, son tableau Execution (1995), qui reprend la composition de L'Exécution de \
Maximilien de Manet avec des personnages hilares, s'est vendu 2,9 millions de livres \
chez Sotheby's à Londres : un record, à l'époque, pour un artiste contemporain \
chinois."""
salle = 4
mur = "nord"
place = 3
largeur = 2.8

[[oeuvres]]
titre = "Le Peigne du vent (Peine del Viento XV)"
artiste = "Eduardo Chillida"
annee = "1976–1977"
image = "peigne-du-vent.jpg"
cadre = "noir"
credit = "Photo : Phillip Maiwald (Nikopol)"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Peine_del_viento_de_Eduardo_Chillida.jpg"
technique = "Acier ; trois sculptures d'environ 10 tonnes chacune"
collection = "Espace public, plage d'Ondarreta, Saint-Sébastien (Espagne)"
note = "Au bout de la baie de Saint-Sébastien, trois sculptures d'acier agrippent les rochers battus par les vagues."
description = """
Au pied du mont Igueldo, là où la ville s'arrête et où commence l'océan, trois \
sculptures d'acier sont scellées dans les rochers. Sur la photographie, la plus proche \
sort de la falaise comme une main : une barre massive se divise en crochets recourbés \
qui s'enroulent les uns autour des autres, semblables à des doigts ou à des dents de \
peigne tordues. L'acier a pris la couleur brun-rouge de la rouille. Derrière, la mer \
d'un bleu profond s'étend jusqu'à l'horizon ; au loin, sur un rocher isolé au milieu \
des vagues, on distingue une autre des sculptures, minuscule à cause de la distance. \
Les vagues battent les rochers et, par gros temps, recouvrent d'écume le pied des \
sculptures."""
evocation = """
Chillida, né à Saint-Sébastien, a voulu achever sa ville par une œuvre qui dialogue \
avec les forces naturelles : le vent, la mer, le rocher. Le titre suggère que l'acier \
peigne le vent venu du large, comme un instrument offert aux éléments. On a coutume de \
lire les trois pièces comme le passé, la plus lointaine, isolée sur son rocher, et le \
présent et l'avenir, les deux plus proches, qui se font face. On y voit aussi une \
frontière : l'endroit précis où la ville, avec ses quais et sa promenade, rencontre ce \
qui ne lui obéit pas. L'œuvre est devenue un emblème de Saint-Sébastien et du Pays \
basque, un lieu où l'on vient regarder les tempêtes."""
histoire = """
Chillida a donné le titre de Peigne du vent à toute une série de sculptures ; \
l'ensemble de Saint-Sébastien en est l'aboutissement monumental. Il le conçoit avec \
l'architecte basque Luis Peña Ganchegui, qui dessine la place en gradins de pierre \
menant aux sculptures, à l'extrémité de la plage d'Ondarreta. Les trois pièces \
d'acier, d'une dizaine de tonnes chacune, sont mises en place à la fin des années 1970 \
au prix d'un travail difficile dans les rochers battus par les vagues. Depuis, ce \
lieu, ouvert à tous jour et nuit, est l'un des plus visités de la ville, et l'image du \
Peigne du vent est devenue l'une des plus célèbres de la sculpture espagnole du XXᵉ \
siècle."""
facture = """
Chillida a appris le travail du fer à la forge, chez un forgeron près d'Hernani, et \
pense ses sculptures comme un dialogue entre la matière et l'espace qu'elle enserre. \
Les barres d'acier massives se recourbent pour envelopper un vide, sans jamais le \
fermer tout à fait. La rouille, loin d'être un défaut, fait partie de l'œuvre : elle \
accorde l'acier à la couleur des rochers. La place de Peña Ganchegui est percée \
d'orifices reliés à des conduits creusés dans la roche : quand la mer est forte, les \
vagues y poussent de l'air et de l'eau, qui soufflent et jaillissent entre les dalles."""
details = [
  "Les crochets d'acier qui s'enroulent les uns autour des autres.",
  "Une autre sculpture, au loin, isolée sur son rocher au milieu des vagues.",
  "Le point d'ancrage, où l'acier s'enfonce dans la falaise.",
  "L'horizon du golfe de Gascogne, vu à travers les boucles d'acier.",
]
themes = ["mer", "vent", "acier", "paysage", "pays basque"]
anecdote = """
Avant d'être sculpteur, Eduardo Chillida était le gardien de but de la Real Sociedad, \
le club de football de Saint-Sébastien. Une grave blessure au genou, qui exigea \
plusieurs opérations, mit fin à sa carrière et l'orienta vers l'architecture, puis \
vers l'art."""
salle = 5
mur = "nord"
place = 2
largeur = 2.8

[[oeuvres]]
titre = "Fête pour Neptune (Fest für Neptun)"
artiste = "Sokari Douglas Camp"
annee = "2004"
image = "fete-pour-neptune.jpg"
cadre = "noir"
credit = "Photo : Andreas Axel Kirch"
licence = "CC BY-SA 4.0"
source = "https://commons.wikimedia.org/wiki/File:2005-06-15-bonn-kurt-schumacher-strasse-3-deutsche-welle-fest-fuer-neptun-01.jpg"
technique = "Acier soudé et verre"
collection = "Espace public, siège de la Deutsche Welle (Schürmann-Bau), Bonn (Allemagne)"
note = "Debout dans un bassin, un personnage d'acier coiffé d'un poisson de verre bleu fête le dieu des eaux devant le siège de la Deutsche Welle."
description = """
Dans un bassin peu profond, au pied d'une façade de verre, un personnage d'acier \
brillant semble avancer à grandes enjambées, une jambe levée, les bras écartés. Son \
corps est un assemblage de plaques, de tiges et de lamelles soudées, qui laissent \
passer le jour comme une cage ou une armure ajourée. Il porte sur la tête une coiffe \
extravagante : une couronne de plumes et de filet, d'où partent de longues lanières, \
et, posé à plat au sommet, un grand poisson de verre d'un bleu vif. À ses pieds, des \
poissons d'acier semblent sauter hors de l'eau. Le métal poli reflète le bassin, les \
vitres et le ciel, et la silhouette paraît vibrer de lumière."""
evocation = """
Neptune est le dieu romain de la mer, mais la sculpture vient aussi d'ailleurs : \
Sokari Douglas Camp a grandi dans la culture kalabari du delta du Niger, où des \
mascarades honorent les esprits de l'eau. Les danseurs y portent souvent leur coiffe à \
plat sur le sommet de la tête, tournée vers le ciel, comme le poisson bleu de Bonn. \
L'œuvre fait ainsi se rencontrer les mythes de l'Europe et ceux de l'Afrique de \
l'Ouest, et célèbre les fleuves et les mers qui relient les peuples. Devant le siège \
de la Deutsche Welle, la radio-télévision internationale allemande qui s'adresse au \
monde entier en de nombreuses langues, cette fête aquatique prend l'allure d'un salut \
joyeux d'une rive à l'autre."""
histoire = """
La sculpture a été réalisée en 2004 dans le cadre du « Kunst am Bau », le principe qui \
consacre une part du budget des bâtiments publics allemands à des œuvres d'art. Elle \
accompagne l'installation de la Deutsche Welle dans le Schürmann-Bau, à Bonn, un vaste \
immeuble construit à l'origine au bord du Rhin pour les députés du Bundestag. Le \
chantier, inondé par une crue du fleuve en 1993, avait été interrompu ; après le \
transfert de la capitale à Berlin, le bâtiment fut achevé pour la Deutsche Welle, qui \
s'y installa en 2003. L'œuvre a été placée dans un bassin au pied de la façade, du \
côté de la Kurt-Schumacher-Straße, où les passants la voient depuis la rue."""
facture = """
Sokari Douglas Camp est une sculptrice du métal : elle découpe, plie et soude l'acier. \
Ici, le corps est construit comme un dessin dans l'espace, fait de pleins et de vides, \
si bien que la figure reste légère malgré son matériau. Le mouvement, une jambe levée, \
le buste penché, donne l'impression que le personnage marche dans l'eau. L'artiste \
associe à l'acier d'autres éléments : le verre bleu du poisson, la couronne de plumes, \
le filet et les rubans de la coiffe, qui rappellent les costumes de mascarade, faits \
d'assemblages de tissus, de plumes et d'objets."""
details = [
  "Le poisson de verre bleu posé à plat sur la tête.",
  "Les poissons d'acier qui jaillissent autour des pieds.",
  "Les longues lanières qui flottent depuis la coiffe.",
  "Les reflets du bassin et des vitres sur l'acier poli.",
]
themes = ["mer", "mascarade", "mythologie", "afrique", "fête"]
anecdote = """
En 2003, Sokari Douglas Camp figurait parmi les artistes retenus pour le quatrième \
socle de Trafalgar Square, celui-là même qui accueillera en 2010 le vaisseau en \
bouteille de Yinka Shonibare."""
salle = 5
mur = "nord"
place = 3
largeur = 2.4

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Louise Bourgeois"
vie = "Paris, 25 décembre 1911 – New York, 31 mai 2010"
biographie = """
Louise Bourgeois grandit entre Paris et Choisy-le-Roi, où ses parents tiennent un \
atelier de restauration de tapisseries anciennes. Son enfance est marquée par la \
liaison de son père avec la gouvernante anglaise de la famille, qui vit sous leur \
toit, une blessure qui nourrira toute son œuvre. Elle étudie les mathématiques à la \
Sorbonne, puis l'art à l'École des beaux-arts, à l'École du Louvre et dans plusieurs \
académies ; Fernand Léger lui dit qu'elle est sculptrice plutôt que peintre. En 1938, \
elle épouse l'historien de l'art américain Robert Goldwater et s'installe à New York. \
Elle peint la série des Femmes-Maisons, puis sculpte des figures de bois, des formes \
de plâtre et de latex. La reconnaissance vient tard : le Museum of Modern Art lui \
consacre une rétrospective en 1982, alors qu'elle a plus de soixante-dix ans. Dans les \
années 1990, elle crée ses Cellules, pièces closes chargées de souvenirs, et ses \
araignées géantes. Lion d'or à la Biennale de Venise en 1999, elle travaille jusqu'à \
sa mort, à 98 ans."""
style = """
Bourgeois puise dans ses souvenirs d'enfance, la peur, la jalousie, l'abandon, la \
tendresse, pour inventer des formes à la fois intimes et monumentales. Elle passe d'un \
matériau à l'autre, bois, marbre, latex, tissu, bronze, sans jamais se fixer dans un \
style. Ses thèmes, le corps, la maison, la mère, la sexualité, en ont fait une figure \
majeure pour les artistes femmes et pour tout l'art de la fin du XXᵉ siècle."""

[[artistes]]
nom = "Antony Gormley"
vie = "Londres (Royaume-Uni), né le 30 août 1950"
biographie = """
Antony Gormley naît à Hampstead, à Londres. Élève du collège bénédictin d'Ampleforth, \
il étudie l'archéologie, l'anthropologie et l'histoire de l'art au Trinity College de \
Cambridge, de 1968 à 1971. Il part ensuite trois ans en Inde et à Ceylan, où il étudie \
le bouddhisme, une expérience décisive pour son rapport au corps. De retour à Londres, \
il suit les cours de Saint Martin's School of Art et de Goldsmiths, puis de la Slade \
School of Fine Art de 1977 à 1979. Dans les années 1980, il réalise ses premières \
figures moulées sur son propre corps. Il reçoit le Turner Prize en 1994 pour Field for \
the British Isles, une foule de petites figurines d'argile. L'Ange du Nord, en 1998, \
puis Another Place, cent figures de fonte tournées vers la mer, installées depuis 2005 \
sur la plage de Crosby, près de Liverpool, le font connaître bien au-delà du monde de \
l'art. Suivent Event Horizon (2007), des statues postées sur les toits de Londres, et \
One & Other (2009), qui offre le quatrième socle de Trafalgar Square à des habitants \
tirés au sort, une heure chacun. Membre de la Royal Academy depuis 2003, il est anobli \
en 2014."""
style = """
Gormley part de son propre corps : il le fait mouler, puis le transforme en figure de \
plomb, de fonte ou d'acier. Ces corps sans visage ne sont pas des portraits mais des \
enveloppes, des espaces intérieurs placés dans le paysage. Plantées sur une plage, un \
toit ou une colline, ses figures changent notre regard sur le lieu et nous rendent \
conscients de notre propre présence. Il a profondément renouvelé la sculpture publique \
britannique."""

[[artistes]]
nom = "Jaume Plensa"
vie = "Barcelone (Espagne), né le 23 août 1955"
biographie = """
Jaume Plensa naît à Barcelone. Il suit les cours de l'école de la Llotja et de l'école \
supérieure des beaux-arts de Sant Jordi, puis abandonne ses études pour se former \
seul. Ses premières sculptures, dans les années 1980, sont en fer et en fonte. Il \
introduit ensuite dans son travail la lumière, l'eau, le son, la vidéo et surtout les \
lettres de l'alphabet. En 2004, la Crown Fountain, dans le Millennium Park de Chicago, \
le rend célèbre : deux tours de verre où défilent les visages filmés d'un millier \
d'habitants, qui semblent cracher de l'eau sur les enfants qui jouent au pied. \
Viennent ensuite des figures assises ou accroupies faites de lettres d'acier \
entrelacées, et de grandes têtes de jeunes filles aux yeux clos, installées dans de \
nombreuses villes d'Europe, d'Amérique et d'Asie. Il conçoit aussi des décors d'opéra \
et des installations sonores. Il reçoit le prix Marsh de la sculpture publique en 2009 \
pour Dream, le Prix national des arts plastiques en Espagne en 2012 et le prix \
Velázquez en 2013."""
style = """
Plensa fait du corps humain un réceptacle de langage et de silence. Ses figures de \
lettres disent que nous sommes faits de mots et de cultures mêlées ; ses têtes aux \
yeux fermés invitent au recueillement, au rêve, à l'écoute intérieure. Il pense ses \
œuvres à l'échelle de la ville, comme des lieux de rencontre, et compte parmi les \
sculpteurs publics les plus demandés au monde."""

[[artistes]]
nom = "Anish Kapoor"
vie = "Bombay (Inde), né le 12 mars 1954"
biographie = """
Anish Kapoor naît à Bombay d'un père hindou du Pendjab, hydrographe dans la marine \
indienne, et d'une mère d'origine juive irakienne. Après ses études à la Doon School, \
il part en 1971 pour Israël, vit dans un kibboutz et commence des études d'ingénieur, \
qu'il abandonne au bout de quelques mois pour devenir artiste. Il s'installe à Londres \
en 1973 et étudie au Hornsey College of Art puis à la Chelsea School of Art. Il se \
fait connaître au début des années 1980 avec des formes simples recouvertes de pigment \
pur, rouge, jaune ou bleu, posées à même le sol. Il représente la Grande-Bretagne à la \
Biennale de Venise de 1990, où il reçoit le Premio Duemila, et remporte le Turner \
Prize en 1991. Ses œuvres prennent ensuite une dimension monumentale : Marsyas (2002) \
dans la salle des turbines de la Tate Modern, Cloud Gate (2006) à Chicago, Leviathan \
au Grand Palais à Paris en 2011, et l'ArcelorMittal Orbit, tour-sculpture de 115 \
mètres élevée pour les Jeux olympiques de Londres en 2012. Il est anobli en 2013."""
style = """
Kapoor travaille le vide plus que la forme. Pigments si purs qu'ils semblent absorber \
le regard, cavités noires sans fond apparent, miroirs d'acier poli qui renversent le \
monde : ses œuvres troublent la perception et font douter de ce qui est plein ou \
creux, proche ou lointain. Ses surfaces parfaites, sans trace de la main, et son goût \
de l'échelle monumentale font de lui l'un des sculpteurs les plus influents de sa \
génération."""

[[artistes]]
nom = "Rachel Whiteread"
vie = "Ilford (Royaume-Uni), née le 20 avril 1963"
biographie = """
Rachel Whiteread naît à Ilford, dans l'Essex, et grandit à Londres. Elle étudie la \
peinture à l'école polytechnique de Brighton, puis la sculpture à la Slade School of \
Fine Art de Londres, de 1985 à 1987. Très tôt, elle prend l'habitude de mouler non pas \
des objets, mais l'espace qu'ils contiennent : le dessous d'un lit, l'intérieur d'une \
baignoire ou d'une armoire. En 1990, Ghost, moulage en plâtre d'une pièce entière \
d'une maison londonienne, la fait connaître. En 1993, House, l'intérieur d'une maison \
victorienne de l'est de Londres coulé en béton, suscite un débat national avant d'être \
démolie par la municipalité en janvier 1994. Elle appartient à la génération des Young \
British Artists, mais son œuvre, silencieuse et grave, se distingue de leurs \
provocations. En 2001, elle coule en résine transparente le quatrième socle de \
Trafalgar Square et pose cette copie, renversée, sur l'original. En 2005, elle remplit \
la salle des turbines de la Tate Modern de quelque 14 000 boîtes blanches avec \
Embankment. Elle est faite dame de l'Empire britannique en 2019."""
style = """
Whiteread moule le vide : l'espace sous une chaise, dans une pièce, autour des livres \
d'une bibliothèque. Ce renversement rend solide ce qui est d'ordinaire invisible et \
transforme des objets familiers en monuments silencieux. Plâtre, béton, résine, \
caoutchouc : ses matériaux gardent l'empreinte des surfaces, comme des fossiles de la \
vie quotidienne. Son œuvre parle de mémoire, d'absence et de la trace laissée par les \
vies humaines."""

[[artistes]]
nom = "Yinka Shonibare"
vie = "Londres (Royaume-Uni), né le 9 août 1962"
biographie = """
Yinka Shonibare naît à Londres de parents nigérians ; à trois ans, il part avec sa \
famille à Lagos, où son père exerce comme avocat. Il revient en Grande-Bretagne à \
dix-sept ans pour terminer ses études secondaires. À dix-huit ans, alors qu'il \
commence une école d'art, une myélite transverse le laisse en partie paralysé : il \
doit réapprendre les gestes les plus simples, et travaille depuis avec une équipe \
d'assistants. Il étudie à la Byam Shaw School of Art puis à Goldsmiths, à Londres, \
dont il sort à la fin des années 1980, dans la génération des Young British Artists. À \
partir de 1994, il fait du tissu wax son matériau de prédilection. Il en habille des \
mannequins sans tête, dans des scènes inspirées de la peinture anglaise du XVIIIᵉ \
siècle, comme Mr and Mrs Andrews Without Their Heads (1998), d'après Gainsborough, ou \
de l'histoire coloniale, comme Scramble for Africa (2003). Il est retenu pour le \
Turner Prize en 2004, entre à la Royal Academy en 2013 et dirige à Londres un espace \
pour jeunes artistes, Guest Projects. Il est fait commandeur de l'Empire britannique \
en 2019."""
style = """
Shonibare a pour arme le tissu wax, qui semble « africain » mais raconte une histoire \
d'échanges entre l'Indonésie, les Pays-Bas, l'Angleterre et l'Afrique de l'Ouest. En \
habillant de ces étoffes les héros, les aristocrates et les symboles de l'Empire \
britannique, il interroge avec humour et élégance les notions d'identité, \
d'authenticité et de pouvoir colonial. Ses mannequins sans tête, ses navires et ses \
globes en tissu sont devenus des images marquantes de l'art post-colonial."""

[[artistes]]
nom = "Fernando Botero"
vie = "Medellín (Colombie), 19 avril 1932 – Monaco, 15 septembre 2023"
biographie = """
Fernando Botero naît à Medellín. Son père meurt quand il a quatre ans ; sa mère, \
couturière, élève seule ses enfants. À douze ans, il entre pour deux ans dans une \
école de matadors, et ses premiers dessins représentent des taureaux. En 1948, il \
publie des illustrations dans le supplément dominical du journal El Colombiano. \
Installé à Bogotá en 1951, il part l'année suivante pour l'Europe : à Madrid, il copie \
Velázquez et Goya au Prado ; il passe par Paris et vit à Florence en 1953 et 1954, où \
il étudie la peinture de la Renaissance. En peignant une nature morte à la mandoline, \
il découvre l'effet produit par des formes gonflées : ce sera son style. Il vit \
ensuite une douzaine d'années à New York, où le Museum of Modern Art achète sa Mona \
Lisa à douze ans en 1961, puis s'installe surtout à Paris. Il se met à la sculpture \
dans les années 1960 et expose ses bronzes au Grand Palais en 1977. Il peint aussi la \
violence en Colombie et, en 2004-2005, les tortures de la prison d'Abou Ghraib. Il a \
donné de nombreuses œuvres aux musées de Bogotá et de Medellín. Il meurt à Monaco à 91 \
ans."""
style = """
Le « boterisme » se reconnaît au premier coup d'œil : personnages, animaux et objets \
aux volumes dilatés, petits yeux, petites bouches, surfaces lisses et couleurs \
franches. Botero voulait célébrer la sensualité de la forme, héritée des maîtres de la \
Renaissance et de l'art populaire latino-américain. Derrière l'humour, son œuvre se \
fait aussi critique, de la bourgeoisie, de l'Église, de la dictature ou de la guerre."""

[[artistes]]
nom = "Yue Minjun"
vie = "Daqing (Chine), né en 1962"
biographie = """
Yue Minjun naît à Daqing, dans la province du Heilongjiang, au nord-est de la Chine, \
dans une famille de travailleurs du pétrole. Après le lycée, il devient électricien en \
1983 et, lors de campagnes de forage en mer, peint le portrait de ses collègues. Il \
étudie la peinture à l'huile à l'université normale du Hebei. En 1990, il s'installe à \
Hongmiao, dans la banlieue de Pékin, où vivent de nombreux artistes, et commence à \
peindre son propre visage secoué d'un rire forcé. Ces autoportraits multipliés, aux \
couleurs criardes, le font connaître au milieu des années 1990, alors que l'art \
contemporain chinois commence à être exposé en Occident. Le critique Li Xianting le \
range parmi les « réalistes cyniques », avec Fang Lijun, une étiquette qu'il récuse. \
Ses tableaux atteignent bientôt des prix record. Il vit et travaille à Pékin, où il \
réalise peintures, sculptures, aquarelles et estampes, toutes habitées par le même \
personnage hilare, coiffé parfois de chapeaux ou placé dans des décors empruntés à \
l'histoire de l'art."""
style = """
Le style de Yue Minjun repose sur un motif unique, répété à l'infini : son propre \
visage, bouche ouverte, yeux fermés, figé dans un rire hystérique. Couleurs vives, \
rose chair et bleu ciel, compositions simples proches de l'affiche : cette image \
presque publicitaire cache une satire de l'uniformité, de la société de consommation \
et de ce qu'on ne peut pas dire. Elle est devenue l'une des icônes de l'art chinois \
contemporain."""

[[artistes]]
nom = "Eduardo Chillida"
vie = "Saint-Sébastien (Espagne), 10 janvier 1924 – Saint-Sébastien, 19 août 2002"
biographie = """
Eduardo Chillida naît à Saint-Sébastien, au Pays basque. Jeune homme, il se destine au \
football, mais une blessure l'oblige à renoncer. Il étudie l'architecture à Madrid de \
1943 à 1946, puis se tourne vers le dessin et la sculpture. En 1948, il part pour \
Paris, où il modèle d'abord des figures de plâtre inspirées de la sculpture grecque \
archaïque. De retour au Pays basque, il découvre le fer en travaillant chez un \
forgeron près d'Hernani : c'est le début d'une œuvre abstraite, forgée, qui le fait \
vite connaître. Il expose à la Biennale de Venise en 1958 et reçoit de nombreux prix, \
dont le prix Carnegie en 1964, le prix Wolf en 1985, le prix Prince des Asturies en \
1987 et le Praemium Imperiale en 1991. Il travaille aussi l'albâtre, le granit, \
l'acier et la terre. Ses grandes œuvres publiques jalonnent l'Europe, jusqu'à la \
sculpture Berlin, installée en 2000 devant la Chancellerie fédérale. Près d'Hernani, \
il aménage le musée en plein air Chillida-Leku, autour d'une vieille ferme basque. Il \
meurt dans sa ville natale en 2002."""
style = """
Chillida sculpte l'espace autant que la matière. Ses formes de fer ou d'acier se \
recourbent, s'emboîtent, s'ouvrent pour envelopper un vide qu'elles ne referment \
jamais. Il cherchait à rendre présent ce qui n'a pas de forme, comme le vent, la \
lumière ou l'horizon. Sa sculpture, abstraite mais ancrée dans la terre basque, ses \
forges et ses paysages, a marqué l'art public de la seconde moitié du XXᵉ siècle."""

[[artistes]]
nom = "Sokari Douglas Camp"
vie = "Buguma (Nigeria), née en 1958"
biographie = """
Sokari Douglas Camp naît à Buguma, ville kalabari du delta du Niger, au Nigeria. Elle \
est en partie élevée par son beau-frère, l'anthropologue britannique Robin Horton, \
spécialiste de la culture kalabari, ce qui lui ouvre très tôt une double culture. Elle \
étudie au California College of Arts and Crafts d'Oakland, puis à la Central School of \
Art and Design de Londres, de 1980 à 1983, et au Royal College of Art, de 1983 à 1986. \
Installée à Londres, elle choisit l'acier, qu'elle découpe et soude, pour représenter \
les fêtes, les danses et les mascarades de son enfance, mais aussi la vie quotidienne \
et les combats politiques du Nigeria. En 1998 et 1999, le Muséum américain d'histoire \
naturelle de New York lui consacre l'exposition Spirits in Steel. Elle crée Battle \
Bus, un mémorial à l'écrivain Ken Saro-Wiwa, exécuté en 1995 pour avoir défendu le \
peuple ogoni contre les dégâts de l'industrie pétrolière. En 2012, son mémorial contre \
l'esclavage, All the World is Now Richer, est présenté au Parlement britannique. Elle \
est faite commandeur de l'Empire britannique en 2005 ; ses œuvres figurent au British \
Museum et à la Smithsonian Institution."""
style = """
Sokari Douglas Camp fait de l'acier, matériau industriel et lourd, des figures pleines \
de mouvement et de fête. Ses sculptures ajourées, souvent animées de détails, de \
tissus ou d'objets, retrouvent l'énergie des mascarades kalabari. Entre le Nigeria et \
Londres, elle fait dialoguer traditions africaines, histoire coloniale et engagement \
politique, notamment pour le delta du Niger, abîmé par l'exploitation du pétrole."""
