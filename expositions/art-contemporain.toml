# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « SCULPTURE MODERNE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/art-contemporain/). Le
#  nom du fichier donne l'adresse de l'exposition sur le site : /art-contemporain.
#
#  Les œuvres exposées, de 1875 à 1916, sont dans le domaine public ; leurs
#  photographies sont publiées sous licence CC0 par les musées qui les
#  conservent (Cleveland, Chicago, Washington et New York).
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 210
nom_court = "Sculpture moderne"
mouvement = "Sculpture moderne, de Rodin au futurisme"
cadre = "aucun"
couleur = "#9a4a2c"
titre = "Aux sources de la sculpture d'aujourd'hui, de Rodin à Gaudier-Brzeska"
artiste = "Rodin, Lehmbruck, Saint-Gaudens, Barlach, Boccioni, Duchamp-Villon, Rosso, Gaudier-Brzeska"
dates = "1875–1916"
accroche = "Exposition virtuelle · Tate Modern, Londres"
introduction = """
Comment la sculpture est-elle devenue moderne ? En une quarantaine d'années, de \
L'Âge d'airain de Rodin aux têtes taillées par Gaudier-Brzeska à la veille de la \
Grande Guerre, les sculpteurs renoncent au récit et à l'allégorie pour faire parler \
le corps, la matière et le mouvement. La visite réunit dix œuvres de huit artistes, \
français, allemands, italiens et américain : de grands corps nus, des monuments à la \
mémoire, le futurisme qui veut sculpter la vitesse, le cubisme qui taille la forme \
en facettes, des visages qui se dissolvent dans la lumière ou se changent en idoles. \
Les œuvres d'aujourd'hui étant protégées par le droit d'auteur, l'exposition remonte \
à leurs sources : sans ces pionniers, ni Giacometti, ni Moore, ni Louise Bourgeois \
n'auraient sculpté comme ils l'ont fait. Le bâtiment s'inspire de la Tate Modern à \
Londres : un hall, puis la nef immense de l'ancienne salle des turbines, et trois \
galeries en enfilade au nord."""
vitrine = "age-d-airain.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Tate Modern"
ville = "Londres, Royaume-Uni"
architecte = "Giles Gilbert Scott (la centrale) ; Herzog & de Meuron (le musée)"
construction = "1947–1963 (la centrale) ; musée ouvert en 2000"
presentation = """
Sur la rive sud de la Tamise, face à la cathédrale Saint-Paul, la centrale électrique \
de Bankside est construite en deux étapes, de 1947 à 1963, sur les plans de Sir Giles \
Gilbert Scott, l'architecte de la centrale de Battersea. Ce long bâtiment de brique, \
dominé par une cheminée de 99 mètres, cesse de fonctionner en 1981. En 1995, la Tate \
choisit les architectes suisses Herzog & de Meuron pour en faire son musée d'art \
moderne et contemporain. Ils gardent l'enveloppe de brique, posent sur le toit une \
longue boîte de verre lumineuse et font de l'ancienne salle des turbines, vidée de ses \
machines, une nef de 3 400 mètres carrés qui traverse tout le bâtiment et où l'on \
descend par une rampe en pente douce. La reine Élisabeth II inaugure la Tate Modern le \
11 mai 2000. Chaque année, un artiste est invité à occuper cette nef : Louise \
Bourgeois ouvre la série en 2000. En 2016, une tour de brique ajourée, aujourd'hui le \
Blavatnik Building, agrandit le musée, dont les collections permanentes sont \
gratuites."""
ici = """
Le bâtiment d'ARTEON reprend l'idée maîtresse de la Tate Modern : une nef immense \
entre la rue et les galeries. On entre par le sud dans le hall sud, puis on débouche \
dans le Turbine Hall, long de 44 mètres et haut de 20, aux murs de béton clair, où \
sont accrochés les grands corps : L'Âge d'airain et l'Adam de Rodin, la Femme debout \
de Lehmbruck et la Victoire dorée de Saint-Gaudens. Au nord, comme les galeries \
tournées vers la Tamise, trois salles blanches communiquent en enfilade, d'ouest en \
est : « Mémoire et monuments », avec Rodin et Barlach, « Le mouvement », avec \
Boccioni et Duchamp-Villon, puis « Des visages nouveaux », avec Medardo Rosso et \
Gaudier-Brzeska."""

