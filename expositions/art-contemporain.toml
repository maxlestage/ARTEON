# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "L'Âge d'airain"
artiste = "Auguste Rodin"
annee = "1875–1876"
image = "age-d-airain.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1918.328"
technique = "Bronze, grandeur nature ; fonte commandée en 1916 et surveillée par l'artiste"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "Un jeune homme nu s'éveille, la main sur la tête : si vrai qu'on accusa Rodin de l'avoir moulé sur un modèle vivant."
description = """
Un jeune homme nu, grandeur nature, se tient debout sur un socle carré. Son bras \
droit est replié au-dessus de sa tête, la main posée sur le sommet du crâne, comme \
s'il sortait du sommeil ou d'un rêve. Le bras gauche est levé lui aussi, plié au \
coude, le poing fermé à hauteur du visage autour d'un objet qui n'est plus là. Le \
visage, tourné vers le haut, a les yeux mi-clos et la bouche entrouverte. Les jambes \
sont rapprochées, un genou légèrement fléchi, et tout le corps semble monter, des \
pieds jusqu'au coude dressé. Sur le fond gris de la photographie, le bronze très \
sombre garde des reflets rougeâtres là où la lumière accroche les épaules, le torse \
et les cuisses, et une ombre légère s'étire derrière la statue."""
evocation = """
Quand il la montre pour la première fois, à Bruxelles, Rodin appelle sa figure Le \
Vaincu, et le jeune homme tient une lance : on y a vu un soldat blessé, peut-être un \
écho de la défaite française de 1870. En retirant l'arme, le sculpteur efface \
l'anecdote. Le titre définitif renvoie aux âges de l'humanité imaginés par les poètes \
antiques ; on y lit l'éveil de l'homme à la conscience, l'humanité qui sort de la \
nuit. Rodin laisse pourtant le sens ouvert : sans attribut ni récit, c'est le corps \
seul, son élan et sa fatigue, qui porte l'émotion. Pour le musée de Cleveland, cette \
figure énigmatique dit la sensualité et la puissance psychologique du nu masculin. \
C'est là que commence la sculpture moderne : une statue qui ne raconte plus d'histoire."""
histoire = """
Rodin, qui vit alors à Bruxelles, travaille de longs mois à cette figure d'après un \
jeune soldat belge, avant et après un voyage en Italie où il découvre Michel-Ange. \
Présenté à Bruxelles au début de 1877, puis au Salon de Paris la même année, le \
plâtre fait scandale : le modelé est si exact qu'on soupçonne le sculpteur d'avoir \
moulé directement le corps de son modèle, une tricherie aux yeux de l'Académie. Rodin \
se défend par des photographies et des témoignages ; en 1880, l'État lui achète \
l'œuvre et en fait fondre un bronze. Le tirage de Cleveland a une histoire à part : \
en 1916, Ralph King, administrateur du musée, le commande à l'artiste pour l'offrir à \
l'institution. Rodin, alors à la fin de sa vie, en surveille lui-même la fonte, d'une \
qualité exceptionnelle selon le musée."""
facture = """
Rodin modèle sa figure en terre en tournant autour de son modèle, profil après \
profil, pour saisir le corps sous tous les angles : il gardera cette méthode toute sa \
vie. Il en résulte une surface d'une grande finesse, où les muscles ne sont pas \
soulignés comme dans les figures d'école, mais se devinent sous la peau, dans le jeu \
de la lumière. C'est cette justesse même qui fit naître le soupçon de moulage. Le \
tirage de Cleveland a reçu la patine que préférait le sculpteur, d'un rouge sombre \
qu'il appelait, rapporte le musée, « raisin écrasé » ; on la devine sur la \
photographie. Privé de sa lance, le poing gauche reste fermé sur le vide, et ce geste \
suspendu ajoute au mystère de la figure."""
details = [
  "La main droite posée sur le sommet du crâne, comme au sortir du sommeil.",
  "Le poing gauche refermé sur une lance disparue.",
  "Les yeux mi-clos et la bouche entrouverte du visage levé.",
  "Les reflets rougeâtres de la patine sur les épaules et le torse.",
  "Le socle carré, nu, sans rocher ni accessoire.",
]
themes = ["éveil", "corps", "jeunesse", "bronze", "scandale"]
anecdote = """
Pour prouver sa bonne foi, Rodin fit photographier son modèle, un jeune soldat belge \
nommé Auguste Neyt, afin qu'on puisse comparer le corps vivant et la statue, et \
demanda à d'autres sculpteurs de témoigner qu'il modelait sans moulage."""
salle = 2
mur = "ouest"
place = 3
largeur = 3.2

[[oeuvres]]
titre = "Adam"
artiste = "Auguste Rodin"
annee = "modèle de 1881"
image = "adam.jpg"
cadre = "noir"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/11320"
technique = "Bronze à patine brun foncé, fondu vers 1924 ; 198,1 × 73,7 cm, base de 76,2 × 73,7 cm"
collection = "Art Institute of Chicago, Chicago"
note = "Conçu pour se dresser devant La Porte de l'Enfer, le premier homme semble à la fois naître et s'effondrer."
description = """
Un homme nu, puissamment musclé, se tient debout sur une base rocheuse, mais rien en \
lui n'est droit. Sa tête retombe lourdement de côté, presque couchée sur l'épaule, \
comme si le cou ne pouvait plus la porter. Une jambe est levée, le pied posé sur une \
pierre, le genou ramené en avant ; une main s'y agrippe, au bout d'un bras tordu qui \
traverse le corps. L'autre bras pend le long du flanc, l'index tendu vers le sol. Les \
épaules, la poitrine et les avant-bras sont noueux, creusés de muscles et de veines. \
Sur la photographie, prise de trois quarts devant un fond gris clair, la patine brun \
foncé brille sur les reliefs et laisse les creux dans l'ombre, si bien que la figure \
paraît sculptée par la lumière."""
evocation = """
Rodin a puisé chez Michel-Ange, comme le rappelle l'Art Institute de Chicago. La pose \
vient de la Création d'Adam peinte au plafond de la chapelle Sixtine : Rodin redresse \
la figure couchée de la fresque et transporte dans le bras droit de sa statue le \
geste par lequel Adam reçoit la vie. La torsion du bras gauche vient d'une autre \
œuvre de Michel-Ange, le Christ mort de la Pietà de Florence. Rodin mêle ainsi la \
naissance et la mort : le premier homme, à peine tiré de la terre, porte déjà le \
poids de la faute qu'il transmettra à l'humanité. Devant La Porte de l'Enfer, il \
devait accueillir le visiteur avec Ève, le couple par qui, selon la Bible, le mal \
entre dans le monde."""
histoire = """
En 1880, l'État commande à Rodin une porte de bronze pour un futur musée des Arts \
décoratifs, à Paris ; le sculpteur choisit L'Enfer de Dante. Il prévoit d'encadrer \
cette Porte de l'Enfer par deux grandes figures, Adam et Ève, et modèle Adam dès \
1881. Mais le musée ne voit jamais le jour, la porte n'est pas fondue du vivant de \
l'artiste, et les deux statues prennent leur indépendance. Rodin ne cesse pourtant de \
réutiliser sa figure : il en tire Les Trois Ombres, qui couronnent la Porte. En \
1916, il donne à l'État son œuvre avec le droit d'en tirer des épreuves ; c'est ainsi \
que le bronze de Chicago a été fondu vers 1924, quelques années après sa mort, \
d'après son modèle."""
facture = """
Adam mesure près de deux mètres : il est plus grand que nature, et Rodin exagère \
encore ce que la nature propose. Les mains sont énormes, le cou se casse presque à \
angle droit, le buste se tord dans un sens et les jambes dans l'autre. Aucun modèle \
ne pourrait tenir longtemps cette pose, qui n'a rien d'un équilibre ; c'est le \
rocher, sous le pied levé, qui semble retenir la figure. Le modelé procède par bosses \
et par creux, accentue les tendons et les veines, et laisse çà et là la trace de la \
main. La base rocheuse, à peine dégrossie, fait partie de l'œuvre : le premier homme \
sort encore de la matière brute dont il a été formé."""
details = [
  "La tête qui retombe, presque à angle droit avec le cou.",
  "L'index pointé vers le sol, repris du geste de l'Adam de Michel-Ange.",
  "Le bras tordu qui traverse le corps pour saisir le genou.",
  "Le pied crispé sur une pierre, les orteils agrippés.",
  "Les veines saillantes des avant-bras et des mains.",
]
themes = ["création", "dante", "michel-ange", "corps", "faute"]
anecdote = """
Au sommet de La Porte de l'Enfer, Les Trois Ombres sont trois tirages d'une même \
figure tirée d'Adam, disposés en cercle, têtes penchées, comme trois damnés qui \
montrent l'abîme. Rodin aimait ainsi répéter et assembler une même forme."""
salle = 2
mur = "est"
place = 3
largeur = 3.2

[[oeuvres]]
titre = "Femme debout (Stehende weibliche Figur)"
artiste = "Wilhelm Lehmbruck"
annee = "modèle de 1910"
image = "femme-debout.jpg"
cadre = "noir"
credit = "Photo : National Gallery of Art"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.50290.html"
technique = "Bronze, fondu à Munich en 1957 ; 191,2 × 54 × 39,9 cm"
collection = "National Gallery of Art, Washington"
note = "Grande, calme, les yeux baissés, une femme retient son drapé : en 1910, à Paris, Lehmbruck cherche la paix des formes."
description = """
Une femme nue se tient debout, presque immobile, sur une base basse aux bords \
irréguliers. Sa main droite retient sur la hanche un drap qui glisse et enveloppe ses \
jambes jusqu'aux chevilles, en longs plis verticaux. La main gauche pend, ouverte, le \
long du corps. La tête, petite, s'incline doucement de côté et vers le bas ; les \
paupières baissées, les traits réguliers, elle semble absorbée dans ses pensées. Les \
cheveux sont tirés en arrière. Le corps est solide, aux hanches larges et aux épaules \
arrondies, mais les jambes, gainées par l'étoffe, l'allongent comme une colonne. Sur \
le fond blanc de la photographie, la patine sombre, verdâtre par endroits, se couvre \
de reflets clairs sur la poitrine, le ventre et les genoux."""
evocation = """
Rien ne raconte ici une histoire : ni nom de déesse, ni attribut. Le geste de retenir \
un drapé rappelle les Vénus antiques sortant du bain, mais Lehmbruck en fait un \
moment de recueillement silencieux. La figure dit le calme, la retenue, une présence \
tournée vers l'intérieur. Cette paix presque classique montre ce que le jeune \
sculpteur allemand est venu chercher à Paris : une sculpture fondée sur la masse et \
l'équilibre, proche de celle de Maillol. Mais la tête inclinée et le regard baissé \
annoncent déjà la mélancolie de ses figures suivantes, de plus en plus étirées, qui \
feront de lui l'un des grands sculpteurs de l'expressionnisme allemand et l'un des \
premiers à dire, par le corps seul, la détresse de son temps."""
histoire = """
Formé à l'Académie des beaux-arts de Düsseldorf, Wilhelm Lehmbruck s'installe à Paris \
en 1910 avec sa famille, et y reste jusqu'à la guerre. Il expose au Salon \
d'automne, étudie Rodin et Maillol, se lie avec des artistes venus de toute l'Europe, \
comme Brancusi, Archipenko ou Modigliani. Cette Femme debout appartient à ses \
premières années parisiennes ; dès l'année suivante, sa Femme agenouillée, aux \
membres démesurément allongés, marque un tournant. Le tirage de Washington a été fondu à Munich en 1957, près de quarante ans après \
la mort de l'artiste, d'après son modèle de 1910."""
facture = """
Lehmbruck modèle sa figure à l'échelle humaine : avec sa base, elle mesure 1,91 \
mètre. Il simplifie les volumes, renonce aux détails anatomiques et donne au corps un \
modelé large et doux, où la lumière glisse sans accroc. Le drapé joue un rôle de \
construction : ses plis verticaux, serrés autour des jambes, fondent la figure dans \
un seul bloc et lui donnent la stabilité d'une colonne. La tête, un peu petite pour \
le corps, laisse deviner l'allongement des œuvres à venir. La surface n'est pas \
lisse partout : les cheveux, en particulier, gardent un grain plus rugueux, et la \
patine sombre, mêlée de vert, accroche la lumière par plaques."""
details = [
  "La main qui retient le drapé sur la hanche.",
  "Les plis verticaux de l'étoffe, comme les cannelures d'une colonne.",
  "La tête inclinée et les paupières baissées.",
  "Les cheveux tirés en arrière, au modelé plus grenu.",
  "Les pieds nus qui dépassent du drapé, sur la base irrégulière.",
]
themes = ["femme", "calme", "drapé", "classicisme", "mélancolie"]
anecdote = """
À Duisbourg, sa ville, un musée porte le nom de Wilhelm Lehmbruck depuis 1964. Son \
bâtiment de verre et de béton a été dessiné par son fils, l'architecte Manfred \
Lehmbruck."""
salle = 2
mur = "sud"
place = 4
largeur = 2.9

[[oeuvres]]
titre = "La Victoire"
artiste = "Augustus Saint-Gaudens"
annee = "1892–1903"
image = "victoire.jpg"
cadre = "noir"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/12019"
technique = "Bronze doré, fondu entre 1914 et 1916 ; 96,5 × 24,1 × 47 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Ailes déployées, palme en main : la Victoire dorée qui guide à New York le général Sherman, en réduction."
description = """
Une femme ailée, vêtue d'une longue robe qui flotte derrière elle, avance d'un pas \
décidé sur un rocher. Tout le bronze est doré. Son bras droit se tend vers l'avant et \
vers le haut, comme pour montrer le chemin ; de l'autre main, elle serre contre sa \
poitrine une longue palme, d'un métal plus sombre. Une couronne de laurier retient \
ses cheveux noués. Ses grandes ailes, aux plumes finement ciselées, s'ouvrent dans son \
dos. Le vent plaque la robe contre ses jambes et la fait claquer en arrière, \
découvrant un pied chaussé d'une sandale. Vue de profil sur la photographie, la \
figure dessine une grande diagonale, du poing tendu à la pointe des ailes. Sur \
l'avant de la base, on devine une inscription gravée."""
evocation = """
La Victoire est une figure de l'Antiquité : la Niké des Grecs, ailée, messagère du \
triomphe, dont la Victoire de Samothrace, au Louvre, est l'exemple le plus célèbre. \
Saint-Gaudens la fait marcher devant le cheval du général William Tecumseh Sherman, \
l'un des chefs nordistes de la guerre de Sécession. Elle ne combat pas : elle guide, \
le bras tendu, et la palme qu'elle porte annonce la victoire autant que la paix \
revenue. Mais son visage n'a rien d'une déesse de convention : c'est celui d'une femme \
réelle, attentive, presque grave. Au milieu des corps nus de Rodin et de Lehmbruck, \
elle représente l'autre voie de la sculpture autour de 1900, celle de l'allégorie \
monumentale, portée ici à sa perfection juste avant de disparaître."""
histoire = """
Après la mort du général Sherman, en 1891, Saint-Gaudens reçoit la commande d'un \
monument équestre à sa mémoire pour New York. Il y travaille plus de dix ans, en \
partie à Paris, où il installe son atelier à la fin des années 1890 et où il présente \
le plâtre à l'Exposition universelle de 1900. Le monument, en bronze doré, est \
inauguré en 1903 à l'entrée sud-est de Central Park, sur Grand Army Plaza : le \
général à cheval y suit la Victoire qui marche devant lui. Des réductions de la \
Victoire seule ont ensuite été tirées. Celle du Metropolitan Museum, d'un peu moins \
d'un mètre de haut, a été fondue entre 1914 et 1916, quelques années après la mort du \
sculpteur."""
facture = """
Saint-Gaudens, formé à l'École des beaux-arts de Paris, possède toute la science de \
la sculpture académique, mais il la met au service d'un réalisme vivant. La \
réduction garde la précision du grand monument : chaque plume des ailes est \
ciselée, chaque pli de la robe suit le mouvement du corps et la poussée du vent. La \
composition repose sur le contraste entre la verticale du corps et les obliques du \
bras, des ailes et du drapé, qui donnent l'impression d'une marche rapide. La dorure \
uniforme, qui rappelle l'or du monument new-yorkais, fait de la figure un bloc de \
lumière ; seule la palme, d'un ton plus sombre, se détache sur elle et attire le \
regard vers le cœur de la composition."""
details = [
  "La couronne de laurier dans les cheveux noués.",
  "La palme, d'un métal plus sombre que la dorure.",
  "Les plumes des ailes, ciselées une à une.",
  "La sandale du pied qui avance, sous la robe soulevée par le vent.",
  "L'inscription gravée sur l'avant de la base.",
]
themes = ["victoire", "allégorie", "or", "monument", "amérique"]
anecdote = """
Pour le visage de la Victoire, Saint-Gaudens fit poser Hettie Anderson, une jeune \
femme afro-américaine qui fut l'un de ses modèles favoris ; on lui attribue aussi le \
profil de la Liberté qu'il dessina en 1907 pour une pièce d'or de vingt dollars."""
salle = 2
mur = "sud"
place = 10
largeur = 2.9

[[oeuvres]]
titre = "Tête de Pierre de Wissant (Les Bourgeois de Calais)"
artiste = "Auguste Rodin"
annee = "1886"
image = "pierre-de-wissant.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1920.120"
technique = "Bronze ; tête de grande taille, dite « héroïque »"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "L'un des six bourgeois qui s'offrirent à la mort pour sauver Calais : Rodin isole sa tête, ravagée par l'angoisse."
description = """
Une tête d'homme se dresse sur un cou épais, sans épaules, détachée de tout corps. \
Elle est légèrement penchée et tournée de côté. Les paupières, lourdes, sont presque \
fermées ; la bouche s'entrouvre, un peu de travers, comme dans un soupir ou une \
plainte. Les sourcils se contractent et le front se plisse. Les cheveux courts ne sont \
pas dessinés mèche par mèche : ils forment une masse rugueuse, comme pétrie à grands \
coups de pouce. Les oreilles sont saillantes, et un léger bourrelet ceint le cou. Le \
bronze sombre, aux reflets verts, est patiné et brillant : la lumière glisse sur les \
pommettes, le nez et le menton, tandis que l'ombre envahit les orbites. Sur le fond \
gris foncé de la photographie, la tête semble surgir seule de la nuit."""
evocation = """
En 1347, après un long siège, Calais doit se rendre au roi d'Angleterre Édouard III. \
Selon le chroniqueur Froissart, le roi exige que six notables sortent de la ville, \
tête et pieds nus, la corde au cou, pour lui remettre les clés et être mis à mort. \
Eustache de Saint-Pierre se désigne le premier, et cinq autres le suivent, dont \
Pierre de Wissant ; la reine Philippa de Hainaut obtiendra leur grâce. Rodin ne \
montre pas des héros triomphants, mais des hommes qui marchent vers la mort, chacun \
seul avec sa peur. Sur ce visage, comme le note le musée de Cleveland, l'angoisse dit \
une souffrance morale extrême : le monument ne célèbre pas la gloire, il fait sentir \
le prix du sacrifice."""
histoire = """
En 1884, la ville de Calais commande à Rodin un monument à Eustache de Saint-Pierre. \
Le sculpteur propose de représenter les six bourgeois ensemble, au même niveau, sans \
hiérarchie, ce qui déconcerte ses commanditaires. Il étudie chaque homme séparément, \
d'abord nu, puis vêtu, et modèle les têtes à part. Selon le musée de Cleveland, il \
expose une version grandeur nature de Pierre de Wissant comme une œuvre indépendante \
avant même l'achèvement du monument, puis en réalise de nombreuses versions, de \
tailles et de matériaux différents. Le groupe est inauguré à Calais en 1895, posé sur \
un haut socle, alors que Rodin aurait voulu le voir presque au niveau du sol, au \
milieu des passants."""
facture = """
Rodin isole la tête comme un fragment : plus de corps, plus de récit, seulement \
l'expression. Détacher une partie, l'agrandir, la réduire, la combiner à d'autres : \
ce procédé est au cœur de son travail, et ses héritiers en feront une règle. Dans le \
vocabulaire des sculpteurs, une tête « héroïque » est plus grande que nature. Le \
modelé est ici d'une grande vigueur : la chevelure garde l'empreinte des doigts, les \
joues et le front se creusent et se gonflent pour accrocher la lumière. Le visage \
n'est pas symétrique, la bouche glisse de côté, une paupière tombe plus que l'autre ; \
c'est ce déséquilibre, plus que tout détail, qui rend l'angoisse visible."""
details = [
  "Les paupières lourdes, presque closes.",
  "La bouche entrouverte, légèrement de travers.",
  "Les cheveux rugueux, modelés à grands coups de pouce.",
  "Le cou épais, coupé net, sans épaules.",
  "Les reflets verts de la patine sur le front et les joues.",
]
themes = ["mémoire", "sacrifice", "angoisse", "monument", "fragment"]
anecdote = """
Les Bourgeois de Calais sont aussi à Londres : un exemplaire du groupe se dresse \
depuis 1915 dans les jardins de la tour Victoria, au pied du Parlement, à quelques \
kilomètres en amont de la Tate Modern, sur l'autre rive de la Tamise."""
salle = 3
mur = "nord"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "Le Vengeur (Der Rächer)"
artiste = "Ernst Barlach"
annee = "1914"
image = "le-vengeur.jpg"
cadre = "noir"
credit = "Photo : National Gallery of Art"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.206701.html"
technique = "Bronze"
collection = "National Gallery of Art, Washington"
note = "Enveloppé dans son manteau, un homme brandit une épée et fonce en avant : l'élan guerrier de 1914, saisi par Barlach."
description = """
Un homme se jette en avant, le corps presque à l'horizontale, comme lancé dans une \
course furieuse. Il est tout entier pris dans un ample manteau qui forme un bloc \
anguleux, aux grands pans plats, comme taillés dans du bois. De ce bloc ne sortent \
que la tête, les bras et un pied nu, qui prend appui sur une base rectangulaire. Les \
bras, levés au-dessus de la tête, serrent une épée dont la lame passe en arc \
au-dessus du dos, prête à s'abattre. Le visage, petit, aux yeux grands ouverts, fixe \
droit devant lui. Le bronze brun, à la surface finement martelée, porte çà et là des \
taches vertes. Sur le fond gris clair de la photographie, la silhouette dessine un \
coin pointé vers l'avant, et son ombre s'allonge sur le sol."""
evocation = """
Le titre désigne un justicier, celui qui rend coup pour coup. Comme beaucoup \
d'artistes et d'écrivains allemands, Barlach partage d'abord l'enthousiasme qui \
saisit le pays en août 1914, et Le Vengeur porte la marque de cet élan : la guerre y \
apparaît comme une juste revanche, une force qui balaie tout. Pourtant la figure n'a \
ni uniforme ni arme moderne ; c'est une force élémentaire, une bourrasque plus qu'un \
soldat. Barlach se détournera vite de cette exaltation : brièvement mobilisé, il \
devient un adversaire de la guerre, et ses monuments aux morts d'après 1918 seront \
des œuvres de deuil et de recueillement. Le Vengeur reste le témoin d'un moment \
d'aveuglement collectif, au seuil du désastre."""
histoire = """
En 1914, Ernst Barlach a quarante-quatre ans. Depuis 1910, il vit à Güstrow, petite \
ville du Mecklembourg, et son marchand berlinois, Paul Cassirer, le soutient depuis \
plusieurs années. Il a trouvé son style après un voyage en Russie, en 1906, d'où il \
a rapporté des figures de paysans et de mendiants massives et enveloppées. Le \
Vengeur naît dans les premiers mois de la guerre : Barlach y applique ce langage de \
blocs drapés à un sujet d'actualité. Vingt ans plus tard, son œuvre sera jugée \
« dégénérée » par les nazis, ses monuments aux morts, trop peu héroïques à leurs \
yeux, retirés des églises et des places, et des centaines de ses œuvres saisies \
dans les musées allemands."""
facture = """
Barlach est d'abord un sculpteur sur bois, et cela se voit même dans le bronze : les \
formes sont découpées en grands plans nets, à arêtes vives, héritées de la sculpture \
médiévale allemande et des figurines populaires. Le corps disparaît sous le manteau, \
réduit à une masse géométrique, une sorte de coin incliné vers l'avant. Les seuls \
détails sont le visage, les mains et le pied, qui rendent la figure humaine. Le \
mouvement naît de la diagonale et des plis rabattus vers l'arrière, comme par le vent \
de la course. Au même moment, les futuristes italiens cherchent à sculpter la \
vitesse en éclatant la forme ; Barlach obtient l'élan par le moyen inverse, une \
masse compacte et fermée."""
details = [
  "La lame de l'épée, courbée en arc au-dessus du dos.",
  "Le pied nu, seul appui de toute la masse lancée en avant.",
  "Les grands pans plats du manteau, comme taillés à la hache.",
  "Le petit visage aux yeux grands ouverts, pris dans le col.",
  "Les taches vertes de la patine sur le bronze brun.",
]
themes = ["guerre", "élan", "colère", "mémoire", "expressionnisme"]
anecdote = """
Pour l'ange suspendu qu'il crée en 1927 dans la cathédrale de Güstrow, en mémoire \
des morts de la guerre, Barlach donne au visage les traits de Käthe Kollwitz. Les \
nazis le firent fondre ; une seconde fonte, cachée pendant la guerre, permit de le \
refaire."""
salle = 3
mur = "nord"
place = 3
largeur = 2.8

[[oeuvres]]
titre = "Antigracieux (Antigrazioso)"
artiste = "Umberto Boccioni"
annee = "1913"
image = "antigracieux.jpg"
cadre = "noir"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/485518"
technique = "Bronze, fondu en 1950 ; 58,4 × 53,3 × 41,9 cm, 47,6 kg"
collection = "Metropolitan Museum of Art, New York"
note = "Le visage de sa mère, une maison et la lumière se mêlent en un seul bloc : la sculpture futuriste selon Boccioni."
description = """
Sur un haut pilier de bois brut, fendu dans sa longueur, est posé un buste de bronze \
qu'on peine d'abord à lire. On reconnaît pourtant une tête de femme âgée, aux yeux \
plissés, au nez fort, à la bouche tordue, mais tous les traits semblent bousculés, \
déplacés, comme froissés par une force venue du dehors. Les joues et le menton se \
boursouflent en lobes. Au sommet de la tête se dressent des formes renflées, chignon \
ou chapeau, dont l'une, pointue, ressemble à un bourgeon. Derrière, un bloc \
géométrique aux arêtes vives, pareil à un pan de mur ou à la façade d'une maison, \
s'enfonce dans le crâne. À gauche, une sorte d'équerre jaillit dans le vide. Le \
bronze brun-vert luit sur un fond gris."""
evocation = """
Le modèle est la mère de l'artiste, qu'il a souvent peinte. Mais Boccioni ne cherche \
pas la ressemblance : le titre, Antigracieux, est une provocation contre la beauté \
aimable de la sculpture de salon et contre l'imitation des Grecs. Les futuristes \
veulent représenter non pas un objet isolé, mais l'objet mêlé à ce qui l'entoure, à \
la lumière, à la maison, à la rue, au mouvement de la vie moderne. Ici, la tête et la \
maison se pénètrent : le portrait devient l'expérience d'une personne dans son \
milieu, telle que la perçoit le regard et la mémoire. Sous la violence des formes \
perce pourtant une tendresse : celle d'un fils qui revient sans cesse au visage de \
sa mère pour y éprouver ses idées nouvelles."""
histoire = """
Peintre, signataire en 1910 du Manifeste des peintres futuristes, Umberto Boccioni \
se tourne vers la sculpture en 1912, après un séjour à Paris où il découvre la \
sculpture cubiste. Le 11 avril 1912, il publie le Manifeste technique de la \
sculpture futuriste, et en 1913 il présente ses premières sculptures à Paris, à la \
galerie La Boétie. Antigracieux date de cette année d'invention intense, la même que \
ses célèbres Formes uniques de la continuité dans l'espace. Boccioni meurt en 1916, \
à trente-trois ans, et une grande partie de ses plâtres disparaît après sa mort. Ce \
bronze a été fondu en 1950, plus de trente ans après, d'après le modèle de \
l'artiste."""
facture = """
Boccioni modèle en plâtre, matériau souple qui lui permet de creuser, d'ajouter, de \
trancher. Dans son manifeste, il demandait d'abolir la ligne fermée de la statue et \
de briser la tradition des matériaux nobles, marbre et bronze, au profit du verre, \
du bois, du carton, du fer, du ciment, du cuir, du tissu, des miroirs ou de la \
lumière électrique. L'ironie veut que son œuvre nous soit parvenue en bronze. Les \
formes alternent ici le plein et le creux, le bombé et le plat ; les plans du mur \
tranchent ceux du visage, si bien qu'on ne sait plus où finit la tête et où commence \
l'espace. La sculpture change d'aspect à chaque pas qu'on fait autour d'elle."""
details = [
  "Le bloc géométrique, comme un mur ou une maison, qui pénètre la tête.",
  "La forme pointue, pareille à un bourgeon, au sommet du crâne.",
  "Les yeux plissés, réduits à des fentes entre les bourrelets des joues.",
  "L'équerre de métal qui jaillit sur le côté gauche.",
  "Le pilier de bois brut, fendu, qui sert de socle.",
]
themes = ["futurisme", "mère", "portrait", "mouvement", "espace"]
anecdote = """
Boccioni a souvent pris sa mère pour modèle : elle trône aussi, mains croisées, au \
centre de son grand tableau La Matière (1912), où son corps se mêle à la ville et à \
la lumière qui l'entourent."""
salle = 4
mur = "nord"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "Le Coq gaulois"
artiste = "Raymond Duchamp-Villon"
annee = "modèle de 1916"
image = "coq-gaulois.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1972.227"
technique = "Bronze peint, relief ; fondu en 1919 d'après le plâtre de 1916"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "Sculpté par un soldat sculpteur près du front, le coq cubiste se dresse devant le soleil levant de la victoire."
description = """
Un médaillon ovale, bordé d'un large cadre noir au relief irrégulier, enferme un coq \
doré. L'oiseau est construit avec des formes géométriques : un corps en lame \
tranchante, une crête enroulée en volutes, des ailes et une queue faites de rubans \
plats empilés comme des marches, des pattes anguleuses. Il se dresse, la tête levée \
vers le haut du médaillon. Derrière lui, des rayons rouges, striés, s'élancent sur le \
fond noir ; en bas à gauche, une boule rouge figure le soleil. Le relief joue ainsi \
de trois couleurs, l'or, le rouge et le noir. Sur la photographie, prise légèrement de \
biais devant un fond gris, la dorure brille sur les arêtes et s'use par endroits, \
laissant paraître le métal."""
evocation = """
Le coq est l'emblème de la France, grâce à un jeu de mots latin : gallus désigne à \
la fois le coq et le Gaulois. Pendant la guerre, on le trouve partout, sur les \
affiches, les cartes postales, les médailles. Selon le musée de Cleveland, les \
soldats reconnaissaient dans ce coq et ce soleil levant des symboles de victoire. \
Duchamp-Villon fait de cette image patriotique une forme moderne, sans \
sentimentalité, mais lisible par tous : le coq chante à l'aube, après la nuit des \
tranchées. À côté du Vengeur de Barlach, l'œuvre montre l'autre visage de la guerre \
dans l'art, non plus l'élan du combat, mais l'espérance, sculptée par un homme qui \
ne verrait pas la paix."""
histoire = """
Mobilisé en 1914 dans le service de santé, lui qui avait commencé des études de \
médecine, Raymond Duchamp-Villon continue de sculpter pendant ses heures libres. \
Selon le musée de Cleveland, il taille le plâtre de ce relief en 1916, alors qu'il \
sert dans l'armée : il est destiné à l'entrée d'un théâtre provisoire construit près \
du front pour les soldats. La même année, il contracte la fièvre typhoïde. Il meurt \
à l'hôpital militaire de Cannes le 9 octobre 1918, un mois avant l'armistice. En \
1919, cinq bronzes sont fondus d'après son plâtre, en mémoire de l'artiste ; celui \
de Cleveland est l'un d'eux."""
facture = """
Le plâtre n'a pas été modelé mais taillé, d'où ces arêtes vives et ces plans nets. \
Le coq est réduit à des formes simples, lame, volute, ruban, qui s'emboîtent comme \
les pièces d'une machine : c'est le principe que Duchamp-Villon avait poussé le plus \
loin dans Le Cheval, en 1914, où l'animal se fond dans la mécanique. Le bronze est \
peint, chose rare : l'or, le rouge et le noir rappellent les enseignes et les décors \
de théâtre, faits pour être vus de loin, à l'entrée d'une salle. Le médaillon, avec \
son cadre épais, est pensé pour s'intégrer à une façade : Duchamp-Villon s'est \
toujours intéressé à l'architecture."""
details = [
  "Les plumes de la queue et de l'aile, en rubans plats empilés comme des marches.",
  "La boule rouge du soleil, en bas à gauche.",
  "Les rayons rouges striés qui traversent le fond noir.",
  "La crête du coq, enroulée en volutes.",
  "Le large cadre noir, au relief irrégulier, qui enserre le médaillon.",
]
themes = ["cubisme", "guerre", "france", "soleil", "emblème"]
anecdote = """
Né Raymond Duchamp, le sculpteur ajouta à son nom celui de Villon, déjà choisi par \
son frère aîné Gaston, devenu le peintre Jacques Villon en hommage au poète François \
Villon. Leur cadet, Marcel Duchamp, garda son nom."""
salle = 4
mur = "nord"
place = 3
largeur = 2.6

[[oeuvres]]
titre = "L'Enfant juif (Bambino ebreo)"
artiste = "Medardo Rosso"
annee = "vers 1892"
image = "enfant-juif.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1970.33"
technique = "Cire sur plâtre"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "Dans la cire, Rosso saisit un visage d'enfant qui semble à la fois se former et s'effacer, comme une impression."
description = """
Une petite tête d'enfant, avec le haut des épaules, émerge d'une masse de matière \
claire, d'un blanc crème taché de brun. Les traits sont à peine fixés : les yeux, \
baissés ou clos, ne sont que deux creux d'ombre ; le nez, petit et rond, et les \
lèvres serrées se devinent plus qu'ils ne se voient. Les joues sont pleines, le \
menton rond. Les cheveux ne sont pas sculptés : une coulée irrégulière couvre le \
crâne, et sur un côté la matière forme un bourrelet, comme une oreille ou une \
boucle. La tête penche légèrement. La surface, lisse et luisante par endroits, \
rugueuse ailleurs, a l'aspect d'une chair translucide. Sur le fond gris sombre de la \
photographie, la lumière venue de la gauche laisse une partie du visage dans le \
flou."""
evocation = """
Rosso voulait saisir une impression, comme les peintres impressionnistes : la façon \
dont un visage nous apparaît un instant, dans une certaine lumière, avant de \
s'effacer. Le musée de Cleveland souligne qu'il a utilisé la fluidité de la cire \
pour suggérer le mouvement fugace d'une expression d'enfant et la fragilité de \
l'enfance elle-même. On ne sait presque rien du modèle ; le titre seul le désigne. \
Mais l'essentiel est ailleurs : ce visage qui se dissout dans la matière annonce une \
sculpture faite de lumière et d'atmosphère plutôt que de contours. Rosso tenait \
cette tête pour l'une de ses œuvres les plus réussies, et les futuristes, Boccioni \
en tête, verront en lui un précurseur."""
histoire = """
Après avoir été renvoyé de l'Académie de Brera, à Milan, Medardo Rosso s'installe à \
Paris en 1889. Il y fréquente les milieux de l'avant-garde et se lie avec Rodin, \
avant que les deux sculpteurs ne se brouillent. Vers 1892, il modèle L'Enfant juif, \
qu'il reprendra de nombreuses fois, en cire, en plâtre ou en bronze, comme la plupart \
de ses sujets : son œuvre compte peu de thèmes, sans cesse repris et variés. Il \
expose ses cires à Paris, puis dans toute l'Europe. En 1912, dans son Manifeste \
technique de la sculpture futuriste, Boccioni le salue comme le seul grand sculpteur \
moderne à avoir tenté d'ouvrir la sculpture à l'espace et à la lumière qui \
l'entourent."""
facture = """
Rosso coule d'abord un plâtre, puis le recouvre d'une couche de cire chaude, qu'il \
retouche jusqu'à obtenir l'effet voulu. La cire, légèrement translucide, prend la \
lumière comme une peau ; elle permet des passages insensibles du relief au creux, \
sans arête ni contour. Selon le musée de Cleveland, Rosso cultivait volontairement \
des surfaces brutes, non polies, loin du fini des sculptures de salon. Le bas du \
buste se perd dans une masse informe, sans socle : la tête ne se détache pas de la \
matière, elle en émerge. L'œuvre est pensée pour être vue de face, d'un seul point \
de vue, comme un tableau. Les taches brunes qui marbrent la cire ajoutent à \
l'impression de chair et de temps."""
details = [
  "Les yeux, réduits à deux creux d'ombre.",
  "La coulée de cire qui couvre le crâne en guise de cheveux.",
  "Les taches brunes qui marbrent la cire claire.",
  "Le bas du buste, qui se perd dans une masse informe.",
]
themes = ["enfance", "cire", "lumière", "impression", "visage"]
anecdote = """
Rosso photographiait lui-même ses sculptures, en choisissant l'angle et l'éclairage, \
et retouchait parfois ses tirages : il voulait qu'on voie ses œuvres comme il les \
avait conçues, d'un seul point de vue."""
salle = 5
mur = "nord"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Tête hiératique d'Ezra Pound"
artiste = "Henri Gaudier-Brzeska"
annee = "1914"
image = "ezra-pound.jpg"
cadre = "noir"
credit = "Photo : National Gallery of Art"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.143144.html"
technique = "Marbre, taille directe ; 90,5 × 45,7 × 48,9 cm, environ 310 kg"
collection = "National Gallery of Art, Washington"
note = "Taillée dans un bloc de marbre de plus de 300 kilos, la tête du poète devient une idole : un portrait vorticiste."
description = """
Une tête de marbre clair, haute de près d'un mètre, se dresse comme une borne ou un \
menhir. Le visage est réduit à quelques formes géométriques taillées net : un nez \
droit en long prisme, deux arcades horizontales sous lesquelles les yeux ne sont que \
des fentes, une moustache aux pointes recourbées vers le bas, comme un double \
crochet, et une barbiche en triangle pointu. La chevelure forme au sommet un volume \
arrondi, creusé d'une sorte de chevron. Le reste du bloc est presque lisse : pas \
d'oreilles, pas de cou distinct, une base qui s'évase comme des épaules. Le marbre, \
d'un blanc chaud légèrement rosé, est parcouru de fines veines grises et d'une \
fissure près de la base. Vue de trois quarts, la tête semble regarder au loin, \
impassible."""
evocation = """
Hiératique : le mot désigne ce qui est sacré, figé dans une attitude solennelle, \
comme les statues de l'Égypte ancienne. Gaudier-Brzeska ne cherche pas la \
ressemblance ; il fait du poète une figure d'autorité, presque un dieu, quelque chose \
comme un totem. On reconnaît pourtant la barbiche et la moustache que portait Pound. \
On a souvent relevé aussi la silhouette phallique du bloc, symbole d'énergie \
créatrice. L'œuvre est l'un des manifestes du vorticisme, le mouvement baptisé par \
Pound lui-même, qui voulait capter l'énergie du monde moderne dans des formes \
tendues et concentrées, comme dans le centre d'un tourbillon. Un siècle plus tard, \
c'est l'une des images les plus fortes de l'avant-garde londonienne d'avant 1914."""
histoire = """
Arrivé à Londres en 1911, Henri Gaudier-Brzeska rencontre le poète américain Ezra \
Pound en 1913. Les deux hommes deviennent amis, et Pound, qui défend le jeune \
sculpteur, lui procure le bloc de marbre de son portrait. Gaudier le taille au début \
de 1914, à vingt-deux ans. La même année paraît la revue Blast, manifeste du \
vorticisme, où il publie un texte retentissant sur l'histoire de la sculpture. En \
août 1914, il regagne la France pour s'engager ; il est tué au front, à \
Neuville-Saint-Vaast, le 5 juin 1915. Pound lui consacre en 1916 un livre de \
souvenirs, et la tête de marbre reste longtemps en sa possession, comme le portrait \
de l'ami disparu."""
facture = """
Gaudier-Brzeska pratique la taille directe : il attaque lui-même le bloc, sans \
modèle en plâtre que des praticiens agrandiraient, comme le faisait Rodin. Il \
respecte la masse de la pierre, dont la tête garde la forme compacte et la pesanteur \
de plus de trois cents kilos. Les traits sont obtenus par quelques entailles et des \
plans qui se rencontrent à angle vif : c'est l'ombre, plus que le relief, qui dessine \
les yeux, la moustache et la bouche. On rapproche souvent l'œuvre des grandes \
statues de l'île de Pâques, comme celle que Gaudier pouvait voir au British Museum, \
qu'il fréquentait assidûment. La surface, légèrement grenue, garde la trace de \
l'outil."""
details = [
  "La moustache recourbée, taillée comme un double crochet.",
  "La barbiche en triangle, pointée vers le bas.",
  "Les yeux réduits à des fentes sous les arcades horizontales.",
  "Le chevron creusé dans la masse de la chevelure.",
  "La fine fissure qui court près de la base du marbre.",
]
themes = ["portrait", "poésie", "vorticisme", "taille directe", "idole"]
anecdote = """
D'après Pound, Gaudier l'avait prévenu avant de commencer : la tête ne lui \
ressemblerait pas, elle serait l'expression de certaines émotions que lui inspirait \
son caractère."""
salle = 5
mur = "nord"
place = 3
largeur = 2.6

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Auguste Rodin"
vie = "Paris, 12 novembre 1840 – Meudon, 17 novembre 1917"
biographie = """
Fils d'un employé de la préfecture de police, Auguste Rodin apprend le dessin à la \
Petite École, mais échoue trois fois au concours de l'École des beaux-arts. Il \
travaille longtemps pour d'autres, comme ornemaniste et praticien, à Paris puis à \
Bruxelles, où il s'installe après la guerre de 1870. Un voyage en Italie, en \
1875–1876, lui révèle Michel-Ange. L'Âge d'airain, exposé en 1877, le fait connaître \
dans le scandale. En 1880, l'État lui commande La Porte de l'Enfer, inspirée de \
Dante, à laquelle il travaillera jusqu'à sa mort et d'où naissent Adam, Le Penseur \
et Le Baiser. Suivent Les Bourgeois de Calais, inaugurés en 1895, et le Balzac, \
refusé par ses commanditaires en 1898. L'Exposition universelle de 1900, où il \
présente son œuvre dans un pavillon personnel, lui apporte une gloire \
internationale. En 1916, il donne à l'État ses œuvres et ses collections ; il meurt \
l'année suivante à Meudon."""
style = """
Rodin libère la sculpture du récit et des conventions académiques : il modèle par \
bosses et par creux qui font vibrer la lumière, garde l'empreinte des doigts, ose le \
fragment, l'inachevé, la répétition d'une même figure. Le corps seul exprime la \
pensée et la passion. Presque tous les sculpteurs de cette exposition se sont \
définis avec lui ou contre lui."""

[[artistes]]
nom = "Wilhelm Lehmbruck"
vie = "Meiderich (Duisbourg), 4 janvier 1881 – Berlin, 25 mars 1919"
biographie = """
Fils d'un mineur de la Ruhr, Wilhelm Lehmbruck étudie à l'école des arts décoratifs \
puis à l'Académie des beaux-arts de Düsseldorf. Ses premières œuvres doivent beaucoup \
à Rodin et à la sculpture monumentale de son temps. En 1910, il s'installe à Paris, \
où il découvre Maillol et se lie avec Brancusi, Archipenko et Modigliani. Sa Femme \
agenouillée, en 1911, aux membres démesurément étirés, est saluée comme une œuvre \
majeure et voyage jusqu'à New York, à l'Armory Show de 1913. La guerre le ramène en \
Allemagne : employé dans un hôpital militaire à Berlin, il est bouleversé par les \
souffrances des blessés et sculpte L'Homme abattu, monument à la détresse des \
soldats. Il se réfugie à Zurich en 1916. Revenu à Berlin à la fin de la guerre, élu à \
l'Académie prussienne des arts, il met fin à ses jours en mars 1919, à trente-huit \
ans. En 1937, les nazis le classent parmi les artistes « dégénérés »."""
style = """
Lehmbruck part de la plénitude classique de Maillol pour aller vers des figures \
étirées, graves et mélancoliques, où l'allongement des membres dit le recueillement \
ou la douleur. Sans geste spectaculaire, ses corps expriment un état intérieur : il \
est l'un des grands sculpteurs de l'expressionnisme allemand."""

[[artistes]]
nom = "Augustus Saint-Gaudens"
vie = "Dublin (Irlande), 1er mars 1848 – Cornish (New Hampshire), 3 août 1907"
biographie = """
Fils d'un cordonnier français et d'une mère irlandaise, Augustus Saint-Gaudens a six \
mois quand sa famille quitte Dublin pour New York. À treize ans, il entre en \
apprentissage chez un graveur de camées, tout en suivant des cours du soir de dessin. \
En 1867, il part pour Paris et entre à l'École des beaux-arts, puis s'installe à Rome. \
De retour aux États-Unis, il se fait connaître avec le monument à l'amiral Farragut, \
inauguré à New York en 1881. Suivent le Lincoln debout de Chicago, le mémorial Adams \
à Washington, figure voilée méditative, et le mémorial au colonel Shaw et à son \
régiment de soldats noirs, à Boston, en 1897. Il vit à Paris de 1897 à 1900, puis \
s'installe à Cornish, dans le New Hampshire, où se forme autour de lui une colonie \
d'artistes. En 1907, l'année de sa mort, il dessine une pièce d'or de vingt dollars, \
souvent jugée la plus belle des monnaies américaines."""
style = """
Saint-Gaudens unit la science académique apprise à Paris à un réalisme direct et \
sensible. Ses monuments, portraits et reliefs donnent à l'allégorie un visage \
humain. Il est le plus grand sculpteur américain de son temps, l'héritier le plus \
accompli de la tradition des Beaux-Arts au moment où les modernes la remettent en \
cause."""

[[artistes]]
nom = "Ernst Barlach"
vie = "Wedel (Holstein), 2 janvier 1870 – Rostock, 24 octobre 1938"
biographie = """
Fils d'un médecin, Ernst Barlach étudie les arts décoratifs à Hambourg, puis la \
sculpture à l'Académie de Dresde, et séjourne à Paris au milieu des années 1890. \
Pendant plusieurs années, il cherche sa voie entre la céramique, l'illustration et la \
sculpture décorative. Un voyage en Russie, en 1906, est une révélation : les paysans \
et les mendiants des steppes lui inspirent des figures massives, enveloppées dans \
leurs vêtements. Soutenu par le marchand berlinois Paul Cassirer, il s'installe en \
1910 à Güstrow, dans le Mecklembourg. Il est aussi un auteur de théâtre reconnu et un \
graveur sur bois. Après la Première Guerre mondiale, il crée des monuments aux morts \
pour Güstrow, Kiel, Magdeburg ou Hambourg, œuvres de deuil plus que de gloire. Les \
nazis le jugent « dégénéré » : ses monuments sont retirés, des centaines de ses \
œuvres saisies dans les musées. Isolé, il meurt à Rostock en 1938."""
style = """
Barlach sculpte des corps enveloppés, réduits à des masses simples et fermées, \
taillées en grands plans comme le bois. Héritier de la sculpture gothique allemande, \
il donne à des figures humbles, mendiants, paysans, femmes en prière, une intensité \
spirituelle : peur, attente, élan, extase ou deuil."""

[[artistes]]
nom = "Umberto Boccioni"
vie = "Reggio de Calabre, 19 octobre 1882 – Sorte, près de Vérone, 17 août 1916"
biographie = """
Umberto Boccioni grandit au gré des affectations de son père, fonctionnaire, puis \
s'installe à Rome en 1901. Avec son ami Gino Severini, il apprend auprès de Giacomo \
Balla la peinture divisionniste, faite de touches de couleur pure. Après des séjours \
à Paris et en Russie, il se fixe à Milan en 1907. En 1910, il rencontre le poète \
Marinetti, fondateur du futurisme, et signe le Manifeste des peintres futuristes ; sa \
grande toile La ville qui monte célèbre l'énergie de la ville moderne. En 1912, il \
expose à Paris avec les futuristes, découvre la sculpture cubiste et publie le \
Manifeste technique de la sculpture futuriste. Ses Formes uniques de la continuité \
dans l'espace, en 1913, deviennent l'icône du mouvement. Partisan de l'entrée en \
guerre de l'Italie, il s'engage en 1915. Il meurt en août 1916, à trente-trois ans, \
après une chute de cheval lors d'un exercice militaire, près de Vérone."""
style = """
Boccioni veut peindre et sculpter le mouvement, la vitesse, la vie moderne. Dans ses \
sculptures, l'objet se prolonge dans l'espace, se mêle à son environnement, éclate en \
plans qui se pénètrent. Mort jeune, il a laissé peu d'œuvres, mais ses idées ont \
nourri toute la sculpture du XXᵉ siècle."""

[[artistes]]
nom = "Raymond Duchamp-Villon"
vie = "Damville (Eure), 5 novembre 1876 – Cannes, 9 octobre 1918"
biographie = """
Fils d'un notaire normand, Raymond Duchamp grandit dans une famille d'artistes : son \
frère aîné devient le peintre Jacques Villon, ses cadets Marcel et Suzanne Duchamp \
seront peintres eux aussi. Il commence des études de médecine à Paris, mais une \
grave crise de rhumatisme l'oblige à les abandonner ; pendant sa convalescence, il se \
met à la sculpture, en autodidacte, et expose bientôt dans les Salons parisiens. \
Vers 1911, les réunions de Puteaux, chez son frère Jacques, le rapprochent des \
cubistes. En 1912, il conçoit la façade de la « Maison cubiste » présentée au Salon \
d'automne et participe au Salon de la Section d'or ; en 1913, il expose à l'Armory \
Show de New York. En 1914, il achève son chef-d'œuvre, Le Cheval ; mobilisé dans le \
service de santé, il sculpte encore, près du front, Le Coq gaulois. Atteint de la fièvre \
typhoïde en 1916, il meurt en 1918 à l'hôpital militaire de Cannes."""
style = """
Duchamp-Villon est l'un des premiers sculpteurs cubistes. Il réduit le vivant à des \
formes simples et tendues, qui s'emboîtent comme des pièces mécaniques, pour exprimer \
l'énergie plutôt que l'apparence. Sculpteur et architecte de cœur, il cherchait une \
synthèse entre l'organique et la machine."""

[[artistes]]
nom = "Medardo Rosso"
vie = "Turin, 21 juin 1858 – Milan, 31 mars 1928"
biographie = """
Medardo Rosso grandit en Italie du Nord, à Milan notamment. Il entre en 1882 à \
l'Académie de Brera, dont il est renvoyé dès l'année suivante pour indiscipline. Ses premières œuvres montrent \
des sujets populaires, enfants, concierges, chanteurs des rues. En 1889, il \
s'installe à Paris, où il vivra longtemps ; il y côtoie les milieux \
impressionnistes, se lie avec Rodin, puis se brouille avec lui, persuadé que son \
Balzac doit beaucoup à ses propres recherches. Il expose ses cires à Paris et dans \
toute l'Europe, et trouve des défenseurs parmi les critiques et les \
collectionneurs. Après Ecce Puer, en 1906, il ne crée plus guère de sujets nouveaux \
et reprend sans fin ses œuvres anciennes. Revenu en Italie, il est salué par les \
futuristes comme un précurseur. Il meurt à Milan en 1928."""
style = """
Rosso est le sculpteur de l'impression : il veut rendre ce que l'œil perçoit en un \
instant, un visage dans la lumière, une silhouette dans la rue. Ses cires, aux formes \
fondues et sans contour, se regardent d'un seul point de vue, comme des tableaux, et \
ouvrent la sculpture à l'espace et à l'atmosphère."""

[[artistes]]
nom = "Henri Gaudier-Brzeska"
vie = "Saint-Jean-de-Braye (Loiret), 4 octobre 1891 – Neuville-Saint-Vaast (Pas-de-Calais), 5 juin 1915"
biographie = """
Fils d'un menuisier des environs d'Orléans, Henri Gaudier est un élève brillant. \
Grâce à des bourses, il étudie en Angleterre et voyage en Allemagne, où il dessine \
sans relâche dans les musées. À Paris, en 1910, il rencontre Sophie Brzeska, \
écrivaine polonaise de près de vingt ans son aînée ; ils vivent ensemble, et il \
ajoute son nom au sien. Le couple part pour Londres en 1911. Pauvre, Gaudier sculpte \
la nuit, dessine les animaux du zoo et étudie les antiquités du British Museum. Il se \
lie avec Ezra Pound, le peintre Wyndham Lewis et le sculpteur Jacob Epstein, et \
participe en 1914 au vorticisme et à sa revue, Blast. Quand la guerre éclate, il \
rentre en France pour s'engager. Remarqué pour son courage, il est tué en Artois, à \
Neuville-Saint-Vaast, le 5 juin 1915, à vingt-trois ans. Depuis les tranchées, il \
avait encore envoyé à Blast un dernier texte sur la sculpture."""
style = """
Gaudier-Brzeska défend la taille directe, l'énergie des volumes et la leçon des arts \
anciens et lointains, d'Égypte, d'Afrique ou d'Océanie. En quatre ans de travail \
seulement, il passe du modelé hérité de Rodin à des formes géométriques, compactes et \
puissantes, qui annoncent la sculpture anglaise du XXᵉ siècle."""
