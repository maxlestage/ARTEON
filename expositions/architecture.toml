[[oeuvres]]
titre = "Intérieur de Sainte-Sophie, Constantinople"
artiste = "Sébah & Joaillier"
annee = "fin des années 1880"
image = "sainte-sophie.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Sainte_Sophie_LCCN2004667900.jpg"
technique = "Tirage sur papier albuminé"
collection = "Bibliothèque du Congrès, Washington"
note = "Sous la coupole de Justinien, devenue mosquée en 1453, les grands médaillons de calligraphie ottomane : une vue vendue aux voyageurs de passage à Constantinople."
description = """
La photographie est prise d'un point élevé, à l'entrée de la nef, face à l'abside. Le \
regard embrasse l'immense espace : en haut, le bord de la coupole centrale, percé d'une \
couronne de fenêtres ; au-dessous, une demi-coupole, puis d'autres plus petites, qui \
s'emboîtent jusqu'au fond. De chaque côté, deux étages d'arcades sur colonnes ouvrent \
sur les bas-côtés et les tribunes. De grands disques sombres portent, en lettres \
dorées, des noms écrits en arabe. En bas, on distingue des tribunes de bois et de \
marbre et des dizaines de lampes suspendues à de longs fils, qui descendent presque \
jusqu'au sol. Dans les pendentifs, sous la coupole, apparaissent des anges aux ailes \
déployées. Au bas de l'image, le studio a inscrit « Sainte Sophie 127 »."""
evocation = """
Sainte-Sophie résume à elle seule l'histoire de Constantinople : grande église de \
l'Empire byzantin pendant neuf siècles, puis mosquée impériale des sultans ottomans. La \
photographie montre cette double vie : l'architecture voulue par Justinien et les anges \
byzantins des pendentifs, mais aussi les ajouts ottomans, médaillons, chaire, tribunes \
et lampes. Pour les voyageurs européens de la fin du XIXᵉ siècle, de plus en plus \
nombreux, une telle image fixait le souvenir d'un lieu célèbre dans toute la chrétienté \
comme dans le monde musulman. On y lit surtout l'émerveillement devant la coupole, qui \
semble flotter au-dessus d'une couronne de lumière, comme le disaient déjà les auteurs \
byzantins."""
histoire = """
L'église Sainte-Sophie, la « Sagesse divine », est construite de 532 à 537 sur l'ordre \
de l'empereur Justinien, par deux savants, Anthémius de Tralles et Isidore de Milet. En \
1453, quand le sultan Mehmed II prend Constantinople, elle devient mosquée et reçoit \
peu à peu ses minarets. De 1847 à 1849, le sultan Abdülmecid la fait restaurer par les \
architectes tessinois Gaspare et Giuseppe Fossati : c'est alors qu'on accroche les huit \
grands médaillons calligraphiés par Kazasker Mustafa İzzet Efendi, aux noms de Dieu, du \
Prophète, des quatre premiers califes et des deux petits-fils du Prophète. Le studio \
Sébah & Joaillier vendait cette vue, numérotée 127, aux visiteurs de passage. Ce tirage \
est conservé à la Bibliothèque du Congrès, à Washington."""
facture = """
Photographier un intérieur aussi vaste et sombre était un défi : il fallait une longue \
pose pour que la faible lumière des fenêtres impressionne la plaque de verre. Le \
photographe a choisi un point de vue haut et un objectif assez large pour faire tenir \
dans le cadre les arcades latérales et l'emboîtement des coupoles, dans une stricte \
symétrie. Le tirage albuminé a pris avec le temps ce ton jaune doré, typique des \
photographies de l'époque, qui s'accorde étrangement avec l'or des mosaïques."""
details = [
  "Les médaillons d'Allah et de Muhammad, de part et d'autre de l'abside.",
  "Les séraphins, anges à six ailes, dans les pendentifs sous la coupole.",
  "Les lampes à huile, suspendues très bas à de longs fils.",
  "La tribune à colonnettes, à gauche, ajoutée à l'époque ottomane.",
  "L'inscription « Sainte Sophie 127 », laissée par le studio en bas de l'image.",
]
themes = ["byzance", "islam", "coupole", "istanbul", "calligraphie"]
anecdote = """
Sainte-Sophie a plusieurs fois changé de statut : transformée en musée en 1934 par le \
gouvernement de Mustafa Kemal Atatürk, elle est redevenue une mosquée en 2020, tout en \
restant ouverte aux visiteurs en dehors des heures de prière."""
salle = 3
mur = "sud"
place = 3
largeur = 2.4

[[oeuvres]]
titre = "Le Taj Mahal vu de la Yamuna, Agra"
artiste = "Samuel Bourne"
annee = "années 1860"
image = "taj-mahal.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Gezicht_op_de_Taj_Mahal_vanaf_de_Yamuna_rivier,_RP-F-F80408.jpg"
technique = "Tirage sur papier albuminé"
collection = "Rijksmuseum, Amsterdam"
note = "Le mausolée de marbre blanc élevé par l'empereur Shah Jahan, vu depuis la rive de la Yamuna par le plus célèbre photographe britannique de l'Inde."
description = """
Le Taj Mahal se dresse sur sa haute terrasse, au bord de la rivière Yamuna, dont l'eau \
calme occupe la droite de l'image. Le photographe s'est placé sur la berge, si bien \
qu'on voit le monument de trois quarts : la grande coupole en bulbe, les petites \
coupoles qui l'entourent, les arcs profonds de la façade et les minarets. À gauche, un \
bâtiment de grès rouge couronné de coupoles et de kiosques encadre l'ensemble. Un long \
mur de soutènement longe le fleuve. Au premier plan, des arbres et une plage de sable \
où l'on devine de petites figures. Le mausolée se reflète faiblement dans l'eau. En bas \
de l'image, le négatif porte l'inscription « Bourne 1087 »."""
evocation = """
Le Taj Mahal est un tombeau d'amour : l'empereur moghol Shah Jahan l'a fait construire \
pour son épouse Mumtaz Mahal, morte en 1631 en donnant naissance à leur quatorzième \
enfant. Sa blancheur et sa symétrie parfaite évoquent, selon de nombreux historiens, le \
paradis promis par le Coran, avec ses jardins et ses eaux. En le montrant depuis le \
fleuve plutôt que depuis le jardin et sa longue allée d'eau, Bourne en donne une image \
moins attendue : le mausolée apparaît comme un palais au bord de l'eau, un peu \
lointain, presque irréel dans la lumière blanche. Pour les Britanniques, qui \
gouvernaient alors l'Inde, ces images témoignaient d'une civilisation raffinée qu'ils \
admiraient tout en la dominant."""
histoire = """
Le Taj Mahal est construit à Agra à partir de 1632 par des milliers d'artisans venus de \
tout l'empire moghol ; le mausolée est achevé vers 1643, l'ensemble vers 1653. À sa \
mort, en 1666, Shah Jahan est inhumé auprès de son épouse. Au XIXᵉ siècle, le monument, \
en partie délabré, devient une étape obligée des voyageurs britanniques. Samuel Bourne, \
arrivé en Inde en 1863, le photographie lors de ses tournées ; son studio, Bourne & \
Shepherd, vend ensuite les tirages sous un numéro, ici le 1087, à qui veut en acheter, \
et ses vues sont largement diffusées en Europe. Ce tirage appartient au Rijksmuseum \
d'Amsterdam, qui a placé ses reproductions dans le domaine public."""
facture = """
Bourne travaille au collodion humide, avec une grande chambre de bois et des plaques de \
verre qu'il doit préparer sur place, sous une tente noire, dans la chaleur de l'Inde. \
Admirateur des paysages pittoresques, il compose ses vues comme un peintre : les arbres \
du premier plan forment un repoussoir sombre, la diagonale de la berge et du mur \
conduit le regard vers le monument, et la rivière ouvre l'espace à droite. Le marbre \
blanc, très lumineux, est difficile à rendre : Bourne choisit une lumière qui préserve \
les détails de la façade sans les brûler."""
details = [
  "La signature « Bourne 1087 », inscrite sur le négatif, en bas de l'image.",
  "Le reflet du mausolée dans l'eau calme de la Yamuna.",
  "Les petites coupoles qui entourent la grande coupole en bulbe.",
  "Les minuscules silhouettes sur la plage, au pied du mur.",
  "Le bâtiment de grès rouge à gauche, qui contraste avec le marbre blanc.",
]
themes = ["inde", "mausolée", "amour", "empire moghol", "voyage"]
anecdote = """
Une légende tenace prétend que Shah Jahan voulait se faire bâtir, sur l'autre rive, un \
Taj Mahal noir. Les fouilles menées en face, dans le jardin du Mahtab Bagh, ont révélé \
un jardin d'agrément tourné vers le mausolée, mais aucun second tombeau."""
salle = 4
mur = "est"
place = 2
largeur = 3.2

[[oeuvres]]
titre = "Façade ouest de la Grande Pagode (Angkor Vat)"
artiste = "Émile Gsell"
annee = "1866"
image = "angkor-vat.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Façade_Ouest_de_la_Grande_Pagode_MET_DP151650.jpg"
technique = "Tirage sur papier albuminé d'après un négatif sur verre, 25,1 × 30,3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "L'une des toutes premières photographies d'Angkor Vat, prise en 1866 par un photographe français installé à Saïgon."
description = """
Une large chaussée de pierre, envahie d'herbes, conduit vers le temple. Au fond se \
dressent les tours d'Angkor Vat, en forme de bouton de lotus, sculptées de corniches \
superposées : la plus haute au centre, deux autres de part et d'autre, une quatrième à \
demi cachée à gauche. Devant elles, les toits des galeries s'étagent sur plusieurs \
niveaux, et un escalier monte vers une terrasse et un porche sculpté. À gauche, des \
cocotiers, des palmiers et un pavillon de bois au toit pointu ; à droite, de grands \
arbres sombres. Au premier plan, le dallage disjoint et la végétation montrent un \
monument que l'on n'entretient plus guère. Le ciel, sans nuages, est d'un blanc \
uniforme."""
evocation = """
Pour les Européens des années 1860, Angkor est une « cité perdue » au milieu de la \
jungle, révélée par les récits du naturaliste Henri Mouhot, publiés après sa mort. Les \
photographies de Gsell en apportent la preuve : le temple existe, immense et presque \
intact. Le mythe de la découverte est pourtant trompeur. Angkor Vat n'a jamais été \
abandonné : des moines bouddhistes y vivaient et les Cambodgiens y venaient en \
pèlerinage, comme le rappelle ici le pavillon de bois, qui appartient sans doute au \
monastère. L'image dit aussi l'intérêt de la France, qui venait d'imposer son \
protectorat au Cambodge, en 1863, et fera d'Angkor un symbole de sa présence en \
Indochine."""
histoire = """
Angkor Vat est construit dans la première moitié du XIIᵉ siècle, sous le roi khmer \
Suryavarman II, comme temple dédié au dieu Vishnou et, sans doute, comme sanctuaire \
funéraire du roi ; il devient ensuite un lieu de culte bouddhique. En 1866, Émile Gsell \
se rend à Angkor avec l'officier de marine Ernest Doudart de Lagrée, au départ de la \
mission d'exploration du Mékong, et y réalise une série de vues des temples. Ce sont \
parmi les premières photographies du site, prises la même année que celles de \
l'Écossais John Thomson. Le carton de montage de ce tirage, retiré ici, porte le titre \
« Cambodge, ruines d'Ang-Kor ». L'épreuve appartient à la collection Gilman, acquise \
par le Metropolitan Museum de New York en 2005."""
facture = """
Gsell utilise le collodion humide, dans un climat tropical où la chaleur, l'humidité et \
les insectes compliquent chaque prise. Il se place dans l'axe de la chaussée, qui \
creuse la perspective et mène l'œil jusqu'à la tour centrale, selon la symétrie voulue \
par les architectes khmers. Le ciel est resté blanc : les plaques de l'époque, surtout \
sensibles au bleu, ne pouvaient enregistrer à la fois les nuages et le détail des \
pierres. Quelques feuillages un peu flous trahissent le vent pendant la pose."""
details = [
  "La tour centrale, la plus haute, qui figure le mont Meru, centre du monde.",
  "Le pavillon de bois au toit pointu, à gauche, signe de la présence des moines.",
  "Les herbes qui poussent entre les dalles de la chaussée.",
  "Le porche sculpté en haut de l'escalier, au centre de l'image.",
]
themes = ["cambodge", "temple", "khmer", "jungle", "exploration"]
anecdote = """
Angkor Vat est l'un des rares grands temples khmers tournés vers l'ouest, direction \
associée au dieu Vishnou et à la mort. C'est pourquoi les voyageurs, comme Gsell, \
l'abordaient par cette façade, au bout de la longue chaussée qui franchit les douves."""
salle = 4
mur = "nord"
place = 3
largeur = 2.2

[[oeuvres]]
titre = "La Tour Eiffel en construction"
artiste = "Louis-Émile Durandelle"
annee = "1888"
image = "tour-eiffel-construction.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Louis-Emile_Durandelle,_The_Eiffel_Tower_-_State_of_the_Construction,_1888.jpg"
technique = "Tirage sur papier albuminé"
collection = "J. Paul Getty Museum, Los Angeles"
note = "Fin 1888, la tour monte au-dessus du Champ-de-Mars : le photographe Durandelle en suit le chantier, étape par étape, pour l'entreprise de Gustave Eiffel."
description = """
La tour se dresse, vue de face, au milieu d'un terrain vague. Ses quatre piliers de fer \
se rejoignent sous une première plateforme, puis montent jusqu'au deuxième étage, déjà \
achevé ; au-dessus, la partie haute n'est encore qu'un tronc de treillis métallique, \
coiffé d'un échafaudage. Le grand arc décoratif, sous le premier étage, encadre au loin \
le palais du Trocadéro et ses deux tours. Au pied de la tour, quelques arbres et des \
baraques de chantier. Le sol, au premier plan, est fait de terre remuée et de gravats. \
Le ciel brumeux, d'un beige uniforme, fait ressortir la dentelle sombre des poutrelles."""
evocation = """
Pour Gustave Eiffel, ces photographies sont une démonstration : jour après jour, la \
tour s'élève selon le calendrier prévu. Elles répondent aux artistes et écrivains qui, \
en 1887, avaient signé une protestation contre « l'inutile et monstrueuse tour Eiffel \
». Aujourd'hui, l'image fascine justement parce qu'elle montre la tour inachevée, comme \
un squelette en train de se former : on y comprend comment le fer, assemblé pièce par \
pièce, permet de monter plus haut qu'aucune maçonnerie. Elle célèbre l'ingénieur et \
l'ouvrier, l'industrie et le progrès, valeurs de l'Exposition universelle de 1889, qui \
marquait le centenaire de la Révolution française."""
histoire = """
La tour est imaginée en 1884 par deux ingénieurs de l'entreprise Eiffel, Maurice \
Koechlin et Émile Nouguier, puis retravaillée avec l'architecte Stephen Sauvestre. \
Retenue pour l'Exposition universelle de 1889, elle est construite en un peu plus de \
deux ans : le chantier s'ouvre le 28 janvier 1887, et la tour est achevée le 31 mars \
1889, quand Eiffel hisse le drapeau tricolore à son sommet. Haute de 300 mètres, elle \
reste jusqu'en 1930 la plus haute construction du monde. Durandelle en photographie le \
chantier depuis les fondations ; ses vues, réunies en albums intitulés « État \
d'avancement des travaux », sont offertes par Eiffel à des personnalités. Ce tirage \
appartient au musée J. Paul Getty de Los Angeles."""
facture = """
Durandelle photographie souvent la tour du même point de vue, dans son axe, si bien que \
les vues successives peuvent se comparer comme les images d'un film : on voit la tour \
grandir d'un tirage à l'autre. Il travaille avec une grande chambre et des plaques de \
verre de grand format, qui donnent une netteté remarquable aux treillis de fer. La \
frontalité et la symétrie parfaites donnent à la tour l'allure d'un monument classique. \
Le tirage albuminé, au ton sépia, a pâli avec le temps, ce qui accentue la brume."""
details = [
  "Le palais du Trocadéro, aujourd'hui disparu, visible sous la grande arche.",
  "L'échafaudage au sommet, là où le chantier continue.",
  "Les arcs sous le premier étage, purement décoratifs : ils ne portent rien.",
  "Les baraques de chantier et les jeunes arbres au pied des piliers.",
]
themes = ["paris", "fer", "chantier", "ingénieur", "exposition universelle"]
anecdote = """
Le palais du Trocadéro, bâti pour l'Exposition universelle de 1878, a été remplacé pour \
celle de 1937 par l'actuel palais de Chaillot, qui en a conservé une partie des \
structures."""
salle = 5
mur = "nord"
place = 2
largeur = 1.7

[[oeuvres]]
titre = "La Casa Batlló, Barcelone"
artiste = "Antoni Gaudí"
annee = "1904–1906"
image = "casa-batllo.jpg"
credit = "Photo : ChristianSchd"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Casa_Batllo_Overview_Barcelona_Spain_cut.jpg"
technique = "Façade de grès de Montjuïc, verre, céramique et fonte ; photographie de 2013"
collection = "Passeig de Gràcia 43, Barcelone"
note = "Gaudí transforme un immeuble ordinaire en une façade ondulante, couverte de mosaïque et couronnée d'un toit en écailles : l'œuvre la plus récente de l'exposition, photographiée de nos jours."
description = """
La façade se dresse entre deux immeubles plus classiques, en pierre beige. Au \
rez-de-chaussée et au premier étage, de grandes baies aux montants de pierre en forme \
d'os s'ouvrent sur la rue. Au-dessus, la façade, comme semée d'écailles et de pastilles \
de couleur, bleues, vertes et roses, ondule doucement ; de petits balcons de fer en \
forme de masques s'y accrochent, étage après étage. Le toit, courbe et bombé, est \
couvert de tuiles émaillées qui brillent comme la peau d'un reptile. Sur la gauche, une \
tourelle surmontée d'une croix à quatre bras domine l'ensemble. En bas, sur le \
trottoir, des passants s'arrêtent pour regarder ; c'est la fin du jour, et les fenêtres \
sont éclairées."""
evocation = """
Les Barcelonais ont surnommé l'immeuble la « maison des os » ou la « maison des \
bâillements », à cause de ses colonnes et de ses ouvertures. Une interprétation \
répandue y voit la légende de saint Georges, patron de la Catalogne : le toit serait le \
dos du dragon, la tourelle et sa croix la lance du saint, les balcons les crânes des \
victimes. Gaudí n'a laissé aucune explication. L'œuvre exprime surtout son idée que \
l'architecture doit s'inspirer de la nature, qui ignore la ligne droite : ses formes \
évoquent la mer, les algues, les os ou les écailles. Elle témoigne aussi de la \
prospérité de la bourgeoisie catalane, qui rivalisait d'audace le long du Passeig de \
Gràcia."""
histoire = """
L'industriel du textile Josep Batlló possédait sur le Passeig de Gràcia, la grande \
avenue de l'Eixample de Barcelone, un immeuble construit en 1877. Plutôt que de le \
démolir, Gaudí le transforme de 1904 à 1906 : il refait la façade, ajoute un étage et \
le toit, agrandit la cour intérieure et redessine l'appartement de la famille. Son \
collaborateur Josep Maria Jujol participe au décor. Sur le même pâté de maisons se \
trouvent la Casa Amatller de Puig i Cadafalch et la Casa Lleó Morera de Domènech i \
Montaner, deux autres maîtres du modernisme catalan : on a surnommé cet ensemble la « \
pomme de la discorde ». Ouverte au public depuis 2002, la Casa Batlló est inscrite au \
patrimoine mondial de l'Unesco depuis 2005."""
facture = """
La façade est en grès de Montjuïc, la colline de Barcelone, taillé en formes souples \
qui semblent modelées plutôt que sculptées. Gaudí la recouvre d'un enduit où sont \
incrustés des éclats de verre coloré et des disques de céramique, selon la technique du \
trencadís, mosaïque de fragments qu'il a souvent employée. Les balcons sont en fonte. \
Les tuiles du toit, de forme arrondie, prennent des reflets changeants selon la \
lumière. Toute la façade est pensée comme une surface vivante, qui se modifie avec \
l'heure du jour."""
details = [
  "Les colonnes des grandes baies du premier étage, en forme d'os.",
  "Les balcons en forme de masques, percés de deux grands yeux.",
  "La tourelle et sa croix à quatre bras, à gauche du toit.",
  "Les tuiles émaillées du toit, comme les écailles d'un dragon.",
  "Les éclats de verre colorés incrustés dans la façade.",
]
themes = ["modernisme", "barcelone", "nature", "mosaïque", "façade"]
anecdote = """
Dans la cour intérieure, Gaudí a fait varier la couleur des carreaux de céramique, du \
bleu foncé en haut au bleu très pâle en bas, pour que la lumière tombant de la verrière \
paraisse égale à tous les étages."""
salle = 5
mur = "est"
place = 2
largeur = 1.7

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Giovanni Battista Piranesi"
vie = "Mogliano Veneto (république de Venise), 4 octobre 1720 – Rome, 9 novembre 1778"
biographie = """
Fils d'un tailleur de pierre vénitien, Giovanni Battista Piranesi, dit Piranèse en \
français, apprend l'architecture auprès de son oncle, ingénieur chargé des digues de la \
lagune, ainsi que la perspective et le décor de théâtre. En 1740, il part pour Rome \
comme dessinateur dans la suite de l'ambassadeur de Venise. La ville antique le \
bouleverse. Faute de commandes d'architecture, il apprend la gravure et publie en 1743 \
un premier recueil d'architectures imaginaires. Après un retour à Venise, il s'installe \
définitivement à Rome vers 1747 et ouvre une boutique où il vend ses propres estampes. \
Les Vues de Rome, les Prisons imaginaires et les quatre volumes des Antiquités romaines \
(1756) le rendent célèbre dans toute l'Europe. Il défend avec passion, contre les \
admirateurs de la Grèce, l'originalité des Romains. Le pape vénitien Clément XIII le \
fait chevalier, et le neveu du pape, le cardinal Rezzonico, lui confie son unique \
chantier d'architecte : l'église Santa Maria del Priorato, sur l'Aventin, où il est \
enterré. Il dessine aussi des cheminées, des vases et des meubles. Après sa mort, son \
fils Francesco poursuit son œuvre et emporte les cuivres à Paris."""
style = """
Piranèse est un architecte qui grave : il pense en volumes, en structures et en ombres. \
Ses eaux-fortes, d'une énergie de trait sans équivalent, mêlent exactitude \
archéologique et imagination, au point qu'il agrandit volontiers les ruines pour les \
rendre plus saisissantes. Sa vision de la Rome antique, grandiose et mélancolique, a \
nourri le néoclassicisme, des architectes comme Soane, puis l'imaginaire romantique ; \
ses Prisons inspirent encore cinéastes et illustrateurs."""

[[artistes]]
nom = "Étienne-Louis Boullée"
vie = "Paris, 1728 – Paris, 1799"
biographie = """
Fils d'un architecte, Étienne-Louis Boullée voulait devenir peintre, mais son père \
l'oriente vers l'architecture. Il suit l'enseignement de Jacques-François Blondel et de \
Jean-Laurent Legeay, revenu de Rome avec le goût des formes antiques et des grandes \
compositions. Élu à l'Académie royale d'architecture en 1762, il construit pour de \
riches clients plusieurs hôtels particuliers à Paris et des demeures à la campagne, \
dont il ne reste presque rien. À partir des années 1780, il renonce peu à peu à bâtir \
pour se consacrer à l'enseignement et à de vastes projets dessinés, bibliothèque \
royale, opéra, cathédrale, palais, cénotaphes, qui ne seront jamais réalisés. Il y \
développe une architecture de volumes géométriques purs, sphère, cylindre, pyramide, à \
une échelle colossale, et rédige un traité, Architecture, essai sur l'art. Parmi ses \
élèves figurent Jean-François Chalgrin, l'architecte de l'Arc de triomphe, et \
Jean-Nicolas-Louis Durand, dont les leçons influenceront tout le XIXᵉ siècle. Il meurt \
à Paris en 1799, laissant ses dessins à la nation. Longtemps oublié, il est redécouvert \
au XXᵉ siècle, et son essai est publié pour la première fois en 1953."""
style = """
Boullée cherche à émouvoir par la seule géométrie : des volumes simples, démesurés, \
répétés, et le jeu de la lumière et de l'ombre, qu'il voulait capable de faire naître \
la mélancolie ou l'admiration. Ses dessins au lavis, plus proches de la peinture que du \
plan technique, annoncent l'architecture visionnaire. On a reconnu dans ses projets les \
ancêtres de bien des monuments modernes."""

[[artistes]]
nom = "Francis Frith"
vie = "Chesterfield (Angleterre), 7 octobre 1822 – Cannes, 25 février 1898"
biographie = """
Né dans une famille quaker du Derbyshire, Francis Frith fait d'abord carrière dans le \
commerce à Liverpool : il fonde une entreprise d'épicerie en gros, puis une imprimerie, \
et les revend avec profit au milieu des années 1850. Passionné de photographie, il \
décide alors de partir pour l'Orient. Entre 1856 et 1859, il fait trois voyages en \
Égypte, en Nubie, en Palestine et en Syrie, avec plusieurs appareils, dont une chambre \
géante pour des plaques de 16 × 20 pouces. Ses vues des pyramides, des temples de \
Louxor ou d'Abou Simbel, publiées en livres et en albums de tirages originaux, font \
sensation en Grande-Bretagne. À son retour, il s'installe à Reigate, dans le Surrey, et \
fonde la maison F. Frith & Co., qui entreprend de photographier les villes et les \
villages du Royaume-Uni. Ses opérateurs sillonnent le pays pendant des décennies, et \
l'entreprise vend des tirages puis des cartes postales jusqu'en 1971. Frith, qui écrit \
aussi sur la religion et la morale, meurt en 1898 dans sa villa de Cannes. Ses archives \
forment aujourd'hui un fonds de plusieurs centaines de milliers de vues de la \
Grande-Bretagne."""
style = """
Frith est un photographe de l'exactitude : il montre les monuments tels qu'ils sont, en \
grands formats d'une netteté stupéfiante, avec des cadrages clairs, souvent frontaux, \
et de petits personnages pour donner l'échelle. Ses textes insistent sur la vérité de \
la photographie, opposée aux vues embellies des peintres orientalistes. Il a contribué \
à fonder la photographie de voyage et, par son entreprise, la carte postale illustrée."""

[[artistes]]
nom = "Sébah & Joaillier"
vie = "Constantinople (Empire ottoman), atelier actif à partir de 1888"
biographie = """
L'atelier Sébah & Joaillier est l'un des grands studios photographiques de \
Constantinople à la fin de l'Empire ottoman. Il prend la suite du studio fondé en 1857 \
par Pascal Sébah, photographe né à Constantinople, installé dans le quartier de Péra, \
où vivaient de nombreux Européens. Pascal Sébah photographie les monuments, les \
paysages et les habitants de l'Empire, ouvre une succursale au Caire et fournit les \
photographies d'un album officiel sur les costumes populaires de Turquie, préparé pour \
l'Exposition universelle de Vienne en 1873. Après sa mort, en 1886, son fils Jean \
Pascal Sébah s'associe en 1888 avec le Français Policarpe Joaillier : la raison sociale \
devient Sébah & Joaillier. Le studio vend aux voyageurs des vues numérotées et titrées \
de Constantinople, de ses mosquées, de ses palais, de ses fontaines et du Bosphore, \
ainsi que des portraits et des scènes de la vie quotidienne. Il travaille aussi pour la \
cour ottomane. Ses tirages, conservés aujourd'hui dans de nombreuses bibliothèques et \
musées, constituent une source précieuse pour l'histoire d'Istanbul et de ses \
monuments."""
style = """
Les vues du studio allient la netteté documentaire à une composition soignée, héritée \
de la peinture de paysage : points de vue élevés, perspectives profondes, lumière \
égale. Pensées pour les voyageurs, elles sont numérotées, titrées en français, langue \
internationale de l'époque, et vendues à l'unité ou en albums. Elles ont fixé pour \
l'Europe l'image d'une Constantinople à la fois byzantine et ottomane."""

[[artistes]]
nom = "Samuel Bourne"
vie = "Muckleston (Staffordshire, Angleterre), 30 octobre 1834 – Nottingham, 24 avril 1912"
biographie = """
Fils d'un fermier du Staffordshire, Samuel Bourne travaille d'abord comme employé de \
banque à Nottingham, tout en pratiquant la photographie en amateur ; il se fait \
remarquer à la fin des années 1850 par ses paysages de la région des Lacs. En 1863, il \
quitte la banque et part pour l'Inde. Installé à Simla, la capitale d'été du \
gouvernement britannique, au pied de l'Himalaya, il s'associe avec Charles Shepherd : \
leur studio prend le nom de Bourne & Shepherd. Entre 1863 et 1866, il mène trois \
grandes expéditions photographiques dans l'Himalaya, avec des dizaines de porteurs \
chargés de ses chambres, de ses plaques de verre et de ses produits chimiques ; en \
1866, il photographie à plus de 5 500 mètres d'altitude, au col de Manirang. Il \
parcourt aussi les plaines de l'Inde du Nord, de Delhi à Agra et à Bénarès, et le \
Cachemire, et raconte ses voyages dans le British Journal of Photography. En 1870, il \
rentre en Angleterre, dirige une entreprise de filature de coton à Nottingham et \
délaisse la photographie pour l'aquarelle. Le studio Bourne & Shepherd, l'un des plus \
anciens du monde, a fonctionné en Inde jusqu'en 2016."""
style = """
Bourne est un paysagiste dans l'esprit du pittoresque anglais : il cherche des points \
de vue équilibrés, avec un premier plan d'arbres ou de rochers, un plan d'eau et un \
monument ou une montagne au loin. Techniquement irréprochable, il maîtrise le collodion \
humide dans des conditions extrêmes. Ses milliers de vues ont façonné l'image de l'Inde \
en Europe, mais elles reflètent aussi le regard du pouvoir colonial."""

[[artistes]]
nom = "Émile Gsell"
vie = "Sainte-Marie-aux-Mines (Haut-Rhin), 31 décembre 1838 – Saïgon, 16 octobre 1879"
biographie = """
Né en Alsace, dans une vallée industrielle des Vosges, Émile Gsell s'engage dans \
l'armée et part pour la Cochinchine, où la France vient de s'installer, au début des \
années 1860. Il y découvre la photographie et décide de rester en Extrême-Orient : \
installé à Saïgon, il ouvre l'un des premiers ateliers photographiques de la colonie. \
En 1866, il accompagne au Cambodge l'officier de marine Ernest Doudart de Lagrée, chef \
de la mission d'exploration du Mékong, et réalise à Angkor une série de vues des \
temples qui comptent parmi les toutes premières photographies du site. Il photographie \
aussi la Cochinchine, ses villes, ses canaux, ses paysages et ses habitants, puis le \
Tonkin, au nord du Viêt Nam. Son atelier de Saïgon fournit des portraits aux colons et \
des vues aux administrations et aux voyageurs ; ses albums contribuent à faire \
connaître l'Indochine en France. Il meurt à Saïgon en 1879, à quarante ans. Ses \
tirages, dispersés, sont aujourd'hui conservés dans de grandes collections publiques, \
en France et aux États-Unis."""
style = """
Gsell est un photographe documentaire : vues frontales, cadrages amples, souci de \
montrer l'ensemble d'un édifice ou d'un paysage. Ses tirages, d'un ton chaud, sont \
d'une grande sobriété. Travaillant dans des conditions difficiles, il a fixé l'état \
d'Angkor avant les grands chantiers de dégagement et de restauration du XXᵉ siècle, ce \
qui donne à ses images une valeur de témoignage, même si elles servaient aussi la \
propagande coloniale."""

[[artistes]]
nom = "Louis-Émile Durandelle"
vie = "France, 1839 – 1917"
biographie = """
Louis-Émile Durandelle est l'un des grands photographes d'architecture de la France du \
Second Empire et de la Troisième République. Il commence sa carrière aux côtés \
d'Hyacinthe-César Delmaet, avec qui il s'associe : la signature Delmaet et Durandelle \
apparaît sur de nombreux tirages. Après la mort de Delmaet, il poursuit seul \
l'activité. Il se spécialise dans un genre alors nouveau : la photographie de chantier. \
Pendant des années, il suit la construction de l'Opéra de Charles Garnier, dont il \
photographie les fondations, la charpente métallique, les sculptures et les décors, \
réunis en albums. Il documente aussi la construction de la basilique du Sacré-Cœur, à \
Montmartre, et de nombreux bâtiments de Paris. Pour l'Exposition universelle de 1889, \
il photographie la tour Eiffel, des fondations, au printemps 1887, jusqu'à son \
achèvement. Ces séries, commandées par les entrepreneurs, les architectes ou l'État, \
servaient à rendre compte de l'avancement des travaux et à garder la mémoire des \
techniques. Redécouvertes au XXᵉ siècle, elles sont conservées notamment au musée \
d'Orsay, à la Bibliothèque nationale de France et au musée Getty de Los Angeles."""
style = """
Durandelle photographie l'architecture en train de se faire plutôt que le monument \
achevé : échafaudages, grues, poutres et ouvriers deviennent ses sujets. Ses vues \
frontales, nettes et méthodiques, prises souvent du même point à des dates successives, \
forment de véritables chroniques. Leur rigueur, sans effet pittoresque, a été admirée \
au XXᵉ siècle comme une esthétique de l'ingénieur."""

[[artistes]]
nom = "Antoni Gaudí"
vie = "Reus (Catalogne), 25 juin 1852 – Barcelone, 10 juin 1926"
biographie = """
Fils d'un chaudronnier, Antoni Gaudí i Cornet grandit dans la campagne catalane, où il \
observe longuement les plantes, les animaux et les rochers ; on rapporte qu'il \
attribuait son sens de l'espace à l'atelier de son père, où l'on façonnait des volumes \
dans le cuivre. Il étudie l'architecture à Barcelone et obtient son diplôme en 1878. La \
même année, il rencontre l'industriel Eusebi Güell, qui devient son mécène et pour qui \
il construit le palais Güell, le parc Güell et l'église de la Colonia Güell. Ses \
premières œuvres, comme la Casa Vicens, s'inspirent de l'art mudéjar ; il invente \
ensuite un style très personnel, nourri de gothique et de nature. En 1883, il prend la \
direction du chantier de la Sagrada Família, temple commencé l'année précédente, qui \
l'occupera jusqu'à sa mort. Au début du XXᵉ siècle, il construit à Barcelone la Casa \
Batlló, puis la Casa Milà, dite la Pedrera. À partir de 1914, il se consacre \
exclusivement à la Sagrada Família, vivant presque en ascète. Renversé par un tramway \
le 7 juin 1926, il meurt trois jours plus tard et est enterré dans la crypte de la \
basilique. Sept de ses œuvres sont inscrites au patrimoine mondial de l'Unesco."""
style = """
Gaudí refuse l'angle droit et la façade plate : ses bâtiments ondulent, s'inclinent et \
se couvrent de mosaïques de céramique brisée, le trencadís. Il cherche ses formes à \
l'aide de maquettes faites de chaînettes lestées, pour trouver des arcs qui tiennent \
sans contreforts. Son œuvre, à la croisée du modernisme catalan, du gothique et de \
l'observation de la nature, reste l'une des plus originales de l'histoire de \
l'architecture."""
