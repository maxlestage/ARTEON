# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Le Pont-levis (Prisons imaginaires, planche VII)"
artiste = "Giovanni Battista Piranesi"
annee = "vers 1745–1750, planche retravaillée en 1761"
image = "prisons-pont-levis.jpg"
cadre = "estampe"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Giovanni_Battista_Piranesi_-_The_Drawbridge,_plate_VII_from_the_series_Carceri_d'Invenzione_-_Google_Art_Project.jpg"
technique = "Eau-forte, environ 55 × 41 cm"
collection = "Cooper Hewitt, Smithsonian Design Museum, New York"
note = "Escaliers, passerelles et pont-levis s'enchevêtrent sous des voûtes sans fin : une prison née de l'imagination de Piranèse, devenue l'une des images les plus célèbres de l'architecture rêvée."
description = """
Le regard plonge dans un espace immense, fermé de tous côtés, dont on ne voit ni le \
plafond ni le sol. Des piles massives de pierre portent des arcs, des galeries et des \
escaliers qui montent, tournent et se croisent dans toutes les directions. Au centre, \
un pont-levis de bois, suspendu à des cordes et à des poulies, relie deux passerelles. \
À droite, une tour ronde percée d'une fenêtre grillagée s'accroche à la maçonnerie, une \
grosse lanterne pendue à son flanc. Partout, de minuscules silhouettes marchent sur les \
ponts, se penchent aux balustrades ou gravissent les marches, écrasées par l'échelle de \
l'édifice. En bas à gauche, une grande roue hérissée de pointes et des chaînes font \
penser à des instruments de supplice."""
evocation = """
Piranèse ne grave pas une prison réelle : il invente un lieu impossible, où les \
perspectives se contredisent et où l'on ne sait jamais d'où vient la lumière. On a vu \
dans ces Prisons imaginaires un hommage à la grandeur de l'architecture romaine, dont \
il admirait les voûtes et les fondations colossales, mais aussi un cauchemar \
d'enfermement, où l'homme se perd dans un espace qu'il a lui-même bâti. Le thème venait \
du théâtre : les décorateurs d'opéra du temps, comme les Bibiena, peignaient des \
cachots grandioses pour la scène. Piranèse en fait un sujet à part entière. Au XIXᵉ \
siècle, les romantiques y ont lu le vertige du rêve ; au XXᵉ, on les a rapprochées des \
espaces sans issue de Kafka ou des escaliers impossibles d'Escher."""
histoire = """
Arrivé de Venise à Rome en 1740, le jeune Piranèse, formé comme architecte, ne trouve \
guère de bâtiments à construire et se tourne vers la gravure. Vers 1749-1750, il publie \
chez le marchand Giovanni Bouchard une suite de quatorze planches sans titre ni \
légende, les Invenzioni capric di carceri, des « inventions capricieuses de prisons ». \
En 1761, devenu célèbre, il reprend toutes les planches : il les assombrit, y ajoute \
des chaînes, des inscriptions, des escaliers, et en grave deux nouvelles. Cette seconde \
édition, intitulée Carceri d'invenzione, compte seize planches. Les cuivres, conservés \
après sa mort par son fils, sont aujourd'hui à Rome, à l'Istituto centrale per la \
grafica, héritier de l'ancienne Calcografia, qui en a tiré de nombreuses épreuves. \
Celle-ci est entrée au musée Cooper Hewitt, à New York, en 1959."""
facture = """
L'eau-forte permet à Piranèse de dessiner à la pointe dans le vernis qui couvre le \
cuivre, avec la liberté d'un croquis : les traits courent vite, se superposent, \
laissent des zones à peine esquissées. Pour la seconde édition, il fait mordre l'acide \
plus profondément et multiplie les hachures croisées, si bien que les ombres deviennent \
denses et presque noires. La composition, en contre-plongée, juxtapose plusieurs points \
de vue, héritage des décors de théâtre, et fait paraître l'espace plus haut qu'il ne \
pourrait l'être. Les petites figures, indiquées en quelques traits, donnent l'échelle."""
details = [
  "Le pont-levis, au centre, retenu par des cordes qui descendent de poulies.",
  "La tour ronde à droite, avec sa fenêtre grillagée et sa grosse lanterne.",
  "Les minuscules prisonniers ou gardiens qui marchent sur les passerelles.",
  "La roue hérissée de pointes, en bas à gauche.",
  "L'escalier qui s'enroule en spirale autour d'un pilier, à gauche du centre.",
]
themes = ["architecture imaginaire", "prison", "vertige", "gravure", "rêve"]
anecdote = """
Dans ses Confessions d'un mangeur d'opium anglais (1821), Thomas De Quincey raconte que \
le poète Coleridge lui avait décrit des gravures de Piranèse appelées les « Rêves » : \
des escaliers sans fin, qu'il compare aux visions de l'opium. Ce sont les Prisons."""
salle = 2
mur = "nord"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "Vue de l'amphithéâtre Flavien, dit le Colisée (Vues de Rome)"
artiste = "Giovanni Battista Piranesi"
annee = "1776"
image = "colisee.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Veduta_dell'Anfiteatro_Flavio_detto_il_Colosseo,_from-_'Vedute_di_Roma'_(Views_of_Rome)_MET_DP104275.jpg"
technique = "Eau-forte ; feuille de 76,2 × 101,6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Le Colisée vu d'en haut, comme depuis un ballon : Piranèse en dévoile d'un seul regard les gradins ruinés, l'arène et la double enceinte."
description = """
Le Colisée occupe toute la feuille, vu de haut et en biais, comme si le graveur s'était \
élevé au-dessus de Rome. Au premier plan, la partie effondrée de l'enceinte laisse voir \
l'épaisseur des murs, les arcades superposées et les couloirs voûtés qui portaient les \
gradins. Au fond, l'enceinte extérieure, intacte sur toute sa hauteur, dessine une \
courbe régulière d'arcades. Les gradins de pierre ont disparu : il ne reste que les \
voûtes qui les soutenaient, envahies de broussailles. Au centre de l'arène, vaste et \
vide, se dresse une croix ; tout autour, de petites chapelles jalonnent le pourtour. \
Quelques promeneurs minuscules traversent l'esplanade. En bas, deux cartouches gravés \
donnent le titre et une légende repérée par des lettres."""
evocation = """
Piranèse veut montrer la grandeur de la Rome antique, mais aussi ce que le temps en a \
fait. Le Colisée apparaît comme un paysage plus que comme un bâtiment : une montagne \
creuse, rongée, où la végétation reprend ses droits. La vue d'en haut, que personne ne \
pouvait alors avoir, sert aussi à expliquer : elle fait comprendre d'un coup d'œil \
comment l'amphithéâtre était construit, et la légende désigne les places des consuls, \
des sénateurs, des chevaliers ou des femmes. Pour Piranèse, qui défendait la \
supériorité des Romains sur les Grecs dans un vif débat de son temps, ces ruines \
prouvaient le génie des bâtisseurs romains. La croix et les chapelles rappellent que \
l'amphithéâtre était devenu un lieu de prière dédié aux martyrs chrétiens."""
histoire = """
Les Vedute di Roma, ou Vues de Rome, sont l'entreprise de toute une vie : Piranèse en \
grave les premières planches vers 1748 et y travaille jusqu'à sa mort, en 1778, pour un \
total d'environ 135 vues. Vendues à l'unité dans sa boutique romaine, elles sont \
achetées par les voyageurs du Grand Tour, jeunes aristocrates anglais, français ou \
allemands venus achever leur éducation en Italie, qui les rapportent chez eux comme \
souvenirs. Elles façonnent pour longtemps l'image que l'Europe se fait de Rome : \
certains visiteurs avouent leur déception devant des ruines moins grandioses que sur \
les gravures. Cette vue à vol d'oiseau, l'une des dernières de la série, est datée de \
1776. L'épreuve exposée appartient au Metropolitan Museum de New York depuis 1959."""
facture = """
La planche, de très grand format, est gravée à l'eau-forte avec une précision \
d'architecte : chaque arcade, chaque voûte, chaque pierre effondrée est décrite. \
Piranèse renforce les contrastes en faisant mordre plus profondément les ombres du \
premier plan, tandis que l'arrière-plan reste clair, ce qui creuse la profondeur. Le \
point de vue élevé, presque impossible, lui permet de montrer à la fois l'intérieur et \
l'extérieur du monument. Les promeneurs, volontairement minuscules, le grandissent \
encore."""
details = [
  "La croix au centre de l'arène, entourée des petites chapelles d'un chemin de croix.",
  "Les lettres gravées sur l'édifice, qui renvoient à la légende en bas de la feuille.",
  "La partie effondrée de l'enceinte, au premier plan, qui montre la structure en coupe.",
  "Les broussailles et les arbustes qui poussent sur les voûtes.",
  "La signature « Cav. Piranesi F. », en bas à droite : Piranèse était chevalier.",
]
themes = ["rome", "ruines", "antiquité", "grand tour", "gravure"]
anecdote = """
En 1749, le pape Benoît XIV consacra le Colisée à la mémoire des martyrs chrétiens et y \
fit installer un chemin de croix : d'où la croix et les chapelles de l'arène. Elles \
furent retirées au XIXᵉ siècle, lors des fouilles des sous-sols."""
salle = 3
mur = "ouest"
place = 2
largeur = 3.0

[[oeuvres]]
titre = "Cénotaphe de Newton, coupe (effet de nuit à l'intérieur)"
artiste = "Étienne-Louis Boullée"
annee = "1784"
image = "cenotaphe-newton.jpg"
cadre = "estampe"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Étienne-Louis_Boullée,_Cénotaphe_de_Newton_-_04_-_Coupe,_représentation_de_jour_avec_effet_intérieur_de_nuit.jpg"
technique = "Plume, encre et lavis sur papier"
collection = "Bibliothèque nationale de France, département des Estampes, Paris"
note = "Pour honorer Isaac Newton, Boullée imagine une sphère creuse d'environ cent cinquante mètres : de jour, sa voûte percée de trous devient un ciel étoilé."
description = """
Le dessin montre le monument coupé en deux, comme une maquette tranchée par le milieu. \
Au centre, une immense sphère creuse est enchâssée dans un socle circulaire à deux \
gradins, dont les terrasses sont plantées de rangées de cyprès. L'intérieur de la \
sphère est entièrement noir, semé d'étoiles et d'un astre plus brillant : c'est la \
voûte vue du dedans. Tout en bas, au point le plus profond, un minuscule sarcophage \
repose sur une estrade, entouré de quelques silhouettes à peine visibles. Un long \
couloir en pente y conduit depuis l'extérieur. Dehors, le ciel est clair et nuageux : \
il fait jour. Dans l'épaisseur du socle, de chaque côté, s'ouvre une galerie voûtée en \
demi-cercle."""
evocation = """
Newton, mort en 1727, avait expliqué par la gravitation le mouvement des astres. \
Boullée lui offre un tombeau à la mesure de l'univers : la sphère, forme parfaite, sans \
début ni fin, représente le cosmos lui-même. Le visiteur, descendu au fond de cette \
coquille, serait seul face au sarcophage et à un ciel artificiel, saisi par ce que les \
philosophes du XVIIIᵉ siècle appelaient le sublime : une émotion faite d'admiration et \
d'effroi devant l'immensité. Le projet est aussi un hommage des Lumières à la science : \
l'architecture n'y sert plus un roi ou un dieu, mais un savant. On a qualifié ce genre \
de projet d'architecture « parlante » : la forme du bâtiment dit à elle seule ce qu'il \
célèbre."""
histoire = """
Boullée dessine ce projet en 1784, à cinquante-six ans, alors qu'il a presque cessé de \
construire pour se consacrer à l'enseignement et à des projets théoriques. Personne ne \
le lui a commandé, et il n'a jamais été question de le bâtir : une sphère de cette \
taille dépassait de loin les moyens techniques de l'époque. Un cénotaphe est d'ailleurs \
un tombeau vide, Newton reposant à l'abbaye de Westminster. Le dessin devait illustrer \
le traité de Boullée, Architecture, essai sur l'art, où il défend une architecture de \
grands volumes géométriques, faite pour émouvoir. Le texte resta manuscrit. À sa mort, \
en 1799, l'architecte légua ses dessins à la nation ; ils sont conservés à la \
Bibliothèque nationale. Redécouverts au XXᵉ siècle, ils ont fait sa gloire posthume, et \
l'essai a enfin été publié en 1953."""
facture = """
Boullée travaille au lavis : il étale de l'encre diluée au pinceau, en couches plus ou \
moins sombres, pour modeler les volumes par la lumière plutôt que par le trait. Il \
oppose violemment le noir profond de l'intérieur au gris clair du ciel extérieur ; il \
se flattait d'avoir inventé une « architecture des ombres ». Les étoiles ne sont que de \
petits points clairs sur le fond noir. La composition est strictement symétrique, \
réduite à quelques formes pures : cercle, demi-cercles, rectangles. Les cyprès, arbres \
des cimetières, et les petits personnages donnent l'échelle colossale du monument."""
details = [
  "Le minuscule sarcophage de Newton, tout au fond de la sphère.",
  "Les étoiles, plus serrées en haut à droite, comme une voie lactée.",
  "Les rangées de cyprès sur les terrasses du socle.",
  "Le long couloir en pente douce qui mène au tombeau.",
  "Le petit cachet rond de la Bibliothèque nationale, en bas au centre.",
]
themes = ["sphère", "newton", "lumières", "architecture utopique", "cosmos", "sublime"]
anecdote = """
Boullée avait aussi prévu l'effet inverse : un autre dessin de la même série montre le \
cénotaphe de nuit, le ciel extérieur noir, tandis que l'intérieur est illuminé par un \
grand globe lumineux suspendu au centre de la sphère, comme un soleil."""
salle = 2
mur = "nord"
place = 1
largeur = 3.2

[[oeuvres]]
titre = "Les Pyramides de Gizeh, vues du sud-ouest"
artiste = "Francis Frith"
annee = "vers 1857 (tirage vers 1865)"
image = "pyramides-gizeh.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Francis_Frith_-_Pyramids_Of_El-Geezeh_(From_The_Southwest)_-_Google_Art_Project.jpg"
technique = "Tirage sur papier albuminé, 38,1 × 48,9 cm"
collection = "Los Angeles County Museum of Art (LACMA)"
note = "Les trois grandes pyramides alignées dans le désert, photographiées sur une plaque de verre géante par un voyageur anglais qui fit trois fois le voyage d'Égypte."
description = """
Trois pyramides se dressent au-delà d'une étendue de sable et de cailloux. Au centre, \
la plus haute en apparence est celle de Khéphren, qui conserve à son sommet un reste de \
son revêtement de calcaire lisse. À droite, plus loin, s'élève celle de Khéops, la \
Grande Pyramide. À gauche, la plus petite, celle de Mykérinos, est précédée de trois \
pyramides plus modestes, dites des reines. Au premier plan, sur une butte sombre \
couverte de cailloux, deux hommes sont assis par terre ; un peu plus loin, une monture \
et son gardien attendent. Le ciel, très clair, est presque blanc. La lumière rasante \
fait ressortir les assises de pierre, marche après marche, sur les flancs des \
pyramides."""
evocation = """
Pour le public anglais des années 1850, ces images sont une révélation : pour la \
première fois, on voit les pyramides telles qu'elles sont, sans l'interprétation d'un \
graveur. Frith, qui écrivait aussi, accompagnait ses photographies de textes où il \
insistait sur leur vérité. Les petites figures du premier plan donnent l'échelle et \
rappellent que ces montagnes de pierre ont été élevées par des hommes, il y a plus de \
quatre mille cinq cents ans. Le contraste entre le désert presque abstrait et la \
géométrie parfaite des pyramides fait de l'image une méditation sur le temps et la \
permanence, thème cher à l'Angleterre victorienne, qui voyait dans l'Égypte l'aube de \
la civilisation."""
histoire = """
Francis Frith, qui a fait fortune dans le commerce à Liverpool, part pour l'Égypte en \
1856 avec son matériel photographique. Il y retourne deux fois, jusqu'en 1859, remonte \
le Nil jusqu'en Nubie, puis visite la Palestine et la Syrie. Ses photographies sont \
publiées à Londres en livres et en albums illustrés de vrais tirages collés dans les \
pages, comme Egypt and Palestine Photographed and Described. Elles connaissent un grand \
succès et existent en plusieurs formats, dont ces grands tirages réalisés à partir de \
négatifs sur verre d'environ 40 sur 50 centimètres. Celui-ci a sans doute été tiré \
quelques années après la prise de vue, vers 1865. Il appartient aujourd'hui au musée \
d'art du comté de Los Angeles."""
facture = """
Frith utilise le collodion humide, procédé exigeant : la plaque de verre doit être \
enduite, sensibilisée, exposée et développée en quelques minutes, avant que la couche \
ne sèche. Dans la chaleur du désert, l'éther du collodion s'évapore très vite, et il \
faut travailler dans une tente-laboratoire étouffante. Le tirage est fait par contact \
sur un papier albuminé, enduit de blanc d'œuf, qui donne des détails très fins. La \
composition, très simple, superpose trois bandes horizontales, le premier plan sombre, \
le sable clair et le ciel blanc, sur lesquelles se découpent les triangles des \
pyramides."""
details = [
  "Le sommet de la pyramide de Khéphren, qui garde un reste de son revêtement d'origine.",
  "Les trois petites pyramides des reines, devant celle de Mykérinos, à gauche.",
  "La monture et son gardien, minuscules au milieu du sable.",
  "Les deux hommes assis au premier plan, qui donnent l'échelle.",
]
themes = ["égypte", "pyramides", "désert", "voyage", "photographie"]
anecdote = """
De retour en Angleterre, Frith fonde à Reigate l'entreprise F. Frith & Co., qui \
photographie des milliers de villes et de villages britanniques et vend leurs vues, \
puis des cartes postales, jusqu'à sa fermeture en 1971."""
salle = 3
