# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « L'ARCHITECTURE DU MONDE, EN IMAGES » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/architecture/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /architecture.
#
#  Les photographies ont une baguette noire (cadre = « noir ») ; les gravures et
#  les dessins ont un cadre d'estampe. Toutes les images sont dans le domaine
#  public ou en CC0, sauf la photographie récente de la Casa Batlló (CC BY-SA,
#  créditée).
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 290
nom_court = "Architecture"
mouvement = "L'architecture du monde, en images"
cadre = "noir"
couleur = "#3f4f5c"
titre = "Bâtir le monde : l'architecture en gravures, dessins et photographies"
artiste = "Piranèse, Boullée, Frith, Bourne, Gsell, Durandelle, Gaudí…"
dates = "1750–1912"
accroche = "Exposition virtuelle · Sir John Soane's Museum, Londres"
introduction = """
Avant le cinéma et l'avion, c'est par l'image que l'Europe a découvert les grands \
édifices du monde : gravures, dessins d'architectes, puis tirages photographiques \
rapportés d'Égypte, de Turquie, d'Inde ou du Cambodge. La visite réunit neuf images, des \
prisons rêvées de Piranèse au cénotaphe imaginé par Boullée pour Newton, des pyramides \
de Gizeh aux temples d'Angkor, du chantier de la tour Eiffel à la façade de la \
Casa Batlló de Gaudí. Le bâtiment s'inspire du Sir John Soane's Museum, à Londres, la \
maison-musée d'un architecte collectionneur : un vestibule, une haute salle sous \
coupole, une bibliothèque rouge, un salon jaune et un cabinet des tableaux."""
vitrine = "cenotaphe-newton.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Sir John Soane's Museum"
ville = "Londres, Royaume-Uni"
architecte = "Sir John Soane"
construction = "1792–1824"
presentation = """
L'architecte John Soane, auteur de la Banque d'Angleterre, achète en 1792 une maison de \
Lincoln's Inn Fields, à Londres, puis les deux maisons voisines, qu'il reconstruit \
l'une après l'autre jusqu'en 1824. Il en fait à la fois son logis, son agence et un \
musée pour ses élèves : moulages antiques, fragments de chapiteaux, maquettes, tableaux \
et milliers de dessins d'architecture s'y entassent jusque sous les verrières. En 1833, \
une loi votée par le Parlement lui permet de léguer l'ensemble à la nation, à condition \
que rien n'y soit déplacé ; le musée ouvre à sa mort, en 1837, et l'entrée y est \
toujours gratuite. On y découvre des espaces étonnants : la coupole, éclairée d'en \
haut, au-dessus de la crypte où repose le sarcophage du pharaon Séthi Iᵉʳ ; la salle \
des tableaux, dont les murs s'ouvrent comme des volets pour montrer les séries de \
Hogarth et des dessins de Piranèse ; la bibliothèque peinte en rouge pompéien ; les \
salons jaunes du premier étage."""
ici = """
Le bâtiment d'ARTEON reprend, en plus simple et plus grand, l'enchaînement des pièces \
de la maison de Soane. On entre par le sud dans le vestibule de Lincoln's Inn Fields, \
aux murs couleur pierre, qui ouvre sur la coupole : une salle carrée haute de quatorze \
mètres, où les prisons de Piranèse et le cénotaphe de Boullée encadrent la porte du \
nord. À l'ouest, la bibliothèque rouge, couleur de Pompéi, réunit Rome, l'Égypte et \
Byzance ; à l'est, le salon jaune accueille les photographes voyageurs, de l'Inde aux \
Andes. Au nord, le cabinet des tableaux montre l'architecture moderne : la tour Eiffel \
en chantier et la Casa Batlló."""

