# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Attersee"
annee = "1900"
image = "attersee.jpg"
technique = "Huile sur toile, 80 × 80 cm"
collection = "Leopold Museum, Vienne"
note = "Rien que l'eau du lac, en touches turquoise : l'un de ses premiers paysages carrés, presque abstrait."
description = """
Presque toute la toile est occupée par l'eau du lac, vue de haut et de près. Pas de \
barque, pas de baigneur, pas de rive au premier plan : seulement une surface mouvante \
faite de petites touches turquoise, vert d'eau et bleues qui s'entrecroisent. Tout en \
haut, une mince bande de terre ferme l'horizon, si étroite qu'on la remarque à peine. \
Les reflets du ciel et de la végétation se mêlent à la couleur de l'eau en taches qui \
frissonnent, plus claires ici, plus sombres là. Le format parfaitement carré supprime \
toute direction privilégiée : l'œil ne suit aucun chemin, aucune ligne de fuite, il \
flotte sur le lac comme un nageur, sans repère, porté par le seul mouvement des \
vaguelettes."""
evocation = """
Klimt fait du paysage une expérience de contemplation plutôt qu'une description. En \
éliminant tout motif pittoresque, il ne garde que la lumière et l'eau : on y a vu une \
forme de méditation, presque une image de l'infini, où le lac devient une étendue sans \
bord. Pour le peintre des grandes allégories, attaqué la même année pour son plafond \
de la Philosophie destiné à l'université, ces paysages étaient aussi un refuge : ils \
ne racontent rien et ne provoquent personne. Les historiens de l'art soulignent \
surtout leur modernité. En repoussant l'horizon jusqu'au bord supérieur et en \
remplissant la surface d'un motif presque uniforme, Klimt annonce une peinture qui \
tend vers l'abstraction, bien avant les grandes surfaces colorées de la peinture du \
XXe siècle."""
histoire = """
À l'été 1900, Klimt séjourne pour la première fois sur les rives de l'Attersee, dans \
le Salzkammergut, avec la famille de sa compagne Emilie Flöge. Il y reviendra presque \
chaque été jusqu'en 1916, d'abord à Litzlberg, puis à Kammer et enfin près d'Unterach. \
Ces vacances sont des périodes de travail intense : loin des commandes de portraits, \
il y peint l'essentiel de ses paysages, qu'il termine parfois à l'atelier de Vienne. \
Cette toile est l'une des premières nées de ces séjours. Plus faciles à placer que les \
grandes allégories, les paysages trouvent volontiers preneur auprès des \
collectionneurs viennois. Le tableau appartient aujourd'hui au Leopold Museum de \
Vienne, qui réunit la collection rassemblée après la Seconde Guerre mondiale par \
l'ophtalmologue Rudolf Leopold, grand défenseur de Klimt et de Schiele."""
facture = """
Klimt emprunte au néo-impressionnisme sa touche divisée, mais sans système \
scientifique : les petites virgules de couleur, posées côte à côte, restent libres et \
vibrantes. La gamme, restreinte aux bleus et aux verts, donne à la surface son unité. \
Le cadrage très serré et l'horizon rejeté tout en haut rappellent les estampes \
japonaises, que Klimt admirait, et la photographie. Le format carré, qu'il adopte pour \
presque tous ses paysages, devient sa signature et transforme la nature en surface \
décorative, sans perspective ni premier plan."""
details = [
  "Tout en haut, la mince bande de rive qui sert d'unique repère.",
  "Les petites touches de couleurs différentes, qui se mélangent quand on recule.",
  "L'absence totale de figure humaine, de barque ou de maison.",
  "Le format exactement carré, qui empêche le regard de filer vers un point de fuite.",
]
themes = ["paysage", "lac", "eau", "contemplation", "abstraction"]
anecdote = """
Pour cadrer ses paysages, Klimt utilisait un viseur, simple carton percé d'une \
fenêtre, et parfois une lunette ou des jumelles de théâtre. Ces instruments \
rapprochaient le motif et écrasaient la profondeur, d'où ses vues serrées, sans \
premier plan."""
salle = 2
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Les Trois Âges de la femme"
annee = "1905"
image = "trois-ages.jpg"
technique = "Huile sur toile, 180 × 180 cm"
collection = "Galleria Nazionale d'Arte Moderna, Rome"
note = "L'enfant, la mère et la vieille femme : une méditation sur le temps qui passe."
description = """
Sur un fond sombre, brun et gris, se détachent trois figures nues. Au centre et à \
droite, une jeune mère, les yeux clos, la tête inclinée, serre contre elle une petite \
fille endormie dont la joue repose sur sa poitrine. Leurs chevelures se fondent dans \
un voile bleuté semé de fleurs et de petits motifs ornementaux. À gauche, de profil, \
une vieille femme se tient debout, la tête baissée, le visage caché derrière sa main \
et sa longue chevelure grise. Son corps est peint sans complaisance : ventre gonflé, \
seins affaissés, bras amaigris et veinés. Le fond, presque nu, n'est animé que de \
taches dorées et d'une bande verticale décorée qui enveloppe le groupe de la mère et \
de l'enfant, laissant la vieille femme à l'écart."""
evocation = """
Le titre dit l'essentiel : enfance, maturité et vieillesse, trois étapes d'un même \
cycle. Le groupe de la mère et de l'enfant, entouré d'ornements, semble protégé du \
temps dans un sommeil paisible ; la vieille femme, exclue de ce cocon décoratif, porte \
seule le poids de la chair qui décline. Son geste, honte ou chagrin, a été lu comme le \
deuil d'une jeunesse perdue. On y a vu une vision très fin de siècle, contemporaine de \
Freud, de la femme ramenée à son destin biologique, de la fécondité jusqu'au déclin. \
Le tableau prolonge les méditations de Klimt sur le cycle de la vie, déjà au cœur de \
son plafond de la Philosophie, où une colonne de corps humains, du nouveau-né au \
vieillard, dérive dans le cosmos."""
histoire = """
Klimt peint cette grande toile carrée en 1905, l'année où il quitte la Sécession avec \
ses amis du « groupe Klimt » et renonce, après des années de polémique, à livrer ses \
plafonds pour l'université de Vienne. Le tableau n'est pas une commande : c'est une \
allégorie qu'il choisit de peindre pour lui-même. En 1911, il figure parmi les œuvres \
que Klimt envoie à l'Exposition internationale des beaux-arts de Rome, organisée pour \
le cinquantenaire de l'unité italienne, où le peintre est récompensé. L'État italien \
l'achète alors pour la Galleria Nazionale d'Arte Moderna. C'est ainsi que l'une des \
grandes allégories de Klimt se trouve à Rome, dans le palais de la Valle Giulia, au \
bord du parc de la Villa Borghèse, où elle est conservée depuis plus d'un siècle."""
facture = """
Klimt réunit deux manières dans un même tableau. Les corps sont modelés avec \
précision, presque cruellement pour la vieille femme, dont la peau grise et les veines \
sont rendues avec un réalisme hérité de sa formation académique. Autour d'eux, la \
toile devient au contraire plate et décorative : voile, chevelures et fond se changent \
en taches, en points et en motifs géométriques qui annoncent la période dorée. Le \
format carré et la composition sans profondeur donnent au groupe l'allure d'une icône. \
Les couleurs restent sourdes, bruns, gris et bleus, réveillées par quelques éclats \
d'or."""
details = [
  "La main de la vieille femme, qui lui cache le visage.",
  "La joue de l'enfant endormie, appuyée sur la poitrine de sa mère.",
  "Les fleurs mêlées à la chevelure de la jeune mère.",
  "Les veines saillantes des bras et le ventre gonflé de la vieille femme.",
  "Le voile orné de la mère et de l'enfant, face au fond nu derrière la vieille femme.",
]
themes = ["âges de la vie", "maternité", "vieillesse", "temps", "allégorie"]
anecdote = """
La silhouette de la vieille femme a souvent été rapprochée d'une sculpture de Rodin, « \
Celle qui fut la belle Heaulmière », inspirée d'un poème de François Villon où une \
ancienne beauté pleure son corps vieilli. Klimt admirait le sculpteur français."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.8

[[oeuvres]]
titre = "Adele Bloch-Bauer I"
annee = "1907"
image = "adele.jpg"
technique = "Huile, argent et or sur toile, 138 × 138 cm"
collection = "Neue Galerie, New York"
note = "Le portrait d'or de la femme d'un industriel viennois, volé par les nazis puis rendu à ses héritiers en 2006."
description = """
Adele Bloch-Bauer est assise de face dans un fauteuil, mais on distingue à peine où \
s'arrêtent sa robe, le siège et le fond : tout se fond dans une surface d'or. Seuls \
émergent, peints de façon réaliste, son visage pâle aux lèvres rouges, ses épaules \
nues et ses mains jointes à hauteur de la poitrine, doigts entremêlés. Elle porte un \
collier ras du cou serti de pierres. Sa robe est couverte d'yeux stylisés, de \
triangles et de rectangles ; le fauteuil se reconnaît à ses spirales dorées. En bas à \
gauche, une plage verte rompt l'or et suggère peut-être le sol. Le format est carré, \
et la figure en occupe presque toute la hauteur, comme une apparition sans poids, sans \
ombre et sans profondeur."""
evocation = """
Le tableau est le sommet de la période dorée de Klimt et l'image même de la Vienne \
1900, riche, cultivée et cosmopolite. Adele, qui tenait un salon fréquenté par des \
écrivains, des musiciens et des hommes politiques, y apparaît moins comme une personne \
que comme une idole, presque une icône byzantine. L'or ne la flatte pas seulement : il \
l'enferme. Le contraste entre la chair fragile et la parure figée a été lu comme une \
réflexion sur la condition de la femme de la grande bourgeoisie, admirée et \
prisonnière de son décor. Les yeux empruntés à l'Égypte ancienne ajoutent une part de \
mystère. Depuis sa restitution, le portrait est aussi devenu un symbole des \
spoliations nazies et du combat des familles juives pour retrouver leurs biens."""
histoire = """
Le portrait est commandé par Ferdinand Bloch-Bauer, industriel du sucre, pour son \
épouse Adele. Klimt y travaille de 1903 à 1907 et accumule plus d'une centaine de \
dessins préparatoires. Montré à Vienne dès 1908, il est accroché dans la demeure du \
couple. Adele meurt en 1925 en demandant à son mari de léguer un jour ses Klimt à la \
Galerie autrichienne. En 1938, après l'Anschluss, Ferdinand s'enfuit et ses biens sont \
confisqués ; le portrait entre en 1941 à la Galerie autrichienne, rebaptisé « Dame en \
or » pour masquer l'identité juive du modèle. Sa nièce Maria Altmann obtient sa \
restitution en 2006, après une procédure portée jusqu'à la Cour suprême des États-Unis \
puis un arbitrage en Autriche. Ronald Lauder l'achète alors pour la Neue Galerie de \
New York."""
facture = """
Klimt combine la peinture à l'huile et la feuille d'or et d'argent, appliquée sur des \
couches préparatoires parfois travaillées en léger relief, à la manière d'un orfèvre. \
Il s'inspire des mosaïques byzantines de Ravenne, découvertes lors d'un voyage en \
1903, en particulier de celle de l'impératrice Théodora à San Vitale. Le contraste est \
total entre la chair, modelée avec douceur, et l'immense surface plate des ornements, \
où la profondeur disparaît. Les motifs puisent à l'Égypte, à la Grèce archaïque et aux \
recherches décoratives de la Wiener Werkstätte, les ateliers d'art fondés à Vienne en \
1903."""
details = [
  "Les yeux stylisés, d'inspiration égyptienne, qui parsèment la robe.",
  "Les mains aux doigts entrelacés, crispées devant la poitrine.",
  "Le collier ras du cou, seul bijou bien lisible au milieu de l'or.",
  "Les spirales dorées qui dessinent le dossier et les accoudoirs du fauteuil.",
  "La zone verte en bas à gauche, unique respiration dans l'or.",
]
themes = ["portrait", "or", "vienne 1900", "byzantin", "spoliation"]
anecdote = """
En juin 2006, Ronald Lauder a payé 135 millions de dollars pour ce portrait, alors le \
prix le plus élevé jamais atteint par un tableau. L'histoire de sa restitution a \
inspiré le film « La Femme au tableau » (2015), avec Helen Mirren dans le rôle de \
Maria Altmann."""
salle = 3
mur = "est"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "L'Espérance II"
annee = "1907–1908"
image = "esperance.jpg"
technique = "Huile, or et platine sur toile, 110,5 × 110,5 cm"
collection = "Museum of Modern Art, New York"
note = "Une femme enceinte, les yeux baissés, enveloppée d'une robe de motifs : à ses pieds, des femmes en prière."
description = """
Une jeune femme enceinte est vue de profil, la tête penchée en avant, les yeux fermés. \
Son ventre arrondi se devine sous une ample robe en forme de cloche, couverte de \
cercles, de carrés et de motifs dorés et colorés, d'où émergent ses épaules nues et \
son visage. Tout près de son ventre, une petite tête de mort se glisse dans le décor \
de la robe, à peine visible au premier regard. Au bas du tableau, trois femmes aux \
visages inclinés, les yeux clos, semblent prier ou se recueillir, comme agenouillées \
au pied de la future mère. Le fond sombre, piqué d'or, isole les figures. Le format \
carré resserre l'attention sur cette silhouette verticale qui s'élève du groupe des \
trois femmes jusqu'au profil de la jeune femme."""
evocation = """
L'attente d'un enfant, qui donne son titre au tableau, est ici traversée d'inquiétude. \
La tête de mort cachée près du ventre rappelle que la vie et la mort sont liées dès \
l'origine, à une époque où l'accouchement restait périlleux pour la mère comme pour \
l'enfant. Les trois femmes du bas ont été vues tantôt comme des figures de prière, qui \
implorent une issue heureuse, tantôt comme des pleureuses annonçant un deuil. La \
future mère, recueillie, semble protéger son enfant autant que se replier sur \
elle-même. Klimt reprend un thème qu'il avait traité de façon provocante quelques \
années plus tôt, mais il le transpose dans un registre intérieur et méditatif, où \
l'ornement enveloppe l'angoisse sans la faire disparaître."""
histoire = """
Le tableau fait suite à une première version, L'Espérance I (1903), qui montrait une \
femme enceinte entièrement nue, entourée de figures monstrueuses et de crânes. Jugée \
trop choquante pour être montrée au public en 1903, elle fut achetée par Fritz \
Waerndorfer, cofondateur de la Wiener Werkstätte, qui la gardait, dit-on, derrière des \
volets fermés. Elle se trouve aujourd'hui au Musée des beaux-arts du Canada, à Ottawa. \
Pour la seconde version, peinte en pleine période dorée, Klimt habille son modèle et \
remplace les monstres par des femmes en prière. Le tableau est acquis en 1978 par le \
Museum of Modern Art de New York, grâce notamment aux fonds de Ronald et Jo Carole \
Lauder et au marchand Serge Sabarsky, deux grands promoteurs de l'art viennois aux \
États-Unis."""
facture = """
Klimt associe ici l'huile à l'or et au platine, qui donnent aux motifs de la robe un \
éclat métallique changeant selon la lumière, plus chaud ou plus froid. La robe forme \
une grande surface plate, une mosaïque de cercles, de carrés et de rectangles rouges, \
bleus et verts, qui contraste avec le modelé délicat du visage et des épaules. Le \
profil, net et pur, rappelle les figures des vases grecs ou des reliefs égyptiens. La \
composition verticale, presque en forme de colonne, monte des trois têtes inclinées \
jusqu'à celle de la mère."""
details = [
  "La petite tête de mort dissimulée près du ventre de la future mère.",
  "Les paupières baissées de la jeune femme, qui semble écouter son enfant.",
  "Les trois visages de femmes alignés au bas de la toile.",
  "Les reflets du platine, plus froids que ceux de l'or.",
]
themes = ["maternité", "espérance", "mort", "prière", "or"]
anecdote = """
En allemand, « guter Hoffnung sein », être de bonne espérance, signifie attendre un \
enfant. Le titre original, Die Hoffnung, joue sur ce double sens : l'espoir et la \
grossesse. Le visiteur viennois de l'époque comprenait l'allusion immédiatement."""
salle = 3
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Mort et Vie"
annee = "1910–1915"
image = "mort-vie.jpg"
technique = "Huile sur toile, 178 × 198 cm"
collection = "Leopold Museum, Vienne"
note = "À gauche, la mort en manteau de croix ; à droite, l'enchevêtrement des vivants, qui dorment sans la voir."
description = """
Le tableau est coupé en deux par un vide. À gauche, la Mort se tient debout, squelette \
au crâne grimaçant enveloppé d'un manteau sombre couvert de croix et de motifs \
funéraires ; elle tient une massue rouge et observe les vivants. À droite, une masse \
compacte de corps enlacés flotte comme une île colorée : une mère tenant son bébé, une \
vieille femme, des jeunes femmes, un homme qui enlace sa compagne. Presque tous ont \
les yeux fermés et semblent dormir, inconscients de la présence qui les guette. Leurs \
corps sont pris dans des étoffes à motifs de fleurs, de cercles et de rectangles \
vivement colorés, qui contrastent avec le fond uni et sombre. Entre les deux groupes, \
rien : un espace nu qui sépare la Mort des vivants."""
evocation = """
Klimt reprend le vieux thème de la danse macabre, mais sans terreur spectaculaire : la \
Mort ne frappe pas encore, elle attend. Face à elle, l'humanité est représentée à tous \
ses âges, de la naissance à la vieillesse, unie par l'amour et le sommeil. On a lu ce \
sommeil collectif comme une façon de dire que la vie continue en ignorant sa fin, ou \
que l'amour et la maternité sont la seule réponse à la mort. Le cercle des vivants, \
qui se renouvelle par les naissances, semble l'emporter par sa vitalité colorée sur la \
figure isolée et sombre du squelette. Achevé pendant la Première Guerre mondiale, le \
tableau a pris rétrospectivement une résonance tragique, dans une Vienne qui voyait \
mourir ses soldats et bientôt son empire."""
histoire = """
Klimt commence le tableau vers 1910. Dans un premier état, sur fond d'or, il le \
présente à l'Exposition internationale de Rome en 1911. Insatisfait, il le reprend \
pendant plusieurs années : vers 1915, il remplace l'or par un fond sombre et uni, \
modifie la composition et enrichit le groupe des vivants, renonçant ainsi à \
l'esthétique de la période dorée. C'est l'une de ses dernières grandes allégories : \
Klimt meurt trois ans plus tard, en 1918. Le tableau appartient aujourd'hui au Leopold \
Museum, ouvert en 2001 dans le MuseumsQuartier de Vienne, où il voisine avec les \
œuvres d'Egon Schiele. Le jeune peintre, qui admirait Klimt, avait lui-même traité le \
thème de la mort et de la jeune fille dans des toiles saisissantes, et mourut la même \
année que son aîné."""
facture = """
Le passage de l'or à un fond sombre et mat marque la fin de la période dorée : les \
ornements ne sont plus en métal mais en couleurs pures, posées en petites plages \
juxtaposées, rouges, bleues, violettes et vertes. Les corps, au modelé souple, \
s'emboîtent comme les pièces d'un puzzle dans les étoffes décorées. La composition \
joue sur l'asymétrie : la Mort, verticale et isolée, fait face à une masse oblique de \
vivants, et l'espace vide entre eux crée toute la tension du tableau. On y a vu l'écho \
de la couleur vive des fauves et l'attrait de Klimt pour les tissus."""
details = [
  "Le manteau de la Mort, constellé de croix.",
  "La massue rouge que tient le squelette.",
  "Le bébé endormi dans les bras de sa mère, au cœur du groupe des vivants.",
  "Le vide sombre qui sépare la Mort de l'enchevêtrement des corps.",
]
themes = ["mort", "vie", "danse macabre", "âges de la vie", "sommeil"]
anecdote = """
On connaît le premier état du tableau, sur fond doré, grâce à une photographie prise \
lors de l'exposition de Rome en 1911. La comparaison montre que Klimt a presque \
entièrement repeint sa toile, changeant le fond et le nombre de figures."""
salle = 4
mur = "ouest"
position = -5
largeur = 2.0

[[oeuvres]]
titre = "La Vierge"
annee = "1913"
image = "la-vierge.jpg"
technique = "Huile sur toile, 190 × 200 cm"
collection = "Galerie nationale de Prague"
note = "Des jeunes femmes endormies, emmêlées dans une spirale de tissus colorés : le rêve d'une jeune fille."
description = """
Au centre d'une grande composition presque carrée, une jeune femme dort, la tête \
inclinée, les yeux clos, le visage paisible. Autour d'elle, d'autres jeunes femmes, \
nues ou à demi vêtues, sont prises dans le même tourbillon : l'une se cambre, d'autres \
s'enroulent sur elles-mêmes ou se blottissent, une autre encore semble s'éveiller. \
Leurs corps sont entremêlés dans un immense drapé aux couleurs vives, violet, rose, \
orangé et bleu, semé de fleurs, de cercles et de spirales, qui forme une sorte d'île \
flottante. Tout autour, le fond bleu nuit, presque noir, ne laisse deviner ni sol ni \
horizon : le groupe semble suspendu dans le vide, comme dans l'espace d'un rêve, sans \
pesanteur et sans direction."""
evocation = """
Le titre oriente la lecture : on y voit traditionnellement la jeune fille endormie au \
centre et, autour d'elle, ses rêves ou les étapes de son éveil à la sensualité et à la \
vie de femme. Les poses des autres figures, de l'abandon au repli, ont été comprises \
comme les états successifs d'une même personne, de l'innocence au désir. Le sommeil, \
chez Klimt, est souvent un moment de vie intérieure plutôt qu'un simple repos. Le \
tableau reflète l'atmosphère d'une Vienne où Freud avait publié L'Interprétation des \
rêves en 1900 et où la sexualité féminine devenait un sujet d'étude et de débat. Il \
montre aussi un Klimt qui, après l'or, célèbre la couleur, la jeunesse et la vitalité \
du corps."""
histoire = """
Peinte en 1913, La Vierge appartient aux dernières années de Klimt, quand il a \
abandonné l'or pour des compositions très colorées. Ce n'est pas une commande mais une \
grande allégorie, comme Mort et Vie, à laquelle elle fait écho par son groupe de corps \
flottant dans le vide. À cette date, Klimt est un artiste reconnu dans toute l'Europe \
centrale et expose régulièrement hors de Vienne. Le tableau entre ensuite dans les \
collections publiques de Prague, alors l'une des grandes villes de l'Autriche-Hongrie \
: ce n'est qu'après 1918, avec la naissance de la Tchécoslovaquie, qu'il se retrouve à \
l'étranger. Conservé par la Galerie nationale, il est l'une des rares grandes \
allégories de Klimt visibles hors d'Autriche, et l'un des fleurons de ses collections \
d'art moderne."""
facture = """
Klimt abandonne ici la feuille d'or au profit d'une palette éclatante, où dominent les \
violets, les roses, les orangés et les bleus. Les ornements ne sont plus géométriques \
et métalliques mais floraux, inspirés des tissus et de l'art d'Extrême-Orient que \
Klimt collectionnait. La composition en spirale enroule les corps autour de la figure \
centrale et les détache sur un fond sombre presque uniforme, qui avive les couleurs. \
Les corps, aux contours souples, gardent la ligne élégante héritée de ses innombrables \
dessins d'après modèle."""
details = [
  "Le visage paisible de la jeune fille endormie, au centre du tourbillon.",
  "Les fleurs et les spirales qui couvrent l'immense drapé.",
  "Le fond bleu nuit, sans sol ni horizon, où le groupe semble flotter.",
  "Les bras et les jambes entremêlés, qu'on a du mal à attribuer à chaque figure.",
]
themes = ["rêve", "sommeil", "jeunesse", "féminité", "couleur"]
anecdote = """
Klimt dessinait sans relâche les modèles qui posaient dans son atelier, endormies, \
allongées ou abandonnées. Il a laissé plusieurs milliers de dessins, bien plus que de \
tableaux, et beaucoup de poses de La Vierge en sont issues."""
salle = 4
mur = "est"
position = 5
largeur = 2.0

[[oeuvres]]
titre = "Le Baiser"
annee = "1907–1908"
image = "baiser.jpg"
technique = "Huile et feuille d'or sur toile, 180 × 180 cm"
collection = "Österreichische Galerie Belvedere, Vienne"
note = "Deux amants enlacés au bord d'un pré fleuri, enveloppés d'or : l'œuvre la plus célèbre de Vienne."
description = """
Au bord d'un petit pré fleuri qui s'arrête net, comme au bord d'une falaise, un couple \
s'enlace sur un fond d'or piqueté. L'homme, couronné de lierre, penche la tête pour \
embrasser la joue de la femme ; son visage est presque entièrement caché. Elle est \
agenouillée, les yeux fermés, la tête renversée sur l'épaule, une main posée sur la \
nuque de son compagnon, des fleurs dans les cheveux. Leurs corps se confondent en une \
seule forme dorée : la tunique de l'homme est couverte de rectangles noirs, blancs et \
argentés, la robe de la femme de cercles et de motifs floraux colorés. Les pieds nus \
de la femme, crispés, dépassent du bord du pré, au-dessus du vide doré."""
evocation = """
Le Baiser est devenu l'image universelle de l'amour, mais il est plus ambigu qu'il n'y \
paraît. La femme, les yeux clos, semble à la fois s'abandonner et se retenir ; ses \
mains et ses pieds crispés, au bord du vide, ont fait parler d'une extase qui frôle le \
danger. Les motifs ont été lus comme des symboles : rectangles masculins pour l'homme, \
cercles et fleurs féminins pour la femme, réunis dans une même enveloppe d'or. On a \
voulu reconnaître Klimt et sa compagne Emilie Flöge dans le couple, sans aucune \
preuve. L'or, emprunté aux icônes, fait de cette étreinte un moment hors du temps, \
presque sacré. Le tableau résume enfin l'ambition de la Sécession : unir peinture et \
arts décoratifs dans une œuvre d'art totale."""
histoire = """
Klimt peint Le Baiser en 1907-1908, au sommet de sa période dorée, quelques années \
après la querelle épuisante des peintures de l'université. L'œuvre est présentée en \
1908 à la Kunstschau, la grande exposition d'art organisée à Vienne par Klimt et ses \
amis après leur départ de la Sécession, sous le titre « Couple d'amoureux ». Pendant \
l'exposition, le ministère de l'Instruction publique l'achète pour la Moderne Galerie \
de l'État, ancêtre du Belvédère, pour 25 000 couronnes, une somme considérable. Le \
tableau n'a plus quitté depuis les collections publiques autrichiennes. Il est \
accroché au Belvédère supérieur, l'ancien palais du prince Eugène de Savoie, où il \
attire chaque année des visiteurs du monde entier."""
facture = """
Klimt superpose à la peinture à l'huile de la feuille d'or, posée en couches et \
parfois en léger relief, avec un savoir-faire d'orfèvre. Le contraste entre les \
visages et les mains, peints avec délicatesse, et les vêtements réduits à des surfaces \
planes d'ornements donne l'impression d'une apparition. Le format carré, le fond sans \
profondeur et la silhouette du couple, réunie en une seule forme allongée, concentrent \
tout le regard sur l'étreinte. Le pré, semé de petites fleurs, rappelle les \
tapisseries médiévales, tandis que l'or évoque les icônes et les mosaïques byzantines."""
details = [
  "Les orteils de la femme, crispés au bord du pré comme au bord d'un précipice.",
  "La couronne de lierre de l'homme et les fleurs dans les cheveux de la femme.",
  "Les rectangles noirs et blancs de la tunique, opposés aux cercles colorés de la robe.",
  "Les mains de l'homme qui encadrent le visage de la femme et le tournent vers lui.",
  "Les fins éclats dorés éparpillés sur le fond, comme une poussière d'étoiles.",
]
themes = ["amour", "couple", "or", "étreinte", "byzantin"]
anecdote = """
Pour la Saint-Valentin 2022, le Belvédère a découpé une reproduction numérique en \
haute définition du Baiser en 10 000 fragments, vendus en ligne sous forme de NFT : \
une manière inattendue de faire entrer l'œuvre de 1908 dans l'ère numérique."""
salle = 4
mur = "nord"
position = 0
largeur = 1.8

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Gustav Klimt"
vie = "Baumgarten, près de Vienne, 14 juillet 1862 – Vienne, 6 février 1918"
biographie = """
Gustav Klimt naît en 1862 à Baumgarten, aux portes de Vienne, deuxième des sept \
enfants d'Ernst Klimt, graveur sur or venu de Bohême, et d'Anna Finster. La famille \
est modeste. À quatorze ans, il entre à l'École des arts décoratifs de Vienne, où son \
frère Ernst le rejoint. Avec lui et leur camarade Franz Matsch, il fonde une compagnie \
de décorateurs qui obtient de grandes commandes officielles : plafonds des escaliers \
du Burgtheater, peintures du grand escalier du Kunsthistorisches Museum. En 1892, la \
mort de son père puis de son frère Ernst le bouleverse. En 1897, il fonde avec \
d'autres artistes la Sécession viennoise, dont il est le premier président, pour \
ouvrir l'Autriche à l'art moderne européen. Les grandes toiles commandées pour \
l'université de Vienne, la Philosophie, la Médecine et la Jurisprudence, déclenchent \
un scandale : Klimt renonce à la commande en 1905 et quitte la Sécession. Ces toiles \
disparaîtront dans un incendie en 1945. S'ouvre alors la période dorée, avec Le Baiser \
et les portraits de femmes de la grande bourgeoisie, puis la frise en mosaïque du \
palais Stoclet à Bruxelles. Il ne se marie jamais, a plusieurs enfants naturels et \
partage sa vie avec la créatrice de mode Emilie Flöge, avec qui il passe ses étés au \
bord de l'Attersee. Il soutient les jeunes artistes, au premier rang desquels Egon \
Schiele. Frappé d'une attaque en janvier 1918, il meurt à Vienne le 6 février."""
style = """
Formé à une peinture académique très sûre, Klimt dépasse vite le réalisme historique \
pour une peinture où le corps humain, modelé avec finesse, se détache sur des surfaces \
décoratives planes. Sa marque la plus reconnaissable est l'emploi de la feuille d'or \
et d'ornements empruntés à Byzance, à l'Égypte, à la Grèce archaïque et à l'art \
japonais. Les femmes, sensuelles ou inquiétantes, et les grands thèmes de l'amour, de \
la vie et de la mort dominent son œuvre ; ses paysages carrés, eux, frôlent \
l'abstraction. En effaçant la frontière entre peinture et arts décoratifs, il a \
incarné l'Art nouveau viennois et ouvert la voie à l'expressionnisme de Schiele et de \
Kokoschka."""
