# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Henri Matisse"
vie = "Le Cateau-Cambrésis (Nord), 31 décembre 1869 – Nice, 3 novembre 1954"
biographie = """
Fils d'un marchand de grains du Nord, Henri Matisse se destine d'abord au droit et \
travaille comme clerc d'avoué. En 1890, immobilisé par une appendicite, il reçoit de sa \
mère une boîte de couleurs : c'est une révélation. Il part pour Paris, entre en 1895 à \
l'École des beaux-arts dans l'atelier de Gustave Moreau, découvre l'impressionnisme et \
Cézanne, puis la lumière du Midi en Corse. En 1898, il épouse Amélie Parayre. Après un \
été à Saint-Tropez auprès de Signac en 1904, il peint à Collioure avec Derain, en 1905, \
les toiles qui font scandale au Salon d'Automne et font de lui le chef des « fauves ». \
Soutenu par les Stein, puis par les collectionneurs russes Chtchoukine et Morozov, il \
ouvre une académie et voyage au Maroc. À partir de 1917, il travaille surtout à Nice, \
où il peint ses odalisques. Gravement malade en 1941, il invente dans ses dernières \
années les gouaches découpées et conçoit la chapelle du Rosaire de Vence. Il meurt à \
Nice en 1954."""
style = """
Matisse fait de la couleur le moteur de la peinture : posée en aplats purs, elle \
construit l'espace, la lumière et l'émotion sans recourir au modelé ni à la \
perspective. Son dessin, d'une grande économie, cherche l'arabesque essentielle. Il \
rêvait d'un art d'équilibre et de sérénité, décoratif au sens le plus noble. Il est \
l'un des grands inventeurs de la peinture du XXe siècle ; ses intérieurs, ses papiers \
découpés et sa liberté chromatique ont nourri l'abstraction américaine et des \
générations de peintres et de créateurs."""

[[artistes]]
nom = "André Derain"
vie = "Chatou (Yvelines), 10 juin 1880 – Garches (Hauts-de-Seine), 8 septembre 1954"
biographie = """
Fils d'un commerçant aisé de Chatou, André Derain renonce aux études d'ingénieur pour \
la peinture. En 1900, il rencontre Maurice de Vlaminck, avec qui il partage un atelier \
à Chatou, puis Henri Matisse, qui convainc ses parents de le laisser peindre. Après son \
service militaire, il passe l'été 1905 avec Matisse à Collioure et expose au Salon \
d'Automne parmi les « fauves ». Le marchand Ambroise Vollard l'envoie peindre Londres : \
ses vues de la Tamise comptent parmi les sommets du fauvisme. Dès 1907, proche de \
Picasso, il se tourne vers une peinture plus construite, inspirée de Cézanne et de \
l'art africain, puis vers un retour à la tradition des maîtres anciens. Mobilisé \
pendant toute la Grande Guerre, il connaît ensuite un grand succès et crée des décors \
pour les Ballets russes. Son voyage en Allemagne en 1941, à l'invitation des autorités \
nazies, ternit durablement sa réputation. Il meurt en 1954 des suites d'un accident de \
la route."""
style = """
Derain est, avec Matisse, l'inventeur du fauvisme : couleurs pures et arbitraires, \
touches larges ou fragmentées, contrastes de complémentaires qui rendent \
l'éblouissement de la lumière. Mais il ne s'en tient pas là : curieux de tout, il passe \
ensuite par une géométrie cézannienne, puis cherche dans les primitifs, les icônes et \
les maîtres classiques un art plus grave et plus solide. Ses toiles de 1905 et 1906, à \
Collioure et à Londres, restent les plus célèbres et comptent parmi les images les plus \
vives du début du siècle."""

[[artistes]]
nom = "Ernst Ludwig Kirchner"
vie = "Aschaffenbourg (Bavière), 6 mai 1880 – Frauenkirch, près de Davos (Suisse), 15 juin 1938"
biographie = """
Fils d'un chimiste spécialiste du papier, Ernst Ludwig Kirchner étudie l'architecture à \
l'École technique supérieure de Dresde, où il se lie avec Erich Heckel, Karl \
Schmidt-Rottluff et Fritz Bleyl. Ensemble, ils fondent en 1905 le groupe Die Brücke, « \
le pont », qui veut jeter un pont vers l'art de l'avenir. Dans leurs ateliers et au \
bord des lacs de Moritzburg, ils peignent des nus en plein air, gravent sur bois et \
vivent en communauté. Kirchner découvre l'art africain et océanien au musée \
d'ethnographie de Dresde. En 1911, il s'installe à Berlin, où il peint les scènes de \
rue qui font sa célébrité. Sa Chronique de Die Brücke, jugée trop personnelle par ses \
camarades, provoque la dissolution du groupe en 1913. Mobilisé en 1915, il s'effondre \
et part en 1917 se soigner en Suisse, près de Davos, où il peint les montagnes et les \
paysans. En 1937, les nazis retirent des musées allemands plus de six cents de ses \
œuvres. L'année suivante, il se donne la mort à Frauenkirch."""
style = """
Kirchner est la figure centrale de l'expressionnisme allemand. Sa peinture repose sur \
un trait anguleux et rapide, des formes étirées et des couleurs crues, souvent acides, \
qui traduisent une tension psychologique plus qu'une apparence. La gravure sur bois, \
qu'il pratique avec passion, nourrit ses contrastes tranchants. Ses scènes de rue \
berlinoises sont devenues l'image même de la métropole moderne, nerveuse et \
inquiétante, et ont marqué durablement l'art figuratif allemand, jusqu'aux \
néo-expressionnistes des années 1980."""

[[artistes]]
nom = "Franz Marc"
vie = "Munich, 8 février 1880 – Braquis, près de Verdun, 4 mars 1916"
biographie = """
Fils du peintre paysagiste Wilhelm Marc, Franz Marc songe d'abord à la théologie avant \
d'entrer en 1900 à l'Académie des beaux-arts de Munich. Deux séjours à Paris, en 1903 \
et 1907, lui font découvrir l'impressionnisme puis Van Gogh et Gauguin. Il traverse une \
longue période de doute et vit en partie de cours d'anatomie animale. En 1910, il \
rencontre August Macke, puis Vassily Kandinsky, et s'installe à Sindelsdorf, en \
Haute-Bavière, avec Maria Franck, qu'il épouse en 1911. Cette année-là, il fonde avec \
Kandinsky le Cavalier bleu et prépare l'exposition et l'almanach qui portent ce nom. \
Ses chevaux, ses chevreuils, ses tigres et ses vaches aux couleurs symboliques \
l'imposent comme l'un des grands peintres de sa génération. Au contact de Delaunay et \
des futuristes, ses compositions se fragmentent en prismes, jusqu'à l'abstraction en \
1914. Mobilisé dès le début de la guerre, il est tué par un éclat d'obus près de Verdun \
en mars 1916, à trente-six ans."""
style = """
Marc a voulu peindre le monde tel que le perçoivent les animaux, qu'il jugeait plus \
purs et plus proches de l'harmonie de la nature que les hommes. Ses couleurs ne \
décrivent pas : elles signifient, selon une symbolique précise où le bleu est l'esprit, \
le jaune la douceur et le rouge la matière. Ses compositions rythmées de courbes, puis \
de plans prismatiques, mènent de la figuration à l'abstraction. Figure majeure du \
Cavalier bleu, il a contribué à faire de la couleur un langage spirituel."""

[[artistes]]
nom = "August Macke"
vie = "Meschede (Westphalie), 3 janvier 1887 – Perthes-lès-Hurlus (Marne), 26 septembre 1914"
biographie = """
Né en Westphalie et élevé à Cologne puis à Bonn, August Macke étudie à l'Académie des \
beaux-arts et à l'École des arts appliqués de Düsseldorf. Il voyage en Italie, aux \
Pays-Bas, en Belgique et à Paris, où il découvre les impressionnistes en 1907. Il \
épouse en 1909 Elisabeth Gerhardt, dont l'oncle, l'industriel berlinois Bernhard \
Koehler, devient son mécène. Lors d'un séjour au bord du Tegernsee, il rencontre Franz \
Marc en 1910 ; l'amitié des deux peintres sera l'une des plus fécondes de l'époque. Il \
participe au Cavalier bleu et à son almanach, avant de prendre ses distances avec le \
mysticisme de Kandinsky. En 1912, avec Marc, il rend visite à Robert Delaunay à Paris, \
une rencontre décisive. Il organise à Bonn en 1913 une exposition d'expressionnistes \
rhénans, puis passe quelques mois au bord du lac de Thoune. En avril 1914, il voyage en \
Tunisie avec Paul Klee et Louis Moilliet et en rapporte des dizaines d'aquarelles. \
Mobilisé en août, il est tué en Champagne quelques semaines plus tard, à vingt-sept \
ans."""
style = """
Macke est le plus lumineux des expressionnistes allemands. Moins tourmenté que \
Kirchner, moins mystique que Kandinsky ou Marc, il peint un monde de promeneurs, de \
parcs, de vitrines et de jardins, où la couleur vive exprime la joie de vivre. Il fait \
la synthèse du fauvisme, du cubisme et des contrastes simultanés de Delaunay : plans \
colorés transparents, figures simplifiées, couleurs qui créent la lumière. Ses \
aquarelles de Tunisie, d'une grande liberté, comptent parmi les sommets de l'aquarelle \
moderne."""

[[artistes]]
nom = "Egon Schiele"
vie = "Tulln (Basse-Autriche), 12 juin 1890 – Vienne, 31 octobre 1918"
biographie = """
Fils d'un chef de gare de Tulln, Egon Schiele perd son père à quatorze ans et entre à \
seize ans à l'Académie des beaux-arts de Vienne, qu'il quitte en 1909, lassé de son \
conservatisme. Gustav Klimt, qui l'admire, le présente à des collectionneurs et aux \
ateliers de la Wiener Werkstätte. Schiele s'affranchit vite de l'ornement klimtien pour \
une peinture du corps et de l'angoisse. En 1911, il s'installe avec Wally Neuzil à \
Krumau, en Bohême, puis à Neulengbach, d'où les rumeurs les chassent ; en 1912, il y \
fait vingt-quatre jours de prison pour des dessins jugés immoraux. En 1915, il épouse \
Edith Harms et est mobilisé, affecté le plus souvent à l'arrière. En 1918, l'exposition \
de la Sécession, où il occupe la salle principale, lui apporte enfin le succès. Mais la \
grippe espagnole emporte Edith, enceinte de six mois, le 28 octobre 1918, puis Schiele \
lui-même trois jours plus tard. Il avait vingt-huit ans."""
style = """
Schiele est d'abord un dessinateur virtuose : sa ligne tendue, anguleuse, parfois \
brisée, suffit à faire surgir un corps et un tourment. Dans ses portraits, ses \
autoportraits et ses nus, il montre les corps maigres, crispés, exposés sans fard, avec \
une franchise qui fit scandale. Ses couleurs, souvent terreuses et rehaussées de rouges \
et d'orangés, accentuent l'impression de chair vive. Figure majeure de \
l'expressionnisme viennois, il a vu son influence grandir sans cesse depuis les années \
1960."""

[[artistes]]
nom = "Amedeo Modigliani"
vie = "Livourne (Italie), 12 juillet 1884 – Paris, 24 janvier 1920"
biographie = """
Né à Livourne dans une famille juive séfarade cultivée mais ruinée, Amedeo Modigliani, \
de santé fragile, étudie la peinture à Livourne, Florence et Venise, nourri des maîtres \
de la Renaissance. En 1906, il s'installe à Paris, d'abord à Montmartre puis à \
Montparnasse. Entre 1909 et 1914, encouragé par le sculpteur Constantin Brancusi, il se \
consacre surtout à la sculpture et taille des têtes de pierre allongées, avant que sa \
santé ne l'oblige à y renoncer. Revenu à la peinture, il réalise les portraits de ses \
amis, Soutine, Max Jacob, Cocteau, et une série de nus ; lors de leur exposition à la \
galerie Berthe Weill, en 1917, la police exige leur retrait dès le jour du vernissage. \
Ses marchands, Paul Guillaume puis Léopold Zborowski, le soutiennent. En 1917, il \
rencontre Jeanne Hébuterne, qui lui donne une fille en 1918. Miné par la tuberculose, \
l'alcool et la misère, il meurt en 1920 à trente-cinq ans, au moment où sa peinture \
commence à se vendre."""
style = """
Modigliani a créé une figure humaine immédiatement reconnaissable : visage ovale, cou \
étiré, nez long, yeux en amande souvent sans pupilles, épaules tombantes. Ce canon unit \
la grâce des peintres siennois et de Botticelli, la simplification de la sculpture \
africaine et archaïque et la construction de Cézanne. Ni fauve ni cubiste, il reste en \
marge des mouvements de son temps, mais partage avec les expressionnistes la volonté de \
traduire une présence intérieure plutôt qu'une ressemblance."""

[[artistes]]
nom = "Paula Modersohn-Becker"
vie = "Dresde, 8 février 1876 – Worpswede (près de Brême), 20 novembre 1907"
biographie = """
Née à Dresde dans une famille cultivée installée à Brême en 1888, Paula Becker suit une \
formation d'institutrice, comme le souhaitent ses parents, tout en prenant des cours de \
dessin et de peinture à Londres et à Berlin. En 1898, elle rejoint Worpswede, colonie \
d'artistes nichée dans les tourbières près de Brême, où elle se lie avec la sculptrice \
Clara Westhoff, future épouse du poète Rilke. Entre 1900 et 1907, elle fait quatre \
séjours à Paris, où elle découvre Cézanne, Gauguin, les Nabis et les portraits du \
Fayoum. En 1901, elle épouse le peintre Otto Modersohn, veuf et père d'une petite \
fille. Étouffant dans la vie conjugale et dans le cercle de Worpswede, qui juge sa \
peinture maladroite, elle part seule pour Paris en 1906, où elle peint des \
autoportraits et des natures mortes d'une liberté nouvelle. Revenue à Worpswede, elle \
meurt en novembre 1907, dix-huit jours après la naissance de sa fille Mathilde, à \
trente et un ans. Elle n'avait vendu que quelques tableaux ; elle en laissait plus de \
sept cents."""
style = """
Paula Modersohn-Becker a dépassé le réalisme sentimental des peintres de Worpswede pour \
une peinture de formes simples et massives, aux couleurs sourdes et à la matière \
grenue. Inspirée par Cézanne, Gauguin et l'art archaïque, elle peint les paysannes, les \
enfants, les mères et surtout elle-même, avec une gravité et une franchise inédites. \
Pionnière de l'expressionnisme allemand, elle est aussi l'une des premières femmes à \
avoir fait de son propre corps le sujet de son art."""
