# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Luxe, calme et volupté"
artiste = "Henri Matisse"
annee = "1904"
image = "luxe-calme-volupte.jpg"
technique = "Huile sur toile, 98,5 × 118,5 cm"
collection = "Centre Pompidou, Musée national d'art moderne, Paris (déposé au musée d'Orsay)"
note = "Un pique-nique au bord de la mer, à Saint-Tropez, peint en petites touches de couleur pure : le titre vient d'un poème de Baudelaire."
description = """
Au bord d'une baie, à l'heure où le soleil couchant embrase le ciel, un petit groupe \
s'est installé sur la plage. À gauche, une femme vêtue d'une robe sombre et coiffée \
d'un chapeau est assise près d'une nappe blanche où sont posées des tasses et une \
théière. Autour d'elle, des baigneuses nues se reposent, s'allongent ou se sèchent ; \
l'une, debout à droite, laisse pendre sa longue chevelure devant elle. Au centre, le \
mât d'une barque tirée sur le sable trace une grande diagonale. Un pin élancé ferme la \
composition à droite, ses branches dessinant des arabesques dans un ciel rose et jaune. \
Au fond, des collines bleues bordent l'autre rive de la baie. Toute la scène est faite \
de petites touches de couleur pure, rouges, orangées, bleues et vertes, qui scintillent \
comme une mosaïque."""
evocation = """
Le titre reprend le refrain de « L'Invitation au voyage » de Baudelaire, qui rêve d'un \
pays où « tout n'est qu'ordre et beauté, luxe, calme et volupté ». Matisse transpose ce \
rêve dans une scène moderne : un goûter en famille côtoie des nymphes nues, comme si la \
vie quotidienne s'ouvrait sur un âge d'or. On y a vu une réponse aux grandes pastorales \
de Puvis de Chavannes et aux baigneuses de Cézanne, que Matisse admirait. La femme \
habillée, que l'on identifie d'ordinaire à Amélie, l'épouse du peintre, relie le mythe \
à sa propre vie. Ce paradis paisible annonce un thème qui ne quittera plus Matisse : le \
bonheur de vivre, la joie de la lumière et des corps au repos, qu'il développera dès \
l'année suivante dans Le Bonheur de vivre."""
histoire = """
Au cours de l'été 1904, Matisse séjourne à Saint-Tropez, où Paul Signac, chef de file \
du néo-impressionnisme, possède une maison, La Hune. Au contact de Signac et \
d'Henri-Edmond Cross, il s'essaie à la touche divisée. De retour à Paris, il compose à \
l'atelier, d'après une esquisse peinte sur place, ce grand tableau qu'il expose au \
Salon des Indépendants au printemps 1905. Signac l'achète et l'accroche chez lui à \
Saint-Tropez. La toile, qui fit forte impression sur de jeunes peintres comme Raoul \
Dufy, reste longtemps dans la famille de Signac avant d'entrer dans les collections \
nationales au début des années 1980. Propriété du Centre Pompidou, elle est exposée au \
musée d'Orsay, où elle marque la charnière entre le néo-impressionnisme et le fauvisme."""
facture = """
Matisse adopte la méthode de Seurat et de Signac : la couleur est posée en touches \
séparées, sans mélange sur la palette, pour que l'œil recompose les tons. Mais il en \
fait un usage très libre. Ses touches sont plus larges, presque des tesselles de \
mosaïque, et ses couleurs plus violentes que celles de ses aînés : orangés, roses et \
bleus vifs. Surtout, il cerne les corps d'un trait bleu ou rouge continu, qui contredit \
le principe même de la division. Ce conflit entre la ligne et la couleur le conduira \
l'été suivant, à Collioure, à abandonner la touche divisée pour les aplats éclatants du \
fauvisme."""
details = [
  "À gauche, la femme en robe sombre et chapeau, seule figure habillée de la scène.",
  "Sur la nappe blanche, les tasses et la petite théière du goûter.",
  "La grande diagonale du mât de la barque, au centre du tableau.",
  "Les contours bleus et rouges qui cernent le corps des baigneuses.",
  "La signature, en bas à droite, presque noyée dans les touches.",
]
themes = ["baigneuses", "mer", "âge d'or", "néo-impressionnisme", "poésie"]
anecdote = """
En 1899, presque sans le sou, Matisse avait acheté au marchand Vollard un petit tableau \
de Cézanne, Trois Baigneuses. Il le garda trente-sept ans avant de l'offrir en 1936 à \
la Ville de Paris, en expliquant qu'il l'avait soutenu moralement dans les moments \
critiques de sa vie d'artiste."""
salle = 2
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "La Femme au chapeau"
artiste = "Henri Matisse"
annee = "1905"
image = "femme-au-chapeau.jpg"
technique = "Huile sur toile, 80,7 × 59,7 cm"
collection = "San Francisco Museum of Modern Art"
note = "Le portrait d'Amélie Matisse qui fit scandale au Salon d'Automne de 1905, celui où naquit le mot « fauves »."
description = """
Une femme est vue à mi-corps, le buste tourné vers la gauche et le visage vers nous. \
Elle tient un éventail devant elle et porte un énorme chapeau chargé de fleurs, de \
plumes et de rubans, peint en bleus, violets, verts et touches orangées. Son visage \
étroit est zébré de vert sur le front et l'arête du nez, de jaune et de rose sur les \
joues ; ses sourcils noirs et ses lèvres rouges ressortent avec force. Sa chevelure est \
d'un roux orangé. Le fond ne figure aucune pièce reconnaissable : ce sont des plages \
libres de vert, de rose, de mauve et de jaune, posées à larges coups de pinceau, avec \
des parties où la toile reste à nu. En haut à gauche, la signature Henri-Matisse est \
écrite en lettres vertes."""
evocation = """
Le modèle est Amélie Matisse, l'épouse du peintre, et pourtant le tableau dit moins une \
ressemblance qu'une sensation. Matisse ne cherche pas à reproduire la couleur réelle de \
la peau ou de la robe : il choisit chaque teinte pour sa force et pour son accord avec \
les autres. Le vert sur le visage, qui choqua tant, n'est pas une provocation gratuite \
mais une façon de construire le volume et la lumière par la seule couleur. Pour le \
public de 1905, habitué aux portraits mondains soignés, ce visage barbouillé \
ressemblait à une caricature, voire à une insulte. Les historiens y voient au contraire \
l'acte de naissance d'une peinture où la couleur devient autonome. Le chapeau \
extravagant, à la mode du temps, devient lui-même un bouquet de couleurs pures."""
histoire = """
Le portrait est peint à Paris à l'automne 1905, au retour de l'été passé à Collioure. \
Matisse l'envoie au Salon d'Automne, où il est accroché dans la salle VII avec les \
toiles de Derain, Manguin, Camoin, Marquet et de leurs amis. Le public s'esclaffe, et \
le critique Louis Vauxcelles, apercevant au milieu de ces couleurs violentes des bustes \
de facture classique, écrit dans le journal Gil Blas : « Donatello parmi les fauves ! » \
Le mot restera. Le tableau trouve pourtant acheteur : Leo et Gertrude Stein, deux \
jeunes Américains installés à Paris, l'accrochent dans leur appartement de la rue de \
Fleurus, où défile l'avant-garde. Il passe ensuite à Michael et Sarah Stein, qui \
l'emportent en Californie, puis est légué au musée de San Francisco par la \
collectionneuse Elise S. Haas."""
facture = """
Matisse pose la couleur par larges coups de brosse, rapides et visibles, parfois \
juxtaposés sans se toucher, en laissant respirer la toile nue entre eux. Il n'y a ni \
modelé traditionnel ni ombre portée : le volume naît du contraste entre tons chauds et \
froids, le vert de l'arête du nez s'opposant au rose et au jaune des joues. Le dessin, \
réduit à quelques traits sombres pour les sourcils, les yeux et le contour de l'épaule, \
reste libre. La touche dérive encore des expériences néo-impressionnistes de l'année \
précédente, mais éclatée, élargie, presque sauvage. Le fond, traité avec la même \
énergie que la figure, refuse toute profondeur."""
details = [
  "La bande verte qui descend du front sur l'arête du nez.",
  "Les sourcils noirs, tracés d'un seul geste au-dessus des yeux sombres.",
  "L'éventail, simple éclat de blanc, de rose et de vert au premier plan.",
  "Les zones où la toile reste nue, notamment dans le fond.",
  "La signature Henri-Matisse, en vert, dans le coin supérieur gauche.",
]
themes = ["portrait", "couleur pure", "scandale", "mode", "fauvisme"]
anecdote = """
Selon un souvenir souvent rapporté, quelqu'un demanda un jour à Matisse de quelle \
couleur était vraiment la robe que portait sa femme pendant les séances de pose. Il \
aurait répondu : « Noire, bien sûr. »"""
salle = 2
mur = "sud"
place = 1
largeur = 0.8

[[oeuvres]]
titre = "La Desserte rouge (Harmonie en rouge)"
artiste = "Henri Matisse"
annee = "1908"
image = "desserte-rouge.jpg"
technique = "Huile sur toile, 180 × 220 cm"
collection = "Musée de l'Ermitage, Saint-Pétersbourg"
note = "Commandée par le collectionneur moscovite Sergueï Chtchoukine, la toile fut peinte d'abord en bleu, puis entièrement repeinte en rouge."
description = """
Une servante, en corsage bleu nuit et tablier blanc, dispose des fruits dans un \
compotier sur une table dressée. La nappe rouge et le mur rouge se confondent en un \
seul plan, couverts du même motif : de grandes arabesques bleues et des corbeilles de \
fleurs. Sur la table, deux carafes, l'une de vin rouge, l'autre d'une liqueur dorée, un \
compotier sur pied, un vase de fleurs, des citrons et des oranges éparpillés. À gauche, \
une chaise au dossier à barreaux et au siège de paille jaune. En haut à gauche, une \
fenêtre ouvre sur un jardin vert où fleurissent des arbres blancs, sous un ciel bleu, \
avec le toit d'une petite maison rose. La signature et la date, en bas à gauche, sont \
discrètement inscrites."""
evocation = """
Le sujet est presque banal, une servante qui prépare le dessert, mais Matisse en fait \
une démonstration : la couleur peut organiser à elle seule tout un tableau. Le rouge \
saturé abolit la distinction entre le mur et la table, entre le haut et le bas, et \
transforme la pièce en surface décorative. Les arabesques bleues semblent s'échapper de \
la nappe pour grimper au mur, comme des plantes vivantes. La fenêtre fait contrepoint : \
un jardin printanier, frais et vert, oppose la nature au décor. La même année, dans ses \
« Notes d'un peintre », Matisse dit rêver d'un art d'équilibre et de sérénité, reposant \
pour l'esprit. On y a vu l'un des premiers grands accomplissements de cet idéal, et le \
point de départ des intérieurs décoratifs qui jalonnent toute sa carrière."""
histoire = """
Le tableau est une commande de Sergueï Chtchoukine, riche marchand de textiles de \
Moscou et l'un des premiers grands collectionneurs de Matisse, qui le destinait à la \
salle à manger de son hôtel particulier. Matisse le peint en 1908 dans une harmonie \
bleu-vert, puis le repeint entièrement en rouge ; le collectionneur accepte ce \
changement et reçoit la toile à Moscou. Elle reprend un sujet que Matisse avait traité \
en 1897 dans La Desserte, tableau encore marqué par l'impressionnisme. Après la \
révolution de 1917, la collection Chtchoukine est nationalisée et devient un musée \
d'art occidental moderne. Quand celui-ci est dissous en 1948, ses œuvres sont partagées \
entre le musée Pouchkine de Moscou et l'Ermitage de Saint-Pétersbourg, où la Desserte \
rouge se trouve depuis."""
facture = """
Matisse supprime presque toute profondeur : ni perspective ni ombre, le plan rouge \
court du bas au haut de la toile. L'espace n'est suggéré que par quelques indices, la \
chaise, le bord de la table, la fenêtre. Le motif bleu, agrandi et simplifié, vient \
d'un tissu imprimé que le peintre possédait. Les couleurs sont posées en aplats francs, \
cernés de traits sombres, à la manière des tissus et des céramiques décoratives qu'il \
aimait. Le rouge, le bleu et le vert, presque purs, s'équilibrent par leurs surfaces, \
et la ligne souple des arabesques répond à la courbe du dos de la servante."""
details = [
  "Le motif de la nappe, qui continue sans rupture sur le mur.",
  "Les deux carafes de verre, l'une rouge, l'autre d'un jaune doré.",
  "La servante penchée, dont le chignon reprend les courbes des arabesques.",
  "Les arbres en fleurs blancs du jardin, derrière la fenêtre.",
  "La signature et la date 1908, en bas à gauche.",
]
themes = ["intérieur", "décor", "rouge", "nature morte", "collectionneur"]
anecdote = """
Le tissu imprimé de motifs bleus, une toile de Jouy, Matisse l'aurait aperçu, \
raconte-t-on, depuis l'impériale d'un omnibus, dans une boutique parisienne. Il le \
garda toute sa vie et le fit figurer dans plusieurs autres tableaux."""
salle = 2
mur = "ouest"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "Montagnes à Collioure"
artiste = "André Derain"
annee = "1905"
image = "montagnes-collioure.jpg"
technique = "Huile sur toile, 81,3 × 100,3 cm"
collection = "National Gallery of Art, Washington"
note = "L'été 1905, Derain peint aux côtés de Matisse à Collioure : des arbres aux troncs rouges, des feuillages bleus, des montagnes orange."
description = """
Au premier plan, un champ d'herbe jaune-vert est traversé d'un sentier violet. Au \
milieu, un bosquet de petits arbres méditerranéens dresse des troncs tortueux d'un \
rouge vif et des feuillages bleus et verts, posés en courtes touches disposées en \
éventail. Derrière, les collines s'étagent en grandes bandes orange, jaunes et rouges, \
et les montagnes du fond, bleu outremer et violettes, découpent leurs crêtes sur un \
ciel vert d'eau traversé de nuées claires. Aucun personnage, aucune maison : seulement \
la végétation et le relief, sous une lumière qui semble venir de partout à la fois et \
ne projette aucune ombre. La signature de Derain apparaît en bas à gauche, à demi \
perdue dans l'herbe."""
evocation = """
Pour Derain, la couleur ne copie pas la nature : elle traduit la sensation de la \
lumière du Midi, si intense qu'elle semble dévorer les ombres. Dans une lettre à son \
ami Vlaminck, il évoque cette lumière blonde et dorée qui supprime les ombres, et son \
désir de la rendre par la couleur pure. Le tableau en est la mise en œuvre : les troncs \
rouges, les feuillages bleus et les montagnes orange n'existent pas tels quels, mais \
ensemble ils rendent l'éblouissement d'un après-midi d'été. On y lit aussi la \
jubilation d'une découverte partagée : pendant ces semaines à Collioure, Derain et \
Matisse s'entraînent l'un l'autre vers une audace que ni l'un ni l'autre n'aurait \
peut-être osée seul. L'œuvre résume l'été où naquit le fauvisme."""
histoire = """
En mai 1905, Matisse s'installe à Collioure, petit port catalan des \
Pyrénées-Orientales, et invite Derain à le rejoindre. Celui-ci arrive au début de \
l'été, et les deux amis peignent côte à côte le port, les barques, les toits et les \
collines plantées de vignes et d'oliviers. Derain, alors âgé de vingt-cinq ans, \
rapporte à Paris de nombreuses toiles, dessins et esquisses. Plusieurs paysages de \
Collioure figurent au Salon d'Automne de 1905, dans la salle VII qui vaut à ses \
occupants le surnom de « fauves ». Le marchand Ambroise Vollard, qui soutient alors le \
jeune peintre, l'enverra peu après peindre Londres. Le tableau a appartenu au \
collectionneur américain John Hay Whitney, avant d'entrer en 1982 à la National Gallery \
of Art de Washington avec la collection Whitney."""
facture = """
Derain mêle deux manières. Dans les feuillages et l'herbe, il garde de la leçon \
néo-impressionniste la touche séparée, mais l'allonge en virgules et en hachures \
nerveuses qui rappellent Van Gogh, dont il avait vu la rétrospective à Paris en 1901. \
Dans les montagnes et le ciel, au contraire, il étale la couleur en larges aplats \
sinueux, cernés de bleu. Les complémentaires se heurtent sans transition : rouge contre \
vert, orange contre bleu. Par endroits, la toile laissée nue entre les touches ajoute \
sa lumière blanche à l'ensemble. Le résultat tient à la fois de la tapisserie et du \
vitrail."""
details = [
  "Les troncs rouges et sinueux des arbres, qui se tordent comme des flammes.",
  "Les feuillages bleus, faits de petites touches disposées en éventail.",
  "Le sentier violet qui traverse l'herbe au premier plan.",
  "Les collines orange et rouges, cernées d'un trait bleu.",
  "La signature de Derain, en bas à gauche.",
]
themes = ["paysage", "méditerranée", "lumière", "fauvisme", "collioure"]
anecdote = """
À Collioure, un « chemin du fauvisme » balisé à travers la ville présente des \
reproductions des tableaux de Matisse et de Derain aux endroits mêmes où ils ont posé \
leur chevalet en 1905. On peut ainsi comparer leurs couleurs au paysage réel."""
salle = 2
mur = "sud"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Cheval bleu I"
artiste = "Franz Marc"
annee = "1911"
image = "cheval-bleu.jpg"
technique = "Huile sur toile, 112 × 84,5 cm"
collection = "Städtische Galerie im Lenbachhaus, Munich"
note = "Un jeune cheval bleu, tête penchée, devant des collines rouges et jaunes : l'image même du Cavalier bleu."
description = """
Un jeune cheval bleu se tient debout, presque de face, et occupe toute la hauteur de la \
toile. Sa tête, inclinée vers le sol et tournée vers la gauche, est encadrée par une \
crinière bleu nuit ; ses longues pattes fines et un peu raides sont celles d'un \
poulain. Son corps passe du bleu le plus clair, presque blanc sur le poitrail et \
l'encolure, au bleu profond des flancs et des sabots. Autour de lui, le paysage est \
fait de grandes collines arrondies : rose et violette à droite, jaune au centre, bleue \
en haut, sous un ciel rose. Au premier plan, le sol est rouge et vert, et une plante \
aux larges feuilles vertes se dresse à droite, comme pour répondre à la courbe de \
l'animal."""
evocation = """
Pour Franz Marc, l'animal est plus pur que l'homme et plus proche de l'harmonie du \
monde : peindre un cheval, c'est tenter de voir la nature à travers ses yeux. Dans une \
lettre à August Macke de décembre 1910, il expose sa symbolique des couleurs : le bleu \
est le principe masculin, austère et spirituel, le jaune le principe féminin, doux et \
sensuel, et le rouge la matière, brutale et lourde, que les deux autres doivent \
combattre. Le cheval bleu, au milieu des collines jaunes et rouges, devient ainsi \
l'image d'une âme jeune et méditative dans un monde chargé de matière. On y a vu une \
sorte d'autoportrait spirituel du peintre, et un manifeste du Cavalier bleu, le groupe \
qu'il fonde la même année avec Kandinsky."""
histoire = """
Marc peint ce tableau en 1911 à Sindelsdorf, village de Haute-Bavière où il s'est \
installé avec Maria Franck au pied des Préalpes, et où il observe longuement les \
chevaux dans les prés. Cette même année, avec Vassily Kandinsky, il fonde le Cavalier \
bleu, Der Blaue Reiter, dont la première exposition s'ouvre à Munich en décembre 1911, \
et prépare l'almanach qui paraît au printemps 1912. Le tableau entre dans la collection \
de Bernhard Koehler, industriel berlinois et mécène de Marc et de Macke. En 1965, la \
fondation Bernhard Koehler l'offre à la Lenbachhaus, qui avait reçu en 1957 la donation \
de Gabriele Münter, peintre et compagne de Kandinsky. C'est ainsi que Munich est \
devenue la grande maison du Cavalier bleu."""
facture = """
Marc a longtemps étudié et enseigné l'anatomie des animaux, mais ici il simplifie la \
forme en grandes courbes. Le corps du cheval est modelé par des dégradés de bleu, du \
blanc au bleu sombre, alors que le paysage est traité en aplats presque purs. Les \
collines reprennent le dessin arrondi de l'encolure et du dos, si bien que l'animal et \
le paysage forment une seule composition rythmée. Le point de vue, bas et rapproché, \
rend le jeune cheval monumental. La couleur, libérée de toute vraisemblance, doit \
beaucoup à Gauguin et au fauvisme, mais elle est ici chargée d'un sens symbolique."""
details = [
  "La tête penchée et le regard baissé, comme perdu dans ses pensées.",
  "Le poitrail presque blanc, qui accroche la lumière.",
  "Les longues pattes fines du poulain, un peu gauches.",
  "La plante verte à droite, dont les feuilles répondent à la courbe du cheval.",
  "Les collines jaunes, roses et violettes qui ondulent derrière lui.",
]
themes = ["animal", "cheval", "spiritualité", "couleur symbolique", "cavalier bleu"]
anecdote = """
Le plus célèbre tableau de chevaux de Marc, La Tour des chevaux bleus (1913), fut \
confisqué par les nazis en 1937 à la Nationalgalerie de Berlin comme « art dégénéré ». \
Sa trace se perd à la fin de la Seconde Guerre mondiale : on le recherche toujours."""
salle = 3
mur = "nord"
place = 2
largeur = 0.85

[[oeuvres]]
titre = "Promenade"
artiste = "August Macke"
annee = "1913"
image = "promenade.jpg"
technique = "Huile sur carton, 51 × 57 cm"
collection = "Städtische Galerie im Lenbachhaus, Munich"
note = "Des promeneurs sans visage sous les arbres d'un parc : le monde paisible et lumineux d'August Macke, un an avant sa mort."
description = """
Sous de grands arbres aux troncs violets et bleus, un couple se promène dans un parc. \
L'homme, de profil, porte un canotier et un costume sombre ; la femme, de dos, vêtue \
d'une longue robe bleue et rouge et coiffée d'un chapeau rouge, tient une ombrelle \
blanche. Plus loin, deux silhouettes accoudées à un muret regardent au loin. À droite, \
une femme coiffée de blanc, au visage à peine indiqué, est coupée par le bord du \
tableau. Le feuillage forme au-dessus d'eux une voûte de verts lumineux, et le sol \
jaune et rose semble baigné de soleil. Personne ne nous regarde : chacun est absorbé \
dans sa marche ou sa contemplation, et la scène respire le calme d'un après-midi d'été."""
evocation = """
Macke peint un monde sans drame : des promeneurs du dimanche, des femmes à ombrelle, \
des enfants devant les vitrines ou au bord des lacs. Là où Kirchner voit dans la ville \
un lieu d'angoisse, lui voit un lieu d'harmonie, où l'homme vit en accord avec la \
nature. Les figures sans visage ne sont pas inquiétantes : elles deviennent des types \
universels, des formes colorées parmi les arbres, et chacun peut s'y reconnaître. On y \
a vu une vision presque idyllique de la vie bourgeoise d'avant 1914, comme un paradis \
profane. Ce bonheur tranquille prend après coup une valeur poignante : un an plus tard, \
la guerre éclate et Macke est tué dès les premières semaines, à vingt-sept ans."""
histoire = """
En 1913, Macke est au sommet de son art. Lié depuis 1910 à Franz Marc, il a pris part à \
l'aventure du Cavalier bleu et à son almanach, avant de prendre ses distances avec le \
mysticisme de Kandinsky. À Paris, en 1912, il a rencontré Robert Delaunay, dont les \
recherches sur la couleur l'ont profondément marqué. À l'automne 1913, il s'installe \
avec sa famille à Hilterfingen, au bord du lac de Thoune, en Suisse, où il peint de \
nombreuses scènes de promeneurs, de lacs et de vitrines. Comme le Cheval bleu de Marc, \
ce tableau a appartenu à Bernhard Koehler, oncle de l'épouse du peintre et mécène du \
groupe ; il est entré à la Lenbachhaus en 1965 avec la donation de sa fondation."""
facture = """
Macke simplifie les formes en grands plans colorés, cernés de contours souples. Les \
visages sont supprimés ou réduits à une tache, les corps à des silhouettes. Il emprunte \
au cubisme la géométrie des formes et à Delaunay l'idée que la couleur, par ses \
contrastes, crée à elle seule la lumière et le mouvement : le rouge de la robe vibre \
contre le vert du feuillage, le bleu contre le jaune du sol. La touche reste visible et \
rapide, mais la composition est rigoureusement construite, les troncs encadrant la \
scène comme des coulisses de théâtre. Sur le carton, la peinture s'est craquelée par \
endroits."""
details = [
  "L'ombrelle blanche de la femme, tache la plus claire du tableau.",
  "Le canotier de l'homme, cerclé d'un ruban noir.",
  "Les deux silhouettes accoudées au muret, au centre droit.",
  "Les troncs violets et bleus qui encadrent la scène comme un rideau.",
  "Les fines craquelures de la peinture, visibles sur le carton.",
]
themes = ["promenade", "parc", "loisirs", "harmonie", "cavalier bleu"]
anecdote = """
Apprenant la mort de son ami, Franz Marc écrivit un hommage où il affirmait que, privée \
des harmonies de Macke, la couleur de l'art allemand allait pâlir de plusieurs tons. \
Marc lui-même fut tué dix-huit mois plus tard, devant Verdun."""
salle = 3
mur = "ouest"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Potsdamer Platz"
artiste = "Ernst Ludwig Kirchner"
annee = "1914"
image = "potsdamer-platz.jpg"
technique = "Huile sur toile, 200 × 150 cm"
collection = "Neue Nationalgalerie, Berlin"
note = "Deux prostituées sur un îlot de la place la plus animée de Berlin, à la veille de la Grande Guerre."
description = """
Au premier plan, deux femmes élégantes se tiennent sur un îlot circulaire, au milieu de \
la chaussée verte de la place. Celle de droite, en manteau bleu à col blanc, porte un \
chapeau à plumes et regarde droit devant elle, le visage verdâtre et les lèvres rouges. \
Celle de gauche, de profil, est enveloppée de noir et voilée d'une voilette. Derrière \
elles, la place s'ouvre en perspective plongeante : des passants en noir, silhouettes \
anguleuses, traversent la chaussée ou longent les trottoirs. Au fond, à gauche, se \
dressent un bâtiment à coupole et la façade rose à arcades de la gare de Potsdam ; à \
droite, une rangée de maisons blanches. Les deux femmes semblent isolées sur leur \
socle, tandis que les hommes tournent autour d'elles."""
evocation = """
Les deux femmes sont des prostituées, figures que Kirchner peint sans relâche dans ses \
scènes de rue berlinoises : objets de désir et de transaction, elles incarnent pour lui \
la ville moderne, fascinante et inquiétante. Isolées sur leur îlot comme sur une scène \
ou un piédestal, elles s'offrent aux regards des hommes en noir qui les frôlent. La \
perspective basculée, les corps étirés et les couleurs acides traduisent la nervosité, \
l'anonymat et la vitesse de la métropole. On a vu dans la voilette noire de la femme de \
gauche un déguisement de veuve, dont usaient certaines prostituées pour échapper à la \
police, et qui prend une résonance sinistre en 1914, l'année où éclate la guerre. Le \
tableau dit l'angoisse d'un monde au bord de l'effondrement."""
histoire = """
Kirchner quitte Dresde pour Berlin à l'automne 1911. Le groupe Die Brücke, qu'il avait \
fondé en 1905 avec Erich Heckel, Karl Schmidt-Rottluff et Fritz Bleyl, se dissout en \
1913. Livré à lui-même, il entreprend une série d'une dizaine de grandes scènes de rue, \
peintes entre 1913 et 1915, dont Potsdamer Platz est l'une des plus ambitieuses. La \
place, carrefour de lignes de tramway et de gares, est alors l'un des lieux les plus \
animés d'Europe. Mobilisé en 1915, Kirchner s'effondre physiquement et moralement, et \
part se soigner en Suisse, où il passera le reste de sa vie. Déclaré « dégénéré » par \
les nazis, il se donne la mort en 1938. Le tableau est aujourd'hui à la Neue \
Nationalgalerie, à quelques centaines de mètres de la place qu'il représente."""
facture = """
Kirchner peint vite, en longs traits hachés et anguleux qui donnent aux formes une \
énergie nerveuse. Les figures s'allongent, les visages deviennent des masques. La \
perspective est volontairement faussée : la place bascule vers le spectateur, tandis \
que l'îlot circulaire, vu d'en haut, contredit la vue de face des deux femmes. La \
palette est dominée par des verts et des bleus froids, rehaussés du rose de la gare et \
du blanc des cols. On y reconnaît l'influence de la gravure sur bois, que Kirchner \
pratiquait intensément, avec ses contours tranchants, et celle des sculptures \
africaines et océaniennes qu'il avait étudiées au musée d'ethnographie de Dresde."""
details = [
  "Les visages verdâtres et les lèvres rouges des deux femmes, comme des masques.",
  "La voilette noire qui couvre le visage de la femme de gauche.",
  "L'îlot circulaire, vu d'en haut, sur lequel elles se tiennent.",
  "Les silhouettes noires des passants, étirées comme des ombres.",
  "Au fond, la façade rose à arcades de la gare de Potsdam.",
]
themes = ["ville", "prostitution", "modernité", "berlin", "angoisse"]
anecdote = """
La circulation de la Potsdamer Platz était telle qu'on y installa en 1924 l'un des \
premiers feux de signalisation d'Europe, une tour surmontée d'une horloge. Une réplique \
de cette tour se dresse aujourd'hui sur la place reconstruite."""
salle = 4
mur = "nord"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Autoportrait au sixième anniversaire de mariage"
artiste = "Paula Modersohn-Becker"
annee = "1906"
image = "sixieme-anniversaire.jpg"
technique = "Huile sur carton, 101,8 × 70,2 cm"
collection = "Paula Modersohn-Becker Museum, Brême"
note = "Paula se peint nue jusqu'aux hanches, les mains sur un ventre arrondi : un geste d'une audace inouïe pour une femme peintre en 1906."
description = """
La jeune femme se tient debout, de trois quarts, nue jusqu'aux hanches, un drap blanc \
noué à la taille. Elle porte un long collier d'ambre aux grosses perles ovales. Ses \
mains entourent son ventre arrondi, comme pour le soutenir ou le protéger. Elle tourne \
la tête vers nous, le regard direct mais doux, un léger sourire aux lèvres ; ses \
cheveux châtain roux, séparés par une raie au milieu, sont tirés en arrière. Le fond, \
d'un vert pâle, est semé de petites taches vertes et jaunes, comme un papier peint \
fleuri. En bas à droite, une inscription en allemand, signée de ses initiales, indique \
qu'elle a peint ce tableau à trente ans, le jour de son sixième anniversaire de \
mariage."""
evocation = """
Ce tableau est souvent considéré comme le premier autoportrait nu peint par une femme \
dans l'histoire de l'art occidental. Paula ne s'y montre ni en muse ni en objet de \
désir, mais en sujet : elle se regarde et nous regarde, sereine et sûre d'elle. Le \
ventre arrondi a beaucoup intrigué, car elle n'était pas enceinte à ce moment-là. On y \
a vu l'expression d'un désir d'enfant, ou bien une métaphore de la création : en \
quittant son mari pour Paris, elle se sentait enfin devenir elle-même et porter son \
œuvre. Le tableau unit ainsi l'intime et l'affirmation de soi, la fécondité et la \
liberté. Il devance de plusieurs décennies les questions que l'art féministe posera sur \
le corps des femmes et le regard porté sur elles."""
histoire = """
En février 1906, après cinq ans de mariage avec le peintre Otto Modersohn, Paula quitte \
Worpswede, la colonie d'artistes proche de Brême où vit le couple, pour s'installer \
seule à Paris. Elle veut travailler, étudier les maîtres modernes et vivre de sa \
peinture. C'est là, au printemps 1906, qu'elle peint cet autoportrait. L'inscription \
parle d'un sixième anniversaire, alors que le couple s'était marié en mai 1901, ce qui \
a fait couler beaucoup d'encre. Otto la rejoint à Paris à l'automne, et elle accepte de \
rentrer avec lui à Worpswede au printemps 1907. Le tableau est aujourd'hui conservé à \
Brême, au Paula Modersohn-Becker Museum, ouvert en 1927 dans la Böttcherstraße à \
l'initiative du négociant en café Ludwig Roselius, et considéré comme le premier musée \
au monde consacré à une femme peintre."""
facture = """
Paula simplifie les formes en grands volumes calmes, à la manière de Gauguin et de \
Cézanne, qu'elle avait étudiés à Paris. Le corps est modelé par des tons chauds et \
mats, rose ocré et jaune pâle, sans brillant ni détail anecdotique. La matière, posée \
sur le carton en couches sèches et grenues, évoque la fresque ou la détrempe. Les \
contours sont cernés d'un trait sombre. Le fond décoratif, traité en taches régulières, \
aplatit l'espace et fait ressortir la figure comme une icône. On pense aussi aux \
portraits funéraires du Fayoum, peints sur bois dans l'Égypte romaine, qu'elle avait \
admirés au Louvre."""
details = [
  "Le long collier d'ambre aux grosses perles, sa seule parure.",
  "Les deux mains posées sur le ventre arrondi.",
  "Le drap blanc noué aux hanches, peint en larges coups de pinceau.",
  "Le fond vert pâle semé de petites taches, comme un papier peint.",
  "L'inscription manuscrite en allemand, en bas à droite, signée P. B.",
]
themes = ["autoportrait", "nu", "maternité", "femme artiste", "liberté"]
anecdote = """
Le poète Rainer Maria Rilke, son ami depuis Worpswede, lui consacra en 1908, un an \
après sa mort, l'un de ses plus beaux poèmes, Requiem pour une amie."""
salle = 4
mur = "sud"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Autoportrait aux physalis"
artiste = "Egon Schiele"
annee = "1912"
image = "autoportrait-physalis.jpg"
technique = "Huile et gouache sur bois, 32,2 × 39,8 cm"
collection = "Leopold Museum, Vienne"
note = "Schiele à vingt-deux ans, le visage tourmenté et le regard en coin, à côté d'une branche de physalis aux lanternes rouges."
description = """
Le jeune peintre se montre en buste, vêtu d'un gilet noir boutonné jusqu'au cou, le \
corps tourné vers la droite et la tête légèrement rejetée en arrière. Il nous regarde \
de biais, les sourcils levés, avec une expression à la fois hautaine, inquiète et \
provocante. Ses cheveux sombres se dressent en mèches hirsutes. Son visage, peint en \
tons de chair, de gris, de bleu et de rouge, semble meurtri. À gauche, une branche de \
physalis, plante aux fruits enveloppés d'une lanterne rouge vif, déploie ses tiges \
fines et ses feuilles fanées sur un fond blanc. Une forme grise, comme une ombre, \
s'étend derrière la tête. En bas à droite, la signature et la date sont inscrites en \
capitales dans un bloc carré."""
evocation = """
Schiele a peint et dessiné plus d'une centaine d'autoportraits, où il se met en scène \
sans complaisance, maigre, crispé, parfois nu. Celui-ci est l'un des plus célèbres. Le \
regard en coin, à la fois méfiant et défiant, semble jauger le spectateur. On y a vu \
l'image de l'artiste comme un être à part, incompris de la société, fragile et \
orgueilleux à la fois. Les physalis, fruits d'automne aux enveloppes rouges, \
introduisent une note de couleur vive, que certains interprètent comme une allusion au \
passage du temps. Peint en pendant d'un portrait de sa compagne Wally Neuzil, de même \
format, le tableau forme avec lui un couple qui reste l'une des images les plus fortes \
de la Vienne de 1912, inquiète et sensuelle."""
histoire = """
En 1912, Schiele a vingt-deux ans. Il a quitté l'Académie des beaux-arts de Vienne dès \
1909 et s'est affranchi de l'influence de Klimt, qui le soutient pourtant. Cette année \
est aussi celle d'une épreuve : installé à Neulengbach, à l'ouest de Vienne, avec Wally \
Neuzil, il est arrêté au printemps, accusé d'avoir détourné une mineure ; l'accusation \
tombe, mais il est condamné pour avoir laissé des dessins érotiques à la vue d'enfants \
et passe vingt-quatre jours en prison. Le tableau a appartenu plus tard au \
collectionneur viennois Rudolf Leopold, ophtalmologue, qui rassembla à partir des \
années 1950 la plus grande collection d'œuvres de Schiele au monde. Il est aujourd'hui \
l'une des pièces maîtresses du Leopold Museum, ouvert en 2001."""
facture = """
Schiele travaille sur un petit panneau de bois, à la surface lisse, où chaque coup de \
pinceau reste visible. Le visage est construit par des touches nerveuses de couleurs \
inattendues, bleus, rouges, violets, qui lui donnent l'aspect d'une chair à vif. Le \
dessin, son domaine de prédilection, reste prépondérant : contours anguleux, lignes \
tendues de la nuque et des épaules. Le fond blanc, travaillé en larges coups de brosse, \
isole la figure comme sur une feuille de papier. La composition est décentrée : le \
corps est repoussé vers la droite et coupé par le bord, laissant la branche occuper la \
moitié gauche, un cadrage qui rappelle les estampes japonaises."""
details = [
  "Les yeux tournés de côté, sous des sourcils levés.",
  "Les touches bleues et rouges qui marbrent le visage.",
  "Les petites lanternes rouges des physalis, en haut et en bas à gauche.",
  "La forme grise qui flotte derrière la tête, comme une ombre.",
  "La signature EGON SCHIELE 1912, inscrite en carré en bas à droite.",
]
themes = ["autoportrait", "identité", "vienne", "angoisse", "physalis"]
anecdote = """
Son pendant, le Portrait de Wally Neuzil, fut saisi à New York en 1998, à la fin d'un \
prêt au MoMA, à la demande des héritiers d'une marchande d'art spoliée sous le nazisme. \
Après douze ans de procédure, un accord permit son retour à Vienne en 2010."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Jeanne Hébuterne"
artiste = "Amedeo Modigliani"
annee = "1919"
image = "jeanne-hebuterne.jpg"
technique = "Huile sur toile, 91,4 × 73 cm"
collection = "Metropolitan Museum of Art, New York"
note = "La compagne de Modigliani, assise, la joue appuyée sur la main : l'un des derniers portraits qu'il fit d'elle."
description = """
Une jeune femme aux longs cheveux auburn est assise de trois quarts, le coude appuyé \
sur le dossier d'un fauteuil ocre, la tête légèrement penchée contre sa main repliée. \
Elle porte une ample chemise blanche à fines bretelles, qui découvre ses épaules et ses \
bras. Son cou est très long, son visage ovale, son nez droit et étiré, sa bouche petite \
et rouge. Ses yeux en amande, bleu pâle, n'ont pas de pupilles. Son autre bras descend \
le long du corps jusqu'au bas du tableau. Le fond est fait de deux plans de couleur, \
l'un brun-vert à gauche, l'autre bleu-gris à droite, posés en touches libres. En haut à \
droite, le peintre a signé modigliani, en minuscules."""
evocation = """
Modigliani a peint Jeanne Hébuterne plus d'une vingtaine de fois, et aucun de ces \
portraits ne cherche la ressemblance photographique. L'étirement du cou et du visage, \
les yeux vides, la pose songeuse en font une figure presque intemporelle, entre l'icône \
et la madone de la Renaissance, que le peintre, né à Livourne, connaissait depuis \
l'enfance. Les yeux sans pupilles, fréquents chez lui, donnent au modèle un air de \
rêverie intérieure, comme si elle regardait en elle-même. On a souvent rapproché la \
douceur mélancolique de ce portrait du destin tragique du couple : en 1919, Jeanne \
attend leur second enfant, et ni l'un ni l'autre ne vivra au-delà de janvier 1920. Le \
tableau dit la tendresse, mais aussi une forme de retrait."""
histoire = """
Jeanne Hébuterne, élève de l'académie Colarossi, rencontre Modigliani en 1917 ; elle \
n'a pas vingt ans, lui en a trente-deux. Malgré l'opposition de sa famille, catholique \
et bourgeoise, elle s'installe avec lui. En 1918, le couple part pour Nice, où naît en \
novembre leur fille, prénommée Jeanne elle aussi. Revenus à Paris en 1919, ils vivent \
rue de la Grande-Chaumière, à Montparnasse. Rongé par la tuberculose, Modigliani meurt \
le 24 janvier 1920 à l'hôpital de la Charité. Le lendemain, Jeanne, enceinte de huit \
mois, se jette par la fenêtre de l'appartement de ses parents. Le tableau a appartenu \
aux collectionneurs new-yorkais Nate B. Spingold et son épouse, qui l'offrirent au \
Metropolitan Museum en 1956."""
facture = """
Modigliani simplifie les formes selon un canon très personnel : ovale du visage, cou en \
colonne, épaules tombantes, mains effilées. Ce vocabulaire vient de sa pratique de la \
sculpture, entre 1909 et 1914, quand, encouragé par Brancusi, il taillait dans la \
pierre des têtes allongées inspirées des masques africains et de l'art archaïque. La \
couleur est posée en couches fines et sourdes, ocres, blancs, bleus gris, sans éclat \
fauve. Le contour, souple et continu, enveloppe la figure comme un trait de dessin. \
L'influence de Cézanne se lit dans la construction du fond en plans de couleur \
juxtaposés et dans la pose inclinée du modèle."""
details = [
  "Les yeux bleu pâle, sans pupilles.",
  "La main repliée contre la joue, aux doigts très longs.",
  "Le cou étiré, presque en colonne.",
  "Le fond partagé en deux plans de couleur, brun-vert et bleu-gris.",
  "La signature modigliani, en minuscules, en haut à droite.",
]
themes = ["portrait", "amour", "mélancolie", "montparnasse", "tragédie"]
anecdote = """
