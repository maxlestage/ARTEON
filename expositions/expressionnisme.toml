# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « EXPRESSIONNISME » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  tableaux dans public/tableaux/<nom>/ (ici public/tableaux/expressionnisme/).
#  Le nom du fichier donne l'adresse de l'exposition sur le site : /expressionnisme.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 180
nom_court = "Expressionnisme"
mouvement = "Fauvisme et expressionnisme"
cadre = "bois"
couleur = "#2b4c9b"
titre = "Fauves et expressionnistes, la couleur libérée"
artiste = "Matisse, Derain, Kirchner, Marc, Macke, Schiele, Modigliani…"
dates = "1904–1919"
accroche = "Exposition virtuelle · Lenbachhaus, Munich"
introduction = """
Au début du XXe siècle, une génération de peintres libère la couleur de son rôle \
descriptif : à Paris, les « fauves » Matisse et Derain peignent des visages verts et \
des montagnes orange ; en Allemagne et en Autriche, Kirchner, Marc, Macke ou Schiele en \
font le langage de l'émotion, de l'angoisse et de l'esprit. La visite suit cette onde \
de choc de Collioure à Berlin, de Munich à Vienne et à Montparnasse, avec Modigliani et \
Paula Modersohn-Becker. Le bâtiment s'inspire de la Lenbachhaus de Munich, la maison du \
Cavalier bleu : un haut foyer contemporain comme celui de l'aile dessinée par Norman \
Foster, des salles blanches baignées de lumière et l'enfilade de la villa du peintre \
Franz von Lenbach."""
vitrine = "cheval-bleu.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Lenbachhaus"
ville = "Munich, Allemagne"
architecte = "Gabriel von Seidl"
construction = "1887–1891"
presentation = """
La Lenbachhaus est d'abord la villa du peintre Franz von Lenbach, portraitiste favori de \
l'Allemagne impériale, construite pour lui par Gabriel von Seidl à la manière d'une \
villa toscane, avec ses façades ocre et son jardin. Après la mort du peintre, la ville \
de Munich l'achète en 1924 et y ouvre en 1929 sa galerie municipale. Tout change en \
1957 : pour ses quatre-vingts ans, Gabriele Münter, compagne de Kandinsky, offre au \
musée les centaines d'œuvres du Cavalier bleu qu'elle avait cachées sous le régime nazi. \
La Lenbachhaus devient la maison du Blaue Reiter, de Kandinsky, Marc, Macke, Jawlensky \
et Münter. Rénovée de 2009 à 2013, elle a reçu de Norman Foster une aile neuve habillée \
de tubes couleur laiton, dont le haut foyer, où tourne le Wirbelwerk d'Olafur Eliasson, \
relie la villa historique aux galeries contemporaines."""
ici = """
ARTEON en mêle les deux époques. Le foyer, haut de 11 mètres et presque blanc, accueille \
le visiteur par le sud, comme l'aile de Foster. À l'ouest, la Salle I · Les fauves ; au \
nord, la Salle II · Le Cavalier bleu, la plus blanche, baignée de lumière comme les \
galeries neuves. À l'est commence l'enfilade de la villa : la Salle III · Worpswede et \
Berlin, aux murs crème, ouvre par une porte à l'est sur la Salle IV · Vienne et \
Montparnasse, où s'achève la visite. Carrées, de 10 mètres de côté et hautes de \
5 mètres, ces deux salles sont les plus intimes."""

# ─── Le plan du musée ────────────────────────────────────────────────────────
# Inspiré de la Lenbachhaus de Munich : on entre par le haut foyer de l'aile
# contemporaine de Norman Foster (2013) ; à l'ouest, une salle pour les fauves ;
# au nord, une salle blanche et lumineuse pour le Cavalier bleu, comme les
# galeries hautes de l'aile neuve ; à l'est, l'enfilade de deux salles de la villa
# ocre de Franz von Lenbach. x et z : le centre de la salle (x vers l'est, z vers
# le sud), en mètres ; une porte se déclare d'un seul côté.

