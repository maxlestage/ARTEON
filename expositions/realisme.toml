[exposition]
ordre = 80
nom_court = "Réalisme"
mouvement = "Réalisme et impressionnisme"
cadre = "dore"
couleur = "#3d5a4c"
titre = "Du réalisme à la vie moderne"
artiste = "Courbet, Millet, Rosa Bonheur, Manet, Degas, Caillebotte, Pissarro"
dates = "1849–1882"
accroche = "Exposition virtuelle · National Gallery of Art, Washington"
introduction = """
Au milieu du XIXᵉ siècle, le réalisme fait descendre la grande peinture de l'Olympe : \
place aux paysans, aux ouvriers, aux enterrements de village et aux rues de Paris. \
Courbet, Millet et Rosa Bonheur montrent la campagne telle qu'elle est ; Manet, Degas, \
Caillebotte et Pissarro peignent la vie moderne et ouvrent la voie à \
l'impressionnisme. Le bâtiment s'inspire du West Building de la National Gallery of \
Art de Washington : une haute rotonde à colonnes au centre, une galerie de chaque côté \
et, à l'est, un cabinet en enfilade."""
vitrine = "dejeuner-sur-l-herbe.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "National Gallery of Art, West Building"
ville = "Washington, États-Unis"
architecte = "John Russell Pope"
construction = "1937–1941"
presentation = """
Banquier et ancien secrétaire au Trésor, Andrew W. Mellon offre à la nation, en 1937, sa \
collection de tableaux et les fonds pour bâtir un musée sur le National Mall. \
L'architecte John Russell Pope dessine un temple néoclassique de marbre rose du \
Tennessee ; il meurt peu après le début des travaux, que ses associés achèvent. Le \
bâtiment, aujourd'hui appelé West Building, ouvre en mars 1941. En son centre, la \
rotonde, coiffée d'une coupole inspirée du Panthéon de Rome, est entourée de colonnes de \
marbre vert sombre et abrite une fontaine surmontée d'un Mercure. Deux longues galeries \
de sculpture partent vers l'est et vers l'ouest et distribuent les salles de peinture, \
éclairées par des verrières. Le musée présente la peinture européenne du Moyen Âge au \
XIXᵉ siècle, de Léonard de Vinci, dont il conserve le seul tableau visible dans les \
Amériques, à Manet, Monet et Degas. En 1978 s'y est ajouté l'East Building, dessiné par \
Ieoh Ming Pei."""
ici = """
Le bâtiment d'ARTEON reprend le plan du West Building : une rotonde au centre, des \
galeries de part et d'autre. On entre par le sud dans le vestibule du Mall, puis dans la \
rotonde, carrée, haute de quatorze mètres, où sont accrochés Le Déjeuner sur l'herbe et \
Olympia. À l'ouest s'ouvre « Galerie ouest · Le réalisme » ; à l'est, « Galerie est · La \
vie moderne », deux salles longues de dix-huit mètres aux murs crème. Au bout de la \
galerie est, une dernière porte mène au « Cabinet est · La ville et le village »."""

