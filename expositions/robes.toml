#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/robes/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /robes.
#
#  Les robes sont photographiées sur mannequin : huit images viennent du
#  Metropolitan Museum de New York (libre accès, CC0), deux du Rijksmuseum
#  d'Amsterdam (domaine public).
