[exposition]
ordre = 69
nom_court = "Robes"
mouvement = "La robe, de la cour de George II aux années folles"
cadre = "vitrine"
couleur = "#9c4f6e"
titre = "Robes, la silhouette et l'étoffe"
artiste = "Maison Worth, couturières anonymes…"
dates = "vers 1750–vers 1926"
accroche = "Exposition virtuelle · Fashion Museum, Assembly Rooms, Bath"
introduction = """
En moins de deux siècles, la robe change plusieurs fois de forme du tout au tout. \
Vers 1750, posée sur des paniers, elle est plus large que haute ; vers 1810, elle \
tombe droit depuis la poitrine ; vers 1835, ce sont les manches qui gonflent ; vers \
1858, la jupe devient une cloche ; vers 1886, toute l'ampleur passe dans le dos ; \
en 1926, la robe s'arrête au genou et ne marque plus la taille. Cette exposition \
suit dix robes, de la robe de cour anglaise à la robe de danse pailletée des années \
folles, en regardant ce qui fait chaque silhouette : les armatures cachées dessous, \
la coupe, et les étoffes, soies brochées, cotons imprimés, tulles, satins, crêpes. \
Huit viennent du Costume Institute du Metropolitan Museum de New York, deux du \
Rijksmuseum d'Amsterdam. Le bâtiment s'inspire des Assembly Rooms de Bath, salles de \
bal du XVIIIᵉ siècle qui ont longtemps abrité le musée de la mode de la ville."""
vitrine = "robe-de-cour.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Fashion Museum, Assembly Rooms de Bath"
ville = "Bath, Angleterre"
architecte = "John Wood le Jeune"
construction = "1769–1771"
presentation = """
Au XVIIIᵉ siècle, Bath, ville d'eaux de l'ouest de l'Angleterre, est le rendez-vous \
de la bonne société, qui vient y prendre les eaux, danser, jouer aux cartes et se \
montrer. L'architecte John Wood le Jeune, à qui l'on doit aussi le Royal Crescent, y \
élève de 1769 à 1771 de nouvelles salles de réunion, les Assembly Rooms, appelées aussi \
« Upper Rooms ». Derrière une façade sobre de pierre blonde se succèdent une immense \
salle de bal, une salle de thé, un salon octogonal et, un peu plus tard, une \
salle de jeu. Jane Austen y conduit les héroïnes de Northanger Abbey et de Persuasion. \
Incendiées lors d'un bombardement en 1942, les salles sont restaurées et rouvrent en \
1963. La même année, la collection de costumes réunie par l'historienne de la mode \
Doris Langley Moore s'installe au sous-sol : c'est le musée du Costume, devenu plus \
tard le Fashion Museum, l'une des grandes collections de mode d'Europe. Il a depuis \
quitté les Assembly Rooms pour préparer un nouveau lieu dans la ville."""
ici = """
Le bâtiment d'ARTEON reprend l'enchaînement des Assembly Rooms autour de leur salon \
octogonal. On entre par le sud dans « Le vestibule », aux murs de pierre blonde, qui \
mène à « L'Octogone », où deux robes du XVIIIᵉ siècle accueillent le visiteur. À \
l'ouest s'étend « La salle de bal », longue de trente-quatre mètres et haute de dix, \
où quatre robes racontent les silhouettes du XIXᵉ siècle, de l'Empire à la \
tournure. À l'est, « La salle de thé » réunit deux robes de la maison Worth ; au \
nord, « La salle de jeu », plus intime, accueille deux robes des années folles."""

