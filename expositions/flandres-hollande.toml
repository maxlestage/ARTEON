[exposition]
ordre = 52
nom_court = "Flandres et Hollande"
mouvement = "Paysages, natures mortes et scènes de genre des Pays-Bas"
cadre = "ebene"
couleur = "#3a5566"
titre = "Flandres et Hollande, le siècle d'or du quotidien"
artiste = "Hals, Steen, De Hooch, Ruisdael, Clara Peeters, Van Dyck, Jordaens…"
dates = "1615–1705"
accroche = "Exposition virtuelle · Mauritshuis, La Haye"
introduction = """
Au XVIIᵉ siècle, les anciens Pays-Bas sont coupés en deux : au nord, la République des \
Provinces-Unies, marchande et protestante ; au sud, la Flandre restée espagnole et \
catholique. Des deux côtés de la frontière, les peintres inventent des genres nouveaux \
pour une clientèle de bourgeois : le paysage, la nature morte, la scène de la vie \
quotidienne. La visite réunit treize peintres, de Clara Peeters à Adriaen Coorte, et \
la fête flamande de Jordaens et de Van Dyck. Le bâtiment s'inspire du Mauritshuis de \
La Haye : un vestibule, une salle dorée au centre et, autour d'elle, trois cabinets \
aux murs colorés."""
vitrine = "chardonneret.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Mauritshuis"
ville = "La Haye, Pays-Bas"
architecte = "Jacob van Campen et Pieter Post"
construction = "1636–1641"
presentation = """
En 1631, le comte Jean-Maurice de Nassau-Siegen, cousin du stathouder Frédéric-Henri, \
achète un terrain au bord du Hofvijver, l'étang qui longe le Binnenhof, le cœur du \
pouvoir à La Haye. Il y fait bâtir de 1636 à 1641, alors qu'il gouverne le Brésil \
hollandais, une demeure dessinée par Jacob van Campen et Pieter Post : un bloc de deux \
étages, strictement symétrique, modèle du classicisme hollandais. Un incendie ravage \
l'intérieur en 1704 ; la reconstruction s'achève en 1718 avec la salle dorée, dont \
Giovanni Antonio Pellegrini peint le plafond et les dessus de cheminée. Acheté par \
l'État en 1820, le bâtiment accueille en 1822 le Cabinet royal de peintures, issu des \
collections des princes d'Orange. Agrandi par Hans van Heeswijk et rouvert en 2014, le \
Mauritshuis expose près de huit cents tableaux, dont La Jeune Fille à la perle et Le \
Chardonneret. Il évoque aujourd'hui aussi la fortune coloniale de son bâtisseur, tirée \
du sucre brésilien et du travail des esclaves africains."""
ici = """
Le bâtiment d'ARTEON reprend la symétrie du Mauritshuis, sur un seul niveau. On entre \
par le sud dans le vestibule, où Le Chardonneret accueille le visiteur, puis on gagne \
la salle dorée, haute de neuf mètres, aux murs d'or pâle en souvenir du décor de \
Pellegrini : Jordaens et Van Dyck y représentent la Flandre. À l'ouest s'ouvre le \
cabinet des natures mortes, aux murs taupe ; à l'est, la salle des paysages, vert \
pâle ; au nord, la salle de la vie quotidienne, couleur vieux rose, consacrée à Hals, \
Steen et De Hooch."""

