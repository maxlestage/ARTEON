[[oeuvres]]
titre = "La Cour de Gayumars"
artiste = "Sultan Muhammad"
annee = "vers 1522–1525"
image = "cour-de-gayumars.jpg"
technique = "Pigments, encre et or sur papier, page du Shâhnâmeh de Shah Tahmasp"
collection = "Aga Khan Museum, Toronto"
note = "Le premier roi du monde, vêtu de peaux de léopard, règne sur les hommes et les bêtes : la page la plus célèbre du Shâhnâmeh de Shah Tahmasp."
description = """
Au centre de la page, sur un rocher en forme de trône, le roi Gayumars est assis en \
tailleur, vêtu de peaux de léopard. Autour de lui, les montagnes forment un \
amphithéâtre de roches aux couleurs irréelles, rose, mauve, bleu, turquoise, ocre, \
d'où jaillit une cascade. Les deux figures qui l'encadrent, debout à gauche et \
agenouillée à droite, sont identifiées à son fils Siyamak et à son petit-fils Hushang. \
Sur les pentes, des dizaines de courtisans, eux aussi vêtus de peaux de bêtes, forment \
un cercle. Lions, léopards, cerfs et renards se mêlent aux hommes sans crainte. Le \
ciel est d'or, parcouru de nuages à la chinoise. Les vers du poème encadrent la scène, \
et un arbre s'échappe du cadre vers le haut de la marge."""
evocation = """
Le Shâhnâmeh, le « Livre des rois » achevé par le poète Ferdowsi vers l'an 1010, \
raconte l'histoire de l'Iran depuis la création du monde. Gayumars en est le premier \
roi : il vit dans les montagnes, apprend aux hommes à se vêtir de peaux, et les \
animaux viennent d'eux-mêmes lui rendre hommage. La page montre un âge d'or, une \
harmonie entre les hommes, les bêtes et la nature, juste avant la tragédie : Siyamak \
sera tué par un démon. On y a vu une image idéale de la royauté, peinte pour \
l'éducation du jeune prince Tahmasp. Le grand spécialiste Stuart Cary Welch y voyait \
l'un des sommets de toute la peinture persane."""
histoire = """
Le Shâhnâmeh de Shah Tahmasp est le manuscrit le plus ambitieux de la peinture \
persane : plus de 250 peintures réalisées à Tabriz, dans l'atelier royal des \
Safavides, à partir des années 1520. Sultan Muhammad, chef de l'atelier, peint cette \
page parmi les premières. Vers 1544, le chroniqueur Dust Muhammad la cite comme une \
œuvre devant laquelle les plus grands peintres s'inclinaient. En 1568, Shah Tahmasp \
offre le manuscrit au sultan ottoman Selim II. Acheté au début du XXᵉ siècle par le \
baron Edmond de Rothschild, il est acquis en 1959 par le collectionneur américain \
Arthur Houghton, qui le démembre. La page appartient aujourd'hui au musée Aga Khan de \
Toronto, ouvert en 2014."""
facture = """
La page fond deux traditions : la peinture visionnaire de Tabriz, aux rochers \
tourmentés et aux couleurs éclatantes, et la précision raffinée de l'école de Hérat, \
héritée de Behzad. Le pinceau, parfois réduit à quelques poils, trace des centaines de \
figures et d'animaux, dont certains ne mesurent que quelques millimètres. Les roches, \
modelées en dégradés pastel, semblent faites d'éponge ou de corail. Le ciel est posé à \
la feuille d'or, et la marge est semée de paillettes d'or. Une loupe révèle des \
détails invisibles à l'œil nu."""
details = [
  "Les visages humains et animaux cachés dans les formes des rochers.",
  "Gayumars, assis en tailleur, vêtu de peaux de léopard.",
  "Les lions et les léopards couchés tranquillement parmi les courtisans.",
  "Le ciel d'or et ses nuages tourbillonnants à la chinoise.",
  "L'arbre qui s'échappe du cadre, au-dessus du texte.",
]
themes = ["mythe", "royauté", "âge d'or", "animaux", "épopée"]
anecdote = """
En 1994, l'Iran a échangé un tableau de Willem de Kooning, Woman III, conservé au \
musée d'Art contemporain de Téhéran, contre les 118 pages restantes du Shâhnâmeh de \
Shah Tahmasp, qui ont ainsi regagné l'Iran."""
salle = 4
mur = "est"
position = 0
largeur = 1.2

[[oeuvres]]
titre = "Les Deux Amants"
artiste = "Reza Abbasi"
annee = "1630"
image = "deux-amants.jpg"
technique = "Pigments, encre et or sur papier, 18,1 × 11,9 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Signée et datée, une étreinte peinte à Ispahan à la fin de la vie du peintre : une feuille isolée, faite pour être collectionnée dans un album."
description = """
Deux jeunes gens sont assis, enlacés, si serrés qu'ils ne forment plus qu'une seule \
masse. Le premier porte un manteau brun doublé de vert et une écharpe orangée ; le \
second, vêtu de vert, est coiffé d'un foulard bleu. Leurs deux visages ronds, joue \
contre joue, se ressemblent presque. Autour d'eux, le fond ocre est couvert d'une \
végétation peinte à l'or : de hautes herbes en panaches, des feuillages, des nuages \
stylisés en haut. Au sol, une bouteille de vin, une coupe, des fruits épars et un plat \
de grenades. À gauche, quelques lignes d'écriture donnent la date et la signature. Une \
bordure bleue ornée de rinceaux d'or encadre la scène."""
evocation = """
L'image respire la sensualité de la cour safavide d'Ispahan au début du XVIIᵉ siècle. \
Le vin, les fruits et l'étreinte évoquent la poésie persane, où l'amour humain et \
l'ivresse sont aussi, souvent, des métaphores de l'amour divin. Reza Abbasi laisse \
volontairement planer une ambiguïté : les deux amants se ressemblent tant qu'on a \
longtemps débattu de leur identité. L'œuvre témoigne aussi d'un changement d'époque : \
on ne peint plus seulement des manuscrits pour le roi, mais des feuilles isolées, \
achetées par des courtisans et des marchands pour leurs albums, où l'on admire avant \
tout la main de l'artiste."""
histoire = """
Reza Abbasi est alors le peintre le plus célèbre d'Iran. Il a servi Shah Abbas Iᵉʳ, \
qui a fait d'Ispahan sa capitale et lui a donné le droit de porter son nom. Le roi \
meurt en 1629 ; l'année suivante, Reza, devenu un vieil homme, signe et date cette \
page. L'inscription, à gauche, indique qu'elle a été achevée au mois de chawwal de \
l'an 1039 de l'hégire, soit au printemps 1630, et se termine par sa signature. Comme \
beaucoup de ces feuilles, elle a sans doute été montée dans un album. Elle entre au \
Metropolitan Museum of Art de New York en 1950."""
facture = """
La ligne est la grande force de Reza Abbasi : un trait calligraphique qui s'épaissit \
et s'amincit, s'enroule dans les plis des vêtements et donne aux corps leur souplesse. \
Les deux figures s'inscrivent dans une forme compacte, presque une pyramide. La gamme \
est restreinte, brun, vert, orangé et bleu, posée sur un fond ocre où la végétation \
est dessinée à l'or, d'un pinceau rapide. Ce style, élégant et nerveux, a été imité \
par des générations de peintres d'Ispahan."""
details = [
  "La bouteille de vin et la coupe posées au sol, à gauche.",
  "L'inscription à gauche, avec la date et la signature du peintre.",
  "Les deux visages joue contre joue, presque identiques.",
  "Les herbes et les feuillages dessinés à l'or sur le fond ocre.",
  "Le plat de grenades et les fruits éparpillés au bas de la page.",
]
themes = ["amour", "étreinte", "vin", "ispahan", "album"]
anecdote = """
Le chroniqueur de Shah Abbas, Iskandar Beg Munshi, reproche à Reza Abbasi d'avoir un \
temps délaissé son art et la cour pour fréquenter des lutteurs et des gens de peu, \
ajoutant qu'il avait un caractère difficile. Le peintre finit pourtant par revenir au \
service du roi."""
salle = 4
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Jahangir préférant un cheikh soufi aux rois"
artiste = "Bichitr"
annee = "vers 1615–1618"
image = "jahangir-cheikh-soufi.jpg"
technique = "Pigments, encre et or sur papier, 25,3 × 18,1 cm"
collection = "Freer Gallery of Art, Washington"
note = "Assis sur un sablier, l'empereur tend un livre à un vieux soufi et ignore le sultan ottoman et le roi d'Angleterre qui attendent à ses pieds."
description = """
L'empereur Jahangir, assis sur un trône en forme de sablier, est entouré d'un immense \
disque d'or associant le soleil et le croissant de lune. Il tend un livre à un \
vieillard à la longue barbe blanche, un cheikh soufi. Sous lui, en file, attendent un \
sultan ottoman coiffé d'un turban, le roi Jacques Iᵉʳ d'Angleterre avec sa fraise et \
son chapeau à plume, et, tout en bas, un homme en turban rouge qui tient une petite \
peinture : le peintre lui-même. Au pied du sablier, deux petits anges écrivent sur sa \
base, tandis que deux autres volent en haut de la page, l'un armé d'un arc, l'autre le \
visage dans les mains. Une large bordure de fleurs encadre le tout."""
evocation = """
Le message est inscrit en haut et en bas de l'image : si les rois se tiennent devant \
lui, l'empereur tourne son regard vers les derviches. Jahangir se présente ainsi comme \
un souverain mystique, qui préfère la sagesse spirituelle au pouvoir terrestre. Mais \
c'est aussi une image de propagande : le nom de Jahangir, « Nur al-Din », signifie \
« lumière de la foi », d'où l'auréole solaire. Le sablier rappelle la fuite du temps, \
et les anges y inscrivent le vœu que la vie de l'empereur dure mille ans. Les deux \
souverains étrangers, relégués sur le côté, disent la place que Jahangir pensait tenir \
dans le monde."""
histoire = """
La page est peinte vers 1615-1618, alors que la cour séjourne souvent à Ajmer, près du \
sanctuaire du saint soufi Muin al-Din Chishti, que vénère l'empereur ; le vieillard \
est généralement identifié comme le cheikh Husain, gardien de ce sanctuaire. C'est \
aussi l'époque où l'ambassadeur anglais Sir Thomas Roe séjourne à la cour, de 1615 à \
1619, et offre à l'empereur des portraits européens : celui de Jacques Iᵉʳ a servi de \
modèle. Au XVIIIᵉ siècle, la page est montée dans un grand album réuni en Iran, dit \
« album de Saint-Pétersbourg ». La Freer Gallery of Art de Washington l'acquiert en \
1942."""
facture = """
Bichitr pousse jusqu'à la perfection le fini des peintres moghols : chaque visage est \
un portrait individualisé, chaque bijou est rendu avec une précision d'orfèvre, et \
l'or illumine l'immense auréole. Il emprunte à l'art européen, découvert par les \
gravures et les tableaux apportés par les jésuites et les ambassadeurs, le modelé des \
visages, les petits anges et le portrait du roi d'Angleterre. Ces éléments étrangers \
se mêlent sans heurt au tapis bleu à arabesques, aux couleurs intenses et à la bordure \
florale persane."""
details = [
  "Le sablier qui sert de trône, et le sable qui s'écoule.",
  "Le roi Jacques Iᵉʳ d'Angleterre, sa fraise blanche et ses bijoux.",
  "L'autoportrait de Bichitr, en turban rouge, en bas à gauche.",
  "Les deux angelots qui écrivent sur la base du sablier.",
  "En haut, l'angelot à l'arc et celui qui se cache le visage.",
]
themes = ["pouvoir", "mysticisme", "temps", "portrait", "empire moghol"]
anecdote = """
Sir Thomas Roe raconte qu'il avait présenté à Jahangir une miniature anglaise, \
persuadé qu'aucun peintre indien ne pourrait l'égaler. L'empereur en fit faire des \
copies si fidèles que l'ambassadeur, à la lumière d'une chandelle, eut du mal à \
reconnaître l'original."""
salle = 5
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Le Rêve de Jahangir"
artiste = "Abu'l Hasan"
annee = "vers 1618"
image = "jahangir-shah-abbas.jpg"
technique = "Pigments, encre et or sur papier, 23,8 × 15,4 cm"
collection = "Freer Gallery of Art, Washington"
note = "Debout sur un lion, l'empereur moghol serre dans ses bras le shah d'Iran, posé sur un agneau : un rêve de Jahangir, mis en images par son peintre favori."
description = """
Deux souverains s'étreignent, debout sur un globe terrestre où l'on reconnaît des \
continents. À droite, plus grand, l'empereur Jahangir, en veste verte et turban \
blanc ; à gauche, plus petit, Shah Abbas, roi d'Iran, en robe rose. Sous leurs pieds, \
un lion et un agneau sont couchés côte à côte, paisibles. Derrière eux, un immense \
disque d'or rayonnant, posé sur un croissant de lune dont les pointes sont tenues par \
deux têtes d'angelots ailés, se détache sur un ciel turquoise. De petites inscriptions \
en persan sont réparties dans l'image. L'ensemble est monté sur une page d'album \
encadrée de rinceaux, de fleurs et d'oiseaux."""
evocation = """
Selon une inscription, l'image illustre un rêve de Jahangir, dans lequel Shah Abbas \
lui était apparu. Sous l'apparence de l'amitié, c'est une image de domination : \
Jahangir est plus grand, c'est lui qui accueille, et son lion, image de la force, \
occupe une large part du globe, jusqu'à pousser l'agneau vers l'ouest. Le lion couché \
près de l'agneau évoque aussi la justice du règne, si parfaite que le fort ne dévore \
plus le faible. Les deux empires se disputaient alors la ville de Kandahar, dans \
l'actuel Afghanistan : on y a vu le désir de Jahangir de régler cette rivalité, au \
moins en rêve."""
histoire = """
La page est peinte vers 1618 par Abu'l Hasan, que Jahangir avait honoré du titre de \
« Nadir al-Zaman », la merveille de l'époque. Elle fait partie d'une série d'images \
allégoriques que l'empereur commande à la fin des années 1610 pour exprimer sa vision \
du pouvoir. Après le pillage de Delhi par le roi d'Iran Nadir Shah en 1739, de \
nombreuses peintures mogholes partent en Iran ; celle-ci est montée au XVIIIᵉ siècle, \
avec sa bordure fleurie, dans l'album dit « de Saint-Pétersbourg ». La Freer Gallery \
of Art de Washington l'acquiert en 1945."""
facture = """
Abu'l Hasan associe la précision du portrait moghol, attentif aux traits de chaque \
visage, à des motifs venus d'Europe : le globe terrestre copié sur les cartes et les \
globes européens, les têtes d'angelots, le modelé des corps. Le grand disque d'or, \
finement strié de rayons, donne à l'image son éclat. Les couleurs sont claires et \
franches, vert, rose, turquoise, sur lesquelles se détachent les deux silhouettes. La \
bordure, avec ses fleurs et ses oiseaux, a été ajoutée plus tard."""
details = [
  "Le lion et l'agneau couchés côte à côte sur le globe.",
  "La carte du globe, avec ses continents et ses mers.",
  "Les deux têtes d'angelots ailés aux pointes du croissant de lune.",
  "La différence de taille entre Jahangir et Shah Abbas.",
  "Les oiseaux cachés dans la bordure fleurie.",
]
themes = ["pouvoir", "rêve", "diplomatie", "symbole", "empire moghol"]
anecdote = """
Les deux souverains ne se sont jamais rencontrés. L'étreinte peinte n'a rien changé à \
leur rivalité : en 1622, quatre ans à peine après cette image, Shah Abbas s'empare de \
Kandahar, que les Moghols ne parviendront à reprendre que pour peu de temps."""
salle = 5
mur = "nord"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Jahangir rendant visite à l'ascète Jadrup"
artiste = "Govardhan"
annee = "vers 1616–1620"
image = "jahangir-jadrup.jpg"
technique = "Pigments, encre et or sur papier, page d'album (attribuée à Govardhan)"
collection = "Musée Guimet, Paris"
note = "Laissant sa suite et son cheval au pied de la colline, l'empereur s'assoit humblement devant la grotte d'un ascète hindou."
description = """
La page est divisée en deux. En haut, sur une colline, devant l'entrée sombre et \
étroite d'une grotte, deux hommes sont assis face à face. À gauche, l'ascète Jadrup, \
d'une maigreur extrême, presque nu, ne porte qu'un pagne et parle en levant les mains. \
À droite, l'empereur Jahangir, auréolé, en vêtements blancs et turban orange, \
l'écoute. Derrière, des arbres et, au loin, une ville bleutée. Au milieu de la page, \
une étendue de terre nue sépare les deux mondes. En bas, la suite impériale attend : \
des dizaines de courtisans en turbans, chacun avec un visage distinct, un cheval gris \
paré d'un tapis de selle doré, un parasol et un étendard. Une bordure de vigne et \
d'oiseaux encadre la scène."""
evocation = """
Jahangir, musulman, s'intéresse comme son père Akbar aux sagesses de l'Inde. Dans ses \
mémoires, il raconte ses entretiens avec Jadrup, un ascète hindou qu'il admire pour sa \
connaissance des textes philosophiques du Vedanta. Le peintre traduit cette admiration \
en images : l'empereur a laissé derrière lui cheval, armes et courtisans, et s'assoit \
à même le sol, à la hauteur du saint homme. Le grand vide du milieu de la page marque \
la distance entre le monde du pouvoir et celui du renoncement. On y lit la tolérance \
religieuse de la cour moghole, où l'on cherchait des vérités communes aux différentes \
traditions."""
histoire = """
Jahangir rencontre Jadrup vers 1616-1617 près d'Ujjain, dans le centre de l'Inde, et \
lui rend visite à plusieurs reprises ; il le reverra plus tard à Mathura, où l'ascète \
s'est installé. Il consigne ces rencontres dans ses mémoires, qu'il fait illustrer par \
les peintres de son atelier. Cette page est attribuée à Govardhan, connu pour ses \
portraits de saints hommes et d'ascètes. Elle appartient aujourd'hui au musée Guimet, \
à Paris, qui conserve l'une des plus importantes collections de peinture indienne en \
France ; une autre version de la scène se trouve aux Harvard Art Museums."""
facture = """
Govardhan excelle dans le rendu des corps : le torse décharné de Jadrup, ses côtes \
saillantes et ses bras maigres sont modelés avec une douceur presque tactile. Dans la \
foule, chaque visage est un véritable portrait, de profil ou de trois quarts, avec ses \
nuances de teint. La ville lointaine, estompée dans une brume bleue, montre \
l'influence de la peinture européenne, connue par les gravures. Les couleurs de terre, \
ocre et sable, dominent ; elles mettent en valeur la tache claire des vêtements \
impériaux."""
details = [
  "L'entrée étroite et sombre de la grotte, entre les deux hommes.",
  "Le corps décharné de l'ascète, ses côtes visibles.",
  "Le cheval gris de l'empereur et son tapis de selle doré.",
  "Le parasol et l'étendard royal au-dessus de la foule.",
  "La ville lointaine, estompée dans une brume bleue, à droite.",
]
themes = ["spiritualité", "ascète", "empereur", "tolérance", "empire moghol"]
anecdote = """
Dans ses mémoires, Jahangir décrit la retraite de Jadrup comme un simple trou creusé \
dans le flanc d'une colline, à l'ouverture si étroite qu'on n'y entrait qu'avec peine. \
L'ascète y vivait seul, nu, et l'empereur dit avoir pris un grand plaisir à leurs \
conversations."""
salle = 5
mur = "ouest"
place = 2
largeur = 1.0

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Fan Kuan"
vie = "Huayuan (Shaanxi), actif vers 990 – vers 1030"
biographie = """
On sait peu de chose de Fan Kuan, l'un des plus grands peintres de paysage de \
l'histoire chinoise. Son vrai nom était Fan Zhongzheng ; « Kuan », qui signifie \
« large » ou « indulgent », serait un surnom lié à son caractère accommodant. \
Originaire de Huayuan, dans la province du Shaanxi, il vit sous les premiers empereurs \
de la dynastie des Song du Nord. Les textes anciens le décrivent comme un homme \
simple, aimant le vin, attiré par le taoïsme et indifférent aux honneurs. Il aurait \
d'abord étudié la peinture de Li Cheng, puis, selon la tradition, décidé que la nature \
était un meilleur maître que les hommes. Il se retire alors dans les montagnes \
Zhongnan et Taihua, près de l'ancienne capitale Chang'an, où il passe des journées à \
observer les rochers, les nuages et la lumière. Dès le XIᵉ siècle, le critique Guo \
Ruoxu le range, avec Li Cheng et Guan Tong, parmi les trois grands maîtres du paysage \
de son temps. Très peu d'œuvres peuvent lui être attribuées avec certitude : Voyageurs \
parmi monts et ruisseaux est la seule qui fasse l'unanimité. Ses dates de naissance et \
de mort restent inconnues ; il était encore vivant au début du XIᵉ siècle."""
style = """
Fan Kuan est le peintre de la montagne monumentale, frontale, écrasante, vue comme un \
monde en soi. Ses roches sont construites par d'innombrables petites touches \
verticales qui en rendent la densité et le grain. Ses compositions, symétriques et \
étagées, séparent les plans par la brume. Il a fixé pour des siècles l'idéal du grand \
paysage des Song du Nord, que copièrent et réinterprétèrent les peintres des Yuan, des \
Ming et des Qing."""

[[artistes]]
nom = "Guo Xi"
vie = "Wenxian (Henan), vers 1020 – vers 1090"
biographie = """
Guo Xi naît vers 1020 à Wenxian, dans la province du Henan, sous la dynastie des Song \
du Nord. Formé, semble-t-il, en partie par lui-même, il étudie les œuvres du grand \
paysagiste Li Cheng et se fait connaître par ses peintures murales. Vers 1068, il est \
appelé à la cour de Kaifeng par le jeune empereur Shenzong, qui l'admire au point de \
lui confier la décoration de nombreux bâtiments du palais et des administrations. Il \
devient l'un des peintres les plus en vue de l'Académie impériale et forme des élèves. \
Ses idées sur la peinture sont rassemblées par son fils Guo Si dans un traité, le Haut \
Message des forêts et des sources, l'un des textes les plus importants de la théorie \
chinoise du paysage. Il y décrit l'observation des saisons, des heures et des \
distances, et le rôle consolateur du paysage pour l'homme retenu en ville par ses \
devoirs. À la mort de Shenzong, en 1085, le goût de la cour change et son œuvre tombe \
en défaveur. Il meurt vers 1090. Son influence reste immense : le style dit \
« Li-Guo », qui réunit son nom à celui de Li Cheng, domine le paysage du Nord pendant \
plusieurs siècles."""
style = """
Guo Xi peint des montagnes vivantes, presque mouvantes, faites de rochers en forme de \
nuages et d'arbres aux branches crochues. Il joue de la brume et des lavis d'encre \
dégradés pour faire sentir l'air, la saison et l'heure. Théoricien des « trois \
distances », il compose des paysages où le regard peut monter, plonger et s'éloigner à \
la fois. Sa peinture allie la grandeur du paysage monumental à une observation très \
fine de la nature."""

[[artistes]]
nom = "Zhao Mengfu"
vie = "Huzhou (Zhejiang), 1254 – Huzhou, 1322"
biographie = """
Zhao Mengfu naît en 1254 à Huzhou, au sud du lac Tai, dans une branche de la famille \
impériale des Song. Il a vingt-cinq ans quand, en 1279, les Mongols de Kubilai Khan \
achèvent la conquête de la Chine et fondent la dynastie des Yuan. Il vit d'abord \
retiré, puis, en 1286, accepte l'invitation de Kubilai et part servir à la nouvelle \
capitale, Dadu, l'actuelle Pékin. Ce choix lui vaut le mépris de certains lettrés \
restés fidèles aux Song. Il occupe des postes en province, notamment au Shandong, puis \
gravit les échelons jusqu'à la direction de l'Académie Hanlin, au plus haut rang de \
l'administration. Son épouse, Guan Daosheng, est elle-même peintre et calligraphe, et \
leur fils Zhao Yong suit leur voie. Calligraphe de génie, Zhao Mengfu a créé un style \
d'écriture qui reste un modèle jusqu'à nos jours. En peinture, il pratique tous les \
genres, paysages, chevaux, bambous, rochers, et prône le retour à l'esprit des maîtres \
anciens. Il meurt à Huzhou en 1322, comblé d'honneurs posthumes."""
style = """
Zhao Mengfu refuse la virtuosité décorative de l'Académie des Song du Sud et revient \
aux maîtres des Tang et des Cinq Dynasties, avec une simplicité volontairement \
archaïque. Pour lui, peindre et écrire relèvent du même geste : il dit que les rochers \
doivent être tracés comme l'écriture « blanc volant » et les arbres comme l'écriture \
sigillaire. Il a fondé l'esthétique de la peinture lettrée, qui domine l'art chinois \
jusqu'au XXᵉ siècle."""

[[artistes]]
nom = "Shen Zhou"
vie = "Xiangcheng, près de Suzhou, 1427 – 1509"
biographie = """
Shen Zhou naît en 1427 à Xiangcheng, près de Suzhou, dans une famille aisée de \
propriétaires terriens et de lettrés, sous la dynastie des Ming. Son grand-père et son \
père sont poètes, peintres et collectionneurs, et il grandit entouré de livres et \
d'œuvres anciennes. Contrairement à la plupart des lettrés de son temps, il ne passe \
jamais les examens impériaux et refuse les fonctions officielles ; on rapporte qu'il \
voulait rester auprès de sa mère, qu'il soigna jusqu'à un âge très avancé. Il consacre \
sa vie à la poésie, à la calligraphie, à la peinture et à la collection, recevant amis \
et disciples dans sa propriété. Il étudie de près les maîtres des Yuan, Wang Meng, \
Huang Gongwang, Ni Zan et Wu Zhen, dont il possède ou copie des œuvres. Sa réputation \
attire de nombreux élèves, dont Wen Zhengming, qui prolongera son enseignement. Shen \
Zhou est considéré comme le fondateur de l'école de Wu, du nom ancien de la région de \
Suzhou. Il meurt en 1509, à plus de quatre-vingts ans, figure respectée de toute la \
société lettrée."""
style = """
Shen Zhou commence par une manière minutieuse, dense, inspirée de Wang Meng, puis \
évolue vers un pinceau plus large, plus libre et plus rapide. Ses paysages, souvent \
accompagnés de ses propres poèmes, montrent les promenades et les amitiés des lettrés \
de Suzhou. Il a aussi peint des fleurs, des oiseaux et des scènes de la vie \
quotidienne. Avec ses élèves, il a fait de Suzhou le centre de la peinture lettrée des \
Ming."""

[[artistes]]
nom = "Behzad"
vie = "Hérat, vers 1450-1460 – Tabriz, vers 1535"
biographie = """
Kamal al-Din Behzad naît à Hérat, dans l'actuel Afghanistan, vers le milieu du XVᵉ \
siècle. Orphelin très jeune, il est élevé, selon les sources anciennes, par le peintre \
Mirak Naqqash, directeur de la bibliothèque royale. Hérat est alors la capitale des \
derniers princes timourides et l'un des grands foyers de la culture persane. Behzad y \
bénéficie de la protection du sultan Husayn Bayqara et de son ministre Mir Ali Shir \
Navai, poète et mécène. Il illustre les manuscrits les plus luxueux de la bibliothèque \
royale, dont le Bustan de Saadi de 1488. Au début du XVIᵉ siècle, Hérat tombe aux \
mains des Ouzbeks, puis des Safavides d'Iran. Behzad gagne Tabriz, où, en 1522, un \
décret de Shah Ismail le nomme directeur de la bibliothèque et de l'atelier royal. Il \
y forme une nouvelle génération de peintres et contribue à l'essor de la peinture \
safavide. Il meurt vers 1535, entouré d'une immense réputation : on lui attribua \
longtemps bien plus d'œuvres qu'il n'en a peint, et son nom est devenu synonyme de \
perfection dans tout le monde persan, de l'Empire ottoman à l'Inde."""
style = """
Behzad renouvelle la miniature persane en donnant vie à ses personnages : postures \
variées, gestes expressifs, scènes de la vie quotidienne glissées dans les récits. Ses \
compositions, très construites, s'organisent autour de diagonales et d'architectures \
complexes, aux décors fidèlement reproduits. Ses couleurs sont intenses mais \
harmonieuses. Son influence s'étend à toute la peinture persane, ottomane et moghole \
du XVIᵉ siècle."""

[[artistes]]
nom = "Sultan Muhammad"
vie = "Tabriz, actif vers 1505 – vers 1545"
biographie = """
Sultan Muhammad est le plus grand peintre de la première génération safavide, mais sa \
vie reste mal connue. Il se forme sans doute à Tabriz, dans la tradition des peintres \
turkmènes qui travaillaient pour les princes Aq Qoyunlu, avant l'arrivée au pouvoir de \
Shah Ismail Iᵉʳ, fondateur de la dynastie safavide, en 1501. Au début des années 1520, \
il dirige l'atelier royal de Tabriz et joue un rôle majeur dans le grand projet du \
Shâhnâmeh destiné au prince Tahmasp, dont il aurait été l'un des maîtres de dessin. Il \
y peint, entre autres, la Cour de Gayumars, page qui lui vaut l'admiration de ses \
contemporains. On lui attribue aussi des peintures d'un célèbre Divan du poète Hafez, \
vers 1527, et d'une Khamseh de Nizami réalisée pour Shah Tahmasp entre 1539 et 1543, \
aujourd'hui à la British Library de Londres. Son fils, Mirza Ali, devient lui aussi un \
peintre important de l'atelier royal. On perd sa trace dans les années 1540, quand \
Shah Tahmasp, gagné par la dévotion, se détourne peu à peu de la peinture."""
style = """
Sultan Muhammad unit l'imagination débridée de la peinture turkmène de Tabriz, ses \
rochers fantastiques et ses couleurs vives, à la rigueur de l'école de Hérat. Ses \
pages fourmillent de détails minuscules, de visages cachés dans les rochers, de \
personnages pleins d'humour. Sa palette, riche en roses, mauves et turquoises, et son \
sens du mouvement font de lui le maître du premier style safavide."""

[[artistes]]
nom = "Reza Abbasi"
vie = "Kashan ?, vers 1565 – Ispahan, 1635"
biographie = """
Reza Abbasi, ou Riza-yi Abbasi, naît vers 1565, sans doute à Kashan, fils d'Ali \
Asghar, peintre au service des souverains safavides. Il entre jeune à l'atelier de \
Shah Abbas Iᵉʳ, monté sur le trône en 1588, qui fait d'Ispahan sa nouvelle capitale et \
la couvre de mosquées, de palais et de jardins. Le roi lui accorde le titre d'Abbasi, \
qui associe son nom à celui du souverain. Au début du XVIIᵉ siècle, il s'éloigne un \
temps de la cour, ce que lui reproche le chroniqueur Iskandar Beg Munshi, puis y \
revient et reste le peintre le plus renommé du royaume. Plutôt que d'illustrer de \
grands manuscrits, il se consacre surtout aux feuilles isolées, dessins et peintures \
destinés aux albums des collectionneurs : jeunes élégants, amants, derviches, \
vieillards, scènes pastorales. Il forme de nombreux élèves, dont Muin Musavvir, qui a \
laissé de lui un portrait. Son fils, Shafi Abbasi, devient à son tour un peintre \
réputé, spécialiste des fleurs et des oiseaux. Reza Abbasi meurt à Ispahan en 1635, au \
sommet de sa gloire."""
style = """
Reza Abbasi est avant tout un dessinateur. Sa ligne calligraphique, souple et \
nerveuse, s'enfle et s'amincit pour suivre les plis des vêtements et les courbes des \
corps. Ses figures, élégantes, nonchalantes, souvent sensuelles, se détachent sur des \
fonds simples rehaussés d'or. Il a imposé à Ispahan le goût de la page d'album et \
défini le style de la peinture safavide du XVIIᵉ siècle, imité pendant des \
générations."""

[[artistes]]
nom = "Bichitr"
vie = "Inde moghole, actif vers 1610 – vers 1660"
biographie = """
Bichitr est un peintre hindou de la cour moghole, dont on ne connaît que ce que \
révèlent ses œuvres signées. Son nom, d'origine sanskrite, signifie « merveilleux » ou \
« étonnant ». Formé dans l'atelier impérial sous le règne de Jahangir, empereur de \
1605 à 1627, il se fait remarquer par des portraits et des allégories politiques d'une \
extrême finesse, comme celle où l'empereur préfère un cheikh soufi aux rois. Il s'y \
représente lui-même, ce qui montre l'estime dont il jouissait. Il devient l'un des \
peintres favoris de Shah Jahan, le fils de Jahangir, empereur de 1628 à 1658 et \
bâtisseur du Taj Mahal. Il participe à l'illustration de la grande chronique \
officielle du règne, le Padshahnama, conservée aujourd'hui dans la collection royale \
britannique, et peint de nombreux portraits de l'empereur, des princes et des \
dignitaires. Ses œuvres datées s'étendent sur plusieurs décennies, jusque vers le \
milieu du XVIIᵉ siècle. On ignore les dates de sa naissance et de sa mort."""
style = """
Bichitr pousse à son sommet le fini de la peinture moghole : portraits d'une précision \
saisissante, bijoux et tissus rendus au détail près, couleurs lumineuses. Il intègre \
avec aisance des motifs européens, angelots, paysages en perspective atmosphérique, \
modelé des visages, dans des compositions solennelles et symboliques. Ses images \
servent la gloire impériale tout en gardant une grande humanité dans les visages."""

[[artistes]]
nom = "Abu'l Hasan"
vie = "Cour moghole, 1588 ou 1589 – après 1630"
biographie = """
Abu'l Hasan naît en 1588 ou 1589 dans l'entourage du prince Salim, le futur empereur \
Jahangir, qui le dit « né dans sa maison ». Son père, Aqa Riza, était un peintre venu \
de Hérat, entré au service du prince. Précoce, il signe vers l'âge de treize ans un \
dessin d'après une gravure d'Albrecht Dürer représentant saint Jean, aujourd'hui à \
l'Ashmolean Museum d'Oxford. Quand Salim devient empereur en 1605, Abu'l Hasan \
s'impose comme l'un des premiers peintres de l'atelier impérial. Il peint l'image de \
l'avènement de Jahangir, de nombreux portraits et les grandes allégories politiques du \
règne, où l'empereur triomphe de ses ennemis ou embrasse le roi d'Iran. Jahangir écrit \
dans ses mémoires que son œuvre est sans égale et lui donne le titre de Nadir \
al-Zaman, « la merveille de l'époque ». On lui attribue aussi des Écureuils dans un \
platane, vers 1610, aujourd'hui à la British Library, célèbres pour leur naturalisme. \
Après la mort de Jahangir en 1627, on perd peu à peu sa trace."""
style = """
Abu'l Hasan est un portraitiste d'une grande sûreté, capable de saisir la psychologie \
d'un visage. Il a assimilé très tôt les leçons de la gravure européenne, qu'il fond \
dans la tradition persane et indienne : modelé, globes, angelots, auréoles \
rayonnantes. Ses allégories, riches de symboles, ont donné à l'art moghol une \
dimension politique et visionnaire nouvelle."""

[[artistes]]
nom = "Govardhan"
vie = "Inde moghole, actif vers 1596 – vers 1645"
biographie = """
Govardhan est un peintre hindou de la cour moghole, fils d'un peintre de l'atelier de \
l'empereur Akbar. Il commence à travailler à la fin du XVIᵉ siècle, sous Akbar, en \
participant à l'illustration de manuscrits historiques et littéraires. Il poursuit sa \
carrière sous Jahangir, puis sous Shah Jahan, soit près d'un demi-siècle au service \
des empereurs. Vers 1610, le peintre Daulat le représente, avec d'autres maîtres de \
l'atelier impérial, dans un portrait de groupe des artistes de la cour. Govardhan se \
distingue par ses portraits pleins de chaleur et surtout par ses images de saints \
hommes, d'ascètes, de musiciens et de derviches, sujets qu'il traite avec une \
sympathie particulière. Il peint aussi des scènes de cour et des portraits de \
l'empereur et des princes, dont un célèbre double portrait de Shah Jahan et de son \
fils Dara Shikoh. Plusieurs de ses œuvres sont conservées au musée Guimet à Paris. On \
perd sa trace vers le milieu du XVIIᵉ siècle ; ses dates de naissance et de mort ne \
sont pas connues."""
style = """
Govardhan est le peintre de la douceur et de l'intériorité. Son modelé, subtil, rend \
la texture de la peau, la maigreur des ascètes, le poids des corps. Ses visages, \
attentifs et graves, semblent toujours habités d'une pensée. Il compose des scènes \
calmes, aux couleurs de terre, où la lumière et l'espace jouent un grand rôle, et \
reste l'un des grands portraitistes de l'art moghol."""
