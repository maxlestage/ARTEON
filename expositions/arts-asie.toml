# laquelle s'ouvrent les salles par pays : la Chine à l'ouest, l'Iran à l'est, l'Inde
# au nord. x et z : le centre de la salle (x vers l'est, z vers le sud), en mètres ;
# une porte se déclare d'un seul côté.

[[salles]]
