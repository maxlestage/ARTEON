# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Voyageurs parmi monts et ruisseaux"
artiste = "Fan Kuan"
annee = "vers 1000"
image = "voyageurs-monts-ruisseaux.jpg"
technique = "Rouleau vertical, encre et couleurs légères sur soie, 206,3 × 103,3 cm"
collection = "Musée national du Palais, Taipei"
note = "Une montagne immense, presque verticale, domine une minuscule caravane de mulets : l'image fondatrice du grand paysage chinois."
description = """
Le rouleau, haut de plus de deux mètres, se lit de bas en haut. Au premier plan, de \
gros rochers arrondis barrent le chemin. Juste au-dessus, une colline couverte \
d'arbres noueux occupe la largeur du tableau ; à droite, au pied des arbres, une \
petite caravane de mulets chargés avance sur un sentier, menée par deux hommes, et \
l'on devine les toits d'un temple entre les feuillages. Puis vient une bande de brume \
pâle, comme un vide. Au-delà se dresse la montagne principale, une paroi énorme et \
frontale qui remplit les deux tiers supérieurs du rouleau, couronnée de buissons \
sombres. Sur son flanc droit, une cascade tombe en un mince filet blanc, presque \
invisible dans la masse du rocher."""
evocation = """
Tout est fait pour que le spectateur se sente minuscule : les voyageurs ne mesurent \
que quelques centimètres face à une montagne qui semble surgir devant lui. On y a vu \
l'expression d'un ordre du monde cher aux lettrés des Song du Nord, où chaque chose \
occupe sa place, de la pierre au sommet, et où l'homme n'est qu'une part d'un ensemble \
qui le dépasse. La montagne centrale, entourée de collines plus basses, a souvent été \
comparée à un souverain entouré de ses ministres. La tradition rapporte que Fan Kuan \
aurait renoncé à imiter les maîtres pour prendre la nature, puis son propre cœur, pour \
modèles : le tableau passe ainsi pour l'image même d'une peinture née de la \
contemplation directe des montagnes."""
histoire = """
Fan Kuan vit au tournant de l'an mil, sous la dynastie des Song du Nord, retiré dans \
les montagnes du Shaanxi, près de l'ancienne capitale Chang'an. Le rouleau n'est pas \
daté et l'on ignore pour qui il fut peint. Il passe par de nombreuses collections \
avant d'entrer dans celle des Qing. Au XXᵉ siècle, il suit le long exil des trésors du \
palais impérial de Pékin, emballés en caisses en 1933 pour échapper à l'armée \
japonaise, déplacés à travers la Chine pendant la guerre, puis transportés à Taïwan en \
1948-1949. Il est aujourd'hui l'un des joyaux du musée national du Palais de Taipei, \
qui, pour le protéger de la lumière, ne l'expose que quelques semaines, à plusieurs \
années d'intervalle."""
facture = """
La roche est construite par une multitude de petites touches verticales, serrées comme \
des gouttes de pluie : les historiens chinois parlent de « rides en gouttes de \
pluie », une manière associée au nom de Fan Kuan. Elles rendent le grain et la masse \
de la pierre mieux qu'aucun contour. L'encre, posée en couches sur la soie aujourd'hui \
assombrie, va du gris léger au noir profond des feuillages. La composition, frontale \
et symétrique, superpose trois plans séparés par la brume, sans perspective unique : \
le regard monte, plan après plan, jusqu'au sommet."""
details = [
  "La caravane de mulets et ses deux conducteurs, en bas à droite.",
  "Les toits d'un temple qui pointent entre les arbres, à droite de la colline.",
  "La cascade, simple trait blanc sur le flanc droit de la grande paroi.",
  "La bande de brume au pied de la montagne, qui crée un vide entre les plans.",
  "Les milliers de petites touches verticales qui forment la roche.",
]
themes = ["montagne", "paysage", "voyage", "nature", "song du nord"]
anecdote = """
La signature du peintre est restée cachée près de mille ans. Ce n'est qu'en 1958 qu'un \
chercheur du musée, Li Lin-ts'an, découvre les deux caractères de son nom, Fan Kuan, \
dissimulés dans les feuillages, en bas à droite, tout près des voyageurs."""
salle = 2
mur = "nord"
place = 1
largeur = 1.05

[[oeuvres]]
titre = "Début du printemps"
artiste = "Guo Xi"
annee = "1072"
image = "debut-du-printemps.jpg"
technique = "Rouleau vertical, encre et couleurs légères sur soie, 158,3 × 108,1 cm"
collection = "Musée national du Palais, Taipei"
note = "Signé et daté par le peintre de la cour de l'empereur Shenzong : la montagne s'éveille dans la brume, encore nue, au premier souffle du printemps."
description = """
Une montagne s'élève en ondulant au centre du rouleau, comme une colonne de nuages \
pétrifiés. Ses rochers aux formes molles s'enroulent les uns sur les autres et \
s'estompent dans la brume, qui monte des vallées. Au premier plan, sur des blocs \
arrondis, des arbres encore dépouillés tordent leurs branches. Partout se cachent de \
petites scènes : en bas à gauche, des pêcheurs dans une barque amarrée ; en bas à \
droite, une famille qui débarque sur la rive ; plus haut, à droite, les toits d'un \
temple ou d'un pavillon nichés dans un vallon, et des cascades qui dévalent la pente. \
À gauche, le regard s'échappe vers une vallée lointaine. En haut à droite, un poème a \
été ajouté bien plus tard."""
evocation = """
Le tableau saisit un moment précis : la fin de l'hiver, quand la vie revient, que la \
brume se lève et que les hommes reprennent leurs activités. Guo Xi a laissé des \
réflexions sur son art, réunies par son fils dans un traité, le Haut Message des \
forêts et des sources : il y explique qu'un bon paysage doit permettre au \
fonctionnaire retenu en ville d'y voyager, d'y contempler, d'y flâner et d'y demeurer \
en esprit. On a aussi lu cette montagne comme une image politique : un pic dominant, \
entouré de sommets ordonnés, à la manière de l'empereur entouré de sa cour, à l'époque \
où l'empereur Shenzong lançait de grandes réformes."""
histoire = """
Guo Xi est appelé à la cour vers 1068 par le jeune empereur Shenzong, qui admire son \
talent au point de lui confier la décoration de nombreux murs et écrans du palais. Le \
rouleau porte, sur son bord gauche, une courte inscription du peintre : le titre et la \
date, l'année renzi, qui correspond à 1072. Après la mort de Shenzong en 1085, le goût \
de la cour change et ses peintures sont décrochées. Le Début du printemps passe \
pourtant dans les collections impériales ; au XVIIIᵉ siècle, l'empereur Qianlong y \
fait inscrire un poème de sa main, en haut à droite. Avec les trésors de la Cité \
interdite, il gagne Taïwan en 1948-1949."""
facture = """
Guo Xi réunit dans une seule image les « trois distances » qu'il décrit dans son \
traité : la distance en hauteur, quand on lève les yeux vers le sommet, la distance en \
profondeur, quand on plonge dans les vallées, et la distance à plat, quand le regard \
file vers l'horizon. Les rochers sont modelés par des lavis d'encre dégradés et des \
traits enroulés qui leur donnent l'aspect de nuages. Les branches des arbres, crochues \
comme des pinces de crabe, viennent de la tradition du peintre Li Cheng. Quelques \
touches de couleur légère animent la soie."""
details = [
  "La courte inscription du peintre, avec le titre et la date, sur le bord gauche.",
  "Les pêcheurs dans leur barque amarrée, en bas à gauche.",
  "La famille qui arrive sur la rive, en bas à droite.",
  "Les branches crochues des arbres nus, au premier plan.",
  "Le poème de l'empereur Qianlong et son sceau, en haut à droite.",
]
themes = ["printemps", "montagne", "brume", "cour impériale", "song du nord"]
anecdote = """
Selon le critique Deng Chun, au XIIᵉ siècle, les peintures de Guo Xi tombèrent si bien \
en disgrâce après la mort de Shenzong qu'on les vit servir de chiffons pour essuyer \
les tables du palais. Le père de Deng Chun obtint alors de l'empereur le droit de les \
recueillir."""
salle = 2
mur = "nord"
place = 4
largeur = 1.1

[[oeuvres]]
titre = "Couleurs d'automne sur les monts Qiao et Hua"
artiste = "Zhao Mengfu"
annee = "1295"
image = "couleurs-automne-qiao-hua.jpg"
technique = "Rouleau horizontal, encre et couleurs sur papier, 28,4 × 93,2 cm"
collection = "Musée national du Palais, Taipei"
note = "Peint pour un ami qui n'avait jamais vu la terre de ses ancêtres : deux montagnes du Shandong au milieu des marais, en automne."
description = """
Le rouleau horizontal se déroule de droite à gauche, comme on lit un texte chinois. \
Une vaste plaine humide, couverte de roseaux et de marais, s'étend sous un ciel pâle. \
À droite se dresse un pic bleu en forme de triangle pointu : le mont Hua. À gauche, \
une montagne basse et arrondie, d'un bleu-vert sombre, presque en forme de miche : le \
mont Que, ou Qiao. Entre les deux, des bouquets d'arbres aux feuilles rouges et \
jaunes, des saules, quelques maisons basses, un petit troupeau. En bas à gauche, des \
pêcheurs tendent leurs filets depuis des barques. Le ciel est envahi d'inscriptions et \
de sceaux rouges, ajoutés par les collectionneurs successifs."""
evocation = """
Le tableau est un cadeau d'amitié et un objet de mémoire. Son destinataire, le lettré \
Zhou Mi, descendait d'une famille du Shandong, mais il vivait dans le Sud et n'avait \
jamais vu la région de ses ancêtres. Zhao Mengfu, qui venait d'y servir comme \
fonctionnaire, lui peint ce paysage pour le lui raconter. On y a vu aussi un \
manifeste : sous la domination mongole, Zhao revient volontairement à la manière des \
peintres anciens, des Tang et des Cinq Dynasties, et affirme ainsi la continuité de la \
culture chinoise. Le calme du paysage, sans drame ni montagne écrasante, traduit \
l'idéal d'une vie retirée, simple et lettrée."""
histoire = """
Zhao Mengfu, descendant de la famille impériale des Song, a accepté de servir la \
nouvelle dynastie mongole des Yuan, ce que certains de ses contemporains lui \
reprochèrent. Nommé dans la région de Jinan, au Shandong, il rentre dans le Sud en \
1295 et peint ce rouleau pour Zhou Mi. Sa propre inscription, au centre gauche, \
raconte cette histoire et date l'œuvre du douzième mois de la première année de l'ère \
Yuanzhen, à la fin de 1295. Le rouleau passe ensuite de collection en collection, \
chaque propriétaire y apposant son sceau, avant d'entrer au palais impérial. \
L'empereur Qianlong le couvre de ses poèmes et de ses cachets. Il est aujourd'hui \
conservé à Taipei."""
facture = """
Zhao Mengfu choisit une naïveté apparente : les arbres sont presque plus grands que \
les maisons, la plaine est vue de haut sans profondeur réelle, les montagnes sont \
posées comme des objets. Ce style archaïsant imite les maîtres anciens, notamment Dong \
Yuan, dont il reprend les longues touches souples, en fibres de chanvre. Le bleu \
minéral des deux sommets rappelle la peinture « bleu et vert » des Tang. Pour Zhao, \
peinture et calligraphie relèvent du même pinceau : chaque tronc, chaque roseau est un \
trait d'écriture, posé à l'encre presque sèche sur le papier."""
details = [
  "À droite, le pic triangulaire du mont Hua ; à gauche, la masse arrondie du mont Qiao.",
  "Les pêcheurs et leurs filets, dans les barques, en bas à gauche.",
  "Les feuilles rouges et jaunes de l'automne parmi les arbres de la plaine.",
  "L'inscription de Zhao Mengfu, à gauche du centre, qui raconte la genèse du tableau.",
  "Les dizaines de sceaux rouges des collectionneurs, dont ceux de l'empereur Qianlong.",
]
themes = ["paysage", "automne", "amitié", "lettrés", "dynastie yuan"]
anecdote = """
Au printemps 1748, l'empereur Qianlong, qui voyage alors au Shandong, la région peinte \
par Zhao Mengfu, ajoute sur le rouleau un poème consacré au mont Qiao, daté de cette \
saison : il est inscrit en haut à gauche, au-dessus de la montagne arrondie."""
salle = 3
mur = "ouest"
position = 0
largeur = 2.0

[[oeuvres]]
titre = "Le Haut Mont Lu"
artiste = "Shen Zhou"
annee = "1467"
image = "mont-lu.jpg"
technique = "Rouleau vertical, encre et couleurs légères sur papier, 193,8 × 98,1 cm"
collection = "Musée national du Palais, Taipei"
note = "Offert par Shen Zhou à son maître Chen Kuan pour ses soixante-dix ans : une montagne qu'il n'avait jamais vue, image de la vertu du vieux lettré."
description = """
Les montagnes s'empilent jusqu'en haut du rouleau, haut de près de deux mètres. À \
gauche, une longue cascade blanche tombe par paliers le long d'une falaise, près d'une \
passerelle de bois accrochée à la paroi, puis se perd dans un torrent qui serpente \
jusqu'au bas du tableau. À droite, au premier plan, de grands pins aux troncs tordus \
s'accrochent aux rochers. Tout en bas, minuscule, un lettré en robe claire se tient \
debout sur une avancée de rocher et regarde la chute d'eau. En haut à droite, des \
pitons rocheux émergent des nuages. Le titre, trois grands caractères, et un long \
poème de la main du peintre occupent le ciel, en haut à droite."""
evocation = """
Le mont Lu, dans la province du Jiangxi, est l'une des montagnes les plus célèbres de \
Chine, chantée par les poètes depuis des siècles. Shen Zhou l'associe à son maître \
Chen Kuan, dont la famille était originaire de cette région : dans son poème, la \
hauteur de la montagne devient l'image de la grandeur morale du vieil homme. Le \
tableau n'est donc pas une vue, mais un hommage, et le petit personnage au pied de la \
cascade a parfois été interprété comme le maître lui-même, ou comme le disciple qui le \
contemple. On y lit l'idéal des peintres lettrés : peindre un paysage pour exprimer \
une pensée, une amitié, une admiration."""
histoire = """
En 1467, Shen Zhou a quarante ans. Il vit près de Suzhou, la grande ville lettrée du \
bas Yangzi, et n'a jamais occupé de poste officiel. Pour le soixante-dixième \
anniversaire de Chen Kuan, son ancien professeur, il peint ce rouleau de grand format, \
le plus ambitieux de ses débuts, et y inscrit un poème composé pour l'occasion. Shen \
Zhou deviendra ensuite le fondateur de l'école de Wu, qui domine la peinture lettrée \
de la région de Suzhou pendant plus d'un siècle. Le rouleau entre plus tard dans les \
collections impériales des Qing, puis gagne Taïwan avec les trésors du palais. Il est \
conservé au musée national du Palais de Taipei."""
facture = """
Shen Zhou rend hommage au peintre Wang Meng, l'un des grands maîtres des Yuan, dont il \
reprend la composition dense, sans vide, et les innombrables petites touches enroulées \
qui donnent aux rochers une texture frémissante. Le pinceau est minutieux, presque \
nerveux, bien loin de la manière ample et rapide de ses œuvres plus tardives. L'encre \
domine, rehaussée de teintes légères, ocre et bleu pâle. La composition en zigzag \
conduit le regard du torrent à la cascade, puis jusqu'aux sommets, où la calligraphie \
du poème prolonge la peinture."""
details = [
  "Le minuscule lettré debout au pied de la cascade, tout en bas.",
  "La longue chute d'eau qui tombe par paliers, à gauche.",
  "La passerelle de bois accrochée à la falaise, près de la cascade.",
  "Les grands pins aux troncs tordus, en bas à droite.",
  "Le titre en trois grands caractères et le long poème, en haut à droite.",
]
themes = ["montagne", "hommage", "cascade", "lettrés", "dynastie ming"]
anecdote = """
Shen Zhou n'est jamais allé au mont Lu. Il a composé cette montagne de mémoire et \
d'imagination, à partir des poèmes qui la célèbrent et du style de Wang Meng : pour un \
peintre lettré, la vérité d'un paysage tenait à son sens plus qu'à sa ressemblance."""
salle = 3
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "La Séduction de Yusuf"
artiste = "Behzad"
annee = "1488"
image = "yusuf-et-zuleykha.jpg"
technique = "Pigments, encre et or sur papier, page d'un manuscrit du Bustan de Saadi"
collection = "Bibliothèque nationale d'Égypte (Dar al-Kutub), Le Caire"
note = "Dans un palais aux portes verrouillées, le beau Yusuf échappe à Zuleykha : une architecture vertigineuse, peinte à Hérat pour le sultan Husayn Bayqara."
description = """
Un palais est montré en coupe, comme une maison de poupée : on voit à la fois ses \
façades, ses escaliers et ses pièces. À gauche, un escalier de bois rouge monte en \
zigzag d'un étage à l'autre. Partout, des murs couverts de carreaux de céramique \
bleus, turquoise et blancs, des portes fermées, des fenêtres grillagées, des niches. \
Tout en haut, dans la pièce centrale, un jeune homme en robe verte, la tête entourée \
d'un nimbe de flammes d'or, s'arrache à une femme en rouge qui tente de le retenir par \
son vêtement. Des panneaux de poésie calligraphiée sont insérés dans le décor. Le \
palais déborde du cadre : un pavillon en coupole et un balcon rouge s'avancent dans la \
marge mouchetée d'or."""
evocation = """
L'histoire vient du Coran et de la Bible : Yusuf, le Joseph de la Genèse, est désiré \
par Zuleykha, l'épouse de son maître égyptien. Le poète Saadi la raconte dans le \
Bustan, et Jami, contemporain de Behzad, l'a développée peu avant : Zuleykha fait \
construire un palais aux sept chambres, dont elle ferme chaque porte, mais les portes \
s'ouvrent devant Yusuf qui s'enfuit. Dans la culture soufie, le récit a un sens \
spirituel : Yusuf est l'âme qui résiste au désir, et la grâce divine ouvre les portes \
du piège. Le labyrinthe de pièces fermées, sans issue apparente, a souvent été lu \
comme l'image du monde et de ses tentations."""
histoire = """
La page appartient à un manuscrit du Bustan, « le Verger », recueil de récits moraux \
composé par Saadi en 1257. Il est copié et illustré en 1488 à Hérat, dans l'actuel \
Afghanistan, alors capitale brillante des derniers princes timourides, pour la \
bibliothèque du sultan Husayn Bayqara, dont le portrait orne le double frontispice. Le \
peintre Behzad, alors en pleine maturité, y signe plusieurs peintures, dont celle-ci, \
qui comptent parmi les rares œuvres que les historiens lui attribuent avec certitude. \
Le manuscrit, l'un des plus importants de la peinture persane, est aujourd'hui \
conservé au Caire, à la Bibliothèque nationale d'Égypte."""
facture = """
Behzad emploie les couleurs les plus précieuses de son temps : le bleu de \
lapis-lazuli, le vert de malachite, le vermillon et l'or. Les motifs des carreaux, \
entrelacs géométriques et arabesques florales, reproduisent fidèlement le décor de \
l'architecture timouride. La perspective n'a pas de point de fuite : chaque pièce est \
vue sous l'angle qui la montre le mieux, et les plans s'emboîtent comme des tiroirs. \
Les diagonales de l'escalier et du corps de Yusuf donnent son mouvement à une image \
par ailleurs immobile. Les figures, petites, se distinguent par leurs gestes \
expressifs."""
details = [
  "Le nimbe de flammes d'or qui entoure la tête de Yusuf.",
  "Zuleykha, en rouge, qui agrippe le vêtement du jeune homme.",
  "L'escalier de bois rouge qui monte en zigzag, à gauche.",
  "Le balcon rouge et le pavillon à coupole qui débordent du cadre.",
  "Les vers calligraphiés, insérés dans les murs comme de vraies inscriptions.",
]
themes = ["tentation", "architecture", "poésie", "soufisme", "hérat"]
anecdote = """
Babur, le fondateur de l'empire moghol, a jugé Behzad dans ses mémoires : il loue la \
grande délicatesse de son travail, mais trouve qu'il réussissait mal les visages sans \
barbe, auxquels il donnait un double menton trop long, alors que ses visages barbus \
étaient admirables."""
salle = 4
