# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « ARTS D'ASIE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/arts-asie/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /arts-asie.
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 25
nom_court = "Arts d'Asie"
mouvement = "Peinture chinoise, persane et moghole"
couleur = "#9a3324"
titre = "Monts, jardins et empereurs : la peinture d'Asie"
artiste = "Fan Kuan, Guo Xi, Zhao Mengfu, Behzad, Reza Abbasi, Bichitr…"
dates = "vers 1000–1630"
accroche = "Exposition virtuelle · Musée Guimet, Paris"
introduction = """
Six siècles de peinture d'Asie, de la Chine des Song à l'Inde des Grands Moghols. En \
Chine, des paysages à l'encre sur soie ou sur papier, peints sur des rouleaux que l'on \
déroule et que l'on contemple comme on voyage. En Iran et en Inde, des miniatures de \
manuscrits et d'albums, aux couleurs de pierres précieuses, faites pour des princes \
lettrés. Le bâtiment s'inspire du musée Guimet à Paris, fondé par Émile Guimet et \
ouvert en 1889 : un vestibule, la haute rotonde de la bibliothèque, puis des salles \
consacrées chacune à un pays."""
vitrine = "voyageurs-monts-ruisseaux.jpg"

