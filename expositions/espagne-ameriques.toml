[exposition]
ordre = 135
nom_court = "Espagne et Amériques"
mouvement = "Espagne et Amérique latine au XIXᵉ siècle"
cadre = "dore"
couleur = "#9a4a22"
titre = "Espagne et Amérique latine, les deux rives d'une peinture"
artiste = "Fortuny, Sorolla, Casas, Zuloaga, Velasco, Herrán, Pedro Américo…"
dates = "1851–1913"
accroche = "Exposition virtuelle · Museo Nacional de Arte (MUNAL), Mexico"
introduction = """
Au XIXᵉ siècle, tandis que l'Espagne cherche son image entre la lumière de \
Sorolla et l'Espagne noire de Zuloaga, les jeunes nations d'Amérique latine \
inventent la leur : la vallée de Mexico de Velasco, le cri d'indépendance du \
Brésil, le paysan de São Paulo, la veillée d'un enfant à Porto Rico. La visite réunit \
dix peintres, de Madrid et Barcelone à Mexico, São Paulo, Buenos Aires et San \
Juan. Le bâtiment s'inspire du Museo Nacional de Arte de Mexico, installé dans un \
palais du début du XXᵉ siècle : un vestibule, un grand salon de réception au centre, \
et des salles qui l'entourent sur trois côtés."""
vitrine = "paseo-orillas-mar.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Museo Nacional de Arte (MUNAL)"
ville = "Mexico, Mexique"
architecte = "Silvio Contri"
construction = "1904–1911"
presentation = """
Le Musée national d'art de Mexico occupe l'ancien palais du ministère des \
Communications et des Travaux publics, rue Tacuba, dans le centre historique. Sous la \
présidence de Porfirio Díaz, l'architecte italien Silvio Contri le construit à partir de \
1904 dans un style éclectique, mêlant références néoclassiques et Renaissance : façade \
de pierre, grand escalier d'honneur à double volée, salon de réception au plafond peint \
d'une Allégorie du Progrès. Sa façade donne sur la place Manuel-Tolsá, où se dresse le \
Caballito, la statue équestre de Charles IV, œuvre de Manuel Tolsá. \
Le palais devient musée le 23 juillet 1982, puis il est restauré à la fin des années \
1990. Ses salles retracent l'art mexicain de l'époque coloniale au milieu du XXᵉ \
siècle ; les vues de la vallée de Mexico de José María Velasco et les toiles de \
Saturnino Herrán comptent parmi ses trésors."""
ici = """
ARTEON reprend l'ordonnance du palais : on entre par le sud dans le vestibule de la \
place Tolsá, aux murs de pierre claire, puis dans le salon de réception, la plus grande \
salle, longue de 24 mètres et haute de 10, aux murs rouge brique, consacrée à \
l'Espagne. Trois salles l'entourent : à l'ouest, la salle du Mexique, aux murs ocre ; à \
l'est, la salle du Brésil, d'un vert pâle ; au nord, enfin, la salle du Río de la Plata \
et des Caraïbes, aux murs rose poudré, où s'achève la visite."""

