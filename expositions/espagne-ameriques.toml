#  EXPOSITION « ESPAGNE ET AMÉRIQUES » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  tableaux dans public/tableaux/<nom>/ (ici public/tableaux/espagne-ameriques/).
#  Le nom du fichier donne l'adresse de l'exposition sur le site :
