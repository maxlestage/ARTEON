#  EXPOSITION « INSTRUMENTS DE MUSIQUE DU MONDE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/instruments-musique/).
#  Le nom du fichier donne l'adresse de l'exposition sur le site :
#  /instruments-musique.
#
#  Les instruments sont présentés en vitrine (cadre = "vitrine"). Les
#  photographies viennent des musées qui les conservent (Metropolitan Museum of
#  Art, Cleveland Museum of Art), publiées en CC0 (domaine public).
