#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 67
nom_court = "Instruments de musique"
mouvement = "Instruments de musique du monde"
cadre = "vitrine"
couleur = "#7d4320"
titre = "Instruments de musique du monde, l'art de faire chanter le bois"
artiste = "Todini, Cristofori, Amati, Stradivari, Manol, les Gotō, les griots…"
dates = "vers 1560–1928"
accroche = "Exposition virtuelle · Metropolitan Museum of Art, New York"
introduction = """
Un instrument de musique est un outil, mais aussi une sculpture, un objet de prestige \
et la mémoire d'une culture. La visite réunit dix instruments à cordes, du violon de la \
Renaissance à la harpe d'Afrique centrale : un clavecin doré de la Rome baroque, le \
plus ancien piano conservé, deux violons de Crémone, une guitare de Cadix, un ūd \
d'Istanbul, une vina de l'Inde du Sud, un koto japonais, une kora et une harpe \
d'Afrique. Le bâtiment s'inspire des galeries des instruments de musique du \
Metropolitan Museum de New York : un salon d'entrée pour les claviers, une galerie \
centrale pour les violons, et trois salles ouvertes sur le reste du monde."""
vitrine = "clavecin-todini.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Galeries André Mertens des instruments de musique, Metropolitan Museum of Art"
ville = "New York, États-Unis"
construction = "Galeries rénovées et rouvertes en 2018 et 2019"
presentation = """
Fondé en 1870 et installé depuis 1880 au bord de Central Park, le Metropolitan Museum \
of Art possède l'une des grandes collections d'instruments de musique du monde. Elle \
doit presque tout à une femme, Mary Elizabeth Adams Brown, épouse du banquier John \
Crosby Brown : à la fin du XIXe siècle, elle réunit plus de trois mille six cents \
instruments venus de tous les continents, et en fait don au musée à partir de 1889. Les \
galeries qui les présentent portent le nom d'André Mertens. Fermées pour une longue \
rénovation, elles ont rouvert par étapes à partir de mars 2018, la dernière salle en \
2019. L'exposition « The Art of Music » y montre environ huit cents objets couvrant \
quatre mille ans, rangés par époques, pour faire voir les échanges entre les cultures. \
On y voit le plus ancien piano du monde, des violons de Stradivari, un mur de \
soixante-quatorze cuivres disposés autour d'une conque, et des enregistrements \
permettent d'entendre jouer les instruments exposés."""
ici = """
Le bâtiment d'ARTEON reprend l'idée d'une suite de salles intimes, aux murs chauds, où \
chaque instrument a sa vitrine. On entre par le sud dans « Le salon doré », haut de \
sept mètres, réservé aux deux claviers italiens. Au nord, la galerie « Crémone, l'âge \
d'or du violon » distribue tout le reste : à l'ouest « De Cadix à Istanbul », pour la \
guitare et l'ūd ; à l'est « De l'Inde au Japon », pour la vina et le koto ; au nord, \
enfin, « Afrique, la kora et la harpe »."""

