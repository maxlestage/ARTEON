# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Bodhisattva Maitreya debout"
artiste = "Gandhara, époque kouchane"
annee = "vers le IIIᵉ siècle"
image = "maitreya-gandhara.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DP123372.jpg"
technique = "Schiste gris, 163,2 × 53,3 × 20,3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Le Bouddha de l'avenir, en prince indien drapé comme un Romain : l'art du Gandhara est né de la rencontre de l'Inde et du monde grec."
description = """
Un jeune homme se tient debout, grandeur nature, devant un large disque de pierre \
qui forme son auréole. Ses cheveux ondulés tombent en boucles sur les épaules et \
sont noués au sommet du crâne en un chignon à double boucle. Il porte une fine \
moustache relevée aux pointes. Torse en partie nu, il est paré de bijoux : colliers \
superposés, cordon garni d'amulettes en travers de la poitrine, bracelets et \
brassard. Une étoffe drapée passe sur son épaule gauche et retombe en une large \
écharpe en arc devant ses cuisses ; une longue jupe plissée descend jusqu'aux \
chevilles. Ses pieds sont chaussés de sandales à lanières. L'avant-bras droit, qui \
se levait, a disparu. Sur le socle, de petits personnages en prière entourent un \
objet posé au centre."""
evocation = """
Maitreya est le Bouddha à venir : selon la tradition bouddhique, il attend au ciel \
le moment de renaître sur terre pour enseigner à nouveau, quand l'enseignement du \
Bouddha historique aura été oublié. Avant cette dernière naissance, il est un \
bodhisattva, un être d'Éveil qui a choisi de rester parmi les hommes pour les aider. \
C'est pourquoi le sculpteur le montre en prince, avec les bijoux et la moustache \
des nobles de son temps, et non en moine au crâne ras. Le chignon à boucles et la \
petite fiole à eau, que la main gauche semble encore serrer, sont ses attributs \
habituels. On a souvent souligné la ressemblance de ce visage et de ce drapé avec \
les statues romaines : un dieu indien vêtu à l'antique."""
histoire = """
Le Gandhara s'étend autour de Peshawar, dans le nord-ouest de l'actuel Pakistan. \
Après le passage d'Alexandre le Grand, des royaumes grecs y ont régné, et la région \
est devenue, sous l'empire kouchan, un carrefour entre l'Inde, l'Iran, l'Asie \
centrale et le monde romain. Les monastères bouddhiques s'y couvrent de statues et \
de reliefs taillés dans le schiste local. Cette statue se dressait sans doute dans \
l'un de ces sanctuaires, au pied d'un stupa ou dans une chapelle. On ignore son lieu \
de découverte exact. Elle est entrée au Metropolitan Museum of Art en 1991, achetée \
grâce à un don du Lita Annenberg Hazen Charitable Trust."""
facture = """
Le schiste gris, roche fine et dense, se prête aux détails : le sculpteur a pu y \
creuser les plis serrés de l'étoffe, les mèches de la chevelure et les maillons \
des colliers. Le drapé, qui suit le corps et retombe en plis lourds et réguliers, \
vient de la sculpture gréco-romaine, de même que la légère flexion d'une jambe qui \
anime la pose. La statue était sculptée pour être vue de face, adossée à un mur : \
l'auréole et le dos restent plus sommaires. À l'origine, la pierre était peut-être \
rehaussée de couleurs ou de dorure."""
details = [
  "La moustache fine aux pointes relevées, comme celle d'un prince.",
  "Le cordon d'amulettes qui barre la poitrine en diagonale.",
  "L'écharpe tombant en arc devant les cuisses, aux plis réguliers.",
  "Les sandales à lanières, nouées entre les orteils.",
  "Les petits fidèles en prière sculptés sur le socle.",
]
themes = ["bouddhisme", "bodhisattva", "gandhara", "influence grecque", "drapé"]
anecdote = """
Les deux Bouddhas géants de Bamiyan, en Afghanistan, hauts de 38 et de 55 mètres, \
appartenaient au monde bouddhique héritier du Gandhara. Ils ont été détruits à \
l'explosif par les talibans en mars 2001."""
salle = 2
mur = "ouest"
place = 3
largeur = 0.8

[[oeuvres]]
titre = "Bouddha debout offrant sa protection"
artiste = "Inde du Nord, époque gupta"
annee = "fin du Vᵉ siècle"
image = "bouddha-mathura.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT237.jpg"
technique = "Grès rouge, 85,5 × 42,5 × 16,5 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Sculpté à Mathura, ce Bouddha au corps enveloppé de plis fins incarne le modèle classique que l'Asie entière a imité."
description = """
Le Bouddha se tient debout, de face, le corps droit et calme. Sa tête est couverte \
de petites boucles en coquille d'escargot, surmontées d'une protubérance arrondie. \
Ses paupières sont baissées, ses lobes d'oreilles allongés, et son visage plein \
reste parfaitement serein. Il porte une robe monastique si fine qu'elle semble \
mouillée : elle colle au corps, laisse deviner les épaules, le ventre et les jambes, \
et n'est marquée que par des plis en forme de cordelettes, qui descendent en \
guirlandes régulières sur toute la figure. Sa main gauche retient le bord de \
l'étoffe ; la droite, qui se levait paume ouverte, est brisée. Derrière la tête, \
un fragment de l'auréole conserve un décor de feuillages finement ciselé."""
evocation = """
Le geste perdu de la main droite, paume tournée vers le fidèle, est l'abhaya-mudra, \
le geste qui rassure : « n'aie pas peur ». La statue ne raconte aucune histoire ; \
elle montre un être parvenu à l'Éveil, détaché du monde, dont le corps parfait et \
lisse dit la paix intérieure. Les textes indiens énumèrent les marques physiques \
d'un être d'exception, comme la protubérance du crâne ou les lobes allongés, que \
le sculpteur respecte. Sous les Gupta, ces signes se fondent dans une image d'une \
grande douceur, qui a longtemps été considérée comme l'expression classique du \
Bouddha. Les pèlerins venus de Chine et d'Asie du Sud-Est en ont rapporté des \
copies, et ce modèle a été imité de Java à la Thaïlande."""
histoire = """
La dynastie gupta règne sur le nord de l'Inde à partir du IVᵉ siècle ; cette période \
est souvent appelée l'âge classique de l'art indien. Deux grands ateliers de \
sculpture bouddhique dominent alors : Sarnath, près de Bénarès, où le Bouddha a \
prononcé son premier sermon, et Mathura, sur la Yamuna, au sud de Delhi. Mathura \
travaille un grès rouge tacheté de clair, extrait des carrières voisines, et produit \
depuis des siècles des statues pour toute l'Inde du Nord. Cette figure provient de \
cet atelier ; elle se dressait sans doute dans un monastère. Le Metropolitan Museum \
of Art l'a achetée en 1979, grâce à un don d'Enid A. Haupt."""
facture = """
Le sculpteur a obtenu l'effet d'étoffe mouillée en traitant la robe comme une \
seconde peau, sur laquelle il a posé, en très faible relief, des plis en arêtes \
parallèles. Le volume du corps, simplifié et arrondi, n'est pas musclé : il est \
pensé comme une forme idéale plutôt que comme un corps observé. Le grès rouge de \
Mathura, assez tendre, permet ce modelé lisse et les ciselures de l'auréole. La \
statue, adossée à une stèle, était faite pour être vue de face."""
details = [
  "Les plis de la robe en fines cordelettes, qui descendent en guirlandes.",
  "Les petites boucles de la chevelure, tournées comme des coquilles.",
  "La main gauche qui pince le bord de l'étoffe à hauteur de hanche.",
  "Le fragment d'auréole, en haut à gauche, orné de rinceaux de feuillage.",
  "Les taches claires du grès rouge, propres aux carrières de Mathura.",
]
themes = ["bouddhisme", "âge classique", "sérénité", "grès rouge", "gupta"]
anecdote = """
Le plus grand Bouddha de métal de cette époque, haut de plus de deux mètres, a été \
découvert en 1861 par des ingénieurs qui construisaient une voie ferrée à \
Sultanganj, dans le Bihar. Il est aujourd'hui conservé au musée de Birmingham, en \
Angleterre."""
salle = 2
mur = "est"
place = 1
largeur = 1.0

[[oeuvres]]
titre = "Nataraja, Shiva roi de la danse"
artiste = "Inde du Sud, époque chola"
annee = "XIᵉ siècle"
image = "nataraja.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1930.331.jpg"
technique = "Bronze, 113 × 102 × 30 cm"
collection = "Cleveland Museum of Art"
note = "Shiva danse dans un cercle de flammes pour détruire et recréer l'univers : l'image la plus célèbre de l'art indien."
description = """
Dans un grand anneau hérissé de flammes, un dieu à quatre bras danse sur une seule \
jambe. Sa jambe droite, légèrement fléchie, écrase un petit personnage allongé sur \
le socle ; la gauche se lève et se tend vers la droite, en travers du corps. Les \
deux bras supérieurs s'écartent : la main droite tient un petit tambour en forme de \
sablier, la gauche une flamme. La main inférieure droite se lève, paume ouverte ; le \
bras inférieur gauche passe devant la poitrine, la main pendante pointée vers le \
pied levé. Le dieu porte une haute coiffe en éventail, des boucles d'oreilles, des \
colliers et des anneaux aux chevilles. Son visage reste calme, presque souriant. Le \
socle en forme de lotus est percé de deux trous."""
evocation = """
Pour les fidèles de Shiva, le temps est cyclique : le monde naît, dure, est détruit \
puis recréé sans fin, et c'est la danse du dieu qui en donne le rythme. Le tambour \
marque le battement de la création, la flamme annonce la destruction, et l'anneau \
de feu figure l'univers. La main levée dit au fidèle de ne pas craindre ; celle qui \
pointe le pied soulevé lui montre le chemin de la délivrance. Le nain écrasé incarne \
l'ignorance, ou l'oubli de soi, que la danse vainc. Cette danse est associée au \
temple de Chidambaram, en pays tamoul, où Shiva est vénéré sous ce nom. L'équilibre \
parfait de la figure, à la fois tourbillon et immobilité, a fait de Nataraja un \
symbole de l'Inde."""
histoire = """
Du IXᵉ au XIIIᵉ siècle, la dynastie chola domine le sud de l'Inde depuis le pays \
tamoul. Ses rois couvrent leur royaume de temples de pierre et font fondre, pour \
ces sanctuaires, des statues de bronze destinées aux processions : lors des fêtes, \
on les habille de soieries, on les couvre de fleurs et de bijoux et on les promène \
dans les rues. Les trous du socle servaient à fixer les brancards. Cette statue a \
été vendue en 1930 au Cleveland Museum of Art par le marchand C. T. Loo, établi à \
Paris et à New York ; on ne sait pas de quel temple elle provient. Elle reste \
l'une des œuvres les plus admirées du musée."""
facture = """
Les bronzes chola sont fondus à la cire perdue : le modèle, sculpté dans la cire, \
est enrobé d'argile, puis chauffé ; la cire s'écoule et le métal en fusion prend sa \
place. Le moule étant brisé pour libérer la statue, chaque pièce est unique. Le \
sculpteur reprend ensuite au burin les détails des bijoux et du visage. Des traités \
fixent les proportions du corps, mais les meilleurs artisans y ajoutent souplesse et \
élan. Ici, toute la composition s'inscrit dans le cercle, autour de l'axe vertical \
de la jambe d'appui."""
details = [
  "Le petit tambour en sablier, dans la main droite levée.",
  "La flamme posée dans la paume gauche, comme une offrande.",
  "Le nain de l'ignorance, sous le pied droit, qui lève la tête vers le dieu.",
  "Les flammèches régulières qui hérissent l'anneau de feu.",
  "Les deux trous du socle, où passaient les brancards de procession.",
]
themes = ["hindouisme", "shiva", "danse", "cosmos", "bronze", "procession"]
anecdote = """
En 2004, l'Inde a offert au CERN, le grand laboratoire européen de physique des \
particules près de Genève, une statue de Shiva Nataraja haute de deux mètres : elle \
évoque la danse de la matière et de l'énergie."""
salle = 2
mur = "nord"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Tête de Bouddha du Borobudur"
artiste = "Java, dynastie Shailendra"
annee = "début du IXᵉ siècle"
image = "tete-bouddha-borobudur.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1942.1087.jpg"
technique = "Pierre volcanique (andésite), haut. 30,6 cm"
collection = "Cleveland Museum of Art"
note = "L'une des centaines de têtes de Bouddha du plus grand monument bouddhique du monde, au cœur de Java. Elle mesure 31 cm de haut."
description = """
Une tête de Bouddha, seule, repose sur un socle moderne. La pierre est grise et \
poreuse, criblée de minuscules trous. Les cheveux sont faits de grosses boucles \
rondes, enroulées en spirale et alignées en rangs serrés, qui couvrent aussi la \
protubérance au sommet du crâne. Le visage est large et plein, aux joues rondes. Les \
paupières, lourdes, sont presque closes, et le regard filtre vers le bas. Les \
sourcils dessinent deux arcs nets qui rejoignent l'arête du nez. La bouche, aux \
lèvres charnues, esquisse un sourire à peine perceptible. Les lobes des oreilles, \
très allongés, descendent jusqu'à la mâchoire. La tête a été détachée au niveau du \
cou de la statue à laquelle elle appartenait."""
evocation = """
Le visage n'exprime aucune émotion particulière, mais un état : la paix intérieure \
de celui qui a atteint l'Éveil. Les paupières baissées tournent le regard vers \
l'intérieur, vers la méditation. Les longs lobes rappellent que le Bouddha, né \
prince, portait autrefois de lourds bijoux d'oreilles, auxquels il a renoncé. Au \
Borobudur, les statues de Bouddha étaient placées dans des niches et dans des \
stupas ajourés, le long d'un parcours qui mène le pèlerin, terrasse après terrasse, \
du monde des désirs vers le sommet, image de l'Éveil. Ce visage était l'un des \
points d'arrivée de cette ascension. Détaché du monument, il témoigne aussi de \
l'histoire de sa dispersion."""
histoire = """
Le Borobudur est élevé vers 800, dans le centre de Java, sous la dynastie bouddhique \
des Shailendra. Abandonné après quelques siècles, envahi par la végétation et la \
cendre volcanique, il est dégagé à partir de 1814 sur l'ordre du gouverneur \
britannique de Java, Thomas Stamford Raffles. Au XIXᵉ siècle et au début du XXᵉ, \
sous l'administration coloniale néerlandaise, des centaines de têtes de Bouddha \
sont prélevées ou volées et dispersées dans le monde. Celle-ci a été vendue en 1942 \
au Cleveland Museum of Art par le marchand Raphaël Stora, de New York. Le monument, \
restauré de 1907 à 1911 puis, avec l'Unesco, de 1975 à 1982, est inscrit au \
patrimoine mondial depuis 1991."""
facture = """
L'andésite, une roche volcanique abondante à Java, est rugueuse et pleine de \
bulles : elle interdit le poli et les détails trop fins. Le sculpteur a donc \
travaillé par grandes masses simples, le globe du crâne, l'ovale du visage, les arcs \
des sourcils, et a laissé la lumière jouer sur les boucles en relief. À l'origine, \
la pierre était sans doute couverte d'un enduit peint, aujourd'hui disparu. Les \
centaines de statues du monument ont été taillées selon un même modèle, par des \
équipes de sculpteurs."""
details = [
  "Les boucles rondes de la chevelure, toutes enroulées dans le même sens.",
  "Les petits trous de la pierre volcanique, visibles sur les joues.",
  "Les paupières lourdes, qui ne laissent voir qu'une fente.",
  "Les lobes d'oreilles allongés jusqu'à la mâchoire.",
]
themes = ["bouddhisme", "java", "méditation", "pierre volcanique", "patrimoine dispersé"]
anecdote = """
En 1896, lors de la visite du roi de Siam Chulalongkorn à Java, l'administration \
coloniale néerlandaise lui offrit plusieurs chariots de sculptures prises au \
Borobudur. Elles sont toujours conservées au Musée national de Bangkok."""
salle = 3
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Buste d'Hevajra"
artiste = "Empire khmer, style du Bayon"
annee = "fin du XIIᵉ – début du XIIIᵉ siècle"
image = "buste-hevajra.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT5215.jpg"
technique = "Grès, 132,1 × 73,7 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Un dieu aux visages étagés, souriant comme les tours du Bayon : le bouddhisme d'Angkor sous le roi Jayavarman VII."
description = """
Il ne reste de cette grande statue que le haut du corps et les têtes. Au premier \
rang, un visage large, aux yeux mi-clos, sourit doucement ; deux autres visages, \
vus de profil, le prolongent sur les côtés, de sorte que le dieu regarde dans trois \
directions. Au-dessus, un second étage répète la même disposition : un visage de \
face, plus petit, encadré de deux profils. Le visage principal porte un bandeau sur \
le front et de longues boucles d'oreilles pendantes. Les épaules sont larges, mais \
les bras ont disparu ; il n'en reste qu'un moignon, à gauche, et une grande cassure \
creuse la poitrine. La pierre, grise et granuleuse, est usée par le temps."""
evocation = """
Hevajra est une divinité du bouddhisme tantrique, une forme du Vajrayana venue de \
l'Inde du Nord-Est. Ses textes le décrivent avec huit têtes et seize bras, dansant, \
tenant dans chaque main une coupe faite d'un crâne : une figure terrible, qui \
détruit les illusions et les passions. Les sculpteurs khmers en ont pourtant fait \
une image apaisée, aux visages souriants. Ces faces multiples, qui regardent dans \
toutes les directions, rappellent les tours à visages du Bayon, le temple bâti au \
centre d'Angkor Thom par Jayavarman VII. On y a vu l'image d'une compassion qui \
veille sur tout le royaume. Hevajra semble avoir été très vénéré dans l'empire \
khmer à cette époque."""
histoire = """
L'empire khmer domine du IXᵉ au XVᵉ siècle une grande partie de l'Asie du Sud-Est \
continentale, depuis sa capitale, Angkor, au nord-ouest de l'actuel Cambodge. À la \
fin du XIIᵉ siècle, le roi Jayavarman VII, bouddhiste, reconstruit la ville après \
une guerre contre le Champa, fonde Angkor Thom, élève le Bayon et couvre son \
royaume de temples, d'hôpitaux et de gîtes d'étape. Ce buste date de son règne ou \
de celui de ses successeurs immédiats. Il est entré au Metropolitan Museum of Art \
en 1936. En 2023, le Met a annoncé la restitution au Cambodge et à la Thaïlande de \
seize sculptures liées au marchand Douglas Latchford, accusé de trafic ; ce buste, \
acquis bien plus tôt, n'en faisait pas partie."""
facture = """
La statue est taillée dans le grès, la pierre de presque tous les temples \
d'Angkor. Le style du Bayon se reconnaît à ses visages larges, aux yeux baissés, \
aux lèvres épaisses étirées en un léger sourire. Ici, les têtes sont superposées en \
étages qui s'inscrivent dans une silhouette pyramidale. Le sculpteur a \
répété le même visage en variant seulement l'orientation, ce qui donne à l'ensemble \
une grande unité. Les bijoux sont sculptés en faible relief, sans creuser la masse \
de la pierre."""
details = [
  "Le léger sourire des lèvres, commun à tous les visages.",
  "Les visages de profil, de chaque côté, qui regardent vers les côtés.",
  "Le second étage de visages, plus petits, au-dessus du premier.",
  "Les longues boucles d'oreilles en pendentif du visage principal.",
  "La grande cassure de la poitrine et le moignon du bras, à gauche.",
]
themes = ["bouddhisme", "angkor", "sourire", "khmer", "visages"]
anecdote = """
Le Bayon, au centre d'Angkor Thom, porte sur ses tours plus de deux cents visages \
géants sculptés dans la pierre. Beaucoup d'historiens pensent qu'ils mêlent les \
traits d'un bodhisattva et ceux du roi Jayavarman VII lui-même."""
salle = 3
mur = "nord"
place = 5
largeur = 1.2

[[oeuvres]]
titre = "Bouddha assis sur un double lotus"
artiste = "Birmanie, royaume de Pagan"
annee = "fin du XIᵉ siècle"
image = "bouddha-pagan.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT5633.jpg"
technique = "Bronze incrusté d'argent et de cuivre, 23,5 × 18,4 × 12,4 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Un petit bronze de Pagan, la ville aux milliers de temples, au moment où la Birmanie adopte le bouddhisme theravada. Il mesure 23,5 cm."
description = """
Le Bouddha est assis jambes croisées, la plante des pieds tournée vers le ciel, sur \
un socle formé de deux rangées de pétales de lotus, les uns tournés vers le haut, \
les autres vers le bas. Sa main gauche repose, paume ouverte, dans son giron ; la \
droite descend sur le genou, les doigts effleurant le sol. Sa robe monastique, \
moulante, laisse l'épaule droite nue ; un pan d'étoffe plié tombe sur l'épaule \
gauche jusqu'à la taille. La tête, couverte de petites boucles, porte au sommet une \
protubérance terminée par un bouton. Le visage est rond et paisible, les yeux \
baissés. Le métal, de teinte dorée, est resté lisse et brillant."""
evocation = """
Le geste de la main droite est l'un des plus importants de l'art bouddhique : on \
l'appelle « prise de la terre à témoin ». Selon le récit traditionnel, au moment \
où le Bouddha, assis sous l'arbre de Bodh-Gaya, allait atteindre l'Éveil, le démon \
Mara contesta son droit à y parvenir ; le Bouddha toucha alors la terre, qui \
témoigna en sa faveur, et Mara s'enfuit. La statue représente donc l'instant même \
de l'Éveil. Ce thème venu des grands centres bouddhiques de l'Inde du Nord-Est est \
devenu, à Pagan puis dans toute la Birmanie, l'image la plus répandue du Bouddha."""
histoire = """
Au XIᵉ siècle, le roi Anawrahta unifie autour de Pagan, sur l'Irrawaddy, la \
première grande monarchie birmane, et favorise le bouddhisme theravada. Pendant deux \
siècles et demi, les rois et les fidèles de Pagan bâtissent des milliers de temples \
et de stupas de brique, ornés de peintures murales et peuplés de statues. Les \
moines et les pèlerins voyagent entre Pagan, Bodh-Gaya et Sri Lanka, ce qui \
explique l'influence de l'art indien sur ce bronze. Le royaume décline après les \
invasions mongoles de la fin du XIIIᵉ siècle. Ce Bouddha est entré au Metropolitan \
Museum of Art en 2003."""
facture = """
La statuette est fondue en bronze à la cire perdue, puis ciselée. Selon la \
description du musée, elle est incrustée d'argent et de cuivre : de minces filets \
de métal de couleur différente étaient encastrés dans le bronze pour souligner \
certains détails, une technique raffinée réservée aux pièces de qualité. Les \
proportions, les épaules larges, la taille fine et le visage rond, suivent les \
modèles de l'Inde de l'Est sous la dynastie Pala, que les artisans birmans \
connaissaient bien."""
details = [
  "Les doigts de la main droite qui effleurent le sol, devant le genou.",
  "Le double rang de pétales de lotus du socle, ouverts vers le haut et vers le bas.",
  "Le pan d'étoffe plié qui tombe sur l'épaule gauche.",
  "Le petit bouton qui termine la protubérance du crâne.",
]
themes = ["bouddhisme", "birmanie", "éveil", "bronze", "lotus"]
anecdote = """
Dans la plaine de Pagan, plus de deux mille temples et stupas de brique, bâtis entre \
le XIᵉ et le XIIIᵉ siècle, sont encore debout. Le site a été inscrit au patrimoine \
mondial de l'Unesco en 2019."""
salle = 3
mur = "sud"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Bouddha assis prenant la terre à témoin"
artiste = "Thaïlande, héritage de Sukhothai"
annee = "fin du XVᵉ – XVIᵉ siècle"
image = "bouddha-thailande.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT8728.jpg"
technique = "Bronze, 49,5 × 31,7 × 19,1 cm"
collection = "Metropolitan Museum of Art, New York"
note = "La flamme au sommet du crâne et la silhouette élancée viennent de Sukhothai, le premier grand royaume thaï."
description = """
Le Bouddha est assis jambes repliées, la jambe droite posée sur la gauche, sur un \
coussin bordé d'un rang de perles, lui-même porté par un socle massif. Sa main droite \
descend sur le genou, les doigts touchant presque le sol ; la gauche repose dans son \
giron. Le corps est mince et souple, les épaules larges, la taille étroite. Une fine \
robe moulante laisse nue l'épaule droite, et un long pan d'étoffe tombe de l'épaule \
gauche jusqu'au nombril. La tête, couverte de petites boucles pointues, se termine \
par une haute flamme. Le visage ovale, au nez aquilin et aux sourcils arqués, \
esquisse un sourire. Le bronze, sombre, garde des traces de vert-de-gris et de \
rouille."""
evocation = """
Comme le bronze de Pagan exposé à côté, ce Bouddha prend la terre à témoin : il \
représente l'instant où, sous l'arbre de l'Éveil, il triomphe de Mara. Mais l'image \
est ici plus aérienne. La flamme qui jaillit du sommet du crâne figure le rayonnement \
de sa sagesse ; elle est devenue un trait typique du Bouddha thaï. La silhouette \
fluide, presque sans muscles ni os, cherche à rendre un corps surnaturel, conforme \
aux comparaisons des textes : des bras comme une trompe d'éléphant, un menton comme \
un noyau de mangue. Pour les fidèles, ces statues sont des présences vivantes, que \
l'on vénère, que l'on habille et que l'on couvre de feuilles d'or."""
histoire = """
Au XIIIᵉ siècle, des princes thaïs fondent, au nord de la plaine centrale, le royaume \
de Sukhothai. Ses rois adoptent le bouddhisme theravada venu de Sri Lanka et font \
fondre des bronzes d'un style nouveau, élancé et serein. Au XVᵉ siècle, Sukhothai \
passe sous l'autorité du royaume d'Ayutthaya, plus au sud, mais ses statues restent \
le modèle des fondeurs pendant des siècles, à Ayutthaya comme dans le royaume du \
Lan Na, au nord. Ce Bouddha, fondu à la fin du XVᵉ ou au XVIᵉ siècle, appartient à \
cette descendance. Il a été donné au Metropolitan Museum of Art en 1981 par \
M. et Mme A. Richard Benedek."""
facture = """
La statue est fondue à la cire perdue en plusieurs parties, puis assemblée et \
ciselée. Les fondeurs thaïs ont cherché des courbes continues : la ligne qui va de \
l'épaule à la main posée sur le genou, ou celle du pan d'étoffe, se lit d'un seul \
trait. Les doigts, presque de même longueur, sont un trait du style de Sukhothai. \
Le bronze était sans doute doré à l'origine ; la patine actuelle, sombre et \
tachée de vert, est due au temps."""
details = [
  "La haute flamme qui jaillit du sommet du crâne.",
  "Les doigts de la main droite, presque tous de la même longueur.",
  "Le long pan d'étoffe qui tombe de l'épaule gauche au nombril.",
  "Le rang de perles qui borde le coussin sous les jambes.",
  "Les sourcils en arcs qui se rejoignent au-dessus du nez aquilin.",
]
themes = ["bouddhisme", "thaïlande", "éveil", "bronze", "flamme"]
anecdote = """
Le Bouddha d'or du Wat Traimit, à Bangkok, de style Sukhothai, pèse environ cinq \
tonnes et demie. Couvert de stuc pour le cacher, il passa des siècles pour une \
simple statue de plâtre, jusqu'à ce qu'en 1955 le stuc se fende lors d'un \
déménagement."""
salle = 3
mur = "sud"
place = 5
largeur = 0.9

[[oeuvres]]
titre = "Krishna et Radha dans un bosquet, page d'un Gita Govinda"
artiste = "Sahibdin"
annee = "vers 1665"
image = "krishna-radha-bosquet.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DP259542.jpg"
technique = "Encre et aquarelle opaque sur papier, 24,4 × 19,7 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Une nuit de printemps au bord de la Yamuna : la peinture de cour du Mewar illustre le grand poème d'amour de Krishna et de Radha."
description = """
La nuit est tombée sur une forêt : un croissant de lune brille dans un ciel bleu \
semé d'étoiles blanches. À gauche, sous une tonnelle de feuillage tendue d'un fond \
rouge et décorée de guirlandes de fleurs blanches, roses et orange, Krishna, à la \
peau bleue et coiffé d'une couronne, est assis sur un tapis auprès de Radha ; il \
lui touche tendrement le menton. Des vases d'or sont posés devant eux. Au centre, \
seule au milieu des arbres, une jeune femme vêtue d'une jupe jaune à carreaux et \
d'un voile rouge se tient debout, la main levée. À droite, des arbres aux \
feuillages stylisés, rouges, verts et jaunes, et des fleurs. En bas coule une \
rivière sombre, où éclosent des lotus."""
evocation = """
Le Gita Govinda, « le chant du bouvier », est un poème sanskrit écrit au XIIᵉ siècle \
par Jayadeva. Il raconte, au printemps, les amours de Krishna, dieu qui a grandi \
parmi les bouviers, et de Radha : la jalousie, la séparation, les messages portés \
par une confidente, puis les retrouvailles dans les bosquets au bord de la Yamuna. \
Pour les fidèles de Krishna, cet amour humain est aussi l'image de l'âme qui \
cherche Dieu. La jeune femme seule dans la forêt est sans doute la confidente, \
intermédiaire entre les amants. Le peintre fait de la nature entière, arbres en \
fleurs, lune et rivière, l'écho de leur passion, comme dans le poème."""
histoire = """
Le Mewar, dont la capitale est Udaipur, au Rajasthan, est l'un des plus anciens \
royaumes rajpoutes. Après la paix conclue avec l'empereur moghol Jahangir en 1615, \
ses souverains font travailler un atelier de peintres qui illustre les grands \
textes religieux et poétiques en séries de dizaines, voire de centaines de pages. \
Le Metropolitan Museum attribue cette page d'un Gita Govinda aujourd'hui dispersé \
à Sahibdin, le maître de cet atelier, documenté vers 1628–1655, et la date vers \
1665 ; une part de l'exécution pourrait revenir à ses élèves. Elle a été donnée au \
musée en 1988 par l'Ernest Erickson Foundation."""
facture = """
La peinture est faite d'aquarelle opaque, à base de pigments minéraux et végétaux \
liés à la gomme, posée en aplats sur un papier préparé puis poli. Les couleurs sont \
franches et juxtaposées sans ombres : rouge, jaune, vert, bleu de lapis. Les arbres \
sont des motifs répétés, presque des ornements, et les figures, vues de profil, \
ont le grand œil en amande du style du Mewar. Quelques rehauts d'or font briller \
les bijoux et la vaisselle. La bordure rouge et jaune encadre la scène comme une \
fenêtre."""
details = [
  "Le croissant de lune et les étoiles blanches piquées dans le ciel.",
  "Le geste de Krishna, qui soulève le menton de Radha.",
  "Les guirlandes de fleurs suspendues à la tonnelle.",
  "Les vases d'or posés sur le tapis devant le couple.",
  "Les lotus en bouton dans la rivière sombre, en bas à gauche.",
]
themes = ["krishna", "radha", "amour", "nuit", "poésie", "rajput"]
anecdote = """
Le Gita Govinda est depuis des siècles chanté dans le culte du temple de Jagannath, \
à Puri, en Odisha, et ses vers ont inspiré danseurs et musiciens de toute l'Inde, \
de l'odissi au chant dévotionnel."""
salle = 4
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Shiva et Parvati jouant au chaupar, page d'un Rasamanjari"
artiste = "Devidasa de Nurpur"
annee = "1694–1695"
image = "shiva-parvati-chaupar.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT5245.jpg"
technique = "Aquarelle opaque, encre, argent et or sur papier, 16,5 × 27,6 cm (image)"
collection = "Metropolitan Museum of Art, New York"
note = "Le dieu Shiva et son épouse se disputent une partie de dés : la peinture des collines du Pendjab, à Basohli, en couleurs brûlantes."
description = """
Sur un fond jaune vif uniforme, sous une mince bande de ciel blanc et bleu, Shiva et \
Parvati sont assis face à face sur une peau de tigre, dont on voit les griffes et, \
sous Shiva, la tête. Shiva, à la peau blanche de cendre striée de marques rouges, \
porte un chignon, un troisième œil au front, un serpent noué au cou et un long \
chapelet de graines. Il est assis jambes croisées et regarde son épouse. Parvati, \
en jupe rouge rayée et voile orange, lève la main droite comme pour faire valoir \
son point. Entre eux, le plateau du chaupar, en forme de croix, porte des pions \
coniques ; trois longs dés sont posés à côté. Deux arbres aux feuillages sombres \
encadrent la scène, au-dessus de collines brunes."""
evocation = """
Le Rasamanjari, « le bouquet de délices », est un traité poétique sanskrit de \
Bhanudatta qui classe les amoureux et surtout les héroïnes selon leur caractère et \
leur situation, chaque type étant illustré par un vers. Les peintres de Basohli en \
ont tiré des séries où les amants sont souvent des dieux. Ici, la partie de dés \
entre Shiva et Parvati, scène familière de la mythologie, devient une querelle \
d'amoureux : le jeu sert de prétexte aux taquineries, aux reproches et à la \
réconciliation. Le grand ascète, maître de la destruction, apparaît en mari \
attentif, et Parvati en héroïne avisée qui tient tête. Le fond jaune, sans \
profondeur, place cette dispute hors du temps."""
histoire = """
Basohli est une petite principauté des contreforts de l'Himalaya, au bord de la \
rivière Ravi, dans l'actuel territoire de Jammu. À la fin du XVIIᵉ siècle, ses \
rajas entretiennent des peintres qui créent un style audacieux, l'un des premiers \
de la peinture dite pahari, « des collines ». Selon son colophon, cette série du \
Rasamanjari a été peinte par Devidasa en 1694–1695. Comme beaucoup de séries \
indiennes, elle a été dispersée au XXᵉ siècle entre collectionneurs et musées. \
Cette page a été donnée au Metropolitan Museum of Art en 1957 par le docteur \
J. C. Burnett ; le musée la compte parmi les chefs-d'œuvre de sa collection \
indienne."""
facture = """
Le style de Basohli frappe par ses couleurs saturées, posées en larges aplats : \
jaune, rouge, brun, vert profond. Les figures, de profil, ont un œil immense, en \
forme de lotus, qui envahit le visage. Le peintre a mêlé à l'aquarelle opaque de \
l'argent et de l'or pour les bijoux ; dans les ateliers de Basohli, on collait \
aussi parfois des fragments d'ailes de scarabée pour imiter l'éclat des émeraudes. \
La large bordure rouge sombre, caractéristique de ces séries, isole la scène \
comme un tableau."""
details = [
  "La tête du tigre, sous Shiva, et ses griffes recourbées aux quatre coins.",
  "Le serpent noué autour du cou de Shiva.",
  "Les trois longs dés posés à côté du plateau en croix.",
  "La main levée de Parvati, paume ouverte, au centre du débat.",
  "Le grand œil en amande des deux personnages, typique de Basohli.",
]
themes = ["shiva", "parvati", "jeu", "couple", "pahari", "couleur"]
anecdote = """
Le chaupar, joué avec des pions sur un plateau en croix, est l'ancêtre du pachisi \
indien et des « petits chevaux ». On raconte que l'empereur moghol Akbar y jouait à \
Fatehpur Sikri sur un plateau géant dessiné dans la cour, avec des esclaves pour \
pions."""
salle = 4
mur = "nord"
place = 5
largeur = 1.3

[[oeuvres]]
titre = "Damayanti et le cygne (Hamsa Damayanti)"
artiste = "Raja Ravi Varma"
annee = "1899"
image = "hamsa-damayanti.jpg"
cadre = "dore"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Ravi_Varma-Princess_Damayanthi_talking_with_Royal_Swan_about_Nala.jpg"
technique = "Huile sur toile"
collection = "Sree Chitra Art Gallery, Thiruvananthapuram"
note = "Un cygne vient parler d'amour à une princesse : la mythologie indienne peinte à l'huile, à l'européenne, par le peintre le plus populaire de l'Inde."
description = """
Une jeune femme se tient debout sur les marches d'une terrasse de marbre, au bord \
d'un bassin. Elle porte un sari rouge à bordure dorée, drapé à la manière du \
Maharashtra, et un corsage rose ; une fleur est piquée dans ses cheveux noirs, des \
perles ornent son cou et ses oreilles, des bracelets ses poignets. Accoudée à une \
balustrade, la joue posée sur la main, elle écoute, rêveuse. Devant elle, sur le \
sommet d'un pilier octogonal couvert de feuilles de lotus, un cygne blanc tourne la \
tête vers elle, comme s'il lui parlait. Derrière, une colonne cannelée, un mur \
rouge et un parc aux arbres sombres ; en bas à droite, des lotus roses éclosent \
dans l'eau. La signature et la date sont inscrites en bas à gauche."""
evocation = """
L'histoire de Nala et Damayanti est racontée dans le Mahabharata. Nala, roi du \
Nishadha, capture un cygne merveilleux qui, en échange de sa liberté, promet de \
vanter ses mérites à la princesse Damayanti, de Vidarbha. Le peintre montre le \
moment où l'oiseau lui parle de Nala : sans l'avoir jamais vu, elle tombe amoureuse. \
Ravi Varma choisit l'instant intime, la rêverie, plutôt que l'action. Pour les \
Indiens de son temps, voir les héroïnes des épopées sous les traits de femmes de \
leur époque, en sari, dans un décor de palais, était une nouveauté saisissante : \
leurs dieux et leurs héros devenaient proches, presque familiers."""
histoire = """
Ravi Varma peint ce tableau en 1899, au faîte de sa célébrité, alors qu'il \
travaille pour les maharajas de Travancore, de Baroda et de Mysore et que sa presse \
lithographique diffuse ses compositions dans tout le pays. Le sujet de Damayanti et \
du cygne fait partie de ses plus grands succès : il en existe des reproductions en \
chromolithographie qui ont décoré d'innombrables maisons. Le tableau est conservé à \
la Sree Chitra Art Gallery de Thiruvananthapuram, au Kerala, ouverte en 1935 dans \
l'ancienne capitale du royaume de Travancore, et qui réunit un important ensemble \
d'œuvres du peintre."""
facture = """
Ravi Varma est l'un des premiers peintres indiens à maîtriser pleinement la \
peinture à l'huile européenne, avec ses glacis, son modelé par l'ombre et la \
lumière et sa perspective. Il rend avec virtuosité les matières : la soie du sari, \
son liseré doré, le marbre, les plumes du cygne. Le grand format vertical, la \
figure presque grandeur nature et le décor d'architecture classique rappellent la \
peinture académique de l'Europe victorienne. La lumière douce, venue de la gauche, \
modèle le visage et le bras de la jeune femme."""
details = [
  "Le geste de Damayanti, la joue posée sur la main, perdue dans ses pensées.",
  "Le bec orange du cygne tourné vers la princesse.",
  "Le liseré doré du sari rouge, qui accroche la lumière.",
  "Les lotus roses en bouton dans l'eau, en bas à droite.",
  "La signature, Ravi Varma, et la date de 1899, en bas à gauche.",
]
themes = ["mahabharata", "amour", "cygne", "princesse", "peinture à l'huile"]
anecdote = """
Plus tard, lors du choix de son époux, Damayanti voit cinq Nala identiques : quatre \
dieux ont pris son apparence. Elle reconnaît le vrai à ce qu'il transpire, cligne \
des yeux et que ses pieds touchent le sol, alors que les dieux, eux, en sont \
incapables."""
salle = 4
mur = "est"
place = 2
largeur = 1.1

