[exposition]
ordre = 26
nom_court = "Inde et Asie du Sud-Est"
mouvement = "Inde et Asie du Sud-Est"
cadre = "vitrine"
couleur = "#9a4a1c"
titre = "Dieux, bouddhas et princes : l'art de l'Inde et de l'Asie du Sud-Est"
artiste = "Gandhara, Gupta, Chola, Java, Angkor, Pagan, Rajputs, Ravi Varma…"
dates = "IIIᵉ siècle – 1899"
accroche = "Exposition virtuelle · Chhatrapati Shivaji Maharaj Vastu Sangrahalaya, Bombay"
introduction = """
Seize siècles d'art nés en Inde et portés, avec le bouddhisme et l'hindouisme, \
jusqu'à Java, au Cambodge, en Birmanie et en Thaïlande. On y croise un bodhisattva \
du Gandhara drapé à la grecque, un Bouddha gupta en grès rouge, Shiva dansant dans \
son cercle de flammes, une tête du Borobudur et un dieu aux visages étagés d'Angkor, \
puis des pages peintes pour les cours rajpoutes et un tableau de Raja Ravi Varma. \
Le bâtiment s'inspire du musée Chhatrapati Shivaji Maharaj de Bombay : on franchit \
un porche, on entre sous une haute coupole, et deux ailes s'ouvrent de part et \
d'autre, l'une pour la sculpture de l'Asie du Sud-Est, l'autre pour la peinture."""
vitrine = "nataraja.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Chhatrapati Shivaji Maharaj Vastu Sangrahalaya (ancien Prince of Wales Museum)"
ville = "Bombay (Mumbai), Inde"
architecte = "George Wittet"
construction = "1905–1922"
presentation = """
Au début du XXᵉ siècle, des notables de Bombay décident de fonder un musée en \
souvenir de la visite du prince de Galles, le futur George V, qui en pose la \
première pierre en novembre 1905. L'architecte écossais George Wittet, qui dessinera \
aussi la Porte de l'Inde sur le port, conçoit un édifice de style indo-sarrasin : \
murs de basalte gris et de pierre claire, balcons et arcs empruntés à l'architecture \
moghole et aux palais de l'Inde de l'Ouest, et, au centre, une grande coupole. \
Achevé pendant la Première Guerre mondiale, le bâtiment sert d'abord d'hôpital \
militaire et n'ouvre au public qu'en 1922. Il reçoit en 1998 le nom de Chhatrapati \
Shivaji Maharaj, fondateur du royaume marathe au XVIIᵉ siècle. Entouré d'un jardin, \
le musée réunit aujourd'hui des dizaines de milliers d'objets : sculptures de l'Inde \
ancienne, bronzes, miniatures, armes, textiles et collections d'histoire \
naturelle."""
ici = """
Le bâtiment d'ARTEON reprend la composition du musée de Bombay : un porche, une haute \
salle centrale sous la coupole et deux ailes symétriques. On entre par le sud dans \
le Porche, aux murs de pierre claire, puis dans la Salle de la coupole, carrée, haute \
de seize mètres, où le Shiva dansant fait face au visiteur entre le bodhisattva du \
Gandhara et le Bouddha gupta. À l'ouest, la Galerie de l'Asie du Sud-Est, longue de \
vingt mètres et couleur de sable, réunit Java, Angkor, Pagan et la Thaïlande ; à \
l'est, la Galerie des peintures, d'un rose terracotta, présente les cours rajpoutes \
et Ravi Varma."""

