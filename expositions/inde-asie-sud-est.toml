[[artistes]]
nom = "Gandhara, époque kouchane"
vie = "Gandhara (nord-ouest du Pakistan et est de l'Afghanistan actuels), Iᵉʳ–Vᵉ siècle"
biographie = """
Le Gandhara est une région de vallées fertiles autour de Peshawar, au débouché des \
routes qui relient l'Inde à l'Asie centrale et à l'Iran. Conquise par Alexandre le \
Grand en 327–326 avant notre ère, elle reste ensuite gouvernée par des rois grecs, \
puis par des dynasties venues des steppes. Aux premiers siècles de notre ère, elle \
appartient à l'empire kouchan, qui s'étend de l'Asie centrale à la vallée du Gange \
et dont le roi Kanishka, au IIᵉ siècle, protège le bouddhisme. Les monastères et \
les stupas se multiplient dans la région, à Taxila, dans la vallée de Swat, autour \
de Peshawar. Les sculpteurs y fabriquent par milliers des statues et des reliefs \
de schiste gris, puis de stuc, qui racontent la vie du Bouddha. C'est là, comme à \
Mathura, qu'apparaissent vers le Iᵉʳ siècle les premières images du Bouddha sous \
forme humaine, alors qu'on ne le figurait auparavant que par des symboles. Cet art \
décline avec les invasions des Huns au Vᵉ siècle, mais ses modèles se transmettent \
par les routes de la soie jusqu'en Chine et au Japon."""
style = """
L'art du Gandhara mêle les sujets bouddhiques indiens aux formes de l'art \
gréco-romain : visages au profil droit, cheveux ondulés, drapés aux plis profonds \
qui rappellent la toge, poses légèrement déhanchées. Les bodhisattvas y portent les \
bijoux et la moustache des princes kouchans. Cette synthèse a donné à l'Asie l'un \
de ses premiers modèles du Bouddha."""

[[artistes]]
nom = "Inde du Nord, époque gupta"
vie = "Nord de l'Inde, vers 320 – milieu du VIᵉ siècle"
biographie = """
La dynastie gupta est fondée vers 320 par Chandragupta Iᵉʳ, dans la vallée du \
Gange. Ses successeurs, Samudragupta puis Chandragupta II, étendent leur empire sur \
la plus grande partie du nord de l'Inde, autour de capitales comme Pataliputra, \
l'actuelle Patna. Les Gupta sont hindous, mais protègent aussi les monastères \
bouddhiques et jaïns. Leur époque est restée dans les mémoires comme un âge d'or : \
la littérature sanskrite y brille avec le poète et dramaturge Kalidasa, que la \
tradition rattache à la cour de Chandragupta II, et les sciences s'y développent. \
Le pèlerin chinois Faxian, qui parcourt l'Inde au début du Vᵉ siècle, décrit des \
villes prospères et des monastères florissants. Dans les ateliers de Mathura et de \
Sarnath se fixent alors les modèles du Bouddha et des dieux hindous. À la même \
époque, dans le Deccan voisin, sous la dynastie alliée des Vakataka, sont creusés \
et peints les sanctuaires d'Ajanta. L'empire s'affaiblit à la fin du Vᵉ siècle \
sous la pression des invasions des Huns Hephtalites et disparaît au VIᵉ siècle."""
style = """
La sculpture gupta cherche une beauté idéale et intérieure : corps lisses et \
souples, visages pleins aux yeux baissés, robes si fines qu'elles semblent \
transparentes. Elle abandonne les drapés lourds du Gandhara pour un modelé doux et \
continu. Ce style classique a servi de référence à l'art bouddhique de toute l'Asie, \
de l'Asie du Sud-Est à la Chine."""

[[artistes]]
nom = "Inde du Sud, époque chola"
vie = "Pays tamoul (sud-est de l'Inde), milieu du IXᵉ – XIIIᵉ siècle"
biographie = """
Les Chola sont une très ancienne lignée tamoule, déjà citée dans les inscriptions \
de l'empereur Ashoka au IIIᵉ siècle avant notre ère. Au milieu du IXᵉ siècle, une \
nouvelle dynastie s'installe à Thanjavur, dans le delta de la Kaveri, et bâtit en \
quelques générations la principale puissance du sud de l'Inde. Rajaraja Iᵉʳ, qui \
règne de 985 à 1014, conquiert le Kerala et le nord de Sri Lanka et fait élever à \
Thanjavur le grand temple de Brihadishvara, consacré à Shiva. Son fils Rajendra Iᵉʳ \
mène une expédition jusqu'au Gange, puis une expédition navale contre le royaume de \
Srivijaya, en Asie du Sud-Est, et fonde une nouvelle capitale, \
Gangaikondacholapuram. Les rois et les reines chola dotent richement les temples, \
qui reçoivent terres, bijoux et statues de bronze pour les cultes et les \
processions. La dynastie s'affaiblit au XIIIᵉ siècle et disparaît vers 1279. Ses \
fondeurs ont laissé une tradition toujours vivante : dans la ville de Swamimalai, \
au pays tamoul, on fond encore des statues à la cire perdue selon les mêmes \
méthodes."""
style = """
Les bronzes chola unissent la rigueur des traités religieux, qui fixent les \
proportions et les attributs de chaque dieu, à une grande liberté de mouvement. \
Corps minces et élastiques, gestes précis des mains, bijoux finement ciselés : ces \
statues faites pour être portées en procession comptent parmi les sommets de la \
sculpture en métal."""

[[artistes]]
nom = "Java, dynastie Shailendra"
vie = "Centre de Java (Indonésie), VIIIᵉ – IXᵉ siècle"
biographie = """
Au VIIIᵉ siècle, le centre de l'île de Java, région de plaines volcaniques très \
fertiles, est dominé par la dynastie des Shailendra, les « seigneurs de la \
montagne ». Ces rois bouddhistes, adeptes du Mahayana, entretiennent des liens \
avec Sumatra, avec l'Inde et avec les grands monastères du Bengale. Ils font \
construire dans la plaine de Kedu, près de l'actuelle Yogyakarta, plusieurs \
sanctuaires de pierre, dont le Borobudur, élevé vers 800 : une colline enveloppée \
de terrasses superposées, couvertes de plus de deux mille panneaux sculptés et de \
plus de cinq cents statues de Bouddha. Au même moment, une dynastie hindoue \
voisine bâtit les temples de Prambanan, consacrés à Shiva. Au Xᵉ siècle, le centre \
du pouvoir se déplace vers l'est de Java, sans doute en partie à cause des \
éruptions volcaniques, et les grands monuments du centre sont peu à peu \
délaissés. Le Borobudur, oublié sous la végétation, n'est redécouvert par les \
Européens qu'au début du XIXᵉ siècle."""
style = """
L'art des Shailendra adapte les modèles indiens de l'époque gupta et post-gupta à \
la pierre volcanique de Java. Ses Bouddhas sont paisibles et massifs, aux visages \
pleins et aux yeux baissés ; ses reliefs racontent avec douceur et précision la vie \
du Bouddha et le monde quotidien de Java. Le Borobudur en est le chef-d'œuvre."""

[[artistes]]
nom = "Empire khmer, style du Bayon"
vie = "Angkor (Cambodge actuel), fin du XIIᵉ – début du XIIIᵉ siècle"
biographie = """
L'empire khmer naît au début du IXᵉ siècle, lorsque le roi Jayavarman II se \
proclame souverain universel sur le mont Kulen, au nord du lac Tonlé Sap. Ses \
successeurs installent leur capitale à Angkor et y élèvent, pendant plus de trois \
siècles, des temples-montagnes de plus en plus vastes, dont Angkor Vat, bâti au \
XIIᵉ siècle sous Suryavarman II et consacré à Vishnu. En 1177, les Cham du centre \
du Viêt Nam actuel pillent Angkor. Le prince Jayavarman VII les chasse et devient \
roi vers 1181. Bouddhiste fervent, il reconstruit la capitale, Angkor Thom, enceinte \
de murs et ouverte par des portes surmontées de visages géants, et élève en son \
centre le Bayon. Il fonde aussi de grands monastères, comme Ta Prohm et Preah Khan, \
ainsi que des hôpitaux et des gîtes d'étape le long des routes. Le style qui porte \
le nom du Bayon s'épanouit sous son règne et celui de ses successeurs. L'empire \
décline ensuite, et Angkor cesse d'être la capitale au XVᵉ siècle."""
style = """
Le style du Bayon se reconnaît à ses visages larges et pleins, aux yeux baissés et \
aux lèvres épaisses étirées en un sourire intérieur, que l'on a appelé le « sourire \
d'Angkor ». Il multiplie les têtes et les visages tournés vers les quatre \
directions. Ses sculptures, plus humaines et méditatives que celles d'Angkor Vat, \
traduisent la ferveur bouddhique du règne de Jayavarman VII."""

[[artistes]]
nom = "Birmanie, royaume de Pagan"
vie = "Pagan, sur l'Irrawaddy (Myanmar actuel), XIᵉ – XIIIᵉ siècle"
biographie = """
Pagan, dans la plaine aride du centre de la Birmanie, sur le fleuve Irrawaddy, est \
d'abord une petite cité birmane. Au milieu du XIᵉ siècle, le roi Anawrahta en fait \
la capitale du premier royaume unifié du pays. Selon la tradition, il se tourne \
vers le bouddhisme theravada après la conquête de Thaton, ville môn du sud, dont il \
ramène des moines, des textes et des artisans. Ses successeurs, comme Kyanzittha, \
qui fait élever le temple d'Ananda, poursuivent son œuvre. Pendant plus de deux \
siècles, rois, reines et simples fidèles bâtissent des milliers de temples, de \
monastères et de stupas, pour acquérir des mérites. Les liens sont étroits avec \
Sri Lanka, autre foyer du theravada, et avec les lieux saints de l'Inde, comme \
Bodh-Gaya, dont Pagan aide à restaurer le temple. Affaibli, le royaume ne résiste \
pas aux attaques des Mongols de la dynastie Yuan à la fin du XIIIᵉ siècle. Ses \
temples, souvent endommagés par des séismes, sont restés un grand lieu de pèlerinage."""
style = """
L'art de Pagan s'inspire de l'Inde de l'Est sous la dynastie Pala, dont il reprend \
les Bouddhas aux épaules larges et à la taille fine, assis sur des lotus. Il y \
ajoute un goût birman pour les visages ronds et sereins et pour la richesse des \
matières, bronze incrusté, laque et dorure. Ses modèles ont durablement marqué la \
sculpture bouddhique birmane."""

[[artistes]]
nom = "Thaïlande, héritage de Sukhothai"
vie = "Royaumes de Sukhothai, d'Ayutthaya et du Lan Na (Thaïlande actuelle), XIIIᵉ – XVIᵉ siècle"
biographie = """
Au XIIIᵉ siècle, des chefs thaïs s'affranchissent de la domination khmère et \
fondent, dans le nord de la plaine centrale de l'actuelle Thaïlande, le royaume de \
Sukhothai. Ses rois adoptent le bouddhisme theravada, venu de Sri Lanka par \
l'intermédiaire de moines, et couvrent leur capitale et sa ville jumelle, Si \
Satchanalai, de monastères, de stupas et de statues. Les fondeurs de Sukhothai \
créent alors un nouveau type de Bouddha, à la silhouette fluide et à la flamme sur \
le sommet du crâne, et inventent l'image du Bouddha marchant, en ronde-bosse. Au \
XVᵉ siècle, Sukhothai passe sous l'autorité d'Ayutthaya, royaume fondé en 1351 plus \
au sud, qui devient la grande puissance du pays jusqu'à sa destruction par les \
Birmans en 1767. Au nord, le royaume du Lan Na, dont Chiang Mai est la capitale \
depuis la fin du XIIIᵉ siècle, développe sa propre école de bronziers. Dans tous \
ces royaumes, les statues de Sukhothai restent un modèle, copié et vénéré pendant \
des siècles, jusqu'à aujourd'hui."""
style = """
Le Bouddha de tradition Sukhothai est mince, souple, presque immatériel : épaules \
larges, taille fine, bras en longues courbes, doigts de même longueur, visage ovale \
au nez aquilin et au sourire léger, flamme au sommet de la tête. Cette image, d'une \
grande pureté de lignes, est devenue l'emblème de l'art bouddhique thaï."""

[[artistes]]
nom = "Sahibdin"
vie = "Actif à Udaipur (Mewar, Rajasthan), vers 1628 – vers 1655"
biographie = """
On ne connaît de Sahibdin ni la date de naissance ni celle de la mort : seules ses \
œuvres, dont plusieurs portent son nom et une date, permettent de suivre sa \
carrière. Peintre musulman au service des souverains hindous du Mewar, il dirige \
l'atelier royal d'Udaipur sous le maharana Jagat Singh Iᵉʳ, qui règne de 1628 à \
1652, puis au début du règne de Raj Singh Iᵉʳ. Sa première œuvre datée est un \
Ragamala, une « guirlande de modes musicaux », peint en 1628. Il illustre ensuite \
le Rasikapriya, poème sur les amoureux, un Bhagavata Purana consacré à la vie de \
Krishna, et surtout plusieurs livres de l'immense Ramayana commandé par Jagat \
Singh, achevé au début des années 1650 et illustré de plusieurs centaines de \
peintures. Cette époque est celle où le Mewar, en paix avec l'empire moghol depuis \
1615, peut consacrer ses richesses aux arts. Sahibdin, qui connaissait sans doute \
la peinture moghole, a pourtant gardé et affirmé un style propre au Rajasthan, que \
ses successeurs ont repris pendant des décennies."""
style = """
Sahibdin compose ses pages comme des tapisseries : fonds de couleurs vives en \
aplats, rouge, jaune ou vert, figures de profil aux grands yeux, arbres stylisés, \
architecture vue de face. Il raconte souvent plusieurs moments d'une histoire dans \
une même image. Sa clarté et la force de ses couleurs ont défini le style classique \
de la peinture du Mewar."""

[[artistes]]
nom = "Devidasa de Nurpur"
vie = "Originaire de Nurpur (collines du Pendjab), actif vers 1680 – vers 1720"
biographie = """
Devidasa appartient à une famille de peintres de Nurpur, petite principauté des \
collines du Pendjab, au pied de l'Himalaya. Ces collines sont alors partagées \
entre une multitude de petits États rajpoutes, souvent unis par des mariages, entre \
lesquels les peintres circulent. Comme beaucoup d'artistes de ces régions, Devidasa \
travaille pour plusieurs cours voisines, selon les commandes. Son nom \
est connu grâce au colophon d'une série de peintures du Rasamanjari, le traité \
poétique de Bhanudatta sur les amoureux, qui indique qu'il l'a peinte en 1694–1695 \
pour la cour de Basohli. Ce document est précieux : dans la peinture indienne de \
cette époque, les œuvres signées ou datées sont rares, et cette série sert de \
repère pour dater et attribuer bien d'autres pages du style de Basohli. Sa série du \
Rasamanjari a été dispersée au XXᵉ siècle : on en trouve aujourd'hui des pages au \
Metropolitan Museum de New York et dans d'autres collections d'Inde, d'Europe et \
d'Amérique."""
style = """
Devidasa pratique le style de Basohli dans sa maturité : couleurs ardentes en \
aplats, fonds jaunes ou rouges, figures de profil aux yeux immenses, bijoux rehaussés \
d'or et d'argent. Ses compositions sont plus aérées et ses personnages plus \
élégants que ceux des premières séries de Basohli, annonçant la douceur des écoles \
pahari du XVIIIᵉ siècle."""

[[artistes]]
nom = "Raja Ravi Varma"
vie = "Kilimanoor (Travancore, Kerala), 29 avril 1848 – Kilimanoor, 2 octobre 1906"
biographie = """
Ravi Varma naît dans une famille aristocratique liée à la maison royale de \
Travancore, au sud de l'Inde. Un oncle peintre lui donne ses premières leçons, et \
le maharaja Ayilyam Thirunal le fait venir au palais de Thiruvananthapuram, où il \
observe les peintres de cour et les tableaux européens des collections royales. Il \
apprend en grande partie seul la peinture à l'huile, en regardant notamment \
travailler un portraitiste européen de passage, Theodore Jensen. Dans les années \
1870, ses premiers succès, comme une Dame nair se coiffant primée à une exposition \
à Madras, le font connaître. Il devient le portraitiste des princes et des \
notables, et peint pour le maharaja de Baroda, Sayajirao Gaekwad III, une série de \
scènes tirées des épopées. Il envoie des tableaux à l'Exposition universelle de \
Chicago en 1893. En 1894, il fonde près de Bombay une presse lithographique qui \
diffuse en masse, à bas prix, des images en couleurs des dieux et des héros \
indiens ; il la cède quelques années plus tard. Il meurt dans sa ville natale en \
1906."""
style = """
Ravi Varma unit la technique de la peinture académique européenne, huile, modelé, \
perspective, grands formats, aux sujets de la mythologie et de la littérature \
indiennes. Ses héroïnes en sari, au visage idéalisé, ont fixé pour des générations \
l'apparence des dieux et des déesses dans l'imagerie populaire, des chromos aux \
affiches et au cinéma indien."""
