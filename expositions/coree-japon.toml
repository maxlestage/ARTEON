[[oeuvres]]
titre = "La Lutte (Ssireum)"
artiste = "Kim Hong-do"
annee = "fin du XVIIIe siècle"
image = "lutte-ssireum.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Danwon_Ssireum.jpg"
technique = "Encre et couleurs légères sur papier, feuille d'album, env. 27 × 22,7 cm"
collection = "Musée national de Corée, Séoul"
note = "Deux lutteurs s'empoignent au milieu d'un cercle de spectateurs : une page de l'album de scènes de genre de Kim Hong-do, le peintre de la vie quotidienne de Joseon."
description = """
Au centre de la feuille, sur un fond vide, deux hommes en pantalon et veste de toile \
s'agrippent : l'un a soulevé l'autre, qui bascule, une jambe en l'air. Tout autour, \
assis par terre, les spectateurs forment un cercle ouvert. En haut, deux groupes serrés \
regardent, penchés en avant ; certains, coiffés du chapeau noir à larges bords des \
hommes mariés et des lettrés, s'éventent, d'autres ont posé leur chapeau à côté d'eux. \
À gauche, debout, un garçon tient un plateau : c'est un marchand de friandises, qui \
regarde ailleurs. En bas à droite, deux hommes se rejettent en arrière, bouche ouverte, \
comme si les lutteurs allaient leur tomber dessus. Des paires de chaussures sont posées \
sur le sol, à droite."""
evocation = """
Le ssireum, lutte traditionnelle où chaque adversaire saisit la bande de tissu nouée à \
la taille et à la cuisse de l'autre, était le grand divertissement des fêtes de \
village, en particulier de la fête de Dano, au cinquième mois lunaire. Kim Hong-do en \
fait une petite comédie humaine : lettrés et paysans, vieux et jeunes partagent le même \
spectacle, chacun avec sa réaction, tension, amusement ou effroi. La composition guide \
le regard : les spectateurs du bas, qui se rejettent en arrière, annoncent de quel côté \
le lutteur va tomber. Ces peintures de mœurs, appelées pungsokhwa, montrent l'intérêt \
nouveau du XVIIIe siècle coréen pour la vie des gens ordinaires, qui rejoint la \
recherche d'une peinture proprement coréenne, comme chez Jeong Seon."""
histoire = """
La feuille appartient à un album de vingt-cinq scènes de genre, le Danwon pungsokdo \
cheop, conservé au Musée national de Corée et classé trésor de Corée. On y voit aussi \
une forge, une école de village, un jeune danseur, des femmes lavant le linge au bord \
d'un ruisseau, un bac sur une rivière. L'album n'est pas daté ; on le situe \
généralement à la fin du XVIIIe siècle, quand Kim Hong-do, peintre de la cour, est au \
sommet de sa réputation sous le roi Jeongjo. On ignore pour qui il a été réalisé. Ces \
petites images sont devenues si familières en Corée qu'elles illustrent les manuels \
scolaires et ont été reproduites sur d'innombrables objets, timbres et affiches."""
facture = """
Kim Hong-do trace ses figures d'une ligne d'encre souple et rapide, plus appuyée aux \
plis des vêtements, puis les rehausse de lavis légers, gris, ocre ou bleutés. Il \
supprime tout décor, ni arbre ni maison : le sol nu de la feuille et le cercle des \
spectateurs suffisent à créer l'espace. Les visages, ronds, aux yeux étirés, sont \
traités avec humour et variété, chacun avec son expression. La composition en anneau \
concentre l'attention sur les lutteurs tout en laissant le regard circuler d'un groupe \
à l'autre."""
details = [
  "Le jeune marchand de friandises, plateau en main, qui ne regarde pas le combat.",
  "Les deux spectateurs du bas à droite, renversés en arrière, bouche ouverte.",
  "Les chapeaux noirs posés à terre, à gauche.",
  "Les chaussures posées sur le sol, à droite.",
  "La jambe levée du lutteur qui bascule.",
]
themes = ["lutte", "fête", "village", "vie quotidienne", "joseon"]
anecdote = """
On a remarqué depuis longtemps qu'un des spectateurs a les mains dessinées à l'envers, \
la droite à la place de la gauche. Simple distraction ou clin d'œil du peintre, ce \
détail est devenu l'une des curiosités les plus commentées de la peinture coréenne."""
salle = 4
mur = "nord"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Les Iris (paravent de droite)"
artiste = "Ogata Kōrin"
annee = "vers 1701–1705"
image = "iris-korin.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:KORIN-Irises-R.jpg"
technique = "Paravent à six panneaux, encre et couleurs sur papier à feuilles d'or, env. 151 × 360 cm (l'un d'une paire)"
collection = "Musée Nezu, Tokyo"
note = "Des touffes d'iris bleus se succèdent sur un fond d'or, comme un motif d'étoffe : le paravent le plus célèbre de l'école Rinpa."
description = """
Six panneaux verticaux, réunis en un paravent, forment une seule surface d'or. Sur ce \
fond uni, sans horizon ni sol, des touffes d'iris se succèdent de gauche à droite en \
une frise ondulante : longues feuilles vert vif, droites ou légèrement penchées, et \
fleurs d'un bleu profond, presque noir pour certaines, plus clair pour d'autres. Les \
groupes montent puis redescendent, laissant entre eux des vides d'or. On ne voit ni \
eau, ni pont, ni personnage. Le fond est fait de carrés de feuille d'or, dont on devine \
les joints. En bas à droite, une signature à l'encre et un sceau rond identifient le \
peintre. Le second paravent de la paire, qui n'est pas présenté ici, prolonge la frise \
vers la gauche."""
evocation = """
Les iris renvoient à un épisode célèbre des Contes d'Ise, recueil de récits poétiques \
du Xe siècle : un noble qui a quitté la capitale arrive à Yatsuhashi, les « Huit \
Ponts », où des iris fleurissent au bord d'un marais ; il compose un poème dont chaque \
vers commence par une syllabe du mot kakitsubata, iris, et ses compagnons pleurent en \
pensant à Kyoto. Kōrin supprime le pont, les voyageurs, le paysage : il ne reste que \
les fleurs, et le spectateur cultivé reconnaît l'histoire. Réduire un récit à un motif \
décoratif, pour une élite qui aimait ces allusions littéraires, est au cœur de \
l'esthétique Rinpa. L'œuvre dit aussi le monde de Kōrin, fils de marchands d'étoffes, \
pour qui la peinture et le dessin textile étaient proches."""
histoire = """
Kōrin peint cette paire de paravents vers 1701–1705, peu après avoir reçu le titre \
honorifique de hokkyō, qu'il mentionne dans sa signature. On ignore pour qui. Les \
paravents ont longtemps appartenu au Nishi Hongan-ji, l'un des grands temples de Kyoto, \
qui les a conservés pendant plus de deux siècles. Ils entrent ensuite dans la \
collection de l'industriel Nezu Kaichirō ; après sa mort, en 1940, sa demeure de Tokyo \
et ses collections deviennent le musée Nezu, qui ouvre au public en 1941. Classés \
trésor national, les deux paravents sont si fragiles qu'on ne les montre qu'une fois \
par an, au printemps, à la saison où fleurissent les iris du jardin du musée."""
facture = """
Kōrin pose ses couleurs en aplats, sans ombre ni modelé : le bleu d'azurite pour les \
fleurs, le vert de malachite pour les feuilles, deux pigments minéraux broyés, épais et \
mats, qui ressortent sur l'or. Certaines touffes se répètent presque à l'identique d'un \
panneau à l'autre ; on a pensé qu'il utilisait des pochoirs, comme dans la teinture des \
étoffes que vendait sa famille. Le rythme, régulier mais varié, rappelle celui d'un \
motif de kimono. Déplié en zigzag, le paravent faisait en outre jouer la lumière sur \
l'or, panneau après panneau."""
details = [
  "Les groupes de fleurs qui se répètent d'un panneau à l'autre, presque identiques.",
  "Les deux bleus des fleurs, l'un très sombre, l'autre plus clair.",
  "Les carrés de feuille d'or et leurs joints, visibles dans le fond.",
  "La signature et le sceau rond de Kōrin, en bas à droite.",
]
themes = ["iris", "or", "poésie", "rinpa", "motif"]
anecdote = """
Plus tard, Kōrin reprend le sujet dans une autre paire de paravents, où il peint cette \
fois le pont de bois en zigzag qui traverse les iris. Ces Iris à Yatsuhashi sont \
aujourd'hui conservés au Metropolitan Museum de New York."""
salle = 2
mur = "nord"
place = 2
largeur = 3.6

[[oeuvres]]
titre = "Pins dans la brume (paravent de droite)"
artiste = "Hasegawa Tōhaku"
annee = "fin du XVIe siècle"
image = "pins-dans-la-brume.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hasegawa_Tohaku_-_Pine_Trees_(Shōrin-zu_byōbu)_-_right_hand_screen.jpg"
technique = "Paravent à six panneaux, encre sur papier, 156,8 × 356 cm (l'un d'une paire)"
collection = "Musée national de Tokyo"
note = "Quelques pins apparaissent et s'effacent dans le brouillard : avec de l'encre seule et beaucoup de papier vide, Tōhaku peint l'humidité de l'air."
description = """
Sur six panneaux de papier légèrement beige, bordés de soie dorée et d'une fine \
baguette laquée, des pins surgissent du blanc. À gauche, un groupe de troncs serrés : \
le plus net, au troisième panneau, porte des branches touffues d'un noir profond, \
tandis que derrière lui d'autres pins, plus pâles, se dissolvent dans le gris. Au \
centre, deux panneaux restent presque vides, traversés seulement par l'ombre d'un arbre \
lointain. À droite, un pin isolé se penche, ses longues branches étendues, accompagné \
de silhouettes à peine visibles. Au pied des arbres, quelques traits suggèrent le sol. \
Rien d'autre : ni ciel, ni montagne, ni ligne d'horizon."""
evocation = """
Le paravent ne décrit pas un lieu précis mais un état de l'air : le matin, peut-être, \
ou un jour de brouillard, quand les arbres proches se détachent et que les autres \
s'effacent. Le vide n'est pas un manque : il figure la brume elle-même et laisse le \
spectateur compléter la scène. On a voulu y voir les pinèdes du littoral de Noto, la \
région natale du peintre, ou un moment de deuil après la mort de son fils, en 1593 ; \
ces lectures restent des hypothèses. L'œuvre est souvent rapprochée de la sensibilité \
du bouddhisme zen et de la peinture chinoise de Muqi, que Tōhaku admirait. À l'opposé \
des fonds d'or de son époque, elle est devenue l'une des peintures les plus aimées du \
Japon."""
histoire = """
Venu de la province de Noto, Hasegawa Tōhaku s'impose à Kyoto dans les années 1590 face \
à l'école Kanō, qui domine les grandes commandes. On ne sait ni quand ni pour qui il a \
peint ces pins, ni même s'il s'agit d'une œuvre achevée : les feuilles de papier sont \
jointes de façon irrégulière, et les sceaux sont parfois jugés plus tardifs. Aussi \
certains historiens y voient-ils une esquisse, peut-être préparatoire à un décor de \
portes coulissantes, montée ensuite en paravent. La paire appartient aujourd'hui au \
Musée national de Tokyo et elle est classée trésor national. Fragile, elle n'est \
présentée au public que quelques semaines par an, le plus souvent au moment du Nouvel \
An."""
facture = """
Tout est fait à l'encre, plus ou moins diluée, sur un papier sans préparation. Tōhaku \
peint les aiguilles de pin d'un geste rapide, avec un pinceau large, peut-être fait de \
paille, qui laisse des traînées sèches et nerveuses. Les arbres du premier plan sont \
tracés à l'encre presque pure ; ceux de l'arrière, en lavis très clair, aux contours \
qui se perdent dans le papier. Ce travail des valeurs, du noir au gris le plus pâle, \
crée une profondeur sans perspective, avec une seule couleur."""
details = [
  "Le pin le plus noir, au troisième panneau, et les arbres pâles derrière lui.",
  "Les deux panneaux du centre, presque vides.",
  "Le pin penché, à droite, et ses longues branches.",
  "Les traînées sèches du pinceau dans les aiguilles.",
  "Les quelques traits du sol au pied des troncs.",
]
themes = ["pins", "brume", "encre", "vide", "zen"]
anecdote = """
Tōhaku se présentait comme l'héritier, à la cinquième génération, du grand peintre à \
l'encre Sesshū, mort près d'un siècle plus tôt. Il se rattachait ainsi à la plus \
prestigieuse tradition japonaise de la peinture monochrome."""
salle = 2
mur = "nord"
place = 8
largeur = 3.6

[[oeuvres]]
titre = "Les Dieux du vent et du tonnerre"
artiste = "Tawaraya Sōtatsu"
annee = "début du XVIIe siècle"
image = "dieux-vent-tonnerre.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Wind_God_and_Thunder_God_Screens_by_Tawaraya_Sotatsu_hi-res.png"
technique = "Paire de paravents à deux panneaux, encre et couleurs sur papier à feuilles d'or, 154,5 × 169,8 cm chacun"
collection = "Temple Kennin-ji, Kyoto (en dépôt au Musée national de Kyoto)"
note = "Deux dieux jaillissent des nuages aux deux extrémités d'un ciel d'or : à gauche, le dieu du tonnerre frappe ses tambours ; à droite, le dieu du vent déploie son sac."
description = """
Deux paravents dorés, de deux panneaux chacun, sont placés côte à côte. Sur celui de \
gauche, le dieu du tonnerre, Raijin, au corps blanc, surgit en haut d'un nuage sombre : \
autour de lui, un anneau de petits tambours qu'il frappe de ses baguettes ; il a les \
cheveux hérissés, un rictus féroce, et une écharpe flotte derrière lui. Sur celui de \
droite, le dieu du vent, Fūjin, au corps vert, accourt depuis le bord sur un autre \
nuage, tenant au-dessus de sa tête un long sac blanc gonflé, d'où s'échappent les \
vents. Les deux figures sont repoussées vers les bords ; entre elles, un vaste espace \
d'or reste vide. Les nuages, bruns et gris, sont faits de taches diffuses."""
evocation = """
Fūjin et Raijin sont des divinités anciennes, venues de l'Inde et de la Chine avec le \
bouddhisme, que l'on voit aussi en statues dans les temples japonais. Ici, ils semblent \
faire irruption dans le ciel au même instant, comme pour déclencher un orage. On a lu \
les deux paravents comme une image des forces de la nature, à la fois menaçantes et \
bienfaisantes, puisque la pluie et le vent font aussi pousser le riz. La comédie des \
visages, presque caricaturaux, tempère la terreur. Le vide doré du centre, chargé de \
tension entre les deux figures, est souvent cité comme un exemple du goût japonais pour \
l'espace laissé libre."""
histoire = """
L'œuvre n'est ni signée ni datée ; on l'attribue à Sōtatsu, qui dirigeait à Kyoto un \
atelier de peinture d'éventails, le Tawaraya, et travaillait avec le calligraphe \
Hon'ami Kōetsu. On pense qu'il l'a peinte à la fin de sa carrière, dans les années 1620 \
ou 1630. Les paravents appartiennent au Kennin-ji, le plus ancien temple zen de Kyoto, \
fondé en 1202, qui les a confiés au Musée national de Kyoto ; le temple montre à ses \
visiteurs une reproduction fidèle. Classés trésor national, ils sont considérés comme \
l'une des œuvres fondatrices de l'école Rinpa : Kōrin les a copiés près d'un siècle \
plus tard, et Sakai Hōitsu, au XIXe siècle, a copié à son tour la version de Kōrin."""
facture = """
Sur le fond de feuilles d'or carrées, Sōtatsu peint les corps en aplats épais, blanc \
pour Raijin, vert pour Fūjin, cernés de contours souples à l'encre. Les nuages sont \
peints selon la technique du tarashikomi, qu'il a contribué à mettre au point : on \
dépose une encre ou une couleur sur une autre encore humide, et elles se mêlent en \
auréoles irrégulières, imprévisibles. Les figures, en partie coupées par le bord des \
paravents, semblent entrer dans le cadre et en sortir, ce qui donne une impression de \
mouvement."""
details = [
  "L'anneau de tambours de Raijin, coupé par le bord supérieur du paravent.",
  "Le sac à vent blanc que Fūjin tient au-dessus de sa tête.",
  "Les nuages sombres faits de taches qui se fondent les unes dans les autres.",
  "Les écharpes qui flottent derrière les deux dieux.",
  "Le grand espace d'or vide au centre de la paire.",
]
themes = ["dieux", "orage", "or", "rinpa", "vide"]
anecdote = """
On compare souvent les dieux de Sōtatsu aux statues de Fūjin et de Raijin sculptées au \
XIIIe siècle pour le Sanjūsangen-dō, le temple situé juste en face du Musée national de \
Kyoto : le peintre pourrait s'en être inspiré."""
salle = 2
mur = "sud"
place = 2
largeur = 3.4

[[oeuvres]]
titre = "Le Dit du Genji, chapitre « Azumaya »"
artiste = "Japon, époque de Heian"
annee = "première moitié du XIIe siècle"
image = "genji-azumaya.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Genji_emaki_azumaya.jpg"
technique = "Peinture d'un rouleau illustré (emaki), couleurs et encre sur papier, haut. env. 22 cm"
collection = "Musée d'art Tokugawa, Nagoya"
note = "Dans un appartement du palais, des dames lisent, regardent des images et se font coiffer : une scène du plus ancien rouleau illustré du Dit du Genji."
description = """
On regarde l'intérieur d'une demeure aristocratique d'en haut et en biais, comme si le \
toit avait été retiré. Des poutres, des stores de bambou et des cloisons coulissantes \
ornées de paysages découpent la scène en diagonales. Au centre, un écran de tissu \
mauve, suspendu à un cadre, sépare deux groupes. À gauche, une dame en vêtements gris \
s'occupe de la longue chevelure noire d'une autre ; plus loin, une dame en robe claire \
tient un cahier ouvert et lit. En haut, une jeune femme accoudée, en vêtements vert et \
rouge, se penche. À droite, une dame en robe crème à motifs de cercles est assise, ses \
cheveux noirs répandus sur ses épaules, près d'une pile d'étoffes colorées. Les \
visages, pâles, sont réduits à quelques traits."""
evocation = """
Le Dit du Genji, écrit vers l'an 1000 par Murasaki Shikibu, dame d'honneur à la cour \
impériale, est souvent présenté comme l'un des premiers romans de l'histoire. Le \
chapitre « Azumaya », « le pavillon de l'Est », appartient à sa dernière partie. La \
tradition reconnaît dans cette scène la jeune Ukifune, qui regarde des images pendant \
qu'une suivante lit le texte à voix haute, et sa demi-sœur Naka no Kimi, dont on peigne \
les cheveux. Rien ne semble se passer ; mais le lecteur sait qu'Ukifune vient \
d'échapper aux avances d'un prince, et devine l'inquiétude sous ce moment de calme. Ces \
peintures expriment le mono no aware, la sensibilité mélancolique à la fragilité des \
choses, que cultivait la cour de Heian."""
histoire = """
Les rouleaux illustrés du Dit du Genji ont été réalisés au XIIe siècle, plus d'un \
siècle après le roman, sans doute pour la cour impériale. Ils comptaient à l'origine \
plusieurs rouleaux, où des passages de texte calligraphiés sur papier décoré \
alternaient avec des peintures. Il n'en reste qu'une vingtaine de scènes peintes, \
réparties entre le musée d'art Tokugawa, à Nagoya, qui en garde la plus grande part, et \
le musée Gotoh, à Tokyo. Pour les protéger, les feuilles sont aujourd'hui conservées \
séparément, à plat. Longtemps attribuées au peintre de cour Fujiwara no Takayoshi, \
elles sont désormais considérées comme l'œuvre de plusieurs peintres et calligraphes \
anonymes. Elles sont classées trésor national."""
facture = """
Les peintres travaillent selon la méthode dite tsukuri-e, la « peinture construite » : \
un premier dessin à l'encre, puis des couches épaisses de pigments minéraux opaques, et \
enfin les contours et les détails retracés à l'encre. Le toit est supprimé pour montrer \
l'intérieur, procédé appelé fukinuki yatai, le « toit soufflé ». Les visages suivent la \
convention du hikime kagibana, « les yeux en trait, le nez en crochet », qui rend les \
personnages presque interchangeables : l'émotion passe par les postures, les étoffes et \
la composition en diagonale. Les couleurs ont beaucoup souffert, et l'écaillement \
laisse voir par endroits le dessin sous-jacent."""
details = [
  "La dame qui lit, au centre, un cahier ouvert entre les mains.",
  "La longue chevelure noire que l'on coiffe, à gauche.",
  "L'écran de tissu mauve, aux rubans flottants, qui partage la pièce.",
  "Les visages blancs aux yeux réduits à un trait.",
  "Les paysages peints sur les cloisons, en haut.",
]
themes = ["roman", "cour", "femmes", "lecture", "heian"]
anecdote = """
Une autre scène de ces rouleaux, tirée du chapitre « Suzumushi », figure au revers du \
billet japonais de 2 000 yens, émis en 2000, à côté d'un portrait de Murasaki Shikibu."""
salle = 5
mur = "nord"
place = 2
largeur = 1.8

[[oeuvres]]
titre = "Chōjū-giga, la lutte de la grenouille et du lièvre"
artiste = "Japon, époque de Heian"
annee = "XIIe siècle"
image = "choju-giga-sumo.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Chouju_1st_scroll-05.jpg"
technique = "Encre sur papier, rouleau horizontal, haut. env. 30 cm (détail du premier rouleau)"
collection = "Temple Kōzan-ji, Kyoto"
note = "Une grenouille envoie un lièvre au tapis sous le regard des spectateurs : une scène du plus célèbre rouleau comique du Japon, tracée à l'encre seule."
description = """
Le rouleau se lit de droite à gauche. À droite, au bord d'un pré planté d'herbes et de \
buissons, deux lièvres debout regardent une grenouille et un lièvre qui s'empoignent : \
la grenouille mord l'oreille de son adversaire. Plus à gauche, l'issue du combat : le \
lièvre, projeté, tombe à la renverse, les pattes en l'air, tandis que la grenouille \
victorieuse, dressée sur ses pattes arrière, ouvre grand la bouche ; un trait courbe \
s'en échappe, comme un cri ou un souffle. À l'extrême gauche, d'autres grenouilles se \
roulent par terre ou se redressent. Il n'y a ni texte ni couleur, seulement l'encre \
noire sur le papier, avec quelques touffes d'herbe et le contour d'une rive."""
evocation = """
Les animaux se conduisent comme des humains : ils luttent, font la fête, se baignent \
et, plus loin dans le même rouleau, célèbrent un office où une grenouille tient le rôle \
de la statue du Bouddha et un singe celui du moine. On y a vu une satire du clergé et \
de la société de l'époque, mais aussi un simple jeu, plein d'humour et d'observation. \
La vivacité du trait, l'enchaînement des scènes sans paroles et l'expressivité des \
attitudes font que l'on présente souvent ces rouleaux comme un lointain ancêtre du \
manga. La victoire de la petite grenouille sur le grand lièvre est devenue l'une des \
images les plus populaires du Japon."""
histoire = """
Les Chōjū-jinbutsu-giga, « caricatures d'animaux et d'humains », forment quatre \
rouleaux conservés au Kōzan-ji, un temple des montagnes au nord-ouest de Kyoto, relevé \
au début du XIIIe siècle par le moine Myōe. Ils ne sont ni signés ni datés et ne \
forment pas un ensemble homogène : le premier, celui des animaux, le plus célèbre, \
remonte au XIIe siècle, d'autres sont plus tardifs. La tradition les attribue au \
moine-peintre Toba Sōjō, sans preuve. Les sceaux du temple, apposés aux jointures des \
feuilles, attestent leur présence au Kōzan-ji. Classés trésor national, les rouleaux \
sont confiés en dépôt aux musées nationaux de Tokyo et de Kyoto, et le temple en \
présente des copies."""
facture = """
Le peintre travaille à l'encre seule, d'un pinceau souple qui passe du trait fin au \
trait appuyé en un seul geste. Quelques lignes suffisent pour la musculature d'une \
cuisse de grenouille ou l'élan d'un lièvre qui tombe ; de légers lavis gris marquent le \
pelage, les taches de la peau, le sol. Le rouleau est conçu comme une suite continue, \
que le lecteur déroule section par section : les scènes s'enchaînent sans séparation, \
liées par le paysage, et le mouvement des figures entraîne l'œil de droite à gauche, \
dans le sens de la lecture."""
details = [
  "La grenouille qui mord l'oreille du lièvre, à droite.",
  "Le lièvre projeté, pattes en l'air, au centre.",
  "Le souffle qui sort de la bouche de la grenouille victorieuse.",
  "Les deux lièvres spectateurs, debout à droite.",
  "Les sceaux rectangulaires du temple sur les jointures du papier.",
]
themes = ["animaux", "humour", "satire", "encre", "manga"]
anecdote = """
Déroulé en entier, le premier rouleau, celui des animaux, mesure plus de onze mètres de \
long, et il ne comporte pas une seule ligne de texte : tout le récit passe par l'image."""
