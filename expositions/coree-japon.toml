# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Vase maebyeong aux grues et aux nuages"
artiste = "Corée, dynastie Goryeo"
annee = "seconde moitié du XIIe siècle"
image = "maebyeong-grues.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:청자_상감_구름_학_무늬_매병_고려-靑磁象嵌雲鶴文梅甁_高麗-Maebyeong_decorated_with_cranes_and_clouds_MET_DP240189.jpg"
technique = "Grès à décor incrusté sous couverte céladon, haut. 33,5 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Des grues blanches volent entre de petits nuages sur le vert pâle d'un céladon : le décor n'est pas peint, il est incrusté dans l'argile."
description = """
Un vase haut d'un peu plus de trente centimètres, à l'épaule large et arrondie, qui \
s'amincit vers le bas puis s'évase légèrement au pied ; un col très court, à lèvre \
ourlée, ne laisse qu'une petite ouverture. Toute la surface est couverte d'une glaçure \
vert pâle, translucide, parcourue de fines craquelures. Sur ce fond, des grues blanches \
volent dans tous les sens, ailes déployées, les unes montant vers le col, les autres \
plongeant, le cou tendu. Entre elles flottent de petits nuages blancs en forme de \
champignon, prolongés par une longue traîne ondulante. Au pied, une frise de grecques \
blanches ferme le décor. Photographié en entier sur un fond gris, le vase est ici \
présenté agrandi plus de trois fois."""
evocation = """
Dans toute l'Asie orientale, la grue est l'oiseau de la longévité et la monture des \
immortels taoïstes ; les nuages évoquent le ciel où ceux-ci séjournent. Sur un vase \
destiné au vin, ce vol d'oiseaux forme un souhait de longue vie et de sérénité, adressé \
à des convives raffinés. La forme maebyeong, empruntée au meiping chinois, signifie \
« vase à prunier » : on explique souvent ce nom par l'usage d'y placer une branche de \
prunier en fleur, mais ces vases servaient d'abord à conserver l'alcool. Le vert du \
céladon cherchait à rappeler le jade, pierre précieuse entre toutes. Ce vase dit le \
goût d'une aristocratie nourrie de bouddhisme et de culture chinoise, qui a su \
inventer, avec l'incrustation, un décor qui n'appartient qu'à la Corée."""
histoire = """
Le royaume de Goryeo, qui a donné son nom à la Corée, porte le céladon à son sommet au \
XIIe siècle. Les principaux fours se trouvent dans le sud-ouest de la péninsule, à \
Gangjin et à Buan, près de la mer, d'où les pièces gagnent par bateau la capitale, \
Kaesong. En 1123, un envoyé de l'empereur de Chine, Xu Jing, séjourne à Kaesong ; dans \
son récit de voyage, il loue la couleur des céladons coréens, que les habitants, \
note-t-il, comparent à celle du martin-pêcheur. Au début du XXe siècle, de nombreuses \
tombes de Goryeo, autour de Kaesong, sont fouillées ou pillées, et leurs céladons \
gagnent le marché de l'art, au Japon puis en Occident. C'est dans ce contexte que le \
marchand d'art japonais Yamanaka Sadajirō offre ce vase au Metropolitan Museum, en \
1911."""
facture = """
Le potier tourne le vase en grès puis, l'argile encore humide mais ferme, grave au \
couteau les grues, les nuages et la frise. Il comble les creux d'argile blanche ou \
noire, gratte l'excédent pour que la surface redevienne lisse, et fait une première \
cuisson. Il pose ensuite la glaçure, chargée d'un peu de fer, et cuit le vase dans un \
four privé d'oxygène : c'est ce qui donne le vert bleuté. Cette technique \
d'incrustation, appelée sanggam, est propre à la Corée. Les pattes et les becs des \
grues, tracés d'un trait noir plus fin que le blanc, sont eux aussi incrustés."""
details = [
  "Les grues qui montent et celles qui plongent, tête vers le bas.",
  "Les pattes et le bec des oiseaux, en fin trait noir incrusté.",
  "La traîne ondulante qui prolonge chaque petit nuage.",
  "Le réseau des craquelures de la glaçure, visible sur l'épaule.",
  "La frise de grecques blanches au-dessus du pied.",
]
themes = ["céladon", "grue", "longévité", "incrustation", "goryeo"]
anecdote = """
Le plus célèbre maebyeong aux grues et aux nuages, conservé au musée Kansong de Séoul, \
est classé trésor national. Le collectionneur Jeon Hyeong-pil l'avait acheté en 1935 à \
un marchand japonais, pour une somme considérable, afin de garder ce patrimoine en \
Corée."""
salle = 3
mur = "ouest"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Jarre lune"
artiste = "Corée, dynastie Joseon"
annee = "seconde moitié du XVIIIe siècle"
image = "jarre-lune.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:백자_달항아리_조선-白磁壺_朝鮮-Moon_Jar_MET_DP231899.jpg"
technique = "Porcelaine, haut. 38,7 cm, diam. 33 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Une jarre de porcelaine blanche presque ronde, sans aucun décor : sa beauté tient à la forme, à la blancheur et à ses imperfections."
description = """
Une grande jarre presque sphérique, un peu plus haute que large, posée sur un petit \
pied annulaire ; un col court et droit, à peine évasé, ouvre la panse vers le haut. \
Elle ne porte aucun décor peint ni gravé, seulement une glaçure blanche, laiteuse, \
légèrement bleutée par endroits. La rondeur n'est pas parfaite : le profil se gonfle \
davantage d'un côté que de l'autre. Des taches rosées, couleur de chair ou de rouille \
pâle, s'étalent en bandes horizontales sur la panse ; quelques points noirs piquent la \
surface près du pied, où la glaçure laisse voir la pâte. Haute en réalité de \
trente-neuf centimètres, la jarre est ici présentée agrandie un peu plus de trois fois."""
evocation = """
Le nom de jarre lune, qui ne date que du XXe siècle, dit bien ce qu'on y voit : un \
astre blanc, plein, un peu irrégulier, comme la lune qui se lève. Ces jarres reflètent \
l'idéal de la dynastie Joseon, gouvernée selon le néo-confucianisme, qui prisait la \
simplicité, la frugalité et la pureté du blanc, couleur que portaient aussi la plupart \
des Coréens dans leurs vêtements de tous les jours. On y a vu l'image d'une beauté sans \
artifice, qui accepte l'asymétrie et les accidents de la cuisson. Au XXe siècle, des \
artistes coréens comme le peintre Kim Whanki, qui les collectionnait et les peignait, \
en ont fait un emblème de l'identité coréenne ; des céramistes du monde entier les \
imitent aujourd'hui."""
histoire = """
Les jarres lunes ont été produites surtout entre la fin du XVIIe et le XVIIIe siècle, \
dans les fours officiels de Gwangju, au sud-est de Séoul, qui fournissaient la \
porcelaine de la cour. On ignore l'usage exact de chacune : elles pouvaient contenir \
des provisions ou de l'alcool, ou simplement être admirées. Leur taille posait un défi \
technique, car une forme aussi large ne pouvait être tournée d'un seul tenant dans une \
pâte de porcelaine. Celle-ci est entrée au Metropolitan Museum avec la collection d'art \
asiatique du collectionneur américain Harry G. C. Packard, acquise par le musée en \
1975, en partie par don, en partie par achat. Il ne subsiste qu'un nombre limité de ces \
grandes jarres, conservées en Corée, au Japon, en Europe et aux États-Unis."""
facture = """
Le potier a tourné séparément deux grands bols hémisphériques, puis les a assemblés \
bord contre bord avant de façonner le col et le pied : la jonction, à mi-hauteur, \
explique le léger renflement et l'asymétrie du profil. La pâte, un kaolin très pur, est \
couverte d'une glaçure transparente qui prend, à haute température, ce blanc laiteux. \
Dans le four chauffé au bois, la chaleur n'était jamais parfaitement égale, et la jarre \
s'est un peu affaissée. Les taches rosées proviendraient de la cuisson ou de ce que la \
jarre a contenu, qui aurait imprégné la porcelaine."""
details = [
  "Le profil, plus bombé d'un côté que de l'autre.",
  "Les bandes rosées qui traversent la panse à mi-hauteur.",
  "Le col court, à peine évasé, d'un blanc plus jaune.",
  "Les points noirs et la pâte nue près du pied.",
]
themes = ["porcelaine", "blanc", "lune", "simplicité", "joseon"]
anecdote = """
En 1935, le céramiste anglais Bernard Leach achète une jarre lune à Séoul et la \
rapporte en Angleterre en disant, raconte-t-on, qu'il emportait le bonheur avec lui. \
Elle est aujourd'hui conservée au British Museum, à Londres."""
salle = 3
mur = "ouest"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Plat carré aux pluviers au-dessus des vagues"
artiste = "Ogata Kenzan"
annee = "vers 1700"
image = "plat-pluviers.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ogata_Korin_-_Square_Dish_with_Design_of_Plovers_over_Waves_-_1966.365_-_Cleveland_Museum_of_Art.tif"
technique = "Grès, décor à l'oxyde de fer sous glaçure, 22 × 22 × 2,7 cm ; décor peint par Ogata Kōrin"
collection = "Cleveland Museum of Art"
note = "Kenzan a façonné et cuit ce plat ; son frère aîné, le peintre Kōrin, y a tracé d'un pinceau rapide des pluviers volant au-dessus des vagues."
description = """
Un plat carré et peu profond, de vingt-deux centimètres de côté, aux bords droits, \
photographié de biais sur un fond gris. La pâte, couleur crème, est couverte d'une \
glaçure transparente finement craquelée. Au fond du plat, peinte en brun noir, une \
grande vague s'enroule à gauche et ses lignes d'écume se déroulent vers la droite ; \
au-dessus, de petits oiseaux aux ailes en forme de cœur, des pluviers, volent en \
groupe. Près du bord droit, quelques caractères tracés au pinceau forment la signature \
du peintre. Sur les quatre bords extérieurs court un décor continu de rinceaux et de \
nuages, où s'épanouit, au premier plan, une grande fleur. Le plat est ici présenté \
agrandi environ cinq fois."""
evocation = """
Le pluvier, chidori en japonais, est un oiseau de rivage chanté depuis des siècles par \
la poésie de cour : ses cris sur la grève, les nuits d'hiver, disent la solitude et le \
froid. Associé aux vagues, il forme un motif classique que les Ogata reprennent avec \
une liberté nouvelle. Ce plat illustre un idéal où la peinture, la poésie et l'objet \
d'usage ne se séparent pas : un plat à gâteaux pour la cérémonie du thé devient le \
support d'une peinture signée. Il témoigne aussi de la complicité de deux frères, nés \
dans une riche famille de marchands de soieries de Kyoto, l'un peintre mondain et \
célèbre, l'autre potier et lettré, épris de solitude."""
histoire = """
En 1699, Ogata Kenzan ouvre son propre four à Narutaki, au nord-ouest de Kyoto ; son \
nom d'artiste, qui signifie « montagne du nord-ouest », vient de cette situation. Son \
frère Kōrin, déjà peintre reconnu, vient décorer certaines de ses pièces. Le travail \
est partagé : Kenzan façonne le plat, Kōrin y peint son motif, Kenzan pose la glaçure \
et assure la cuisson. Chacun signe : Kōrin à côté de son dessin, Kenzan au revers. Ce \
plat faisait partie d'un service destiné à présenter les gâteaux qui accompagnent le \
thé. Il a appartenu à la collection Ōkōchi, à Tokyo, avant d'être vendu par un marchand \
tokyoïte au musée de Cleveland, en 1966. D'autres plats carrés peints par Kōrin sont \
conservés au Japon."""
facture = """
Un plat carré ne se tourne pas : il est monté à partir de plaques d'argile assemblées. \
Kōrin y peint à l'oxyde de fer, qui devient brun noir à la cuisson, d'un pinceau rapide \
et sûr : la vague en quelques courbes, les oiseaux en simples taches doubles. Kenzan \
couvre ensuite le tout d'une glaçure transparente, qui a pris en refroidissant un fin \
réseau de craquelures. Le contraste entre ce dessin libre, presque calligraphique, au \
fond du plat, et la frise dense et régulière des bords est caractéristique de l'art des \
deux frères."""
details = [
  "La grande vague, à gauche, dont l'écume se déroule en lignes parallèles.",
  "Les pluviers, réduits chacun à deux taches en forme de cœur.",
  "La signature de Kōrin, à droite, à côté de son dessin.",
  "La fleur épanouie sur le bord extérieur, au premier plan.",
  "Le fin réseau de craquelures de la glaçure.",
]
themes = ["céramique", "pluvier", "vague", "thé", "rinpa"]
anecdote = """
Vers l'âge de soixante-dix ans, Kenzan quitte Kyoto pour s'installer à Edo, l'actuelle \
Tokyo. Il y continue de peindre et de faire des céramiques jusqu'à sa mort, en 1743, à \
quatre-vingts ans."""
salle = 3
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Le Mont Inwang après la pluie"
artiste = "Jeong Seon"
annee = "1751"
image = "inwang-apres-la-pluie.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Inwangjesaekdo.jpg"
technique = "Encre sur papier, 79,2 × 138,2 cm"
collection = "Musée national de Corée, Séoul"
note = "Les rochers encore mouillés du mont Inwang, au-dessus de Séoul, émergent de la brume qui monte des vallées : l'œuvre la plus célèbre du paysage coréen « de vue réelle »."
description = """
Une montagne occupe presque toute la largeur de la feuille. Au centre, une énorme paroi \
de granit arrondie, peinte d'un noir profond, se dresse comme un dôme ; autour d'elle, \
des crêtes plus claires, ponctuées de petites taches d'encre qui figurent les arbres, \
s'étagent jusqu'au bord supérieur. De minces cascades, nées de la pluie, descendent \
dans les ravins. Toute la partie basse est noyée dans une brume blanche d'où émergent \
des cimes de pins. En bas à droite, parmi les arbres, apparaît le toit d'une maison ; \
plus bas, vers la gauche, pendent les branches légères d'un saule. En haut à droite, \
une courte inscription verticale donne le titre, le nom de pinceau du peintre et la \
date, suivie de deux sceaux."""
evocation = """
Le titre coréen, Inwang jesaek do, signifie « le mont Inwang qui s'éclaircit après la \
pluie » : le peintre saisit l'instant où l'averse cesse, où la roche est encore noire \
d'eau et où la brume se lève. Le mont Inwang domine à l'ouest le palais royal de Séoul, \
et Jeong Seon vivait à son pied : il peint un paysage qu'il voyait chaque jour. Selon \
une interprétation répandue, l'œuvre serait liée à son ami de toujours, le poète Yi \
Byeong-yeon, gravement malade cette année-là et mort peu après ; la maison du bas \
serait la sienne, et le ciel qui se dégage, un vœu de guérison. Rien ne le prouve, mais \
cette lecture dit l'émotion que l'on prête à ce tableau, peint par un homme de \
soixante-quinze ans."""
histoire = """
Jeong Seon peint ce paysage en 1751, comme l'indique l'inscription, au cours d'un mois \
intercalaire du calendrier lunaire. Jusque-là, les peintres coréens représentaient \
surtout des montagnes imaginaires, à la manière chinoise ; lui fait de la capitale et \
de ses environs un sujet digne de la grande peinture. Au XXe siècle, l'œuvre appartient \
à la collection de Lee Kun-hee, président du groupe Samsung, et elle est classée trésor \
national de Corée. Après la mort de Lee Kun-hee, en 2020, sa famille fait don à l'État \
de milliers d'œuvres et d'objets de sa collection ; en avril 2021, le tableau entre \
ainsi au Musée national de Corée, à Séoul. Son exposition, la même année, attire des \
foules de visiteurs."""
facture = """
Jeong Seon renverse la logique habituelle de l'encre : la grande paroi rocheuse, que \
l'on attendrait claire, est la masse la plus sombre de la feuille, posée à larges coups \
de pinceau chargés d'encre, répétés de haut en bas comme l'eau qui ruisselle. Les \
crêtes voisines sont modelées de traits plus secs, et les arbres réduits à des taches \
horizontales, à la manière de certains maîtres chinois. La brume n'est pas peinte : \
c'est le papier laissé en réserve, cerné de lavis gris. Le cadrage, très serré, coupe \
le sommet par le bord de la feuille, comme si la montagne débordait du tableau."""
details = [
  "La grande paroi noire du centre, peinte à traits verticaux répétés.",
  "Les minces cascades blanches qui descendent des ravins.",
  "Le toit d'une maison parmi les pins, en bas à droite.",
  "Les branches légères d'un saule, en bas, vers la gauche.",
  "L'inscription et les deux sceaux du peintre, en haut à droite.",
]
themes = ["montagne", "pluie", "brume", "séoul", "paysage"]
anecdote = """
Le mont Inwang se voit toujours depuis le centre de Séoul. Un sentier longe aujourd'hui \
l'ancienne muraille de la ville, qui court sur ses crêtes, et l'on peut y comparer le \
paysage réel au tableau peint il y a plus de deux siècles et demi."""
