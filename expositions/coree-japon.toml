# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « CORÉE ET JAPON » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/coree-japon/). Le nom
#  du fichier donne l'adresse de l'exposition sur le site : /coree-japon.
#
#  Les paravents et les rouleaux sont accrochés sans cadre (cadre = "aucun") ;
#  les céramiques sont présentées en vitrine (cadre = "vitrine"). Les photographies
#  d'objets viennent du Metropolitan Museum et du Cleveland Museum of Art (CC0) ;
#  les peintures sont des reproductions fidèles d'œuvres du domaine public.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 27
nom_court = "Corée et Japon"
mouvement = "Corée et Japon, paravents, céladons et rouleaux"
cadre = "aucun"
couleur = "#3d6b5c"
titre = "Corée et Japon, le vert du céladon et l'or des paravents"
artiste = "Goryeo, Joseon, Jeong Seon, Kim Hong-do, Sōtatsu, Kōrin, Tōhaku…"
dates = "XIIe–XVIIIe siècle"
accroche = "Exposition virtuelle · Musée national de Kyoto"
introduction = """
Six siècles d'art de part et d'autre du détroit de Corée. D'un côté, le vert profond \
des céladons de Goryeo, la blancheur nue des jarres lunes de Joseon, les montagnes \
peintes d'après nature par Jeong Seon et les scènes de village de Kim Hong-do. De \
l'autre, les rouleaux narratifs de l'époque de Heian, les paravents à fond d'or de \
Sōtatsu et de Kōrin, les pins dans la brume de Tōhaku et un plat façonné par Kenzan et \
peint par son frère Kōrin. Dix œuvres, réunies dans un bâtiment inspiré de l'aile \
Heisei Chishinkan du Musée national de Kyoto, dessinée par Taniguchi Yoshio : un grand \
hall lumineux, une longue galerie où se déploient les paravents, et trois salles autour \
d'elle, pour les céramiques, la peinture coréenne et les rouleaux."""
vitrine = "dieux-vent-tonnerre.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Musée national de Kyoto"
ville = "Kyoto, Japon"
architecte = "Katayama Tōkuma ; Taniguchi Yoshio pour l'aile Heisei Chishinkan"
construction = "1895–1897 ; aile Heisei Chishinkan ouverte en 2014"
presentation = """
En 1889, le gouvernement de Meiji décide de fonder trois musées impériaux, à Tokyo, à \
Nara et à Kyoto, pour protéger les trésors des temples et des sanctuaires, éprouvés par \
les bouleversements des débuts de l'ère Meiji. À Kyoto, l'architecte Katayama Tōkuma, \
l'un des premiers Japonais formés à l'architecture occidentale, élève dans le quartier \
de Higashiyama, face au temple Sanjūsangen-dō, un pavillon de brique rouge de style \
néo-baroque français, achevé en 1895 : le musée impérial de Kyoto y ouvre en mai 1897. \
Devenu musée national en 1952, il conserve surtout l'art de l'ancienne capitale, \
peintures, sculptures, calligraphies et céramiques, dont beaucoup sont confiées en \
dépôt par les temples de la ville, comme les Dieux du vent et du tonnerre de Sōtatsu, \
propriété du Kennin-ji. Depuis 2014, les collections sont présentées dans l'aile Heisei \
Chishinkan de Taniguchi Yoshio, l'architecte de l'agrandissement du MoMA à New York : \
un long volume horizontal de pierre et de verre, dont le grand hall baigne dans la \
lumière. Le pavillon de 1895 a alors été rebaptisé Meiji Kotokan."""
ici = """
Le bâtiment d'ARTEON emprunte à l'aile de Taniguchi sa sobriété : murs clairs couleur \
de papier et de pierre, longues perspectives, lumière égale. On entre par le sud dans \
le Grand hall, large de dix-huit mètres et haut de neuf. Au nord s'ouvre la Galerie des \
paravents, longue de trente mètres, où se répondent Kōrin, Tōhaku et Sōtatsu. De là, on \
gagne à l'ouest la Salle des céramiques et ses vitrines, au nord la Salle de la \
peinture coréenne, et à l'est la Salle des rouleaux, consacrée aux récits peints de \
l'époque de Heian."""

