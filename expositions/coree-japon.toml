# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Corée, dynastie Goryeo"
vie = "Corée, 918–1392"
biographie = """
Le royaume de Goryeo est fondé en 918 par le général Wang Geon, qui réunifie la \
péninsule et installe sa capitale à Kaesong ; le nom occidental de la Corée vient du \
sien. Pendant près de cinq siècles, une aristocratie de cour gouverne un État \
profondément bouddhique : les monastères, riches et puissants, commandent des sutras \
copiés à l'or, des peintures religieuses d'une grande finesse et des objets de culte en \
bronze. C'est sous Goryeo que la Corée grave les quelque quatre-vingt mille planches de \
bois du canon bouddhique, la Tripitaka Koreana, toujours conservées au temple Haein-sa, \
et qu'elle imprime en 1377 le plus ancien livre conservé en caractères métalliques \
mobiles, le Jikji, aujourd'hui à la Bibliothèque nationale de France. Le royaume \
entretient des liens étroits avec la Chine des Song, dont il admire la culture et la \
céramique. Au XIIIe siècle, il subit les invasions mongoles et devient vassal de \
l'empire des Yuan. Affaibli, il est renversé en 1392 par le général Yi Seong-gye, \
fondateur de la dynastie Joseon."""
style = """
Les potiers de Goryeo, d'abord inspirés par les céladons chinois, s'en affranchissent \
au XIIe siècle. Ils recherchent un vert bleuté et translucide, et des formes souples, \
parfois sculptées en lotus, en melon ou en animal. Leur grande invention est \
l'incrustation, le sanggam : un décor gravé puis comblé d'argile blanche et noire, sous \
la glaçure. Grues, nuages, saules, roseaux et oiseaux d'eau y composent des paysages \
poétiques. Ces céladons restent le symbole de l'art de Goryeo et une référence pour les \
céramistes coréens d'aujourd'hui."""

[[artistes]]
nom = "Corée, dynastie Joseon"
vie = "Corée, 1392–1910"
biographie = """
Fondée en 1392 par Yi Seong-gye, la dynastie Joseon règne plus de cinq siècles sur la \
Corée depuis sa nouvelle capitale, Hanyang, l'actuelle Séoul. Elle fait du \
néo-confucianisme la doctrine de l'État : examens de fonctionnaires, culte des \
ancêtres, respect des hiérarchies et idéal de frugalité imprègnent la vie de la cour et \
des lettrés, les yangban. Au XVe siècle, le roi Sejong fait créer l'alphabet coréen, le \
hangeul. Le pays traverse ensuite de rudes épreuves : les invasions japonaises de 1592 \
à 1598, puis les invasions mandchoues de 1627 et 1636. Le XVIIIe siècle, sous les rois \
Yeongjo et Jeongjo, est un temps de renouveau, où lettrés et artistes s'intéressent \
davantage à la réalité coréenne, à ses paysages et à ses mœurs. Au XIXe siècle, Joseon \
se ferme au monde, puis subit la pression des puissances étrangères ; le royaume \
devient l'empire de Corée en 1897, avant d'être annexé par le Japon en 1910."""
style = """
À la céramique colorée de Goryeo, Joseon préfère la porcelaine blanche, produite pour \
la cour dans les fours officiels de Gwangju. Elle est souvent nue, ou décorée au bleu \
de cobalt, importé à grand prix, ou à l'oxyde de fer brun. Les formes sont amples, \
sobres, un peu irrégulières, et les potiers acceptent les accidents de la cuisson. La \
jarre lune en est la forme la plus célèbre. Cette esthétique du naturel a séduit les \
maîtres de thé japonais, puis, au XXe siècle, les céramistes occidentaux."""

[[artistes]]
nom = "Jeong Seon"
vie = "Hanyang (Séoul), 1676 – Hanyang, 1759"
biographie = """
Jeong Seon, dont le nom de pinceau est Gyeomjae, naît en 1676 à Hanyang, la capitale de \
Joseon, dans une famille de lettrés de modeste fortune. Il étudie les classiques \
confucéens et se forme à la peinture, qui lui vaut très tôt une réputation. Il occupe \
plusieurs charges officielles, dont celle de magistrat de Yangcheon, à l'ouest de la \
capitale. Il fréquente un cercle de lettrés et de poètes, parmi lesquels Yi \
Byeong-yeon, son ami de toujours, avec qui il échange poèmes et peintures. Dès sa \
jeunesse, il parcourt les monts Kumgang, les « monts de Diamant », au nord-est de la \
péninsule, qu'il peint toute sa vie, notamment dans une grande vue d'ensemble datée de \
1734. Il représente aussi les environs de la capitale, les rives du fleuve Han, les \
pavillons et les vallées où il a vécu, au pied du mont Inwang. Il meurt en 1759, à \
quatre-vingt-trois ans, après une carrière exceptionnellement longue et féconde. Ses \
œuvres sont aujourd'hui partagées entre les musées coréens, dont le Musée national de \
Corée et le musée Kansong, et des collections privées."""
style = """
Jeong Seon est le maître du jingyeong sansu, le « paysage de vue réelle » : au lieu de \
reprendre les montagnes idéales de la peinture chinoise, il peint des sites coréens \
précis, qu'il a parcourus. Il adapte pour cela les techniques chinoises : traits \
verticaux serrés pour les falaises de granit, taches d'encre pour la végétation, forts \
contrastes de noir et de blanc. Ses compositions, souvent resserrées et vues d'en haut, \
donnent une impression de masse et de présence physique. Il a inspiré toute une \
génération de peintres coréens."""

[[artistes]]
nom = "Kim Hong-do"
vie = "Corée, 1745 – vers 1806"
biographie = """
Kim Hong-do, connu sous son nom de pinceau Danwon, naît en 1745 dans une famille sans \
titre de noblesse. Encore enfant, il étudie la peinture auprès du lettré et peintre \
Kang Sehwang, qui restera son protecteur. Il entre jeune au Dohwaseo, le bureau royal \
de peinture, et devient le peintre favori du roi Jeongjo : il participe aux portraits \
officiels du roi Yeongjo puis de Jeongjo, peint des paravents pour le palais, et le roi \
l'envoie dessiner les monts Kumgang pour lui en rapporter les images. En récompense, il \
reçoit des charges de fonctionnaire, dont celle de magistrat du district de Yeonpung. \
Il excelle dans tous les genres : paysages, portraits, peinture bouddhique, fleurs et \
oiseaux, animaux, et surtout scènes de la vie quotidienne, qui ont fait sa célébrité. \
Après la mort de Jeongjo, en 1800, ses dernières années sont plus difficiles, et les \
documents se font rares ; on pense qu'il meurt vers 1806, malade et sans fortune."""
style = """
Kim Hong-do donne à la peinture de genre coréenne ses lettres de noblesse. Ses scènes \
de village, de marché ou d'atelier, peintes sur de petites feuilles, saisissent les \
gestes du travail et des loisirs d'un trait d'encre vif, avec des couleurs légères et \
beaucoup d'humour. Il supprime le décor pour concentrer l'attention sur les \
personnages, toujours croqués avec justesse. Son influence fut immense : son cadet Shin \
Yun-bok et de nombreux peintres populaires ont suivi la voie qu'il avait ouverte."""

[[artistes]]
nom = "Ogata Kōrin"
vie = "Kyoto, 1658 – Kyoto, 1716"
biographie = """
Ogata Kōrin naît en 1658 à Kyoto, deuxième fils d'un riche marchand de soieries, le \
Kariganeya, fournisseur d'étoffes de luxe pour l'impératrice Tōfukumon-in et les \
grandes familles de la cour. Il grandit parmi les tissus et les motifs de kimonos, et \
s'initie au théâtre nô, à la calligraphie et à la cérémonie du thé ; sa famille est \
apparentée à celle de Hon'ami Kōetsu. À la mort de son père, en 1687, il hérite d'une \
fortune qu'il dilapide en quelques années par goût du luxe. Il se tourne alors vers la \
peinture pour vivre, et reçoit en 1701 le titre honorifique de hokkyō. Il séjourne à \
Edo d'environ 1704 à 1709, au service d'un seigneur et de riches marchands, puis rentre \
à Kyoto, où il fait construire une maison-atelier. Il peint des paravents, des rouleaux \
et des éventails, et dessine des décors pour les laques, les étoffes et les céramiques \
de son frère cadet, Kenzan. Il meurt à Kyoto en 1716. Ses motifs, diffusés par des \
livres de modèles, ont nourri les arts décoratifs japonais, puis le japonisme européen."""
style = """
Kōrin porte à son sommet l'art décoratif inauguré par Sōtatsu, qu'il admirait et \
copiait. Ses formes sont stylisées, ses couleurs posées en aplats éclatants sur l'or, \
ses compositions rythmées comme des motifs d'étoffe ; il sait aussi peindre à l'encre \
avec spontanéité. Son nom a donné celui de l'école Rinpa, et les « motifs Kōrin » sont \
devenus, dès le XVIIIe siècle, un répertoire courant des artisans japonais."""

[[artistes]]
nom = "Hasegawa Tōhaku"
vie = "Nanao (province de Noto), 1539 – Edo, 1610"
biographie = """
Hasegawa Tōhaku naît en 1539 à Nanao, dans la province de Noto, au bord de la mer du \
Japon, et il est adopté par une famille de teinturiers. Il commence par peindre des \
images bouddhiques pour les temples de sa région. Vers 1571, à plus de trente ans, il \
s'installe à Kyoto, où il étudie les peintures chinoises conservées dans les temples \
zen, notamment celles de Muqi, et fréquente le maître de thé Sen no Rikyū. Il rivalise \
avec l'école Kanō, qui domine les grandes commandes. Au début des années 1590, son \
atelier décore un temple fondé par Toyotomi Hideyoshi en mémoire de son fils mort en \
bas âge : les peintures d'érables et de cerisiers en fleurs sur fond d'or qui en \
subsistent sont aujourd'hui au Chishaku-in, à Kyoto. Son fils et principal \
collaborateur, Kyūzō, meurt en 1593. Tōhaku reçoit les titres honorifiques de hokkyō \
puis de hōgen. Appelé à Edo par le shogun en 1610, il tombe malade pendant le voyage et \
meurt peu après son arrivée."""
style = """
Tōhaku maîtrise deux manières opposées : la peinture décorative aux couleurs vives sur \
fond d'or, propre à l'époque de Momoyama, et la peinture à l'encre monochrome, héritée \
des maîtres chinois et de Sesshū. Dans celle-ci, il atteint une liberté nouvelle, où le \
vide, la brume et les dégradés de gris comptent autant que les formes. Ses Pins dans la \
brume passent pour le sommet de la peinture à l'encre japonaise."""

[[artistes]]
nom = "Tawaraya Sōtatsu"
vie = "Kyoto, vers 1570 – vers 1640"
biographie = """
On sait très peu de choses de la vie de Sōtatsu, dont on ignore même les dates exactes \
de naissance et de mort. Il dirige à Kyoto, au début du XVIIe siècle, un atelier appelé \
Tawaraya, qui produit des éventails peints, des papiers décorés et des peintures pour \
une clientèle aisée. En 1602, il participe à la restauration des sutras illustrés \
offerts au XIIe siècle par le clan Taira au sanctuaire d'Itsukushima, ce qui le met au \
contact de l'art de Heian. Il collabore avec Hon'ami Kōetsu, calligraphe, potier et \
créateur de laques, figure majeure de la culture de Kyoto : Sōtatsu peint à l'or et à \
l'argent des grues, des cerfs ou des fleurs sur de longs rouleaux, sur lesquels Kōetsu \
calligraphie des poèmes classiques. Sa réputation grandit : il reçoit le titre \
honorifique de hokkyō et travaille pour des aristocrates de la cour et de grands \
temples. Il meurt vers 1640. Son atelier lui survit quelque temps, et les attributions \
entre le maître et ses successeurs restent parfois discutées."""
style = """
Sōtatsu renouvelle la peinture décorative japonaise. Il reprend les sujets de la \
littérature et de la peinture classiques, mais les simplifie en grandes formes colorées \
sur des fonds d'or ou d'argent, avec des cadrages audacieux et de vastes espaces vides. \
Il développe la technique du tarashikomi, des couleurs posées sur un fond encore \
humide. Kōrin, au siècle suivant, puis Sakai Hōitsu ont repris son style : on a donné à \
ce courant le nom de Rinpa, « l'école de Kōrin »."""

[[artistes]]
nom = "Japon, époque de Heian"
vie = "Japon, 794–1185"
biographie = """
L'époque de Heian commence en 794, quand l'empereur Kanmu installe sa capitale à \
Heian-kyō, l'actuelle Kyoto, et s'achève en 1185 avec la victoire du clan Minamoto, qui \
fonde peu après le premier shogunat. Pendant près de quatre siècles, une aristocratie \
de cour, dominée par la famille Fujiwara, cultive un art de vivre raffiné, fait de \
poésie, de musique, de parfums, de calligraphie et d'étiquette. Le Japon prend ses \
distances avec la Chine et invente ses propres formes : les syllabaires kana, qui \
permettent d'écrire la langue japonaise ; une littérature en prose souvent due à des \
femmes, comme le Dit du Genji de Murasaki Shikibu ou les Notes de chevet de Sei \
Shōnagon ; et le yamato-e, la peinture « à la japonaise », consacrée aux paysages, aux \
saisons et à la vie du pays. Les monastères bouddhiques, puissants, commandent eux \
aussi peintures et sculptures. À la fin de la période, les rouleaux illustrés, les \
emaki, connaissent leur premier âge d'or, avant que les guerres civiles ne referment \
l'époque."""
style = """
Les rouleaux narratifs, ou emaki, se déroulent de droite à gauche, section par section, \
entre les mains d'un lecteur. Ils suivent deux manières : la peinture colorée et \
soignée du Dit du Genji, aux pigments épais, pour la littérature de cour ; et le dessin \
à l'encre, vif et mouvementé, plein d'humour, des Chōjū-giga ou des légendes de \
temples. Les peintres restent presque toujours anonymes. Ces rouleaux ont fixé pour des \
siècles les conventions du récit en images au Japon."""

[[artistes]]
nom = "Ogata Kenzan"
vie = "Kyoto, 1663 – Edo, 1743"
biographie = """
Ogata Kenzan naît en 1663 à Kyoto, troisième fils du riche marchand de soieries qui est \
aussi le père de Kōrin, son aîné de cinq ans. À la différence de son frère, il mène une \
vie retirée et studieuse, consacrée aux classiques chinois, au bouddhisme zen, à la \
poésie et à la calligraphie. Il apprend la céramique dans l'entourage de Nonomura \
Ninsei, le grand potier de Kyoto. En 1699, il ouvre son propre four à Narutaki, au \
nord-ouest de la capitale, d'où son nom d'artiste. Il y produit des plats, des bols et \
des récipients pour le thé et la table, dont les décors, peints par lui-même ou par \
Kōrin, associent image et poésie. En 1712, il s'installe dans la ville même de Kyoto, \
où son atelier travaille pour une clientèle plus large. Vers 1731, il part pour Edo, où \
il passe la fin de sa vie, peignant et façonnant encore des céramiques. Il y meurt en \
1743. Son nom, repris par des successeurs, a donné naissance à une lignée de potiers."""
style = """
Kenzan fait de la céramique un support de peinture et de poésie. Ses pièces, de formes \
simples, carrées ou en forme de fleur, portent des décors peints à l'oxyde de fer, au \
cobalt ou aux émaux, d'une liberté de pinceau inédite, accompagnés parfois de poèmes \
calligraphiés. Le dialogue avec son frère Kōrin a fixé une esthétique qui a marqué \
durablement la céramique japonaise, jusqu'aux potiers du XXe siècle, comme l'Anglais \
Bernard Leach, formé au Japon par un potier de la lignée des Kenzan."""
