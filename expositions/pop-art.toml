# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Jane Avril"
artiste = "Henri de Toulouse-Lautrec"
annee = "1899"
image = "jane-avril.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.42691.html"
technique = "Lithographie en cinq couleurs (affiche) sur papier vélin mince, 56 × 38 cm"
collection = "National Gallery of Art, Washington"
note = "La danseuse du Moulin Rouge, un serpent enroulé sur sa robe noire : la dernière affiche que Toulouse-Lautrec dessine pour son amie Jane Avril."
description = """
Sur le fond nu du papier, couleur crème, une danseuse se tord, vue presque en pied. Sa \
longue robe noire, d'un seul aplat, dessine une silhouette sinueuse qui descend \
jusqu'au bas de la feuille, où s'évase un jupon rouge. Un serpent aux anneaux jaunes \
et bleu-vert s'enroule autour de son corps, des genoux jusqu'à l'épaule, et pose sa \
tête sur sa poitrine. Le buste penché, les bras pliés à hauteur du visage, elle écarte \
des mains ouvertes, comme des griffes ; son visage pâle, encadré de cheveux jaunes, \
s'incline sous un énorme chapeau aux plumes rouges qui envahit le haut de l'affiche. À \
gauche, le nom JANE Avril est tracé en lettres noires dessinées à la main. Sur le bord \
droit, en petit, on lit le nom de l'imprimeur, H. Stern, Paris ; en bas à droite, le \
monogramme de l'artiste dans un cercle et la date 1899."""
evocation = """
Jane Avril est l'une des vedettes du Montmartre des années 1890, et l'une des amies \
les plus fidèles de Lautrec. Danseuse fine et étrange, surnommée « la Mélinite », du \
nom d'un explosif, elle tranche sur l'exubérance de La Goulue par une grâce nerveuse \
et mélancolique. Le serpent fait d'elle une charmeuse, une Ève ou une créature fatale, \
et prolonge les ondulations de sa danse. Mais l'image vaut surtout comme signe : un \
corps noir, un nom, trois ou quatre couleurs, que le passant reconnaît au premier coup \
d'œil, de l'autre côté de la rue. C'est déjà ce que fera Andy Warhol avec ses \
vedettes, réduites à un visage et à quelques aplats, et répétées comme des affiches."""
histoire = """
Née Jeanne Beaudon en 1868, Jane Avril connaît une enfance difficile et passe, \
adolescente, plusieurs mois à l'hôpital de la Salpêtrière. Elle danse ensuite au bal \
Bullier, au Moulin Rouge et au Jardin de Paris, où Lautrec la remarque. Il la \
représente souvent : en 1893, il lui consacre l'affiche du Jardin de Paris et la \
montre en spectatrice élégante dans celle du Divan japonais. Cette affiche-ci, \
imprimée en 1899 par H. Stern à Paris, est la dernière qu'il dessine pour elle ; la \
même année, l'artiste, miné par l'alcool, est interné plusieurs semaines dans une \
clinique de Neuilly. Dans ces années-là, la mode de l'« affichomanie » pousse les \
amateurs à collectionner les affiches, que l'on décolle des murs ou que l'on achète \
directement aux imprimeurs."""
facture = """
La lithographie permet à Lautrec de dessiner directement sur la pierre, au crayon ou \
au pinceau, puis de tirer chaque couleur à partir d'une pierre différente : cinq ici. \
Le dessin est réduit à l'essentiel : un contour souple, presque calligraphique, et de \
grandes surfaces de couleur unie qui se lisent de loin. La robe noire est une seule \
masse, sans modelé, sur laquelle le serpent trace une arabesque claire, où le jaune \
glisse vers le bleu par un léger dégradé. Le papier laissé en réserve sert de fond, et \
le lettrage, tracé à la main, fait partie de l'image. Cette économie de moyens, \
héritée des estampes japonaises, est celle de l'affiche moderne, et plus tard des \
sérigraphies du pop art."""
details = [
  "Le serpent jaune et bleu, enroulé autour de la robe, la tête posée sur la poitrine.",
  "Le chapeau aux plumes rouges, qui envahit tout le haut de l'affiche.",
  "Les mains ouvertes et écartées, comme dans un geste de danse ou d'envoûtement.",
  "Le nom JANE Avril, en lettres dessinées à la main, posé sur le vide du fond.",
  "Le monogramme de Lautrec dans un cercle, au-dessus de la date 1899.",
]
themes = ["affiche", "danse", "vedette", "montmartre", "serpent"]
anecdote = """
Jane Avril, qui publia plus tard ses souvenirs, a reconnu devoir à Lautrec une bonne \
part de sa célébrité, née de la première affiche qu'il lui consacra en 1893."""
salle = 2
mur = "nord"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "Lorenzaccio (Sarah Bernhardt)"
artiste = "Alfons Mucha"
annee = "1896–1900"
image = "lorenzaccio.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1973.1018"
technique = "Lithographie en couleurs, réduction de l'affiche publiée dans la revue Les Maîtres de l'Affiche (planche 114, imprimerie Chaix, Paris)"
collection = "Cleveland Museum of Art, Cleveland"
note = "Sarah Bernhardt en pourpoint noir, dans un rôle d'homme : l'affiche de Mucha pour le Lorenzaccio de Musset, dans la réduction publiée par la revue Les Maîtres de l'Affiche."
description = """
Au centre d'une grande feuille aux marges claires, une bande verticale très étroite \
contient toute l'affiche. Un jeune homme aux cheveux bruns et courts, vêtu d'un \
pourpoint sombre et d'un ample manteau brun aux manches bouffantes, se tient debout, \
pensif, une main portée à la bouche ; de l'autre, il serre contre lui un livre à la \
reliure verte. Une dague pend à sa ceinture brodée. Derrière lui, un fond de \
feuillages dorés et de motifs de brocart s'inscrit dans une arcade, bordée des mots \
SARAH BERNHARDT, ANNO DOMINI et MDCCCXCVI. En haut, deux dragons aux ailes déployées, \
l'un vert pâle, l'autre blanc, s'acharnent sur un écusson d'or semé de boules rouges. \
Un cartouche annonce le titre, LORENZACCIO, pièce d'Alfred de Musset, et un autre, en \
bas, le Théâtre de la Renaissance. Dans la marge, une légende indique Les Maîtres de \
l'Affiche, planche 114."""
evocation = """
Sarah Bernhardt est la première grande vedette moderne : sa voix, ses toilettes, ses \
caprices et ses tournées font la une des journaux du monde entier, et elle surveille \
de près son image. En 1896, à plus de cinquante ans, elle joue Lorenzo de Médicis, le \
jeune homme qui, dans la Florence du XVIᵉ siècle, se fait le compagnon de débauche de \
son cousin, le duc Alexandre, pour mieux l'assassiner. Mucha la montre méditant, la \
main sur les lèvres, comme hésitant au seuil du crime ; le dragon qui mord les armes \
des Médicis est souvent lu comme l'image de la tyrannie. L'actrice, son nom et son \
rôle se fondent en une icône, comme le feront plus tard les stars de cinéma \
sérigraphiées par Warhol."""
histoire = """
Écrit en 1834, le Lorenzaccio d'Alfred de Musset passait pour injouable : trop long, \
trop de personnages, trop de décors. Sarah Bernhardt le crée enfin sur scène en \
décembre 1896, dans une adaptation d'Armand d'Artois, au Théâtre de la Renaissance, \
qu'elle dirige alors. Depuis le succès de Gismonda, au début de 1895, Mucha dessine \
ses affiches, imprimées par F. Champenois, dont le nom figure au bas de la \
composition. L'affiche originale, haute de deux mètres environ, était collée dans les \
rues de Paris. La feuille présentée ici en est une réduction, publiée dans Les Maîtres \
de l'Affiche, une revue mensuelle lancée en 1895 par l'imprimerie Chaix sous la \
direction de Jules Chéret, qui offrait aux collectionneurs, jusqu'en 1900, les \
meilleures affiches d'Europe en petit format."""
facture = """
Mucha reprend ici le format qu'il a inventé pour Gismonda : une bande verticale très \
étroite qui fait de l'actrice une figure en pied, presque à sa taille réelle dans \
l'affiche originale, comme un saint dans un vitrail. Le contour est sombre et \
régulier, les couleurs sont sourdes : bruns, ors, verts pâles, avec quelques touches \
de rouge sur l'écusson et à la jarretière. Le fond se couvre de motifs de brocart et \
de rinceaux, et le lettrage, aux capitales dessinées, s'intègre au décor de l'arcade. \
La réduction, tirée elle aussi en lithographie, garde la richesse de la gamme colorée. \
Aplats cernés et texte mêlé à l'image annoncent tout le graphisme du XXᵉ siècle."""
details = [
  "La main portée aux lèvres, geste d'hésitation de Lorenzo avant le meurtre.",
  "Le dragon vert pâle qui mord l'écusson d'or aux boules rouges des Médicis.",
  "Le nom SARAH BERNHARDT et la date MDCCCXCVI, inscrits autour de l'arcade.",
  "La dague à la ceinture et le livre à la reliure verte, serré contre le corps.",
  "La légende de la marge : Les Maîtres de l'Affiche, planche 114, imprimerie Chaix.",
]
themes = ["affiche", "théâtre", "vedette", "art nouveau", "travesti"]
anecdote = """
Sarah Bernhardt a joué plusieurs rôles d'hommes : après Lorenzo, elle sera Hamlet en \
1899, puis le fils de Napoléon dans L'Aiglon d'Edmond Rostand, en 1900."""
salle = 2
mur = "nord"
place = 5
largeur = 2.2

[[oeuvres]]
titre = "Pour le dîner du dimanche (For Sunday's Dinner)"
artiste = "William Michael Harnett"
annee = "1888"
image = "for-sundays-dinner.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/111377"
technique = "Huile sur toile, 94,3 × 53,6 cm"
collection = "Art Institute of Chicago, Chicago"
note = "Un poulet plumé pend à une vieille porte de bois : un trompe-l'œil si précis qu'on croit pouvoir toucher la peau grenue de la volaille."
description = """
Sur une porte de planches peintes d'un vert très sombre, presque noir, un poulet est \
suspendu la tête en bas, attaché par une patte à un clou au moyen d'une ficelle. \
L'autre patte, jaune, s'écarte vers la gauche, les doigts crispés. Le corps, presque \
entièrement plumé, montre une peau jaunâtre et grenue où restent accrochés quelques \
duvets blancs ; le cou, tranché, pend jusqu'en bas, la tête rouge sombre tournée vers \
le sol. Une ombre douce se projette sur la porte, à droite. Sur les côtés, de lourdes \
ferrures de laiton : deux pentures à droite, en haut et en bas, une double plaque de \
serrure découpée à gauche. Des clous, des trous, des fentes et une plume tombée \
parsèment le bois usé. En bas à gauche, on lit la signature HARNETT et la date 1888."""
evocation = """
Le titre parle d'un repas de famille : le poulet du dimanche, que l'on prépare comme à \
la ferme. La porte aux planches rugueuses, aux ferrures anciennes et aux clous \
rouillés, évoque une cuisine de campagne, et avec elle la nostalgie d'une Amérique \
rurale et plus simple, au moment où les villes grandissent à toute vitesse. Mais \
l'image est aussi crue : le cou tranché, la chair nue, les plumes oubliées rappellent \
la mort de l'animal, comme dans les natures mortes de gibier hollandaises. Harnett ne \
raconte pas d'histoire ; il présente un objet, seul, de face, à sa taille réelle. Ce \
goût pour l'objet banal promu vedette sera celui des peintres pop, de Warhol à \
Oldenburg."""
histoire = """
Né en Irlande et élevé à Philadelphie, Harnett a d'abord été graveur sur argenterie \
avant de devenir peintre de natures mortes. Après six années passées en Europe, \
surtout à Munich, il rentre en 1886 aux États-Unis et s'installe à New York. Sa \
renommée tient alors à After the Hunt, grand trompe-l'œil de gibier et d'armes de \
chasse accroché dans un saloon new-yorkais, où, dit-on, les clients venaient vérifier \
si les objets étaient réels. For Sunday's Dinner date de ces années new-yorkaises, \
quatre ans avant sa mort, en 1892. Oublié après lui, Harnett n'est redécouvert qu'à la \
fin des années 1930, au moment où l'Amérique cherche les racines d'un art national. Le \
tableau appartient aujourd'hui à l'Art Institute de Chicago."""
facture = """
Le trompe-l'œil repose sur quelques règles que Harnett applique avec rigueur : un fond \
plat et proche, ici la porte, qui interdit toute profondeur ; des objets à leur taille \
réelle ; une lumière latérale qui projette des ombres nettes. Dans cet espace étroit, \
le peintre détaille chaque matière : les fibres et les fentes du bois, le métal piqué \
des ferrures, la peau de la volaille hérissée de pores et de bouts de plumes, le duvet \
blanc posé en petites touches épaisses. La touche disparaît presque, comme si la \
peinture voulait se faire oublier. Le format vertical et étroit, celui d'un panneau de \
porte, renforce l'illusion d'un objet accroché là, devant nous."""
details = [
  "Les petits duvets blancs restés accrochés à la peau grenue.",
  "La patte écartée, aux doigts crispés, qui trace une diagonale vers la gauche.",
  "Les pentures de laiton, à droite, dont la forme répond à celle du poulet.",
  "La double plaque de serrure découpée et la plume tombée, à gauche.",
  "La signature et la date, en bas à gauche, comme inscrites dans le bois.",
]
themes = ["trompe-l'œil", "nature morte", "cuisine", "objet", "campagne"]
anecdote = """
Harnett avait aussi peint des billets de banque ; selon un récit souvent rapporté, les \
services du Trésor américain, chargés de traquer la fausse monnaie, l'auraient mis en \
garde contre ces images trop ressemblantes."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Porte-lettres au valet de cœur (Card Rack with a Jack of Hearts)"
artiste = "John Frederick Peto"
annee = "vers 1895"
image = "card-rack.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1973.30"
technique = "Huile sur toile"
collection = "Cleveland Museum of Art, Cleveland"
note = "Lettres, carte à jouer, portrait de Lincoln et coupures de journaux glissés sous les rubans d'un porte-lettres : le tableau d'affichage d'une vie ordinaire."
description = """
Sur une planche peinte d'un vert presque noir, des rubans bruns, cloués en carré et \
croisés en X, retiennent une petite collection de papiers. En haut, une carte à jouer, \
le valet de cœur, dépasse derrière une enveloppe vert d'eau et un carnet vert à la \
tranche rouge, posé de travers. En bas à gauche, un papier jaune plié, une carte brune \
et une petite photographie : le portrait d'Abraham Lincoln, reconnaissable à sa barbe. \
À droite, une enveloppe bleue est glissée sous un ruban dont l'extrémité effilochée \
pend dans le vide. Autour, d'autres traces : des coins de papier jaune arrachés, \
encore retenus par leurs punaises, en haut à gauche ; une carte blanche ; des chiffres \
griffonnés ; les initiales J.F.P. gravées dans le bois, en haut à droite ; enfin, en \
bas, une étiquette déchirée, une coupure de journal, une allumette et un mégot."""
evocation = """
Les porte-lettres étaient les tableaux d'affichage du XIXᵉ siècle : on y glissait le \
courrier, les cartes, les coupures de journaux, tout ce qu'il fallait garder sous la \
main. Peto en fait le portrait d'une existence à travers ses papiers, et le reflet \
d'un désir très humain de collectionner et de se souvenir. Rien n'y est précieux : \
tout est usé, déchiré, effiloché, comme si le temps avait passé sur ces objets. La \
photographie de Lincoln, le président assassiné en 1865, que Peto place souvent dans \
ses tableaux, ajoute une note de deuil et de mémoire nationale. Ce mélange d'imprimés \
anonymes, de carte à jouer et de visage célèbre annonce les assemblages de Robert \
Rauschenberg et les panneaux d'images du pop art."""
histoire = """
Peto se forme à l'Académie des beaux-arts de Pennsylvanie, à Philadelphie, et se lie \
avec Harnett, dont il admire le travail. Mais il n'en connaît pas le succès. En 1889, \
il s'installe à Island Heights, petite station balnéaire du New Jersey, où il peint \
loin des expositions et joue du cornet dans les réunions religieuses de l'été. À sa \
mort, en 1907, il est presque inconnu. Plusieurs de ses tableaux reçoivent ensuite de \
fausses signatures de Harnett, plus coté, et ce n'est qu'autour de 1950 que \
l'historien Alfred Frankenstein rend à chacun ses œuvres. Peto a peint des \
porte-lettres pendant toute sa carrière ; celui-ci, des années 1890, est aujourd'hui \
conservé au Cleveland Museum of Art."""
facture = """
Peto peint plus librement que Harnett. Ses objets ont des contours un peu flous, des \
couleurs assourdies posées en touches visibles, et une lumière douce qui les baigne \
plutôt qu'elle ne les découpe. L'illusion tient d'abord à la composition : tout est à \
plat, sur le plan même du tableau, si bien qu'aucun objet ne trahit la surface de la \
toile. Les ombres portées des rubans et des papiers, les bords cornés, les déchirures \
et les fils qui pendent créent le relief ; même le mégot, en bas, semble prêt à tomber \
du cadre. Les taches de couleur, le vert du carnet, le bleu de l'enveloppe, le jaune \
du papier, se répondent sur le fond sombre comme dans une composition abstraite."""
details = [
  "Le valet de cœur qui dépasse en haut, derrière l'enveloppe vert d'eau.",
  "Le petit portrait photographique d'Abraham Lincoln, en bas du porte-lettres.",
  "Les initiales J.F.P., comme gravées au couteau dans le bois, en haut à droite.",
  "Les coins de papier jaune arrachés, restés sous leurs punaises.",
  "Le mégot et l'allumette, en bas, qui semblent sortir du tableau.",
]
themes = ["trompe-l'œil", "papiers", "mémoire", "lincoln", "objet"]
anecdote = """
Les porte-lettres de Peto ont d'abord eu un usage commercial : dès 1879, il en peint \
un pour une compagnie de charbon de Philadelphie, qui l'expose comme une enseigne."""
salle = 3
mur = "ouest"
place = 3
largeur = 2.0

[[oeuvres]]
titre = "Imitation"
artiste = "John Haberle"
annee = "1887"
image = "imitation.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.106596.html"
technique = "Huile sur toile, 25,4 × 35,6 cm"
collection = "National Gallery of Art, Washington"
note = "Un billet d'un dollar, un billet de cinquante cents, des timbres et des pièces, tous peints, jusqu'au cadre : le titre avoue le tour de passe-passe."
description = """
Tout ce que l'on voit est peint, y compris le cadre. Une baguette de bois clair, aux \
veines orangées, entoure un fond sombre, brun violacé, sur lequel sont posés deux \
billets de banque américains. Le plus grand, un billet d'un dollar froissé, usé, \
déchiré sur les bords, montre au centre le portrait de George Washington en médaillon, \
le mot ONE, des numéros de série rouges et l'inscription Washington, D.C. Par-dessus, \
un petit billet de cinquante cents, la « monnaie fractionnaire » de l'époque, porte un \
portrait d'homme et un sceau doré. En haut à droite, une pièce de cuivre ; à côté, la \
signature J. Haberle, New Haven, Ct., 1887. Sur le cadre lui-même, en bas à gauche, \
débordent une petite photographie d'homme barbu, des timbres-poste, l'un bleu, l'autre \
olive, une pièce d'argent et des fragments de timbres ; en bas, une étiquette porte le \
nom de l'artiste."""
evocation = """
Le titre, Imitation, est un défi lancé au spectateur : tout ici est faux, et pourtant \
tout semble pouvoir se saisir du bout des doigts. Peindre de l'argent, c'est jouer sur \
deux illusions à la fois : celle de la peinture, qui fait croire à un objet, et celle \
de la monnaie de papier, qui fait croire à une valeur. Dans l'Amérique de la fin du \
XIXᵉ siècle, où l'on débat âprement de la valeur du papier-monnaie face à l'or, ces \
billets fripés, passés de main en main, parlent aussi de la vie quotidienne et des \
petites sommes. Soixante-quinze ans plus tard, en 1962, Andy Warhol peindra à son tour \
des billets d'un dollar, alignés comme sur une planche d'imprimerie."""
histoire = """
John Haberle passe presque toute sa vie à New Haven, dans le Connecticut. Formé comme \
graveur et lithographe, il travaille aussi au musée Peabody de l'université Yale, où \
il dessine pour le paléontologue Othniel Charles Marsh. Ses tableaux d'argent, exposés \
à partir du milieu des années 1880, font sensation par leur précision. Ils frôlent \
l'interdit : la loi américaine punit la reproduction de la monnaie, et le Trésor \
veille. Imitation, signé et daté de 1887, appartient à cette série où Haberle pousse \
l'illusion le plus loin possible, jusqu'à peindre le cadre et les objets qui semblent \
y être collés. Le tableau est aujourd'hui conservé à la National Gallery of Art de \
Washington."""
facture = """
Haberle pousse la précision plus loin encore que Harnett. Il reproduit au pinceau les \
guillochis des billets, leurs lettres ornées, les numéros, les signatures et la \
gravure fine des portraits, à une échelle si petite qu'il faut s'approcher pour la \
voir. Il imite aussi l'usure : plis, cassures du papier, taches, déchirures. Le cadre \
peint prolonge le jeu : les timbres et la photographie paraissent collés sur la \
baguette, hors du tableau, comme si l'illusion débordait dans notre monde. Le fond \
sombre et neutre, sans profondeur, et la lumière égale empêchent l'œil de mesurer \
l'espace ; tout semble posé sur la surface même de la toile, à sa taille réelle."""
details = [
  "Le portrait de George Washington, au centre du billet d'un dollar froissé.",
  "Les numéros de série rouges, peints chiffre par chiffre.",
  "La petite photographie d'un homme barbu, posée sur le cadre peint.",
  "Les timbres-poste et leurs fragments, qui débordent sur la baguette.",
  "La signature J. Haberle, New Haven, en haut à droite du fond sombre.",
]
themes = ["trompe-l'œil", "argent", "billet", "illusion", "objet"]
anecdote = """
Lorsqu'un de ses tableaux d'argent fut exposé à Chicago, un critique affirma que les \
billets étaient de vrais billets collés sur la toile ; Haberle fit examiner le \
tableau, qui se révéla entièrement peint."""
salle = 3
mur = "nord"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Nature morte, fraises, noix, etc. (Still Life—Strawberries, Nuts, &c.)"
artiste = "Raphaelle Peale"
annee = "1822"
image = "strawberries-nuts.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/120154"
technique = "Huile sur panneau de bois, 41,1 × 57,8 cm"
collection = "Art Institute of Chicago, Chicago"
note = "Une coupe de verre remplie de fraises, une orange, des noix et de la porcelaine de Chine : l'abondance de la jeune Amérique, rangée sur une tablette."
description = """
Sur une tablette de bois nue, devant un fond sombre, des objets sont alignés de gauche \
à droite comme sur une scène. Au centre, une grande coupe de verre sur pied, fermée \
d'un couvercle à bouton, est remplie à ras bord de fraises rouges serrées les unes \
contre les autres. Devant elle, dans une large jatte de porcelaine blanche, une orange \
garnie de deux feuilles vertes trône sur un lit de noisettes et d'amandes. À gauche, \
un sucrier à deux anses, orné d'un médaillon où l'on voit une figure assise près d'une \
ancre, devant la mer et un navire, repose sur une pile de soucoupes. À droite, un pot \
à crème blanc au bord doré et, sur la tablette, une petite grappe de fruits secs \
encore attachés à leur tige, sans doute des raisins, qui retombe jusqu'au bord. En bas \
à droite, on lit la signature Raphaelle Peale Pinxt 1822."""
evocation = """
Raphaelle Peale peint ici des richesses modestes, mais choisies. La porcelaine \
fabriquée en Chine pour le marché américain est un luxe importé, signe de la \
prospérité et de la puissance commerciale de la jeune république ; l'ancre, attribut \
traditionnel de l'Espérance, rappelle les navires qui la rapportent. Les fraises \
pourraient venir d'une serre chaude, cultivées hors saison, une expérience que la \
famille Peale menait dans sa ferme près de Philadelphie. L'ordre parfait des objets, \
alignés comme des marchandises en vitrine, fait de la nature morte un éloge du confort \
domestique et du commerce. Un siècle et demi plus tard, les boîtes de soupe de Warhol \
diront à leur tour l'abondance américaine, en rangées."""
histoire = """
Raphaelle Peale est le fils de Charles Willson Peale, peintre, naturaliste et \
fondateur à Philadelphie de l'un des premiers musées des États-Unis. Comme ses frères, \
prénommés Rembrandt, Rubens ou Titian, il reçoit le nom d'un grand peintre et apprend \
le métier auprès de son père. Il est l'un des premiers artistes américains à se \
spécialiser dans la nature morte, genre alors peu estimé, et l'expose dès les années \
1810 à l'Académie des beaux-arts de Pennsylvanie. Ce panneau de 1822 date des \
dernières années de sa vie, marquées par la maladie et la gêne ; il meurt en 1825. \
Nourri des natures mortes hollandaises du XVIIᵉ siècle, son art ouvre la voie aux \
trompe-l'œil de Harnett et de Peto, accrochés dans la même salle."""
facture = """
Peale peint sur un panneau de bois, au grain lisse, qui permet une exécution \
minutieuse et presque invisible. La composition est d'une grande simplicité : une \
tablette horizontale, un fond sombre, une lumière venue de la gauche qui fait briller \
le verre et la porcelaine et modèle chaque fruit. Le peintre distingue avec soin les \
matières : la transparence de la coupe et les reflets de son couvercle, la peau \
grumeleuse de l'orange, le brillant des noisettes, l'émail blanc de la jatte, le décor \
peint du sucrier. Les objets se chevauchent à peine, chacun gardant sa place, ce qui \
donne au tableau un calme solennel, entre l'étalage du marchand et l'autel."""
details = [
  "Les fraises entassées derrière le verre, légèrement déformées par sa courbure.",
  "L'orange aux deux feuilles, posée comme une couronne sur les noix.",
  "Le médaillon du sucrier en porcelaine de Chine, avec son ancre et son navire.",
  "Le pot à crème au bord doré, qui se détache sur le fond sombre.",
  "La signature Raphaelle Peale Pinxt 1822, tracée au bord de la tablette.",
]
themes = ["nature morte", "fruits", "porcelaine", "abondance", "commerce"]
anecdote = """
Raphaelle Peale a aussi peint une célèbre « tromperie », Venus Rising from the Sea—A \
Deception : une serviette blanche, peinte en trompe-l'œil, semble suspendue devant un \
tableau de nu qu'elle cache presque entièrement."""
salle = 3
mur = "nord"
place = 3
largeur = 2.4

[[oeuvres]]
titre = "Very Slippy Weather (Temps très glissant)"
artiste = "James Gillray"
annee = "1808"
image = "very-slippy-weather.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.96111.html"
technique = "Eau-forte et burin coloriés à la main sur papier vélin, d'après une idée du révérend John Sneyd ; cuivre de 26,1 × 20,5 cm"
collection = "National Gallery of Art, Washington"
note = "Un vieux monsieur glisse sur le verglas devant la boutique où Gillray vend ses caricatures, exposées en vitrine aux yeux de tout Londres."
description = """
Une rue pavée de Londres, en hiver. Au premier plan, un vieil homme chauve, en habit \
vert, gilet rayé et culotte jaune, tombe à la renverse sur le trottoir glissant : une \
jambe bottée s'envole, son chapeau part en arrière avec sa perruque, sa canne lui \
échappe, des pièces d'or roulent sur le pavé. Il tient encore à la main un \
thermomètre. Un petit chien aboie à gauche, un gamin en veste violette rit à droite. \
Derrière lui, des passants lui tournent le dos : un élégant à monocle, un officier en \
habit rouge coiffé d'un immense bicorne à plumet, un homme en tricorne, un autre en \
manteau brun. Captivés, ils regardent la vitrine d'une boutique couverte d'estampes \
coloriées, sur trois rangs, dont on lit les titres. Au-dessus brille l'enseigne dorée \
HUMPHREY ; à droite, derrière la porte du numéro 27, un client en chapeau observe la \
rue."""
evocation = """
Gillray met en scène sa propre boutique : la vitrine de Hannah Humphrey, son éditrice, \
où ses estampes nouvelles attiraient chaque jour les badauds. Les passants s'y \
pressent comme devant un écran, si absorbés qu'ils ne voient pas le vieillard qui \
tombe derrière eux. Le gag est double : la chute, ressort éternel de la farce, et le \
thermomètre que la victime brandit, comme pour vérifier qu'il gèle bien. Mais l'image \
dit surtout la place prise par la caricature dans le Londres de 1800 : une image \
populaire, vendue en feuilles, regardée dans la rue par toutes les classes, de \
l'officier au gamin. C'est déjà la culture de masse que célébrera le pop art, un \
siècle et demi plus tard."""
histoire = """
À la fin du XVIIIᵉ siècle, Londres est la capitale de la caricature, et James Gillray \
en est le maître. Ses estampes, qui ridiculisent le roi George III, les ministres et \
Napoléon, sont éditées et vendues par Hannah Humphrey, chez qui il loge. En 1797, la \
boutique s'installe au 27, St James's Street, au cœur du quartier des clubs élégants. \
Very Slippy Weather est publiée le 10 février 1808, comme l'indique la ligne gravée \
sous l'image. L'idée en revient au révérend John Sneyd, un ami de Gillray, amateur qui \
lui fournissait des sujets. Dans la vitrine, on reconnaît plusieurs de ses planches à \
succès, dont Taking Physick ou Tiddy-Doll, où Napoléon apparaît en boulanger qui \
enfourne des rois en pain d'épice. Trois ans plus tard, la maladie mentale mettra fin \
à sa carrière."""
facture = """
Gillray grave sur cuivre à l'eau-forte, en dessinant librement à la pointe dans le \
vernis, puis renforce certains traits au burin. Le trait est vif, nerveux, plein \
d'accidents : visages grimaçants, plis des vêtements, pavés ronds de la chaussée. Le \
coloriage est fait ensuite à la main, feuille par feuille, à l'aquarelle, par des \
coloristes au service de l'éditrice : vert de l'habit, rouge de l'uniforme, jaune de \
la culotte et de l'encadrement. La composition est construite comme une scène de \
théâtre, avec la chute au premier plan, le public au second et la vitrine en décor. \
Les petites estampes de la vitrine, dessinées en miniature avec leurs titres, forment \
une image dans l'image."""
details = [
  "Le thermomètre que le vieil homme brandit dans sa chute.",
  "Le chapeau qui s'envole avec la perruque, et les pièces d'or qui roulent sur le pavé.",
  "Les caricatures de la vitrine, dont on lit les titres, comme Taking Physick.",
  "L'officier au grand bicorne à plumet, qui ne se retourne même pas.",
  "Le petit chien qui aboie et le gamin qui rit, de part et d'autre du vieillard.",
]
themes = ["caricature", "rue", "londres", "humour", "estampe"]
anecdote = """
Le nom de Hannah Humphrey brille en lettres d'or au-dessus de la vitrine : Gillray, \
qui travailla presque uniquement pour elle à partir des années 1790, mourut en 1815 \
dans cette même maison de St James's Street."""
salle = 4
mur = "est"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "Little Nemo in Slumberland : l'ascension du grand pôle Nord (Climbing the Great North Pole)"
artiste = "Winsor McCay"
annee = "1907"
image = "little-nemo-north-pole.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.142154.html"
technique = "Plume, pinceau et encre noire sur traits de crayon, sur carton en deux parties, 70,5 × 54,6 cm (dessin)"
collection = "National Gallery of Art, Washington"
note = "Le dessin original d'une page du dimanche : Nemo et ses compagnons gravissent le pôle Nord, d'où soufflent toutes les neiges, avant le réveil dans le lit."
description = """
La grande feuille, dessinée à l'encre noire sur un carton jauni, compte treize cases. \
En haut, le titre LITTLE NEMO IN SLUMBERLAND s'étire en grandes lettres blanches d'où \
pendent des glaçons. Dans un palais de glace aux voûtes ruisselantes de stalactites, \
un vieillard au long nez et au bonnet pointu montre à deux enfants emmitouflés, Nemo \
et une petite fille, un pilier immense : le grand pôle Nord, « haut de mille pieds », \
d'où partent toutes les neiges et tous les vents. Les enfants gravissent l'escalier \
qui s'enroule autour. Au troisième rang, deux tuyaux géants, l'un en forme de cloche, \
crachent l'eau et le vent qui la change en neige ; la tempête se lève et envahit les \
cases de flocons blancs sur fond noir. Au dernier rang, les enfants se perdent dans la \
neige, puis Nemo se réveille dans son lit, grondé pour avoir rejeté ses couvertures."""
evocation = """
Chaque dimanche, de 1905 à 1911, dans le New York Herald, Nemo, petit garçon dont le \
nom latin signifie « personne », part en rêve pour le royaume de Slumberland, et \
chaque page s'achève sur son réveil. Ici, le rêve tourne au froid et à la peur : \
l'escalier glissant, la montre gelée, la neige qui engloutit les enfants traduisent la \
sensation du dormeur qui a repoussé ses draps. L'explication finale, prosaïque et \
drôle, ramène au monde réel. McCay fait de la page de journal, image bon marché jetée \
dès le lundi, un spectacle féerique. Lichtenstein et Warhol puiseront à leur tour dans \
cette culture des comics du dimanche, dont ils copieront les héros, les bulles et les \
couleurs d'imprimerie."""
histoire = """
Little Nemo in Slumberland paraît pour la première fois le 15 octobre 1905 dans le \
supplément du dimanche en couleurs du New York Herald. Cette planche, marquée d'un \
copyright de 1907 au nom du journal, porte dans la marge la mention au crayon « Mar 3 \
», sans doute sa date de parution, le dimanche 3 mars 1907. McCay remettait au journal \
ses dessins en noir et blanc, à grande échelle ; les graveurs et les imprimeurs du \
Herald préparaient ensuite les couleurs, en suivant les indications écrites dans les \
marges. Le dessin, fait de deux cartons assemblés, a gardé ces annotations d'atelier, \
précieuses pour comprendre la fabrication des journaux illustrés. Il est aujourd'hui \
conservé à la National Gallery of Art de Washington."""
facture = """
McCay dessine d'abord au crayon, puis encre à la plume des contours fins et réguliers \
et remplit au pinceau les grandes masses noires. La planche est pensée pour la \
couleur, absente ici : les notes écrites en haut et en bas de la feuille précisent que \
le pôle et les personnages doivent être imprimés avec la seule plaque noire, et « le \
reste dans la plaque bleue ». Le noir et blanc pur révèle d'autant mieux la virtuosité \
du dessinateur : architecture de glace en perspective, stalactites innombrables, \
flocons rendus par des centaines de petits cercles blancs sur fond noir. La taille des \
cases varie, et les dernières, envahies par la neige, deviennent presque abstraites \
avant le retour au lit."""
details = [
  "Le titre de la page, dont chaque lettre porte des glaçons.",
  "L'escalier en spirale qui s'enroule autour du pôle, case après case.",
  "Les deux tuyaux géants qui fabriquent la neige, au troisième rang.",
  "Les flocons dessinés un à un, en petits cercles blancs, sur fond noir.",
  "Les instructions pour l'imprimeur, écrites à la main en haut et en bas de la feuille.",
]
themes = ["bande dessinée", "rêve", "neige", "enfance", "journal"]
anecdote = """
À partir de 1906, McCay se produit aussi sur les scènes de music-hall, où il dessine à \
toute vitesse devant le public ; c'est là qu'il présentera plus tard ses premiers \
dessins animés."""
salle = 4
mur = "est"
place = 3
largeur = 2.4

[[oeuvres]]
titre = "Fantômas"
artiste = "Juan Gris"
annee = "1915"
image = "fantomas.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.56101.html"
technique = "Huile sur toile, 59,8 × 73,3 cm"
collection = "National Gallery of Art, Washington"
note = "Un roman populaire, un journal, une pipe et un compotier sur une table : la nature morte cubiste s'ouvre à la culture des kiosques."
description = """
Sur une table de bois aux veines peintes, vue à la fois de face et d'en haut, des \
objets se superposent en plans découpés, comme des papiers collés les uns sur les \
autres. À gauche, la couverture verte d'un roman porte le titre FANTÔMAS en lettres \
noires et un masque noir ; dessous, des colonnes de texte et, à côté, le nombre 65 \
cerclé de blanc. Au centre et à droite, un quotidien plié laisse lire LE JOURNAL, deux \
fois. Une pipe noire se détache sur un fond vert. Un verre à pied et un compotier ne \
sont plus que des contours blancs, tracés comme à la craie, qui traversent les plans. \
En haut, une plinthe de bois mouluré et un mur mauve ; à droite, un rideau rouge ; en \
bas à droite, un tissu à losanges gris et noirs. Des touches de jaune, de bleu et de \
vert éclatent sur l'ensemble."""
evocation = """
Fantômas, « le génie du crime », est le héros noir d'une série de romans populaires de \
Pierre Souvestre et Marcel Allain, publiés à partir de 1911 et portés à l'écran par \
Louis Feuillade en 1913 et 1914. Bon marché, vendus sous des couvertures criardes, ces \
romans enchantent les poètes d'avant-garde : Guillaume Apollinaire et Max Jacob, amis \
de Gris, fondent une « Société des amis de Fantômas ». En plaçant le roman de gare et \
le quotidien à côté de la pipe et du compotier, Gris fait de la culture des kiosques \
un sujet de peinture, à égalité avec les objets nobles de la nature morte. Le masque, \
figure du déguisement, dit aussi le jeu du tableau, où tout est imitation et \
faux-semblant."""
histoire = """
Juan Gris peint Fantômas à Paris en 1915, en pleine guerre. Espagnol, il n'est pas \
mobilisé, mais ses amis sont au front et son marchand, Daniel-Henry Kahnweiler, \
citoyen allemand, a dû quitter la France ; ses biens ont été mis sous séquestre. Gris \
vit alors dans une grande gêne. Depuis 1912, à la suite de Picasso et de Braque, il a \
pratiqué le papier collé, fait de journaux, de papiers peints et d'étiquettes. En \
1915, il revient à la peinture à l'huile, mais en imitant au pinceau les effets du \
collage : faux bois, coupures de journal, motifs imprimés. Le tableau, signé en bas à \
gauche, appartient à cette série de natures mortes. Il est aujourd'hui conservé à la \
National Gallery of Art de Washington."""
facture = """
Gris construit le tableau comme un collage, mais tout est peint. Les grands plans aux \
bords nets se chevauchent, ombrés d'un léger halo sombre qui les détache comme des \
feuilles de papier posées les unes sur les autres. Le bois de la table, rendu en fines \
stries régulières, imite les papiers « faux bois » que les cubistes collaient dans \
leurs compositions. Les lettres du journal et du roman sont peintes comme des \
fragments imprimés, coupés par le bord des plans. Les objets eux-mêmes ne sont plus \
que des contours blancs, posés par-dessus les aplats de couleur. Le résultat tient à \
la fois du trompe-l'œil et de l'abstraction, et rejoint, par un autre chemin, les \
peintres de la salle voisine."""
details = [
  "La couverture verte du roman, avec son titre FANTÔMAS et son masque noir.",
  "Les lettres LE JOURNAL, coupées et répétées, comme des fragments de presse.",
  "La pipe noire sur son fond vert, à droite du tableau.",
  "Les contours blancs d'un verre et d'un compotier, qui traversent les plans.",
  "Les fausses veines de bois, qui imitent un papier collé.",
]
themes = ["cubisme", "roman populaire", "journal", "nature morte", "masque"]
anecdote = """
Avant de se consacrer à la peinture, Gris gagnait sa vie à Paris en dessinant pour des \
journaux satiriques comme L'Assiette au beurre : l'image populaire fut son premier \
métier."""
