[[oeuvres]]
titre = "Petite danse (Mz. 65. Kleiner Tanz)"
artiste = "Kurt Schwitters"
annee = "1920"
image = "little-dance.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1963.1"
technique = "Collage de papiers imprimés, déchirés et découpés, monté sur une feuille de carton"
collection = "Cleveland Museum of Art, Cleveland"
note = "Tickets, emballage de bonbons et lettres d'affiches : avec les déchets de la ville, Schwitters compose une petite danse de couleurs."
description = """
Au centre d'une feuille de montage grise, un petit rectangle est couvert de papiers \
déchirés et découpés, collés en tous sens. Les tons dominants sont le beige, le brun \
et le gris : papier kraft, carton, papiers d'emballage froissés. Des fragments \
d'affiches ou de journaux montrent de grandes lettres rouges et noires, coupées, \
illisibles. Au centre, de petits tickets s'entassent : l'un, bordé de rayures noires \
et orange, porte le nombre 21.00, un autre le nombre 3145, un troisième une bande \
rouge. En bas à droite, un papier imprimé en bleu se lit en partie : on y reconnaît \
l'emballage de caramels « Siesta » de la maison Wildhagen, qui vante des bonbons aux \
jus de fruits naturels. Sous le collage, au crayon, l'artiste a écrit Mz. 65. Kleiner \
Tanz et signé Kurt Schwitters 1920."""
evocation = """
Le titre, Petite danse, invite à regarder le collage comme un mouvement. Les fragments \
obliques semblent tourner autour du centre, et le rouge, en quelques taches, saute \
d'un bord à l'autre parmi les blancs, les gris et les ocres, comme un danseur au \
milieu de la foule. Les matériaux, eux, viennent de la vie quotidienne de l'Allemagne \
d'après-guerre : tickets, emballages de friandises, lambeaux d'affiches. Schwitters ne \
cherche pas à dénoncer, comme les dadaïstes de Berlin ; il recueille ces restes et \
leur donne une beauté nouvelle. Le déchet publicitaire devenu matière de l'art annonce \
les collages de Richard Hamilton et d'Eduardo Paolozzi, qui inaugureront le pop art \
britannique dans les années 1950."""
histoire = """
En 1919, à Hanovre, Schwitters invente le mot Merz, tiré d'un fragment de \
l'inscription Commerz- und Privatbank découpé dans une publicité, pour désigner un art \
fait de tous les matériaux. Il le décline en tableaux, en poèmes, en spectacles et, \
pour ses petits collages sur papier, en Merzzeichnungen, « dessins Merz » : c'est ce \
que signifie l'abréviation Mz. inscrite sous l'œuvre, suivie de son numéro, 65. En \
1920, il en réalise un grand nombre, avec ce qu'il ramasse dans la rue, dans les \
tramways et dans les corbeilles à papier. En 1923, il fonde sa revue Merz et devient \
l'une des grandes figures de dada en Allemagne. Le collage est aujourd'hui conservé au \
Cleveland Museum of Art."""
facture = """
Schwitters déchire et découpe ses papiers, les superpose, les colle, puis les recouvre \
en partie pour trouver un équilibre de formes et de couleurs. Les bords déchirés, \
irréguliers, alternent avec les coupes nettes des ciseaux. Les lettres imprimées sont \
choisies pour leur forme plus que pour leur sens : un 0, un fragment de mot, des \
chiffres. Le petit format oblige à une composition serrée, où chaque morceau compte. \
Les plans obliques, hérités du cubisme et du futurisme, donnent au rectangle son élan. \
Le papier a jauni et bruni avec le temps, ce qui accentue aujourd'hui la gamme chaude \
des ocres et des bruns, d'où le rouge ressort d'autant plus vivement."""
details = [
  "Le ticket bordé de rayures noires et orange, marqué 21.00, au centre.",
  "L'emballage de caramels « Siesta », imprimé en bleu, en bas à droite.",
  "Les grandes lettres rouges, coupées, en haut et sur le bord gauche.",
  "Les bords déchirés du papier kraft, à côté des coupes nettes des ciseaux.",
  "L'inscription au crayon Mz. 65. Kleiner Tanz, sous le collage.",
]
themes = ["collage", "merz", "dada", "publicité", "déchets"]
anecdote = """
Schwitters était aussi poète : son Ursonate, « sonate primitive » faite de syllabes \
sans signification, dure près de quarante minutes quand on la récite en entier."""
salle = 5
mur = "nord"
place = 3
largeur = 2.0

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi, 24 novembre 1864 – château de Malromé (Gironde), 9 septembre 1901"
biographie = """
Henri de Toulouse-Lautrec naît dans une vieille famille aristocratique du Midi. \
Adolescent, il se brise les deux jambes en 1878 et 1879 : elles cessent de grandir, \
sans doute à cause d'une maladie osseuse héréditaire. Il se consacre alors au dessin, \
se forme à Paris chez Bonnat puis dans l'atelier de Cormon, où il fréquente Émile \
Bernard et Vincent van Gogh. Installé à Montmartre, il peint ses cabarets, ses bals et \
ses vedettes : Aristide Bruant, La Goulue, Jane Avril, Yvette Guilbert. Son affiche \
pour le Moulin Rouge, en 1891, le rend célèbre ; il en dessinera une trentaine, et des \
centaines de lithographies. Miné par l'alcool, il est interné en 1899 dans une \
clinique de Neuilly. Il meurt à trente-six ans au château de Malromé, chez sa mère."""
style = """
Lautrec est d'abord un dessinateur : une ligne rapide, nerveuse, qui saisit une \
attitude, un tic, un visage en quelques traits. Il emprunte à Degas et aux estampes \
japonaises les cadrages coupés et les vues plongeantes. Ses affiches, aux aplats \
francs et au lettrage intégré, ont fondé l'affiche moderne et fait des vedettes de \
Montmartre des images aussi connues que des marques."""

[[artistes]]
nom = "Alfons Mucha"
vie = "Ivančice (Moravie), 24 juillet 1860 – Prague, 14 juillet 1939"
biographie = """
Né en Moravie, alors dans l'Empire d'Autriche, Alfons Mucha travaille d'abord comme \
peintre de décors de théâtre à Vienne, puis étudie à Munich grâce à un protecteur. \
Installé à Paris en 1887, il suit les cours des académies Julian et Colarossi et vit \
difficilement de ses illustrations. Fin 1894, il dessine presque par hasard l'affiche \
de Gismonda pour Sarah Bernhardt : placardée dans Paris au début de 1895, elle fait \
sensation. La tragédienne lui confie ses affiches pendant six ans, et l'imprimeur \
Champenois le prend sous contrat. Affiches, panneaux décoratifs, bijoux, publicités : \
son style devient l'image même de l'Art nouveau. Rentré en Bohême en 1910, il consacre \
près de vingt ans à l'Épopée slave, puis dessine les premiers billets et timbres de la \
Tchécoslovaquie. Arrêté et interrogé par la Gestapo en 1939, il meurt peu après à \
Prague."""
style = """
Mucha a créé un langage immédiatement reconnaissable : une figure idéale, inscrite \
dans une arcade ou un cercle, entourée d'ornements, de fleurs et de lettres dessinées, \
avec un contour sombre et régulier et des couleurs douces. Il a fait de l'affiche un \
art à part entière, et son style, redécouvert dans les années 1960, a inspiré \
l'affiche psychédélique et la bande dessinée."""

[[artistes]]
nom = "William Michael Harnett"
vie = "Clonakilty (Irlande), 10 août 1848 – New York, 29 octobre 1892"
biographie = """
Né dans le comté de Cork, en Irlande, en pleine famine, William Michael Harnett arrive \
enfant à Philadelphie avec sa famille. Adolescent, il apprend le métier de graveur sur \
argenterie, tout en suivant des cours du soir à l'Académie des beaux-arts de \
Pennsylvanie, puis, à New York, à la Cooper Union et à la National Academy of Design. \
Vers 1875, il se met à peindre des natures mortes : chopes, pipes, journaux, livres, \
billets de banque. De 1880 à 1886, il séjourne en Europe, surtout à Munich, où sa \
manière s'affine. En 1885, à Paris, il peint After the Hunt, grand trompe-l'œil de \
trophées de chasse qui fait sa célébrité aux États-Unis. Rentré à New York, souffrant \
de rhumatismes, il meurt en 1892, à quarante-quatre ans. Longtemps oublié, il est \
redécouvert à la fin des années 1930."""
style = """
Harnett est le maître du trompe-l'œil américain. Il choisit des objets modestes et \
usés, pipes, livres écornés, instruments de musique, gibier, et les peint à leur \
taille réelle, contre un fond plat et proche, avec une précision qui efface la touche. \
Ses compositions savantes, héritées des Hollandais, ont séduit le public des saloons \
et des grands magasins autant que les collectionneurs."""

[[artistes]]
nom = "John Frederick Peto"
vie = "Philadelphie, 21 mai 1854 – New York, 23 novembre 1907"
biographie = """
John Frederick Peto grandit à Philadelphie et étudie à la fin des années 1870 à \
l'Académie des beaux-arts de Pennsylvanie, où il expose ensuite des natures mortes. Il \
s'y lie avec William Michael Harnett, de six ans son aîné, dont l'exemple est décisif. \
Mais il ne connaît ni la gloire ni les grands acheteurs. En 1889, il s'installe avec \
sa famille à Island Heights, sur la côte du New Jersey, où il joue du cornet dans les \
réunions religieuses de l'été. Il y peint pendant près de vingt ans, à l'écart, des \
porte-lettres, des livres usés, des lanternes et des portes de placard. À sa mort, en \
1907, il est oublié ; certaines de ses toiles sont même vendues sous le nom de \
Harnett, avec de fausses signatures, jusqu'à ce que l'historien Alfred Frankenstein \
lui rende, vers 1950, son nom et son œuvre."""
style = """
Peto peint les mêmes sujets que Harnett, mais avec une touche plus libre, une lumière \
plus douce et des objets plus pauvres, cabossés, déchirés, comme rongés par le temps. \
Ses compositions plates, faites de plans et de taches de couleur, et leur mélancolie \
silencieuse ont été rapprochées au XXᵉ siècle de la peinture moderne."""

[[artistes]]
nom = "John Haberle"
vie = "New Haven (Connecticut), 1856 – New Haven, 1933"
biographie = """
John Haberle naît à New Haven et y passe presque toute sa vie. Il apprend la gravure \
et la lithographie, travaille pour des imprimeurs, puis est engagé au musée Peabody de \
l'université Yale, où il dessine pour le paléontologue Othniel Charles Marsh. Il suit \
aussi des cours à la National Academy of Design de New York. Au milieu des années \
1880, il se fait connaître par ses trompe-l'œil de billets, de timbres et de coupures \
de journaux, si convaincants qu'on les soupçonne d'être des collages. Il peint ensuite \
des compositions plus vastes, comme A Bachelor's Drawer, un tiroir de célibataire \
rempli de billets, de cartes et de photographies, ou Grandma's Hearthstone, une \
cheminée grandeur nature. Des problèmes de vue l'obligent peu à peu à renoncer à ce \
travail minutieux. Il meurt dans sa ville natale en 1933."""
style = """
Haberle pousse le trompe-l'œil jusqu'au défi. Il choisit des objets plats, billets, \
timbres, photographies, étiquettes, qu'il peut reproduire à leur taille exacte sans \
que l'œil décèle la tricherie, et joue avec humour sur le vrai et le faux, jusque dans \
ses titres. Ses tableaux sont aussi des archives de la culture imprimée de son temps."""

[[artistes]]
nom = "Raphaelle Peale"
vie = "Annapolis (Maryland), 17 février 1774 – Philadelphie, 4 mars 1825"
biographie = """
Raphaelle Peale est le fils de Charles Willson Peale, portraitiste de George \
Washington, naturaliste et fondateur à Philadelphie d'un musée d'histoire naturelle et \
de portraits. Formé par son père, il travaille avec lui au musée, où il prépare des \
animaux naturalisés, et peint des portraits et des miniatures. À partir des années \
1810, il se consacre surtout à la nature morte, un genre que l'Amérique tient alors \
pour mineur, et en devient le premier grand spécialiste dans son pays. Sa vie est \
difficile : la goutte, l'alcool et sans doute les produits toxiques employés en \
taxidermie ruinent sa santé, et ses tableaux se vendent mal. Il meurt à Philadelphie \
en 1825, à cinquante et un ans. Ses natures mortes comptent aujourd'hui parmi les \
œuvres les plus admirées de la peinture américaine ancienne."""
style = """
Peale compose des natures mortes sobres et rigoureuses : quelques fruits, un plat, un \
verre, alignés sur une tablette devant un fond sombre, sous une lumière franche. \
Héritier des Hollandais du XVIIᵉ siècle, il cherche la clarté plus que l'abondance, et \
rend chaque matière avec une précision qui touche au trompe-l'œil. Il est le grand \
ancêtre de la nature morte américaine."""

[[artistes]]
nom = "James Gillray"
vie = "Chelsea (Londres), 13 août 1756 – Londres, 1ᵉʳ juin 1815"
biographie = """
Fils d'un ancien soldat, James Gillray grandit à Chelsea dans la communauté des frères \
moraves, une Église protestante austère. Il apprend d'abord la gravure de lettres, \
puis entre en 1778 aux écoles de la Royal Academy. Mais c'est la caricature qui le \
rend célèbre. À partir des années 1790, il travaille presque exclusivement pour \
l'éditrice Hannah Humphrey, chez qui il vit, dans Bond Street puis au 27, St James's \
Street. Il ridiculise tour à tour le roi George III, les ministres William Pitt et \
Charles James Fox, la Révolution française et Napoléon, qu'il réduit à un « petit \
Boney » rageur. Ses estampes circulent jusque sur le continent. Vers 1810, sa vue et \
sa raison déclinent ; après une tentative de suicide, il cesse de graver et meurt en \
1815, dans la maison de St James's Street."""
style = """
Gillray a fixé les règles de la caricature politique moderne : personnages déformés \
mais reconnaissables, bulles de texte sortant des bouches, compositions foisonnantes \
pleines de détails à lire. Son eau-forte rapide et violente et ses couleurs posées à \
la main font de chaque planche un spectacle. Il est l'un des ancêtres directs du \
dessin de presse et de la bande dessinée."""

[[artistes]]
nom = "Winsor McCay"
vie = "Canada ou Michigan, vers 1867 – New York, 26 juillet 1934"
biographie = """
Les origines de Zenas Winsor McCay restent incertaines : il serait né au Canada ou \
dans le Michigan, entre 1867 et 1871. Il grandit dans le Michigan, où il reçoit les \
seules vraies leçons de sa vie auprès d'un professeur de dessin de perspective. Il \
travaille d'abord pour des cirques et des musées de curiosités populaires, dont il \
peint les affiches et les décors, puis devient dessinateur de presse à Cincinnati. En \
1903, il entre au New York Herald, où il crée Little Sammy Sneeze et Dream of the \
Rarebit Fiend, puis, en 1905, Little Nemo in Slumberland. Pionnier de l'animation, il \
réalise un premier film d'après Little Nemo en 1911, puis Gertie le dinosaure en 1914. \
Passé au service du patron de presse William Randolph Hearst, il consacre ses \
dernières années surtout à des dessins éditoriaux, et meurt à New York en 1934."""
style = """
McCay est le premier grand virtuose de la bande dessinée : il exploite toute la \
surface de la page, fait varier la taille des cases au gré du récit et dessine des \
architectures d'une précision stupéfiante. Son trait clair, marqué par l'Art nouveau, \
sert un imaginaire du rêve et de la métamorphose qui a influencé des générations \
d'auteurs et ouvert la voie au dessin animé."""

[[artistes]]
nom = "Juan Gris"
vie = "Madrid, 23 mars 1887 – Boulogne-sur-Seine, 11 mai 1927"
biographie = """
José Victoriano González-Pérez étudie l'ingénierie à Madrid, puis s'oriente vers le \
dessin. En 1906, il s'installe à Paris, au Bateau-Lavoir, à Montmartre, où il voit \
naître le cubisme dans l'atelier de son voisin et compatriote Picasso. Pour vivre, il \
dessine pour des journaux satiriques comme L'Assiette au beurre. Il se consacre à la \
peinture à partir de 1910 et expose pour la première fois en 1912, au Salon des \
indépendants ; la même année, il réalise ses premiers papiers collés et signe un \
contrat avec le marchand Daniel-Henry Kahnweiler. Pendant la guerre, il reste en \
France, dans une grande pauvreté, et devient l'un des représentants les plus rigoureux \
du cubisme. Dans les années 1920, il crée des décors et des costumes pour les Ballets \
russes. Malade, il meurt en 1927, à quarante ans."""
style = """
Gris est le grand architecte du cubisme. Il part d'une structure abstraite, une grille \
de lignes et de plans colorés, puis y fait apparaître les objets de tous les jours : \
journaux, bouteilles, pipes, cartes à jouer. Ses couleurs franches, sa composition \
calculée et la netteté de ses formes ont marqué toute la peinture construite des \
années 1920."""

[[artistes]]
nom = "Kurt Schwitters"
vie = "Hanovre, 20 juin 1887 – Kendal (Angleterre), 8 janvier 1948"
biographie = """
Fils de commerçants aisés de Hanovre, Kurt Schwitters étudie la peinture à l'Académie \
de Dresde. Pendant la guerre, il est employé comme dessinateur industriel dans une \
usine. En 1919, il invente Merz, un art fait de tous les matériaux, déchets compris, \
et expose ses premiers tableaux-collages à Berlin, à la galerie Der Sturm. Tenu à \
l'écart par les dadaïstes berlinois, il crée son propre dada à Hanovre, avec sa revue \
Merz, ses poèmes sonores et ses spectacles, et construit dans sa maison le Merzbau, \
une architecture intérieure qui envahit plusieurs pièces. Qualifié d'artiste dégénéré \
par les nazis, il fuit en Norvège en 1937, puis en Grande-Bretagne en 1940, où il est \
interné plusieurs mois sur l'île de Man. Il finit sa vie dans la région des Lacs et \
meurt à Kendal en 1948."""
style = """
Schwitters fait de l'art avec tout : tickets, étiquettes, emballages, bois, ficelles, \
mots et sons. Ses collages restent pourtant des compositions rigoureuses, où chaque \
fragment compte pour sa couleur et sa forme. Sa façon de recueillir les déchets de la \
culture de consommation a ouvert la voie au pop art, aux nouveaux réalistes et à l'art \
d'aujourd'hui."""
