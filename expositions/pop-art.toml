# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « AVANT LE POP ART » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/pop-art/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /pop-art.
#
#  Les œuvres du pop art sont protégées par le droit d'auteur. Cette exposition
#  montre donc ses ancêtres : des affiches, des trompe-l'œil, des caricatures et
#  des collages de 1808 à 1920, entrés dans le domaine public. Leurs photographies
#  sont publiées sous licence CC0 par les musées qui les conservent (National
#  Gallery of Art de Washington, Art Institute of Chicago, Cleveland Museum of
#  Art) ; chaque image porte le nom du musée et l'adresse de sa page.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 200
nom_court = "Avant le pop art"
mouvement = "Affiche, trompe-l'œil, caricature, collage"
cadre = "noir"
couleur = "#b3122e"
titre = "Avant le pop art, l'image populaire, des vedettes de l'affiche aux collages"
artiste = "Toulouse-Lautrec, Mucha, Harnett, Peto, Gillray, McCay, Gris, Schwitters…"
dates = "1808–1920"
accroche = "Exposition virtuelle · Museum Ludwig, Cologne"
introduction = """
Le pop art des années 1960 n'est pas sorti de rien. Quand Andy Warhol répète le visage \
de Marilyn Monroe, quand Roy Lichtenstein agrandit une case de comics ou que Claes \
Oldenburg sculpte un hamburger géant, ils reprennent des images que l'affiche, le \
trompe-l'œil, la caricature et le collage avaient rendues familières bien avant eux. \
Les œuvres du pop art étant protégées par le droit d'auteur, cette exposition montre \
leurs ancêtres, entrés dans le domaine public : dix œuvres de 1808 à 1920, des \
vedettes de Toulouse-Lautrec et de Mucha aux billets de banque peints de John Haberle, \
de la boutique de caricatures de Gillray au Little Nemo de Winsor McCay, du Fantômas \
de Juan Gris aux collages de Kurt Schwitters. Le bâtiment s'inspire du Museum Ludwig \
de Cologne, l'une des grandes collections de pop art en Europe : un hall, une grande \
halle haute de douze mètres et trois salles blanches autour. Les estampes et les \
petits tableaux y sont présentés agrandis."""
vitrine = "jane-avril.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Museum Ludwig"
ville = "Cologne, Allemagne"
architecte = "Peter Busmann et Godfrid Haberer"
construction = "ouvert en 1986"
presentation = """
En 1976, les collectionneurs Peter et Irene Ludwig, industriels du chocolat \
d'Aix-la-Chapelle, donnent à la ville de Cologne quelque 350 œuvres d'art moderne, \
dont un ensemble exceptionnel de pop art américain ; en échange, la ville s'engage à \
construire un musée qui portera leur nom. Le bâtiment, dessiné par Peter Busmann et \
Godfrid Haberer, ouvre en 1986 entre la cathédrale et le Rhin. Il abrite d'abord aussi \
le Wallraf-Richartz-Museum, qui le quitte en 2001 pour son propre édifice. On le \
reconnaît à ses toitures en dents de scie, dont les verrières répandent dans les \
salles une lumière égale ; sous la place voisine se trouve la salle de concert de la \
Philharmonie. On y voit aujourd'hui Warhol, Lichtenstein, Rauschenberg, Johns et \
Oldenburg, l'une des plus importantes collections de Picasso, l'avant-garde russe et \
une riche collection de photographies."""
ici = """
Comme au Museum Ludwig, de grands volumes blancs s'ouvrent les uns sur les autres. On \
entre par le sud dans le hall, sobre, haut de sept mètres, puis dans la grande halle, \
large de vingt mètres et haute de douze, où « Les vedettes de l'affiche » réunissent \
la Jane Avril de Toulouse-Lautrec et la Sarah Bernhardt en Lorenzaccio de Mucha. À \
l'ouest, la salle « Les objets du quotidien » rassemble les trompe-l'œil de Harnett, \
de Peto, de Haberle et de Raphaelle Peale ; à l'est, « Le rire et la bande dessinée » \
accroche Gillray et le Little Nemo de Winsor McCay ; au nord, « Papiers collés et \
collages » montre le Fantômas de Juan Gris et la Petite danse de Kurt Schwitters. Tous \
les murs sont d'un blanc chaud."""

# ─── Le plan du musée ────────────────────────────────────────────────────────
# Inspiré du Museum Ludwig de Cologne (Busmann et Haberer, 1986) : des salles
# blanches, hautes et lumineuses, qui s'ouvrent les unes sur les autres autour
# d'une grande halle centrale. On entre au sud par un hall ; la grande halle
# (20 × 16 m, 12 m de haut) accueille les vedettes de l'affiche et distribue trois
# salles : les trompe-l'œil à l'ouest, la caricature et la bande dessinée à l'est,
# les papiers collés et les collages au nord. x et z : le centre de la salle (x
# vers l'est, z vers le sud), en mètres ; une porte se déclare d'un seul côté.

