# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « POP ART » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/pop-art/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /pop-art.
#
#  Les œuvres du pop art sont protégées par le droit d'auteur. Cette exposition ne
#  montre donc que des photographies publiées sous licence libre sur Wikimedia
#  Commons, d'œuvres installées en permanence dans l'espace public de pays où la
#  liberté de panorama le permet (Allemagne, Espagne, Royaume-Uni). Chaque image
#  porte le nom de son photographe, sa licence et sa source.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 200
nom_court = "Pop art"
mouvement = "Pop art et néo-pop"
cadre = "noir"
couleur = "#b3122e"
titre = "Le pop art dans la ville, des objets géants aux icônes"
artiste = "Lichtenstein, Oldenburg et van Bruggen, Haring, Koons, Indiana…"
dates = "1966–2006"
accroche = "Exposition virtuelle · Museum Ludwig, Cologne"
introduction = """
Né à Londres et à New York à la fin des années 1950, le pop art fait entrer dans le \
musée la bande dessinée, la publicité, les objets de tous les jours et les vedettes de \
l'écran : Andy Warhol, Roy Lichtenstein, Claes Oldenburg, Robert Indiana. Ses \
héritiers des années 1980, Keith Haring ou Jeff Koons, le portent dans la rue. Ces \
œuvres étant protégées par le droit d'auteur, la visite montre, en dix photographies \
libres, des sculptures et une fresque installées dans les villes d'Europe, de \
Barcelone à Berlin. Le bâtiment s'inspire du Museum Ludwig de Cologne, l'une des \
grandes collections de pop art en Europe : un hall, une grande halle haute de douze \
mètres et trois salles blanches autour."""
vitrine = "barcelona-head.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Museum Ludwig"
ville = "Cologne, Allemagne"
architecte = "Peter Busmann et Godfrid Haberer"
construction = "ouvert en 1986"
presentation = """
En 1976, les collectionneurs Peter et Irene Ludwig, industriels du chocolat \
d'Aix-la-Chapelle, donnent à la ville de Cologne quelque 350 œuvres d'art moderne, \
dont un ensemble exceptionnel de pop art américain ; en échange, la ville s'engage à \
construire un musée qui portera leur nom. Le bâtiment, dessiné par Peter Busmann et \
Godfrid Haberer, ouvre en 1986 entre la cathédrale et le Rhin. Il abrite d'abord aussi \
le Wallraf-Richartz-Museum, qui le quitte en 2001 pour son propre édifice. On le \
reconnaît à ses toitures en dents de scie, dont les verrières répandent dans les \
salles une lumière égale ; sous la place voisine se trouve la salle de concert de la \
Philharmonie. On y voit aujourd'hui Warhol, Lichtenstein, Rauschenberg, Johns et \
Oldenburg, l'une des plus importantes collections de Picasso, l'avant-garde russe et \
une riche collection de photographies."""
ici = """
Comme au Museum Ludwig, de grands volumes blancs s'ouvrent les uns sur les autres. On \
entre par le sud dans le hall, sobre, haut de sept mètres, puis dans la grande halle, \
large de vingt mètres et haute de douze, où se dressent la tête de Lichtenstein et le \
LOVE d'Indiana. À l'ouest, la salle « Les objets géants » réunit Claes Oldenburg et \
Coosje van Bruggen ; à l'est, la salle « Keith Haring, l'art dans la rue » ; au nord, \
la salle « Le néo-pop, fleurs et Nanas ». Tous les murs sont d'un blanc chaud."""

# ─── Le plan du musée ────────────────────────────────────────────────────────
