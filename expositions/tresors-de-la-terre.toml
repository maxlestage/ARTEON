# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Tranche de la météorite de Gibeon"
artiste = "Gibeon, Namibie"
annee = "Formée il y a environ 4,5 milliards d'années"
image = "meteorite-gibeon.jpg"
credit = "Photo : Kevin Walsh"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Gibeon_meteorite_slice.jpg"
technique = "Fer météoritique (alliage de fer et de nickel), octaédrite fine du groupe IVA ; tranche sciée, polie et attaquée à l'acide"
collection = "Collection non précisée (photographie de Kevin Walsh, 2002)"
note = "Une tranche de fer tombé du ciel, sciée, polie puis attaquée à l'acide : apparaît alors un entrelacs de lames métalliques, les figures de Widmanstätten, qui ne se forment qu'au cœur d'un astéroïde."
description = """
Sur un fond noir se détache une plaque de métal au contour irrégulier, découpée à la \
scie dans un bloc plus grand. Sa surface, d'un gris argenté, n'est pas lisse : elle \
est entièrement couverte d'un réseau de bandes droites et étroites, qui se croisent \
selon trois ou quatre directions. Elles dessinent des triangles, des losanges et des \
parallélogrammes, comme les fils tirés d'un tissu ou les brindilles d'un fagot. \
Certaines bandes brillent, d'autres paraissent plus sombres selon la manière dont \
elles renvoient la lumière ; les petits espaces qu'elles enferment ont une texture \
plus fine, presque granuleuse. Sur les bords, la tranche s'effrange en pointes et en \
échancrures, là où passait la surface brute de la météorite."""
evocation = """
Ce dessin géométrique est l'archive d'un monde disparu. Il y a environ 4,5 milliards \
d'années, à la naissance du système solaire, de petites planètes se forment autour du \
jeune Soleil ; dans certaines, le métal fondu tombe au centre et forme un noyau. Les \
figures de Widmanstätten ne naissent que si ce métal refroidit avec une extrême \
lenteur, de quelques degrés par million d'années, dans un corps enfoui sous des \
kilomètres de roche. Une collision a ensuite brisé cet astéroïde, et l'un de ses \
fragments a fini par croiser la route de la Terre. Toucher une telle tranche, c'est \
toucher le cœur d'un astre, que nul forage ne permettra jamais d'atteindre sur notre \
propre planète."""
histoire = """
Les météorites de Gibeon sont tombées bien avant l'histoire écrite, en une pluie de \
fragments dispersés sur des centaines de kilomètres dans le sud de la Namibie, autour \
de la petite ville de Gibeon qui leur a donné son nom. Les Nama, qui vivent dans la \
région, en tiraient du fer pour fabriquer des outils et des pointes d'armes. Les \
Européens les découvrent au XIXᵉ siècle : dans les années 1830, des échantillons \
rapportés par un explorateur britannique sont reconnus à Londres comme du fer venu de \
l'espace. Des centaines de masses, de quelques grammes à plusieurs centaines de kilos, \
ont été recueillies depuis. La Namibie les protège aujourd'hui comme un patrimoine \
national, et une trentaine des plus grosses sont exposées en plein air, sur une place \
de la capitale, Windhoek."""
facture = """
Le fer de Gibeon contient environ 8 % de nickel. En refroidissant, il s'est séparé en \
deux alliages : la kamacite, pauvre en nickel, en larges lames, et la taénite, plus \
riche, en minces liserés. Pour les révéler, on scie la météorite, on polit la tranche \
comme un miroir, puis on l'attaque avec un acide dilué, qui ronge les deux métaux à \
des vitesses différentes. Les lames s'orientent selon les faces d'un octaèdre : d'où \
le nom d'octaédrite. Celles de Gibeon sont très étroites, moins d'un demi-millimètre, \
ce qui la classe parmi les octaédrites fines."""
details = [
  "Les bandes parallèles qui reviennent selon trois ou quatre directions seulement.",
  "Les petits triangles entre les lames, remplis d'une texture plus fine.",
  "Le contraste entre lames brillantes et lames mates, qui change avec la lumière.",
  "Le contour déchiqueté, qui suit la forme du bloc d'origine.",
]
themes = ["météorite", "espace", "fer", "cristal", "système solaire"]
anecdote = """
On parle de « figures de Widmanstätten », du nom du comte autrichien Alois von \
Beckh-Widmanstätten, qui les observa à Vienne en 1808. Mais le Britannique William \
Thomson les avait déjà décrites quelques années plus tôt, à Naples : on les appelle \
parfois, pour cette raison, « structures de Thomson »."""
salle = 1
mur = "est"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Le diamant Hope"
artiste = "Mines de Golconde, Inde"
annee = "Diamant indien connu dès le XVIIᵉ siècle ; taille actuelle attestée en 1812 ; photographie de 1974"
image = "diamant-hope.jpg"
credit = "Photo : Smithsonian Institution Archives"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Hope_Diamond_-_SIA.jpg"
technique = "Diamant bleu de 45,52 carats (25,6 × 21,8 mm), serti dans un pendentif entouré de seize diamants blancs"
collection = "National Museum of Natural History, Smithsonian Institution, Washington"
note = "Le plus célèbre diamant bleu du monde : 45,52 carats pour un peu plus de 2,5 cm de long, montré ici très agrandi. Il a été taillé dans le « Bleu de France » de Louis XIV, volé en 1792."
description = """
Au centre d'un pendentif, une pierre ovale d'un bleu profond, presque noir dans ses \
parties sombres, renvoie la lumière par ses facettes : des triangles et des losanges \
plus clairs, d'un bleu d'acier, s'allument à sa surface. Son contour n'est pas tout à \
fait régulier, légèrement renflé d'un côté. Autour d'elle, une couronne de seize \
diamants incolores, taillés les uns en poire, les autres en coussin, scintille de \
reflets blancs et violets. En haut, une bélière relie le bijou à une chaîne de \
diamants, floue à l'arrière-plan ; en bas pend un petit anneau. La photographie, prise \
en 1974 par les services du Smithsonian, montre le joyau posé sur un fond de tissu \
gris-bleu."""
evocation = """
Peu de pierres ont autant fait rêver. Le diamant Hope résume trois siècles d'histoire \
: la splendeur de Louis XIV, la chute de la monarchie, la fortune des banquiers et des \
héritières américaines. Les journaux du début du XXᵉ siècle lui ont inventé une \
malédiction, qui aurait frappé tous ses propriétaires ; on pense qu'elle a été \
entretenue par les marchands eux-mêmes, pour rendre la pierre plus désirable. Il \
incarne aussi une idée démocratique : le diamant le plus célèbre du monde appartient \
aujourd'hui au public et se regarde gratuitement, dans un musée national. Enfin, il \
pose une énigme de physique : un diamant est du carbone pur, et sa couleur bleue tient \
à quelques atomes étrangers seulement."""
histoire = """
En 1668, le marchand français Jean-Baptiste Tavernier vend à Louis XIV un grand \
diamant bleu acheté en Inde, de plus de 110 carats. En 1673, le joaillier de la cour, \
Jean Pittan, le retaille en une pierre d'environ 69 carats, le « Bleu de France ». \
Louis XV le fait monter en 1749 dans un insigne de l'ordre de la Toison d'or. En \
septembre 1792, il est volé avec les joyaux de la Couronne au Garde-Meuble, à Paris. \
Une pierre bleue de 45 carats réapparaît à Londres en 1812, puis entre dans la \
collection du banquier Henry Philip Hope, dont elle garde le nom. Pierre Cartier la \
vend en 1911 à Evalyn Walsh McLean ; après sa mort, Harry Winston l'achète et l'offre \
au Smithsonian en 1958. En 2007, un moulage en plomb du Bleu de France, retrouvé au \
Muséum à Paris, a confirmé que le Hope en était issu."""
facture = """
Le diamant Hope est taillé en coussin, avec une couronne de facettes au-dessus et un \
pavillon plus profond au-dessous, qui renvoie la lumière vers l'œil. Sa couleur vient \
de traces de bore, quelques atomes pour un million d'atomes de carbone : elles \
absorbent une partie de la lumière rouge et jaune et ne laissent passer que le bleu. \
C'est un diamant dit de type IIb, une catégorie très rare. Il a une autre propriété \
étonnante : éclairé par des rayons ultraviolets, puis replongé dans le noir, il luit \
quelques secondes d'une lueur rouge orangé. Le bijou qui l'entoure, une monture de \
seize diamants blancs et une chaîne de quarante-cinq diamants, met en valeur sa \
couleur sombre."""
details = [
  "Le contour un peu dissymétrique de la pierre bleue.",
  "Les facettes du pavillon, qui s'éclairent en triangles d'un bleu plus clair.",
  "Les seize diamants blancs, où alternent tailles en poire et en coussin.",
  "La bélière, en haut, qui rattache le pendentif à la chaîne.",
]
themes = ["diamant", "bleu", "louis xiv", "légende", "gemme"]
anecdote = """
En 1958, Harry Winston envoya le diamant au Smithsonian par la poste, en recommandé, \
dans un simple paquet de papier kraft assuré pour un million de dollars. L'emballage, \
avec ses timbres et son cachet, est aujourd'hui conservé au musée national de la \
Poste, à Washington."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Fluorite rose sur quartz fumé"
artiste = "Massif du Mont-Blanc, France"
annee = "Cristallisée dans une fissure du granite, pendant le soulèvement des Alpes"
image = "fluorite-aiguille-verte.jpg"
credit = "Photo : Marie-Lan Taÿ Pamart"
licence = "CC BY 4.0"
source = "https://commons.wikimedia.org/wiki/File:Fluorite_on_smoky_quartz_Aiguille_Verte_MNHN_Minéralogie.jpg"
technique = "Fluorite (fluorure de calcium) en octaèdres, sur un cristal de quartz fumé ; provenant de l'Aiguille Verte (Haute-Savoie)"
collection = "Galerie de Minéralogie et de Géologie, Muséum national d'Histoire naturelle, Paris"
note = "Des octaèdres de fluorite rose orangé posés sur un cristal de quartz fumé : l'un des trésors des fissures à cristaux du massif du Mont-Blanc, recueilli sur l'Aiguille Verte."
description = """
Un amas de cristaux rose saumon, presque orangés, s'accroche à un cristal plus sombre, \
gris-brun, qui se dresse en haut de la composition : un quartz fumé, dont on voit la \
face plate et la pointe. Les cristaux roses ont des faces triangulaires bien nettes ; \
plusieurs sont des octaèdres presque parfaits, comme deux pyramides collées par leur \
base. Ils s'empilent et se chevauchent, de tailles diverses, les plus gros au centre, \
les plus petits en grappe sur les bords. Leur surface n'est pas polie : elle paraît \
givrée, finement striée ou creusée de petites marches. Traversés par la lumière de la \
vitrine, les bords des cristaux deviennent translucides et s'éclairent d'un rose plus \
vif sur le socle gris pâle."""
evocation = """
Cet objet raconte la haute montagne. Il vient d'une fissure du granite, à plusieurs \
milliers de mètres d'altitude, où il a fallu grimper, creuser et redescendre avec la \
pierre sur le dos. Pour les cristalliers de Chamonix, la fluorite rose est le plus \
beau trésor du massif, bien plus rare que le quartz. Sa géométrie fascine aussi : \
l'octaèdre, aux huit faces triangulaires égales, est l'un des cinq solides réguliers \
que Platon associait aux éléments du monde, et la nature le produit ici sans l'aide \
d'aucune main. Le contraste entre le rose tendre et le quartz sombre, enfin, a quelque \
chose d'une composition de peintre, comme une fleur posée sur un rocher."""
histoire = """
L'Aiguille Verte, haute de 4 122 mètres, domine la vallée de Chamonix ; l'Anglais \
Edward Whymper en fait la première ascension en 1865, avec deux guides suisses. Bien \
avant les alpinistes, des chasseurs de cristaux, les cristalliers, parcouraient déjà \
les glaciers et les parois du massif à la recherche des « fours » : des cavités du \
granite tapissées de quartz, que l'on repère à une veine blanche dans la roche. Les \
fluorites roses y sont rares et recherchées. Ce spécimen appartient aux collections du \
Muséum national d'Histoire naturelle et il est exposé dans sa galerie de Minéralogie \
et de Géologie, au Jardin des Plantes, aux côtés d'autres minéraux des Alpes \
françaises."""
facture = """
La fluorite est un fluorure de calcium. Dans les fissures des Alpes, elle cristallise \
souvent en octaèdres plutôt qu'en cubes. Sa couleur rose, rare, est attribuée à de \
minuscules défauts de l'édifice cristallin, liés à des traces de terres rares et à la \
radioactivité naturelle du granite. Le quartz fumé doit, lui aussi, sa teinte brune à \
cette radioactivité, qui agit sur des traces d'aluminium. Les deux minéraux ont grandi \
lentement dans des eaux chaudes chargées d'éléments dissous qui circulaient dans la \
roche fissurée, pendant que la chaîne des Alpes se soulevait."""
details = [
  "Les faces triangulaires des octaèdres roses, nettes comme des facettes taillées.",
  "La surface givrée et striée des cristaux, qui n'a jamais été polie.",
  "Le cristal de quartz fumé, gris-brun, qui sert de support à l'ensemble.",
  "Les bords translucides où la lumière fait virer le rose à l'orangé.",
]
themes = ["minéral", "cristal", "montagne", "alpes", "couleur"]
anecdote = """
La fluorite a donné son nom à la fluorescence. En 1852, le physicien britannique \
George Gabriel Stokes forge ce mot en étudiant la lueur que certaines fluorites \
émettent lorsqu'on les éclaire de lumière ultraviolette."""
salle = 3
mur = "nord"
place = 3
largeur = 1.3

[[oeuvres]]
titre = "Géode d'améthyste"
artiste = "Coulées de lave de la Serra Geral, Brésil"
annee = "Début du Crétacé, il y a environ 130 millions d'années"
image = "geode-amethyste.jpg"
credit = "Photo : James St. John"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Amethyst_geode_(Serra_Geral_Formation,_Lower_Cretaceous;_southeastern_Brazil)_1_(32934451701).jpg"
technique = "Quartz (variété améthyste) et calcédoine, dans une cavité d'une coulée de basalte"
collection = "Mineral Museum, Montana Bureau of Mines and Geology, Butte (Montana)"
note = "Une bulle de gaz prisonnière d'une coulée de lave, tapissée peu à peu de milliers de cristaux violets : les géodes d'améthyste du sud du Brésil comptent parmi les plus grandes du monde."
description = """
La géode a été ouverte et se présente comme un grand ovale creux, couché sur son \
socle. À l'extérieur, une croûte de roche d'un gris verdâtre forme la coquille. Juste \
à l'intérieur court une bordure blanche et grise, lisse, comme un liseré de \
porcelaine. Puis viennent les cristaux : des milliers de petites pyramides serrées, \
pointées vers le centre, d'un violet pâle près du bord, de plus en plus sombre vers le \
fond de la cavité, où certaines zones paraissent grises ou presque noires. En haut à \
droite, un petit groupe de cristaux blancs et brillants, sans doute de la calcite, se \
détache sur le violet. La lumière accroche les pointes et fait scintiller toute la \
paroi."""
evocation = """
La géode est le trésor caché par excellence : une pierre banale et grise au-dehors, \
une grotte de cristaux au-dedans. Elle a nourri les légendes de cavernes merveilleuses \
et de pierres qui renferment un monde. Sa couleur, le violet, a longtemps été celle du \
pouvoir et de l'Église : les évêques portaient une bague d'améthyste. Mais la géode \
dit surtout le temps : chaque cristal a grandi atome par atome, à partir d'une eau qui \
suintait dans la lave refroidie, pendant des durées qui dépassent l'imagination. Elle \
rappelle aussi que la beauté minérale naît parfois des cataclysmes : ici, de l'une des \
plus grandes éruptions de l'histoire de la Terre."""
histoire = """
Il y a environ 130 millions d'années, quand l'Amérique du Sud et l'Afrique commencent \
à se séparer, d'immenses coulées de basalte se répandent sur le sud du continent, en \
couches successives qui forment aujourd'hui la Serra Geral. Dans la lave encore \
liquide, des bulles de gaz restent piégées ; bien plus tard, des eaux chargées de \
silice s'y infiltrent et les remplissent de cristaux. Dans l'État du Rio Grande do \
Sul, au Brésil, et dans la région voisine d'Artigas, en Uruguay, des mineurs suivent \
la couche de lave riche en géodes en creusant des galeries à flanc de colline. Les \
géodes, dégagées au marteau-piqueur, sont sciées et vendues dans le monde entier. \
Celle-ci est exposée au musée de minéralogie de Butte, dans le Montana."""
facture = """
La croissance suit un ordre précis. Les eaux qui circulent dans la cavité déposent \
d'abord une mince couche de calcédoine, une silice aux cristaux invisibles à l'œil nu \
: c'est la bordure blanche. Puis le quartz cristallise en prismes dont seule la pointe \
dépasse, toutes tournées vers le vide central. La couleur de l'améthyste vient de \
traces de fer, transformées par la radioactivité naturelle des roches. Elle est \
fragile : chauffée à quelques centaines de degrés, l'améthyste devient jaune orangé, \
et une grande partie des « citrines » vendues en joaillerie sont des améthystes \
chauffées."""
details = [
  "La croûte de basalte gris-vert, qui formait la paroi de la bulle de gaz.",
  "Le liseré blanc de calcédoine, première couche déposée dans la cavité.",
  "Les pointes des cristaux, toutes dirigées vers le centre.",
  "Le petit groupe de cristaux blancs, en haut à droite.",
  "Le violet qui s'assombrit vers le fond de la géode.",
]
themes = ["minéral", "géode", "cristal", "violet", "volcan"]
anecdote = """
Le mot améthyste vient du grec amethystos, « qui n'est pas ivre ». Les Grecs croyaient \
que cette pierre protégeait de l'ivresse, et l'on raconte qu'ils buvaient le vin dans \
des coupes d'améthyste."""
salle = 3
