# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « TRÉSORS DE LA TERRE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/tresors-de-la-terre/).
#  Le nom du fichier donne l'adresse de l'exposition sur le site :
#  /tresors-de-la-terre.
#
#  Ici, l'« artiste » est la nature : le champ artiste nomme le lieu de
#  découverte ou la formation géologique, et chaque bloc [[artistes]] présente
#  ce lieu et son époque. Les objets sont montrés en vitrine (cadre = « vitrine ») ;
#  la photographie ancienne du diplodocus a un cadre noir. Les images viennent
#  de Wikimedia Commons : domaine public, CC0, ou licences CC BY / CC BY-SA, dont
#  l'auteur est crédité dans le bloc de l'œuvre.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 300
nom_court = "Trésors de la Terre"
mouvement = "Histoire naturelle : minéraux, fossiles et météorites"
cadre = "vitrine"
couleur = "#5b4b78"
titre = "Trésors de la Terre, minéraux, fossiles et météorites"
artiste = "Golconde, le Mont-Blanc, Solnhofen, Whitby, la mer Baltique, Gibeon…"
dates = "Il y a 4,5 milliards d'années – aujourd'hui"
accroche = "Exposition virtuelle · Muséum national d'Histoire naturelle, Paris"
introduction = """
Ici, l'artiste est la nature, et chaque œuvre porte le nom du lieu qui l'a livrée : \
les mines de Golconde, les fissures du Mont-Blanc, les carrières de Solnhofen, les \
falaises de Whitby, les plages de la Baltique. La visite réunit dix trésors, d'une \
météorite plus ancienne que la Terre au diamant Hope, d'un trilobite de plus de 500 \
millions d'années à l'archéoptéryx, mi-oiseau, mi-dinosaure. Le bâtiment s'inspire du \
Muséum national d'Histoire naturelle, au Jardin des Plantes de Paris : une haute nef \
sous verrière, comme celle de la Grande Galerie de l'Évolution, ouvre à l'ouest sur \
une galerie de minéralogie et à l'est sur la salle des mers anciennes. Chaque objet y \
est présenté dans une vitrine profonde, souvent agrandi pour que l'œil en saisisse les \
détails."""
vitrine = "diamant-hope.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Grande Galerie de l'Évolution"
ville = "Paris, France (Jardin des Plantes)"
architecte = "Jules André ; rénovation : Paul Chemetov et Borja Huidobro"
construction = "1877–1889 ; rouverte en 1994"
presentation = """
Le Muséum national d'Histoire naturelle naît en 1793 dans l'ancien Jardin royal des \
plantes médicinales, fondé au XVIIᵉ siècle sur la rive gauche de la Seine. Pour ses \
collections de zoologie, l'architecte Jules André élève, de 1877 à 1889, une vaste \
galerie : une nef couverte d'une immense verrière, bordée de balcons superposés portés \
par des colonnes de fonte. Fermée en 1965, faute d'entretien, elle est rénovée par \
Paul Chemetov et Borja Huidobro et rouvre en 1994 sous le nom de Grande Galerie de \
l'Évolution. Dans la nef, une caravane d'animaux naturalisés de la savane africaine \
défile sous une lumière qui varie comme celle du ciel. Le jardin compte d'autres \
galeries : celle de Minéralogie et de Géologie, bâtie sous la monarchie de Juillet par \
Charles Rohault de Fleury, qui expose météorites, gemmes et cristaux géants, et celle \
de Paléontologie et d'Anatomie comparée, ouverte en 1898, où se dresse toujours le \
diplodocus offert par Andrew Carnegie en 1908."""
ici = """
Le bâtiment d'ARTEON réunit en un seul édifice les galeries du Jardin des Plantes. On \
entre par le sud dans le vestibule, couleur de pierre, où attend une météorite. Il \
ouvre au nord sur la grande nef, longue de 24 mètres et haute de 14, comme la nef sous \
verrière de la Grande Galerie de l'Évolution. À l'ouest, une porte mène à la galerie \
de Minéralogie, plus basse, aux murs gris perle, où brillent les gemmes et les \
cristaux. À l'est, la salle des mers anciennes, d'un vert d'eau pâle, rassemble \
trilobite, ammonite et nautile. On revient enfin dans la nef, où attendent le \
diplodocus, l'archéoptéryx et l'ambre."""

