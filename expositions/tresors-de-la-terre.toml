[[oeuvres]]
titre = "Trilobite Elrathia kingii"
artiste = "Schistes de Wheeler, Utah"
annee = "Cambrien moyen, il y a un peu plus de 500 millions d'années"
image = "trilobite-elrathia.jpg"
credit = "Photo : James St. John"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Elrathia_kingii_(fossil_trilobite)_(Wheeler_Formation,_Middle_Cambrian;_House_Range,_western_Utah,_USA)_3.jpg"
technique = "Carapace fossilisée (calcite) dans un schiste argileux ; environ 2,6 cm de large"
collection = "Collection non précisée (photographie de James St. John)"
note = "Large d'à peine 2,6 cm, montré ici très agrandi, ce trilobite vivait sur le fond d'une mer du Cambrien, il y a plus de 500 millions d'années. C'est l'un des fossiles les plus répandus au monde."
description = """
Sur la pierre grise, un petit animal ovale, d'un noir brillant, semble encore posé sur \
le fond de la mer. Son corps se divise en trois bandes dans la longueur : un axe \
central bombé et deux lobes latéraux plus plats, d'où le nom de trilobite, « à trois \
lobes ». En haut, la tête forme un large croissant ; en son milieu se dresse un \
renflement allongé, la glabelle. Le corps est fait d'une douzaine d'anneaux articulés, \
serrés comme les lames d'une armure, qui se terminent de chaque côté par une pointe \
arrondie. En bas, une petite queue en forme de bouclier ferme l'ensemble. La carapace, \
noire, se détache nettement sur la roche plus claire, légèrement fendillée."""
evocation = """
Le trilobite est l'un des premiers grands succès de la vie animale. Il apparaît au \
Cambrien, au moment où les océans se peuplent d'une diversité soudaine de formes, et \
il fut l'un des premiers animaux à posséder de vrais yeux. Les trilobites ont vécu \
près de 270 millions d'années avant de disparaître lors de la grande extinction de la \
fin du Permien. Celui-ci n'a rien d'exceptionnel : ni épines, ni yeux géants. Les \
paléontologues américains le surnomment avec affection « Joe Trilobite », le trilobite \
ordinaire. C'est précisément ce qui le rend émouvant : il donne à voir la vie \
quotidienne d'un fond marin, plus de deux cents millions d'années avant les premiers \
dinosaures."""
histoire = """
Elrathia kingii a été décrit en 1870 par le paléontologue américain Fielding Meek, qui \
lui donna le nom de Clarence King, le géologue qui dirigeait alors le relevé du 40ᵉ \
parallèle à travers l'Ouest américain. Il provient des schistes de Wheeler, dans les \
monts de la House Range, à l'ouest de l'Utah. Les carrières de la région en ont livré \
des quantités considérables : des exploitants fendent la roche en plaques et en \
extraient des milliers de spécimens chaque année. C'est pourquoi Elrathia est le \
trilobite que l'on trouve le plus souvent dans les boutiques de fossiles et les \
collections d'amateurs du monde entier. Ce spécimen a été photographié par le géologue \
James St. John."""
facture = """
Comme les insectes et les crabes, les trilobites étaient des arthropodes : leur corps \
était protégé par une carapace articulée, renforcée de calcite, qu'ils devaient \
abandonner pour grandir. Beaucoup de fossiles sont d'ailleurs des mues, et non des \
animaux morts. Seule cette carapace minéralisée s'est conservée ; les pattes, les \
antennes et les branchies ont disparu. Dans les schistes de Wheeler, une boue fine \
déposée dans une eau calme et pauvre en oxygène a recouvert les carapaces sans les \
disperser. La roche se fend selon ses couches et révèle le fossile intact, souvent \
d'un noir qui tranche sur le gris du schiste."""
details = [
  "Les trois lobes dans la longueur du corps, qui ont donné son nom au groupe.",
  "La glabelle, le renflement allongé au milieu de la tête.",
  "Les anneaux articulés du thorax, terminés par des pointes arrondies.",
  "La petite queue en bouclier, au bas du fossile.",
]
themes = ["fossile", "cambrien", "mer", "trilobite", "arthropode"]
anecdote = """
Selon des témoignages recueillis au XXᵉ siècle, les Utes de l'Utah portaient des \
trilobites en amulette, pour se protéger de la maladie. Le nom qu'ils leur donnaient \
évoquait de petits insectes d'eau logés dans une maison de pierre."""
salle = 4
mur = "nord"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Ammonite Dactylioceras commune"
artiste = "Falaises de Whitby, Angleterre"
annee = "Jurassique inférieur, il y a environ 180 millions d'années"
image = "ammonite-whitby.jpg"
credit = "Photo : Fred Cherrygarden"
licence = "CC BY-SA 4.0"
source = "https://commons.wikimedia.org/wiki/File:Dactylioceras_commune.jpg"
technique = "Coquille fossilisée dans une roche argileuse ; 7 cm de diamètre"
collection = "Collection particulière (collection Cherrygarden)"
note = "Une ammonite de 7 cm, montrée ici agrandie, trouvée à Whitby, sur la côte du Yorkshire. Ces coquilles enroulées étaient pour les habitants des serpents changés en pierre."
description = """
Une coquille enroulée en spirale plate, d'un gris anthracite, se détache sur un fond \
blanc. On compte plusieurs tours, de plus en plus larges du centre vers l'extérieur, \
emboîtés les uns dans les autres comme une corde lovée. Chaque tour est orné de côtes \
fines et serrées, régulières comme les dents d'un peigne, qui rayonnent du centre vers \
le bord ; près de l'extérieur, elles se dédoublent. Le centre de la spirale, \
minuscule, forme un petit creux. À droite, la coquille disparaît en partie dans la \
roche qui l'enveloppe encore, une gangue grise et lisse ; en bas, le dernier tour, \
plus usé, laisse voir le relief des côtes vu de profil."""
evocation = """
L'ammonite est l'une des formes les plus familières de la paléontologie, et l'une des \
plus mystérieuses pour ceux qui la trouvaient sans la comprendre. Sa spirale a évoqué \
un serpent enroulé, une corne de bélier, une roue. Pour les géologues, elle est aussi \
une horloge : les espèces d'ammonites se sont succédé si vite et ont été si répandues \
qu'elles permettent de dater les roches à moins d'un million d'années près. Leur \
disparition, il y a 66 millions d'années, en même temps que celle des grands \
dinosaures, rappelle enfin la fragilité des groupes les plus prospères : les ammonites \
avaient peuplé les mers pendant plus de trois cents millions d'années."""
histoire = """
Les falaises de Whitby, sur la côte du Yorkshire du Nord, livrent des ammonites depuis \
des siècles : les tempêtes et les éboulements les détachent de la roche, et on les \
ramasse sur la plage. Une légende les rattache à sainte Hilda, l'abbesse qui fonda au \
VIIᵉ siècle l'abbaye de Whitby : elle aurait changé en pierre les serpents qui \
infestaient le lieu. Les marchands sculptaient parfois une tête de serpent au bout de \
la spirale pour vendre ces « pierres de serpent » aux visiteurs, et trois ammonites \
figurent sur les armoiries de la ville. Ce spécimen, trouvé à Whitby, appartient à une \
collection privée et a été photographié par son propriétaire."""
facture = """
L'ammonite était un mollusque céphalopode, cousin des pieuvres, des seiches et du \
nautile. Sa coquille était divisée en loges par des cloisons ; l'animal vivait dans la \
dernière, la plus grande, et réglait sa flottaison en remplissant les autres de gaz ou \
de liquide. Le nom Dactylioceras signifie à peu près « corne en anneaux » : il fait \
allusion aux côtes serrées qui cerclent chaque tour. À Whitby, les ammonites sont \
souvent conservées dans des nodules, des boules de roche plus dure formées autour \
d'elles dans la boue du fond marin, qui les ont protégées de l'écrasement."""
details = [
  "Les côtes serrées qui rayonnent sur chaque tour de spire.",
  "Le dédoublement des côtes près du bord extérieur.",
  "Le minuscule creux du centre, là où l'animal a commencé sa coquille.",
  "La gangue de roche grise, encore attachée sur la droite.",
]
themes = ["fossile", "jurassique", "mer", "spirale", "légende"]
anecdote = """
Le mot ammonite vient du dieu égyptien Amon, représenté avec des cornes de bélier. \
L'écrivain romain Pline l'Ancien appelait ces fossiles « cornes d'Ammon », à cause de \
leur ressemblance avec une corne enroulée."""
salle = 4
mur = "sud"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Coquille de nautile, en coupe"
artiste = "Récifs de l'Indo-Pacifique"
annee = "Espèce actuelle, d'une lignée vieille de près de 500 millions d'années"
image = "nautile.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Nautilus_pompilius_(YPM_IZ_047418).jpeg"
technique = "Coquille de Nautilus pompilius sciée en deux (aragonite et nacre) ; environ 18 cm"
collection = "Yale Peabody Museum, New Haven (Connecticut)"
note = "Une coquille de nautile sciée en deux, longue d'environ 18 cm : ses loges successives dessinent une spirale parfaite, et la grande chambre où vivait l'animal brille de nacre."
description = """
La coquille, coupée en deux dans sa longueur, se présente sur un fond noir. À droite, \
une spirale de cloisons courbes, d'un brun doré, s'enroule autour d'un minuscule \
centre blanc : on y compte une trentaine de loges en forme de croissant, de plus en \
plus grandes à mesure que l'on s'éloigne du cœur. À gauche s'ouvre la dernière \
chambre, de loin la plus vaste, lisse et vide, tapissée d'une nacre crème qui se \
teinte de reflets roses, verts et dorés selon la lumière. Le bord extérieur de la \
coquille, plus mat, dessine une courbe continue, du bec pointu de l'ouverture, en bas \
à gauche, jusqu'au sommet de la spirale."""
evocation = """
Le nautile est l'un des emblèmes de la beauté naturelle. Sa spirale, qui grandit sans \
changer de forme, a fasciné les mathématiciens comme les artistes. À la Renaissance, \
les orfèvres montaient des coquilles de nautile sur des pieds d'argent doré pour en \
faire des coupes d'apparat, fierté des cabinets de curiosités des princes. Jules Verne \
donna son nom au sous-marin du capitaine Nemo. Pour les biologistes, c'est aussi un \
témoin : le nautile est le dernier représentant d'une lignée de céphalopodes à \
coquille qui existait déjà avant les ammonites et leur a survécu. Couper sa coquille, \
c'est rendre visible l'histoire d'une vie entière, loge après loge."""
histoire = """
Le nautile chambré vit dans l'Indo-Pacifique, des Philippines et de l'Indonésie à \
l'Australie et aux îles Fidji, le long des pentes abruptes des récifs coralliens, \
souvent à plusieurs centaines de mètres de profondeur ; il remonte la nuit pour se \
nourrir. Ses coquilles, très recherchées, ont longtemps été pêchées en grand nombre \
pour le commerce des souvenirs et de la nacre. Comme il grandit lentement et se \
reproduit peu, ses populations ont décliné ; en 2016, il a été inscrit à l'annexe II \
de la convention de Washington (CITES), qui encadre son commerce international. Ce \
spécimen appartient au Yale Peabody Museum ; sa photographie a été publiée par le \
musée dans le domaine public."""
facture = """
La coquille est faite d'aragonite, une forme du carbonate de calcium. À mesure qu'il \
grandit, l'animal avance dans sa coquille et construit derrière lui une nouvelle \
cloison : les loges vides, remplies de gaz et d'un peu de liquide, servent de \
flotteur. Un fin tube de tissu vivant, le siphon, les traverse toutes et permet de \
régler la quantité de liquide, comme les ballasts d'un sous-marin. L'intérieur de la \
grande chambre est tapissé de nacre, faite de minuscules plaquettes empilées qui \
décomposent la lumière en reflets irisés."""
details = [
  "La trentaine de loges en croissant, de plus en plus grandes vers l'extérieur.",
  "Le minuscule centre blanc, première loge de l'animal.",
  "Les reflets roses et verts de la nacre dans la grande chambre.",
  "Le bec pointu de l'ouverture, en bas à gauche.",
]
themes = ["coquillage", "spirale", "mer", "nacre", "céphalopode"]
anecdote = """
On lit souvent que la spirale du nautile suit le nombre d'or. C'est une idée reçue : \
les mesures de nombreuses coquilles montrent que leur spirale s'élargit selon un \
rapport différent, et variable d'un individu à l'autre."""
salle = 4
mur = "est"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "L'archéoptéryx de Berlin"
artiste = "Gisement de Solnhofen, Allemagne"
annee = "Jurassique supérieur, il y a environ 150 millions d'années ; découvert vers 1876"
image = "archeopteryx-berlin.jpg"
credit = "Photo : H. Raab"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Archaeopteryx_lithographica_(Berlin_specimen).jpg"
technique = "Squelette et empreintes de plumes dans une plaque de calcaire lithographique"
collection = "Museum für Naturkunde, Berlin"
note = "Des plumes et des ailes d'oiseau, mais des dents, des doigts griffus et une longue queue osseuse de reptile : le spécimen de Berlin, le plus complet des archéoptéryx, est l'un des fossiles les plus célèbres du monde."
description = """
Sur une plaque de calcaire beige, fendue de longues fissures, un animal de la taille \
d'un pigeon est étendu, les ailes grandes ouvertes. On distingue nettement les os, \
fins et clairs, et tout autour l'empreinte des plumes, qui rayonnent en éventail de \
chaque bras. La tête, petite, est rejetée en arrière, à gauche, le cou recourbé \
au-dessus du dos ; on devine les dents dans le museau. Les deux pattes, repliées, \
descendent vers le bas de la plaque et se terminent par des pieds aux doigts griffus. \
Entre elles, une longue queue faite de vertèbres file vers le bas à gauche, bordée de \
chaque côté d'une rangée de plumes qui dessine une traîne."""
evocation = """
L'archéoptéryx est devenu le symbole de l'évolution. Le premier squelette est \
découvert en 1861, deux ans à peine après la parution de L'Origine des espèces de \
Charles Darwin, et il offre ce que réclamaient ses adversaires : une forme \
intermédiaire entre deux grands groupes. On sait aujourd'hui qu'il n'est pas l'ancêtre \
direct des oiseaux, mais l'un des représentants d'une famille de petits dinosaures à \
plumes dont les oiseaux descendent. La posture du spécimen de Berlin, tête renversée \
et cou arqué, est celle de nombreux fossiles d'animaux morts dans l'eau : elle donne à \
cette plaque une intensité dramatique, comme un instant figé."""
histoire = """
Le spécimen de Berlin est mis au jour vers 1876 près d'Eichstätt, en Bavière, dans une \
carrière de calcaire. Il passe entre plusieurs mains, puis la famille Häberlein, qui \
avait déjà vendu le premier squelette au British Museum, le met en vente. Pour qu'il \
ne quitte pas l'Allemagne, l'industriel Werner von Siemens l'achète en 1880 ; le musée \
d'histoire naturelle de l'université de Berlin le lui rachète l'année suivante. C'est \
le premier archéoptéryx découvert avec sa tête complète. Il est aujourd'hui exposé \
dans une salle du Museum für Naturkunde de Berlin. La photographie montre l'original, \
et non l'un des nombreux moulages qui en circulent."""
facture = """
Le calcaire de Solnhofen est d'un grain extraordinairement fin : il s'est formé à \
partir d'une boue calcaire déposée au fond de lagunes aux eaux stagnantes, si salées \
et pauvres en oxygène que les charognards n'y vivaient pas. Les cadavres tombés au \
fond y étaient recouverts sans être déchiquetés, et la boue a pu garder la trace de \
chaque plume, jusqu'aux barbes. Le fossile a été dégagé de la pierre à l'aiguille, \
grain par grain. On distingue ici deux sortes de plumes : les grandes plumes \
asymétriques des ailes, semblables à celles des oiseaux volants, et celles, disposées \
par paires, de la queue."""
details = [
  "Les plumes des ailes, dont l'empreinte rayonne en éventail autour des bras.",
  "La tête rejetée en arrière, au bout du cou recourbé.",
  "Les griffes au bout des doigts des pieds, en bas de la plaque.",
  "La longue queue osseuse, bordée d'une plume de chaque côté de chaque vertèbre.",
]
themes = ["fossile", "dinosaure", "oiseau", "évolution", "jurassique"]
anecdote = """
Selon un récit souvent répété, le paysan qui découvrit le spécimen de Berlin, Jakob \
Niemeyer, l'aurait cédé pour pouvoir acheter une vache. Quelques années plus tard, le \
fossile se vendait pour 20 000 marks."""
salle = 2
mur = "ouest"
place = 6
largeur = 1.3

[[oeuvres]]
titre = "Coléoptère pris dans l'ambre de la Baltique"
artiste = "Forêts d'ambre de la Baltique"
annee = "Éocène, il y a environ 45 millions d'années"
image = "ambre-coleoptere.jpg"
credit = "Photo : James St. John"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Beetle_in_amber_(Amber_Formation,_Middle_Eocene;_Yantarnyi,_Samland_Peninsula_along_the_Baltic_Sea,_far-western_Russia)_(15111983330).jpg"
technique = "Ambre (résine fossile) contenant un coléoptère d'environ 3,5 mm ; vue au microscope"
collection = "Collection non précisée (photographie de James St. John)"
note = "Un coléoptère de 3,5 mm englué dans une coulée de résine il y a quelque 45 millions d'années, vu ici au microscope : l'ambre l'a conservé avec ses moindres reliefs."
description = """
L'image est un très fort agrandissement. Dans une matière translucide d'un jaune doré, \
qui vire à l'orange et au brun sur les bords, un petit insecte allongé occupe le \
centre. C'est un coléoptère, vu de dos, la tête en haut : son corps brun sombre est \
couvert de rangées régulières de minuscules points en creux, alignés comme les mailles \
d'un tricot. On devine la tête, le corselet et les deux élytres, les ailes dures qui \
protègent le dos. Autour de lui, la résine n'est pas uniforme : des zones plus \
claires, presque lumineuses, alternent avec des voiles plus sombres. En haut à droite, \
une tache rouge marque la courbe du bord de la pierre."""
evocation = """
L'ambre est une capsule temporelle. L'insecte s'est posé sur une coulée de résine, s'y \
est englué, et la résine l'a recouvert : 45 millions d'années plus tard, il est là, \
intact, comme s'il venait de mourir. Rien n'évoque mieux l'immobilité du temps \
géologique. Ces inclusions ont fait rêver bien avant la science : on y voyait des \
mouches et des fourmis mises au tombeau dans l'or, et les poètes latins s'en \
émerveillaient déjà. Elles font rêver encore, depuis qu'un roman puis un film ont \
imaginé de faire renaître des dinosaures à partir d'un moustique conservé dans \
l'ambre, idée que l'état réel de l'ADN fossile rend impossible."""
histoire = """
Il y a environ 45 millions d'années, à l'Éocène, de vastes forêts de conifères \
couvraient le nord de l'Europe, sous un climat plus chaud qu'aujourd'hui. Leur résine, \
emportée par les rivières, s'est accumulée dans une couche de sable argileux que les \
mineurs appellent la « terre bleue ». Le plus grand gisement se trouve sur la \
presqu'île de Sambie, près de Kaliningrad, en Russie, où la mine à ciel ouvert de \
Iantarny fournit l'essentiel de l'ambre mondial. Ce coléoptère vient de là. Depuis la \
préhistoire, la mer arrache aussi des morceaux d'ambre aux couches sous-marines et les \
rejette sur les plages après les tempêtes : on le ramassait déjà pour le faire \
voyager, par la route de l'ambre, jusqu'à la Méditerranée."""
facture = """
Fraîche, la résine est collante et visqueuse. Enfouie, elle perd peu à peu ses \
éléments volatils, ses molécules se lient en longues chaînes, et elle durcit en copal, \
puis, au fil de millions d'années, en ambre. L'insecte englouti se dessèche dans cet \
écrin sans air, et la résine en moule chaque relief, jusqu'aux poils et aux \
ponctuations de la carapace. L'ambre est léger : il flotte dans l'eau très salée, \
propriété qu'on utilise pour le distinguer de ses imitations. La photographie, prise à \
travers un microscope, montre l'insecte bien plus grand qu'une lettre de ce texte."""
details = [
  "Les rangées de petits points en creux sur les élytres du coléoptère.",
  "La tête et le corselet, en haut du corps.",
  "Les zones claires et sombres de la résine autour de l'insecte.",
  "La courbe rougeâtre du bord de la pierre, en haut à droite.",
]
themes = ["ambre", "insecte", "forêt", "éocène", "temps"]
anecdote = """
Les Grecs appelaient l'ambre êlektron. Ils avaient remarqué qu'une fois frotté, il \
attire les brindilles et les poussières : c'est de ce mot que vient, bien plus tard, \
le mot électricité."""
salle = 2
mur = "est"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Le Diplodocus de Carnegie, monté au Muséum en 1908"
artiste = "Formation de Morrison, Wyoming"
annee = "Jurassique supérieur, il y a environ 150 millions d'années ; moulage et photographie de 1908"
image = "diplodocus-paris.jpg"
cadre = "noir"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Carnegie_Diplodocus,_Paris_LCCN2014681898_(cropped).jpg"
technique = "Photographie (négatif sur verre) de l'agence Bain News Service ; moulage en plâtre d'un squelette d'environ 25 m de long"
collection = "Library of Congress, Washington (photographie) ; galerie de Paléontologie et d'Anatomie comparée, Muséum national d'Histoire naturelle, Paris (moulage)"
note = "En 1908, le milliardaire américain Andrew Carnegie offre à la France le moulage de son diplodocus. On le voit ici en cours de montage dans la galerie de Paléontologie du Muséum, où il se trouve toujours."
description = """
La photographie est prise d'en haut, depuis le balcon d'une galerie de musée. Au \
centre, le squelette d'un dinosaure géant est en cours d'assemblage sur une estrade de \
bois. On reconnaît l'énorme bassin et les pattes arrière, droites comme des colonnes, \
puis la cage thoracique, à droite, dont les côtes descendent comme les membrures d'une \
coque de navire. La longue queue s'abaisse en courbe vers le bas à gauche jusqu'au \
sol. Autour, des ouvriers en blouse et des messieurs en costume observent ou \
travaillent ; un homme est juché tout en haut, près du dos. Des échelles, des vitrines \
remplies de fossiles et de hautes fenêtres complètent la scène. En haut, une \
inscription blanche indique : Carnegie Diplodocus, Paris."""
evocation = """
Cette image raconte la naissance d'une passion : celle du public pour les dinosaures. \
Au début du XXᵉ siècle, ces géants venus d'Amérique attirent les foules dans les \
musées d'Europe. Elle dit aussi l'époque des grands mécènes : en offrant des moulages \
de son diplodocus aux souverains et aux chefs d'État, Andrew Carnegie, roi de l'acier \
devenu philanthrope et militant de la paix, faisait de la science un instrument de \
diplomatie. Les ouvriers, minuscules au pied du squelette, donnent l'échelle du \
monstre. Et le lieu lui-même parle : c'est la galerie que les visiteurs du Jardin des \
Plantes parcourent encore aujourd'hui, avec le même diplodocus au centre."""
histoire = """
En juillet 1899, une équipe du Carnegie Museum de Pittsburgh découvre un squelette de \
sauropode à Sheep Creek, dans le Wyoming. Le paléontologue John Bell Hatcher le décrit \
en 1901 sous le nom de Diplodocus carnegii, en l'honneur de son mécène. Le roi Édouard \
VII, qui en a vu un dessin chez Carnegie, en souhaite un pour Londres : un moulage \
complet est inauguré en 1905 au musée d'histoire naturelle de Londres. D'autres \
suivent, à Berlin, à Paris, à Vienne, à Bologne, à Saint-Pétersbourg, à La Plata, à \
Madrid ou à Mexico. Le moulage parisien est monté en 1908 par une équipe venue de \
Pittsburgh, sous la direction du directeur du Carnegie Museum, William Jacob Holland. \
Il se dresse toujours dans la galerie de Paléontologie, ouverte en 1898."""
facture = """
Chaque os a été moulé, puis reproduit en plâtre renforcé, avant d'être assemblé sur \
une armature de fer qui supporte l'ensemble. La pose est celle qu'on imaginait alors : \
pattes droites sous le corps, queue traînant jusqu'au sol. Les paléontologues pensent \
aujourd'hui que la queue était tenue à l'horizontale, au-dessus du sol, pour \
équilibrer le long cou. La photographie, prise sur une plaque de verre par l'agence \
new-yorkaise Bain News Service, fait partie d'un immense fonds conservé à la \
Bibliothèque du Congrès ; sa légende a été inscrite directement sur le négatif. Elle \
est ici présentée dans un cadre noir."""
details = [
  "Les pattes arrière, droites comme des colonnes, sur l'estrade de bois.",
  "Les épines des vertèbres, dressées le long du dos.",
  "La queue qui descend jusqu'au sol, en bas à gauche.",
  "L'homme juché tout en haut du squelette, près du dos.",
  "L'inscription blanche, en haut, gravée sur le négatif.",
]
