# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Gibeon, Namibie"
vie = "Sud de la Namibie, autour de la ville de Gibeon ; chute préhistorique"
biographie = """
Le champ de météorites de Gibeon s'étend dans le sud de la Namibie, dans la région de \
Hardap, au cœur du Grand Namaqualand, un pays de plateaux arides. La chute a eu lieu \
bien avant l'histoire écrite : un gros bloc de fer, entré dans l'atmosphère, s'est \
brisé en une pluie de fragments répandus sur des centaines de kilomètres. Les Nama, \
éleveurs de la région, connaissaient ces pierres lourdes et en tiraient du métal pour \
leurs outils et leurs armes. Au XIXᵉ siècle, des échantillons rapportés en Europe sont \
reconnus comme du fer météoritique, et la région devient l'un des lieux les plus \
riches du monde en météorites métalliques. Des centaines de masses ont été \
recueillies, certaines de plusieurs centaines de kilos. Le corps d'origine était le \
noyau métallique d'un petit astéroïde, formé dans les premiers millions d'années du \
système solaire, puis mis à nu et fragmenté par des collisions. Pour enrayer le \
pillage, la Namibie a fait des météorites de Gibeon un patrimoine protégé ; une \
trentaine de grandes masses sont exposées à Windhoek, la capitale."""
style = """
Le fer de Gibeon est une octaédrite fine du groupe IVA, un alliage de fer et de nickel \
à environ 8 % de nickel. Une fois scié, poli et attaqué à l'acide, il révèle des \
figures de Widmanstätten très serrées, aux lames étroites et régulières, d'une grande \
élégance. Il est relativement stable et se prête au polissage : les joailliers, les \
horlogers et les couteliers l'utilisent pour des cadrans, des bagues ou des lames, ce \
qui en a fait l'une des météorites les plus répandues sur le marché."""

[[artistes]]
nom = "Mines de Golconde, Inde"
vie = "Vallée de la Krishna, Deccan (Inde du Sud) ; diamants exploités de l'Antiquité au XIXᵉ siècle"
biographie = """
Pendant des siècles, l'Inde a été la seule source de diamants connue au monde. Les \
pierres étaient extraites des alluvions de la vallée de la Krishna, dans le Deccan, où \
des milliers de mineurs creusaient et lavaient les graviers. Elles étaient taillées et \
vendues à Golconde, une forteresse et une ville marchande proche de l'actuelle \
Hyderabad, capitale du sultanat des Qutb Shahi de 1518 jusqu'à sa conquête par \
l'empereur moghol Aurangzeb en 1687. Le nom de Golconde a fini par désigner toutes les \
mines de la région, et par devenir synonyme de richesse fabuleuse. Au XVIIᵉ siècle, le \
marchand français Jean-Baptiste Tavernier y fait plusieurs voyages et décrit les \
mines, dont celle de Kollur, sur la Krishna, d'où viendrait le grand diamant bleu \
vendu à Louis XIV. Les plus célèbres diamants historiques sont nés là : le Koh-i-Noor, \
aujourd'hui dans les joyaux de la couronne britannique, le Régent, exposé au Louvre, \
et le diamant Hope. La découverte de gisements au Brésil, au XVIIIᵉ siècle, puis en \
Afrique du Sud, au XIXᵉ, met fin à la suprématie indienne."""
style = """
Les diamants de Golconde sont réputés pour leur limpidité exceptionnelle : beaucoup \
appartiennent au type IIa, presque dépourvus d'azote, d'une transparence que les \
joailliers comparent à celle de l'eau. Certains sont colorés, comme le bleu du Hope. \
Taillés d'abord en Inde selon des formes qui conservaient le plus de matière, ils ont \
souvent été retaillés en Europe. L'expression « diamant de Golconde » désigne encore \
aujourd'hui, dans les ventes aux enchères, une pierre ancienne d'une pureté rare."""

[[artistes]]
nom = "Massif du Mont-Blanc, France"
vie = "Alpes occidentales, entre la France, l'Italie et la Suisse ; granite d'environ 300 millions d'années, fissures nées du soulèvement des Alpes"
biographie = """
Le massif du Mont-Blanc, qui culmine à plus de 4 800 mètres, est fait pour l'essentiel \
d'un granite très ancien, né il y a environ 300 millions d'années dans les profondeurs \
d'une chaîne de montagnes aujourd'hui disparue. Lors de la formation des Alpes, ce \
granite a été repris, soulevé et fracturé. Dans les fissures ouvertes par ces \
mouvements ont circulé des eaux chaudes, chargées d'éléments dissous, qui ont tapissé \
les cavités de cristaux : quartz limpides ou fumés, fluorites roses, adulaires. Les \
habitants de la vallée de Chamonix les cherchent depuis des siècles. Ces cristalliers, \
qui parcouraient les glaciers bien avant les alpinistes, sont parmi les premiers à \
connaître la haute montagne ; le savant genevois Horace-Bénédict de Saussure, qui \
atteint le sommet du Mont-Blanc en 1787, en parle dans ses récits de voyage. Le métier \
se perpétue aujourd'hui, encadré par des règles locales, et les plus belles pièces \
rejoignent les musées : la galerie de Minéralogie du Muséum, à Paris, en présente \
plusieurs."""
style = """
Les cristaux du Mont-Blanc sont des cristaux de fissure : ils ont grandi librement \
dans le vide d'une cavité, ce qui leur donne des formes nettes et des faces \
brillantes. Le massif est célèbre pour ses quartz fumés, parfois presque noirs, et \
surtout pour ses fluorites roses en octaèdres, parmi les plus belles du monde. Leur \
association, le rose sur le brun, est la signature des grandes trouvailles des \
cristalliers."""

[[artistes]]
nom = "Coulées de lave de la Serra Geral, Brésil"
vie = "Bassin du Paraná (sud du Brésil, Uruguay, Paraguay, Argentine) ; début du Crétacé, il y a environ 130 millions d'années"
biographie = """
Il y a environ 130 millions d'années, le supercontinent du Gondwana commence à se \
déchirer : l'Amérique du Sud et l'Afrique s'éloignent, et l'océan Atlantique Sud \
s'ouvre peu à peu entre elles. Ce déchirement s'accompagne d'éruptions d'une ampleur \
inouïe. Par de longues fissures, d'immenses volumes de lave basaltique se répandent en \
coulées successives sur le sud de l'Amérique du Sud, et sur la région qui deviendra la \
Namibie, de l'autre côté du futur océan. Empilées, ces coulées forment aujourd'hui la \
Serra Geral, des plateaux de roche sombre épais par endroits de plus d'un kilomètre ; \
les chutes d'Iguaçu, à la frontière du Brésil et de l'Argentine, se jettent du haut de \
ces basaltes. Dans certaines coulées, la lave était truffée de bulles de gaz. Bien \
plus tard, des eaux souterraines riches en silice ont rempli ces cavités de \
calcédoine, d'agate et de quartz. Le Rio Grande do Sul, au Brésil, et la région \
d'Artigas, en Uruguay, sont devenus les premiers producteurs mondiaux de géodes \
d'améthyste."""
style = """
Les géodes de la Serra Geral se reconnaissent à leur coque de basalte gris-vert, à \
leur liseré de calcédoine et à leurs cristaux d'améthyste serrés, d'un violet souvent \
profond. Certaines, allongées comme des grottes, dépassent la taille d'un homme. On en \
tire aussi les agates rubanées du Brésil, souvent teintes, et des cristaux de calcite \
qui se posent sur l'améthyste."""

[[artistes]]
nom = "Schistes de Wheeler, Utah"
vie = "House Range, ouest de l'Utah (États-Unis) ; Cambrien moyen, il y a un peu plus de 500 millions d'années"
biographie = """
Il y a un peu plus de 500 millions d'années, l'ouest de l'actuelle Amérique du Nord \
était bordé par une mer tropicale, proche de l'équateur. Au pied d'une plate-forme \
calcaire, dans une dépression où l'eau était calme et pauvre en oxygène, une boue fine \
s'accumulait lentement. Elle a recouvert les animaux qui vivaient ou mouraient sur le \
fond, et elle est devenue une roche feuilletée, les schistes de Wheeler, qui \
affleurent aujourd'hui dans les monts de la House Range, à l'ouest de l'Utah, dans un \
paysage de désert. C'est l'époque de l'« explosion cambrienne », où apparaissent en \
peu de temps la plupart des grands groupes d'animaux. Les trilobites dominent ces \
fonds marins, mais les schistes de Wheeler ont aussi livré des éponges, des méduses et \
des animaux à corps mou, conservés comme dans les célèbres schistes de Burgess, au \
Canada. Exploités par des carrières commerciales, ils fournissent à eux seuls une \
grande partie des trilobites vendus dans le monde, et continuent d'intéresser les \
chercheurs."""
style = """
Les fossiles des schistes de Wheeler se reconnaissent à leur carapace noire et \
brillante, de calcite, qui tranche sur un schiste gris clair et se détache facilement \
quand on fend la roche. Les trilobites y sont nombreux, complets et bien articulés, \
souvent d'espèces de petite taille, comme Elrathia kingii. Leur abondance en fait une \
porte d'entrée idéale vers la paléontologie."""

[[artistes]]
nom = "Falaises de Whitby, Angleterre"
vie = "Côte du Yorkshire du Nord ; Jurassique inférieur, il y a environ 180 millions d'années"
biographie = """
Les falaises de Whitby, sur la côte de la mer du Nord, sont faites de roches sombres \
déposées il y a environ 180 millions d'années, au Jurassique inférieur, au fond d'une \
mer peu oxygénée. Elles regorgent de fossiles : ammonites, bélemnites, poissons et \
grands reptiles marins comme les ichtyosaures et les plésiosaures. Leur histoire \
humaine est liée à ces pierres. Au VIIᵉ siècle, sainte Hilda fonde sur la falaise une \
abbaye dont les ruines dominent encore la ville. Du XVIIᵉ au XIXᵉ siècle, on exploite \
les schistes pour en tirer l'alun, utilisé pour fixer les teintures, et les carriers \
mettent au jour de nombreux squelettes. Whitby est aussi célèbre pour son jais, un \
bois fossile noir et brillant ; après la mort du prince Albert en 1861, la reine \
Victoria en lance la mode pour les bijoux de deuil. Enfin, c'est sur cette côte que \
Bram Stoker, dans son roman Dracula paru en 1897, fait débarquer le vampire. Les \
éboulements renouvellent sans cesse les fossiles, que les promeneurs ramassent sur les \
plages."""
style = """
Les fossiles de Whitby se distinguent par leur conservation dans des nodules, des \
boules de roche dure, et par leur teinte sombre, parfois dorée par la pyrite. Les \
ammonites y sont si nombreuses que les géologues ont pu découper le temps en zones \
portant leurs noms. Dactylioceras, aux côtes fines et serrées, en est l'espèce la plus \
typique, celle des « pierres de serpent » de la légende."""

[[artistes]]
nom = "Récifs de l'Indo-Pacifique"
vie = "Pentes des récifs coralliens, des Philippines aux îles Fidji et à l'Australie ; aujourd'hui"
biographie = """
Le nautile chambré vit dans les eaux tropicales de l'Indo-Pacifique, des Philippines \
et de l'Indonésie à la Nouvelle-Guinée, au nord de l'Australie et aux îles Fidji. Il \
fréquente les pentes abruptes qui bordent les récifs coralliens, à des profondeurs \
souvent de plusieurs centaines de mètres, et remonte la nuit vers des eaux moins \
profondes pour chasser ou charognarder. Il porte autour de la bouche des dizaines de \
tentacules sans ventouses et voit le monde à travers des yeux très simples, sans \
cristallin, qui fonctionnent comme une chambre noire. Sa lignée, celle des \
nautiloïdes, remonte à près de 500 millions d'années : leurs coquilles, droites ou \
enroulées, peuplaient déjà les mers de l'époque des trilobites, et elles ont survécu \
aux grandes extinctions qui ont emporté les ammonites. Le nautile grandit lentement, \
vit une vingtaine d'années et pond peu d'œufs. La pêche intensive pour ses coquilles a \
fait reculer ses populations : depuis 2017, son commerce international est soumis à \
des permis."""
style = """
Vue de l'extérieur, la coquille du nautile est blanche, rayée de flammes brun-roux qui \
s'estompent vers l'ouverture. En coupe, elle révèle sa beauté cachée : une spirale de \
loges régulières, d'un brun doré, et une grande chambre tapissée de nacre irisée. Les \
orfèvres de la Renaissance la polissaient pour faire paraître la nacre et la montaient \
en coupe précieuse."""

[[artistes]]
nom = "Gisement de Solnhofen, Allemagne"
vie = "Vallée de l'Altmühl, Bavière ; Jurassique supérieur, il y a environ 150 millions d'années"
biographie = """
Il y a environ 150 millions d'années, la Bavière était couverte par une mer chaude \
parsemée d'îles et de récifs, en bordure de l'océan Téthys. Entre les récifs \
s'étendaient des lagunes aux eaux stagnantes, très salées et privées d'oxygène au \
fond. Une boue calcaire très fine s'y déposait en couches minces, qui ont donné le \
calcaire de Solnhofen, exploité aujourd'hui dans les carrières de la vallée de \
l'Altmühl, autour de Solnhofen et d'Eichstätt. On en tire depuis l'époque romaine des \
dalles de sol et de toiture. En 1796, Alois Senefelder découvre qu'on peut imprimer à \
partir de ces pierres parfaitement lisses : c'est l'invention de la lithographie, qui \
fera la fortune des carrières. Les ouvriers qui fendent les plaques mettent au jour \
des fossiles d'une finesse inégalée : poissons, crabes, limules, libellules, \
ptérosaures, le petit dinosaure Compsognathus et surtout l'archéoptéryx. Une plume \
isolée est décrite en 1861, et le premier squelette est découvert la même année ; on \
en connaît aujourd'hui une douzaine."""
style = """
Les fossiles de Solnhofen ressemblent à des gravures : aplatis entre deux feuillets de \
calcaire beige, ils conservent les contours les plus délicats, ailes d'insectes, \
membranes de ptérosaures, plumes. On y trouve même des traces de pas, et la piste \
d'une limule qui s'achève sur le corps de l'animal mort. Ce gisement est l'un des \
grands modèles de ce que les paléontologues appellent une conservation exceptionnelle."""

[[artistes]]
nom = "Forêts d'ambre de la Baltique"
vie = "Nord de l'Europe, à l'Éocène, il y a environ 45 millions d'années ; gisements de la presqu'île de Sambie (Kaliningrad, Russie)"
biographie = """
Il y a environ 45 millions d'années, à l'Éocène, le climat de la Terre était bien plus \
chaud qu'aujourd'hui, et de grandes forêts de conifères et de feuillus couvraient le \
nord de l'Europe, sur les terres de l'actuelle Scandinavie. Leurs arbres produisaient \
de la résine en abondance. Charriée par les rivières, elle s'est accumulée dans les \
sédiments d'un delta, où elle s'est lentement transformée en ambre. Ces dépôts \
affleurent aujourd'hui autour de la mer Baltique, surtout sur la presqu'île de Sambie, \
près de Kaliningrad, où la mine de Iantarny exploite la couche de « terre bleue ». La \
mer en arrache aussi des morceaux qu'elle rejette sur les plages après les tempêtes. \
Depuis la préhistoire, l'ambre baltique est recherché et échangé : il voyageait \
jusqu'à la Méditerranée par la route de l'ambre, et les Romains l'appréciaient. Au \
Moyen Âge, les chevaliers Teutoniques en contrôlent la récolte. Au XVIIIᵉ siècle, la \
Chambre d'ambre, offerte par le roi de Prusse au tsar Pierre le Grand, est l'un des \
plus fameux décors de l'Europe ; elle disparaît pendant la Seconde Guerre mondiale."""
style = """
L'ambre de la Baltique, appelé succinite, va du jaune miel au brun rouge, transparent \
ou laiteux. Il est célèbre pour la richesse de ses inclusions : insectes, araignées, \
fleurs, plumes, poils de mammifères, conservés en trois dimensions avec une précision \
que nul autre fossile n'atteint. Les scientifiques y ont décrit des milliers d'espèces \
disparues, qui font revivre la forêt de l'Éocène."""

[[artistes]]
nom = "Formation de Morrison, Wyoming"
vie = "Ouest des États-Unis, du Montana au Nouveau-Mexique ; Jurassique supérieur, il y a environ 155 à 148 millions d'années"
biographie = """
La formation de Morrison est un ensemble de couches de grès, d'argiles et de calcaires \
qui affleure dans l'ouest des États-Unis, du Montana au Nouveau-Mexique. Elle porte le \
nom de la petite ville de Morrison, dans le Colorado, près de laquelle on découvre des \
os de dinosaures en 1877. Il y a environ 150 millions d'années, c'était une vaste \
plaine traversée de rivières, au climat chaud et sec, ponctuée de lacs et de forêts de \
conifères et de fougères. C'est le gisement de dinosaures le plus célèbre d'Amérique : \
il a livré Diplodocus, Apatosaurus, Brontosaurus, Camarasaurus, Stegosaurus et \
Allosaurus. À la fin du XIXᵉ siècle, il est le théâtre de la « guerre des os » entre \
les paléontologues rivaux Othniel Marsh et Edward Drinker Cope, qui se disputent les \
meilleures carrières, notamment dans le Wyoming. En 1909, un chercheur du Carnegie \
Museum, Earl Douglass, découvre dans l'Utah un mur entier d'ossements, aujourd'hui \
protégé au sein du Dinosaur National Monument."""
style = """
La formation de Morrison est le royaume des sauropodes, ces géants au long cou et à la \
longue queue, et de leurs prédateurs. Ses os, souvent bien conservés et parfois \
retrouvés en squelettes presque complets, ont permis les premiers grands montages de \
dinosaures dans les musées. Diplodocus, Stegosaurus ou Allosaurus, tous venus de ces \
couches, ont fixé pour le grand public l'image même du dinosaure."""
