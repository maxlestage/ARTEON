# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Les Dix Plus Grands, n° 7, L'Âge adulte"
artiste = "Hilma af Klint"
annee = "1907"
image = "dix-plus-grandes-7.jpg"
technique = "Tempera sur papier marouflé sur toile, 315 × 235 cm"
collection = "Fondation Hilma af Klint, Stockholm"
note = "Une abstraction de plus de trois mètres, peinte des années avant celles de Kandinsky, et restée cachée pendant près de quatre-vingts ans."
description = """
Sur un fond mauve pâle se dresse une immense forme jaune, faite de deux masses \
superposées qui ne se touchent qu'en un seul point, au centre du tableau, comme un \
sablier ou une graine qui s'ouvre. La masse du haut, marquée des chiffres romains I et \
II, est parcourue de fuseaux tracés en rouge, en rose, en blanc et en pointillé noir ; \
celle du bas, numérotée III, est rayée de lignes noires qui se resserrent vers le bas. \
Tout autour flottent des motifs plus petits : des disques verts et jaunes en haut, des \
feuilles rouges en forme de trèfle à gauche, une fleur noire, des œufs, des spirales \
et des boucles blanches qui ressemblent à une écriture. Tout en bas, sous une frise \
noire, un mot est tracé en lettres cursives : vestalasket."""
evocation = """
Les Dix Plus Grands racontent les âges de la vie humaine : deux tableaux pour \
l'enfance, deux pour la jeunesse, quatre pour l'âge adulte et deux pour la vieillesse. \
Celui-ci appartient à la maturité, et l'on y a vu une image de l'épanouissement : des \
formes qui poussent, se dédoublent et fleurissent comme des organismes vivants. Les \
lettres, les mots inventés et les couleurs relèvent d'un vocabulaire symbolique \
personnel, nourri de théosophie et de botanique ; les historiens y lisent notamment \
l'union des contraires, du masculin et du féminin. Pour Hilma af Klint, la peinture \
devait rendre visible un monde spirituel invisible. Sa redécouverte, depuis les années \
1980, a bouleversé l'histoire de l'abstraction, longtemps racontée sans elle et sans \
les femmes."""
histoire = """
Depuis les années 1890, Hilma af Klint participe avec quatre amies, le groupe des \
Cinq, à des séances spirites. En 1906, elle entreprend ce qu'elle décrit comme une \
commande reçue de guides spirituels : les Peintures pour le temple, un cycle de 193 \
œuvres achevé en 1915. Les Dix Plus Grands en forment le cœur ; elle les peint à \
l'automne 1907, à un rythme très rapide, dans son atelier de Stockholm. Elle ne les \
montre qu'à quelques proches et demande que ses œuvres abstraites ne soient pas \
exposées avant vingt ans après sa mort. Conservées par son neveu puis par une \
fondation, elles apparaissent en 1986 à Los Angeles, dans l'exposition The Spiritual \
in Art, puis triomphent au Moderna Museet de Stockholm en 2013 et au Guggenheim de New \
York en 2018."""
facture = """
Le tableau est peint à la tempera sur de grandes feuilles de papier assemblées, puis \
marouflées sur toile : un format géant que l'artiste travaillait posé au sol. Les \
couleurs sont étalées en aplats, sans modelé ni ombre, et cernées de contours nets. La \
palette, faite de mauve, de jaune d'or, de vert et de rose, n'a rien de la peinture \
académique de son temps. Formée à l'Académie royale des beaux-arts de Stockholm, Hilma \
af Klint était aussi une dessinatrice botaniste précise : on le sent dans la \
régularité des courbes et dans la symétrie de la composition, organisée le long d'un \
axe vertical."""
details = [
  "Les chiffres romains I, II et III, posés sur les grandes formes jaunes.",
  "Le point unique où se touchent les deux masses, au centre du tableau.",
  "À gauche, la tige rouge qui porte des feuilles en forme de trèfle.",
  "À droite, des boucles blanches qui semblent former une écriture inconnue.",
  "Tout en bas, le mot vestalasket tracé en lettres cursives.",
]
themes = ["âges de la vie", "spiritualité", "botanique", "symboles", "abstraction"]
anecdote = """
L'exposition Hilma af Klint présentée au Guggenheim de New York en 2018 et 2019, où la \
série des Dix Plus Grands était accrochée le long de la rampe de la rotonde, a attiré \
plus de 600 000 visiteurs : elle est devenue la plus fréquentée de toute l'histoire du \
musée."""
salle = 2
mur = "nord"
place = 4
largeur = 2.35

[[oeuvres]]
titre = "Composition VIII"
artiste = "Vassily Kandinsky"
annee = "1923"
image = "composition-viii.jpg"
technique = "Huile sur toile, 140 × 201 cm"
collection = "Solomon R. Guggenheim Museum, New York"
note = "Peinte au Bauhaus de Weimar en juillet 1923 : des cercles, des triangles et des lignes droites jouent comme les instruments d'un orchestre."
description = """
Sur un fond clair, crème et bleuté, sans horizon ni objet reconnaissable, flottent des \
dizaines de formes géométriques. En haut à gauche, un grand cercle noir au cœur \
violet, entouré d'un halo rose, domine la toile, accompagné d'un petit disque rouge. \
Au centre se dresse un grand triangle pointe en haut, traversé de lignes. Des damiers \
noirs et blancs, ou colorés, s'élancent en diagonale ; une rangée de demi-cercles \
s'aligne au-dessous comme une suite d'arches. À droite, des faisceaux de droites \
parallèles filent vers le haut, entre de petits cercles transparents, et une grille de \
lignes fines se détache sur le fond. Ailleurs, des disques jaunes, bleus ou violets, \
souvent auréolés, ponctuent la surface comme des notes."""
evocation = """
Kandinsky concevait la peinture comme une musique pour les yeux : il nomme \
Impressions, Improvisations et Compositions ses toiles abstraites, et réserve ce \
dernier titre à ses œuvres les plus réfléchies. Ici, chaque forme a sa voix : l'angle \
aigu du triangle, la tension des droites, le calme des cercles. Le grand cercle noir \
et rose, en haut à gauche, a souvent été comparé à un astre qui règle tout le tableau \
; Kandinsky écrira plus tard que le cercle réunit en lui les plus grandes oppositions. \
Comparée aux tourbillons de couleur d'avant 1914, la toile témoigne d'un tournant : au \
contact du constructivisme russe puis du Bauhaus, l'émotion passe désormais par une \
géométrie précise, sans rien perdre de son lyrisme."""
histoire = """
Rentré en Allemagne à la fin de 1921 après sept années passées en Russie, Kandinsky \
est appelé en 1922 par l'architecte Walter Gropius au Bauhaus de Weimar, l'école qui \
veut réunir l'art, l'artisanat et l'industrie. Il y enseigne la forme et la couleur et \
peint cette huitième Composition en juillet 1923. À partir de 1930, le magnat \
américain Solomon R. Guggenheim, guidé par l'artiste et conseillère Hilla Rebay, rend \
visite à Kandinsky et achète nombre de ses toiles. Composition VIII entre dans sa \
fondation créée en 1937, puis au Museum of Non-Objective Painting ouvert à New York en \
1939, ancêtre du Guggenheim actuel : elle en est restée l'un des emblèmes."""
facture = """
Les formes sont tracées à la règle et au compas, puis remplies de couleurs posées en \
aplats nets, sans empâtement. Le fond clair, légèrement nuancé, crée un espace sans \
profondeur fixe où les éléments semblent flotter à des distances différentes. Le \
peintre joue sur les contrastes : lignes noires très fines contre larges surfaces, \
bords coupants contre halos estompés, comme autour du grand cercle. Il n'y a ni centre \
unique ni symétrie : l'équilibre naît de tensions qui se compensent, que Kandinsky \
analysera dans son livre Point et ligne sur plan, publié par le Bauhaus en 1926."""
details = [
  "Le halo rose, flou, qui entoure le grand cercle noir en haut à gauche.",
  "Les damiers noirs et blancs, posés en diagonale à gauche du triangle central.",
  "La rangée de demi-cercles alignés comme des arches, sous le centre de la toile.",
  "La petite grille de lignes fines, à droite, avec ses carrés roses.",
]
themes = ["musique", "géométrie", "cercle", "bauhaus", "abstraction"]
anecdote = """
Kandinsky a peint dix grandes Compositions entre 1910 et 1939. Les trois premières ont \
été détruites pendant la Seconde Guerre mondiale : on ne les connaît plus que par des \
photographies en noir et blanc."""
salle = 2
mur = "nord"
place = 2
largeur = 2.0

[[oeuvres]]
titre = "La Tour Eiffel rouge"
artiste = "Robert Delaunay"
annee = "1911–1912"
image = "tour-eiffel-rouge.jpg"
technique = "Huile sur toile, 125 × 90,3 cm"
collection = "Solomon R. Guggenheim Museum, New York"
note = "Le symbole du Paris moderne se tord et se fragmente sous la lumière : une des Tours de Delaunay, entre cubisme et couleur pure."
description = """
La tour Eiffel, peinte d'un rouge brique, occupe toute la hauteur de la toile. Ses \
quatre piliers s'écartent largement vers le bas, comme vus d'en dessous, tandis que le \
sommet, étroit, touche le bord supérieur. Sa silhouette n'est pas droite : la première \
plateforme se tord, les montants se plient, et la tour semble vaciller. Autour d'elle, \
les immeubles de Paris se réduisent à des facettes grises, bleues et blanches qui \
s'emboîtent. À droite, de gros nuages blancs s'enroulent en boules ; en haut, des pans \
bleu sombre encadrent la scène comme des rideaux tirés devant une fenêtre. En bas à \
droite, une grande courbe jaune pâle glisse le long du bord, près de la signature du \
peintre."""
evocation = """
Pour Delaunay, la tour de 1889 est l'emblème du monde nouveau : le fer, l'ingénieur, \
la ville géante, la télégraphie sans fil dont l'antenne est installée à son sommet. En \
la brisant, il ne la détruit pas, il cherche à peindre l'expérience de celui qui la \
regarde : le vertige, la tête qui se lève et se baisse, les points de vue qui se \
superposent. Le peintre lui-même a qualifié de destructive cette période, où \
l'architecture se disloque sous l'effet de la lumière. On y a vu une célébration \
joyeuse de la modernité, mais aussi le pressentiment d'un monde instable à la veille \
de la Grande Guerre. Ses amis poètes, Apollinaire et Blaise Cendrars, chanteront eux \
aussi la tour."""
histoire = """
Delaunay peint la tour Eiffel à partir de 1909 et y revient sans cesse jusqu'à la fin \
des années 1920. En 1910, il épouse la peintre Sonia Terk, avec qui il mènera toutes \
ses recherches sur la couleur. Au printemps 1911, ses Tours sont accrochées au Salon \
des indépendants dans la salle des cubistes ; la même année, Kandinsky l'invite à la \
première exposition du Blaue Reiter, à Munich, où ses toiles impressionnent les jeunes \
peintres allemands. En 1912, Apollinaire invente pour lui le mot orphisme, qui désigne \
une peinture où la couleur seule devient le sujet. Cette version rouge, peinte en 1911 \
et 1912, appartient aujourd'hui au Guggenheim de New York, qui conserve plusieurs \
Tours de Delaunay."""
facture = """
Delaunay emprunte au cubisme la fragmentation en facettes et la multiplication des \
points de vue, mais il refuse les tons bruns et gris de Picasso et de Braque : le \
rouge vif de la tour éclate contre les bleus et les blancs. La touche est libre, \
visible, posée par plans courts. La composition repose sur un contraste de couleurs \
complémentaires et sur un mouvement tournant, souligné par les courbes des nuages et \
du bord droit. L'héritage de Cézanne, que Delaunay admirait, se lit dans la \
construction des maisons en petits cubes."""
details = [
  "La première plateforme de la tour, tordue comme si elle se dérobait.",
  "Les gros nuages blancs en boules, à droite, au-dessus des toits.",
  "Les pans bleu sombre en haut, qui font penser à des rideaux.",
  "La signature du peintre, en bas à droite, près de la courbe jaune pâle.",
]
themes = ["paris", "tour eiffel", "ville moderne", "orphisme", "mouvement"]
anecdote = """
Construite pour l'Exposition universelle de 1889 et promise à la démolition au bout de \
vingt ans, la tour Eiffel fut sauvée par la radio : son antenne de télégraphie sans \
fil la rendait trop utile. Elle resta la plus haute construction du monde jusqu'en \
1930."""
salle = 2
mur = "sud"
place = 2
largeur = 1.05

[[oeuvres]]
titre = "Portrait de Pablo Picasso"
artiste = "Juan Gris"
annee = "1912"
image = "portrait-de-picasso.jpg"
technique = "Huile sur toile, 93,3 × 74,4 cm"
collection = "Art Institute of Chicago"
note = "Le jeune Gris rend hommage à son aîné et voisin du Bateau-Lavoir, palette à la main : sa première grande toile cubiste."
description = """
Un homme aux cheveux noirs et courts est assis, le buste tourné vers la gauche, le \
visage de trois quarts. Ses traits sont découpés en facettes : le nez, les yeux et la \
bouche se répètent légèrement décalés, comme vus sous plusieurs angles. Il porte une \
chemise claire et une veste bleue, dont les gros boutons ronds ressortent comme de \
petits reliefs. Dans sa main droite, en bas à droite, il tient une palette chargée de \
taches de bleu, de jaune, de rouge et de noir : c'est un peintre au travail. Derrière \
lui, le fond n'est fait que de triangles et de losanges gris, beiges et bleus, \
découpés par de grandes obliques régulières. En bas à droite, une inscription dédie la \
toile à Pablo Picasso."""
evocation = """
Ce portrait est à la fois un hommage et une déclaration. Hommage à Picasso, inventeur \
du cubisme avec Braque, que Gris voit travailler chaque jour au Bateau-Lavoir ; \
déclaration d'indépendance aussi, car Gris y affirme une manière à lui, plus claire, \
plus ordonnée, presque mathématique. Les historiens soulignent combien ce cubisme \
rigoureux tranche avec celui, plus intuitif, de ses aînés : là où Picasso et Braque \
dissolvent les formes dans une brume de facettes, Gris construit une grille lumineuse. \
En montrant son modèle palette en main, il célèbre le peintre comme inventeur de \
formes nouvelles, au moment même où lui-même entre dans l'histoire de l'avant-garde."""
histoire = """
Né à Madrid, Gris arrive à Paris en 1906 et s'installe au Bateau-Lavoir, la cité \
d'ateliers de Montmartre où vit Picasso. Il gagne d'abord sa vie en dessinant pour des \
journaux satiriques et ne se consacre vraiment à la peinture qu'à partir de 1910. Au \
printemps 1912, il présente ce portrait au Salon des indépendants : c'est sa première \
apparition publique, et la critique remarque aussitôt ce nouveau venu du cubisme. \
Bientôt, le marchand Daniel-Henry Kahnweiler, celui de Picasso et de Braque, le prend \
sous contrat. Le tableau est aujourd'hui à l'Art Institute de Chicago, grâce au don du \
collectionneur Leigh B. Block."""
facture = """
Toute la toile repose sur un réseau de grandes lignes obliques, parallèles et \
régulièrement espacées, qui la découpe en bandes et en losanges. Dans chaque case, \
Gris traite séparément la lumière et l'ombre, ce qui fait vibrer les volumes comme un \
cristal. La palette est restreinte aux bleus, aux gris et aux bruns, avec quelques \
notes chaudes sur le visage et la palette. La peinture est posée en petites touches \
serrées, presque pointillistes, qui donnent à la surface une texture régulière."""
details = [
  "La palette tenue en bas à droite, avec ses taches de couleur pure.",
  "Les boutons de la chemise, dessinés comme de petits cercles en relief.",
  "Le visage dédoublé, dont les yeux semblent vus sous deux angles.",
  "L'inscription en bas à droite, qui dédie le tableau à Pablo Picasso.",
]
themes = ["portrait", "cubisme", "peintre", "amitié", "géométrie"]
anecdote = """
Juan Gris est un nom d'emprunt : le peintre s'appelait José Victoriano González-Pérez. \
Il meurt à quarante ans, en 1927, d'une maladie des reins, après avoir dessiné décors \
et costumes pour les Ballets russes de Diaghilev."""
salle = 3
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "La Ville qui monte"
artiste = "Umberto Boccioni"
annee = "1910"
image = "ville-qui-monte.jpg"
technique = "Huile sur toile, 199,3 × 301 cm"
collection = "Museum of Modern Art, New York"
note = "L'un des premiers grands tableaux futuristes : chevaux, ouvriers et chantiers emportés par la même énergie, dans la banlieue de Milan."
description = """
Au centre de la toile, un gigantesque cheval rouge, au collier bleu, fonce tête \
baissée vers la gauche, si grand qu'il occupe presque toute la largeur. Des hommes \
minuscules s'agrippent à ses rênes et se penchent en arrière de tout leur poids, bras \
tendus, pour le retenir. À gauche, un autre cheval, blanc, se cabre dans une explosion \
de crins. Au fond, sous un ciel pâle, s'élèvent des immeubles en construction couverts \
d'échafaudages, des cheminées d'usine qui fument et des silhouettes de tramways. \
Hommes, bêtes et décor se dissolvent dans des traînées de lumière : tout semble \
emporté par un même tourbillon, de bas en haut et de droite à gauche."""
evocation = """
Boccioni explique vouloir y faire une grande synthèse du travail, de la lumière et du \
mouvement. Le sujet est la ville moderne en train de naître : la périphérie de Milan, \
ses chantiers et ses usines. Le cheval, force ancienne, et l'ouvrier, héros nouveau, \
s'unissent pour bâtir l'avenir. Le tableau illustre le culte futuriste de l'énergie, \
de la vitesse et de la machine, proclamé par le poète Marinetti en 1909. On y a vu un \
hymne optimiste au progrès ; on y lit aussi, avec le recul, la fascination pour la \
force et la violence qui conduira nombre de futuristes à exalter la guerre."""
histoire = """
Boccioni peint cette toile à Milan en 1910 et au début de 1911, quelques mois après \
avoir signé avec Carrà, Russolo, Balla et Severini le manifeste des peintres \
futuristes. Le tableau, d'abord présenté sous le titre Le Travail, est exposé à Milan \
en 1911, puis en 1912 dans l'exposition itinérante des futuristes, qui fait scandale à \
Paris, à Londres et à Berlin. Au cours de cette tournée, le compositeur Ferruccio \
Busoni l'achète ; Boccioni fera son portrait en 1916, quelques semaines avant de \
mourir. Le Museum of Modern Art de New York l'acquiert en 1951."""
facture = """
Boccioni utilise la touche divisée qu'il a apprise à Rome auprès de Giacomo Balla : de \
longs filaments de couleur pure, posés côte à côte, qui suivent les lignes de force du \
mouvement au lieu de décrire les objets. Le rouge du cheval s'oppose au bleu de son \
collier et aux blancs lumineux. La grande diagonale qui part du bas entraîne tout le \
tableau. Le format, de trois mètres de large, est celui des grandes peintures \
d'histoire : la figuration subsiste encore, mais elle se défait sous la vitesse."""
details = [
  "Les ouvriers penchés en arrière, bras tendus, accrochés aux rênes.",
  "Le collier bleu du cheval rouge, au centre de la toile.",
  "Les échafaudages et les cheminées qui fument, tout en haut à droite.",
  "La signature U. Boccioni, en bas à droite.",
]
themes = ["futurisme", "ville", "travail", "chevaux", "énergie", "milan"]
anecdote = """
La sculpture la plus célèbre de Boccioni, Formes uniques de la continuité dans \
l'espace, modelée en 1913, figure aujourd'hui sur la face nationale italienne de la \
pièce de 20 centimes d'euro."""
salle = 3
