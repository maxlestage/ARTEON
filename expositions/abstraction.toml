#  EXPOSITION « ABSTRACTION » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  tableaux dans public/tableaux/<nom>/ (ici public/tableaux/abstraction/). Le nom
#  du fichier donne l'adresse de l'exposition sur le site : /abstraction.
#
#  Toutes les œuvres sont dans le domaine public : artistes morts en 1955 ou avant,
#  œuvres créées avant 1931, photographies de Wikimedia Commons (PD-Art).
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 190
nom_court = "Abstraction"
mouvement = "Avant-gardes et abstraction"
cadre = "noir"
couleur = "#b8261b"
titre = "Les avant-gardes, la naissance de l'abstraction"
artiste = "Kandinsky, Mondrian, Malevitch, Klee, af Klint…"
dates = "1907–1930"
accroche = "Exposition virtuelle · Solomon R. Guggenheim Museum, New York"
introduction = """
Entre 1907 et 1930, en Suède, à Paris, à Milan, à Moscou, à Weimar et à Hanovre, des \
peintres renoncent à imiter le monde visible : la couleur, la ligne et la forme \
deviennent leur propre sujet. Cubisme, futurisme, orphisme, suprématisme, De Stijl, \
Bauhaus et dada sont réunis ici en dix œuvres, des toiles secrètes de Hilma af Klint \
au carré noir de Malevitch et aux lignes noires de Mondrian. Le bâtiment s'inspire du \
musée Guggenheim de New York, conçu par Frank Lloyd Wright pour une collection née de \
la passion de Solomon R. Guggenheim pour Kandinsky : un hall bas, une rotonde blanche \
très haute et des baies d'exposition tout autour."""
vitrine = "composition-viii.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Solomon R. Guggenheim Museum"
ville = "New York, États-Unis"
architecte = "Frank Lloyd Wright"
construction = "1956–1959"
presentation = """
Le collectionneur Solomon R. Guggenheim, conseillé par la peintre Hilla Rebay, réunit \
dans les années 1930 un ensemble d'art non figuratif centré sur Kandinsky, montré dès \
1939 dans un premier Museum of Non-Objective Painting. En 1943, il commande à Frank \
Lloyd Wright un bâtiment pour l'abriter ; le projet dure seize ans, et l'architecte \
meurt six mois avant l'inauguration, en octobre 1959, sur la Cinquième Avenue, face à \
Central Park. Le musée tourne le dos à la grille de Manhattan : une spirale de béton \
blanc, plus large en haut qu'en bas, enveloppe une rotonde éclairée par une verrière. Le \
visiteur descend une rampe continue en contemplant les œuvres accrochées au mur incurvé. \
Inscrit au patrimoine mondial de l'Unesco en 2019 avec d'autres édifices de Wright, le \
Guggenheim conserve l'un des plus beaux ensembles de Kandinsky au monde."""
ici = """
ARTEON reprend la séquence voulue par Wright, mais sans la rampe. Le hall d'entrée, haut \
de 4 mètres seulement et resserré, mène au nord dans La rotonde · Vers l'abstraction, un \
carré de 18 mètres de côté sous une verrière à 18 mètres de haut. De là, on gagne trois \
baies plus intimes, hautes de 5 mètres : la Baie ouest · Cubisme et futurisme, la \
Baie est · Suprématisme et De Stijl, puis, au fond, la Baie nord · Dada et Bauhaus. Tous \
les murs sont d'un blanc chaud, comme au musée."""

