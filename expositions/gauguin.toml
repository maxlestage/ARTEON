# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « GAUGUIN » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/gauguin/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /gauguin.
#
#  Pour ajouter une œuvre :
#    1. déposer son image (JPEG ou PNG) dans public/tableaux/gauguin/ ;
#    2. copier un bloc [[oeuvres]] ci-dessous et changer ses valeurs.
#  Au prochain push sur master, le site est reconstruit et republié tout seul.
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 150
nom_court = "Gauguin"
mouvement = "Synthétisme et primitivisme"
cadre = "bois"
couleur = "#c0472a"
titre = "Gauguin, l'ailleurs en couleurs"
artiste = "Paul Gauguin"
dates = "1848–1903"
accroche = "Exposition virtuelle · Paul Gauguin"
introduction = """
De Pont-Aven à Tahiti, Gauguin quitte tout pour trouver une peinture plus libre : \
des aplats de couleurs pures cernés de noir, des rouges et des jaunes impossibles, \
des visions et des mythes. Neuf toiles, de la Vision après le sermon jusqu'à son \
grand testament, D'où venons-nous ?"""
vitrine = "nafea.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Ny Carlsberg Glyptotek"
ville = "Copenhague, Danemark"
architecte = "Vilhelm Dahlerup"
construction = "ouvert en 1897"
presentation = """
Le brasseur Carl Jacobsen, héritier de la bière Carlsberg, collectionne la sculpture \
antique et française ; il en fait don au public, et Copenhague lui bâtit un musée face \
aux jardins de Tivoli. L'édifice de Vilhelm Dahlerup ouvre en 1897 ; Hack Kampmann \
l'agrandit en 1906 et, en 1996, Henning Larsen y ajoute une aile pour la peinture \
française. Au cœur du musée, le jardin d'hiver réunit palmiers et statues sous une \
coupole de verre. La Glyptothèque, qui doit son nom à la sculpture, conserve aussi un \
riche ensemble de peinture française et l'un des plus importants fonds de Gauguin hors \
de France. Le peintre avait vécu à Copenhague en 1884–1885, dans la famille de sa femme \
danoise, Mette Gad, et bien des toiles de ses débuts et de Tahiti sont restées au \
Danemark, où Mette les vendait pour élever leurs enfants."""
ici = """
Le bâtiment d'ARTEON n'en est qu'une évocation simple : trois salles en enfilade, \
reliées par des couloirs, sans plan dessiné, qui suivent le voyage du peintre. La \
Salle I · Pont-Aven, aux murs beige clair, montre la Bretagne du synthétisme. Un couloir \
mène à la Salle II · Le premier séjour à Tahiti, la plus riche, aux murs sable doré, \
puis à la Salle III · Le testament, aux murs vert pâle, où la grande frise de D'où \
venons-nous ? clôt la visite."""

# ─── Les salles, dans l'ordre de la visite ───────────────────────────────────

[[salles]]
nom = "Salle I · Pont-Aven"
theme = "1888–1889 : en Bretagne, Gauguin invente le synthétisme, des couleurs pures cernées comme des vitraux."
murs = "#ece6da"

[[salles]]
nom = "Salle II · Le premier séjour à Tahiti"
theme = "1891–1892 : les femmes, les fruits et les dieux de Polynésie, dans des couleurs éclatantes."
murs = "#f1e3cf"

[[salles]]
nom = "Salle III · Le testament"
theme = "1897–1898 : la grande frise de la vie, et le cheval blanc qui boit dans la rivière."
murs = "#e2e6e0"

# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "La Vision après le sermon"
annee = "1888"
image = "vision-sermon.jpg"
technique = "Huile sur toile, 72,2 × 91 cm"
collection = "National Galleries of Scotland, Édimbourg"
note = "Des Bretonnes en coiffe voient Jacob lutter avec l'ange, sur un champ entièrement rouge."
description = """
Au premier plan, une rangée de Bretonnes en coiffes blanches empesées, vues de dos ou \
de profil, baissent les yeux ou joignent les mains. Leur prière vient de s'achever : \
le curé leur a lu l'épisode de la Genèse où Jacob lutte toute une nuit avec un ange. \
Ce combat apparaît en haut à droite, en petit, sur un champ d'un rouge vermillon uni, \
sans horizon ni ombre : l'ange aux ailes jaune d'or et Jacob s'empoignent comme deux \
lutteurs. Un tronc de pommier coupe la toile en diagonale et sépare le monde réel des \
femmes du monde de la vision. À gauche du tronc, une vache minuscule traverse le pré \
rouge. Tout à droite, coupé par le bord, apparaît le visage d'un prêtre aux yeux clos."""
evocation = """
Gauguin ne peint plus ce qu'il voit mais ce que d'autres imaginent : il écrit à Van \
Gogh que, pour lui, le paysage et la lutte n'existent que dans l'esprit des paysannes \
en prière. Le rouge irréel signale qu'on a quitté le monde visible. On y a vu le \
manifeste d'une peinture qui préfère l'idée, le rêve et le symbole à l'observation, ce \
que la critique appellera bientôt le symbolisme. La Bretagne y devient une terre de \
foi simple et archaïque, que Gauguin, venu de Paris, idéalise en partie. Certains \
historiens reconnaissent ses propres traits dans le prêtre du bord droit, comme s'il \
se plaçait lui-même en officiant de cette vision. La lutte de Jacob avec l'ange a \
aussi été lue comme l'image du combat de l'artiste avec son art."""
histoire = """
Gauguin peint la toile à Pont-Aven en septembre 1888, peu après l'arrivée du jeune \
Émile Bernard, dont les Bretonnes dans la prairie, faites d'aplats cernés, l'ont \
vivement frappé. Les pardons, ces fêtes religieuses bretonnes où les paroissiennes se \
rassemblent en costume, lui fournissent son sujet. Conscient de tenir un tournant, il \
en décrit la composition dans une lettre à Van Gogh, accompagnée d'un croquis. \
Quelques semaines plus tard, en octobre, il part rejoindre Vincent à Arles. La toile, \
que l'artiste garde d'abord avec lui, passe ensuite par plusieurs collections privées \
avant d'être achetée en 1925 par les National Galleries of Scotland, à Édimbourg. Elle \
y est devenue l'une des œuvres les plus célèbres du musée et l'une des images \
fondatrices de l'art moderne."""
facture = """
C'est le premier grand exemple du cloisonnisme, ou synthétisme : des surfaces de \
couleur pure, posées en aplats et cernées de contours sombres, comme le plomb d'un \
vitrail ou les cloisons d'un émail. La perspective disparaît : le champ rouge se \
dresse comme un mur, et l'échelle change brutalement entre les coiffes géantes du \
premier plan et les lutteurs miniatures. Le tronc en diagonale et les figures coupées \
par le cadre viennent des estampes japonaises, tout comme la pose des lutteurs, qu'on \
rapproche des carnets de croquis d'Hokusai. Les coiffes, simplifiées en formes presque \
abstraites, rythment la composition comme des ailes blanches."""
details = [
  "Le tronc de pommier qui traverse la toile en diagonale, entre réel et vision.",
  "La petite vache, à gauche du tronc, comme égarée dans le champ rouge.",
  "Les ailes jaunes de l'ange, seule note dorée sur le rouge.",
  "Le profil du prêtre aux yeux clos, coupé par le bord droit.",
  "Les coiffes et les grands cols blancs, dessinés comme des formes découpées.",
]
themes = ["religion", "bretagne", "vision", "synthétisme", "japonisme"]
anecdote = """
Gauguin voulut offrir le tableau à une église. Avec Émile Bernard et Charles Laval, il \
le porta jusqu'à celle de Nizon, près de Pont-Aven, mais le recteur le refusa, sans \
doute dérouté par ce sujet sacré traité de façon si étrange."""
salle = 1
mur = "gauche"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Autoportrait à l'auréole et au serpent"
annee = "1889"
image = "autoportrait-aureole.jpg"
technique = "Huile sur bois, 79,2 × 51,3 cm"
collection = "National Gallery of Art, Washington"
note = "Mi-saint, mi-diable : une auréole, un serpent et des pommes, peints sur un placard d'auberge au Pouldu."
description = """
Le buste de Gauguin se détache sur deux grands aplats, l'un rouge vif, l'autre jaune \
d'or. Son visage, de trois quarts, a les paupières lourdes et le regard en coin, à la \
fois las et narquois. Au-dessus de sa tête flotte une auréole jaune, posée de travers \
comme un chapeau. En haut à gauche pendent deux pommes rouges accrochées à une \
branche. Plus bas, sa main tient entre l'index et le majeur un petit serpent, à la \
manière d'une cigarette. Au bas du panneau se dressent des tiges vertes stylisées, \
terminées par des fleurs, qui ondulent comme des arabesques. La tête, la main et le \
serpent semblent flotter dans un espace sans profondeur, sans sol ni décor, comme des \
signes posés sur une surface colorée."""
evocation = """
Gauguin se représente en être double, à la fois saint et tentateur : l'auréole des \
élus d'un côté, le serpent et les pommes de la Genèse de l'autre. On y lit souvent une \
caricature de lui-même, mi-sérieuse mi-ironique : le maître vénéré par le petit cercle \
de jeunes peintres qui l'entoure en Bretagne, et le séducteur qui se moque de la \
morale bourgeoise. Les historiens y voient aussi l'affirmation d'un artiste qui se \
veut à part, au-dessus des règles, presque mage ou prophète, à l'heure où le \
symbolisme fait de l'artiste un voyant. Le ton reste volontairement ambigu, entre \
provocation et confession. Ce double visage annonce le personnage que Gauguin \
cultivera toute sa vie : celui du sauvage, du maudit et de l'élu à la fois."""
histoire = """
À l'automne 1889, Gauguin s'installe au Pouldu, petit hameau du Finistère plus isolé \
que Pont-Aven, à l'auberge tenue par Marie Henry. Avec le peintre hollandais Jacob \
Meyer de Haan, qui l'aide alors financièrement, et d'autres amis, il en décore la \
salle à manger. Cet autoportrait est peint sur l'une des portes d'un placard ; l'autre \
reçoit un portrait de Meyer de Haan, songeur, devant une lampe et des livres. Marie \
Henry conserve les panneaux après le départ des peintres. L'autoportrait entre plus \
tard dans la collection de Chester Dale, grand collectionneur new-yorkais, dont \
l'ensemble de peintures françaises rejoint la National Gallery of Art de Washington en \
1963, après sa mort."""
facture = """
Le panneau de bois est traité comme une enseigne ou un vitrail : deux aplats de \
couleur franche, sans modelé ni profondeur, sur lesquels les formes se découpent avec \
netteté. Les contours sinueux des tiges, de la main et du serpent créent un rythme \
décoratif proche de l'Art nouveau qui naît alors. Le visage garde au contraire un \
léger modelé qui le fait ressortir. On y reconnaît l'influence des estampes japonaises \
et de l'imagerie populaire, que Gauguin et ses amis admiraient pour leur simplicité. \
Le cadrage serré et la frontalité rappellent aussi les icônes religieuses."""
details = [
  "L'auréole jaune, posée de biais comme un chapeau.",
  "Le petit serpent tenu entre deux doigts, à la façon d'une cigarette.",
  "Les deux pommes rouges suspendues en haut à gauche.",
  "Les tiges vertes stylisées qui ondulent au bas du panneau.",
]
themes = ["autoportrait", "religion", "tentation", "ironie", "bretagne"]
anecdote = """
En 1894, de retour de Tahiti, Gauguin voulut récupérer les œuvres laissées à l'auberge \
du Pouldu. Marie Henry refusa de les lui rendre, et le peintre perdit le procès qu'il \
lui intenta."""
salle = 1
mur = "droite"
place = 3
largeur = 0.85

[[oeuvres]]
titre = "Femmes de Tahiti"
annee = "1891"
image = "femmes-tahiti.jpg"
technique = "Huile sur toile, 69 × 91,5 cm"
collection = "Musée d'Orsay, Paris"
note = "Deux femmes assises sur le sable, l'une en paréo, l'autre en robe rose : la Polynésie telle que Gauguin la découvre."
description = """
Deux jeunes femmes sont assises sur le sable, si près du bord inférieur qu'elles \
semblent occuper tout l'espace. Celle de gauche porte un paréo rouge à fleurs blanches \
; la tête penchée, le regard perdu, elle s'appuie sur une main. Celle de droite porte \
une robe rose à manches longues, de celles qu'imposaient les missionnaires ; elle \
tresse des feuilles, l'air absent. Derrière elles, le sable doré cède la place à une \
bande de mer verte, puis à une ligne d'écume blanche. Aucun ciel n'apparaît. Les deux \
figures, massives, presque sculptées, ne se parlent pas et ne se regardent pas : \
chacune semble enfermée dans sa rêverie, dans la chaleur immobile d'un après-midi."""
evocation = """
Gauguin cherchait à Tahiti un monde intact, loin de l'Europe industrielle. Ce qu'il \
peint ici est plus ambigu : l'une des femmes porte le paréo traditionnel, l'autre la \
robe venue des missions, signe que la colonisation a déjà transformé l'île. Le tableau \
juxtapose ces deux vêtements sans commentaire. L'immobilité des deux femmes, leur air \
las ou songeur ont été lus comme l'expression du mystère et de la mélancolie que \
Gauguin prêtait aux Tahitiennes, une vision en partie rêvée, nourrie de lectures comme \
Le Mariage de Loti de Pierre Loti. Aujourd'hui, on interroge aussi ce regard d'homme \
européen sur des femmes colonisées, réduites à des présences silencieuses."""
histoire = """
Gauguin débarque à Papeete en juin 1891, muni d'une mission officielle non rémunérée \
du ministère de l'Instruction publique. Déçu par la capitale coloniale, trop \
européenne à son goût, il s'installe à l'automne à Mataiea, sur la côte sud de l'île. \
Cette toile compte parmi les premières qu'il y peint. Il en reprend la composition en \
1892 dans une seconde version, Parau api (Quoi de neuf ?), aujourd'hui conservée à \
Dresde. La toile d'Orsay est donnée aux musées nationaux en 1923 par le vicomte Guy du \
Cholet. Exposée au Louvre, puis au musée du Jeu de Paume consacré à l'impressionnisme, \
elle rejoint le musée d'Orsay à son ouverture en 1986."""
facture = """
La composition repose sur des bandes horizontales superposées, sable, mer, écume, \
comme une frise. Les deux corps, larges et sculpturaux, occupent presque toute la \
surface et sont coupés par le bas du cadre, ce qui rapproche le spectateur. Gauguin \
pose les couleurs en larges zones peu modulées, mais le modelé des visages et des \
bras, en tons cuivrés, est plus doux qu'à Pont-Aven. Le rose de la robe, le rouge du \
paréo et le vert de la mer jouent des contrastes de complémentaires. La peinture, \
souvent mince et mate, laisse par endroits transparaître la trame de la toile."""
details = [
  "Le contraste des vêtements : paréo à gauche, robe de missionnaire à droite.",
  "Les mains de la femme de droite, occupées à tresser.",
  "La ligne d'écume blanche, en haut, qui ferme l'horizon.",
  "Les visages fermés, qui ne se tournent pas l'un vers l'autre.",
]
themes = ["tahiti", "femmes", "plage", "colonisation", "mélancolie"]
anecdote = """
Pour payer son voyage, Gauguin mit en vente une trentaine de ses œuvres à l'hôtel \
Drouot en février 1891. Un article enthousiaste d'Octave Mirbeau, publié dans la \
presse, servit de préface au catalogue."""
salle = 2
mur = "gauche"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Ia Orana Maria (Je te salue Marie)"
annee = "1891"
image = "ia-orana-maria.jpg"
technique = "Huile sur toile, 113,7 × 87,6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Une Annonciation tahitienne : la Vierge et l'Enfant au paréo rouge, auréolés, parmi les fruits."
description = """
Au centre, une Tahitienne vêtue d'un paréo rouge porte sur son épaule un petit garçon \
nu. Tous deux ont la tête cerclée d'une fine auréole dorée : ce sont la Vierge et \
l'Enfant. Derrière, deux femmes au torse nu, ceintes de paréos, s'avancent, les mains \
jointes devant la poitrine, dans un geste de salut. À gauche, à demi caché par un \
arbuste en fleurs, un ange aux ailes jaunes leur montre la mère et l'enfant. Au \
premier plan, sur une sorte d'autel de bois, s'amoncellent des fruits, dont des \
bananes, comme une offrande. Le fond est fait d'un chemin, de collines, d'arbres et de \
palmiers, sous un ciel à peine visible. En bas à gauche, le peintre a inscrit en \
capitales le titre tahitien."""
evocation = """
Le titre est la salutation tahitienne « Ia ora na » adressée à Marie : les premiers \
mots de l'Ave Maria, ceux de l'ange Gabriel. Gauguin transpose ainsi la scène \
chrétienne dans le décor et avec les visages de Tahiti. On y a vu un écho du \
christianisme apporté par les missionnaires, qui ont profondément transformé la \
société polynésienne. On y a vu aussi le rêve, cher à Gauguin, d'une religion \
universelle où les croyances se rejoignent : les deux femmes en prière sont empruntées \
à un temple bouddhiste de Java. L'œuvre fait enfin de la Polynésie un paradis \
originel, où le sacré se mêle sans effort au quotidien, aux fruits et à la lumière, à \
rebours d'une Europe que le peintre jugeait corrompue."""
histoire = """
C'est la première grande toile du premier séjour tahitien, peinte à Mataiea entre la \
fin de 1891 et le début de 1892. Gauguin la décrit avec fierté à son ami Daniel de \
Monfreid, en détaillant l'ange, les deux femmes, la Vierge et l'Enfant. De retour à \
Paris, il la présente en novembre 1893 à la galerie Durand-Ruel, parmi ses œuvres \
tahitiennes ; la critique est partagée et les ventes décevantes. De collectionneur en \
collectionneur, le tableau gagne ensuite New York, où il appartient à Sam A. Lewisohn, \
héritier d'une famille de collectionneurs d'art moderne. Celui-ci le lègue au \
Metropolitan Museum of Art en 1951, qui en a fait l'une des pièces maîtresses de ses \
salles postimpressionnistes."""
facture = """
Gauguin compose la toile comme un retable, en registres superposés : la nature morte \
au premier plan, les figures au milieu, le paysage en haut. Les couleurs sont saturées \
et posées en aplats : le rouge du paréo de la Vierge répond au jaune des ailes et au \
vert profond de la végétation. Les deux femmes en prière reprennent presque à \
l'identique un relief du temple de Borobudur, à Java, connu par une photographie que \
le peintre avait emportée. Les contours sont nets, le modelé des corps doux et cuivré. \
L'inscription peinte, comme sur une enseigne ou une icône, fait partie de la \
composition."""
details = [
  "L'ange aux ailes jaunes, presque caché par les fleurs à gauche.",
  "Les auréoles discrètes de la mère et de l'enfant.",
  "Les mains jointes des deux femmes, geste emprunté à un relief javanais.",
  "Les fruits empilés au premier plan, comme une offrande.",
  "L'inscription « IA ORANA MARIA » en bas à gauche.",
]
themes = ["religion", "tahiti", "maternité", "syncrétisme", "offrande"]
anecdote = """
Avant de choisir Tahiti, Gauguin avait songé au Tonkin, où il demanda un poste en \
1889, puis à Madagascar. La même année, à l'Exposition universelle de Paris, il avait \
été fasciné par le village javanais reconstitué."""
salle = 2
mur = "droite"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Arearea (Joyeusetés)"
annee = "1892"
image = "arearea.jpg"
technique = "Huile sur toile, 75 × 94 cm"
collection = "Musée d'Orsay, Paris"
note = "Un chien rouge au premier plan, une flûtiste, et au loin des femmes qui dansent devant une idole."
description = """
Au premier plan, deux femmes sont assises au pied d'un grand arbre dont le tronc \
traverse la toile en diagonale. Elles portent l'une une robe blanche, l'autre une robe \
bleue ; l'une joue d'une flûte, l'autre fixe le spectateur. Devant elles, un chien \
rouge orangé, tête basse, flaire le sol. Le terrain est fait de larges plages de \
couleurs vives. Plus haut dans la toile, au second plan, quelques femmes à demi vêtues \
dansent ou prient devant une grande statue de divinité, dressée sur un socle. Le \
feuillage de l'arbre occupe le côté droit. Aucun horizon, aucun ciel : la scène monte \
vers le haut du tableau comme un décor de théâtre, et le regard passe du chien aux \
musiciennes, puis au rite lointain."""
evocation = """
Le titre tahitien signifie « amusement » ou « joyeusetés » : Gauguin peint un âge d'or \
où l'on vit au rythme de la musique, du repos et des rites. La flûte et la danse \
évoquent un temps libéré du travail, à l'opposé de l'Europe industrielle qu'il a fuie. \
Cette vision idyllique est en partie inventée : les anciennes religions polynésiennes \
avaient alors été largement effacées par les missions, et l'idole du fond est en \
grande partie imaginaire, composée à partir de sources diverses. Le tableau dit donc \
moins la réalité de Tahiti que le rêve d'un paradis perdu, que Gauguin s'efforce de \
faire revivre par la peinture et par le mythe."""
histoire = """
Gauguin peint la toile en 1892 à Mataiea, au cœur de son premier séjour. Rentré en \
France à la fin d'août 1893, malade et sans argent, il mise tout sur une grande \
exposition chez Durand-Ruel en novembre, dont le catalogue est préfacé par le poète \
Charles Morice. Arearea y figure. Le chien rouge y déclenche les moqueries de \
visiteurs et de critiques, qui y voient le comble de l'arbitraire : une couleur sans \
rapport avec la nature. Quelques artistes et amateurs, en revanche, saluent l'audace \
de ces toiles. Après être passée par plusieurs collections, l'œuvre entre dans les \
collections nationales françaises et appartient aujourd'hui au musée d'Orsay, à Paris."""
facture = """
Gauguin organise la toile en plans étagés vers le haut, sans perspective ni horizon. \
Les couleurs ne décrivent plus la nature, elles construisent l'image : le chien est \
rouge et le sol multicolore parce que la composition l'exige. Ces aplats juxtaposés, \
cernés de contours souples, héritent du synthétisme de Pont-Aven mais gagnent en \
douceur et en éclat. Le tronc oblique, qui structure la surface, rappelle les estampes \
japonaises. La matière est mince, posée sur une toile à grosse trame qui donne à la \
couleur un aspect mat, proche de la fresque."""
details = [
  "Le chien rouge du premier plan, qui fit rire les visiteurs en 1893.",
  "La flûte tenue par l'une des deux femmes assises.",
  "Le regard direct de la seconde femme, tourné vers nous.",
  "L'idole et les danseuses, au loin, en haut de la toile.",
  "Le tronc d'arbre qui coupe la composition en diagonale.",
]
themes = ["tahiti", "musique", "paradis", "rite", "couleur"]
anecdote = """
Les titres tahitiens que Gauguin peignait sur ses toiles comportent souvent des fautes \
: il ne maîtrisait qu'imparfaitement la langue. Ils participaient pourtant à l'effet \
recherché, un mystère que le public parisien ne pouvait déchiffrer."""
salle = 2
mur = "gauche"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Nafea Faa Ipoipo ? (Quand te maries-tu ?)"
annee = "1892"
image = "nafea.jpg"
technique = "Huile sur toile, 101 × 77 cm"
collection = "Collection particulière"
note = "Deux jeunes Tahitiennes, l'une en robe missionnaire, l'autre une fleur à l'oreille, devant un paysage jaune et vert."
description = """
Deux jeunes Tahitiennes sont assises l'une derrière l'autre dans un paysage ouvert. \
Celle du premier plan, assise à même le sol, porte un paréo et un haut clair, une \
fleur blanche piquée derrière l'oreille ; son visage est calme, presque impassible. \
Juste derrière elle, la seconde, vêtue d'une robe rose montante à manches longues, \
typique des missions, lève une main dans un geste qui ressemble à un avertissement ou \
à une question. Autour d'elles s'étendent des champs d'un jaune vif, des verts et des \
bleus, un arbre, des montagnes au fond et, dans le lointain, de minuscules \
silhouettes. Les deux figures, serrées l'une contre l'autre, forment un bloc unique au \
premier plan."""
evocation = """
Le titre pose une question, « Quand te maries-tu ? », à laquelle la scène ne répond \
pas clairement. On a souvent interprété la fleur portée à l'oreille comme le signe, à \
Tahiti, d'une jeune fille en quête d'époux, et le geste de la seconde comme une mise \
en garde ou un conseil. Les deux femmes incarneraient deux mondes : la tradition \
polynésienne et l'éducation chrétienne. Le tableau parle ainsi du mariage, de la \
jeunesse et de l'avenir, mais aussi de la transformation de l'île par la colonisation. \
Leur sérieux, presque grave, contredit la gaieté qu'on attendrait d'un tel sujet et \
donne à l'œuvre une tension sourde, entre attente et inquiétude."""
histoire = """
Gauguin peint la toile à Tahiti en 1892 et la rapporte en France l'année suivante ; \
elle figure à l'exposition Durand-Ruel de novembre 1893. Au début du XXe siècle, elle \
entre dans la collection du Bâlois Rudolf Staechelin. La fondation familiale la prête \
pendant près d'un demi-siècle au Kunstmuseum de Bâle, où elle devient l'une des œuvres \
phares du musée. En 2015, la famille la vend à un acheteur privé, que la presse dit \
qatari, pour une somme qui la place parmi les tableaux les plus chers jamais vendus. \
Après une dernière présentation à Bâle, à la Fondation Beyeler, dans une grande \
exposition Gauguin la même année, elle quitte la Suisse et disparaît des cimaises \
publiques."""
facture = """
Gauguin superpose les deux figures en un seul bloc, procédé fréquent dans ses toiles \
tahitiennes, qui donne à la scène la stabilité d'un bas-relief. Les couleurs sont \
posées en larges aplats contrastés : le rose de la robe contre le jaune intense du \
champ, les verts et les bleus du fond. Les contours sont souples, le modelé des \
visages et des bras réduit à quelques nuances cuivrées. La perspective est aplatie : \
le paysage monte en bandes vers le haut de la toile, et les lointains ne se signalent \
que par la petite taille des personnages."""
details = [
  "La fleur blanche glissée derrière l'oreille de la jeune femme du premier plan.",
  "La main levée de la femme en robe rose, geste resté énigmatique.",
  "Le titre tahitien peint sur la toile, avec la signature et la date.",
  "Les silhouettes minuscules au loin, dans les champs.",
]
themes = ["tahiti", "mariage", "jeunesse", "colonisation", "attente"]
anecdote = """
Le prix de la vente de 2015 est resté entouré de mystère : la presse l'annonça d'abord \
autour de 300 millions de dollars, puis des documents judiciaires liés à un litige ont \
fait état d'un montant proche de 210 millions."""
salle = 2
mur = "droite"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Manaò tupapaú (L'esprit des morts veille)"
annee = "1892"
image = "manao-tupapau.jpg"
technique = "Huile sur toile, 73 × 92 cm"
collection = "Buffalo AKG Art Museum"
note = "Sa jeune compagne, effrayée, allongée dans le noir : derrière elle, l'esprit des morts veille."
description = """
Une jeune femme nue est allongée sur le ventre sur un lit couvert d'un paréo bleu et \
d'un drap clair. Le visage tourné vers nous, les yeux grands ouverts, elle garde les \
mains près du visage, figée par la peur. À gauche, derrière le lit, se tient de profil \
une silhouette sombre encapuchonnée, au grand œil rond : l'esprit des morts, le \
tupapau. Le fond, violet et bleu nuit, est parsemé de fleurs claires, pareilles à des \
étincelles. Toute la scène baigne dans une pénombre où se détachent le corps cuivré de \
la jeune femme et le blanc du drap. Le corps allongé occupe toute la largeur du \
tableau, parallèle au bord inférieur, tandis que le spectre reste à l'écart, immobile."""
evocation = """
Gauguin a lui-même proposé une lecture du tableau : la peur de la jeune femme devant \
les tupapau, esprits des morts que les Tahitiens croyaient errer la nuit et que l'on \
tenait à distance en gardant une lampe allumée. Les fleurs lumineuses du fond seraient \
les lueurs qui signalent leur présence. La toile unit ainsi l'esprit de la vivante qui \
imagine et l'esprit du mort qui veille. Elle reprend aussi, en la retournant, la pose \
de l'Olympia de Manet, ce qui en fait une réflexion sur le nu européen. Aujourd'hui, \
l'œuvre suscite un malaise : le modèle, Teha'amana, compagne de Gauguin, avait treize \
ans selon son propre récit, et l'on relit cette peur comme celle d'une adolescente \
face à un homme adulte."""
histoire = """
Selon Gauguin, le tableau naît d'un soir de 1892 à Mataiea : rentré tard de Papeete, \
il trouve sa case dans le noir, la lampe éteinte, et Teha'amana allongée, terrifiée. \
Il raconte cette scène et explique la construction de la toile dans un manuscrit \
destiné à sa fille, le Cahier pour Aline, puis dans Noa Noa, le récit de son séjour. \
Il la tient pour l'une de ses œuvres majeures et la présente à l'exposition \
Durand-Ruel de 1893. Il en tire aussi des estampes, lithographie et gravures sur bois. \
Après plusieurs propriétaires, la toile entre en 1965, avec la collection d'A. Conger \
Goodyear, à l'Albright-Knox Art Gallery de Buffalo, rebaptisée Buffalo AKG Art Museum \
en 2023."""
facture = """
Gauguin explique avoir bâti la toile sur une harmonie sombre de violets, de bleus \
sourds et d'orangés, pour suggérer la nuit et l'effroi : la « partie musicale » du \
tableau, selon ses mots. Les formes sont simplifiées et cernées, le fond traité comme \
une tapisserie plate où les fleurs flottent sans profondeur. La figure du spectre, \
raide et de profil, rappelle des sculptures archaïques, en contraste avec le modelé \
souple de la jeune femme. La lumière ne vient d'aucune source visible : elle semble \
émaner du drap et du corps."""
details = [
  "Le grand œil ouvert de l'esprit, à gauche.",
  "Les yeux écarquillés de la jeune femme, tournés vers nous.",
  "Les fleurs claires du fond, comme des lueurs dans la nuit.",
  "Les mains crispées près du visage.",
]
themes = ["nuit", "peur", "esprits", "nu", "croyances"]
anecdote = """
Dans son Autoportrait au chapeau, peint à Paris vers 1893-1894 et conservé au musée \
d'Orsay, Gauguin s'est représenté devant Manaò tupapaú accroché au mur de son atelier. \
La toile y apparaît inversée, car il se peignait dans un miroir."""
salle = 2
mur = "gauche"
place = 3
largeur = 1.4

[[oeuvres]]
titre = "Le Cheval blanc"
annee = "1898"
image = "cheval-blanc.jpg"
technique = "Huile sur toile, 140 × 91,5 cm"
collection = "Musée d'Orsay, Paris"
note = "Un cheval qui boit, dans une rivière où le blanc devient vert sous les feuillages : refusé par son commanditaire."
description = """
Dans une clairière au bord de l'eau, un cheval blanc, tête baissée, boit dans une \
rivière. Il occupe le bas et le centre de la toile, la robe teintée de vert et de bleu \
par les reflets du feuillage. Plus haut, deux cavaliers nus montent à cru, dont l'un \
sur un cheval roux. Autour, la végétation tropicale envahit tout : troncs, feuillages, \
fleurs, et une longue branche qui serpente en haut de la composition. L'eau elle-même \
se couvre de couleurs arbitraires, qui n'ont plus rien de réaliste. Le ciel n'apparaît \
pas : la composition, très verticale, se referme sur cette scène paisible, comme un \
jardin clos. Aucun bruit ne semble troubler ce moment suspendu, où hommes et bêtes \
partagent la fraîcheur du sous-bois."""
evocation = """
À première vue, c'est une scène de vie quotidienne, un moment de fraîcheur et de \
silence. Mais le cheval, isolé et lumineux, prend une présence presque surnaturelle : \
on l'a rapproché de croyances polynésiennes associant le cheval blanc au sacré, voire \
au monde des morts, sans savoir si Gauguin y songeait. Peint peu après la grande toile \
D'où venons-nous ?, dans une période de maladie et de désespoir, le tableau propose \
une vision apaisée d'harmonie entre l'homme, l'animal et la nature, un paradis que le \
peintre ne trouvait plus guère dans sa vie. Il affirme aussi la liberté de la couleur \
: le blanc peut devenir vert si l'œil et la composition l'exigent."""
histoire = """
En 1898, Gauguin vit à Punaauia, sur la côte ouest de Tahiti, malade et criblé de \
dettes ; pour survivre, il accepte un emploi de dessinateur aux Travaux publics de \
Papeete. Un pharmacien de la ville lui commande alors un tableau, mais l'affaire \
tourne court. Gauguin expédie la toile en France à son ami le peintre Daniel de \
Monfreid, qui reçoit ses envois, garde ses œuvres et cherche pour lui des acheteurs. \
La toile reste longtemps chez Monfreid, qui finit par la céder à l'État français en \
1927. Elle entre ainsi dans les collections nationales et, après le Louvre, rejoint le \
musée d'Orsay à son ouverture en 1986."""
facture = """
Le format vertical et le point de vue plongeant, qui supprime le ciel et l'horizon, \
viennent des estampes japonaises, que Gauguin admirait et collectionnait. La \
composition se construit en arabesques : la branche sinueuse du haut, la courbe du cou \
du cheval, les contours des cavaliers. Les couleurs sont libérées de toute description \
: le blanc du cheval se charge de vert et de bleu, l'eau se pare de tons inattendus. \
La matière, mince, laisse jouer la texture de la toile. On a rapproché les cavaliers \
de la frise du Parthénon, dont Gauguin possédait des reproductions."""
details = [
  "Les reflets verts et bleus sur la robe blanche du cheval.",
  "Le cavalier nu sur son cheval roux, en haut de la toile.",
  "La branche qui serpente en haut, comme une liane.",
  "L'absence totale de ciel et d'horizon.",
]
themes = ["cheval", "rivière", "nature", "couleur", "japonisme"]
anecdote = """
Le pharmacien de Papeete qui avait commandé la toile, Ambroise Millaud, la refusa : il \
trouvait le cheval trop vert. C'est ce refus qui conduisit Gauguin à l'envoyer en \
France."""
salle = 3
mur = "gauche"
place = 1
largeur = 1.1

[[oeuvres]]
titre = "D'où venons-nous ? Que sommes-nous ? Où allons-nous ?"
annee = "1897–1898"
image = "dou-venons-nous.jpg"
technique = "Huile sur toile, 139 × 374,6 cm"
collection = "Museum of Fine Arts, Boston"
note = "Sa plus grande toile, à lire de droite à gauche : de la naissance à la mort. Il la voulait son testament."
description = """
Sur une frise de près de quatre mètres se déploient une douzaine de figures, dans un \
paysage de bord de rivière aux tons bleu-vert. À droite, un nourrisson dort sur le \
sol, veillé par trois femmes accroupies. Au centre, un grand personnage debout, bras \
levés, cueille un fruit. Plus à gauche, un enfant mange un fruit près de deux chats et \
d'une chèvre. Derrière, une idole bleue aux bras levés domine la partie gauche. Tout à \
gauche, une vieille femme repliée sur elle-même se prend la tête dans les mains ; à \
ses pieds, un étrange oiseau blanc tient un lézard. Au fond, deux figures drapées de \
pourpre passent en conversant. Les deux coins supérieurs, jaune d'or, portent le titre \
à gauche et la signature à droite."""
evocation = """
Gauguin a voulu y résumer sa pensée sur la condition humaine. La toile se lit de \
droite à gauche, comme un cycle de vie : la naissance avec l'enfant endormi, la \
jeunesse et la maturité au centre, avec le cueilleur de fruit qui évoque l'arbre de la \
connaissance, puis la vieillesse résignée de la femme proche de la mort. L'idole \
figurerait l'au-delà, et l'oiseau blanc, selon Gauguin lui-même, l'inutilité des \
vaines paroles. Le titre, trois questions sans réponse, place l'ensemble sous le signe \
de l'inquiétude plutôt que de la foi. La toile mêle références bibliques, croyances \
polynésiennes et souvenirs : la vieille femme s'inspire d'une momie péruvienne que \
Gauguin avait vue à Paris."""
histoire = """
L'année 1897 est la plus sombre de sa vie : il apprend la mort de sa fille préférée, \
Aline, emportée à dix-neuf ans par une pneumonie ; il est malade, endetté, isolé à \
Punaauia. Il peint cette immense toile à la fin de l'année, en un mois environ selon \
lui, sur une toile de jute grossière, et la considère comme son testament. En 1898, \
elle part pour Paris, où le marchand Ambroise Vollard l'expose à la fin de l'année \
avec huit tableaux qui s'y rattachent. Achetée ensuite par un collectionneur \
bordelais, Gabriel Frizeau, elle passe par d'autres mains en France puis aux \
États-Unis, avant d'être acquise en 1936 par le Museum of Fine Arts de Boston, qui la \
conserve depuis."""
facture = """
Gauguin traite la toile comme une fresque : les coins jaunes imitent, dit-il, une \
peinture murale abîmée aux angles, et la peinture mince et mate épouse la trame \
épaisse de la toile de jute. La gamme est dominée par des bleus et des verts profonds, \
réchauffés par les tons cuivrés des corps. Il n'y a pas de perspective unique : les \
figures, d'échelles différentes, sont réparties en groupes comme sur un bas-relief, \
reliés par les courbes du paysage. Le format très allongé oblige le regard à parcourir \
l'œuvre comme on suit un récit. Plusieurs figures reprennent des personnages de toiles \
antérieures."""
details = [
  "Le nourrisson endormi, en bas à droite, début du récit.",
  "Le personnage central qui cueille un fruit, bras levés.",
  "L'idole bleue aux bras levés, sur la gauche.",
  "L'oiseau blanc tenant un lézard, aux pieds de la vieille femme.",
  "Le titre peint dans le coin jaune en haut à gauche.",
]
themes = ["vie", "mort", "destin", "spiritualité", "tahiti"]
anecdote = """
Gauguin raconte à Daniel de Monfreid qu'après avoir achevé la toile, il partit dans la \
montagne avaler de l'arsenic pour mourir. La dose, trop forte, le fit vomir : il \
survécut après une nuit de souffrances."""
salle = 3
mur = "fond"
place = 2
largeur = 2.6

# ─── Les artistes ───────────────────────────────────────────────────────────

[[artistes]]
nom = "Paul Gauguin"
vie = "Paris, 7 juin 1848 – Atuona (Hiva Oa, îles Marquises), 8 mai 1903"
biographie = """
Né à Paris en 1848, Paul Gauguin passe ses premières années à Lima, au Pérou, dans la \
famille de sa mère, fille de la militante socialiste et féministe Flora Tristan. \
Revenu en France, il s'engage dans la marine marchande, puis dans la marine nationale. \
En 1871, il entre chez un agent de change à Paris et réussit dans la finance ; en \
1873, il épouse une Danoise, Mette Gad, qui lui donnera cinq enfants. Peintre du \
dimanche, collectionneur des impressionnistes, élève et ami de Camille Pissarro, il \
participe à leurs expositions de 1879 à 1886. Après le krach de 1882, il quitte la \
Bourse pour se consacrer à la peinture, au prix de la pauvreté et de la séparation \
d'avec sa famille, restée à Copenhague. Il séjourne à Pont-Aven à partir de 1886, part \
en 1887 à Panama et à la Martinique avec Charles Laval, puis élabore en Bretagne, avec \
Émile Bernard, le synthétisme. Fin 1888, il passe deux mois à Arles auprès de Van \
Gogh, séjour qui s'achève dans le drame de l'oreille coupée. En 1891, il part pour \
Tahiti, revient en 1893 exposer chez Durand-Ruel sans grand succès, puis repart \
définitivement en 1895. Malade, endetté, en conflit avec l'administration coloniale et \
la mission catholique, il s'installe en 1901 aux Marquises, à Atuona, où il meurt en \
1903. La grande rétrospective du Salon d'automne de 1906 révèle l'ampleur de son \
œuvre."""
style = """
Gauguin rompt avec l'impressionnisme, qu'il juge trop attaché à l'observation. Il \
simplifie les formes, les cerne de contours sombres et les remplit de couleurs pures, \
posées en aplats et choisies pour leur force expressive plutôt que pour leur \
ressemblance : un chien peut être rouge, un champ vermillon. Ses toiles, nourries \
d'estampes japonaises, d'art populaire breton, d'arts de Java, d'Égypte ou de \
Polynésie, cherchent à exprimer des idées, des rêves et des croyances. Peintre, mais \
aussi sculpteur, céramiste et graveur sur bois, il ouvre la voie aux Nabis, à qui Paul \
Sérusier transmet ses leçons dès 1888, aux fauves, à Picasso et aux expressionnistes \
allemands. Son regard sur la Polynésie et sur les très jeunes compagnes qu'il y a \
prises fait aujourd'hui l'objet d'une relecture critique."""
