# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « VAN GOGH » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/van-gogh/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /van-gogh.
#
#  Pour ajouter une œuvre :
#    1. déposer son image (JPEG ou PNG) dans public/tableaux/van-gogh/ ;
#    2. copier un bloc [[oeuvres]] ci-dessous et changer ses valeurs.
#  Au prochain push sur master, le site est reconstruit et republié tout seul.
#
#  L'image sert deux fois : telle quelle dans le catalogue, et transformée en
#  mosaïque en relief (des touches de 7 mm) pour la galerie en 3D.
#
#  Si une valeur est fausse (salle qui n'existe pas, image introuvable, deux
#  œuvres au même endroit…), la compilation s'arrête avec un message en français
#  qui dit quoi corriger : le site en ligne n'est jamais cassé.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
# L'ordre de l'exposition sur l'accueil, et son nom court dans le menu.
ordre = 140
nom_court = "Van Gogh"
mouvement = "Post-impressionnisme"
# La couleur d'accent des pages de l'exposition.
couleur = "#1d3f8f"
titre = "Van Gogh, la couleur en mouvement"
artiste = "Vincent van Gogh"
dates = "1853–1890"
accroche = "Exposition virtuelle · Vincent van Gogh"
introduction = """
Des mangeurs de pommes de terre de Nuenen au dernier champ de blé d'Auvers, \
parcourez en 3D cinq années de peinture qui ont changé la couleur pour toujours. \
Chaque toile est reconstruite touche par touche, en relief, dans trois salles \
reliées par des couloirs."""
# L'œuvre (son image) qui tourne sur un chevalet en page d'accueil.
vitrine = "nuit-etoilee.jpg"

# ─── Le plan du musée ────────────────────────────────────────────────────────
# Inspiré du musée Van Gogh d'Amsterdam (le bâtiment de Rietveld) : un atrium haut
# et clair au centre, et trois salles tout autour, dans l'ordre de sa vie. x et z :
# le centre de la salle (x vers l'est, z vers le sud), en mètres ; une porte se
# déclare d'un seul côté.

[[salles]]
nom = "L'atrium"
couloir = true
murs = "#f2f0ea"
x = 0
z = 0
largeur = 10
profondeur = 10
hauteur = 9
portes = ["sud", "ouest", "nord", "est"]

