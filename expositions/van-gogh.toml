hauteur = 5

# ─── Les œuvres ──────────────────────────────────────────────────────────────
# image    : le nom du fichier dans public/tableaux/van-gogh/
# salle    : le numéro de la salle (1, 2, 3…)
# mur      : "gauche", "droite" (en avançant dans la galerie) ou "fond"
# place    : 1, 2 ou 3. Sur les murs gauche et droit, 1 est près de l'entrée de
#            la salle et 3 près de la sortie ; sur le mur du fond, de gauche à
#            droite. Le milieu du mur du fond n'est libre que dans la dernière
#            salle (ailleurs, c'est la porte).
# largeur  : en mètres, dans la galerie (la hauteur suit l'image). 0,6 à 2,6.
# Les autres champs (annee, technique, collection, note) sont les textes du cartel.

[[oeuvres]]
titre = "Les Mangeurs de pommes de terre"
annee = "1885"
image = "mangeurs-pommes-de-terre.jpg"
technique = "Huile sur toile, 82 × 114 cm"
collection = "Van Gogh Museum, Amsterdam"
note = "Une famille paysanne à la lueur d'une lampe : la première grande composition, peinte dans des terres brunes."
description = """
Cinq paysans sont réunis autour d'une table, dans une pièce basse au plafond de \
poutres. Une lampe à pétrole suspendue éclaire leurs visages osseux et leurs mains \
noueuses. À gauche, un jeune homme se tourne vers une jeune femme en coiffe blanche ; \
à droite, un homme plus âgé tend sa tasse à une vieille femme qui verse le café. Au \
premier plan, une fillette vue de dos se découpe en silhouette sombre contre la \
lumière. Tous puisent dans un plat unique de pommes de terre. Au mur, on distingue une \
horloge et une petite image pieuse ; derrière, une fenêtre et quelques ustensiles. Le \
cadrage serré enferme la famille dans un espace presque étouffant, où chacun est pris \
dans le même cercle de lumière jaune, tandis que les coins de la pièce se perdent dans \
l'ombre."""
evocation = """
Van Gogh voulait montrer, explique-t-il à son frère, que ces gens qui mangent leurs \
pommes de terre sous la lampe ont bêché la terre avec les mains mêmes qu'ils plongent \
dans le plat : un repas honnêtement gagné par le travail manuel. Loin des scènes \
rurales idéalisées, il refuse d'embellir ses modèles et leur donne des traits rudes, \
presque caricaturaux, qui les rapprochent des tubercules qu'ils récoltent. On y a lu \
une forme de communion silencieuse, presque religieuse, autour d'un repas partagé. \
L'œuvre dit aussi l'ambition du jeune peintre, fils de pasteur en rupture avec son \
milieu : devenir un peintre des paysans, dans la lignée de Jean-François Millet, qu'il \
admirait profondément. C'est une profession de foi sociale autant qu'artistique, à \
contre-courant de la peinture claire et aimable qui triomphait alors à Paris."""
histoire = """
Van Gogh peint la toile en avril 1885 à Nuenen, village du Brabant où son père était \
pasteur, quelques semaines après la mort soudaine de celui-ci. Il s'y prépare depuis \
l'hiver en multipliant les études de têtes et de mains, et la famille De Groot, des \
voisins, lui sert de modèle. Il en réalise aussi une esquisse peinte, plus petite, et \
une lithographie qu'il envoie à ses amis. Le peintre Anthon van Rappard, son ami \
depuis des années, critique si durement cette lithographie que leur amitié n'y survit \
pas. Van Gogh expédie la grande toile à Theo, à Paris, mais elle ne trouve pas \
d'acheteur. Restée dans la famille, elle appartient aujourd'hui à la Fondation Vincent \
van Gogh et compte parmi les œuvres phares du Van Gogh Museum d'Amsterdam."""
facture = """
La palette est volontairement sombre : des bruns, des verts olive et des gris, que Van \
Gogh compare à la couleur d'une pomme de terre poussiéreuse et non pelée. La lumière \
de la lampe, seule source d'éclairage, crée des contrastes forts et sculpte les \
visages par plans heurtés, dans la tradition du clair-obscur des maîtres hollandais \
comme Rembrandt. La touche est épaisse et appuyée, surtout dans les mains et les \
têtes. On sent aussi l'héritage de l'École de La Haye, et notamment de Jozef Israëls, \
peintre des intérieurs paysans, que Van Gogh admirait."""
details = [
  "La lampe à pétrole suspendue, dont la lumière tombe sur le plat.",
  "La fillette de dos, silhouette sombre bordée de lumière.",
  "Les mains aux articulations saillantes, qui tiennent fourchettes et tasses.",
  "L'horloge et la petite image pieuse accrochées au mur.",
  "La vieille femme qui verse le café, à droite.",
]
themes = ["paysans", "repas", "famille", "travail", "clair-obscur"]
anecdote = """
Deux ans plus tard, alors qu'il peint déjà avec les couleurs claires de Paris, Van \
Gogh écrit encore à sa sœur Willemien que ce tableau des paysans mangeant des pommes \
de terre reste, à ses yeux, ce qu'il a fait de mieux."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.7

[[oeuvres]]
titre = "Autoportrait"
annee = "1887"
image = "autoportrait-1887.jpg"
technique = "Huile sur carton, 41 × 32,5 cm"
collection = "Art Institute of Chicago"
note = "À Paris, Van Gogh découvre le pointillisme : le visage se construit en petites touches de couleurs pures."
description = """
Van Gogh se représente en buste, de trois quarts, le regard tourné vers le spectateur. \
Il porte une veste sombre ; sa barbe et ses cheveux roux, coupés court, encadrent un \
visage aux pommettes saillantes et au front dégagé. Rien ne situe la scène : le fond \
est un champ de petites touches colorées qui vibrent autour de la tête. Le visage \
lui-même est fait de traits juxtaposés, verts, rouges, jaunes et orangés, qui se \
fondent à distance en une carnation vivante. L'expression est grave, un peu tendue, et \
aucun accessoire ne vient distraire l'attention. Le petit format, peint sur carton, \
renforce l'impression d'une étude intime, faite rapidement devant le miroir, où le \
peintre s'observe autant qu'il expérimente une nouvelle manière de peindre."""
evocation = """
Ce visage scruté sans complaisance dit d'abord une quête d'identité : à Paris, Van \
Gogh se cherche comme homme et comme peintre, et l'autoportrait devient son \
laboratoire. Le regard intense, presque inquiet, a souvent été rapproché de son \
tempérament nerveux. Mais l'œuvre parle surtout de modernité : en adoptant la touche \
divisée des néo-impressionnistes, l'ancien peintre des paysans du Brabant montre qu'il \
veut rejoindre l'avant-garde parisienne. Il ne s'agit pas pour lui d'appliquer une \
théorie, mais de faire vibrer la couleur pour rendre une présence. On y a vu le \
passage décisif entre le réalisme sombre de ses débuts et la peinture expressive qui \
fera sa célébrité à Arles : en quelques mois, le peintre des terres brunes est devenu \
un coloriste."""
histoire = """
Van Gogh arrive à Paris en mars 1886 et s'installe chez son frère Theo, d'abord rue \
Laval, puis au 54 rue Lepic, à Montmartre. Il fréquente quelques mois l'atelier du \
peintre Fernand Cormon, où il rencontre Henri de Toulouse-Lautrec et Émile Bernard, et \
découvre chez les marchands et dans les expositions les impressionnistes et les \
néo-impressionnistes. Au printemps 1887, il peint aux côtés de Paul Signac à Asnières \
et s'essaie à la touche divisée de Georges Seurat : ce portrait date de cette période. \
En deux ans, il réalise à Paris plus d'une vingtaine d'autoportraits, souvent sur des \
supports bon marché comme ce carton. Le tableau est entré en 1954 à l'Art Institute of \
Chicago, au titre de la collection Joseph Winterbotham, un fonds destiné à l'achat \
d'art européen."""
facture = """
Van Gogh emprunte à Seurat et Signac le principe de la touche divisée, mais sans leur \
rigueur scientifique : ses points s'allongent en tirets, changent de direction et \
suivent les volumes du visage. Il juxtapose des couleurs complémentaires, l'orangé de \
la barbe contre les bleus et les verts, des rouges contre des verts dans la chair, \
pour qu'elles s'exaltent mutuellement. La lumière ne vient plus d'une source précise, \
comme à Nuenen : elle naît de la couleur elle-même, et le mélange se fait dans l'œil \
du spectateur."""
details = [
  "Les tirets verts et rouges qui modèlent la joue et le front.",
  "La barbe rousse, posée en touches orangées contre un fond plus froid.",
  "Le fond animé de petites touches serrées, sans aucun décor.",
  "Les yeux clairs, au regard fixe et un peu inquiet.",
]
themes = ["autoportrait", "paris", "pointillisme", "couleurs complémentaires", "identité"]
anecdote = """
En mars 1886, Van Gogh débarque à Paris sans prévenir et fait porter à Theo un mot \
griffonné au crayon : il l'attend au Louvre, dans le Salon carré. Les deux frères \
vivront ensemble pendant deux ans."""
salle = 2
mur = "nord"
place = 1
largeur = 0.9

[[oeuvres]]
titre = "Autoportrait au chapeau de feutre gris"
annee = "1887"
image = "autoportrait-feutre.jpg"
technique = "Huile sur toile, 44 × 37,5 cm"
collection = "Van Gogh Museum, Amsterdam"
note = "Les touches rayonnent autour de la tête comme une auréole : le style de la fin est déjà là."
description = """
Le peintre se montre en buste, presque de face, coiffé d'un chapeau de feutre gris et \
vêtu d'une veste bleue. Son visage aux joues creusées, à la barbe et aux cheveux roux, \
est légèrement tourné de côté, mais les yeux clairs fixent le spectateur avec \
intensité. Autour de lui, le fond n'est fait que de courtes touches parallèles, bleues \
et orangées, qui rayonnent depuis la tête comme une couronne. La veste elle-même est \
striée de traits de couleur, et le chapeau, loin d'être uniformément gris, se charge \
de reflets bleutés. Aucun objet, aucun décor : tout se concentre sur le visage, qui \
semble surgir du fond vibrant comme une apparition, avec une présence presque \
sculpturale."""
evocation = """
Au terme de deux années parisiennes, Van Gogh se présente ici en citadin, coiffé du \
feutre des bourgeois plutôt que du chapeau de paille qu'il arbore dans d'autres \
autoportraits. Le regard pénétrant et les joues creuses trahissent aussi la fatigue : \
il dira plus tard avoir quitté Paris malade et épuisé, aspirant au calme et au soleil \
du Midi. Le rayonnement des touches autour de la tête a été comparé à une auréole, \
comme si le peintre revendiquait une vocation presque religieuse pour l'art, lui qui \
avait voulu être pasteur. L'œuvre affirme surtout qu'il a trouvé sa voie : un langage \
personnel où la couleur et la direction de la touche expriment autant que les traits \
du visage."""
histoire = """
Le tableau est peint pendant l'hiver 1887-1888, peu avant le départ de Van Gogh pour \
Arles, en février 1888. C'est l'un des plus aboutis des autoportraits parisiens, une \
synthèse de tout ce qu'il a appris au contact des impressionnistes, de Seurat et de \
Signac. Comme l'essentiel de ses toiles, il reste chez Theo, qui meurt en janvier \
1891, six mois seulement après son frère. Sa veuve, Johanna van Gogh-Bonger, conserve \
une grande partie de l'œuvre et consacre sa vie à la faire connaître, organisant \
expositions et ventes. Leur fils, Vincent Willem, confie en 1962 la collection à la \
Fondation Vincent van Gogh, qui la met en dépôt au Van Gogh Museum, inauguré à \
Amsterdam en 1973."""
facture = """
Van Gogh pousse ici la touche divisée vers un système personnel : de courts traits \
épais, tous orientés, qui suivent la forme de la tête dans le visage et rayonnent tout \
autour dans le fond. Il organise la toile en couples de complémentaires : bleu et \
orangé dans le fond, rouge orangé de la barbe contre les verts de la carnation. La \
matière, posée en pâte, accroche la lumière. Ce rythme des touches, à la fois \
structuré et nerveux, annonce les ciels en mouvement de Saint-Rémy et s'éloigne déjà \
du néo-impressionnisme orthodoxe."""
details = [
  "Les traits bleus et orangés du fond, qui rayonnent autour de la tête.",
  "Les reflets colorés sur le feutre gris du chapeau.",
  "Les touches vertes et rouges qui modèlent les joues creusées.",
  "Les yeux clairs, presque transparents, qui fixent le spectateur.",
]
themes = ["autoportrait", "paris", "couleurs complémentaires", "modernité", "identité"]
anecdote = """
Comme il se peint devant un miroir, Van Gogh se voit inversé : ses autoportraits ne le \
montrent pas tel que les autres le voyaient. Il raconte à sa sœur avoir acheté un bon \
miroir exprès, faute d'argent pour payer des modèles."""
salle = 2
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Les Tournesols"
annee = "1888"
image = "tournesols.jpg"
technique = "Huile sur toile, 92,1 × 73 cm"
collection = "National Gallery, Londres"
note = "Peints pour décorer la chambre de Gauguin à Arles : une symphonie de jaunes sur fond jaune."
description = """
Un vase de terre cuite posé sur une table contient une quinzaine de tournesols. Rien \
d'autre : la table, d'un jaune plus soutenu, et le mur, d'un jaune pâle, se rejoignent \
sur une simple ligne horizontale. Les fleurs sont à tous les stades de leur vie : \
certaines largement épanouies, aux pétales en couronne, d'autres encore fraîches, \
d'autres fanées, réduites à leur cœur hérissé de graines, les pétales retombant comme \
des flammèches. Les tiges se croisent, les têtes se tournent dans toutes les \
directions, certaines vues de face, d'autres de profil ou par-dessous. Le bouquet, \
large et touffu, déborde le vase de tous côtés. Le peintre a signé « Vincent » \
directement sur la panse du vase, comme on signe un objet décoré."""
evocation = """
Pour Van Gogh, le tournesol est presque un emblème personnel : il écrit à Theo que \
d'autres peintres sont associés à la pivoine ou à la rose trémière, mais que lui a un \
peu le tournesol. Le jaune représente pour lui la lumière du Midi, la chaleur et une \
forme d'espérance. Peints pour accueillir Gauguin, ces bouquets disent l'amitié et le \
rêve d'un atelier partagé, l'« atelier du Midi ». La présence côte à côte de fleurs \
épanouies et fanées a aussi été lue comme une méditation sur le cycle de la vie, de \
l'éclat à la mort, dans la tradition des vanités hollandaises. On peut enfin y voir un \
pari de peintre : réussir un tableau éclatant avec une seule couleur, déclinée sur \
tous ses tons."""
histoire = """
En août 1888, à Arles, Van Gogh attend la venue de Paul Gauguin, qu'il espère \
convaincre de fonder avec lui une communauté d'artistes. Pour décorer la Maison jaune, \
il peint en quelques jours quatre toiles de tournesols, travaillant vite car les \
fleurs fanent. Celle-ci est la quatrième. Gauguin arrive le 23 octobre et admire ces \
bouquets. En janvier 1889, après la crise de décembre, Vincent en peint plusieurs \
répétitions, dont celles du Van Gogh Museum d'Amsterdam et du Philadelphia Museum of \
Art. La toile de Londres, restée dans la famille, a été achetée en 1924 par la \
National Gallery grâce au fonds créé par l'industriel Samuel Courtauld pour \
l'acquisition de peinture française moderne."""
facture = """
Van Gogh relève un défi : peindre du jaune sur du jaune. Il utilise les jaunes de \
chrome, alors récents, du citron à l'orangé, et les fait vibrer par de petits accents \
de vert, de brun et de bleu. La matière est très épaisse : les cœurs des fleurs sont \
modelés en relief, presque sculptés au pinceau, tandis que le fond est brossé plus \
uniformément. Des contours sombres cernent par endroits les formes, comme dans les \
estampes japonaises et les toiles cloisonnistes de son ami Émile Bernard. La \
composition frontale, sans profondeur, fait de ce bouquet une image presque \
décorative."""
details = [
  "La signature « Vincent », peinte sur la panse du vase.",
  "Les cœurs des fleurs fanées, en relief, hérissés de graines.",
  "La ligne horizontale qui sépare la table du mur, seul repère de l'espace.",
  "Les pétales qui se tordent comme des flammes sur les fleurs les plus mûres.",
]
themes = ["fleurs", "nature morte", "jaune", "amitié", "cycle de la vie"]
anecdote = """
À la fin de 1888, Gauguin peint Van Gogh en train de peindre des tournesols. Selon le \
récit qu'il en fit bien plus tard, Vincent se serait exclamé devant le portrait : « \
C'est bien moi, mais moi devenu fou. »"""
salle = 3
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "La Nuit étoilée sur le Rhône"
annee = "1888"
image = "nuit-etoilee-rhone.jpg"
technique = "Huile sur toile, 72,5 × 92 cm"
collection = "Musée d'Orsay, Paris"
note = "Les becs de gaz d'Arles se reflètent dans le fleuve sous la Grande Ourse."
description = """
La nuit est tombée sur le Rhône, à Arles. Dans un vaste ciel bleu vert, sept étoiles \
dessinent la Grande Ourse, chacune entourée d'un halo clair. Au loin, la ligne des \
quais et des maisons est ponctuée par les becs de gaz, dont les reflets jaunes et \
orangés s'étirent sur l'eau en longues colonnes tremblantes. Le fleuve, d'un bleu \
profond, occupe toute la largeur de la toile. Sur la berge du premier plan, des \
barques sont amarrées, et un couple se promène bras dessus bras dessous au bord de \
l'eau. Le ciel remplit la moitié supérieure du tableau, et ses étoiles répondent aux \
lumières de la ville, comme si la terre et le ciel se renvoyaient leur éclat. \
L'ensemble respire le calme d'une soirée de fin d'été."""
evocation = """
Van Gogh rêvait depuis longtemps de peindre un ciel étoilé. La nuit n'y est ni \
menaçante ni lugubre : elle est pleine de couleurs, et l'éclairage moderne au gaz \
dialogue avec la lumière lointaine des étoiles. Le couple du premier plan donne à la \
scène une tendresse paisible. Les étoiles avaient pour lui une portée presque \
spirituelle : quelques semaines plus tôt, il écrivait à Theo que leur vue le faisait \
toujours rêver, et se demandait pourquoi les points lumineux du ciel seraient moins \
accessibles que les points noirs des villes sur une carte, ajoutant que, comme on \
prend le train pour aller à Tarascon, on prend la mort pour aller dans une étoile. On \
a souvent lu ce tableau comme un moment d'apaisement, avant la tourmente des mois \
suivants."""
histoire = """
Van Gogh peint la toile à la fin de septembre 1888 sur le quai du Rhône, à quelques \
minutes de la Maison jaune où il vient de s'installer. Il travaille sur place, la \
nuit, et décrit à Theo dans une lettre les couleurs de son tableau. C'est l'une des \
rares toiles exposées de son vivant : en septembre 1889, Theo l'envoie au Salon des \
Indépendants à Paris, en même temps que Les Iris. Après la mort du peintre, l'œuvre \
reste en mains privées jusqu'en 1975, date à laquelle M. et Mme Robert Kahn-Sriber en \
font don à l'État français. Elle est aujourd'hui exposée au musée d'Orsay, qui \
conserve aussi la petite version de La Chambre, peinte à Saint-Rémy."""
facture = """
Van Gogh compose avec une gamme de bleus, bleu de Prusse, outremer, cobalt, rehaussée \
de verts et de violets, et réserve les jaunes et les orangés aux lumières. Les étoiles \
sont posées en épaisses touches rayonnantes, cernées de halos. Les reflets sur l'eau \
sont rendus par de longs traits verticaux, brisés, qui suggèrent le mouvement du \
fleuve. Il peint sans noir : l'obscurité naît des bleus profonds. La touche, \
régulière, encore assez calme, et la composition horizontale donnent à la scène une \
sérénité que n'auront plus les ciels de Saint-Rémy."""
details = [
  "Les sept étoiles de la Grande Ourse, chacune avec son halo.",
  "Les reflets des becs de gaz, étirés en colonnes jaunes sur l'eau.",
  "Le couple qui marche au bord du fleuve, au premier plan.",
  "Les barques amarrées sur la berge.",
]
themes = ["nuit", "étoiles", "fleuve", "lumière", "arles"]
anecdote = """
On raconte que Van Gogh peignait la nuit avec des bougies fixées sur son chapeau. \
Aucune source sûre ne l'atteste : dans ses lettres, il explique seulement qu'il \
travaille sur place, la nuit, à la lumière de la ville."""
salle = 3
mur = "nord"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "La Chambre à Arles"
annee = "1888"
image = "chambre-arles.jpg"
technique = "Huile sur toile, 72,4 × 91,3 cm"
collection = "Van Gogh Museum, Amsterdam"
note = "Sa chambre de la Maison jaune, en aplats francs : « un repos absolu », écrit-il à Gauguin."
description = """
La chambre est étroite et légèrement de travers : le mur du fond, percé d'une fenêtre \
aux volets verts entrouverts, semble fuir en biais. Un grand lit de bois jaune occupe \
la droite, avec deux oreillers vert pâle et une couverture rouge. Deux chaises de \
paille, jaunes elles aussi, se font face, et une petite table de toilette porte une \
cuvette, un broc et des flacons. Au mur de gauche est accroché un miroir. Sur le mur \
de droite, au-dessus du lit, sont suspendus un paysage et deux portraits, et des \
vêtements pendent à des patères. Le sol de carreaux rouges file vers le fond en \
perspective accentuée. Pas de personnage : seuls les objets, simples et peu nombreux, \
racontent la vie de l'occupant."""
evocation = """
Van Gogh voulait que la seule vue du tableau repose la tête, ou plutôt l'imagination, \
comme il l'écrit à Theo : c'est la couleur, et non le sujet, qui doit suggérer le \
repos et le sommeil. La chambre est aussi le cœur de son rêve arlésien : il vient \
d'aménager la Maison jaune, la première maison bien à lui, qu'il espère partager avec \
d'autres peintres. Les objets par paires, deux chaises, deux oreillers, deux \
portraits, ont été interprétés comme le signe d'un désir de compagnie, à la veille de \
l'arrivée de Gauguin. Pourtant, l'espace un peu bancal et la perspective vertigineuse \
laissent affleurer une inquiétude. Ce paradoxe entre aspiration à la paix et tension \
sourde fait la force de ce portrait d'un lieu."""
histoire = """
Van Gogh peint sa chambre à la mi-octobre 1888, dans la Maison jaune, place Lamartine \
à Arles. Le tableau fait partie de la décoration qu'il prépare pour accueillir \
Gauguin, et il en envoie un croquis à Theo. Au début de 1889, pendant qu'il est \
hospitalisé, une crue du Rhône rend la maison humide et la toile est endommagée. À \
Saint-Rémy, en septembre 1889, il en peint deux répétitions : l'une de même format, \
aujourd'hui à l'Art Institute of Chicago, l'autre plus petite, destinée à sa mère et à \
sa sœur, conservée au musée d'Orsay. La version originale, restée dans la famille, se \
trouve au Van Gogh Museum. La Maison jaune, elle, a été détruite par un bombardement \
en 1944."""
facture = """
Van Gogh détaille lui-même ses couleurs dans une lettre à Gauguin : murs lilas pâle, \
sol d'un rouge rompu, chaises et lit jaune de chrome, oreillers et drap citron vert \
très pâle, couverture rouge sang, table de toilette orangée, cuvette bleue, fenêtre \
verte. Il supprime les ombres et peint à teintes plates, cernées de contours, à la \
manière des estampes japonaises, tout en gardant une touche visible et épaisse. Les \
analyses ont montré que les murs, aujourd'hui bleus, étaient à l'origine violets : le \
pigment rouge, peu stable, a pâli."""
details = [
  "Les volets verts de la fenêtre, entrouverts sur l'extérieur.",
  "Les deux oreillers côte à côte sur le grand lit jaune.",
  "Le petit miroir au cadre noir, accroché au mur de gauche.",
  "Au-dessus du lit, les portraits de ses amis Eugène Boch et Paul-Eugène Milliet.",
  "Les carreaux rouges du sol, peints en traits rapides qui accélèrent la perspective.",
]
themes = ["intérieur", "repos", "maison", "japonisme", "solitude"]
anecdote = """
En 2016, pour une exposition réunissant les trois versions du tableau, l'Art Institute \
of Chicago a fait reconstituer la chambre grandeur nature et l'a proposée à la \
location sur Airbnb, pour quelques dollars la nuit."""
salle = 3
mur = "nord"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Terrasse du café le soir"
annee = "1888"
image = "terrasse-cafe.jpg"
technique = "Huile sur toile, 80,7 × 65,3 cm"
collection = "Musée Kröller-Müller, Otterlo"
note = "Une nuit sans noir : le jaune de la terrasse contre le bleu profond du ciel étoilé."
description = """
Une terrasse de café, éclairée par une grande lanterne accrochée sous l'auvent jaune, \
occupe la gauche de la toile. Des clients sont attablés autour de petites tables \
rondes, tandis qu'un serveur en tablier blanc circule entre elles. La lumière dorée se \
répand sur le mur, l'auvent et les pavés de la place, qui prennent des tons orangés, \
roses et violets. À droite, une rue s'enfonce entre des façades sombres aux fenêtres \
éclairées ; des passants marchent vers le fond, où l'on devine un attelage. Au-dessus \
des toits, une bande de ciel bleu profond est semée d'étoiles, peintes comme de \
grosses fleurs claires. Le regard glisse ainsi de la terrasse animée jusqu'au ciel, en \
suivant la rue qui s'enfonce dans la nuit."""
evocation = """
Van Gogh écrit à Theo qu'il lui semble souvent que la nuit est encore plus richement \
colorée que le jour : ce tableau en fait la démonstration. Il oppose deux mondes, la \
chaleur artificielle et conviviale de la terrasse éclairée, et l'immensité calme du \
ciel étoilé. On y a vu une image de la vie moderne, avec ses cafés et son éclairage \
nouveau, telle que la décrivait la littérature de son temps : Van Gogh évoque lui-même \
le début de Bel-Ami, de Maupassant, où apparaît un café parisien la nuit. Les étoiles, \
qui apparaissent ici pour la première fois dans son œuvre, annoncent un motif qui \
deviendra essentiel pour lui, chargé d'une forme de spiritualité et d'espérance."""
histoire = """
Van Gogh peint la toile à la mi-septembre 1888 sur la place du Forum, au cœur d'Arles, \
en installant son chevalet dehors, la nuit. Il la décrit dans une lettre à sa sœur \
Willemien, en insistant sur le plaisir de peindre sur place, de nuit. C'est la \
première toile où il représente un ciel étoilé, quelques jours avant La Nuit étoilée \
sur le Rhône. L'œuvre est plus tard acquise par Helene Kröller-Müller, riche \
collectionneuse néerlandaise qui réunit, au début du XXe siècle, près de \
quatre-vingt-dix tableaux de Van Gogh et fut l'une des premières à mesurer son \
importance. En 1938, elle ouvre son musée au cœur du parc national de la Haute-Veluwe, \
à Otterlo, où la toile est toujours exposée."""
facture = """
Le tableau repose sur le contraste des complémentaires : le jaune et l'orangé de la \
terrasse contre le bleu et le violet du ciel. Van Gogh construit l'obscurité avec des \
bleus profonds, des verts sombres et des violets. Il cerne les formes de contours \
foncés, à la manière des estampes japonaises. La perspective plonge vers le fond de la \
rue et guide le regard de la terrasse vers le ciel. Les pavés sont rendus par de \
petites touches arrondies et colorées, comme une mosaïque, et les étoiles sont posées \
en pâte épaisse sur le bleu."""
details = [
  "Le serveur en tablier blanc, au milieu des tables.",
  "La grande lanterne accrochée au mur, source de toute la lumière jaune.",
  "Les pavés de la place, en petites touches roses, orangées et violettes.",
  "Les étoiles semblables à des fleurs, dans la bande de ciel au-dessus de la rue.",
  "L'attelage que l'on distingue au fond de la rue.",
]
themes = ["nuit", "café", "étoiles", "ville", "lumière"]
anecdote = """
Le café existe toujours sur la place du Forum, à Arles. Il a pris le nom de Café Van \
Gogh et arbore désormais une façade jaune qui rappelle le tableau, attirant chaque \
année des visiteurs du monde entier."""
salle = 3
mur = "nord"
place = 4
largeur = 1.1

[[oeuvres]]
titre = "Le Café de nuit"
annee = "1888"
image = "cafe-de-nuit.jpg"
technique = "Huile sur toile, 72,4 × 92,1 cm"
collection = "Yale University Art Gallery, New Haven"
note = "Rouge sang et vert amer : un café où « l'on peut se ruiner, devenir fou, commettre des crimes »."
description = """
On découvre la salle d'un café presque désert, peu après minuit, comme l'indique \
l'horloge accrochée au fond. Au centre, un billard vert projette sur le plancher une \
longue ombre. Quatre lampes suspendues, entourées de halos jaunes et orangés, \
éclairent crûment la pièce. Le long des murs rouges, quelques clients solitaires sont \
affalés à des tables, somnolents ou la tête dans les bras. Près du billard, debout, un \
homme en costume clair, le patron, regarde vers nous. Au fond, un comptoir chargé de \
bouteilles et une porte voilée d'un rideau, qui ouvre sur une pièce plus claire. Le \
plancher jaune semble basculer vers le spectateur, et des chaises vides attendent au \
premier plan."""
evocation = """
Van Gogh a voulu faire de ce café un lieu de désolation : il écrit à Theo qu'il a \
cherché à exprimer avec le rouge et le vert les terribles passions humaines. Les \
couleurs s'y entrechoquent au lieu de s'harmoniser, et la lumière crue des lampes, \
sans chaleur, accentue le malaise. Les buveurs isolés et les rôdeurs de nuit, qui \
viennent là faute de pouvoir payer un logis, composent une image de solitude urbaine. \
Le patron, debout et immobile, semble régner sur cet espace comme un gardien \
inquiétant. Ce n'est plus le réalisme social de Nuenen, mais une peinture où la \
couleur porte directement l'émotion, ce qui fera de cette toile une référence pour les \
expressionnistes du XXe siècle."""
histoire = """
Le Café de la Gare, place Lamartine, était tenu par Joseph et Marie Ginoux ; Van Gogh \
y loge plusieurs mois avant d'emménager à côté, dans la Maison jaune. Début septembre \
1888, il passe trois nuits à peindre la salle, dormant le jour. Il écrit à Theo que \
c'est l'une des toiles les plus laides qu'il ait faites, mais qu'il la juge \
équivalente, quoique différente, aux Mangeurs de pommes de terre. En novembre, Gauguin \
peint à son tour le même café, avec Marie Ginoux au premier plan. La toile est acquise \
par le grand collectionneur moscovite Ivan Morozov, nationalisée après la révolution, \
puis vendue par le gouvernement soviétique en 1933. L'Américain Stephen C. Clark la \
lègue en 1961 à l'université Yale."""
facture = """
Van Gogh joue sur les dissonances : rouge sang des murs, vert du plafond et du \
billard, jaune du plancher. Il oppose les complémentaires non pour les apaiser mais \
pour les faire crier. Les halos des lampes, faits de cercles concentriques de touches \
jaunes et orangées, annoncent les astres tourbillonnants de Saint-Rémy. La perspective \
plongeante, très accentuée, étire la pièce et donne le sentiment que le sol se dérobe. \
Les contours sombres et les aplats doivent beaucoup aux estampes japonaises, mais la \
matière, épaisse, reste très présente."""
details = [
  "L'horloge du fond, qui indique un peu plus de minuit.",
  "L'ombre longue et sombre que projette le billard sur le plancher jaune.",
  "Les halos concentriques autour des quatre lampes.",
  "Le patron en blanc, debout près du billard, qui regarde vers nous.",
  "Le rideau de la porte du fond, ouvrant sur une pièce plus claire.",
]
themes = ["nuit", "café", "solitude", "couleur", "malaise"]
anecdote = """
Au début du XXIe siècle, un descendant d'Ivan Morozov a réclamé le tableau devant la \
justice américaine, estimant qu'il avait été spolié par l'État soviétique. Les \
tribunaux ont donné raison à l'université Yale, qui le conserve toujours."""
salle = 3
mur = "est"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Les Iris"
annee = "1889"
image = "iris.jpg"
technique = "Huile sur toile, 74,3 × 94,3 cm"
collection = "J. Paul Getty Museum, Los Angeles"
note = "Peint dans le jardin de l'asile de Saint-Rémy, la première semaine : un seul iris blanc parmi les bleus."
description = """
Le regard plonge sur un massif d'iris en fleurs, vu de très près, sans horizon ni \
ciel. Les fleurs bleu violet, aux pétales ondulés, se dressent sur de longues feuilles \
vertes en forme de lames qui s'entrecroisent. Elles occupent presque toute la largeur \
de la toile, chacune avec sa forme propre, certaines épanouies, d'autres encore en \
boutons. Parmi elles se détache un iris blanc, unique. Au premier plan, la terre est \
d'un brun rouge ; au fond, l'herbe du jardin et une touffe de fleurs orangées \
éclairent la composition. Le cadrage coupe les plantes sur les bords, comme si le \
massif se prolongeait au-delà du tableau. L'œil circule d'une fleur à l'autre sans \
jamais trouver de centre, comme dans un jardin que l'on parcourt."""
evocation = """
Peints dans les tout premiers jours de son internement volontaire, Les Iris témoignent \
d'un élan vital retrouvé : la peinture est pour Van Gogh un moyen de tenir la maladie \
à distance. Le jardin clos de l'asile devient un monde en soi, foisonnant et lumineux. \
Chaque fleur semble avoir sa personnalité, se tordre, se pencher ou se dresser comme \
un être vivant. L'iris blanc isolé a souvent été interprété comme une figure de la \
solitude, voire comme un autoportrait symbolique du peintre parmi les autres, mais ce \
n'est là qu'une lecture parmi d'autres. Ce qui frappe surtout, c'est l'absence \
d'angoisse apparente : la toile célèbre le printemps, la croissance et la beauté \
simple des plantes."""
histoire = """
Le 8 mai 1889, après plusieurs crises, Van Gogh entre de son plein gré à l'asile \
Saint-Paul-de-Mausole, à Saint-Rémy-de-Provence. On l'autorise à peindre dans le \
jardin, et il s'attaque aussitôt aux iris en fleurs. Il considère la toile comme une \
étude, mais Theo l'envoie au Salon des Indépendants de septembre 1889. En 1892, le \
critique Octave Mirbeau, l'un des premiers défenseurs du peintre, l'achète pour 300 \
francs. En novembre 1987, elle est vendue aux enchères à New York pour 53,9 millions \
de dollars à l'homme d'affaires australien Alan Bond, un record mondial à l'époque. \
Incapable de la payer entièrement, celui-ci doit s'en séparer, et le J. Paul Getty \
Museum de Los Angeles l'acquiert en 1990."""
facture = """
Les Iris doivent beaucoup aux estampes japonaises : contours appuyés, aplats de \
couleur, cadrage rapproché et coupé, absence de perspective profonde. Van Gogh y \
associe sa touche propre, épaisse et nerveuse, qui épouse le mouvement des feuilles et \
des pétales. Il fait jouer les complémentaires, le bleu violet des fleurs contre \
l'orangé des fleurs du fond et le brun rouge de la terre. Les recherches ont montré \
que les iris étaient à l'origine plus violets : le pigment rouge mêlé au bleu a pâli \
avec le temps."""
details = [
  "L'unique iris blanc, isolé au milieu des fleurs bleues.",
  "Les feuilles en forme de lames, qui se croisent comme des épées.",
  "La terre brun rouge du premier plan.",
  "Les fleurs orangées de l'arrière-plan, contrepoint au bleu des iris.",
  "Les contours sombres qui cernent chaque pétale, à la japonaise.",
]
themes = ["fleurs", "jardin", "japonisme", "printemps", "asile"]
anecdote = """
En 1987, l'acheteur des Iris n'avait pu enchérir que grâce à un prêt consenti pour \
moitié par Sotheby's, la maison de ventes elle-même. Révélée ensuite, cette pratique \
fit scandale et jeta le doute sur l'envolée des prix de l'époque."""
salle = 4
mur = "nord"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "La Nuit étoilée"
annee = "1889"
image = "nuit-etoilee.jpg"
technique = "Huile sur toile, 73,7 × 92,1 cm"
collection = "Museum of Modern Art, New York"
note = "La vue de sa fenêtre à l'asile, avant l'aube : un ciel qui tourbillonne au-dessus du village endormi."
description = """
Sous un ciel immense, un petit village dort au pied de collines bleues. Le ciel occupe \
la plus grande partie de la toile : de grandes volutes de lumière s'y enroulent comme \
des vagues, et une double spirale roule en son centre. Onze étoiles flamboient, \
entourées de halos jaunes et blancs, et en haut à droite brille un croissant de lune \
orangé, cerclé de lumière. Près du cyprès, une étoile plus grande et plus claire que \
les autres : l'étoile du matin. Au premier plan, à gauche, un cyprès sombre s'élance \
comme une flamme jusqu'en haut du tableau. Dans le village, des maisons aux fenêtres \
éclairées entourent une église au clocher effilé, et les collines ondulent en \
reprenant le mouvement du ciel."""
evocation = """
La Nuit étoilée est devenue l'image même de Van Gogh, et l'on y lit souvent les \
tourments de sa maladie. Mais le peintre y exprime aussi une fascination ancienne pour \
les étoiles, qu'il associait à l'infini et à l'au-delà. Le cyprès, arbre des \
cimetières en Provence, relie la terre au ciel : on y a vu un symbole de mort autant \
qu'un élan vers l'éternité. L'église, qui ressemble davantage à celles du Brabant, a \
été interprétée comme un souvenir du pays natal. Le contraste entre le village \
paisible et le ciel en ébullition suggère une nature traversée d'énergies que l'homme \
endormi ne perçoit pas. En 1971, la chanson Vincent, de Don McLean, qui commence par « \
Starry, starry night », a encore accru la célébrité du tableau."""
histoire = """
Van Gogh peint la toile vers la mi-juin 1889 à l'asile de Saint-Rémy. De la fenêtre \
grillagée de sa chambre, tournée vers l'est, il voit un champ de blé clos de murs et, \
au-delà, des collines. Il n'a pas le droit de peindre dans sa chambre : il travaille \
de jour dans un atelier du rez-de-chaussée, en s'appuyant sur ses études et sa \
mémoire, et ajoute le village et le cyprès. Il écrit à Theo avoir vu la campagne avant \
le lever du soleil, avec l'étoile du matin, très grande. Peu satisfait, il confie plus \
tard à Émile Bernard s'être laissé aller à faire des étoiles trop grandes. Après \
plusieurs propriétaires, dont le poète Julien Leclercq, la toile entre en 1941 au \
Museum of Modern Art de New York, par échange d'œuvres léguées par Lillie P. Bliss."""
facture = """
Tout est mouvement : Van Gogh peint par touches épaisses, courbes et rythmées, qui \
suivent les formes et entraînent l'œil dans un tourbillon continu. Le ciel est \
construit avec des bleus profonds, contre lesquels éclatent les jaunes des astres. Le \
cyprès, presque noir, est modelé en longues touches ondulantes et verticales qui \
s'opposent aux horizontales du village et aux spirales du ciel. Le village, dessiné de \
façon plus rectiligne, apporte un contrepoint calme. Le relief de la matière, très \
marqué, accroche la lumière et donne au ciel une présence presque physique."""
details = [
  "Le croissant de lune orangé, en haut à droite, enveloppé d'un halo.",
  "La grande double spirale qui roule au centre du ciel.",
  "L'étoile du matin, plus grande et plus claire, près du cyprès.",
  "Le clocher effilé de l'église, qui pointe au-dessus des toits.",
  "Les fenêtres jaunes des maisons, seules traces de vie humaine.",
]
themes = ["nuit", "ciel", "étoiles", "cyprès", "village"]
anecdote = """
Des astronomes ont vérifié qu'au printemps 1889, la planète Vénus brillait bien à \
l'aube dans le ciel de Saint-Rémy : l'étoile du matin que Van Gogh dit avoir vue de sa \
fenêtre est très probablement elle."""
salle = 4
mur = "nord"
place = 3
largeur = 1.5

[[oeuvres]]
titre = "Amandier en fleurs"
annee = "1890"
image = "amandier.jpg"
technique = "Huile sur toile, 73,3 × 92,4 cm"
collection = "Van Gogh Museum, Amsterdam"
note = "Un cadeau pour la naissance de son neveu : des branches en fleurs sur un ciel bleu, à la japonaise."
description = """
Des branches d'amandier en fleurs se découpent sur un ciel bleu turquoise, sans sol ni \
horizon. Vues d'en bas, comme si l'on était allongé sous l'arbre, elles s'étendent sur \
toute la surface de la toile et se ramifient en rameaux de plus en plus fins. Les \
fleurs, blanches teintées de rose, sont représentées à différents stades : certaines \
bien ouvertes, montrant leur cœur, d'autres encore en boutons rosés. Les branches, \
d'un brun vert, sont cernées de contours sombres et se tordent avec souplesse. Le \
cadrage coupe les rameaux sur les bords, si bien que la scène semble un fragment d'un \
arbre plus vaste. Rien ne vient troubler ce dialogue entre le bleu du ciel et la \
fragilité des fleurs."""
evocation = """
L'amandier est le premier arbre à fleurir, dès la fin de l'hiver : il symbolise le \
renouveau et la vie qui recommence. En le choisissant pour saluer la naissance de son \
neveu, Van Gogh offre au nouveau-né un emblème d'espérance et de croissance. Le \
tableau, pensé pour être accroché dans la chambre des parents, dit aussi l'affection \
profonde qui le lie à Theo et à sa femme Johanna. Peint dans une période de calme \
relatif, juste avant une nouvelle crise, il prend la valeur d'une promesse fragile. La \
sérénité de l'image, son ciel lumineux et son élégance décorative témoignent d'un \
apaisement que l'on retrouve rarement à ce degré dans son œuvre de Saint-Rémy."""
histoire = """
Le 31 janvier 1890, Johanna, l'épouse de Theo, met au monde un garçon, que ses parents \
appellent Vincent Willem, comme son oncle. Celui-ci, touché, se met aussitôt à peindre \
ce tableau à l'asile de Saint-Rémy, en février 1890 ; il annonce à sa mère qu'il le \
destine à leur chambre à coucher. Peu après, il est frappé par une grave crise qui \
l'empêche de travailler pendant près de deux mois. Theo et Jo accrochent finalement la \
toile au-dessus du piano de leur salon, à Paris. Restée dans la famille après la mort \
des deux frères, elle appartient à la Fondation Vincent van Gogh et est devenue l'une \
des œuvres les plus aimées du Van Gogh Museum."""
facture = """
L'influence des estampes japonaises est ici à son comble : contours nets, aplats de \
couleur, motif vu de près et coupé par le cadre, fond uni sans perspective. Van Gogh, \
qui collectionnait ces gravures depuis Anvers et Paris, s'en approprie le langage. Le \
bleu du ciel, posé en touches serrées, sert d'écrin au blanc des fleurs, lui-même \
nuancé de rose et de vert. Les fleurs sont peintes en pâte épaisse, ce qui leur donne \
du relief, tandis que les branches sont tracées d'un trait souple. La gamme réduite \
crée une harmonie lumineuse et calme."""
details = [
  "Les boutons rosés, à côté des fleurs déjà ouvertes.",
  "Les contours sombres qui cernent les branches, comme dans une estampe.",
  "Le relief des fleurs blanches, peintes en pâte épaisse.",
  "Les rameaux coupés par les bords du tableau, à la japonaise.",
]
themes = ["fleurs", "naissance", "printemps", "japonisme", "famille"]
anecdote = """
Le neveu pour qui fut peint cet amandier, Vincent Willem van Gogh, devenu ingénieur, a \
créé la fondation à l'origine du Van Gogh Museum. Mort en 1978, il a vu s'ouvrir en \
1973 le musée qui expose aujourd'hui son cadeau de naissance."""
salle = 4
mur = "sud"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Champ de blé aux corbeaux"
annee = "1890"
image = "champ-ble-corbeaux.jpg"
technique = "Huile sur toile, 50,5 × 103 cm"
collection = "Van Gogh Museum, Amsterdam"
note = "Auvers-sur-Oise, juillet 1890 : un ciel d'orage, trois chemins et un vol de corbeaux. Il meurt quelques semaines plus tard."
description = """
Un champ de blé mûr s'étend sur toute la largeur de cette toile très allongée, sous un \
ciel d'orage bleu sombre, presque noir dans les hauteurs, où flottent deux nuages plus \
clairs. Trois chemins le traversent : celui du centre, rouge brun bordé d'herbe verte, \
s'avance vers le fond et s'interrompt brusquement au milieu des blés ; les deux autres \
partent vers la gauche et vers la droite et sortent du cadre. Au-dessus du champ, une \
nuée de corbeaux noirs, peints d'un simple trait, s'envole ou plonge vers les épis. Le \
blé jaune d'or, agité, semble ployer sous le vent. Aucune figure humaine, aucune \
maison : rien que la terre, le ciel et les oiseaux."""
evocation = """
Parce qu'il est peint peu avant sa mort, ce tableau a longtemps été lu comme un \
testament. Le ciel menaçant, les corbeaux et le chemin qui s'interrompt ont été \
interprétés comme des présages funestes, peut-être plus qu'il ne faut. Van Gogh écrit \
alors à Theo et Johanna qu'il a peint d'immenses étendues de blé sous des ciels \
troublés, et qu'il n'a pas eu de mal à y exprimer la tristesse et la solitude extrême. \
Mais il ajoute qu'il espère y montrer aussi ce qu'il voit de sain et de fortifiant \
dans la campagne. L'œuvre tient dans cet équilibre fragile entre angoisse et vitalité, \
entre la menace du ciel et la plénitude des blés mûrs."""
histoire = """
Le 20 mai 1890, Van Gogh quitte Saint-Rémy pour Auvers-sur-Oise, au nord de Paris, où \
il est suivi par le docteur Paul Gachet, médecin et amateur d'art. Il loge à l'auberge \
Ravoux et peint à un rythme effréné : plus de soixante-dix tableaux en à peine plus de \
deux mois. Début juillet, de retour d'une visite tendue chez Theo à Paris, il peint ce \
champ sous l'orage. Le 27 juillet, il se blesse d'une balle de revolver, dans des \
circonstances jamais totalement éclaircies, et meurt deux jours plus tard à l'auberge, \
Theo à son chevet. Le tableau, resté dans la famille, appartient à la Fondation \
Vincent van Gogh."""
facture = """
Van Gogh adopte à Auvers un format en double carré, très allongé, qu'il utilise pour \
une série de paysages panoramiques. La peinture est posée vite, en touches épaisses et \
larges, souvent dans la couleur encore fraîche. Les complémentaires s'affrontent : le \
jaune des blés contre le bleu du ciel, le rouge du chemin contre le vert de l'herbe. \
Les corbeaux sont réduits à des signes, de simples V noirs tracés d'un geste. Plutôt \
que de conduire le regard vers un point de fuite, les chemins s'ouvrent vers le \
spectateur, ce qui rend l'espace instable."""
details = [
  "Le chemin central, qui s'arrête net au milieu des blés.",
  "Les corbeaux, réduits à des signes noirs en forme de V.",
  "Les deux nuages clairs, isolés dans le ciel sombre.",
  "Les bandes d'herbe verte qui bordent le chemin rouge.",
]
themes = ["paysage", "blé", "orage", "corbeaux", "solitude"]
anecdote = """
Contrairement à une légende tenace, ce n'est sans doute pas sa dernière toile. Les \
chercheurs du Van Gogh Museum attribuent plutôt ce rôle aux Racines d'arbres, un \
tableau resté inachevé, auquel il travaillait dans les tout derniers jours de sa vie."""
salle = 4
mur = "est"
place = 2
largeur = 2.4

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Vincent van Gogh"
vie = "Groot-Zundert (Pays-Bas), 30 mars 1853 – Auvers-sur-Oise, 29 juillet 1890"
biographie = """
Fils d'un pasteur protestant, Vincent van Gogh grandit dans le Brabant néerlandais. À \
seize ans, il entre chez Goupil & Cie, marchands d'art, et travaille à La Haye, \
Londres et Paris, avant d'être renvoyé en 1876. Il se tourne alors vers la religion, \
échoue à devenir pasteur et prêche auprès des mineurs du Borinage, en Belgique. C'est \
là, en 1880, à vingt-sept ans, qu'il décide de devenir artiste. Son frère cadet Theo, \
marchand d'art à Paris, le soutient financièrement jusqu'au bout et reçoit de lui des \
centaines de lettres, témoignage irremplaçable sur sa pensée. Après des années \
d'apprentissage à Bruxelles, La Haye et Nuenen, où il peint les paysans, il passe par \
Anvers puis rejoint Theo à Paris en 1886 : il y découvre l'impressionnisme, le \
néo-impressionnisme et les estampes japonaises, et sa palette s'éclaircit. En février \
1888, il part pour Arles, où il rêve de fonder un atelier du Midi. Gauguin l'y \
rejoint, mais la cohabitation tourne court : en décembre 1888, lors d'une crise, Van \
Gogh se mutile l'oreille gauche. Sujet à des crises dont la nature fait encore débat, \
il entre en 1889 à l'asile de Saint-Rémy-de-Provence, où il peint sans relâche, puis \
s'installe en mai 1890 à Auvers-sur-Oise. Le 27 juillet, blessé par balle, il meurt \
deux jours plus tard. Il n'a vendu que très peu de toiles de son vivant, même si le \
critique Albert Aurier commençait à le remarquer. Grâce à Johanna van Gogh-Bonger, \
veuve de Theo, qui publie ses lettres et fait exposer ses œuvres, sa renommée devient \
mondiale au début du XXe siècle."""
style = """
La peinture de Van Gogh se reconnaît au premier coup d'œil : une touche épaisse et \
visible, en traits courts, en hachures ou en tourbillons, qui donne à chaque surface, \
ciel, champ ou visage, un mouvement propre. Il emploie la couleur de façon libre et \
expressive, en jouant sur les contrastes de complémentaires, non pour copier la nature \
mais pour traduire des émotions. Des estampes japonaises, il retient les contours \
appuyés, les aplats et les cadrages audacieux. Son œuvre, quelque 850 tableaux et près \
de 1 300 dessins réalisés en dix ans, a ouvert la voie au fauvisme de Matisse, Derain \
et Vlaminck, et à l'expressionnisme allemand, qui lui doivent cette liberté de la \
couleur et du geste."""
