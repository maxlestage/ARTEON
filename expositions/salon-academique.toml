[exposition]
ordre = 112
nom_court = "Art académique"
mouvement = "Le Salon et l'art académique"
cadre = "baroque"
couleur = "#7a5418"
titre = "Le Salon, triomphe de l'art académique"
artiste = "Bouguereau, Cabanel, Gérôme, Alma-Tadema, Leighton…"
dates = "1833–1895"
accroche = "Exposition virtuelle · Petit Palais, Paris"
introduction = """
Au XIXᵉ siècle, le Salon de Paris, grande exposition officielle dont le jury est \
dominé par l'Académie des beaux-arts, fait et défait les carrières ; la Royal Academy \
joue le même rôle à Londres. Il impose un idéal : dessin impeccable, surface lisse, \
grands sujets tirés de la mythologie, de la Bible et de l'histoire. La visite réunit \
dix toiles de ses vedettes, françaises, anglaises et américaine, de Delaroche à \
Leighton, sans taire ce que cette peinture dit de son temps, de son regard sur le \
corps des femmes et sur l'« Orient ». Le bâtiment s'inspire du Petit Palais, construit \
à Paris pour l'Exposition universelle de 1900 : un porche à coupole, deux longues \
galeries le long de la façade et, à leurs extrémités, deux pavillons."""
vitrine = "naissance-de-venus-bouguereau.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Petit Palais"
ville = "Paris, France"
architecte = "Charles Girault"
construction = "1897–1900"
presentation = """
Pour l'Exposition universelle de 1900, on remplace le vieux Palais de l'Industrie, \
démoli en 1896, par deux palais qui se font face de part et d'autre d'une avenue \
nouvelle ouverte vers le pont Alexandre-III et les Invalides : le Grand et le Petit \
Palais. Lauréat du concours, Charles Girault élève le second de l'automne 1897 au \
printemps 1900. Sa façade, longue d'environ 125 mètres, est centrée sur un porche \
monumental surmonté d'une coupole ; derrière, les galeries entourent un jardin \
semi-circulaire bordé d'un péristyle. Girault les a voulues éclairées par la seule \
lumière du jour, grâce à des verrières, des coupoles transparentes et de hautes \
fenêtres. Devenu le musée des Beaux-Arts de la Ville de Paris, le Petit Palais ouvre \
le 11 décembre 1902 et reçoit la même année l'immense collection Dutuit. Rénové de \
2001 à 2005, il présente gratuitement ses collections permanentes, de l'Antiquité au \
début du XXᵉ siècle ; les plus vastes toiles y ont leur galerie des grands formats."""
ici = """
Le bâtiment d'ARTEON reprend l'ordonnance du Petit Palais : un porche central d'où \
partent deux longues galeries, et deux pavillons qui reviennent vers le nord comme les \
ailes autour du jardin. On entre par le sud sous « Le porche à coupole », haut de \
seize mètres. À l'ouest s'étire « La galerie des grands formats », longue de \
trente-deux mètres, aux murs rouge Salon ; au nord de son extrémité s'ouvre le \
pavillon ocre « L'Antiquité et l'Orient rêvés ». À l'est, « La galerie de l'idéal », \
vert de gris, conduit au pavillon clair « Bergers et faneurs »."""

