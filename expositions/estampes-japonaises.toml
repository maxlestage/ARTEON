# longe le jardin, et trois pièces basses aux murs couleur de papier washi, reliées
# entre elles comme des pièces à cloisons coulissantes. x et z : le centre de la
# salle (x vers l'est, z vers le sud), en mètres ; une porte se déclare d'un seul
