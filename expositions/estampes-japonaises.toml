[exposition]
ordre = 75
nom_court = "Ukiyo-e"
mouvement = "Ukiyo-e, l'estampe japonaise"
cadre = "estampe"
couleur = "#2c4a7e"
titre = "Ukiyo-e, les images du monde flottant"
artiste = "Hokusai, Hiroshige, Utamaro, Sharaku…"
dates = "1759–1857"
accroche = "Exposition virtuelle · Musée national de Tokyo"
introduction = """
Ukiyo-e, « images du monde flottant » : à Edo, l'actuelle Tokyo, des estampes gravées \
sur bois et vendues pour le prix d'un bol de nouilles montrent les acteurs de kabuki, \
les beautés à la mode, puis les paysages et les légendes. La visite suit cet âge d'or, \
des premières estampes en couleurs de Harunobu aux Cent Vues d'Edo de Hiroshige, en \
passant par la Grande Vague de Hokusai, avec en contrepoint une peinture sur soie \
d'Itō Jakuchū. Le bâtiment s'inspire du Honkan du Musée national de Tokyo et des \
maisons japonaises : des salles basses aux murs couleur de papier, reliées par une \
longue coursive, l'engawa. Les estampes, qui mesurent une trentaine de centimètres, \
sont présentées agrandies."""
vitrine = "grande-vague.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Musée national de Tokyo"
ville = "Tokyo, Japon"
architecte = "Watanabe Jin (Honkan)"
construction = "Honkan ouvert en 1938"
presentation = """
Fondé en 1872, le Musée national de Tokyo est le plus ancien musée du Japon. Installé \
dans le parc d'Ueno, il occupe plusieurs bâtiments ; le premier, dessiné par \
l'architecte anglais Josiah Conder, fut ruiné par le grand tremblement de terre du Kantō \
en 1923. Le Honkan, le bâtiment principal qui le remplace, est l'œuvre de Watanabe Jin \
et ouvre en 1938 : une construction de béton armé à l'occidentale, coiffée d'un grand \
toit de tuiles à la japonaise, dans le style dit « de la couronne impériale ». Un \
escalier monumental mène à l'étage, où les salles suivent l'histoire de l'art japonais, \
de la préhistoire à l'époque d'Edo. Les estampes ukiyo-e, que la lumière abîme, y sont \
exposées par roulement, quelques semaines à la fois, dans une salle qui leur est \
consacrée ; le musée en conserve des milliers, avec des peintures, des sabres, des \
laques, des kimonos et de nombreux trésors nationaux."""
ici = """
Le bâtiment d'ARTEON emprunte au Honkan ses salles d'estampes et à la maison japonaise \
son plan à hauteur d'homme : des plafonds de trois à quatre mètres, des murs couleur de \
papier washi. On entre par le sud dans le genkan, qui ouvre sur « L'engawa · Les Cent \
Vues d'Edo », longue coursive de près de vingt mètres. Au nord, elle dessert la salle \
I · Hokusai et le Fuji, à l'ouest, et la salle III · Visions, à l'est. Entre elles, la \
salle II · Beautés et acteurs les relie : on passe par elle de la salle I à la salle \
III, avant de retrouver la coursive."""

# ─── Le plan du musée ────────────────────────────────────────────────────────
