#  EXPOSITION « ESTAMPES JAPONAISES » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/estampes-japonaises/). Le
#  nom du fichier donne l'adresse de l'exposition sur le site :
