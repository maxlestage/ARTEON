# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Le Rhinocéros"
artiste = "Albrecht Dürer"
annee = "1515"
image = "rhinoceros.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Albrecht_Dürer,_The_Rhinoceros,_1515,_NGA_47903.jpg"
technique = "Gravure sur bois, avec un texte imprimé en allemand"
collection = "National Gallery of Art, Washington"
note = "Dürer n'a jamais vu l'animal : il l'a gravé d'après un croquis et une lettre venus de Lisbonne, et son image a fait autorité pendant plus de deux siècles."
description = """
Un rhinocéros massif, vu de profil, avance vers la droite et occupe presque toute la \
feuille. Sa peau ne ressemble pas à une peau : elle est faite de plaques rigides, \
rivetées et bordées comme les pièces d'une armure, semées de cercles, d'écailles et de \
petites rosaces. Ses pattes sont gainées d'écailles, son cou est plissé comme une \
collerette et, au-dessus de la grande corne du nez, une petite corne torsadée pousse \
sur son épaule. Le sol n'est qu'un trait, avec quelques cailloux. En haut à droite, la \
date 1515, le mot RHINOCERUS et le monogramme de l'artiste ; tout en haut, sur cinq \
lignes, un texte allemand raconte l'arrivée de la bête au Portugal."""
evocation = """
Pour les Européens de 1515, le rhinocéros est une créature presque légendaire, connue \
par les auteurs antiques : aucun n'avait été vu en Europe depuis l'époque romaine. \
Dürer en fait une machine de guerre vivante, dont la cuirasse évoque les armures que \
l'on forgeait à Nuremberg. Le texte rapporte que la bête est l'ennemie mortelle de \
l'éléphant, qu'elle l'attaque tête baissée pour lui ouvrir le ventre, et qu'elle est \
rapide, hardie et rusée. On y voit l'exemple même d'une image qui mêle l'observation \
et l'imagination : une précision de détail extrême, mise au service d'un animal en \
partie inventé, que tout le monde a pourtant tenu pour vrai."""
histoire = """
L'animal, un rhinocéros indien, était un cadeau du sultan du Gujarat au gouverneur des \
Indes portugaises, Afonso de Albuquerque, qui l'envoya au roi Manuel Iᵉʳ. Débarqué à \
Lisbonne en mai 1515, il fit sensation. Le roi l'offrit ensuite au pape Léon X, mais \
le navire qui le transportait fit naufrage au large de la côte ligure au début de \
1516, et la bête se noya. Entre-temps, une lettre accompagnée d'un croquis était \
parvenue à Nuremberg. Dürer en tira un dessin à la plume, aujourd'hui au British \
Museum, puis cette gravure sur bois, tirée à de très nombreux exemplaires et rééditée \
plusieurs fois après sa mort. Cette épreuve est conservée à la National Gallery of Art \
de Washington, qui en diffuse librement la reproduction."""
facture = """
La gravure sur bois se travaille en relief : on évide au couteau tout ce qui doit \
rester blanc, et seuls les traits, laissés debout, reçoivent l'encre. Dürer dessinait \
ses compositions et en confiait sans doute la taille à un spécialiste, mais il pousse \
la technique à une finesse rare : hachures parallèles pour modeler les flancs, \
croisillons pour les ombres, semis de petits cercles pour le grain de la peau. Le \
cadrage serré, où la corne et la queue touchent presque les bords, donne à l'animal \
une présence monumentale. Sans couleur ni décor, tout le regard se concentre sur la \
matière de la cuirasse."""
details = [
  "La petite corne torsadée sur l'épaule, que les vrais rhinocéros n'ont pas.",
  "Le texte allemand en haut, qui date par erreur l'arrivée de la bête de 1513.",
  "Le monogramme de Dürer, un grand A qui abrite un D, sous le mot RHINOCERUS.",
  "Les pattes couvertes d'écailles, comme celles d'un reptile.",
  "Le bord des plaques, à l'épaule et à la croupe, comme le rebord d'une armure.",
]
themes = ["animal", "exotisme", "gravure sur bois", "imagination", "renaissance"]
anecdote = """
Malgré ses erreurs, l'image de Dürer a fait référence très longtemps : des livres \
d'histoire naturelle l'ont copiée jusqu'au XVIIIᵉ siècle, petite corne dorsale \
comprise, alors même que d'autres rhinocéros vivants avaient été vus en Europe."""
salle = 2
mur = "ouest"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "Flamant rose d'Amérique (planche 431)"
artiste = "John James Audubon"
annee = "1838"
image = "flamant-rose.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:431_American_Flamingo.jpg"
technique = "Eau-forte et aquatinte coloriées à la main, gravées par Robert Havell ; feuille de près d'un mètre de haut"
collection = "Bibliothèque de l'université de Pittsburgh"
note = "Pour représenter l'oiseau grandeur nature sur la page, Audubon lui fait plier le cou jusqu'au sol : le format du livre dicte la pose."
description = """
Un flamant rose, immense, se penche au bord d'une rive herbeuse. Son long cou décrit \
une boucle qui descend jusqu'au sol, et son bec coudé, noir et jaune, effleure presque \
l'herbe. Le plumage est d'un rouge corail, plus soutenu sur les ailes repliées, où \
pointent des plumes noires. Les pattes, interminables et rose pâle, se terminent par \
des pieds palmés posés sur l'arête de la rive. En contrebas, sur une étendue d'eau \
calme bordée d'une côte plate, d'autres flamants, minuscules, marchent ou se \
nourrissent. En haut de la feuille, des dessins au trait montrent à part le bec, vu \
sous plusieurs angles, et un pied, comme dans un traité d'anatomie."""
evocation = """
Audubon voulait montrer chaque oiseau d'Amérique à sa taille réelle, et cette règle \
produit ici une image saisissante : l'oiseau semble trop grand pour la page et doit \
s'y plier. La pose, qui reprend le geste du flamant fouillant la vase, est à la fois \
exacte et théâtrale. Le contraste entre l'oiseau géant du premier plan et ses \
congénères lointains crée la profondeur du paysage. Les études du bec rappellent que \
le livre se voulait aussi un ouvrage de science. On a souvent vu dans les Oiseaux \
d'Amérique le portrait d'une nature encore sauvage et d'une abondance qui semblait \
inépuisable ; plusieurs des espèces peintes par Audubon, comme la tourte voyageuse ou \
la perruche de Caroline, ont depuis disparu."""
histoire = """
Faute de trouver un éditeur aux États-Unis, Audubon part en 1826 pour la \
Grande-Bretagne. Les Oiseaux d'Amérique y paraissent par livraisons, vendues sur \
souscription, de 1827 à 1838 : 435 planches au format dit « double éléphant », gravées \
et coloriées pour l'essentiel à Londres par Robert Havell fils, d'après les aquarelles \
du peintre. Le flamant appartient aux dernières livraisons, en 1838. Les aquarelles \
originales, vendues par la veuve d'Audubon, sont conservées à la New-York Historical \
Society. On estime qu'environ deux cents exemplaires complets furent assemblés, dont \
un peu plus d'une centaine subsistent ; celui-ci appartient à l'université de \
Pittsburgh, et le Natural History Museum de Londres en possède un autre."""
facture = """
Audubon travaillait d'après des oiseaux qu'il venait d'abattre : il les fixait, encore \
souples, avec des fils de fer sur une planche quadrillée pour leur donner une attitude \
vivante, puis les peignait à l'aquarelle, rehaussée de pastel et de gouache. Havell \
reportait le dessin sur le cuivre en combinant l'eau-forte et le burin, pour les \
contours et les plumes, et l'aquatinte, qui donne aux fonds leurs teintes grenues. \
Chaque feuille était ensuite coloriée à la main par une équipe de coloristes. Le \
paysage, souvent confié à des assistants ou au graveur, reste simple pour laisser \
l'oiseau dominer."""
details = [
  "Les études du bec et du pied, numérotées, en haut de la feuille.",
  "Les plumes noires des ailes, à peine visibles sous le rouge du plumage.",
  "Les flamants lointains, dans l'eau, qui donnent l'échelle du paysage.",
  "La légende gravée en bas : American Flamingo, avec le nom latin de l'oiseau.",
]
themes = ["oiseaux", "amérique", "grandeur nature", "ornithologie", "aquatinte"]
anecdote = """
En décembre 2010, un exemplaire complet des Oiseaux d'Amérique a été adjugé chez \
Sotheby's, à Londres, pour plus de 7,3 millions de livres sterling, ce qui en faisait \
alors le livre imprimé le plus cher jamais vendu aux enchères."""
salle = 2
mur = "nord"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Discomedusae (planche 8 des Formes artistiques de la nature)"
artiste = "Ernst Haeckel"
annee = "1899–1904"
image = "discomedusae.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Haeckel_Discomedusae_8.jpg"
technique = "Lithographie en couleurs d'après un dessin de Haeckel"
collection = "Planche du recueil Kunstformen der Natur, Leipzig et Vienne"
note = "Des méduses dessinées comme des lustres ou des bijoux : Haeckel veut prouver que la nature invente d'elle-même des formes d'art."
description = """
Sur un fond blanc flottent quatre méduses, numérotées et disposées comme sur une \
planche de musée. La plus grande, en haut à droite, ouvre une ombrelle bleue aux bords \
festonnés, d'où pendent des bras orangés plissés, une masse de franges bleu pâle et \
une chevelure de filaments rouges si longs qu'ils serpentent jusqu'en bas de la \
feuille. En haut à gauche, une méduse bleu-mauve laisse traîner des tentacules en \
tire-bouchon. À droite, une ombrelle jaune striée de brun, comme un abat-jour, porte \
des bras roses et des fils jaunes. En bas, une méduse vue de dessous dessine une \
rosace bleue au cœur orange."""
evocation = """
Haeckel, disciple ardent de Darwin, voyait dans la nature un seul grand ensemble régi \
par des lois, où la beauté naît d'elle-même : symétries, rayons, spirales. Le titre du \
recueil, Formes artistiques de la nature, dit son projet : offrir aux artistes et au \
public un répertoire de formes réelles, plus inventives que n'importe quel ornement. \
La grande méduse porte une charge plus intime : Haeckel l'avait nommée Desmonema \
annasethe, en souvenir de sa première femme, Anna Sethe, morte en 1864, et l'on a lu \
dans ses longs filaments l'image d'une chevelure. Ces planches ont nourri l'Art \
nouveau, qui cherchait justement ses motifs dans les plantes et les animaux."""
histoire = """
Haeckel publie les Kunstformen der Natur en livraisons de dix planches, de 1899 à \
1904, chez l'éditeur Bibliographisches Institut, à Leipzig et Vienne. Il a fait \
lui-même les dessins, à partir de ses observations au microscope, de ses séjours au \
bord de la mer et des spécimens rapportés par les grandes expéditions scientifiques, \
comme celle du navire britannique Challenger, dont il avait étudié les radiolaires. La \
plupart des planches sont lithographiées par Adolf Giltsch. Le recueil de cent \
planches connaît un grand succès, en Allemagne puis dans toute l'Europe. Les méduses \
de cette planche reprennent des espèces que Haeckel avait décrites dans sa grande \
monographie, Das System der Medusen, parue à partir de 1879."""
facture = """
Haeckel compose chaque planche comme un ornement : les organismes sont disposés en \
arabesque sur un fond blanc, sans aucun décor. Le dessin, d'une grande précision \
anatomique, insiste sur les éléments répétés, festons de l'ombrelle, plis des bras, \
canaux rayonnants. La lithographie en couleurs, qui demande une pierre par teinte, \
permet des couleurs franches et des passages délicats : bleus froids des ombrelles, \
rouges et orangés des filaments. Les longues lignes ondulantes des tentacules, qui \
traversent toute la feuille, annoncent les courbes en coup de fouet de l'Art nouveau."""
details = [
  "Les filaments rouges de la grande méduse, qui descendent jusqu'au bas de la planche.",
  "La méduse vue de dessous, en bas, dont l'ombrelle forme une rosace.",
  "Les tentacules en tire-bouchon de la méduse bleu-mauve, en haut à gauche.",
  "Les petits chiffres, de 1 à 4, qui renvoient aux explications du texte.",
]
themes = ["méduses", "mer", "symétrie", "art nouveau", "zoologie"]
anecdote = """
Pour la porte monumentale de l'Exposition universelle de Paris, en 1900, l'architecte \
René Binet s'inspira directement des radiolaires dessinés par Haeckel, ces organismes \
marins microscopiques aux squelettes de silice ajourés."""
salle = 2
mur = "nord"
place = 4
largeur = 1.2

[[oeuvres]]
titre = "Ananas et blattes (planche 1 de la Metamorphosis insectorum Surinamensium)"
artiste = "Maria Sibylla Merian"
annee = "1705"
image = "ananas-merian.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Metamorphosis_insectorum_Surinamensium_-_KW_1792_A_19_-_plaat01.jpg"
technique = "Gravure sur cuivre coloriée à la main, gravée par Joseph Mulder d'après Merian"
collection = "Koninklijke Bibliotheek, La Haye"
note = "La première planche du livre que Merian rapporta du Surinam : un ananas en fleur, envahi par des blattes à plusieurs stades de leur vie."
description = """
Un ananas se dresse au centre de la feuille, encore sur sa plante, entouré de longues \
feuilles vert-de-gris bordées d'épines, qui s'écartent en éventail. Le fruit, surmonté \
d'une touffe de feuilles, est couvert d'écailles bleutées et dorées ; à sa base \
s'échappent de grandes feuilles rouges tachetées de jaune. Autour, des blattes : deux \
adultes aux ailes brunes déployées volent en haut, une autre, ailes repliées, est \
posée sur une feuille, et une jeune blatte pâle aux longues antennes grimpe à droite. \
En bas, une petite sphère brune et deux insectes plus petits complètent la scène. \
Aucun décor : la plante et ses hôtes se détachent sur le papier clair."""
evocation = """
Merian ne range pas les insectes dans des cases : elle les montre vivants, sur la \
plante qui les nourrit, à plusieurs étapes de leur métamorphose. Cette manière de lier \
l'animal, sa nourriture et son cycle de vie fait d'elle une pionnière de ce qu'on \
appellera l'écologie. Ouvrir le livre par l'ananas n'est pas un hasard : ce fruit des \
Amériques, rare et cher en Europe, était le symbole même du luxe exotique. Mais Merian \
y installe sans fausse pudeur les blattes qui le dévorent. On a aussi lu son livre \
comme un témoignage sur la colonie néerlandaise du Surinam, fondée sur le travail des \
esclaves, dont elle parle à plusieurs reprises dans ses textes."""
histoire = """
En 1699, à cinquante-deux ans, Merian s'embarque pour le Surinam, colonie néerlandaise \
d'Amérique du Sud, avec sa fille Dorothea Maria, pour y étudier les insectes. Elle y \
travaille près de deux ans, aidée par des esclaves africains et des Amérindiens qui \
lui apportent des spécimens et des informations, avant que la maladie ne la force à \
rentrer en 1701. À Amsterdam, elle prépare un grand livre de soixante planches, la \
Metamorphosis insectorum Surinamensium, qu'elle publie en 1705 à ses frais, par \
souscription, en latin et en néerlandais. Les planches sont gravées par plusieurs \
graveurs, dont Joseph Mulder, qui a signé celle-ci ; les exemplaires de luxe sont \
coloriés à la main. Cet exemplaire appartient à la Bibliothèque royale des Pays-Bas, à \
La Haye."""
facture = """
Merian peignait d'après le vivant, à l'aquarelle et à la gouache sur vélin, en suivant \
l'évolution des chenilles et des larves qu'elle élevait elle-même. Les graveurs ont \
transposé ses études sur le cuivre d'un trait fin et léger, que l'aquarelle des \
coloristes recouvre presque entièrement : la couleur l'emporte sur le noir de la \
gravure. La composition est construite comme un portrait : la plante, vue de face, \
remplit la page, et les insectes sont répartis autour d'elle comme des satellites. Les \
verts, les rouges et les bruns sont posés en teintes franches, avec des rehauts plus \
sombres pour les volumes."""
details = [
  "La signature du graveur, J. Mulder sculp., en bas à gauche.",
  "Les deux blattes en vol, en haut, ailes brunes grandes ouvertes.",
  "La jeune blatte pâle, sans ailes, aux longues antennes, sur une feuille à droite.",
  "Les épines minuscules qui bordent chaque feuille de l'ananas.",
]
themes = ["insectes", "métamorphose", "surinam", "fruits", "femmes savantes"]
anecdote = """
Après la mort de Merian, en 1717, le tsar Pierre le Grand acheta une grande partie de \
ses aquarelles et de ses études. Elles sont toujours conservées à Saint-Pétersbourg, \
dans les collections de l'Académie des sciences de Russie."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Rosier à cent feuilles foliacé (Rosa centifolia foliacea)"
artiste = "Pierre-Joseph Redouté"
annee = "1817–1824"
image = "rosier-a-cent-feuilles.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Redoute_-_Rosa_centifolia_foliacea.jpg"
technique = "Gravure au pointillé imprimée en couleurs et retouchée à l'aquarelle, gravée par Langlois"
collection = "Planche du livre Les Roses, Paris"
note = "Le portrait d'une variété de rose, fleurs, boutons et feuilles, par le peintre que l'on surnommait le Raphaël des fleurs."
description = """
Une branche de rosier se déploie sur le papier blanc, de la tige épineuse, en bas, \
jusqu'aux boutons, en haut. Au sommet s'ouvrent deux grosses roses d'un rose tendre, \
aux pétales serrés et enroulés en coupe, l'une épanouie, l'autre encore à demi fermée. \
Autour, des boutons à différents stades, pris dans leurs sépales verts, dont les \
pointes se découpent en petites feuilles. Le feuillage, abondant, montre des folioles \
dentelées d'un vert profond, vues tantôt par-dessus, tantôt par-dessous, plus pâles. \
En bas, deux légendes gravées en italique donnent le nom latin, Rosa centifolia \
foliacea, et le nom français, Rosier à cent feuilles foliacé."""
evocation = """
La rose est la fleur la plus chargée de symboles en Occident : l'amour, la beauté, la \
fuite du temps. Redouté ne cherche pourtant ni allégorie ni bouquet : il fait le \
portrait d'une variété précise, telle qu'un botaniste ou un jardinier pourra la \
reconnaître. Le détail qui lui donne son nom, les sépales transformés en petites \
feuilles, est mis en évidence avec soin. Le livre est né dans le Paris de l'Empire et \
de la Restauration, où la culture des roses était à la mode : l'impératrice Joséphine \
avait réuni une collection célèbre à la Malmaison, et les horticulteurs multipliaient \
les variétés nouvelles. Ces planches en gardent la mémoire, et certaines des roses \
peintes par Redouté sont aujourd'hui difficiles à retrouver dans les jardins."""
histoire = """
Les Roses paraissent à Paris par livraisons, de 1817 à 1824, et forment trois volumes \
de 168 planches. Les textes sont du botaniste Claude-Antoine Thory, qui décrit chaque \
variété. L'impératrice Joséphine, qui avait protégé Redouté, était morte en 1814 : le \
livre est souvent associé à sa roseraie de la Malmaison, mais les modèles viennent de \
plusieurs jardins et pépinières de la région parisienne. Le succès fut tel qu'une \
édition de plus petit format suivit dès les années 1820. Recherchées des \
collectionneurs, les planches ont souvent été détachées des volumes pour être \
encadrées, et elles comptent aujourd'hui parmi les images de fleurs les plus \
reproduites au monde."""
facture = """
Redouté a perfectionné la gravure au pointillé imprimée en couleurs. Au lieu de \
traits, le graveur creuse dans le cuivre une multitude de points plus ou moins serrés, \
qui rendent les modelés sans contours durs. Les couleurs sont déposées sur la même \
plaque à l'aide de petits tampons de tissu, les poupées, et imprimées en un seul \
passage ; l'épreuve est ensuite retouchée à la main à l'aquarelle. Le résultat imite \
la transparence de l'aquarelle sur vélin, où Redouté excellait. Le fond blanc, sans \
ombre portée, isole la plante comme dans un herbier."""
details = [
  "Les sépales des boutons, découpés comme de petites feuilles : c'est le sens du mot foliacé.",
  "Les épines fines de la tige, tout en bas.",
  "Le revers pâle de certaines feuilles, qui se retournent vers nous.",
  "Les mentions gravées en bas : P. J. Redouté pinx., l'imprimeur Rémond et le graveur Langlois.",
]
themes = ["roses", "botanique", "fleurs", "couleur", "jardins"]
anecdote = """
Redouté a peint pendant des décennies pour les vélins du Muséum d'histoire naturelle \
de Paris, une collection de peintures de plantes et d'animaux sur parchemin commencée \
au XVIIᵉ siècle pour Gaston d'Orléans, et toujours enrichie aujourd'hui."""
salle = 3
mur = "ouest"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Première planche des muscles (De humani corporis fabrica)"
artiste = "André Vésale"
annee = "1543"
image = "premiere-planche-des-muscles.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:De_humani_corporis_fabrica_(27).jpg"
technique = "Gravure sur bois, page du livre imprimé à Bâle par Jean Oporin"
collection = "Collections spéciales de l'université d'Amsterdam"
note = "Un écorché marche dans un paysage italien : la première planche des muscles du grand traité qui refonda l'anatomie."
description = """
Un homme dépouillé de sa peau se tient debout, de face, au milieu d'un paysage. Il \
avance d'un pas, la tête renversée vers le ciel, les bras écartés et les mains \
ouvertes, comme dans un geste de lamentation. Tous les muscles superficiels sont à nu \
: les pectoraux, les abdominaux découpés en carrés, les longs muscles des cuisses et \
des bras, marqués de petites lettres qui renvoient au texte. Derrière lui s'étend une \
campagne vallonnée, avec des collines, des maisons, des ruines antiques, des \
obélisques, une pyramide et des arcades. En haut, le titre latin PRIMA MUSCULORUM \
TABULA, l'en-tête du livre au nom de Vésale et le numéro de la page."""
evocation = """
Vésale dresse ses écorchés comme des statues antiques, vivants et en mouvement, au \
lieu de les montrer couchés sur la table de dissection. On y a vu un écho des \
méditations sur la mort, mais aussi la fierté d'une science nouvelle qui ose regarder \
sous la peau. Le paysage parsemé de ruines rappelle l'Italie de la Renaissance, où \
l'on redécouvrait l'Antiquité. Le message du livre est clair : l'anatomie ne doit plus \
se lire dans les textes de Galien, le médecin grec dont l'autorité régnait depuis \
treize siècles, mais s'apprendre sur le corps humain lui-même. Vésale montre que \
Galien avait souvent décrit des animaux, singes ou porcs, plutôt que des hommes."""
histoire = """
Vésale n'a que vingt-huit ans quand paraît, en 1543, à Bâle, chez l'imprimeur Jean \
Oporin, le De humani corporis fabrica libri septem, « Sept livres sur la structure du \
corps humain ». Professeur à Padoue, il y fondait son enseignement sur la dissection, \
qu'il pratiquait lui-même. Les gravures ont été dessinées à Venise, dans l'entourage \
de Titien ; on les attribue souvent, au moins en partie, à Jan Steven van Calcar, mais \
la question reste discutée. Les blocs de bois furent expédiés de Venise à Bâle \
par-delà les Alpes. Le livre, dédié à l'empereur Charles Quint, scandalise les fidèles \
de Galien avant de s'imposer comme le fondement de l'anatomie moderne. Une seconde \
édition paraît en 1555."""
facture = """
La gravure sur bois atteint ici une finesse rarement égalée. Les tailles suivent la \
forme des muscles, comme les fibres elles-mêmes, et les hachures modèlent les volumes. \
Le dessin conjugue l'exactitude anatomique, contrôlée par Vésale, et une manière \
vénitienne de poser la figure dans l'espace, avec un déhanchement inspiré de la \
sculpture antique. Le paysage, traité plus légèrement, recule jusqu'à l'horizon. De \
petites lettres gravées dans les muscles renvoient à une légende : l'image se lit avec \
le texte, comme une carte avec sa légende."""
details = [
  "Les petites lettres semées sur les muscles, qui renvoient aux explications du texte.",
  "Les obélisques et la pyramide, à droite, dans le paysage.",
  "Les arcades en ruine, au pied des collines, à droite.",
  "La tête renversée en arrière, presque comme celle d'un martyr.",
  "Le numéro de page, 170, en haut à gauche.",
]
themes = ["anatomie", "corps", "médecine", "renaissance", "paysage"]
anecdote = """
Les blocs de bois de la Fabrica ont servi à des tirages pendant près de quatre \
siècles, jusqu'à une édition de 1934. Conservés à la bibliothèque de l'université de \
Munich, ils furent détruits lors des bombardements de la ville en 1944."""
salle = 4
mur = "est"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "L'Homme de Vitruve"
artiste = "Léonard de Vinci"
annee = "vers 1490"
image = "homme-de-vitruve.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Da_Vinci_Vitruve_Luc_Viatour.jpg"
technique = "Plume et encre brune sur pointe de métal, sur papier, environ 34 × 25 cm"
collection = "Gallerie dell'Accademia, Venise"
note = "Un homme inscrit dans un cercle et dans un carré : Léonard met en image les proportions idéales du corps décrites par l'architecte romain Vitruve."
description = """
Au centre d'une feuille couverte d'écriture, un homme nu est dessiné deux fois, en \
superposition : une fois les bras à l'horizontale et les pieds joints, une fois les \
bras levés et les jambes écartées. Dans la première position, il s'inscrit dans un \
carré ; dans la seconde, ses mains et ses pieds touchent un cercle dont le nombril est \
le centre. Le visage, encadré de boucles, regarde droit devant, grave. De petits \
traits marquent sur le corps les divisions des proportions, à la poitrine, aux genoux, \
le long des bras. Sous la figure court une échelle graduée ; au-dessus et au-dessous, \
des lignes de texte sont écrites à l'envers, de droite à gauche."""
evocation = """
L'architecte romain Vitruve affirmait qu'un homme bien proportionné, bras et jambes \
écartés, s'inscrit à la fois dans un cercle et dans un carré, les deux figures \
parfaites, et que l'architecture devait imiter ces proportions. À la Renaissance, \
l'idée fascine : le corps humain serait un modèle réduit de l'univers. D'autres \
artistes du temps s'essayèrent à cette figure, souvent maladroitement. Léonard résout \
le problème en ne donnant pas le même centre aux deux formes : le cercle tourne autour \
du nombril, le carré autour du sexe. Le dessin est devenu le symbole même de \
l'alliance entre l'art et la science, et de l'humanisme qui place l'homme au centre du \
monde."""
histoire = """
Léonard réalise ce dessin à Milan, vers 1490, alors qu'il est au service de Ludovic \
Sforza et qu'il étudie à la fois l'architecture, l'anatomie et les proportions. Le \
texte qui l'accompagne paraphrase le troisième livre du traité De architectura de \
Vitruve, puis énumère, mesure après mesure, les rapports entre les parties du corps et \
sa hauteur : l'envergure des bras, par exemple, égale la taille de l'homme. La feuille \
passa plus tard dans la collection du peintre milanais Giuseppe Bossi, puis entra en \
1822 aux Gallerie dell'Accademia de Venise. Très sensible à la lumière, elle n'est \
exposée que rarement et pour de courtes périodes."""
facture = """
Léonard trace d'abord la construction à la pointe de métal, au compas et à la règle, \
puis reprend les contours à la plume et à l'encre brune, d'un trait sûr et léger. Des \
hachures fines, typiques de sa main gauche, modèlent la musculature avec économie. La \
double pose donne une impression de mouvement, presque d'animation, au cœur d'une \
figure géométrique immobile. Comme dans tous les carnets de Léonard, l'image et le \
texte forment un tout : son écriture en miroir, tracée de droite à gauche, encadre le \
dessin."""
details = [
  "Le nombril, centre exact du cercle.",
  "L'échelle graduée tracée sous la figure.",
  "Les petits traits qui découpent le corps en fractions de sa hauteur.",
  "L'écriture en miroir de Léonard, qu'il faut lire dans une glace.",
  "Les quatre bras et les quatre jambes, qui suggèrent un mouvement.",
]
themes = ["proportions", "corps", "géométrie", "humanisme", "renaissance"]
anecdote = """
L'Homme de Vitruve figure sur la face italienne des pièces de un euro. En 2019, son \
prêt au Louvre pour l'exposition Léonard de Vinci fut d'abord suspendu par un tribunal \
italien, saisi par une association de protection du patrimoine, avant d'être autorisé."""
salle = 4
mur = "est"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Astrolabe du prince rasoulide ʿUmar"
artiste = "Yémen, dynastie rasoulide"
annee = "1291 (690 de l'hégire)"
image = "astrolabe-rasoulide.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Astrolabe_of_‘Umar_ibn_Yusuf_ibn_‘Umar_ibn_‘Ali_ibn_Rasul_al-Muzaffari_MET_DP170386.jpg"
technique = "Laiton coulé et martelé, ajouré, ciselé, incrusté d'argent ; diamètre 15,6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Un instrument pour lire le ciel, fabriqué au Yémen par un prince savant, futur sultan. Diamètre réel : 15,6 cm."
description = """
Un disque de laiton doré, épais, se tient debout, surmonté d'un petit fronton ajouré \
de rinceaux, le trône, d'où pend un anneau de suspension. Le large bord, gradué, est \
couvert de chiffres et d'inscriptions en arabe. Au centre, une plaque gravée d'un \
réseau de cercles et de lignes, le tympan, est recouverte d'une dentelle de métal \
découpé, l'araignée, dont les pointes en forme de flammes et de crochets désignent des \
étoiles. Un axe central retient toutes les pièces, et une règle pivote autour de lui. \
Le métal porte des traces d'usure et quelques éclats : l'objet a servi. Son dos, \
invisible ici, porte une alidade, la réglette de visée."""
evocation = """
L'astrolabe est une carte du ciel que l'on tient dans la main. En visant le soleil ou \
une étoile, puis en faisant tourner l'araignée sur le tympan, on pouvait lire l'heure, \
de jour comme de nuit, connaître la position des astres, mesurer la hauteur d'un \
édifice et, dans le monde islamique, déterminer les heures des prières. Imaginé dans \
le monde grec, perfectionné par les savants de langue arabe, l'instrument passa \
ensuite en Europe par l'Espagne. Celui-ci dit la place de la science à la cour \
rasoulide : un prince y manie lui-même le calcul et l'outil, à la fois artisan et \
astronome. Sa beauté n'est pas un ornement ajouté : elle naît de la précision."""
histoire = """
Les inscriptions indiquent que l'astrolabe a été fait par ʿUmar ibn Yusuf, fils du \
sultan rasoulide al-Muzaffar Yusuf, et daté de l'an 690 de l'hégire, soit 1291. Le \
prince, passionné de sciences, devint en 1295 le troisième sultan de la dynastie, sous \
le nom d'al-Ashraf ʿUmar, mais mourut dès l'année suivante. Il est l'auteur d'ouvrages \
d'astronomie et d'un traité sur la construction des astrolabes. On ignore quand \
l'instrument a quitté le Yémen. Il appartenait au New-Yorkais Edward C. Moore, orfèvre \
et dessinateur de la maison Tiffany, dont la collection fut léguée au Metropolitan \
Museum of Art en 1891 ; le musée en publie aujourd'hui librement les photographies."""
facture = """
Le corps de l'astrolabe, la mère, est coulé en laiton puis martelé ; son rebord forme \
un logement où s'emboîtent les tympans, quatre plaques gravées pour différentes \
latitudes. L'araignée, découpée à la scie et à la lime, doit être assez ajourée pour \
laisser voir le tympan et assez solide pour ne pas se déformer : ses volutes sont à la \
fois ornement et structure. Graduations et inscriptions sont gravées au burin, avec \
des incrustations d'argent. Le tracé des cercles, calculé par la géométrie et reporté \
au compas, conditionne l'exactitude de l'instrument."""
details = [
  "Le trône ajouré, en haut, et son anneau de suspension.",
  "Les pointes de l'araignée, qui marquent chacune une étoile.",
  "Les graduations du bord, sur tout le pourtour du disque.",
  "Le réseau de cercles du tympan, visible sous l'araignée.",
]
themes = ["astronomie", "instrument", "islam", "yémen", "mesure"]
anecdote = """
Le mot astrolabe vient du grec et signifie à peu près « qui saisit les astres ». Vers \
1391, le poète anglais Geoffrey Chaucer écrivit pour un enfant, son fils Lewis, un \
Traité de l'astrolabe, l'un des premiers textes scientifiques en langue anglaise."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Typus Orbis Terrarum (carte du monde)"
artiste = "Abraham Ortelius"
annee = "1570"
image = "typus-orbis-terrarum.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:OrteliusWorldMap1570.jpg"
technique = "Gravure sur cuivre coloriée à la main, gravée par Frans Hogenberg"
collection = "Bibliothèque du Congrès, Washington"
note = "La carte du monde qui ouvre le Theatrum Orbis Terrarum, considéré comme le premier atlas moderne."
description = """
Le monde entier tient dans un grand ovale quadrillé de méridiens et de parallèles, \
entouré de nuages bleus qui s'enroulent dans les angles. L'Europe, l'Afrique et l'Asie \
occupent la droite, les Amériques la gauche, avec une Amérique du Sud renflée et une \
Amérique du Nord démesurément large. Tout le bas de la carte est pris par un immense \
continent austral, inscrit TERRA AUSTRALIS NONDUM COGNITA, la terre australe pas \
encore connue. Sur les mers voguent un navire et des monstres marins. En haut, un \
cartouche donne le titre ; en bas, un second cartouche porte une phrase latine de \
Cicéron. Les terres sont rehaussées de jaunes, de roses et de verts pâles."""
evocation = """
La carte montre le monde tel que les Européens le connaissent près de quatre-vingts \
ans après le premier voyage de Christophe Colomb : les côtes de l'Atlantique et de \
l'Afrique sont tracées avec assurance, mais le Pacifique, l'intérieur des continents \
et les régions polaires restent incertains, et le grand continent austral relève de \
l'hypothèse. La phrase de Cicéron, tirée des Tusculanes, demande ce qui peut paraître \
grand dans les affaires humaines à celui qui connaît l'éternité et l'immensité du \
monde. Elle invite à la modestie : vue de haut, la Terre rend dérisoires les ambitions \
des hommes. Le titre du livre, Théâtre du monde, dit la même chose : la Terre est une \
scène qu'on embrasse d'un regard."""
histoire = """
Abraham Ortelius, marchand de cartes et d'antiquités à Anvers, publie le 20 mai 1570 \
le Theatrum Orbis Terrarum, un recueil de cartes de format et de style uniformes, \
gravées pour l'occasion et accompagnées de textes, avec la liste des cartographes dont \
il s'est servi. C'est l'invention de l'atlas moderne, même si le mot ne viendra que \
plus tard, avec Mercator. Cette carte du monde, gravée par Frans Hogenberg, s'appuie \
notamment sur la grande carte murale publiée par Mercator en 1569. Le livre connaît un \
succès immédiat : il est réédité et augmenté une trentaine de fois en quarante ans, en \
latin puis en plusieurs autres langues. Cet exemplaire colorié appartient à la \
Bibliothèque du Congrès, à Washington."""
facture = """
La carte est gravée au burin sur cuivre, d'un trait net qui permet d'inscrire des \
centaines de noms en petites capitales et en italiques. La projection ovale déploie \
toute la surface du globe sur la feuille, en courbant les méridiens vers les pôles. \
Les ornements, nuages enroulés, cartouches à volutes et à rubans, appartiennent au \
vocabulaire décoratif de la Renaissance flamande. La couleur n'était pas imprimée mais \
posée à la main, à l'aquarelle : l'acheteur pouvait commander un exemplaire colorié, \
plus cher, à des enlumineurs de cartes, le métier qu'Ortelius lui-même exerça à ses \
débuts."""
details = [
  "Le cartouche du bas, avec la phrase de Cicéron en capitales.",
  "Les mots TERRA AUSTRALIS NONDUM COGNITA, sur le continent imaginaire du sud.",
  "La mention de Christophe Colomb et de l'année 1492, sur l'Amérique du Nord.",
  "Le renflement de la côte ouest de l'Amérique du Sud, corrigé dans les éditions suivantes.",
  "Le monstre marin de l'océan Indien, en bas à droite.",
]
themes = ["cartographie", "monde", "découvertes", "atlas", "anvers"]
anecdote = """
Dans son dictionnaire géographique, le Thesaurus geographicus de 1596, Ortelius \
suggère que les Amériques ont été arrachées à l'Europe et à l'Afrique par des \
tremblements de terre et des inondations : on y voit l'une des premières intuitions de \
la dérive des continents."""
salle = 5
mur = "ouest"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "La Puce (Micrographia, schéma XXXIV)"
artiste = "Robert Hooke"
annee = "1665"
image = "puce-micrographia.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:HookeFlea01.jpg"
technique = "Gravure sur cuivre, grande planche dépliante du livre Micrographia"
collection = "Bibliothèque nationale du pays de Galles, Aberystwyth"
note = "Une puce vue au microscope et agrandie sur une immense planche dépliante : pour le public de 1665, la révélation d'un monde invisible."
description = """
Une puce, vue de profil, occupe toute la feuille. Son corps ovale est fait d'anneaux \
qui se chevauchent comme les plaques d'une armure, hérissés de soies raides plantées \
en rangées. La tête, petite, porte un œil rond et des pièces buccales pointues ; les \
pattes, articulées, sont couvertes de poils et terminées par des griffes recourbées. \
Les pattes arrière, très longues et repliées sous le corps, laissent deviner la \
puissance du saut. Des lettres capitales, de A à L, sont posées sur les différentes \
parties du corps et renvoient à la description du texte. Il n'y a ni ombre portée ni \
décor : l'insecte est seul, comme suspendu sur la page blanche."""
evocation = """
Pour les lecteurs de 1665, la puce est le plus vil des parasites, que l'on écrase sans \
la regarder. Hooke en fait un objet d'admiration : il s'émerveille dans son texte de \
sa force et de la beauté de son armure, et la planche lui donne la dignité d'un \
portrait. L'image dit le choc du microscope : sous la lentille, le minuscule devient \
monumental, et la nature révèle partout un ordre et une finesse insoupçonnés. Pour les \
savants de la Royal Society, qui voulaient fonder la connaissance sur l'expérience et \
l'observation, de telles images étaient des preuves autant que des illustrations : \
elles faisaient voir à tous ce que seuls quelques-uns avaient pu observer."""
histoire = """
Robert Hooke est le curateur des expériences de la Royal Society de Londres, fondée en \
1660, qui lui demande de présenter, séance après séance, des observations faites au \
microscope. Il les réunit dans Micrographia, publiée en janvier 1665 avec l'aval de la \
Société et illustrée de 38 planches gravées : l'œil d'une mouche, la pointe d'une \
aiguille, des flocons de neige, des moisissures, une tranche de liège. Le livre \
connaît un grand succès dans le public cultivé. Dans son journal, Samuel Pepys raconte \
qu'il a veillé jusqu'à deux heures du matin pour le lire, et le tient pour le livre le \
plus ingénieux qu'il ait jamais lu. Cette planche provient de l'exemplaire de la \
Bibliothèque nationale du pays de Galles."""
facture = """
Hooke a dessiné lui-même ses observations. Le microscope de l'époque ne montre \
nettement qu'une petite zone à la fois, et l'insecte vivant bouge : il a donc \
reconstitué l'animal entier à partir de nombreuses vues successives, sous des \
éclairages différents. La gravure traduit ces dessins par un réseau très dense de \
traits fins et parallèles qui suivent la courbure de chaque segment, et donnent aux \
plaques un aspect lustré, presque métallique. Le grand format de la planche, qui se \
déplie hors du livre, fait partie de l'effet : le lecteur éprouve physiquement \
l'agrandissement."""
details = [
  "L'œil rond de la puce, sur le côté de la petite tête.",
  "Les griffes recourbées au bout des pattes, qui lui permettent de s'accrocher.",
  "Les soies raides plantées en rangées sur chaque anneau du corps.",
  "Les lettres de A à L, qui renvoient au texte de Hooke.",
]
themes = ["microscope", "insectes", "invisible", "gravure", "royal society"]
anecdote = """
C'est dans Micrographia que Hooke, observant une fine tranche de liège, décrit ses \
