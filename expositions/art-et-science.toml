[exposition]
ordre = 65
nom_court = "Art et science"
mouvement = "Art et science : la nature dessinée"
cadre = "estampe"
couleur = "#2f5d50"
titre = "Art et science, la nature dessinée"
artiste = "Léonard, Dürer, Vésale, Merian, Audubon, Haeckel…"
dates = "1291–1904"
accroche = "Exposition virtuelle · Natural History Museum, Londres"
introduction = """
Pendant des siècles, savants et artistes ont eu besoin les uns des autres : pour \
décrire une plante, un insecte, un muscle ou le contour d'un continent, il fallait \
d'abord savoir le dessiner. La visite réunit dix images où l'observation devient art, \
du rhinocéros de Dürer aux méduses de Haeckel, de l'Homme de Vitruve de Léonard au \
flamant rose d'Audubon, avec un astrolabe yéménite et la carte du monde du premier \
atlas moderne. Le bâtiment s'inspire du Natural History Museum de Londres : derrière \
un porche, une haute nef, la Hintze Hall, ouvre à l'ouest et à l'est sur deux galeries \
et, au fond, sur un cabinet."""
vitrine = "flamant-rose.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Natural History Museum"
ville = "Londres, Royaume-Uni"
architecte = "Alfred Waterhouse"
construction = "1873–1881"
presentation = """
Au milieu du XIXᵉ siècle, les collections d'histoire naturelle du British Museum, nées \
du legs du médecin Hans Sloane, débordent de leurs salles de Bloomsbury. Le \
naturaliste Richard Owen, qui les dirige, obtient la construction d'un bâtiment séparé \
à South Kensington, une « cathédrale de la nature ». Après la mort de Francis Fowke, \
lauréat du concours, Alfred Waterhouse reprend le projet dans un style roman : le \
chantier commence en 1873 et le musée ouvre le 18 avril 1881. La façade est \
entièrement revêtue de terre cuite chamois et gris-bleu, un matériau qui résiste à la \
suie londonienne, et ornée de plantes et d'animaux sculptés : les espèces vivantes du \
côté ouest, les espèces disparues du côté est. Au centre, la grande nef, rebaptisée \
Hintze Hall en 2014, porte un plafond de panneaux peints de plantes ; depuis 2017, le \
squelette d'une baleine bleue y est suspendu, à la place de la célèbre copie de \
diplodocus. Le musée, qui n'a pris son nom actuel qu'en 1992, est gratuit."""
ici = """
Le bâtiment d'ARTEON reprend l'axe du musée de Waterhouse : un porche, puis une nef \
très haute sur laquelle s'ouvrent les galeries. On entre par le sud dans le porche de \
Cromwell Road, aux murs de pierre claire, puis dans la Hintze Hall, longue de \
vingt-huit mètres et haute de dix-huit, couleur de terre cuite, où sont réunis les \
animaux. À l'ouest s'ouvre la galerie des plantes et des insectes, d'un vert tendre ; \
à l'est, la galerie du corps humain, rose pâle. Au fond de la nef, au nord, le cabinet \
du monde, carré, garde les instruments et les cartes."""

