# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Albrecht Dürer"
vie = "Nuremberg, 21 mai 1471 – Nuremberg, 6 avril 1528"
biographie = """
Fils d'un orfèvre venu de Hongrie, Albrecht Dürer apprend d'abord le métier de son \
père, puis entre en 1486 dans l'atelier du peintre Michael Wolgemut, à Nuremberg, où \
l'on illustre aussi des livres. Après un voyage de compagnon vers le Rhin, il épouse \
Agnes Frey en 1494 et part la même année pour Venise, où il découvre la peinture \
italienne. De retour, il ouvre son atelier et publie en 1498 l'Apocalypse, une suite \
de grandes gravures sur bois qui le rend célèbre dans toute l'Europe. Il peint des \
autoportraits d'une assurance nouvelle et des études de nature d'une précision inouïe, \
comme le Lièvre de 1502 ou la Grande Touffe d'herbe de 1503. Un second séjour à \
Venise, de 1505 à 1507, confirme sa réputation, et l'empereur Maximilien Iᵉʳ lui \
accorde une pension. Ses gravures sur cuivre de 1513–1514, le Chevalier, la Mort et le \
Diable, Saint Jérôme dans sa cellule et Melencolia I, comptent parmi les plus célèbres \
de l'histoire. Après un voyage aux Pays-Bas en 1520–1521, il se rallie aux idées de \
Luther et consacre ses dernières années à des traités de géométrie et de proportions \
humaines."""
style = """
Dürer unit la rigueur du dessin gothique allemand et les leçons de la Renaissance \
italienne : perspective, proportions, modelé. Graveur avant tout, il a porté la \
gravure sur bois et sur cuivre à un degré de finesse jamais atteint, faisant de \
l'estampe un art à part entière, diffusé dans toute l'Europe. Ses études d'animaux et \
de plantes, à l'aquarelle et à la gouache, observent la nature avec une exactitude de \
naturaliste. Son monogramme AD, présent sur presque toutes ses œuvres, était connu de \
tout le continent et largement copié."""

[[artistes]]
nom = "John James Audubon"
vie = "Les Cayes (Saint-Domingue), 26 avril 1785 – New York, 27 janvier 1851"
biographie = """
Fils naturel d'un officier de marine et planteur français, Jean Audubon, et d'une \
jeune femme de chambre, Jeanne Rabin, morte quelques mois après sa naissance, il est \
élevé à Couëron, près de Nantes. En 1803, pour lui éviter la conscription, son père \
l'envoie en Amérique, dans une propriété familiale de Pennsylvanie, Mill Grove, où il \
se passionne pour les oiseaux. Marié en 1808 à Lucy Bakewell, il tente sa chance comme \
commerçant dans le Kentucky, où il possède des esclaves. Ruiné en 1819, il vit de \
portraits et de leçons de dessin, puis se fixe un but : peindre tous les oiseaux \
d'Amérique du Nord. Il parcourt forêts, marais et côtes, de la Louisiane au Labrador. \
Faute d'éditeur aux États-Unis, il part en 1826 pour l'Angleterre et l'Écosse, où son \
allure de coureur des bois fait sensation. Il y publie les Oiseaux d'Amérique, de 1827 \
à 1838, accompagnés d'une Biographie ornithologique écrite avec l'Écossais William \
MacGillivray. Rentré en Amérique, il entreprend un ouvrage sur les mammifères \
d'Amérique du Nord, achevé avec le pasteur John Bachman et ses propres fils. Il meurt \
à New York en 1851."""
style = """
Audubon rompt avec les oiseaux raides, posés de profil sur une branche : il les montre \
grandeur nature et en action, chassant, se nourrissant, se battant, dans leur milieu. \
Ses compositions dramatiques et souvent décoratives doivent beaucoup à son talent de \
dessinateur et à son expérience de chasseur et d'observateur sur le terrain. Ses \
planches ont façonné l'image de la nature américaine ; les sociétés de protection des \
oiseaux fondées aux États-Unis à partir de 1886 ont pris son nom."""

[[artistes]]
nom = "Ernst Haeckel"
vie = "Potsdam, 16 février 1834 – Iéna, 9 août 1919"
biographie = """
Fils d'un juriste prussien, Ernst Haeckel étudie la médecine à Wurtzbourg, Berlin et \
Vienne, et suit à Berlin l'enseignement du zoologiste Johannes Müller, qui l'initie à \
l'étude des animaux marins. Après un séjour à Messine en 1859–1860, il publie une \
monographie des radiolaires, organismes microscopiques à squelette de silice, \
illustrée de ses propres dessins. En 1862, il devient professeur à l'université \
d'Iéna, où il enseignera jusqu'en 1909. La lecture de Darwin le bouleverse : il \
devient le plus ardent propagateur de la théorie de l'évolution en Allemagne et \
dessine les premiers arbres généalogiques du vivant. Il forge des mots promis à un \
grand avenir, comme écologie, en 1866. En 1864, la mort de sa jeune épouse, Anna \
Sethe, le plonge dans le désespoir. Voyageur infatigable, des Canaries à Ceylan, il \
décrit des milliers d'espèces nouvelles. Son œuvre a aussi des côtés sombres : \
certains de ses dessins d'embryons, trop schématisés, furent accusés de forcer les \
ressemblances, et ses théories ont classé les peuples humains selon une hiérarchie \
raciale aujourd'hui rejetée. Il meurt à Iéna en 1919."""
style = """
Haeckel dessinait comme il pensait : en cherchant l'ordre, la symétrie et la parenté \
des formes. Ses planches, très précises mais disposées comme des ornements, mettent en \
valeur les rayons, les spirales et les structures répétées du vivant. Il a voulu \
prouver que la nature est elle-même artiste. Ses Formes artistiques de la nature ont \
fourni aux architectes, verriers et décorateurs de l'Art nouveau un immense répertoire \
de motifs, et continuent d'inspirer graphistes et designers."""

[[artistes]]
nom = "Maria Sibylla Merian"
vie = "Francfort-sur-le-Main, 2 avril 1647 – Amsterdam, 13 janvier 1717"
biographie = """
Fille de l'éditeur et graveur Matthäus Merian l'Ancien, mort quand elle avait trois \
ans, Maria Sibylla grandit à Francfort dans l'atelier de son beau-père, le peintre de \
fleurs Jacob Marrel, qui lui apprend le dessin et la peinture. Adolescente, elle élève \
des vers à soie et des chenilles pour observer leur transformation, à une époque où \
beaucoup croient encore que les insectes naissent de la boue. Mariée en 1665 au \
peintre Johann Andreas Graff, elle s'installe à Nuremberg, publie un livre de fleurs \
puis, en 1679, un premier livre sur les chenilles et leurs plantes nourricières. En \
1685, elle rejoint avec sa mère et ses deux filles une communauté religieuse, les \
labadistes, en Frise, et se sépare de son mari. Installée à Amsterdam en 1691, elle y \
vend peintures et spécimens et fréquente les collectionneurs. En 1699, elle part pour \
le Surinam avec sa fille cadette, Dorothea Maria, et en revient deux ans plus tard \
pour préparer son grand livre, publié en 1705. Frappée d'une attaque en 1715, elle \
meurt à Amsterdam en 1717. Linné cita ses planches pour décrire de nombreuses espèces."""
style = """
Merian unit la précision du naturaliste et la grâce de la peinture de fleurs allemande \
et hollandaise. Sa grande innovation est de réunir sur une seule image le cycle d'un \
insecte, œuf, chenille, chrysalide et adulte, avec la plante dont il se nourrit : une \
image du vivant en relation, et non un catalogue d'espèces isolées. Ses compositions, \
élégantes et vivantes, ont influencé l'illustration naturaliste pendant plus d'un \
siècle."""

[[artistes]]
nom = "Pierre-Joseph Redouté"
vie = "Saint-Hubert (Belgique actuelle), 10 juillet 1759 – Paris, 19 juin 1840"
biographie = """
Né dans les Ardennes, dans une famille de peintres, Pierre-Joseph Redouté quitte très \
jeune la maison pour travailler comme peintre itinérant. En 1782, il rejoint à Paris \
son frère aîné Antoine-Ferdinand, décorateur de théâtre. Il rencontre le botaniste \
Charles-Louis L'Héritier de Brutelle, qui l'initie à la botanique et lui confie \
l'illustration de ses livres, ainsi que le peintre Gerard van Spaendonck, maître de la \
peinture de fleurs sur vélin. Il reçoit le titre de dessinateur du cabinet de la reine \
Marie-Antoinette et, après la Révolution, travaille pour le Muséum d'histoire \
naturelle. L'impératrice Joséphine en fait son peintre de fleurs : il publie Les \
Liliacées, de 1802 à 1816, puis Les Roses, de 1817 à 1824. Professeur de dessin au \
Muséum, il compte parmi ses élèves des princesses et des femmes de la bonne société. \
Malgré sa gloire, ses dépenses et les difficultés du marché du livre illustré le \
laissent dans la gêne à la fin de sa vie. Il meurt à Paris en 1840."""
style = """
Redouté allie l'exactitude exigée par les botanistes, qui doivent pouvoir reconnaître \
chaque espèce, à une élégance de composition et une délicatesse de couleur qui font de \
ses planches des œuvres d'art. Il a porté à la perfection la gravure au pointillé \
imprimée en couleurs, qui rend la transparence de l'aquarelle. Surnommé le Raphaël des \
fleurs, il reste la référence de l'illustration botanique, et ses roses et ses lis \
n'ont cessé d'être reproduits."""

[[artistes]]
nom = "André Vésale"
vie = "Bruxelles, 31 décembre 1514 – île de Zante (Grèce), 15 octobre 1564"
biographie = """
Né à Bruxelles dans une famille d'apothicaires et de médecins au service des \
empereurs, Andries van Wesel, dit Vésale, étudie à Louvain puis à Paris, où il suit \
les leçons des anatomistes Jacques Dubois et Johann Winter d'Andernach. On y enseigne \
une anatomie lue dans les livres de Galien, tandis qu'un barbier se charge de la \
dissection. Faute de corps, le jeune Vésale va chercher des ossements au gibet de \
Montfaucon. Reçu docteur à Padoue en 1537, il y devient aussitôt professeur de \
chirurgie et d'anatomie, et dissèque lui-même devant ses étudiants. Il constate peu à \
peu que bien des descriptions de Galien valent pour des animaux, non pour l'homme. En \
1543, à vingt-huit ans, il publie à Bâle la Fabrica, accompagnée d'un abrégé, \
l'Epitome. La même année, il devient médecin de l'empereur Charles Quint, puis de son \
fils Philippe II d'Espagne. En 1564, il entreprend un pèlerinage à Jérusalem ; sur le \
chemin du retour, il meurt dans l'île de Zante, en Grèce, avant d'avoir atteint \
cinquante ans."""
style = """
Vésale n'était pas un artiste, mais il a pensé ses livres comme des œuvres d'art : il \
en a dirigé l'illustration, choisi les dessinateurs, contrôlé la gravure et la mise en \
page. Son principe est simple et révolutionnaire : voir avant de croire, et montrer ce \
que l'on a vu. Ses écorchés et ses squelettes posés dans des paysages, élégants et \
mélancoliques, ont été copiés dans toute l'Europe et ont fixé pour longtemps l'image \
du corps dans les livres de médecine."""

[[artistes]]
nom = "Léonard de Vinci"
vie = "Vinci (Toscane), 15 avril 1452 – Amboise, 2 mai 1519"
biographie = """
Fils illégitime d'un notaire florentin, Léonard grandit à Vinci, en Toscane, puis \
entre vers 1469 dans l'atelier d'Andrea del Verrocchio, à Florence, où il apprend la \
peinture, la sculpture et la mécanique. En 1482, il part pour Milan au service de \
Ludovic Sforza, comme ingénieur, organisateur de fêtes et peintre : il y peint la \
Vierge aux rochers et la Cène. Après la chute de Ludovic, en 1499, il passe par \
Mantoue et Venise, puis revient à Florence, où il commence la Joconde vers 1503 et \
sert un temps César Borgia comme ingénieur militaire. Il retourne à Milan, puis \
s'installe à Rome en 1513. En 1516, le roi François Iᵉʳ l'invite en France et le loge \
au manoir du Cloux, près d'Amboise, où il meurt en 1519. Toute sa vie, il a rempli des \
milliers de pages de carnets : machines, vol des oiseaux, mouvement des eaux, \
botanique, géologie et surtout anatomie. Il disséqua des corps humains à Florence, à \
l'hôpital de Santa Maria Nuova, et à Pavie avec le médecin Marcantonio della Torre. \
Ses dessins anatomiques, restés inédits, sont aujourd'hui pour la plupart dans la \
collection royale britannique, à Windsor."""
style = """
Léonard fonde la peinture sur l'observation et la connaissance : anatomie, optique, \
botanique. Il invente le sfumato, ce modelé vaporeux qui fond les contours dans \
l'ombre, et une perspective atmosphérique où les lointains bleuissent. Dessinateur \
prodigieux, il se sert de la plume, de la pierre noire, de la sanguine et de la pointe \
de métal pour penser autant que pour représenter. Ses carnets, où l'image se mêle à \
l'écriture en miroir, font de lui la figure même du génie de la Renaissance, à la fois \
artiste et savant."""

[[artistes]]
nom = "Yémen, dynastie rasoulide"
vie = "Yémen (Taʿizz, Zabid, Aden), 1229–1454"
biographie = """
Les Rasoulides sont une famille d'origine turkmène, selon la plupart des historiens, \
bien qu'elle ait revendiqué une ascendance arabe. Ils arrivent au Yémen au service des \
Ayyoubides, la dynastie de Saladin, qui avait conquis le pays en 1174. En 1229, leur \
gouverneur, Nur al-Din ʿUmar ibn ʿAli ibn Rasul, prend le pouvoir à son compte et \
fonde un sultanat qui durera jusqu'en 1454. Depuis leurs capitales de Taʿizz et de \
Zabid, les sultans tiennent le port d'Aden, carrefour du commerce entre l'Inde, \
l'Afrique orientale, l'Égypte et la Méditerranée. Cette richesse finance des mosquées, \
des madrasas et une cour savante. Plusieurs sultans écrivent eux-mêmes : al-Muzaffar \
Yusuf, qui règne de 1250 à 1295, compose notamment un traité des remèdes ; son fils \
al-Ashraf ʿUmar, l'auteur de l'astrolabe exposé ici, écrit sur les étoiles et les \
instruments. Les Rasoulides commandent aussi en Égypte et en Syrie des verres émaillés \
et des cuivres incrustés à leur emblème, une rose à cinq pétales."""
style = """
La cour rasoulide fut l'un des grands foyers de science et d'art du monde islamique \
médiéval. Astronomes, médecins et agronomes y travaillaient sous la protection de \
sultans eux-mêmes savants. Les objets de cour, instruments de laiton gravés et \
incrustés, verres émaillés, bassins et chandeliers, portent souvent des inscriptions \
au nom du sultan et la rose à cinq pétales de la dynastie, et allient la précision \
technique à un décor calligraphique et végétal raffiné."""

[[artistes]]
nom = "Abraham Ortelius"
vie = "Anvers, 14 avril 1527 – Anvers, 28 juin 1598"
biographie = """
Né à Anvers dans une famille venue d'Augsbourg, Abraham Ortelius perd tôt son père. En \
1547, il est inscrit à la guilde de Saint-Luc comme enlumineur de cartes : il colorie \
à la main des cartes imprimées, qu'il vend avec des livres, des estampes et des \
antiquités. Ses voyages d'affaires, aux foires de Francfort, en France, en Italie et \
en Angleterre, lui permettent de rassembler les meilleures cartes de son temps et de \
se lier avec les savants, notamment Gérard Mercator, qui devient son ami. Il a l'idée \
de réunir des cartes de même format en un seul volume : le Theatrum Orbis Terrarum \
paraît en 1570 et fait sa fortune. En 1575, il reçoit le titre de géographe du roi \
Philippe II d'Espagne. Passionné d'Antiquité, il publie aussi des cartes historiques, \
des recueils d'images antiques et un dictionnaire des noms de lieux anciens, qu'il ne \
cesse d'enrichir. Il entretient une vaste correspondance avec les humanistes de toute \
l'Europe. Il meurt à Anvers en 1598, sans avoir jamais cessé d'augmenter son atlas."""
style = """
Ortelius n'était pas un cartographe de terrain mais un éditeur, un compilateur \
critique et un homme de goût. Il choisit pour chaque région la meilleure carte \
disponible, la fait redessiner dans un format commun et cite ses sources, une pratique \
nouvelle. Ses cartes, gravées avec netteté et ornées de cartouches et de nuages dans \
le goût de la Renaissance flamande, joignent l'information et la beauté. Son atlas a \
servi de modèle à la cartographie européenne jusqu'au XVIIᵉ siècle."""

[[artistes]]
nom = "Robert Hooke"
vie = "Freshwater (île de Wight), 18 juillet 1635 – Londres, 3 mars 1703"
biographie = """
Fils d'un pasteur de l'île de Wight, Robert Hooke montre très tôt un talent pour la \
mécanique et le dessin ; à la mort de son père, il est brièvement placé, dit-on, chez \
le peintre Peter Lely à Londres, puis entre à l'école de Westminster et à l'université \
d'Oxford. Il y devient l'assistant du chimiste Robert Boyle, pour qui il construit une \
pompe à air. En 1662, la toute jeune Royal Society le nomme curateur des expériences : \
il doit en présenter de nouvelles à chaque séance. Il publie Micrographia en 1665 et \
devient professeur de géométrie au Gresham College de Londres. Après le grand incendie \
de 1666, il est l'un des inspecteurs chargés de la reconstruction de la ville et \
travaille avec l'architecte Christopher Wren, notamment au Monument qui commémore \
l'incendie. On lui doit la loi de l'élasticité qui porte son nom et des travaux sur la \
lumière, les fossiles, les montres et la gravitation, qui l'opposèrent durement à \
Isaac Newton. Il meurt à Londres en 1703. Aucun portrait authentifié de lui n'est \
connu."""
style = """
Hooke n'était pas un artiste de métier, mais un dessinateur exceptionnel. Ses \
planches, d'une précision et d'une ampleur jamais vues, montrent l'invisible avec les \
moyens de la gravure d'art : grand format, modelé rigoureux, lumière maîtrisée. \
Micrographia a fondé l'illustration scientifique au microscope, et ses images, la puce \
et le pou en tête, n'ont cessé d'être copiées et reproduites jusqu'à aujourd'hui."""
