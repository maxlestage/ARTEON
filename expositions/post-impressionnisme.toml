[[oeuvres]]
titre = "Madeleine au Bois d'Amour"
artiste = "Émile Bernard"
annee = "1888"
image = "madeleine-bois-d-amour.jpg"
technique = "Huile sur toile, 138 × 163 cm"
collection = "Musée d'Orsay, Paris"
note = "Sa sœur de dix-sept ans, allongée dans le bois de Pont-Aven, rêveuse comme une gisante."
description = """
Une jeune fille aux cheveux roux est étendue de tout son long au bas de la toile, sur \
l'herbe semée de petites fleurs blanches. Elle porte une longue robe bleu-gris, a \
glissé une main sous sa tête et posé l'autre sur sa poitrine ; les yeux ouverts, elle \
regarde dans le vide. Derrière elle se dresse un bois clairsemé : des troncs minces et \
sombres, verticaux, plantés sur un sol rose et mauve. Plus loin, entre les arbres, \
brillent les reflets pâles de la rivière, et le feuillage vert ferme le haut du \
tableau. En bas à gauche, le peintre a signé et daté son œuvre."""
evocation = """
Madeleine Bernard, sœur cadette du peintre, est pour lui une muse, et il la représente \
comme une figure idéale plutôt que comme une jeune fille réelle. Allongée, immobile, \
le regard perdu, elle fait penser à une gisante sculptée sur un tombeau médiéval, ou à \
une héroïne de légende endormie dans un bois enchanté. On y a lu le goût de Bernard \
pour la spiritualité et le symbolisme : la jeune fille semble en communion avec la \
nature, absorbée dans un rêve intérieur. Le nom même du lieu, le Bois d'Amour, ajoute \
une note de romance. Le tableau prend une résonance mélancolique quand on sait que \
Madeleine mourra très jeune, avant vingt-cinq ans."""
histoire = """
Émile Bernard arrive à Pont-Aven en août 1888, avec sa mère et Madeleine, alors âgée \
de dix-sept ans, et y retrouve Paul Gauguin. Cet été-là, les deux peintres échangent \
intensément : Bernard peint ses Bretonnes dans la prairie, Gauguin sa Vision après le \
sermon, et naît ce qu'on appellera le synthétisme. Madeleine fascine le petit groupe \
d'artistes ; elle se fiancera plus tard au peintre Charles Laval, ami de Gauguin. Tous \
deux partiront en Égypte, où Laval meurt en 1894 et Madeleine l'année suivante, de la \
tuberculose. Le tableau appartient aujourd'hui au musée d'Orsay."""
facture = """
La composition oppose la longue horizontale du corps aux verticales régulières des \
troncs, comme une portée de musique. Bernard simplifie les formes et pose les couleurs \
en larges zones : le bleu de la robe, le rose du sol, le vert de l'herbe et du \
feuillage. La touche, faite de petites hachures parallèles, reste visible, plus souple \
que les aplats cernés de noir de ses Bretonnes de la même année. La gamme douce et un \
peu sourde renforce l'atmosphère de rêverie."""
details = [
  "La main glissée sous la tête, geste de rêverie.",
  "Les troncs minces qui rythment le fond comme des barreaux.",
  "Les reflets clairs de la rivière, entre les arbres.",
  "Les petites fleurs blanches semées dans l'herbe, au premier plan.",
]
themes = ["portrait", "rêverie", "bretagne", "forêt", "symbolisme"]
anecdote = """
Le Bois d'Amour, où Madeleine pose cet été-là, est aussi le lieu où, quelques semaines \
plus tard, Sérusier peint le Talisman sous la direction de Gauguin : les deux œuvres, \
exposées ici côte à côte, sont nées au bord de la même rivière, l'Aven."""
salle = 3
mur = "nord"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "Crépuscule (La Partie de croquet)"
artiste = "Pierre Bonnard"
annee = "1892"
image = "partie-de-croquet.jpg"
technique = "Huile sur toile, 130,5 × 162,5 cm"
collection = "Musée d'Orsay, Paris"
note = "Une fin de journée en famille dans le Dauphiné, transformée en tapisserie de motifs et de silhouettes."
description = """
Le soir tombe sur un jardin. Au premier plan, une masse de feuillages sombres occupe \
le bas du tableau. Au milieu, quelques joueurs de croquet se tiennent immobiles : à \
gauche, un homme en veste claire et chapeau de paille ; au centre, une femme en robe \
vert pâle à motifs, appuyée sur son maillet, près d'un chien blanc ; à côté, une autre \
femme, vue de dos, dans une robe à grands carreaux sombres qui se confond avec \
l'ombre. À droite, sur la pelouse encore éclairée, une ronde de jeunes filles en robes \
claires danse dans la lumière dorée. En haut, sous un rideau de feuilles, le ciel du \
couchant s'embrase de nuages orange. Le petit arceau du jeu est planté dans l'herbe."""
evocation = """
Bonnard part d'un moment banal, une partie de croquet en famille, et en fait une image \
de rêve. Les joueurs, dont on reconnaît d'ordinaire le père et la sœur du peintre, \
semblent figés dans le soir, tandis que la ronde lumineuse de droite paraît venir d'un \
autre monde, comme une danse de nymphes ou un souvenir d'enfance. On y a vu le passage \
du jour à la nuit, du réel à l'imaginaire. Le tableau dit aussi le goût des Nabis pour \
la vie intime et familiale, à l'écart des grands sujets, et leur volonté de faire de \
la peinture une surface décorative, comme un paravent ou une tapisserie."""
histoire = """
Bonnard peint la toile au Grand-Lemps, dans l'Isère, où sa famille possède une \
propriété et où il passe ses étés. Il a alors vingt-cinq ans et vient de renoncer à \
une carrière de juriste : en 1891, son affiche France-Champagne, placardée dans Paris, \
l'a fait remarquer, et il partage un atelier rue Pigalle avec Vuillard, Maurice Denis \
et l'homme de théâtre Lugné-Poe. Membre du groupe des Nabis depuis 1889, il cherche \
une peinture nouvelle, nourrie de l'exemple de Gauguin et des estampes japonaises. Ce \
grand tableau est l'une de ses premières compositions ambitieuses. Il est aujourd'hui \
au musée d'Orsay, qui conserve un riche ensemble d'œuvres nabies."""
facture = """
Bonnard aplatit l'espace : pas de perspective nette, des plans superposés comme des \
décors de théâtre. Les tissus deviennent des motifs, les carreaux et les fleurs des \
robes sont traités à plat, à la manière des estampes japonaises qu'il admire. Les \
feuillages forment des arabesques festonnées. Les contrastes de lumière, ombre épaisse \
à gauche et vert éclatant à droite, structurent la toile. Les figures sont des \
silhouettes sans modelé, presque découpées."""
details = [
  "La robe à carreaux de la femme vue de dos, traitée comme un motif plat.",
  "La ronde de jeunes filles, à droite, dans la lumière dorée.",
  "Le petit arceau de croquet planté dans l'herbe.",
  "Les nuages orange du couchant, en haut à droite.",
  "La signature et la date, en haut à gauche.",
]
themes = ["famille", "jardin", "crépuscule", "japonisme", "nabis"]
anecdote = """
Ses amis nabis le surnommaient « le Nabi très japonard ». En 1890, la grande \
exposition d'estampes japonaises de l'École des beaux-arts l'avait bouleversé : il y \
découvre qu'on peut suggérer l'espace sans perspective, avec des aplats et des motifs."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Intérieur, mère et sœur de l'artiste"
artiste = "Édouard Vuillard"
annee = "1893"
image = "mere-et-soeur.jpg"
technique = "Huile sur toile, 46,3 × 56,5 cm"
collection = "Museum of Modern Art, New York"
note = "La mère, massive et calme ; la sœur, comme aspirée par le papier peint : un huis clos familial."
description = """
Dans une petite pièce encombrée, la mère du peintre est assise bien droite sur une \
chaise, au centre, vêtue d'une robe noire qui forme une masse compacte ; ses mains \
reposent sur ses genoux et elle regarde vers nous. À gauche, sa fille Marie, dans une \
robe à carreaux, se tient pliée en deux, maladroitement, le dos courbé contre le mur : \
sa robe se confond presque avec le papier peint couvert de taches brunes et claires. \
Derrière la mère, un meuble rouge-brun ; au bord droit, une petite table où sont posés \
une assiette et un linge blanc. Le plancher ocre monte en pente raide vers le fond."""
evocation = """
Sous son apparence de scène quotidienne, le tableau exprime une tension. La mère, \
solide et immobile, occupe la place centrale ; la fille, rejetée sur le côté, semble \
écrasée, comme si la pièce la repoussait. On y a lu les rapports de force d'une \
famille repliée sur elle-même, et un écho de l'année 1893, où Marie épouse Ker-Xavier \
Roussel, l'ami de Vuillard. Le peintre, qui vivra toujours auprès de sa mère, observe \
ses proches avec tendresse mais sans fard. C'est l'intimisme selon Vuillard : de \
petits intérieurs où les motifs des tissus et des papiers peints racontent autant que \
les visages."""
histoire = """
Après la mort de son père, Vuillard vit à Paris avec sa mère, qui fait vivre la \
famille en tenant un atelier de couture et de corsets dans l'appartement, et avec sa \
sœur Marie. Ce petit monde féminin, les ouvrières, les étoffes, les gestes du travail, \
devient son sujet favori. En 1893, l'année du tableau, Marie épouse le peintre \
Ker-Xavier Roussel, camarade de Vuillard au lycée Condorcet et comme lui membre des \
Nabis. Vuillard expose alors avec ses amis et travaille pour le théâtre de l'Œuvre de \
Lugné-Poe. Le tableau est entré au Museum of Modern Art de New York en 1934."""
facture = """
Vuillard travaille sur un petit format, avec une matière assez sèche et mate. Il \
supprime presque l'espace : le papier peint, la robe à carreaux et le meuble forment \
une mosaïque de motifs où les figures s'enchâssent. Les couleurs sont sourdes, bruns, \
ocres, noirs, réveillées par quelques taches claires. La perspective est \
volontairement faussée, avec un sol qui bascule vers le spectateur, comme dans les \
estampes japonaises, ce qui renforce l'impression d'étouffement."""
details = [
  "La sœur courbée à gauche, sa robe à carreaux presque fondue dans le papier peint.",
  "Les mains de la mère posées à plat sur ses genoux.",
  "Le plancher qui monte en pente raide vers le fond.",
  "L'assiette et le linge blanc sur la petite table, au bord droit.",
]
themes = ["famille", "intérieur", "intimisme", "motif", "nabis"]
anecdote = """
Vuillard a vécu avec sa mère jusqu'à la mort de celle-ci, en 1928 ; il avait alors \
près de soixante ans. Elle apparaît dans des centaines de ses tableaux, de ses dessins \
et de ses photographies."""
salle = 3
mur = "sud"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "La Bohémienne endormie"
artiste = "Henri Rousseau"
annee = "1897"
image = "bohemienne-endormie.jpg"
technique = "Huile sur toile, 129,5 × 200,7 cm"
collection = "Museum of Modern Art, New York"
note = "Dans le désert, sous la lune, un lion flaire une dormeuse sans la dévorer : un rêve suspendu."
description = """
C'est la nuit, dans un désert de sable. Au premier plan, une femme à la peau sombre \
dort étendue sur le sol, vêtue d'une longue robe aux rayures multicolores ; elle tient \
encore un bâton de marche. Près d'elle sont posés une mandoline et une cruche en terre \
cuite. Un lion à l'épaisse crinière se tient au-dessus d'elle, la queue dressée, et la \
flaire sans l'attaquer ; son œil brille. Derrière s'étend une étendue d'eau bordée de \
montagnes roses et grises. Le ciel bleu nuit, immense, occupe presque la moitié de la \
toile ; en haut à droite, une pleine lune au visage humain éclaire la scène, et \
quelques étoiles scintillent."""
evocation = """
Rousseau a lui-même décrit son sujet : une négresse errante, joueuse de mandoline, \
dort profondément, sa cruche à ses côtés ; un lion passe par hasard, la flaire et ne \
la dévore pas, sous un effet de lune très poétique. Le tableau tient tout entier dans \
ce suspens. Rien ne bouge, aucun bruit : la menace et la paix coexistent. On y a vu \
une image du rêve, le lion pouvant être celui que la dormeuse voit en songe, ou une \
fable sur la protection de l'innocence. Les surréalistes ont admiré cette logique de \
rêve, qui rapproche sans explication des éléments étrangers les uns aux autres."""
histoire = """
Rousseau expose la toile au Salon des Indépendants de 1897, où ses œuvres font souvent \
rire le public. Il propose ensuite de la vendre à la ville de Laval, sa ville natale, \
qui refuse. Le tableau disparaît alors pendant plus de vingt-cinq ans. Il réapparaît à \
Paris en 1923, au moment où les avant-gardes découvrent Rousseau et le célèbrent comme \
un précurseur. Il est acheté par le grand collectionneur new-yorkais John Quinn, puis, \
après sa mort, passe en d'autres mains avant d'être offert en 1939 au Museum of Modern \
Art de New York par Mrs. Simon Guggenheim."""
facture = """
Rousseau peint avec une minutie lisse : aucune touche visible, des contours nets, des \
couleurs posées en aplats soigneusement dégradés. La perspective est simple et un peu \
raide, les proportions approximatives, mais la composition est très étudiée : deux \
grandes bandes horizontales, le sol et le ciel, et au centre le lion et la dormeuse \
superposés. Les rayures vives de la robe tranchent sur la gamme nocturne de bleus et \
de bruns. La crinière du lion est rendue mèche par mèche."""
details = [
  "La lune au visage humain, en haut à droite.",
  "La mandoline et la cruche posées à côté de la dormeuse.",
  "Les pieds nus de la femme, sur la gauche, et ses yeux mi-clos.",
  "La queue dressée du lion, tracée en un seul trait contre le ciel.",
  "La signature et la date, en bas à droite.",
]
themes = ["nuit", "désert", "rêve", "lion", "art naïf"]
anecdote = """
Laval n'a pas voulu du tableau en 1897. Aujourd'hui, la ville honore son peintre : le \
Vieux-Château abrite un musée consacré à l'art naïf, et l'on peut encore voir la porte \
Beucheresse, la tour des anciens remparts où il est né."""
salle = 5
mur = "est"
place = 2
largeur = 2.0

[[oeuvres]]
titre = "Le Rêve"
artiste = "Henri Rousseau"
annee = "1910"
image = "le-reve.jpg"
technique = "Huile sur toile, 204,5 × 298,5 cm"
collection = "Museum of Modern Art, New York"
note = "Sa dernière grande toile : une femme nue sur un canapé, transportée en rêve au cœur d'une jungle."
description = """
À gauche, une femme nue aux longs cheveux sombres est allongée sur un canapé de \
velours rouge, le bras tendu vers la forêt. Tout autour s'étend une jungle luxuriante \
: d'immenses fleurs bleues, roses et blanches, des feuilles de toutes les nuances de \
vert, un arbre chargé de fruits orange, des oiseaux et des singes dans les branches. \
Au centre, dans la pénombre, un charmeur à la peau sombre, vêtu d'un pagne rayé, joue \
de la flûte. Deux lions aux yeux ronds regardent à travers les herbes ; derrière les \
feuillages se cache une tête d'éléphant, et un serpent orangé glisse dans l'herbe à \
droite. En haut, une pleine lune brille dans un ciel clair."""
evocation = """
Rousseau a donné la clé du tableau : la femme endormie sur son canapé rêve qu'elle est \
transportée dans cette forêt et entend la musique du charmeur. Il l'accompagne d'un \
petit poème où la dormeuse porte le nom de Yadwigha. Le meuble de salon perdu en \
pleine jungle rapproche deux mondes, le quotidien parisien et l'exotisme imaginaire, \
comme le fait le rêve. On y a vu une célébration de la sensualité et de l'imagination, \
et une préfiguration du surréalisme, qui fera du rêve une source d'images. Les fauves \
aux yeux écarquillés, plus étonnés que féroces, donnent à la scène une étrangeté \
calme, entre paradis et menace."""
histoire = """
Rousseau présente Le Rêve au Salon des Indépendants en mars 1910, accompagné de son \
poème. Cette fois, il n'est plus seulement moqué : depuis quelques années, Picasso, \
Apollinaire, Delaunay et toute une jeune génération l'admirent, et Apollinaire salue \
le tableau dans la presse. C'est sa dernière grande œuvre : Rousseau meurt quelques \
mois plus tard, en septembre 1910, à l'hôpital Necker, d'une blessure à la jambe mal \
soignée. Le marchand Ambroise Vollard acquiert la toile, qui passe ensuite dans \
plusieurs collections avant d'être offerte en 1954 au Museum of Modern Art de New York \
par Nelson A. Rockefeller."""
facture = """
Rousseau construit sa jungle comme un décor de théâtre, par plans superposés de \
feuillages découpés un à un. Chaque feuille est cernée, peinte à plat, dans une gamme \
de verts d'une variété étonnante. Il n'a jamais vu de forêt tropicale : il dessine les \
plantes des serres du Jardin des Plantes à Paris et copie des animaux dans des albums \
illustrés. Les figures ont la raideur des images populaires, mais l'ensemble est d'une \
précision et d'une richesse décoratives qui fascinaient les peintres modernes."""
details = [
  "Le canapé rouge, meuble de salon parisien égaré dans la jungle.",
  "Le charmeur à la flûte, presque invisible dans l'ombre, au centre.",
  "Les deux lions aux yeux ronds qui fixent le spectateur.",
  "La tête d'éléphant à demi cachée dans les feuillages, à gauche du charmeur.",
  "Le serpent orangé qui glisse dans l'herbe, à droite.",
]
themes = ["jungle", "rêve", "nu", "exotisme", "art naïf"]
anecdote = """
On a longtemps raconté que Rousseau avait vu les forêts du Mexique pendant son service \
militaire. C'est une légende, peut-être entretenue par lui-même : il n'a jamais quitté \
la France, et ses jungles sont nées dans les serres du Jardin des Plantes."""
salle = 5
mur = "nord"
place = 2
largeur = 3.0

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Georges Seurat"
vie = "Paris, 2 décembre 1859 – Paris, 29 mars 1891"
biographie = """
Fils d'une famille parisienne aisée, Georges Seurat entre en 1878 à l'École des \
beaux-arts, dans l'atelier d'Henri Lehmann, élève d'Ingres. Il y apprend le dessin \
classique, mais lit surtout les savants de la couleur, Chevreul et Ogden Rood, et le \
critique Charles Blanc. Après son service militaire à Brest, il se consacre à de \
puissants dessins au crayon Conté, tout en ombres veloutées. En 1884, sa grande toile \
Une baignade, Asnières est refusée au Salon : il l'expose avec d'autres refusés et \
participe à la fondation de la Société des artistes indépendants, où il rencontre Paul \
Signac. La Grande Jatte, montrée en 1886, fait de lui le chef de file d'un mouvement \
nouveau, le néo-impressionnisme, auquel se rallient un temps Pissarro et de jeunes \
peintres français et belges. Discret, méthodique, il peint ensuite les Poseuses, \
Parade de cirque, le Chahut, et passe ses étés sur les côtes de la Manche. Il meurt \
brutalement en mars 1891, à trente et un ans, alors que le Cirque, inachevé, est \
exposé aux Indépendants. Sa famille découvre alors qu'il vivait avec une jeune femme, \
Madeleine Knobloch, dont il avait un fils."""
style = """
Seurat invente une peinture fondée sur la science : de petits points de couleurs \
pures, juxtaposés selon les lois des contrastes, que l'œil du spectateur mélange à \
distance. Ses compositions, très construites, figent la vie moderne dans une \
immobilité solennelle. Sa méthode, poursuivie par Signac, a nourri le fauvisme de \
Matisse, le cubisme et l'abstraction, qui ont retenu sa leçon : un tableau est un \
assemblage réfléchi de couleurs et de lignes."""

[[artistes]]
nom = "Paul Signac"
vie = "Paris, 11 novembre 1863 – Paris, 15 août 1935"
biographie = """
Né dans une famille de commerçants parisiens, Paul Signac abandonne ses études \
d'architecture pour la peinture après avoir découvert Monet. Presque autodidacte, il \
participe en 1884 à la fondation de la Société des artistes indépendants, où il se lie \
à Georges Seurat ; il adopte aussitôt sa méthode de la couleur divisée et devient son \
plus fidèle allié. Après la mort de Seurat en 1891, c'est lui qui défend et fait vivre \
le néo-impressionnisme. Marin passionné, il navigue sur de nombreux voiliers et \
découvre en 1892 le petit port de Saint-Tropez, où il s'installe une partie de \
l'année. En 1899, il publie D'Eugène Delacroix au néo-impressionnisme, qui expose la \
théorie du mouvement. Il accueille Matisse à Saint-Tropez en 1904 et influence \
directement les débuts du fauvisme. Proche des milieux anarchistes, il donne des \
dessins à leurs journaux. Longtemps président de la Société des artistes indépendants, \
à partir de 1908, il peint aussi d'innombrables aquarelles de ports, de Marseille à \
Venise et à Constantinople. Il meurt à Paris en 1935."""
style = """
Signac élargit le point de Seurat en touches carrées, plus grandes et plus libres, \
posées comme les tesselles d'une mosaïque. Ses couleurs deviennent de plus en plus \
éclatantes et décoratives. Ses ports et ses marines, baignés de lumière \
méditerranéenne, et ses aquarelles rapides montrent un peintre plus lyrique que \
théoricien. Par son livre et par son exemple, il a transmis la couleur pure aux \
fauves."""

[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi, 24 novembre 1864 – château de Malromé (Gironde), 9 septembre 1901"
biographie = """
Henri de Toulouse-Lautrec naît dans une vieille famille aristocratique du Midi ; ses \
parents sont cousins germains. Adolescent, il se brise les deux jambes en 1878 et 1879 \
: elles cessent de grandir, sans doute à cause d'une maladie osseuse héréditaire. \
Écarté de la vie de château, il se consacre au dessin, se forme auprès de Princeteau, \
puis à Paris chez Bonnat et dans l'atelier de Cormon, où il fréquente Émile Bernard, \
Louis Anquetin et Vincent van Gogh. Installé à Montmartre, il peint ses cabarets, ses \
bals et ses artistes : Aristide Bruant, La Goulue, Jane Avril, Yvette Guilbert. Son \
affiche pour le Moulin Rouge, en 1891, le rend célèbre ; il en dessine une trentaine, \
et des centaines de lithographies. Il observe aussi, sans jugement, la vie des maisons \
closes. Miné par l'alcool, il est interné en 1899 dans une clinique de Neuilly, où il \
dessine de mémoire une série sur le cirque pour prouver sa lucidité. Il meurt à \
trente-six ans au château de Malromé, chez sa mère. Celle-ci et son ami Maurice Joyant \
offrent ses œuvres à Albi, où le musée Toulouse-Lautrec ouvre en 1922."""
style = """
Lautrec est d'abord un dessinateur : une ligne rapide, nerveuse, qui saisit une \
attitude, un tic, un visage en quelques traits. Il emprunte à Degas et aux estampes \
japonaises les cadrages coupés et les vues plongeantes, et peint souvent à l'essence, \
sur carton, en touches hachées. Ses affiches, aux aplats francs et au lettrage \
intégré, ont fondé l'affiche moderne et inspiré des générations de graphistes."""

[[artistes]]
nom = "Paul Sérusier"
vie = "Paris, 9 novembre 1864 – Morlaix, 7 octobre 1927"
biographie = """
Fils d'une famille parisienne aisée, Paul Sérusier fait de solides études au lycée \
Condorcet avant d'entrer à l'Académie Julian, dont il devient le massier, l'élève \
chargé de représenter les autres. À l'été 1888, à Pont-Aven, il rencontre Paul \
Gauguin, qui lui fait peindre le petit paysage du Bois d'Amour qu'on appellera le \
Talisman. À son retour, il fonde avec Maurice Denis, Pierre Bonnard, Paul Ranson et \
Henri-Gabriel Ibels le groupe des Nabis, d'un mot hébreu qui signifie prophètes, \
suggéré par le poète Henri Cazalis. En 1889 et 1890, il rejoint Gauguin au Pouldu. \
Curieux de philosophie et de théosophie, il se lie au peintre hollandais Jan Verkade \
et découvre avec lui, à l'abbaye bénédictine de Beuron, en Allemagne, une théorie des \
proportions sacrées. Il s'installe peu à peu en Bretagne, à Châteauneuf-du-Faou, où il \
peint paysans et légendes. Il enseigne à l'Académie Ranson et publie en 1921 un petit \
traité, l'ABC de la peinture. Il meurt à Morlaix en 1927."""
style = """
Sérusier est le théoricien des Nabis : il traduit en principes la leçon de Gauguin, \
couleurs pures, formes simplifiées, refus de l'imitation. Ses toiles bretonnes \
associent aplats décoratifs et figures stylisées, d'une gravité presque religieuse. \
Plus tard, il cherche dans la géométrie et les nombres une harmonie universelle. Son \
Talisman reste une étape décisive vers la peinture non figurative."""

[[artistes]]
nom = "Émile Bernard"
vie = "Lille, 28 avril 1868 – Paris, 16 avril 1941"
biographie = """
Né à Lille, Émile Bernard arrive enfant à Paris et entre à seize ans dans l'atelier de \
Fernand Cormon, où il se lie à Toulouse-Lautrec, à Louis Anquetin et à Vincent van \
Gogh ; il en est renvoyé en 1886 pour insubordination. Il part alors à pied en \
Normandie et en Bretagne. Avec Anquetin, il met au point en 1887 le cloisonnisme, des \
aplats de couleur cernés de traits sombres comme les vitraux. En 1888, à Pont-Aven, il \
peint les Bretonnes dans la prairie et échange avec Gauguin les idées d'où naît le \
synthétisme ; en 1889, ils exposent ensemble au café Volpini, en marge de l'Exposition \
universelle. Bernard se brouille ensuite avec Gauguin, à qui il reproche d'avoir \
confisqué l'invention. Très croyant, il se tourne vers la peinture religieuse, voyage \
en Italie, puis vit une dizaine d'années en Égypte, au Caire. Revenu en France, il \
rend visite à Cézanne à Aix en 1904 et publie leurs conversations ; il publie aussi \
les lettres que Van Gogh lui avait adressées. Il défend dès lors un retour à la \
tradition des maîtres anciens et meurt à Paris en 1941."""
style = """
Dans ses années décisives, de 1887 à 1891, Bernard simplifie radicalement la peinture \
: grandes zones de couleur pure, contours sombres, perspective abolie, influences des \
vitraux, des estampes japonaises et de l'imagerie populaire. Ce langage, partagé avec \
Gauguin, a ouvert la voie aux Nabis et au symbolisme. Sa peinture plus tardive, plus \
classique, est restée dans l'ombre de ses débuts."""

[[artistes]]
nom = "Pierre Bonnard"
vie = "Fontenay-aux-Roses, 3 octobre 1867 – Le Cannet, 23 janvier 1947"
biographie = """
Fils d'un haut fonctionnaire du ministère de la Guerre, Pierre Bonnard passe sa \
licence de droit pour rassurer son père, tout en fréquentant l'Académie Julian, où il \
rencontre Sérusier, Maurice Denis et Ranson, puis l'École des beaux-arts, où il se lie \
à Vuillard. Il rejoint les Nabis, et son affiche France-Champagne, en 1891, lui permet \
de se consacrer à l'art. Il dessine pour La Revue blanche, illustre des livres pour le \
marchand Ambroise Vollard, travaille pour le théâtre et réalise paravents et \
lithographies. En 1893, il rencontre Marthe, de son vrai nom Maria Boursin, qui sera \
le modèle de toute sa vie et qu'il épouse en 1925. Après 1900, sa palette s'éclaircit \
: il peint la Seine à Vernon, non loin de Monet à Giverny, puis la lumière du Midi. En \
1926, il achète une villa au Cannet, au-dessus de Cannes, où il travaille jusqu'à sa \
mort, en 1947. Discret, peu théoricien, il retouchait sans cesse ses toiles, même \
accrochées."""
style = """
Jeune Nabi, Bonnard compose des surfaces décoratives inspirées des estampes japonaises \
: aplats, motifs de tissus, cadrages audacieux, humour. Il devient ensuite un immense \
coloriste, peignant de mémoire des intérieurs, des jardins et des nus baignés d'une \
lumière vibrante. Sa liberté dans la couleur et dans la composition a beaucoup compté \
pour la peinture du XXᵉ siècle."""

[[artistes]]
nom = "Édouard Vuillard"
vie = "Cuiseaux (Saône-et-Loire), 11 novembre 1868 – La Baule, 21 juin 1940"
biographie = """
Fils d'un officier retraité, Édouard Vuillard s'installe enfant à Paris avec sa \
famille. Au lycée Condorcet, il se lie à Ker-Xavier Roussel, Maurice Denis et Aurélien \
Lugné-Poe, puis rejoint à l'Académie Julian le groupe des Nabis. Après la mort de son \
père, sa mère tient un atelier de couture dans l'appartement familial : ces \
intérieurs, ces femmes au travail et ces étoffes deviennent ses premiers sujets. Il \
dessine décors et programmes pour le théâtre de l'Œuvre de Lugné-Poe et fréquente les \
frères Natanson, fondateurs de La Revue blanche, et Misia, l'épouse de l'un d'eux. Il \
peint de grands panneaux décoratifs, comme les Jardins publics commandés en 1894 par \
Alexandre Natanson. Plus tard, il devient un portraitiste recherché de la bonne \
société parisienne, souvent saisie chez elle, dans son décor. Il vit avec sa mère \
jusqu'à la mort de celle-ci, en 1928, et entre à l'Académie des beaux-arts en 1937. Il \
meurt à La Baule en juin 1940, pendant l'exode."""
style = """
Vuillard est le peintre de l'intimité. Dans de petits formats aux couleurs sourdes, il \
mêle figures, papiers peints et tissus en une mosaïque de motifs où l'espace se perd. \
Ses scènes silencieuses suggèrent les sentiments plus qu'elles ne les montrent. Dans \
ses grands décors, il retrouve la douceur mate de la tapisserie, grâce à la peinture à \
la colle."""

[[artistes]]
nom = "Henri Rousseau"
vie = "Laval, 21 mai 1844 – Paris, 2 septembre 1910"
biographie = """
Fils d'un ferblantier de Laval, Henri Rousseau devient clerc chez un avoué, puis \
s'engage dans l'armée. En 1871, il entre à l'octroi de Paris, l'administration qui \
perçoit les taxes sur les marchandises entrant dans la ville : de là vient son surnom \
de Douanier, bien qu'il n'ait jamais été douanier. Il peint en autodidacte pendant ses \
loisirs et expose à partir de 1886 au Salon des Indépendants, ouvert à tous, sans \
jury. Le public et la critique se moquent de ses toiles, qu'il continue d'envoyer \
chaque année. En 1893, il prend sa retraite pour se consacrer à la peinture, donne des \
leçons de violon et de dessin et vit pauvrement. Il se lie avec Alfred Jarry, lui \
aussi né à Laval, puis avec Apollinaire, Robert Delaunay et Picasso, qui organise en \
1908 un banquet en son honneur au Bateau-Lavoir. Après Surpris !, sa première jungle, \
en 1891, il en peint une vingtaine à partir de 1904. Il meurt en septembre 1910 à \
l'hôpital Necker, peu après avoir exposé Le Rêve."""
style = """
Rousseau peint sans formation académique, avec une application minutieuse : contours \
nets, couleurs lisses, perspective naïve, figures frontales. Ses jungles, inventées à \
partir des serres parisiennes et d'images d'albums, ont une étrangeté de rêve. Admiré \
par Picasso, Apollinaire puis les surréalistes, il a ouvert la voie à la \
reconnaissance de l'art naïf."""
