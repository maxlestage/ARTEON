[exposition]
ordre = 130
nom_court = "Post-impressionnisme"
mouvement = "Néo-impressionnisme, Nabis et art naïf"
cadre = "blanc"
couleur = "#2f6b5a"
titre = "Après l'impressionnisme, points, aplats et rêves"
artiste = "Seurat, Signac, Toulouse-Lautrec, le Douanier Rousseau, les Nabis…"
dates = "1884–1910"
accroche = "Exposition virtuelle · Art Institute of Chicago"
introduction = """
Après 1884, de jeunes peintres veulent dépasser l'impressionnisme : Seurat et Signac \
décomposent la couleur en points, Toulouse-Lautrec saisit la nuit de Montmartre, \
Sérusier, Bonnard et Vuillard, les Nabis, posent des aplats et des motifs comme sur \
une estampe japonaise, et le Douanier Rousseau peint des rêves de jungle. Dix œuvres, \
de la Grande Jatte au Rêve. Le bâtiment s'inspire de l'Art Institute of Chicago : on \
entre par le grand escalier, la Grande Jatte attend seule au fond de la galerie 240, \
et le Douanier Rousseau occupe une salle blanche et lumineuse comme celles de la \
Modern Wing."""
vitrine = "grande-jatte.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Art Institute of Chicago"
ville = "Chicago, États-Unis"
architecte = "Shepley, Rutan and Coolidge"
construction = "1892–1893"
presentation = """
Fondé en 1879 comme école et musée, l'Art Institute s'installe en 1893 dans un palais de \
style Beaux-Arts élevé sur Michigan Avenue, en bordure de Grant Park, par l'agence \
bostonienne Shepley, Rutan and Coolidge : l'édifice a d'abord accueilli les congrès de \
l'Exposition universelle de 1893. Deux lions de bronze d'Edward Kemeys gardent son \
entrée depuis 1894. À l'intérieur, un grand escalier de pierre mène aux galeries de \
l'étage, où se trouve l'un des plus riches ensembles impressionnistes et \
postimpressionnistes hors de France, avec la Grande Jatte de Seurat, acquise en 1926, et \
la Chambre de Van Gogh. En 2009, le musée s'agrandit de la Modern Wing de Renzo Piano, \
aux galeries blanches éclairées par un toit qui tamise la lumière du jour. C'est \
aujourd'hui l'un des plus grands musées d'art des États-Unis."""
ici = """
ARTEON en garde la grande scansion. Le grand escalier, un hall de pierre claire haut de \
12 mètres, accueille le visiteur par le sud et dessert trois salles. Au nord, la \
Galerie 240 · Le point garde la Grande Jatte seule au milieu de son mur du fond. À \
l'ouest, Pont-Aven et les Nabis ; à l'est, Les nuits de Montmartre, dont la porte nord \
ouvre sur la dernière salle, Le Douanier Rousseau : la plus blanche et, avec 7 mètres \
sous plafond, la plus haute des galeries, comme dans la Modern Wing. Les autres salles \
mesurent de 5,5 à 6 mètres de haut."""

