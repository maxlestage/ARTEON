# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Un dimanche après-midi à l'île de la Grande Jatte"
artiste = "Georges Seurat"
annee = "1884–1886"
image = "grande-jatte.jpg"
technique = "Huile sur toile, 207,5 × 308,1 cm"
collection = "Art Institute of Chicago"
note = "Deux ans de travail et des dizaines d'études pour une promenade du dimanche figée comme une frise : le manifeste du néo-impressionnisme."
description = """
Sur une île de la Seine, aux portes de Paris, des promeneurs profitent d'un dimanche \
d'été au bord de l'eau. À droite, au premier plan, un couple se tient de profil : la \
femme, en robe à tournure et ombrelle, tient en laisse un petit singe ; l'homme porte \
haut-de-forme et canne. À gauche, un canotier en maillot sans manches fume la pipe, \
allongé dans l'herbe près d'un monsieur en chapeau haut et d'une femme assise. Au \
centre, une mère et sa fillette en blanc marchent vers nous. Ailleurs, des silhouettes \
immobiles : une pêcheuse au bord de l'eau, deux soldats, un trompettiste, une enfant \
qui court. Sur le fleuve glissent des voiliers, une yole et un bateau à vapeur, tandis \
que les ombres des arbres zèbrent la pelouse."""
evocation = """
Seurat peint un loisir moderne où se croisent toutes les classes : bourgeois, \
canotiers, soldats, nourrices. Mais rien ne bouge. Les personnages, raides et \
solennels, souvent vus de profil, semblent sortis d'une frise antique ; un ami du \
peintre rapporte qu'il voulait faire défiler les gens d'aujourd'hui comme sur les \
frises du Parthénon. Les historiens y ont lu des messages différents : une satire \
discrète de la bourgeoisie du dimanche, où la femme au singe passerait pour une femme \
entretenue et la pêcheuse pour un jeu de mots sur le péché ; une image de la solitude \
dans la foule, chacun isolé dans sa bulle ; ou au contraire, pour ses amis \
anarchistes, la promesse d'une société harmonieuse. Cette ambiguïté fait sa force."""
histoire = """
Seurat commence la toile en 1884, après Une baignade, Asnières, qui montrait des \
ouvriers sur l'autre rive. Pendant deux ans, il va sur l'île observer les promeneurs \
et accumule petites études peintes sur bois et dessins au crayon Conté, puis compose \
le tableau à l'atelier. En 1885, il le reprend entièrement avec sa nouvelle technique \
de points. Montré en mai 1886 à la huitième et dernière exposition impressionniste, il \
fait rire et scandalise ; le critique Félix Fénéon le défend et forge le mot de \
néo-impressionnisme. Exposé ensuite aux Indépendants, puis à Bruxelles en 1887, il est \
acheté en 1924 par le collectionneur de Chicago Frederic Clay Bartlett, qui l'offre à \
l'Art Institute en 1926, en mémoire de sa femme Helen."""
facture = """
Sur une première couche posée à larges touches croisées, Seurat juxtapose des petits \
points de couleurs pures, au lieu de les mélanger sur la palette : vus à distance, ils \
se fondent dans l'œil du spectateur. Il applique les lois du contraste simultané de \
Chevreul et les travaux du physicien américain Ogden Rood, posant à côté d'une couleur \
sa complémentaire pour la faire vibrer. La composition est réglée comme une \
architecture, faite de verticales, d'horizontales et de profils parallèles. Vers \
1888-1889, il ajoute une bordure peinte de points sombres pour assurer la transition \
avec le cadre."""
details = [
  "Le petit singe tenu en laisse par la femme à l'ombrelle, à droite.",
  "La fillette en blanc, au centre, qui marche vers le spectateur.",
  "La bordure de points sombres peinte autour de la toile, ajoutée après coup.",
  "Le chien noir qui fouille l'herbe, au premier plan.",
  "Le bateau à vapeur et les voiliers sur la Seine, à l'arrière-plan.",
]
themes = ["loisirs", "dimanche", "seine", "pointillisme", "société"]
anecdote = """
Le tableau a inspiré la comédie musicale Sunday in the Park with George de Stephen \
Sondheim, créée à Broadway en 1984 : on y voit Seurat composer sa toile, et le premier \
acte s'achève sur les acteurs figés dans la pose exacte des personnages."""
salle = 2
mur = "nord"
place = 2
largeur = 3.0

[[oeuvres]]
titre = "Portrait de Félix Fénéon (Opus 217)"
artiste = "Paul Signac"
annee = "1890"
image = "portrait-feneon.jpg"
technique = "Huile sur toile, 73,5 × 92,5 cm"
collection = "Museum of Modern Art, New York"
note = "Le critique qui a baptisé le néo-impressionnisme, une fleur à la main, devant un tourbillon de couleurs."
description = """
Debout à droite, un homme mince se tient de profil, tourné vers la gauche : Félix \
Fénéon, avec sa barbiche taillée en pointe, son manteau orangé, son col blanc et sa \
cravate rouge. Il tient d'une main un haut-de-forme et une canne, et tend de l'autre, \
d'un geste précieux, une petite fleur blanche. Derrière lui, le fond n'est pas une \
pièce mais un décor abstrait qui tourne : un grand disque fait de rayons et de cercles \
de couleurs, des vagues vertes et rouges, des arabesques jaunes, des étoiles sur un \
fond bleu, des boules qui font penser à des planètes. Dans le coin inférieur gauche, \
le numéro « Op. 217 » ; à droite, la signature de Signac."""
evocation = """
Le portrait est à la fois un hommage et un clin d'œil. Fénéon, dandy impassible et \
critique redouté, est présenté comme un magicien ou un dompteur qui fait surgir les \
couleurs. Le décor tournant illustre les idées du savant Charles Henry, ami des \
néo-impressionnistes, pour qui lignes et couleurs agissent sur l'émotion : les lignes \
qui montent égaieraient, celles qui descendent attristeraient. Le titre complet, Sur \
l'émail d'un fond rythmique de mesures et d'angles, de tons et de teintes, portrait de \
M. Félix Fénéon en 1890, et le numéro d'opus, comme pour une partition, rapprochent la \
peinture de la musique. On a aussi reconnu dans le fond un motif inspiré d'une étoffe \
japonaise."""
histoire = """
Signac et Fénéon se connaissent depuis le milieu des années 1880. Employé au ministère \
de la Guerre, Fénéon écrit dans les petites revues ; en 1886, dans sa brochure Les \
Impressionnistes en 1886, il est le premier à analyser la méthode de Seurat et invente \
le terme de néo-impressionnisme. En 1890, Signac lui propose de faire son portrait et \
compose cette toile très élaborée, qu'il présente aux Indépendants de 1891 sous son \
long titre. Quelques années plus tard, en 1894, Fénéon, sympathisant anarchiste, est \
arrêté et jugé lors du procès des Trente, avant d'être acquitté. Le tableau appartient \
aujourd'hui au Museum of Modern Art de New York."""
facture = """
Signac pousse ici la touche divisée vers le décor. Les points, plus gros et plus \
réguliers que ceux de Seurat, couvrent toute la surface d'un réseau serré. Les \
couleurs jouent sur les complémentaires : le manteau orange se détache sur un bleu \
étoilé, le vert répond au rouge. Le fond ne cherche aucune profondeur : il est plat, \
rythmé par des courbes et des bandes concentriques qui rappellent le cercle \
chromatique de Charles Henry. Le profil net du modèle, presque découpé, contraste avec \
ce tourbillon."""
details = [
  "La petite fleur blanche que Fénéon tend du bout des doigts.",
  "Les étoiles jaunes sur fond bleu, derrière le manteau.",
  "L'inscription « Op. 217 », dans le coin inférieur gauche.",
  "La barbiche en pointe qui prolonge le profil.",
]
themes = ["portrait", "critique d'art", "spirale", "théorie des couleurs", "musique"]
anecdote = """
Fénéon reste célèbre pour ses « nouvelles en trois lignes » : en 1906, il rédige \
anonymement pour le journal Le Matin des faits divers d'une concision féroce, réunis \
bien plus tard en recueil et admirés comme de petits chefs-d'œuvre d'humour noir."""
salle = 2
mur = "est"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Au Moulin Rouge"
artiste = "Henri de Toulouse-Lautrec"
annee = "1892–1895"
image = "au-moulin-rouge.jpg"
technique = "Huile sur toile, 123 × 141 cm"
collection = "Art Institute of Chicago"
note = "Un soir au cabaret : des amis attablés, La Goulue au miroir, et Lautrec lui-même qui passe au fond."
description = """
Une rambarde de bois coupe en diagonale le coin inférieur gauche et nous place au bord \
de la scène. Autour d'une table chargée de verres, un groupe bavarde : des hommes en \
chapeau, dont l'écrivain Édouard Dujardin à la barbe jaune, une femme en chapeau \
fleuri, et, de dos, une danseuse au chignon roux. Au fond, deux hommes traversent la \
salle : un très grand en haut-de-forme et, à côté de lui, un petit homme barbu en \
chapeau melon, Lautrec lui-même avec son cousin Gabriel Tapié de Céleyran. Plus loin, \
La Goulue arrange son chignon devant un miroir. Au bord droit, coupé par le cadre, \
surgit le visage d'une femme éclairé par en dessous d'une lumière verdâtre, comme un \
masque."""
evocation = """
Ce n'est pas la fête endiablée qu'on attend du Moulin Rouge : personne ne danse, les \
visages sont las, chacun semble seul au milieu des autres. Lautrec montre l'envers du \
plaisir nocturne, sa fatigue et sa mélancolie, avec un regard à la fois complice et \
sans complaisance. En se peignant au fond, petit et de passage, il se pose en témoin \
plutôt qu'en acteur. Le visage vert du premier plan, qu'on identifie souvent comme \
celui de la danseuse anglaise May Milton, transforme la scène en vision presque \
inquiétante : sous la lumière artificielle, la peau devient fard et le visage devient \
masque. On y a vu une image de la modernité urbaine, brillante et désenchantée."""
histoire = """
Le Moulin Rouge ouvre en 1889 au pied de Montmartre, place Blanche, et Lautrec en \
devient aussitôt un habitué ; son Écuyère au cirque Fernando est accrochée dans le \
foyer de l'établissement. Il peint cette grande toile au début des années 1890. Le \
tableau a été agrandi d'une bande en équerre, à droite et en bas, celle où apparaît le \
visage vert. Cette bande fut un temps détachée, sans doute pour rendre l'œuvre plus \
facile à vendre, puis remise en place. La toile entre en 1928 à l'Art Institute of \
Chicago, avec la collection constituée par Frederic Clay Bartlett en mémoire de sa \
femme Helen, la même qui y a fait entrer la Grande Jatte."""
facture = """
Lautrec dessine avec le pinceau : longues hachures, contours nerveux, surfaces parfois \
à peine couvertes. Les couleurs sont acides, verts et orangés, ceux de l'éclairage au \
gaz et à l'électricité qui modèle les visages par en dessous. La composition doit \
beaucoup à Degas et aux estampes japonaises : la diagonale de la rambarde, les figures \
coupées par le cadre, le premier plan vide qui fait entrer le spectateur. Le cadrage, \
proche d'un instantané photographique, donne l'impression d'une scène saisie au \
passage."""
details = [
  "Lautrec en personne, petit et barbu, au fond, à côté de son très grand cousin.",
  "Le visage vert et poudré de la femme coupée par le bord droit.",
  "La Goulue qui arrange son chignon devant un miroir, à l'arrière-plan.",
  "La rambarde en diagonale qui barre le coin inférieur gauche.",
  "Le chignon roux de la femme vue de dos, au centre de la table.",
]
themes = ["cabaret", "nuit", "montmartre", "autoportrait", "lumière artificielle"]
anecdote = """
Lautrec mesurait à peine plus d'un mètre cinquante : deux fractures des jambes, dans \
son adolescence, avaient arrêté leur croissance. Il aimait se montrer avec son cousin \
Gabriel, très grand, et ce duo mal assorti amusait Montmartre comme il amuse ici."""
salle = 4
mur = "est"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Moulin Rouge – La Goulue"
artiste = "Henri de Toulouse-Lautrec"
annee = "1891"
image = "moulin-rouge-la-goulue.jpg"
cadre = "estampe"
technique = "Lithographie en couleurs (affiche), 191 × 117 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Sa première affiche : la danseuse en jupons blancs, et Valentin le Désossé en ombre au premier plan."
description = """
En haut, le nom du cabaret est répété trois fois, en lettres rouges qui partagent un \
même M géant ; à droite s'annoncent Concert, Bal tous les soirs, La Goulue. Au centre, \
la danseuse, chignon blond et corsage rouge à pois blancs, lève la jambe dans un nuage \
de jupons blancs. Derrière elle, les spectateurs ne sont plus qu'une frise de \
silhouettes noires, chapeaux hauts et plumets, sous une rangée de lampes jaunes. Au \
premier plan, coupé par le bord, se dresse le profil gris de son partenaire, Valentin \
le Désossé, haut-de-forme sur la tête et main tendue vers nous. Le plancher file en \
diagonale ; en bas, en grandes lettres, s'annonce le bal masqué des mercredis et \
samedis."""
evocation = """
Avec cette affiche, Lautrec fait entrer l'art dans la rue. Il ne décrit pas le cabaret \
: il en donne le choc, l'énergie et la promesse, celle du quadrille naturaliste, cette \
danse où les jupons volent et laissent voir les dessous. Tout est dit en quelques \
formes : la vedette lumineuse au centre, la foule anonyme réduite à des ombres, et \
Valentin, mi-réel mi-caricature, qui sert de repoussoir. On y a vu l'influence du \
théâtre d'ombres des cabarets de Montmartre, comme celui du Chat Noir. L'affiche dit \
aussi un monde où le spectacle devient marchandise, et où l'artiste accepte de \
travailler pour la publicité sans renoncer à son style."""
histoire = """
Le Moulin Rouge a ouvert en octobre 1889 ; son directeur, Charles Zidler, commande une \
nouvelle affiche à Lautrec en 1891, alors que la réclame du cabaret était jusque là \
confiée à Jules Chéret, le maître du genre. Imprimée par Charles Lévy et collée sur \
les murs de Paris à la fin de l'année, elle rend Lautrec célèbre presque du jour au \
lendemain. C'est sa toute première affiche ; une trentaine d'autres suivront, pour \
Aristide Bruant, Jane Avril ou le Divan japonais. Ses grandes dimensions imposaient de \
l'imprimer en plusieurs feuilles, dont on voit les raccords horizontaux. L'exemplaire \
présenté ici appartient au Metropolitan Museum of Art."""
facture = """
Lautrec dessine ses formes directement sur les pierres lithographiques, une pour \
chaque couleur. Les aplats sont francs et peu nombreux : le noir des silhouettes, le \
jaune des lampes, le rouge des lettres, le gris de Valentin et le blanc du papier qui \
fait les jupons. Le japonisme est partout : contours simples, cadrage coupé, plancher \
en diagonale, absence de modelé. Le lettrage, dessiné à la main, fait partie de la \
composition au même titre que les figures."""
details = [
  "Le M géant qui sert aux trois « Moulin Rouge » du haut.",
  "Le profil gris de Valentin le Désossé, coupé par le bord, au premier plan.",
  "La foule réduite à une frise de silhouettes noires.",
  "Les globes jaunes des lampes, alignés au-dessus des spectateurs.",
  "La signature « HLautrec », en bas à gauche.",
]
themes = ["affiche", "cabaret", "danse", "montmartre", "lithographie"]
anecdote = """
En 1895, La Goulue quitte le Moulin Rouge pour danser dans une baraque de foire. \
Lautrec lui peint deux grands panneaux pour orner l'entrée ; découpés plus tard en \
morceaux par un marchand, ils ont été reconstitués et sont aujourd'hui au musée \
d'Orsay."""
salle = 4
mur = "sud"
place = 2
largeur = 1.17

[[oeuvres]]
titre = "Le Talisman (L'Aven au Bois d'Amour)"
artiste = "Paul Sérusier"
annee = "1888"
image = "le-talisman.jpg"
technique = "Huile sur bois, 27 × 21,5 cm"
collection = "Musée d'Orsay, Paris"
note = "Un paysage grand comme un couvercle de boîte à cigares, peint sous la dictée de Gauguin : l'acte de naissance des Nabis."
description = """
Le petit panneau montre un coin de la rivière Aven, au Bois d'Amour, près de \
Pont-Aven, mais il faut un moment pour le reconnaître. Dans la moitié haute, les \
arbres sont des taches jaunes, vertes et violettes ; une large bande rouge orangé, la \
rive, traverse le tableau en oblique, hérissée de traits verticaux bleu-gris qui \
figurent les troncs. À droite, une maison au toit bleu se devine. La moitié basse est \
le reflet de tout cela dans l'eau : de grandes taches jaunes, violettes et vertes, une \
masse sombre à droite, une zone bleu clair dans le coin. Aucun détail, aucun modelé : \
seulement des surfaces de couleur posées côte à côte."""
evocation = """
Ce minuscule paysage a valeur de révélation : la couleur n'a plus à imiter la nature, \
elle doit traduire ce que l'on ressent devant elle, quitte à l'exagérer. Les amis de \
Sérusier l'ont gardé comme un objet magique, d'où son nom de Talisman. En 1890, \
Maurice Denis tire la leçon de cette découverte dans une phrase devenue célèbre : se \
rappeler qu'un tableau, avant d'être un cheval de bataille, une femme nue ou une \
quelconque anecdote, est essentiellement une surface plane recouverte de couleurs en \
un certain ordre assemblées. On voit souvent dans ce panneau l'un des premiers pas de \
la peinture vers l'abstraction, un quart de siècle avant qu'elle n'y arrive vraiment."""
histoire = """
En octobre 1888, Paul Sérusier, élève de l'Académie Julian à Paris, séjourne à \
Pont-Aven, où Gauguin entraîne un groupe de jeunes peintres. Selon le récit qu'en fera \
Maurice Denis, Gauguin l'emmène au Bois d'Amour et lui demande comment il voit les \
arbres : s'ils lui paraissent jaunes, qu'il mette du jaune, le plus beau ; si l'ombre \
est bleue, du bleu outremer ; si les feuilles sont rouges, du vermillon. De retour à \
Paris, Sérusier montre le panneau à ses camarades, Denis, Bonnard, Ranson, Ibels : ils \
forment le groupe des Nabis. Longtemps conservé par Maurice Denis et sa famille, le \
Talisman est entré au musée d'Orsay en 1985."""
facture = """
Sérusier peint vite, sur le couvercle en bois d'une boîte à cigares, en larges touches \
plates de couleurs presque pures. Il supprime la perspective, les ombres et les \
détails, et réduit chaque élément à une tache dont la couleur est exaltée. On \
reconnaît la leçon du synthétisme de Gauguin et d'Émile Bernard : simplifier, peindre \
de mémoire et selon l'émotion. La touche reste pourtant visible et vivante, et le bois \
apparaît par endroits entre les couleurs."""
details = [
  "La bande rouge orangé de la rive, qui traverse le haut du panneau en oblique.",
  "Les troncs d'arbres réduits à de simples traits bleu-gris verticaux.",
  "La maison au toit bleu, à droite, à peine esquissée.",
  "Les reflets dans l'eau, devenus de grandes taches jaunes, violettes et vertes.",
]
themes = ["paysage", "couleur pure", "bretagne", "abstraction", "nabis"]
anecdote = """
Au dos du panneau, une inscription précise qu'il a été fait en octobre 1888, sous la \
direction de Gauguin, par Sérusier, à Pont-Aven : une sorte de certificat de naissance \
pour le tableau qui allait donner son élan à toute la peinture nabie."""
salle = 3
mur = "nord"
place = 1
