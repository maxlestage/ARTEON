#  EXPOSITION « LES DÉBUTS DE LA PHOTOGRAPHIE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/photographie/). Le nom
#  du fichier donne l'adresse de l'exposition sur le site : /photographie.
