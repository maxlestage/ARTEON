[exposition]
ordre = 115
nom_court = "Photographie"
mouvement = "Les débuts de la photographie"
cadre = "noir"
couleur = "#6b4f35"
titre = "Les débuts de la photographie, l'empreinte de la lumière"
artiste = "Niépce, Daguerre, Talbot, Nadar, Cameron, Le Gray, Muybridge, Atget, Stieglitz…"
dates = "1827–1911"
accroche = "Exposition virtuelle · George Eastman Museum, Rochester"
introduction = """
En moins d'un siècle, la photographie passe de l'expérience de laboratoire à l'art \
moderne : une plaque d'étain exposée des jours entiers, le premier passant saisi sur \
un boulevard de Paris, le négatif sur papier, le portrait, la marine, le mouvement \
décomposé, la rue et, enfin, la couleur. La visite réunit dix pionniers, de Niépce à \
Prokoudine-Gorski, en dix images. Le bâtiment s'inspire du George Eastman Museum de \
Rochester, le plus ancien musée de la photographie, installé dans la maison du \
fondateur de Kodak : un vestibule, un jardin d'hiver au centre et trois salons autour."""
vitrine = "grande-vague.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "George Eastman Museum"
ville = "Rochester, New York, États-Unis"
architecte = "J. Foster Warner"
construction = "1902–1905 (la maison) ; musée ouvert en 1949"
presentation = """
George Eastman, le fondateur de la société Kodak, fait construire de 1902 à 1905, au \
900 East Avenue à Rochester, une vaste demeure néogéorgienne dessinée par l'architecte \
J. Foster Warner : une cinquantaine de pièces sur une structure de béton armé à \
l'épreuve du feu, entourée de jardins, de serres et d'une petite ferme. Derrière la \
façade classique, la maison est d'une modernité rare pour l'époque : générateur \
électrique, téléphone intérieur, ascenseur, aspiration centrale et un grand orgue, \
autour duquel Eastman anime la vie musicale de la ville jusqu'à sa mort en 1932. \
Léguée à l'université de Rochester, la propriété est cédée en 1948 au musée fondé \
l'année précédente, qui ouvre le 9 novembre 1949 dans les anciens salons. C'est le \
plus ancien musée consacré à la photographie. Il conserve plus de 400 000 \
photographies et négatifs, des milliers d'appareils et une grande cinémathèque, que \
l'on découvre au Dryden Theatre. L'historien Beaumont Newhall l'a dirigé de 1958 à \
1971."""
ici = """
Le bâtiment d'ARTEON emprunte à la maison Eastman ses pièces d'habitation aux murs \
clairs et chauds et son jardin d'hiver, placé ici au cœur du plan. On entre par le sud \
dans « Le vestibule », bas de plafond, où attend la première photographie de \
l'histoire. Il ouvre au nord sur « Le jardin d'hiver », une salle carrée de douze \
mètres de côté et de neuf mètres de haut, aux murs vert pâle. À l'ouest s'ouvre la \
salle « Les inventeurs », à l'est « Le portrait », et au nord « Le siècle nouveau », \
où la photographie devient moderne et passe à la couleur."""

