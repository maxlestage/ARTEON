# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Chine, fours de Longquan"
vie = "Région de Longquan, province du Zhejiang (Chine), du Xᵉ au XVIIᵉ siècle"
biographie = """
Longquan est une région de collines boisées du sud-ouest du Zhejiang, riche en argile, \
en bois et en cours d'eau : tout ce qu'il faut à des potiers. On y cuit des grès à \
couverte verte dès l'époque des Song du Nord, dans la lignée des céladons de Yue, \
produits plus au nord de la même province. La production prend son essor au XIIᵉ siècle, \
quand la cour des Song, chassée de Kaifeng par les Jürchen, s'installe à Hangzhou : la \
demande des élites du Sud et du commerce maritime ne cesse de croître. Les potiers \
construisent à flanc de colline des fours dits « dragons », longs tunnels de briques où \
l'on cuit d'un coup des milliers de pièces. Au XIIIᵉ siècle, ils mettent au point les \
couvertes épaisses d'un vert bleuté qui font leur gloire. Sous les Yuan et au début des \
Ming, Longquan fournit encore la cour et exporte massivement, du Japon à l'Égypte et aux \
côtes de l'Afrique de l'Est ; puis le bleu et blanc de Jingdezhen la supplante peu à \
peu. Les archéologues ont repéré dans la région de très nombreux sites de fours."""
style = """
Le céladon de Longquan se reconnaît à ses formes simples et pleines, souvent empruntées \
aux bronzes antiques ou aux objets de culte, et à sa couverte épaisse, d'un vert tendre \
et laiteux, qui rappelle le jade. Le décor, quand il existe, reste sobre : quelques \
cannelures, des pétales gravés, des poissons moulés en relief. Ce goût de la perfection \
discrète a profondément marqué la céramique d'Asie orientale, et les céladons de \
Longquan, conservés comme des trésors au Japon, ont été imités jusqu'en Europe."""

[[artistes]]
nom = "Chine, fours impériaux de Jingdezhen"
vie = "Jingdezhen, province du Jiangxi (Chine), depuis le XIᵉ siècle"
biographie = """
Jingdezhen, ville du nord-est du Jiangxi, doit son nom à l'ère Jingde (1004–1007) de \
l'empereur Song Zhenzong, qui y fit fabriquer de la porcelaine pour le palais. Les \
montagnes voisines fournissent le kaolin et la pierre à porcelaine, les forêts le bois \
des fours, et la rivière permet d'expédier les pièces. Sous les Yuan, les potiers y \
mettent au point le décor bleu de cobalt sous couverte. Dès les débuts de la dynastie \
Ming, des fours impériaux y sont établis : ils travaillent pour la cour selon des \
commandes précises, sous le contrôle de fonctionnaires. Sous les Qing, la manufacture \
connaît un nouvel âge d'or grâce à des directeurs savants comme Tang Ying, en poste sous \
Yongzheng et Qianlong, qui multiplie les inventions techniques. La ville, où \
travaillaient des milliers d'ouvriers spécialisés, exportait aussi dans le monde entier \
: c'est par Jingdezhen que l'Europe a découvert la porcelaine. Le jésuite français \
François-Xavier d'Entrecolles en a décrit les secrets dans deux lettres célèbres, en \
1712 et 1722. Jingdezhen reste aujourd'hui la capitale chinoise de la porcelaine."""
style = """
Les porcelaines impériales de Jingdezhen se distinguent par la perfection de leur pâte, \
blanche et fine, et par la rigueur de leurs décors, souvent tirés de modèles dessinés à \
la cour : dragons, phénix, fleurs et fruits porteurs de vœux. Le bleu de cobalt des \
Ming, puis les émaux de la famille verte et de la famille rose sous les Qing, ont fixé \
pour le monde entier l'image de la porcelaine chinoise. Leurs formes et leurs motifs ont \
été copiés de l'Iran au Japon, et de Delft à Meissen."""

[[artistes]]
nom = "Japon, céramique raku"
vie = "Kyoto (Japon), depuis la fin du XVIᵉ siècle"
biographie = """
La céramique raku naît à Kyoto à l'époque Momoyama, dans le cercle du maître de thé Sen \
no Rikyū (1522–1591). Celui-ci, au service des chefs de guerre Oda Nobunaga puis \
Toyotomi Hideyoshi, mène la cérémonie du thé vers une simplicité extrême, et cherche des \
bols qui répondent à cet idéal. Il les fait faire par Chōjirō, un artisan qui fabriquait \
des tuiles et des figures de terre cuite. Chōjirō façonne à la main, sans tour, des bols \
noirs ou rouges, sobres et graves, cuits un à un. Après sa mort, son atelier se transmet \
de génération en génération dans une famille qui prend le nom de Raku, selon la \
tradition grâce à un sceau offert par Hideyoshi. Au XVIIᵉ siècle, d'autres artistes \
s'approprient la technique, comme Hon'ami Kōetsu, calligraphe et lettré, dont les bols \
comptent parmi les plus admirés. Les maîtres de thé donnent aux bols des noms poétiques \
et les conservent dans des boîtes de bois inscrites, transmises avec leur histoire. La \
famille Raku poursuit aujourd'hui son travail à Kyoto."""
style = """
Le raku se reconnaît à sa terre légère et poreuse, à ses formes modelées à la main, \
irrégulières, et à ses glaçures épaisses, noires ou rouges. Le bol est pensé pour la \
main et pour les lèvres autant que pour l'œil. Cette esthétique du wabi, faite de \
simplicité et d'imperfection acceptée, a nourri toute la céramique japonaise, puis, au \
XXᵉ siècle, celle des potiers occidentaux, de Bernard Leach aux céramistes américains \
qui ont inventé un « raku » à leur manière."""

[[artistes]]
nom = "Pueblo de Zuni"
vie = "Vallée de la rivière Zuni, Nouveau-Mexique (États-Unis)"
biographie = """
Les Zuñis, qui se nomment eux-mêmes A:shiwi, vivent dans la vallée de la rivière Zuni, \
dans l'ouest du Nouveau-Mexique, sur des terres habitées par leurs ancêtres depuis des \
siècles. Comme les autres peuples pueblos, Hopis, Acomas ou Lagunas, ils vivent dans des \
villages de maisons à étages en pierre et en adobe, et cultivent le maïs dans un pays \
sec. En 1540, l'expédition espagnole de Francisco Vásquez de Coronado, en quête des \
légendaires « sept cités de Cibola », atteint leurs villages. Viennent ensuite les \
missionnaires, la révolte des Pueblos de 1680 contre les Espagnols, puis, en 1848, \
l'annexion par les États-Unis. Malgré ces bouleversements, les Zuñis ont conservé leur \
langue, leurs cérémonies et leurs arts : la poterie, la bijouterie d'argent et de \
turquoise, les fétiches sculptés. La céramique, faite par les femmes pour l'eau, le \
grain et les cérémonies, transmet un répertoire de motifs ancien. À la fin du XIXᵉ \
siècle, des savants comme Frank Hamilton Cushing, qui vécut plusieurs années parmi eux, \
et de nombreux collectionneurs ont fait connaître cette poterie bien au-delà du pueblo."""
style = """
La poterie zuñie se reconnaît à son engobe blanc crème, sur lequel la potière peint en \
noir et en rouge brun des décors couvrants : rosaces, formes en escalier, hachures, \
volutes de l'« oiseau de pluie », et parfois des cerfs dont une ligne relie la bouche au \
cœur. Les jarres ont une panse large et un col court. Ce style, toujours vivant, est \
pratiqué aujourd'hui par des potières et des potiers zuñis."""

[[artistes]]
nom = "Maestro Giorgio Andreoli"
vie = "Intra, sur le lac Majeur, vers 1465 – Gubbio, 1553"
biographie = """
Giorgio Andreoli naît vers 1465 à Intra, sur la rive du lac Majeur. Il s'installe avec \
ses frères à Gubbio, petite ville d'Ombrie qui dépend des ducs d'Urbino, et y obtient la \
citoyenneté à la fin du XVᵉ siècle. Il y dirige un atelier de céramique dont la renommée \
tient à une spécialité : le lustre métallique, cette pellicule irisée qui donne aux \
faïences des reflets d'or et de rubis. Son rouge rubis, en particulier, est très réputé. \
L'atelier connaît son apogée entre 1515 et 1540 environ : il lustre ses propres pièces, \
mais aussi des plats peints par d'autres ateliers, notamment à Urbino, qui lui sont \
envoyés pour recevoir ce décor. Beaucoup de pièces portent au revers sa signature \
abrégée, « M° G° », et une date, tracées au lustre. Ses fils, dont Vincenzo, dit Maestro \
Cencio, poursuivent son activité. Les majoliques de Gubbio, déjà recherchées par les \
princes de la Renaissance, ont été passionnément collectionnées au XIXᵉ siècle et \
figurent aujourd'hui dans les plus grands musées."""
style = """
Maestro Giorgio est d'abord un maître du lustre plutôt qu'un peintre de scènes : son art \
consiste à faire chatoyer la surface de la majolique. Ses plats associent les bordures \
d'ornements de la Renaissance, rinceaux, grotesques, trophées, et des sujets \
mythologiques ou bibliques souvent tirés de gravures, rehaussés de reflets dorés et \
rouges. Ce luxe chatoyant, hérité des faïences hispano-mauresques, a fait de Gubbio, \
avec Deruta, le grand centre de la majolique lustrée italienne."""

[[artistes]]
nom = "Faïencerie De Metaale Pot"
vie = "Delft (Provinces-Unies), XVIIᵉ–XVIIIᵉ siècle"
biographie = """
La faïencerie De Metaale Pot, « le Pot de métal », est l'une des nombreuses manufactures \
qui font la célébrité de Delft aux XVIIᵉ et XVIIIᵉ siècles. La ville, au cœur de la \
Hollande, entre La Haye et Rotterdam, est alors prospère : elle abrite l'une des \
chambres de la Compagnie des Indes orientales, dont les navires rapportent d'Asie des \
cargaisons de porcelaine chinoise. Lorsque la guerre qui accompagne la chute des Ming, \
au milieu du XVIIᵉ siècle, désorganise les fours chinois, les arrivages se raréfient : \
les faïenciers de Delft saisissent l'occasion et imitent le bleu et blanc. Beaucoup \
s'installent dans d'anciennes brasseries, nombreuses dans une ville où la bière décline. \
Chaque faïencerie a son enseigne et sa marque : la Hache de porcelaine, la Rose, le \
Paon, la Griffe de porcelaine, le Pot de métal. À la fin du XVIIᵉ siècle, sous la \
direction de Lambertus van Eenhoorn, De Metaale Pot produit des pièces de grand luxe, \
dont des pyramides à fleurs, comme sa rivale De Grieksche A d'Adrianus Kocx, fournisseur \
de la reine Marie II. Au XVIIIᵉ siècle, la concurrence de la porcelaine européenne et de \
la faïence fine anglaise entraîne le déclin de Delft."""
style = """
La faïence de Delft se reconnaît à son émail d'un blanc laiteux et à son décor bleu de \
cobalt, parfois polychrome, d'une grande liberté de pinceau. Ses peintres empruntent à \
la Chine pagodes, personnages et fleurs, qu'ils mêlent à des paysages hollandais, à des \
scènes bibliques et à des armoiries. Ses pièces d'apparat, pyramides, vases à tulipes, \
plaques, se diffusent dans toute l'Europe, et le « bleu de Delft » a été imité de \
Londres à Francfort."""

[[artistes]]
nom = "Johann Joachim Kändler"
vie = "Fischbach (Saxe), 15 juin 1706 – Meissen, 18 mai 1775"
biographie = """
Fils de pasteur, Johann Joachim Kändler naît en 1706 à Fischbach, près de Dresde. Il \
apprend la sculpture auprès de Benjamin Thomae, sculpteur de la cour, et participe au \
décor des palais d'Auguste le Fort, électeur de Saxe et roi de Pologne. Remarqué par le \
prince, il entre en 1731 à la manufacture de porcelaine de Meissen, fondée une vingtaine \
d'années plus tôt, et en devient dès 1733 le maître modeleur. Auguste le Fort lui \
commande d'abord des animaux de grande taille, aigles, paons, singes, pour le Palais \
japonais de Dresde, un défi technique : ces pièces se fendent souvent à la cuisson. \
Kändler comprend que la porcelaine se prête mieux à la petite échelle : il crée des \
figurines, personnages de la comédie italienne, bergers, dames en crinoline, musiciens, \
oiseaux, souvent destinées à orner les tables des festins. Pour le comte de Brühl, il \
conçoit le service aux cygnes, l'œuvre la plus ambitieuse de sa carrière. En plus de \
quarante ans, il modèle un nombre considérable de modèles, et reste au service de la \
manufacture jusqu'à sa mort, à Meissen, en 1775."""
style = """
Kändler pense en sculpteur baroque : ses figures sont en mouvement, saisies dans un \
geste, une torsion, un regard échangé, et ses reliefs, comme ceux du service aux cygnes, \
transforment les objets usuels en sculptures. Il a imposé la porcelaine comme un art à \
part entière en Europe, et ses figurines, copiées par toutes les manufactures, de \
Chelsea à Nymphenburg, ont fixé pour longtemps le genre de la statuette de porcelaine."""

[[artistes]]
nom = "Manufacture de Sèvres"
vie = "Vincennes, vers 1740 – Sèvres, depuis 1756"
biographie = """
La manufacture naît vers 1740 au château de Vincennes, où des ouvriers venus de la \
manufacture de Chantilly tentent de percer le secret de la porcelaine. Soutenue par des \
financiers, puis par Louis XV et Madame de Pompadour, elle déménage en 1756 à Sèvres, \
près du château de Bellevue qui appartient à la marquise. En 1759, le roi la rachète : \
elle devient manufacture royale, et ses pièces servent de cadeaux diplomatiques dans \
toute l'Europe. Elle s'entoure d'artistes : l'orfèvre Jean-Claude Duplessis dessine les \
formes, le sculpteur Étienne Maurice Falconet dirige l'atelier de sculpture, François \
Boucher fournit des modèles. À partir de 1770, elle produit aussi de la porcelaine dure, \
grâce au kaolin découvert près de Limoges. La Révolution, puis Napoléon, maintiennent la \
manufacture, que dirige à partir de 1800 le savant Alexandre Brongniart. Aux XIXᵉ et XXᵉ \
siècles, elle accueille de nouveaux artistes et de nouvelles techniques, des grès de \
l'Art nouveau aux créations contemporaines. Toujours en activité, elle produit à la \
main, dans ses bâtiments de 1876, des pièces commandées par l'État et des œuvres \
d'artistes invités."""
style = """
Le style de Sèvres au XVIIIᵉ siècle se reconnaît à ses fonds de couleur intenses, bleu \
céleste, bleu lapis, vert, rose, encadrés d'or ciselé, et à ses cartouches peints comme \
des miniatures : amours, paysages, oiseaux, fleurs. Ses formes, souvent dessinées par \
Duplessis, suivent la souplesse du rococo avant de se plier au goût néoclassique. Imitée \
dans toute l'Europe, la manufacture a longtemps incarné le luxe à la française."""

[[artistes]]
nom = "Josiah Wedgwood"
vie = "Burslem (Staffordshire), 1730 – Etruria (Staffordshire), 3 janvier 1795"
biographie = """
Josiah Wedgwood naît en 1730 à Burslem, dans le Staffordshire, au sein d'une famille de \
potiers. Il commence à travailler à neuf ans, après la mort de son père, dans l'atelier \
familial. Atteint de la variole dans l'enfance, il en garde une jambe malade, qui sera \
amputée en 1768. Ne pouvant plus tourner, il se consacre à l'expérimentation : il note \
dans ses carnets des milliers d'essais de pâtes et de glaçures. Installé à son compte en \
1759, il perfectionne une faïence fine de couleur crème, adoptée par la reine Charlotte, \
qui l'autorise à la nommer « Queen's ware ». En 1769, avec son associé Thomas Bentley, \
il ouvre près de Stoke une manufacture modèle baptisée Etruria, en hommage aux \
Étrusques, à qui l'on attribuait alors les vases grecs. Il y crée le basalte noir, puis \
le jaspe. Pionnier de l'industrie, il divise le travail, ouvre des salles d'exposition à \
Londres, publie des catalogues, soutient la construction de canaux. Membre de la Royal \
Society, il combat la traite des esclaves et diffuse un médaillon célèbre portant \
l'inscription « Am I not a man and a brother? ». Son petit-fils est le naturaliste \
Charles Darwin."""
style = """
Wedgwood a su allier l'art et l'industrie : des formes simples et élégantes, \
reproductibles en grand nombre, une qualité constante, et des décors confiés à des \
artistes comme le sculpteur John Flaxman. Son jaspe bleu pâle à reliefs blancs, inspiré \
des camées antiques, est devenu l'image même du néoclassicisme anglais. Ses méthodes de \
fabrication et de vente ont fait de lui l'un des pères de l'industrie moderne."""
