[exposition]
ordre = 24
nom_court = "Céramiques"
mouvement = "Céramiques et porcelaines du monde"
cadre = "vitrine"
couleur = "#2f4f7f"
titre = "Céramiques et porcelaines du monde, la terre et le feu"
artiste = "Jingdezhen, Longquan, raku, Zuni, Gubbio, Delft, Meissen, Sèvres, Wedgwood…"
dates = "XIIIᵉ–XIXᵉ siècle"
accroche = "Exposition virtuelle · Musée national de Céramique, Sèvres"
introduction = """
La céramique est le plus universel des arts : partout, les hommes ont façonné l'argile \
et l'ont durcie au feu. La visite fait le tour du monde en dix pièces, du céladon des \
Song au bleu et blanc des Ming et aux émaux roses des Qing, d'un bol à thé japonais à \
une jarre à eau zuñie, de la majolique italienne à la faïence de Delft, jusqu'aux \
porcelaines de Meissen et de Sèvres et au grès de Wedgwood. Le bâtiment s'inspire du \
musée national de Céramique de Sèvres, né des collections réunies par Alexandre \
Brongniart : un vestibule ouvre sur une longue galerie consacrée à la Chine, d'où l'on \
gagne trois salles, celles de la terre modelée à la main, des faïences et des \
manufactures d'Europe."""
vitrine = "jarre-dragon-xuande.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Musée national de Céramique"
ville = "Sèvres, France"
construction = "1876"
presentation = """
En 1740, une manufacture de porcelaine s'installe au château de Vincennes ; elle \
déménage en 1756 à Sèvres, dans un vaste bâtiment construit pour elle, et Louis XV la \
rachète en 1759 pour en faire une manufacture royale. En 1800, le savant Alexandre \
Brongniart en prend la direction, qu'il gardera près d'un demi-siècle. Minéralogiste et \
chimiste, il rassemble des céramiques de tous les pays et de toutes les époques pour \
étudier les terres, les glaçures et les cuissons, et fonde en 1824 un musée de la \
céramique et du verre, ouvert aux savants comme aux artisans. En 1876, la manufacture et \
son musée quittent leurs anciens locaux pour de nouveaux bâtiments, élevés au bord de la \
Seine, à l'entrée du parc de Saint-Cloud. Les collections y présentent les terres cuites \
de l'Antiquité, les grès et les porcelaines d'Asie, les faïences d'Europe et la \
production de Sèvres elle-même. Depuis 2010, musée et manufacture forment un même \
établissement, Sèvres – Cité de la céramique, où des artisans tournent et peignent \
encore la porcelaine à la main."""
ici = """
Le bâtiment d'ARTEON emprunte au musée de Sèvres son principe : classer les céramiques \
par grandes familles, comme le voulait Brongniart, et les montrer en vitrine. On entre \
par le sud dans le vestibule Brongniart, aux murs crème, puis dans la galerie de la \
Chine, longue de trente mètres et haute de huit, aux murs vert céladon pâle. Au nord \
s'ouvre la salle « La terre modelée à la main », couleur d'argile, où un bol japonais \
voisine avec une jarre zuñie ; à l'ouest, la salle des faïences d'Europe ; à l'est, \
celle des manufactures d'Europe, de Meissen à Wedgwood."""

