[exposition]
ordre = 125
nom_court = "Peinture russe"
mouvement = "Peinture russe, des Ambulants à l'âge d'argent"
cadre = "dore"
couleur = "#8b2c25"
titre = "La peinture russe, des Ambulants à l'âge d'argent"
artiste = "Répine, Aïvazovski, Sourikov, Levitan, Vroubel, Serov…"
dates = "1850–1898"
accroche = "Exposition virtuelle · Galerie Tretiakov, Moscou"
introduction = """
Au XIXᵉ siècle, la peinture russe s'affranchit de l'Académie impériale : en 1870, les \
Ambulants fondent une société d'expositions itinérantes et peignent la vie du peuple, \
l'histoire nationale et la nature russe, tandis qu'à la fin du siècle le cercle \
d'Abramtsovo ouvre la voie au rêve et aux légendes. La visite réunit neuf peintres, \
d'Aïvazovski à Vroubel, en dix toiles venues de la galerie Tretiakov de Moscou et du \
Musée russe de Saint-Pétersbourg. Le bâtiment s'inspire de la galerie Tretiakov : on \
entre par un vestibule qui évoque la façade dessinée par Viktor Vasnetsov, puis l'on \
suit une enfilade de salles hautes, de la grande salle des Ambulants jusqu'à celle des \
légendes."""
vitrine = "bogatyrs.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Galerie Tretiakov"
ville = "Moscou, Russie"
architecte = "Viktor Vasnetsov (façade)"
construction = "1902–1904 (façade)"
presentation = """
En 1856, Pavel Tretiakov, un riche marchand de textiles moscovite, achète ses premiers \
tableaux de peintres russes contemporains, avec l'idée de fonder une galerie \
nationale. Pendant quarante ans, il soutient les Ambulants, commande des portraits \
d'écrivains et agrandit sans cesse sa maison du quartier de Zamoskvoretchie, au sud du \
Kremlin, de salles éclairées par des verrières. En 1892, il offre à la ville de Moscou \
sa collection et celle de son frère Sergueï ; la galerie municipale ouvre au public \
l'année suivante. Au début du XXᵉ siècle, le peintre Viktor Vasnetsov dessine la \
façade qui la rend célèbre : un pignon en forme de kokochnik, la coiffe des femmes \
russes, un bas-relief de saint Georges, emblème de Moscou, et une frise d'ornements \
colorés dans le style des anciennes églises russes. La galerie conserve aujourd'hui \
l'art russe des icônes jusqu'au début du XXᵉ siècle ; l'art plus récent est exposé \
dans un second bâtiment, sur le Krymski Val."""
ici = """
Le bâtiment d'ARTEON reprend l'idée de la Tretiakov : une maison de collectionneur \
devenue une enfilade de salles hautes. On entre par le sud dans le vestibule de \
Vasnetsov, aux murs crème, puis dans la salle des Ambulants, la plus vaste, haute de \
neuf mètres, aux murs ocre clair. À l'ouest s'ouvre la salle « La mer et la nuit », \
aux murs beige ; à l'est, la salle « La forêt et la plaine », d'un vert pâle. Au nord \
de celle-ci, on termine par la salle « Le cercle d'Abramtsovo », aux murs rose poudré."""

