[exposition]
ordre = 12
nom_court = "Manuscrits et tapisseries"
mouvement = "Manuscrits enluminés et tapisseries"
cadre = "estampe"
couleur = "#6a3b5c"
titre = "Manuscrits et tapisseries, le Moyen Âge en pages et en fils"
artiste = "Moines d'Iona, Eadfrith, Jean de Bruges, Bourdichon, Cresques…"
dates = "VIIIᵉ – XVIᵉ siècle"
accroche = "Exposition virtuelle · Bibliothèque nationale de France, site Richelieu, Paris"
introduction = """
Avant l'imprimerie, les livres se copiaient et se peignaient à la main, page à page, \
et les grandes images se tissaient ou se brodaient pour habiller les murs. Cette \
exposition réunit dix de ces trésors : les évangiles d'Irlande et de Northumbrie, une \
Apocalypse romane, une Bible géante, un calendrier aztèque, une carte du monde de \
1375, un livre d'heures royal, la broderie de Bayeux et deux des plus célèbres \
tentures du Moyen Âge. Le bâtiment s'inspire du site Richelieu de la Bibliothèque \
nationale de France, à Paris : les manuscrits y sont présentés dans une salle carrée \
qui évoque la salle Labrouste et dans une haute salle qui rappelle la salle Ovale, les \
tapisseries dans une longue galerie inspirée de la galerie Mazarine."""
vitrine = "kells-chi-rho.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Bibliothèque nationale de France, site Richelieu"
ville = "Paris, France"
architecte = "François Mansart, Henri Labrouste, Jean-Louis Pascal"
construction = "XVIIᵉ – XXᵉ siècle"
presentation = """
Au cœur de Paris, entre le Palais-Royal et la Bourse, le quadrilatère Richelieu \
rassemble des bâtiments élevés sur près de quatre siècles. Dans les années 1640, le \
cardinal Mazarin y installe son palais et ses collections ; François Mansart lui \
construit la galerie Mazarine, dont Giovanni Francesco Romanelli peint le plafond. À \
partir de 1721, la Bibliothèque du roi s'établit dans ces murs. Au XIXᵉ siècle, Henri \
Labrouste y élève la grande salle de lecture des imprimés, ouverte en 1868 : seize \
fines colonnes de fonte portent neuf coupoles percées chacune d'un oculus. Jean-Louis \
Pascal entreprend ensuite la salle Ovale, achevée par Alfred Recoura et ouverte dans \
les années 1930 sous une immense verrière. Après le départ des livres imprimés vers le \
site François-Mitterrand, à la fin des années 1990, Richelieu garde les manuscrits, \
les estampes, les cartes, les monnaies et les médailles. Rénové par Bruno Gaudin et \
Virginie Brégal, il a rouvert en 2022 avec un musée et une salle Ovale ouverte à tous."""
ici = """
Le bâtiment d'ARTEON réunit trois espaces célèbres de Richelieu autour d'une salle \
centrale. On entre par le sud dans le vestibule, aux murs crème, puis dans la salle \
Labrouste, carrée, de dix-huit mètres de côté et dix de haut, aux murs ivoire, où sont \
présentés les évangiles insulaires, l'Apocalypse de Saint-Sever et la Bible de \
Souvigny. À l'ouest s'étire la galerie Mazarine, longue de trente mètres, réservée à \
la broderie de Bayeux et aux tapisseries. À l'est, la salle Ovale, rectangulaire ici \
mais haute de quatorze mètres, réunit le livre d'heures, le codex aztèque et l'Atlas \
catalan."""

