[[artistes]]
nom = "Paul Cézanne"
vie = "Aix-en-Provence, 19 janvier 1839 – Aix-en-Provence, 22 octobre 1906"
biographie = """
Fils de Louis-Auguste Cézanne, chapelier enrichi devenu banquier, Paul grandit à \
Aix-en-Provence. Au collège Bourbon, il se lie d'une amitié profonde avec Émile Zola, \
avec qui il arpente la campagne aixoise. Pour plaire à son père, il commence des \
études de droit, puis obtient de partir pour Paris en 1861. Il fréquente l'Académie \
Suisse, copie au Louvre, rencontre Pissarro, Monet et Renoir, mais le Salon le refuse \
presque chaque année. Ses premières toiles, sombres et violentes, déconcertent. \
Pendant la guerre de 1870, il se cache à l'Estaque avec Hortense Fiquet, qui lui donne \
un fils, Paul, en 1872. Auprès de Pissarro, à Pontoise et Auvers-sur-Oise, il \
éclaircit sa palette. Il expose avec les impressionnistes en 1874 et 1877, sous les \
moqueries de la critique, puis s'éloigne de Paris. L'année 1886 est décisive : la \
publication de L'Œuvre met fin à son amitié avec Zola, il épouse Hortense, et la mort \
de son père le met à l'abri du besoin. Retiré à Aix, il travaille avec obstination, \
loin du monde de l'art. En 1895, sa première exposition personnelle chez Ambroise \
Vollard le révèle aux jeunes peintres, qui commencent à le considérer comme un maître. \
Après la vente du Jas de Bouffan, la maison familiale, il fait construire en 1902 son \
atelier des Lauves. Malade du diabète, il continue de peindre sur le motif jusqu'au \
bout : surpris par un orage en octobre 1906, il meurt quelques jours plus tard. La \
rétrospective du Salon d'automne de 1907 consacre son influence."""
style = """
Cézanne veut faire de l'impressionnisme « quelque chose de solide et de durable comme \
l'art des musées », selon une formule qu'on lui prête. Il construit les formes par la \
couleur elle-même, en touches juxtaposées et orientées, plutôt que par le dessin et \
l'ombre. Il simplifie les objets en volumes, combine plusieurs points de vue et \
accepte les déformations qui servent l'équilibre du tableau. En 1904, il conseille à \
Émile Bernard de traiter la nature « par le cylindre, la sphère, le cône ». Cette \
leçon nourrit directement le cubisme de Braque et de Picasso, mais aussi Matisse et \
une grande partie de l'art abstrait : on le considère comme l'un des pères de la \
peinture moderne."""
