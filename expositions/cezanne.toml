# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « CÉZANNE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/cezanne/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /cezanne.
#
#  Pour ajouter une œuvre :
#    1. déposer son image (JPEG ou PNG) dans public/tableaux/cezanne/ ;
#    2. copier un bloc [[oeuvres]] ci-dessous et changer ses valeurs.
#  Au prochain push sur master, le site est reconstruit et republié tout seul.
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 120
nom_court = "Cézanne"
mouvement = "Post-impressionnisme"
couleur = "#b8642a"
titre = "Cézanne, la construction de la couleur"
artiste = "Paul Cézanne"
dates = "1839–1906"
accroche = "Exposition virtuelle · Paul Cézanne"
introduction = """
Des pommes que l'on croirait taillées dans la pierre, des joueurs de cartes \
immobiles, la mer à l'Estaque et la montagne Sainte-Victoire peinte encore et \
encore : Cézanne construit le monde avec la couleur. Picasso l'appelait « notre \
père à tous »."""
vitrine = "panier-pommes.jpg"

# ─── Les salles, dans l'ordre de la visite ───────────────────────────────────

[[salles]]
nom = "Salle I · Les êtres et les choses"
theme = "1877–1895 : les portraits, les joueurs de cartes et les natures mortes, construits touche par touche."
murs = "#ece4d6"

[[salles]]
nom = "Salle II · La Provence"
theme = "1885–1904 : la mer à l'Estaque, le Château Noir et la montagne Sainte-Victoire."
murs = "#e6e8df"

[[salles]]
nom = "Salle III · Les Grandes Baigneuses"
theme = "1900–1906 : la dernière grande toile, inachevée, qui ouvre la voie au cubisme."
murs = "#e3e4ea"

# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Autoportrait"
annee = "1878–1880"
image = "autoportrait.jpg"
technique = "Huile sur toile, 60,3 × 46,9 cm"
collection = "The Phillips Collection, Washington"
note = "Un regard de biais, une tête solide comme un bloc : Cézanne se peint comme il peint une montagne."
description = """
Le peintre se montre en buste, de trois quarts, le corps tourné vers la droite et la \
tête légèrement pivotée vers nous. Le crâne chauve, très éclairé, forme une large \
coupole rose et blanche ; une couronne de cheveux bruns frise sur la nuque et une \
barbe touffue, sombre, mange le bas du visage. Les yeux, à demi plissés, nous \
observent de côté, sans l'ombre d'un sourire. Il porte une veste sombre, d'un vert \
brun, dont le col dessine des angles nets sous la barbe. Derrière lui, aucun décor, \
aucun attribut de peintre : un fond olive, brossé en touches inégales, plus foncé à \
gauche, plus doré à droite. La figure remplit presque toute la toile, et le bord \
gauche laisse voir la toile nue."""
evocation = """
Rien ici de l'artiste inspiré ou mondain : Cézanne s'observe avec la même neutralité \
qu'une pomme ou un rocher. Les historiens de l'art y ont vu le moment où il renonce \
aux effets dramatiques de ses débuts pour une observation patiente, presque \
impersonnelle. Le regard en coin, un peu méfiant, s'accorde avec ce que l'on sait de \
l'homme : ombrageux, timide, susceptible, de plus en plus retiré à Aix et fuyant le \
Paris des salons. Le visage ne traduit pas une émotion passagère mais une présence \
durable, bâtie par masses. Autour de la quarantaine, encore ignoré du public et raillé \
par la critique, il se représente en travailleur obstiné plutôt qu'en peintre \
reconnu : un homme qui doute de tout, sauf de sa méthode."""
histoire = """
Cézanne a peint plus d'une vingtaine d'autoportraits à l'huile, en partie faute \
d'autres modèles : il travaillait lentement, exigeait de longues séances, et peu de \
gens acceptaient de poser pour lui. Celui-ci date des années 1878–1880. Le peintre \
partage alors son temps entre Paris, l'Estaque et Aix ; il a exposé avec les \
impressionnistes en 1874 et en 1877, sous les sarcasmes de la presse, puis cesse de \
participer à leurs expositions. Il vit chichement de la pension que lui verse son \
père. Longtemps resté dans des collections privées, le tableau est acquis à la fin des \
années 1920 par Duncan Phillips, collectionneur de Washington qui fut parmi les \
premiers Américains à défendre Cézanne et qui avait ouvert au public, en 1921, sa \
propre maison-musée."""
facture = """
La touche, encore large et épaisse, est posée en coups de brosse parallèles qui \
suivent les plans du visage : front, pommette, arête du nez. Le modelé ne passe pas \
par des dégradés d'ombre, mais par la juxtaposition de roses, d'ocres et de verts \
froids. Cette manière de construire par touches orientées, mûrie au contact de \
Pissarro à Pontoise et à Auvers, est ce que les historiens appellent sa « touche \
constructive ». La palette, restreinte, repose sur l'accord du vert olive du fond et \
de la chair rosée. Le contour de la veste, repris en traits sombres, referme la forme \
comme un bloc."""
details = [
  "Le sommet du crâne, posé en touches presque blanches, capte toute la lumière.",
  "L'oreille rougie, petite tache chaude dans la masse sombre des cheveux.",
  "Les paupières lourdes, à demi baissées, qui donnent au regard son air soupçonneux.",
  "Sur le bord gauche, une bande de toile nue que la couleur n'a pas recouverte.",
]
themes = ["autoportrait", "regard", "solitude", "construction"]
anecdote = """
Ami d'enfance d'Émile Zola au collège d'Aix, Cézanne a souvent été reconnu dans Claude \
Lantier, le peintre raté du roman L'Œuvre (1886). La lettre polie par laquelle il \
remercie Zola de l'envoi du livre est la dernière que l'on connaisse entre les deux \
hommes."""
salle = 1
mur = "gauche"
place = 1
largeur = 0.85

[[oeuvres]]
titre = "Madame Cézanne au fauteuil rouge"
annee = "vers 1877"
image = "madame-cezanne.jpg"
technique = "Huile sur toile, 72,4 × 56 cm"
collection = "Museum of Fine Arts, Boston"
note = "Hortense Fiquet, sa compagne, posée comme une nature morte dans le grand fauteuil rouge."
description = """
Hortense Fiquet est assise, de face, dans un ample fauteuil capitonné d'un rouge vif, \
dont les accoudoirs s'enroulent de part et d'autre et d'où pendent des glands de \
passementerie. Elle porte une veste gris-bleu aux larges manches, fermée au cou par un \
grand nœud de ruban bleu clair, et une longue jupe à volants, rayée de vert, de bleu \
et de mauve, qui descend jusqu'au bas du tableau. Ses mains sont croisées sur ses \
genoux. Son visage ovale, encadré de cheveux bruns relevés en chignon, reste calme, \
sans expression appuyée. Derrière elle, un papier peint ocre doré est semé de petits \
motifs bleus en forme de fleurs à quatre pétales ; en bas à gauche, une bande vert \
sombre marque la plinthe. Le cadrage coupe le fauteuil et la robe."""
evocation = """
Le titre parle du fauteuil autant que de la femme, et ce n'est pas un hasard : Cézanne \
regarde sa compagne avec la même attention qu'un objet, sans chercher à la flatter ni \
à raconter son caractère. On a souvent lu dans ces portraits une froideur, voire la \
trace d'un couple difficile ; d'autres y voient surtout la patience d'un modèle qui \
accepta des heures de pose immobile. Le tableau évoque aussi une vie presque \
clandestine : en 1877, Cézanne cache encore à son père l'existence d'Hortense et de \
leur fils. La grande masse rouge qui enveloppe la figure lui donne pourtant une \
chaleur et une stabilité monumentales, comme un écrin, et le face-à-face du rouge et \
du vert fait vibrer cette scène immobile."""
histoire = """
Cézanne rencontre Hortense Fiquet, jeune femme née dans le Jura qui pose comme modèle, \
à Paris vers 1869 ; leur fils Paul naît en 1872. Il la peindra près de trente fois, \
plus que tout autre modèle. Ce portrait date de 1877 environ, l'année où il expose \
pour la dernière fois avec les impressionnistes. Le couple ne se marie qu'en avril \
1886, à Aix, quelques mois avant la mort de Louis-Auguste Cézanne, le père du peintre. \
Après la disparition de l'artiste, le tableau figure parmi les œuvres réunies au Salon \
d'automne de 1907 pour la grande rétrospective qui révèle Cézanne à toute une \
génération de peintres. Il entre au Museum of Fine Arts de Boston en 1944, légué par \
le collectionneur Robert Treat Paine II."""
facture = """
Les rayures de la jupe sont rendues par de longues touches verticales juxtaposées, \
vertes, bleues et mauves, sans fondu : la couleur pure construit le volume et le \
mouvement des plis. Le rouge du fauteuil et le vert de la robe, couleurs \
complémentaires, s'exaltent l'un l'autre. Le fauteuil lui-même n'est pas modelé par \
l'ombre mais par des rouges plus chauds ou plus froids, plus roses ou plus sombres. \
Des contours bleus cernent par endroits les formes. La composition, presque \
symétrique, installe la figure en pyramide au centre de la toile, solidement calée \
contre le fond plat du papier peint."""
details = [
  "Les glands rouges qui pendent de part et d'autre du fauteuil.",
  "Le gros nœud bleu clair, point le plus lumineux de la robe.",
  "Les petits motifs bleus du papier peint, comme des fleurs à quatre pétales.",
  "Les mains croisées, réduites à quelques plans de chair.",
  "La bande vert sombre en bas à gauche, qui ancre la composition.",
]
themes = ["portrait", "intérieur", "couple", "couleur", "femme"]
anecdote = """
En octobre 1907, le poète Rainer Maria Rilke découvre ce tableau au Salon d'automne et \
lui consacre une longue description dans une lettre à sa femme, Clara, où il analyse \
le dialogue des rouges et des bleus. Ses Lettres sur Cézanne sont devenues un \
classique."""
salle = 1
mur = "droite"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Le Garçon au gilet rouge"
annee = "1888–1890"
image = "gilet-rouge.jpg"
technique = "Huile sur toile, 89,5 × 72,4 cm"
collection = "National Gallery of Art, Washington"
note = "Michelangelo di Rosa, un jeune modèle italien, coiffé d'un chapeau, la main sur la hanche : Cézanne le peignit au moins quatre fois."
description = """
Un adolescent se tient debout, de trois quarts, devant une lourde draperie aux plis \
verticaux. Il porte un chapeau brun à large bord, une chemise claire, une cravate \
bleue, un gilet rouge vif à revers, une veste gris-bleu et un pantalon brun-vert serré \
par une ceinture bleu sombre. À gauche, son bras plié pose la main sur la hanche ; à \
droite, l'autre bras pend le long du corps, très long, la main tombant presque au bas \
du tableau. Le visage pâle, aux joues rosées, est tourné vers nous, l'expression vague \
et un peu absente. En bas à gauche, on devine le dossier d'une chaise en bois ; \
derrière, la tenture alterne motifs feuillus, ocres et gris-vert."""
evocation = """
Le garçon n'est pas un personnage dont on raconterait l'histoire : son nom ou son \
humeur importent peu. Cézanne fait de ce jeune homme en costume pittoresque un motif \
de couleurs et de lignes, dont le gilet rouge est le cœur ardent. La pose, main sur la \
hanche, rappelle les portraits d'apparat de la tradition, mais appliquée à un modèle \
de condition modeste, elle perd toute arrogance. On y a souvent lu une mélancolie \
adolescente, une rêverie lasse que renforce le regard perdu. Surtout, la liberté prise \
avec les proportions du corps, au profit de l'équilibre de la toile, a fasciné les \
peintres du XXe siècle : la peinture n'a plus à copier la nature, elle obéit à ses \
propres lois."""
histoire = """
Cézanne peint ce tableau à Paris, vers 1888–1890. Son modèle est un jeune Italien, \
Michelangelo di Rosa, qui pose pour les artistes. Le peintre en tire au moins quatre \
toiles, dans des poses différentes, ainsi que des aquarelles : elles sont aujourd'hui \
à Zurich, New York, Philadelphie et Washington. La version de Washington a appartenu \
au banquier Jakob Goldschmidt. Lors de la vente de sa collection chez Sotheby's à \
Londres, en octobre 1958, elle est achetée par le collectionneur américain Paul Mellon \
pour 220 000 livres sterling, un record à l'époque pour un tableau vendu aux enchères. \
Ce prix spectaculaire fait alors la une des journaux. Paul Mellon et son épouse l'ont \
donnée à la National Gallery of Art en 1995."""
facture = """
La peinture est posée en larges touches plates qui découpent chaque surface en plans : \
la veste en facettes gris-bleu, la draperie en bandes obliques, le visage en quelques \
pans de chair rose et verte. Le rouge du gilet, placé au centre, est la note la plus \
intense ; tout autour, les bleus et les verts le mettent en valeur. Les contours, \
repris en traits bleu sombre, restent souvent ouverts. Cézanne allonge et déforme \
librement les membres pour équilibrer la composition verticale. Certaines zones, comme \
le pantalon ou la chaise, sont à peine esquissées, ce qui laisse voir la construction \
du tableau."""
details = [
  "Le chapeau brun à large bord, posé comme un disque au-dessus du visage.",
  "La cravate bleue, qui répond au bleu sombre de la ceinture.",
  "À droite, la main qui pend presque jusqu'au bord inférieur de la toile.",
  "En bas à gauche, le dossier de chaise en bois, à peine esquissé.",
  "Les plis de la tenture, découpés en larges bandes de couleur.",
]
themes = ["portrait", "jeunesse", "modèle", "rouge", "couleur"]
anecdote = """
Une autre version du tableau, conservée par la Fondation Bührle à Zurich, a été volée \
par des hommes armés en février 2008, avec trois autres toiles. Elle n'a été retrouvée \
qu'en 2012, en Serbie, lors d'une opération de police."""
salle = 1
mur = "gauche"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "Les Joueurs de cartes"
annee = "1890–1895"
image = "joueurs-cartes.jpg"
technique = "Huile sur toile, 47,5 × 57 cm"
collection = "Musée d'Orsay, Paris"
note = "Deux paysans d'Aix face à face, absorbés et immobiles : une partie qui semble durer pour l'éternité."
description = """
Dans une pièce sombre, deux hommes se font face de part et d'autre d'une petite table \
couverte d'un tapis orangé dont l'angle retombe vers nous. À gauche, coiffé d'un \
chapeau melon brun, une pipe en terre blanche à la bouche, un joueur en veste violacée \
tient ses cartes près du corps, assis bien droit. À droite, son partenaire, chapeau \
mou et veste jaune pâle, moustache tombante, se penche un peu plus, le regard baissé \
sur son jeu. Aucun des deux ne parle ni ne lève les yeux vers l'autre. Entre eux, une \
bouteille sombre se dresse au milieu de la table, presque au centre du tableau. Au \
fond, un mur brun-rouge et une boiserie ; à gauche, le montant d'une chaise."""
evocation = """
Rien ne se passe, et c'est ce qui frappe : aucune tricherie, aucune dispute, aucun \
enjeu visible, contrairement aux scènes de tripot de la peinture hollandaise ou \
caravagesque. On y a vu la dignité silencieuse des paysans provençaux, que Cézanne, \
fils de banquier, observe avec respect et sans pittoresque. D'autres y lisent le \
face-à-face de deux tempéraments, l'un raide et sombre, l'autre courbé et clair. La \
bouteille, comme un axe, sépare et relie à la fois les deux hommes. La concentration \
des joueurs rejoint celle du peintre, qui exigeait de ses modèles de longues heures \
sans bouger : le jeu devient une forme de méditation, et la scène de genre prend la \
gravité d'un portrait."""
histoire = """
Au début des années 1890, Cézanne entreprend à Aix une série de cinq tableaux de \
joueurs de cartes, préparés par de nombreuses études de paysans isolés. Ses modèles \
sont des ouvriers agricoles et des journaliers du Jas de Bouffan, la propriété \
familiale, et non des acteurs costumés. On pense que les deux versions les plus \
vastes, avec quatre et cinq personnages, aujourd'hui au Metropolitan Museum de New \
York et à la Fondation Barnes de Philadelphie, ont été peintes les premières ; les \
trois suivantes ne gardent que deux joueurs. On cite souvent comme source un tableau \
de joueurs de cartes attribué aux frères Le Nain, conservé au musée d'Aix. Cette \
version, la plus petite, entre au Louvre en 1911 avec le legs du comte Isaac de \
Camondo, puis rejoint le musée d'Orsay en 1986."""
facture = """
La composition est presque symétrique, organisée autour de la bouteille verticale, et \
les deux silhouettes forment comme deux arches qui se répondent. Cézanne simplifie les \
volumes : chapeaux, bras et bustes deviennent des formes pleines et fermes. Les \
couleurs s'opposent en accords chauds et froids, l'orangé du tapis contre les violets \
et les jaunes des vestes. La touche, visible et orientée, construit les plis des \
vêtements plan par plan. La lumière ne vient pas d'une source précise : elle naît des \
couleurs elles-mêmes. Le bord de la table, légèrement incliné, trahit la liberté prise \
avec la perspective."""
details = [
  "La pipe en terre blanche du joueur de gauche, seule note claire de son visage.",
  "Le reflet de lumière sur la bouteille, qui marque l'axe du tableau.",
  "Les cartes, simples taches blanches et bleutées, impossibles à lire.",
  "L'angle du tapis orangé qui retombe vers nous sous la table.",
  "Les jambes et la chaise de gauche, à peine esquissées dans la pénombre.",
]
themes = ["paysans", "jeu", "silence", "provence", "face-à-face"]
anecdote = """
Une autre version à deux joueurs, plus grande, provenant d'une collection grecque, a \
été achetée en 2011 par la famille régnante du Qatar, pour plus de 250 millions de \
dollars selon la presse : un record à l'époque pour une œuvre d'art."""
salle = 1
mur = "droite"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "Le Panier de pommes"
annee = "vers 1893"
image = "panier-pommes.jpg"
technique = "Huile sur toile, 65 × 80 cm"
collection = "Art Institute of Chicago"
note = "La table penche, la bouteille aussi : Cézanne montre les objets de plusieurs points de vue à la fois."
description = """
Sur une table de bois brun, un panier rempli de pommes vertes, jaunes et rouges \
bascule vers l'avant, posé de travers sur un petit bloc qui le soulève à l'arrière. \
Plusieurs fruits s'en sont échappés et reposent sur une nappe blanche froissée, aux \
plis épais, qui couvre le centre de la table et retombe vers nous. Derrière, une \
bouteille de vin vert sombre se dresse, légèrement inclinée. À droite, une assiette \
porte une pile de biscuits allongés, empilés en croisillons. Une pomme isolée, tout à \
droite, attend au bord de la table. Le fond est un mur gris-bleu, uni et lisse, qui \
fait ressortir les couleurs chaudes des fruits. En bas à gauche, la signature « P. \
Cézanne »."""
evocation = """
C'est une scène domestique banale, mais la stabilité qu'on attend d'une nature morte y \
est troublée : tout semble sur le point de glisser, et pourtant tout tient. On y a vu \
la trace du temps de la perception, l'œil qui se déplace d'un objet à l'autre au fil \
des séances, plutôt qu'une image saisie d'un coup. La nature morte, genre jugé mineur \
par l'Académie, devient chez Cézanne un laboratoire aussi ambitieux que la grande \
peinture d'histoire. Les pommes, fruits du quotidien, n'ont ici aucun sens \
symbolique : ni péché, ni vanité, seulement du poids, du volume et de la couleur. Ce \
déplacement du sujet vers la peinture elle-même annonce l'art du XXe siècle, de Braque \
à Morandi."""
histoire = """
Cézanne peint ce tableau vers 1893, à une époque où il vit surtout en Provence et \
n'expose presque plus ; il reste un inconnu pour le grand public. Deux ans plus tard, \
en 1895, le jeune marchand Ambroise Vollard lui consacre dans sa galerie de la rue \
Laffitte, à Paris, sa première exposition personnelle : elle révèle aux jeunes \
peintres ses natures mortes et ses paysages, et lance enfin sa carrière commerciale. \
Le Panier de pommes rejoint plus tard la collection du peintre et mécène de Chicago \
Frederic Clay Bartlett. En 1926, il l'offre à l'Art Institute of Chicago dans la \
collection créée à la mémoire de sa femme, Helen Birch Bartlett, qui comprend aussi Un \
dimanche après-midi à l'île de la Grande Jatte de Seurat."""
facture = """
Cézanne construit les pommes par petites touches de couleur posées côte à côte, des \
rouges et des jaunes chauds vers des verts plus froids, au lieu de les modeler par \
l'ombre et la lumière. Les contours sont repris en traits bleus ou bruns, parfois \
doublés. Les blancs de la nappe sont faits de gris bleutés et de mauves. Le cadrage \
serré et le point de vue légèrement plongeant rapprochent les objets du spectateur. On \
rapporte que le peintre calait ses fruits et ses assiettes avec des pièces de monnaie \
ou des morceaux de bois pour obtenir exactement l'inclinaison voulue."""
details = [
  "Le bord avant de la table, qui ne se raccorde pas de part et d'autre de la nappe.",
  "Le petit bloc glissé sous le panier pour le faire pencher vers nous.",
  "La bouteille, dont les deux flancs ne sont pas symétriques.",
  "La pile de biscuits, vue presque d'en haut alors que l'assiette est vue de côté.",
  "La signature en bas à gauche, rare chez un peintre qui signait peu.",
]
themes = ["nature morte", "pommes", "perspective", "équilibre", "table"]
anecdote = """
Le critique Gustave Geffroy, l'un de ses premiers défenseurs, rapporte que Cézanne lui \
confia vouloir « étonner Paris avec une pomme ». La phrase est restée attachée à \
toutes ses natures mortes."""
salle = 1
mur = "gauche"
place = 3
largeur = 1.3

[[oeuvres]]
titre = "La Baie de Marseille, vue de l'Estaque"
annee = "vers 1885"
image = "estaque.jpg"
technique = "Huile sur toile, 80,2 × 100,6 cm"
collection = "Art Institute of Chicago"
note = "Les toits ocre, le bleu dense de la mer et les collines : un paysage bâti en plans de couleur."
description = """
Depuis les hauteurs du village de l'Estaque, le regard plonge par-dessus des toits de \
tuiles orangées vers la vaste baie de Marseille. Au premier plan, des maisons aux murs \
ocre et aux fenêtres sombres s'emboîtent comme des blocs, entourées de quelques \
arbres. Plusieurs cheminées d'usine se dressent entre les toits, dont l'une, à droite, \
lâche un panache de fumée blanche. À gauche, une langue de terre ocre et verte \
s'avance dans l'eau. La mer, d'un bleu profond et presque uniforme, occupe tout le \
centre du tableau, sans un bateau. Au loin, une jetée mince, puis la ligne des \
collines grises et mauves qui ferment la baie, sous un ciel pâle strié de nuages \
légers."""
evocation = """
Cézanne ne peint ni le port animé de Marseille ni l'agitation des vagues : il fixe une \
image de permanence, une Méditerranée immobile, presque minérale. Là où les \
impressionnistes cherchaient l'instant fugitif, il cherche ce qui dure. La petite \
fumée d'usine, seul signe de mouvement, rappelle pourtant que l'Estaque est alors un \
village industriel, vivant de ses tuileries. Le lieu a aussi pour lui une valeur \
intime : c'est un refuge familial, où sa mère loue une maison et où il peut vivre à \
l'abri du regard paternel. On y a vu un paysage à la fois réel et reconstruit, ordonné \
comme une architecture. Vingt ans plus tard, Braque viendra peindre ici ses premiers \
paysages cubistes, dans le sillage direct de Cézanne."""
histoire = """
L'Estaque est un village de pêcheurs et de tuileries à l'ouest de Marseille. Cézanne \
s'y réfugie en 1870 avec Hortense pour échapper à la mobilisation pendant la guerre \
franco-prussienne, puis y revient à de nombreuses reprises jusqu'au milieu des années \
1880. Il y peint plus d'une dizaine de vues de la baie, sous des angles voisins. En \
1882, Renoir lui rend visite ; tombé malade, il est soigné par Cézanne et sa mère. \
Cette toile, peinte vers 1885, appartient à la série de la maturité, où le paysage se \
simplifie en grands plans. Elle a été acquise par Martin A. Ryerson, industriel et \
mécène de Chicago, l'un des grands bienfaiteurs de l'Art Institute, qui l'a léguée au \
musée avec sa collection en 1933."""
facture = """
Le tableau est bâti en trois bandes horizontales, le village, la mer et les collines, \
superposées plutôt qu'emboîtées par la perspective. La profondeur naît surtout de la \
couleur : les ocres et les orangés chauds du premier plan avancent, le bleu froid de \
la mer recule. Pourtant, les collines du fond sont peintes avec autant de netteté que \
les toits, si bien que la mer semble se redresser comme un mur. La touche de l'eau, \
dense et régulière, en touches horizontales, contraste avec les hachures plus libres \
du ciel. Les maisons sont réduites à des volumes géométriques simples."""
details = [
  "Le panache de fumée blanche, à droite, seul élément en mouvement.",
  "La fine jetée qui coupe la mer en diagonale, sur la gauche.",
  "Les murs des maisons, réduits à des pans de couleur sans détail.",
  "Les collines du fond, aussi nettes que les toits du premier plan.",
  "Les petits prés vert vif sur la langue de terre, à gauche.",
]
themes = ["mer", "provence", "paysage", "village", "méditerranée"]
anecdote = """
Dans une lettre à Pissarro de juillet 1876, Cézanne décrit l'Estaque en ces termes : \
« C'est comme une carte à jouer. Des toits rouges sur la mer bleue. » La formule \
résume déjà ce qu'il cherche : des formes nettes et des couleurs franches."""
salle = 2
mur = "gauche"
place = 1
largeur = 1.5

[[oeuvres]]
titre = "Le Château Noir"
annee = "1900–1904"
image = "chateau-noir.jpg"
technique = "Huile sur toile, 73,7 × 96,6 cm"
collection = "National Gallery of Art, Washington"
note = "Une bâtisse ocre au milieu des pins, près d'Aix, sous un ciel bleu outremer."
description = """
Au-dessus d'une masse dense de pins et de chênes verts, une bâtisse aux murs ocre \
orangé se dresse sur une hauteur, éclairée comme en plein soleil. On distingue de \
hautes fenêtres en arc brisé, d'allure gothique, une petite porte rougeâtre et, à \
droite, une aile plus basse coiffée d'un toit bleu sombre. Le ciel, d'un bleu intense, \
est animé de touches vertes et violettes qui le rapprochent du feuillage. À gauche, un \
tronc mince et clair s'élève en oblique. La végétation occupe toute la moitié \
inférieure du tableau, dans des verts, des bleus et des noirs profonds ; en bas à \
gauche, une tache ocre signale le sol rocheux. Aucun personnage, aucun chemin ne mène \
au bâtiment."""
evocation = """
Le lieu porte un nom de légende, et le tableau entretient ce mystère : une demeure à \
demi cachée, inaccessible, comme surgie de la forêt. On a souvent souligné la tonalité \
dramatique, presque inquiète, des dernières vues du Château Noir, où le ciel sombre \
semble peser sur l'édifice. Certains y voient un retour du romantisme de jeunesse de \
Cézanne, d'autres l'écho de ses dernières années, solitaires et assombries par le \
diabète. L'architecture humaine et la nature sauvage s'y mêlent sans se confondre : la \
pierre chaude, solide et géométrique, s'oppose au foisonnement froid de la végétation. \
Au-delà du motif, le tableau dit l'attachement du peintre à cette campagne d'Aix qu'il \
a arpentée toute sa vie."""
histoire = """
Le Château Noir est une grande demeure de style néogothique, construite au XIXe siècle \
sur la route qui mène d'Aix au village du Tholonet, à l'est de la ville. Malgré son \
nom, elle est bâtie dans une pierre ocre ; son nom a nourri bien des légendes locales. \
Cézanne parcourt ces collines boisées dès les années 1880. Après la vente du Jas de \
Bouffan, la propriété familiale, en 1899, il tente en vain d'acheter le château ; il y \
loue une pièce pour entreposer son matériel et peint dans les environs jusqu'à la fin \
de sa vie. Cette toile appartient à la série des vues peintes au début des années \
1900. Elle est entrée à la National Gallery of Art de Washington en 1958, don d'Eugene \
et Agnes Meyer."""
facture = """
Toute la surface est couverte de touches courtes, en hachures obliques, qui donnent la \
même texture au ciel et aux arbres et lient les plans entre eux. Le contraste majeur \
oppose l'ocre orangé de la bâtisse au bleu du ciel, deux couleurs complémentaires qui \
se renforcent. La peinture est posée en couches successives, parfois fines, parfois \
épaisses, dans une manière plus libre que celle des années 1880. Les contours se \
défont, les formes se rejoignent par endroits : les historiens parlent de « passage ». \
Cette liberté fascinera les fauves et les cubistes."""
details = [
  "Les fenêtres en ogive, quelques traits sombres sur la façade ocre.",
  "La porte rouge, petite note chaude au cœur du bâtiment.",
  "Le tronc clair à gauche, qui traverse la composition en oblique.",
  "Les touches vertes posées dans le ciel, comme si le feuillage y montait.",
  "Le toit bleu de l'aile droite, qui se confond presque avec le ciel.",
]
themes = ["architecture", "forêt", "provence", "mystère", "solitude"]
anecdote = """
Picasso possédait lui aussi un Château Noir de Cézanne, peint vers 1904–1906. Entré \
dans les collections nationales avec la donation de la collection personnelle de \
Picasso après sa mort, il est aujourd'hui conservé au musée Picasso de Paris."""
salle = 2
mur = "droite"
place = 3
largeur = 1.45

[[oeuvres]]
titre = "La Montagne Sainte-Victoire"
annee = "1904"
image = "sainte-victoire.jpg"
technique = "Huile sur toile"
note = "Vue des Lauves, son dernier atelier : Cézanne a peint la montagne plus de quatre-vingts fois."
description = """
La montagne occupe le haut du tableau : une masse bleu-violet dont la crête s'élève \
vers un sommet aigu, avant de s'étirer en un long plateau vers la droite. Sous elle \
s'étend la plaine, faite d'une mosaïque de petits pans ocre, orangés, verts et bleus \
où l'on devine des champs, des bosquets et quelques maisons. Au premier plan, une \
large bande d'herbe vert clair traverse toute la toile ; des arbres aux troncs minces \
s'y dressent, à gauche et à droite. Le ciel, loin d'être uni, est brossé de grandes \
touches bleues, vertes et grises, semblables à celles du paysage. Par endroits, la \
toile apparaît à nu, sans aucune couleur."""
evocation = """
La Sainte-Victoire est la montagne de l'enfance de Cézanne, celle de ses promenades \
avec Zola dans la campagne d'Aix. Revenir sans cesse au même motif, c'est pour lui \
chercher ce qui demeure sous la lumière changeante : il parle souvent, dans ses \
lettres, de « réaliser » ses sensations devant la nature. On a vu dans cette série une \
quête presque spirituelle, menée par un homme vieillissant et malade qui sent le temps \
lui manquer. La montagne devient le symbole d'une Provence enracinée, solide et \
intemporelle. Dans les dernières versions, la plaine et le ciel se dissolvent en \
taches de couleur, au bord de l'abstraction, ce qui fera de ces toiles des références \
pour les peintres abstraits du XXe siècle."""
histoire = """
Cézanne peint la Sainte-Victoire dès les années 1870, puis surtout à partir des années \
1880, depuis le Jas de Bouffan ou les environs de Bellevue. En 1902, il fait \
construire un atelier sur la colline des Lauves, au nord d'Aix. Il monte presque \
chaque jour, par le chemin, jusqu'à un point de vue qui domine la plaine, face à la \
montagne : c'est là que naît la dernière série, peinte entre 1902 et 1906. Le jeune \
peintre Émile Bernard lui rend visite en 1904 et recueille ses propos sur la \
peinture ; en janvier 1906, Maurice Denis et Ker-Xavier Roussel viennent à leur tour \
et le photographient au travail devant le motif. Ces vues tardives sont aujourd'hui \
dispersées entre l'Europe, les États-Unis et la Russie."""
facture = """
La toile est construite par taches de couleur juxtaposées, souvent rectangulaires, \
posées sans dessin préalable. La même touche sert à la terre et au ciel, ce qui unifie \
toute la surface. Les couleurs chaudes, ocres et orangés, font avancer la plaine, \
tandis que les bleus et les violets repoussent la montagne au loin. La peinture, \
souvent mince et presque transparente, laisse voir par endroits la toile, comme dans \
les aquarelles que Cézanne pratique beaucoup à la même époque. L'inachèvement apparent \
fait partie de la méthode : chaque touche répond aux autres plutôt qu'au détail du \
paysage."""
details = [
  "Le sommet, posé en touches bleues et mauves sans contour continu.",
  "Les petites taches orangées, au centre, qui suggèrent des toits.",
  "Les troncs minces du premier plan, tracés d'un simple trait sombre.",
  "Les zones de toile nue, dans le ciel et en bas à gauche.",
]
themes = ["montagne", "provence", "paysage", "abstraction", "permanence"]
anecdote = """
La tradition rattache le nom de la montagne à la victoire du général romain Marius sur \
les Teutons, en 102 av. J.-C., dans la région d'Aix. Picasso, grand admirateur de \
Cézanne, achète en 1958 le château de Vauvenargues, au pied de son versant nord ; il y \
est enterré."""
salle = 2
mur = "gauche"
place = 3
largeur = 1.5

[[oeuvres]]
titre = "Les Grandes Baigneuses"
annee = "1900–1906"
image = "grandes-baigneuses.jpg"
technique = "Huile sur toile, 210,5 × 250,8 cm"
collection = "Philadelphia Museum of Art"
note = "Des corps et des arbres qui forment une cathédrale : la dernière grande toile, laissée inachevée."
description = """
Sur une rive sablonneuse, plus d'une dizaine de femmes nues se répartissent en deux \
groupes, à gauche et à droite, encadrées par de grands troncs d'arbres qui s'inclinent \
l'un vers l'autre jusqu'à former une haute arche ouverte sur le ciel. À gauche, une \
baigneuse debout s'appuie contre un arbre ; d'autres sont assises, accroupies ou \
allongées. À droite, une femme assise domine son groupe, face à nous. Au centre, une \
petite étendue d'eau où nage une silhouette ; sur l'autre rive, deux figures debout \
et, au loin, un village avec un clocher, sous un ciel bleu traversé de nuages blancs. \
Au premier plan, une baigneuse penchée saisit un linge blanc posé au sol."""
evocation = """
Cézanne reprend un thème très ancien, celui des nus dans un paysage idéal, cher à \
Titien et à Poussin : un âge d'or où l'humanité vit en accord avec la nature. Mais ses \
baigneuses n'ont ni nom ni histoire mythologique, et leurs corps, sans séduction, sont \
traités comme des éléments du paysage, au même titre que les arbres et l'eau. On y a \
vu la synthèse de toute sa recherche : unir la figure humaine et la nature dans une \
construction stable et monumentale. Pour beaucoup d'historiens, cette dernière grande \
toile ouvre la voie à l'art du XXe siècle : Picasso et Matisse en méditent la leçon, \
et l'on rapproche souvent Les Demoiselles d'Avignon, peintes en 1907, de ces nus \
anguleux."""
histoire = """
Dans les dix dernières années de sa vie, Cézanne mène de front trois grandes \
compositions de baigneuses, aujourd'hui à Londres, à la Fondation Barnes et à \
Philadelphie ; celle-ci est la plus grande. Il y travaille plusieurs années, notamment \
dans l'atelier des Lauves, construit en 1902. Timide et pudique, il ne fait pas poser \
de modèles nus : il s'appuie sur des dessins anciens, des souvenirs de sculptures et \
de tableaux vus au Louvre. La toile est encore inachevée à sa mort, en octobre 1906. \
Elle passe ensuite dans des collections parisiennes, alors que la gloire posthume du \
peintre ne cesse de grandir. Le Philadelphia Museum of Art l'achète en 1937 grâce au \
fonds Wilstach."""
facture = """
La peinture est très diluée, posée en couches minces et transparentes qui laissent \
souvent voir la toile blanche. Une palette restreinte, bleus, ocres et tons chair, \
unifie corps, arbres et ciel. Les corps, allongés et simplifiés, sont cernés de \
contours bleus. La composition repose sur un grand triangle formé par les troncs, qui \
encadre les deux groupes de figures inclinées dans le même sens. Le ciel, fait de \
touches rectangulaires, est traité comme une matière aussi solide que la terre. Les \
déformations sont volontaires et servent l'architecture d'ensemble."""
details = [
  "Le clocher minuscule, au loin, entre les troncs de gauche.",
  "La nageuse au milieu de l'eau, à peine indiquée.",
  "Les contours bleus qui cernent les corps.",
  "Les visages sans traits, réduits à des ovales.",
  "Les zones où la toile blanche reste visible, preuve de l'inachèvement.",
]
themes = ["baigneuses", "nu", "nature", "arcadie", "géométrie"]
anecdote = """
Pour pouvoir sortir ses très grandes toiles de l'atelier des Lauves, Cézanne fit \
percer dans un mur une haute fente étroite. On peut toujours la voir aujourd'hui dans \
l'atelier, devenu un musée ouvert aux visiteurs."""
salle = 3
mur = "fond"
place = 2
largeur = 2.6

