# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « CÉZANNE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/cezanne/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /cezanne.
#
#  Pour ajouter une œuvre :
#    1. déposer son image (JPEG ou PNG) dans public/tableaux/cezanne/ ;
#    2. copier un bloc [[oeuvres]] ci-dessous et changer ses valeurs.
#  Au prochain push sur master, le site est reconstruit et republié tout seul.
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 4
nom_court = "Cézanne"
couleur = "#b8642a"
titre = "Cézanne, la construction de la couleur"
artiste = "Paul Cézanne"
dates = "1839–1906"
accroche = "Exposition virtuelle · Paul Cézanne"
introduction = """
Des pommes que l'on croirait taillées dans la pierre, des joueurs de cartes \
immobiles, la mer à l'Estaque et la montagne Sainte-Victoire peinte encore et \
encore : Cézanne construit le monde avec la couleur. Picasso l'appelait « notre \
père à tous »."""
vitrine = "panier-pommes.jpg"

# ─── Les salles, dans l'ordre de la visite ───────────────────────────────────

[[salles]]
nom = "Salle I · Les êtres et les choses"
theme = "1877–1895 : les portraits, les joueurs de cartes et les natures mortes, construits touche par touche."
murs = "#ece4d6"

[[salles]]
nom = "Salle II · La Provence"
theme = "1885–1904 : la mer à l'Estaque, le Château Noir et la montagne Sainte-Victoire."
murs = "#e6e8df"

[[salles]]
nom = "Salle III · Les Grandes Baigneuses"
theme = "1900–1906 : la dernière grande toile, inachevée, qui ouvre la voie au cubisme."
murs = "#e3e4ea"

# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Autoportrait"
annee = "1878–1880"
image = "autoportrait.jpg"
technique = "Huile sur toile, 60,3 × 46,9 cm"
collection = "The Phillips Collection, Washington"
note = "Un regard de biais, une tête solide comme un bloc : Cézanne se peint comme il peint une montagne."
salle = 1
mur = "gauche"
place = 1
largeur = 0.85

[[oeuvres]]
titre = "Madame Cézanne au fauteuil rouge"
annee = "vers 1877"
image = "madame-cezanne.jpg"
technique = "Huile sur toile, 72,4 × 56 cm"
collection = "Museum of Fine Arts, Boston"
note = "Hortense Fiquet, sa compagne, posée comme une nature morte dans le grand fauteuil rouge."
