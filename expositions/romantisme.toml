[exposition]
ordre = 70
nom_court = "Romantisme"
mouvement = "Romantisme"
cadre = "baroque"
couleur = "#8e2a2a"
titre = "Le Romantisme, la tempête et le rêve"
artiste = "Füssli, Blake, Goya, Friedrich, Turner, Constable, Géricault, Delacroix"
dates = "1781–1839"
accroche = "Exposition virtuelle · Musée du Louvre, Paris"
introduction = """
Entre la fin du XVIIIe siècle et le milieu du XIXe, les peintres romantiques préfèrent \
l'émotion à la règle, le rêve, la nature sauvage et l'actualité brûlante aux modèles \
antiques. Du Cauchemar de Füssli au Téméraire de Turner, la visite réunit dix œuvres \
de huit artistes, d'Angleterre, d'Espagne, d'Allemagne et de France : visions, \
guerres, naufrages, révolutions et paysages infinis. Le bâtiment s'inspire des grandes \
salles rouges du Louvre, Daru et Mollien, très hautes, où sont accrochés les immenses \
formats de la peinture française du XIXe siècle, et d'un cabinet plus intime réservé \
au paysage."""
vitrine = "radeau-meduse.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Musée du Louvre"
ville = "Paris, France"
construction = "musée ouvert en 1793"
presentation = """
Forteresse bâtie par Philippe Auguste vers 1200, puis palais des rois de France agrandi \
de règne en règne, le Louvre devient un musée sous la Révolution : le Muséum central des \
arts ouvre le 10 août 1793 dans la Grande Galerie. Napoléon III achève le palais en \
faisant construire par Louis Visconti puis Hector Lefuel, de 1852 à 1857, les ailes du \
Nouveau Louvre, dont l'aile Denon, nommée d'après Vivant Denon, premier directeur du \
musée sous Napoléon Iᵉʳ. On y monte par l'escalier Daru, au sommet duquel se dresse la \
Victoire de Samothrace. Au premier étage, les salles Daru et Mollien, aux murs rouges, \
éclairées par de hautes verrières, accueillent les très grands formats de la peinture \
française du XIXᵉ siècle, du Sacre de Napoléon de David au Radeau de la Méduse de \
Géricault et à la Liberté guidant le peuple de Delacroix. Depuis 1989, on entre au musée \
par la pyramide de verre de Ieoh Ming Pei."""
ici = """
Le bâtiment d'ARTEON reprend l'enchaînement des salles rouges de l'aile Denon. On entre \
par le sud sur le palier Daru, puis dans « Le salon Denon · Visions et cauchemars », \
carré, aux murs vieux rose. De là s'ouvrent, en enfilade, deux grandes salles hautes de \
douze mètres, peintes du même rouge : à l'ouest « La salle Daru · Goya », à l'est « La \
salle Mollien · L'histoire en marche », où attendent le Radeau de la Méduse et la \
Liberté. Au nord du salon, le cabinet des paysages, petit et bas, aux murs clairs, \
réunit Friedrich, Turner et Constable."""

