# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « MONET » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/monet/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /monet.
#
#  Pour ajouter une œuvre :
#    1. déposer son image (JPEG ou PNG) dans public/tableaux/monet/ ;
#    2. copier un bloc [[oeuvres]] ci-dessous et changer ses valeurs.
#  Au prochain push sur master, le site est reconstruit et republié tout seul.
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 2
nom_court = "Monet"
couleur = "#2f7d6d"
titre = "Monet, la lumière à l'œuvre"
artiste = "Claude Monet"
dates = "1840–1926"
accroche = "Exposition virtuelle · Claude Monet"
introduction = """
Du jardin de Ville-d'Avray aux nymphéas de Giverny, suivez soixante ans de \
peinture à la poursuite de la lumière : le soleil levant qui a donné son nom à \
l'impressionnisme, les gares et les rues pavoisées, les séries des meules et des \
cathédrales, puis l'eau et les fleurs du jardin, jusqu'à l'abstraction."""
vitrine = "nympheas.jpg"

# ─── Les salles, dans l'ordre de la visite ───────────────────────────────────

[[salles]]
nom = "Salle I · La naissance de l'impressionnisme"
theme = "1866–1875 : peindre en plein air, saisir un instant de lumière ; un tableau de 1872 donne son nom au mouvement."
murs = "#efe9dc"

[[salles]]
nom = "Salle II · La ville et les séries"
theme = "1877–1894 : la vapeur des gares, les rues en fête, puis le même motif peint à toutes les heures du jour."
murs = "#e3e6ea"

[[salles]]
nom = "Salle III · Londres et Giverny"
theme = "1903–1922 : les brumes de la Tamise, puis l'étang aux nymphéas, peint jusqu'à l'abstraction."
murs = "#e1ebe2"

# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Femmes au jardin"
annee = "1866"
image = "femmes-jardin.jpg"
technique = "Huile sur toile, 255 × 205 cm"
collection = "Musée d'Orsay, Paris"
note = "Une toile immense peinte en plein air : Monet creuse une tranchée dans le jardin pour atteindre le haut du tableau."
salle = 1
mur = "gauche"
place = 1
largeur = 1.25

