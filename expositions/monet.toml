# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « MONET » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/monet/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /monet.
#
#  Pour ajouter une œuvre :
#    1. déposer son image (JPEG ou PNG) dans public/tableaux/monet/ ;
#    2. copier un bloc [[oeuvres]] ci-dessous et changer ses valeurs.
#  Au prochain push sur master, le site est reconstruit et republié tout seul.
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 90
nom_court = "Monet"
mouvement = "Impressionnisme"
cadre = "dore"
couleur = "#2f7d6d"
titre = "Monet, la lumière à l'œuvre"
artiste = "Claude Monet"
dates = "1840–1926"
accroche = "Exposition virtuelle · Claude Monet"
introduction = """
Du jardin de Ville-d'Avray aux nymphéas de Giverny, suivez soixante ans de \
peinture à la poursuite de la lumière : le soleil levant qui a donné son nom à \
l'impressionnisme, les gares et les rues pavoisées, les séries des meules et des \
cathédrales, puis l'eau et les fleurs du jardin, jusqu'à l'abstraction."""
vitrine = "nympheas.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Musée d'Orsay"
ville = "Paris, France"
architecte = "Victor Laloux"
construction = "1898–1900"
presentation = """
Pour l'Exposition universelle de 1900, la Compagnie du chemin de fer de Paris à Orléans \
fait bâtir sur la rive gauche, face aux Tuileries, une gare et un hôtel dessinés par \
Victor Laloux. Derrière ses façades de pierre, la gare d'Orsay cache une immense halle \
de métal et de verre ; elle est inaugurée le 14 juillet 1900. Ses quais devenus trop \
courts pour les trains modernes, elle cesse de servir aux grandes lignes en 1939. Sauvée \
de la démolition, elle est transformée en musée par les architectes Renaud Bardon, \
Pierre Colboc et Jean-Paul Philippon, avec des aménagements intérieurs de Gae Aulenti, \
et ouvre en décembre 1986. La nef centrale, sous la verrière, accueille la sculpture du \
XIXᵉ siècle, et les grandes horloges rappellent la gare. Consacré aux arts de 1848 à \
1914, Orsay conserve la plus grande collection de peintures impressionnistes au monde, \
dont des dizaines de toiles de Monet, de la Gare Saint-Lazare aux Cathédrales de Rouen."""
ici = """
Le bâtiment d'ARTEON emprunte à Orsay sa nef sous verrière et à l'Orangerie la salle \
blanche des Nymphéas. On entre par le sud dans la nef des sculptures, longue de \
trente-six mètres et haute de dix, où se dressent trois sculptures américaines du XIXᵉ \
siècle. Dans sa moitié nord, deux portes se font face : à l'ouest la salle I · La \
naissance de l'impressionnisme, à l'est la salle II · La ville et les séries, aux murs \
gris bleuté. Au bout de la nef, la salle III · Les Nymphéas, large et basse, aux murs \
blancs, clôt la visite."""

