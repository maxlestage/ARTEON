# ─── Les sculptures ──────────────────────────────────────────────────────────
# modele : le fichier dans modeles/ (STL, OBJ ou glTF) ; salle ; x et z : la place du
# socle depuis le centre de la salle, en mètres ; hauteur : celle de la sculpture
# (sans le socle) ; rotation : en degrés (0 : elle regarde le sud, vers l'entrée) ;
# matiere : marbre, platre, pierre, bronze, or ou une couleur #rrggbb ; socle : sa
# hauteur en mètres (facultatif).
# Les scans sont ceux du Smithsonian, en libre accès (CC0).

[[sculptures]]
titre = "The Greek Slave (L'Esclave grecque)"
artiste = "Hiram Powers"
annee = "1843"
modele = "greek-slave.stl"
technique = "Plâtre (modèle original)"
collection = "Smithsonian American Art Museum, Washington"
note = "Le modèle en plâtre de la sculpture la plus célèbre de son temps, modelée à Florence et exposée à Londres en 1851."
salle = 1
x = 0
z = 10
hauteur = 1.66
matiere = "platre"
socle = 0.6

[[sculptures]]
titre = "The Dying Tecumseh (La Mort de Tecumseh)"
artiste = "Ferdinand Pettrich"
annee = "1856"
modele = "tecumseh.stl"
technique = "Marbre"
collection = "Smithsonian American Art Museum, Washington"
note = "Le chef shawnee, mort au combat en 1813, étendu comme un héros antique : un marbre néoclassique sculpté à Rome."
salle = 1
x = 0
z = 0
hauteur = 0.94
matiere = "marbre"
socle = 0.7

[[sculptures]]
titre = "Old Arrow Maker (Le Vieux Fabricant de flèches)"
artiste = "Edmonia Lewis"
annee = "1866–1872"
modele = "arrow-maker.stl"
technique = "Marbre"
collection = "Smithsonian American Art Museum, Washington"
note = "Par la première sculptrice afro-américaine et amérindienne reconnue : un père et sa fille, d'après le poème de Longfellow."
salle = 1
x = 0
z = -11
hauteur = 0.55
matiere = "marbre"
socle = 1.0
