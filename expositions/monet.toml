[[sculptures]]
titre = "The Greek Slave (L'Esclave grecque)"
artiste = "Hiram Powers"
annee = "1843"
modele = "greek-slave.stl"
technique = "Plâtre (modèle original)"
collection = "Smithsonian American Art Museum, Washington"
note = "Le modèle en plâtre de la sculpture la plus célèbre de son temps, modelée à Florence et exposée à Londres en 1851."
description = """
Une jeune femme nue, debout et grandeur nature, se tient dans une pose calme, le poids \
du corps porté sur une jambe, à la manière des statues antiques. Ses poignets sont \
reliés par une chaîne : une main repose sur un pilier, l'autre, abaissée, voile sa \
nudité. Le visage, détourné, s'incline sur le côté, le regard baissé, avec une \
expression de résignation sereine. Sur le pilier sont jetés ses vêtements, une étoffe \
frangée, ainsi qu'une croix et un médaillon suspendus, signes de sa foi chrétienne et \
de ses attaches familiales. Le corps est lisse, les formes pleines et douces, la \
chevelure nouée en chignon. La figure, conçue pour être contemplée de tous les côtés, \
invite le visiteur à en faire le tour."""
evocation = """
Powers donne à son œuvre un sujet précis : une jeune Grecque capturée par les Turcs \
pendant la guerre d'indépendance grecque et exposée nue sur un marché d'esclaves. Sa \
nudité, en principe inacceptable pour le public américain de l'époque, est justifiée \
par ce récit : elle est subie, non offerte, et la jeune femme reste pure par sa foi, \
que rappelle la croix. Le sculpteur insistait lui-même sur cette lecture morale. Aux \
États-Unis, l'œuvre a pris une résonance inattendue : alors que l'esclavage y est \
légal, des abolitionnistes y ont vu l'image de la condition des esclaves noirs, et \
l'ont retournée contre ceux qui admiraient la statue sans voir l'esclavage chez eux. \
Elle concentre ainsi les contradictions morales de son temps."""
histoire = """
Powers modèle la statue en argile à Florence entre 1841 et 1843, puis en tire ce \
modèle en plâtre, à partir duquel ses praticiens taillent les marbres. Le premier \
exemplaire, achevé en 1844, est acheté par un officier anglais et reste en Angleterre. \
Un autre part en tournée aux États-Unis de 1847 à 1849 : plus de cent mille visiteurs \
paient pour le voir, et des pasteurs en garantissent la moralité. Présentée au Crystal \
Palace lors de l'Exposition universelle de Londres en 1851, elle devient l'une des \
sculptures les plus célèbres du monde. Powers en fait réaliser six versions en marbre \
grandeur nature, et de nombreuses réductions. Le plâtre, resté dans l'atelier \
florentin, est acquis avec de nombreux autres modèles par le Smithsonian en 1968."""
facture = """
Comme la plupart des sculpteurs néoclassiques, Powers modèle d'abord la figure en \
argile, en tire un moulage en plâtre, puis confie la taille du marbre à des praticiens \
italiens, se réservant les finitions. Ce plâtre est donc l'original de l'œuvre, la \
matrice de toutes les versions. Les petits repères métalliques plantés à sa surface \
permettaient, grâce à un appareil de mise aux points, de reporter les mesures dans le \
bloc de marbre avec précision. La pose s'inspire directement de la Vénus de Médicis, \
que Powers pouvait voir à Florence, aux Offices, mais le modelé est plus doux et plus \
naturaliste."""
details = [
  "La chaîne qui relie les deux poignets de la jeune femme.",
  "La croix et le médaillon suspendus au pilier, à côté de ses vêtements.",
  "Les petits points métalliques semés sur le plâtre, traces de la mise aux points.",
  "Le visage tourné de côté, qui évite le regard du spectateur.",
]
themes = ["néoclassicisme", "esclavage", "nu", "captivité", "foi"]
anecdote = """
En 1851, à Londres, l'abolitionniste afro-américain William Wells Brown, lui-même \
ancien esclave, déposa près de la statue une caricature du journal Punch, « The \
Virginian Slave », montrant une esclave noire enchaînée dans la même pose."""
salle = 1
x = 0
z = 10
hauteur = 1.66
matiere = "platre"
socle = 0.6

[[sculptures]]
titre = "The Dying Tecumseh (La Mort de Tecumseh)"
artiste = "Ferdinand Pettrich"
annee = "1856"
modele = "tecumseh.stl"
technique = "Marbre"
collection = "Smithsonian American Art Museum, Washington"
note = "Le chef shawnee, mort au combat en 1813, étendu comme un héros antique : un marbre néoclassique."
description = """
Un guerrier amérindien est étendu sur le sol, le haut du corps soulevé et appuyé \
contre un rocher, comme dans un ultime effort. Sa tête s'incline ; une blessure marque \
sa tempe. Sa main droite serre encore un tomahawk, comme s'il refusait de lâcher son \
arme. Le corps, puissamment musclé et presque nu, n'est vêtu que d'un pagne et de \
quelques ornements. La figure se développe en longueur, à la manière des héros \
mourants qui occupaient les angles des frontons antiques, et invite à tourner autour \
pour en suivre les lignes. Le marbre blanc, poli avec soin, donne au corps une \
présence à la fois sensuelle et idéalisée. Aucune trace de la bataille ne l'entoure : \
le héros est seul face à sa mort."""
evocation = """
Pettrich représente Tecumseh selon les codes du héros antique, sur le modèle des \
guerriers mourants de la sculpture grecque et romaine, comme le célèbre Galate mourant \
des musées du Capitole. Ce choix fait de l'adversaire vaincu une figure noble et \
tragique. La sculpture participe ainsi au mythe du « noble sauvage » et à l'idée, très \
répandue au XIXᵉ siècle, d'une disparition inéluctable des peuples amérindiens. Les \
historiens y soulignent une ambiguïté : l'hommage rendu au courage du chef shawnee \
coexiste avec une vision qui transforme la conquête en fatalité héroïque, au moment \
même où le gouvernement américain déporte les nations indiennes à l'ouest du \
Mississippi, en application de l'Indian Removal Act de 1830."""
histoire = """
Tecumseh, chef shawnee, tente au début du XIXᵉ siècle d'unir les nations amérindiennes \
contre l'avancée des colons américains, avec son frère Tenskwatawa, dit le Prophète. \
Allié des Britanniques pendant la guerre de 1812, il est tué le 5 octobre 1813 à la \
bataille de la Thames, dans l'actuel Ontario, et son corps n'est jamais identifié avec \
certitude. Arrivé aux États-Unis en 1835, le sculpteur allemand Ferdinand Pettrich \
conçoit la figure dans les années suivantes, alors qu'il espère obtenir des commandes \
officielles à Washington. Il ne la fait tailler dans le marbre qu'en 1856, bien après \
avoir quitté l'Amérique. L'œuvre est ensuite longtemps conservée au Capitole, avant \
d'être transférée aux collections nationales, aujourd'hui le Smithsonian American Art \
Museum."""
facture = """
Formé dans l'atelier de Bertel Thorvaldsen à Rome, Pettrich applique ici la leçon \
néoclassique : anatomie idéalisée, surfaces lisses et polies, contours nets, émotion \
contenue. Le marbre blanc, sans aucune couleur, éloigne le sujet de tout réalisme \
documentaire et le rattache à l'univers de l'Antiquité. La composition allongée, en \
diagonale, conduit le regard de la main crispée sur l'arme jusqu'à la tête inclinée. \
Les éléments propres à la culture shawnee, ornements ou arme, sont réduits à quelques \
attributs, subordonnés à la beauté du nu."""
details = [
  "Le tomahawk que la main droite du guerrier serre encore.",
  "La blessure à la tempe, discrète, qui indique la cause de la mort.",
  "La musculature du torse, modelée comme celle d'un athlète antique.",
  "Le rocher sur lequel le corps prend appui, traité plus sommairement que la figure.",
]
themes = ["néoclassicisme", "amérindiens", "héros", "mort", "histoire"]
anecdote = """
Le colonel Richard Mentor Johnson se vanta d'avoir tué Tecumseh à la bataille de la \
Thames ; ce titre de gloire, jamais prouvé, l'aida à devenir vice-président des \
États-Unis de 1837 à 1841, sous Martin Van Buren."""
salle = 1
x = 0
z = 0
hauteur = 0.94
matiere = "marbre"
socle = 0.7

[[sculptures]]
titre = "Old Arrow Maker (Le Vieux Fabricant de flèches)"
artiste = "Edmonia Lewis"
annee = "1866–1872"
modele = "arrow-maker.stl"
technique = "Marbre"
collection = "Smithsonian American Art Museum, Washington"
note = "Par la première sculptrice afro-américaine et amérindienne reconnue : un père et sa fille, d'après le poème de Longfellow."
description = """
Sur un même socle, deux personnages sont assis côte à côte, formant un groupe compact. \
Le vieil homme, penché sur son ouvrage, façonne une pointe de flèche dans un éclat de \
pierre, absorbé par la précision de son geste. Près de lui, sa fille tresse une natte \
de joncs posée sur ses genoux. La scène se passe, selon le poème qui l'inspire, au \
pays des Dakotas, devant la tente du fabricant de flèches, non loin des chutes de \
Minnehaha. Les deux figures, l'une concentrée sur son travail, l'autre plus rêveuse, \
s'inscrivent dans une silhouette pyramidale. Le format est modeste, une cinquantaine \
de centimètres de haut, ce qui invite à s'approcher pour observer les mains et les \
outils. Rien de dramatique : c'est une scène de la vie quotidienne, empreinte de calme \
et de tendresse."""
evocation = """
L'œuvre illustre un épisode du Chant de Hiawatha (1855) de Henry Wadsworth Longfellow, \
poème alors immensément populaire : Minnehaha, « Eau-qui-rit », vit auprès de son \
père, le vieux fabricant de flèches, avant que le héros Hiawatha ne vienne la demander \
en mariage. Lewis choisit un instant paisible, sans le héros, centré sur le lien entre \
un père et sa fille et sur le travail des mains. Pour une artiste d'ascendance ojibwée \
par sa mère, ce sujet était aussi une manière de représenter les peuples autochtones \
avec dignité, loin des images de sauvages menaçants ou de guerriers mourants. Les \
historiens rappellent cependant qu'elle passe par le filtre d'un poème écrit par un \
Blanc, à l'idéalisation toute romantique."""
histoire = """
Edmonia Lewis s'installe à Rome vers 1865-1866 et y ouvre son atelier. Elle trouve \
rapidement dans le poème de Longfellow une source d'inspiration et réalise plusieurs \
bustes et groupes consacrés à Hiawatha et à Minnehaha, qui plaisent particulièrement \
aux voyageurs et collectionneurs américains de passage. Le groupe du Vieux Fabricant \
de flèches est conçu dès 1866, puis taillé dans le marbre à plusieurs reprises ; cet \
exemplaire date de 1872. L'artiste rencontre Longfellow lors de son séjour à Rome, à \
la fin des années 1860, et réalise ensuite son buste, conservé à l'université Harvard. \
Ces sujets amérindiens assurent à l'atelier de Lewis une clientèle fidèle pendant près \
de deux décennies."""
facture = """
Contrairement à beaucoup de sculpteurs installés à Rome, qui confiaient la taille de \
leurs marbres à des praticiens italiens, Lewis tenait à réaliser elle-même une grande \
partie du travail, notamment pour qu'on ne puisse contester que ses œuvres étaient \
bien de sa main. Le groupe obéit aux principes du néoclassicisme : marbre blanc, \
surfaces lisses, gestes mesurés. Mais l'artiste y introduit des détails précis, \
coiffures, vêtements ou outils, qui ancrent la scène dans une culture particulière. Le \
petit format convient à une clientèle privée."""
details = [
  "Les mains du vieil homme, occupées à tailler une pointe de flèche.",
  "La natte de joncs que tresse la jeune femme sur ses genoux.",
  "Les coiffures et les vêtements, sculptés avec un grand soin du détail.",
  "La forme pyramidale du groupe, qui unit le père et la fille.",
]
themes = ["amérindiens", "famille", "littérature", "néoclassicisme", "travail"]
anecdote = """
La Mort de Cléopâtre, présentée par Lewis à Philadelphie en 1876, a connu un destin \
étonnant : elle a longtemps servi de monument funéraire à un cheval de course nommé \
Cleopatra, près de Chicago, avant d'être redécouverte puis donnée au Smithsonian en \
1994."""
salle = 1
x = 0
z = -11
hauteur = 0.55
matiere = "marbre"
socle = 1.0

# ─── Les artistes ───────────────────────────────────────────────────────────

[[artistes]]
nom = "Claude Monet"
vie = "Paris, 14 novembre 1840 – Giverny, 5 décembre 1926"
biographie = """
Né à Paris, Oscar-Claude Monet grandit au Havre, où il se fait d'abord connaître par \
ses caricatures. Vers 1857-1858, le peintre Eugène Boudin l'initie à la peinture en \
plein air, qui deviendra la règle de toute sa vie. À Paris, il fréquente l'Académie \
Suisse, où il rencontre Camille Pissarro, puis, après un service militaire en Algérie, \
l'atelier de Charles Gleyre, où il se lie avec Renoir, Sisley et Bazille. Ses \
premières marines sont admises au Salon en 1865, mais ses toiles plus audacieuses sont \
souvent refusées, et la pauvreté le poursuit pendant vingt ans. Il épouse en 1870 \
Camille Doncieux, mère de son fils Jean, puis se réfugie à Londres pendant la guerre, \
où il rencontre le marchand Paul Durand-Ruel. Installé à Argenteuil, il organise avec \
ses amis la première exposition impressionniste en 1874. Camille meurt en 1879, un an \
et demi après la naissance de leur second fils, Michel. Monet vit ensuite avec Alice \
Hoschedé et ses enfants, s'installe à Giverny en 1883 et épouse Alice en 1892. Les \
séries des années 1890 lui apportent enfin le succès et l'aisance. Il consacre ses \
trente dernières années à son jardin d'eau et aux Nymphéas, malgré la mort d'Alice en \
1911, celle de son fils Jean en 1914 et une cataracte qui menace sa vue. Au lendemain \
de l'armistice de 1918, il propose à l'État ses Grandes Décorations ; elles sont \
installées à l'Orangerie en 1927, quelques mois après sa mort."""
style = """
Monet est le peintre qui a poussé le plus loin le principe impressionniste : peindre \
non pas les objets, mais la lumière et l'atmosphère qui les enveloppent à un instant \
donné. Sa touche fragmentée, faite de virgules de couleurs juxtaposées, ses ombres \
colorées et son quasi-abandon du noir rendent ses toiles immédiatement \
reconnaissables. À partir de 1890, il invente la série, peignant le même motif à \
différentes heures et saisons, pour montrer que la perception change sans cesse. Dans \
ses dernières années, les Nymphéas, sans horizon ni repère, ouvrent la voie à la \
peinture abstraite ; les expressionnistes abstraits américains, après 1945, verront en \
lui un précurseur."""

[[artistes]]
nom = "Hiram Powers"
vie = "Woodstock (Vermont), 29 juillet 1805 – Florence, 27 juin 1873"
biographie = """
Fils de fermiers du Vermont, Hiram Powers suit sa famille dans l'Ohio et grandit à \
Cincinnati, alors ville pionnière en plein essor. Ingénieux et habile de ses mains, il \
travaille d'abord comme mécanicien, puis au Western Museum de Cincinnati, où il \
fabrique et anime des figures de cire, dont une saisissante évocation de l'Enfer de \
Dante. Il apprend le modelage auprès d'un sculpteur de la ville et se découvre un \
talent pour le portrait. Soutenu par le riche mécène Nicholas Longworth, il part en \
1834 pour Washington, où il réalise les bustes de nombreuses personnalités, dont le \
président Andrew Jackson. En 1837, il s'installe à Florence, grand centre de la \
sculpture néoclassique, où il restera jusqu'à sa mort. Son atelier devient une étape \
obligée pour les voyageurs américains et anglais, et il se lie d'amitié avec les \
poètes Elizabeth Barrett Browning et Robert Browning. Le triomphe de L'Esclave \
grecque, exposée en Europe et aux États-Unis, fait de lui le sculpteur américain le \
plus célèbre de son temps. Il produit ensuite de nombreux bustes et des figures \
idéales, comme le Pêcheur, Proserpine, Ève ou la figure allégorique de l'Amérique. \
Inventeur à ses heures, il met au point des outils pour le travail du marbre. Il meurt \
à Florence en 1873 et repose au cimetière des Anglais."""
style = """
Powers est l'un des grands représentants du néoclassicisme américain. Il emprunte à \
l'Antiquité ses idéaux de beauté, de calme et de pureté des formes, mais y ajoute un \
modelé souple et naturaliste, une attention à la texture de la peau qui doit beaucoup \
à sa pratique du portrait. Ses bustes, d'une grande ressemblance, sont très \
recherchés. Ses figures idéales associent le nu antique à des récits moraux ou \
chrétiens, ce qui les rend acceptables pour le public puritain de son pays. L'Esclave \
grecque a largement contribué à faire admettre la sculpture et le nu aux États-Unis, \
et a ouvert la voie aux nombreux sculpteurs américains venus travailler en Italie."""

[[artistes]]
nom = "Ferdinand Pettrich"
vie = "Dresde, 1798 – Rome, 1872"
biographie = """
Fils du sculpteur Franz Pettrich, Ferdinand Pettrich naît à Dresde, en Saxe, et se \
forme d'abord auprès de son père. Il part ensuite pour Rome, où il devient l'élève du \
sculpteur danois Bertel Thorvaldsen, l'une des figures majeures du néoclassicisme \
européen. En 1835, il émigre aux États-Unis, espérant y trouver des commandes \
publiques dans une jeune nation qui orne alors ses édifices officiels, à commencer par \
le Capitole. Il travaille à Washington et à Philadelphie, mais ses projets officiels \
n'aboutissent guère. Durant ces années, il s'intéresse aux délégations amérindiennes \
venues négocier dans la capitale et réalise des portraits de leurs chefs, ainsi que \
des figures inspirées de leur histoire, dont celle de Tecumseh. Déçu par l'Amérique, \
il gagne le Brésil au début des années 1840 et travaille pour la cour de l'empereur \
Pierre II, pour qui il exécute des portraits et des décors. Il regagne finalement Rome \
dans les années 1850 et y finit ses jours. Son œuvre, partagée entre trois continents, \
témoigne de la circulation des artistes néoclassiques européens au XIXᵉ siècle, de \
leur quête de commandes dans les nations nouvelles et de la fascination de l'époque \
pour les peuples du Nouveau Monde."""
style = """
Élève de Thorvaldsen, Pettrich reste fidèle à l'idéal néoclassique : nus idéalisés, \
marbre poli, poses inspirées de la statuaire antique, émotion retenue. Son originalité \
tient au choix de ses sujets : il représente des Amérindiens qu'il a pu observer à \
Washington, en leur appliquant les codes du héros grec ou romain. Ce mélange \
d'observation et d'idéalisation, typique de son époque, contribue à fixer l'image \
romantique de l'« Indien » héroïque et condamné. Son œuvre, peu connue du grand \
public, intéresse aujourd'hui les historiens pour ce qu'elle révèle du regard européen \
sur l'Amérique."""

[[artistes]]
nom = "Edmonia Lewis"
vie = "Probablement Greenbush (État de New York), vers 1844 – Londres, 17 septembre 1907"
biographie = """
Edmonia Lewis naît d'un père d'origine afro-haïtienne et d'une mère d'ascendance \
ojibwée et africaine. Orpheline très jeune, elle est élevée en partie par la famille \
de sa mère, qui la nomme « Feu sauvage ». Grâce au soutien de son frère, elle entre en \
1859 à l'Oberlin College, dans l'Ohio, l'un des rares établissements à accueillir des \
femmes et des étudiants noirs. En 1862, elle y est accusée d'avoir empoisonné deux \
camarades blanches ; défendue par l'avocat noir John Mercer Langston, elle est \
acquittée, mais subit une violente agression et doit quitter l'école sans diplôme. À \
Boston, elle se forme auprès du sculpteur Edward Brackett et se fait connaître par des \
portraits d'abolitionnistes, notamment un buste du colonel Robert Gould Shaw, dont la \
vente des copies finance son départ pour l'Europe. À Rome, où elle s'installe vers \
1865-1866, elle fréquente le cercle des sculptrices américaines réunies autour de \
Harriet Hosmer. Elle y crée des œuvres inspirées de l'histoire afro-américaine, comme \
Forever Free, qui célèbre l'émancipation, et des sujets amérindiens tirés de \
Longfellow. Sa Mort de Cléopâtre est l'une des sensations de l'Exposition du \
centenaire, à Philadelphie, en 1876. Convertie au catholicisme, elle reçoit des \
commandes de riches visiteurs, jusqu'à ce que le goût néoclassique passe de mode. Ses \
dernières années sont mal connues ; ce n'est qu'en 2011 que des recherches ont établi \
qu'elle était morte à Londres en 1907."""
style = """
Edmonia Lewis travaille dans la tradition néoclassique alors dominante à Rome : marbre \
blanc, surfaces lisses, références à l'Antiquité et à la littérature. Mais elle y fait \
entrer des sujets presque absents de la sculpture de son temps : l'émancipation des \
esclaves, la dignité des femmes noires, la vie des peuples amérindiens. En \
revendiquant la maîtrise de tout le processus, jusqu'à la taille du marbre, elle \
affirme pleinement son statut d'artiste. Première sculptrice d'ascendance africaine et \
amérindienne à obtenir une reconnaissance internationale, longtemps oubliée, elle est \
aujourd'hui redécouverte comme une figure pionnière, dont l'œuvre interroge les \
rapports entre art, identité et histoire américaine."""
