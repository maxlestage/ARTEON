# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Femmes au jardin"
annee = "1866"
image = "femmes-jardin.jpg"
technique = "Huile sur toile, 255 × 205 cm"
collection = "Musée d'Orsay, Paris"
note = "Une toile immense peinte en plein air : Monet creuse une tranchée dans le jardin pour atteindre le haut du tableau."
description = """
Quatre jeunes femmes en robes d'été se tiennent dans un coin de jardin inondé de \
soleil. À gauche, l'une est assise dans l'herbe, sa vaste robe claire à motifs étalée \
en corolle autour d'elle ; elle tient une ombrelle qui jette sur son visage une ombre \
colorée, et un bouquet repose sur ses genoux. Derrière elle, deux autres femmes se \
tiennent debout près d'un tronc d'arbre, des fleurs à la main ; l'une plonge son \
visage dans le bouquet qu'elle respire. À droite, une quatrième s'élance vers un \
massif de rosiers pour y cueillir une fleur, saisie en plein mouvement. Une allée de \
sable traverse le premier plan en courbe, barrée par l'ombre des feuillages. Le fond \
est fermé par un épais rideau de verdure : tout le regard se concentre sur la lumière \
qui tombe sur les étoffes blanches."""
evocation = """
La toile ne raconte rien : ni anecdote, ni épisode historique, ni allégorie. C'est \
précisément ce qui la rendait déroutante en 1867. Monet transpose ici, dans un format \
immense jusque-là réservé aux sujets d'histoire, une simple scène de la vie moderne : \
des jeunes femmes de la bourgeoisie, habillées à la dernière mode, par un après-midi \
d'été. Le véritable sujet est la lumière qui filtre à travers les feuilles et se pose \
sur les tissus. Les historiens y voient une réponse ambitieuse au Déjeuner sur l'herbe \
de Manet et aux grandes figures de Courbet, avec une exigence nouvelle : tout peindre \
sur le motif. Les visages, peu individualisés, comptent moins que l'effet d'ensemble ; \
Camille, la compagne du peintre, aurait posé pour plusieurs des figures, si bien que \
la toile semble montrer une même jeune femme sous divers angles."""
histoire = """
Monet commence la toile au printemps 1866 dans le jardin d'une maison louée à \
Ville-d'Avray, près de Paris, après avoir renoncé à achever son gigantesque Déjeuner \
sur l'herbe. Décidé à tout exécuter en plein air, il la poursuit pendant l'été, puis \
la termine à Honfleur, où il s'est replié pour fuir ses créanciers. Présentée au Salon \
de 1867, elle est refusée par le jury. Son ami Frédéric Bazille, plus fortuné, \
l'achète pour l'aider. Après la mort de Bazille au combat en 1870, la toile revient à \
Monet par l'intermédiaire de Manet, et le peintre la conserve pendant un demi-siècle. \
En 1921, à l'initiative de son ami Georges Clemenceau, l'État la lui achète : un geste \
de reconnaissance envers le vieux maître, longtemps rejeté par les institutions. \
Passée par le Louvre, elle est exposée au musée d'Orsay depuis 1986."""
facture = """
Monet travaille entièrement sur le motif, ce qui l'oblige à attendre le retour du \
soleil pour retrouver les mêmes effets. La lumière est construite par contrastes \
francs : blancs éclatants des robes au soleil, ombres non pas grises mais teintées de \
bleu, de vert et de mauve. Sur le visage de la femme assise, l'ombre portée de \
l'ombrelle prend la couleur du tissu, un effet qu'il reprendra souvent. Les \
silhouettes, d'un modelé encore ferme, doivent beaucoup aux gravures de mode du \
temps ; les feuillages, eux, sont posés en larges taches juxtaposées, sans dessin \
préalable."""
details = [
  "L'ombre colorée que l'ombrelle projette sur le visage de la femme assise.",
  "Les taches de soleil qui percent le feuillage et tachettent l'allée de sable.",
  "La robe à motifs de la femme assise, déployée dans l'herbe comme une corolle.",
  "À droite, la main tendue vers une rose, figée en plein élan.",
  "Le bouquet porté au visage, qui cache presque les traits d'une des jeunes femmes.",
]
themes = ["jardin", "plein air", "lumière", "mode", "été"]
anecdote = """
Lorsque l'État achète la toile en 1921, il la paie 200 000 francs à un Monet devenu \
célèbre ; cinquante-cinq ans plus tôt, Bazille l'avait acquise pour 2 500 francs, \
réglés par petites mensualités afin de soutenir son ami sans le sou."""
salle = 2
mur = "ouest"
place = 1
largeur = 1.8

[[oeuvres]]
titre = "La Pie"
annee = "1868–1869"
image = "la-pie.jpg"
technique = "Huile sur toile, 89 × 130 cm"
collection = "Musée d'Orsay, Paris"
note = "Un paysage de neige près d'Étretat, où les ombres sont bleues : le Salon le refuse."
description = """
Un champ couvert de neige s'étend sous un ciel pâle. Une clôture de branchages tressés \
traverse la toile, interrompue à gauche par une petite barrière de bois ; sur le \
montant de celle-ci est perchée une pie, seule tache noire de toute la composition. \
Derrière la clôture, à droite, se dressent des maisons basses aux toits chargés de \
neige, entourées d'arbres dont les branches ploient sous le poids. Le soleil, bas sur \
l'horizon, éclaire la scène par l'arrière : la haie projette sur la neige des ombres \
qui s'allongent jusqu'au premier plan. La partie inférieure du tableau n'est qu'une \
vaste étendue blanche, à peine modelée par les creux et les traces. Aucun personnage, \
aucun mouvement : seulement le paysage engourdi par le froid, les arbres immobiles et \
l'oiseau aux aguets."""
evocation = """
La Pie est une méditation sur le silence et le froid, mais aussi sur la couleur de la \
lumière. Monet y montre que la neige n'est jamais simplement blanche : elle se teinte \
de jaune là où le soleil la touche, de bleu et de violet dans l'ombre. Cette \
observation, devenue banale, déroute alors un public habitué aux ombres brunes ou \
grises de la peinture d'atelier. La pie, petit accent noir posé sur la barrière, fixe \
le regard et donne l'échelle de l'immensité blanche ; on a pu y voir une présence \
discrète du vivant dans un monde figé, comme une note isolée dans une partition. La \
toile dit aussi la situation du jeune Monet : un peintre aux ressources précaires, \
installé loin de Paris, qui cherche sa voie à l'écart des sujets attendus par le \
Salon."""
histoire = """
Monet peint la toile pendant l'hiver 1868-1869, aux environs d'Étretat, où il s'est \
installé avec Camille et leur fils Jean, né en août 1867. Il bénéficie alors du \
soutien d'un armateur du Havre, Louis-Joachim Gaudibert, qui lui a commandé le \
portrait de son épouse. Le paysage de neige est un genre que Gustave Courbet a remis à \
l'honneur, et Monet s'y consacre avec passion pendant ces hivers normands. Envoyée au \
Salon de 1869, la toile est rejetée par le jury. Elle reste ensuite pendant plus d'un \
siècle dans des collections particulières, peu vue du public et absente des grands \
récits de l'impressionnisme. Elle n'entre dans les collections nationales qu'en 1984, \
à la suite d'un achat de l'État, et rejoint le musée d'Orsay lors de son ouverture en \
1986."""
facture = """
Toute la toile repose sur une gamme restreinte de blancs, mais aucun n'est pur : Monet \
les mêle de jaune, de rose, de bleu et de lilas selon leur exposition à la lumière. \
Les ombres sont posées en bleu franc, sans noir. La touche varie selon les matières : \
épaisse et crémeuse pour la neige tassée du premier plan, plus fine et nerveuse pour \
les branches couvertes de givre. La composition, très horizontale, est rythmée par la \
ligne de la clôture et par la verticale de la barrière, sur laquelle se détache \
l'unique point sombre de l'oiseau."""
details = [
  "La pie, perchée sur le montant de la barrière, seul élément noir du tableau.",
  "Les ombres bleues de la clôture, étirées sur la neige.",
  "La lumière dorée du soleil d'hiver qui frappe le sommet des haies.",
  "Les toits des maisons, à droite, à demi ensevelis sous la neige.",
]
themes = ["neige", "hiver", "paysage", "ombres colorées", "normandie"]
anecdote = """
Monet a peint plus d'une centaine de paysages de neige au cours de sa vie. En janvier \
1880, à Vétheuil, il peint même la Seine prise par les glaces, puis la débâcle, quand \
les blocs se brisent et dérivent sur le fleuve."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Impression, soleil levant"
annee = "1872"
image = "impression-soleil-levant.jpg"
technique = "Huile sur toile, 48 × 63 cm"
collection = "Musée Marmottan Monet, Paris"
note = "Le port du Havre dans la brume. Un critique moqueur tire de son titre le nom d'« impressionnistes »."
description = """
Le port du Havre au petit matin, enveloppé d'une brume bleu-gris. Au centre, un petit \
soleil orange, net comme une pastille, monte au-dessus de l'eau ; son reflet se brise \
en une colonne de courts traits orangés qui descend vers nous. Au premier plan, une \
barque sombre, portant deux silhouettes, glisse sur l'eau ; deux autres embarcations, \
plus pâles, s'effacent derrière elle. À l'arrière-plan, on devine les mâts des \
voiliers, les grues du port et des cheminées dont la fumée se mêle au brouillard. Le \
ciel et l'eau se confondent presque, dans les mêmes tons de bleu, de gris et de rose \
orangé : il n'y a ni ligne d'horizon nette ni détail précis, seulement des formes qui \
émergent peu à peu de la lumière naissante."""
evocation = """
La toile saisit un moment fugitif, celui où le soleil perce la brume, et en fait le \
sujet même du tableau. Le titre le dit : il ne s'agit pas d'une vue du Havre, mais \
d'une impression, c'est-à-dire de la sensation d'un instant. Pour de nombreux \
historiens, l'œuvre est aussi une image de la modernité : un port industriel, ses \
grues et ses fumées, au lendemain de la guerre de 1870, dans une France qui se \
reconstruit. On y a vu un symbole d'espoir, le soleil se levant sur un pays meurtri, \
même si Monet ne l'a jamais présentée ainsi. Devenue l'emblème d'un mouvement entier, \
elle résume l'ambition impressionniste : peindre non pas les choses, mais la lumière \
et l'air qui les enveloppent, dans le temps qui passe."""
histoire = """
Monet peint la toile en 1872 depuis une chambre d'hôtel donnant sur l'avant-port du \
Havre, la ville de son enfance. Il l'expose à Paris le 15 avril 1874, boulevard des \
Capucines, dans l'ancien atelier du photographe Nadar, lors de la première exposition \
du groupe qui deviendra les impressionnistes. Il racontera plus tard qu'on lui demanda \
un titre pour le catalogue et qu'il proposa simplement « Impression ». Le 25 avril, \
Louis Leroy publie dans Le Charivari son article moqueur, « L'Exposition des \
impressionnistes ». La toile appartient ensuite à Ernest Hoschedé, à la vente duquel \
le médecin et collectionneur Georges de Bellio l'acquiert en 1878. Sa fille et son \
gendre, Victorine et Eugène Donop de Monchy, la donnent au musée Marmottan en 1940. \
Volée en 1985, elle est retrouvée en Corse en 1990."""
facture = """
La peinture est posée en couches minces et fluides, si diluées que la toile apparaît \
par endroits. Quelques coups de pinceau suffisent à figurer une barque ou un mât ; \
l'eau est faite de touches horizontales rapides, le reflet du soleil de petites \
virgules orange, plus épaisses. Monet travaille vite, pour fixer un effet qui ne dure \
que quelques minutes. La gamme se réduit au bleu-gris et à l'orange, deux couleurs \
complémentaires qui s'exaltent l'une l'autre. On y a vu le souvenir de Turner, dont \
Monet a vu les toiles à Londres en 1870-1871, et celui des estampes japonaises dans la \
simplification des formes."""
details = [
  "Le disque orange du soleil, posé presque à plat sur le ciel gris.",
  "Le reflet du soleil, fait de quelques traits orangés superposés sur l'eau.",
  "Les deux silhouettes dans la barque du premier plan, réduites à des taches sombres.",
  "À gauche, les mâts et les grues qui se dissolvent dans la brume.",
  "La signature et la date, « Claude Monet 72 », en bas à gauche.",
]
themes = ["port", "brume", "aube", "soleil", "modernité"]
anecdote = """
En 2014, l'astronome américain Donald Olson, en croisant la hauteur du soleil, les \
horaires des marées et les relevés météorologiques, a proposé de dater précisément la \
scène du 13 novembre 1872, vers 7 h 35 du matin."""
salle = 2
mur = "ouest"
place = 3
largeur = 1.3

[[oeuvres]]
titre = "Coquelicots"
annee = "1873"
image = "coquelicots.jpg"
technique = "Huile sur toile, 50 × 65 cm"
collection = "Musée d'Orsay, Paris"
note = "Près d'Argenteuil, Camille et leur fils Jean traversent un champ semé de taches rouges."
description = """
Par une journée d'été, une prairie vallonnée descend en pente douce vers nous. À \
gauche, une large coulée de coquelicots rouges traverse l'herbe en diagonale. Au \
premier plan, une femme en robe sombre, une ombrelle à la main, avance en compagnie \
d'un petit garçon coiffé d'un chapeau de paille, à demi plongé dans les hautes herbes. \
Plus haut, près de la crête, un second couple, une femme à l'ombrelle et un enfant, \
descend la colline. À droite, une rangée d'arbres ferme l'horizon, et une maison se \
devine entre leurs feuillages. Le ciel, très vaste, occupe près de la moitié de la \
toile ; il est traversé de nuages blancs et cotonneux. Toute la scène respire la \
chaleur et la lenteur d'un après-midi de flânerie à la campagne."""
evocation = """
Le tableau célèbre un bonheur simple : une promenade en famille dans la campagne \
d'Argenteuil, quelques années après la guerre et la Commune. Les deux couples, en haut \
et en bas de la colline, ont souvent été lus comme les mêmes promeneurs à deux moments \
de leur marche ; le tableau suggérerait ainsi l'écoulement du temps, à la manière \
d'une séquence. Les coquelicots, fleurs sauvages et éphémères, renforcent cette \
impression de fugacité. Monet ne cherche ni récit ni symbole appuyé : les personnages \
sont presque des taches de couleur parmi d'autres, fondus dans le paysage. C'est la \
sensation d'un été lumineux qui compte, et l'image d'une vie paisible que le peintre, \
pourtant souvent à court d'argent, connaît alors à Argenteuil."""
histoire = """
Monet s'installe à Argenteuil, au bord de la Seine, à la fin de 1871, après des \
séjours à Londres et aux Pays-Bas. Il y vit jusqu'en 1878 avec Camille et Jean, et \
cette période est l'une des plus fécondes de sa carrière ; ses amis Renoir, Sisley ou \
Manet viennent y peindre à ses côtés. Les Coquelicots sont peints dans les environs \
pendant l'été 1873. Au printemps suivant, la toile figure à la première exposition des \
impressionnistes, en 1874, aux côtés d'Impression, soleil levant. Elle passe ensuite \
dans plusieurs collections, jusqu'à celle du peintre, historien d'art et \
collectionneur Étienne Moreau-Nélaton, qui la donne au musée du Louvre en 1906 avec \
l'ensemble de ses tableaux modernes. Elle est exposée au musée d'Orsay depuis 1986."""
facture = """
Monet construit la toile par oppositions de couleurs plutôt que par le dessin. Les \
coquelicots sont de simples taches de rouge vif posées sur le vert de l'herbe, couleur \
complémentaire qui les fait vibrer ; leur taille diminue avec l'éloignement, ce qui \
creuse l'espace. La diagonale des fleurs, qui relie les deux couples, structure toute \
la composition. Les figures sont esquissées en quelques touches, le visage de l'enfant \
réduit à une tache claire. Le ciel, peint à coups de brosse larges et mobiles, \
contraste avec la touche plus menue et serrée de la prairie."""
details = [
  "L'ombrelle de la femme du premier plan, qui se détache sur le ciel.",
  "Le second couple, en haut de la pente, réduit à deux silhouettes.",
  "Les coquelicots, simples points rouges, sans pétales ni tiges dessinés.",
  "La maison qui se devine entre les arbres, sur la droite.",
]
themes = ["coquelicots", "campagne", "famille", "été", "promenade"]
anecdote = """
La donation faite au Louvre en 1906 par Étienne Moreau-Nélaton comprenait aussi Le \
Déjeuner sur l'herbe de Manet : la toile scandaleuse du Salon des refusés de 1863 et \
la paisible promenade de Monet sont entrées ensemble dans les collections nationales."""
salle = 2
mur = "ouest"
place = 4
largeur = 1.3

[[oeuvres]]
titre = "La Promenade, la femme à l'ombrelle"
annee = "1875"
image = "femme-ombrelle.jpg"
technique = "Huile sur toile, 100 × 81 cm"
collection = "National Gallery of Art, Washington"
note = "Camille et Jean vus d'en bas, contre le ciel : le vent, les nuages et l'ombre verte de l'ombrelle."
description = """
Une jeune femme vêtue de blanc se tient au sommet d'un talus fleuri, vue d'en bas, \
comme si le peintre était assis dans l'herbe. Elle tient une ombrelle inclinée et \
tourne vers nous un visage à demi masqué par un voile. Le vent soulève ce voile et les \
plis de sa robe, et couche les herbes à ses pieds. Un peu en retrait, derrière la \
crête, un petit garçon coiffé d'un chapeau rond n'apparaît qu'à mi-corps. La \
silhouette de la femme se détache en contre-jour sur un ciel bleu traversé de nuages \
blancs, qui occupe presque toute la surface du tableau. Sa robe, dans l'ombre, se \
teinte de bleus et de jaunes, et le vert de la prairie remonte en reflets dans le \
tissu. La ligne d'horizon est si basse qu'on ne voit rien du paysage alentour."""
evocation = """
Le tableau a la légèreté d'un instantané familial : Camille et Jean, la femme et le \
fils du peintre, surpris au cours d'une promenade. Le point de vue en contre-plongée \
donne pourtant à la jeune femme une présence presque monumentale, comme une figure \
dressée contre le ciel. Tout dit le mouvement et l'instant qui passe : le vent, les \
nuages, le regard tourné vers le peintre. On y a vu l'expression d'un bonheur conjugal \
paisible ; la suite donne à la toile une résonance mélancolique, puisque Camille meurt \
quatre ans plus tard, en 1879, à trente-deux ans. Le tableau dit aussi l'ambition de \
Monet de peindre la figure humaine en plein air, non pas posée en atelier, mais \
baignée et presque dissoute dans la lumière."""
histoire = """
Monet peint la toile à Argenteuil pendant l'été 1875, dans les prairies voisines de la \
maison où il vit avec Camille et Jean, alors âgé de sept ans. Il la présente au \
printemps 1876 à la deuxième exposition des impressionnistes, organisée chez le \
marchand Paul Durand-Ruel, rue Le Peletier. La presse se montre encore très hostile à \
ces toiles jugées bâclées, mais ce type de figure en plein air devient l'une des \
signatures du peintre. Le tableau quitte plus tard la France pour les États-Unis. Il \
appartient à Paul Mellon, fils du banquier Andrew Mellon, fondateur de la National \
Gallery of Art, et à son épouse Rachel, dite Bunny ; le couple le donne au musée de \
Washington en 1983, parmi de nombreuses œuvres françaises de sa collection."""
facture = """
La toile est peinte avec une rapidité visible : touches larges et souples pour le \
ciel, petits coups de pinceau vifs et entrecroisés pour l'herbe secouée par le vent. \
Monet joue du contre-jour : la figure, éclairée par-derrière, n'est jamais vraiment \
blanche, mais nuancée de bleus, de jaunes et de verts renvoyés par le ciel et la \
prairie. Le visage n'est qu'esquissé, à peine distinct sous le voile. La \
contre-plongée et l'horizon très bas isolent la silhouette contre le ciel, un cadrage \
audacieux pour l'époque, qui rappelle les partis pris des estampes japonaises."""
details = [
  "Le voile qui flotte devant le visage de Camille, soulevé par le vent.",
  "Jean, à demi caché derrière le talus, qui regarde vers le peintre.",
  "Les touches de jaune semées dans l'herbe, au pied de la jeune femme.",
  "Les reflets verts de la prairie qui colorent le bas de la robe blanche.",
]
themes = ["portrait", "vent", "ciel", "famille", "plein air"]
anecdote = """
En 1886, onze ans plus tard, Monet reprend le même motif à Giverny avec Suzanne \
Hoschedé, la fille de sa compagne Alice : il en tire deux toiles, aujourd'hui au musée \
d'Orsay, où le visage du modèle reste presque effacé."""
salle = 2
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "La Gare Saint-Lazare"
annee = "1877"
image = "gare-saint-lazare.jpg"
technique = "Huile sur toile, 75 × 104 cm"
collection = "Musée d'Orsay, Paris"
note = "Sous la verrière, la vapeur des locomotives devient lumière : Monet en peint douze versions."
description = """
On se trouve sous la grande halle de la gare Saint-Lazare, à Paris. Une charpente \
métallique à deux pentes, garnie de verrières, encadre la scène comme un immense \
triangle. Au centre, une locomotive noire avance vers nous en crachant un nuage de \
vapeur blanche et bleutée qui monte jusqu'à la verrière. De part et d'autre, d'autres \
trains stationnent le long des quais, où circulent de petites silhouettes de voyageurs \
et d'employés. Au premier plan, les rails convergent vers le spectateur. Au fond, \
au-delà de la halle ouverte, apparaissent dans la lumière les façades des immeubles du \
quartier de l'Europe, à demi voilées par la fumée. Tout contraste : l'ombre de la \
halle et l'éclat du jour, la lourdeur des machines et la légèreté de la vapeur."""
evocation = """
Peindre une gare en 1877, c'est choisir le motif le plus moderne qui soit : le chemin \
de fer, symbole de vitesse, d'industrie et de progrès. Là où les peintres du Salon \
cherchent encore la beauté dans l'Antiquité ou la mythologie, Monet la trouve dans la \
fumée des locomotives et le fer des verrières. Émile Zola, défenseur des \
impressionnistes, salue ces toiles et estime que les artistes doivent trouver la \
poésie des gares comme leurs pères ont trouvé celle des forêts et des fleuves. La \
vapeur joue ici le rôle que tiennent ailleurs les nuages ou la brume : une matière \
changeante, presque immatérielle, qui capte la lumière. Ce n'est pas la machine que \
l'on admire, mais l'atmosphère qu'elle crée, un paysage urbain recomposé par la \
lumière."""
histoire = """
Au début de 1877, Monet, qui vit encore à Argenteuil, loue un petit pied-à-terre rue \
de Moncey, non loin de la gare, et obtient l'autorisation de peindre à l'intérieur de \
celle-ci et le long des voies. En quelques mois, il réalise une série de vues, depuis \
les quais, sous la halle ou au pied du pont de l'Europe. En avril, il en présente \
plusieurs à la troisième exposition impressionniste, où elles retiennent l'attention \
de la critique. Celle-ci est acquise par le peintre et collectionneur Gustave \
Caillebotte, ami et soutien financier du groupe. À sa mort en 1894, Caillebotte lègue \
sa collection à l'État ; après de longues discussions, une partie seulement est \
acceptée, dont cette toile, exposée au musée du Luxembourg à partir de 1897, puis au \
Louvre et enfin au musée d'Orsay."""
facture = """
Monet ne décrit pas la gare en ingénieur : les lignes de la charpente, nettes et \
géométriques, servent de cadre fixe à tout ce qui bouge. À l'intérieur de ce triangle, \
la vapeur est peinte en touches épaisses et tourbillonnantes de blanc, de bleu, de \
rose et de gris, posées en pleine pâte. Les locomotives sont des masses sombres sans \
détail mécanique, les voyageurs de simples virgules. Le contraste entre l'ombre de la \
halle et la lumière éclatante du fond crée la profondeur, tandis que la fumée unifie \
l'ensemble."""
details = [
  "La vapeur bleutée qui monte jusqu'à la verrière et la rend presque transparente.",
  "Les voyageurs et les employés, réduits à quelques touches sombres sur le quai.",
  "Les immeubles ensoleillés du fond, aperçus à travers la fumée.",
  "Les rails du premier plan, qui convergent vers le spectateur.",
]
themes = ["gare", "vapeur", "modernité", "paris", "chemin de fer"]
anecdote = """
La gare Saint-Lazare inspire aussi les amis de Monet : Manet situe à ses abords Le \
Chemin de fer (1873), et Caillebotte peint Le Pont de l'Europe (1876), qui enjambe les \
voies juste à la sortie de la gare."""
salle = 3
mur = "est"
place = 1
largeur = 1.6

[[oeuvres]]
titre = "La Rue Montorgueil, fête du 30 juin 1878"
annee = "1878"
image = "rue-montorgueil.jpg"
technique = "Huile sur toile, 81 × 50 cm"
collection = "Musée d'Orsay, Paris"
note = "Une rue de Paris pavoisée pour l'Exposition universelle : une foule et des drapeaux en touches vibrantes."
description = """
Vue d'en haut, depuis un balcon, une rue de Paris s'enfonce vers le fond du tableau, \
bordée de hautes façades. Des dizaines de drapeaux tricolores pendent aux fenêtres, de \
chaque côté, et semblent claquer dans le vent ; leurs bleus, blancs et rouges \
envahissent presque toute la surface. En bas, la chaussée est occupée par une foule \
compacte, rendue par une multitude de petites touches sombres et claires. Au loin, la \
rue se perd dans une lumière blanche. Le format vertical, haut et étroit, accentue \
l'impression de profondeur et le vertige du regard plongeant. On ne distingue aucun \
visage ni aucun personnage particulier : les façades elles-mêmes disparaissent presque \
derrière les étoffes, et le véritable sujet est la fête, son mouvement et son éclat."""
evocation = """
La toile célèbre un moment de liesse collective et patriotique. Le 30 juin 1878, Paris \
fête la paix et le relèvement du pays, sept ans après la défaite de 1870 et la \
Commune. Pour la jeune Troisième République, encore fragile, c'est l'occasion \
d'affirmer ses couleurs ; le drapeau tricolore, omniprésent, prend valeur de \
manifeste. Monet n'est guère un peintre politique, mais il saisit l'énergie d'une \
ville en fête et d'une nation qui se retrouve. La foule, dissoute en touches de \
couleur, devient un être collectif, et les drapeaux qui palpitent font de la rue un \
organisme vivant. On y voit souvent l'une des images les plus joyeuses de la vie \
moderne laissées par les impressionnistes."""
histoire = """
Le 30 juin 1878, en pleine Exposition universelle, le gouvernement organise une grande \
fête de la Paix ; le 14 juillet ne deviendra fête nationale qu'en 1880. Monet, qui vit \
alors à Paris dans de grandes difficultés financières, parcourt les rues avec son \
matériel. Il peint deux toiles ce jour-là : celle-ci, rue Montorgueil, et une vue de \
la rue Saint-Denis, aujourd'hui au musée des Beaux-Arts de Rouen. Le même jour, Manet \
peint de son côté la rue Mosnier pavoisée, qu'il voit depuis son atelier. La toile est \
présentée l'année suivante à la quatrième exposition impressionniste. Longtemps restée \
en mains privées, elle est aujourd'hui conservée au musée d'Orsay, à quelques stations \
de métro de la rue qu'elle représente."""
facture = """
Monet peint vite, en quelques heures, pour saisir la fête avant qu'elle ne se \
disperse. Les drapeaux sont faits de touches juxtaposées, courtes et énergiques, de \
bleu, de blanc et de rouge, qui vibrent les unes contre les autres sans jamais former \
de contour précis. La foule est traitée de la même façon, en petits coups de pinceau, \
comme un grouillement. La perspective plongeante et le cadrage vertical serré \
rappellent les vues urbaines des estampes japonaises. Presque abstraite par endroits, \
la toile a souvent été rapprochée, pour sa liberté de couleur, des recherches des \
fauves trente ans plus tard."""
details = [
  "Les drapeaux du premier plan, si proches qu'ils semblent frôler le spectateur.",
  "La foule, en bas, faite d'innombrables petites touches sans visage.",
  "Le fond lumineux, où la rue se dissout dans un blanc éclatant.",
  "Les façades presque entièrement masquées par les étoffes tricolores.",
]
themes = ["fête", "paris", "drapeaux", "foule", "république"]
anecdote = """
Monet racontera qu'il se promenait ce jour-là avec son matériel lorsqu'il avisa un \
balcon : il monta demander la permission d'y peindre, l'obtint, puis redescendit \
incognito une fois son travail terminé."""
salle = 3
mur = "est"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "Meules, fin de l'été"
annee = "1890–1891"
image = "meules.jpg"
technique = "Huile sur toile, 60 × 100 cm"
collection = "Art Institute of Chicago"
note = "Deux meules de blé à Giverny : la première des grandes séries, où seul le moment de la journée change."
description = """
Dans un champ moissonné, près de Giverny, deux meules de blé se dressent côte à côte, \
l'une grande, l'autre plus petite. Leur forme est simple : une base arrondie coiffée \
d'un toit conique, comme deux petites huttes de paille. Le soleil de fin de journée \
les éclaire de biais et projette sur le chaume des ombres bleues et violettes. \
Derrière elles, une ligne d'arbres et quelques maisons ferment l'horizon, au pied de \
collines bleutées. Le ciel, pâle et voilé, occupe une large bande horizontale. Rien ne \
se passe, aucun paysan, aucun animal, aucune charrette : seulement deux formes \
massives posées dans la lumière chaude de la fin de l'été, dont les contours vibrent \
légèrement dans l'air."""
evocation = """
Avec les Meules, le sujet devient presque indifférent : ce qui compte, c'est le temps, \
l'heure, la saison, l'atmosphère. En répétant le même motif sous des lumières \
différentes, Monet montre qu'un objet n'a pas d'apparence fixe et que notre perception \
change sans cesse. Les meules, réserves de grain de toute une année, évoquent aussi la \
terre nourricière, le cycle des saisons et la permanence du monde rural, à une époque \
où la France s'industrialise ; certains historiens y ont vu une célébration du terroir \
national. Par leur forme épurée et leur présence massive, elles prennent l'allure de \
monuments rustiques, et annoncent les séries qui suivront."""
histoire = """
Les meules se trouvent dans un champ voisin de la maison de Giverny, où Monet s'est \
installé en 1883. Il commence à les peindre à la fin de l'été 1890 et poursuit pendant \
l'automne et l'hiver, jusqu'au début de 1891, en multipliant les toiles. Il écrit \
alors à son ami le critique Gustave Geffroy qu'il s'acharne sur une série d'effets \
différents, que le soleil décline si vite qu'il ne peut le suivre, et qu'il lui faut \
beaucoup travailler pour rendre l'instantanéité. En mai 1891, la galerie Durand-Ruel \
expose quinze Meules : le succès est immédiat et les toiles se vendent en quelques \
jours, notamment à des collectionneurs américains. L'Art Institute de Chicago conserve \
aujourd'hui l'un des plus importants ensembles de cette série."""
facture = """
Monet travaille sur plusieurs toiles à la fois, passant de l'une à l'autre au fil des \
heures pour suivre l'évolution de la lumière, puis les reprend longuement à l'atelier \
pour harmoniser la série. La touche est dense, croisée, superposée en couches épaisses \
qui donnent à la surface une texture granuleuse. Aucune couleur n'est locale : la \
paille dorée se mêle d'orange, de rose et de violet, les ombres de bleu et de mauve. \
Le cadrage, simple et presque frontal, laisse toute la place aux variations de \
couleur."""
details = [
  "Les ombres bleu-violet qui s'étirent au pied des meules.",
  "Le liseré de lumière qui souligne le contour des toits de paille.",
  "Les maisons et les arbres du fond, fondus dans la brume chaude.",
  "Le chaume du champ moissonné, rendu en petites touches entrecroisées.",
]
themes = ["série", "campagne", "lumière", "saisons", "giverny"]
anecdote = """
En 1896, à Moscou, le jeune Vassily Kandinsky découvre une Meule de Monet. Il \
racontera qu'il n'avait d'abord pas reconnu le sujet sans l'aide du catalogue, et que \
ce choc lui révéla la force de la couleur seule, détachée de l'objet."""
salle = 3
mur = "est"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "La Cathédrale de Rouen, harmonie bleue"
annee = "1893"
image = "cathedrale-rouen.jpg"
technique = "Huile sur toile, 91 × 63 cm"
collection = "Musée d'Orsay, Paris"
note = "Le portail au soleil du matin, peint d'une fenêtre en face : la pierre se dissout dans la lumière."
description = """
La façade occidentale de la cathédrale de Rouen occupe toute la toile, vue de très \
près et coupée en haut par le cadre : on ne voit ni le sommet des tours ni la flèche. \
Au centre, le grand portail gothique s'ouvre sous une haute arcature finement \
ciselée ; au-dessus se devinent les galeries et la rose. À gauche, la tour \
Saint-Romain s'élève en partie. Le ciel n'apparaît que sur une étroite bande, sur les \
côtés. La pierre, encore plongée dans l'ombre du matin, est baignée de bleus profonds, \
tandis que les premières touches de soleil, dorées et rosées, accrochent les reliefs, \
les pinacles et les sculptures. Aucun passant, aucune vie sur le parvis : seule la \
masse ouvragée de l'édifice, comme suspendue dans l'air."""
evocation = """
En peignant plus de trente fois la même façade, Monet transforme un monument chargé \
d'histoire et de foi en un simple écran sur lequel joue la lumière. La cathédrale, \
symbole de permanence, devient paradoxalement l'image de l'instabilité : elle change \
de couleur, de matière et presque de forme d'une heure à l'autre. On y a vu une \
réflexion sur le temps et la perception, et certains y ont lu une méditation quasi \
religieuse sur la lumière, qui semble émaner de la pierre elle-même. Le choix d'un \
chef-d'œuvre gothique, emblème du patrimoine national, n'est pas anodin non plus dans \
une France qui redécouvre alors son Moyen Âge. Monet en fait pourtant moins un \
monument qu'une matière vivante."""
histoire = """
Monet travaille à Rouen pendant deux hivers, de février à avril 1892, puis en 1893. Il \
loue successivement des pièces dans des immeubles situés face à la cathédrale, \
au-dessus de boutiques, d'où il peint la façade à différentes heures du jour. Rentré à \
Giverny, il reprend longuement les toiles pour harmoniser l'ensemble, et en date \
plusieurs de 1894. En mai 1895, il en expose une vingtaine chez Durand-Ruel. Georges \
Clemenceau leur consacre dans La Justice un article enthousiaste, « Révolution de \
cathédrales », et souhaite que l'État achète la série entière, ce qui ne se fera pas. \
Le comte Isaac de Camondo, grand collectionneur, en réunit plusieurs, dont celle-ci, \
et les lègue au Louvre en 1911 ; elles sont aujourd'hui au musée d'Orsay."""
facture = """
La matière est l'élément le plus frappant de la série : Monet superpose couche après \
couche une pâte épaisse et rugueuse, travaillée au pinceau presque sec, qui finit par \
ressembler à la pierre elle-même. Les contours de l'architecture disparaissent sous \
cette croûte colorée. La gamme est volontairement limitée, ici dominée par les bleus \
et les violets, relevés de touches d'ocre et d'orange, couleurs complémentaires qui \
font vibrer la surface. Le cadrage serré supprime tout contexte, à la manière d'un \
gros plan. L'effet de lumière ne se lit pleinement qu'avec du recul."""
details = [
  "Le portail central, dont les sculptures se dissolvent dans l'ombre bleue.",
  "Les premières touches de soleil, dorées, sur les pinacles et les reliefs.",
  "La surface rugueuse de la peinture, qui imite le grain de la pierre.",
  "L'étroite bande de ciel, presque de la même couleur que la façade.",
]
themes = ["série", "cathédrale", "gothique", "lumière", "rouen"]
anecdote = """
Pendant son séjour à Rouen, Monet écrit à Alice Hoschedé qu'il a passé une nuit de \
cauchemars : la cathédrale s'écroulait sur lui, et elle lui apparaissait tantôt bleue, \
tantôt rose, tantôt jaune."""
salle = 3
mur = "est"
place = 4
largeur = 1.0

[[oeuvres]]
titre = "Le Parlement de Londres, soleil couchant"
annee = "1903"
image = "parlement-londres.jpg"
technique = "Huile sur toile, 81 × 92 cm"
collection = "National Gallery of Art, Washington"
note = "Peint de l'hôpital Saint-Thomas : la silhouette du Parlement noyée dans le brouillard orangé de la Tamise."
description = """
De l'autre côté de la Tamise, la silhouette du palais de Westminster, siège du \
Parlement britannique, se dresse en ombre chinoise contre un ciel embrasé. Ses tours \
néogothiques et ses flèches, d'un bleu violacé, semblent découpées dans la brume, sans \
aucun détail d'architecture. Le soleil couchant, voilé par le brouillard, répand \
derrière l'édifice une lumière orangée qui enflamme tout le ciel. Le fleuve occupe la \
moitié inférieure de la toile ; il renvoie ces couleurs en longues touches orange, \
roses et violettes qui ondulent à sa surface. La limite entre la rive et l'eau est \
presque invisible, et l'édifice paraît flotter. Tout est enveloppé dans une même \
atmosphère chargée, où l'air, l'eau et la pierre semblent faits de la même matière \
lumineuse."""
evocation = """
Le Parlement, symbole de la puissance britannique et de la démocratie parlementaire, \
devient chez Monet une apparition presque irréelle, sans poids ni matière, qui se \
dissout dans le brouillard. L'architecture n'est plus qu'un prétexte : le véritable \
sujet est l'atmosphère de Londres, ce mélange de brume, de fumée industrielle et de \
lumière filtrée que le peintre jugeait unique. On y a vu un hommage à Turner, dont il \
avait admiré les toiles lors de son exil londonien, et un dialogue avec les Nocturnes \
de son ami Whistler. Le tableau dit aussi la fascination de Monet, alors âgé de plus \
de soixante ans, pour une ville qu'il associe à sa jeunesse et à des années \
difficiles."""
histoire = """
Monet avait séjourné à Londres pendant la guerre de 1870, et y avait rencontré le \
marchand Paul Durand-Ruel, qui allait devenir son principal soutien. Il y revient à \
l'automne 1899, puis au début de 1900 et de 1901. Installé à l'hôtel Savoy, il peint \
depuis sa chambre les ponts de Waterloo et de Charing Cross ; pour le Parlement, il \
obtient de travailler à l'hôpital Saint-Thomas, sur la rive opposée. Il entreprend un \
très grand nombre de toiles, qu'il achève à Giverny pendant plusieurs années. En mai \
1904, Durand-Ruel expose trente-sept de ces vues de la Tamise, avec un vif succès. \
Cette toile, datée de 1903, appartient plus tard au collectionneur new-yorkais Chester \
Dale, dont la collection entre à la National Gallery of Art en 1963."""
facture = """
Monet peint en couches successives, d'abord sur le motif puis longuement à l'atelier, \
en cherchant l'unité de couleur plutôt que la fidélité topographique. Le tableau \
repose sur deux familles de couleurs complémentaires : bleus et violets pour l'édifice \
et les ombres, orangés et roses pour le ciel et ses reflets. La silhouette du palais \
n'a pas de contours nets ; elle est faite de touches verticales qui se fondent dans le \
fond. Sur l'eau, la touche devient horizontale et hachée pour suggérer le mouvement du \
fleuve. L'ensemble, très travaillé, garde pourtant l'apparence d'une vision fugitive."""
details = [
  "Les tours du palais, réduites à des silhouettes violettes sans détail.",
  "Les reflets orangés qui scintillent sur la Tamise en touches horizontales.",
  "Le ciel où le brouillard et la lumière du couchant se mêlent.",
  "La ligne de la rive, presque invisible, entre le palais et l'eau.",
]
themes = ["londres", "brouillard", "fleuve", "couchant", "série"]
anecdote = """
Le palais que peint Monet est alors presque neuf : l'ancien Parlement a brûlé en \
octobre 1834, un incendie dont Turner a été témoin et qu'il a peint, avant d'être \
reconstruit dans le style néogothique par Charles Barry et Augustus Pugin."""
salle = 3
mur = "nord"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Nymphéas"
annee = "1906"
image = "nympheas.jpg"
technique = "Huile sur toile, 89,9 × 94,1 cm"
collection = "Art Institute of Chicago"
note = "Plus de rive ni de ciel : seulement la surface de l'étang de Giverny, ses fleurs et les reflets des nuages."
description = """
La toile ne montre que la surface d'un étang, vue de près et d'en haut, sans rive ni \
horizon. Des îlots de feuilles de nymphéas, plates et arrondies, flottent en groupes \
irréguliers ; quelques fleurs roses et blanches s'y ouvrent comme des points de \
lumière. Entre les feuilles, l'eau sombre reflète le ciel et les nuages en larges \
plages bleues et blanches, ainsi que le vert profond des arbres et des saules qui \
bordent le bassin, hors du tableau. Le haut et le bas se confondent : on ne sait plus \
très bien ce qui flotte à la surface, ce qui se trouve sous l'eau et ce qui se reflète \
d'en haut. Le regard erre d'un îlot à l'autre sans trouver de point d'appui."""
evocation = """
Avec les Nymphéas, Monet fait d'un coin de son jardin un monde complet. En supprimant \
la rive et le ciel, il oblige le regard à plonger dans l'eau, où se mêlent la surface, \
la profondeur et le reflet. Le tableau devient un lieu de contemplation, presque de \
méditation ; on l'a souvent rapproché de la sensibilité japonaise que Monet admirait. \
Pour beaucoup d'historiens, ces toiles marquent le passage de la représentation d'un \
paysage à une peinture de la sensation pure, et préparent les grands panneaux de \
l'Orangerie. Elles disent aussi le repli du peintre vieillissant sur son jardin, qu'il \
a façonné lui-même et qui devient pour lui l'univers entier."""
histoire = """
En 1893, Monet achète un terrain situé de l'autre côté de la route et de la voie \
ferrée qui bordent sa propriété de Giverny. Il obtient l'autorisation de détourner une \
partie du Ru, un bras de l'Epte, pour y creuser un bassin, malgré l'inquiétude des \
paysans voisins, qui craignent que ces plantes exotiques n'empoisonnent l'eau. Il y \
plante des nymphéas, agrandit l'étang en 1901, et en fait son motif principal. En \
1909, la galerie Durand-Ruel présente quarante-huit de ces toiles sous le titre « Les \
Nymphéas, séries de paysages d'eau ». Celle-ci, peinte en 1906, appartient ensuite au \
grand collectionneur de Chicago Martin A. Ryerson, dont la collection entre à l'Art \
Institute en 1933."""
facture = """
Monet abandonne ici la perspective traditionnelle : plus de point de fuite, plus de \
ligne d'horizon. La composition repose sur la répartition des îlots de feuilles, qui \
semblent dériver lentement, et sur les verticales des reflets. La touche varie selon \
ce qu'elle décrit : petites touches denses et horizontales pour les feuilles, coups de \
pinceau plus larges et fluides pour l'eau et les reflets du ciel. Les couleurs, très \
accordées entre elles, bleus, verts et violets ponctués de rose, créent une harmonie \
presque musicale. Le format proche du carré, inhabituel pour un paysage, accentue \
l'absence d'orientation."""
details = [
  "Les fleurs de nymphéas, quelques touches roses et blanches posées en relief.",
  "Le reflet d'un nuage blanc qui traverse l'eau sombre.",
  "Les reflets verticaux des arbres de la rive, eux-mêmes invisibles.",
  "Les feuilles qui rétrécissent vers le haut de la toile et suggèrent la profondeur.",
]
themes = ["eau", "jardin", "reflets", "giverny", "contemplation"]
anecdote = """
Monet achète ses nymphéas colorés chez l'horticulteur Joseph Bory Latour-Marliac, à \
Temple-sur-Lot, dont les hybrides roses et jaunes avaient fait sensation à \
l'Exposition universelle de 1889 à Paris."""
salle = 4
mur = "nord"
position = -3.5
largeur = 1.6

[[oeuvres]]
titre = "Le Pont japonais"
annee = "1920–1922"
image = "pont-japonais.jpg"
technique = "Huile sur toile, 89 × 116 cm"
collection = "Museum of Modern Art, New York"
note = "Presque aveugle, Monet peint de mémoire le pont de son jardin : des rouges et des ors qui annoncent l'abstraction."
description = """
Au premier regard, on distingue à peine le sujet : un enchevêtrement de touches \
rouges, orangées, jaunes et vertes envahit toute la toile. Peu à peu, une forme se \
dégage : l'arche d'une passerelle qui enjambe l'étang de Giverny, prise dans une \
végétation foisonnante. Les glycines qui couvrent le pont et les plantes qui \
l'entourent se confondent avec lui en une masse dense et flamboyante. En bas, quelques \
tons plus sombres suggèrent l'eau de l'étang. Il n'y a ni ciel, ni horizon, ni repère \
d'échelle. Le motif, peint vingt ans plus tôt dans une lumière calme et des harmonies \
de verts et de bleus, apparaît ici comme un brasier de couleurs, presque \
méconnaissable."""
evocation = """
Ces dernières vues du pont ont souvent été lues à la lumière de la maladie de Monet : \
la cataracte, qui voilait sa vue, altérait sa perception des couleurs, les bleus \
s'effaçant au profit des jaunes, des rouges et des bruns. Mais elles traduisent aussi \
une liberté nouvelle, une peinture du geste et de la mémoire, où le motif compte moins \
que l'émotion. On y a vu l'expression d'une angoisse, celle d'un vieil homme qui sent \
sa vue lui échapper, et en même temps une énergie farouche. Longtemps négligées, \
jugées comme les œuvres d'un peintre diminué, ces toiles ont été réhabilitées après \
1945, quand les peintres de l'expressionnisme abstrait américain y ont reconnu un \
précurseur."""
histoire = """
La passerelle de bois, peinte en vert, est construite dans le jardin d'eau de Giverny \
peu après la création de l'étang, dans les années 1890 ; Monet l'a conçue en \
s'inspirant des estampes japonaises qu'il collectionnait. Il la peint une première \
fois en série en 1899. Vers 1918-1924, souffrant de la cataracte, il y revient dans \
une suite de toiles beaucoup plus violentes, qu'il garde dans son atelier. Opéré de \
l'œil droit en 1923, il retrouve en partie la vue. Après sa mort, ces toiles restent à \
Giverny, chez son fils Michel, jusqu'aux années 1950, lorsque marchands et musées, \
notamment américains, commencent à s'y intéresser. Le Museum of Modern Art de New York \
acquiert celle-ci grâce au fonds Mrs. Simon Guggenheim."""
facture = """
La peinture est appliquée en couches épaisses, frottées, griffées, parfois écrasées, \
avec une énergie qui laisse visibles la trace et la direction de chaque coup de \
pinceau. Les tons, saturés et chauds, se superposent sans se mélanger, laissant \
transparaître les couches inférieures. Le dessin a presque disparu : l'arche du pont \
n'est suggérée que par une courbe plus claire dans la masse. Le format, assez grand, \
et le cadrage serré, sans aucun recul, plongent le spectateur dans la matière même de \
la peinture."""
details = [
  "La courbe claire de l'arche, à mi-hauteur, qui se devine dans la masse colorée.",
  "Les traces de brosse, laissées visibles dans la pâte épaisse.",
  "Les quelques tons sombres, en bas, qui suggèrent l'eau de l'étang.",
  "Les glycines du pont, devenues un fouillis de rouges et d'orangés.",
]
themes = ["jardin", "japonisme", "abstraction", "vieillesse", "couleur"]
anecdote = """
Laissés à l'abandon après la Seconde Guerre mondiale, la maison et le jardin de \
Giverny ont été restaurés grâce à de nombreux mécènes, en grande partie américains, et \
ouverts au public en 1980 ; le pont japonais y a été refait à l'identique."""
salle = 4
mur = "nord"
position = 3.2
largeur = 2.2

