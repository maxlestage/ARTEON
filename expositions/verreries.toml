[exposition]
ordre = 57
nom_court = "Verreries"
mouvement = "L'art du verre, de l'Antiquité à l'Art nouveau"
cadre = "vitrine"
couleur = "#2a7280"
titre = "Verreries, trente-cinq siècles d'art du verre"
artiste = "Gallé, Tiffany, Lalique, Hermann Schwinger, Jacob Sang, verriers d'Égypte, de Rome, du Caire et de Murano…"
dates = "vers 1386 av. J.-C. – 1912"
accroche = "Exposition virtuelle · Corning Museum of Glass, Corning (New York)"
introduction = """
Le verre naît du sable, de la soude ou de la potasse, et du feu : une matière banale \
qui devient, entre les mains des verriers, l'une des plus précieuses qui soient. La \
visite suit dix objets sur plus de trois mille ans, d'un flacon à parfum façonné en \
Égypte au temps d'Akhenaton jusqu'aux vases de Gallé, de Tiffany et de Lalique. En \
chemin, on croise le portrait d'or d'un jeune Alexandrin, une lampe de mosquée émaillée \
pour un émir du Caire, un gobelet de Murano tissé de fils blancs, et les scènes gravées \
à la roue par les maîtres de Nuremberg et d'Amsterdam. Le bâtiment s'inspire du Corning \
Museum of Glass, dans l'État de New York, le plus grand musée du monde consacré au \
verre : on entre par une aile toute blanche, baignée de lumière, avant de parcourir \
les galeries historiques."""
vitrine = "vase-paon-tiffany.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Corning Museum of Glass"
ville = "Corning, New York, États-Unis"
architecte = "Harrison & Abramovitz (1951), Gunnar Birkerts (1980), Thomas Phifer and Partners (2015)"
construction = "1951–2015"
presentation = """
Corning, petite ville du nord de l'État de New York, vit du verre depuis que la \
verrerie Corning Glass Works s'y est installée en 1868. En 1951, pour son centenaire, \
l'entreprise fonde un musée consacré à l'art et à l'histoire du verre, logé dans un \
bâtiment de verre et d'acier dessiné par l'agence Harrison & Abramovitz. En juin 1972, \
la crue de la rivière Chemung, gonflée par l'ouragan Agnes, inonde les galeries et \
endommage des centaines d'objets, patiemment restaurés. Un nouveau bâtiment, dû à \
l'architecte Gunnar Birkerts, ouvre en 1980. En 2015, la Contemporary Art + Design \
Wing de Thomas Phifer ajoute une aile revêtue de panneaux de verre blanc : une vaste \
galerie toute blanche, éclairée par une lumière naturelle diffuse tombée du plafond, \
et un atelier en amphithéâtre où l'on souffle le verre devant le public. Les galeries \
historiques retracent trente-cinq siècles de verre ; la bibliothèque Rakow, voisine, \
est la grande bibliothèque mondiale du verre."""
ici = """
Le bâtiment d'ARTEON emprunte au Corning Museum ses deux visages. On entre par le sud \
dans « L'aile blanche », un grand volume de seize mètres sur douze, haut de huit \
mètres, aux murs blancs comme la galerie de Thomas Phifer : il reste vide, pour que \
l'on y regarde d'abord la lumière. Au nord commencent les galeries historiques, quatre \
salles en enfilade d'ouest en est, comme un parcours chronologique : l'Antiquité, aux \
murs gris sable ; l'Islam et Venise, d'un bleu de lagune pâle ; le verre gravé, gris \
perle ; enfin la salle de l'Art nouveau, plus vaste et plus haute, d'un vert d'eau. Les \
objets, souvent hauts de quelques centimètres, y sont présentés agrandis dans des \
vitrines murales sur fond clair."""

