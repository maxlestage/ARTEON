# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Flacon à parfum en forme d'amphore"
artiste = "Égypte, Nouvel Empire"
annee = "vers 1386–1330 av. J.-C."
image = "amphore-egyptienne.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/544828"
technique = "Verre façonné sur noyau, décor de fils de verre étirés en festons ; hauteur 15,3 cm, diamètre 6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Une amphore miniature de verre bleu nuit, rayée de festons blancs, jaunes et turquoise, faite pour contenir une huile parfumée au temps d'Amenhotep III et d'Akhenaton."
description = """
Le flacon reprend en miniature la forme d'une amphore, la grande jarre de l'Antiquité, \
mais il tiendrait dans la main : il mesure à peine quinze centimètres. Sa panse en \
forme d'œuf, d'un bleu nuit profond, repose sur un petit pied évasé. Deux anses en \
anneau, du même bleu, se recourbent sur les épaules. Le décor est fait de fils de verre \
blanc, jaune orangé et turquoise, qui dessinent des bandes de festons en zigzag, comme \
des vagues ou des plumes, séparées par des lignes droites. Le long col est entièrement \
couvert de chevrons serrés. Le bord de l'embouchure et celui du pied sont soulignés d'un \
cordon torsadé, rayé de bleu et de blanc. Par endroits, la surface montre de petites \
taches claires, traces de l'altération du verre."""
evocation = """
En Égypte, le verre était d'abord une matière royale. On le comparait aux pierres \
précieuses : le bleu sombre imitait le lapis-lazuli, le turquoise la pierre du Sinaï. \
Les premiers récipients de verre apparaissent dans la vallée du Nil vers 1500 av. \
J.-C., au temps de Thoutmosis III, peut-être grâce à des artisans venus du Proche-Orient \
après ses campagnes militaires. Ils restent rares et coûteux, réservés au palais, aux \
temples et aux grands dignitaires. Ces petits flacons contenaient des huiles parfumées \
et des onguents, indispensables à la toilette des vivants, mais aussi aux rites \
funéraires. Donner à un flacon de verre la forme d'une amphore, c'était jouer avec les \
échelles : la jarre des entrepôts devient un bijou de toilette."""
histoire = """
Le flacon date de la fin de la XVIIIᵉ dynastie, sous les règnes d'Amenhotep III et \
d'Akhenaton, l'âge d'or du verre égyptien. Les archéologues ont retrouvé des ateliers \
de verriers dans les grandes résidences royales de cette époque, au palais de Malqata, \
près de Thèbes, et à Amarna, la capitale fondée par Akhenaton. On ignore où ce flacon a \
été découvert. Le Metropolitan Museum l'a acheté en 1926 grâce à un don du mécène Edward \
S. Harkness, l'un des grands bienfaiteurs de son département égyptien. Après la fin du \
Nouvel Empire, la production de vases de verre décline en Égypte pendant plusieurs \
siècles ; la technique du noyau renaîtra plus tard en Mésopotamie, puis dans le monde \
grec."""
facture = """
Le soufflage n'existait pas encore. Le verrier modelait d'abord un noyau d'argile mêlée \
de sable ou de matière organique, de la forme de l'intérieur du flacon, autour d'une \
tige de métal. Il le recouvrait de verre bleu fondu, puis enroulait autour des fils de \
verre de couleur, qu'il étirait vers le haut et vers le bas avec une pointe pour \
dessiner les festons. En roulant l'objet encore chaud sur une pierre plate, il faisait \
pénétrer les fils dans la paroi. Il ajoutait ensuite les anses, le pied et les cordons. \
Une fois le verre refroidi, il retirait la tige et grattait le noyau. Le bleu vient du \
cobalt, le blanc et le jaune de composés d'antimoine."""
details = [
  "Les festons en zigzag, blancs, jaunes et turquoise, sur la panse bleu nuit.",
  "Les chevrons serrés qui couvrent tout le col.",
  "Les deux anses en anneau posées sur les épaules.",
  "Les cordons torsadés bleu et blanc du bord et du pied.",
]
themes = ["égypte", "parfum", "verre sur noyau", "amphore", "bleu"]
anecdote = """
Le même procédé, des fils de verre étirés en plumes, réapparaît plus de trois mille ans \
plus tard sur les vases de Louis Comfort Tiffany, présentés dans la dernière salle de \
cette exposition."""
salle = 2
mur = "nord"
place = 1
largeur = 0.9

[[oeuvres]]
titre = "Flacon à deux visages (flacon janiforme)"
artiste = "Empire romain, Méditerranée orientale"
annee = "IIᵉ–IVᵉ siècle"
image = "flacon-janus.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1923.945"
technique = "Verre soufflé dans un moule ; hauteur 6,4 cm, diamètre 4,6 cm"
collection = "Cleveland Museum of Art"
note = "Un flacon haut de six centimètres, soufflé dans un moule en forme de double tête, dont la surface irisée par le temps cache la couleur violette d'origine."
description = """
Le petit flacon a la forme de deux têtes réunies par l'arrière du crâne, surmontées \
d'un long col cylindrique à l'embouchure ourlée. On voit ici l'un des deux visages, de \
face : un visage plein et juvénile, aux grands yeux en amande, au nez droit, à la bouche \
petite. Une chevelure en grosses mèches ondulées l'encadre et descend sur les côtés \
jusqu'au niveau des joues. Le second visage, tourné vers l'arrière, lui est presque \
identique. Toute la surface est couverte d'une irisation changeante, où se mêlent des \
reflets d'argent, de mauve, de vert et d'or ; par endroits, de petites écailles se sont \
détachées. Le flacon tient tout entier dans le creux de la main."""
evocation = """
On appelle ces flacons janiformes, d'après Janus, le dieu romain aux deux visages, \
gardien des portes et des commencements, qui regarde à la fois devant et derrière lui. \
Le Cleveland Museum remarque pourtant que ces visages, imberbes et d'un sexe incertain, \
ne ressemblent guère à Janus, d'ordinaire barbu : d'autres flacons opposent un visage \
grave et un visage souriant. Ces objets ne célèbrent donc pas forcément un dieu ; ils \
amusaient l'œil et rendaient précieux un simple contenant d'huile parfumée. Ils disent \
surtout la grande nouveauté du verre romain : grâce au soufflage, ce qui était un luxe \
devient un objet courant, que l'on pouvait fabriquer en série et vendre dans tout \
l'Empire."""
histoire = """
Les flacons à tête humaine ont été très répandus dans le monde romain du IIᵉ au IVᵉ \
siècle ; on en a fabriqué en Méditerranée orientale, d'où vient sans doute celui-ci, \
mais aussi en Rhénanie. La plupart ont été retrouvés dans des tombes, où on les \
déposait avec leur contenu. Le flacon est entré au Cleveland Museum of Art en 1923, \
offert par Jeptha H. Wade, l'un des fondateurs du musée, qui lui a donné de nombreux \
objets. Comme beaucoup de verres antiques, il a passé des siècles dans la terre, et \
c'est cet enfouissement qui lui a donné son apparence actuelle : selon le musée, \
l'irisation qui couvre la surface masque une couleur d'origine proche du violet."""
facture = """
Le soufflage du verre est inventé au Iᵉʳ siècle av. J.-C. sur la côte syro-palestinienne \
: le verrier cueille une boule de verre fondu au bout d'une canne creuse et la gonfle \
de son souffle. Très vite, on souffle aussi le verre dans des moules, en terre cuite ou \
en pierre, faits de deux moitiés qui portent le relief en creux. Ici, la paraison, la \
bulle de verre chaud, a été soufflée dans un moule en forme de double tête, qui a \
imprimé d'un coup les visages et les mèches ; le col a été étiré et ourlé ensuite, \
hors du moule. Avec le temps, l'humidité du sol a altéré la surface en lamelles très \
fines, qui décomposent la lumière comme une bulle de savon."""
details = [
  "Les grands yeux en amande du visage tourné vers nous.",
  "Les mèches ondulées qui encadrent le visage, imprimées par le moule.",
  "Le profil du second visage, que l'on devine sur le côté droit.",
  "Les reflets mauves, verts et dorés de l'irisation.",
  "L'embouchure ourlée, repliée à chaud sur elle-même.",
]
themes = ["rome", "verre soufflé", "janus", "irisation", "parfum"]
anecdote = """
L'irisation des verres antiques fascinait les verriers de l'Art nouveau : Louis Comfort \
Tiffany, collectionneur de verres anciens, chercha à obtenir dans son four les reflets \
que des siècles d'enfouissement avaient donnés aux verres romains."""
salle = 2
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Médaillon au portrait de Gennadios"
artiste = "Alexandrie, Égypte romaine"
annee = "250–300"
image = "medaillon-gennadios.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/466645"
technique = "Verre, feuille d'or et rehauts de couleur ; diamètre 4,1 cm, épaisseur 0,6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Le portrait d'un jeune homme dessiné à la pointe dans une feuille d'or, sur un disque de verre bleu de quatre centimètres : l'un des chefs-d'œuvre du verre doré antique."
description = """
Sur un petit disque de verre bleu presque noir, un jeune homme apparaît en buste, de \
trois quarts, le regard tourné vers notre gauche. Il est entièrement dessiné en or : \
une chevelure épaisse de boucles serrées, de grands yeux au regard intense, des joues \
pleines, une bouche fermée. Le modelé du visage et des épaules est rendu par des \
milliers de hachures très fines, comme dans une gravure. Il porte une tunique et un \
manteau jeté sur l'épaule. Autour de lui, un filet d'or suit le bord du médaillon, et \
une inscription grecque en lettres d'or se lit en trois morceaux : ΓΕΝΝΑΔΙ à gauche, \
ΧΡΩΜΑΤΙ à droite, ΠΑΜΜΟΥϹΙ en bas. Le bord du disque est ébréché par endroits."""
evocation = """
Le portrait a la présence d'un visage vivant : rien d'idéalisé dans ce jeune homme aux \
traits singuliers, qui fait penser aux portraits peints sur bois des momies du Fayoum, \
réalisés en Égypte à la même époque. L'inscription donne son nom, Gennadios, et le loue \
; on la comprend d'ordinaire comme un éloge de son talent, celui d'un homme accompli \
dans l'art des Muses, sans doute un musicien. Ces médaillons, précieux et intimes, \
conservaient l'image d'un être aimé ou honoraient un succès ; on pouvait les monter en \
bijou ou les offrir. Ils témoignent aussi d'Alexandrie, la grande métropole grecque de \
l'Égypte romaine, réputée pour ses ateliers de verriers et pour son goût du luxe \
raffiné."""
histoire = """
Le médaillon a été fait entre 250 et 300, sans doute à Alexandrie, d'où viennent la \
plupart des portraits de ce type. On n'en connaît qu'un petit nombre, tous d'une \
grande finesse, ce qui suggère un même atelier ou un petit groupe d'artisans très \
spécialisés. Certains ont été conservés pendant des siècles comme des reliques ou des \
joyaux : le plus célèbre, qui montre une mère et ses deux enfants, a été serti au \
Moyen Âge dans la croix de Didier, à Brescia, parmi des pierres précieuses. On ignore \
le parcours de celui de Gennadios avant son arrivée au Metropolitan Museum, qui l'a \
acheté en 1926 grâce au Fletcher Fund. Il est conservé avec les collections d'art \
médiéval du musée, aux côtés des verres dorés paléochrétiens."""
facture = """
Le verre doré, que les Italiens appellent fondo d'oro, enferme une feuille d'or entre \
deux couches de verre. L'artisan posait d'abord une feuille d'or très mince sur le \
disque de verre bleu. Avec une pointe fine, il y grattait le dessin : il enlevait l'or \
autour de la figure et traçait dans le visage, les cheveux et les vêtements des \
réseaux de hachures, plus ou moins serrées, qui laissent transparaître le fond sombre \
et créent les ombres. Quelques touches de couleur complétaient le portrait. Le tout \
était ensuite protégé par une couche de verre, fondue par-dessus, qui scelle l'or et \
l'empêche de s'user. Le travail, fait sous une loupe ou presque, demandait une main \
d'une sûreté extraordinaire."""
details = [
  "Les boucles serrées de la chevelure, dessinées une à une dans l'or.",
  "Les hachures très fines qui modèlent les joues et le cou.",
  "Le regard tourné de côté, aux pupilles sombres.",
  "Les trois mots grecs de l'inscription, à gauche, à droite et en bas.",
  "Le filet d'or qui suit le bord du médaillon.",
]
themes = ["portrait", "or", "alexandrie", "musique", "verre doré"]
anecdote = """
Le médaillon mesure à peine quatre centimètres : en vitrine, le visage de Gennadios \
n'est pas plus grand qu'un ongle, et c'est à la loupe seulement que l'on découvre la \
finesse des hachures."""
salle = 2
mur = "ouest"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Lampe de mosquée pour le mausolée de l'émir Aydakin al-Bunduqdar"
artiste = "Égypte, sultanat mamelouk"
annee = "peu après 1285"
image = "lampe-aydakin.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/447000"
technique = "Verre soufflé, anses rapportées, pied replié, émaillé et doré ; hauteur 26,4 cm, diamètre de l'ouverture 21 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Une lampe de verre émaillé de bleu, de rouge et d'or, faite pour le tombeau d'un émir du Caire, l'ancien maître du sultan Baybars, dont elle porte les armes : deux arcs dos à dos."
description = """
La lampe a la forme d'un grand vase : un pied bas, une panse renflée et un large col \
évasé en entonnoir. Le verre, légèrement teinté de brun, est transparent. Autour de la \
panse court un large bandeau bleu où se détache, en réserve, une inscription arabe en \
grandes lettres élancées, cernées de rouge et rehaussées d'or. Elle est interrompue par \
des médaillons rouges où figurent deux arcs dos à dos, dessinés en or. De petites \
anses de verre, posées sur la panse, servaient à la suspendre. Le col porte une \
seconde inscription, en lettres bleues sur un fond de rinceaux, entre d'autres \
médaillons aux arcs. Des frises de petits motifs rouges soulignent le bord et la base \
du col."""
evocation = """
Une lampe de mosquée n'éclairait pas seulement : elle donnait forme à la lumière divine. \
Beaucoup portent un verset du Coran, la sourate de la Lumière, qui compare Dieu à une \
lampe dans une niche, « la lampe est dans un verre, et le verre est comme un astre \
brillant ». Suspendues par dizaines dans les mosquées, les madrasas et les tombeaux, \
elles faisaient briller les inscriptions dans la pénombre. Celle-ci honore aussi un \
homme. Les médaillons portent les armes de l'émir, car les Mamelouks, anciens esclaves \
militaires devenus maîtres de l'Égypte, se distinguaient par des emblèmes liés à leur \
charge à la cour. Les deux arcs sont ceux d'un bunduqdar, le porteur de l'arc du \
sultan."""
histoire = """
Aydakin al-Bunduqdar était un émir de la cour du Caire au XIIIᵉ siècle. Il avait acheté \
comme esclave militaire un jeune Turc, Baybars, qui devint l'un des plus grands sultans \
mamelouks et garda toute sa vie le surnom d'al-Bunduqdari, « l'homme d'al-Bunduqdar ». \
Aydakin mourut en 1285 ; il fut enterré au Caire dans un mausolée pour lequel cette \
lampe fut faite, peu après sa mort. On ignore quand elle a quitté le Caire ; au XIXᵉ \
siècle, les collectionneurs européens recherchaient ces lampes. Le financier J. \
Pierpont Morgan l'acquiert ; elle est donnée en 1917 au Metropolitan Museum, avec une grande partie de \
sa collection. Dans l'exposition voisine consacrée aux arts de l'Islam, on peut voir \
une autre lampe du Met, celle de l'émir Qawsun."""
facture = """
La lampe est soufflée, puis façonnée à la canne : le pied est un bord de verre replié \
sur lui-même, les anses sont des gouttes de verre étirées et collées à chaud. Le décor \
est peint ensuite avec des émaux, des poudres de verre colorées par des oxydes \
métalliques et mêlées à un liant, et avec de l'or. Le verrier remettait la lampe au \
four, à une température assez haute pour fondre les émaux sur le verre, mais assez \
basse pour ne pas déformer l'objet : une opération délicate, souvent répétée pour \
chaque couleur. Les verriers de Syrie et d'Égypte ont porté cette technique à sa \
perfection aux XIIIᵉ et XIVᵉ siècles ; ceux de Venise la reprendront à la fin du \
Moyen Âge."""
details = [
  "Les deux arcs dos à dos, en or, dans les médaillons rouges.",
  "Les grandes lettres de l'inscription, en réserve sur le bandeau bleu.",
  "Les petites anses de verre qui permettaient de suspendre la lampe.",
  "L'inscription bleue du col, sur un fond de fins rinceaux.",
  "Le pied replié, au bord épais, sous la panse.",
]
themes = ["islam", "mamelouks", "lumière", "émail", "calligraphie"]
anecdote = """
Au XIXᵉ siècle, ces lampes étaient si recherchées que des verriers européens, comme le \
Parisien Philippe-Joseph Brocard, se mirent à les imiter. Le Cleveland Museum conserve \
une lampe de mosquée émaillée faite en France à la fin du XIXᵉ siècle."""
