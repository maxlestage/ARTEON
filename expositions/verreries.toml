#  EXPOSITION « VERRERIES » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/verreries/). Le nom
#  du fichier donne l'adresse de l'exposition sur le site : /verreries.
#
#  Les objets sont photographiés en trois dimensions : toutes les images
#  viennent des photographies publiées en libre accès (CC0) par le Metropolitan
#  Museum de New York, le Cleveland Museum of Art et l'Art Institute of Chicago.
