[[oeuvres]]
titre = "Gobelet en verre filigrané (vetro a reticello)"
artiste = "Venise, verreries de Murano"
annee = "vers 1600"
image = "gobelet-reticello.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/223422"
technique = "Verre incolore soufflé à filigrane blanc en résille (vetro a reticello) ; hauteur 17,2 cm"
collection = "Art Institute of Chicago"
note = "Un gobelet de Murano tissé d'un fin réseau de fils de verre blanc, si régulier qu'on le prendrait pour une dentelle ou une vannerie."
description = """
Le gobelet s'évase largement, comme une corolle, au-dessus d'un bouton aplati et d'un \
pied en forme de cloche, bordé d'un ourlet. Le verre, incolore et très mince, est \
traversé de bout en bout par un réseau de fils blancs opaques qui se croisent en \
diagonale et forment de petits losanges réguliers, une résille qui couvre la coupe, le \
bouton et le pied. Vers le haut, les fils s'écartent et s'inclinent en suivant \
l'évasement de la paroi ; près du bord, on distingue nettement deux séries de spirales \
qui tournent en sens contraires. Au centre de chaque losange, une minuscule bulle d'air \
est restée prisonnière. Sur le fond gris de la photographie, l'objet paraît presque \
immatériel."""
evocation = """
Ce gobelet n'a pas d'autre décor que la matière elle-même : c'est le verre qui devient \
dentelle. Aux XVIᵉ et XVIIᵉ siècles, Murano domine le marché européen du verre de luxe, \
et les tables des princes et des riches marchands se parent de ces objets légers, \
fragiles et coûteux. Selon l'Art Institute, ces gobelets en résille étaient très \
recherchés par la noblesse pour orner les tables de fête, comme un signe de richesse et \
de bon goût. Ils répondent au goût de la Renaissance pour la virtuosité : on admire \
autant la difficulté vaincue que la beauté de l'objet. Leur finesse dit aussi leur \
fragilité, et c'est presque un miracle que de tels verres soient parvenus jusqu'à \
nous."""
histoire = """
Dès 1291, Venise oblige ses verriers à installer leurs fours sur l'île de Murano, pour \
éloigner le risque d'incendie de la ville et mieux garder les secrets du métier. Au \
XVᵉ siècle, ils mettent au point le cristallo, un verre presque incolore, clair comme \
le cristal de roche, puis, dans les premières décennies du XVIᵉ siècle, le verre à \
filigrane, décoré de fils de verre blanc. Malgré les lois qui leur interdisaient de \
quitter la lagune, de nombreux verriers vénitiens partent travailler à l'étranger : \
leur manière, la « façon de Venise », se répand dans toute l'Europe. On ne sait rien du \
premier propriétaire de ce gobelet. L'Art Institute of Chicago l'a acquis grâce au \
fonds Mary Swissler Oldberg ; il est exposé dans ses galeries d'arts décoratifs."""
facture = """
L'Art Institute décrit le procédé. Le verrier dispose côte à côte de fines baguettes de \
verre blanc et les enrobe d'une masse de verre incolore en fusion ; il roule le tout, \
le souffle en forme de tube et le tord pour que les fils s'enroulent en spirale. Il \
prépare un second tube, dont les fils tournent dans l'autre sens, et le souffle à \
l'intérieur du premier : les deux parois se soudent, et les spirales croisées forment \
la résille. À chaque croisement, une petite bulle d'air reste enfermée entre les deux \
couches. Le verre est ensuite façonné en gobelet, avec son bouton et son pied, sans \
que le dessin se brouille : un travail d'une grande maîtrise."""
details = [
  "Les petits losanges réguliers de la résille blanche.",
  "La bulle d'air prisonnière au centre de chaque losange.",
  "Les deux séries de spirales croisées, bien visibles près du bord.",
  "Le bouton aplati qui relie la coupe au pied.",
  "L'ourlet du pied, replié à chaud.",
]
themes = ["venise", "murano", "filigrane", "renaissance", "virtuosité"]
anecdote = """
Les verriers de Murano jouissaient de privilèges rares : leurs filles pouvaient épouser \
des nobles vénitiens sans que les enfants perdent leur rang. Mais celui qui partait \
exercer son art à l'étranger risquait de lourdes peines."""
salle = 3
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Gobelet à la vue de la Panierplatz de Nuremberg"
artiste = "Hermann Schwinger"
annee = "vers 1680"
image = "gobelet-schwinger.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1950.389"
technique = "Verre soufflé, gravé à la roue ; hauteur 31,1 cm, diamètre 13,5 cm"
collection = "Cleveland Museum of Art"
note = "Un haut gobelet au pied orné de collerettes, où le graveur nurembergeois Hermann Schwinger a représenté une place de sa ville et deux porteurs qui se partagent une charge."
description = """
Le gobelet, haut de trente et un centimètres, se compose d'une coupe en forme de cloche, \
d'une longue tige et d'un large pied plat. La tige alterne des disques plats empilés, \
des collerettes, et des renflements creux, l'un rond, l'autre en forme de poire. Sur la \
coupe, gravée en gris mat dans le verre transparent, s'étend une vue de ville : des \
maisons à colombages, des toits, une porte, de grands arbres au feuillage dense, une \
palissade. Au premier plan, sur la place, deux hommes marchent l'un derrière l'autre, \
portant ensemble sur leurs épaules une longue poutre où l'on lit une inscription. Sous \
la scène, une bande d'écriture gothique fait le tour de la coupe. Le pied est gravé de \
rameaux feuillus."""
evocation = """
La scène est à la fois une vue de Nuremberg, la Panierplatz, et une allégorie, comme \
l'indique le Cleveland Museum. Les inscriptions en donnent le sens. Sur la poutre on \
lit : « Es ruhet auf beiden », « cela repose sur tous les deux » ; et autour de la \
coupe : « Deine Last ist meine Last. Ruhest du, so hab ich Rast », « Ton fardeau est \
mon fardeau. Si tu te reposes, alors je me repose ». C'est une image de l'amitié, ou \
peut-être du mariage, où chacun porte sa part de la charge commune. On imagine ce \
gobelet levé lors d'un repas, et la devise lue à voix haute. Les gobelets gravés \
servaient ainsi de cadeaux et de souvenirs, chargés de vœux, de devises et d'images."""
histoire = """
Hermann Schwinger (1640–1683) est l'un des meilleurs graveurs sur verre de Nuremberg. \
La ville était devenue, au XVIIᵉ siècle, le grand foyer de cet art en Allemagne, après \
que Georg Schwanhardt, élève de Caspar Lehmann, graveur de l'empereur Rodolphe II à \
Prague, s'y fut installé. Le Cleveland Museum classe le verre du gobelet dans la \
production de Bohême, dont les verreries fournissaient les graveurs. Le gobelet est \
signé et daté. Au début du XXᵉ siècle, il appartenait au collectionneur viennois Max \
Strauss, dont la collection fut vendue aux enchères à Vienne en 1922. Il passe ensuite \
chez les marchands Rosenberg et Stiebel, à New York, avant d'être acheté en 1950 par le \
Cleveland Museum grâce au fonds John L. Severance."""
facture = """
La gravure à la roue reprend les outils des graveurs de pierres fines. L'artisan \
utilise de petites roues de cuivre, de diamètres variés, montées sur un tour et \
enduites d'un mélange d'huile et de poudre abrasive. Il ne déplace pas l'outil : c'est \
le verre qu'il présente contre la roue qui tourne, en le guidant avec une précision \
extrême. La roue use la surface et laisse un creux mat et gris, plus ou moins profond, \
qui se lit comme un dessin en grisaille ; certaines parties restent polies pour \
accrocher la lumière. Cette technique demande un verre épais et dur ; les gobelets de \
Nuremberg, avec leurs tiges à renflements creux et à collerettes, mettaient la coupe \
gravée en valeur."""
details = [
  "Les deux porteurs qui partagent la même poutre sur leurs épaules.",
  "La petite inscription gravée sur la poutre.",
  "Les maisons à colombages et le feuillage dense des arbres.",
  "Les collerettes empilées de la tige, autour du renflement creux.",
  "Les rameaux gravés sur le pied.",
]
themes = ["gravure", "nuremberg", "amitié", "devise", "baroque"]
anecdote = """
Le graveur travaillait « à l'envers » de la lumière : un creux gravé paraît clair sur un \
fond sombre et sombre sur un fond clair. Les photographes de musée éclairent donc ces \
verres sur un fond noir, pour faire apparaître le dessin."""
salle = 4
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Gobelet couvert à la scène d'accouchée"
artiste = "Jacob Sang (gravure), verrerie anglaise"
annee = "1750–1770"
image = "gobelet-jacob-sang.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/266209"
technique = "Verre au plomb soufflé, gravé à la roue ; hauteur 25,8 cm, diamètre 11,5 cm"
collection = "Art Institute of Chicago"
note = "Un gobelet de verre anglais au plomb, gravé à Amsterdam d'une chambre d'accouchée, et d'un toast à la santé de la mère et de l'enfant."
description = """
Le gobelet, coiffé de son couvercle, se dresse sur un fond noir qui fait ressortir la \
gravure. La coupe, en forme de cloche, repose sur un pied court dont le bouton est \
semé de bulles d'air disposées en couronne. Sur la face, une grande scène occupe la \
coupe : un lit à baldaquin, aux rideaux relevés, où une femme est assise, adossée à ses \
oreillers ; à côté, une nourrice se tient près d'un berceau. Le sol est un carrelage en \
perspective. Le long du bord court une inscription en lettres capitales. Le couvercle \
bombé est gravé d'une guirlande de feuillages ; il se termine par un bouton à bulles \
torsadées et une pointe à facettes."""
evocation = """
Le gobelet appartient au rituel de la naissance dans les Provinces-Unies du XVIIIᵉ \
siècle. Selon l'Art Institute, il servait le kandeel, une boisson nourrissante d'œufs, \
d'alcool et de cannelle, offerte à l'accouchée et à ses visiteurs. La gravure montre \
justement cette chambre : la jeune mère au lit, la nourrice qui berce l'enfant, un \
séchoir à langes, des chaises et une table dressée avec des friandises et deux gobelets \
semblables à celui-ci. L'inscription porte le toast : « 't Welvaaren van de Kraamvrouw \
en Kindje », « à la santé de l'accouchée et de son enfant ». Dans une époque où \
l'accouchement restait dangereux, le gobelet célèbre une naissance heureuse et réunit \
la famille autour de la mère."""
histoire = """
La gravure est attribuée à Jacob Sang, actif à Amsterdam dans les années 1750, l'un des \
graveurs les plus habiles et les plus réputés de la ville selon l'Art Institute. Aux \
Pays-Bas, la demande de verres personnalisés était immense : on en gravait pour les \
mariages, les naissances, les succès commerciaux ou les événements politiques. Le \
verre, lui, vient d'Angleterre, dont les verres au plomb étaient très appréciés des \
graveurs hollandais. Le gobelet a été commandé par la famille des barons van \
Slingelandt et s'est transmis dans la famille jusqu'au XXIᵉ siècle. Il passe ensuite \
chez le marchand Frides Laméris, à Amsterdam, avant d'être acheté en 2023 par l'Art \
Institute of Chicago."""
facture = """
En 1674, l'Anglais George Ravenscroft fait breveter un verre où l'oxyde de plomb \
remplace une partie de la potasse. Ce verre au plomb, le futur cristal, est lourd, \
très clair, et réfracte fortement la lumière ; il est aussi plus tendre, donc idéal \
pour la gravure à la roue, qui peut y creuser des reliefs très fins et des ombres \
nuancées. Sang tire parti de cette matière : les rideaux du lit, les plis des draps et \
le carrelage sont modelés par des creux plus ou moins profonds. Le souffleur anglais, \
de son côté, a ménagé dans le bouton de la tige une couronne de bulles d'air, obtenues \
en piquant le verre chaud puis en le recouvrant d'une nouvelle couche de verre : un ornement typique des verres \
anglais du XVIIIᵉ siècle."""
details = [
  "La jeune mère assise dans le lit à baldaquin aux rideaux relevés.",
  "La nourrice assise près du berceau.",
  "Le carrelage du sol, gravé en perspective.",
  "La couronne de bulles d'air dans le bouton du pied.",
  "La guirlande de feuillages gravée sur le couvercle.",
]
themes = ["naissance", "gravure", "amsterdam", "verre au plomb", "toast"]
anecdote = """
Les graveurs hollandais achetaient si volontiers les verres anglais qu'ils en ont fait \
leur support favori : on rencontre souvent, dans les collections, des verres soufflés \
à Newcastle ou à Londres et gravés aux Pays-Bas."""
salle = 4
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Vase aux orchidées"
artiste = "Émile Gallé"
annee = "vers 1900"
image = "vase-orchidees-galle.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/45125"
technique = "Verre doublé, gravé à l'acide et à la roue ; 29,4 × 14,3 × 11,8 cm"
collection = "Art Institute of Chicago"
note = "Des orchidées sabots-de-Vénus surgissent dans l'épaisseur d'un verre ambré et pourpre : Gallé sculpte le verre comme une pierre à plusieurs couches."
description = """
Le vase est un simple cylindre, haut de trente centimètres, au bord légèrement épaissi. \
Son fond est un verre ambré, d'un jaune de miel qui vire à l'orangé et, par endroits, \
au rouge. Par-dessus se détachent en relief, d'un pourpre très sombre, des tiges et des \
fleurs d'orchidées. On reconnaît leurs pétales rayés de fines nervures, leur sépale \
supérieur dressé comme un capuchon et, au centre, leur lèvre gonflée en forme de petit \
sabot. Certaines fleurs s'ouvrent largement, d'autres ne sont encore que des boutons. \
En bas, de longues feuilles nervurées montent du pied et se recourbent. Le haut du \
vase est plus sombre, comme si les fleurs sortaient de l'ombre vers la lumière."""
evocation = """
Gallé fut à la fois verrier, ébéniste et botaniste passionné, membre de la Société \
centrale d'horticulture de Nancy ; il cultivait et étudiait les plantes qu'il \
représentait. Les orchidées, venues des serres où la Belle Époque les collectionnait \
à prix d'or, fascinaient ses contemporains par leurs formes étranges, presque animales \
: le sabot-de-Vénus semble un petit soulier. Gallé ne se contente pas de les copier. \
En les faisant surgir de la profondeur du verre, à demi plongées dans la pénombre, il \
leur donne une vie mystérieuse, proche des poèmes symbolistes qu'il aimait. Pour lui, \
l'objet d'art devait parler de la nature, mais aussi de l'âme : ce vase est une serre \
en miniature, et une rêverie."""
histoire = """
Né à Nancy en 1846, fils d'un marchand de faïences et de verreries, Émile Gallé étudie \
la botanique et la chimie, puis apprend le métier du verre à Meisenthal, en Lorraine. \
Il reprend l'entreprise familiale, que ses envois aux Expositions universelles de Paris \
rendent célèbre, en 1878, en 1889 puis en 1900, où il triomphe. En 1901, il fonde avec \
d'autres artistes l'École de Nancy, dont il est le premier président. Il meurt en 1904 \
; sa verrerie produit encore pendant près de trente ans des vases signés de son nom. Celui-ci, daté \
vers 1900, est entré à l'Art Institute of Chicago par le don de Mrs. Cyrus Bentley. Une \
autre pièce de Gallé, le vase aux colchiques du Metropolitan Museum, est présentée dans \
l'exposition consacrée aux arts décoratifs."""
facture = """
Le vase est fait de verres superposés : le verrier souffle une première paraison ambrée, \
puis la recouvre d'une ou plusieurs couches de verre de couleur. Le décor est ensuite \
taillé dans cette épaisseur, comme dans un camée. Gallé emploie l'acide fluorhydrique, \
qui ronge le verre : on protège le motif avec un vernis, puis on plonge le vase dans le \
bain, qui dissout la couche supérieure autour des fleurs. Les détails, nervures des \
pétales et des feuilles, sont repris à la roue. Selon l'épaisseur de verre pourpre \
laissée en place, la couleur va du rouge transparent au presque noir : c'est ce jeu \
de profondeurs qui donne au décor son modelé et sa lumière."""
details = [
  "La lèvre gonflée en forme de sabot, au cœur de chaque orchidée.",
  "Les fines rayures des pétales, reprises à la roue.",
  "Les boutons encore fermés au bout des tiges.",
  "Les longues feuilles nervurées qui montent du pied.",
  "Le fond ambré qui passe du jaune de miel au rouge.",
]
themes = ["art nouveau", "orchidées", "nancy", "nature", "camée"]
anecdote = """
Sur la porte de ses ateliers de Nancy, Gallé avait fait graver une devise : « Ma \
racine est au fond des bois ». Elle résume son art, où chaque objet naît de \
l'observation des plantes."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Vase aux plumes de paon"
artiste = "Louis Comfort Tiffany"
annee = "1893–1896"
image = "vase-paon-tiffany.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/9480"
technique = "Verre Favrile soufflé ; 35,9 × 29,2 cm"
collection = "Metropolitan Museum of Art, New York"
note = "L'un des premiers vases de verre Favrile de Tiffany : une fleur de verre irisé qui s'ouvre en éventail, couverte de plumes de paon."
description = """
Le vase a la forme d'une fleur ou d'un éventail ouvert. D'une panse ronde et basse \
monte un long col étroit, qui s'élargit brusquement en une vaste corolle ondulée, \
pincée sur les côtés et retombant en deux pointes. Tout l'objet est d'un vert olive, \
traversé de fines lignes plus sombres qui partent du pied, montent le long du col et \
se déploient dans la corolle comme les barbes d'une plume. En haut, ces lignes \
s'enroulent autour de quatre « yeux » de paon, des taches bleu nuit cernées de violet \
et de doré. La surface est irisée : selon l'angle, elle se couvre de reflets roses, \
violets, bleus et dorés. Le bord de la corolle, d'un vert plus clair, est légèrement \
ourlé."""
evocation = """
Le paon est l'un des emblèmes de l'Esthétisme et de l'Art nouveau, de la Peacock Room \
de Whistler à Londres aux bijoux de Lalique. Il dit le goût de l'époque pour la beauté \
pure, pour la couleur et le luxe, pour l'Orient aussi, d'où l'oiseau est venu. Tiffany, \
peintre de formation, y trouvait un motif idéal pour son verre, dont les couleurs \
changent avec la lumière comme celles d'une plume. Il ne représente pas l'oiseau : il \
transforme le vase lui-même en roue de paon, et la matière en plumage. Cette fusion de \
la forme et du décor, inspirée par la nature, est au cœur de l'Art nouveau, et fait \
de ce vase une sculpture autant qu'un récipient."""
histoire = """
Louis Comfort Tiffany (1848–1933), fils du fondateur de la célèbre bijouterie \
new-yorkaise, s'était d'abord fait connaître comme peintre, puis comme décorateur et \
créateur de vitraux. En 1893, il ouvre sa propre verrerie à Corona, dans le Queens, \
avec le verrier anglais Arthur J. Nash, et lance le verre Favrile. Ce vase compte parmi \
les premières réalisations de l'atelier. Dès 1896, le magnat du sucre Henry O. \
Havemeyer, grand collectionneur et client de Tiffany, qui avait décoré sa maison \
new-yorkaise, offre au Metropolitan Museum un ensemble de vases Favrile, dont \
celui-ci. À Paris, le marchand Siegfried Bing expose le verre de Tiffany dès 1895 \
dans sa galerie, la Maison de l'Art nouveau."""
facture = """
Favrile est un nom inventé par Tiffany, d'après un vieux mot anglais, fabrile, « de \
l'artisan » ; selon le Cleveland Museum, il devait sonner français, précieux et \
artisanal. Le décor de plumes est obtenu à chaud : le souffleur pose sur la paraison \
des fils de verre de couleur, puis les étire avec un crochet pour dessiner les barbes \
et les yeux, avant de donner au vase sa forme finale. L'irisation vient de sels \
métalliques appliqués sur le verre encore chaud, qui forment en surface une pellicule \
très mince où la lumière se décompose. Tiffany cherchait ainsi à retrouver l'éclat \
des verres antiques irisés par l'enfouissement, qu'il collectionnait."""
details = [
  "Les quatre « yeux » de paon bleu nuit, en haut de la corolle.",
  "Les lignes fines qui montent du pied comme les barbes d'une plume.",
  "Les reflets roses et violets de l'irisation.",
  "La corolle pincée qui retombe en deux pointes.",
  "La panse ronde et basse, d'un vert plus soutenu.",
]
themes = ["art nouveau", "paon", "irisation", "new york", "verre favrile"]
anecdote = """
Tiffany a aussi créé des vitraux, des mosaïques et des lampes : son vitrail « Magnolias \
et iris » et la lampe « Glycine » de ses ateliers sont présentés dans l'exposition \
consacrée aux arts décoratifs."""
salle = 5
mur = "est"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "Vase « Grenouilles et nénuphars »"
artiste = "René Lalique"
annee = "1909–1912"
image = "vase-grenouilles-lalique.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/2007.180"
technique = "Verre moulé, coulé et appliqué, patiné ; 21 × 29,8 cm"
collection = "Cleveland Museum of Art"
note = "L'un des premiers vases de René Lalique : sur un verre givré comme une eau trouble, des grenouilles d'un vert profond se serrent sur des feuilles de nénuphar."
description = """
Le vase a une forme basse et trapue, une panse large et anguleuse surmontée d'un col \
court et évasé. Le verre est incolore, mais dépoli et satiné, comme une eau trouble. \
Sur l'épaule, de grandes feuilles de nénuphar, patinées de gris, s'étalent en relief ; \
leurs longues tiges ondulées descendent jusqu'au pied, et l'on devine des boutons de \
fleurs. Sur les feuilles, une dizaine de grenouilles se pressent les unes contre les \
autres, accroupies. Elles sont d'un vert intense et brillant, du vert émeraude au vert \
presque noir, avec les pattes repliées et le dos marqué de lignes. Sur le bas de la \
panse, on lit la signature moulée « R. LALIQUE »."""
evocation = """
Le Cleveland Museum y voit l'image d'un marécage brumeux, un motif typique de l'Art \
nouveau. La mare, avec ses plantes aquatiques et ses petits animaux, est l'un des \
thèmes favoris des artistes de l'époque, nourris d'estampes japonaises : un monde \
caché, humide, entre l'eau et l'air, où la vie grouille. Lalique en tire un effet \
presque théâtral : la transparence voilée du verre suggère la profondeur de l'eau, \
tandis que les grenouilles, d'une couleur éclatante, semblent sorties de la surface. \
Le contraste entre le verre mat et le verre brillant, entre le gris et le vert, \
anime l'objet. L'humour n'est pas absent : ces grenouilles serrées comme sur un radeau \
ont quelque chose de vivant et de comique."""
histoire = """
René Lalique (1860–1945), d'abord célèbre comme bijoutier, se tourne vers le verre au \
début du XXᵉ siècle. Vers 1907, il dessine des flacons de parfum pour François Coty ; \
en 1909, il loue puis achète une verrerie à Combs-la-Ville, près de Paris. Ce vase, \
selon le Cleveland Museum, est un témoin précoce de ses recherches sur le verre \
d'art, avant la production en série de ses célèbres vases moulés des années 1920. Au \
XXᵉ siècle, il passe par plusieurs collections, en Amérique et au Japon, et par des \
ventes chez Phillips et Christie's à New York. Le Cleveland Museum l'achète en 2007 \
grâce au fonds John L. Severance. Le vase « Tourbillons », de 1926, est présenté dans \
l'exposition consacrée aux arts décoratifs."""
facture = """
Lalique associe ici plusieurs techniques, comme l'explique le Cleveland Museum : le \
corps du vase est moulé, les grenouilles sont faites de verre vert coulé et appliqué \
sur la paroi. Le verre incolore est ensuite dépoli, sans doute à l'acide, pour lui \
donner son aspect satiné, et une patine grise est déposée dans les creux des feuilles \
et des tiges pour en souligner le relief. Détail ingénieux, Lalique a placé de petites \
