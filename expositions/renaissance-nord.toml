# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « RENAISSANCE DU NORD » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/renaissance-nord/). Le nom
#  du fichier donne l'adresse de l'exposition sur le site : /renaissance-nord.
#
#  Une exposition à plusieurs peintres : chaque œuvre précise son « artiste ».
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 30
nom_court = "Renaissance du Nord"
mouvement = "Primitifs flamands et Renaissance du Nord"
cadre = "ebene"
couleur = "#3e4f6a"
titre = "Primitifs flamands et Renaissance du Nord, le monde au plus près"
artiste = "Van Eyck, Van der Weyden, Memling, Bosch, Dürer, Cranach, Holbein, Bruegel"
dates = "1434–1568"
accroche = "Exposition virtuelle · Kunsthistorisches Museum, Vienne"
introduction = """
À Bruges, à Bruxelles, à Nuremberg ou à Anvers, les peintres du Nord inventent aux XVᵉ \
et XVIᵉ siècles une peinture à l'huile d'une précision inouïe, où chaque reflet, \
chaque poil de fourrure, chaque brin d'herbe compte. La visite suit ce fil sur plus \
d'un siècle, des Époux Arnolfini de Van Eyck au Jardin des délices de Bosch, des \
portraits de Dürer, Cranach et Holbein jusqu'aux paysages et aux fêtes villageoises de \
Bruegel. Le bâtiment s'inspire du Kunsthistorisches Museum de Vienne : on entre sous \
un haut hall à coupole, puis l'on gagne des salles aux murs tendus de tissu, dont une \
grande salle Bruegel, comme celle où Vienne réunit la plus riche collection au monde \
de ses tableaux."""
vitrine = "chasseurs-dans-la-neige.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Kunsthistorisches Museum"
ville = "Vienne, Autriche"
architecte = "Gottfried Semper et Carl von Hasenauer"
construction = "1871–1891"
presentation = """
Sur le Ring de Vienne, l'empereur François-Joseph fait élever deux palais jumeaux qui se \
font face, l'un pour les sciences naturelles, l'autre pour les collections d'art réunies \
par les Habsbourg depuis des siècles. Dessiné par Gottfried Semper et Carl von \
Hasenauer, le Kunsthistorisches Museum est construit de 1871 à 1891 et ouvre cette \
année-là. Derrière ses façades néo-Renaissance couronnées d'une coupole, un grand \
escalier de marbre, orné de peintures de Hans Makart et de Gustav Klimt, mène au hall à \
coupole, puis aux galeries de peinture, éclairées par des verrières, aux murs tendus de \
tissu. On y voit les Titien, les Rubens et les Velázquez des Habsbourg, les portraits de \
Dürer et surtout une douzaine de tableaux de Pieter Bruegel l'Ancien, la plus riche \
collection au monde de ses œuvres, réunis dans une même salle. Le musée garde aussi la \
Kunstkammer des Habsbourg, avec la salière d'or de Benvenuto Cellini."""
ici = """
Le bâtiment d'ARTEON reprend le cœur du musée viennois : une haute salle à coupole d'où \
l'on gagne les galeries de peinture. On entre par le sud dans le hall à coupole, carré, \
haut de seize mètres. À l'ouest s'ouvre la salle I · Les primitifs flamands, aux murs \
beige chaud ; à l'est, la salle II · La Renaissance allemande, aux murs vert pâle, deux \
salles carrées de douze mètres de côté et de sept de haut. Au nord, dans l'axe, la salle \
Bruegel, la plus vaste, large de dix-huit mètres, aux murs rose beige, clôt la visite."""

# ─── Le plan du musée ────────────────────────────────────────────────────────
# Inspiré du Kunsthistorisches Museum de Vienne : un haut hall à coupole au
