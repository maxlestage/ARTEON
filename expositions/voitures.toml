# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Fardier à vapeur"
artiste = "Nicolas-Joseph Cugnot"
annee = "1770"
image = "fardier-cugnot.jpg"
licence = "CC0"
credit = "Photo : Joe deSousa"
source = "https://commons.wikimedia.org/wiki/File:Joseph_Cugnot%27s_1770_Fardier_%C3%A0_Vapeur,_Mus%C3%A9e_des_arts_et_m%C3%A9tiers,_Paris_2015.jpg"
technique = "Bois de chêne, fer forgé, chaudière et cylindres en cuivre et en bronze ; longueur environ 7,25 m"
collection = "Musée des Arts et Métiers, Paris"
note = "Le plus ancien véhicule automobile conservé au monde : un lourd chariot d'artillerie mû par la vapeur, construit pour l'armée de Louis XV."
description = """
Un long châssis de poutres de chêne repose sur trois roues de bois cerclées de fer : \
deux grandes roues à l'arrière, à gauche sur la photographie, et une seule roue à \
l'avant, à droite. Au-dessus de cette roue avant est suspendue une énorme chaudière de \
cuivre, ronde comme une marmite, surmontée de deux cylindres verticaux et d'un tuyau \
recourbé. Des bielles et des cliquets de fer transmettent le mouvement des pistons à la \
roue avant. Au milieu du châssis, un petit siège de bois pour le conducteur fait face à \
une barre de direction ; dessous pend un panier d'osier. Le fardier est exposé sur une \
estrade, entouré d'une rambarde, devant trois hautes fenêtres cintrées de l'ancienne \
église du musée."""
evocation = """
Le fardier n'a rien d'une voiture de promenade : c'est un engin de guerre. Après la \
guerre de Sept Ans, l'armée française cherche à déplacer plus vite ses lourds canons, \
tirés jusque-là par des attelages de chevaux. Cugnot imagine de remplacer les chevaux \
par la force de la vapeur, que l'on n'utilisait alors que dans des machines fixes, pour \
pomper l'eau des mines. Son chariot est le premier véhicule à se déplacer par sa \
propre force sur une route. Lent, lourd, difficile à diriger, il n'a jamais servi, \
mais il marque le début d'une longue histoire : celle de la machine qui avance seule, \
que l'on appellera plus tard l'automobile."""
histoire = """
Ingénieur militaire lorrain, Nicolas-Joseph Cugnot présente en 1769 un premier modèle \
réduit de son véhicule. Soutenu par le ministre Choiseul et par le général Gribeauval, \
inspecteur de l'artillerie, il obtient de faire construire à l'Arsenal de Paris un \
fardier en grandeur réelle, achevé en 1770 et essayé l'année suivante. La machine \
avance à quelques kilomètres à l'heure et doit s'arrêter souvent pour refaire de la \
vapeur. La disgrâce de Choiseul, à la fin de 1770, met fin au projet. Le fardier reste \
remisé à l'Arsenal ; il entre en 1800 au Conservatoire des arts et métiers, fondé \
quelques années plus tôt, où il est toujours exposé."""
facture = """
Le fardier associe le savoir-faire du charron et celui du chaudronnier. Le châssis, \
les roues à rayons et le siège sont faits comme ceux des voitures d'artillerie de \
l'époque, en chêne assemblé et renforcé de ferrures. La chaudière de cuivre, chauffée \
par un foyer placé dessous, envoie la vapeur dans deux cylindres de bronze dont les \
pistons travaillent tour à tour. Un système de cliquets transforme leur va-et-vient en \
rotation de la roue avant, qui est à la fois motrice et directrice. Tout le poids de \
la chaudière, porté en porte-à-faux devant la roue, rendait la direction très dure."""
details = [
  "La chaudière de cuivre, ronde comme une marmite, suspendue à l'avant.",
  "Les deux cylindres verticaux qui dominent la roue avant.",
  "Les cliquets de fer qui font tourner la roue motrice.",
  "Le petit siège du conducteur, au milieu du long châssis.",
  "Le panier d'osier suspendu sous le châssis.",
]
themes = ["vapeur", "artillerie", "invention", "lumières", "pionniers"]
anecdote = """
Une légende veut que le fardier, lors d'un essai, ait renversé un mur, ce qui en ferait \
le premier accident de la route. Aucun document de l'époque ne le confirme, mais \
l'histoire est racontée depuis le XIXᵉ siècle."""
salle = 1
mur = "nord"
position = 0
largeur = 8.4

[[oeuvres]]
titre = "Benz Patent-Motorwagen n° 1"
artiste = "Carl Benz"
annee = "1886"
image = "benz-patent-motorwagen.jpg"
credit = "Photo : Deutsches Museum, Munich"
licence = "CC BY-SA 4.0"
source = "https://commons.wikimedia.org/wiki/File:View_of_Left_Side_of_Benz_Patent_Motorwagen_in_Deutsches_Museum.jpg"
technique = "Tubes d'acier, bois, cuir, laiton et cuivre ; moteur monocylindre à quatre temps de 954 cm³, moins d'un cheval ; trois roues à rayons métalliques"
collection = "Deutsches Museum, Munich"
note = "Le tricycle breveté par Carl Benz en janvier 1886 : la première voiture conçue d'emblée autour d'un moteur à essence."
description = """
Le tricycle est vu de profil, sur un fond blanc. À l'avant, à gauche, une petite roue \
à fins rayons d'acier est tenue par une fourche, comme celle d'une bicyclette. Une \
longue colonne verticale porte à son sommet la manivelle de direction. Au centre, un \
plancher de lattes de bois noir mène à une banquette de cuir capitonné, à deux places, \
avec un dossier arrondi. Derrière la banquette, entre les deux grandes roues arrière à \
rayons, on voit le moteur : un réservoir de cuivre, une sphère de laiton brillant, des \
tubes et, couché à plat, un grand volant d'inertie. Une chaîne transmet le mouvement \
aux roues arrière."""
evocation = """
Le Motorwagen est une machine modeste, presque fragile : une bicyclette agrandie, un \
siège de calèche et un petit moteur. Il annonce pourtant un monde nouveau. Jusque-là, \
on avait installé des moteurs sur des voitures à chevaux ; Benz, lui, dessine un \
véhicule entier autour de son moteur à essence, châssis, direction et transmission \
compris. Le brevet allemand qu'il dépose le 29 janvier 1886 est souvent considéré \
comme l'acte de naissance de l'automobile. En août 1888, sa femme Bertha prouve que \
la machine peut servir : avec ses deux fils, elle parcourt plus de cent kilomètres, \
de Mannheim à Pforzheim, au volant d'une version améliorée."""
histoire = """
Carl Benz construit son tricycle dans son atelier de Mannheim en 1885 et dépose le \
brevet en janvier 1886 ; les premiers essais publics ont lieu dans les rues de la \
ville pendant l'été. Les passants se moquent de ce chariot sans cheval qui pétarade. \
Benz améliore ensuite son modèle et commence à le vendre, notamment en France, grâce \
à l'agent parisien Émile Roger. Ce premier exemplaire, la voiture n° 1, a été donné \
par son constructeur au Deutsches Museum de Munich, le grand musée allemand des \
sciences et des techniques, où il est exposé depuis le début du XXᵉ siècle. Les \
nombreux exemplaires visibles dans d'autres musées sont des répliques."""
facture = """
Benz emprunte beaucoup au cycle, alors en plein essor : cadre en tubes d'acier, roues \
à rayons métalliques, chaîne. Le moteur, de sa conception, est un monocylindre à \
quatre temps couché à l'arrière ; son grand volant d'inertie horizontal régularise la \
rotation. Le carburant s'évapore dans un carburateur à surface, et l'allumage est \
électrique, par une bobine et une batterie. L'eau de refroidissement s'évapore peu à \
peu et doit être rajoutée. Une courroie, un différentiel puis deux chaînes \
transmettent la force aux roues arrière ; le véhicule atteint environ 16 km/h. Le choix de trois roues évitait \
à Benz de résoudre le problème de la direction de deux roues avant."""
details = [
  "La manivelle de direction au sommet de la longue colonne.",
  "Le grand volant d'inertie couché à plat derrière la banquette.",
  "La sphère de laiton et le réservoir de cuivre du moteur.",
  "La chaîne qui entraîne les roues arrière.",
  "Le plancher de lattes de bois noir.",
]
themes = ["moteur", "brevet", "invention", "allemagne", "pionniers"]
anecdote = """
Pendant son voyage de 1888, Bertha Benz doit improviser : elle achète du solvant dans \
une pharmacie de Wiesloch pour faire le plein, et débouche une conduite de carburant \
avec une épingle à chapeau."""
salle = 1
mur = "sud"
position = -5
largeur = 3.2

[[oeuvres]]
titre = "Voiture Panhard et Levassor de 1891"
artiste = "Panhard et Levassor"
annee = "1891"
image = "panhard-levassor-1891.jpg"
licence = "Domaine public"
credit = "Photo : Alf van Beem"
source = "https://commons.wikimedia.org/wiki/File:1891_Panhard_%26_Levassor,_1,75cv_12kmh_moteur_Daimler_P2C_Gavois_(inv_5103)_photo_1.JPG"
technique = "Bois, fer, cuir et laiton ; moteur bicylindre Daimler à l'avant, 1,75 ch ; vitesse environ 12 km/h"
collection = "Cité de l'Automobile – Musée national, collection Schlumpf, Mulhouse"
note = "Une des premières voitures vendues par Panhard et Levassor, avec le moteur à l'avant : la disposition de presque toutes les voitures du siècle suivant."
description = """
La voiture est vue de trois quarts avant. Elle ressemble encore à une petite calèche : \
quatre roues de bois à rayons, plus grandes à l'arrière, et une capote de cuir noir \
relevée qui abrite une banquette capitonnée. Mais à l'avant, là où l'on attendrait un \
cheval, se dresse un caisson de bois noir percé de fentes d'aération : il contient le \
moteur. Sur sa face, un grand monogramme de laiton entrelace les lettres P et L. Une \
lanterne ronde, des graisseurs de laiton et une manivelle de démarrage dépassent de la \
caisse. Sous le châssis, on devine les chaînes de transmission. À droite, au second \
plan, apparaît une autre voiture ancienne du musée."""
evocation = """
Cette voiture est un moment de bascule. Ses formes sont celles d'une voiture à \
chevaux, mais son organisation est déjà celle de l'automobile moderne : le moteur à \
l'avant, puis l'embrayage, la boîte de vitesses et la transmission vers les roues \
arrière. Ce schéma, que l'on appellera le « système Panhard », s'imposera pendant des \
décennies. Il montre aussi la place de la France dans les débuts de l'automobile : le \
moteur est allemand, inventé par Gottlieb Daimler, mais ce sont des constructeurs \
parisiens qui en tirent les premières voitures vendues en série, avant que la course \
et les salons ne fassent de Paris la capitale de la nouvelle industrie."""
histoire = """
René Panhard et Émile Levassor fabriquent à Paris des machines à travailler le bois. \
À la fin des années 1880, ils obtiennent le droit de construire en France les moteurs \
de Gottlieb Daimler, par l'intermédiaire de la veuve d'Édouard Sarazin, qui devient \
l'épouse de Levassor. Après des essais avec un moteur placé au centre, Levassor \
choisit en 1891 de le mettre à l'avant. Les premières voitures sont vendues la même \
année à des clients particuliers. Le musée de Mulhouse présente celle-ci comme la \
voiture de l'abbé Gavois, un prêtre qui fut l'un des premiers acheteurs de la marque. \
Elle appartient aujourd'hui à la collection nationale de la Cité de l'Automobile."""
facture = """
La caisse et les roues sont l'œuvre d'un carrossier, comme pour une voiture attelée : \
bois peint, ferrures, cuir de la capote et de la banquette. La nouveauté est \
mécanique. Le moteur bicylindre en V, construit sous licence Daimler, est enfermé dans \
un caisson de bois à l'avant ; il tourne à quelques centaines de tours par minute et \
développe moins de deux chevaux. Un embrayage à friction et une boîte de vitesses à \
engrenages permettent de démarrer et de changer d'allure, puis des chaînes entraînent \
les roues arrière. Les roues sont cerclées de fer : les pneumatiques ne viendront \
qu'après 1895."""
details = [
  "Le monogramme de laiton PL sur le caisson du moteur.",
  "La capote de cuir relevée au-dessus de la banquette capitonnée.",
  "Les fentes d'aération du caisson de bois.",
  "La lanterne ronde fixée sur le côté du moteur.",
  "Les roues de bois cerclées de fer, plus grandes à l'arrière.",
]
themes = ["moteur", "paris", "invention", "voiture attelée", "pionniers"]
anecdote = """
En 1895, Émile Levassor arrive le premier de la course Paris–Bordeaux–Paris, après \
près de 49 heures de route, presque sans quitter le volant. Un monument lui rend \
hommage à la porte Maillot, à Paris."""
salle = 1
mur = "sud"
position = 5
largeur = 2.2

[[oeuvres]]
titre = "De Dion-Bouton vis-à-vis"
artiste = "De Dion-Bouton"
annee = "1900"
image = "de-dion-bouton-vis-a-vis.jpg"
licence = "CC0"
credit = "Photo : Alf van Beem"
source = "https://commons.wikimedia.org/wiki/File:1900_De_Dion-bouton3.5-HP_Vis-%C3%A0-Vis.JPG"
technique = "Acier, bois, cuir et laiton ; moteur monocylindre De Dion-Bouton de 3,5 ch placé à l'arrière"
collection = "Louwman Museum, La Haye"
note = "La petite voiture qui popularise l'automobile en Europe vers 1900 : deux passagers assis face au conducteur, d'où son nom."
description = """
La petite voiture est vue de trois quarts avant, sur un socle blanc, devant un mur bleu \
sombre. Elle a deux banquettes de cuir noir qui se font face : la plus haute, au fond, \
est celle du conducteur ; l'autre, à l'avant, accueille deux passagers assis dos à la \
route. Entre elles, une colonne de direction est couronnée d'un petit volant et de \
manettes de laiton. La caisse est noire, filetée de rouge sombre, et l'avant est \
garni d'une plaque de laiton. Deux grosses lanternes de laiton poli brillent sur le \
côté. Les quatre roues ont des rayons métalliques couleur crème et des pneumatiques. \
Une autre voiture ancienne apparaît à gauche."""
evocation = """
Avec ses passagers assis face au conducteur, comme dans une voiture à chevaux, le \
vis-à-vis est une voiture conviviale : on y bavarde autant qu'on y voyage. Il incarne \
la Belle Époque de l'automobile, ce moment où la voiture, encore réservée aux riches, \
devient un loisir à la mode, avec ses manteaux de fourrure, ses lunettes et ses \
voilettes contre la poussière. Le comte de Dion, son constructeur, en est la figure \
mondaine : fondateur de l'Automobile Club de France, organisateur de courses, il fait \
de la vitesse un spectacle. Ses petits moteurs légers, vendus à de nombreux \
constructeurs, équipent alors des milliers de voitures et de tricycles en Europe."""
histoire = """
Le comte Albert de Dion, le mécanicien Georges Bouton et son beau-frère Charles \
Trépardoux fondent leur entreprise à Paris en 1883 ; ils construisent d'abord des \
véhicules à vapeur. En 1894, un tracteur à vapeur De Dion arrive le premier au \
concours Paris–Rouen, souvent considéré comme la première compétition automobile. \
L'entreprise se tourne ensuite vers le moteur à essence : son petit monocylindre, qui \
tourne beaucoup plus vite que les moteurs de l'époque, équipe d'abord des tricycles, \
puis des voiturettes comme ce vis-à-vis. Vers 1900, De Dion-Bouton est l'un des plus \
grands constructeurs du monde. Cet exemplaire est conservé au Louwman Museum, le musée \
de l'automobile de La Haye."""
facture = """
Le secret de la voiture est son moteur : un monocylindre léger, refroidi par eau, qui \
tourne à près de 1 500 tours par minute, presque deux fois plus vite que ses \
concurrents, et fournit ainsi plus de puissance pour un poids réduit. Il est placé à \
l'arrière, sous la banquette du conducteur. La transmission utilise le pont De Dion, \
une suspension arrière ingénieuse inventée par l'atelier, encore employée bien plus \
tard sur des voitures de course. La caisse, en bois et en tôle peinte, est finie avec \
soin, filets de couleur, garnitures de cuir et accessoires de laiton qu'il fallait \
astiquer après chaque sortie."""
details = [
  "Les deux banquettes de cuir qui se font face.",
  "Les manettes de laiton au sommet de la colonne de direction.",
  "Les deux grosses lanternes de laiton poli.",
  "Les roues à rayons couleur crème et leurs pneumatiques.",
  "Les filets rouge sombre sur la caisse noire.",
]
themes = ["belle époque", "voiturette", "course", "paris", "laiton"]
anecdote = """
Le comte de Dion finança en 1900 la création du journal sportif L'Auto, qui organisa \
trois ans plus tard le premier Tour de France cycliste."""
salle = 2
mur = "sud"
position = -4
largeur = 3.0

