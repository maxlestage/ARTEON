#  EXPOSITION « VOITURES » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/voitures/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /voitures.
#
#  Les voitures datent toutes d'avant 1931. Leurs photographies viennent de
#  Wikimedia Commons : dans le domaine public, en CC0, ou sous licence CC BY ou
#  CC BY-SA, dont l'auteur est alors crédité dans le bloc de l'œuvre. L'estampe
#  de Toulouse-Lautrec vient du National Gallery of Art de Washington (CC0).
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 172
nom_court = "Voitures"
mouvement = "L'automobile, des origines aux années folles"
cadre = "vitrine"
couleur = "#4b5d6e"
titre = "Voitures, l'automobile des pionniers aux années folles"
artiste = "Cugnot, Benz, Panhard et Levassor, De Dion-Bouton, Rolls-Royce, Ford, Hispano-Suiza, Bugatti…"
dates = "1770–1929"
accroche = "Exposition virtuelle · Cité de l'Automobile – Musée national, collection Schlumpf, Mulhouse"
introduction = """
En un siècle et demi, la voiture passe du rêve d'ingénieur à l'objet de tous les jours. \
La visite réunit dix pièces, du fardier à vapeur de Cugnot, construit pour l'armée de \
Louis XV, à la Bugatti Royale d'Ettore Bugatti, en passant par le tricycle de Carl Benz, \
les premières Panhard et Levassor, la petite De Dion-Bouton de 1900, la Rolls-Royce \
Silver Ghost, la Ford T et la Hispano-Suiza en bois de Dubonnet. Deux images complètent \
le parcours : une estampe de Toulouse-Lautrec et l'affiche du Bibendum Michelin. Le \
bâtiment s'inspire de la Cité de l'Automobile de Mulhouse, installée dans une ancienne \
filature : une enfilade d'ateliers mène à une grande halle aux allées bordées de \
lampadaires, où brillent les voitures de luxe des années folles."""
vitrine = "bugatti-royale-napoleon.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Cité de l'Automobile – Musée national, collection Schlumpf"
ville = "Mulhouse, France"
construction = "ancienne filature du XIXᵉ siècle ; musée ouvert en 1982"
presentation = """
Le musée de Mulhouse est né d'une passion secrète. Les frères Hans et Fritz Schlumpf, \
industriels du textile, possèdent en Alsace des filatures de laine. À partir de la fin \
des années 1950, Fritz achète sans compter des voitures anciennes, surtout des Bugatti, \
et les fait restaurer dans les bâtiments d'une de leurs usines de Mulhouse, à l'abri \
des regards. En 1976, l'entreprise s'effondre et les frères partent pour la Suisse ; \
au début de 1977, les ouvriers qui occupent l'usine découvrent l'immense collection. \
L'État la fait classer monument historique, puis une association la rachète et ouvre \
en 1982 le Musée national de l'automobile, devenu en 2006 la Cité de l'Automobile. Plus \
de quatre cents voitures y sont exposées, dont deux Bugatti Royale, dans une halle \
immense éclairée par des centaines de lampadaires inspirés de ceux du pont \
Alexandre-III, à Paris."""
ici = """
Le bâtiment d'ARTEON reprend l'idée de la filature transformée en musée. On entre par \
le sud dans l'atelier des pionniers, aux murs de brique claire, haut de 7 mètres, puis \
on passe à la salle de la Belle Époque, couleur de crème, et à l'atelier de \
l'automobile pour tous, gris comme un hangar d'usine. Vient ensuite la grande halle, \
longue de 28 mètres et haute de 10, aux murs bleu nuit comme les allées de Mulhouse, \
où les voitures de luxe sont alignées comme sous les lampadaires du musée alsacien. \
La visite s'achève dans un petit salon couleur de papier ancien, consacré à l'image de \
l'automobile. Les voitures sont présentées à leur taille réelle, dans de grandes \
vitrines murales."""

# ─── Le plan du musée ────────────────────────────────────────────────────────
