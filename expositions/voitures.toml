# filature : des ateliers en enfilade, puis la grande halle aux allées bordées de
# lampadaires où la collection Schlumpf aligne ses voitures. Ici, cinq salles en
# ligne d'ouest en est ; la grande halle est beaucoup plus vaste et plus haute.
# x et z : le centre de la salle (x vers l'est, z vers le sud), en mètres ; une
