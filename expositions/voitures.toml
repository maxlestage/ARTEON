technique = "Photographie anonyme publiée en 1908 dans « The Motor Car: A History and Souvenir » de W. Eden Hooper ; la voiture : châssis 40/50 HP, moteur six cylindres de 7 litres, carrosserie peinte couleur d'aluminium"
collection = "Photographie publiée en 1908 ; la voiture AX 201 est toujours conservée en Angleterre"
note = "La voiture qui a fait la réputation de Rolls-Royce, photographiée l'année de sa construction : la Silver Ghost, le « fantôme d'argent »."
description = """
Une photographie en noir et blanc, sur une page de livre, montre une grande voiture \
découverte arrêtée sur des pavés. Sa carrosserie claire, presque blanche, brille comme \
du métal. On voit, de trois quarts avant, les gros phares, le radiateur haut et \
étroit, les ailes souples et les roues à rayons de bois clair. Cinq hommes en \
casquette et en manteau sont assis à bord ; un sixième, en long cache-poussière, \
lunettes de route sur la casquette, se tient debout devant la portière arrière. Au \
volant, selon la légende, est assis Claude Johnson. Sous l'image, une légende en \
anglais dit : « La célèbre voiture Rolls-Royce à six cylindres Silver Ghost »."""
evocation = """
La photographie a été prise pour vanter une voiture d'exception, et elle y parvient. \
Tout dit la solidité tranquille : la masse claire de la carrosserie, les hommes \
installés comme dans un salon, le chauffeur debout qui semble garder le véhicule. \
Pour Rolls-Royce, jeune entreprise fondée en 1906, la Silver Ghost devait prouver que \
l'on pouvait construire une voiture silencieuse, douce et infatigable. Le nom choisi \
par Claude Johnson joue sur ces deux qualités : l'argent de la carrosserie et le \
silence d'un fantôme. Depuis, la marque n'a cessé d'être synonyme de luxe, et cette \
voiture est sans doute la plus célèbre de son histoire."""
histoire = """
Charles Rolls, aristocrate passionné d'automobile, et Henry Royce, ingénieur de \
Manchester, s'associent en 1904. En 1906, ils présentent le châssis 40/50 HP à six \
cylindres. Le douzième exemplaire, immatriculé AX 201, est peint couleur d'aluminium \
et garni d'accessoires argentés ; Claude Johnson, directeur commercial de la firme, \
le baptise Silver Ghost. En 1907, la voiture parcourt quelque 15 000 miles, plus de \
24 000 kilomètres, entre Londres et Glasgow et sur les routes d'Écosse, sous le \
contrôle de l'Automobile Club, avec très peu de pannes. Revendue, elle a été rachetée \
par Rolls-Royce en 1948. Cette photographie a été publiée dès 1908 dans un livre \
consacré à l'automobile."""
facture = """
La photographie, faite en plein jour, joue sur le contraste entre la carrosserie \
claire et les vêtements sombres des passagers ; le photographe s'est placé de trois \
quarts avant pour montrer à la fois la longueur de la voiture et son radiateur, \
devenu l'emblème de la marque. Reproduite par la similigravure, technique qui \
permettait d'imprimer les photographies dans les livres, elle garde sur la page un \
léger grain. La voiture elle-même est une pièce de mécanique soignée : moteur de six \
cylindres d'environ 7 litres, réputé pour son silence, châssis robuste et carrosserie \
découverte de type tourisme, faite à la main."""
details = [
  "La carrosserie claire, peinte couleur d'aluminium.",
  "Le haut radiateur étroit, encadré de deux gros phares.",
  "Le passager debout en cache-poussière, lunettes sur la casquette.",
  "Les roues à rayons de bois clair.",
  "Les pavés de la rue sous les roues.",
]
themes = ["luxe", "belle époque", "angleterre", "photographie", "endurance"]
anecdote = """
L'immatriculation AX 201 de la Silver Ghost est restée attachée à la voiture ; on dit \
souvent qu'elle est l'automobile la plus précieuse du monde, même si elle n'a jamais \
été mise en vente depuis son rachat par Rolls-Royce."""
salle = 2
mur = "nord"
position = 0
largeur = 5.4

[[oeuvres]]
titre = "Ford T Touring"
artiste = "Ford Motor Company"
annee = "1913"
image = "ford-t-1913.jpg"
credit = "Photo : Mariordo (Mario Roberto Duran Ortiz)"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:1913_Ford_Model_T_Touring_01_2012_DC_00476.JPG"
technique = "Acier au vanadium, bois, cuir et laiton ; moteur quatre cylindres de 2,9 litres, 20 ch ; boîte épicycloïdale à deux vitesses"
collection = "National Museum of American History, Smithsonian Institution, Washington"
note = "La voiture qui a mis l'Amérique sur la route : produite à plus de quinze millions d'exemplaires entre 1908 et 1927."
description = """
La Ford T est vue de trois quarts avant, sur une estrade couverte de moquette, devant \
un fond bleu. C'est une voiture de tourisme à cinq places, haute sur ses roues : une \
capote de toile beige tendue sur des arceaux abrite deux banquettes de cuir noir \
capitonné. La caisse est noire et brillante ; une planche de bois verni sépare le \
capot du poste de conduite. À l'avant, le radiateur de laiton porte le nom Ford en \
lettres cursives, entre deux gros phares de laiton. Les roues sont en bois peint en \
noir, à douze rayons, avec des pneus clairs. Un pare-brise vertical se dresse devant \
le volant."""
evocation = """
Henry Ford voulait construire « une voiture pour la multitude », assez solide pour les \
mauvaises routes des campagnes américaines et assez bon marché pour qu'un ouvrier \
puisse l'acheter. La Ford T a tenu cette promesse. Simple à conduire et à réparer, \
elle transforme la vie des fermiers, des médecins de campagne, des familles qui \
découvrent les vacances sur la route. Elle change aussi le travail : pour la produire, \
Ford invente la chaîne de montage mobile, qui devient le modèle de toute l'industrie \
du XXᵉ siècle. Surnommée « Tin Lizzie », elle reste le symbole de l'entrée de \
l'automobile dans la vie de tous les jours."""
histoire = """
La Ford T est présentée en octobre 1908 et fabriquée à Detroit, puis dans l'usine de \
Highland Park. En 1913, Ford y met en service la chaîne de montage mobile : le temps \
d'assemblage d'un châssis passe de plus de douze heures à environ une heure et demie, \
et le prix de la voiture baisse année après année. En 1914, Ford double le salaire de \
ses ouvriers, à cinq dollars par jour. Lorsque la production s'arrête en 1927, plus de \
quinze millions de Ford T ont été construites. Cet exemplaire de 1913 est exposé au \
National Museum of American History, à Washington ; selon le musée, il a reçu à la \
demande de son propriétaire un démarreur et des phares électriques."""
facture = """
La Ford T est conçue pour être produite en masse et réparée par n'importe qui. Son \
moteur à quatre cylindres, fondu d'un seul bloc avec une culasse démontable, est \
simple et robuste. Ford emploie de l'acier au vanadium, plus léger et plus résistant \
que l'acier ordinaire. La boîte de vitesses épicycloïdale se commande au pied, par \
trois pédales, ce qui demande un apprentissage particulier. La voiture est haute sur \
ses roues pour franchir les ornières, et sa suspension par ressorts transversaux lui \
permet de suivre les routes déformées. Les pièces sont interchangeables : on les \
achetait par catalogue et on les montait soi-même."""
details = [
  "Le nom Ford en lettres cursives sur le radiateur de laiton.",
  "Les deux gros phares de laiton de part et d'autre du radiateur.",
  "La capote de toile beige tendue sur ses arceaux.",
  "La planche de bois verni entre le capot et le poste de conduite.",
  "Les roues de bois à douze rayons.",
]
themes = ["production en série", "amérique", "usine", "chaîne de montage", "démocratisation"]
anecdote = """
Henry Ford aurait dit que le client pouvait choisir n'importe quelle couleur, pourvu \
que ce soit le noir : de 1914 à 1925, la Ford T n'est livrée qu'en noir, une peinture \
qui séchait plus vite que les autres."""
salle = 3
mur = "nord"
position = 0
largeur = 4.2

[[oeuvres]]
titre = "Hispano-Suiza H6C « Tulipwood » Torpedo"
artiste = "Hispano-Suiza"
annee = "1924"
image = "hispano-suiza-tulipwood.jpg"
credit = "Photo : Prova MO"
licence = "CC BY-SA 4.0"
source = "https://commons.wikimedia.org/wiki/File:1924_Hispano_Suiza_H6C_Tulipwood_Torpedo_front.jpg"
technique = "Châssis H6C, moteur six cylindres en ligne de 8 litres ; carrosserie Nieuport-Astra en lattes de bois rivetées sur une armature légère"
collection = "Collection particulière"
note = "La voiture de course et de prestige du pilote André Dubonnet, à la carrosserie de bois rivetée comme une coque d'avion."
description = """
La voiture est vue de trois quarts avant, sur une estrade noire. Toute sa carrosserie \
est en bois verni, d'un brun doré, faite de lattes étroites fixées par des milliers de \
petits rivets de cuivre. Les ailes arrondies, les capots et la poupe effilée sont en \
bois eux aussi. À l'avant, un radiateur chromé porte le nom Hispano en écriture \
penchée, entre deux phares protégés par une grille. Les roues ont des rayons \
métalliques cuivrés, et une roue de secours est fixée sur le flanc, derrière le capot \
percé d'ouïes d'aération. Un gros tuyau annelé sort du capot. Derrière la voiture, un \
grand écran montre des images d'intérieurs de voitures."""
evocation = """
La Tulipwood résume le luxe sportif des années folles. Son propriétaire, André \
Dubonnet, héritier de la célèbre marque d'apéritif, était un as de l'aviation pendant \
la Grande Guerre et un pilote de course. Il demande au constructeur d'avions \
Nieuport-Astra une carrosserie aussi légère qu'une aile : le bois, matériau des \
avions de l'époque, devient ici un signe d'élégance. La voiture associe ainsi la \
vitesse, l'aviation et le goût des matériaux précieux. La marque elle-même est liée à \
l'aviation : sur ses radiateurs vole une cigogne d'argent, en souvenir de l'escadrille \
des Cigognes de Georges Guynemer, dont les avions avaient des moteurs Hispano-Suiza."""
histoire = """
Fondée à Barcelone en 1904, la société Hispano-Suiza doit son nom à son ingénieur, le \
Suisse Marc Birkigt. Pendant la Première Guerre mondiale, ses moteurs d'avion \
équipent des milliers de chasseurs alliés. En 1919, la marque présente au Salon de \
Paris la H6, une voiture de grand luxe fabriquée en France, dont le moteur à six \
cylindres dérive de cette expérience. La version H6C, plus puissante, est destinée au \
sport. En 1924, André Dubonnet fait carrosser la sienne par Nieuport-Astra et \
l'engage en course. La voiture, conservée depuis dans des collections privées, a été \
exposée aux États-Unis, notamment au Blackhawk Museum de Californie, et présentée aux \
enchères à Monterey en 2022."""
facture = """
La carrosserie est construite comme un fuselage d'avion : de fines lattes de bois \
sont posées sur une armature légère, puis fixées par des rivets de cuivre, alignés en \
longues rangées qui dessinent les formes de la voiture. Le bois, poncé et verni, \
laisse voir son veinage. Sous le capot, le moteur de Birkigt est un six cylindres en \
ligne en alliage d'aluminium, à arbre à cames en tête. La H6 est aussi l'une des \
premières voitures à freins sur les quatre roues, assistés par un servo-frein \
mécanique entraîné par la boîte de vitesses, un système si efficace que Rolls-Royce en \
acheta la licence."""
details = [
  "Les rangées de rivets de cuivre sur les lattes de bois verni.",
  "Le nom Hispano en écriture penchée sur le radiateur.",
  "Les grilles qui protègent les deux phares.",
  "Les roues à rayons cuivrés et la roue de secours sur le flanc.",
  "Les ouïes d'aération sur le côté du capot.",
]
themes = ["luxe", "années folles", "bois", "aviation", "course"]
anecdote = """
Le surnom de la voiture, « Tulipwood », désigne un bois précieux ; certains \
spécialistes pensent pourtant que sa carrosserie est plutôt en acajou. Le surnom, lui, \
est resté."""
salle = 4
mur = "sud"
position = 0
largeur = 5.5

[[oeuvres]]
titre = "Bugatti Type 41 Royale, « Coupé Napoléon »"
artiste = "Ettore Bugatti"
annee = "vers 1929"
image = "bugatti-royale-napoleon.jpg"
credit = "Photo : Aurélien Boffy"
licence = "CC BY 3.0"
source = "https://commons.wikimedia.org/wiki/File:Bugatti_Royale_Coup%C3%A9_Napol%C3%A9on.jpg"
technique = "Moteur huit cylindres en ligne de 12,7 litres ; empattement 4,30 m, longueur environ 6,40 m ; carrosserie de coupé de ville"
collection = "Cité de l'Automobile – Musée national, collection Schlumpf, Mulhouse"
note = "La voiture personnelle d'Ettore Bugatti, sur le châssis prototype de la Royale : l'automobile la plus grande et la plus luxueuse de son temps."
description = """
La Royale, immense, est vue de trois quarts avant sur un tapis rouge, dans une allée \
du musée de Mulhouse éclairée par des lampadaires à globes. Sa carrosserie est noire \
et bleue : un long capot noir, des flancs bleu clair et un toit fermé sur l'arrière, \
tandis que la place du chauffeur, à l'avant, est découverte. De grandes ailes noires \
s'étirent en courbe des roues avant jusqu'aux marchepieds. Le radiateur en fer à \
cheval, chromé, est encadré par deux énormes phares ; au sommet, une petite statuette \
d'éléphant dressé sur ses pattes arrière sert de bouchon. Les roues ont des \
enjoliveurs pleins. Derrière, d'autres voitures de la collection."""
evocation = """
Ettore Bugatti voulait construire la voiture des rois. La Royale devait rivaliser avec \
les plus grandes Rolls-Royce et attirer les souverains d'Europe ; elle arrive au moment \
de la crise de 1929, et seules six sont construites, dont trois vendues. Elle est \
restée le symbole d'un luxe sans mesure, celui des années folles finissantes. Le \
Coupé Napoléon, que Bugatti utilisait lui-même, a aussi une dimension familiale : \
l'éléphant du bouchon de radiateur reprend une sculpture de son frère Rembrandt \
Bugatti, sculpteur animalier mort en 1916. La voiture associe ainsi l'art et la \
mécanique, comme l'avait fait leur père Carlo, créateur de meubles."""
histoire = """
Ettore Bugatti, Italien installé à Molsheim, en Alsace, conçoit la Royale au milieu \
des années 1920. Le prototype, sur le châssis 41100, roule dès 1926 et reçoit \
plusieurs carrosseries successives ; celle de coupé de ville, dite « Coupé Napoléon », \
date de la fin des années 1920. Bugatti la garde pour son usage personnel, et elle \
reste dans la famille après sa mort, en 1947. En 1963, les frères Schlumpf rachètent \
un ensemble de voitures conservées à Molsheim par la famille Bugatti, dont celle-ci. Découverte avec le \
reste de leur collection en 1977, elle est aujourd'hui l'une des deux Royale \
exposées à la Cité de l'Automobile de Mulhouse."""
facture = """
Tout est démesuré dans la Royale. Son moteur à huit cylindres en ligne, de près de \
13 litres, est dérivé d'un projet de moteur d'avion ; d'une seule pièce avec ses \
cylindres et sa culasse, il est taillé dans des blocs usinés avec la précision \
d'horloger qui fait la réputation de Bugatti. Les roues, en alliage coulé, portent les \
tambours de frein. La carrosserie du Coupé Napoléon reprend la forme des voitures de \
maître : le chauffeur à l'air libre, le propriétaire dans un salon fermé, éclairé par \
des vitres à l'arrière. Les lignes tendues du capot et des ailes annoncent le style \
de Jean Bugatti, le fils d'Ettore."""
details = [
  "L'éléphant dressé du bouchon de radiateur, d'après Rembrandt Bugatti.",
  "Le radiateur chromé en fer à cheval, signature de la marque.",
  "Les deux énormes phares de part et d'autre du radiateur.",
  "Les flancs bleu clair entre le capot et les ailes noires.",
  "Les lampadaires à globes de l'allée du musée.",
]
themes = ["luxe", "années folles", "alsace", "démesure", "collection"]
anecdote = """
Le moteur de la Royale a connu une seconde vie : faute d'acheteurs pour la voiture, \
Bugatti l'utilisa pour propulser des autorails, des trains rapides qui roulèrent en \
France jusque dans les années 1950."""
salle = 4
mur = "nord"
position = 0
largeur = 7.5

[[oeuvres]]
titre = "L'Automobiliste"
artiste = "Henri de Toulouse-Lautrec"
annee = "1896–1898"
image = "lautrec-automobiliste.jpg"
licence = "CC0"
cadre = "estampe"
source = "https://commons.wikimedia.org/wiki/File:Henri_de_Toulouse-Lautrec,_The_Motorist_(L%27automobiliste),_1896,_NGA_33915.jpg"
technique = "Lithographie en noir sur papier"
collection = "National Gallery of Art, Washington (Rosenwald Collection, 1947.7.157)"
note = "Un conducteur emmitouflé de fourrure fonce sur la route, dans un nuage de poussière : Lautrec saisit en quelques traits la nouvelle figure de l'automobiliste."
description = """
Au premier plan, à gauche, un homme massif est assis au volant d'une voiture dont on ne \
voit que l'avant, en bas de l'image, et le volant à rayons. Il est enveloppé d'un \
énorme manteau de fourrure, aux poils dessinés par des hachures nerveuses ; une \
casquette plate et des lunettes rondes encadrent son visage moustachu. Sa main droite \
gantée serre une manette. Derrière lui, un grand nuage de poussière ou de fumée \
s'élève vers le ciel. À droite, à peine esquissée au trait, une femme élégante en robe \
longue s'éloigne sur le bord de la route, suivie d'un petit chien. Dans la marge, en \
bas, une inscription manuscrite au crayon."""
evocation = """
Lautrec, peintre des cabarets et des cirques, s'intéresse à toutes les nouveautés de \
la vie moderne : la bicyclette, le théâtre, et maintenant l'automobile. Il en montre \
moins la machine que l'homme qu'elle transforme. Son conducteur, presque caricatural, \
n'est plus qu'une masse de fourrure, de lunettes et de détermination, lancé dans un \
tourbillon de poussière. Le contraste avec la promeneuse et son petit chien, légers, \
dessinés d'un trait fin, est plein d'ironie : l'ancien monde, celui de la flânerie, \
regarde passer le nouveau. On reconnaît traditionnellement dans le conducteur le \
cousin de l'artiste, le docteur Gabriel Tapié de Céleyran."""
histoire = """
Henri de Toulouse-Lautrec pratique intensément la lithographie à partir de 1891, pour \
des affiches, des couvertures de partitions et des estampes vendues aux amateurs. \
L'Automobiliste date de la fin des années 1890, alors que les premières voitures \
commencent à circuler sur les routes de France ; le National Gallery of Art la date de \
1896, d'autres catalogues de 1898. La planche, éditée en petit nombre, figure dans le \
catalogue de l'œuvre gravé de Lautrec établi par Loys Delteil. Cette épreuve fait \
partie de l'immense collection d'estampes du collectionneur américain Lessing J. \
Rosenwald, donnée au National Gallery of Art de Washington, et entrée au musée en \
1947."""
facture = """
La lithographie permet à Lautrec de dessiner directement sur la pierre, au crayon \
gras, avec la même liberté que sur une feuille de papier. Il oppose ici deux \
manières : des hachures serrées et vigoureuses, presque noires, pour le manteau de \
fourrure et la poussière, et un trait fin, à peine appuyé, pour la promeneuse et le \
paysage. Les blancs du papier deviennent la route et le ciel. Le cadrage, coupé net \
sur le volant et le bord de la voiture, vient des estampes japonaises et de la \
photographie, que Lautrec admirait : il donne au spectateur l'impression d'être assis \
à côté du conducteur."""
details = [
  "Les lunettes rondes et la casquette plate du conducteur.",
  "Les hachures nerveuses du manteau de fourrure.",
  "Le volant à rayons, coupé par le bord de l'image.",
  "La promeneuse esquissée au trait et son petit chien.",
  "Le monogramme de l'artiste dans un cercle, en bas à gauche.",
]
themes = ["estampe", "vie moderne", "vitesse", "caricature", "belle époque"]
anecdote = """
Lautrec aimait aussi le cyclisme : en 1896, il dessine pour les cycles Simpson \
l'affiche « La Chaîne Simpson », où pose le coureur Constant Huret."""
salle = 5
mur = "est"
position = 0
largeur = 0.6

[[oeuvres]]
titre = "Nunc est bibendum !!… Le pneu Michelin boit l'obstacle !"
artiste = "O'Galop (Marius Rossillon)"
annee = "1898"
image = "michelin-nunc-est-bibendum.jpg"
licence = "Domaine public"
cadre = "noir"
source = "https://commons.wikimedia.org/wiki/File:Michelin_Poster_1898.jpg"
technique = "Affiche lithographiée en couleurs (reproduction)"
collection = "Affiche publicitaire pour Michelin ; exemplaires dans plusieurs collections"
note = "La première apparition du Bibendum, le bonhomme fait de pneus, qui lève sa coupe de clous et de tessons de verre."
description = """
Sur un fond bleu vert, un personnage blanc fait d'une pile de pneus empilés, avec un \
lorgnon sur le nez, est attablé devant une nappe blanche. Il lève de la main droite \
une coupe remplie de clous et de morceaux de verre, prête à être bue. De part et \
d'autre, deux autres personnages en pneus, dégonflés et grimaçants, l'un d'eux \
marqué « Pneu X », semblent mal en point. En haut, en grandes lettres rouges, on lit \
« Nunc est bibendum !!… », puis « c'est-à-dire : ». En bas, sur la nappe : « À votre \
santé, le pneu Michelin boit l'obstacle ! ». La signature d'O'Galop est à droite."""
evocation = """
L'affiche transforme un argument technique en image inoubliable. La route de 1898 est \
semée de clous de fer à cheval et de tessons : le pneu Michelin, dit-elle, les avale \
sans crever, alors que les pneus concurrents, dégonflés, font triste mine. La formule \
latine vient d'une ode d'Horace, « c'est maintenant qu'il faut boire », et le \
bonhomme en pneus y gagne son nom : Bibendum. Il deviendra l'un des personnages \
publicitaires les plus célèbres du monde. L'affiche montre aussi que l'automobile \
crée tout un commerce autour d'elle, pneus, carburant, guides et cartes routières, \
dont la publicité s'empare aussitôt."""
histoire = """
Les frères André et Édouard Michelin reprennent en 1889 une entreprise de caoutchouc \
de Clermont-Ferrand. Ils mettent au point un pneu de bicyclette démontable, puis \
engagent en 1895 dans la course Paris–Bordeaux–Paris une voiture montée sur \
pneumatiques, l'Éclair. Selon la tradition de l'entreprise, la vue d'une pile de pneus \
à l'exposition de Lyon de 1894 aurait donné à Édouard l'idée d'un personnage. En 1898, \
le dessinateur O'Galop reprend pour Michelin un projet d'affiche refusé par une \
brasserie, où un buveur lève sa chope : Bibendum est né. Cette reproduction a été \
numérisée d'après un calendrier."""
facture = """
O'Galop, dessinateur d'humour, construit l'affiche comme un dessin de presse : des \
contours nets, des aplats de couleur, des personnages expressifs. Le Bibendum est fait \
de pneus de bicyclette empilés, blancs comme l'était alors le caoutchouc, avant que \
l'on n'ajoute du noir de carbone. Le rouge des lettres et le bleu vert du fond \
ressortent vivement, comme le veut l'affiche de rue, faite pour être lue de loin. Le \
texte, mêlant latin et français, est intégré à l'image : il se lit de haut en bas, \
comme une histoire drôle avec sa chute, « le pneu Michelin boit l'obstacle »."""
