# ─── Les artistes et les constructeurs ───────────────────────────────────────

[[artistes]]
nom = "Nicolas-Joseph Cugnot"
vie = "Void (Lorraine), 26 février 1725 – Paris, 2 octobre 1804"
biographie = """
Né en Lorraine, Nicolas-Joseph Cugnot devient ingénieur militaire et sert dans \
l'armée autrichienne, où il s'intéresse aux fortifications et aux machines. Revenu à \
Paris vers 1763, il publie des ouvrages sur l'art militaire et la fortification. Il \
se passionne pour la force de la vapeur, que l'on utilise alors surtout pour pomper \
l'eau des mines, et propose de l'employer pour tirer les canons. Avec l'appui du duc \
de Choiseul, ministre de la Guerre, et du général Gribeauval, il construit en 1769 un \
premier modèle, puis en 1770 le grand fardier du Conservatoire des arts et métiers. \
Le projet est abandonné après la disgrâce de Choiseul. Cugnot reçoit une pension du \
roi, perdue sous la Révolution puis rétablie par Bonaparte peu avant sa mort."""

[[artistes]]
nom = "Carl Benz"
vie = "Mühlburg (Karlsruhe), 25 novembre 1844 – Ladenburg, 4 avril 1929"
biographie = """
Fils d'un mécanicien de locomotive mort quand il avait deux ans, Carl Benz étudie la \
mécanique à l'école polytechnique de Karlsruhe. Après plusieurs emplois, il fonde à \
Mannheim un atelier où il met au point des moteurs à gaz à deux temps, puis un moteur \
à essence à quatre temps. En 1885, il construit un tricycle autour de ce moteur et \
dépose en janvier 1886 le brevet du Motorwagen. Sa femme Bertha, qui a investi sa dot \
dans l'entreprise, fait en 1888 le premier long voyage en automobile. Benz & Cie \
devient dans les années 1890 l'un des premiers grands constructeurs du monde, avec \
la Velo, une petite voiture vendue en série. En 1926, l'entreprise fusionne avec la \
Daimler-Motoren-Gesellschaft pour former Daimler-Benz, la maison des voitures \
Mercedes-Benz."""

[[artistes]]
nom = "Panhard et Levassor"
vie = "Paris, 1886 (association) ; René Panhard, 1841–1908 ; Émile Levassor, 1843–1897"
biographie = """
René Panhard et Émile Levassor, tous deux ingénieurs sortis de l'École centrale, \
dirigent à Paris, avenue d'Ivry, une entreprise de machines à travailler le bois. Par \
Édouard Sarazin, représentant de Gottlieb Daimler en France, ils découvrent le moteur \
à essence ; après la mort de Sarazin, sa veuve Louise, qui détient la licence, épouse \
Levassor en 1890. L'entreprise construit alors des moteurs Daimler et, dès 1891, des \
voitures vendues à des particuliers, avec le moteur à l'avant. Levassor, excellent \
pilote, gagne la course Paris–Bordeaux–Paris en 1895, mais meurt en 1897 des suites \
d'un accident de course. La société Panhard et Levassor reste pendant des décennies \
l'un des grands noms de l'automobile française, avant d'être absorbée par Citroën \
en 1965."""

[[artistes]]
nom = "De Dion-Bouton"
vie = "Paris et Puteaux, 1883–1932 ; Albert de Dion, 1856–1946 ; Georges Bouton, 1847–1938"
biographie = """
Le comte Albert de Dion, jeune aristocrate fortuné et passionné de mécanique, \
s'associe en 1883 avec Georges Bouton, fabricant de jouets mécaniques, et son \
beau-frère Charles Trépardoux. L'atelier construit d'abord des voitures et des \
tracteurs à vapeur, puis, à partir de 1895, de petits moteurs à essence à haut \
régime qui équipent tricycles et voiturettes. Ces moteurs, vendus à des dizaines de \
constructeurs en France et à l'étranger, font de l'usine de Puteaux l'une des plus \
importantes du monde vers 1900. Le comte de Dion fonde en 1895 l'Automobile Club de \
France avec le baron de Zuylen et le journaliste Paul Meyan, et devient plus tard \
député et sénateur. La marque décline après la Première Guerre mondiale et cesse de \
produire des voitures au début des années 1930."""

[[artistes]]
nom = "Rolls-Royce"
vie = "Manchester puis Derby (Angleterre), fondé en 1906 ; Charles Rolls, 1877–1910 ; Henry Royce, 1863–1933"
biographie = """
Henry Royce, fils d'un meunier ruiné, apprend la mécanique dans les ateliers du \
chemin de fer et fonde à Manchester une entreprise de matériel électrique. Mécontent \
de sa voiture française, il construit en 1904 ses propres automobiles, d'une qualité \
remarquable. Charles Rolls, fils d'un lord, pilote et vendeur de voitures à Londres, \
s'engage à vendre toute sa production : Rolls-Royce Limited est fondée en 1906. Le \
directeur commercial Claude Johnson fait de la 40/50 HP Silver Ghost la vitrine de \
la marque. Rolls meurt en 1910 dans un accident d'avion ; Royce, malade, dirige les \
études depuis sa maison du sud de l'Angleterre. Pendant la guerre, l'entreprise \
fabrique aussi des moteurs d'avion, qui deviennent avec les voitures de luxe sa \
grande spécialité."""

[[artistes]]
nom = "Ford Motor Company"
vie = "Detroit (Michigan), fondée en 1903 ; Henry Ford, 1863–1947"
biographie = """
Henry Ford, fils de fermiers du Michigan, travaille comme mécanicien puis comme \
ingénieur à la compagnie d'électricité Edison de Detroit. Il construit sa première \
voiture, le Quadricycle, en 1896. Après deux échecs, il fonde en 1903 la Ford Motor \
Company, qui lance en 1908 la Ford T. Pour la produire à bas prix, Ford organise \
l'usine de Highland Park autour de la chaîne de montage mobile, mise en service en \
1913, et augmente fortement les salaires en 1914 pour retenir ses ouvriers. Le \
succès est immense : à la fin des années 1910, une voiture sur deux aux États-Unis \
est une Ford T. La Ford T est remplacée en 1927 par la Ford A. Henry Ford, figure \
controversée pour ses positions politiques et son antisémitisme, dirige l'entreprise \
jusqu'en 1945."""

[[artistes]]
nom = "Hispano-Suiza"
vie = "Barcelone, fondée en 1904, et Bois-Colombes (France) ; Marc Birkigt, 1878–1953"
biographie = """
La Hispano-Suiza, « l'hispano-suisse », est fondée à Barcelone en 1904 par l'homme \
d'affaires Damián Mateu et l'ingénieur suisse Marc Birkigt, né à Genève. Le roi \
Alphonse XIII d'Espagne, grand amateur, donne son nom à un modèle de sport de 1911. \
La marque ouvre ensuite une usine en France, à Levallois puis à Bois-Colombes. \
Pendant la Première Guerre mondiale, le moteur d'avion V8 de Birkigt équipe des \
milliers de chasseurs alliés, dont les SPAD de Georges Guynemer. Après la guerre, la \
branche française produit des voitures de très grand luxe, la H6 puis la J12 à douze \
cylindres, célèbres pour leur mécanique et leurs carrosseries. Dans les années 1930, \
l'entreprise abandonne l'automobile pour se consacrer aux moteurs d'avion."""

[[artistes]]
nom = "Ettore Bugatti"
vie = "Milan, 15 septembre 1881 – Paris, 21 août 1947"
biographie = """
Fils de Carlo Bugatti, créateur de meubles et d'objets d'art milanais, et frère du \
sculpteur animalier Rembrandt Bugatti, Ettore Bugatti grandit dans un milieu \
d'artistes. Il dessine très jeune des tricycles et des voitures pour plusieurs \
constructeurs, puis fonde en 1909 sa propre marque à Molsheim, en Alsace, alors \
allemande. Ses voitures, légères, puissantes et d'une finition parfaite, gagnent des \
centaines de courses, comme la Type 35, l'une des voitures de course les plus \
victorieuses de l'histoire. Il conçoit aussi des voitures de grand luxe, dont la \
Royale, des autorails et des moteurs d'avion. Son fils Jean dessine dans les années \
1930 les plus belles carrosseries de la marque, avant de se tuer en essayant une \
voiture en 1939."""

[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi, 24 novembre 1864 – château de Malromé (Gironde), 9 septembre 1901"
biographie = """
Issu d'une vieille famille aristocratique du Midi, Henri de Toulouse-Lautrec se \
fracture les deux jambes à l'adolescence ; elles cessent de grandir. Il se consacre \
alors au dessin et à la peinture, étudie à Paris dans les ateliers de Bonnat et de \
Cormon, et s'installe à Montmartre. Il devient le peintre des cabarets, des bals, des \
cirques et des maisons closes, et se lie avec les artistes de la scène, Aristide \
Bruant, Jane Avril ou Yvette Guilbert. À partir de 1891, avec l'affiche du Moulin \
Rouge, il renouvelle l'art de l'affiche et de la lithographie en couleurs, influencé \
par les estampes japonaises. Épuisé par l'alcool, il meurt à 36 ans, laissant plus \
de 700 tableaux, des milliers de dessins et quelque 350 estampes et affiches."""

[[artistes]]
nom = "O'Galop (Marius Rossillon)"
vie = "Lyon, 1867 – Carnac, 1946"
biographie = """
Marius Rossillon, qui signe O'Galop, est un dessinateur humoristique et un \
illustrateur français. Il collabore à de nombreux journaux satiriques et illustrés de \
la fin du XIXᵉ et du début du XXᵉ siècle, et dessine des livres pour enfants, des \
cartes postales et des affiches. En 1898, il crée pour les frères Michelin le \
personnage de Bibendum, l'homme fait de pneus, qui restera associé à la marque et à \
ses guides. Il continue à le dessiner pendant des années pour les publicités de \
Michelin. Curieux des techniques nouvelles, il réalise aussi dans les années 1910 et \
1920 des films d'animation, notamment des dessins animés éducatifs et de prévention \
sanitaire, ce qui fait de lui l'un des pionniers français du cinéma d'animation."""
