[exposition]
ordre = 68
nom_court = "Mode et costume"
mouvement = "Mode et costume, du XVIIIᵉ siècle aux années folles"
cadre = "vitrine"
couleur = "#7a3b55"
titre = "Mode et costume, deux siècles d'élégance"
artiste = "Worth, Doucet, Poiret, Fortuny, Lanvin…"
dates = "1765–1924"
accroche = "Exposition virtuelle · Palais Galliera, Paris"
introduction = """
Une robe raconte son époque : la cour de Louis XV dans les paniers d'une robe à la \
française, le rêve d'Antiquité dans la mousseline Empire, l'âge industriel dans les \
cerceaux d'acier des crinolines. La visite suit dix vêtements, de 1765 aux années \
folles, quand Paris invente avec Worth, Doucet, Poiret et Lanvin le métier de grand \
couturier, et s'ouvre aux kimonos du Japon comme aux étoffes d'Afrique. La plupart \
viennent du Costume Institute du Metropolitan Museum de New York ; la robe Delphos de \
Fortuny appartient au Palais Galliera. Le bâtiment s'inspire de ce palais parisien \
devenu musée de la Mode : un vestibule, une grande galerie et trois salles aux \
vitrines tamisées."""
vitrine = "robe-a-la-francaise.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Palais Galliera, musée de la Mode de Paris"
ville = "Paris, France"
architecte = "Léon Ginain"
construction = "1878–1894"
presentation = """
Le palais est né de la volonté d'une grande collectionneuse génoise, Maria \
Brignole-Sale, duchesse de Galliera. En 1878, elle fait élever par l'architecte Léon \
Ginain, sur la colline de Chaillot, un palais destiné à montrer ses tableaux et ses \
objets d'art, qu'elle pense offrir à la Ville de Paris. Elle change d'avis et ses \
collections partent finalement pour Gênes, sa ville natale : seul le bâtiment, achevé \
en 1894, revient à Paris. De style Renaissance italienne, en pierre claire, il s'ouvre \
sur un jardin par une façade à arcades ornée de statues. Après avoir accueilli des \
expositions, il devient en 1977 le musée de la Mode et du Costume de la Ville de \
Paris. Ses collections, parmi les plus riches du monde, vont du XVIIIᵉ siècle à nos \
jours. Comme la lumière abîme les textiles, rien n'y est exposé en permanence : le \
musée présente ses robes par expositions successives, dans des salles à la lumière \
tamisée. En 2020, de nouvelles galeries aménagées dans les caves voûtées ont agrandi \
le parcours."""
ici = """
Le bâtiment d'ARTEON retient du Palais Galliera sa pierre claire et ses vitrines. On \
entre par le sud dans « Le vestibule », haut de sept mètres, aux murs de pierre. Il \
ouvre sur « La grande galerie », longue de trente-quatre mètres et haute de dix, aux \
murs rose poudré, où quatre robes vont de 1765 à 1872. À l'ouest, la salle « La Belle \
Époque des couturiers » réunit Doucet et Poiret ; au nord, « Les années folles » \
confronte la Delphos de Fortuny et la robe de style de Lanvin ; à l'est, « Costumes \
du monde » présente un kimono japonais et un kente asante."""

