# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Couturières anonymes"
vie = "Europe et Amérique du Nord, XVIIIᵉ–XIXᵉ siècle"
biographie = """
Avant l'invention de la haute couture, les robes des femmes élégantes ne portaient \
pas de nom d'auteur. À Paris, Louis XIV accorde en 1675 aux couturières le droit de \
former leur propre corporation et d'habiller les femmes, ce que faisaient jusque-là \
les tailleurs, qui gardent la fabrication des corps baleinés. Une robe naît alors de \
la collaboration de plusieurs métiers : le marchand vend la soie, la couturière coupe \
et assemble, la marchande de modes ajoute rubans, dentelles, fleurs et galons. \
Quelques noms ont traversé le temps, comme Rose Bertin, marchande de modes de \
Marie-Antoinette, ou Louis-Hippolyte Leroy, qui habille Joséphine pour le sacre de \
1804. Mais l'immense majorité des robes conservées dans les musées sont anonymes. Au \
XIXᵉ siècle, les couturières travaillent en atelier ou chez elles, d'après les \
gravures des journaux de mode, et la machine à coudre, répandue à partir du milieu du \
siècle, accélère leur travail. En Amérique, elles adaptent les modèles venus de \
Paris. Leurs noms se sont presque tous perdus ; leurs robes, transmises dans les \
familles puis données aux musées, restent leur seule signature."""
style = """
Leur art est celui de l'étoffe plus que de la coupe : la soie est si chère qu'on la \
découpe le moins possible et qu'on la remonte au gré des modes. Le savoir-faire se \
transmet d'atelier en atelier : ajuster un corsage, monter une jupe sur des paniers \
ou une crinoline, poser une garniture. La silhouette change selon des règles \
collectives, fixées par la cour puis par les journaux, et non par un créateur unique. \
C'est ce monde que Worth bouleversera en signant ses modèles."""

[[artistes]]
nom = "Charles Frederick Worth"
vie = "Bourne (Angleterre), 13 octobre 1825 – Paris, 10 mars 1895"
biographie = """
Né dans le Lincolnshire, Charles Frederick Worth connaît une enfance difficile après \
la ruine de son père. Adolescent, il part pour Londres comme apprenti chez des \
marchands de tissus, dont Swan & Edgar, et apprend à connaître les soieries et la \
clientèle élégante. Vers 1846, il s'installe à Paris, sans parler français, et entre \
chez Gagelin, maison réputée pour ses soieries et ses châles. Il y rencontre Marie \
Vernet, vendeuse, qu'il épouse et pour qui il dessine des robes que les clientes \
réclament bientôt. En 1858, il ouvre avec le Suédois Otto Bobergh sa propre maison au \
7, rue de la Paix. La princesse Pauline de Metternich, épouse de l'ambassadeur \
d'Autriche, porte ses robes aux Tuileries et le fait connaître de l'impératrice \
Eugénie, qui devient sa cliente. Worth habille dès lors la cour, les actrices et les \
riches Américaines. Il survit à la chute de l'Empire et reste, jusqu'à sa mort en \
1895, le couturier le plus célèbre du monde. Ses fils Gaston et Jean-Philippe \
reprennent la maison, qui restera active jusqu'au milieu du XXᵉ siècle."""
style = """
Worth invente le couturier créateur : au lieu d'exécuter les idées de ses clientes, \
il leur propose chaque saison des modèles qu'il a conçus, présentés sur des femmes \
vivantes, et signe ses robes d'une étiquette à son nom. Il aime les soieries \
somptueuses, souvent lyonnaises, les coupes impeccables et les silhouettes qu'il fait \
évoluer, de la crinoline à la tournure. Sa méthode, mi-artiste mi-industrielle, fonde \
la haute couture parisienne."""

[[artistes]]
nom = "Jacques Doucet"
vie = "Paris, 19 février 1853 – Neuilly-sur-Seine, 30 octobre 1929"
biographie = """
Jacques Doucet naît dans une famille de commerçants parisiens : la maison Doucet, \
rue de la Paix, vend de la lingerie fine, des dentelles et des chemises. Il y ajoute \
dans les années 1870 un département de couture pour dames, qui devient l'une des \
maisons les plus élégantes de Paris. Les femmes du monde et les grandes actrices, \
Réjane ou Sarah Bernhardt, s'y habillent. Doucet sait reconnaître les talents : Paul \
Poiret fait ses débuts chez lui, et Madeleine Vionnet y travaille avant d'ouvrir sa \
maison. Homme de goût, il réunit une collection célèbre de peintures, de dessins et \
de meubles du XVIIIᵉ siècle, qu'il vend aux enchères en 1912 pour se tourner vers \
l'art de son temps. Conseillé par des écrivains comme André Breton, il achète \
Picasso, Matisse, Modigliani, et La Charmeuse de serpents du Douanier Rousseau, qu'il \
lègue au Louvre. Il fonde aussi une grande bibliothèque d'art et d'archéologie, qu'il \
donne à l'Université de Paris, et une bibliothèque littéraire. Il meurt en 1929 \
à Neuilly, où il avait fait aménager un studio décoré par les créateurs Art déco."""
style = """
Doucet est le couturier de la grâce et de la légèreté : tons pastel, tulles, \
mousselines, dentelles anciennes et fleurs de soie, dans un goût nourri du XVIIIᵉ \
siècle. Ses robes, souples et vaporeuses, flattent le corps cambré de la Belle Époque \
sans paraître lourdes. Il apporte à la couture l'œil d'un collectionneur, attentif \
aux matières rares, et forme une génération de créateurs, dont Poiret et Vionnet, qui \
inventeront la mode du XXᵉ siècle."""

[[artistes]]
nom = "Paul Poiret"
vie = "Paris, 20 avril 1879 – Paris, 30 avril 1944"
biographie = """
Fils d'un marchand de drap parisien, Paul Poiret est placé jeune chez un fabricant de \
parapluies, mais il préfère dessiner des robes, qu'il vend à des maisons de couture. \
Jacques Doucet l'engage, puis il passe chez Worth avant d'ouvrir sa propre maison en \
1903. En quelques années, il impose une silhouette nouvelle, droite et haute de \
taille, qu'il fait connaître par des albums illustrés, confiés à Paul Iribe en 1908 \
puis à Georges Lepape en 1911. Installé avenue d'Antin, il donne des fêtes restées \
célèbres, lance les parfums Rosine et l'atelier Martine, collabore avec le peintre \
Raoul Dufy pour ses tissus et voyage en Europe et aux États-Unis pour présenter ses \
modèles. Pendant la Première Guerre mondiale, il est mobilisé et travaille à \
l'habillement de l'armée. Après 1918, la mode change, plus simple et plus sportive, et \
ses dépenses deviennent ruineuses. À l'Exposition des arts décoratifs de 1925, il \
présente ses créations sur trois péniches amarrées sur la Seine, mais sa maison ferme \
en 1929. Il meurt à Paris en 1944, oublié et pauvre."""
style = """
Poiret coupe droit, drape plutôt qu'il ne construit, et rêve d'un Orient de théâtre : \
turbans, tuniques, pantalons de harem, manteaux en kimono. Ses couleurs vives, \
violets, verts, orangés, rompent avec les pâleurs de la Belle Époque. Il est l'un des \
premiers à faire de la mode un art de vivre complet, du parfum au décor intérieur, et \
à collaborer avec des peintres et des illustrateurs. Son goût du spectacle annonce \
les grands couturiers du XXᵉ siècle."""

[[artistes]]
nom = "Mariano Fortuny"
vie = "Grenade, 11 mai 1871 – Venise, 2 mai 1949"
biographie = """
Mariano Fortuny y Madrazo est le fils du peintre catalan Marià Fortuny, mort quand il \
a trois ans, et de Cecilia de Madrazo, issue d'une grande famille d'artistes \
madrilènes. Élevé à Paris, puis installé à Venise avec sa mère en 1889, il grandit au \
milieu des étoffes anciennes que celle-ci collectionne. D'abord peintre, il se \
passionne pour le théâtre et l'opéra de Wagner, et invente des systèmes d'éclairage \
de scène, dont un dôme qui diffuse une lumière indirecte, brevetés au début du XXᵉ \
siècle. Avec sa compagne, Henriette Negrin, qu'il épousera en 1924, il se tourne vers \
le textile : l'écharpe Knossos, inspirée des fresques crétoises, puis la robe Delphos, \
vers 1907. Dans le palais Pesaro degli Orfei, où il vit et travaille, il teint, \
plisse et imprime velours et soies selon des procédés de son invention, puis ouvre \
une manufacture de tissus imprimés sur l'île de la Giudecca. Ses robes se vendent à \
Paris, Londres et New York. Il meurt à Venise en 1949 ; son palais est devenu le musée \
Fortuny."""
style = """
Fortuny est un inventeur autant qu'un couturier. Il ne suit pas la mode : il crée des \
modèles intemporels, inspirés de l'Antiquité grecque, de la Renaissance vénitienne et \
de l'Orient, qu'il produit presque inchangés pendant des décennies. Ses soies plissées \
et ses velours imprimés d'or jouent avec la lumière comme ses éclairages de théâtre. \
Sa liberté de coupe, qui laisse le corps libre, a inspiré bien des créateurs, de \
Madame Grès à Issey Miyake."""

[[artistes]]
nom = "Jeanne Lanvin"
vie = "Paris, 1ᵉʳ janvier 1867 – Paris, 6 juillet 1946"
biographie = """
Aînée d'une famille nombreuse et modeste, Jeanne Lanvin travaille dès l'adolescence \
chez des modistes et des couturières. En 1889, elle ouvre sa propre boutique de \
chapeaux rue du Faubourg-Saint-Honoré. Après la naissance de sa fille Marguerite, en \
1897, elle lui coud des robes si charmantes que ses clientes en demandent pour leurs \
propres enfants : elle ouvre un rayon pour les petites filles, puis pour les jeunes \
filles et les femmes. En 1909, elle entre à la chambre syndicale de la couture \
parisienne. Dans les années 1920, sa maison devient l'une des plus importantes de \
Paris : elle lance la robe de style, des collections pour la maison avec le décorateur \
Armand-Albert Rateau, une ligne pour hommes et des parfums, dont Arpège en 1927. Elle \
possède ses propres ateliers de teinture et de broderie. Elle reste à la tête de sa \
maison jusqu'à sa mort, en 1946 ; sa fille, devenue comtesse Jean de Polignac, lui \
succède. Fondée en 1889, la maison Lanvin est aujourd'hui la plus ancienne maison de \
couture française encore en activité."""
style = """
Lanvin cultive une élégance romantique et douce, à l'écart de la sévérité de la \
garçonne. Ses robes de style, ses broderies minutieuses et ses couleurs signature, \
comme un bleu profond qu'on dit inspiré des fresques de Fra Angelico, font sa \
réputation. Elle puise dans la peinture ancienne, les costumes historiques et les \
arts d'Orient, mais traduit ces souvenirs en lignes simples et modernes, pour \
habiller ensemble mères et filles."""

[[artistes]]
nom = "Japon, XIXᵉ siècle"
vie = "Japon, fin de l'époque d'Edo (1603–1868) et début de l'ère Meiji (1868–1912)"
biographie = """
Le kimono descend du kosode, un vêtement à manches étroites porté d'abord comme \
sous-vêtement, qui devient au XVIᵉ siècle le vêtement de dessus des hommes comme des \
femmes. Sous les shoguns Tokugawa, pendant l'époque d'Edo, la paix et l'essor des \
villes enrichissent les marchands, qui rivalisent de luxe vestimentaire malgré les \
lois somptuaires destinées à le limiter. Kyoto en reste le grand centre : les \
tisserands du quartier de Nishijin y produisent soieries et brocarts, et la teinture \
yūzen, qui permet de peindre de véritables tableaux sur l'étoffe, s'y développe à la \
fin du XVIIᵉ siècle. Les teinturiers, brodeurs et tisserands, organisés en ateliers \
spécialisés, travaillent d'après des livres de modèles qui diffusent les motifs à la \
mode. Après 1868, l'ère Meiji ouvre le Japon à l'Occident ; les hommes de la cour et \
de l'administration adoptent peu à peu le costume européen, mais le kimono reste le \
vêtement des femmes et des grandes occasions. Exporté, collectionné, il fascine \
l'Europe du japonisme et inspire peintres et couturiers."""
style = """
Le kimono garde une coupe immuable : quelques bandes droites, taillées dans un \
même rouleau d'étoffe étroit, assemblées en forme de T. Toute l'invention passe \
donc dans le décor, conçu comme un tableau qui se déploie sur le corps. Saisons, poésie, \
symboles de bon augure guident le choix des motifs ; teinture, broderie et fils d'or \
se combinent avec virtuosité. Cette beauté à plat a profondément marqué la mode \
occidentale."""

[[artistes]]
nom = "Tisserands asante (Ghana)"
vie = "Royaume asante, actuel Ghana, XVIIIᵉ–XIXᵉ siècle"
biographie = """
Le royaume asante se forme vers 1700 autour de Kumasi, sous le roi Osei Tutu ; selon \
la tradition, un Tabouret d'or descendu du ciel scelle alors l'union des chefferies \
et incarne l'âme de la nation. Riche de l'or de ses mines et de son commerce, le \
royaume domine pendant deux siècles une grande partie de l'actuel Ghana. Le tissage y \
est une activité d'hommes, organisée en villages spécialisés autour de la capitale, \
dont Bonwire, placés sous la protection du roi. Les tisserands du roi créent pour lui \
des motifs nouveaux, dont certains lui sont réservés. Au XIXᵉ siècle, le royaume \
affronte les Britanniques installés sur la côte au cours de plusieurs guerres : \
Kumasi est incendiée en 1874, le roi Prempeh Iᵉʳ est exilé en 1896, et le pays est \
annexé à la colonie de la Côte-de-l'Or au début du XXᵉ siècle. Le kente survit à la \
colonisation et devient, après l'indépendance du Ghana en 1957, un symbole national. \
Des tisserands continuent aujourd'hui de travailler à Bonwire, sur les mêmes métiers \
étroits."""
style = """
Le kente est un art de la couleur et de la géométrie. Sur des bandes étroites, le \
tisserand fait alterner blocs pleins et petits motifs, puis les bandes, cousues en \
décalé, composent un damier vibrant. Chaque combinaison porte un nom et un sens, \
connus des initiés. Jaune, vert, rouge, bleu et noir se répondent avec une grande \
vivacité. Cet art de l'assemblage a inspiré de nombreux artistes et créateurs, en \
Afrique comme dans la diaspora."""
