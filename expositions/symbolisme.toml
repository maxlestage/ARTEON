# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « SYMBOLISME » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/symbolisme/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /symbolisme.
#
#  Toutes les œuvres sont dans le domaine public (artistes morts avant 1956,
#  œuvres antérieures à 1931) ; les images viennent de Wikimedia Commons.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 160
nom_court = "Symbolisme"
mouvement = "Symbolisme et Art nouveau"
couleur = "#5e3a6e"
titre = "Le Symbolisme, rêves, mythes et visions"
artiste = "Moreau, Redon, Munch, Böcklin, Rossetti, Millais, Mucha…"
dates = "1851–1914"
accroche = "Exposition virtuelle · Musée Gustave-Moreau, Paris, et Tate Britain, Londres"
introduction = """
Contre le réalisme et l'impressionnisme, les symbolistes veulent peindre ce que l'œil \
ne voit pas : le rêve, le mythe, l'angoisse, la mort et le désir. La visite suit ce \
courant des préraphaélites anglais du milieu du siècle jusqu'aux visions de Redon, en \
passant par le Cri de Munch, l'Île des morts de Böcklin et les arabesques Art nouveau \
de Mucha. Le bâtiment s'inspire de la maison-atelier de Gustave Moreau à Paris, dont \
le grand atelier très haut est couvert de tableaux du sol au plafond, et, pour la \
salle anglaise, des galeries de la Tate Britain à Londres."""
vitrine = "cri.jpg"

