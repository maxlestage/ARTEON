[[artistes]]
nom = "D'après Karl von Drais"
vie = "Karl von Drais, Karlsruhe 1785 – Karlsruhe 1851"
biographie = """
Karl Friedrich Christian Ludwig, baron von Drais, naît en 1785 à Karlsruhe, dans le \
pays de Bade. Il étudie les sciences forestières, l'architecture et la physique, \
et devient fonctionnaire forestier du grand-duc de Bade, une charge qui lui laisse \
le temps d'inventer. Il imagine une voiture à quatre roues mue par la force des \
bras, une machine à écrire à clavier et un appareil pour noter la musique jouée au \
piano. Sa grande invention reste la Laufmaschine, la « machine à courir » de 1817, \
qu'il présente à Mannheim puis à Paris en 1818 et qu'il fait breveter dans le pays \
de Bade. La machine est copiée partout, en France sous le nom de draisienne, en \
Angleterre sous celui de « hobby horse », mais son inventeur n'en tire ni fortune \
ni gloire. Ses opinions libérales et les malheurs de sa famille lui valent des \
ennuis ; pendant la révolution badoise de 1848–1849, il renonce à son titre de \
baron. Il meurt pauvre à Karlsruhe en 1851. Les draisiennes conservées ont été \
fabriquées par divers charrons d'après son modèle."""
style = """
Une machine de charron : poutre et roues de bois, ferrures, selle de cuir. Son \
génie tient à une seule idée, l'équilibre sur deux roues alignées, et à un seul \
organe vraiment nouveau, la roue avant qui pivote pour diriger la machine."""

[[artistes]]
nom = "Michaux et Cie, puis Compagnie parisienne"
vie = "Paris, années 1860 – 1870"
biographie = """
Pierre Michaux (1813–1883) est un serrurier et carrossier installé à Paris, dans le \
quartier des Champs-Élysées. Selon la tradition, c'est dans son atelier, vers \
1861, que l'on fixe pour la première fois des manivelles et des pédales sur la \
roue avant d'une draisienne, peut-être à l'initiative de son fils Ernest. \
L'attribution de l'invention a été discutée, notamment au profit de l'ouvrier \
Pierre Lallement, qui fit breveter une machine semblable aux États-Unis en 1866. \
Michaux, associé à partir de 1868 aux frères Olivier, de riches industriels, \
transforme l'atelier en véritable fabrique et produit des centaines de \
vélocipèdes, vendus en France et à l'étranger. En 1869, les Olivier reprennent \
l'affaire sous le nom de Compagnie parisienne des vélocipèdes. La mode du \
vélocipède culmine alors, avec ses courses, ses manèges et ses journaux, avant que \
la guerre de 1870 ne vienne interrompre l'essor de cette première industrie du \
cycle en France."""
style = """
Des machines de forge et de serrurerie : cadre de fer, d'abord en fonte puis forgé, \
roues de bois cerclées de fer, pédales sur la roue avant, selle sur ressort à lame \
et frein à cordon. Les volutes et les filets peints disent le goût d'une époque \
qui voulait que les machines soient aussi des objets élégants."""

[[artistes]]
nom = "Fabricants de cycles anonymes"
vie = "Europe, fin du XIXᵉ siècle"
biographie = """
Des années 1870 à 1900, des centaines d'ateliers et d'usines fabriquent des \
grands-bis puis des bicyclettes en Angleterre, en France, en Allemagne et aux \
États-Unis. Coventry, en Angleterre, devient la capitale de cette industrie, avec \
les Starley, Hillman, Singer ou Rudge. En France, Paris compte de nombreux \
constructeurs, et Saint-Étienne, ville d'armuriers habitués au travail de \
précision du métal, se tourne à son tour vers le cycle à partir des années 1880 : \
la Manufacture française d'armes et cycles, future Manufrance, vend ses \
bicyclettes Hirondelle par catalogue dans tout le pays. Beaucoup de machines \
conservées dans les musées ne portent plus de plaque ni de marque lisible, ou \
viennent de petits fabricants dont l'histoire est mal connue. Elles témoignent \
pourtant de la variété des idées et des essais de ces années d'invention, avant \
que la bicyclette de sécurité, au cadre en losange et aux pneumatiques, ne \
devienne le modèle commun."""
style = """
Tubes d'acier creux, rayons tendus, roulements à billes, bandages de caoutchouc \
puis pneumatiques : les fabricants partagent les mêmes techniques, mais \
rivalisent d'inventions pour le cadre, la transmission, le confort ou la \
légèreté, comme le cadre en bois courbé de la Souplette."""

[[artistes]]
nom = "John Kemp Starley"
vie = "Walthamstow 1854 – Coventry 1901"
biographie = """
John Kemp Starley naît en 1854 près de Londres. Vers 1872, il rejoint à Coventry \
son oncle James Starley, inventeur prolifique que l'on surnomme le père de \
l'industrie du cycle, et travaille avec lui à des grands-bis et des tricycles. En \
1877, il s'associe à William Sutton, un passionné de cyclisme, pour fonder sa \
propre entreprise, Starley & Sutton. Il y conçoit en 1885 le Rover, une \
bicyclette de sécurité à transmission par chaîne vers la roue arrière, dont les \
modèles successifs fixent la forme de la bicyclette moderne. Le succès est tel que \
l'entreprise prend le nom de J. K. Starley & Co., puis devient la Rover Cycle \
Company. John Kemp Starley meurt en 1901, à quarante-six ans. Après sa mort, \
l'entreprise se lance dans la motocyclette puis l'automobile, et le nom de Rover \
reste longtemps celui d'une marque de voitures britanniques. En polonais, le mot \
« rower », qui désigne la bicyclette, vient du nom de sa machine."""
style = """
Un ingénieur pragmatique plus qu'un inventeur de génie : il réunit des solutions \
déjà connues, la chaîne, les roues égales, les tubes d'acier, et les ajuste \
jusqu'à obtenir une machine sûre, rapide et facile à produire."""

[[artistes]]
nom = "Étienne-Jules Marey"
vie = "Beaune 1830 – Paris 1904"
biographie = """
Étienne-Jules Marey naît à Beaune en 1830. Médecin et physiologiste, il consacre sa \
vie à l'étude du mouvement : celui du sang, du cœur, des muscles, de la marche et \
du vol. Il invente d'abord des appareils qui enregistrent ces mouvements sous \
forme de courbes, comme le sphygmographe, qui trace le pouls. Professeur au \
Collège de France à partir de 1869, il découvre vers 1878 les photographies de \
chevaux au galop d'Eadweard Muybridge et se tourne vers la photographie. En 1882, \
il invente un fusil photographique qui prend douze images par seconde, puis met \
au point la chronophotographie sur plaque fixe et sur pellicule, à la Station \
physiologique qu'il fonde près du bois de Boulogne. Coureurs, sauteurs, soldats, \
cyclistes, chevaux et oiseaux défilent devant ses objectifs. Ses travaux préparent \
l'invention du cinéma et inspirent les peintres du mouvement. Il meurt à Paris en \
1904."""
style = """
Des images de savant, faites pour mesurer : fond noir, modèles vêtus de blanc ou \
marqués de bandes claires, images successives prises à intervalles réguliers sur \
une même plaque. Leur beauté naît de cette rigueur."""

[[artistes]]
nom = "Jean Béraud"
vie = "Saint-Pétersbourg 1849 – Paris 1935"
biographie = """
Jean Béraud naît en 1849 à Saint-Pétersbourg, où son père, sculpteur, travaille \
sur le chantier d'une cathédrale. Sa famille s'installe ensuite à Paris. Il \
commence des études de droit, interrompues par la guerre de 1870, puis entre dans \
l'atelier du portraitiste Léon Bonnat. À partir des années 1870, il expose au \
Salon des scènes de la vie parisienne qui font sa réputation : boulevards animés, \
terrasses de cafés, sorties de théâtre, bals, églises, coulisses de l'Opéra, \
promenades du bois de Boulogne. Il peint avec la même attention les élégantes, \
les ouvrières, les cochers et les camelots, et devient le chroniqueur le plus \
fidèle du Paris de la fin du XIXᵉ siècle et de la Belle Époque. Membre fondateur \
de la Société nationale des beaux-arts en 1890, il est aussi connu pour quelques \
grands tableaux religieux transposés dans le Paris de son temps. Il meurt à Paris \
en 1935."""
style = """
Une peinture précise et vivante, qui compose de petites comédies urbaines avec \
une foule de personnages croqués sur le vif. Béraud observe les costumes, les \
attitudes et les objets nouveaux, comme la bicyclette, avec un œil de \
chroniqueur."""

[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi 1864 – Saint-André-du-Bois 1901"
biographie = """
Henri de Toulouse-Lautrec naît en 1864 à Albi, dans une vieille famille \
aristocratique. Fragile, il se brise les deux jambes à l'adolescence, qui cessent \
de grandir. Il se consacre à la peinture, étudie à Paris dans les ateliers de \
Bonnat et de Cormon, et s'installe à Montmartre. Il y peint les bals, les cafés \
concerts, les cirques et les maisons closes, et fait le portrait de ses amis et \
des vedettes de son temps, Aristide Bruant, Jane Avril ou Yvette Guilbert. À \
partir de 1891, avec l'affiche du Moulin-Rouge, il renouvelle l'art de l'affiche \
et de la lithographie en couleurs. Passionné de sport, il fréquente les \
vélodromes avec son ami Tristan Bernard et dessine les champions cyclistes. \
Épuisé par l'alcool, il est soigné dans une clinique en 1899, puis meurt en 1901 \
au château de Malromé, près de Bordeaux, à trente-six ans. Sa mère offre une \
grande partie de son œuvre à la ville d'Albi."""
style = """
Un dessin nerveux qui saisit l'attitude et le caractère en quelques traits, de \
grands aplats de couleur venus des estampes japonaises, des cadrages audacieux \
qui coupent les figures, et le crachis projeté à la brosse sur la pierre."""

[[artistes]]
nom = "Alfons Mucha"
vie = "Ivančice 1860 – Prague 1939"
biographie = """
Alfons Mucha naît en 1860 à Ivančice, en Moravie. Après des débuts comme peintre \
de décors de théâtre à Vienne, il étudie à Munich puis s'installe à Paris en \
1887, où il vit d'illustrations. À la fin de 1894, il dessine en urgence \
l'affiche de Gismonda pour Sarah Bernhardt : son succès est immédiat, et \
l'actrice lui confie ses affiches pendant six ans. Sous contrat avec l'imprimeur \
F. Champenois, il dessine des affiches publicitaires pour des biscuits, du \
champagne, du papier à cigarettes ou des bicyclettes, des calendriers et des \
panneaux décoratifs, ainsi que des bijoux pour Georges Fouquet. Son style devient \
l'un des symboles de l'Art nouveau. De retour en Bohême, il se consacre à partir \
de 1910 à l'Épopée slave, vingt immenses toiles sur l'histoire des peuples \
slaves, et dessine les premiers timbres et billets de la Tchécoslovaquie. Arrêté \
par la Gestapo en 1939, il meurt à Prague peu après."""
style = """
Des jeunes femmes aux chevelures ondoyantes, des contours noirs appuyés, des \
couleurs douces en aplats, des volutes et des cercles décoratifs : le « style \
Mucha » fait de chaque affiche un objet d'art."""
