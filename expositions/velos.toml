#  EXPOSITION « VÉLOS » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/velos/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /velos.
#
#  Les machines sont photographiées dans les musées qui les conservent : ces
#  photographies sont versées dans le domaine public (CC0) par leurs auteurs, ou
#  publiées sous licence CC BY-SA, dont l'auteur est crédité dans le bloc de
#  l'œuvre. Les affiches, la peinture et les photographies anciennes sont dans
#  le domaine public.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 168
nom_court = "Vélos"
mouvement = "La bicyclette, de la draisienne à la Belle Époque"
cadre = "vitrine"
couleur = "#2e6b7a"
titre = "La petite reine, un siècle de bicyclette"
artiste = "Drais, Michaux, Starley, Marey, Béraud, Toulouse-Lautrec, Mucha…"
dates = "vers 1820 – 1902"
accroche = "Exposition virtuelle · Musée d'Art et d'Industrie, Saint-Étienne"
introduction = """
En 1817, un baron badois enfourche une machine de bois à deux roues et la pousse \
avec ses pieds : c'est la draisienne. Un demi-siècle plus tard, des pédales fixées \
sur la roue avant font naître le vélocipède, puis la roue grandit jusqu'à dépasser \
la hauteur d'un homme : voici le grand-bi. Dans les années 1880, la chaîne et deux \
roues presque égales donnent enfin la bicyclette de sécurité, qui conquiert les \
villes, les femmes et les champs de course. La visite suit dix étapes de cette \
histoire, des machines elles-mêmes aux images qu'elles ont inspirées : la \
chronophotographie de Marey, le bois de Boulogne de Jean Béraud, les affiches de \
Toulouse-Lautrec et de Mucha. Le bâtiment s'inspire du musée d'Art et d'Industrie \
de Saint-Étienne, la ville du cycle, dont les machines anciennes reposent sous des \
voûtes de brique et de pierre."""
vitrine = "chaine-simpson.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Musée d'Art et d'Industrie"
ville = "Saint-Étienne, France"
architecte = "Étienne Boisson (palais des Arts)"
construction = "à partir de 1846"
presentation = """
En 1833, la municipalité de Saint-Étienne crée un fonds destiné à un futur musée, \
sans encore lui donner de murs. À partir de 1846, l'architecte Étienne Boisson \
élève un bâtiment prévu pour la sous-préfecture ; il devient le palais des Arts, \
qui abrite le musée et la bibliothèque municipale. En 1851, la ville achète une \
grande partie de la collection d'armes du maréchal Oudinot. En 1889 naît le musée \
d'Art et d'Industrie, qui réunit les beaux-arts et les arts industriels ; Marius \
Vachon en est le premier conservateur. Le musée présente aujourd'hui les trois \
industries qui ont fait la ville : les armes, les rubans et les cycles. Selon le \
musée, la première bicyclette française a été fabriquée à Saint-Étienne en 1886. \
Sa collection de cycles s'est surtout formée après la Seconde Guerre mondiale, \
grâce aux dons de la chambre syndicale du cycle de Saint-Étienne et de la \
Manufacture française d'armes et cycles, la future Manufrance, et aux achats du \
conservateur Maurice Allemand, qui rêvait d'un musée national du cycle."""
ici = """
Le bâtiment d'ARTEON retient du musée stéphanois ses salles basses aux murs de \
pierre blonde et de brique, où les machines anciennes s'alignent comme dans un \
atelier. On entre par le sud dans la salle des pionniers, couleur de pierre, où \
attendent la draisienne et le vélocipède. Suivent, d'ouest en est, la salle du \
vélocipède et du grand-bi, plus haute pour ses roues géantes, puis celle de la bicyclette de \
sécurité, aux murs de brique claire. La salle de la course et de la Belle Époque, \
plus vaste, réunit la science et la peinture ; la visite s'achève dans le cabinet \
des affiches, comme sur une palissade parisienne de 1900."""

