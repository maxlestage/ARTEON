[exposition]
ordre = 35
nom_court = "Venise"
mouvement = "Venise, de Bellini à Tiepolo"
cadre = "dore"
couleur = "#1f5c66"
titre = "Venise, la couleur et la lumière, de Bellini à Tiepolo"
artiste = "Bellini, Carpaccio, Véronèse, Tintoret, Tiepolo…"
dates = "1475–1780"
accroche = "Exposition virtuelle · Gallerie dell'Accademia, Venise"
introduction = """
Pendant trois siècles, Venise invente une peinture de la couleur et de la lumière : la \
peinture à l'huile qu'apporte Antonello de Messine, les retables lumineux de Giovanni \
Bellini, les récits de Carpaccio, puis les festins de Véronèse et les tempêtes de \
Tintoret, jusqu'au dernier éclat du XVIIIᵉ siècle, des fêtes de Tiepolo aux vues de \
Guardi et de Bellotto. La visite réunit onze peintres en onze œuvres. Le bâtiment \
s'inspire des Gallerie dell'Accademia, installées dans l'ancienne Scuola della \
Carità : on passe du portail à la salle du chapitre aux murs dorés, puis à la longue \
salle des banquets et aux salons du Settecento."""
vitrine = "reve-sainte-ursule.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Gallerie dell'Accademia"
ville = "Venise, Italie"
architecte = "Andrea Palladio (le couvent) ; Giannantonio Selva (le musée)"
construction = "XIVᵉ–XVIᵉ siècles ; musée ouvert en 1817"
presentation = """
Les Gallerie dell'Accademia occupent, au bord du Grand Canal, l'ensemble de Santa \
Maria della Carità : l'église, rebâtie au XVᵉ siècle, le couvent des chanoines du \
Latran, commencé par Andrea Palladio en 1561 et jamais achevé, et la Scuola della \
Carità, la plus ancienne des six Scuole Grandi, les grandes confréries laïques de \
Venise. En 1807, sous la domination napoléonienne, l'Académie des beaux-arts, fondée \
en 1750, s'y installe ; l'architecte Giannantonio Selva divise l'église en salles et \
mure ses fenêtres gothiques. Les collections, enrichies des tableaux des églises et \
des couvents supprimés, ouvrent au public en 1817. On entre par la façade classique de \
la Scuola, refaite vers 1760 par Giorgio Massari et Bernardino Maccaruzzi. La première \
salle, l'ancienne salle du chapitre, garde son plafond à caissons de bois doré du XVᵉ \
siècle, et la salle de l'Albergo conserve la Présentation de Marie au Temple, que \
Titien a peinte pour ce mur même. Le musée réunit le plus bel ensemble de peinture \
vénitienne au monde."""
ici = """
Le bâtiment d'ARTEON en reprend l'enchaînement. On entre par le sud dans « Le portail \
de la Carità », un vestibule de pierre claire. Au nord s'ouvre « La salle du \
chapitre », large de dix-huit mètres et haute de neuf, aux murs ocre doré : les \
maîtres du Quattrocento et Lotto. À l'est, « La salle des banquets », longue de \
trente-deux mètres et haute de douze, évoque les nefs de l'ancienne église où pendent \
les toiles géantes : Véronèse, Tintoret, Tiepolo. À l'ouest, « Les salons du \
Settecento », plus bas, aux murs vert d'eau, réunissent le XVIIIᵉ siècle."""

