# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Antonello de Messine"
vie = "Messine (Sicile), vers 1430 – Messine, février 1479"
biographie = """
Antonello naît à Messine, en Sicile, dans une famille d'artisans. Il se forme à \
Naples, auprès du peintre Colantonio, dans une ville où la cour aragonaise \
collectionne la peinture flamande : il y découvre les tableaux de Jan van Eyck et de \
ses successeurs, et leur technique de la peinture à l'huile. Vasari racontera plus \
tard qu'il était allé l'apprendre en Flandre, une légende que rien ne confirme. \
Antonello travaille ensuite surtout en Sicile et en Calabre, où il peint retables et \
portraits. En 1475-1476, il séjourne à Venise. Il y peint le retable de l'église San \
Cassiano, dont il ne reste que des fragments, aujourd'hui à Vienne, et des portraits \
qui frappent les Vénitiens par leur présence, comme le Condottiere du Louvre. Le duc \
de Milan, Galeazzo Maria Sforza, cherche alors à l'attirer à sa cour. Antonello rentre \
pourtant à Messine, où il meurt au début de 1479 ; son fils Jacobello reprend \
l'atelier."""
style = """
Antonello unit la minutie et la lumière des Flamands à la géométrie et à l'ampleur des \
Italiens. Ses portraits, en buste, de trois quarts sur fond noir, regardent le \
spectateur avec une intensité nouvelle. Son séjour à Venise a joué un rôle décisif : \
Giovanni Bellini et ses contemporains y ont adopté la peinture à l'huile et le grand \
retable d'un seul tenant."""

[[artistes]]
nom = "Giovanni Bellini"
vie = "Venise, vers 1430-1435 – Venise, 29 novembre 1516"
biographie = """
Giovanni Bellini grandit dans l'atelier de son père, le peintre Jacopo Bellini, avec \
son frère Gentile. En 1453, sa sœur Nicolosia épouse Andrea Mantegna, dont le dessin \
sculptural marque ses premières œuvres. Peu à peu, Bellini s'en éloigne et cherche une \
lumière plus douce, qui baigne les figures et les paysages ; la venue d'Antonello de \
Messine à Venise, en 1475, l'encourage à adopter la peinture à l'huile. Il devient le \
peintre officiel de la République : il travaille aux grandes toiles du palais des \
Doges, détruites par l'incendie de 1577, et peint le portrait du doge Leonardo \
Loredan. Son atelier, très actif, forme une génération entière, à laquelle on rattache \
Giorgione et Titien. En 1506, Albrecht Dürer, de passage à Venise, écrit qu'il est \
très vieux, mais toujours le meilleur peintre de la ville. Jusqu'à la fin de sa longue \
vie, Bellini se renouvelle, avec le Festin des dieux et la Jeune femme au miroir."""
style = """
Bellini est le fondateur de la peinture vénitienne : il fait de la couleur et de la \
lumière, plus que du dessin, l'âme du tableau. Ses Vierges à l'Enfant, d'une tendresse \
grave, ses saints placés dans des paysages baignés de soleil et ses grandes saintes \
conversations ont fixé pour un siècle le modèle du retable vénitien."""

[[artistes]]
nom = "Vittore Carpaccio"
vie = "Venise, vers 1465 – Venise ou Capodistria, vers 1525-1526"
biographie = """
On sait peu de chose de la jeunesse de Vittore Carpaccio, né dans une famille de \
marchands vénitiens. Sa formation reste obscure, mais son art doit beaucoup à Gentile \
Bellini, le peintre des grandes cérémonies de la ville. Carpaccio s'impose comme le \
peintre des scuole, les confréries de Venise, qui commandent pour leurs salles de \
grands cycles narratifs. Pour la Scuola di Sant'Orsola, il peint de 1490 à 1495 \
environ les Histoires de sainte Ursule. Pour la Scuola di San Giovanni Evangelista, il \
représente un miracle de la relique de la Croix près du pont du Rialto, alors en bois. \
De 1502 à 1507, il décore la Scuola di San Giorgio degli Schiavoni, la confrérie des \
Dalmates, avec saint Georges terrassant le dragon et saint Augustin dans son cabinet, \
toujours en place. Lorsque le goût vénitien se tourne vers Giorgione et Titien, il \
travaille de plus en plus pour des clients de la terre ferme et d'Istrie. Son fils \
Benedetto, peintre lui aussi, s'installe à Capodistria."""
style = """
Carpaccio est un conteur. Il installe les légendes saintes dans la Venise de son \
temps, avec ses palais, ses canaux, ses costumes et ses objets familiers, décrits avec \
une précision d'inventaire. Sa lumière claire et égale, ses compositions ordonnées \
comme des scènes de théâtre, ont été redécouvertes au XIXᵉ siècle par John Ruskin."""

[[artistes]]
nom = "Lorenzo Lotto"
vie = "Venise, vers 1480 – Lorette, 1556 ou 1557"
biographie = """
Né à Venise, Lorenzo Lotto fait l'essentiel de sa carrière loin de sa ville. Il \
travaille d'abord à Trévise, où il peint le portrait de l'évêque Bernardo de' Rossi, \
puis dans les Marches, à Recanati. En 1509, il est payé pour des travaux au palais du \
Vatican, à Rome, au moment où Raphaël y commence ses fresques. De 1513 à 1525, il vit \
à Bergame, où il peint ses plus grands retables et les fresques de la chapelle Suardi, \
à Trescore. Revenu à Venise, il y reste quelques années, mais la ville est dominée par \
Titien, dont il ne partage ni le style ni le succès. Il repart, d'une commande à \
l'autre, entre Venise, Trévise et les Marches. À partir de 1538, il note ses travaux \
et ses dettes dans un livre de comptes. Âgé et pauvre, il se retire en 1554 au \
sanctuaire de la Santa Casa de Lorette, comme oblat, et y meurt. Oublié, il a été \
redécouvert à la fin du XIXᵉ siècle par l'historien Bernard Berenson."""
style = """
Lotto est le peintre de l'inquiétude. Ses portraits scrutent la vie intérieure de ses \
modèles, entourés d'objets chargés de sens. Ses retables surprennent par leurs gestes \
vifs, leurs couleurs acides et leurs compositions inattendues. Indépendant de Titien, \
attentif à l'art du Nord et à Dürer, il occupe une place à part dans la peinture \
vénitienne."""

[[artistes]]
nom = "Le Tintoret"
vie = "Venise, 1518 ou 1519 – Venise, 31 mai 1594"
biographie = """
Jacopo Robusti, dit le Tintoret, est le fils d'un teinturier vénitien. Selon son \
biographe Carlo Ridolfi, il aurait fait un bref passage dans l'atelier de Titien, qui \
l'aurait renvoyé, et se serait formé surtout seul, en dessinant d'après les moulages \
des sculptures de Michel-Ange. Le Miracle de l'esclave, en 1548, le rend célèbre. Il \
épouse Faustina Episcopi, fille d'un dignitaire de la Scuola di San Marco. En 1564, la \
Scuola Grande di San Rocco organise un concours pour le plafond de sa salle de \
l'Albergo : au lieu d'une esquisse, Tintoret installe une toile achevée, qu'il offre à \
la confrérie. Il y peindra, jusqu'en 1587, plus de cinquante tableaux, l'un des plus \
grands ensembles jamais réalisés par un seul peintre. Après l'incendie du palais des \
Doges en 1577, il travaille à son nouveau décor, avec le Paradis, l'une des plus \
grandes toiles du monde. Il ne quitte presque jamais Venise et meurt en 1594 ; il est \
enterré à la Madonna dell'Orto. Sa fille Marietta et son fils Domenico ont été ses \
assistants."""
style = """
Tintoret cherche le mouvement et le drame : raccourcis audacieux, diagonales, lumière \
violente qui surgit de l'ombre, foules agitées. Il peint vite, d'une touche rapide qui \
scandalisait ses contemporains. Ridolfi raconte qu'il composait ses scènes avec de \
petites figurines de cire placées dans des boîtes éclairées. Le Greco et Rubens lui \
doivent beaucoup."""

[[artistes]]
nom = "Paolo Véronèse"
vie = "Vérone, 1528 – Venise, 19 avril 1588"
biographie = """
Paolo Caliari, dit Véronèse, est le fils d'un tailleur de pierre de Vérone. Il se \
forme auprès du peintre Antonio Badile, dont il épousera plus tard la fille. Installé \
à Venise vers 1553, il obtient aussitôt des commandes pour les plafonds du palais des \
Doges, puis décore l'église San Sebastiano, où il sera enterré. Vers 1560, il peint \
les fresques de la villa Barbaro à Maser, construite par Palladio : trompe-l'œil, \
paysages et personnages qui semblent entrer dans les salles. Ses grands repas, peints \
pour des réfectoires de couvents, font sa gloire. En 1573, le tribunal de \
l'Inquisition le convoque à propos d'une Cène jugée irrévérencieuse, peuplée de \
bouffons, de soldats allemands et de chiens ; plutôt que de modifier la toile, il en \
change le titre, qui devient Le Repas chez Lévi. Avec son frère Benedetto et ses fils \
Carletto et Gabriele, il dirige un atelier prospère, qui poursuit son œuvre après sa \
mort, en 1588."""
style = """
Véronèse est le peintre de la splendeur : architectures majestueuses, ciels clairs, \
foules élégantes vêtues de soies et de brocarts. Sa couleur, lumineuse et argentée, \
posée en grands accords, sans ombres lourdes, a fait de lui le modèle des décorateurs, \
de Tiepolo à Delacroix. Ses fêtes profanes, à peine religieuses, annoncent aussi le \
goût du spectacle qui sera celui de Venise au XVIIIᵉ siècle."""

[[artistes]]
nom = "Giambattista Tiepolo"
vie = "Venise, 5 mars 1696 – Madrid, 27 mars 1770"
biographie = """
Fils d'un marchand vénitien, Giambattista Tiepolo se forme auprès du peintre Gregorio \
Lazzarini. En 1719, il épouse Maria Cecilia Guardi, sœur des peintres Gian Antonio et \
Francesco Guardi. Dans les années 1720, ses fresques du palais de l'archevêque d'Udine \
font sa réputation ; il décore ensuite des palais de Milan, de Bergame et de Venise, \
comme le palais Labia avec l'histoire d'Antoine et Cléopâtre. De 1750 à 1753, il \
travaille à Würzburg, pour le prince-évêque, à la Résidence : il y peint la salle \
impériale et l'immense plafond de l'escalier, qui représente l'Olympe et les quatre \
continents. En 1756, il devient le premier président de l'Académie de peinture de \
Venise. En 1762, le roi Charles III l'appelle à Madrid pour décorer les plafonds de \
son nouveau palais royal. Il y travaille avec ses fils Giandomenico et Lorenzo, mais \
le goût change, et le peintre néoclassique Anton Raphael Mengs lui fait concurrence. \
Tiepolo meurt à Madrid en 1770."""
style = """
Tiepolo est le dernier grand décorateur de la tradition baroque. Il ouvre les plafonds \
sur des ciels immenses et lumineux, où des figures vues d'en bas flottent parmi les \
nuages. Sa palette claire, ses couleurs pâles et dorées, ses mises en scène théâtrales \
prolongent l'art de Véronèse. Avec lui s'achève la grande peinture d'histoire \
vénitienne, juste avant le triomphe du néoclassicisme."""

[[artistes]]
nom = "Rosalba Carriera"
vie = "Venise, 1673 – Venise, 15 avril 1757"
biographie = """
Fille d'un employé de la République et d'une dentellière, Rosalba Carriera commence \
par dessiner des modèles de dentelle, puis peint des miniatures pour les couvercles de \
tabatières, souvent sur ivoire. Au début du XVIIIᵉ siècle, elle se tourne vers le \
pastel et devient vite célèbre : l'Académie de Saint-Luc de Rome l'admet parmi ses \
membres. Les voyageurs du Grand Tour, les princes et les souverains de passage à \
Venise se font portraiturer par elle ; le prince électeur de Saxe, futur Auguste III, \
collectionne ses œuvres. En 1720-1721, elle séjourne à Paris chez le banquier et \
collectionneur Pierre Crozat ; elle y peint le jeune Louis XV et rencontre Antoine \
Watteau, dont elle fait le portrait. L'Académie royale de peinture la reçoit par \
acclamation. En 1730, elle travaille à Vienne pour l'empereur Charles VI. Elle vit à \
Venise avec ses sœurs, Giovanna, qui l'assiste, et Angela, épouse du peintre Giovanni \
Antonio Pellegrini. Atteinte de la cataracte, opérée sans succès, elle perd la vue et \
meurt en 1757."""
style = """
Rosalba Carriera a fait du pastel, jusque-là technique d'esquisse, un art de premier \
rang. Ses portraits, d'une douceur vaporeuse, rendent la peau, la poudre, les \
dentelles et les fourrures avec une légèreté nouvelle. Son séjour parisien a lancé la \
mode du portrait au pastel en France, où Maurice Quentin de La Tour et Jean-Baptiste \
Perronneau ont suivi son exemple."""

[[artistes]]
nom = "Bernardo Bellotto"
vie = "Venise, vers 1721 – Varsovie, 17 novembre 1780"
biographie = """
Fils d'une sœur de Canaletto, Bernardo Bellotto entre très jeune dans l'atelier de son \
oncle, où il apprend la veduta, la vue de ville, et la gravure. En 1742, il part pour \
Rome, puis peint des vues de villes du nord de l'Italie, comme Vérone et Turin. En \
1747, il s'installe à Dresde, à l'invitation de l'électeur de Saxe Auguste III, qui le \
nomme peintre de la cour. Il y peint pendant dix ans de grandes vues de la ville et de \
ses environs. La guerre de Sept Ans l'oblige à partir : il travaille à Vienne pour \
l'impératrice Marie-Thérèse, puis à Munich. Revenu à Dresde, il trouve une ville \
dévastée par les bombardements prussiens de 1760. Après la mort d'Auguste III, il \
gagne Varsovie, où le roi Stanislas Auguste Poniatowski en fait son peintre de cour. \
Il y peint plus de vingt vues de la ville et meurt à Varsovie en 1780."""
style = """
Bellotto pousse la veduta vers l'exactitude : vues très larges, architecture décrite \
pierre à pierre, lumière froide et ombres nettes. Moins brillant que son oncle, plus \
grave, il peint aussi les villes d'Europe centrale. Ses vues de Varsovie ont servi à \
reconstruire la vieille ville, détruite pendant la Seconde Guerre mondiale."""

[[artistes]]
nom = "Pietro Longhi"
vie = "Venise, 5 novembre 1701 – Venise, 8 mai 1785"
biographie = """
Pietro Falca, fils d'un orfèvre vénitien, prend le nom de Longhi lorsqu'il devient \
peintre. Il se forme à Vérone auprès d'Antonio Balestra, puis à Bologne auprès de \
Giuseppe Maria Crespi, peintre de scènes de la vie quotidienne. Ses débuts sont ceux \
d'un peintre d'histoire : en 1734, il peint à fresque la Chute des Géants dans \
l'escalier du palais Sagredo, à Venise. Mais vers 1740, il trouve sa voie avec de \
petits tableaux qui montrent la vie des patriciens vénitiens : la leçon de danse, le \
concert, la toilette, la visite, le ridotto où l'on joue masqué. Ces scènes plaisent à \
la noblesse de la ville, qui s'y reconnaît. Le dramaturge Carlo Goldoni, qui peignait \
au théâtre la même société, salue son talent dans un poème. Longhi participe à la vie \
de l'Académie de Venise et dirige à partir de 1763 une école de dessin. Son fils \
Alessandro devient un portraitiste réputé."""
style = """
Longhi est le chroniqueur de la Venise du XVIIIᵉ siècle : petits formats, figures un \
peu raides comme des poupées, couleurs douces, intérieurs paisibles. Sans la satire \
mordante de son contemporain anglais William Hogarth, il observe avec une ironie \
légère les rites d'une aristocratie qui se divertit. Ses tableaux sont aujourd'hui une \
source précieuse sur les costumes, les masques et les intérieurs de son temps."""

[[artistes]]
nom = "Francesco Guardi"
vie = "Venise, 5 octobre 1712 – Venise, 1ᵉʳ janvier 1793"
biographie = """
Francesco Guardi naît à Venise dans une famille de peintres originaire du Trentin. À \
la mort de leur père, Domenico, en 1716, l'atelier familial passe à ses frères aînés, \
et surtout à Gian Antonio, avec qui Francesco peint pendant des années des tableaux \
religieux et des copies. Leur sœur Maria Cecilia épouse en 1719 Giambattista Tiepolo. \
Après la mort de Gian Antonio, en 1760, Francesco se consacre aux vues de Venise et \
aux caprices, paysages imaginaires faits de ruines et de lagunes. Il travaille pour \
les voyageurs étrangers et pour des amateurs vénitiens, dans le sillage de Canaletto, \
mais avec une manière de plus en plus libre. En 1782, il est chargé de peindre les \
fêtes offertes à Venise au pape Pie VI et aux grands-ducs de Russie. Il n'est admis \
que tardivement à l'Académie, comme peintre de perspective. Il meurt à Venise au tout \
début de 1793 ; son fils Giacomo continue à vendre des vues de la ville."""
style = """
Guardi peint une Venise vibrante et mouvante, faite de touches rapides, de reflets et \
de silhouettes esquissées, sous des ciels gris et argentés. Moins exact que Canaletto, \
il saisit l'atmosphère plus que l'architecture. Méconnu de son vivant, il a été admiré \
au XIXᵉ siècle, et l'on a vu en lui un lointain précurseur des impressionnistes."""
