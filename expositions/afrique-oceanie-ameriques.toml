# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Tête royale d'Ifé"
artiste = "Ifé, royaume yoruba"
annee = "XIVᵉ – début du XVᵉ siècle"
image = "tete-ife.jpg"
credit = "Photo : Sailko"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Arte_yoruba,_nigeria,_testa_da_ife,_12-15mo_secolo.JPG"
technique = "Alliage cuivreux (laiton) fondu à la cire perdue, hauteur 35 cm environ"
collection = "British Museum, Londres"
note = "Une tête couronnée, grandeur nature, coulée en métal à Ifé, la ville sainte des Yoruba : sans doute le portrait idéalisé d'un roi, l'ooni. Haute d'environ 35 cm, elle est montrée ici agrandie."
description = """
Une tête d'homme, à peu près grandeur nature, se dresse sur un cou cylindrique. Le \
visage, ovale et plein, est d'un calme parfait : paupières lourdes, nez large et \
droit, lèvres pleines et bien dessinées, closes. Toute sa surface est parcourue de \
fines lignes verticales, serrées et parallèles, qui descendent du front jusqu'au \
menton. Autour de la bouche et sur la mâchoire, une rangée de petits trous perce le \
métal. La tête porte une haute couronne faite de rangs de perles tubulaires, ornée sur \
le devant d'une rosette et surmontée d'un plumet tressé terminé par une pointe en \
forme de bouton. Le métal, patiné, a pris une teinte vert sombre, qui laisse affleurer \
par endroits des reflets rougeâtres."""
evocation = """
La couronne de perles, réservée au roi, désigne très probablement un ooni, souverain \
sacré d'Ifé, la ville que les Yoruba regardent comme le lieu où le monde a été créé. \
Le visage n'est pas celui d'un individu saisi sur le vif, mais une image idéale : \
jeune, serein, sans défaut. Les historiens y voient l'expression d'une royauté hors du \
temps, plus que le portrait d'un homme. Les fines stries ont été lues comme des \
scarifications ou comme le souvenir d'un voile de perles couvrant le visage du roi, \
qui ne devait pas être vu ; les petits trous servaient sans doute à fixer des perles, \
une barbe ou ce voile. On pense que de telles têtes portaient des coiffures ou des \
vêtements lors de rites funéraires ou commémoratifs."""
histoire = """
En 1938, des ouvriers qui creusaient des fondations dans l'enceinte de Wunmonije, près \
du palais de l'ooni à Ifé, mettent au jour un ensemble de têtes en métal. Leur \
découverte stupéfie les savants européens. La plupart restent au Nigeria, alors \
colonie britannique, et sont aujourd'hui conservées par les musées nationaux du pays. \
Celle-ci quitte Ifé et entre au British Museum dès 1939, sous l'inventaire \
Af1939,34.1. Son départ reste discuté au Nigeria, qui souhaite voir revenir les œuvres \
sorties du pays pendant la période coloniale. La tête est devenue l'emblème de l'art \
d'Ifé : elle a figuré dans de grandes expositions consacrées à la ville et compte \
parmi les pièces les plus célèbres du musée de Londres."""
facture = """
La tête est coulée à la cire perdue : le sculpteur modèle le visage en cire sur un \
noyau d'argile, l'enveloppe d'un moule, puis fait fondre la cire et la remplace par le \
métal en fusion. Les parois sont minces et régulières, signe d'une grande maîtrise \
technique. Le modelé des chairs, très doux, les paupières ourlées et les lèvres au \
contour net témoignent d'une observation attentive du visage humain, que les artistes \
d'Ifé pratiquaient aussi dans la terre cuite. Les stries ont été gravées dans la cire \
avant la fonte, une à une."""
details = [
  "Les fines stries verticales qui couvrent tout le visage.",
  "Les petits trous autour de la bouche et le long de la mâchoire.",
  "La rosette au centre de la couronne de perles.",
  "Le plumet tressé dressé au sommet de la tête.",
  "Les paupières lourdes, à demi baissées, au contour finement ourlé.",
]
themes = ["royauté", "portrait", "yoruba", "bronze", "nigeria"]
anecdote = """
Quand l'ethnologue allemand Leo Frobenius vit à Ifé, en 1910, des têtes de ce style, \
il refusa d'y voir l'œuvre d'artistes africains et imagina qu'elles venaient de \
l'Atlantide ou de colons grecs : un préjugé que l'archéologie a depuis entièrement \
démenti."""
salle = 2
mur = "nord"
place = 2
largeur = 0.7

[[oeuvres]]
titre = "Pendentif-masque de la reine mère Idia"
artiste = "Royaume du Bénin, Edo"
annee = "XVIᵉ siècle"
image = "masque-idia.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Queen_Mother_Pendant_Mask-_Iyoba_MET_DP231460.jpg"
technique = "Ivoire, incrustations de fer et de laiton, 23,8 × 12,7 × 6,4 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Un petit masque d'ivoire que l'oba du Bénin portait à la ceinture, à l'effigie de sa mère, Idia, première reine mère du royaume. Haut de 24 cm, il est montré ici agrandi."
description = """
Le visage d'une femme, sculpté dans l'ivoire, regarde droit devant lui. Les traits \
sont fins et réguliers : un nez droit, des lèvres pleines, des yeux en amande dont les \
pupilles sont incrustées de fer. Sur le front, deux bandes verticales de fer marquent \
l'emplacement de scarifications. Les cheveux, tressés en petites boucles, sont rendus \
par un semis de cercles. Au sommet, une sorte de diadème ajouré aligne de minuscules \
têtes d'hommes barbus, coiffés à l'européenne, qui alternent avec des poissons. Un \
collier ajouré du même type entoure le menton. L'ivoire, jauni par le temps, est \
parcouru de fines craquelures, et des traces vertes de métal se devinent autour de la \
bouche."""
evocation = """
Au début du XVIᵉ siècle, l'oba Esigie l'emporte dans une guerre contre le royaume \
voisin d'Igala grâce, dit la tradition, aux conseils et aux pouvoirs de sa mère, Idia. \
Il crée pour elle le titre d'iyoba, reine mère, avec son propre palais. Le masque \
célèbre cette femme de pouvoir. Les petites têtes barbues sont des Portugais, arrivés \
par la mer à la fin du XVᵉ siècle : pour les Edo, ces étrangers venus de l'océan \
étaient associés à Olokun, dieu des eaux et de la richesse. Les poissons de vase, \
capables de survivre hors de l'eau, évoquent le passage entre deux mondes, et la \
puissance de l'oba, roi divin. L'oba portait ce pendentif à la hanche lors de \
cérémonies de purification du royaume."""
histoire = """
Le masque a été sculpté pour la cour de Benin City, dans l'actuel Nigeria, par la \
corporation des sculpteurs d'ivoire, au service exclusif de l'oba. En février 1897, \
une expédition militaire britannique prend et incendie la ville, exile l'oba \
Ovonramwen et emporte plusieurs milliers d'objets du palais. Celui-ci fait partie du \
butin ; il passe ensuite par des collections britanniques avant d'être acquis par \
Nelson Rockefeller, qui le donne au Met en 1972. Le Nigeria et la famille royale du \
Bénin demandent depuis des décennies le retour de ces œuvres. Depuis 2021, des musées \
et des universités d'Allemagne, des États-Unis et du Royaume-Uni ont commencé à \
restituer des objets pillés en 1897 ; ce masque, lui, est toujours à New York."""
facture = """
L'ivoire, matériau royal au Bénin, est taillé avec une extrême finesse : les têtes du \
diadème, hautes de quelques millimètres, ont chacune leur barbe et leur chapeau. Le \
sculpteur joue sur les contrastes : surfaces lisses du visage, relief granuleux de la \
chevelure, ajours de la couronne et du collier. Le fer, incrusté dans les yeux et sur \
le front, assombrit le regard et rend la présence plus intense. Au revers, des \
passants permettaient d'attacher le masque à la ceinture."""
details = [
  "Les petites têtes de Portugais barbus qui forment la couronne.",
  "Les poissons de vase qui alternent avec elles.",
  "Les deux bandes de fer verticales au milieu du front.",
  "Les pupilles de fer, dont l'une a gardé tout son éclat sombre.",
]
themes = ["reine mère", "pouvoir", "ivoire", "portugais", "restitution"]
anecdote = """
Le jumeau de ce masque, au British Museum, est devenu l'emblème du FESTAC 77, grand \
festival des arts africains organisé à Lagos en 1977. Le Nigeria avait demandé son \
prêt ; faute de l'obtenir, il en fit réaliser une copie, et le masque est devenu un \
symbole des demandes de restitution."""
salle = 2
mur = "nord"
place = 3
largeur = 0.8

[[oeuvres]]
titre = "Plaque au chef guerrier"
artiste = "Royaume du Bénin, Edo"
annee = "vers 1540–1570"
image = "plaque-chef-guerrier.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Plaque-_Warrior_Chief_MET_1979.206.98.jpeg"
technique = "Laiton fondu à la cire perdue, 47,4 × 21,5 × 6,1 cm"
collection = "Metropolitan Museum of Art, New York"
note = "L'une des centaines de plaques de laiton qui couvraient les piliers du palais royal du Bénin : un chef de guerre en tenue d'apparat."
description = """
Sur une plaque rectangulaire de métal, un homme debout se détache en haut relief, de \
face, presque comme une statue. Il porte un casque haut, tressé et garni de pointes et \
d'une plume recourbée, et son cou disparaît dans un haut col de perles. Le torse est \
nu ; un pagne aux bords ornés de motifs, noué sur la hanche, lui descend aux genoux, \
et des bracelets enserrent ses poignets et ses chevilles. De la main gauche, il tient \
une longue lance verticale. Le fond est gravé de motifs en forme de feuilles à quatre \
lobes, à peine visibles. Aux bords de la plaque, plusieurs trous ronds montrent où \
passaient les clous qui la fixaient au bois."""
evocation = """
Les plaques formaient une sorte d'archive en images de la cour : l'oba et ses \
dignitaires, les guerriers, les musiciens, les rites, les étrangers portugais. Ce \
chef, raide et frontal, n'est pas un individu mais un rang : le casque, le col de \
perles de corail et la lance disent son statut et sa fonction militaire, au service du \
roi. Au XVIᵉ siècle, le Bénin est un puissant royaume en expansion, qui commerce avec \
les Portugais. Le métal lui-même raconte ce commerce : le laiton arrivait en partie \
sous forme de manilles, des bracelets de métal que les Européens échangeaient contre \
de l'ivoire, du poivre, des étoffes et, plus tard, des captifs. Les feuilles gravées \
du fond sont souvent rattachées au culte d'Olokun."""
histoire = """
La plaque a été coulée par la corporation des fondeurs de Benin City, installée dans \
une rue réservée et travaillant pour le seul oba. Clouée à un pilier du palais, elle \
en est retirée plus tard et rangée avec les autres. En février 1897, après la mort de \
membres d'une expédition britannique, une force de plus d'un millier d'hommes prend la \
ville, l'incendie et emporte les trésors du palais, dont environ neuf cents plaques, \
vendues pour payer l'opération et dispersées dans les musées d'Europe et d'Amérique. \
Depuis 2021, des institutions d'Allemagne, des États-Unis et du Royaume-Uni ont rendu \
au Nigeria des centaines d'objets ou leur propriété ; en 2021, le Met a lui-même rendu \
au Nigeria deux plaques sorties illégalement des collections nationales nigérianes. \
Celle-ci est entrée au Met en 1979 avec la collection de Nelson Rockefeller."""
facture = """
La plaque est coulée d'un seul jet, à la cire perdue, figure et fond ensemble. Le \
relief est très fort : la tête et les épaules se détachent presque entièrement du \
fond. Le fondeur a travaillé la cire avec minutie, pour rendre les perles du col une à \
une, les tresses du casque et les motifs du pagne. Le fond, plat, est poinçonné de \
petits points et gravé de feuilles, ce qui le fait vibrer sous la lumière. La \
composition, symétrique et frontale, était pensée pour être lue de loin, sur les \
piliers."""
details = [
  "Le haut col de perles qui cache le cou du guerrier.",
  "Le casque tressé, hérissé de pointes, et sa plume recourbée.",
  "Les feuilles à quatre lobes gravées dans le fond, de part et d'autre.",
  "Les trous des clous, aux angles et sur les bords de la plaque.",
]
themes = ["guerrier", "cour royale", "laiton", "pillage", "restitution"]
anecdote = """
Les fondeurs de Benin City travaillent toujours : la corporation des Igun Eronmwon, \
installée dans la même rue depuis des siècles, coule encore aujourd'hui des objets de \
laiton à la cire perdue, selon les méthodes de ses ancêtres."""
salle = 2
mur = "sud"
place = 4
largeur = 0.9

[[oeuvres]]
titre = "Masque de coureur (gunyege)"
artiste = "Dan"
annee = "début du XXᵉ siècle (?)"
image = "masque-dan.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1972.331"
technique = "Bois, métal, cuir et matières organiques, hauteur 22,9 cm"
collection = "Cleveland Museum of Art"
note = "Un masque des Dan de Côte d'Ivoire ou du Liberia, au front haut et aux yeux cerclés de métal, porté par un coureur lors de courses masquées. Haut de 23 cm, il est montré ici agrandi."
description = """
Le masque, en bois sombre et poli, a la forme d'un ovale allongé, légèrement bombé. Le \
front, très haut et lisse, occupe presque la moitié du visage. Les yeux sont deux \
grands trous ronds, cerclés d'anneaux de métal clair qui leur donnent un regard fixe \
et lumineux. Le nez est court, les narines bien marquées. La bouche, entrouverte, \
laisse voir une rangée de dents. Tout autour du visage, une ligne de petits trous suit \
le bord du masque. La surface brune, patinée par l'usage, est striée de fines lignes \
et marquée de taches plus claires là où le bois a été usé ou frotté."""
evocation = """
Chez les Dan, un masque n'est pas une simple sculpture : il est la demeure d'un esprit \
de la forêt, qui se manifeste au village lorsque le masque est porté, avec son \
costume, par un danseur dont l'identité reste secrète. Chaque masque a un rôle et un \
nom. Ce type au front haut, du nord du pays dan, est appelé sagbwe ou gunyege. Le \
gunyege est un « masque coureur » : il prenait part à des courses organisées chaque \
semaine pendant la saison sèche. Ses yeux ronds et larges, dit-on, permettaient au \
porteur de bien voir en courant. Le masque pouvait aussi veiller contre le feu, quand \
souffle l'harmattan, vent sec et dangereux venu du Sahara."""
histoire = """
Le Cleveland Museum of Art ne connaît pas le nom du sculpteur ni le village d'origine \
du masque : on sait seulement qu'il a été taillé par un artiste du style dan, dans la \
région qui chevauche aujourd'hui la Côte d'Ivoire et le Liberia, sans doute au début \
du XXᵉ siècle. Comme beaucoup d'objets dan, il a été acheté par des collectionneurs \
occidentaux à une époque où l'on ne relevait guère le contexte des objets. Il \
appartenait à Katherine White, grande collectionneuse d'art africain de Cleveland, qui \
l'a donné au musée en 1972. Les spécialistes ont remarqué que ses yeux ont été \
modifiés : à l'origine, c'étaient des fentes, transformées plus tard en cercles, signe \
que le masque a changé de fonction au cours de sa vie."""
facture = """
Le sculpteur a taillé le masque dans un seul bloc de bois, à l'herminette puis au \
couteau, en creusant l'intérieur pour qu'il s'ajuste au visage. La surface a été \
noircie et polie ; l'usage et les soins répétés lui ont donné sa patine brillante. Le \
style dan du nord se reconnaît au front haut et bombé, à l'ovale régulier et aux \
volumes simples et tendus. Les trous du pourtour servaient à attacher une coiffure de \
fibres et le costume qui cachait le porteur ; les anneaux de métal ont été ajoutés \
autour des yeux."""
details = [
  "Les anneaux de métal qui entourent les yeux ronds.",
  "Sur l'œil droit du masque, la trace de l'ancienne fente, avant l'agrandissement.",
  "La rangée de petits trous qui suit le bord du visage.",
  "Les dents visibles dans la bouche entrouverte.",
]
themes = ["masque", "esprit", "course", "forêt", "côte d'ivoire"]
anecdote = """
Chez les Dan, on ne dit pas qu'un homme porte un masque : c'est l'esprit du masque qui \
apparaît. Révéler qui se trouve sous le costume était un interdit grave, et les femmes \
et les enfants n'étaient pas censés le savoir."""
salle = 3
mur = "nord"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Tête de gardien de reliquaire (nlô byeri)"
artiste = "Fang"
annee = "XIXᵉ siècle"
image = "tete-byeri-fang.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Sculptural_Element_from_a_Reliquary_Ensemble-_Head_(The_Great_Bieri)_MET_DT1238.jpg"
technique = "Bois, alliage de cuivre, huile de palme, 46,5 × 24,8 × 16,8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Une tête fang du Gabon, connue sous le surnom de « Grand Byeri » : elle veillait sur une boîte contenant les reliques des ancêtres d'une famille."
description = """
Une grande tête de bois noir et brillant se dresse sur un long cou cylindrique, planté \
dans un socle moderne. Le visage, en forme de cœur allongé, est dominé par un front \
énorme et bombé, qui descend en deux arcs vers les yeux. Ceux-ci sont deux disques de \
métal, ternis, posés au fond de cavités. Le nez, long et étroit, rejoint une petite \
bouche aux lèvres serrées, projetée en avant au-dessus d'un menton pointu. De chaque \
côté, une longue tresse plate encadre le visage et descend le long du cou, garnie de \
deux disques. Une fente profonde traverse le bois du sommet du crâne jusqu'au menton. \
La surface, luisante, semble encore humide par endroits."""
evocation = """
Chez les Fang, les os des ancêtres importants, et surtout leurs crânes, étaient \
conservés dans des boîtes cylindriques en écorce, gardées par le chef de famille. Sur \
le couvercle, une statue ou, comme ici, une tête, le byeri, veillait sur ces reliques \
et les protégeait des regards des non-initiés. Le visage n'est pas un portrait. Avec \
son grand front et ses proportions de nouveau-né, on y a vu l'union de l'ancêtre et de \
l'enfant, de la mort et de la renaissance. On a souvent parlé de son calme, de sa \
concentration presque méditative. Pour les artistes européens du début du XXᵉ siècle, \
de telles têtes ont été une révélation : une sculpture qui simplifie les formes sans \
rien perdre de sa force."""
histoire = """
La tête a été sculptée au XIXᵉ siècle par un artiste betsi, l'un des groupes fang du \
Gabon. Le culte du byeri recule à partir de la fin du XIXᵉ siècle, sous la pression \
des missionnaires et de l'administration coloniale française, qui le combattent : \
beaucoup de reliquaires sont alors détruits, séparés de leurs boîtes ou vendus. Les \
têtes et les statues arrivent ainsi en Europe, où marchands et collectionneurs les \
recherchent, sans les reliques qu'elles gardaient. Celle-ci, devenue l'une des plus \
célèbres, est entrée dans la collection de Nelson Rockefeller, qui l'a léguée au Met \
en 1979 avec son ensemble d'art d'Afrique, d'Océanie et des Amériques."""
facture = """
Le sculpteur a taillé la tête et le cou dans un seul morceau de bois. Les volumes sont \
réduits à quelques formes pleines : la coque du front, les plans creusés des joues, \
l'avancée de la bouche. Les tresses, plates, forment un cadre qui équilibre la \
composition. Le bois était régulièrement enduit d'huile de palme lors des rites : la \
matière, en s'accumulant, a formé cette croûte noire et luisante, qui suinte encore. \
Les yeux de métal accrochent la lumière dans la pénombre."""
details = [
  "Les deux disques de métal des yeux, au fond de leurs orbites.",
  "La fente qui court du sommet du front jusqu'au menton.",
  "Les tresses plates, de chaque côté, garnies de deux disques ronds.",
  "La surface luisante, épaissie par l'huile de palme accumulée.",
  "Le long cou, qui s'enfonçait dans la boîte à reliques.",
]
themes = ["ancêtres", "reliquaire", "gabon", "bois", "culte"]
anecdote = """
Lors de l'initiation des jeunes gens, les Fang retiraient les byeri de leurs boîtes et \
les faisaient danser derrière une tenture, comme des marionnettes, pour présenter les \
ancêtres à la nouvelle génération."""
salle = 3
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Pendentif hei-tiki"
artiste = "Māori"
annee = "XIXᵉ siècle"
image = "hei-tiki.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Unknown_artist_-_Pendant_(Hei-tiki)_-_1969.107_-_Cleveland_Museum_of_Art.jpg"
technique = "Néphrite (pounamu, jade de Nouvelle-Zélande), 16,9 × 10,2 cm"
collection = "Cleveland Museum of Art"
note = "Un pendentif de jade vert en forme de figure humaine, porté au cou par les Māori et transmis de génération en génération. Haut de 17 cm, il est montré ici agrandi."
description = """
Une petite figure humaine, taillée dans une pierre d'un vert profond, est assise, les \
jambes repliées et écartées, qui forment en bas une large base arrondie. Sa tête, \
énorme, occupe près de la moitié de la hauteur et penche sur le côté. Deux grands yeux \
ronds, chacun fait d'un anneau en relief autour d'un bouton central, se trouvent ainsi \
à des hauteurs différentes ; à côté, une bouche et une main sont réduites à des \
courbes gravées. Les bras, pliés, dessinent deux anses de part et d'autre du torse \
plat. Entre les membres, des ajours laissent passer la lumière. La pierre est polie au \
point de briller ; son vert, presque noir dans les creux, s'éclaircit sur les arêtes \
et se tache par endroits de veines plus claires."""
evocation = """
Hei signifie « porté au cou » et tiki désigne une figure humaine. Pour les Māori, ces \
pendentifs sont des taonga, des trésors chargés de mana, le prestige et la puissance \
spirituelle de ceux qui les ont portés. Ils se transmettent dans les familles de chef, \
au fil des générations, et relient les vivants à leurs ancêtres. Que représente la \
figure ? On y a vu Tiki, le premier homme des récits māori, ou un ancêtre ; le \
Cleveland Museum of Art rappelle aussi l'hypothèse de Hine-te-iwaiwa, ancêtre \
légendaire, modèle de la femme et protectrice des naissances. La tête inclinée et la \
posture repliée ont parfois été rapprochées de celle d'un embryon."""
histoire = """
Le pounamu, ce jade vert, ne se trouve que dans l'île du Sud de la Nouvelle-Zélande, \
surtout sur la côte ouest et dans les rivières ; les Māori appellent d'ailleurs l'île \
Te Wai Pounamu, « les eaux du jade ». La pierre circulait par échanges dans tout le \
pays. Au XIXᵉ siècle, de nombreux hei-tiki quittent la Nouvelle-Zélande, colonisée par \
les Britanniques à partir de 1840, achetés ou recueillis par des voyageurs, des marins \
et des collectionneurs. Celui-ci est passé par la collection de l'Anglais Harry \
Beasley, grand collectionneur d'objets du Pacifique, puis par celle de John Wise. Il \
est entré au Cleveland Museum of Art en 1969, offert par Mr. et Mrs. James B. Wadhams."""
facture = """
La néphrite est une pierre très dure, que l'on ne peut pas tailler au couteau. Avant \
l'arrivée des outils de métal européens, les sculpteurs māori la découpaient en la \
sciant avec des lames de grès et de l'eau, puis la creusaient et la perçaient avec des \
forets de pierre, et la polissaient pendant des heures avec du sable : la fabrication \
d'un hei-tiki pouvait prendre des mois. Les formes, pleines et arrondies, épousent \
l'épaisseur de la plaque de pierre de départ. Le poli, porté à l'extrême, fait sortir \
la profondeur de la couleur."""
details = [
  "La grande tête inclinée sur le côté.",
  "L'œil rond, cerclé d'un épais bourrelet de pierre.",
  "Les bras pliés en anse de chaque côté du torse.",
  "Les ajours entre les bras, les jambes et le torse.",
  "Les nuances du vert, plus sombre dans les creux.",
]
themes = ["jade", "ancêtres", "parure", "polynésie", "nouvelle-zélande"]
anecdote = """
Les yeux des hei-tiki étaient souvent incrustés de nacre de paua, l'ormeau de \
Nouvelle-Zélande aux reflets bleu-vert, ou de cire rouge. Sur celui-ci, les yeux sont \
taillés dans la pierre elle-même, en anneaux concentriques."""
salle = 4
mur = "nord"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Planche d'esprit (hohao)"
artiste = "Elema, golfe de Papouasie"
annee = "avant 1930"
image = "planche-esprit-elema.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1971.154"
technique = "Bois peint, hauteur 123,2 cm"
collection = "Cleveland Museum of Art"
note = "Une planche sacrée de Papouasie-Nouvelle-Guinée, habitée par un esprit de la brousse dont elle portait le nom, et conservée dans la maison des hommes."
description = """
Une planche de bois ovale, haute de plus d'un mètre, se termine en haut et en bas par \
un court tenon. Sur un fond blanchi, un personnage est gravé et peint en rouge brun. \
Il est presque tout visage : deux grands yeux en amande, aux pupilles faites de \
cercles concentriques, encadrent un nez long et pointu, sculpté en relief, et une \
large bouche hérissée de dents en zigzag. Au-dessus, des chevrons et des dents de scie \
forment comme une coiffe. Sous le visage, deux petits bras se lèvent, mains ouvertes, \
de part et d'autre d'un corps en forme d'œuf, peint en rouge, au centre duquel un \
cercle marque le nombril. Deux jambes maigres, pliées, descendent vers le bas. Des \
bandes de chevrons suivent les bords de la planche."""
evocation = """
Chez les Elema, qui vivent sur la côte du golfe de Papouasie, au sud de la \
Nouvelle-Guinée, chaque planche était habitée par un esprit de la brousse, dont elle \
portait le nom. Les planches étaient gardées dans la grande maison des hommes, au cœur \
du village, avec d'autres objets sacrés, à l'abri du regard des femmes et des enfants. \
On leur demandait, rapportent les observateurs du début du XXᵉ siècle, protection et \
succès, à la chasse comme à la guerre. Le visage peint n'est pas celui d'un homme : \
c'est la présence de l'esprit, rendue visible. Les motifs géométriques répètent des \
formes que l'on retrouve sur les grands masques des cérémonies elema."""
histoire = """
La planche a été sculptée et peinte avant 1930 dans la région du golfe de Papouasie, \
alors administrée par l'Australie. À cette époque, l'arrivée des missionnaires et des \
administrateurs bouleverse la vie religieuse : les grandes cérémonies se raréfient, \
des maisons des hommes sont abandonnées et beaucoup d'objets sacrés sont vendus ou \
emportés par des collectionneurs et des musées occidentaux. L'anthropologue australien \
Francis Edgar Williams étudie alors la région d'Orokolo et décrit les cérémonies \
elema. La planche est entrée au Cleveland Museum of Art en 1971, offerte par le Dr et \
Mrs. Thomas Munro."""
facture = """
La planche est taillée dans un seul panneau de bois, aminci et arrondi, avec ses deux \
tenons. Seul le nez est sculpté en relief ; tout le reste est obtenu par la gravure de \
sillons peu profonds, puis par la peinture. Les couleurs sont des pigments naturels : \
ocre rouge et blanc de chaux ou d'argile, sur le brun du bois. Le décor, presque \
symétrique, s'organise autour de l'axe du nez."""
details = [
  "Les pupilles faites de cercles concentriques.",
  "Le nez pointu, seul élément sculpté en relief.",
  "La bouche aux dents en zigzag.",
  "Les petites mains levées de part et d'autre du corps rouge.",
  "Le cercle du nombril au centre du corps.",
]
themes = ["esprit", "maison des hommes", "peinture", "papouasie", "sacré"]
anecdote = """
Les Elema donnaient à chaque planche le nom de l'esprit qui l'habitait : pour eux, ces \
planches n'étaient pas des images interchangeables, mais des êtres individuels, que \
l'on connaissait et que l'on nommait comme des personnes."""
salle = 4
mur = "nord"
place = 3
largeur = 0.6

[[oeuvres]]
titre = "Visage de jade"
artiste = "Olmèques"
annee = "900–400 av. J.-C."
image = "visage-olmeque.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/310279"
technique = "Jadéite, 14,6 × 14 × 7,6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Un visage humain taillé dans une jadéite vert sombre par les Olmèques du golfe du Mexique, la plus ancienne grande civilisation de la Mésoamérique. Haut de 15 cm, il est montré ici agrandi."
description = """
Un visage d'homme, de face, est taillé dans une pierre verte, sombre et veinée de \
taches plus claires. Les traits sont pleins et puissants : larges pommettes, nez court \
et épaté, paupières lourdes, yeux en amande à peine ouverts, creusés en légères \
fentes. La bouche, aux lèvres épaisses, s'entrouvre, et ses coins s'abaissent \
légèrement. Le visage est coupé net au-dessus du front, comme par un bandeau, et sur \
les côtés ; de petits trous percent les bords, près des oreilles. La surface, polie, \
accroche la lumière sur les reliefs et la garde dans les creux. On ne voit ni cou ni \
chevelure : c'est un masque plutôt qu'une tête."""
evocation = """
Les Olmèques, qui vivaient sur la côte du golfe du Mexique, dans les actuels États de \
Veracruz et de Tabasco, sont connus pour leurs têtes colossales de basalte et pour \
leurs objets de jade. Pour eux, comme plus tard pour les Mayas et les Aztèques, la \
pierre verte était plus précieuse que l'or : elle évoquait l'eau, le maïs vert, la vie \
et le souffle. Ce visage idéal, calme et grave, a été rapproché de ceux des souverains \
et de leurs ancêtres. La bouche aux coins tombants rappelle les figures olmèques que \
l'on dit « à visage de jaguar », êtres mêlant l'homme et l'animal. On ignore si ces \
masques étaient portés, attachés à un costume ou déposés dans des tombes."""
histoire = """
Le visage a été taillé entre 900 et 400 avant J.-C., à l'époque où La Venta, dans \
l'actuel Tabasco, est le grand centre olmèque. On ne connaît ni son lieu de découverte \
ni son histoire ancienne : comme la plupart des jades olmèques des musées, il est \
apparu sur le marché de l'art sans indication de fouille. Ces objets précieux \
circulaient déjà dans l'Antiquité : les Mayas et les Aztèques en retrouvaient, les \
gardaient et les réutilisaient comme des reliques, plusieurs siècles après leur \
fabrication. Celui-ci a appartenu à la collectionneuse new-yorkaise Alice K. Bache, \
qui l'a légué au Met en 1977."""
facture = """
La jadéite est une pierre si dure qu'elle ne se laisse pas tailler par des outils de \
métal ordinaires ; les Olmèques n'en avaient d'ailleurs pas. Le sculpteur l'a usée \
patiemment avec des abrasifs, du sable et de l'eau, des cordelettes et des forets de \
bois ou d'os, puis l'a polie longuement. Le travail se voit dans la douceur des \
passages entre les volumes : les joues, les paupières et les lèvres semblent modelées \
comme de la cire. Les perforations latérales, faites au foret, permettaient sans doute \
de fixer le visage."""
details = [
  "Les yeux mi-clos, simples fentes dans la pierre.",
  "La bouche entrouverte, aux coins légèrement tombants.",
  "Les veines plus claires qui traversent la jadéite.",
  "Les petits trous percés sur les bords, près des oreilles.",
]
themes = ["jade", "mésoamérique", "visage", "souverain", "mexique"]
anecdote = """
Les Aztèques collectionnaient déjà les antiquités olmèques : un masque de pierre verte \
de style olmèque, vieux de plus de deux mille ans à l'époque, a été retrouvé parmi les \
offrandes enterrées au Templo Mayor de Tenochtitlan."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Pendentif au personnage masqué"
artiste = "Tairona"
annee = "900–1600"
image = "pendentif-tairona.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Masked_Figure_Pendant_MET_DP215717.jpg"
technique = "Or fondu à la cire perdue, 13,3 × 14,6 × 5,1 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Un pendentif d'or des Tairona, peuple de la Sierra Nevada de Santa Marta, dans le nord de la Colombie : un homme masqué sous une immense coiffe. Large de 15 cm, il est montré ici agrandi."
description = """
Un petit homme trapu se tient debout, de face, sur des jambes courtes et massives. Ses \
bras pendent le long du corps et ses mains serrent deux objets terminés par des \
spirales, à hauteur des hanches. Une ceinture tressée lui serre la taille. Son visage \
disparaît derrière un masque animal à large bouche garnie de dents. Au-dessus s'élève \
une coiffe immense, bien plus large que lui : deux petites têtes d'oiseaux au bec \
recourbé se penchent au sommet du crâne ; de chaque côté, deux grands éléments plats, \
en forme d'ailes ou de têtes d'oiseaux pourvues d'un œil, s'étendent comme des \
oreilles ; plus haut encore, deux arcs de fil d'or tressé s'enroulent en volutes, \
accompagnés de disques en spirale. L'or, d'un jaune chaud, brille sur les reliefs."""
evocation = """
Le personnage est sans doute un homme de haut rang, chef ou prêtre, paré pour une \
cérémonie. Le masque et la coiffe aux têtes d'oiseaux suggèrent une transformation : \
au cours du rite, l'homme prend la force de l'animal. Pour les peuples de Colombie, \
l'or n'était pas une monnaie mais une matière sacrée, liée au soleil et à la \
fertilité, qui faisait briller celui qui le portait. Les Kogi, les Arhuaco et les \
Wiwa, descendants des Tairona qui vivent toujours dans la Sierra Nevada, se \
considèrent comme les gardiens de l'équilibre du monde."""
histoire = """
Les Tairona bâtissaient des villages de pierre, reliés par des escaliers et des \
chemins dallés, sur les pentes de la Sierra Nevada de Santa Marta, au-dessus de la mer \
des Caraïbes. Leurs orfèvres ont produit de nombreux pendentifs de ce type entre le Xᵉ \
et le XVIᵉ siècle. À partir de 1525, les Espagnols fondent Santa Marta et cherchent \
l'or de la région ; après des décennies de guerres, les Tairona se replient dans les \
hauteurs de la montagne. Une grande partie de l'or amérindien saisi par les \
conquérants a été fondu en lingots ; les pièces conservées sortent surtout de tombes. \
Celle-ci a été donnée au Met en 1991 par le collectionneur Jan Mitchell."""
facture = """
Le pendentif est coulé à la cire perdue : l'orfèvre modelait chaque élément en cire, \
roulait de fins fils de cire pour les spirales et les torsades, recouvrait l'ensemble \
d'argile, puis faisait couler le métal en fusion à la place de la cire. Les Tairona \
utilisaient souvent un alliage d'or et de cuivre, appelé tumbaga, dont ils faisaient \
ressortir l'or en surface par un traitement chimique, pour lui donner l'éclat de l'or \
pur. Le travail combine des parties pleines, comme le corps, et des parties ajourées \
très légères."""
details = [
  "Les deux petites têtes d'oiseaux au bec crochu, au sommet du crâne.",
  "Les arcs de fil d'or tressé qui s'enroulent en volutes.",
  "Le masque à la large bouche dentée, qui cache le visage.",
  "Les objets à spirales que le personnage tient dans chaque main.",
  "Les orteils, finement indiqués, sous les pieds trapus.",
]
themes = ["or", "orfèvrerie", "colombie", "masque", "transformation"]
anecdote = """
La « Ciudad Perdida », la Ville perdue des Tairona, avec ses terrasses de pierre \
cachées dans la forêt de la Sierra Nevada, n'a été révélée au grand public que dans \
les années 1970, après sa découverte par des pilleurs de tombes."""
salle = 5
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Chemise peinte de chef"
artiste = "Lakota"
annee = "vers 1890"
image = "chemise-lakota.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:America,_Native_North_American,_Central_Plains,_Lakota_Sioux,_19th_century_-_Hide_Shirt_-_1984.1046_-_Cleveland_Museum_of_Art.tif"
technique = "Peau, pigments, perles de verre, cheveux humains, 97,8 × 150 cm"
collection = "Cleveland Museum of Art"
note = "Une chemise de peau peinte des Lakota des Grandes Plaines, ornée de bandes de perles et de mèches de cheveux : chaque mèche rappelle un exploit guerrier."
description = """
La chemise, étalée bras ouverts, mesure un mètre cinquante d'une manche à l'autre. \
Elle est faite de peaux tannées, coupées simplement. La partie haute et les manches \
sont peintes d'un vert un peu bleuté, la partie basse d'un jaune vif : les deux \
couleurs se fondent l'une dans l'autre à hauteur de la taille. Au col, un petit \
plastron perlé est rayé de bandes horizontales. Sur les épaules et le long des manches \
courent de larges bandes brodées de perles de verre, à fond blanc, ornées de losanges \
et de petites croix rouges, bleues et vertes. Le long de ces bandes pendent de longues \
mèches de cheveux sombres, liées à leur sommet par des bandes rouges. Le bas de la \
chemise et les poignets se terminent par des franges de peau découpée."""
evocation = """
Chez les Lakota, l'une des nations de ceux que les Européens ont appelés Sioux, les \
chemises peintes étaient d'abord le privilège des grands chefs, les « porteurs de \
chemise ». Ce rang se gagnait par le courage et le sacrifice, et se perdait si l'on \
manquait à ses devoirs. Les deux couleurs ont souvent été lues comme le ciel et la \
terre. Les mèches de cheveux, données par des membres de la famille, représentaient \
chacune un exploit de guerre. Vers 1890, quand cette chemise est faite, les Lakota \
sont enfermés dans des réserves ; la chemise peinte est devenue l'honneur des anciens \
combattants, un souvenir de la vie libre des Plaines."""
histoire = """
La chemise a été faite vers 1890, au moment le plus sombre de l'histoire lakota. Les \
bisons ont été exterminés, les terres des Black Hills, sacrées pour les Lakota, ont \
été prises par les États-Unis après la découverte d'or, et les familles vivent dans \
des réserves. Le 29 décembre 1890, l'armée américaine massacre plusieurs centaines de \
Lakota, hommes, femmes et enfants, à Wounded Knee, dans la réserve de Pine Ridge. On \
ignore qui a fait et porté cette chemise et comment elle a quitté sa famille. Elle a \
appartenu à David S. McMillan, de Cleveland, qui l'a léguée au musée en 1984."""
facture = """
La chemise est faite de peaux de cervidé tannées, cousues au tendon. Les couleurs sont \
appliquées au pinceau, sur de grandes surfaces, avec des pigments minéraux ou, déjà à \
cette époque, des couleurs achetées aux comptoirs. Les bandes sont brodées de petites \
perles de verre importées d'Europe, cousues en rangs serrés : c'était un travail de \
femmes, très estimé, qui a remplacé peu à peu la broderie traditionnelle en piquants \
de porc-épic. Les franges et les mèches donnent du mouvement au vêtement lorsque \
l'homme marche ou danse."""
details = [
  "Les mèches de cheveux noirs qui pendent le long des bandes perlées.",
  "Les petites croix rouges brodées sur fond de perles blanches.",
  "Le dégradé où le vert du haut se fond dans le jaune du bas.",
  "Les franges de peau découpée au bas de la chemise et aux poignets.",
]
themes = ["plaines", "chef", "perles", "honneur", "réserves"]
anecdote = """
Les perles de verre que brodaient les femmes lakota venaient en grande partie de \
Venise et de Bohême : elles traversaient l'Atlantique puis remontaient le Missouri \
jusqu'aux postes de traite des Grandes Plaines."""
salle = 5
mur = "est"
place = 2
largeur = 1.8

