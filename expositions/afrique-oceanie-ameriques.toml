[exposition]
ordre = 28
nom_court = "Afrique, Océanie, Amériques"
mouvement = "Arts d'Afrique, d'Océanie et des Amériques"
cadre = "vitrine"
couleur = "#8a4b2a"
titre = "Visages des ancêtres : arts d'Afrique, d'Océanie et des Amériques"
artiste = "Ifé, Bénin, Dan, Fang, Māori, Elema, Olmèques, Tairona, Lakota…"
dates = "900 av. J.-C. – vers 1900"
accroche = "Exposition virtuelle · Musée du quai Branly – Jacques Chirac, Paris"
introduction = """
Longtemps appelés « arts primitifs » ou « arts premiers », les arts d'Afrique, \
d'Océanie et des Amériques sont ceux de royaumes, de cités et de sociétés qui ont \
chacun leur histoire, leurs ateliers et leurs maîtres. La visite réunit dix objets, du \
visage de jade olmèque, vieux de plus de deux millénaires, à une chemise lakota peinte \
vers 1890 : têtes royales d'Ifé et du Bénin, masques et reliquaires d'Afrique de \
l'Ouest et centrale, pendentif māori, planche sacrée de Papouasie, or de Colombie. \
Plusieurs ont quitté leur pays lors de conquêtes coloniales : leur histoire le dit. Le \
bâtiment s'inspire du musée du quai Branly – Jacques Chirac de Jean Nouvel, à Paris : \
une rampe d'entrée, puis un long plateau aux couleurs de terre où les continents se \
suivent sans cloisons fermées."""
vitrine = "masque-idia.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Musée du quai Branly – Jacques Chirac"
ville = "Paris, France"
architecte = "Jean Nouvel"
construction = "ouvert en 2006"
presentation = """
Le musée naît de la volonté du président Jacques Chirac et de son ami le \
collectionneur Jacques Kerchache, qui voulaient donner aux arts d'Afrique, d'Asie, \
d'Océanie et des Amériques la place qu'ils méritaient dans les musées français. Une \
première sélection de chefs-d'œuvre entre au Louvre, au pavillon des Sessions, en 2000 \
; le nouveau musée, qui réunit les collections du musée de l'Homme et du musée \
national des Arts d'Afrique et d'Océanie, ouvre en juin 2006 au bord de la Seine. Jean \
Nouvel l'a conçu comme un long bâtiment posé sur des pilotis au milieu d'un jardin \
dessiné par Gilles Clément ; un mur végétal de Patrick Blanc couvre l'une des façades, \
et des boîtes colorées dépassent de la façade nord. À l'intérieur, une longue rampe \
blanche monte vers le plateau des collections, un espace unique, sombre, où les \
continents se succèdent. Le musée porte le nom de Jacques Chirac depuis 2016. En 2021, \
la France y a puisé vingt-six objets du trésor royal d'Abomey, pris en 1892, pour les \
rendre à la République du Bénin."""
ici = """
Le bâtiment d'ARTEON garde la promenade du musée parisien : une montée, puis un long \
plateau où les continents se suivent. On entre par le sud dans « La rampe », haute de \
huit mètres, qui ouvre au nord sur le plateau, une enfilade est-ouest de quatre salles \
de sept mètres de haut aux murs couleur de terre. Au centre, la salle « Afrique · Ifé \
et le royaume du Bénin » ; à l'ouest, « Océanie » ; à l'est, « Afrique · Masques et \
reliquaires », puis, au bout du plateau, « Amériques ». Les objets y sont présentés \
dans des vitrines murales profondes, sur fond de velours sombre."""

