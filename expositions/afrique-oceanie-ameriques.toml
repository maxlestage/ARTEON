[[artistes]]
nom = "Ifé, royaume yoruba"
vie = "Ifé (sud-ouest de l'actuel Nigeria), XIIᵉ–XVᵉ siècle"
biographie = """
Ifé, ou Ilé-Ifẹ̀, est pour les Yoruba la ville sainte par excellence : c'est là, selon \
leurs récits, que les dieux ont créé la terre et que le premier roi, Oduduwa, a fondé \
la dynastie dont descendent les souverains des autres royaumes yoruba. Entre le XIIᵉ \
et le XVᵉ siècle environ, Ifé est une grande cité entourée de remparts, au cœur de \
réseaux d'échanges qui la relient au fleuve Niger et, au-delà, aux routes du Sahara. \
Ses rues sont pavées de tessons de poterie posés de chant, et ses ateliers fabriquent \
des perles de verre, matière royale. Ses artistes, dont nous ne connaissons pas les \
noms, ont laissé des têtes et des figures en terre cuite et en alliage cuivreux d'un \
naturalisme sans équivalent en Afrique à cette époque, liées au culte des rois et à \
leurs funérailles. Après le XVᵉ siècle, l'influence politique d'Ifé décline au profit \
d'Oyo et du Bénin, mais la ville garde son prestige religieux. Son souverain, l'ooni, \
compte toujours parmi les grands chefs traditionnels du Nigeria. Les fouilles du XXᵉ \
siècle, de Leo Frobenius en 1910 à la découverte de Wunmonije en 1938, ont révélé ce \
patrimoine au monde."""
style = """
L'art d'Ifé frappe par son naturalisme idéalisé : visages calmes, chairs pleines, \
proportions justes, mais traits sans âge ni défaut. Les fondeurs maîtrisaient la fonte \
à la cire perdue de pièces aux parois très fines, et les modeleurs de terre cuite \
allaient du portrait à l'expressivité la plus libre. Cet art a profondément influencé \
celui du Bénin voisin, dont la tradition rapporte qu'un fondeur d'Ifé aurait enseigné \
la fonte du métal aux artistes de la cour."""

[[artistes]]
nom = "Royaume du Bénin, Edo"
vie = "Benin City (sud de l'actuel Nigeria), XIIIᵉ siècle – aujourd'hui"
biographie = """
Le royaume du Bénin, à ne pas confondre avec la République du Bénin voisine, est \
l'État des Edo, dans le sud du Nigeria actuel. Sa capitale, Benin City, est entourée \
de longs remparts de terre. À sa tête règne l'oba, roi sacré, dont la dynastie remonte \
selon la tradition à un prince venu d'Ifé. Aux XVᵉ et XVIᵉ siècles, sous les obas \
Ewuare, Ozolua et Esigie, le royaume s'étend et devient une puissance régionale. Les \
Portugais y arrivent dans les années 1480 et commercent avec la cour : ivoire, poivre, \
étoffes et, plus tard, captifs, contre du laiton, des étoffes et des armes. Au palais, \
des corporations d'artistes, fondeurs de laiton et sculpteurs d'ivoire et de bois, \
travaillent pour le seul oba : elles produisent têtes commémoratives, plaques, statues \
et parures. En février 1897, une expédition britannique prend la ville, l'incendie, \
exile l'oba Ovonramwen et emporte des milliers d'objets, aujourd'hui dispersés dans \
les musées du monde. La monarchie est rétablie en 1914 ; l'oba actuel, Ewuare II, \
demande avec le Nigeria le retour de ces œuvres, dont une partie a commencé à revenir \
depuis 2021."""
style = """
L'art de cour du Bénin est un art d'État, au service de la mémoire du roi. Il se \
reconnaît à ses figures frontales et hiérarchisées, à la précision des parures, perles \
de corail, colliers, armes, et à la virtuosité de la fonte à la cire perdue. Les \
plaques et les ivoires racontent la vie de la cour et la rencontre avec les Européens, \
devenus eux-mêmes des motifs. Les fondeurs de Benin City perpétuent ce savoir-faire \
aujourd'hui."""

[[artistes]]
nom = "Dan"
vie = "Ouest de la Côte d'Ivoire et Liberia, XIXᵉ–XXᵉ siècle"
biographie = """
Les Dan vivent dans les régions de forêt et de savane boisée qui s'étendent de part et \
d'autre de la frontière entre la Côte d'Ivoire et le Liberia, autour de la ville de \
Man. Cultivateurs de riz, ils vivent dans des villages indépendants, sans roi, où \
l'autorité se partage entre les anciens, les chefs de famille et des associations \
d'hommes. Les masques y tiennent une place essentielle : ce sont les manifestations \
d'esprits de la forêt, qui apparaissent au village pour juger les conflits, \
accompagner l'initiation des garçons, divertir, chanter, danser ou courir. Un masque \
peut changer de rôle au cours de sa vie, monter en prestige et finir comme un masque \
de juge respecté. Les sculpteurs dan, dont certains ont été célèbres de leur vivant, \
comme Zlan au début du XXᵉ siècle, travaillaient sur commande et étaient connus pour \
leur manière propre. Les masques dan sont entrés en grand nombre dans les collections \
occidentales au XXᵉ siècle, et les ethnologues Hans Himmelheber et Eberhard Fischer \
ont recueilli, auprès des Dan eux-mêmes, une partie de leur histoire et de leurs \
usages."""
style = """
Le style dan se reconnaît à ses masques ovales, aux volumes lisses et tendus, au front \
bombé, à la bouche pleine et aux yeux en fente ou ronds. La surface, noircie et polie, \
prend une patine profonde. Leur simplicité et leur équilibre ont fait des masques dan \
des modèles admirés par les artistes et les collectionneurs du XXᵉ siècle."""

[[artistes]]
nom = "Fang"
vie = "Gabon, Guinée équatoriale et sud du Cameroun, XIXᵉ siècle"
biographie = """
Les Fang sont un ensemble de peuples de langue bantoue établis dans les forêts du \
Gabon, de la Guinée équatoriale et du sud du Cameroun. Au XIXᵉ siècle, ils migrent \
vers le sud et l'ouest et atteignent la région de l'estuaire du Gabon et de l'Ogooué, \
où les explorateurs et les commerçants européens les rencontrent. Leur société, sans \
pouvoir central, repose sur des lignages dont l'unité est garantie par le culte des \
ancêtres, le byeri : les crânes et les os des défunts importants sont conservés dans \
des boîtes en écorce, surmontées de statues ou de têtes protectrices. Plusieurs \
groupes, comme les Betsi, les Ntumu ou les Okak, ont chacun leur style. Avec la \
colonisation française et la christianisation, à partir de la fin du XIXᵉ siècle, le \
culte du byeri est combattu et décline ; de nombreuses sculptures sont détruites ou \
vendues. Les Fang ont aussi des masques, comme ceux de l'association ngil, qui rendait \
la justice. Arrivées à Paris au début du XXᵉ siècle, les sculptures fang comptent \
parmi celles qui ont le plus frappé les artistes de l'avant-garde, Derain, Vlaminck ou \
Picasso."""
style = """
La sculpture fang cherche l'équilibre entre des volumes pleins : grand front bombé, \
visage concave en forme de cœur, bouche avancée, membres puissants. La surface, noire \
et luisante, est nourrie d'huile au fil des rites. Les sculpteurs recherchent une \
impression de calme et de maîtrise de soi, qualités que les Fang attribuaient aux \
ancêtres."""

[[artistes]]
nom = "Māori"
vie = "Aotearoa – Nouvelle-Zélande, XIIIᵉ siècle – aujourd'hui"
biographie = """
Les Māori sont le peuple polynésien qui s'est installé en Nouvelle-Zélande, qu'ils \
appellent Aotearoa, vers le XIIIᵉ siècle, au terme de longues navigations en pirogue \
depuis la Polynésie orientale. Organisés en tribus, les iwi, et en clans, ils \
développent dans ces îles froides une culture originale : grandes maisons de réunion \
sculptées, pirogues de guerre, tatouage du visage, le moko, tissage du lin, armes et \
parures de jade. La pierre verte, le pounamu, est l'une des matières les plus \
précieuses ; elle sert à faire des herminettes, des massues et des pendentifs. Le \
premier Européen à atteindre ces côtes est le Hollandais Abel Tasman en 1642, puis \
James Cook en 1769. Au XIXᵉ siècle arrivent les baleiniers, les missionnaires et les \
colons ; en 1840, le traité de Waitangi place le pays sous souveraineté britannique, \
et les guerres et la perte des terres qui suivent bouleversent la société māori. Les \
objets anciens, devenus des taonga, des trésors, sont aujourd'hui au cœur des demandes \
de retour et de la renaissance culturelle māori."""
style = """
L'art māori couvre les surfaces de spirales, de courbes et de motifs répétés, sculptés \
dans le bois, l'os ou la pierre. Les figures humaines, souvent stylisées à l'extrême, \
représentent des ancêtres et portent le mana de ceux qui les ont possédées. Le travail \
du jade, lent et patient, donne des formes pleines, polies jusqu'à la transparence."""

[[artistes]]
nom = "Elema, golfe de Papouasie"
vie = "Côte du golfe de Papouasie (Papouasie-Nouvelle-Guinée), XIXᵉ – début du XXᵉ siècle"
biographie = """
Les Elema vivent sur la côte est du golfe de Papouasie, au sud de la grande île de \
Nouvelle-Guinée, dans une région de deltas, de mangroves et de plages, autour de la \
baie d'Orokolo. Leurs villages s'organisent autour de grandes maisons des hommes, les \
eravo, aux façades très hautes, où les garçons sont initiés et où l'on garde les \
objets sacrés, dont les planches d'esprit. La vie religieuse y était rythmée par de \
grands cycles de cérémonies, qui pouvaient durer des années et se terminaient par la \
sortie de dizaines de masques immenses, les hevehe, faits d'écorce battue peinte \
tendue sur une armature de rotin. Au début du XXᵉ siècle, la région est placée sous \
administration australienne ; les missions et les changements de la vie économique \
font reculer, puis disparaître, ces grands cycles au cours du XXᵉ siècle. \
L'anthropologue Francis Edgar Williams les a décrites en détail dans son livre Drama \
of Orokolo, paru en 1940. Beaucoup d'objets elema sont alors partis vers les musées \
d'Australie, d'Europe et d'Amérique."""
style = """
L'art elema associe la sculpture en faible relief, la gravure et la peinture. Ses \
figures, très stylisées, se réduisent à un visage aux grands yeux cernés, un nez \
saillant et une bouche dentée, entourés de chevrons et de zigzags. Les couleurs, \
rouge, blanc et noir, sont tirées de la terre et du charbon."""

[[artistes]]
nom = "Olmèques"
vie = "Côte du golfe du Mexique (Veracruz et Tabasco), vers 1500–400 av. J.-C."
biographie = """
Les Olmèques sont la plus ancienne des grandes civilisations de la Mésoamérique. Ils \
vivent dans les basses terres humides et marécageuses du sud du golfe du Mexique, dans \
les actuels États de Veracruz et de Tabasco. Nous ignorons le nom qu'ils se donnaient \
: celui d'Olmèques, « gens du pays du caoutchouc », leur a été attribué par les \
archéologues d'après un terme aztèque. Vers 1200 avant J.-C., San Lorenzo devient un \
grand centre, avec ses terrasses et ses monuments de basalte, dont des têtes \
colossales de souverains hautes de plus de deux mètres. Vers 900 avant J.-C., La Venta \
lui succède, avec sa pyramide de terre et ses offrandes enterrées de jade et de \
serpentine. Les Olmèques font venir de très loin des pierres vertes, de l'obsidienne \
et des coquillages, et leurs images se diffusent dans une grande partie du Mexique. \
Vers 400 avant J.-C., La Venta est abandonnée. Mais beaucoup de traits olmèques, le \
culte des pierres vertes, le jeu de balle, certaines divinités, se retrouvent chez les \
Mayas et les peuples qui ont suivi."""
style = """
L'art olmèque est un art de la masse et de la pierre dure : têtes colossales de \
basalte, haches, masques et figurines de jade poli. Les visages ont des traits pleins, \
des paupières lourdes et une bouche épaisse aux coins tombants, parfois mêlés à des \
traits de jaguar. Leur gravité et leur perfection technique ont fait des jades \
olmèques des objets de prestige jusqu'à l'époque aztèque."""

[[artistes]]
nom = "Tairona"
vie = "Sierra Nevada de Santa Marta (nord de la Colombie), vers 900–1600"
biographie = """
Les Tairona occupaient la Sierra Nevada de Santa Marta, massif isolé du nord de la \
Colombie qui s'élève en quelques dizaines de kilomètres du bord de la mer des Caraïbes \
jusqu'à des sommets enneigés de plus de 5 000 mètres. Entre le Xᵉ et le XVIᵉ siècle, \
ils y bâtissent des centaines de villages et de petites villes, avec des terrasses, \
des escaliers, des canaux et des chemins dallés de pierre, dont le plus célèbre est \
Teyuna, la « Ville perdue ». Agriculteurs, ils cultivent le maïs, le manioc et les \
fruits sur les pentes et commercent avec la côte. Leurs orfèvres produisent \
pendentifs, ornements de nez et de lèvres, perles et figurines d'or et de tumbaga. À \
partir de 1525, la fondation de Santa Marta par les Espagnols ouvre une longue période \
de conflits ; les Tairona, vaincus à la fin du XVIᵉ siècle, se replient dans les \
hauteurs. Leurs descendants, les Kogi, les Arhuaco, les Wiwa et les Kankuamo, vivent \
toujours dans la Sierra et y maintiennent leurs traditions."""
style = """
L'orfèvrerie tairona se reconnaît à ses figures humaines trapues, couronnées de \
coiffes énormes peuplées d'oiseaux et de spirales, et à l'usage de fils d'or tressés \
imités dans la cire. Fondue à la cire perdue, souvent en tumbaga dorée en surface, \
elle compte parmi les plus inventives de l'Amérique ancienne, à côté de celles des \
Muisca, des Quimbaya ou des Sinú."""

[[artistes]]
nom = "Lakota"
vie = "Grandes Plaines d'Amérique du Nord (Dakotas, Nebraska, Wyoming, Montana), XVIIIᵉ siècle – aujourd'hui"
biographie = """
Les Lakota sont la plus occidentale des trois grandes divisions de la nation que les \
Européens ont appelée Sioux, aux côtés des Dakota et des Nakota. Venus de la région \
des Grands Lacs, ils s'installent au XVIIIᵉ siècle dans les Grandes Plaines, adoptent \
le cheval et vivent de la chasse au bison, en suivant les troupeaux. Organisés en sept \
tribus, dont les Oglala et les Sicangu, ils font des Black Hills leur territoire \
sacré. Au XIXᵉ siècle, l'avancée des colons, des chemins de fer et de l'armée des \
États-Unis les entraîne dans une suite de guerres : sous la conduite de chefs comme \
Red Cloud, Sitting Bull et Crazy Horse, ils remportent des victoires, dont celle de \
Little Bighorn en 1876. Mais la destruction des bisons et la perte des Black Hills les \
contraignent à vivre dans des réserves, où leur religion et leur langue sont \
combattues. En décembre 1890, le massacre de Wounded Knee marque la fin de cette \
période. Les Lakota vivent aujourd'hui surtout dans les réserves du Dakota du Sud et \
du Nord, comme Pine Ridge et Standing Rock."""
style = """
L'art lakota est d'abord un art du vêtement et des objets du quotidien : peaux \
peintes, broderies de piquants de porc-épic puis de perles de verre, aux motifs \
géométriques de losanges, de triangles et de croix. Les femmes en étaient les grandes \
artistes ; les hommes peignaient les récits de leurs exploits sur les peaux et les \
chemises."""
