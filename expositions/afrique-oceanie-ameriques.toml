#  EXPOSITION « ARTS D'AFRIQUE, D'OCÉANIE ET DES AMÉRIQUES » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/afrique-oceanie-ameriques/).
#  Le nom du fichier donne l'adresse de l'exposition sur le site :
#  /afrique-oceanie-ameriques.
#
#  Les objets sont présentés en vitrine (cadre = « vitrine »). Les photographies
#  viennent des programmes d'accès ouvert (CC0) du Metropolitan Museum of Art et
#  du Cleveland Museum of Art, sauf celle de la tête d'Ifé (CC BY-SA, créditée).
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
