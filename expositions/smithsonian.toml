# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "The Oxbow (La Boucle du Connecticut)"
artiste = "Thomas Cole"
annee = "1836"
image = "oxbow.jpg"
technique = "Huile sur toile, 130,8 × 193 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Après l'orage, la rivière dessine une boucle : d'un côté la forêt sauvage, de l'autre les champs cultivés."
description = """
Depuis le sommet du mont Holyoke, dans le Massachusetts, le regard plonge sur la vallée \
du Connecticut. La toile se partage en deux. À gauche, une forêt sombre et un arbre \
foudroyé, aux branches cassées, s'accrochent à l'escarpement, tandis que l'orage \
s'éloigne en lâchant encore des rideaux de pluie sur les collines. À droite, sous un \
ciel qui se dégage, la rivière décrit une large boucle au milieu de champs cultivés, de \
pâturages et de bosquets ; de minces fumées montent des fermes et de petits bateaux \
glissent sur l'eau. Au premier plan, presque caché parmi les rochers, un peintre \
minuscule, coiffé d'un chapeau, est assis devant son chevalet et se retourne vers nous \
; près de lui sont posés une ombrelle et un carton à dessins. La diagonale de l'orage \
et celle de la colline conduisent l'œil de l'ombre vers la lumière."""
evocation = """
On lit souvent le tableau comme un dialogue entre deux Amériques : la nature sauvage, \
sublime et menaçante, et le paysage domestiqué par les colons, paisible et prospère. \
Cole ne tranche pas franchement. Dans ses écrits, il célèbre la beauté des étendues \
vierges et s'inquiète de les voir défrichées à grande vitesse ; certains historiens \
voient donc dans la vallée cultivée une promesse, d'autres le début d'une perte. \
L'orage qui passe peut figurer un moment de bascule, celui d'un pays qui choisit sa \
voie. En se représentant au travail, au point de jonction des deux mondes, le peintre \
revendique son rôle de témoin et d'interprète du territoire, à une époque où les jeunes \
États-Unis cherchent dans leurs paysages une grandeur comparable aux ruines et aux \
cathédrales de l'Europe."""
histoire = """
Cole peint The Oxbow en 1835-1836, alors qu'il travaille au Cours de l'Empire, le grand \
cycle de cinq toiles commandé par le négociant new-yorkais Luman Reed. Il destine ce \
paysage de grand format à l'exposition annuelle de la National Academy of Design, à New \
York, et choisit un site déjà célèbre : le méandre vu du mont Holyoke était l'une des \
étapes du tourisme pittoresque en Nouvelle-Angleterre, reproduit dans les guides et les \
gravures. La toile est exposée à l'Académie en 1836, l'année même où Cole publie son « \
Essai sur le paysage américain », plaidoyer pour la beauté propre des sites du Nouveau \
Monde. Le titre complet, très descriptif, précise qu'il s'agit d'une vue prise après un \
orage. L'œuvre passe ensuite par des collections privées avant d'être offerte au \
Metropolitan Museum of Art en 1908 par Mrs. Russell Sage."""
facture = """
Cole oppose deux manières de peindre : à gauche, des empâtements vigoureux, des troncs \
tordus et des verts sombres presque noirs ; à droite, une peinture plus lisse, aux \
verts tendres et aux ocres dorés, où les champs sont détaillés à la pointe du pinceau. \
Le format panoramique et le point de vue surélevé reprennent la tradition des vues \
topographiques et des paysages européens, de Claude Lorrain à Turner, que Cole avait \
étudiés lors de son voyage de 1829-1832. La lumière, qui troue les nuages au-dessus de \
la vallée, unifie la composition et dramatise le passage d'un monde à l'autre."""
details = [
  "En bas, au centre, le peintre lui-même, minuscule, assis devant son chevalet.",
  "À gauche, l'arbre foudroyé aux branches brisées, emblème de la nature sauvage.",
  "Le rideau de pluie qui tombe encore sur les collines de gauche.",
  "Les minces fumées qui s'élèvent des fermes de la vallée.",
  "Sur la colline du fond, les parcelles défrichées où l'on a cru lire des lettres.",
]
themes = ["paysage", "nature sauvage", "orage", "rivière", "autoportrait"]
anecdote = """
Des historiens ont cru déchiffrer, dans les clairières de la colline du fond, des \
lettres hébraïques formant le mot Noé et, lues à l'envers comme depuis le ciel, \
Shaddaï, « le Tout-Puissant ». Une signature divine cachée dans le paysage ? \
L'hypothèse reste discutée."""
salle = 2
mur = "ouest"
position = -5
largeur = 1.9

[[oeuvres]]
titre = "Among the Sierra Nevada, California"
artiste = "Albert Bierstadt"
annee = "1868"
image = "sierra-nevada.jpg"
technique = "Huile sur toile, 183 × 305 cm"
collection = "Smithsonian American Art Museum, Washington"
note = "Peinte à Rome d'après ses croquis de l'Ouest : une vision grandiose, presque divine, des montagnes de Californie."
description = """
Au cœur d'un cirque de montagnes, un lac immobile reflète des sommets enneigés qui \
semblent surgir de la brume. La lumière perce un ciel d'orage, tombe en rayons obliques \
sur les falaises de granit et embrase le centre de la toile. À droite, une cascade \
dévale une paroi vertigineuse et se perd dans la vapeur ; à gauche, de grands arbres \
sombres encadrent la scène comme le rideau d'un théâtre. Au premier plan, sur la rive, \
des cerfs se sont arrêtés au bord de l'eau, et des oiseaux aquatiques se posent ou \
s'envolent à la surface. Aucune trace humaine : ni sentier, ni maison, ni voyageur. \
L'immense toile, large de plus de trois mètres, place le visiteur devant un panorama à \
la fois précis et impossible, tant tout y est réuni en un seul regard."""
evocation = """
Bierstadt compose une sorte de jardin d'Éden américain, une terre promise baignée d'une \
lumière presque religieuse. Les rayons qui percent les nuages ont souvent été lus comme \
le signe d'une bénédiction accordée à l'Ouest, au moment où les États-Unis achèvent la \
conquête du continent : le premier chemin de fer transcontinental est inauguré l'année \
suivante, en 1869. Le tableau exalte l'idée de « destinée manifeste », la conviction \
que la nation était appelée à s'étendre jusqu'au Pacifique. Mais il passe sous silence \
les peuples amérindiens qui vivaient dans ces vallées et en étaient chassés. On y voit \
aujourd'hui autant une célébration de la nature grandiose qu'une image idéalisée, \
presque publicitaire, d'un territoire offert aux colons et aux investisseurs."""
histoire = """
Bierstadt découvre la Sierra Nevada et la vallée de Yosemite en 1863, lors d'un long \
voyage vers l'Ouest avec l'écrivain Fitz Hugh Ludlow, et en rapporte de nombreuses \
études peintes sur le motif. Cinq ans plus tard, pendant un séjour en Europe, il \
compose dans son atelier de Rome cette vue imaginaire, assemblée à partir de ses \
croquis : aucun lieu réel ne correspond exactement à ce panorama. Avant de l'envoyer en \
Amérique, il l'expose en Europe, notamment à Londres et à Berlin, pour faire connaître \
l'Ouest américain au public européen et y asseoir sa réputation. La toile rejoint \
ensuite une collection privée américaine. Elle est léguée au Smithsonian American Art \
Museum en 1977 par Helen Huntington Hull, et compte depuis parmi les œuvres phares du \
musée."""
facture = """
Formé à Düsseldorf, Bierstadt applique la méthode de cette école : un dessin minutieux, \
une surface lisse où la touche disparaît, une précision qui va jusqu'aux reflets dans \
l'eau et aux silhouettes des animaux. Il combine ce réalisme du détail avec une mise en \
scène théâtrale : contre-jour, contrastes violents entre zones d'ombre et trouées de \
lumière, arbres en coulisse, sommets disposés comme un décor. Les tons chauds du \
centre, dorés et rosés, s'opposent aux bleus froids des montagnes et aux verts profonds \
des premiers plans. Le très grand format, pensé pour être exposé seul, participe à \
l'effet."""
details = [
  "La cascade, à droite, qui tombe d'une haute paroi dans un nuage de vapeur.",
  "Les cerfs arrêtés au bord du lac, au premier plan.",
  "Les rayons de soleil qui percent les nuages et frappent les falaises.",
  "Les oiseaux aquatiques qui rident la surface du lac.",
  "Le reflet presque parfait des montagnes dans l'eau.",
]
themes = ["montagne", "ouest américain", "lumière", "lac", "nature sauvage"]
anecdote = """
Le compagnon de voyage de Bierstadt en 1863, l'écrivain Fitz Hugh Ludlow, était marié à \
une certaine Rosalie. Le couple divorça peu après, et en 1866 Rosalie épousa le \
peintre, qui l'emmena l'année suivante dans son long séjour européen."""
salle = 2
mur = "ouest"
position = 0.5
largeur = 3.0

[[oeuvres]]
titre = "Niagara"
artiste = "Frederic Edwin Church"
annee = "1857"
image = "niagara.jpg"
technique = "Huile sur toile, 101,6 × 229,9 cm"
collection = "National Gallery of Art, Washington"
note = "Pas de rive au premier plan : le spectateur est au bord du vide, au-dessus des chutes."
description = """
Le spectateur se trouve suspendu au-dessus du vide, à l'endroit précis où l'eau \
bascule. Il n'y a ni rive, ni rocher, ni promeneur pour servir de repère : le premier \
plan est occupé par la nappe verte et blanche du fleuve qui glisse vers le précipice. \
Le Fer à cheval, la grande chute vue du côté canadien, dessine une vaste courbe qui \
s'enfonce vers le fond, jusqu'à l'horizon où se profile une rive lointaine, basse et \
boisée. Un immense nuage d'embruns monte de l'abîme et se mêle au ciel. À droite, un \
arc-en-ciel se forme dans la brume. Le format très allongé, plus de deux fois plus \
large que haut, étire la chute d'un bord à l'autre et donne au regard la sensation de \
balayer tout le paysage d'un seul mouvement."""
evocation = """
Au milieu du XIXᵉ siècle, Niagara est le grand symbole naturel des États-Unis, leur \
réponse aux monuments de l'Europe. Church en fait une expérience physique : sans terre \
ferme sous les pieds, le visiteur ressent le vertige et la puissance de l'eau, ce que \
l'époque appelait le sublime, mélange de crainte et d'émerveillement. L'arc-en-ciel, \
signe biblique de l'alliance entre Dieu et les hommes après le Déluge, a souvent été \
interprété comme une promesse adressée à la nation, dans une Amérique protestante qui \
voyait dans ses paysages la marque de la Création. On y a vu aussi une vision presque \
scientifique, fidèle au regard d'Alexander von Humboldt que Church admirait : la nature \
observée avec exactitude, mais saisie comme un tout vivant, en perpétuel mouvement."""
histoire = """
Church se rend à Niagara à plusieurs reprises en 1856 et multiplie les dessins et les \
esquisses à l'huile, sous tous les angles, avant de peindre la grande toile dans son \
atelier de New York au printemps 1857. Le tableau est présenté seul dans la galerie des \
marchands Williams, Stevens & Williams, et des milliers de visiteurs paient leur entrée \
pour le voir ; une chromolithographie en assure la diffusion. Il est ensuite exposé à \
Londres, où il est très remarqué, puis revient aux États-Unis. Présenté à l'Exposition \
universelle de Paris en 1867, il y obtient une médaille. La Corcoran Gallery of Art de \
Washington l'achète en 1876. À la fermeture de ce musée, en 2014, sa collection est \
dispersée, et Niagara rejoint la National Gallery of Art."""
facture = """
Church peint avec une précision presque photographique : on distingue la transparence \
de l'eau verte au bord de la chute, l'écume qui s'effiloche, la lumière qui traverse \
les embruns. Sa touche reste invisible, comme chez son maître Thomas Cole et les \
paysagistes de l'école de l'Hudson, mais il rompt avec leurs compositions encadrées \
d'arbres et de rochers. Le format panoramique, emprunté aux panoramas et aux vues \
topographiques, et la suppression du premier plan sont des choix audacieux. Les \
couleurs restent retenues, verts, blancs bleutés et gris dorés, pour que tout l'effet \
tienne au mouvement de l'eau et à la lumière."""
details = [
  "Le bord de la chute, au premier plan, où l'eau devient translucide en basculant.",
  "L'arc-en-ciel, à droite, qui naît dans la brume.",
  "Le nuage d'embruns qui se confond avec les nuages du ciel.",
  "La ligne lointaine de la rive, très basse, qui accentue l'immensité.",
]
themes = ["eau", "sublime", "paysage", "nation", "arc-en-ciel"]
anecdote = """
Dix ans plus tard, Church revint au sujet avec un tableau vertical, Les Chutes du \
Niagara vues du côté américain (1867), où la chute tombe cette fois de haut en bas de \
la toile. Il est conservé à la Scottish National Gallery, à Édimbourg."""
salle = 2
mur = "ouest"
position = 5.6
largeur = 2.2

[[oeuvres]]
titre = "Arrangement en gris et noir n° 1 (La Mère de l'artiste)"
artiste = "James McNeill Whistler"
annee = "1871"
image = "mere-whistler.jpg"
technique = "Huile sur toile, 144,3 × 162,4 cm"
collection = "Musée d'Orsay, Paris"
note = "Le peintre voulait une harmonie de gris et de noir ; le monde y a vu le portrait de toutes les mères."
description = """
Une vieille dame vêtue de noir est assise de profil, tournée vers la gauche, les mains \
posées sur ses genoux, tenant un mouchoir blanc. Elle porte une coiffe de dentelle \
blanche et des poignets de dentelle assortis. Ses pieds reposent sur un petit tabouret. \
Le décor est réduit à presque rien : un mur gris, une plinthe noire, un rideau sombre, \
à gauche, semé de motifs clairs, et, accroché au mur, un cadre au large passe-partout \
blanc contenant une estampe de l'artiste représentant la Tamise. La femme ne regarde \
pas le spectateur ; elle fixe un point devant elle, immobile. Les lignes horizontales \
et verticales du mur, du cadre et du rideau construisent un réseau de rectangles dans \
lequel la silhouette, au dos très droit, vient s'inscrire comme une forme sombre."""
evocation = """
Whistler voulait que l'on regarde ce tableau comme une composition de formes et de \
tons, à la manière d'une pièce de musique, d'où son titre d'« arrangement ». Il \
défendait l'art pour l'art et se moquait de ceux qui y cherchaient un sentiment. Le \
public y a pourtant vu tout autre chose : la dignité austère d'une mère âgée, sa \
patience, une forme de recueillement presque religieux. Anna McNeill Whistler, femme \
pieuse et rigoureuse, avait rejoint son fils à Londres pendant la guerre de Sécession. \
Avec le temps, l'œuvre est devenue une icône de la maternité, et même un symbole de \
l'Amérique pendant la crise des années 1930. Ce décalage entre l'intention du peintre \
et la lecture du public fait partie de son histoire et de sa célébrité."""
histoire = """
Le tableau est peint en 1871 dans la maison de Whistler à Chelsea, au bord de la \
Tamise. Selon le récit qui s'est transmis, la pose, d'abord prévue debout, se révéla \
trop fatigante pour Anna Whistler, âgée de plus de soixante ans, et fut remplacée par \
une pose assise. En 1872, l'œuvre est présentée à la Royal Academy de Londres, où elle \
manque d'être refusée. Whistler, souvent à court d'argent, la met plus tard en gage. En \
1891, grâce notamment à l'appui de Stéphane Mallarmé et de Georges Clemenceau, l'État \
français l'achète pour le musée du Luxembourg, consacré aux artistes vivants : pour \
Whistler, c'est une consécration. Le tableau passe ensuite au Louvre puis, en 1986, au \
musée d'Orsay. Il a beaucoup voyagé, notamment aux États-Unis en 1932-1934."""
facture = """
La palette est volontairement réduite aux gris, aux noirs et aux blancs, avec quelques \
tons chauds à peine perceptibles. Whistler pose une peinture très diluée, en couches \
fines et presque transparentes, qu'il essuie et reprend jusqu'à obtenir l'harmonie \
voulue. La composition, faite de plans plats et de rectangles imbriqués, doit beaucoup \
aux estampes japonaises que l'artiste collectionnait, comme le rideau à motifs, et à \
Velázquez, qu'il admirait pour ses noirs et ses gris. Le profil strict, découpé sur le \
mur, rappelle aussi la tradition des médailles et des silhouettes."""
details = [
  "Le mouchoir blanc que la vieille dame tient dans ses mains.",
  "Le petit tabouret sous ses pieds, qui l'éloigne du sol.",
  "Le rideau sombre à motifs, à gauche, inspiré des tissus japonais.",
  "Le cadre au mur : une eau-forte de Whistler représentant la Tamise.",
  "Les dentelles de la coiffe et des poignets, seules touches de blanc vif.",
]
themes = ["mère", "portrait", "harmonie", "gris", "japonisme"]
anecdote = """
En 1934, la poste des États-Unis émit pour la fête des Mères un timbre reproduisant le \
tableau, avec l'inscription « In memory and in honor of the mothers of America ». Le \
portrait de Mme Whistler devint alors une image nationale."""
salle = 3
mur = "ouest"
position = 0
largeur = 1.6

[[oeuvres]]
titre = "The Gross Clinic (La Clinique du docteur Gross)"
artiste = "Thomas Eakins"
annee = "1875"
image = "gross-clinic.jpg"
technique = "Huile sur toile, 243,8 × 198,1 cm"
collection = "Philadelphia Museum of Art et Pennsylvania Academy of the Fine Arts"
note = "Une opération dans l'amphithéâtre de Philadelphie : le chirurgien se retourne, le scalpel ensanglanté à la main."
description = """
Dans l'amphithéâtre du Jefferson Medical College de Philadelphie, le docteur Samuel D. \
Gross, cheveux gris en désordre, s'est interrompu en pleine opération pour s'adresser \
aux étudiants. Il tient un scalpel dans sa main droite, les doigts rougis de sang. \
Devant lui, sur la table, le patient, un jeune homme dont on ne voit guère que la \
cuisse ouverte et les pieds, est entouré par l'équipe : des assistants maintiennent \
l'incision écartée, un autre tient sur son visage un linge imbibé de chloroforme. À \
gauche, une femme en noir, sans doute une parente du malade, se protège les yeux d'un \
geste convulsif. Dans les gradins plongés dans la pénombre, des étudiants observent ; \
un assistant prend des notes. La lumière tombe d'une verrière et éclaire le front du \
chirurgien."""
evocation = """
Eakins fait du chirurgien un héros moderne, un homme de science au savoir sûr, dans la \
lignée de La Leçon d'anatomie du docteur Tulp de Rembrandt. Le contraste entre le calme \
du maître et l'effroi de la femme oppose la raison à l'émotion, la science à la peur. \
L'opération pratiquée, qui permettait de soigner une infection de l'os sans amputer la \
jambe, illustre les progrès de la chirurgie américaine, dont Philadelphie était un \
grand centre. Le réalisme cru du sang et de la chair a été reçu comme une provocation ; \
on y voit aujourd'hui l'affirmation de la vérité comme valeur suprême de la peinture, \
et l'ambition d'Eakins de montrer la vie moderne de sa ville, ses savants et ses \
institutions, sans rien embellir."""
histoire = """
Eakins, qui avait suivi des cours d'anatomie au Jefferson Medical College, peint ce \
grand tableau en 1875 dans l'espoir de le présenter à l'Exposition universelle du \
Centenaire, organisée à Philadelphie en 1876. Le jury de la section des beaux-arts \
l'écarte, sans doute choqué par sa crudité ; la toile est finalement accrochée dans le \
pavillon médical de l'armée, parmi le matériel hospitalier. La critique est partagée : \
certains saluent la puissance du portrait, d'autres sont horrifiés. En 1878, \
l'association des anciens élèves du Jefferson Medical College l'achète pour une somme \
modeste et l'offre à l'école, où elle reste plus d'un siècle. Quand l'université décide \
de la vendre, en 2006, une mobilisation publique permet au Philadelphia Museum of Art \
et à la Pennsylvania Academy of the Fine Arts de l'acquérir ensemble."""
facture = """
Eakins construit la scène en clair-obscur, à la manière de Rembrandt et des peintres \
espagnols, Velázquez et Ribera, qu'il avait étudiés au Prado. Le fond est presque noir, \
et la lumière, concentrée sur le front de Gross, sa main et la plaie, dessine une \
pyramide lumineuse. Sa formation auprès de Jean-Léon Gérôme, à Paris, se lit dans la \
précision du dessin et la solidité des volumes. Fin connaisseur de l'anatomie et de la \
perspective, il préparait ses compositions par des études rigoureuses. Le rouge du \
sang, seule couleur vive dans une gamme de bruns et de noirs, attire aussitôt le regard \
sur la main du chirurgien."""
details = [
  "Le scalpel et les doigts ensanglantés de Gross, au centre de la lumière.",
  "La femme en noir, à gauche, qui cache son visage d'une main crispée.",
  "Tout à droite, parmi les spectateurs, Eakins s'est représenté en train de dessiner.",
  "Ni gants ni blouses : en 1875, les chirurgiens opèrent en redingote.",
  "Le linge de chloroforme posé sur le visage du patient.",
]
themes = ["médecine", "science", "réalisme", "portrait", "philadelphie"]
anecdote = """
En 2006, l'université Thomas Jefferson accepta de vendre le tableau 68 millions de \
dollars à la National Gallery of Art de Washington et au musée Crystal Bridges, en \
Arkansas. Philadelphie réunit la somme dans le délai accordé pour garder l'œuvre dans \
la ville."""
salle = 3
mur = "nord"
position = -4
largeur = 2.0

[[oeuvres]]
titre = "Madame X (Madame Pierre Gautreau)"
artiste = "John Singer Sargent"
annee = "1883–1884"
image = "madame-x.jpg"
technique = "Huile sur toile, 208,6 × 109,9 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Le portrait fit scandale au Salon : Sargent quitta Paris. Il le tenait pour le meilleur qu'il ait peint."
description = """
Une jeune femme se tient debout, le corps tourné vers nous et la tête de profil. Elle \
porte une robe de satin noir au décolleté profond, retenue sur les épaules par de \
minces bretelles ornées de pierres. Sa peau, d'une blancheur nacrée, contraste \
violemment avec le noir du tissu et le fond brun et chaud. Sa main droite s'appuie sur \
un guéridon, le poignet retourné dans un geste tendu ; la gauche tient un éventail \
replié. Dans ses cheveux relevés brille un petit diadème en forme de croissant de lune. \
Aucun autre accessoire, aucun décor ne vient distraire le regard : tout repose sur la \
silhouette, le contraste du noir et du blanc et la ligne du profil, net comme celui \
d'une médaille."""
evocation = """
Sargent voulait peindre une beauté célèbre du Paris mondain, Virginie Amélie Avegno, \
née à La Nouvelle-Orléans et épouse du banquier Pierre Gautreau, comme lui une \
Américaine installée en France. Le portrait célèbre une élégance froide et sculpturale, \
presque abstraite. Le croissant de lune évoque Diane, la chasseresse de la mythologie, \
déesse altière et inaccessible. Mais le Paris de 1884 y a vu une image d'arrogance et \
de séduction affichée, celle d'une femme qui fait de sa beauté un spectacle. Le tableau \
dit l'ambition d'un jeune peintre de vingt-huit ans qui voulait frapper un grand coup \
au Salon, et la frontière étroite qui séparait l'audace du scandale dans la bonne \
société de la Troisième République."""
histoire = """
Sargent sollicite lui-même son modèle, qui accepte de poser ; les séances ont lieu à \
Paris et, à l'été 1883, dans la propriété des Gautreau à Paramé, en Bretagne. Présenté \
au Salon de 1884 sous le titre « Portrait de Mme *** », le tableau déclenche moqueries \
et indignation. On critique la pâleur de la peau, la pose, et surtout la bretelle \
droite, alors peinte glissée sur le bras, jugée indécente. La mère du modèle demande à \
Sargent de retirer l'œuvre, ce qu'il refuse. Il repeint ensuite la bretelle sur \
l'épaule et garde la toile dans son atelier. Les commandes parisiennes se raréfiant, il \
s'installe à Londres en 1886. En 1916, il vend le tableau au Metropolitan Museum of Art \
sous un titre qui tait le nom du modèle : Madame X."""
facture = """
Élève de Carolus-Duran, Sargent maîtrise une peinture rapide et fluide, héritée de \
Velázquez et de Frans Hals. Il retient ici sa virtuosité : la touche reste souple dans \
la robe et le fond, mais la chair est traitée en surfaces lisses, d'un blanc teinté de \
gris et de lilas, qui évoque la poudre dont la jeune femme se couvrait. Le cadrage \
vertical et étroit, la silhouette découpée sur un fond uni rappellent les portraits en \
pied de Velázquez et de Manet. Le contour est d'une netteté presque graphique."""
details = [
  "Le croissant de lune en diamants, dans la chevelure, attribut de Diane.",
  "La bretelle droite, repeinte sur l'épaule après le scandale du Salon.",
  "La main droite crispée sur le bord du guéridon.",
  "L'oreille légèrement rosée, seule touche de couleur dans un visage très pâle.",
  "L'éventail replié, presque invisible contre le satin noir.",
]
themes = ["portrait", "élégance", "scandale", "paris", "mode"]
anecdote = """
Sargent peignit aussi une seconde version du portrait, laissée inachevée, qu'il garda \
dans son atelier. Elle fut achetée en 1925, l'année de sa mort, par la Tate, à Londres, \
où elle se trouve toujours."""
salle = 3
mur = "nord"
position = 3.5
largeur = 1.1

[[oeuvres]]
titre = "The Child's Bath (Le Bain)"
artiste = "Mary Cassatt"
annee = "1893"
image = "bain-enfant.jpg"
technique = "Huile sur toile, 100,3 × 66,1 cm"
collection = "Art Institute of Chicago"
note = "Vue d'en haut, comme une estampe japonaise : la tendresse d'un geste quotidien."
description = """
Une femme assise tient sur ses genoux un petit enfant enveloppé à demi d'une serviette \
blanche et lui lave les pieds dans une cuvette posée sur le sol. Toutes deux têtes \
inclinées, elles regardent l'eau ; la main de la femme entoure le pied de l'enfant, qui \
s'appuie d'une main sur son genou. La femme porte une ample robe à larges rayures \
claires et colorées. Autour d'elles, l'intimité d'une chambre : un tapis à motifs \
floraux, une cruche posée par terre, à droite, et, dans le haut du tableau, un meuble \
peint. Le point de vue, très élevé, plonge sur la scène, si bien que le sol semble se \
relever comme une paroi et que les deux figures occupent presque toute la hauteur de la \
toile."""
evocation = """
Mary Cassatt a consacré une grande partie de son œuvre aux femmes et aux enfants, non \
comme des allégories sentimentales, mais comme des scènes observées de la vie \
quotidienne. Ici, la tendresse passe par un geste simple et concentré, partagé dans le \
silence. Les regards convergent vers le même point, l'eau de la cuvette, et créent une \
intimité dont le spectateur est presque exclu. On y a vu une vision moderne de la \
maternité, faite d'attention et de soin plutôt que d'idéalisation religieuse, à \
l'opposé des Vierges à l'Enfant de la tradition. Certains historiens soulignent aussi \
l'actualité du thème du bain, à une époque où l'hygiène et l'éducation des jeunes \
enfants devenaient des préoccupations nouvelles pour les familles bourgeoises."""
histoire = """
Cassatt peint The Child's Bath en 1893, l'année où elle réalise la grande peinture \
murale « La Femme moderne » destinée au Woman's Building de l'Exposition universelle de \
Chicago, et où la galerie Durand-Ruel lui consacre à Paris une importante exposition \
personnelle. Installée en France depuis 1874, liée à Degas qui l'avait invitée à \
exposer avec les impressionnistes, elle est alors au sommet de sa carrière. L'année \
1890 avait été décisive : la grande exposition d'estampes japonaises de l'École des \
beaux-arts l'avait poussée à renouveler sa manière, d'abord dans la gravure en \
couleurs, puis dans la peinture. Le tableau est acquis par l'Art Institute of Chicago \
en 1910, du vivant de l'artiste, et compte depuis parmi les œuvres les plus populaires \
du musée."""
facture = """
La composition doit beaucoup aux estampes japonaises d'Utamaro et de ses contemporains \
: vue plongeante, sol redressé, motifs décoratifs juxtaposés, absence d'horizon, \
figures serrées dans le cadre. Les rayures de la robe, le tapis fleuri et le meuble \
peint se répondent comme des surfaces plates de couleur, tandis que la chair de \
l'enfant est modelée avec douceur. La touche, libre et visible dans les tissus, reste \
impressionniste, mais le dessin, ferme et précis, montre l'influence de Degas. Les \
couleurs claires et fraîches traduisent la lumière douce d'une chambre."""
details = [
  "Les deux têtes inclinées vers l'eau, qui regardent le même point.",
  "Le pied de l'enfant tenu dans la main de la femme, au-dessus de la cuvette.",
  "La cruche posée sur le tapis, à droite.",
  "Les rayures de la robe, qui contrastent avec la peau nue de l'enfant.",
  "Le tapis à motifs, vu de haut, qui remonte jusqu'au milieu du tableau.",
]
themes = ["maternité", "enfance", "intimité", "japonisme", "quotidien"]
anecdote = """
Mary Cassatt ne se maria jamais et n'eut pas d'enfants. Pour ses scènes de maternité, \
elle faisait poser des modèles, souvent des femmes et des enfants de son entourage ou \
de son voisinage, qui n'étaient pas forcément mère et enfant dans la vie."""
salle = 3
mur = "est"
position = 0
largeur = 0.9

[[oeuvres]]
titre = "The Gulf Stream"
artiste = "Winslow Homer"
annee = "1899"
image = "gulf-stream.jpg"
technique = "Huile sur toile, 71,4 × 124,8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Un marin seul sur une barque démâtée, cerné par les requins, une trombe à l'horizon."
description = """
En pleine mer, un homme noir, torse nu, est à demi allongé sur le pont d'une petite \
barque désemparée, qui gîte dangereusement. Le mât est brisé ; des tiges de canne à \
sucre s'échappent de la cale. Autour du bateau, des requins tournent dans les vagues \
bleu sombre, gueule ouverte. L'homme ne les regarde pas : il fixe le large, l'air las \
ou résigné. À droite, à l'horizon, une trombe marine s'élève entre la mer et les nuages \
; tout au loin, à gauche, presque invisible, passe un voilier. Quelques poissons \
volants gisent sur le pont. La houle, puissante, soulève la barque et ferme l'horizon, \
isolant le marin au milieu de l'océan, sans terre ni secours en vue."""
evocation = """
Homer peint une méditation sur la condition humaine face à une nature indifférente : un \
homme seul, privé de tout moyen d'agir, que menacent à la fois les requins, la tempête \
et la dérive. Le choix d'un marin noir, à la fin du XIXᵉ siècle, a suscité de \
nombreuses lectures. On y a vu une évocation de l'histoire de l'esclavage et de la \
traite atlantique, et de la situation précaire des Afro-Américains après l'échec de la \
Reconstruction. D'autres y lisent un tableau plus personnel : Homer, vieillissant, \
venait de perdre son père en 1898, et l'œuvre prend des accents de méditation sur la \
mort. La force tranquille du personnage, qui fait face sans céder à la panique, a aussi \
été soulignée par les historiens."""
histoire = """
Le tableau naît de plusieurs séjours d'Homer dans les Caraïbes et en Floride, notamment \
aux Bahamas en 1884-1885 et en 1898-1899. Il y avait peint à l'aquarelle des marins \
noirs, des requins et des barques, dont certaines feuilles annoncent directement la \
composition. De retour dans son atelier de Prouts Neck, sur la côte du Maine, il \
réalise la grande toile en 1899. Exposée à partir de 1900, notamment à la Pennsylvania \
Academy of the Fine Arts, elle intrigue et dérange par la dureté de son sujet, et peine \
à trouver un acheteur. En 1906, le jury de l'exposition de la National Academy of \
Design recommande à l'unanimité son achat au Metropolitan Museum of Art, qui l'acquiert \
la même année."""
facture = """
Homer, venu de l'illustration et de l'aquarelle, peint ici avec une touche large et \
énergique. Les vagues sont construites par grands coups de brosse, bleus profonds, \
verts et blancs d'écume. La composition repose sur une diagonale instable : la barque \
penchée, le pont incliné, le corps de l'homme qui suit la pente. Les rouges et les \
bruns du bateau et de la canne à sucre tranchent sur les bleus de l'eau. La trombe et \
le voilier lointain sont réduits à quelques touches, pour que tout converge vers \
l'homme et les requins."""
details = [
  "Les tiges de canne à sucre qui débordent de la cale.",
  "Les poissons volants échoués sur le pont.",
  "La trombe marine qui s'élève à l'horizon, à droite.",
  "Le voilier minuscule, tout au fond à gauche, trop loin pour porter secours.",
  "Le tronçon du mât brisé.",
]
themes = ["mer", "solitude", "danger", "mort", "caraïbes"]
anecdote = """
Agacé par les questions sur le sort du marin, Homer écrivit à son marchand que l'on \
pouvait rassurer les curieux : l'homme ne mourut pas de faim, ne fut pas dévoré par les \
requins ni frappé par la trombe, et fut sauvé par un navire qui ne figure pas sur le \
tableau."""
salle = 2
mur = "nord"
place = 2
largeur = 1.4

