# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « SMITHSONIAN » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  tableaux dans public/tableaux/<nom>/ (ici public/tableaux/smithsonian/) + les
#  modèles 3D de ses sculptures dans modeles/. Le nom du fichier donne l'adresse
#  de l'exposition sur le site : /smithsonian.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 8
nom_court = "Smithsonian"
couleur = "#8a3b2e"
titre = "L'Amérique au XIXᵉ siècle, peinture et sculpture"
artiste = "Peintres et sculpteurs américains"
dates = "1836–1899"
accroche = "Exposition virtuelle · Musées du Smithsonian"
introduction = """
Un musée inspiré de ceux du Smithsonian à Washington : une grande cour couverte \
où trône le George Washington de Greenough, les paysages de l'Hudson et de la \
Sierra Nevada, les portraits de Whistler, Sargent et Eakins, les sculptures de \
John Rogers, et un cabinet asiatique comme à la Freer Gallery. Les sculptures sont \
des scans 3D du Smithsonian, en libre accès."""
vitrine = "mere-whistler.jpg"

# ─── Le plan du musée ────────────────────────────────────────────────────────
# Inspiré du Smithsonian American Art Museum : une cour couverte au centre, des
# galeries tout autour, et un cabinet pour l'art asiatique. x et z : le centre de
# la salle (x vers l'est, z vers le sud), en mètres ; une porte se déclare d'un
# seul côté.

[[salles]]
nom = "La cour couverte"
theme = "Sous la verrière, la statue colossale de George Washington, sculptée à Florence pour le Capitole."
murs = "#ece6da"
x = 0
z = 0
largeur = 20
profondeur = 20
hauteur = 12
portes = ["sud", "ouest", "nord", "est"]

[[salles]]
nom = "Les paysages américains"
theme = "1836–1868 : l'Hudson, les chutes du Niagara et la Sierra Nevada, une nature grandiose et sauvage."
murs = "#e4e6dc"
x = -15
z = 0
largeur = 10
profondeur = 16
hauteur = 6

[[salles]]
nom = "Les portraits"
theme = "1871–1899 : la mère de Whistler, Madame X, la clinique du docteur Gross, et la mer de Winslow Homer."
murs = "#e6dfd8"
x = 0
z = -16
largeur = 16
profondeur = 12
hauteur = 6

[[salles]]
nom = "Les sculptures de genre"
theme = "1864–1869 : les groupes en plâtre de John Rogers, et le masque de Lincoln moulé sur le vif."
murs = "#e3e3e6"
x = 15
z = 0
largeur = 10
profondeur = 12
hauteur = 5
portes = ["nord"]

[[salles]]
nom = "Le cabinet asiatique"
theme = "VIᵉ siècle : un Bouddha chinois, dont la robe raconte les mondes de l'existence, comme à la Freer Gallery."
murs = "#d9d2c4"
x = 15
z = -11
largeur = 10
profondeur = 10
hauteur = 5

