[exposition]
ordre = 110
nom_court = "Smithsonian"
mouvement = "Art américain du XIXᵉ siècle"
cadre = "dore"
couleur = "#8a3b2e"
titre = "L'Amérique au XIXᵉ siècle, peinture et sculpture"
artiste = "Peintres et sculpteurs américains"
dates = "1836–1899"
accroche = "Exposition virtuelle · Musées du Smithsonian"
introduction = """
Un musée inspiré de ceux du Smithsonian à Washington : une grande cour couverte \
où trône le George Washington de Greenough, les paysages de l'Hudson et de la \
Sierra Nevada, les portraits de Whistler, Sargent et Eakins, les sculptures de \
John Rogers, et un cabinet asiatique comme à la Freer Gallery. Les sculptures sont \
des scans 3D du Smithsonian, en libre accès."""
vitrine = "mere-whistler.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Smithsonian American Art Museum"
ville = "Washington, États-Unis"
construction = "1836–1867"
presentation = """
Le Smithsonian American Art Museum occupe, avec la National Portrait Gallery, l'ancien \
Patent Office de Washington, où l'on déposait jadis les brevets d'invention. Commencé en \
1836 et achevé en 1867, ce vaste quadrilatère néoclassique à portiques, d'une \
architecture inspirée des temples grecs, est l'un des plus anciens édifices publics de \
la capitale. Pendant la guerre de Sécession, il sert d'hôpital, et Walt Whitman vient y \
veiller les blessés ; en 1865, on y donne le bal de la seconde investiture de Lincoln. \
Menacé de démolition dans les années 1950, il est sauvé et confié au Smithsonian, qui y \
ouvre ses deux musées en 1968. Depuis 2007, sa cour intérieure, la Kogod Courtyard, est \
couverte d'une verrière ondulante dessinée par Foster and Partners. Le musée retrace \
l'art américain depuis l'époque coloniale, des paysages de l'Hudson River School aux \
œuvres contemporaines."""
ici = """
ARTEON en retient le plan autour d'une cour. La cour couverte, un carré de 20 mètres de \
côté, haut de 12 mètres, sous une verrière, accueille le visiteur par le sud, au pied du \
George Washington de Greenough. Trois salles l'entourent : à l'ouest, Les paysages \
américains, aux murs vert pâle ; au nord, Les portraits, aux murs rosés, toutes deux \
hautes de 6 mètres ; à l'est, Les sculptures de genre, plus basses, aux murs gris perle. \
Une porte au nord de cette dernière ouvre sur la plus petite salle, Le cabinet \
asiatique, aux murs couleur sable, où s'achève la visite."""

