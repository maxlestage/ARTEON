[[sculptures]]
titre = "George Washington"
artiste = "Horatio Greenough"
annee = "1840"
modele = "washington.stl"
technique = "Marbre"
collection = "National Museum of American History, Washington"
note = "Commandé pour la rotonde du Capitole : Washington torse nu, en Zeus antique. Le public, choqué, le fit déplacer."
description = """
Assis sur un trône massif, George Washington est représenté torse nu, comme un dieu de \
l'Antiquité. Un manteau drapé couvre ses jambes et retombe sur le siège ; il est \
chaussé de sandales. Son bras droit est levé, l'index pointé vers le ciel, tandis que \
de la main gauche il présente une épée au fourreau, la poignée tournée vers le \
spectateur. Le visage grave est celui du héros de l'Indépendance, mais le corps \
puissant est celui du Jupiter des sculpteurs antiques. Les côtés du trône sont ornés de \
bas-reliefs : Apollon conduisant le char du Soleil, et Hercule enfant étouffant les \
serpents envoyés contre lui. À l'arrière, de petites figures représentent Christophe \
Colomb et un Amérindien. La statue dépasse trois mètres de hauteur."""
evocation = """
Greenough voulait donner à la jeune république un monument digne de l'Antiquité, en \
représentant son fondateur sous les traits de Zeus, d'après la statue colossale que \
Phidias avait sculptée pour Olympie et que l'on ne connaissait plus que par des \
descriptions. Le geste a été lu comme un message politique : la main levée désigne la \
source supérieure du pouvoir, tandis que l'épée tendue, poignée en avant, rappelle que \
Washington rendit son commandement et renonça au pouvoir, comme le Romain Cincinnatus. \
Les reliefs du trône associent l'Amérique à la lumière et à la force naissante. Mais \
pour le public américain, peu familier de l'art néoclassique, la nudité du père de la \
nation parut choquante, voire ridicule : l'œuvre révèle le décalage entre un idéal \
savant et le goût d'une démocratie."""
histoire = """
En 1832, pour le centenaire de la naissance de Washington, le Congrès commande à \
Greenough, installé à Florence, une statue destinée à la rotonde du Capitole. Le \
sculpteur y travaille près de huit ans, en faisant tailler l'œuvre dans un énorme bloc \
de marbre. Achevée en 1840, la statue traverse l'Atlantique et est installée dans la \
rotonde en 1841. L'accueil est désastreux : elle est mal éclairée, sa masse inquiète et \
sa nudité choque. Dès 1843, elle est déplacée sur la pelouse est du Capitole, exposée \
aux intempéries ; on construit même un abri de bois pour la protéger. En 1908, elle est \
transférée au Smithsonian, dans le bâtiment du Castle, puis, en 1964, dans le nouveau \
musée d'histoire et de technologie, devenu le National Museum of American History."""
facture = """
Greenough suit l'enseignement néoclassique reçu à Rome dans l'entourage du sculpteur \
danois Bertel Thorvaldsen : formes idéalisées, surfaces lisses, références à l'antique. \
Il modèle d'abord la figure, dont un modèle en plâtre est tiré, puis la statue est \
taillée dans le marbre blanc avec l'aide de praticiens italiens, selon l'usage des \
ateliers florentins. La tête s'inspire du buste de Washington exécuté d'après nature \
par Jean-Antoine Houdon en 1785, tandis que le torse et la pose reprennent le type du \
Zeus trônant. Le drapé, aux plis profonds, contraste avec le poli de la peau."""
details = [
  "L'index droit levé vers le ciel.",
  "L'épée au fourreau, tendue poignée en avant, signe du renoncement au pouvoir.",
  "Les sandales à l'antique qui dépassent du drapé.",
  "Sur les côtés du trône, Apollon sur son char et Hercule enfant avec les serpents.",
]
themes = ["héros", "antiquité", "nation", "néoclassicisme", "pouvoir"]
anecdote = """
La statue suscita bien des railleries à Washington : on plaisantait sur un président \
qui sortait du bain, ou qui tendait le bras pour réclamer ses vêtements. Aucune autre \
effigie officielle du père de la nation ne fut aussi moquée."""
salle = 1
x = 0
z = 0
hauteur = 3.4
matiere = "marbre"
socle = 0.8

[[sculptures]]
titre = "The Wounded Scout, a Friend in the Swamp"
artiste = "John Rogers"
annee = "1864"
modele = "wounded-scout.stl"
technique = "Plâtre peint"
collection = "Smithsonian American Art Museum, Washington"
note = "Pendant la guerre de Sécession, un esclave en fuite soutient un soldat de l'Union blessé : un groupe vendu à des milliers d'exemplaires."
description = """
Dans un marais, un homme noir aux pieds nus, vêtu d'une chemise et d'un pantalon usés, \
soutient un soldat de l'armée de l'Union, blessé et à bout de forces. Le soldat, en \
uniforme, passe un bras autour des épaules de son sauveteur et s'abandonne contre lui. \
L'homme noir le retient fermement, le corps tendu par l'effort et l'attention. À leurs \
pieds, parmi les roseaux et les herbes du marécage, un serpent se faufile, rappel des \
dangers du lieu. Le groupe, haut d'une soixantaine de centimètres, est conçu pour être \
vu de tous les côtés, posé sur une table ou une cheminée de salon. Le titre complet, « \
L'Éclaireur blessé, un ami dans le marais », souligne la relation de confiance qui unit \
les deux personnages."""
evocation = """
Le groupe célèbre l'aide que les esclaves fugitifs et les Afro-Américains du Sud \
apportaient aux soldats de l'Union, en les guidant, en les cachant ou en les soignant. \
En 1864, alors que la guerre fait rage et que des régiments noirs se battent dans \
l'armée fédérale, l'œuvre affirme une fraternité entre Blancs et Noirs dans la lutte \
contre l'esclavage. On en a toutefois relevé les ambiguïtés : l'homme noir y est un \
sauveteur dévoué, mais au service du soldat blanc, dans un rôle qui reste celui de \
l'auxiliaire. Pour les familles du Nord qui l'achetaient, ce groupe était un signe \
d'engagement patriotique et abolitionniste, et un souvenir des sacrifices de la guerre, \
installé au cœur de la maison."""
histoire = """
John Rogers conçoit The Wounded Scout en 1864, en pleine guerre de Sécession, alors que \
ses groupes de plâtre ont déjà conquis le public du Nord. Il avait commencé par des \
sujets liés à l'esclavage, comme La Vente d'esclaves en 1859, puis multiplié les scènes \
de la vie des soldats et des civils pendant le conflit, qui répondaient à l'actualité \
vécue par ses acheteurs. The Wounded Scout figure parmi ses plus grands succès. Comme \
les autres groupes, il est vendu par catalogue et dans la salle d'exposition de \
l'artiste à New York, à un prix accessible aux familles de la classe moyenne. Le \
Smithsonian American Art Museum conserve de nombreux groupes de Rogers ; celui-ci fait \
partie des œuvres numérisées en 3D et diffusées en libre accès."""
facture = """
Rogers modèle d'abord ses figures en argile, puis fait fondre un modèle de bronze, à \
partir duquel sont réalisés des moules souples. Ces moules permettent de couler en \
série des épreuves en plâtre, assemblées puis couvertes d'une peinture uniforme couleur \
mastic, qui évoque la pierre ou le bronze et masque les imperfections. La précision du \
détail, dans les plis des vêtements, les mains ou les roseaux, est remarquable pour une \
production en série. La composition compacte, presque pyramidale, assure la solidité de \
l'objet et sa lisibilité de tous les côtés."""
details = [
  "Le bras du soldat passé autour des épaules de son sauveteur.",
  "Les pieds nus de l'homme noir, posés sur le sol du marais.",
  "Le serpent qui se glisse entre les roseaux, à leurs pieds.",
  "Le soin apporté aux plis des vêtements et à l'uniforme du soldat.",
]
themes = ["guerre de sécession", "esclavage", "fraternité", "secours", "sculpture de genre"]
anecdote = """
Pour se protéger des copies pirates, Rogers fit breveter ses créations : la plupart de \
ses groupes portent, inscrits dans le plâtre, son nom et la mention du brevet avec sa \
date. Il bâtit ainsi l'une des premières entreprises d'art populaire en série aux \
États-Unis."""
salle = 4
x = -2.5
z = 2
hauteur = 0.6
matiere = "#b9ab93"
socle = 1.0

[[sculptures]]
titre = "The Fugitive's Story"
artiste = "John Rogers"
annee = "1869"
modele = "fugitives-story.stl"
technique = "Plâtre peint"
collection = "Smithsonian American Art Museum, Washington"
note = "Une femme en fuite raconte son histoire à trois abolitionnistes, dont le poète Whittier."
description = """
Une jeune femme noire, simplement vêtue, tient son bébé serré contre elle et raconte \
son évasion à trois hommes réunis autour d'elle. Ce ne sont pas des figures anonymes : \
Rogers a représenté trois grandes figures de l'abolitionnisme, le poète John Greenleaf \
Whittier, le pasteur Henry Ward Beecher et le journaliste William Lloyd Garrison. Leurs \
visages sont des portraits reconnaissables, aux traits marqués par l'âge. Les hommes, \
en redingote, écoutent avec gravité ; leurs attitudes, penchées ou attentives, \
convergent toutes vers la femme et son enfant. Le groupe compose une petite scène de \
théâtre, avec ses gestes et ses regards, figée dans le plâtre à la manière d'un tableau \
vivant, et se découvre peu à peu en tournant autour."""
evocation = """
Réalisé en 1869, quatre ans après l'abolition de l'esclavage par le XIIIᵉ amendement, \
le groupe rend un hommage rétrospectif aux militants qui avaient combattu l'esclavage \
pendant des décennies. La fugitive, mère protégeant son enfant, incarne l'humanité niée \
par l'esclavage et la force du témoignage, qui fut l'une des armes principales des \
abolitionnistes : récits d'esclaves évadés, conférences, journaux. Les trois hommes \
figurent la conscience morale du Nord à travers la poésie, la religion et la presse. On \
remarque aujourd'hui que la parole de la femme est au centre de la scène, mais que les \
héros dont on retient les noms sont les trois hommes blancs : le groupe reflète les \
limites de son époque autant que ses idéaux."""
histoire = """
John Rogers, qui partageait les convictions abolitionnistes, consacre ce groupe en 1869 \
à des hommes que le public du Nord connaissait et admirait. L'année précédente, il \
avait déjà représenté des personnalités réelles dans The Council of War, où Lincoln \
discute avec le général Grant et le ministre de la Guerre Stanton. Comme ses autres \
œuvres, The Fugitive's Story est conçu pour être reproduit en plâtre et vendu par \
catalogue, dans un format adapté au salon bourgeois. Le sujet, plus méditatif que ses \
scènes de guerre, s'adresse à un public sensible à la mémoire du combat \
antiesclavagiste, au lendemain d'un conflit qui avait coûté des centaines de milliers \
de vies. Le Smithsonian American Art Museum en conserve un exemplaire, numérisé en 3D \
et diffusé en libre accès."""
facture = """
Ici, l'enjeu principal est la ressemblance : Rogers doit rendre reconnaissables des \
visages célèbres, largement diffusés à l'époque par la photographie et la gravure. Il \
les modèle avec soin dans l'argile, avant de suivre son procédé habituel : modèle de \
bronze, moules souples, tirages en plâtre peints d'une teinte uniforme. La disposition \
des quatre figures en cercle oblige le spectateur à tourner autour du groupe, chaque \
côté offrant un visage ou un geste différent. Les détails des vêtements et des mains \
sont précis malgré la petite taille de l'ensemble."""
details = [
  "Le bébé que la fugitive serre contre elle.",
  "Les visages des trois abolitionnistes, véritables portraits.",
  "Les redingotes et les mains, modelées avec précision malgré la petite taille.",
  "La teinte uniforme qui unifie l'ensemble, typique des groupes de Rogers.",
]
themes = ["abolitionnisme", "esclavage", "témoignage", "maternité", "sculpture de genre"]
anecdote = """
William Lloyd Garrison, l'un des trois auditeurs, avait publié son journal The \
Liberator chaque semaine de 1831 à la fin de 1865 : il en cessa la parution une fois \
l'esclavage aboli par le XIIIᵉ amendement, estimant sa mission accomplie."""
salle = 4
x = 2.5
z = 2
hauteur = 0.56
matiere = "#b9ab93"
socle = 1.0

[[sculptures]]
titre = "Masque d'Abraham Lincoln"
artiste = "Clark Mills"
annee = "1865"
modele = "lincoln-mask.stl"
technique = "Plâtre, moulé sur le vif"
collection = "National Portrait Gallery, Washington"
note = "Moulé deux mois avant son assassinat : le visage d'un président épuisé par quatre ans de guerre."
description = """
Le visage d'Abraham Lincoln apparaît tel qu'il était en février 1865, les yeux fermés, \
moulé directement sur la peau. Les joues sont creuses, les pommettes saillantes, des \
rides profondes barrent le front et encadrent la bouche. Une barbe courte couvre le \
menton et la mâchoire, sans moustache, comme sur ses derniers portraits \
photographiques. Sur la joue droite, près de la bouche, on distingue le grain de beauté \
du président. Les lèvres sont serrées, les paupières lourdes. Le masque se limite au \
visage, sans le cou ni la chevelure. Ce n'est pas une sculpture interprétée, mais une \
empreinte, d'une précision presque troublante, de chaque pli et de chaque relief de la \
peau."""
evocation = """
À la différence d'un portrait peint ou sculpté, le masque ne flatte ni n'idéalise : il \
garde la trace exacte des traits, comme une photographie en relief. Comparé au premier \
masque de Lincoln, pris par Leonard Volk en 1860, avant son élection, celui-ci montre \
combien quatre années de guerre civile ont marqué l'homme : amaigrissement, fatigue, \
gravité. Il est souvent présenté comme le témoignage le plus poignant du prix personnel \
payé par le président pour préserver l'Union et abolir l'esclavage. Pris quelques \
semaines avant la victoire et l'assassinat du 14 avril 1865, il a pris valeur de \
relique. Les yeux clos, qu'impose la technique, lui donnent rétrospectivement \
l'apparence d'un masque mortuaire, bien que Lincoln fût alors bien vivant."""
histoire = """
Clark Mills, le sculpteur de la statue équestre d'Andrew Jackson à Washington, dont la \
fonderie avait aussi coulé la statue de la Liberté qui couronne le dôme du Capitole, \
réalise ce moulage en février 1865, sans doute en vue d'un buste ou d'une statue du \
président. Lincoln vient d'être réélu et entame son second mandat le 4 mars. Le moule \
original permet de tirer plusieurs épreuves en plâtre au fil des années, et des tirages \
circulent parmi les sculpteurs et les collectionneurs. Avec celui de Volk, le masque de \
Mills est devenu un document de référence pour connaître le vrai visage de Lincoln, \
souvent consulté par les artistes qui lui ont consacré des monuments. L'exemplaire de \
la National Portrait Gallery a été numérisé en 3D par le Smithsonian."""
facture = """
Le moulage sur le vif suit une technique ancienne : le visage, enduit d'un corps gras \
pour que le plâtre n'adhère ni à la peau ni aux poils, est recouvert de plâtre liquide, \
que l'on laisse prendre quelques minutes avant de le retirer. On obtient un moule en \
creux, dans lequel on coule ensuite du plâtre pour obtenir le masque en relief. Le \
modèle doit rester parfaitement immobile, les yeux fermés. Mills, ancien plâtrier formé \
sur les chantiers de Charleston, maîtrisait ce procédé. Le plâtre blanc, sans couleur \
ni retouche, restitue la texture de la peau, la barbe et les moindres rides."""
details = [
  "Le grain de beauté sur la joue droite, près de la bouche.",
  "Les sillons profonds qui descendent du nez vers les coins des lèvres.",
  "La barbe sans moustache, dont on devine la texture.",
  "Les paupières closes, lourdes de fatigue.",
]
themes = ["portrait", "guerre de sécession", "président", "mémoire", "moulage"]
anecdote = """
John Hay, l'un des secrétaires de Lincoln, écrivit plus tard que ce masque était d'une \
tristesse indicible : le visage d'un homme sur qui le chagrin et les soucis avaient \
fait leur pire œuvre, sans pourtant parvenir à le vaincre."""
salle = 4
x = 0
z = -2
hauteur = 0.3
matiere = "platre"
socle = 1.15

[[sculptures]]
titre = "Bouddha vêtu d'une robe figurant les mondes de l'existence"
artiste = "Chine, dynastie des Qi du Nord"
annee = "550–577"
modele = "buddha.stl"
technique = "Calcaire"
collection = "Freer Gallery of Art, Washington"
note = "Le « Bouddha cosmique » : sur sa robe, en léger relief, les six mondes de l'existence, des paradis aux enfers."
description = """
Ce grand Bouddha de pierre, debout, a perdu sa tête et ses mains, mais son corps garde \
une présence imposante. Il est vêtu de la robe monastique, qui tombe droit jusqu'aux \
chevilles et épouse le corps presque cylindrique sans former de plis marqués. Toute la \
surface de cette robe est couverte de scènes sculptées en très faible relief et de \
lignes gravées. Vers le haut, des palais et des êtres célestes évoquent les mondes des \
dieux ; plus bas se déploient des scènes du monde des humains, avec des personnages, \
des bâtiments et des arbres ; tout en bas, près de l'ourlet, apparaissent les enfers, \
où l'on devine des damnés tourmentés. Il faut s'approcher très près, et tourner autour \
de la statue, pour commencer à lire ces images."""
evocation = """
Dans la pensée bouddhique, les êtres renaissent sans cesse dans six mondes : ceux des \
dieux, des demi-dieux, des humains, des animaux, des esprits affamés et des damnés des \
enfers, selon le poids de leurs actes. En portant ces mondes sur sa robe, le Bouddha \
apparaît comme englobant l'univers entier : sa présence s'étend à tous les êtres, \
jusqu'aux plus malheureux, et offre à chacun la possibilité de la délivrance. Beaucoup \
de spécialistes l'identifient au Bouddha cosmique Vairocana, décrit dans le Sutra de \
l'Ornementation fleurie comme contenant en lui tous les mondes ; d'autres y voient le \
Bouddha historique, Shakyamuni. Pour les fidèles du VIᵉ siècle, cette image était un \
support de méditation sur la place de chaque être dans le cycle des renaissances."""
histoire = """
La statue a été sculptée en Chine du Nord sous la dynastie des Qi du Nord (550-577), \
période de grande ferveur bouddhique où la cour et l'aristocratie finançaient temples \
et grottes sanctuaires. On ignore le temple exact d'où elle provient. Comme beaucoup de \
sculptures bouddhiques chinoises, elle a quitté la Chine au début du XXᵉ siècle, dans \
un contexte de troubles et de pillage des sites religieux qui alimentait le marché de \
l'art occidental. Elle entre à la Freer Gallery of Art en 1923, l'année de l'ouverture \
du musée, fondé grâce au legs du collectionneur Charles Lang Freer. Au début des années \
2010, le Smithsonian l'a numérisée en 3D, ce qui a permis de mieux déchiffrer les \
scènes de la robe, difficiles à lire sur la pierre usée."""
facture = """
La statue est taillée dans un calcaire à grain fin, qui se prête à un travail \
minutieux. Le corps presque cylindrique et la robe qui colle à la peau sont \
caractéristiques du style des Qi du Nord, marqué par l'art indien de l'époque gupta : \
aux drapés en cascade de la période précédente succède un vêtement lisse, devenu \
presque un support. Sur cette surface, le sculpteur a gravé et modelé en très faible \
relief les scènes des mondes de l'existence, comme il l'aurait fait d'une peinture. À \
l'origine, la statue était probablement peinte, ce qui rendait ces scènes bien plus \
lisibles."""
details = [
  "En haut de la robe, les palais et les êtres célestes qui figurent les paradis.",
  "Près de l'ourlet, les scènes des enfers et leurs damnés.",
  "La surface lisse de la robe, qui épouse le corps sans plis marqués.",
  "Les cassures du cou et des bras : la tête et les mains ont disparu.",
]
themes = ["bouddhisme", "cosmos", "renaissance", "chine", "spiritualité"]
anecdote = """
Ce Bouddha fut l'un des premiers objets que le Smithsonian mit en ligne en 3D, en 2013 \
: chacun peut désormais faire tourner la statue sur son écran et observer les scènes de \
la robe sous des éclairages impossibles à obtenir dans la galerie."""
salle = 5
x = 0
z = 0
hauteur = 1.5
matiere = "pierre"
socle = 0.4

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Thomas Cole"
vie = "Bolton (Angleterre), 1er février 1801 – Catskill (New York), 11 février 1848"
biographie = """
Né dans le Lancashire, en pleine révolution industrielle, Thomas Cole est d'abord \
apprenti chez un graveur de motifs pour toiles imprimées. En 1818, sa famille émigre \
aux États-Unis ; il vit à Philadelphie puis dans l'Ohio, où il devient portraitiste \
itinérant et apprend la peinture presque seul. Installé à New York en 1825, il remonte \
l'Hudson et peint les monts Catskill : ses premiers paysages sont achetés par les \
peintres John Trumbull et Asher B. Durand, et le succès est immédiat. De 1829 à 1832, \
il voyage en Angleterre et en Italie, où il étudie Claude Lorrain, Turner et les ruines \
romaines. À son retour, le négociant Luman Reed lui commande Le Cours de l'Empire, cinq \
toiles sur la naissance, la gloire et la chute d'une civilisation (1833-1836). En 1836, \
il épouse Maria Bartow et s'établit à Catskill, à Cedar Grove, où il accueille son seul \
véritable élève, Frederic Church. Il peint encore le cycle du Voyage de la vie (1840), \
retourne en Europe en 1841-1842, et meurt d'une pleurésie en 1848, à quarante-sept ans. \
Durand lui rend hommage dans Kindred Spirits (1849)."""
style = """
Cole est considéré comme le fondateur de l'école de l'Hudson, premier mouvement de \
paysage proprement américain. Il associe une observation attentive de la nature, notée \
dans des dessins pris sur le motif, à une composition savante recomposée en atelier. \
Ses paysages opposent souvent l'ombre et la lumière, le sauvage et le cultivé, et \
portent une dimension morale ou religieuse : pour lui, la nature américaine était un \
livre où se lisait la Création. Ses cycles allégoriques, comme Le Cours de l'Empire, \
prolongent cette réflexion sur le destin des nations. Durand, Church et toute la \
génération suivante de paysagistes se sont nourris de son exemple."""

[[artistes]]
nom = "Albert Bierstadt"
vie = "Solingen (Prusse), 7 janvier 1830 – New York, 18 février 1902"
biographie = """
Né en Rhénanie, Albert Bierstadt n'a qu'un an quand sa famille émigre à New Bedford, \
port baleinier du Massachusetts. En 1853, il repart pour l'Allemagne étudier à \
Düsseldorf, dont l'académie attire alors de nombreux Américains ; il y côtoie Emanuel \
Leutze et Worthington Whittredge, et parcourt les Alpes et l'Italie. Rentré en 1857, il \
se joint en 1859 à l'expédition de l'arpenteur Frederick W. Lander vers les montagnes \
Rocheuses, dont il rapporte croquis et photographies. Ses grandes toiles de l'Ouest, \
comme Les Montagnes Rocheuses, pic de Lander (1863), font de lui l'un des peintres les \
plus célèbres et les mieux payés d'Amérique. En 1863, il découvre Yosemite ; en 1866, \
il épouse Rosalie, l'ex-femme de l'écrivain Fitz Hugh Ludlow. Il séjourne en Europe de \
1867 à 1869, puis peint la Californie, le Canada et l'Alaska. Mais à partir des années \
1880, le goût change : la critique juge ses toiles théâtrales, sa grande maison \
d'Irvington, sur l'Hudson, brûle en 1882, et ses affaires périclitent jusqu'à la \
faillite en 1895. Il meurt à New York en 1902, presque oublié."""
style = """
Bierstadt marie la précision de l'école de Düsseldorf, dessin minutieux et surface \
lisse, à un sens du spectacle hérité du romantisme. Ses vues de l'Ouest sont \
recomposées en atelier à partir d'études prises sur le motif : il y rassemble sommets, \
cascades, lacs et lumières dorées pour créer une image idéale, plus grandiose que \
nature. Il exposait ses toiles géantes seules, comme des événements. Ses images ont \
fortement contribué à façonner la vision de l'Ouest dans l'opinion américaine et \
européenne, et nourri l'intérêt pour des sites comme Yosemite. Moqué pour sa \
grandiloquence à la fin de sa vie, il a été redécouvert dans la seconde moitié du XXᵉ \
siècle."""

[[artistes]]
nom = "Frederic Edwin Church"
vie = "Hartford (Connecticut), 4 mai 1826 – New York, 7 avril 1900"
biographie = """
Fils d'un riche homme d'affaires de Hartford, Frederic Edwin Church devient en 1844 \
l'élève de Thomas Cole à Catskill, privilège rare : Cole ne forma pratiquement pas \
d'autre disciple. Dès 1848, à vingt-deux ans, il est élu membre de la National Academy \
of Design. Passionné par les écrits du naturaliste Alexander von Humboldt, il part en \
1853 pour la Colombie et l'Équateur, où il retourne en 1857. Niagara (1857) puis Le \
Cœur des Andes (1859) font sensation : exposées seules, les toiles attirent des foules \
payantes. Suivent Crépuscule dans les terres sauvages (1860), Les Icebergs (1861), \
après un voyage au large du Labrador, et Cotopaxi (1862). En 1860, il épouse Isabel \
Carnes ; la mort de deux de leurs enfants, en 1865, l'affecte profondément. Il voyage \
ensuite en Europe et au Proche-Orient (1867-1869), puis fait construire au-dessus de \
l'Hudson Olana, une demeure d'inspiration persane dont il dessine aussi le parc. À \
partir des années 1870, des rhumatismes l'empêchent peu à peu de peindre. Il meurt à \
New York en 1900, alors que son style est passé de mode."""
style = """
Church pousse à leur sommet les ambitions de l'école de l'Hudson. Il allie l'exactitude \
d'un naturaliste, attentif à la géologie, à la botanique et aux phénomènes du ciel, à \
la recherche d'effets grandioses : couchers de soleil embrasés, volcans, glaces, \
cataractes. Sa peinture, lisse et minutieuse, rend aussi bien la transparence de l'eau \
que l'incandescence des nuages. Il concevait ses grandes toiles comme des spectacles, \
présentés seuls, avec un éclairage étudié et un encadrement monumental. Célèbre de son \
vivant, oublié au début du XXᵉ siècle, il est aujourd'hui considéré comme l'un des plus \
grands paysagistes américains."""

[[artistes]]
nom = "James McNeill Whistler"
vie = "Lowell (Massachusetts), 11 juillet 1834 – Londres, 17 juillet 1903"
biographie = """
James Abbott McNeill Whistler passe une partie de son enfance à Saint-Pétersbourg, où \
son père, ingénieur, construit une ligne de chemin de fer pour le tsar. Revenu aux \
États-Unis, il entre à l'académie militaire de West Point, dont il est renvoyé en 1854, \
puis apprend la gravure en travaillant comme cartographe. En 1855, il part pour Paris, \
fréquente l'atelier de Charles Gleyre et se lie avec Fantin-Latour et Courbet. Installé \
à Londres en 1859, il partage sa vie entre les deux capitales. Sa Symphonie en blanc n° \
1, la Jeune Fille en blanc, fait sensation au Salon des refusés de 1863. Il \
collectionne les porcelaines et les estampes d'Extrême-Orient, peint ses « nocturnes » \
de la Tamise et ses « arrangements ». En 1877, le critique John Ruskin l'accuse d'avoir \
jeté un pot de peinture à la face du public ; Whistler lui intente un procès en \
diffamation, qu'il gagne en 1878, mais avec un dédommagement d'un farthing, un quart de \
penny. Ruiné par les frais, il fait faillite en 1879 et part graver à Venise. Les \
années 1880 et 1890 lui apportent enfin la reconnaissance, en France comme en \
Angleterre. Il meurt à Londres en 1903."""
style = """
Whistler revendique l'art pour l'art : la peinture ne doit ni raconter ni moraliser, \
mais créer une harmonie de formes et de couleurs, comme la musique. D'où ses titres, « \
symphonies », « arrangements », « nocturnes ». Sa palette est souvent réduite à \
quelques tons voisins, posés en couches fines et fluides. Il emprunte aux estampes \
japonaises leurs compositions asymétriques, leurs aplats et leurs cadrages, et à \
Velázquez l'art des gris et des noirs. Graveur de premier ordre, il a aussi renouvelé \
l'eau-forte. Sa conception d'une peinture autonome, détachée du sujet, annonce \
l'abstraction et a marqué les symbolistes comme les modernes."""

[[artistes]]
nom = "Thomas Eakins"
vie = "Philadelphie, 25 juillet 1844 – Philadelphie, 25 juin 1916"
biographie = """
Thomas Eakins passe presque toute sa vie dans sa ville natale, Philadelphie. Après des \
études à la Pennsylvania Academy of the Fine Arts, complétées par des cours d'anatomie \
au Jefferson Medical College, il part en 1866 pour Paris. Il y étudie à l'École des \
beaux-arts dans l'atelier de Jean-Léon Gérôme, travaille aussi avec Léon Bonnat et le \
sculpteur Augustin Dumont, puis découvre en 1869 Velázquez et Ribera au musée du Prado, \
à Madrid. Rentré en 1870, il peint les rameurs de la rivière Schuylkill, puis La \
Clinique du docteur Gross en 1875. Professeur à la Pennsylvania Academy à partir de \
1876, puis directeur, il y impose l'étude du modèle nu et la dissection. En 1886, il \
est contraint de démissionner après avoir retiré le pagne d'un modèle masculin devant \
des élèves femmes. Passionné de photographie, il collabore avec Eadweard Muybridge à \
l'étude du mouvement. En 1884, il épouse la peintre Susan Macdowell, son ancienne \
élève. Longtemps tenu à l'écart, il peint La Clinique du docteur Agnew en 1889 et ne \
reçoit que tardivement quelques honneurs. Il meurt à Philadelphie en 1916."""
style = """
Eakins est le grand peintre réaliste américain de son siècle. À la rigueur académique \
apprise chez Gérôme, il ajoute une connaissance scientifique de l'anatomie, de la \
perspective et du mouvement, étudiés par la dissection et la photographie. Ses \
tableaux, construits avec une précision géométrique, refusent toute flatterie : ses \
portraits montrent les rides, la fatigue, l'introspection. Sa palette sombre et son \
clair-obscur doivent beaucoup aux maîtres espagnols et à Rembrandt. Incompris de son \
vivant, il est reconnu au XXᵉ siècle comme une figure majeure ; par son élève Thomas \
Anshutz, maître de Robert Henri, il a aussi influencé les réalistes de l'école \
d'Ashcan."""

[[artistes]]
nom = "John Singer Sargent"
vie = "Florence, 12 janvier 1856 – Londres, 14 avril 1925"
biographie = """
Né à Florence de parents américains installés en Europe, John Singer Sargent grandit au \
gré des voyages familiaux entre l'Italie, la France, la Suisse et l'Allemagne, et ne \
découvre les États-Unis qu'à vingt ans. En 1874, il entre à Paris dans l'atelier du \
portraitiste Carolus-Duran et s'impose vite au Salon, avec Fumée d'ambre gris (1880), \
El Jaleo (1882) ou Les Filles d'Edward Darley Boit (1882). Le scandale de Madame X, en \
1884, freine sa carrière parisienne : en 1886, il s'installe à Londres, dans le \
quartier de Chelsea. Peint dans le village de Broadway, Carnation, Lily, Lily, Rose \
(1885-1886) est acheté par la Tate en 1887. Sargent devient le portraitiste le plus \
recherché de la haute société anglaise et américaine. Vers 1907, lassé des commandes, \
il abandonne presque le portrait pour l'aquarelle et pour de grands décors muraux à la \
Boston Public Library et au Museum of Fine Arts de Boston. Envoyé sur le front en 1918 \
comme peintre de guerre, il en rapporte Gazés (Gassed, 1919). Il meurt à Londres en \
1925."""
style = """
Sargent est célèbre pour sa virtuosité : une touche rapide, large et fluide, souvent \
posée en une seule fois, qui donne une impression d'aisance totale. Héritier de \
Velázquez et de Frans Hals par l'enseignement de Carolus-Duran, il a aussi pratiqué \
l'impressionnisme aux côtés de Monet, à Giverny. Ses portraits saisissent l'élégance, \
le rang social et la personnalité des modèles, avec un sens aigu des étoffes, des \
reflets et des poses. Ses aquarelles, libres et lumineuses, comptent parmi les plus \
belles de son temps. Longtemps jugé superficiel par la critique moderniste, il a \
retrouvé depuis les années 1980 une place de premier plan."""

[[artistes]]
nom = "Mary Cassatt"
vie = "Allegheny City, Pennsylvanie, 22 mai 1844 – Le Mesnil-Théribus, Oise, 14 juin 1926"
biographie = """
Issue d'une famille aisée de Pennsylvanie, Mary Cassatt passe une partie de son enfance \
en Europe. Elle étudie à la Pennsylvania Academy of the Fine Arts, puis part en 1866 \
pour Paris, où l'École des beaux-arts reste fermée aux femmes : elle prend des cours \
particuliers, notamment auprès de Jean-Léon Gérôme, et copie les maîtres au Louvre. \
Reçue au Salon dès 1868, elle s'installe définitivement à Paris en 1874. En 1877, Edgar \
Degas l'invite à exposer avec les impressionnistes ; elle participe à leurs expositions \
de 1879, 1880, 1881 et 1886, seule Américaine du groupe. Ses parents et sa sœur Lydia \
la rejoignent à Paris. Après la grande exposition d'estampes japonaises de 1890, elle \
réalise une série de gravures en couleurs. En 1893, elle peint une vaste décoration \
pour le Woman's Building de l'Exposition de Chicago, aujourd'hui perdue. Conseillère de \
collectionneurs américains comme Louisine et Henry Havemeyer, elle contribue à faire \
entrer l'impressionnisme dans les musées des États-Unis. Atteinte de cataracte, elle \
cesse de travailler vers 1914 et meurt dans son château de Beaufresne, dans l'Oise."""
style = """
Mary Cassatt applique la modernité impressionniste à un univers qu'elle connaît de \
l'intérieur : la vie des femmes, la maternité, le thé, la lecture, la loge de théâtre. \
Formée à un dessin rigoureux, admiratrice de Degas, elle privilégie la construction des \
figures et les cadrages inattendus plutôt que la dissolution des formes dans la \
lumière. Les estampes japonaises lui inspirent des vues plongeantes, des aplats et des \
motifs décoratifs. Elle fut aussi une graveuse remarquable, notamment dans ses estampes \
en couleurs de 1891, mêlant pointe sèche et aquatinte. Son œuvre a ouvert la voie aux \
femmes artistes américaines et donné au thème de la mère et de l'enfant un regard \
moderne."""

[[artistes]]
nom = "Winslow Homer"
vie = "Boston, 24 février 1836 – Prouts Neck (Maine), 29 septembre 1910"
biographie = """
Fils d'un commerçant de Boston, Winslow Homer apprend le métier chez un lithographe, \
puis devient illustrateur indépendant pour l'hebdomadaire Harper's Weekly. Pendant la \
guerre de Sécession, il suit l'armée du Potomac et dessine la vie quotidienne des \
soldats ; son tableau Prisonniers du front (1866) le fait connaître et figure à \
l'Exposition universelle de Paris en 1867, ville où il séjourne près d'un an. Dans les \
années 1870, il peint l'enfance rurale, les écoles de campagne, les loisirs de plein \
air, et se met à l'aquarelle. Un séjour d'environ vingt mois à Cullercoats, village de \
pêcheurs de la mer du Nord, en 1881-1882, transforme son art : la mer, les tempêtes et \
la lutte des hommes contre les éléments deviennent ses grands sujets. En 1883, il \
s'installe à Prouts Neck, sur la côte du Maine, où il vit en solitaire face à l'océan. \
Il voyage cependant en Floride, aux Bahamas, aux Bermudes, et dans les forêts des \
Adirondacks et du Québec, d'où il rapporte des aquarelles éclatantes. Célibataire et \
secret, il meurt dans son atelier de Prouts Neck en 1910."""
style = """
Homer est, avec Eakins, l'un des grands peintres du réalisme américain. Venu de \
l'illustration, il garde le sens d'une composition claire et d'un récit immédiatement \
lisible. Sa peinture est franche, construite par larges masses, avec une touche \
vigoureuse qui donne leur poids à l'eau et aux rochers. Il observe la nature sans \
sentimentalisme : la mer y est puissante, souvent menaçante, et l'homme s'y mesure à \
des forces qui le dépassent. Ses aquarelles, d'une liberté et d'une luminosité \
exceptionnelles, ont élevé ce médium au rang de grand art aux États-Unis. On le tient \
souvent pour le plus américain des peintres de son siècle."""

[[artistes]]
nom = "Horatio Greenough"
vie = "Boston, 6 septembre 1805 – Somerville (Massachusetts), 18 décembre 1852"
biographie = """
Fils d'un riche promoteur immobilier de Boston, Horatio Greenough s'intéresse très \
jeune à la sculpture et étudie à Harvard. En 1825, il part pour Rome, où il fréquente \
l'entourage du sculpteur danois Bertel Thorvaldsen. Après un bref retour aux \
États-Unis, il s'établit en 1828 à Florence, devenant l'un des premiers sculpteurs \
américains à faire carrière en Italie, où l'on trouve marbre, praticiens et modèles \
antiques. L'écrivain James Fenimore Cooper, son premier grand protecteur, lui commande \
un groupe d'angelots chantants, puis appuie sa candidature pour la statue de \
Washington, que le Congrès lui confie en 1832. Il réalise aussi pour le Capitole Le \
Sauvetage (The Rescue), groupe montrant un pionnier qui protège sa famille d'un \
guerrier amérindien, installé en 1853 et retiré en 1958. Rentré aux États-Unis en 1851, \
il publie des essais sur l'architecture et les objets, où il défend l'idée que la forme \
doit découler de la fonction. Il meurt brutalement d'une fièvre cérébrale en 1852, à \
quarante-sept ans."""
style = """
Greenough appartient à la génération néoclassique formée en Italie dans le sillage de \
Canova et de Thorvaldsen : il recherche la beauté idéale, les formes pures et la \
référence à l'Antiquité grecque et romaine. Son George Washington pousse cette logique \
jusqu'au bout, au risque de heurter le public américain. Mais il fut aussi un penseur \
original : dans ses écrits, il critique l'imitation des styles anciens en architecture \
et prône des formes dictées par l'usage, en prenant pour modèles les navires et les \
machines. Ces idées font de lui un précurseur du fonctionnalisme, souvent rapproché de \
la formule « la forme suit la fonction » de l'architecte Louis Sullivan."""

[[artistes]]
nom = "John Rogers"
vie = "Salem (Massachusetts), 30 octobre 1829 – New Canaan (Connecticut), 26 juillet 1904"
biographie = """
Issu d'une famille de Salem, John Rogers interrompt ses études pour des raisons de \
santé et travaille comme mécanicien dans des ateliers de machines, puis dans une \
compagnie de chemin de fer à Hannibal, dans le Missouri. Sculpteur amateur, il modèle \
de petites figures d'argile pendant ses loisirs. En 1858, il part étudier en Europe, à \
Paris puis à Rome, mais l'enseignement néoclassique le déçoit et il rentre au bout de \
quelques mois. En 1859, un petit groupe, Les Joueurs de dames, remporte un vif succès \
lors d'une vente de bienfaisance à Chicago. Rogers s'installe à New York, expose La \
Vente d'esclaves, puis fonde son entreprise : il conçoit des groupes de genre et les \
reproduit en plâtre pour les vendre à prix modéré, par catalogue. Pendant la guerre de \
Sécession, ses scènes de soldats et de civils rencontrent un immense succès. Il crée \
ainsi plusieurs dizaines de modèles, vendus à des dizaines de milliers d'exemplaires, \
jusqu'à ce que la maladie l'oblige à cesser son activité dans les années 1890. Il passe \
ses dernières années à New Canaan, où son atelier est aujourd'hui conservé."""
style = """
Les « groupes Rogers » sont des scènes de genre en trois dimensions, petites, \
narratives et accessibles, à l'opposé des statues de marbre idéalisées de l'époque. \
Rogers y raconte des histoires de la vie quotidienne, de la guerre, de la littérature \
ou du théâtre, avec un réalisme précis des visages, des costumes et des objets, et un \
humour souvent tendre. Son innovation est aussi industrielle : moulage en série, plâtre \
peint, brevets, vente par correspondance. Il a fait entrer la sculpture dans des \
milliers de foyers de la classe moyenne américaine, et ses groupes sont devenus des \
documents précieux sur les sentiments et les débats de son temps, en particulier sur \
l'esclavage et la guerre."""

[[artistes]]
nom = "Clark Mills"
vie = "Comté d'Onondaga (État de New York), 1810 – Washington, 12 janvier 1883"
biographie = """
Orphelin très jeune, Clark Mills grandit dans l'État de New York et exerce divers \
métiers manuels avant de devenir plâtrier et stucateur. Installé à Charleston, en \
Caroline du Sud, dans les années 1830, il met au point une méthode de moulage sur le \
vif qui lui permet de réaliser des bustes à bas prix ; un buste de l'homme politique \
John C. Calhoun le fait connaître. En 1848, sans avoir jamais vu de statue équestre, il \
obtient la commande d'un monument à Andrew Jackson pour Washington. Il construit \
lui-même sa fonderie et, après plusieurs échecs, réussit la fonte de la statue, \
inaugurée en 1853 à Lafayette Square, en face de la Maison-Blanche : le cheval cabré, \
en équilibre sur ses pattes arrière, est un exploit technique, et c'est la première \
statue équestre en bronze fondue aux États-Unis. Il réalise ensuite une statue équestre \
de George Washington, inaugurée en 1860. Entre 1860 et 1862, sa fonderie coule la \
statue de la Liberté de Thomas Crawford, qui couronne le dôme du Capitole, avec le \
concours décisif de Philip Reid, un ouvrier qu'il tenait en esclavage. Il meurt à \
Washington en 1883."""
style = """
Mills est un autodidacte, formé par la pratique artisanale du plâtre et de la fonte \
plutôt que par les académies. Son talent est avant tout technique : moulage sur le vif, \
fonte du bronze, maîtrise de l'équilibre des masses, comme le montre le cheval cabré de \
Jackson, qui tient sans autre appui que ses pattes arrière. Ses portraits, fondés sur \
l'empreinte directe des visages, privilégient la ressemblance plutôt que \
l'idéalisation. Si son style a paru naïf aux sculpteurs formés en Europe, il a joué un \
rôle pionnier dans la naissance de la fonte d'art aux États-Unis et dans la statuaire \
monumentale de Washington."""

[[artistes]]
nom = "Chine, dynastie des Qi du Nord"
vie = "Chine du Nord, 550–577, capitale Ye (dans l'actuelle province du Hebei)"
biographie = """
Au VIᵉ siècle, la Chine est divisée entre plusieurs dynasties rivales. Au nord, après \
l'éclatement des Wei du Nord, s'affrontent les Qi du Nord, à l'est, et les Zhou du \
Nord, à l'ouest. Fondée en 550 par Gao Yang, la dynastie des Qi du Nord règne depuis \
Ye, sa capitale ; sa cour mêle traditions chinoises et cultures des peuples des \
steppes. Ses souverains sont de fervents bouddhistes : ils financent temples, \
monastères et grottes sanctuaires, comme celles de Xiangtangshan, creusées dans les \
montagnes proches de la capitale. Les sculptures sont l'œuvre d'ateliers de tailleurs \
de pierre anonymes, travaillant sur commande de la cour, des moines ou de laïcs pieux \
qui espéraient ainsi accumuler des mérites. Venu de l'Inde par les routes d'Asie \
centrale, le bouddhisme connaît alors un essor prodigieux, et de nombreux textes sont \
traduits, comme le Sutra de l'Ornementation fleurie, qui décrit un univers où chaque \
parcelle contient tous les mondes. En 577, les Zhou du Nord, qui persécutaient le \
bouddhisme, conquièrent le royaume des Qi et y étendent les destructions. En 581, la \
dynastie Sui réunifie bientôt la Chine et restaure la religion. La découverte en 1996, \
à Qingzhou, dans le Shandong, de centaines de statues enfouies a révélé l'éclat de la \
sculpture de cette époque."""
style = """
La sculpture des Qi du Nord marque un tournant. Aux silhouettes élancées et aux drapés \
en cascade des Wei du Nord succèdent des corps plus pleins, presque cylindriques, \
enveloppés de robes fines qui collent à la peau, à la manière de la sculpture indienne \
de l'époque gupta, dont les modèles parvenaient en Chine par l'Asie centrale. Les \
visages deviennent plus ronds et plus sereins. Les statues étaient souvent peintes et \
dorées, parfois couvertes de motifs. Ce style plus naturel, attentif au volume du \
corps, prépare l'art des dynasties Sui et Tang, âge d'or de la sculpture bouddhique \
chinoise."""
