# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Jan Matejko"
vie = "Cracovie, 24 juin 1838 – Cracovie, 1ᵉʳ novembre 1893"
biographie = """
Né à Cracovie, alors ville libre bientôt annexée par l'Autriche, Jan Matejko est le \
fils d'un professeur de musique tchèque et d'une mère d'origine germano-polonaise. Il \
étudie à l'École des beaux-arts de Cracovie, puis brièvement à Munich et à Vienne. \
Revenu dans sa ville, il ne la quittera presque plus. Stańczyk, en 1862, le fait \
connaître ; suivent Le Sermon de Skarga (1864) et Rejtan (1866), qui fait scandale en \
montrant la responsabilité de la noblesse dans les partages de la Pologne. En 1873, il \
prend la direction de l'École des beaux-arts de Cracovie, où il forme notamment Jacek \
Malczewski et Stanisław Wyspiański. Ses immenses toiles, La Bataille de Grunwald \
(1878) et L'Hommage prussien (1882), qu'il offre à la nation, font de lui le peintre \
de l'histoire polonaise, à une époque où le pays a disparu de la carte. Il meurt à \
Cracovie en 1893."""
style = """
Matejko invente une peinture d'histoire à la fois spectaculaire et réflexive : des \
foules immenses, des costumes et des objets décrits avec une précision d'archéologue, \
des couleurs intenses, et des visages qui jugent l'histoire autant qu'ils la vivent. \
Il anime ses toiles d'anachronismes voulus pour faire passer un message aux Polonais \
de son temps. Son imagerie a façonné pour des générations la mémoire nationale \
polonaise."""

[[artistes]]
nom = "Mikoláš Aleš"
vie = "Mirotice (Bohême), 18 novembre 1852 – Prague, 10 juillet 1913"
biographie = """
Né dans une famille modeste du sud de la Bohême, Mikoláš Aleš entre à l'Académie des \
beaux-arts de Prague à la fin des années 1860 et la quitte au milieu des années 1870, \
sans grand appui. Il vit longtemps dans la pauvreté. En 1877, il remporte avec \
František Ženíšek le concours pour le décor du foyer du Théâtre national, symbole du \
réveil tchèque ; il y conçoit le cycle La Patrie, mais le chantier lui vaut bien des \
déboires. Ses tableaux d'histoire se vendent mal, et il se tourne vers le dessin : \
illustrations de chansons populaires, de contes et de livres d'enfants, dessins pour \
les journaux satiriques, cartons pour les sgraffites et les peintures qui ornent de \
nombreuses façades de Prague et de Bohême. Peu à peu, ses cavaliers hussites, ses \
paysans et ses héros légendaires deviennent familiers à tous les Tchèques. Il meurt à \
Prague en 1913."""
style = """
Aleš est avant tout un dessinateur : un trait vif et souple, des silhouettes nettes, \
une stylisation qui emprunte à l'art populaire. Ses peintures, souvent de petit \
format, sont méditatives et mélancoliques. Il a forgé une imagerie nationale tchèque, \
des hussites aux bergers, que l'on retrouve dans les livres, sur les murs des maisons \
et jusque dans les écoles."""

[[artistes]]
nom = "Alfons Mucha"
vie = "Ivančice (Moravie), 24 juillet 1860 – Prague, 14 juillet 1939"
biographie = """
Né en Moravie, Alfons Mucha travaille d'abord comme peintre de décors de théâtre à \
Vienne, puis étudie à Munich grâce à un protecteur. En 1887, il s'installe à Paris, \
suit les cours de l'Académie Julian et vit d'illustrations. À la fin de 1894, \
l'affiche qu'il dessine pour Gismonda, avec Sarah Bernhardt, le rend célèbre du jour \
au lendemain ; l'actrice le prend sous contrat. Ses affiches, ses panneaux décoratifs \
et ses bijoux font de lui l'une des figures de l'Art nouveau. À l'Exposition \
universelle de 1900, il décore le pavillon de la Bosnie-Herzégovine. Il séjourne \
ensuite plusieurs fois aux États-Unis, où il trouve le mécène de son grand projet, \
l'Épopée slave, qu'il peint en Bohême de 1910 à 1928. Après 1918, il dessine les \
premiers timbres et billets de la Tchécoslovaquie. Arrêté et interrogé par la Gestapo \
en 1939, il meurt quelques mois plus tard à Prague."""
style = """
Mucha est connu pour ses femmes aux chevelures ondoyantes, entourées d'auréoles et \
d'arabesques, dessinées d'un trait souple et coloré en tons doux : le « style Mucha » \
de l'Art nouveau. Dans l'Épopée slave, il met ce sens décoratif au service d'une \
peinture d'histoire monumentale et visionnaire, où la lumière et le symbole comptent \
autant que le récit."""

[[artistes]]
nom = "Mihály Munkácsy"
vie = "Munkács (auj. Moukatchevo, Ukraine), 20 février 1844 – Endenich (Bonn), 1ᵉʳ mai 1900"
biographie = """
Né Michael Lieb dans une famille d'origine allemande, Munkácsy prend plus tard le nom \
de sa ville natale. Orphelin très jeune, il est apprenti menuisier avant de pouvoir \
apprendre la peinture, à Pest, puis à Vienne, à Munich et à Düsseldorf. La Cellule du \
condamné, médaillée au Salon de Paris en 1870, le rend célèbre. Installé à Paris en \
1871, il épouse la veuve d'un baron et tient avenue de Villiers un salon fréquenté par \
le Tout-Paris. Le marchand Charles Sedelmeyer organise le succès international de ses \
grandes toiles : Milton dictant le Paradis perdu (1878), puis la trilogie du Christ, \
Le Christ devant Pilate (1881), Golgotha (1884) et Ecce Homo (1896), qui font le tour \
de l'Europe et de l'Amérique. Il peint aussi La Conquête de la Hongrie pour le nouveau \
Parlement de Budapest. Atteint d'une grave maladie nerveuse, il meurt dans un asile \
près de Bonn en 1900."""
style = """
Munkácsy unit le réalisme de Courbet et la tradition du tableau de genre de Düsseldorf \
: des scènes populaires ou bibliques mises en scène comme au théâtre, des fonds \
sombres d'où surgissent des visages expressifs. Sa palette brune, souvent au bitume, \
s'éclaircit dans ses paysages et ses salons parisiens. Il fut le peintre hongrois le \
plus célèbre de son siècle."""

[[artistes]]
nom = "Nicolae Grigorescu"
vie = "Pitaru (Valachie), 15 mai 1838 – Câmpina, 21 juillet 1907"
biographie = """
Né dans un village de Valachie, Nicolae Grigorescu apprend le métier de peintre \
d'icônes à Bucarest. Encore adolescent, il peint des images pour des églises et des \
monastères, notamment celui d'Agapia, en Moldavie. En 1861, une bourse lui permet de \
partir pour Paris. Il passe peu de temps à l'École des beaux-arts et préfère la forêt \
de Fontainebleau, où il découvre les peintres de Barbizon et la peinture en plein air. \
Revenu en Roumanie, il expose avec succès et voyage beaucoup. En 1877, il suit l'armée \
roumaine pendant la guerre d'indépendance comme peintre officiel, et en rapporte \
croquis et tableaux de bataille. Il partage ensuite sa vie entre la France et la \
Roumanie, puis s'installe à Câmpina, au pied des Carpates, où il meurt en 1907. \
L'Académie roumaine l'avait élu membre d'honneur en 1899. Il est considéré comme le \
fondateur de la peinture roumaine moderne."""
style = """
Grigorescu a appris à Barbizon à peindre la lumière et l'air. Ses paysannes, ses \
bergers, ses chars à bœufs sur les routes poudreuses, peints d'une touche rapide et \
claire, ont fixé l'image de la campagne roumaine. Ses tableaux de guerre gardent la \
même sensibilité à l'atmosphère. Son portrait figure aujourd'hui sur le billet roumain \
de dix lei."""

[[artistes]]
nom = "Józef Chełmoński"
vie = "Boczki, près de Łowicz, 7 novembre 1849 – Kuklówka, 6 avril 1914"
biographie = """
Né dans une famille de petite noblesse de Mazovie, Józef Chełmoński grandit à la \
campagne, au milieu des chevaux et des paysans qu'il peindra toute sa vie. Il étudie à \
Varsovie auprès de Wojciech Gerson, puis à l'Académie de Munich, à partir de 1872. De \
retour à Varsovie, il partage un atelier à l'hôtel Europejski avec d'autres jeunes \
peintres et voyage en Ukraine, dont les steppes l'inspirent. En 1875, il part pour \
Paris, où il reste plus de dix ans : ses scènes de la campagne polonaise et \
ukrainienne, ses attelages lancés au galop, comme L'Attelage à quatre (Czwórka, 1881), \
connaissent le succès au Salon et chez les marchands. En 1887, il rentre en Pologne et \
s'installe bientôt à Kuklówka, un village de Mazovie, où il vit retiré et peint \
désormais des paysages, des oiseaux et des ciels. Il y meurt en 1914."""
style = """
Chełmoński est le grand peintre réaliste de la campagne polonaise : des chevaux \
fougueux, des paysans au travail ou au repos, des plaines immenses sous de grands \
ciels. Sa peinture, d'abord brune et énergique, s'apaise dans ses dernières années en \
paysages contemplatifs, perdrix dans la neige, grues et cigognes, où la nature devient \
presque sacrée."""

[[artistes]]
nom = "Pál Szinyei Merse"
vie = "Szinyeújfalu (auj. Slovaquie), 4 juillet 1845 – Jernye, 2 février 1920"
biographie = """
Issu d'une vieille famille noble de Haute-Hongrie, Pál Szinyei Merse entre en 1864 à \
l'Académie des beaux-arts de Munich, où il suit les cours d'Alexander von Wagner puis \
de Karl von Piloty. Il s'y lie avec Wilhelm Leibl, qui l'encourage à peindre en plein \
air, et quitte l'Académie en 1869 pour travailler seul. Pique-nique en mai, peint en \
1873, est accueilli par l'incompréhension. Marié la même année, accaparé par des \
soucis d'argent et de famille, découragé par la critique, il cesse de peindre en 1882 \
et ne reprend qu'une dizaine d'années plus tard. En 1894, une rétrospective organisée \
par ses amis révèle enfin son importance. Élu député en 1896, il défend la réforme de \
l'enseignement artistique, puis préside à partir de 1905 l'École supérieure des \
beaux-arts de Budapest, où il soutient les jeunes peintres de la colonie de Nagybánya. \
Il meurt à Jernye en 1920."""
style = """
Szinyei est le premier peintre hongrois du plein air : il pose côte à côte des \
couleurs pures et lumineuses, des verts et des rouges francs, pour rendre l'éclat du \
soleil. Arrivé à cette peinture claire en même temps que les impressionnistes, mais \
sans eux, il garde un dessin plus construit, hérité de Munich. Il est le précurseur de \
la peinture moderne en Hongrie."""

[[artistes]]
nom = "Tivadar Csontváry Kosztka"
vie = "Kisszeben (auj. Sabinov, Slovaquie), 5 juillet 1853 – Budapest, 20 juin 1919"
biographie = """
Tivadar Kosztka, fils d'un médecin pharmacien, devient lui-même pharmacien. En 1880, \
raconte-t-il, une voix lui annonce qu'il sera le plus grand peintre de la route du \
soleil, plus grand que Raphaël. Il travaille encore de longues années dans sa propre \
pharmacie pour réunir l'argent nécessaire, puis, à plus de quarante ans, part étudier \
la peinture à Munich, dans l'école de Simon Hollósy, en 1894, et brièvement à Paris. \
Il voyage ensuite sans relâche à la recherche de sujets grandioses : la Dalmatie, \
l'Italie, la Grèce, l'Égypte, la Palestine et le Liban, où il peint Baalbek et le \
Cèdre solitaire en 1906 et 1907. Il prend le nom de Csontváry. Ses expositions à Paris \
en 1907 et à Budapest ensuite ne rencontrent guère que la moquerie. Isolé, de plus en \
plus étrange, il cesse presque de peindre après 1910 et meurt à Budapest en 1919."""
style = """
Csontváry est inclassable : ses toiles géantes, peintes en couleurs saturées et \
irréelles, avec une précision obsessionnelle, sont des visions de lieux sacrés ou \
chargés d'histoire. Ni impressionniste ni académique, il a été rapproché des peintres \
naïfs et des expressionnistes. Redécouvert après sa mort, il est aujourd'hui l'un des \
peintres les plus aimés de Hongrie ; un musée lui est consacré à Pécs."""

[[artistes]]
nom = "Jacek Malczewski"
vie = "Radom, 15 juillet 1854 – Cracovie, 8 octobre 1929"
biographie = """
Né à Radom, dans la Pologne sous domination russe, Jacek Malczewski passe une partie \
de sa jeunesse à la campagne, chez un oncle. En 1873, il entre à l'École des \
beaux-arts de Cracovie, où il est l'élève de Jan Matejko, puis séjourne à Paris en \
1876-1877 et fréquente l'École des beaux-arts. Ses premiers grands tableaux racontent \
le destin des déportés polonais en Sibérie, inspirés du poème Anhelli de Juliusz \
Słowacki. En 1884, il participe à une expédition archéologique en Asie Mineure. Vers \
1890, son art bascule dans le symbolisme : Mélancolie, puis Le Cercle vicieux, et une \
foule de tableaux peuplés de chimères, de faunes, d'anges et de figures de la mort, où \
il se représente souvent lui-même. Professeur à l'Académie des beaux-arts de Cracovie, \
il en devient recteur en 1912. Il meurt à Cracovie en 1929 ; son fils Rafał Malczewski \
sera lui aussi peintre."""
style = """
Malczewski est le grand maître du symbolisme polonais. Il mêle des figures peintes \
avec un réalisme minutieux, paysans, insurgés, autoportraits, à des créatures \
mythologiques, dans des paysages lumineux de la campagne polonaise. Ses couleurs vives \
et son dessin solide servent des allégories sur la patrie, l'art et la mort, souvent \
énigmatiques."""

[[artistes]]
nom = "Olga Boznańska"
vie = "Cracovie, 15 avril 1865 – Paris, 26 octobre 1940"
biographie = """
Fille d'un ingénieur polonais et d'une mère française, Olga Boznańska apprend la \
peinture à Cracovie dans des cours privés, car l'École des beaux-arts n'admet pas les \
femmes. En 1886, elle part pour Munich, où elle étudie dans des ateliers privés et \
ouvre bientôt le sien. Ses portraits y sont remarqués et exposés en Europe. En 1898, \
elle s'installe à Paris, dans un atelier du boulevard du Montparnasse qu'elle ne \
quittera plus. Membre de la Société nationale des beaux-arts, elle expose dans toute \
l'Europe et aux États-Unis, et reçoit la Légion d'honneur. Elle reste pourtant \
attachée à la Pologne et envoie régulièrement ses œuvres aux expositions de Cracovie \
et de Varsovie. Elle peint surtout des portraits, mais aussi des intérieurs, des \
fleurs et des vues de Paris prises de sa fenêtre. Ses dernières années, dans un \
atelier encombré, sont marquées par la solitude et les difficultés matérielles. Elle \
meurt à Paris en 1940."""
style = """
Boznańska est avant tout portraitiste. Elle peint souvent sur carton, en touches fines \
et mates, dans une gamme de gris, de bruns et de tons voilés qui doit beaucoup à \
Whistler. Ses modèles, enveloppés d'une lumière douce, semblent perdus dans leurs \
pensées. Ses portraits, d'une grande intensité psychologique, en font l'une des \
grandes peintres européennes de son temps."""

[[artistes]]
nom = "Osman Hamdi Bey"
vie = "Constantinople, 30 décembre 1842 – Constantinople, 24 février 1910"
biographie = """
Fils du grand vizir İbrahim Edhem Pacha, Osman Hamdi est envoyé à Paris en 1860 pour \
étudier le droit ; il s'y passionne pour la peinture et fréquente les ateliers de \
peintres orientalistes. Rentré à Constantinople en 1869, il occupe diverses fonctions \
administratives, notamment à Bagdad, et organise en 1873 la participation ottomane à \
l'Exposition universelle de Vienne, pour laquelle il publie avec Marie de Launay un \
album sur les costumes populaires de la Turquie. En 1881, il devient directeur du \
Musée impérial, futur musée archéologique d'Istanbul. Il fonde l'École des beaux-arts \
de la ville, fait adopter une loi qui interdit l'exportation des antiquités, et dirige \
lui-même des fouilles, notamment à Sidon, où il découvre en 1887 la nécropole royale \
et le sarcophage dit d'Alexandre. Parallèlement, il ne cesse de peindre, exposant \
notamment au Salon de Paris. Il meurt dans sa maison de Kuruçeşme, sur le Bosphore, en \
1910."""
style = """
Osman Hamdi reprend la manière précise et lumineuse des orientalistes français, mais \
la retourne : au lieu d'un Orient rêvé par l'Occident, il peint des scènes de sa \
propre culture, souvent avec dignité et parfois avec ironie, en utilisant ses propres \
photographies et son entourage comme modèles. Il est considéré comme un pionnier de la \
peinture moderne en Turquie."""
