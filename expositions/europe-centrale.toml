[exposition]
ordre = 128
nom_court = "Europe centrale"
mouvement = "Europe centrale et orientale, XIXᵉ siècle"
cadre = "dore"
couleur = "#7d2f3a"
titre = "Europe centrale et orientale, les peintres des nations"
artiste = "Matejko, Mucha, Munkácsy, Boznańska, Csontváry, Osman Hamdi…"
dates = "1862–1912"
accroche = "Exposition virtuelle · Galerie des Sukiennice, Cracovie"
introduction = """
De Cracovie à Budapest, de Prague à Bucarest et à Istanbul, les peintres du XIXᵉ \
siècle formés à Munich, à Vienne ou à Paris rentrent chez eux avec une mission : \
donner une image à des peuples sans État ou à des États tout neufs. La visite réunit \
onze artistes polonais, tchèques, hongrois, roumain et ottoman, de la grande peinture \
d'histoire de Matejko et de Mucha au réalisme paysan, au plein air de Szinyei Merse et \
aux visions de Malczewski et de Csontváry. Le bâtiment s'inspire de la galerie de \
peinture polonaise du XIXᵉ siècle installée à l'étage de la halle aux draps de \
Cracovie, les Sukiennice : un vestibule, puis quatre grandes salles en enfilade, aux \
murs colorés comme ceux d'un salon d'autrefois."""
vitrine = "stanczyk.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Galerie de la peinture polonaise du XIXᵉ siècle aux Sukiennice"
ville = "Cracovie, Pologne"
architecte = "Tomasz Pryliński (restauration de 1875–1879)"
construction = "Halle médiévale ; galerie ouverte en 1879"
presentation = """
Au milieu de la grande place du Marché de Cracovie, les Sukiennice, la halle aux \
draps, abritent depuis le Moyen Âge les échoppes des marchands. Après un incendie en \
1555, le bâtiment gothique reçoit un couronnement Renaissance, un attique orné de \
mascarons. De 1875 à 1879, sous le maire Mikołaj Zyblikiewicz, la ville le fait \
restaurer par l'architecte Tomasz Pryliński, qui mêle le gothique et la Renaissance. \
Le 7 octobre 1879, le conseil municipal y fonde le Musée national de Cracovie ; le \
peintre Henryk Siemiradzki offre, pour commencer la collection, sa toile géante Les \
Torches de Néron. Les quatre grandes salles de l'étage portent aujourd'hui le nom de \
Bacciarelli, Michałowski, Siemiradzki et Chełmoński, et retracent la peinture \
polonaise des Lumières au symbolisme, chacune autour d'un tableau central, comme dans \
un salon du XIXᵉ siècle. Fermée de 2006 à 2010 pour une grande rénovation, la galerie \
a rouvert en 2010."""
ici = """
Le bâtiment d'ARTEON reprend l'idée de l'étage des Sukiennice : quatre grandes salles \
identiques, de dix-huit mètres sur quatorze et hautes de neuf, en enfilade d'ouest en \
est, chacune avec une œuvre maîtresse au centre du mur nord. On entre par le sud dans \
un vestibule couleur de pierre, puis dans la salle « Histoire et légende », rouge \
pompéien, où attend l'Épopée slave de Mucha. On traverse ensuite, de porte en porte, \
la salle « Le peuple et la guerre », vert de gris, la salle « Le plein air », ocre, et \
enfin la salle « Énigmes et symboles », d'un mauve grisé."""

