# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « RENOIR » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/renoir/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /renoir.
#
#  Pour ajouter une œuvre :
#    1. déposer son image (JPEG ou PNG) dans public/tableaux/renoir/ ;
#    2. copier un bloc [[oeuvres]] ci-dessous et changer ses valeurs.
#  Au prochain push sur master, le site est reconstruit et republié tout seul.
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 3
nom_court = "Renoir"
couleur = "#b5476b"
titre = "Renoir, le bonheur de peindre"
artiste = "Pierre-Auguste Renoir"
dates = "1841–1919"
accroche = "Exposition virtuelle · Pierre-Auguste Renoir"
introduction = """
Les bals de Montmartre, les déjeuners au bord de la Seine, les enfants et les \
jeunes filles : Renoir peint le Paris joyeux de la fin du XIXᵉ siècle, dans une \
lumière qui danse à travers les feuillages. Dix toiles, de La Loge aux Jeunes \
filles au piano, en passant par ses trois grandes danses."""
vitrine = "moulin-galette.jpg"

# ─── Les salles, dans l'ordre de la visite ───────────────────────────────────

[[salles]]
nom = "Salle I · Les années impressionnistes"
theme = "1874–1876 : le théâtre, les jardins et le grand bal de Montmartre, au cœur du groupe impressionniste."
murs = "#f1e6dc"

[[salles]]
nom = "Salle II · La vie moderne"
theme = "1880–1886 : les canotiers de Chatou, les terrasses, les rues de Paris sous la pluie."
murs = "#e9e3ee"

[[salles]]
nom = "Salle III · Danses et jeunes filles"
theme = "1883–1892 : les trois grandes danses, côte à côte au fond de la galerie, et la douceur de la dernière manière."
murs = "#f3e4e6"

# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "La Loge"
annee = "1874"
image = "loge.jpg"
technique = "Huile sur toile, 80 × 63,5 cm"
collection = "The Courtauld, Londres"
note = "Présentée à la première exposition impressionniste : une élégante en robe rayée, et son frère Edmond qui lorgne la salle."
salle = 1
mur = "gauche"
place = 1
largeur = 1.0

