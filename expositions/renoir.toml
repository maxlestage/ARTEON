[[artistes]]
nom = "Pierre-Auguste Renoir"
vie = "Limoges, 25 février 1841 – Cagnes-sur-Mer, 3 décembre 1919"
biographie = """
Fils d'un tailleur et d'une couturière, Pierre-Auguste Renoir naît à Limoges en 1841 \
et grandit à Paris, près du Louvre, où sa famille s'installe quand il a trois ans. À \
treize ans, il entre en apprentissage chez un peintre sur porcelaine, puis décore des \
éventails et des stores. En 1862, il est admis à l'École des beaux-arts et fréquente \
l'atelier de Charles Gleyre, où il se lie avec Claude Monet, Alfred Sisley et Frédéric \
Bazille. En 1869, il peint avec Monet à La Grenouillère, au bord de la Seine : c'est \
là que s'élabore, chez les deux amis, la touche impressionniste. Après la guerre de \
1870, il participe en 1874 à la première exposition du groupe, puis aux suivantes, \
dans une grande pauvreté. Le succès vient peu à peu, grâce aux portraits commandés par \
la bourgeoisie, notamment celui de Madame Charpentier et ses enfants, salué au Salon \
de 1879, et au soutien du marchand Paul Durand-Ruel. En 1881, un voyage en Algérie \
puis en Italie, où il découvre Raphaël et les fresques de Pompéi, ouvre une période de \
doute et de dessin plus sévère. Il épouse en 1890 Aline Charigot, qui lui donne trois \
fils : Pierre, acteur, Jean, futur cinéaste, et Claude. Atteint à partir des années \
1890 d'une polyarthrite qui déforme ses mains, il acquiert en 1907 le domaine des \
Collettes, à Cagnes-sur-Mer, et continue à peindre, un pinceau glissé entre ses \
doigts. Aline meurt en 1915. Quelques mois avant sa mort, en 1919, Renoir peut voir \
l'une de ses toiles accrochée au Louvre."""
style = """
Renoir est le peintre du bonheur : bals, déjeuners, enfants, femmes et fleurs, saisis \
dans une lumière chaude qui caresse les peaux et filtre à travers les feuillages. Sa \
touche impressionniste, légère et colorée, fait vibrer les taches de soleil et les \
ombres bleues. Après 1881, il cherche davantage de dessin et de solidité, avant de \
revenir à une manière plus fondue, nacrée, aux tons rouges et dorés, qui culmine dans \
ses nus tardifs. Héritier de Rubens et des peintres du XVIIIᵉ siècle, il a influencé \
Bonnard, Matisse et le Picasso des années 1920, qui admiraient sa sensualité de la \
couleur et des formes."""
