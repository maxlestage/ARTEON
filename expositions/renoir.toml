# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « RENOIR » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/renoir/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /renoir.
#
#  Pour ajouter une œuvre :
#    1. déposer son image (JPEG ou PNG) dans public/tableaux/renoir/ ;
#    2. copier un bloc [[oeuvres]] ci-dessous et changer ses valeurs.
#  Au prochain push sur master, le site est reconstruit et republié tout seul.
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 100
nom_court = "Renoir"
mouvement = "Impressionnisme"
couleur = "#b5476b"
titre = "Renoir, le bonheur de peindre"
artiste = "Pierre-Auguste Renoir"
dates = "1841–1919"
accroche = "Exposition virtuelle · Pierre-Auguste Renoir"
introduction = """
Les bals de Montmartre, les déjeuners au bord de la Seine, les enfants et les \
jeunes filles : Renoir peint le Paris joyeux de la fin du XIXᵉ siècle, dans une \
lumière qui danse à travers les feuillages. Dix toiles, de La Loge aux Jeunes \
filles au piano, en passant par ses trois grandes danses."""
vitrine = "moulin-galette.jpg"

# ─── Les salles, dans l'ordre de la visite ───────────────────────────────────

[[salles]]
nom = "Salle I · Les années impressionnistes"
theme = "1874–1876 : le théâtre, les jardins et le grand bal de Montmartre, au cœur du groupe impressionniste."
murs = "#f1e6dc"

[[salles]]
nom = "Salle II · La vie moderne"
theme = "1880–1886 : les canotiers de Chatou, les terrasses, les rues de Paris sous la pluie."
murs = "#e9e3ee"

[[salles]]
nom = "Salle III · Danses et jeunes filles"
theme = "1883–1892 : les trois grandes danses, côte à côte au fond de la galerie, et la douceur de la dernière manière."
murs = "#f3e4e6"

# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "La Loge"
annee = "1874"
image = "loge.jpg"
technique = "Huile sur toile, 80 × 63,5 cm"
collection = "The Courtauld, Londres"
note = "Présentée à la première exposition impressionniste : une élégante en robe rayée, et son frère Edmond qui lorgne la salle."
description = """
Dans une loge de théâtre, une jeune femme se tient au premier plan, les bras posés sur \
le rebord de velours. Elle porte une robe à larges rayures noires et blanches, un \
collier de perles, des boucles d'oreilles, des fleurs piquées dans les cheveux et des \
roses au décolleté. Sa main gantée de blanc serre une paire de jumelles de théâtre et \
un éventail. Elle ne regarde pas la scène : son visage, légèrement tourné vers nous, \
semble s'offrir aux regards du public. Derrière elle, dans la pénombre, un homme en \
habit noir et plastron blanc lève ses propres jumelles vers le haut de la salle. Le \
cadrage est très serré : on ne voit ni la scène, ni les autres loges, seulement ce \
couple découpé comme dans un instantané."""
evocation = """
Le tableau montre le théâtre comme un lieu où l'on vient autant pour être vu que pour \
voir. La jeune femme, immobile et parée, se laisse contempler, tandis que son \
compagnon braque ses jumelles ailleurs, peut-être vers une autre loge : on y a lu une \
petite comédie des regards, typique de la sociabilité parisienne des années 1870. Son \
visage, aimable mais absent, ne livre rien de ce qu'elle pense, et l'on ne sait si \
elle s'ennuie, attend ou pose. Pour les historiens, l'œuvre affirme aussi une ambition \
: prouver qu'un peintre de la vie moderne peut égaler les portraits mondains du Salon, \
non en peignant des princesses, mais des Parisiens d'aujourd'hui, saisis dans leurs \
plaisirs du soir."""
histoire = """
Renoir peint La Loge en 1874 dans son atelier, avec deux proches pour modèles : son \
frère cadet Edmond, journaliste, pose pour l'homme aux jumelles, et une jeune femme de \
Montmartre connue sous le nom de Nini pour l'élégante. En avril 1874, la toile figure \
à la première exposition du groupe qu'on appellera bientôt impressionniste, dans \
l'ancien atelier du photographe Nadar, boulevard des Capucines. Elle est plutôt bien \
reçue par une critique souvent hostile au groupe. Renoir, toujours à court d'argent, \
la vend peu après au petit marchand surnommé le père Martin pour 425 francs, de quoi \
payer son loyer. Après plusieurs propriétaires, le tableau est acheté dans les années \
1920 par l'industriel britannique Samuel Courtauld, qui le donne ensuite à l'institut \
d'histoire de l'art qu'il fonde à Londres."""
facture = """
Tout repose sur le contraste des rayures noires et blanches. Renoir y emploie un noir \
velouté, nuancé de bleu, à rebours de l'idée selon laquelle les impressionnistes \
bannissaient cette couleur. Le visage et la gorge sont modelés en touches fondues, \
presque lisses, alors que les fleurs, la dentelle et les gants sont enlevés en petites \
touches rapides et brillantes. La lumière artificielle de la salle n'a pas de source \
visible : elle se dépose sur la peau, les perles et le plastron. Le cadrage, qui coupe \
la loge et relègue l'homme dans l'ombre, rappelle les audaces de mise en page de Degas \
et des estampes japonaises."""
details = [
  "Les jumelles de l'homme, pointées vers le haut de la salle et non vers la scène.",
  "Les roses posées sur le décolleté, qui répondent aux fleurs des cheveux.",
  "La main gantée de blanc qui tient à la fois les jumelles et l'éventail.",
  "Les reflets bleutés dans les noirs de la robe et de l'habit.",
  "Le rebord de la loge, coupé net par le bas du cadre.",
]
themes = ["théâtre", "regard", "élégance", "vie parisienne", "portrait"]
anecdote = """
L'homme aux jumelles, Edmond Renoir, s'occupe la même année du catalogue de la \
première exposition impressionniste. Selon le récit de Monet, c'est parce qu'Edmond \
trouvait ses titres trop monotones que le peintre proposa pour une vue du Havre le mot \
« Impression », qui allait donner son nom au mouvement."""
salle = 1
mur = "gauche"
place = 1
largeur = 1.0

[[oeuvres]]
titre = "La Fillette à l'arrosoir"
annee = "1876"
image = "arrosoir.jpg"
technique = "Huile sur toile, 100 × 73 cm"
collection = "National Gallery of Art, Washington"
note = "Une petite fille en velours bleu dans un jardin en fleurs, peinte en touches vives et légères."
description = """
Une toute petite fille se tient debout, bien droite, au milieu d'une allée de jardin. \
Elle porte une robe de velours bleu sombre, bordée de dentelle blanche au col et aux \
poignets, et un nœud rouge retient ses cheveux blonds. D'une main, elle tient un petit \
arrosoir de métal ; de l'autre, quelques fleurs cueillies. Ses joues roses et son \
regard sérieux sont tournés vers le spectateur. Autour d'elle, le jardin déborde : \
massifs de fleurs rouges, blanches et jaunes, pelouse, buissons d'un vert dense. \
L'allée sablonneuse s'enfonce en serpentant derrière elle et ouvre une profondeur. La \
ligne d'horizon est placée très haut, si bien que l'enfant se détache sur un fond \
presque entièrement fait de verdure et de fleurs."""
evocation = """
Renoir fait de l'enfance un moment de grâce, et du jardin une sorte de petit paradis \
domestique. Le contraste est frappant entre la fillette, plantée là avec la gravité \
d'une grande personne qui pose, et la nature qui frémit autour d'elle : on y a vu à la \
fois l'innocence et la fragilité d'un âge qui passe vite. Le tableau dit aussi la \
place nouvelle de l'enfant dans la famille bourgeoise de la fin du XIXᵉ siècle, choyé, \
habillé avec soin et digne d'être peint pour lui-même. Pour Renoir, ces portraits \
d'enfants, sans drame ni anecdote, sont l'occasion de célébrer ce qu'il aime le plus \
peindre : la fraîcheur d'une peau, la douceur d'une étoffe et la lumière d'un jour \
d'été."""
histoire = """
La toile date de 1876, l'année où Renoir travaille aussi au Bal du moulin de la \
Galette et participe à la deuxième exposition impressionniste, chez le marchand \
Durand-Ruel. À cette époque, ses grandes compositions se vendent mal, et les portraits \
d'enfants commandés par des familles aisées lui assurent une part essentielle de ses \
revenus. L'identité de la petite fille n'est pas établie avec certitude, et plusieurs \
noms ont été proposés sans preuve décisive. Le tableau passe ensuite par diverses \
collections avant de traverser l'Atlantique. Il entre dans la collection du banquier \
new-yorkais Chester Dale, qui réunit avec sa femme Maud un remarquable ensemble de \
peinture française. À sa mort, Dale lègue ses tableaux à la National Gallery of Art de \
Washington, qui les reçoit en 1963."""
facture = """
Renoir oppose deux manières dans la même toile. Le visage et les mains sont peints en \
touches fines et fondues, d'une grande délicatesse. Le jardin, lui, est fait de \
virgules de couleur pure, rouges, jaunes, blanches et vertes, posées côte à côte sans \
contour, qui vibrent à distance. La robe joue sur toute une gamme de bleus et de \
violets, et la dentelle est indiquée par quelques empâtements blancs. La lumière est \
diffuse, sans ombre dure : même les zones d'ombre restent colorées, bleutées ou \
verdâtres, selon le principe impressionniste."""
details = [
  "Le nœud rouge dans les cheveux, seule note vive près du visage.",
  "Le petit bouquet de fleurs serré dans une main de l'enfant.",
  "La dentelle blanche du col et des poignets, posée en quelques touches épaisses.",
  "L'allée qui serpente derrière la fillette et entraîne l'œil vers le fond.",
]
themes = ["enfance", "jardin", "fleurs", "portrait", "été"]
anecdote = """
Le legs de Chester Dale à la National Gallery of Art s'accompagne d'une condition : \
les tableaux de sa collection ne doivent pas être prêtés. Pour voir la Fillette à \
l'arrosoir, il faut donc presque toujours faire le voyage jusqu'à Washington."""
salle = 1
mur = "droite"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Bal du moulin de la Galette"
annee = "1876"
image = "moulin-galette.jpg"
technique = "Huile sur toile, 131 × 175 cm"
collection = "Musée d'Orsay, Paris"
note = "Un dimanche après-midi à Montmartre : la lumière tombe en taches à travers les acacias sur les danseurs."
description = """
Une cour de guinguette au sommet de Montmartre, un dimanche ensoleillé. À gauche et au \
centre, des couples dansent ; à droite, au premier plan, un groupe de jeunes gens \
s'est installé sur un banc et autour d'une table où brillent des verres. Une jeune \
femme en robe rayée rose et bleu se penche vers un homme vu de dos, coiffé d'un \
canotier, tandis qu'une autre, debout derrière elle, pose la main sur son épaule. Au \
centre gauche, une danseuse en robe rose tourne avec son cavalier. Plus loin, la foule \
se perd dans un fourmillement de chapeaux de paille, de hauts-de-forme et de robes \
claires. Des globes de lumière, accrochés à de minces poteaux, flottent au-dessus des \
têtes. On ne voit aucun bâtiment : seulement des arbres et des visages."""
evocation = """
Le tableau célèbre une joie collective : celle des employés, des ouvrières, des \
couturières et des artistes qui se retrouvent le dimanche pour danser. Les classes se \
frôlent, les regards se croisent, on flirte sans gravité. Renoir donne de ce bal une \
image heureuse, sans ivresse ni misère, alors que le Montmartre de l'époque était un \
quartier pauvre et que Zola, la même année, publiait L'Assommoir. On a souvent \
souligné cette part d'idéalisation : Renoir ne cherche pas à dénoncer, mais à montrer \
que le bonheur ordinaire mérite une grande toile. Son ami Georges Rivière, qui a posé \
pour lui, défend alors le tableau comme un témoignage précis de la vie parisienne, \
digne des toiles d'histoire."""
histoire = """
Le Moulin de la Galette, guinguette installée près des derniers moulins de la Butte, \
tirait son nom des galettes qu'on y servait. En 1876, Renoir loue rue Cortot un \
atelier avec jardin, aujourd'hui le musée de Montmartre, et selon les souvenirs de \
Rivière, ses amis l'aident à transporter chaque jour la grande toile jusqu'au bal. Ces \
amis lui servent de modèles, avec des jeunes femmes du quartier comme Estelle, sur le \
banc, ou Margot, qui danse au centre avec le peintre cubain Pedro Vidal de Solares. Le \
tableau est présenté à la troisième exposition impressionniste, en 1877. Le peintre et \
collectionneur Gustave Caillebotte l'achète, puis le lègue à l'État à sa mort en 1894. \
Accepté après de longues discussions, il entre au musée du Luxembourg, puis au Louvre, \
et enfin au musée d'Orsay à son ouverture, en 1986."""
facture = """
La lumière est le vrai sujet : les taches de soleil filtrées par le feuillage sont \
posées en touches de blanc, de rose et de jaune sur les vestes sombres, les robes, les \
visages et le sol. Les ombres sont bleues ou violettes, jamais noires. La composition \
progresse en diagonale, du groupe du premier plan, coupé par le cadre, vers la foule \
qui se dissout au fond. Aucun point central ne domine : l'œil circule de visage en \
visage, comme on se promène dans le bal. Le noir des vêtements masculins rythme \
l'ensemble et fait chanter les tons clairs."""
details = [
  "Les taches de soleil rose et jaune sur la veste sombre de l'homme vu de dos.",
  "Les verres posés sur la table du premier plan, où joue la lumière.",
  "Le couple qui danse au centre gauche, la jeune femme en rose.",
  "Les globes de lumière suspendus au-dessus de la foule.",
  "Au fond, la mer de canotiers et de hauts-de-forme.",
]
themes = ["fête", "danse", "montmartre", "lumière", "jeunesse", "dimanche"]
anecdote = """
Renoir a peint une version plus petite de la même scène. Mise aux enchères à New York \
en mai 1990, elle a été adjugée 78,1 millions de dollars à l'industriel japonais Ryoei \
Saito, l'un des prix les plus élevés jamais atteints à l'époque pour un tableau."""
salle = 1
mur = "fond"
place = 1
largeur = 2.0

[[oeuvres]]
titre = "Le Déjeuner des canotiers"
annee = "1880–1881"
image = "dejeuner-canotiers.jpg"
technique = "Huile sur toile, 130 × 173 cm"
collection = "The Phillips Collection, Washington"
note = "Sur la terrasse de la maison Fournaise, à Chatou : ses amis, et Aline, sa future femme, qui joue avec un petit chien."
description = """
Sur le balcon d'un restaurant au bord de la Seine, sous un auvent rayé rouge et blanc, \
une quinzaine de personnes s'attardent à la fin d'un déjeuner. La table, couverte \
d'une nappe blanche, porte des bouteilles, des verres et des grappes de raisin. À \
gauche, une jeune femme au chapeau fleuri approche son visage d'un petit chien. \
Derrière elle, un grand gaillard en maillot blanc et canotier s'appuie à la \
balustrade. À droite, au premier plan, un jeune homme assis à califourchon sur une \
chaise bavarde avec une jeune femme et un homme penché vers elle. Au centre, une femme \
boit dans son verre ; au fond, des hommes en canotier, en chapeau melon ou en \
haut-de-forme conversent. Entre les feuillages, on aperçoit le fleuve et des voiles."""
evocation = """
Le tableau est un hymne à l'amitié et aux loisirs nouveaux des Parisiens, que le \
chemin de fer conduit en quelques minutes de la gare Saint-Lazare aux rives de la \
Seine. Autour de la même table se mêlent un collectionneur fortuné, une actrice, des \
couturières, des canotiers et des peintres : on y a vu l'image d'une société plus \
libre, où l'on se retrouve par goût plutôt que par rang. Chaque visage est un \
portrait, et l'ensemble ressemble à un album de souvenirs. On y lit aussi le bonheur \
personnel de Renoir, qui place au premier plan la jeune femme dont il vient de tomber \
amoureux. Le moment choisi, la fin du repas, quand on bavarde sans se presser de \
partir, dit le prix du temps libre."""
histoire = """
Renoir travaille à cette grande toile de l'été 1880 à 1881, à la maison Fournaise, \
restaurant et loueur de bateaux de l'île de Chatou, dont il est un habitué. Ses amis \
viennent poser un à un : le fils et la fille du patron, Alphonse et Alphonsine \
Fournaise, Aline Charigot, le peintre Gustave Caillebotte, l'actrice Ellen Andrée, le \
collectionneur Charles Ephrussi, l'actrice Jeanne Samary et d'autres encore. Les \
analyses montrent qu'il a modifié la composition en cours de route. Le marchand Paul \
Durand-Ruel achète le tableau et le présente à la septième exposition impressionniste, \
en 1882. Il reste dans sa famille jusqu'en 1923, date à laquelle le collectionneur \
américain Duncan Phillips l'acquiert pour 125 000 dollars. Il devient la pièce \
maîtresse de son musée de Washington, la Phillips Collection."""
facture = """
Renoir réunit en une seule toile le portrait de groupe, la scène de genre, la nature \
morte et le paysage. La table est un morceau de bravoure : verres, bouteilles et \
raisins scintillent sur une nappe dont les blancs se teintent de bleu et de rose. Les \
maillots blancs des canotiers déclinent eux aussi toute une gamme de blancs. La \
balustrade, en diagonale, conduit l'œil vers le fond, tandis que l'auvent ferme la \
composition en haut. Les visages sont plus nettement dessinés que dans le Bal du \
moulin de la Galette, signe que la manière de Renoir commence à évoluer."""
details = [
  "Le petit chien qu'Aline tient tout contre son visage, au premier plan à gauche.",
  "La nature morte de la nappe : bouteilles, verres à demi pleins et raisins.",
  "La jeune femme qui boit, son verre masquant le bas de son visage.",
  "Au fond, le haut-de-forme du collectionneur Charles Ephrussi.",
  "Entre les feuillages, des voiles blanches sur la Seine.",
]
themes = ["amitié", "canotage", "seine", "loisirs", "repas", "été"]
anecdote = """
La jeune femme qui boit au centre est Ellen Andrée, actrice et modèle très demandée. \
Quelques années plus tôt, elle avait posé pour Degas dans L'Absinthe, attablée l'air \
absent dans un café de la place Pigalle, une image bien plus sombre de la vie \
parisienne."""
salle = 2
mur = "gauche"
place = 1
largeur = 1.9

[[oeuvres]]
titre = "Deux Sœurs (Sur la terrasse)"
annee = "1881"
image = "deux-soeurs.jpg"
technique = "Huile sur toile, 100,5 × 81 cm"
collection = "Art Institute of Chicago"
note = "Une jeune femme et une fillette au chapeau fleuri, sur la terrasse de la maison Fournaise, devant la Seine."
description = """
Sur une terrasse au bord de l'eau, une jeune femme est assise, vêtue d'une robe bleu \
sombre et coiffée d'un chapeau rouge vif. Devant elle, une fillette en robe blanche \
porte un chapeau couvert de fleurs de toutes les couleurs. Ses mains reposent sur le \
bord d'une corbeille remplie de pelotes de laine. Les deux visages, aux joues roses, \
se tournent vers le spectateur sans vraiment le regarder. Derrière la balustrade, un \
rideau de feuillages et d'arbustes en fleurs laisse entrevoir, plus loin, l'eau de la \
Seine et la rive opposée. Les deux figures occupent toute la moitié inférieure de la \
toile ; le paysage, au-dessus, semble presque un décor tendu derrière elles."""
evocation = """
Le tableau oppose deux âges de la vie : l'enfance, encore ronde et naïve, et la \
jeunesse qui s'épanouit. Les fleurs des chapeaux répondent à celles du jardin, et l'on \
a souvent remarqué que Renoir assimile ses modèles féminins à la nature, à la fois \
fraîches, décoratives et un peu rêveuses, une vision que certains historiens jugent \
aujourd'hui idéalisée. La scène n'a pas d'histoire à raconter : elle installe un \
moment de calme, une pause dans une journée d'été, loin de Paris. L'œuvre dit aussi le \
goût de la bourgeoisie pour les rives de la Seine, devenues le terrain de jeu du \
dimanche."""
histoire = """
Renoir peint la toile au printemps 1881 sur la terrasse de la maison Fournaise, à \
Chatou, au moment même où il achève le Déjeuner des canotiers dans le même lieu. Le \
marchand Paul Durand-Ruel l'achète dès l'été 1881, signe que la peinture de Renoir \
commence à trouver preneur. Le tableau est présenté en 1882 à la septième exposition \
impressionniste, sous le titre « Sur la terrasse ». Il quitte ensuite la France pour \
les États-Unis et entre à l'Art Institute of Chicago en 1933, avec la collection \
réunie par Annie Swan Coburn et léguée en mémoire d'elle et de son mari, Lewis Larned \
Coburn. Il est devenu l'une des œuvres les plus populaires du musée."""
facture = """
Les visages et les mains, lisses et nacrés, rappellent que Renoir a débuté comme \
peintre sur porcelaine. Le fond, au contraire, est traité à grands coups de pinceau, \
en touches libres de vert, de bleu et de blanc, si bien que les figures paraissent \
posées devant une toile de fond. Les couleurs sont franches : le rouge du chapeau, le \
bleu de la robe, le blanc de l'enfant et les tons vifs des pelotes forment un accord \
éclatant. Les deux personnages s'inscrivent dans une composition en pyramide, stable \
et serrée."""
details = [
  "Les pelotes de laine multicolores dans la corbeille, au premier plan.",
  "Le chapeau de la fillette, couvert de fleurs de toutes les couleurs.",
  "Le rouge vif du chapeau de la jeune femme, tache la plus intense du tableau.",
  "Au loin, à travers les feuilles, l'eau de la Seine et l'autre rive.",
  "Le passage brutal entre les visages lisses et le fond à peine brossé.",
]
themes = ["jeunesse", "enfance", "chatou", "fleurs", "terrasse"]
anecdote = """
Malgré son titre, le tableau ne représente pas deux sœurs : la jeune femme est Jeanne \
Darlot, qui deviendra actrice, et la fillette n'a jamais été identifiée avec \
certitude. Le titre « Deux Sœurs » s'est imposé plus tard, à côté de celui choisi par \
Renoir."""
salle = 2
mur = "droite"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Les Parapluies"
annee = "vers 1881–1886"
image = "parapluies.jpg"
technique = "Huile sur toile, 180 × 115 cm"
collection = "National Gallery, Londres"
note = "Commencée en touches impressionnistes, achevée en lignes plus nettes : on voit le style de Renoir changer dans un même tableau."
description = """
Une rue de Paris sous l'averse. Une foule de passants se presse sous des parapluies \
bleu-gris qui forment au-dessus d'eux un toit irrégulier. À droite, une femme élégante \
accompagne deux fillettes ; la plus petite tient un cerceau et sa baguette, et la plus \
grande lève les yeux vers nous. À gauche, au premier plan, une jeune femme tête nue, \
sans parapluie, porte un carton à chapeau au bras et relève un peu sa jupe : sans \
doute une modiste ou une couturière qui livre son ouvrage. Derrière elle, un homme \
barbu la regarde, comme s'il allait lui proposer de l'abriter. Au fond, d'autres \
parapluies et d'autres silhouettes se chevauchent. Les bords du tableau coupent les \
personnages, comme si la foule continuait au-delà."""
evocation = """
Le tableau raconte la grande ville moderne, celle des boulevards haussmanniens, où des \
inconnus de toutes conditions se croisent un instant. Le parapluie y devient un signe \
social : la famille bourgeoise de droite en est pourvue, la jeune ouvrière de gauche \
n'en a pas. On y a lu une scène de rencontre, voire de galanterie, entre l'homme barbu \
et la passante. Mais l'œuvre évoque aussi la crise de Renoir au début des années 1880 \
: il racontera plus tard au marchand Ambroise Vollard qu'il avait alors le sentiment \
d'être allé au bout de l'impressionnisme et de ne plus savoir ni peindre ni dessiner. \
Le tableau garde la trace de ce doute et de cette recherche."""
histoire = """
Renoir commence la toile vers 1881 et peint d'abord la partie droite. Il la reprend \
quelques années plus tard, vers 1885–1886, et repeint largement la partie gauche. Les \
radiographies montrent que la jeune femme au carton à chapeau était d'abord habillée \
autrement. Le marchand Paul Durand-Ruel achète le tableau en 1892. Il passe plus tard \
au collectionneur irlandais Hugh Lane, mort en 1915 dans le naufrage du Lusitania. Son \
testament léguait sa collection à la National Gallery de Londres, mais un codicille, \
signé sans témoins, la destinait à Dublin. Après des décennies de dispute, un accord a \
été trouvé : Les Parapluies, comme d'autres tableaux de Lane, est présenté tour à tour \
à Londres et à la Hugh Lane Gallery de Dublin."""
facture = """
Les deux étapes se lisent à l'œil nu. À droite, les visages et les vêtements sont \
peints en touches légères et fondues, aux contours flous, dans l'esprit des années \
impressionnistes. À gauche, la jeune femme est cernée d'un contour net, son visage \
modelé avec fermeté, sous l'influence de Raphaël et d'Ingres que Renoir a étudiés \
après son voyage en Italie de 1881. Une harmonie de bleus et de gris, presque \
monochrome, unifie le tout. Les courbes des parapluies, répétées et superposées, \
créent un rythme qui rappelle les estampes japonaises."""
details = [
  "Le cerceau et la baguette que tient la petite fille, à droite.",
  "Le carton à chapeau au bras de la jeune femme sans parapluie, à gauche.",
  "Le regard de l'homme barbu posé sur la passante.",
  "La différence de touche entre les visages flous de droite et celui, net, de gauche.",
  "Les parapluies qui se chevauchent et cachent entièrement le ciel.",
]
themes = ["pluie", "ville", "foule", "mode", "paris"]
anecdote = """
Les historiens ont pu dater les deux étapes du tableau grâce à la mode féminine : les \
robes et chapeaux des personnages de droite correspondent au début des années 1880, \
tandis que la tenue de la jeune femme de gauche suit la mode de 1885–1886."""
salle = 2
mur = "gauche"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Danse à Bougival"
annee = "1883"
image = "danse-bougival.jpg"
technique = "Huile sur toile, 181,9 × 98,1 cm"
collection = "Museum of Fine Arts, Boston"
note = "Une guinguette au bord de la Seine : le modèle est Suzanne Valadon, qui deviendra elle-même peintre."
description = """
Un couple danse au premier plan, presque grandeur nature, sous les arbres d'une \
guinguette en plein air. La jeune femme, en robe blanche à volants, coiffée d'un \
bonnet rouge, se laisse entraîner, une main sur l'épaule de son cavalier ; son visage \
rosi se détourne légèrement de lui. L'homme, en costume bleu sombre, se penche vers \
elle avec insistance ; le large bord de son canotier cache presque tout son visage, \
dont on ne voit que la barbe. Derrière eux, d'autres personnes sont attablées et \
bavardent sous les feuillages, dans une lumière verte et dorée. Au sol, au premier \
plan, traînent des allumettes et des bouts de cigarette. Le format très étiré en \
hauteur concentre tout sur les deux corps enlacés."""
evocation = """
Le tableau saisit un moment de séduction : l'homme se rapproche, presque pressant, \
tandis que la jeune femme détourne la tête, entre pudeur, jeu et abandon. Rien n'est \
dit, tout est suggéré, et cette ambiguïté fait le charme de la scène. On y voit aussi \
les plaisirs populaires des bords de Seine, où les Parisiens viennent le dimanche \
boire, canoter et danser. Les détails triviaux du sol rappellent que la fête a ses \
lendemains. Comparée à la Danse à la ville, plus guindée, la Danse à Bougival exprime \
l'élan et la liberté d'une jeunesse modeste, et l'on a souvent souligné le mouvement \
tournoyant de la valse que Renoir parvient à suggérer."""
histoire = """
Renoir peint la toile en 1883, la même année que les deux danses du musée d'Orsay, de \
format comparable. Bougival, village des bords de Seine à l'ouest de Paris, était \
alors réputé pour ses guinguettes, non loin de La Grenouillère où Renoir et Monet \
avaient travaillé côte à côte en 1869. Le cavalier est Paul Lhote, ami du peintre et \
journaliste ; la danseuse est Suzanne Valadon, jeune modèle de Montmartre. Renoir tire \
de la composition un dessin publié la même année dans la revue La Vie moderne, pour \
illustrer une nouvelle de Lhote. Après être passé par plusieurs collections, le \
tableau est acheté en 1937 par le Museum of Fine Arts de Boston, dont il est \
aujourd'hui l'une des œuvres les plus célèbres."""
facture = """
Renoir construit la scène sur le contraste du bleu sombre du costume masculin et du \
blanc de la robe, que réveille le rouge du bonnet, placé presque au centre. Les \
contours des figures sont plus fermes qu'à l'époque du Bal du moulin de la Galette, \
alors que l'arrière-plan reste traité en touches libres et vibrantes de vert et de \
jaune. Le mouvement naît de l'inclinaison des corps et du tourbillon de l'ourlet de la \
robe. Le format vertical et la taille réelle des personnages donnent au spectateur \
l'impression d'être au bord de la piste."""
details = [
  "Les allumettes et les bouts de cigarette jetés au sol, au premier plan.",
  "Le bord du canotier qui cache presque entièrement le visage de l'homme.",
  "Le bonnet rouge de la danseuse, éclat de couleur au cœur de la toile.",
  "Le bas de la robe qui tournoie avec le mouvement de la danse.",
  "Au fond, des consommateurs attablés sous les arbres.",
]
themes = ["danse", "guinguette", "couple", "séduction", "seine"]
anecdote = """
Suzanne Valadon avait débuté comme acrobate de cirque avant qu'une chute ne l'oblige à \
arrêter ; elle devint alors modèle. En décembre 1883, l'année même du tableau, elle \
donna naissance à un fils, Maurice, qui deviendra le peintre Maurice Utrillo."""
salle = 3
mur = "fond"
place = 1
largeur = 0.95

[[oeuvres]]
titre = "Danse à la ville"
annee = "1883"
image = "danse-ville.jpg"
technique = "Huile sur toile, 180 × 90 cm"
collection = "Musée d'Orsay, Paris"
note = "Le pendant chic de la Danse à la campagne : satin blanc, gants longs et palmiers d'un salon parisien."
description = """
Dans un salon, un couple valse, presque grandeur nature. La jeune femme, vue de trois \
quarts, porte une longue robe de bal en satin blanc dont la traîne glisse sur le \
parquet, et de longs gants blancs qui montent au-dessus du coude ; ses cheveux sont \
relevés en chignon. Les yeux baissés, le visage de profil, elle pose une main sur \
l'épaule de son cavalier. Lui, en habit noir, la tient par la taille ; son visage \
barbu disparaît presque derrière la tête de sa partenaire. À l'arrière-plan, des \
plantes vertes en pot et un mur clair évoquent un décor de réception. Les deux figures \
occupent toute la hauteur de la toile étroite, sans autre danseur autour d'eux."""
evocation = """
La scène respire la retenue : les corps se touchent à peine, les regards ne se \
croisent pas, la danseuse semble absorbée en elle-même. On y a vu l'image des codes de \
la bonne société, où la danse est un rituel réglé plus qu'un plaisir. Pensée en \
pendant de la Danse à la campagne, la toile oppose la ville à la campagne, le salon à \
la guinguette, le satin au coton imprimé, la réserve à la gaieté. Certains historiens \
y lisent aussi le tournant de Renoir vers un art plus classique, plus froid et plus \
sculptural, qui marque ces années de remise en question."""
histoire = """
Renoir peint les deux danses en 1883, l'année où le marchand Paul Durand-Ruel, son \
principal soutien, lui consacre une grande exposition personnelle à Paris. Les modèles \
sont deux familiers : Suzanne Valadon pour la danseuse et Paul Lhote, ami du peintre, \
pour le cavalier, qui pose aussi dans la Danse à la campagne. Durand-Ruel acquiert les \
deux toiles, qui restent près d'un siècle dans la famille du marchand. Elles entrent \
dans les collections nationales à la fin des années 1970 et sont exposées au musée \
d'Orsay depuis son ouverture, réunies côte à côte comme Renoir les avait conçues."""
facture = """
La surface est lisse et soignée, les contours nettement dessinés : Renoir, au retour \
d'Italie, cherche la fermeté de Raphaël et d'Ingres. Le satin blanc est construit avec \
des gris, des bleus et des roses qui en font sentir les plis et les reflets. La \
palette froide, dominée par le blanc, le noir et le vert sombre des plantes, contraste \
avec les tons chauds de son pendant. Le format vertical, très allongé, et la taille \
réelle des figures accentuent leur élégance."""
details = [
  "Les longs gants blancs de la danseuse, qui montent au-dessus du coude.",
  "La traîne de satin qui s'étale sur le parquet.",
  "Les reflets gris et bleutés qui modèlent les plis de la robe blanche.",
  "Le visage de l'homme, presque caché derrière la tête de sa partenaire.",
  "Les plantes vertes en pot du salon, à l'arrière-plan.",
]
themes = ["danse", "bal", "élégance", "couple", "ville"]
anecdote = """
La danseuse, Suzanne Valadon, a posé pour Renoir, Puvis de Chavannes et \
Toulouse-Lautrec avant de devenir elle-même peintre. En 1894, elle est la première \
femme admise à exposer à la Société nationale des beaux-arts."""
salle = 3
mur = "fond"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Danse à la campagne"
annee = "1883"
image = "danse-campagne.jpg"
technique = "Huile sur toile, 180 × 90 cm"
collection = "Musée d'Orsay, Paris"
note = "Aline Charigot, rieuse, éventail à la main : la joie simple d'un bal populaire en plein air."
description = """
En plein air, sous les arbres d'une guinguette, un couple danse au premier plan. La \
jeune femme, en robe blanche semée de petites fleurs rouges, coiffée d'un chapeau \
rouge, tient un éventail ouvert ; elle tourne vers nous un visage rieur, aux joues \
rondes et rosies. Son cavalier, en costume bleu, la serre contre lui et enfouit \
presque son visage barbu contre elle. Son chapeau de paille est tombé sur le sol, à \
leurs pieds. À gauche, sur une table, restent un verre, une serviette froissée et des \
couverts, traces d'un repas qui s'achève. Derrière eux, le feuillage forme un fond \
vert et lumineux. Comme dans son pendant, les deux figures, presque grandeur nature, \
remplissent toute la hauteur de la toile."""
evocation = """
Tout ici dit l'abandon et la gaieté : le rire de la danseuse, l'étreinte franche du \
cavalier, le chapeau tombé qu'on ne prend pas la peine de ramasser. Face à la Danse à \
la ville, guindée et silencieuse, la Danse à la campagne exprime la joie simple d'un \
bal du dimanche. On y a souvent vu une déclaration d'amour : la danseuse est Aline \
Charigot, la compagne de Renoir, qui deviendra sa femme. Le tableau dit aussi la \
tendresse du peintre pour les plaisirs populaires et pour ce monde modeste dont il est \
lui-même issu, fils d'un tailleur et d'une couturière."""
histoire = """
Aline Charigot, jeune couturière originaire d'Essoyes, dans l'Aube, rencontre Renoir \
vers 1880 ; elle posait déjà, au premier plan, dans le Déjeuner des canotiers. En \
1883, il la peint ici face à Paul Lhote, qui sert aussi de cavalier dans la Danse à la \
ville. Le couple aura un premier fils, Pierre, en 1885, et se mariera en 1890. Comme \
son pendant, le tableau est acquis par Paul Durand-Ruel et reste dans la famille du \
marchand jusqu'à la fin des années 1970, lorsqu'il entre dans les collections \
nationales. Il est aujourd'hui présenté au musée d'Orsay aux côtés de la Danse à la \
ville, dont il est inséparable."""
facture = """
À l'inverse de son pendant, la toile est construite sur des tons chauds : rouges, \
jaunes, orangés et verts lumineux. Les contours des figures restent fermes, signe de \
la nouvelle manière de Renoir, mais le feuillage de l'arrière-plan est brossé en \
touches libres et légères. Le visage d'Aline, en pleine lumière, attire immédiatement \
le regard, tandis que celui de l'homme reste dans l'ombre. Les petites fleurs rouges \
de la robe, semées comme des taches, animent la grande surface blanche."""
details = [
  "Le chapeau de paille du cavalier, tombé sur le sol.",
  "L'éventail ouvert que la danseuse tient à la main.",
  "Sur la table, à gauche, les restes d'un repas : un verre et une serviette froissée.",
  "Les petites fleurs rouges semées sur la robe blanche.",
  "Le visage rieur d'Aline, tourné vers le spectateur.",
]
themes = ["danse", "guinguette", "joie", "couple", "amour"]
anecdote = """
Aline Charigot était originaire d'Essoyes, village de l'Aube où le couple passera de \
nombreux étés et où Renoir achètera une maison. C'est dans le cimetière d'Essoyes que \
le peintre est inhumé, auprès d'elle."""
salle = 3
mur = "fond"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Jeunes filles au piano"
annee = "1892"
image = "jeunes-filles-piano.jpg"
technique = "Huile sur toile, 116 × 90 cm"
collection = "Musée d'Orsay, Paris"
note = "Acquise par l'État français : la première œuvre de Renoir à entrer dans un musée national."
description = """
Dans un intérieur bourgeois, deux jeunes filles se tiennent devant un piano droit. \
L'une, blonde, en robe blanche, est assise et pose les mains sur le clavier, les yeux \
fixés sur la partition. L'autre, brune, en robe rose, se tient debout à côté d'elle, \
penchée, un coude appuyé sur le piano, et suit la musique du regard. Leurs têtes se \
touchent presque. Sur le piano, un vase de fleurs ; derrière elles, un lourd rideau et \
des meubles se fondent dans une pénombre chaude. Aucun spectateur, aucune porte \
ouverte : la scène est close sur elle-même, entièrement occupée par l'attention que \
les deux jeunes filles portent à la musique."""
evocation = """
Le tableau évoque le bonheur tranquille de la vie familiale bourgeoise, où l'étude du \
piano fait partie de l'éducation des jeunes filles. Ce qui frappe, c'est la complicité \
silencieuse des deux personnages, unis par une même concentration. Aucun drame, aucune \
anecdote : Renoir cherche une harmonie, entre les figures, les couleurs et la musique \
qu'on devine. Le tableau marque aussi un moment de sa carrière : à cinquante et un \
ans, l'ancien rebelle de l'impressionnisme reçoit enfin la consécration officielle. \
Certains critiques modernes ont jugé cette douceur trop sucrée ; d'autres y voient \
l'aboutissement d'une recherche patiente de plénitude, au-delà de l'impression \
fugitive."""
histoire = """
En 1892, sous l'impulsion du poète Stéphane Mallarmé et du critique Roger Marx, Henry \
Roujon, directeur des Beaux-Arts, propose à Renoir que l'État lui achète une œuvre \
pour le musée du Luxembourg, alors consacré aux artistes vivants. Renoir reprend le \
même sujet sur plusieurs toiles avant de livrer celle-ci, choisie pour entrer dans les \
collections publiques. La reconnaissance est tardive : le peintre a plus de cinquante \
ans et une longue carrière derrière lui. Le tableau reste au Luxembourg, puis rejoint \
le Louvre et, enfin, le musée d'Orsay, où il demeure l'une des images les plus connues \
de Renoir."""
facture = """
La touche est souple, fondue, presque nacrée : Renoir abandonne la sécheresse de ses \
années de doute et retrouve des contours adoucis. La palette chaude joue sur le blanc, \
le rose, le rouge, l'or et le vert sombre du fond. Les deux figures, imbriquées, \
forment une pyramide équilibrée, et la diagonale du piano structure l'espace. On y \
sent l'admiration de Renoir pour les peintres français du XVIIIᵉ siècle, Fragonard en \
tête, dont il aimait la grâce et la légèreté."""
details = [
  "La partition ouverte que suivent les deux jeunes filles.",
  "Le coude de la jeune fille debout, appuyé sur le piano.",
  "Le vase de fleurs posé sur le piano.",
  "Les deux têtes rapprochées, l'une blonde, l'autre brune.",
  "Le lourd rideau qui ferme l'arrière-plan.",
]
themes = ["musique", "intérieur", "jeunesse", "intimité", "bourgeoisie"]
anecdote = """
Pour cette commande, Renoir a peint plusieurs versions du même sujet, très proches les \
unes des autres. L'une est au Metropolitan Museum de New York, une autre au musée de \
l'Orangerie, à Paris, de l'autre côté de la Seine, à quelques minutes à pied du musée \
d'Orsay."""
salle = 3
mur = "gauche"
place = 1
largeur = 1.1

