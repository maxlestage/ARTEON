[exposition]
ordre = 158
nom_court = "Affiches et BD"
mouvement = "Affiches, gravure et bande dessinée"
cadre = "estampe"
couleur = "#a3352b"
titre = "L'image imprimée, de la gravure à l'affiche et à la bande dessinée"
artiste = "Hogarth, Goya, Hokusai, Töpffer, Tenniel, Doré, Chéret, Steinlen, McCay…"
dates = "1751–1916"
accroche = "Exposition virtuelle · Bibliothèque Forney, hôtel de Sens, Paris"
introduction = """
Avant le cinéma et la télévision, la grande image populaire est imprimée : gravure \
vendue un shilling, livre illustré, page de journal du dimanche, affiche collée sur \
les murs de la ville. La visite suit cette histoire de 1751 à 1916, des satires \
gravées de Hogarth et de Goya aux affiches de Chéret, de Steinlen et de Cappiello, en \
passant par les carnets de Hokusai, les premières histoires en images de Töpffer, \
l'Alice de Tenniel et le Little Nemo de Winsor McCay. Le bâtiment s'inspire de l'hôtel \
de Sens, demeure gothique du Marais à Paris qui abrite la bibliothèque Forney et sa \
collection d'affiches : un porche, une grande salle, une tour carrée, une bibliothèque \
et un cabinet. Les estampes et les pages de livres, souvent petites, y sont présentées \
agrandies."""
vitrine = "tournee-chat-noir.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Hôtel de Sens · Bibliothèque Forney"
ville = "Paris, France"
construction = "Fin du XVᵉ et début du XVIᵉ siècle ; bibliothèque Forney depuis 1961"
presentation = """
Jusqu'en 1622, Paris dépend de l'archevêché de Sens, en Bourgogne. Pour loger ses \
archevêques lors de leurs séjours dans la capitale, l'archevêque Tristan de Salazar \
fait bâtir, à partir de la fin du XVᵉ siècle, cet hôtel au bord du Marais, près de la \
Seine. C'est l'une des rares grandes demeures médiévales conservées à Paris : un \
porche en arc brisé entre deux tourelles, des toits pentus, des lucarnes ouvragées, \
une tour carrée qui abrite l'escalier à vis. La reine Margot y habite en 1605 et 1606. \
Plus tard occupé par des artisans et des commerces, l'édifice est acheté par la Ville \
de Paris en 1911 et longuement restauré. Depuis 1961, il abrite la bibliothèque \
Forney, fondée en 1886 grâce au legs de l'industriel Samuel-Aimé Forney pour les \
artisans du faubourg Saint-Antoine. Consacrée aux arts décoratifs, aux métiers d'art \
et aux arts graphiques, elle conserve l'une des plus importantes collections publiques \
d'affiches en France. Sur la façade, un boulet de canon reste encastré, avec la date \
du 28 juillet 1830."""
ici = """
Le bâtiment d'ARTEON emprunte à l'hôtel de Sens son porche, sa tour carrée et ses murs \
de pierre claire. On entre par le sud dans « Le porche », qui ouvre sur « La grande \
salle · L'affiche », longue de seize mètres et haute de huit, où les affiches se font \
face sur les murs nord et sud. À l'ouest, « La tour · Satire et cauchemars », carrée \
et haute de neuf mètres, réunit les gravures. Au nord, « La bibliothèque · Le livre \
illustré » ; à l'est, « Le cabinet · La ligne et la case », plus bas et plus intime, \
termine la visite."""

