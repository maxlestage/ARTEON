# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Gin Lane (La Ruelle du gin)"
artiste = "William Hogarth"
annee = "1751"
image = "gin-lane.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:William_Hogarth,_Gin_Lane,_1751,_NGA_30433.jpg"
technique = "Eau-forte et burin sur papier"
collection = "National Gallery of Art, Washington (collection Rosenwald)"
note = "Dans une rue misérable de Londres, le gin détruit tout : une mère ivre laisse tomber son enfant, les maisons s'effondrent, seul le prêteur sur gages prospère."
description = """
La gravure montre une rue de Londres en ruine, vue d'en haut. Au premier plan, assise \
sur des marches, une femme hébétée, les jambes couvertes de plaies, prise une pincée \
de tabac pendant que son bébé glisse de ses bras et tombe dans la cage d'escalier \
d'une cave. En bas à droite, un colporteur squelettique, endormi contre le mur, tient \
encore un verre ; dans son panier dépasse un pamphlet contre le gin. À gauche, devant \
la boutique du prêteur sur gages, un menuisier et une ménagère viennent engager leur \
scie et leurs casseroles. Au fond, la rue se défait : une maison s'écroule, un barbier \
s'est pendu sous les combles, un fou gesticule, un enfant embroché au bout d'une \
pique, et l'on dépose une morte dans un cercueil. Au-dessus des toits se dresse un \
clocher. Sous l'image, trois strophes en anglais maudissent le gin."""
evocation = """
Hogarth oppose Gin Lane à une autre planche, Beer Street, la Rue de la bière, où des \
Londoniens bien nourris boivent de la bière anglaise, travaillent et prospèrent. Ici, \
au contraire, le gin bon marché ruine les corps, les familles et la ville elle-même : \
seuls l'usurier, le distillateur et le croque-mort font des affaires. La mère indigne \
du centre a été rapprochée d'un fait divers qui avait choqué Londres en 1734 : une \
femme, Judith Defour, avait étranglé sa petite fille pour revendre ses vêtements et \
acheter du gin. Le clocher de l'église St George de Bloomsbury semble regarder la \
scène de loin, impuissant. On y a vu un sermon en images, mais aussi un document sur \
la misère du quartier de St Giles, l'un des plus pauvres de la ville. L'horreur s'y \
mêle à un humour noir qui fait encore son efficacité."""
histoire = """
Dans la première moitié du XVIIIᵉ siècle, Londres connaît ce qu'on a appelé la « folie \
du gin » : l'alcool de grain, distillé partout et vendu pour quelques sous, provoque \
misère, crimes et morts. En 1751, le Parlement prépare une loi pour en limiter la \
vente. Hogarth publie alors, le 1ᵉʳ février, Gin Lane et Beer Street, suivies la même \
année des Quatre Étapes de la cruauté. Son ami l'écrivain et magistrat Henry Fielding \
vient de publier un essai sur l'augmentation des vols, qui accuse lui aussi le gin. \
Les vers gravés sous l'image sont du pasteur James Townley. Pour toucher un public \
populaire, Hogarth vend ces estampes un shilling pièce. La loi sur le gin est votée la \
même année, et la consommation recule dans les années suivantes. Ce tirage appartient \
à la National Gallery of Art de Washington."""
facture = """
Hogarth, formé à la gravure sur argent, grave lui-même la plaque de cuivre en mêlant \
l'eau-forte, pour la liberté du dessin, et le burin, pour les tailles nettes et \
régulières. Il annonçait avoir publié ces planches de la manière la moins coûteuse \
possible, pour un public populaire : traits appuyés, contrastes francs, personnages \
expressifs jusqu'à la caricature. La composition, construite en perspective profonde, \
conduit l'œil du premier plan, où tout tombe, vers le fond, où tout s'écroule. Les \
écriteaux, les enseignes et les vers gravés sous l'image font partie du récit, à lire \
comme les légendes d'une bande dessinée."""
details = [
  "L'écriteau au-dessus de la cave, en bas à gauche : ivre pour un penny, ivre mort pour deux, la paille pour rien.",
  "L'enseigne du prêteur sur gages, S. Gripe, dont le nom évoque l'avidité.",
  "Le barbier pendu sous les combles de la maison en ruine, en haut à droite.",
  "Le clocher surmonté d'une statue du roi George Iᵉʳ, au fond.",
  "Le prix, « Price 1s », gravé tout en bas à droite.",
]
themes = ["satire", "alcool", "londres", "misère", "morale"]
anecdote = """
Ses estampes à succès étant aussitôt copiées et vendues moins cher, Hogarth obtint du \
Parlement, en 1735, une loi surnommée « Hogarth's Act », qui protégeait pour la \
première fois en Angleterre les graveurs contre les contrefaçons de leurs œuvres."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Le sommeil de la raison engendre des monstres (Caprices, planche 43)"
artiste = "Francisco de Goya"
annee = "1799"
image = "sommeil-raison.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Francisco_José_de_Goya_y_Lucientes_-_The_sleep_of_reason_produces_monsters_(No._43),_from_Los_Caprichos_-_Google_Art_Project.jpg"
technique = "Eau-forte et aquatinte, environ 21,5 × 15 cm"
collection = "Nelson-Atkins Museum of Art, Kansas City (première édition)"
note = "Un homme s'est endormi sur sa table de travail ; derrière lui surgissent hiboux, chauves-souris et un lynx : la planche la plus célèbre des Caprices."
description = """
Un homme vêtu à la mode de la fin du XVIIIᵉ siècle s'est effondré sur une table, la \
tête enfouie dans ses bras. Près de lui traînent des feuilles et un porte-crayon. \
Derrière son dos, une nuée de créatures nocturnes se lève de l'obscurité : des hiboux \
et des chouettes aux yeux ronds, dont l'un semble lui tendre un crayon, des \
chauves-souris qui s'envolent vers le haut de l'image, un chat noir tapi dont on ne \
voit que les yeux. À droite, couché sur le sol, un lynx aux oreilles pointues fixe le \
dormeur sans bouger. Sur le flanc de la table, des lettres claires donnent le titre : \
El sueño de la razón produce monstruos. Le fond, d'un gris granuleux, s'assombrit à \
mesure que les bêtes se multiplient, jusqu'aux silhouettes noires qui se perdent dans \
le ciel."""
evocation = """
En espagnol, sueño signifie à la fois le sommeil et le rêve : la raison qui dort, ou \
la raison qui rêve. Les historiens y voient d'abord un manifeste des Lumières, que \
Goya partageait avec ses amis réformateurs : quand la raison s'assoupit, les \
superstitions, l'ignorance et les vices, figurés par les oiseaux de nuit, reprennent \
le dessus. Un commentaire manuscrit ancien, conservé au Prado, explique que \
l'imagination abandonnée par la raison produit des monstres impossibles, mais qu'unie \
à elle, elle est la mère des arts. La planche peut donc se lire aussi comme un \
portrait de l'artiste, assailli par les visions qui nourrissent son œuvre. Le lynx, \
animal à la vue perçante, reste éveillé quand l'homme dort. Deux siècles plus tard, \
l'image est devenue l'emblème même du cauchemar."""
histoire = """
Goya travaille aux Caprices à partir de 1797, quelques années après la grave maladie \
qui l'a laissé sourd. Cette planche devait d'abord ouvrir le recueil : un dessin \
préparatoire, conservé au musée du Prado, montre le même dormeur avec une inscription \
qui le présente comme l'auteur en train de rêver. Dans la version définitive, elle \
prend place au milieu de la série, au numéro 43, et c'est un autoportrait de Goya, de \
profil, qui ouvre les quatre-vingts planches. Le 6 février 1799, le Diario de Madrid \
annonce la mise en vente des Caprices dans une boutique de parfums et de liqueurs de \
la rue du Desengaño, au rez-de-chaussée de la maison du peintre. La vente cesse au \
bout de quelques jours, sans doute par crainte de l'Inquisition. En 1803, Goya cède \
les cuivres et les exemplaires invendus au roi, en échange d'une pension pour son \
fils."""
facture = """
Goya combine deux techniques de gravure en creux sur cuivre. L'eau-forte lui permet de \
dessiner librement à la pointe dans un vernis, comme avec une plume : contours de \
l'homme, plumes des hiboux, ailes des chauves-souris. L'aquatinte, une résine fine \
saupoudrée sur la plaque puis mordue à l'acide, crée les fonds gris d'aspect granuleux \
et les nuances d'ombre, comme un lavis. En protégeant certaines zones de l'acide, il \
fait surgir le titre en lettres claires sur la table et les ailes blanches du hibou \
central. Les tirages de la première édition, comme celui-ci, gardent un grain fin et \
des gris profonds."""
details = [
  "Le hibou qui tend un porte-crayon au dormeur, comme pour l'obliger à dessiner.",
  "Les yeux brillants d'un chat noir, tapi juste derrière le dos de l'homme.",
  "Le lynx couché à droite, seul animal à rester immobile.",
  "Le titre gravé en lettres claires sur le côté de la table.",
  "Les chauves-souris qui se perdent dans le gris du ciel, en haut.",
]
themes = ["rêve", "raison", "lumières", "cauchemar", "satire"]
anecdote = """
Les cuivres originaux des Caprices existent toujours. Entrés dans les collections \
royales en 1803, ils sont conservés à la Calcografía Nacional, à Madrid, qui en a tiré \
de nombreuses éditions posthumes jusqu'au XXᵉ siècle."""
salle = 3
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Les Baigneurs, double page de la Hokusai manga (tome IV)"
artiste = "Katsushika Hokusai"
annee = "1816"
image = "hokusai-manga.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hokusai-MangaBathingPeople.jpg"
technique = "Gravure sur bois imprimée en noir et en gris, double page d'un livre"
collection = "Hokusai manga, tome IV ; exemplaires dans de nombreux musées"
note = "Nageurs, plongeurs, un cavalier dans l'eau : une page des carnets de Hokusai, encyclopédie dessinée de la vie japonaise publiée en quinze volumes."
description = """
Sur deux pages qui se font face, une vingtaine de baigneurs s'ébattent dans une eau \
figurée par de fines lignes ondulées. À gauche, un homme grimpe le long d'un grand \
poteau, d'autres plongent la tête la première ou se débattent, et, en bas, un cavalier \
traverse à la nage, couché sur l'encolure de son cheval qui tend les jambes. À droite, \
les nageurs prennent toutes les postures : l'un flotte avec un grand anneau autour du \
corps, un autre porte un gros ballot sur l'épaule, d'autres se retournent, plongent ou \
semblent marcher au fond de l'eau, parmi des plantes aquatiques, de petites tortues et \
des poissons noirs. Les corps, à peine vêtus d'un pagne, sont saisis en plein \
mouvement, sans décor ni paysage. En haut à droite, quelques caractères donnent le \
sujet de la page."""
evocation = """
Le mot manga, que Hokusai choisit pour ces volumes, signifie à peu près « dessins au \
fil du pinceau » ou « croquis divers ». Il ne désigne pas encore la bande dessinée \
japonaise, même si celle-ci lui a emprunté son nom au XXᵉ siècle. Ces pages sont \
d'abord des modèles : des répertoires de formes destinés aux élèves et aux artisans, \
qui pouvaient y copier un geste, un animal ou un outil. Mais on y sent surtout la \
curiosité insatiable de Hokusai pour le corps humain en mouvement, et son humour : les \
nageurs ont des mines concentrées, effrayées ou béates. La double page fonctionne \
comme une planche d'étude, presque une décomposition du mouvement, bien avant la \
photographie. On y a reconnu des techniques de nage pratiquées au Japon à l'époque \
d'Edo, y compris par les guerriers."""
histoire = """
Lors d'un séjour à Nagoya, en 1812, Hokusai réalise pour ses élèves des centaines de \
croquis. Un éditeur de la ville en tire un premier volume, publié en 1814, dont le \
succès est tel que la série se poursuit : ce tome IV paraît en 1816. Les douze \
premiers volumes sortent entre 1814 et 1834 ; les trois derniers, composés en partie \
de dessins restés inédits, paraissent beaucoup plus tard, le quinzième en 1878, près \
de trente ans après la mort de l'artiste. L'ensemble rassemble des milliers de figures \
: gens de métier, dieux, animaux, plantes, paysages, fantômes. Imprimés en nombre et \
vendus à prix modéré, les volumes circulent dans tout le Japon. Au XIXᵉ siècle, ils \
gagnent l'Europe, où les artistes les découvrent avec passion : la Manga devient l'un \
des livres japonais les plus admirés à Paris, au temps du japonisme."""
facture = """
Chaque page est une gravure sur bois : Hokusai dessine au pinceau sur un papier fin, \
que le graveur colle à l'envers sur une planche de cerisier avant de tailler le bois \
autour des traits. Une seconde planche imprime les aplats gris, ici l'eau et quelques \
ombres. Le trait est rapide, souple, d'une grande économie : quelques courbes \
suffisent pour un dos qui se cambre ou une jambe qui bat l'eau. Les figures sont \
dispersées sur la page sans cadre ni sol, comme sur une feuille de croquis, et l'œil \
passe librement de l'une à l'autre. L'eau, rendue par des lignes ondulées parallèles, \
unifie l'ensemble."""
details = [
  "Le cavalier allongé sur son cheval, qui nage les jambes tendues, en bas à gauche.",
  "Le baigneur qui grimpe le long du grand poteau, à gauche.",
  "Les petites tortues et les poissons noirs, en bas à droite.",
  "Le nageur qui flotte avec un grand anneau autour du corps, en haut à droite.",
]
themes = ["corps", "mouvement", "eau", "japon", "croquis", "manga"]
anecdote = """
Selon un récit célèbre mais discuté, le graveur Félix Bracquemond aurait découvert un \
volume de la Manga en 1856, chez son imprimeur parisien, où il avait servi à emballer \
des porcelaines venues du Japon. Il l'aurait ensuite montré avec enthousiasme à ses \
amis artistes."""
salle = 3
mur = "sud"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Histoire de Monsieur Jabot, une planche"
artiste = "Rodolphe Töpffer"
annee = "1833"
image = "histoire-de-m-jabot.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Histoire_de_Mr_Jabot_-_par_Rodolphe_Töpffer_-_btv1b8529023n_(44_of_70).jpg"
technique = "Autographie (lithographie d'après un dessin à la plume), album oblong d'environ 16 × 25 cm"
collection = "Bibliothèque nationale de France, Paris"
note = "Trois cases, trois légendes : Monsieur Jabot, qui veut entrer dans le grand monde, aux prises avec ses chiens. L'un des tout premiers albums de bande dessinée."
description = """
La page est divisée en trois cases rectangulaires, tracées à la plume, avec sous \
chacune une légende manuscrite. Dans la première, Monsieur Jabot, chapeau envolé, \
jambes maigres en équerre, se débat au milieu de trois petits chiens qui lui sautent \
dessus ; la légende explique que les chiens sont si gentils qu'il les trouve presque \
trop familiers. Dans la deuxième, il n'est plus là : les trois chiens, attachés au \
pied de son lit à l'hôtel, attendent, couchés près d'une chaise. Dans la troisième, \
coiffé d'un chapeau haut et droit, il tend des cartes de visite à un domestique raide \
devant une porte : il porte quinze cartes chez Monsieur du Bocage, dit la légende, la \
famille se composant de quinze personnes. Le trait est rapide, presque griffonné, et \
les décors réduits à quelques lignes."""
evocation = """
Monsieur Jabot est un bourgeois vaniteux qui rêve d'entrer dans la bonne société et en \
imite maladroitement les usages : les visites, les bals, les belles manières. Töpffer \
se moque de lui avec une ironie tendre, en montrant le décalage entre ses prétentions \
et ses gestes de pantin. Le comique tient ici au rythme : la répétition, l'ellipse \
entre les cases, la chute de la troisième légende, d'une absurdité très sérieuse. \
C'est exactement ce que fera plus tard la bande dessinée : faire naître le sens du \
passage d'une image à l'autre. Töpffer en avait conscience ; il expliquait que ses \
dessins, sans le texte, n'auraient qu'une signification obscure, et que le texte, sans \
les dessins, ne signifierait rien. Pour beaucoup d'historiens, c'est la naissance d'un \
nouveau langage."""
histoire = """
Fils d'un peintre genevois, Töpffer dirige à Genève une pension de jeunes garçons. Dès \
1827, il dessine pour les amuser des histoires en images qu'il ne songe pas à publier. \
Ses albums manuscrits circulent pourtant et parviennent, vers 1830, jusqu'à Goethe, à \
Weimar, qui les lit avec enthousiasme et souhaite les voir imprimés. Encouragé, \
Töpffer publie en 1833 l'Histoire de Monsieur Jabot, la première de ses histoires à \
paraître, reproduite chez l'imprimeur genevois Freydig. Suivent Monsieur Crépin et \
Monsieur Vieux Bois en 1837, puis Monsieur Pencil et le Docteur Festus. Le succès \
dépasse vite la Suisse : des éditions pirates paraissent à Paris, et les histoires de \
Töpffer sont copiées et imitées dans toute l'Europe. Cet exemplaire de l'album est \
conservé au département des Estampes de la Bibliothèque nationale de France."""
facture = """
Töpffer dessine à la plume, d'un trait volontairement libre, presque enfantin, qui \
privilégie l'expression sur l'exactitude. Il utilise l'autographie, une variante de la \
lithographie : il dessine et écrit à l'encre grasse sur un papier spécial, dont le \
tracé est ensuite reporté sur la pierre lithographique pour l'impression. Le procédé \
lui permet de travailler vite et d'écrire lui-même ses légendes, sans passer par un \
graveur. Les cases, de largeur variable, sont séparées par un simple trait ; le texte, \
toujours sous l'image, avance au même pas que le dessin. Il a lui-même théorisé cette \
manière dans son Essai de physiognomonie, en 1845."""
details = [
  "Le chapeau qui s'envole au-dessus de la tête de Monsieur Jabot, dans la première case.",
  "Le monogramme RT de Töpffer, sous la case du milieu.",
  "Le numéro de la page, 34, en haut à droite.",
  "Le domestique raide comme un piquet devant la porte, dans la dernière case.",
]
themes = ["bande dessinée", "humour", "vanité", "bourgeoisie", "chiens"]
anecdote = """
En 1842, Monsieur Vieux Bois, traduit en anglais sous le titre The Adventures of Mr. \
Obadiah Oldbuck, paraît à New York : on le considère souvent comme la première bande \
dessinée publiée aux États-Unis."""
