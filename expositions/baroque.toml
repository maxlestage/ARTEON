#  EXPOSITION « BAROQUE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  tableaux dans public/tableaux/<nom>/ (ici public/tableaux/baroque/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /baroque.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 40
nom_court = "Baroque"
mouvement = "Baroque"
couleur = "#7a2e2a"
titre = "Le Baroque, le théâtre de la lumière"
artiste = "Caravage, Artemisia, Rubens, Velázquez, Poussin…"
dates = "1599–1678"
accroche = "Exposition virtuelle · Musée du Prado, Madrid"
introduction = """
Au XVIIᵉ siècle, la peinture européenne cherche à saisir et à émouvoir : lumière \
dramatique du Caravage, chairs palpitantes de Rubens, vérité troublante de \
Velázquez, mais aussi ordre serein de Poussin et de Claude Lorrain. La visite réunit \
neuf peintres, de Rome à Séville et d'Anvers à la Lorraine, en dix toiles. Le \
bâtiment s'inspire du musée du Prado à Madrid : une longue galerie centrale voûtée \
aux murs rouge sombre, et, en son milieu, la salle où Les Ménines attendent le \
visiteur."""
vitrine = "menines.jpg"

