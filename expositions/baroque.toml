# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "La Vocation de saint Matthieu"
artiste = "Le Caravage"
annee = "1599–1600"
image = "vocation-saint-matthieu.jpg"
technique = "Huile sur toile, 322 × 340 cm"
collection = "Chapelle Contarelli, église Saint-Louis-des-Français, Rome"
note = "Un rayon de lumière traverse une pièce sombre : le Christ désigne le collecteur d'impôts qui va le suivre."
description = """
Dans une salle nue aux murs gris, cinq hommes sont assis autour d'une table où l'on \
compte de l'argent. Ils portent les habits de la Rome de 1600 : pourpoints rayés, \
chapeaux à plumes, épée au côté. À droite, presque dans l'ombre, deux hommes pieds \
nus et drapés à l'antique viennent d'entrer : le Christ, dont on ne voit guère que le \
visage et la main tendue, et saint Pierre, de dos. La main du Christ désigne l'un des \
joueurs. Un barbu, au centre, se montre lui-même du doigt, comme pour dire « moi ? », \
tandis qu'au bout de la table un jeune homme, tête baissée, continue de ramasser les \
pièces. Au-dessus des personnages, une fenêtre aux carreaux voilés reste obscure : la \
lumière vient d'ailleurs, d'en haut à droite, et suit le geste du Christ."""
evocation = """
L'Évangile raconte en une phrase que Jésus vit Matthieu, le publicain, assis au \
bureau des taxes, et lui dit : « Suis-moi. » Le Caravage fait de cet appel un \
instant suspendu, juste avant la décision. La lumière qui tombe en diagonale a été lue \
comme l'image de la grâce divine qui fait irruption dans un monde ordinaire, au milieu \
de l'argent et du jeu. La main du Christ reprend presque celle d'Adam dans la Création \
de Michel-Ange, à la chapelle Sixtine : le salut répond à la création. Les historiens \
discutent encore de l'identité de Matthieu : le barbu qui se désigne, comme le veut \
la lecture traditionnelle, ou le jeune homme penché sur les pièces, qui n'a pas \
encore levé les yeux. Cette hésitation fait partie de la force du tableau."""
histoire = """
Le cardinal français Mathieu Cointrel, dit Contarelli, mort en 1585, avait laissé de \
quoi décorer sa chapelle funéraire à Saint-Louis-des-Français, l'église des Français \
de Rome. Après des années de retard, la commande des deux toiles latérales, consacrées \
à la vocation et au martyre de saint Matthieu, échoit en 1599 au Caravage, grâce à son \
protecteur, le cardinal Francesco Maria Del Monte. C'est sa première commande \
publique. Installées en 1600, les deux toiles font sensation et rendent leur auteur \
célèbre du jour au lendemain. Le peintre ajoute ensuite le tableau d'autel, Saint \
Matthieu et l'ange, dont la première version est refusée. Contrairement à la plupart \
des œuvres de cette exposition, la Vocation n'a jamais quitté le lieu pour lequel \
elle a été peinte : elle est toujours accrochée dans la chapelle."""
facture = """
Le Caravage peint directement sur la toile, sans dessin préparatoire connu ; on a \
relevé dans la préparation de petites incisions qui lui servaient de repères. Sur un \
fond brun très sombre, il ne fait surgir que ce que la lumière touche : visages, \
mains, manches blanches. C'est le contraste violent qu'on appellera ténébrisme. Les \
couleurs franches, rouge, jaune, vert, sont réservées aux jeunes gens habillés à la \
mode. L'examen aux rayons X a montré que saint Pierre a été ajouté dans un second \
temps : au départ, le Christ entrait seul."""
details = [
  "La main du Christ, à demi ouverte, qui rappelle celle d'Adam chez Michel-Ange.",
  "Le vieil homme à lunettes qui se penche sur l'argent, sans rien voir.",
  "La fenêtre au volet ouvert, dont les carreaux restent sombres.",
  "Les pieds nus du Christ et de Pierre, face aux souliers et aux plumes des joueurs.",
  "Les pièces que le jeune homme au bout de la table rassemble encore.",
]
themes = ["lumière", "vocation", "évangile", "argent", "clair-obscur"]
anecdote = """
Dans l'église Saint-Louis-des-Français, la chapelle Contarelli est plongée dans la \
pénombre : il faut glisser une pièce dans un boîtier pour allumer l'éclairage \
quelques instants, et voir alors les trois tableaux du Caravage sortir de l'ombre."""
salle = 4
mur = "nord"
place = 2
largeur = 3.4

[[oeuvres]]
titre = "Judith décapitant Holopherne"
artiste = "Artemisia Gentileschi"
annee = "vers 1620"
image = "judith-holopherne.jpg"
technique = "Huile sur toile, 199 × 162,5 cm"
collection = "Galerie des Offices, Florence"
note = "Judith et sa servante maintiennent le général assyrien et lui tranchent la gorge : la scène biblique la plus violente du siècle."
description = """
Sur un lit aux draps blancs, un homme renversé, la tête vers le spectateur, se débat. \
Deux femmes le maîtrisent. La servante, coiffée d'un turban, pèse de tout son poids \
sur sa poitrine et lui bloque les bras. Judith, en robe de soie dorée aux manches \
retroussées, lui tient fermement les cheveux d'une main et, de l'autre, enfonce une \
épée dans son cou. Le sang jaillit en filets et ruisselle sur le drap jusqu'au bord \
du matelas. Le visage d'Holopherne, les yeux grands ouverts, exprime la terreur. Les \
trois corps forment un enchevêtrement de bras qui converge vers la lame, au centre \
exact de la toile. Autour, le fond est entièrement noir : la tente du général, \
plongée dans la nuit, a disparu."""
evocation = """
Le livre de Judith raconte comment une veuve juive sauve sa ville de Béthulie, \
assiégée par l'armée assyrienne, en séduisant puis en tuant le général Holopherne. \
Le sujet était courant, mais Artemisia en fait un acte physique, presque un travail \
de boucherie, où les deux femmes agissent ensemble avec une froide détermination. On \
a souvent lu le tableau à la lumière de sa vie : violée en 1611 par le peintre \
Agostino Tassi, elle avait dû affronter un procès humiliant. Beaucoup y voient une \
revanche peinte ; d'autres historiens mettent en garde contre cette lecture trop \
biographique et rappellent qu'il s'agit d'abord d'une démonstration de métier, \
destinée à rivaliser avec le Caravage sur un sujet qu'il avait lui-même traité."""
histoire = """
Artemisia avait peint une première version du sujet vers 1612-1613, aujourd'hui au \
musée de Capodimonte à Naples. Installée à Florence après son mariage, elle reprend \
la composition, plus grande et plus raffinée, vers 1620, sans doute pour le grand-duc \
Cosme II de Médicis. Selon une tradition souvent rapportée, la grande-duchesse aurait \
trouvé le tableau si effrayant qu'on l'aurait relégué dans un coin sombre du palais \
Pitti, et la peintre aurait eu besoin de l'appui de son ami Galilée pour en obtenir \
le paiement. Longtemps peu regardée, l'œuvre est restée dans les collections des \
Médicis, passées à l'État, et appartient aujourd'hui aux Offices, où elle compte \
parmi les tableaux les plus admirés."""
facture = """
Artemisia a appris auprès de son père, Orazio Gentileschi, ami du Caravage, la \
peinture d'après modèle vivant et l'éclairage latéral qui détache les figures sur le \
noir. Elle y ajoute un luxe d'étoffes typiquement florentin : soie damassée de la \
robe, velours rouge de la couverture, drap blanc froissé. La composition est \
construite en triangle autour de la lame, et les bras des trois personnages se \
croisent comme les rayons d'une roue. Les jets de sang, peints en arcs réguliers, \
sont d'une précision presque clinique."""
details = [
  "Le bracelet de Judith, orné de médaillons où l'on reconnaît Artémis, le prénom de la peintre.",
  "Les jets de sang qui dessinent des arcs, et les coulures sur le drap blanc.",
  "La garde de l'épée, en forme de croix, juste au centre du tableau.",
  "Le poing serré de la servante sur la poitrine d'Holopherne.",
]
themes = ["bible", "violence", "héroïne", "femmes", "clair-obscur"]
anecdote = """
En 1616, Artemisia Gentileschi devient la première femme admise à l'Accademia delle \
Arti del Disegno de Florence, l'académie fondée sous Cosme Iᵉʳ de Médicis, qui lui \
permettait d'acheter elle-même ses couleurs et de signer ses propres contrats."""
salle = 4
mur = "ouest"
place = 2
largeur = 1.62

[[oeuvres]]
titre = "Le Tricheur à l'as de carreau"
artiste = "Georges de La Tour"
annee = "vers 1636–1638"
image = "tricheur-as-de-carreau.jpg"
technique = "Huile sur toile, 106 × 146 cm"
collection = "Musée du Louvre, Paris"
note = "Autour d'une partie de cartes, trois complices s'entendent pour plumer un jeune homme naïf."
description = """
Quatre personnages se tiennent autour d'une table couverte d'un tapis vert, sur un \
fond sombre. À droite, un jeune homme richement vêtu, chapeau à plumes et pourpoint \
brodé, regarde son jeu sans se douter de rien ; devant lui, une pile de pièces d'or. \
Au centre, une femme au décolleté orné de perles, coiffée d'un turban rouge à \
plumes, jette un regard oblique vers sa servante, qui lui sert un verre de vin. À \
gauche, un homme au visage dans l'ombre se tourne vers nous : derrière son dos, il \
tire de sa ceinture un as de carreau, qu'il s'apprête à glisser dans son jeu. Personne \
ne parle, mais les regards et les mains racontent toute l'histoire."""
evocation = """
Le tableau met en scène, selon une lecture courante au XVIIᵉ siècle, les trois \
tentations qui perdent la jeunesse : le jeu, le vin et la luxure. Le jeune homme est \
une figure de l'enfant prodigue, promis à la ruine. Mais La Tour ne prêche pas : il \
nous fait complices. Le tricheur nous regarde, et nous sommes les seuls à voir sa \
carte cachée, comme au théâtre quand le public en sait plus que la victime. La scène \
reprend un thème mis à la mode à Rome par le Caravage, dans ses Tricheurs, mais La \
Tour en fait une comédie silencieuse et figée, d'une ironie très froide. On y a vu un \
reflet de la société de la Lorraine en guerre, où l'argent et la ruse décidaient \
souvent du sort des hommes."""
histoire = """
Comme presque tout l'œuvre de La Tour, le tableau n'est documenté par aucun texte de \
son temps, et sa date n'est connue que par le style. Le peintre en a fait deux \
versions : l'une, avec un as de trèfle, se trouve au Kimbell Art Museum de Fort Worth, \
au Texas ; l'autre, avec un as de carreau, est celle-ci. Oubliée pendant près de trois \
siècles, elle réapparaît au XXᵉ siècle dans une collection particulière, au moment \
où l'on redécouvre son auteur. Son acquisition par le musée du Louvre, en 1972, fit \
grand bruit et suscita de vifs débats. Elle compte aujourd'hui parmi les tableaux les \
plus populaires du département des peintures."""
facture = """
Dans ce tableau « diurne », éclairé d'une lumière du jour latérale, La Tour simplifie \
les formes jusqu'à la géométrie : le visage de la courtisane est un ovale presque \
parfait, la table un bloc, les mains de petites architectures. Les surfaces sont \
lisses, sans trace de pinceau visible. Les étoffes, au contraire, sont détaillées \
avec soin : broderies du pourpoint, rayures du corsage, plumes des coiffes. La gamme \
joue sur des rouges et des ors qui ressortent sur le fond noir."""
details = [
  "L'as de carreau tiré de la ceinture, derrière le dos du tricheur.",
  "Les yeux de la courtisane, tournés de côté vers la servante, sans bouger la tête.",
  "Le verre de vin rouge que la servante tient à la main.",
  "Les pièces d'or empilées devant le jeune homme, prêtes à changer de main.",
]
themes = ["jeu", "tricherie", "vices", "regards", "comédie"]
anecdote = """
La Tour avait été complètement oublié. En 1915, l'historien de l'art allemand \
Hermann Voss lui rend deux nocturnes du musée de Nantes ; l'exposition des « Peintres \
de la réalité » à l'Orangerie, à Paris en 1934, achève de le remettre en lumière."""
salle = 4
mur = "sud"
place = 2
largeur = 1.46

[[oeuvres]]
titre = "Les Trois Grâces"
artiste = "Pierre Paul Rubens"
annee = "vers 1630–1635"
image = "trois-graces.jpg"
technique = "Huile sur panneau de chêne, 221 × 181 cm"
collection = "Musée du Prado, Madrid"
note = "Les trois déesses de la grâce et de la joie, enlacées dans un jardin : un hymne à la chair, gardé par Rubens jusqu'à sa mort."
description = """
Trois femmes nues se tiennent par les épaules et la taille, dans une ronde \
immobile, au milieu d'un paysage ouvert. Celle du centre est vue de dos ; ses deux \
compagnes, de trois quarts, se tournent vers elle et échangent des regards tendres. \
Un voile transparent passe de l'une à l'autre et souligne la courbe des corps. \
Au-dessus d'elles, une guirlande de roses est suspendue entre deux arbres, et un \
drap blanc est accroché à une branche. À droite, une fontaine en pierre sculptée \
porte un petit Amour qui tient une corne d'abondance d'où coule l'eau. À gauche, \
au loin, des cerfs paissent dans une prairie baignée de lumière. Les chairs, très \
claires, se détachent sur le ciel bleu et les verts du jardin."""
evocation = """
Filles de Zeus selon la mythologie grecque, les trois Grâces, Aglaé, Euphrosyne et \
Thalie, incarnent la beauté, la joie et l'abondance ; leur ronde symbolise depuis \
l'Antiquité la générosité, le don qui circule et revient. Rubens reprend la pose \
classique, une figure de dos entre deux de face, mais la débarrasse de toute \
froideur de statue. Ses Grâces sont des femmes de chair, aux corps pleins et aux \
peaux nacrées, l'idéal de beauté de la Flandre du XVIIᵉ siècle. On a souvent reconnu \
dans la Grâce de gauche les traits d'Hélène Fourment, que le peintre épousa en 1630, \
à cinquante-trois ans, alors qu'elle en avait seize : le tableau serait aussi un \
chant d'amour et de bonheur de sa vieillesse."""
histoire = """
Rubens peint cette toile pour lui-même, dans les années heureuses de son second \
mariage, et la conserve dans sa maison d'Anvers jusqu'à sa mort, en 1640. Lors de la \
vente de ses biens, le roi d'Espagne Philippe IV, son plus grand admirateur, fait \
acheter par ses agents plusieurs tableaux de l'atelier, dont celui-ci. L'œuvre gagne \
ainsi Madrid et les palais royaux, où elle reste pendant près de deux siècles avant \
d'entrer au musée du Prado, ouvert en 1819 pour présenter au public les collections \
de la Couronne. C'est grâce à cette passion de Philippe IV que le Prado possède \
aujourd'hui l'un des plus riches ensembles au monde de tableaux de Rubens."""
facture = """
Rubens peint sur un grand panneau de chêne, avec des couches fines et fluides qui \
laissent par endroits deviner le fond clair. Les carnations sont construites en \
glacis superposés : blanc nacré, roses, et de légers reflets bleutés dans les ombres, \
qui donnent à la peau sa transparence. La touche, très libre dans le paysage et la \
guirlande, devient plus fondue sur les corps. La composition s'organise autour du \
voile qui relie les trois figures et de la diagonale des bras."""
details = [
  "Le voile transparent qui passe d'une Grâce à l'autre et les relie.",
  "Les cerfs minuscules dans la prairie, à gauche, sous les arbres.",
  "Le petit Amour de pierre sur la fontaine, à droite, avec sa corne d'abondance.",
  "Le numéro d'inventaire royal, peint en blanc dans le coin inférieur gauche.",
]
themes = ["mythologie", "nu", "beauté", "amour", "jardin"]
anecdote = """
Lors de son séjour à Madrid en 1628-1629, Rubens se lie avec le jeune Velázquez, de \
vingt-deux ans son cadet : d'après Francisco Pacheco, beau-père de Velázquez, les \
deux peintres visitent ensemble le monastère de l'Escurial."""
salle = 2
mur = "nord"
place = 4
largeur = 1.81

[[oeuvres]]
titre = "L'Immaculée Conception des Vénérables, dite de Soult"
artiste = "Bartolomé Esteban Murillo"
annee = "vers 1678"
image = "immaculee-conception.jpg"
technique = "Huile sur toile, 274 × 190 cm"
collection = "Musée du Prado, Madrid"
note = "La Vierge s'élève sur un nuage, portée par une nuée d'angelots : le modèle sévillan de l'Immaculée Conception."
description = """
Au centre d'un ciel doré, une jeune femme vêtue d'une robe blanche et d'un grand \
manteau bleu s'élève, les mains croisées sur la poitrine, les yeux tournés vers le \
haut. Un halo lumineux brille autour de sa tête, et un mince \
croissant de lune apparaît sous ses pieds. Tout autour d'elle, une nuée \
d'angelots joufflus forment une spirale : certains tiennent des branches et des \
rubans, d'autres la regardent ou jouent dans les nuages, d'autres encore ne sont que \
des têtes ailées qui se fondent dans la brume. Le manteau, soulevé par le vent, \
s'enroule autour de son corps et accompagne le mouvement ascendant. Le fond passe de \
l'or lumineux, autour du visage, à des gris bleutés dans les coins."""
evocation = """
Le dogme de l'Immaculée Conception, qui affirme que Marie a été conçue sans le péché \
originel, n'était pas encore officiel au XVIIᵉ siècle, mais Séville le défendait avec \
passion. Murillo en a fixé l'image pour des générations : une très jeune fille, \
pure et douce, entre ciel et terre, d'après la femme « revêtue du soleil, la lune \
sous les pieds » de l'Apocalypse. Les couleurs, blanc de la pureté et bleu du ciel, \
deviennent celles de la Vierge dans toute l'iconographie catholique. Après la peste \
qui avait tué près de la moitié des Sévillans en 1649, ces visions tendres et \
consolantes répondaient au besoin de réconfort d'une ville éprouvée. Le tableau \
appartient à la dernière période de Murillo, la plus vaporeuse."""
histoire = """
Le chanoine Justino de Neve, ami et mécène de Murillo, commande le tableau pour \
l'église de l'hôpital des Vénérables Prêtres de Séville, une maison de retraite pour \
les prêtres âgés qu'il avait fondée. Pendant l'occupation française de Séville, le \
maréchal Soult, grand pilleur d'œuvres d'art, s'en empare. À sa vente après décès, \
en 1852, le musée du Louvre l'achète 615 300 francs : c'est alors le prix le plus \
élevé jamais payé pour un tableau. Il reste au Louvre près de quatre-vingt-dix ans, \
jusqu'en 1941, quand le gouvernement de Vichy le cède à l'Espagne de Franco dans le \
cadre d'un échange d'œuvres d'art. Il entre alors au musée du Prado."""
facture = """
Murillo pratique ici son « style vaporeux » : les contours se dissolvent dans une \
lumière dorée, les angelots naissent de la brume par touches légères et transparentes. \
Seule la figure de la Vierge est construite avec des volumes nets, ce qui la fait \
avancer vers nous. La composition dessine une spirale ascendante, typique du baroque, \
du groupe d'anges du bas jusqu'au visage levé. Les plis du manteau bleu, très \
amples, donnent le mouvement à une figure par ailleurs immobile."""
details = [
  "Le fin croissant de lune sous les pieds de la Vierge, à demi caché dans les nuages.",
  "Les angelots du bas, qui tendent les bras vers elle.",
  "Le visage levé de Marie, tourné vers une lumière que l'on ne voit pas.",
  "Les têtes d'anges presque effacées dans la brume dorée, en haut à gauche.",
]
themes = ["vierge", "dévotion", "ciel", "anges", "séville"]
anecdote = """
Le retour du tableau en Espagne, en 1941, faisait partie d'un échange plus large : \
le même accord rendit aussi à Madrid la Dame d'Elche, buste ibère conservé au Louvre \
depuis 1897, la France recevant en contrepartie d'autres \
tableaux espagnols."""
salle = 2
mur = "nord"
place = 9
largeur = 1.9

[[oeuvres]]
titre = "Agnus Dei"
artiste = "Francisco de Zurbarán"
annee = "vers 1635–1640"
image = "agnus-dei.jpg"
technique = "Huile sur toile, 37,3 × 62 cm"
collection = "Musée du Prado, Madrid"
note = "Un agneau aux pattes liées, couché sur une pierre : une image du sacrifice du Christ, d'une simplicité absolue."
description = """
Sur un fond entièrement noir, un agneau est couché sur une dalle de pierre grise, vu \
de profil. Ses quatre pattes sont attachées par une cordelette, et ses sabots \
dépassent du bord de la pierre, vers nous. Sa tête repose à plat, les yeux mi-clos, \
dans une attitude d'abandon total ; de petites cornes enroulées encadrent son oreille. \
Sa toison, très blanche, est rendue boucle par boucle et accroche toute la lumière, \
qui vient de la gauche. Il n'y a rien d'autre : ni paysage, ni personnage, ni \
inscription, ni auréole. Le petit format renforce l'impression d'intimité, comme si \
l'animal était posé là, à portée de main."""
evocation = """
L'agneau est l'un des plus anciens symboles du Christ : saint Jean-Baptiste le \
désigne comme « l'Agneau de Dieu qui enlève le péché du monde », et le prophète Isaïe \
annonce un serviteur conduit comme un agneau à l'abattoir, sans ouvrir la bouche. \
L'animal aux pattes liées, couché comme sur un autel, évoque donc la Passion et le \
sacrifice accepté. Mais Zurbarán ne passe par aucun attribut religieux : la \
méditation naît seulement de la présence de l'animal, de sa douceur et de sa \
vulnérabilité. On a rapproché ces tableaux de la spiritualité des ordres monastiques \
pour lesquels il travaillait, faite de silence et de contemplation. L'œuvre est \
aussi une nature morte, au sens propre : une vie qui va être offerte."""
histoire = """
Zurbarán a peint plusieurs versions de ce motif, dans son atelier de Séville, vers \
1635-1640. Certaines portent une auréole et une inscription latine, comme celle du \
musée d'art de San Diego, en Californie ; celle du Prado, la plus dépouillée, n'en a \
aucune. On ignore pour qui elles furent faites : leur petit format suggère des \
tableaux de dévotion privée, destinés à un oratoire ou à une cellule de couvent \
plutôt qu'à une église. Longtemps conservée dans des collections particulières, la \
toile de Madrid est entrée au Prado à la fin du XXᵉ siècle, où elle est devenue l'une \
des images les plus reproduites de la peinture espagnole."""
facture = """
Zurbarán applique au sujet religieux la rigueur des bodegones, les natures mortes \
espagnoles : un objet unique, éclairé latéralement, posé au bord d'une tablette sur \
un fond noir. La laine est modelée en petites boucles de pâte épaisse, presque en \
relief, qui contrastent avec la surface lisse de la pierre. Le clair-obscur, hérité du \
Caravage, isole l'animal et lui donne une présence sculpturale. Le dessin, d'une \
précision extrême, ne laisse rien au hasard."""
details = [
  "La cordelette qui lie les quatre pattes, juste au bord de la dalle.",
  "Les boucles de laine, peintes une à une en relief.",
  "L'œil mi-clos de l'agneau, presque endormi.",
  "Les sabots qui dépassent de la pierre, comme s'ils sortaient du tableau.",
]
themes = ["sacrifice", "agneau", "symbole", "silence", "nature morte"]
anecdote = """
Quand la clientèle sévillane se tourne vers Murillo, l'atelier de Zurbarán exporte \
par bateau des séries entières de tableaux vers l'Amérique espagnole, notamment vers \
Lima et Buenos Aires : saints, apôtres et vierges partent par dizaines."""
salle = 2
mur = "sud"
place = 3
largeur = 1.2

[[oeuvres]]
titre = "Les Ménines"
artiste = "Diego Velázquez"
annee = "1656"
image = "menines.jpg"
technique = "Huile sur toile, 318 × 276 cm"
collection = "Musée du Prado, Madrid"
note = "La petite infante, ses demoiselles d'honneur, ses nains, son chien, et le peintre lui-même : le tableau le plus commenté de l'histoire de l'art."
description = """
Dans une haute salle du palais royal, au premier plan, la petite infante \
Marguerite-Thérèse, cinq ans, en robe blanche à vertugadin, est entourée de deux \
demoiselles d'honneur, les « meninas » : l'une, agenouillée, lui offre une cruche \
rouge sur un plateau, l'autre esquisse une révérence. À droite, une naine, Mari \
Bárbola, et un nain, Nicolasito Pertusato, qui pose le pied sur un gros chien \
assoupi. Derrière, une duègne en habit de veuve parle à un garde. À gauche, devant une \
immense toile vue de dos, Velázquez lui-même, pinceau et palette en main, regarde \
vers nous. Au fond, un miroir reflète le roi Philippe IV et la reine Marie-Anne, et \
dans l'encadrement d'une porte, un homme s'arrête sur les marches, dans la lumière."""
evocation = """
Qui regarde-t-on, et qui nous regarde ? Le miroir suggère que le roi et la reine se \
tiennent à notre place, devant le tableau : l'infante et sa suite seraient venues les \
voir poser. Velázquez inverse ainsi l'ordre habituel du portrait, et nous place au \
cœur d'un jeu de regards sans fin. Le peintre s'y représente à égalité avec la famille \
royale, ce qui a été lu comme une revendication de la noblesse de son art, à une \
époque où la peinture passait encore pour un métier manuel. Le philosophe Michel \
Foucault a ouvert Les Mots et les Choses, en 1966, par une analyse de ce tableau ; \
le peintre napolitain Luca Giordano l'aurait appelé « la théologie de la peinture »."""
histoire = """
Velázquez, peintre de la cour depuis 1623, peint la toile en 1656 dans le Cuarto del \
Príncipe de l'Alcázar de Madrid, l'appartement de l'ancien prince héritier qui lui \
servait d'atelier. Les inventaires du palais l'appellent alors La Famille de \
Philippe IV ; le titre de Ménines n'apparaît qu'en 1843, dans un catalogue du Prado. \
Le tableau, propriété du roi, reste dans les appartements privés et n'est vu que de \
quelques familiers. En 1734, il échappe à l'incendie qui détruit l'Alcázar. Il passe \
alors au nouveau Palais royal, puis entre au musée du Prado à son ouverture, en 1819. \
Aujourd'hui, il occupe la salle 12, au cœur du musée, à mi-chemin de la galerie \
centrale."""
facture = """
Velázquez peint par touches rapides et séparées qui, de près, ne décrivent rien et, \
de loin, deviennent étoffes, cheveux, reflets : les rubans de l'infante ne sont que \
quelques traînées de rose. Il donne surtout corps à l'air de la pièce. La lumière \
entre par les fenêtres de droite, se pose sur le groupe du premier plan, puis s'éteint \
progressivement vers le plafond, avant de réapparaître dans la porte du fond. La \
gamme, très retenue, joue sur les gris, les noirs et les blancs, rehaussés de touches \
de rouge."""
details = [
  "La croix rouge de l'ordre de Santiago sur la poitrine du peintre, ajoutée après 1659.",
  "Le miroir du fond, où se reflètent, flous, le roi et la reine.",
  "José Nieto, l'intendant de la reine, en silhouette dans la porte lumineuse.",
  "Le pied du petit Nicolasito posé sur le dos du mâtin, qui ne bronche pas.",
  "La petite cruche rouge, un búcaro, que la menina tend à l'infante.",
]
themes = ["cour", "regard", "autoportrait", "enfance", "miroir", "peinture"]
anecdote = """
En 1656, Velázquez n'était pas encore chevalier : la croix de l'ordre de Santiago, \
qu'il reçut en 1659, a été peinte sur son pourpoint plus tard. Une légende veut que \
le roi Philippe IV l'ait tracée lui-même, après la mort du peintre."""
salle = 3
mur = "nord"
place = 2
largeur = 2.76

[[oeuvres]]
titre = "La Forge de Vulcain"
artiste = "Diego Velázquez"
annee = "1630"
image = "forge-de-vulcain.jpg"
technique = "Huile sur toile, 223 × 290 cm"
collection = "Musée du Prado, Madrid"
note = "Apollon vient annoncer à Vulcain que sa femme Vénus le trompe avec Mars : un mythe antique dans une forge espagnole."
description = """
Dans une forge sombre, cinq hommes torse nu s'interrompent dans leur travail. À \
gauche, un jeune homme couronné de laurier, auréolé de lumière et drapé dans un \
manteau orangé, lève le doigt pour parler : c'est le dieu Apollon. Face à lui, près \
de l'enclume où rougit une pièce de métal, Vulcain, le forgeron boiteux au bandeau \
blanc, le regarde, bouche bée. Ses quatre assistants, les cyclopes, restent figés : l'un \
de dos, un autre penché sur une armure, deux autres près du foyer. Aux \
murs pendent des pièces d'armure, et sur la hotte de la cheminée, à droite, est posée \
une petite cruche blanche. Par la porte ouverte, à gauche, on aperçoit un ciel bleu."""
evocation = """
Velázquez illustre un épisode des Métamorphoses d'Ovide : Apollon, le dieu du soleil \
qui voit tout, révèle à Vulcain que Vénus, son épouse, le trompe avec Mars, le dieu de \
la guerre. Ironie cruelle, Vulcain est justement en train de forger une armure, \
peut-être pour son rival. Le peintre choisit l'instant de la nouvelle, quand chacun \
encaisse le choc, et le traite comme une scène de la vie quotidienne : ses dieux et \
ses cyclopes sont des artisans madrilènes, aux corps vrais et aux visages ébahis. On \
y a vu à la fois une leçon de peinture du nu, faite pour rivaliser avec les Italiens, \
et une réflexion sur la lumière divine qui entre dans l'atelier de l'artisan."""
histoire = """
Velázquez peint la toile à Rome en 1630, pendant son premier voyage en Italie, que \
Philippe IV lui avait permis d'entreprendre pour étudier les maîtres anciens et \
modernes. Il réalise en même temps La Tunique de Joseph, aujourd'hui au monastère de \
l'Escurial. Ce ne sont pas des commandes : le peintre les fait de sa propre \
initiative, comme des démonstrations de ce qu'il a appris. De retour à Madrid, il les \
garde quelques années, puis le roi les achète en 1634 pour le palais du Buen Retiro, \
qu'il fait alors décorer. La Forge passe ensuite dans les collections royales et \
entre au musée du Prado au XIXᵉ siècle."""
facture = """
Le séjour en Italie transforme la manière de Velázquez. Il abandonne les fonds bruns \
et le clair-obscur violent de ses débuts sévillans pour une lumière plus égale et \
une gamme plus claire, faite de gris, d'ocres et de bruns chauds. Les corps nus, \
étudiés d'après le modèle et d'après les statues antiques, sont disposés en frise, \
comme un bas-relief. La couleur vive est réservée au manteau d'Apollon, seul élément \
surnaturel de la scène. La cruche blanche annonce le peintre de natures mortes."""
details = [
  "La couronne de laurier et le halo de lumière autour de la tête d'Apollon.",
  "La petite cruche blanche sur la hotte de la cheminée, en haut à droite.",
  "Le bout de métal rougi sur l'enclume, que Vulcain tient avec une pince.",
  "La sandale bleue d'Apollon, seule note de couleur froide sur le sol.",
]
themes = ["mythologie", "nu", "forge", "nouvelle", "travail"]
anecdote = """
Dans la mythologie, les cyclopes, les assistants de Vulcain, n'ont qu'un œil au \
milieu du front. Velázquez ignore ce détail : ses forgerons ont deux yeux, comme \
n'importe quel ouvrier de son temps."""
salle = 3
mur = "ouest"
place = 2
largeur = 2.9

[[oeuvres]]
titre = "Les Bergers d'Arcadie (Et in Arcadia ego)"
artiste = "Nicolas Poussin"
annee = "vers 1638–1640"
image = "et-in-arcadia-ego.jpg"
technique = "Huile sur toile, 85 × 121 cm"
collection = "Musée du Louvre, Paris"
note = "Trois bergers déchiffrent une inscription sur un tombeau : même au pays du bonheur, la mort est présente."
description = """
Dans un paysage de collines et d'arbres sous un ciel bleu traversé de nuages, trois \
bergers et une jeune femme se tiennent autour d'un grand tombeau de pierre. L'un des \
bergers, un genou à terre, suit du doigt les lettres gravées sur la pierre : ET IN \
ARCADIA EGO. Un autre, accoudé au monument, penche la tête pour lire. Le troisième \
se tourne vers la femme, debout à droite, en robe bleue et manteau jaune, la main \
sur sa hanche, et semble lui demander le sens de l'inscription. Elle l'écoute, \
calme, le regard baissé. Les figures, peu nombreuses, sont disposées de part et \
d'autre du tombeau, comme sur un bas-relief antique."""
evocation = """
L'Arcadie est, depuis Virgile, le pays idéal des bergers, de la poésie et de \
l'amour. La phrase latine, « Et in Arcadia ego », signifie « Moi aussi, je suis en \
Arcadie » : c'est la Mort qui parle, ou peut-être le défunt enterré là. Les bergers \
découvrent que le bonheur lui-même est mortel. Dans une première version, peinte vers \
1627 et conservée à Chatsworth, en Angleterre, Poussin montrait une scène plus \
agitée ; ici, la surprise fait place à la méditation. L'historien Erwin Panofsky a \
montré comment le tableau glisse d'un avertissement, « souviens-toi que tu vas \
mourir », vers une rêverie mélancolique sur le passé. La femme, sereine, a été lue \
comme une figure de la sagesse."""
histoire = """
Poussin peint la toile à Rome, où il vit depuis 1624, peu avant son séjour à \
Paris, où Louis XIII et Richelieu l'appellent en 1640. Le commanditaire n'est pas \
connu avec certitude. Le thème lui-même venait d'Italie : le peintre Guerchin avait \
déjà représenté deux bergers découvrant un crâne posé sur une pierre portant la même \
inscription. Le tableau entre dans les collections de Louis XIV en 1685, puis passe au \
musée du Louvre à la Révolution. Il devient au XVIIIᵉ et au XIXᵉ siècle l'une des \
images emblématiques du classicisme français, copiée et méditée par les élèves de \
l'Académie."""
facture = """
Poussin construit son tableau avec la rigueur d'un architecte. Pour régler ses \
compositions, il disposait dans une boîte de petites figurines de cire drapées qu'il \
éclairait comme une scène de théâtre. Les quatre personnages, inspirés de la \
sculpture antique, s'équilibrent autour du tombeau, et les gestes des mains guident \
le regard vers l'inscription. Les couleurs, bleu, jaune, rouge, se répondent d'une \
figure à l'autre. Le paysage, sobre, sert de cadre à la réflexion."""
details = [
  "L'inscription gravée, ET IN ARCADIA EGO, sous le doigt du berger agenouillé.",
  "L'ombre du bras du berger sur la pierre, dans laquelle on a voulu voir une faux.",
  "La main posée sur l'épaule du berger par la jeune femme, à droite.",
  "Les montagnes bleutées à l'horizon, à gauche, sous un ciel nuageux.",
]
themes = ["mort", "arcadie", "bergers", "méditation", "antiquité"]
anecdote = """
Le tableau a nourri, à partir des années 1960, des théories ésotériques sans \
fondement, liant le tombeau à un prétendu trésor de Rennes-le-Château, dans l'Aude. \
Les historiens de l'art n'y ont jamais trouvé le moindre indice sérieux."""
salle = 5
mur = "est"
place = 2
largeur = 1.25

[[oeuvres]]
titre = "Port de mer avec l'embarquement de la reine de Saba"
artiste = "Claude Lorrain"
annee = "1648"
image = "embarquement-reine-de-saba.jpg"
technique = "Huile sur toile, 149 × 197 cm"
collection = "National Gallery, Londres"
note = "Au soleil levant, la reine de Saba quitte son palais pour aller rendre visite au roi Salomon."
description = """
Un port imaginaire s'ouvre sur la mer, face au soleil, qui se lève juste au-dessus de \
l'horizon. À droite, un palais à colonnes, couronné de statues, descend vers le \
quai par un grand escalier : la reine de Saba et sa suite descendent les \
marches, vers une barque qui l'attend. À gauche se dressent les ruines \
d'un temple à colonnes corinthiennes, derrière lesquelles sont amarrés des voiliers. \
Au centre, une tour ronde et une arche fermant la rade, et un grand navire à l'ancre. \
Au premier plan, des porteurs chargent des coffres dans des barques. Le reflet du \
soleil trace sur l'eau un chemin de lumière qui mène droit au spectateur."""
evocation = """
La Bible raconte que la reine de Saba, ayant entendu parler de la sagesse du roi \
Salomon, partit le rencontrer avec des chameaux chargés d'aromates, d'or et de \
pierres précieuses. Claude choisit le moment du départ, mais la reine n'occupe \
qu'une petite place : le vrai sujet est la lumière du matin, qui inonde le ciel, se \
reflète dans l'eau et dore les façades. Ce départ vers l'inconnu évoque le voyage, \
l'espoir, la promesse d'une rencontre. Le paysage, à la fois antique et moderne, \
compose une sorte d'âge d'or rêvé, où l'histoire sacrée se mêle à la vie d'un grand \
port méditerranéen. On y a vu la naissance d'un paysage poétique, fait pour la \
contemplation."""
histoire = """
Claude peint le tableau à Rome en 1648 pour Frédéric-Maurice de La Tour d'Auvergne, \
duc de Bouillon, comme pendant au Paysage avec le mariage d'Isaac et Rébecca, \
conservé lui aussi à Londres. Il en garde une copie dessinée dans son Liber \
Veritatis, le livre où il consignait chacun de ses tableaux pour les distinguer des \
contrefaçons. Après plusieurs propriétaires, les deux toiles gagnent l'Angleterre, où \
Claude était particulièrement admiré, et font partie de la collection de John Julius \
Angerstein. En 1824, l'achat de cette collection par l'État britannique donne \
naissance à la National Gallery : ce port de mer en est donc l'un des tout premiers \
tableaux."""
facture = """
Claude est l'un des premiers peintres à placer le soleil lui-même dans son tableau, \
et à peindre à contre-jour. Toute la composition est réglée sur ce point lumineux : \
les bâtiments, en coulisse de part et d'autre comme sur une scène, ouvrent une \
perspective vers l'horizon. La lumière se dégrade du jaune pâle au bleu, et la \
perspective aérienne fait pâlir les lointains. Les figures, très petites, ont \
parfois été confiées, selon ses biographes, à des collaborateurs."""
details = [
  "Le disque du soleil, à peine levé, au ras de l'horizon.",
  "Le cortège de la reine de Saba, sur les marches du palais à droite.",
  "Les coffres de présents qu'on charge dans la barque, au premier plan.",
  "Le reflet du soleil qui ondule sur l'eau jusqu'au bas du tableau.",
]
themes = ["port", "soleil", "voyage", "bible", "paysage"]
anecdote = """
Turner admirait tant ce tableau qu'il légua deux de ses propres toiles à la nation à \
une condition : qu'elles soient accrochées à côté de deux Claude, dont celui-ci. On \
peut toujours les voir côte à côte à la National Gallery."""
salle = 5
mur = "nord"
place = 2
largeur = 1.97

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Le Caravage"
vie = "Milan, 29 septembre 1571 – Porto Ercole, 18 juillet 1610"
biographie = """
Michelangelo Merisi naît à Milan et grandit à Caravaggio, le bourg lombard dont il \
prendra le nom. Apprenti à Milan chez le peintre Simone Peterzano, il arrive à Rome \
au début des années 1590, sans argent ni relations, et peint d'abord des fruits et \
des jeunes gens costumés pour des marchands. Le cardinal Francesco Maria Del Monte le \
remarque, le loge dans son palais et lui obtient en 1599 la commande de la chapelle \
Contarelli, qui le rend célèbre. Suivent de grands tableaux d'église, dont certains \
sont refusés parce que les saints y ont des pieds sales et des visages du peuple. \
Querelleur, souvent armé, il passe plusieurs fois en prison. En mai 1606, il tue \
Ranuccio Tomassoni dans une rixe et doit fuir Rome, condamné à mort. Il travaille à \
Naples, puis à Malte, où il est fait chevalier avant d'être emprisonné et chassé de \
l'ordre, puis en Sicile. En 1610, alors qu'il espère la grâce du pape, il meurt sur la \
côte toscane, à trente-huit ans, sur le chemin du retour vers Rome."""
style = """
Le Caravage peint d'après le modèle vivant, sans idéaliser : rides, ongles noirs, \
fruits gâtés. Il plonge ses scènes dans l'obscurité et les éclaire d'un faisceau \
violent qui sculpte les corps, et cadre ses personnages de près, à mi-corps, comme \
s'ils étaient dans notre espace. Cette révolution a fait naître dans toute l'Europe \
le « caravagisme » : Artemisia Gentileschi, Georges de La Tour, le jeune Velázquez, \
Ribera ou Rembrandt lui doivent beaucoup."""

[[artistes]]
nom = "Artemisia Gentileschi"
vie = "Rome, 8 juillet 1593 – Naples, vers 1654"
biographie = """
Fille du peintre Orazio Gentileschi, ami du Caravage, Artemisia apprend son métier \
dans l'atelier paternel, à Rome, car les femmes n'ont pas accès aux académies. En \
1611, elle est violée par Agostino Tassi, un peintre que son père lui avait donné \
comme professeur. Orazio porte plainte : au procès, en 1612, la jeune femme subit la \
torture pour prouver la véracité de son témoignage. Mariée peu après, elle s'installe \
à Florence, où elle travaille pour les Médicis, se lie avec Galilée et devient en \
1616 la première femme membre de l'Accademia delle Arti del Disegno. Elle séjourne \
ensuite à Rome et à Venise, puis se fixe à Naples à partir de 1630. Vers 1638, elle \
rejoint son père à Londres, à la cour de Charles Iᵉʳ, avant de revenir à Naples, où \
elle dirige un atelier jusqu'à sa mort. Oubliée pendant des siècles, elle est \
redécouverte au XXᵉ siècle et compte aujourd'hui parmi les peintres les plus \
étudiées du baroque."""
style = """
Artemisia reprend le naturalisme et le clair-obscur du Caravage, mais avec une \
attention particulière aux étoffes, aux bijoux et aux carnations, héritée du goût \
florentin. Elle peint surtout des héroïnes de la Bible et de l'histoire antique, \
Judith, Suzanne, Lucrèce, Cléopâtre, qu'elle montre actives, résolues, souvent en \
lutte. Ses compositions, puissantes et théâtrales, l'ont imposée comme l'une des \
grandes figures du caravagisme."""

[[artistes]]
nom = "Georges de La Tour"
vie = "Vic-sur-Seille (duché de Lorraine), 14 mars 1593 – Lunéville, 30 janvier 1652"
biographie = """
Fils d'un boulanger de Vic-sur-Seille, en Lorraine, alors duché indépendant, Georges \
de La Tour reçoit une formation dont on ne sait presque rien ; il a peut-être voyagé \
en Italie ou aux Pays-Bas, où il aurait découvert la peinture caravagesque. En 1617, \
il épouse Diane Le Nerf, fille d'une famille noble, et s'installe en 1620 à \
Lunéville, où il devient un notable aisé, réputé pour son caractère dur envers les \
paysans. La guerre de Trente Ans ravage la Lorraine : la peste, les famines et les \
armées n'épargnent pas Lunéville, incendiée en 1638. La Tour séjourne alors à Paris \
et reçoit le titre de « peintre ordinaire du roi » ; Louis XIII aurait gardé dans sa \
chambre un de ses tableaux de saint Sébastien. Revenu à Lunéville, il y meurt en 1652, \
quelques jours après sa femme, probablement d'une épidémie. Son nom sombre ensuite \
dans l'oubli, jusqu'à sa redécouverte au XXᵉ siècle. On ne lui connaît aujourd'hui \
qu'une quarantaine de tableaux."""
style = """
La Tour a peint des scènes « diurnes », éclairées par la lumière du jour, comme Le \
Tricheur, et surtout des « nocturnes » où une seule chandelle fait surgir de l'ombre \
des figures recueillies, comme ses Madeleine ou son Saint Joseph charpentier. Son art \
repose sur une simplification extrême des formes, des volumes lisses et géométriques, \
un silence et une immobilité qui donnent à ses tableaux une gravité presque moderne."""

[[artistes]]
nom = "Pierre Paul Rubens"
vie = "Siegen (Westphalie), 28 juin 1577 – Anvers, 30 mai 1640"
biographie = """
Né en Westphalie, où son père, protestant, s'était exilé, Rubens grandit à Anvers \
après la mort de celui-ci, reçoit une solide éducation humaniste et se forme auprès \
de plusieurs peintres de la ville. De 1600 à 1608, il vit en Italie au service du duc \
de Mantoue, étudie Titien, Michel-Ange et l'Antique, et accomplit en 1603 une \
première mission en Espagne. Revenu à Anvers, il devient peintre de la cour des \
archiducs Albert et Isabelle, épouse Isabella Brant et ouvre un immense atelier, d'où \
sortent retables, décors et portraits pour toute l'Europe : le cycle de Marie de \
Médicis pour le palais du Luxembourg, le plafond de Whitehall à Londres. Diplomate, \
il négocie la paix entre l'Espagne et l'Angleterre en 1629-1630 et reçoit le titre de \
chevalier. Veuf en 1626, il épouse en 1630 Hélène Fourment, qui lui inspire ses \
tableaux les plus sensuels. Il meurt à Anvers en 1640, au sommet de sa gloire."""
style = """
Rubens est le peintre du mouvement et de l'abondance : compositions en spirale, \
corps puissants, chairs nacrées, couleurs chaudes posées avec une touche fluide et \
rapide. Il unit la leçon des Vénitiens, la monumentalité de Michel-Ange et le sens \
flamand du détail. Son influence est immense, de Van Dyck à Watteau, Delacroix et \
Renoir ; à la fin du XVIIᵉ siècle, les « rubénistes » défendront contre les \
partisans de Poussin la primauté de la couleur sur le dessin."""

[[artistes]]
nom = "Bartolomé Esteban Murillo"
vie = "Séville, baptisé le 1ᵉʳ janvier 1618 – Séville, 3 avril 1682"
biographie = """
Dernier des quatorze enfants d'un barbier-chirurgien de Séville, Murillo est orphelin \
à dix ans et élevé par sa sœur aînée et son beau-frère. Il se forme auprès du peintre \
Juan del Castillo et commence par peindre des tableaux de dévotion vendus en série, \
dont une partie part pour l'Amérique. Séville est alors le grand port de l'Empire \
espagnol, mais la peste de 1649 y tue près de la moitié de la population. Dans les \
années 1650, Murillo devient le peintre le plus demandé de la ville, éclipsant \
Zurbarán. Il travaille pour la cathédrale, les couvents et les confréries, comme \
celle de la Charité, pour laquelle il peint une grande série d'œuvres de miséricorde. \
En 1660, il fonde avec Francisco Herrera le Jeune une académie de dessin dont il est \
le premier président. Veuf en 1663, il reste à Séville toute sa vie. Il meurt en \
1682, peu après une chute d'échafaudage survenue, selon la tradition, alors qu'il \
peignait un retable pour les Capucins de Cadix."""
style = """
Murillo est le peintre de la tendresse : vierges juvéniles, enfants Jésus et petits \
saint Jean, mais aussi petits mendiants des rues de Séville, peints avec affection et \
humour. Sa manière évolue d'un clair-obscur hérité de Zurbarán vers un « style \
vaporeux » aux contours fondus et aux tons dorés. Considéré aux XVIIIᵉ et XIXᵉ \
siècles comme le plus grand peintre espagnol, il a fixé l'image de l'Immaculée \
Conception dans toute la catholicité."""

[[artistes]]
nom = "Francisco de Zurbarán"
vie = "Fuente de Cantos (Estrémadure), baptisé le 7 novembre 1598 – Madrid, 27 août 1664"
biographie = """
Fils d'un commerçant d'Estrémadure, Zurbarán part à quinze ans faire son \
apprentissage à Séville. Il s'installe d'abord à Llerena, près de son village natal, \
puis, appelé par les grands ordres religieux, revient à Séville où le conseil de la \
ville l'invite à se fixer en 1629. Il y devient le peintre des moines : chartreux, \
hiéronymites, franciscains, dominicains et mercédaires lui commandent de grands \
cycles pour leurs couvents, dont ceux du monastère de Guadalupe et de la chartreuse \
de Jerez. En 1634, il est appelé à Madrid pour peindre une série des Travaux \
d'Hercule destinée au palais du Buen Retiro, où il côtoie Velázquez. Mais à partir \
des années 1640, le goût sévillan se tourne vers Murillo, plus doux ; Zurbarán \
travaille de plus en plus pour l'exportation vers l'Amérique. En 1658, il s'installe à \
Madrid, adoucit sa manière, et y meurt en 1664 dans une situation modeste."""
style = """
Zurbarán peint des figures monumentales et immobiles, moines en méditation, saintes \
en robes de soie, avec un clair-obscur hérité du Caravage et un dessin d'une grande \
netteté. Ses blancs, en particulier ceux des habits monastiques, comptent parmi les \
plus beaux de la peinture. Ses rares natures mortes, quelques objets alignés sur un \
fond noir, ont fasciné les peintres modernes par leur dépouillement."""

[[artistes]]
nom = "Diego Velázquez"
vie = "Séville, baptisé le 6 juin 1599 – Madrid, 6 août 1660"
biographie = """
Diego Rodríguez de Silva y Velázquez entre à douze ans dans l'atelier du peintre \
sévillan Francisco Pacheco, dont il épouse la fille, Juana, en 1618. Ses premières \
œuvres, scènes de cuisine et de taverne, montrent l'influence du Caravage. En 1623, il \
peint le jeune roi Philippe IV, qui le nomme peintre de la cour : il ne quittera plus \
Madrid, sinon pour deux voyages en Italie, en 1629-1631 puis en 1649-1651, où il \
peint le portrait du pape Innocent X. Rubens, venu à Madrid en 1628, l'encourage à \
étudier les maîtres italiens. Au palais, Velázquez cumule les charges : il organise \
les décors, achète des tableaux pour le roi et devient en 1652 grand maréchal du \
palais. En 1659, il obtient enfin d'être fait chevalier de l'ordre de Santiago, après \
une longue enquête sur ses origines. En 1660, il organise les cérémonies du mariage \
de Louis XIV et de l'infante Marie-Thérèse, sur l'île des Faisans, et meurt peu après \
son retour à Madrid."""
style = """
Velázquez passe d'un naturalisme sombre et précis à une peinture de plus en plus \
libre, où quelques touches suffisent à suggérer une étoffe ou un reflet. Il peint \
l'air et la lumière d'une pièce, et regarde avec la même dignité le roi, les nains de \
la cour et les artisans. Manet, qui découvre ses tableaux à Madrid en 1865, l'appelle \
le « peintre des peintres » ; les impressionnistes et Picasso lui doivent beaucoup."""

[[artistes]]
nom = "Nicolas Poussin"
vie = "Les Andelys (Normandie), juin 1594 – Rome, 19 novembre 1665"
biographie = """
Né près des Andelys, en Normandie, Nicolas Poussin décide très jeune d'être peintre \
et monte à Paris, où il mène une vie difficile pendant une dizaine d'années. Après \
deux tentatives manquées, il gagne Rome en 1624 et y reste presque toute sa vie. Il \
y trouve un protecteur, l'érudit Cassiano dal Pozzo, qui lui ouvre sa bibliothèque et \
ses collections d'antiques, et une clientèle d'amateurs cultivés, souvent français. \
En 1640, Louis XIII et Richelieu l'appellent à Paris comme premier peintre du roi, \
mais les intrigues de la cour et les grands décors du Louvre le lassent : il repart \
pour Rome dès 1642. Il y peint, pour des collectionneurs fidèles comme Paul Fréart de \
Chantelou, des tableaux de chevalet d'une grande profondeur : la série des Sept \
Sacrements, des paysages, et enfin Les Quatre Saisons. Malade, les mains \
tremblantes, il meurt à Rome en 1665 et est enterré dans l'église San Lorenzo in \
Lucina."""
style = """
Poussin est le maître du classicisme français : des compositions pensées comme des \
démonstrations, où chaque geste et chaque couleur ont leur raison, inspirées de \
Raphaël et de la sculpture antique. Il voulait que la peinture s'adresse à l'esprit \
autant qu'aux yeux. L'Académie royale fit de son art un modèle, et les \
« poussinistes » y défendirent la primauté du dessin ; David, Ingres et Cézanne \
se réclamèrent de lui."""

[[artistes]]
nom = "Claude Lorrain"
vie = "Chamagne (duché de Lorraine), vers 1600 – Rome, 23 novembre 1682"
biographie = """
Claude Gellée, dit le Lorrain, naît dans un village des Vosges lorraines, dans une \
famille modeste. Orphelin, il part très jeune pour l'Italie ; selon ses premiers \
biographes, il aurait d'abord été employé comme pâtissier ou domestique. À Rome, il \
devient l'assistant du peintre de paysages et de décors Agostino Tassi, puis passe \
deux ans à Naples. Après un bref retour en Lorraine, il s'installe définitivement à \
Rome en 1627. Dans les années 1630, sa réputation de paysagiste est faite : le pape \
Urbain VIII, des cardinaux, des princes romains et le roi d'Espagne Philippe IV, pour \
son palais du Buen Retiro, lui commandent des tableaux. Pour se protéger des \
imitateurs, il tient à partir de 1635 environ le Liber Veritatis, un recueil de \
près de deux cents dessins qui reproduisent ses toiles, aujourd'hui au British \
Museum. Il ne se marie pas, mais élève une fille, Agnese, et vit entouré de ses neveux \
jusqu'à sa mort, à Rome, en 1682."""
style = """
Claude invente le paysage idéal : des ports et des campagnes antiques baignés d'une \
lumière dorée, construits comme des scènes de théâtre, où de petites figures \
racontent une histoire biblique ou mythologique. Il observe la nature en plein air, \
dans la campagne romaine, mais la recompose en atelier. Ses tableaux ont modelé le \
goût anglais du jardin paysager et inspiré Turner."""
