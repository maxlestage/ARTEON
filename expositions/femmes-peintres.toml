[exposition]
ordre = 105
nom_court = "Femmes peintres"
mouvement = "Femmes peintres, XVIᵉ–XXᵉ siècle"
cadre = "dore"
couleur = "#8a3a5c"
titre = "Femmes peintres, quatre siècles de regards"
artiste = "Anguissola, Leyster, Kauffman, Morisot, Cassatt, Valadon…"
dates = "1555–1923"
accroche = "Exposition virtuelle · National Museum of Women in the Arts, Washington"
introduction = """
Pendant des siècles, les femmes ont été tenues à l'écart des académies, des ateliers \
et des cours de dessin d'après le modèle nu : celles qui ont peint l'ont fait à force \
de talent et d'obstination, souvent grâce à un père ou à un mari artiste. Cette visite \
en réunit dix, de la Crémone de 1555 au Paris des années 1920 : portraits de famille, \
scènes de genre, fleurs, autoportraits qui revendiquent un métier, impressionnisme et \
modernité. Le bâtiment s'inspire du National Museum of Women in the Arts de \
Washington, ancien temple maçonnique devenu en 1987 le premier grand musée consacré \
aux femmes artistes : on entre par son grand hall de marbre à mezzanine, avant de \
passer dans les salons."""
vitrine = "berceau.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "National Museum of Women in the Arts"
ville = "Washington, États-Unis"
architecte = "Waddy Butler Wood"
construction = "1907–1908"
presentation = """
En 1981, la collectionneuse Wilhelmina Cole Holladay et son mari Wallace fondent à \
Washington un musée consacré aux femmes artistes, alors presque absentes des grandes \
collections. En 1983, ils achètent un ancien temple maçonnique, élevé en 1907–1908 à \
quelques rues de la Maison-Blanche, dans un style néo-Renaissance, par l'architecte \
Waddy Butler Wood. Restauré, l'édifice ouvre au public en 1987. Son cœur est le grand \
hall, une salle d'apparat de marbre haute de deux étages, éclairée par des lustres, d'où \
un double escalier monte vers la mezzanine. Les galeries présentent une collection de \
plusieurs milliers d'œuvres, de la Renaissance à nos jours, de Lavinia Fontana et Clara \
Peeters à Frida Kahlo et Louise Bourgeois. Après deux ans de rénovation, le musée a \
rouvert ses portes en octobre 2023."""
ici = """
ARTEON reprend l'ordonnance du temple. Le grand hall, une salle claire de 16 mètres sur \
14, haute de 10 mètres, accueille le visiteur par le sud. À l'ouest s'ouvre le \
Salon I · Les pionnières, aux murs rose poudré. Au nord, deux portes percées dans le mur \
du fond, là où monte le double escalier du vrai musée, mènent à La mezzanine · Les \
impressionnistes, aussi vaste que le hall mais ici de plain-pied, et haute de \
6,5 mètres. On revient enfin par le hall vers l'est et le Salon II · Lumière et liberté, \
aux murs crème. Les deux salons, hauts de 5,5 mètres, sont plus intimes."""

