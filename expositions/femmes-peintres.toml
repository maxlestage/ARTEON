#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/femmes-peintres/). Le nom
#  du fichier donne l'adresse de l'exposition sur le site : /femmes-peintres.
