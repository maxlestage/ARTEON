[exposition]
ordre = 116
nom_court = "La photographie, un art"
mouvement = "Pictorialisme, Photo-Sécession et photographie documentaire"
cadre = "blanc"
couleur = "#4a4640"
titre = "La photographie devient un art, 1880–1930"
artiste = "Demachy, White, Eugene, Käsebier, Stieglitz, Hine, Johnston, Blossfeldt, Atget…"
dates = "1899–1928"
accroche = "Exposition virtuelle · Maison européenne de la photographie, Paris"
introduction = """
Vers 1890, n'importe qui peut prendre une photographie : l'appareil Kodak et les \
plaques toutes prêtes ont mis le procédé entre toutes les mains. Pour se distinguer, \
des amateurs passionnés, à Paris, Londres, Vienne ou New York, veulent faire de la \
photographie un art à part entière, l'égal de la peinture et de la gravure : c'est le \
pictorialisme. À New York, Alfred Stieglitz fédère ce combat autour de la \
Photo-Sécession et de sa revue Camera Work. Dans le même temps, d'autres font de \
l'appareil un instrument de vérité, pour dénoncer le travail des enfants ou montrer \
les formes cachées des plantes, tandis que l'autochrome des frères Lumière apporte \
enfin la couleur. La visite suit ce chemin en dix images, de 1899 à 1928. Le \
bâtiment s'inspire de la Maison européenne de la photographie, installée dans un \
hôtel particulier du Marais, à Paris."""
vitrine = "la-main-de-l-homme.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Maison européenne de la photographie (MEP)"
ville = "Paris, France"
architecte = "Yves Lion (restauration et aile contemporaine)"
construction = "Début du XVIIIᵉ siècle (l'hôtel Hénault de Cantobre) ; musée ouvert en 1996"
presentation = """
La Maison européenne de la photographie occupe, rue de Fourcy, dans le quartier du \
Marais, l'hôtel Hénault de Cantobre, un hôtel particulier du début du XVIIIᵉ siècle. \
La Ville de Paris l'a fait restaurer et agrandir pour y installer un lieu consacré à \
la photographie : l'architecte Yves Lion a conservé la demeure ancienne et lui a \
ajouté une aile contemporaine, sobre et lumineuse. Le musée ouvre ses portes en 1996, \
sous la direction de Jean-Luc Monterosso, qui avait déjà lancé à Paris le Mois de la \
Photo. Il réunit aujourd'hui une collection de plus de vingt mille tirages, surtout \
de la photographie contemporaine depuis les années 1950, une bibliothèque spécialisée \
et un auditorium. Chaque saison, plusieurs expositions y présentent aussi bien les \
grands noms du siècle que de jeunes photographes."""
ici = """
Le bâtiment d'ARTEON emprunte à la MEP son double visage, une demeure ancienne \
prolongée par une aile moderne. On entre par le sud dans « Les salons de l'hôtel », \
aux murs ivoire, où le pictorialisme de Demachy, White et Eugene imite la gravure et \
la peinture. Au nord s'ouvre « La galerie de la Sécession », grise et haute de sept \
mètres, où Käsebier et Stieglitz représentent New York. À l'ouest, « Le monde au \
travail » réunit Hine et Frances Benjamin Johnston ; à l'est, « La nature et la \
science » rapproche Blossfeldt et Atget. Au nord enfin, dans l'aile moderne, un petit \
cabinet aux murs sombres, « La couleur », abrite un autochrome de Stieglitz."""

