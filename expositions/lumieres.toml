# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « LUMIÈRES » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/lumieres/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /lumieres.
#
#  Une exposition à plusieurs peintres : chaque œuvre précise son « artiste ».
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 60
nom_court = "Lumières"
mouvement = "Rococo et néoclassicisme"
cadre = "baroque"
couleur = "#8e3b4f"
titre = "Le siècle des Lumières, du rococo au néoclassicisme"
artiste = "Watteau, Boucher, Fragonard, Chardin, David, Ingres…"
dates = "1717–1814"
accroche = "Exposition virtuelle · Wallace Collection, Londres"
introduction = """
Au XVIIIᵉ siècle, la peinture passe de la grâce du rococo, ses fêtes galantes, ses nus \
nacrés et ses jeux amoureux, à la rigueur du néoclassicisme, qui exalte la vertu \
antique à la veille de la Révolution. Dix toiles suivent ce basculement, de Watteau à \
Fragonard, de Chardin à Canaletto, Gainsborough et Vigée Le Brun, jusqu'à David et \
Ingres. Le bâtiment s'inspire de la Wallace Collection à Londres, la demeure \
d'Hertford House, où des salons aux murs colorés s'ordonnent autour d'une cour \
couverte d'une verrière. La dernière salle, haute et solennelle, évoque la salle Daru \
du Louvre et ses très grands formats de David."""
vitrine = "escarpolette.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Wallace Collection"
ville = "Londres, Royaume-Uni"
construction = "ouverte en 1900"
presentation = """
Hertford House, au nord d'Oxford Street, est un hôtel particulier de la fin du XVIIIᵉ \
siècle, bâti pour le duc de Manchester, qui a donné son nom à la place qu'il borde, \
Manchester Square. Les marquis de Hertford en font leur demeure londonienne et, sur \
quatre générations, y accumulent tableaux, meubles, porcelaines de Sèvres et armures ; \
le quatrième marquis, qui vit à Paris, réunit l'essentiel des chefs-d'œuvre du XVIIIᵉ \
siècle français. Son héritier, Sir Richard Wallace, agrandit la maison pour y installer \
la collection, que sa veuve lègue à la nation en 1897. Le musée ouvre en 1900, à \
condition que la collection reste entière et sans ajout. Les salons, aux murs tendus \
d'étoffes de couleur, gardent l'atmosphère d'une demeure, et la cour intérieure est \
couverte d'une verrière depuis 2000. On y voit l'Escarpolette de Fragonard, Watteau, \
Boucher, Canaletto et le Cavalier riant de Frans Hals."""
ici = """
Le bâtiment d'ARTEON reprend le plan d'Hertford House : une cour couverte au centre, des \
salons tout autour. On entre par le sud dans la cour couverte, carrée, haute de dix \
mètres sous sa verrière. À l'ouest s'ouvre le salon I · Les fêtes galantes, aux murs \
rose pâle ; à l'est, le salon II · La vie et les visages, aux murs vert tendre, deux \
pièces de six mètres de haut. Au nord, la grande salle néoclassique, large de plus de \
vingt-trois mètres et haute de dix, aux murs rouge pâle, évoque la salle Daru du Louvre \
et accueille David et Ingres."""

# ─── Le plan du musée ────────────────────────────────────────────────────────
