[exposition]
ordre = 155
nom_court = "Peinture nordique"
mouvement = "La lumière du Nord, peinture scandinave"
cadre = "bois"
couleur = "#2f5470"
titre = "La lumière du Nord, peinture scandinave et finlandaise"
artiste = "Krøyer, Hammershøi, Larsson, Zorn, Schjerfbeck, Gallen-Kallela, Simberg…"
dates = "1883–1926"
accroche = "Exposition virtuelle · Ateneum, Helsinki"
introduction = """
Entre 1880 et 1920, les peintres du Danemark, de Suède, de Norvège et de Finlande, \
formés à Paris, rentrent chez eux pour peindre ce qui n'appartient qu'au Nord : les \
soirs d'été qui ne finissent pas, la lumière rasante des intérieurs d'hiver, les fêtes \
de la Saint-Jean et les mythes du Kalevala. La visite réunit onze peintres, de la plage \
de Skagen aux rives du lac de Jølster, en onze tableaux. Le bâtiment s'inspire de \
l'Ateneum d'Helsinki, le palais des arts néo-Renaissance de la place de la Gare : un \
vestibule, une grande salle centrale haute et symétrique, deux galeries latérales et, \
au fond, une salle consacrée aux trésors finlandais du musée."""
vitrine = "soiree-ete-skagen.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Ateneum"
ville = "Helsinki, Finlande"
architecte = "Theodor Höijer"
construction = "1887"
presentation = """
Au XIXᵉ siècle, les milieux artistiques finlandais se battent longtemps pour obtenir un \
bâtiment qui réunisse leur école de dessin et leurs collections. L'Ateneum, dessiné par \
l'architecte Theodor Höijer, est achevé en 1887 au bord de la place de la Gare, au cœur \
d'Helsinki. Son nom évoque l'Athénée antique, et sa façade néo-Renaissance, \
parfaitement symétrique, est un programme sculpté : les bustes de l'architecte \
Bramante, du peintre Raphaël et du sculpteur Phidias au-dessus de l'entrée, quatre \
cariatides figurant les arts, et au fronton la devise latine Concordia res parvae \
crescunt, « par la concorde, les petites choses grandissent », sculptures de Carl Eneas \
Sjöstrand ; entre les fenêtres, seize médaillons de Ville Vallgren. Le bâtiment a \
longtemps abrité aussi des écoles d'art. Rénové de 1985 à 1991, il est aujourd'hui l'un \
des musées de la Galerie nationale de Finlande et conserve les grands tableaux de l'âge \
d'or finlandais, de Gallen-Kallela, Schjerfbeck ou Simberg. En 1903, la Rue à \
Auvers-sur-Oise y fit de sa collection la première au monde à compter une toile de Van \
Gogh."""
ici = """
Le bâtiment d'ARTEON reprend la symétrie de l'Ateneum autour d'un axe central. On entre \
par le sud dans le vestibule, aux murs crème, qui ouvre sur la grande salle, carrée, \
haute de onze mètres, consacrée à Skagen et à Sundborn. De part et d'autre s'ouvrent \
deux galeries jumelles : à l'ouest, « Les intérieurs », aux murs gris perle, consacrés \
aux pièces silencieuses de Copenhague, de Skagen et de Paris ; à l'est, « Les nuits \
claires », d'un bleu pâle, pour les fêtes et les nuits de l'été nordique. Au fond, au \
nord, la salle finlandaise, aux murs ocre clair, réunit trois tableaux phares de \
l'Ateneum."""

