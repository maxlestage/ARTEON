# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « AVANT LE STREET ART, L'ART DES MURS » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/street-art/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /street-art.
#
#  Droits : les œuvres exposées sont toutes dans le domaine public (peintures
#  murales antiques et médiévales, estampe et affiche du XIXᵉ siècle). Les
#  photographies sont publiées sous licence CC0 par les musées qui les conservent
#  (Metropolitan Museum of Art, Cleveland Museum of Art, Art Institute of
#  Chicago) ; chaque image indique le musée et l'adresse de sa fiche.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 220
nom_court = "L'art des murs"
mouvement = "Peinture murale et art de la rue"
cadre = "aucun"
couleur = "#b23a12"
titre = "Avant le street art, l'art des murs"
artiste = "Rome, Teotihuacan, Carle Vernet, Jules Chéret, Chine des Yuan, Espagne romane…"
dates = "Iᵉʳ siècle av. J.-C. – 1886"
accroche = "Exposition virtuelle · Urban Nation Museum, Berlin"
introduction = """
On n'a pas attendu le graffiti new-yorkais, le mur de Berlin ou Banksy pour peindre \
les murs et faire de la rue une galerie. Les Romains couvraient de fresques les \
pièces de leurs villas, et écrivaient sur les façades de Pompéi slogans électoraux et \
mots griffonnés, que les archéologues italiens ont appelés graffiti. Les habitants de \
Teotihuacan peignaient en rouge les murs de leurs palais ; les moines de Chine et de \
Castille faisaient couvrir les parois de leurs temples d'images immenses ; au XIXᵉ \
siècle, l'affiche colorée envahit les rues de Paris. Le street art d'aujourd'hui est \
protégé par le droit d'auteur de ses créateurs : la visite montre donc ses ancêtres, \
neuf œuvres tombées dans le domaine public, du Iᵉʳ siècle avant notre ère à 1886. Le \
bâtiment s'inspire de l'Urban Nation Museum de Berlin : une façade d'accueil, une \
longue galerie de murs peints, et des salles hautes comme des pignons d'immeubles."""
vitrine = "boscoreale-salle-l.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Urban Nation Museum for Urban Contemporary Art"
ville = "Berlin, Allemagne"
architecte = "GRAFT (transformation de l'immeuble)"
construction = "Immeuble de la fin du XIXᵉ siècle ; musée ouvert en 2017"
presentation = """
Le Museum for Urban Contemporary Art, que l'on appelle Urban Nation, occupe un \
immeuble de la fin du XIXᵉ siècle au 7 de la Bülowstraße, dans le quartier de \
Schöneberg, près de la place Nollendorfplatz. Le projet naît en 2013 à l'initiative de \
la Stiftung Berliner Leben, fondation créée par la société municipale de logement \
Gewobag : d'abord des fresques commandées à des artistes sur des façades de la ville, \
puis un musée, ouvert au public en septembre 2017. Le cabinet d'architectes berlinois \
GRAFT a transformé l'immeuble et relié ses salles par des passerelles. La façade, à \
l'angle de la Zietenstraße, est conçue comme un support modulable : des artistes \
invités la repeignent à intervalles réguliers, si bien que le bâtiment change de \
visage. L'exposition d'ouverture réunissait plus de 150 artistes, de Shepard Fairey à \
la photographe Martha Cooper, dont la bibliothèque, consacrée à la photographie de rue \
et à l'histoire du graffiti, est installée au musée. Urban Nation affirme ainsi qu'un \
art né en marge, souvent illégalement, a désormais sa place dans une institution."""
ici = """
Le bâtiment d'ARTEON reprend l'idée d'une façade d'accueil et de salles aux murs de \
béton clair, mais il les consacre aux ancêtres du street art. On entre par le sud \
dans « La façade », hall large et bas, puis on passe au nord dans « Les murs peints \
de Rome », galerie de trente mètres où l'on longe les fresques des villas du Vésuve. \
Deux portes s'ouvrent au nord : à l'ouest, « Les murs de Teotihuacan », haute de dix \
mètres, pour les processions peintes de la grande cité mexicaine ; à l'est, « Paris, \
l'affiche dans la rue », pour le colleur d'affiches de Carle Vernet et la Viviane de \
Jules Chéret. Toutes deux mènent aux « Grandes fresques des temples », longue salle \
haute de douze mètres où le Bouddha de médecine se déploie sur plus de quinze mètres."""

# ─── Le plan du musée ────────────────────────────────────────────────────────
# Inspiré de l'Urban Nation Museum de Berlin (Bülowstraße 7) : une façade-vitrine
# sur la rue, puis des salles de béton clair reliées entre elles. Ici : un hall
# d'entrée au sud, une longue galerie de 30 m pour les murs peints de Rome et de
# Pompéi, deux salles au nord (une très haute pour les fragments de Teotihuacan,
# une plus basse pour l'affiche parisienne), et au fond une grande salle de 12 m de
# haut pour les fresques monumentales des temples, dont le Bouddha de médecine,
# large de 15 m. x et z : le centre de la salle (x vers l'est, z vers le sud), en
# mètres ; une porte se déclare d'un seul côté.

