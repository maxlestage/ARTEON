largeur = 2.6

[[oeuvres]]
titre = "Fragment de peinture murale : dignitaire et feuilles de maguey"
artiste = "Teotihuacan"
annee = "500–550 apr. J.-C."
image = "tlacuilapaxco.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1963.252"
technique = "Fresque sur fragment de mur"
collection = "Cleveland Museum of Art, Cleveland"
note = "Un dignitaire en costume d'apparat chante et verse une offrande : il appartenait à une file de figures identiques qui défilait autour d'un patio."
description = """
Dans un cadre bordé de chevrons, sur un fond rouge sombre, un homme en grand \
costume s'avance de profil vers la gauche. Son visage, petit, disparaît presque sous \
une coiffe monumentale : une tête d'animal stylisée, à l'œil rond, d'où jaillit un \
panache de longues plumes. Il porte un collier de perles rondes, un grand ornement \
circulaire à la taille, une ceinture et des sandales nouées. Devant lui s'enroule une \
grande volute décorée ; de sa main tendue tombe un flot d'offrandes. De chaque côté \
se dressent des feuilles de maguey, triangulaires, hérissées de pointes. Au-dessus du \
cadre, une frise plus large montre un ruban ondulant semé de points, entre des \
motifs en forme d'étoiles."""
evocation = """
Le musée y voit un homme de l'élite qui chante ou prie, sa parole matérialisée par \
la volute, et qui verse d'une main une libation remplie de fleurs, tandis que \
l'autre tient un sac d'encens. Les épines du maguey, devant et derrière lui, \
pourraient évoquer le sang offert aux dieux et le pulque, boisson rituelle tirée de \
la sève de la plante. Le personnage n'a pas de nom : il incarne une fonction, un \
rang, un geste sacré. Répété à l'identique tout autour d'un patio, il formait un \
cortège immobile, qui disait aux visiteurs la piété et la richesse de la famille \
qui vivait là."""
histoire = """
Selon le Cleveland Museum of Art, cette figure faisait partie d'une rangée de \
personnages identiques qui défilaient sur les murs d'un patio, dans l'un des riches \
ensembles d'habitation de Teotihuacan, sans doute celui de Tlacuilapaxco. Ces \
grands ensembles, entourés de hauts murs aveugles, abritaient plusieurs familles \
autour de cours intérieures, et leurs murs étaient souvent couverts de peintures. \
Comme beaucoup de peintures de la cité, ce fragment a été détaché de son mur au \
XXᵉ siècle, dans des conditions mal connues ; le musée l'a acquis en 1963. Il fait \
pendant au fragment de Chicago présenté en face, presque identique."""
facture = """
Comme toute la peinture de Teotihuacan, l'image est construite en camaïeu de rouges, \
du rose pâle au brun, sur un fond d'hématite. Le dessin, d'une grande précision, \
détaille chaque plume de la coiffe, chaque perle du collier, chaque épine du maguey, \
sans jamais chercher le relief. Le peintre organise la surface comme un tissu : \
bandes de chevrons, frise de motifs répétés, puis le registre principal, rythmé par \
les feuilles pointues. Les fissures et les lacunes, visibles sur la droite, montrent \
que la couche peinte, très fine, a souffert lors de la dépose. Le fragment est \
aujourd'hui fixé sur un support moderne."""
details = [
  "Le petit visage du dignitaire, presque caché sous la coiffe.",
  "L'œil rond de la tête d'animal qui forme le haut de la coiffe.",
  "Le flot d'offrandes qui tombe de la main tendue.",
  "Les feuilles de maguey hérissées de pointes, à gauche et à droite.",
  "Le ruban semé de points qui ondule dans la frise du haut.",
]
themes = ["procession", "offrande", "costume", "mexique ancien", "répétition"]
anecdote = """
Les Aztèques, venus des siècles après l'abandon de la ville, en visitaient les \
ruines comme un lieu sacré : selon leurs mythes, c'est à Teotihuacan que les dieux, \
en se jetant dans un brasier, avaient donné naissance au soleil et à la lune."""
salle = 3
mur = "est"
place = 2
largeur = 2.8

[[oeuvres]]
titre = "Afficheur (le colleur d'affiches)"
artiste = "Carle Vernet"
annee = "vers 1820"
image = "colleur-d-affiches.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1966.352"
technique = "Lithographie coloriée à la main"
collection = "Cleveland Museum of Art, Cleveland"
note = "Monté sur son échelle, un afficheur colle les programmes des théâtres sur un mur de Paris. Estampe présentée agrandie."
description = """
Contre l'angle d'un mur de pierre, un homme grimpé sur une échelle de bois colle une \
affiche. Vu de profil, il porte un chapeau haut de forme cabossé, une veste bleue, \
un pantalon brun et, glissé à la ceinture, un chiffon à rayures. D'une main il \
plaque la feuille, de l'autre il la lisse avec une grosse brosse. Le mur est déjà \
couvert d'affiches de couleur, bleue, rose, jaune, qui se chevauchent : on y \
déchiffre « Théâtre royal de l'Opéra-Comique », le titre « Raoul, sire de C… » et \
d'autres noms de théâtres. Au pied de l'échelle attendent le seau de colle et une \
borne de pierre. Sous l'image, on lit « Afficheur », la signature de Carle Vernet et \
le nom de l'imprimeur Delpech ; en haut à droite, « N° 84 »."""
evocation = """
Carle Vernet observe un métier de la rue avec la curiosité d'un reporter. \
L'afficheur est l'ancêtre direct des colleurs et des graffeurs d'aujourd'hui : \
c'est lui qui fait du mur de la ville un support d'images et de mots, renouvelé \
chaque jour. Les feuilles collées les unes sur les autres annoncent les spectacles \
du soir et transforment l'angle de la rue en journal public, que chacun lit en \
passant. Vernet en fait un personnage pittoresque, aux vêtements usés mais à la \
pose assurée, presque élégante, comme un peintre devant sa toile. La scène, sans \
caricature, garde la mémoire d'un geste qui allait se répéter des millions de fois \
dans le Paris du XIXᵉ siècle."""
histoire = """
La planche fait partie d'une suite de Cris de Paris, ces images des petits métiers \
de la rue, marchands ambulants, porteurs d'eau ou rémouleurs, qu'artistes et \
éditeurs publiaient depuis le XVIᵉ siècle. Carle Vernet en dessine une longue série \
d'après nature, numérotée et publiée au début des années 1820 par François-Séraphin Delpech, \
l'un des premiers grands imprimeurs lithographes de Paris. La lithographie, \
inventée en Bavière à la fin du XVIIIᵉ siècle, venait d'arriver en France, et \
Vernet fut l'un des premiers peintres à l'adopter. Les épreuves étaient vendues en \
noir ou, plus cher, coloriées à la main, comme celle-ci. Le Cleveland Museum of Art \
l'a acquise en 1966."""
facture = """
La lithographie permet de dessiner directement sur la pierre avec un crayon gras, \
puis d'imprimer le dessin sans passer par la gravure. Vernet en tire un trait \
souple, des noirs veloutés et des gris nuancés, visibles dans les pierres du mur et \
l'ombre portée de l'homme. Les couleurs, posées ensuite à l'aquarelle, sont réservées \
aux affiches et aux vêtements : elles se détachent sur un décor laissé presque en \
noir et blanc. La figure, isolée au centre de la feuille, sans arrière-plan, \
ressemble à une planche de catalogue, ce qui convient à une série de types \
parisiens."""
details = [
  "La brosse à colle que l'afficheur tient dans sa main droite.",
  "Le titre « Raoul, sire de C… » sur l'affiche bleue de l'Opéra-Comique.",
  "Le seau de colle posé au pied de l'échelle.",
  "Le chiffon à rayures glissé à la ceinture.",
  "Le numéro « N° 84 », en haut à droite, qui situe la planche dans la série.",
]
themes = ["affiche", "métier", "paris", "rue", "lithographie"]
anecdote = """
Depuis la Révolution, le papier blanc était réservé aux affiches officielles des \
autorités : les annonces des particuliers et des théâtres devaient être imprimées \
sur papier de couleur. C'est pourquoi le mur de Carle Vernet est bleu, rose et \
jaune."""
salle = 4
mur = "ouest"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Viviane, affiche pour l'Eden-Théâtre"
artiste = "Jules Chéret"
annee = "1886"
image = "viviane.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1972.1126"
technique = "Lithographie en couleurs"
collection = "Cleveland Museum of Art, Cleveland"
note = "Une danseuse en tutu jaune tourbillonne sous un titre géant : l'affiche de ballet selon Chéret, faite pour être vue de loin, dans la rue."
description = """
En haut, en capitales noires, « Eden-Théâtre » ; dessous, en énormes lettres rouges \
ombrées de blanc, « Viviane ». Au centre, une jeune danseuse blonde, en tutu jaune \
pâle, tourne sur une pointe, un bras levé au-dessus de la tête, la jupe soulevée par \
le mouvement. Derrière elle, un personnage en costume noir, aux cheveux bouclés, \
semble danser avec elle ; à droite, une femme couronnée, en longue robe dorée, \
s'avance. En bas à gauche, dans un triangle rouge orangé, de petits cavaliers en \
armure galopent. En bas, en rouge, le texte annonce un « ballet en 5 actes et 9 \
tableaux » d'Edmond Gondinet, sur une musique de Raoul Pugno et Clément Lippacher. \
La signature de Chéret est à droite."""
evocation = """
Viviane est la fée des légendes du roi Arthur, la dame du Lac qui enchanta \
l'enchanteur Merlin : les chevaliers du coin rouge et la dame couronnée renvoient à \
ce monde de romans de chevalerie. Mais Chéret ne cherche pas à raconter le ballet. \
Il en donne l'élan, la lumière, la promesse de plaisir : une jeune femme rieuse en \
plein mouvement, qui semble sortir de l'affiche. Ce type de figure, gaie, légère, \
toujours en train de danser, devient sa marque, au point que l'on appellera « \
chérettes » ses héroïnes. Sur les murs gris de Paris, l'affiche apportait un éclat de \
couleur et de fête que les passants n'avaient jamais vu dans la rue."""
histoire = """
L'Eden-Théâtre, grande salle de spectacle ouverte en 1883 près de l'Opéra, était \
célèbre pour ses ballets à grand spectacle, avec décors somptueux et centaines de \
figurants. Viviane y est créé en 1886. Chéret, qui dirige alors l'atelier d'affiches \
de l'imprimerie Chaix, dessine l'annonce : on lit dans la marge gauche « Imprimerie \
Chaix (succursale Chéret), 18, rue Brunel ». L'éditeur de musique Heugel, dont \
l'adresse figure en bas, publiait la partition. Placardées par centaines sur les \
murs, les colonnes et les palissades, ces affiches étaient faites pour durer \
quelques semaines ; celle-ci a échappé à la colle et à la pluie, et le Cleveland \
Museum of Art l'a acquise en 1972."""
facture = """
Chéret imprime ses affiches en lithographie, avec une pierre par couleur : ici, le \
noir du dessin, le rouge, le jaune et le bleu, qui se superposent pour donner \
d'autres nuances. Il pose les fonds par dégradés et par crachis, de fines \
projections d'encre qui donnent un grain vibrant, visible dans le ciel et autour de \
la danseuse. Le dessin, nerveux, laisse les contours ouverts, comme une esquisse. \
Le lettrage n'est pas plaqué sur l'image : il fait partie de la composition, et \
le grand titre rouge, en perspective, se lit à des dizaines de mètres. Le triangle \
orangé, en diagonale, dynamise toute la feuille."""
details = [
  "Le grand titre « Viviane » en lettres rouges ombrées de blanc.",
  "Le tutu jaune de la danseuse, soulevé par la pirouette.",
  "Les petits chevaliers qui galopent dans le triangle rouge, en bas à gauche.",
  "La dame couronnée, en longue robe dorée, à droite.",
  "Dans la marge gauche, l'adresse de l'imprimerie Chaix.",
]
themes = ["affiche", "danse", "théâtre", "couleur", "légende arthurienne"]
anecdote = """
Dans les années 1890, les affiches de Chéret devinrent si recherchées que des \
collectionneurs les décollaient des murs, ou payaient les afficheurs pour en obtenir \
des exemplaires : on parla d'« affichomanie ». Les œuvres de street art connaissent \
aujourd'hui le même sort."""
salle = 4
mur = "est"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Le Bouddha de médecine Bhaishajyaguru (Yaoshi fo)"
artiste = "Chine, dynastie Yuan"
annee = "vers 1319"
image = "bouddha-de-medecine.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/42716"
technique = "Pigments à l'eau sur un enduit d'argile mêlée de paille, 7,52 × 15,11 m"
collection = "Metropolitan Museum of Art, New York"
note = "Une peinture murale de plus de quinze mètres, venue d'un monastère du Shanxi : le Bouddha qui guérit, entouré de sa cour céleste."
description = """
Au centre de ce mur immense, plus haut que ses deux ailes, le Bouddha de médecine \
est assis de face, vêtu d'une robe rouge, devant un grand nimbe clair ; une main \
levée, l'autre posée sur le genou, il regarde droit devant lui. De part et d'autre \
siègent deux grands bodhisattvas couronnés, eux aussi nimbés, entourés de \
personnages debout aux mains jointes ou chargées d'offrandes. Sur les côtés \
s'alignent des gardiens en armure, armés, aux visages parfois menaçants. En haut, \
des êtres célestes flottent sur des nuages bleu et vert. En bas, trois grands \
disques clairs et de petites figures occupent le premier plan. Les couleurs, \
assourdies par le temps, mêlent vert, rouge, ocre et blanc."""
evocation = """
Bhaishajyaguru, Yaoshi fo en chinois, est le Bouddha de médecine : il a fait le vœu \
de guérir les maladies du corps et de l'esprit, et règne sur une terre pure de \
l'Est, faite de lapis-lazuli. Les deux bodhisattvas qui l'entourent sont \
traditionnellement ceux de la lumière du soleil et de la lumière de la lune, et les \
gardiens en armure sont les généraux célestes qui protègent ses fidèles. Placée \
dans la salle d'un monastère, l'image accueillait les moines et les visiteurs comme \
une apparition : une cour céleste, ordonnée et sereine, qui occupait tout le champ \
de vision. Devant elle, on venait prier pour la santé et pour une longue vie."""
histoire = """
La peinture a été réalisée vers 1319 pour le monastère inférieur de Guangsheng, à \
Hongtong, dans la province du Shanxi, au nord de la Chine, sous la dynastie mongole \
des Yuan. Au début du XXᵉ siècle, les peintures murales du monastère sont vendues : \
celle-ci est découpée en panneaux pour être transportée, puis réassemblée. Le \
collectionneur Arthur M. Sackler l'offre au Metropolitan Museum en 1965 ; elle \
occupe depuis tout un mur d'une galerie consacrée à l'art chinois. Une autre grande \
peinture du même monastère est conservée au Nelson-Atkins Museum of Art de Kansas \
City. Comme bien des fresques de street art découpées et vendues, elle a quitté le \
lieu pour lequel elle était faite."""
facture = """
La peinture n'est pas une fresque au sens strict : les couleurs, liées à l'eau, ont \
été posées sur un enduit sec, fait d'argile mêlée de paille pour mieux tenir au mur. \
Un tel décor était l'œuvre d'un atelier de peintres professionnels, qui \
travaillaient d'après des modèles et des poncifs, et se partageaient le travail. Le \
dessin, à l'encre, est d'une grande souplesse dans les drapés et les écharpes qui \
flottent ; les couleurs minérales, verts, rouges, ocres et blancs, remplissent \
ensuite les formes. La composition, strictement symétrique et hiérarchisée, place les \
figures principales au centre et les fait plus grandes que les autres."""
details = [
  "Le grand nimbe clair derrière la tête du Bouddha.",
  "La robe rouge du Bouddha, seule tache de couleur vive au centre.",
  "Les couronnes ouvragées des deux bodhisattvas assis.",
  "Les gardiens en armure, sur les ailes gauche et droite.",
  "Les êtres célestes qui flottent sur les nuages, tout en haut.",
]
themes = ["bouddhisme", "guérison", "monastère", "chine", "monumental"]
anecdote = """
Le Bouddha de médecine est aussi vénéré au Japon sous le nom de Yakushi : le \
Yakushi-ji, l'un des grands temples de Nara, lui est dédié et porte son nom."""
salle = 5
mur = "nord"
place = 3
largeur = 15.6

[[oeuvres]]
titre = "Lion du monastère de San Pedro de Arlanza"
artiste = "Espagne, art roman"
annee = "après 1200"
image = "lion-arlanza.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/471061"
technique = "Fresque transposée sur toile, en deux panneaux, 332,7 × 335,3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Un lion grimaçant, plus grand que nature, peint sur le mur d'un monastère de Castille : l'un des animaux fabuleux de l'art roman."
description = """
Sur un fond partagé en bandes ocre et gris-bleu, un lion immense avance vers la \
gauche, de profil, mais tourne vers nous sa tête vue de face. Ses gros yeux ronds \
nous fixent sous des sourcils froncés, et sa gueule montre deux rangées de dents. Sa \
crinière est faite de mèches en forme de flammes ; son corps rose est parcouru de \
lignes souples qui dessinent les muscles. Sa longue queue décrit une boucle \
au-dessus de son dos et se termine par une touffe en forme de feuille. À gauche se \
dresse un arbre stylisé aux feuilles écaillées ; à droite, une arcade à deux \
colonnes ouvre sur un fond sombre. En dessous, une frise de rinceaux rouges et \
blancs est en partie effacée."""
evocation = """
Dans l'art roman, le lion est une image à double sens : symbole de force et de \
vigilance, il peut figurer le Christ ressuscité ou le gardien du lieu saint, mais \
aussi la menace du mal. Peint plus grand que nature sur le mur d'un monastère, ce \
lion au regard fixe surveille ceux qui passent. Son allure, à la fois féroce et \
comique, montre que les peintres connaissaient l'animal surtout par des images, \
tissus, ivoires ou manuscrits, plutôt que d'après nature. L'arbre et l'arcade \
évoquent un jardin ou un palais. Ces grands animaux faisaient partie d'un décor de \
bêtes réelles et fabuleuses, dragons et autres créatures, qui peuplaient les murs."""
histoire = """
Le lion vient du monastère bénédictin de San Pedro de Arlanza, près de Burgos, en \
Castille, lié à la mémoire du comte Fernán González, héros fondateur de la Castille, \
qui y fut enterré. Il a été peint après 1200 dans l'une des salles du monastère. \
Abandonné au XIXᵉ siècle, après la suppression des ordres religieux en Espagne, le \
monastère tombe en ruine ; au début du XXᵉ siècle, ses peintures sont détachées des \
murs et vendues. Une partie se trouve aujourd'hui au musée national d'Art de \
Catalogne, à Barcelone ; le lion, lui, a traversé l'Atlantique pour rejoindre les \
collections médiévales du Metropolitan Museum de New York."""
facture = """
La peinture a sans doute été détachée du mur par la technique du strappo : on colle sur la \
surface peinte une toile enduite de colle forte, puis on l'arrache, emportant la \
mince couche de couleur, que l'on reporte ensuite sur un nouveau support. C'est \
pourquoi l'œuvre est aujourd'hui une fresque sur toile. Le peintre roman travaille \
par grands aplats, cernés d'un trait rouge-brun sûr et rythmé ; les poils, les \
muscles et les griffes deviennent des motifs ornementaux. Les bandes de couleur du \
fond, sans paysage ni profondeur, et la bordure en zigzag, à gauche, rappellent les \
décors de tissus précieux, notamment ceux de l'Espagne musulmane."""
details = [
  "Les gros yeux ronds et les sourcils froncés du lion, tourné vers nous.",
  "Les deux rangées de dents de la gueule grimaçante.",
  "La queue en boucle, terminée par une touffe en forme de feuille.",
  "L'arbre aux feuilles écaillées, à gauche.",
  "L'arcade à deux colonnes, à droite, sur un fond sombre.",
]
themes = ["lion", "art roman", "monastère", "animal", "castille"]
anecdote = """
Le sort des peintures d'Arlanza n'a rien d'exceptionnel : aujourd'hui encore, des \
œuvres de street art, dont certaines de Banksy, sont découpées avec leur mur pour \
être vendues aux enchères, souvent contre l'avis de leurs auteurs."""
salle = 5
mur = "nord"
place = 7
largeur = 3.6

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Rome, fin de la République"
vie = "Italie romaine, IIᵉ–Iᵉʳ siècle av. J.-C."
biographie = """
Aux IIᵉ et Iᵉʳ siècles avant notre ère, Rome, maîtresse de l'Italie, conquiert la \
Grèce et l'Orient hellénistique. Œuvres d'art et artistes grecs affluent, et \
l'aristocratie romaine adopte avec passion la culture grecque. Les familles riches \
se font construire, dans la baie de Naples et autour du Vésuve, de luxueuses villas \
de campagne et de bord de mer, où elles se retirent loin des affaires de Rome. \
Boscoreale, Oplontis, Pompéi ou Herculanum en ont conservé de nombreux exemples. \
Leurs murs sont entièrement peints par des équipes d'artisans anonymes, qui \
travaillent d'après des modèles grecs et se transmettent leurs savoir-faire. \
L'éruption du Vésuve, en 79 de notre ère, a figé sous la cendre ces décors, \
redécouverts à partir du XVIIIᵉ siècle."""
style = """
La peinture murale de cette époque relève du deuxième style pompéien : le mur ne se \
contente plus d'imiter des plaques de marbre, il s'ouvre en trompe-l'œil sur des \
colonnades, des corniches, des jardins ou de grandes figures. Les couleurs sont \
intenses, le rouge domine, et le modelé par la lumière vient de la peinture \
grecque. Ces fresques sont presque tout ce qui nous reste de la grande peinture \
antique."""

[[artistes]]
nom = "Rome impériale"
vie = "Rome et l'Empire romain, fin du Iᵉʳ siècle av. J.-C. – Iᵉʳ siècle apr. J.-C."
biographie = """
En 27 avant notre ère, Octave reçoit le nom d'Auguste et devient le premier \
empereur romain. La paix qu'il installe favorise un essor sans précédent de la \
construction : à Rome, temples et forums ; en Campanie, villas de la famille \
impériale et maisons de notables. Les peintres, organisés en ateliers, décorent les \
murs de pièce en pièce, avec des spécialistes pour les fonds, les ornements et les \
figures. Le goût change plusieurs fois en un siècle : après les architectures en \
trompe-l'œil de la fin de la République viennent des murs plus sobres, puis, sous \
Néron et ses successeurs, des décors foisonnants. À Pompéi, durement touchée par un \
tremblement de terre en 62, de nombreuses maisons sont en cours de redécoration \
lorsque l'éruption de 79 les ensevelit."""
style = """
Sous Auguste, le troisième style pompéien referme le mur : de grands fonds unis, \
noirs, rouges ou blancs, de minces architectures purement décoratives, et au centre \
un tableau de mythe ou de paysage. Le quatrième style, au Iᵉʳ siècle de notre ère, \
réintroduit la profondeur dans des architectures de fantaisie, légères et \
impossibles, peuplées de figures, d'animaux et de créatures fabuleuses."""

[[artistes]]
nom = "Teotihuacan"
vie = "Haut plateau central du Mexique, vers le Iᵉʳ siècle av. J.-C. – VIIᵉ siècle apr. J.-C."
biographie = """
Teotihuacan s'élève dans une vallée au nord-est de l'actuelle Mexico. Modeste \
agglomération au Iᵉʳ siècle avant notre ère, elle devient en quelques siècles une métropole \
organisée selon un plan régulier, autour d'une grande avenue que bordent la \
pyramide du Soleil et la pyramide de la Lune. Entre 200 et 650, c'est la plus grande \
ville des Amériques, peuplée de plus de cent mille habitants, centre religieux, \
militaire et commercial dont l'influence s'étend jusqu'au pays maya. Ses habitants \
vivent dans de vastes ensembles résidentiels, aux murs couverts de peintures. On \
ignore la langue qu'ils parlaient et le nom qu'ils donnaient à leur ville. Vers le \
VIᵉ ou le VIIᵉ siècle, le centre est incendié et la cité décline ; les Aztèques, \
qui en vénéraient les ruines, l'appelèrent Teotihuacan, « le lieu des dieux »."""
style = """
La peinture de Teotihuacan est l'une des grandes traditions murales du monde ancien. \
Elle repose sur un enduit de chaux lissé et sur une palette de pigments minéraux, où \
domine le rouge. Les figures, dieux, prêtres, animaux, plantes, sont vues de profil, \
stylisées et répétées en processions ou en motifs, sans perspective ni ombre, dans \
un ordre qui rappelle l'écriture et le textile."""

[[artistes]]
nom = "Carle Vernet"
vie = "Bordeaux, 14 août 1758 – Paris, 17 novembre 1836"
biographie = """
Antoine Charles Horace Vernet, dit Carle Vernet, est le fils de Claude Joseph \
Vernet, célèbre peintre de marines, et le père d'Horace Vernet, futur peintre de \
batailles : trois générations de peintres en un siècle. Formé auprès de son père \
et du peintre Lépicié, il remporte en 1782 le grand prix de Rome. Sous la \
Révolution, il perd sa sœur, guillotinée en 1794. Il se fait connaître par ses \
chevaux, qu'il dessine et peint avec une science rare, ses scènes de chasse et de \
courses, et par ses caricatures des Incroyables et des Merveilleuses, les jeunes \
élégants du Directoire. Sous l'Empire, il peint les campagnes de Napoléon. À partir \
des années 1810, il s'empare de la lithographie, nouvelle venue en France, et \
multiplie les planches de chevaux, de soldats et de types parisiens, dont une \
suite de Cris de Paris."""
style = """
Carle Vernet est un observateur vif et précis, plus à l'aise dans le dessin et \
l'estampe que dans la grande peinture d'histoire. Ses chevaux, élancés et nerveux, \
ont fait sa réputation ; ses scènes de rue, saisies d'après nature, mêlent \
exactitude documentaire et humour léger. Il compte parmi les artistes qui ont fait \
de la lithographie un art populaire au début du XIXᵉ siècle."""

[[artistes]]
nom = "Jules Chéret"
vie = "Paris, 31 mai 1836 – Nice, 23 septembre 1932"
biographie = """
Fils d'un ouvrier typographe, Jules Chéret entre à treize ans en apprentissage chez \
un lithographe et suit des cours du soir de dessin. Installé à Londres de 1859 à \
1866, il y découvre les grandes affiches anglaises en couleurs. À son retour, il \
fonde à Paris sa propre imprimerie, équipée de presses anglaises, et révolutionne \
l'affiche française : grandes lithographies en couleurs, figures en mouvement, \
lettrage intégré à l'image. En 1881, il cède son atelier à l'imprimerie Chaix, dont \
il reste le directeur artistique. Il dessine pour les théâtres, les music-halls, \
les bals, les apéritifs ou le pétrole d'éclairage, plus d'un millier d'affiches au \
total, et reçoit la Légion d'honneur en 1890. Vers 1900, il se consacre davantage à \
la peinture décorative. Retiré à Nice, il y meurt à quatre-vingt-seize ans ; le \
musée des Beaux-Arts de la ville porte son nom."""
style = """
Chéret est le père de l'affiche illustrée moderne. Ses compositions, faites pour la \
rue, reposent sur quelques couleurs vives superposées, une figure féminine légère \
et dansante, et des lettres dessinées qui font corps avec l'image. Il donne à la \
publicité la grâce de la fête galante, et ouvre la voie à Toulouse-Lautrec, à Mucha \
et à tous les affichistes de la Belle Époque."""

[[artistes]]
nom = "Chine, dynastie Yuan"
vie = "Chine, 1271–1368"
biographie = """
Petit-fils de Gengis Khan, Kubilai Khan fonde en 1271 la dynastie des Yuan et \
achève quelques années plus tard la conquête de la Chine : pour la première fois, \
tout le pays est gouverné par des souverains mongols, depuis leur capitale de \
Dadu, l'actuelle Pékin. Les Yuan protègent largement les religions, et le \
bouddhisme, sous ses formes chinoise et tibétaine, connaît une grande faveur. Dans \
les provinces du Nord, et notamment au Shanxi, temples et monastères sont \
construits ou restaurés, et leurs salles couvertes de peintures murales par des \
ateliers itinérants de peintres professionnels, dont quelques noms seulement nous \
sont parvenus par des inscriptions. En 1368, une révolte chasse les Mongols et \
fonde la dynastie des Ming."""
style = """
La peinture murale religieuse des Yuan prolonge les traditions des Tang et des \
Song : compositions monumentales et symétriques, divinités hiératiques au centre, \
cortèges de figures sur les côtés, dessin à l'encre d'une grande souplesse, rehaussé \
de couleurs minérales. Elle se distingue de la peinture des lettrés, à l'encre sur \
soie ou sur papier, qui triomphe à la même époque."""

[[artistes]]
nom = "Espagne, art roman"
vie = "Royaumes chrétiens du nord de la péninsule Ibérique, XIᵉ–XIIIᵉ siècle"
biographie = """
Aux XIᵉ et XIIᵉ siècles, les royaumes chrétiens du nord de l'Espagne, Castille, \
León, Aragon, comtés catalans, s'étendent vers le sud aux dépens de l'Espagne \
musulmane. Le long des routes du pèlerinage de Saint-Jacques-de-Compostelle, \
églises et monastères se multiplient, et leurs murs se couvrent de peintures : \
absides où trône le Christ en majesté, nefs où se déroulent des récits bibliques, \
salles monastiques ornées d'animaux et de motifs. Les peintres, souvent itinérants, \
travaillent d'un chantier à l'autre et diffusent les modèles venus de France, \
d'Italie ou de Byzance, mais aussi de l'art de l'Espagne musulmane. Au XXᵉ siècle, \
beaucoup de ces peintures ont été détachées des murs pour être sauvées ou vendues, \
et se trouvent aujourd'hui à Barcelone, à Madrid ou aux États-Unis."""
style = """
La peinture romane espagnole se reconnaît à ses grands aplats de couleurs vives, \
cernés d'un trait épais, à ses figures stylisées aux grands yeux et à ses fonds en \
bandes horizontales, sans paysage ni profondeur. Hommes et animaux deviennent des \
ornements puissants, faits pour être lus de loin, dans la pénombre des églises."""
