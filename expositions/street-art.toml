# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « STREET ART » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/street-art/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /street-art.
#
#  Droits : les œuvres de street art sont protégées par le droit d'auteur de
#  leurs auteurs, tous vivants ou morts récemment. Elles ne sont montrées ici que
#  par des photographies publiées sous licence libre sur Wikimedia Commons, prises
#  dans des pays dont la loi autorise à photographier les œuvres installées à
#  demeure dans l'espace public (liberté de panorama : Allemagne, Autriche,
#  Portugal, Pologne). Chaque image est créditée (auteur, licence, source).
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 220
nom_court = "Street art"
mouvement = "Street art et graffiti"
cadre = "aucun"
couleur = "#b23a12"
titre = "Street art, l'art à ciel ouvert"
artiste = "Vrubel, Thierry Noir, Os Gêmeos, Invader, Vhils, Etam Cru, Okuda…"
dates = "1990–2018"
accroche = "Exposition virtuelle · Urban Nation Museum, Berlin"
introduction = """
Né à la fin des années 1960 sur les murs et les rames de métro de New York, le \
graffiti gagne l'Europe dans les années 1980 ; le street art y invente ensuite \
d'autres outils : pochoir, mosaïque, burin, fresque monumentale peinte depuis une \
nacelle. La visite réunit neuf œuvres peintes ou posées en plein air, à Berlin, \
Vienne, Lisbonne et Łódź, par des artistes venus de Russie, d'Allemagne, de France, du \
Portugal, du Brésil, de Pologne et d'Espagne. Toutes sont montrées par des \
photographies sous licence libre, prises dans des pays où la loi permet de \
photographier les œuvres installées à demeure dans la rue. Le bâtiment s'inspire de \
l'Urban Nation Museum de Berlin : une façade d'accueil, une longue galerie qui évoque \
le Mur, et des salles hautes comme des pignons d'immeubles."""
vitrine = "baiser-fraternel.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Urban Nation Museum for Urban Contemporary Art"
ville = "Berlin, Allemagne"
architecte = "GRAFT (transformation de l'immeuble)"
construction = "Immeuble de la fin du XIXᵉ siècle ; musée ouvert en 2017"
presentation = """
Le Museum for Urban Contemporary Art, que l'on appelle Urban Nation, occupe un \
immeuble de la fin du XIXᵉ siècle au 7 de la Bülowstraße, dans le quartier de \
Schöneberg, près de la place Nollendorfplatz. Le projet naît en 2013 à l'initiative de \
la Stiftung Berliner Leben, fondation créée par la société municipale de logement \
Gewobag : d'abord des fresques commandées à des artistes sur des façades de la ville, \
puis un musée, ouvert au public en septembre 2017. Le cabinet d'architectes berlinois \
GRAFT a transformé l'immeuble et relié ses salles par des passerelles. La façade, à \
l'angle de la Zietenstraße, est conçue comme un support modulable : des artistes \
invités la repeignent à intervalles réguliers, si bien que le bâtiment change de \
visage. L'exposition d'ouverture réunissait plus de 150 artistes, de Shepard Fairey à \
la photographe Martha Cooper, dont la bibliothèque, consacrée à la photographie de rue \
et à l'histoire du graffiti, est installée au musée. Urban Nation affirme ainsi qu'un \
art né en marge, souvent illégalement, a désormais sa place dans une institution."""
ici = """
Le bâtiment d'ARTEON reprend l'idée d'une façade d'accueil et de salles aux murs de \
béton clair. On entre par le sud dans « La façade », hall large et bas, puis on passe \
au nord dans « Le Mur », galerie de trente mètres qui évoque la East Side Gallery. \
Deux portes s'ouvrent au nord : à l'ouest, « Les pignons de Kreuzberg », haute de dix \
mètres, pour les géants de Victor Ash et d'Os Gêmeos ; à l'est, « Vienne et Lisbonne \
», pour Invader et Vhils. Toutes deux mènent à « Łódź, ville des fresques », longue \
salle haute de douze mètres."""

# ─── Le plan du musée ────────────────────────────────────────────────────────
# Inspiré de l'Urban Nation Museum de Berlin (Bülowstraße 7) : une façade-vitrine
# sur la rue, puis des salles de béton clair reliées entre elles. Ici : un hall
# d'entrée au sud, une longue galerie de 30 m qui évoque le Mur et la East Side
# Gallery, deux salles au nord (une très haute pour les fresques de pignon, une
# plus basse pour les petits formats), et au fond une grande salle de 12 m de haut
# pour les fresques monumentales de Łódź. x et z : le centre de la salle (x vers
# l'est, z vers le sud), en mètres ; une porte se déclare d'un seul côté.

