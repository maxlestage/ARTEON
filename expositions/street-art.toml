# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Paroi ouest de la salle L de la villa de Publius Fannius Synistor, à Boscoreale"
artiste = "Rome, fin de la République"
annee = "vers 50–40 av. J.-C."
image = "boscoreale-salle-l.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/247008"
technique = "Fresque, 195,6 × 271,8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Une lourde guirlande de feuillage et de fruits, un masque, un serpent : le décor d'une pièce de villa romaine, enseveli par le Vésuve en 79."
description = """
Sur un mur rouge rosé, divisé par de hauts pilastres jaunes, une épaisse guirlande \
de feuilles, de fruits et d'épis court d'un bord à l'autre. À gauche, elle est \
accrochée à une tête de taureau dorée, parée de bandelettes et de rangs de perles ; \
des rubans clairs s'enroulent autour du feuillage. Sous la guirlande sont suspendus \
des objets : un masque doré de vieux silène, chauve et barbu, qui fixe le \
spectateur ; une corbeille d'osier d'où sort un serpent dressé, devant un disque \
sombre ; à droite, un petit objet de bronze en forme de cloche. Au-dessus, une \
corniche à feuilles porte une bande de panneaux verts et jaunes, puis une frise \
pourpre semée de fines tiges vertes et une seconde corniche, sculptée en trompe-l'œil."""
evocation = """
Tout ici parle de Dionysos, le dieu du vin et du théâtre, dont les fêtes \
rassemblaient chants, danses et masques. Le silène est l'un de ses compagnons ; la \
corbeille au serpent rappelle la ciste mystique, le panier sacré de ses mystères ; \
le disque et la cloche évoquent sans doute le tambourin et les cymbales qui \
rythmaient ses cortèges. La tête de taureau ornée de bandelettes est celle d'une \
victime de sacrifice. La guirlande chargée de fruits de toutes les saisons dit \
l'abondance de la campagne. Pour le riche propriétaire, ce décor transformait une \
pièce de sa villa en sanctuaire en fête, à l'image des guirlandes véritables que \
l'on suspendait aux murs les jours de célébration."""
histoire = """
La villa de Publius Fannius Synistor se trouvait à Boscoreale, sur les pentes du Vésuve, à quelques kilomètres au nord \
de Pompéi. Ses murs ont été peints vers 50–40 avant notre ère, puis la maison a été \
ensevelie par l'éruption de 79. Mise au jour en 1900, elle est dépouillée de ses \
fresques, découpées par panneaux et vendues aux enchères à Paris en 1903. Le \
Metropolitan Museum en acquiert alors un ensemble important, dont cette paroi de la \
pièce que les archéologues désignent par la lettre L, et une chambre entière, \
remontée dans ses salles. Les autres panneaux de la villa sont aujourd'hui dispersés \
entre plusieurs musées, en Italie et en Europe."""
facture = """
C'est une fresque : les couleurs, délayées dans l'eau, sont posées sur un enduit de \
chaux encore humide, auquel elles s'incorporent en séchant. Le décor relève du \
deuxième style pompéien, qui imite des architectures en relief : les corniches, les \
pilastres et les panneaux de marbre coloré sont peints en trompe-l'œil, avec leurs \
ombres et leurs lumières. Sur ce cadre rigoureux, le peintre jette une guirlande \
traitée en touches rapides, presque impressionnistes, où chaque feuille est posée \
d'un seul coup de pinceau. Les parties claires, en haut à gauche et en bas, sont \
des lacunes comblées lors de la restauration."""
details = [
  "Le masque doré de silène, au front chauve et à la barbe bouclée.",
  "Le serpent qui sort de la corbeille d'osier et tend la tête vers la gauche.",
  "La tête de taureau parée de rangs de perles, où s'accroche la guirlande.",
  "La petite cloche de bronze suspendue à droite, sur le fond rouge.",
  "La corniche à feuilles, peinte en trompe-l'œil au-dessus des pilastres.",
]
themes = ["fresque", "dionysos", "guirlande", "trompe-l'œil", "pompéi"]
anecdote = """
Les maisons de la région du Vésuve n'étaient pas peintes qu'à l'intérieur : sur les \
façades de Pompéi, des peintres spécialisés traçaient en grandes lettres rouges des \
appels à voter pour tel ou tel candidat, et les passants y gravaient des messages, \
des dessins et des insultes."""
salle = 2
mur = "nord"
place = 5
largeur = 2.75

[[oeuvres]]
titre = "Persée et Andromède dans un paysage"
artiste = "Rome impériale"
annee = "dernière décennie du Iᵉʳ siècle av. J.-C."
image = "persee-andromede.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/250945"
technique = "Fresque, 159,4 × 118,8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Le héros Persée vole au secours d'Andromède, enchaînée à un rocher : un tableau de légende peint sur le mur d'une villa impériale."
description = """
Dans un grand cadre noir qui se termine en pointe, comme un fronton, s'ouvre un \
paysage marin baigné d'une lumière bleu-vert. Au centre se dresse un haut rocher \
violacé ; à mi-hauteur, une jeune femme vêtue de jaune, les bras écartés, y est \
enchaînée : c'est Andromède. À gauche, Persée arrive en volant, nu sous un manteau \
rouge qui flotte au vent, l'arme levée. En bas à gauche, le monstre marin surgit de \
l'eau, la tête hérissée de crêtes. À droite, devant un palais à colonnes, on \
retrouve Persée qui serre la main d'un roi en longue robe. En bas à droite, une \
femme drapée est assise sur un rocher. Au fond, des arbres et des édifices se \
perdent dans la brume."""
evocation = """
Le mythe est raconté par les poètes grecs et latins, et par Ovide dans les \
Métamorphoses. La reine Cassiopée s'étant vantée d'être plus belle que les \
Néréides, les dieux envoient un monstre ravager le royaume ; pour l'apaiser, le roi \
Céphée doit lui livrer sa fille Andromède. Persée, qui revient de tuer la Gorgone \
Méduse, la voit, tue le monstre et l'épouse. Le peintre rassemble plusieurs moments \
dans une même image : l'arrivée du héros, la jeune fille offerte, le monstre, puis \
l'accord conclu avec Céphée. Perdus dans l'immensité du paysage, les personnages \
semblent minuscules : la légende devient une rêverie, une vue de rivage où le \
regard se promène."""
histoire = """
La peinture ornait une pièce de la villa impériale de Boscotrecase, au pied du \
Vésuve, qui appartint sans doute à Agrippa, ami et gendre de l'empereur Auguste, \
puis à son fils Agrippa Postumus. Elle faisait pendant à un autre paysage \
mythologique, Polyphème et Galatée, conservé lui aussi au Metropolitan Museum. La \
villa, ensevelie par l'éruption de 79, est découverte au début du XXᵉ siècle lors \
des travaux d'une ligne de chemin de fer ; ses fresques sont alors détachées des \
murs, et le site disparaît de nouveau peu après sous les cendres d'une éruption du \
Vésuve. Le Metropolitan Museum acquiert plusieurs de ses peintures en 1920."""
facture = """
Le tableau relève du troisième style pompéien, apparu sous Auguste : le mur ne \
s'ouvre plus sur des architectures en trompe-l'œil, il devient une surface plane, \
souvent sombre, au centre de laquelle on place une peinture comme un tableau \
accroché. Le paysage est presque monochrome, traité en touches légères de bleu et \
de vert ; les lointains s'effacent dans la brume, ce qui donne une impression de \
profondeur. Les figures sont posées en quelques coups de pinceau, avec des rehauts \
clairs. Ce goût des paysages sacrés et mythologiques, très en vogue à l'époque \
d'Auguste, venait de la peinture hellénistique."""
details = [
  "Andromède, bras écartés, enchaînée à mi-hauteur du rocher.",
  "Persée en vol, à gauche, son manteau rouge gonflé par le vent.",
  "Les crêtes blanches du monstre marin, en bas à gauche.",
  "À droite, Persée qui serre la main du roi Céphée devant le palais.",
  "La femme drapée assise sur un rocher, en bas à droite.",
]
themes = ["mythologie", "paysage", "héros", "mer", "fresque"]
anecdote = """
Pour approcher Méduse, dont le regard changeait en pierre, Persée avait reçu des \
dieux des sandales ailées et un bouclier poli comme un miroir : il ne regarda le \
monstre que dans son reflet."""
salle = 2
mur = "sud"
place = 2
largeur = 1.25

[[oeuvres]]
titre = "Griffon sur un entablement"
artiste = "Rome impériale"
annee = "Iᵉʳ siècle apr. J.-C."
image = "griffon-pompei.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1981.20"
technique = "Fragment de fresque"
collection = "Cleveland Museum of Art, Cleveland"
note = "Un fragment de mur de Pompéi : un griffon ailé monte la garde sur une corniche peinte, au milieu d'un fond blanc."
description = """
Sur un fond blanc crème, parcouru de fines fissures, un griffon se tient debout, de \
profil, tourné vers la gauche. Il a le corps et les pattes d'un lion, peints en gris \
bleuté, la tête et le bec d'un oiseau de proie, et deux ailes dressées, l'une grise, \
l'autre ocre et rose ; sa queue fine retombe derrière lui. Il est posé sur le bord \
d'un entablement doré, peint comme une moulure de bois ou de pierre, sous lequel \
court une frise rose et pourpre ornée de petits motifs. À gauche, une tige rouge \
terminée par des volutes avance vers lui, comme une branche de candélabre ou de \
rinceau. Les bords du fragment, irréguliers, laissent voir l'épaisseur de l'enduit."""
evocation = """
Animal fabuleux venu de l'Orient, le griffon unit la force du lion, roi des \
animaux, et la vue perçante de l'aigle, roi des oiseaux. Les Grecs puis les Romains \
en font un gardien : il veille sur les trésors, sur les tombeaux, et accompagne \
Apollon ou la déesse Némésis. Peint sur un mur de maison, il protège et il amuse à \
la fois. Posé sur une corniche suspendue dans le vide, il appartient à ces \
architectures de fantaisie, légères et impossibles, que les peintres de Pompéi \
aimaient faire flotter sur les fonds clairs. On imagine, au-delà du fragment, tout \
un mur peuplé de colonnettes, de candélabres, d'oiseaux et de petites créatures."""
histoire = """
La fiche du musée rattache ce fragment à Pompéi, sans préciser la maison d'où il \
vient. Ensevelie en 79 sous les cendres du Vésuve, la ville est fouillée à partir du \
XVIIIᵉ siècle. Pendant longtemps, on y découpe dans les murs les morceaux de \
peinture jugés les plus beaux, pour les collections du roi de Naples puis pour \
celles des amateurs du monde entier ; beaucoup de fragments isolés, comme celui-ci, \
ont ainsi perdu leur contexte. Le Cleveland Museum of Art l'a acquis en 1981. Il \
témoigne d'une peinture domestique courante, faite par des ateliers qui décoraient \
en série les maisons d'une ville prospère."""
facture = """
Le fond blanc, uni, laisse respirer les motifs, ce qui est fréquent dans les décors \
du Iᵉʳ siècle de notre ère. Le griffon est peint d'une main rapide, presque \
esquissée : quelques touches de gris, d'ocre et de rose suffisent à modeler le \
corps, les plumes et la crinière. L'entablement, au contraire, est construit avec \
soin, par bandes parallèles de jaune, d'ocre et de brun qui imitent le relief d'une \
moulure éclairée par le haut. La tige rouge, dessinée d'un trait souple, montre \
l'aisance des peintres à tracer des ornements sans modèle. Le fragment a été remonté \
sur un support moderne."""
details = [
  "Le bec ouvert du griffon et son œil rond.",
  "Les deux ailes dressées, l'une grise, l'autre ocre et rose.",
  "Les pattes de lion posées sur le bord doré de la corniche.",
  "La tige rouge à volutes qui s'avance depuis la gauche.",
  "Le réseau de fissures qui parcourt le fond blanc.",
]
themes = ["griffon", "animal fabuleux", "pompéi", "décor", "fresque"]
anecdote = """
Le mot graffiti est né à Pompéi : c'est ainsi que les archéologues italiens du XIXᵉ \
siècle ont appelé les milliers d'inscriptions grattées dans l'enduit des murs de la \
ville, du verbe graffiare, « griffer, égratigner »."""
salle = 2
mur = "sud"
place = 8
largeur = 1.3

[[oeuvres]]
titre = "Fragment de peinture murale : rite d'autosacrifice au maguey"
artiste = "Teotihuacan"
annee = "500–600 apr. J.-C."
image = "teotihuacan-maguey.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/14968"
technique = "Enduit de chaux et pigments minéraux, 63,8 × 95 cm"
collection = "Art Institute of Chicago, Chicago"
note = "Un prêtre en grande parure s'avance en priant pour la pluie. Photographie agrandie : le fragment mesure 64 × 95 cm."
description = """
Sur un fond rouge sombre, un homme richement vêtu s'avance de profil vers la \
gauche. Il porte une coiffe immense, faite de longues plumes qui s'épanouissent \
derrière sa tête, un collier de grosses perles rondes et, à la taille, un ornement \
circulaire. Devant son visage s'enroule une grande volute ornée de coquillages et \
de plantes : c'est sa parole, sa prière, rendue visible. À gauche et à droite se \
dressent des formes triangulaires terminées par des pointes sombres : des feuilles \
de maguey, une sorte d'agave, plantées dans des objets rayés. En haut, une bande de \
chevrons court le long du bord. Les figures sont dessinées en rose clair et en \
rouge plus foncé sur le rouge du fond."""
evocation = """
Selon le musée, l'homme est un prêtre de la pluie, et la volute qui sort de sa \
bouche, décorée de coquillages et de plantes, indique qu'il prie pour l'eau et pour \
la prospérité des récoltes, si précieuses dans ce haut plateau sec. Les épines du \
maguey servaient à se percer la peau pour offrir son sang aux dieux, rite répandu \
dans le Mexique ancien : d'où le titre donné au fragment. Répétée le long d'un mur, \
cette figure formait une procession sans fin, qui accompagnait ceux qui passaient \
dans la pièce. L'image ne raconte pas une histoire : elle fixe sur le mur une \
prière perpétuelle, comme une inscription."""
histoire = """
Teotihuacan, au nord-est de l'actuelle Mexico, fut entre 200 et 650 de notre ère la \
plus grande ville des Amériques, peuplée de plus de cent mille habitants ; les \
Aztèques, qui découvrirent ses ruines des siècles plus tard, l'appelèrent « le lieu \
des dieux ». Ses pyramides, ses temples, ses palais et ses maisons étaient couverts \
de peintures. Ce fragment appartenait à un cycle peint sur les murs intérieurs d'un \
palais aristocratique, l'ensemble résidentiel de Tlacuilapaxco. Comme bien des \
peintures de Teotihuacan, il a été détaché de son mur avant d'entrer dans un musée. \
Le fragment de Cleveland, présenté en face, montre une figure presque identique, \
qui viendrait du même ensemble."""
facture = """
Les peintres de Teotihuacan travaillaient sur un enduit de chaux fin et lissé, \
qu'ils polissaient après la pose des couleurs pour lui donner un léger brillant. \
Leur palette repose sur des pigments minéraux, au premier rang desquels un rouge \
d'oxyde de fer, l'hématite, décliné en plusieurs tons. Le dessin est d'abord tracé \
au trait, puis rempli d'aplats ; il n'y a ni ombre ni perspective. Les figures, \
stylisées et codifiées, se répètent presque à l'identique, comme si elles étaient \
reportées d'après un modèle. Cette manière fait penser à un motif d'étoffe ou à un \
pochoir, et donne au mur l'unité d'une tapisserie."""
details = [
  "La coiffe de longues plumes qui s'ouvre en éventail derrière la tête.",
  "La volute de la parole, ornée de coquillages, devant le visage.",
  "Le collier de grosses perles rondes et l'ornement circulaire de la ceinture.",
  "Les feuilles de maguey aux pointes sombres, à gauche et à droite.",
  "La bande de chevrons qui court le long du bord supérieur.",
]
themes = ["procession", "prière", "pluie", "mexique ancien", "rouge"]
anecdote = """
Le maguey a nourri le Mexique ancien de bien des façons : ses fibres donnaient du \
fil et du papier, ses épines des aiguilles, et sa sève fermentée le pulque, boisson \
rituelle bien plus ancienne que la tequila."""
salle = 3
mur = "ouest"
