# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "Femme devant un aquarium"
artiste = "Henri Matisse"
annee = "1921–1923"
image = "femme-aquarium.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/27984"
technique = "Huile sur toile, 81,2 × 100,2 cm"
collection = "Art Institute of Chicago"
note = "Accoudée à une table, le menton sur les bras, une jeune femme regarde tourner des poissons rouges : le Matisse calme et songeur des années niçoises."
description = """
Dans un intérieur clos, une jeune femme aux cheveux bruns coupés au carré est \
accoudée à une table de bois clair. Elle a croisé les bras et y appuie le menton ; son \
regard, un peu vague, se pose sur un bocal de verre rond, à gauche, où nagent quelques \
poissons rouges. Devant le bocal, des pommes de pin et une longue branche de sapin sont \
couchées sur la table, non loin d'une petite carte blanche. La jeune femme porte un \
corsage rose et s'adosse à un fauteuil rembourré. Derrière elle, un paravent bleu \
couvre presque tout le fond d'un motif d'anneaux entrelacés ; une bande d'un vert vif \
et, à gauche, un rideau rayé laissent deviner une fenêtre. La lumière est égale, sans \
ombre dramatique, et le bord inférieur de la toile coupe la table au plus près de \
nous."""
evocation = """
Le tableau ne raconte rien : il montre un temps suspendu, celui de la rêverie. La \
jeune femme regarde les poissons comme on regarde le feu ou la mer, sans tout à fait \
les voir. Les poissons rouges reviennent souvent chez Matisse à partir de 1912, \
l'année de son premier séjour au Maroc, où il avait observé, dit-on, des hommes qui \
rêvaient des heures devant un bocal : ils deviennent chez lui une image de la \
contemplation même. Comme le souligne le musée, le motif du paravent, volontairement \
assourdi, nourrit l'atmosphère méditative de la scène. Loin des éclats du fauvisme, \
Matisse poursuit ici l'idéal qu'il formulait dès 1908 : un art d'équilibre et de \
tranquillité, qui soit pour l'esprit comme un bon fauteuil délassant de la fatigue."""
histoire = """
À la fin de 1917, Matisse s'installe à Nice, où il passera désormais la plus grande \
partie de l'année. Dans ses chambres d'hôtel, puis dans l'appartement qu'il loue à \
partir de 1921 place Charles-Félix, il compose des intérieurs remplis de tissus, de \
tapis et de paravents. Il s'y souvient des expositions d'art islamique qu'il avait \
visitées et de ses voyages en Algérie et au Maroc, d'où il avait rapporté poteries, \
textiles et carreaux. Achevée en 1923, la toile est vendue le 12 juin de cette \
année-là à ses marchands parisiens, Bernheim-Jeune ; deux jours plus tard, le peintre \
et collectionneur de Chicago Frederic Clay Bartlett l'achète. Il l'offre en 1926 à \
l'Art Institute, avec d'autres chefs-d'œuvre, dont Un dimanche après-midi à l'île de \
la Grande Jatte de Seurat, en mémoire de sa femme Helen Birch Bartlett."""
facture = """
Matisse peint ici avec une retenue nouvelle. Les couleurs sont assourdies : bleu gris \
du paravent, rose pâle du corsage, ocre de la table, brun du rebord ; seuls le vert vif \
de la bande verticale et l'orangé des poissons font chanter quelques notes plus \
franches. La touche reste visible, rapide, souvent fluide, et laisse par endroits \
transparaître la toile, notamment dans le bocal, rendu par quelques reflets blancs et \
un contour léger. Le motif du paravent est brossé d'un geste large, sans souci \
d'exactitude : il fonctionne comme un fond décoratif qui tient tout l'espace. Vue d'un \
peu haut, la table bascule vers le spectateur, comme si nous étions assis en face du \
modèle, de l'autre côté du bocal."""
details = [
  "Les poissons rouges, réduits à quelques touches orangées dans le bocal.",
  "Le menton posé sur les bras croisés, et le regard qui se perd.",
  "Les pommes de pin et la branche de sapin couchées sur la table.",
  "La petite carte blanche, seule tache claire à droite de la table.",
  "Les anneaux entrelacés du paravent bleu, derrière le modèle.",
]
themes = ["intérieur", "rêverie", "nice", "poissons rouges", "ornement"]
anecdote = """
Le 12 juin 1923, Matisse vend le tableau à Bernheim-Jeune ; le 14, il est déjà acheté \
par Frederic Clay Bartlett, de Chicago, pour 11 200 francs. Moins de trois ans plus \
tard, il est accroché à l'Art Institute."""
salle = 2
mur = "nord"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Improvisation 30 (Canons)"
artiste = "Vassily Kandinsky"
annee = "1913"
image = "improvisation-30.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/8991"
technique = "Huile sur toile, 111 × 111,3 cm"
collection = "Art Institute of Chicago"
note = "Des canons qui crachent leur fumée, des tours qui vacillent : à la veille de 1914, Kandinsky laisse la couleur improviser comme une musique."
description = """
Une toile carrée, saturée de couleurs vives qui se heurtent. En bas à droite, deux \
grandes roues noires et des fûts sombres pointés vers la gauche forment des canons ; \
devant eux s'élèvent des nuages gris et blancs, comme une fumée. Au centre flotte une \
grande masse bleu profond, cernée d'un trait brun, pareille à un vaisseau ou à une \
colline. Au-dessus, à droite, des tours penchées, l'une rouge et percée de fenêtres, \
les autres blanches et à peine dessinées, semblent sur le point de s'effondrer. À \
gauche, une sorte de tour noire à claire-voie se dresse devant une nuée blanche, \
tandis qu'en bas une rangée de petites taches colorées évoque une foule. Des montagnes \
rouges, jaunes et vertes ferment le haut du tableau. La signature et la date, 1913, \
sont inscrites en bas à gauche."""
evocation = """
Kandinsky appelait « improvisations » des tableaux nés, disait-il, d'impulsions \
spontanées et en grande partie inconscientes, par opposition aux « compositions » \
longuement préparées. Ici, le titre entre parenthèses désigne le seul motif que l'on \
reconnaît à coup sûr : les canons. À son ami Arthur Jerome Eddy, collectionneur de \
Chicago, il écrivit qu'ils pouvaient sans doute s'expliquer par les incessantes \
conversations sur la guerre qui avaient rempli l'année, mais que le vrai contenu du \
tableau était ce qu'éprouve le spectateur sous l'effet des formes et des combinaisons \
de couleurs. Un an plus tard éclatait la Première Guerre mondiale, et l'on n'a pas \
manqué de voir dans ces tours qui chancellent un pressentiment."""
histoire = """
Kandinsky peint cette toile à Munich en 1913, au moment où il franchit le pas vers \
l'abstraction. Deux ans plus tôt, il a fondé avec Franz Marc le Blaue Reiter et publié \
Du spirituel dans l'art, où il rapproche la peinture de la musique, cet art qui \
n'imite rien et touche pourtant directement l'âme. L'avocat Arthur Jerome Eddy compte \
parmi les tout premiers Américains à acheter ses œuvres ; il acquiert celle-ci, \
probablement auprès du peintre lui-même. En 1914, la guerre oblige Kandinsky, sujet \
russe, à quitter l'Allemagne. Après la mort d'Eddy, en 1920, sa veuve et son fils \
conservent le tableau, puis le donnent en 1931 à l'Art Institute of Chicago."""
facture = """
Kandinsky superpose deux langages. D'un côté, de grands champs de couleur posés en \
touches larges et épaisses, bleu outremer, jaune, rouge, vert émeraude, rose, qui se \
répondent sans former d'objets. De l'autre, un réseau de lignes noires ou brunes, \
tracées d'un pinceau fin et nerveux, qui dessinent les tours, les roues et les fûts \
des canons, ou filent librement à travers la toile. Les couleurs ne restent pas dans \
les contours : elles débordent, se frangent de petites touches dentelées, comme des \
vibrations. Le dessin, à demi effacé, laisse les choses à la limite du reconnaissable, \
pour que chaque couleur agisse par elle-même, comme un son."""
details = [
  "Les deux roues noires et les fûts des canons, en bas à droite.",
  "Les bouffées de fumée grise et blanche devant les canons.",
  "Les tours penchées, dont une rouge percée de fenêtres.",
  "La grande tache bleu profond au centre du tableau.",
  "La signature et la date, 1913, en bas à gauche.",
]
themes = ["abstraction", "musique", "guerre", "couleur", "improvisation"]
anecdote = """
Kandinsky a raconté qu'un soir, à Munich, il avait été saisi par un tableau d'une \
beauté inexplicable, sans aucun sujet reconnaissable : c'était l'une de ses propres \
toiles, posée sur le côté. Il en conclut que l'objet nuisait à sa peinture."""
salle = 2
mur = "nord"
place = 3
largeur = 1.5

[[oeuvres]]
titre = "Le Musicien"
artiste = "Louis Marcoussis"
annee = "1914"
image = "le-musicien.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.46638.html"
technique = "Huile sur toile, 146 × 114,3 cm"
collection = "National Gallery of Art, Washington"
note = "Un musicien en habit, démonté en facettes grises et bleues, dans un salon où traîne la partition d'une valse : le cubisme selon Marcoussis."
description = """
Un homme en habit de soirée occupe toute la hauteur de la toile, décomposé en plans \
gris, bleus et noirs qui se chevauchent. On devine son visage étroit, coupé en deux, \
avec une petite bouche rose, puis un plastron blanc et un nœud papillon. Il tient \
debout devant lui un instrument à cordes dont on reconnaît la volute, les chevilles et \
les ouïes, peint comme un bois veiné. Autour de lui, un salon se reconstitue par \
fragments : à droite, le clavier d'un piano et un pupitre portant une partition où se \
lit « Malvina valse » ; à gauche, un petit vase de fleurs sur une console ; en haut, \
des pans de tenture rouge damassée ; en bas, un plancher aux veines de bois. La \
signature, « MARCOUSSIS 1914 », est peinte en capitales en bas à gauche."""
evocation = """
Le musicien est l'un des sujets favoris du cubisme, avec la guitare et la nature \
morte de café : il permet de réunir en un seul tableau une figure, un instrument et \
l'idée même de la musique, cet art du temps que l'on ne peut pas voir. Marcoussis le \
traite avec élégance : l'habit, le nœud papillon, la valse populaire disent un monde \
de salons et de cafés-concerts, celui de Paris à la veille de la guerre. Les mots \
peints, comme chez Braque et Picasso, ancrent l'image dans la réalité la plus banale, \
une partition comme on en vend chez tous les marchands de musique, tout en rappelant \
que le tableau reste une surface plane, où les lettres tiennent aussi bien que les \
figures."""
histoire = """
Né Ludwik Markus à Varsovie, le peintre arrive à Paris au début du siècle et y \
fréquente bientôt Apollinaire, Braque et Picasso. Il adopte le cubisme vers 1910 et \
participe en 1912 au Salon de la Section d'or, qui rassemble les cubistes en marge de \
Picasso et de Braque. Le Musicien est présenté au Salon des Indépendants de 1914, où \
l'Américain Rodman Wanamaker l'achète. Revendu à New York en 1928, il est acquis \
l'année suivante par le collectionneur Chester Dale, dont l'immense collection de \
peinture française entre en 1963 à la National Gallery of Art de Washington. Plus \
tard, Marcoussis se consacrera de plus en plus à la gravure et à l'illustration des \
poètes."""
facture = """
Marcoussis pratique ici un cubisme de synthèse : au lieu d'émietter l'objet en \
minuscules facettes, il le reconstruit en grands plans nets, découpés comme des \
papiers collés. La gamme est sourde, gris bleutés, noirs et blancs, réchauffée par le \
rouge de la tenture et les bruns du bois. Plusieurs surfaces imitent des matières : le \
damas rouge à motifs, les veines du bois rendues à la manière des peintres en décor, \
une technique que Braque avait introduite dans le cubisme. Dans les plans gris, la \
touche reste visible, en petites hachures parallèles qui modèlent les volumes. Les \
lettres de la partition et de la signature, peintes avec soin, soulignent la surface \
plane de la toile."""
details = [
  "La partition posée sur le pupitre, où se lit « Malvina valse ».",
  "La volute et les chevilles de l'instrument, au centre.",
  "Le petit nœud papillon blanc et le plastron de l'habit.",
  "Les touches noires du clavier, à droite.",
  "La tenture rouge damassée, en haut à gauche.",
]
themes = ["cubisme", "musique", "portrait", "salon", "faux bois"]
anecdote = """
Son nom d'artiste lui fut trouvé par son ami Guillaume Apollinaire : Marcoussis est \
celui d'un village de l'Essonne, au sud de Paris."""
salle = 2
mur = "nord"
place = 4
largeur = 1.5

[[oeuvres]]
titre = "Arbre et architecture, rythmes"
artiste = "Paul Klee"
annee = "1920"
image = "arbre-et-architecture.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.130844.html"
technique = "Huile sur papier, 27,9 × 38,3 cm"
collection = "National Gallery of Art, Washington"
note = "Des maisons quadrillées, des arbres en boules et une place qui monte vers une petite tour : une ville de rêve bâtie comme une partition."
description = """
Sur une petite feuille de papier, Klee bâtit une ville fragile. À gauche et à droite, \
deux hautes maisons aux toits rouges se font face, quadrillées d'un réseau de lignes \
noires, comme des colombages ou des fenêtres ; l'une s'ouvre en bas sur une arcade. \
Au centre, une place en trapèze monte vers un édifice vert, coiffé d'un petit toit \
pointu percé d'un point noir, comme une horloge ou un nichoir. Au fond, des arbres \
ronds, vert sombre, rouges ou roses, posés sur de fines tiges, flottent entre les \
toits. Les couleurs, ocres, roses, verts, jaunes et quelques blancs épais, sont posées \
en taches floues qui débordent des lignes. En bas à droite, une petite signature se \
lit : « Klee »."""
evocation = """
Le titre réunit trois mots qui reviennent sans cesse chez Klee : l'arbre, qui pousse ; \
l'architecture, que l'on construit ; le rythme, qui les relie comme en musique. Fils \
d'un professeur de musique et d'une cantatrice, violoniste lui-même, Klee pensait la \
peinture comme une partition, où lignes et taches de couleur reviennent à intervalles \
réguliers. La ville qu'il peint n'existe nulle part : c'est un vieux bourg passé par \
le rêve, avec ses perspectives impossibles et ses arbres-ballons. La même année, il \
écrit que « l'art ne reproduit pas le visible ; il rend visible ». Les surréalistes \
reconnaîtront bientôt en lui un frère : ils l'exposent à Paris dès 1925."""
histoire = """
En 1920, Klee vit à Munich. Après la guerre, qu'il a passée loin du front, sa \
réputation grandit très vite : une grande exposition lui est consacrée cette année-là \
à la galerie Hans Goltz, et son texte « Confession créatrice » paraît dans un recueil \
d'écrits d'artistes. À la fin de l'année, Walter Gropius l'invite à enseigner au \
Bauhaus de Weimar, où il arrive au début de 1921 et restera dix ans. Ce petit \
tableau, peint à l'huile sur papier, appartient à ce moment de bascule, entre les \
aquarelles lumineuses rapportées de Tunisie en 1914 et l'enseignement du Bauhaus. Il \
est entré à la National Gallery of Art en 2004, don des collectionneurs new-yorkais \
Benjamin et Lillian Hertzberg."""
facture = """
Klee peint à l'huile sur un papier mince, ce qui donne à la couleur un aspect mat et \
velouté. Il pose des taches colorées, frottées et estompées, qui se fondent les unes \
dans les autres ; un réseau de lignes noires, tracées au pinceau fin, structure \
l'image sans jamais enfermer tout à fait les couleurs. On voit encore les traces de la \
brosse et le grain du support. Quelques touches de blanc, plus épaisses, posées sur le \
toit central et le long de l'édifice, font la lumière. Ce dialogue entre une trame \
dessinée et des couleurs libres, que Klee comparait volontiers à la polyphonie \
musicale, est au cœur de son art."""
details = [
  "Les deux maisons quadrillées de noir, face à face.",
  "La petite tour verte au centre, percée d'un point noir.",
  "Les arbres ronds, posés comme des ballons sur leurs tiges.",
  "La place en trapèze qui monte vers le fond.",
  "La petite signature « Klee », en bas à droite.",
]
themes = ["ville", "rêve", "rythme", "arbres", "musique"]
anecdote = """
À partir de 1911, Klee tint un catalogue minutieux de son œuvre, où il inscrivait \
chaque pièce avec une année et un numéro : il y recensa plus de neuf mille œuvres."""
salle = 3
mur = "nord"
place = 1
largeur = 0.6

[[oeuvres]]
titre = "Le Repas du lion"
artiste = "Henri Rousseau"
annee = "vers 1907"
image = "repas-du-lion.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/438822"
technique = "Huile sur toile, 113,7 × 160 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Dans une jungle inventée à Paris, sous un disque pâle, un lion dévore sa proie au milieu de fleurs géantes."
description = """
Une forêt tropicale remplit toute la toile, jusqu'à l'horizon. Des feuilles immenses, \
vert sombre, vert tendre ou gris bleuté, se superposent en couches serrées ; de hauts \
troncs noirs montent comme des piquets. Des fleurs extraordinaires s'en détachent : \
grappes jaunes pendantes, lotus bleus et rose, et, à gauche, une grande plante blanche \
aux plumes retombantes. Au centre, par une trouée, un disque blanc, soleil ou lune, se \
couche entre deux collines, sous un ciel bleu pâle. En bas, à demi caché dans les \
herbes, un lion à crinière fauve tient dans sa gueule une proie au pelage tacheté, \
peut-être un léopard, et un filet de sang rouge coule. Il fixe le spectateur. La \
signature, « Henri Rousseau », est inscrite en bas à droite."""
evocation = """
Rousseau n'a jamais vu de jungle. Ses forêts sont des paradis inventés, à la fois \
luxuriants et menaçants, où la beauté immobile des fleurs côtoie la cruauté des \
fauves. Le drame est ici presque minuscule, perdu au bas de la toile, comme si la \
nature tout entière restait indifférente au combat. Ce mélange de calme et de \
violence, de précision et d'invraisemblance, donne au tableau la logique étrange des \
rêves. Les poètes et les peintres de l'avant-garde, Apollinaire, Picasso, Robert \
Delaunay, ont admiré et défendu ce peintre autodidacte, qui peignait ses visions avec \
le sérieux d'un primitif ; bien des artistes du rêve, après lui, lui doivent quelque \
chose."""
histoire = """
Né à Laval en 1844, Henri Rousseau travaille plus de vingt ans à l'octroi de Paris, le \
service qui taxe les marchandises à l'entrée de la ville : d'où son surnom de \
Douanier. Autodidacte, il expose à partir de 1886 au Salon des Indépendants, sous les \
moqueries, puis prend sa retraite en 1893 pour se consacrer à la peinture. Sa première \
jungle, Surpris !, date de 1891 ; elles se multiplient dans les dernières années de sa \
vie, de 1904 à sa mort, en 1910. En 1908, Picasso donne en son honneur, dans son \
atelier du Bateau-Lavoir, un banquet resté célèbre. Le Repas du lion a appartenu au \
collectionneur new-yorkais Sam A. Lewisohn, qui l'a légué au Metropolitan Museum en \
1951."""
facture = """
Rousseau peint avec une patience d'artisan. Chaque feuille est dessinée, cernée, puis \
remplie d'une couleur unie, modelée de quelques nuances seulement ; les verts, \
innombrables, vont du presque noir au vert d'eau. Il superpose les plans comme les \
toiles peintes d'un décor de théâtre, du premier plan sombre jusqu'au fond clair, sans \
véritable perspective atmosphérique, si bien que tout est également net, du plus \
proche au plus lointain. La surface est lisse, presque sans trace de pinceau. Il \
travaillait de mémoire et d'après des images, sans jamais quitter la France : ses \
fleurs agrandies, plus grandes que le lion, n'obéissent qu'à l'ordre décoratif du \
tableau."""
details = [
  "Le lion, à demi caché dans les herbes, qui fixe le spectateur.",
  "Le filet de sang rouge sur la proie au pelage tacheté.",
  "Le disque blanc qui se couche entre les collines.",
  "Les lotus bleus et rose, et les grappes jaunes suspendues.",
  "La signature « Henri Rousseau », en bas à droite.",
]
themes = ["jungle", "rêve", "fauve", "exotisme", "art naïf"]
anecdote = """
« Quand je pénètre dans les serres et que je vois ces plantes étranges des pays \
exotiques, il me semble que j'entre dans un rêve », aurait confié Rousseau. Ses forêts \
vierges sont nées sous les verrières du Jardin des Plantes, à Paris."""
salle = 3
mur = "nord"
place = 2
largeur = 1.9

[[oeuvres]]
titre = "Pandore"
artiste = "Odilon Redon"
annee = "1910–1912"
image = "pandora.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.46531.html"
technique = "Huile sur toile, 143,5 × 62,9 cm"
collection = "National Gallery of Art, Washington"
note = "La première femme de la mythologie grecque tient le coffret fatal au milieu de fleurs irréelles : l'un des derniers rêves en couleur de Redon."
description = """
Sur une toile haute et étroite, une jeune femme se tient debout, presque de dos, \
tournée vers la droite. Ses cheveux roux sont retenus par un bandeau doré ; elle porte \
un ample manteau bleu turquoise, drapé sur une robe blanche, et baisse les yeux vers \
un petit coffret sombre qu'elle tient devant elle. Derrière elle se dressent des \
montagnes bleutées, à peine esquissées, sous un ciel rose et nacré. À ses pieds et sur \
la droite foisonnent des fleurs qui ne ressemblent à aucune espèce connue : larges \
taches blanches comme des pétales, éclats jaunes, orangés, rouges, verts et bleus, \
semés en pluie de couleurs. Tout le haut du tableau baigne dans une lumière \
poudreuse. La signature, « Odilon Redon », est inscrite en bas à droite."""
evocation = """
Selon le poète grec Hésiode, Pandore est la première femme, façonnée par les dieux et \
comblée de tous les dons, puis envoyée aux hommes avec un récipient qu'elle ne devait \
pas ouvrir ; en soulevant le couvercle, elle laisse s'échapper tous les maux, et seule \
l'Espérance reste au fond. Redon ne peint pas la catastrophe, mais l'instant d'avant : \
une jeune femme pensive, absorbée par le coffret, au milieu d'une nature encore \
intacte. La curiosité devient rêverie, et le mythe une méditation silencieuse. Les \
fleurs éclatantes qui l'entourent laissent le spectateur hésiter entre la menace et \
la promesse, entre le paradis qui va se perdre et l'espérance qui demeure."""
histoire = """
Né à Bordeaux en 1840, Odilon Redon a d'abord été, pendant plus de vingt ans, le \
maître des « noirs » : fusains et lithographies peuplés d'yeux flottants, \
d'araignées souriantes et de têtes coupées, que les écrivains symbolistes \
admiraient. Dans les années 1890, la couleur envahit son œuvre, pastels puis huiles, \
et il peint jusqu'à sa mort, en 1916, des bouquets, des barques et des figures \
mythologiques baignées de lumière. Pandore date de ces dernières années ; le sujet \
l'a occupé à plusieurs reprises. Le tableau passe en vente à Paris, à l'hôtel Drouot, \
en 1922, puis traverse l'Atlantique ; le collectionneur new-yorkais Chester Dale \
l'achète en 1950, et il entre à la National Gallery of Art en 1963."""
facture = """
Redon peint à l'huile comme il travaillait le pastel : par frottis légers, voiles \
transparents et petites touches juxtaposées, en laissant par endroits apparaître le \
grain de la toile. Le haut du tableau, presque vide, est fait de couches rosées et \
grises frottées les unes sur les autres, d'où naît une lumière poudreuse. La figure \
est à peine cernée, son manteau modelé de bleus et de verts transparents. En bas, au \
contraire, la matière s'épaissit et se fragmente en éclats de couleur pure, presque \
abstraits, comme une mosaïque de pierres précieuses. Le format très étroit, celui \
d'un panneau décoratif, isole la figure comme dans une niche."""
details = [
  "Le petit coffret sombre que Pandore regarde, les yeux baissés.",
  "Le bandeau doré dans ses cheveux roux.",
  "Le manteau turquoise drapé sur la robe blanche.",
  "Les grandes fleurs blanches, comme des pétales de lumière, à droite.",
  "Les montagnes bleutées, à peine dessinées, derrière la figure.",
]
themes = ["mythologie", "symbolisme", "rêve", "fleurs", "curiosité"]
anecdote = """
Chez Hésiode, Pandore ouvre une grande jarre, et non une boîte : la « boîte de \
Pandore » vient d'une traduction latine de la Renaissance, popularisée par Érasme. \
C'est pourtant ce coffret que peint Redon, comme presque tous les artistes."""
salle = 3
mur = "nord"
place = 3
largeur = 0.8

[[oeuvres]]
titre = "Autoportrait"
artiste = "Käthe Kollwitz"
annee = "1915"
image = "autoportrait-kollwitz.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1941.493"
technique = "Lithographie, 27,2 × 23,4 cm"
collection = "Cleveland Museum of Art"
note = "Le visage las et grave d'une mère qui vient de perdre son fils à la guerre, dessiné à la craie lithographique, sans aucune complaisance."
description = """
Sur une feuille de papier crème, un visage de femme apparaît de face, cadré de très \
près, sans corps ni décor. Les cheveux, tirés en arrière, ne sont indiqués que par \
quelques masses grises qui s'effilochent sur les bords. Le visage est plongé dans une \
ombre granuleuse, faite d'innombrables petits points noirs ; par endroits, le blanc \
du papier, laissé en réserve, fait la lumière, sur le front, autour d'un œil, sur \
l'arête du nez et sur le menton. Les yeux, cernés et légèrement asymétriques, \
regardent droit devant ; les paupières sont lourdes, la bouche fermée, les joues \
creusées. Le cou se perd en bas dans quelques traits rapides. En bas à droite, \
l'artiste a signé au crayon : « Käthe Kollwitz »."""
evocation = """
Käthe Kollwitz s'est représentée toute sa vie, une centaine de fois, en dessin, en \
gravure et en sculpture. Ces autoportraits ne flattent jamais : ils enregistrent la \
fatigue, l'âge et le chagrin. Celui-ci est fait l'année qui suit la mort de son fils \
cadet, Peter, tué en Flandre en octobre 1914, à dix-huit ans, dans les premières \
semaines de la guerre. On n'y voit aucun signe extérieur de deuil, aucune larme : \
seulement un regard qui soutient le nôtre, épuisé mais lucide. Cette sobriété même \
fait de l'image, au-delà du portrait d'une femme, celui de toutes les mères que la \
guerre a privées de leurs enfants."""
histoire = """
Née à Königsberg en 1867, Käthe Kollwitz s'installe à Berlin avec son mari Karl, \
médecin dans un quartier ouvrier, dont les patients deviennent ses modèles. Ses \
cycles gravés, La Révolte des tisserands puis La Guerre des paysans, la rendent \
célèbre au tournant du siècle. La mort de Peter bouleverse son œuvre : pendant près \
de dix-huit ans, elle travaille à un monument pour son fils, les Parents en deuil, \
installé en 1932 dans un cimetière militaire allemand de Belgique, près de sa tombe. \
En 1919, elle devient la première femme élue à l'Académie prussienne des arts. Cette \
épreuve appartient au Cleveland Museum of Art depuis 1941, avec la collection de Mr \
et Mrs Lewis B. Williams."""
facture = """
La lithographie permet de dessiner à la craie grasse, sur la pierre ou sur un papier \
de report, puis d'imprimer l'image avec toute la spontanéité du dessin. Kollwitz en \
tire ici un effet saisissant : la craie, passée sur une surface grenue, laisse une \
trame de petits points et de fines stries verticales qui donnent à l'ombre la texture \
d'une étoffe ou d'une peau. Elle construit le visage par masses plutôt que par \
contours, et laisse les bords se défaire dans le blanc du papier. Le cadrage serré et \
l'absence de tout décor concentrent l'attention sur le regard. Quelques traits plus \
nerveux, en bas, suffisent à suggérer le col."""
details = [
  "Les yeux cernés, légèrement asymétriques, qui fixent le spectateur.",
  "Le blanc du papier laissé en réserve sur le front et l'arête du nez.",
  "La trame de petits points et de stries de la craie lithographique.",
  "Les cheveux tirés en arrière, indiqués par de simples masses grises.",
  "La signature au crayon, en bas à droite.",
]
themes = ["autoportrait", "deuil", "guerre", "estampe", "maternité"]
anecdote = """
En août 1914, c'est Käthe Kollwitz qui avait convaincu son mari de laisser Peter \
s'engager comme volontaire. Son journal, tenu pendant plus de trente ans, garde la \
trace de ce remords et de son long travail de deuil."""
salle = 4
mur = "nord"
place = 1
largeur = 0.4

[[oeuvres]]
titre = "Jacques et Berthe Lipchitz"
artiste = "Amedeo Modigliani"
annee = "1916"
image = "lipchitz.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/27987"
technique = "Huile sur toile, 81,3 × 54,3 cm"
collection = "Art Institute of Chicago"
note = "Le portrait de mariage d'un sculpteur de Montparnasse et de sa jeune épouse, peint par son ami Modigliani en 1916."
description = """
Devant un mur gris-bleu, un couple pose comme pour une photographie de mariage. \
Debout à gauche, Jacques Lipchitz domine la composition : un long visage ovale, de \
petits yeux clairs, une bouche fine, un pull gris-vert à col roulé sous une veste \
brun rouge. Son bras passe derrière sa femme, et sa main réapparaît à droite, posée \
près de son épaule. Assise en contrebas, Berthe incline doucement la tête ; son \
visage étiré, aux joues roses, a des yeux en amande sombres et une petite bouche \
rouge, et sa robe noire s'orne d'un large col blanc festonné. Derrière eux, un \
montant clair et un panneau brun découpent le fond. En haut, le nom du sculpteur, \
« LIPCHITZ », est écrit en capitales, et la signature « modigliani » se lit dans \
l'angle droit."""
evocation = """
Modigliani ne cherche pas la ressemblance photographique : il allonge les visages, \
réduit les yeux à des amandes, simplifie les formes jusqu'à faire de chaque modèle \
une sorte d'icône. Pourtant le couple est bien là, avec ses caractères : l'homme, \
raide et un peu solennel, la jeune femme, plus douce et rêveuse. La pose rappelle les \
portraits de mariage des studios de photographes, mais la tendresse passe par un \
geste discret, ce bras qui entoure Berthe. Les visages en amande et les cous allongés \
doivent beaucoup aux sculptures africaines et archaïques qu'admiraient les deux \
hommes, sculpteurs l'un et l'autre, à une époque où Montparnasse inventait l'art \
moderne."""
histoire = """
Formé en Italie, Modigliani s'installe à Paris en 1906 et vit bientôt à Montparnasse. \
Il y rencontre le sculpteur Jacques Lipchitz, venu de Lituanie, qui, pour aider son \
ami toujours sans le sou, lui commande ce portrait à l'occasion de son mariage avec \
la poétesse russe Berthe Kitrosser. Lipchitz garde le tableau quelques années, puis \
l'échange vers 1921 avec le marchand Léonce Rosenberg ; Frederic Clay et Helen Birch \
Bartlett l'achètent en 1922, et il entre en 1926 à l'Art Institute of Chicago, dans \
la collection donnée en mémoire de Helen Birch Bartlett. Malgré son talent, \
Modigliani ne trouva d'acheteurs qu'après sa mort, en janvier 1920, hâtée par la \
tuberculose et sa légendaire vie de bohème."""
facture = """
La peinture, assez maigre, laisse voir la trame de la toile. Les fonds sont brossés \
en larges aplats gris-bleu, brun et ocre ; les contours sont tracés au pinceau d'un \
trait sombre, souple et continu, qui cerne les visages et les vêtements. Les \
carnations, orangées et roses, sont modelées très légèrement, presque à plat ; les \
joues de Berthe sont deux taches rouges arrondies. La composition s'organise en \
verticales : le montant clair au centre, le bord du panneau brun, la haute figure \
debout. Le fond, les vêtements et les ombres partagent la même gamme sourde, qui fait \
ressortir les visages. Les lettres capitales du nom, tracées au pinceau, rappellent \
les inscriptions des portraits anciens."""
details = [
  "Le nom « LIPCHITZ », écrit en capitales en haut de la toile.",
  "Le col blanc festonné de la robe de Berthe.",
  "Les joues de Berthe, deux taches de rose arrondies.",
  "La main de Jacques qui réapparaît à droite, près de l'épaule de sa femme.",
  "La signature « modigliani », en minuscules, dans l'angle supérieur droit.",
]
themes = ["portrait", "couple", "mariage", "montparnasse", "amitié"]
anecdote = """
Selon Lipchitz, Modigliani avait achevé le portrait en deux jours. Le sculpteur le \
persuada de continuer à y travailler pendant deux semaines encore, afin de pouvoir \
lui payer un cachet plus élevé."""
salle = 4
mur = "nord"
place = 2
largeur = 0.7

[[oeuvres]]
titre = "Vieille usine"
artiste = "Paula Modersohn-Becker"
annee = "1900"
image = "vieille-usine.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.150903.html"
technique = "Huile sur carton, 38,7 × 53,7 cm"
collection = "National Gallery of Art, Washington"
note = "Un vieux bâtiment et sa cheminée solitaire au bord des prés, sous un ciel gris : une étude rapide, peinte l'année où Paula Modersohn-Becker découvre Paris."
description = """
Sous un ciel gris et bleu pâle où passent des nuages sombres, un long bâtiment occupe \
la gauche de la composition. Son grand toit brun, presque noir, strié de rouge, \
descend jusqu'à un mur ocre orangé percé de petites ouvertures sombres ; le pignon, \
tourné vers la droite, est piqué de taches claires, comme des fenêtres murées ou un \
crépi tombé par plaques. Derrière le toit s'élève une haute cheminée. Au premier plan \
s'étend une prairie verte ; des buissons et de jeunes conifères sombres se dressent à \
gauche et à droite, et une rangée d'arbres ferme l'horizon. Aucune figure, aucune \
fumée : le lieu semble à l'abandon. En bas à gauche, la date « 1900 » est tracée dans \
la pâte."""
evocation = """
Paula Modersohn-Becker ne cherche ici ni le pittoresque ni la dénonciation sociale : \
la vieille usine est pour elle une forme, une masse simple posée dans le paysage. Le \
bâtiment, avec son toit écrasant et sa cheminée solitaire, a quelque chose de grave \
et presque d'humain, comme une silhouette qui attend. Sous le ciel lourd, l'ensemble \
dégage une mélancolie silencieuse, celle des choses usées par le temps. Cette manière \
de réduire le motif à quelques grandes masses, sans anecdote, annonce les portraits, \
les natures mortes et les autoportraits qu'elle peindra dans les années suivantes, \
parmi les plus neufs de leur temps."""
histoire = """
Née à Dresde en 1876, Paula Becker rejoint en 1898 la colonie d'artistes de \
Worpswede, un village de la lande près de Brême, où des peintres travaillent sur le \
motif, au milieu des tourbières. Au début de 1900, elle part pour Paris : elle étudie \
à l'académie Colarossi, visite l'Exposition universelle et découvre Cézanne chez le \
marchand Ambroise Vollard. En 1901, elle épouse le peintre Otto Modersohn. Elle \
retourne plusieurs fois à Paris et meurt en 1907, à trente et un ans, moins de trois \
semaines après la naissance de sa fille. De son vivant, elle n'a vendu que très peu \
de tableaux ; elle est aujourd'hui tenue pour l'une des pionnières de l'expressionnisme \
allemand. Ce carton est entré à la National Gallery of Art en 2012, légué par Ruth \
Cole Kainen."""
facture = """
L'étude est peinte vite, à l'huile épaisse et grasse, sur un simple carton. La \
touche, très visible, change selon les surfaces : courte et croisée dans le ciel, où \
le blanc, le bleu et le gris se mêlent sans se fondre ; plus large et appuyée sur le \
mur et le toit ; tourbillonnante dans les buissons et les arbres. Les couleurs sont \
peu nombreuses et terreuses, brun, ocre, vert profond, réchauffées par quelques \
traînées rouges sur le toit. Les formes sont simplifiées en grandes masses, sans \
détail inutile : quelques taches sombres suffisent à faire des fenêtres, quelques \
traits verticaux une rangée d'arbres. Rien n'est fini, et tout est dit."""
details = [
  "La haute cheminée, seule verticale contre le ciel.",
  "Les traînées rouges sur le grand toit sombre.",
  "Les petites taches claires qui piquent le pignon.",
  "La rangée d'arbres sombres à l'horizon, à droite.",
  "La date « 1900 », tracée dans la pâte en bas à gauche.",
]
themes = ["paysage", "usine", "ciel", "étude", "simplicité"]
anecdote = """
Le poète Rainer Maria Rilke, qui l'avait connue à Worpswede, lui dédia en 1908, un an \
après sa mort, son « Requiem pour une amie »."""
salle = 4
mur = "est"
place = 2
largeur = 0.65

[[oeuvres]]
titre = "La Convalescente"
artiste = "Gwen John"
annee = "vers 1915–1925"
image = "la-convalescente.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.89676.html"
technique = "Huile sur toile, 41,3 × 33,8 cm"
collection = "National Gallery of Art, Washington"
note = "Dans un fauteuil d'osier, une jeune femme en robe sombre lit une lettre près d'une tasse rose : un silence peint à mi-voix."
description = """
Dans un fauteuil d'osier garni d'un coussin blanc, une jeune femme aux longs cheveux \
bruns est assise, légèrement de trois quarts. Elle porte une robe mauve sombre, \
presque violette, qui tombe jusqu'au bas de la toile. Les yeux baissés, elle lit une \
feuille blanche, une lettre peut-être, qu'elle tient des deux mains sur ses genoux. À \
droite, sur une petite table ronde couverte d'une nappe blanche, sont posées une \
tasse rose sur sa soucoupe et une théière brun-roux semée de points blancs. Le mur du \
fond, d'un beige pâle, est parsemé de petites taches dorées, comme un papier peint. \
Tout est calme, tout est doux, sans une ombre marquée."""
evocation = """
Le titre dit la convalescence, ce temps suspendu entre la maladie et la vie \
ordinaire, où l'on reste assis à lire et à attendre. Gwen John n'en raconte pas \
davantage : ni le contenu de la lettre ni la maladie ne sont précisés. La jeune femme, \
absorbée, semble ignorer qu'on la regarde ; son visage pâle et ses paupières baissées \
disent une fatigue paisible, presque une prière. Comme souvent chez l'artiste, la \
figure solitaire dans une chambre devient l'image d'une vie intérieure, faite de \
retrait et d'attention. Gwen John a peint ce sujet à plusieurs reprises, avec de \
légères variations, comme on reprend une méditation."""
histoire = """
Née au pays de Galles en 1876, sœur aînée du peintre Augustus John, Gwen John étudie à \
la Slade School de Londres, puis s'installe en France en 1904. À Paris, elle devient \
le modèle et l'amante de Rodin, puis se retire à Meudon, où elle mène une vie de plus \
en plus solitaire et se convertit au catholicisme. À partir de 1910, l'avocat \
new-yorkais John Quinn devient son principal soutien et lui achète régulièrement ses \
œuvres. Ce tableau est acquis auprès d'elle en novembre 1924 par la succession de \
Quinn, mort quelques mois plus tôt, puis vendu en 1927 à New York sous le titre de \
Jeune fille lisant une lettre. Paul Mellon et son épouse l'achètent en 1986 et \
l'offrent en 1994 à la National Gallery of Art. Gwen John meurt à Dieppe en 1939."""
facture = """
Gwen John peint à petites touches sèches et mates, posées côte à côte comme des \
tesselles, sur une préparation crayeuse qui boit l'huile. La palette est \
volontairement réduite à quelques tons voisins, beiges, gris, mauves et blancs, que \
relèvent seulement le rose de la tasse et le roux de la théière. Les formes sont \
simplifiées, les contours flous, sans ombres portées : la lumière est égale, diffuse, \
comme filtrée par un rideau. Par endroits, de petits manques dans la couche picturale \
laissent voir le fond clair, ce qui renforce l'aspect de fresque ancienne. Le tressage \
du fauteuil d'osier n'est qu'esquissé, en quelques traits ocre."""
details = [
  "La feuille blanche que la jeune femme lit, les yeux baissés.",
  "La tasse rose sur sa soucoupe, au bord de la table.",
  "La théière brun-roux semée de points blancs.",
  "Le fauteuil d'osier, dont on devine le tressage à gauche.",
  "Les petites taches dorées du papier peint.",
]
themes = ["intimité", "lecture", "convalescence", "silence", "chambre"]
anecdote = """
Gwen John posa pour Rodin, notamment pour la Muse de son monument à Whistler, le \
peintre américain qui avait été son professeur à Paris."""
salle = 4
mur = "nord"
place = 3
largeur = 0.45

# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Henri Matisse"
vie = "Le Cateau-Cambrésis (Nord), 31 décembre 1869 – Nice, 3 novembre 1954"
biographie = """
Fils d'un marchand de grains du Nord, Henri Matisse se destine d'abord au droit et \
travaille comme clerc d'avoué. En 1890, immobilisé par une appendicite, il reçoit de \
sa mère une boîte de couleurs : c'est une révélation. Il part pour Paris, entre en \
1895 à l'École des beaux-arts dans l'atelier de Gustave Moreau, découvre \
l'impressionnisme et Cézanne, puis la lumière du Midi en Corse. En 1898, il épouse \
Amélie Parayre. Après un été à Saint-Tropez auprès de Signac en 1904, il peint à \
Collioure avec Derain, en 1905, les toiles qui font scandale au Salon d'Automne et \
font de lui le chef des « fauves ». Soutenu par les Stein, puis par les \
collectionneurs russes Chtchoukine et Morozov, il ouvre une académie et voyage au \
Maroc. À partir de 1917, il travaille surtout à Nice, où il peint ses odalisques. \
Gravement malade en 1941, il invente dans ses dernières années les gouaches découpées \
et conçoit la chapelle du Rosaire de Vence. Il meurt à Nice en 1954."""
style = """
Matisse fait de la couleur le moteur de la peinture : posée en aplats purs, elle \
construit l'espace, la lumière et l'émotion sans recourir au modelé ni à la \
perspective. Son dessin, d'une grande économie, cherche l'arabesque essentielle. Il \
rêvait d'un art d'équilibre et de sérénité, décoratif au sens le plus noble. Il est \
l'un des grands inventeurs de la peinture du XXᵉ siècle ; ses intérieurs, ses papiers \
découpés et sa liberté chromatique ont nourri l'abstraction américaine et des \
générations de peintres et de créateurs."""

[[artistes]]
nom = "Vassily Kandinsky"
vie = "Moscou, 16 décembre 1866 – Neuilly-sur-Seine, 13 décembre 1944"
biographie = """
Kandinsky étudie le droit et l'économie à Moscou et semble promis à une carrière \
universitaire avant de tout abandonner, à trente ans, pour la peinture. Il part en \
1896 pour Munich, où il fonde un groupe d'artistes et vit avec la peintre Gabriele \
Münter, à Munich et à Murnau. Ses paysages se libèrent peu à peu de la représentation \
et, vers 1910-1911, il peint ses premières grandes toiles abstraites. En 1911, il \
publie Du spirituel dans l'art et fonde avec Franz Marc le Blaue Reiter, le Cavalier \
bleu. La guerre le ramène en Russie, où il participe aux institutions artistiques de \
la révolution. Revenu en Allemagne fin 1921, il enseigne au Bauhaus de 1922 à sa \
fermeture par les nazis en 1933, à Weimar, à Dessau puis à Berlin. Il s'installe alors \
à Neuilly-sur-Seine, près de Paris, où il peint jusqu'à sa mort en 1944. Aux \
États-Unis, il est collectionné très tôt, d'abord par Arthur Jerome Eddy à Chicago, \
puis par Solomon R. Guggenheim à New York."""
style = """
Kandinsky passe des taches de couleur tourbillonnantes de ses années munichoises à la \
géométrie précise de la période du Bauhaus, puis aux formes souples, presque \
biologiques, de ses dernières années parisiennes. Partout, il compare la peinture à la \
musique : couleurs et formes doivent agir directement sur l'âme, comme des sons. \
Peintre et théoricien, il a donné à l'art abstrait ses premiers textes fondateurs."""

[[artistes]]
nom = "Louis Marcoussis"
vie = "Varsovie, 1878 – Cusset (Allier), 1941"
biographie = """
Né Ludwik Markus à Varsovie, alors dans l'Empire russe, le futur Marcoussis étudie la \
peinture à l'Académie des beaux-arts de Cracovie, puis s'installe à Paris en 1903 et \
passe par l'académie Julian. Pour vivre, il dessine pendant plusieurs années des \
caricatures pour des journaux humoristiques. Vers 1910, il se lie avec Guillaume \
Apollinaire, qui lui trouve son nom d'artiste, avec Georges Braque et avec Pablo \
Picasso, et adopte le cubisme ; il participe en 1912 au Salon de la Section d'or. En \
1913, il épouse la peintre Alice Halicka. Engagé volontaire dans l'armée française \
pendant la Première Guerre mondiale, il reprend ensuite la peinture et réalise \
notamment des peintures sous verre, inspirées de l'art populaire polonais. Dans les \
années 1930, il se consacre surtout à la gravure et illustre des poètes, dont \
Apollinaire. Réfugié dans l'Allier après la défaite de 1940, il meurt à Cusset, près \
de Vichy, en 1941."""
style = """
Marcoussis pratique un cubisme élégant et lisible, fait de grands plans nets, de \
gammes sourdes de gris et de bleus réchauffées de rouges et de bruns, d'imitations de \
matières et de lettres peintes. Moins radical que Picasso ou Braque, il cherche \
l'équilibre et la clarté de la composition. Graveur remarquable, il a donné au cubisme \
une version poétique et précise, qui se prolonge dans ses estampes et ses \
illustrations."""

[[artistes]]
nom = "Paul Klee"
vie = "Münchenbuchsee (Suisse), 18 décembre 1879 – Muralto (Suisse), 29 juin 1940"
biographie = """
Fils d'un professeur de musique allemand et d'une chanteuse suisse, Paul Klee grandit \
à Berne et hésite longtemps entre la musique et la peinture. Il étudie à Munich, où il \
s'installe et se lie avec Kandinsky et les artistes du Blaue Reiter. En 1914, un \
voyage en Tunisie avec August Macke et Louis Moilliet lui révèle la couleur : il note \
alors dans son journal que la couleur et lui ne font plus qu'un. Mobilisé pendant la \
guerre, il est appelé en 1921 au Bauhaus, à Weimar puis à Dessau, où il enseigne dix \
ans et voisine avec Kandinsky. Professeur à l'Académie de Düsseldorf à partir de 1931, \
il est renvoyé par les nazis en 1933 et retourne à Berne. Atteint d'une grave maladie \
de peau, la sclérodermie, il peint pourtant avec une énergie nouvelle des centaines \
d'œuvres dans ses dernières années, avant de mourir en 1940 dans le Tessin."""
style = """
Klee invente un univers poétique où se mêlent signes, écritures, figures, paysages et \
architectures imaginaires. Il passe librement de l'abstraction au dessin presque \
enfantin, avec humour et fantaisie, mais en s'appuyant sur une réflexion théorique \
très rigoureuse sur la ligne, la couleur et le rythme, inspirée de la musique. Son \
œuvre immense, de plus de neuf mille numéros, a influencé le surréalisme et \
l'abstraction d'après-guerre."""

[[artistes]]
nom = "Henri Rousseau"
vie = "Laval, 21 mai 1844 – Paris, 2 septembre 1910"
biographie = """
Fils d'un ferblantier de Laval, Henri Rousseau devient clerc chez un avoué, puis \
s'engage dans l'armée. En 1871, il entre à l'octroi de Paris, l'administration qui \
perçoit les taxes sur les marchandises entrant dans la ville : de là vient son surnom \
de Douanier, bien qu'il n'ait jamais été douanier. Il peint en autodidacte pendant ses \
loisirs et expose à partir de 1886 au Salon des Indépendants, ouvert à tous, sans \
jury. Le public et la critique se moquent de ses toiles, qu'il continue d'envoyer \
chaque année. En 1893, il prend sa retraite pour se consacrer à la peinture, donne des \
leçons de violon et de dessin et vit pauvrement. Il se lie avec Alfred Jarry, lui \
aussi né à Laval, puis avec Apollinaire, Robert Delaunay et Picasso, qui organise en \
1908 un banquet en son honneur au Bateau-Lavoir. Après Surpris !, sa première jungle, \
en 1891, il en peint une vingtaine à partir de 1904. Il meurt en septembre 1910 à \
l'hôpital Necker, peu après avoir exposé Le Rêve."""
style = """
Rousseau peint sans formation académique, avec une application minutieuse : contours \
nets, couleurs lisses, perspective naïve, figures frontales. Ses jungles, inventées à \
partir des serres parisiennes et d'images d'albums, ont une étrangeté de rêve. Admiré \
par Picasso, Apollinaire puis les surréalistes, il a ouvert la voie à la \
reconnaissance de l'art naïf."""

[[artistes]]
nom = "Odilon Redon"
vie = "Bordeaux, 20 avril 1840 – Paris, 6 juillet 1916"
biographie = """
Bertrand Jean Redon, dit Odilon, passe une enfance solitaire sur le domaine familial \
de Peyrelebade, dans le Médoc. Il étudie un temps l'architecture, puis la peinture à \
Paris dans l'atelier de Gérôme, sans succès. Sa vraie rencontre est celle du graveur \
Rodolphe Bresdin, à Bordeaux, qui lui apprend l'eau-forte et la liberté de \
l'imagination. Pendant plus de vingt ans, Redon travaille en noir, au fusain et en \
lithographie : les albums Dans le rêve, en 1879, À Edgar Poe, Les Origines ou Hommage \
à Goya peuplent son œuvre d'yeux flottants, de têtes coupées et de monstres. Huysmans \
le célèbre dans À rebours en 1884, et les poètes symbolistes, Mallarmé en tête, \
deviennent ses amis. Vers 1890, après la naissance de son fils Arï, il se tourne vers \
la couleur, pastel et huile, et peint fleurs, mythes et grands décors, comme ceux de \
l'abbaye de Fontfroide. Les Nabis le vénèrent, et il expose à l'Armory Show de New \
York en 1913."""
style = """
Redon veut, selon ses propres termes, mettre la logique du visible au service de \
l'invisible. Ses noirs, d'un velouté profond, donnent vie à des créatures nées du rêve \
et de la science de son temps, microbes et êtres hybrides. Ses couleurs, plus tard, \
sont posées en touches précieuses qui semblent irradier. Indépendant de toute école, \
il a ouvert la voie aux Nabis, à Matisse et aux surréalistes, qui voyaient en lui un \
précurseur."""

[[artistes]]
nom = "Käthe Kollwitz"
vie = "Königsberg (Prusse-Orientale), 8 juillet 1867 – Moritzburg, près de Dresde, 22 avril 1945"
biographie = """
Née Käthe Schmidt à Königsberg dans une famille libérale et très religieuse, elle \
étudie le dessin et la peinture à Berlin et à Munich, dans les écoles réservées aux \
femmes, les académies leur étant alors fermées. En 1891, elle épouse le médecin Karl \
Kollwitz et s'installe avec lui dans un quartier ouvrier du nord de Berlin, où elle \
trouve ses modèles parmi les patients de son mari. Son cycle gravé La Révolte des \
tisserands, inspiré d'une pièce de Gerhart Hauptmann, la rend célèbre à la fin des \
années 1890, suivi de La Guerre des paysans. En octobre 1914, son fils cadet Peter est \
tué en Flandre ; ce deuil marque toute son œuvre, des gravures sur bois du cycle La \
Guerre au monument des Parents en deuil, achevé en 1932. Première femme élue à \
l'Académie prussienne des arts, en 1919, elle en est chassée par les nazis en 1933 et \
ne peut plus exposer. Son mari meurt en 1940, son petit-fils Peter tombe en Russie en \
1942, et sa maison de Berlin est détruite par les bombes en 1943. Réfugiée à \
Moritzburg, elle y meurt quelques jours avant la fin de la guerre."""
style = """
Graveuse et sculptrice avant tout, Käthe Kollwitz travaille presque exclusivement en \
noir et blanc, à l'eau-forte, à la lithographie et à la gravure sur bois. Elle réduit \
le décor à rien et concentre tout sur les visages, les mains et les corps éprouvés : \
la faim, le travail, la révolte, la mort, la maternité. Son trait large et grave, \
d'une grande économie, fait d'elle l'une des voix les plus fortes de l'art engagé et \
du réalisme expressionniste allemand."""

[[artistes]]
nom = "Amedeo Modigliani"
vie = "Livourne (Italie), 12 juillet 1884 – Paris, 24 janvier 1920"
biographie = """
Né à Livourne dans une famille juive séfarade cultivée mais ruinée, Amedeo Modigliani, \
de santé fragile, étudie la peinture à Livourne, Florence et Venise, nourri des \
maîtres de la Renaissance. En 1906, il s'installe à Paris, d'abord à Montmartre puis à \
Montparnasse. Entre 1909 et 1914, encouragé par le sculpteur Constantin Brancusi, il \
se consacre surtout à la sculpture et taille des têtes de pierre allongées, avant que \
sa santé ne l'oblige à y renoncer. Revenu à la peinture, il réalise les portraits de \
ses amis, Soutine, Max Jacob, Cocteau, et une série de nus ; lors de leur exposition à \
la galerie Berthe Weill, en 1917, la police exige leur retrait dès le jour du \
vernissage. Ses marchands, Paul Guillaume puis Léopold Zborowski, le soutiennent. En \
1917, il rencontre Jeanne Hébuterne, qui lui donne une fille en 1918. Miné par la \
tuberculose, l'alcool et la misère, il meurt en 1920 à trente-cinq ans, au moment où \
sa peinture commence à se vendre."""
style = """
Modigliani a créé une figure humaine immédiatement reconnaissable : visage ovale, cou \
étiré, nez long, yeux en amande souvent sans pupilles, épaules tombantes. Ce canon \
unit la grâce des peintres siennois et de Botticelli, la simplification de la \
sculpture africaine et archaïque et la construction de Cézanne. Ni fauve ni cubiste, \
il reste en marge des mouvements de son temps, mais partage avec les expressionnistes \
la volonté de traduire une présence intérieure plutôt qu'une ressemblance."""

[[artistes]]
nom = "Paula Modersohn-Becker"
vie = "Dresde, 8 février 1876 – Worpswede (près de Brême), 20 novembre 1907"
biographie = """
Née à Dresde dans une famille cultivée installée à Brême en 1888, Paula Becker suit \
une formation d'institutrice, comme le souhaitent ses parents, tout en prenant des \
cours de dessin et de peinture à Londres et à Berlin. En 1898, elle rejoint Worpswede, \
colonie d'artistes nichée dans les tourbières près de Brême, où elle se lie avec la \
sculptrice Clara Westhoff, future épouse du poète Rilke. Entre 1900 et 1907, elle fait \
quatre séjours à Paris, où elle découvre Cézanne, Gauguin, les Nabis et les portraits \
du Fayoum. En 1901, elle épouse le peintre Otto Modersohn, veuf et père d'une petite \
fille. Étouffant dans la vie conjugale et dans le cercle de Worpswede, qui juge sa \
peinture maladroite, elle part seule pour Paris en 1906, où elle peint des \
autoportraits et des natures mortes d'une liberté nouvelle. Revenue à Worpswede, elle \
meurt en novembre 1907, dix-huit jours après la naissance de sa fille Mathilde, à \
trente et un ans. Elle n'avait vendu que quelques tableaux ; elle en laissait plus de \
sept cents."""
style = """
Paula Modersohn-Becker a dépassé le réalisme sentimental des peintres de Worpswede \
pour une peinture de formes simples et massives, aux couleurs sourdes et à la matière \
grenue. Inspirée par Cézanne, Gauguin et l'art archaïque, elle peint les paysannes, \
les enfants, les mères et surtout elle-même, avec une gravité et une franchise \
inédites. Pionnière de l'expressionnisme allemand, elle est aussi l'une des premières \
femmes à avoir fait de son propre corps le sujet de son art."""

[[artistes]]
nom = "Gwen John"
vie = "Haverfordwest (pays de Galles), 22 juin 1876 – Dieppe, 18 septembre 1939"
biographie = """
Fille d'un avoué, Gwendolen Mary John grandit à Tenby, sur la côte du pays de Galles, \
avec son frère cadet Augustus, futur peintre célèbre. De 1895 à 1898, elle étudie à la \
Slade School of Fine Art de Londres, puis suit à Paris l'enseignement de Whistler. En \
1904, elle s'installe en France, où elle vivra jusqu'à sa mort. Elle devient le modèle \
et l'amante d'Auguste Rodin, puis se retire en 1911 à Meudon, où elle se convertit au \
catholicisme et peint, pour les religieuses du couvent voisin, une série de portraits \
de leur fondatrice. À partir de 1910, le collectionneur new-yorkais John Quinn lui \
achète régulièrement ses œuvres et lui assure une indépendance précieuse. Elle n'a \
qu'une seule exposition personnelle de son vivant, à Londres, en 1926. Après la mort \
de Quinn, elle peint de moins en moins et vit dans une grande solitude. Elle meurt à \
Dieppe en 1939, longtemps éclipsée par la gloire de son frère avant d'être reconnue \
comme l'une des grandes peintres britanniques de son siècle."""
style = """
Gwen John peint presque toujours la même chose : une femme seule, assise dans une \
chambre, ou un coin d'intérieur vide, une chaise, une fenêtre. Ses tableaux, souvent \
petits, sont faits de touches sèches et mates, sur des préparations crayeuses, dans \
une gamme de tons très voisins, gris, beiges, roses éteints. Elle reprend un même \
motif en plusieurs versions, avec de légères variations, et donne à ces scènes \
silencieuses une intensité presque religieuse."""
