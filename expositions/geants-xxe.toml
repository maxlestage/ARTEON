# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « LES GÉANTS DU DÉBUT DU XXᵉ SIÈCLE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/geants-xxe/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /geants-xxe.
#
#  Droits : toutes les œuvres montrées ici sont dans le domaine public. Leurs
#  auteurs sont morts avant 1956 et elles ont été créées entre 1900 et 1923. Les
#  photographies sont publiées sous licence CC0 par les musées qui conservent les
#  œuvres : l'Art Institute of Chicago, la National Gallery of Art de Washington,
#  le Metropolitan Museum of Art de New York et le Cleveland Museum of Art. Les
#  géants venus ensuite (Picasso, Dalí, Frida Kahlo…), encore protégés par le
#  droit d'auteur, ne sont que nommés dans les textes.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 195
nom_court = "Géants du XXᵉ"
mouvement = "Les géants du début du XXᵉ siècle : Matisse, Kandinsky, Klee, Rousseau, Redon, Modigliani…"
cadre = "noir"
couleur = "#9b2a1e"
titre = "Les géants du début du XXᵉ siècle, de Matisse à Klee"
artiste = "Matisse, Kandinsky, Klee, Rousseau, Redon, Modigliani, Kollwitz…"
dates = "1900–1923"
accroche = "Exposition virtuelle · Museo Reina Sofía, Madrid"
introduction = """
Entre 1900 et 1923, une poignée d'artistes change le visage de la peinture. Matisse \
fait de la couleur un sujet en soi, Kandinsky la délivre des objets, les cubistes \
démontent les figures en facettes ; le Douanier Rousseau, Odilon Redon et Paul Klee \
ouvrent les portes du rêve bien avant les surréalistes ; Käthe Kollwitz, Modigliani, \
Paula Modersohn-Becker et Gwen John cherchent la vérité d'un visage ou le silence \
d'une chambre. Tous sont morts depuis longtemps et leurs œuvres sont aujourd'hui \
libres : les dix tableaux et estampes de cette visite viennent de musées de Chicago, \
de Washington, de New York et de Cleveland, qui en publient les photographies sans \
restriction. Les géants venus après eux, Picasso, Dalí ou Frida Kahlo, sont encore \
protégés par le droit d'auteur : ils ne sont ici qu'évoqués, jamais montrés. Le \
bâtiment s'inspire du Museo Reina Sofía de Madrid, l'ancien hôpital devenu le musée \
de l'art du XXᵉ siècle : un vestibule, une grande salle blanche pour les avant-gardes, \
et deux salles plus intimes de part et d'autre, l'une pour le rêve, l'autre pour les \
visages."""
vitrine = "femme-aquarium.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Museo Nacional Centro de Arte Reina Sofía"
ville = "Madrid, Espagne"
architecte = "Francesco Sabatini ; extension de Jean Nouvel"
construction = "fin du XVIIIᵉ siècle ; centre d'art depuis 1986"
presentation = """
Le Reina Sofía occupe l'ancien Hôpital général de Madrid, élevé au XVIIIᵉ siècle, pour \
l'essentiel sous le règne de Charles III : un immense édifice austère, ordonné autour \
de cours intérieures, dont l'architecte Francesco Sabatini dirigea la construction et \
dont seule une partie du projet fut bâtie. L'hôpital ferme en 1965 ; menacé de \
démolition, le bâtiment est protégé, restauré, et ouvre en 1986 comme centre d'art, \
avant de devenir en 1988 le musée national d'art moderne, sous le nom de la reine \
Sofía. Ses deux tours d'ascenseurs en verre, ajoutées sur la façade, et l'extension de \
Jean Nouvel, inaugurée en 2005 sous un grand toit rouge, en ont fait un repère du \
quartier d'Atocha. Le musée conserve Picasso, Dalí, Miró et Juan Gris ; sa salle la \
plus célèbre, au deuxième étage, est celle de Guernica, arrivé en 1992 avec ses \
dessins préparatoires."""
ici = """
Le bâtiment d'ARTEON emprunte au Reina Sofía ses murs blancs et ses hautes salles \
d'ancien hôpital. On entre par le sud dans le vestibule Sabatini, haut de sept mètres, \
puis dans la salle des avant-gardes, la plus vaste, large de dix-huit mètres et haute \
de neuf, où Matisse, Kandinsky et Marcoussis sont accrochés côte à côte. De là, une \
porte à l'ouest mène au cabinet du rêve, celui de Klee, du Douanier Rousseau et de \
Redon ; une porte à l'est mène à la salle des visages et de l'intimité, celle de Käthe \
Kollwitz, de Modigliani, de Paula Modersohn-Becker et de Gwen John. Ce sont deux \
salles de douze mètres sur dix aux murs blanc chaud, plus basses et plus intimes."""

