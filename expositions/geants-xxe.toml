# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « LES GÉANTS DU XXᵉ SIÈCLE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/geants-xxe/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /geants-xxe.
#
#  Droits : Picasso, Dalí, Magritte, Chagall et Warhol sont protégés par le droit
#  d'auteur. On ne montre d'eux que des photographies publiées sous licence libre
#  sur Wikimedia Commons, d'œuvres installées en permanence dans l'espace public
#  d'un pays dont la liberté de panorama les couvre (Espagne, Pays-Bas), ou jugées
#  dans le domaine public (le Picasso de Chicago, 1970). Aucun tableau protégé
#  n'est reproduit. Les quatre tableaux de Frida Kahlo (1926–1929), antérieurs à
#  1931, sont dans le domaine public en Europe et aux États-Unis (pas au Mexique,
#  où ils restent protégés jusqu'en 2054). Magritte, Chagall et Warhol, sans
#  image libre admissible, ne sont présents que dans les textes.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 195
nom_court = "Géants du XXᵉ"
mouvement = "Les géants du XXᵉ siècle : Picasso, Dalí, Magritte, Chagall, Kahlo, Warhol"
cadre = "noir"
couleur = "#9b2a1e"
titre = "Les géants du XXᵉ siècle, de Guernica aux places publiques"
artiste = "Picasso, Dalí, Kahlo… et, en récit, Magritte, Chagall, Warhol"
dates = "1926–1985"
accroche = "Exposition virtuelle · Museo Reina Sofía, Madrid"
introduction = """
Picasso, Dalí, Magritte, Chagall, Frida Kahlo, Andy Warhol : six noms qui résument le \
XXᵉ siècle, du cubisme au pop art en passant par le surréalisme. Leurs tableaux sont \
encore protégés par le droit d'auteur : Guernica, La Persistance de la mémoire, Ceci \
n'est pas une pipe ou les Marilyn ne peuvent être que racontés ici. La visite montre \
donc ce qui est libre : quatre tableaux de jeunesse de Frida Kahlo, peints avant 1931, \
et des photographies libres d'œuvres monumentales de Picasso et de Dalí dressées dans \
les rues de Chicago, Rotterdam, Barcelone, Figueres et Marbella ; Magritte, Chagall et \
Warhol, dont aucune œuvre publique ne peut être montrée librement, restent présents \
par leur nom. Le bâtiment s'inspire du Museo Reina Sofía de Madrid, l'ancien hôpital \
où est accroché Guernica : un vestibule, la grande salle blanche de Picasso, et deux \
salles plus intimes de part et d'autre."""
vitrine = "autoportrait-robe-de-velours.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Museo Nacional Centro de Arte Reina Sofía"
ville = "Madrid, Espagne"
architecte = "Francesco Sabatini ; extension de Jean Nouvel"
construction = "fin du XVIIIᵉ siècle ; centre d'art depuis 1986"
presentation = """
Le Reina Sofía occupe l'ancien Hôpital général de Madrid, élevé au XVIIIᵉ siècle, pour \
l'essentiel sous le règne de Charles III : un immense édifice austère, ordonné autour \
de cours intérieures, dont l'architecte Francesco Sabatini dirigea la construction et \
dont seule une partie du projet fut bâtie. L'hôpital ferme en 1965 ; menacé de \
démolition, le bâtiment est protégé, restauré, et ouvre en 1986 comme centre d'art, \
avant de devenir en 1988 le musée national d'art moderne, sous le nom de la reine \
Sofía. Ses deux tours d'ascenseurs en verre, ajoutées sur la façade, et l'extension de \
Jean Nouvel, inaugurée en 2005 sous un grand toit rouge, en ont fait un repère du \
quartier d'Atocha. Le musée conserve Picasso, Dalí, Miró et Juan Gris ; sa salle la \
plus célèbre, au deuxième étage, est celle de Guernica, arrivé en 1992 avec ses \
dessins préparatoires."""
ici = """
Le bâtiment d'ARTEON emprunte au Reina Sofía ses murs blancs et ses hautes salles \
d'ancien hôpital. On entre par le sud dans le vestibule Sabatini, haut de sept mètres, \
puis dans la salle 206, la plus vaste, large de dix-huit mètres et haute de neuf, \
consacrée à Picasso. De là, une porte à l'ouest mène au cabinet de Dalí, une porte à \
l'est à la salle de Frida Kahlo, deux salles de douze mètres sur dix aux murs blanc \
chaud, plus basses et plus intimes."""

