[[oeuvres]]
titre = "Le Couronnement de la Vierge"
artiste = "Enguerrand Quarton"
annee = "1453–1454"
image = "couronnement-quarton.jpg"
technique = "Huile sur panneau, 183 × 220 cm"
collection = "Musée Pierre-de-Luxembourg, Villeneuve-lès-Avignon"
note = "Toute la création, du ciel à l'enfer, autour de la Vierge couronnée : un retable dont le contrat de commande est conservé."
description = """
Au centre de la partie haute, la Vierge, en robe de brocart d'or, les mains croisées \
sur la poitrine, son grand manteau bleu étalé sur un nuage, est couronnée par le Père \
et le Fils, représentés identiques, drapés de rouge et d'or. Entre eux plane la \
colombe du Saint-Esprit, dont les ailes touchent leurs bouches. Autour d'eux, sur fond \
d'or, se pressent les chœurs des anges, les patriarches, les apôtres, les saints et \
les saintes, et une foule d'élus de toutes conditions, papes, rois, moines et simples \
fidèles. Plus bas, sous une bande de ciel, s'étend la terre : à gauche Rome, à droite \
Jérusalem, au centre un Christ en croix, devant lequel un chartreux vêtu de blanc prie \
à genoux. Tout en bas s'ouvrent le purgatoire, d'où les âmes sont délivrées par des \
anges, et l'enfer."""
evocation = """
Le retable figure l'ordre entier de l'univers chrétien, du ciel jusqu'à l'enfer, comme \
une cathédrale en image. La Trinité est au sommet ; la Vierge, intercesseur des \
hommes, est au centre ; l'Église terrestre, avec ses deux capitales, Rome et \
Jérusalem, relie les deux mondes ; la Croix est l'axe du salut. La représentation du \
Père et du Fils sous des traits rigoureusement semblables affirme leur égalité au sein \
de la Trinité : c'est un point de doctrine exigé par le contrat. Le paysage de la \
partie basse, avec sa mer et ses montagnes, est l'un des premiers grands paysages \
naturels de la peinture française, et on a voulu y reconnaître des sites de Provence."""
histoire = """
Le 24 avril 1453, à Villeneuve-lès-Avignon, le prêtre Jean de Montagnac passe contrat \
avec Enguerrand Quarton, peintre installé à Avignon, pour un retable destiné à l'autel \
de la chapelle de la Trinité, dans l'église de la chartreuse du Val-de-Bénédiction. Ce \
contrat, conservé, est l'un des plus détaillés du Moyen Âge : il énumère les \
personnages, leur place, les villes à représenter, tout en laissant certains points au \
choix du peintre. L'œuvre doit être livrée en septembre 1454. Elle reste chez les \
chartreux jusqu'à la Révolution, puis passe à l'hospice de la ville. Elle est \
aujourd'hui présentée au musée Pierre-de-Luxembourg de Villeneuve-lès-Avignon."""
facture = """
Quarton, venu du nord de la France, unit plusieurs traditions : la précision et le \
paysage flamands, la monumentalité et la clarté des formes italiennes, l'éclat d'une \
lumière méditerranéenne. Les figures célestes sont de grandes formes simples, aux \
couleurs pures, rouge, bleu et or, disposées symétriquement. Les foules d'élus sont \
traitées en têtes serrées, nettement individualisées. En bas, l'échelle change : la \
terre est vue de haut, minuscule, avec un horizon lointain qui se perd dans la brume \
bleutée."""
details = [
  "Le Père et le Fils, aux visages et aux vêtements identiques.",
  "La colombe du Saint-Esprit, dont les ailes relient les deux bouches.",
  "Le petit chartreux en robe blanche agenouillé devant la croix.",
  "Rome à gauche et Jérusalem à droite, dans le paysage terrestre.",
  "Les âmes tirées du purgatoire par des anges, tout en bas.",
]
themes = ["trinité", "vierge", "paradis", "enfer", "provence"]
anecdote = """
Le contrat précisait que le Père et le Fils devaient être peints sans aucune \
différence entre eux. Quarton a obéi à la lettre : seule leur position, de part et \
d'autre de la Vierge, permet de les distinguer."""
salle = 3
mur = "ouest"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "L'Annonciation entre saint Ansano et sainte Marguerite"
artiste = "Simone Martini"
annee = "1333"
image = "annonciation-martini.jpg"
technique = "Tempera et or sur panneau, 184 × 210 cm (305 × 265 cm avec le cadre)"
collection = "Galerie des Offices, Florence"
note = "Peinte avec son beau-frère Lippo Memmi pour la cathédrale de Sienne : l'ange, la Vierge qui recule, et des mots d'or en relief."
description = """
Sur un fond d'or presque continu, sous des arcs gothiques festonnés surmontés de \
gâbles, l'archange Gabriel vient de se poser à gauche, un genou encore à terre, son \
manteau écossais à carreaux gonflé par l'élan. Il tient un rameau d'olivier et porte \
une couronne de feuillage. De sa bouche sort la salutation, inscrite en lettres d'or \
qui traversent le panneau vers la Vierge. Marie, assise sur un trône à droite, se \
détourne, le corps tordu dans un mouvement de recul, ramenant son manteau bleu contre \
son cou ; elle garde le pouce dans le livre qu'elle lisait. Entre eux, un vase de lys. \
En haut, la colombe entourée d'anges. Sur les côtés, saint Ansano et sainte \
Marguerite."""
evocation = """
L'Évangile de Luc dit que Marie fut troublée par la parole de l'ange : Simone Martini \
traduit ce trouble par un geste de retrait presque craintif, d'une grande vérité \
humaine sous l'élégance des lignes. Les mots de l'ange, « Ave gratia plena Dominus \
tecum », rendus visibles et en relief, font de la parole divine un objet de lumière. \
Le rameau d'olivier, symbole de paix, remplace ici le lys que tient habituellement \
Gabriel ; on y a vu une allusion à Sienne, qui évitait le lys, emblème de sa rivale \
Florence. Saint Ansano, l'évangélisateur de la ville, rappelle la destination civique \
du retable. C'est l'image même du gothique siennois : raffinement courtois et ferveur \
mystique."""
histoire = """
Le retable est commandé pour l'autel de Saint-Ansano dans la cathédrale de Sienne, \
l'un des quatre autels dédiés aux saints patrons de la ville. Une inscription le signe \
et le date : Simone Martini et Lippo Memmi de Sienne, 1333. Lippo, beau-frère de \
Simone, a sans doute peint une part des figures latérales. Déplacé plus tard dans \
l'oratoire de Sant'Ansano in Castelvecchio, il part en 1799 pour les Offices de \
Florence, en échange de deux tableaux de Luca Giordano. Son cadre d'origine a été \
remplacé au XIXᵉ siècle par l'encadrement néogothique actuel. Vers 1336, Simone \
Martini quittera Sienne pour la cour papale d'Avignon, où il mourra."""
facture = """
Tout repose sur la ligne : contours souples, courbes allongées, plis qui ondulent \
comme une calligraphie. L'or occupe l'essentiel de la surface et il est travaillé de \
toutes les manières : bruni, poinçonné de motifs, gravé, et même modelé en relief pour \
les lettres de la salutation. Les couleurs sont rares et précieuses : le bleu de lapis \
du manteau de Marie, le rose et le blanc, le tissu écossais de l'ange. L'espace est à \
peine suggéré, par le trône et le sol de marbre, au profit d'un effet d'orfèvrerie."""
details = [
  "Les lettres d'or en relief qui vont de la bouche de l'ange à la Vierge.",
  "Le manteau écossais à carreaux de Gabriel, encore soulevé par le vol.",
  "Le pouce de la Vierge glissé dans son livre pour garder la page.",
  "Le vase de lys au centre, sur le sol de marbre.",
  "Les prophètes peints dans les médaillons des gâbles, au-dessus des arcs.",
]
themes = ["annonciation", "ange", "sienne", "fond d'or", "gothique"]
anecdote = """
À Avignon, Simone Martini se lia d'amitié avec Pétrarque. Il peignit pour lui un \
portrait de Laure, aujourd'hui perdu, que le poète célèbre dans deux sonnets du \
Canzoniere."""
salle = 4
mur = "est"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "L'Annonciation"
artiste = "Fra Angelico"
annee = "vers 1425–1426"
image = "annonciation-fra-angelico.jpg"
technique = "Tempera et or sur panneau, 194 × 194 cm avec la prédelle"
collection = "Musée du Prado, Madrid"
note = "Sous un portique florentin, l'ange salue Marie, tandis qu'Adam et Ève quittent le jardin d'Éden : la chute et le salut côte à côte."
description = """
À droite, un portique ouvert, aux colonnes fines et aux voûtes bleu nuit semées \
d'étoiles d'or, abrite la scène. L'ange Gabriel, en robe rose brodée d'or, ses grandes \
ailes rayées dressées, s'incline les mains croisées sur la poitrine. Face à lui, la \
Vierge, assise, manteau bleu sur robe rose, un livre ouvert sur les genoux, croise \
elle aussi les bras et baisse la tête. Derrière, une petite chambre avec un banc. Un \
rayon d'or descend en diagonale depuis l'angle supérieur gauche, où apparaissent deux \
mains, et porte la colombe du Saint-Esprit. À gauche, dans un jardin foisonnant de \
fleurs et d'arbres fruitiers, un ange chasse Adam et Ève, vêtus de peaux, qui \
s'éloignent en pleurant."""
evocation = """
Le tableau réunit dans un même espace la faute et la réparation : Ève a fait entrer le \
péché dans le monde, Marie, « nouvelle Ève », accueille celui qui doit le racheter. Le \
rayon qui traverse le jardin du paradis perdu pour atteindre la Vierge relie les deux \
épisodes. Les gestes semblables de l'ange et de Marie, bras croisés, disent l'humilité \
et l'acceptation. Une hirondelle posée sur la barre de fer du portique a été \
interprétée comme l'annonce du printemps et de la Résurrection. L'architecture claire \
et mesurée, inspirée des loggias de Brunelleschi, montre un peintre dominicain qui \
prie par l'image mais connaît les nouveautés de la Renaissance florentine."""
histoire = """
Fra Angelico peint ce retable vers 1425–1426 pour l'église du couvent de San Domenico, \
à Fiesole, sur les collines de Florence, où il a prononcé ses vœux. La prédelle, sous \
le panneau principal, raconte en cinq petites scènes la vie de la Vierge. Au début du \
XVIIᵉ siècle, le couvent s'en sépare et l'œuvre gagne l'Espagne, par des \
intermédiaires encore discutés ; elle aboutit au monastère royal des Descalzas Reales \
de Madrid, d'où elle entre au musée du Prado en 1861. Une restauration achevée en 2019 \
lui a rendu l'éclat de ses couleurs et de son or, à l'occasion d'une grande exposition \
qui lui était consacrée."""
facture = """
Fra Angelico allie la tradition gothique, l'or des auréoles et des rayons, la \
préciosité des tissus, à la perspective nouvelle de Brunelleschi : les colonnes, les \
voûtes et la chambre du fond s'organisent selon des lignes fuyantes cohérentes. La \
lumière est claire et égale, les ombres légères. Les couleurs sont pures et \
lumineuses, roses, bleus et blancs, posées en couches fines. Le jardin du paradis, \
traité fleur par fleur, rappelle la minutie des enlumineurs."""
details = [
  "Les deux mains divines dans l'angle supérieur gauche, d'où part le rayon.",
  "La colombe du Saint-Esprit qui glisse le long du rayon d'or.",
  "L'hirondelle posée sur la barre de fer, au-dessus de la colonne centrale.",
  "Le médaillon sculpté d'une tête barbue, au centre des arcades.",
  "Adam et Ève vêtus de peaux, chassés par un ange vers la gauche.",
]
themes = ["annonciation", "paradis", "perspective", "ange", "dominicain"]
anecdote = """
Fra Angelico n'est pas un surnom de son vivant : on l'appelait frère Jean de Fiesole. \
Le pape Jean-Paul II l'a béatifié en 1982, puis l'a proclamé patron des artistes en \
1984."""
salle = 4
mur = "nord"
place = 2
largeur = 1.94

[[oeuvres]]
titre = "La Madone Rucellai"
artiste = "Duccio di Buoninsegna"
annee = "1285"
image = "madone-rucellai.jpg"
technique = "Tempera et or sur panneau, 450 × 290 cm"
collection = "Galerie des Offices, Florence"
note = "Commandée à un Siennois par une confrérie florentine en 1285 : l'un des plus grands panneaux peints du XIIIᵉ siècle."
description = """
Dans un haut panneau à pignon, entouré d'un cadre d'origine semé de petits médaillons \
de saints, la Vierge est assise sur un trône de bois ajouré, vu de biais, garni d'une \
tenture à motifs. Elle porte un manteau bleu sombre bordé d'un galon d'or qui serpente \
jusqu'à ses pieds. L'Enfant, sur ses genoux, en tunique blanche et drapé rose, tend la \
main vers sa mère. Six anges agenouillés, trois de chaque côté, sont superposés comme \
s'ils flottaient dans l'or : ils soutiennent le trône et lèvent les yeux vers Marie. \
Leurs vêtements, roses, mauves, verts et bleus, aux tons doux et changeants, \
contrastent avec la masse sombre du manteau."""
evocation = """
Duccio garde la solennité de l'icône byzantine, mais il l'adoucit : le visage de la \
Vierge est empreint de mélancolie, l'Enfant esquisse un geste tendre, les anges \
semblent de jeunes courtisans en adoration. Les historiens y reconnaissent l'élégance \
qui sera la marque de l'école siennoise, plus sensible à la grâce des lignes et des \
couleurs qu'à la masse des corps. La bordure d'or du manteau, qui dessine une \
arabesque continue, est souvent rapprochée de l'art gothique français, que Duccio a pu \
connaître par les manuscrits et les objets précieux. L'œuvre est aussi l'image d'une \
dévotion collective : celle d'une confrérie laïque qui chantait les louanges de la \
Vierge."""
histoire = """
Le 15 avril 1285, la Compagnie des Laudesi, confrérie florentine qui se réunissait \
dans l'église dominicaine de Santa Maria Novella pour chanter des louanges à la \
Vierge, passe contrat avec le Siennois Duccio pour un grand panneau. Le tableau prend \
plus tard le nom de la chapelle de la famille Rucellai, où il est placé. Vasari, au \
XVIᵉ siècle, l'attribue à Cimabue, et cette erreur dure jusqu'au XXᵉ siècle, quand le \
rapprochement du contrat et l'analyse du style imposent le nom de Duccio. Le panneau \
entre aux Offices en 1948. Une restauration menée à la fin du XXᵉ siècle a retrouvé le \
bleu du manteau, assombri par des repeints."""
facture = """
Duccio peint à la tempera sur un fond d'or bruni et poinçonné. Les chairs sont \
modelées en couches fines sur une sous-couche verte. Le trône est présenté de trois \
quarts, ce qui ouvre un espace, mais les anges ne reposent sur aucun sol. Les couleurs \
claires et changeantes des vêtements, rose passant au mauve, vert au bleu, sont une \
signature siennoise. La bordure d'or du manteau, aux plis sinueux, introduit une ligne \
souple d'inspiration gothique. Le cadre est d'origine, avec ses médaillons peints."""
details = [
  "Le galon d'or qui serpente sur le manteau, jusqu'aux pieds de la Vierge.",
  "L'étoile d'or sur l'épaule et sur le voile de Marie.",
  "Les médaillons de saints peints sur le cadre d'origine.",
  "Les pieds nus des anges agenouillés, posés dans le vide.",
]
themes = ["vierge en majesté", "sienne", "anges", "fond d'or", "confrérie"]
anecdote = """
En 1855, le peintre anglais Frederic Leighton exposa un tableau montrant cette Madone \
portée en triomphe dans les rues de Florence, d'après une légende de Vasari ; la reine \
Victoria l'acheta. On la croyait alors de Cimabue."""
salle = 5
mur = "nord"
place = 2
largeur = 2.9

[[oeuvres]]
titre = "La Trinité"
artiste = "Andreï Roublev"
annee = "vers 1411 ou vers 1425–1427"
image = "trinite-roublev.jpg"
technique = "Tempera sur panneau de bois, 142 × 114 cm"
collection = "Galerie Tretiakov, Moscou (confiée depuis 2023 à l'Église orthodoxe russe)"
note = "Trois anges assis autour d'une table : l'icône la plus vénérée de Russie, peinte en l'honneur de saint Serge de Radonège."
description = """
Trois anges aux grandes ailes dorées sont assis autour d'une table blanche, sur \
laquelle est posée une coupe contenant la tête d'un veau. Ils ont des visages \
semblables, inclinés, et tiennent chacun un fin bâton de voyageur. Celui de gauche, \
droit, porte un manteau aux reflets dorés ; celui du centre, en tunique pourpre et \
manteau bleu, penche la tête vers lui ; celui de droite, en manteau vert clair, \
s'incline aussi. Derrière eux, à peine indiqués, apparaissent une maison à gauche, un \
arbre au centre, un rocher à droite. Le fond doré a beaucoup souffert et la surface \
garde les traces de nombreuses lacunes."""
evocation = """
L'icône représente l'hospitalité d'Abraham : selon la Genèse, trois visiteurs \
mystérieux se présentent à lui au chêne de Mambré. Les chrétiens y ont vu une image de \
la Trinité. Roublev supprime Abraham et Sarah pour ne garder que les trois anges, en \
dialogue silencieux : la tradition reconnaît souvent le Père à gauche, le Fils au \
centre, devant l'arbre qui évoque la Croix, et l'Esprit à droite, mais d'autres \
lectures existent. La coupe sur la table rappelle le sacrifice et l'eucharistie. Le \
cercle dans lequel s'inscrivent les trois figures exprime l'unité et l'amour. Peinte \
pour honorer saint Serge, qui prêchait l'unité dans une Russie divisée, l'icône est \
devenue un symbole de paix et de contemplation."""
histoire = """
L'icône a été peinte pour la cathédrale de la Trinité du monastère fondé par saint \
Serge de Radonège, à Serguiev Possad, au nord-est de Moscou, sans doute à la demande \
de son successeur, l'higoumène Nikon. Sa date est discutée : vers 1411 ou vers \
1425–1427. En 1551, le concile des Cent Chapitres en fait le modèle à suivre pour \
représenter la Trinité. Longtemps recouverte d'un revêtement d'orfèvrerie et de \
repeints, elle est dégagée à partir de 1904, puis plus complètement en 1918–1919. \
Entrée en 1929 à la galerie Tretiakov, elle a été remise en 2023 à l'Église orthodoxe \
russe, malgré les inquiétudes des restaurateurs pour sa conservation."""
facture = """
Roublev peint à l'œuf sur un panneau de tilleul préparé au plâtre. La composition est \
réglée par la géométrie : les trois anges s'inscrivent dans un cercle, les deux anges \
latéraux encadrent celui du centre comme les côtés d'une coupe. La perspective est \
dite inversée : le marchepied et la table s'élargissent vers le fond, ce qui attire le \
spectateur dans l'image. Les couleurs sont claires et lumineuses, surtout le bleu de \
lapis, appelé golubets, qui relie les trois figures."""
details = [
  "La coupe au centre de la table, avec la tête de l'animal sacrifié.",
  "Les fins bâtons rouges que tiennent les trois anges.",
  "L'arbre de Mambré, au-dessus de l'ange central.",
  "Le petit rectangle peint sur le devant de la table.",
  "Les marchepieds dessinés en perspective inversée, sous les pieds des anges.",
]
themes = ["icône", "trinité", "anges", "hospitalité", "orthodoxie"]
anecdote = """
Le film Andreï Roublev d'Andreï Tarkovski, tourné en noir et blanc et achevé en 1966, \
s'achève sur de longs plans en couleur des icônes du peintre, dont la Trinité."""
salle = 5
mur = "ouest"
place = 2
largeur = 1.3

