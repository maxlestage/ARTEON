[[artistes]]
nom = "Tapissiers anonymes, vers 1500"
vie = "Cartons peints à Paris, tissage dans les Pays-Bas du Sud, vers 1500"
biographie = """
Les six tapisseries de la Dame à la licorne ne sont pas signées, comme presque toutes \
les tentures de la fin du Moyen Âge. Elles sont le fruit d'un travail à plusieurs \
mains. Un peintre conçoit d'abord le dessin général ; on reconnaît ici le style d'un \
artiste parisien actif vers 1500, appelé par convention le Maître d'Anne de Bretagne, \
que certains historiens identifient à Jean d'Ypres, auteur de vitraux, de miniatures \
et de gravures pour les livres imprimés. Un cartonnier agrandit ensuite ce modèle à la \
taille réelle de la tapisserie. Enfin, des liciers, sans doute dans un atelier des \
Pays-Bas du Sud, l'actuelle Belgique, tissent la pièce. Les commanditaires, les Le \
Viste, sont une famille de juristes originaire de Lyon, devenue puissante au service \
du roi à Paris. À cette époque, les tapisseries sont les objets les plus prestigieux \
d'une demeure noble : elles réchauffent les murs, se transportent de château en \
château et affichent la richesse de leur propriétaire. Leur prix dépasse souvent celui \
des tableaux."""
style = """
Ces tentures appartiennent au genre « millefleurs », caractéristique de la fin du XVᵉ \
et du début du XVIᵉ siècle : un fond uni semé de plantes fleuries, d'oiseaux et de \
petits animaux, sur lequel se détachent des figures élégantes. Les personnages, aux \
costumes somptueux, sont disposés sans perspective, avec une grande clarté. Ce style \
mêle l'observation de la nature et le goût courtois du symbole et de l'allégorie."""

[[artistes]]
nom = "Cimabue"
vie = "Florence, vers 1240 – Pise ?, vers 1302"
biographie = """
Cenni di Pepo, dit Cimabue, est né à Florence vers 1240. On sait peu de chose de sa \
vie : quelques documents, et la réputation que lui ont faite Dante, puis Vasari, qui \
en fait au XVIᵉ siècle le premier des peintres modernes. En 1272, il est mentionné à \
Rome. Il travaille ensuite à Assise, dans la basilique supérieure de Saint-François, \
où il peint à fresque une Crucifixion et des scènes de la vie de la Vierge et des \
apôtres, aujourd'hui très abîmées par l'oxydation des blancs de plomb. Il peint pour \
Florence deux grands crucifix, dont celui de Santa Croce, gravement endommagé par \
l'inondation de l'Arno en 1966 et devenu le symbole de ce désastre, et la Maestà de \
Santa Trinita. En 1301–1302, il est à Pise, où il réalise la figure de saint Jean dans \
la mosaïque de l'abside de la cathédrale, sa seule œuvre documentée avec certitude. Il \
meurt peu après. Selon la tradition, il aurait découvert le jeune Giotto en train de \
dessiner un mouton sur une pierre et l'aurait pris dans son atelier."""
style = """
Cimabue part de la peinture byzantine, la maniera greca, avec ses fonds d'or, ses \
figures frontales et ses plis rehaussés d'or. Mais il lui donne une énergie nouvelle : \
visages expressifs, corps plus massifs, trônes construits dans l'espace, émotion \
dramatique dans ses crucifix. Il ouvre la voie à Giotto et à Duccio."""

[[artistes]]
nom = "Giotto"
vie = "Colle di Vespignano (Toscane), vers 1267 – Florence, 8 janvier 1337"
biographie = """
Giotto di Bondone naît vers 1267 dans le Mugello, au nord de Florence, dans une \
famille de paysans. La tradition, rapportée par Vasari, raconte qu'il gardait les \
moutons quand Cimabue le découvrit. Il se forme sans doute dans l'atelier de ce \
dernier. Dans les années 1290, il participe probablement au décor de la basilique \
supérieure d'Assise, avec le cycle de la vie de saint François, dont l'attribution \
reste discutée. Vers 1303–1305, il peint à Padoue les fresques de la chapelle des \
Scrovegni, son chef-d'œuvre : la vie de la Vierge et du Christ en près de quarante \
scènes, sous une voûte bleue étoilée. Il travaille ensuite à Florence, à Santa Croce \
pour les chapelles Bardi et Peruzzi, à Rome, à Naples pour le roi Robert d'Anjou. \
Peintre le plus célèbre de son temps, chef d'un grand atelier, il est aussi un homme \
d'affaires avisé. En 1334, Florence le nomme architecte de la cathédrale : il dessine \
le campanile qui porte son nom. Il meurt en 1337 et est enterré dans la cathédrale."""
style = """
Giotto rompt avec les conventions byzantines : il donne aux figures un volume, un \
poids et des émotions humaines, place les personnages dans un espace cohérent et \
raconte les histoires sacrées avec une clarté dramatique. Ses fresques ont servi \
d'école à des générations de peintres, de Masaccio à Michel-Ange, qui le copia."""

[[artistes]]
nom = "Jean Fouquet"
vie = "Tours, vers 1420 – Tours, entre 1478 et 1481"
biographie = """
Jean Fouquet naît à Tours vers 1420, à l'époque où la cour de Charles VII réside dans \
la vallée de la Loire. Sa formation est mal connue ; il a pu travailler à Paris, peut- \
être auprès du Maître de Bedford, enlumineur. Vers 1445–1446, il séjourne à Rome, où \
il peint le portrait du pape Eugène IV, aujourd'hui perdu, et découvre l'architecture \
et la peinture de la Renaissance italienne. De retour à Tours, il ouvre un atelier et \
travaille pour le roi et pour les grands officiers de la cour : le portrait de Charles \
VII et celui du chancelier Guillaume Jouvenel des Ursins, au Louvre, le Diptyque de \
Melun et le livre d'heures d'Étienne Chevalier, dont les miniatures sont aujourd'hui \
dispersées, la plupart à Chantilly. Il illustre aussi les Grandes Chroniques de France \
et les Antiquités judaïques de Flavius Josèphe. En 1475, Louis XI lui donne le titre \
de peintre du roi. Il meurt à Tours avant 1481, et son nom tombe dans l'oubli jusqu'à \
sa redécouverte au XIXᵉ siècle."""
style = """
Fouquet réunit deux mondes : la minutie et la technique à l'huile des peintres \
flamands, et la clarté géométrique, la perspective et les architectures antiques \
découvertes en Italie. Ses figures sont simples, monumentales, ses couleurs nettes. Il \
est le premier grand peintre de la Renaissance en France et un portraitiste majeur."""

[[artistes]]
nom = "Frères de Limbourg"
vie = "Nimègue (duché de Gueldre), nés vers 1385–1390 – morts tous trois en 1416"
biographie = """
Paul, Jean et Herman de Limbourg naissent à Nimègue, dans l'actuelle Hollande, dans \
une famille d'artistes : leur père est sculpteur sur bois et leur oncle, Jean Malouel, \
est le peintre du duc de Bourgogne. Très jeunes, Jean et Herman sont envoyés en \
apprentissage chez un orfèvre parisien. Vers 1402, Philippe le Hardi, duc de \
Bourgogne, emploie Paul et Jean pour illustrer une Bible moralisée. À la mort de \
Philippe, en 1404, ils passent au service de son frère Jean, duc de Berry, l'un des \
plus grands collectionneurs de son temps. Pour lui, ils enluminent les Belles Heures, \
aujourd'hui au Metropolitan Museum de New York, puis, à partir de 1411 environ, les \
Très Riches Heures. Le duc les traite avec faveur : Paul reçoit une maison à Bourges \
et le titre de valet de chambre. En 1416, les trois frères meurent en quelques mois, \
peut- être d'une épidémie de peste, la même année que leur protecteur, laissant leur \
grand manuscrit inachevé."""
style = """
Les Limbourg portent l'enluminure gothique internationale à son sommet : couleurs \
précieuses, élégance des silhouettes, goût du luxe et des costumes. Ils y ajoutent une \
observation nouvelle de la nature et des lieux réels, châteaux, paysages, travaux des \
champs, qui annonce la peinture flamande de Van Eyck. Leurs calendriers ont fixé pour \
des siècles l'image que l'on se fait du Moyen Âge."""

[[artistes]]
nom = "Enguerrand Quarton"
vie = "Diocèse de Laon (Picardie), vers 1415–1420 – Avignon ?, après 1466"
biographie = """
Enguerrand Quarton, ou Charonton, naît dans le diocèse de Laon, dans le nord de la \
France, vers 1415–1420. Il se forme sans doute dans le Nord, au contact de la peinture \
flamande, avant de descendre en Provence. On le trouve à Aix-en-Provence en 1444, à \
Arles en 1446, puis à Avignon à partir de 1447, où il reste actif jusqu'en 1466. La \
ville, ancienne résidence des papes, est alors un carrefour d'artistes venus du Nord, \
d'Italie et d'Espagne. Quarton est l'un des rares peintres du XVᵉ siècle dont l'œuvre \
est fixée par des contrats : en 1452, il peint avec Pierre Villate une Vierge de \
Miséricorde pour la famille Cadard, aujourd'hui à Chantilly ; en 1453–1454, le \
Couronnement de la Vierge de Villeneuve-lès-Avignon. On lui attribue aussi la célèbre \
Pietà de Villeneuve-lès-Avignon, au Louvre, et des miniatures. Sa trace se perd après \
1466."""
style = """
Quarton est le principal maître de l'école d'Avignon. Il associe le réalisme flamand, \
la monumentalité italienne et une lumière méridionale crue, qui découpe les formes \
avec netteté. Ses compositions sont rigoureuses, symétriques, et d'une grande \
intensité spirituelle. Ses paysages, baignés d'une lumière claire, comptent parmi les \
premiers de la peinture française, et ses figures, simplifiées en grandes formes, ont \
une force sculpturale."""

[[artistes]]
nom = "Simone Martini"
vie = "Sienne, vers 1284 – Avignon, juillet 1344"
biographie = """
Simone Martini naît à Sienne vers 1284 et se forme sans doute dans l'entourage de \
Duccio. Sa première grande œuvre connue est la Maestà peinte à fresque en 1315 dans la \
salle du Conseil du Palais public de Sienne, qu'il retouche en 1321. Il travaille \
ensuite pour le roi Robert d'Anjou à Naples, qui l'anoblit en 1317, puis à Pise, à \
Orvieto, et à Assise, où il décore la chapelle Saint-Martin de la basilique \
inférieure. Au Palais public de Sienne, on lui attribue aussi le célèbre portrait \
équestre de Guidoriccio da Fogliano, dont l'attribution est discutée. En 1324, il \
épouse Giovanna, sœur du peintre Lippo Memmi, avec qui il signe l'Annonciation de \
1333. Vers 1335–1336, il s'installe à Avignon, alors siège de la papauté, où il peint \
pour la cour pontificale et se lie avec Pétrarque, qui lui confie des enluminures pour \
son manuscrit de Virgile. Il meurt à Avignon en 1344."""
style = """
Simone Martini est le grand maître du gothique siennois : lignes souples et élégantes, \
couleurs raffinées, or travaillé comme de l'orfèvrerie, figures d'une grâce courtoise. \
Il sait pourtant observer : gestes vrais, visages expressifs, émotions nuancées. Son \
séjour à Avignon a diffusé ce style dans toute l'Europe, où il a nourri le gothique \
international."""

[[artistes]]
nom = "Fra Angelico"
vie = "Vicchio (Toscane), vers 1395 – Rome, 18 février 1455"
biographie = """
Guido di Pietro naît vers 1395 dans le Mugello, au nord de Florence. Peintre déjà \
formé, il entre vers 1420 au couvent dominicain de San Domenico de Fiesole et prend le \
nom de frère Jean, Fra Giovanni. Il peint alors des retables pour son couvent et pour \
les églises de Florence et de Cortone. En 1436, les dominicains s'installent au \
couvent de San Marco à Florence, rebâti aux frais de Cosme de Médicis. Fra Angelico et \
son atelier en couvrent les murs de fresques, une dans chaque cellule de moine, pour \
aider à la méditation ; la plus célèbre est l'Annonciation en haut de l'escalier. À \
partir de 1445, il travaille à Rome pour les papes Eugène IV puis Nicolas V, dont il \
décore la chapelle privée au Vatican, et à Orvieto. De 1450 à 1452, il est prieur de \
son couvent de Fiesole. Il meurt à Rome en 1455 et est enterré à Santa Maria sopra \
Minerva, où sa pierre tombale le montre en habit de dominicain."""
style = """
Fra Angelico concilie la piété et la splendeur du gothique, l'or, les couleurs claires \
et précieuses, avec les découvertes de la Renaissance florentine : perspective, \
architecture antique, volume des corps. Sa lumière égale et sereine, ses figures \
recueillies sont mises au service de la prière. Moine et artiste à la fois, il a été \
vu comme le modèle du peintre chrétien, et ses anges musiciens ont été reproduits à \
l'infini."""

[[artistes]]
nom = "Duccio di Buoninsegna"
vie = "Sienne, vers 1255 – Sienne, vers 1318–1319"
biographie = """
Duccio di Buoninsegna naît à Sienne vers 1255. Il est mentionné pour la première fois \
en 1278, pour la peinture de coffres destinés aux archives de la commune. En 1285, une \
confrérie de Florence lui commande la Madone Rucellai, preuve que sa réputation \
dépasse déjà sa ville. Sa vie privée est agitée : les archives conservent la trace de \
nombreuses amendes et de dettes. Entre 1308 et 1311, il peint pour le maître-autel de \
la cathédrale de Sienne la Maestà, immense retable peint sur ses deux faces : la \
Vierge en majesté entourée des saints sur le devant, et au revers des dizaines de \
scènes de la vie du Christ. Le 9 juin 1311, il est porté en procession solennelle de \
l'atelier à la cathédrale, au son des cloches, par toute la ville. Le retable a été \
démembré au XVIIIᵉ siècle ; l'essentiel est conservé au musée de l'Œuvre de la \
cathédrale de Sienne. Duccio meurt vers 1318–1319, laissant des dettes à ses enfants."""
style = """
Duccio est le fondateur de l'école siennoise. Il humanise la tradition byzantine : \
visages doux et pensifs, gestes tendres, couleurs claires et changeantes, lignes \
souples venues du gothique français. Ses petites scènes narratives, au revers de la \
Maestà, comptent parmi les plus inventives de son temps, et son influence se lit chez \
Simone Martini et les frères Lorenzetti."""

[[artistes]]
nom = "Andreï Roublev"
vie = "Vers 1360 – Moscou, monastère Andronikov, vers 1428–1430"
biographie = """
On ne connaît ni la date ni le lieu de naissance d'Andreï Roublev, moine et peintre \
d'icônes, né vers 1360. Il aurait été moine au monastère de la Trinité fondé par saint \
Serge de Radonège, puis au monastère Andronikov de Moscou. La première mention de son \
nom date de 1405 : il travaille avec le célèbre Théophane le Grec et un autre maître, \
Prokhor de Gorodets, aux icônes et aux fresques de la cathédrale de l'Annonciation, au \
Kremlin de Moscou. En 1408, avec le peintre Daniel le Noir, il peint les fresques de \
la cathédrale de la Dormition à Vladimir, dont une partie du Jugement dernier est \
conservée. Il travaille ensuite au monastère de la Trinité, pour lequel il peint la \
Trinité, puis au monastère Andronikov, où il meurt vers 1428–1430. Très tôt vénéré \
comme un modèle, il a été canonisé par l'Église orthodoxe russe en 1988. Peu d'œuvres \
lui sont attribuées avec certitude."""
style = """
Roublev donne à l'icône russe sa forme la plus pure : figures allongées et gracieuses, \
visages doux et recueillis, compositions fondées sur le cercle, couleurs claires et \
lumineuses, dominées par un bleu célèbre. À la tension dramatique de Théophane le \
Grec, il oppose la paix et l'harmonie. Son art est resté la référence de \
l'iconographie russe pendant des siècles."""
