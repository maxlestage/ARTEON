Le duc d'Aumale a interdit que ses collections soient prêtées : le manuscrit ne quitte \
donc jamais Chantilly. Fragile, il n'est presque jamais exposé, et la plupart des \
visiteurs n'en découvrent qu'un fac-similé."""
