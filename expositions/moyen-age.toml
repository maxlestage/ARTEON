# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "La Dame à la licorne : « À mon seul désir »"
artiste = "Tapissiers anonymes, vers 1500"
annee = "vers 1500"
image = "mon-seul-desir.jpg"
technique = "Tapisserie de laine et de soie, 377 × 473 cm"
collection = "Musée de Cluny – musée national du Moyen Âge, Paris"
note = "La sixième et la plus mystérieuse des tapisseries de la Dame à la licorne, entourée de sa devise brodée sur une tente."
description = """
Sur un fond rouge semé de fleurs, de petits arbres et d'animaux, une île bleu nuit, \
couverte elle aussi de fleurs, porte la scène. Au centre, devant une grande tente \
bleue parsemée de flammèches d'or, une jeune femme richement vêtue se tient debout. \
Elle tient un collier entre ses mains, au-dessus d'un coffret ouvert que lui présente \
sa suivante. De part et d'autre, un lion et une licorne dressés écartent les pans de \
la tente et portent des étendards rouges barrés d'une bande bleue à trois croissants \
d'argent. Au sommet de la tente court l'inscription « À mon seul désir ». Un petit \
chien est assis sur un coussin posé sur un banc ; des lapins, un chien, un singe, des \
oiseaux et des arbres chargés de fruits peuplent tout l'espace, sans perspective ni \
ombre."""
evocation = """
Les cinq autres tapisseries de la tenture illustrent les cinq sens : le goût, l'ouïe, \
la vue, l'odorat et le toucher. Celle-ci, la plus grande, reste une énigme. Selon une \
lecture répandue, la dame dépose son collier dans le coffret : elle renoncerait aux \
plaisirs des sens, maîtrisés par le libre arbitre. D'autres historiens pensent au \
contraire qu'elle s'en saisit et voient dans la scène un sixième sens, celui du cœur, \
qui gouverne les cinq autres. La devise elle-même se prête aux deux sens, amour \
courtois ou désir spirituel. Le lion et la licorne, porteurs des armoiries, rappellent \
la noblesse et la pureté ; le jardin clos fleuri évoque le paradis. L'œuvre résume la \
culture raffinée de la fin du Moyen Âge, entre dévotion et art de vivre \
aristocratique."""
histoire = """
Les armoiries, de gueules à la bande d'azur chargée de trois croissants d'argent, sont \
celles des Le Viste, famille de juristes lyonnais montée à Paris ; on hésite entre \
Jean Le Viste, mort en 1500, et un de ses parents comme commanditaire. Les cartons \
sont attribués à un peintre parisien, souvent nommé le Maître d'Anne de Bretagne, et \
le tissage à un atelier des Pays-Bas du Sud. Au XIXᵉ siècle, les six pièces se \
trouvent au château de Boussac, dans la Creuse, où l'inspecteur des monuments \
historiques Prosper Mérimée les remarque en 1841 et s'alarme de leur état. George Sand \
les fait connaître dans ses écrits. L'État les achète en 1882 pour le musée de Cluny, \
où elles sont présentées dans une salle ronde qui leur est consacrée."""
facture = """
La tapisserie est tissée en laine, avec quelques rehauts de soie, sur une chaîne de \
laine : le licier reproduit point par point un carton peint grandeur nature. Le fond \
dit « millefleurs », semé de plantes et d'animaux répartis régulièrement, est typique \
de la fin du XVᵉ siècle. Les couleurs, peu nombreuses, viennent de teintures \
végétales : la garance pour le rouge, la guède pour le bleu, la gaude pour le jaune. \
Les figures sont disposées comme sur une scène, sans ombre, pour rester lisibles de \
loin sur un mur de château."""
details = [
  "Les lettres « À mon seul désir » sur le lambrequin de la tente.",
  "Les trois croissants d'argent des Le Viste sur les deux étendards.",
  "Le petit chien blanc assis sur un coussin, à gauche de la dame.",
  "Un petit singe accroupi au pied de la dame, sur l'île fleurie.",
  "Les lapins qui se cachent un peu partout dans le fond rouge.",
]
themes = ["tapisserie", "licorne", "désir", "millefleurs", "cinq sens"]
anecdote = """
Les tapisseries ont gagné un public inattendu : dans les films Harry Potter, les murs \
de la salle commune de Gryffondor sont tendus de reproductions de la Dame à la \
licorne, dont les fonds rouges s'accordent aux couleurs de la maison."""
salle = 1
mur = "ouest"
place = 1
largeur = 4.5

[[oeuvres]]
titre = "Maestà di Santa Trinita"
artiste = "Cimabue"
annee = "vers 1280–1290"
image = "maesta-santa-trinita.jpg"
technique = "Tempera et or sur panneau, 385 × 223 cm"
collection = "Galerie des Offices, Florence"
note = "La Vierge en majesté sur un trône immense, entourée de huit anges : le grand retable de Cimabue pour l'église Santa Trinita."
description = """
Sur un fond d'or, sous un pignon pointu, la Vierge est assise sur un trône monumental \
de bois doré, incrusté et ajouré comme une architecture. Elle porte l'Enfant sur son \
genou gauche et le désigne de la main droite. Jésus, vêtu comme un petit adulte, bénit \
et tient un rouleau. Huit anges, quatre de chaque côté, sont étagés les uns au-dessus \
des autres le long du trône, leurs ailes multicolores formant comme des rideaux. Sous \
le trône s'ouvrent trois arcades : on y voit quatre prophètes à mi-corps, deux sur les \
côtés qui lèvent les yeux, deux au centre, dont un roi couronné, chacun tenant un \
phylactère. Le manteau bleu de Marie est strié de fins rehauts d'or."""
evocation = """
L'image suit le modèle byzantin de la Vierge Hodigitria, « celle qui montre le \
chemin » : Marie présente son fils comme la voie du salut. Les prophètes de l'Ancien \
Testament, placés sous le trône, sont les fondations sur lesquelles repose la venue du \
Christ ; on les identifie à Jérémie, Abraham, David et Isaïe, dont les rouleaux \
portent des versets annonçant l'Incarnation. L'or du fond ne représente aucun lieu : \
c'est la lumière divine. Mais Cimabue commence à donner aux figures une présence \
nouvelle, des visages plus doux, un trône qui s'enfonce dans l'espace. Les historiens \
y voient un moment de passage, où la peinture italienne hérite encore de l'icône tout \
en préparant la révolution de Giotto, son élève selon la tradition."""
histoire = """
Le panneau a été peint pour le maître-autel de l'église Santa Trinita, à Florence, \
desservie par les moines de Vallombreuse. Sa date reste discutée, entre les années \
1280 et 1290. Au XVᵉ siècle, le goût ayant changé, il est remplacé sur l'autel par un \
retable d'Alesso Baldovinetti et relégué dans une chapelle, puis dans les bâtiments du \
couvent. Il entre dans les collections publiques florentines au XIXᵉ siècle et rejoint \
la Galerie des Offices en 1919. Il y est aujourd'hui exposé dans la même salle que les \
Vierges en majesté de Duccio et de Giotto, un rapprochement devenu une leçon \
d'histoire de l'art : trois manières de peindre le même sujet, en une trentaine \
d'années."""
facture = """
Cimabue peint à la tempera, pigments liés au jaune d'œuf, sur un panneau de bois \
couvert de plâtre et de colle. L'or est posé en feuilles sur un bol rouge puis bruni, \
et les auréoles sont gravées de petits poinçons. Les plis des vêtements sont tracés \
par des lignes d'or parallèles, une technique byzantine appelée chrysographie. Le \
trône, vu en légère perspective, crée un espace encore incertain, mais les visages \
sont modelés par des ombres verdâtres sous les carnations, selon la pratique de \
l'époque."""
details = [
  "Les ailes des anges, aux plumes colorées en écailles du blanc au rouge.",
  "Les fins traits d'or qui strient le manteau bleu de la Vierge.",
  "Le roi David couronné, au centre sous le trône, à côté d'Abraham.",
  "Les deux prophètes latéraux qui lèvent la tête vers la Vierge.",
]
themes = ["vierge en majesté", "fond d'or", "anges", "prophètes", "byzantin"]
anecdote = """
En 2019, un petit panneau de Cimabue, le Christ moqué, a été découvert dans la cuisine \
d'une maison de Compiègne, où il passait pour une icône sans valeur. Vendu aux \
enchères à Senlis, il a atteint 24 millions d'euros."""
salle = 2
mur = "ouest"
place = 4
largeur = 2.23

[[oeuvres]]
titre = "Maestà di Ognissanti"
artiste = "Giotto"
annee = "vers 1306–1310"
image = "maesta-ognissanti.jpg"
technique = "Tempera et or sur panneau, 325 × 204 cm"
collection = "Galerie des Offices, Florence"
note = "Une Vierge qui pèse enfin sur son trône : le grand retable de Giotto pour l'église d'Ognissanti, à Florence."
description = """
Sous un pignon au fond d'or, la Vierge trône dans un tabernacle gothique de marbre \
blanc, avec pinacles, gâbles et arc trilobé. Massive, enveloppée d'un manteau bleu \
sombre presque noir sur une robe blanche, elle tient l'Enfant assis sur son genou. Le \
petit Jésus, en robe rose, bénit de la main droite et tient un rouleau. De part et \
d'autre du trône se pressent des saints et des anges, vus de profil, les plus \
lointains cachés en partie par les montants. Au premier plan, deux anges agenouillés \
offrent des vases de fleurs, lys et roses ; derrière eux, deux autres présentent une \
couronne et un coffret. Le trône repose sur des marches de marbre veiné."""
evocation = """
Avec Giotto, la Vierge cesse d'être une image sacrée suspendue dans l'or pour devenir \
une présence physique : on sent ses genoux sous le manteau, le poids de son corps sur \
le siège, et l'Enfant a la carrure d'un vrai bébé. Les anges et les saints, qui \
regardent la scène, mettent le spectateur dans la même position qu'eux. Les fleurs \
offertes ont un sens précis : les lys évoquent la pureté de Marie, les roses son amour \
et la Passion à venir. On a souvent lu ce panneau comme l'acte de naissance de la \
peinture occidentale moderne, fondée sur l'observation du réel. Il reste pourtant une \
image de culte, tournée vers le fidèle, et l'or y garde toute sa valeur."""
histoire = """
Giotto peint ce retable vers 1306–1310 pour l'église florentine d'Ognissanti, qui \
appartenait alors à l'ordre religieux des Humiliés. Il vient de terminer les fresques \
de la chapelle des Scrovegni à Padoue et c'est l'artiste le plus réputé d'Italie. Le \
panneau, placé sur l'autel principal de l'église, est cité avec admiration au XVᵉ \
siècle par le sculpteur Lorenzo Ghiberti dans ses Commentaires. Au XIXᵉ siècle, il \
passe dans les collections de l'Académie de Florence, puis entre en 1919 à la Galerie \
des Offices. Il est exposé à côté des grandes Vierges en majesté de Cimabue et de \
Duccio, ce qui permet de mesurer d'un regard tout ce qui a changé en quelques \
décennies."""
facture = """
Giotto travaille à la tempera sur un fond d'or, comme ses prédécesseurs, mais il \
abandonne les traits d'or byzantins des drapés au profit d'un modelé continu, par \
dégradés d'ombre et de lumière. Le trône est construit avec une perspective \
cohérente : on voit ses côtés en profondeur, à travers les ouvertures. Les figures se \
recouvrent partiellement, ce qui crée des plans successifs. La gamme est sobre, \
dominée par le bleu sombre du manteau et le blanc de la robe, et la lumière semble \
venir d'une source unique."""
details = [
  "La bouche entrouverte de la Vierge, qui laisse voir ses dents.",
  "La transparence du voile blanc posé sur sa poitrine.",
  "Les vases de lys et de roses tenus par les anges agenouillés.",
  "Les visages des saints aperçus à travers les ajours du trône gothique.",
]
themes = ["vierge en majesté", "volume", "réalisme", "fond d'or", "anges"]
anecdote = """
Dante a consacré deux vers à la gloire de Giotto dans le Purgatoire : Cimabue crut \
tenir le premier rang en peinture, écrit-il, et maintenant c'est Giotto qui a la \
renommée, si bien que celle de son maître s'obscurcit."""
salle = 2
mur = "est"
place = 4
largeur = 2.04

[[oeuvres]]
titre = "Vierge à l'Enfant entourée d'anges (Diptyque de Melun)"
artiste = "Jean Fouquet"
annee = "vers 1450–1455"
image = "vierge-de-melun.jpg"
technique = "Huile sur panneau de chêne, 92 × 83,5 cm"
collection = "Musée royal des Beaux-Arts (KMSKA), Anvers"
note = "Le volet droit du diptyque commandé par Étienne Chevalier, trésorier de Charles VII : une Vierge-reine d'une étrange pâleur."
description = """
La Vierge, assise sur un trône orné de perles et de pierres précieuses, occupe presque \
toute la hauteur du panneau. Elle porte une haute couronne d'or et de perles et un \
grand manteau doublé d'hermine, ouvert sur un corsage bleu-gris délacé d'où sort un \
sein rond et blanc. Ses yeux sont baissés. Sur son genou, l'Enfant, nu et potelé, \
regarde vers la gauche, l'air grave. Tout autour, les anges remplissent l'espace : des \
séraphins rouge vif et des chérubins bleus, aux corps lisses comme des statues de \
cire, serrés les uns contre les autres. Le teint de la Vierge et de l'Enfant est d'une \
blancheur de porcelaine, sans aucune ombre colorée."""
evocation = """
Le contraste violent entre la pâleur des figures saintes et le rouge et le bleu \
saturés des anges donne au tableau son caractère irréel, presque moderne. Les \
séraphins rouges, brûlant d'amour divin, et les chérubins bleus, qui symbolisent la \
connaissance, forment une cour céleste. Marie y apparaît en reine de cour, à la mode \
du temps : front épilé, taille haute, corsage lacé. Une tradition attestée depuis le \
XVIIᵉ siècle veut qu'elle ait les traits d'Agnès Sorel, favorite de Charles VII, morte \
en 1450, dont Étienne Chevalier fut l'exécuteur testamentaire. Rien ne le prouve, mais \
cette idée a nourri l'image d'une œuvre où le sacré et la beauté profane se mêlent de \
façon troublante."""
histoire = """
Étienne Chevalier, trésorier de France sous Charles VII, commande ce diptyque pour la \
collégiale Notre-Dame de Melun, sa ville natale, où son épouse Catherine Budé est \
enterrée en 1452. Sur le volet gauche, il est représenté à genoux, présenté par son \
saint patron, saint Étienne ; sur celui-ci, il prie la Vierge. Le diptyque reste à \
Melun jusqu'à la fin du XVIIIᵉ siècle, quand le chapitre le vend. Les deux panneaux \
sont alors séparés. Celui-ci rejoint la collection du bourgmestre d'Anvers Florent van \
Ertborn, léguée à sa mort, en 1840, au musée d'Anvers. Le volet d'Étienne Chevalier, \
lui, est conservé à la Gemäldegalerie de Berlin."""
facture = """
Fouquet peint à l'huile, technique venue des Pays-Bas, avec une précision de \
miniaturiste : perles, pierres taillées, fourrure d'hermine et lacets sont rendus un à \
un. Mais il simplifie les volumes jusqu'à la géométrie : la tête de la Vierge est un \
ovale, son sein une sphère, les angelots des formes lisses comme du bois tourné. Cette \
alliance de détail flamand et de clarté monumentale, apprise peut-être en Italie, est \
la marque de Fouquet. Les trois couleurs, blanc, rouge et bleu, sont posées presque \
sans transition."""
details = [
  "Les perles et les pierres taillées du trône et de la couronne.",
  "Le lacet doré du corsage, défait sur la poitrine.",
  "Les séraphins rouges et les chérubins bleus, sans un pli de vêtement.",
  "Le voile transparent qui descend de la couronne derrière la tête.",
]
themes = ["vierge à l'enfant", "anges", "cour de france", "portrait", "couleur"]
anecdote = """
Le cadre d'origine du diptyque était orné de médaillons émaillés. L'un d'eux, un \
autoportrait de Fouquet en émail peint sur cuivre, est aujourd'hui au Louvre : c'est \
l'un des plus anciens autoportraits isolés de l'art occidental."""
salle = 3
mur = "sud"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Les Très Riches Heures du duc de Berry : Janvier"
artiste = "Frères de Limbourg"
annee = "vers 1411–1416"
image = "tres-riches-heures-janvier.jpg"
technique = "Enluminure sur parchemin, feuillet d'environ 29 × 21 cm"
collection = "Musée Condé, Chantilly"
note = "Le duc Jean de Berry reçoit à sa table pour les étrennes : la page de janvier du plus célèbre manuscrit enluminé du monde."
description = """
Dans une grande salle tendue d'une tapisserie de bataille, le duc Jean de Berry est \
assis à droite, de profil, vêtu de bleu et coiffé d'un bonnet de fourrure. Derrière \
lui, un grand pare-feu d'osier rond forme comme une auréole. Devant lui, une table \
couverte d'une nappe blanche porte des plats, des petits chiens et une grande salière \
d'or en forme de navire. Un ecclésiastique en rouge est assis à ses côtés. Une foule \
de courtisans, valets, échansons et écuyers tranchants s'affaire. Au-dessus de la \
scène, un officier invite les visiteurs : on lit les mots « Aproche, aproche ». En \
haut, un demi-cercle bleu étoilé montre le char du soleil et les signes du Capricorne \
et du Verseau."""
evocation = """
La page célèbre le premier mois de l'année, temps des étrennes, ces cadeaux que l'on \
échangeait à la cour, et le duc y apparaît en prince généreux et magnifique. Tout dit \
le luxe : vaisselle d'or, tissus brodés de fleurs de lys et de cygnes blessés, emblème \
du duc, petits chiens familiers jusque sur la table. On y a vu le portrait d'une cour \
française juste avant les désastres de la guerre de Cent Ans, Azincourt en 1415. Le \
calendrier astronomique du haut rappelle que la vie humaine s'inscrit dans l'ordre du \
cosmos et du temps. Les Très Riches Heures sont aussi un livre de prières : la beauté \
terrestre y prépare à la dévotion."""
histoire = """
Jean de Berry, frère du roi Charles V et grand collectionneur, commande vers 1411 ce \
livre d'heures aux trois frères de Limbourg, Paul, Jean et Herman. En 1416, le duc et \
les trois peintres meurent la même année, sans doute de la peste, laissant l'ouvrage \
inachevé. Il est complété vers 1440 par un peintre anonyme, que l'on identifie souvent \
à Barthélemy d'Eyck, puis vers 1485–1489 par Jean Colombe pour le duc Charles Ier de \
Savoie. Au XIXᵉ siècle, le duc d'Aumale, fils de Louis-Philippe, l'achète en Italie en \
1856 et le place dans sa bibliothèque de Chantilly, qu'il donne en 1884 à l'Institut \
de France avec le château et toutes ses collections."""
facture = """
Les pigments sont posés à la gomme sur le parchemin, au pinceau très fin. Le bleu \
intense vient du lapis-lazuli, pierre importée d'Afghanistan et plus coûteuse que \
l'or ; l'or, en feuille ou en poudre, rehausse les vaisselles et les broderies. Les \
Limbourg superposent les plans comme dans un décor de théâtre : table, convives, \
tapisserie, qui s'ouvre elle-même sur une bataille. La précision des visages et des \
étoffes, à l'échelle de quelques millimètres, rapproche ces pages de la peinture de \
chevalet."""
details = [
  "Les mots « Aproche, aproche » écrits en lettres d'or au-dessus du chambellan.",
  "La salière d'or en forme de navire, sur la table, à droite du duc.",
  "Les petits chiens qui se promènent sur la nappe, près du duc.",
