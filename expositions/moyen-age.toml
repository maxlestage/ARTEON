# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « MOYEN ÂGE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/moyen-age/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /moyen-age.
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 10
nom_court = "Moyen Âge"
mouvement = "Art médiéval et gothique"
couleur = "#2e4a8c"
titre = "Le Moyen Âge, l'or et la lumière"
artiste = "Cimabue, Duccio, Giotto, Roublev, les Limbourg, Fouquet…"
dates = "vers 1280–1500"
accroche = "Exposition virtuelle · Musée de Cluny, Paris"
introduction = """
Fonds d'or, icônes, retables et enluminures : de la fin du XIIIᵉ siècle à 1500, \
la peinture apprend à donner du poids aux corps et de la profondeur à l'espace sans \
renoncer à la splendeur du sacré. La visite réunit les trois grandes Vierges en \
majesté de Cimabue, Duccio et Giotto, l'Annonciation siennoise de Simone Martini, la \
Trinité d'Andreï Roublev, Fra Angelico, les frères de Limbourg, Jean Fouquet et \
Enguerrand Quarton. Le bâtiment s'inspire du musée de Cluny, à Paris, logé dans un \
hôtel gothique avec sa chapelle, et dessine une église : un narthex où attend la \
Dame à la licorne, une haute nef, deux chapelles latérales et une abside."""
vitrine = "trinite-roublev.jpg"

