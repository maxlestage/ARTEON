# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « VERMEER ET REMBRANDT » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + ses images, dans le
#  dossier public/tableaux/<nom>/ (ici public/tableaux/vermeer-rembrandt/). Le
#  nom du fichier donne l'adresse de l'exposition sur le site : /vermeer-rembrandt.
#
#  Une exposition à deux peintres : chaque œuvre précise son « artiste » (sinon,
#  c'est celui de la section [exposition]).
#
#  Le mode d'emploi complet (salles, murs, places, largeurs) est en tête du
#  fichier expositions/van-gogh.toml et sur la page « Ajouter une œuvre ».
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 7
nom_court = "Vermeer & Rembrandt"
couleur = "#7a5a2e"
titre = "Vermeer et Rembrandt, le siècle d'or hollandais"
artiste = "Vermeer et Rembrandt"
dates = "XVIIᵉ siècle"
accroche = "Exposition virtuelle · Vermeer et Rembrandt"
introduction = """
Deux géants de la peinture hollandaise du XVIIᵉ siècle : Rembrandt et son \
clair-obscur dramatique, Vermeer et sa lumière tranquille qui entre par la \
fenêtre. Dix toiles, de la Leçon d'anatomie à la Jeune Fille à la perle, jusqu'à \
la Ronde de nuit au fond de la galerie."""
vitrine = "jeune-fille-perle.jpg"

# ─── Les salles, dans l'ordre de la visite ───────────────────────────────────

[[salles]]
nom = "Salle I · Rembrandt, le clair-obscur"
theme = "1632–1668 : des visages qui surgissent de l'ombre, du portrait de groupe aux derniers autoportraits."
murs = "#e4ddd2"

[[salles]]
nom = "Salle II · Vermeer, la lumière de Delft"
theme = "Vers 1658–1668 : des intérieurs silencieux, une lumière douce venue de la gauche."
murs = "#e3e6e8"

[[salles]]
nom = "Salle III · La Ronde de nuit"
theme = "1642 : la compagnie du capitaine Banninck Cocq, l'immense toile du Rijksmuseum."
murs = "#ddd2c9"

# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "La Leçon d'anatomie du docteur Tulp"
artiste = "Rembrandt"
