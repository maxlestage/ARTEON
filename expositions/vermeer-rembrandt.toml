# ─── Les œuvres ──────────────────────────────────────────────────────────────

[[oeuvres]]
titre = "La Leçon d'anatomie du docteur Tulp"
artiste = "Rembrandt"
annee = "1632"
image = "lecon-anatomie.jpg"
technique = "Huile sur toile, 169,5 × 216,5 cm"
collection = "Mauritshuis, La Haye"
note = "Rembrandt a 26 ans : sa première grande commande, un portrait de groupe saisi en pleine dissection."
description = """
Dans une salle sombre, le cadavre d'un homme repose en diagonale sur une table, le \
corps livide, le bas-ventre couvert d'un linge. À droite, assis, le docteur Nicolaes \
Tulp, chapeau noir à large bord et col blanc, saisit avec une pince les muscles de \
l'avant-bras gauche, déjà disséqué, tandis que sa main gauche, levée, mime le \
mouvement des doigts qui se replient. Sept chirurgiens en noir, le cou serré dans une \
fraise ou un col blanc, se pressent autour de lui en pyramide : certains se penchent \
vers le bras, l'un regarde vers nous, d'autres fixent le grand livre ouvert aux pieds \
du mort. Celui du fond tient une feuille où sont inscrits les noms des participants. \
La lumière tombe sur le cadavre et sur les visages, et laisse le reste dans l'ombre."""
evocation = """
Le tableau tient à la fois du portrait collectif et de la leçon de morale. Chaque \
chirurgien payait pour figurer dans l'œuvre et voulait être reconnaissable, mais \
Rembrandt fait de leur réunion un moment d'attention partagée : on y a vu le triomphe \
d'un savoir fondé sur l'observation, à l'époque où Amsterdam devient un grand centre \
scientifique. Le geste de Tulp, qui montre comment fonctionne la main humaine, a été \
lu comme un hommage à l'ingéniosité du Créateur, idée chère aux anatomistes du temps. \
En face, le corps du supplicié rappelle que la mort attend chacun : la dissection \
publique était aussi une méditation sur la fragilité de la vie. Le jeune peintre y \
affirme son ambition : rivaliser avec les maîtres du portrait de groupe en y \
introduisant le drame."""
histoire = """
La dissection publique eut lieu à Amsterdam en janvier 1632, sur le corps d'Aris \
Kindt, un voleur qui venait d'être pendu. La guilde des chirurgiens faisait \
régulièrement peindre des portraits de groupe pour orner sa salle ; Tulp, chargé des \
leçons d'anatomie de la ville, choisit le jeune Rembrandt, arrivé de Leyde depuis peu. \
Le tableau lança sa carrière à Amsterdam et lui valut de nombreuses commandes de \
portraits. Il resta accroché chez les chirurgiens pendant près de deux siècles. En \
1828, la caisse des veuves des chirurgiens voulut le vendre pour renflouer ses fonds ; \
le roi Guillaume Ier s'en porta acquéreur pour le Mauritshuis de La Haye, où il est \
exposé depuis."""
facture = """
Rembrandt rompt avec les rangées de têtes alignées des portraits de groupe \
antérieurs : les visages s'étagent en pyramide et convergent vers le bras disséqué et \
la main de Tulp. La lumière, venue de la gauche, sculpte les visages et fait du \
cadavre la tache la plus claire du tableau, selon un clair-obscur hérité de la \
peinture caravagesque. Les noirs des vêtements sont nuancés, les cols et les fraises \
peints avec précision ; la chair du mort, d'un blanc verdâtre, contraste avec le teint \
rosé des vivants."""
details = [
  "La main gauche levée de Tulp, qui imite le mouvement des doigts qu'il explique.",
  "La feuille tenue par le chirurgien du fond, avec la liste des noms des présents.",
  "Le grand livre ouvert aux pieds du cadavre, sans doute un traité d'anatomie.",
  "Le chapeau de Tulp, seul couvre-chef du tableau, signe de son rang.",
  "Le contraste entre la peau verdâtre du mort et les visages rosés des vivants.",
]
themes = ["science", "médecine", "mort", "portrait de groupe", "corps"]
anecdote = """
Nicolaes Tulp s'appelait à l'origine Claes Pieterszoon. Il adopta le nom de Tulp, \
« tulipe » en néerlandais, d'après l'enseigne en forme de tulipe de la maison où il \
habitait, et fit de cette fleur son emblème."""
salle = 1
mur = "est"
position = 7
largeur = 2.2

[[oeuvres]]
titre = "Autoportrait"
artiste = "Rembrandt"
annee = "1659"
image = "autoportrait-rembrandt.jpg"
technique = "Huile sur toile, 84,5 × 66 cm"
collection = "National Gallery of Art, Washington"
note = "Ruiné, à 53 ans, Rembrandt se peint sans complaisance : un visage marqué, éclairé dans l'ombre."
description = """
Rembrandt se représente à mi-corps, de trois quarts, le regard tourné vers nous. Il \
porte un béret sombre et un manteau brun aux tons chauds, dont les plis se perdent \
dans l'obscurité du fond. Ses mains, jointes devant lui, sont à peine indiquées et \
restent dans la pénombre. Toute la lumière se concentre sur le visage : un front ridé, \
des poches sous les yeux, des joues lourdes, une peau marquée par l'âge. Des mèches de \
cheveux gris et bouclés dépassent du béret. Aucun accessoire, aucun décor, pas même un \
pinceau ou une palette pour rappeler son métier : rien ne distrait du visage et du \
regard, à la fois las et attentif, qui semble interroger le spectateur autant que le \
peintre lui-même."""
evocation = """
Peint au lendemain de sa faillite, ce portrait est souvent lu comme un examen de \
conscience : un homme qui a tout perdu, sauf son art, et se regarde en face. Rembrandt \
est le peintre qui s'est le plus représenté avant l'époque moderne, une quarantaine de \
fois en peinture, sans compter les gravures et les dessins ; mis bout à bout, ces \
autoportraits forment une sorte d'autobiographie, du jeune homme ambitieux au \
vieillard. Ici, plus de costume de fantaisie ni de pose avantageuse : la vérité de la \
chair vieillissante devient le sujet. Des historiens rappellent que ces tableaux \
étaient aussi recherchés par les amateurs, et pas seulement des confessions intimes ; \
mais la gravité de ce regard en a fait l'image même de l'artiste face à lui-même."""
histoire = """
En 1656, accablé de dettes après l'achat de sa grande maison de la Jodenbreestraat et \
des années d'acquisitions de tableaux et d'objets de collection, Rembrandt obtient une \
cession de biens, forme de faillite qui lui évite la prison pour dettes. Ses \
collections sont dispersées aux enchères en 1657 et 1658, la maison est vendue, et il \
s'installe dans un quartier plus modeste. C'est dans ces années difficiles qu'il peint \
cet autoportrait, signé et daté 1659. Il continue pourtant de travailler et de \
recevoir des commandes prestigieuses, comme Les Syndics des drapiers en 1662. Le \
tableau fut acquis au XXᵉ siècle par le financier américain Andrew W. Mellon, qui \
l'offrit en 1937 à la National Gallery of Art de Washington, dont sa collection forma \
le noyau."""
facture = """
La touche change selon les zones : le visage est construit en couches épaisses, posées \
et reprises, où la pâte accroche la lumière comme le relief de la peau ; les vêtements \
et les mains sont brossés plus largement, presque laissés à l'état d'ébauche. \
Rembrandt limite sa palette aux bruns, aux ocres et aux noirs chauds, avec quelques \
rouges dans les chairs. L'éclairage latéral laisse une partie du visage dans une ombre \
transparente. Ce contraste entre le visage très travaillé et la liberté du reste \
dirige le regard du spectateur droit vers les yeux."""
details = [
  "Les rides du front, rendues par l'épaisseur même de la peinture.",
  "Les mains jointes, à peine esquissées dans l'ombre du bas du tableau.",
  "Les mèches grises qui s'échappent du béret, de chaque côté du visage.",
  "Le manteau brossé à grands traits, qui se fond dans le fond sombre.",
]
themes = ["autoportrait", "vieillesse", "introspection", "ruine"]
anecdote = """
L'inventaire dressé lors de sa faillite, en 1656, révèle chez Rembrandt une collection \
étonnante : tableaux de maîtres italiens et flamands, albums de gravures, bustes \
antiques, armes, coquillages, objets venus des Indes… Tout fut vendu aux enchères."""
salle = 1
mur = "est"
position = -11
largeur = 0.85

[[oeuvres]]
titre = "Bethsabée au bain"
artiste = "Rembrandt"
annee = "1654"
image = "bethsabee.jpg"
technique = "Huile sur toile, 142 × 142 cm"
collection = "Musée du Louvre, Paris"
note = "Bethsabée tient la lettre du roi David : un nu pensif, peint d'après sa compagne Hendrickje."
description = """
Une jeune femme nue, grandeur nature, est assise sur un lit couvert d'étoffes, le \
corps presque de face, la tête inclinée de côté, le regard perdu vers le bas. Dans sa \
main droite, posée sur sa cuisse, elle tient une lettre ouverte. À ses pieds, une \
vieille servante vêtue de sombre, la tête couverte, s'occupe de lui laver ou de lui \
sécher les pieds. Le fond est presque noir ; sous la jeune femme, un drap blanc \
froissé, et derrière elle un brocart doré composent un décor somptueux. Quelques \
bijoux, un bracelet et des ornements dans les cheveux, soulignent sa nudité. Le corps, \
très lumineux, occupe le centre du tableau carré, et rien ne vient troubler le \
face-à-face entre la femme et ses pensées."""
evocation = """
Le récit vient du deuxième livre de Samuel : de la terrasse de son palais, le roi \
David aperçoit Bethsabée au bain, la fait venir et la séduit ; elle tombe enceinte, et \
David envoie son mari Urie mourir au combat. La Bible ne parle pas de lettre : \
Rembrandt l'ajoute pour condenser le drame en un seul instant. Là où d'autres peintres \
montraient une baigneuse épiée, il montre une femme qui réfléchit à ce qu'on exige \
d'elle, partagée entre l'obéissance au roi et la fidélité à son époux. On a vu dans sa \
mélancolie le pressentiment des malheurs à venir. Le corps peint n'a rien d'idéalisé : \
c'est celui d'une femme réelle, avec son ventre, ses plis, sa chair."""
histoire = """
Signé et daté 1654, le tableau appartient à une année difficile pour Rembrandt et sa \
compagne Hendrickje Stoffels. Enceinte, elle est convoquée par le conseil de l'Église \
réformée, réprimandée pour vivre avec le peintre hors mariage et privée de communion ; \
leur fille Cornelia naît à l'automne. Veuf de Saskia, Rembrandt ne pouvait se remarier \
sans perdre la jouissance de l'héritage de sa première femme, réservé à leur fils \
Titus. On ignore pour qui le tableau fut peint. Après être passé par diverses \
collections, il fut acquis par le médecin et collectionneur parisien Louis La Caze, \
qui le légua au Louvre en 1869 avec plus de cinq cents tableaux."""
facture = """
Rembrandt construit le corps par la lumière plutôt que par le dessin : une pâte chaude \
et crémeuse, posée en couches souples, modèle les volumes sans contour net. Les \
étoffes sont traitées avec une grande liberté, à larges coups de brosse, avec des \
épaisseurs dorées pour le brocart. La pose de Bethsabée reprend, a-t-on montré, des \
figures antiques connues par des gravures, que le peintre transforme en scène intime. \
La servante, dans l'ombre, fait contrepoint au corps éclairé, et les figures grandeur \
nature donnent à la scène une présence presque monumentale."""
details = [
  "La lettre du roi David, tenue mollement dans la main droite de Bethsabée.",
  "Le visage incliné, les yeux baissés, absorbé dans ses pensées.",
  "La vieille servante, dans l'ombre, penchée sur les pieds de sa maîtresse.",
  "Le brocart doré derrière la jeune femme, peint en touches épaisses.",
  "Le drap blanc froissé, la zone la plus claire après le corps.",
]
themes = ["bible", "nu", "désir", "mélancolie", "dilemme"]
anecdote = """
Des médecins ont cru reconnaître, dans une ombre du sein gauche de Bethsabée, les \
signes d'une tumeur, et ont supposé que le modèle en était atteint. L'hypothèse, \
invérifiable, a fait couler beaucoup d'encre et reste un exemple célèbre de diagnostic \
porté sur une peinture."""
salle = 1
mur = "ouest"
position = -7
largeur = 1.4

[[oeuvres]]
titre = "Le Retour du fils prodigue"
artiste = "Rembrandt"
annee = "vers 1668"
image = "fils-prodigue.jpg"
technique = "Huile sur toile, 262 × 205 cm"
collection = "Musée de l'Ermitage, Saint-Pétersbourg"
note = "Le père pose ses mains sur les épaules du fils agenouillé : l'une des dernières toiles, et des plus bouleversantes."
description = """
Dans une pénombre dorée, un vieillard aux yeux mi-clos, vêtu d'un ample manteau rouge, \
se penche sur un jeune homme agenouillé contre lui et pose ses deux mains sur son dos. \
Le fils, vu de dos, a le crâne rasé et des vêtements en lambeaux d'un jaune terreux ; \
il a perdu une sandale, et la plante de son pied nu, sale et calleuse, se tourne vers \
nous. Il appuie sa tête contre la poitrine de son père. À droite, debout, un homme \
barbu, drapé de rouge lui aussi, observe la scène, raide, les mains posées sur un \
bâton : on l'identifie au frère aîné. D'autres figures restent en retrait, dont un \
homme assis qui regarde, et des silhouettes à peine visibles dans l'ombre du fond."""
evocation = """
La parabole, dans l'Évangile de Luc, raconte le fils cadet qui réclame sa part \
d'héritage, la dilapide, puis revient misérable chez son père, qui l'accueille avec \
joie, au grand dépit du frère aîné resté fidèle. Rembrandt ne peint ni la fête ni la \
déchéance du fils, mais l'instant du pardon, silencieux et sans condition. Les mains \
du père en sont le cœur : on a souvent remarqué qu'elles semblent différentes, l'une \
large et masculine, l'autre plus fine, et l'on y a vu l'union d'une tendresse \
paternelle et maternelle. L'écart entre le groupe enlacé et le frère qui se tient à \
distance pose la question de la jalousie et de la justice. Peint à la fin d'une vie \
marquée par les deuils, le tableau a été lu comme le testament spirituel de Rembrandt."""
histoire = """
La date du tableau est incertaine : on le situe généralement dans les dernières années \
de Rembrandt, mort en 1669, un an après son fils Titus. Certains historiens pensent \
que des parties secondaires, notamment des figures de l'arrière-plan, ont pu être \
achevées par un autre peintre. On ignore pour qui il fut peint et quel fut son \
parcours au cours du siècle suivant. En 1766, il fut acheté à Paris pour l'impératrice \
Catherine II de Russie, qui rassemblait alors à Saint-Pétersbourg les collections de \
l'Ermitage, l'un des grands musées d'Europe. Il y est conservé depuis, et compte parmi \
les œuvres les plus célèbres du musée."""
facture = """
Rembrandt peint ici avec une liberté extrême : la matière, épaisse et rugueuse sur les \
haillons du fils et le manteau du père, est posée à la brosse large, parfois reprise \
et grattée, tandis que le fond se dissout dans des glacis bruns et transparents. La \
gamme se réduit aux rouges, aux ocres et aux bruns, que la lumière fait rougeoyer. La \
composition est décentrée : le groupe du père et du fils occupe la gauche, la lumière \
la plus vive tombant sur leurs têtes et sur les mains, tandis que le frère aîné, \
éclairé lui aussi, lui fait face à droite. Les figures sont presque grandeur nature."""
details = [
  "Les deux mains du père, de forme différente, posées sur le dos du fils.",
  "Le pied nu du fils, sorti de sa sandale usée, à la plante sale.",
  "Le crâne rasé du fils, comme celui d'un prisonnier ou d'un mendiant.",
  "La courte épée encore pendue à sa ceinture, dernier signe de son rang.",
  "Le frère aîné, debout à droite, qui regarde sans s'approcher.",
]
themes = ["bible", "pardon", "famille", "paternité", "vieillesse"]
anecdote = """
Bouleversé par une affiche de ce tableau, le prêtre néerlandais Henri Nouwen alla le \
contempler longuement à l'Ermitage. Il en tira un livre de méditation, « Le Retour de \
l'enfant prodigue », publié en 1992 et traduit dans de nombreuses langues."""
salle = 1
mur = "ouest"
position = 11
largeur = 1.6

[[oeuvres]]
titre = "La Laitière"
artiste = "Johannes Vermeer"
annee = "vers 1658"
image = "laitiere.jpg"
technique = "Huile sur toile, 45,5 × 41 cm"
collection = "Rijksmuseum, Amsterdam"
note = "Une servante verse du lait, dans la lumière de la fenêtre : le pain semble saupoudré de points lumineux."
description = """
Dans un coin de cuisine éclairé par une fenêtre à gauche, une servante robuste, \
debout, verse lentement un mince filet de lait d'un pot de terre dans un récipient \
posé sur la table. Elle porte une coiffe blanche, un corsage jaune aux manches \
retroussées, une jupe rouge et un tablier bleu. Devant elle, sur une nappe bleu-vert, \
un panier et des morceaux de pain, et une cruche bleue. Le mur nu, blanchi à la chaux, \
porte un clou et des traces de trous ; un panier et un seau de cuivre sont suspendus \
près de la fenêtre, dont un carreau est cassé. Au sol, à droite, une chaufferette en \
bois, et une rangée de carreaux de Delft au pied du mur."""
evocation = """
Rien de spectaculaire : une servante absorbée par un geste quotidien. Mais Vermeer \
donne à ce geste une gravité presque solennelle, et la figure, solidement campée, a la \
présence d'une statue. Les historiens y voient l'éloge des vertus domestiques chères à \
la société hollandaise : l'ordre, la propreté, le travail patient. Ce sérieux n'allait \
pas de soi : dans la peinture et la littérature du temps, laitières et filles de \
cuisine étaient souvent l'objet de sous-entendus grivois. Un petit Cupidon peint sur \
un carreau, et la chaufferette, associée au désir dans les livres d'emblèmes, \
rappellent ce registre, que la dignité de la femme tient à distance. On a aussi \
supposé qu'elle préparait un pudding au pain, ce qui expliquerait le pain rassis sur \
la table."""
histoire = """
Le tableau date des premières années de maturité de Vermeer, vers 1658-1660, peu après \
qu'il eut abandonné les sujets religieux et mythologiques pour les scènes d'intérieur. \
Il appartint peut-être à son principal mécène, le Delftois Pieter van Ruijven. Il \
figurait en tout cas à la vente de la collection de Jacob Dissius, à Amsterdam, en \
1696, décrit comme une servante versant du lait, « extrêmement bien fait », et adjugé \
175 florins, l'un des prix les plus élevés de la vente. Au XIXᵉ siècle, il appartenait \
à la famille Six, à Amsterdam. En 1908, le Rijksmuseum l'acheta à leurs héritiers \
grâce à l'aide de l'État et de l'association Rembrandt."""
facture = """
Vermeer pose la lumière par petites touches : sur le pain, le panier et la cruche, des \
points de peinture claire, légèrement en relief, font scintiller les surfaces ; on \
parle de « pointillés ». Le bleu du tablier et de la nappe est de l'outremer naturel, \
tiré du lapis-lazuli, pigment très coûteux qu'il employait sans compter. L'examen du \
tableau a montré qu'il avait d'abord peint un objet accroché au mur et un panier à \
linge près de la chaufferette, puis les avait effacés pour dépouiller la scène. Le \
point de vue, légèrement en contre-plongée, grandit la servante."""
details = [
  "Les points lumineux sur la croûte du pain et sur l'osier du panier.",
  "Le mince filet de lait, presque immobile, qui coule du pot.",
  "Le clou planté dans le mur, avec son ombre minuscule.",
  "Le carreau cassé de la fenêtre, en haut à gauche.",
  "Les carreaux de Delft au bas du mur, dont l'un montre un petit Cupidon.",
]
themes = ["intérieur", "lumière", "travail", "quotidien", "servante"]
anecdote = """
Le Rijksmuseum ne prête qu'exceptionnellement La Laitière. En 2009, elle traversa \
pourtant l'Atlantique pour une exposition qui lui était entièrement consacrée au \
Metropolitan Museum de New York, autour des tableaux hollandais de la collection du \
musée."""
salle = 2
mur = "nord"
place = 1
largeur = 0.6

[[oeuvres]]
titre = "Vue de Delft"
artiste = "Johannes Vermeer"
annee = "vers 1660–1661"
image = "vue-delft.jpg"
technique = "Huile sur toile, 96,5 × 115,7 cm"
collection = "Mauritshuis, La Haye"
note = "Sa ville, vue de l'autre rive, sous un grand ciel : Proust la tenait pour le plus beau tableau du monde."
description = """
De l'autre côté d'une large étendue d'eau, la ville de Delft s'étire en une longue \
bande horizontale : remparts de brique, toits rouges et bleutés, et deux portes \
fortifiées, celle de Schiedam, à gauche, avec son horloge, et celle de Rotterdam, à \
droite, flanquée de deux tourelles. Derrière, la tour de la Nouvelle Église brille au \
soleil, tandis que les bâtiments du premier plan restent dans l'ombre d'un nuage. Des \
bateaux, dont deux grosses barques de pêche, sont amarrés à droite. Sur la rive \
sablonneuse du premier plan, à gauche, quelques petits personnages bavardent. \
Au-dessus, le ciel occupe plus de la moitié de la toile, avec de grands nuages blancs \
et gris qui s'étagent."""
evocation = """
Vermeer n'invente rien : on reconnaît chaque monument, et le tableau sert encore de \
document sur la Delft du XVIIᵉ siècle. Il a pourtant légèrement recomposé la vue pour \
équilibrer les masses, et c'est moins la topographie que la lumière qui en fait le \
sujet : un matin calme, sous un ciel changeant, où le soleil vient frapper le cœur de \
la ville. Certains ont vu dans la tour ensoleillée de la Nouvelle Église, où repose \
Guillaume d'Orange, un hommage discret à la maison d'Orange et à la fierté civique. \
Quelques années plus tôt, en 1654, l'explosion d'une poudrière avait dévasté une \
partie de Delft ; la sérénité de cette vue a été lue comme le portrait d'une cité \
apaisée, sûre d'elle-même."""
histoire = """
Vermeer peint sa ville natale vers 1660-1661 depuis la rive sud du port, probablement \
d'une fenêtre à l'étage d'une maison. Le tableau appartint sans doute à Pieter van \
Ruijven ; il figure en 1696 à la vente Dissius, à Amsterdam, où il atteint 200 \
florins, le prix le plus élevé des Vermeer de la vente. En 1822, le roi Guillaume Ier \
l'acquit aux enchères pour le Mauritshuis, qui venait d'ouvrir ses portes à La Haye. \
En 1921, il fut prêté à Paris pour une exposition de peinture hollandaise au Jeu de \
Paume : Proust, malade, s'y rendit pour le revoir, un an et demi avant sa mort. Le \
tableau n'a plus guère quitté La Haye depuis."""
facture = """
Vermeer travaille la matière autant que la couleur : les briques et les toits sont \
rendus par une pâte granuleuse, et de minuscules grains de peinture claire, posés en \
relief sur les coques des bateaux et les façades, accrochent la lumière comme des \
reflets réels. Les reflets dans l'eau sont allongés et simplifiés. Le jeu d'ombre et \
de lumière, avec les bâtiments proches dans l'ombre et les toits du fond éclairés, \
crée la profondeur. On s'est demandé s'il avait utilisé une chambre noire, \
l'instrument d'optique qui projette une image : la question reste discutée."""
details = [
  "Les toits ensoleillés à droite, où l'on cherche le « petit pan de mur jaune ».",
  "L'horloge de la porte de Schiedam, qui indique un peu plus de sept heures.",
  "La tour claire de la Nouvelle Église, baignée de soleil derrière les toits.",
  "Les petits personnages sur la rive sablonneuse, à gauche.",
  "Les grains de peinture en relief sur les coques des barques, à droite.",
]
themes = ["ville", "paysage", "ciel", "eau", "lumière"]
anecdote = """
Dans « La Prisonnière », Proust fait mourir l'écrivain Bergotte devant la Vue de \
Delft, alors qu'il contemple un « petit pan de mur jaune » qu'il n'avait jamais \
remarqué. Le romancier prêtait à son personnage le malaise qu'il avait lui-même \
ressenti à l'exposition de 1921."""
salle = 3
mur = "nord"
position = 0
largeur = 1.16

[[oeuvres]]
titre = "La Jeune Fille à la perle"
artiste = "Johannes Vermeer"
annee = "vers 1665"
image = "jeune-fille-perle.jpg"
technique = "Huile sur toile, 44,5 × 39 cm"
collection = "Mauritshuis, La Haye"
note = "Un turban bleu, une perle, un regard par-dessus l'épaule : un visage imaginaire devenu l'un des plus célèbres."
description = """
Sur un fond sombre et uni, une jeune fille se tourne vers nous par-dessus son épaule, \
comme si on venait de l'appeler. Elle porte un turban bleu outremer noué sur la tête, \
d'où retombe un pan d'étoffe jaune, et une veste jaune-brun d'où dépasse un col blanc. \
À son oreille pend une grosse perle, qui reflète la lumière et le blanc du col. Ses \
grands yeux fixent le spectateur ; ses lèvres entrouvertes et humides brillent de \
petites touches claires. La lumière vient de la gauche et modèle doucement le visage, \
sans contours marqués. Aucun décor, aucun objet : seulement un visage, un regard et \
une perle, saisis dans un mouvement suspendu."""
evocation = """
Ce n'est pas un portrait mais une « tronie », mot qui désignait alors une étude de \
tête, souvent costumée, que les amateurs achetaient pour sa beauté ou son expression, \
sans se soucier de l'identité du modèle. Le turban évoque l'Orient rêvé des Hollandais \
du XVIIᵉ siècle. On ignore qui a posé : la fille aînée du peintre, Maria, a été \
proposée, sans preuve. Ce mystère, joint à l'ambiguïté du regard, à la fois timide et \
direct, et à la bouche entrouverte, comme sur le point de parler, a nourri \
d'innombrables interprétations. On l'a surnommée « la Joconde du Nord » : comme le \
portrait de Léonard, elle semble nouer avec chaque spectateur une relation \
personnelle."""
histoire = """
Vermeer l'a peinte vers 1665, sans doute pour le marché plutôt que sur commande. On \
perd ensuite sa trace : on a pensé la reconnaître parmi les « tronies » de la vente \
Dissius de 1696, sans certitude. En 1881, en mauvais état, elle fut achetée lors d'une \
vente aux enchères à La Haye par le collectionneur Arnoldus Andries des Tombe, pour \
deux florins et trente cents. À sa mort en 1902, il la légua au Mauritshuis avec \
d'autres tableaux. Elle est depuis la vedette du musée. Le roman de Tracy Chevalier \
(1999) et le film qui en fut tiré en 2003, avec Scarlett Johansson, lui ont donné une \
célébrité mondiale."""
facture = """
Vermeer réduit sa palette à quelques couleurs : l'outremer naturel du turban, des \
jaunes, des ocres, du blanc de plomb. Les transitions sont très douces, presque sans \
contours, notamment sur l'arête du nez, qui se fond dans la joue. La perle elle-même \
est une illusion : quelques touches seulement, un reflet vif en haut et une lueur pâle \
en bas, sans même le crochet qui la tiendrait à l'oreille. Une étude scientifique \
menée par le Mauritshuis en 2018 a révélé que le fond, aujourd'hui noir, figurait à \
l'origine un rideau vert, et que la jeune fille avait des cils, devenus invisibles à \
l'œil nu."""
details = [
  "Le reflet du col blanc dans le bas de la perle.",
  "Les petites touches de lumière au coin des lèvres.",
  "L'arête du nez, sans aucun contour, qui se fond dans la joue.",
  "Le pan jaune du turban, qui retombe derrière la tête.",
  "Le minuscule reflet de lumière dans chacun des yeux.",
]
themes = ["portrait", "regard", "orient", "mystère", "tronie"]
anecdote = """
Après une tournée au Japon, aux États-Unis et en Italie entre 2012 et 2014, le \
Mauritshuis a décidé que le tableau ne voyagerait plus. Seule exception : en 2023, il \
fut prêté quelques semaines à la grande exposition Vermeer du Rijksmuseum, à \
Amsterdam."""
salle = 2
mur = "est"
position = 0
largeur = 0.55

[[oeuvres]]
titre = "L'Art de la peinture"
artiste = "Johannes Vermeer"
annee = "vers 1666–1668"
image = "art-peinture.jpg"
technique = "Huile sur toile, 120 × 100 cm"
collection = "Kunsthistorisches Museum, Vienne"
note = "Un peintre de dos peint la muse de l'Histoire : Vermeer garda ce tableau toute sa vie."
description = """
Un lourd rideau de tapisserie, relevé à gauche, découvre un atelier. Un peintre vu de \
dos, en pourpoint noir à crevés, chausses rouges et béret, est assis devant son \
chevalet ; il commence à peindre la couronne de laurier de son modèle. Celle-ci, \
debout près de la fenêtre, est une jeune femme vêtue de bleu, couronnée de laurier, \
qui tient une trompette et un gros livre jaune, les yeux baissés. Sur la table, un \
masque de plâtre, un livre ouvert, des étoffes. Au mur s'étend une grande carte des \
Dix-Sept Provinces des Pays-Bas, et un lustre de cuivre doré, sans bougies, pend du \
plafond à poutres. Au sol, un carrelage de marbre noir et blanc."""
evocation = """
Le modèle incarne Clio, la muse de l'Histoire, reconnaissable aux attributs que lui \
donnait l'Iconologie de Cesare Ripa, manuel de symboles très lu : le laurier de la \
gloire, la trompette de la renommée, le livre de l'histoire. Le tableau est ainsi une \
allégorie : la peinture, en représentant l'Histoire, assure la gloire. La carte, où \
une pliure sépare le Nord, devenu les Provinces-Unies, du Sud resté espagnol, et le \
lustre surmonté de l'aigle à deux têtes des Habsbourg ont été lus comme des allusions \
à la division des Pays-Bas. Le peintre sans visage a fait rêver à un autoportrait ; \
rien ne le prouve, mais l'œuvre dit à coup sûr la haute idée que Vermeer se faisait de \
son art."""
histoire = """
Vermeer peint ce grand tableau vers 1666-1668, sans commande connue, et le garde chez \
lui jusqu'à sa mort en 1675. Accablée de dettes, sa veuve Catharina Bolnes le céda à \
sa mère, Maria Thins, pour le soustraire aux créanciers ; le curateur de la \
succession, le savant Antonie van Leeuwenhoek, contesta la manœuvre. Le tableau passa \
ensuite de main en main et, au XIXᵉ siècle, appartint aux comtes Czernin, à Vienne, \
sous le nom de Pieter de Hooch, avant d'être rendu à Vermeer. En 1940, Hitler l'acheta \
à la famille Czernin pour le musée qu'il projetait à Linz. Retrouvé en 1945 dans la \
mine de sel d'Altaussee, il fut remis à l'Autriche et attribué au Kunsthistorisches \
Museum."""
facture = """
La composition est un jeu de plans successifs : le rideau, au premier plan, crée un \
effet de seuil, puis viennent la chaise, le peintre, enfin le modèle et la carte, \
éclairés par une fenêtre invisible à gauche. Le carrelage en perspective conduit l'œil \
vers le fond. Vermeer plantait une épingle au point de fuite et y attachait un fil \
pour tracer les lignes de perspective : on en a retrouvé la trace dans plusieurs de \
ses tableaux. Chaque matière reçoit un traitement propre : les reflets du lustre, le \
grain de la tapisserie, les plis et les inscriptions de la carte, le bleu outremer de \
la robe."""
details = [
  "La signature du peintre, discrète, au bord inférieur de la carte, près du modèle.",
  "Les crevés du pourpoint, qui laissent voir la chemise blanche.",
  "Le masque de plâtre posé sur la table, tourné vers le plafond.",
  "L'aigle à deux têtes au sommet du lustre.",
  "Les premières feuilles de laurier esquissées sur la toile du chevalet.",
]
themes = ["atelier", "allégorie", "histoire", "peinture", "carte"]
anecdote = """
En 2011, l'Autriche a refusé de rendre le tableau aux héritiers de la famille Czernin, \
qui soutenaient que la vente de 1940 à Hitler avait été forcée : la commission chargée \
des restitutions a estimé qu'elle n'avait pas été conclue sous la contrainte."""
salle = 2
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "L'Astronome"
artiste = "Johannes Vermeer"
annee = "1668"
image = "astronome.jpg"
technique = "Huile sur toile, 51 × 45 cm"
collection = "Musée du Louvre, Paris"
note = "Un savant tend la main vers un globe céleste, dans la lumière de la fenêtre."
description = """
Dans un cabinet de travail éclairé par une fenêtre à gauche, un homme aux longs \
cheveux, vêtu d'une ample robe de chambre bleu-vert, est assis et se penche vers un \
globe céleste posé sur la table. De la main droite, il en effleure la surface, comme \
pour faire tourner le ciel ; l'autre main s'appuie sur le bord de la table, près d'un \
livre ouvert. Un épais tapis aux motifs colorés recouvre la table, où l'on aperçoit un \
astrolabe. Derrière lui, une armoire porte quelques livres ; au mur est accroché un \
tableau représentant Moïse sauvé des eaux. Les vitraux de la fenêtre laissent passer \
une lumière douce qui tombe sur le visage, la main et le globe."""
evocation = """
Le tableau célèbre le savant moderne, à l'heure où les Provinces-Unies sont un grand \
foyer des sciences : astronomie, cartographie, optique. Le livre ouvert sur la table a \
été identifié comme un traité d'Adriaan Metius, ouvert au passage qui recommande de \
chercher auprès de Dieu l'inspiration pour étudier les astres. Le Moïse sauvé des \
eaux, au mur, a été interprété dans le même sens : Moïse, élevé à la cour d'Égypte, \
passait pour instruit de toute la sagesse des Égyptiens, astronomie comprise. Science \
et foi ne s'opposent donc pas ici. On a supposé que le modèle était Antonie van \
Leeuwenhoek, savant delftois né la même année que Vermeer, hypothèse séduisante mais \
jamais démontrée."""
histoire = """
Signée et datée 1668, c'est l'une des très rares toiles datées de Vermeer. Elle forme \
sans doute une paire avec Le Géographe, conservé au Städel Museum de Francfort, où \
l'on reconnaît le même modèle et la même robe ; les deux tableaux passèrent ensemble \
dans plusieurs ventes au XVIIIᵉ siècle. À la fin du XIXᵉ siècle, L'Astronome entra \
dans la collection de la famille de Rothschild, à Paris. Saisi par les nazis en 1940 \
et destiné à la collection d'Hitler, il fut rendu à la famille après la guerre. En \
1983, il entra au Louvre par dation, c'est-à-dire en paiement de droits de succession, \
et c'est aujourd'hui l'un des deux seuls Vermeer du musée, avec La Dentellière."""
facture = """
La lumière de la fenêtre glisse sur le visage, le globe et les plis de la robe, tandis \
que le fond reste dans une pénombre dorée. Vermeer décrit avec précision des \
instruments qu'il connaissait sans doute directement : le globe correspond à un modèle \
publié par Jodocus Hondius en 1600, dont on reconnaît les figures de constellations. \
Le tapis, rendu en épaisses touches de couleur, contraste avec la robe, peinte par \
larges plans de bleu. La composition, serrée, place le savant et le globe sur la \
diagonale de la lumière."""
details = [
  "La main droite du savant, posée sur le globe parmi les constellations.",
  "La signature et la date, inscrites sur la porte de l'armoire.",
  "L'astrolabe posé sur le tapis de table.",
  "Le tableau de Moïse sauvé des eaux, en partie visible à droite.",
  "Les petits losanges du vitrail de la fenêtre, d'où vient la lumière.",
]
themes = ["science", "astronomie", "savoir", "lumière", "intérieur"]
anecdote = """
Lorsque les nazis saisirent le tableau chez les Rothschild, ils apposèrent au revers \
un petit tampon en forme de croix gammée, qui le désignait comme bien confisqué. La \
marque est toujours visible au dos de la toile."""
salle = 3
mur = "ouest"
position = 0
largeur = 0.6

[[oeuvres]]
titre = "La Ronde de nuit"
artiste = "Rembrandt"
annee = "1642"
image = "ronde-nuit.jpg"
technique = "Huile sur toile, 379,5 × 453,5 cm"
collection = "Rijksmuseum, Amsterdam"
note = "La milice du capitaine Banninck Cocq se met en marche : un portrait de groupe devenu une scène de théâtre."
description = """
Au centre, le capitaine Frans Banninck Cocq, en noir avec une écharpe rouge, s'avance \
vers nous et tend la main gauche en parlant à son lieutenant, Willem van Ruytenburch, \
tout de jaune clair vêtu, coiffé d'un chapeau à plume. Autour d'eux, une compagnie de \
miliciens se met en mouvement dans un joyeux désordre : un homme en rouge charge son \
mousquet, un autre souffle sur le bassinet, un troisième tire ; un porte-drapeau \
brandit l'étendard, un tambour bat la caisse à droite, un chien aboie. Des piques et \
des lances se croisent dans le haut. À gauche, une petite fille vêtue d'or, baignée de \
lumière, porte à sa ceinture un poulet mort. Derrière, une arche de pierre, et un \
écusson où sont inscrits les noms des gardes."""
evocation = """
Le tableau est un portrait collectif : les membres de la compagnie qui ont payé pour \
figurer y sont représentés, mais Rembrandt les fond dans une action au lieu de les \
aligner. On y a vu la fierté d'une milice bourgeoise, garante de l'ordre et des \
libertés de la ville, à une époque où ces compagnies avaient perdu l'essentiel de leur \
rôle militaire et devenaient des sociétés honorifiques. La petite fille lumineuse est \
souvent interprétée comme une figure allégorique de la compagnie des arquebusiers : \
les griffes du poulet rappellent leur emblème. Le mouvement général, la marche vers le \
spectateur, ont fait du tableau une image de l'élan et de la prospérité de la \
République hollandaise au siècle d'or."""
histoire = """
Vers 1639, la compagnie du capitaine Banninck Cocq commanda ce tableau pour la grande \
salle du Kloveniersdoelen, siège des arquebusiers d'Amsterdam, qui reçut toute une \
série de portraits de compagnies par différents peintres. Achevé en 1642, l'année de \
la mort de Saskia, il ne provoqua pas le scandale que la légende a imaginé. En 1715, \
transporté à l'hôtel de ville, il fut rogné sur tous les côtés pour tenir sur un mur ; \
à gauche, deux personnages disparurent. Il entra ensuite dans les collections \
nationales. Pendant la Seconde Guerre mondiale, on le cacha, roulé, dans des abris, \
notamment une grotte près de Maastricht. Le Rijksmuseum, dont le bâtiment ouvrit en \
1885, lui réserve une salle au bout de sa galerie d'honneur."""
facture = """
Rembrandt bouscule le genre du portrait de milice : au lieu de rangées de têtes \
également éclairées, il crée une scène dramatique où la lumière isole quelques \
figures, le capitaine, le lieutenant, la petite fille, et laisse les autres dans la \
pénombre. L'ombre de la main du capitaine, projetée sur le costume du lieutenant, \
donne la mesure de l'espace. Les broderies dorées sont peintes en épaisseurs qui \
accrochent la lumière. Le titre, apparu bien après la mort du peintre, vient du vernis \
bruni qui assombrissait la toile : la scène se passe en réalité en plein jour."""
details = [
  "L'ombre de la main gauche du capitaine sur la veste jaune du lieutenant.",
  "La petite fille en robe dorée, avec un poulet mort pendu à la ceinture.",
  "Le chien qui aboie près du tambour, à droite.",
  "L'écusson au-dessus de l'arche, où sont inscrits les noms des gardes.",
  "Le milicien en rouge, à gauche, occupé à charger son mousquet.",
]
themes = ["milice", "portrait de groupe", "mouvement", "clair-obscur", "amsterdam"]
anecdote = """
Depuis 2019, l'opération « Ronde de nuit » étudie et restaure le tableau sous les yeux \
du public, dans une cage de verre. En 2021, les parties coupées en 1715 ont été \
reconstituées à l'aide de l'intelligence artificielle, d'après une copie ancienne de \
Gerrit Lundens, et exposées un temps à côté de l'original."""
salle = 4
mur = "nord"
position = 0
largeur = 4.5

# ─── Les artistes ───────────────────────────────────────────────────────────

[[artistes]]
nom = "Johannes Vermeer"
vie = "Delft, baptisé le 31 octobre 1632 – Delft, inhumé le 15 décembre 1675"
biographie = """
Johannes Vermeer est baptisé à Delft en 1632. Son père, Reynier Jansz, tisserand de \
soieries, tient une auberge sur la grand-place et fait commerce de tableaux. On ignore \
tout de la formation du jeune homme. En avril 1653, il épouse Catharina Bolnes, issue \
d'une famille catholique aisée, et se convertit sans doute au catholicisme ; le couple \
s'installe chez la mère de Catharina, Maria Thins, dans le quartier catholique de la \
ville. La même année, il entre à la guilde de Saint-Luc, dont il sera plusieurs fois \
l'un des dirigeants. Ses premiers tableaux sont des scènes mythologiques et \
religieuses ; vers 1657, il se tourne vers les intérieurs domestiques qui feront sa \
gloire. Il peint lentement, deux tableaux par an en moyenne selon les estimations, et \
compte un mécène fidèle, Pieter van Ruijven, qui posséda une grande partie de son \
œuvre. Le couple a quinze enfants, dont onze vivent encore à sa mort. En 1672, \
l'invasion française des Provinces-Unies effondre le marché de l'art ; accablé de \
dettes, Vermeer meurt brusquement à quarante-trois ans, et sa veuve dira qu'il avait \
sombré dans le désespoir. Vite oublié, il est redécouvert au milieu du XIXᵉ siècle par \
le critique français Théophile Thoré-Bürger. On lui attribue aujourd'hui environ \
trente-cinq tableaux."""
style = """
Vermeer est le peintre de la lumière tranquille : presque toujours venue d'une fenêtre \
à gauche, elle baigne des intérieurs où une ou deux figures lisent, écrivent, jouent \
de la musique ou travaillent. Ses couleurs sont limpides, dominées par le bleu \
d'outremer naturel et le jaune, et il traduit les reflets par de petits points \
lumineux. Ses compositions, d'une géométrie rigoureuse, figent un instant ordinaire \
dans un silence suspendu. On discute encore de son recours à la chambre noire. Rare, \
longtemps oublié, il est devenu au XXᵉ siècle l'un des peintres les plus admirés, de \
Proust à Dalí, et une référence pour toute la peinture d'intérieur."""

[[artistes]]
nom = "Rembrandt"
vie = "Leyde, 15 juillet 1606 – Amsterdam, 4 octobre 1669"
biographie = """
Rembrandt Harmenszoon van Rijn naît à Leyde, fils d'un meunier aisé. Inscrit un temps \
à l'université, il choisit la peinture : trois ans d'apprentissage auprès de Jacob van \
Swanenburgh à Leyde, puis six mois à Amsterdam chez Pieter Lastman, peintre d'histoire \
formé en Italie. De retour à Leyde, il travaille aux côtés de Jan Lievens ; tous deux \
sont remarqués par Constantijn Huygens, secrétaire du stathouder. Vers 1631, il \
s'installe à Amsterdam chez le marchand d'art Hendrick Uylenburgh, dont il épouse la \
cousine, Saskia, en 1634. Portraitiste recherché, il achète en 1639 une grande maison \
sur la Jodenbreestraat, l'actuelle Maison de Rembrandt, et forme de nombreux élèves. \
Mais les deuils s'accumulent : trois enfants meurent en bas âge, et Saskia disparaît \
en 1642, peu après la naissance de leur fils Titus. Il vit ensuite avec Hendrickje \
Stoffels, dont il a une fille, Cornelia. Ses dépenses de collectionneur et le recul \
des commandes le mènent à la faillite en 1656 ; sa maison et ses biens sont vendus. Il \
continue pourtant de peindre et de recevoir des commandes importantes, comme Les \
Syndics des drapiers. Hendrickje meurt en 1663, Titus en 1668. Rembrandt s'éteint \
l'année suivante et est inhumé à la Westerkerk d'Amsterdam, dans une tombe louée dont \
l'emplacement exact est aujourd'hui inconnu."""
style = """
Rembrandt est le maître du clair-obscur : une lumière chaude et dorée fait surgir de \
l'ombre un visage, une main, un objet, et concentre l'émotion. Sa touche évolue d'une \
précision lisse, dans les années 1630, vers une matière de plus en plus épaisse et \
libre, travaillée à la brosse et parfois au couteau, qui donne aux chairs et aux \
étoffes un relief saisissant. Peintre, dessinateur et graveur de premier ordre, il a \
renouvelé le portrait de groupe comme la scène biblique, en cherchant la vérité \
psychologique plutôt que la beauté idéale. Ses élèves, de Ferdinand Bol à Carel \
Fabritius, ont diffusé sa manière ; au XIXᵉ siècle, Delacroix et Van Gogh l'ont \
profondément admiré."""
