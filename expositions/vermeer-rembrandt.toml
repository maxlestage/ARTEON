image = "lecon-anatomie.jpg"
technique = "Huile sur toile, 169,5 × 216,5 cm"
collection = "Mauritshuis, La Haye"
note = "Rembrandt a 26 ans : sa première grande commande, un portrait de groupe saisi en pleine dissection."
salle = 1
mur = "gauche"
place = 1
largeur = 1.7

