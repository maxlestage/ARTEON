[[oeuvres]]
titre = "Calle de París, tiempo lluvioso"
artiste = "Gustave Caillebotte"
annee = "1877"
image = "rue-de-paris-temps-de-pluie.jpg"
technique = "Óleo sobre lienzo, 212,2 × 276,2 cm"
collection = "Art Institute of Chicago"
note = "Una encrucijada nueva del barrio de Europa, bajo la lluvia: la gran ciudad moderna, sus perspectivas y sus transeúntes, pintada a la escala de un cuadro de historia."
description = """
Una encrucijada parisina, un día de lluvia. Los adoquines mojados relucen bajo un cielo gris. En primer plano a la derecha, una pareja elegante camina bajo un mismo paraguas: el hombre con sombrero de copa y levita, la mujer con abrigo oscuro, un velillo sobre el rostro y una perla en la oreja. Van a cruzarse con un transeúnte, cortado por el borde del cuadro, del que solo se ven la espalda y el paraguas. En el centro, una gran farola verde divide el lienzo en dos. A la izquierda, al otro lado de la calzada, transeúntes aislados cruzan, un coche de caballos espera, y un edificio de ángulo agudo, como la proa de un barco, separa dos calles que huyen hacia el fondo."""
evocation = """
Caillebotte pinta el París transformado por el barón Haussmann bajo el Segundo Imperio: calles anchas, edificios de piedra sillar alineados, farolas, aceras. Es la ciudad de los burgueses que pasean, pero también la del anonimato: cada cual se resguarda bajo su paraguas, nadie se mira, la pareja parece absorta en sus pensamientos. Se ha visto en ello una imagen de la soledad moderna en medio de la multitud, y un retrato del medio social al que pertenecía el pintor. La lluvia, que lo unifica todo en una misma luz gris, transforma la calle en un espacio casi abstracto, donde las líneas rectas de las fachadas responden a las curvas de los paraguas."""
histoire = """
La escena se sitúa en la encrucijada formada por las calles de Turín, de Moscú y de San Petersburgo, cerca de la estación de Saint-Lazare, en el barrio de Europa, entonces recientísimo. Caillebotte prepara el lienzo mediante numerosos dibujos y un boceto pintado. Lo presenta en 1877 en la tercera exposición impresionista, que él financió y organizó en gran parte, junto a obras de Monet, Renoir, Pissarro y Degas. La crítica advierte sobre todo sus grandes dimensiones y su sorprendente perspectiva. Tras pasar por colecciones particulares, el cuadro es adquirido en 1964 por el Art Institute of Chicago, del que se ha convertido en una de las obras más célebres."""
facture = """
El formato monumental, más de dos metros por casi tres, hace entrar al espectador en la calle, a la altura de transeúntes a tamaño natural. La perspectiva está muy acentuada, y el encuadre, con sus figuras cortadas por el borde, evoca la fotografía. La farola y su línea vertical dividen el lienzo en dos partes, una abierta y profunda, la otra cerrada por las figuras cercanas. La factura es lisa y precisa en primer plano, más difusa en la lejanía, como en el aire húmedo de un día de lluvia. Dominan los grises, los azules y los beiges, realzados por el verde de la farola."""
details = [
  "La perla en la oreja de la mujer, bajo su velillo.",
  "La farola verde, en el centro, que parte el cuadro en dos.",
  "La firma y la fecha, abajo a la izquierda, sobre los adoquines.",
  "La rueda roja del coche de caballos, a la izquierda.",
  "Los adoquines, más grandes en primer plano, que se achican hacia el fondo.",
]
themes = ["ciudad", "lluvia", "París", "soledad", "perspectiva"]
anecdote = """
La encrucijada sigue existiendo: es hoy la plaza de Dublín, en el distrito 8 de París. El edificio en forma de proa sigue en pie, y en él se puede encontrar casi exactamente el punto de vista del pintor."""
