[[oeuvres]]
titre = "Los tejados rojos, rincón de aldea, efecto de invierno"
artiste = "Camille Pissarro"
annee = "1877"
image = "toits-rouges.jpg"
technique = "Óleo sobre lienzo, 54,5 × 65,6 cm"
collection = "Museo de Orsay, París"
note = "Un caserío de Pontoise visto a través de una cortina de árboles desnudos: el paisaje tejido con pequeños toques de Pissarro, el decano y pilar del grupo impresionista."
description = """
Al pie de una colina, un grupo de casas campesinas de muros claros y tejados de tejas rojas se apiña en medio de un huerto. Es invierno: los árboles frutales, sin hojas, levantan ante las casas una red de troncos delgados y ramas finas, a través de la cual se adivinan los hastiales, las chimeneas, una ventana. En primer plano, hierba verde y un camino de tierra parda. Por encima de los tejados, la pendiente de la colina, cubierta de campos rojizos y de setos, sube casi hasta lo alto del cuadro y deja solo un estrecho retazo de cielo gris azulado. Todo vibra en una luz fría y clara."""
evocation = """
Pissarro pinta el campo más corriente, el de los alrededores de París, sin monumento ni acontecimiento: un rincón de aldea, árboles, una estación. Lo que le interesa es la manera en que la luz de invierno hace cantar las tejas rojas contra los verdes y los grises. Su mirada, profundamente apegada a la vida rural, no busca ni lo pintoresco ni la anécdota. La red de árboles situada entre nosotros y las casas crea una impresión de intimidad, como si descubriéramos el caserío caminando por el huerto. Se ve a menudo en él uno de los mayores logros del período de Pontoise, cuando Pissarro trabaja junto a Cézanne."""
histoire = """
Establecido en Pontoise de 1872 a 1882, Pissarro pinta incansablemente esta villa del Vexin y sus alrededores. Este lienzo representa la côte des Bœufs, en el caserío de l'Hermitage, donde vive. El cuadro pertenece después a Gustave Caillebotte, que compra muchas obras a sus amigos para apoyarlos. A su muerte, en 1894, Caillebotte lega su colección al Estado: tras largas negociaciones y una viva polémica, solo una parte es aceptada y presentada en 1897 en el Museo del Luxemburgo. Los tejados rojos forman parte de ella. El lienzo se incorpora después al Louvre, y al Museo de Orsay en 1986."""
facture = """
Pissarro construye el lienzo mediante una multitud de pequeños toques espesos, puestos en todos los sentidos, que dan a la superficie una textura apretada, casi tejida. Superpone dos planos: la red lineal de los árboles en primer plano y, detrás, los volúmenes simples de las casas, hastiales y tejados tratados como bloques de color. Esta atención a la estructura recuerda sus intercambios con Cézanne en la misma época. Los complementarios, rojo de las tejas y verde de la hierba, se exaltan mutuamente, mientras que el horizonte situado muy alto reduce el cielo a una estrecha franja."""
details = [
  "Las chimeneas blancas que asoman entre las ramas.",
  "La estrecha franja de cielo, en lo más alto.",
  "Los troncos finos y claros de los árboles frutales, como una reja ante las casas.",
  "La firma y la fecha, abajo a la derecha.",
]
themes = ["paisaje", "invierno", "aldea", "campo", "luz"]
anecdote = """
Pissarro es el único pintor que participó en las ocho exposiciones impresionistas, de 1874 a 1886. Cézanne, que trabajó a su lado en Pontoise, se presentará más tarde como «discípulo de Pissarro»."""
