[[artistes]]
nom = "Gustave Courbet"
vie = "Ornans (Doubs), 10 de junio de 1819 – La Tour-de-Peilz (Suiza), 31 de diciembre de 1877"
biographie = """
Hijo de un rico terrateniente de Ornans, en el Franco Condado, Gustave Courbet llega a París en 1839, oficialmente para estudiar derecho. Se forma sobre todo por sí solo, copiando en el Louvre a los maestros españoles, flamencos y holandeses, y pinta numerosos autorretratos románticos. Admitido en el Salón desde 1844, se impone tras la revolución de 1848 con La sobremesa en Ornans, Los picapedreros y Un entierro en Ornans, que causan escándalo. Amigo de Baudelaire, de Champfleury y del pensador socialista Proudhon, reivindica el nombre de «realista». En 1855, rechazado en parte en la Exposición Universal, abre su propio pabellón. Paisajes del Jura, escenas de caza, desnudos y marinas hacen después su fortuna. Republicano, rechaza la Legión de Honor en 1870 y participa en la Comuna de París en 1871. Considerado responsable de la destrucción de la columna Vendôme, es encarcelado y después condenado a pagar su reconstrucción. Arruinado, se exilia en Suiza en 1873 y muere en La Tour-de-Peilz, a orillas del Lemán."""
style = """
Courbet quiere pintar lo que ve y nada más: ni ángeles, ni dioses, ni historia antigua. Su pintura es sólida y terrena, construida sobre fondos oscuros, con una pasta espesa que a menudo extiende con espátula, sobre todo en sus paisajes de rocas y olas. Al dar a la vida ordinaria las dimensiones de la gran pintura, abrió el camino a Manet y a los impresionistas, e hizo del realismo un combate artístico y político."""

[[artistes]]
nom = "Jean-François Millet"
vie = "Gruchy, Gréville-Hague (Mancha), 4 de octubre de 1814 – Barbizon, 20 de enero de 1875"
biographie = """
Nacido en una familia de campesinos acomodados del Cotentin, Jean-François Millet trabaja en el campo antes de aprender pintura en Cherburgo. Una beca de la ciudad le permite partir en 1837 a París, donde entra en el taller de Paul Delaroche. Vive al principio con dificultad de retratos y de graciosas escenas pastorales. Viudo en 1844, comparte después su vida con Catherine Lemaire, que le dará nueve hijos. En 1849, se instala en Barbizon, en el linde del bosque de Fontainebleau, junto a su amigo el paisajista Théodore Rousseau. Consagra allí desde entonces su obra a los campesinos: El sembrador, Las espigadoras, El Ángelus. Pobre durante mucho tiempo, criticado por quienes ven en él a un pintor socialista, es por fin reconocido en la Exposición Universal de 1867 y recibe la Legión de Honor al año siguiente. Muere en Barbizon en 1875. Su gloria póstuma es inmensa, y Van Gogh, que lo veneraba, copiará buen número de sus composiciones."""
style = """
Millet simplifica las formas para dar a los campesinos la grandeza de estatuas: contornos firmes, gestos lentos, rostros a menudo en la sombra. Sus colores sordos, ocres, pardos y grises dorados, y sus luces de crepúsculo crean una atmósfera grave, casi religiosa. Excelente dibujante, pastelista y grabador, hizo del trabajo del campo un tema noble, y su influencia marcó a Van Gogh, Pissarro y Seurat."""

[[artistes]]
nom = "Rosa Bonheur"
vie = "Burdeos, 16 de marzo de 1822 – Thomery (Sena y Marne), 25 de mayo de 1899"
biographie = """
Hija del pintor Raymond Bonheur, adepto de las ideas saint-simonianas que propugnan la igualdad de los sexos, Rosa Bonheur crece en París, donde su padre le enseña el dibujo. Copia a los maestros en el Louvre y estudia incansablemente a los animales, en las granjas, los mercados de caballos y los mataderos. Expone en el Salón desde 1841 y obtiene una medalla de primera clase en 1848. Labranza en el Nivernais, en 1849, y después La feria de caballos, hoy en el Metropolitan Museum de Nueva York, hacen de ella una de las artistas más célebres de su tiempo, en Francia, en Gran Bretaña y en los Estados Unidos. En 1860, se instala en el castillo de By, en Thomery, cerca del bosque de Fontainebleau, con su compañera Nathalie Micas y toda una casa de fieras. En 1865, es la primera mujer artista condecorada con la Legión de Honor. Recibe a Buffalo Bill en 1889 y hace su retrato. Al final de su vida, la pintora estadounidense Anna Klumpke se convierte en su compañera y su biógrafa."""
style = """
Rosa Bonheur es la gran pintora animalista del siglo XIX. Su arte descansa en una observación científica de la anatomía y del comportamiento de los animales, expresada mediante un dibujo preciso, una pincelada cuidada y un sentido del movimiento de las masas. Sus composiciones en friso, sus grandes formatos y sus luces claras dan a los caballos y a los bueyes la nobleza que otros reservaban a los héroes. Sigue siendo también una figura pionera de la independencia de las mujeres artistas."""

[[artistes]]
nom = "Édouard Manet"
vie = "París, 23 de enero de 1832 – París, 30 de abril de 1883"
biographie = """
Hijo de un alto magistrado parisino, Édouard Manet suspende el examen de ingreso en la Escuela Naval y se embarca en 1848 como alumno piloto rumbo a Río de Janeiro. A su regreso, su padre acepta que se haga pintor: pasa seis años en el taller de Thomas Couture, copia a los maestros en el Louvre y viaja a Holanda y a Italia. Admira a Velázquez y a Goya, a quien descubre en España en 1865. Notado en el Salón de 1861, causa escándalo con El almuerzo sobre la hierba en 1863, y después con Olympia en 1865. Defendido por Baudelaire y por Émile Zola, se convierte en la figura de referencia de los jóvenes pintores que frecuentan el café Guerbois, Monet, Renoir, Degas, Bazille. Sin embargo, se niega a exponer con los impresionistas y sigue buscando el reconocimiento del Salón. Se casa en 1863 con Suzanne Leenhoff. En la década de 1870, aclara su paleta y pinta al aire libre con Monet en Argenteuil. Aquejado de una grave enfermedad, recibe la Legión de Honor en 1881 y muere a los cincuenta y un años."""
style = """
Manet pinta su época con los medios de los maestros antiguos: grandes formatos, composiciones tomadas de Tiziano, Rafael o Velázquez, pero temas modernos y miradas directas. Simplifica el modelado, pone colores francos en amplias superficies planas y hace del negro un verdadero color. Esta pintura plana y luminosa, que asume su pincelada, liberó a sus menores: se le tiene a menudo por el primer pintor moderno."""

[[artistes]]
nom = "Edgar Degas"
vie = "París, 19 de julio de 1834 – París, 27 de septiembre de 1917"
biographie = """
Hijo de un banquero parisino, Edgar Degas renuncia al derecho por la pintura, ingresa brevemente en la Escuela de Bellas Artes en 1855 y venera a Ingres. Pasa tres años en Italia, donde copia a los maestros del Renacimiento y pinta La familia Bellelli, retrato de su tía y de su familia. De regreso en París, abandona poco a poco la pintura de historia por la vida moderna: hipódromos, cafés, lavanderas, modistas y sobre todo bailarinas de la Ópera. En 1872-1873, reside en Nueva Orleans, cuna de la familia de su madre. Participa en siete de las ocho exposiciones impresionistas, si bien rechaza la etiqueta y prefiere llamarse realista. Practica el pastel, el monotipo, la fotografía y la escultura: su Pequeña bailarina de catorce años, de cera vestida con telas de verdad, causa sensación en 1881. Su vista declina a partir de la década de 1870. Misántropo, enemistado con varios amigos a raíz del caso Dreyfus, vive sus últimos años casi ciego y muere en París en 1917."""
style = """
Degas es ante todo un dibujante. Compone sus escenas como instantáneas: encuadres descentrados, figuras cortadas, vistas picadas, influidos por las estampas japonesas y la fotografía. Observa el cuerpo en el trabajo, bailarinas, planchadoras, jinetes, con una precisión casi científica. Pintor de taller más que de aire libre, inventa sin cesar técnicas, en particular en el pastel, que lleva hasta colores deslumbrantes."""

[[artistes]]
nom = "Gustave Caillebotte"
vie = "París, 19 de agosto de 1848 – Gennevilliers (Altos del Sena), 21 de febrero de 1894"
biographie = """
Hijo de un rico industrial parisino, Gustave Caillebotte obtiene una licenciatura en derecho en 1868 y después sirve en la guardia nacional móvil durante la guerra de 1870. Estudia luego pintura en el taller de Léon Bonnat e ingresa en la Escuela de Bellas Artes en 1873. La muerte de su padre le deja una gran fortuna. Rechazado en el Salón en 1875, se une a los impresionistas, expone con ellos desde 1876 y se convierte en su principal organizador y mecenas: financia exposiciones, compra lienzos de Monet, Renoir, Pissarro, Degas, Sisley y Cézanne, paga a veces el alquiler de sus amigos. Sus grandes lienzos, El puente de Europa y Calle de París, tiempo lluvioso, muestran el París haussmanniano. Pinta también el campo de la propiedad familiar de Yerres. Apasionado de la navegación, dibuja y construye veleros en Petit-Gennevilliers, donde se instala, cultiva un jardín y reúne con su hermano Martial una célebre colección de sellos. Muere a los cuarenta y cinco años, legando su colección impresionista al Estado."""
style = """
Caillebotte une la precisión del dibujo académico y los temas de los impresionistas. Sus perspectivas picadas o fugadas, sus encuadres audaces y sus figuras cortadas recuerdan la fotografía. Pinta la ciudad moderna, sus calles, sus puentes, sus balcones, y el trabajo de los obreros, con una factura lisa y tonos gris azulado. Eclipsado durante mucho tiempo por su papel de mecenas, es hoy reconocido como un gran pintor del París moderno."""

[[artistes]]
nom = "Camille Pissarro"
vie = "Charlotte-Amalie, Saint Thomas (Antillas danesas), 10 de julio de 1830 – París, 13 de noviembre de 1903"
biographie = """
Nacido en las Antillas en una familia judía de comerciantes, Camille Pissarro es enviado a un internado cerca de París y después regresa a trabajar en el comercio paterno. En 1852, parte a dibujar a Venezuela con el pintor danés Fritz Melbye, antes de establecerse en París en 1855. Allí recibe los consejos de Corot y conoce en la Academia Suiza a Monet y a Cézanne. Durante la guerra de 1870, se refugia en Londres; su casa de Louveciennes es saqueada y gran parte de sus lienzos destruidos. De 1872 a 1882, vive en Pontoise, donde trabaja con Cézanne y Gauguin, y después se instala en Éragny, en el Oise. Hacia 1885, adopta durante unos años la técnica puntillista de Seurat. Padre de ocho hijos, durante mucho tiempo en apuros económicos, próximo a las ideas anarquistas, sufre al final de su vida una enfermedad de los ojos que le obliga a pintar tras una ventana: de ello extrae sus grandes series de bulevares parisinos y de puertos. Muere en París en 1903."""
style = """
Pissarro es el pintor del campo habitado: huertos, caminos, aldeas, mercados, campesinos trabajando. Su pincelada, hecha de pequeñas hachuras apretadas, teje superficies vibrantes, y su sólida construcción de las formas alimentó a Cézanne. Abierto a todas las búsquedas, pasó por el neoimpresionismo antes de renunciar a él. Paciente y generoso, fue el maestro y el apoyo de varias generaciones de pintores."""
