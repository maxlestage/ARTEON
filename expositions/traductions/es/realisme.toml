[[oeuvres]]
titre = "Un bar en el Folies-Bergère"
artiste = "Édouard Manet"
annee = "1882"
image = "bar-aux-folies-bergere.jpg"
technique = "Óleo sobre lienzo, 96 × 130 cm"
collection = "Courtauld Gallery, Londres"
note = "El último gran lienzo de Manet: una camarera cansada, de frente a nosotros, y detrás de ella, en un espejo, todo el esplendor de un café-concierto parisino."
description = """
Una joven camarera está de pie detrás del mostrador de mármol de un bar, con las manos apoyadas en el borde, de cara a nosotros. Lleva una chaqueta de terciopelo azul noche ribeteada de encaje, un medallón al cuello y un pequeño ramillete en el corpiño. Sobre el mostrador se alinean botellas de champán, de cerveza inglesa y de licor verde, una copa de cristal llena de naranjas y un vaso donde se sumergen dos rosas. Detrás de ella, un inmenso espejo refleja la sala del Folies-Bergère: las arañas, los globos luminosos, la multitud del balcón y, arriba a la izquierda, los pies calzados de verde de una acróbata en su trapecio. A la derecha, el reflejo de la camarera se inclina hacia un cliente con sombrero de copa."""
evocation = """
En medio del ruido y de la luz, la camarera parece ausente, perdida en sus pensamientos, aislada de la fiesta que sirve. Su reflejo, en cambio, parece enfrascado en una conversación con el cliente: dos actitudes, dos momentos, quizá la mujer pública y la mujer íntima. En el Folies-Bergère, algunas camareras pasaban por dejarse cortejar, y se ha llegado a preguntar si ella no formaba parte, como las botellas y las frutas, de lo que se ofrece al cliente. El cuadro habla también de la ciudad moderna, de sus placeres y de la soledad que se siente en ella en medio de la multitud. Pintado por un Manet ya muy enfermo, se ha leído a menudo como un adiós a la vida parisina que tanto había amado."""
histoire = """
Manet, gravemente enfermo, pinta el lienzo durante el invierno de 1881-1882 en su taller de la rue d'Amsterdam, tras haber tomado apuntes in situ, en el célebre café-concierto de la rue Richer. Hace reconstruir allí un mostrador con sus botellas, y una verdadera camarera del Folies-Bergère, llamada Suzon, acude a posar. El cuadro se expone en el Salón de 1882, el último en que participa Manet; muere al año siguiente, a los cincuenta y un años. El lienzo pertenece después al compositor Emmanuel Chabrier, amigo del pintor, y luego pasa por varias colecciones antes de ser adquirido en 1926 por el industrial británico Samuel Courtauld. Es hoy la obra estrella de la Courtauld Gallery, en Londres."""
facture = """
Manet pinta deprisa y con franqueza, con una pincelada ancha y visible que hace vibrar los reflejos del espejo, mientras que la naturaleza muerta del mostrador, en primer plano, es de una nitidez deslumbrante: vidrio, etiquetas, piel de las frutas. La luz artificial, fría y difusa, borra casi las sombras. Toda la composición descansa en una paradoja óptica: el reflejo de la camarera y del cliente está desplazado hacia la derecha, lo que sería imposible si nos halláramos frente a ella. Manet sacrifica voluntariamente la verosimilitud al efecto, y deja al espectador en la turbación."""
details = [
  "Los pequeños pies calzados de verde de una acróbata, arriba a la izquierda.",
  "La firma y la fecha, pintadas en la etiqueta de una botella, a la izquierda.",
  "La copa de cristal llena de naranjas, a la derecha del mostrador.",
  "La espectadora de vestido blanco acodada en el balcón, a la izquierda.",
  "El cliente de bigote y sombrero de copa, que solo existe en el espejo.",
]
themes = ["París", "café-concierto", "espejo", "soledad", "vida moderna"]
anecdote = """
Las botellas marcadas con un triángulo rojo son de cerveza inglesa Bass: ese triángulo fue, en 1876, la primerísima marca registrada en el Reino Unido. Manet deslizó así en su cuadro uno de los primeros logotipos de la historia."""
