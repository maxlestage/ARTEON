[[oeuvres]]
titre = "Los acuchilladores de parqué"
artiste = "Gustave Caillebotte"
annee = "1875"
image = "raboteurs-de-parquet.jpg"
technique = "Óleo sobre lienzo, 102 × 146,5 cm"
collection = "Museo de Orsay, París"
note = "Tres obreros con el torso desnudo rascan el suelo de un piso parisino: rechazado en el Salón, el cuadro fue una de las revelaciones de la exposición impresionista de 1876."
description = """
En la estancia vacía de un piso burgués, de muros cubiertos de boiserie gris, tres obreros de rodillas, con el torso desnudo, rascan el viejo barniz del parqué. Dos de ellos, en el centro y a la derecha, tiran uno junto a otro de su rasqueta hacia sí; el tercero, a la izquierda, trabaja solo, inclinado hacia el suelo. Largas virutas claras se enroscan a su alrededor. Al fondo, una puerta balconera abierta a un balcón de hierro forjado deja entrar una luz suave que resbala sobre las tablillas y hace brillar las partes ya raspadas. A la derecha, una botella de vino y un vaso aguardan la pausa; se ha dejado un martillo sobre el suelo, y unas ropas amontonadas en el rincón de la estancia."""
evocation = """
Caillebotte, hijo de una rica familia parisina, mira el trabajo manual allí donde se hace, en un interior burgués en plena reforma. Lo pinta sin pintoresquismo, sin miserabilismo y sin mensaje moral, como un espectáculo de cuerpos en movimiento, de gestos repetidos y precisos. Se ha visto en él un homenaje al oficio, pero también una imagen del París haussmanniano, donde se construye y se reforma sin cesar. Los cuerpos flacos, el esfuerzo, el vino recuerdan la dureza del trabajo; al mismo tiempo, la luz y el ritmo de los brazos dan a la escena una belleza casi coreográfica. A los críticos de la época, en cambio, les llamó la atención sobre todo la audacia del tema y lo extraño del punto de vista."""
histoire = """
Caillebotte pinta la escena en el hotel particular familiar de la rue de Miromesnil, en París, donde ha instalado su taller. En 1875, presenta el lienzo en el Salón, donde el jurado lo rechaza, juzgando vulgar el tema. Al año siguiente, invitado por sus amigos Degas y Renoir, lo expone con los impresionistas, en su segunda exposición, en la galería del marchante Durand-Ruel. Allí es muy comentado; Émile Zola le reprocha, sin embargo, una exactitud demasiado fotográfica, que juzga burguesa. Tras la muerte de Caillebotte, en 1894, sus herederos, su hermano Martial y el pintor Auguste Renoir, albacea testamentario, ofrecen el cuadro al Estado. Ingresa en el Museo del Luxemburgo, después en el Louvre, antes de incorporarse al Museo de Orsay en 1986."""
facture = """
Caillebotte adopta un punto de vista picado, como si el espectador estuviera de pie sobre los obreros: el parqué sube casi hasta lo alto del cuadro y sus tablillas huyen en diagonal hacia la ventana, acentuando la perspectiva. Formado en el taller del pintor académico Léon Bonnat, pinta con una precisión y un acabado cuidados que lo distinguen de sus amigos impresionistas. La luz a contraluz, procedente de la ventana, pone reflejos plateados sobre la madera y modela las espaldas y los brazos. La paleta se limita a los pardos, los grises y los ocres."""
details = [
  "Las virutas de madera que se enroscan sobre el suelo.",
  "La botella de vino y el vaso, colocados a la derecha.",
  "El balcón de hierro forjado, a contraluz, detrás de la puerta balconera.",
  "El contraste entre las tablillas ya raspadas, claras, y las que todavía están oscuras.",
  "La firma y la fecha, abajo a la derecha.",
]
themes = ["trabajo", "obreros", "París", "luz", "perspectiva"]
anecdote = """
Se considera este lienzo una de las primerísimas representaciones de los obreros urbanos en la pintura francesa: hasta entonces, los pintores realistas habían mostrado sobre todo a los trabajadores del campo, como las espigadoras de Millet."""
salle = 4
