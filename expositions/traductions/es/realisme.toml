[[oeuvres]]
titre = "La clase de danza"
artiste = "Edgar Degas"
annee = "1873–1876"
image = "classe-de-danse.jpg"
technique = "Óleo sobre lienzo, 85 × 75 cm"
collection = "Museo de Orsay, París"
note = "Final de la lección en la Ópera: alrededor del viejo maestro de ballet Jules Perrot, las bailarinas se estiran, charlan y esperan."
description = """
En una alta sala de muros verde pálido, adornada con pilastras de falso mármol y un gran marco de puerta, una veintena de jóvenes bailarinas con tutú blanco rodean a un viejo maestro de ballet apoyado en un largo bastón. En el centro, una alumna adopta la pose para ejecutar un paso ante él. Pero la mayoría no mira: a la izquierda, una, sentada sobre el piano, se rasca la espalda, otra se abanica; en primer plano, una muchacha vista de espaldas, con un lazo rojo en el pelo y una ancha faja verde, se ajusta el atuendo. Al fondo, a la derecha, unas madres esperan a sus hijas. El entarimado, visto desde arriba, ocupa toda la parte inferior del cuadro, con una regadera en el ángulo izquierdo."""
evocation = """
Degas no muestra el espectáculo sino sus bastidores: el cansancio, la espera, el aburrimiento, los pequeños gestos que nadie debería ver. Las alumnas de la Ópera, a menudo de familias modestas, son aquí trabajadoras en aprendizaje, a las que se apodaba «petits rats». La presencia de las madres, al fondo, recuerda las esperanzas, y a veces los cálculos, que rodeaban a estas muchachas. El viejo maestro, figura de la edad de oro del ballet romántico, encarna una disciplina y una tradición frente a una juventud distraída. Para Degas, este mundo es sobre todo un laboratorio del movimiento: observa en él cómo un cuerpo se sostiene, se retuerce, se relaja."""
histoire = """
Degas comienza el cuadro hacia 1873 y lo concluye en 1876, tras numerosos estudios de bailarinas, dibujados a partir de modelos que posan en su taller. La sala evoca la antigua Ópera de la rue Le Peletier, destruida por un incendio en octubre de 1873: Degas la recompone, pues, en parte de memoria. El maestro de ballet es Jules Perrot, célebre bailarín y coreógrafo, que había regulado parte de las danzas de Giselle en 1841. Otra versión, de composición distinta, se conserva en el Metropolitan Museum of Art de Nueva York. El lienzo es legado al Louvre en 1911 por el coleccionista Isaac de Camondo, junto con otras obras de Degas, y se encuentra en el Museo de Orsay desde 1986."""
facture = """
Degas compone como un fotógrafo o un grabador japonés: punto de vista elevado, entarimado en diagonal que huye hacia el fondo, figuras cortadas por el borde del marco, vacío en el centro. Las tablillas del suelo conducen la mirada hacia el maestro de ballet. El color, muy claro, descansa en la armonía de los blancos vaporosos de los tutús y del verde pálido de los muros, realzada por las cintas, verdes, azules, rojas, y por el negro del piano. La pincelada, fina y nerviosa, conserva la precisión del dibujo, que Degas situaba por encima de todo."""
details = [
  "La bailarina sentada sobre el piano, que se rasca la espalda.",
  "El perrito a los pies de la bailarina de la faja verde.",
  "El abanico rojo abierto, justo detrás de la muchacha vista de espaldas.",
  "Las madres de las bailarinas, agrupadas al fondo a la derecha.",
  "El gran marco de puerta, en el centro, que deja ver una ventana al otro lado.",
]
themes = ["danza", "ópera", "movimiento", "bastidores", "juventud"]
anecdote = """
La regadera verde del primer plano no está ahí por casualidad: se regaba el suelo de las salas de ensayo para abatir el polvo e impedir que las bailarinas resbalaran. Degas pintó en ella, con malicia, su firma."""
salle = 4
