[exposition]
ordre = 80
nom_court = "Realismo"
mouvement = "Realismo e impresionismo"
cadre = "dore"
couleur = "#3d5a4c"
titre = "Del realismo a la vida moderna"
artiste = "Courbet, Millet, Rosa Bonheur, Manet, Degas, Caillebotte, Pissarro"
dates = "1849–1882"
accroche = "Exposición virtual · National Gallery of Art, Washington"
introduction = """
A mediados del siglo XIX, el realismo hace bajar la gran pintura del Olimpo: paso a los campesinos, a los obreros, a los entierros de aldea y a las calles de París. Courbet, Millet y Rosa Bonheur muestran el campo tal como es; Manet, Degas, Caillebotte y Pissarro pintan la vida moderna y abren el camino al impresionismo. El edificio se inspira en el West Building de la National Gallery of Art de Washington: una alta rotonda de columnas en el centro, una galería a cada lado y, al este, un gabinete en enfilada."""
vitrine = "dejeuner-sur-l-herbe.jpg"

[musee]
nom = "National Gallery of Art, West Building"
ville = "Washington, Estados Unidos"
architecte = "John Russell Pope"
construction = "1937–1941"
presentation = """
Banquero y antiguo secretario del Tesoro, Andrew W. Mellon ofrece a la nación, en 1937, su colección de cuadros y los fondos para construir un museo en el National Mall. El arquitecto John Russell Pope diseña un templo neoclásico de mármol rosado de Tennessee; muere poco después del comienzo de las obras, que sus socios concluyen. El edificio, hoy llamado West Building, abre en marzo de 1941. En su centro, la rotonda, coronada por una cúpula inspirada en el Panteón de Roma, está rodeada de columnas de mármol verde oscuro y alberga una fuente rematada por un Mercurio. Dos largas galerías de escultura parten hacia el este y hacia el oeste y distribuyen las salas de pintura, iluminadas por lucernarios. El museo presenta la pintura europea de la Edad Media al siglo XIX, desde Leonardo da Vinci, del que conserva el único cuadro visible en las Américas, hasta Manet, Monet y Degas. En 1978 se añadió el East Building, diseñado por Ieoh Ming Pei."""
ici = """
El edificio de ARTEON retoma el plano del West Building: una rotonda en el centro, galerías a ambos lados. Se entra por el sur, en el vestíbulo del Mall, y después en la rotonda, cuadrada, de catorce metros de altura, donde cuelgan El almuerzo sobre la hierba y Olympia. Al oeste se abre «Galería oeste · El realismo»; al este, «Galería este · La vida moderna», dos salas de dieciocho metros de largo de muros color crema. Al fondo de la galería este, una última puerta conduce al «Gabinete este · La ciudad y la aldea»."""

