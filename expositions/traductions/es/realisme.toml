[[oeuvres]]
titre = "El almuerzo sobre la hierba"
artiste = "Édouard Manet"
annee = "1863"
image = "dejeuner-sur-l-herbe.jpg"
technique = "Óleo sobre lienzo, 208 × 264,5 cm"
collection = "Museo de Orsay, París"
note = "Una mujer desnuda entre dos hombres vestidos a la moda: rechazado en el Salón de 1863, el cuadro causó escándalo en el Salón de los Rechazados."
description = """
En un claro, a orillas de un río, tres personajes están sentados sobre la hierba. Una joven desnuda, con la barbilla apoyada en la mano, nos mira directamente a los ojos, sin pudor. A su lado, dos jóvenes vestidos a la moda de la década de 1860, chaqueta oscura y pantalón claro, prosiguen su conversación; el de la derecha, tocado con un gorro con borla, tiende la mano en un gesto de orador. En primer plano, a la izquierda, las ropas de la mujer, un vestido azul y un sombrero de paja, han sido arrojadas de cualquier manera junto a una cesta volcada de la que ruedan unas frutas y un panecillo redondo. Más lejos, una segunda mujer en camisa se inclina hacia el agua. Los árboles enmarcan la escena como el telón de un teatro."""
evocation = """
El escándalo no procede del desnudo, omnipresente en la pintura de Salón, sino de su contexto: no es una ninfa ni una diosa, es una parisina de hoy, sentada junto a dos hombres vestidos como estudiantes o artistas, que mira fijamente al espectador. El público ve en ello una merienda campestre de costumbres dudosas. Manet, por su parte, retoma un tema consagrado por los maestros, la fiesta campestre, que el Louvre ilustra con el Concierto campestre atribuido a Tiziano, para mostrar que se puede pintar la propia época con la misma ambición. Se ha leído en él un desafío lanzado al academicismo, un homenaje irónico a la tradición o una reflexión sobre la mirada: la mujer nos observa tanto como nosotros a ella."""
histoire = """
Manet presenta el lienzo en el Salón de 1863 con el título El baño. El jurado lo rechaza, como a miles de otras obras ese año. Ante las protestas, Napoleón III autoriza una exposición de los cuadros rechazados, que se llamará el Salón de los Rechazados. El almuerzo atrae allí a la multitud, las risas y los sarcasmos, y convierte a Manet, a su pesar, en cabeza de fila de una joven generación. La mujer tiene por modelo a Victorine Meurent; los hombres son un hermano del pintor y el escultor neerlandés Ferdinand Leenhoff, cuya hermana Suzanne se casará con Manet unos meses más tarde. Adquirido en 1878 por el barítono Jean-Baptiste Faure, el cuadro es donado al Estado en 1906 por el coleccionista Étienne Moreau-Nélaton; ingresa en el Louvre en 1934 y después en el Museo de Orsay en 1986."""
facture = """
Manet pinta por amplios planos de color, sin las transiciones suaves del modelado académico: el cuerpo de la mujer, de un blanco crudo, iluminado de frente, parece casi plano sobre el fondo oscuro. Los negros de las chaquetas, profundos y aterciopelados, proceden de Velázquez y de Goya, a quienes admira. El paisaje, pintado con rapidez, parece un decorado pintado, y la bañista del fondo, demasiado grande para su lugar, desafía la perspectiva. El grupo de los tres personajes retoma el de tres divinidades en un grabado de Marcantonio Raimondi según Rafael, El juicio de Paris. La naturaleza muerta del primer plano es un alarde de virtuosismo."""
details = [
  "El camachuelo que vuela en lo alto, en el centro, entre las ramas.",
  "La pequeña rana escondida en la hierba, abajo a la izquierda.",
  "Las cerezas, los higos y el panecillo redondo escapados de la cesta.",
  "La barca amarrada a la orilla, a la derecha.",
  "El bastón que sostiene con descuido el hombre de la derecha.",
]
themes = ["escándalo", "desnudo", "modernidad", "naturaleza", "mirada"]
anecdote = """
Picado en su amor propio, Claude Monet emprendió en 1865 su propio Almuerzo sobre la hierba, un inmenso lienzo al aire libre, sin desnudo. Deteriorado por la humedad, fue cortado por el propio pintor: dos grandes fragmentos se conservan en el Museo de Orsay."""
salle = 2
mur = "nord"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "Olympia"
artiste = "Édouard Manet"
annee = "1863"
image = "olympia.jpg"
technique = "Óleo sobre lienzo, 130,5 × 190 cm"
collection = "Museo de Orsay, París"
note = "Una mujer de su tiempo en la pose de una Venus de Tiziano: en el Salón de 1865, el lienzo desató los insultos."
description = """
Una joven desnuda yace en una cama de sábanas y almohadas blancas, apoyada en grandes cojines, con un chal de flores deslizado bajo ella. Solo lleva una cinta de terciopelo negro anudada al cuello, un brazalete de oro, una orquídea rosa en sus cabellos rojizos y una babucha dorada; la otra babucha ha resbalado sobre la sábana. Su mano izquierda reposa plana sobre el muslo. Nos mira, serena, sin sonreír. Detrás de ella, una criada negra de vestido rosa le presenta un gran ramo envuelto en papel blanco. A los pies de la cama, a la derecha, un gato negro, con la cola erguida, mira fijamente al espectador con sus ojos amarillos. El fondo está cerrado por un tapiz oscuro y una cortina verde."""
evocation = """
Para los contemporáneos, el título y los accesorios no dejan lugar a dudas: Olympia es una cortesana, y en el ramo se ve el homenaje de un cliente, que ocuparía el lugar del espectador. Manet retoma la pose de la Venus de Urbino de Tiziano, pero sustituye a la diosa por una mujer real, de cuerpo sin idealizar, y al perrito dormido, símbolo de fidelidad, por un gato negro al acecho, asociado a la noche y al deseo. La mirada directa de Olympia invierte los papeles: es ella quien evalúa a quien la mira. Desde hace algunas décadas, los historiadores se interesan también por la criada, durante mucho tiempo ignorada, y por su modelo, una mujer llamada Laure, que vivía en París y posó varias veces para Manet."""
histoire = """
Pintada en 1863, el mismo año que El almuerzo sobre la hierba y con la misma modelo, Victorine Meurent, Olympia no se expone hasta el Salón de 1865. El escándalo es inmediato: unos visitantes amenazan el lienzo, la administración lo hace vigilar y luego colgar muy alto, y la prensa se burla de una mujer considerada fea e indecente. Manet conserva el cuadro hasta su muerte, en 1883. En 1889 y 1890, Claude Monet organiza una suscripción entre amigos y aficionados para comprarlo a la viuda del pintor, evitar que salga al extranjero y ofrecerlo al Estado. Olympia ingresa entonces en el Museo del Luxemburgo, reservado a los artistas vivos o recientemente fallecidos, y después en el Louvre, antes de incorporarse al Museo de Orsay en 1986."""
facture = """
Manet suprime casi el modelado: el cuerpo de Olympia es una forma clara, perfilada con un trazo oscuro, iluminada de frente, lo que los críticos le reprocharon como falta de relieve. Juega con acordes audaces entre los blancos de la sábana, de la almohada y del papel del ramo, y los negros y verdes oscuros del fondo, donde el gato y la criada casi se funden. El ramo, pintado con toques rápidos y libres, es un pequeño cuadro dentro del cuadro. El lienzo dialoga con Tiziano, a quien Manet había copiado en los Uffizi de Florencia, y con Goya, cuya Maja desnuda ofrece otro desnudo de mirada franca."""
details = [
  "La firma y la fecha, abajo a la izquierda, en el borde de la cama.",
  "El gato negro de ojos amarillos, a la derecha del todo, a los pies de la cama.",
  "La orquídea rosa prendida en los cabellos rojizos.",
  "La babucha dorada que queda en el pie, y la que ha resbalado sobre la sábana.",
  "La fina cinta de terciopelo negro anudada alrededor del cuello.",
]
themes = ["desnudo", "escándalo", "mirada", "cortesana", "modernidad"]
anecdote = """
Fue Georges Clemenceau, presidente del Consejo y amigo de Monet, quien ordenó en 1907 el traslado de Olympia del Museo del Luxemburgo al Louvre: cuarenta y dos años después del escándalo del Salón, la cortesana entraba entre los maestros."""
salle = 2
mur = "nord"
place = 3
largeur = 1.9

[[oeuvres]]
titre = "Un entierro en Ornans"
artiste = "Gustave Courbet"
annee = "1849–1850"
image = "enterrement-a-ornans.jpg"
technique = "Óleo sobre lienzo, 315 × 668 cm"
collection = "Museo de Orsay, París"
note = "Un entierro de aldea pintado con el formato de un cuadro de historia: con este lienzo, Courbet hace entrar la vida ordinaria en la gran pintura."
description = """
Sobre un lienzo de casi siete metros de largo, una multitud enlutada se agrupa alrededor de una fosa recién cavada, en el cementerio de Ornans, en el Franco Condado. A la izquierda, los portadores sostienen el ataúd cubierto con un paño blanco, precedidos por el crucifijo alzado contra el cielo gris. En el centro, el cura lee el oficio, rodeado de monaguillos y de dos pertigueros de túnica roja; ante él, el sepulturero, con una rodilla en tierra, aguarda. A la derecha, los hombres de traje negro y luego las mujeres de toca blanca, pañuelo en mano, forman un largo muro sombrío. Un perro blanco se ha deslizado en primer plano. Detrás, los acantilados calizos que dominan el valle del Loue cierran el horizonte. Los personajes, a tamaño natural, se alinean como un friso, sin protagonista principal."""
evocation = """
Courbet da a gente corriente, el cura, notables, viñadores, sus propias hermanas, la dignidad y el formato reservados hasta entonces a las escenas religiosas, mitológicas o históricas. No hay cielo abierto, ni ángel, ni consuelo: solo la muerte tal como se vive en una pequeña ciudad de provincia, con sus distracciones y sus pañuelos. Courbet habría dicho más tarde que este cuadro era en realidad el entierro del romanticismo. También se ha leído en él un manifiesto político: pintado al día siguiente de la revolución de 1848 y de la instauración del sufragio universal masculino, hace del pueblo de un municipio rural el tema de un lienzo monumental. El cráneo colocado al borde de la fosa recuerda la fragilidad de la vida, sin énfasis, como un simple hecho."""
histoire = """
Courbet pinta el lienzo en Ornans, su ciudad natal, entre el verano de 1849 y 1850, en una estancia de la casa familiar tan estrecha que no puede tomar ninguna distancia para juzgar el conjunto. Los habitantes acuden a posar uno a uno; entre las mujeres se reconoce a las tres hermanas del pintor. El cuadro se expone en el Salón que se abre en París a finales del año 1850. Los críticos se indignan por la fealdad de los rostros y la trivialidad del tema, tratado a una escala juzgada desmesurada; otros saludan un arte nuevo, fiel a lo real, y Courbet se convierte en cabeza de fila del realismo. Permaneció en su familia tras su muerte; el cuadro es donado al Estado en 1881 por su hermana Juliette; ingresa en el Louvre y después en el Museo de Orsay a su apertura, en 1986."""
facture = """
Courbet trabaja sobre una preparación oscura, de la que hace surgir los rostros y los blancos: sobrepellices, tocas, paño mortuorio, medias del sepulturero. La paleta, voluntariamente austera, está dominada por los negros, que modula con gran riqueza, realzados solo por el rojo de los pertigueros. La pasta es espesa y generosa. La composición rechaza la pirámide clásica: las figuras se estiran en un largo friso horizontal, apretadas unas contra otras bajo una franja de cielo bajo. Courbet se inspira en las imágenes populares y en los grandes retratos de grupo holandeses más que en los modelos académicos."""
details = [
  "El cráneo colocado sobre la tierra, al borde de la fosa, en el centro del primer plano.",
  "El paño mortuorio blanco, sembrado de lágrimas y de huesos cruzados negros, a la izquierda.",
  "Los dos pertigueros de rostros rubicundos y túnicas rojas, detrás del cura.",
  "El crucifijo que se recorta solo sobre el cielo, por encima de la multitud.",
  "El perro blanco, en primer plano a la derecha, indiferente a la ceremonia.",
]
themes = ["muerte", "provincia", "pueblo", "religión", "manifiesto"]
anecdote = """
Para la Exposición Universal de 1855, el jurado rechaza este lienzo y El taller del pintor. Courbet construye entonces a sus expensas, muy cerca, su propio pabellón, al que bautiza «Del Realismo»: una de las primeras exposiciones individuales organizadas por un artista él mismo."""
salle = 3
mur = "nord"
place = 3
largeur = 4.5

[[oeuvres]]
titre = "Labranza en el Nivernais"
artiste = "Rosa Bonheur"
annee = "1849"
image = "labourage-nivernais.jpg"
technique = "Óleo sobre lienzo, 134 × 260 cm"
collection = "Museo de Orsay, París"
note = "Dos yuntas de bueyes voltean la tierra de una ladera del Nièvre: el encargo del Estado que convirtió a Rosa Bonheur en una celebridad."
description = """
En una ladera, bajo un gran cielo claro, dos yuntas de bueyes avanzan de izquierda a derecha trazando su surco. La primera ocupa toda la mitad derecha del cuadro: animales macizos, blancos y rojizos, uncidos de dos en dos por un yugo fijado a los cuernos, con la cabeza baja por el esfuerzo. Un boyero de sombrero negro alza su larga aguijada en medio de ellos; detrás, un labrador en camisa blanca guía el arado de madera. Más lejos, a la izquierda, sigue la segunda yunta, conducida por otros campesinos. En primer plano, la tierra recién removida forma grandes terrones pardos. Más allá, una colina arbolada, unas nubes y un vasto cielo azul pálido ocupan más de la mitad del lienzo."""
evocation = """
El cuadro celebra la tierra y a quienes la trabajan, al día siguiente de la revolución de 1848, cuando la República busca imágenes del pueblo y de la Francia rural. A menudo se lo ha relacionado con las primeras páginas de la novela de George Sand, La charca del diablo (1846), donde el narrador contempla a un labrador que conduce sus bueyes en el Berry. Pero en Rosa Bonheur los verdaderos héroes son los animales: su fuerza, su peso, su paciencia están expresados con un respeto casi fraterno, sin sentimentalismo. La obra traduce su convicción de que los animales merecen ser estudiados con tanta atención como los hombres. Para una mujer, pintar a esta escala, en un género considerado viril, era en sí una afirmación."""
histoire = """
En 1848, Rosa Bonheur, de veintiséis años, obtiene una medalla de primera clase en el Salón, y el Estado le encarga un cuadro. Elige pintar el Nivernais, cuyos bueyes y paisajes estudia sobre el terreno, y un momento preciso del trabajo agrícola: el sombrage, la primera labor, que voltea y airea la tierra. Expuesto en el Salón de 1849, el lienzo conoce un gran éxito y consolida su reputación, que pronto llegará a Inglaterra y a los Estados Unidos. El cuadro se expone en el Museo del Luxemburgo, consagrado a los artistas vivos, y después se incorpora a las colecciones del Louvre; se presenta en el Museo de Orsay desde 1986."""
facture = """
Rosa Bonheur pinta con la precisión de una naturalista: cada buey tiene su pelaje, su musculatura, su mirada, fruto de innumerables estudios realizados en granjas, ferias y mataderos. La pincelada es lisa y cuidada en los animales, más libre en la tierra, donde unos empastes pardos dan relieve a los terrones. La composición en largo friso, con los animales desfilando de perfil, recuerda los bajorrelieves antiguos. La luz franca acentúa el pelaje claro de los bueyes, que se recorta sobre la colina verde y sobre el cielo inmenso."""
details = [
  "El boyero que blande su aguijada en medio de la primera yunta.",
  "El buey rojizo, único animal oscuro entre los pelajes claros.",
  "Los yugos atados a los cuernos, a la manera del Nivernais.",
  "Los terrones de tierra removida, pintados uno a uno en primer plano.",
  "La firma de la artista, abajo del todo a la derecha.",
]
themes = ["animales", "labranza", "campo", "trabajo", "tierra"]
anecdote = """
Para estudiar a los animales sin ser importunada en las ferias de ganado y los mataderos, Rosa Bonheur obtuvo de la prefectura de policía un «permiso de travestimiento», que la autorizaba a llevar pantalón, prohibido a las mujeres en París sin dispensa."""
salle = 3
mur = "sud"
place = 3
largeur = 2.6

[[oeuvres]]
titre = "Las espigadoras"
artiste = "Jean-François Millet"
annee = "1857"
image = "glaneuses.jpg"
technique = "Óleo sobre lienzo, 83,5 × 110 cm"
collection = "Museo de Orsay, París"
note = "Tres campesinas recogen las espigas olvidadas tras la cosecha: Millet da a los más pobres del campo una grandeza de estatua."
description = """
En primer plano de un campo segado, tres mujeres recogen las espigas que han quedado sobre el rastrojo. Dos de ellas están inclinadas hasta el suelo, una tendiendo la mano hacia una espiga, la otra apretando ya un puñado de tallos; la tercera, a medio incorporar, se dispone a agacharse a su vez. Sus tocas azul, roja y ocre son las únicas notas vivas del cuadro. Detrás de ellas, en una luz dorada de finales de verano, la llanura se extiende hasta perderse de vista: enormes almiares, un carro cargado de gavillas, una multitud de segadores trabajando, una granja. A la derecha, un hombre a caballo vigila la cosecha. Todo el ancho del campo separa a las espigadoras de esa abundancia."""
evocation = """
El espigueo era un antiguo derecho concedido a los más pobres: tras la cosecha, podían recoger lo que los segadores habían dejado. Millet hace de él la imagen del trabajo más humilde, repetido sin fin, con la espalda encorvada. No cuenta ninguna anécdota: los rostros permanecen en la sombra, los cuerpos macizos y lentos tienen la gravedad de figuras bíblicas, y a menudo se ha relacionado la escena con la historia de Rut espigando en el campo de Booz, que había pintado unos años antes. Bajo el Segundo Imperio, una parte de la crítica ve en ella, sin embargo, una provocación, casi una llamada a la revuelta, a causa del contraste entre la miseria del primer plano y la riqueza del fondo. Millet, por su parte, se defendía de hacer política."""
histoire = """
Establecido desde 1849 en Barbizon, en el linde del bosque de Fontainebleau, Millet observa durante años a las espigadoras de la llanura de Chailly. De ello extrae dibujos, después un aguafuerte, antes de pintar este lienzo, expuesto en el Salón de 1857. El crítico Paul de Saint-Victor ve en él «las tres Parcas del pauperismo». El cuadro se vende a un precio modesto. Pero la reputación de Millet crece tras su muerte, en 1875, y sus obras alcanzan entonces sumas considerables. En 1890, el lienzo ingresa en el Louvre gracias a Jeanne-Alexandrine Pommery, viuda de un negociante de champán de Reims, que lo dona al Estado. Se presenta en el Museo de Orsay desde 1986."""
facture = """
Millet construye el lienzo en dos registros claramente separados: abajo, en una sombra ligera, las tres figuras macizas de contornos simplificados; arriba, la llanura bañada de luz, pintada con toques finos y claros que se pierden en la calima. Los tres cuerpos forman un friso rítmico, como un movimiento descompuesto: agacharse, recoger, incorporarse. La gama está dominada por los ocres, los pardos y los dorados del rastrojo, realzados por tres notas de color en las tocas y las mangas. El modelado suave, casi esculpido, debe mucho a Miguel Ángel y a Poussin, a quienes Millet admiraba."""
details = [
  "El diminuto jinete que vigila la cosecha, en el extremo derecho.",
  "Los almiares y el carro cargado de gavillas, a la izquierda, en la luz.",
  "El puñado de espigas que aprieta la espigadora del medio.",
  "La mano de la espigadora de la izquierda, que roza el suelo.",
  "La bandada de pájaros que gira en el cielo, arriba a la derecha.",
]
themes = ["trabajo", "campesinos", "pobreza", "cosecha", "campo"]
anecdote = """
En 2000, la cineasta Agnès Varda se inspira en este cuadro para su documental Los espigadores y la espigadora, dedicado a quienes, todavía hoy, recogen los restos de los campos, de los mercados y de los contenedores de basura."""
salle = 3
mur = "ouest"
