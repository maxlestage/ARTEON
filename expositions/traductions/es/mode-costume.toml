[[oeuvres]]
titre = "Kente de hombre"
artiste = "Tisserands asante (Ghana)"
annee = "siglo XIX"
image = "kente.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Kente_Cloth_MET_1972.56.1.jpeg"
technique = "Algodón y seda, bandas estrechas tejidas y luego cosidas borde con borde"
collection = "Metropolitan Museum of Art, Nueva York (artes de África)"
note = "Una tela de gala de los asante de Ghana, tejida en bandas estrechas, que el hombre lleva drapeada como una toga."
description = """
El maniquí está envuelto en una vasta tela que lo cubre de los hombros a los tobillos y deja el brazo y el hombro derechos desnudos, a la manera de una toga. El tejido forma un damero: rectángulos verdes, amarillos, anaranjados y pardos se alternan, recorridos por finas rayas. Mirando bien, se ve que está hecho de bandas estrechas, cosidas una junto a otra, cuyos motivos se desplazan de una banda a otra. Sobre el hombro izquierdo, el faldón echado hacia atrás deja ver una orla más viva, rayada de rojo, azul y amarillo, que desciende por el delantero. El tejido, grueso y flexible, forma grandes pliegues alrededor del cuerpo y cae hasta los pies."""
evocation = """
Entre los asante, el kente es una tela de prestigio, ligada al poder real. Los más hermosos, tejidos de seda, estaban reservados al rey, el Asantehene, y a su entorno, que los llevaban en las grandes ceremonias; ciertos motivos no podían llevarse sin el consentimiento del rey. Cada dibujo tiene un nombre, a menudo tomado de un proverbio, de un acontecimiento o de un personaje. También se atribuye un sentido a los colores: el amarillo evoca el oro y la riqueza, el verde el crecimiento y las cosechas. Llevar el kente drapeado así es exhibir el rango y la pertenencia. Hoy se ha convertido en un emblema de Ghana y, mucho más allá, del orgullo africano y afroamericano."""
histoire = """
El kente se desarrolló en el reino asante, en el corazón del actual Ghana; la aldea de Bonwire, cerca de la capital Kumasi, sigue siendo su gran centro de tejido. La seda no se producía allí: los tejedores deshacían telas de seda importadas por los mercaderes europeos para recuperar sus hilos, antes de poder comprar hilo. Esta pieza del siglo XIX mezcla algodón y seda. El Metropolitan Museum la adquirió en 1972; su trayectoria anterior no está documentada. En el siglo XIX, el reino asante resistió durante mucho tiempo a los británicos, que incendiaron Kumasi en 1874 y se llevaron una parte del tesoro real, antes de anexionar el país a principios del siglo XX. Nada indica que este kente proceda de esos saqueos."""
facture = """
El kente es tejido por hombres, en un telar horizontal de pedales que solo produce bandas estrechas, de unos diez centímetros de ancho. El tejedor alterna dos maneras: pasadas en las que la trama, muy apretada, oculta la urdimbre y forma bloques de color, y otras en las que hilos suplementarios dibujan pequeños motivos. Las bandas, de varios metros de largo, se cortan después y se cosen borde con borde, desplazando los bloques para obtener el damero. Una gran pieza de hombre reúne a menudo más de veinte bandas."""
details = [
  "El damero de rectángulos verdes, amarillos y anaranjados.",
  "Las costuras entre las bandas estrechas, visibles de cerca.",
  "La orla rayada de rojo y azul, sobre el hombro izquierdo.",
  "El hombro derecho dejado desnudo, como exige la manera de drapearlo.",
]
themes = ["áfrica", "ghana", "tejido", "realeza", "drapeado"]
anecdote = """
Según una leyenda de Bonwire, dos tejedores, Kurugu y Ameyaw, habrían aprendido su arte observando a la araña Ananse tejer su tela, y luego habrían reproducido sus motivos, al principio con fibras de rafia."""
