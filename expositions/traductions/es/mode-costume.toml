[[oeuvres]]
titre = "Furisode con pinos, grullas y flores de ciruelo"
artiste = "Japon, XIXᵉ siècle"
annee = "siglo XIX"
image = "furisode-pins-et-grues.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Furisode_MET_SLP2452_1-retouched.jpg"
technique = "Raso de seda labrado y teñido, bordado de seda, hilos de oro y plata asentados, teñido yūzen, 175,5 × 117 cm"
collection = "Metropolitan Museum of Art, Nueva York (colección Robert Lehman)"
note = "Un quimono de mangas largas para una mujer joven: pinos, grullas y flores de ciruelo bordados en oro sobre una seda naranja."
description = """
El quimono se presenta extendido, con los brazos abiertos, como se cuelga en Japón de un soporte. Forma una gran T de seda naranja vivo. Las mangas, muy largas, caen casi hasta las rodillas. Abajo, viejos pinos de troncos retorcidos alzan sus ramas cubiertas de agujas verdes y azules, sobre un suelo sembrado de hojas de bambú. Más arriba, grullas blancas vuelan entre coronas de flores de ciruelo, blancas, doradas y grises. El cuello, ancho, desciende a lo largo de todo el delantero. El dobladillo, engrosado con un relleno, forma un bordón que da peso al bajo de la prenda. Cerca del suelo, entre los troncos, se distingue lo que parece ser una pequeña tortuga."""
evocation = """
Furisode significa «mangas que ondean». Este quimono de mangas larguísimas está reservado a las mujeres jóvenes solteras: se cuenta que agitar las mangas era una manera discreta de expresar los sentimientos. El decorado reúne símbolos de buen augurio. El pino, siempre verde, y la grulla, que según la tradición viviría mil años, auguran una larga vida; la flor de ciruelo, que se abre al final del invierno, anuncia la renovación. Con el bambú, pino y ciruelo forman los «tres amigos del invierno», que resisten el frío. Una prenda así conviene a los grandes días, el Año Nuevo o una fiesta familiar: expresa a la vez la juventud de quien la lleva y los votos que se hacen por ella."""
histoire = """
Este furisode fue hecho en Japón en el siglo XIX, a finales de la época de Edo o a principios de la era Meiji, cuando el país se abre a Occidente tras dos siglos de aislamiento. Por entonces, los quimonos llegan a Europa y a América: se coleccionan, los pintores visten con ellos a sus modelos y los modistos parisinos se inspiran en ellos para sus abrigos de noche, como hará Poiret. Este pertenece a la colección Robert Lehman, reunida por el banquero neoyorquino y por su padre, Philip Lehman, e ingresada en el Metropolitan Museum en 1975. Allí convive con pinturas del Renacimiento y de los impresionistas, recuerdo del lugar que ocupaban estas telas en las grandes colecciones norteamericanas."""
facture = """
El decorado combina varias técnicas, como suele ocurrir en los quimonos de lujo. El fondo es un raso de seda labrado, quizá teñido con beni, el rojo extraído del cártamo. Una parte de los motivos está teñida según el procedimiento yūzen, en el que una pasta de arroz reserva los contornos antes de pintar los colores. El resto está bordado en punto pasado, con sedas verdes, azules y blancas. Los hilos de oro y de plata, demasiado rígidos para atravesar la tela, se asientan sobre su superficie y se fijan con pequeñas puntadas. Imitaciones con plantilla del teñido por anudado completan el conjunto."""
details = [
  "Las grullas blancas en pleno vuelo, en la parte alta de la prenda.",
  "Las coronas de flores de ciruelo, realzadas con hilos de oro.",
  "Los viejos pinos de troncos nudosos, en la parte baja del quimono.",
  "Las largas mangas, que descienden casi hasta las rodillas.",
  "El dobladillo acolchado, más grueso que el resto de la tela.",
]
themes = ["japón", "quimono", "bordado", "grullas", "buen augurio"]
anecdote = """
El furisode no ha desaparecido: en Japón sigue siendo el atuendo de las mujeres jóvenes el día del paso a la edad adulta, Seijin no hi, que se celebra cada año en enero en todas las ciudades del país."""
