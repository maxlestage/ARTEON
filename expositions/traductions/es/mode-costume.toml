[[oeuvres]]
titre = "Vestido de estilo"
artiste = "Jeanne Lanvin"
annee = "primavera-verano de 1924"
image = "robe-de-style-lanvin.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Robe_de_Style_MET_DT222865.jpg"
technique = "Tafetán de seda, hilos metálicos, perlas y lentejuelas, encaje metálico"
collection = "Metropolitan Museum of Art, Nueva York (Costume Institute)"
note = "En tiempos del vestido recto y corto, Jeanne Lanvin conserva la falda amplia de los vestidos de antaño: es su célebre robe de style."
description = """
El vestido es de tafetán de seda negro, sin mangas, con una cintura baja situada sobre las caderas. Arriba, el corpiño es recto y plano; abajo, la falda se redondea, fruncida, y termina a media pantorrilla. Un amplio escote redondo está bordeado por un cuello transparente, color crema. Sobre el pecho, guirnaldas de lentejuelas plateadas dibujan festones, y dos largas cadenas de lentejuelas cuelgan de los hombros. Sobre la falda, grandes motivos ovalados, bordados con perlas e hilos metálicos sobre fondo verde pálido, parecen colocados al azar. El bajo del vestido está subrayado por dos cintas plateadas y luego por una alta banda de encaje metálico, color plata y champán, que se extiende en corola."""
evocation = """
En la década de 1920, la moda es el vestido tubo, recto y corto, que borra la cintura y las caderas: es el aire de la garçonne. Jeanne Lanvin propone otra feminidad. Su robe de style conserva la cintura baja de su tiempo, pero le devuelve una falda amplia, que recuerda los miriñaques del siglo XVIII y los vestidos de muchachas de antaño. Esta mezcla de nostalgia y de modernidad seduce a las mujeres que no se reconocen en la silueta andrógina. El negro, durante mucho tiempo color de luto convertido en color del chic, sirve aquí de fondo a la plata y a las perlas, que centellean bajo la luz eléctrica de los salones de baile y de los teatros."""
histoire = """
Jeanne Lanvin, primero sombrerera, abre su casa en la rue du Faubourg-Saint-Honoré en 1889. Los vestidos que cose para su hija Marguerite, nacida en 1897, gustan tanto que crea una línea para niños, y después para muchachas y sus madres. En la década de 1920, la robe de style se convierte en su firma, declinada cada temporada en tafetán, terciopelo o muselina, del blanco al negro pasando por el azul que se llamará azul Lanvin. Este pertenece a la colección de primavera-verano de 1924. Fue donado al Metropolitan Museum en 1962 por Mrs. Albert Spalding, y figura entre los numerosos vestidos de estilo conservados en el Costume Institute."""
facture = """
El contraste de las materias lo es todo en el vestido: un tafetán negro lo bastante firme para mantener el volumen de la falda, y bordados que atrapan la luz. Los talleres de bordado de la casa Lanvin trabajan perlas, lentejuelas e hilos metálicos con gran precisión. La falda no descansa sobre ninguna armazón: fruncida en la cintura baja, se sostiene por la rigidez de la tela y, a veces, por una enagua de tul. El encaje plateado del dobladillo, más ligero, hace flotar el bajo del vestido."""
details = [
  "Las guirnaldas de lentejuelas plateadas sobre el pecho.",
  "Las dos cadenas de lentejuelas que cuelgan de los hombros.",
  "Los medallones bordados con perlas sobre la falda negra.",
  "La alta banda de encaje metálico en el bajo del vestido.",
]
themes = ["años locos", "robe de style", "lanvin", "bordado", "negro"]
anecdote = """
El logotipo de la casa Lanvin, todavía en uso, muestra a una madre y a su hijita cogidas de la mano. Dibujado por Paul Iribe, se inspira en una fotografía de Jeanne Lanvin y de su hija Marguerite, tomada en 1907."""
