[[oeuvres]]
titre = "Vestido Delphos"
artiste = "Mariano Fortuny"
annee = "1919–1920"
image = "robe-delphos.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Delphos,_1969.39.1(2).jpg"
technique = "Tafetán de seda plisado, cuello y cinturón estampados en oro, perlas de vidrio (Venecia)"
collection = "Palacio Galliera, museo de la Moda de la Ciudad de París"
note = "Una columna de seda gris plisada: el vestido Delphos, inspirado en una estatua griega, se lleva sin corsé y se guarda enrollado sobre sí mismo."
description = """
Sobre un busto de modista, el vestido cae de un solo trazo, recto, hasta el suelo, donde se ensancha ligeramente y ondula. Toda la seda, de un gris plateado, está recorrida por finos pliegues verticales, apretados e irregulares, que siguen el cuerpo sin ceñirlo. No hay mangas: los hombros están despejados, y el vestido sube hasta el cuello con un pequeño cuello recto. Este cuello y el cinturón, colocado bajo el pecho, están hechos de una misma cinta de seda estampada en oro, de motivos geométricos. A lo largo de los costados, minúsculas perlas de vidrio amarillas forman una línea de puntos brillantes, del hombro al bajo del vestido. Sobre el fondo negro de la fotografía, la seda parece iluminada desde dentro."""
evocation = """
Mariano Fortuny dio nombre a su vestido por el Auriga de Delfos, estatua griega de bronce descubierta en 1896, cuya larga túnica cae en pliegues verticales. La Delphos es un sueño de Antigüedad, como el vestido Imperio un siglo antes, pero va más lejos: se sostiene solo por su tela y viste el cuerpo sin constreñirlo. Al principio se lleva sobre todo en casa, como una lujosa bata, antes de imponerse por la noche. Bailarinas, actrices y mujeres de letras la adoptan. Marcel Proust viste con ella a su heroína Albertine en La prisionera: para el narrador, estos vestidos hacen surgir el recuerdo de Venecia y de sus palacios, y se convierten en la imagen de un deseo que no se deja atrapar."""
histoire = """
Fortuny, pintor e inventor instalado en Venecia, perfecciona la Delphos hacia 1907 con su compañera y futura esposa, Henriette Negrin, y registra en París en 1909 una patente para su procedimiento de plisado. La fabrica después durante décadas en sus talleres venecianos, en numerosos colores, y la vende en París, Londres y luego Nueva York. Este ejemplar, fechado en 1919-1920, formaba un conjunto con un abrigo y un cinturón. Ingresó en 1969 en las colecciones de la Ciudad de París, donación de la señora Faure-Beaulieu, y pertenece hoy al Palacio Galliera. El museo señala que este modelo de cuello alto, que retoma el motivo del cinturón, es bastante raro. En la espalda, una etiqueta lleva la mención Fortuny déposé, fabriqué en Italie."""
facture = """
El secreto del plisado Fortuny nunca se ha desvelado por completo. La seda, teñida en baños sucesivos para obtener matices cambiantes, se plisa a mano y después los pliegues se fijan con calor. Aquí, cinco paños de tafetán se han cosido entre sí para formar un tubo. Las perlas de vidrio, procedentes de Murano, no son solo decorativas: dan peso a la seda y la hacen caer recta. El cuello y el cinturón están estampados con motivos dorados, según los procedimientos de estampación que Fortuny perfecciona para sus terciopelos inspirados en telas antiguas."""
details = [
  "Los finos pliegues verticales, irregulares, que cubren todo el vestido.",
  "El pequeño cuello alto estampado en oro, a juego con el cinturón.",
  "La línea de perlas de vidrio amarillas a lo largo del costado.",
  "El bajo del vestido, que se ensancha ondulando sobre el suelo.",
]
themes = ["antigüedad", "plisado", "venecia", "seda", "invención"]
anecdote = """
Una Delphos no se dobla: se retuerce sobre sí misma como una madeja de lana y se guarda enrollada en una pequeña caja. Fortuny la entregaba así, y el plisado recuperaba su forma al desembalarla."""
