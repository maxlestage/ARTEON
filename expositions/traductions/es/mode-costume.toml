[exposition]
ordre = 68
nom_court = "Moda y traje"
mouvement = "Moda y traje, del siglo XVIII a los años locos"
cadre = "vitrine"
couleur = "#7a3b55"
titre = "Moda y traje, dos siglos de elegancia"
artiste = "Worth, Doucet, Poiret, Fortuny, Lanvin…"
dates = "1765–1924"
accroche = "Exposición virtual · Palacio Galliera, París"
introduction = """
Un vestido cuenta su época: la corte de Luis XV en los miriñaques de un vestido a la francesa, el sueño de la Antigüedad en la muselina Imperio, la edad industrial en los aros de acero de las crinolinas. La visita sigue diez prendas, de 1765 a los años locos, cuando París inventa con Worth, Doucet, Poiret y Lanvin el oficio de gran modista, y se abre a los quimonos del Japón como a las telas de África. La mayoría proceden del Costume Institute del Metropolitan Museum de Nueva York; el vestido Delphos de Fortuny pertenece al Palacio Galliera. El edificio se inspira en este palacio parisino convertido en museo de la Moda: un vestíbulo, una gran galería y tres salas de vitrinas con luz tamizada."""
vitrine = "robe-a-la-francaise.jpg"

[musee]
nom = "Palacio Galliera, museo de la Moda de París"
ville = "París, Francia"
architecte = "Léon Ginain"
construction = "1878–1894"
presentation = """
El palacio nació de la voluntad de una gran coleccionista genovesa, Maria Brignole-Sale, duquesa de Galliera. En 1878 hace levantar al arquitecto Léon Ginain, en la colina de Chaillot, un palacio destinado a mostrar sus cuadros y sus objetos de arte, que piensa donar a la Ciudad de París. Cambia de opinión y sus colecciones parten finalmente a Génova, su ciudad natal: solo el edificio, terminado en 1894, vuelve a París. De estilo renacentista italiano, en piedra clara, se abre a un jardín mediante una fachada de arcadas adornada con estatuas. Tras acoger exposiciones, se convierte en 1977 en el museo de la Moda y del Traje de la Ciudad de París. Sus colecciones, entre las más ricas del mundo, van del siglo XVIII a nuestros días. Como la luz deteriora los textiles, nada se expone allí de forma permanente: el museo presenta sus vestidos en exposiciones sucesivas, en salas de luz tamizada. En 2020, nuevas galerías instaladas en los sótanos abovedados ampliaron el recorrido."""
ici = """
El edificio de ARTEON conserva del Palacio Galliera su piedra clara y sus vitrinas. Se entra por el sur en «El vestíbulo», de siete metros de altura y muros de piedra. Da paso a «La gran galería», de treinta y cuatro metros de largo y diez de alto, de muros rosa empolvado, donde cuatro vestidos van de 1765 a 1872. Al oeste, la sala «La Belle Époque de los modistos» reúne a Doucet y Poiret; al norte, «Los años locos» confronta la Delphos de Fortuny y el vestido de estilo de Lanvin; al este, «Trajes del mundo» presenta un quimono japonés y un kente asante."""

