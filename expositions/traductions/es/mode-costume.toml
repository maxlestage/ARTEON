[[oeuvres]]
titre = "Vestido a la francesa"
artiste = "Couturières anonymes"
annee = "hacia 1765"
image = "robe-a-la-francaise.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Robe_%C3%A0_la_Fran%C3%A7aise_MET_DT5011.jpg"
technique = "Seda brocada; vestido abierto y falda a juego, llevados sobre miriñaques"
collection = "Metropolitan Museum of Art, Nueva York (Costume Institute)"
note = "Un vestido de corte de caderas inmensas: sobre los miriñaques, la seda azul glaciar se extiende casi en horizontal."
description = """
Visto de frente, el vestido es casi tan ancho como alto. El corpiño, muy ajustado, desciende en punta sobre el vientre; las mangas terminan en el codo, con volantes de seda. A ambos lados de la cintura, la falda sale en horizontal antes de caer recta: debajo, unos miriñaques, armazones ligeros sujetos a las caderas, la sostienen. El vestido está abierto por delante y deja ver una falda a juego, guarnecida abajo con dos filas de pliegues. Los bordes de la abertura están cubiertos por una ancha banda de seda plisada, enmarcada por un galón rizado de color oro viejo, que desciende desde el escote hasta el dobladillo. Sobre el fondo azul pálido, pequeños ramilletes de flores y tallos ligeros están sembrados por todas partes, tejidos en la tela. Por detrás, el vestido se alarga en una breve cola que toca el suelo."""
evocation = """
El vestido a la francesa es el gran traje de sociedad del siglo XVIII, llevado en la corte como en los salones. Su anchura no tiene nada de práctico: obliga a pasar las puertas de lado e impone un andar lento y deslizado. Es precisamente lo que se le pide. Exhibe el rango de quien lo lleva, su fortuna y el ocio de una vida en la que no se trabaja con las manos. Las flores sembradas sobre la seda, los tonos pálidos y las guarniciones vaporosas responden al gusto rococó, el de las boiseries, las porcelanas y las fiestas galantes de Watteau y de Boucher. El cuerpo, en cambio, sigue constreñido: bajo el vestido, un corsé de ballenas endereza el busto y afina la cintura. Esta silueta se desvanece en la década de 1780 en favor de vestidos más sencillos, y la Revolución se la lleva con el Antiguo Régimen."""
histoire = """
En el siglo XVIII, un vestido así no es obra de un creador conocido. Primero se elige la tela, que cuesta con mucho lo más caro: una seda labrada, tejida en telares de tiro en los grandes centros sederos, como Lyon o el barrio londinense de Spitalfields. Una costurera la corta y la ensambla, y después una marchante de modas añade las guarniciones, volantes y galones, que se cambian al capricho de la moda. El Metropolitan Museum lo describe simplemente como europeo, hacia 1765: su lugar exacto de fabricación no se conoce. El vestido y su falda, conservados juntos, ingresaron en el Costume Institute en 2001, adquiridos gracias al legado de Irene Lewisohn, una de las fundadoras del museo neoyorquino del arte del traje del que nació el Costume Institute."""
facture = """
El vestido está hecho de paños enteros de seda, ensamblados de modo que se desperdicie lo menos posible una tela preciosa: podía descoserse y volver a montarse según la moda. En la espalda, la seda parte de los hombros en amplios pliegues planos y cae libremente hasta el suelo. Por delante, la abertura del corpiño está rellenada por una pieza añadida, guarnecida con una escalera de pequeños botones. Los bordes están cubiertos de seda plisada en pequeños cuadrados, orlada de galón. Las flores están brocadas: el tejedor las hace aparecer con hilos suplementarios, solo allí donde el motivo lo exige."""
details = [
  "Los miriñaques que ensanchan las caderas sin redondear la falda por delante ni por detrás.",
  "Los volantes de seda en el codo, donde se cosían puños de encaje.",
  "La seda plisada en pequeños cuadrados, orlada de galón, que sigue toda la abertura.",
  "Los ramilletes brocados, sembrados con regularidad sobre el fondo azul pálido.",
  "Las dos filas de pliegues en el bajo de la falda inferior.",
]
themes = ["siglo XVIII", "corte", "miriñaques", "seda", "rococó"]
anecdote = """
Los pliegues que caen de los hombros, en la espalda de estos vestidos, llevan el nombre de Antoine Watteau, que vistió con ellos a tantos de sus personajes. En La enseña de Gersaint, pintada en 1720, una clienta vista de espaldas muestra un hermoso ejemplo, casi medio siglo antes de este vestido."""
salle = 2
mur = "nord"
place = 2
largeur = 1.8

[[oeuvres]]
titre = "Vestido de noche de talle alto"
artiste = "Couturières anonymes"
annee = "1804–1805"
image = "robe-empire.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Evening_dress_MET_DT7445.jpg"
technique = "Muselina de algodón bordada en blanco sobre blanco, con cola (Francia)"
collection = "Metropolitan Museum of Art, Nueva York (Costume Institute)"
note = "Una columna de muselina blanca: en tiempos de la coronación de Napoleón, las elegantes se visten como estatuas antiguas."
description = """
Sobre un maniquí tocado con un turbante, un vestido blanco cae recto hasta el suelo. La cintura está situada muy alta, justo bajo el pecho, y marcada por una banda bordada. El escote cuadrado es amplio y bajo; las mangas son cortos globos fruncidos, rematados por un pequeño volante. Por delante, una columna de rosetas bordadas, unidas unas a otras, desciende desde el cinturón hasta el dobladillo, donde se abre en una orla de follaje. Por detrás, el vestido se alarga en una larga cola redondeada, también ella orlada de bordado, que se extiende por el suelo. Bajo el dobladillo asoma un pequeño zapato plano. Para presentarlo, el museo ha vestido al maniquí con largos guantes, un collar de perlas y un abanico dorado, como para una velada."""
evocation = """
Tras los miriñaques y las sedas brocadas del Antiguo Régimen, este vestido parece venir de otro mundo. Se inspira en las estatuas y los vasos griegos y romanos, que las excavaciones de Pompeya y Herculano y los grabados habían puesto de moda: la mujer se convierte en una columna drapeada. El blanco evoca el mármol, la sencillez una virtud republicana, aunque esa sencillez cueste cara. Los retratos de la época, como Madame Récamier, pintada por David en 1800, muestran el mismo ideal de naturalidad y de gracia antigua. También se ha leído en estos vestidos una forma de libertad: nada de miriñaques, nada de cuerpo rígido, se adivina la línea del cuerpo. Los caricaturistas se burlaban, sin embargo, de aquellas elegantes semidesnudas, que tiritaban en invierno bajo su muselina."""
histoire = """
El vestido data de 1804-1805, los años en que Napoleón Bonaparte se convierte en emperador y se hace coronar en Notre-Dame, el 2 de diciembre de 1804. En torno a Josefina, la corte imperial marca la pauta a toda Europa, y se impone el estilo que se llamará Imperio. La muselina de algodón, durante mucho tiempo importada de la India, se teje ahora también en Europa; es bordada en blanco por bordadoras especializadas. Se ignora quién cosió este vestido y quién lo llevó. La larga cola indica un atuendo de gala, para la noche o las recepciones. El Metropolitan Museum lo adquirió en 1983, gracias a donaciones hechas en memoria de Elizabeth N. Lawrence, y lo presenta como francés."""
facture = """
El vestido es una lección de economía de medios: unos pocos paños rectos de muselina, fruncidos bajo el pecho y en la espalda, bastan para crear la silueta. Toda la riqueza reside en el bordado blanco sobre blanco, hecho a la aguja, en leve relieve, que juega con la luz más que con el color. La cintura alta acorta el busto y alarga la pierna, y la cola, que se extiende por detrás, da al cuerpo la verticalidad de una columna. La tela, casi transparente, se llevaba sobre una camisa y unas enaguas ligeras."""
details = [
  "La banda bordada bajo el pecho, que marca la cintura alta.",
  "La columna de rosetas bordadas en medio del delantero.",
  "La orla de follaje en el bajo de la falda y alrededor de la cola.",
  "Las mangas globo fruncidas, rematadas por un pequeño volante.",
  "El zapato plano, sin tacón, que asoma bajo el dobladillo.",
]
themes = ["imperio", "antigüedad", "muselina", "blanco", "bordado"]
anecdote = """
El estilo llamado Imperio nació antes del Imperio: desde finales de la década de 1790, bajo el Directorio, las elegantes apodadas las Merveilleuses llevaban ya estos vestidos de talle alto en muselina blanca. El nombre se fijó después, a partir del reinado de Napoleón."""
salle = 2
mur = "nord"
place = 4
largeur = 1.6

[[oeuvres]]
titre = "Vestido de baile con crinolina"
artiste = "Couturières anonymes"
annee = "hacia 1860"
image = "robe-a-crinoline.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ball_gown_MET_DT7576.jpg"
technique = "Seda labrada y algodón, llevado sobre una crinolina (probablemente Estados Unidos)"
collection = "Metropolitan Museum of Art, Nueva York (Costume Institute)"
note = "Una inmensa campana de seda azul: hacia 1860, la crinolina de aros de acero reina en los bailes de Europa y América."
description = """
Un maniquí de cabello castaño recogido en un moño se sitúa de tres cuartos, con un abanico de plumas entre las manos. Su vestido forma una campana perfecta, muy ancha en la base, sin un pliegue torcido. El corpiño, ceñido y puntiagudo en la cintura, deja los hombros al descubierto: el escote está bordeado por una berta, esclavina de encaje y cinta azul dispuesta en V. Las mangas son apenas pequeños volantes de cinta. Sobre la falda, un gran motivo tejido despliega sus curvas: largas palmas, como las de los chales de cachemira, blancas y plateadas sobre fondo azul cielo, entre las cuales se abren pequeños ramilletes de flores azules. Ninguna guarnición corta el motivo: la tela se basta a sí misma."""
evocation = """
La crinolina es la silueta del Segundo Imperio, en Francia, y de la América anterior a la guerra de Secesión. Su anchura mantiene las distancias: a una mujer así vestida no se la aborda, se la saluda. La cintura fina, los hombros desnudos y la falda inmensa componen una imagen de feminidad delicada, casi inmóvil, la de la señora de la casa y de la bailarina de salón. Es también un producto de la edad industrial: los aros son de acero, fabricados en gran serie, y las sedas labradas salen de manufacturas cada vez más mecanizadas. Los caricaturistas, Daumier en París o los dibujantes del Punch en Londres, se burlaron de estas jaulas en las que las mujeres parecían encerradas, que volcaban los muebles y atestaban los coches públicos."""
histoire = """
Este vestido de baile fue probablemente hecho en Estados Unidos hacia 1860, a partir de modelos venidos de París, que las revistas de moda difundían con sus grabados en color. Su historia precisa no se conoce: ingresó en el Metropolitan Museum en 1983, donado por Mrs. Frederick van Beuren Joy en memoria de Mrs. Jacob Harsen Halsted. La crinolina misma cambió mucho en pocos años. Al principio una enagua rígida de tejido de crin de caballo y lino, de ahí su nombre, se convierte hacia 1856 en una jaula ligera de aros de acero unidos por cintas. Esta invención permite ensanchar la falda sin superponer pesadas enaguas, y la moda se apodera de ella enseguida, de las cortes de Europa a los salones de Nueva York."""
facture = """
Todo el vestido está concebido para la crinolina que recubre: la falda, fruncida en la cintura, está hecha de varios paños rectos que se ensanchan hasta el suelo. El motivo, muy grande, está tejido en la tela; desde la invención del telar Jacquard a principios de siglo, estos dibujos complejos pueden repetirse mecánicamente sobre grandes longitudes. La berta de encaje colocada sobre los hombros prolonga la línea horizontal del escote y hace parecer la cintura más fina, por contraste con la amplitud de la falda."""
details = [
  "La berta de encaje y cinta dispuesta en V sobre los hombros.",
  "Las grandes palmas blancas inspiradas en los chales de cachemira.",
  "La punta del corpiño, que desciende sobre la falda.",
  "Las pequeñas mangas de volantes de cinta azul.",
  "El abanico de plumas que sostiene el maniquí.",
]
themes = ["crinolina", "baile", "segundo imperio", "seda", "industria"]
anecdote = """
La crinolina se incendiaba con facilidad. En 1871, en Irlanda, Emily y Mary Wilde, hermanastras del futuro escritor Oscar Wilde, murieron a causa de sus quemaduras tras un baile: el vestido de una de ellas se había prendido cerca de una chimenea, y la otra se quemó al intentar socorrerla."""
salle = 2
mur = "nord"
place = 7
largeur = 1.8

[[oeuvres]]
titre = "Vestido de baile con polisón"
artiste = "Charles Frederick Worth"
annee = "hacia 1872"
image = "robe-de-bal-worth.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ball%2Bgown%2BMET%2BDT426.jpg"
technique = "Seda, galones bordados y flecos; casa Worth, París"
collection = "Metropolitan Museum of Art, Nueva York (Costume Institute)"
note = "Un vestido del primer gran modista: la crinolina ha retrocedido, y toda la amplitud se concentra ahora en la espalda."
description = """
De perfil, la silueta ha cambiado: el delantero del vestido es casi plano, y toda la amplitud se va hacia atrás, donde la seda verde agua se hincha en un gran drapeado antes de extenderse en cola por el suelo. El delantero de la falda está cruzado por cuatro anchas bandas horizontales: galones crema bordados con pequeñas flores rojas, azules y amarillas, cada uno rematado por un grueso fleco dorado. El mismo fleco bordea el corpiño, que se abre en solapas sobre el pecho, y la basca que cubre las caderas. Las mangas, largas hasta el codo, terminan en un vuelo con flecos, anudado con un pequeño lazo de terciopelo oscuro. Otros lazos, de azul violáceo, cierran el corpiño sobre el pecho."""
evocation = """
Este vestido muestra el momento en que la crinolina cede su lugar al polisón: un cojín o una pequeña armazón, sujetos en la parte baja de la espalda, sostienen ahora la falda hacia atrás. La mujer se mira de perfil, como una silueta en movimiento, y la cola subraya cada paso. Flecos y galones bordados acumulan los efectos de riqueza, al gusto de una época que ama la abundancia de adornos, tapicerías y pasamanerías. Firmado Worth, el vestido dice también otra cosa: la clienta ya no compra solo una tela y un trabajo, sino el nombre de un creador. Llevar un Worth es seguir el ejemplo de la emperatriz Eugenia, que lo había hecho célebre, y unirse a las princesas y a las ricas norteamericanas que acuden a la rue de la Paix a hacerse vestir."""
histoire = """
Charles Frederick Worth abrió su casa en el número 7 de la rue de la Paix en 1858. Hacia 1872, el Imperio ha caído y la emperatriz Eugenia vive exiliada en Inglaterra, pero la casa ha atravesado la guerra y la Comuna, y su clientela es ya internacional. Las norteamericanas adineradas figuran entre sus mejores clientas: encargan varios trajes en cada estancia y los llevan a Nueva York o a Boston en sus baúles. No se conoce a la primera propietaria de este vestido. Fue donado al Metropolitan Museum en 1946 por Mrs. Philip K. Rhinelander, de una antigua familia neoyorquina. Conservado en varias piezas, da testimonio del cuidado con que estos trajes parisinos se guardaron durante generaciones."""
facture = """
Worth dibuja un modelo y lo hace ejecutar en sus talleres por decenas de operarias, adaptándolo a las medidas de cada clienta. Es famoso por haber organizado su producción en elementos estandarizados, corpiños, mangas y faldas, que se combinan a voluntad. Aquí, el corpiño con basca, muy ajustado, se corta aparte. La falda inferior, cruzada de galones, permanece plana por delante, mientras que la sobrefalda está recogida y drapeada por detrás, sobre el polisón. El juego de las materias, seda lisa, bordado fino y flecos gruesos, da relieve a un color único."""
details = [
  "El drapeado de seda que se hincha en la parte baja de la espalda, sobre el polisón.",
  "Los cuatro galones bordados de flores que cruzan el delantero de la falda.",
  "Los largos flecos dorados, que se movían a cada paso.",
  "Los pequeños lazos oscuros en la muñeca y sobre el pecho.",
  "La cola que se extiende por el suelo, detrás del vestido.",
]
themes = ["alta costura", "polisón", "worth", "flecos", "parís"]
anecdote = """
Worth pasa por ser el primer modista que presentó sus modelos sobre mujeres vivas, antecesoras de las modelos. La primera fue su propia esposa, Marie Vernet, vendedora como él en la casa del sedero Gagelin cuando se conocieron."""
salle = 2
mur = "nord"
place = 9
largeur = 1.6

[[oeuvres]]
titre = "Vestido de baile"
artiste = "Jacques Doucet"
annee = "1898–1900"
image = "robe-de-bal-doucet.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ball_gown_MET_65.184.65a-b_front_CP4.jpg"
technique = "Seda e hilos metálicos, tul, flores de seda"
collection = "Metropolitan Museum of Art, Nueva York (Brooklyn Museum Costume Collection)"
note = "Un vestido de baile de un verde agua cambiante: Doucet, el modista de las actrices, lo convierte en un tallo que se alarga en cola."
description = """
El maniquí lleva un vestido largo de un verde tierno, de reflejos plateados. El corpiño, muy ajustado, se amolda al busto y estrecha la cintura; el escote, en forma de corazón, se suaviza con un drapeado de tul color carne que sube hacia los hombros. No hay mangas: el vestido se sostiene con dos tirantes colocados al borde de los hombros, cada uno adornado con un ramillete de flores de seda de un verde más intenso. La falda, lisa sobre las caderas, se ensancha hacia abajo en corola y se estira por detrás en una cola que dibuja ondas en el suelo. La tela está recorrida por finas quebraduras y destellos, como la superficie de una hoja arrugada."""
evocation = """
Hacia 1900, la moda ama las curvas: las del Art Nouveau, de los tallos y las flores, que se reconocen en la línea misma de este vestido. El cuerpo adopta la forma de una S, pecho hacia delante y caderas arqueadas, gracias a un nuevo corsé de delantero recto. Doucet, apasionado del siglo XVIII, ama los colores pálidos, los tules, los encajes y las flores artificiales: sus vestidos tienen la suavidad de un pastel. Hecho para bailar, este debía centellear a cada movimiento. Pertenece a la Belle Époque, cuando la costura parisina viste a aristócratas, grandes burguesas y actrices, y cuando el atuendo es un asunto de representación social, que se cambia varias veces al día."""
histoire = """
Jacques Doucet dirige entonces una de las casas más refinadas de París, en la rue de la Paix, a pocos pasos de Worth. Sus clientas son mujeres de mundo y actrices célebres, como Réjane o Sarah Bernhardt, a quienes viste tanto en la ciudad como en escena. Se ignora para quién se hizo este vestido. Fue donado al Brooklyn Museum en 1965 por Mrs. Daniel M. McKeon y Robert Hoguet Jr. En 2009, el Brooklyn Museum confió al Metropolitan Museum toda su colección de trajes, una de las más importantes de Estados Unidos, que se conserva ahora en el Costume Institute con el nombre de Brooklyn Museum Costume Collection. Como la mayoría de los vestidos de la época, se compone de varias piezas separadas."""
facture = """
Doucet trabaja la materia tanto como el corte: aquí, una seda asociada a hilos metálicos, cuya superficie arrugada atrapa la luz y pasa del verde a la plata. El corpiño descansa sobre una armazón interior con ballenas que le da su forma sin ningún pliegue visible. La falda está cortada en paños estrechos arriba y anchos abajo, para ceñirse a las caderas y luego abrirse en cola. El tul color carne del escote crea la ilusión de una piel desnuda, y las flores colocadas sobre los hombros sustituyen a las mangas."""
details = [
  "Los ramilletes de flores de seda verde oscuro colocados sobre cada hombro.",
  "El tul color carne que suaviza el escote.",
  "La punta de la cintura, en el centro del corpiño.",
  "Los reflejos plateados de la tela, más visibles en los pliegues.",
  "La cola ondulada que se extiende detrás del vestido.",
]
themes = ["belle époque", "baile", "art nouveau", "seda", "costura"]
anecdote = """
Gran coleccionista, Doucet vende en 1912 sus cuadros y sus muebles del siglo XVIII para volverse hacia el arte de su tiempo. En 1924, aconsejado por André Breton, compra a Picasso Las señoritas de Aviñón, hoy en el Museum of Modern Art de Nueva York."""
