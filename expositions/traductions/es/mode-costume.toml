[[artistes]]
nom = "Couturières anonymes"
vie = "Europa y América del Norte, siglos XVIII–XIX"
biographie = """
Antes de la invención de la alta costura, los vestidos de las mujeres elegantes no llevaban nombre de autor. En París, Luis XIV concede en 1675 a las costureras el derecho de formar su propio gremio y de vestir a las mujeres, lo que hasta entonces hacían los sastres, que conservan la fabricación de los corsés de ballenas. Un vestido nace entonces de la colaboración de varios oficios: el mercader vende la seda, la costurera corta y ensambla, la marchante de modas añade cintas, encajes, flores y galones. Algunos nombres han atravesado el tiempo, como Rose Bertin, marchante de modas de María Antonieta, o Louis-Hippolyte Leroy, que viste a Josefina para la coronación de 1804. Pero la inmensa mayoría de los vestidos conservados en los museos son anónimos. En el siglo XIX, las costureras trabajan en taller o en sus casas, según los grabados de las revistas de moda, y la máquina de coser, difundida a partir de mediados de siglo, acelera su trabajo. En América, adaptan los modelos venidos de París. Casi todos sus nombres se han perdido; sus vestidos, transmitidos en las familias y luego donados a los museos, siguen siendo su única firma."""
style = """
Su arte es el de la tela más que el del corte: la seda es tan cara que se corta lo menos posible y se vuelve a montar al capricho de las modas. El saber hacer se transmite de taller en taller: ajustar un corpiño, montar una falda sobre miriñaques o una crinolina, colocar una guarnición. La silueta cambia según reglas colectivas, fijadas por la corte y luego por las revistas, y no por un creador único. Este es el mundo que Worth trastocará al firmar sus modelos."""

[[artistes]]
nom = "Charles Frederick Worth"
vie = "Bourne (Inglaterra), 13 de octubre de 1825 – París, 10 de marzo de 1895"
biographie = """
Nacido en Lincolnshire, Charles Frederick Worth conoce una infancia difícil tras la ruina de su padre. Adolescente, parte a Londres como aprendiz en casas de tejidos, entre ellas Swan & Edgar, y aprende a conocer las sedas y la clientela elegante. Hacia 1846 se instala en París, sin hablar francés, y entra en Gagelin, casa famosa por sus sedas y sus chales. Allí conoce a Marie Vernet, vendedora, con quien se casa y para quien dibuja vestidos que las clientas reclaman pronto. En 1858 abre con el sueco Otto Bobergh su propia casa en el número 7 de la rue de la Paix. La princesa Pauline de Metternich, esposa del embajador de Austria, lleva sus vestidos en las Tullerías y lo da a conocer a la emperatriz Eugenia, que se convierte en su clienta. Worth viste desde entonces a la corte, a las actrices y a las ricas norteamericanas. Sobrevive a la caída del Imperio y sigue siendo, hasta su muerte en 1895, el modista más célebre del mundo. Sus hijos Gaston y Jean-Philippe se hacen cargo de la casa, que seguirá activa hasta mediados del siglo XX."""
style = """
Worth inventa al modista creador: en lugar de ejecutar las ideas de sus clientas, les propone cada temporada modelos concebidos por él, presentados sobre mujeres vivas, y firma sus vestidos con una etiqueta con su nombre. Ama las sedas suntuosas, a menudo lionesas, los cortes impecables y las siluetas que hace evolucionar, de la crinolina al polisón. Su método, mitad artista, mitad industrial, funda la alta costura parisina."""

[[artistes]]
nom = "Jacques Doucet"
vie = "París, 19 de febrero de 1853 – Neuilly-sur-Seine, 30 de octubre de 1929"
biographie = """
Jacques Doucet nace en una familia de comerciantes parisinos: la casa Doucet, en la rue de la Paix, vende lencería fina, encajes y camisas. Añade allí en la década de 1870 un departamento de costura para señoras, que se convierte en una de las casas más elegantes de París. Las mujeres de mundo y las grandes actrices, Réjane o Sarah Bernhardt, se visten en ella. Doucet sabe reconocer el talento: Paul Poiret hace sus comienzos en su casa, y Madeleine Vionnet trabaja allí antes de abrir la suya. Hombre de gusto, reúne una célebre colección de pinturas, dibujos y muebles del siglo XVIII, que vende en subasta en 1912 para volverse hacia el arte de su tiempo. Aconsejado por escritores como André Breton, compra a Picasso, Matisse, Modigliani, y La encantadora de serpientes del Aduanero Rousseau, que legará al Louvre. Funda también una gran biblioteca de arte y de arqueología, que dona a la Universidad de París, y una biblioteca literaria. Muere en 1929 en Neuilly, donde había hecho instalar un estudio decorado por los creadores Art Déco."""
style = """
Doucet es el modista de la gracia y de la ligereza: tonos pastel, tules, muselinas, encajes antiguos y flores de seda, en un gusto nutrido del siglo XVIII. Sus vestidos, flexibles y vaporosos, favorecen el cuerpo arqueado de la Belle Époque sin parecer pesados. Aporta a la costura el ojo de un coleccionista, atento a las materias raras, y forma a una generación de creadores, entre ellos Poiret y Vionnet, que inventarán la moda del siglo XX."""

[[artistes]]
nom = "Paul Poiret"
vie = "París, 20 de abril de 1879 – París, 30 de abril de 1944"
biographie = """
Hijo de un comerciante de paños parisino, Paul Poiret es colocado joven en un fabricante de paraguas, pero prefiere dibujar vestidos, que vende a casas de costura. Jacques Doucet lo contrata, y luego pasa a Worth antes de abrir su propia casa en 1903. En pocos años impone una silueta nueva, recta y de talle alto, que da a conocer mediante álbumes ilustrados, encomendados a Paul Iribe en 1908 y luego a Georges Lepape en 1911. Instalado en la avenue d'Antin, da fiestas que han quedado célebres, lanza los perfumes Rosine y el taller Martine, colabora con el pintor Raoul Dufy para sus tejidos y viaja por Europa y Estados Unidos para presentar sus modelos. Durante la Primera Guerra Mundial es movilizado y trabaja en el vestuario del ejército. Después de 1918, la moda cambia, más sencilla y más deportiva, y sus gastos se vuelven ruinosos. En la Exposición de Artes Decorativas de 1925, presenta sus creaciones en tres gabarras amarradas en el Sena, pero su casa cierra en 1929. Muere en París en 1944, olvidado y pobre."""
style = """
Poiret corta recto, drapea más que construye, y sueña con un Oriente de teatro: turbantes, túnicas, pantalones de harén, abrigos en forma de quimono. Sus colores vivos, violetas, verdes, anaranjados, rompen con las palideces de la Belle Époque. Es uno de los primeros en hacer de la moda un arte de vivir completo, del perfume a la decoración interior, y en colaborar con pintores e ilustradores. Su gusto por el espectáculo anuncia a los grandes modistos del siglo XX."""

[[artistes]]
nom = "Mariano Fortuny"
vie = "Granada, 11 de mayo de 1871 – Venecia, 2 de mayo de 1949"
biographie = """
Mariano Fortuny y Madrazo es hijo del pintor catalán Marià Fortuny, muerto cuando él tenía tres años, y de Cecilia de Madrazo, de una gran familia de artistas madrileños. Criado en París, e instalado luego en Venecia con su madre en 1889, crece entre las telas antiguas que esta colecciona. Al principio pintor, se apasiona por el teatro y la ópera de Wagner, e inventa sistemas de iluminación escénica, entre ellos una cúpula que difunde una luz indirecta, patentados a principios del siglo XX. Con su compañera, Henriette Negrin, con quien se casará en 1924, se vuelve hacia el textil: la bufanda Knossos, inspirada en los frescos cretenses, y luego el vestido Delphos, hacia 1907. En el palacio Pesaro degli Orfei, donde vive y trabaja, tiñe, plisa y estampa terciopelos y sedas según procedimientos de su invención, y abre después una manufactura de tejidos estampados en la isla de la Giudecca. Sus vestidos se venden en París, Londres y Nueva York. Muere en Venecia en 1949; su palacio se ha convertido en el museo Fortuny."""
style = """
Fortuny es un inventor tanto como un modista. No sigue la moda: crea modelos intemporales, inspirados en la Antigüedad griega, en el Renacimiento veneciano y en Oriente, que produce casi sin cambios durante décadas. Sus sedas plisadas y sus terciopelos estampados en oro juegan con la luz como sus iluminaciones de teatro. Su libertad de corte, que deja libre el cuerpo, ha inspirado a muchos creadores, de Madame Grès a Issey Miyake."""

[[artistes]]
nom = "Jeanne Lanvin"
vie = "París, 1 de enero de 1867 – París, 6 de julio de 1946"
biographie = """
Primogénita de una familia numerosa y modesta, Jeanne Lanvin trabaja desde la adolescencia en casas de sombrerería y de costura. En 1889 abre su propia tienda de sombreros en la rue du Faubourg-Saint-Honoré. Tras el nacimiento de su hija Marguerite, en 1897, le cose vestidos tan encantadores que sus clientas los piden para sus propios hijos: abre una sección para niñas, y luego para muchachas y mujeres. En 1909 ingresa en la cámara sindical de la costura parisina. En la década de 1920, su casa se convierte en una de las más importantes de París: lanza la robe de style, colecciones para el hogar con el decorador Armand-Albert Rateau, una línea para hombres y perfumes, entre ellos Arpège en 1927. Posee sus propios talleres de tintura y de bordado. Sigue al frente de su casa hasta su muerte, en 1946; su hija, convertida en condesa Jean de Polignac, le sucede. Fundada en 1889, la casa Lanvin es hoy la casa de costura francesa más antigua todavía en activo."""
style = """
Lanvin cultiva una elegancia romántica y suave, alejada de la severidad de la garçonne. Sus robes de style, sus bordados minuciosos y sus colores característicos, como un azul profundo que se dice inspirado en los frescos de Fra Angelico, hacen su reputación. Se nutre de la pintura antigua, los trajes históricos y las artes de Oriente, pero traduce estos recuerdos en líneas sencillas y modernas, para vestir juntas a madres e hijas."""

[[artistes]]
nom = "Japon, XIXᵉ siècle"
vie = "Japón, finales de la época de Edo (1603–1868) y comienzos de la era Meiji (1868–1912)"
biographie = """
El quimono desciende del kosode, una prenda de mangas estrechas llevada al principio como ropa interior, que se convierte en el siglo XVI en la prenda exterior de hombres y mujeres. Bajo los shogunes Tokugawa, durante la época de Edo, la paz y el auge de las ciudades enriquecen a los mercaderes, que rivalizan en lujo indumentario pese a las leyes suntuarias destinadas a limitarlo. Kioto sigue siendo su gran centro: los tejedores del barrio de Nishijin producen allí sedas y brocados, y el teñido yūzen, que permite pintar verdaderos cuadros sobre la tela, se desarrolla allí a finales del siglo XVII. Los tintoreros, bordadores y tejedores, organizados en talleres especializados, trabajan según libros de modelos que difunden los motivos de moda. Después de 1868, la era Meiji abre Japón a Occidente; los hombres de la corte y de la administración adoptan poco a poco el traje europeo, pero el quimono sigue siendo la prenda de las mujeres y de las grandes ocasiones. Exportado, coleccionado, fascina a la Europa del japonismo e inspira a pintores y modistos."""
style = """
El quimono conserva un corte inmutable: unas pocas bandas rectas, cortadas de un mismo rollo de tela estrecho, ensambladas en forma de T. Toda la invención reside, pues, en el decorado, concebido como un cuadro que se despliega sobre el cuerpo. Las estaciones, la poesía, los símbolos de buen augurio guían la elección de los motivos; teñido, bordado e hilos de oro se combinan con virtuosismo. Esta belleza plana ha marcado profundamente la moda occidental."""

[[artistes]]
nom = "Tisserands asante (Ghana)"
vie = "Reino asante, actual Ghana, siglos XVIII–XIX"
biographie = """
El reino asante se forma hacia 1700 en torno a Kumasi, bajo el rey Osei Tutu; según la tradición, un Taburete de oro descendido del cielo sella entonces la unión de las jefaturas y encarna el alma de la nación. Rico en el oro de sus minas y en su comercio, el reino domina durante dos siglos una gran parte del actual Ghana. El tejido es allí una actividad de hombres, organizada en aldeas especializadas en torno a la capital, entre ellas Bonwire, puestas bajo la protección del rey. Los tejedores del rey crean para él motivos nuevos, algunos de los cuales le están reservados. En el siglo XIX, el reino se enfrenta a los británicos instalados en la costa en el curso de varias guerras: Kumasi es incendiada en 1874, el rey Prempeh I es exiliado en 1896, y el país es anexionado a la colonia de la Costa de Oro a principios del siglo XX. El kente sobrevive a la colonización y se convierte, tras la independencia de Ghana en 1957, en un símbolo nacional. Hoy siguen trabajando tejedores en Bonwire, en los mismos telares estrechos."""
style = """
El kente es un arte del color y de la geometría. Sobre bandas estrechas, el tejedor alterna bloques llenos y pequeños motivos, y luego las bandas, cosidas de forma desfasada, componen un damero vibrante. Cada combinación lleva un nombre y un sentido, conocidos por los iniciados. Amarillo, verde, rojo, azul y negro se responden con gran viveza. Este arte del ensamblaje ha inspirado a numerosos artistas y creadores, tanto en África como en la diáspora."""
