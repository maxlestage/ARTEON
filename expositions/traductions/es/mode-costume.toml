[[oeuvres]]
titre = "Abrigo de noche"
artiste = "Paul Poiret"
annee = "1912"
image = "manteau-du-soir-poiret.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Opera_coat_MET_DP142046.jpg"
technique = "Raso de seda, terciopelo, hilos metálicos"
collection = "Metropolitan Museum of Art, Nueva York (Costume Institute)"
note = "Un abrigo de noche de raso amarillo, sin botones, para llevar sin corsé: Poiret envuelve el cuerpo como en un quimono."
description = """
Sobre un maniquí de cabello corto esculpido, un amplio abrigo de raso amarillo oro se cruza por delante y desciende hasta los tobillos. No tiene botones: se cierra en forma de cruzado, sujeto en la cintura por un gran broche redondo de terciopelo negro. Un pequeño cuello negro y anchas solapas gris plata enmarcan el busto. Las mangas, muy anchas, caen desde el hombro a la manera de un quimono y terminan en grandes puños. Unas bandas caladas, trabajadas con hilos metálicos color bronce y cardenillo, cubren la parte alta de los brazos, las muñecas y todo el borde derecho del abrigo. Abajo, el faldón delantero se redondea y deja ver, debajo, un vestido negro finamente plisado."""
evocation = """
Paul Poiret se jactaba de haber liberado a las mujeres del corsé: la fórmula es discutida, pues otros modistos iban en el mismo sentido, pero este abrigo muestra bien la ruptura. No ciñe la cintura, envuelve. El cuerpo ya no está esculpido por la costura, está drapeado, como en las prendas de Oriente. Poiret se nutre de un Japón, una Persia y una Turquía soñados, y del choque de los Ballets Rusos, cuyos decorados deslumbrantes entusiasman a París a partir de 1909. El amarillo vivo, el negro y la plata, dispuestos en grandes superficies, rompen con los tonos pastel de la Belle Époque. Llevado para ir a la ópera o al teatro, un abrigo así estaba hecho para una entrada llamativa: en él se parecía menos vestida que disfrazada."""
histoire = """
En 1912, Poiret está en la cumbre de su gloria. Antiguo empleado de Doucet y luego de la casa Worth, abrió su propia casa en 1903 y se instaló en 1909 en un palacete de la avenue d'Antin, cerca de los Campos Elíseos. No se contenta con la costura: en 1911 lanza una casa de perfumes, Rosine, y el taller Martine, donde jóvenes sin formación artística dibujan motivos para telas y decoración. Al año siguiente, en 1913, parte en una gira de conferencias por Estados Unidos, donde sus modelos son copiados en masa. Este abrigo fue adquirido por el Metropolitan Museum en 1982, gracias al legado de Irene Lewisohn, para ilustrar ese momento en que la moda parisina mira hacia Oriente."""
facture = """
Poiret corta en grandes formas simples y líneas rectas, en lugar de modelar la prenda sobre el cuerpo con pinzas y ballenas. La amplitud cae libremente, y es la propia tela, un raso pesado y brillante, la que hace el volumen. Los contrastes son deliberados: raso liso y luminoso frente a bandas caladas y oscuras, terciopelo negro mate frente a raso gris. El cierre, un simple broche en la cintura, recuerda la manera de cruzar un quimono y de sujetarlo con un cinturón."""
details = [
  "El gran broche redondo de terciopelo negro, en la cintura.",
  "Las solapas gris plata y el pequeño cuello de terciopelo negro.",
  "Las bandas caladas de reflejos bronce sobre los hombros y las muñecas.",
  "Las mangas anchas, que caen desde el hombro como las de un quimono.",
  "El vestido negro plisado que se entrevé bajo el abrigo.",
]
themes = ["poiret", "orientalismo", "japonismo", "abrigo", "velada"]
anecdote = """
El 24 de junio de 1911, Poiret da en su jardín la Mil y Dos Noches, una fiesta persa en la que los invitados deben acudir disfrazados a la oriental. A quienes llegan con atuendo de noche ordinario se les ruega vestir un disfraz proporcionado por la casa antes de entrar."""
