[[oeuvres]]
titre = "La vocación de san Mateo"
artiste = "Le Caravage"
annee = "1599–1600"
image = "vocation-saint-matthieu.jpg"
technique = "Óleo sobre lienzo, 322 × 340 cm"
collection = "Capilla Contarelli, iglesia de San Luis de los Franceses, Roma"
note = "Un rayo de luz atraviesa una estancia oscura: Cristo señala al recaudador de impuestos que va a seguirlo."
description = """
En una sala desnuda de muros grises, cinco hombres están sentados en torno a una mesa donde se \
cuenta dinero. Visten las ropas de la Roma de 1600: jubones rayados, sombreros de plumas, \
espada al cinto. A la derecha, casi en la sombra, acaban de entrar dos hombres descalzos y \
envueltos en ropajes a la antigua: Cristo, del que apenas se ve el rostro y la mano tendida, y \
san Pedro, de espaldas. La mano de Cristo señala a uno de los jugadores. Un barbudo, en el \
centro, se señala a sí mismo con el dedo, como para decir «¿yo?», mientras que al extremo de \
la mesa un joven, con la cabeza baja, sigue recogiendo las monedas. Sobre los personajes, una \
ventana de cristales empañados permanece oscura: la luz viene de otra parte, de arriba a la \
derecha, y sigue el gesto de Cristo."""
evocation = """
El Evangelio cuenta en una frase que Jesús vio a Mateo, el publicano, sentado en la mesa de los \
impuestos, y le dijo: «Sígueme». Caravaggio hace de esta llamada un instante suspendido, justo \
antes de la decisión. La luz que cae en diagonal se ha leído como la imagen de la gracia \
divina que irrumpe en un mundo ordinario, en medio del dinero y del juego. La mano de Cristo \
recuerda casi la de Adán en la Creación de Miguel Ángel, en la Capilla Sixtina: la salvación \
responde a la creación. Los historiadores discuten todavía la identidad de Mateo: el barbudo \
que se señala, como quiere la lectura tradicional, o el joven inclinado sobre las monedas, que \
aún no ha levantado los ojos. Esta vacilación forma parte de la fuerza del cuadro."""
histoire = """
El cardenal francés Mathieu Cointrel, llamado Contarelli, fallecido en 1585, había dejado con \
qué decorar su capilla funeraria en San Luis de los Franceses, la iglesia de los franceses de \
Roma. Tras años de retraso, el encargo de los dos lienzos laterales, consagrados a la vocación \
y al martirio de san Mateo, recae en 1599 en Caravaggio, gracias a su protector, el cardenal \
Francesco Maria Del Monte. Es su primer encargo público. Instalados en 1600, los dos lienzos \
causan sensación y hacen célebre a su autor de la noche a la mañana. El pintor añade después \
el cuadro de altar, San Mateo y el ángel, cuya primera versión es rechazada. A diferencia de \
la mayoría de las obras de esta exposición, la Vocación nunca ha abandonado el lugar para el \
que fue pintada: sigue colgada en la capilla."""
facture = """
Caravaggio pinta directamente sobre el lienzo, sin dibujo preparatorio conocido; se han \
detectado en la preparación pequeñas incisiones que le servían de referencias. Sobre un fondo \
pardo muy oscuro, solo hace surgir lo que la luz toca: rostros, manos, mangas blancas. Es el \
contraste violento que se llamará tenebrismo. Los colores francos, rojo, amarillo, verde, se \
reservan para los jóvenes vestidos a la moda. El examen con rayos X ha mostrado que san Pedro \
fue añadido en un segundo momento: en un principio, Cristo entraba solo."""
details = [
  "La mano de Cristo, entreabierta, que recuerda la de Adán en Miguel Ángel.",
  "El anciano de gafas que se inclina sobre el dinero, sin ver nada.",
  "La ventana de postigo abierto, cuyos cristales siguen oscuros.",
  "Los pies descalzos de Cristo y de Pedro, frente a los zapatos y las plumas de los jugadores.",
  "Las monedas que el joven del extremo de la mesa sigue reuniendo.",
]
themes = ["luz", "vocación", "evangelio", "dinero", "claroscuro"]
anecdote = """
En la iglesia de San Luis de los Franceses, la capilla Contarelli está sumida en la penumbra: \
hay que introducir una moneda en una caja para encender la iluminación unos instantes, y ver \
entonces los tres cuadros de Caravaggio salir de la sombra."""
salle = 4
mur = "nord"
place = 2
largeur = 3.4

[[oeuvres]]
titre = "Judit decapitando a Holofernes"
artiste = "Artemisia Gentileschi"
annee = "hacia 1620"
image = "judith-holopherne.jpg"
technique = "Óleo sobre lienzo, 199 × 162,5 cm"
collection = "Galería de los Uffizi, Florencia"
note = "Judit y su criada sujetan al general asirio y le cortan el cuello: la escena bíblica más violenta del siglo."
description = """
Sobre un lecho de sábanas blancas, un hombre tumbado de espaldas, con la cabeza hacia el \
espectador, se debate. Dos mujeres lo dominan. La criada, tocada con un turbante, pesa con todo \
su peso sobre su pecho y le inmoviliza los brazos. Judit, con vestido de seda dorada de mangas \
remangadas, le sujeta firmemente el pelo con una mano y, con la otra, le hunde una espada en el \
cuello. La sangre brota en hilos y resbala por la sábana hasta el borde del colchón. El rostro \
de Holofernes, con los ojos muy abiertos, expresa el terror. Los tres cuerpos forman un \
entramado de brazos que converge hacia la hoja, en el centro exacto del lienzo. Alrededor, el \
fondo es completamente negro: la tienda del general, sumida en la noche, ha desaparecido."""
evocation = """
El libro de Judit cuenta cómo una viuda judía salva su ciudad de Betulia, asediada por el \
ejército asirio, seduciendo y luego matando al general Holofernes. El tema era corriente, pero \
Artemisia hace de él un acto físico, casi un trabajo de carnicería, en el que las dos mujeres \
actúan juntas con fría determinación. A menudo se ha leído el cuadro a la luz de su vida: \
violada en 1611 por el pintor Agostino Tassi, tuvo que afrontar un juicio humillante. Muchos \
ven en él una venganza pintada; otros historiadores advierten contra esta lectura demasiado \
biográfica y recuerdan que se trata ante todo de una demostración de oficio, destinada a \
rivalizar con Caravaggio en un tema que él mismo había tratado."""
histoire = """
Artemisia había pintado una primera versión del tema hacia 1612-1613, hoy en el Museo de \
Capodimonte, en Nápoles. Establecida en Florencia tras su matrimonio, retoma la composición, \
más grande y más refinada, hacia 1620, sin duda para el gran duque Cosme II de Médici. Según \
una tradición a menudo repetida, la gran duquesa habría encontrado el cuadro tan espantoso que \
se lo habría relegado a un rincón oscuro del palacio Pitti, y la pintora habría necesitado el \
apoyo de su amigo Galileo para obtener su pago. Durante mucho tiempo poco mirada, la obra \
permaneció en las colecciones de los Médici, pasadas al Estado, y pertenece hoy a los Uffizi, \
donde figura entre los cuadros más admirados."""
facture = """
Artemisia aprendió de su padre, Orazio Gentileschi, amigo de Caravaggio, la pintura del modelo \
vivo y la iluminación lateral que recorta las figuras sobre el negro. A ello añade un lujo de \
telas típicamente florentino: seda adamascada del vestido, terciopelo rojo de la colcha, \
sábana blanca arrugada. La composición está construida en triángulo en torno a la hoja, y los \
brazos de los tres personajes se cruzan como los radios de una rueda. Los chorros de sangre, \
pintados en arcos regulares, son de una precisión casi clínica."""
details = [
  "El brazalete de Judit, adornado con medallones donde se reconoce a Ártemis, que da nombre a la pintora.",
  "Los chorros de sangre que dibujan arcos, y los regueros sobre la sábana blanca.",
  "La empuñadura de la espada, en forma de cruz, justo en el centro del cuadro.",
  "El puño apretado de la criada sobre el pecho de Holofernes.",
]
themes = ["biblia", "violencia", "heroína", "mujeres", "claroscuro"]
anecdote = """
En 1616, Artemisia Gentileschi se convierte en la primera mujer admitida en la Accademia delle \
Arti del Disegno de Florencia, la academia fundada bajo Cosme I de Médici, que le permitía \
comprar ella misma sus colores y firmar sus propios contratos."""
salle = 4
mur = "ouest"
place = 2
largeur = 1.62

[[oeuvres]]
titre = "El tramposo del as de diamantes"
artiste = "Georges de La Tour"
annee = "hacia 1636–1638"
image = "tricheur-as-de-carreau.jpg"
technique = "Óleo sobre lienzo, 106 × 146 cm"
collection = "Museo del Louvre, París"
note = "En torno a una partida de cartas, tres cómplices se conciertan para desplumar a un joven ingenuo."
description = """
Cuatro personajes se mantienen alrededor de una mesa cubierta con un tapete verde, sobre un \
fondo oscuro. A la derecha, un joven ricamente vestido, con sombrero de plumas y jubón \
bordado, mira su juego sin sospechar nada; ante él, un montón de monedas de oro. En el centro, \
una mujer de escote adornado con perlas, tocada con un turbante rojo de plumas, lanza una \
mirada oblicua a su criada, que le sirve un vaso de vino. A la izquierda, un hombre de rostro \
en sombra se vuelve hacia nosotros: a su espalda, saca de su cinturón un as de diamantes, que \
se dispone a deslizar en su juego. Nadie habla, pero las miradas y las manos cuentan toda la \
historia."""
evocation = """
El cuadro escenifica, según una lectura corriente en el siglo XVII, las tres tentaciones que \
pierden a la juventud: el juego, el vino y la lujuria. El joven es una figura del hijo \
pródigo, destinado a la ruina. Pero La Tour no predica: nos hace cómplices. El tramposo nos \
mira, y somos los únicos que vemos su carta oculta, como en el teatro cuando el público sabe \
más que la víctima. La escena retoma un tema puesto de moda en Roma por Caravaggio, en sus \
Tramposos, pero La Tour hace de ella una comedia silenciosa y estática, de una ironía muy \
fría. Se ha visto en ella un reflejo de la sociedad de la Lorena en guerra, donde el dinero y \
la astucia decidían a menudo la suerte de los hombres."""
histoire = """
Como casi toda la obra de La Tour, el cuadro no está documentado por ningún texto de su época, \
y su fecha solo se conoce por el estilo. El pintor hizo dos versiones: una, con un as de \
tréboles, se encuentra en el Kimbell Art Museum de Fort Worth, en Texas; la otra, con un as de \
diamantes, es esta. Olvidada durante cerca de tres siglos, reaparece en el siglo XX en una \
colección particular, en el momento en que se redescubre a su autor. Su adquisición por el \
Museo del Louvre, en 1972, hizo mucho ruido y suscitó vivos debates. Figura hoy entre los \
cuadros más populares del departamento de pinturas."""
facture = """
En este cuadro «diurno», iluminado por una luz del día lateral, La Tour simplifica las formas \
hasta la geometría: el rostro de la cortesana es un óvalo casi perfecto, la mesa un bloque, \
las manos pequeñas arquitecturas. Las superficies son lisas, sin huella de pincel visible. Las \
telas, por el contrario, están detalladas con esmero: bordados del jubón, rayas del corpiño, \
plumas de los tocados. La gama juega con rojos y oros que resaltan sobre el fondo negro."""
details = [
  "El as de diamantes sacado del cinturón, a espaldas del tramposo.",
  "Los ojos de la cortesana, vueltos de lado hacia la criada, sin mover la cabeza.",
  "El vaso de vino tinto que la criada sostiene en la mano.",
  "Las monedas de oro apiladas ante el joven, listas para cambiar de manos.",
]
themes = ["juego", "trampa", "vicios", "miradas", "comedia"]
anecdote = """
La Tour había sido completamente olvidado. En 1915, el historiador del arte alemán Hermann Voss \
le devuelve dos nocturnos del museo de Nantes; la exposición de los «Pintores de la realidad» \
en la Orangerie, en París en 1934, termina de devolverlo a la luz."""
salle = 4
mur = "sud"
place = 2
largeur = 1.46

[[oeuvres]]
titre = "Las tres Gracias"
artiste = "Pierre Paul Rubens"
annee = "hacia 1630–1635"
image = "trois-graces.jpg"
technique = "Óleo sobre tabla de roble, 221 × 181 cm"
collection = "Museo del Prado, Madrid"
note = "Las tres diosas de la gracia y de la alegría, enlazadas en un jardín: un himno a la carne, conservado por Rubens hasta su muerte."
description = """
Tres mujeres desnudas se sujetan por los hombros y la cintura, en una ronda inmóvil, en medio \
de un paisaje abierto. La del centro se ve de espaldas; sus dos compañeras, de tres cuartos, se \
vuelven hacia ella e intercambian miradas tiernas. Un velo transparente pasa de una a otra y \
subraya la curva de los cuerpos. Sobre ellas, una guirnalda de rosas cuelga entre dos árboles, \
y un paño blanco está colgado de una rama. A la derecha, una fuente de piedra esculpida lleva \
un pequeño Amor que sostiene una cornucopia de la que mana el agua. A la izquierda, a lo \
lejos, unos ciervos pacen en una pradera bañada de luz. Las carnes, muy claras, se recortan \
sobre el cielo azul y los verdes del jardín."""
evocation = """
Hijas de Zeus según la mitología griega, las tres Gracias, Aglaya, Eufrósine y Talía, \
encarnan la belleza, la alegría y la abundancia; su ronda simboliza desde la Antigüedad la \
generosidad, el don que circula y regresa. Rubens retoma la pose clásica, una figura de \
espaldas entre dos de frente, pero la libra de toda frialdad de estatua. Sus Gracias son \
mujeres de carne, de cuerpos plenos y pieles nacaradas, el ideal de belleza de la Flandes del \
siglo XVII. A menudo se han reconocido en la Gracia de la izquierda los rasgos de Helena \
Fourment, con la que el pintor se casó en 1630, a los cincuenta y tres años, cuando ella tenía \
dieciséis: el cuadro sería también un canto de amor y de felicidad de su vejez."""
histoire = """
Rubens pinta este cuadro para sí mismo, en los años felices de su segundo matrimonio, y lo \
conserva en su casa de Amberes hasta su muerte, en 1640. En la venta de sus bienes, el rey de \
España Felipe IV, su mayor admirador, hace comprar por sus agentes varios cuadros del taller, \
entre ellos este. La obra llega así a Madrid y a los palacios reales, donde permanece cerca de \
dos siglos antes de entrar en el Museo del Prado, abierto en 1819 para presentar al público \
las colecciones de la Corona. Gracias a esta pasión de Felipe IV, el Prado posee hoy uno de los \
conjuntos más ricos del mundo de cuadros de Rubens."""
facture = """
Rubens pinta sobre una gran tabla de roble, con capas finas y fluidas que dejan adivinar por \
momentos el fondo claro. Las carnaciones se construyen con veladuras superpuestas: blanco \
nacarado, rosas, y ligeros reflejos azulados en las sombras, que dan a la piel su \
transparencia. La pincelada, muy libre en el paisaje y la guirnalda, se vuelve más fundida en \
los cuerpos. La composición se organiza en torno al velo que une las tres figuras y a la \
diagonal de los brazos."""
details = [
  "El velo transparente que pasa de una Gracia a otra y las une.",
  "Los diminutos ciervos en la pradera, a la izquierda, bajo los árboles.",
  "El pequeño Amor de piedra sobre la fuente, a la derecha, con su cornucopia.",
  "El número de inventario real, pintado en blanco en la esquina inferior izquierda.",
]
themes = ["mitología", "desnudo", "belleza", "amor", "jardín"]
anecdote = """
Durante su estancia en Madrid en 1628-1629, Rubens traba amistad con el joven Velázquez, \
veintidós años menor: según Francisco Pacheco, suegro de Velázquez, los dos pintores visitan \
juntos el monasterio de El Escorial."""
salle = 2
mur = "nord"
place = 4
largeur = 1.81

[[oeuvres]]
titre = "La Inmaculada Concepción de los Venerables, llamada «de Soult»"
artiste = "Bartolomé Esteban Murillo"
annee = "hacia 1678"
image = "immaculee-conception.jpg"
technique = "Óleo sobre lienzo, 274 × 190 cm"
collection = "Museo del Prado, Madrid"
note = "La Virgen se eleva sobre una nube, llevada por una nube de angelitos: el modelo sevillano de la Inmaculada Concepción."
description = """
En el centro de un cielo dorado, una joven vestida con una túnica blanca y un gran manto azul \
se eleva, con las manos cruzadas sobre el pecho y los ojos vueltos hacia lo alto. Un halo \
luminoso brilla alrededor de su cabeza, y una fina media luna aparece bajo sus pies. A su \
alrededor, una nube de angelitos rollizos forma una espiral: algunos sostienen ramas y cintas, \
otros la miran o juegan entre las nubes, otros no son más que cabezas aladas que se funden en \
la bruma. El manto, levantado por el viento, se enrolla en torno a su cuerpo y acompaña el \
movimiento ascendente. El fondo pasa del oro luminoso, alrededor del rostro, a grises azulados \
en las esquinas."""
evocation = """
El dogma de la Inmaculada Concepción, que afirma que María fue concebida sin pecado original, \
no era aún oficial en el siglo XVII, pero Sevilla lo defendía con pasión. Murillo fijó su \
imagen para generaciones: una muchacha muy joven, pura y dulce, entre el cielo y la tierra, \
según la mujer «vestida del sol, con la luna bajo los pies» del Apocalipsis. Los colores, \
blanco de la pureza y azul del cielo, se convierten en los de la Virgen en toda la iconografía \
católica. Tras la peste que había matado a cerca de la mitad de los sevillanos en 1649, estas \
visiones tiernas y consoladoras respondían a la necesidad de consuelo de una ciudad probada. \
El cuadro pertenece al último período de Murillo, el más vaporoso."""
histoire = """
El canónigo Justino de Neve, amigo y mecenas de Murillo, encarga el cuadro para la iglesia del \
hospital de los Venerables Sacerdotes de Sevilla, un asilo para los sacerdotes ancianos que él \
había fundado. Durante la ocupación francesa de Sevilla, el mariscal Soult, gran saqueador de \
obras de arte, se apodera de él. En su venta póstuma, en 1852, el Museo del Louvre lo compra \
por 615 300 francos: es entonces el precio más alto jamás pagado por un cuadro. Permanece en \
el Louvre cerca de noventa años, hasta 1941, cuando el gobierno de Vichy lo cede a la España \
de Franco en el marco de un intercambio de obras de arte. Entra entonces en el Museo del Prado."""
facture = """
Murillo practica aquí su «estilo vaporoso»: los contornos se disuelven en una luz dorada, los \
angelitos nacen de la bruma con toques ligeros y transparentes. Solo la figura de la Virgen \
está construida con volúmenes netos, lo que la hace avanzar hacia nosotros. La composición \
dibuja una espiral ascendente, típica del barroco, desde el grupo de ángeles de abajo hasta el \
rostro alzado. Los pliegues del manto azul, muy amplios, dan movimiento a una figura por lo \
demás inmóvil."""
details = [
  "La fina media luna bajo los pies de la Virgen, medio oculta entre las nubes.",
  "Los angelitos de abajo, que tienden los brazos hacia ella.",
  "El rostro alzado de María, vuelto hacia una luz que no se ve.",
  "Las cabezas de ángeles casi borradas en la bruma dorada, arriba a la izquierda.",
]
themes = ["virgen", "devoción", "cielo", "ángeles", "sevilla"]
