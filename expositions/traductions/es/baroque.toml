[[oeuvres]]
titre = "Los pastores de la Arcadia (Et in Arcadia ego)"
artiste = "Nicolas Poussin"
annee = "hacia 1638–1640"
image = "et-in-arcadia-ego.jpg"
technique = "Óleo sobre lienzo, 85 × 121 cm"
collection = "Museo del Louvre, París"
note = "Tres pastores descifran una inscripción en un sepulcro: incluso en el país de la felicidad, la muerte está presente."
description = """
En un paisaje de colinas y árboles bajo un cielo azul surcado de nubes, tres pastores y una \
joven se mantienen en torno a un gran sepulcro de piedra. Uno de los pastores, con una rodilla \
en tierra, sigue con el dedo las letras grabadas en la piedra: ET IN ARCADIA EGO. Otro, \
apoyado en el monumento, inclina la cabeza para leer. El tercero se vuelve hacia la mujer, de \
pie a la derecha, con vestido azul y manto amarillo, la mano en la cadera, y parece preguntarle \
el sentido de la inscripción. Ella lo escucha, tranquila, con la mirada baja. Las figuras, \
pocas, se disponen a uno y otro lado del sepulcro, como en un bajorrelieve antiguo."""
evocation = """
La Arcadia es, desde Virgilio, el país ideal de los pastores, de la poesía y del amor. La \
frase latina, «Et in Arcadia ego», significa «Yo también estoy en la Arcadia»: es la Muerte \
quien habla, o quizá el difunto enterrado allí. Los pastores descubren que la propia felicidad \
es mortal. En una primera versión, pintada hacia 1627 y conservada en Chatsworth, en \
Inglaterra, Poussin mostraba una escena más agitada; aquí, la sorpresa deja paso a la \
meditación. El historiador Erwin Panofsky mostró cómo el cuadro se desliza de una advertencia, \
«recuerda que vas a morir», hacia una ensoñación melancólica sobre el pasado. La mujer, \
serena, se ha leído como una figura de la sabiduría."""
histoire = """
Poussin pinta el lienzo en Roma, donde vive desde 1624, poco antes de su estancia en París, \
adonde Luis XIII y Richelieu lo llaman en 1640. No se conoce con certeza al comitente. El tema \
mismo venía de Italia: el pintor Guercino había representado ya a dos pastores que descubrían \
un cráneo colocado sobre una piedra con la misma inscripción. El cuadro entra en las \
colecciones de Luis XIV en 1685 y pasa luego al Museo del Louvre con la Revolución. Se \
convierte en los siglos XVIII y XIX en una de las imágenes emblemáticas del clasicismo \
francés, copiada y meditada por los alumnos de la Academia."""
facture = """
Poussin construye su cuadro con el rigor de un arquitecto. Para ordenar sus composiciones, \
disponía en una caja pequeñas figuras de cera vestidas con paños que iluminaba como una escena \
de teatro. Los cuatro personajes, inspirados en la escultura antigua, se equilibran en torno \
al sepulcro, y los gestos de las manos guían la mirada hacia la inscripción. Los colores, azul, \
amarillo, rojo, se responden de una figura a otra. El paisaje, sobrio, sirve de marco a la \
reflexión."""
details = [
  "La inscripción grabada, ET IN ARCADIA EGO, bajo el dedo del pastor arrodillado.",
  "La sombra del brazo del pastor sobre la piedra, en la que se ha querido ver una guadaña.",
  "La mano que la joven, a la derecha, posa sobre el hombro del pastor.",
  "Las montañas azuladas en el horizonte, a la izquierda, bajo un cielo nuboso.",
]
themes = ["muerte", "arcadia", "pastores", "meditación", "antigüedad"]
anecdote = """
A partir de los años 1960, el cuadro ha alimentado teorías esotéricas sin fundamento, que \
vinculan el sepulcro con un supuesto tesoro de Rennes-le-Château, en el Aude. Los historiadores \
del arte nunca han hallado en ello el menor indicio serio."""
salle = 5
