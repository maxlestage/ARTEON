place = 2
largeur = 1.25

[[oeuvres]]
titre = "Puerto de mar con el embarque de la reina de Saba"
artiste = "Claude Lorrain"
annee = "1648"
image = "embarquement-reine-de-saba.jpg"
technique = "Óleo sobre lienzo, 149 × 197 cm"
collection = "National Gallery, Londres"
note = "Al sol naciente, la reina de Saba deja su palacio para ir a visitar al rey Salomón."
description = """
Un puerto imaginario se abre al mar, frente al sol, que se levanta justo sobre el horizonte. A \
la derecha, un palacio de columnas, coronado de estatuas, desciende hacia el muelle por una \
gran escalinata: la reina de Saba y su séquito bajan los peldaños, hacia una barca que la \
espera. A la izquierda se alzan las ruinas de un templo de columnas corintias, tras las cuales \
están amarrados unos veleros. En el centro, una torre redonda y un arco que cierran la rada, y \
un gran navío anclado. En primer plano, unos porteadores cargan cofres en barcas. El reflejo \
del sol traza sobre el agua un camino de luz que conduce directamente al espectador."""
evocation = """
La Biblia cuenta que la reina de Saba, habiendo oído hablar de la sabiduría del rey Salomón, \
partió a encontrarlo con camellos cargados de aromas, de oro y de piedras preciosas. Claudio \
elige el momento de la partida, pero la reina ocupa solo un pequeño lugar: el verdadero tema \
es la luz de la mañana, que inunda el cielo, se refleja en el agua y dora las fachadas. Esta \
partida hacia lo desconocido evoca el viaje, la esperanza, la promesa de un encuentro. El \
paisaje, a la vez antiguo y moderno, compone una especie de edad de oro soñada, donde la \
historia sagrada se mezcla con la vida de un gran puerto mediterráneo. Se ha visto en él el \
nacimiento de un paisaje poético, hecho para la contemplación."""
histoire = """
Claudio pinta el cuadro en Roma en 1648 para Federico Mauricio de La Tour d'Auvergne, duque de \
Bouillon, como pareja del Paisaje con el matrimonio de Isaac y Rebeca, conservado también en \
Londres. Guarda una copia dibujada en su Liber Veritatis, el libro donde consignaba cada uno \
de sus cuadros para distinguirlos de las falsificaciones. Tras varios propietarios, los dos \
lienzos llegan a Inglaterra, donde Claudio era especialmente admirado, y forman parte de la \
colección de John Julius Angerstein. En 1824, la compra de esta colección por el Estado \
británico da origen a la National Gallery: este puerto de mar es, pues, uno de sus primeros \
cuadros."""
facture = """
Claudio es uno de los primeros pintores en colocar el propio sol en su cuadro y en pintar a \
contraluz. Toda la composición está regulada sobre este punto luminoso: los edificios, entre \
bastidores a uno y otro lado como en un escenario, abren una perspectiva hacia el horizonte. \
La luz se degrada del amarillo pálido al azul, y la perspectiva aérea hace palidecer los \
lejanos. Las figuras, muy pequeñas, fueron a veces confiadas, según sus biógrafos, a \
colaboradores."""
details = [
  "El disco del sol, apenas levantado, a ras del horizonte.",
  "El cortejo de la reina de Saba, en los peldaños del palacio, a la derecha.",
  "Los cofres de presentes que se cargan en la barca, en primer plano.",
  "El reflejo del sol que ondula sobre el agua hasta la parte baja del cuadro.",
]
themes = ["puerto", "sol", "viaje", "biblia", "paisaje"]
anecdote = """
Turner admiraba tanto este cuadro que legó dos de sus propios lienzos a la nación con una \
condición: que fueran colgados junto a dos Claudios, entre ellos este. Todavía hoy pueden \
verse lado a lado en la National Gallery."""
