[exposition]
ordre = 40
nom_court = "Barroco"
mouvement = "Barroco"
cadre = "baroque"
couleur = "#7a2e2a"
titre = "El Barroco, el teatro de la luz"
artiste = "Caravaggio, Artemisia, Rubens, Velázquez, Poussin…"
dates = "1599–1678"
accroche = "Exposición virtual · Museo del Prado, Madrid"
introduction = """
En el siglo XVII, la pintura europea busca captar y conmover: luz dramática de Caravaggio, \
carnes palpitantes de Rubens, verdad inquietante de Velázquez, pero también orden sereno de \
Poussin y de Claudio de Lorena. La visita reúne a nueve pintores, de Roma a Sevilla y de \
Amberes a Lorena, en diez lienzos. El edificio se inspira en el Museo del Prado de Madrid: una \
larga galería central abovedada de muros rojo oscuro y, en su centro, la sala donde Las \
Meninas esperan al visitante."""
vitrine = "menines.jpg"

[musee]
nom = "Museo del Prado"
ville = "Madrid, España"
architecte = "Juan de Villanueva"
construction = "1785–1819"
presentation = """
En 1785, Carlos III encarga a Juan de Villanueva la construcción, en el Paseo del Prado, de un \
gabinete de historia natural, pieza maestra de un barrio consagrado a las ciencias junto con el \
vecino Jardín Botánico. Las obras, interrumpidas por la guerra contra Napoleón, concluyen bajo \
Fernando VII, que instala en él los cuadros de las colecciones reales: el Real Museo de \
Pintura y Escultura abre sus puertas el 19 de noviembre de 1819. El edificio neoclásico, de \
ladrillo y granito, se extiende a lo largo del paseo; en el centro de su fachada, un pórtico \
de columnas forma la Puerta de Velázquez. En el interior, una larga galería abovedada, \
iluminada desde lo alto, distribuye las salas. Como los reyes de España coleccionaron a \
Tiziano, Rubens, El Bosco y a sus propios pintores de corte, el Prado reúne los mayores \
conjuntos de Velázquez y de Goya, con Las Meninas y El tres de mayo de 1808. Rafael Moneo lo \
amplió en 2007 en torno al claustro de los Jerónimos."""
ici = """
El edificio de ARTEON retoma la disposición del Prado: una entrada en medio de la fachada y \
una larga galería que lo atraviesa. Se entra por el sur en el vestíbulo de Velázquez y luego en \
la galería central, de cuarenta metros de largo y doce de alto, de muros rojo oscuro. Enfrente, \
al norte, se abre la sala de Las Meninas, cuadrada, de muros verde grisáceo. En el extremo \
oeste de la galería, la sala «El claroscuro», también roja; en el extremo este, la sala «El \
paisaje clásico», de un verde pálido."""

