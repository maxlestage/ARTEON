[[oeuvres]]
titre = "Agnus Dei"
artiste = "Francisco de Zurbarán"
annee = "hacia 1635–1640"
image = "agnus-dei.jpg"
technique = "Óleo sobre lienzo, 37,3 × 62 cm"
collection = "Museo del Prado, Madrid"
note = "Un cordero de patas atadas, tendido sobre una piedra: una imagen del sacrificio de Cristo, de una sencillez absoluta."
description = """
Sobre un fondo enteramente negro, un cordero yace sobre una losa de piedra gris, visto de \
perfil. Sus cuatro patas están atadas con un cordel, y sus pezuñas sobresalen del borde de la \
piedra, hacia nosotros. Su cabeza reposa plana, con los ojos entornados, en una actitud de \
abandono total; unos pequeños cuernos enroscados enmarcan su oreja. Su vellón, muy blanco, \
está rendido rizo a rizo y atrapa toda la luz, que viene de la izquierda. No hay nada más: ni \
paisaje, ni personaje, ni inscripción, ni aureola. El pequeño formato refuerza la impresión de \
intimidad, como si el animal estuviera allí puesto, al alcance de la mano."""
evocation = """
El cordero es uno de los símbolos más antiguos de Cristo: san Juan Bautista lo señala como «el \
Cordero de Dios que quita el pecado del mundo», y el profeta Isaías anuncia un siervo llevado \
como cordero al matadero, sin abrir la boca. El animal de patas atadas, tendido como sobre un \
altar, evoca, pues, la Pasión y el sacrificio aceptado. Pero Zurbarán no recurre a ningún \
atributo religioso: la meditación nace solo de la presencia del animal, de su dulzura y de su \
vulnerabilidad. Se han relacionado estos cuadros con la espiritualidad de las órdenes \
monásticas para las que trabajaba, hecha de silencio y de contemplación. La obra es también un \
bodegón, en sentido propio: una vida que va a ser ofrecida."""
histoire = """
Zurbarán pintó varias versiones de este motivo, en su taller de Sevilla, hacia 1635-1640. \
Algunas llevan una aureola y una inscripción latina, como la del Museo de Arte de San Diego, \
en California; la del Prado, la más despojada, no tiene ninguna. Se ignora para quién fueron \
hechas: su pequeño formato sugiere cuadros de devoción privada, destinados a un oratorio o a \
una celda de convento más que a una iglesia. Conservado durante mucho tiempo en colecciones \
particulares, el lienzo de Madrid entró en el Prado a finales del siglo XX, donde se ha \
convertido en una de las imágenes más reproducidas de la pintura española."""
facture = """
Zurbarán aplica al tema religioso el rigor de los bodegones, las naturalezas muertas \
españolas: un objeto único, iluminado lateralmente, colocado al borde de una repisa sobre un \
fondo negro. La lana está modelada en pequeños rizos de pasta espesa, casi en relieve, que \
contrastan con la superficie lisa de la piedra. El claroscuro, heredado de Caravaggio, aísla \
al animal y le da una presencia escultórica. El dibujo, de una precisión extrema, no deja nada \
al azar."""
details = [
  "El cordel que ata las cuatro patas, justo al borde de la losa.",
  "Los rizos de lana, pintados uno a uno en relieve.",
  "El ojo entornado del cordero, casi dormido.",
  "Las pezuñas que sobresalen de la piedra, como si salieran del cuadro.",
]
themes = ["sacrificio", "cordero", "símbolo", "silencio", "naturaleza muerta"]
anecdote = """
Cuando la clientela sevillana se vuelve hacia Murillo, el taller de Zurbarán exporta por barco \
series enteras de cuadros a la América española, especialmente a Lima y Buenos Aires: santos, \
apóstoles y vírgenes parten por decenas."""
salle = 2
mur = "sud"
place = 3
largeur = 1.2

[[oeuvres]]
titre = "Las Meninas"
artiste = "Diego Velázquez"
annee = "1656"
image = "menines.jpg"
technique = "Óleo sobre lienzo, 318 × 276 cm"
collection = "Museo del Prado, Madrid"
note = "La pequeña infanta, sus damas de honor, sus enanos, su perro y el propio pintor: el cuadro más comentado de la historia del arte."
description = """
En una alta sala del palacio real, en primer plano, la pequeña infanta Margarita Teresa, de \
cinco años, con vestido blanco de guardainfante, está rodeada de dos damas de honor, las \
«meninas»: una, arrodillada, le ofrece un búcaro rojo en una bandeja, la otra esboza una \
reverencia. A la derecha, una enana, Mari Bárbola, y un enano, Nicolasito Pertusato, que \
apoya el pie sobre un gran perro adormilado. Detrás, una dueña con hábito de viuda habla con \
un guardia. A la izquierda, ante un inmenso lienzo visto de espaldas, el propio Velázquez, con \
pincel y paleta en la mano, mira hacia nosotros. Al fondo, un espejo refleja al rey Felipe IV y \
a la reina Mariana, y en el marco de una puerta, un hombre se detiene en los peldaños, en la \
luz."""
evocation = """
¿A quién se mira y quién nos mira? El espejo sugiere que el rey y la reina están en nuestro \
lugar, ante el cuadro: la infanta y su séquito habrían venido a verlos posar. Velázquez \
invierte así el orden habitual del retrato y nos sitúa en el corazón de un juego de miradas \
sin fin. El pintor se representa en él a la par con la familia real, lo que se ha leído como \
una reivindicación de la nobleza de su arte, en una época en que la pintura pasaba todavía por \
un oficio manual. El filósofo Michel Foucault abrió Las palabras y las cosas, en 1966, con un \
análisis de este cuadro; el pintor napolitano Luca Giordano lo habría llamado «la teología de \
la pintura»."""
histoire = """
Velázquez, pintor de la corte desde 1623, pinta el lienzo en 1656 en el Cuarto del Príncipe \
del Alcázar de Madrid, el aposento del antiguo príncipe heredero que le servía de taller. Los \
inventarios del palacio lo llaman entonces La familia de Felipe IV; el título de Las Meninas \
no aparece hasta 1843, en un catálogo del Prado. El cuadro, propiedad del rey, permanece en \
los aposentos privados y solo lo ven unos pocos allegados. En 1734, escapa al incendio que \
destruye el Alcázar. Pasa entonces al nuevo Palacio Real y luego entra en el Museo del Prado en \
su apertura, en 1819. Hoy ocupa la sala 12, en el corazón del museo, a mitad de la galería \
central."""
facture = """
Velázquez pinta con pinceladas rápidas y separadas que, de cerca, no describen nada y, de \
lejos, se vuelven telas, cabellos, reflejos: las cintas de la infanta no son más que unos \
cuantos trazos de rosa. Da cuerpo sobre todo al aire de la estancia. La luz entra por las \
ventanas de la derecha, se posa sobre el grupo del primer plano y luego se extingue \
progresivamente hacia el techo, antes de reaparecer en la puerta del fondo. La gama, muy \
contenida, juega con los grises, los negros y los blancos, realzados con toques de rojo."""
details = [
  "La cruz roja de la orden de Santiago en el pecho del pintor, añadida después de 1659.",
  "El espejo del fondo, donde se reflejan, borrosos, el rey y la reina.",
  "José Nieto, aposentador de la reina, en silueta en la puerta luminosa.",
  "El pie del pequeño Nicolasito sobre el lomo del mastín, que no se inmuta.",
  "El pequeño búcaro rojo que la menina tiende a la infanta.",
]
themes = ["corte", "mirada", "autorretrato", "infancia", "espejo", "pintura"]
anecdote = """
En 1656, Velázquez no era aún caballero: la cruz de la orden de Santiago, que recibió en 1659, \
fue pintada sobre su jubón más tarde. Una leyenda cuenta que el rey Felipe IV la trazó él \
mismo, tras la muerte del pintor."""
salle = 3
mur = "nord"
place = 2
largeur = 2.76

[[oeuvres]]
titre = "La fragua de Vulcano"
artiste = "Diego Velázquez"
annee = "1630"
image = "forge-de-vulcain.jpg"
technique = "Óleo sobre lienzo, 223 × 290 cm"
collection = "Museo del Prado, Madrid"
note = "Apolo viene a anunciar a Vulcano que su mujer Venus lo engaña con Marte: un mito antiguo en una fragua española."
description = """
En una fragua oscura, cinco hombres con el torso desnudo interrumpen su trabajo. A la \
izquierda, un joven coronado de laurel, aureolado de luz y envuelto en un manto anaranjado, \
levanta el dedo para hablar: es el dios Apolo. Frente a él, junto al yunque donde enrojece una \
pieza de metal, Vulcano, el herrero cojo de venda blanca, lo mira boquiabierto. Sus cuatro \
ayudantes, los cíclopes, permanecen inmóviles: uno de espaldas, otro inclinado sobre una \
armadura, otros dos junto al hogar. De los muros cuelgan piezas de armadura, y sobre la \
campana de la chimenea, a la derecha, hay una pequeña jarra blanca. Por la puerta abierta, a \
la izquierda, se vislumbra un cielo azul."""
evocation = """
Velázquez ilustra un episodio de las Metamorfosis de Ovidio: Apolo, el dios del sol que todo lo \
ve, revela a Vulcano que Venus, su esposa, lo engaña con Marte, el dios de la guerra. Ironía \
cruel, Vulcano está justamente forjando una armadura, quizá para su rival. El pintor elige el \
instante de la noticia, cuando cada uno encaja el golpe, y lo trata como una escena de la vida \
cotidiana: sus dioses y sus cíclopes son artesanos madrileños, de cuerpos verdaderos y rostros \
atónitos. Se ha visto en él a la vez una lección de pintura del desnudo, hecha para rivalizar \
con los italianos, y una reflexión sobre la luz divina que entra en el taller del artesano."""
histoire = """
Velázquez pinta el lienzo en Roma en 1630, durante su primer viaje a Italia, que Felipe IV le \
había permitido emprender para estudiar a los maestros antiguos y modernos. Realiza al mismo \
tiempo La túnica de José, hoy en el monasterio de El Escorial. No son encargos: el pintor los \
hace por iniciativa propia, como demostraciones de lo que ha aprendido. De regreso a Madrid, \
los conserva unos años, y luego el rey los compra en 1634 para el palacio del Buen Retiro, que \
hace decorar entonces. La Fragua pasa después a las colecciones reales y entra en el Museo del \
Prado en el siglo XIX."""
facture = """
La estancia en Italia transforma la manera de Velázquez. Abandona los fondos pardos y el \
claroscuro violento de sus comienzos sevillanos por una luz más pareja y una gama más clara, \
hecha de grises, ocres y pardos cálidos. Los cuerpos desnudos, estudiados del modelo y de las \
estatuas antiguas, se disponen en friso, como un bajorrelieve. El color vivo se reserva para el \
manto de Apolo, único elemento sobrenatural de la escena. La jarra blanca anuncia al pintor de \
naturalezas muertas."""
details = [
  "La corona de laurel y el halo de luz alrededor de la cabeza de Apolo.",
  "La pequeña jarra blanca sobre la campana de la chimenea, arriba a la derecha.",
  "El trozo de metal enrojecido sobre el yunque, que Vulcano sujeta con unas tenazas.",
  "La sandalia azul de Apolo, única nota de color frío en el suelo.",
]
themes = ["mitología", "desnudo", "fragua", "noticia", "trabajo"]
anecdote = """
En la mitología, los cíclopes, ayudantes de Vulcano, tienen un solo ojo en medio de la frente. \
Velázquez ignora este detalle: sus herreros tienen dos ojos, como cualquier obrero de su \
tiempo."""
salle = 3
mur = "ouest"
