[[artistes]]
nom = "Le Caravage"
vie = "Milán, 29 de septiembre de 1571 – Porto Ercole, 18 de julio de 1610"
biographie = """
Michelangelo Merisi nace en Milán y crece en Caravaggio, la villa lombarda de la que tomará el \
nombre. Aprendiz en Milán del pintor Simone Peterzano, llega a Roma a comienzos de los años \
1590, sin dinero ni relaciones, y pinta al principio frutas y jóvenes disfrazados para \
mercaderes. El cardenal Francesco Maria Del Monte se fija en él, lo aloja en su palacio y le \
consigue en 1599 el encargo de la capilla Contarelli, que lo hace célebre. Siguen grandes \
cuadros de iglesia, algunos de los cuales son rechazados porque los santos tienen en ellos \
pies sucios y rostros del pueblo. Pendenciero, a menudo armado, pasa varias veces por la \
cárcel. En mayo de 1606, mata a Ranuccio Tomassoni en una riña y debe huir de Roma, condenado a \
muerte. Trabaja en Nápoles, luego en Malta, donde es armado caballero antes de ser encarcelado \
y expulsado de la orden, y después en Sicilia. En 1610, cuando espera el perdón del papa, \
muere en la costa toscana, a los treinta y ocho años, en el camino de regreso a Roma."""
style = """
Caravaggio pinta del modelo vivo, sin idealizar: arrugas, uñas negras, frutas estropeadas. \
Sumerge sus escenas en la oscuridad y las ilumina con un haz violento que esculpe los cuerpos, \
y encuadra a sus personajes de cerca, a media figura, como si estuvieran en nuestro espacio. \
Esta revolución hizo nacer en toda Europa el «caravaggismo»: Artemisia Gentileschi, Georges de \
La Tour, el joven Velázquez, Ribera o Rembrandt le deben mucho."""

[[artistes]]
nom = "Artemisia Gentileschi"
vie = "Roma, 8 de julio de 1593 – Nápoles, hacia 1654"
biographie = """
Hija del pintor Orazio Gentileschi, amigo de Caravaggio, Artemisia aprende su oficio en el \
taller paterno, en Roma, pues las mujeres no tienen acceso a las academias. En 1611, es violada \
por Agostino Tassi, un pintor que su padre le había dado como profesor. Orazio presenta una \
denuncia: en el juicio, en 1612, la joven es sometida a tortura para probar la veracidad de su \
testimonio. Casada poco después, se instala en Florencia, donde trabaja para los Médici, traba \
amistad con Galileo y se convierte en 1616 en la primera mujer miembro de la Accademia delle \
Arti del Disegno. Reside después en Roma y en Venecia, y luego se establece en Nápoles a partir \
de 1630. Hacia 1638, se reúne con su padre en Londres, en la corte de Carlos I, antes de \
regresar a Nápoles, donde dirige un taller hasta su muerte. Olvidada durante siglos, es \
redescubierta en el siglo XX y figura hoy entre los pintores más estudiados del barroco."""
style = """
Artemisia retoma el naturalismo y el claroscuro de Caravaggio, pero con una atención \
particular a las telas, a las joyas y a las carnaciones, heredada del gusto florentino. Pinta \
sobre todo heroínas de la Biblia y de la historia antigua, Judit, Susana, Lucrecia, Cleopatra, \
que muestra activas, resueltas, a menudo en lucha. Sus composiciones, poderosas y teatrales, \
la han impuesto como una de las grandes figuras del caravaggismo."""

[[artistes]]
nom = "Georges de La Tour"
vie = "Vic-sur-Seille (ducado de Lorena), 14 de marzo de 1593 – Lunéville, 30 de enero de 1652"
biographie = """
Hijo de un panadero de Vic-sur-Seille, en Lorena, entonces ducado independiente, Georges de La \
Tour recibe una formación de la que casi nada se sabe; quizá viajó a Italia o a los Países \
Bajos, donde habría descubierto la pintura caravaggista. En 1617, se casa con Diane Le Nerf, \
hija de una familia noble, y se instala en 1620 en Lunéville, donde se convierte en un \
notable acomodado, conocido por su carácter duro con los campesinos. La guerra de los Treinta \
Años devasta Lorena: la peste, las hambrunas y los ejércitos no perdonan a Lunéville, \
incendiada en 1638. La Tour reside entonces en París y recibe el título de «pintor ordinario \
del rey»; Luis XIII habría guardado en su cámara uno de sus cuadros de san Sebastián. De \
regreso en Lunéville, muere allí en 1652, pocos días después de su esposa, probablemente de una \
epidemia. Su nombre se hunde luego en el olvido, hasta su redescubrimiento en el siglo XX. No \
se le conocen hoy más que unos cuarenta cuadros."""
style = """
La Tour pintó escenas «diurnas», iluminadas por la luz del día, como El tramposo, y sobre todo \
«nocturnos» donde una sola vela hace surgir de la sombra figuras recogidas, como sus \
Magdalenas o su San José carpintero. Su arte se basa en una simplificación extrema de las \
formas, volúmenes lisos y geométricos, un silencio y una inmovilidad que dan a sus cuadros una \
gravedad casi moderna."""

[[artistes]]
nom = "Pierre Paul Rubens"
vie = "Siegen (Westfalia), 28 de junio de 1577 – Amberes, 30 de mayo de 1640"
biographie = """
Nacido en Westfalia, adonde su padre, protestante, se había exiliado, Rubens crece en Amberes \
tras la muerte de este, recibe una sólida educación humanista y se forma con varios pintores \
de la ciudad. De 1600 a 1608, vive en Italia al servicio del duque de Mantua, estudia a \
Tiziano, a Miguel Ángel y la Antigüedad, y cumple en 1603 una primera misión en España. De \
regreso en Amberes, se convierte en pintor de la corte de los archiduques Alberto e Isabel, se \
casa con Isabella Brant y abre un inmenso taller, del que salen retablos, decoraciones y \
retratos para toda Europa: el ciclo de María de Médici para el palacio del Luxemburgo, el techo \
de Whitehall en Londres. Diplomático, negocia la paz entre España e Inglaterra en 1629-1630 y \
recibe el título de caballero. Viudo en 1626, se casa en 1630 con Helena Fourment, que le \
inspira sus cuadros más sensuales. Muere en Amberes en 1640, en la cima de su gloria."""
style = """
Rubens es el pintor del movimiento y de la abundancia: composiciones en espiral, cuerpos \
poderosos, carnes nacaradas, colores cálidos aplicados con una pincelada fluida y rápida. Une \
la lección de los venecianos, la monumentalidad de Miguel Ángel y el sentido flamenco del \
detalle. Su influencia es inmensa, de Van Dyck a Watteau, Delacroix y Renoir; a finales del \
siglo XVII, los «rubenistas» defenderán contra los partidarios de Poussin la primacía del \
color sobre el dibujo."""

[[artistes]]
nom = "Bartolomé Esteban Murillo"
vie = "Sevilla, bautizado el 1 de enero de 1618 – Sevilla, 3 de abril de 1682"
biographie = """
Último de los catorce hijos de un barbero-cirujano de Sevilla, Murillo queda huérfano a los \
diez años y es criado por su hermana mayor y su cuñado. Se forma con el pintor Juan del \
Castillo y empieza pintando cuadros de devoción vendidos en serie, una parte de los cuales \
parte hacia América. Sevilla es entonces el gran puerto del Imperio español, pero la peste de \
1649 mata en ella a cerca de la mitad de la población. En los años 1650, Murillo se convierte \
en el pintor más solicitado de la ciudad, eclipsando a Zurbarán. Trabaja para la catedral, los \
conventos y las cofradías, como la de la Caridad, para la que pinta una gran serie de obras de \
misericordia. En 1660, funda con Francisco Herrera el Joven una academia de dibujo de la que \
es el primer presidente. Viudo en 1663, permanece en Sevilla toda su vida. Muere en 1682, poco \
después de una caída de andamio ocurrida, según la tradición, mientras pintaba un retablo para \
los Capuchinos de Cádiz."""
style = """
Murillo es el pintor de la ternura: vírgenes juveniles, niños Jesús y pequeños san Juan, pero \
también pilluelos de las calles de Sevilla, pintados con afecto y humor. Su manera evoluciona \
de un claroscuro heredado de Zurbarán hacia un «estilo vaporoso» de contornos fundidos y tonos \
dorados. Considerado en los siglos XVIII y XIX el mayor pintor español, fijó la imagen de la \
Inmaculada Concepción en toda la catolicidad."""

[[artistes]]
nom = "Francisco de Zurbarán"
vie = "Fuente de Cantos (Extremadura), bautizado el 7 de noviembre de 1598 – Madrid, 27 de agosto de 1664"
biographie = """
Hijo de un comerciante de Extremadura, Zurbarán parte a los quince años a hacer su aprendizaje \
a Sevilla. Se instala primero en Llerena, cerca de su pueblo natal, y luego, llamado por las \
grandes órdenes religiosas, regresa a Sevilla, donde el cabildo de la ciudad lo invita a \
establecerse en 1629. Se convierte allí en el pintor de los monjes: cartujos, jerónimos, \
franciscanos, dominicos y mercedarios le encargan grandes ciclos para sus conventos, entre \
ellos los del monasterio de Guadalupe y de la cartuja de Jerez. En 1634, es llamado a Madrid \
para pintar una serie de los Trabajos de Hércules destinada al palacio del Buen Retiro, donde \
trata a Velázquez. Pero a partir de los años 1640, el gusto sevillano se vuelve hacia Murillo, \
más suave; Zurbarán trabaja cada vez más para la exportación a América. En 1658, se instala en \
Madrid, suaviza su manera, y muere allí en 1664 en una situación modesta."""
style = """
Zurbarán pinta figuras monumentales e inmóviles, monjes en meditación, santas con vestidos de \
seda, con un claroscuro heredado de Caravaggio y un dibujo de gran nitidez. Sus blancos, en \
particular los de los hábitos monásticos, figuran entre los más bellos de la pintura. Sus \
escasos bodegones, unos pocos objetos alineados sobre un fondo negro, han fascinado a los \
pintores modernos por su desnudez."""

[[artistes]]
nom = "Diego Velázquez"
vie = "Sevilla, bautizado el 6 de junio de 1599 – Madrid, 6 de agosto de 1660"
biographie = """
Diego Rodríguez de Silva y Velázquez entra a los doce años en el taller del pintor sevillano \
Francisco Pacheco, con cuya hija, Juana, se casa en 1618. Sus primeras obras, escenas de cocina \
y de taberna, muestran la influencia de Caravaggio. En 1623, pinta al joven rey Felipe IV, que \
lo nombra pintor de cámara: ya no abandonará Madrid, salvo para dos viajes a Italia, en \
1629-1631 y luego en 1649-1651, donde pinta el retrato del papa Inocencio X. Rubens, llegado a \
Madrid en 1628, lo anima a estudiar a los maestros italianos. En palacio, Velázquez acumula \
cargos: organiza las decoraciones, compra cuadros para el rey y se convierte en 1652 en \
aposentador mayor de palacio. En 1659, consigue por fin ser armado caballero de la orden de \
Santiago, tras una larga investigación sobre sus orígenes. En 1660, organiza las ceremonias de \
la boda de Luis XIV y de la infanta María Teresa, en la isla de los Faisanes, y muere poco \
después de su regreso a Madrid."""
style = """
Velázquez pasa de un naturalismo sombrío y preciso a una pintura cada vez más libre, donde unas \
pocas pinceladas bastan para sugerir una tela o un reflejo. Pinta el aire y la luz de una \
estancia, y mira con la misma dignidad al rey, a los enanos de la corte y a los artesanos. \
Manet, que descubre sus cuadros en Madrid en 1865, lo llama el «pintor de los pintores»; los \
impresionistas y Picasso le deben mucho."""

[[artistes]]
nom = "Nicolas Poussin"
vie = "Les Andelys (Normandía), junio de 1594 – Roma, 19 de noviembre de 1665"
biographie = """
Nacido cerca de Les Andelys, en Normandía, Nicolas Poussin decide muy joven ser pintor y se \
traslada a París, donde lleva una vida difícil durante una decena de años. Tras dos intentos \
fallidos, llega a Roma en 1624 y permanece allí casi toda su vida. Encuentra allí a un \
protector, el erudito Cassiano dal Pozzo, que le abre su biblioteca y sus colecciones de \
antigüedades, y una clientela de aficionados cultos, a menudo franceses. En 1640, Luis XIII y \
Richelieu lo llaman a París como primer pintor del rey, pero las intrigas de la corte y las \
grandes decoraciones del Louvre lo cansan: vuelve a partir hacia Roma en 1642. Pinta allí, \
para coleccionistas fieles como Paul Fréart de Chantelou, cuadros de caballete de gran \
profundidad: la serie de los Siete Sacramentos, paisajes, y por último Las cuatro estaciones. \
Enfermo, con las manos temblorosas, muere en Roma en 1665 y es enterrado en la iglesia de San \
Lorenzo in Lucina."""
style = """
Poussin es el maestro del clasicismo francés: composiciones pensadas como demostraciones, \
donde cada gesto y cada color tienen su razón, inspiradas en Rafael y en la escultura antigua. \
Quería que la pintura se dirigiera al espíritu tanto como a los ojos. La Academia Real hizo de \
su arte un modelo, y los «poussinistas» defendieron en ella la primacía del dibujo; David, \
Ingres y Cézanne se reclamaron de él."""

[[artistes]]
nom = "Claude Lorrain"
vie = "Chamagne (ducado de Lorena), hacia 1600 – Roma, 23 de noviembre de 1682"
biographie = """
Claude Gellée, llamado el Lorenés, nace en un pueblo de los Vosgos lorenenses, en una familia \
modesta. Huérfano, parte muy joven a Italia; según sus primeros biógrafos, habría sido empleado \
al principio como pastelero o sirviente. En Roma, se convierte en ayudante del pintor de \
paisajes y decorados Agostino Tassi, y luego pasa dos años en Nápoles. Tras un breve regreso a \
Lorena, se instala definitivamente en Roma en 1627. En los años 1630, su reputación de \
paisajista está hecha: el papa Urbano VIII, cardenales, príncipes romanos y el rey de España \
Felipe IV, para su palacio del Buen Retiro, le encargan cuadros. Para protegerse de los \
imitadores, lleva desde 1635 aproximadamente el Liber Veritatis, una recopilación de cerca de \
doscientos dibujos que reproducen sus lienzos, hoy en el British Museum. No se casa, pero cría \
a una hija, Agnese, y vive rodeado de sus sobrinos hasta su muerte, en Roma, en 1682."""
style = """
Claudio inventa el paisaje ideal: puertos y campiñas antiguos bañados de una luz dorada, \
construidos como escenarios de teatro, donde pequeñas figuras cuentan una historia bíblica o \
mitológica. Observa la naturaleza al aire libre, en la campiña romana, pero la recompone en el \
taller. Sus cuadros modelaron el gusto inglés por el jardín paisajista e inspiraron a Turner."""
