[[oeuvres]]
titre = "Los dioses del viento y del trueno"
artiste = "Tawaraya Sōtatsu"
annee = "principios del siglo XVII"
image = "dieux-vent-tonnerre.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Wind_God_and_Thunder_God_Screens_by_Tawaraya_Sotatsu_hi-res.png"
technique = "Par de biombos de dos paneles, tinta y colores sobre papel con hojas de oro, 154,5 × 169,8 cm cada uno"
collection = "Templo Kennin-ji, Kioto (en depósito en el Museo Nacional de Kioto)"
note = "Dos dioses irrumpen de las nubes en los dos extremos de un cielo de oro: a la izquierda, el dios del trueno golpea sus tambores; a la derecha, el dios del viento despliega su saco."
description = """
Dos biombos dorados, de dos paneles cada uno, están colocados uno junto a otro. En el de la \
izquierda, el dios del trueno, Raijin, de cuerpo blanco, surge en lo alto de una nube oscura: \
a su alrededor, un anillo de pequeños tambores que golpea con sus baquetas; tiene el \
cabello erizado, un rictus feroz, y una bufanda flota tras él. En el de la \
derecha, el dios del viento, Fūjin, de cuerpo verde, acude desde el borde sobre otra \
nube, sosteniendo sobre su cabeza un largo saco blanco hinchado, del que escapan los \
vientos. Las dos figuras están empujadas hacia los bordes; entre ellas, un vasto espacio \
de oro permanece vacío. Las nubes, marrones y grises, están hechas de manchas difusas."""
evocation = """
Fūjin y Raijin son divinidades antiguas, venidas de la India y de China con el \
budismo, que se ven también en estatuas en los templos japoneses. Aquí parecen \
irrumpir en el cielo en el mismo instante, como para desencadenar una tormenta. Se han leído \
los dos biombos como una imagen de las fuerzas de la naturaleza, a la vez amenazadoras y \
benéficas, puesto que la lluvia y el viento hacen también crecer el arroz. La comedia de los \
rostros, casi caricaturescos, atempera el terror. El vacío dorado del centro, cargado de \
tensión entre las dos figuras, se cita a menudo como ejemplo del gusto japonés por \
el espacio dejado libre."""
histoire = """
La obra no está firmada ni fechada; se atribuye a Sōtatsu, que dirigía en Kioto un \
taller de pintura de abanicos, el Tawaraya, y trabajaba con el calígrafo \
Hon'ami Kōetsu. Se piensa que la pintó al final de su carrera, en la década de 1620 \
o de 1630. Los biombos pertenecen al Kennin-ji, el templo zen más antiguo de Kioto, \
fundado en 1202, que los confió al Museo Nacional de Kioto; el templo muestra a sus \
visitantes una reproducción fiel. Clasificados como tesoro nacional, se consideran \
una de las obras fundadoras de la escuela Rinpa: Kōrin los copió casi un siglo \
más tarde, y Sakai Hōitsu, en el siglo XIX, copió a su vez la versión de Kōrin."""
facture = """
Sobre el fondo de hojas de oro cuadradas, Sōtatsu pinta los cuerpos en planos espesos, blanco \
para Raijin, verde para Fūjin, perfilados con contornos flexibles a la tinta. Las nubes están \
pintadas con la técnica del tarashikomi, que contribuyó a perfeccionar: se \
deposita una tinta o un color sobre otro todavía húmedo, y se mezclan en \
aureolas irregulares, imprevisibles. Las figuras, en parte cortadas por el borde de los \
biombos, parecen entrar en el cuadro y salir de él, lo que da una impresión de \
movimiento."""
details = [
  "El anillo de tambores de Raijin, cortado por el borde superior del biombo.",
  "El saco de viento blanco que Fūjin sostiene sobre su cabeza.",
  "Las nubes oscuras hechas de manchas que se funden unas con otras.",
