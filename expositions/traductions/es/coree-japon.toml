[[oeuvres]]
titre = "Los lirios (biombo de la derecha)"
artiste = "Ogata Kōrin"
annee = "hacia 1701–1705"
image = "iris-korin.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:KORIN-Irises-R.jpg"
technique = "Biombo de seis paneles, tinta y colores sobre papel con hojas de oro, aprox. 151 × 360 cm (uno de un par)"
collection = "Museo Nezu, Tokio"
note = "Matas de lirios azules se suceden sobre un fondo de oro, como un motivo de tela: el biombo más célebre de la escuela Rinpa."
description = """
Seis paneles verticales, reunidos en un biombo, forman una única superficie de oro. Sobre este \
fondo liso, sin horizonte ni suelo, matas de lirios se suceden de izquierda a derecha en \
un friso ondulante: largas hojas verde vivo, rectas o ligeramente inclinadas, y \
flores de un azul profundo, casi negro algunas, más claro otras. Los \
grupos suben y luego bajan, dejando entre sí vacíos de oro. No se ve ni \
agua, ni puente, ni personaje. El fondo está hecho de cuadrados de hoja de oro, cuyas \
juntas se adivinan. Abajo a la derecha, una firma a la tinta y un sello redondo identifican al \
pintor. El segundo biombo del par, que no se presenta aquí, prolonga el friso \
hacia la izquierda."""
evocation = """
Los lirios remiten a un episodio célebre de los Cuentos de Ise, colección de relatos poéticos \
del siglo X: un noble que ha abandonado la capital llega a Yatsuhashi, los «Ocho \
Puentes», donde florecen lirios al borde de una marisma; compone un poema cuyos \
versos comienzan cada uno por una sílaba de la palabra kakitsubata, lirio, y sus compañeros lloran \
al pensar en Kioto. Kōrin suprime el puente, los viajeros, el paisaje: solo quedan \
las flores, y el espectador culto reconoce la historia. Reducir un relato a un motivo \
decorativo, para una élite que amaba esas alusiones literarias, está en el corazón de la \
estética Rinpa. La obra habla también del mundo de Kōrin, hijo de mercaderes de telas, \
para quien la pintura y el diseño textil estaban próximos."""
histoire = """
Kōrin pinta este par de biombos hacia 1701–1705, poco después de recibir el título \
honorífico de hokkyō, que menciona en su firma. Se ignora para quién. Los \
biombos pertenecieron durante mucho tiempo al Nishi Hongan-ji, uno de los grandes templos de Kioto, \
que los conservó durante más de dos siglos. Ingresan después en la \
colección del industrial Nezu Kaichirō; tras su muerte, en 1940, su residencia de Tokio \
y sus colecciones se convierten en el museo Nezu, que abre al público en 1941. Clasificados como \
tesoro nacional, los dos biombos son tan frágiles que solo se muestran una vez \
al año, en primavera, en la estación en que florecen los lirios del jardín del museo."""
facture = """
Kōrin aplica sus colores en planos uniformes, sin sombra ni modelado: el azul de azurita para las \
flores, el verde de malaquita para las hojas, dos pigmentos minerales molidos, espesos y \
mates, que destacan sobre el oro. Algunas matas se repiten casi idénticas de un \
panel a otro; se ha pensado que utilizaba plantillas, como en el teñido de las \
telas que vendía su familia. El ritmo, regular pero variado, recuerda el de un \
motivo de kimono. Desplegado en zigzag, el biombo hacía además jugar la luz sobre \
el oro, panel tras panel."""
details = [
  "Los grupos de flores que se repiten de un panel a otro, casi idénticos.",
  "Los dos azules de las flores, uno muy oscuro, otro más claro.",
  "Los cuadrados de hoja de oro y sus juntas, visibles en el fondo.",
  "La firma y el sello redondo de Kōrin, abajo a la derecha.",
]
themes = ["lirios", "oro", "poesía", "rinpa", "motivo"]
anecdote = """
Más tarde, Kōrin retoma el tema en otro par de biombos, donde pinta esta \
vez el puente de madera en zigzag que atraviesa los lirios. Estos Lirios de Yatsuhashi se \
conservan hoy en el Metropolitan Museum de Nueva York."""
