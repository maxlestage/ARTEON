[[oeuvres]]
titre = "Pinos en la niebla (biombo de la derecha)"
artiste = "Hasegawa Tōhaku"
annee = "finales del siglo XVI"
image = "pins-dans-la-brume.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hasegawa_Tohaku_-_Pine_Trees_(Shōrin-zu_byōbu)_-_right_hand_screen.jpg"
technique = "Biombo de seis paneles, tinta sobre papel, 156,8 × 356 cm (uno de un par)"
collection = "Museo Nacional de Tokio"
note = "Unos pocos pinos aparecen y se desvanecen en la niebla: con tinta sola y mucho papel vacío, Tōhaku pinta la humedad del aire."
description = """
Sobre seis paneles de papel ligeramente beige, bordeados de seda dorada y de una fina \
varilla lacada, unos pinos surgen del blanco. A la izquierda, un grupo de troncos apretados: \
el más nítido, en el tercer panel, lleva ramas frondosas de un negro profundo, \
mientras que tras él otros pinos, más pálidos, se disuelven en el gris. En el \
centro, dos paneles quedan casi vacíos, atravesados solo por la sombra de un árbol \
lejano. A la derecha, un pino aislado se inclina, con sus largas ramas extendidas, acompañado \
de siluetas apenas visibles. Al pie de los árboles, unos trazos sugieren el suelo. \
Nada más: ni cielo, ni montaña, ni línea de horizonte."""
evocation = """
El biombo no describe un lugar preciso sino un estado del aire: la mañana, quizá, \
o un día de niebla, cuando los árboles cercanos se recortan y los demás \
se desvanecen. El vacío no es una carencia: figura la propia bruma y deja al \
espectador completar la escena. Se ha querido ver en él los pinares del litoral de Noto, la \
región natal del pintor, o un momento de duelo tras la muerte de su hijo, en 1593; \
estas lecturas siguen siendo hipótesis. La obra se relaciona a menudo con la sensibilidad \
del budismo zen y con la pintura china de Muqi, a quien Tōhaku admiraba. En oposición \
a los fondos de oro de su época, se ha convertido en una de las pinturas más queridas de \
Japón."""
histoire = """
Venido de la provincia de Noto, Hasegawa Tōhaku se impone en Kioto en la década de 1590 frente \
a la escuela Kanō, que domina los grandes encargos. No se sabe ni cuándo ni para quién \
pintó estos pinos, ni siquiera si se trata de una obra acabada: las hojas de papel están \
unidas de manera irregular, y a veces se juzga que los sellos son más tardíos. Por eso \
algunos historiadores ven en ella un boceto, quizá preparatorio de una decoración de \
puertas correderas, montado después como biombo. El par pertenece hoy al \
Museo Nacional de Tokio y está clasificado como tesoro nacional. Frágil, solo se \
presenta al público unas semanas al año, casi siempre en torno al Año \
Nuevo."""
facture = """
Todo está hecho con tinta, más o menos diluida, sobre un papel sin preparación. Tōhaku \
pinta las agujas de pino con un gesto veloz, con un pincel ancho, quizá hecho de \
paja, que deja trazos secos y nerviosos. Los árboles del primer plano se \
trazan con tinta casi pura; los del fondo, en aguada muy clara, con contornos \
que se pierden en el papel. Este trabajo de los valores, del negro al gris más pálido, \
crea una profundidad sin perspectiva, con un solo color."""
details = [
  "El pino más negro, en el tercer panel, y los árboles pálidos tras él.",
  "Los dos paneles del centro, casi vacíos.",
  "El pino inclinado, a la derecha, y sus largas ramas.",
  "Los trazos secos del pincel en las agujas.",
