[exposition]
ordre = 27
nom_court = "Corea y Japón"
mouvement = "Corea y Japón, biombos, celadones y rollos"
cadre = "aucun"
couleur = "#3d6b5c"
titre = "Corea y Japón, el verde del celadón y el oro de los biombos"
artiste = "Goryeo, Joseon, Jeong Seon, Kim Hong-do, Sōtatsu, Kōrin, Tōhaku…"
dates = "siglos XII–XVIII"
accroche = "Exposición virtual · Museo Nacional de Kioto"
introduction = """
Seis siglos de arte a ambos lados del estrecho de Corea. De un lado, el verde profundo \
de los celadones de Goryeo, la blancura desnuda de las jarras luna de Joseon, las montañas \
pintadas del natural por Jeong Seon y las escenas de aldea de Kim Hong-do. Del \
otro, los rollos narrativos de la época de Heian, los biombos de fondo de oro de \
Sōtatsu y de Kōrin, los pinos en la bruma de Tōhaku y un plato modelado por Kenzan y \
pintado por su hermano Kōrin. Diez obras, reunidas en un edificio inspirado en el ala \
Heisei Chishinkan del Museo Nacional de Kioto, diseñada por Taniguchi Yoshio: un gran \
vestíbulo luminoso, una larga galería donde se despliegan los biombos, y tres salas en torno \
a ella, para las cerámicas, la pintura coreana y los rollos."""
vitrine = "dieux-vent-tonnerre.jpg"

[musee]
nom = "Museo Nacional de Kioto"
ville = "Kioto, Japón"
architecte = "Katayama Tōkuma; Taniguchi Yoshio para el ala Heisei Chishinkan"
construction = "1895–1897; ala Heisei Chishinkan inaugurada en 2014"
presentation = """
En 1889, el gobierno Meiji decide fundar tres museos imperiales, en Tokio, en \
Nara y en Kioto, para proteger los tesoros de los templos y santuarios, maltratados por \
los trastornos de los comienzos de la era Meiji. En Kioto, el arquitecto Katayama Tōkuma, \
uno de los primeros japoneses formados en la arquitectura occidental, levanta en el barrio \
de Higashiyama, frente al templo Sanjūsangen-dō, un pabellón de ladrillo rojo de estilo \
neobarroco francés, concluido en 1895: el museo imperial de Kioto abre allí en mayo de 1897. \
Convertido en museo nacional en 1952, conserva sobre todo el arte de la antigua capital, \
pinturas, esculturas, caligrafías y cerámicas, muchas de ellas confiadas en \
depósito por los templos de la ciudad, como los Dioses del viento y del trueno de Sōtatsu, \
propiedad del Kennin-ji. Desde 2014, las colecciones se presentan en el ala Heisei \
Chishinkan de Taniguchi Yoshio, el arquitecto de la ampliación del MoMA de Nueva York: \
un largo volumen horizontal de piedra y vidrio, cuyo gran vestíbulo se baña de \
luz. El pabellón de 1895 fue entonces rebautizado Meiji Kotokan."""
ici = """
El edificio de ARTEON toma prestada del ala de Taniguchi su sobriedad: muros claros color \
de papel y de piedra, largas perspectivas, luz uniforme. Se entra por el sur en \
el Gran vestíbulo, de dieciocho metros de ancho y nueve de alto. Al norte se abre la Galería de los \
biombos, de treinta metros de largo, donde se responden Kōrin, Tōhaku y Sōtatsu. Desde allí se \
accede al oeste a la Sala de las cerámicas y sus vitrinas, al norte a la Sala de la \
pintura coreana, y al este a la Sala de los rollos, consagrada a los relatos pintados de \
la época de Heian."""

