[[oeuvres]]
titre = "Jarrón maebyeong con grullas y nubes"
artiste = "Corée, dynastie Goryeo"
annee = "segunda mitad del siglo XII"
image = "maebyeong-grues.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:청자_상감_구름_학_무늬_매병_고려-靑磁象嵌雲鶴文梅甁_高麗-Maebyeong_decorated_with_cranes_and_clouds_MET_DP240189.jpg"
technique = "Gres con decoración incrustada bajo cubierta de celadón, alt. 33,5 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Unas grullas blancas vuelan entre pequeñas nubes sobre el verde pálido de un celadón: el decorado no está pintado, está incrustado en la arcilla."
description = """
Un jarrón de algo más de treinta centímetros de alto, de hombro ancho y redondeado, que \
se estrecha hacia abajo y se ensancha ligeramente en el pie; un cuello muy corto, de labio \
repulgado, deja solo una pequeña abertura. Toda la superficie está cubierta de un vidriado \
verde pálido, translúcido, recorrido por finas craqueladuras. Sobre ese fondo, unas grullas blancas \
vuelan en todas direcciones, con las alas desplegadas, unas subiendo hacia el cuello, otras \
descendiendo en picado, con el cuello tendido. Entre ellas flotan pequeñas nubes blancas en forma de \
seta, prolongadas por una larga cola ondulante. En el pie, una greca \
blanca cierra el decorado. Fotografiado entero sobre un fondo gris, el jarrón se \
presenta aquí ampliado más de tres veces."""
evocation = """
En toda Asia oriental, la grulla es el ave de la longevidad y la montura de los \
inmortales taoístas; las nubes evocan el cielo donde estos moran. En un jarrón \
destinado al vino, este vuelo de aves forma un deseo de larga vida y de serenidad, dirigido \
a comensales refinados. La forma maebyeong, tomada del meiping chino, significa \
«jarrón de ciruelo»: a menudo se explica este nombre por la costumbre de colocar en él una rama de \
ciruelo en flor, pero estos jarrones servían ante todo para conservar el alcohol. El verde del \
celadón buscaba recordar el jade, piedra preciosa entre todas. Este jarrón expresa el \
gusto de una aristocracia nutrida de budismo y de cultura china, que supo \
inventar, con la incrustación, un decorado que solo pertenece a Corea."""
histoire = """
El reino de Goryeo, que dio su nombre a Corea, lleva el celadón a su apogeo en el \
siglo XII. Los principales hornos se encuentran en el suroeste de la península, en \
Gangjin y Buan, cerca del mar, desde donde las piezas llegan por barco a la capital, \
Kaesong. En 1123, un enviado del emperador de China, Xu Jing, permanece en Kaesong; en \
su relato de viaje, elogia el color de los celadones coreanos, que los habitantes, \
anota, comparan con el del martín pescador. A principios del siglo XX, numerosas \
tumbas de Goryeo, en torno a Kaesong, son excavadas o saqueadas, y sus celadones \
llegan al mercado del arte, en Japón y luego en Occidente. En ese contexto el \
marchante de arte japonés Yamanaka Sadajirō ofrece este jarrón al Metropolitan Museum, en \
1911."""
facture = """
El alfarero torneó el jarrón de gres y luego, con la arcilla todavía húmeda pero firme, grabó con \
cuchillo las grullas, las nubes y la greca. Rellena los huecos de arcilla blanca o \
negra, rasca el excedente para que la superficie vuelva a quedar lisa, y realiza una primera \
cocción. Aplica después el vidriado, cargado de un poco de hierro, y cuece el jarrón en un \
horno privado de oxígeno: eso es lo que da el verde azulado. Esta técnica \
de incrustación, llamada sanggam, es propia de Corea. Las patas y los picos de las \
grullas, trazados con una línea negra más fina que el blanco, están también incrustados."""
details = [
  "Las grullas que suben y las que descienden en picado, con la cabeza hacia abajo.",
  "Las patas y el pico de las aves, en fina línea negra incrustada.",
  "La cola ondulante que prolonga cada pequeña nube.",
  "La red de craqueladuras del vidriado, visible en el hombro.",
  "La greca blanca sobre el pie.",
]
themes = ["celadón", "grulla", "longevidad", "incrustación", "goryeo"]
anecdote = """
El más célebre maebyeong con grullas y nubes, conservado en el museo Kansong de Seúl, \
está clasificado como tesoro nacional. El coleccionista Jeon Hyeong-pil lo había comprado en 1935 a \
un marchante japonés, por una suma considerable, para conservar ese patrimonio en \
Corea."""
salle = 3
mur = "ouest"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Jarra luna"
artiste = "Corée, dynastie Joseon"
annee = "segunda mitad del siglo XVIII"
image = "jarre-lune.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:백자_달항아리_조선-白磁壺_朝鮮-Moon_Jar_MET_DP231899.jpg"
technique = "Porcelana, alt. 38,7 cm, diám. 33 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una jarra de porcelana blanca casi redonda, sin decoración alguna: su belleza reside en la forma, en la blancura y en sus imperfecciones."
description = """
Una gran jarra casi esférica, algo más alta que ancha, apoyada sobre un pequeño \
pie anular; un cuello corto y recto, apenas ensanchado, abre la panza hacia arriba. \
No lleva decoración alguna, ni pintada ni grabada, solo un vidriado blanco, lechoso, \
ligeramente azulado en algunos puntos. La redondez no es perfecta: el perfil se hincha \
más de un lado que del otro. Unas manchas rosadas, color carne o de óxido \
pálido, se extienden en bandas horizontales por la panza; algunos puntos negros salpican la \
superficie cerca del pie, donde el vidriado deja ver la pasta. De treinta y nueve \
centímetros de altura real, la jarra se presenta aquí ampliada algo más de tres veces."""
evocation = """
El nombre de jarra luna, que solo data del siglo XX, dice bien lo que se ve en ella: un \
astro blanco, lleno, algo irregular, como la luna que se levanta. Estas jarras reflejan \
el ideal de la dinastía Joseon, gobernada según el neoconfucianismo, que apreciaba la \
sencillez, la frugalidad y la pureza del blanco, color que vestían también la mayoría \
de los coreanos en su ropa de todos los días. Se ha visto en ellas la imagen de una belleza sin \
artificio, que acepta la asimetría y los accidentes de la cocción. En el siglo XX, \
artistas coreanos como el pintor Kim Whanki, que las coleccionaba y las pintaba, \
hicieron de ellas un emblema de la identidad coreana; ceramistas de todo el mundo las \
imitan hoy."""
histoire = """
Las jarras luna se produjeron sobre todo entre finales del siglo XVII y el XVIII, \
en los hornos oficiales de Gwangju, al sureste de Seúl, que suministraban la \
porcelana de la corte. Se ignora el uso exacto de cada una: podían contener \
provisiones o alcohol, o simplemente ser admiradas. Su tamaño planteaba un desafío \
técnico, pues una forma tan ancha no podía tornearse de una sola vez en una \
pasta de porcelana. Esta ingresó en el Metropolitan Museum con la colección de arte \
asiático del coleccionista estadounidense Harry G. C. Packard, adquirida por el museo en \
1975, en parte por donación, en parte por compra. Solo subsiste un número limitado de estas \
grandes jarras, conservadas en Corea, Japón, Europa y Estados Unidos."""
facture = """
El alfarero torneó por separado dos grandes cuencos hemisféricos y luego los ensambló \
borde contra borde antes de modelar el cuello y el pie: la unión, a media altura, \
explica el ligero abultamiento y la asimetría del perfil. La pasta, un caolín muy puro, está \
cubierta por un vidriado transparente que adquiere, a alta temperatura, ese blanco lechoso. \
En el horno calentado con leña, el calor nunca era perfectamente uniforme, y la jarra \
se hundió un poco. Las manchas rosadas procederían de la cocción o de lo que la \
jarra contuvo, que habría impregnado la porcelana."""
details = [
  "El perfil, más abombado de un lado que del otro.",
  "Las bandas rosadas que atraviesan la panza a media altura.",
  "El cuello corto, apenas ensanchado, de un blanco más amarillento.",
  "Los puntos negros y la pasta desnuda cerca del pie.",
]
themes = ["porcelana", "blanco", "luna", "sencillez", "joseon"]
anecdote = """
En 1935, el ceramista inglés Bernard Leach compra una jarra luna en Seúl y la \
lleva a Inglaterra diciendo, según se cuenta, que se llevaba la felicidad consigo. \
Hoy se conserva en el British Museum, en Londres."""
salle = 3
mur = "ouest"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Plato cuadrado con chorlitos sobre las olas"
artiste = "Ogata Kenzan"
annee = "hacia 1700"
image = "plat-pluviers.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ogata_Korin_-_Square_Dish_with_Design_of_Plovers_over_Waves_-_1966.365_-_Cleveland_Museum_of_Art.tif"
technique = "Gres, decoración de óxido de hierro bajo vidriado, 22 × 22 × 2,7 cm; decoración pintada por Ogata Kōrin"
collection = "Cleveland Museum of Art"
note = "Kenzan modeló y coció este plato; su hermano mayor, el pintor Kōrin, trazó en él con pincel veloz unos chorlitos que vuelan sobre las olas."
description = """
Un plato cuadrado y poco profundo, de veintidós centímetros de lado, de bordes rectos, \
fotografiado en diagonal sobre un fondo gris. La pasta, color crema, está cubierta por un \
vidriado transparente finamente craquelado. En el fondo del plato, pintada en marrón negruzco, una \
gran ola se enrosca a la izquierda y sus líneas de espuma se despliegan hacia la derecha; \
encima, pequeños pájaros de alas en forma de corazón, los chorlitos, vuelan en \
bandada. Cerca del borde derecho, unos caracteres trazados con pincel forman la firma \
del pintor. En los cuatro bordes exteriores corre un decorado continuo de roleos y \
nubes, donde se abre, en primer plano, una gran flor. El plato se presenta aquí \
ampliado unas cinco veces."""
evocation = """
El chorlito, chidori en japonés, es un ave de orilla cantada desde hace siglos por \
la poesía cortesana: sus gritos en la playa, las noches de invierno, expresan la soledad y el \
frío. Asociado a las olas, forma un motivo clásico que los Ogata retoman con \
una libertad nueva. Este plato ilustra un ideal en el que la pintura, la poesía y el objeto \
de uso no se separan: un plato para pasteles de la ceremonia del té se convierte en el \
soporte de una pintura firmada. Atestigua también la complicidad de dos hermanos, nacidos \
en una rica familia de comerciantes de sedas de Kioto, uno pintor mundano y \
célebre, el otro alfarero y letrado, enamorado de la soledad."""
histoire = """
En 1699, Ogata Kenzan abre su propio horno en Narutaki, al noroeste de Kioto; su \
nombre de artista, que significa «montaña del noroeste», procede de esa ubicación. Su \
hermano Kōrin, pintor ya reconocido, acude a decorar algunas de sus piezas. El trabajo \
se reparte: Kenzan modela el plato, Kōrin pinta en él su motivo, Kenzan aplica el vidriado \
y se encarga de la cocción. Cada uno firma: Kōrin junto a su dibujo, Kenzan en el reverso. Este \
plato formaba parte de un servicio destinado a presentar los pasteles que acompañan al \
té. Perteneció a la colección Ōkōchi, en Tokio, antes de ser vendido por un marchante \
tokiota al museo de Cleveland, en 1966. Otros platos cuadrados pintados por Kōrin se \
conservan en Japón."""
facture = """
Un plato cuadrado no se tornea: se monta a partir de placas de arcilla ensambladas. \
Kōrin pinta en él con óxido de hierro, que se vuelve marrón negruzco con la cocción, con un pincel veloz \
y seguro: la ola en unas pocas curvas, los pájaros en simples manchas dobles. Kenzan \
cubre luego todo con un vidriado transparente, que al enfriarse adquirió una fina \
red de craqueladuras. El contraste entre ese dibujo libre, casi caligráfico, en el \
fondo del plato, y la greca densa y regular de los bordes es característico del arte de los \
dos hermanos."""
details = [
  "La gran ola, a la izquierda, cuya espuma se despliega en líneas paralelas.",
  "Los chorlitos, reducidos cada uno a dos manchas en forma de corazón.",
  "La firma de Kōrin, a la derecha, junto a su dibujo.",
  "La flor abierta en el borde exterior, en primer plano.",
  "La fina red de craqueladuras del vidriado.",
]
themes = ["cerámica", "chorlito", "ola", "té", "rinpa"]
anecdote = """
Hacia los setenta años, Kenzan deja Kioto para instalarse en Edo, la actual \
Tokio. Allí sigue pintando y haciendo cerámicas hasta su muerte, en 1743, a los \
ochenta años."""
salle = 3
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "El monte Inwang después de la lluvia"
artiste = "Jeong Seon"
annee = "1751"
image = "inwang-apres-la-pluie.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Inwangjesaekdo.jpg"
technique = "Tinta sobre papel, 79,2 × 138,2 cm"
collection = "Museo Nacional de Corea, Seúl"
note = "Las rocas aún mojadas del monte Inwang, sobre Seúl, emergen de la bruma que sube de los valles: la obra más célebre del paisaje coreano «de vista real»."
description = """
Una montaña ocupa casi todo el ancho de la hoja. En el centro, una enorme pared \
de granito redondeada, pintada de un negro profundo, se alza como una cúpula; a su alrededor, \
crestas más claras, salpicadas de pequeñas manchas de tinta que figuran los árboles, \
se escalonan hasta el borde superior. Delgadas cascadas, nacidas de la lluvia, descienden \
por los barrancos. Toda la parte baja está sumergida en una bruma blanca de la que emergen \
copas de pinos. Abajo a la derecha, entre los árboles, aparece el tejado de una casa; \
más abajo, hacia la izquierda, cuelgan las ramas ligeras de un sauce. Arriba a la derecha, \
una breve inscripción vertical da el título, el nombre de pincel del pintor y la \
fecha, seguidos de dos sellos."""
evocation = """
El título coreano, Inwang jesaek do, significa «el monte Inwang que se despeja tras la \
lluvia»: el pintor capta el instante en que cesa el aguacero, en que la roca aún está negra \
de agua y la bruma se levanta. El monte Inwang domina al oeste el palacio real de Seúl, \
y Jeong Seon vivía a sus pies: pinta un paisaje que veía cada día. Según \
una interpretación extendida, la obra estaría ligada a su amigo de siempre, el poeta Yi \
Byeong-yeon, gravemente enfermo ese año y muerto poco después; la casa de abajo \
sería la suya, y el cielo que se despeja, un deseo de curación. Nada lo prueba, pero \
esta lectura dice la emoción que se atribuye a este cuadro, pintado por un hombre de \
setenta y cinco años."""
histoire = """
Jeong Seon pinta este paisaje en 1751, como indica la inscripción, durante un mes \
intercalar del calendario lunar. Hasta entonces, los pintores coreanos representaban \
sobre todo montañas imaginarias, a la manera china; él hace de la capital y \
de sus alrededores un tema digno de la gran pintura. En el siglo XX, la obra pertenece \
a la colección de Lee Kun-hee, presidente del grupo Samsung, y está clasificada como tesoro \
nacional de Corea. Tras la muerte de Lee Kun-hee, en 2020, su familia dona al Estado \
miles de obras y objetos de su colección; en abril de 2021, el cuadro ingresa \
así en el Museo Nacional de Corea, en Seúl. Su exposición, ese mismo año, atrae a \
multitudes de visitantes."""
facture = """
Jeong Seon invierte la lógica habitual de la tinta: la gran pared rocosa, que \
cabría esperar clara, es la masa más oscura de la hoja, aplicada con amplias pinceladas \
cargadas de tinta, repetidas de arriba abajo como el agua que chorrea. Las \
crestas vecinas se modelan con trazos más secos, y los árboles se reducen a manchas \
horizontales, a la manera de ciertos maestros chinos. La bruma no está pintada: \
es el papel dejado en reserva, perfilado con aguadas grises. El encuadre, muy cerrado, corta \
la cima con el borde de la hoja, como si la montaña desbordara el cuadro."""
details = [
  "La gran pared negra del centro, pintada con trazos verticales repetidos.",
  "Las delgadas cascadas blancas que descienden de los barrancos.",
  "El tejado de una casa entre los pinos, abajo a la derecha.",
  "Las ramas ligeras de un sauce, abajo, hacia la izquierda.",
  "La inscripción y los dos sellos del pintor, arriba a la derecha.",
]
themes = ["montaña", "lluvia", "bruma", "seúl", "paisaje"]
anecdote = """
El monte Inwang se sigue viendo desde el centro de Seúl. Un sendero bordea hoy \
la antigua muralla de la ciudad, que recorre sus crestas, y se puede comparar allí el \
paisaje real con el cuadro pintado hace más de dos siglos y medio."""
salle = 4
mur = "nord"
place = 2
largeur = 2.0

[[oeuvres]]
titre = "La lucha (Ssireum)"
artiste = "Kim Hong-do"
annee = "finales del siglo XVIII"
image = "lutte-ssireum.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Danwon_Ssireum.jpg"
technique = "Tinta y colores ligeros sobre papel, hoja de álbum, aprox. 27 × 22,7 cm"
collection = "Museo Nacional de Corea, Seúl"
note = "Dos luchadores se agarran en medio de un círculo de espectadores: una página del álbum de escenas de género de Kim Hong-do, el pintor de la vida cotidiana de Joseon."
description = """
En el centro de la hoja, sobre un fondo vacío, dos hombres con pantalón y chaqueta de tela \
se agarran: uno ha levantado al otro, que se desploma, con una pierna en el aire. Alrededor, \
sentados en el suelo, los espectadores forman un círculo abierto. Arriba, dos grupos apretados \
miran, inclinados hacia delante; algunos, tocados con el sombrero negro de anchas alas de los \
hombres casados y de los letrados, se abanican, otros han dejado el sombrero a su lado. \
A la izquierda, de pie, un muchacho sostiene una bandeja: es un vendedor de golosinas, que \
mira hacia otro lado. Abajo a la derecha, dos hombres se echan hacia atrás, con la boca abierta, \
como si los luchadores fueran a caerles encima. Varios pares de zapatos están colocados \
en el suelo, a la derecha."""
evocation = """
El ssireum, lucha tradicional en la que cada adversario agarra la banda de tela anudada a \
la cintura y al muslo del otro, era el gran entretenimiento de las fiestas de \
aldea, en particular de la fiesta de Dano, en el quinto mes lunar. Kim Hong-do \
hace de ello una pequeña comedia humana: letrados y campesinos, viejos y jóvenes comparten el mismo \
espectáculo, cada uno con su reacción, tensión, diversión o espanto. La composición guía \
la mirada: los espectadores de abajo, que se echan hacia atrás, anuncian hacia qué lado \
va a caer el luchador. Estas pinturas de costumbres, llamadas pungsokhwa, muestran el interés \
nuevo del siglo XVIII coreano por la vida de la gente corriente, que se une a la \
búsqueda de una pintura propiamente coreana, como en Jeong Seon."""
histoire = """
La hoja pertenece a un álbum de veinticinco escenas de género, el Danwon pungsokdo \
cheop, conservado en el Museo Nacional de Corea y clasificado como tesoro de Corea. En él se ven también \
una fragua, una escuela de aldea, un joven bailarín, mujeres lavando la ropa a la orilla \
de un arroyo, un transbordador en un río. El álbum no está fechado; se sitúa \
generalmente a finales del siglo XVIII, cuando Kim Hong-do, pintor de la corte, está en la \
cima de su reputación bajo el rey Jeongjo. Se ignora para quién fue realizado. Estas \
pequeñas imágenes se han vuelto tan familiares en Corea que ilustran los manuales \
escolares y se han reproducido en innumerables objetos, sellos y carteles."""
facture = """
Kim Hong-do traza sus figuras con una línea de tinta flexible y veloz, más marcada en los \
pliegues de las ropas, y luego las realza con aguadas ligeras, grises, ocres o azuladas. \
Suprime todo decorado, ni árbol ni casa: el suelo desnudo de la hoja y el círculo de los \
espectadores bastan para crear el espacio. Los rostros, redondos, de ojos rasgados, están \
tratados con humor y variedad, cada uno con su expresión. La composición en anillo \
concentra la atención en los luchadores sin dejar de permitir que la mirada circule de un grupo \
a otro."""
details = [
  "El joven vendedor de golosinas, con la bandeja en la mano, que no mira el combate.",
  "Los dos espectadores de abajo a la derecha, echados hacia atrás, con la boca abierta.",
  "Los sombreros negros dejados en el suelo, a la izquierda.",
  "Los zapatos colocados en el suelo, a la derecha.",
  "La pierna levantada del luchador que se desploma.",
]
themes = ["lucha", "fiesta", "aldea", "vida cotidiana", "joseon"]
anecdote = """
Desde hace mucho se ha observado que uno de los espectadores tiene las manos dibujadas al revés, \
la derecha en lugar de la izquierda. Simple descuido o guiño del pintor, este \
detalle se ha convertido en una de las curiosidades más comentadas de la pintura coreana."""
