[[oeuvres]]
titre = "La historia de Genji, capítulo «Azumaya»"
artiste = "Japon, époque de Heian"
annee = "primera mitad del siglo XII"
image = "genji-azumaya.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Genji_emaki_azumaya.jpg"
technique = "Pintura de un rollo ilustrado (emaki), colores y tinta sobre papel, alt. aprox. 22 cm"
collection = "Museo de Arte Tokugawa, Nagoya"
note = "En un aposento del palacio, unas damas leen, miran imágenes y se hacen peinar: una escena del más antiguo rollo ilustrado de la Historia de Genji."
description = """
Se contempla el interior de una morada aristocrática desde arriba y en diagonal, como si el \
tejado hubiera sido retirado. Vigas, cortinas de bambú y tabiques correderos \
adornados con paisajes recortan la escena en diagonales. En el centro, una pantalla de tela \
malva, suspendida de un bastidor, separa dos grupos. A la izquierda, una dama con ropas grises \
se ocupa de la larga cabellera negra de otra; más allá, una dama con vestido claro \
sostiene un cuaderno abierto y lee. Arriba, una joven apoyada en el codo, con ropas verdes y \
rojas, se inclina. A la derecha, una dama con vestido crema de motivos de círculos está sentada, con \
el cabello negro derramado sobre los hombros, junto a un montón de telas de colores. Los \
rostros, pálidos, se reducen a unos pocos trazos."""
evocation = """
La Historia de Genji, escrita hacia el año 1000 por Murasaki Shikibu, dama de honor en la corte \
imperial, se presenta a menudo como una de las primeras novelas de la historia. El \
capítulo «Azumaya», «el pabellón del Este», pertenece a su última parte. La \
tradición reconoce en esta escena a la joven Ukifune, que mira imágenes mientras \
una sirvienta lee el texto en voz alta, y a su hermanastra Naka no Kimi, a quien se peina \
los cabellos. Nada parece ocurrir; pero el lector sabe que Ukifune acaba \
de escapar a los avances de un príncipe, y adivina la inquietud bajo este momento de calma. Estas \
pinturas expresan el mono no aware, la sensibilidad melancólica ante la fragilidad de \
las cosas, que cultivaba la corte de Heian."""
histoire = """
Los rollos ilustrados de la Historia de Genji se realizaron en el siglo XII, más de un \
siglo después de la novela, sin duda para la corte imperial. Comprendían en origen \
varios rollos, en los que pasajes de texto caligrafiados sobre papel decorado \
alternaban con pinturas. Solo quedan una veintena de escenas pintadas, \
repartidas entre el museo de Arte Tokugawa, en Nagoya, que conserva la mayor parte, y \
el museo Gotoh, en Tokio. Para protegerlas, las hojas se conservan hoy \
por separado, planas. Atribuidas durante mucho tiempo al pintor de corte Fujiwara no Takayoshi, \
se consideran ahora obra de varios pintores y calígrafos \
anónimos. Están clasificadas como tesoro nacional."""
facture = """
Los pintores trabajan según el método llamado tsukuri-e, la «pintura construida»: \
un primer dibujo a la tinta, luego capas espesas de pigmentos minerales opacos y, \
por último, los contornos y los detalles retrazados a la tinta. El tejado se suprime para mostrar \
el interior, procedimiento llamado fukinuki yatai, el «tejado soplado». Los rostros siguen la \
convención del hikime kagibana, «ojos de línea, nariz de gancho», que vuelve a los \
personajes casi intercambiables: la emoción pasa por las posturas, las telas y \
la composición en diagonal. Los colores han sufrido mucho, y el desconchado \
deja ver en algunos puntos el dibujo subyacente."""
details = [
  "La dama que lee, en el centro, con un cuaderno abierto entre las manos.",
  "La larga cabellera negra que se peina, a la izquierda.",
  "La pantalla de tela malva, de cintas flotantes, que divide la estancia.",
  "Los rostros blancos de ojos reducidos a una línea.",
  "Los paisajes pintados en los tabiques, arriba.",
]
themes = ["novela", "corte", "mujeres", "lectura", "heian"]
anecdote = """
Otra escena de estos rollos, del capítulo «Suzumushi», figura en el reverso del \
billete japonés de 2000 yenes, emitido en el año 2000, junto a un retrato de Murasaki Shikibu."""
salle = 5
mur = "nord"
place = 2
largeur = 1.8

[[oeuvres]]
titre = "Chōjū-giga, la lucha de la rana y la liebre"
artiste = "Japon, époque de Heian"
annee = "siglo XII"
image = "choju-giga-sumo.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Chouju_1st_scroll-05.jpg"
technique = "Tinta sobre papel, rollo horizontal, alt. aprox. 30 cm (detalle del primer rollo)"
collection = "Templo Kōzan-ji, Kioto"
note = "Una rana derriba a una liebre ante la mirada de los espectadores: una escena del rollo cómico más célebre de Japón, trazada solo con tinta."
description = """
El rollo se lee de derecha a izquierda. A la derecha, al borde de un prado poblado de hierbas y \
matorrales, dos liebres de pie miran a una rana y a una liebre que se agarran: \
la rana muerde la oreja de su adversaria. Más a la izquierda, el desenlace del combate: la \
liebre, proyectada, cae de espaldas, con las patas en el aire, mientras que la rana \
victoriosa, erguida sobre las patas traseras, abre bien la boca; una línea curva \
escapa de ella, como un grito o un soplo. En el extremo izquierdo, otras ranas \
ruedan por el suelo o se incorporan. No hay texto ni color, solo la tinta \
negra sobre el papel, con unas matas de hierba y el contorno de una orilla."""
evocation = """
Los animales se comportan como humanos: luchan, hacen fiesta, se bañan \
y, más adelante en el mismo rollo, celebran un oficio en el que una rana hace de \
estatua de Buda y un mono de monje. Se ha visto en ello una sátira del clero y \
de la sociedad de la época, pero también un simple juego, lleno de humor y de observación. \
La viveza del trazo, el encadenamiento de escenas sin palabras y la expresividad de las \
actitudes hacen que a menudo se presenten estos rollos como un lejano antepasado del \
manga. La victoria de la pequeña rana sobre la gran liebre se ha convertido en una de las \
imágenes más populares de Japón."""
histoire = """
Los Chōjū-jinbutsu-giga, «caricaturas de animales y humanos», forman cuatro \
rollos conservados en el Kōzan-ji, un templo de las montañas al noroeste de Kioto, restaurado \
a principios del siglo XIII por el monje Myōe. No están firmados ni fechados y no \
forman un conjunto homogéneo: el primero, el de los animales, el más célebre, \
se remonta al siglo XII, otros son más tardíos. La tradición los atribuye al \
monje pintor Toba Sōjō, sin pruebas. Los sellos del templo, estampados en las juntas de las \
hojas, atestiguan su presencia en el Kōzan-ji. Clasificados como tesoro nacional, los rollos \
están depositados en los museos nacionales de Tokio y de Kioto, y el templo presenta \
copias de ellos."""
facture = """
El pintor trabaja solo con tinta, con un pincel flexible que pasa del trazo fino al \
trazo marcado en un solo gesto. Unas pocas líneas bastan para la musculatura de un \
muslo de rana o el impulso de una liebre que cae; ligeras aguadas grises marcan el \
pelaje, las manchas de la piel, el suelo. El rollo está concebido como una sucesión continua, \
que el lector desenrolla sección por sección: las escenas se encadenan sin separación, \
unidas por el paisaje, y el movimiento de las figuras arrastra la mirada de derecha a izquierda, \
en el sentido de la lectura."""
details = [
  "La rana que muerde la oreja de la liebre, a la derecha.",
  "La liebre proyectada, con las patas en el aire, en el centro.",
  "El soplo que sale de la boca de la rana victoriosa.",
