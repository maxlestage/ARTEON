[[artistes]]
nom = "Corée, dynastie Goryeo"
vie = "Corea, 918–1392"
biographie = """
El reino de Goryeo es fundado en 918 por el general Wang Geon, que reunifica la \
península e instala su capital en Kaesong; el nombre occidental de Corea procede del \
suyo. Durante casi cinco siglos, una aristocracia cortesana gobierna un Estado \
profundamente budista: los monasterios, ricos y poderosos, encargan sutras \
copiados en oro, pinturas religiosas de gran finura y objetos de culto en \
bronce. Bajo Goryeo, Corea graba las cerca de ochenta mil tablillas de \
madera del canon budista, la Tripitaka Koreana, aún conservadas en el templo Haein-sa, \
e imprime en 1377 el libro más antiguo conservado en caracteres metálicos \
móviles, el Jikji, hoy en la Biblioteca Nacional de Francia. El reino \
mantiene estrechos vínculos con la China de los Song, de la que admira la cultura y la \
cerámica. En el siglo XIII, sufre las invasiones mongolas y se convierte en vasallo del \
imperio de los Yuan. Debilitado, es derrocado en 1392 por el general Yi Seong-gye, \
fundador de la dinastía Joseon."""
style = """
Los alfareros de Goryeo, inspirados al principio por los celadones chinos, se emancipan de ellos \
en el siglo XII. Buscan un verde azulado y translúcido, y formas flexibles, \
a veces esculpidas en loto, en melón o en animal. Su gran invención es \
la incrustación, el sanggam: un decorado grabado y luego relleno de arcilla blanca y negra, bajo \
el vidriado. Grullas, nubes, sauces, juncos y aves acuáticas componen en él paisajes \
poéticos. Estos celadones siguen siendo el símbolo del arte de Goryeo y una referencia para los \
ceramistas coreanos de hoy."""

[[artistes]]
nom = "Corée, dynastie Joseon"
vie = "Corea, 1392–1910"
biographie = """
Fundada en 1392 por Yi Seong-gye, la dinastía Joseon reina más de cinco siglos sobre \
Corea desde su nueva capital, Hanyang, la actual Seúl. Hace del \
neoconfucianismo la doctrina del Estado: exámenes de funcionarios, culto a los \
antepasados, respeto a las jerarquías e ideal de frugalidad impregnan la vida de la corte y \
de los letrados, los yangban. En el siglo XV, el rey Sejong hace crear el alfabeto coreano, el \
hangeul. El país atraviesa después duras pruebas: las invasiones japonesas de 1592 \
a 1598, y luego las invasiones manchúes de 1627 y 1636. El siglo XVIII, bajo los reyes \
Yeongjo y Jeongjo, es un tiempo de renovación, en que letrados y artistas se interesan \
más por la realidad coreana, sus paisajes y sus costumbres. En el siglo XIX, Joseon \
se cierra al mundo y sufre luego la presión de las potencias extranjeras; el reino \
se convierte en el imperio de Corea en 1897, antes de ser anexionado por Japón en 1910."""
style = """
A la cerámica coloreada de Goryeo, Joseon prefiere la porcelana blanca, producida para \
la corte en los hornos oficiales de Gwangju. A menudo está desnuda, o decorada con azul \
de cobalto, importado a gran precio, o con óxido de hierro marrón. Las formas son amplias, \
sobrias, algo irregulares, y los alfareros aceptan los accidentes de la cocción. La \
jarra luna es su forma más célebre. Esta estética de lo natural sedujo a los \
maestros del té japoneses y, en el siglo XX, a los ceramistas occidentales."""

[[artistes]]
nom = "Jeong Seon"
vie = "Hanyang (Seúl), 1676 – Hanyang, 1759"
biographie = """
Jeong Seon, cuyo nombre de pincel es Gyeomjae, nace en 1676 en Hanyang, la capital de \
Joseon, en una familia de letrados de modesta fortuna. Estudia los clásicos \
confucianos y se forma en la pintura, que le granjea muy pronto reputación. Ocupa \
varios cargos oficiales, entre ellos el de magistrado de Yangcheon, al oeste de la \
capital. Frecuenta un círculo de letrados y poetas, entre ellos Yi \
Byeong-yeon, su amigo de siempre, con quien intercambia poemas y pinturas. Desde \
joven, recorre los montes Kumgang, los «montes de Diamante», al noreste de la \
península, que pinta toda su vida, en particular en una gran vista de conjunto fechada en \
1734. Representa también los alrededores de la capital, las orillas del río Han, los \
pabellones y los valles donde vivió, al pie del monte Inwang. Muere en 1759, a los \
ochenta y tres años, tras una carrera excepcionalmente larga y fecunda. Sus \
obras se reparten hoy entre los museos coreanos, entre ellos el Museo Nacional de \
Corea y el museo Kansong, y colecciones privadas."""
style = """
Jeong Seon es el maestro del jingyeong sansu, el «paisaje de vista real»: en lugar de \
retomar las montañas ideales de la pintura china, pinta lugares coreanos \
precisos, que ha recorrido. Adapta para ello las técnicas chinas: trazos \
verticales apretados para los acantilados de granito, manchas de tinta para la vegetación, fuertes \
contrastes de negro y de blanco. Sus composiciones, a menudo cerradas y vistas desde arriba, \
dan una impresión de masa y de presencia física. Inspiró a toda una \
generación de pintores coreanos."""

[[artistes]]
nom = "Kim Hong-do"
vie = "Corea, 1745 – hacia 1806"
biographie = """
Kim Hong-do, conocido por su nombre de pincel Danwon, nace en 1745 en una familia sin \
título de nobleza. Siendo aún niño, estudia pintura con el letrado y pintor \
Kang Sehwang, que seguirá siendo su protector. Entra joven en el Dohwaseo, la oficina real \
de pintura, y se convierte en el pintor favorito del rey Jeongjo: participa en los retratos \
oficiales del rey Yeongjo y luego de Jeongjo, pinta biombos para el palacio, y el rey \
lo envía a dibujar los montes Kumgang para que le traiga sus imágenes. Como recompensa, \
recibe cargos de funcionario, entre ellos el de magistrado del distrito de Yeonpung. \
Sobresale en todos los géneros: paisajes, retratos, pintura budista, flores y \
aves, animales, y sobre todo escenas de la vida cotidiana, que le dieron fama. \
Tras la muerte de Jeongjo, en 1800, sus últimos años son más difíciles, y los \
documentos escasean; se piensa que muere hacia 1806, enfermo y sin fortuna."""
style = """
Kim Hong-do da a la pintura de género coreana sus cartas de nobleza. Sus escenas \
de aldea, de mercado o de taller, pintadas en pequeñas hojas, captan los \
gestos del trabajo y del ocio con un trazo de tinta vivo, con colores ligeros y \
mucho humor. Suprime el decorado para concentrar la atención en los \
personajes, siempre retratados con acierto. Su influencia fue inmensa: su joven colega Shin \
Yun-bok y numerosos pintores populares siguieron el camino que él había abierto."""

[[artistes]]
nom = "Ogata Kōrin"
vie = "Kioto, 1658 – Kioto, 1716"
biographie = """
Ogata Kōrin nace en 1658 en Kioto, segundo hijo de un rico comerciante de sedas, el \
Kariganeya, proveedor de telas de lujo de la emperatriz Tōfukumon-in y de las \
grandes familias de la corte. Crece entre telas y motivos de kimonos, y \
se inicia en el teatro nō, la caligrafía y la ceremonia del té; su familia está \
emparentada con la de Hon'ami Kōetsu. A la muerte de su padre, en 1687, hereda una \
fortuna que dilapida en pocos años por afición al lujo. Se vuelve entonces hacia la \
pintura para vivir, y recibe en 1701 el título honorífico de hokkyō. Reside en \
Edo de 1704 a 1709 aproximadamente, al servicio de un señor y de ricos mercaderes, y regresa luego \
a Kioto, donde manda construir una casa-taller. Pinta biombos, rollos \
y abanicos, y diseña decorados para las lacas, las telas y las cerámicas \
de su hermano menor, Kenzan. Muere en Kioto en 1716. Sus motivos, difundidos por \
libros de modelos, nutrieron las artes decorativas japonesas y luego el japonismo europeo."""
style = """
Kōrin lleva a su cima el arte decorativo inaugurado por Sōtatsu, a quien admiraba y \
copiaba. Sus formas son estilizadas, sus colores aplicados en planos deslumbrantes sobre el oro, \
sus composiciones rítmicas como motivos de tela; sabe también pintar a la tinta \
con espontaneidad. Su nombre dio el de la escuela Rinpa, y los «motivos Kōrin» se \
convirtieron, ya en el siglo XVIII, en un repertorio corriente de los artesanos japoneses."""

[[artistes]]
nom = "Hasegawa Tōhaku"
vie = "Nanao (provincia de Noto), 1539 – Edo, 1610"
biographie = """
Hasegawa Tōhaku nace en 1539 en Nanao, en la provincia de Noto, a orillas del mar del \
Japón, y es adoptado por una familia de tintoreros. Comienza pintando \
imágenes budistas para los templos de su región. Hacia 1571, a los treinta y pocos años, \
se instala en Kioto, donde estudia las pinturas chinas conservadas en los templos \
zen, en particular las de Muqi, y frecuenta al maestro del té Sen no Rikyū. Rivaliza \
con la escuela Kanō, que domina los grandes encargos. A principios de la década de 1590, su \
taller decora un templo fundado por Toyotomi Hideyoshi en memoria de su hijo muerto en \
la infancia: las pinturas de arces y cerezos en flor sobre fondo de oro que \
subsisten están hoy en el Chishaku-in, en Kioto. Su hijo y principal \
colaborador, Kyūzō, muere en 1593. Tōhaku recibe los títulos honoríficos de hokkyō \
y luego de hōgen. Llamado a Edo por el shogun en 1610, cae enfermo durante el viaje y \
muere poco después de su llegada."""
style = """
Tōhaku domina dos maneras opuestas: la pintura decorativa de colores vivos sobre \
fondo de oro, propia de la época de Momoyama, y la pintura a la tinta monocroma, heredada \
de los maestros chinos y de Sesshū. En esta alcanza una libertad nueva, en la que el \
vacío, la bruma y los degradados de gris cuentan tanto como las formas. Sus Pinos en la \
niebla pasan por la cima de la pintura a la tinta japonesa."""

[[artistes]]
nom = "Tawaraya Sōtatsu"
vie = "Kioto, hacia 1570 – hacia 1640"
biographie = """
Se sabe muy poco de la vida de Sōtatsu, de quien se ignoran incluso las fechas exactas \
de nacimiento y de muerte. Dirige en Kioto, a principios del siglo XVII, un taller llamado \
Tawaraya, que produce abanicos pintados, papeles decorados y pinturas para \
una clientela acomodada. En 1602, participa en la restauración de los sutras ilustrados \
ofrecidos en el siglo XII por el clan Taira al santuario de Itsukushima, lo que lo pone en \
contacto con el arte de Heian. Colabora con Hon'ami Kōetsu, calígrafo, alfarero y \
creador de lacas, figura mayor de la cultura de Kioto: Sōtatsu pinta con oro y \
plata grullas, ciervos o flores en largos rollos, sobre los que Kōetsu \
caligrafía poemas clásicos. Su reputación crece: recibe el título \
honorífico de hokkyō y trabaja para aristócratas de la corte y grandes \
templos. Muere hacia 1640. Su taller le sobrevive algún tiempo, y las atribuciones \
entre el maestro y sus sucesores siguen siendo a veces discutidas."""
style = """
Sōtatsu renueva la pintura decorativa japonesa. Retoma los temas de la \
literatura y de la pintura clásicas, pero los simplifica en grandes formas coloreadas \
sobre fondos de oro o de plata, con encuadres audaces y vastos espacios vacíos. \
Desarrolla la técnica del tarashikomi, colores aplicados sobre un fondo todavía \
húmedo. Kōrin, en el siglo siguiente, y luego Sakai Hōitsu retomaron su estilo: a \
esta corriente se le dio el nombre de Rinpa, «la escuela de Kōrin»."""

[[artistes]]
nom = "Japon, époque de Heian"
vie = "Japón, 794–1185"
biographie = """
La época de Heian comienza en 794, cuando el emperador Kanmu instala su capital en \
Heian-kyō, la actual Kioto, y termina en 1185 con la victoria del clan Minamoto, que \
funda poco después el primer shogunato. Durante casi cuatro siglos, una aristocracia \
cortesana, dominada por la familia Fujiwara, cultiva un arte de vivir refinado, hecho de \
poesía, música, perfumes, caligrafía y etiqueta. Japón toma \
distancia de China e inventa sus propias formas: los silabarios kana, que \
permiten escribir la lengua japonesa; una literatura en prosa a menudo debida a \
mujeres, como la Historia de Genji de Murasaki Shikibu o el Libro de la almohada de Sei \
Shōnagon; y el yamato-e, la pintura «a la japonesa», consagrada a los paisajes, a las \
estaciones y a la vida del país. Los monasterios budistas, poderosos, encargan \
también pinturas y esculturas. Al final del período, los rollos ilustrados, los \
emaki, conocen su primera edad de oro, antes de que las guerras civiles cierren \
la época."""
style = """
Los rollos narrativos, o emaki, se despliegan de derecha a izquierda, sección por sección, \
entre las manos de un lector. Siguen dos maneras: la pintura coloreada y \
cuidada de la Historia de Genji, de pigmentos espesos, para la literatura de corte; y el dibujo \
a la tinta, vivo y movido, lleno de humor, de los Chōjū-giga o de las leyendas de \
templos. Los pintores permanecen casi siempre anónimos. Estos rollos fijaron durante \
siglos las convenciones del relato en imágenes en Japón."""

[[artistes]]
nom = "Ogata Kenzan"
vie = "Kioto, 1663 – Edo, 1743"
biographie = """
Ogata Kenzan nace en 1663 en Kioto, tercer hijo del rico comerciante de sedas que es \
también el padre de Kōrin, su mayor por cinco años. A diferencia de su hermano, lleva una \
vida retirada y estudiosa, consagrada a los clásicos chinos, al budismo zen, a la \
poesía y a la caligrafía. Aprende cerámica en el entorno de Nonomura \
Ninsei, el gran alfarero de Kioto. En 1699, abre su propio horno en Narutaki, al \
noroeste de la capital, de donde su nombre de artista. Allí produce platos, cuencos y \
recipientes para el té y la mesa, cuyos decorados, pintados por él mismo o por \
Kōrin, asocian imagen y poesía. En 1712, se instala en la propia ciudad de Kioto, \
donde su taller trabaja para una clientela más amplia. Hacia 1731, parte a Edo, donde \
pasa el final de su vida, pintando y modelando todavía cerámicas. Allí muere en \
1743. Su nombre, retomado por sucesores, dio origen a un linaje de alfareros."""
style = """
Kenzan hace de la cerámica un soporte de pintura y de poesía. Sus piezas, de formas \
simples, cuadradas o en forma de flor, llevan decorados pintados con óxido de hierro, con \
cobalto o con esmaltes, de una libertad de pincel inédita, acompañados a veces de poemas \
caligrafiados. El diálogo con su hermano Kōrin fijó una estética que marcó \
duraderamente la cerámica japonesa, hasta los alfareros del siglo XX, como el inglés \
Bernard Leach, formado en Japón por un alfarero del linaje de los Kenzan."""
