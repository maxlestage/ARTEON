[[oeuvres]]
titre = "Autorretrato como Invierno"
artiste = "Rosalba Carriera"
annee = "1730–1731"
image = "autoportrait-hiver.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Rosalba_Carriera_-_Self-Portrait_as_%22Winter%22_(1730-1731)_-_Google_Art_Project.jpg"
technique = "Pastel sobre papel, 46,5 × 34 cm"
collection = "Gemäldegalerie Alte Meister, Dresde"
note = "A los cincuenta y siete años, la retratista más solicitada de Europa se representa como alegoría del Invierno, arropada en pieles. La hoja mide menos de medio metro; se muestra aquí ampliada."
description = """
Una mujer de edad madura, vista de busto y de tres cuartos, nos mira con una leve sonrisa. Sus ojos claros tienen ligeras ojeras. Lleva en la cabeza un gran gorro de piel blanca moteada de negro, como el armiño, acompañado de un birrete de terciopelo azul del que pende una borla dorada. Un manto azul ribeteado de la misma piel cubre sus hombros y se abre sobre una camisa blanca. De las orejas penden perlas. El fondo, gris y neutro, se oscurece en torno a la cabeza, de modo que el rostro claro y la piel blanca destacan con nitidez. Ningún objeto, ningún decorado, ningún atributo de pintora: todo está en la figura y en su mirada."""
evocation = """
Rosalba pintó a menudo las cuatro estaciones con los rasgos de jóvenes graciosas. Aquí se presta ella misma a la alegoría, pero sin halago: muestra un rostro marcado por la edad, con una franqueza poco común. El invierno es la estación de la vejez; la piel, que abriga, evoca también la comodidad y el lujo de una artista llegada a la cima de su reputación. Se ha leído en ella humor, una conciencia lúcida del tiempo que pasa y el orgullo de una mujer que vivía de su arte. El autorretrato afirma el lugar de una mujer pintora, admitida por las academias de Roma y de París en una época en que admitían muy pocas."""
histoire = """
Rosalba Carriera ejecuta este autorretrato hacia 1730-1731, durante su estancia en la corte imperial de Viena. Es entonces la retratista más solicitada de Europa: soberanos, príncipes y viajeros del Grand Tour desfilan por su taller veneciano. El pastel se incorpora a la colección de los electores de Sajonia, en Dresde. El príncipe Federico Augusto, futuro Augusto III, que la había conocido en Venecia en su juventud, reúne en efecto el mayor conjunto de sus pasteles. Puestas a salvo durante la Segunda Guerra Mundial, estas obras escapan a la destrucción de la ciudad y se presentan hoy en la Gemäldegalerie Alte Meister, junto con las vistas de Dresde de Bellotto."""
facture = """
El pastel es una barra de pigmento casi puro, que se aplasta sobre el papel. Rosalba hizo de él un arte mayor. Trabaja en capas ligeras, difuminadas con el dedo o con el esfumino, para obtener la suavidad aterciopelada de la piel; luego coloca con trazo vivo los acentos: el blanco de las perlas, los mechones de la piel, el brillo del ojo. El azul intenso del terciopelo responde al gris del fondo. Frágil, el pastel teme los golpes y la luz: por eso se conserva bajo cristal."""
details = [
  "Los pelos de la piel, resueltos con rápidos trazos de blanco y negro.",
  "Las perlas de los pendientes, colocadas de un solo toque.",
  "La borla dorada que pende del birrete de terciopelo azul.",
  "Las ligeras ojeras bajo los ojos, resueltas sin complacencia.",
]
themes = ["autorretrato", "invierno", "alegoría", "mujeres", "pastel"]
anecdote = """
Rosalba comenzó su carrera pintando miniaturas para las tapas de cajas de rapé. Fue una de las primeras en pintarlas sobre marfil, un soporte luminoso que se convirtió en la norma para las miniaturas del siglo XVIII."""
