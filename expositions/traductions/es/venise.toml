[exposition]
ordre = 35
nom_court = "Venecia"
mouvement = "Venecia, de Bellini a Tiepolo"
cadre = "dore"
couleur = "#1f5c66"
titre = "Venecia, el color y la luz, de Bellini a Tiepolo"
artiste = "Bellini, Carpaccio, Véronèse, Tintoret, Tiepolo…"
dates = "1475–1780"
accroche = "Exposición virtual · Gallerie dell'Accademia, Venecia"
introduction = """
Durante tres siglos, Venecia inventa una pintura del color y de la luz: la pintura al óleo que trae Antonello da Messina, los luminosos retablos de Giovanni Bellini, los relatos de Carpaccio, luego los festines de Veronés y las tempestades de Tintoretto, hasta el último destello del siglo XVIII, de las fiestas de Tiepolo a las vistas de Guardi y de Bellotto. La visita reúne once pintores en once obras. El edificio se inspira en las Gallerie dell'Accademia, instaladas en la antigua Scuola della Carità: se pasa del portal a la sala capitular de muros dorados, y luego a la larga sala de los banquetes y a los salones del Settecento."""
vitrine = "reve-sainte-ursule.jpg"

[musee]
nom = "Gallerie dell'Accademia"
ville = "Venecia, Italia"
architecte = "Andrea Palladio (el convento); Giannantonio Selva (el museo)"
construction = "siglos XIV–XVI; museo abierto en 1817"
presentation = """
Las Gallerie dell'Accademia ocupan, a orillas del Gran Canal, el conjunto de Santa Maria della Carità: la iglesia, reconstruida en el siglo XV; el convento de los canónigos de Letrán, iniciado por Andrea Palladio en 1561 y nunca terminado; y la Scuola della Carità, la más antigua de las seis Scuole Grandi, las grandes cofradías laicas de Venecia. En 1807, bajo la dominación napoleónica, se instala allí la Academia de Bellas Artes, fundada en 1750; el arquitecto Giannantonio Selva divide la iglesia en salas y tapia sus ventanas góticas. Las colecciones, enriquecidas con los cuadros de las iglesias y conventos suprimidos, se abren al público en 1817. Se entra por la fachada clásica de la Scuola, rehecha hacia 1760 por Giorgio Massari y Bernardino Maccaruzzi. La primera sala, la antigua sala capitular, conserva su techo de casetones de madera dorada del siglo XV, y la sala del Albergo guarda la Presentación de María en el Templo, que Tiziano pintó para este mismo muro. El museo reúne el más bello conjunto de pintura veneciana del mundo."""
ici = """
El edificio de ARTEON retoma su sucesión de espacios. Se entra por el sur en «El portal de la Carità», un vestíbulo de piedra clara. Al norte se abre «La sala capitular», de dieciocho metros de ancho y nueve de alto, con muros de ocre dorado: los maestros del Quattrocento y Lotto. Al este, «La sala de los banquetes», de treinta y dos metros de longitud y doce de altura, evoca las naves de la antigua iglesia de las que cuelgan los lienzos gigantes: Veronés, Tintoretto, Tiepolo. Al oeste, «Los salones del Settecento», más bajos, de muros verde agua, reúnen el siglo XVIII."""

