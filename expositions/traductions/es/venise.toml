[[oeuvres]]
titre = "Las bodas de Caná"
artiste = "Paolo Véronèse"
annee = "1562–1563"
image = "noces-de-cana.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Les_Noces_de_Cana_-_Paolo_Veronese_-_Musée_du_Louvre_Peintures_INV_142_;_MR_384.jpg"
technique = "Óleo sobre lienzo, 677 × 994 cm"
collection = "Museo del Louvre, París"
note = "El primer milagro de Cristo, el agua convertida en vino, se transforma en un banquete veneciano de más de ciento treinta figuras: el mayor lienzo del Louvre."
description = """
Bajo un cielo azul surcado de nubes, una terraza bordeada de columnatas acoge un inmenso festín. Las mesas forman una U en torno a un espacio enlosado. En el centro, de frente a nosotros, Cristo, con aureola, está sentado entre su madre y sus discípulos; son casi los únicos que permanecen graves. A su alrededor, decenas de comensales con trajes suntuosos, venecianos u orientales, comen, beben y conversan; en el extremo izquierdo de la mesa, los novios. En primer plano, en medio, un grupo de músicos toca la viola. A la derecha, un criado vierte el vino de una gran jarra, y un hombre con túnica de brocado examina su copa. Tras la balaustrada, unos criados trinchan la carne; en los tejados, unos curiosos se asoman. Perros y un gato circulan entre los pies."""
evocation = """
El Evangelio de Juan cuenta que en las bodas de Caná faltó el vino y que Jesús convirtió el agua en vino: es su primer milagro. Veronés hace de ello la fiesta más fastuosa imaginable, a imagen de los banquetes de la aristocracia veneciana. Pero el sentido religioso permanece en el centro: Cristo, inmóvil en medio de la agitación, mira al espectador, y justo encima de él, tras la balaustrada, un criado trincha la carne, gesto que se ha relacionado con el sacrificio del Cordero. El reloj de arena colocado ante los músicos se ha leído como un recordatorio del tiempo que pasa. Destinado a un refectorio, el lienzo sentaba a los monjes, durante sus comidas, en la mesa misma de Cristo."""
histoire = """
El 6 de junio de 1562, los benedictinos del monasterio de San Giorgio Maggiore, en Venecia, encargan a Veronés un lienzo para el muro del fondo de su nuevo refectorio, construido por Andrea Palladio. El contrato pide que quepan en él tantas figuras como sea posible. Ayudado por su hermano Benedetto, el pintor lo entrega en septiembre de 1563. En 1797, las tropas francesas se lo llevan como botín: el lienzo es cortado en bandas horizontales y enrollado para el viaje, y luego vuelto a coser en París. En 1815, durante las restituciones, Vivant Denon lo juzga demasiado frágil para volver a partir; Venecia recibe en su lugar un gran cuadro de Charles Le Brun. Desde 2007, una copia digital a tamaño real ocupa su emplazamiento original."""
facture = """
Veronés organiza la multitud con la claridad de un arquitecto: columnatas inspiradas en Palladio y en la Antigüedad cierran los lados, una balaustrada divide el cuadro en dos registros, y el cielo abre el espacio en el centro. Los colores, claros y francos, se aplican en grandes acordes de rojos, verdes, amarillos y azules, y las telas de seda y brocado centellean bajo una luz pareja. La restauración llevada a cabo en el Louvre a partir de 1989 reveló que el manto del mayordomo, en primer plano a la izquierda, había sido repintado de rojo: originalmente era verde."""
details = [
  "Los músicos en el centro: la tradición reconoce en ellos a Veronés de blanco, a Tiziano de rojo, y a Tintoretto.",
  "El criado que vierte el vino de una gran jarra, a la derecha.",
  "El reloj de arena colocado sobre la mesa, ante los músicos.",
  "Los novios, en el extremo izquierdo de la mesa.",
  "Los curiosos asomados en los tejados y los balcones, arriba del todo.",
]
themes = ["banquete", "milagro", "música", "fiesta", "arquitectura", "venecia"]
anecdote = """
En el Louvre, Las bodas de Caná están colgadas en la Sala de los Estados, frente a La Gioconda: la multitud que se apretuja para fotografiar el retrato de Leonardo suele dar la espalda al mayor lienzo del museo."""
