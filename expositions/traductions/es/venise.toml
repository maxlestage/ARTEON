largeur = 0.8

[[oeuvres]]
titre = "La partida del Bucentauro hacia el Lido el día de la Ascensión"
artiste = "Francesco Guardi"
annee = "hacia 1775–1780"
image = "bucentaure.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Guardi_-_Le_Départ_du_Bucentaure_vers_le_Lido_de_Venise,_le_jour_de_l'Ascension,_vers_1770_-_1780,_INV_20009.jpg"
technique = "Óleo sobre lienzo, 66 × 101 cm"
collection = "Museo del Louvre, París"
note = "El día de la Ascensión, la galera dorada del dux se lanza hacia el Lido para desposar al mar: Venecia en fiesta, bajo una luz vibrante."
description = """
La cuenca de San Marcos está cubierta de barcos. En el centro, el Bucentauro, gran galera de aparato roja y oro, de costados esculpidos, avanza impulsada por hileras de remos. A su alrededor se apiñan góndolas, barcas doradas y veleros de mástiles erizados. A la derecha, en el muelle, se reconocen el palacio Ducal, el campanile y las cúpulas de la basílica de San Marcos. A lo lejos, a la izquierda, la iglesia y el campanile de San Giorgio Maggiore; en el centro del horizonte, la cúpula de la Salute. En primer plano, en el muelle, una multitud de venecianos, hombres con mantos y tricornios, mujeres con vestidos claros, contempla el cortejo. Un perrito trota entre ellos. El cielo nuboso ocupa más de la mitad del lienzo."""
evocation = """
Cada año, el día de la Ascensión, el dux subía a bordo del Bucentauro y llegaba hasta el paso del Lido, donde arrojaba un anillo de oro al Adriático pronunciando palabras de desposorio. Este «matrimonio con el mar» celebraba el dominio de Venecia sobre las aguas. Cuando Guardi pinta la escena, la República ya no es más que una potencia en declive, que desaparecerá en 1797, pero la fiesta conserva todo su fasto. Su pintura, nerviosa y luminosa, parece captar la agitación de un instante más que la solidez de los monumentos. Se ha visto en ella una imagen de la Venecia de los últimos años, mirada ya como un recuerdo."""
histoire = """
El lienzo pertenece a una serie de doce cuadros, las Fiestas ducales, consagrada a las grandes ceremonias del dux, a partir de las que siguieron a la elección de Alvise IV Mocenigo, en 1763. Guardi se apoya en composiciones de Canaletto, conocidas por los grabados de Giovanni Battista Brustolon, y las transforma con su pincelada personal. Diez de los doce lienzos de la serie se encuentran hoy en el Louvre. El Bucentauro que se ve aquí, construido en 1729, fue el último: en 1798, tras la caída de la República, las tropas francesas lo despojaron de sus esculturas doradas y las quemaron para recuperar el oro."""
facture = """
Guardi aprendió el oficio en el taller familiar, con su hermano Gian Antonio, y luego se puso a pintar vistas de Venecia a la estela de Canaletto. Pero su pincelada es muy distinta: rápida, fragmentada, hecha de pequeñas comas de color que sugieren los gondoleros, los reflejos o las siluetas de la multitud. Las arquitecturas, ligeramente trémulas, parecen flotar entre el agua y el cielo, en una luz gris y plateada. Esta libertad será admirada por los pintores del siglo XIX."""
details = [
  "Las hileras de remos que salen de los costados del Bucentauro.",
  "El campanile de San Marcos y las cúpulas de la basílica, a la derecha.",
  "La cúpula de la Salute, en el centro del horizonte.",
  "Los gondoleros de pie, esbozados en unos pocos toques.",
  "El perrito que trota en primer plano.",
]
themes = ["venecia", "fiesta", "laguna", "veduta", "ceremonia"]
anecdote = """
Casi no queda nada del último Bucentauro. El museo de historia naval de Venecia conserva fragmentos esculpidos y un gran modelo a escala, que permiten imaginar la galera que pintaba Guardi."""
salle = 4
mur = "ouest"
position = 0
largeur = 1.4

[[artistes]]
nom = "Antonello de Messine"
vie = "Mesina (Sicilia), hacia 1430 – Mesina, febrero de 1479"
biographie = """
Antonello nace en Mesina, en Sicilia, en una familia de artesanos. Se forma en Nápoles, junto al pintor Colantonio, en una ciudad donde la corte aragonesa colecciona pintura flamenca: allí descubre los cuadros de Jan van Eyck y de sus sucesores, y su técnica de la pintura al óleo. Vasari contará más tarde que había ido a aprenderla a Flandes, una leyenda que nada confirma. Antonello trabaja luego sobre todo en Sicilia y en Calabria, donde pinta retablos y retratos. En 1475-1476 reside en Venecia. Allí pinta el retablo de la iglesia de San Cassiano, del que solo quedan fragmentos, hoy en Viena, y retratos que impresionan a los venecianos por su presencia, como el Condotiero del Louvre. El duque de Milán, Galeazzo Maria Sforza, trata entonces de atraerlo a su corte. Antonello regresa sin embargo a Mesina, donde muere a principios de 1479; su hijo Jacobello se hace cargo del taller."""
style = """
Antonello une la minuciosidad y la luz de los flamencos con la geometría y la amplitud de los italianos. Sus retratos, de busto, de tres cuartos sobre fondo negro, miran al espectador con una intensidad nueva. Su estancia en Venecia desempeñó un papel decisivo: Giovanni Bellini y sus contemporáneos adoptaron allí la pintura al óleo y el gran retablo de una sola pieza."""

[[artistes]]
nom = "Giovanni Bellini"
vie = "Venecia, hacia 1430-1435 – Venecia, 29 de noviembre de 1516"
biographie = """
Giovanni Bellini crece en el taller de su padre, el pintor Jacopo Bellini, con su hermano Gentile. En 1453, su hermana Nicolosia se casa con Andrea Mantegna, cuyo dibujo escultórico marca sus primeras obras. Poco a poco, Bellini se aparta de él y busca una luz más suave, que baña las figuras y los paisajes; la llegada de Antonello da Messina a Venecia, en 1475, lo anima a adoptar la pintura al óleo. Se convierte en el pintor oficial de la República: trabaja en los grandes lienzos del palacio Ducal, destruidos por el incendio de 1577, y pinta el retrato del dux Leonardo Loredan. Su taller, muy activo, forma a toda una generación, a la que se vincula a Giorgione y Tiziano. En 1506, Alberto Durero, de paso por Venecia, escribe que es muy viejo, pero sigue siendo el mejor pintor de la ciudad. Hasta el final de su larga vida, Bellini se renueva, con el Festín de los dioses y la Joven ante el espejo."""
style = """
Bellini es el fundador de la pintura veneciana: hace del color y de la luz, más que del dibujo, el alma del cuadro. Sus Vírgenes con el Niño, de grave ternura, sus santos situados en paisajes bañados de sol y sus grandes sacras conversaciones fijaron durante un siglo el modelo del retablo veneciano."""

[[artistes]]
nom = "Vittore Carpaccio"
vie = "Venecia, hacia 1465 – Venecia o Capodistria, hacia 1525-1526"
biographie = """
Se sabe poco de la juventud de Vittore Carpaccio, nacido en una familia de mercaderes venecianos. Su formación sigue siendo oscura, pero su arte debe mucho a Gentile Bellini, el pintor de las grandes ceremonias de la ciudad. Carpaccio se impone como el pintor de las scuole, las cofradías de Venecia, que encargan para sus salas grandes ciclos narrativos. Para la Scuola di Sant'Orsola pinta de 1490 a 1495 aproximadamente las Historias de santa Úrsula. Para la Scuola di San Giovanni Evangelista representa un milagro de la reliquia de la Cruz cerca del puente del Rialto, entonces de madera. De 1502 a 1507 decora la Scuola di San Giorgio degli Schiavoni, la cofradía de los dálmatas, con san Jorge matando al dragón y san Agustín en su estudio, aún en su lugar. Cuando el gusto veneciano se vuelve hacia Giorgione y Tiziano, trabaja cada vez más para clientes de tierra firme y de Istria. Su hijo Benedetto, también pintor, se instala en Capodistria."""
style = """
Carpaccio es un narrador. Instala las leyendas sagradas en la Venecia de su tiempo, con sus palacios, sus canales, sus trajes y sus objetos familiares, descritos con precisión de inventario. Su luz clara y pareja, sus composiciones ordenadas como escenas de teatro, fueron redescubiertas en el siglo XIX por John Ruskin."""

[[artistes]]
nom = "Lorenzo Lotto"
vie = "Venecia, hacia 1480 – Loreto, 1556 o 1557"
biographie = """
Nacido en Venecia, Lorenzo Lotto desarrolla lo esencial de su carrera lejos de su ciudad. Trabaja primero en Treviso, donde pinta el retrato del obispo Bernardo de' Rossi, luego en las Marcas, en Recanati. En 1509 se le pagan trabajos en el palacio del Vaticano, en Roma, en el momento en que Rafael comienza allí sus frescos. De 1513 a 1525 vive en Bérgamo, donde pinta sus mayores retablos y los frescos de la capilla Suardi, en Trescore. De vuelta en Venecia, permanece allí unos años, pero la ciudad está dominada por Tiziano, con quien no comparte ni el estilo ni el éxito. Vuelve a partir, de un encargo a otro, entre Venecia, Treviso y las Marcas. A partir de 1538, anota sus trabajos y sus deudas en un libro de cuentas. Anciano y pobre, se retira en 1554 al santuario de la Santa Casa de Loreto, como oblato, y muere allí. Olvidado, fue redescubierto a finales del siglo XIX por el historiador Bernard Berenson."""
style = """
Lotto es el pintor de la inquietud. Sus retratos escrutan la vida interior de sus modelos, rodeados de objetos cargados de sentido. Sus retablos sorprenden por sus gestos vivos, sus colores ácidos y sus composiciones inesperadas. Independiente de Tiziano, atento al arte del Norte y a Durero, ocupa un lugar aparte en la pintura veneciana."""

[[artistes]]
nom = "Le Tintoret"
vie = "Venecia, 1518 o 1519 – Venecia, 31 de mayo de 1594"
biographie = """
Jacopo Robusti, llamado Tintoretto, es hijo de un tintorero veneciano. Según su biógrafo Carlo Ridolfi, habría pasado brevemente por el taller de Tiziano, que lo habría despedido, y se habría formado sobre todo por sí solo, dibujando a partir de los vaciados de las esculturas de Miguel Ángel. El milagro del esclavo, en 1548, lo hace famoso. Se casa con Faustina Episcopi, hija de un dignatario de la Scuola di San Marco. En 1564, la Scuola Grande di San Rocco organiza un concurso para el techo de su sala del Albergo: en lugar de un boceto, Tintoretto instala un lienzo terminado, que regala a la cofradía. Pintará allí, hasta 1587, más de cincuenta cuadros, uno de los mayores conjuntos jamás realizados por un solo pintor. Tras el incendio del palacio Ducal en 1577, trabaja en su nueva decoración, con el Paraíso, uno de los mayores lienzos del mundo. Casi nunca sale de Venecia y muere en 1594; es enterrado en la Madonna dell'Orto. Su hija Marietta y su hijo Domenico fueron sus ayudantes."""
style = """
Tintoretto busca el movimiento y el drama: escorzos audaces, diagonales, luz violenta que surge de la sombra, multitudes agitadas. Pinta deprisa, con una pincelada rápida que escandalizaba a sus contemporáneos. Ridolfi cuenta que componía sus escenas con pequeñas figurillas de cera colocadas en cajas iluminadas. El Greco y Rubens le deben mucho."""

[[artistes]]
nom = "Paolo Véronèse"
vie = "Verona, 1528 – Venecia, 19 de abril de 1588"
biographie = """
Paolo Caliari, llamado Veronés, es hijo de un cantero de Verona. Se forma junto al pintor Antonio Badile, de quien más tarde desposará a la hija. Instalado en Venecia hacia 1553, obtiene de inmediato encargos para los techos del palacio Ducal, y luego decora la iglesia de San Sebastiano, donde será enterrado. Hacia 1560 pinta los frescos de la villa Barbaro en Maser, construida por Palladio: trampantojos, paisajes y personajes que parecen entrar en las salas. Sus grandes comidas, pintadas para refectorios de conventos, hacen su gloria. En 1573, el tribunal de la Inquisición lo cita a propósito de una Cena juzgada irreverente, poblada de bufones, soldados alemanes y perros; en lugar de modificar el lienzo, cambia el título, que pasa a ser La cena en casa de Leví. Con su hermano Benedetto y sus hijos Carletto y Gabriele, dirige un taller próspero, que continúa su obra tras su muerte, en 1588."""
style = """
Veronés es el pintor del esplendor: arquitecturas majestuosas, cielos claros, multitudes elegantes vestidas de sedas y brocados. Su color, luminoso y plateado, aplicado en grandes acordes, sin sombras pesadas, lo convirtió en el modelo de los decoradores, de Tiepolo a Delacroix. Sus fiestas profanas, apenas religiosas, anuncian también el gusto por el espectáculo que será el de Venecia en el siglo XVIII."""

[[artistes]]
nom = "Giambattista Tiepolo"
vie = "Venecia, 5 de marzo de 1696 – Madrid, 27 de marzo de 1770"
biographie = """
Hijo de un mercader veneciano, Giambattista Tiepolo se forma junto al pintor Gregorio Lazzarini. En 1719 se casa con Maria Cecilia Guardi, hermana de los pintores Gian Antonio y Francesco Guardi. En la década de 1720, sus frescos del palacio del arzobispo de Údine le dan reputación; decora después palacios de Milán, de Bérgamo y de Venecia, como el palacio Labia con la historia de Antonio y Cleopatra. De 1750 a 1753 trabaja en Wurzburgo, para el príncipe-obispo, en la Residencia: allí pinta la sala imperial y el inmenso techo de la escalera, que representa el Olimpo y los cuatro continentes. En 1756 se convierte en el primer presidente de la Academia de pintura de Venecia. En 1762, el rey Carlos III lo llama a Madrid para decorar los techos de su nuevo palacio real. Trabaja allí con sus hijos Giandomenico y Lorenzo, pero el gusto cambia, y el pintor neoclásico Anton Raphael Mengs le hace la competencia. Tiepolo muere en Madrid en 1770."""
style = """
Tiepolo es el último gran decorador de la tradición barroca. Abre los techos a cielos inmensos y luminosos, donde figuras vistas desde abajo flotan entre las nubes. Su paleta clara, sus colores pálidos y dorados, sus puestas en escena teatrales prolongan el arte de Veronés. Con él concluye la gran pintura de historia veneciana, justo antes del triunfo del neoclasicismo."""

[[artistes]]
nom = "Rosalba Carriera"
vie = "Venecia, 1673 – Venecia, 15 de abril de 1757"
biographie = """
Hija de un empleado de la República y de una encajera, Rosalba Carriera comienza dibujando patrones de encaje, y luego pinta miniaturas para las tapas de cajas de rapé, a menudo sobre marfil. A principios del siglo XVIII se vuelve hacia el pastel y se hace pronto célebre: la Academia de San Lucas de Roma la admite entre sus miembros. Los viajeros del Grand Tour, los príncipes y los soberanos de paso por Venecia se hacen retratar por ella; el príncipe elector de Sajonia, futuro Augusto III, colecciona sus obras. En 1720-1721 reside en París en casa del banquero y coleccionista Pierre Crozat; allí pinta al joven Luis XV y conoce a Antoine Watteau, de quien hace el retrato. La Academia real de pintura la recibe por aclamación. En 1730 trabaja en Viena para el emperador Carlos VI. Vive en Venecia con sus hermanas, Giovanna, que la asiste, y Angela, esposa del pintor Giovanni Antonio Pellegrini. Aquejada de cataratas, operada sin éxito, pierde la vista y muere en 1757."""
style = """
Rosalba Carriera hizo del pastel, hasta entonces técnica de boceto, un arte de primer orden. Sus retratos, de una suavidad vaporosa, resuelven la piel, los polvos, los encajes y las pieles con una ligereza nueva. Su estancia en París lanzó la moda del retrato al pastel en Francia, donde Maurice Quentin de La Tour y Jean-Baptiste Perronneau siguieron su ejemplo."""

[[artistes]]
nom = "Bernardo Bellotto"
vie = "Venecia, hacia 1721 – Varsovia, 17 de noviembre de 1780"
biographie = """
Hijo de una hermana de Canaletto, Bernardo Bellotto entra muy joven en el taller de su tío, donde aprende la veduta, la vista de ciudad, y el grabado. En 1742 parte a Roma, y luego pinta vistas de ciudades del norte de Italia, como Verona y Turín. En 1747 se instala en Dresde, por invitación del elector de Sajonia Augusto III, que lo nombra pintor de la corte. Allí pinta durante diez años grandes vistas de la ciudad y de sus alrededores. La guerra de los Siete Años lo obliga a marcharse: trabaja en Viena para la emperatriz María Teresa, y luego en Múnich. De vuelta en Dresde, encuentra una ciudad devastada por los bombardeos prusianos de 1760. Tras la muerte de Augusto III, llega a Varsovia, donde el rey Estanislao Augusto Poniatowski lo nombra su pintor de corte. Pinta allí más de veinte vistas de la ciudad y muere en Varsovia en 1780."""
style = """
Bellotto lleva la veduta hacia la exactitud: vistas muy amplias, arquitectura descrita piedra a piedra, luz fría y sombras nítidas. Menos brillante que su tío, más grave, pinta también las ciudades de Europa central. Sus vistas de Varsovia sirvieron para reconstruir la ciudad vieja, destruida durante la Segunda Guerra Mundial."""

[[artistes]]
nom = "Pietro Longhi"
vie = "Venecia, 5 de noviembre de 1701 – Venecia, 8 de mayo de 1785"
biographie = """
Pietro Falca, hijo de un orfebre veneciano, toma el nombre de Longhi al hacerse pintor. Se forma en Verona junto a Antonio Balestra, y luego en Bolonia junto a Giuseppe Maria Crespi, pintor de escenas de la vida cotidiana. Sus comienzos son los de un pintor de historia: en 1734 pinta al fresco la Caída de los Gigantes en la escalera del palacio Sagredo, en Venecia. Pero hacia 1740 encuentra su camino con pequeños cuadros que muestran la vida de los patricios venecianos: la lección de baile, el concierto, el tocador, la visita, el ridotto donde se juega enmascarado. Estas escenas agradan a la nobleza de la ciudad, que se reconoce en ellas. El dramaturgo Carlo Goldoni, que pintaba en el teatro la misma sociedad, saluda su talento en un poema. Longhi participa en la vida de la Academia de Venecia y dirige a partir de 1763 una escuela de dibujo. Su hijo Alessandro se convierte en un retratista de renombre."""
style = """
Longhi es el cronista de la Venecia del siglo XVIII: formatos pequeños, figuras algo rígidas como muñecos, colores suaves, interiores apacibles. Sin la sátira mordaz de su contemporáneo inglés William Hogarth, observa con ligera ironía los ritos de una aristocracia que se divierte. Sus cuadros son hoy una fuente valiosa sobre los trajes, las máscaras y los interiores de su tiempo."""

[[artistes]]
nom = "Francesco Guardi"
vie = "Venecia, 5 de octubre de 1712 – Venecia, 1 de enero de 1793"
biographie = """
Francesco Guardi nace en Venecia en una familia de pintores originaria del Trentino. A la muerte de su padre, Domenico, en 1716, el taller familiar pasa a sus hermanos mayores, y sobre todo a Gian Antonio, con quien Francesco pinta durante años cuadros religiosos y copias. Su hermana Maria Cecilia se casa en 1719 con Giambattista Tiepolo. Tras la muerte de Gian Antonio, en 1760, Francesco se consagra a las vistas de Venecia y a los caprichos, paisajes imaginarios hechos de ruinas y lagunas. Trabaja para los viajeros extranjeros y para aficionados venecianos, a la estela de Canaletto, pero con una manera cada vez más libre. En 1782 se le encarga pintar las fiestas ofrecidas en Venecia al papa Pío VI y a los grandes duques de Rusia. Solo tardíamente es admitido en la Academia, como pintor de perspectiva. Muere en Venecia a comienzos de 1793; su hijo Giacomo sigue vendiendo vistas de la ciudad."""
style = """
Guardi pinta una Venecia vibrante y cambiante, hecha de pinceladas rápidas, de reflejos y de siluetas esbozadas, bajo cielos grises y plateados. Menos exacto que Canaletto, capta la atmósfera más que la arquitectura. Desconocido en vida, fue admirado en el siglo XIX, y se ha visto en él un lejano precursor de los impresionistas."""
