[[oeuvres]]
titre = "El banquete de Cleopatra"
artiste = "Giambattista Tiepolo"
annee = "1743–1744"
image = "banquet-cleopatre.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Giambattista_Tiepolo_-_The_Banquet_of_Cleopatra_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 250,3 × 357 cm"
collection = "National Gallery of Victoria, Melbourne"
note = "Para ganar una apuesta, Cleopatra va a disolver una perla en su copa y a beberla ante los ojos de Marco Antonio: la Antigüedad vestida de fiesta veneciana."
description = """
El banquete se celebra bajo un pórtico abierto al cielo, entre altas columnas estriadas. En el centro, en una mesa cubierta con un mantel blanco, está sentada Cleopatra, con vestido de seda dorada de ancha gola y un collar de perlas al cuello. Con la mano derecha sostiene una perla sobre una copa de cristal. Frente a ella, Marco Antonio, con casco, envuelto en un manto rojo, la mira, sentado en un sillón. Alrededor, criados, pajes, soldados y cortesanos con trajes orientales observan la escena; en primer plano a la izquierda, un hombre con sombrero azul, visto de espaldas, trae una fuente. Un lebrel está sentado ante la mesa. En la balaustrada del fondo, unos espectadores se asoman para ver."""
evocation = """
Plinio el Viejo cuenta que Cleopatra apostó con Marco Antonio que gastaría una fortuna en una sola comida. En el postre, hizo disolver en vinagre una de las dos mayores perlas del mundo, que llevaba como pendiente, y se la bebió. Tiepolo elige el instante suspendido en que la reina va a dejar caer la perla: un gesto de desafío, de lujo y de poder. Los historiadores ven en ello también un retrato de la Venecia del siglo XVIII, ciudad de fiestas y derroches, cuyo poder declina. Los trajes mezclan la Antigüedad, Oriente y la moda del siglo XVI, en homenaje a los festines de Veronés."""
histoire = """
Tiepolo comienza el cuadro para un cliente que sigue siendo incierto, quizá el mercader inglés Joseph Smith, protector de Canaletto. El escritor Francesco Algarotti, que compra cuadros para Augusto III, elector de Sajonia y rey de Polonia, lo descubre inacabado en el taller y consigue que se termine para Dresde. El lienzo abandona sin embargo Sajonia: en 1764, Catalina II de Rusia lo compra en Ámsterdam, y permanece en el Ermitage de San Petersburgo durante más de siglo y medio. En 1932, el gobierno soviético, que vende obras maestras para procurarse divisas, lo cede; la National Gallery of Victoria lo adquiere en 1933. Tiepolo retomó el tema al fresco en el palacio Labia, en Venecia."""
facture = """
Tiepolo pinta con pincelada ligera y rápida, con una paleta clara donde dominan el oro, el blanco, el rojo y el azul pálido del cielo. El decorado, con sus columnas y su balaustrada vistas desde abajo, recuerda los festines de Veronés, a quien admiraba. La luz, pareja y plateada, baña todo el cuadro, sin sombras profundas. Las figuras se disponen como en un escenario de teatro, en torno a un vacío central donde se juega el gesto de Cleopatra; el mantel blanco lo convierte en el punto más luminoso."""
details = [
  "La perla que Cleopatra sostiene sobre la copa de cristal.",
  "El casco con plumas de Marco Antonio, sentado a la derecha de la mesa.",
  "El lebrel sentado en primer plano, a la derecha.",
  "El hombre del sombrero azul que trae una fuente, a la izquierda.",
  "Los pájaros que cruzan el cielo, sobre la balaustrada.",
]
themes = ["antigüedad", "banquete", "lujo", "apuesta", "teatro"]
anecdote = """
Tiepolo se había casado en 1719 con Maria Cecilia Guardi, hermana de los pintores Gian Antonio y Francesco Guardi, de quien se expone una vista de Venecia en los salones vecinos. Dos de sus hijos, Giandomenico y Lorenzo, fueron sus ayudantes."""
