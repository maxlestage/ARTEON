mur = "nord"
position = 6
largeur = 1.15

[[oeuvres]]
titre = "San Marcos liberando al esclavo"
artiste = "Le Tintoret"
annee = "1548"
image = "miracle-esclave.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jacopo_Tintoretto_-_The_Miracle_of_St_Mark_Freeing_the_Slave_-_WGA22480.jpg"
technique = "Óleo sobre lienzo, 416 × 544 cm"
collection = "Gallerie dell'Accademia, Venecia"
note = "San Marcos se lanza del cielo, de cabeza, para salvar a un esclavo del suplicio: el lienzo que hizo famoso a Tintoretto, a los treinta años."
description = """
Ante un pórtico y un jardín cerrado por un emparrado, una multitud se agolpa en torno a un hombre desnudo tendido en el suelo, boca arriba. Unos verdugos se ensañan con él, pero sus instrumentos se rompen: un hombre con turbante blande un martillo, otro muestra un palo quebrado, trozos de madera astillados cubren el suelo. Los espectadores se inclinan, estupefactos. Sobre ellos, san Marcos, con túnica roja y manto anaranjado, desciende del cielo cabeza abajo, en un destello de luz que rodea su cabeza. A la derecha, sobre una tarima, el amo del esclavo, con túnica roja, se inclina fuera de su asiento, conmocionado. A la izquierda, una mujer sostiene a un niño, y un hombre se aferra a una columna para ver mejor."""
evocation = """
La Leyenda dorada cuenta que un esclavo, al servicio de un señor de Provenza, partió, pese a la prohibición de su amo, a venerar las reliquias de san Marcos; a su regreso, fue condenado a que le sacaran los ojos y le quebraran las piernas, pero los instrumentos del suplicio se rompieron. Para la cofradía de San Marcos, este milagro celebraba el poder del patrón de Venecia. Tintoretto hace de él un espectáculo impresionante: el santo irrumpe en pleno vuelo, sin que nadie lo vea, y el estupor se propaga entre la multitud. Se ha visto en ello la afirmación de una pintura nueva, fundada en el movimiento, el escorzo y la sorpresa."""
histoire = """
La Scuola Grande di San Marco, una de las cofradías más ricas de Venecia, encarga el lienzo para su sala de reuniones. Tintoretto, de unos treinta años, nunca ha pintado nada tan grande. Según su biógrafo Carlo Ridolfi, parte de los cofrades duda en aceptar la obra, y el pintor se la lleva a casa hasta que se la vuelven a pedir. El cuadro es finalmente admirado: el escritor Pietro Aretino felicita al pintor en una carta de abril de 1548. Tintoretto pintará después otros milagros de san Marcos para la misma cofradía. Confiscado por los franceses en 1797, el lienzo vuelve a Venecia en 1815 e ingresa entonces en las Gallerie dell'Accademia."""
facture = """
Según Ridolfi, Tintoretto había inscrito en el muro de su taller un lema: el dibujo de Miguel Ángel y el color de Tiziano. Se reconocen aquí ambos: cuerpos poderosos vistos en escorzo, como el santo invertido o el esclavo tendido, y colores vivos, rojos, anaranjados, azules. La composición está construida como una escena de teatro: un espacio profundo, figuras apretadas en primer plano, gestos que convergen hacia el cuerpo tendido. La pincelada es rápida, a veces apenas esbozada; Tiziano y sus partidarios reprochaban al joven pintor esa ejecución apresurada."""
details = [
  "El santo que se lanza del cielo, de cabeza, visto en escorzo.",
  "Los trozos de madera y las herramientas rotas en torno al esclavo.",
  "El hombre aferrado a una columna, arriba a la izquierda.",
  "El amo, a la derecha, que se inclina fuera de su asiento.",
  "La mujer que sostiene a un niño, en el borde izquierdo de la multitud.",
]
