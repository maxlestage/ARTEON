[[oeuvres]]
titre = "Dresde vista desde la orilla derecha del Elba"
artiste = "Bernardo Bellotto"
annee = "1748"
image = "dresde-rive-droite.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Canaletto_-_Dresden_seen_from_the_Right_Bank_of_the_Elbe,_beneath_the_Augusts_Bridge_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 133 × 237 cm"
collection = "Gemäldegalerie Alte Meister, Dresde"
note = "Un veneciano sobre el Elba: la más célebre vista de Dresde, que conserva la imagen de una ciudad destruida en 1945."
description = """
Desde la orilla derecha del Elba, se descubre la ciudad vieja de Dresde, al otro lado del río. A la izquierda, el largo puente de piedra de Augusto alinea sus arcos sobre el agua en calma. Sobre los tejados se eleva la gran cúpula de piedra de la Frauenkirche, la iglesia de Nuestra Señora. A la derecha, la Hofkirche, la iglesia católica de la corte, está aún en construcción: su torre está envuelta en andamios. A su lado, palacios de fachadas claras se reflejan en el río. En primer plano, sobre la ribera de arena, paseantes, pescadores y barqueros atienden a sus ocupaciones; unas barcas están amarradas, otra cruza. El cielo, inmenso y cambiante, ocupa más de la mitad del lienzo."""
evocation = """
Bellotto pinta una capital moderna y orgullosa, la del elector Augusto III, que lo hizo venir de Venecia. La ciudad se agranda y se embellece: la cúpula protestante de la Frauenkirche, terminada unos años antes, y la nueva iglesia católica de la corte, querida por un príncipe católico que reinaba sobre un país luterano, se responden a ambos lados del puente. El cuadro celebra el orden y la prosperidad de un Estado. Ha adquirido, para nosotros, un valor de testimonio: casi todo lo que muestra fue destruido por los bombardeos de febrero de 1945, y su precisión lo convierte en una imagen de memoria."""
histoire = """
Sobrino y discípulo de Canaletto, Bellotto llega a Dresde en 1747, llamado por Augusto III, elector de Sajonia y rey de Polonia, que lo nombra pintor de la corte. Emprende para él una gran serie de vistas de Dresde y de Pirna, de formato monumental. Este lienzo, fechado en 1748, es una de las primeras. En Alemania y en Polonia, Bellotto se hace llamar con el nombre de su tío, Canaletto, lo que mantendrá durante mucho tiempo la confusión. El cuadro pertenece desde entonces a las colecciones de Dresde. Puesto a salvo durante la guerra, es llevado a Moscú por el Ejército Rojo en 1945, con las demás obras maestras de la galería, y regresa a Dresde en 1955."""
facture = """
Bellotto aprendió con Canaletto el rigor de la veduta: perspectiva exacta y arquitectura descrita con minuciosidad; se cree que se ayudaba, como él, de una cámara oscura. Pero su paleta es más fría que la de su tío: azules y grises plateados, sombras francas, nubes cargadas a la manera holandesa. Pinta lienzos muy grandes donde cada ventana es legible, y anima los primeros planos con figuras tomadas de la vida cotidiana. La luz esculpe las fachadas y hace centellear sus reflejos sobre el Elba."""
details = [
  "Los andamios que rodean la torre de la Hofkirche, aún inacabada.",
  "La cúpula de la Frauenkirche, sobre los tejados.",
  "Los reflejos de los palacios en el agua inmóvil del río, a la derecha.",
  "Los paseantes y los pescadores en la ribera, en primer plano a la izquierda.",
  "Los arcos del puente de Augusto, que recorren toda la izquierda del cuadro.",
]
themes = ["ciudad", "río", "veduta", "arquitectura", "memoria"]
anecdote = """
Este punto de vista sobre la ciudad vieja lleva todavía, en Dresde, el nombre de «Canaletto-Blick», la vista de Canaletto. Para reconstruir la Frauenkirche, terminada en 2005, se consultaron las vistas de Bellotto entre los documentos antiguos."""
salle = 4
mur = "nord"
position = 0
largeur = 2.4

[[oeuvres]]
titre = "El rinoceronte"
artiste = "Pietro Longhi"
annee = "1751"
image = "rhinoceros.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Pietro_Longhi_-_The_Rhinoceros_-_WGA13408.jpg"
technique = "Óleo sobre lienzo, 62 × 50 cm"
collection = "Ca' Rezzonico, museo del siglo XVIII veneciano, Venecia"
note = "Clara, la rinoceronte que dio la vuelta a Europa, exhibida en el carnaval de Venecia ante espectadores enmascarados."
description = """
En un recinto de tablas, de suelo sembrado de paja, un rinoceronte de la India mastica un manojo de heno. Ocupa toda la mitad inferior del cuadro, de perfil, con su piel gruesa plegada como una armadura. Tras una barrera, unos espectadores lo miran. A la izquierda, su guardián, con traje pardo, blande el cuerno del animal y un látigo. A su lado, un hombre sin máscara, con chaqueta azul, y luego dos personajes vestidos con la bauta, el disfraz veneciano del carnaval, con tricornio, capa negra y máscara blanca. Tras ellos, tres mujeres, una de las cuales lleva una pequeña máscara negra ovalada. A la derecha, un joven con manto rojo fuma en pipa. En el muro, un cartel lleva una inscripción."""
evocation = """
El cuadro es ante todo un documento: muestra un animal real, Clara, una hembra de rinoceronte llegada de la India, que el capitán holandés Douwemout van der Meer paseó por toda Europa durante diecisiete años. Pero Longhi se interesa tanto por los espectadores como por el animal. Los venecianos enmascarados, impasibles, parecen tan extraños como la bestia que contemplan, y este juego de miradas crea una discreta ironía. El cuadro testimonia la curiosidad científica del siglo de las Luces y el gusto veneciano por los espectáculos del carnaval, adonde se acudía, bajo la máscara, a ver las maravillas del mundo."""
histoire = """
Clara llega a Venecia en enero de 1751 y causa sensación durante el carnaval. El patricio Giovanni Grimani encarga entonces a Longhi este «verdadero retrato», como precisa la inscripción del cartel, que da también el año y el nombre del pintor. Longhi pinta al menos otra versión, hoy en la National Gallery de Londres. El lienzo de Grimani pertenece a los museos cívicos de Venecia y se expone en Ca' Rezzonico, palacio del Gran Canal convertido en 1936 en el museo del siglo XVIII veneciano, donde convive con numerosas escenas más del pintor."""
facture = """
Longhi pinta pequeños cuadros de gabinete, hechos para ser vistos de cerca, en la tradición de las escenas de género. Su pincelada es fina, sus colores son suaves, con armonías de pardos, blancos y azules pálidos. Los personajes, algo rígidos, casi muñecos, se alinean como en el escenario de un pequeño teatro. El animal, en cambio, está resuelto con afán de exactitud: el peso del cuerpo, los pliegues de la piel, hasta el excremento dejado en el suelo."""
details = [
  "El cuerno que blande el guardián: Clara lo había perdido poco antes.",
  "El cartel, arriba a la derecha, con la dedicatoria a Giovanni Grimani.",
  "La moretta, pequeña máscara negra que las mujeres sujetaban con los dientes.",
  "El joven con manto rojo que fuma en pipa, a la derecha.",
]
themes = ["animal", "carnaval", "máscaras", "curiosidad", "vida cotidiana"]
anecdote = """
Clara fue el animal más célebre de su siglo: se vendían grabados, medallas y figurillas con su efigie, y Jean-Baptiste Oudry la pintó a tamaño natural en París en 1749. Murió en Londres en 1758."""
