[[oeuvres]]
titre = "San Jerónimo en su estudio"
artiste = "Antonello de Messine"
annee = "hacia 1475"
image = "saint-jerome-cabinet.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Antonello_da_Messina_-_St_Jerome_in_his_study_-_National_Gallery_London.jpg"
technique = "Óleo sobre tabla de tilo, 45,7 × 36,2 cm"
collection = "National Gallery, Londres"
note = "Un sabio en una catedral en miniatura: el santo lee, solo, en un mueble-escritorio alzado bajo bóvedas góticas. La tabla mide menos de medio metro; se muestra aquí ampliada."
description = """
Miramos a través de una gran arcada de piedra, como por una ventana abierta. Al otro lado se extiende un vasto interior abovedado, entre iglesia y palacio, de suelo embaldosado en verde y blanco. En el centro, sobre una tarima de madera, san Jerónimo lee, sentado a su escritorio, vestido con la túnica roja de los cardenales. A su alrededor, estantes con libros, cajas y jarrones de loza; su sombrero rojo está colocado sobre un arca, a la derecha. Un gato yace sobre la tarima, junto a dos plantas en maceta. En la galería de columnas de la derecha, un león avanza a paso lento. Por las ventanas se vislumbran colinas, un río y pájaros en el cielo. Sobre el antepecho de piedra, en primer plano, una perdiz, un pavo real y una palangana de cobre parecen aguardar al visitante."""
evocation = """
Jerónimo, el sabio que tradujo la Biblia al latín a finales del siglo IV, era el modelo de los humanistas: el hombre de estudio retirado del mundo. Antonello hace de él un letrado de su tiempo, instalado en un studiolo como los que poseían los eruditos del Renacimiento. El cuadro es también una meditación sobre el saber y la mirada: todo está ordenado por la perspectiva, que conduce el ojo desde la arcada hasta el libro abierto, en el centro exacto de la composición. Los animales y las plantas se han leído como símbolos: el pavo real, imagen de inmortalidad; la perdiz, asociada a la verdad; las plantas en maceta, evocaciones de la salvación y de la Pasión. El león recuerda la leyenda del santo que le quitó una espina de la pata, y a quien el animal ya no abandonó."""
histoire = """
La pequeña tabla data sin duda de los años 1474-1475, cuando Antonello, llegado de Sicilia, se dispone a residir en Venecia; se ha supuesto que la llevaba como demostración de su pericia, para atraer encargos. En 1529, el aficionado veneciano Marcantonio Michiel la describe en la casa del mercader Antonio Pasqualino, y anota que algunos la creen de Jan van Eyck o de Hans Memling, tan flamenca parece su minuciosidad. El cuadro pasa después a Inglaterra; en el siglo XIX pertenece a la familia Baring, condes de Northbrook. Su atribución a Antonello, establecida en 1856 por los historiadores Crowe y Cavalcaselle, ya no se discute. Ingresa en la National Gallery de Londres en 1894."""
facture = """
Antonello es uno de los primeros italianos en dominar la pintura al óleo a la manera de los flamencos: capas finas y transparentes, que logran el reflejo del metal, el grano de la madera o la luz que se desliza sobre las baldosas. La construcción en perspectiva, rigurosísima, recuerda a Piero della Francesca. La luz viene de varios lados a la vez: de frente, a través de la arcada, y del fondo, por las ventanas, lo que confiere al vasto espacio una atmósfera serena y dorada, de una profundidad asombrosa para un formato tan pequeño."""
details = [
  "El gato tendido sobre la tarima, a la izquierda, junto a las plantas en maceta.",
  "El león que avanza en la penumbra de la galería, a la derecha.",
  "El pavo real y la perdiz posados sobre el antepecho de piedra, en primer plano.",
  "Las colinas y el río diminutos, entrevistos por las ventanas.",
  "El sombrero rojo de cardenal colocado sobre el arca, a la derecha.",
]
themes = ["estudio", "perspectiva", "santo", "humanismo", "animales"]
anecdote = """
San Jerónimo nunca fue cardenal: esa dignidad no existía en su época. Pero los pintores del Renacimiento le dan la túnica y el sombrero rojos, porque había sido en Roma el secretario del papa Dámaso."""
salle = 2
mur = "nord"
position = -6
largeur = 1.0

[[oeuvres]]
titre = "El retablo de San Giobbe"
artiste = "Giovanni Bellini"
annee = "hacia 1487"
image = "pala-san-giobbe.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Giovanni_Bellini_-_San_Giobbe_Altarpiece_-_WGA1704.jpg"
technique = "Óleo sobre tabla, 471 × 258 cm"
collection = "Gallerie dell'Accademia, Venecia"
note = "Bajo una bóveda de oro como la de San Marcos, la Virgen está entronizada entre seis santos, mientras tres ángeles músicos tocan a sus pies."
description = """
La tabla, muy alta y de remate semicircular, figura una capilla. Una bóveda de casetones se abre a un ábside cubierto de mosaico de oro, donde se recortan unos serafines y una inscripción latina. En el centro, sobre un alto trono de mármol, la Virgen, con manto azul, sostiene al Niño desnudo sobre sus rodillas y levanta la mano derecha. A uno y otro lado se alzan seis santos. A la izquierda, san Francisco, con hábito pardo, abre la mano; tras él aparece san Juan Bautista; luego Job, anciano casi desnudo, junta las manos. A la derecha, santo Domingo lee un libro rojo, san Sebastián, con el cuerpo atravesado por flechas, está de pie, y san Luis de Tolosa lleva la mitra de obispo. Al pie del trono, tres ángeles tocan dos laúdes y una viola."""
evocation = """
Job, el hombre probado por Dios, y san Sebastián, invocado contra la peste, recuerdan a los enfermos y las epidemias que azotaban regularmente Venecia; se ha vinculado el retablo con la peste de 1485. La Virgen, que intercede por los hombres, protege aquí a los fieles. Bellini confiere a esta reunión celestial la calma de una conversación silenciosa, lo que se llama una «sacra conversazione». El ábside dorado evoca la basílica de San Marcos: la escena transcurre en una iglesia veneciana, casi familiar. La inscripción de la bóveda saluda a María como la flor sin mancha del pudor virginal. La música de los ángeles, por último, sugiere la armonía del cielo, que el fiel cree oír ante el altar."""
histoire = """
Bellini pinta el retablo para un altar de la iglesia franciscana de San Giobbe, en Cannaregio, vinculada a la cofradía del mismo nombre; el comitente exacto sigue siendo desconocido. La obra, sin fecha, se sitúa generalmente hacia 1487; está en su lugar en 1493. Pintada para su emplazamiento, prolongaba la arquitectura real: las pilastras pintadas continuaban las del marco de piedra del altar, de modo que la capilla pintada parecía abrirse en el muro de la iglesia. El retablo permanece en la iglesia hasta principios del siglo XIX, en tiempos de las supresiones napoleónicas, y entra luego en las Gallerie dell'Accademia. Separado de su marco, que se quedó en San Giobbe, ha perdido allí parte de su ilusión, pero ha ganado un público inmenso."""
facture = """
Bellini es uno de los primeros venecianos en pintar al óleo un gran retablo. Obtiene de ello colores profundos y una luz suave y cálida que unifica toda la escena. El punto de fuga está situado bajo, de modo que se ve la bóveda desde abajo, como un fiel de pie ante el altar. El cuadro de una sola pieza, donde todos los personajes comparten el mismo espacio, rompe con los polípticos de compartimentos de la generación anterior. Se reconoce en él el ejemplo de Antonello da Messina, cuyo retablo de San Cassiano, pintado en Venecia en 1475-1476, había impresionado a los pintores de la ciudad."""
details = [
  "La inscripción en letras capitales sobre el mosaico de oro del ábside.",
  "Los serafines dorados alineados bajo la inscripción.",
  "Las flechas clavadas en el cuerpo de san Sebastián.",
  "El libro rojo que lee santo Domingo.",
  "Los tres ángeles músicos sentados en los escalones del trono.",
]
themes = ["sacra conversazione", "virgen", "música", "peste", "arquitectura"]
anecdote = """
Bellini firmó IOANNES BELLINVS en un pequeño cartel pintado al pie del trono, justo bajo el ángel que toca en el centro: una firma en trampantojo, como un papel colocado sobre el escalón, que hay que buscar para verla."""
salle = 2
mur = "nord"
position = 0
largeur = 2.2

[[oeuvres]]
titre = "El sueño de santa Úrsula"
artiste = "Vittore Carpaccio"
annee = "1495"
image = "reve-sainte-ursule.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Vittore_carpaccio,_Dream_of_St_Ursula_01.jpg"
technique = "Temple sobre lienzo, 274 × 267 cm"
collection = "Gallerie dell'Accademia, Venecia"
note = "En una apacible alcoba veneciana, la princesa Úrsula duerme; un ángel entra y le anuncia su martirio."
description = """
Una alcoba clara y ordenada, vista como un escenario de teatro. A la izquierda, bajo un baldaquino rojo, Úrsula duerme en una gran cama, con la mejilla apoyada en la mano, cubierta por una sábana blanca y una colcha roja. Su corona está colocada a los pies de la cama. Al fondo, dos ventanas de arco dejan ver plantas en maceta; una puerta entornada da a otra estancia. En los muros, estatuillas, un aplique, armarios abiertos. A la derecha, sobre una mesita, un libro abierto y un reloj de arena. Por la puerta, un ángel rubio, con vestido azul, acaba de entrar, con una palma en la mano; la luz de la mañana entra con él y dibuja sobre el suelo una ancha mancha dorada. En primer plano, casi oculto, un perrito duerme."""
evocation = """
La Leyenda dorada cuenta que Úrsula, princesa bretona cristiana, acepta casarse con un príncipe pagano a condición de que este se convierta y de que ella realice antes una peregrinación a Roma con once mil vírgenes; a la vuelta, todas son masacradas por los hunos en Colonia. Aquí, el ángel le anuncia en sueños ese destino. Carpaccio elige un momento apacible, casi doméstico: nada anuncia la violencia, salvo la palma del martirio. La alcoba ordenada, las ventanas abiertas, las plantas se han leído como imágenes de la pureza y de la vida interior de la santa. Para los venecianos, era también una alcoba familiar, la de una rica morada de su ciudad."""
histoire = """
El lienzo pertenece al ciclo de nueve grandes pinturas de la vida de Úrsula que Carpaccio realiza entre 1490 y 1495 aproximadamente para la Scuola di Sant'Orsola, una pequeña cofradía instalada junto a la iglesia dominica de Santi Giovanni e Paolo. El Sueño, fechado en 1495 en un pequeño cartel, es uno de los últimos episodios pintados. Tras la supresión de las cofradías bajo la dominación napoleónica, los lienzos ingresan en 1812 en las Gallerie dell'Accademia; están reunidos desde 1923 en una sala que les está consagrada. En el siglo XIX, el crítico inglés John Ruskin se prenda de esta figura de santa: en 1876-1877 obtiene permiso para estudiar y copiar el cuadro, descolgado para él, en una sala aparte."""
facture = """
Carpaccio pinta al temple sobre lienzo, técnica corriente en Venecia, donde la humedad deteriora los frescos. Construye la alcoba en perspectiva, con su techo de vigas y sus muebles que huyen hacia el fondo, y la llena de objetos observados con la precisión de un inventario. La luz, tranquila, entra por la puerta y las ventanas y proyecta sombras nítidas. Los colores son sobrios: rojo de la cama y del baldaquino, verde de los zócalos, azul del ángel. Esta claridad de relato, aprendida junto a Gentile Bellini, hace de él el gran narrador de la pintura veneciana."""
details = [
  "La corona colocada a los pies de la cama, sobre el escalón.",
  "El reloj de arena sobre la mesita, junto al libro abierto.",
  "Las dos plantas en maceta tras las ventanas del fondo.",
  "La palma que sostiene el ángel, signo del martirio venidero.",
  "El perrito echado en primer plano, abajo en el centro.",
]
themes = ["sueño", "santa", "ángel", "alcoba", "leyenda dorada"]
anecdote = """
El carpaccio, plato de finas lonchas de carne de vaca cruda, lleva el nombre del pintor: Giuseppe Cipriani, en el Harry's Bar de Venecia, lo habría bautizado así hacia 1950, el año de una gran exposición de Carpaccio, por los rojos intensos de sus cuadros."""
salle = 2
mur = "sud"
position = 4.5
largeur = 2.6

[[oeuvres]]
titre = "Retrato de un joven en su estudio"
artiste = "Lorenzo Lotto"
annee = "hacia 1530"
image = "jeune-homme-cabinet.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Accademia_-_Ritratto_di_giovane_gentiluomo_nel_suo_studio_-_Lorenzo_Lotto_cat.912.jpg"
technique = "Óleo sobre lienzo, 98 × 111 cm"
collection = "Gallerie dell'Accademia, Venecia"
note = "Un joven pálido hojea un gran libro, rodeado de objetos que parecen hablar de su melancolía."
description = """
Un joven, visto de medio cuerpo, está sentado ante una mesa cubierta con un tapete verde. Viste una amplia prenda negra de mangas abullonadas y una camisa blanca cerrada en el cuello. Su rostro, largo y pálido, está vuelto hacia nosotros, pero su mirada parece lejana. Con la mano izquierda pasa las páginas de un grueso registro colocado ante él. Sobre la mesa yacen un chal azul con flecos, una carta doblada, una pequeña cadena de oro, pétalos de rosa esparcidos y una lagartija. El fondo está sumido en la sombra: se adivinan objetos colgados en el muro y un arca. En el extremo izquierdo, una ventana se abre a un cielo azul y a una línea de colinas, única salida de luz en esta estancia cerrada."""
evocation = """
Es uno de los retratos más misteriosos del Renacimiento. El joven parece apartarse de los placeres del mundo, la caza y la música, evocados por un cuerno y un laúd relegados a la sombra, para dedicarse al estudio o al trabajo, sin encontrar en ello la paz. Los pétalos caídos, la carta, la lagartija se han leído como alusiones a un amor decepcionado, a la fuga del tiempo o a la enfermedad: en italiano se le llama a veces el «giovane malato». Lotto, inquieto y solitario, prestó con frecuencia a sus modelos esa vida interior atormentada. El sentido exacto de los objetos sigue discutiéndose, y eso es lo que da fuerza al retrato."""
histoire = """
Lotto pinta este retrato hacia 1530 en Venecia, adonde se ha vuelto a establecer en 1525 tras una docena de años pasados en Bérgamo. El modelo no ha sido identificado. El cuadro permanece mucho tiempo en una colección privada de Treviso, donde su atribución a Lotto se reconoce en 1923. El Estado italiano lo compra en 1930 para las Gallerie dell'Accademia. Allí convive con los grandes retablos venecianos, pero pertenece a otro mundo: el del retrato privado, hecho para un círculo íntimo. El registro que hojea el joven ha hecho pensar en un libro de cuentas, lo que lo convertiría en un mercader o un administrador, pero ninguna fuente lo confirma."""
facture = """
Lotto pinta con una precisión casi flamenca: cada objeto, de la lagartija a los flecos del chal, está descrito con esmero. La composición es inusual: el joven está desplazado hacia la izquierda, la mesa ocupa toda la derecha, y el formato, más ancho que alto, deja gran espacio a los objetos. Los negros profundos de la prenda contrastan con el verde ácido del tapete y el azul del chal. Una luz fría, venida de la izquierda, aísla el rostro y las manos. Frente a Tiziano, su contemporáneo, Lotto prefiere contornos nítidos y una atmósfera más inquieta."""
details = [
  "La pequeña lagartija posada sobre el chal azul.",
  "Los pétalos de rosa esparcidos sobre el tapete verde.",
  "La carta doblada y la cadena de oro, al borde del libro.",
  "La ventana abierta a un paisaje, arriba a la izquierda.",
]
themes = ["retrato", "melancolía", "símbolos", "lectura", "vanitas"]
anecdote = """
Lotto llevó desde 1538 hasta su muerte un libro de cuentas que ha llegado hasta nosotros: en él se leen sus encargos, sus deudas y sus reveses. En 1550, en Ancona, organiza incluso una lotería de sus cuadros sin vender, que le reporta bien poco."""
