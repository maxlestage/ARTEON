note = "Un pequeño bronce de Pagan, la ciudad de los miles de templos, en el momento en que Birmania adopta el budismo theravada. Mide 23,5 cm."
description = """
El Buda está sentado con las piernas cruzadas, con las plantas de los pies vueltas hacia el cielo, sobre un pedestal formado por dos filas de pétalos de loto, unos vueltos hacia arriba y otros hacia abajo. Su mano izquierda reposa, con la palma abierta, en el regazo; la derecha desciende sobre la rodilla, con los dedos rozando el suelo. Su túnica monástica, ceñida, deja desnudo el hombro derecho; un pliegue de tela doblado cae sobre el hombro izquierdo hasta la cintura. La cabeza, cubierta de pequeños rizos, lleva en lo alto una protuberancia rematada por un botón. El rostro es redondo y apacible, los ojos bajos. El metal, de tono dorado, ha permanecido liso y brillante."""
evocation = """
El gesto de la mano derecha es uno de los más importantes del arte budista: se llama «toma de la tierra por testigo». Según el relato tradicional, en el momento en que el Buda, sentado bajo el árbol de Bodh Gaya, iba a alcanzar el Despertar, el demonio Mara le disputó el derecho a conseguirlo; el Buda tocó entonces la tierra, que testimonió en su favor, y Mara huyó. La estatua representa, pues, el instante mismo del Despertar. Este tema, venido de los grandes centros budistas del noreste de la India, se convirtió, en Pagan y luego en toda Birmania, en la imagen más difundida del Buda."""
histoire = """
En el siglo XI, el rey Anawrahta unifica en torno a Pagan, a orillas del Irauadi, la primera gran monarquía birmana, y favorece el budismo theravada. Durante dos siglos y medio, los reyes y los fieles de Pagan construyen miles de templos y de estupas de ladrillo, adornados con pinturas murales y poblados de estatuas. Los monjes y los peregrinos viajan entre Pagan, Bodh Gaya y Sri Lanka, lo que explica la influencia del arte indio en este bronce. El reino declina tras las invasiones mongolas de finales del siglo XIII. Este Buda ingresó en el Metropolitan Museum of Art en 2003."""
facture = """
La estatuilla está fundida en bronce a la cera perdida y luego cincelada. Según la descripción del museo, tiene incrustaciones de plata y cobre: finos hilos de metal de color distinto se encajaban en el bronce para realzar ciertos detalles, una técnica refinada reservada a las piezas de calidad. Las proporciones, los hombros anchos, la cintura fina y el rostro redondo, siguen los modelos de la India oriental bajo la dinastía Pala, que los artesanos birmanos conocían bien."""
details = [
  "Los dedos de la mano derecha que rozan el suelo, ante la rodilla.",
  "La doble fila de pétalos de loto del pedestal, abiertos hacia arriba y hacia abajo.",
  "El pliegue de tela doblado que cae sobre el hombro izquierdo.",
  "El pequeño botón que remata la protuberancia del cráneo.",
]
themes = ["budismo", "birmania", "despertar", "bronce", "loto"]
anecdote = """
En la llanura de Pagan, más de dos mil templos y estupas de ladrillo, construidos entre los siglos XI y XIII, siguen en pie. El sitio fue inscrito en el Patrimonio Mundial de la Unesco en 2019."""
salle = 3
