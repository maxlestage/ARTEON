[[oeuvres]]
titre = "Damayanti y el cisne (Hamsa Damayanti)"
artiste = "Raja Ravi Varma"
annee = "1899"
image = "hamsa-damayanti.jpg"
cadre = "dore"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Ravi_Varma-Princess_Damayanthi_talking_with_Royal_Swan_about_Nala.jpg"
technique = "Óleo sobre lienzo"
collection = "Sree Chitra Art Gallery, Thiruvananthapuram"
note = "Un cisne viene a hablar de amor a una princesa: la mitología india pintada al óleo, a la europea, por el pintor más popular de la India."
description = """
Una joven se halla de pie en los peldaños de una terraza de mármol, junto a un estanque. Lleva un sari rojo de orla dorada, drapeado a la manera de Maharashtra, y una blusa rosa; una flor adorna sus cabellos negros, perlas ornan su cuello y sus orejas, brazaletes sus muñecas. Acodada en una balaustrada, con la mejilla apoyada en la mano, escucha, soñadora. Ante ella, sobre la cima de un pilar octogonal cubierto de hojas de loto, un cisne blanco vuelve la cabeza hacia ella, como si le hablara. Detrás, una columna acanalada, un muro rojo y un parque de árboles oscuros; abajo a la derecha, lotos rosas brotan en el agua. La firma y la fecha están inscritas abajo a la izquierda."""
evocation = """
La historia de Nala y Damayanti se cuenta en el Mahabharata. Nala, rey de Nishadha, captura un cisne maravilloso que, a cambio de su libertad, promete elogiar sus méritos ante la princesa Damayanti, de Vidarbha. El pintor muestra el momento en que el ave le habla de Nala: sin haberlo visto nunca, ella se enamora. Ravi Varma elige el instante íntimo, la ensoñación, en lugar de la acción. Para los indios de su tiempo, ver a las heroínas de las epopeyas con los rasgos de mujeres de su época, en sari, en un decorado de palacio, era una novedad asombrosa: sus dioses y sus héroes se volvían cercanos, casi familiares."""
histoire = """
Ravi Varma pinta este cuadro en 1899, en la cumbre de su fama, cuando trabaja para los maharajás de Travancore, Baroda y Mysore y su prensa litográfica difunde sus composiciones por todo el país. El tema de Damayanti y el cisne es uno de sus mayores éxitos: existen reproducciones en cromolitografía que han decorado innumerables hogares. El cuadro se conserva en la Sree Chitra Art Gallery de Thiruvananthapuram, en Kerala, inaugurada en 1935 en la antigua capital del reino de Travancore, y que reúne un importante conjunto de obras del pintor."""
facture = """
Ravi Varma es uno de los primeros pintores indios en dominar plenamente la pintura al óleo europea, con sus veladuras, su modelado por la sombra y la luz y su perspectiva. Rinde con virtuosismo las materias: la seda del sari, su orla dorada, el mármol, las plumas del cisne. El gran formato vertical, la figura casi a tamaño natural y el decorado de arquitectura clásica recuerdan la pintura académica de la Europa victoriana. La luz suave, venida de la izquierda, modela el rostro y el brazo de la joven."""
details = [
  "El gesto de Damayanti, con la mejilla apoyada en la mano, perdida en sus pensamientos.",
  "El pico naranja del cisne vuelto hacia la princesa.",
  "La orla dorada del sari rojo, que atrapa la luz.",
  "Los lotos rosas en capullo en el agua, abajo a la derecha.",
  "La firma, Ravi Varma, y la fecha de 1899, abajo a la izquierda.",
]
themes = ["mahabharata", "amor", "cisne", "princesa", "pintura al óleo"]
anecdote = """
Más tarde, durante la elección de su esposo, Damayanti ve cinco Nalas idénticos: cuatro dioses han tomado su apariencia. Reconoce al verdadero porque suda, parpadea y sus pies tocan el suelo, cosa que los dioses son incapaces de hacer."""
