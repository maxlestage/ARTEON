[[oeuvres]]
titre = "Bodhisattva Maitreya de pie"
artiste = "Gandhara, époque kouchane"
annee = "hacia el siglo III"
image = "maitreya-gandhara.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DP123372.jpg"
technique = "Esquisto gris, 163,2 × 53,3 × 20,3 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El Buda del futuro, como un príncipe indio drapeado a la romana: el arte del Gandhara nació del encuentro entre la India y el mundo griego."
description = """
Un joven se yergue de pie, a tamaño natural, ante un amplio disco de piedra que forma su aureola. Sus cabellos ondulados caen en bucles sobre los hombros y se recogen en lo alto del cráneo en un moño de doble lazada. Lleva un fino bigote de puntas levantadas. Con el torso en parte desnudo, está adornado con joyas: collares superpuestos, un cordón con amuletos que le cruza el pecho, brazaletes y una ajorca en el brazo. Una tela drapeada pasa sobre su hombro izquierdo y cae en una amplia banda en arco ante los muslos; una larga falda plisada desciende hasta los tobillos. Sus pies calzan sandalias de correas. El antebrazo derecho, que se alzaba, ha desaparecido. En el pedestal, pequeños personajes en oración rodean un objeto colocado en el centro."""
evocation = """
Maitreya es el Buda venidero: según la tradición budista, espera en el cielo el momento de renacer en la tierra para enseñar de nuevo, cuando la enseñanza del Buda histórico haya sido olvidada. Antes de este último nacimiento, es un bodhisattva, un ser de Despertar que ha elegido permanecer entre los hombres para ayudarlos. Por eso el escultor lo muestra como príncipe, con las joyas y el bigote de los nobles de su tiempo, y no como monje de cráneo rapado. El moño de bucles y el pequeño frasco de agua, que la mano izquierda parece aún sujetar, son sus atributos habituales. Con frecuencia se ha subrayado el parecido de este rostro y de este drapeado con las estatuas romanas: un dios indio vestido a la antigua."""
histoire = """
El Gandhara se extiende en torno a Peshawar, en el noroeste del actual Pakistán. Tras el paso de Alejandro Magno, allí reinaron reinos griegos, y la región se convirtió, bajo el imperio kushán, en una encrucijada entre la India, Irán, Asia central y el mundo romano. Los monasterios budistas se cubren allí de estatuas y relieves tallados en el esquisto local. Esta estatua se alzaba sin duda en uno de esos santuarios, al pie de un estupa o en una capilla. Se ignora su lugar exacto de hallazgo. Ingresó en el Metropolitan Museum of Art en 1991, adquirida gracias a una donación del Lita Annenberg Hazen Charitable Trust."""
facture = """
El esquisto gris, roca fina y densa, se presta al detalle: el escultor pudo excavar en él los pliegues apretados de la tela, los mechones del cabello y los eslabones de los collares. El drapeado, que sigue el cuerpo y cae en pliegues pesados y regulares, procede de la escultura grecorromana, como la ligera flexión de una pierna que anima la pose. La estatua estaba esculpida para ser vista de frente, adosada a un muro: la aureola y la espalda quedan más sumarias. En origen, la piedra estaba quizá realzada con colores o dorados."""
details = [
  "El fino bigote de puntas levantadas, como el de un príncipe.",
  "El cordón de amuletos que cruza el pecho en diagonal.",
  "La banda que cae en arco ante los muslos, de pliegues regulares.",
  "Las sandalias de correas, anudadas entre los dedos.",
  "Los pequeños fieles en oración esculpidos en el pedestal.",
]
themes = ["budismo", "bodhisattva", "gandhara", "influencia griega", "drapeado"]
anecdote = """
Los dos Budas gigantes de Bamiyán, en Afganistán, de 38 y 55 metros de altura, pertenecían al mundo budista heredero del Gandhara. Fueron destruidos con explosivos por los talibanes en marzo de 2001."""
salle = 2
mur = "ouest"
place = 3
largeur = 0.8

[[oeuvres]]
titre = "Buda de pie ofreciendo su protección"
artiste = "Inde du Nord, époque gupta"
annee = "finales del siglo V"
image = "bouddha-mathura.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT237.jpg"
technique = "Arenisca roja, 85,5 × 42,5 × 16,5 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Esculpido en Mathura, este Buda de cuerpo envuelto en finos pliegues encarna el modelo clásico que toda Asia imitó."
description = """
El Buda se yergue de pie, de frente, con el cuerpo recto y sereno. Su cabeza está cubierta de pequeños rizos en forma de concha de caracol, coronados por una protuberancia redondeada. Sus párpados están bajos, los lóbulos de las orejas alargados, y su rostro pleno permanece perfectamente sereno. Viste una túnica monástica tan fina que parece mojada: se pega al cuerpo, deja adivinar los hombros, el vientre y las piernas, y solo está marcada por pliegues en forma de cordoncillos que descienden en guirnaldas regulares por toda la figura. Su mano izquierda sujeta el borde de la tela; la derecha, que se alzaba con la palma abierta, está rota. Tras la cabeza, un fragmento de la aureola conserva una decoración de follaje finamente cincelada."""
evocation = """
El gesto perdido de la mano derecha, con la palma vuelta hacia el fiel, es el abhaya-mudra, el gesto que tranquiliza: «no temas». La estatua no cuenta ninguna historia; muestra a un ser que ha alcanzado el Despertar, desapegado del mundo, cuyo cuerpo perfecto y liso expresa la paz interior. Los textos indios enumeran las marcas físicas de un ser excepcional, como la protuberancia del cráneo o los lóbulos alargados, que el escultor respeta. Bajo los Gupta, estos signos se funden en una imagen de gran dulzura, que durante mucho tiempo se consideró la expresión clásica del Buda. Los peregrinos llegados de China y del Sudeste Asiático se llevaron copias, y este modelo fue imitado desde Java hasta Tailandia."""
histoire = """
La dinastía gupta reina sobre el norte de la India a partir del siglo IV; este período suele llamarse la edad clásica del arte indio. Dos grandes talleres de escultura budista dominan entonces: Sarnath, cerca de Benarés, donde el Buda pronunció su primer sermón, y Mathura, a orillas del Yamuna, al sur de Delhi. Mathura trabaja una arenisca roja moteada de claro, extraída de las canteras vecinas, y produce desde hace siglos estatuas para toda la India del Norte. Esta figura procede de ese taller; se alzaba sin duda en un monasterio. El Metropolitan Museum of Art la adquirió en 1979, gracias a una donación de Enid A. Haupt."""
facture = """
El escultor obtuvo el efecto de tela mojada tratando la túnica como una segunda piel, sobre la que dispuso, en relieve muy leve, pliegues en aristas paralelas. El volumen del cuerpo, simplificado y redondeado, no es musculoso: está concebido como una forma ideal más que como un cuerpo observado. La arenisca roja de Mathura, bastante blanda, permite este modelado liso y los cincelados de la aureola. La estatua, adosada a una estela, estaba hecha para ser vista de frente."""
details = [
  "Los pliegues de la túnica en finos cordoncillos que descienden en guirnaldas.",
  "Los pequeños rizos del cabello, enrollados como conchas.",
  "La mano izquierda que pellizca el borde de la tela a la altura de la cadera.",
  "El fragmento de aureola, arriba a la izquierda, adornado con roleos de follaje.",
  "Las manchas claras de la arenisca roja, propias de las canteras de Mathura.",
]
themes = ["budismo", "edad clásica", "serenidad", "arenisca roja", "gupta"]
anecdote = """
El mayor Buda de metal de esta época, de más de dos metros de altura, fue descubierto en 1861 por unos ingenieros que construían una vía férrea en Sultanganj, en Bihar. Hoy se conserva en el museo de Birmingham, en Inglaterra."""
salle = 2
mur = "est"
place = 1
largeur = 1.0

[[oeuvres]]
titre = "Nataraja, Shiva rey de la danza"
artiste = "Inde du Sud, époque chola"
annee = "siglo XI"
image = "nataraja.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1930.331.jpg"
technique = "Bronce, 113 × 102 × 30 cm"
collection = "Cleveland Museum of Art"
note = "Shiva danza en un círculo de llamas para destruir y recrear el universo: la imagen más célebre del arte indio."
description = """
En un gran anillo erizado de llamas, un dios de cuatro brazos danza sobre una sola pierna. Su pierna derecha, ligeramente flexionada, aplasta a un pequeño personaje tendido sobre el pedestal; la izquierda se levanta y se tiende hacia la derecha, atravesando el cuerpo. Los dos brazos superiores se separan: la mano derecha sostiene un pequeño tambor en forma de reloj de arena, la izquierda una llama. La mano inferior derecha se alza con la palma abierta; el brazo inferior izquierdo pasa ante el pecho, con la mano colgante señalando el pie levantado. El dios lleva un alto tocado en abanico, pendientes, collares y aros en los tobillos. Su rostro permanece sereno, casi sonriente. El pedestal en forma de loto está perforado por dos orificios."""
evocation = """
Para los fieles de Shiva, el tiempo es cíclico: el mundo nace, dura, es destruido y recreado sin fin, y es la danza del dios la que le da el ritmo. El tambor marca el latido de la creación, la llama anuncia la destrucción, y el anillo de fuego figura el universo. La mano levantada dice al fiel que no tema; la que señala el pie alzado le muestra el camino de la liberación. El enano aplastado encarna la ignorancia, o el olvido de uno mismo, que la danza vence. Esta danza se asocia al templo de Chidambaram, en tierra tamil, donde Shiva es venerado con este nombre. El equilibrio perfecto de la figura, a la vez torbellino e inmovilidad, ha hecho de Nataraja un símbolo de la India."""
histoire = """
Del siglo IX al XIII, la dinastía chola domina el sur de la India desde el país tamil. Sus reyes cubren su reino de templos de piedra y hacen fundir, para estos santuarios, estatuas de bronce destinadas a las procesiones: durante las fiestas se las viste con sedas, se las cubre de flores y joyas y se las pasea por las calles. Los orificios del pedestal servían para fijar las andas. Esta estatua fue vendida en 1930 al Cleveland Museum of Art por el marchante C. T. Loo, establecido en París y Nueva York; se ignora de qué templo procede. Sigue siendo una de las obras más admiradas del museo."""
facture = """
Los bronces chola se funden a la cera perdida: el modelo, esculpido en cera, se recubre de arcilla y luego se calienta; la cera se derrite y el metal en fusión ocupa su lugar. Como el molde se rompe para liberar la estatua, cada pieza es única. El escultor retoma después con el buril los detalles de las joyas y del rostro. Algunos tratados fijan las proporciones del cuerpo, pero los mejores artesanos añaden flexibilidad e impulso. Aquí, toda la composición se inscribe en el círculo, en torno al eje vertical de la pierna de apoyo."""
details = [
  "El pequeño tambor en forma de reloj de arena, en la mano derecha levantada.",
  "La llama colocada en la palma izquierda, como una ofrenda.",
  "El enano de la ignorancia, bajo el pie derecho, que alza la cabeza hacia el dios.",
  "Las lengüetas de fuego regulares que erizan el anillo de llamas.",
  "Los dos orificios del pedestal, por donde pasaban las andas de procesión.",
]
themes = ["hinduismo", "shiva", "danza", "cosmos", "bronce", "procesión"]
anecdote = """
En 2004, la India regaló al CERN, el gran laboratorio europeo de física de partículas cercano a Ginebra, una estatua de Shiva Nataraja de dos metros de altura: evoca la danza de la materia y de la energía."""
salle = 2
mur = "nord"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Cabeza de Buda de Borobudur"
artiste = "Java, dynastie Shailendra"
annee = "principios del siglo IX"
image = "tete-bouddha-borobudur.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1942.1087.jpg"
technique = "Piedra volcánica (andesita), alt. 30,6 cm"
collection = "Cleveland Museum of Art"
note = "Una de las centenas de cabezas de Buda del mayor monumento budista del mundo, en el corazón de Java. Mide 31 cm de alto."
description = """
Una cabeza de Buda, sola, reposa sobre un pedestal moderno. La piedra es gris y porosa, acribillada de minúsculos agujeros. Los cabellos están formados por grandes rizos redondos, enrollados en espiral y alineados en filas apretadas, que cubren también la protuberancia en lo alto del cráneo. El rostro es ancho y lleno, de mejillas redondas. Los párpados, pesados, están casi cerrados, y la mirada se filtra hacia abajo. Las cejas dibujan dos arcos netos que se unen al caballete de la nariz. La boca, de labios carnosos, esboza una sonrisa apenas perceptible. Los lóbulos de las orejas, muy alargados, descienden hasta la mandíbula. La cabeza fue separada a la altura del cuello de la estatua a la que pertenecía."""
evocation = """
El rostro no expresa ninguna emoción en particular, sino un estado: la paz interior de quien ha alcanzado el Despertar. Los párpados bajos vuelven la mirada hacia el interior, hacia la meditación. Los largos lóbulos recuerdan que el Buda, nacido príncipe, llevaba antaño pesados adornos en las orejas, a los que renunció. En Borobudur, las estatuas de Buda se colocaban en hornacinas y en estupas caladas, a lo largo de un recorrido que lleva al peregrino, terraza tras terraza, del mundo de los deseos hasta la cima, imagen del Despertar. Este rostro era uno de los puntos de llegada de esa ascensión. Separado del monumento, da testimonio también de la historia de su dispersión."""
histoire = """
Borobudur se levanta hacia el año 800, en el centro de Java, bajo la dinastía budista de los Shailendra. Abandonado al cabo de unos siglos, invadido por la vegetación y la ceniza volcánica, es despejado a partir de 1814 por orden del gobernador británico de Java, Thomas Stamford Raffles. En el siglo XIX y a principios del XX, bajo la administración colonial neerlandesa, centenares de cabezas de Buda son retiradas o robadas y dispersadas por el mundo. Esta fue vendida en 1942 al Cleveland Museum of Art por el marchante Raphaël Stora, de Nueva York. El monumento, restaurado de 1907 a 1911 y luego, con la Unesco, de 1975 a 1982, está inscrito en el Patrimonio Mundial desde 1991."""
facture = """
La andesita, una roca volcánica abundante en Java, es rugosa y está llena de burbujas: impide el pulido y los detalles demasiado finos. El escultor trabajó, pues, por grandes masas simples, el globo del cráneo, el óvalo del rostro, los arcos de las cejas, y dejó que la luz jugara con los rizos en relieve. En origen, la piedra estaba sin duda cubierta por un enlucido pintado, hoy desaparecido. Las centenas de estatuas del monumento fueron talladas según un mismo modelo, por equipos de escultores."""
details = [
  "Los rizos redondos del cabello, todos enrollados en el mismo sentido.",
  "Los pequeños agujeros de la piedra volcánica, visibles en las mejillas.",
  "Los párpados pesados, que solo dejan ver una rendija.",
  "Los lóbulos de las orejas alargados hasta la mandíbula.",
]
themes = ["budismo", "java", "meditación", "piedra volcánica", "patrimonio disperso"]
anecdote = """
En 1896, con ocasión de la visita a Java del rey Chulalongkorn de Siam, la administración colonial neerlandesa le regaló varios carros de esculturas tomadas de Borobudur. Todavía se conservan en el Museo Nacional de Bangkok."""
salle = 3
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Busto de Hevajra"
artiste = "Empire khmer, style du Bayon"
annee = "finales del siglo XII – principios del XIII"
image = "buste-hevajra.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT5215.jpg"
technique = "Arenisca, 132,1 × 73,7 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un dios de rostros escalonados, sonriente como las torres del Bayon: el budismo de Angkor bajo el rey Jayavarman VII."
description = """
De esta gran estatua solo quedan la parte superior del cuerpo y las cabezas. En primer plano, un rostro ancho, de ojos entornados, sonríe dulcemente; otros dos rostros, vistos de perfil, lo prolongan a los lados, de modo que el dios mira en tres direcciones. Encima, un segundo piso repite la misma disposición: un rostro de frente, más pequeño, flanqueado por dos perfiles. El rostro principal lleva una diadema en la frente y largos pendientes colgantes. Los hombros son anchos, pero los brazos han desaparecido; solo queda un muñón, a la izquierda, y una gran rotura hunde el pecho. La piedra, gris y granulosa, está desgastada por el tiempo."""
evocation = """
Hevajra es una divinidad del budismo tántrico, una forma del Vajrayana venida del noreste de la India. Sus textos lo describen con ocho cabezas y dieciséis brazos, danzando, con una copa hecha de un cráneo en cada mano: una figura terrible, que destruye las ilusiones y las pasiones. Los escultores jemeres hicieron de él, sin embargo, una imagen apaciguada, de rostros sonrientes. Estas caras múltiples, que miran en todas las direcciones, recuerdan las torres de rostros del Bayon, el templo construido en el centro de Angkor Thom por Jayavarman VII. Se ha visto en ellas la imagen de una compasión que vela por todo el reino. Hevajra parece haber sido muy venerado en el imperio jemer en esa época."""
histoire = """
El imperio jemer domina del siglo IX al XV una gran parte del Sudeste Asiático continental, desde su capital, Angkor, al noroeste de la actual Camboya. A finales del siglo XII, el rey Jayavarman VII, budista, reconstruye la ciudad tras una guerra contra Champa, funda Angkor Thom, levanta el Bayon y cubre su reino de templos, hospitales y posadas de etapa. Este busto data de su reinado o del de sus sucesores inmediatos. Ingresó en el Metropolitan Museum of Art en 1936. En 2023, el Met anunció la restitución a Camboya y Tailandia de dieciséis esculturas vinculadas al marchante Douglas Latchford, acusado de tráfico; este busto, adquirido mucho antes, no formaba parte de ellas."""
facture = """
La estatua está tallada en arenisca, la piedra de casi todos los templos de Angkor. El estilo del Bayon se reconoce por sus rostros anchos, de ojos bajos, de labios gruesos estirados en una leve sonrisa. Aquí, las cabezas se superponen en pisos que se inscriben en una silueta piramidal. El escultor repitió el mismo rostro variando solo la orientación, lo que da al conjunto una gran unidad. Las joyas están esculpidas en relieve bajo, sin excavar la masa de la piedra."""
details = [
  "La leve sonrisa de los labios, común a todos los rostros.",
  "Los rostros de perfil, a cada lado, que miran hacia los costados.",
  "El segundo piso de rostros, más pequeños, sobre el primero.",
  "Los largos pendientes colgantes del rostro principal.",
  "La gran rotura del pecho y el muñón del brazo, a la izquierda.",
]
themes = ["budismo", "angkor", "sonrisa", "jemer", "rostros"]
anecdote = """
El Bayon, en el centro de Angkor Thom, luce en sus torres más de doscientos rostros gigantes esculpidos en la piedra. Muchos historiadores piensan que combinan los rasgos de un bodhisattva y los del propio rey Jayavarman VII."""
salle = 3
mur = "nord"
place = 5
largeur = 1.2

