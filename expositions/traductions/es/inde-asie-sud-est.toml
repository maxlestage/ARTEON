[[oeuvres]]
titre = "Krishna y Radha en un bosquecillo, página de un Gita Govinda"
artiste = "Sahibdin"
annee = "hacia 1665"
image = "krishna-radha-bosquet.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DP259542.jpg"
technique = "Tinta y acuarela opaca sobre papel, 24,4 × 19,7 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una noche de primavera a orillas del Yamuna: la pintura de corte del Mewar ilustra el gran poema de amor de Krishna y Radha."
description = """
La noche ha caído sobre un bosque: una luna creciente brilla en un cielo azul sembrado de estrellas blancas. A la izquierda, bajo un cenador de follaje tendido sobre un fondo rojo y decorado con guirnaldas de flores blancas, rosas y naranjas, Krishna, de piel azul y coronado, está sentado sobre una alfombra junto a Radha; le toca tiernamente la barbilla. Ante ellos hay jarrones de oro. En el centro, sola entre los árboles, una joven vestida con una falda amarilla de cuadros y un velo rojo se mantiene de pie, con la mano levantada. A la derecha, árboles de follajes estilizados, rojos, verdes y amarillos, y flores. Abajo corre un río oscuro, donde brotan lotos."""
evocation = """
El Gita Govinda, «el canto del vaquero», es un poema sánscrito escrito en el siglo XII por Jayadeva. Cuenta, en primavera, los amores de Krishna, dios que creció entre los vaqueros, y de Radha: los celos, la separación, los mensajes llevados por una confidente y, después, el reencuentro en los bosquecillos a orillas del Yamuna. Para los fieles de Krishna, este amor humano es también la imagen del alma que busca a Dios. La joven sola en el bosque es sin duda la confidente, intermediaria entre los amantes. El pintor hace de toda la naturaleza, árboles en flor, luna y río, el eco de su pasión, como en el poema."""
histoire = """
El Mewar, cuya capital es Udaipur, en Rajastán, es uno de los reinos rajputas más antiguos. Tras la paz concluida con el emperador mogol Jahangir en 1615, sus soberanos hacen trabajar a un taller de pintores que ilustra los grandes textos religiosos y poéticos en series de decenas, incluso centenares, de páginas. El Metropolitan Museum atribuye esta página de un Gita Govinda hoy disperso a Sahibdin, el maestro de ese taller, documentado hacia 1628–1655, y la fecha hacia 1665; una parte de la ejecución podría corresponder a sus discípulos. Fue donada al museo en 1988 por la Ernest Erickson Foundation."""
facture = """
La pintura está hecha de acuarela opaca, a base de pigmentos minerales y vegetales aglutinados con goma, aplicada en planos de color sobre un papel preparado y luego pulido. Los colores son francos y se yuxtaponen sin sombras: rojo, amarillo, verde, azul lapislázuli. Los árboles son motivos repetidos, casi ornamentos, y las figuras, de perfil, tienen el gran ojo almendrado del estilo del Mewar. Algunos toques de oro hacen brillar las joyas y la vajilla. La orla roja y amarilla enmarca la escena como una ventana."""
details = [
  "La luna creciente y las estrellas blancas salpicadas en el cielo.",
  "El gesto de Krishna, que levanta la barbilla de Radha.",
  "Las guirnaldas de flores colgadas del cenador.",
  "Los jarrones de oro colocados sobre la alfombra ante la pareja.",
  "Los lotos en capullo en el río oscuro, abajo a la izquierda.",
]
themes = ["krishna", "radha", "amor", "noche", "poesía", "rajput"]
anecdote = """
Desde hace siglos, el Gita Govinda se canta en el culto del templo de Jagannath, en Puri, en Odisha, y sus versos han inspirado a bailarines y músicos de toda la India, desde el odissi hasta el canto devocional."""
