[[oeuvres]]
titre = "Buda sentado tomando la tierra por testigo"
artiste = "Thaïlande, héritage de Sukhothai"
annee = "finales del siglo XV – siglo XVI"
image = "bouddha-thailande.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT8728.jpg"
technique = "Bronce, 49,5 × 31,7 × 19,1 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "La llama en lo alto del cráneo y la silueta esbelta proceden de Sukhothai, el primer gran reino tailandés."
description = """
El Buda está sentado con las piernas recogidas, la pierna derecha sobre la izquierda, en un cojín bordeado por una hilera de perlas, que a su vez descansa sobre un pedestal macizo. Su mano derecha desciende sobre la rodilla, con los dedos casi tocando el suelo; la izquierda reposa en el regazo. El cuerpo es delgado y flexible, los hombros anchos, la cintura estrecha. Una fina túnica ceñida deja desnudo el hombro derecho, y un largo pliegue de tela cae del hombro izquierdo hasta el ombligo. La cabeza, cubierta de pequeños rizos puntiagudos, termina en una alta llama. El rostro ovalado, de nariz aguileña y cejas arqueadas, esboza una sonrisa. El bronce, oscuro, conserva rastros de cardenillo y de óxido."""
evocation = """
Como el bronce de Pagan expuesto al lado, este Buda toma la tierra por testigo: representa el instante en que, bajo el árbol del Despertar, triunfa sobre Mara. Pero aquí la imagen es más aérea. La llama que brota de lo alto del cráneo figura el resplandor de su sabiduría; se ha convertido en un rasgo típico del Buda tailandés. La silueta fluida, casi sin músculos ni huesos, busca expresar un cuerpo sobrenatural, conforme a las comparaciones de los textos: brazos como la trompa de un elefante, un mentón como el hueso de un mango. Para los fieles, estas estatuas son presencias vivas, a las que se venera, se viste y se cubre de pan de oro."""
histoire = """
En el siglo XIII, unos príncipes tailandeses fundan, al norte de la llanura central, el reino de Sukhothai. Sus reyes adoptan el budismo theravada venido de Sri Lanka y hacen fundir bronces de un estilo nuevo, esbelto y sereno. En el siglo XV, Sukhothai pasa a la autoridad del reino de Ayutthaya, más al sur, pero sus estatuas siguen siendo el modelo de los fundidores durante siglos, tanto en Ayutthaya como en el reino de Lan Na, al norte. Este Buda, fundido a finales del siglo XV o en el XVI, pertenece a esa descendencia. Fue donado al Metropolitan Museum of Art en 1981 por el señor y la señora A. Richard Benedek."""
facture = """
La estatua está fundida a la cera perdida en varias partes, y luego ensamblada y cincelada. Los fundidores tailandeses buscaron curvas continuas: la línea que va del hombro a la mano apoyada en la rodilla, o la del pliegue de tela, se lee de un solo trazo. Los dedos, casi de la misma longitud, son un rasgo del estilo de Sukhothai. El bronce estaba sin duda dorado en origen; la pátina actual, oscura y manchada de verde, se debe al tiempo."""
details = [
  "La alta llama que brota de lo alto del cráneo.",
  "Los dedos de la mano derecha, casi todos de la misma longitud.",
  "El largo pliegue de tela que cae del hombro izquierdo al ombligo.",
  "La hilera de perlas que bordea el cojín bajo las piernas.",
  "Las cejas en arco que se unen sobre la nariz aguileña.",
]
themes = ["budismo", "tailandia", "despertar", "bronce", "llama"]
anecdote = """
El Buda de oro del Wat Traimit, en Bangkok, de estilo Sukhothai, pesa unas cinco toneladas y media. Cubierto de estuco para ocultarlo, pasó siglos por una simple estatua de yeso, hasta que en 1955 el estuco se agrietó durante un traslado."""
