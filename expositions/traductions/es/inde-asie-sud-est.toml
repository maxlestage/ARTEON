[[artistes]]
nom = "Gandhara, époque kouchane"
vie = "Gandhara (noroeste del actual Pakistán y este del actual Afganistán), siglos I–V"
biographie = """
El Gandhara es una región de valles fértiles en torno a Peshawar, en la desembocadura de las rutas que unen la India con Asia central e Irán. Conquistada por Alejandro Magno en 327–326 a. C., sigue después gobernada por reyes griegos y luego por dinastías venidas de las estepas. En los primeros siglos de nuestra era pertenece al imperio kushán, que se extiende desde Asia central hasta el valle del Ganges y cuyo rey Kanishka, en el siglo II, protege el budismo. Los monasterios y los estupas se multiplican en la región, en Taxila, en el valle de Swat, en torno a Peshawar. Los escultores fabrican allí por millares estatuas y relieves de esquisto gris, y luego de estuco, que narran la vida del Buda. Es allí, como en Mathura, donde aparecen hacia el siglo I las primeras imágenes del Buda en forma humana, cuando antes solo se lo figuraba mediante símbolos. Este arte declina con las invasiones de los hunos en el siglo V, pero sus modelos se transmiten por las rutas de la seda hasta China y Japón."""
style = """
El arte del Gandhara mezcla los temas budistas indios con las formas del arte grecorromano: rostros de perfil recto, cabellos ondulados, drapeados de pliegues profundos que recuerdan la toga, poses ligeramente contoneadas. Los bodhisattvas llevan allí las joyas y el bigote de los príncipes kushanes. Esta síntesis dio a Asia uno de sus primeros modelos del Buda."""

[[artistes]]
nom = "Inde du Nord, époque gupta"
vie = "Norte de la India, hacia 320 – mediados del siglo VI"
biographie = """
La dinastía gupta es fundada hacia 320 por Chandragupta I, en el valle del Ganges. Sus sucesores, Samudragupta y luego Chandragupta II, extienden su imperio sobre la mayor parte del norte de la India, en torno a capitales como Pataliputra, la actual Patna. Los Gupta son hindúes, pero protegen también los monasterios budistas y jainistas. Su época ha quedado en la memoria como una edad de oro: la literatura sánscrita brilla en ella con el poeta y dramaturgo Kalidasa, a quien la tradición vincula con la corte de Chandragupta II, y las ciencias se desarrollan. El peregrino chino Faxian, que recorre la India a principios del siglo V, describe ciudades prósperas y monasterios florecientes. En los talleres de Mathura y de Sarnath se fijan entonces los modelos del Buda y de los dioses hindúes. En la misma época, en el vecino Decán, bajo la dinastía aliada de los Vakataka, se excavan y pintan los santuarios de Ajanta. El imperio se debilita a finales del siglo V bajo la presión de las invasiones de los hunos heftalitas y desaparece en el siglo VI."""
style = """
La escultura gupta busca una belleza ideal e interior: cuerpos lisos y flexibles, rostros plenos de ojos bajos, túnicas tan finas que parecen transparentes. Abandona los pesados drapeados del Gandhara por un modelado suave y continuo. Este estilo clásico sirvió de referencia al arte budista de toda Asia, desde el Sudeste Asiático hasta China."""

[[artistes]]
nom = "Inde du Sud, époque chola"
vie = "País tamil (sureste de la India), mediados del siglo IX – siglo XIII"
biographie = """
Los Chola son un linaje tamil muy antiguo, ya citado en las inscripciones del emperador Ashoka en el siglo III a. C. A mediados del siglo IX, una nueva dinastía se instala en Thanjavur, en el delta del Kaveri, y construye en pocas generaciones la principal potencia del sur de la India. Rajaraja I, que reina de 985 a 1014, conquista Kerala y el norte de Sri Lanka y hace levantar en Thanjavur el gran templo de Brihadishvara, consagrado a Shiva. Su hijo Rajendra I dirige una expedición hasta el Ganges y luego una expedición naval contra el reino de Srivijaya, en el Sudeste Asiático, y funda una nueva capital, Gangaikondacholapuram. Los reyes y las reinas chola dotan ricamente los templos, que reciben tierras, joyas y estatuas de bronce para los cultos y las procesiones. La dinastía se debilita en el siglo XIII y desaparece hacia 1279. Sus fundidores han dejado una tradición todavía viva: en la ciudad de Swamimalai, en el país tamil, aún se funden estatuas a la cera perdida con los mismos métodos."""
style = """
Los bronces chola unen el rigor de los tratados religiosos, que fijan las proporciones y los atributos de cada dios, con una gran libertad de movimiento. Cuerpos delgados y elásticos, gestos precisos de las manos, joyas finamente cinceladas: estas estatuas, hechas para llevarse en procesión, figuran entre las cumbres de la escultura en metal."""

[[artistes]]
nom = "Java, dynastie Shailendra"
vie = "Centro de Java (Indonesia), siglos VIII–IX"
biographie = """
En el siglo VIII, el centro de la isla de Java, región de llanuras volcánicas muy fértiles, está dominado por la dinastía de los Shailendra, los «señores de la montaña». Estos reyes budistas, adeptos del Mahayana, mantienen vínculos con Sumatra, con la India y con los grandes monasterios de Bengala. Hacen construir en la llanura de Kedu, cerca de la actual Yogyakarta, varios santuarios de piedra, entre ellos Borobudur, levantado hacia 800: una colina envuelta en terrazas superpuestas, cubiertas de más de dos mil paneles esculpidos y de más de quinientas estatuas de Buda. En el mismo momento, una dinastía hindú vecina construye los templos de Prambanan, consagrados a Shiva. En el siglo X, el centro del poder se desplaza hacia el este de Java, sin duda en parte a causa de las erupciones volcánicas, y los grandes monumentos del centro son abandonados poco a poco. Borobudur, olvidado bajo la vegetación, no es redescubierto por los europeos hasta principios del siglo XIX."""
style = """
El arte de los Shailendra adapta los modelos indios de la época gupta y posgupta a la piedra volcánica de Java. Sus Budas son apacibles y macizos, de rostros plenos y ojos bajos; sus relieves narran con dulzura y precisión la vida del Buda y el mundo cotidiano de Java. Borobudur es su obra maestra."""

[[artistes]]
nom = "Empire khmer, style du Bayon"
vie = "Angkor (actual Camboya), finales del siglo XII – principios del XIII"
biographie = """
El imperio jemer nace a principios del siglo IX, cuando el rey Jayavarman II se proclama soberano universal en el monte Kulen, al norte del lago Tonlé Sap. Sus sucesores instalan su capital en Angkor y levantan allí, durante más de tres siglos, templos-montaña cada vez más vastos, entre ellos Angkor Vat, construido en el siglo XII bajo Suryavarman II y consagrado a Vishnu. En 1177, los cham del centro del actual Vietnam saquean Angkor. El príncipe Jayavarman VII los expulsa y se convierte en rey hacia 1181. Budista fervoroso, reconstruye la capital, Angkor Thom, rodeada de murallas y abierta por puertas coronadas de rostros gigantes, y levanta en su centro el Bayon. Funda también grandes monasterios, como Ta Prohm y Preah Khan, así como hospitales y posadas de etapa a lo largo de los caminos. El estilo que lleva el nombre del Bayon florece bajo su reinado y el de sus sucesores. El imperio declina después, y Angkor deja de ser la capital en el siglo XV."""
style = """
El estilo del Bayon se reconoce por sus rostros anchos y plenos, de ojos bajos y labios gruesos estirados en una sonrisa interior, que se ha llamado la «sonrisa de Angkor». Multiplica las cabezas y los rostros vueltos hacia las cuatro direcciones. Sus esculturas, más humanas y meditativas que las de Angkor Vat, expresan el fervor budista del reinado de Jayavarman VII."""

[[artistes]]
nom = "Birmanie, royaume de Pagan"
vie = "Pagan, a orillas del Irauadi (actual Myanmar), siglos XI–XIII"
biographie = """
Pagan, en la árida llanura del centro de Birmania, a orillas del río Irauadi, es al principio una pequeña ciudad birmana. A mediados del siglo XI, el rey Anawrahta la convierte en la capital del primer reino unificado del país. Según la tradición, se vuelve hacia el budismo theravada tras la conquista de Thaton, ciudad mon del sur, de donde trae monjes, textos y artesanos. Sus sucesores, como Kyanzittha, que hace levantar el templo de Ananda, continúan su obra. Durante más de dos siglos, reyes, reinas y simples fieles construyen miles de templos, monasterios y estupas, para adquirir méritos. Los vínculos son estrechos con Sri Lanka, otro foco del theravada, y con los lugares santos de la India, como Bodh Gaya, cuyo templo Pagan ayuda a restaurar. Debilitado, el reino no resiste los ataques de los mongoles de la dinastía Yuan a finales del siglo XIII. Sus templos, a menudo dañados por seísmos, han seguido siendo un gran lugar de peregrinación."""
style = """
El arte de Pagan se inspira en la India oriental bajo la dinastía Pala, de la que retoma los Budas de hombros anchos y cintura fina, sentados sobre lotos. Añade a ello un gusto birmano por los rostros redondos y serenos y por la riqueza de los materiales, bronce incrustado, laca y dorado. Sus modelos han marcado de manera duradera la escultura budista birmana."""

[[artistes]]
nom = "Thaïlande, héritage de Sukhothai"
vie = "Reinos de Sukhothai, Ayutthaya y Lan Na (actual Tailandia), siglos XIII–XVI"
biographie = """
En el siglo XIII, unos jefes tailandeses se emancipan de la dominación jemer y fundan, en el norte de la llanura central de la actual Tailandia, el reino de Sukhothai. Sus reyes adoptan el budismo theravada, venido de Sri Lanka por medio de monjes, y cubren su capital y su ciudad gemela, Si Satchanalai, de monasterios, estupas y estatuas. Los fundidores de Sukhothai crean entonces un nuevo tipo de Buda, de silueta fluida y con una llama en lo alto del cráneo, e inventan la imagen del Buda caminando, en bulto redondo. En el siglo XV, Sukhothai pasa a la autoridad de Ayutthaya, reino fundado en 1351 más al sur, que se convierte en la gran potencia del país hasta su destrucción por los birmanos en 1767. Al norte, el reino de Lan Na, cuya capital es Chiang Mai desde finales del siglo XIII, desarrolla su propia escuela de broncistas. En todos estos reinos, las estatuas de Sukhothai siguen siendo un modelo, copiado y venerado durante siglos, hasta hoy."""
style = """
El Buda de tradición Sukhothai es delgado, flexible, casi inmaterial: hombros anchos, cintura fina, brazos en largas curvas, dedos de igual longitud, rostro ovalado de nariz aguileña y leve sonrisa, llama en lo alto de la cabeza. Esta imagen, de gran pureza de líneas, se ha convertido en el emblema del arte budista tailandés."""

[[artistes]]
nom = "Sahibdin"
vie = "Activo en Udaipur (Mewar, Rajastán), hacia 1628 – hacia 1655"
biographie = """
De Sahibdin no se conoce ni la fecha de nacimiento ni la de la muerte: solo sus obras, varias de las cuales llevan su nombre y una fecha, permiten seguir su carrera. Pintor musulmán al servicio de los soberanos hindúes del Mewar, dirige el taller real de Udaipur bajo el maharana Jagat Singh I, que reina de 1628 a 1652, y luego a comienzos del reinado de Raj Singh I. Su primera obra fechada es un Ragamala, una «guirnalda de modos musicales», pintado en 1628. Ilustra después el Rasikapriya, poema sobre los enamorados, un Bhagavata Purana consagrado a la vida de Krishna y, sobre todo, varios libros del inmenso Ramayana encargado por Jagat Singh, terminado a principios de la década de 1650 e ilustrado con varios centenares de pinturas. Esta época es aquella en que el Mewar, en paz con el imperio mogol desde 1615, puede dedicar sus riquezas a las artes. Sahibdin, que sin duda conocía la pintura mogol, mantuvo y afirmó, sin embargo, un estilo propio de Rajastán, que sus sucesores retomaron durante décadas."""
style = """
Sahibdin compone sus páginas como tapices: fondos de colores vivos en planos, rojo, amarillo o verde, figuras de perfil de grandes ojos, árboles estilizados, arquitectura vista de frente. A menudo narra varios momentos de una historia en una misma imagen. Su claridad y la fuerza de sus colores definieron el estilo clásico de la pintura del Mewar."""

[[artistes]]
nom = "Devidasa de Nurpur"
vie = "Originario de Nurpur (colinas del Punyab), activo hacia 1680 – hacia 1720"
biographie = """
Devidasa pertenece a una familia de pintores de Nurpur, pequeño principado de las colinas del Punyab, al pie del Himalaya. Estas colinas están entonces repartidas entre una multitud de pequeños Estados rajputas, a menudo unidos por matrimonios, entre los cuales circulan los pintores. Como muchos artistas de estas regiones, Devidasa trabaja para varias cortes vecinas, según los encargos. Su nombre es conocido gracias al colofón de una serie de pinturas del Rasamanjari, el tratado poético de Bhanudatta sobre los enamorados, que indica que la pintó en 1694–1695 para la corte de Basohli. Este documento es valioso: en la pintura india de esa época, las obras firmadas o fechadas son raras, y esta serie sirve de referencia para fechar y atribuir muchas otras páginas del estilo de Basohli. Su serie del Rasamanjari fue dispersada en el siglo XX: hoy se encuentran páginas suyas en el Metropolitan Museum de Nueva York y en otras colecciones de la India, Europa y América."""
style = """
Devidasa practica el estilo de Basohli en su madurez: colores ardientes en planos, fondos amarillos o rojos, figuras de perfil de ojos inmensos, joyas realzadas con oro y plata. Sus composiciones son más aireadas y sus personajes más elegantes que los de las primeras series de Basohli, y anuncian la dulzura de las escuelas pahari del siglo XVIII."""

[[artistes]]
nom = "Raja Ravi Varma"
vie = "Kilimanoor (Travancore, Kerala), 29 de abril de 1848 – Kilimanoor, 2 de octubre de 1906"
biographie = """
Ravi Varma nace en una familia aristocrática vinculada a la casa real de Travancore, en el sur de la India. Un tío pintor le da sus primeras lecciones, y el maharajá Ayilyam Thirunal lo hace venir al palacio de Thiruvananthapuram, donde observa a los pintores de corte y los cuadros europeos de las colecciones reales. Aprende en gran parte solo la pintura al óleo, viendo trabajar, entre otros, a un retratista europeo de paso, Theodore Jensen. En la década de 1870, sus primeros éxitos, como una Dama nair peinándose premiada en una exposición de Madrás, le dan a conocer. Se convierte en el retratista de príncipes y notables, y pinta para el maharajá de Baroda, Sayajirao Gaekwad III, una serie de escenas tomadas de las epopeyas. Envía cuadros a la Exposición Universal de Chicago en 1893. En 1894 funda cerca de Bombay una prensa litográfica que difunde en masa, a bajo precio, imágenes en color de los dioses y los héroes indios; la cede unos años más tarde. Muere en su ciudad natal en 1906."""
style = """
Ravi Varma une la técnica de la pintura académica europea, óleo, modelado, perspectiva, grandes formatos, a los temas de la mitología y la literatura indias. Sus heroínas en sari, de rostro idealizado, fijaron durante generaciones el aspecto de los dioses y las diosas en la imaginería popular, desde los cromos hasta los carteles y el cine indio."""
