[exposition]
ordre = 26
nom_court = "India y Sudeste Asiático"
mouvement = "India y Sudeste Asiático"
cadre = "vitrine"
couleur = "#9a4a1c"
titre = "Dioses, budas y príncipes: el arte de la India y del Sudeste Asiático"
artiste = "Gandhara, Gupta, Chola, Java, Angkor, Pagan, rajputas, Ravi Varma…"
dates = "Siglo III – 1899"
accroche = "Exposición virtual · Chhatrapati Shivaji Maharaj Vastu Sangrahalaya, Bombay"
introduction = """
Dieciséis siglos de arte nacidos en la India y llevados, con el budismo y el hinduismo, hasta Java, Camboya, Birmania y Tailandia. Nos encontramos con un bodhisattva del Gandhara drapeado a la griega, un Buda gupta de arenisca roja, Shiva danzando en su círculo de llamas, una cabeza de Borobudur y un dios de rostros escalonados de Angkor, y después páginas pintadas para las cortes rajputas y un cuadro de Raja Ravi Varma. El edificio se inspira en el museo Chhatrapati Shivaji Maharaj de Bombay: se cruza un pórtico, se entra bajo una alta cúpula y se abren dos alas a ambos lados, una para la escultura del Sudeste Asiático y otra para la pintura."""
vitrine = "nataraja.jpg"

[musee]
nom = "Chhatrapati Shivaji Maharaj Vastu Sangrahalaya (antiguo Museo del Príncipe de Gales)"
ville = "Bombay (Mumbai), India"
architecte = "George Wittet"
construction = "1905–1922"
presentation = """
A principios del siglo XX, unos notables de Bombay deciden fundar un museo en recuerdo de la visita del príncipe de Gales, el futuro Jorge V, que coloca su primera piedra en noviembre de 1905. El arquitecto escocés George Wittet, que diseñará también la Puerta de la India en el puerto, concibe un edificio de estilo indosarraceno: muros de basalto gris y de piedra clara, balcones y arcos tomados de la arquitectura mogol y de los palacios de la India occidental y, en el centro, una gran cúpula. Terminado durante la Primera Guerra Mundial, el edificio sirve primero de hospital militar y no abre al público hasta 1922. En 1998 recibe el nombre de Chhatrapati Shivaji Maharaj, fundador del reino maratha en el siglo XVII. Rodeado de un jardín, el museo reúne hoy decenas de miles de objetos: esculturas de la India antigua, bronces, miniaturas, armas, tejidos y colecciones de historia natural."""
ici = """
El edificio de ARTEON retoma la composición del museo de Bombay: un pórtico, una alta sala central bajo la cúpula y dos alas simétricas. Se entra por el sur al Pórtico, de muros de piedra clara, y luego a la Sala de la Cúpula, cuadrada y de dieciséis metros de altura, donde el Shiva danzante se enfrenta al visitante entre el bodhisattva del Gandhara y el Buda gupta. Al oeste, la Galería del Sudeste Asiático, de veinte metros de largo y color arena, reúne Java, Angkor, Pagan y Tailandia; al este, la Galería de Pinturas, de un rosa terracota, presenta las cortes rajputas y a Ravi Varma."""

