[[oeuvres]]
titre = "Shiva y Parvati jugando al chaupar, página de un Rasamanjari"
artiste = "Devidasa de Nurpur"
annee = "1694–1695"
image = "shiva-parvati-chaupar.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT5245.jpg"
technique = "Acuarela opaca, tinta, plata y oro sobre papel, 16,5 × 27,6 cm (imagen)"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El dios Shiva y su esposa se disputan una partida de dados: la pintura de las colinas del Punyab, en Basohli, en colores ardientes."
description = """
Sobre un fondo amarillo vivo y uniforme, bajo una estrecha franja de cielo blanco y azul, Shiva y Parvati están sentados frente a frente sobre una piel de tigre, de la que se ven las garras y, bajo Shiva, la cabeza. Shiva, de piel blanca de ceniza, estriada de marcas rojas, lleva un moño, un tercer ojo en la frente, una serpiente anudada al cuello y un largo rosario de semillas. Está sentado con las piernas cruzadas y mira a su esposa. Parvati, con falda roja rayada y velo naranja, levanta la mano derecha como para hacer valer su jugada. Entre ambos, el tablero del chaupar, en forma de cruz, lleva fichas cónicas; tres largos dados están colocados al lado. Dos árboles de follaje oscuro enmarcan la escena, sobre colinas pardas."""
evocation = """
El Rasamanjari, «el ramillete de delicias», es un tratado poético sánscrito de Bhanudatta que clasifica a los enamorados y, sobre todo, a las heroínas según su carácter y su situación, ilustrando cada tipo con un verso. Los pintores de Basohli sacaron de él series en las que los amantes son a menudo dioses. Aquí, la partida de dados entre Shiva y Parvati, escena familiar de la mitología, se convierte en una riña de enamorados: el juego sirve de pretexto a las burlas, a los reproches y a la reconciliación. El gran asceta, señor de la destrucción, aparece como un marido atento, y Parvati como una heroína avisada que le planta cara. El fondo amarillo, sin profundidad, sitúa esta disputa fuera del tiempo."""
histoire = """
Basohli es un pequeño principado de las estribaciones del Himalaya, a orillas del río Ravi, en el actual territorio de Jammu. A finales del siglo XVII, sus rajás mantienen a pintores que crean un estilo audaz, uno de los primeros de la pintura llamada pahari, «de las colinas». Según su colofón, esta serie del Rasamanjari fue pintada por Devidasa en 1694–1695. Como muchas series indias, fue dispersada en el siglo XX entre coleccionistas y museos. Esta página fue donada al Metropolitan Museum of Art en 1957 por el doctor J. C. Burnett; el museo la cuenta entre las obras maestras de su colección india."""
facture = """
El estilo de Basohli impresiona por sus colores saturados, aplicados en amplios planos: amarillo, rojo, pardo, verde profundo. Las figuras, de perfil, tienen un ojo inmenso, en forma de loto, que invade el rostro. El pintor mezcló con la acuarela opaca plata y oro para las joyas; en los talleres de Basohli se pegaban también a veces fragmentos de alas de escarabajo para imitar el brillo de las esmeraldas. La ancha orla rojo oscuro, característica de estas series, aísla la escena como un cuadro."""
details = [
  "La cabeza del tigre, bajo Shiva, y sus garras curvadas en las cuatro esquinas.",
  "La serpiente anudada alrededor del cuello de Shiva.",
  "Los tres largos dados colocados junto al tablero en cruz.",
  "La mano levantada de Parvati, con la palma abierta, en el centro del debate.",
  "El gran ojo almendrado de los dos personajes, típico de Basohli.",
]
themes = ["shiva", "parvati", "juego", "pareja", "pahari", "color"]
anecdote = """
El chaupar, que se juega con fichas sobre un tablero en cruz, es el antepasado del pachisi indio y del parchís. Se cuenta que el emperador mogol Akbar lo jugaba en Fatehpur Sikri sobre un tablero gigante dibujado en el patio, con esclavos como fichas."""
