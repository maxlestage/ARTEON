[exposition]
ordre = 172
nom_court = "Automóviles"
mouvement = "El automóvil, de los orígenes a los años locos"
cadre = "vitrine"
couleur = "#4b5d6e"
titre = "Automóviles, el coche de los pioneros a los años locos"
artiste = "Cugnot, Benz, Panhard et Levassor, De Dion-Bouton, Rolls-Royce, Ford, Hispano-Suiza, Bugatti…"
dates = "1770–1929"
accroche = "Exposición virtual · Cité de l'Automobile – Museo Nacional, colección Schlumpf, Mulhouse"
introduction = """
En siglo y medio, el automóvil pasa del sueño de ingeniero al objeto de todos los días. La visita reúne diez piezas, desde el fardier de vapor de Cugnot, construido para el ejército de Luis XV, hasta el Bugatti Royale de Ettore Bugatti, pasando por el triciclo de Carl Benz, los primeros Panhard et Levassor, el pequeño De Dion-Bouton de 1900, el Rolls-Royce Silver Ghost, el Ford T y el Hispano-Suiza de madera de Dubonnet. Dos imágenes completan el recorrido: una estampa de Toulouse-Lautrec y el cartel del Bibendum Michelin. El edificio se inspira en la Cité de l'Automobile de Mulhouse, instalada en una antigua hilatura: una sucesión de talleres conduce a una gran nave de pasillos bordeados de farolas, donde brillan los coches de lujo de los años locos."""
vitrine = "bugatti-royale-napoleon.jpg"

[musee]
nom = "Cité de l'Automobile – Museo Nacional, colección Schlumpf"
ville = "Mulhouse, Francia"
construction = "antigua hilatura del siglo XIX; museo inaugurado en 1982"
presentation = """
El museo de Mulhouse nació de una pasión secreta. Los hermanos Hans y Fritz Schlumpf, industriales textiles, poseen en Alsacia hilaturas de lana. A partir de finales de los años cincuenta, Fritz compra sin contar automóviles antiguos, sobre todo Bugatti, y los hace restaurar en los edificios de una de sus fábricas de Mulhouse, a resguardo de las miradas. En 1976, la empresa se hunde y los hermanos parten hacia Suiza; a principios de 1977, los obreros que ocupan la fábrica descubren la inmensa colección. El Estado la declara monumento histórico, luego una asociación la compra y abre en 1982 el Museo Nacional del Automóvil, convertido en 2006 en la Cité de l'Automobile. Se exponen allí más de cuatrocientos coches, entre ellos dos Bugatti Royale, en una nave inmensa iluminada por cientos de farolas inspiradas en las del puente Alejandro III, en París."""
ici = """
El edificio de ARTEON retoma la idea de la hilatura convertida en museo. Se entra por el sur en el taller de los pioneros, de muros de ladrillo claro y siete metros de altura, y luego se pasa a la sala de la Belle Époque, color crema, y al taller del automóvil para todos, gris como un hangar de fábrica. Viene después la gran nave, de 28 metros de largo y 10 de alto, de muros azul noche como los pasillos de Mulhouse, donde los coches de lujo están alineados como bajo las farolas del museo alsaciano. La visita termina en un pequeño salón color papel antiguo, dedicado a la imagen del automóvil. Los coches se presentan a su tamaño real, en grandes vitrinas murales."""

