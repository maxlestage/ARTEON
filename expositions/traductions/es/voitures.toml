[[oeuvres]]
titre = "Bugatti Type 41 Royale, «Coupé Napoléon»"
artiste = "Ettore Bugatti"
annee = "hacia 1929"
image = "bugatti-royale-napoleon.jpg"
credit = "Photo : Aurélien Boffy"
licence = "CC BY 3.0"
source = "https://commons.wikimedia.org/wiki/File:Bugatti_Royale_Coup%C3%A9_Napol%C3%A9on.jpg"
technique = "Motor de ocho cilindros en línea de 12,7 litros; distancia entre ejes 4,30 m, longitud aproximada 6,40 m; carrocería de cupé de ciudad"
collection = "Cité de l'Automobile – Museo Nacional, colección Schlumpf, Mulhouse"
note = "El coche personal de Ettore Bugatti, sobre el chasis prototipo del Royale: el automóvil más grande y lujoso de su tiempo."
description = """
El Royale, inmenso, se ve en tres cuartos delantero sobre una alfombra roja, en un pasillo del museo de Mulhouse iluminado por farolas de globos. Su carrocería es negra y azul: un largo capó negro, flancos azul claro y un techo cerrado en la parte trasera, mientras que el puesto del chófer, delante, está descubierto. Grandes guardabarros negros se estiran en curva desde las ruedas delanteras hasta los estribos. El radiador en forma de herradura, cromado, está flanqueado por dos enormes faros; en lo alto, una pequeña estatuilla de elefante erguido sobre las patas traseras sirve de tapón. Las ruedas llevan tapacubos lisos. Detrás, otros coches de la colección."""
evocation = """
Ettore Bugatti quería construir el coche de los reyes. El Royale debía rivalizar con los mayores Rolls-Royce y atraer a los soberanos de Europa; llega en el momento de la crisis de 1929, y solo se construyen seis, de los que se venden tres. Ha seguido siendo el símbolo de un lujo sin medida, el de los años locos que terminaban. El Coupé Napoléon, que el propio Bugatti utilizaba, tiene además una dimensión familiar: el elefante del tapón del radiador retoma una escultura de su hermano Rembrandt Bugatti, escultor animalista muerto en 1916. El coche asocia así el arte y la mecánica, como había hecho su padre Carlo, creador de muebles."""
histoire = """
Ettore Bugatti, italiano establecido en Molsheim, en Alsacia, concibe el Royale a mediados de la década de 1920. El prototipo, sobre el chasis 41100, rueda ya en 1926 y recibe varias carrocerías sucesivas; la de cupé de ciudad, llamada «Coupé Napoléon», data de finales de los años veinte. Bugatti lo conserva para su uso personal, y permanece en la familia tras su muerte, en 1947. En 1963, los hermanos Schlumpf compran un conjunto de coches conservados en Molsheim por la familia Bugatti, entre ellos este. Descubierto con el resto de su colección en 1977, es hoy uno de los dos Royale expuestos en la Cité de l'Automobile de Mulhouse."""
facture = """
Todo es desmesurado en el Royale. Su motor de ocho cilindros en línea, de casi 13 litros, deriva de un proyecto de motor de avión; de una sola pieza con sus cilindros y su culata, está tallado en bloques mecanizados con la precisión de relojero que hace la reputación de Bugatti. Las ruedas, de aleación fundida, llevan los tambores de freno. La carrocería del Coupé Napoléon retoma la forma de los coches de amo: el chófer al aire libre, el propietario en un salón cerrado, iluminado por cristales en la parte trasera. Las líneas tensas del capó y de los guardabarros anuncian el estilo de Jean Bugatti, el hijo de Ettore."""
details = [
  "El elefante erguido del tapón del radiador, según Rembrandt Bugatti.",
  "El radiador cromado en forma de herradura, firma de la marca.",
  "Los dos enormes faros a ambos lados del radiador.",
  "Los flancos azul claro entre el capó y los guardabarros negros.",
  "Las farolas de globos del pasillo del museo.",
]
themes = ["lujo", "años locos", "Alsacia", "desmesura", "colección"]
anecdote = """
El motor del Royale tuvo una segunda vida: a falta de compradores para el coche, Bugatti lo utilizó para propulsar automotores, trenes rápidos que circularon en Francia hasta los años cincuenta."""
