[[oeuvres]]
titre = "¡Nunc est bibendum!… ¡El neumático Michelin se bebe el obstáculo!"
artiste = "O'Galop (Marius Rossillon)"
annee = "1898"
image = "michelin-nunc-est-bibendum.jpg"
licence = "Domaine public"
cadre = "noir"
source = "https://commons.wikimedia.org/wiki/File:Michelin_Poster_1898.jpg"
technique = "Cartel litografiado en color (reproducción)"
collection = "Cartel publicitario para Michelin; ejemplares en varias colecciones"
note = "La primera aparición de Bibendum, el muñeco hecho de neumáticos, que levanta su copa de clavos y cascos de vidrio."
description = """
Sobre un fondo azul verdoso, un personaje blanco hecho de una pila de neumáticos apilados, con un lorgnon sobre la nariz, está sentado a una mesa con mantel blanco. Levanta con la mano derecha una copa llena de clavos y trozos de vidrio, lista para beber. A uno y otro lado, otros dos personajes de neumáticos, desinflados y haciendo muecas, uno de ellos marcado «Pneu X», parecen estar mal. En lo alto, en grandes letras rojas, se lee «Nunc est bibendum !!…», y luego «c'est-à-dire :» (es decir:). Abajo, sobre el mantel: «À votre santé, le pneu Michelin boit l'obstacle !» (¡A su salud, el neumático Michelin se bebe el obstáculo!). La firma de O'Galop está a la derecha."""
evocation = """
El cartel transforma un argumento técnico en una imagen inolvidable. La carretera de 1898 está sembrada de clavos de herradura y cascos de vidrio: el neumático Michelin, dice, los traga sin pincharse, mientras que los neumáticos de la competencia, desinflados, hacen triste figura. La fórmula latina procede de una oda de Horacio, «ahora es el momento de beber», y el muñeco de neumáticos gana con ella su nombre: Bibendum. Llegará a ser uno de los personajes publicitarios más famosos del mundo. El cartel muestra también que el automóvil crea a su alrededor todo un comercio, neumáticos, carburante, guías y mapas de carreteras, del que la publicidad se apodera enseguida."""
histoire = """
Los hermanos André y Édouard Michelin se hacen en 1889 con una empresa de caucho de Clermont-Ferrand. Ponen a punto un neumático de bicicleta desmontable, y luego inscriben en 1895 en la carrera París–Burdeos–París un coche montado sobre neumáticos, el Éclair. Según la tradición de la empresa, la visión de una pila de neumáticos en la exposición de Lyon de 1894 habría dado a Édouard la idea de un personaje. En 1898, el dibujante O'Galop retoma para Michelin un proyecto de cartel rechazado por una cervecería, en el que un bebedor levanta su jarra: Bibendum ha nacido. Esta reproducción se digitalizó a partir de un calendario."""
facture = """
O'Galop, dibujante de humor, construye el cartel como un dibujo de prensa: contornos nítidos, planos de color, personajes expresivos. Bibendum está hecho de neumáticos de bicicleta apilados, blancos como era entonces el caucho, antes de que se le añadiera negro de carbón. El rojo de las letras y el azul verdoso del fondo resaltan vivamente, como quiere el cartel de calle, hecho para leerse de lejos. El texto, que mezcla latín y francés, está integrado en la imagen: se lee de arriba abajo, como un chiste con su remate, «el neumático Michelin se bebe el obstáculo»."""
details = [
  "La copa de clavos y cascos de vidrio levantada por Bibendum.",
  "El lorgnon posado sobre la nariz del muñeco de neumáticos.",
  "El competidor desinflado marcado «Pneu X».",
  "Las grandes letras rojas de la fórmula latina.",
  "La firma de O'Galop, a la derecha, sobre el texto.",
]
themes = ["cartel", "publicidad", "neumático", "humor", "Belle Époque"]
anecdote = """
Bibendum es blanco porque los neumáticos lo eran: hubo que esperar a la década de 1910 para que se añadiera al caucho el negro de carbón que lo hace más resistente, y que dio a los neumáticos su color actual."""
