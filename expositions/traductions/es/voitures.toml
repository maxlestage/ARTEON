[[oeuvres]]
titre = "Fardier de vapor"
artiste = "Nicolas-Joseph Cugnot"
annee = "1770"
image = "fardier-cugnot.jpg"
licence = "CC0"
credit = "Photo : Joe deSousa"
source = "https://commons.wikimedia.org/wiki/File:Joseph_Cugnot%27s_1770_Fardier_%C3%A0_Vapeur,_Mus%C3%A9e_des_arts_et_m%C3%A9tiers,_Paris_2015.jpg"
technique = "Madera de roble, hierro forjado, caldera y cilindros de cobre y bronce; longitud aproximada 7,25 m"
collection = "Musée des Arts et Métiers, París"
note = "El vehículo automóvil más antiguo conservado en el mundo: un pesado carro de artillería movido por vapor, construido para el ejército de Luis XV."
description = """
Un largo chasis de vigas de roble descansa sobre tres ruedas de madera con llanta de hierro: dos grandes ruedas detrás, a la izquierda en la fotografía, y una sola rueda delante, a la derecha. Sobre esta rueda delantera se suspende una enorme caldera de cobre, redonda como una marmita, coronada por dos cilindros verticales y un tubo curvado. Bielas y trinquetes de hierro transmiten el movimiento de los pistones a la rueda delantera. En medio del chasis, un pequeño asiento de madera para el conductor se enfrenta a una barra de dirección; debajo cuelga un cesto de mimbre. El fardier se expone sobre una tarima, rodeado de una barandilla, ante tres altas ventanas de arco de la antigua iglesia del museo."""
evocation = """
El fardier no tiene nada de coche de paseo: es un ingenio de guerra. Tras la guerra de los Siete Años, el ejército francés busca desplazar más deprisa sus pesados cañones, arrastrados hasta entonces por tiros de caballos. Cugnot imagina sustituir los caballos por la fuerza del vapor, que entonces solo se empleaba en máquinas fijas, para bombear el agua de las minas. Su carro es el primer vehículo que se desplaza por su propia fuerza sobre un camino. Lento, pesado, difícil de dirigir, nunca llegó a servir, pero marca el comienzo de una larga historia: la de la máquina que avanza sola, que más tarde se llamará automóvil."""
histoire = """
Ingeniero militar lorenés, Nicolas-Joseph Cugnot presenta en 1769 un primer modelo reducido de su vehículo. Apoyado por el ministro Choiseul y por el general Gribeauval, inspector de la artillería, consigue que se construya en el Arsenal de París un fardier a tamaño real, terminado en 1770 y probado al año siguiente. La máquina avanza a unos pocos kilómetros por hora y debe detenerse a menudo para recuperar vapor. La caída en desgracia de Choiseul, a finales de 1770, pone fin al proyecto. El fardier permanece guardado en el Arsenal; ingresa en 1800 en el Conservatorio de Artes y Oficios, fundado unos años antes, donde sigue expuesto."""
facture = """
El fardier asocia el saber hacer del carretero y el del calderero. El chasis, las ruedas de radios y el asiento están hechos como los de los carros de artillería de la época, de roble ensamblado y reforzado con herrajes. La caldera de cobre, calentada por un hogar situado debajo, envía el vapor a dos cilindros de bronce cuyos pistones trabajan alternativamente. Un sistema de trinquetes transforma su vaivén en rotación de la rueda delantera, que es a la vez motriz y directriz. Todo el peso de la caldera, soportado en voladizo ante la rueda, hacía la dirección muy dura."""
details = [
  "La caldera de cobre, redonda como una marmita, suspendida en la parte delantera.",
  "Los dos cilindros verticales que dominan la rueda delantera.",
  "Los trinquetes de hierro que hacen girar la rueda motriz.",
  "El pequeño asiento del conductor, en medio del largo chasis.",
  "El cesto de mimbre colgado bajo el chasis.",
]
themes = ["vapor", "artillería", "invento", "Ilustración", "pioneros"]
anecdote = """
Según una leyenda, el fardier derribó un muro durante una prueba, lo que lo convertiría en el primer accidente de tráfico. Ningún documento de la época lo confirma, pero la historia se cuenta desde el siglo XIX."""
salle = 1
mur = "nord"
position = 0
largeur = 8.4

[[oeuvres]]
titre = "Benz Patent-Motorwagen n.º 1"
artiste = "Carl Benz"
annee = "1886"
image = "benz-patent-motorwagen.jpg"
credit = "Photo : Deutsches Museum, Munich"
licence = "CC BY-SA 4.0"
source = "https://commons.wikimedia.org/wiki/File:View_of_Left_Side_of_Benz_Patent_Motorwagen_in_Deutsches_Museum.jpg"
technique = "Tubos de acero, madera, cuero, latón y cobre; motor monocilíndrico de cuatro tiempos de 954 cm³, menos de un caballo; tres ruedas de radios metálicos"
collection = "Deutsches Museum, Múnich"
note = "El triciclo patentado por Carl Benz en enero de 1886: el primer automóvil concebido desde el principio en torno a un motor de gasolina."
description = """
El triciclo se ve de perfil, sobre un fondo blanco. En la parte delantera, a la izquierda, una pequeña rueda de finos radios de acero está sujeta por una horquilla, como la de una bicicleta. Una larga columna vertical lleva en su extremo superior la manivela de dirección. En el centro, un suelo de listones de madera negra conduce a un banco de cuero acolchado, de dos plazas, con respaldo redondeado. Detrás del banco, entre las dos grandes ruedas traseras de radios, se ve el motor: un depósito de cobre, una esfera de latón reluciente, tubos y, tendido en horizontal, un gran volante de inercia. Una cadena transmite el movimiento a las ruedas traseras."""
evocation = """
El Motorwagen es una máquina modesta, casi frágil: una bicicleta agrandada, un asiento de calesa y un pequeño motor. Anuncia, sin embargo, un mundo nuevo. Hasta entonces se habían instalado motores en coches de caballos; Benz, en cambio, diseña un vehículo entero en torno a su motor de gasolina, con chasis, dirección y transmisión incluidos. La patente alemana que presenta el 29 de enero de 1886 se considera a menudo el acta de nacimiento del automóvil. En agosto de 1888, su esposa Bertha prueba que la máquina puede servir: con sus dos hijos, recorre más de cien kilómetros, de Mannheim a Pforzheim, al volante de una versión mejorada."""
histoire = """
Carl Benz construye su triciclo en su taller de Mannheim en 1885 y presenta la patente en enero de 1886; las primeras pruebas públicas tienen lugar en las calles de la ciudad durante el verano. Los transeúntes se burlan de ese carro sin caballo que petardea. Benz mejora después su modelo y comienza a venderlo, en particular en Francia, gracias al agente parisino Émile Roger. Este primer ejemplar, el coche n.º 1, fue donado por su constructor al Deutsches Museum de Múnich, el gran museo alemán de ciencias y técnicas, donde se expone desde principios del siglo XX. Los numerosos ejemplares visibles en otros museos son réplicas."""
facture = """
Benz toma mucho de la bicicleta, entonces en pleno auge: bastidor de tubos de acero, ruedas de radios metálicos, cadena. El motor, de su propia concepción, es un monocilíndrico de cuatro tiempos tendido en la parte trasera; su gran volante de inercia horizontal regulariza la rotación. El combustible se evapora en un carburador de superficie, y el encendido es eléctrico, mediante una bobina y una batería. El agua de refrigeración se evapora poco a poco y hay que reponerla. Una correa, un diferencial y luego dos cadenas transmiten la fuerza a las ruedas traseras; el vehículo alcanza unos 16 km/h. La elección de tres ruedas evitaba a Benz resolver el problema de la dirección de dos ruedas delanteras."""
details = [
  "La manivela de dirección en lo alto de la larga columna.",
  "El gran volante de inercia tendido en horizontal detrás del banco.",
  "La esfera de latón y el depósito de cobre del motor.",
  "La cadena que acciona las ruedas traseras.",
  "El suelo de listones de madera negra.",
]
themes = ["motor", "patente", "invento", "Alemania", "pioneros"]
anecdote = """
Durante su viaje de 1888, Bertha Benz tiene que improvisar: compra disolvente en una farmacia de Wiesloch para repostar y desatasca un conducto de combustible con un alfiler de sombrero."""
salle = 1
mur = "sud"
position = -5
largeur = 3.2

[[oeuvres]]
titre = "Automóvil Panhard et Levassor de 1891"
artiste = "Panhard et Levassor"
annee = "1891"
image = "panhard-levassor-1891.jpg"
licence = "Domaine public"
credit = "Photo : Alf van Beem"
source = "https://commons.wikimedia.org/wiki/File:1891_Panhard_%26_Levassor,_1,75cv_12kmh_moteur_Daimler_P2C_Gavois_(inv_5103)_photo_1.JPG"
technique = "Madera, hierro, cuero y latón; motor bicilíndrico Daimler delantero, 1,75 CV; velocidad aproximada 12 km/h"
collection = "Cité de l'Automobile – Museo Nacional, colección Schlumpf, Mulhouse"
note = "Uno de los primeros coches vendidos por Panhard et Levassor, con el motor delante: la disposición de casi todos los automóviles del siglo siguiente."
description = """
El coche se ve en tres cuartos delantero. Todavía se parece a una pequeña calesa: cuatro ruedas de madera de radios, más grandes detrás, y una capota de cuero negro levantada que cobija un banco acolchado. Pero en la parte delantera, donde se esperaría un caballo, se alza un cajón de madera negra con ranuras de ventilación: contiene el motor. En su frente, un gran monograma de latón entrelaza las letras P y L. Un farol redondo, unos engrasadores de latón y una manivela de arranque sobresalen de la carrocería. Bajo el chasis se adivinan las cadenas de transmisión. A la derecha, en segundo plano, aparece otro coche antiguo del museo."""
evocation = """
Este coche es un momento de inflexión. Sus formas son las de un coche de caballos, pero su organización es ya la del automóvil moderno: el motor delante, luego el embrague, la caja de cambios y la transmisión hacia las ruedas traseras. Este esquema, que se llamará «sistema Panhard», se impondrá durante décadas. Muestra también el lugar de Francia en los comienzos del automóvil: el motor es alemán, inventado por Gottlieb Daimler, pero son constructores parisinos quienes obtienen de él los primeros coches vendidos en serie, antes de que las carreras y los salones hagan de París la capital de la nueva industria."""
histoire = """
René Panhard y Émile Levassor fabrican en París máquinas para trabajar la madera. A finales de la década de 1880 obtienen el derecho de construir en Francia los motores de Gottlieb Daimler, por mediación de la viuda de Édouard Sarazin, que se convierte en la esposa de Levassor. Tras unos ensayos con un motor situado en el centro, Levassor decide en 1891 colocarlo delante. Los primeros coches se venden ese mismo año a clientes particulares. El museo de Mulhouse presenta este como el coche del abate Gavois, un sacerdote que fue uno de los primeros compradores de la marca. Pertenece hoy a la colección nacional de la Cité de l'Automobile."""
facture = """
La carrocería y las ruedas son obra de un carrocero, como en un coche de tiro: madera pintada, herrajes, cuero de la capota y del banco. La novedad es mecánica. El motor bicilíndrico en V, construido bajo licencia Daimler, está encerrado en un cajón de madera delante; gira a unos cientos de revoluciones por minuto y desarrolla menos de dos caballos. Un embrague de fricción y una caja de cambios de engranajes permiten arrancar y cambiar de marcha, y luego unas cadenas accionan las ruedas traseras. Las ruedas llevan llanta de hierro: los neumáticos no llegarán hasta después de 1895."""
details = [
  "El monograma de latón PL en el cajón del motor.",
  "La capota de cuero levantada sobre el banco acolchado.",
  "Las ranuras de ventilación del cajón de madera.",
  "El farol redondo fijado en el costado del motor.",
  "Las ruedas de madera con llanta de hierro, más grandes detrás.",
]
themes = ["motor", "París", "invento", "coche de tiro", "pioneros"]
anecdote = """
En 1895, Émile Levassor llega el primero en la carrera París–Burdeos–París, tras casi 49 horas de camino, sin apenas soltar el volante. Un monumento le rinde homenaje en la porte Maillot, en París."""
salle = 1
mur = "sud"
position = 5
largeur = 2.2

[[oeuvres]]
titre = "De Dion-Bouton vis-à-vis"
artiste = "De Dion-Bouton"
annee = "1900"
image = "de-dion-bouton-vis-a-vis.jpg"
licence = "CC0"
credit = "Photo : Alf van Beem"
source = "https://commons.wikimedia.org/wiki/File:1900_De_Dion-bouton3.5-HP_Vis-%C3%A0-Vis.JPG"
technique = "Acero, madera, cuero y latón; motor monocilíndrico De Dion-Bouton de 3,5 CV situado en la parte trasera"
collection = "Louwman Museum, La Haya"
note = "El pequeño coche que populariza el automóvil en Europa hacia 1900: dos pasajeros sentados frente al conductor, de ahí su nombre."
description = """
El pequeño coche se ve en tres cuartos delantero, sobre un zócalo blanco, ante un muro azul oscuro. Tiene dos bancos de cuero negro enfrentados: el más alto, al fondo, es el del conductor; el otro, delante, acoge a dos pasajeros sentados de espaldas a la marcha. Entre ellos, una columna de dirección está coronada por un pequeño volante y unas palancas de latón. La carrocería es negra, filetada de rojo oscuro, y la parte delantera está guarnecida con una placa de latón. Dos grandes faroles de latón pulido brillan en el lateral. Las cuatro ruedas tienen radios metálicos color crema y neumáticos. A la izquierda aparece otro coche antiguo."""
evocation = """
Con sus pasajeros sentados frente al conductor, como en un coche de caballos, el vis-à-vis es un coche sociable: se conversa en él tanto como se viaja. Encarna la Belle Époque del automóvil, ese momento en que el coche, aún reservado a los ricos, se convierte en un ocio de moda, con sus abrigos de piel, sus gafas y sus velos contra el polvo. El conde de Dion, su constructor, es su figura mundana: fundador del Automobile Club de Francia, organizador de carreras, hace de la velocidad un espectáculo. Sus pequeños motores ligeros, vendidos a numerosos constructores, equipan entonces miles de coches y triciclos en Europa."""
histoire = """
El conde Albert de Dion, el mecánico Georges Bouton y su cuñado Charles Trépardoux fundan su empresa en París en 1883; construyen primero vehículos de vapor. En 1894, un tractor de vapor De Dion llega el primero en el concurso París–Rouen, considerado a menudo la primera competición automovilística. La empresa se vuelve después hacia el motor de gasolina: su pequeño monocilíndrico, que gira mucho más deprisa que los motores de la época, equipa primero triciclos y luego utilitarios como este vis-à-vis. Hacia 1900, De Dion-Bouton es uno de los mayores constructores del mundo. Este ejemplar se conserva en el Louwman Museum, el museo del automóvil de La Haya."""
facture = """
El secreto del coche es su motor: un monocilíndrico ligero, refrigerado por agua, que gira a cerca de 1 500 revoluciones por minuto, casi el doble que sus competidores, y proporciona así más potencia con un peso reducido. Está colocado detrás, bajo el banco del conductor. La transmisión utiliza el puente De Dion, una ingeniosa suspensión trasera inventada por el taller, empleada todavía mucho más tarde en coches de carreras. La carrocería, de madera y chapa pintada, está acabada con esmero, filetes de color, guarniciones de cuero y accesorios de latón que había que sacar brillo tras cada salida."""
details = [
  "Los dos bancos de cuero enfrentados.",
  "Las palancas de latón en lo alto de la columna de dirección.",
  "Los dos grandes faroles de latón pulido.",
  "Las ruedas de radios color crema y sus neumáticos.",
  "Los filetes rojo oscuro sobre la carrocería negra.",
]
themes = ["Belle Époque", "utilitario", "carrera", "París", "latón"]
anecdote = """
El conde de Dion financió en 1900 la creación del periódico deportivo L'Auto, que organizó tres años después el primer Tour de Francia ciclista."""
salle = 2
mur = "sud"
position = -4
largeur = 3.0

[[oeuvres]]
titre = "El Rolls-Royce Silver Ghost, con Claude Johnson al volante"
artiste = "Rolls-Royce"
annee = "1907"
image = "rolls-royce-silver-ghost.jpg"
licence = "Domaine public"
cadre = "noir"
source = "https://commons.wikimedia.org/wiki/File:Rolls_Royce_Silver_Ghost_1907.jpg"
technique = "Fotografía anónima publicada en 1908 en «The Motor Car: A History and Souvenir» de W. Eden Hooper; el coche: chasis 40/50 HP, motor de seis cilindros de 7 litros, carrocería pintada color aluminio"
collection = "Fotografía publicada en 1908; el coche AX 201 se conserva todavía en Inglaterra"
note = "El coche que dio fama a Rolls-Royce, fotografiado el año de su construcción: el Silver Ghost, el «fantasma de plata»."
description = """
Una fotografía en blanco y negro, en una página de libro, muestra un gran coche descubierto detenido sobre adoquines. Su carrocería clara, casi blanca, brilla como el metal. Se ven, en tres cuartos delantero, los grandes faros, el radiador alto y estrecho, los guardabarros flexibles y las ruedas de radios de madera clara. Cinco hombres con gorra y abrigo van sentados a bordo; un sexto, con un largo guardapolvo y las gafas de conducir sobre la gorra, está de pie ante la portezuela trasera. Al volante, según el pie de foto, está sentado Claude Johnson. Bajo la imagen, una leyenda en inglés dice: «El célebre automóvil Rolls-Royce de seis cilindros Silver Ghost»."""
evocation = """
La fotografía se hizo para alabar un coche excepcional, y lo consigue. Todo habla de solidez tranquila: la masa clara de la carrocería, los hombres instalados como en un salón, el chófer de pie que parece guardar el vehículo. Para Rolls-Royce, empresa joven fundada en 1906, el Silver Ghost debía probar que se podía construir un coche silencioso, suave e infatigable. El nombre elegido por Claude Johnson juega con estas dos cualidades: la plata de la carrocería y el silencio de un fantasma. Desde entonces, la marca no ha dejado de ser sinónimo de lujo, y este coche es sin duda el más famoso de su historia."""
histoire = """
Charles Rolls, aristócrata apasionado por el automóvil, y Henry Royce, ingeniero de Mánchester, se asocian en 1904. En 1906 presentan el chasis 40/50 HP de seis cilindros. El duodécimo ejemplar, matriculado AX 201, está pintado color aluminio y guarnecido de accesorios plateados; Claude Johnson, director comercial de la firma, lo bautiza Silver Ghost. En 1907, el coche recorre unas 15 000 millas, más de 24 000 kilómetros, entre Londres y Glasgow y por las carreteras de Escocia, bajo el control del Automobile Club, con muy pocas averías. Vendido, fue recomprado por Rolls-Royce en 1948. Esta fotografía se publicó ya en 1908 en un libro dedicado al automóvil."""
facture = """
La fotografía, hecha a plena luz del día, juega con el contraste entre la carrocería clara y las ropas oscuras de los pasajeros; el fotógrafo se ha situado en tres cuartos delantero para mostrar a la vez la longitud del coche y su radiador, convertido en emblema de la marca. Reproducida mediante fotograbado de trama, técnica que permitía imprimir las fotografías en los libros, conserva sobre la página un ligero grano. El propio coche es una pieza de mecánica cuidada: motor de seis cilindros de unos 7 litros, famoso por su silencio, chasis robusto y carrocería descubierta de tipo turismo, hecha a mano."""
details = [
  "La carrocería clara, pintada color aluminio.",
  "El alto radiador estrecho, flanqueado por dos grandes faros.",
  "El pasajero de pie con guardapolvo, las gafas sobre la gorra.",
  "Las ruedas de radios de madera clara.",
  "Los adoquines de la calle bajo las ruedas.",
]
themes = ["lujo", "Belle Époque", "Inglaterra", "fotografía", "resistencia"]
anecdote = """
