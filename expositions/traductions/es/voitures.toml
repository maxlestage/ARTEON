[[oeuvres]]
titre = "El automovilista"
artiste = "Henri de Toulouse-Lautrec"
annee = "1896–1898"
image = "lautrec-automobiliste.jpg"
licence = "CC0"
cadre = "estampe"
source = "https://commons.wikimedia.org/wiki/File:Henri_de_Toulouse-Lautrec,_The_Motorist_(L%27automobiliste),_1896,_NGA_33915.jpg"
technique = "Litografía en negro sobre papel"
collection = "National Gallery of Art, Washington (Rosenwald Collection, 1947.7.157)"
note = "Un conductor envuelto en pieles se lanza por la carretera, en una nube de polvo: Lautrec capta en unos pocos trazos la nueva figura del automovilista."
description = """
En primer plano, a la izquierda, un hombre corpulento está sentado al volante de un coche del que solo se ve la parte delantera, en la parte inferior de la imagen, y el volante de radios. Va envuelto en un enorme abrigo de piel, de pelo dibujado con rayados nerviosos; una gorra plana y unas gafas redondas enmarcan su rostro bigotudo. Su mano derecha enguantada aprieta una palanca. Detrás de él, una gran nube de polvo o de humo se eleva hacia el cielo. A la derecha, apenas esbozada a trazo, una mujer elegante con vestido largo se aleja por el borde del camino, seguida de un perrito. En el margen, abajo, una inscripción manuscrita a lápiz."""
evocation = """
Lautrec, pintor de cabarés y circos, se interesa por todas las novedades de la vida moderna: la bicicleta, el teatro y ahora el automóvil. Muestra en él menos la máquina que el hombre al que transforma. Su conductor, casi caricaturesco, ya no es más que una masa de piel, gafas y determinación, lanzada en un torbellino de polvo. El contraste con la paseante y su perrito, ligeros, dibujados con un trazo fino, está lleno de ironía: el viejo mundo, el del paseo ocioso, ve pasar el nuevo. Tradicionalmente se reconoce en el conductor al primo del artista, el doctor Gabriel Tapié de Céleyran."""
histoire = """
Henri de Toulouse-Lautrec practica intensamente la litografía a partir de 1891, para carteles, portadas de partituras y estampas vendidas a los aficionados. El automovilista data de finales de la década de 1890, cuando los primeros coches empiezan a circular por las carreteras de Francia; la National Gallery of Art lo fecha en 1896, otros catálogos en 1898. La lámina, editada en pequeño número, figura en el catálogo de la obra grabada de Lautrec elaborado por Loys Delteil. Esta prueba forma parte de la inmensa colección de estampas del coleccionista estadounidense Lessing J. Rosenwald, donada a la National Gallery of Art de Washington, e ingresó en el museo en 1947."""
facture = """
La litografía permite a Lautrec dibujar directamente sobre la piedra, con lápiz graso, con la misma libertad que sobre una hoja de papel. Opone aquí dos maneras: rayados densos y vigorosos, casi negros, para el abrigo de piel y el polvo, y un trazo fino, apenas apoyado, para la paseante y el paisaje. Los blancos del papel se convierten en la carretera y el cielo. El encuadre, cortado en seco sobre el volante y el borde del coche, procede de las estampas japonesas y de la fotografía, que Lautrec admiraba: da al espectador la impresión de estar sentado junto al conductor."""
details = [
  "Las gafas redondas y la gorra plana del conductor.",
  "Los rayados nerviosos del abrigo de piel.",
  "El volante de radios, cortado por el borde de la imagen.",
  "La paseante esbozada a trazo y su perrito.",
  "El monograma del artista dentro de un círculo, abajo a la izquierda.",
]
themes = ["estampa", "vida moderna", "velocidad", "caricatura", "Belle Époque"]
anecdote = """
A Lautrec le gustaba también el ciclismo: en 1896 dibuja para las bicicletas Simpson el cartel «La Chaîne Simpson», para el que posa el corredor Constant Huret."""
