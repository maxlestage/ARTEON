[[oeuvres]]
titre = "Hispano-Suiza H6C «Tulipwood» Torpedo"
artiste = "Hispano-Suiza"
annee = "1924"
image = "hispano-suiza-tulipwood.jpg"
credit = "Photo : Prova MO"
licence = "CC BY-SA 4.0"
source = "https://commons.wikimedia.org/wiki/File:1924_Hispano_Suiza_H6C_Tulipwood_Torpedo_front.jpg"
technique = "Chasis H6C, motor de seis cilindros en línea de 8 litros; carrocería Nieuport-Astra de listones de madera remachados sobre una armadura ligera"
collection = "Colección particular"
note = "El coche de carreras y de prestigio del piloto André Dubonnet, de carrocería de madera remachada como el casco de un avión."
description = """
El coche se ve en tres cuartos delantero, sobre una tarima negra. Toda su carrocería es de madera barnizada, de un marrón dorado, hecha de estrechos listones fijados con miles de pequeños remaches de cobre. Los guardabarros redondeados, los capós y la popa afilada son también de madera. En la parte delantera, un radiador cromado lleva el nombre Hispano en escritura inclinada, entre dos faros protegidos por una rejilla. Las ruedas tienen radios metálicos cobrizos, y una rueda de repuesto va fijada en el flanco, tras el capó perforado por aberturas de ventilación. Un grueso tubo anillado sale del capó. Detrás del coche, una gran pantalla muestra imágenes de interiores de automóviles."""
evocation = """
El Tulipwood resume el lujo deportivo de los años locos. Su propietario, André Dubonnet, heredero de la célebre marca de aperitivos, fue un as de la aviación durante la Gran Guerra y piloto de carreras. Pide al constructor de aviones Nieuport-Astra una carrocería tan ligera como un ala: la madera, material de los aviones de la época, se convierte aquí en signo de elegancia. El coche asocia así la velocidad, la aviación y el gusto por los materiales preciosos. La propia marca está ligada a la aviación: sobre sus radiadores vuela una cigüeña de plata, en recuerdo de la escuadrilla de las Cigüeñas de Georges Guynemer, cuyos aviones llevaban motores Hispano-Suiza."""
histoire = """
Fundada en Barcelona en 1904, la sociedad Hispano-Suiza debe su nombre a su ingeniero, el suizo Marc Birkigt. Durante la Primera Guerra Mundial, sus motores de avión equipan miles de cazas aliados. En 1919, la marca presenta en el Salón de París el H6, un coche de gran lujo fabricado en Francia, cuyo motor de seis cilindros deriva de esa experiencia. La versión H6C, más potente, está destinada al deporte. En 1924, André Dubonnet hace carrozar el suyo por Nieuport-Astra y lo inscribe en carreras. El coche, conservado desde entonces en colecciones privadas, ha sido expuesto en Estados Unidos, en particular en el Blackhawk Museum de California, y presentado en subasta en Monterey en 2022."""
facture = """
La carrocería está construida como un fuselaje de avión: finos listones de madera se colocan sobre una armadura ligera y se fijan con remaches de cobre, alineados en largas hileras que dibujan las formas del coche. La madera, lijada y barnizada, deja ver su veta. Bajo el capó, el motor de Birkigt es un seis cilindros en línea de aleación de aluminio, con árbol de levas en cabeza. El H6 es también uno de los primeros coches con frenos en las cuatro ruedas, asistidos por un servofreno mecánico accionado por la caja de cambios, un sistema tan eficaz que Rolls-Royce compró su licencia."""
details = [
  "Las hileras de remaches de cobre sobre los listones de madera barnizada.",
  "El nombre Hispano en escritura inclinada sobre el radiador.",
  "Las rejillas que protegen los dos faros.",
  "Las ruedas de radios cobrizos y la rueda de repuesto en el flanco.",
  "Las aberturas de ventilación en el costado del capó.",
]
themes = ["lujo", "años locos", "madera", "aviación", "carrera"]
anecdote = """
El apodo del coche, «Tulipwood», designa una madera preciosa; algunos especialistas piensan, sin embargo, que su carrocería es más bien de caoba. El apodo, en cambio, se ha quedado."""
