[[artistes]]
nom = "Nicolas-Joseph Cugnot"
vie = "Void (Lorena), 26 de febrero de 1725 – París, 2 de octubre de 1804"
biographie = """
Nacido en Lorena, Nicolas-Joseph Cugnot se hace ingeniero militar y sirve en el ejército austríaco, donde se interesa por las fortificaciones y las máquinas. De regreso en París hacia 1763, publica obras sobre el arte militar y la fortificación. Se apasiona por la fuerza del vapor, que entonces se utiliza sobre todo para bombear el agua de las minas, y propone emplearla para arrastrar los cañones. Con el apoyo del duque de Choiseul, ministro de la Guerra, y del general Gribeauval, construye en 1769 un primer modelo y en 1770 el gran fardier del Conservatorio de Artes y Oficios. El proyecto se abandona tras la caída en desgracia de Choiseul. Cugnot recibe una pensión del rey, perdida bajo la Revolución y restablecida por Bonaparte poco antes de su muerte."""

[[artistes]]
nom = "Carl Benz"
vie = "Mühlburg (Karlsruhe), 25 de noviembre de 1844 – Ladenburg, 4 de abril de 1929"
biographie = """
Hijo de un maquinista de locomotora muerto cuando él tenía dos años, Carl Benz estudia mecánica en la escuela politécnica de Karlsruhe. Tras varios empleos, funda en Mannheim un taller donde pone a punto motores de gas de dos tiempos, y luego un motor de gasolina de cuatro tiempos. En 1885 construye un triciclo en torno a ese motor y presenta en enero de 1886 la patente del Motorwagen. Su esposa Bertha, que ha invertido su dote en la empresa, realiza en 1888 el primer largo viaje en automóvil. Benz & Cie se convierte en la década de 1890 en uno de los primeros grandes constructores del mundo, con el Velo, un pequeño coche vendido en serie. En 1926, la empresa se fusiona con la Daimler-Motoren-Gesellschaft para formar Daimler-Benz, la casa de los automóviles Mercedes-Benz."""

[[artistes]]
nom = "Panhard et Levassor"
vie = "París, 1886 (asociación); René Panhard, 1841–1908; Émile Levassor, 1843–1897"
biographie = """
René Panhard y Émile Levassor, ambos ingenieros salidos de la École centrale, dirigen en París, en la avenue d'Ivry, una empresa de máquinas para trabajar la madera. Por medio de Édouard Sarazin, representante de Gottlieb Daimler en Francia, descubren el motor de gasolina; tras la muerte de Sarazin, su viuda Louise, que posee la licencia, se casa con Levassor en 1890. La empresa construye entonces motores Daimler y, desde 1891, coches vendidos a particulares, con el motor delante. Levassor, excelente piloto, gana la carrera París–Burdeos–París en 1895, pero muere en 1897 a consecuencia de un accidente de carrera. La sociedad Panhard et Levassor sigue siendo durante décadas uno de los grandes nombres del automóvil francés, antes de ser absorbida por Citroën en 1965."""

[[artistes]]
nom = "De Dion-Bouton"
vie = "París y Puteaux, 1883–1932; Albert de Dion, 1856–1946; Georges Bouton, 1847–1938"
biographie = """
El conde Albert de Dion, joven aristócrata adinerado y apasionado por la mecánica, se asocia en 1883 con Georges Bouton, fabricante de juguetes mecánicos, y su cuñado Charles Trépardoux. El taller construye primero coches y tractores de vapor, y después, a partir de 1895, pequeños motores de gasolina de alto régimen que equipan triciclos y utilitarios. Estos motores, vendidos a decenas de constructores en Francia y en el extranjero, hacen de la fábrica de Puteaux una de las más importantes del mundo hacia 1900. El conde de Dion funda en 1895 el Automobile Club de Francia con el barón de Zuylen y el periodista Paul Meyan, y se convierte más tarde en diputado y senador. La marca declina tras la Primera Guerra Mundial y deja de producir automóviles a principios de los años treinta."""

[[artistes]]
nom = "Rolls-Royce"
vie = "Mánchester y luego Derby (Inglaterra), fundada en 1906; Charles Rolls, 1877–1910; Henry Royce, 1863–1933"
biographie = """
Henry Royce, hijo de un molinero arruinado, aprende mecánica en los talleres del ferrocarril y funda en Mánchester una empresa de material eléctrico. Descontento con su coche francés, construye en 1904 sus propios automóviles, de una calidad notable. Charles Rolls, hijo de un lord, piloto y vendedor de coches en Londres, se compromete a vender toda su producción: Rolls-Royce Limited se funda en 1906. El director comercial Claude Johnson hace del 40/50 HP Silver Ghost el escaparate de la marca. Rolls muere en 1910 en un accidente de avión; Royce, enfermo, dirige los estudios desde su casa del sur de Inglaterra. Durante la guerra, la empresa fabrica también motores de avión, que se convierten, junto con los coches de lujo, en su gran especialidad."""

[[artistes]]
nom = "Ford Motor Company"
vie = "Detroit (Míchigan), fundada en 1903; Henry Ford, 1863–1947"
biographie = """
Henry Ford, hijo de granjeros de Míchigan, trabaja como mecánico y luego como ingeniero en la compañía de electricidad Edison de Detroit. Construye su primer coche, el Quadricycle, en 1896. Tras dos fracasos, funda en 1903 la Ford Motor Company, que lanza en 1908 el Ford T. Para producirlo a bajo precio, Ford organiza la fábrica de Highland Park en torno a la cadena de montaje móvil, puesta en servicio en 1913, y aumenta fuertemente los salarios en 1914 para retener a sus obreros. El éxito es inmenso: a finales de la década de 1910, uno de cada dos coches en Estados Unidos es un Ford T. El Ford T es sustituido en 1927 por el Ford A. Henry Ford, figura controvertida por sus posiciones políticas y su antisemitismo, dirige la empresa hasta 1945."""

[[artistes]]
nom = "Hispano-Suiza"
vie = "Barcelona, fundada en 1904, y Bois-Colombes (Francia); Marc Birkigt, 1878–1953"
biographie = """
La Hispano-Suiza, «la hispano-suiza», se funda en Barcelona en 1904 por el hombre de negocios Damián Mateu y el ingeniero suizo Marc Birkigt, nacido en Ginebra. El rey Alfonso XIII de España, gran aficionado, da su nombre a un modelo deportivo de 1911. La marca abre después una fábrica en Francia, en Levallois y luego en Bois-Colombes. Durante la Primera Guerra Mundial, el motor de avión V8 de Birkigt equipa miles de cazas aliados, entre ellos los SPAD de Georges Guynemer. Después de la guerra, la rama francesa produce coches de lujo extremo, el H6 y luego el J12 de doce cilindros, célebres por su mecánica y sus carrocerías. En los años treinta, la empresa abandona el automóvil para dedicarse a los motores de avión."""

[[artistes]]
nom = "Ettore Bugatti"
vie = "Milán, 15 de septiembre de 1881 – París, 21 de agosto de 1947"
biographie = """
Hijo de Carlo Bugatti, creador de muebles y objetos de arte milanés, y hermano del escultor animalista Rembrandt Bugatti, Ettore Bugatti crece en un ambiente de artistas. Dibuja muy joven triciclos y coches para varios constructores, y funda en 1909 su propia marca en Molsheim, en Alsacia, entonces alemana. Sus coches, ligeros, potentes y de acabado perfecto, ganan centenares de carreras, como el Type 35, uno de los coches de carreras más victoriosos de la historia. Concibe también coches de gran lujo, entre ellos el Royale, automotores y motores de avión. Su hijo Jean dibuja en los años treinta las más bellas carrocerías de la marca, antes de matarse probando un coche en 1939."""

[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi, 24 de noviembre de 1864 – castillo de Malromé (Gironda), 9 de septiembre de 1901"
biographie = """
Procedente de una antigua familia aristocrática del Mediodía, Henri de Toulouse-Lautrec se fractura las dos piernas en la adolescencia; dejan de crecer. Se consagra entonces al dibujo y a la pintura, estudia en París en los talleres de Bonnat y de Cormon, y se instala en Montmartre. Se convierte en el pintor de los cabarés, los bailes, los circos y las casas de citas, y se relaciona con los artistas de la escena, Aristide Bruant, Jane Avril o Yvette Guilbert. A partir de 1891, con el cartel del Moulin Rouge, renueva el arte del cartel y de la litografía en color, influido por las estampas japonesas. Agotado por el alcohol, muere a los 36 años, dejando más de 700 cuadros, miles de dibujos y unas 350 estampas y carteles."""

[[artistes]]
nom = "O'Galop (Marius Rossillon)"
vie = "Lyon, 1867 – Carnac, 1946"
biographie = """
Marius Rossillon, que firma O'Galop, es un dibujante humorístico e ilustrador francés. Colabora con numerosos periódicos satíricos e ilustrados de finales del siglo XIX y principios del XX, y dibuja libros infantiles, postales y carteles. En 1898 crea para los hermanos Michelin el personaje de Bibendum, el hombre hecho de neumáticos, que seguirá asociado a la marca y a sus guías. Continúa dibujándolo durante años para los anuncios de Michelin. Curioso por las técnicas nuevas, realiza también en las décadas de 1910 y 1920 películas de animación, en particular dibujos animados educativos y de prevención sanitaria, lo que lo convierte en uno de los pioneros franceses del cine de animación."""
