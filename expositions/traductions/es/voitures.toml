[[oeuvres]]
titre = "Ford T Touring"
artiste = "Ford Motor Company"
annee = "1913"
image = "ford-t-1913.jpg"
credit = "Photo : Mariordo (Mario Roberto Duran Ortiz)"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:1913_Ford_Model_T_Touring_01_2012_DC_00476.JPG"
technique = "Acero al vanadio, madera, cuero y latón; motor de cuatro cilindros de 2,9 litros, 20 CV; caja epicicloidal de dos velocidades"
collection = "National Museum of American History, Smithsonian Institution, Washington"
note = "El coche que puso a América en la carretera: producido en más de quince millones de ejemplares entre 1908 y 1927."
description = """
El Ford T se ve en tres cuartos delantero, sobre una tarima cubierta de moqueta, ante un fondo azul. Es un coche de turismo de cinco plazas, alto sobre sus ruedas: una capota de lona beige tendida sobre unos arcos cobija dos bancos de cuero negro acolchado. La carrocería es negra y brillante; una tabla de madera barnizada separa el capó del puesto de conducción. En la parte delantera, el radiador de latón lleva el nombre Ford en letras cursivas, entre dos grandes faros de latón. Las ruedas son de madera pintada de negro, de doce radios, con neumáticos claros. Un parabrisas vertical se alza ante el volante."""
evocation = """
Henry Ford quería construir «un coche para la multitud», lo bastante sólido para los malos caminos del campo estadounidense y lo bastante barato para que un obrero pudiera comprarlo. El Ford T cumplió esa promesa. Sencillo de conducir y de reparar, transforma la vida de los granjeros, de los médicos rurales, de las familias que descubren las vacaciones en la carretera. Cambia también el trabajo: para producirlo, Ford inventa la cadena de montaje móvil, que se convierte en el modelo de toda la industria del siglo XX. Apodado «Tin Lizzie», sigue siendo el símbolo de la entrada del automóvil en la vida cotidiana."""
histoire = """
El Ford T se presenta en octubre de 1908 y se fabrica en Detroit, y luego en la fábrica de Highland Park. En 1913, Ford pone allí en servicio la cadena de montaje móvil: el tiempo de ensamblaje de un chasis pasa de más de doce horas a aproximadamente hora y media, y el precio del coche baja año tras año. En 1914, Ford duplica el salario de sus obreros, hasta cinco dólares al día. Cuando la producción se detiene en 1927, se han construido más de quince millones de Ford T. Este ejemplar de 1913 se expone en el National Museum of American History, en Washington; según el museo, recibió, a petición de su propietario, un arranque y unos faros eléctricos."""
facture = """
El Ford T está concebido para producirse en masa y para que cualquiera pueda repararlo. Su motor de cuatro cilindros, fundido en un solo bloque con una culata desmontable, es sencillo y robusto. Ford emplea acero al vanadio, más ligero y resistente que el acero ordinario. La caja de cambios epicicloidal se maneja con el pie, mediante tres pedales, lo que exige un aprendizaje particular. El coche es alto sobre sus ruedas para salvar las rodadas, y su suspensión de ballestas transversales le permite seguir los caminos deformados. Las piezas son intercambiables: se compraban por catálogo y se montaban uno mismo."""
details = [
  "El nombre Ford en letras cursivas sobre el radiador de latón.",
  "Los dos grandes faros de latón a ambos lados del radiador.",
  "La capota de lona beige tendida sobre sus arcos.",
  "La tabla de madera barnizada entre el capó y el puesto de conducción.",
  "Las ruedas de madera de doce radios.",
]
themes = ["producción en serie", "América", "fábrica", "cadena de montaje", "democratización"]
anecdote = """
Henry Ford habría dicho que el cliente podía elegir cualquier color, siempre que fuera el negro: de 1914 a 1925, el Ford T solo se entrega en negro, una pintura que se secaba más deprisa que las demás."""
