[[oeuvres]]
titre = "Vista de Delft"
artiste = "Johannes Vermeer"
annee = "hacia 1660–1661"
image = "vue-delft.jpg"
technique = "Óleo sobre lienzo, 96,5 × 115,7 cm"
collection = "Mauritshuis, La Haya"
note = "Su ciudad, vista desde la otra orilla, bajo un gran cielo: Proust la tenía por el cuadro más bello del mundo."
description = """
Al otro lado de una amplia extensión de agua, la ciudad de Delft se extiende en una larga \
franja horizontal: murallas de ladrillo, tejados rojos y azulados, y dos puertas \
fortificadas, la de Schiedam, a la izquierda, con su reloj, y la de Rotterdam, a la \
derecha, flanqueada por dos torrecillas. Detrás, la torre de la Iglesia Nueva brilla al \
sol, mientras que los edificios del primer plano quedan a la sombra de una nube. Unos \
barcos, entre ellos dos grandes barcas de pesca, están amarrados a la derecha. En la orilla \
arenosa del primer plano, a la izquierda, unos pequeños personajes conversan. \
Encima, el cielo ocupa más de la mitad del lienzo, con grandes nubes blancas \
y grises que se escalonan."""
evocation = """
Vermeer no inventa nada: se reconoce cada monumento, y el cuadro sirve aún de \
documento sobre la Delft del siglo XVII. Ha recompuesto, sin embargo, ligeramente la vista para \
equilibrar las masas, y no es tanto la topografía como la luz lo que constituye el \
tema: una mañana tranquila, bajo un cielo cambiante, en que el sol viene a herir el corazón de \
la ciudad. Algunos han visto en la torre soleada de la Iglesia Nueva, donde reposa \
Guillermo de Orange, un discreto homenaje a la casa de Orange y al orgullo cívico. \
Unos años antes, en 1654, la explosión de un polvorín había devastado una \
parte de Delft; la serenidad de esta vista se ha leído como el retrato de una ciudad \
apaciguada, segura de sí misma."""
histoire = """
Vermeer pinta su ciudad natal hacia 1660-1661 desde la orilla sur del puerto, probablemente \
desde una ventana del piso superior de una casa. El cuadro perteneció sin duda a Pieter van \
Ruijven; figura en 1696 en la venta Dissius, en Ámsterdam, donde alcanza 200 \
florines, el precio más alto de los Vermeer de la venta. En 1822, el rey Guillermo I \
lo adquirió en subasta para el Mauritshuis, que acababa de abrir sus puertas en La Haya. \
En 1921, fue prestado a París para una exposición de pintura neerlandesa en el Jeu de \
Paume: Proust, enfermo, acudió para volver a verlo, año y medio antes de su muerte. El \
cuadro apenas ha salido de La Haya desde entonces."""
facture = """
Vermeer trabaja la materia tanto como el color: los ladrillos y los tejados están \
logrados con una pasta granulosa, y minúsculos granos de pintura clara, aplicados en \
relieve sobre los cascos de los barcos y las fachadas, atrapan la luz como \
reflejos reales. Los reflejos en el agua son alargados y simplificados. El juego de sombra y \
de luz, con los edificios cercanos en sombra y los tejados del fondo iluminados, \
crea la profundidad. Se ha discutido si utilizó una cámara oscura, \
el instrumento óptico que proyecta una imagen: la cuestión sigue debatida."""
details = [
  "Los tejados soleados a la derecha, donde se busca el «pequeño lienzo de pared amarilla».",
  "El reloj de la puerta de Schiedam, que marca poco más de las siete.",
  "La torre clara de la Iglesia Nueva, bañada de sol tras los tejados.",
  "Los pequeños personajes en la orilla arenosa, a la izquierda.",
  "Los granos de pintura en relieve sobre los cascos de las barcas, a la derecha.",
]
themes = ["ciudad", "paisaje", "cielo", "agua", "luz"]
anecdote = """
En «La prisionera», Proust hace morir al escritor Bergotte ante la Vista de \
Delft, mientras contempla un «pequeño lienzo de pared amarilla» en el que nunca había \
reparado. El novelista atribuía a su personaje el malestar que él mismo había \
sentido en la exposición de 1921."""
salle = 3
mur = "nord"
position = 0
largeur = 1.16

[[oeuvres]]
titre = "La joven de la perla"
artiste = "Johannes Vermeer"
annee = "hacia 1665"
image = "jeune-fille-perle.jpg"
technique = "Óleo sobre lienzo, 44,5 × 39 cm"
collection = "Mauritshuis, La Haya"
note = "Un turbante azul, una perla, una mirada por encima del hombro: un rostro imaginario convertido en uno de los más célebres."
description = """
Sobre un fondo oscuro y liso, una joven se vuelve hacia nosotros por encima del hombro, \
como si acabaran de llamarla. Lleva un turbante azul ultramar anudado en la cabeza, \
del que cae un paño de tela amarilla, y una chaqueta amarillo pardo de la que asoma un cuello blanco. \
De su oreja pende una gran perla, que refleja la luz y el blanco del cuello. Sus \
grandes ojos fijan al espectador; sus labios entreabiertos y húmedos brillan con \
pequeños toques claros. La luz viene de la izquierda y modela suavemente el rostro, \
sin contornos marcados. Ningún decorado, ningún objeto: solo un rostro, una mirada y \
una perla, captados en un movimiento suspendido."""
evocation = """
No es un retrato sino una «tronie», palabra que designaba entonces un estudio de \
cabeza, a menudo con disfraz, que los aficionados compraban por su belleza o su expresión, \
sin preocuparse de la identidad de la modelo. El turbante evoca el Oriente soñado de los neerlandeses \
del siglo XVII. Se ignora quién posó: se ha propuesto a la hija mayor del pintor, Maria, \
sin pruebas. Este misterio, unido a la ambigüedad de la mirada, a la vez tímida y \
directa, y a la boca entreabierta, como a punto de hablar, ha alimentado \
innumerables interpretaciones. Se la ha apodado «la Mona Lisa del Norte»: como el \
retrato de Leonardo, parece entablar con cada espectador una relación \
personal."""
histoire = """
Vermeer la pintó hacia 1665, sin duda para el mercado más que por encargo. Después \
se pierde su rastro: se pensó reconocerla entre las «tronies» de la venta \
Dissius de 1696, sin certeza. En 1881, en mal estado, fue comprada en una \
subasta en La Haya por el coleccionista Arnoldus Andries des Tombe, por \
dos florines y treinta centavos. A su muerte en 1902, la legó al Mauritshuis junto con \
otros cuadros. Es desde entonces la estrella del museo. La novela de Tracy Chevalier \
(1999) y la película que se hizo de ella en 2003, con Scarlett Johansson, le han dado una \
fama mundial."""
facture = """
Vermeer reduce su paleta a unos pocos colores: el ultramar natural del turbante, \
amarillos, ocres, blanco de plomo. Las transiciones son muy suaves, casi sin \
contornos, en particular en el caballete de la nariz, que se funde con la mejilla. La perla misma \
es una ilusión: unos pocos toques, un reflejo vivo arriba y un resplandor pálido \
abajo, sin siquiera el gancho que la sujetaría a la oreja. Un estudio científico \
realizado por el Mauritshuis en 2018 reveló que el fondo, hoy negro, representaba en \
origen una cortina verde, y que la joven tenía pestañas, hoy invisibles a \
simple vista."""
details = [
  "El reflejo del cuello blanco en la parte baja de la perla.",
  "Los pequeños toques de luz en la comisura de los labios.",
  "El caballete de la nariz, sin contorno alguno, que se funde con la mejilla.",
  "El paño amarillo del turbante, que cae tras la cabeza.",
  "El minúsculo reflejo de luz en cada uno de los ojos.",
]
themes = ["retrato", "mirada", "oriente", "misterio", "tronie"]
anecdote = """
Tras una gira por Japón, Estados Unidos e Italia entre 2012 y 2014, el \
Mauritshuis decidió que el cuadro no volvería a viajar. Única excepción: en 2023, \
fue prestado unas semanas a la gran exposición Vermeer del Rijksmuseum, en \
Ámsterdam."""
salle = 2
mur = "est"
position = 0
largeur = 0.55

[[oeuvres]]
titre = "El arte de la pintura"
artiste = "Johannes Vermeer"
annee = "hacia 1666–1668"
image = "art-peinture.jpg"
technique = "Óleo sobre lienzo, 120 × 100 cm"
collection = "Kunsthistorisches Museum, Viena"
note = "Un pintor de espaldas pinta a la musa de la Historia: Vermeer conservó este cuadro toda su vida."
description = """
Una pesada cortina de tapiz, recogida a la izquierda, descubre un taller. Un pintor visto de \
espaldas, con jubón negro acuchillado, calzas rojas y boina, está sentado ante su \
caballete; empieza a pintar la corona de laurel de su modelo. Esta, \
de pie junto a la ventana, es una joven vestida de azul, coronada de laurel, \
que sostiene una trompeta y un grueso libro amarillo, con los ojos bajos. Sobre la mesa, una \
máscara de yeso, un libro abierto, telas. En la pared se extiende un gran mapa de las \
Diecisiete Provincias de los Países Bajos, y una lámpara de cobre dorado, sin velas, cuelga del \
techo de vigas. En el suelo, un pavimento de mármol blanco y negro."""
evocation = """
La modelo encarna a Clío, la musa de la Historia, reconocible por los atributos que le \
daba la Iconología de Cesare Ripa, manual de símbolos muy leído: el laurel de la \
gloria, la trompeta de la fama, el libro de la historia. El cuadro es así una \
alegoría: la pintura, al representar la Historia, asegura la gloria. El mapa, donde \
un pliegue separa el Norte, convertido en las Provincias Unidas, del Sur que siguió siendo español, y la \
lámpara coronada por el águila bicéfala de los Habsburgo se han leído como alusiones \
a la división de los Países Bajos. El pintor sin rostro ha hecho soñar con un autorretrato; \
nada lo prueba, pero la obra dice con seguridad la alta idea que Vermeer tenía de \
su arte."""
histoire = """
Vermeer pinta este gran cuadro hacia 1666-1668, sin encargo conocido, y lo guarda en \
su casa hasta su muerte en 1675. Abrumada por las deudas, su viuda Catharina Bolnes lo cedió a \
su madre, Maria Thins, para sustraerlo a los acreedores; el administrador de la \
sucesión, el sabio Antonie van Leeuwenhoek, impugnó la maniobra. El cuadro pasó \
después de mano en mano y, en el siglo XIX, perteneció a los condes Czernin, en Viena, \
con el nombre de Pieter de Hooch, antes de serle devuelto a Vermeer. En 1940, Hitler lo compró \
a la familia Czernin para el museo que proyectaba en Linz. Hallado en 1945 en la \
mina de sal de Altaussee, fue entregado a Austria y atribuido al Kunsthistorisches \
Museum."""
facture = """
La composición es un juego de planos sucesivos: la cortina, en primer plano, crea un \
efecto de umbral, y vienen luego la silla, el pintor, por último la modelo y el mapa, \
iluminados por una ventana invisible a la izquierda. El pavimento en perspectiva conduce la mirada \
hacia el fondo. Vermeer clavaba un alfiler en el punto de fuga y le ataba un hilo \
para trazar las líneas de perspectiva: se ha hallado su huella en varios de \
sus cuadros. Cada materia recibe un tratamiento propio: los reflejos de la lámpara, el \
grano del tapiz, los pliegues y las inscripciones del mapa, el azul ultramar del \
vestido."""
details = [
  "La firma del pintor, discreta, en el borde inferior del mapa, cerca de la modelo.",
  "Los acuchillados del jubón, que dejan ver la camisa blanca.",
  "La máscara de yeso colocada sobre la mesa, vuelta hacia el techo.",
  "El águila bicéfala en lo alto de la lámpara.",
  "Las primeras hojas de laurel esbozadas en el lienzo del caballete.",
]
themes = ["taller", "alegoría", "historia", "pintura", "mapa"]
anecdote = """
En 2011, Austria se negó a devolver el cuadro a los herederos de la familia Czernin, \
que sostenían que la venta de 1940 a Hitler había sido forzada: la comisión encargada \
de las restituciones estimó que no se había concluido bajo coacción."""
salle = 2
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "El astrónomo"
artiste = "Johannes Vermeer"
annee = "1668"
image = "astronome.jpg"
technique = "Óleo sobre lienzo, 51 × 45 cm"
collection = "Museo del Louvre, París"
note = "Un sabio tiende la mano hacia un globo celeste, en la luz de la ventana."
description = """
En un gabinete de trabajo iluminado por una ventana a la izquierda, un hombre de largos \
cabellos, vestido con una amplia bata azul verdosa, está sentado e inclinado hacia un \
globo celeste colocado sobre la mesa. Con la mano derecha, roza su superficie, como \
para hacer girar el cielo; la otra mano se apoya en el borde de la mesa, junto a un \
libro abierto. Un grueso tapete de motivos coloreados cubre la mesa, donde se advierte un \
astrolabio. Tras él, un armario sostiene algunos libros; en la pared cuelga un \
cuadro que representa a Moisés salvado de las aguas. Las vidrieras de la ventana dejan pasar \
una luz suave que cae sobre el rostro, la mano y el globo."""
evocation = """
El cuadro celebra al sabio moderno, en la hora en que las Provincias Unidas son un gran \
foco de las ciencias: astronomía, cartografía, óptica. El libro abierto sobre la mesa ha \
sido identificado como un tratado de Adriaan Metius, abierto por el pasaje que recomienda \
buscar en Dios la inspiración para estudiar los astros. El Moisés salvado de las \
aguas, en la pared, se ha interpretado en el mismo sentido: Moisés, criado en la corte de Egipto, \
pasaba por instruido en toda la sabiduría de los egipcios, astronomía incluida. Ciencia \
y fe no se oponen, pues, aquí. Se ha supuesto que el modelo era Antonie van \
Leeuwenhoek, sabio delftés nacido el mismo año que Vermeer, hipótesis seductora pero \
nunca demostrada."""
histoire = """
Firmado y fechado en 1668, es uno de los poquísimos lienzos fechados de Vermeer. Forma \
sin duda pareja con El geógrafo, conservado en el Städel Museum de Fráncfort, donde \
se reconoce el mismo modelo y la misma bata; los dos cuadros pasaron juntos \
por varias ventas en el siglo XVIII. A finales del siglo XIX, El astrónomo entró \
en la colección de la familia Rothschild, en París. Confiscado por los nazis en 1940 \
y destinado a la colección de Hitler, fue devuelto a la familia tras la guerra. En \
1983, ingresó en el Louvre por dación, es decir, en pago de derechos de sucesión, \
y es hoy uno de los dos únicos Vermeer del museo, junto con La encajera."""
facture = """
La luz de la ventana se desliza sobre el rostro, el globo y los pliegues de la bata, mientras \
que el fondo permanece en una penumbra dorada. Vermeer describe con precisión \
instrumentos que sin duda conocía directamente: el globo corresponde a un modelo \
publicado por Jodocus Hondius en 1600, del que se reconocen las figuras de constelaciones. \
El tapete, logrado con espesos toques de color, contrasta con la bata, pintada por \
amplios planos de azul. La composición, cerrada, sitúa al sabio y el globo en la \
diagonal de la luz."""
details = [
  "La mano derecha del sabio, posada sobre el globo entre las constelaciones.",
  "La firma y la fecha, inscritas en la puerta del armario.",
  "El astrolabio colocado sobre el tapete de la mesa.",
  "El cuadro de Moisés salvado de las aguas, en parte visible a la derecha.",
  "Los pequeños rombos de la vidriera de la ventana, de donde viene la luz.",
]
themes = ["ciencia", "astronomía", "saber", "luz", "interior"]
anecdote = """
Cuando los nazis confiscaron el cuadro en casa de los Rothschild, estamparon en el reverso \
un pequeño sello en forma de cruz gamada, que lo designaba como bien confiscado. La \
marca sigue siendo visible en el dorso del lienzo."""
salle = 3
mur = "ouest"
position = 0
largeur = 0.6

[[oeuvres]]
titre = "La ronda de noche"
artiste = "Rembrandt"
annee = "1642"
image = "ronde-nuit.jpg"
technique = "Óleo sobre lienzo, 379,5 × 453,5 cm"
collection = "Rijksmuseum, Ámsterdam"
note = "La milicia del capitán Banninck Cocq se pone en marcha: un retrato de grupo convertido en escena de teatro."
description = """
En el centro, el capitán Frans Banninck Cocq, de negro con una banda roja, avanza \
hacia nosotros y tiende la mano izquierda mientras habla a su teniente, Willem van Ruytenburch, \
vestido todo de amarillo claro y tocado con un sombrero de pluma. A su alrededor, una compañía de \
milicianos se pone en movimiento en un alegre desorden: un hombre de rojo carga su \
mosquete, otro sopla sobre la cazoleta, un tercero dispara; un portaestandarte \
blande el estandarte, un tambor redobla a la derecha, un perro ladra. Picas y \
lanzas se cruzan en lo alto. A la izquierda, una niña vestida de oro, bañada de \
luz, lleva en el cinto un pollo muerto. Detrás, un arco de piedra, y un \
escudete en el que están inscritos los nombres de los guardias."""
evocation = """
El cuadro es un retrato colectivo: los miembros de la compañía que pagaron por \
figurar están representados en él, pero Rembrandt los funde en una acción en lugar de \
alinearlos. Se ha visto en él el orgullo de una milicia burguesa, garante del orden y de las \
libertades de la ciudad, en una época en que estas compañías habían perdido lo esencial de su \
papel militar y se convertían en sociedades honoríficas. La niña luminosa se interpreta \
a menudo como una figura alegórica de la compañía de arcabuceros: \
las garras del pollo recuerdan su emblema. El movimiento general, la marcha hacia el \
espectador, han hecho del cuadro una imagen del impulso y de la prosperidad de la \
República neerlandesa en el Siglo de Oro."""
histoire = """
Hacia 1639, la compañía del capitán Banninck Cocq encargó este cuadro para la gran \
sala del Kloveniersdoelen, sede de los arcabuceros de Ámsterdam, que recibió toda una \
serie de retratos de compañías de distintos pintores. Concluido en 1642, el año de \
la muerte de Saskia, no provocó el escándalo que la leyenda ha imaginado. En 1715, \
trasladado al ayuntamiento, fue recortado por todos los lados para caber en un muro; \
a la izquierda, dos personajes desaparecieron. Entró después en las colecciones \
nacionales. Durante la Segunda Guerra Mundial, se lo ocultó, enrollado, en refugios, \
en particular una gruta cerca de Maastricht. El Rijksmuseum, cuyo edificio abrió en \
1885, le reserva una sala al fondo de su galería de honor."""
facture = """
Rembrandt sacude el género del retrato de milicia: en lugar de hileras de cabezas \
igualmente iluminadas, crea una escena dramática en la que la luz aísla unas pocas \
figuras, el capitán, el teniente, la niña, y deja a las demás en la \
penumbra. La sombra de la mano del capitán, proyectada sobre el traje del teniente, \
da la medida del espacio. Los bordados dorados están pintados en empastes que \
atrapan la luz. El título, surgido mucho después de la muerte del pintor, viene del barniz \
ennegrecido que oscurecía el lienzo: la escena transcurre en realidad a pleno día."""
details = [
  "La sombra de la mano izquierda del capitán sobre la chaqueta amarilla del teniente.",
  "La niña de vestido dorado, con un pollo muerto colgado del cinto.",
  "El perro que ladra junto al tambor, a la derecha.",
  "El escudete sobre el arco, en el que están inscritos los nombres de los guardias.",
  "El miliciano de rojo, a la izquierda, ocupado en cargar su mosquete.",
]
themes = ["milicia", "retrato de grupo", "movimiento", "claroscuro", "ámsterdam"]
anecdote = """
Desde 2019, la operación «Ronda de noche» estudia y restaura el cuadro ante los ojos \
del público, en una jaula de cristal. En 2021, las partes cortadas en 1715 fueron \
reconstituidas con la ayuda de la inteligencia artificial, a partir de una copia antigua de \
Gerrit Lundens, y expuestas durante un tiempo junto al original."""
salle = 4
mur = "nord"
position = 0
largeur = 4.5

[[artistes]]
nom = "Johannes Vermeer"
vie = "Delft, bautizado el 31 de octubre de 1632 – Delft, enterrado el 15 de diciembre de 1675"
biographie = """
Johannes Vermeer es bautizado en Delft en 1632. Su padre, Reynier Jansz, tejedor de \
sedas, regenta una posada en la plaza mayor y comercia con cuadros. Se ignora \
todo de la formación del joven. En abril de 1653, se casa con Catharina Bolnes, procedente \
de una familia católica acomodada, y se convierte sin duda al catolicismo; la pareja \
se instala en casa de la madre de Catharina, Maria Thins, en el barrio católico de la \
ciudad. Ese mismo año, ingresa en el gremio de San Lucas, del que será varias veces \
uno de los dirigentes. Sus primeros cuadros son escenas mitológicas y \
religiosas; hacia 1657, se vuelve hacia los interiores domésticos que harán su \
gloria. Pinta lentamente, dos cuadros al año de media según las estimaciones, y \
cuenta con un mecenas fiel, Pieter van Ruijven, que poseyó buena parte de su \
obra. La pareja tiene quince hijos, de los que once viven aún a su muerte. En 1672, \
la invasión francesa de las Provincias Unidas hunde el mercado del arte; abrumado por \
las deudas, Vermeer muere bruscamente a los cuarenta y tres años, y su viuda dirá que había \
caído en la desesperación. Pronto olvidado, es redescubierto a mediados del siglo XIX por \
el crítico francés Théophile Thoré-Bürger. Se le atribuyen hoy unos \
treinta y cinco cuadros."""
style = """
Vermeer es el pintor de la luz tranquila: casi siempre llegada de una ventana \
a la izquierda, baña interiores donde una o dos figuras leen, escriben, tocan \
música o trabajan. Sus colores son límpidos, dominados por el azul \
de ultramar natural y el amarillo, y traduce los reflejos con pequeños puntos \
luminosos. Sus composiciones, de una geometría rigurosa, fijan un instante ordinario \
en un silencio suspendido. Aún se discute su recurso a la cámara oscura. Escaso, \
largo tiempo olvidado, se ha convertido en el siglo XX en uno de los pintores más admirados, de \
Proust a Dalí, y en una referencia para toda la pintura de interior."""

[[artistes]]
nom = "Rembrandt"
vie = "Leiden, 15 de julio de 1606 – Ámsterdam, 4 de octubre de 1669"
biographie = """
Rembrandt Harmenszoon van Rijn nace en Leiden, hijo de un molinero acomodado. Inscrito un tiempo \
en la universidad, elige la pintura: tres años de aprendizaje con Jacob van \
Swanenburgh en Leiden, y luego seis meses en Ámsterdam con Pieter Lastman, pintor de historia \
formado en Italia. De regreso en Leiden, trabaja junto a Jan Lievens; ambos \
llaman la atención de Constantijn Huygens, secretario del estatúder. Hacia 1631, \
se instala en Ámsterdam en casa del marchante de arte Hendrick Uylenburgh, de cuya prima, \
Saskia, se casa en 1634. Retratista muy solicitado, compra en 1639 una gran casa \
en la Jodenbreestraat, la actual Casa de Rembrandt, y forma a numerosos discípulos. \
Pero los duelos se acumulan: tres hijos mueren en la infancia, y Saskia fallece \
en 1642, poco después del nacimiento de su hijo Titus. Vive después con Hendrickje \
Stoffels, con quien tiene una hija, Cornelia. Sus gastos de coleccionista y el descenso \
de los encargos lo llevan a la quiebra en 1656; su casa y sus bienes se venden. \
Sigue, sin embargo, pintando y recibiendo encargos importantes, como Los \
síndicos de los pañeros. Hendrickje muere en 1663, Titus en 1668. Rembrandt se extingue \
al año siguiente y es enterrado en la Westerkerk de Ámsterdam, en una tumba alquilada cuyo \
emplazamiento exacto se desconoce hoy."""
