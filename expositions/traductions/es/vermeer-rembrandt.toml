[[oeuvres]]
titre = "La lección de anatomía del doctor Tulp"
artiste = "Rembrandt"
annee = "1632"
image = "lecon-anatomie.jpg"
technique = "Óleo sobre lienzo, 169,5 × 216,5 cm"
collection = "Mauritshuis, La Haya"
note = "Rembrandt tiene 26 años: su primer gran encargo, un retrato de grupo captado en plena disección."
description = """
En una sala sombría, el cadáver de un hombre yace en diagonal sobre una mesa, con el \
cuerpo lívido y el bajo vientre cubierto por un lienzo. A la derecha, sentado, el doctor Nicolaes \
Tulp, con sombrero negro de ala ancha y cuello blanco, sujeta con unas pinzas los músculos \
del antebrazo izquierdo, ya disecado, mientras su mano izquierda, levantada, imita el \
movimiento de los dedos que se pliegan. Siete cirujanos de negro, con el cuello ceñido por una \
gorguera o un cuello blanco, se apretujan a su alrededor en pirámide: algunos se inclinan \
hacia el brazo, uno nos mira, otros fijan la vista en el gran libro abierto a los pies \
del muerto. El del fondo sostiene una hoja en la que figuran los nombres de los participantes. \
La luz cae sobre el cadáver y sobre los rostros, y deja el resto en la sombra."""
evocation = """
El cuadro es a la vez retrato colectivo y lección moral. Cada \
cirujano pagaba por figurar en la obra y quería ser reconocible, pero \
Rembrandt hace de su reunión un momento de atención compartida: se ha visto en ella el triunfo \
de un saber fundado en la observación, en la época en que Ámsterdam se convierte en un gran centro \
científico. El gesto de Tulp, que muestra cómo funciona la mano humana, se ha \
leído como un homenaje al ingenio del Creador, idea cara a los anatomistas de la época. \
Enfrente, el cuerpo del ajusticiado recuerda que la muerte espera a cada uno: la disección \
pública era también una meditación sobre la fragilidad de la vida. El joven pintor \
afirma en ella su ambición: rivalizar con los maestros del retrato de grupo \
introduciendo el drama."""
histoire = """
La disección pública tuvo lugar en Ámsterdam en enero de 1632, sobre el cuerpo de Aris \
Kindt, un ladrón que acababa de ser ahorcado. El gremio de cirujanos hacía \
pintar con regularidad retratos de grupo para adornar su sala; Tulp, encargado de las \
lecciones de anatomía de la ciudad, eligió al joven Rembrandt, llegado de Leiden hacía poco. \
El cuadro lanzó su carrera en Ámsterdam y le valió numerosos encargos de \
retratos. Permaneció colgado en casa de los cirujanos durante casi dos siglos. En \
1828, la caja de viudas de los cirujanos quiso venderlo para sanear sus fondos; \
el rey Guillermo I se hizo con él para el Mauritshuis de La Haya, donde se \
expone desde entonces."""
facture = """
Rembrandt rompe con las hileras de cabezas alineadas de los retratos de grupo \
anteriores: los rostros se escalonan en pirámide y convergen hacia el brazo disecado y \
la mano de Tulp. La luz, llegada de la izquierda, esculpe los rostros y hace del \
cadáver la mancha más clara del cuadro, según un claroscuro heredado de la \
pintura caravaggista. Los negros de las ropas están matizados, los cuellos y las gorgueras \
pintados con precisión; la carne del muerto, de un blanco verdoso, contrasta con la tez \
rosada de los vivos."""
details = [
  "La mano izquierda levantada de Tulp, que imita el movimiento de los dedos que explica.",
  "La hoja que sostiene el cirujano del fondo, con la lista de los nombres de los presentes.",
  "El gran libro abierto a los pies del cadáver, sin duda un tratado de anatomía.",
  "El sombrero de Tulp, único tocado del cuadro, signo de su rango.",
  "El contraste entre la piel verdosa del muerto y los rostros rosados de los vivos.",
]
themes = ["ciencia", "medicina", "muerte", "retrato de grupo", "cuerpo"]
anecdote = """
Nicolaes Tulp se llamaba en origen Claes Pieterszoon. Adoptó el nombre de Tulp, \
«tulipán» en neerlandés, por el rótulo en forma de tulipán de la casa en la que \
vivía, y convirtió esta flor en su emblema."""
salle = 1
mur = "est"
position = 7
largeur = 2.2

[[oeuvres]]
titre = "Autorretrato"
artiste = "Rembrandt"
annee = "1659"
image = "autoportrait-rembrandt.jpg"
technique = "Óleo sobre lienzo, 84,5 × 66 cm"
collection = "National Gallery of Art, Washington"
note = "Arruinado, a los 53 años, Rembrandt se pinta sin complacencia: un rostro marcado, iluminado en la sombra."
description = """
Rembrandt se representa a medio cuerpo, de tres cuartos, con la mirada vuelta hacia nosotros. \
Lleva una boina oscura y un abrigo marrón de tonos cálidos, cuyos pliegues se pierden \
en la oscuridad del fondo. Sus manos, juntas ante él, apenas están indicadas y \
permanecen en penumbra. Toda la luz se concentra en el rostro: una frente arrugada, \
bolsas bajo los ojos, mejillas pesadas, una piel marcada por la edad. Mechones de \
cabello gris y rizado asoman bajo la boina. Ningún accesorio, ningún decorado, ni siquiera un \
pincel o una paleta que recuerden su oficio: nada distrae del rostro y de la \
mirada, a la vez cansada y atenta, que parece interrogar al espectador tanto como al \
propio pintor."""
evocation = """
Pintado a raíz de su quiebra, este retrato se lee a menudo como un examen de \
conciencia: un hombre que lo ha perdido todo, salvo su arte, y se mira de frente. Rembrandt \
es el pintor que más se ha representado antes de la época moderna, unas cuarenta \
veces en pintura, sin contar los grabados y los dibujos; puestos uno tras otro, estos \
autorretratos forman una suerte de autobiografía, del joven ambicioso al \
anciano. Aquí, ya no hay traje de fantasía ni pose favorecedora: la verdad de la \
carne que envejece se convierte en el tema. Algunos historiadores recuerdan que estos cuadros \
eran también buscados por los aficionados, y no solo confesiones íntimas; \
pero la gravedad de esta mirada ha hecho de él la imagen misma del artista frente a sí mismo."""
histoire = """
En 1656, abrumado por las deudas tras la compra de su gran casa de la Jodenbreestraat y \
años de adquisiciones de cuadros y objetos de colección, Rembrandt obtiene una \
cesión de bienes, forma de quiebra que le evita la prisión por deudas. Sus \
colecciones se dispersan en subastas en 1657 y 1658, la casa se vende, y se \
instala en un barrio más modesto. En esos años difíciles pinta \
este autorretrato, firmado y fechado en 1659. Sigue, sin embargo, trabajando y \
recibiendo encargos prestigiosos, como Los síndicos de los pañeros en 1662. El \
cuadro fue adquirido en el siglo XX por el financiero estadounidense Andrew W. Mellon, que \
lo ofreció en 1937 a la National Gallery of Art de Washington, cuyo núcleo formó su colección."""
facture = """
La pincelada cambia según las zonas: el rostro está construido en capas espesas, aplicadas \
y retomadas, donde la pasta atrapa la luz como el relieve de la piel; las ropas \
y las manos se pintan más ampliamente, casi dejadas en estado de boceto. \
Rembrandt limita su paleta a los marrones, los ocres y los negros cálidos, con algunos \
rojos en las carnes. La iluminación lateral deja una parte del rostro en una sombra \
transparente. Este contraste entre el rostro muy trabajado y la libertad del resto \
dirige la mirada del espectador directamente hacia los ojos."""
details = [
  "Las arrugas de la frente, logradas por el propio espesor de la pintura.",
  "Las manos juntas, apenas esbozadas en la sombra de la parte baja del cuadro.",
  "Los mechones grises que escapan de la boina, a cada lado del rostro.",
  "El abrigo pintado a grandes pinceladas, que se funde con el fondo oscuro.",
]
themes = ["autorretrato", "vejez", "introspección", "ruina"]
anecdote = """
El inventario levantado con ocasión de su quiebra, en 1656, revela en Rembrandt una colección \
asombrosa: cuadros de maestros italianos y flamencos, álbumes de grabados, bustos \
antiguos, armas, conchas, objetos llegados de las Indias… Todo se vendió en subasta."""
salle = 1
mur = "est"
position = -11
largeur = 0.85

[[oeuvres]]
titre = "Betsabé en el baño"
artiste = "Rembrandt"
annee = "1654"
image = "bethsabee.jpg"
technique = "Óleo sobre lienzo, 142 × 142 cm"
collection = "Museo del Louvre, París"
note = "Betsabé sostiene la carta del rey David: un desnudo pensativo, pintado a partir de su compañera Hendrickje."
description = """
Una joven desnuda, de tamaño natural, está sentada sobre una cama cubierta de telas, con el \
cuerpo casi de frente, la cabeza inclinada hacia un lado, la mirada perdida hacia abajo. En su \
mano derecha, apoyada sobre el muslo, sostiene una carta abierta. A sus pies, una \
vieja criada vestida de oscuro, con la cabeza cubierta, se ocupa de lavarle o de \
secarle los pies. El fondo es casi negro; bajo la joven, una sábana blanca \
arrugada, y tras ella un brocado dorado componen un decorado suntuoso. Algunas \
joyas, un brazalete y adornos en el cabello, subrayan su desnudez. El cuerpo, \
muy luminoso, ocupa el centro del cuadro cuadrado, y nada viene a turbar el \
cara a cara entre la mujer y sus pensamientos."""
evocation = """
El relato procede del segundo libro de Samuel: desde la terraza de su palacio, el rey \
David ve a Betsabé en el baño, la hace venir y la seduce; ella queda encinta, y \
David envía a su marido Urías a morir en el combate. La Biblia no habla de una carta: \
Rembrandt la añade para condensar el drama en un solo instante. Allí donde otros pintores \
mostraban a una bañista espiada, él muestra a una mujer que reflexiona sobre lo que se exige \
de ella, dividida entre la obediencia al rey y la fidelidad a su esposo. Se ha visto en su \
melancolía el presentimiento de las desgracias por venir. El cuerpo pintado no tiene nada de idealizado: \
es el de una mujer real, con su vientre, sus pliegues, su carne."""
histoire = """
Firmado y fechado en 1654, el cuadro pertenece a un año difícil para Rembrandt y su \
compañera Hendrickje Stoffels. Encinta, es convocada por el consejo de la Iglesia \
reformada, reprendida por vivir con el pintor fuera del matrimonio y privada de la comunión; \
su hija Cornelia nace en otoño. Viudo de Saskia, Rembrandt no podía volver a casarse \
sin perder el usufructo de la herencia de su primera esposa, reservada a su hijo \
Titus. Se ignora para quién se pintó el cuadro. Tras pasar por diversas \
colecciones, fue adquirido por el médico y coleccionista parisino Louis La Caze, \
que lo legó al Louvre en 1869 junto con más de quinientos cuadros."""
facture = """
Rembrandt construye el cuerpo con la luz más que con el dibujo: una pasta cálida \
y cremosa, aplicada en capas suaves, modela los volúmenes sin contorno nítido. Las \
telas se tratan con gran libertad, a anchas pinceladas, con \
empastes dorados para el brocado. La pose de Betsabé retoma, según se ha mostrado, \
figuras antiguas conocidas por grabados, que el pintor transforma en escena íntima. \
La criada, en la sombra, hace contrapunto al cuerpo iluminado, y las figuras de tamaño \
natural dan a la escena una presencia casi monumental."""
details = [
  "La carta del rey David, sostenida lánguidamente en la mano derecha de Betsabé.",
  "El rostro inclinado, los ojos bajos, absorto en sus pensamientos.",
  "La vieja criada, en la sombra, inclinada sobre los pies de su señora.",
  "El brocado dorado tras la joven, pintado en toques espesos.",
  "La sábana blanca arrugada, la zona más clara después del cuerpo.",
]
themes = ["biblia", "desnudo", "deseo", "melancolía", "dilema"]
anecdote = """
Unos médicos creyeron reconocer, en una sombra del seno izquierdo de Betsabé, los \
signos de un tumor, y supusieron que la modelo lo padecía. La hipótesis, \
inverificable, ha hecho correr mucha tinta y sigue siendo un ejemplo célebre de diagnóstico \
hecho sobre una pintura."""
salle = 1
mur = "ouest"
position = -7
largeur = 1.4

[[oeuvres]]
titre = "El regreso del hijo pródigo"
artiste = "Rembrandt"
annee = "hacia 1668"
image = "fils-prodigue.jpg"
technique = "Óleo sobre lienzo, 262 × 205 cm"
collection = "Museo del Hermitage, San Petersburgo"
note = "El padre posa las manos sobre los hombros del hijo arrodillado: uno de los últimos lienzos, y de los más conmovedores."
description = """
En una penumbra dorada, un anciano de ojos entornados, vestido con un amplio manto rojo, \
se inclina sobre un joven arrodillado junto a él y posa ambas manos sobre su espalda. \
El hijo, visto de espaldas, tiene el cráneo rapado y ropas hechas jirones de un amarillo terroso; \
ha perdido una sandalia, y la planta de su pie desnudo, sucio y callosa, se vuelve hacia \
nosotros. Apoya la cabeza contra el pecho de su padre. A la derecha, de pie, un hombre \
barbudo, también envuelto en rojo, observa la escena, rígido, con las manos apoyadas en un \
bastón: se lo identifica con el hermano mayor. Otras figuras permanecen en segundo plano, entre ellas un \
hombre sentado que mira, y siluetas apenas visibles en la sombra del fondo."""
evocation = """
La parábola, en el Evangelio de Lucas, cuenta cómo el hijo menor reclama su parte \
de la herencia, la dilapida y vuelve después miserable junto a su padre, que lo acoge con \
alegría, para disgusto del hermano mayor, que se había mantenido fiel. Rembrandt no pinta ni la fiesta ni la \
caída del hijo, sino el instante del perdón, silencioso y sin condiciones. Las manos \
del padre son su corazón: a menudo se ha observado que parecen diferentes, una \
ancha y masculina, otra más fina, y se ha visto en ello la unión de una ternura \
paterna y materna. La distancia entre el grupo abrazado y el hermano que se mantiene \
apartado plantea la cuestión de los celos y de la justicia. Pintado al final de una vida \
marcada por los duelos, el cuadro se ha leído como el testamento espiritual de Rembrandt."""
histoire = """
La fecha del cuadro es incierta: se sitúa generalmente en los últimos años \
de Rembrandt, muerto en 1669, un año después de su hijo Titus. Algunos historiadores piensan \
que partes secundarias, en particular figuras del fondo, pudieron ser \
terminadas por otro pintor. Se ignora para quién fue pintado y cuál fue su \
recorrido durante el siglo siguiente. En 1766 fue comprado en París para la emperatriz \
Catalina II de Rusia, que reunía entonces en San Petersburgo las colecciones del \
Hermitage, uno de los grandes museos de Europa. Se conserva allí desde entonces, y figura entre \
las obras más célebres del museo."""
facture = """
Rembrandt pinta aquí con una libertad extrema: la materia, espesa y rugosa en los \
harapos del hijo y el manto del padre, está aplicada con pincel ancho, a veces retomada \
y rascada, mientras que el fondo se disuelve en veladuras marrones y transparentes. La \
gama se reduce a los rojos, los ocres y los marrones, que la luz hace brillar como brasas. La \
composición es descentrada: el grupo del padre y del hijo ocupa la izquierda, cayendo la luz \
más viva sobre sus cabezas y sobre las manos, mientras que el hermano mayor, \
también iluminado, les hace frente a la derecha. Las figuras son casi de tamaño natural."""
details = [
  "Las dos manos del padre, de forma distinta, posadas sobre la espalda del hijo.",
  "El pie desnudo del hijo, salido de su sandalia gastada, de planta sucia.",
  "El cráneo rapado del hijo, como el de un preso o un mendigo.",
  "La espada corta aún colgada de su cinto, último signo de su rango.",
  "El hermano mayor, de pie a la derecha, que mira sin acercarse.",
]
themes = ["biblia", "perdón", "familia", "paternidad", "vejez"]
anecdote = """
Conmovido por un cartel de este cuadro, el sacerdote neerlandés Henri Nouwen fue a \
contemplarlo largamente al Hermitage. De ello sacó un libro de meditación, «El regreso \
del hijo pródigo», publicado en 1992 y traducido a numerosas lenguas."""
salle = 1
mur = "ouest"
position = 11
largeur = 1.6

[[oeuvres]]
titre = "La lechera"
artiste = "Johannes Vermeer"
annee = "hacia 1658"
image = "laitiere.jpg"
technique = "Óleo sobre lienzo, 45,5 × 41 cm"
collection = "Rijksmuseum, Ámsterdam"
note = "Una criada vierte leche, en la luz de la ventana: el pan parece espolvoreado de puntos luminosos."
description = """
En un rincón de cocina iluminado por una ventana a la izquierda, una criada robusta, \
de pie, vierte lentamente un fino hilo de leche de una jarra de barro en un recipiente \
colocado sobre la mesa. Lleva una cofia blanca, un corpiño amarillo de mangas \
remangadas, una falda roja y un delantal azul. Ante ella, sobre un mantel azul verdoso, \
un cesto y trozos de pan, y una jarra azul. La pared desnuda, encalada, \
muestra un clavo y huellas de agujeros; un cesto y un cubo de cobre cuelgan \
junto a la ventana, en la que hay un cristal roto. En el suelo, a la derecha, un calentador de pies de \
madera, y una hilera de azulejos de Delft al pie del muro."""
evocation = """
Nada espectacular: una criada absorta en un gesto cotidiano. Pero Vermeer \
da a ese gesto una gravedad casi solemne, y la figura, sólidamente plantada, tiene la \
presencia de una estatua. Los historiadores ven en ello el elogio de las virtudes domésticas caras a \
la sociedad neerlandesa: el orden, la limpieza, el trabajo paciente. Esta seriedad no \
era evidente: en la pintura y la literatura de la época, lecheras y criadas de \
cocina eran a menudo objeto de insinuaciones picantes. Un pequeño Cupido pintado en \
un azulejo, y el calentador de pies, asociado al deseo en los libros de emblemas, \
recuerdan ese registro, que la dignidad de la mujer mantiene a distancia. Se ha supuesto también que \
preparaba un pudin de pan, lo que explicaría el pan duro sobre \
la mesa."""
histoire = """
El cuadro data de los primeros años de madurez de Vermeer, hacia 1658-1660, poco después de \
que abandonara los temas religiosos y mitológicos por las escenas de interior. \
Perteneció quizá a su principal mecenas, el delftés Pieter van Ruijven. Figuraba en todo caso en la \
venta de la colección de Jacob Dissius, en Ámsterdam, en \
1696, descrito como una criada que vierte leche, «extremadamente bien hecho», y adjudicado en \
175 florines, uno de los precios más altos de la venta. En el siglo XIX, pertenecía \
a la familia Six, en Ámsterdam. En 1908, el Rijksmuseum lo compró a sus herederos \
gracias a la ayuda del Estado y de la asociación Rembrandt."""
facture = """
Vermeer coloca la luz con pequeños toques: sobre el pan, el cesto y la jarra, \
puntos de pintura clara, ligeramente en relieve, hacen centellear las superficies; se \
habla de «puntillismo». El azul del delantal y del mantel es ultramar natural, \
extraído del lapislázuli, pigmento muy costoso que empleaba sin tasa. El examen del \
cuadro ha mostrado que había pintado primero un objeto colgado de la pared y un cesto de \
ropa junto al calentador, y luego los borró para despojar la escena. El \
punto de vista, ligeramente en contrapicado, engrandece a la criada."""
details = [
  "Los puntos luminosos sobre la corteza del pan y sobre el mimbre del cesto.",
  "El fino hilo de leche, casi inmóvil, que cae de la jarra.",
  "El clavo hincado en la pared, con su diminuta sombra.",
