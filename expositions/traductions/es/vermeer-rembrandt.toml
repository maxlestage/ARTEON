accroche = "Exposición virtual · Vermeer y Rembrandt"
introduction = """
Dos gigantes de la pintura neerlandesa del siglo XVII: Rembrandt y su \
claroscuro dramático, Vermeer y su luz tranquila que entra por la \
ventana. Diez lienzos, desde la Lección de anatomía hasta la Joven de la perla, y hasta \
