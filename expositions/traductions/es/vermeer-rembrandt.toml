Rembrandt es el maestro del claroscuro: una luz cálida y dorada hace surgir de \
la sombra un rostro, una mano, un objeto, y concentra la emoción. Su pincelada evoluciona de una \
precisión lisa, en la década de 1630, hacia una materia cada vez más espesa y \
libre, trabajada con pincel y a veces con espátula, que da a las carnes y a las \
telas un relieve impresionante. Pintor, dibujante y grabador de primer orden, \
renovó el retrato de grupo y la escena bíblica, buscando la verdad \
psicológica antes que la belleza ideal. Sus discípulos, de Ferdinand Bol a Carel \
Fabritius, difundieron su manera; en el siglo XIX, Delacroix y Van Gogh lo \
admiraron profundamente."""
