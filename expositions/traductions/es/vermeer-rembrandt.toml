vitrine = "jeune-fille-perle.jpg"

[musee]
nom = "Rijksmuseum"
ville = "Ámsterdam, Países Bajos"
architecte = "Pierre Cuypers"
construction = "1876–1885"
presentation = """
El museo nacional de los Países Bajos nace en La Haya en 1800 y se instala en Ámsterdam en 1808. \
Para dotarlo de un verdadero palacio, el Estado confía a Pierre Cuypers, campeón del renacimiento \
gótico, un edificio de ladrillo rojo, construido de 1876 a 1885, que combina torres y \
altos tejados góticos con ornamentos del Renacimiento neerlandés; un pasaje abovedado \
lo atraviesa de parte a parte, aún hoy transitado por los ciclistas. En la primera \
planta, la galería de honor, flanqueada de alcobas, conduce como la nave de una iglesia a la \
sala de la Ronda de noche, concebida para el cuadro de Rembrandt. Tras diez años de obras \
dirigidas por los arquitectos españoles Cruz y Ortiz, el museo reabrió en 2013, con sus \
patios cubiertos y sus decoraciones pintadas restauradas. Allí se ve el Siglo de Oro neerlandés al \
completo: Rembrandt, Frans Hals, Jan Steen, y cuatro cuadros de Vermeer, entre ellos la \
Lechera."""
ici = """
El edificio de ARTEON retoma el eje del Rijksmuseum: una galería de honor que conduce a la \
Ronda de noche. Se entra por el sur en «La galería de honor · Rembrandt», de treinta metros de largo \
y nueve de ancho, de muros beige grisáceo. En su parte norte, dos puertas se \
miran de frente: al este el gabinete de Vermeer, al oeste el gabinete de Delft, dos pequeñas \
estancias cuadradas y bajas, de muros gris muy pálido, hechas para cuadros íntimos. Al \
fondo de la galería, la sala de la Ronda de noche, cuadrada y más alta, presenta el \
lienzo a su tamaño real."""

