[[oeuvres]]
titre = "Bicicleta «La Souplette»"
artiste = "Fabricants de cycles anonymes"
annee = "1897"
image = "souplette.jpg"
credit = "Photo : Hélène Rival"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Cycle_16.jpg"
technique = "Cuadro de madera curvada y acero, cuero, caucho"
collection = "Musée d'Art et d'Industrie, Saint-Étienne"
note = "Una bicicleta de seguridad fabricada en París en 1897, cuyo cuadro de madera curvada debía absorber las sacudidas del camino."
description = """
La bicicleta se presenta de perfil ante un muro de piedras rubias iluminado desde \
abajo, sostenida por dos soportes. Sus dos ruedas tienen el mismo tamaño, con llantas \
pardo rojizas y radios finos. El cuadro tiene ya casi la forma de un rombo: un tubo \
horizontal, un tubo oblicuo hacia el pedalier y un tubo del sillín. Pero atrás, un \
largo arco curvo envuelve la rueda y alcanza la parte alta del cuadro, como un \
muelle. El pedalier lleva un plato calado; la cadena corre hasta el piñón de la rueda \
trasera. El sillín de cuero oscuro está montado alto, y el manillar levantado termina \
en empuñaduras de madera clara."""
evocation = """
A finales de la década de 1890, la bicicleta de seguridad ha ganado la partida, y los \
constructores rivalizan en ideas para hacerla más cómoda, más ligera o más elegante. \
El neumático suaviza ya el camino, pero los adoquines y los caminos rurales siguen \
sacudiendo al ciclista. El cuadro de madera curvada de la Souplette, cuyo nombre lo \
dice todo, busca absorber esos golpes con la flexibilidad misma del material. Como \
tantos otros inventos de esos años de fiebre, no se impuso, pero muestra la \
inventiva de una industria entonces en plena expansión en Francia."""
histoire = """
Según la presentación del Museo de Arte e Industria, esta bicicleta se fabricó en \
París en 1897. Esos años son los de la edad de oro de la bicicleta en Francia: los \
fabricantes se cuentan por centenares, de París a Saint-Étienne, donde casas como la \
Manufacture française d'armes et cycles venden sus máquinas por catálogo en todo el \
país. El museo de Saint-Étienne reunió, después de la Segunda Guerra Mundial, \
máquinas de todos los orígenes para trazar la historia técnica del ciclo; la \
Souplette comparte allí espacio con un monociclo, una bicicleta sin cadena de la \
década de 1880 y las máquinas de Vélocio, pionero de Saint-Étienne del cicloturismo."""
facture = """
La madera curvada es una técnica de la ebanistería del siglo XIX, hecha célebre por \
las sillas vienesas de Michael Thonet: se ablanda la madera con vapor y luego se \
curva en un molde, donde conserva su forma al secarse. Aplicada a la bicicleta, \
permite realizar piezas de cuadro flexibles y ligeras. El resto de la máquina retoma \
las soluciones de la bicicleta de seguridad: ruedas iguales de radios de acero, \
transmisión por cadena, pedalier central y sillín de cuero regulable. El contraste \
entre la madera curvada y el acero constituye la originalidad del objeto."""
details = [
  "El largo arco curvo que envuelve la rueda trasera.",
  "Las llantas pardo rojizas y sus finos radios.",
  "El plato calado del pedalier y su cadena.",
  "Las empuñaduras de madera clara del manillar levantado.",
]
themes = ["bicicleta", "madera curvada", "comodidad", "invento", "saint-étienne"]
anecdote = """
Los catálogos de venta por correspondencia de finales del siglo XIX ofrecían decenas \
de modelos y de accesorios: la bicicleta se compraba ya a distancia."""
salle = 3
mur = "sud"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "Cronofotografía de un hombre en bicicleta"
artiste = "Étienne-Jules Marey"
annee = "hacia 1885–1890"
image = "marey-cycliste.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:%C3%89tienne_Jules_Marey,_Chronophotograph_of_a_Man_on_a_Bicycle,_c._1885-1890,_NGA_125658.jpg"
technique = "Placa de vidrio para proyección (diapositiva); imagen 4 × 7,5 cm, placa 8,8 × 10,2 cm"
collection = "National Gallery of Art, Washington"
note = "El fisiólogo Marey descompone el movimiento de un ciclista en cinco imágenes superpuestas en una sola placa: el tiempo se hace visible."
description = """
Sobre un fondo negro, un mismo hombre aparece cinco veces de izquierda a derecha, con \
unas fracciones de segundo de intervalo. Vestido de blanco, con un gorro claro y \
barbudo, pedalea con la espalda algo encorvada y las manos sobre un manillar. Sus \
piernas, en cada imagen, ocupan una posición distinta: se ve subir la rodilla y bajar \
el pedal. Las ruedas de su máquina, ceñidas de finos radios, se superponen de una \
imagen a otra en anillos transparentes, de tamaños diferentes. Abajo, una orla clara, \
hecha de bandas y adoquines, marca la pista. La placa ha tomado un tono cálido, pardo \
sepia, y algunas manchas de polvo la salpican."""
evocation = """
Marey no busca hacer una bella imagen: quiere comprender cómo trabaja el cuerpo. Al \
fijar en una misma placa las posiciones sucesivas del ciclista, hace visible lo que \
el ojo no puede captar, la sucesión de gestos que hace avanzar la máquina. La \
National Gallery of Art recuerda que Marey hizo probablemente esta imagen en el marco \
de investigaciones sobre una indumentaria deportiva que cansara menos. Pero sus \
cronofotografías fascinaron también a los artistas: cubistas, futuristas y dadaístas \
encontraron en ellas una manera de pintar el movimiento y la velocidad, que la \
bicicleta encarnaba tan bien."""
histoire = """
Étienne-Jules Marey, profesor del Collège de France y miembro de la Academia de \
Medicina, estudia desde la década de 1860 el movimiento de los seres vivos. En 1882 \
instala la Estación Fisiológica cerca del Bosque de Bolonia, donde atletas, soldados \
y caballos desfilan ante un gran cobertizo pintado de negro. Allí perfecciona la \
cronofotografía sobre placa fija y luego sobre película, y prepara así la invención \
del cine. Esta placa de vidrio, hecha para proyectarse ante un público, muestra que \
presentaba sus imágenes en conferencias. Ingresó en la National Gallery of Art de \
Washington por donación de Mary y David Robinson."""
facture = """
Para obtener esta imagen, Marey modifica un aparato fotográfico: detrás del objetivo, \
dejado abierto, gira un disco de metal perforado con ranuras a intervalos regulares. \
Cada vez que pasa una ranura, la placa recibe una breve exposición. El ciclista, \
vestido de blanco, se recorta sobre el fondo negro, que no impresiona la placa: sus \
imágenes sucesivas se suman sin difuminarse. El resultado se transfiere a una placa \
de vidrio para la proyección luminosa, la «linterna mágica» de los conferenciantes. \
El número y la separación de las imágenes dependen de la velocidad del disco y de la \
del sujeto."""
details = [
  "Las cinco siluetas sucesivas del mismo ciclista.",
  "La rodilla que sube y baja de una imagen a otra.",
  "Las ruedas superpuestas en anillos transparentes.",
  "El gorro claro y el traje blanco que se recortan sobre el negro.",
  "La orla de la pista, en la parte baja de la placa.",
]
themes = ["cronofotografía", "movimiento", "ciencia", "tiempo", "deporte"]
anecdote = """
Para algunos estudios, Marey vestía a sus modelos enteramente de negro, con bandas y \
puntos blancos en los miembros: entonces solo las líneas del esqueleto aparecían en \
la placa."""
salle = 4
mur = "nord"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "El Chalet du Cycle en el Bosque de Bolonia"
artiste = "Jean Béraud"
annee = "hacia 1900"
image = "chalet-du-cycle.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:B%C3%A9raud_-_Le_Chalet_du_Cycle_au_bois_de_Boulogne,_Vers_1900.jpg"
technique = "Óleo sobre madera, 53,5 × 65 cm"
collection = "Musée Carnavalet – Histoire de Paris"
note = "En el Bosque de Bolonia, unas parisinas con pantalón bombacho toman algo en la terraza de un chalet donde se alquilan y se reparan bicicletas: la Belle Époque en bicicleta."
description = """
Bajo grandes árboles, una alameda de arena se abre a la bruma clara del bosque. A la \
derecha, un chalet de madera roja con balcón alberga a un alquilador de bicicletas: \
ante la puerta, unos hombres con ropa de trabajo se afanan en torno a las máquinas. \
En el centro, una joven con pantalón bombacho blanco monta en su bicicleta, mientras \
un perrito blanco y negro trota hacia ella. A la izquierda, una terraza de café reúne \
a paseantes con canotier y a ciclistas: en primer plano, una mujer de pantalón blanco \
y lazo rojo y otra de negro, con las piernas cruzadas, están sentadas en torno a \
veladores de mármol, con un sifón azul. Un farol se alza en medio de la alameda."""
evocation = """
Hacia 1900, la bicicleta está de moda en la buena sociedad parisina, y el Bosque de \
Bolonia es su salón. Se va allí en bicicleta, se alquila una máquina, se dejan ver. \
Jean Béraud, cronista infatigable de la vida parisina, capta sobre todo una \
revolución: la de las mujeres. Para pedalear, han abandonado las faldas largas por el \
pantalón bombacho, al que también se llama bloomer, y esta indumentaria, que causó \
escándalo, les da una libertad nueva. Sentadas solas en una terraza, con las piernas \
cruzadas, estas ciclistas afirman una independencia que la bicicleta contribuyó a \
darles."""
histoire = """
Jean Béraud (1849–1935) pasó su vida pintando París: los bulevares, los cafés, los \
teatros, las iglesias y los paseos de moda. Compone sus cuadros como escenas de \
comedia, con una multitud de personajes captados del natural. El Chalet du Cycle era \
un establecimiento del Bosque de Bolonia donde se podía alquilar, guardar o hacer \
reparar la bicicleta y refrescarse. El cuadro, fechado hacia 1900, pertenece al museo \
Carnavalet, el museo de la historia de París, que lo ha publicado en acceso libre \
junto con el conjunto de las colecciones de los museos de la Ciudad de París."""
facture = """
Béraud pinta aquí sobre un panel de madera, de pequeño formato, con una pincelada \
rápida y ligera, casi un boceto. El fondo, sumido en una bruma malva y verde, está \
tratado con amplias pinceladas; los personajes del primer plano, en cambio, se \
precisan con acentos vivos: el lazo rojo, el sifón azul, los pantalones de un blanco \
deslumbrante. Las bicicletas están dibujadas con un trazo fino y seguro, ruedas y \
cuadros incluidos. Los grandes troncos verticales, el farol y el chalet construyen la \
profundidad de la alameda, que conduce la mirada hacia la luz del fondo."""
details = [
  "La ciclista de pantalón bombacho blanco que monta en su máquina.",
  "El perrito blanco y negro que corre hacia ella.",
  "El sifón azul sobre el velador de mármol.",
  "Los mecánicos inclinados sobre las bicicletas, ante el chalet.",
  "El lazo rojo de la joven sentada a la izquierda.",
]
themes = ["belle époque", "parís", "mujeres", "ocio", "bosque de bolonia"]
anecdote = """
El pantalón bombacho de las ciclistas suscitó debate hasta en los periódicos: se \
discutía con seriedad si una mujer podía llevarlo en la ciudad."""
