[[artistes]]
nom = "D'après Karl von Drais"
vie = "Karl von Drais, Karlsruhe 1785 – Karlsruhe 1851"
biographie = """
Karl Friedrich Christian Ludwig, barón von Drais, nace en 1785 en Karlsruhe, en el \
país de Baden. Estudia ciencias forestales, arquitectura y física, y se convierte en \
funcionario forestal del gran duque de Baden, un cargo que le deja tiempo para \
inventar. Imagina un carruaje de cuatro ruedas movido por la fuerza de los brazos, \
una máquina de escribir de teclado y un aparato para anotar la música tocada al \
piano. Su gran invento sigue siendo la Laufmaschine, la «máquina de correr» de 1817, \
que presenta en Mannheim y después en París en 1818 y que hace patentar en el país de \
Baden. La máquina es copiada en todas partes, en Francia con el nombre de draisiana, \
en Inglaterra con el de «hobby horse», pero su inventor no obtiene de ella ni fortuna \
ni gloria. Sus opiniones liberales y las desgracias de su familia le acarrean \
problemas; durante la revolución de Baden de 1848–1849, renuncia a su título de \
barón. Muere pobre en Karlsruhe en 1851. Las draisianas conservadas fueron \
fabricadas por diversos carreteros según su modelo."""
style = """
Una máquina de carretero: viga y ruedas de madera, herrajes, sillín de cuero. Su \
genio reside en una sola idea, el equilibrio sobre dos ruedas alineadas, y en un solo \
órgano verdaderamente nuevo, la rueda delantera que pivota para dirigir la máquina."""

[[artistes]]
nom = "Michaux et Cie, puis Compagnie parisienne"
vie = "París, décadas de 1860 – 1870"
biographie = """
Pierre Michaux (1813–1883) es un cerrajero y carrocero instalado en París, en el \
barrio de los Campos Elíseos. Según la tradición, en su taller, hacia 1861, se \
fijan por primera vez manivelas y pedales a la rueda delantera de una draisiana, \
quizá por iniciativa de su hijo Ernest. La atribución del invento ha sido discutida, \
en particular en favor del obrero Pierre Lallement, que hizo patentar una máquina \
semejante en Estados Unidos en 1866. Michaux, asociado desde 1868 con los hermanos \
Olivier, ricos industriales, transforma el taller en una verdadera fábrica y produce \
cientos de velocípedos, vendidos en Francia y en el extranjero. En 1869, los Olivier \
retoman el negocio con el nombre de Compagnie parisienne des vélocipèdes. La moda del \
velocípedo alcanza entonces su apogeo, con sus carreras, sus picaderos y sus \
periódicos, antes de que la guerra de 1870 venga a interrumpir el auge de esta \
primera industria del ciclo en Francia."""
style = """
Máquinas de fragua y de cerrajería: cuadro de hierro, primero de fundición y luego \
forjado, ruedas de madera con aro de hierro, pedales en la rueda delantera, sillín \
sobre muelle de ballesta y freno de cordón. Las volutas y los filetes pintados dicen \
el gusto de una época que quería que las máquinas fueran también objetos elegantes."""

[[artistes]]
nom = "Fabricants de cycles anonymes"
vie = "Europa, finales del siglo XIX"
biographie = """
De la década de 1870 a 1900, centenares de talleres y fábricas producen biciclos y \
luego bicicletas en Inglaterra, Francia, Alemania y Estados Unidos. Coventry, en \
Inglaterra, se convierte en la capital de esta industria, con los Starley, Hillman, \
Singer o Rudge. En Francia, París cuenta con numerosos constructores, y Saint-Étienne, \
ciudad de armeros habituados al trabajo de precisión del metal, se vuelve a su vez \
hacia el ciclo a partir de la década de 1880: la Manufacture française d'armes et \
cycles, futura Manufrance, vende sus bicicletas Hirondelle por catálogo en todo el \
país. Muchas máquinas conservadas en los museos ya no llevan placa ni marca legible, o \
proceden de pequeños fabricantes cuya historia es mal conocida. Testimonian, sin \
embargo, la variedad de ideas y de ensayos de esos años de invención, antes de que la \
bicicleta de seguridad, de cuadro en rombo y neumáticos, se convirtiera en el modelo \
común."""
style = """
Tubos de acero huecos, radios tensos, rodamientos de bolas, bandajes de caucho y \
luego neumáticos: los fabricantes comparten las mismas técnicas, pero rivalizan en \
inventos para el cuadro, la transmisión, la comodidad o la ligereza, como el cuadro \
de madera curvada de la Souplette."""

[[artistes]]
nom = "John Kemp Starley"
vie = "Walthamstow 1854 – Coventry 1901"
biographie = """
John Kemp Starley nace en 1854 cerca de Londres. Hacia 1872 se une en Coventry a su \
tío James Starley, inventor prolífico al que se apoda el padre de la industria del \
ciclo, y trabaja con él en biciclos y triciclos. En 1877 se asocia con William \
Sutton, un apasionado del ciclismo, para fundar su propia empresa, Starley & Sutton. \
Allí concibe en 1885 el Rover, una bicicleta de seguridad de transmisión por cadena \
hacia la rueda trasera, cuyos modelos sucesivos fijan la forma de la bicicleta \
moderna. El éxito es tal que la empresa toma el nombre de J. K. Starley & Co. y luego \
se convierte en la Rover Cycle Company. John Kemp Starley muere en 1901, a los \
cuarenta y seis años. Tras su muerte, la empresa se lanza a la motocicleta y después \
al automóvil, y el nombre de Rover sigue siendo durante mucho tiempo el de una marca \
de coches británicos. En polaco, la palabra «rower», que designa la bicicleta, \
procede del nombre de su máquina."""
style = """
Un ingeniero pragmático más que un inventor genial: reúne soluciones ya conocidas, la \
cadena, las ruedas iguales, los tubos de acero, y las ajusta hasta obtener una máquina \
segura, rápida y fácil de producir."""

[[artistes]]
nom = "Étienne-Jules Marey"
vie = "Beaune 1830 – París 1904"
biographie = """
Étienne-Jules Marey nace en Beaune en 1830. Médico y fisiólogo, consagra su vida al \
estudio del movimiento: el de la sangre, el corazón, los músculos, la marcha y el \
vuelo. Inventa primero aparatos que registran estos movimientos en forma de curvas, \
como el esfigmógrafo, que traza el pulso. Profesor del Collège de France a partir de \
1869, descubre hacia 1878 las fotografías de caballos al galope de Eadweard Muybridge \
y se vuelve hacia la fotografía. En 1882 inventa un fusil fotográfico que toma doce \
imágenes por segundo, y luego perfecciona la cronofotografía sobre placa fija y sobre \
película, en la Estación Fisiológica que funda cerca del Bosque de Bolonia. \
Corredores, saltadores, soldados, ciclistas, caballos y pájaros desfilan ante sus \
objetivos. Sus trabajos preparan la invención del cine e inspiran a los pintores del \
movimiento. Muere en París en 1904."""
style = """
Imágenes de sabio, hechas para medir: fondo negro, modelos vestidos de blanco o \
marcados con bandas claras, imágenes sucesivas tomadas a intervalos regulares en una \
misma placa. Su belleza nace de ese rigor."""

[[artistes]]
nom = "Jean Béraud"
vie = "San Petersburgo 1849 – París 1935"
biographie = """
Jean Béraud nace en 1849 en San Petersburgo, donde su padre, escultor, trabaja en las \
obras de una catedral. Su familia se instala después en París. Comienza estudios de \
derecho, interrumpidos por la guerra de 1870, y luego entra en el taller del \
retratista Léon Bonnat. A partir de la década de 1870 expone en el Salón escenas de la \
vida parisina que le dan reputación: bulevares animados, terrazas de café, salidas de \
teatro, bailes, iglesias, bastidores de la Ópera, paseos del Bosque de Bolonia. Pinta \
con la misma atención a las elegantes, las obreras, los cocheros y los vendedores \
ambulantes, y se convierte en el cronista más fiel del París de finales del siglo XIX \
y de la Belle Époque. Miembro fundador de la Société nationale des beaux-arts en \
1890, es conocido también por algunos grandes cuadros religiosos trasladados al París \
de su tiempo. Muere en París en 1935."""
style = """
Una pintura precisa y viva, que compone pequeñas comedias urbanas con una multitud de \
personajes esbozados del natural. Béraud observa los trajes, las actitudes y los \
objetos nuevos, como la bicicleta, con ojo de cronista."""

[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi 1864 – Saint-André-du-Bois 1901"
biographie = """
Henri de Toulouse-Lautrec nace en 1864 en Albi, en una antigua familia aristocrática. \
Frágil, se rompe las dos piernas en la adolescencia, que dejan de crecer. Se consagra \
a la pintura, estudia en París en los talleres de Bonnat y de Cormon, y se instala en \
Montmartre. Allí pinta los bailes, los cafés cantantes, los circos y los burdeles, y \
retrata a sus amigos y a las estrellas de su tiempo, Aristide Bruant, Jane Avril o \
Yvette Guilbert. A partir de 1891, con el cartel del Moulin Rouge, renueva el arte \
del cartel y de la litografía en color. Apasionado del deporte, frecuenta los \
velódromos con su amigo Tristan Bernard y dibuja a los campeones ciclistas. Agotado \
por el alcohol, es atendido en una clínica en 1899 y muere en 1901 en el castillo de \
Malromé, cerca de Burdeos, a los treinta y seis años. Su madre dona buena parte de su \
obra a la ciudad de Albi."""
style = """
Un dibujo nervioso que capta la actitud y el carácter en unos pocos trazos, grandes \
planos de color venidos de las estampas japonesas, encuadres audaces que cortan las \
figuras, y el «crachis» proyectado con cepillo sobre la piedra."""

[[artistes]]
nom = "Alfons Mucha"
vie = "Ivančice 1860 – Praga 1939"
biographie = """
Alfons Mucha nace en 1860 en Ivančice, en Moravia. Tras unos comienzos como pintor de \
decorados de teatro en Viena, estudia en Múnich y se instala en París en 1887, donde \
vive de ilustraciones. A finales de 1894 dibuja con urgencia el cartel de Gismonda \
para Sarah Bernhardt: su éxito es inmediato, y la actriz le confía sus carteles \
durante seis años. Bajo contrato con el impresor F. Champenois, dibuja carteles \
publicitarios para galletas, champán, papel de fumar o bicicletas, calendarios y \
paneles decorativos, así como joyas para Georges Fouquet. Su estilo se convierte en \
uno de los símbolos del Art Nouveau. De regreso en Bohemia, se consagra a partir de \
1910 a la Epopeya eslava, veinte inmensos lienzos sobre la historia de los pueblos \
eslavos, y dibuja los primeros sellos y billetes de Checoslovaquia. Detenido por la \
Gestapo en 1939, muere en Praga poco después."""
style = """
Jóvenes de cabelleras ondulantes, contornos negros marcados, colores suaves en \
planos, volutas y círculos decorativos: el «estilo Mucha» hace de cada cartel un \
objeto de arte."""
