[exposition]
ordre = 168
nom_court = "Bicicletas"
mouvement = "La bicicleta, de la draisiana a la Belle Époque"
cadre = "vitrine"
couleur = "#2e6b7a"
titre = "La reina pequeña, un siglo de bicicleta"
artiste = "Drais, Michaux, Starley, Marey, Béraud, Toulouse-Lautrec, Mucha…"
dates = "hacia 1820 – 1902"
accroche = "Exposición virtual · Museo de Arte e Industria, Saint-Étienne"
introduction = """
En 1817, un barón de Baden se monta en una máquina de madera de dos ruedas y la \
impulsa con los pies: es la draisiana. Medio siglo después, unos pedales fijados a la \
rueda delantera dan origen al velocípedo; luego la rueda crece hasta superar la \
altura de un hombre: es el biciclo. En la década de 1880, la cadena y dos ruedas casi \
iguales dan por fin la bicicleta de seguridad, que conquista las ciudades, a las \
mujeres y los velódromos. La visita sigue diez etapas de esta historia, desde las \
propias máquinas hasta las imágenes que inspiraron: la cronofotografía de Marey, el \
Bosque de Bolonia de Jean Béraud, los carteles de Toulouse-Lautrec y de Mucha. El \
edificio se inspira en el Museo de Arte e Industria de Saint-Étienne, la ciudad del \
ciclo, cuyas máquinas antiguas reposan bajo bóvedas de ladrillo y piedra."""
vitrine = "chaine-simpson.jpg"

[musee]
nom = "Museo de Arte e Industria"
ville = "Saint-Étienne, Francia"
architecte = "Étienne Boisson (palacio de las Artes)"
construction = "a partir de 1846"
presentation = """
En 1833, el ayuntamiento de Saint-Étienne crea un fondo destinado a un futuro museo, \
sin darle todavía muros. A partir de 1846, el arquitecto Étienne Boisson levanta un \
edificio previsto para la subprefectura; se convierte en el palacio de las Artes, que \
alberga el museo y la biblioteca municipal. En 1851, la ciudad compra buena parte de \
la colección de armas del mariscal Oudinot. En 1889 nace el Museo de Arte e Industria, \
que reúne las bellas artes y las artes industriales; Marius Vachon es su primer \
conservador. El museo presenta hoy las tres industrias que hicieron la ciudad: las \
armas, las cintas y los ciclos. Según el museo, la primera bicicleta francesa se \
fabricó en Saint-Étienne en 1886. Su colección de ciclos se formó sobre todo después \
de la Segunda Guerra Mundial, gracias a las donaciones de la cámara sindical del ciclo \
de Saint-Étienne y de la Manufacture française d'armes et cycles, la futura \
Manufrance, y a las compras del conservador Maurice Allemand, que soñaba con un museo \
nacional del ciclo."""
ici = """
El edificio de ARTEON conserva del museo de Saint-Étienne sus salas bajas de paredes \
de piedra rubia y de ladrillo, donde las máquinas antiguas se alinean como en un \
taller. Se entra por el sur en la sala de los pioneros, color piedra, donde esperan \
la draisiana y el velocípedo. Siguen, de oeste a este, la sala del velocípedo y del \
biciclo, más alta por sus ruedas gigantes, y luego la de la bicicleta de seguridad, \
de paredes de ladrillo claro. La sala de la carrera y de la Belle Époque, más amplia, \
reúne la ciencia y la pintura; la visita termina en el gabinete de los carteles, como \
en una valla parisina de 1900."""

