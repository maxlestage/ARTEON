[[oeuvres]]
titre = "Bicicleta de seguridad Rover"
artiste = "John Kemp Starley"
annee = "1885"
image = "rover.jpg"
credit = "Photo : Jonathan Cardy"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Rover_safety_bicycle_of_1885_(right).jpg"
technique = "Acero, caucho, cuero"
collection = "Science Museum, Londres"
note = "Dos ruedas casi iguales, una cadena que mueve la rueda trasera, el ciclista sentado entre las ruedas: con el Rover, la bicicleta adopta la forma que aún tiene hoy."
description = """
La bicicleta está suspendida del techo por finos cables, y se ve desde abajo. Sus dos \
ruedas, de radios de acero y bandajes de caucho macizo, tienen casi el mismo tamaño. \
El cuadro aún no tiene forma de rombo: dos tubos curvos parten de la pipa de la \
horquilla, uno hacia el sillín y otro descendiendo hacia el pedalier, como un cuello \
de cisne. En el centro, un plato dentado lleva las manivelas y los pedales; una \
cadena lo une al piñón de la rueda trasera. El sillín de cuero está colocado sobre un \
muelle encima de la rueda trasera. Delante, el manillar curvado termina en \
empuñaduras claras."""
evocation = """
El Rover hace honor a su nombre de «bicicleta de seguridad». Sentado abajo, entre dos \
ruedas de tamaño razonable, el ciclista pone el pie en tierra cuando quiere y ya no \
corre el riesgo de ser proyectado hacia delante. La cadena permite hacer girar la \
rueda trasera más deprisa que los pedales: se conserva la velocidad del biciclo sin \
tener su altura. Ahora todo el mundo puede montar en bicicleta: las mujeres, los \
niños, los obreros que van a la fábrica, los carteros, los soldados. En una decena de \
años, la bicicleta de seguridad hace desaparecer el biciclo y se convierte en uno de \
los objetos más extendidos del mundo."""
histoire = """
John Kemp Starley, sobrino de James Starley, el «padre de la industria del ciclo» de \
Coventry, presenta su Rover en 1885. Otros constructores habían probado ya la \
transmisión por cadena, pero el Rover se impone por su sencillez y sus prestaciones, \
y sus modelos sucesivos fijan la arquitectura de la bicicleta: dos ruedas próximas, \
la cadena hacia la rueda trasera y después un cuadro en rombo. En 1888, el escocés \
John Boyd Dunlop patenta el neumático, que completa la revolución. La empresa de \
Starley tomará más tarde el nombre de Rover y fabricará automóviles. El Science \
Museum de Londres conserva este Rover de 1885 en sus colecciones de transporte."""
facture = """
El Rover reúne técnicas nacidas en los talleres de Coventry: tubos de acero huecos, \
rodamientos de bolas, radios de acero tensos. La novedad es la transmisión: una \
cadena de rodillos une un gran plato a un pequeño piñón fijado en la rueda trasera. \
La relación entre sus dientes sustituye al tamaño de la rueda: un piñón pequeño hace \
recorrer con cada vuelta de pedal tanto camino como una inmensa rueda de biciclo. El \
cuadro de este primer modelo, hecho de tubos curvados, es aún flexible; sus sucesores \
adoptarán el cuadro en rombo, más rígido, que se encuentra en casi todas las \
bicicletas actuales."""
details = [
  "La cadena que une el plato con el piñón de la rueda trasera.",
  "Los dos tubos curvos del cuadro, en cuello de cisne.",
  "Las dos ruedas casi iguales, con bandajes de caucho macizo.",
  "El sillín de cuero sobre su muelle, encima de la rueda trasera.",
  "El manillar curvado de empuñaduras claras.",
]
themes = ["bicicleta", "cadena", "seguridad", "coventry", "invento"]
anecdote = """
En polaco, la bicicleta se dice «rower»: el nombre de la máquina de Starley se ha \
convertido en una palabra de la lengua."""
