[[oeuvres]]
titre = "La cadena Simpson"
artiste = "Henri de Toulouse-Lautrec"
annee = "1896"
image = "chaine-simpson.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:La_cha%C3%AEne_Simpson_-_DPLA_-_d3a83b8b004f27d56e503fd8835955a3.jpg"
technique = "Litografía en color (cartel), aproximadamente 83 × 120 cm, impresa por Chaix, París"
collection = "Boston Public Library (colección Albert H. Wiggin)"
note = "Toulouse-Lautrec, apasionado de las carreras ciclistas, pinta al corredor Constant Huret inclinado sobre su máquina para promocionar una nueva cadena de bicicleta."
description = """
El título, en grandes letras rojas, cruza toda la parte alta del cartel. En primer \
plano, un corredor rubio con maillot azul, la mandíbula apretada, se inclina sobre una \
bicicleta de pista de la que se ve el gran plato dentado. A la derecha, otros dos \
corredores de azul pedalean en un tándem, cortados por el borde del cartel. La pista \
es una ancha banda amarilla. Al fondo, dos hombres con bombín miran la carrera, junto \
a una pequeña orquesta de rojo, y una larga máquina montada por una fila de corredores \
pasa en el horizonte. Abajo a la izquierda, en rojo, la dirección del representante: \
«L. B. Spoke, director para Francia, 25, boulevard Haussmann»."""
evocation = """
En la década de 1890, las carreras ciclistas apasionan a París tanto como el teatro, y \
los velódromos atraen a multitudes. Los campeones corren tras máquinas de varias \
plazas, que los protegen del viento e imponen un ritmo infernal: son las largas \
máquinas visibles en el horizonte. Toulouse-Lautrec frecuenta estos velódromos con su \
amigo Tristan Bernard, entonces director de velódromo. Capta el esfuerzo del corredor, \
su nuca tensa, sus antebrazos duros, con la misma agudeza que a las bailarinas del \
Moulin Rouge. El cartel muestra la bicicleta como el gran espectáculo moderno de la \
Belle Époque."""
histoire = """
El londinense William Spears Simpson había inventado una cadena de palanca que debía \
hacer el pedaleo más eficaz. Su representante en Francia, Louis Bouglé, amigo de \
Toulouse-Lautrec, que firmaba sus artículos con el seudónimo inglés de «Spoke», el \
radio, le encarga un cartel en 1896. Una primera versión, Cycle Michael, es rechazada: \
el dibujo de la máquina se consideraba inexacto. Lautrec realiza una segunda, en la \
que el campeón Constant Huret corre con la cadena Simpson. El Art Institute of \
Chicago, que conserva también este cartel, subraya que esta versión es más dinámica y \
representa las bicicletas con más realismo."""
facture = """
Lautrec dibuja directamente sobre la piedra litográfica, con pincel y lápiz, y luego \
proyecta tinta con un cepillo para obtener las finas salpicaduras del «crachis», \
visibles en la pista y en las ropas. El cartel emplea solo tres tintas, azul, rojo y \
amarillo, aplicadas en grandes planos sin modelado, a la manera de las estampas \
japonesas que admiraba. El encuadre corta a los corredores de la derecha y coloca la \
pista en diagonal, lo que da la impresión de una carrera que pasa ante nosotros. El \
monograma del artista y la fecha, 96, figuran abajo a la derecha."""
details = [
  "El gran plato dentado de la bicicleta del corredor rubio.",
  "Los dos corredores de la derecha en su tándem, cortados por el borde.",
  "La fila de corredores sobre una larga máquina, en el horizonte.",
  "Los dos espectadores con bombín, al fondo de la pista.",
  "El monograma de Lautrec y la fecha 96, abajo a la derecha.",
]
themes = ["cartel", "carrera", "velódromo", "litografía", "toulouse-lautrec"]
anecdote = """
El apodo de Louis Bouglé, «Spoke», significa «radio de rueda» en inglés: un nombre \
hecho a medida para un hombre de la bicicleta."""
