[[oeuvres]]
titre = "Cycles Perfecta"
artiste = "Alfons Mucha"
annee = "1902"
image = "cycles-perfecta.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Alfons_Mucha_-_Cycles_Perfecta,_1902.jpg"
technique = "Litografía en color (cartel), impresa por F. Champenois, París"
collection = "Fundación Mucha, Praga (un ejemplar)"
note = "Una joven de cabellos sueltos se apoya en el manillar de su bicicleta: Mucha asocia la máquina a la libertad y a la velocidad, sin mostrar el camino."
description = """
Bajo una cartela blanca en la que se inscriben en letras rojas las palabras «Cycles \
Perfecta», una joven se inclina hacia nosotros, con los antebrazos cruzados sobre el \
manillar de una bicicleta de la que solo se ve la parte alta del cuadro y un trozo de \
rueda. Tiene la piel clara, las mejillas rosadas y una leve sonrisa. Su larga cabellera \
pelirroja se agita en todos los sentidos, en mechones ondulados que invaden todo el \
fondo azul verdoso. Su vestido rojo anaranjado resbala del hombro y deja ver una blusa \
blanca con volantes; un gran lazo rojo flota en su cintura. Abajo a la derecha, la \
firma de Mucha; abajo, el nombre del impresor Champenois."""
evocation = """
Mucha no muestra ni el camino, ni el paisaje, ni siquiera la bicicleta entera. Todo \
el movimiento está en la cabellera, que el viento levanta como si la joven acabara de \
bajar una cuesta a toda velocidad. La bicicleta se convierte aquí en una promesa de \
libertad, y su público es femenino: en la Belle Époque, permite a las mujeres salir \
solas, viajar, hacer deporte. El cartel no ensalza las cualidades técnicas de la \
máquina, sino la sensación que procura. La seducción del dibujo, típica del Art \
Nouveau, hace del objeto industrial un objeto de ensueño."""
histoire = """
Alfons Mucha, nacido en Moravia en 1860, se instala en París en 1887. En 1894, su \
cartel para Sarah Bernhardt en Gismonda lo hace célebre de la noche a la mañana, y \
dibuja después carteles, calendarios y paneles decorativos para numerosas marcas. Su \
estilo, hecho de jóvenes de cabelleras ondulantes, de curvas y de colores suaves, se \
convierte para el público en el «estilo Mucha», una de las imágenes mismas del Art \
Nouveau. El cartel para los ciclos Perfecta data de 1902. Fue impreso en F. \
Champenois, el impresor parisino con el que Mucha trabajaba bajo contrato."""
facture = """
Como en sus otros carteles, Mucha construye la imagen sobre un dibujo de contorno \
negro marcado, que la litografía llena después de colores aplicados en planos \
ligeramente degradados. Los cabellos están tratados como un ornamento: sus mechones \
se enroscan en volutas que llenan todo el espacio, hasta el borde del marco. La \
cartela del título, arriba, está separada de la imagen por una simple orla, y la \
rotulación, dibujada por el artista, forma parte de la composición. La paleta, \
dominada por los rojizos, los rojos y un azul verdoso apagado, une a la mujer, el \
vestido y la máquina en una misma armonía cálida."""
details = [
  "La cabellera pelirroja cuyos mechones llenan todo el fondo.",
  "Los antebrazos cruzados sobre el manillar, de empuñaduras claras.",
  "El gran lazo rojo que flota en la cintura.",
  "El trozo de rueda, abajo a la izquierda, único recuerdo de la máquina.",
  "La firma de Mucha, abajo a la derecha.",
]
themes = ["cartel", "art nouveau", "mujeres", "libertad", "mucha"]
anecdote = """
La marca Perfecta está hoy olvidada, pero su cartel se ha convertido en una de las \
imágenes más reproducidas de Mucha."""
