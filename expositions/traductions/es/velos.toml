[[oeuvres]]
titre = "Draisiana (Laufmaschine)"
artiste = "D'après Karl von Drais"
annee = "hacia 1820"
image = "draisienne.jpg"
credit = "Photo : Daderot"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Draisine_or_Laufmaschine,_c._1820_-_Kurpf%C3%A4lzisches_Museum_der_Stadt_Heidelberg_-_Heidelberg,_Germany_-_DSC01526.jpg"
technique = "Madera de cerezo y de conífera pintadas, hierro, cuero acolchado"
collection = "Kurpfälzisches Museum, Heidelberg (inv. GH 98)"
note = "La «máquina de correr» del barón Drais: uno se sienta a horcajadas y avanza empujando el suelo con los pies. Es la antepasada de todas las bicicletas."
description = """
Una viga de madera pintada de amarillo, ribeteada de filetes negros, une dos ruedas \
del mismo tamaño, de radios de madera y llanta con aro de hierro. En medio, un sillín \
de cuero acolchado, colocado muy bajo, permite al conductor tocar el suelo con los dos \
pies. Delante, un pequeño apoyo acolchado, montado sobre un montante, servía para \
descansar los brazos y empujar con el vientre. La rueda delantera está sujeta por una \
horquilla que pivota: un largo timón de madera, rematado por una empuñadura curva, \
permite dirigirla. Un tornillo de hierro, delante, regula el conjunto. No hay pedal, \
ni cadena, ni freno visible: solo madera, hierro y cuero, ensamblados por un \
carretero."""
evocation = """
La draisiana descansa en una idea que parecía una locura: mantenerse en equilibrio \
sobre dos ruedas alineadas. Hasta entonces, un vehículo tenía tres o cuatro ruedas, y \
se viajaba a pie o a caballo. Karl von Drais demuestra que, avanzando con suficiente \
rapidez, no se cae, y que se puede ir más deprisa que un caminante sin cansar a un \
caballo. Se ha relacionado su invento con el «año sin verano» de 1816, cuando una \
erupción volcánica en Indonesia arruinó las cosechas en Europa e hizo escasear la \
avena de los caballos; el propio Drais presentaba su máquina como sustituta del \
caballo. Por primera vez, el hombre se convertía él solo en su propio motor."""
histoire = """
Karl von Drais, funcionario forestal del gran ducado de Baden, presenta su \
Laufmaschine en 1817 en Mannheim. El 12 de junio de 1817 recorre unos 14 kilómetros \
en aproximadamente una hora, mucho más deprisa que un peatón. En abril de 1818 hace \
una demostración en París, cerca del jardín de Luxemburgo. La máquina conoce una \
breve moda en Francia, donde se la llama velocípedo o draisiana, y en Inglaterra, \
donde se convierte en el «hobby horse» de los dandis. Se fabrican en todas partes, a \
menudo según el modelo de Drais, y después la moda pasa. Este ejemplar, fechado hacia \
1820, se conserva en el Museo del Palatinado Electoral, en Heidelberg, no lejos de \
Mannheim, donde todo empezó."""
facture = """
La draisiana es más obra de carretero y de carpintero que de mecánico. La viga está \
tallada en madera de cerezo, lo bastante flexible para amortiguar los golpes, y las \
ruedas están hechas como las de los carruajes de caballos: un cubo, radios de madera y \
una llanta recubierta de un aro de hierro. El único órgano verdaderamente nuevo es el \
pivote de dirección: la rueda delantera gira en torno a un eje vertical accionado por \
el timón. Las antiguas draisianas conocidas pesan entre 17 y 23 kilos aproximadamente. \
La pintura amarilla con filetes, como la de una calesa, recuerda que estas máquinas se \
compraban como coches de lujo."""
details = [
  "El timón de madera rematado por una empuñadura curva, antepasado del manillar.",
  "El sillín de cuero acolchado, colocado muy bajo para que los pies toquen el suelo.",
  "El apoyo acolchado donde se posaban los antebrazos.",
  "Las llantas de madera con aro de hierro, como ruedas de carreta.",
  "Los filetes negros pintados sobre la madera amarilla, a la manera de un coche de lujo.",
]
themes = ["draisiana", "invento", "madera", "equilibrio", "1817"]
anecdote = """
Para bajar una cuesta, el conductor levantaba los pies y se dejaba rodar: era ya el \
placer de la rueda libre."""
salle = 1
mur = "nord"
place = 2
largeur = 2.0

[[oeuvres]]
titre = "Velocípedo de pedales"
artiste = "Michaux et Cie, puis Compagnie parisienne"
annee = "1869"
image = "velocipede-1869.jpg"
credit = "Photo : Romainbehar"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Amplepuis_-_Mus%C3%A9e_Barth%C3%A9lemy_Thimonnier_-_Salle_des_cycles_-_V%C3%A9locip%C3%A8de,_1869.jpg"
technique = "Hierro forjado, madera, cuero"
collection = "Musée Barthélemy Thimonnier, Amplepuis"
note = "Unos pedales fijados directamente al cubo de la rueda delantera: el velocípedo, nacido en París en la década de 1860, es la primera máquina que avanza sin tocar el suelo."
description = """
La máquina se ve de perfil, apoyada en un suelo de guijarros. Una larga viga de hierro \
forjado, ligeramente curva, une la rueda delantera, algo más grande, con la trasera. \
Las ruedas tienen radios de madera oscura y llantas con aro. En el centro de la rueda \
delantera, dos manivelas llevan pedales: cada vuelta de pedal hace dar una vuelta a la \
rueda. Encima, la horquilla termina en un manillar recto de empuñaduras de madera \
torneada. Delante, un reposapiés en voluta de hierro forjado permitía levantar las \
piernas en las bajadas. El sillín de cuero está colocado sobre un muelle de ballesta; \
un cordón, tendido a lo largo de la viga, acciona un freno que roza la rueda \
trasera."""
evocation = """
Con el velocípedo, el ciclista deja por fin el suelo: sus pies ya no empujan la \
tierra, giran. Hay que aprender a mantener el equilibrio rodando, y se abren \
picaderos cubiertos para ejercitarse. Sobre los adoquines y los caminos empedrados, \
las ruedas de madera con aro de hierro transmiten cada golpe, y los ingleses apodan a \
la máquina «boneshaker», la sacudehuesos. Pero el velocípedo se pone pronto de moda: \
se organizan carreras, se publican periódicos, y la Francia de los últimos años del \
Segundo Imperio se apasiona por este caballo de hierro que no come avena."""
histoire = """
Según la tradición, hacia 1861, en el taller parisino del cerrajero Pierre Michaux y \
de su hijo Ernest, se fijan por primera vez pedales a la rueda delantera de una \
draisiana. La empresa Michaux crece con rapidez a finales de la década de 1860 y se \
convierte en 1869 en la Compagnie parisienne, a la que pertenece esta máquina fechada \
en 1869. Ese mismo año se disputa la primera gran carrera en carretera de ciudad a \
ciudad, de París a Ruan. La guerra de 1870 corta bruscamente el auge de la industria \
francesa, y es en Inglaterra donde la máquina sigue evolucionando. El museo de \
Amplepuis, en el Ródano, lleva el nombre de Barthélemy Thimonnier, el inventor de la \
máquina de coser."""
facture = """
El velocípedo sale del taller del herrero: la viga en serpentín, hecha primero de una \
pieza de fundición, es aquí de hierro forjado, más resistente. Las ruedas siguen \
fabricándose como las de los carruajes, con radios y llantas de madera. El pedalier \
es solo un eje acodado que atraviesa el cubo de la rueda delantera: sin cadena, sin \
desmultiplicación. Cuanto mayor es la rueda, más se avanza con cada vuelta de pedal, \
y por eso la rueda delantera crecerá pronto. El freno, accionado por un cordón que se \
tensa al girar el manillar, aprieta una zapata contra la rueda trasera."""
details = [
  "Los pedales montados en el cubo de la rueda delantera.",
  "El reposapiés en voluta de hierro forjado, delante.",
  "El sillín de cuero colocado sobre un largo muelle de ballesta.",
  "El cordón del freno, tendido a lo largo de la viga.",
  "Las empuñaduras de madera torneada en el extremo del manillar.",
]
themes = ["velocípedo", "pedal", "michaux", "parís", "segundo imperio"]
anecdote = """
El apodo inglés de «sacudehuesos» dice bastante de la comodidad de la máquina: habrá \
que esperar al neumático, a finales de la década de 1880, para rodar con suavidad."""
salle = 1
mur = "ouest"
place = 1
largeur = 1.9

[[oeuvres]]
titre = "Biciclo"
artiste = "Fabricants de cycles anonymes"
annee = "finales del siglo XIX"
image = "grand-bi.jpg"
credit = "Photo : Hélène Rival"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Cycle_06.jpg"
technique = "Acero, caucho, cuero, madera"
collection = "Musée d'Art et d'Industrie, Saint-Étienne"
note = "Una rueda delantera inmensa y una pequeña rueda trasera: el biciclo, máquina rápida y arriesgada de los deportistas de las décadas de 1870 y 1880, presentado aquí en las salas del museo de Saint-Étienne."
description = """
Contra un muro de grandes piedras rubias, la máquina se alza de tres cuartos. La \
rueda delantera, muy alta, está hecha de una fina llanta de acero y de decenas de \
radios metálicos tensos como cuerdas. En el centro, el cubo lleva una manivela y un \
pedal de metal. Sobre la rueda, la horquilla enlaza con un manillar de brazos \
curvados hacia abajo, rematados por empuñaduras de madera en forma de pera. El sillín \
de cuero está colocado casi en lo alto de la rueda. Detrás, un tubo de acero curvo, la \
espina dorsal, abraza la rueda delantera y desciende hasta una diminuta rueda \
trasera, que parece servir solo para mantener el conjunto en pie."""
evocation = """
El biciclo es la máquina de una juventud deportiva y audaz. Encaramado a casi metro y \
medio de altura, el ciclista domina a los transeúntes y va más rápido que cualquier \
velocípedo. Pero la menor piedra, el menor frenazo pueden proyectarlo de cabeza por \
encima del manillar: la caída tiene incluso un nombre en inglés, «taking a header». \
El biciclo es, pues, sobre todo cosa de jóvenes ágiles, que forman clubes, llevan \
uniformes y corren en pista. Las mujeres, los niños y las personas prudentes esperan \
una máquina más segura; el biciclo sigue siendo la imagen misma del ciclismo heroico \
del siglo XIX."""
histoire = """
Tras la guerra de 1870, la industria del velocípedo se desarrolla sobre todo en \
Inglaterra, en Coventry. Para ir más deprisa sin cadena, se agranda la rueda motriz: \
una vuelta de pedal hace recorrer a la máquina la circunferencia de la rueda \
delantera. Hacia 1870, James Starley y William Hillman lanzan el Ariel, una máquina \
enteramente metálica de ruedas de radios tensos, y el biciclo se impone durante unos \
quince años. En Francia se le llama grand-bi, en Inglaterra «ordinary» y luego \
«penny-farthing», por dos monedas de tamaños muy distintos. Este modelo pertenece al \
departamento de ciclos del Museo de Arte e Industria, cuya colección se formó sobre \
todo después de 1945."""
facture = """
El biciclo es una obra maestra de ligereza. La rueda delantera ya no tiene radios de \
madera, sino finos radios de acero tensos entre el cubo y la llanta: la rueda ya no \
se apoya en los radios de abajo, sino que está suspendida de los de arriba, como \
nuestras ruedas actuales. El cuadro está hecho de un tubo de acero hueco, más ligero \
que el hierro macizo. Las llantas reciben un bandaje de caucho macizo, que amortigua \
un poco los golpes. El diámetro de la rueda delantera se elegía según la longitud de \
las piernas del ciclista, que debía alcanzar los pedales: cada máquina estaba, en \
cierto modo, hecha a medida."""
details = [
  "Las decenas de radios de acero tensos de la gran rueda.",
  "Las empuñaduras de madera en forma de pera en el extremo del manillar.",
  "El sillín de cuero colocado casi en lo alto de la rueda.",
  "El tubo curvo de la espina dorsal que abraza la rueda.",
  "La diminuta rueda trasera, casi un contrapeso.",
]
themes = ["biciclo", "velocidad", "acero", "deporte", "saint-étienne"]
anecdote = """
El nombre inglés «penny-farthing» compara las dos ruedas con un penique, gran moneda \
de bronce, y con un farthing, que valía la cuarta parte de un penique y era mucho más \
pequeño."""
salle = 2
mur = "nord"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Velocípedo Michaux"
artiste = "Michaux et Cie, puis Compagnie parisienne"
annee = "1869"
image = "velocipede-michaux.jpg"
credit = "Photo : Hélène Rival"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Cycle_21.jpg"
technique = "Hierro forjado, madera, cuero"
collection = "Musée d'Art et d'Industrie, Saint-Étienne"
note = "La parte alta de un velocípedo Michaux de 1869, vista de cerca en las salas abovedadas del museo de Saint-Étienne: manillar, reposapiés en voluta y sillín sobre muelle."
description = """
La fotografía se acerca a la parte alta de la máquina, ante un muro de piedras y \
ladrillos y una puerta en arco. El manillar, una barra de hierro recta, termina en \
dos largas empuñaduras de madera oscura; está fijado mediante una tuerca en lo alto \
de una columna de dirección torneada, adornada con finos anillos. Más abajo, un \
reposapiés de hierro forjado se enrolla en una gran voluta, como la cabeza de un \
violín. Detrás, el sillín de cuero rojizo está colocado sobre un largo muelle de \
ballesta sujeto con tuercas de mariposa. Abajo se adivina la llanta de madera de la \
rueda delantera y, a la derecha, la pequeña rueda trasera."""
evocation = """
Vista de cerca, la máquina revela su origen: es un objeto de herrero y de cerrajero, \
más próximo a una verja de jardín o a una barandilla de escalera que a una bicicleta \
moderna. La voluta del reposapiés, inútil para avanzar, dice el gusto por el adorno de \
una época que quería que las máquinas fueran bellas. El manillar ancho, de \
empuñaduras de madera, recuerda las varas de un pequeño carruaje. En Saint-Étienne, \
ciudad de armeros y de herreros, este velocípedo parisino evoca los comienzos de una \
industria que se convertirá, a finales de siglo, en uno de los orgullos de la ciudad."""
histoire = """
Según la tradición, el cerrajero parisino Pierre Michaux y su hijo Ernest fijaron \
hacia 1861 pedales a la rueda delantera de una draisiana. El taller se convierte en \
una verdadera empresa a finales de la década de 1860, y allí se fabrican entonces \
cientos de máquinas, antes de la creación de la Compagnie parisienne en 1869. Este \
velocípedo, fechado en 1869, pertenece al departamento de ciclos del Museo de Arte e \
Industria de Saint-Étienne, que conserva dos velocípedos Michaux entre las piezas \
maestras de su colección. La colección de ciclos del museo se constituyó sobre todo \
después de la Segunda Guerra Mundial, gracias a los industriales de Saint-Étienne."""
facture = """
Todo aquí está trabajado a la fragua. La columna de dirección está torneada y \
decorada con anillos, el manillar es una barra de hierro curvada en los extremos, y \
el reposapiés está martilleado y enrollado en caliente, como una forja artística. El \
sillín no está colocado directamente sobre el cuadro: descansa sobre un largo muelle \
de acero que corre hasta la parte trasera de la máquina y amortigua un poco los \
golpes de las ruedas de madera con aro de hierro. Unas tuercas de mariposa, que se \
aflojan a mano, permiten adelantar o retrasar el sillín según la talla del ciclista."""
details = [
  "Las largas empuñaduras de madera oscura del manillar.",
  "El reposapiés de hierro forjado enrollado en voluta.",
  "El sillín de cuero rojizo colocado sobre su muelle de ballesta.",
  "Las tuercas de mariposa que sirven para regular el sillín.",
  "La puerta en arco y los ladrillos del muro, detrás de la máquina.",
]
themes = ["velocípedo", "michaux", "hierro forjado", "saint-étienne", "ornamento"]
anecdote = """
En las bajadas, el ciclista apoyaba los pies en la voluta delantera y dejaba que los \
pedales giraran solos: la rueda delantera, sin rueda libre, los arrastraba sin \
cesar."""
