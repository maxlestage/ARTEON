[[oeuvres]]
titre = "Tapiz del Apocalipsis: san Miguel combate al dragón"
artiste = "Jean de Bruges et Nicolas Bataille"
annee = "hacia 1375–1382"
image = "apocalypse-saint-michel.jpg"
cadre = "aucun"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hennequin_de_Bruges_-_Saint_Michael_fighting_the_Dragon_-_WGA24178.jpg"
technique = "Tapiz de lana, una escena de la tercera pieza del tapiz"
collection = "Castillo de Angers, Angers"
note = "San Miguel y sus ángeles atraviesan con sus lanzas al dragón de siete cabezas, bajo la mirada de san Juan: una escena del mayor tapiz medieval conservado."
description = """
Sobre un fondo azul noche sembrado de motivos en rombo, la escena se desarrolla en diagonal. Arriba, san Miguel, con túnica dorada y grandes alas rojas, se lanza desde el cielo con sus ángeles; todos empuñan largas lanzas. Abajo, sobre un suelo verdeante, el gran dragón rojo de siete cabezas se retuerce bajo los golpes, mientras un segundo monstruo alado, más pequeño, se alza hacia los asaltantes. A la izquierda, en un pequeño edículo gótico, san Juan, vestido de rojo, observa la visión, con una mano contra el rostro. Arriba a la derecha, nubes blancas y rizadas bordean el cielo. Al pie de la escena corre una franja de tierra sembrada de flores."""
evocation = """
El capítulo 12 del Apocalipsis narra la guerra en el cielo: Miguel y sus ángeles combaten al dragón, la antigua serpiente, y lo precipitan a la tierra. Aquí no hay héroe solitario: es un ejército celestial el que golpea con un mismo ímpetu, y las lanzas paralelas dan ritmo a la composición como una carga de caballería. Para los contemporáneos, la escena tenía un eco concreto: el tapiz se tejió en plena guerra de los Cien Años, para Luis de Anjou, hermano del rey Carlos V, y se ha podido leer en él la esperanza de una victoria del bien sobre los desórdenes de la época. San Juan, testigo apartado, recuerda que todo esto es una visión, para meditar más que para temer."""
histoire = """
Luis I, duque de Anjou, encarga este inmenso tapiz hacia 1375. Los cartones los dibuja Jean de Bruges, pintor de su hermano el rey Carlos V, que presta para la ocasión un manuscrito iluminado del Apocalipsis de su biblioteca. El tejido se confía al mercader parisino Nicolas Bataille. El conjunto constaba de seis piezas de unos seis metros de altura, con una longitud total de unos 140 metros. Legado a la catedral de Angers a finales del siglo XV, el tapiz se despliega allí en las grandes fiestas. Abandonado a finales del siglo XVIII, cortado y en parte perdido, se recupera y se restaura en el siglo XIX. Desde 1954 se presenta en el castillo de Angers, en una galería construida para él: se conservan más de cien metros."""
facture = """
El tapiz está tejido en lana, en una gama de colores restringida: azules y rojos profundos para los fondos, que alternan de una escena a otra, blanco, ocre, verde. El dibujo de Jean de Bruges, nervioso y elegante, se reconoce por los rostros finos y los ropajes flexibles, próximos a la iluminación parisina de su tiempo. Los tejedores tradujeron este dibujo en superficies de color y en rayados que dan el modelado. Hecho notable, el reverso del tapiz está casi tan cuidado como el anverso; protegido durante mucho tiempo de la luz, ha conservado unos colores mucho más vivos."""
details = [
  "San Juan que observa la escena desde su pequeño edículo, a la izquierda.",
  "Las siete cabezas del dragón, reunidas en ramillete a la derecha, bajo las puntas de las lanzas.",
  "El segundo monstruo alado, más pequeño, que se alza hacia los ángeles.",
  "Las nubes blancas y rizadas que bordean el cielo, arriba a la derecha.",
  "Las alas rojas de san Miguel, en el centro de la refriega.",
]
themes = ["apocalipsis", "ángeles", "dragón", "combate", "tapiz"]
anecdote = """
Según una tradición recogida en el siglo XIX, trozos del tapiz sirvieron, tras la Revolución, para cubrir caballos, proteger árboles de la helada o tapar ventanas. El detalle es incierto, pero la pérdida de varias escenas es muy real."""
