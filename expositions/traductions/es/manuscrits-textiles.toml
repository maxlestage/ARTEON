[[oeuvres]]
titre = "Grandes Horas de Ana de Bretaña: la reina en oración"
artiste = "Jean Bourdichon"
annee = "1503–1508"
image = "heures-anne-de-bretagne.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:BNF_-_Latin_9474_-_Jean_Bourdichon_-_Grandes_Heures_d'Anne_de_Bretagne_-_f._3r_-_Anne_de_Bretagne_entre_trois_saintes.jpg"
technique = "Pintura y oro sobre pergamino, folio 3 recto; hoja de unos 30 × 19 cm"
collection = "Biblioteca Nacional de Francia, París (Latin 9474)"
note = "La reina de Francia, arrodillada ante su libro de horas, es presentada por santa Ana, santa Úrsula y santa Elena. La hoja mide unos 30 cm de alto."
description = """
En un marco dorado, una joven está arrodillada ante un reclinatorio cubierto de terciopelo púrpura, con las manos juntas. Lleva un vestido de brocado de oro de mangas bordeadas de piel y una toca negra ribeteada de pedrería: es Ana de Bretaña, reina de Francia. Ante ella, un libro abierto, donde se adivina una diminuta pintura, evoca el propio libro de horas. Tras ella se hallan tres santas. A la izquierda, la anciana santa Ana, su patrona, con velo blanco, tiende las manos hacia ella. En el centro, santa Úrsula, coronada, posa una mano en su hombro y sostiene flechas y un estandarte sembrado de armiños. A la derecha, santa Elena, con manto de armiño, sostiene una gran cruz. A lo lejos, colinas azuladas y un castillo."""
evocation = """
El libro de horas era el libro de oración de los laicos: marcaba el ritmo del día con oraciones que debían recitarse a las horas canónicas. Este se abre con el retrato de la reina en devoción, según una fórmula corriente: la donante, presentada por santos, reza ante el libro que el lector tiene entre sus manos. La elección de las santas no es casual: Ana es su patrona; Úrsula, princesa bretona según la leyenda, lleva el estandarte del ducado; Elena, madre del emperador Constantino, es el modelo de la reina cristiana. El retrato afirma así a la vez una piedad personal, una identidad bretona y una dignidad real. El rostro liso e idealizado dice el rango más que el parecido."""
histoire = """
Ana, duquesa de Bretaña, dos veces reina de Francia por sus matrimonios con Carlos VIII y después con Luis XII, encarga este libro a Jean Bourdichon, pintor de la corte instalado en Tours. Un documento del 14 de marzo de 1508 ordena pagarle 1 050 libras tornesas por haber historiado e iluminado ricamente estas Horas. El manuscrito reúne cerca de cincuenta grandes pinturas y, en los márgenes, más de trescientas plantas pintadas del natural, con su nombre en latín y en francés. La reina muere en 1514, pocos años después de terminado el libro. Las Grandes Horas son hoy una de las joyas del departamento de Manuscritos de la Biblioteca Nacional de Francia, en la sede Richelieu."""
facture = """
Bourdichon pinta como un pintor de cuadros: sus figuras, grandes y cercanas al espectador, están modeladas con sombras suaves, a la manera italiana, y situadas ante un paisaje que se aleja en una bruma azul. Heredó de Jean Fouquet ese gusto por el volumen y la luz. Las telas se representan con un lujo de detalles: brocado del vestido realzado con finos trazos de oro, armiños, pedrería. El marco dorado, pintado en trampantojo como una moldura, convierte la miniatura en un verdadero pequeño cuadro. Los rostros lisos, de párpados pesados, son típicos de su estilo."""
details = [
  "El pequeño libro abierto sobre el reclinatorio, con su diminuta pintura: un libro dentro del libro.",
  "El estandarte sembrado de armiños, emblema de Bretaña, que sostiene santa Úrsula.",
  "Las flechas de santa Úrsula, instrumento de su martirio.",
  "El castillo encaramado en una roca, a la derecha, en la lejanía.",
  "Los reflejos de oro en el vestido de brocado de la reina.",
]
themes = ["oración", "reina", "retrato", "bretaña", "libro de horas"]
anecdote = """
En los márgenes floridos del manuscrito, Bourdichon pintó también insectos: orugas, mariposas, abejas. Se reconoce, por ejemplo, el xilocopo, la gran abeja carpintera de reflejos violetas, posado en una flor junto al texto del Evangelio de Juan."""
