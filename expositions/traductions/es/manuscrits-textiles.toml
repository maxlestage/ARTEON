[[oeuvres]]
titre = "Atlas catalán: del Atlántico al mar Rojo"
artiste = "Abraham Cresques"
annee = "1375"
image = "atlas-catalan.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:1375_Atlas_Catalan_Abraham_Cresques.jpg"
technique = "Tintas, colores y oro sobre pergamino montado en paneles de madera; dos de los cuatro paneles del mapa, de unos 65 × 50 cm cada uno"
collection = "Biblioteca Nacional de Francia, París (Espagnol 30)"
note = "La mitad oeste del más bello mapa de la Edad Media: el Atlántico, Europa, el Mediterráneo y África, donde reina el rey de Malí, Mansa Musa."
description = """
Cuatro largas hojas de pergamino, una junto a otra, forman esta mitad de mapa. A la izquierda se extiende el océano Atlántico, con una gran rosa de los vientos de puntas coloreadas y, abajo, las islas Canarias y un pequeño navío. Siguen la península Ibérica y luego el Mediterráneo, con sus islas pintadas en oro y sus costas erizadas de nombres de puertos, hasta el mar Negro. Todo está cubierto por una red de líneas rectas que se cruzan: las líneas de vientos de los marinos. Abajo, África está cortada por la cadena dorada del Atlas. Debajo, un jinete velado, sobre un camello, avanza hacia un rey negro coronado, sentado en un trono, que sostiene una pepita de oro: Mansa Musa, rey de Malí. En el extremo derecho, el mar Rojo está pintado de rojo."""
evocation = """
El Atlas catalán mezcla dos maneras de ver el mundo. Por un lado, la precisión de las cartas marinas, los portulanos, que describen las costas puerto por puerto para los navegantes. Por otro, la herencia de los mapamundis medievales, con sus reyes, sus maravillas y sus relatos. El interior de los continentes se puebla de soberanos y de caravanas, y leyendas en catalán cuentan las riquezas de cada país. El retrato de Mansa Musa, cuya peregrinación a La Meca, en 1324, había impresionado por la abundancia de su oro, dice el interés de los mercaderes de Mallorca por las rutas caravaneras del Sahara. El mapa es una enciclopedia del mundo conocido, al servicio del comercio tanto como del saber."""
histoire = """
El atlas se realizó en Mallorca, gran puerto del Mediterráneo donde trabajaba una escuela de cartógrafos, a menudo judíos. Se atribuye a Abraham Cresques, maestro de mapamundis y de brújulas al servicio del rey de Aragón, que trabajaba con su hijo Jafuda. Su fecha, 1375, se deduce del calendario que lo acompaña. Se compone de seis hojas de pergamino montadas en paneles de madera: las dos primeras llevan textos y tablas de cosmografía y de astronomía, las otras cuatro el mapa, del Atlántico a China. Poco después de su realización, entra en la biblioteca de los reyes de Francia, sin duda como regalo de la corte de Aragón. Se conserva en el departamento de Manuscritos de la Biblioteca Nacional de Francia."""
facture = """
El cartógrafo traza primero la red de líneas de vientos, con tinta negra, verde y roja según el uso de los portulanos, y luego el contorno de las costas. Los nombres de los puertos se escriben perpendicularmente a la orilla, hacia el interior de las tierras, para no recargar el mar: se leen girando alrededor del mapa, colocado plano sobre una mesa. Las ciudades se señalan con pequeños castillos rematados por banderas que indican a quién pertenecen. Las figuras y las leyendas, pintadas con oro y colores vivos, acercan el mapa a la iluminación."""
details = [
  "Mansa Musa, rey de Malí, coronado, con una pepita de oro, abajo en el centro.",
  "El mar Rojo, pintado de rojo vivo, en el borde derecho.",
  "La rosa de los vientos del Atlántico, a menudo presentada como la más antigua conocida en un mapa.",
  "El pequeño navío frente a África, abajo a la izquierda: el del mallorquín Jaume Ferrer, partido en 1346 hacia el río del Oro.",
  "Las banderas plantadas sobre las ciudades, que dicen quién las gobierna.",
]
themes = ["mapa", "mundo", "navegación", "comercio", "áfrica"]
anecdote = """
La leyenda catalana escrita junto a Mansa Musa lo presenta como el más rico y noble señor de toda la región, por la abundancia del oro que se recoge en sus tierras. Medio siglo después de su peregrinación, su fama seguía intacta."""
