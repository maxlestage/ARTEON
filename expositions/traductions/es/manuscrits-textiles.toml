[[oeuvres]]
titre = "El Tapiz de Bayeux: el cometa Halley"
artiste = "Atelier anglo-saxon"
annee = "hacia 1070"
image = "bayeux-comete.jpg"
cadre = "aucun"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_32-33_comet_Halley_Harold.jpg"
technique = "Bordado de lanas sobre tela de lino, escenas 32 y 33; altura de unos 50 cm (longitud total: casi 70 m)"
collection = "Museo del Tapiz de Bayeux, Bayeux"
note = "Un cometa cruza el cielo: unos hombres lo señalan con el dedo, mientras Harold, recién coronado rey de Inglaterra, recibe la noticia. El bordado mide unos 50 cm de alto."
description = """
La escena se lee de izquierda a derecha, como un cómic. Bajo la inscripción latina ISTI MIRANT STELLA, «estos admiran la estrella», un grupo de hombres apiñados junto a un edificio tiende el dedo hacia el cielo, por donde cruza un cometa de cola de llamas. Otro hombre, apartado, levanta también la mano. A la derecha, bajo la arcada de un palacio coronado de torrecillas y aves, el rey Harold, coronado, sentado en su trono, se inclina hacia un hombre que ha venido a hablarle. Bajo el palacio, en la orla inferior, se dibujan naves vacías, como siluetas fantasmales. Los colores son pocos, pardo, verde, azul oscuro, ocre, sobre el fondo crudo del lino."""
evocation = """
El cometa Halley pasó por el cielo de Europa en la primavera de 1066, unos meses después de la coronación de Harold Godwinson, en enero. En la Edad Media, un cometa anunciaba una conmoción: la muerte de un rey, la caída de un reino. Colocado aquí, prepara al espectador para lo que sigue, la derrota y la muerte de Harold en Hastings, en octubre. Las naves fantasma de la orla, que se leen como el anuncio de la invasión normanda o como el presentimiento del rey, muestran el talento narrativo de los autores. Realizado para los vencedores, el bordado presenta a Harold como un perjuro que traicionó su juramento a Guillermo; pero lo muestra también con cierta dignidad, lo que alimenta muchos debates."""
histoire = """
El bordado cuenta, en 58 escenas según la numeración moderna, la conquista de Inglaterra por Guillermo, duque de Normandía, desde el viaje de Harold al continente hasta la batalla de Hastings. La mayoría de los historiadores piensan que lo encargó Odón, obispo de Bayeux y hermanastro de Guillermo, y que se realizó en Inglaterra en los años posteriores a 1066. Un inventario de 1476 lo menciona en el tesoro de la catedral de Bayeux, que lo exponía ciertos días del año. Amenazado durante la Revolución, expuesto en París bajo Napoleón, puesto a salvo durante la Segunda Guerra Mundial, se presenta desde 1983 en un museo de Bayeux. En 2025, Francia y el Reino Unido anunciaron su préstamo al British Museum durante la renovación de aquel museo."""
facture = """
No es un tapiz, tejido en un telar, sino un bordado: hilos de lana teñidos se cosieron sobre una larga tela de lino, hecha de varias piezas ensambladas. Los contornos se trazan con punto de tallo, y las superficies se rellenan con punto tendido, hoy llamado punto de Bayeux: largos hilos colocados uno junto a otro, sujetos por pequeños puntos transversales. La paleta, reducida, se obtuvo con tres plantas tintóreas, la rubia, la gualda y el glasto. Los colores no buscan la verosimilitud: un caballo puede ser azul, y un rostro suele ser solo un contorno."""
details = [
  "La inscripción ISTI MIRANT STELLA, bordada en lana arriba a la izquierda.",
  "El cometa, con su núcleo redondo y su cola de llamas.",
  "Las naves fantasma, sin velas ni tripulación, en la orla inferior.",
  "Las dos aves posadas en el tejado del palacio de Harold.",
  "Los dedos tendidos de los hombres, que guían la mirada hacia el cielo.",
]
themes = ["historia", "conquista", "cometa", "presagio", "bordado"]
anecdote = """
Se ha perdido el final del bordado: la última escena conservada muestra la huida de los ingleses tras la batalla. Se ignora cómo terminaba, quizá con la coronación de Guillermo en Westminster, el día de Navidad de 1066."""
salle = 3
