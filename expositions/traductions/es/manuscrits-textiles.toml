[exposition]
ordre = 12
nom_court = "Manuscritos y tapices"
mouvement = "Manuscritos iluminados y tapices"
cadre = "estampe"
couleur = "#6a3b5c"
titre = "Manuscritos y tapices, la Edad Media en páginas y en hilos"
artiste = "Monjes de Iona, Eadfrith, Jean de Bruges, Bourdichon, Cresques…"
dates = "siglos VIII – XVI"
accroche = "Exposición virtual · Biblioteca Nacional de Francia, sede Richelieu, París"
introduction = """
Antes de la imprenta, los libros se copiaban y se pintaban a mano, página a página, y las grandes imágenes se tejían o se bordaban para vestir los muros. Esta exposición reúne diez de esos tesoros: los evangelios de Irlanda y de Northumbria, un Apocalipsis románico, una Biblia gigante, un calendario azteca, un mapamundi de 1375, un libro de horas real, el bordado de Bayeux y dos de los tapices más célebres de la Edad Media. El edificio se inspira en la sede Richelieu de la Biblioteca Nacional de Francia, en París: los manuscritos se presentan en una sala cuadrada que evoca la sala Labrouste y en una sala alta que recuerda la sala Oval, los tapices en una larga galería inspirada en la galería Mazarino."""
vitrine = "kells-chi-rho.jpg"

[musee]
nom = "Biblioteca Nacional de Francia, sede Richelieu"
ville = "París, Francia"
architecte = "François Mansart, Henri Labrouste, Jean-Louis Pascal"
construction = "siglos XVII – XX"
presentation = """
En el corazón de París, entre el Palais-Royal y la Bolsa, el cuadrilátero Richelieu reúne edificios levantados a lo largo de casi cuatro siglos. En la década de 1640, el cardenal Mazarino instala allí su palacio y sus colecciones; François Mansart le construye la galería Mazarino, cuyo techo pinta Giovanni Francesco Romanelli. A partir de 1721, la Biblioteca del Rey se establece entre estos muros. En el siglo XIX, Henri Labrouste levanta la gran sala de lectura de impresos, abierta en 1868: dieciséis finas columnas de hierro fundido sostienen nueve cúpulas, cada una con un óculo. Jean-Louis Pascal emprende después la sala Oval, terminada por Alfred Recoura y abierta en la década de 1930 bajo una inmensa montera de vidrio. Tras la marcha de los libros impresos a la sede François-Mitterrand, a finales de los años 1990, Richelieu conserva los manuscritos, los grabados, los mapas, las monedas y las medallas. Renovado por Bruno Gaudin y Virginie Brégal, reabrió en 2022 con un museo y una sala Oval abierta a todos."""
ici = """
El edificio de ARTEON reúne tres célebres espacios de Richelieu en torno a una sala central. Se entra por el sur en el vestíbulo, de muros crema, y después en la sala Labrouste, cuadrada, de dieciocho metros de lado y diez de altura, de muros marfil, donde se presentan los evangelios insulares, el Apocalipsis de Saint-Sever y la Biblia de Souvigny. Al oeste se extiende la galería Mazarino, de treinta metros de largo, reservada al bordado de Bayeux y a los tapices. Al este, la sala Oval, aquí rectangular pero de catorce metros de altura, reúne el libro de horas, el códice azteca y el Atlas catalán."""

