[[oeuvres]]
titre = "El unicornio cautivo (La caza del unicornio)"
artiste = "Ateliers des Pays-Bas du Sud"
annee = "hacia 1495–1505"
image = "licorne-captive.jpg"
cadre = "aucun"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Unicorn_in_Captivity_-_Google_Art_Project.jpg"
technique = "Lana, seda, hilos de plata y de plata dorada, 368 × 251,5 cm"
collection = "Metropolitan Museum of Art, The Cloisters, Nueva York"
note = "Última pieza de la célebre Caza del unicornio: el animal, atado a un granado, reposa en un cercado en medio de un prado florido."
description = """
Sobre un fondo verde oscuro, casi negro, un prado está cubierto de plantas dibujadas una a una: cientos de tallos y de flores rojas, blancas, amarillas y azules. En el centro, un unicornio blanco yace en un pequeño cercado circular, cerrado por una valla de madera. Lleva un collar precioso, unido por una cadena al tronco de un granado que se alza tras él, cargado de frutos. Vuelve la cabeza hacia la izquierda, con su largo cuerno torsionado erguido hacia el cielo. Sobre su pelaje blanco corren regueros rojos. En tres esquinas y en el tronco del árbol, las letras A y E, anudadas por un cordón, repiten un monograma. El tejido es tan fino que se distingue cada pétalo."""
evocation = """
Según los bestiarios de la Edad Media, el unicornio, esquivo e inasible, solo podía ser capturado por una doncella virgen: se veía en ello una imagen de la Encarnación, Cristo que viene a refugiarse en el seno de María. El unicornio encerrado, vivo tras haber sido cazado y muerto en las piezas anteriores, se ha leído como el Cristo resucitado. Pero la escena pertenece también al lenguaje del amor cortés: el amante cautivo de su dama, encadenado de buen grado en un jardín cerrado. Según una lectura a menudo propuesta, los regueros rojos no son sangre sino el jugo de granadas maduras, frutos de la fertilidad y del matrimonio. Las dos lecturas, sagrada y amorosa, no se excluyen."""
histoire = """
La Caza del unicornio consta de siete piezas, dibujadas sin duda en París y tejidas hacia 1500 en los Países Bajos del Sur. El comitente, a quien podría designar el monograma AE, sigue siendo desconocido, y las piezas quizá no pertenecían originalmente a una sola serie. Se mencionan en 1680 en un inventario de la familia La Rochefoucauld, que las conserva después en el castillo de Verteuil, en Charente. Saqueadas durante la Revolución, habrían servido para proteger cultivos de la helada antes de ser recuperadas. En 1922, John D. Rockefeller Jr. las compra; en 1937 las dona al Metropolitan Museum, que las presenta en The Cloisters, su museo de arte medieval abierto en 1938 al norte de Manhattan."""
facture = """
El tapiz está tejido en lana y seda, con hilos de plata y de plata dorada que brillaban a la luz de las velas. El fondo de millefleurs, muy en boga hacia 1500, no es un simple decorado: los botánicos han identificado en él la mayoría de las plantas, como el clavel, la orquídea o el lirio, a menudo elegidas por su sentido simbólico ligado al matrimonio y a la fertilidad. El unicornio está modelado con finos rayados de lanas claras. El cercado, visto ligeramente desde arriba, da una profundidad que el prado, sin horizonte, rehúsa."""
details = [
  "El monograma AE anudado con un cordón, en las esquinas y en el tronco.",
  "Las granadas maduras entre las ramas, sobre el unicornio.",
  "La cadena que une el collar del unicornio con el árbol.",
  "La valla baja del cercado, que el animal podría franquear sin esfuerzo.",
]
themes = ["unicornio", "amor", "cristo", "millefleurs", "jardín"]
anecdote = """
The Cloisters, donde se expone el tapiz, son a su vez un museo hecho de fragmentos: partes de claustros medievales llegados de Francia, como Saint-Michel-de-Cuxa o Saint-Guilhem-le-Désert, se volvieron a montar allí en la década de 1930."""
