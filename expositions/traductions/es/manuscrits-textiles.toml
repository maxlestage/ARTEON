[[oeuvres]]
titre = "Libro de Kells: el monograma de Cristo"
artiste = "Moines d'Iona et de Kells"
annee = "hacia 800"
image = "kells-chi-rho.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:KellsFol034rChiRhoMonogram.jpg"
technique = "Tintas y pigmentos sobre vitela, folio 34 recto; hoja de unos 33 × 25 cm"
collection = "Trinity College, Dublín"
note = "La página más célebre del Libro de Kells: las iniciales griegas del nombre de Cristo invaden toda la hoja, que mide unos 33 cm de alto."
description = """
La página está casi enteramente ocupada por tres letras gigantes. Una inmensa X, la ji griega, parte de la esquina superior izquierda, con sus brazos curvados como hojas de espada. Bajo ella se alza la P, la ro, y una I más discreta, apenas reconocible: juntas forman XPI, la abreviatura del nombre de Cristo. Cada centímetro está cubierto de espirales, trenzas, discos y entrelazados, en amarillo, púrpura, verde y rojo. Abajo a la derecha, en letras más pequeñas, se lee h generatio: la frase del Evangelio continúa. En los márgenes y entre las letras se ocultan ángeles, una cabeza de hombre al final del lazo de la ro, gatos, ratones y una nutria que lleva un pez en la boca."""
evocation = """
La página marca el lugar donde el Evangelio de Mateo, tras la larga genealogía de Jesús, comienza el relato de su nacimiento: «El nacimiento de Jesucristo fue así». Para los monjes, es el instante en que Dios entra en la historia de los hombres, y le consagran una página entera, como un icono hecho de letras. Los animales deslizados en la decoración han recibido varias lecturas: la nutria con su pez, antiguo símbolo de Cristo, y los ratones que se disputan una hostia bajo la mirada de los gatos se han visto como imágenes de la eucaristía, pero también como guiños a la vida cotidiana del monasterio. La página expresa, en fin, el orgullo de un arte que funde la herencia celta, el ornamento germánico y la cultura latina de la Iglesia."""
histoire = """
El Libro de Kells contiene los cuatro Evangelios en latín, precedidos de tablas y de páginas pintadas. Se cree que se comenzó hacia 800 en el monasterio de la isla de Iona, en Escocia, fundado por san Columba, y que se terminó, o al menos se conservó, en Kells, en Irlanda, adonde se repliega una parte de los monjes tras las incursiones vikingas de comienzos del siglo IX. Los anales irlandeses cuentan que en 1007 el gran evangeliario de Columba fue robado de la iglesia de Kells y hallado después bajo un montón de tierra, privado de su cubierta de oro. En el siglo XVII, el obispo de Meath lo dona al Trinity College de Dublín, donde se conserva todavía. Encuadernado hoy en cuatro volúmenes, se expone en la biblioteca del colegio, donde se cambian regularmente las páginas presentadas."""
facture = """
El texto y la decoración están pintados sobre vitela, una piel de ternero finamente preparada. Los colores proceden de minerales y plantas: amarillo de oropimente, rojos, verde de cobre, púrpuras y azules de origen vegetal. Casi no hay oro: el resplandor nace del amarillo y de la densidad de los motivos. Las espirales y los entrelazados se construyeron con compás y regla, y después se rellenaron a mano alzada con tal precisión que algunos detalles solo se ven con lupa. Los especialistas distinguen varias manos de iluminadores en el manuscrito."""
details = [
  "La cabeza de hombre que remata el lazo de la ro, en el centro de la página.",
  "Las letras h generatio, abajo a la derecha: el texto continúa tras el monograma.",
  "Al pie de las letras, dos gatos que acechan a unos ratones que sostienen una hostia redonda.",
  "La nutria que lleva un pez en la boca, cerca de la parte inferior de la página.",
  "Los ángeles de alas plegadas, a lo largo del borde izquierdo de la gran X.",
]
themes = ["evangelio", "letra", "entrelazado", "arte celta", "cristo"]
anecdote = """
En 1007, el manuscrito fue robado de noche en la iglesia de Kells. Según los anales irlandeses, se encontró unos meses más tarde enterrado bajo un montón de césped: los ladrones solo querían su cubierta de oro y piedras preciosas, que nunca reapareció."""
salle = 2
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Evangelios de Lindisfarne: la página alfombra de san Mateo"
artiste = "Eadfrith de Lindisfarne"
annee = "hacia 715–720"
image = "lindisfarne-page-tapis.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:F26v.jpg"
technique = "Tintas y pigmentos sobre vitela, folio 26 verso"
collection = "British Library, Londres (Cotton MS Nero D IV)"
note = "Una cruz sumergida en una alfombra de entrelazados abre el Evangelio de Mateo, en un manuscrito pintado en Northumbria a comienzos del siglo VIII."
description = """
Ninguna figura, ninguna palabra: la página entera es una alfombra de motivos. En el centro, una gran cruz de brazos terminados en forma de campana se destaca, rodeada de rojo, sobre un fondo bullente de líneas. Pequeños discos claros puntúan su centro y sus brazos. En los compartimentos que la rodean, cintas azules, rosas, verdes y doradas se enroscan sin fin; siguiéndolas, se descubre que son cuerpos de aves y de cuadrúpedos estirados, que se entremezclan y se muerden. Un marco con salientes, verde y oro, rodea el conjunto, y pequeños adornos anudados sobresalen de él en medio de cada lado. El pergamino, amarillento en los bordes, lleva las huellas de trece siglos de lectura."""
evocation = """
Las páginas alfombra, propias de los manuscritos de Irlanda y de Gran Bretaña, preceden a cada uno de los Evangelios como un umbral. Antes de entrar en el texto sagrado, el lector contempla una cruz escondida en un laberinto y debe buscar para verla: se ha visto en ello una forma de meditación, la página que prepara el espíritu para la lectura. Su nombre moderno viene de su parecido con las alfombras de Oriente, y algunos historiadores han relacionado estos motivos con los tejidos preciosos llegados del Mediterráneo. También puede leerse en ellas una imagen del mundo: los animales entrelazados, heredados de la orfebrería anglosajona, quedan atrapados en el orden de la cruz, como la naturaleza salvaje en el designio de Dios."""
histoire = """
El manuscrito se realizó en el monasterio de Lindisfarne, en una isla de la costa de Northumbria, en honor de san Cuthbert, muerto en 687, cuyas reliquias se veneraban allí. En el siglo X, el sacerdote Aldred añade una nota al final del libro: según él, Eadfrith, obispo de Lindisfarne, lo escribió, Æthelwald lo encuadernó y el ermitaño Billfrith lo adornó con gemas. Aldred desliza también entre las líneas latinas una traducción al inglés antiguo, la versión más antigua de los Evangelios en lengua inglesa que ha llegado hasta nosotros. Tras las incursiones vikingas, los monjes abandonan la isla con el cuerpo de Cuthbert y el libro, que llega a Durham. Más tarde entra en la colección de Sir Robert Cotton, uno de los fondos fundadores del British Museum, y pertenece hoy a la British Library."""
facture = """
Eadfrith parece haber trabajado casi solo, lo que explica la unidad de la decoración. Los motivos se prepararon con esmero: en el reverso de algunas hojas se distinguen trazados preparatorios, cuadrículas y los pequeños agujeros dejados por la punta del compás. Los colores, de gran variedad, se extraen de minerales y de plantas. El entrelazado obedece a una regla estricta: cada cinta pasa alternativamente por encima y por debajo, sin romper nunca el ritmo. El marco con salientes y los adornos que sobresalen de él recuerdan las placas de orfebrería cloisonné."""
details = [
  "Los pequeños discos claros que puntúan la cruz, como piedras engastadas.",
  "Los brazos de la cruz, ensanchados en sus extremos en forma de campana.",
  "Las cintas de la parte inferior de la página, que se convierten en cuerpos de animales cuando se siguen sus lazos.",
  "Los cuatro adornos anudados que sobresalen del marco, en medio de cada lado.",
]
themes = ["cruz", "entrelazado", "evangelio", "meditación", "arte insular"]
anecdote = """
A comienzos del siglo XII, el cronista Simeón de Durham cuenta que un precioso evangeliario, llevado por los monjes en su huida, cayó al mar y fue hallado intacto en la orilla con la marea baja. A menudo se lo identifica con los Evangelios de Lindisfarne, pero el relato es más leyenda que historia."""
salle = 2
mur = "nord"
place = 4
largeur = 1.2

[[oeuvres]]
titre = "Apocalipsis de Saint-Sever: los cuatro jinetes"
artiste = "Scriptorium de Saint-Sever"
annee = "mediados del siglo XI"
image = "beatus-quatre-cavaliers.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:ApocalypseStSeverFol108v109r4Horsemen.jpg"
technique = "Pintura sobre pergamino, doble página (folios 108 verso y 109 recto); hoja de unos 36 × 28 cm"
collection = "Biblioteca Nacional de Francia, París (Latin 8878)"
note = "Los cuatro jinetes del Apocalipsis galopan sobre bandas de color, en el único gran Beato pintado en Francia."
description = """
En dos páginas enfrentadas, el fondo está dividido en anchas bandas horizontales: azul, rojo, verde oscuro, amarillo pálido. Arriba, un jinete coronado, sobre un caballo blanco, dispara con arco; otro, sobre un caballo rojo, blande una larga espada. Abajo, un tercero, montado en un caballo negro, levanta una balanza; el último, sobre un caballo pálido, tiene los cabellos erizados como llamas, y la palabra MORS, la Muerte, está escrita sobre su cabeza. En medallones, el Cordero abre uno tras otro los sellos de un libro. Junto a cada jinete, uno de los cuatro Vivientes, ángel, buey alado, león o águila, se dirige a san Juan, que está de pie al borde de la página, con aureola."""
evocation = """
El capítulo 6 del Apocalipsis describe la apertura de los cuatro primeros sellos: cada vez surge un jinete, que la tradición asocia con la conquista, la guerra, el hambre y la muerte. En los Beatos, estas visiones no están para asustar: acompañan un comentario erudito que las explica línea a línea. El primer jinete, coronado, se entiende allí como el Cristo victorioso, o como la Iglesia que anuncia el Evangelio. Las bandas de color arrancan las escenas de todo paisaje real: estamos en el tiempo de la visión, fuera del mundo. Para los monjes del siglo XI, que leían el Apocalipsis como un libro sobre la historia de la Iglesia y el fin de los tiempos, estas imágenes invitaban a la vigilancia."""
histoire = """
Hacia 776, Beato, monje de Liébana, en las montañas del norte de España, compone un comentario del Apocalipsis a partir de los escritos de los Padres de la Iglesia. El texto, copiado e ilustrado durante siglos en los reinos cristianos de España, da su nombre a una familia de manuscritos, los Beatos, de los que más de una veintena han llegado hasta nosotros con sus pinturas. Este es una excepción: se realizó en Gascuña, en la abadía de Saint-Sever, bajo el abad Gregorio de Montaner, que la dirigió de 1028 a 1072. Sus pinturas siguen un modelo español, pero con figuras marcadas por el arte románico naciente del suroeste de Francia. Se conserva en el departamento de Manuscritos de la Biblioteca Nacional de Francia, en la sede Richelieu."""
facture = """
El pintor trabaja en superficies planas de colores puros, espesos y brillantes, sin sombra ni perspectiva. Los fondos en bandas, heredados de los Beatos mozárabes de España, organizan la doble página como una partitura. Los caballos, en cambio, son más vivos que en los modelos españoles: patas tensas en el galope, crines y colas flotantes. Las figuras humanas, de ropajes subrayados con trazos oscuros, recuerdan la escultura románica de la región. Inscripciones latinas en capitales, trazadas dentro de la imagen, nombran a los personajes y citan el texto."""
details = [
  "La palabra MORS, la Muerte, sobre el último jinete de cabellos de llamas.",
  "La balanza que levanta el jinete del caballo negro, signo del hambre.",
  "El águila cubierta de ojos, abajo a la derecha, uno de los cuatro Vivientes.",
  "Los cuatro pequeños san Juan que miran la visión desde los bordes.",
  "El Cordero en sus medallones, con una pata apoyada en el libro sellado.",
]
themes = ["apocalipsis", "jinetes", "arte románico", "visión", "fin de los tiempos"]
anecdote = """
El manuscrito conserva el nombre de Stephanus Garsia, inscrito en sus páginas. A menudo se le tiene por uno de los pintores del libro, quizá el principal, pero su papel exacto no está establecido: los monjes del siglo XI rara vez firmaban sus obras."""
salle = 2
mur = "nord"
place = 3
largeur = 2.2

[[oeuvres]]
titre = "Biblia de Souvigny: la Creación"
artiste = "Enlumineurs de la Bible de Souvigny"
annee = "finales del siglo XII"
image = "souvigny-creation.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Bible_de_Souvigny_-_Bibliothèque_de_Moulins_f4v.jpg"
technique = "Pintura y oro sobre pergamino, folio 4 verso"
collection = "Mediateca de Moulins (ms. 1), Moulins"
note = "Ocho pequeñas escenas sobre fondo de oro narran la Creación y la caída de Adán y Eva, a la cabeza de una Biblia gigante de época románica."
description = """
A la izquierda de la página, ocho casillas bordeadas de azul y de rojo forman una columna de imágenes; a la derecha, una columna de texto se abre con las palabras IN PRINCIPIO, «En el principio». Las seis primeras casillas muestran los días de la Creación. En cada una, el Creador, con los rasgos de Cristo, aparece a medio cuerpo en un arco de cielo: planea sobre las aguas donde se halla la paloma del Espíritu, separa las aguas, hace crecer los árboles, sostiene el sol y la luna, y luego hace nacer las aves, los peces y los animales de la tierra. Las dos últimas casillas narran al hombre: Dios saca a Eva del costado de Adán dormido, y después Adán y Eva, desnudos, están a uno y otro lado del árbol en el que se enrosca la serpiente."""
evocation = """
Colocada en la apertura del Génesis, la página resume en unas pocas imágenes todo el relato de los orígenes, desde el caos de las aguas hasta la falta. Dar al Creador el rostro de Cristo sigue el Evangelio de Juan, para quien en el principio era el Verbo, por quien todo fue hecho: la imagen vincula así el primer libro de la Biblia con el Nuevo Testamento. El orden en casillas, leído de izquierda a derecha y de arriba abajo, da al mundo una construcción regular, como un edificio. La última imagen, la caída, anuncia el resto del libro: toda la historia sagrada que sigue, hasta la venida de Cristo, se entendía como la reparación de esa falta."""
histoire = """
Esta Biblia en un solo volumen, de formato muy grande, se copió y se pintó a finales del siglo XII. Pertenecía al priorato de Souvigny, en el Borbonesado, uno de los monasterios más importantes de la orden de Cluny, donde se veneraba a los santos abades Mayolo y Odilón. El lugar exacto de su fabricación sigue discutiéndose. Estas Biblias gigantes, colocadas sobre un facistol, servían para la lectura solemne y afirmaban la riqueza de la comunidad. Con la Revolución, los bienes de los monasterios se confiscan: el manuscrito pasa a la biblioteca de Moulins, capital del nuevo departamento del Allier, donde se conserva todavía, con sus numerosas iniciales y escenas pintadas."""
facture = """
Las figuras se recortan sobre un fondo de pan de oro, bruñido para brillar, que convierte cada casilla en una pequeña vidriera. Los ropajes se dibujan con pliegues apretados y líneas dobles, típicos del arte románico tardío. Las aguas se representan con líneas onduladas blancas sobre azul, los árboles con troncos flexibles que terminan en abanico. Las orlas, azules y rojas, están puntuadas por perlas blancas y pequeñas rosetas en los cruces. El texto del Génesis, a la derecha, está acompasado por iniciales pintadas y por los números de los días, en cifras romanas rojas."""
details = [
  "El Creador que sostiene el sol y la luna, en la cuarta casilla.",
  "Los arcos concéntricos del segundo y del cuarto día.",
  "El pequeño bestiario del sexto día, reunido sobre colinas verdes.",
  "Eva que sale del costado de Adán dormido, sacada por la mano de Dios.",
  "Las cifras romanas rojas que numeran los días en el texto, a la derecha.",
]
themes = ["creación", "génesis", "adán y eva", "fondo de oro", "arte románico"]
anecdote = """
En la iglesia de Souvigny, de donde procede esta Biblia, reposan san Mayolo y san Odilón, dos de los más célebres abades de Cluny, muertos en 994 y en 1049. Sus tumbas hacían del priorato un lugar de peregrinación y una fuente de riqueza."""
salle = 2
mur = "sud"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "Códice Borbónico: la trecena de Tlazolteotl"
artiste = "Peintres-scribes aztèques"
annee = "principios del siglo XVI"
image = "codex-borbonicus.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Borbonicus_Codex_p13_Wiki.png"
technique = "Pintura sobre papel de corteza (amate), página 13; página de unos 39 × 39 cm"
collection = "Biblioteca de la Asamblea Nacional, París"
note = "Una página del calendario adivinatorio azteca: la diosa Tlazolteotl preside un período de trece días, cuyos signos se alinean en dos lados."
description = """
La página cuadrada se lee como un cuadro. En la gran casilla de arriba a la izquierda, una diosa de rostro rojo, tocada con algodón blanco y plumas, está en cuclillas en la postura del parto: bajo ella aparece un pequeño dios, el niño que da a luz. A su lado, una segunda divinidad, vestida con un traje de ave de grandes alas pardas, sostiene objetos rituales. Alrededor flotan símbolos: una serpiente, huellas de pasos, ofrendas, una pequeña plataforma escalonada. A la derecha y abajo, dos hileras de casillas contienen los trece días del período, cada uno con su signo, su número en puntos rojos, un dios de la noche y un ave. Anotaciones en español, a tinta, nombran algunos días."""
evocation = """
Los aztecas contaban el tiempo con dos calendarios entrelazados: un año solar de 365 días y un ciclo adivinatorio de 260 días, el tonalpohualli, dividido en veinte períodos de trece días. Cada período estaba bajo la protección de un dios, y cada día llevaba un destino, bueno o malo, que los sacerdotes consultaban para un nacimiento, una boda, un viaje o una guerra. Tlazolteotl, diosa de la fertilidad, de la sexualidad y de la purificación, recibía también la confesión de las faltas y las borraba. Al mostrarla dando a luz a un joven dios, a menudo identificado con el dios del maíz, la página asocia el nacimiento humano con la renovación de las cosechas. El códice era una herramienta de trabajo tanto como un libro sagrado."""
histoire = """
El Códice Borbónico se pintó en la región de México, en el momento de la conquista española o poco después: los especialistas debaten todavía si es anterior o posterior a 1521. Se compone de una larga tira de papel plegada en acordeón, de la que faltan las primeras y las últimas páginas. Tras el calendario adivinatorio, muestra el ciclo de las fiestas del año solar. Las anotaciones en español se añadieron después de la conquista. Como la mayoría de los manuscritos aztecas, salió de México en circunstancias desconocidas. En 1826, la biblioteca de la Cámara de Diputados lo compra, y debe su nombre al Palacio Borbón, donde se conserva todavía. La imagen presentada aquí reproduce el facsímil en color publicado en París en 1899."""
facture = """
El pintor-escriba, el tlacuilo, trabaja sobre papel de amate, fabricado golpeando la corteza interna de higueras silvestres. Las figuras se perfilan primero con un trazo negro regular y luego se rellenan de colores planos, sin sombra: rojo, azul turquesa, amarillo, verde, pardo. Los personajes se construyen con signos yuxtapuestos, y cada elemento del traje, del tocado o de la pintura del rostro permite identificar al dios. La página ignora la perspectiva: el tamaño de una figura dice su importancia. Las líneas rojas que dividen la página en casillas guían la lectura."""
details = [
  "El pequeño dios que aparece bajo la diosa en cuclillas, arriba a la izquierda.",
  "Los puntos rojos que cuentan los días del 1 al 13, junto a cada signo.",
  "Las aves de la columna de la derecha, una por día: se reconocen loros y un búho.",
  "Las anotaciones españolas, como segundo dia pedernal, «segundo día: pedernal».",
  "Las huellas de pasos que suben hacia lo alto de la página, cerca de la diosa.",
]
themes = ["calendario", "aztecas", "adivinación", "nacimiento", "méxico"]
anecdote = """
Plegado en acordeón, el Códice Borbónico se guarda como un libro; desplegado, forma una tira de más de catorce metros, que podía recorrerse de una mirada para seguir el ciclo de los días y de las fiestas."""
