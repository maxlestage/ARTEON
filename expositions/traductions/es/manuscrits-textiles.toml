[[artistes]]
nom = "Moines d'Iona et de Kells"
vie = "Iona (Escocia) y Kells (Irlanda), hacia 800"
biographie = """
El monasterio de Iona, en una pequeña isla de las Hébridas Interiores, lo funda hacia 563 el monje irlandés Columba, Columcille en irlandés, llegado con doce compañeros. Se convierte en la cabeza de una vasta red de monasterios en Irlanda y en Escocia, y en un foco de cultura: allí se copian y se decoran libros, se escriben vidas de santos y crónicas. A partir de 795, los vikingos atacan la isla en varias ocasiones; en 806, sesenta y ocho monjes son asesinados. Los monjes fundan entonces un nuevo monasterio en Kells, en el condado de Meath, en Irlanda, adonde se repliega una parte de la comunidad con las reliquias de Columba. El Libro de Kells es fruto de este mundo: se ignora el nombre de sus copistas y de sus pintores, pero los especialistas distinguen al menos tres grandes iluminadores y varios copistas, formados en una tradición donde la escritura, la oración y el arte eran una sola cosa."""
style = """
El Libro de Kells es la cumbre del arte llamado insular, nacido en Irlanda y en Gran Bretaña entre los siglos VII y IX. Funde las espirales y los triskeles del arte celta, los entrelazados de animales de la orfebrería germánica y los modelos cristianos llegados del Mediterráneo. Las letras se convierten en imágenes, las páginas en superficies saturadas de ornamentos, y las figuras humanas, estilizadas, obedecen a la geometría. Este estilo marca todavía el imaginario irlandés."""

[[artistes]]
nom = "Eadfrith de Lindisfarne"
vie = "Northumbria (Inglaterra), muerto en 721"
biographie = """
Casi nada se sabe de Eadfrith antes de que se convierta en obispo de Lindisfarne, en 698. El monasterio, fundado en 635 por el monje irlandés Aidan, llegado de Iona, en una isla unida a la costa de Northumbria con la marea baja, es entonces el corazón religioso del reino. Su más célebre obispo, Cuthbert, muerto en 687, es venerado como santo, y su cuerpo, hallado intacto en 698, atrae a los peregrinos. En este contexto, Eadfrith, según la nota añadida por el sacerdote Aldred en el siglo X, escribe y pinta los Evangelios, sin duda para el culto de Cuthbert. Hace también restaurar el eremitorio de la isla de Farne donde había vivido el santo, y el monje Beda le dedica su vida de san Cuthbert. Muere en 721. Si la atribución de Aldred es exacta, habría consagrado varios años de su vida a este solo libro, trabajando casi solo, como sugiere la unidad de la decoración."""
style = """
La decoración de los Evangelios de Lindisfarne une el rigor geométrico y la fantasía animal. Eadfrith mezcla en ella los entrelazados y los animales de la orfebrería anglosajona, las espirales célticas y modelos mediterráneos: sus retratos de evangelistas se inspiran en manuscritos llegados de Italia. Su construcción con compás, de una precisión excepcional, da a las páginas alfombra su orden perfecto. El manuscrito es uno de los grandes modelos del arte insular, antes del Libro de Kells, más exuberante."""

[[artistes]]
nom = "Scriptorium de Saint-Sever"
vie = "Abadía de Saint-Sever (Gascuña), mediados del siglo XI"
biographie = """
La abadía benedictina de Saint-Sever, a orillas del Adour, en el actual departamento de las Landas, se refunda a finales del siglo X por el duque de Gascuña. Conoce su edad de oro bajo el abad Gregorio de Montaner, que la dirige de 1028 a 1072: él es quien hace realizar el gran manuscrito del Apocalipsis, cuyas primeras páginas celebran su nombre. El texto copiado es el comentario del Apocalipsis compuesto hacia 776 por Beato, monje de Liébana, en el norte de España, que los monasterios españoles copiaban e ilustraban desde el siglo X. Los monjes de Saint-Sever trabajaron según un modelo llegado de España, signo de los estrechos vínculos entre las dos vertientes de los Pirineos. El nombre de Stephanus Garsia, inscrito en el libro, es quizá el de uno de los pintores. El resto del equipo, copistas e iluminadores, permanece anónimo. La abadía románica de Saint-Sever, muy remodelada, todavía puede visitarse."""
style = """
El estilo de Saint-Sever tiende un puente entre España y la Francia románica. Conserva de los Beatos mozárabes los fondos de bandas de colores vivos, las figuras planas y las espectaculares composiciones a doble página. Pero sus personajes, más flexibles, de ropajes articulados, y sus animales llenos de vida anuncian la escultura románica del suroeste de Francia. La fuerza decorativa y el brillo de los colores hacen de él uno de los manuscritos románicos más admirados."""

[[artistes]]
nom = "Enlumineurs de la Bible de Souvigny"
vie = "Francia, finales del siglo XII"
biographie = """
No se conocen ni los nombres ni el lugar de trabajo de los copistas y de los pintores de la Biblia de Souvigny. El manuscrito pertenecía al priorato de Souvigny, en el Borbonesado, fundado a comienzos del siglo X en tierras donadas a la abadía de Cluny y convertido en uno de sus establecimientos más importantes gracias al culto de los santos abades Mayolo y Odilón. En el siglo XII, los grandes monasterios hacen copiar Biblias gigantes, en uno o varios volúmenes, para la lectura solemne: empresas largas y costosas, que movilizan durante años a copistas, rubricadores y pintores, y requieren pieles en gran número. La decoración de la Biblia de Souvigny, con sus fondos de oro y sus figuras esbeltas, pertenece al final de la época románica, pero su taller no ha sido identificado con certeza. El libro permaneció en el priorato hasta la Revolución, antes de pasar a la biblioteca de Moulins, donde sus decenas de iniciales y de escenas pintadas hacen de él uno de los grandes manuscritos románicos conservados en Francia."""
style = """
La decoración de la Biblia de Souvigny pertenece a la última fase del arte románico. Las figuras son esbeltas, los ropajes se dibujan con múltiples pliegues, casi metálicos, y los fondos de oro dan a las escenas el brillo de la orfebrería. Las composiciones en casillas superpuestas, que cuentan una historia imagen por imagen, recuerdan las vidrieras y los frontispicios de las grandes Biblias del siglo XII. Las iniciales pintadas mezclan roleos, animales y figuras."""

[[artistes]]
nom = "Peintres-scribes aztèques"
vie = "México central, hacia 1500"
biographie = """
En el México antiguo, escribir y pintar eran una sola cosa: la misma palabra náhuatl, tlacuilo, designaba al pintor y al escriba. Estos pintores-escribas, formados en particular en las escuelas de los templos, trabajaban para los sacerdotes, los nobles y la administración del imperio azteca, cuya capital, Tenochtitlan, se alzaba en una isla del lago de Texcoco, en el emplazamiento de la actual Ciudad de México. Producían libros de adivinación y de rituales, genealogías, mapas y registros de tributos, pintados sobre piel de ciervo o sobre papel de corteza y plegados en acordeón. La conquista española, concluida en 1521, y después la lucha de los misioneros contra las religiones antiguas provocaron la destrucción de la mayoría de estos libros: solo un puñado de manuscritos pintados antes de la conquista ha llegado hasta nosotros. Algunos tlacuilos siguieron trabajando después de 1521, a veces para los españoles, mezclando su arte con los usos europeos. Los autores del Códice Borbónico permanecen anónimos."""
style = """
El arte de los tlacuilos es una escritura en imágenes. Las figuras, perfiladas con un trazo negro de grosor uniforme y rellenas de colores puros, se componen de signos codificados: tocados, pinturas del rostro, adornos y objetos que sostienen permiten identificar a cada dios. El espacio carece de perspectiva y de sombra, y el tamaño dice la importancia. Las páginas se organizan en casillas, bandas o recorridos que guían la lectura. Esta gran claridad gráfica fascinó a los artistas mexicanos del siglo XX."""

[[artistes]]
nom = "Atelier anglo-saxon"
vie = "Inglaterra, quizá Canterbury, hacia 1070"
biographie = """
Se ignora quién dibujó y bordó el bordado de Bayeux. La mayoría de los historiadores piensan que se realizó en Inglaterra, poco después de la conquista de 1066, a petición de Odón, obispo de Bayeux y hermanastro de Guillermo el Conquistador, convertido en conde de Kent tras la victoria. Varios indicios apuntan a Canterbury, en Kent: ciertas figuras parecen tomadas de manuscritos iluminados conservados en las abadías de la ciudad, y la ortografía de varios nombres bordados delata hábitos ingleses. Los anglosajones eran célebres en toda Europa por sus bordados, en los que sobresalían las mujeres, pero nada permite identificar las manos que trabajaron aquí. El dibujo, probablemente obra de un único diseñador, se transfirió a la tela y luego lo bordaron varias personas, quizá en varios lugares. Otras hipótesis, minoritarias, sitúan su fabricación en Normandía o en el valle del Loira."""
style = """
El bordado de Bayeux narra como un friso: las escenas se encadenan sin marco, separadas por un árbol o un edificio, y se leen de izquierda a derecha, con inscripciones latinas. Las figuras, siluetas nítidas de gestos expresivos, se recortan sobre el lino desnudo. Las orlas, pobladas de animales, de fábulas y de escenas de la vida cotidiana, comentan a veces la acción principal. Esta narración continua hace que a menudo se presente el bordado como un lejano antepasado del cómic."""

[[artistes]]
nom = "Jean de Bruges et Nicolas Bataille"
vie = "Jean de Bruges, activo hacia 1368–1381; Nicolas Bataille, muerto hacia 1400"
biographie = """
Jean de Bruges, llamado también Hennequin de Bruges o Jean Bondol, es un pintor flamenco venido a trabajar a París, donde se convierte en pintor del rey Carlos V. Se le debe la miniatura que abre una Biblia ofrecida al rey en 1371, hoy en La Haya: Carlos V recibe en ella el libro de manos de su consejero Jean de Vaudetar, en uno de los primeros retratos realistas de la pintura francesa. Hacia mediados de la década de 1370, el duque Luis de Anjou, hermano del rey, le encarga el dibujo del gran tapiz del Apocalipsis. Sus cartones se entregan al mercader-tapicero parisino Nicolas Bataille, uno de los más importantes de su tiempo, que proveía de tapices de precio a los príncipes de la casa de Francia. Bataille organiza el tejido, sin duda en varios talleres, con el concurso del tapicero Robert Poisson. Las cuentas del duque conservan la huella de pagos hechos a ambos hombres a finales de la década de 1370. Bataille muere hacia 1400, cuando París domina todavía la tapicería europea."""
style = """
El dibujo de Jean de Bruges alía la elegancia del arte parisino y un sentido flamenco de la observación: rostros vivos, gestos justos, ropajes amplios que caen con peso. En el tapiz, cada escena está organizada con claridad, sobre fondos alternativamente rojos y azules, y las visiones del Apocalipsis adquieren la presencia de un espectáculo. El taller de Nicolas Bataille supo traducir este dibujo en lana a una escala monumental."""

[[artistes]]
nom = "Ateliers des Pays-Bas du Sud"
vie = "Países Bajos del Sur (actual Bélgica), hacia 1500"
biographie = """
Hacia 1500, las ciudades de los Países Bajos del Sur, posesiones de los duques de Borgoña y después de los Habsburgo, son los grandes centros europeos de la tapicería: Bruselas, Tournai, Oudenaarde, Enghien. Los talleres emplean allí a numerosos tejedores, que trabajan a partir de cartones proporcionados por pintores. Los tapices, objetos de lujo que se llevan de un castillo a otro, protegen del frío, dividen las salas y exhiben el prestigio de sus propietarios, y los talleres exportan sus tapices a toda Europa. La Caza del unicornio ilustra esta organización: los dibujos se atribuyen a un artista activo en París, el tejido a talleres de los Países Bajos del Sur. Los tapiceros son anónimos, pero su maestría es deslumbrante: finura de los rostros, modelado de los animales, plantas tan exactas que los botánicos las reconocen. El comitente, a quien podría designar el monograma AE, nunca ha sido identificado con certeza."""
style = """
Los tapices de los Países Bajos del Sur hacia 1500 se distinguen por la densidad de sus composiciones, la riqueza de los materiales, en los que la seda y los hilos metálicos iluminan la lana, y un gusto por el detalle heredado de los primitivos flamencos. El fondo de millefleurs, siembra apretada de plantas sobre un fondo oscuro, transforma el muro en jardín. Las figuras, modeladas con rayados, ganan un relieve nuevo. Estos tapices fijaron durante siglos la imagen que se tiene del final de la Edad Media."""

[[artistes]]
nom = "Jean Bourdichon"
vie = "Tours, hacia 1457 – Tours, 1521"
biographie = """
Jean Bourdichon nace en Tours hacia 1457, en la ciudad de Jean Fouquet, el gran pintor de Carlos VII y de Luis XI, de quien es sin duda discípulo o continuador. Trabaja para Luis XI desde finales de la década de 1470 y permanece al servicio de la corona más de cuarenta años, bajo Carlos VIII, Luis XII y Francisco I. Pintor del rey, no hace solo libros: pinta retratos, estandartes, decorados para las fiestas y las entradas reales, y dibuja modelos para objetos preciosos. Sus libros de horas, para la familia real y para príncipes como el rey de Nápoles Federico de Aragón, figuran entre los más lujosos de su tiempo. Las Grandes Horas de Ana de Bretaña, terminadas en 1508, son su obra más célebre. Muere en Tours en 1521, cuando la imprenta y el gusto italiano transforman el libro y la pintura."""
style = """
Bourdichon traslada a la página la pintura de caballete. Sus miniaturas, a menudo a página completa y rodeadas de un marco dorado en trampantojo, presentan figuras grandes y cercanas, modeladas por una luz suave y sombras fundidas, ante paisajes azulados. Heredero de Fouquet, atento al arte italiano, busca el ideal más que el carácter: rostros lisos, gestos calmados, colores profundos. Sus márgenes de plantas pintadas del natural anuncian la ilustración botánica."""

[[artistes]]
nom = "Abraham Cresques"
vie = "Palma de Mallorca, hacia 1325 – Palma, 1387"
biographie = """
Abraham Cresques nace en Mallorca hacia 1325, en la comunidad judía de Palma. La isla, conquistada por los reyes de Aragón en el siglo XIII, es entonces una plataforma giratoria del comercio mediterráneo, donde se cruzan marinos, mercaderes y sabios cristianos, judíos y musulmanes. Cresques ejerce allí los oficios de cartógrafo y de fabricante de instrumentos: los documentos lo designan como maestro de mapamundis y de brújulas al servicio del rey Pedro IV de Aragón. Trabaja con su hijo Jafuda, y a su taller se atribuye el Atlas catalán de 1375, el más suntuoso de los mapas mallorquines. Varios talleres de cartas marinas trabajan entonces en la isla, y sus mapas circulan por los puertos de todo el Mediterráneo. Abraham muere en 1387. En 1391, disturbios antijudíos golpean a la comunidad de Palma; Jafuda se convierte al cristianismo con el nombre de Jaume Ribes y prosigue su oficio de cartógrafo, en particular en Barcelona. La escuela mallorquina ha marcado de forma duradera la cartografía europea."""
style = """
El taller de Cresques lleva a su cima la cartografía mallorquina. A la precisión de las cartas marinas, con sus costas detalladas y sus redes de líneas de vientos, añade el saber de los geógrafos y de los viajeros, de Marco Polo a los mercaderes del Sahara. Las tierras se cubren de ciudades, de reyes, de caravanas y de leyendas. Esta unión de la ciencia práctica y de la imagen hace de sus mapas a la vez instrumentos y obras de arte."""
