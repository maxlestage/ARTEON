[[oeuvres]]
titre = "Lujo, calma y voluptuosidad"
artiste = "Henri Matisse"
annee = "1904"
image = "luxe-calme-volupte.jpg"
technique = "Óleo sobre lienzo, 98,5 × 118,5 cm"
collection = "Centro Pompidou, Museo Nacional de Arte Moderno, París (depositado en el Museo de Orsay)"
note = "Un picnic a orillas del mar, en Saint-Tropez, pintado con pequeñas pinceladas de color puro: el título procede de un poema de Baudelaire."
description = """
A orillas de una bahía, a la hora en que el sol poniente incendia el cielo, un pequeño grupo \
se ha instalado en la playa. A la izquierda, una mujer vestida con un traje oscuro y tocada \
con un sombrero está sentada junto a un mantel blanco sobre el que hay tazas y una \
tetera. A su alrededor, bañistas desnudas descansan, se tumban o se secan; \
una de ellas, de pie a la derecha, deja caer su larga cabellera por delante. En el centro, el \
mástil de una barca varada en la arena traza una gran diagonal. Un pino esbelto cierra la \
composición a la derecha, con sus ramas dibujando arabescos en un cielo rosa y amarillo. \
Al fondo, colinas azules bordean la otra orilla de la bahía. Toda la escena está hecha \
de pequeñas pinceladas de color puro, rojas, anaranjadas, azules y verdes, que centellean \
como un mosaico."""
evocation = """
El título retoma el estribillo de «La invitación al viaje» de Baudelaire, que sueña con un \
país donde «todo es orden y belleza, lujo, calma y voluptuosidad». Matisse traslada ese \
sueño a una escena moderna: una merienda en familia convive con ninfas desnudas, como si la \
vida cotidiana se abriera a una edad de oro. Se ha visto en ella una respuesta a las grandes pastorales \
de Puvis de Chavannes y a las bañistas de Cézanne, a quien Matisse admiraba. La mujer \
vestida, a la que se suele identificar con Amélie, la esposa del pintor, enlaza el mito \
con su propia vida. Este paraíso apacible anuncia un tema que ya no abandonará a Matisse: la \
alegría de vivir, el gozo de la luz y de los cuerpos en reposo, que desarrollará a partir \
del año siguiente en La alegría de vivir."""
histoire = """
Durante el verano de 1904, Matisse pasa una temporada en Saint-Tropez, donde Paul Signac, jefe de filas \
del neoimpresionismo, posee una casa, La Hune. En contacto con Signac y con \
Henri-Edmond Cross, ensaya la pincelada dividida. De regreso a París, compone en el \
taller, a partir de un boceto pintado en el lugar, este gran cuadro que expone en el \
Salón de los Independientes en la primavera de 1905. Signac lo compra y lo cuelga en su casa de \
Saint-Tropez. El lienzo, que causó una fuerte impresión en jóvenes pintores como Raoul \
Dufy, permanece mucho tiempo en la familia de Signac antes de ingresar en las colecciones \
nacionales a comienzos de los años ochenta. Propiedad del Centro Pompidou, se expone en el \
Museo de Orsay, donde marca la charnela entre el neoimpresionismo y el fauvismo."""
facture = """
Matisse adopta el método de Seurat y de Signac: el color se aplica en pinceladas \
separadas, sin mezclar en la paleta, para que el ojo recomponga los tonos. Pero hace de él \
un uso muy libre. Sus pinceladas son más anchas, casi teselas de \
mosaico, y sus colores más violentos que los de sus mayores: anaranjados, rosas y \
azules vivos. Sobre todo, rodea los cuerpos con un trazo azul o rojo continuo, que contradice \
el principio mismo de la división. Este conflicto entre la línea y el color lo llevará \
el verano siguiente, en Colliure, a abandonar la pincelada dividida por los colores planos \
y deslumbrantes del fauvismo."""
details = [
  "A la izquierda, la mujer con traje oscuro y sombrero, única figura vestida de la escena.",
  "Sobre el mantel blanco, las tazas y la pequeña tetera de la merienda.",
  "La gran diagonal del mástil de la barca, en el centro del cuadro.",
  "Los contornos azules y rojos que perfilan el cuerpo de las bañistas.",
  "La firma, abajo a la derecha, casi sumergida entre las pinceladas.",
]
themes = ["bañistas", "mar", "edad de oro", "neoimpresionismo", "poesía"]
anecdote = """
En 1899, casi sin un céntimo, Matisse había comprado al marchante Vollard un pequeño cuadro \
de Cézanne, Tres bañistas. Lo conservó treinta y siete años antes de donarlo en 1936 a \
la Ciudad de París, explicando que lo había sostenido moralmente en los momentos \
críticos de su vida de artista."""
salle = 2
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "La mujer del sombrero"
artiste = "Henri Matisse"
annee = "1905"
image = "femme-au-chapeau.jpg"
technique = "Óleo sobre lienzo, 80,7 × 59,7 cm"
collection = "Museo de Arte Moderno de San Francisco"
note = "El retrato de Amélie Matisse que escandalizó en el Salón de Otoño de 1905, aquel en el que nació la palabra «fauves»."
description = """
Una mujer aparece de medio cuerpo, con el busto vuelto hacia la izquierda y el rostro hacia nosotros. \
Sostiene un abanico ante sí y lleva un enorme sombrero cargado de flores, de \
plumas y de cintas, pintado en azules, violetas, verdes y toques anaranjados. Su rostro \
estrecho está cebrado de verde en la frente y el caballete de la nariz, de amarillo y de rosa en las \
mejillas; sus cejas negras y sus labios rojos resaltan con fuerza. Su cabellera es \
de un rojizo anaranjado. El fondo no representa ninguna habitación reconocible: son \
extensiones libres de verde, rosa, malva y amarillo, aplicadas con amplias pinceladas, con \
zonas en las que el lienzo queda a la vista. Arriba a la izquierda, la firma Henri-Matisse está \
escrita con letras verdes."""
evocation = """
La modelo es Amélie Matisse, la esposa del pintor, y sin embargo el cuadro expresa menos un \
parecido que una sensación. Matisse no busca reproducir el color real de \
la piel o del vestido: elige cada tono por su fuerza y por su armonía con \
los demás. El verde del rostro, que tanto escandalizó, no es una provocación gratuita \
sino una manera de construir el volumen y la luz con el solo color. Para el \
público de 1905, acostumbrado a los retratos mundanos esmerados, aquel rostro embadurnado \
parecía una caricatura, incluso un insulto. Los historiadores ven en él, por el contrario, \
el acta de nacimiento de una pintura en la que el color se vuelve autónomo. El sombrero \
extravagante, a la moda de la época, se convierte a su vez en un ramo de colores puros."""
histoire = """
El retrato se pinta en París en el otoño de 1905, a la vuelta del verano pasado en Colliure. \
Matisse lo envía al Salón de Otoño, donde se cuelga en la sala VII junto a los \
lienzos de Derain, Manguin, Camoin, Marquet y de sus amigos. El público se desternilla, y \
el crítico Louis Vauxcelles, al advertir en medio de aquellos colores violentos unos bustos \
de factura clásica, escribe en el periódico Gil Blas: «¡Donatello entre las fieras!» \
La frase perdurará. El cuadro encuentra, sin embargo, comprador: Leo y Gertrude Stein, dos \
jóvenes estadounidenses establecidos en París, lo cuelgan en su apartamento de la calle \
Fleurus, por donde desfila la vanguardia. Pasa luego a Michael y Sarah Stein, que \
se lo llevan a California, y más tarde es legado al museo de San Francisco por la \
coleccionista Elise S. Haas."""
facture = """
Matisse aplica el color con amplias pinceladas, rápidas y visibles, a veces \
yuxtapuestas sin tocarse, dejando respirar el lienzo desnudo entre ellas. No hay ni \
modelado tradicional ni sombra proyectada: el volumen nace del contraste entre tonos cálidos y \
fríos, con el verde del caballete de la nariz opuesto al rosa y al amarillo de las mejillas. El dibujo, \
reducido a unos pocos trazos oscuros para las cejas, los ojos y el contorno del hombro, \
permanece libre. La pincelada deriva aún de los experimentos neoimpresionistas del año \
anterior, pero estallada, ensanchada, casi salvaje. El fondo, tratado con la misma \
energía que la figura, rechaza toda profundidad."""
details = [
  "La franja verde que desciende de la frente por el caballete de la nariz.",
  "Las cejas negras, trazadas de un solo gesto sobre los ojos oscuros.",
  "El abanico, simple destello de blanco, rosa y verde en primer plano.",
  "Las zonas en las que el lienzo queda desnudo, sobre todo en el fondo.",
  "La firma Henri-Matisse, en verde, en la esquina superior izquierda.",
]
themes = ["retrato", "color puro", "escándalo", "moda", "fauvismo"]
anecdote = """
Según un recuerdo a menudo referido, alguien preguntó un día a Matisse de qué \
color era en realidad el vestido que llevaba su esposa durante las sesiones de pose. Él \
habría respondido: «Negro, por supuesto.»"""
salle = 2
mur = "sud"
place = 1
largeur = 0.8

[[oeuvres]]
titre = "La mesa puesta roja (Armonía en rojo)"
artiste = "Henri Matisse"
annee = "1908"
image = "desserte-rouge.jpg"
technique = "Óleo sobre lienzo, 180 × 220 cm"
collection = "Museo del Hermitage, San Petersburgo"
note = "Encargado por el coleccionista moscovita Serguéi Shchukin, el lienzo se pintó primero en azul y luego se repintó por entero en rojo."
description = """
Una criada, con corpiño azul noche y delantal blanco, dispone fruta en un \
frutero sobre una mesa puesta. El mantel rojo y la pared roja se funden en un \
solo plano, cubiertos del mismo motivo: grandes arabescos azules y cestas de \
flores. Sobre la mesa, dos garrafas, una de vino tinto, otra de un licor dorado, un \
frutero con pie, un jarrón de flores, limones y naranjas desperdigados. A la izquierda, \
una silla de respaldo de barrotes y asiento de paja amarilla. Arriba a la izquierda, una \
ventana se abre a un jardín verde donde florecen árboles blancos, bajo un cielo azul, \
con el tejado de una pequeña casa rosa. La firma y la fecha, abajo a la izquierda, están \
discretamente inscritas."""
evocation = """
El asunto es casi banal, una criada que prepara el postre, pero Matisse hace de él \
una demostración: el color puede organizar por sí solo todo un cuadro. El rojo \
saturado anula la distinción entre la pared y la mesa, entre lo alto y lo bajo, y \
transforma la estancia en una superficie decorativa. Los arabescos azules parecen escapar de \
el mantel para trepar por la pared, como plantas vivas. La ventana hace de contrapunto: \
un jardín primaveral, fresco y verde, opone la naturaleza al decorado. Ese mismo año, en sus \
«Notas de un pintor», Matisse dice soñar con un arte de equilibrio y serenidad, que \
repose el espíritu. Se ha visto en esta obra uno de los primeros grandes logros de ese ideal, y el \
punto de partida de los interiores decorativos que jalonan toda su carrera."""
histoire = """
El cuadro es un encargo de Serguéi Shchukin, rico comerciante de textiles de \
Moscú y uno de los primeros grandes coleccionistas de Matisse, que lo destinaba al \
comedor de su palacete. Matisse lo pinta en 1908 en una armonía \
azul y verde, y luego lo repinta por completo en rojo; el coleccionista acepta ese \
cambio y recibe el lienzo en Moscú. Retoma un tema que Matisse había tratado \
en 1897 en La mesa puesta, cuadro aún marcado por el impresionismo. Tras la \
revolución de 1917, la colección Shchukin es nacionalizada y se convierte en un museo \
de arte occidental moderno. Cuando este se disuelve en 1948, sus obras se reparten \
entre el Museo Pushkin de Moscú y el Hermitage de San Petersburgo, donde La mesa puesta \
roja se encuentra desde entonces."""
facture = """
Matisse suprime casi toda profundidad: ni perspectiva ni sombra, el plano rojo \
corre de la parte inferior a la superior del lienzo. El espacio solo se sugiere con unos pocos indicios, la \
silla, el borde de la mesa, la ventana. El motivo azul, agrandado y simplificado, procede \
de una tela estampada que el pintor poseía. Los colores se aplican en planos francos, \
rodeados de trazos oscuros, al modo de los tejidos y las cerámicas decorativas que \
amaba. El rojo, el azul y el verde, casi puros, se equilibran por sus superficies, \
y la línea flexible de los arabescos responde a la curva de la espalda de la criada."""
details = [
  "El motivo del mantel, que continúa sin ruptura sobre la pared.",
  "Las dos garrafas de vidrio, una roja, otra de un amarillo dorado.",
  "La criada inclinada, cuyo moño recoge las curvas de los arabescos.",
  "Los árboles en flor blancos del jardín, tras la ventana.",
  "La firma y la fecha 1908, abajo a la izquierda.",
]
themes = ["interior", "decoración", "rojo", "naturaleza muerta", "coleccionista"]
anecdote = """
La tela estampada con motivos azules, una tela de Jouy, Matisse la habría descubierto, \
según se cuenta, desde la imperial de un ómnibus, en una tienda parisina. La \
conservó toda su vida y la hizo figurar en otros varios cuadros."""
salle = 2
mur = "ouest"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "Montañas en Colliure"
artiste = "André Derain"
annee = "1905"
image = "montagnes-collioure.jpg"
technique = "Óleo sobre lienzo, 81,3 × 100,3 cm"
collection = "Galería Nacional de Arte, Washington"
note = "En el verano de 1905, Derain pinta junto a Matisse en Colliure: árboles de troncos rojos, follajes azules, montañas anaranjadas."
description = """
En primer plano, un campo de hierba amarillo verdosa está atravesado por un sendero violeta. En el \
medio, un bosquecillo de pequeños árboles mediterráneos alza troncos retorcidos de un \
rojo vivo y follajes azules y verdes, aplicados con pinceladas cortas dispuestas en \
abanico. Detrás, las colinas se escalonan en grandes franjas anaranjadas, amarillas y rojas, \
y las montañas del fondo, azul ultramar y violetas, recortan sus crestas sobre un \
cielo verde agua surcado de nubes claras. Ningún personaje, ninguna casa: solo \
la vegetación y el relieve, bajo una luz que parece venir de todas partes a la vez y \
no proyecta ninguna sombra. La firma de Derain aparece abajo a la izquierda, medio \
perdida en la hierba."""
evocation = """
Para Derain, el color no copia la naturaleza: traduce la sensación de la \
luz del Mediodía, tan intensa que parece devorar las sombras. En una carta a su \
amigo Vlaminck, evoca esa luz rubia y dorada que suprime las sombras, y su \
deseo de expresarla mediante el color puro. El cuadro es su puesta en práctica: los troncos \
rojos, los follajes azules y las montañas anaranjadas no existen tal cual, pero \
juntos transmiten el deslumbramiento de una tarde de verano. Se lee también en él la \
jubilosa emoción de un descubrimiento compartido: durante aquellas semanas en Colliure, Derain y \
Matisse se arrastran el uno al otro hacia una audacia que quizá ninguno de los dos habría \
osado solo. La obra resume el verano en que nació el fauvismo."""
histoire = """
En mayo de 1905, Matisse se instala en Colliure, pequeño puerto catalán de los \
Pirineos Orientales, e invita a Derain a unirse a él. Este llega a comienzos del \
verano, y los dos amigos pintan codo con codo el puerto, las barcas, los tejados y las \
colinas pobladas de viñas y olivos. Derain, que entonces tiene veinticinco años, \
trae a París numerosos lienzos, dibujos y bocetos. Varios paisajes de \
Colliure figuran en el Salón de Otoño de 1905, en la sala VII que vale a sus \
ocupantes el apodo de «fauves». El marchante Ambroise Vollard, que apoya entonces al \
joven pintor, lo enviará poco después a pintar Londres. El cuadro perteneció al \
coleccionista estadounidense John Hay Whitney, antes de ingresar en 1982 en la National Gallery \
of Art de Washington con la colección Whitney."""
facture = """
Derain mezcla dos maneras. En los follajes y la hierba, conserva de la lección \
neoimpresionista la pincelada separada, pero la alarga en comas y rayados \
nerviosos que recuerdan a Van Gogh, cuya retrospectiva había visto en París en 1901. \
En las montañas y el cielo, por el contrario, extiende el color en amplios planos \
sinuosos, rodeados de azul. Los complementarios chocan sin transición: rojo contra \
verde, naranja contra azul. En algunos lugares, el lienzo dejado desnudo entre las pinceladas añade \
su luz blanca al conjunto. El resultado participa a la vez del tapiz y de la \
vidriera."""
details = [
  "Los troncos rojos y sinuosos de los árboles, que se retuercen como llamas.",
  "Los follajes azules, hechos de pequeñas pinceladas dispuestas en abanico.",
  "El sendero violeta que atraviesa la hierba en primer plano.",
  "Las colinas anaranjadas y rojas, rodeadas por un trazo azul.",
  "La firma de Derain, abajo a la izquierda.",
]
themes = ["paisaje", "mediterráneo", "luz", "fauvismo", "colliure"]
anecdote = """
En Colliure, un «camino del fauvismo» señalizado a través de la ciudad presenta \
reproducciones de los cuadros de Matisse y de Derain en los mismos lugares donde plantaron \
su caballete en 1905. Así se pueden comparar sus colores con el paisaje real."""
salle = 2
mur = "sud"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Caballo azul I"
artiste = "Franz Marc"
annee = "1911"
image = "cheval-bleu.jpg"
technique = "Óleo sobre lienzo, 112 × 84,5 cm"
collection = "Städtische Galerie im Lenbachhaus, Múnich"
note = "Un joven caballo azul, con la cabeza inclinada, ante colinas rojas y amarillas: la imagen misma del Jinete Azul."
description = """
Un joven caballo azul está de pie, casi de frente, y ocupa toda la altura del \
lienzo. Su cabeza, inclinada hacia el suelo y vuelta hacia la izquierda, está enmarcada por una \
crin azul noche; sus largas patas finas y algo rígidas son las de un \
potro. Su cuerpo pasa del azul más claro, casi blanco en el pecho y el \
cuello, al azul profundo de los flancos y los cascos. A su alrededor, el paisaje está \
hecho de grandes colinas redondeadas: rosa y violeta a la derecha, amarilla en el centro, azul \
arriba, bajo un cielo rosa. En primer plano, el suelo es rojo y verde, y una planta \
de grandes hojas verdes se alza a la derecha, como para responder a la curva del \
animal."""
evocation = """
Para Franz Marc, el animal es más puro que el hombre y está más cerca de la armonía del \
mundo: pintar un caballo es intentar ver la naturaleza a través de sus ojos. En una \
carta a August Macke de diciembre de 1910, expone su simbolismo de los colores: el azul \
es el principio masculino, austero y espiritual, el amarillo el principio femenino, suave y \
sensual, y el rojo la materia, brutal y pesada, que los otros dos deben \
combatir. El caballo azul, en medio de las colinas amarillas y rojas, se convierte así en \
la imagen de un alma joven y meditativa en un mundo cargado de materia. Se ha visto en él una \
suerte de autorretrato espiritual del pintor, y un manifiesto del Jinete Azul, el grupo \
que funda ese mismo año con Kandinsky."""
histoire = """
Marc pinta este cuadro en 1911 en Sindelsdorf, pueblo de la Alta Baviera donde se \
ha instalado con Maria Franck al pie de los Prealpes, y donde observa largamente a los \
caballos en los prados. Ese mismo año, con Vasili Kandinsky, funda el Jinete \
Azul, Der Blaue Reiter, cuya primera exposición se inaugura en Múnich en diciembre de 1911, \
y prepara el almanaque que aparece en la primavera de 1912. El cuadro entra en la colección \
de Bernhard Koehler, industrial berlinés y mecenas de Marc y de Macke. En 1965, la \
fundación Bernhard Koehler lo dona a la Lenbachhaus, que había recibido en 1957 la donación \
de Gabriele Münter, pintora y compañera de Kandinsky. Así es como Múnich se \
convirtió en la gran casa del Jinete Azul."""
facture = """
Marc estudió y enseñó durante mucho tiempo la anatomía de los animales, pero aquí simplifica la \
forma en grandes curvas. El cuerpo del caballo está modelado por degradados de azul, del \
blanco al azul oscuro, mientras que el paisaje se trata en planos casi puros. Las \
colinas retoman el dibujo redondeado del cuello y del lomo, de modo que el animal y \
el paisaje forman una única composición rítmica. El punto de vista, bajo y cercano, \
hace monumental al joven caballo. El color, liberado de toda verosimilitud, debe \
mucho a Gauguin y al fauvismo, pero aquí está cargado de un sentido simbólico."""
details = [
  "La cabeza inclinada y la mirada baja, como perdida en sus pensamientos.",
  "El pecho casi blanco, que capta la luz.",
  "Las largas patas finas del potro, algo torpes.",
  "La planta verde a la derecha, cuyas hojas responden a la curva del caballo.",
  "Las colinas amarillas, rosas y violetas que ondulan tras él.",
]
themes = ["animal", "caballo", "espiritualidad", "color simbólico", "jinete azul"]
anecdote = """
El más célebre cuadro de caballos de Marc, La torre de los caballos azules (1913), fue \
confiscado por los nazis en 1937 en la Nationalgalerie de Berlín como «arte degenerado». \
Su rastro se pierde al final de la Segunda Guerra Mundial: todavía se le busca."""
