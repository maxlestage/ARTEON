[[oeuvres]]
titre = "Paseo"
artiste = "August Macke"
annee = "1913"
image = "promenade.jpg"
technique = "Óleo sobre cartón, 51 × 57 cm"
collection = "Städtische Galerie im Lenbachhaus, Múnich"
note = "Paseantes sin rostro bajo los árboles de un parque: el mundo apacible y luminoso de August Macke, un año antes de su muerte."
description = """
Bajo grandes árboles de troncos violetas y azules, una pareja pasea por un parque. \
El hombre, de perfil, lleva un canotier y un traje oscuro; la mujer, de espaldas, vestida \
con un largo vestido azul y rojo y tocada con un sombrero rojo, sostiene una sombrilla \
blanca. Más lejos, dos siluetas apoyadas en un murete miran a lo lejos. A la derecha, \
una mujer tocada de blanco, de rostro apenas indicado, queda cortada por el borde del \
cuadro. El follaje forma sobre ellos una bóveda de verdes luminosos, y el suelo \
amarillo y rosa parece bañado de sol. Nadie nos mira: cada cual está absorto \
en su paseo o en su contemplación, y la escena respira la calma de una tarde de verano."""
evocation = """
Macke pinta un mundo sin dramas: paseantes dominicales, mujeres con sombrilla, \
niños ante los escaparates o a orillas de los lagos. Donde Kirchner ve en la ciudad \
un lugar de angustia, él ve un lugar de armonía, donde el hombre vive en concordia con la \
naturaleza. Las figuras sin rostro no resultan inquietantes: se convierten en tipos \
universales, en formas coloreadas entre los árboles, y cada cual puede reconocerse en ellas. Se ha \
visto en ello una visión casi idílica de la vida burguesa de antes de 1914, como un paraíso \
profano. Esta dicha tranquila adquiere a posteriori un valor conmovedor: un año después, \
estalla la guerra y Macke muere en las primeras semanas, a los veintisiete años."""
histoire = """
En 1913, Macke está en la cumbre de su arte. Unido desde 1910 a Franz Marc, ha participado en \
la aventura del Jinete Azul y en su almanaque, antes de tomar distancia con el \
misticismo de Kandinsky. En París, en 1912, conoció a Robert Delaunay, cuyas \
investigaciones sobre el color lo marcaron profundamente. En el otoño de 1913, se instala \
con su familia en Hilterfingen, a orillas del lago de Thun, en Suiza, donde pinta \
numerosas escenas de paseantes, de lagos y de escaparates. Como el Caballo azul de Marc, \
este cuadro perteneció a Bernhard Koehler, tío de la esposa del pintor y mecenas del \
grupo; ingresó en la Lenbachhaus en 1965 con la donación de su fundación."""
facture = """
Macke simplifica las formas en grandes planos de color, rodeados de contornos flexibles. Los \
rostros se suprimen o se reducen a una mancha, los cuerpos a siluetas. Toma \
prestada del cubismo la geometría de las formas y de Delaunay la idea de que el color, por sus \
contrastes, crea por sí solo la luz y el movimiento: el rojo del vestido vibra \
contra el verde del follaje, el azul contra el amarillo del suelo. La pincelada sigue siendo visible y \
rápida, pero la composición está rigurosamente construida, con los troncos enmarcando la \
escena como bastidores de teatro. Sobre el cartón, la pintura se ha agrietado en \
algunos puntos."""
details = [
  "La sombrilla blanca de la mujer, la mancha más clara del cuadro.",
  "El canotier del hombre, ceñido por una cinta negra.",
  "Las dos siluetas apoyadas en el murete, en el centro derecha.",
  "Los troncos violetas y azules que enmarcan la escena como un telón.",
  "Las finas craqueladuras de la pintura, visibles sobre el cartón.",
]
themes = ["paseo", "parque", "ocio", "armonía", "jinete azul"]
anecdote = """
Al enterarse de la muerte de su amigo, Franz Marc escribió un homenaje en el que afirmaba que, privado \
