[[oeuvres]]
titre = "Autorretrato con physalis"
artiste = "Egon Schiele"
annee = "1912"
image = "autoportrait-physalis.jpg"
technique = "Óleo y gouache sobre madera, 32,2 × 39,8 cm"
collection = "Leopold Museum, Viena"
note = "Schiele a los veintidós años, con el rostro atormentado y la mirada de soslayo, junto a una rama de physalis de faroles rojos."
description = """
El joven pintor se muestra de busto, vestido con un chaleco negro abotonado hasta el cuello, con el \
cuerpo vuelto hacia la derecha y la cabeza ligeramente echada hacia atrás. Nos mira \
de reojo, con las cejas alzadas, con una expresión a la vez altiva, inquieta y \
provocadora. Sus cabellos oscuros se erizan en mechones desgreñados. Su rostro, pintado en \
tonos de carne, gris, azul y rojo, parece magullado. A la izquierda, una rama de \
physalis, planta de frutos envueltos en un farolillo rojo vivo, despliega sus tallos \
finos y sus hojas marchitas sobre un fondo blanco. Una forma gris, como una sombra, \
se extiende tras la cabeza. Abajo a la derecha, la firma y la fecha están inscritas en \
mayúsculas dentro de un bloque cuadrado."""
evocation = """
Schiele pintó y dibujó más de un centenar de autorretratos, en los que se pone en escena \
sin complacencia, flaco, crispado, a veces desnudo. Este es uno de los más célebres. La \
mirada de soslayo, a la vez recelosa y desafiante, parece sopesar al espectador. Se ha visto en él \
la imagen del artista como un ser aparte, incomprendido por la sociedad, frágil y \
orgulloso a la vez. Los physalis, frutos de otoño de envoltura roja, \
introducen una nota de color vivo, que algunos interpretan como una alusión al \
paso del tiempo. Pintado como pareja de un retrato de su compañera Wally Neuzil, del mismo \
formato, el cuadro forma con él una pareja que sigue siendo una de las imágenes más fuertes \
de la Viena de 1912, inquieta y sensual."""
histoire = """
En 1912, Schiele tiene veintidós años. Dejó la Academia de Bellas Artes de Viena en \
1909 y se ha emancipado de la influencia de Klimt, que sin embargo lo apoya. Ese año \
es también el de una prueba: establecido en Neulengbach, al oeste de Viena, con Wally \
Neuzil, es detenido en primavera, acusado de haber raptado a una menor; la acusación \
se desvanece, pero es condenado por haber dejado dibujos eróticos a la vista de niños \
y pasa veinticuatro días en prisión. El cuadro perteneció más tarde al \
coleccionista vienés Rudolf Leopold, oftalmólogo, que reunió a partir de los \
años cincuenta la mayor colección de obras de Schiele del mundo. Es hoy \
una de las piezas maestras del Leopold Museum, abierto en 2001."""
facture = """
Schiele trabaja sobre un pequeño panel de madera, de superficie lisa, donde cada pincelada \
permanece visible. El rostro se construye con pinceladas nerviosas de colores \
inesperados, azules, rojos, violetas, que le dan el aspecto de una carne viva. El \
dibujo, su terreno predilecto, sigue siendo preponderante: contornos angulosos, líneas \
tensas de la nuca y de los hombros. El fondo blanco, trabajado con amplios brochazos, \
aísla la figura como sobre una hoja de papel. La composición está descentrada: el \
cuerpo es empujado hacia la derecha y cortado por el borde, dejando que la rama ocupe la \
mitad izquierda, un encuadre que recuerda las estampas japonesas."""
details = [
  "Los ojos vueltos hacia un lado, bajo unas cejas alzadas.",
  "Las pinceladas azules y rojas que jaspean el rostro.",
  "Los pequeños faroles rojos de los physalis, arriba y abajo a la izquierda.",
  "La forma gris que flota tras la cabeza, como una sombra.",
  "La firma EGON SCHIELE 1912, inscrita en un cuadrado abajo a la derecha.",
]
themes = ["autorretrato", "identidad", "viena", "angustia", "physalis"]
anecdote = """
Su pareja, el Retrato de Wally Neuzil, fue embargado en Nueva York en 1998, al final de un \
préstamo al MoMA, a petición de los herederos de una marchante de arte expoliada bajo el nazismo. \
Tras doce años de procedimiento, un acuerdo permitió su regreso a Viena en 2010."""
