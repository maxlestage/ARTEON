[[oeuvres]]
titre = "Potsdamer Platz"
artiste = "Ernst Ludwig Kirchner"
annee = "1914"
image = "potsdamer-platz.jpg"
technique = "Óleo sobre lienzo, 200 × 150 cm"
collection = "Neue Nationalgalerie, Berlín"
note = "Dos prostitutas sobre una isleta de la plaza más animada de Berlín, en vísperas de la Gran Guerra."
description = """
En primer plano, dos mujeres elegantes se sitúan sobre una isleta circular, en medio de \
la calzada verde de la plaza. La de la derecha, con abrigo azul de cuello blanco, lleva un \
sombrero de plumas y mira de frente, con el rostro verdoso y los labios rojos. \
La de la izquierda, de perfil, está envuelta en negro y cubierta con un velo. Tras \
ellas, la plaza se abre en perspectiva picada: transeúntes de negro, siluetas \
angulosas, cruzan la calzada o bordean las aceras. Al fondo, a la izquierda, se \
alzan un edificio con cúpula y la fachada rosa de arcadas de la estación de Potsdam; a la \
derecha, una hilera de casas blancas. Las dos mujeres parecen aisladas sobre su \
pedestal, mientras los hombres giran en torno a ellas."""
evocation = """
Las dos mujeres son prostitutas, figuras que Kirchner pinta sin descanso en sus \
escenas callejeras berlinesas: objetos de deseo y de transacción, encarnan para él \
la ciudad moderna, fascinante e inquietante. Aisladas en su isleta como sobre un escenario \
o un pedestal, se ofrecen a las miradas de los hombres de negro que las rozan. La \
perspectiva volcada, los cuerpos estirados y los colores ácidos traducen el nerviosismo, \
el anonimato y la velocidad de la metrópolis. Se ha visto en el velo negro de la mujer de la \
izquierda un disfraz de viuda, que usaban algunas prostitutas para escapar de la \
policía, y que adquiere una resonancia siniestra en 1914, el año en que estalla la guerra. El \
cuadro expresa la angustia de un mundo al borde del derrumbe."""
histoire = """
Kirchner deja Dresde por Berlín en el otoño de 1911. El grupo Die Brücke, que había \
fundado en 1905 con Erich Heckel, Karl Schmidt-Rottluff y Fritz Bleyl, se disuelve en \
1913. Entregado a sí mismo, emprende una serie de una decena de grandes escenas callejeras, \
pintadas entre 1913 y 1915, de las que Potsdamer Platz es una de las más ambiciosas. La \
plaza, cruce de líneas de tranvía y de estaciones, es entonces uno de los lugares más \
animados de Europa. Movilizado en 1915, Kirchner se derrumba física y moralmente, y \
parte a curarse a Suiza, donde pasará el resto de su vida. Declarado «degenerado» por \
los nazis, se quita la vida en 1938. El cuadro se encuentra hoy en la Neue \
Nationalgalerie, a unos cientos de metros de la plaza que representa."""
facture = """
Kirchner pinta rápido, con largos trazos entrecortados y angulosos que dan a las formas una \
energía nerviosa. Las figuras se alargan, los rostros se convierten en máscaras. La \
perspectiva está deliberadamente falseada: la plaza se inclina hacia el espectador, mientras \
que la isleta circular, vista desde arriba, contradice la vista frontal de las dos mujeres. La \
paleta está dominada por verdes y azules fríos, realzados por el rosa de la estación y \
el blanco de los cuellos. Se reconoce en ella la influencia del grabado en madera, que Kirchner \
practicaba intensamente, con sus contornos cortantes, y la de las esculturas \
africanas y oceánicas que había estudiado en el museo de etnografía de Dresde."""
details = [
  "Los rostros verdosos y los labios rojos de las dos mujeres, como máscaras.",
  "El velo negro que cubre el rostro de la mujer de la izquierda.",
  "La isleta circular, vista desde arriba, sobre la que se sitúan.",
  "Las siluetas negras de los transeúntes, alargadas como sombras.",
  "Al fondo, la fachada rosa de arcadas de la estación de Potsdam.",
]
themes = ["ciudad", "prostitución", "modernidad", "berlín", "angustia"]
anecdote = """
La circulación de la Potsdamer Platz era tal que en 1924 se instaló allí uno de los \
primeros semáforos de Europa, una torre coronada por un reloj. Una réplica \
de esa torre se alza hoy en la plaza reconstruida."""
