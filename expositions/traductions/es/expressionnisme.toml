[[oeuvres]]
titre = "Jeanne Hébuterne"
artiste = "Amedeo Modigliani"
annee = "1919"
image = "jeanne-hebuterne.jpg"
technique = "Óleo sobre lienzo, 91,4 × 73 cm"
collection = "Museo Metropolitano de Arte, Nueva York"
note = "La compañera de Modigliani, sentada, con la mejilla apoyada en la mano: uno de los últimos retratos que le hizo."
description = """
Una joven de largos cabellos castaño rojizos está sentada de tres cuartos, con el codo apoyado \
en el respaldo de un sillón ocre, la cabeza ligeramente inclinada contra su mano doblada. \
Lleva una amplia camisa blanca de finos tirantes, que deja al descubierto sus hombros y \
sus brazos. Su cuello es muy largo, su rostro ovalado, su nariz recta y alargada, su boca pequeña \
y roja. Sus ojos almendrados, azul pálido, carecen de pupilas. Su otro brazo desciende \
a lo largo del cuerpo hasta el borde inferior del cuadro. El fondo está hecho de dos planos de color, \
uno pardo verdoso a la izquierda, otro gris azulado a la derecha, aplicados con pinceladas libres. Arriba a la \
derecha, el pintor firmó modigliani, en minúsculas."""
evocation = """
Modigliani pintó a Jeanne Hébuterne más de una veintena de veces, y ninguno de estos \
retratos busca el parecido fotográfico. El alargamiento del cuello y del rostro, \
los ojos vacíos, la pose ensimismada hacen de ella una figura casi intemporal, entre el icono \
y la madona del Renacimiento, que el pintor, nacido en Livorno, conocía desde \
la infancia. Los ojos sin pupilas, frecuentes en su obra, dan a la modelo un aire de \
ensoñación interior, como si mirara dentro de sí misma. A menudo se ha relacionado la \
dulzura melancólica de este retrato con el destino trágico de la pareja: en 1919, Jeanne \
espera su segundo hijo, y ninguno de los dos vivirá más allá de enero de 1920. El \
cuadro expresa ternura, pero también una forma de retraimiento."""
histoire = """
Jeanne Hébuterne, alumna de la academia Colarossi, conoce a Modigliani en 1917; ella \
no tiene veinte años, él tiene treinta y dos. A pesar de la oposición de su familia, católica \
y burguesa, se instala con él. En 1918, la pareja parte a Niza, donde nace en \
noviembre su hija, que también se llama Jeanne. De regreso en París en 1919, viven en \
la calle de la Grande-Chaumière, en Montparnasse. Minado por la tuberculosis, Modigliani muere \
el 24 de enero de 1920 en el hospital de la Charité. Al día siguiente, Jeanne, embarazada de ocho \
meses, se arroja por la ventana del apartamento de sus padres. El cuadro perteneció \
a los coleccionistas neoyorquinos Nate B. Spingold y su esposa, que lo donaron al \
Metropolitan Museum en 1956."""
facture = """
Modigliani simplifica las formas según un canon muy personal: óvalo del rostro, cuello en \
columna, hombros caídos, manos afiladas. Este vocabulario procede de su práctica de la \
escultura, entre 1909 y 1914, cuando, alentado por Brancusi, tallaba en la \
piedra cabezas alargadas inspiradas en las máscaras africanas y el arte arcaico. El \
color se aplica en capas finas y sordas, ocres, blancos, grises azulados, sin brillo \
fauve. El contorno, flexible y continuo, envuelve la figura como un trazo de dibujo. \
La influencia de Cézanne se lee en la construcción del fondo con planos de color \
yuxtapuestos y en la pose inclinada de la modelo."""
details = [
  "Los ojos azul pálido, sin pupilas.",
  "La mano doblada contra la mejilla, de dedos larguísimos.",
  "El cuello estirado, casi en columna.",
  "El fondo dividido en dos planos de color, pardo verdoso y gris azulado.",
  "La firma modigliani, en minúsculas, arriba a la derecha.",
]
