[exposition]
ordre = 180
nom_court = "Expresionismo"
mouvement = "Fauvismo y expresionismo"
cadre = "bois"
couleur = "#2b4c9b"
titre = "Fauves y expresionistas, el color liberado"
artiste = "Matisse, Derain, Kirchner, Marc, Macke, Schiele, Modigliani…"
dates = "1904–1919"
accroche = "Exposición virtual · Lenbachhaus, Múnich"
introduction = """
A comienzos del siglo XX, una generación de pintores libera el color de su función \
descriptiva: en París, los «fauves» Matisse y Derain pintan rostros verdes y \
montañas anaranjadas; en Alemania y Austria, Kirchner, Marc, Macke o Schiele hacen \
de él el lenguaje de la emoción, de la angustia y del espíritu. La visita sigue esta onda \
expansiva desde Colliure hasta Berlín, de Múnich a Viena y a Montparnasse, con Modigliani y \
Paula Modersohn-Becker. El edificio se inspira en la Lenbachhaus de Múnich, la casa del \
Jinete Azul: un alto vestíbulo contemporáneo como el del ala diseñada por Norman \
Foster, salas blancas bañadas de luz y la sucesión de estancias de la villa del pintor \
Franz von Lenbach."""
vitrine = "cheval-bleu.jpg"

[musee]
nom = "Lenbachhaus"
ville = "Múnich, Alemania"
architecte = "Gabriel von Seidl"
construction = "1887–1891"
presentation = """
La Lenbachhaus fue en origen la villa del pintor Franz von Lenbach, retratista predilecto de \
la Alemania imperial, construida para él por Gabriel von Seidl al modo de una \
villa toscana, con sus fachadas ocre y su jardín. Tras la muerte del pintor, la ciudad \
de Múnich la adquiere en 1924 y abre en ella, en 1929, su galería municipal. Todo cambia en \
1957: con motivo de su ochenta cumpleaños, Gabriele Münter, compañera de Kandinsky, regala al \
museo las centenares de obras del Jinete Azul que había ocultado durante el régimen nazi. \
La Lenbachhaus se convierte en la casa del Blaue Reiter, de Kandinsky, Marc, Macke, Jawlensky \
y Münter. Renovada entre 2009 y 2013, recibió de Norman Foster un ala nueva revestida \
de tubos de color latón, cuyo alto vestíbulo, donde gira el Wirbelwerk de Olafur Eliasson, \
comunica la villa histórica con las galerías contemporáneas."""
ici = """
ARTEON entrelaza las dos épocas. El vestíbulo, de 11 metros de altura y casi blanco, recibe \
al visitante por el sur, como el ala de Foster. Al oeste, la Sala I · Los fauves; al \
norte, la Sala II · El Jinete Azul, la más blanca, bañada de luz como las \
galerías nuevas. Al este comienza la sucesión de estancias de la villa: la Sala III · Worpswede y \
Berlín, de paredes crema, se abre por una puerta al este a la Sala IV · Viena y \
Montparnasse, donde termina la visita. Cuadradas, de 10 metros de lado y 5 metros \
de altura, estas dos salas son las más íntimas."""

