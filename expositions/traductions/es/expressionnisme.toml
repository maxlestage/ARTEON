[[artistes]]
nom = "Henri Matisse"
vie = "Le Cateau-Cambrésis (Norte), 31 de diciembre de 1869 – Niza, 3 de noviembre de 1954"
biographie = """
Hijo de un comerciante de granos del norte de Francia, Henri Matisse se destina primero al derecho y \
trabaja como pasante de procurador. En 1890, inmovilizado por una apendicitis, recibe de su \
madre una caja de colores: es una revelación. Parte hacia París, ingresa en 1895 en \
la Escuela de Bellas Artes, en el taller de Gustave Moreau, descubre el impresionismo y a \
Cézanne, luego la luz del Mediodía en Córcega. En 1898, se casa con Amélie Parayre. Tras un \
verano en Saint-Tropez junto a Signac en 1904, pinta en Colliure con Derain, en 1905, \
los lienzos que causan escándalo en el Salón de Otoño y lo convierten en el jefe de los «fauves». \
Apoyado por los Stein, luego por los coleccionistas rusos Shchukin y Morozov, \
abre una academia y viaja a Marruecos. A partir de 1917, trabaja sobre todo en Niza, \
donde pinta sus odaliscas. Gravemente enfermo en 1941, inventa en sus últimos \
años los gouaches recortados y concibe la capilla del Rosario de Vence. Muere en \
Niza en 1954."""
style = """
Matisse hace del color el motor de la pintura: aplicado en planos puros, \
construye el espacio, la luz y la emoción sin recurrir al modelado ni a la \
perspectiva. Su dibujo, de gran economía, busca el arabesco esencial. Soñaba \
con un arte de equilibrio y serenidad, decorativo en el sentido más noble. Es \
uno de los grandes inventores de la pintura del siglo XX; sus interiores, sus papeles \
recortados y su libertad cromática han alimentado la abstracción estadounidense y \
generaciones de pintores y creadores."""

[[artistes]]
nom = "André Derain"
vie = "Chatou (Yvelines), 10 de junio de 1880 – Garches (Altos del Sena), 8 de septiembre de 1954"
biographie = """
Hijo de un comerciante acomodado de Chatou, André Derain renuncia a los estudios de ingeniería por \
la pintura. En 1900, conoce a Maurice de Vlaminck, con quien comparte un taller \
en Chatou, y luego a Henri Matisse, que convence a sus padres de que lo dejen pintar. Tras \
el servicio militar, pasa el verano de 1905 con Matisse en Colliure y expone en el Salón \
de Otoño entre los «fauves». El marchante Ambroise Vollard lo envía a pintar Londres: \
sus vistas del Támesis figuran entre las cumbres del fauvismo. Desde 1907, cercano a \
Picasso, se orienta hacia una pintura más construida, inspirada en Cézanne y en \
el arte africano, y luego hacia un retorno a la tradición de los maestros antiguos. Movilizado \
durante toda la Gran Guerra, conoce después un gran éxito y crea decorados \
para los Ballets Rusos. Su viaje a Alemania en 1941, por invitación de las autoridades \
nazis, empaña duraderamente su reputación. Muere en 1954 a consecuencia de un accidente de \
tráfico."""
style = """
Derain es, con Matisse, el inventor del fauvismo: colores puros y arbitrarios, \
pinceladas anchas o fragmentadas, contrastes de complementarios que expresan \
el deslumbramiento de la luz. Pero no se queda ahí: curioso por todo, pasa \
luego por una geometría cezanniana, y después busca en los primitivos, los iconos y \
los maestros clásicos un arte más grave y sólido. Sus lienzos de 1905 y 1906, en \
Colliure y en Londres, siguen siendo los más célebres y figuran entre las imágenes más \
vivas de principios de siglo."""

[[artistes]]
nom = "Ernst Ludwig Kirchner"
vie = "Aschaffenburg (Baviera), 6 de mayo de 1880 – Frauenkirch, cerca de Davos (Suiza), 15 de junio de 1938"
biographie = """
Hijo de un químico especialista en papel, Ernst Ludwig Kirchner estudia arquitectura en \
la Escuela Técnica Superior de Dresde, donde traba amistad con Erich Heckel, Karl \
Schmidt-Rottluff y Fritz Bleyl. Juntos, fundan en 1905 el grupo Die Brücke, «el \
puente», que quiere tender un puente hacia el arte del futuro. En sus talleres y a \
orillas de los lagos de Moritzburg, pintan desnudos al aire libre, graban en madera y \
viven en comunidad. Kirchner descubre el arte africano y oceánico en el museo de \
etnografía de Dresde. En 1911, se instala en Berlín, donde pinta las escenas \
callejeras que le dan fama. Su Crónica de Die Brücke, juzgada demasiado personal por sus \
compañeros, provoca la disolución del grupo en 1913. Movilizado en 1915, se derrumba \
y parte en 1917 a curarse a Suiza, cerca de Davos, donde pinta las montañas y los \
campesinos. En 1937, los nazis retiran de los museos alemanes más de seiscientas de sus \
obras. Al año siguiente, se quita la vida en Frauenkirch."""
style = """
Kirchner es la figura central del expresionismo alemán. Su pintura se basa en \
un trazo anguloso y rápido, formas estiradas y colores crudos, a menudo ácidos, \
que traducen una tensión psicológica más que una apariencia. El grabado en madera, \
que practica con pasión, alimenta sus contrastes cortantes. Sus escenas callejeras \
berlinesas se han convertido en la imagen misma de la metrópolis moderna, nerviosa e \
inquietante, y han marcado duraderamente el arte figurativo alemán, hasta los \
neoexpresionistas de los años ochenta."""

[[artistes]]
nom = "Franz Marc"
vie = "Múnich, 8 de febrero de 1880 – Braquis, cerca de Verdún, 4 de marzo de 1916"
biographie = """
Hijo del pintor paisajista Wilhelm Marc, Franz Marc piensa primero en la teología antes \
de ingresar en 1900 en la Academia de Bellas Artes de Múnich. Dos estancias en París, en 1903 \
y 1907, le hacen descubrir el impresionismo y luego a Van Gogh y Gauguin. Atraviesa un \
largo período de dudas y vive en parte de clases de anatomía animal. En 1910, \
conoce a August Macke, luego a Vasili Kandinsky, y se instala en Sindelsdorf, en \
la Alta Baviera, con Maria Franck, con quien se casa en 1911. Ese año, funda con \
Kandinsky el Jinete Azul y prepara la exposición y el almanaque que llevan ese nombre. \
Sus caballos, sus corzos, sus tigres y sus vacas de colores simbólicos \
lo imponen como uno de los grandes pintores de su generación. En contacto con Delaunay y \
los futuristas, sus composiciones se fragmentan en prismas, hasta la abstracción en \
1914. Movilizado desde el comienzo de la guerra, muere por la esquirla de un obús cerca de Verdún \
en marzo de 1916, a los treinta y seis años."""
style = """
Marc quiso pintar el mundo tal como lo perciben los animales, a quienes consideraba más \
puros y más cercanos a la armonía de la naturaleza que los hombres. Sus colores no \
describen: significan, según un simbolismo preciso en el que el azul es el espíritu, \
el amarillo la dulzura y el rojo la materia. Sus composiciones rítmicas de curvas, luego \
de planos prismáticos, conducen de la figuración a la abstracción. Figura mayor del \
Jinete Azul, contribuyó a hacer del color un lenguaje espiritual."""

[[artistes]]
nom = "August Macke"
vie = "Meschede (Westfalia), 3 de enero de 1887 – Perthes-lès-Hurlus (Marne), 26 de septiembre de 1914"
biographie = """
Nacido en Westfalia y criado en Colonia y luego en Bonn, August Macke estudia en la Academia de \
Bellas Artes y en la Escuela de Artes Aplicadas de Düsseldorf. Viaja a Italia, a \
los Países Bajos, a Bélgica y a París, donde descubre a los impresionistas en 1907. \
Se casa en 1909 con Elisabeth Gerhardt, cuyo tío, el industrial berlinés Bernhard \
Koehler, se convierte en su mecenas. Durante una estancia a orillas del Tegernsee, conoce a Franz \
Marc en 1910; la amistad de ambos pintores será una de las más fecundas de la época. \
Participa en el Jinete Azul y en su almanaque, antes de tomar distancia con el \
misticismo de Kandinsky. En 1912, con Marc, visita a Robert Delaunay en París, \
un encuentro decisivo. Organiza en Bonn en 1913 una exposición de expresionistas \
renanos, y luego pasa unos meses a orillas del lago de Thun. En abril de 1914, viaja a \
Túnez con Paul Klee y Louis Moilliet y trae de allí decenas de acuarelas. \
Movilizado en agosto, muere en Champaña pocas semanas después, a los veintisiete \
años."""
style = """
Macke es el más luminoso de los expresionistas alemanes. Menos atormentado que \
Kirchner, menos místico que Kandinsky o Marc, pinta un mundo de paseantes, de \
parques, de escaparates y de jardines, donde el color vivo expresa la alegría de vivir. Hace \
la síntesis del fauvismo, del cubismo y de los contrastes simultáneos de Delaunay: planos \
coloreados transparentes, figuras simplificadas, colores que crean la luz. Sus \
acuarelas de Túnez, de gran libertad, figuran entre las cumbres de la acuarela \
moderna."""

[[artistes]]
nom = "Egon Schiele"
vie = "Tulln (Baja Austria), 12 de junio de 1890 – Viena, 31 de octubre de 1918"
biographie = """
Hijo de un jefe de estación de Tulln, Egon Schiele pierde a su padre a los catorce años e ingresa a los \
dieciséis en la Academia de Bellas Artes de Viena, que abandona en 1909, cansado de su \
conservadurismo. Gustav Klimt, que lo admira, lo presenta a coleccionistas y a los \
talleres de la Wiener Werkstätte. Schiele se emancipa pronto del ornamento klimtiano para \
una pintura del cuerpo y de la angustia. En 1911, se instala con Wally Neuzil en \
Krumau, en Bohemia, y luego en Neulengbach, de donde los rumores los expulsan; en 1912, allí \
pasa veinticuatro días en prisión por unos dibujos considerados inmorales. En 1915, se casa con \
Edith Harms y es movilizado, destinado casi siempre a la retaguardia. En 1918, la exposición \
de la Secesión, donde ocupa la sala principal, le aporta por fin el éxito. Pero la \
gripe española se lleva a Edith, embarazada de seis meses, el 28 de octubre de 1918, y luego al propio Schiele \
tres días después. Tenía veintiocho años."""
style = """
Schiele es ante todo un dibujante virtuoso: su línea tensa, angulosa, a veces \
quebrada, basta para hacer surgir un cuerpo y un tormento. En sus retratos, sus \
autorretratos y sus desnudos, muestra cuerpos flacos, crispados, expuestos sin afeites, con \
una franqueza que causó escándalo. Sus colores, a menudo terrosos y realzados por rojos \
y anaranjados, acentúan la impresión de carne viva. Figura mayor del \
expresionismo vienés, su influencia ha crecido sin cesar desde los años \
sesenta."""

[[artistes]]
nom = "Amedeo Modigliani"
vie = "Livorno (Italia), 12 de julio de 1884 – París, 24 de enero de 1920"
biographie = """
Nacido en Livorno en una familia judía sefardí culta pero arruinada, Amedeo Modigliani, \
de salud frágil, estudia pintura en Livorno, Florencia y Venecia, nutrido de los maestros \
del Renacimiento. En 1906, se instala en París, primero en Montmartre y luego en \
Montparnasse. Entre 1909 y 1914, alentado por el escultor Constantin Brancusi, se \
consagra sobre todo a la escultura y talla cabezas de piedra alargadas, hasta que su \
salud lo obliga a renunciar a ella. De vuelta a la pintura, realiza los retratos de sus \
amigos, Soutine, Max Jacob, Cocteau, y una serie de desnudos; durante su exposición en la \
galería Berthe Weill, en 1917, la policía exige su retirada el mismo día de la inauguración. \
Sus marchantes, Paul Guillaume y luego Léopold Zborowski, lo apoyan. En 1917, \
conoce a Jeanne Hébuterne, que le da una hija en 1918. Minado por la tuberculosis, \
el alcohol y la miseria, muere en 1920 a los treinta y cinco años, en el momento en que su pintura \
empieza a venderse."""
style = """
Modigliani creó una figura humana inmediatamente reconocible: rostro ovalado, cuello \
estirado, nariz larga, ojos almendrados a menudo sin pupilas, hombros caídos. Este canon une \
la gracia de los pintores sieneses y de Botticelli, la simplificación de la escultura \
africana y arcaica y la construcción de Cézanne. Ni fauve ni cubista, permanece al \
margen de los movimientos de su tiempo, pero comparte con los expresionistas la voluntad de \
traducir una presencia interior más que un parecido."""

[[artistes]]
nom = "Paula Modersohn-Becker"
vie = "Dresde, 8 de febrero de 1876 – Worpswede (cerca de Bremen), 20 de noviembre de 1907"
biographie = """
Nacida en Dresde en una familia culta establecida en Bremen en 1888, Paula Becker sigue una \
formación de maestra, como desean sus padres, a la vez que toma clases de \
dibujo y pintura en Londres y en Berlín. En 1898, se une a Worpswede, colonia de \
artistas anidada en las turberas cerca de Bremen, donde traba amistad con la escultora \
Clara Westhoff, futura esposa del poeta Rilke. Entre 1900 y 1907, hace cuatro \
estancias en París, donde descubre a Cézanne, Gauguin, los Nabis y los retratos del \
Fayum. En 1901, se casa con el pintor Otto Modersohn, viudo y padre de una niña \
pequeña. Asfixiada por la vida conyugal y por el círculo de Worpswede, que juzga su \
pintura torpe, parte sola a París en 1906, donde pinta \
autorretratos y naturalezas muertas de una libertad nueva. De vuelta en Worpswede, \
muere en noviembre de 1907, dieciocho días después del nacimiento de su hija Mathilde, a los \
treinta y un años. Solo había vendido unos pocos cuadros; dejaba más de \
setecientos."""
style = """
Paula Modersohn-Becker superó el realismo sentimental de los pintores de Worpswede para \
llegar a una pintura de formas simples y macizas, de colores sordos y materia \
granulosa. Inspirada por Cézanne, Gauguin y el arte arcaico, pinta a las campesinas, los \
niños, las madres y sobre todo a sí misma, con una gravedad y una franqueza inéditas. \
Pionera del expresionismo alemán, es también una de las primeras mujeres en \
haber hecho de su propio cuerpo el tema de su arte."""
