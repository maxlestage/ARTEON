[[oeuvres]]
titre = "Autorretrato en el sexto aniversario de boda"
artiste = "Paula Modersohn-Becker"
annee = "1906"
image = "sixieme-anniversaire.jpg"
technique = "Óleo sobre cartón, 101,8 × 70,2 cm"
collection = "Museo Paula Modersohn-Becker, Bremen"
note = "Paula se pinta desnuda hasta las caderas, con las manos sobre un vientre redondeado: un gesto de una audacia inaudita para una mujer pintora en 1906."
description = """
La joven está de pie, de tres cuartos, desnuda hasta las caderas, con una sábana blanca \
anudada a la cintura. Lleva un largo collar de ámbar de gruesas cuentas ovaladas. Sus \
manos rodean su vientre redondeado, como para sostenerlo o protegerlo. Vuelve \
la cabeza hacia nosotros, con la mirada directa pero dulce, una leve sonrisa en los labios; su \
cabello castaño rojizo, partido por una raya en medio, está recogido hacia atrás. El fondo, \
de un verde pálido, está salpicado de pequeñas manchas verdes y amarillas, como un papel pintado \
florido. Abajo a la derecha, una inscripción en alemán, firmada con sus iniciales, indica \
que pintó este cuadro a los treinta años, el día de su sexto aniversario de \
boda."""
evocation = """
Este cuadro se considera a menudo el primer autorretrato desnudo pintado por una mujer \
en la historia del arte occidental. Paula no se muestra en él ni como musa ni como objeto de \
deseo, sino como sujeto: se mira y nos mira, serena y segura de sí. El \
vientre redondeado ha intrigado mucho, pues no estaba embarazada en aquel momento. Se ha visto en él \
la expresión de un deseo de hijo, o bien una metáfora de la creación: al \
dejar a su marido por París, sentía que por fin llegaba a ser ella misma y llevaba en su seno \
su obra. El cuadro une así lo íntimo y la afirmación de sí, la fecundidad y la \
libertad. Se adelanta varias décadas a las cuestiones que el arte feminista planteará sobre \
el cuerpo de las mujeres y la mirada que se posa sobre ellas."""
histoire = """
En febrero de 1906, tras cinco años de matrimonio con el pintor Otto Modersohn, Paula deja \
Worpswede, la colonia de artistas próxima a Bremen donde vive la pareja, para instalarse \
sola en París. Quiere trabajar, estudiar a los maestros modernos y vivir de su \
pintura. Allí, en la primavera de 1906, pinta este autorretrato. La inscripción \
habla de un sexto aniversario, cuando la pareja se había casado en mayo de 1901, lo que \
ha hecho correr mucha tinta. Otto se reúne con ella en París en otoño, y ella acepta \
volver con él a Worpswede en la primavera de 1907. El cuadro se conserva hoy en \
Bremen, en el Museo Paula Modersohn-Becker, abierto en 1927 en la Böttcherstraße por \
iniciativa del comerciante de café Ludwig Roselius, y considerado el primer museo \
del mundo consagrado a una mujer pintora."""
facture = """
Paula simplifica las formas en grandes volúmenes serenos, al modo de Gauguin y de \
Cézanne, a quienes había estudiado en París. El cuerpo está modelado con tonos cálidos y \
mates, rosa ocre y amarillo pálido, sin brillo ni detalle anecdótico. La materia, aplicada \
sobre el cartón en capas secas y granulosas, evoca el fresco o el temple. Los \
contornos están perfilados por un trazo oscuro. El fondo decorativo, tratado en manchas regulares, \
aplana el espacio y hace resaltar la figura como un icono. Se piensa también en los \
retratos funerarios del Fayum, pintados sobre madera en el Egipto romano, que había \
admirado en el Louvre."""
details = [
  "El largo collar de ámbar de gruesas cuentas, su único adorno.",
  "Las dos manos posadas sobre el vientre redondeado.",
  "La sábana blanca anudada en las caderas, pintada con amplias pinceladas.",
  "El fondo verde pálido salpicado de pequeñas manchas, como un papel pintado.",
  "La inscripción manuscrita en alemán, abajo a la derecha, firmada P. B.",
]
themes = ["autorretrato", "desnudo", "maternidad", "mujer artista", "libertad"]
anecdote = """
El poeta Rainer Maria Rilke, su amigo desde Worpswede, le consagró en 1908, un año \
después de su muerte, uno de sus más bellos poemas, Réquiem por una amiga."""
