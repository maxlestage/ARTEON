[[oeuvres]]
titre = "Los romanos de la decadencia"
artiste = "Thomas Couture"
annee = "1847"
image = "romains-de-la-decadence.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Thomas_Couture_-_Romans_during_the_Decadence_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 472 × 772 cm"
collection = "Museo de Orsay, París"
note = "Una orgía bajo las columnas de un templo, ante la mirada de piedra de los grandes antepasados: el triunfo del Salón de 1847. El lienzo, de casi ocho metros de longitud, se muestra aquí reducido."
description = """
En una vasta sala de columnatas corintias, abierta al fondo al cielo y a edificios de mármol, una multitud de romanos pone fin a una noche de fiesta. Sobre lechos cubiertos de telas, hombres y mujeres medio desnudos se abrazan, beben o se desploman. En el centro, una mujer vestida de blanco, tendida, mira al vacío con aire cansado. En primer plano, un hombre ebrio se ha derrumbado sobre el enlosado, con la cabeza echada hacia atrás; más arriba, a la derecha, otro, encaramado a un pedestal, acerca una copa a los labios de una estatua. Por todas partes, las estatuas de héroes y sabios dominan la escena con su blancura inmóvil. A la derecha, dos hombres con túnica, de pie, contemplan la orgía sin participar en ella; a la izquierda, un joven sentado sobre un alto pedestal permanece apartado, con gesto sombrío. En el suelo yacen ánforas, flores y paños."""
evocation = """
Couture coloca como epígrafe, en el folleto del Salón, unos versos del poeta latino Juvenal: más cruel que las armas, el lujo se ha abatido sobre Roma y venga al universo vencido. El cuadro es una lección de moral: un pueblo que ha conquistado el mundo se pierde en el placer, ante los ojos de sus antepasados de piedra, imágenes de las virtudes olvidadas de la República. Los críticos de 1847 vieron en él una alusión a su propia época: la Francia de Luis Felipe, dominada por una burguesía enriquecida y sacudida por escándalos, a pocos meses de la revolución de febrero de 1848. También puede leerse en él la ambigüedad de muchos cuadros académicos: el lienzo condena el libertinaje a la vez que ofrece a la mirada, con complacencia, los cuerpos que denuncia."""
histoire = """
Thomas Couture solo ha obtenido un segundo gran premio de Roma y busca un golpe de efecto. Trabaja varios años en este inmenso lienzo, que presenta en el Salón de 1847. El éxito es considerable: la crítica saluda a un nuevo maestro, capaz de unir el rigor del dibujo clásico y el color de los venecianos, y el cuadro entra en las colecciones del Estado. Hoy se encuentra en el Museo de Orsay, donde su formato, de casi ocho metros de ancho, lo convierte en uno de los mayores lienzos del museo. Este triunfo hace también de Couture un profesor muy solicitado: en el taller libre que abre poco después, independiente de la Escuela de Bellas Artes, forma a Édouard Manet y acoge a Puvis de Chavannes, al alemán Anselm Feuerbach y a numerosos alumnos llegados de América."""
facture = """
Couture compone como un director de escena: una arquitectura simétrica, columnas que marcan el ritmo del lienzo, un claro de cielo en el centro y figuras dispuestas en friso, como en un bajorrelieve antiguo. Toma de los venecianos, y sobre todo de los grandes banquetes de Veronés, la amplitud del decorado y la riqueza de las telas. Pero su ejecución es personal: tonos aplicados con franqueza, una pincelada a veces visible, veladuras ligeras sobre un boceto rápido. Expuso este método en un libro, Méthode et entretiens d'atelier, publicado en 1867. La paleta se mantiene contenida: marfil, ocres, grises de los mármoles, realzados por algunos rojos y azules profundos."""
details = [
  "Arriba a la derecha, el juerguista encaramado a un pedestal que acerca una copa a la boca de una estatua.",
  "Los dos hombres con túnica, de pie en el extremo derecho, que observan la fiesta sin participar en ella.",
  "El joven sentado a la izquierda sobre un alto pedestal, envuelto en su manto, apartado.",
  "La mujer de blanco en el centro, apoyada sobre el codo, cuya mirada cansada parece no ver nada.",
  "En primer plano, el ánfora, las flores y los paños abandonados sobre el enlosado.",
]
themes = ["antigüedad", "decadencia", "moral", "fiesta", "pintura de historia"]
anecdote = """
Édouard Manet pasa seis años en el taller de Thomas Couture. Las relaciones son tormentosas: el maestro juzga al alumno demasiado audaz, el alumno se burla de las poses afectadas de los modelos. Quince años después del triunfo de Los romanos, Manet será el pintor más discutido del Salón."""
salle = 2
mur = "sud"
position = 0.0
largeur = 4.5

[[oeuvres]]
titre = "La ejecución de Lady Jane Grey"
artiste = "Paul Delaroche"
annee = "1833"
image = "execution-de-lady-jane-grey.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:PAUL_DELAROCHE_-_Ejecución_de_Lady_Jane_Grey_(National_Gallery_de_Londres,_1834).jpg"
technique = "Óleo sobre lienzo, 246 × 297 cm"
collection = "National Gallery, Londres"
note = "Con los ojos vendados, la reina de nueve días busca a tientas el tajo: Delaroche convierte la historia inglesa en un drama de teatro."
description = """
En una sala sombría de pilares macizos, una joven con vestido de raso blanco está de rodillas sobre un cojín, con los ojos vendados por un lienzo. Tiende las manos ante sí, a tientas, hacia el tajo de madera colocado sobre la paja. Un hombre de edad, con manto negro forrado de piel, se inclina sobre ella y guía suavemente su mano. A la derecha, de pie, el verdugo aguarda, con jubón pardo y calzas rojas, una cuerda y un puñal en el cinto, la mano apoyada en el mango de su hacha. A la izquierda, dos damas de honor se desploman: una, sentada contra un pilar, ha perdido el conocimiento, con vestidos y joyas sobre las rodillas; la otra, de pie, oculta el rostro contra el muro. El cadalso está cubierto de paño negro."""
evocation = """
Bisnieta del rey Enrique VII, Lady Jane Grey es proclamada reina de Inglaterra en julio de 1553 por nobles protestantes que quieren apartar del trono a la católica María Tudor. Nueve días después es depuesta y encarcelada en la Torre de Londres; es decapitada el 12 de febrero de 1554, a los dieciséis o diecisiete años. Delaroche hace de ella la imagen misma de la inocencia sacrificada a la política: blancura del vestido, ceguera de la venda, manos que vacilan. Para el público parisino de 1834, la escena despertaba además recuerdos cercanos: los cadalsos de la Revolución, María Antonieta y, cuatro años después de la revolución de 1830, la caída de otra dinastía. Con frecuencia se ha comparado el cuadro con una escena de melodrama, congelada justo antes del golpe."""
histoire = """
Delaroche, entonces en la cumbre de su gloria, se ha especializado en la historia de Inglaterra, con Los hijos de Eduardo o Cromwell y Carlos I. Terminado en 1833, el lienzo causa sensación en el Salón de 1834. Adquirido por el príncipe ruso Anatole Demidoff, pasa después a Inglaterra, a manos de Lord Cheylesmore, cuyo hijo lo lega a la National Gallery en 1902. Conservado en la Tate Gallery, se da por destruido durante la inundación del Támesis de 1928, que anegó los depósitos. En 1973, un conservador de la Tate, Christopher Johnstone, lo encuentra enrollado, dañado pero a salvo, mientras buscaba un lienzo de John Martin enrollado en su interior. Restaurado, vuelve a exponerse a partir de 1975 y figura hoy entre los cuadros más queridos del museo."""
facture = """
Delaroche pinta con un acabado liso, casi sin huella de pincel. El cuadro se construye sobre el contraste de sombra y luz: el vestido de raso, resuelto con una virtuosidad de ilusionista, concentra la claridad en el centro, mientras que los fondos, el paño negro y las ropas oscuras lo estrechan. Algunas notas cálidas reavivan la mirada: la piel anaranjada, las calzas rojas del verdugo, el oro de los cabellos recogido por la paja. Los personajes, casi de tamaño natural, se alinean sobre un cadalso estrecho ante un decorado de arcadas, como actores sobre un escenario."""
details = [
  "La venda blanca, la mancha más luminosa del cuadro.",
  "Las anillas de hierro fijadas al tajo, y la paja fresca esparcida para absorber la sangre.",
  "El hacha de filo desgastado, apoyada en el suelo junto al verdugo.",
  "La mano de Sir John Brydges, lugarteniente de la Torre, que guía la de Jane.",
  "Los vestidos y las joyas colocados sobre las rodillas de la dama de honor desvanecida.",
]
themes = ["historia", "inglaterra", "ejecución", "inocencia", "teatro"]
anecdote = """
Delaroche se tomó libertades con la historia: Jane Grey fue ejecutada al aire libre, en el recinto de la Torre de Londres, cerca de la capilla de San Pedro ad Vincula, y no en una sala de pilares románicos. El pintor prefirió la penumbra de un interior, más propicia al drama."""
salle = 2
mur = "ouest"
place = 2
largeur = 2.97

[[oeuvres]]
titre = "1814, la campaña de Francia"
artiste = "Ernest Meissonier"
annee = "1864"
image = "campagne-de-france-1814.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Meissonier_-_1814,_Campagne_de_France.jpg"
technique = "Óleo sobre tabla, 51,5 × 76,5 cm"
collection = "Museo de Orsay, París"
note = "Napoleón, sombrío, sobre su caballo blanco, a la cabeza de su estado mayor en la nieve fangosa: una pequeña tabla de 76 cm de ancho, mostrada aquí ampliada."
description = """
Por un camino rural destrozado, donde la nieve se mezcla con el barro helado, una columna de jinetes avanza hacia el espectador bajo un cielo gris y bajo. A la cabeza, algo apartado, Napoleón monta un caballo blanco. Lleva su levita gris abotonada y su bicornio negro; el rostro cerrado, la mirada fija, el cuerpo hundido en la silla. Tras él, en fila apretada, sus mariscales y sus oficiales, con mantos oscuros y bicornios, cabalgan en silencio; uno de ellos, envuelto en una capa parda, parece dormir sobre su montura. A la derecha, a lo lejos, una larga columna de infantes se recorta sobre la llanura blanca. En primer plano, profundas rodadas surcan el camino."""
evocation = """
A comienzos de 1814, Francia es invadida por los ejércitos coaligados. Napoleón, con tropas agotadas y reclutas muy jóvenes, aún obtiene victorias en la Champaña, pero no puede impedir la caída de París, a finales de marzo, ni su abdicación. Meissonier no pinta ni una batalla ni un triunfo, sino un momento de duda: el emperador, solo con sus pensamientos, conduce hacia la derrota a los hombres que todavía lo siguen. El paisaje helado y el cielo plomizo dicen el fin de la epopeya. Bajo el Segundo Imperio, gobernado por el sobrino de Napoleón, la imagen cobraba una resonancia particular: una leyenda vista en su grandeza y en su soledad. Se ha visto en ella el retrato de un hombre más que el de un héroe."""
histoire = """
Célebre por sus diminutas escenas de género, Meissonier emprende en la década de 1860 un ciclo dedicado a la epopeya napoleónica, del que esta tabla, fechada en 1864, y Friedland, 1807, hoy en el Metropolitan Museum de Nueva York, son las piezas maestras. De una exactitud maniática, toma prestada la silla del emperador al príncipe Napoleón, primo de Napoleón III, y manda hacer una copia de la célebre levita gris, que se pone él mismo para posar ante un espejo. Vendido en 1866 a un banquero, el cuadro cambia varias veces de manos a precios crecientes, hasta llegar al coleccionista Alfred Chauchard, cofundador de los grandes almacenes del Louvre, que lo lega al Louvre; ingresa en él en 1909 y pasa al Museo de Orsay en 1986."""
facture = """
Meissonier pinta sobre una tabla de madera, con pincel fino, con una precisión que permite contar los botones de los uniformes y las hebillas de los arneses. Cada caballo tiene su pelaje, su carácter, su andar: apasionado por la anatomía y el movimiento del caballo, el pintor multiplicaba los estudios del natural y los pequeños modelos esculpidos. La virtuosidad no impide una atmósfera auténtica: la luz fría, sin sol, el barro gris y ocre y el cielo cubierto unifican la escena. La composición, una diagonal que parte del fondo a la izquierda y desemboca en el caballo blanco, confiere al cortejo un movimiento lento e inexorable."""
details = [
  "El rostro cerrado de Napoleón, a la sombra del bicornio.",
  "El caballo blanco del emperador, que avanza con paso regular por la nieve derretida.",
  "El jinete envuelto en una capa parda, detrás del emperador, con la cabeza hundida entre los hombros.",
  "La columna de infantes, en el horizonte a la derecha.",
  "La firma y la fecha, abajo a la derecha.",
]
themes = ["napoleón", "historia", "invierno", "derrota", "caballos"]
anecdote = """
En 1890, Alfred Chauchard paga este pequeño cuadro 850 000 francos, un récord por la obra de un pintor vivo. Ese mismo año había adquirido El Ángelus de Millet por una suma comparable: los dos lienzos ingresan juntos en el Louvre con su legado."""
salle = 2
mur = "nord"
position = 3.0
largeur = 1.4

[[oeuvres]]
titre = "Las rosas de Heliogábalo"
artiste = "Lawrence Alma-Tadema"
annee = "1888"
image = "roses-d-heliogabale.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Roses_of_Heliogabalus.jpg"
technique = "Óleo sobre lienzo, 132,7 × 214,4 cm"
collection = "Colección Juan Antonio Pérez Simón, México"
note = "El emperador Heliogábalo contempla cómo sus invitados desaparecen bajo una lluvia de pétalos de rosa: un banquete romano de belleza venenosa."
description = """
La mitad inferior del cuadro desaparece bajo miles de pétalos rosados, que aún llueven de una gran tela tendida en el techo, arriba a la izquierda, que acaban de abrir. Comensales coronados de flores, recostados sobre cojines, quedan allí medio sepultados: una mujer de rostro pálido, un hombre coronado de follaje, una joven con vestido verde agua que, a la derecha, mira al espectador. Por encima de ellos, sobre una tarima de mármol, el emperador, con túnica de oro, está recostado a la mesa con sus allegados ante las frutas del postre; contemplan la escena, divertidos. A la izquierda, junto a una columna, una música toca la doble flauta; al fondo, una estatua de bronce de Dioniso se recorta sobre el cielo y sobre montañas azules."""
evocation = """
El episodio procede de la Historia Augusta, colección tardía y poco fiable de vidas de emperadores: Heliogábalo, emperador de 218 a 222, habría hecho caer de un techo móvil tantas violetas y flores sobre sus invitados que algunos, incapaces de desprenderse de ellas, habrían muerto asfixiados. Alma-Tadema sustituye las violetas por rosas y transforma una crueldad en un cuento de hadas: nada muestra la muerte, solo la belleza y la indiferencia de los poderosos que miran. El cuadro retoma el viejo tema de la decadencia romana, pero sin la lección de moral de Couture: seduce antes de inquietar. Se ha leído en él un espejo de la sociedad victoriana, fascinada por el lujo, y una meditación sobre la belleza que asfixia."""
histoire = """
El lienzo es encargado en 1888 por Sir John Aird, empresario de grandes obras públicas, por 4000 libras, y expuesto ese mismo año en la Royal Academy de Londres. Tras la muerte del pintor, en 1912, la pintura victoriana pasa de moda: la familia Aird vende el cuadro en 1935 por 483 guineas, y en 1960, en subasta, ni siquiera encuentra comprador. El productor de televisión estadounidense Allen Funt, creador del programa Candid Camera y coleccionista de Alma-Tadema cuando nadie lo quería, lo adquiere después, antes de revenderlo en 1973. Adjudicado en 1,5 millones de libras en Londres en 1993, pertenece hoy al coleccionista hispano-mexicano Juan Antonio Pérez Simón."""
facture = """
Alma-Tadema pinta con una minuciosidad de arqueólogo: el mármol veteado de las columnas, el bronce de la estatua, la plata del trípode, los tejidos bordados están resueltos con una precisión que vuelve creíble la escena, como una fotografía de la Antigüedad. La composición es audaz: el emperador, sujeto del cuadro, queda relegado a un segundo plano, y el primer plano se entrega a una masa casi abstracta de pétalos, pintados uno a uno en todos los matices del rosa al blanco. La luz clara y pareja del Mediterráneo sustituye al claroscuro de los maestros antiguos."""
details = [
  "La tela abierta en el techo, arriba a la izquierda, de la que los pétalos siguen lloviendo.",
  "La tañedora de doble flauta, vestida con una piel de pantera como una ménade.",
  "La estatua de bronce de Dioniso, dios del vino, al fondo, inspirada en el Dioniso Ludovisi.",
  "El hombre barbado con túnica verde, a la derecha, de pie junto a una columna de mármol rosa.",
  "La joven sobre sus cojines, abajo a la derecha, la única que mira al espectador.",
]
themes = ["antigüedad", "roma", "flores", "decadencia", "lujo"]
anecdote = """
No había rosas en Inglaterra durante el invierno en que Alma-Tadema pintaba el cuadro: según el relato transmitido, se las hizo enviar del sur de Francia cada semana, durante cuatro meses, para pintar sus pétalos del natural."""
salle = 3
mur = "nord"
place = 2
largeur = 2.14

[[oeuvres]]
titre = "El encantador de serpientes"
artiste = "Jean-Léon Gérôme"
annee = "hacia 1879"
image = "charmeur-de-serpents.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jean-Léon_Gérôme_-_Le_charmeur_de_serpents.jpg"
technique = "Óleo sobre lienzo, 82,2 × 121 cm"
collection = "Clark Art Institute, Williamstown (Massachusetts)"
note = "Ante un muro de azulejos azules, un muchacho desnudo presenta una serpiente a unos hombres armados: una imagen que se da por documento y que está enteramente compuesta en el taller."
description = """
En una sala de muros cubiertos de azulejos de cerámica azules y blancos, bajo un largo friso de inscripciones en escritura árabe, un joven desnudo, visto de espaldas, se mantiene de pie sobre una pequeña alfombra. Una gran serpiente se enrosca alrededor de su cintura y de sus hombros; él sostiene la cabeza a brazo extendido. A la derecha, un anciano barbudo, sentado en el suelo, toca la flauta. Frente a ellos, apoyados contra el muro, una decena de hombres armados con lanzas y sables, de vestimentas variadas, miran la escena, sentados en el suelo; en medio, un anciano de turbante verde, recostado sobre cojines, parece presidir. Sobre el enlosado gastado, en primer plano, dos cestos de mimbre y una pequeña calabaza. En el muro cuelgan un escudo redondo y unas lanzas."""
evocation = """
El cuadro se presenta como una escena vista, en Egipto o en Estambul. En realidad, Gérôme lo compuso en París ensamblando elementos de procedencias diversas, y no pudo ser testigo de ella. Encarna lo que desde los años setenta se llama orientalismo: una imagen del «Oriente» fabricada por y para europeos, donde los pueblos del norte de África y del Próximo Oriente parecen exóticos, sensuales o amenazadores, en el mismo momento en que Francia e Inglaterra extienden su dominio sobre esas regiones. En 1978, Edward Said lo hace reproducir en la cubierta de su libro Orientalismo; en 1983, la historiadora Linda Nochlin muestra cómo su minucioso realismo vuelve creíble un Oriente imaginario, sin europeos visibles y como fuera del tiempo. La desnudez del muchacho, ofrecida al espectador, también ha sido leída como un sobrentendido erótico."""
histoire = """
Alumno de Delaroche, Gérôme descubre Constantinopla en 1853 y pasa después ocho meses en Egipto en 1856, de donde trae bocetos, trajes y armas; volverá allí a menudo, con otros artistas y fotógrafos. El encantador de serpientes se pinta hacia 1879. Su marchante y suegro, Adolphe Goupil, lo vende en 1880 a un coleccionista neoyorquino, Albert Spencer; en 1888, Alfred Corning Clark lo compra en subasta y lo presta en 1893 a la Exposición Universal de Chicago. Revendido por su viuda, el cuadro reaparece en 1942 en una venta en Nueva York: el hijo de Alfred, Sterling Clark, que lo había admirado de niño en la casa familiar, lo adquiere entonces. Ingresa en 1955 en el museo que Sterling Clark y su esposa Francine fundan en Williamstown."""
facture = """
Gérôme pinta con un acabado liso y preciso, casi fotográfico, que confiere a cada detalle la autoridad de un documento. Pero este documento es un montaje. Los azulejos del fondo copian, sin duda a partir de fotografías, paneles del «Pasaje dorado» del harén del palacio de Topkapi, en Estambul; el friso mezcla esos azulejos con una banda de versículos coránicos del quiosco de Bagdad, en el mismo palacio, y ciertas inscripciones, fieles en algunos puntos, se convierten en otros en signos sin significado. El enlosado procede de una mezquita de El Cairo, y el encantador de serpientes pertenece a tradiciones egipcias, no otomanas. La luz azulada y fría unifica este collage."""
details = [
  "Los azulejos caídos del muro, a la izquierda, que Linda Nochlin leyó como signo de una dejadez atribuida a sus habitantes.",
  "El friso de inscripciones en la parte alta del cuadro, en parte copiado fielmente, en parte ilegible.",
  "El casco con punta de uno de los espectadores, un objeto persa que Gérôme pintó en varios cuadros.",
  "La serpiente enroscada alrededor del muchacho, cuya especie no puede identificarse con certeza.",
  "El viejo flautista a la derecha, con la flauta en los labios, junto a su tambor.",
]
themes = ["orientalismo", "mirada", "puesta en escena", "colonialismo", "desnudez"]
anecdote = """
En 1888, Alfred Corning Clark había pagado este cuadro 19 500 dólares; en 1942, Gérôme está tan pasado de moda que su hijo Sterling lo consigue por 500 dólares. Sterling Clark, sin embargo, lo tenía por una obra maestra en su género."""
