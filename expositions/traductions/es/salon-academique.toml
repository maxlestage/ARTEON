[[oeuvres]]
titre = "Flaming June"
artiste = "Frederic Leighton"
annee = "1895"
image = "flaming-june.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Frederic_Leighton_-_Flaming_June_(1895)_-_Museo_de_Arte_de_Ponce.jpg"
technique = "Óleo sobre lienzo, 120 × 120 cm"
collection = "Museo de Arte de Ponce, Puerto Rico"
note = "Una mujer dormida, envuelta en un vestido naranja transparente, a orillas de un mar que brilla bajo el sol de junio: la imagen más célebre de la pintura victoriana."
description = """
Sobre un banco de mármol cubierto de telas oscuras, una joven duerme, acurrucada sobre sí misma: la cabeza apoyada en el brazo doblado, las rodillas recogidas contra el pecho, un pie desnudo asomando del vestido. Un vestido naranja, tan fino que deja adivinar el cuerpo, la envuelve en innumerables pliegues, y sus cabellos rojizos se derraman sobre los cojines. Tras ella, más allá de una balaustrada de mármol, el mar centellea bajo un sol de pleno verano, y una costa se dibuja en el horizonte. Arriba, un friso ornamental cierra la composición; a la derecha, una rama de adelfa en flor sobresale de la balaustrada. En el suelo, sobre el enlosado claro, yace el borde de una tela roja."""
evocation = """
Leighton no cuenta ninguna historia: ni mito, ni héroe, solo el sueño, el calor y el color. A menudo se ha comparado la figura con la Noche esculpida por Miguel Ángel para la tumba de los Médici, en Florencia, que el pintor admiraba: un cuerpo poderoso replegado en el reposo. La rama de adelfa, planta tóxica, se ha leído como una alusión a la frágil frontera entre el sueño y la muerte. El título evoca la luz ardiente de junio, que parece pasar a la tela naranja. Pintado pocos meses antes de la muerte de Leighton, el cuadro ha sido visto a veces como una despedida, una imagen del olvido voluptuoso propio del esteticismo de fin de siglo, donde la belleza se basta a sí misma."""
histoire = """
El motivo nació de un detalle: Leighton había imaginado esta durmiente para adornar una bañera de mármol en otro cuadro, Summer Slumber, y de ella hizo un tema por derecho propio. Expuesto en la Royal Academy en 1895, Flaming June es adquirido por la revista ilustrada The Graphic, que ofrece una reproducción a sus lectores por Navidad. Tras la muerte de Leighton, en enero de 1896, el lienzo desaparece de la vista y sufre luego el descrédito de toda la pintura victoriana. Hallado a comienzos de los años sesenta en una casa de Londres, no encuentra comprador en subasta. En 1963, el industrial portorriqueño Luis A. Ferré, que reunía las colecciones del museo que había fundado en Ponce, lo compra en Ámsterdam por menos de mil dólares. Se ha convertido en el emblema del museo."""
facture = """
El formato cuadrado, poco frecuente, encierra la figura como en un estuche: el cuerpo, plegado en una sucesión de curvas, llena casi todo el espacio. Leighton preparó la pose con varios estudios, primero desnudos, luego con ropajes, para encontrar la posición exacta de los miembros. Pinta después la tela en capas transparentes que dejan asomar la carne por momentos, y da al lienzo una dominante cálida, del rojo al amarillo dorado. El mar, al fondo, está hecho de finos trazos luminosos, como un metal en fusión. El mármol, el friso y el enlosado recuerdan su cultura clásica, nutrida de escultura griega."""
details = [
  "La rama de adelfa en flor, planta venenosa, arriba a la derecha.",
  "El pie desnudo que asoma del vestido, en la parte baja del cuadro.",
  "La franja de mar que centellea tras la balaustrada.",
  "La transparencia de la tela, que deja adivinar la pierna y el pecho.",
  "El borde de la tela roja que yace sobre el enlosado, abajo a la izquierda.",
]
themes = ["sueño", "verano", "color", "esteticismo", "mujer"]
anecdote = """
Siendo adolescente, el compositor Andrew Lloyd Webber vio el cuadro en una tienda de Londres, poco después de su redescubrimiento, y pidió a su abuela que le prestara las 50 libras que pedían por él. Ella se negó: no quería, dijo, esa baratija victoriana en su casa."""
