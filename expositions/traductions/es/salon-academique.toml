[[oeuvres]]
titre = "El pastor David"
artiste = "Elizabeth Jane Gardner"
annee = "hacia 1895"
image = "berger-david.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:David_the_Shepherd,_Elizabeth_Jane_Gardner.jpg"
technique = "Óleo sobre lienzo, 153,7 × 105,1 cm"
collection = "National Museum of Women in the Arts, Washington"
note = "Arrodillado sobre el león que acaba de matar, el joven pastor estrecha al cordero salvado y alza el brazo hacia el cielo: la obra más conocida de una estadounidense que se hizo un lugar en el Salón."
description = """
En un paisaje árido, al pie de altos acantilados azulados, un adolescente de cabello negro rizado está arrodillado sobre el cuerpo de un león muerto. Viste una sencilla túnica blanca anudada a la cintura, y sus pies están desnudos. Con el brazo derecho estrecha contra sí a un cordero blanco, que mira al espectador. Alza el brazo izquierdo hacia el cielo, con la mano abierta, y dirige hacia lo alto una mirada grave. Bajo su rodilla, la cabeza del león, con las fauces abiertas, muestra todavía sus colmillos; su melena leonada y sus garras se extienden sobre la tierra pálida. Al fondo, el cielo se aclara tras las montañas; algunas hierbas secas crecen entre las piedras. La firma de la pintora está inscrita abajo a la izquierda."""
evocation = """
El primer libro de Samuel cuenta que el joven David, pastor antes de ser rey, arrancó un cordero de las fauces de un león y mató a la fiera: se lo recuerda al rey Saúl para obtener el derecho de enfrentarse a Goliat. Gardner pinta el instante que sigue a la victoria, cuando el pastor da gracias. La imagen asocia la fuerza y la dulzura, la fiera abatida y el cordero protegido; puede leerse en ella la figura del buen pastor, que la tradición cristiana vincula con el linaje de David. Para una mujer pintora, esta elección no era baladí: la pintura religiosa y la de historia, los géneros más prestigiosos, eran en la práctica cosa de hombres, y Gardner se mide con ellos en su propio terreno."""
histoire = """
Nacida en New Hampshire, Elizabeth Jane Gardner se instala en París en 1864. Al estar la Escuela de Bellas Artes cerrada a las mujeres, se forma en talleres privados y luego, a partir de 1873, en la Academia Julian, con Jules Lefebvre y William Bouguereau. Expone en el Salón desde 1868 y será admitida en él más de veinte veces. Pintado hacia 1895, El pastor David figura entre sus obras más admiradas en vida; al año siguiente, se casa con Bouguereau. El cuadro fue donado al National Museum of Women in the Arts de Washington por sus fundadores, Wallace y Wilhelmina Holladay, que abrieron en 1987 este museo consagrado a las mujeres artistas."""
facture = """
Gardner hizo suya la manera de Bouguereau: dibujo riguroso, modelado liso, carnes luminosas que se recortan sobre un fondo oscuro. Cuida la textura de cada materia: la lana rizada del cordero, el lienzo de la túnica, la melena del león, la piel del muchacho. La composición es piramidal, desde el brazo alzado hasta las garras del león extendidas en el suelo, y la diagonal del brazo dirige la mirada hacia el cielo. Los colores son sobrios, blancos, ocres y grises azulados, para concentrar la luz sobre el grupo del niño y el cordero."""
details = [
  "La mirada del cordero, vuelta hacia el espectador.",
  "Las fauces abiertas del león muerto, bajo la rodilla de David.",
  "El pie desnudo del pastor, en primer plano a la izquierda.",
  "Los acantilados azulados, arriba a la izquierda, bajo un cielo que se aclara.",
  "La mano izquierda de David, abierta hacia el cielo.",
]
themes = ["biblia", "pastor", "inocencia", "mujeres pintoras", "valentía"]
anecdote = """
Como Rosa Bonheur, Elizabeth Jane Gardner pidió a la prefectura de policía la autorización para llevar ropa de hombre. Así vestida, habría seguido los cursos de dibujo de la manufactura de los Gobelinos, reservados a los hombres."""
