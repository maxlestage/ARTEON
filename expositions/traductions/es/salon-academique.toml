[[oeuvres]]
titre = "El nacimiento de Venus"
artiste = "Alexandre Cabanel"
annee = "1863"
image = "naissance-de-venus-cabanel.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Alexandre_Cabanel_-_The_Birth_of_Venus_-_Google_Art_Project_2.jpg"
technique = "Óleo sobre lienzo, 130 × 225 cm"
collection = "Museo de Orsay, París"
note = "El lienzo triunfa en el Salón de 1863 y Napoleón III lo adquiere, el mismo año en que el Almuerzo sobre la hierba de Manet causa escándalo en el Salón de los Rechazados."
description = """
Tendida sobre la cresta de una ola, una mujer desnuda se estira, como al salir del sueño. Su cuerpo, de blancura nacarada, ocupa casi todo el ancho del cuadro, desde los pies que rozan la espuma hasta el brazo doblado sobre la frente. Sus ojos están entornados; su larga cabellera pelirroja se derrama en el agua. El mar, de un azul verdoso oscuro, ondula suavemente, y la espuma blanca eleva a la diosa como un lecho. Sobre ella, en un cielo azul pálido cruzado por nubes ligeras, cinco pequeños amorcillos alados vuelan en farándula; algunos soplan en caracolas. En el horizonte, a la izquierda, se dibuja una costa lejana. La firma, Alex. Cabanel, está inscrita abajo a la izquierda."""
evocation = """
Según el mito, Venus, diosa del amor, nace de la espuma del mar. Cabanel no muestra ni concha ni cortejo divino: una mujer lánguida, ofrecida a la mirada, cuyo abandono evoca el placer más que el nacimiento. Es toda la paradoja del desnudo académico: la coartada de la fábula hace aceptable en el Salón un cuerpo que el pudor de la época rechazaría si fuera el de una contemporánea. Los críticos no se equivocaron: Émile Zola, en 1867, ve en la diosa a una lorette parisina, hecha de «una especie de pasta de almendra blanca y rosa». Hoy la obra se cita a menudo para cuestionar la mirada masculina sobre los cuerpos femeninos, que dominaba las exposiciones oficiales."""
histoire = """
El Salón de 1863 ha quedado como el de las Venus: Cabanel, Paul Baudry y Amaury-Duval exponen en él cada uno un gran desnudo mitológico. El de Cabanel triunfa, y el emperador Napoleón III lo adquiere para su colección personal. Ese mismo año, el jurado rechaza tantas obras que el emperador autoriza una exposición de los rechazados, el Salón de los Rechazados, donde el Almuerzo sobre la hierba de Manet causa escándalo. Cabanel, por su parte, es elegido miembro de la Academia de Bellas Artes y nombrado profesor de la Escuela de Bellas Artes. En 1875 pintó una réplica reducida del cuadro, hoy en el Metropolitan Museum de Nueva York; el original está en el Museo de Orsay."""
facture = """
Formado en la Escuela de Bellas Artes en el taller de François-Édouard Picot, Cabanel cuida el dibujo y el modelado: la piel es lisa, pulida, sin huella de pincel, de un rosa de porcelana apenas sombreado. Esta superficie esmerada, ideal de los alumnos de la Escuela, es lo contrario de la pincelada visible que defenderán los impresionistas. La composición descansa en una larga horizontal, el cuerpo de la diosa, que duplica la línea del horizonte, y en la curva de los amorcillos que le responde en el cielo. Los colores son pocos y suaves: azules del mar y del cielo, marfil de la carne, rojizo de la cabellera."""
details = [
  "Los ojos de la diosa, entornados bajo su brazo: ¿duerme o mira?",
  "La cabellera pelirroja que se mezcla con la espuma y las olas.",
  "Los amorcillos que soplan en caracolas, como tritones en miniatura.",
  "Los pies de Venus, a la izquierda, que rozan la cresta de una ola.",
  "La firma «Alex. Cabanel», abajo a la izquierda.",
]
themes = ["mitología", "desnudo", "venus", "mar", "mirada"]
anecdote = """
Cuando Manet expone Olimpia en el Salón de 1865, dos años después del triunfo de Cabanel, muchos han visto en ella una respuesta a las Venus de 1863: una mujer desnuda, muy real y de su tiempo, que mira de frente al espectador. El público, por su parte, se indigna."""
