[[oeuvres]]
titre = "El nacimiento de Venus"
artiste = "William Bouguereau"
annee = "1879"
image = "naissance-de-venus-bouguereau.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:William-Adolphe_Bouguereau_(1825-1905)_-_The_Birth_of_Venus_(1879).jpg"
technique = "Óleo sobre lienzo, 300 × 218 cm"
collection = "Museo de Orsay, París"
note = "De pie sobre su concha, la diosa se retuerce la cabellera en medio de ninfas, tritones y amorcillos: el gran lienzo de Bouguereau en el Salón de 1879."
description = """
En el centro de un mar agitado, Venus, desnuda, se yergue sobre una gran concha. Con el peso del cuerpo sobre una pierna, levanta ambos brazos para retorcerse la larga cabellera castaña, con la cabeza inclinada y los ojos bajos. A su alrededor, un cortejo se arremolina: a la derecha, un tritón sopla en una caracola, una ninfa tendida extiende el brazo hacia la diosa, otra, coronada de follaje, alza los ojos hacia el cielo; a la izquierda, un tritón barbado abraza a una ninfa vista de espaldas. En primer plano, un hombre en el agua, de espaldas, blande una caracola, y dos pequeños amorcillos juegan sobre un delfín. En el cielo, una nube de amorcillos alados, algunos armados con flechas, forma una corona sobre la diosa."""
evocation = """
Bouguereau retoma un asunto tratado por Botticelli y sobre todo por Rafael, cuyo Triunfo de Galatea, en la villa Farnesina, había podido admirar en Roma: la misma figura en el centro, la misma ronda de ninfas, tritones y amorcillos. Ofrece de él una versión idealizada en extremo, donde el cuerpo femenino, sin el menor defecto, se convierte en una estatua viva. Para sus admiradores, era la perfección misma del arte; para los pintores de vanguardia, empezando por los impresionistas, el símbolo de una pintura de convención, agradable y vacía. Hoy se ve en ella tanto la virtuosidad de un dibujante excepcional como la puesta en escena de un ideal femenino concebido por y para los hombres de su tiempo."""
histoire = """
Bouguereau tiene cincuenta y tres años y figura entre los pintores más honrados de Francia cuando presenta El nacimiento de Venus en el Salón de 1879. El Estado lo adquiere para el Museo del Luxemburgo, entonces dedicado a los artistas vivos. Sus cuadros se venden muy caros, en particular a coleccionistas estadounidenses, y su enseñanza en la Academia Julian atrae a alumnos de todo el mundo. Tras su muerte, en 1905, su obra cae sin embargo en un largo descrédito. La apertura del Museo de Orsay, en 1986, que decide mostrar el arte académico junto a los impresionistas, contribuye a su redescubrimiento: El nacimiento de Venus se ha convertido allí en una de las imágenes más conocidas de la pintura del Salón."""
facture = """
Bouguereau prepara sus grandes lienzos con numerosos dibujos y estudios del modelo, y luego pinta en capas finas y lisas, borrando toda huella de pincel. El modelado de los cuerpos, de una suavidad de porcelana, contrasta con la tez curtida de los tritones. La composición está sabiamente regulada: la diosa forma un eje vertical en el centro, prolongado por sus brazos levantados, y las demás figuras se enroscan a su alrededor hasta la corona de amorcillos en el cielo. Los colores nacarados y fríos, azules y malvas del mar y de las nubes, rosas de las carnes, acentúan el carácter irreal de la escena. Tres metros de alto: es el formato de los grandes cuadros de historia."""
details = [
  "La concha abierta bajo los pies de Venus, apenas visible en la espuma.",
  "El delfín negro, en primer plano, sobre el que juegan dos amorcillos.",
  "La ninfa coronada de follaje, a la derecha, que alza los ojos hacia el cielo.",
  "Los amorcillos armados con flechas, arriba a la derecha.",
  "La firma y la fecha, abajo a la izquierda, casi ahogadas en el agua.",
]
themes = ["mitología", "desnudo", "venus", "ideal", "mar"]
anecdote = """
En 1896, Bouguereau se casa con una de sus antiguas alumnas de la Academia Julian, la pintora estadounidense Elizabeth Jane Gardner, de quien se expone más adelante un lienzo en esta visita. Llevaban unidos cerca de veinte años, pero no se casan hasta después de la muerte de la madre del pintor."""
