[[artistes]]
nom = "Thomas Couture"
vie = "Senlis, 21 de diciembre de 1815 – Villiers-le-Bel, 30 de marzo de 1879"
biographie = """
Nacido en Senlis, Thomas Couture crece en París, donde se forma en el taller de Antoine-Jean Gros y después en el de Paul Delaroche. Obtiene en 1837 el segundo gran premio de Roma, pero nunca el primero, fracaso que vive como una injusticia. Se da a conocer en el Salón con cuadros de género y retratos, antes del triunfo de Los romanos de la decadencia, en 1847. Abre entonces un taller libre, independiente de la Escuela de Bellas Artes, que atrae a numerosísimos alumnos, franceses, alemanes y estadounidenses: Édouard Manet permanece allí seis años, Puvis de Chavannes y Anselm Feuerbach pasan por él. El Estado le encarga después grandes composiciones, como El alistamiento de los voluntarios de 1792, que no logra terminar; decepcionado por los encargos oficiales y las disputas, se aleja poco a poco de la escena parisina. En 1867 publica Méthode et entretiens d'atelier, una recopilación de consejos prácticos que tiene gran éxito, especialmente en Estados Unidos. Pasa sus últimos años en Villiers-le-Bel, al norte de París, donde muere en 1879."""
style = """
Couture quiere reconciliar la tradición clásica y el color: un dibujo sólido heredado de David y de Gros, una composición teatral, pero una ejecución rápida, de tonos francos y pincelada a veces visible, inspirada en los venecianos. Su enseñanza, más libre que la de la Escuela, valoraba el boceto y la frescura del primer impulso. Hace así de puente entre la gran pintura de historia y la generación de Manet."""

[[artistes]]
nom = "Paul Delaroche"
vie = "París, 17 de julio de 1797 – París, 4 de noviembre de 1856"
biographie = """
Hippolyte, llamado Paul Delaroche, nace en París y se forma en el taller de Antoine-Jean Gros. Debuta en el Salón en 1822 y se impone en pocos años con escenas de historia, a menudo inglesas, de gran fuerza dramática: Los hijos de Eduardo, hoy en el Louvre, Cromwell y Carlos I, La ejecución de Lady Jane Grey. Elegido miembro de la Academia de Bellas Artes en 1832, se convierte en profesor de la Escuela de Bellas Artes. En 1835 se casa con Louise Vernet, hija del pintor Horace Vernet; su muerte, diez años después, lo afecta profundamente. De 1837 a 1841 pinta el Hemiciclo del anfiteatro de la Escuela de Bellas Artes, inmensa composición que reúne a los grandes artistas de todos los tiempos. Su taller, uno de los más concurridos de París, forma a Jean-Léon Gérôme, Jean-François Millet, Thomas Couture y varios pioneros de la fotografía, como Gustave Le Gray. Después de 1843 deja de trabajar para el Salón y se consagra a cuadros más íntimos, religiosos o napoleónicos, como Napoleón en Fontainebleau. Muere en París en 1856."""
style = """
Delaroche inventa una pintura de historia nueva, entre el clasicismo de David y el romanticismo: asuntos tomados de la historia moderna, inglesa y francesa, tratados con la exactitud de un decorador de teatro y el acabado liso de la Escuela. Elige el instante que precede al drama más que la acción misma, y se dirige a la emoción del espectador. Difundido por el grabado, su arte fue inmensamente popular; a menudo se ve en él una prefiguración de la puesta en escena del cine histórico."""

[[artistes]]
nom = "Ernest Meissonier"
vie = "Lyon, 21 de febrero de 1815 – París, 31 de enero de 1891"
biographie = """
Jean-Louis-Ernest Meissonier nace en Lyon en una familia de comerciantes y crece en París. Se forma en gran parte por sí solo, tras un breve paso por el taller de Léon Cogniet, y se gana primero la vida ilustrando libros. En el Salón, donde expone desde 1834, se especializa en pequeños cuadros de género, lectores, fumadores o jugadores de ajedrez con trajes de los siglos XVII y XVIII, pintados con una minuciosidad que recuerda a los maestros holandeses. El éxito es inmenso, y sus lienzos alcanzan precios nunca vistos para un pintor vivo. Testigo de las jornadas de junio de 1848, pinta La barricada, impresionante recuerdo de la represión. Sigue a Napoleón III durante la campaña de Italia de 1859 y emprende después el ciclo napoleónico que comprende 1814 y Friedland, 1807. Durante el sitio de París, en 1870, sirve como oficial en la guardia nacional. En 1889 preside el jurado de bellas artes de la Exposición Universal; al año siguiente, se pone al frente de la Sociedad Nacional de Bellas Artes, que organiza un Salón rival del Salón oficial. Muere en París en 1891."""
style = """
Meissonier es el maestro del formato pequeño: escenas diminutas, pintadas con pincel fino sobre madera, donde cada botón, cada arnés, cada pliegue es exacto. Esta precisión de orfebre, servida por una documentación obsesiva, se aplica también a la historia militar y al caballo, que estudia sin descanso. Los críticos realistas le reprochaban una perfección de miniaturista; sus admiradores lo comparaban con los pequeños maestros holandeses. Su cotización, la más alta de su tiempo, se desplomó en el siglo XX."""

[[artistes]]
nom = "Lawrence Alma-Tadema"
vie = "Dronrijp (Países Bajos), 8 de enero de 1836 – Wiesbaden (Alemania), 25 de junio de 1912"
biographie = """
Lourens Alma Tadema nace en un pueblo de Frisia, en los Países Bajos, hijo de un notario. Estudia en la Academia de Bellas Artes de Amberes y trabaja después junto al barón Henri Leys, pintor de la historia flamenca. Sus primeros éxitos son escenas del Antiguo Egipto y de la época merovingia. Un viaje a Italia en 1863, durante el cual visita Pompeya, decide su carrera: en adelante, pintará la vida cotidiana de la Grecia y la Roma antiguas. El marchante Ernest Gambart, que le compra numerosos lienzos, lo da a conocer en Inglaterra. Viudo, se instala en Londres en 1870 con sus dos hijas, se casa al año siguiente con la pintora Laura Epps y se hace súbdito británico en 1873. Miembro de la Royal Academy, nombrado caballero en 1899, condecorado con la Orden del Mérito en 1905, lleva una vida fastuosa en una casa-taller que decora él mismo. Numera sus obras con cifras romanas, como opus, hasta más de cuatrocientas. Muere en 1912 durante una cura en Wiesbaden y es enterrado en la catedral de San Pablo de Londres."""
style = """
Alma-Tadema hace revivir la Antigüedad en su cotidianidad: baños, banquetes, jardines, citas amorosas a orillas del mar, poblados de figuras que se parecen a los ingleses de su tiempo. Su reputación descansa en la virtuosidad de sus materias, sobre todo el mármol, y en una erudición arqueológica nutrida de fotografías. Menospreciado tras su muerte, se dice que inspiró los decorados de las grandes películas históricas de Hollywood."""

[[artistes]]
nom = "Jean-Léon Gérôme"
vie = "Vesoul, 11 de mayo de 1824 – París, 10 de enero de 1904"
biographie = """
Hijo de un orfebre de Vesoul, Jean-Léon Gérôme entra a los dieciséis años en el taller de Paul Delaroche, en París, y lo acompaña a Italia en 1843. Debuta en el Salón de 1847 con Jóvenes griegos haciendo pelear gallos, que lo hace célebre de inmediato y lo convierte en el cabeza de los «neogriegos», pintores de una Antigüedad amable y familiar. En 1853 descubre Constantinopla y después Egipto en 1856: el «Oriente» pasa a ser uno de sus temas favoritos, junto a la historia romana y la historia de Francia. En 1863 se casa con Marie Goupil, hija del gran marchante Adolphe Goupil, cuya casa difunde sus obras en grabados y fotografías por todo el mundo. Nombrado profesor de la Escuela de Bellas Artes en 1864, enseña allí casi cuarenta años y forma a cientos de alumnos, entre ellos el estadounidense Thomas Eakins. Miembro del Instituto, cubierto de honores, se dedica tardíamente a la escultura. Adversario resuelto del impresionismo, protesta en 1894 contra la entrada de la colección Caillebotte en el Museo del Luxemburgo. Muere en París en 1904."""
style = """
Gérôme lleva al extremo el acabado liso de la Escuela: pincelada invisible, dibujo preciso, detalles de una exactitud arqueológica o etnográfica que dan a sus escenas apariencia de documentos. Compone como un director de escena, eligiendo a menudo el instante que sigue a la acción. Sus cuadros orientalistas, muy difundidos, fijaron durante mucho tiempo la imagen europea del «Oriente»; sus escenas antiguas, como Pollice Verso, han inspirado al cine, hasta el Gladiator de Ridley Scott."""

[[artistes]]
nom = "Alexandre Cabanel"
vie = "Montpellier, 28 de septiembre de 1823 – París, 23 de enero de 1889"
biographie = """
Nacido en Montpellier en un medio modesto, Alexandre Cabanel muestra muy pronto dotes para el dibujo y parte a estudiar a París. Alumno de François-Édouard Picot en la Escuela de Bellas Artes, obtiene en 1845 un segundo gran premio de Roma que, no obstante, le abre las puertas de la Villa Médicis. De regreso en París, lleva una carrera ejemplar: pinturas religiosas y mitológicas, grandes decoraciones, como la Vida de san Luis en el Panteón, y sobre todo retratos de la alta sociedad francesa y estadounidense, de la que se convierte en uno de los pintores favoritos. El triunfo de El nacimiento de Venus, en 1863, coincide con su elección a la Academia de Bellas Artes y su nombramiento como profesor de la Escuela. Durante más de veinticinco años dirige allí uno de los talleres más solicitados, por el que pasan Jules Bastien-Lepage, Henri Gervex y numerosos extranjeros. Miembro a menudo del jurado del Salón, encarna a los ojos de los impresionistas el arte oficial que los rechaza. Muere en París en 1889; el Museo Fabre de Montpellier, su ciudad natal, conserva un importante conjunto de sus obras."""
style = """
Cabanel es el pintor académico por excelencia: dibujo impecable, modelado liso, colores suaves, nobles asuntos tomados de la mitología, de la Biblia y de la literatura. Sus desnudos, de una sensualidad templada por la coartada de la fábula, le valieron el favor de Napoleón III y del público; sus retratos halagaban la elegancia de sus modelos. Para Zola y los defensores de Manet, se convirtió en el símbolo de una pintura de convención."""

[[artistes]]
nom = "William Bouguereau"
vie = "La Rochela, 30 de noviembre de 1825 – La Rochela, 19 de agosto de 1905"
biographie = """
William-Adolphe Bouguereau nace en La Rochela en una familia de comerciantes. Destinado al comercio, sigue cursos de dibujo en Burdeos, llega a París en 1846 e ingresa en la Escuela de Bellas Artes, en el taller de François-Édouard Picot. En 1850 obtiene el gran premio de Roma y reside en la Villa Médicis, donde estudia a Rafael y las pinturas antiguas. De regreso en París, obtiene encargos de decoración y se impone luego en el Salón, donde expone casi cada año durante medio siglo asuntos mitológicos y religiosos y escenas de jóvenes campesinas idealizadas. Sus cuadros, difundidos por los marchantes Paul Durand-Ruel y luego Goupil, se venden muy caros, en particular a los coleccionistas estadounidenses. Profesor en la Academia Julian y luego en la Escuela de Bellas Artes, forma a cientos de alumnos, muchas de ellas mujeres. Miembro del Instituto desde 1876, es uno de los pilares del Salón oficial. Pierde a varios de sus hijos y a su primera esposa; en 1896 se casa con Elizabeth Jane Gardner. Muere en su ciudad natal en 1905."""
style = """
Bouguereau lleva a la perfección la técnica enseñada por la Escuela: dibujo de una seguridad absoluta, modelado de porcelana, superficie lisa de la que ha desaparecido toda huella de pincel. Sus ninfas, sus Venus y sus pequeñas campesinas obedecen a un mismo ideal de belleza, sentimental y sin asperezas. Adulado en vida, se convirtió para los modernos en el símbolo del arte oficial al que había que combatir; redescubierto desde los años ochenta, sigue siendo admirado por su virtuosidad y discutido por su ideal."""

[[artistes]]
nom = "Frederic Leighton"
vie = "Scarborough (Inglaterra), 3 de diciembre de 1830 – Londres, 25 de enero de 1896"
biographie = """
Hijo de un médico, Frederic Leighton crece viajando por Europa con su familia y recibe una educación cosmopolita. Estudia pintura en Fráncfort, en el instituto Städel, con Edward von Steinle, y luego en Bruselas, París y Roma. En 1855, su primer gran cuadro, La Madona de Cimabue llevada en procesión por las calles de Florencia, se expone en la Royal Academy y es adquirido por la reina Victoria. Instalado en Londres a finales de la década de 1850, se convierte en la figura central del clasicismo victoriano, con asuntos tomados de la mitología griega y de la Biblia. Se hace construir en Holland Park una casa-taller cuyo salón árabe, revestido de azulejos de cerámica traídos del Próximo Oriente, es hoy un museo. Elegido presidente de la Royal Academy en 1878, es nombrado caballero, luego baronet en 1886, y por último par del reino en enero de 1896: muere al día siguiente, lo que convierte su título de par en el más breve de la historia británica. Nunca se casó. Es enterrado en la catedral de San Pablo de Londres."""
style = """
Leighton es el gran clásico de la pintura victoriana: un dibujo riguroso aprendido en Alemania y en Italia, figuras escultóricas inspiradas en la estatuaria griega y en Miguel Ángel, ropajes de innumerables pliegues y colores cálidos y saturados. Próximo al movimiento esteticista, busca la belleza por sí misma más que la lección moral. También escultor, firmó el Atleta luchando con una pitón, que renovó la escultura inglesa."""

[[artistes]]
nom = "Elizabeth Jane Gardner"
vie = "Exeter (New Hampshire, Estados Unidos), 4 de octubre de 1837 – París, 28 de enero de 1922"
biographie = """
Elizabeth Jane Gardner crece en Nueva Inglaterra y estudia arte e idiomas en el seminario de Lasell, cerca de Boston, del que sale diplomada en 1856. En 1864 parte hacia París con su antigua profesora Imogene Robinson. La Escuela de Bellas Artes rechaza entonces a las mujeres, que no serán admitidas hasta 1897: Gardner copia cuadros en el Louvre y en el Museo del Luxemburgo para clientes estadounidenses, luego frecuenta talleres privados y, a partir de 1873, la Academia Julian, donde estudia con Jules Lefebvre y William Bouguereau. En 1868 es una de las primeras estadounidenses expuestas en el Salón, donde será admitida más de veinte veces y obtendrá una medalla. Políglota y mujer de negocios sagaz, escribe para periódicos estadounidenses y hace de intermediaria entre coleccionistas estadounidenses y artistas franceses. Unida durante cerca de veinte años a Bouguereau, su vecino, no se casa con él hasta 1896, tras la muerte de la madre del pintor. Viuda en 1905, sigue pintando en París, donde muere en 1922."""
style = """
Gardner adoptó la manera de Bouguereau: dibujo preciso, modelado liso, asuntos mitológicos, bíblicos y escenas de infancia idealizadas. La crítica la redujo durante mucho tiempo al papel de imitadora de su maestro, y ella decía preferir ser la mejor imitadora de Bouguereau antes que no ser nadie. Su trayectoria, la de una estadounidense que se impone en el mundo cerrado del arte oficial parisino, interesa hoy tanto como sus cuadros."""

[[artistes]]
nom = "Jules Bastien-Lepage"
vie = "Damvillers (Mosa), 1 de noviembre de 1848 – París, 10 de diciembre de 1884"
biographie = """
Jules Bastien-Lepage nace en Damvillers, pueblo del Mosa, en una familia de agricultores que alienta sus aficiones artísticas. Tras el colegio de Verdún, parte a París, trabaja un tiempo en la administración de correos y luego ingresa en la Escuela de Bellas Artes, en el taller de Alexandre Cabanel. Herido durante la guerra de 1870, retoma después sus estudios. Fracasa en el premio de Roma, pero alcanza la celebridad en el Salón de 1874 con el Retrato de mi abuelo, de una verdad impresionante. Reparte desde entonces su vida entre París, donde pinta retratos de personalidades, y Damvillers, donde pinta a los campesinos de su pueblo: La siega del heno, y luego una Juana de Arco escuchando las voces, hoy en el Metropolitan Museum de Nueva York. Trabaja también en Londres y viaja por Italia y Argelia. Gravemente enfermo, muere en París en 1884, a los treinta y seis años, y es enterrado en Damvillers. La joven pintora Marie Bashkirtseff, que lo admiraba y que fue su amiga, había muerto unas semanas antes."""
style = """
Bastien-Lepage inventa un naturalismo de Salón: campesinos de tamaño natural, pintados en su entorno real, con la precisión de un retratista para los rostros y una pincelada más libre para los fondos. Su luz gris y difusa, su horizonte colocado muy alto y sus figuras captadas sin pose marcaron a toda una generación europea. Demuestra que se puede ser moderno sin renunciar al oficio académico."""
