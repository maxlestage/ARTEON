[exposition]
ordre = 112
nom_court = "Arte académico"
mouvement = "El Salón y el arte académico"
cadre = "baroque"
couleur = "#7a5418"
titre = "El Salón, triunfo del arte académico"
artiste = "Bouguereau, Cabanel, Gérôme, Alma-Tadema, Leighton…"
dates = "1833–1895"
accroche = "Exposición virtual · Petit Palais, París"
introduction = """
En el siglo XIX, el Salón de París, gran exposición oficial cuyo jurado está dominado por la Academia de Bellas Artes, hace y deshace carreras; la Royal Academy desempeña el mismo papel en Londres. Impone un ideal: dibujo impecable, superficie lisa, grandes asuntos tomados de la mitología, de la Biblia y de la historia. La visita reúne diez lienzos de sus figuras más aclamadas, francesas, inglesas y estadounidense, de Delaroche a Leighton, sin silenciar lo que esta pintura dice de su tiempo, de su mirada sobre el cuerpo de las mujeres y sobre el «Oriente». El edificio se inspira en el Petit Palais, construido en París para la Exposición Universal de 1900: un pórtico con cúpula, dos largas galerías a lo largo de la fachada y, en sus extremos, dos pabellones."""
vitrine = "naissance-de-venus-bouguereau.jpg"

[musee]
nom = "Petit Palais"
ville = "París, Francia"
architecte = "Charles Girault"
construction = "1897–1900"
presentation = """
Para la Exposición Universal de 1900, el viejo Palacio de la Industria, demolido en 1896, se sustituye por dos palacios que se miran a ambos lados de una nueva avenida abierta hacia el puente Alejandro III y los Inválidos: el Grand Palais y el Petit Palais. Ganador del concurso, Charles Girault levanta el segundo desde el otoño de 1897 hasta la primavera de 1900. Su fachada, de unos 125 metros de longitud, está centrada en un monumental pórtico coronado por una cúpula; detrás, las galerías rodean un jardín semicircular bordeado por un peristilo. Girault quiso que estuvieran iluminadas únicamente por la luz del día, gracias a lucernarios, cúpulas transparentes y altos ventanales. Convertido en el Museo de Bellas Artes de la Ciudad de París, el Petit Palais abre el 11 de diciembre de 1902 y recibe ese mismo año la inmensa colección Dutuit. Renovado de 2001 a 2005, presenta gratuitamente sus colecciones permanentes, desde la Antigüedad hasta principios del siglo XX; los lienzos más vastos tienen aquí su galería de grandes formatos."""
ici = """
El edificio de ARTEON retoma la disposición del Petit Palais: un pórtico central del que parten dos largas galerías, y dos pabellones que vuelven hacia el norte como las alas en torno al jardín. Se entra por el sur bajo «El pórtico con cúpula», de dieciséis metros de altura. Hacia el oeste se extiende «La galería de los grandes formatos», de treinta y dos metros de longitud, con muros de rojo Salón; al norte de su extremo se abre el pabellón ocre «La Antigüedad y el Oriente soñados». Hacia el este, «La galería del ideal», de verde grisáceo, conduce al pabellón claro «Pastores y segadores»."""

