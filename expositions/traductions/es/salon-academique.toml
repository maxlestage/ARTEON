[[oeuvres]]
titre = "La siega del heno"
artiste = "Jules Bastien-Lepage"
annee = "1877"
image = "les-foins.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jules_Bastien-Lepage_-_Hay_making_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 160 × 195 cm"
collection = "Museo de Orsay, París"
note = "Una segadora agotada, sentada en la hierba cortada, mira al vacío mientras su compañero duerme: el naturalismo entra en el Salón de 1878."
description = """
En un prado recién segado, bajo un cielo pálido, dos campesinos descansan tras la comida del mediodía. En primer plano, una joven está sentada en la hierba, con las piernas extendidas ante sí, las manos sobre las rodillas, abiertas, inertes. Lleva una camisa blanca, un corpiño gris y un delantal de lienzo; sus gruesos zapatos están cubiertos de polvo. Fija la mirada en el vacío, con la boca entreabierta, el rostro curtido, como aturdida por el cansancio. Tras ella, un hombre está tendido en el heno, con el sombrero de paja echado sobre el rostro. Una fiambrera de hojalata está colocada cerca de los pies de la joven. Al fondo, el prado se extiende hasta unas colinas, salpicado de almiares, árboles esmirriados y diminutos segadores."""
evocation = """
El cuadro casi no cuenta nada, y ahí reside su fuerza: una pausa en medio de una jornada de trabajo, el cuerpo vaciado por el esfuerzo. Bastien-Lepage, hijo de un pueblo lorenés, muestra el campo sin embellecerlo ni dramatizarlo, lejos de las graciosas pastoras de la pintura académica como de la grandeza bíblica de los campesinos de Millet. La mirada ausente de la segadora desconcertó a una parte de la crítica, que la juzgó fea o embrutecida; otros vieron en ella una verdad nueva, el cansancio mismo del trabajo del campo. La obra muestra que el Salón podía acoger la modernidad: la técnica es académica, pero el tema, la luz y el encuadre miran hacia la fotografía y la pintura al aire libre."""
histoire = """
Alumno de Cabanel en la Escuela de Bellas Artes, Bastien-Lepage fracasó en el premio de Roma, pero se dio a conocer en el Salón con retratos de una verdad impresionante. En 1877 pinta La siega del heno en Damvillers, su pueblo natal del Mosa, en los prados que conoce desde la infancia. Expuesto en el Salón de 1878, el cuadro lo convierte en el cabeza de una nueva pintura, el naturalismo, que concilia el oficio enseñado en la Escuela y la observación de la vida rural. Tras la muerte prematura del pintor, en 1884, el lienzo es adquirido en 1885, en la venta de su taller, para el Museo del Luxemburgo; hoy se encuentra en el Museo de Orsay."""
facture = """
Bastien-Lepage combina dos maneras. Los rostros y las manos se pintan con la precisión de un retratista; la hierba, el heno y el prado se brochan con largas pinceladas vivas y libres, en una gama clara de verdes plateados, rubios y grises. El horizonte está colocado muy alto: el prado se alza como un muro tras los personajes y los empuja hacia el espectador, un encuadre que casi suprime el cielo y recuerda a la fotografía. La luz es difusa, sin sombras marcadas, la de un día de verano velado. El gran formato, el de un cuadro de historia, confiere a los campesinos una presencia monumental."""
details = [
  "Las manos abiertas de la segadora, abandonadas sobre sus rodillas.",
  "El sombrero de paja echado sobre el rostro del segador dormido.",
  "La fiambrera de hojalata colocada en la hierba, a la derecha.",
