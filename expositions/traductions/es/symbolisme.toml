[[oeuvres]]
titre = "El grito"
artiste = "Edvard Munch"
annee = "1893"
image = "cri.jpg"
technique = "Témpera y pastel graso sobre cartón, 91 × 73,5 cm"
collection = "Nasjonalmuseet, Oslo"
note = "Sobre un puente, bajo un cielo color de sangre, una figura se tapa los oídos: la imagen misma de la angustia moderna."
description = """
En primer plano, una figura humana sin cabello, de rostro pálido y hundido como una calavera, se encuentra sobre un puente o un camino elevado, bordeado por una barandilla que corre en diagonal hacia la izquierda. Se lleva las manos a las mejillas, con los ojos desorbitados, la boca abierta en un grito o un alarido. Su cuerpo oscuro ondula como una llama. Más lejos en el puente, dos siluetas con sombrero se alejan, indiferentes. Detrás, un fiordo azul noche se enrosca entre colinas, con dos pequeños barcos. Arriba, el cielo está surcado por largas bandas onduladas rojas, naranjas y amarillas, como un incendio."""
evocation = """
Munch contó varias veces la experiencia de la que nace el cuadro: caminando al atardecer con dos amigos, ve el cielo volverse rojo sangre, se detiene, agotado, y siente un gran grito infinito que atraviesa la naturaleza. No es, pues, la figura la que grita, sino el mundo que la rodea, y ella se tapa los oídos. El cuadro hace de la angustia un paisaje: las líneas del cielo, del agua y del cuerpo ondulan juntas. Se ha visto en él la soledad del hombre moderno, el miedo a la locura que obsesionaba a Munch, la muerte de sus allegados, y se ha comparado la figura con una momia peruana expuesta en París. El grito se ha convertido en el icono universal de la ansiedad."""
histoire = """
La escena se sitúa en la colina de Ekeberg, que domina Kristiania, la actual Oslo, y su fiordo. Munch anota el recuerdo desde 1892 y pinta luego esta versión en 1893, cuando reparte su vida entre Berlín y Noruega. Se expone ese mismo año en una serie de cuadros sobre el amor, núcleo de su Friso de la vida. Munch realiza varias versiones del tema: dos al pastel o al lápiz, una litografía en 1895, una témpera hacia 1910. Esta versión entra en la Galería Nacional de Oslo en 1910, gracias a la donación del coleccionista Olaf Schou. Robada el 12 de febrero de 1994, día de la inauguración de los Juegos Olímpicos de Lillehammer, es recuperada en mayo del mismo año. Hoy se encuentra en el Nasjonalmuseet."""
facture = """
Munch pinta sobre un cartón bruto, dejado visible en algunos lugares, lo que da a la obra un aspecto rápido e inacabado. Mezcla la témpera, aplicada en capas fluidas, y trazos de pastel graso que acentúan las ondulaciones. Los colores son arbitrarios y violentos: el rojo anaranjado del cielo responde al azul del fiordo. Dos sistemas de líneas se oponen: las rectas rígidas del puente, que se hunden hacia el fondo, y las curvas del paisaje y del cuerpo. Esta deformación expresiva, al servicio de la emoción, hace de Munch uno de los padres del expresionismo."""
details = [
  "Las manos pegadas a los oídos, como para no oír más el grito.",
  "Los dos paseantes con sombrero, al fondo del puente, que no ven nada.",
  "Los dos pequeños barcos en el fiordo, en el centro.",
  "La franja de cartón bruto visible a lo largo del borde derecho.",
  "Abajo a la izquierda, la firma «E. Munch 1893».",
]
themes = ["angustia", "soledad", "crepúsculo", "expresionismo", "naturaleza"]
anecdote = """
En el cielo, arriba a la izquierda, hay una pequeña frase escrita a lápiz: «Solo puede haber sido pintado por un loco». Durante mucho tiempo se atribuyó a un visitante malintencionado; en 2021, mediante el estudio de la escritura, se reconoció que era de mano del propio Munch."""
