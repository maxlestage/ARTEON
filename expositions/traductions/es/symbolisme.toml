[[oeuvres]]
titre = "Zodíaco"
artiste = "Alfons Mucha"
annee = "1896"
image = "zodiaque.jpg"
cadre = "estampe"
technique = "Litografía en color, 65,7 × 48,2 cm"
collection = "Fundación Mucha, Praga (una de las pruebas)"
note = "Un perfil de mujer coronado de joyas, con los doce signos del zodíaco a modo de aureola: la imagen típica del Art Nouveau parisino."
description = """
Una joven aparece de perfil, vuelta hacia la izquierda, con la mirada baja. Su larga cabellera anaranjada se escapa en mechones que ondulan hasta los bordes de la imagen y terminan en volutas. Lleva una diadema cargada de piedras, de copos estilizados y de colgantes de cristal, y un pesado collar de perlas y cabujones sobre un vestido sembrado de estrellas. Tras su cabeza, un gran disco hace las veces de aureola: en su corona exterior, unos medallones muestran los doce signos del zodíaco. Todo se inscribe en un marco ornamental de ángulos redondeados, con follajes arriba, entrelazos púrpura a los lados y, abajo, dos discos y un pequeño friso de figuras voladoras dibujadas con trazo rosa."""
evocation = """
El Zodíaco resume lo que pronto se llamará el «estilo Mucha»: una mujer ideal, ni retrato ni alegoría precisa, convertida en icono decorativo. La aureola, tomada de los mosaicos bizantinos y de los iconos, hace de esta figura profana una especie de santa moderna, reina del tiempo y de los astros. Se ha visto en ella una imagen del ciclo del año, puesto que la obra debía servir de calendario, pero también el sueño de una belleza eterna, fuera de la historia. Los cabellos en «golpe de látigo», motivo fetiche del Art Nouveau, transforman la naturaleza en ornamento. La obra dice también el nuevo lugar de la imagen impresa: un arte para todos, pegado a la pared o enmarcado en un salón, que rivaliza con la pintura."""
histoire = """
Llegado a París en 1887, el checo Alfons Mucha se hace célebre de la noche a la mañana en enero de 1895 con el cartel de Gismonda para Sarah Bernhardt. Firma entonces un contrato con el impresor parisino Ferdinand Champenois, y el Zodíaco es su primera obra para él: un calendario destinado a la propia casa. El dibujo seduce a Léon Deschamps, director de la revista La Plume, que compra los derechos para hacer de él el calendario de la revista para el año 1897. La imagen conoce un gran éxito y existe en al menos nueve variantes, con o sin texto: esta, impresa sin letra, se vendía como panel decorativo. Las pruebas están hoy dispersas en numerosos museos y colecciones, entre ellas la de la Fundación Mucha."""
facture = """
Mucha dibuja su modelo y luego el impresor traslada cada color a una piedra litográfica distinta: la imagen nace de su superposición. El dibujo descansa en un contorno oscuro y regular que perfila cada forma, como el plomo de una vidriera, y en planos de colores suaves, ocre, rosa, verdigrís y púrpura. La composición está construida en torno a círculos: la aureola, los medallones, los discos de abajo, a los que responden las curvas libres de los cabellos. La influencia de la estampa japonesa se lee en el perfil nítido, sin sombra, y en el gusto por la superficie decorativa."""
details = [
  "En la aureola, los signos del zodíaco, cada uno con su símbolo astrológico.",
  "La diadema, guarnecida de copos de nieve y de colgantes de cristal.",
  "Los mechones de cabello que desbordan el marco y se enroscan en volutas.",
  "Abajo a la derecha, la luna creciente, frente al disco solar de la izquierda.",
  "La firma «Mucha» sobre el vestido estrellado, a la derecha.",
]
themes = ["art nouveau", "mujer", "astros", "ornamento", "cartel"]
anecdote = """
A Mucha no le gustaba la etiqueta «Art Nouveau»: para él, el arte no podía ser una moda, debía ser eterno. Después de 1910, dedica casi veinte años a la Epopeya eslava, veinte lienzos gigantes sobre la historia de los pueblos eslavos, donados a la ciudad de Praga en 1928."""
salle = 1
mur = "nord"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "El pobre pescador"
artiste = "Pierre Puvis de Chavannes"
annee = "1881"
image = "pauvre-pecheur.jpg"
technique = "Óleo sobre lienzo, 155,5 × 192,5 cm"
collection = "Museo de Orsay, París"
note = "Un pescador inmóvil, con las manos juntas, en una barca: la miseria convertida en meditación silenciosa, que los jóvenes simbolistas adoraron."
description = """
En primer plano, una barca gris está amarrada a la orilla de una ribera llana. Un hombre flaco y barbudo, vestido con una camisa gastada y un pantalón negro, está de pie en ella, con la cabeza gacha y las manos cruzadas ante sí. A su lado se alza un mástil oblicuo, y en el agua cuelga la red tendida por dos pértigas curvadas. Detrás, en una pradera sembrada de florecillas amarillas, una muchacha inclinada recoge flores y un niño muy pequeño yace sobre un paño rosa. Al fondo se extiende una vasta superficie de agua tranquila, bajo un cielo pálido, cerrada por colinas bajas. Todo está inmóvil, nada se mueve: ni el agua, ni el viento, ni los personajes."""
evocation = """
Puvis de Chavannes no describe un suceso social: transforma la pobreza en una imagen intemporal de la condición humana. El pescador parece rezar o esperar, y se ha visto en él, por turnos, la resignación, la fe, la esperanza que portan los niños, e incluso una figura de Cristo. Esta mezcla de sencillez y de misterio entusiasmó a los jóvenes pintores de la década de 1880: el lienzo muestra que un cuadro puede sugerir una idea o un estado de ánimo en lugar de contar una historia. La paleta apagada y las formas despojadas dicen la tristeza, pero también una paz extraña. En la época del naturalismo triunfante, Puvis prueba que se puede conmover sin anécdota ni efecto."""
histoire = """
Puvis de Chavannes, célebre por sus grandes pinturas murales, presenta El pobre pescador en el Salón de 1881. El público y una parte de la crítica quedan desconcertados: se reprocha al cuadro sus colores apagados, su dibujo juzgado torpe y su falta de verosimilitud. Pero los jóvenes artistas ven en él un manifiesto. El lienzo pertenece primero al coleccionista Émile Boivin; en 1887, el Estado lo compra por mediación del marchante Paul Durand-Ruel y lo coloca en el museo del Luxemburgo, consagrado a los artistas vivos. Para compensar a Boivin, Puvis pinta una segunda versión, vertical, hoy en el Museo Nacional de Arte Occidental de Tokio. El cuadro pasa al Louvre en 1929 y después al Museo de Orsay en su apertura, en 1986."""
facture = """
Puvis pinta al óleo, pero con el aspecto mate y claro del fresco, como en sus decoraciones murales. La gama es voluntariamente reducida: grises, beiges, verdes apagados, apenas realzados por el rosa del paño y las flores amarillas. Las formas están simplificadas, los contornos son nítidos, las sombras casi ausentes. La composición es rigurosa: el mástil oblicuo y la silueta vertical del pescador se destacan sobre las horizontales del agua y de las colinas. Este arte de la síntesis y del plano marcó profundamente a Gauguin, Seurat y los Nabis."""
details = [
  "Las manos cruzadas del pescador, entre la oración y la espera.",
  "La red tendida sobre sus pértigas, que se hunde en el agua a la izquierda.",
  "El bebé tendido sobre un paño rosa, única mancha de color cálido.",
  "Abajo a la derecha, la firma y la fecha, 1881.",
]
themes = ["pobreza", "mar", "silencio", "meditación", "familia"]
anecdote = """
Puvis no pintaba al fresco: sus grandes decoraciones del Panteón, de la Sorbona o de la biblioteca pública de Boston son lienzos pintados en su taller y luego adheridos a los muros mediante el procedimiento del «marouflage»."""
salle = 2
mur = "nord"
place = 1
largeur = 1.9

[[oeuvres]]
titre = "Júpiter y Sémele"
artiste = "Gustave Moreau"
annee = "1894–1895"
image = "jupiter-semele.jpg"
technique = "Óleo sobre lienzo, 213 × 118 cm"
collection = "Museo Gustave Moreau, París"
note = "Una mortal fulminada por el esplendor del dios al que ama: el último gran cuadro acabado de Moreau, que rebosa pedrería."
description = """
En el centro de un palacio fabuloso, sin suelo ni techo, Júpiter se sienta en su trono frente a nosotros, inmenso y hierático, con la cabeza rodeada de un nimbo rojo llameante. Sostiene una lira y una flor; sobre su muslo derecho, Sémele, desnuda y blanca, se echa hacia atrás, con el pecho ensangrentado, fulminada. El trono y las columnas están cubiertos de ornamentos, flores y pedrería. Al pie del trono, una gran águila negra despliega sus alas; a su alrededor aparecen el Dolor con una espada, un gran Pan y la Muerte con un lirio. Abajo a la izquierda, Hécate porta la luna creciente. En los ángulos se apiñan seres extraños, medio sepultados en la sombra y las joyas."""
evocation = """
El mito viene de Ovidio: Sémele, amada por Júpiter, se deja convencer por la celosa Juno de exigir que el dios se muestre ante ella en toda su gloria, y muere consumida por esa visión. Moreau hace de ello una meditación sobre lo divino: según el largo texto que escribió para explicar el cuadro, Sémele muere fulminada y, con ella, muere el genio del amor terrenal. Se ha visto en él una alegoría de la elevación del alma, que no puede contemplar lo absoluto sin ser aniquilada, y una imagen de la propia creación artística. Las figuras de la Muerte, del Dolor y de Pan recuerdan que el mundo terrenal queda abajo, aplastado. Para los escritores decadentes, Moreau era el pintor de los sueños imposibles."""
histoire = """
Moreau piensa en el tema desde finales de la década de 1880 y pinta varias versiones y bocetos, entre ellos un pequeño lienzo hoy en su museo. Trabaja sobre todo en la gran composición en 1894 y 1895, mientras enseña en la Escuela de Bellas Artes, donde tiene como alumnos a Matisse y Rouault. Es uno de los últimos grandes cuadros que concluye antes de su muerte en 1898. Moreau legó al Estado su casa de la rue de La Rochefoucauld, que había hecho ampliar a partir de 1895 con dos vastos talleres superpuestos, para mostrar en ella el conjunto de su obra. El museo abre en 1903 con Georges Rouault como primer conservador. Júpiter y Sémele ocupa allí un lugar de honor, entre centenares de pinturas y miles de dibujos."""
facture = """
Moreau superpone una pintura muy fluida, a veces casi abstracta, y una red de detalles minuciosos trazados con pincel fino, a la manera de un orfebre. Los ornamentos, las joyas y las arquitecturas se inspiran en el arte indio, persa y bizantino y en las miniaturas, que estudiaba en los libros y en los museos. El formato muy alto y la composición piramidal conducen la mirada desde la parte baja, hormigueante y sombría, hasta la cima luminosa, donde reinan el azul del cielo y el rojo del nimbo. Los blancos de Sémele y de la Muerte resaltan como destellos de luz en esta profusión."""
details = [
  "El nimbo rojo, radiante como un haz de llamas, tras la cabeza de Júpiter.",
  "La sangre que corre por el costado de Sémele, echada sobre el muslo del dios.",
  "Bajo el pie derecho de Júpiter, una serpiente que se muerde la cola, símbolo de eternidad.",
  "La gran águila negra, ave de Júpiter, de alas desplegadas al pie del trono.",
  "Abajo a la izquierda, Hécate y su luna creciente.",
]
themes = ["mitología", "divino", "muerte", "amor", "orientalismo"]
anecdote = """
En Al revés, novela de Huysmans publicada en 1884, el héroe, Des Esseintes, colecciona obras de Gustave Moreau y contempla largamente su Salomé: el libro convirtió a Moreau en el ídolo de toda una generación decadente y simbolista."""
salle = 2
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "El cíclope"
artiste = "Odilon Redon"
annee = "hacia 1914"
image = "cyclope.jpg"
technique = "Óleo sobre cartón adherido a tabla, 65,8 × 52,7 cm"
collection = "Museo Kröller-Müller, Otterlo"
note = "Un gigante de un solo ojo espía, tras la montaña, a una ninfa dormida entre las flores."
description = """
Una colina cubierta de flores y rocas ocupa casi todo el lienzo, en una masa de colores violetas, rosas, verdes, anaranjados y pardos. Tras la cresta, por encima, surge la enorme cabeza redonda de un gigante, apoyada sobre anchos hombros desnudos: un rostro casi sin rasgos, infantil, dominado por un único ojo inmenso, abierto y redondo. Mira hacia abajo, a la derecha. Allí, tendida entre las flores, duerme una joven desnuda, con el rostro oculto, el cuerpo color carne casi fundido con la vegetación. El cielo nuboso, gris azulado y blanquecino, se abre tras el gigante. Ninguna sombra, ninguna perspectiva nítida: todo parece flotar."""
evocation = """
Redon retoma un episodio de las Metamorfosis de Ovidio: el cíclope Polifemo, enamorado de la ninfa Galatea, que no lo quiere. El monstruo, habitualmente aterrador, se vuelve aquí tímido, casi conmovedor, oculto tras la montaña y sin atreverse a acercarse a la bella dormida. Se ha visto en él una imagen del deseo imposible, de la mirada que contempla sin poder poseer, e incluso del propio pintor, ojo inmenso posado sobre el mundo. Algunos historiadores recuerdan también los gigantes de un solo ojo de los cuentos de Aquitania, donde Redon creció. El gran ojo, motivo obsesivo de sus litografías, pasa aquí de la pesadilla al sueño coloreado."""
histoire = """
Durante más de veinte años, Redon trabajó casi solo en negro, al carboncillo y en litografía, poblando sus álbumes de ojos flotantes, cabezas cortadas y seres híbridos. A partir de la década de 1890, se vuelve hacia el color, el pastel y luego el óleo, y sus temas se hacen más serenos: flores, mitos, barcas y visiones religiosas. El cíclope pertenece a estos últimos años; su fecha es discutida, entre finales de la década de 1890 y 1914, pero se sitúa con más frecuencia hacia 1914. Hoy se conserva en el museo Kröller-Müller de Otterlo, en los Países Bajos, en medio de un bosque, célebre también por su gran colección de cuadros de Van Gogh."""
facture = """
La materia es espesa e irregular, hecha de toques yuxtapuestos, raspados o aplicados en capas ligeras que dejan vibrar los colores. Redon trata la colina como una alfombra de piedras preciosas, sin contorno ni dibujo preciso, al borde de la abstracción. Solo el gigante y la ninfa están modelados de manera más simple, en tonos carne. El pintor, admirado por los Nabis, mezcla aquí el recuerdo de sus negros, en la cabeza redonda y el ojo fijo, con una explosión de colores que los fauvistas y los surrealistas mirarán con interés."""
details = [
  "El ojo único, en el centro de la frente, sin ceja ni párpado aparente.",
  "Los hombros del gigante, apoyados en la cresta como si se escondiera.",
  "A la derecha, la ninfa dormida, con el rostro oculto en el brazo.",
  "Abajo a la derecha, la firma «Odilon Redon».",
]
themes = ["mitología", "sueño", "mirada", "deseo", "color"]
anecdote = """
En 1883, en su álbum de litografías Los orígenes, Redon ya había imaginado un «pólipo deforme» que flotaba en las orillas, «especie de cíclope sonriente y horrible»: treinta años después, el monstruo negro se ha convertido en un gigante tímido y colorido."""
salle = 2
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Ofelia"
artiste = "John Everett Millais"
annee = "1851–1852"
image = "ophelie.jpg"
technique = "Óleo sobre lienzo, 76,2 × 111,8 cm"
collection = "Tate Britain, Londres"
note = "Ofelia flota cantando, antes de hundirse: cada flor, cada brizna de hierba del río inglés fue pintada del natural."
description = """
Una joven flota boca arriba en un río oscuro, con los ojos abiertos, la boca entreabierta, las manos alzadas fuera del agua, con las palmas abiertas. Su vestido bordado de plata, hinchado de agua, se extiende a su alrededor y empieza a hundirse. De sus manos se escapan flores que van a la deriva: amapola roja, pensamientos, margaritas, violetas. Alrededor, la orilla está invadida de vegetación: un sauce inclinado sobre el agua, ortigas, juncos a la izquierda, un escaramujo de flores blancas, salicaria púrpura a la derecha. Un petirrojo está posado en una rama, arriba a la izquierda. La parte superior del cuadro es de arco, lo que da a la escena el aire de un retablo profano."""
evocation = """
Millais ilustra la muerte de Ofelia narrada por la reina Gertrudis en el Hamlet de Shakespeare: enloquecida tras la muerte de su padre, la joven cae en un arroyo y se deja llevar cantando. Las flores tienen un sentido que el público victoriano sabía leer: la amapola para la muerte, los pensamientos para el amor vano, las violetas para la fidelidad y la muerte temprana, las margaritas para la inocencia. La naturaleza, de una precisión deslumbrante e indiferente, contrasta con el drama humano. El cuadro fijó durante mucho tiempo la imagen de la joven muerta y bella, entre inocencia, locura y sensualidad, figura que obsesionará a poetas y pintores, de Rimbaud, que le dedica un poema en 1870, a Redon."""
histoire = """
Millais, uno de los tres fundadores de la Hermandad Prerrafaelita en 1848, pinta primero el paisaje, al aire libre, a orillas del río Hogsmill, cerca de Ewell, en Surrey, durante el verano y el otoño de 1851, trabajando largas horas cada día. Pinta después la figura en su taller de Londres durante el invierno. El cuadro se expone en la Royal Academy en 1852; la crítica está dividida, pero la precisión del paisaje impresiona. Se vende al marchante Henry Farrer, pasa luego por varias colecciones y es adquirido por el industrial del azúcar Henry Tate, que lo dona a la nación en 1894 con su colección: esta constituye el núcleo de la Tate Gallery, abierta en 1897 en Millbank."""
facture = """
Fiel a los principios prerrafaelitas, Millais pinta cada planta del natural, con precisión de botánico, sobre un lienzo preparado en blanco, para que los colores permanezcan claros y luminosos. Aplica los tonos con pequeños toques, con pincel fino, sin fundirlos en una penumbra como hacían los pintores académicos. La luz es uniforme, sin fuente precisa, lo que da a cada detalle la misma intensidad. La composición, horizontal y apretada, sin cielo, encierra al espectador en el río, muy cerca de la figura."""
details = [
  "El petirrojo en la rama del sauce, arriba a la izquierda.",
  "La amapola roja que flota junto a la mano derecha de Ofelia.",
  "El collar de violetas alrededor de su cuello.",
  "El sauce y las ortigas de la orilla, símbolos de amor abandonado y de dolor.",
  "El bordado de plata del vestido, que centellea bajo el agua.",
]
themes = ["shakespeare", "muerte", "naturaleza", "flores", "locura"]
anecdote = """
La modelo, Elizabeth Siddal, posó durante horas en una bañera llena de agua, calentada por lámparas colocadas debajo. Un día, las lámparas se apagaron sin que el pintor se diera cuenta: ella se resfrió, y su padre amenazó al pintor con una demanda hasta que este aceptó pagar los gastos del médico."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Beata Beatrix"
artiste = "Dante Gabriel Rossetti"
annee = "hacia 1864–1870"
image = "beata-beatrix.jpg"
technique = "Óleo sobre lienzo, 86,4 × 66 cm"
collection = "Tate Britain, Londres"
note = "La Beatriz de Dante en el umbral de la muerte, con los rasgos de la esposa que Rossetti acababa de perder."
description = """
Una mujer de largos cabellos pelirrojos, vista de medio cuerpo, está sentada, con la cabeza echada hacia atrás, los ojos cerrados, los labios entreabiertos. Lleva un vestido verde sobre una túnica violeta oscuro, y sus manos están juntas, apoyadas en un reborde. Un pájaro rojo, con aureola, desciende hacia ella y deja caer en sus manos una amapola blanca. Tras ella, sobre un parapeto, un reloj de sol proyecta su sombra. El fondo se baña en una luz dorada y brumosa: se distinguen un puente sobre un río y dos siluetas, una vestida de rojo a la izquierda, otra oscura a la derecha, que parecen mirarse por encima de la cabeza de la joven."""
evocation = """
Rossetti representa a Beatriz, la mujer amada de Dante, tal como la describe el poeta en la Vita Nuova, en el momento de su muerte en Florencia en 1290: no la agonía, sino una especie de éxtasis, de tránsito espiritual hacia el más allá. El pájaro rojo es un mensajero de la muerte, la amapola evoca el sueño, y se ha visto también una alusión al láudano, derivado del opio, que había matado a Elizabeth Siddal. El reloj de sol marcaría la hora nona, pues el nueve es el número de Beatriz en Dante. Al fondo, el puente de Florencia y las figuras del Amor, de rojo, y de Dante completan el sueño. El cuadro es a la vez un homenaje y un duelo."""
histoire = """
Elizabeth Siddal, modelo de los prerrafaelitas, pintora y poeta ella misma, se casa con Rossetti en 1860. Muere en febrero de 1862 por una sobredosis de láudano. Rossetti, que se compara desde siempre con Dante, de quien su padre, exiliado italiano en Londres, era un gran especialista, emprende hacia 1864 este retrato póstumo, pintado de memoria y a partir de sus dibujos de ella. Lo concluye hacia 1870. El cuadro tiene mucho éxito y Rossetti realiza varias réplicas, una de ellas en el Art Institute de Chicago. La versión original pertenece después a Lord Mount-Temple; en 1889, su viuda la dona a la nación en recuerdo de él. Entra así en las colecciones nacionales y luego en la Tate."""
facture = """
Rossetti abandona aquí la precisión de los inicios prerrafaelitas por una pintura más suave y vaporosa, donde los contornos se disuelven en una luz dorada. Los colores, verde, rojo y violeta, tienen un valor simbólico: el verde de la esperanza, el violeta del duelo, el rojo del amor y de la muerte. El rostro, bañado de luz y rodeado de un halo de cabellos, se convierte en el centro luminoso del cuadro. Esta manera de hacer del rostro femenino un icono silencioso anuncia las «cabezas» de mujer que dominarán el final de su carrera."""
details = [
  "El pájaro rojo con aureola que sostiene en el pico la amapola blanca.",
  "El reloj de sol, tras la joven, y su sombra.",
  "Al fondo, el puente sobre el Arno, que sitúa la escena en Florencia.",
  "Las dos siluetas, el Amor de rojo a la izquierda y Dante a la derecha.",
  "Abajo a la izquierda, el monograma de Rossetti.",
]
themes = ["duelo", "amor", "dante", "muerte", "éxtasis"]
anecdote = """
El día del entierro de Elizabeth Siddal, Rossetti deslizó en su ataúd el manuscrito de sus poemas. Siete años después, en 1869, los hizo exhumar en el cementerio de Highgate y los publicó en su libro Poems, en 1870."""
