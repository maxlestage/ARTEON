[[oeuvres]]
titre = "Las caricias"
artiste = "Fernand Khnopff"
annee = "1896"
image = "caresses.jpg"
technique = "Óleo sobre lienzo, 50,5 × 150 cm"
collection = "Reales Museos de Bellas Artes de Bélgica, Bruselas"
note = "Un joven y una esfinge de cuerpo de guepardo, mejilla contra mejilla: el enigma del deseo, pintado por el gran simbolista belga."
description = """
En un lienzo muy alargado, un joven de cabellos pelirrojos, con el torso desnudo y un paño azul y gris anudado a la cintura, se sitúa a la izquierda y mira directamente hacia nosotros. Con la mano derecha sostiene un bastón rematado con alas y una bola azul. Contra él se aprieta una criatura de cuerpo de guepardo moteado y cabeza de mujer, de cabellos rubios, con los ojos entornados, que apoya su mejilla contra la suya y posa una pata en su cadera. Su larga cola moteada se despliega hacia la derecha. En segundo plano, un ciprés oscuro, un muro blanco con signos, dos columnas azules y un paisaje desértico rojizo bajo un cielo pálido."""
evocation = """
Khnopff se inspira en el mito de Edipo y la Esfinge, y en el lienzo que Gustave Moreau le había dedicado en 1864. Pero el enfrentamiento se ha convertido en abrazo: la esfinge ya no plantea un enigma, acaricia, y el joven parece dudar entre el abandono y la resistencia. Se ha visto en ello la oposición entre el espíritu y la sensualidad, el arte que se deja seducir por la carne, o el tema finisecular de la mujer fatal. La obra llevó mucho tiempo el título El arte, y el bastón alado podría designar al artista. Los dos rostros, que se parecen extrañamente, se inspiran en la hermana del pintor, Marguerite: la androginia del joven difumina aún más la frontera entre los sexos."""
histoire = """
Khnopff pinta este lienzo en Bruselas en 1896, en la cumbre de su reputación. Miembro fundador del círculo de vanguardia Los XX en 1883, expone también en París, en los Salones de la Rosa+Cruz de Joséphin Péladan, y mira hacia Inglaterra, donde admira a Burne-Jones y escribe para la revista The Studio. Sus obras son muy admiradas en Viena: la Secesión vienesa le concede un amplio espacio, y Klimt aprende la lección de sus figuras enigmáticas. El cuadro, conocido con varios títulos, El arte, Las caricias o Las caricias de la esfinge, es hoy una de las piezas maestras de las colecciones simbolistas de los Reales Museos de Bellas Artes de Bélgica, en Bruselas, expuesto en el museo Fin-de-Siècle."""
facture = """
El formato de friso, muy alargado, recuerda los bajorrelieves antiguos y obliga a la mirada a deslizarse de izquierda a derecha, del rostro del joven a la cola de la esfinge. Khnopff pinta con pincelada fina y lisa, en una gama pálida de beiges, ocres y rosas, apenas realzada por el azul de las columnas y del paño. Trabajaba a menudo a partir de sus propias fotografías, que retocaba y recomponía. La luz uniforme y la ausencia de sombra fuerte dan a la escena una inmovilidad de sueño, reforzada por el decorado enigmático y vacío."""
details = [
  "El bastón alado rematado con una bola azul, en la mano del joven.",
  "Las misteriosas inscripciones en el muro blanco del centro.",
  "La pata del guepardo posada en la cadera del joven.",
  "Las dos columnas azules aisladas en el paisaje, a la derecha.",
]
themes = ["esfinge", "deseo", "androginia", "mitología", "mujer fatal"]
anecdote = """
Khnopff se hizo construir en Bruselas, a comienzos del siglo XX, una casa-taller blanca, azul y dorada, concebida como un templo dedicado a sí mismo. Fue demolida en 1938; solo quedan fotografías."""
