[[artistes]]
nom = "Alfons Mucha"
vie = "Ivančice (Moravia), 24 de julio de 1860 – Praga, 14 de julio de 1939"
biographie = """
Nacido en Moravia, entonces parte del Imperio austríaco, Alfons Mucha trabaja primero como pintor de decorados de teatro en Viena y luego, gracias a un protector, estudia en Múnich. Se instala en París en 1887, sigue los cursos de las academias Julian y Colarossi y vive con dificultad de sus ilustraciones. A finales de 1894 dibuja casi por casualidad el cartel de Gismonda para Sarah Bernhardt: colocado en las calles de París en enero de 1895, causa sensación. La trágica le confía todos sus carteles durante seis años, y el impresor Champenois lo contrata. Carteles, paneles decorativos, joyas para Fouquet, publicidad: su estilo se convierte en la imagen misma del Art Nouveau. Decora el pabellón de Bosnia-Herzegovina en la Exposición Universal de 1900. Tras varias estancias en Estados Unidos, regresa a Bohemia en 1910 para dedicar casi veinte años a la Epopeya eslava. Dibuja los primeros billetes y sellos de la Checoslovaquia independiente en 1918. Detenido e interrogado por la Gestapo en 1939, muere poco después en Praga."""
style = """
Mucha creó un lenguaje inmediatamente reconocible: una mujer ideal, a menudo de perfil, de cabellos desplegados en arabescos, inscrita en un círculo o una aureola y rodeada de flores, joyas y ornamentos. Asocia un contorno oscuro y regular a colores suaves, y mezcla fuentes bizantinas, japonesas y eslavas. Sus Documentos decorativos de 1902, colección de modelos, difundieron su estilo en las artes aplicadas. Redescubierto en la década de 1960, inspiró el cartel psicodélico y el cómic."""

[[artistes]]
nom = "Pierre Puvis de Chavannes"
vie = "Lyon, 14 de diciembre de 1824 – París, 24 de octubre de 1898"
biographie = """
Hijo de un ingeniero de minas, Pierre Puvis de Chavannes renuncia a los estudios de ingeniería tras una enfermedad y descubre Italia, que decide su vocación. Se forma brevemente junto a Delacroix y luego junto a Thomas Couture, pero pronto encuentra su camino por sí solo. Sus primeros envíos al Salón son a menudo rechazados; el éxito llega en la década de 1860 con grandes composiciones alegóricas destinadas al museo de Amiens. Se convierte entonces en el gran pintor de decoraciones murales de la Tercera República: la vida de santa Genoveva en el Panteón, el Bosque sagrado para el anfiteatro de la Sorbona, las decoraciones de los museos de Lyon y de Ruan, del Ayuntamiento de París y de la biblioteca pública de Boston. En 1890 participa en la fundación de la Société nationale des beaux-arts, que preside. Admirado tanto por los jóvenes pintores como por las instituciones, se casa en 1897 con la princesa Marie Cantacuzène, su compañera desde hacía mucho tiempo, que muere pocos meses antes que él."""
style = """
Puvis simplifica las formas, reduce los colores a tonos claros y mates, suprime el detalle y el movimiento para alcanzar una grandeza serena e intemporal. Sus figuras, inmóviles en paisajes despojados, sugieren una idea más que cuentan una historia. Este lenguaje del silencio y del plano lo convirtió en el precursor común del simbolismo, de Gauguin, de Seurat, de los Nabis e incluso del joven Picasso del periodo azul."""

[[artistes]]
nom = "Gustave Moreau"
vie = "París, 6 de abril de 1826 – París, 18 de abril de 1898"
biographie = """
Hijo de un arquitecto parisino, Gustave Moreau ingresa en la Escuela de Bellas Artes en el taller de François-Édouard Picot, pero quien más lo marca es Théodore Chassériau, mayor que él. De 1857 a 1859 reside en Italia, donde copia incansablemente a los maestros del Renacimiento. Triunfa en el Salón de 1864 con Edipo y la Esfinge y luego expone en 1876 su Salomé y la acuarela de La aparición, que fascinan a los escritores, de Huysmans a Jean Lorrain. Poco a poco, se retira del Salón y trabaja en el secreto de su taller, acumulando proyectos y bocetos. Elegido miembro de la Academia de Bellas Artes en 1888, se convierte en profesor de la Escuela de Bellas Artes en 1891: su enseñanza, libre y abierta, forma a Matisse, Rouault y Marquet. Poco antes de su muerte, transforma su casa de la rue de La Rochefoucauld en museo, que lega al Estado con varios miles de obras. El Museo Gustave Moreau abre en 1903."""
style = """
Moreau es el gran pintor del mito y de la ensoñación erudita. Sobrecarga sus lienzos de arquitecturas, joyas y ornamentos tomados de la India, de Persia, de Bizancio, trazados con pincel fino sobre fondos a veces pintados muy libremente, casi abstractos. Sus heroínas, Salomé, Sémele, Galatea, encarnan a la mujer fatal o el ideal inaccesible. Dio al simbolismo sus imágenes más preciosas, y la libertad de sus bocetos sedujo a los fauvistas y a los surrealistas."""

[[artistes]]
nom = "Odilon Redon"
vie = "Burdeos, 20 de abril de 1840 – París, 6 de julio de 1916"
biographie = """
Bertrand Jean Redon, llamado Odilon, pasa una infancia solitaria en la finca familiar de Peyrelebade, en el Médoc. Estudia durante un tiempo arquitectura y luego pintura en París en el taller de Gérôme, sin éxito. Su verdadero encuentro es el del grabador Rodolphe Bresdin, en Burdeos, que le enseña el aguafuerte y la libertad de la imaginación. Durante más de veinte años, Redon trabaja en negro, al carboncillo y en litografía: los álbumes En el sueño, en 1879, A Edgar Poe, Los orígenes u Homenaje a Goya pueblan su obra de ojos flotantes, cabezas cortadas y monstruos. Huysmans lo celebra en Al revés en 1884, y los poetas simbolistas, con Mallarmé a la cabeza, se hacen amigos suyos. Hacia 1890, tras el nacimiento de su hijo Arï, se vuelve hacia el color, pastel y óleo, y pinta flores, mitos y grandes decoraciones, como las de la abadía de Fontfroide. Los Nabis lo veneran, y expone en el Armory Show de Nueva York en 1913."""
style = """
Redon quiere, según sus propias palabras, poner la lógica de lo visible al servicio de lo invisible. Sus negros, de un aterciopelado profundo, dan vida a criaturas nacidas del sueño y de la ciencia de su tiempo, microbios y seres híbridos. Sus colores, más tarde, se aplican en toques preciosos que parecen irradiar. Independiente de toda escuela, abrió el camino a los Nabis, a Matisse y a los surrealistas, que veían en él a un precursor."""

[[artistes]]
nom = "John Everett Millais"
vie = "Southampton, 8 de junio de 1829 – Londres, 13 de agosto de 1896"
biographie = """
Niño prodigio, John Everett Millais ingresa a los once años en las escuelas de la Royal Academy, el alumno más joven jamás admitido. En 1848 funda con William Holman Hunt y Dante Gabriel Rossetti la Hermandad Prerrafaelita, que quiere volver a la sinceridad de los pintores anteriores a Rafael y al estudio escrupuloso de la naturaleza. Su Cristo en la casa de sus padres, en 1850, desata un escándalo, y Charles Dickens lo ataca con violencia. El crítico John Ruskin sale en defensa del grupo; Millais se enamora de su mujer, Effie Gray, que obtiene la anulación de su matrimonio y se casa con el pintor en 1855. Millais se convierte después en uno de los artistas más ricos y populares de Inglaterra, retratista solicitado y autor de escenas sentimentales, como Bubbles, utilizado para un anuncio de jabón. Nombrado baronet en 1885, elegido presidente de la Royal Academy pocos meses antes de su muerte, es enterrado en la catedral de San Pablo."""
style = """
En sus años prerrafaelitas, Millais pinta con precisión minuciosa, del natural, colores claros y brillantes, y compone escenas cargadas de símbolos. Evoluciona después hacia una pincelada más amplia y más libre, inspirada en Velázquez y en los maestros antiguos. Ofelia sigue siendo una de las imágenes más reproducidas de la pintura inglesa y el modelo de toda una estirpe de bellas muertas simbolistas."""

[[artistes]]
nom = "Dante Gabriel Rossetti"
vie = "Londres, 12 de mayo de 1828 – Birchington-on-Sea, 9 de abril de 1882"
biographie = """
Hijo de Gabriele Rossetti, poeta y patriota italiano exiliado en Londres y especialista en Dante, y hermano de la poeta Christina Rossetti, Dante Gabriel crece entre la pintura y la literatura. Alumno durante un tiempo de Ford Madox Brown, funda en 1848 la Hermandad Prerrafaelita con Millais y Hunt. Conoce a Elizabeth Siddal, que se convierte en su modelo, su alumna y, en 1860, su esposa; su muerte en 1862 lo trastorna. Instalado después en Chelsea, en una casa de Cheyne Walk donde mantiene una casa de fieras, pinta una serie de figuras femeninas ideales, inspiradas en Fanny Cornforth, Alexa Wilding y sobre todo Jane Morris, esposa de su amigo William Morris. Sus Poems, publicados en 1870, son atacados como inmorales; agotado, dependiente del hidrato de cloral, atraviesa una grave crisis en 1872 y muere diez años después en la costa de Kent. Influyó en Burne-Jones, en Morris y en todo el movimiento estético."""
style = """
Pintor y poeta, Rossetti mezcla ambas artes: escribe sonetos para sus cuadros e inscribe versos en sus marcos. Tras la precisión de los comienzos prerrafaelitas, pinta mujeres de medio cuerpo, de abundantes cabelleras, labios carnosos y mirada lejana, en colores ricos y cálidos. Estos iconos de la belleza y del sueño anunciaron el simbolismo europeo y el esteticismo de finales de siglo."""

[[artistes]]
nom = "John William Waterhouse"
vie = "Roma, 1849 (bautizado el 6 de abril) – Londres, 10 de febrero de 1917"
biographie = """
Hijo de dos pintores ingleses establecidos en Roma, John William Waterhouse pasa sus primeros años en Italia antes de que la familia regrese a Londres. Ayuda a su padre en el taller y luego ingresa en 1870 en las escuelas de la Royal Academy. Sus primeros éxitos son escenas antiguas al gusto de Lawrence Alma-Tadema, como Santa Eulalia, en 1885. Con La Dama de Shalott, en 1888, se vuelve hacia los temas queridos por los prerrafaelitas: la leyenda artúrica, Tennyson, Keats, Shakespeare y los mitos griegos. Elegido miembro de la Royal Academy en 1895, pinta Hilas y las ninfas al año siguiente y después una larga serie de brujas, sirenas y ninfas. Instalado en St John's Wood, lleva una vida discreta, casado con la pintora Esther Kenworthy. Su pintura, pasada de moda tras su muerte en 1917, ha recuperado un inmenso público desde la década de 1970."""
style = """
A menudo llamado «el prerrafaelita moderno», Waterhouse une los temas poéticos y las mujeres soñadoras de Rossetti a la pincelada más libre de la pintura francesa al aire libre y de Jules Bastien-Lepage. Sus composiciones son claras, sus figuras sólidamente dibujadas, sus paisajes vibrantes. Prolongó la tradición prerrafaelita hasta el siglo XX y fijó, para el gran público, la imagen de las heroínas de la leyenda y de la mitología."""

[[artistes]]
nom = "Arnold Böcklin"
vie = "Basilea, 16 de octubre de 1827 – San Domenico di Fiesole, 16 de enero de 1901"
biographie = """
Nacido en Basilea, Arnold Böcklin estudia pintura en Düsseldorf y luego viaja a Ginebra, Bruselas y París antes de descubrir Roma en 1850: Italia y su paisaje antiguo se convierten en el corazón de su obra. Los comienzos son difíciles, y vive durante mucho tiempo en la estrechez. Enseña durante un tiempo en la escuela de arte de Weimar, recién fundada, pinta frescos en Basilea y vive después sucesivamente en Múnich, Florencia y Zúrich. Sus lienzos poblados de centauros, náyades, faunos y tritones le valen primero burlas y luego, a partir de la década de 1880, una inmensa gloria, sobre todo en Alemania, donde pasa por el mayor pintor vivo. En 1872 se pinta con la Muerte tocando el violín tras su hombro. Afectado por un ataque en 1892, se establece cerca de Florencia, en Fiesole, donde muere en 1901. Varios de sus hijos murieron jóvenes, y la muerte es uno de sus temas constantes."""
style = """
Böcklin mezcla la herencia clásica de Italia con un imaginario nórdico, poderoso y a veces brutal. Sus paisajes, construidos con rigor, se cargan de una atmósfera extraña, y sus criaturas mitológicas tienen una presencia carnal, casi cómica. Su pintura de colores francos, a menudo a la témpera, alimentó el simbolismo alemán, a Max Klinger, a Giorgio De Chirico y la pintura metafísica, y después a los surrealistas, que admiraban su misterio."""

[[artistes]]
nom = "Edvard Munch"
vie = "Ådalsbruk, Løten (Noruega), 12 de diciembre de 1863 – Ekely, cerca de Oslo, 23 de enero de 1944"
biographie = """
Edvard Munch crece en Kristiania, la actual Oslo, en una familia marcada por la enfermedad: su madre muere de tuberculosis cuando él tiene cinco años, su hermana mayor Sophie cuando tiene trece. Abandona sus estudios de ingeniería por la pintura y frecuenta la bohemia de Kristiania. Una beca lo lleva a París en 1889, donde descubre el impresionismo, a Gauguin y a Van Gogh. En 1892, su exposición en Berlín causa escándalo y debe cerrar al cabo de una semana: el asunto contribuye al nacimiento de la Secesión berlinesa. Munch vive allí varios años y compone el Friso de la vida, ciclo sobre el amor, la angustia y la muerte, del que forma parte El grito. Agotado por el alcohol y las crisis, se hace tratar en Copenhague en 1908-1909 y luego regresa a Noruega. Pinta los grandes lienzos del Aula de la Universidad de Oslo y vive retirado en Ekely. En 1937, los nazis retiran sus obras de los museos alemanes. Lega su producción a la ciudad de Oslo."""
style = """
Munch pinta los estados de ánimo más que las apariencias: simplifica las formas, deforma los cuerpos y el paisaje, y emplea colores violentos y simbólicos. Sus líneas onduladas, próximas al Art Nouveau, unen la figura y su decorado en una misma emoción. Grabador innovador, renovó el grabado en madera y la litografía. Se le considera uno de los padres del expresionismo, que se desarrolló en Alemania a su estela."""

[[artistes]]
nom = "Fernand Khnopff"
vie = "Grembergen (Bélgica), 12 de septiembre de 1858 – Bruselas, 12 de noviembre de 1921"
biographie = """
Fernand Khnopff pasa parte de su infancia en Brujas, ciudad silenciosa que obsesionará su obra. Comienza estudios de derecho, los abandona por la Academia de Bellas Artes de Bruselas y luego descubre en París, en la Exposición Universal de 1878, las obras de Gustave Moreau y de Edward Burne-Jones. En 1883 funda con James Ensor y otros jóvenes artistas el círculo Los XX, foco de la vanguardia belga. Expone después en los Salones de la Rosa+Cruz de Joséphin Péladan en París y luego en la Secesión vienesa, donde cosecha un gran éxito. Su hermana Marguerite, su modelo preferida, aparece en gran número de sus cuadros. Ilustra Brujas la muerta de Georges Rodenbach, diseña decorados y trajes para el teatro de La Monnaie y escribe para la revista inglesa The Studio. A comienzos del siglo XX se hace construir en Bruselas una casa-taller concebida como un templo. Se casa en 1908 con Marthe Worms, de quien se divorcia poco después."""
style = """
Khnopff es el más refinado de los simbolistas belgas: figuras inmóviles, miradas fijas, rostros andróginos, decorados vacíos y enigmáticos. Trabaja con pincelada fina y lisa, en gamas pálidas, a menudo a partir de sus propias fotografías. El silencio, el recuerdo, el repliegue sobre sí mismo y el misterio del deseo son sus temas. Su influencia fue grande en Viena, en particular sobre Gustav Klimt."""
