[exposition]
ordre = 160
nom_court = "Simbolismo"
mouvement = "Simbolismo y Art Nouveau"
cadre = "dore"
couleur = "#5e3a6e"
titre = "El Simbolismo, sueños, mitos y visiones"
artiste = "Moreau, Redon, Munch, Böcklin, Rossetti, Millais, Mucha…"
dates = "1851–1914"
accroche = "Exposición virtual · Museo Gustave Moreau, París, y Tate Britain, Londres"
introduction = """
Frente al realismo y al impresionismo, los simbolistas quieren pintar lo que el ojo no ve: el sueño, el mito, la angustia, la muerte y el deseo. La visita sigue esta corriente desde los prerrafaelitas ingleses de mediados de siglo hasta las visiones de Redon, pasando por El grito de Munch, La isla de los muertos de Böcklin y los arabescos Art Nouveau de Mucha. El edificio se inspira en la casa-taller de Gustave Moreau en París, cuyo gran taller, altísimo, está cubierto de cuadros del suelo al techo, y, para la sala inglesa, en las galerías de la Tate Britain de Londres."""
vitrine = "cri.jpg"

[musee]
nom = "Museo Gustave Moreau"
ville = "París, Francia"
architecte = "Albert Lafon"
construction = "inaugurado en 1903"
presentation = """
En el número 14 de la rue de La Rochefoucauld, en el barrio de la Nouvelle Athènes, los padres de Gustave Moreau compran en 1852 un palacete en el que el pintor vivirá hasta su muerte. Ya mayor, Moreau piensa en el porvenir de su obra: en 1895 hace sobreelevar la casa por el arquitecto Albert Lafon para crear dos inmensos talleres superpuestos, concebidos desde el principio como un museo y unidos por una espectacular escalera de caracol. A su muerte, en 1898, lega al Estado la casa y todo lo que contiene; el museo abre en 1903, con Georges Rouault, su antiguo alumno en la Escuela de Bellas Artes, como primer conservador. Todavía se visita el pequeño apartamento del artista, con sus muebles y sus recuerdos, y luego los talleres, donde pinturas, acuarelas y cartones cubren las paredes del suelo al techo, mientras miles de dibujos duermen en muebles de paneles giratorios."""
ici = """
ARTEON retoma su recorrido, de la casa al taller, a nivel del suelo. El vestíbulo, pequeño y bajo, recibe al visitante por el sur con el Zodíaco de Mucha. Al norte se abre El gran taller, de 10 metros de altura y paredes beige rosado, donde los lienzos franceses se apiñan en el muro del fondo como en casa de Moreau. Dos puertas laterales conducen, al oeste, a La galería prerrafaelita, cuadrada, a la manera de las salas de la Tate Britain, y, al este, a La sala del Norte, la más baja de las tres grandes salas, donde concluye la visita."""

