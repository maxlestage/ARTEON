[[oeuvres]]
titre = "La isla de los muertos"
artiste = "Arnold Böcklin"
annee = "1880"
image = "ile-des-morts.jpg"
technique = "Óleo sobre lienzo, 111 × 155 cm"
collection = "Kunstmuseum, Basilea"
note = "Una barca se desliza hacia una isla de rocas y cipreses: la primera versión del cuadro que hizo soñar a toda Europa."
description = """
Sobre un mar inmóvil y oscuro, bajo un cielo de tormenta gris azulado, se alza una pequeña isla rocosa. Sus acantilados, iluminados por una luz dorada, forman como dos brazos que rodean una cala. En la roca están excavadas puertas y ventanas, como tumbas. En el centro, un grupo de altos cipreses negros se eleva hacia el cielo. Una barca se acerca a la orilla: un remero, de espaldas, la guía, y a proa está de pie una figura envuelta en blanco, ante un objeto cubierto con un paño blanco que parece un ataúd. Ningún ruido, ningún viento: el silencio es total."""
evocation = """
Böcklin no precisa nada: quién ha muerto, quién acompaña al difunto, dónde se encuentra la isla. El cuadro evoca el viaje al más allá, la barca de Caronte sobre el Estigia, el último paso. Los cipreses son desde la Antigüedad los árboles de los cementerios. A menudo se lo ha descrito como un «cuadro para soñar». La imagen ha fascinado hasta la obsesión: se ha visto en ella la paz de la muerte, pero también su angustia, y muchos hogares alemanes tenían una reproducción; Strindberg la evoca al final de su obra La sonata de los espectros. Para los surrealistas, y en primer lugar para Giorgio De Chirico, esta arquitectura muda y esta luz extraña abren el camino a la pintura metafísica."""
histoire = """
Böcklin, pintor suizo nacido en Basilea, vive entonces en Florencia. Concluye esta primera versión en mayo de 1880, para su mecenas Alexander Günther, pero finalmente se la queda. En abril, cuando el lienzo aún no está terminado, Marie Berna, una joven viuda, visita su taller y le pide un cuadro semejante: pinta para ella una versión más pequeña sobre tabla, hoy en el Metropolitan Museum de Nueva York, y añade, a petición suya, el ataúd y la figura blanca, que traslada también a este primer lienzo. El título lo da en 1883 el marchante berlinés Fritz Gurlitt. Böcklin pinta al menos cinco versiones. Esta es adquirida en 1920 por la fundación Gottfried Keller y depositada en el Kunstmuseum de Basilea."""
facture = """
La composición es de una gran sencillez: una masa oscura central, los cipreses, entre dos acantilados claros, sobre la horizontal del mar. La luz viene de la izquierda, baja, sin fuente visible, como al crepúsculo o bajo la luna. Böcklin opone los azules fríos del mar y del cielo a los ocres cálidos de la roca, y coloca la única mancha verdaderamente blanca, la figura de pie, en el centro inferior del lienzo, en el lugar exacto donde se posa la mirada. La pincelada permanece lisa y discreta, casi clásica, para que nada venga a turbar la impresión de silencio."""
details = [
  "La figura de pie, envuelta en blanco, a proa de la barca.",
  "El ataúd cubierto con un paño blanco, justo delante de ella.",
  "Las aberturas oscuras excavadas en el acantilado, como tumbas.",
  "Abajo a la izquierda, el monograma «AB» del pintor.",
]
themes = ["muerte", "viaje", "isla", "silencio", "cipreses"]
anecdote = """
El compositor Serguéi Rajmáninov escribió en 1909 su poema sinfónico La isla de los muertos tras ver una reproducción en blanco y negro del cuadro. Se dice que, si hubiera visto el original en color, probablemente no habría escrito su música."""
