[[oeuvres]]
titre = "La Dama de Shalott"
artiste = "John William Waterhouse"
annee = "1888"
image = "dame-de-shalott.jpg"
technique = "Óleo sobre lienzo, 153 × 200 cm"
collection = "Tate Britain, Londres"
note = "Alcanzada por una maldición, la Dama abandona su torre y se deja llevar a la deriva hacia Camelot, donde morirá."
description = """
Una joven vestida con una larga túnica blanca está sentada en una barca, en un río bordeado de juncos y de árboles otoñales. Sus largos cabellos pelirrojos caen sobre los hombros; tiene la boca entreabierta y la mirada perdida a lo lejos. Con la mano izquierda sostiene la cadena que sujetaba la barca a la orilla y que acaba de soltar. Bajo ella, un gran tapiz, rojo, rosa y oro, desborda la barca y arrastra por el agua. A proa, junto a un farol y una figura de proa tallada, se alzan tres cirios. Al fondo, los árboles se abren a un cielo pálido de final de jornada y a una colina lejana."""
evocation = """
El cuadro ilustra el poema de Alfred Tennyson, La Dama de Shalott: encerrada en una torre en una isla, la Dama teje sin fin lo que ve del mundo en un espejo, pues una maldición caerá sobre ella si mira directamente hacia Camelot. Un día, divisa a Lanzarote en el espejo, se vuelve hacia la ventana, y el espejo se rompe. Waterhouse muestra el momento en que, resignada, parte por el río cantando su último canto. Se ha visto en ella la imagen del artista que abandona el mundo de los reflejos por la vida real y muere por ello, y la de la mujer victoriana prisionera de su papel. Los cirios recuerdan que la muerte se acerca."""
histoire = """
Waterhouse, nacido en Roma en 1849 de padres pintores, se dio a conocer primero por sus temas antiguos. Con La Dama de Shalott, expuesta en la Royal Academy en 1888, se vuelve hacia las leyendas artúricas caras a los prerrafaelitas, cuarenta años después de la fundación de su Hermandad, pero con una pincelada más libre, marcada por la pintura francesa al aire libre. El cuadro lo compra Henry Tate, que lo dona a la nación en 1894 con su colección. Es hoy una de las obras más populares de la Tate Britain, en Londres."""
facture = """
Waterhouse asocia el dibujo preciso de la figura, herencia académica, a una factura más amplia en el paisaje, donde se reconoce la influencia de la pintura francesa al aire libre y de Jules Bastien-Lepage. Los juncos del primer plano están trazados con pinceladas vivas, el agua tratada en reflejos oscuros. El vestido blanco, muy iluminado, se destaca sobre la masa parda y verde de los árboles y atrae enseguida la mirada. El tapiz de colores cálidos equilibra la composición, mientras que la barca negra, en diagonal, arrastra la mirada hacia la derecha, en el sentido de la corriente y de la muerte."""
details = [
  "La cadena que la Dama sostiene todavía en la mano izquierda.",
  "En el tapiz, las escenas que ha tejido mirando su espejo.",
  "Los tres cirios y el farol a proa de la barca.",
  "Las hojas de otoño que flotan en el agua, abajo a la derecha.",
  "Los pájaros entre los juncos, a la izquierda.",
]
themes = ["leyenda artúrica", "poesía", "destino", "río", "soledad"]
anecdote = """
Waterhouse volvió dos veces al poema de Tennyson: en 1894 con La Dama de Shalott mirando a Lanzarote, hoy en Leeds, y en 1915 con «Estoy medio cansada de sombras», conservado en Toronto. Tres momentos de la misma historia, con casi treinta años de diferencia."""
