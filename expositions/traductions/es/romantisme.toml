[[oeuvres]]
titre = "El monje junto al mar"
artiste = "Caspar David Friedrich"
annee = "1808–1810"
image = "moine-mer.jpg"
technique = "Óleo sobre lienzo, 110 × 171,5 cm"
collection = "Alte Nationalgalerie, Berlín"
note = "Una diminuta silueta ante un mar negro y un cielo inmenso: el paisaje más radical de su tiempo."
description = """
El lienzo está casi vacío. Abajo, una franja de duna clara, arenosa, ondula de izquierda a derecha. Encima, una delgada franja de mar muy oscuro, casi negro, salpicada de algunas crestas de espuma y de gaviotas blancas. Todo lo demás, más de las tres cuartas partes del cuadro, lo ocupa el cielo: abajo, un manto de bruma gris azulada, pesada, que sube del mar; más arriba, unas nubes blancas iluminadas y luego un azul que se aclara hacia lo alto. Sobre la duna, a la izquierda del centro, se yergue una pequeña figura vestida de oscuro, un monje visto de espaldas, que mira el mar. No hay ni barco, ni árbol, ni orilla lejana."""
evocation = """
Nada guía la mirada: ni primer plano, ni camino, ni objeto con que medir la distancia. El espectador se encuentra, como el monje, ante el vacío. Se ha visto en él al hombre solo ante el infinito, ante Dios o ante la muerte, y a menudo un autorretrato espiritual del pintor. El escritor Heinrich von Kleist describió la impresión de hallarse ante este cuadro como si a uno le hubieran arrancado los párpados. Para muchos historiadores, es una de las primeras obras en que la pintura abandona la composición clásica; mucho más tarde se la ha comparado con las grandes superficies de color de Mark Rothko."""
histoire = """
Friedrich pinta el lienzo entre 1808 y 1810 en Dresde, a partir de recuerdos de la isla de Rügen, en el Báltico, que recorrió en varias ocasiones. Lo expone en la Academia de Berlín en el otoño de 1810, junto con su pareja, La abadía en el robledal. El público queda desconcertado, pero el rey de Prusia Federico Guillermo III compra los dos lienzos, a petición de su hijo, el príncipe heredero, de quince años. Ese mismo año, Friedrich es elegido miembro de la Academia de Berlín. Los dos cuadros han permanecido juntos en las colecciones prusianas, hoy en la Alte Nationalgalerie, donde fueron restaurados de 2013 a 2016."""
facture = """
La composición, toda ella en bandas horizontales, es de una simplicidad inaudita para la época. Friedrich suprimió durante el trabajo lo que habría podido tranquilizar al ojo: el examen científico ha revelado veleros sobre el mar, que luego borró. La pintura se aplica en capas finas y numerosas, alisadas, sin huella de pincel, lo que produce esos pasajes suavísimos del gris al azul. La figura, minúscula, da por sí sola la escala de la inmensidad."""
details = [
  "El monje, minúsculo, única vertical de todo el cuadro.",
  "Las gaviotas, simples puntos blancos sobre el mar.",
  "Las crestas de espuma sobre el mar negro.",
  "Las nubes blancas iluminadas en medio del cielo, única nota luminosa.",
]
themes = ["mar", "soledad", "infinito", "cielo", "meditación"]
anecdote = """
La imagen científica ha mostrado que Friedrich había pintado primero dos veleros sobre el mar. Los cubrió, prefiriendo dejar al monje absolutamente solo ante el horizonte."""
salle = 5
mur = "ouest"
place = 1
largeur = 1.7

[[oeuvres]]
titre = "El Temerario remolcado a su último amarradero"
artiste = "Joseph Mallord William Turner"
annee = "1839"
image = "temeraire.jpg"
technique = "Óleo sobre lienzo, 90,7 × 121,6 cm"
collection = "National Gallery, Londres"
note = "Un navío héroe de Trafalgar, remolcado por un pequeño vapor hacia el desguace, bajo una puesta de sol llameante."
description = """
Sobre el Támesis, a la hora del ocaso, un gran navío de guerra de tres palos, de un blanco fantasmal, se desliza sobre el agua en calma. Lo arrastra un pequeño remolcador de vapor, oscuro y achaparrado, cuya alta chimenea escupe un humo rojizo. A la derecha, el sol se pone en una explosión de rojos, naranjas y amarillos que incendia las nubes y se refleja en el río. Una boya negra flota en primer plano a la derecha. A la izquierda, el cielo es más frío, azulado, y en él se distingue una fina luna creciente. A lo lejos, otros veleros y la orilla baja, apenas visibles. El gran barco y su remolcador se reflejan juntos en el agua inmóvil."""
evocation = """
El cuadro opone dos mundos: el viejo navío de velas, pálido como un espectro, y el remolcador de vapor, negro y activo, que lo conduce a su fin. Se lee en él el final de una época heroica, la de la marina de Nelson, y la llegada de la era industrial. El sol poniente, por un lado, y la luna que sale, por el otro, redoblan esa idea de un día que acaba. Turner no toma partido de manera simple: la máquina es fea, pero potente y viva. La nostalgia, la gloria y la muerte se mezclan en este crepúsculo. Para muchos británicos, es una imagen de la grandeza nacional y de su declive."""
histoire = """
El HMS Temeraire, navío de 98 cañones, se distinguió en la batalla de Trafalgar en 1805, justo detrás del Victory de Nelson. Desarmado, se vende en 1838 y es remolcado desde Sheerness hasta Rotherhithe, en el Támesis, para ser desguazado. Turner extrae de ello este cuadro, expuesto en la Royal Academy en 1839 con un largo título, El Temerario combatiendo, remolcado hasta su último amarradero para ser desguazado. La crítica lo elogia. El pintor se niega a venderlo y lo conserva en su taller; a su muerte, lo lega a la nación junto con cientos de otras obras. Ingresó en la National Gallery como parte del legado Turner."""
facture = """
Turner se tomó libertades con la realidad: el navío había sido despojado de sus palos antes de su último viaje, y él se los devuelve por la belleza de la imagen. El navío está pintado en capas finas y transparentes, casi translúcidas, mientras que el cielo del ocaso está trabajado en pasta espesa, casi en relieve. La composición juega con la oposición de los colores fríos, a la izquierda, y cálidos, a la derecha. La línea de horizonte baja deja al cielo lo esencial del lienzo."""
details = [
  "La fina luna creciente en el cielo azulado, arriba a la izquierda.",
  "La chimenea del remolcador y su humo anaranjado.",
  "La boya negra que flota, en primer plano a la derecha.",
  "La pequeña bandera blanca que ondea sobre el humo.",
  "La pasta espesa del sol poniente, casi en relieve.",
]
themes = ["mar", "crepúsculo", "industria", "nostalgia", "navío"]
anecdote = """
En 2005, una encuesta de la BBC designó este cuadro como el más querido por los británicos. Desde 2020, figura, junto con un autorretrato de Turner, en el billete de veinte libras del Banco de Inglaterra."""
