[exposition]
ordre = 70
nom_court = "Romanticismo"
mouvement = "Romanticismo"
cadre = "baroque"
couleur = "#8e2a2a"
titre = "El Romanticismo, la tempestad y el sueño"
artiste = "Füssli, Blake, Goya, Friedrich, Turner, Constable, Géricault, Delacroix"
dates = "1781–1839"
accroche = "Exposición virtual · Museo del Louvre, París"
introduction = """
Entre finales del siglo XVIII y mediados del XIX, los pintores románticos prefieren la emoción a la regla, y el sueño, la naturaleza salvaje y la actualidad candente a los modelos antiguos. De La pesadilla de Füssli al Temerario de Turner, la visita reúne diez obras de ocho artistas de Inglaterra, España, Alemania y Francia: visiones, guerras, naufragios, revoluciones y paisajes infinitos. El edificio se inspira en las grandes salas rojas del Louvre, Daru y Mollien, altísimas, donde cuelgan los inmensos formatos de la pintura francesa del siglo XIX, y en un gabinete más íntimo reservado al paisaje."""
vitrine = "radeau-meduse.jpg"

[musee]
nom = "Museo del Louvre"
ville = "París, Francia"
construction = "museo inaugurado en 1793"
presentation = """
Fortaleza levantada por Felipe Augusto hacia 1200 y después palacio de los reyes de Francia, ampliado reinado tras reinado, el Louvre se convierte en museo durante la Revolución: el Museo Central de las Artes abre sus puertas el 10 de agosto de 1793 en la Gran Galería. Napoleón III culmina el palacio al hacer construir, por Louis Visconti y luego Hector Lefuel, de 1852 a 1857, las alas del Nuevo Louvre, entre ellas el ala Denon, que lleva el nombre de Vivant Denon, primer director del museo bajo Napoleón I. Se sube por la escalera Daru, en cuya cima se alza la Victoria de Samotracia. En la primera planta, las salas Daru y Mollien, de muros rojos e iluminadas por altos lucernarios, acogen los grandes formatos de la pintura francesa del siglo XIX, desde La coronación de Napoleón de David hasta La balsa de la Medusa de Géricault y La Libertad guiando al pueblo de Delacroix. Desde 1989, se entra en el museo por la pirámide de cristal de Ieoh Ming Pei."""
ici = """
El edificio de ARTEON reproduce la sucesión de salas rojas del ala Denon. Se entra por el sur, en el rellano Daru, y después en «El salón Denon · Visiones y pesadillas», de planta cuadrada y muros rosa viejo. Desde allí se abren, en enfilada, dos grandes salas de doce metros de altura, pintadas del mismo rojo: al oeste «La sala Daru · Goya» y al este «La sala Mollien · La historia en marcha», donde aguardan La balsa de la Medusa y La Libertad. Al norte del salón, el gabinete de los paisajes, pequeño y bajo, de muros claros, reúne a Friedrich, Turner y Constable."""

