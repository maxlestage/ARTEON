[[oeuvres]]
titre = "El carro de heno"
artiste = "John Constable"
annee = "1821"
image = "charrette-foin.jpg"
technique = "Óleo sobre lienzo, 130,2 × 185,4 cm"
collection = "National Gallery, Londres"
note = "Un carro cruza un vado a orillas del Stour, en el Suffolk de su infancia: la campiña inglesa, pintada como nunca antes de él."
description = """
Un carro de madera vacío, tirado por caballos, cruza lentamente el vado de un río poco profundo. Dos hombres lo conducen. A la izquierda, una pequeña casa de ladrillo y madera con tejado rojo, rodeada de árboles, se refleja en el agua; una mujer saca agua en la orilla. En primer plano, sobre el camino, un perrito blanco y negro mira el carro. En el centro, grandes árboles de follaje espeso; a la derecha, una pradera soleada se extiende hasta un linde lejano donde se adivinan segadores en faena. Un pescador se oculta entre los juncos a la derecha. Un gran cielo de verano, surcado de nubes blancas y grises, cubre toda la mitad superior."""
evocation = """
Constable pinta la campiña de su infancia, en torno al molino de su padre, sin héroes ni ruinas antiguas: una escena corriente de trabajo rural, un día de verano. Esta elección, en 1821, es casi un manifiesto: el paisaje más sencillo merece un gran formato, antaño reservado a la historia. Se percibe en él el profundo apego del pintor a esos lugares, que, decía, estaban en el origen de su vocación. En una Inglaterra que se industrializa, el cuadro ha ido adquiriendo valor de símbolo: el de una campiña ideal, apacible e inmutable, convertida en una de las imágenes más populares del país."""
histoire = """
El lugar es real: el Stour, cerca del molino de Flatford, en el Suffolk, que poseía el padre de Constable; la casa de la izquierda era la de un granjero vecino, Willy Lott. El pintor, establecido en Londres, trabaja a partir de los estudios que hizo allí. Realiza primero un boceto al óleo a tamaño natural, hoy en el Victoria and Albert Museum. El cuadro se expone en la Royal Academy en 1821 con el título Paisaje: mediodía, sin encontrar comprador. En 1824, el marchante John Arrowsmith lo compra y lo expone en el Salón de París, donde recibe una medalla de oro del rey Carlos X e impresiona a los jóvenes pintores franceses. Fue donado a la National Gallery en 1886."""
facture = """
Constable observa la naturaleza con una precisión casi científica, en particular las nubes, que estudia sistemáticamente en esa misma época. Su pincelada es fragmentada, viva, con pequeñas manchas de blanco puro puestas sobre las hojas y sobre el agua para expresar los reflejos de la luz, que los críticos llamaban la nieve de Constable. Los verdes, variados, son los de la naturaleza y no los pardos convencionales de los paisajes de taller. Estas audacias impresionarán a Delacroix y después a la escuela de Barbizon."""
details = [
  "El perrito en la orilla, que observa el carro.",
  "La mujer que saca agua delante de la casa de Willy Lott.",
  "El pescador medio oculto entre los juncos, a la derecha.",
  "Los toques de blanco puro sobre las hojas y sobre el agua.",
]
themes = ["campiña", "río", "cielo", "trabajo", "verano"]
anecdote = """
La casa de Willy Lott sigue existiendo, en Flatford, a orillas del Stour. El lugar, propiedad del National Trust, atrae cada año a visitantes que acuden a encontrar el punto de vista del cuadro, casi inalterado dos siglos después."""
