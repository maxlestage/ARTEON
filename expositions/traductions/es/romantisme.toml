[[oeuvres]]
titre = "La pesadilla"
artiste = "Johann Heinrich Füssli"
annee = "1781"
image = "cauchemar.jpg"
technique = "Óleo sobre lienzo, 101,6 × 127 cm"
collection = "Detroit Institute of Arts, Detroit"
note = "Un demonio agazapado sobre una durmiente, una cabeza de caballo de ojos vacíos: el cuadro que hizo estremecerse a Londres en 1782."
description = """
Una joven vestida de blanco yace recostada hacia atrás en una cama, con la cabeza y un brazo colgando en el vacío y los ojos cerrados, como desvanecida. Sobre su pecho está agazapado un pequeño demonio velludo, un íncubo de rostro desencajado, que mira fijamente al espectador. A la izquierda, entre las cortinas de un rojo oscuro de la alcoba, surge una cabeza de caballo de ojos blancos y sin pupilas. En primer plano, una pequeña mesa redonda sostiene un espejo, un frasco y un tarro. Todo lo demás queda sumido en la sombra. La luz cae sobre el cuerpo de la durmiente, sobre la seda de su camisón y sobre los ropajes amarillos y rojos que resbalan de la cama hasta el suelo, y hace resaltar la diagonal de su cuerpo abandonado."""
evocation = """
El cuadro no cuenta ninguna historia tomada de la Biblia o de la mitología: muestra un estado, el mal sueño, y la angustia de la durmiente que no puede despertar. El demonio sentado sobre el pecho recoge una antigua creencia, la de un espíritu que viene a oprimir a los durmientes; la cabeza de caballo juega con la palabra inglesa nightmare, cuya segunda mitad evoca a la yegua. También se ha visto en ella una escena cargada de erotismo, con ese cuerpo ofrecido y ese intruso nocturno. A finales del siglo de las Luces, que quería iluminarlo todo con la razón, Füssli abre la pintura al mundo del sueño, del miedo y del inconsciente, que explorarán los románticos y después los surrealistas."""
histoire = """
Füssli, zuriqués establecido en Londres, expone el lienzo en la Royal Academy en la primavera de 1782. El éxito es inmediato y le da fama. El editor John Raphael Smith manda grabar enseguida una estampa a Thomas Burke, en 1783, que se vende ampliamente y reporta mucho más que el propio cuadro. El pintor realizará varias versiones más, una de ellas, hacia 1790-1791, conservada en la Goethe-Haus de Fráncfort. El tema es parodiado al instante por los caricaturistas políticos ingleses, que sustituyen a la durmiente por los estadistas del momento. En el reverso del lienzo de Detroit se halla un retrato inacabado de una joven, en la que se ha propuesto reconocer a Anna Landolt, sobrina de su amigo Lavater, de quien estaba enamorado. El cuadro ingresó en el Detroit Institute of Arts en 1955."""
facture = """
Füssli compone como en el teatro: un espacio estrecho, cerrado por cortinas, una luz de candilejas que recorta las figuras sobre un fondo casi negro. El cuerpo de la mujer dibuja una larga curva que atraviesa todo el lienzo, en contrapunto con la masa compacta del demonio. El dibujo de los cuerpos, de miembros estirados y poses forzadas, procede de su estudio de Miguel Ángel en Roma, donde pasó ocho años. La pintura, bastante fluida, juega con unos pocos acordes: el blanco nacarado del camisón, el rojo de los cortinajes, el ocre del ropaje."""
details = [
  "Los ojos de la cabeza de caballo, redondos y blancos, sin pupila alguna.",
  "La mirada del demonio, dirigida no a la durmiente sino a nosotros.",
  "El brazo de la joven que cuelga hasta el suelo, con la mano abierta.",
  "Sobre la mesa, el pequeño espejo y los frascos, objetos de tocador corrientes.",
]
themes = ["sueño", "noche", "demonio", "angustia", "fantástico"]
anecdote = """
Se cuenta que Sigmund Freud había colgado un grabado de La pesadilla en su vivienda de Viena, en el número 19 de la Berggasse. El cuadro, que muestra el sueño como un drama interior, se ha relacionado a menudo con La interpretación de los sueños."""
salle = 2
mur = "nord"
place = 1
largeur = 1.27

[[oeuvres]]
titre = "Newton"
artiste = "William Blake"
annee = "1795–hacia 1805"
image = "newton.jpg"
technique = "Impresión en color, tinta y acuarela sobre papel, 46 × 60 cm"
collection = "Tate Britain, Londres"
note = "El sabio, desnudo en el fondo del mar, solo ve la figura que traza con el compás: la razón, para Blake, es una prisión."
description = """
Un joven desnudo, musculoso, de cabello rizado, está sentado sobre una roca cubierta de líquenes y corales, en el fondo de lo que parece un mar oscuro. Inclinado hacia delante, dobla la espalda hasta casi tocarse las rodillas. Con la mano derecha apoya las puntas de un compás sobre un rollo de papel desplegado en el suelo, donde se adivinan un triángulo y un arco de círculo; con la izquierda sostiene el otro extremo del rollo. Un paño blanco cuelga de su hombro. Su perfil, purísimo, está por entero vuelto hacia el dibujo. Detrás de él, la roca forma una masa hormigueante de colores, rojos, ocres y verdes; delante, el fondo azul negruzco está vacío."""
evocation = """
Para Blake, Isaac Newton encarna la razón que mide el mundo y lo encierra en leyes. Su héroe posee la belleza de un atleta griego, pero está encorvado, con los ojos clavados en el papel: no ve ni la prodigiosa roca que tiene detrás ni la inmensidad que lo rodea. El poeta-pintor opone esta visión única, puramente calculadora, a la imaginación, que es la única que da acceso al espíritu. El compás recuerda al del dios creador, Urizen, en sus libros proféticos. A menudo se lee en ella una crítica de la Ilustración y de la ciencia de su tiempo, pero la figura sigue siendo tan bella que también se ha visto en ella una admiración ambivalente por el genio del sabio."""
histoire = """
La imagen pertenece a la serie de las doce Grandes Estampas en color que Blake concibe en 1795, en Lambeth, con temas tomados de la Biblia, de Shakespeare, de Milton y de su propia mitología. Cada tema se tiraba solo en unos pocos ejemplares, retocados uno a uno. Esta prueba fue tirada y retomada más tarde, hacia 1805, de ahí su doble fecha. A menudo se la relaciona con Nabucodonosor, el rey convertido en bestia: dos figuras del hombre disminuido, uno por la razón sola, el otro por la locura. Blake vendía estas hojas a su principal mecenas, Thomas Butts. Durante mucho tiempo reservada a un círculo reducido, la lámina ingresó en la Tate en 1939, donada por el coleccionista W. Graham Robertson, gran defensor del artista."""
facture = """
Blake inventa aquí un procedimiento cercano al monotipo. Primero pinta el motivo con colores espesos sobre un soporte rígido y luego presiona contra él una hoja de papel: al despegarse, el color deja una textura granulosa y veteada, muy visible en la roca. Después retoma cada prueba con tinta y acuarela, precisando los contornos y el modelado del cuerpo. El dibujo, firme y lineal, procede de su formación de grabador y de su admiración por Miguel Ángel."""
details = [
  "La textura veteada de la roca, obtenida al despegar el papel de la pintura.",
  "Las puntas del compás apoyadas sobre el rollo, en la punta de los dedos.",
  "Los dedos de los pies del sabio, que sobresalen sobre el papel.",
  "Bajo la roca, cerca de la pierna, una forma pálida que evoca un animal marino.",
]
themes = ["ciencia", "razón", "imaginación", "desnudo", "visión"]
anecdote = """
Frente a la British Library, en Londres, una gran estatua de bronce de Eduardo Paolozzi, Newton según Blake (1995), retoma la pose de esta estampa: el sabio inclinado, compás en mano, midiendo el suelo."""
salle = 2
mur = "nord"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "El tres de mayo de 1808 en Madrid"
artiste = "Francisco de Goya"
annee = "1814"
image = "tres-de-mayo.jpg"
technique = "Óleo sobre lienzo, 268 × 347 cm"
collection = "Museo del Prado, Madrid"
note = "La noche que sigue al levantamiento de Madrid, unos patriotas son fusilados por los soldados de Napoleón: la primera gran imagen moderna de la guerra."
description = """
La escena transcurre de noche, al pie de una colina desnuda, a las puertas de Madrid, de la que se divisan el campanario y los tejados. A la derecha, una hilera de soldados franceses, vistos de espaldas, con el rostro oculto, apunta sus fusiles. A la izquierda, frente a ellos, un grupo de madrileños espera la muerte. En el centro, un hombre de camisa blanca y pantalón amarillo, de rodillas, abre los brazos en cruz, con los ojos desorbitados. A su alrededor, un fraile reza con las manos juntas y otros se cubren el rostro. En el suelo yacen ya cuerpos ensangrentados; detrás, una fila de condenados sube hacia el lugar de la ejecución. Un gran farol cúbico colocado en el suelo ilumina con violencia a la víctima."""
evocation = """
Goya invierte la pintura de historia: no hay héroe victorioso ni general, sino anónimos frente a una máquina de matar. Los soldados, sin rostro, forman un único bloque mecánico; las víctimas, en cambio, tienen cada una su propio miedo. El hombre de blanco, con los brazos abiertos, recuerda a Cristo en la cruz, y se ha advertido en su mano la marca de una herida que evoca los estigmas. El farol, que debería iluminar, sirve aquí para apuntar. El cuadro, pintado tras la derrota de Napoleón en España, rinde homenaje al pueblo de Madrid, pero dice sobre todo el horror de la guerra, sin gloria ni consuelo. Manet y luego Picasso, con su Masacre en Corea, lo recordarán."""
histoire = """
El 2 de mayo de 1808, los madrileños se alzan contra las tropas francesas que ocupan la ciudad; esa noche y al día siguiente, Murat manda fusilar a numerosos prisioneros, en particular en la montaña del Príncipe Pío. Seis años más tarde, en febrero de 1814, cuando los franceses han abandonado España, Goya propone al gobierno de la Regencia perpetuar con el pincel los episodios heroicos de la insurrección. Pinta dos grandes lienzos, El dos de mayo, la carga de los mamelucos, y este Tres de mayo. El rey Fernando VII, restablecido en el trono, apenas los pone en valor: permanecen mucho tiempo en los depósitos y no figuran en el catálogo del Prado hasta 1872. Durante la guerra civil, son evacuados junto con las colecciones del museo."""
facture = """
La composición opone dos masas: a la derecha, los soldados en diagonal, alineados como una sola arma; a la izquierda, un grupo desordenado de cuerpos y gestos. Entre ellos, un vacío estrecho que los cañones de los fusiles casi franquean. Toda la luz procede del farol, colocado en el suelo, y se concentra sobre la camisa blanca. Goya pinta deprisa, a grandes pinceladas, dejando contornos difusos y rostros apenas esbozados. La gama es sombría, parda y negra, realzada por el blanco, el amarillo y el rojo de la sangre."""
details = [
  "El farol colocado en el suelo, única fuente de luz de la escena.",
  "Las palmas abiertas del hombre de blanco, como las de un crucificado.",
  "El fraile tonsurado que reza, arrodillado a su lado.",
  "Al fondo, el campanario y las casas de Madrid, apagados en la noche.",
  "La sangre que corre por el suelo, en primer plano a la izquierda.",
]
themes = ["guerra", "ejecución", "noche", "pueblo", "historia"]
anecdote = """
De rodillas, el hombre de camisa blanca parece ya tan alto como los soldados en pie: si se levantara, los superaría a todos. Goya agrandó a la víctima, sin duda para que dominara la escena."""
salle = 3
mur = "ouest"
place = 2
largeur = 3.47

[[oeuvres]]
titre = "Saturno devorando a un hijo"
artiste = "Francisco de Goya"
annee = "1820–1823"
image = "saturne.jpg"
technique = "Pintura mural al óleo trasladada a lienzo, 143,5 × 81,4 cm"
collection = "Museo del Prado, Madrid"
note = "Una de las Pinturas negras que Goya pintó solo para sí en los muros de su casa, cerca de Madrid."
description = """
Sobre un fondo enteramente negro surge un gigante de cabello gris desordenado, en cuclillas, con las rodillas flexionadas. Sus ojos están desorbitados, de un blanco espantoso, y su boca, muy abierta, muerde un cuerpo humano. Aprieta entre sus dos puños enormes ese cuerpo desnudo cuya cabeza ya ha desaparecido; la sangre, de un rojo vivo, corre sobre la carne blanca. El cuerpo de la víctima, de caderas y piernas de adulto, cuelga hacia abajo. El resto de la figura del dios, sus hombros, sus muslos, su rodilla lívida abajo a la derecha, se pierde en la oscuridad. No hay ni decorado, ni lugar, ni suelo: solo esta aparición que parece surgir de la noche."""
evocation = """
El mito antiguo cuenta que Saturno, el Crono griego, devoraba a sus hijos para que ninguno le arrebatara el trono. Goya hace de ello una escena de locura y espanto: el dios parece aterrorizado él mismo por su gesto, como si no pudiera detenerse. Siendo Saturno también el dios del tiempo, se ha visto en él el tiempo que todo lo consume; otros leen una imagen de España devorando a sus propios hijos en la guerra y la represión, o del poder absoluto de Fernando VII. Saturno era, en fin, el planeta de la melancolía: pintada por un hombre viejo, sordo y enfermo, la escena se ha relacionado con sus angustias íntimas. Goya no dejó ninguna explicación."""
histoire = """
En 1819, Goya, que tiene más de setenta años y es sordo desde hace tiempo, compra una casa de campo a orillas del Manzanares, cerca de Madrid, conocida como la Quinta del Sordo. Cubre directamente los muros de dos estancias con catorce grandes pinturas al óleo, sin encargo ni público, a las que hoy se llama las Pinturas negras. Saturno se hallaba en la planta baja, en el comedor. Los títulos actuales no son suyos. En 1873, el barón Émile d'Erlanger compra la casa; las pinturas son separadas de los muros y trasladadas a lienzo, mostradas en la Exposición Universal de París en 1878 y donadas al Prado en 1881."""
facture = """
Goya pinta al óleo directamente sobre el enlucido del muro, con una paleta reducida al negro, los ocres, los grises y el blanco, realzada solo por el rojo de la sangre. La pincelada es rápida, ancha, a veces brutal: trabaja sin duda con pincel y quizá con espátula, dejando la materia a la vista. La figura, encuadrada demasiado grande para el espacio, casi toca los bordes y parece querer salirse de ellos. Conocía el Saturno de Rubens, conservado en las colecciones reales, pero le quita toda elegancia."""
details = [
  "Los ojos blancos y redondos, en los que se lee tanto miedo como rabia.",
  "Los dedos del gigante que se hunden en la espalda de la víctima.",
  "El rojo de la sangre, único color vivo de todo el cuadro.",
  "La rodilla clara abajo a la derecha, que surge de la sombra.",
]
themes = ["mitología", "locura", "tiempo", "violencia", "pinturas negras"]
anecdote = """
Una fotografía tomada por Jean Laurent hacia 1874, antes del traslado a lienzo, muestra un estado algo distinto de la pintura: ciertas partes de la figura, hoy perdidas en la sombra, son allí más legibles. El traslado dañó y modificó la obra."""
salle = 3
