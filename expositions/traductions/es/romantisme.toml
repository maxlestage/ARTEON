[[oeuvres]]
titre = "El caminante sobre el mar de nubes"
artiste = "Caspar David Friedrich"
annee = "hacia 1817"
image = "voyageur.jpg"
technique = "Óleo sobre lienzo, 94,8 × 74,8 cm"
collection = "Hamburger Kunsthalle, Hamburgo"
note = "Un hombre visto de espaldas, en la cima de una roca, ante un paisaje ahogado en la bruma: la imagen misma del Romanticismo alemán."
description = """
En el centro del cuadro, un hombre está de pie sobre una punta de roca oscura, de espaldas, de cara al paisaje. Lleva una levita verde oscuro y se apoya en un bastón; el viento le levanta el cabello pelirrojo. Ante él y bajo él se extiende un mar de niebla del que emergen crestas rocosas, cumbres pobladas de pinos y, a lo lejos, una montaña en forma de cono. A la derecha, una alta formación rocosa se recorta contra el horizonte. Más lejos aún, cadenas de montañas azuladas se pierden en un cielo nuboso, claro y lechoso. La silueta del caminante ocupa exactamente el eje vertical del lienzo, y su cabeza se sitúa en el punto donde se cruzan las líneas de las montañas."""
evocation = """
Friedrich coloca al espectador justo detrás del caminante: vemos lo que él ve, sin conocer su rostro ni sus pensamientos. Este personaje de espaldas, su figura predilecta, invita a la contemplación. El paisaje, en parte oculto por las nubes, sugiere el infinito, la grandeza de la naturaleza frente al hombre, lo que los filósofos llamaban lo sublime. Se ha leído en él una meditación sobre la soledad, sobre el lugar del individuo en el mundo, o una experiencia religiosa. El atuendo, una levita a la alemana, ha hecho suponer un homenaje a un combatiente de las guerras de liberación contra Napoleón. El cuadro se ha convertido en el emblema del Romanticismo, hasta el punto de ilustrar innumerables cubiertas de libros."""
histoire = """
Se desconoce la fecha exacta del cuadro; se sitúa hacia 1817, en la época en que Friedrich, establecido en Dresde, es reconocido pero todavía discutido. Las rocas y las cumbres proceden del macizo de arenisca del Elba, la Suiza sajona, que el pintor recorría a pie dibujando. No pintaba del natural: recomponía en el taller, a partir de esos apuntes, un paisaje que no existe tal cual. Olvidado como su autor durante décadas tras su muerte, el cuadro solo se hace célebre en el siglo XX, con el redescubrimiento de Friedrich. La Hamburger Kunsthalle lo adquiere en 1970; es hoy su obra más conocida."""
facture = """
Friedrich construye el cuadro con rigor: la figura se sitúa sobre el eje central, las pendientes de las montañas convergen hacia su cabeza. El contraste es neto entre la roca oscura, nítida y detallada del primer plano, y el lejano claro, difuso, casi inmaterial, que da la impresión de profundidad. La pintura es lisa, sin pincelada visible, aplicada en capas finas. Los tonos fríos, grises, azules, blancos, expresan la humedad del aire y la luz difusa de la niebla."""
details = [
  "El cabello del caminante, levantado por el viento.",
  "El bastón en el que se apoya, apenas visible a la derecha.",
  "Los pequeños pinos sobre las crestas que emergen de la bruma, a la derecha.",
  "La montaña en forma de cono, a la izquierda, casi borrada por la niebla.",
]
themes = ["paisaje", "montaña", "niebla", "soledad", "sublime"]
anecdote = """
El personaje visto de espaldas es tan típico de Friedrich que los historiadores alemanes le han dado un nombre, la Rückenfigur, la figura de espaldas. El pintor la emplea en numerosos cuadros para hacer entrar al espectador en el paisaje."""
