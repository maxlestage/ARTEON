[[artistes]]
nom = "Johann Heinrich Füssli"
vie = "Zúrich, 7 de febrero de 1741 – Putney Hill (Londres), 16 de abril de 1825"
biographie = """
Hijo de un pintor de Zúrich, Johann Heinrich Füssli estudia primero teología y se hace pastor, junto con su amigo Johann Kaspar Lavater. En 1762, ambos denuncian públicamente los abusos de un magistrado de la ciudad; el escándalo los empuja a abandonar Suiza. Tras una estancia en Alemania, Füssli se instala en Londres en 1764, donde vive de traducciones y escritos. Animado por Joshua Reynolds, se vuelca en la pintura y parte para Roma en 1770. Pasa allí ocho años estudiando a Miguel Ángel y la Antigüedad. De regreso en Londres, alcanza la gloria en 1782 con La pesadilla. Bajo el nombre anglicizado de Henry Fuseli, emprende una Galería Milton, inspirada en El paraíso perdido, e ilustra a Shakespeare para la galería del editor Boydell. Elegido miembro de la Royal Academy en 1790, llega a ser en ella profesor de pintura y después director de las escuelas, y forma a toda una generación de artistas. Amigo de la feminista Mary Wollstonecraft y admirado por William Blake, muere a los ochenta y cuatro años y es sepultado en la catedral de San Pablo de Londres."""
style = """
Füssli pinta escenas de sueño, de terror y de visiones tomadas de Shakespeare, de Milton o de las leyendas nórdicas. Sus figuras, de cuerpos alargados y gestos exagerados, proceden de Miguel Ángel y del manierismo; sus composiciones, iluminadas como un escenario de teatro, aíslan a unos pocos actores sobre fondos oscuros. Introduce en la pintura lo fantástico y el inconsciente, y anuncia el Romanticismo, y luego el simbolismo y el surrealismo."""

[[artistes]]
nom = "William Blake"
vie = "Londres, 28 de noviembre de 1757 – Londres, 12 de agosto de 1827"
biographie = """
Hijo de un calcetero de Soho, William Blake afirma haber tenido visiones desde la infancia. A los catorce años, entra como aprendiz con el grabador James Basire, que lo envía a dibujar los sepulcros de la abadía de Westminster; allí descubre el arte gótico. Sigue después los cursos de la Royal Academy y se casa en 1782 con Catherine Boucher, que lo ayudará toda su vida en su trabajo de impresor. Hacia 1788, inventa un procedimiento de grabado en relieve que le permite imprimir juntos sus poemas y sus imágenes, que luego colorea a mano: son los Cantos de inocencia y de experiencia, y después sus libros proféticos, poblados de dioses de su invención. De 1800 a 1803, vive en Felpham, a orillas del mar, junto al poeta William Hayley; allí un soldado lo acusa de sedición y después es absuelto. Su exposición individual de 1809 es un fracaso. Apoyado por unos pocos fieles, Thomas Butts y después el joven pintor John Linnell, ilustra al final de su vida el Libro de Job y la Divina Comedia. Muere pobre, casi olvidado."""
style = """
Blake es a la vez poeta, grabador y pintor. Su dibujo, lineal y firme, heredado del grabado, del arte gótico y de Miguel Ángel, cuenta más que el color, que aplica en acuarela o mediante procedimientos de impresión de su invención. Rechaza la imitación de la naturaleza y pinta sus visiones: cuerpos idealizados, figuras cósmicas, símbolos de una mitología personal. Redescubierto por los prerrafaelitas, fascinó a los simbolistas y a la contracultura del siglo XX."""

[[artistes]]
nom = "Francisco de Goya"
vie = "Fuendetodos (Aragón), 30 de marzo de 1746 – Burdeos, 16 de abril de 1828"
biographie = """
Nacido en un pueblo de Aragón, Francisco de Goya y Lucientes se forma en Zaragoza y viaja a Italia en 1771. Establecido en Madrid, dibuja a partir de 1775 cartones para la Real Fábrica de Tapices, con escenas de fiestas y juegos populares. Miembro de la Academia de San Fernando, retratista muy solicitado, llega a ser pintor de cámara del rey en 1789. En 1792-1793, una grave enfermedad lo deja sordo para siempre. Su arte se vuelve entonces más libre y más sombrío: publica en 1799 los Caprichos, aguafuertes que se burlan de la superstición y de los vicios de la sociedad, y pinta en 1800 La familia de Carlos IV. La invasión napoleónica de 1808 y la guerra que sigue le inspiran los Desastres de la guerra y los dos grandes lienzos del 2 y del 3 de mayo de 1808. Bajo el reinado absolutista de Fernando VII, se retira a su casa cerca del Manzanares, que cubre con las Pinturas negras. En 1824, se exilia a Francia y se establece en Burdeos, donde sigue pintando y experimentando con la litografía hasta su muerte, a los ochenta y dos años."""
style = """
Goya pasa de la gracia rococó de los cartones de tapiz a una pintura cada vez más libre, rápida y expresiva. Heredero de Velázquez, cuyos cuadros graba, pinta a grandes pinceladas, con una economía de medios asombrosa, y se atreve a mostrar la violencia, la locura y la crueldad sin embellecerlas. Pintor de corte y testigo crítico de su tiempo, grabador genial, abre el camino a Delacroix, a Manet y después al expresionismo."""

[[artistes]]
nom = "Théodore Géricault"
vie = "Ruan, 26 de septiembre de 1791 – París, 26 de enero de 1824"
biographie = """
Nacido en Ruan en una familia acomodada, Théodore Géricault crece en París. Apasionado por los caballos, se forma con Carle Vernet, pintor de escenas ecuestres, y después con Pierre-Narcisse Guérin, y copia incansablemente a los maestros en el Louvre. En el Salón de 1812, a los veintiún años, triunfa con un Oficial de cazadores a caballo de la guardia imperial cargando, lienzo de un ímpetu inédito. Dos años más tarde, su Coracero herido abandonando el fuego, pintado en el momento de la caída del Imperio, es peor acogido. En 1816-1817, reside en Italia, donde descubre a Miguel Ángel y prepara una gran Carrera de caballos libres en Roma. De regreso en París, dedica más de un año a La balsa de la Medusa, expuesta en el Salón de 1819. Se lleva el cuadro a Inglaterra, donde descubre la pintura inglesa y pinta el Derby de Epsom. Debilitado por varias caídas de caballo y por la enfermedad, realiza aún una serie de retratos de alienados para un médico, y muere a los treinta y dos años, tras una larga agonía."""
style = """
Géricault da a la actualidad y a la vida moderna la grandeza de la pintura de historia. Su dibujo potente, nutrido de Miguel Ángel y del estudio del cuerpo y de los caballos, se alía con una pintura sombría, contrastada, de pasta densa. Busca la verdad hasta en el sufrimiento, la locura y la muerte, sin idealizar. Su carrera, muy breve, abrió el camino al Romanticismo francés y marcó profundamente a Delacroix y después a Courbet."""

[[artistes]]
nom = "Eugène Delacroix"
vie = "Charenton-Saint-Maurice, 26 de abril de 1798 – París, 13 de agosto de 1863"
biographie = """
Eugène Delacroix crece en una familia de notables del Imperio. Alumno de Pierre-Narcisse Guérin, amigo de Géricault, debuta en el Salón de 1822 con La barca de Dante. Dos años después, Escenas de las matanzas de Quíos, inspirado en la guerra de independencia griega, lo convierte en el jefe de filas de la escuela romántica, frente a los herederos de David y a Ingres. La muerte de Sardanápalo, en 1827, causa escándalo por su violencia y su sensualidad. En 1830, celebra la revolución de Julio con La Libertad guiando al pueblo. En 1832, acompaña a una misión diplomática a Marruecos: los colores, la luz y los trajes del norte de África nutrirán toda su obra. Recibe después grandes encargos de decoración, en el Palais-Bourbon, en el Senado, en el techo de la galería de Apolo del Louvre y en la capilla de los Santos Ángeles de la iglesia de Saint-Sulpice. Elegido miembro de la Academia de Bellas Artes en 1857, tras varios fracasos, lleva un célebre Diario. Muere en su vivienda de la rue de Furstenberg, convertida en el museo nacional Eugène-Delacroix."""
style = """
Para Delacroix, el color prima sobre el dibujo. Admirador de Rubens y de los venecianos, construye sus cuadros mediante contrastes de tonos complementarios, pinceladas vivas y visibles, composiciones en movimiento. Toma sus temas de la historia, la literatura, la actualidad y Oriente. Su libertad de pincelada y su reflexión sobre el color abrieron el camino a los impresionistas y a los neoimpresionistas, que lo consideraban un precursor."""

[[artistes]]
nom = "Caspar David Friedrich"
vie = "Greifswald, 5 de septiembre de 1774 – Dresde, 7 de mayo de 1840"
biographie = """
Nacido en Greifswald, pequeño puerto del Báltico entonces sueco, Caspar David Friedrich es hijo de un fabricante de velas y de jabón. Su infancia está marcada por los duelos: su madre muere cuando él tiene siete años, y en 1787 su hermano Christoffer se ahoga al intentar socorrerlo tras una caída bajo el hielo. Estudia en la Academia de Copenhague de 1794 a 1798 y después se establece en Dresde, donde vivirá toda su vida. Recorre a pie la isla de Rügen, las montañas del Harz y la Suiza sajona, llenando sus cuadernos de dibujos. En 1808, su Retablo de Tetschen, una cruz en la montaña concebida como cuadro de altar, desata una viva polémica. En 1810, Prusia compra El monje junto al mar y La abadía en el robledal, y es elegido miembro de la Academia de Berlín. Se casa con Caroline Bommer en 1818. Profesor en la Academia de Dresde, va perdiendo poco a poco el favor del público; un ataque cerebral, en 1835, le impide casi pintar. Olvidado a su muerte, es redescubierto a principios del siglo XX."""
style = """
Friedrich pinta paisajes meditativos, cargados de sentido espiritual: brumas, mares, ruinas, montañas, claros de luna, a menudo contemplados por figuras vistas de espaldas. Sus composiciones, simétricas y despojadas, oponen un primer plano preciso a lejanías infinitas. Su pintura lisa, de transiciones suavísimas, expresa la luz del alba y del crepúsculo. Hizo del paisaje una experiencia interior, y su radicalidad fue saludada por los simbolistas y después por los pintores abstractos."""

[[artistes]]
nom = "Joseph Mallord William Turner"
vie = "Londres, 23 de abril de 1775 – Londres, 19 de diciembre de 1851"
biographie = """
Hijo de un barbero de Covent Garden, Joseph Mallord William Turner ingresa a los catorce años en las escuelas de la Royal Academy. Acuarelista precoz, expone desde 1790 y recorre Inglaterra y el País de Gales para dibujar paisajes y monumentos, que difunden los grabadores. Elegido académico en 1802, a los veintiséis años, se mide en sus lienzos con Claudio de Lorena y los grandes paisajistas, y llega a ser profesor de perspectiva. Gran viajero, descubre los Alpes en 1802, Italia en 1819 y después Venecia, cuya luz transforma su pintura. Sus lienzos se vuelven cada vez más libres, hechos de luz, vapor y tempestades, y desconciertan a una parte de la crítica, mientras que el joven John Ruskin sale en su defensa en Pintores modernos, en 1843. Rico y reservado, vive retirado al final de su vida en Chelsea, bajo un nombre falso. Lega a la nación lo esencial de su obra, varios cientos de pinturas y millares de dibujos y acuarelas, repartidos hoy entre la Tate y la National Gallery. Es enterrado en la catedral de San Pablo."""
style = """
Turner parte de un paisaje clásico, al modo de Claudio de Lorena, para ir hacia una pintura de la luz y de los elementos. Sus lienzos, donde la forma se disuelve en el sol, la bruma, la nieve o el vapor, mezclan veladuras transparentes y empastes. La acuarela, practicada toda su vida, le enseña la fluidez y los efectos de luz. Admirado por los impresionistas, se le tiene a menudo por un precursor de la abstracción."""

[[artistes]]
nom = "John Constable"
vie = "East Bergholt (Suffolk), 11 de junio de 1776 – Londres, 31 de marzo de 1837"
biographie = """
Hijo de un rico molinero y comerciante de grano del Suffolk, John Constable crece en el valle del Stour, entre los molinos de Flatford y de Dedham. Destinado al comercio familiar, consigue en 1799 marcharse a estudiar en las escuelas de la Royal Academy, en Londres. Los comienzos son lentos: rechaza el paisaje idealizado de moda y pinta lo que conoce, la campiña de su infancia, a menudo al aire libre. En 1816, tras siete años de noviazgo contrariado por la familia de la joven, se casa con Maria Bicknell. A partir de 1819, expone cada año en la Royal Academy grandes paisajes de casi dos metros, sus seis pies, entre ellos El carro de heno. El Salón de París de 1824 le vale una medalla de oro y la admiración de los pintores franceses, mientras que en Inglaterra el reconocimiento tarda. Establecido en Hampstead, estudia allí incansablemente las nubes. La muerte de Maria, en 1828, lo abruma. Elegido académico solo en 1829, publica con el grabador David Lucas mezzotintas de sus paisajes y muere de repente en Londres."""
style = """
Constable quiere pintar la naturaleza tal como la ve, con la frescura de un estudio del natural. Sus bocetos al óleo, rápidos y libres, y sus estudios de cielo, anotados con la hora y el viento, se cuentan entre los más modernos de su tiempo. En sus grandes cuadros, conserva esa viveza mediante pinceladas quebradas y destellos de blanco. Marcó a Delacroix, a la escuela de Barbizon y, a través de ellos, al impresionismo."""
