[[oeuvres]]
titre = "La balsa de la Medusa"
artiste = "Théodore Géricault"
annee = "1818–1819"
image = "radeau-meduse.jpg"
technique = "Óleo sobre lienzo, 491 × 716 cm"
collection = "Museo del Louvre, París"
note = "Trece días a la deriva tras el naufragio de una fragata francesa: el suceso convertido en cuadro de historia, que causó escándalo en el Salón de 1819."
description = """
Sobre una balsa improvisada, sacudida por un mar encrespado, una veintena de hombres se amontonan, muertos, moribundos o supervivientes. En primer plano, unos cadáveres resbalan hacia el agua; a la izquierda, un anciano envuelto en un paño rojo sostiene sobre las rodillas el cuerpo de un joven y mira al vacío. Detrás, una vela hinchada y un mástil sujeto con cuerdas. Los cuerpos se elevan hacia la derecha en una pirámide de brazos tendidos, hasta un hombre negro subido a un barril, que agita un paño hacia el horizonte. Allá a lo lejos, diminuta, se distingue la silueta de un navío. El cielo está cargado de nubes sombrías, desgarradas por un resplandor amarillo, y una enorme ola se alza a la izquierda."""
evocation = """
Géricault convierte un suceso reciente en una epopeya trágica, a la escala de la pintura de historia. El cuadro dice la desesperación y la esperanza entremezcladas: de la muerte, abajo, a la petición de auxilio, arriba, todo el lienzo se tensa hacia ese navío casi invisible. En el momento elegido, los náufragos aún no saben si los verán. Para el público de 1819, la obra era también una acusación: el naufragio se atribuía a un comandante nombrado por favor político bajo la Restauración. Al colocar a un hombre negro en la cima de la pirámide, cuando se debatía la abolición de la trata, Géricault adoptó una posición que a menudo se ha subrayado. La balsa se ha convertido en una imagen de la humanidad abandonada a sí misma."""
histoire = """
En julio de 1816, la fragata Medusa, que lleva colonos a Senegal, encalla frente a Mauritania. Por falta de botes, unas ciento cincuenta personas son abandonadas en una balsa; recogidos trece días después por el bergantín Argus, solo sobreviven una quincena. El relato de dos supervivientes, el cirujano Savigny y el ingeniero Corréard, publicado en 1817, revela las matanzas y el canibalismo. Géricault los conoce, hace construir una maqueta de la balsa y estudia miembros amputados y moribundos en el hospital Beaujon. Expuesto en el Salón de 1819 con el título Escena de naufragio, el cuadro divide a la crítica. Se muestra después en Londres en 1820, con gran éxito. Tras la muerte del pintor, en 1824, ingresa en el Louvre."""
facture = """
La composición descansa sobre dos pirámides: la de la vela y el mástil, a la izquierda, y la de los cuerpos, que culmina con el hombre del paño, a la derecha. Las diagonales cruzadas dan el movimiento del oleaje. Géricault modela los cuerpos como esculturas, con una luz dura procedente de la izquierda, en el espíritu de Miguel Ángel y de Caravaggio. La paleta es sombría, hecha de pardos, ocres y verdes. Empleó betún, un pigmento que con el tiempo se ennegrece y se agrieta: el cuadro se ha oscurecido mucho."""
details = [
  "En el horizonte, a la derecha, la diminuta silueta del bergantín Argus.",
  "El anciano del manto rojo que vela el cuerpo de un joven.",
  "El hombre negro en lo alto, agitando un paño rojo y blanco.",
  "Los cuerpos de los muertos, abajo, que ya resbalan hacia el agua.",
  "La enorme ola que se alza a la izquierda, detrás de la vela.",
]
themes = ["naufragio", "muerte", "esperanza", "actualidad", "mar"]
anecdote = """
El joven Eugène Delacroix, amigo de Géricault, posó para uno de los náufragos: tradicionalmente se le reconoce en el cuerpo tendido boca abajo sobre la balsa, en primer plano, con el brazo extendido. Quedó conmocionado por el cuadro inacabado."""
salle = 4
mur = "est"
place = 2
largeur = 4.5

[[oeuvres]]
titre = "La Libertad guiando al pueblo"
artiste = "Eugène Delacroix"
annee = "1830"
image = "liberte.jpg"
technique = "Óleo sobre lienzo, 260 × 325 cm"
collection = "Museo del Louvre, París"
note = "El 28 de julio de 1830, sobre una barricada parisina: una alegoría de carne y hueso guía a los insurgentes contra Carlos X."
description = """
Una mujer con gorro frigio y el pecho desnudo escala una barricada de adoquines y vigas, blandiendo con una mano la bandera tricolor y con la otra un fusil con bayoneta. Se vuelve hacia quienes la siguen. A la izquierda, un hombre con levita y sombrero de copa empuña una escopeta de caza; a su lado, un obrero armado con un sable. A la derecha, un chiquillo tocado con una boina blande dos pistolas mientras grita. Al pie de la barricada, un herido se incorpora hacia ella; en primer plano yacen cadáveres, un insurgente medio desnudo y soldados de uniforme. Al fondo, entre el humo, se divisan las torres de Notre-Dame."""
evocation = """
Delacroix mezcla la alegoría y el reportaje. La Libertad no es una estatua antigua sino una mujer del pueblo, vigorosa, descalza, que marcha al combate; a su alrededor, los insurgentes de todas las condiciones, burgueses, obreros, un niño, figuran la unión del pueblo durante las Tres Gloriosas. La bandera tricolor, prohibida bajo la Restauración, recupera su lugar en lo alto de la composición. Los muertos del primer plano recuerdan el precio de la victoria. El cuadro se ha convertido en la imagen misma de la República y de la revuelta: en el chiquillo de las pistolas se ha visto un modelo para el Gavroche de Los miserables, y la figura de la Libertad ha inspirado innumerables carteles."""
histoire = """
Los días 27, 28 y 29 de julio de 1830, París se subleva contra las ordenanzas de Carlos X, que tiene que abdicar. Delacroix, que no ha combatido, empieza el lienzo en otoño; escribe a su hermano que, a falta de haber vencido por la patria, pintará para ella. El cuadro se expone en el Salón de 1831 y es adquirido por el Estado bajo Luis Felipe. Pero la imagen, juzgada demasiado revolucionaria, es retirada pronto de los muros del museo y devuelta al artista. Reaparece en la Exposición Universal de 1855 e ingresa en el Louvre en 1874. Una restauración concluida en 2024 eliminó los barnices amarilleados que lo oscurecían y devolvió a los colores su brillo original."""
facture = """
La composición es una pirámide, cuya base está formada por los cuerpos tendidos y cuya cima es la bandera. La Libertad parece salir del cuadro y marchar hacia el espectador. Delacroix concentra la luz sobre la Libertad y sobre la bandera, cuyo azul, blanco y rojo se repiten, a modo de ecos, en las ropas del herido y de varias figuras. La pincelada es viva y visible, el humo está pintado con amplias brochadas. Recuerda La balsa de la Medusa de Géricault, su mayor, en la composición y en los cuerpos del primer plano."""
details = [
  "La firma y la fecha, Eug. Delacroix 1830, en rojo sobre una viga a la derecha.",
  "Las torres de Notre-Dame entre el humo, a la derecha de la Libertad.",
  "El herido de blusa azul, faja roja y camisa blanca, con los colores de la bandera.",
  "El chiquillo de las dos pistolas, que grita mientras avanza.",
  "El soldado muerto a la derecha, de uniforme, con el chacó caído a su lado.",
]
themes = ["revolución", "libertad", "alegoría", "París", "bandera"]
anecdote = """
A partir de 1979, el billete de cien francos reprodujo La Libertad guiando al pueblo, junto con el retrato de Delacroix: durante casi veinte años, los franceses llevaron el cuadro en el bolsillo."""
salle = 4
mur = "nord"
