[[oeuvres]]
titre = "En Bretaña"
artiste = "Robert Demachy"
annee = "1904"
image = "en-bretagne.jpg"
licence = "Domaine public"
source = "https://www.rijksmuseum.nl/nl/collectie/object/RP-F-2005-107-229--f163ce745e2e020104f624607e8dc96e"
technique = "Heliograbado a partir de una fotografía, firmado a mano; imagen 12,9 × 19,8 cm, hoja 20,1 × 29,4 cm"
collection = "Rijksmuseum, Ámsterdam"
note = "Una mujer con una gran toca blanca, sentada en las rocas frente a un pueblo costero: una fotografía que parece un dibujo."
description = """
En primer plano, sobre unas rocas oscuras, está sentada una mujer, vista de espaldas en tres cuartos. Inclina la cabeza; una amplia toca blanca, bordeada de encaje y cruzada por una cinta oscura, le oculta el rostro, y un ancho cuello blanco le cubre los hombros. Su mano descansa sobre las rodillas. Ante ella se extiende una ensenada de agua pálida, casi lisa. Al otro lado, una hilera de casas blancas de tejados oscuros bordea la orilla, dominada por una chimenea de fábrica. El cielo no es uniforme: está surcado de grandes trazos oblicuos, como pinceladas o trazos de lápiz. Las rocas de la parte inferior, granulosas, parecen frotadas con carboncillo. Un filete oscuro enmarca la imagen, y al pie de la hoja Demachy ha firmado con su nombre."""
evocation = """
La imagen está construida como un cuadro de género: una figura solitaria, una toca que dice Bretaña, un paisaje que la prolonga. Pero nada se cuenta en ella. La mujer da la espalda al pueblo y parece perdida en una ensoñación que no se compartirá. Los pintores de Pont-Aven habían hecho de Bretaña una tierra de tradiciones y melancolía; Demachy retoma el motivo, con los medios de la fotografía. Los trazos del cielo muestran sobre todo su programa: probar que el fotógrafo, como el grabador, interviene en su imagen y deja en ella su mano. Para los pictorialistas, es esta intervención, y no la exactitud, lo que hace de la fotografía un arte."""
histoire = """
Demachy es, hacia 1900, la figura principal del pictorialismo francés. En 1894 participa en la fundación del Photo-Club de París, cuyos salones anuales muestran la fotografía como se muestra la pintura. Es también miembro del Linked Ring de Londres y de la Photo-Secession de Nueva York, donde Stieglitz publica sus imágenes en Camera Work. Sus pruebas, reveladas a la goma bicromatada, son únicas; para difundirlas, las hace reproducir en heliograbado, un grabado impreso con tinta que conserva sus matices. Esta prueba, fechada en 1904 y firmada a mano, fue adquirida por el Rijksmuseum de Ámsterdam con la ayuda de varios fondos de mecenazgo, para su colección de fotografías antiguas."""
facture = """
Demachy popularizó el positivado a la goma bicromatada, que presenta en 1897 con el inglés Alfred Maskell bajo el nombre de «foto-aguatinta». El papel se cubre con una mezcla de goma arábiga, pigmento y bicromato de potasio, que se endurece con la luz bajo el negativo. En el revelado, con agua, la goma que ha quedado blanda se va: con un pincel o un chorro de agua, el fotógrafo puede entonces aclarar una zona, borrar un detalle, suavizar un contorno. Las estrías del cielo y el grano de las rocas proceden de este trabajo. El heliograbado reproduce fielmente estos efectos, hasta las huellas del pincel, en un tono marrón grisáceo próximo al del original."""
details = [
  "La toca blanca bordeada de encaje, cruzada por una cinta oscura.",
  "La mano apoyada en las rodillas, iluminada en la sombra del cuello.",
  "La chimenea de fábrica que sobresale de los tejados del pueblo.",
  "Los trazos oblicuos que surcan el cielo como pinceladas.",
  "La firma «Demachy», bajo la imagen, a la derecha.",
]
themes = ["Bretaña", "pictorialismo", "goma bicromatada", "ensoñación", "orilla"]
anecdote = """
Demachy anotaba sus fracasos: al dorso de una de sus copias conservada en Cleveland escribió en inglés que la capa era demasiado gruesa, el bicromato insuficiente y el revelado de las claras demasiado forzado. En 1914 abandona bruscamente la fotografía y no vuelve a ella."""
salle = 1
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "El emparrado (Julia Hall McCune)"
artiste = "Clarence H. White"
annee = "1906"
image = "la-tonnelle.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1980.159"
technique = "Copia al platino, 23,8 × 19,3 cm"
collection = "Cleveland Museum of Art"
note = "Una joven bajo una parra, con el rostro medio en sombra: el retrato íntimo, a media voz, del pictorialismo estadounidense."
description = """
Una joven de cabello corto y oscuro está de pie bajo un emparrado. Vuelve la cabeza hacia la derecha y mira a lo lejos, con los labios cerrados; una sombra corta su rostro, del que solo la mitad izquierda recibe la luz. Lleva un cuello blanco cerrado por un pequeño broche, una prenda oscura y una banda de tela que le cruza el busto en diagonal. Sus manos, en la parte inferior de la imagen, sostienen un racimo que se adivina de uvas. Arriba a la izquierda cuelgan anchas hojas de parra, en silueta oscura; a la derecha, un poste de madera. Tras ella, el fondo es claro y borroso, como un cielo velado. Toda la imagen se baña en tonos marrones y grises muy suaves, sin negro profundo ni blanco puro."""
evocation = """
White fotografía sobre todo a sus allegados, en su casa o en la naturaleza, al alba o al crepúsculo. Aquí, el decorado es casi nada, una parra y un cielo pálido, y todo reposa en la mirada desviada de la modelo. El Cleveland Museum of Art ve en ella a una joven perdida en sus pensamientos, y la luz suave que baña una parte de su rostro acentúa este humor meditativo. El racimo y las hojas de parra evocan el otoño, la estación de los frutos maduros, y quizá el paso del tiempo. Se piensa en los pintores estadounidenses de la misma época, como Thomas Dewing, que pintan mujeres soñadoras en interiores o jardines silenciosos. La fotografía ya no es en ella un documento: es un estado de ánimo."""
histoire = """
Julia Hall McCune, amiga de la familia White y alumna suya, es una de sus modelos preferidas. La fotografía en 1906, el año en que deja Newark, en Ohio, donde era contable en una casa de comercio, para instalarse en Nueva York. Miembro fundador de la Photo-Secession en 1902, White expone entonces en todos los grandes salones de Europa y América. Se convierte después en un profesor influyente, en la Universidad de Columbia y luego en su propia escuela. La copia perteneció a la propia modelo, convertida en Julia McCune Flory, antes de ingresar en el Cleveland Museum of Art en 1980; el museo conserva otras pruebas de White de la misma procedencia."""
facture = """
White, autodidacta, positiva sus negativos sobre papel al platino, que aprecia por la riqueza de sus medios tonos. En este procedimiento, la emulsión sensible es absorbida por las fibras del papel: la imagen se forma en el propio papel, con un aspecto mate, sin brillo, y una gama de grises muy amplia. El enfoque es voluntariamente suave, sin nitidez agresiva, y el contraluz envuelve la silueta. La composición está cuidadosamente regulada: la diagonal de la tela, la vertical del poste, las hojas arriba a la izquierda que responden al racimo abajo. Después de 1906, White se volverá también hacia el papel al paladio, de efectos parecidos."""
details = [
  "La sombra que parte el rostro en dos.",
  "El pequeño broche que cierra el cuello blanco.",
  "Las hojas de parra, en silueta, arriba a la izquierda.",
  "El racimo sostenido con las dos manos, en la parte inferior de la imagen.",
  "El poste del emparrado, oscuro, en el borde derecho.",
]
themes = ["retrato", "pictorialismo", "platino", "ensoñación", "otoño"]
anecdote = """
La escuela de fotografía que White abre en Nueva York en 1914 forma a alumnos que se harán célebres, como Dorothea Lange o Margaret Bourke-White. White muere en 1925 en México, adonde había llevado a sus estudiantes a fotografiar."""
salle = 1
mur = "est"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Brigitta"
artiste = "Frank Eugene"
annee = "hacia 1906"
image = "brigitta.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/66703"
technique = "Copia al platino, 12,2 × 16,7 cm"
collection = "Art Institute of Chicago (Alfred Stieglitz Collection)"
note = "Una niña con vestido de seda, apoyada en una mesa cubierta de brocado: un retrato infantil compuesto como un cuadro antiguo."
description = """
Una niña de cabello oscuro, recogido con un lazo, está apoyada en una mesa, de perfil, con la cabeza vuelta hacia nosotros. Lleva un vestido de seda claro, muy amplio, de mangas abullonadas, cuya parte delantera está bordada con flores; la falda se extiende por el suelo como una corola. La mesa está cubierta con una tela de grandes motivos de follaje y flores. Encima, un pequeño ramo y algunos objetos redondos, frutas o bolas, brillan en la penumbra; la niña sostiene entre las manos un objeto claro. A la derecha, una imagen a la japonesa, con iris y un pájaro, cuelga del muro oscuro. El fondo se pierde en marrones profundos, de los que el vestido emerge en plena luz."""
evocation = """
El gran vestido rígido, la mesa de tapete precioso, la niña seria que nos observa: se piensa en los retratos de infantas de Velázquez, tan admirados por los pintores de finales del siglo XIX. Pero la mirada de Brigitta es la de una niña real, algo intimidada por la pose. Eugene, pintor de formación, compone la imagen con la libertad de un cuadro, asociando telas, flores y una estampa japonesa, como los esteticistas de su tiempo. La fotografía toma aquí prestado a la pintura su vocabulario, el decorado, la luz dorada, la pose, para probar que también ella puede producir una obra de arte y no un simple recuerdo de familia."""
histoire = """
Nacido en Nueva York de padres alemanes, Frank Eugene estudia pintura en la academia de bellas artes de Múnich y se da a conocer después en Nueva York por sus fotografías. En 1902 es uno de los miembros fundadores de la Photo-Secession. Hacia 1906 abandona Estados Unidos por Alemania, donde pasará el resto de su vida. Una inscripción al dorso de esta copia da el nombre de la modelo, «Brigitta Wenz». La prueba formaba parte de la colección personal de Alfred Stieglitz; tras la muerte de este, en 1946, Georgia O'Keeffe repartió su colección entre varios museos estadounidenses, y el Art Institute of Chicago recibió en 1949 un importante conjunto de fotografías, entre ellas esta."""
facture = """
Eugene positiva sobre papel al platino, de negros aterciopelados y transiciones suaves. Es conocido sobre todo por una práctica que escandalizaba a los puristas: no dudaba en grabar sus negativos con una aguja, en rayarlos o rasparlos, para oscurecer un fondo, suavizar un contorno o borrar un detalle molesto. Aquí, la intervención sigue siendo discreta: la luz se concentra en el vestido y el rostro, mientras que el fondo y los bordes se hunden en la sombra. El formato apaisado, raro en un retrato, deja todo su lugar al decorado: la mesa a la izquierda, la falda en el centro, la estampa a la derecha forman un friso, a la manera de una pintura decorativa."""
details = [
  "El lazo en el cabello de la niña.",
  "Las flores bordadas en la parte delantera del vestido.",
  "La tela de grandes follajes que cubre la mesa.",
  "El pequeño ramo y los objetos redondos colocados sobre la mesa.",
  "La imagen de los iris y el pájaro, colgada a la derecha.",
]
themes = ["infancia", "retrato", "Photo-Secession", "japonismo", "platino"]
anecdote = """
En 1913, Frank Eugene es nombrado profesor de fotografía artística en la academia de artes gráficas de Leipzig, donde enseñaba desde 1907: se considera que es la primera cátedra de este tipo en el mundo."""
salle = 1
mur = "sud"
place = 4
largeur = 1.3

[[oeuvres]]
titre = "Bendita entre todas las mujeres"
artiste = "Gertrude Käsebier"
annee = "1899"
image = "benie-entre-toutes-les-femmes.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/103529"
technique = "Heliograbado, publicado en 1901 en el portafolio American Pictorial Photography, serie II (ejemplar 34/150); 23,7 × 14,1 cm"
collection = "Art Institute of Chicago"
note = "Una madre vestida de blanco empuja suavemente a su hija hacia el umbral: la imagen más célebre de Gertrude Käsebier."
description = """
La imagen, alta y estrecha, está encuadrada por las jambas de una puerta. En el vano, una niña está de pie, de frente, con los brazos a lo largo del cuerpo. Lleva un vestido oscuro ceñido por un cinturón de hebilla, puños y cuello blancos, un gran lazo bajo la barbilla; su cabello está cortado a la altura de la nuca, y mira directamente hacia nosotros, con gravedad. Tras ella, una mujer vestida con un largo vestido blanco y amplio se inclina hacia ella y le pone la mano en el hombro; de ella solo se ve un perfil perdido. Al fondo, en el muro, una imagen enmarcada deja adivinar figuras con ropajes. El suelo de tablas, en primer plano, conduce al umbral."""
evocation = """
El título retoma las palabras del Ave María, «Bendita tú eres entre todas las mujeres», y confiere a una escena doméstica la dignidad de un cuadro religioso: la madre de blanco, inclinada, recuerda a una Virgen o a un ángel de la Anunciación. Pero la imagen habla también del momento en que el niño deja la protección materna para franquear el umbral y entrar en el mundo. El contraste es asombroso entre la madre, toda de blanco y de dulzura, y la niña, oscura, erguida, ya algo rígida ante lo que la espera. Käsebier, madre ella misma, hizo de la maternidad el gran tema de su obra, sin cursilería, con esa mezcla de ternura y gravedad."""
histoire = """
Käsebier realiza la imagen en 1899, poco después de abrir su estudio de retratista en Nueva York. Se identifica a sus modelos con Agnes Lee y su hija Peggy. Stieglitz advierte pronto su trabajo: en 1902 es miembro fundadora de la Photo-Secession, y el primer número de Camera Work, en enero de 1903, está en gran parte dedicado a sus fotografías. Este heliograbado procede del portafolio American Pictorial Photography, publicado en Nueva York en 1901, en el entorno del Camera Club, cuya revista Camera Notes dirigía entonces Stieglitz. Tirado en ciento cincuenta ejemplares, difundía las obras de los pictorialistas estadounidenses."""
facture = """
Käsebier estudió primero pintura, y se nota en la construcción de la imagen: las jambas de la puerta forman un marco dentro del marco, la imagen colgada al fondo responde a los personajes, y el gran blanco del vestido materno equilibra el negro del vestidito. La luz, venida de atrás, aureola a la madre y deja a la niña en un modelado suave. El enfoque, sin dureza, funde los contornos. El heliograbado, procedimiento de grabado en hueco impreso con tinta, permitía reproducir estos matices con gran fidelidad: para los pictorialistas, era una manera de pleno derecho de publicar una fotografía, y no una simple copia."""
details = [
  "Las jambas de la puerta, que enmarcan la escena.",
  "El gran lazo bajo la barbilla de la niña.",
  "La hebilla clara de su cinturón.",
  "La mano de la madre apoyada en el hombro de la niña.",
  "La imagen enmarcada en el muro del fondo, de figuras con ropajes.",
]
themes = ["maternidad", "umbral", "infancia", "Photo-Secession", "sagrado"]
anecdote = """
En 1899, otra imagen de madre e hijo de Käsebier, El pesebre (The Manger), se vende por cien dólares: era entonces el precio más alto jamás pagado por una fotografía."""
salle = 2
mur = "nord"
place = 1
largeur = 0.9

[[oeuvres]]
titre = "La mano del hombre"
artiste = "Alfred Stieglitz"
annee = "1902"
image = "la-main-de-l-homme.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/66749"
technique = "Heliograbado, 24,2 × 31,8 cm"
collection = "Art Institute of Chicago (Alfred Stieglitz Collection)"
note = "Una locomotora escupe su humo negro en medio de un haz de raíles relucientes: la ciudad industrial se convierte en tema de arte."
description = """
En el centro de la imagen, una locomotora avanza hacia nosotros, escupiendo un enorme penacho de humo negro que sube recto en un cielo gris y nuboso. A su alrededor, decenas de raíles se cruzan, se separan y se curvan; mojados, brillan como hilos de plata en la luz baja. A la izquierda se alzan postes telegráficos y sus cables, a la derecha grandes edificios oscuros, almacenes o depósitos, y a lo lejos chimeneas de fábrica anegadas en la bruma. No se ve ningún ser humano. Los tonos van del negro profundo del humo a los grises plateados de los raíles, en un tono marrón verdoso de tinta de imprenta. Un fino filete claro enmarca la imagen."""
evocation = """
El título es irónico y grave a la vez: la «mano del hombre» no es un artesano, es el paisaje entero modelado por la industria, raíles, cables y humos. Sin embargo, Stieglitz no denuncia nada. Una nota de Camera Work presentaba la imagen como un intento de tratar como artista un tema tan presente en la vida cotidiana que se olvida que puede ser bello. La locomotora solitaria, el penacho, el centelleo de los raíles hacen de la estación de clasificación un paisaje romántico, comparable a las marinas o los bosques de los pictorialistas. En el cambio de siglo, la imagen anuncia el gran asunto de la fotografía moderna: encontrar el arte en la ciudad, la máquina y el mundo ordinario."""
histoire = """
Stieglitz toma la fotografía en 1902, desde la parte trasera de un tren en marcha; se sitúa la escena en las vías férreas de Long Island City, frente a Manhattan. Ese mismo año funda en Nueva York la Photo-Secession, un grupo de fotógrafos que quieren hacer reconocer su arte. En enero de 1903, la imagen aparece en el primer número de Camera Work, la lujosa revista que dirigirá hasta 1917. Este heliograbado pertenecía al propio Stieglitz; Georgia O'Keeffe, su viuda, lo donó en 1949 al Art Institute of Chicago junto con gran parte de su colección. Fue mostrado en 2000 en el Grand Palais, en París, en la exposición «1900»."""
facture = """
Para captar la escena desde el tren, Stieglitz utiliza una cámara sostenida a mano, más ligera que la cámara de gran formato sobre trípode. La luz rasante, tomada a contraluz, hace brillar los raíles y recorta el humo sobre el cielo. La composición se basa en la perspectiva de las vías, que convergen hacia la locomotora, y en la oposición entre la masa negra del humo y la red fina de los raíles. El heliograbado, grabado en hueco impreso con tinta, era para Stieglitz un medio de expresión de pleno derecho: vigilaba de cerca su impresión, y las láminas de Camera Work se consideraban obras originales."""
details = [
  "El penacho de humo negro, en el centro, que sube hasta lo alto de la imagen.",
  "Los raíles mojados que brillan en primer plano.",
  "Los postes telegráficos y sus cables, a la izquierda.",
  "Los grandes edificios oscuros, a la derecha.",
  "Las chimeneas de fábrica perdidas en la bruma, a lo lejos.",
]
themes = ["ferrocarril", "industria", "Nueva York", "humo", "modernidad"]
anecdote = """
En Camera Work, los heliograbados no se imprimían en la página: cada uno se tiraba aparte, sobre un papel muy fino, y luego se pegaba a mano en la revista, número tras número."""
