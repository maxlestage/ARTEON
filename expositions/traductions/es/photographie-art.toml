[[oeuvres]]
titre = "Equisetum hyemale, cola de caballo de invierno (lámina 1 de Formas originarias del arte)"
artiste = "Karl Blossfeldt"
annee = "1928"
image = "equisetum-hyemale.jpg"
licence = "Domaine public"
source = "https://www.rijksmuseum.nl/nl/collectie/object/RP-F-2008-51-2170-1--ee765997f7a974327839ab7914b9aa30"
technique = "Huecograbado rotativo, lámina 1 del libro Urformen der Kunst (Berlín, Ernst Wasmuth, 1928); hoja 31,2 × 24,2 cm"
collection = "Rijksmuseum, Ámsterdam"
note = "Un brote joven de cola de caballo, ampliado veinticinco veces, erguido como una columna acanalada o una torre."
description = """
Sobre un fondo gris liso, una forma vertical ocupa toda la altura de la imagen. Parece una columna o una torre: un fuste estriado de finas acanaladuras paralelas, dividido en pisos por anillos dentados, que se afina hacia arriba en una cúpula redondeada. En la cima, una pequeña punta deshilachada se recorta sobre el cielo gris. Cada piso sobresale ligeramente sobre el de abajo, como los tambores de una columna o los tejados de una pagoda. La luz viene de lado y modela el relieve: las acanaladuras alternan huecos oscuros y aristas claras. Se trata en realidad de un brote joven de cola de caballo de invierno, una planta de lugares húmedos, fotografiada de muy cerca y ampliada veinticinco veces."""
evocation = """
Blossfeldt era profesor de modelado a partir de plantas vivas en una escuela de artes aplicadas de Berlín. Para él, la naturaleza es la primera de los arquitectos: inventó antes que el hombre la columna, la acanaladura, el capitel, la voluta. El título del libro, Formas originarias del arte, expresa esta convicción. Colocada a la cabeza de la obra, la cola de caballo sirve de demostración: vista a esta escala, una hierba banal se convierte en monumento. La imagen fascina también por su ambigüedad, entre precisión científica y extrañeza. En 1928, el filósofo Walter Benjamin saluda este libro, que revela, según él, un mundo de formas que el ojo desnudo no sospechaba."""
histoire = """
Blossfeldt fotografía las plantas desde la década de 1890, primero para sus clases, a fin de mostrar a sus alumnos la estructura de los tallos, los brotes y las hojas. Durante más de treinta años acumula miles de negativos, sin pensar en exponerlos. El galerista berlinés Karl Nierendorf los descubre, los expone en 1926 y publica después, en 1928, en la editorial Ernst Wasmuth, Urformen der Kunst, un libro de ciento veinte láminas que prologa. El éxito es inmediato, y la obra se traduce pronto. Esta lámina, la primera del libro, procede de una edición en hojas adquirida por el Rijksmuseum de Ámsterdam con la ayuda de varios fondos de mecenazgo."""
facture = """
Blossfeldt construye él mismo sus aparatos, capaces de ampliar las plantas hasta treinta veces. Prepara cada espécimen con cuidado, corta las hojas que estorban, lo fija en un soporte y lo coloca ante un fondo neutro, gris o blanco. La luz, lateral e igual, no proyecta ninguna sombra y hace resaltar el relieve. El encuadre frontal y simétrico aísla la forma como un objeto de museo. Estos principios, nitidez total, frontalidad, ausencia de decorado, coinciden con los de la Nueva Objetividad alemana de los años veinte. El huecograbado rotativo, procedimiento de impresión en hueco de calidad, rinde la finura del grano del tallo."""
details = [
  "Las finas acanaladuras paralelas que estrían el tallo.",
  "Los anillos dentados que separan los pisos.",
  "La punta deshilachada, en la cima.",
  "La luz lateral que hace resaltar las aristas.",
  "El fondo gris liso, sin ningún decorado.",
]
themes = ["planta", "botánica", "arquitectura", "Nueva Objetividad", "ampliación"]
anecdote = """
Blossfeldt nunca reivindicó el título de fotógrafo artístico: sus imágenes eran para él herramientas de enseñanza. Es a más de sesenta años cuando se hace célebre, cuatro años antes de su muerte, con este primer libro."""
salle = 4
