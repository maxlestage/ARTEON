[exposition]
ordre = 116
nom_court = "La fotografía, un arte"
mouvement = "Pictorialismo, Photo-Secession y fotografía documental"
cadre = "blanc"
couleur = "#4a4640"
titre = "La fotografía se convierte en arte, 1880–1930"
artiste = "Demachy, White, Eugene, Käsebier, Stieglitz, Hine, Johnston, Blossfeldt, Atget…"
dates = "1899–1928"
accroche = "Exposición virtual · Maison européenne de la photographie, París"
introduction = """
Hacia 1890, cualquiera puede hacer una fotografía: la cámara Kodak y las placas ya preparadas han puesto el procedimiento al alcance de todos. Para distinguirse, apasionados aficionados de París, Londres, Viena o Nueva York quieren hacer de la fotografía un arte de pleno derecho, igual a la pintura y al grabado: es el pictorialismo. En Nueva York, Alfred Stieglitz articula esta lucha en torno a la Photo-Secession y a su revista Camera Work. Al mismo tiempo, otros hacen de la cámara un instrumento de verdad, para denunciar el trabajo infantil o mostrar las formas ocultas de las plantas, mientras que el autocromo de los hermanos Lumière aporta por fin el color. La visita sigue este camino en diez imágenes, de 1899 a 1928. El edificio se inspira en la Maison européenne de la photographie, instalada en un palacete del Marais, en París."""
vitrine = "la-main-de-l-homme.jpg"

[musee]
nom = "Maison européenne de la photographie (MEP)"
ville = "París, Francia"
architecte = "Yves Lion (restauración y ala contemporánea)"
construction = "Principios del siglo XVIII (el hôtel Hénault de Cantobre); museo inaugurado en 1996"
presentation = """
La Maison européenne de la photographie ocupa, en la rue de Fourcy, en el barrio del Marais, el hôtel Hénault de Cantobre, un palacete de principios del siglo XVIII. El Ayuntamiento de París lo hizo restaurar y ampliar para instalar en él un lugar dedicado a la fotografía: el arquitecto Yves Lion conservó la mansión antigua y le añadió un ala contemporánea, sobria y luminosa. El museo abre sus puertas en 1996, bajo la dirección de Jean-Luc Monterosso, que ya había puesto en marcha en París el Mois de la Photo. Reúne hoy una colección de más de veinte mil copias, sobre todo de fotografía contemporánea desde los años cincuenta, una biblioteca especializada y un auditorio. Cada temporada, varias exposiciones presentan tanto a los grandes nombres del siglo como a jóvenes fotógrafos."""
ici = """
El edificio de ARTEON toma de la MEP su doble rostro, una mansión antigua prolongada por un ala moderna. Se entra por el sur en «Los salones del palacete», de muros marfil, donde el pictorialismo de Demachy, White y Eugene imita el grabado y la pintura. Al norte se abre «La galería de la Secesión», gris y de siete metros de altura, donde Käsebier y Stieglitz representan Nueva York. Al oeste, «El mundo del trabajo» reúne a Hine y a Frances Benjamin Johnston; al este, «La naturaleza y la ciencia» acerca a Blossfeldt y a Atget. Al norte, por último, en el ala moderna, un pequeño gabinete de muros oscuros, «El color», alberga un autocromo de Stieglitz."""

