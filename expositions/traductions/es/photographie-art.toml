[[oeuvres]]
titre = "Nenúfar"
artiste = "Eugène Atget"
annee = "1922–1923"
image = "nymphea.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/2002.69"
technique = "Copia sobre papel a la albúmina, virada al oro, 22,2 × 17,6 cm"
collection = "Cleveland Museum of Art"
note = "Un estanque cubierto de nenúfares, entre sombra y reflejos: Atget, al final de su vida, en la cumbre de su arte."
description = """
Un estanque ocupa casi toda la imagen. En primer plano, grandes hojas redondas de nenúfar flotan sobre el agua oscura, hendidas hasta el centro, algunas vueltas hacia arriba en los bordes; entre ellas se abren flores claras de pétalos puntiagudos. Más lejos, otros islotes de hojas y flores dibujan manchas claras sobre el agua, cada vez más pequeñas. A la derecha, el agua refleja el cielo y se vuelve casi blanca. Al fondo, una orilla de césped, matas de iris y macizos de árboles oscuros cierran el horizonte, bajo un rincón de cielo pálido. Entre las hojas, una pequeña etiqueta blanca de jardín botánico se yergue sobre un tallo. Toda la prueba tiene un tono marrón violáceo."""
evocation = """
Monet pinta en ese mismo momento sus Nenúfares en Giverny; Atget, por su parte, fotografía un estanque de parque, sin buscar imitar la pintura. Su vista tiene, sin embargo, algo de meditativo: la mirada se desliza de las grandes hojas del primer plano hacia el fondo, en una profundidad tranquila, puntuada de flores blancas. El Cleveland Museum of Art subraya cómo la luz de la mañana, con sus sombras y reflejos, permite a Atget aislar formas planas, casi abstractas, conservando a la vez un espacio profundo. La etiqueta botánica, minúscula, recuerda que el fotógrafo documenta siempre lo real, incluso cuando la imagen tiende a la ensoñación."""
histoire = """
Tras treinta años fotografiando las calles, las tiendas y las viejas mansiones de París, Atget dedica sus últimos años a los parques: Versalles, Saint-Cloud, Sceaux. Este estanque fue sin duda fotografiado en el parque de Bagatelle, en el límite del Bois de Boulogne, célebre por sus colecciones de plantas. Atget vendía sus copias a artistas, bibliotecas y museos de París. Poco conocido en vida, es revelado tras su muerte, en 1927, por la estadounidense Berenice Abbott, que salva buena parte de su fondo. Esta prueba pasó por un marchante de Nueva York antes de ser adquirida por el Cleveland Museum of Art en 2002."""
facture = """
Atget trabaja con una pesada cámara de madera sobre trípode y placas de vidrio de 18 × 24 cm. Positiva sus pruebas por contacto, sobre papel a la albúmina, un papel a base de clara de huevo ya pasado de moda en los años veinte, y las vira al oro, lo que les da esos tonos púrpuras y marrones. El enfoque, nítido sobre las hojas flotantes, detalla sus nervaduras y desgarros. El punto de vista, bastante alto, hace bascular el plano del agua hacia nosotros y convierte el estanque en una superficie casi vertical, como una alfombra. Las pequeñas muescas negras de los bordes proceden sin duda de las pinzas que sujetaban la placa en su chasis."""
details = [
  "Las grandes hojas hendidas del primer plano, de bordes vueltos hacia arriba.",
  "Las flores de nenúfar, de pétalos puntiagudos, en el centro.",
  "La pequeña etiqueta blanca erguida entre las hojas, a la izquierda.",
  "El reflejo del cielo que blanquea el agua, a la derecha.",
  "Los macizos de árboles oscuros que cierran el fondo.",
]
themes = ["jardín", "agua", "nenúfares", "reflejo", "París"]
anecdote = """
En la puerta de su estudio, en la rue Campagne-Première, Atget había inscrito «Documentos para artistas»: se veía como un proveedor de imágenes para pintores y decoradores, más que como un artista."""
