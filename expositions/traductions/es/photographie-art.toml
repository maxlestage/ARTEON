[[oeuvres]]
titre = "Sadie Pfeifer, hilandera de las hilaturas de Lancaster"
artiste = "Lewis Hine"
annee = "1908"
image = "sadie-pfeifer.jpg"
licence = "Domaine public"
source = "https://www.loc.gov/pictures/item/2018674894/"
technique = "Copia fotográfica de época de la colección del National Child Labor Committee, de esquinas cortadas"
collection = "Library of Congress, Washington (colección del National Child Labor Committee)"
note = "Una niña de 1,22 metros ante un telar de hilar que parece no acabar nunca: la fotografía como arma contra el trabajo infantil."
description = """
Un largo pasillo se adentra en una sala de fábrica. A la izquierda, un telar de hilar se extiende hasta el fondo de la imagen: hileras de bobinas blancas, hilos, rodillos metálicos. A la derecha, un muro de ladrillo está perforado por altas ventanas de cortinas recogidas, por las que entra una luz lechosa. En medio del pasillo, una niña con vestido largo y delantal, de cabello claro cayéndole sobre los hombros, tiende las dos manos hacia el telar. Lleva botines, y un bolsillo de su delantal está abultado. Al fondo, otra niña está de pie, muy pequeña. De la techumbre cuelgan bombillas desnudas. Las esquinas de la copia están cortadas en bisel."""
evocation = """
La imagen es sencilla e implacable: la máquina, inmensa y repetitiva, ocupa toda la mitad izquierda; la niña, minúscula, se aferra a ella como una pieza más. Hine no muestra lágrimas ni miseria espectacular. Deja que la perspectiva haga el trabajo: el telar que se pierde de vista dice la longitud de las jornadas, la monotonía del gesto y lo absurdo de confiar a una niña una tarea de adulto. El pie de foto completa la demostración, con la estatura de Sadie, ciento veintidós centímetros, y la duración de su empleo, ya seis meses. Hine llamaba a esto fotografía de interpretación: una imagen exacta, pero compuesta para conmover y convencer."""
histoire = """
Hine toma esta fotografía el 30 de noviembre de 1908 en las Lancaster Cotton Mills, en Carolina del Sur. Sociólogo de formación, trabaja entonces para el National Child Labor Committee, una asociación que lucha por la prohibición del trabajo infantil. Durante unos diez años recorre Estados Unidos, de las hilaturas a las minas y las conserveras, y trae miles de imágenes publicadas en folletos, revistas y exposiciones. Pesaron en la votación de las leyes federales que acabaron por regular el trabajo infantil. Los archivos del comité, negativos y copias con pie de foto, ingresaron en la Library of Congress, que los ha digitalizado."""
facture = """
Hine trabaja con una cámara de gran formato sobre trípode y una iluminación de magnesio cuando falta la luz. Aquí, la luz de las ventanas basta: se desliza a lo largo del pasillo y recorta la silueta de la niña. El punto de fuga, casi en el centro, ahonda el espacio; la niña está colocada a un tercio de la imagen, en el encuentro de la máquina y la luz. Hine anotaba con cuidado el nombre, la edad, la estatura y el lugar de cada niño: sus pies de foto, copiados en fichas, forman parte de la obra. Esta prueba de época, de esquinas cortadas, pertenece a los álbumes del comité, donde las imágenes se clasificaban por industria."""
details = [
  "Las hileras de bobinas blancas del telar de hilar, a la izquierda.",
  "Las manos de la niña, tendidas hacia los hilos.",
  "El bolsillo abultado de su delantal.",
  "La otra niña, muy pequeña, al fondo del pasillo.",
  "Las bombillas desnudas que cuelgan del techo.",
]
themes = ["trabajo infantil", "fábrica", "infancia", "documental", "reforma social"]
anecdote = """
Para entrar en las fábricas, Hine se hacía pasar, según los casos, por inspector, vendedor o fotógrafo venido a retratar las máquinas. Medía la estatura de los niños con ayuda de los botones de su chaqueta, cuya altura conocía."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Una clase de costura, Hampton Institute"
artiste = "Frances Benjamin Johnston"
annee = "1899"
image = "cours-de-couture.jpg"
licence = "Domaine public"
source = "https://www.loc.gov/pictures/item/98502966/"
technique = "Copia fotográfica de época, montada sobre cartón"
collection = "Library of Congress, Washington (colección Frances Benjamin Johnston)"
note = "Ocho mujeres aprenden a cortar, probar y coser un vestido: un aula fotografiada como un cuadro viviente."
description = """
En una gran sala clara, ocho mujeres se afanan. A la izquierda, una está sentada ante una máquina de coser de pedal, junto a una ventana de cortinas de encaje y dos maniquíes vestidos. Otra, arrodillada, ajusta el dobladillo de la larga falda de una joven que está de pie, inmóvil; una tercera se sitúa ante un gran espejo de tres cuerpos. Al fondo, una alumna traza un patrón en la pizarra, cubierta de medidas, «Neck 12½, Bust 36, Waist 22», y de esquemas de piezas de vestido. A la derecha, tres mujeres con delantal trabajan alrededor de una mesa; una lleva una cofia blanca. Una alfombra de motivos cubre el suelo, y una bombilla desnuda cuelga del techo."""
evocation = """
La imagen no muestra trabajadoras agotadas, sino alumnas que aprenden un oficio, con orden, seriedad y dignidad. Es lo que quería mostrar la escuela, y lo que Johnston traduce con una composición muy regulada, donde cada gesto, medir, trazar, prender con alfileres, coser, tiene su lugar, como en un friso. En 1899, lo que está en juego es considerable: en una América donde la segregación se endurece, estas imágenes afirman la capacidad y la respetabilidad de los afroamericanos. Hoy se las mira también con ojo crítico, pues la escuela preparaba sobre todo a sus alumnos para empleos manuales. La fotografía sigue siendo un testimonio raro sobre su rostro y su presencia."""
histoire = """
El Hampton Institute, en Virginia, fue fundado en 1868 para formar a antiguos esclavos y a sus hijos; acoge también a alumnos amerindios a partir de 1878. En 1899, la escuela encarga a Frances Benjamin Johnston, fotógrafa establecida en Washington, una serie de imágenes de sus clases y talleres. Ella trae un vasto conjunto de vistas, una parte de las cuales se muestra en la Exposición Universal de París de 1900, en la sección dedicada a los afroamericanos. Las copias y negativos de Johnston ingresaron en la Library of Congress con su fondo. Un álbum de estas imágenes, hallado más tarde, fue publicado en 1966 por el Museum of Modern Art de Nueva York."""
facture = """
Johnston trabaja con una gran cámara sobre trípode y placas de vidrio, que dan una nitidez perfecta de un borde a otro. Dispone a sus modelos con cuidado: las poses se mantienen, los gestos quedan suspendidos, y nadie mira al objetivo. La luz, venida de las ventanas de la izquierda, es suave e igual, sin sombras duras, y permite leer hasta las cifras escritas en la pizarra. El punto de vista, ligeramente elevado, abarca toda la sala y da a cada grupo su lugar. La copia, de grises matizados y blancos cremosos, está montada sobre un cartón claro cuyo borde aún se ve."""
details = [
  "La máquina de coser de pedal, a la izquierda, y su pie de fundición calada.",
  "La alumna arrodillada que prende con alfileres el dobladillo de una falda.",
  "Las medidas escritas con tiza en la pizarra: «Neck 12½, Bust 36, Waist 22».",
  "El gran espejo de tres cuerpos, en el centro izquierda.",
  "La cofia blanca de la mujer que trabaja a la derecha de la mesa.",
]
themes = ["escuela", "costura", "afroamericanos", "documental", "aprendizaje"]
anecdote = """
Johnston había estudiado pintura en la Académie Julian, en París. Se cuenta que su primera cámara fotográfica se la regaló George Eastman, el fundador de Kodak, amigo de su familia."""
salle = 3
mur = "nord"
place = 2
