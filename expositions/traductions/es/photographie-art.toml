[[oeuvres]]
titre = "Kitty Stieglitz"
artiste = "Alfred Stieglitz"
annee = "hacia 1907"
image = "kitty-stieglitz.jpg"
cadre = "noir"
licence = "CC0"
source = "https://www.artic.edu/artworks/77269"
technique = "Autocromo (placa de vidrio positiva en color), 17,9 × 12,7 cm (vista)"
collection = "Art Institute of Chicago (Alfred Stieglitz Collection)"
note = "La hija del fotógrafo, con manzanas rojas en el regazo: el color entra en la fotografía, gracias a los hermanos Lumière."
description = """
Una niña de unos diez años está sentada en un sillón de madera de brazos torneados. Sus largos cabellos castaños caen sobre los hombros, sujetos por un gran lazo oscuro en lo alto de la cabeza. Lleva un vestido de finas rayas, adornado con galones trenzados, con cuello alto y mangas blancos. En su regazo se amontonan una docena de manzanas rojas, que sujeta con la mano derecha; con el otro brazo sostiene una rama de hortensia de flores blancas y hojas verdes. Un anillo brilla en su dedo. Nos mira, seria, casi enfurruñada. El fondo, indistinto, pasa del gris azulado al malva. Algunos puntos claros, motas de polvo, salpican la placa."""
evocation = """
Tras casi setenta años de fotografía en blanco y negro, he aquí de pronto un retrato fotográfico en color: el rojo de las manzanas, el verde de las hojas, la tez de la niña. El efecto debió de ser asombroso para Stieglitz, que fotografía aquí a su hija Kitty, nacida en 1898. Las manzanas y las flores, dispuestas como en un bodegón, muestran que busca los colores por sí mismos, como un pintor. Sin embargo, la luz suave y el grano de la placa dan a la imagen la ternura difusa de un pastel. Se siente también en ella la intimidad de un álbum de familia: la pose algo forzada de la niña, el sillón, el vestido de todos los días."""
histoire = """
Los hermanos Auguste y Louis Lumière, en Lyon, patentan el autocromo en 1903 y lo ponen a la venta en 1907. El verano de ese año, Stieglitz, que se encuentra en Europa, descubre el procedimiento en París, donde Edward Steichen también lo ensaya, y lo experimenta después en Baviera con sus amigos Frank Eugene y Heinrich Kühn. De regreso en Nueva York, saluda el procedimiento con entusiasmo en Camera Work y muestra autocromos en su galería de la Quinta Avenida. Esta placa pertenecía a su colección personal, repartida tras su muerte entre varios museos estadounidenses: el Art Institute of Chicago la recibe en 1949 con un conjunto de autocromos de Stieglitz."""
facture = """
El autocromo es una placa de vidrio cubierta de millones de granos de fécula de patata teñidos de naranja, verde y violeta, que sirven de filtros de color. Los intersticios se tapan con negro de carbón, y por encima se extiende una emulsión sensible. Tras la exposición, hecha a través del vidrio, un revelado inverso da una imagen positiva única, que se mira por transparencia, ante una luz o en un visor. Las poses son largas, varios segundos como mínimo, de ahí la inmovilidad de la modelo. Visto de cerca, el autocromo se resuelve en un polvo de puntos de color, que da a los colores su suavidad característica."""
details = [
  "El gran lazo oscuro en el cabello.",
  "Las manzanas rojas amontonadas sobre el vestido de rayas.",
  "La rama de hortensia blanca, a la izquierda.",
  "El anillo en el dedo de la mano derecha.",
  "Los brazos torneados del sillón de madera.",
]
themes = ["color", "autocromo", "infancia", "familia", "bodegón"]
anecdote = """
Un autocromo no puede positivarse en papel: cada placa es única. Para mostrar estas imágenes al público, Stieglitz y sus amigos debían exponerlas iluminadas por detrás, o hacerlas reproducir en color por la imprenta, con grandes dificultades."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[artistes]]
nom = "Robert Demachy"
vie = "Saint-Germain-en-Laye, 1859 – Hennequeville (Trouville), 1936"
biographie = """
Hijo de un banquero, Robert Demachy dispone de una fortuna que le permite dedicarse a sus pasiones: la música, los automóviles, la literatura, el arte y, desde la década de 1870, la fotografía. En 1894 participa en la fundación del Photo-Club de París, que organiza cada año un salón de fotografía artística. Miembro del Linked Ring de Londres y luego de la Photo-Secession de Nueva York, expone por toda Europa y en Estados Unidos. Es también un teórico infatigable: publica cinco libros y más de mil artículos para defender la fotografía como arte. En 1914 deja bruscamente de fotografiar y se dedica al dibujo hasta su muerte."""
style = """
Demachy es el maestro de los procedimientos llamados pigmentarios, que permiten intervenir a mano sobre la copia: la goma bicromatada y luego el positivado al óleo. Borra, aclara y suaviza con el pincel, hasta el punto de que sus imágenes parecen sanguinas, carboncillos o aguatintas. Sus temas, bailarinas, desnudos, retratos, paisajes de Bretaña y Normandía, están tratados en un espíritu próximo a la pintura de su tiempo."""

[[artistes]]
nom = "Clarence H. White"
vie = "Carlisle, Ohio, 1871 – México, 1925"
biographie = """
Clarence Hudson White crece en Ohio, en Newark, donde es contable. Empieza a fotografiar como aficionado en 1893 y, sin ninguna formación, se impone en pocos años: advertido por Stieglitz en Filadelfia en 1898, expone en el salón del Linked Ring en Londres desde 1899, y luego en todas las grandes exposiciones internacionales. Miembro fundador de la Photo-Secession en 1902, se instala en Nueva York en 1906 y se convierte en un docente muy solicitado, en la Universidad de Columbia y en Brooklyn. En 1914 funda su propia escuela de fotografía, que forma a una generación de fotógrafos. Muere en 1925 en México, durante un viaje con sus alumnos."""
style = """
White fotografía sobre todo a su familia y a sus amigos, en interiores apacibles, junto a una ventana, o al aire libre al alba y al crepúsculo. Sus imágenes, positivadas al platino o al paladio, son de una gran suavidad de tonos, construidas con rigor, a menudo a contraluz. Expresan una poesía de la vida cotidiana, calmada y meditativa, que marca todo el pictorialismo estadounidense."""

[[artistes]]
nom = "Frank Eugene"
vie = "Nueva York, 1865 – Múnich, 1936"
biographie = """
Frank Eugene Smith, hijo de inmigrantes alemanes, nace en Nueva York y parte a estudiar pintura en la academia de bellas artes de Múnich en la década de 1880. De regreso en Estados Unidos, lleva a la par la pintura y la fotografía, y sus retratos atraen la atención de Stieglitz. Miembro fundador de la Photo-Secession en 1902, se instala en Alemania hacia 1906. Enseña fotografía en Leipzig a partir de 1907 y es nombrado profesor en 1913. Pasa sus últimos años en Múnich, donde muere en 1936."""
style = """
Eugene es el más pintor de los fotógrafos de la Secesión. No se contenta con difuminar sus imágenes: graba y raya sus negativos con la aguja, para obtener fondos vibrantes como grabados. Sus retratos y sus escenas alegóricas, positivados al platino, mezclan trajes, telas y decorados antiguos en el espíritu del Art Nouveau y del simbolismo."""

[[artistes]]
nom = "Gertrude Käsebier"
vie = "Des Moines, Iowa, 1852 – Nueva York, 1934"
biographie = """
Nacida Gertrude Stanton, pasa parte de su infancia en Colorado, se casa en 1874 con un hombre de negocios, Eduard Käsebier, y cría a tres hijos en Brooklyn. Cerca de los cuarenta años, ingresa en el Pratt Institute para estudiar pintura y se vuelve después hacia la fotografía. Hacia 1897 abre en Nueva York un estudio de retratista que goza de gran éxito. Stieglitz la apoya: es miembro fundadora de la Photo-Secession en 1902, y el primer número de Camera Work le está ampliamente dedicado. Se aleja de Stieglitz hacia 1912 y funda en 1916, con Clarence White, la asociación Pictorial Photographers of America."""
style = """
Käsebier rechaza los fondos pintados y los accesorios de los estudios de su tiempo: coloca a sus modelos en una luz natural y sencilla. Sus retratos de artistas, como Rodin, y sus imágenes de madres e hijos, de gran ternura, están compuestos con sentido de la pintura y positivados al platino o a la goma, en tonos suaves."""

[[artistes]]
nom = "Alfred Stieglitz"
vie = "Hoboken, Nueva Jersey, 1864 – Nueva York, 1946"
biographie = """
Hijo de inmigrantes alemanes, Alfred Stieglitz cursa estudios de ingeniería en Berlín, donde descubre la fotografía en la década de 1880. De regreso en Nueva York en 1890, se convierte en el gran defensor de la fotografía como arte: dirige la revista Camera Notes, funda en 1902 la Photo-Secession y publica luego, de 1903 a 1917, Camera Work. En 1905 abre con Edward Steichen una galería en el número 291 de la Quinta Avenida, donde muestra también los primeros Matisse y Picasso expuestos en América. Se casa en 1924 con la pintora Georgia O'Keeffe, de la que hace centenares de retratos. Muere en Nueva York en 1946."""
style = """
Pictorialista al principio, Stieglitz busca en las calles de Nueva York, la nieve, la lluvia y las máquinas temas para una fotografía moderna. Evoluciona hacia una fotografía directa, nítida y sin manipulación, como en El entrepuente en 1907, y luego hacia las series de nubes que llama «Equivalentes». Fue también uno de los primeros en entusiasmarse con el autocromo."""

[[artistes]]
nom = "Lewis Hine"
vie = "Oshkosh, Wisconsin, 1874 – Dobbs Ferry, Nueva York, 1940"
biographie = """
Tras una juventud de obrero, Lewis Wickes Hine estudia sociología y se hace profesor en la Ethical Culture School de Nueva York, donde se inicia en la fotografía para sus clases. Hacia 1905 empieza a fotografiar a los inmigrantes que desembarcan en Ellis Island. De 1908 a 1918 aproximadamente trabaja para el National Child Labor Committee y recorre todo el país para mostrar a los niños en el trabajo. Después de la Primera Guerra Mundial, fotografía para la Cruz Roja en Europa y realiza luego sus «retratos de trabajo», que culminan con la construcción del Empire State Building en 1930–1931. Muere en la pobreza en 1940."""
style = """
Hine se decía fotógrafo de interpretación: sus imágenes son exactas, pero compuestas para conmover. Mira a los trabajadores, niños o adultos, de frente, a su altura, con respeto, y acompaña cada fotografía de un pie preciso. Su obra funda la fotografía documental y social estadounidense."""

[[artistes]]
nom = "Frances Benjamin Johnston"
vie = "Grafton, Virginia Occidental, 1864 – Nueva Orleans, 1952"
biographie = """
Frances Benjamin Johnston estudia dibujo y pintura en la Académie Julian, en París, de 1883 a 1885, y se convierte después en ilustradora y periodista en Washington. Se vuelve hacia la fotografía y abre su estudio a principios de la década de 1890. Fotografía a los mineros, las obreras, las escuelas y a los sucesivos presidentes en la Casa Blanca. En 1900 organiza en París una exposición dedicada a las mujeres fotógrafas estadounidenses. Más tarde se especializa en arquitectura y dedica los años treinta a un vasto inventario fotográfico de las casas antiguas del Sur de Estados Unidos. Muere en 1952 en Nueva Orleans."""
style = """
Johnston es una de las primeras mujeres fotógrafas profesionales de Estados Unidos y una de las primeras reporteras. Sus imágenes, nítidas y minuciosamente compuestas, disponen a los personajes como en cuadros vivientes. Conjugan la preocupación por el documento y una gran elegancia formal."""

[[artistes]]
nom = "Karl Blossfeldt"
vie = "Schielo, Harz, 1865 – Berlín, 1932"
biographie = """
Nacido en un pueblo del Harz, Karl Blossfeldt aprende el oficio de modelador en una fundición artística y estudia después en la escuela de artes decorativas de Berlín. De 1890 a 1896 trabaja en Italia, Grecia y el norte de África con el profesor Moritz Meurer, que hace realizar modelos de plantas para la enseñanza del ornamento. A partir de 1898 enseña él mismo en Berlín el modelado a partir de plantas vivas, hasta 1930. Sus fotografías, hechas para sus clases, son reveladas en 1926 por el galerista Karl Nierendorf, y el libro Urformen der Kunst lo hace célebre en 1928. Muere en Berlín en diciembre de 1932."""
style = """
Blossfeldt fotografía tallos, brotes, hojas y semillas, aislados sobre un fondo neutro y muy ampliados, con una nitidez perfecta. Sus imágenes revelan en las plantas formas de arquitectura y de ornamento: columnas, báculos, rosetones. Su rigor las acerca a la Nueva Objetividad alemana, y los surrealistas vieron en ellas formas extrañas y fascinantes."""

[[artistes]]
nom = "Eugène Atget"
vie = "Libourne, 1857 – París, 1927"
biographie = """
Huérfano joven, Eugène Atget es marinero y luego actor en compañías de provincias, antes de probar con la pintura. Hacia 1890 se instala en París como fotógrafo y vende a los artistas «documentos»: calles, fachadas, tiendas, oficios menudos, detalles de arquitectura. Durante casi cuarenta años constituye un inmenso inventario del viejo París, que vende a las bibliotecas y los museos de la ciudad, y fotografía luego los parques de Versalles, Saint-Cloud y Sceaux. Poco conocido en vida, es descubierto al final de su vida por Man Ray y Berenice Abbott, que salva su fondo tras su muerte en 1927."""
style = """
Atget trabaja con un material pesado y pasado de moda, una cámara de madera y placas de vidrio, y positiva sus pruebas sobre papel a la albúmina. Sus imágenes frontales, a menudo tomadas muy temprano por la mañana en calles desiertas, parecen simples documentos; pero su silencio, sus reflejos y su sentido del lugar han hecho de ellas uno de los modelos de la fotografía moderna."""
