[[oeuvres]]
titre = "Rinconera con jarrón de flores"
artiste = "Jacques-Émile Ruhlmann"
annee = "hacia 1923"
image = "encoignure-ruhlmann.jpg"
credit = "Photo : Brooklyn Museum"
licence = "Aucune restriction connue (Brooklyn Museum)"
source = "https://commons.wikimedia.org/wiki/File:Emile-Jacques_Ruhlmann_(French,_1879-1933)._Corner_Cabinet,_ca._1923..jpg"
technique = "Chapa de amaranto sobre caoba, incrustaciones de marfil, 126,7 × 80,6 × 59,7 cm"
collection = "Brooklyn Museum, Nueva York"
note = "Un mueble de esquina de maderas preciosas, donde un ramo de marfil estalla sobre la madera oscura: el lujo Art Déco."
description = """
Este mueble de esquina, de 1,27 metros de altura, está hecho para alojarse en el rincón de una habitación: su fachada, ligeramente abombada, está formada por una sola puerta. La madera, de un marrón rojizo profundo, está pulida como una laca. En el centro de la puerta, un gran medallón oval contiene una decoración incrustada de marfil y madera oscura: un jarrón estriado, muy alargado, del que brota un ramo de flores estilizadas de corolas redondas, tan denso que llena todo el óvalo. Un filete de diminutos puntos de marfil subraya los bordes de la puerta y de los montantes. El mueble descansa sobre tres patas finas y fusiformes, rematadas por zuecos de marfil."""
evocation = """
Ruhlmann retoma un mueble típico del siglo XVIII francés, la rinconera, y lo moderniza sin perder nada de su elegancia. El jarrón de flores, motivo clásico, se convierte en una imagen geométrica y rítmica: las estrías del jarrón, la simetría, el contraste del negro y el blanco anuncian el Art Déco. Este mueble se dirige a una clientela riquísima, que quiere un lujo discreto, hecho de maderas raras y acabados perfectos. Se lee también en él el reverso de ese lujo: el marfil y las maderas exóticas procedían en gran parte de las colonias, en una época en que poco importaba el precio humano y natural de su explotación."""
histoire = """
Ruhlmann repite varias veces este modelo de rinconera con jarrón florido, con variantes: un mueble vecino conservado en el Art Institute of Chicago se fecha hacia 1916. Este data de hacia 1923, dos años antes de la Exposición Internacional de Artes Decorativas e Industriales Modernas de 1925, que consagra a Ruhlmann y cuyo nombre daría más tarde el del estilo Art Déco. Sus muebles, de ejecución muy cuidada, se producen en pequeño número y se venden muy caros. Este fue adquirido por el Brooklyn Museum en 1971, gracias a varios donantes, en el momento en que se redescubría el gusto de los años veinte."""
facture = """
La chapa consiste en pegar finas láminas de madera preciosa sobre un armazón más corriente, aquí de caoba. Ruhlmann elige el amaranto, una madera tropical de tono rojo violáceo, y hace pulir su superficie hasta dejarla lisa como un espejo. El medallón es una marquetería: numerosas piezas pequeñas de marfil y madera oscura, cortadas y ensambladas como un rompecabezas. Los filetes de puntos de marfil, los zuecos de marfil y las patas fusiformes, que aligeran la silueta, son firmas de su estilo."""
details = [
  "El jarrón estriado del medallón, del que brota el ramo.",
  "El filete de puntos de marfil que recorre la puerta.",
  "Los zuecos de marfil en el extremo de las patas fusiformes.",
  "La fachada ligeramente abombada, que atrapa la luz.",
]
themes = ["mobiliario", "Art Déco", "ebanistería", "flores", "lujo"]
anecdote = """
Ruhlmann no quería que su empresa le sobreviviera: había pedido que se cerrara tras su muerte. En efecto, sus talleres cesan su actividad poco después de su fallecimiento, en 1933."""
