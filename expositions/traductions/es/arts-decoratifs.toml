[[oeuvres]]
titre = "Job"
artiste = "Alphonse Mucha"
annee = "1898"
image = "affiche-job.jpg"
cadre = "estampe"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Alphonse_Mucha_-_Job_-_Google_Art_Project.jpg"
technique = "Litografía en color, 141 × 93,8 cm"
collection = "National Gallery of Australia, Canberra"
note = "Un cartel para el papel de fumar Job: la cabellera de la fumadora invade toda la imagen."
description = """
Una joven está sentada de frente, envuelta en un largo vestido rosa que le deja los hombros desnudos. Con una mano levantada sostiene un cigarrillo cuyo humo se eleva en una cinta azulada; con la otra, apoyada en la rodilla, un pequeño librillo de papel de fumar marcado con la palabra JOB. Su cabello negro, salpicado de flores rojas, se despliega a ambos lados del cuerpo en mechones enroscados que descienden hasta el borde inferior del cartel. Tras ella, un gran círculo verde le hace las veces de aureola. En lo alto, las tres letras JOB, enormes y marrones, se recortan sobre un fondo amarillo sembrado de un monograma repetido; el mismo monograma sirve de broche a su vestido. Bajo la imagen, una línea de texto nombra al impresor parisino, F. Champenois."""
evocation = """
Mucha no muestra el producto: vende un sueño. La fumadora, con los ojos entornados, parece absorta en un placer apacible, y el humo de su cigarrillo se une a las volutas de su cabello. Esta mujer ideal, a la vez sensual y distante, ocupa todo el espacio, mientras que el nombre de la marca, repetido por doquier, se graba en la memoria del transeúnte. El círculo tras su cabeza recuerda las aureolas de los iconos bizantinos, que Mucha admiraba: en ello se ha visto una manera de sacralizar la publicidad. El cartel habla también de una época en que una mujer que fuma sigue siendo una imagen audaz, que atrae tanto como provoca."""
histoire = """
Job es una marca de papel de fumar fundada en Perpiñán por la familia Bardou: su nombre procede de las iniciales de Jean Bardou, J y B, separadas por un rombo que el público leyó como una O. En la década de 1890, la firma encarga carteles a los artistas de moda. Mucha, que se había hecho famoso de golpe con el cartel de Gismonda para Sarah Bernhardt, pegado por todo París a principios de 1895, le dibuja un primero en 1896 y después este, más grande, en 1898. Está impreso en litografía por Champenois, el impresor al que Mucha está vinculado por contrato. Los aficionados coleccionan entonces los carteles con pasión: se habla de «afichomanía». Este ejemplar fue adquirido en 1974 por la National Gallery of Australia, en Canberra."""
facture = """
El cartel es una litografía en color: cada tinta se dibuja en una piedra distinta, y la hoja pasa sucesivamente bajo cada una de ellas. Mucha perfila sus formas con un trazo marrón o negro de grosor variable, como el plomo de una vidriera, y las rellena después con colores suaves y planos: rosa, verde agua, amarillo. El modelado es ligero, salvo en el rostro y las manos. La composición se inscribe en un marco de letras y círculos, y los cabellos, convertidos en arabescos casi abstractos, organizan todo el espacio. Se reconoce en ella la lección de las estampas japonesas, entonces de moda en París."""
details = [
  "El humo del cigarrillo, que se desenrolla como una cinta de seda.",
  "El pequeño librillo de papel marcado con la palabra JOB, en la mano apoyada sobre la rodilla.",
  "El broche del vestido, que retoma el monograma de la marca.",
  "El pie desnudo que asoma bajo el vestido, en la parte inferior de la imagen.",
  "La firma de Mucha, abajo a la izquierda, y el nombre del impresor bajo la imagen.",
]
themes = ["cartel", "publicidad", "cabellera", "mujer", "litografía"]
anecdote = """
Las mujeres de cabellos en arabesco de Mucha tuvieron tanto éxito que, hacia 1900, en París se hablaba de «estilo Mucha» para designar todo el Art Nouveau. El artista, que se consideraba ante todo pintor, acabó irritándose por ello."""
salle = 1
mur = "nord"
place = 1
largeur = 1.3

[[oeuvres]]
titre = "Jarrón des Binelles"
artiste = "Hector Guimard"
annee = "1903"
image = "vase-des-binelles.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Vase_des_Binelles_MET_DP324639.jpg"
technique = "Gres esmaltado, Manufacture nationale de Sèvres, 130,2 × 39,1 × 39,7 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un jarrón más alto que un niño, diseñado por el arquitecto de las entradas del metro de París y cocido en Sèvres."
description = """
El jarrón, de 1,30 metros de altura, tiene la silueta de una columna que se ensancha hacia arriba. Sus cuatro ángulos forman nervaduras que suben desde el pie como tallos, se separan cerca de la parte superior y se curvan en ganchos sobre la abertura, a la manera de cuernos o de brotes. Entre estas nervaduras, la pared está perforada, en lo alto, por largas aberturas en forma de almendra. Cerca del pie, una espiral en relieve se enrolla sobre sí misma. Toda la superficie está cubierta por un vidriado de un beige verdoso, salpicado de manchas azules que centellean como cristales. No se representa ninguna flor ni ningún animal: es la propia forma la que parece viva. En la fotografía, el jarrón está colocado sobre un pedestal gris."""
evocation = """
Guimard no copia la naturaleza: retiene su movimiento, la savia que asciende, el tallo que se retuerce. El jarrón parece haber brotado más que haber sido fabricado. Su nombre recuerda la rue des Binelles, en Sèvres, donde el arquitecto acababa de construir el Castel Henriette, una villa toda de curvas: el jarrón retoma algunas de sus formas, como un fragmento de casa convertido en objeto. En él se reconoce la ambición del Art Nouveau de unir todas las artes, de la fachada al tirador de la puerta, y la idea, muy querida por Guimard, de que un arquitecto debe diseñar cada detalle. El jarrón expresa también la voluntad de una manufactura estatal, Sèvres, de demostrar que sabe ser moderna."""
histoire = """
Fundada en el siglo XVIII, manufactura real y luego nacional, Sèvres busca hacia 1900 renovar sus modelos. Bajo el impulso de Alexandre Sandier, director de los trabajos artísticos desde 1897, recurre a creadores externos, entre ellos Hector Guimard, que diseña para ella varios jarrones. El Jarrón des Binelles se edita en gres en unos pocos ejemplares, cinco según el Cleveland Museum of Art, que conserva uno. Estas piezas espectaculares estaban destinadas a las exposiciones y a ricos aficionados. Tras la Primera Guerra Mundial, Guimard cae en el olvido; no se lo redescubre hasta los años sesenta. El ejemplar del Metropolitan Museum procede de la colección de cerámicas de Robert A. Ellison Jr. y fue adquirido por el museo en 2013."""
facture = """
El jarrón es de gres, una arcilla cocida a muy alta temperatura que se vuelve dura e impermeable. Su forma, con los ángulos vaciados y los ganchos, no tiene nada de pieza torneada: es un volumen de arquitecto, concebido como un pequeño monumento. El vidriado debe sus manchas centelleantes a los cristales que se forman en el esmalte durante la cocción y el enfriamiento: su dibujo nunca es del todo igual de un ejemplar a otro. Los ceramistas de 1900 buscaban estos efectos en parte imprevisibles, que daban a cada pieza un aspecto natural, próximo a la piedra o al liquen."""
details = [
  "Los ganchos de la parte superior, que se curvan sobre la abertura.",
  "La espiral cerca del pie, como el báculo de un helecho.",
  "Las aberturas en forma de almendra practicadas entre las nervaduras.",
  "Las manchas azules del vidriado, que centellean como escarcha.",
]
themes = ["cerámica", "arquitectura", "línea", "Sèvres", "naturaleza"]
anecdote = """
En 1900, Guimard diseña para el metro de París unas entradas de fundición pintadas de verde, con lámparas en forma de brotes. Varias fueron regaladas a ciudades extranjeras: una de ellas adorna desde 1967 la estación Square-Victoria, en Montreal."""
salle = 1
mur = "nord"
place = 4
largeur = 1.2

[[oeuvres]]
titre = "Jarrón de colquicos"
artiste = "Émile Gallé"
annee = "hacia 1900"
image = "vase-crocus-automne.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:%22Autumn_Crocus%22_Vase_MET_DT1081.jpg"
technique = "Vidrio, altura 44,1 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un largo tallo de vidrio donde se abren flores de otoño: Gallé hace del jarrón la propia planta. Título del museo: «Autumn Crocus»."
description = """
El jarrón, de 44 centímetros de altura, es estrecho y esbelto como un tallo. Descansa sobre un pie ancho y bajo, oscuro y brillante, de bordes ondulados, que evoca un bulbo o una mata posada en el suelo. El cuerpo del jarrón, casi blanco en lo alto, se tiñe hacia abajo de rojo y violeta, y toda su superficie está recorrida por finas estrías malvas verticales, como las nervaduras de una hoja. Sobre este fondo suben largos tallos marrones; llevan flores en relieve: una gran corola anaranjada abierta hacia arriba y, a su alrededor, flores azules y violetas todavía entreabiertas. Unos estambres amarillos, hechos de finos hilos de vidrio, brotan de las corolas."""
evocation = """
El colquico, que los ingleses llaman «azafrán de otoño», florece en los prados a finales del verano y en otoño, sin hojas, cuando el resto de la naturaleza declina. A menudo se han leído las flores de fin de estación, abundantes en Gallé, como imágenes del paso del tiempo y de la melancolía. El jarrón no representa solo una flor: su propia forma, con el pie en bulbo y el cuerpo en tallo, se convierte en la planta. Esta fusión del objeto y del modelo natural está en el corazón del Art Nouveau de Nancy. Traduce la convicción de Gallé de que el artista debe observar la naturaleza como un sabio antes de interpretarla como un poeta."""
histoire = """
Hacia 1900, Gallé está en la cumbre de su gloria. En la Exposición Universal de París de ese año, sus vidrios y sus muebles valen a su casa de Nancy las más altas recompensas. Sus talleres emplean entonces a varios centenares de obreros y producen a la vez piezas únicas, largamente trabajadas, y series más asequibles. Este jarrón, de flores aplicadas una a una, pertenece a las piezas más cuidadas. Tras la muerte de Gallé, en 1904, la empresa prosigue su producción hasta 1936. El jarrón ingresó en el Metropolitan Museum of Art en 1984, donación de Lloyd y Barbara Macklowe, marchantes y coleccionistas neoyorquinos especialistas en Art Nouveau."""
facture = """
El vidrio está soplado en varias capas, teñidas en la masa con óxidos metálicos, lo que produce el degradado del blanco lechoso al rojo violáceo. Las finas estrías malvas quedan atrapadas en el espesor. Las flores parecen hechas de trozos de vidrio de color aplicados en caliente sobre la pared y modelados después: una técnica próxima a la marquetería de vidrio, que Gallé patenta en 1898. Los estambres son hilos de vidrio amarillo estirados. El pie, oscuro con reflejos cobrizos, contrasta con la claridad del cuello. El conjunto tiene tanto de escultura como de vidriera."""
details = [
  "La gran flor anaranjada de la parte superior, con sus estambres amarillos.",
  "Las finas estrías malvas que recorren todo el vidrio.",
  "El pie oscuro de reflejos cobrizos, que evoca un bulbo.",
  "El degradado del blanco lechoso en lo alto al rojo violáceo abajo.",
]
themes = ["vidrio", "flores", "otoño", "Nancy", "botánica"]
anecdote = """
En la puerta de sus talleres de Nancy, Gallé había hecho esculpir su divisa: «Mi raíz está en lo profundo de los bosques». Esta puerta se conserva hoy en el Museo de la Escuela de Nancy."""
salle = 2
mur = "ouest"
place = 1
largeur = 0.9

[[oeuvres]]
titre = "Jarrón en forma de calabaza"
artiste = "Daum frères"
annee = "hacia 1910"
image = "vase-calebasse-daum.jpg"
licence = "CC0"
source = "https://www.clevelandart.org/art/2018.259"
technique = "Vidrio soplado y moldeado, polvos vitrificados, decoración aplicada grabada a la rueda, altura 34,9 cm"
collection = "Cleveland Museum of Art"
note = "Una calabaza de vidrio, agujereada como un fruto roído, donde se posan dos insectos: el humor y la virtuosidad de los Daum."
description = """
El jarrón, de 35 centímetros de altura, imita una calabaza, ese fruto de la familia de las cucurbitáceas con dos abultamientos. Su rabillo, en lo alto, se alza en un lazo de vidrio rayado de verde y amarillo. En el costado, una amplia abertura irregular, de bordes rizados, recuerda un agujero roído en la corteza. La piel del fruto, amarilla y verde, está jaspeada de manchas naranjas, rojas y azules, y sembrada de pequeños granos en relieve. Un largo zarcillo de vidrio amarillo se enrosca alrededor de la panza. Cerca de la abertura, dos pequeños insectos de un rojo oscuro, dispuestos en relieve, parecen dirigirse hacia el agujero. Nada evoca un jarrón corriente: el objeto se hace pasar por un fruto hallado en el huerto."""
evocation = """
En Nancy, los artistas del Art Nouveau toman sus modelos tanto de la huerta como del jardín: calabazas, setas, umbelas. Esta calabaza roída habla del ciclo de la naturaleza, en el que el fruto madura, se estropea y alimenta a los insectos. Se puede ver en ella una meditación sobre el paso del tiempo, pero también un juego: el objeto engaña a la vista y divierte. El jarrón muestra que los hermanos Daum, que se adentraron en el vidrio artístico tras los pasos de Gallé, encontraron su propio camino, más orientado hacia los efectos de materia y de color. Testimonia, en fin, la admiración de los artistas de 1900 por Japón, cuyo arte ama la calabaza y los pequeños insectos."""
histoire = """
La vidriera Daum es, ante todo, un asunto de familia: en la década de 1870, el notario Jean Daum se hace cargo en Nancy de una vidriería que fabrica vasos de mesa y botellas. Sus hijos Auguste y Antonin la desarrollan tras su muerte, en 1885. Impresionados por el éxito de Gallé en la Exposición Universal de 1889, crean a principios de la década de 1890 un taller de vidrio artístico, pronto recompensado en la Exposición de 1900. Hacia 1910, la casa multiplica los experimentos con colores atrapados en el vidrio, como en este jarrón. Tras pasar por varias colecciones privadas y subastas públicas, fue adquirido por el Cleveland Museum of Art en 2018, en una subasta celebrada en Nueva York."""
facture = """
El vidriero sopla la paraison, la bola de vidrio fundido, en un molde que le da su forma de doble abultamiento. La rueda aún caliente sobre polvos de vidrio de colores, que se funden en la superficie y crean esos jaspeados naranjas, verdes y azules: es lo que se llama polvos vitrificados. El rabillo, el zarcillo y los insectos se añaden en caliente, y después algunos detalles se retocan a la rueda, una pequeña muela que graba el vidrio frío. Los bordes rizados de la abertura muestran que el vidrio se trabajó cuando aún estaba blando."""
details = [
  "El rabillo de vidrio rayado de verde y amarillo, que se curva en la parte superior.",
  "Los dos insectos de rojo oscuro posados cerca del agujero.",
  "El zarcillo amarillo que casi rodea la panza.",
  "Los pequeños granos de colores en relieve, sembrados por toda la piel.",
]
themes = ["vidrio", "fruto", "insectos", "Nancy", "japonismo"]
anecdote = """
En 1901, Antonin Daum funda con Émile Gallé, Louis Majorelle y Victor Prouvé la Escuela de Nancy, una alianza de artistas e industriales lorenenses: pese a su rivalidad comercial, Gallé y los Daum defienden juntos el arte de su ciudad."""
salle = 2
mur = "ouest"
place = 3
largeur = 0.75

[[oeuvres]]
titre = "Magnolias e iris"
artiste = "Tiffany Studios"
annee = "hacia 1908"
image = "magnolias-et-iris.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Magnolias_and_Irises_MET_DT9363.jpg"
technique = "Vidriera, vidrio Favrile y plomo, 153 × 106,7 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una vidriera sin santos ni ángeles: un paisaje al atardecer, visto a través de ramas de magnolio."
description = """
En primer plano, dos jóvenes magnolios de troncos finos enmarcan la escena; sus ramas cubiertas de grandes flores crema llenan toda la parte superior de la vidriera. Al pie de los árboles, matas de iris violetas, malvas y azul noche se alzan entre largas hojas verdes. Más allá se extiende un lago o un ancho río, que se adentra serpenteando entre colinas azules. El cielo, surcado de nubes, pasa del violeta al rosa y al amarillo pálido: es la hora del ocaso, o la del alba. No aparece ningún personaje. Los plomos que sujetan los trozos de vidrio dibujan los troncos, las ramas y el contorno de cada pétalo, y una orla oscura enmarca el conjunto."""
evocation = """
En el siglo XIX, las vidrieras representaban de ordinario santos y escenas de la Biblia. Tiffany Studios populariza en Estados Unidos otro género: la vidriera de paisaje, a menudo encargada en memoria de un difunto, para una iglesia o un mausoleo. La naturaleza sustituye en ella al relato religioso. Las flores que se abren, el agua que se aleja hacia el horizonte, la luz de la tarde hablan de paz y de tránsito más que de muerte. De buen grado se lee en el magnolio, que florece a comienzos de la primavera, y en el iris emblemas de renovación. En una casa, una vidriera así convertía además una ventana en jardín perpetuo."""
histoire = """
Louis Comfort Tiffany, primero pintor, se volvió hacia la vidriera a finales de la década de 1870. Treinta años más tarde, sus talleres neoyorquinos, convertidos en Tiffany Studios en 1902, entregan un gran número de ventanales para iglesias, edificios públicos y residencias privadas. Como la mayoría de estas obras, esta vidriera, realizada hacia 1908, es fruto de un trabajo colectivo: unos dibujantes componían una maqueta en color, y luego unos artesanos elegían el vidrio pieza a pieza entre inmensas reservas, lo cortaban y lo ensamblaban. Olvidadas tras la Primera Guerra Mundial, estas vidrieras volvieron a ser muy admiradas a partir de los años sesenta. Esta ingresó en el Metropolitan Museum of Art en 1981, donada anónimamente en memoria del Sr. y la Sra. A. B. Frank."""
facture = """
Tiffany evita en lo posible pintar sobre el vidrio, como hacían los vidrieros tradicionales para las sombras y los detalles. Casi todo se obtiene del propio vidrio: vidrio opalescente, lechoso y matizado, del que fue, junto con John La Farge, uno de los grandes promotores; vidrios jaspeados o plisados según los efectos buscados. Para dar profundidad a un color, a veces se superponen varias placas. El nombre de Favrile, elegido por Tiffany, designa sus vidrios coloreados en la masa. El plomo, de grosor variable, sirve también de dibujo, como un trazo de tinta."""
details = [
  "Los pétalos de los magnolios, crema y rosados, recortados uno a uno en el vidrio.",
  "El río que serpentea entre las colinas hasta el horizonte.",
  "Los iris del primer plano, del malva al azul casi negro.",
  "Las bandas de nubes, hechas de vidrios de colores mezclados.",
]
themes = ["vidriera", "paisaje", "luz", "flores", "vidrio"]
anecdote = """
Tiffany eclipsó durante mucho tiempo a sus colaboradores. Hoy los historiadores atribuyen a Agnes Northrop, que ingresó en sus talleres en la década de 1880, buena parte de los diseños de sus vidrieras de flores y de paisajes."""
salle = 3
mur = "est"
place = 2
largeur = 1.5

