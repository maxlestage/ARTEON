[[oeuvres]]
titre = "Jarrón «Torbellinos»"
artiste = "René Lalique"
annee = "1926"
image = "vase-tourbillons.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:%22Tourbillons%22_(Whirlwinds)_Vase_MET_DP108180.jpg"
technique = "Vidrio, realces de esmalte negro, 20 × 20,3 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un jarrón de vidrio grueso, excavado con espirales subrayadas de negro: el movimiento detenido en la materia."
description = """
El jarrón, de 20 centímetros de altura, tiene la forma de un grueso cilindro de costados ligeramente abombados. Su pared de vidrio incoloro, muy gruesa, está esculpida con amplios motivos en relieve que se enroscan como olas, báculos o torbellinos de viento, de ahí su nombre. Estas volutas se superponen y parecen girar alrededor del jarrón. Sus aristas están subrayadas con esmalte negro, que dibuja grandes curvas oscuras sobre el vidrio transparente. Según el ángulo de visión, la luz atraviesa el vidrio, se quiebra en los relieves y hace aparecer reflejos plateados. La abertura, ancha y redonda, está cortada en seco. Ningún motivo es figurativo: la decoración es puro movimiento."""
evocation = """
Veinticinco años antes, Lalique diseñaba joyas pobladas de mujeres-libélula y de flores. Con Torbellinos pasa a un lenguaje casi abstracto: ya no se representa la naturaleza, sino solo su energía, la del viento o la del agua que gira. El jarrón sirve así de vínculo entre el Art Nouveau, del que conserva las curvas, y el Art Déco, del que adopta la fuerza geométrica y el contraste del negro y el blanco. Expresa también el espíritu de los años veinte, fascinados por la velocidad y el movimiento, y la voluntad de Lalique de producir en serie bellos objetos, accesibles a una clientela más amplia que la de sus joyas únicas."""
histoire = """
Después de 1900, Lalique, entonces el joyero más célebre de París, se vuelve hacia el vidrio. Diseña primero frascos de perfume para François Coty, luego abre su propia vidriería en Combs-la-Ville, cerca de París, en 1909, y a principios de los años veinte una gran fábrica en Wingen-sur-Moder, en Alsacia. El jarrón Torbellinos se crea en 1926, un año después de la Exposición de Artes Decorativas de 1925, donde Lalique había presentado su propio pabellón y una gran fuente de vidrio. El modelo conoce un gran éxito y forma parte de las creaciones más célebres de la casa. Este ejemplar ingresó en el Metropolitan Museum of Art en 2004."""
facture = """
Para producir en serie, Lalique moldea su vidrio: la materia fundida se sopla o se prensa en un molde de metal que le da de golpe su forma y su relieve. Los torbellinos, muy profundos, exigen una pared gruesa: el jarrón pesa casi cinco kilos. Tras el enfriamiento, el vidrio se pule, y el esmalte negro, aplicado en los huecos y en las aristas, se cuece para fijarlo. El contraste entre el vidrio claro, brillante como el cristal, y el negro mate da al objeto su efecto gráfico."""
details = [
  "Las aristas de las volutas, subrayadas con un trazo de esmalte negro.",
  "Los reflejos plateados de la luz en el espesor del vidrio.",
  "El ritmo de los torbellinos, que parecen girar alrededor del jarrón.",
  "La abertura redonda, nítida, cortada a ras.",
]
themes = ["vidrio", "Art Déco", "movimiento", "abstracción", "serie"]
anecdote = """
Lalique decoró también trenes y transatlánticos: se le deben paneles de vidrio para coches del Orient-Express en 1929, y luego luminarias para el comedor del transatlántico Normandie, puesto en servicio en 1935."""
salle = 5
mur = "nord"
place = 3
largeur = 0.9

[[artistes]]
nom = "Alphonse Mucha"
vie = "Ivančice (Moravia), 24 de julio de 1860 – Praga, 14 de julio de 1939"
biographie = """
Nacido en Moravia, entonces provincia del Imperio austríaco, Alfons Mucha trabaja primero como pintor de decorados teatrales en Viena, y luego decora el castillo de un conde que le paga los estudios en la Academia de Bellas Artes de Múnich. Llegado a París en 1887, sigue los cursos de la Academia Julian y de la Academia Colarossi y vive de sus ilustraciones. A finales de 1894, casi por casualidad, dibuja el cartel de Gismonda para Sarah Bernhardt: pegado por todo París a principios de 1895, lo hace célebre. La actriz le firma un contrato de seis años y el impresor Champenois lo contrata. Carteles, paneles decorativos, calendarios, joyas y una tienda para el joyero Georges Fouquet: se convierte en uno de los rostros del Art Nouveau. Tras varias estancias en Estados Unidos, regresa a Bohemia en 1910 y dedica casi veinte años a la Epopeya eslava, una serie de veinte lienzos inmensos sobre la historia de los pueblos eslavos. En 1918 diseña los primeros sellos y billetes de la Checoslovaquia independiente. Detenido e interrogado por la Gestapo tras la invasión alemana de 1939, muere unos meses más tarde."""
style = """
Mucha creó una imagen inmediatamente reconocible: una joven de cabellos desplegados en arabescos, inscrita en un círculo o un arco, rodeada de flores y de motivos repetidos. Su trazo perfilado, sus colores suaves y sus composiciones muy ordenadas deben mucho a los iconos bizantinos, al arte popular de su Moravia natal y a las estampas japonesas. Hizo del cartel un arte de pleno derecho e inspiró la ilustración hasta el cómic y el grafismo psicodélico de los años sesenta."""

[[artistes]]
nom = "Hector Guimard"
vie = "Lyon, 10 de marzo de 1867 – Nueva York, 20 de mayo de 1942"
biographie = """
Hector Guimard nace en Lyon y estudia en París, en la Escuela Nacional de Artes Decorativas y luego en la Escuela de Bellas Artes. Sus primeras construcciones siguen marcadas por la mezcla de estilos antiguos. El giro se produce en 1895, durante un viaje a Bruselas donde descubre el hôtel Tassel de Victor Horta: una arquitectura donde la estructura y el ornamento son una sola cosa. Retoma entonces por completo el proyecto del Castel Béranger, un edificio del distrito 16 en el que lo diseña todo, desde la fachada hasta los papeles pintados; terminado en 1898, es premiado en el primer concurso de fachadas de la Ciudad de París. En 1900, la Compañía del Ferrocarril Metropolitano le encarga las entradas de las estaciones: sus edículos y sus cercados de fundición verde se convierten en el símbolo del París de 1900. Construye después villas, hoteles particulares y edificios, entre ellos su propio hôtel de la avenue Mozart, tras su matrimonio en 1909 con la pintora estadounidense Adeline Oppenheim. Después de la guerra, su estilo pasa de moda. En 1938, inquieto por el auge del antisemitismo, pues su esposa es judía, parte hacia Nueva York, donde muere en 1942, casi olvidado."""
style = """
Guimard es el gran representante parisino del Art Nouveau. No copia las plantas: retiene su crecimiento, su tensión, la curva que se retuerce y se enrosca, y extrae de ello un lenguaje abstracto de líneas «en golpe de látigo». Arquitecto total, lo diseña todo, de las fachadas a los muebles, de la fundición industrial a los jarrones. Sus entradas de metro, ensambladas a partir de elementos estandarizados producidos en serie, muestran que quería también poner el arte al alcance de todos."""

[[artistes]]
nom = "Émile Gallé"
vie = "Nancy, 4 de mayo de 1846 – Nancy, 23 de septiembre de 1904"
biographie = """
Hijo de un comerciante de loza y vidrio de Nancy, Émile Gallé recibe una formación muy amplia: estudia botánica, filosofía y dibujo, y luego aprende alemán y la técnica del vidrio en Weimar y en la vidriería de Meisenthal, en Lorena. Tras la guerra de 1870, se hace cargo de la empresa familiar, que transforma poco a poco en taller de arte. Sus vidrios, sus lozas y pronto sus muebles ornados de plantas le valen un triunfo en la Exposición Universal de 1889 y luego en la de 1900. Botánico reconocido, cultiva en su jardín numerosísimas especies, que se convierten en los modelos de su obra. Hombre comprometido, defiende públicamente al capitán Dreyfus, a riesgo de perder clientes. En 1901 funda la Escuela de Nancy, alianza de las industrias artísticas de la ciudad, de la que es el primer presidente. Aquejado de leucemia, muere en 1904, a los cincuenta y ocho años. Su viuda, Henriette, prosigue la empresa, que cerrará en 1936."""
style = """
Gallé hace del vidrio un medio de expresión poética. Multiplica las técnicas, capas de colores superpuestas, grabado al ácido y a la rueda, inclusiones, marquetería de vidrio, para obtener efectos de materia inéditos. Sus decoraciones de plantas e insectos, observados como un sabio, suelen ir acompañadas de versos de poetas inscritos en el vidrio: son sus «vidrios parlantes». Hizo de Nancy uno de los grandes focos del Art Nouveau."""

[[artistes]]
nom = "Daum frères"
vie = "Nancy (Lorena), vidriería familiar; Auguste Daum (1853–1909) y Antonin Daum (1864–1930)"
biographie = """
Jean Daum, notario en Bitche, en el Mosela, abandona la región anexionada por Alemania tras 1871 y se instala en Nancy. En la década de 1870 toma el control de una vidriería en la que había invertido dinero, y que fabrica vasos de mesa, botellas y vajilla corriente. A su muerte, en 1885, sus hijos se hacen cargo de la empresa: Auguste, el mayor, formado en derecho, la dirige; Antonin, ingeniero, se ocupa de la creación. Tras la Exposición Universal de 1889, en la que triunfa Gallé, los dos hermanos se lanzan al vidrio artístico y abren un taller de decoración, donde trabaja en particular el dibujante Henri Bergé. Su éxito es rápido, y la casa es recompensada en la Exposición Universal de 1900. Antonin Daum participa en 1901 en la fundación de la Escuela de Nancy. Hacia 1906, los Daum relanzan la pasta de vidrio con Amalric Walter. Después de la Primera Guerra Mundial, la casa pasa al Art Déco, con jarrones gruesos, grabados profundamente al ácido, de formas geométricas. La empresa lleva todavía hoy el nombre de la familia."""
style = """
Los Daum comparten con Gallé el gusto por las plantas, los paisajes lorenenses y los insectos, pero su vidrio se distingue por la riqueza de los colores atrapados en la masa, los polvos vitrificados y los paisajes grabados al ácido que cambian con la luz. Más industrial que la de Gallé, su producción asocia piezas únicas y grandes series. Supo atravesar los estilos, del Art Nouveau al Art Déco."""

[[artistes]]
nom = "Tiffany Studios"
vie = "Nueva York, 1902–1932; fundados por Louis Comfort Tiffany (Nueva York, 1848 – Nueva York, 1933)"
biographie = """
Louis Comfort Tiffany nace en Nueva York en 1848, hijo de Charles Lewis Tiffany, fundador de la célebre joyería Tiffany & Co. En lugar de hacerse cargo del negocio paterno, se hace pintor, alumno de George Inness y de Samuel Colman, y viaja por Europa y el norte de África. A finales de la década de 1870 se vuelve hacia las artes decorativas y el vidrio, que juzga capaz de rendir la luz mejor que la pintura. Su empresa de decoración acondiciona en 1882 varios salones de la Casa Blanca, para el presidente Chester Arthur. En 1894 da el nombre de Favrile a sus vidrios soplados. En París, el marchante Siegfried Bing, cuya galería L'Art nouveau abre en 1895, lo da a conocer en Europa. En 1902, sus talleres adoptan el nombre de Tiffany Studios. Centenares de artesanos trabajan allí, y las mujeres desempeñan un papel capital: Clara Driscoll diseña numerosas lámparas, Agnes Northrop numerosas vidrieras. Tiffany se hace construir en Long Island una vasta propiedad, Laurelton Hall. Su estilo pasa de moda tras la guerra; Tiffany Studios quiebra en 1932, y Tiffany muere al año siguiente."""
style = """
Tiffany quiere pintar con el propio vidrio, sin recubrirlo de pintura. Sus talleres perfeccionan vidrios opalescentes, jaspeados, plisados o irisados, de colores matizados en la masa, que dan vida a los paisajes, a las flores y a los cielos. Sus lámparas de vidrio ensamblado con cinta de cobre y sus jarrones Favrile irisados se han convertido en el símbolo del Art Nouveau estadounidense, muy imitado hasta hoy."""

[[artistes]]
nom = "Charles Rennie Mackintosh"
vie = "Glasgow, 7 de junio de 1868 – Londres, 10 de diciembre de 1928"
biographie = """
Hijo de un agente de policía de Glasgow, Charles Rennie Mackintosh entra a los dieciséis años como aprendiz en casa de un arquitecto y sigue los cursos nocturnos de la Glasgow School of Art. Con su amigo Herbert MacNair y las hermanas Margaret y Frances Macdonald, forma el grupo que será apodado «los Cuatro», que inventa un estilo de líneas estiradas y figuras estilizadas. En 1896 gana el concurso para el nuevo edificio de la escuela de arte de Glasgow, construido en dos fases hasta 1909: es su obra maestra. Ese mismo año comienza su larga colaboración con Kate Cranston, para quien concibe la decoración y el mobiliario de varios salones de té, entre ellos los Willow Tea Rooms en 1903. Se casa con Margaret Macdonald en 1900 y expone con ella en la Secesión de Viena ese mismo año. Construye también Hill House, cerca de Glasgow, para el editor Walter Blackie. Pero los encargos escasean: en 1914 deja Glasgow, se instala en Londres y, de 1923 a 1927, en el sur de Francia, en Port-Vendres, donde pinta acuarelas. Enfermo, muere en Londres en 1928."""
style = """
Mackintosh combina el rigor de la línea recta y la dulzura de motivos florales muy estilizados, como la célebre «rosa de Glasgow». Sus muebles, a menudo muy altos, pintados de blanco o teñidos de negro, están concebidos como elementos de arquitectura, en interiores enteramente diseñados por él. Más admirado en Viena y en Alemania que en su país mientras vivió, hoy se le considera uno de los precursores del diseño moderno."""

[[artistes]]
nom = "Jacques-Émile Ruhlmann"
vie = "París, 28 de agosto de 1879 – París, 15 de noviembre de 1933"
biographie = """
Hijo de un empresario de pintura de edificios de origen alsaciano, Jacques-Émile Ruhlmann se hace cargo en 1907, a la muerte de su padre, del negocio familiar, que vende también papeles pintados y espejos. Sin formación de ebanista, diseña sin embargo muebles, que hace ejecutar por artesanos, y los expone por primera vez en el Salón de Otoño de 1913. Después de la guerra, funda con Pierre Laurent una empresa que reúne pintura, decoración y ebanistería, e instala sus propios talleres. En la Exposición Internacional de Artes Decorativas e Industriales Modernas de 1925, su Hôtel du collectionneur, un pabellón cuya decoración y mobiliario concibe, causa sensación y lo consagra como el mayor ebanista de su tiempo. Sus clientes son grandes fortunas, banqueros, industriales o maharajás, y el Estado le encarga también muebles. Muere en 1933, a los cincuenta y cuatro años, y sus talleres cierran según su voluntad."""
style = """
Ruhlmann es el gran ebanista del Art Déco. Sus muebles retoman la elegancia y las proporciones del mobiliario francés del siglo XVIII, pero simplificadas: líneas puras, patas fusiformes, fachadas abombadas. La decoración se reduce a la belleza de las maderas raras, ébano de Macasar, amboina, amaranto, y a finos filetes de marfil. Su exigencia de perfección, hasta en las partes invisibles, ha hecho de sus piezas objetos entre los más buscados del siglo XX."""

[[artistes]]
nom = "René Lalique"
vie = "Aÿ (Marne), 6 de abril de 1860 – París, mayo de 1945"
biographie = """
Nacido en la Champaña, René Lalique entra a los dieciséis años, tras la muerte de su padre, como aprendiz en casa del joyero parisino Louis Aucoc. Estudia después dos años en Inglaterra, y luego diseña joyas para grandes casas antes de abrir su propio taller en 1885. En la década de 1890 inventa una joya nueva, en la que materiales modestos, cuerno, esmalte, vidrio, se mezclan con el oro y las piedras. Sarah Bernhardt y el coleccionista Calouste Gulbenkian lo admiran, y la Exposición Universal de 1900 lo consagra. Pero pronto se vuelve hacia el vidrio. A partir de 1907 diseña frascos para el perfumista François Coty, luego abre una vidriería en Combs-la-Ville en 1909 y otra, más grande, en Wingen-sur-Moder, en Alsacia, a principios de los años veinte. Jarrones, estatuillas, luminarias, tapones de radiador para automóviles, paneles para trenes y transatlánticos: hace del vidrio moldeado un arte de lo cotidiano. En la Exposición de 1925 presenta su propio pabellón y una fuente monumental. Muere en París al final de la Segunda Guerra Mundial, en 1945."""
style = """
Joyero del Art Nouveau, Lalique se convierte en vidriero del Art Déco. Su vidrio moldeado, a menudo satinado u opalescente, a veces realzado con esmalte o pátina, juega con el contraste de lo mate y lo brillante. Mujeres, animales, plantas y motivos abstractos adquieren en él un relieve escultórico. Al producir en serie objetos de gran calidad, demostró que la industria podía estar al servicio de la belleza."""
