[exposition]
ordre = 165
nom_court = "Artes decorativas"
mouvement = "Art Nouveau y Art Déco, las artes decorativas"
cadre = "vitrine"
couleur = "#566b34"
titre = "Del Art Nouveau al Art Déco, el arte en la casa"
artiste = "Tiffany, Gallé, Daum, Guimard, Mackintosh, Ruhlmann, Lalique…"
dates = "1897–1926"
accroche = "Exposición virtual · Museo de Artes Decorativas, París"
introduction = """
Hacia 1890, unos artistas se niegan a copiar los estilos del pasado y quieren llevar el arte a todas partes: a una lámpara, una silla, un jarrón o un cartel. El Art Nouveau extrae sus líneas de las plantas y los insectos, de Nancy a Glasgow y de París a Nueva York; en los años veinte, el Art Déco le responde con la geometría, las maderas preciosas y el vidrio moldeado. La visita reúne diez objetos, de 1897 a 1926, presentados en vitrina. El edificio se inspira en el Museo de Artes Decorativas de París, instalado en el pabellón de Marsan, en el Louvre: una gran nave de catorce metros de altura, desde la que se accede a las galerías."""
vitrine = "magnolias-et-iris.jpg"

[musee]
nom = "Museo de Artes Decorativas"
ville = "París, Francia"
construction = "Inaugurado en 1905 en el pabellón de Marsan del Louvre"
presentation = """
En 1864, industriales, artistas y coleccionistas fundan en París la Unión Central de Bellas Artes Aplicadas a la Industria: quieren que los objetos fabricados en Francia sigan siendo bellos en la era de la máquina. Convertida en 1882 en la Unión Central de Artes Decorativas, la asociación reúne colecciones y obtiene del Estado el pabellón de Marsan, en el extremo oeste del ala del Louvre que bordea la rue de Rivoli. Este pabellón, incendiado en 1871 junto con el palacio de las Tullerías durante la Comuna, había sido reconstruido poco después. El museo abre allí en 1905. En el corazón del edificio, una vasta nave cubierta por una montera de cristal da acceso a galerías distribuidas en varios niveles. Allí se sigue la historia de los objetos desde la Edad Media hasta nuestros días: mobiliario, cerámica, vidrio, orfebrería, papeles pintados, juguetes, carteles. Las salas Art Nouveau y Art Déco son célebres, con las piezas del apartamento de la modista Jeanne Lanvin, diseñadas por Armand-Albert Rateau. Tras diez años de renovación, el museo reabrió en 2006."""
ici = """
El edificio de ARTEON retoma la idea de la nave del museo parisino. Se entra por el sur en «La nave», de veinte metros de largo y catorce de alto, con muros del color de la piedra, donde un cartel de Mucha y un gran jarrón de Guimard reciben al visitante. Al oeste se abre la galería «Nancy, el vidrio y la naturaleza», de un verde pálido; al este, «Tiffany, la luz de Nueva York», color de miel. Al norte, la galería «París y Glasgow, la línea» enfrenta dos asientos y conduce después a la última sala, «1925, el Art Déco»."""

