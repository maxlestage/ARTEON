technique = "Vidrio ensamblado con cobre, bronce, altura 43,2 cm, diámetro 26,7 cm"
collection = "Cleveland Museum of Art"
note = "Una lámpara diseñada por Clara Driscoll: el pie es un tronco, la pantalla una cascada de racimos de glicinia."
description = """
La lámpara, de 43 centímetros de altura, parece un pequeño árbol. Su pie de bronce, con pátina verde y marrón, figura un tronco nudoso que surge de una base redonda donde se extienden las raíces. En lo alto, unas ramas de bronce caladas forman la parte superior de la pantalla. De ellas caen cientos de pequeños trozos de vidrio azules, malvas, blancos y turquesa: son las flores de la glicinia, agrupadas en racimos. Entre ellas, unas pocas hojas verdes. El borde inferior de la pantalla no es recto: termina en puntas irregulares, allí donde acaban los racimos, como una glicinia que cuelga de un emparrado. Encendida, la lámpara hace brillar todas estas flores desde el interior."""
evocation = """
La glicinia, llegada de Asia, estaba de moda en los jardines hacia 1900, y sus racimos colgantes seducían a los aficionados al arte japonés. La lámpara hace de ella un objeto poético: por la noche, en un salón, recrea la sombra florida de un emparrado de primavera. El pie en forma de tronco y la pantalla en forma de follaje borran la frontera entre el objeto útil y la escultura, como quería el Art Nouveau. Cuenta también la llegada de la electricidad a los hogares: la luz ya no es una llama que hay que vigilar, sino una fuente que se puede vestir de colores."""
histoire = """
El modelo Glicinia fue diseñado a principios del siglo XX por Clara Wolcott Driscoll, que dirigía en Tiffany el departamento de las mujeres encargadas de elegir y cortar el vidrio. Según el Cleveland Museum of Art, valió a Tiffany Studios un gran premio en la Exposición Internacional de Turín, en 1902. La versión presentada aquí, más pequeña que el modelo grande, es conocida con el nombre de «Pony». Estas lámparas, fabricadas a mano en series, eran objetos de lujo. Pasadas de moda tras la Primera Guerra Mundial, volvieron a ser muy buscadas a partir de los años sesenta. Esta fue legada al museo de Cleveland por el coleccionista Charles Maurer, fallecido en 2016."""
facture = """
Cada trozo de vidrio se elige por su color y su transparencia, se corta según una plantilla y se rodea de una fina cinta de cobre. Las piezas se ensamblan sobre un molde en forma de cúpula y se sueldan entre sí con estaño: esta técnica permite trozos mucho más pequeños y formas mucho más libres que el plomo de las vidrieras. El pie, de bronce fundido y patinado, se fabrica en los talleres de Tiffany. Los tonos pasan del azul profundo al blanco, como en un racimo real iluminado por el sol."""
details = [
  "Las raíces del pie, que se extienden sobre la base como sobre el suelo.",
  "Las ramas de bronce caladas, en la parte superior de la pantalla.",
  "El borde inferior recortado en puntas, al ritmo de los racimos.",
  "Las pocas hojas verdes ocultas entre las flores.",
]
themes = ["lámpara", "luz", "glicinia", "vidrio", "electricidad"]
anecdote = """
El papel de Clara Driscoll no se reveló hasta mediados de la década de 2000: unos historiadores encontraron sus cartas, que muestran que ella y su equipo de mujeres diseñaron buen número de lámparas atribuidas durante mucho tiempo al propio Louis Comfort Tiffany."""
salle = 3
mur = "nord"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "Silla"
artiste = "Hector Guimard"
annee = "hacia 1907"
image = "chaise-guimard.jpg"
licence = "CC0"
source = "https://www.clevelandart.org/art/1985.96"
technique = "Peral, cuero repujado, 108 × 45,4 × 50,4 cm"
collection = "Cleveland Museum of Art"
note = "Una silla donde la madera parece correr como la savia: la línea «en golpe de látigo» de Guimard."
description = """
La silla, de 1,08 metros de altura, está tallada en una madera rubia y cálida, el peral. Su respaldo, muy alto, está formado por dos montantes que se separan al subir y se reúnen en lo alto, como dos tallos en torno a una hoja. Entre ellos, un panel de cuero marrón en forma de escudo, con la punta hacia abajo, está fijado con una hilera de clavos dorados. Bajo el cuero, la madera se vacía en una larga hendidura puntiaguda. El asiento, tapizado de cuero, está bordeado también de clavos. En el cinturón, por delante, una pequeña escultura en relieve dibuja una voluta. Las patas, ligeramente arqueadas, se ensanchan abajo como pezuñas. Casi no se ve ningún ángulo recto ni ninguna juntura."""
evocation = """
Guimard quería muebles que no copiaran ningún estilo antiguo: ni Luis XV, ni Renacimiento, sino un lenguaje nacido de la observación de la naturaleza, no para representar sus flores, sino para recuperar sus fuerzas. Sus líneas se tensan, se estiran y se enroscan como tallos en crecimiento; se habla de línea «en golpe de látigo». La silla parece haber brotado de un solo impulso, pasando la madera del pie al respaldo sin ruptura. Expresa el ideal del arquitecto total: Guimard diseñaba para sus casas la fachada, las rejas, los papeles pintados, los tiradores y el mobiliario, para que todo hablara el mismo idioma."""
histoire = """
Hacia 1907, Guimard es un arquitecto reconocido: ha construido el Castel Béranger, edificio parisino premiado en el primer concurso de fachadas de la Ciudad de París, y ha diseñado las entradas del metro. Concibe también mobiliario para sus clientes y para sus propios interiores. Estos muebles, tallados a mano, costaban caros y se produjeron en pequeño número. Tras la Primera Guerra Mundial, el gusto cambia y el Art Nouveau se juzga pasado de moda, incluso ridículo; Guimard cae en el olvido. Sus muebles vuelven al mercado a partir de los años sesenta, cuando se redescubre el Art Nouveau. Esta silla fue comprada en 1985 por el Cleveland Museum of Art a un marchante neoyorquino."""
facture = """
El peral es una madera frutal densa, de grano fino, que se deja esculpir en todos los sentidos sin astillarse. Los montantes no están simplemente ensamblados: están esculpidos para que las uniones desaparezcan bajo transiciones fluidas. Las molduras se adelgazan y se ensanchan como músculos. El cuero, trabajado y claveteado, añade una nota cálida y suave. La influencia del arquitecto belga Victor Horta, cuyas obras Guimard descubre en Bruselas en 1895, se lee en esta manera de hacer de la propia estructura un ornamento."""
details = [
  "El panel de cuero en forma de escudo, bordeado de clavos dorados.",
  "La hendidura puntiaguda vaciada bajo el respaldo, como la nervadura de una hoja.",
  "La pequeña voluta esculpida en el cinturón del asiento.",
  "Las patas que se ensanchan en pezuña a ras del suelo.",
]
themes = ["mobiliario", "madera", "línea", "golpe de látigo", "París"]
anecdote = """
Guimard hacía de su nombre una marca: hizo editar postales de sus edificios bajo el título «Le Style Guimard». Sus detractores, por su parte, se burlaban del Art Nouveau llamándolo «style nouille» (estilo fideo)."""
salle = 4
mur = "ouest"
place = 2
largeur = 0.85

[[oeuvres]]
titre = "Sillón de los salones de té de Argyle Street"
artiste = "Charles Rennie Mackintosh"
annee = "1897"
image = "fauteuil-argyle-street.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/156437"
technique = "Roble teñido, relleno de crin moderno, 96,4 × 57,2 × 45,8 cm"
collection = "Art Institute of Chicago"
note = "Un sillón de salón de té, oscuro y severo, que dos medias lunas recortadas parecen hacer volar."
description = """
El sillón, de 96 centímetros de altura, está hecho de tablas de roble teñido de un marrón casi negro. El respaldo recto se compone de una ancha tabla llena en lo alto, bajo la cual unos montantes verticales dejan pasar la luz. Los reposabrazos descansan sobre dos costados macizos, como dos paneles, cada uno perforado por un recorte en forma de media luna, o de pájaro con las alas desplegadas. La parte inferior de los costados se hunde en arco. El asiento está tapizado con una tela verde moderna. Abajo, un doble travesaño horizontal une la parte delantera con la trasera. El conjunto es macizo y geométrico, casi sin ornamento: solo los recortes y algunas curvas suavizan el rigor de las líneas."""
evocation = """
En Glasgow, los salones de té eran lugares de moda, donde la gente se encontraba sin alcohol, en la época en que el movimiento de templanza combatía las tabernas. Kate Cranston, que los dirigía, quería decorados modernos que distinguieran sus establecimientos. Los recortes del sillón, que el Art Institute of Chicago compara con un pájaro en vuelo, muestran cómo Mackintosh hace nacer la poesía de una estructura casi arquitectónica. Frente a la silla de Guimard, toda curvas, este sillón muestra el otro rostro del Art Nouveau: el de la línea recta y la geometría, que anuncia el diseño del siglo XX."""
histoire = """
En 1897, Catherine Cranston, llamada Kate, abre un nuevo salón de té en Argyle Street, en el centro de Glasgow. Confía la decoración al diseñador George Walton y el mobiliario al joven arquitecto Charles Rennie Mackintosh, que acaba de pintar para ella unos frisos murales en su salón de Buchanan Street. Este sillón pertenece a ese conjunto: se ve uno semejante en una fotografía antigua de la sala del almuerzo. Se ignora cuántos ejemplares se fabricaron. Este permaneció en la familia de una empleada del establecimiento antes de ser donado al Art Institute of Chicago, en 2000, por Neville y John Bryan."""
facture = """
El sillón está construido en roble, una madera robusta, ensamblado con tablas y montantes rectos, sin molduras ni esculturas. Mackintosh lo hace teñir de un marrón muy oscuro, lo que unifica las superficies y subraya la silueta, como una sombra recortada. Trabaja por planos: los costados macizos, la tabla del respaldo, los vacíos entre los montantes. Los recortes en media luna juegan con la luz que los atraviesa. Se ha comparado esta sencillez con el movimiento inglés Arts and Crafts, apegado a los materiales francos, y con el arte japonés, que Mackintosh admiraba."""
details = [
  "Los dos recortes en media luna, como pájaros en vuelo, en los costados.",
  "Los montantes verticales del respaldo, entre los cuales pasa la luz.",
  "El doble travesaño bajo que une las patas.",
  "La parte inferior de los costados, que se hunde en arco.",
]
themes = ["mobiliario", "geometría", "Glasgow", "salón de té", "roble"]
anecdote = """
En 1900, Mackintosh y su esposa Margaret Macdonald son invitados a exponer en la Secesión vienesa. Su sala causa sensación y marca de forma duradera a Josef Hoffmann y Koloman Moser, que fundan tres años después los Wiener Werkstätte."""
