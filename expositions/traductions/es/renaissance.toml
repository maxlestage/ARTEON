[[oeuvres]]
titre = "La Virgen del jilguero"
artiste = "Raphaël"
annee = "hacia 1505–1506"
image = "vierge-chardonneret.jpg"
technique = "Óleo sobre tabla, 107 × 77 cm"
collection = "Galería de los Uffizi, Florencia"
note = "Pintada en Florencia para la boda de un amigo, rota por un derrumbe en 1548, restaurada en 2008."
description = """
La Virgen está sentada sobre una roca, en medio de una pradera, con un libro abierto en la mano izquierda. Vestida con un traje rojo y un manto azul, baja los ojos con dulzura hacia los dos niños de pie contra sus rodillas. A la izquierda, el pequeño san Juan Bautista, vestido con una piel de animal, con una escudilla en el cinto, sostiene entre las manos un jilguero que presenta al Niño Jesús. Este, de pie entre las piernas de su madre, con el pie apoyado sobre el de ella, tiende la mano para acariciar al pájaro. Detrás, un paisaje apacible se extiende hasta el horizonte: un puente, un río, árboles frágiles, una ciudad y montañas azuladas bajo un cielo nublado."""
evocation = """
Bajo la apariencia de una escena tierna y familiar, el cuadro anuncia la Pasión. El jilguero, que según la tradición se alimenta de cardos y espinas, era el emblema de la corona de espinas de Cristo; una leyenda contaba también que había recibido su mancha roja al pincharse en la frente de Cristo. El libro que sostiene María, el de las Escrituras, hace de ella el trono de la Sabiduría divina. Rafael retoma así un tema grave, pero lo envuelve en una armonía serena: miradas que se cruzan, gestos delicados, naturaleza apaciguada. Es la imagen misma del ideal de belleza y de equilibrio al que su nombre sigue asociado."""
histoire = """
Vasari cuenta que Rafael, establecido en Florencia, pintó este cuadro para su amigo Lorenzo Nasi, con ocasión de su boda. En 1548, un corrimiento de tierras derribó la casa de los Nasi, y la tabla se rompió en numerosos fragmentos. Fue pegada de inmediato, pero las grietas y los sucesivos repintes la desfiguraron poco a poco. Ingresada en las colecciones de los Médici, se conserva en los Uffizi. Una restauración de casi diez años, dirigida por el Opificio delle Pietre Dure de Florencia y concluida en 2008, consolidó la madera y devolvió al cuadro sus colores originales."""
facture = """
En Florencia, el joven Rafael estudia a Leonardo: le toma prestada la composición en pirámide, en la que las tres figuras se inscriben en un triángulo estable, y el modelado suavizado de los rostros. Pero conserva la claridad y la limpidez de su maestro Perugino. Los colores puros, rojo y azul, responden al verde de la pradera. La luz es pareja, el paisaje se aclara hacia el horizonte según la perspectiva aérea. Todo está regido por la mesura: los gestos se encadenan, las miradas unen las figuras y nada viene a turbar el equilibrio del conjunto."""
details = [
  "El jilguero, minúsculo, entre las manos de san Juan.",
  "El pie del Niño apoyado sobre el de su madre.",
  "La escudilla de san Juan, colgada de su cinto.",
  "El puente y la ciudad, en el paisaje a izquierda y derecha.",
  "Las finas líneas de fractura, todavía perceptibles de cerca.",
]
themes = ["virgen con el niño", "infancia", "pájaro", "paisaje", "armonía"]
anecdote = """
La restauración concluida en 2008 exigió una decena de años de trabajo, mucho más que el tiempo que Rafael pasó en Florencia, de 1504 a 1508. Liberado de sus barnices amarillentos, el cuadro ha recuperado un cielo y un manto de un azul intenso."""
