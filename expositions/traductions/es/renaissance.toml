[[oeuvres]]
titre = "La tempestad"
artiste = "Giorgione"
annee = "hacia 1506–1508"
image = "tempete.jpg"
technique = "Óleo sobre lienzo, 82 × 73 cm"
collection = "Gallerie dell'Accademia, Venecia"
note = "Una tormenta, un soldado, una madre que amamanta: el cuadro más enigmático del Renacimiento veneciano."
description = """
Un paisaje atravesado por un río ocupa todo el cuadro. A la izquierda, un joven con traje rojo y blanco, apoyado en una larga asta, mira hacia la derecha. Junto a él se alzan un muro bajo de ladrillos y dos tramos de columnas rotas. A la derecha, al otro lado del agua, una mujer casi desnuda, con una tela blanca sobre los hombros, está sentada en la hierba y amamanta a un niño; vuelve hacia nosotros una mirada grave. Entre ellos, un puente de madera salva el río y conduce a una ciudad de muros blancos, con una cúpula y torres. Encima, el cielo verde oscuro está desgarrado por un relámpago, señal de la tormenta que se acerca."""
evocation = """
Nadie sabe qué representa este cuadro, y quizá ese sea su tema. En él se ha visto a Adán y Eva tras la caída, una escena mitológica, una alegoría de la Fortuna, la Fuerza y la Caridad, o bien una meditación sobre la naturaleza todopoderosa. Las columnas rotas evocarían la fragilidad de las cosas humanas, el relámpago el poder divino. Para muchos historiadores, Giorgione inventa aquí un cuadro de poesía más que de historia: los personajes, aislados, sin diálogo, se funden en el paisaje, y es la atmósfera de la tormenta, la luz extraña que precede a la lluvia, lo que se convierte en el verdadero tema de la obra."""
histoire = """
La tempestad es una de las escasas obras atribuidas con certeza a Giorgione. En 1530, el erudito veneciano Marcantonio Michiel la describe en la casa del patricio Gabriele Vendramin, uno de los grandes coleccionistas de Venecia, como un pequeño paisaje sobre lienzo con la tormenta, una gitana y un soldado. El cuadro había sido sin duda pintado para un aficionado refinado, capaz de saborear su enigma. Pasó después por varias colecciones venecianas, en particular la de los príncipes Giovanelli, a quienes el Estado italiano lo compró en 1932 para las Gallerie dell'Accademia de Venecia, donde se expone desde entonces."""
facture = """
Giorgione pinta al óleo, directamente sobre el lienzo, sin dibujo preparatorio riguroso: compone y corrige pintando. Los colores, aplicados en capas transparentes, se funden unos en otros y crean una atmósfera húmeda y vibrante. El verde profundo del cielo, el relámpago blanco y los follajes dorados por la última luz construyen el espacio mejor que una perspectiva geométrica. Esta pintura por el color y la luz, el colorito veneciano, se opone al disegno florentino y será desarrollada por Tiziano."""
details = [
  "El relámpago, casi en el centro del cielo, sobre la ciudad.",
  "Las dos columnas rotas sobre su basa, detrás del joven.",
  "La mirada de la mujer, vuelta hacia el espectador.",
  "El pequeño pájaro blanco sobre el tejado de una casa, a la derecha.",
]
themes = ["paisaje", "tormenta", "enigma", "naturaleza", "venecia"]
anecdote = """
Una radiografía reveló que, en lugar del joven, Giorgione había pintado primero a una mujer desnuda sentada a la orilla del agua, quizá bañándose. Este arrepentimiento muestra que improvisaba su tema durante el trabajo."""
