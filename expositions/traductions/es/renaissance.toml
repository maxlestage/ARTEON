[[oeuvres]]
titre = "La Virgen con el Niño y dos ángeles"
artiste = "Filippo Lippi"
annee = "hacia 1460–1465"
image = "vierge-deux-anges.jpg"
technique = "Temple sobre tabla, 95 × 63,5 cm"
collection = "Galería de los Uffizi, Florencia"
note = "Apodada «la Lippina»: una Virgen como una joven florentina elegante, ante una ventana abierta a un paisaje."
description = """
La Virgen está sentada de perfil, con las manos juntas, en un sillón del que solo se ve el brazo esculpido en volutas, en primer plano. Lleva un vestido azul oscuro y un tocado sabio de velos transparentes y cintas, salpicado de perlas. Ante ella, dos ángeles, del segundo de los cuales solo se ve el rostro, sostienen al Niño Jesús, que tiende los brazos hacia su madre. El ángel del primer plano se vuelve hacia nosotros con una amplia sonrisa de niño travieso. Toda la escena está enmarcada por una ventana de piedra gris, pintada en trampantojo como un verdadero marco. Detrás, un vasto paisaje de colinas, rocas y ríos se extiende hasta una ciudad lejana, bajo un cielo pálido."""
evocation = """
Lippi acerca lo divino a la vida cotidiana. Su Virgen ya no es un icono lejano sobre fondo de oro, sino una mujer joven y real, a la moda de Florencia, cuyo peinado y perfil evocan los retratos de damas de la época. Una antigua tradición, recogida por Vasari, quiere que tenga los rasgos de Lucrezia Buti, la religiosa a quien el pintor, monje él mismo, raptó en Prato y que le dio un hijo, el pintor Filippino Lippi; nada permite probarlo. El ángel que sonríe al espectador crea una complicidad nueva: nos invita a entrar en la escena. El paisaje abierto, por último, dice la curiosidad del Quattrocento por el mundo visible, que la pintura quiere en adelante mostrar tal como es."""
histoire = """
La tabla data de la madurez de Lippi, a comienzos de los años 1460, cuando el monje carmelita trabaja sobre todo en Prato, donde pinta los frescos del coro de la catedral. Se ignora para quién fue ejecutada: su formato mediano sugiere una obra de devoción privada, destinada a una morada más que a una iglesia. El cuadro tuvo un éxito inmediato en el taller: su discípulo Sandro Botticelli retomó la composición, casi trazo por trazo, en varias Vírgenes de juventud. Conservado en las colecciones de los grandes duques de Toscana, fue trasladado a los Uffizi a finales del siglo XVIII desde la villa del Poggio Imperiale. Es hoy una de las imágenes más reproducidas del museo."""
facture = """
Lippi pinta al temple, con finas pinceladas superpuestas, lo que da a los rostros una suavidad nacarada. Recuerda a Masaccio, a quien había visto pintar en el convento del Carmine, por el volumen de los cuerpos, pero añade una línea flexible y graciosa que se transmitirá a Botticelli. La ventana pintada, que hace de marco, es una invención notable: separa el espacio del espectador del del cuadro. El paisaje, con sus rocas en agujas y sus lejanías azuladas, se inspira quizá en la pintura flamenca, muy admirada en Florencia."""
details = [
  "El velo transparente y las perlas del tocado de la Virgen.",
  "El ángel que sonríe mirando al espectador, en primer plano.",
  "El brazo en volutas del sillón, abajo a la izquierda.",
  "El marco de piedra gris, enteramente pintado en trampantojo.",
  "La ciudad y las rocas en agujas del paisaje, detrás de la Virgen.",
]
themes = ["virgen con el niño", "ángeles", "paisaje", "devoción", "elegancia"]
anecdote = """
Monje indisciplinado, Lippi fue sacado varias veces de apuros por Cosme de Médici, su protector. Vasari cuenta que Cosme lo encerró un día en su palacio para que terminara un encargo, y que el pintor se escapó descolgándose por la ventana con unas sábanas anudadas."""
salle = 2
mur = "ouest"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "El díptico de los duques de Urbino"
artiste = "Piero della Francesca"
annee = "hacia 1465–1475"
image = "ducs-urbino.jpg"
technique = "Temple y óleo sobre tabla, dos tablas de 47 × 33 cm"
collection = "Galería de los Uffizi, Florencia"
note = "Battista Sforza y Federico da Montefeltro, frente a frente y de perfil, sobre las colinas de su ducado."
description = """
Dos tablas se miran de frente. A la izquierda, Battista Sforza, condesa de Urbino, se ve de perfil, con la tez muy pálida, los cabellos rubios trenzados y enrollados en cintas blancas, bajo un velo y una pequeña diadema de perlas. Lleva un vestido negro de manga de brocado de oro y un collar de perlas. A la derecha, su esposo Federico da Montefeltro le responde, también de perfil, con vestido y gorro de un rojo deslumbrante, la nariz marcada por una profunda muesca. Detrás de ellos se extiende un mismo paisaje, visto desde muy alto: colinas, campos, ciudades fortificadas, un lago por el que se deslizan barcas, hasta las montañas azuladas del horizonte. Los dos rostros se recortan nítidamente sobre el cielo."""
evocation = """
El perfil, heredado de las medallas antiguas, hace de estos retratos imágenes oficiales, casi monedas: celebra el poder, la dignidad y la memoria de la pareja más que su intimidad. El paisaje común que corre de una tabla a otra dice la unión de los esposos y su dominio sobre el territorio de Urbino. A menudo se ha pensado que el retrato de Battista, muerta muy joven en 1472 tras haber dado un hijo a Federico, es póstumo, lo que explicaría su palidez de cera. El duque, célebre condotiero y gran humanista, se muestra como hombre de guerra y de saber: el díptico es el retrato de una corte que hacía de Urbino uno de los focos más refinados del Renacimiento."""
histoire = """
Piero della Francesca trabajó en varias ocasiones para Federico da Montefeltro, señor y luego duque de Urbino, cuyo palacio reunía artistas, matemáticos y letrados. El díptico fue sin duda pintado hacia la muerte de Battista Sforza, en 1472; la fecha sigue discutida. En el reverso, Piero pintó los triunfos de los dos esposos, sobre carros tirados por caballos blancos y unicornios, acompañados de inscripciones latinas en su gloria. Las tablas, quizá unidas originalmente por bisagras, permanecieron en Urbino hasta 1631: a la extinción de la familia della Rovere, heredera de los Montefeltro, pasaron a Florencia con la herencia de Vittoria della Rovere, esposa del gran duque Fernando II de Médici."""
facture = """
Piero, matemático tanto como pintor, construye sus figuras como volúmenes puros: el cuello de Battista es una columna, el gorro de Federico un cilindro. La luz clara y pareja, sin sombras dramáticas, baña los rostros y el paisaje con una misma serenidad. El paisaje, minucioso y lejano, recuerda a los pintores flamencos, cuyas obras se apreciaban en la corte de Urbino; Piero emplea además el óleo, técnica llegada del Norte, para las veladuras. La perspectiva aérea, que azulea y aclara las lejanías, da una profundidad inmensa a estas pequeñas tablas."""
details = [
  "La nariz aguileña y entallada de Federico, y su boca apretada.",
  "El lunar y las arrugas de la mejilla del duque, pintados sin complacencia.",
  "El peinado de Battista, trenzado con cintas blancas y salpicado de pedrería.",
  "Las barcas minúsculas sobre el lago, detrás de Federico.",
  "Las ciudades fortificadas y las torres, asentadas sobre las colinas.",
]
themes = ["retrato", "perfil", "poder", "pareja", "paisaje", "perspectiva"]
anecdote = """
Federico es representado siempre de perfil izquierdo: en un torneo había perdido el ojo derecho, y la lanza le había entallado también la nariz. Se dice que después hizo recortar el caballete de su nariz para ampliar su campo de visión."""
salle = 2
mur = "ouest"
place = 4
largeur = 1.5

[[oeuvres]]
titre = "El Cristo muerto"
artiste = "Andrea Mantegna"
annee = "hacia 1480"
image = "christ-mort.jpg"
technique = "Temple sobre lienzo, 68 × 81 cm"
collection = "Pinacoteca de Brera, Milán"
note = "El cuerpo de Cristo visto desde sus pies: uno de los escorzos más impresionantes de la pintura."
description = """
El cuerpo de Cristo, tendido sobre una losa de mármol rosa, se ve desde los pies, como si el espectador se hallara al extremo de la mesa. Las plantas de los pies, atravesadas por los clavos, están en primer plano; el cuerpo se alarga luego hacia lo alto del cuadro, cubierto por un sudario de pliegues profundos, hasta la cabeza caída sobre un cojín. Las manos, colocadas a lo largo del cuerpo, muestran también sus heridas. A la izquierda, apretados en un rincón, tres personajes lloran: la Virgen anciana que se enjuga los ojos con un pañuelo, san Juan con las manos juntas y, casi fuera del marco, María Magdalena. A la derecha, un pequeño vaso de ungüento recuerda los perfumes del embalsamamiento. La estancia es oscura y desnuda."""
evocation = """
Mantegna coloca al espectador lo más cerca posible de la muerte, casi contra el cadáver. Ni paisaje, ni ángeles, ni gloria: solo un cuerpo pesado, lívido, presentado en su materialidad. Este punto de vista nos hace testigos del duelo, junto a los plañideros, e invita a meditar sobre las heridas y el sacrificio de Cristo, como hacían las devociones de la época. El contraste entre la contención del cuerpo y el dolor de los rostros deformados por las lágrimas es impresionante. Los historiadores ven también en él una demostración: el pintor, apasionado de la perspectiva y de la escultura antigua, prueba que puede representar el cuerpo humano desde el ángulo más difícil que existe."""
histoire = """
La fecha de este cuadro se debate, entre los años 1470 y el final de la vida del pintor. Parece que permaneció en el taller de Mantegna, en Mantua, donde era pintor de la corte de los Gonzaga. A su muerte, en 1506, sus hijos lo encontraron entre sus bienes y lo ofrecieron a la venta; fue adquirido poco después por el cardenal Segismundo de Gonzaga. Tras un largo recorrido por colecciones privadas, ingresó en 1824 en la Pinacoteca de Brera, el gran museo de Milán creado en la época napoleónica, donde es hoy una de las obras más célebres. Su destino primero sigue siendo desconocido; su pequeño formato sugiere un cuadro de meditación privada."""
facture = """
Mantegna pinta al temple sobre un lienzo fino, en una gama casi monocroma de grises, rosas apagados y pardos, que da al cuerpo el color de la piedra. El sudario, de pliegues cavados como en mármol, delata su admiración por la escultura. El escorzo no es matemáticamente exacto: los pies son más pequeños de lo que deberían y la cabeza más grande, pues una perspectiva rigurosa habría ocultado el busto tras enormes pies. Mantegna corrige la óptica para que la mirada recorra todo el cuerpo, hasta el rostro."""
details = [
  "Los agujeros de los clavos en las plantas de los pies y en el dorso de las manos.",
  "El rostro de la Virgen, arrugado y torcido por las lágrimas, a la izquierda.",
  "El vaso de ungüento colocado sobre la losa, arriba a la derecha.",
  "Los pliegues del sudario, esculpidos como en mármol.",
]
themes = ["pasión", "muerte", "duelo", "perspectiva", "escorzo"]
anecdote = """
Los pies de Cristo son voluntariamente demasiado pequeños. Si Mantegna hubiera aplicado exactamente las leyes de la perspectiva que tan bien dominaba, habrían ocultado una gran parte del cuerpo: el pintor sacrificó la exactitud a la emoción."""
salle = 2
mur = "ouest"
place = 6
largeur = 1.15

[[oeuvres]]
titre = "La Primavera"
artiste = "Sandro Botticelli"
annee = "hacia 1480"
image = "printemps.jpg"
technique = "Temple sobre tabla, 207 × 319 cm"
collection = "Galería de los Uffizi, Florencia"
note = "En un bosque de naranjos, Venus acoge el regreso de la primavera: un cuadro mitológico profano, algo raro en Florencia."
description = """
Nueve figuras se alinean sobre una pradera sembrada de flores, ante un bosquecillo de naranjos cargados de frutos. En el centro, algo retrasada, Venus, vestida de blanco y rojo, levanta la mano en un gesto de bienvenida; sobre ella, Cupido, con los ojos vendados, dispara una flecha. A la derecha, Céfiro, el viento de la primavera, azul e hinchado, atrapa a la ninfa Cloris, de cuya boca salen flores; a su lado, Flora, coronada y vestida con un traje bordado de flores, las esparce a manos llenas. A la izquierda, las tres Gracias bailan cogidas de las manos, entre velos transparentes, y Mercurio, con la espada al cinto, aleja las nubes con su caduceo."""
evocation = """
El sentido exacto del cuadro sigue siendo uno de los grandes enigmas de la historia del arte. Se lee en él primero el ciclo de la estación: de derecha a izquierda, el viento de marzo fecunda la tierra, que se cubre de flores, bajo el reinado de Venus. Los historiadores han propuesto fuentes literarias, como los Fastos de Ovidio, donde Cloris se convierte en Flora, y los poemas de Poliziano, amigo de los Médici. También se ha visto una alegoría neoplatónica, inspirada en Marsilio Ficino, en la que el amor terrenal se eleva hacia el amor espiritual, o bien un homenaje a un matrimonio. Las naranjas, los mala medica, evocarían a los propios Médici. El cuadro celebra la belleza, el amor y el renacer de la naturaleza."""
histoire = """
La Primavera se menciona en 1499 en el inventario del palacio florentino de Lorenzo di Pierfrancesco de Médici, primo de Lorenzo el Magnífico, para quien fue sin duda pintada; se ha propuesto vincularla con su matrimonio, en 1482. A mediados del siglo XVI, Vasari la vio, junto con el Nacimiento de Venus, en la villa medicea de Castello. El cuadro, olvidado como su autor durante siglos, fue redescubierto en el siglo XIX, cuando Botticelli fascinó a los prerrafaelitas ingleses. Tras pasar por la Galería de la Academia, se expone en los Uffizi desde 1919. Una restauración, concluida en 1982, le devolvió sus colores claros bajo barnices ennegrecidos."""
facture = """
Botticelli pinta al temple sobre grandes tablas de álamo ensambladas. El fondo oscuro del bosquecillo hace resaltar los cuerpos claros, alineados como en un friso, sin profundidad real: el pintor prefiere el ritmo de las siluetas a la perspectiva. Todo descansa en la línea: contornos nítidos, velos transparentes de pliegues ondulantes, cabellos sueltos, cuerpos alargados y ligeros que apenas parecen tocar el suelo. La pradera es una alfombra de flores pintadas una a una, con la precisión de un herbario, en el espíritu de los tapices de millefleurs."""
details = [
  "Las flores que salen de la boca de Cloris, perseguida por Céfiro.",
  "Cupido, con los ojos vendados, que apunta a una de las tres Gracias.",
  "El vestido de Flora, bordado de aciano, rosas y margaritas.",
  "Mercurio, a la izquierda, que aparta las nubes con su caduceo.",
  "Las naranjas doradas del bosquecillo, sobre las figuras.",
]
themes = ["mitología", "primavera", "amor", "flores", "médici", "danza"]
anecdote = """
Unos botánicos han examinado la pradera del cuadro flor por flor: han reconocido en ella varias decenas de especies reales del campo toscano en primavera, entre ellas lirios, acianos, nomeolvides y fresas."""
salle = 3
mur = "nord"
place = 2
largeur = 3.2

[[oeuvres]]
titre = "El nacimiento de Venus"
artiste = "Sandro Botticelli"
annee = "hacia 1484–1486"
image = "naissance-de-venus.jpg"
technique = "Temple sobre lienzo, 172,5 × 278,5 cm"
collection = "Galería de los Uffizi, Florencia"
note = "Empujada por los vientos, la diosa nacida de la espuma llega a la orilla sobre una concha: la belleza pagana vuelve a la pintura."
description = """
En el centro, Venus, desnuda, de pie sobre una gran concha de vieira, se desliza sobre el mar hacia la orilla. Se cubre el pecho con una mano y el sexo con su larga cabellera pelirroja, que el viento levanta. A la izquierda, Céfiro, el viento del oeste, enlazado a una figura femenina, sin duda la brisa Aura, sopla para empujar la concha; unas rosas caen a su alrededor. A la derecha, en la orilla arbolada, una joven vestida con un traje blanco sembrado de acianos, una Hora, diosa de las estaciones, avanza para cubrir a la diosa con un manto rosa bordado de flores. El mar, rayado de pequeñas olas en V, se extiende hasta el horizonte, bajo un cielo pálido."""
evocation = """
El cuadro ilustra el mito antiguo del nacimiento de Venus, salida de la espuma del mar, tal como lo cantaban Hesíodo y luego Poliziano en sus Stanze. Es una de las primeras grandes imágenes de desnudo femenino desde la Antigüedad, y una de las primeras obras mitológicas de este tamaño en Florencia. En el espíritu de los humanistas neoplatónicos en torno a los Médici, se ha visto en ella el nacimiento de la belleza ideal, reflejo de la belleza divina, que eleva el alma. Venus conserva la pose púdica de las estatuas antiguas que Botticelli pudo ver, pero su rostro melancólico y lejano le da una gracia irreal, casi espiritual."""
histoire = """
No se conoce con certeza al comitente: como en el caso de la Primavera, se piensa en un miembro de la rama menor de los Médici, quizá Lorenzo di Pierfrancesco. Vasari describe los dos cuadros a mediados del siglo XVI en la villa medicea de Castello, cerca de Florencia. El Nacimiento de Venus ingresó en los Uffizi en 1815. Juzgado durante mucho tiempo manierista y olvidado, Botticelli fue redescubierto en el siglo XIX por los críticos y los pintores ingleses, y esta Venus se convirtió en una de las imágenes más célebres del mundo. Ha seguido ocupando el corazón de la sala Botticelli de los Uffizi, de la que es hoy la obra más contemplada."""
facture = """
Botticelli pinta sobre lienzo, soporte todavía raro en Florencia para una obra de esta dimensión, con un temple claro y magro que da a la superficie un aspecto mate. Realza con oro los cabellos de Venus, las hojas de los naranjos y las alas de los vientos. La composición es casi simétrica, organizada en torno a la diosa. El dibujo domina: contornos fluidos, olas reducidas a un motivo decorativo, cuerpos alargados con desprecio de la anatomía. El largo cuello de Venus y su hombro caído son imposibles, pero crean esa línea ondulante que constituye toda la gracia de la figura."""
details = [
  "Los reflejos de oro en la cabellera de Venus.",
  "Las rosas que caen en torno a los vientos, a la izquierda.",
  "Las pequeñas olas en forma de V, como un motivo de tela.",
  "El manto rosa bordado de margaritas que tiende la Hora, a la derecha.",
  "Los juncos, abajo a la izquierda, y el borde dorado de la concha.",
]
themes = ["mitología", "venus", "belleza", "desnudo", "mar", "antigüedad"]
anecdote = """
Una tenaz leyenda quiere que Venus tenga los rasgos de Simonetta Vespucci, la bella genovesa admirada en Florencia, muerta en 1476. Ningún documento lo prueba, y el cuadro fue pintado cerca de diez años después de su desaparición."""
salle = 3
mur = "est"
place = 2
largeur = 2.78

[[oeuvres]]
titre = "La Anunciación"
artiste = "Léonard de Vinci"
annee = "hacia 1472–1476"
image = "annonciation.jpg"
technique = "Óleo y temple sobre tabla, 98 × 217 cm"
collection = "Galería de los Uffizi, Florencia"
note = "Una de las primeras obras de Leonardo, pintada hacia los veinte años en el taller de Verrocchio."
description = """
La escena transcurre en un jardín, ante una villa toscana. A la izquierda, el ángel Gabriel, arrodillado en la hierba florida, con un lirio en la mano, levanta dos dedos para bendecir y anunciar a María que llevará en su seno al hijo de Dios. A la derecha, la Virgen está sentada ante el ángulo de la casa, de sillares de esquina en relieve. Interrumpe su lectura, con la mano derecha apoyada sobre un libro abierto, y levanta la mano izquierda en señal de sorpresa. El libro reposa sobre un atril de mármol ricamente esculpido. Entre las dos figuras, un muro bajo abre la vista a una hilera de cipreses y de árboles oscuros y luego a una lejanía de puerto, montañas y agua, anegada en bruma azul."""
evocation = """
La Anunciación, tema muy frecuente, se convierte en el joven Leonardo en un encuentro sereno y solemne. El lirio del ángel dice la pureza de María; es también el emblema de Florencia. El jardín cerrado, separado del mundo por un muro bajo, recuerda el hortus conclusus, imagen tradicional de la virginidad. El gesto de María, mezcla de asombro y de aceptación, traduce el momento del diálogo evangélico. Pero lo que más llama la atención es el lugar concedido a la naturaleza: la pradera florida, los árboles, el paisaje brumoso del fondo testimonian ya la curiosidad de Leonardo por el mundo real, la botánica y la atmósfera."""
histoire = """
El cuadro procede de la iglesia de San Bartolomeo a Monteoliveto, cerca de Florencia. Fue pintado en el taller de Andrea del Verrocchio, donde se formó Leonardo, sin duda con la participación de otros miembros del taller; el atril se inspira directamente en la tumba de Piero y Giovanni de Médici, esculpida por Verrocchio para la iglesia de San Lorenzo. Ingresó en los Uffizi en 1867 y entonces se atribuía a Domenico Ghirlandaio. Solo tras largas discusiones los historiadores lo reconocieron como una obra de juventud de Leonardo, atribución hoy ampliamente admitida. Los Uffizi conservan también el Bautismo de Cristo de Verrocchio, en el que el joven Leonardo pintó uno de los ángeles."""
facture = """
Leonardo mezcla temple y óleo, lo que le permite pasajes más suaves. Los pliegues de los vestidos, de una amplitud escultórica, recuerdan los estudios de ropajes que pintaba sobre tela de lino, a partir de tejidos empapados en arcilla. Al fondo, la perspectiva atmosférica, que difumina las montañas en un velo azulado, anuncia su manera futura. Ciertas torpezas delatan la juventud del pintor: el brazo derecho de María, demasiado largo, y la relación incierta entre la Virgen, el atril y el edificio, que se han explicado por un cuadro concebido para ser visto de soslayo, desde la derecha."""
details = [
  "El lirio blanco que sostiene el ángel, emblema de pureza y de Florencia.",
  "El atril de mármol, esculpido con motivos inspirados en la Antigüedad.",
  "Las flores de la pradera, pintadas una a una.",
  "El puerto y las montañas, en la bruma azul, en el centro del cuadro.",
]
themes = ["anunciación", "ángel", "virgen", "jardín", "paisaje", "perspectiva"]
anecdote = """
Las alas del ángel, pintadas por Leonardo a partir de alas de ave reales, fueron alargadas más tarde por otra mano, de forma más torpe: todavía se distingue el retoque."""
salle = 3
mur = "sud"
place = 2
