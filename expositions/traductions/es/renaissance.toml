[[artistes]]
nom = "Filippo Lippi"
vie = "Florencia, hacia 1406 – Spoleto, 1469"
biographie = """
Huérfano, Filippo Lippi es confiado de niño al convento de los carmelitas de Santa Maria del Carmine, en Florencia, donde pronuncia sus votos en 1421. Allí ve a Masaccio pintar los frescos de la capilla Brancacci, que deciden su vocación. Monje poco hecho para la vida religiosa, obtiene la protección de Cosme de Médici, que le confía encargos y lo saca de varios apuros. Pinta retablos, Vírgenes y Anunciaciones para las iglesias y las familias de Florencia. En 1452 se instala en Prato para pintar los frescos del coro de la catedral, dedicados a san Esteban y a san Juan Bautista. Allí rapta a Lucrezia Buti, una joven religiosa; de su unión nace en 1457 Filippino Lippi, que será también un gran pintor. El escándalo es inmenso, pero la intervención de los Médici le evita lo peor. Forma en su taller al joven Sandro Botticelli. En 1467 parte a Spoleto, donde decora el ábside de la catedral; muere allí en 1469, y Lorenzo el Magnífico le hará erigir un monumento funerario."""
style = """
Lippi enlaza la gravedad de Masaccio con la gracia de la segunda mitad del siglo. Humaniza las figuras sagradas: sus Vírgenes son jóvenes florentinas de peinados elegantes, sus ángeles niños traviesos. Sus líneas flexibles, sus velos transparentes, sus paisajes abiertos tras ventanas pintadas se reconocen a primera vista. A través de Botticelli, su discípulo, y de su hijo Filippino, su manera graciosa marcó profundamente la pintura florentina."""

[[artistes]]
nom = "Piero della Francesca"
vie = "Borgo San Sepolcro (Toscana), hacia 1415-1420 – Borgo San Sepolcro, 12 de octubre de 1492"
biographie = """
Hijo de un mercader de Borgo San Sepolcro, pequeña ciudad del alto valle del Tíber, Piero della Francesca se forma como pintor y estudia matemáticas. En 1439 trabaja en Florencia junto a Domenico Veneziano, y descubre el arte de Masaccio, de Brunelleschi y la perspectiva. Lleva después una carrera itinerante, al servicio de las cortes de Italia central: Ferrara, Rímini con Segismundo Malatesta, Roma y, sobre todo, Urbino, donde Federico da Montefeltro lo acoge en varias ocasiones. Su gran obra maestra es el ciclo de frescos de la Leyenda de la Vera Cruz, en la iglesia de San Francesco de Arezzo, pintado en los años 1450-1460. Pinta también la Flagelación de Urbino, el Bautismo de Cristo de Londres y el retablo de Brera, donde figura Federico arrodillado. Siempre ligado a su ciudad natal, donde ejerce cargos públicos, consagra sus últimos años a la escritura de tratados eruditos sobre aritmética, perspectiva y cuerpos geométricos. Muere en 1492, el mismo día en que Cristóbal Colón alcanza América."""
style = """
Piero construye sus cuadros como demostraciones: perspectiva rigurosa, figuras reducidas a volúmenes simples, proporciones calculadas. Una luz clara y serena, sin sombras violentas, baña sus escenas con una inmovilidad solemne. Sus personajes, de rostros impasibles, parecen fuera del tiempo. Olvidado durante mucho tiempo, fue redescubierto en el siglo XX, y pintores modernos, de Seurat a los metafísicos italianos, admiraron su geometría silenciosa."""

[[artistes]]
nom = "Andrea Mantegna"
vie = "Isola di Carturo (Véneto), hacia 1431 – Mantua, 13 de septiembre de 1506"
biographie = """
Nacido cerca de Padua, Andrea Mantegna entra muy joven en el taller del pintor Francesco Squarcione, que lo adopta y lo forma al contacto con su colección de antigüedades. Padua, ciudad universitaria donde trabajaron Giotto y Donatello, es entonces un foco del humanismo. Todavía adolescente, Mantegna pinta los frescos de la capilla Ovetari en la iglesia de los Eremitani, casi enteramente destruidos por un bombardeo en 1944. En 1453 se casa con Nicolosia, hija del pintor veneciano Jacopo Bellini y hermana de Giovanni Bellini, sobre quien ejerce una fuerte influencia. En 1460 se convierte en pintor de la corte de los Gonzaga en Mantua, puesto que ocupa hasta su muerte. Pinta allí la célebre Cámara de los Esposos del palacio ducal, concluida en 1474, cuyo techo se abre en trampantojo al cielo, y luego la gran serie de los Triunfos de César, hoy en Hampton Court. Coleccionista de antigüedades, grabador innovador, trabaja también para Isabel de Este, esposa del marqués Francisco II de Gonzaga. Muere en Mantua en 1506."""
style = """
Mantegna es el pintor de la piedra y de la Antigüedad: sus figuras tienen la dureza de las estatuas, sus arquitecturas y sus trajes se reconstruyen con una precisión de arqueólogo. Lleva la perspectiva hasta los puntos de vista más audaces, techos vistos desde abajo y cuerpos en escorzo. Su dibujo incisivo, sus colores fríos y sus grabados, difundidos por toda Europa, marcaron a Bellini y a Durero."""

[[artistes]]
nom = "Sandro Botticelli"
vie = "Florencia, hacia 1445 – Florencia, 17 de mayo de 1510"
biographie = """
Alessandro Filipepi, hijo de un curtidor florentino, debe su apodo de Botticelli, barrilito, a uno de sus hermanos mayores. Tras un probable aprendizaje con un orfebre, entra a comienzos de los años 1460 en el taller de Filippo Lippi y luego frecuenta el de Verrocchio. Abre su propio taller hacia 1470 y se convierte en el pintor favorito del círculo de los Médici y de los humanistas que los rodean. En 1481-1482, el papa Sixto IV lo llama a Roma con otros maestros para pintar los muros de la Capilla Sixtina. De regreso en Florencia, pinta sus grandes composiciones mitológicas, la Primavera y el Nacimiento de Venus, y numerosas Vírgenes en tondo. En los años 1490, Florencia se ve conmocionada por los sermones del dominico Savonarola; la pintura de Botticelli se vuelve más austera y atormentada, como en la Calumnia de Apeles o la Natividad mística. Realiza también una serie de dibujos para la Divina Comedia de Dante. Pasado de moda al final de su vida, muere en 1510. No será realmente redescubierto hasta el siglo XIX."""
style = """
Botticelli es ante todo un dibujante: la línea, flexible y nerviosa, define las formas, anima los velos y las cabelleras levantadas por el viento. Sus figuras, alargadas y ligeras, de rostro melancólico, parecen flotar más que andar. Prefiere el ritmo decorativo a la perspectiva y la poesía a la verosimilitud. Olvidado durante tres siglos, fascinó a los prerrafaelitas y al Art Nouveau, y su Venus se ha convertido en un icono universal de la belleza."""

[[artistes]]
nom = "Léonard de Vinci"
vie = "Vinci (Toscana), 15 de abril de 1452 – Amboise, 2 de mayo de 1519"
biographie = """
Hijo ilegítimo de un notario, Leonardo crece en Vinci, cerca de Florencia, y entra a finales de los años 1460 en el taller de Andrea del Verrocchio, pintor, escultor y orfebre. Aprende allí todas las técnicas y pinta sus primeras obras, entre ellas la Anunciación. Hacia 1482 parte a Milán, al servicio de Ludovico Sforza, como ingeniero, organizador de fiestas y pintor: realiza allí la Virgen de las rocas y la Última Cena, en el convento de Santa Maria delle Grazie. Tras la caída de Ludovico, en 1499, lleva una vida itinerante entre Venecia, Florencia, donde comienza la Gioconda, Milán y Roma. Llena miles de páginas de cuadernos, escritos de derecha a izquierda, sobre anatomía, el vuelo de las aves, el agua, la óptica y las máquinas. En 1516, el rey Francisco I lo invita a Francia y lo instala en el castillo del Clos Lucé, cerca del castillo de Amboise, donde muere en 1519. Deja muy pocos cuadros acabados, pero una reputación de genio universal."""
style = """
Leonardo quiere pintar la naturaleza tal como la ve el ojo. Inventa el sfumato, un modelado fundido, sin contornos, que envuelve las formas en una sombra suave, y la perspectiva aérea, que azulea y difumina las lejanías. Sus composiciones en pirámide, sus figuras captadas en un movimiento del alma y sus paisajes brumosos fueron imitados por Rafael y por toda la generación siguiente."""

[[artistes]]
nom = "Michel-Ange"
vie = "Caprese (Toscana), 6 de marzo de 1475 – Roma, 18 de febrero de 1564"
biographie = """
Michelangelo Buonarroti, hijo de un magistrado florentino, entra en 1488 en el taller del pintor Domenico Ghirlandaio y luego frecuenta el jardín de esculturas de los Médici, donde Lorenzo el Magnífico lo distingue. En Roma esculpe la Piedad de San Pedro, concluida en 1499; en Florencia, de 1501 a 1504, el David, símbolo de la República. Es entonces cuando pinta para Agnolo Doni el único cuadro sobre tabla acabado que se le atribuye sin reservas. En 1508, el papa Julio II le encarga el techo de la Capilla Sixtina, que pinta casi solo hasta 1512. Trabaja después en la tumba de Julio II, en el Moisés, en la capilla funeraria de los Médici en San Lorenzo. De regreso en Roma, pinta el Juicio Final en el muro del altar de la Sixtina, concluido en 1541, y se convierte luego en arquitecto de la basílica de San Pedro, cuya cúpula diseña. Poeta, escribe también sonetos. Muere en Roma a casi ochenta y nueve años; su cuerpo es devuelto a Florencia."""
style = """
Escultor ante todo, Miguel Ángel hace del cuerpo humano, sobre todo desnudo y masculino, el medio de expresar todas las pasiones. Sus figuras, poderosas, retorcidas, a menudo inacabadas en escultura, parecen luchar contra la materia. En pintura, aplica colores vivos y cambiantes sobre formas escultóricas. Su terribilità, esa fuerza grandiosa e inquieta, abrió el camino al manierismo y al arte barroco."""

[[artistes]]
nom = "Raphaël"
vie = "Urbino, 1483 – Roma, 6 de abril de 1520"
biographie = """
Raffaello Sanzio es hijo de Giovanni Santi, pintor y poeta de la corte de Urbino, que muere cuando el niño tiene once años. El joven se forma después con Perugino, cuya manera asimila tan bien que a veces se confunden sus obras. De 1504 a 1508 vive sobre todo en Florencia, donde descubre a Leonardo y a Miguel Ángel y pinta una serie de Vírgenes con el Niño, entre ellas la Virgen del jilguero. En 1508, el papa Julio II lo llama a Roma para decorar sus apartamentos del Vaticano: las Estancias, con la Escuela de Atenas, figuran entre las cumbres del Renacimiento. Bajo León X, dirige un taller muy numeroso, dibuja los cartones de los tapices de la Sixtina, es nombrado arquitecto de San Pedro y encargado de levantar los monumentos de la Roma antigua. Pinta también retratos, como el de Baldassare Castiglione. Muere de forma repentina a los treinta y siete años; es enterrado en el Panteón."""
style = """
Rafael hizo la síntesis de su tiempo: la dulzura de Leonardo, la fuerza de Miguel Ángel, la claridad de Perugino. Sus composiciones, de equilibrio perfecto, sus figuras graciosas y sus colores límpidos encarnan el ideal clásico. Durante más de tres siglos, las academias de toda Europa lo tuvieron por el modelo absoluto del gran pintor, antes de que los prerrafaelitas lo rechazaran."""

[[artistes]]
nom = "Giorgione"
vie = "Castelfranco Véneto, hacia 1477-1478 – Venecia, 1510"
biographie = """
Se sabe muy poco de Giorgio da Castelfranco, apodado Giorgione, el gran Giorgio. Nacido en una pequeña ciudad de la tierra firme veneciana, se forma probablemente en Venecia en el entorno de Giovanni Bellini. Trabaja sobre todo para un círculo de patricios cultivados, aficionados a la música, a la poesía y a los cuadros de pequeño formato, de temas a veces enigmáticos. Se le atribuye con certeza un número muy reducido de obras: el retablo de Castelfranco, la Tempestad, los Tres filósofos de Viena, el retrato de Laura. En 1508 pinta con el joven Tiziano los frescos de la fachada del Fondaco dei Tedeschi, el almacén de los mercaderes alemanes en Venecia, de los que solo quedan fragmentos. Muere de peste en otoño de 1510, a los treinta años aproximadamente. Varios de sus cuadros inacabados son terminados por Tiziano, como la Venus dormida de Dresde, de modo que la frontera entre sus dos obras sigue discutida."""
style = """
Giorgione transformó la pintura veneciana en unos pocos años. Pinta directamente al óleo, sin dibujo previo, y deja que el color y la luz modelen las formas. Sus personajes soñadores se funden en paisajes cargados de atmósfera, donde la emoción cuenta más que la historia narrada. Sus cuadros de poesía, sin tema evidente, abrieron el camino a Tiziano y al paisaje moderno."""

[[artistes]]
nom = "Titien"
vie = "Pieve di Cadore (Véneto), hacia 1488-1490 – Venecia, 27 de agosto de 1576"
biographie = """
Tiziano Vecellio nace en las montañas del Cadore y llega de niño a Venecia. Se forma con Giovanni Bellini y luego trabaja junto a Giorgione, de quien concluye varias obras tras su muerte en 1510. En 1518, la gigantesca Asunción de la iglesia de los Frari lo convierte en el primer pintor de Venecia. Pinta después para las cortes de Italia, los Este de Ferrara, los Gonzaga de Mantua, los della Rovere de Urbino, y luego para el emperador Carlos V, que lo hace conde palatino en 1533 y caballero, y para su hijo Felipe II de España, a quien envía sus grandes mitologías, las poesías. Retratista solicitado por papas y príncipes, dirige un taller activo durante más de sesenta años. En sus últimos años, su pintura se vuelve cada vez más libre, casi informe, hecha de toques empastados aplicados a veces con el dedo. Muere en Venecia en 1576, durante una epidemia de peste; es enterrado en los Frari."""
style = """
Tiziano es el maestro del color. Construye sus cuadros por capas sucesivas de óleo, en veladuras transparentes y toques espesos, y hace nacer las formas de la luz más que del dibujo. Sus desnudos dorados, sus retratos penetrantes y sus mitologías sensuales fijaron durante siglos los modelos del género. Rubens, Velázquez, Rembrandt, y luego Delacroix y Manet se midieron todos con él."""
