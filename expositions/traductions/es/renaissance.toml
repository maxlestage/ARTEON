[exposition]
ordre = 20
nom_court = "Renacimiento"
mouvement = "Renacimiento italiano"
cadre = "dore"
couleur = "#7a2e2e"
titre = "El Renacimiento italiano, la invención del hombre"
artiste = "Botticelli, Leonardo, Rafael, Miguel Ángel, Tiziano…"
dates = "1460–1538"
accroche = "Exposición virtual · Galería de los Uffizi, Florencia"
introduction = """
En el siglo XV, Florencia redescubre la Antigüedad, inventa la perspectiva y coloca al hombre en el centro del cuadro; un siglo más tarde, Roma y Venecia llevan esta revolución a su cumbre. De Filippo Lippi a Tiziano, diez pinturas cuentan este paso, desde las madonas del Quattrocento hasta los desnudos venecianos. El edificio se inspira en la Galería de los Uffizi de Vasari: un largo corredor en U bordeado de salas, la sala Botticelli, la Tribuna roja de los Médici y el pequeño corredor que bordea el Arno."""
vitrine = "naissance-de-venus.jpg"

[musee]
nom = "Galería de los Uffizi"
ville = "Florencia, Italia"
architecte = "Giorgio Vasari"
construction = "1560–1581"
presentation = """
En 1560, Cosme I de Médici encarga a Giorgio Vasari la construcción, entre el Palazzo Vecchio y el Arno, de un edificio para las oficinas, los uffizi, de las magistraturas de Florencia. Concluido en 1581 por Alfonso Parigi y Bernardo Buontalenti, el edificio dibuja una U muy alargada en torno a una plaza estrecha abierta al río, bordeada por un pórtico de pietra serena, la piedra gris de la Toscana. En 1565, Vasari lo une al palacio Pitti mediante un corredor que cruza el Arno por el Ponte Vecchio. Desde 1581, Francisco I de Médici instala en el último piso una galería de antigüedades y cuadros, y manda construir a Buontalenti la Tribuna, sala octogonal bajo una cúpula incrustada de nácar. En 1737, Ana María Luisa, la última de los Médici, lega las colecciones a Florencia con la condición de que nunca salgan de ella. Abierta al público en el siglo XVIII, la galería presenta hoy una de las más ricas colecciones de pintura italiana: Giotto, Botticelli, Leonardo, Miguel Ángel, Rafael, Tiziano."""
ici = """
El edificio de ARTEON retoma la U de los Uffizi. Se entra por el sur en la sala de la gran escalera y luego se sube hacia el norte por «El primer corredor · El Quattrocento», de veinticuatro metros de largo. En su flanco este se abren la sala Botticelli, cuadrada, y luego la Tribuna, más pequeña y más alta, cuyos muros rojos recuerdan el estuche del tesoro de los Médici. Al final, el corredor sobre el Arno, de treinta metros de largo, atraviesa el edificio de este a oeste y conduce a la última sala, «El corredor oeste · Venecia», que desciende hacia el sur entre Giorgione y Tiziano."""

