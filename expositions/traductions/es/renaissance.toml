[[oeuvres]]
titre = "El Tondo Doni (La Sagrada Familia)"
artiste = "Michel-Ange"
annee = "hacia 1505–1507"
image = "tondo-doni.jpg"
technique = "Temple y óleo sobre tabla, diámetro 120 cm"
collection = "Galería de los Uffizi, Florencia"
note = "La única pintura sobre tabla acabada que se atribuye sin discusión a Miguel Ángel, pintada para un rico mercader florentino."
description = """
En un cuadro redondo, la Sagrada Familia forma un bloque compacto en primer plano. La Virgen, sentada en el suelo, con las piernas dobladas bajo un vestido azul, se vuelve en una poderosa torsión para recoger al Niño que le tiende san José, sentado tras ella, barbudo y calvo. Los brazos musculosos de María, sus anchos hombros, su vestido rosa de pliegues tensos hacen de ella una figura casi heroica. Tras un muro bajo, el pequeño san Juan Bautista, vestido con una piel de animal, alza los ojos hacia el grupo. Al fondo, sobre un hemiciclo de piedra, cinco jóvenes desnudos, sentados o de pie, descansan o se abrazan, ante un paisaje de colinas y lago."""
evocation = """
El cuadro superpone varias edades de la historia de la salvación, según una lectura a menudo propuesta: al fondo, los desnudos figuran a la humanidad pagana, anterior a la Ley; san Juan, en el límite, es el último profeta; en primer plano, la Sagrada Familia abre el tiempo de la gracia. El Niño, sostenido por encima de la cabeza de María, parece evocar también su destino futuro. Miguel Ángel, escultor ante todo, impone una visión nueva: cuerpos monumentales, en movimiento, que expresan la fuerza más que la dulzura. Los desnudos del fondo, sin justificación narrativa evidente, anuncian los Ignudi que pintará poco después en el techo de la Capilla Sixtina."""
histoire = """
El cuadro fue encargado por Agnolo Doni, rico mercader de paños florentino, quizá con ocasión de su matrimonio con Maddalena Strozzi, en 1504, o del nacimiento de su hija, en 1507. Los tondi, cuadros redondos, eran entonces objetos de devoción apreciados en las moradas privadas. Miguel Ángel lo pintó en Florencia, entre la conclusión del David y su partida a Roma. La tabla ha conservado su marco original, de madera esculpida y dorada, sin duda diseñado por el propio artista, adornado con cabezas en relieve y con las lunas crecientes de las armas de los Strozzi. Pasado después a las colecciones de los Médici, es hoy una de las joyas de los Uffizi."""
facture = """
Miguel Ángel pinta como esculpe: las figuras, delimitadas por un contorno nítido, tienen la dureza del mármol. Aplica colores vivos y ácidos, rosa, naranja, azul claro, verde, en superficies lisas, con reflejos cambiantes, los cangianti, que modelan los volúmenes en lugar de fundirlos en la sombra. Estamos lejos del sfumato de Leonardo. La composición en espiral, inscrita en el círculo, da al grupo un movimiento ascendente. Esta paleta y estos cuerpos retorcidos inspirarán directamente a los pintores manieristas, Pontormo y Rosso Fiorentino."""
details = [
  "La torsión de la Virgen, que se vuelve para tomar al Niño.",
  "El pequeño san Juan, tras el muro bajo, a la derecha.",
  "Los jóvenes desnudos del fondo, sentados sobre un muro de piedra.",
  "Los colores cambiantes del vestido rosa y del manto naranja de José.",
]
themes = ["sagrada familia", "cuerpo", "escultura", "tondo", "desnudo"]
anecdote = """
Según Vasari, Agnolo Doni encontró demasiado elevado el precio de setenta ducados que pedía Miguel Ángel. El pintor retiró entonces el cuadro y exigió el doble; el mercader, que quería su tondo, acabó pagando ciento cuarenta ducados."""
