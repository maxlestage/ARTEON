[[oeuvres]]
titre = "La Venus de Urbino"
artiste = "Titien"
annee = "1538"
image = "venus-urbino.jpg"
technique = "Óleo sobre lienzo, 119 × 165 cm"
collection = "Galería de los Uffizi, Florencia"
note = "Una joven desnuda, tendida sobre un lecho, mira al espectador: el modelo del desnudo recostado durante siglos."
description = """
Una joven rubia yace desnuda sobre un lecho deshecho, de sábanas blancas, colocado sobre un colchón rojo. Apoyada en dos almohadas, sostiene un ramillete de rosas en la mano derecha y coloca la izquierda sobre su vientre. Vuelve la cabeza hacia nosotros y nos mira con franqueza. A sus pies, un perrito pelirrojo y blanco duerme hecho un ovillo. La mitad izquierda de la estancia está cerrada por una cortina verde oscuro; a la derecha, una sala más clara, pavimentada con losas, se abre al fondo a una ventana en la que se ve un árbol en maceta y el cielo del atardecer. Dos criadas rebuscan allí en un arcón nupcial para sacar vestidos."""
evocation = """
Nada indica realmente que se trate de la diosa: ni Cupido, ni atributo mitológico, solo las rosas y el mirto de la ventana, plantas de Venus. La mujer se encuentra en una rica morada veneciana, en el momento íntimo del aseo. Muchos historiadores leen el cuadro como una imagen del matrimonio: el arcón nupcial, el perro, símbolo de fidelidad, las rosas del amor. Otros ven en él ante todo una pintura sensual destinada al placer de un príncipe. La mirada directa, a la vez tranquila y provocadora, constituye toda la modernidad de la obra: el espectador ya no es un mirón oculto, sino que es mirado. Manet lo recordará para su Olympia."""
histoire = """
El cuadro fue comprado a Tiziano en 1538 por Guidobaldo della Rovere, hijo del duque de Urbino, que lo designa en su correspondencia simplemente como la mujer desnuda; se convirtió en duque de Urbino ese mismo año. La obra permaneció en Urbino y luego en Pésaro en las colecciones de los della Rovere hasta 1631: llegó entonces a Florencia con la herencia de Vittoria della Rovere, esposa del gran duque Fernando II de Médici, como el díptico de Piero della Francesca. Expuesta más tarde en la Tribuna de los Uffizi, admirada, copiada y a veces criticada por su desnudez, es uno de los cuadros más célebres del museo."""
facture = """
Tiziano retoma la pose de la Venus dormida de Giorgione, conservada en Dresde, que él mismo había concluido tras la muerte de su mayor; pero despierta la figura y la traslada a un interior. El cuerpo, modelado con pasajes de luz dorada casi sin contorno, se destaca sobre el blanco de las sábanas y el verde oscuro de la cortina. La composición queda cortada en dos por el borde de la cortina, que cae sobre el sexo de la mujer. Los rojos del colchón y del vestido de la criada, que se responden, equilibran el conjunto: el color construye el cuadro."""
details = [
  "El perrito dormido a los pies del lecho.",
  "El ramillete de rosas en la mano derecha de la joven.",
  "Al fondo, la criada arrodillada, con la cabeza hundida en el arcón nupcial.",
  "La maceta de mirto colocada en el alféizar de la ventana.",
  "El anillo en el meñique de la mano izquierda.",
]
themes = ["desnudo", "venus", "matrimonio", "intimidad", "sensualidad", "venecia"]
anecdote = """
De visita en los Uffizi, el escritor estadounidense Mark Twain quedó escandalizado por este cuadro: en su relato de viaje A Tramp Abroad, de 1880, lo califica de la imagen más obscena del mundo, observando que ningún escritor se atrevería a describir con palabras lo que todos los visitantes acuden a contemplar."""
