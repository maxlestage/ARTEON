[[oeuvres]]
titre = "Armadura de Enrique II, rey de Francia"
artiste = "Armuriers de la cour de France"
annee = "hacia 1555"
image = "armure-henri-ii.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Armor_of_Henry_II,_King_of_France_(reigned_1547–59)_MET_DP256970.jpg"
technique = "Acero repujado, pavonado, dorado y plateado, cuero, tela; altura 188 cm, 24,2 kg"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una armadura de gala cubierta de relieves de oro y plata, hecha para el rey que murió de un lanzazo en un torneo."
description = """
La armadura se alza erguida, completa, desde la cresta del casco hasta los escarpes que cubren \
los pies. El casco cerrado, coronado por una cresta cincelada, solo deja una estrecha rendija para \
los ojos. Toda la superficie, desde el peto hasta las grebas, está cubierta de un decorado en \
relieve: roleos de follaje, figuras y animales, en los que el oro y la plata alternan con \
el fondo de acero oscuro. En el centro del peto, un guerrero a la antigua recibe las armas \
que le tienden dos mujeres arrodilladas. En las hombreras, Apolo persigue a la \
ninfa Dafne y, en otro lugar, triunfa sobre la serpiente Pitón, a la que acaba de matar. Láminas \
de acero articuladas cubren los brazos, los muslos y los pies; un cinturón de cuero \
rojo y una falda de terciopelo carmesí, bajo la cintura, completan la presentación."""
evocation = """
Una armadura así no estaba hecha para la batalla, donde los relieves habrían atrapado \
los golpes en lugar de hacerlos resbalar: es una armadura de gala, para lucir en las \
entradas solemnes, los desfiles y las fiestas de corte. Convierte al rey en un héroe \
antiguo, semejante al guerrero romano del peto, y coloca su reinado bajo el signo \
de Apolo, dios de la luz y de las artes. La media luna, emblema personal \
de Enrique II, reaparece en varios puntos del decorado; a menudo se la ha relacionado con Diana \
de Poitiers, la favorita del rey, cuya homónima, la diosa, lleva la media luna. A través del \
acero cincelado, la corte de Francia exhibe el gusto renacentista por la Antigüedad y \
la mitología, y rivaliza en magnificencia con el emperador Carlos V."""
histoire = """
La armadura fue realizada hacia 1555 para Enrique II (1519–1559), hijo de Francisco I y rey \
de Francia desde 1547. Su decoración se basa en dibujos de artistas al servicio de la \
corte: el Metropolitan Museum atribuye una parte al pintor Jean Cousin el Viejo y \
quizá al iluminador Baptiste Pellerin; durante mucho tiempo se la atribuyó al orfebre y \
grabador Étienne Delaune, de quien se conservan proyectos de armaduras muy próximos. El \
metal se repujaba después, se cincelaba y se doraba y plateaba. Al rey le gustaban las justas: \
el 30 de junio de 1559, durante un torneo celebrado en París para festejar la paz de \
Cateau-Cambrésis y unas bodas principescas, la lanza rota del capitán de Montgomery \
penetra bajo su visera; el rey muere diez días más tarde. La armadura ingresó en el \
Metropolitan Museum en 1939."""
facture = """
El decorado está trabajado a repujado: el armero martillea la plancha de acero por el reverso \
para hacer sobresalir las figuras, y luego el cincelador precisa los contornos por el anverso. El \
relieve es poco marcado, para que las placas conserven su solidez y las \
articulaciones jueguen libremente. El fondo se pavonó, lo que lo oscurece, y después los \
relieves recibieron el oro y la plata, que se responden bajo la luz como los colores \
de una pintura. Unos dibujos de la corte, conservados en el Met y en otros museos, \
muestran cómo un mismo proyecto pasaba del papel al acero."""
details = [
  "La media luna, emblema de Enrique II, deslizada en varios puntos del decorado.",
  "En el centro del peto, el guerrero a la antigua y las dos mujeres arrodilladas.",
  "Las hombreras, donde Apolo persigue a la ninfa Dafne.",
  "La cresta cincelada del casco y la estrecha rendija de la visera.",
  "Las láminas articuladas de los escarpes, que se ajustan a la forma del pie.",
]
themes = ["renacimiento", "gala", "mitología", "rey", "orfebrería"]
anecdote = """
Enrique II murió a causa de un accidente de torneo, y no en la guerra. Su viuda, Catalina de \
Médici, hizo demoler después el palacio de las Tournelles, junto al cual se había celebrado \
la justa; la plaza de los Vosgos ocupa hoy una parte de su terreno."""
salle = 1
mur = "nord"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Armadura de George Clifford, conde de Cumberland"
artiste = "Ateliers royaux de Greenwich"
annee = "1586"
image = "armure-clifford.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Armor_Garniture_of_George_Clifford_(1558–1605),_Third_Earl_of_Cumberland_MET_DT259974.jpg"
technique = "Acero grabado al aguafuerte y dorado, cuero, tela; altura 176,5 cm, 27,2 kg"
collection = "Metropolitan Museum of Art, Nueva York"
note = "La guarnición mejor conservada de los talleres reales de Greenwich, hecha para el campeón de la reina Isabel I."
description = """
La armadura está montada en pie sobre un pedestal de madera. El acero, casi negro, está recorrido por \
anchas bandas doradas que descienden del cuello a los pies, como los galones de una prenda. En \
esas bandas, una cinta se entrelaza en lazos regulares en torno a rosas, flores de lis \
y una cifra formada por dos E espalda con espalda. El peto abombado desciende en punta sobre el \
vientre, según la moda de los jubones de la época, llamada «en vaina de guisante». El casco \
cerrado, perforado por orificios de respiración, lleva una visera avanzada en forma de pico. Bajo \
la cintura asoma la tela roja del traje que se lleva debajo. Guanteletes, quijotes, \
rodilleras y escarpes articulados completan el conjunto, cuya silueta esbelta \
es la de un cortesano tanto como la de un guerrero."""
evocation = """
El decorado es una declaración de lealtad. Las rosas son las de los Tudor, las flores \
de lis recuerdan la pretensión de los reyes de Inglaterra al trono de Francia, y las dos E \
espalda con espalda forman la cifra de Isabel I. Llevar esta armadura era presentarse \
como servidor y caballero de la reina. Habla también de la cultura del torneo en la \
corte isabelina: cada año, el 17 de noviembre, aniversario de su ascensión al trono, \
la reina asistía a justas en las que los cortesanos rivalizaban en divisas, trajes \
y cumplidos. En ese teatro caballeresco, en una época en que las armas de fuego \
dominaban ya los campos de batalla, la armadura era un traje de escena tanto \
como una protección."""
histoire = """
Enrique VIII había instalado hacia 1515, en su palacio de Greenwich, cerca de Londres, un \
taller de armeros llegados de Alemania, para rivalizar con los talleres de Milán y \
de Augsburgo. En 1586, bajo la dirección del maestro armero Jacob Halder, el taller \
realiza para George Clifford (1558–1605), tercer conde de Cumberland, una \
guarnición: una armadura completada con piezas de recambio que permitían adaptarla a \
la guerra o a los diversos juegos del torneo. Marino y corsario, Clifford dirige varias \
expediciones contra España y en 1590 se convierte en el campeón de la reina en las justas. El \
dibujo de su armadura figura en un álbum de finales del siglo XVI consagrado a las armaduras \
de Greenwich, hoy en el Victoria and Albert Museum. El Metropolitan Museum \
la adquiere en 1932."""
facture = """
Las armaduras de Greenwich se reconocen por sus formas amplias y nítidas y por sus \
decorados grabados más que repujados. Las bandas ornamentales se grabaron \
al aguafuerte: se protege el acero con un barniz, se traza el dibujo con la punta y luego un \
ácido socava las líneas descubiertas; el oro se aplica después sobre esas bandas. El \
contraste entre el acero oscuro y el oro da a la armadura el aire de una prenda bordada. \
Las piezas de recambio, en gran parte conservadas, se fijaban a la armadura con \
remaches, correas y ganchos."""
details = [
  "Las dos E espalda con espalda, cifra de la reina Isabel I, atrapadas en los entrelazados dorados.",
  "Las rosas de los Tudor y las flores de lis que alternan a lo largo de las bandas.",
  "El peto en punta, a la moda de los jubones isabelinos.",
  "Los orificios de respiración practicados en la visera del casco.",
  "La tela roja que asoma bajo la cintura, entre las placas.",
]
themes = ["torneo", "isabelino", "inglaterra", "caballería", "grabado"]
anecdote = """
Una miniatura de Nicholas Hilliard muestra a George Clifford como campeón de la reina, vestido \
con una armadura semejante: lleva prendido en el sombrero un guante, prenda que le habría \
entregado Isabel I."""
salle = 1
mur = "nord"
place = 5
largeur = 1.4

[[oeuvres]]
titre = "Casco de tipo corintio"
artiste = "Grèce archaïque"
annee = "hacia 650–600 a. C."
image = "casque-corinthien.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Bronze_helmet_of_Corinthian_type_MET_DP119913.jpg"
technique = "Bronce martillado, 23 × 26,8 × 21,2 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El casco de los hoplitas griegos, batido en una sola lámina de bronce: cubre toda la cabeza y solo deja ver los ojos y la boca."
description = """
El casco, de veintitrés centímetros de alto y visto aquí de tres cuartos, tiene la forma de una \
campana de bronce que envuelve el cráneo, las mejillas y la nuca. Su superficie, cubierta \
de una pátina verde moteada de marrón, conserva por zonas el brillo del metal. En el frente, \
dos amplias aberturas para los ojos están separadas por un nasal, una lengüeta que \
protege la nariz. Las carrilleras descienden hasta el mentón y dejan entre ellas una \
rendija vertical para la boca. En la parte posterior, el borde se alza ligeramente para despejar \
la nuca. Una hilera de pequeños orificios recorre los bordes: servían para coser \
un forro de cuero o de fieltro, que hacía el casco soportable y amortiguaba los \
golpes."""
evocation = """
El casco corintio es la imagen misma del guerrero griego. Cubre el rostro con una máscara \
de metal impasible, que vuelve anónimo y temible al combatiente. Pero también aísla: \
se oye mal y se ve poco por los lados, lo que conviene al hoplita, soldado de infantería \
que combate hombro con hombro en la falange, con su escudo redondo protegiendo en \
parte a su vecino. El soldado-ciudadano pagaba él mismo su equipo: un casco así \
señala a un hombre de cierta holgura. Los pintores de vasos y los escultores lo \
convirtieron en el atributo de los héroes y de Atenea, a menudo representados con el casco alzado sobre \
la frente, el rostro descubierto, como si tras la máscara pudiera verse al guerrero en \
reposo."""
histoire = """
El tipo aparece hacia el 700 a. C., sin duda en la región de Corinto, de donde le viene su \
nombre, ya empleado por el historiador Heródoto en el siglo V a. C. Este casco, fechado en la \
segunda mitad del siglo VII, pertenece a las primeras generaciones del modelo, que \
evolucionará después hacia formas más abombadas. Durante dos siglos, equipa a los \
hoplitas de numerosas ciudades griegas. Tras una batalla, los vencedores consagraban \
a menudo las armas tomadas al enemigo en los grandes santuarios: cientos de \
cascos se han hallado así en Olimpia. Este ingresó en el Metropolitan Museum en \
1920, adquirido gracias al fondo Rogers, que lleva el nombre de un donante que había legado al museo una \
fortuna destinada a compras."""
facture = """
El casco fue batido a martillo a partir de una única plancha de bronce, aleación de \
cobre y estaño, sin soldadura: un tour de force, pues hay que estirar el metal en la \
parte superior dejándolo más grueso en los bordes, sin llegar nunca a rajarlo. El armero \
trabajaba sobre una horma, recalentando regularmente el metal para evitar que se \
volviera quebradizo. Los bordes se perforaron después para el forro. En origen, el \
bronce pulido tenía el color del oro; la pátina verde es fruto de la corrosión a lo \
largo de los siglos."""
details = [
  "El nasal, estrecha lengüeta de metal entre los dos ojos.",
  "La rendija vertical entre las carrilleras, a la altura de la boca.",
  "La hilera de pequeños orificios a lo largo de los bordes, para coser el forro.",
  "El borde posterior ligeramente alzado, que despeja la nuca.",
  "Las manchas marrones donde el bronce aparece bajo la pátina verde.",
]
themes = ["grecia", "hoplita", "bronce", "antigüedad", "casco"]
anecdote = """
Los escultores griegos representaban a menudo a los estrategos tocados con un casco \
corintio alzado sobre la frente. Así aparece Pericles en las copias \
romanas de su retrato por Cresilas, conservadas en particular en el British Museum y en el \
Vaticano."""
salle = 2
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Casco de Sutton Hoo"
artiste = "Royaume d'Est-Anglie"
annee = "principios del siglo VII"
image = "casque-sutton-hoo.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Sutton_Hoo_helmet_2016.png"
technique = "Hierro, bronce estañado, bronce dorado, plata, granates; altura 31,8 cm"
collection = "British Museum, Londres"
note = "Hallado aplastado en cientos de fragmentos en una tumba-barco, el casco de un rey anglosajón, reconstruido en 1970-1971."
description = """
El casco, visto de frente sobre un fondo negro, envuelve toda la cabeza. Una máscara de metal \
cubre el rostro: se distinguen cejas, nariz, boca y bigote en \
relieve, en torno a dos órbitas vacías. Las cejas, guarnecidas de hilos de plata y de \
pequeños granates, terminan en las sienes en cabezas de jabalí doradas. Una cresta \
de metal recorre la cima del cráneo, de la frente a la nuca, y cada uno de sus extremos \
lleva una cabeza de dragón. En la calota y en las anchas carrilleras, placas de \
bronce, hoy oscurecidas y lagunosas, portaban escenas estampadas. Entre los \
fragmentos originales, se han rellenado las partes ausentes para devolver al casco su \
forma completa."""
evocation = """
El rostro de metal confiere a su portador una presencia casi sobrenatural. La nariz, el \
bigote y las cejas forman en conjunto un pájaro o un dragón en vuelo, con las alas \
desplegadas, cuya cabeza viene a unirse a la de la cresta: un animal protector posado \
sobre el rostro. Los jabalíes eran, en el mundo germánico, símbolos de fuerza \
y de protección guerrera; el poema Beowulf menciona, por cierto, cascos adornados con \
jabalíes. Las escenas estampadas, guerreros danzantes y jinete que abate a un enemigo, \
vinculan el casco a un mundo de héroes, y quizá de dioses. Los cascos hallados \
en las tumbas de Vendel y de Valsgärde, en Suecia, muestran decoraciones muy próximas \
y hablan de los lazos entre las dos orillas del mar del Norte."""
histoire = """
En 1939, en Sutton Hoo, en Suffolk, el arqueólogo Basil Brown excava para la \
propietaria de la finca, Edith Pretty, el mayor de los túmulos. Allí descubre la \
huella de una nave de unos veintisiete metros, cuya madera había desaparecido, y una \
cámara funeraria llena de objetos preciosos. Se suele ver en ella la tumba de \
Rædwald, rey de Estanglia muerto hacia 624, aunque sin certeza. El casco, oxidado y aplastado \
por el derrumbe de la cámara, queda reducido a varios cientos de fragmentos. Edith \
Pretty ofrece todo el tesoro al British Museum. Una primera reconstrucción, \
realizada en 1945-1946, es rehecha por completo en 1970-1971 por Nigel Williams: es \
la que se ve hoy."""
facture = """
La calota de hierro estaba recubierta de placas de bronce estañado, es decir, de aspecto plateado, \
estampadas con matrices: se presionaba la fina lámina sobre un relieve para \
imprimir en ella una escena, repetida varias veces. Unas varillas de bronce dorado separaban esos \
paneles. Las cejas incrustadas de hilos de plata, los granates engastados y las cabezas de \
jabalí doradas atestiguan una destreza de orfebre, la misma que produjo las \
hebillas y los broches de oro y granates de la misma tumba. La reconstrucción de \
1970-1971 recolocó cada fragmento en función de los motivos estampados y de las huellas de \
corrosión."""
details = [
  "Las pequeñas cabezas de jabalí doradas en el extremo de las cejas.",
  "Los hilos de plata incrustados en las cejas, junto a los granates.",
  "El bigote y la boca en relieve, bajo la nariz de la máscara.",
  "La cabeza de dragón en el extremo de la cresta, por encima de la frente.",
  "Los fragmentos oscurecidos de las placas estampadas, sobre la calota.",
]
themes = ["anglosajón", "tumba", "arqueología", "rey", "alta edad media"]
anecdote = """
Los granates de una de las dos cejas no llevan lámina de oro en el reverso, de modo que \
ese ojo brilla menos que el otro. Algunos arqueólogos han visto en ello una alusión a Odín, el \
dios tuerto de los pueblos germánicos; la hipótesis sigue discutida."""
salle = 2
mur = "ouest"
place = 2
largeur = 0.85

[[oeuvres]]
titre = "Armadura ō-yoroi, llamada de Ashikaga Takauji"
artiste = "Japon, époque de Kamakura"
annee = "principios del siglo XIV"
image = "o-yoroi.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Armor_(Yoroi)_MET_DT784.jpg"
technique = "Hierro, laca, cuero, seda, cobre dorado; altura 95,3 cm, 11,8 kg"
collection = "Metropolitan Museum of Art, Nueva York"
note = "La gran armadura de los jinetes arqueros del Japón medieval, que la tradición atribuye al fundador del shogunato Ashikaga."
description = """
La armadura se presenta sobre un soporte, sin figura humana. Arriba, el casco, una calota \
de hierro de placas remachadas, lleva dos grandes cuernos de cobre dorado en forma de V, los \
kuwagata, y un amplio cubrenuca acampanado, hecho de hileras de láminas, cuyos bordes \
se vuelven a cada lado del rostro. Debajo, la coraza forma una especie de \
caja: su frente está tensado con un cuero estampado de motivos, en el que se distingue una figura. \
Unas placas cubiertas del mismo cuero protegen la parte alta del pecho. La parte baja de la armadura \
es una falda de varios paños, hecha de hileras de pequeñas láminas lacadas, unidas \
entre sí por cordones de seda cuyos colores, crema, marrón, anaranjado y verde, se han \
desvaído con el tiempo."""
evocation = """
La ō-yoroi, la «gran armadura», es la de los guerreros de alto rango que combatían \
a caballo, con el arco en la mano, en los siglos XII, XIII y XIV. Su forma de caja, sus \
grandes placas y su cuero liso sobre el pecho responden a ese combate: la cuerda del \
arco debía deslizarse sin engancharse. Pero es también un signo de rango, por su coste \
y por la riqueza de sus cordonaduras, cuyos colores podían distinguir a un guerrero \
en el campo de batalla. Los grandes cuernos del casco eran una insignia y no una \
defensa. A través de este tipo de armadura, Japón fijó la imagen del samurái de los relatos \
épicos como el Cantar de Heike, donde los guerreros se nombran antes de combatir."""
histoire = """
Según una tradición recogida por el Metropolitan Museum, esta armadura habría pertenecido \
a Ashikaga Takauji (1305–1358), quien contribuyó en 1333 a derribar el shogunato de \
Kamakura y fundó después el shogunato Ashikaga, y la habría ofrecido al santuario de \
Shinomura Hachimangū, cerca de Kioto. Ningún documento permite confirmarlo, y se \
sabe poco de su historia antes de su adquisición por Bashford Dean, primer \
conservador de armas y armaduras del Metropolitan Museum, quien la donó al museo en \
1914. Es una de las pocas armaduras japonesas de esa época conservadas fuera de \
Japón, y el museo le dedicó en 1989 un estudio en su revista científica."""
facture = """
Una armadura japonesa de este tipo no está hecha de grandes placas forjadas, como en \
Europa, sino de cientos de pequeñas láminas de hierro y de cuero endurecido, perforadas con \
orificios, lacadas para resistir la humedad y ensambladas luego en hileras mediante cordonaduras \
de seda, el odoshi. El conjunto es flexible y relativamente ligero, pero lento de fabricar \
y de mantener. El cuero del pecho se decoró con plantilla. El casco, hecho de \
placas remachadas en radios, es obra de un herrero especializado, y los adornos de \
cobre dorado, de cinceladores."""
details = [
  "Los dos cuernos dorados en V del casco, los kuwagata.",
  "El amplio cubrenuca de láminas, vuelto a cada lado del rostro.",
  "El cuero estampado de la coraza, donde aparece una figura.",
  "Las hileras de láminas lacadas de la falda, sujetas por cordones de seda.",
  "Los colores desvaídos de las cordonaduras, del crema al verde.",
]
themes = ["japón", "samurái", "laca", "seda", "jinete"]
anecdote = """
Bashford Dean, quien hizo ingresar esta armadura en el Met, era en origen un especialista en \
peces, profesor de zoología en la Universidad de Columbia. Fue a la vez conservador \
de reptiles y peces en el Museo Americano de Historia Natural y conservador \
de armaduras en el Met."""
salle = 3
