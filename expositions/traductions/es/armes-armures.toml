[[oeuvres]]
titre = "Casco turbante"
artiste = "Empire ottoman"
annee = "finales del siglo XV – siglo XVI"
image = "casque-turban.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Turban_Helmet_MET_DP147136.jpg"
technique = "Acero, hierro, plata, oro; altura 30,2 cm, diámetro 22,9 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un casco bulboso de acanaladuras en espiral, que imitan los pliegues de un turbante; inscripciones árabes recorren sus bandas doradas."
description = """
El casco, de treinta centímetros de alto, tiene la forma de un bulbo coronado por una alta \
punta. Su parte central, de acero oscuro, está surcada de acanaladuras que giran en \
espiral, como los pliegues de una tela enrollada. Dos bandas doradas la enmarcan, arriba \
en torno a la punta y abajo sobre el borde. Llevan grandes letras \
árabes incrustadas de plata, que se destacan sobre un fondo de oro finamente grabado. El borde \
inferior está recortado con dos escotaduras redondeadas para los ojos, a uno y otro lado \
de un soporte vertical destinado a un nasal. Pequeñas anillas, a lo largo del borde, \
sujetaban una cofia de malla que protegía el cuello. Dos motivos dorados en forma de \
hoja adornan la parte acanalada."""
evocation = """
El nombre de «casco turbante», dado por los historiadores modernos, viene de su gran \
tamaño y de sus acanaladuras, que imitan los pliegues de un turbante; se ha pensado que se \
llevaba sobre un gorro grueso o un turbante. El guerrero exhibe así, hasta en \
su armadura, el tocado de la vida civil y la palabra escrita. Las inscripciones, en \
árabe, mezclan según los cascos fórmulas de bendición, versículos del Corán y \
los títulos del soberano. Colocan al combatiente bajo una protección divina y hacen \
del objeto guerrero un soporte de caligrafía, donde la escritura se vuelve adorno y \
talismán."""
histoire = """
Los cascos turbante aparecen a finales del siglo XV entre los turcomanos que \
dominaban entonces Irán y el este de Anatolia, y los otomanos adoptan su forma. \
El Met atribuye este a un taller turco, quizá de Estambul, que trabajaba a la \
manera de los armeros turcomanos. Muchos de estos cascos se conservaron durante \
siglos en el arsenal otomano instalado en la antigua iglesia bizantina de Santa Irene, \
en Estambul, donde se acumulaban las armas fabricadas allí mismo y el botín tomado durante las \
conquistas en Irán y el Cáucaso. En el siglo XIX, una parte de esas armas \
salió del arsenal y llegó al mercado europeo. Este casco ingresó en el Metropolitan \
Museum en 1904."""
facture = """
Como la mayoría de los cascos turbante, se conformó a martillo en una sola \
pieza de acero, para obtener el bulbo y las acanaladuras en espiral: un trabajo \
difícil, que exige hacer sobresalir y ahuecar el metal alternativamente. El decorado \
asocia dos técnicas: el dorado, en las bandas y los motivos en forma de hoja, y \
la incrustación de plata, que consiste en excavar el metal para martillear en él un hilo o una \
lámina de plata. Las letras, anchas y esbeltas, están trazadas en un estilo \
monumental hecho para leerse a distancia."""
details = [
  "Las acanaladuras en espiral, que imitan los pliegues de un turbante.",
  "Las letras árabes incrustadas de plata sobre la banda dorada inferior.",
  "Las dos escotaduras redondeadas para los ojos.",
  "El soporte vertical del nasal, en el centro de la frente.",
  "Las pequeñas anillas del borde, que sujetaban la cofia de malla.",
]
themes = ["otomano", "caligrafía", "turbante", "acero", "islam"]
anecdote = """
La iglesia de Santa Irene, en Estambul, construida bajo el emperador Justiniano en el siglo VI, \
nunca fue transformada en mezquita. Tras la conquista otomana de 1453, sirvió \
de arsenal y luego de museo de armas; hoy se celebran en ella conciertos."""
salle = 5
mur = "ouest"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Sable (shamshir) y su vaina"
artiste = "Inde du Nord, Lucknow"
annee = "hoja del siglo XVIII; empuñadura y vaina fechadas en 1819"
image = "shamshir-lucknow.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Saber_(Shamshir)_with_Scabbard_MET_DP164593.jpg"
technique = "Acero, plata, esmalte, marfil, oro, vidrio; longitud con vaina 98,4 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una hoja del siglo XVIII en una montura de marfil y plata esmaltada, probablemente hecha en Lucknow en 1819."
description = """
El sable y su vaina se presentan uno junto a otro, en pie. A la izquierda, la hoja, larga \
y muy curva, termina en una punta afilada; sobre el acero gris se adivinan finas \
ondulaciones y, cerca de la guarda, una pequeña marca estampada. La empuñadura de marfil, \
curvada, termina en una cabeza de animal esmaltada de azul, de ojos rojos; la \
guarda en cruz, de plata cincelada, remata también en dos pequeñas cabezas esmaltadas, \
y un anillo dorado adornado con un cartucho oval hace de unión. A la derecha, la vaina \
está enteramente cubierta de plata esmaltada: medallones azules o negros, en los que \
se destacan pájaros, alternan con flores verdes, rojas y amarillas. Dos anillas \
servían para suspenderla; la parte inferior es de plata calada."""
evocation = """
El shamshir, cuyo nombre designa en persa la espada o el sable, nació en Irán: su hoja \
estrecha y muy curva está hecha para cortar con un movimiento de tracción, a caballo. Adoptado \
en todo el mundo indopersa, se convierte en un arma de aparato tanto como de combate. \
Este reúne dos épocas: una hoja antigua, admirada por la calidad de su acero, \
y una montura nueva, que sigue la moda de la corte. Los pájaros de la vaina, patos, \
zancudas, aves en vuelo, evocan los jardines y los estanques tan queridos de la cultura \
persa y mogol, y dan al arma una dulzura inesperada. En Lucknow, a principios del \
siglo XIX, un sable así expresaba la riqueza y el refinamiento de su propietario más \
que su valentía."""
histoire = """
La hoja fue forjada en el siglo XVIII, probablemente en la India. En 1819 recibe una \
empuñadura y una vaina nuevas, que el Met atribuye a un taller indio, probablemente de \
Lucknow, capital del reino de Awadh. Es la época en que el soberano de Awadh, \
Ghazi-ud-Din Haidar, toma el título de rey y en que la corte multiplica los encargos de \
prestigio. El sable pasó después a la colección de George Cameron Stone (1859–1935), \
ingeniero estadounidense que había reunido miles de armas de todos los continentes y \
publicó en 1934 un glosario de armas y armaduras que aún se consulta. Legó su \
colección al Metropolitan Museum a su muerte, en 1935."""
facture = """
Las ondulaciones de la hoja son las de un acero de crisol, que los europeos \
llamaban acero de Damasco: fundido en pequeños lingotes y forjado después a baja temperatura, \
conserva una estructura que dibuja, una vez pulida la hoja y atacada con ácido, un motivo \
de ondas. La montura asocia el marfil esculpido a la plata, grabada y luego cubierta de esmalte \
campeado: el orfebre excava pequeñas cubetas en el metal, las llena de polvo \
de vidrio coloreado y cuece después el objeto para fundirlo. Los azules y los verdes \
transparentes dejan brillar la plata que hay debajo."""
details = [
  "La cabeza de animal esmaltada de azul, de ojos rojos, en el extremo de la empuñadura.",
  "Las dos pequeñas cabezas esmaltadas que rematan la guarda.",
  "Los pájaros blancos en los medallones azules y negros de la vaina.",
  "Las dos anillas de suspensión, en el costado de la vaina.",
  "Las finas ondulaciones del acero, visibles en la hoja.",
]
themes = ["india", "lucknow", "esmalte", "sable", "marfil"]
anecdote = """
George Cameron Stone coleccionaba armas de todas las épocas y de todos los \
países. Su glosario ilustrado de armas y armaduras, publicado en 1934, un año antes de su muerte, \
sigue siendo una obra de referencia para conservadores y coleccionistas."""
salle = 5
