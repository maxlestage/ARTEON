[[artistes]]
nom = "Armuriers de la cour de France"
vie = "París, mediados del siglo XVI"
biographie = """
Bajo Francisco I y Enrique II, la corte de Francia quiere rivalizar con Italia y con \
el emperador Carlos V hasta en las armaduras. Los reyes hacen trabajar a \
armeros instalados en París, a veces llegados de Italia o de Alemania, y los asocian \
a los artistas de la corte. El decorado de las armaduras de gala nace entonces sobre el papel: \
orfebres, grabadores y pintores dibujan proyectos completos, peto, hombreras, \
casco, escudo, que los armeros y los cinceladores traducen después al acero. \
Entre estos dibujantes se cita al orfebre y grabador Étienne Delaune (1518 o 1519 – \
1583), que trabajó para la Casa de la Moneda real, al pintor Jean Cousin el Viejo y \
al iluminador Baptiste Pellerin. Varias armaduras y escudos de este grupo han \
llegado hasta nosotros y se conservan en el Louvre, en el Museo del Ejército, en Viena o en \
Nueva York; sus dibujos preparatorios, dispersos por varios museos de Europa y \
de América, permiten seguir el paso del proyecto al objeto. Las guerras de \
religión, a partir de 1562, ralentizan esta producción suntuosa sin interrumpirla \
del todo."""
style = """
Las armaduras de la corte de Francia se reconocen por su decorado cubriente, de poco \
relieve, en el que se mezclan figuras mitológicas, trofeos, roleos y grutescos, en \
el espíritu de la escuela de Fontainebleau. El oro, la plata y el acero pavonado juegan en ellas como \
los colores de una pintura. Estas armaduras hacen del acero un soporte de imágenes, al igual \
que el esmalte o el tapiz, y fueron admiradas e imitadas en toda Europa."""

[[artistes]]
nom = "Ateliers royaux de Greenwich"
vie = "Greenwich, cerca de Londres, hacia 1515 – mediados del siglo XVII"
biographie = """
El joven Enrique VIII, coronado en 1509, quiere armaduras dignas de los mayores príncipes, \
que entonces suministraban los talleres de Milán, de Augsburgo o de Núremberg. Hacia 1515, \
instala en su palacio de Greenwich, a orillas del Támesis, un taller de armeros llegados \
de Alemania, a los que se llama los «Almains». El taller trabaja primero para el rey \
mismo y luego, bajo Isabel I, para los grandes señores de la corte, que \
obtienen permiso para abastecerse allí. El maestro armero Jacob Halder lo dirige a \
finales del siglo XVI; un álbum de dibujos realizado en esa época, conservado en el Victoria \
and Albert Museum, muestra una treintena de guarniciones encargadas por cortesanos. \
El taller declina en el siglo XVII, cuando la armadura pierde su utilidad en los campos de \
batalla, y desaparece con la guerra civil inglesa. Sus armaduras se conservan hoy sobre todo \
en las Royal Armouries, en Londres y en Leeds, en la colección \
real y en el Metropolitan Museum."""
style = """
Las armaduras de Greenwich asocian formas amplias y nítidas, heredadas de los modelos \
alemanes, a decorados grabados al aguafuerte y dorados, dispuestos en bandas sobre un acero \
a menudo pavonado o ennegrecido. Con frecuencia se entregan en guarniciones, con piezas de \
recambio para la guerra y los diversos juegos del torneo. Su elegancia sobria las ha \
convertido en el símbolo de la caballería isabelina."""

[[artistes]]
nom = "Pays-Bas bourguignons"
vie = "Estados de los duques de Borgoña, de Dijon a Brujas, 1363–1477"
biographie = """
En 1363, el rey Juan II el Bueno concede el ducado de Borgoña a su hijo Felipe el \
Atrevido. Mediante matrimonios, herencias y conquistas, sus descendientes, Juan sin Miedo, Felipe \
el Bueno y Carlos el Temerario, reúnen un conjunto inmenso: Borgoña y el \
Franco Condado, pero sobre todo las ricas provincias de los Países Bajos, Flandes, Artois, \
Brabante, Holanda. Su corte, casi siempre en Bruselas, Brujas o Lille, es \
una de las más brillantes de Europa: en ella se ve a Jan van Eyck, Rogier van der Weyden, a \
los tapiceros de Arrás y de Tournai, a los orfebres y a los iluminadores. En 1430, Felipe el \
Bueno funda la Orden del Toisón de Oro. Su hijo Carlos el Temerario, duque en 1467, \
procura unir sus territorios y obtener una corona real; choca con las \
ciudades renanas, con los suizos y con el rey Luis XI. Derrotado en Grandson y en Morat en 1476, \
muere ante Nancy el 5 de enero de 1477. Los Países Bajos pasan entonces a los Habsburgo por \
el matrimonio de su hija María con Maximiliano de Austria."""
style = """
El arte borgoñón asocia lujo y emblemas. Los duques multiplican los signos de \
reconocimiento, cruz de San Andrés, eslabones de pedernal y chispas, divisas y colores de \
librea, pintados en los estandartes, las tiendas, los vestidos de sus gentes y las armas \
de sus soldados. El mismo gusto por el fasto y la precisión anima la pintura de \
los primitivos flamencos, el tapiz y la orfebrería de su corte."""

[[artistes]]
nom = "Russie, armuriers de la cour impériale"
vie = "San Petersburgo y Tula, siglo XVIII"
biographie = """
A principios del siglo XVIII, Pedro el Grande dota a Rusia de una industria armamentística \
moderna, en torno a la manufactura de armas de Tula, fundada en 1712, y a la de \
Sestroretsk, cerca de San Petersburgo. Junto a los fusiles del ejército, estos talleres y \
los de la capital producen armas de lujo para la corte: escopetas y pistolas de \
caza, armas de regalo, guarniciones a juego. Algunos armeros vienen de Alemania \
o de otros países de Europa, y todos trabajan al gusto de las cortes europeas, \
rocalla y luego neoclásico. Johan Adolph Grecke, autor de las pistolas expuestas aquí, es \
uno de esos artesanos: armero de la corte en San Petersburgo, es conocido por \
obras y documentos de 1755 a 1790. Bajo Catalina II, emperatriz de 1762 a 1796, \
estas armas sirven para las cacerías de la corte y sobre todo para los regalos: se ofrecen a \
soberanos, a embajadores, a favoritos. El Museo del Hermitage y la Armería del \
Kremlin conservan hoy conjuntos importantes."""
style = """
Las armas de lujo rusas del siglo XVIII rivalizan con las de París y Londres \
por la calidad de sus mecanismos, pero se distinguen de ellas por la riqueza de los \
materiales: marfil, acero pavonado y dorado, nácar, cinceladuras de oro y plata. \
Retoman las formas y los ornamentos de moda en Europa, rocallas y luego motivos \
antiguos, con un marcado gusto por el fasto."""

[[artistes]]
nom = "Grèce archaïque"
vie = "Mundo griego, hacia 800–480 a. C."
biographie = """
Se llama época arcaica a los tres siglos que preceden a las guerras médicas. Los \
griegos, repartidos en cientos de ciudades independientes, fundan colonias por todo \
el Mediterráneo y el mar Negro, adoptan el alfabeto y ven nacer los poemas \
de Homero y de Hesíodo. En las ciudades aparece una nueva manera de combatir: la \
falange de hoplitas, soldados de infantería pesadamente armados, dispuestos en líneas cerradas, cada uno \
protegido por un gran escudo redondo, una coraza, grebas y un casco de bronce. \
Estos soldados son ciudadanos lo bastante acomodados para pagar su equipo, y su papel \
militar va a la par con su lugar en la vida de la ciudad. Corinto, ciudad comerciante \
en el istmo que une el Peloponeso con el resto de Grecia, es entonces uno de los grandes \
centros de arte y artesanía, famosa por sus vasos pintados y sus bronces. Los grandes \
santuarios, Olimpia, Delfos, reciben ofrendas de armas por millares. La época \
concluye con las victorias griegas sobre los persas en Maratón, en 490, y en Salamina, \
en 480 a. C."""
style = """
El arte arcaico ama las formas nítidas, los contornos tensos y la estilización: kuroi \
de sonrisa fija, vasos de figuras negras, bronces de superficies lisas. Los armeros \
comparten este gusto por las formas simples y poderosas, en las que la belleza nace de \
la adaptación a la función. El casco corintio, con sus curvas envolventes y sus \
aberturas almendradas, es uno de los ejemplos más logrados."""

[[artistes]]
nom = "Royaume d'Est-Anglie"
vie = "Este de Inglaterra (Norfolk y Suffolk), siglos VI–IX"
biographie = """
Tras la partida de los romanos de Britania, a principios del siglo V, pueblos llegados de \
las costas del mar del Norte, anglos, sajones y jutos, se instalan en el este de la isla. \
En el siglo VI se forman varios reinos, entre ellos el de los anglos del Este, \
Estanglia, que corresponde aproximadamente a los actuales condados de Norfolk y de Suffolk. Su \
dinastía conoce su apogeo bajo Rædwald, muerto hacia 624, a quien el historiador Beda el \
Venerable cuenta entre los reyes que ejercieron la supremacía sobre los demás reinos \
ingleses. Rædwald se hizo bautizar pero mantuvo, según Beda, un altar para los antiguos \
dioses junto al de Cristo. La corte real mantiene vínculos con \
Escandinavia, el mundo franco y hasta Bizancio, como muestran los objetos de Sutton \
Hoo. Estanglia se convierte al cristianismo a lo largo del siglo VII. En el siglo IX, \
es conquistada por los vikingos, que matan en 869 al rey Edmundo, venerado después como \
santo."""
style = """
El arte de los anglosajones paganos es un arte de orfebres: hebillas, broches, fíbulas y \
armas están cubiertos de entrelazados de animales estilizados y de cloisonnés de oro y granates. \
Las figuras humanas y animales se descomponen en motivos que se enroscan y \
se imbrican, para descifrar de cerca. Este arte, compartido con Escandinavia, nutrirá más \
tarde las iluminaciones de los manuscritos cristianos de Irlanda y de Nortumbria."""

[[artistes]]
nom = "Japon, époque de Kamakura"
vie = "Japón, 1185–1333"
biographie = """
En 1185, al término de la guerra de Genpei entre los clanes Taira y Minamoto, Minamoto no \
Yoritomo se impone e instala su gobierno militar en Kamakura, lejos de la corte \
imperial de Kioto; recibe en 1192 el título de shogun. Por primera vez, los \
guerreros, los bushi o samuráis, gobiernan el país junto al emperador, cuyo \
papel se vuelve sobre todo religioso y simbólico. Tras la muerte de Yoritomo, el poder \
pasa a la familia Hōjō, regentes del shogunato. Japón rechaza en 1274 y en 1281 dos \
intentos de invasión mongola, a costa de un pesado esfuerzo militar. Descontentos y \
deudas debilitan después el régimen. En 1333, el emperador Go-Daigo, ayudado por guerreros \
aliados como Ashikaga Takauji y Nitta Yoshisada, derriba el shogunato de Kamakura. \
La época ve también el auge del budismo zen y de las escuelas de la Tierra Pura, de una \
escultura realista y de los grandes relatos guerreros como el Cantar de Heike."""
style = """
El arte de Kamakura está marcado por el gusto de los guerreros por lo vigoroso y lo verdadero: \
esculturas de Unkei de músculos tensos, rollos pintados que narran las batallas, \
retratos sin halago. Los armeros producen entonces las grandes armaduras ō-yoroi \
de cordonaduras coloreadas, y los herreros hojas tenidas por las más bellas de \
la historia de la espada japonesa, como las de Masamune."""

[[artistes]]
nom = "Japon, époque d'Edo"
vie = "Japón, 1603–1868"
biographie = """
En 1603, Tokugawa Ieyasu, vencedor en Sekigahara tres años antes, recibe el título de \
shogun e instala su gobierno en Edo, la actual Tokio. Sus descendientes gobiernan \
Japón durante más de dos siglos y medio. El país se cierra casi por completo a los \
extranjeros, las guerras interiores cesan y la sociedad se divide en órdenes: \
guerreros, campesinos, artesanos y mercaderes. Los samuráis, que ya apenas combaten, \
se convierten en administradores al servicio del shogun y de los daimios, señores de las \
provincias; llevar las dos espadas sigue siendo su privilegio y su signo distintivo. La \
paz favorece el auge de las ciudades, Edo, Osaka, Kioto, y de una cultura urbana \
brillante: teatro kabuki, estampas, poesía, artes decorativas. Los artesanos de la espada, \
herreros, pulidores, lacadores y cinceladores de monturas, trabajan entonces tanto para \
el aparato como para el uso. En 1868, la restauración Meiji devuelve el poder al \
emperador; en 1876, se prohíbe llevar la espada, y los samuráis desaparecen como \
clase."""
style = """
Las armas de la época de Edo asocian la tradición de las hojas antiguas, conservadas y \
remontadas, al refinamiento de las monturas, verdaderas joyas de metal. Cinceladores y \
lacadores rivalizan en invención en las guardas, las pequeñas piezas de la empuñadura y las \
vainas, unas veces sobrias, otras cubiertas de paisajes o de animales. Cada detalle de la \
espada se convierte en objeto de colección."""

[[artistes]]
nom = "Empire ottoman"
vie = "Anatolia, Balcanes y Oriente Próximo, hacia 1300–1922"
biographie = """
Hacia 1300, un jefe turco llamado Osman funda en el noroeste de Anatolia un pequeño \
principado, en los confines del Imperio bizantino. Sus descendientes, los otomanos, \
se extienden por los Balcanes y Asia Menor; en 1453, el sultán Mehmed II toma \
Constantinopla, que se convierte en Estambul, capital del imperio. En el siglo XVI, Selim I \
conquista Siria y Egipto, y Solimán el Magnífico llega hasta Bagdad, Buda y \
las puertas de Viena. El ejército otomano, con sus jenízaros, su artillería y su \
caballería, es entonces uno de los más poderosos del mundo. Los talleres imperiales \
de Estambul reúnen a artesanos llegados de todo el imperio y de los países conquistados, \
en particular de Irán y del Cáucaso, y producen armas, armaduras, cerámicas, tejidos y \
manuscritos para el palacio. Debilitado a partir del siglo XVIII frente a Austria y a \
Rusia, el imperio sobrevive hasta la Primera Guerra Mundial; desaparece en 1922, y \
la República de Turquía se proclama al año siguiente."""
style = """
El arte otomano de las armas mezcla la potencia de las formas, heredada de los turcomanos y de \
Irán, con un decorado precioso: dorado, incrustaciones de plata, caligrafías, roleos \
florales y, más tarde, piedras preciosas. Las inscripciones, oraciones, versículos o títulos \
del sultán, son un elemento esencial de este decorado. El arma se convierte así en un objeto de \
prestigio y de piedad tanto como en un instrumento de guerra."""

[[artistes]]
nom = "Inde du Nord, Lucknow"
vie = "Lucknow, reino de Awadh (norte de la India), siglos XVIII–XIX"
biographie = """
En el siglo XVIII, el Imperio mogol, que dominaba la mayor parte de la India desde \
el siglo XVI, se fragmenta. Sus gobernadores de provincia se convierten en príncipes casi \
independientes: es el caso de los nawabs de Awadh, en la rica llanura del Ganges. En 1775, \
el nawab Asaf-ud-Daula hace de Lucknow su capital; construye allí el Bara Imambara y \
atrae a poetas, músicos, arquitectos y artesanos venidos de Delhi, entonces en declive. La \
ciudad se convierte en uno de los grandes focos de la cultura indopersa: poesía en urdu, \
música, danza kathak, cocina refinada, orfebrería y esmaltería. Los nawabs \
mantienen relaciones estrechas, y cada vez más desiguales, con la Compañía \
inglesa de las Indias Orientales. En 1818-1819, Ghazi-ud-Din Haidar toma el título de rey, \
rompiendo simbólicamente con el emperador mogol. En 1856, los británicos anexionan \
Awadh; al año siguiente, Lucknow es uno de los focos de la gran rebelión de 1857."""
style = """
Los talleres de Lucknow son famosos por sus esmaltes sobre plata, de azules y \
verdes transparentes, a menudo adornados con pájaros, peces y flores. Las armas de \
lujo asocian hojas antiguas, persas o indias, a monturas nuevas \
de marfil, jade, plata esmaltada u oro. Estos sables de aparato hablan del refinamiento \
de una corte donde el arma era ante todo una insignia de rango."""
