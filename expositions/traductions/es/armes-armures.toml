[[oeuvres]]
titre = "Pavés con los emblemas de Borgoña"
artiste = "Pays-Bas bourguignons"
annee = "hacia 1474–1475"
image = "pavois-bourguignon.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Standschild_(pavese)_met_Andreaskruis_Bourgondisch_schild_met_Andreas-kruis,_NG-KOG-2517-C.jpg"
technique = "Madera de tilo, tela de lino, cuero de ciervo, hierro, pintura; 105 × 60,4 cm"
collection = "Rijksmuseum, Ámsterdam (depósito del Koninklijk Oudheidkundig Genootschap)"
note = "Un gran escudo de infante pintado con la cruz de San Andrés y los eslabones de pedernal, emblemas de los duques de Borgoña."
description = """
El escudo, de un metro de alto, es un largo panel abombado, redondeado por arriba y estrechado \
hacia abajo, donde terminaba en una punta hoy rota. Una arista vertical \
lo divide en dos mitades: la izquierda está pintada de blanco, la derecha de azul oscuro. \
Encima, una gran cruz roja en forma de X, la cruz de San Andrés, ocupa toda la \
superficie. Entre sus brazos, cuatro motivos amarillos en forma de B representan \
eslabones de pedernal, esas piezas de acero que se golpeaban contra una piedra para hacer fuego, y \
cuatro pequeñas piedras blancas y negras figuran sílex. Alrededor brotan \
pequeñas llamas rojas. La pintura está agrietada y desconchada en algunos puntos, y el \
borde superior derecho está mellado."""
evocation = """
El pavés habla el lenguaje heráldico de la casa de Borgoña. La cruz de San \
Andrés, patrón de los duques, era su señal de reunión; pasará más tarde a \
las banderas españolas con el nombre de cruz de Borgoña. El eslabón golpeando la piedra \
de la que saltan las chispas era el emblema de Felipe el Bueno, y forma aún \
el collar de la Orden del Toisón de Oro. Pintado en el escudo de un arquero o de un \
ballestero, este decorado hacía de cada soldado un portador de las señales de su príncipe, \
reconocible desde lejos. Habla de la ambición de Carlos el Temerario, que soñaba con hacer \
de sus territorios un reino y quería un ejército a su medida."""
histoire = """
El pavés servía a la infantería, en particular a los ballesteros: clavado en tierra \
mediante una punta de hierro, formaba un abrigo tras el cual se recargaba el arma. \
Según el Rijksmuseum, este escudo fue probablemente tomado por los habitantes de Colonia \
a las tropas de Carlos el Temerario, duque de Borgoña, cuando este quiso restablecer \
al arzobispo Roberto del Palatinado, expulsado de su arzobispado. En esa guerra \
el duque sitió durante casi un año la ciudad de Neuss, en 1474-1475, sin lograr \
tomarla. El escudo pertenece al Koninklijk Oudheidkundig Genootschap, sociedad \
erudita de Ámsterdam, que lo depositó en el Rijksmuseum en 1974."""
facture = """
El cuerpo del escudo es de madera de tilo, ligera, conformada y abombada. Se \
recubrió de tela de lino y luego de cuero de ciervo encolado, antes de pintarlo. Este montaje \
en capas hacía el escudo más resistente a los choques y evitaba que la madera se \
rajara. En el reverso, dejado sin pintura, cuatro puntos de sujeción recibían \
correas de cuero, y una red de clavos sujetaba sin duda un pequeño cojín. El decorado \
está pintado deprisa, con amplias manchas de color y colores francos, como un rótulo: debía \
leerse de lejos, en el campo de batalla."""
details = [
  "La cruz roja en X, que va de una esquina a otra.",
  "Los eslabones amarillos en forma de B, emblema de Felipe el Bueno.",
  "Los pequeños sílex blancos y negros, de los que parten las chispas.",
  "Las llamas rojas esparcidas por todo el fondo.",
  "La punta rota, abajo, sobre la que dos orificios recibían una punta de hierro.",
]
themes = ["borgoña", "heráldica", "escudo", "asedio", "edad media"]
anecdote = """
La cruz de San Andrés de los duques de Borgoña sobrevivió a su dinastía: pasada a \
los Habsburgo de España, sus herederos, la «cruz de Borgoña» ondeó durante \
siglos en las banderas españolas, hasta en América."""
salle = 4
