[exposition]
ordre = 45
nom_court = "Armas y armaduras"
mouvement = "Armas y armaduras"
cadre = "vitrine"
couleur = "#6a3b22"
titre = "Armas y armaduras, el arte de la guerra"
artiste = "Greenwich, París, Borgoña, Japón, Imperio otomano, India…"
dates = "siglo VII a. C. – 1819"
accroche = "Exposición virtual · Metropolitan Museum of Art, Nueva York"
introduction = """
Una armadura, un casco, un sable son instrumentos de guerra, pero también obras de \
orfebres, cinceladores, lacadores y pintores, hechas para proteger, \
impresionar y proclamar el rango de quien las porta. La visita reúne diez objetos, desde el \
casco de un hoplita griego hasta las pistolas de marfil de Catalina II, pasando por el rey \
anglosajón de Sutton Hoo, los samuráis, los duques de Borgoña, los reyes de Francia y \
de Inglaterra, los otomanos y la India. El edificio se inspira en las galerías de armas y \
armaduras del Metropolitan Museum of Art de Nueva York: un gran patio alto en el que se \
alzan dos armaduras reales, desde el cual se accede a cuatro galerías. Los objetos se \
presentan en vitrinas."""
vitrine = "armure-henri-ii.jpg"

[musee]
nom = "Metropolitan Museum of Art"
ville = "Nueva York, Estados Unidos"
construction = "Fundado en 1870; instalado en la Quinta Avenida en 1880"
presentation = """
Fundado en 1870 por un grupo de ciudadanos neoyorquinos que querían dotar a su ciudad de un \
gran museo de arte, el Metropolitan Museum of Art se instala en 1880 en un edificio de \
ladrillo diseñado por Calvert Vaux y Jacob Wrey Mould, junto a Central Park. \
Ampliado sin cesar, recibe en 1902 su gran fachada de estilo Beaux-Arts sobre la \
Quinta Avenida, obra de Richard Morris Hunt. Las armas y armaduras cuentan allí con un departamento \
propio desde 1912, bajo la dirección de Bashford Dean, zoólogo apasionado por las armaduras \
japonesas. La colección se enriquece con la compra de la colección del duque de Dino en \
1904 y, después, con el legado del ingeniero George Cameron Stone, en 1935, rico en armas de Asia \
y del mundo islámico. En la planta baja, un gran patio reúne armaduras ecuestres \
europeas, jinetes y caballos acorazados de acero; en torno a él, varias galerías están consagradas \
a Europa, Japón, el mundo islámico y las armas de fuego."""
ici = """
El edificio de ARTEON recoge la idea del patio del Met, del que irradian las galerías. Se \
entra por el sur en «El patio de las armaduras», de veinte metros de ancho y once de alto, \
de muros color piedra, donde se encuentran frente a frente dos armaduras reales, una francesa y otra \
inglesa. Al oeste se abre «Cascos de héroes», dedicada a Grecia y al rey de \
Sutton Hoo; al este, «El Japón de los samuráis». Al norte, «El escudo y la \
pistola» reúne un pavés borgoñón y las pistolas de Catalina II, y conduce a \
la última sala, «De Estambul a Lucknow»."""

