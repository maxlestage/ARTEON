[[oeuvres]]
titre = "Par de espadas (daishō)"
artiste = "Japon, époque d'Edo"
annee = "hoja del katana fechada en 1440; monturas de finales del siglo XVIII"
image = "daisho.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Blades_and_Mountings_for_a_Pair_of_Swords_(Daishō)_MET_DT306021.jpg"
technique = "Acero, madera lacada, piel de raya, seda, aleaciones de cobre, oro; katana 86,7 cm, wakizashi 66 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "La espada grande y la pequeña que todo samurái llevaba al cinto: hojas del siglo XV en monturas del XVIII."
description = """
Las dos espadas están dispuestas en horizontal, una encima de la otra, guardadas en \
sus vainas. Arriba, el katana, la espada grande, de ochenta y siete \
centímetros de largo; abajo, el wakizashi, más corto. Las vainas de madera lacada negra son \
lisas y brillantes, ligeramente curvas como las hojas que protegen; cada una \
lleva, cerca de la boca, un pequeño saliente perforado por donde pasaba el cordón que la sujetaba a \
la cintura. A la derecha, una guarda redonda y plana, la tsuba, separa la vaina de la \
empuñadura. Las empuñaduras están ceñidas por un trenzado de seda beige cruzado en rombos, \
que deja ver la piel de raya. Todo es sobrio, a juego, casi austero: solo las \
pequeñas piezas de metal revelan el lujo del conjunto."""
evocation = """
En la época de Edo (1603–1868), el par de espadas era a la vez el arma y la insignia \
de los samuráis, la única clase autorizada a portarlo. El daishō, literalmente «el \
grande y el pequeño», se deslizaba en el cinto con el filo hacia arriba. No se \
llevaba solo para combatir: en un Japón en paz durante más de dos \
siglos, expresaba el rango, la dignidad y la disciplina del guerrero. El acuerdo perfecto \
de las dos monturas, hechas juntas, es su expresión. Según un dicho a menudo citado, \
la espada es el alma del samurái: las hojas antiguas se transmitían y se veneraban \
de generación en generación, como aquí, donde hojas del siglo XV fueron revestidas \
tres siglos más tarde."""
histoire = """
La hoja del katana lleva una fecha correspondiente a 1440, en plena época de Muromachi; \
la del wakizashi fue forjada también en el siglo XV. A finales del siglo XVIII, un \
propietario las hizo montar juntas en monturas nuevas y a juego: \
era lo habitual, pues las hojas antiguas seguían siendo preciosas mientras que las monturas \
seguían la moda. Los adornos de metal se atribuyen a Iwamoto Konkan, cincelador de \
la escuela Iwamoto, en Edo. En 1876, un edicto del gobierno Meiji prohíbe llevar \
la espada en público y pone fin a esta tradición. El par perteneció al coleccionista \
neoyorquino Howard Mansfield, que lo donó al Metropolitan Museum en 1936 junto con su \
colección de objetos japoneses."""
facture = """
Una hoja japonesa se forja plegando varias veces el acero sobre sí mismo y luego \
asociando un acero duro para el filo y un acero más blando para el núcleo. Antes del \
temple, el herrero recubre la hoja de arcilla, más fina junto al filo: este \
se enfría más deprisa y se vuelve muy duro, mientras que el lomo permanece flexible. La frontera \
entre ambos dibuja en la hoja una línea ondulada, el hamon. Las monturas son \
obra de otros artesanos: lacadores para las vainas, cinceladores para la guarda y las \
pequeñas piezas de aleaciones de cobre, como el shibuichi, mezcla de cobre y \
plata."""
details = [
  "La tsuba, guarda redonda y plana entre la empuñadura y la vaina.",
  "El trenzado de seda cruzado en rombos que ciñe las empuñaduras.",
  "El pequeño saliente perforado de cada vaina, para el cordón del cinto.",
  "La curvatura más larga de la espada grande, arriba.",
  "La laca negra de las vainas, pulida como un espejo.",
]
themes = ["japón", "samurái", "espada", "laca", "edo"]
anecdote = """
En Japón, un herrero firma y fecha su hoja en la espiga, la parte oculta en la \
empuñadura. Para leer la firma de una espada hay, pues, que retirar la empuñadura, sujeta \
por una simple clavija de bambú, el mekugi."""
salle = 3
mur = "nord"
place = 2
