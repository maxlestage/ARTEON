[[oeuvres]]
titre = "Par de pistolas de la emperatriz Catalina II"
artiste = "Russie, armuriers de la cour impériale"
annee = "1786"
image = "pistolets-catherine-ii.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Pair_of_Flintlock_Pistols_of_Empress_Catherine_the_Great_(1729–1796)_MET_LC-1986_265_1_2-009.jpg"
technique = "Acero, marfil, oro, latón; longitud de cada pistola 36,8 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Firmadas por Johan Adolph Grecke, armero de la corte de San Petersburgo: dos pistolas de empuñadura de marfil hechas para Catalina II."
description = """
Las dos pistolas están dispuestas en sentido inverso, una encima de la otra, sobre un fondo gris. \
Su caja y su empuñadura están talladas en marfil, de un blanco crema veteado de finas \
craqueladuras. Los cañones, de acero pavonado casi negro, están realzados con roleos dorados \
cerca de la culata. En el costado, la llave de chispa muestra el gatillo, que sujetaba la \
piedra, y el rastrillo, contra el que esta venía a golpear. En la pistola de arriba, \
se lee el nombre GRECKE grabado en la llave. La empuñadura curvada termina en un \
casquillo de metal cincelado y dorado; en la pistola de abajo, una aplicación de plata y oro \
en forma de rocalla adorna el lado opuesto a la llave. Cada arma mide treinta y siete \
centímetros."""
evocation = """
Estas pistolas no están hechas para la guerra sino para el prestigio y el placer: \
pertenecían a una guarnición de armas de caza, un conjunto a juego destinado a una \
soberana. El marfil, materia frágil y costosa, dice mucho: armas así \
mostraban la riqueza de la corte y la destreza de sus artesanos, capaces de \
rivalizar con París o Londres. Bajo Catalina II, San Petersburgo quiere ser una \
capital europea de las artes y las ciencias, y las armas de lujo contribuyen a esa \
imagen. Regaladas o dispersadas, estas guarniciones servían también de presentes diplomáticos \
y de muestras de favor, como demuestra su destino."""
histoire = """
Johan Adolph Grecke, armero al servicio de la corte imperial de Rusia, es conocido \
de 1755 a 1790. En 1786 realiza para Catalina II, emperatriz desde 1762, una \
guarnición de armas de caza con monturas de marfil: un par de pistolas, una escopeta de \
caza y una carabina. La inicial E, por Ekaterina, la forma rusa de su nombre, figura \
en el escudete de las empuñaduras. El conjunto fue dispersado después: una parte pasó a \
Estanislao Augusto Poniatowski, antiguo favorito de la emperatriz convertido en rey de Polonia; \
la escopeta de caza se encuentra hoy en el Museo Nacional de Varsovia, la carabina está \
perdida. Las pistolas fueron donadas al Met en 1986 por el banquero John M. Schiff, en \
memoria de su esposa."""
facture = """
El trabajo reúne varios oficios. El armero forjó los cañones y ajustó las \
llaves de chispa, cuyo mecanismo hace brotar la chispa del choque de la piedra contra \
el acero del rastrillo. Un escultor talló el marfil, materia dura y quebradiza, que \
hay que ensamblar en varias piezas. El cincelador y el dorador realizaron las \
guarniciones, con rocallas y roleos inspirados en el gusto rococó. Los cañones, pavonados, \
se decoraron con oro. El conjunto debía seguir siendo perfectamente funcional: un arma de \
lujo era también un arma de precisión."""
details = [
  "El nombre GRECKE grabado en la llave de la pistola de arriba.",
  "El gatillo y el rastrillo de la llave de chispa, listos para golpear.",
  "Los roleos de oro sobre el acero oscuro de los cañones.",
  "La aplicación de rocalla en plata y oro sobre la pistola de abajo.",
  "Los casquillos cincelados y dorados en el extremo de las empuñaduras.",
]
themes = ["rusia", "caza", "marfil", "rococó", "armas de fuego"]
anecdote = """
La llave de chispa que equipa estas pistolas fue puesta a punto a principios del siglo XVII \
en Lisieux, en Normandía, en el entorno de Marin Le Bourgeoys, artesano al \
servicio de Enrique IV y luego de Luis XIII. Su principio sirvió a las armas de fuego europeas \
durante más de dos siglos."""
salle = 4
mur = "est"
place = 2
