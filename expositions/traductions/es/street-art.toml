[[oeuvres]]
titre = "Viviane, cartel para el Eden-Théâtre"
artiste = "Jules Chéret"
annee = "1886"
image = "viviane.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1972.1126"
technique = "Litografía en color"
collection = "Cleveland Museum of Art, Cleveland"
note = "Una bailarina con tutú amarillo gira bajo un título gigante: el cartel de ballet según Chéret, hecho para verse de lejos, en la calle."
description = """
Arriba, en mayúsculas negras, «Eden-Théâtre»; debajo, en enormes letras rojas sombreadas de blanco, «Viviane». En el centro, una joven bailarina rubia, con tutú amarillo pálido, gira sobre una punta, con un brazo levantado sobre la cabeza y la falda alzada por el movimiento. Tras ella, un personaje de traje negro y cabellos rizados parece bailar con ella; a la derecha, una mujer coronada, de larga túnica dorada, avanza. Abajo a la izquierda, en un triángulo rojo anaranjado, pequeños jinetes con armadura galopan. Abajo, en rojo, el texto anuncia un «ballet en 5 actos y 9 cuadros» de Edmond Gondinet, con música de Raoul Pugno y Clément Lippacher. La firma de Chéret está a la derecha."""
evocation = """
Viviane es el hada de las leyendas del rey Arturo, la Dama del Lago que hechizó al encantador Merlín: los caballeros del rincón rojo y la dama coronada remiten a ese mundo de novelas de caballerías. Pero Chéret no busca contar el ballet. Da su impulso, su luz, su promesa de placer: una joven risueña en pleno movimiento, que parece salir del cartel. Este tipo de figura, alegre, ligera, siempre bailando, se convierte en su sello, hasta el punto de que se llamará «chérettes» a sus heroínas. Sobre los muros grises de París, el cartel aportaba un destello de color y de fiesta que los transeúntes nunca habían visto en la calle."""
histoire = """
El Eden-Théâtre, gran sala de espectáculos abierta en 1883 cerca de la Ópera, era célebre por sus ballets de gran espectáculo, con decorados suntuosos y centenares de figurantes. Viviane se estrena allí en 1886. Chéret, que dirige entonces el taller de carteles de la imprenta Chaix, dibuja el anuncio: en el margen izquierdo se lee «Imprimerie Chaix (succursale Chéret), 18, rue Brunel». El editor de música Heugel, cuya dirección figura abajo, publicaba la partitura. Pegados por centenares en muros, columnas y empalizadas, estos carteles estaban hechos para durar unas semanas; este escapó a la cola y a la lluvia, y el Cleveland Museum of Art lo adquirió en 1972."""
facture = """
Chéret imprime sus carteles en litografía, con una piedra por color: aquí, el negro del dibujo, el rojo, el amarillo y el azul, que se superponen para dar otros matices. Aplica los fondos con degradados y salpicaduras, finas proyecciones de tinta que dan un grano vibrante, visible en el cielo y en torno a la bailarina. El dibujo, nervioso, deja abiertos los contornos, como un boceto. El rotulado no está pegado a la imagen: forma parte de la composición, y el gran título rojo, en perspectiva, se lee a decenas de metros. El triángulo anaranjado, en diagonal, dinamiza toda la hoja."""
details = [
  "El gran título «Viviane» en letras rojas sombreadas de blanco.",
  "El tutú amarillo de la bailarina, alzado por la pirueta.",
  "Los pequeños caballeros que galopan en el triángulo rojo, abajo a la izquierda.",
  "La dama coronada, de larga túnica dorada, a la derecha.",
  "En el margen izquierdo, la dirección de la imprenta Chaix.",
]
themes = ["cartel", "danza", "teatro", "color", "leyenda artúrica"]
anecdote = """
En los años 1890, los carteles de Chéret se volvieron tan codiciados que los coleccionistas los despegaban de los muros o pagaban a los carteleros para obtener ejemplares: se habló de «affichomanie». Las obras de street art conocen hoy la misma suerte."""
