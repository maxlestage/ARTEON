[exposition]
ordre = 220
nom_court = "El arte de los muros"
mouvement = "Pintura mural y arte urbano"
cadre = "aucun"
couleur = "#b23a12"
titre = "Antes del street art, el arte de los muros"
artiste = "Roma, Teotihuacan, Carle Vernet, Jules Chéret, China de los Yuan, España románica…"
dates = "Siglo I a. C. – 1886"
accroche = "Exposición virtual · Urban Nation Museum, Berlín"
introduction = """
No se esperó al grafiti neoyorquino, al Muro de Berlín ni a Banksy para pintar los muros y convertir la calle en una galería. Los romanos cubrían de frescos las estancias de sus villas y escribían en las fachadas de Pompeya consignas electorales y palabras garabateadas, que los arqueólogos italianos llamaron graffiti. Los habitantes de Teotihuacan pintaban de rojo los muros de sus palacios; los monjes de China y de Castilla hacían cubrir las paredes de sus templos con imágenes inmensas; en el siglo XIX, el cartel de colores invade las calles de París. El street art de hoy está protegido por los derechos de autor de sus creadores: la visita muestra, pues, a sus antepasados, nueve obras de dominio público, del siglo I antes de nuestra era a 1886. El edificio se inspira en el Urban Nation Museum de Berlín: una fachada de acogida, una larga galería de muros pintados y salas altas como medianeras de edificio."""
vitrine = "boscoreale-salle-l.jpg"

[musee]
nom = "Urban Nation Museum for Urban Contemporary Art"
ville = "Berlín, Alemania"
architecte = "GRAFT (transformación del edificio)"
construction = "Edificio de finales del siglo XIX; museo inaugurado en 2017"
presentation = """
El Museum for Urban Contemporary Art, conocido como Urban Nation, ocupa un edificio de finales del siglo XIX en el número 7 de la Bülowstraße, en el barrio de Schöneberg, cerca de la Nollendorfplatz. El proyecto nace en 2013 por iniciativa de la Stiftung Berliner Leben, fundación creada por la sociedad municipal de vivienda Gewobag: primero, murales encargados a artistas en fachadas de la ciudad; después, un museo, abierto al público en septiembre de 2017. El estudio de arquitectura berlinés GRAFT transformó el edificio y unió sus salas con pasarelas. La fachada, en la esquina de la Zietenstraße, está concebida como un soporte modulable: artistas invitados la repintan a intervalos regulares, de modo que el edificio cambia de cara. La exposición inaugural reunía a más de 150 artistas, desde Shepard Fairey hasta la fotógrafa Martha Cooper, cuya biblioteca, dedicada a la fotografía callejera y a la historia del grafiti, está instalada en el museo. Urban Nation afirma así que un arte nacido al margen, a menudo de manera ilegal, tiene ya su lugar en una institución."""
ici = """
El edificio de ARTEON retoma la idea de una fachada de acogida y de salas de muros de hormigón claro, pero las dedica a los antepasados del street art. Se entra por el sur en «La fachada», vestíbulo ancho y bajo, y se pasa al norte a «Los muros pintados de Roma», galería de treinta metros donde se recorren los frescos de las villas del Vesubio. Al norte se abren dos puertas: al oeste, «Los muros de Teotihuacan», de diez metros de altura, para las procesiones pintadas de la gran ciudad mexicana; al este, «París, el cartel en la calle», para el pegador de carteles de Carle Vernet y la Viviane de Jules Chéret. Ambas conducen a «Los grandes frescos de los templos», larga sala de doce metros de altura donde el Buda de la Medicina se despliega a lo largo de más de quince metros."""

