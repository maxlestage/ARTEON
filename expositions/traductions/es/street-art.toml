[[oeuvres]]
titre = "Pared oeste de la sala L de la villa de Publio Fannio Sinistor, en Boscoreale"
artiste = "Rome, fin de la République"
annee = "hacia 50–40 a. C."
image = "boscoreale-salle-l.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/247008"
technique = "Fresco, 195,6 × 271,8 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una pesada guirnalda de follaje y frutos, una máscara, una serpiente: el decorado de una estancia de villa romana, sepultado por el Vesubio en el año 79."
description = """
Sobre un muro rojo rosado, dividido por altas pilastras amarillas, una espesa guirnalda de hojas, frutos y espigas corre de un borde a otro. A la izquierda, está sujeta a una cabeza de toro dorada, adornada con cintas y sartas de perlas; unas cintas claras se enroscan en el follaje. Bajo la guirnalda cuelgan unos objetos: una máscara dorada de viejo sileno, calvo y barbudo, que mira fijamente al espectador; una cesta de mimbre de la que sale una serpiente erguida, ante un disco oscuro; a la derecha, un pequeño objeto de bronce en forma de campana. Más arriba, una cornisa de hojas sostiene una banda de paneles verdes y amarillos, luego un friso púrpura sembrado de finos tallos verdes y una segunda cornisa, esculpida en trampantojo."""
evocation = """
Todo aquí habla de Dioniso, el dios del vino y del teatro, cuyas fiestas reunían cantos, danzas y máscaras. El sileno es uno de sus compañeros; la cesta con la serpiente recuerda la cista mística, el cesto sagrado de sus misterios; el disco y la campana evocan sin duda el pandero y los címbalos que marcaban el ritmo de sus cortejos. La cabeza de toro adornada con cintas es la de una víctima de sacrificio. La guirnalda cargada de frutos de todas las estaciones habla de la abundancia del campo. Para el rico propietario, este decorado transformaba una estancia de su villa en un santuario en fiesta, a imagen de las guirnaldas verdaderas que se colgaban de los muros los días de celebración."""
histoire = """
La villa de Publio Fannio Sinistor se hallaba en Boscoreale, en las laderas del Vesubio, a unos kilómetros al norte de Pompeya. Sus muros fueron pintados hacia 50–40 antes de nuestra era, y luego la casa quedó sepultada por la erupción del año 79. Sacada a la luz en 1900, fue despojada de sus frescos, cortados por paneles y vendidos en subasta en París en 1903. El Metropolitan Museum adquirió entonces un conjunto importante, que incluye esta pared de la estancia que los arqueólogos designan con la letra L, y una cámara entera, remontada en sus salas. Los demás paneles de la villa están hoy dispersos entre varios museos, en Italia y en Europa."""
facture = """
Es un fresco: los colores, diluidos en agua, se aplican sobre un enlucido de cal todavía húmedo, en el que se incorporan al secarse. El decorado pertenece al segundo estilo pompeyano, que imita arquitecturas en relieve: las cornisas, las pilastras y los paneles de mármol de colores están pintados en trampantojo, con sus sombras y sus luces. Sobre este marco riguroso, el pintor arroja una guirnalda tratada con pinceladas rápidas, casi impresionistas, en la que cada hoja se aplica de un solo toque de pincel. Las partes claras, arriba a la izquierda y abajo, son lagunas rellenadas durante la restauración."""
details = [
  "La máscara dorada de sileno, de frente calva y barba rizada.",
  "La serpiente que sale de la cesta de mimbre y tiende la cabeza hacia la izquierda.",
  "La cabeza de toro adornada con sartas de perlas, de donde se sujeta la guirnalda.",
  "La pequeña campana de bronce colgada a la derecha, sobre el fondo rojo.",
  "La cornisa de hojas, pintada en trampantojo sobre las pilastras.",
]
themes = ["fresco", "dioniso", "guirnalda", "trampantojo", "pompeya"]
anecdote = """
Las casas de la región del Vesubio no se pintaban solo por dentro: en las fachadas de Pompeya, pintores especializados trazaban en grandes letras rojas llamamientos a votar por tal o cual candidato, y los transeúntes grababan en ellas mensajes, dibujos e insultos."""
salle = 2
mur = "nord"
place = 5
largeur = 2.75

[[oeuvres]]
titre = "Perseo y Andrómeda en un paisaje"
artiste = "Rome impériale"
annee = "última década del siglo I a. C."
image = "persee-andromede.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/250945"
technique = "Fresco, 159,4 × 118,8 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El héroe Perseo acude volando en socorro de Andrómeda, encadenada a una roca: un cuadro de leyenda pintado en el muro de una villa imperial."
description = """
En un gran marco negro que termina en punta, como un frontón, se abre un paisaje marino bañado por una luz azul verdosa. En el centro se alza una alta roca violácea; a media altura, una joven vestida de amarillo, con los brazos abiertos, está encadenada a ella: es Andrómeda. A la izquierda, Perseo llega volando, desnudo bajo un manto rojo que ondea al viento, con el arma en alto. Abajo a la izquierda, el monstruo marino emerge del agua, con la cabeza erizada de crestas. A la derecha, ante un palacio de columnas, volvemos a encontrar a Perseo, que estrecha la mano de un rey de larga túnica. Abajo a la derecha, una mujer envuelta en ropajes está sentada sobre una roca. Al fondo, árboles y edificios se pierden en la bruma."""
evocation = """
El mito lo cuentan los poetas griegos y latinos, y Ovidio en las Metamorfosis. Como la reina Casiopea se había jactado de ser más hermosa que las Nereidas, los dioses envían un monstruo a devastar el reino; para aplacarlo, el rey Cefeo debe entregarle a su hija Andrómeda. Perseo, que regresa de matar a la Gorgona Medusa, la ve, mata al monstruo y se casa con ella. El pintor reúne varios momentos en una misma imagen: la llegada del héroe, la joven ofrecida, el monstruo y luego el acuerdo pactado con Cefeo. Perdidos en la inmensidad del paisaje, los personajes parecen minúsculos: la leyenda se vuelve ensoñación, una vista de costa por la que pasea la mirada."""
histoire = """
La pintura adornaba una estancia de la villa imperial de Boscotrecase, al pie del Vesubio, que perteneció sin duda a Agripa, amigo y yerno del emperador Augusto, y luego a su hijo Agripa Póstumo. Hacía pareja con otro paisaje mitológico, Polifemo y Galatea, conservado también en el Metropolitan Museum. La villa, sepultada por la erupción del año 79, fue descubierta a principios del siglo XX durante las obras de una línea de ferrocarril; sus frescos fueron entonces separados de los muros, y el sitio volvió a desaparecer poco después bajo las cenizas de una erupción del Vesubio. El Metropolitan Museum adquirió varias de sus pinturas en 1920."""
facture = """
El cuadro pertenece al tercer estilo pompeyano, aparecido bajo Augusto: el muro ya no se abre a arquitecturas en trampantojo, sino que se convierte en una superficie plana, a menudo oscura, en cuyo centro se coloca una pintura como un cuadro colgado. El paisaje es casi monocromo, tratado con ligeras pinceladas de azul y de verde; los lejanos se desdibujan en la bruma, lo que da una impresión de profundidad. Las figuras se resuelven en unas pocas pinceladas, con realces claros. Este gusto por los paisajes sagrados y mitológicos, muy en boga en tiempos de Augusto, procedía de la pintura helenística."""
details = [
  "Andrómeda, con los brazos abiertos, encadenada a media altura de la roca.",
  "Perseo en vuelo, a la izquierda, con el manto rojo hinchado por el viento.",
  "Las crestas blancas del monstruo marino, abajo a la izquierda.",
  "A la derecha, Perseo estrechando la mano del rey Cefeo ante el palacio.",
  "La mujer envuelta en ropajes sentada sobre una roca, abajo a la derecha.",
]
themes = ["mitología", "paisaje", "héroe", "mar", "fresco"]
anecdote = """
Para acercarse a Medusa, cuya mirada convertía en piedra, Perseo había recibido de los dioses unas sandalias aladas y un escudo pulido como un espejo: solo miró al monstruo en su reflejo."""
salle = 2
mur = "sud"
place = 2
largeur = 1.25

[[oeuvres]]
titre = "Grifo sobre un entablamento"
artiste = "Rome impériale"
annee = "siglo I d. C."
image = "griffon-pompei.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1981.20"
technique = "Fragmento de fresco"
collection = "Cleveland Museum of Art, Cleveland"
note = "Un fragmento de muro de Pompeya: un grifo alado monta guardia sobre una cornisa pintada, en medio de un fondo blanco."
description = """
Sobre un fondo blanco crema, recorrido por finas grietas, un grifo está de pie, de perfil, vuelto hacia la izquierda. Tiene el cuerpo y las patas de un león, pintados en gris azulado, la cabeza y el pico de un ave de presa, y dos alas erguidas, una gris, la otra ocre y rosa; su cola fina cae tras él. Se apoya en el borde de un entablamento dorado, pintado como una moldura de madera o de piedra, bajo el cual corre un friso rosa y púrpura adornado con pequeños motivos. A la izquierda, un tallo rojo que termina en volutas avanza hacia él, como una rama de candelabro o de roleo. Los bordes del fragmento, irregulares, dejan ver el grosor del enlucido."""
evocation = """
Animal fabuloso venido de Oriente, el grifo une la fuerza del león, rey de los animales, y la vista penetrante del águila, reina de las aves. Griegos y luego romanos hacen de él un guardián: vela por los tesoros, por las tumbas, y acompaña a Apolo o a la diosa Némesis. Pintado en el muro de una casa, protege y divierte a la vez. Posado sobre una cornisa suspendida en el vacío, pertenece a esas arquitecturas de fantasía, ligeras e imposibles, que los pintores de Pompeya gustaban de hacer flotar sobre fondos claros. Cabe imaginar, más allá del fragmento, todo un muro poblado de columnillas, candelabros, pájaros y pequeñas criaturas."""
histoire = """
La ficha del museo vincula este fragmento con Pompeya, sin precisar la casa de la que procede. Sepultada en el año 79 bajo las cenizas del Vesubio, la ciudad se excava a partir del siglo XVIII. Durante mucho tiempo se cortaron en los muros los trozos de pintura considerados más bellos, para las colecciones del rey de Nápoles y después para las de aficionados de todo el mundo; muchos fragmentos aislados, como este, perdieron así su contexto. El Cleveland Museum of Art lo adquirió en 1981. Da testimonio de una pintura doméstica corriente, hecha por talleres que decoraban en serie las casas de una ciudad próspera."""
facture = """
El fondo blanco, liso, deja respirar los motivos, lo cual es frecuente en los decorados del siglo I de nuestra era. El grifo está pintado con mano rápida, casi esbozada: unos toques de gris, de ocre y de rosa bastan para modelar el cuerpo, las plumas y la melena. El entablamento, en cambio, está construido con esmero, por bandas paralelas de amarillo, ocre y pardo que imitan el relieve de una moldura iluminada desde arriba. El tallo rojo, dibujado con un trazo flexible, muestra la soltura de los pintores para trazar ornamentos sin modelo. El fragmento ha sido montado sobre un soporte moderno."""
details = [
  "El pico abierto del grifo y su ojo redondo.",
  "Las dos alas erguidas, una gris, la otra ocre y rosa.",
  "Las patas de león apoyadas en el borde dorado de la cornisa.",
  "El tallo rojo con volutas que avanza desde la izquierda.",
  "La red de grietas que recorre el fondo blanco.",
]
themes = ["grifo", "animal fabuloso", "pompeya", "decoración", "fresco"]
anecdote = """
La palabra graffiti nació en Pompeya: así llamaron los arqueólogos italianos del siglo XIX a los miles de inscripciones raspadas en el enlucido de los muros de la ciudad, del verbo graffiare, «arañar, rasguñar»."""
salle = 2
mur = "sud"
place = 8
largeur = 1.3

[[oeuvres]]
titre = "Fragmento de pintura mural: rito de autosacrificio con maguey"
artiste = "Teotihuacan"
annee = "500–600 d. C."
image = "teotihuacan-maguey.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/14968"
technique = "Enlucido de cal y pigmentos minerales, 63,8 × 95 cm"
collection = "Art Institute of Chicago, Chicago"
note = "Un sacerdote en gran atavío avanza rezando por la lluvia. Fotografía ampliada: el fragmento mide 64 × 95 cm."
description = """
Sobre un fondo rojo oscuro, un hombre ricamente vestido avanza de perfil hacia la izquierda. Lleva un tocado inmenso, hecho de largas plumas que se abren tras su cabeza, un collar de gruesas perlas redondas y, en la cintura, un adorno circular. Ante su rostro se enrolla una gran voluta adornada con conchas y plantas: es su palabra, su plegaria, hecha visible. A izquierda y derecha se alzan formas triangulares terminadas en puntas oscuras: hojas de maguey, una especie de agave, plantadas en objetos rayados. Arriba, una banda de cheurones recorre el borde. Las figuras están dibujadas en rosa claro y en rojo más oscuro sobre el rojo del fondo."""
evocation = """
Según el museo, el hombre es un sacerdote de la lluvia, y la voluta que sale de su boca, decorada con conchas y plantas, indica que reza por el agua y por la prosperidad de las cosechas, tan preciosas en esta alta meseta seca. Las espinas del maguey servían para perforarse la piel y ofrecer la sangre a los dioses, rito extendido en el México antiguo: de ahí el título dado al fragmento. Repetida a lo largo de un muro, esta figura formaba una procesión sin fin, que acompañaba a quienes pasaban por la estancia. La imagen no cuenta una historia: fija en el muro una plegaria perpetua, como una inscripción."""
histoire = """
Teotihuacan, al noreste de la actual Ciudad de México, fue entre 200 y 650 de nuestra era la mayor ciudad de las Américas, poblada por más de cien mil habitantes; los aztecas, que descubrieron sus ruinas siglos más tarde, la llamaron «el lugar de los dioses». Sus pirámides, sus templos, sus palacios y sus casas estaban cubiertos de pinturas. Este fragmento pertenecía a un ciclo pintado en los muros interiores de un palacio aristocrático, el conjunto residencial de Tlacuilapaxco. Como muchas pinturas de Teotihuacan, fue separado de su muro antes de entrar en un museo. El fragmento de Cleveland, presentado enfrente, muestra una figura casi idéntica, que procedería del mismo conjunto."""
facture = """
Los pintores de Teotihuacan trabajaban sobre un enlucido de cal fino y alisado, que pulían tras aplicar los colores para darle un ligero brillo. Su paleta se basa en pigmentos minerales, entre los que destaca un rojo de óxido de hierro, la hematita, declinado en varios tonos. El dibujo se traza primero a línea y luego se rellena con superficies planas; no hay sombra ni perspectiva. Las figuras, estilizadas y codificadas, se repiten casi idénticas, como si se trasladaran a partir de un modelo. Esta manera hace pensar en un motivo de tejido o en una plantilla, y da al muro la unidad de un tapiz."""
details = [
  "El tocado de largas plumas que se abre en abanico tras la cabeza.",
  "La voluta de la palabra, adornada con conchas, ante el rostro.",
  "El collar de gruesas perlas redondas y el adorno circular del cinturón.",
  "Las hojas de maguey de puntas oscuras, a izquierda y derecha.",
  "La banda de cheurones que recorre el borde superior.",
]
themes = ["procesión", "plegaria", "lluvia", "méxico antiguo", "rojo"]
anecdote = """
El maguey alimentó al México antiguo de muchas maneras: sus fibras daban hilo y papel, sus espinas agujas, y su savia fermentada el pulque, bebida ritual mucho más antigua que el tequila."""
salle = 3
mur = "ouest"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "Fragmento de pintura mural: dignatario y hojas de maguey"
artiste = "Teotihuacan"
annee = "500–550 d. C."
image = "tlacuilapaxco.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1963.252"
technique = "Fresco sobre fragmento de muro"
collection = "Cleveland Museum of Art, Cleveland"
note = "Un dignatario en traje de gala canta y vierte una ofrenda: formaba parte de una fila de figuras idénticas que desfilaba alrededor de un patio."
description = """
En un marco bordeado de cheurones, sobre un fondo rojo oscuro, un hombre con gran traje avanza de perfil hacia la izquierda. Su rostro, pequeño, desaparece casi bajo un tocado monumental: una cabeza de animal estilizada, de ojo redondo, de la que brota un penacho de largas plumas. Lleva un collar de perlas redondas, un gran adorno circular en la cintura, un cinturón y sandalias atadas. Ante él se enrolla una gran voluta decorada; de su mano tendida cae un flujo de ofrendas. A cada lado se alzan hojas de maguey, triangulares, erizadas de puntas. Sobre el marco, un friso más ancho muestra una cinta ondulante sembrada de puntos, entre motivos en forma de estrellas."""
evocation = """
El museo ve en él a un hombre de la élite que canta o reza, con su palabra materializada en la voluta, y que vierte con una mano una libación llena de flores, mientras la otra sostiene una bolsa de incienso. Las espinas del maguey, delante y detrás de él, podrían evocar la sangre ofrecida a los dioses y el pulque, bebida ritual extraída de la savia de la planta. El personaje no tiene nombre: encarna una función, un rango, un gesto sagrado. Repetido idéntico alrededor de un patio, formaba un cortejo inmóvil, que decía a los visitantes la piedad y la riqueza de la familia que allí vivía."""
histoire = """
Según el Cleveland Museum of Art, esta figura formaba parte de una hilera de personajes idénticos que desfilaban por los muros de un patio, en uno de los ricos conjuntos de viviendas de Teotihuacan, sin duda el de Tlacuilapaxco. Estos grandes conjuntos, rodeados de altos muros ciegos, albergaban a varias familias en torno a patios interiores, y sus muros estaban a menudo cubiertos de pinturas. Como muchas pinturas de la ciudad, este fragmento fue separado de su muro en el siglo XX, en condiciones mal conocidas; el museo lo adquirió en 1963. Hace pareja con el fragmento de Chicago presentado enfrente, casi idéntico."""
facture = """
Como toda la pintura de Teotihuacan, la imagen se construye en camafeo de rojos, del rosa pálido al pardo, sobre un fondo de hematita. El dibujo, de gran precisión, detalla cada pluma del tocado, cada perla del collar, cada espina del maguey, sin buscar nunca el relieve. El pintor organiza la superficie como un tejido: bandas de cheurones, friso de motivos repetidos y luego el registro principal, marcado por las hojas puntiagudas. Las grietas y las lagunas, visibles a la derecha, muestran que la capa pictórica, muy fina, sufrió durante el desprendimiento. El fragmento está hoy fijado sobre un soporte moderno."""
details = [
  "El pequeño rostro del dignatario, casi oculto bajo el tocado.",
  "El ojo redondo de la cabeza de animal que forma la parte superior del tocado.",
  "El flujo de ofrendas que cae de la mano tendida.",
  "Las hojas de maguey erizadas de puntas, a izquierda y derecha.",
  "La cinta sembrada de puntos que ondula en el friso superior.",
]
