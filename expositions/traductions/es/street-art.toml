[[oeuvres]]
titre = "El pegador de carteles"
artiste = "Carle Vernet"
annee = "hacia 1820"
image = "colleur-d-affiches.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1966.352"
technique = "Litografía coloreada a mano"
collection = "Cleveland Museum of Art, Cleveland"
note = "Subido a su escalera, un cartelero pega los programas de los teatros en un muro de París. Estampa presentada ampliada."
description = """
Contra la esquina de un muro de piedra, un hombre subido a una escalera de madera pega un cartel. Visto de perfil, lleva un sombrero de copa abollado, una chaqueta azul, un pantalón pardo y, metido en el cinturón, un trapo a rayas. Con una mano aplasta la hoja, con la otra la alisa con una gran brocha. El muro está ya cubierto de carteles de color, azules, rosas, amarillos, que se superponen: en ellos se lee «Théâtre royal de l'Opéra-Comique», el título «Raoul, sire de C…» y otros nombres de teatros. Al pie de la escalera esperan el cubo de cola y un mojón de piedra. Bajo la imagen se lee «Afficheur», la firma de Carle Vernet y el nombre del impresor Delpech; arriba a la derecha, «N° 84»."""
evocation = """
Carle Vernet observa un oficio de la calle con la curiosidad de un reportero. El cartelero es el antepasado directo de los pegadores y grafiteros de hoy: es él quien hace del muro de la ciudad un soporte de imágenes y de palabras, renovado cada día. Las hojas pegadas unas sobre otras anuncian los espectáculos de la noche y transforman la esquina de la calle en un periódico público, que cada cual lee al pasar. Vernet hace de él un personaje pintoresco, de ropas gastadas pero de pose segura, casi elegante, como un pintor ante su lienzo. La escena, sin caricatura, guarda la memoria de un gesto que se repetiría millones de veces en el París del siglo XIX."""
histoire = """
La lámina forma parte de una serie de Gritos de París, esas imágenes de los pequeños oficios de la calle, vendedores ambulantes, aguadores o afiladores, que artistas y editores publicaban desde el siglo XVI. Carle Vernet dibuja una larga serie al natural, numerada y publicada a principios de los años 1820 por François-Séraphin Delpech, uno de los primeros grandes impresores litógrafos de París. La litografía, inventada en Baviera a finales del siglo XVIII, acababa de llegar a Francia, y Vernet fue uno de los primeros pintores en adoptarla. Las pruebas se vendían en negro o, a mayor precio, coloreadas a mano, como esta. El Cleveland Museum of Art la adquirió en 1966."""
facture = """
La litografía permite dibujar directamente sobre la piedra con un lápiz graso y luego imprimir el dibujo sin pasar por el grabado. Vernet saca de ella un trazo flexible, negros aterciopelados y grises matizados, visibles en las piedras del muro y en la sombra proyectada del hombre. Los colores, aplicados después a la acuarela, se reservan a los carteles y a las ropas: se destacan sobre un decorado dejado casi en blanco y negro. La figura, aislada en el centro de la hoja, sin fondo, se asemeja a una lámina de catálogo, lo que conviene a una serie de tipos parisinos."""
details = [
  "La brocha de cola que el cartelero sostiene en la mano derecha.",
  "El título «Raoul, sire de C…» en el cartel azul de la Opéra-Comique.",
  "El cubo de cola colocado al pie de la escalera.",
  "El trapo a rayas metido en el cinturón.",
  "El número «N° 84», arriba a la derecha, que sitúa la lámina en la serie.",
]
themes = ["cartel", "oficio", "parís", "calle", "litografía"]
anecdote = """
Desde la Revolución, el papel blanco estaba reservado a los carteles oficiales de las autoridades: los anuncios de particulares y de teatros debían imprimirse en papel de color. Por eso el muro de Carle Vernet es azul, rosa y amarillo."""
