[[oeuvres]]
titre = "León del monasterio de San Pedro de Arlanza"
artiste = "Espagne, art roman"
annee = "después de 1200"
image = "lion-arlanza.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/471061"
technique = "Fresco trasladado a lienzo, en dos paneles, 332,7 × 335,3 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un león de gesto fiero, mayor que el natural, pintado en el muro de un monasterio de Castilla: uno de los animales fabulosos del arte románico."
description = """
Sobre un fondo dividido en bandas ocre y gris azulado, un inmenso león avanza hacia la izquierda, de perfil, pero vuelve hacia nosotros su cabeza vista de frente. Sus grandes ojos redondos nos miran fijamente bajo unas cejas fruncidas, y su boca muestra dos hileras de dientes. Su melena está hecha de mechones en forma de llamas; su cuerpo rosa está recorrido por líneas flexibles que dibujan los músculos. Su larga cola describe un bucle sobre su lomo y termina en un mechón en forma de hoja. A la izquierda se alza un árbol estilizado de hojas escamadas; a la derecha, una arcada de dos columnas se abre a un fondo oscuro. Debajo, un friso de roleos rojos y blancos está en parte borrado."""
evocation = """
En el arte románico, el león es una imagen de doble sentido: símbolo de fuerza y de vigilancia, puede representar a Cristo resucitado o al guardián del lugar santo, pero también la amenaza del mal. Pintado mayor que el natural en el muro de un monasterio, este león de mirada fija vigila a quienes pasan. Su aspecto, a la vez feroz y cómico, muestra que los pintores conocían al animal sobre todo por imágenes, tejidos, marfiles o manuscritos, más que del natural. El árbol y la arcada evocan un jardín o un palacio. Estos grandes animales formaban parte de un decorado de bestias reales y fabulosas, dragones y otras criaturas, que poblaban los muros."""
histoire = """
El león procede del monasterio benedictino de San Pedro de Arlanza, cerca de Burgos, en Castilla, vinculado a la memoria del conde Fernán González, héroe fundador de Castilla, que fue enterrado allí. Fue pintado después de 1200 en una de las salas del monasterio. Abandonado en el siglo XIX, tras la supresión de las órdenes religiosas en España, el monasterio cae en ruinas; a principios del siglo XX, sus pinturas se separan de los muros y se venden. Una parte se encuentra hoy en el Museo Nacional de Arte de Cataluña, en Barcelona; el león, por su parte, cruzó el Atlántico para unirse a las colecciones medievales del Metropolitan Museum de Nueva York."""
facture = """
La pintura fue probablemente desprendida del muro mediante la técnica del strappo: se pega sobre la superficie pintada una tela impregnada de cola fuerte y luego se arranca, llevándose la delgada capa de color, que se traslada después a un nuevo soporte. Por eso la obra es hoy un fresco sobre lienzo. El pintor románico trabaja con grandes superficies planas, rodeadas por un trazo rojo pardo seguro y rítmico; los pelos, los músculos y las garras se convierten en motivos ornamentales. Las bandas de color del fondo, sin paisaje ni profundidad, y la cenefa en zigzag, a la izquierda, recuerdan los decorados de tejidos preciosos, en particular los de la España musulmana."""
details = [
  "Los grandes ojos redondos y las cejas fruncidas del león, vuelto hacia nosotros.",
  "Las dos hileras de dientes de la boca de gesto fiero.",
