Los aztecas, llegados siglos después del abandono de la ciudad, visitaban sus ruinas como un lugar sagrado: según sus mitos, fue en Teotihuacan donde los dioses, arrojándose a una hoguera, dieron nacimiento al sol y a la luna."""
