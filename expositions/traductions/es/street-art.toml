[[oeuvres]]
titre = "El Buda de la Medicina Bhaishajyaguru (Yaoshi fo)"
artiste = "Chine, dynastie Yuan"
annee = "hacia 1319"
image = "bouddha-de-medecine.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/42716"
technique = "Pigmentos al agua sobre un enlucido de arcilla mezclada con paja, 7,52 × 15,11 m"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una pintura mural de más de quince metros, procedente de un monasterio de Shanxi: el Buda que cura, rodeado de su corte celestial."
description = """
En el centro de este inmenso muro, más alto que sus dos alas, el Buda de la Medicina está sentado de frente, vestido con una túnica roja, ante un gran nimbo claro; con una mano levantada y la otra apoyada en la rodilla, mira de frente. A ambos lados se sientan dos grandes bodhisattvas coronados, también ellos con nimbo, rodeados de personajes de pie con las manos juntas o cargadas de ofrendas. En los lados se alinean guardianes con armadura, armados, de rostros a veces amenazadores. Arriba, seres celestes flotan sobre nubes azules y verdes. Abajo, tres grandes discos claros y pequeñas figuras ocupan el primer plano. Los colores, apagados por el tiempo, mezclan verde, rojo, ocre y blanco."""
evocation = """
Bhaishajyaguru, Yaoshi fo en chino, es el Buda de la Medicina: hizo el voto de curar las enfermedades del cuerpo y del espíritu, y reina sobre una tierra pura de Oriente, hecha de lapislázuli. Los dos bodhisattvas que lo rodean son tradicionalmente los de la luz del sol y de la luz de la luna, y los guardianes con armadura son los generales celestes que protegen a sus fieles. Colocada en la sala de un monasterio, la imagen acogía a monjes y visitantes como una aparición: una corte celestial, ordenada y serena, que ocupaba todo el campo de visión. Ante ella se acudía a rezar por la salud y por una larga vida."""
histoire = """
La pintura fue realizada hacia 1319 para el monasterio inferior de Guangsheng, en Hongtong, en la provincia de Shanxi, en el norte de China, bajo la dinastía mongola de los Yuan. A principios del siglo XX, las pinturas murales del monasterio se venden: esta fue cortada en paneles para ser transportada y luego reensamblada. El coleccionista Arthur M. Sackler la ofreció al Metropolitan Museum en 1965; desde entonces ocupa todo un muro de una galería dedicada al arte chino. Otra gran pintura del mismo monasterio se conserva en el Nelson-Atkins Museum of Art de Kansas City. Como muchos frescos de street art cortados y vendidos, abandonó el lugar para el que fue hecha."""
facture = """
La pintura no es un fresco en sentido estricto: los colores, ligados al agua, se aplicaron sobre un enlucido seco, hecho de arcilla mezclada con paja para que se sujetara mejor al muro. Un decorado así era obra de un taller de pintores profesionales, que trabajaban a partir de modelos y de patrones, y se repartían el trabajo. El dibujo, a la tinta, es de gran flexibilidad en los ropajes y las bufandas que flotan; los colores minerales, verdes, rojos, ocres y blancos, rellenan luego las formas. La composición, estrictamente simétrica y jerarquizada, coloca las figuras principales en el centro y las hace mayores que las demás."""
details = [
  "El gran nimbo claro tras la cabeza del Buda.",
  "La túnica roja del Buda, única mancha de color vivo en el centro.",
  "Las coronas labradas de los dos bodhisattvas sentados.",
  "Los guardianes con armadura, en las alas izquierda y derecha.",
  "Los seres celestes que flotan sobre las nubes, en lo más alto.",
]
themes = ["budismo", "curación", "monasterio", "china", "monumental"]
anecdote = """
El Buda de la Medicina es también venerado en Japón con el nombre de Yakushi: el Yakushi-ji, uno de los grandes templos de Nara, le está dedicado y lleva su nombre."""
