[[artistes]]
nom = "Rome, fin de la République"
vie = "Italia romana, siglos II–I a. C."
biographie = """
En los siglos II y I antes de nuestra era, Roma, dueña de Italia, conquista Grecia y el Oriente helenístico. Obras de arte y artistas griegos afluyen, y la aristocracia romana adopta con pasión la cultura griega. Las familias ricas se hacen construir, en la bahía de Nápoles y en torno al Vesubio, lujosas villas de campo y de costa, donde se retiran lejos de los asuntos de Roma. Boscoreale, Oplontis, Pompeya o Herculano han conservado numerosos ejemplos. Sus muros están enteramente pintados por equipos de artesanos anónimos, que trabajan a partir de modelos griegos y se transmiten sus conocimientos. La erupción del Vesubio, en el año 79 de nuestra era, fijó bajo la ceniza estos decorados, redescubiertos a partir del siglo XVIII."""
style = """
La pintura mural de esta época pertenece al segundo estilo pompeyano: el muro ya no se limita a imitar placas de mármol, sino que se abre en trampantojo a columnatas, cornisas, jardines o grandes figuras. Los colores son intensos, domina el rojo, y el modelado por la luz procede de la pintura griega. Estos frescos son casi todo lo que nos queda de la gran pintura antigua."""

[[artistes]]
nom = "Rome impériale"
vie = "Roma y el Imperio romano, finales del siglo I a. C. – siglo I d. C."
biographie = """
En el año 27 antes de nuestra era, Octavio recibe el nombre de Augusto y se convierte en el primer emperador romano. La paz que instaura favorece un auge sin precedentes de la construcción: en Roma, templos y foros; en Campania, villas de la familia imperial y casas de notables. Los pintores, organizados en talleres, decoran los muros de estancia en estancia, con especialistas para los fondos, los ornamentos y las figuras. El gusto cambia varias veces en un siglo: tras las arquitecturas en trampantojo de finales de la República llegan muros más sobrios y luego, bajo Nerón y sus sucesores, decorados exuberantes. En Pompeya, duramente golpeada por un terremoto en el año 62, numerosas casas se estaban redecorando cuando la erupción del 79 las sepultó."""
style = """
Bajo Augusto, el tercer estilo pompeyano vuelve a cerrar el muro: grandes fondos lisos, negros, rojos o blancos, finas arquitecturas puramente decorativas y, en el centro, un cuadro de mito o de paisaje. El cuarto estilo, en el siglo I de nuestra era, reintroduce la profundidad en arquitecturas de fantasía, ligeras e imposibles, pobladas de figuras, animales y criaturas fabulosas."""

[[artistes]]
nom = "Teotihuacan"
vie = "Altiplano central de México, hacia el siglo I a. C. – siglo VII d. C."
biographie = """
Teotihuacan se alza en un valle al noreste de la actual Ciudad de México. Modesta aglomeración en el siglo I antes de nuestra era, se convierte en pocos siglos en una metrópolis organizada según un plano regular, en torno a una gran avenida bordeada por la pirámide del Sol y la pirámide de la Luna. Entre 200 y 650 es la mayor ciudad de las Américas, poblada por más de cien mil habitantes, centro religioso, militar y comercial cuya influencia se extiende hasta el país maya. Sus habitantes viven en vastos conjuntos residenciales, de muros cubiertos de pinturas. Se ignora la lengua que hablaban y el nombre que daban a su ciudad. Hacia el siglo VI o VII, el centro es incendiado y la ciudad declina; los aztecas, que veneraban sus ruinas, la llamaron Teotihuacan, «el lugar de los dioses»."""
style = """
La pintura de Teotihuacan es una de las grandes tradiciones murales del mundo antiguo. Se basa en un enlucido de cal alisado y en una paleta de pigmentos minerales, en la que domina el rojo. Las figuras, dioses, sacerdotes, animales, plantas, se ven de perfil, estilizadas y repetidas en procesiones o en motivos, sin perspectiva ni sombra, en un orden que recuerda la escritura y el textil."""

[[artistes]]
nom = "Carle Vernet"
vie = "Burdeos, 14 de agosto de 1758 – París, 17 de noviembre de 1836"
biographie = """
Antoine Charles Horace Vernet, llamado Carle Vernet, es hijo de Claude Joseph Vernet, célebre pintor de marinas, y padre de Horace Vernet, futuro pintor de batallas: tres generaciones de pintores en un siglo. Formado junto a su padre y al pintor Lépicié, obtiene en 1782 el gran premio de Roma. Durante la Revolución pierde a su hermana, guillotinada en 1794. Se da a conocer por sus caballos, que dibuja y pinta con una ciencia poco común, sus escenas de caza y de carreras, y por sus caricaturas de los Incroyables y las Merveilleuses, los jóvenes elegantes del Directorio. Bajo el Imperio, pinta las campañas de Napoleón. A partir de los años 1810, se apodera de la litografía, recién llegada a Francia, y multiplica las láminas de caballos, de soldados y de tipos parisinos, entre ellas una serie de Gritos de París."""
style = """
Carle Vernet es un observador vivo y preciso, más cómodo en el dibujo y la estampa que en la gran pintura de historia. Sus caballos, esbeltos y nerviosos, hicieron su reputación; sus escenas de calle, tomadas del natural, mezclan exactitud documental y humor ligero. Figura entre los artistas que hicieron de la litografía un arte popular a principios del siglo XIX."""

[[artistes]]
nom = "Jules Chéret"
vie = "París, 31 de mayo de 1836 – Niza, 23 de septiembre de 1932"
biographie = """
Hijo de un obrero tipógrafo, Jules Chéret entra a los trece años como aprendiz en casa de un litógrafo y sigue clases nocturnas de dibujo. Establecido en Londres de 1859 a 1866, descubre allí los grandes carteles ingleses en color. A su regreso, funda en París su propia imprenta, equipada con prensas inglesas, y revoluciona el cartel francés: grandes litografías en color, figuras en movimiento, rotulado integrado en la imagen. En 1881 cede su taller a la imprenta Chaix, de la que sigue siendo director artístico. Dibuja para los teatros, los music-halls, los bailes, los aperitivos o el petróleo de alumbrado, más de un millar de carteles en total, y recibe la Legión de Honor en 1890. Hacia 1900 se dedica más a la pintura decorativa. Retirado en Niza, muere allí a los noventa y seis años; el museo de Bellas Artes de la ciudad lleva su nombre."""
style = """
Chéret es el padre del cartel ilustrado moderno. Sus composiciones, hechas para la calle, se basan en unos pocos colores vivos superpuestos, una figura femenina ligera y danzante, y letras dibujadas que forman cuerpo con la imagen. Da a la publicidad la gracia de la fiesta galante, y abre el camino a Toulouse-Lautrec, a Mucha y a todos los cartelistas de la Belle Époque."""

[[artistes]]
nom = "Chine, dynastie Yuan"
vie = "China, 1271–1368"
biographie = """
Nieto de Gengis Kan, Kublai Kan funda en 1271 la dinastía Yuan y completa algunos años más tarde la conquista de China: por primera vez, todo el país está gobernado por soberanos mongoles, desde su capital de Dadu, la actual Pekín. Los Yuan protegen ampliamente las religiones, y el budismo, en sus formas china y tibetana, goza de gran favor. En las provincias del norte, y en particular en Shanxi, se construyen o restauran templos y monasterios, y sus salas se cubren de pinturas murales por talleres itinerantes de pintores profesionales, de los que solo nos han llegado algunos nombres a través de inscripciones. En 1368, una revuelta expulsa a los mongoles y funda la dinastía Ming."""
style = """
La pintura mural religiosa de los Yuan prolonga las tradiciones de los Tang y los Song: composiciones monumentales y simétricas, divinidades hieráticas en el centro, cortejos de figuras a los lados, dibujo a la tinta de gran flexibilidad, realzado con colores minerales. Se distingue de la pintura de los letrados, a la tinta sobre seda o sobre papel, que triunfa en la misma época."""

[[artistes]]
nom = "Espagne, art roman"
vie = "Reinos cristianos del norte de la península ibérica, siglos XI–XIII"
biographie = """
En los siglos XI y XII, los reinos cristianos del norte de España, Castilla, León, Aragón, condados catalanes, se extienden hacia el sur a costa de la España musulmana. A lo largo de los caminos de la peregrinación a Santiago de Compostela, iglesias y monasterios se multiplican, y sus muros se cubren de pinturas: ábsides donde trona Cristo en majestad, naves donde se despliegan relatos bíblicos, salas monásticas adornadas con animales y motivos. Los pintores, a menudo itinerantes, trabajan de una obra a otra y difunden los modelos venidos de Francia, de Italia o de Bizancio, pero también del arte de la España musulmana. En el siglo XX, muchas de estas pinturas fueron separadas de los muros para ser salvadas o vendidas, y se encuentran hoy en Barcelona, en Madrid o en Estados Unidos."""
style = """
La pintura románica española se reconoce por sus grandes superficies planas de colores vivos, rodeadas de un trazo grueso, por sus figuras estilizadas de grandes ojos y por sus fondos en bandas horizontales, sin paisaje ni profundidad. Hombres y animales se convierten en ornamentos poderosos, hechos para leerse de lejos, en la penumbra de las iglesias."""
