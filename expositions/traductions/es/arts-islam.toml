[[oeuvres]]
titre = "Jarra calada con arpías y esfinges"
artiste = "Céramistes de Kashan et d'Ispahan"
annee = "1215–1216 (612 de la hégira)"
image = "cruche-kashan.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Pierced_Jug_with_Harpies_and_Sphinxes_MET_DP170372.jpg"
technique = "Pasta silícea calada, pintada bajo vidriado turquesa transparente, altura 20,8 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una jarra de 21 cm, presentada ampliada, de doble pared: la pared exterior, calada como un encaje, alberga arpías y esfinges."
description = """
La jarra tiene una panza redonda, un cuello recto y un asa. Su pared exterior está perforada \
de parte a parte: entre tallos que se enroscan, se distinguen arpías, aves de \
cabeza humana, esfinges y cuadrúpedos moteados que corren. Tras este \
encaje, una segunda pared, llena, contiene el líquido. El decorado está pintado en negro \
y en azul de cobalto, y luego recubierto de un vidriado turquesa transparente que da a \
todo el objeto su color de mar. Bajo el borde del cuello y en la parte baja de la panza, dos \
bandas llevan inscripciones persas en letras negras sobre fondo turquesa."""
evocation = """
Las inscripciones son poemas. Alrededor del cuello corren versos del poeta persa Rukn \
al-Din Qummi; cerca de la base, un poema de amor anónimo, en el que el amante se \
lamenta de haber atado su alma a los bucles de la amada, contiene la fecha de fabricación. \
La jarra pertenece al mundo refinado de los banquetes y de la poesía. Las criaturas \
híbridas, arpías y esfinges, son frecuentes en el arte de Irán de esta época; se \
han visto en ellas figuras de buena suerte o imágenes de un paraíso poblado de seres \
maravillosos, más que los monstruos de la mitología griega cuyo nombre llevan."""
histoire = """
Fechada en 612 de la hégira, es decir, 1215-1216, la jarra se hizo unos años antes de \
las invasiones mongolas que asolan Irán a partir de 1219. Se atribuye a \
Kashan, ciudad del centro de Irán que era entonces el gran foco de la cerámica de \
lujo: se producía allí vajilla pintada, con reflejo metálico o esmaltada, y azulejos \
para los santuarios. Se conocen varias jarras caladas de este tipo, algunas de las cuales \
llevan una fecha, lo que las convierte en referencias preciosas para los historiadores. \
Esta fue comprada en 1932 por el Metropolitan Museum de Nueva York."""
facture = """
La jarra es de pasta silícea, una mezcla de cuarzo molido, frita de vidrio y \
un poco de arcilla blanca, puesta a punto para imitar la blancura y la finura de la \
porcelana china. El alfarero monta primero la pared interior y luego la pared \
exterior, que cala con cuchillo cuando la pasta aún no está del todo seca. \
Pinta después el decorado en negro y en azul, y lo cubre todo con un vidriado \
turquesa. El trabajo exige gran habilidad: la pared calada, muy frágil, se \
rompe al menor movimiento en falso."""
details = [
  "Los dos rostros humanos de las arpías, en medio de la panza.",
  "La pared interior, más clara, que se entrevé por los agujeros.",
  "Los cuadrúpedos moteados que corren alrededor del cuello.",
  "Las bandas de poesía persa, bajo el borde y cerca de la base.",
]
themes = ["cerámica", "poesía", "criaturas", "irán", "turquesa"]
anecdote = """
Kashan ha dado su nombre a la cerámica: en persa, la palabra kashi designa el azulejo de \
revestimiento esmaltado. En 1301, Abu'l-Qasim, miembro de una familia de alfareros de la ciudad, \
escribe un tratado que describe la fabricación de la pasta silícea."""
salle = 4
mur = "nord"
position = 0.0
largeur = 0.75

[[oeuvres]]
titre = "Mihrab de la madrasa Imami de Isfahán"
artiste = "Céramistes de Kashan et d'Ispahan"
annee = "1354–1355 (755 de la hégira)"
image = "mihrab-isfahan.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Mihrab_(Prayer_Niche)_MET_DP235035.jpg"
technique = "Mosaico de azulejos de cerámica con vidriado monocromo, tallados y ensamblados, 343,1 × 288,7 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El nicho de oración de una escuela coránica de Isfahán, hecho de miles de fragmentos de cerámica: un revestimiento de arquitectura de más de tres metros."
description = """
Un nicho de arco apuntado se hunde en un gran marco rectangular. El marco está bordeado \
por una ancha banda de escritura: altas letras blancas sobre fondo azul oscuro, que \
suben por los lados y corren por arriba. Más cerca del arco, una banda blanca \
lleva una escritura angulosa, el cúfico, en letras azul oscuro. Sobre el arco, \
roleos blancos y turquesa se enlazan sobre fondo azul. En el hueco del nicho, \
una red de estrellas y hexágonos cubre la semicúpula, y luego una siembra de flores y \
de aspas tapiza el fondo, interrumpida por un panel rectangular: una \
inscripción en escritura cursiva, blanca y dorada. Todo está hecho de pequeños trozos de \
cerámica."""
evocation = """
El mihrab indica a los fieles la dirección de La Meca, hacia la que rezan; es \
el corazón de toda mezquita y de toda sala de oración. Sus inscripciones \
explican su sentido. La gran banda cita versículos de la sura 9 del Corán, que \
hablan de quienes cuidan las mezquitas de Dios; el arco lleva palabras del \
Profeta, y el panel central una sentencia según la cual la mezquita es la morada \
de los hombres piadosos. La luz del sol, deslizándose por las facetas desiguales de la \
cerámica, hacía centellear todo el nicho."""
histoire = """
Este mihrab adornaba una madrasa, una escuela de teología, fundada en 755 de la hégira, es decir, \
en 1354, en Isfahán, y llamada hoy madrasa Imami. Irán vivía entonces bajo \
dinastías locales, tras el hundimiento del imperio mongol de los ilkhánidas. Desmontado a \
finales de los años 1920, el mihrab se envía a Filadelfia, donde el museo de la \
universidad lo conserva, y luego el Metropolitan Museum de Nueva York lo adquiere en 1939. A \
mediados de los años 1920, alfareros de Isfahán habían restaurado una parte: la parte baja \
del nicho y el comienzo y el final de la gran banda de inscripción."""
facture = """
Es un mosaico de cerámica. Los azulejos se cuecen primero, cada uno cubierto de un \
solo color: azul oscuro, turquesa, blanco, amarillo ocre, verde. Se tallan después \
en pequeñas piezas siguiendo el dibujo y luego se ensamblan boca abajo, antes de \
verter mortero por el dorso para formar grandes paneles. La técnica, más lenta que \
la pintura sobre azulejo, da colores francos y contornos de una nitidez \
perfecta. Se desarrolla en Irán en el siglo XIV y cubrirá, en los siglos siguientes, \
las cúpulas y las fachadas de las grandes mezquitas."""
details = [
  "El panel central del nicho, con su inscripción blanca y dorada.",
  "Las altas letras blancas de la gran banda sobre fondo azul oscuro.",
  "La banda blanca de escritura cúfica que sigue el trazado del arco.",
  "Las estrellas y los hexágonos de la semicúpula.",
  "Las finas bandas de rombos que separan cada parte del decorado."
]
themes = ["cerámica", "arquitectura", "oración", "caligrafía", "irán"]
anecdote = """
El mihrab pesa más de dos toneladas. Desmontado en paneles en Isfahán, cruzó \
el Atlántico antes de ser vuelto a montar en Nueva York, donde constituye uno de los referentes de las \
galerías de arte islámico del Metropolitan Museum."""
salle = 4
mur = "est"
position = 0.0
largeur = 2.88

[[oeuvres]]
titre = "Plato con dos pájaros entre flores"
artiste = "Empire ottoman"
annee = "hacia 1575–1590"
image = "plat-iznik.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Dish_Depicting_Two_Birds_among_Flowering_Plants_MET_DP131621.jpg"
technique = "Pasta silícea pintada bajo vidriado transparente, diámetro 28,4 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un plato de Iznik de 28 cm de diámetro, presentado ampliado: dos pájaros en un ramo de claveles, tulipanes y jacintos."
description = """
Sobre el fondo blanco del plato, un ramo brota de una mata de largas hojas verdes. \
Se reconocen en él una gran flor roja abierta, un clavel rojo, jacintos y un \
tulipán azules, y una rama de flores de ciruelo. Dos pájaros azul y verde, de \
larga cola, se han posado entre los tallos: uno, arriba, se inclina hacia una flor, \
el otro, abajo, se sostiene sobre una gran hoja dentada. El ala, el borde del plato, \
está cubierta de una siembra de espirales blancas sobre fondo azul, interrumpida por reservas \
blancas adornadas con pequeñas flores rojas. El borde, recortado en festones, está perfilado con un \
filete pardo."""
evocation = """
Las flores de Iznik son las de los jardines otomanos: el tulipán, el clavel, el jacinto \
y la rosa, que la corte gustaba de cultivar y que se encuentran en los azulejos, los \
tejidos y las encuadernaciones. El decorado no es un ramo copiado del natural, sino un jardín \
ideal, donde los tallos se doblan sin romperse y cada flor conserva su color puro. Los \
pájaros, raros en estos platos, añaden movimiento y vida. La cenefa de \
espirales es un recuerdo de las cenefas de olas y de rocas de las porcelanas \
chinas, muy coleccionadas en la corte de Estambul."""
histoire = """
La ciudad de Iznik, la antigua Nicea, al noroeste de Anatolia, produce a partir de \
finales del siglo XV una cerámica fina, al principio azul y blanca a imitación de la \
porcelana china. A mediados del siglo XVI, sus talleres trabajan para la corte \
y para las grandes mezquitas de Estambul, revestidas de miles de azulejos. Este plato \
data de la gran época de Iznik, bajo el reinado de Murad III, de 1574 a 1595. Fue \
donado al Metropolitan Museum en 1959 por James J. Rorimer, entonces director del museo, \
en homenaje al conservador Maurice S. Dimand."""
facture = """
El plato es de pasta silícea, recubierta de un engobe blanco muy puro que sirve de fondo. \
El pintor traza los contornos en negro y luego aplica el azul de cobalto, el turquesa, el \
verde y el rojo, antes de cubrirlo todo con un vidriado transparente y brillante. El \
rojo, puesto a punto hacia mediados del siglo XVI, está hecho de una tierra rica en hierro; \
aplicado en capa espesa, forma un ligero relieve bajo los dedos. Dominar este rojo \
sin que corra o ennegrezca en la cocción es una de las grandes proezas de los alfareros \
de Iznik."""
details = [
  "El rojo en relieve del clavel y de la gran flor, en lo alto del ramo.",
  "El pájaro de arriba que se inclina hacia una flor.",
  "Las espirales blancas sobre fondo azul del ala.",
  "El tulipán azul, al pie del ramo.",
]
themes = ["cerámica", "flores", "pájaros", "otomanos", "iznik"]
anecdote = """
En el siglo XIX, los coleccionistas europeos llamaban a estas cerámicas «lozas de \
Rodas», porque muchas habían sido compradas en la isla de Rodas. Solo más tarde se \
devolvieron a Iznik, cuando se reconoció su verdadero origen."""
