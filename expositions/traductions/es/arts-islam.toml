[[oeuvres]]
titre = "Píxide de al-Mughira"
artiste = "Califat de Cordoue"
annee = "968 (357 de la hégira)"
image = "pyxide-al-mughira.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Pyxide_d'al-Mughira_-_Musée_du_Louvre_Arts_de_l'Islam_OA_4068.jpg"
technique = "Marfil de elefante esculpido, altura aproximada 15 cm"
collection = "Museo del Louvre, París"
note = "Una caja de marfil de unos quince centímetros, presentada ampliada, esculpida para un hijo del califa de Córdoba."
description = """
La caja es un cilindro cerrado por una tapa en cúpula. Toda su superficie está esculpida \
en relieve profundo. En la panza, cuatro grandes medallones de ocho lóbulos, bordeados de \
perlas, encierran cada uno una escena. El que se ve aquí muestra a dos jinetes, a \
uno y otro lado de una palmera, que recogen dátiles; águilas se posan en las \
palmas. Los demás medallones representan una escena de corte, con un tañedor de laúd, \
leones que atacan toros y jóvenes que sacan huevos de los nidos. Entre los \
medallones bullen animales, aves y follaje. En el borde de la \
tapa, una inscripción en letras cúficas rodea la caja."""
evocation = """
La inscripción invoca la bendición de Dios, la alegría y la dicha sobre al-Mughira, \
hijo del comendador de los creyentes, y da la fecha de 357 de la hégira. Al-Mughira era \
el hijo menor del califa Abd al-Rahman III. Los historiadores han propuesto leer las \
imágenes como un mensaje político: la palmera, emblema de los omeyas llegados de Siria, \
la escena de corte, las fieras que derriban a sus presas. Se ha visto en ello un recordatorio de los \
derechos del joven príncipe a la sucesión, o, por el contrario, una advertencia. Estas \
lecturas siguen debatiéndose; la caja, hecha para contener perfumes o joyas, \
es en todo caso un presente de muy alto rango."""
histoire = """
La píxide fue esculpida en 968, sin duda en los talleres de Madinat al-Zahra, la \
ciudad-palacio fundada cerca de Córdoba por Abd al-Rahman III. Su destinatario tuvo un \
final trágico: a la muerte de su hermanastro, el califa al-Hakam II, en 976, al-Mughira \
fue ejecutado por los partidarios del joven Hisham II, que temían que reclamase \
el trono. Este destino da un relieve particular a los votos de dicha grabados en la \
tapa. La caja pertenece hoy al departamento de Artes del Islam del \
Louvre, que conserva uno de los más bellos conjuntos de marfiles andalusíes."""
facture = """
La caja está tallada en una sección de colmillo de elefante, un marfil llegado de África \
por las rutas comerciales. El escultor vacía el cilindro y luego libera las figuras \
en un relieve tan profundo que algunas partes casi se separan del fondo. Los \
medallones perlados, los follajes y los animales se imbrican sin dejar vacío. El \
relieve ha perdido los colores o las incrustaciones que quizá lo animaban. Los \
talleres del califato de Córdoba produjeron, en pocas décadas, un conjunto de \
píxides y de cofrecillos esculpidos para la familia y el entorno de los califas."""
details = [
  "Los dos jinetes que recogen dátiles a uno y otro lado de la palmera.",
  "Las águilas posadas en las palmas, sobre los jinetes.",
  "La inscripción cúfica alrededor de la tapa, que nombra a al-Mughira.",
  "Las fieras y los animales esculpidos en la cúpula de la tapa.",
]
themes = ["marfil", "al-andalus", "corte", "palmera", "omeyas"]
anecdote = """
La palmera recuerda a Abd al-Rahman I, el fundador de la dinastía omeya de España, \
llegado de Siria: según la tradición, compuso un poema a una palmera de su jardín de \
Córdoba, exiliada como él lejos de su tierra natal."""
