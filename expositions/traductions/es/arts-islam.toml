[exposition]
ordre = 22
nom_court = "Artes del Islam"
mouvement = "Artes del Islam"
cadre = "vitrine"
couleur = "#1d5e6b"
titre = "Las artes del Islam, de Córdoba a Isfahán"
artiste = "Córdoba, Kairuán, El Cairo, Kashan, Isfahán, Iznik…"
dates = "siglos IX–XVI"
accroche = "Exposición virtual · Museo de Arte Islámico, Doha"
introduction = """
Desde las orillas del Atlántico hasta Irán, las tierras del Islam han hecho de la escritura, de la \
geometría y del decorado vegetal un lenguaje común, declinado en el pergamino, la lana, \
el vidrio, el metal, el marfil y la cerámica. La visita reúne diez objetos, desde el Corán \
azul de Kairuán hasta las alfombras de las cortes safávida, mameluca y otomana, desde la lámpara de \
mezquita de El Cairo hasta el plato de Iznik. El edificio se inspira en el Museo de Arte Islámico de \
Doha, diseñado por I. M. Pei: un vestíbulo y luego un alto atrio donde se presentan las \
grandes alfombras, en torno al cual se abren tres galerías."""
vitrine = "tapis-ardabil.jpg"

[musee]
nom = "Museo de Arte Islámico"
ville = "Doha, Catar"
architecte = "Ieoh Ming Pei"
construction = "inaugurado en 2008"
presentation = """
Para construir en Doha un museo dedicado a las artes del Islam, el emirato de Catar recurre \
al arquitecto sino-estadounidense I. M. Pei, autor de la pirámide del Louvre. Este \
viaja para estudiar la arquitectura islámica y encuentra su modelo en El Cairo, en la \
fuente de abluciones de la mezquita de Ibn Tulun, una construcción del siglo XIII \
de geometría desnuda. El museo, inaugurado a finales de 2008, se alza en una isla \
ganada al mar, al final del malecón: un apilamiento de volúmenes cúbicos de \
piedra caliza clara, que se estrechan en gradas hasta una torre central. En el interior, \
un atrio de varias plantas asciende hasta una cúpula horadada por un óculo, donde el \
cuadrado se transforma en octógono y luego en círculo; un inmenso ventanal se abre al mar \
y a la ciudad. Las galerías, diseñadas por Jean-Michel Wilmotte, están sumidas en la \
penumbra: cada objeto brilla allí en su vitrina. Las colecciones abarcan el arte \
islámico desde España hasta Asia central y la India."""
ici = """
El edificio de ARTEON retoma la disposición del museo de Doha: un vestíbulo y luego un \
atrio muy alto del que parten las galerías. Se entra por el sur en «El vestíbulo del \
malecón», de muros de piedra clara. Al norte se abre «El atrio · Las grandes \
alfombras», de dieciséis metros de altura, donde se tienden la alfombra de Ardabil y una alfombra otomana. \
Tres galerías de seis metros de altura lo rodean: al oeste «El Cairo de los mamelucos \
», al este «De Kashan a Iznik · La tierra y el fuego», y al norte, en el eje, «\
Kairuán y Córdoba · La escritura y el marfil»."""

