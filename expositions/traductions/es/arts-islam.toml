[[artistes]]
nom = "Iran safavide"
vie = "Irán, 1501–1736"
biographie = """
La dinastía safávida toma su nombre del jeque Safi al-Din, un maestro sufí muerto en 1334, \
cuya cofradía, establecida en Ardabil, al noroeste de Irán, gana con el correr de las \
generaciones un poder militar. En 1501, su descendiente Ismail, de apenas \
catorce años, se hace proclamar sha en Tabriz e impone el chiismo duodecimano como \
religión de Estado, lo que marca duraderamente a Irán. Su hijo Tahmasp, que reina de 1524 \
a 1576, protege las artes: su taller real reúne calígrafos, pintores, encuadernadores \
y dibujantes, que proporcionan también modelos a los tejedores de alfombras y de \
sedas. La capital pasa de Tabriz a Qazvin y luego, bajo Abbas I, a Isfahán, que \
el sha transforma a partir de 1598 en torno a una inmensa plaza bordeada de mezquitas y \
de palacios. Las alfombras safávidas, de medallones, de jardines o de animales, tejidas de lana \
y a veces de seda, de hilos de oro y de plata, se regalan a los soberanos extranjeros y se \
exportan hasta Europa. La dinastía se debilita en el siglo XVII; en 1722, tropas \
afganas toman Isfahán, y el último soberano safávida es apartado en \
1736."""
style = """
El arte safávida ama las composiciones amplias y ordenadas: un medallón central, \
enjutas, un campo cubierto de roleos floridos, nubes y palmetas que \
se enroscan con soltura. Los mismos dibujos pasan del manuscrito a la alfombra, de la \
encuadernación a la cerámica, gracias a los modelos del taller real. Las alfombras de corte, de una \
finura extrema, han fijado durante siglos la imagen de la «alfombra persa»."""

[[artistes]]
nom = "Sultanat mamelouk"
vie = "Egipto y Siria, 1250–1517"
biographie = """
Los mamelucos son en origen soldados esclavos, comprados de niños en las estepas \
de Asia central o del Cáucaso, convertidos y formados en el oficio de las armas. En 1250, los \
de la dinastía ayubí se apoderan del poder en Egipto. Diez años después, en 1260, \
detienen a los mongoles en Ayn Yalut, en Palestina, y luego expulsan a los últimos Estados \
cruzados con la toma de Acre en 1291. Su sultanato se extiende de Egipto a Siria y \
protege las ciudades santas de La Meca y Medina. El poder no se transmite allí \
siempre de padre a hijo: los emires, jefes militares, se disputan el trono. El \
Cairo se convierte en una de las mayores ciudades del mundo, y los sultanes y los emires la \
cubren de mezquitas, madrasas, mausoleos y hospitales, a menudo reunidos en \
complejos. El reinado de al-Nasir Muhammad, en la primera mitad del siglo XIV, \
marca una cumbre. Cada emir ostenta un emblema que recuerda su cargo en la corte: la \
copa del copero, la espada del portaespada. En 1516 y 1517, los ejércitos otomanos de \
Selim I conquistan Siria y luego Egipto, y ponen fin al sultanato."""
style = """
El arte mameluco es un arte de encargo, al servicio de una élite militar que afirma \
su rango mediante sus fundaciones piadosas. Sobresale en los objetos preciosos: el vidrio \
esmaltado y dorado, el metal incrustado de plata y oro, los coranes de gran formato y luego \
las alfombras. Las grandes inscripciones, de letras altas y esbeltas, se convierten allí poco \
a poco en el decorado principal, junto a los emblemas y a una geometría rigurosa."""

[[artistes]]
nom = "Empire ottoman"
vie = "Anatolia, Balcanes y Próximo Oriente, hacia 1300–1922"
biographie = """
El Imperio otomano nace hacia 1300 de un pequeño principado turco del noroeste de \
Anatolia, dirigido por Osmán, que le da su nombre. Sus sucesores se extienden por \
Anatolia y los Balcanes. En 1453, Mehmed II toma Constantinopla, que se convierte \
con el nombre de Estambul en la capital del imperio. En el siglo XVI, Selim I conquista \
Siria y Egipto en 1516-1517, y su hijo Solimán el Magnífico, que reina de 1520 a \
1566, lleva el imperio a su apogeo, de Hungría a Irak y al norte de África. La \
corte organiza la creación artística: el taller imperial de dibujo, el nakkaşhane, \
proporciona los modelos de los manuscritos, los tejidos, las alfombras y las cerámicas, y \
el arquitecto Sinan construye en Estambul y en Edirne mezquitas cubiertas de azulejos \
de Iznik. Los talleres de alfombras de Anatolia, como los de Ushak, exportan sus \
producciones hacia Europa, donde los pintores las representan en sus cuadros. \
El imperio, debilitado a partir del siglo XVIII, desaparece tras la Primera Guerra \
Mundial, en 1922."""
style = """
El estilo de la corte otomana, fijado a mediados del siglo XVI, es un arte de la flor: \
tulipanes, claveles, jacintos, rosas y capullos de ciruelo, mezclados con largas hojas \
dentadas en forma de sable. Los colores son francos, con el azul, el turquesa, \
el verde y un rojo brillante. El mismo repertorio pasa del dibujo del taller imperial \
a los azulejos, los platos, las sedas y las alfombras."""

[[artistes]]
nom = "Céramistes de Kashan et d'Ispahan"
vie = "Irán, siglos XII–XIV"
biographie = """
A partir del siglo XII, Kashan, ciudad del centro de Irán al pie de las montañas, \
se convierte en el gran foco de la cerámica de lujo del mundo iranio. Sus alfareros ponen \
a punto o perfeccionan la pasta silícea, blanca y fina, y aplican en ella todas \
las técnicas: decoración pintada bajo vidriado, reflejo metálico de brillos dorados, esmaltes \
de pequeño fuego. Algunas familias de alfareros son conocidas por sus firmas en \
azulejos y vasos, como la de Abu Tahir, uno de cuyos miembros, Abu'l-Qasim, redacta en \
1301 un tratado sobre la fabricación de la cerámica. Los talleres de Kashan suministran \
revestimientos con reflejo metálico para los santuarios de todo Irán, mihrabs y frisos de \
azulejos en estrella y en cruz. Las invasiones mongolas, a partir de 1219, asolan el \
país, pero la producción se reanuda bajo la dinastía mongola de los ilkhánidas, que \
encargan grandes decorados de cerámica. En el siglo XIV, en Isfahán, en Yazd o en \
Kermán, se desarrolla el mosaico de cerámica, hecho de piezas talladas, que cubrirá \
más tarde las fachadas de las mezquitas timúridas y safávidas."""
style = """
Los ceramistas iranios de esta época buscan el brillo de la porcelana china y \
lo superan por el color: el turquesa, el azul de cobalto, el reflejo dorado. Sus \
decorados asocian poesía persa, figuras de corte, criaturas fantásticas y \
caligrafía coránica. El mosaico de cerámica del siglo XIV lleva el arte del \
revestimiento a una precisión geométrica nueva."""

[[artistes]]
nom = "Ifriqiya"
vie = "Túnez y este de la actual Argelia, siglos IX–X"
biographie = """
Ifriqiya es el nombre árabe de la provincia que corresponde aproximadamente a la actual \
Túnez. Conquistada a finales del siglo VII, tiene por capital Kairuán, fundada en \
670. En 800, el califa abasí de Bagdad confía su gobierno a Ibrahim ibn \
al-Aglab, cuyos descendientes, los aglabíes, reinan durante un siglo reconociendo \
a la vez la autoridad del califa. Reconstruyen la Gran Mezquita de Kairuán, \
cuyo mihrab está adornado con azulejos con reflejo metálico llegados de Irak, y conquistan Sicilia. La \
ciudad es entonces un gran centro de estudios religiosos, y la biblioteca de la Gran \
Mezquita ha conservado hasta nuestros días coranes y libros sobre pergamino. En 909, \
los fatimíes, una dinastía chií que se reclama de Fátima, la hija del Profeta, \
derrocan a los aglabíes y fundan la ciudad de Mahdia, en la costa. En 969, \
conquistan Egipto y fundan El Cairo, donde se instalan unos años más \
tarde, dejando Ifriqiya a sus gobernadores."""
style = """
Los coranes de Ifriqiya de esta época se copian sobre pergamino, en un formato más \
ancho que alto, en escritura cúfica: letras angulosas, de ligaduras alargadas, \
pocas líneas por página, a menudo sin puntos ni vocales. El oro, la plata y los \
colores sirven para marcar los versículos y las suras. El Corán azul lleva este lujo al \
extremo, con sus letras de oro sobre fondo teñido."""

[[artistes]]
nom = "Califat de Cordoue"
vie = "Al-Ándalus (península ibérica), 929–1031"
biographie = """
En 756, Abd al-Rahman, un príncipe omeya escapado de la matanza de su familia en Damasco, \
funda en Córdoba un emirato independiente de Bagdad. En 929, su descendiente Abd al-Rahman \
III se proclama califa, comendador de los creyentes, frente a los califas abasíes de Bagdad \
y a los fatimíes del norte de África. Hace construir cerca de Córdoba una ciudad-palacio, \
Madinat al-Zahra, donde trabajan los mejores artesanos del país. Su hijo al-Hakam II, \
que reina de 961 a 976, príncipe letrado que reúne una inmensa biblioteca, amplía la \
Gran Mezquita de Córdoba y hace colocar en ella mosaicos de oro por un artesano enviado desde \
Bizancio. Tras su muerte, el poder pasa al visir al-Mansur, el Almanzor de las crónicas \
cristianas, que gobierna en nombre del joven califa Hisham II. A comienzos del siglo XI, \
estalla una guerra civil, Madinat al-Zahra es saqueada y el califato se abole en 1031 \
; al-Ándalus se divide en pequeños reinos. Muchos marfiles del califato han ido a \
parar después a los tesoros de las iglesias cristianas."""
style = """
Los talleres del califato de Córdoba esculpieron en marfil cajas redondas, las \
píxides, y cofrecillos rectangulares, cubiertos de roleos, animales y escenas \
de corte, a menudo con una inscripción a nombre de su destinatario. El decorado, denso y \
simétrico, mezcla herencias del Oriente omeya, de Bizancio y de la Antigüedad."""
