[[oeuvres]]
titre = "Folio del Corán azul"
artiste = "Ifriqiya"
annee = "segunda mitad del siglo IX – mediados del siglo X"
image = "coran-bleu.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Folio_from_the_%22Blue_Qur%27an%22_MET_DP167100.jpg"
technique = "Oro y plata sobre pergamino teñido con índigo, 30,4 × 40,2 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Oro sobre un pergamino azul noche: una página de uno de los manuscritos más célebres del arte islámico."
description = """
La página es más ancha que alta. Sobre el pergamino de un azul profundo, quince líneas \
de escritura de oro se alinean con una regularidad perfecta. Las letras, angulosas y \
alargadas en horizontal, pertenecen al cúfico, la más antigua de las grandes \
escrituras del Corán. Están espaciadas de manera que llenen exactamente cada línea, \
aun a costa de partir una palabra de una línea a otra. No hay título ni imagen. A la derecha, \
en el margen, un medallón redondo de plata, hoy ennegrecido por la oxidación, \
marcaba una división del texto. El borde del folio, desgastado e irregular, lleva las \
huellas de los siglos y de los montajes sucesivos."""
evocation = """
La página reproduce un pasaje de la sura 30, ar-Rum, los Romanos. Pero se \
contempla tanto como se lee: el cúfico sin puntos ni vocales se dirigía a \
lectores que ya conocían el texto de memoria, y la belleza de la escritura \
celebraba la palabra divina. El oro sobre fondo azul evoca un cielo nocturno o piedras \
preciosas. Con frecuencia se ha relacionado este lujo con los manuscritos imperiales bizantinos, escritos \
en oro y en plata sobre pergamino púrpura: el Corán azul habría sido una respuesta \
deslumbrante, en el mundo islámico, a esos libros de prestigio."""
histoire = """
El manuscrito, cuyos folios están hoy dispersos, no está firmado ni fechado. \
Su origen sigue discutiéndose: se ha atribuido a Bagdad, a la España omeya o a \
Irán, pero la mayoría de los especialistas piensan hoy en el norte de África, y \
más precisamente en Kairuán, en Túnez. La mayoría de los folios conocidos se \
conservan en Túnez, y un antiguo inventario de la biblioteca de la Gran Mezquita \
de Kairuán parece describir un Corán escrito en oro sobre pergamino azul. Las demás páginas \
se han dispersado en museos y colecciones de todo el mundo."""
facture = """
El pergamino, hecho de piel animal, se tiñó con índigo, una técnica rara. Las \
letras se trazan en oro, y los signos que separaban los versículos se colocaban en \
plata; este metal se ha ennegrecido con el tiempo, como el medallón del margen. El \
calígrafo traza las letras con el cálamo, una caña tallada, respetando \
proporciones precisas: astiles verticales cortos, ligaduras horizontales alargadas. La \
anchura de la página, mayor que su altura, es típica de los coranes cúficos de \
esa época."""
details = [
  "El gran medallón de plata ennegrecida, en el margen derecho.",
  "Las ligaduras horizontales muy alargadas entre ciertas letras.",
  "El pequeño signo redondo dorado que separa dos versículos, hacia abajo a la izquierda.",
  "Los bordes irregulares del pergamino y las huellas de antiguos montajes.",
]
themes = ["corán", "caligrafía", "oro", "manuscrito", "kairuán"]
anecdote = """
El Corán azul es uno de los pocos manuscritos coránicos sobre pergamino teñido. Sus \
folios salen muy raramente al mercado: el Metropolitan Museum de Nueva York solo \
pudo adquirir el suyo en 2004."""
