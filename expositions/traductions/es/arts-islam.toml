[[oeuvres]]
titre = "La alfombra de Ardabil"
artiste = "Iran safavide"
annee = "1539–1540"
image = "tapis-ardabil.jpg"
cadre = "aucun"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Ardabil_Carpet_-_Google_Art_Project.jpg"
technique = "Pelo de lana anudado sobre urdimbre y trama de seda, 1044 × 535,5 cm"
collection = "Victoria and Albert Museum, Londres"
note = "Una de las alfombras fechadas más antiguas: un sol de oro sobre un campo azul noche, firmada y fechada en el año 946 de la hégira."
description = """
De más de diez metros de largo, la alfombra despliega un campo azul noche cubierto de una fina \
red de tallos en espiral, sembrados de flores y palmetas. En el centro, un gran \
medallón amarillo en forma de estrella, de corazón azul pálido, irradia como un sol; está \
rodeado de una corona de medallones ovalados, crema, rojos y verdes. A uno \
y otro lado, en el eje de la alfombra, cuelga una lámpara de mezquita suspendida de cadenas: \
una es más grande que la otra. En los cuatro ángulos, un cuarto del medallón \
central se repite en amarillo. Una ancha cenefa, donde alternan cartuchos alargados y \
medallones lobulados, enmarca el conjunto. En uno de los extremos, un pequeño cartucho claro \
lleva tres líneas de escritura persa: un dístico de poesía, una firma y una \
fecha."""
evocation = """
La inscripción da la clave de la alfombra. Sus dos primeras líneas citan al poeta Hafez: \
«No tengo otro refugio en el mundo que tu umbral; mi cabeza no tiene otro abrigo que esta \
puerta». La tercera firma: «Obra del esclavo del umbral, Maqsud de Kashan, 946». \
El umbral es aquí el de un santuario, y Maqsud se declara humilde servidor, no esclavo \
en sentido propio. Con frecuencia se ha leído el medallón como una cúpula vista desde abajo, de donde \
cuelgan las lámparas, y el campo florido como un jardín del paraíso. La diferencia de \
tamaño de las dos lámparas sigue discutiéndose: efecto de perspectiva, según unos; según \
otros, imperfección deliberada, pues la perfección solo pertenecería a Dios."""
histoire = """
La alfombra habría sido encargada por la corte del sha Tahmasp para el santuario de Ardabil, \
al noroeste de Irán, donde reposa el jeque sufí Safi al-Din, muerto en 1334 y \
antepasado de la dinastía safávida. Viajeros británicos aún la ven allí en 1843. \
Tras un terremoto que daña el santuario, se vende, con una alfombra \
gemela, a una casa de Mánchester que la pone a la venta en 1892. William Morris, \
consultado por el museo, la juzga de una «perfección singular»: el South Kensington \
Museum, futuro Victoria and Albert Museum, la adquiere en marzo de 1893 por 2000 libras. Su \
gemela, más pequeña y privada de su cenefa, que sirvió para repararla, se encuentra hoy \
en el Museo de Arte del Condado de Los Ángeles."""
facture = """
El pelo está hecho de lana anudada, hebra a hebra, sobre una armadura de hilos de seda, a \
razón de unos 5300 nudos por cada cuadrado de diez centímetros de lado. El campo \
emplea una decena de colores obtenidos de tintes naturales, como el índigo o \
la corteza de granada. Un dibujo así supone un modelo preparado por los artistas de la \
corte y luego años de trabajo: hasta diez tejedores pudieron trabajar a la vez \
en el telar. La composición es simétrica en los dos sentidos, en torno al medallón, \
pero la red de roleos del fondo se repite sin fin, como si continuara bajo la \
cenefa."""
details = [
  "El cartucho en uno de los extremos, con los versos de Hafez, la firma y la fecha.",
  "Las dos lámparas suspendidas en el eje, de tamaños diferentes.",
  "El pequeño corazón azul pálido en el centro del gran medallón amarillo.",
  "Los cuartos de medallón amarillos que ocupan los cuatro ángulos del campo.",
  "Las zonas desgastadas cerca de los bordes, donde el pelo ha desaparecido.",
]
themes = ["alfombra", "safávidas", "poesía", "santuario", "luz"]
anecdote = """
En el Victoria and Albert Museum, la alfombra reposa extendida, como en el suelo de un \
santuario, en una gran vitrina instalada en 2006 en el centro de la galería Jameel. \
Para preservar sus colores, solo se ilumina diez minutos, a cada hora y a \
cada media hora."""
salle = 2
mur = "nord"
position = -5.8
largeur = 4.5

[[oeuvres]]
titre = "Alfombra de tres arcadas"
artiste = "Empire ottoman"
annee = "hacia 1575–1590"
image = "tapis-ottoman-arcades.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Carpet_with_Triple-arch_Design_MET_DP166876.jpg"
technique = "Urdimbre y trama de seda, pelo de lana y algodón, nudo asimétrico, 172,7 × 127 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una alfombra de oración de la corte otomana: tres arcos sobre columnas, una lámpara de mezquita y flores al pie de las columnas."
description = """
En el centro de la alfombra, tres arcos apuntados descansan sobre columnas pareadas, finas y \
torsas, asentadas sobre basas escalonadas. El arco del medio, más ancho, deja ver un \
fondo azul oscuro; los dos arcos laterales, un fondo rojo. De la cima del arco central \
cuelga una lámpara de mezquita, de tres cadenillas. Al pie de las columnas crecen \
ramos de flores, tulipanes y claveles. Sobre los arcos, un friso corre de un \
borde a otro, donde se adivina una hilera de pequeños edificios con cúpula. Una ancha \
cenefa azul claro encierra la escena: largas hojas dentadas se enroscan allí \
alrededor de grandes flores abiertas, rojas y pardas."""
evocation = """
La alfombra de oración lleva la imagen de aquello hacia lo que se vuelve el fiel: el arco figura el \
mihrab, el nicho que indica la dirección de La Meca, y la lámpara recuerda el versículo \
coránico que compara la luz de Dios con una lámpara colocada en un nicho. Aquí, el \
nicho único se convierte en una arcada de tres arcos, como el interior de una mezquita; se ha visto en ella \
la evocación de un santuario, incluso de La Meca o de Jerusalén, sin que ninguna \
lectura se imponga. Las flores al pie de las columnas, tulipanes y claveles, son las \
de los jardines otomanos, y transforman el espacio de la oración en jardín."""
histoire = """
Esta alfombra pertenece a un pequeño grupo de alfombras de oración de arcadas tejidas para la corte \
otomana en la segunda mitad del siglo XVI. Sus dibujos proceden del taller \
imperial de dibujo, el nakkaşhane, que proporcionaba los modelos de las cerámicas, los \
tejidos y las encuadernaciones. Tras la conquista de Egipto en 1517, los tejedores de El Cairo \
trabajan para los otomanos, y órdenes del sultán Murad III, en los años \
1580, los hacen venir a Estambul: se duda para estas alfombras entre las dos ciudades, \
inclinándose el Met por Estambul. La alfombra perteneció al coleccionista estadounidense James F. \
Ballard, que la donó al Metropolitan Museum en 1922 junto con gran parte de su \
colección de alfombras."""
facture = """
La alfombra asocia tres fibras: la seda para la urdimbre y la trama, que da una base \
fina y sólida, la lana para la mayor parte del pelo, y el algodón para los blancos, \
más brillantes. El nudo asimétrico y la gran densidad del tejido permiten \
curvas flexibles, lejos de los dibujos geométricos de las alfombras de aldea. El estilo floral \
de la corte, con sus hojas dentadas en forma de sable y sus tulipanes, es el mismo \
que el de los azulejos de Iznik de la misma época. Los fondos rojos y azules, desgastados, \
dejan ver las variaciones de los baños de tinte."""
details = [
  "La lámpara de mezquita suspendida bajo el arco central, de tres cadenillas.",
  "Las columnas pareadas, torsas, sobre sus basas escalonadas.",
  "Los tulipanes y los claveles que crecen al pie de las columnas.",
  "La hilera de edificios con cúpula en el friso sobre los arcos.",
]
themes = ["alfombra", "oración", "otomanos", "flores", "arquitectura"]
anecdote = """
Las lámparas representadas en las alfombras de oración otomanas son las, de vidrio o de \
cerámica, que colgaban realmente en las mezquitas. La galería de El Cairo presenta \
una, hecha para el emir Qawsun dos siglos y medio antes."""
salle = 2
mur = "nord"
position = 5.0
largeur = 1.6

[[oeuvres]]
titre = "Alfombra mameluca"
artiste = "Sultanat mamelouk"
annee = "principios del siglo XVI"
image = "tapis-mamelouk.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Mamluk_Carpet_MET_DP168735.jpg"
technique = "Lana (urdimbre, trama y pelo), nudo asimétrico, 213,4 × 266,7 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Rojo, azul y verde: un calidoscopio de estrellas y octógonos tejido en El Cairo, en vísperas de la conquista otomana."
description = """
La alfombra, más ancha que alta, es enteramente geométrica. En el centro, un gran \
medallón octogonal verde azulado encierra una roseta roja donde se entrelazan estrellas \
y nudos. Alrededor, un octógono más vasto se divide en compartimentos: estrellas de \
ocho puntas, pequeños octógonos, triángulos verdes con las puntas vueltas hacia el centro. \
El conjunto se inscribe en un cuadrado, flanqueado a izquierda y derecha por dos bandas rojas \
sembradas de pequeños motivos. La cenefa alterna largos cartuchos redondeados, azules \
y verdes, y medallones redondos rojos. Ni una figura humana o animal: \
solo formas que encajan unas en otras, hasta perderse de vista. Los bordes, deshilachados, conservan la \
huella de cinco siglos de uso."""
evocation = """
Este dibujo sin principio ni fin se mira desde todos los lados, como una alfombra puesta en el suelo. \
Se han relacionado estas composiciones con los pavimentos de mármol de colores y los techos \
pintados que adornaban los palacios y las madrasas de los mamelucos: la alfombra prolongaba, \
en lana, el decorado de la arquitectura. Su geometría, hecha de estrellas que nacen unas \
de otras, ilustra una idea cara al arte islámico: un orden que se repite y \
podría extenderse hasta el infinito. La gama reducida de colores, rojo cereza, azul y \
verde, era tan característica que formaba una especie de marca de los talleres de El \
Cairo."""
histoire = """
Las alfombras llamadas mamelucas aparecen en El Cairo en la segunda mitad del siglo XV, \
y su producción continúa algún tiempo después de la conquista otomana de 1517. Eran \
buscadas hasta en Europa, en Italia como en España, donde cubrían los \
suelos y las mesas de los palacios. Tras la conquista, los talleres adoptan poco a poco el \
estilo floral querido por Estambul, como muestra la alfombra de arcadas del atrio. Este \
ejemplar perteneció al coleccionista James F. Ballard, que lo donó al \
Metropolitan Museum de Nueva York en 1922, junto con la alfombra otomana presentada en esta \
exposición."""
facture = """
Todo es de lana: la urdimbre, la trama y el pelo, anudado con el nudo asimétrico. \
La lana de las alfombras mamelucas es famosa por su lustre, que hace centellear los \
rojos. Los tejedores se contentan con tres colores principales, realzados con \
toques de amarillo y de blanco, pero juegan con sus matices: se ven, en las bandas \
laterales y alrededor del medallón, pasajes del azul al verde debidos a baños de \
tinte diferentes. El dibujo descansa sobre un trazado geométrico riguroso, construido a \
partir del octógono y de la estrella de ocho puntas."""
details = [
  "La roseta entrelazada en el corazón del medallón central.",
  "Los triángulos verdes que apuntan hacia el centro, como flechas.",
  "Las pequeñas plantas estilizadas, por pares, en las bandas laterales.",
  "Los pasajes del azul al verde, de una banda a otra.",
]
themes = ["alfombra", "geometría", "mamelucos", "el cairo", "estrella"]
anecdote = """
El 11 de junio de 1489, el papa Inocencio VIII compra siete alfombras, que los documentos \
pontificios dicen expedidas de El Cairo, «donde se fabrican». Una alfombra mameluca \
figura también en un cuadro pintado en Venecia por Paris Bordone en 1534."""
salle = 3
mur = "ouest"
position = 0.0
largeur = 2.6

[[oeuvres]]
titre = "Lámpara de mezquita del emir Qawsun"
artiste = "Sultanat mamelouk"
annee = "hacia 1329–1335"
image = "lampe-qawsun.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Mosque_Lamp_of_Amir_Qawsun_MET_DP214293.jpg"
technique = "Vidrio soplado, esmaltado y dorado, altura 35,9 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una lámpara de vidrio de 36 cm de altura, presentada ampliada, a nombre de un emir copero del sultán: la copa, su emblema, aparece en ella seis veces."
description = """
La lámpara tiene la forma de un gran jarrón: un cuello ensanchado en embudo, una panza redonda y un \
pie alto y ancho. En la panza, asas de vidrio permitían enganchar las \
cadenas de suspensión. El vidrio, transparente y ligeramente pardo, está cubierto de esmaltes. \
En el cuello, una banda de escritura azul se despliega alrededor de grandes medallones redondos: \
en el centro de cada uno, sobre fondo amarillo, se destaca una copa rojo oscuro. En la panza, \
inmensas letras azules, perfiladas de rojo, se lanzan hacia lo alto entre las asas; \
nombran al emir que regaló la lámpara. Roleos muy finos, pintados de rojo y \
realzados con oro, llenan los espacios entre las bandas y cubren el pie."""
evocation = """
Una lámpara de mezquita es una luz que habla. Una pequeña lamparilla de aceite, colocada en el \
interior, hacía brillar el vidrio; las letras de esmalte se recortaban entonces en \
sombra sobre la luz. El cuello lleva un pasaje de la sura 24 del Corán, la sura de \
la Luz, donde la luz de Dios se compara con una lámpara colocada en un nicho, en \
un cristal semejante a un astro resplandeciente. El objeto ilustra así el texto que lleva. \
La inscripción de la panza y la copa, emblema del cargo de copero, recuerdan \
también la generosidad del emir: ofrecer la iluminación de una mezquita era una obra \
piadosa y un signo de prestigio."""
histoire = """
Sayf al-Din Qawsun es uno de los emires más poderosos del sultán al-Nasir Muhammad, \
de quien es copero. Funda en El Cairo una mezquita hacia 1329-1330 y un palacio; la \
lámpara, fechada en esos años, estaba sin duda destinada a una de sus fundaciones. Tras \
la muerte del sultán en 1341, Qawsun es durante un tiempo el hombre fuerte del régimen, antes de ser \
detenido y luego ejecutado en 1342. Cientos de lámparas de este tipo colgaban en las \
mezquitas, las madrasas y los mausoleos de El Cairo. Buscadas por los coleccionistas \
europeos en el siglo XIX, muchas han salido de Egipto: esta fue donada al \
Metropolitan Museum en 1917 por el banquero J. Pierpont Morgan."""
facture = """
La lámpara se sopla con la caña y luego se añaden en caliente el pie y las asas. La \
decoración se pinta con esmaltes, es decir, vidrio coloreado molido y mezclado con un aglutinante, \
y luego el objeto se recuece a una temperatura lo bastante baja para fundir el esmalte sin \
deformar la lámpara. El oro se aplica del mismo modo. El azul, el rojo, el blanco, el \
amarillo y el oro forman una paleta restringida, colocada con gran precisión: los \
contornos rojos de las letras y los roleos, trazados con pincel, tienen el grosor de un \
cabello."""
details = [
  "La copa roja sobre fondo amarillo, emblema del copero, en los medallones del cuello.",
  "Las grandes letras azules de la panza, que suben entre las asas.",
  "Las asas de vidrio donde se sujetaban las cadenas.",
  "Los roleos rojos y dorados, muy finos, en el pie.",
]
themes = ["vidrio", "luz", "caligrafía", "mamelucos", "mezquita"]
anecdote = """
El pie de la lámpara lleva la firma de Ali ibn Muhammad al-Barmaki: es uno de los \
únicos nombres de artesanos conocidos de todo el vidrio esmaltado y dorado de la época mameluca, \
casi siempre anónimo."""
salle = 3
mur = "nord"
position = 0.0
largeur = 0.8

[[oeuvres]]
titre = "El Bautisterio de San Luis"
artiste = "Sultanat mamelouk"
annee = "hacia 1330–1340"
image = "baptistere-saint-louis.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Baptistère_de_Saint_Louis_-_Musée_du_Louvre_Arts_de_l'Islam_LP_16.jpg"
technique = "Aleación de cobre martillada, cincelada e incrustada de plata, oro y pasta negra, 23,2 × 50 cm"
collection = "Museo del Louvre, París"
note = "Una jofaina mameluca firmada seis veces por Muhammad ibn al-Zayn, que sirvió para el bautismo de los niños de Francia: 50 cm de diámetro, presentada ampliada."
description = """
La jofaina, ancha y ensanchada, está enteramente cubierta de un decorado de plata y oro sobre el \
latón oscuro. En la pared exterior, un friso de personajes de pie rodea \
el objeto: dignatarios y sirvientes de largas túnicas, que llevan \
armas, vasos o animales. Cuatro medallones redondos lo interrumpen, donde \
jinetes cazan. La pared interior retoma la misma disposición: dos medallones \
muestran a un príncipe en su trono, otros dos escudos. En el fondo, que se \
entrevé en el centro, nadan peces y otros animales acuáticos. Los rostros, \
redondos, de ojos alargados, están grabados con una precisión de miniatura."""
evocation = """
El decorado desgrana los placeres y los deberes de una corte: la caza, el combate, el \
servicio del príncipe. Se ignora para quién se hizo la jofaina, pero estas escenas \
se dirigen a las élites militares del sultanato, esos emires de origen turco que \
se reconocían en sus trajes y sus armas. El dibujo recuerda la pintura de los \
manuscritos de la época: una escena de batalla se compara con una ilustración del \
Shahnameh pintado en Tabriz hacia 1330. El fondo poblado de peces hace de la jofaina una \
pequeña mar, una imagen que cobra un sentido nuevo cuando el objeto se convierte, en Francia, en una \
jofaina para el agua del bautismo."""
histoire = """
La jofaina está firmada en seis lugares: «obra del maestro Muhammad ibn al-Zayn». Se \
ignora cómo llegó a Francia; se conserva desde hace mucho tiempo en el \
tesoro de la Sainte-Chapelle del castillo de Vincennes. Sirve para el bautismo del futuro \
Luis XIII en 1606, y luego para el del conde de Chambord en 1821, para el cual se añaden \
dos blasones con las armas de Francia en los medallones interiores. En 1856, se \
utiliza aún para el bautismo del príncipe imperial, hijo de Napoleón III. Pertenece \
hoy al departamento de Artes del Islam del Louvre, del que es uno de los objetos \
más célebres."""
facture = """
La jofaina se martillea en una lámina de aleación de cobre. El decorado se cincela después \
: el artesano ahueca el metal, aloja en él finas hojas de plata y de oro que martillea \
para fijarlas, y luego rellena el fondo de pasta negra para hacer resaltar las figuras. \
Los detalles de los rostros y de los trajes se graban en la plata. Esta técnica, \
aparecida en Jorasán, al noreste de Irán, pasa por Mosul antes de llegar a Damasco \
y a El Cairo. Las figuras, que cubren todo el objeto, se vuelven más raras en el curso del \
siglo XIV, sustituidas poco a poco por grandes inscripciones."""
details = [
  "Los jinetes cazando en los medallones de la pared exterior.",
  "Los blasones de flores de lis añadidos en 1821 en dos medallones interiores.",
  "Los peces y animales acuáticos grabados en el fondo.",
  "Los rostros redondos, de ojos alargados, grabados en la plata.",
]
themes = ["metal", "corte", "caza", "mamelucos", "bautismo"]
anecdote = """
Su nombre es un anacronismo: Luis IX, San Luis, murió en 1270, varias \
décadas antes de que la jofaina se fabricara. Este nombre tradicional le \
ha quedado, sin embargo, y con él se exhibe en el Louvre."""
salle = 3
