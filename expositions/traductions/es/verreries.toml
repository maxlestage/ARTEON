[[oeuvres]]
titre = "Frasco de perfume en forma de ánfora"
artiste = "Égypte, Nouvel Empire"
annee = "hacia 1386–1330 a. C."
image = "amphore-egyptienne.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/544828"
technique = "Vidrio modelado sobre núcleo, decoración de hilos de vidrio estirados en festones; altura 15,3 cm, diámetro 6 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un ánfora en miniatura de vidrio azul noche, rayada con festones blancos, amarillos y turquesa, hecha para contener un aceite perfumado en tiempos de Amenhotep III y de Akenatón."
description = """
El frasco reproduce en miniatura la forma de un ánfora, la gran jarra de la Antigüedad, \
pero cabría en la mano: mide apenas quince centímetros. Su panza en \
forma de huevo, de un azul noche profundo, descansa sobre un pequeño pie ensanchado. Dos asas en \
anillo, del mismo azul, se curvan sobre los hombros. La decoración se compone de hilos de vidrio \
blanco, amarillo anaranjado y turquesa, que dibujan bandas de festones en zigzag, como \
olas o plumas, separadas por líneas rectas. El largo cuello está completamente \
cubierto de galones apretados. El borde de la boca y el del pie se subrayan con un \
cordón torcido, rayado de azul y blanco. En algunos puntos, la superficie muestra pequeñas \
manchas claras, huellas de la alteración del vidrio."""
evocation = """
En Egipto, el vidrio fue al principio una materia real. Se lo comparaba con las piedras \
preciosas: el azul oscuro imitaba el lapislázuli, el turquesa la piedra del Sinaí. \
Los primeros recipientes de vidrio aparecen en el valle del Nilo hacia 1500 a. \
C., en tiempos de Tutmosis III, quizá gracias a artesanos llegados del Próximo Oriente \
tras sus campañas militares. Siguen siendo raros y costosos, reservados al palacio, a los \
templos y a los grandes dignatarios. Estos pequeños frascos contenían aceites perfumados \
y ungüentos, indispensables para el aseo de los vivos, pero también para los ritos \
funerarios. Dar a un frasco de vidrio la forma de un ánfora era jugar con las \
escalas: la jarra de los almacenes se convierte en una joya de tocador."""
histoire = """
El frasco data del final de la dinastía XVIII, bajo los reinados de Amenhotep III y \
de Akenatón, la edad de oro del vidrio egipcio. Los arqueólogos han hallado talleres \
de vidrieros en las grandes residencias reales de esa época, en el palacio de Malqata, \
cerca de Tebas, y en Amarna, la capital fundada por Akenatón. Se ignora dónde fue \
descubierto este frasco. El Metropolitan Museum lo adquirió en 1926 gracias a una donación del mecenas Edward \
S. Harkness, uno de los grandes bienhechores de su departamento egipcio. Tras el fin del \
Imperio Nuevo, la producción de vasos de vidrio decae en Egipto durante varios \
siglos; la técnica del núcleo renacerá más tarde en Mesopotamia y luego en el mundo \
griego."""
facture = """
El soplado aún no existía. El vidriero modelaba primero un núcleo de arcilla mezclada \
con arena o materia orgánica, con la forma del interior del frasco, alrededor de una \
varilla de metal. Lo recubría de vidrio azul fundido y enrollaba luego alrededor hilos de \
vidrio de color, que estiraba hacia arriba y hacia abajo con una punta para \
dibujar los festones. Haciendo rodar el objeto aún caliente sobre una piedra plana, hacía \
penetrar los hilos en la pared. Añadía después las asas, el pie y los cordones. \
Una vez enfriado el vidrio, retiraba la varilla y raspaba el núcleo. El azul procede del \
cobalto, el blanco y el amarillo de compuestos de antimonio."""
details = [
  "Los festones en zigzag, blancos, amarillos y turquesa, sobre la panza azul noche.",
  "Los galones apretados que cubren todo el cuello.",
  "Las dos asas en anillo apoyadas en los hombros.",
  "Los cordones torcidos azul y blanco del borde y del pie.",
]
themes = ["egipto", "perfume", "vidrio sobre núcleo", "ánfora", "azul"]
anecdote = """
El mismo procedimiento, hilos de vidrio estirados en forma de plumas, reaparece más de tres mil años \
después en los jarrones de Louis Comfort Tiffany, presentados en la última sala de \
esta exposición."""
salle = 2
mur = "nord"
place = 1
largeur = 0.9

[[oeuvres]]
titre = "Frasco de dos rostros (frasco jánico)"
artiste = "Empire romain, Méditerranée orientale"
annee = "siglos II–IV"
image = "flacon-janus.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1923.945"
technique = "Vidrio soplado en molde; altura 6,4 cm, diámetro 4,6 cm"
collection = "Cleveland Museum of Art"
note = "Un frasco de seis centímetros de altura, soplado en un molde en forma de doble cabeza, cuya superficie, irisada por el tiempo, oculta el color violeta original."
description = """
El pequeño frasco tiene la forma de dos cabezas unidas por la parte posterior del cráneo, coronadas \
por un largo cuello cilíndrico de boca ribeteada. Aquí se ve uno de los dos rostros, de \
frente: un rostro lleno y juvenil, de grandes ojos almendrados, nariz recta, boca \
pequeña. Una cabellera de gruesos mechones ondulados lo enmarca y desciende a los lados \
hasta la altura de las mejillas. El segundo rostro, vuelto hacia atrás, es casi \
idéntico. Toda la superficie está cubierta de una irisación cambiante, en la que se mezclan \
reflejos de plata, malva, verde y oro; en algunos puntos, pequeñas escamas se han \
desprendido. El frasco cabe entero en el hueco de la mano."""
evocation = """
Estos frascos se llaman jánicos, por Jano, el dios romano de los dos rostros, \
guardián de las puertas y de los comienzos, que mira a la vez delante y detrás de sí. \
El Cleveland Museum señala, sin embargo, que estos rostros, imberbes y de sexo incierto, \
apenas se parecen a Jano, por lo general barbado: otros frascos contraponen un rostro \
grave y un rostro sonriente. Estos objetos no celebran, pues, necesariamente a un dios; \
divertían la vista y hacían precioso un simple recipiente de aceite perfumado. Dicen \
sobre todo la gran novedad del vidrio romano: gracias al soplado, lo que era un lujo \
se convierte en un objeto corriente, que podía fabricarse en serie y venderse por todo \
el Imperio."""
histoire = """
Los frascos con cabeza humana fueron muy comunes en el mundo romano del siglo II al IV; \
se fabricaron en el Mediterráneo oriental, de donde procede sin duda este, \
pero también en Renania. La mayoría se han hallado en tumbas, donde se \
depositaban con su contenido. El frasco ingresó en el Cleveland Museum of Art en 1923, \
donado por Jeptha H. Wade, uno de los fundadores del museo, que le regaló numerosos \
objetos. Como muchos vidrios antiguos, pasó siglos bajo tierra, y \
ese enterramiento le dio su apariencia actual: según el museo, \
la irisación que cubre la superficie enmascara un color original próximo al violeta."""
facture = """
El soplado del vidrio se inventa en el siglo I a. C. en la costa sirio-palestina \
: el vidriero recoge una bola de vidrio fundido en el extremo de una caña hueca y la infla \
con su aliento. Muy pronto se sopla también el vidrio en moldes, de terracota o \
de piedra, formados por dos mitades que llevan el relieve en hueco. Aquí, la paraison, la \
burbuja de vidrio caliente, se sopló en un molde en forma de doble cabeza, que \
imprimió de una vez los rostros y los mechones; el cuello se estiró y ribeteó después, \
fuera del molde. Con el tiempo, la humedad del suelo alteró la superficie en láminas muy \
finas, que descomponen la luz como una pompa de jabón."""
details = [
  "Los grandes ojos almendrados del rostro vuelto hacia nosotros.",
  "Los mechones ondulados que enmarcan el rostro, impresos por el molde.",
  "El perfil del segundo rostro, que se adivina en el lado derecho.",
  "Los reflejos malvas, verdes y dorados de la irisación.",
  "La boca ribeteada, replegada en caliente sobre sí misma.",
]
themes = ["roma", "vidrio soplado", "jano", "irisación", "perfume"]
anecdote = """
La irisación de los vidrios antiguos fascinaba a los vidrieros del Art Nouveau: Louis Comfort \
Tiffany, coleccionista de vidrios antiguos, trató de obtener en su horno los reflejos \
que siglos de enterramiento habían dado a los vidrios romanos."""
salle = 2
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Medallón con el retrato de Gennadios"
artiste = "Alexandrie, Égypte romaine"
annee = "250–300"
image = "medaillon-gennadios.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/466645"
technique = "Vidrio, pan de oro y realces de color; diámetro 4,1 cm, grosor 0,6 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El retrato de un joven dibujado con punta en una hoja de oro, sobre un disco de vidrio azul de cuatro centímetros: una de las obras maestras del vidrio dorado antiguo."
description = """
Sobre un pequeño disco de vidrio azul casi negro, un joven aparece en busto, de \
tres cuartos, con la mirada vuelta hacia nuestra izquierda. Está enteramente dibujado en oro: \
una cabellera espesa de rizos apretados, grandes ojos de mirada intensa, mejillas \
llenas, una boca cerrada. El modelado del rostro y de los hombros se logra con \
miles de rayitas muy finas, como en un grabado. Lleva una túnica y un \
manto echado sobre el hombro. A su alrededor, un filete de oro sigue el borde del medallón, y \
una inscripción griega en letras de oro se lee en tres fragmentos: ΓΕΝΝΑΔΙ a la izquierda, \
ΧΡΩΜΑΤΙ a la derecha, ΠΑΜΜΟΥϹΙ abajo. El borde del disco está desportillado en algunos puntos."""
evocation = """
El retrato tiene la presencia de un rostro vivo: nada hay idealizado en este joven de \
rasgos singulares, que recuerda los retratos pintados sobre madera de las momias del Fayum, \
realizados en Egipto en la misma época. La inscripción da su nombre, Gennadios, y lo elogia \
; se entiende por lo general como un elogio de su talento, el de un hombre consumado \
en el arte de las Musas, sin duda un músico. Estos medallones, preciosos e íntimos, \
conservaban la imagen de un ser querido u honraban un éxito; podían montarse como \
joya u ofrecerse como regalo. Dan testimonio también de Alejandría, la gran metrópoli griega de \
el Egipto romano, famosa por sus talleres de vidrieros y por su gusto por el lujo \
refinado."""
histoire = """
El medallón se hizo entre 250 y 300, sin duda en Alejandría, de donde proceden la \
mayoría de los retratos de este tipo. Solo se conoce un pequeño número, todos de \
gran finura, lo que sugiere un mismo taller o un pequeño grupo de artesanos muy \
especializados. Algunos se conservaron durante siglos como reliquias o como \
joyas: el más célebre, que muestra a una madre y a sus dos hijos, fue engastado en la \
Edad Media en la cruz de Desiderio, en Brescia, entre piedras preciosas. Se ignora \
el recorrido del de Gennadios antes de su llegada al Metropolitan Museum, que lo \
adquirió en 1926 gracias al Fletcher Fund. Se conserva con las colecciones de arte \
medieval del museo, junto a los vidrios dorados paleocristianos."""
facture = """
El vidrio dorado, que los italianos llaman fondo d'oro, encierra una hoja de oro entre \
dos capas de vidrio. El artesano colocaba primero una hoja de oro muy fina sobre el \
disco de vidrio azul. Con una punta fina, raspaba en ella el dibujo: retiraba el oro \
alrededor de la figura y trazaba en el rostro, el cabello y las vestiduras \
redes de rayitas, más o menos apretadas, que dejan transparentar el fondo oscuro \
y crean las sombras. Algunos toques de color completaban el retrato. Todo \
se protegía después con una capa de vidrio, fundida por encima, que sella el oro y \
evita que se desgaste. El trabajo, hecho casi con lupa, exigía una mano \
de una seguridad extraordinaria."""
details = [
  "Los rizos apretados de la cabellera, dibujados uno a uno en el oro.",
  "Las rayitas muy finas que modelan las mejillas y el cuello.",
  "La mirada vuelta de lado, de pupilas oscuras.",
  "Las tres palabras griegas de la inscripción, a la izquierda, a la derecha y abajo.",
  "El filete de oro que sigue el borde del medallón.",
]
themes = ["retrato", "oro", "alejandría", "música", "vidrio dorado"]
anecdote = """
El medallón mide apenas cuatro centímetros: en la vitrina, el rostro de Gennadios \
no es más grande que una uña, y solo con lupa se descubre la \
finura de las rayitas."""
salle = 2
mur = "ouest"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Lámpara de mezquita para el mausoleo del emir Aydakin al-Bunduqdar"
artiste = "Égypte, sultanat mamelouk"
annee = "poco después de 1285"
image = "lampe-aydakin.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/447000"
technique = "Vidrio soplado, asas aplicadas, pie replegado, esmaltado y dorado; altura 26,4 cm, diámetro de la abertura 21 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una lámpara de vidrio esmaltado de azul, rojo y oro, hecha para la tumba de un emir de El Cairo, antiguo amo del sultán Baybars, cuyas armas lleva: dos arcos dorso con dorso."
description = """
La lámpara tiene la forma de un gran jarrón: un pie bajo, una panza abombada y un ancho cuello \
ensanchado en embudo. El vidrio, ligeramente teñido de pardo, es transparente. Alrededor de la \
panza corre una ancha banda azul donde se destaca, en reserva, una inscripción árabe en \
grandes letras esbeltas, perfiladas de rojo y realzadas con oro. Está interrumpida por \
medallones rojos donde figuran dos arcos dorso con dorso, dibujados en oro. Pequeñas \
asas de vidrio, colocadas en la panza, servían para colgarla. El cuello lleva una \
segunda inscripción, en letras azules sobre un fondo de roleos, entre otros \
medallones con arcos. Frisos de pequeños motivos rojos subrayan el borde y la base \
del cuello."""
evocation = """
Una lámpara de mezquita no solo alumbraba: daba forma a la luz divina. \
Muchas llevan un versículo del Corán, la sura de la Luz, que compara a Dios con una \
lámpara en un nicho, «la lámpara está en un cristal, y el cristal es como un astro \
brillante». Colgadas por decenas en las mezquitas, las madrasas y las tumbas, \
hacían brillar las inscripciones en la penumbra. Esta honra también a un \
hombre. Los medallones llevan las armas del emir, pues los mamelucos, antiguos esclavos \
militares convertidos en señores de Egipto, se distinguían por emblemas ligados a su \
cargo en la corte. Los dos arcos son los de un bunduqdar, el portador del arco del \
sultán."""
histoire = """
Aydakin al-Bunduqdar fue un emir de la corte de El Cairo en el siglo XIII. Había comprado \
como esclavo militar a un joven turco, Baybars, que llegó a ser uno de los mayores sultanes \
mamelucos y conservó toda su vida el sobrenombre de al-Bunduqdari, «el hombre de al-Bunduqdar». \
Aydakin murió en 1285; fue enterrado en El Cairo en un mausoleo para el cual esta \
lámpara fue hecha, poco después de su muerte. Se ignora cuándo salió de El Cairo; en el siglo XIX, \
los coleccionistas europeos buscaban estas lámparas. El financiero J. \
Pierpont Morgan la adquiere; fue donada en 1917 al Metropolitan Museum, junto con gran parte de \
su colección. En la exposición vecina dedicada a las artes del Islam, puede verse \
otra lámpara del Met, la del emir Qawsun."""
facture = """
La lámpara se sopla y luego se modela con la caña: el pie es un borde de vidrio replegado \
sobre sí mismo, las asas son gotas de vidrio estiradas y pegadas en caliente. La decoración \
se pinta después con esmaltes, polvos de vidrio coloreados con óxidos \
metálicos y mezclados con un aglutinante, y con oro. El vidriero volvía a poner la lámpara en el \
horno, a una temperatura lo bastante alta para fundir los esmaltes sobre el vidrio, pero lo bastante \
baja para no deformar el objeto: una operación delicada, a menudo repetida para \
cada color. Los vidrieros de Siria y de Egipto llevaron esta técnica a su \
perfección en los siglos XIII y XIV; los de Venecia la retomarán a finales de la \
Edad Media."""
details = [
  "Los dos arcos dorso con dorso, en oro, en los medallones rojos.",
  "Las grandes letras de la inscripción, en reserva sobre la banda azul.",
  "Las pequeñas asas de vidrio que permitían colgar la lámpara.",
  "La inscripción azul del cuello, sobre un fondo de finos roleos.",
  "El pie replegado, de borde grueso, bajo la panza.",
]
themes = ["islam", "mamelucos", "luz", "esmalte", "caligrafía"]
anecdote = """
En el siglo XIX, estas lámparas eran tan buscadas que vidrieros europeos, como el \
parisino Philippe-Joseph Brocard, empezaron a imitarlas. El Cleveland Museum conserva \
una lámpara de mezquita esmaltada hecha en Francia a finales del siglo XIX."""
salle = 3
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Vaso de vidrio de filigrana (vetro a reticello)"
artiste = "Venise, verreries de Murano"
annee = "hacia 1600"
image = "gobelet-reticello.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/223422"
technique = "Vidrio incoloro soplado con filigrana blanca en retícula (vetro a reticello); altura 17,2 cm"
collection = "Art Institute of Chicago"
note = "Un vaso de Murano tejido con una fina red de hilos de vidrio blanco, tan regular que se diría un encaje o un trabajo de cestería."
description = """
El vaso se ensancha ampliamente, como una corola, sobre un botón aplastado y un \
pie en forma de campana, bordeado por un dobladillo. El vidrio, incoloro y muy delgado, está \
atravesado de lado a lado por una red de hilos blancos opacos que se cruzan en \
diagonal y forman pequeños rombos regulares, una retícula que cubre la copa, el \
botón y el pie. Hacia arriba, los hilos se separan y se inclinan siguiendo \
el ensanchamiento de la pared; cerca del borde se distinguen claramente dos series de espirales \
que giran en sentidos contrarios. En el centro de cada rombo, una minúscula burbuja de aire \
ha quedado atrapada. Sobre el fondo gris de la fotografía, el objeto parece casi \
inmaterial."""
evocation = """
Este vaso no tiene más decoración que la materia misma: es el vidrio que se convierte en \
encaje. En los siglos XVI y XVII, Murano domina el mercado europeo del vidrio de lujo, \
y las mesas de los príncipes y de los ricos mercaderes se adornan con estos objetos ligeros, \
frágiles y costosos. Según el Art Institute, estos vasos de retícula eran muy \
buscados por la nobleza para adornar las mesas de fiesta, como signo de riqueza y \
de buen gusto. Responden al gusto del Renacimiento por la virtuosidad: se admira \
tanto la dificultad vencida como la belleza del objeto. Su finura dice también su \
fragilidad, y es casi un milagro que tales vidrios hayan llegado hasta \
nosotros."""
histoire = """
Ya en 1291, Venecia obliga a sus vidrieros a instalar sus hornos en la isla de Murano, para \
alejar el riesgo de incendio de la ciudad y guardar mejor los secretos del oficio. En el \
siglo XV ponen a punto el cristallo, un vidrio casi incoloro, claro como \
el cristal de roca, y luego, en las primeras décadas del siglo XVI, el vidrio de \
filigrana, decorado con hilos de vidrio blanco. A pesar de las leyes que les prohibían \
abandonar la laguna, numerosos vidrieros venecianos parten a trabajar al extranjero: \
su manera, la «façon de Venise», se difunde por toda Europa. Nada se sabe del \
primer propietario de este vaso. El Art Institute of Chicago lo adquirió gracias al \
fondo Mary Swissler Oldberg; se exhibe en sus galerías de artes decorativas."""
facture = """
El Art Institute describe el procedimiento. El vidriero dispone una junto a otra finas varillas de \
vidrio blanco y las envuelve en una masa de vidrio incoloro fundido; hace rodar el conjunto, \
lo sopla en forma de tubo y lo tuerce para que los hilos se enrollen en espiral. \
Prepara un segundo tubo, cuyos hilos giran en el otro sentido, y lo sopla en \
el interior del primero: las dos paredes se sueldan, y las espirales cruzadas forman \
la retícula. En cada cruce, una pequeña burbuja de aire queda encerrada entre las dos \
capas. El vidrio se modela después como vaso, con su botón y su pie, sin \
que el dibujo se desdibuje: un trabajo de gran maestría."""
details = [
  "Los pequeños rombos regulares de la retícula blanca.",
  "La burbuja de aire atrapada en el centro de cada rombo.",
  "Las dos series de espirales cruzadas, bien visibles cerca del borde.",
  "El botón aplastado que une la copa con el pie.",
  "El dobladillo del pie, replegado en caliente.",
]
themes = ["venecia", "murano", "filigrana", "renacimiento", "virtuosidad"]
anecdote = """
Los vidrieros de Murano gozaban de privilegios excepcionales: sus hijas podían casarse \
con nobles venecianos sin que los hijos perdieran su rango. Pero quien partía a \
ejercer su arte al extranjero se exponía a duras penas."""
salle = 3
mur = "sud"
place = 2
