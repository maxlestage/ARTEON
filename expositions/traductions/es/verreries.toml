[[artistes]]
nom = "Égypte, Nouvel Empire"
vie = "Valle del Nilo, hacia 1550–1070 a. C."
biographie = """
El Imperio Nuevo comienza hacia 1550 antes de nuestra era, cuando los reyes de Tebas expulsan \
a los hicsos, llegados de Asia, que reinaban en el norte del país. Bajo la dinastía XVIII, \
la de los Tutmosis y los Amenhotep, Egipto se convierte en un imperio que se extiende desde \
Nubia hasta el Éufrates. Las campañas militares de Tutmosis III ponen al país \
en estrecho contacto con el Próximo Oriente, donde ya se fabrica vidrio: es en esa \
época cuando aparecen en Egipto los primeros vasos de vidrio. Bajo Amenhotep III, el \
país conoce una prosperidad inaudita; su hijo Akenatón impone el culto del disco \
solar Atón y funda una nueva capital, Amarna. Los talleres reales producen allí \
vidrio de color para vasos, incrustaciones y joyas. El Imperio Nuevo \
es también la época de Tutankamón, de Ramsés II y de los grandes templos de Karnak y de \
Luxor."""
style = """
El vidrio egipcio del Imperio Nuevo es un vidrio de color, opaco o casi, que \
imita las piedras preciosas: azul oscuro del lapislázuli, turquesa, blanco, amarillo. \
Los vasos, pequeños, se modelan alrededor de un núcleo y se decoran con hilos de vidrio estirados \
en festones, en zigzags o en plumas. Sus formas retoman a menudo las de los vasos \
de piedra o de cerámica, en miniatura."""

[[artistes]]
nom = "Empire romain, Méditerranée orientale"
vie = "Siria, Palestina, Egipto y Asia Menor, siglo I a. C. – siglo IV"
biographie = """
Las provincias orientales del Imperio romano, Siria, Judea, Egipto, son desde hace \
siglos los grandes focos del vidrio en el Mediterráneo. En la costa \
sirio-palestina se inventa, en el siglo I antes de nuestra era, el soplado del \
vidrio, que trastoca el oficio: un recipiente que exigía horas de trabajo se \
hace ahora en pocos minutos. Los vidrieros, a menudo itinerantes, difunden la \
técnica por todo el Imperio, en Italia, en la Galia y en Renania, en torno a Colonia. \
Algunos firman sus obras, como Ennión, activo en Sidón en el siglo I. El vidrio \
se convierte en un material corriente: se utiliza para frascos, botellas, \
copas, vajilla de mesa e incluso cristales de ventana. Las tumbas de todo el mundo romano \
han proporcionado millares de estos objetos, a menudo irisados por su larga estancia en la \
tierra."""
style = """
El vidrio romano es sobre todo un vidrio soplado, delgado y ligero, de un verde azulado natural \
o coloreado de azul, ámbar o violeta. El soplado en molde permite repetir \
formas en relieve: cabezas humanas, frutos, motivos vegetales, inscripciones. Los \
vidrieros juegan con la transparencia y el color más que con la decoración pintada."""

[[artistes]]
nom = "Alexandrie, Égypte romaine"
vie = "Alejandría, Egipto, siglo III"
biographie = """
Fundada por Alejandro Magno en 331 antes de nuestra era, Alejandría fue la capital de \
el Egipto de los Ptolomeos y luego, tras la conquista romana en 30 a. C., una de las \
mayores ciudades del Imperio. Ciudad de lengua griega, poblada de griegos, \
egipcios y judíos, era célebre por su faro, su biblioteca, sus \
sabios y su comercio. Sus artesanos trabajaban para una clientela rica y \
refinada: orfebres, grabadores de piedras finas, pintores y vidrieros. Los talleres \
alejandrinos tenían fama de producir vidrios de gran lujo, vidrios \
de mosaico, vidrios tallados y vidrios dorados. En el siglo III realizan pequeños \
retratos en hoja de oro sobre vidrio azul, de una finura excepcional, que muestran \
a hombres, mujeres y familias de la ciudad, a veces nombrados por una \
inscripción griega."""
style = """
Los retratos en vidrio dorado de Alejandría son verdaderos dibujos en oro: el modelado \
nace de rayitas muy finas, raspadas con punta en la hoja de metal, como en \
un grabado. Los rostros, individualizados y expresivos, recuerdan los retratos \
pintados del Fayum. El fondo azul oscuro hace brillar el oro como sobre un cielo nocturno."""

[[artistes]]
nom = "Égypte, sultanat mamelouk"
vie = "Egipto y Siria, 1250–1517"
biographie = """
Los mamelucos eran esclavos militares, comprados jóvenes en las estepas de \
la actual Rusia meridional o en el Cáucaso, convertidos al islam y formados en el oficio \
de las armas. En 1250 toman el poder en Egipto y fundan un sultanato que \
se extiende pronto a Siria. Su sultán Baybars detiene a los mongoles y expulsa poco a poco \
a los cruzados del Levante. Durante más de dos siglos y medio, El Cairo es la \
mayor ciudad del mundo islámico: los sultanes y los emires hacen construir mezquitas, \
madrasas, hospitales y mausoleos, que dotan de mobiliario precioso, \
lámparas de vidrio esmaltado, candelabros y jofainas de metal incrustado, coranes iluminados. \
Los talleres de Siria y de Egipto llevan entonces el arte del vidrio esmaltado y dorado a su \
perfección. El sultanato cae en 1517 bajo los golpes de los otomanos."""
style = """
El arte mameluco ama las grandes inscripciones árabes, en letras esbeltas, que llevan \
los nombres y los títulos de los sultanes y de los emires, y los blasones, emblemas ligados a su \
cargo. Sobre el vidrio, el esmalte azul, rojo, blanco y el oro se destacan sobre un vidrio \
transparente, a menudo ligeramente teñido, que deja pasar la luz."""

[[artistes]]
nom = "Venise, verreries de Murano"
vie = "Murano, laguna de Venecia, desde el siglo XIII"
biographie = """
El vidrio se trabaja en Venecia desde la alta Edad Media. En 1291, la República \
obliga a sus vidrieros a trasladar sus hornos a la vecina isla de Murano, para \
proteger la ciudad de los incendios y mantener bajo control los secretos del oficio. Los \
vidrieros, organizados en corporación, gozan allí de importantes privilegios, pero les \
está prohibido ejercer fuera de la laguna. En el siglo XV, Angelo Barovier y sus \
contemporáneos ponen a punto el cristallo, un vidrio casi incoloro; se añaden \
pronto el esmalte, el vidrio opaco blanco llamado lattimo, el vidrio craquelado y el vidrio de \
filigrana. En los siglos XVI y XVII, Murano domina el mercado europeo del vidrio de \
lujo, y sus vidrieros emigrados difunden la «façon de Venise» hasta Inglaterra y \
los Países Bajos. La isla ha seguido siendo hasta hoy un gran centro vidriero."""
style = """
El vidrio de Murano es un vidrio sódico, ligero, que permanece mucho tiempo maleable: los \
vidrieros lo estiran, lo pellizcan y lo soplan en paredes muy delgadas. En lugar de \
grabarlo, lo decoran en la masa, con hilos de vidrio blanco o de color, o \
en caliente, con alas, cordones y botones aplicados."""

[[artistes]]
nom = "Hermann Schwinger"
vie = "Núremberg, 1640 – Núremberg, 1683"
biographie = """
Hermann Schwinger es un grabador sobre vidrio de Núremberg, activo en la segunda mitad \
del siglo XVII. Su ciudad era entonces el principal foco del grabado sobre vidrio en \
Alemania. Este arte había sido introducido allí por Georg Schwanhardt el Viejo, alumno de \
Caspar Lehmann, el grabador de piedras finas del emperador Rodolfo II en Praga, que \
había aplicado al vidrio las técnicas de la glíptica. En torno a Schwanhardt y a \
sus hijos se forma una escuela de grabadores de los que Schwinger es uno de los mejores \
representantes. Los grabadores nuremburgueses decoran altos vasos de tallo adornado con \
collarines y engrosamientos huecos, a menudo hechos de vidrio de Bohemia o de vidrio \
local. Schwinger graba en ellos paisajes, vistas de ciudades, escenas alegóricas e \
inscripciones, de gran finura, y firma una parte de sus obras."""
style = """
Schwinger graba a la rueda, en hueco mate, paisajes de una precisión de dibujante: \
casas, árboles de follaje denso, figuras minúsculas. Sus escenas se desarrollan por \
toda la copa, como un panorama, y van a menudo acompañadas de divisas en \
escritura gótica que les dan sentido."""

[[artistes]]
nom = "Jacob Sang (gravure), verrerie anglaise"
vie = "Jacob Sang: Países Bajos, hacia 1720 – 1786, activo en Ámsterdam en la década de 1750"
biographie = """
Jacob Sang es un grabador sobre vidrio de Ámsterdam, activo a mediados del siglo XVIII, \
sin duda de origen alemán. Figura \
entre los grabadores más hábiles y reputados de la ciudad. En los Países Bajos, la \
demanda de vidrios personalizados era inmensa: se encargaban para bodas, \
nacimientos, éxitos comerciales, navíos o acontecimientos políticos. Sang \
graba escudos de armas, escenas de género, alegorías e inscripciones, y firma \
algunas de sus obras. Como muchos grabadores holandeses, trabaja sobre \
vidrios soplados en Inglaterra. Desde que George Ravenscroft patentó en 1674 \
un vidrio que contenía óxido de plomo, las vidrierías inglesas producen un vidrio \
pesado, muy claro y brillante, más blando que los demás, que los grabadores de los \
Países Bajos aprecian particularmente."""
style = """
Sang asocia la claridad del vidrio inglés de plomo a un grabado a la rueda muy cuidado, \
donde las superficies mates y pulidas se combinan para modelar los volúmenes. Sus escenas, \
nítidamente compuestas, van a menudo acompañadas de inscripciones en neerlandés, brindis y \
divisas, que recuerdan la función del vidrio en las fiestas familiares."""

[[artistes]]
nom = "Émile Gallé"
vie = "Nancy, 1846 – Nancy, 1904"
biographie = """
Hijo de un comerciante de lozas y vidrios de Nancy, Émile Gallé estudia \
botánica, mineralogía y dibujo, reside en Alemania y luego aprende el oficio \
del vidrio en Meisenthal, en Lorena. Se hace cargo de la empresa familiar, que \
transforma en taller de arte, y añade en 1885 un taller de ebanistería. Sus envíos \
a las Exposiciones Universales de París, en 1878, en 1889 y en 1900, lo hacen \
célebre. Botánico apasionado, observa las plantas y los insectos de Lorena y \
se inspira también en el arte japonés. Hombre comprometido, defiende públicamente al \
capitán Dreyfus. En 1901 funda con otros artistas la Escuela de Nancy, de la que \
es el primer presidente. Muere de leucemia en 1904; sus talleres prosiguen \
tras él una producción de jarrones firmados con su nombre."""
style = """
Gallé hace del vidrio una materia poética. Superpone capas de color, encierra en ellas \
inclusiones, burbujas y hojas de metal, y luego talla la decoración al \
ácido y a la rueda, como un camafeo. Sus jarrones muestran flores, follaje e \
insectos, a veces acompañados de versos grabados: son sus «vidrios parlantes»."""

[[artistes]]
nom = "Louis Comfort Tiffany"
vie = "Nueva York, 1848 – Nueva York, 1933"
biographie = """
Hijo de Charles Lewis Tiffany, fundador de la célebre joyería neoyorquina, Louis \
Comfort Tiffany se forma primero como pintor y viaja por Europa y por el norte de \
África. Se vuelve luego hacia la decoración de interiores y después hacia la vidriera, donde \
inventa vidrios de color matizado en la masa, sin pintura. En 1893 abre \
su propia vidriería en Corona, en el barrio neoyorquino de Queens, con el vidriero \
inglés Arthur J. Nash, y lanza el vidrio Favrile, de superficies irisadas. Sus talleres, \
convertidos en Tiffany Studios en 1902, producen jarrones, vidrieras, mosaicos, lámparas y \
joyas. Expuesto en París por el marchante Siegfried Bing y premiado en la Exposición \
Universal de 1900, se convierte en el gran representante estadounidense del Art Nouveau. \
Tras la guerra, su estilo pasa de moda; muere en 1933."""
style = """
Tiffany piensa el vidrio como pintor: busca el color y la luz en la \
materia misma. Sus jarrones Favrile, de formas suaves de flores o de calabazas, están \
decorados en caliente con hilos y manchas de vidrio estirados en plumas, en hojas o en \
olas, y cubiertos de una irisación cambiante inspirada en los vidrios antiguos."""

[[artistes]]
nom = "René Lalique"
vie = "Aÿ (Marne), 1860 – París, 1945"
biographie = """
Nacido en Champaña, René Lalique hace su aprendizaje con un joyero parisino y \
estudia dibujo en París y en Londres. Abre su propio taller en 1885 y se convierte, \
en los años 1890, en el más inventivo de los joyeros del Art Nouveau: asocia \
el oro, el esmalte, el cuerno y el vidrio a piedras elegidas por su color más que \
por su precio, y triunfa en la Exposición Universal de 1900. Se vuelve después \
hacia el vidrio. Hacia 1907 diseña frascos de perfume para François Coty; en \
1909 alquila y luego compra una vidriería en Combs-la-Ville, cerca de París, y funda \
otra en 1921 en Wingen-sur-Moder, en Alsacia. Sus jarrones, frascos, lámparas y \
mascotas de radiador de vidrio moldeado, producidos en serie, hacen de él uno de los grandes \
nombres del Art Déco."""
style = """
Lalique juega con el contraste del vidrio mate y el vidrio pulido, de lo transparente y \
lo opalescente, y con pátinas que subrayan el relieve. El vidrio moldeado le permite \
reproducir sus modelos en número, sin perder la nitidez del dibujo. Sus motivos \
proceden de la naturaleza: flores, aves, peces, insectos, ranas."""
