[[oeuvres]]
titre = "Jarrón «Ranas y nenúfares»"
artiste = "René Lalique"
annee = "1909–1912"
image = "vase-grenouilles-lalique.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/2007.180"
technique = "Vidrio moldeado, colado y aplicado, patinado; 21 × 29,8 cm"
collection = "Cleveland Museum of Art"
note = "Uno de los primeros jarrones de René Lalique: sobre un vidrio escarchado como agua turbia, ranas de un verde profundo se apiñan sobre hojas de nenúfar."
description = """
El jarrón tiene una forma baja y achaparrada, una panza ancha y angulosa coronada por un cuello \
corto y ensanchado. El vidrio es incoloro, pero deslustrado y satinado, como agua turbia. \
En el hombro, grandes hojas de nenúfar, patinadas de gris, se extienden en relieve; \
sus largos tallos ondulados descienden hasta el pie, y se adivinan botones de \
flores. Sobre las hojas, una decena de ranas se aprietan unas contra \
otras, en cuclillas. Son de un verde intenso y brillante, del verde esmeralda al verde \
casi negro, con las patas replegadas y el dorso marcado de líneas. En la parte baja de la \
panza se lee la firma moldeada «R. LALIQUE»."""
evocation = """
El Cleveland Museum ve en él la imagen de un pantano brumoso, un motivo típico del Art \
Nouveau. El estanque, con sus plantas acuáticas y sus pequeños animales, es uno de los \
temas favoritos de los artistas de la época, nutridos de estampas japonesas: un mundo \
oculto, húmedo, entre el agua y el aire, donde la vida bulle. Lalique saca de ello un efecto \
casi teatral: la transparencia velada del vidrio sugiere la profundidad del agua, \
mientras que las ranas, de un color vivo, parecen salidas de la superficie. \
El contraste entre el vidrio mate y el vidrio brillante, entre el gris y el verde, \
anima el objeto. No falta el humor: estas ranas apretadas como en una balsa \
tienen algo de vivo y de cómico."""
histoire = """
René Lalique (1860–1945), célebre al principio como joyero, se vuelve hacia el vidrio a \
comienzos del siglo XX. Hacia 1907 diseña frascos de perfume para François Coty; \
en 1909 alquila y luego compra una vidriería en Combs-la-Ville, cerca de París. Este jarrón, \
según el Cleveland Museum, es un testimonio temprano de sus investigaciones sobre el vidrio \
de arte, antes de la producción en serie de sus célebres jarrones moldeados de los años veinte. En el \
siglo XX pasa por varias colecciones, en América y en Japón, y por \
ventas en Phillips y en Christie's de Nueva York. El Cleveland Museum lo compra en 2007 \
gracias al fondo John L. Severance. El jarrón «Remolinos», de 1926, se presenta en \
la exposición dedicada a las artes decorativas."""
facture = """
Lalique asocia aquí varias técnicas, como explica el Cleveland Museum: el \
cuerpo del jarrón está moldeado, las ranas están hechas de vidrio verde colado y aplicado \
sobre la pared. El vidrio incoloro se deslustra después, sin duda con ácido, para darle \
su aspecto satinado, y se deposita una pátina gris en los huecos de las hojas \
y de los tallos para subrayar el relieve. Detalle ingenioso, Lalique colocó pequeñas \
láminas de metal detrás de las ranas: devuelven hacia la mirada una \
luz de un verde oscuro y profundo. El artista, acostumbrado al esmalte y a las \
piedras de color, traspone al vidrio sus investigaciones de joyero."""
details = [
  "Las ranas verdes en cuclillas, apretadas unas contra otras.",
  "Las hojas de nenúfar patinadas de gris, en el hombro.",
  "Los largos tallos ondulados que descienden hacia el pie.",
  "El vidrio deslustrado, mate y satinado, como agua turbia.",
  "La firma moldeada «R. LALIQUE», en la parte baja de la panza.",
]
themes = ["art nouveau", "ranas", "estanque", "vidrio moldeado", "lalique"]
