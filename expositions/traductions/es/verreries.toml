[[oeuvres]]
titre = "Vaso con vista de la Panierplatz de Núremberg"
artiste = "Hermann Schwinger"
annee = "hacia 1680"
image = "gobelet-schwinger.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1950.389"
technique = "Vidrio soplado, grabado a la rueda; altura 31,1 cm, diámetro 13,5 cm"
collection = "Cleveland Museum of Art"
note = "Un alto vaso de pie adornado con collarines, en el que el grabador nuremburgués Hermann Schwinger representó una plaza de su ciudad y a dos porteadores que se reparten una carga."
description = """
El vaso, de treinta y un centímetros de altura, se compone de una copa en forma de campana, \
de un largo tallo y de un ancho pie plano. El tallo alterna discos planos apilados, \
collarines y engrosamientos huecos, uno redondo y otro en forma de pera. En la \
copa, grabada en gris mate sobre el vidrio transparente, se extiende una vista de ciudad: \
casas de entramado de madera, tejados, una puerta, grandes árboles de follaje denso, una \
empalizada. En primer plano, en la plaza, dos hombres caminan uno detrás de otro, \
llevando juntos sobre los hombros una larga viga en la que se lee una inscripción. Bajo \
la escena, una banda de escritura gótica rodea la copa. El pie está grabado con \
ramas frondosas."""
evocation = """
La escena es a la vez una vista de Núremberg, la Panierplatz, y una alegoría, como \
indica el Cleveland Museum. Las inscripciones dan su sentido. En la viga se \
lee: «Es ruhet auf beiden», «descansa sobre los dos»; y alrededor de la \
copa: «Deine Last ist meine Last. Ruhest du, so hab ich Rast», «Tu carga es \
mi carga. Si tú descansas, yo descanso». Es una imagen de la amistad, o \
quizá del matrimonio, en que cada uno lleva su parte de la carga común. Se imagina este \
vaso alzado durante una comida, y la divisa leída en voz alta. Los vasos grabados \
servían así de regalos y de recuerdos, cargados de deseos, de divisas y de imágenes."""
histoire = """
Hermann Schwinger (1640–1683) es uno de los mejores grabadores sobre vidrio de Núremberg. \
La ciudad se había convertido, en el siglo XVII, en el gran foco de este arte en Alemania, después de \
que Georg Schwanhardt, alumno de Caspar Lehmann, grabador del emperador Rodolfo II en \
Praga, se estableciera allí. El Cleveland Museum clasifica el vidrio del vaso en la \
producción de Bohemia, cuyas vidrierías abastecían a los grabadores. El vaso está \
firmado y fechado. A principios del siglo XX pertenecía al coleccionista vienés Max \
Strauss, cuya colección se vendió en subasta en Viena en 1922. Pasa después \
a los marchantes Rosenberg y Stiebel, en Nueva York, antes de ser comprado en 1950 por el \
Cleveland Museum gracias al fondo John L. Severance."""
facture = """
El grabado a la rueda retoma las herramientas de los grabadores de piedras finas. El artesano \
utiliza pequeñas ruedas de cobre, de diámetros variados, montadas en un torno y \
untadas con una mezcla de aceite y polvo abrasivo. No mueve la herramienta: es \
el vidrio lo que presenta contra la rueda que gira, guiándolo con una precisión \
extrema. La rueda desgasta la superficie y deja un hueco mate y gris, más o menos profundo, \
que se lee como un dibujo en grisalla; algunas partes se dejan pulidas para \
atrapar la luz. Esta técnica requiere un vidrio grueso y duro; los vasos de \
Núremberg, con sus tallos de engrosamientos huecos y de collarines, ponían en valor la copa \
grabada."""
details = [
  "Los dos porteadores que comparten la misma viga sobre los hombros.",
  "La pequeña inscripción grabada en la viga.",
  "Las casas de entramado de madera y el follaje denso de los árboles.",
  "Los collarines apilados del tallo, alrededor del engrosamiento hueco.",
  "Las ramas grabadas en el pie.",
]
themes = ["grabado", "núremberg", "amistad", "divisa", "barroco"]
anecdote = """
El grabador trabajaba «al revés» de la luz: un hueco grabado parece claro sobre un \
fondo oscuro y oscuro sobre un fondo claro. Los fotógrafos de museo iluminan, pues, estos \
vidrios sobre un fondo negro, para hacer aparecer el dibujo."""
salle = 4
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Vaso con tapa con escena de parturienta"
artiste = "Jacob Sang (gravure), verrerie anglaise"
annee = "1750–1770"
image = "gobelet-jacob-sang.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/266209"
technique = "Vidrio de plomo soplado, grabado a la rueda; altura 25,8 cm, diámetro 11,5 cm"
collection = "Art Institute of Chicago"
note = "Un vaso de vidrio inglés de plomo, grabado en Ámsterdam con una alcoba de parturienta y con un brindis por la salud de la madre y del niño."
description = """
El vaso, coronado por su tapa, se alza sobre un fondo negro que hace resaltar el \
grabado. La copa, en forma de campana, descansa sobre un pie corto cuyo botón está \
sembrado de burbujas de aire dispuestas en corona. En el frente, una gran escena ocupa la \
copa: una cama con dosel, de cortinas recogidas, donde una mujer está sentada, apoyada en \
sus almohadas; a su lado, una nodriza se halla junto a una cuna. El suelo es un embaldosado en \
perspectiva. A lo largo del borde corre una inscripción en letras capitales. La tapa \
abombada está grabada con una guirnalda de follaje; termina en un botón de burbujas \
torcidas y una punta facetada."""
evocation = """
El vaso pertenece al ritual del nacimiento en las Provincias Unidas del siglo XVIII. \
Según el Art Institute, servía el kandeel, una bebida nutritiva de huevos, \
alcohol y canela, ofrecida a la parturienta y a sus visitas. El grabado muestra \
precisamente esa alcoba: la joven madre en la cama, la nodriza que mece al niño, un \
tendedero de pañales, sillas y una mesa dispuesta con golosinas y dos vasos \
semejantes a este. La inscripción lleva el brindis: «'t Welvaaren van de Kraamvrouw \
en Kindje», «por la salud de la parturienta y de su hijo». En una época en que \
el parto seguía siendo peligroso, el vaso celebra un nacimiento feliz y reúne \
a la familia en torno a la madre."""
histoire = """
El grabado se atribuye a Jacob Sang, activo en Ámsterdam en la década de 1750, uno de los \
grabadores más hábiles y reputados de la ciudad según el Art Institute. En los \
Países Bajos, la demanda de vidrios personalizados era inmensa: se grababan para las \
bodas, los nacimientos, los éxitos comerciales o los acontecimientos políticos. El \
vidrio, por su parte, procede de Inglaterra, cuyos vidrios de plomo eran muy apreciados por los \
grabadores holandeses. El vaso fue encargado por la familia de los barones van \
Slingelandt y se transmitió en la familia hasta el siglo XXI. Pasa después \
al marchante Frides Laméris, en Ámsterdam, antes de ser comprado en 2023 por el Art \
Institute of Chicago."""
facture = """
En 1674, el inglés George Ravenscroft patenta un vidrio en el que el óxido de plomo \
sustituye una parte de la potasa. Este vidrio de plomo, el futuro cristal, es pesado, \
muy claro y refracta fuertemente la luz; es también más blando, por tanto ideal \
para el grabado a la rueda, que puede excavar en él relieves muy finos y sombras \
matizadas. Sang aprovecha esta materia: las cortinas de la cama, los pliegues de las sábanas y \
el embaldosado se modelan con huecos más o menos profundos. El soplador inglés, \
por su parte, dejó en el botón del tallo una corona de burbujas de aire, obtenidas \
pinchando el vidrio caliente y recubriéndolo después con una nueva capa de vidrio: un adorno típico de los vidrios \
ingleses del siglo XVIII."""
details = [
  "La joven madre sentada en la cama con dosel de cortinas recogidas.",
  "La nodriza sentada junto a la cuna.",
  "El embaldosado del suelo, grabado en perspectiva.",
  "La corona de burbujas de aire en el botón del pie.",
  "La guirnalda de follaje grabada en la tapa.",
]
themes = ["nacimiento", "grabado", "ámsterdam", "vidrio de plomo", "brindis"]
anecdote = """
Los grabadores holandeses compraban tan gustosamente los vidrios ingleses que hicieron de ellos \
su soporte favorito: en las colecciones se encuentran a menudo vidrios soplados \
en Newcastle o en Londres y grabados en los Países Bajos."""
salle = 4
