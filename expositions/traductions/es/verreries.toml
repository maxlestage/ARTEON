[exposition]
ordre = 57
nom_court = "Vidrios"
mouvement = "El arte del vidrio, de la Antigüedad al Art Nouveau"
cadre = "vitrine"
couleur = "#2a7280"
titre = "Vidrios, treinta y cinco siglos de arte del vidrio"
artiste = "Gallé, Tiffany, Lalique, Hermann Schwinger, Jacob Sang, vidrieros de Egipto, de Roma, de El Cairo y de Murano…"
dates = "hacia 1386 a. C. – 1912"
accroche = "Exposición virtual · Corning Museum of Glass, Corning (Nueva York)"
introduction = """
El vidrio nace de la arena, de la sosa o de la potasa, y del fuego: una materia banal \
que se convierte, en manos de los vidrieros, en una de las más preciosas que existen. La \
visita sigue diez objetos a lo largo de más de tres mil años, desde un frasco de perfume modelado en \
Egipto en tiempos de Akenatón hasta los jarrones de Gallé, de Tiffany y de Lalique. En \
el camino se encuentran el retrato de oro de un joven alejandrino, una lámpara de mezquita esmaltada \
para un emir de El Cairo, un vaso de Murano tejido con hilos blancos, y las escenas grabadas \
a la rueda por los maestros de Núremberg y de Ámsterdam. El edificio se inspira en el Corning \
Museum of Glass, en el estado de Nueva York, el mayor museo del mundo dedicado al \
vidrio: se entra por un ala completamente blanca, bañada de luz, antes de recorrer \
las galerías históricas."""
vitrine = "vase-paon-tiffany.jpg"

[musee]
nom = "Corning Museum of Glass"
ville = "Corning, Nueva York, Estados Unidos"
architecte = "Harrison & Abramovitz (1951), Gunnar Birkerts (1980), Thomas Phifer and Partners (2015)"
construction = "1951–2015"
presentation = """
Corning, pequeña ciudad del norte del estado de Nueva York, vive del vidrio desde que la \
vidriería Corning Glass Works se instaló allí en 1868. En 1951, con motivo de su centenario, \
la empresa funda un museo dedicado al arte y a la historia del vidrio, alojado en un \
edificio de vidrio y acero diseñado por el estudio Harrison & Abramovitz. En junio de 1972, \
la crecida del río Chemung, engrosado por el huracán Agnes, inunda las galerías y \
daña centenares de objetos, restaurados con paciencia. Un nuevo edificio, obra del \
arquitecto Gunnar Birkerts, abre en 1980. En 2015, la Contemporary Art + Design \
Wing de Thomas Phifer añade un ala revestida de paneles de vidrio blanco: una vasta \
galería completamente blanca, iluminada por una luz natural difusa que cae del techo, \
y un taller en forma de anfiteatro donde se sopla el vidrio ante el público. Las galerías \
históricas recorren treinta y cinco siglos de vidrio; la biblioteca Rakow, vecina, \
es la gran biblioteca mundial del vidrio."""
ici = """
El edificio de ARTEON toma del Corning Museum sus dos rostros. Se entra por el sur \
en «El ala blanca», un gran volumen de dieciséis metros por doce, de ocho \
metros de altura, de muros blancos como la galería de Thomas Phifer: permanece vacío, para que \
se mire primero la luz. Al norte comienzan las galerías históricas, cuatro \
salas en hilera de oeste a este, como un recorrido cronológico: la Antigüedad, de \
muros gris arena; el Islam y Venecia, de un azul de laguna pálido; el vidrio grabado, gris \
perla; por último, la sala del Art Nouveau, más amplia y más alta, de un verde agua. Los \
objetos, a menudo de pocos centímetros de altura, se presentan allí ampliados en \
vitrinas murales sobre fondo claro."""

