[[oeuvres]]
titre = "Jarrón de las orquídeas"
artiste = "Émile Gallé"
annee = "hacia 1900"
image = "vase-orchidees-galle.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/45125"
technique = "Vidrio doblado, grabado al ácido y a la rueda; 29,4 × 14,3 × 11,8 cm"
collection = "Art Institute of Chicago"
note = "Orquídeas zapatito de Venus surgen en el espesor de un vidrio ámbar y púrpura: Gallé esculpe el vidrio como una piedra de varias capas."
description = """
El jarrón es un simple cilindro, de treinta centímetros de altura, de borde ligeramente engrosado. \
Su fondo es un vidrio ámbar, de un amarillo de miel que vira al anaranjado y, en algunos puntos, \
al rojo. Encima se destacan en relieve, de un púrpura muy oscuro, tallos y \
flores de orquídeas. Se reconocen sus pétalos rayados de finas nervaduras, su sépalo \
superior erguido como una capucha y, en el centro, su labelo hinchado en forma de pequeño \
zueco. Algunas flores se abren ampliamente, otras no son aún más que capullos. \
Abajo, largas hojas nervadas suben desde el pie y se curvan. La parte alta del \
jarrón es más oscura, como si las flores salieran de la sombra hacia la luz."""
evocation = """
Gallé fue a la vez vidriero, ebanista y apasionado botánico, miembro de la Sociedad \
central de horticultura de Nancy; cultivaba y estudiaba las plantas que \
representaba. Las orquídeas, llegadas de los invernaderos donde la Belle Époque las coleccionaba \
a precio de oro, fascinaban a sus contemporáneos por sus formas extrañas, casi animales \
: el zapatito de Venus parece un pequeño zapato. Gallé no se contenta con copiarlas. \
Al hacerlas surgir de la profundidad del vidrio, medio sumergidas en la penumbra, \
les da una vida misteriosa, próxima a los poemas simbolistas que amaba. Para él, \
el objeto de arte debía hablar de la naturaleza, pero también del alma: este jarrón es un invernadero \
en miniatura, y una ensoñación."""
histoire = """
Nacido en Nancy en 1846, hijo de un comerciante de lozas y vidrios, Émile Gallé estudia \
botánica y química, y luego aprende el oficio del vidrio en Meisenthal, en Lorena. \
Se hace cargo de la empresa familiar, que sus envíos a las Exposiciones Universales de París \
hacen célebre, en 1878, en 1889 y luego en 1900, donde triunfa. En 1901 funda con \
otros artistas la Escuela de Nancy, de la que es el primer presidente. Muere en 1904 \
; su vidriería sigue produciendo durante casi treinta años jarrones firmados con su nombre. Este, fechado \
hacia 1900, ingresó en el Art Institute of Chicago por donación de Mrs. Cyrus Bentley. Otra \
pieza de Gallé, el jarrón de los cólquicos del Metropolitan Museum, se presenta en \
la exposición dedicada a las artes decorativas."""
facture = """
El jarrón está hecho de vidrios superpuestos: el vidriero sopla una primera paraison ámbar \
y la recubre después con una o varias capas de vidrio de color. La decoración se \
talla luego en ese espesor, como en un camafeo. Gallé emplea ácido fluorhídrico, \
que corroe el vidrio: se protege el motivo con un barniz y luego se sumerge el jarrón en el \
baño, que disuelve la capa superior alrededor de las flores. Los detalles, nervaduras de los \
pétalos y de las hojas, se retoman a la rueda. Según el espesor de vidrio púrpura \
dejado en su sitio, el color va del rojo transparente al casi negro: es ese juego \
de profundidades el que da a la decoración su modelado y su luz."""
details = [
  "El labelo hinchado en forma de zueco, en el corazón de cada orquídea.",
  "Las finas rayas de los pétalos, retomadas a la rueda.",
  "Los capullos aún cerrados en el extremo de los tallos.",
  "Las largas hojas nervadas que suben desde el pie.",
  "El fondo ámbar que pasa del amarillo de miel al rojo.",
]
themes = ["art nouveau", "orquídeas", "nancy", "naturaleza", "camafeo"]
anecdote = """
En la puerta de sus talleres de Nancy, Gallé había hecho grabar una divisa: «Mi \
raíz está en el fondo de los bosques». Resume su arte, en el que cada objeto nace de \
la observación de las plantas."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Jarrón de las plumas de pavo real"
artiste = "Louis Comfort Tiffany"
annee = "1893–1896"
image = "vase-paon-tiffany.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/9480"
technique = "Vidrio Favrile soplado; 35,9 × 29,2 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Uno de los primeros jarrones de vidrio Favrile de Tiffany: una flor de vidrio irisado que se abre en abanico, cubierta de plumas de pavo real."
description = """
El jarrón tiene la forma de una flor o de un abanico abierto. De una panza redonda y baja \
sube un largo cuello estrecho, que se ensancha bruscamente en una vasta corola ondulada, \
pellizcada a los lados y que cae en dos puntas. Todo el objeto es de un verde oliva, \
atravesado por finas líneas más oscuras que parten del pie, suben a lo largo del cuello y \
se despliegan en la corola como las barbas de una pluma. En lo alto, estas líneas \
se enroscan alrededor de cuatro «ojos» de pavo real, manchas azul noche perfiladas de violeta \
y de dorado. La superficie está irisada: según el ángulo, se cubre de reflejos rosas, \
violetas, azules y dorados. El borde de la corola, de un verde más claro, está ligeramente \
ribeteado."""
evocation = """
El pavo real es uno de los emblemas del Esteticismo y del Art Nouveau, de la Peacock Room \
de Whistler en Londres a las joyas de Lalique. Dice el gusto de la época por la belleza \
pura, por el color y el lujo, y también por Oriente, de donde llegó el ave. Tiffany, \
pintor de formación, encontraba en él un motivo ideal para su vidrio, cuyos colores \
cambian con la luz como los de una pluma. No representa el ave: \
transforma el propio jarrón en rueda de pavo real, y la materia en plumaje. Esta fusión de \
la forma y la decoración, inspirada por la naturaleza, está en el corazón del Art Nouveau, y hace \
de este jarrón una escultura tanto como un recipiente."""
histoire = """
Louis Comfort Tiffany (1848–1933), hijo del fundador de la célebre joyería \
neoyorquina, se había dado a conocer primero como pintor, luego como decorador y \
creador de vidrieras. En 1893 abre su propia vidriería en Corona, en Queens, \
con el vidriero inglés Arthur J. Nash, y lanza el vidrio Favrile. Este jarrón figura entre \
las primeras realizaciones del taller. Ya en 1896, el magnate del azúcar Henry O. \
Havemeyer, gran coleccionista y cliente de Tiffany, que había decorado su casa \
neoyorquina, regala al Metropolitan Museum un conjunto de jarrones Favrile, entre ellos \
este. En París, el marchante Siegfried Bing expone el vidrio de Tiffany desde 1895 \
en su galería, la Maison de l'Art Nouveau."""
facture = """
Favrile es un nombre inventado por Tiffany, a partir de una vieja palabra inglesa, fabrile, «del \
artesano»; según el Cleveland Museum, debía sonar francés, precioso y \
artesanal. La decoración de plumas se obtiene en caliente: el soplador coloca sobre la paraison \
hilos de vidrio de color y luego los estira con un gancho para dibujar las barbas \
y los ojos, antes de dar al jarrón su forma final. La irisación procede de sales \
metálicas aplicadas sobre el vidrio aún caliente, que forman en la superficie una película \
muy fina en la que la luz se descompone. Tiffany buscaba así recuperar el brillo \
de los vidrios antiguos irisados por el enterramiento, que coleccionaba."""
details = [
  "Los cuatro «ojos» de pavo real azul noche, en lo alto de la corola.",
  "Las líneas finas que suben desde el pie como las barbas de una pluma.",
  "Los reflejos rosas y violetas de la irisación.",
  "La corola pellizcada que cae en dos puntas.",
  "La panza redonda y baja, de un verde más intenso.",
]
themes = ["art nouveau", "pavo real", "irisación", "nueva york", "vidrio favrile"]
anecdote = """
Tiffany creó también vidrieras, mosaicos y lámparas: su vidriera «Magnolias \
e iris» y la lámpara «Glicina» de sus talleres se presentan en la exposición \
dedicada a las artes decorativas."""
salle = 5
