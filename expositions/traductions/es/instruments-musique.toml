[[oeuvres]]
titre = "El clave dorado"
artiste = "Michele Todini"
annee = "hacia 1670"
image = "clavecin-todini.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Harpsichord_MET_DP204706a.jpg"
technique = "Madera tallada y dorada, ébano, marfil, pergamino; caja del clave: 37,5 × 299,7 × 96,5 cm"
collection = "Metropolitan Museum of Art, Nueva York (colección Crosby Brown)"
note = "Un clave sostenido por tritones, entre el cíclope Polifemo y la ninfa Galatea: el único objeto que se conserva del museo de instrumentos que Michele Todini había abierto en Roma."
description = """
Todo es de oro. En el centro, la larga caja del clave, de casi tres metros, descansa sobre los \
hombros de dos tritones, mitad hombres, mitad peces, cuyas colas se enroscan entre las olas. \
Entre ellos, dos nereidas emergen del agua con los brazos extendidos, como si nadaran. A la \
derecha, un pez fantástico de boca abierta lleva una gran concha sobre la que se sienta un \
pequeño amorcillo. El zócalo, curvo, imita un mar oscuro y se apoya en patas de león. El \
costado de la caja está cubierto por un friso en relieve donde desfilan carros, caballos \
marinos y divinidades: el triunfo de Galatea. A uno y otro lado, sobre dos rocas negras, se \
enfrentan el cíclope Polifemo, sentado, que sopla en una gaita, y Galatea, desnuda, con un \
echarpe flotando al viento."""
evocation = """
La escena procede de las Metamorfosis de Ovidio. El cíclope Polifemo ama a la ninfa Galatea, \
que prefiere al joven pastor Acis; canta su amor, en vano, y luego aplasta a su rival bajo una \
roca. Aquí, Todini solo retiene la música: el gigante toca para encantar a la ninfa, y el clave \
se convierte en el carro marino en el que ella triunfa. Instrumento, escultura y decorado de \
teatro a la vez, el objeto dice el gusto de la Roma barroca por lo maravilloso, las máquinas y \
los efectos de sorpresa, en la época de Bernini. Dice también lo que era la música en los \
palacios: tanto un espectáculo como un arte, hecho para deslumbrar a los visitantes."""
histoire = """
Músico establecido en Roma, Michele Todini abre en su casa, a partir de los años 1650, una \
Galleria Armonica, uno de los primeros museos de instrumentos musicales, que describe en un \
folleto publicado en 1676. Esta «máquina» es su pieza maestra. Un documento de pago de 1672 \
nombra al escultor Jacob Reiff; el dorado se atribuye a Basilio Onofri. Detrás del conjunto \
colgaban tres marinas pintadas por Gaspard Dughet, hoy perdidas. Tras la muerte de Todini, la \
colección se dispersa; el clave pasa por varias manos antes de entrar en el Metropolitan Museum \
con la colección de instrumentos de Mary Elizabeth Adams Brown. Los conservadores piensan que \
la figura de Galatea quizá no sea la original."""
facture = """
El clave propiamente dicho es un instrumento italiano clásico, de caja delgada, cuyas cuerdas \
son pulsadas por pequeños plectros cuando se hunden las teclas; está alojado en una segunda \
caja, esculpida y dorada, que le sirve de estuche. Las figuras están talladas en madera y luego \
cubiertas con una fina capa de imprimación y de pan de oro. El dorador ha jugado con el \
contraste entre el oro brillante de los cuerpos y el verde oscuro del mar. La composición se \
extiende como un bajorrelieve: los personajes se apoyan unos en otros, y la mirada se desliza \
de Polifemo, a la izquierda, a Galatea, a la derecha."""
details = [
  "Polifemo, a la izquierda, infla las mejillas en su gaita.",
  "El pequeño amorcillo sentado en la concha, a la derecha, sobre el pez.",
  "Las patas de león que sostienen el zócalo.",
  "El friso del triunfo de Galatea, en el costado de la caja.",
  "Las olas oscuras del zócalo, de donde salen las nereidas.",
]
themes = ["mitología", "barroco", "Roma", "oro", "clave", "espectáculo"]
anecdote = """
El conjunto era una verdadera máquina: Todini asociaba al clave otros sonidos, sin duda un \
pequeño órgano. El mecanismo y los tubos han desaparecido, y aún se discute si podían caber en \
la roca de Polifemo."""
salle = 1
mur = "ouest"
place = 2
largeur = 3.4

[[oeuvres]]
titre = "Pianoforte"
artiste = "Bartolomeo Cristofori"
annee = "1720"
image = "piano-cristofori.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Grand_Piano_MET_DP300941.jpg"
technique = "Ciprés, boj, cuero, abeto, pintura; altura sobre su soporte: 86,5 cm"
collection = "Metropolitan Museum of Art, Nueva York (colección Crosby Brown)"
note = "El piano más antiguo que se conserva en el mundo, construido en Florencia por el hombre que inventó el instrumento."
description = """
A primera vista, se diría un clave. La caja, en forma de ala, está pintada de negro por fuera y \
deja ver por dentro la madera clara del ciprés. La tapa, en dos partes, está levantada y \
sostenida por una simple varilla; deja al descubierto la tabla armónica, sobre la que las \
cuerdas se estiran desde el teclado hacia la punta del ala. El teclado, en la parte delantera, \
alinea teclas claras de boj y teclas oscuras para los sostenidos. El instrumento descansa sobre \
tres patas torneadas, pintadas de negro, unidas a unos patines. Ningún adorno, ningún dorado: \
la invención está oculta en el interior de la caja, en la hilera de pequeños martillos."""
evocation = """
Este mueble austero encierra una revolución. En un clave, por más que el músico pulse fuerte o \
suavemente, la cuerda pulsada suena siempre de la misma manera. Aquí, cada tecla lanza un \
martillo contra la cuerda: cuanto más presiona el dedo, más fuerte es el sonido. El teclado se \
vuelve capaz de matices, de crescendos, de canto. Toda la música para piano, de Mozart a Chopin \
y más allá, deriva de esta idea. Ante este instrumento modesto se comprueba cuán a menudo las \
grandes invenciones tienen una apariencia ordinaria: nada indica al visitante que es aquí donde \
empieza la historia del piano."""
histoire = """
Constructor de claves nacido en Padua, Bartolomeo Cristofori entra en 1688 al servicio del \
gran príncipe Fernando de Médici, en Florencia, para mantener los instrumentos de la corte. Un \
inventario de los Médici de 1700 menciona ya un «arpicimbalo», recién inventado por Cristofori, \
que suena suave y fuerte. En 1711, el escritor Scipione Maffei publica su descripción, con un \
dibujo del mecanismo. Se conservan tres pianos de Cristofori: este, fechado en 1720, y otros \
dos de 1722 y 1726, en Roma y en Leipzig. El de Nueva York entró en el Metropolitan Museum con \
la colección Crosby Brown. A finales de los años 1930, una restauración desafortunada sustituyó \
su tabla armónica, su puente y otras piezas originales."""
facture = """
El genio de Cristofori reside en la mecánica. La tecla levanta una palanca intermedia que \
proyecta el martillo, guarnecido de cuero, contra la cuerda; un escape libera enseguida el \
martillo, que vuelve a caer para dejar vibrar la cuerda en lugar de ahogarla. Un tope lo \
atrapa al vuelo para que no rebote, y un apagador se posa sobre la cuerda cuando se suelta la \
tecla. Estos principios, escape y apagadores, son todavía los de los pianos de hoy. La caja \
retoma la construcción ligera de los claves italianos, en ciprés."""
details = [
  "Sobre el teclado, una inscripción latina: Cristofori, de Padua, inventor, lo hizo en Florencia en 1720.",
  "La simple varilla que mantiene abierta la tapa.",
  "Las teclas claras de boj y los sostenidos oscuros, como en nuestros pianos.",
  "La curva del ala, que sigue la longitud decreciente de las cuerdas.",
]
themes = ["invención", "piano", "Florencia", "Médici", "mecánica"]
anecdote = """
Cristofori no llamó «piano» a su invento. Los documentos de la corte hablan de un clave que \
toca «piano e forte», suave y fuerte. Fue esta expresión, abreviada en pianoforte y luego en \
piano, la que dio nombre al instrumento."""
salle = 1
mur = "est"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Violín llamado «Kurtz»"
artiste = "Andrea Amati"
annee = "hacia 1560"
image = "violon-kurtz.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ex_%22Kurtz%22_Violin_MET_DP302645.jpg"
technique = "Abeto rojo, arce, ébano, pintura y dorado; altura 57,4 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Uno de los violines más antiguos que se conocen, salido del taller que dio al violín su forma. De 57 cm de alto, se muestra aquí ampliado."
description = """
El violín se yergue, ligeramente girado, en un haz de luz que lo recorta sobre el fondo negro. \
Su barniz pardo dorado, desgastado en algunos puntos, deja ver la veta del abeto en la tapa. \
Las dos efes se abren ampliamente a uno y otro lado del puente; más arriba, el diapasón de \
ébano sube hacia una voluta finamente tallada, flanqueada por clavijas torneadas y adornadas. \
En los aros, las tiras de madera que forman el costado del violín, se leen capitales pintadas \
en oro: algunas letras de un lema latino. En el fondo, invisibles aquí, subsisten las huellas \
de una decoración pintada: flores de lis en los ángulos, motivos geométricos y florales, y en \
el centro los restos de un blasón borrado."""
evocation = """
El lema de los aros, «Quo unico propugnaculo stat stabitque religio», puede traducirse: «por \
este único baluarte, la religión se mantiene y se mantendrá». El baluarte es el rey católico, \
en el momento en que las guerras de religión desgarran Francia. Las flores de lis designan la \
casa de Valois. Este violín no es, pues, solo un instrumento: es un emblema de corte, pintado \
con las armas de un soberano. Dice también el ascenso del violín, instrumento todavía reciente, \
tocado para la danza, que los príncipes empiezan a encargar por juegos completos, y que en un \
siglo se convertirá en el rey de la orquesta."""
histoire = """
Andrea Amati trabaja en Cremona, en Lombardía, a mediados del siglo XVI. La corte de Francia \
le encarga varios conjuntos de violines, violas y violonchelos decorados, el más célebre de los \
cuales lleva las armas de Carlos IX. El violín «Kurtz» pertenece a otro conjunto, marcado con \
el lema de sus aros; los conservadores del Met han propuesto vincularlo con la boda de Felipe \
II de España con Isabel de Valois, hija de Enrique II, en 1559, sin certeza. Debe su apodo al \
violinista Arved Kurtz, que lo poseyó de 1941 a 1991. El Metropolitan Museum lo compró en \
1999."""
facture = """
Amati construye sus instrumentos a partir de proporciones geométricas sencillas, trazadas con \
el compás, que fijan durante mucho tiempo el patrón del violín: una caja con dos escotaduras, \
una tapa de abeto abombada, un fondo y unos aros de arce, efes y una voluta. La tapa se talla \
en la masa y luego se vacía; un filete incrustado subraya los bordes. La decoración pintada y \
dorada, aplicada sobre la madera, hacía de cada instrumento de un conjunto una pieza única de \
un mismo servicio, como una vajilla de gala."""
details = [
  "En el aro, a la izquierda, las letras doradas de una palabra latina.",
  "Las clavijas torneadas y adornadas, a uno y otro lado del clavijero.",
  "La voluta, finamente tallada, en lo alto del mango.",
  "Las efes anchas y abiertas, típicas de los primeros violines.",
  "El desgaste del barniz en el centro de la tapa, bajo el puente.",
]
themes = ["violín", "Cremona", "Renacimiento", "corte", "lema"]
anecdote = """
Los instrumentos de Andrea Amati para la corte de Francia figuran entre los violines datables \
más antiguos. Antes de ellos, ningún violín conservado puede fecharse con certeza: es en \
Cremona donde comienza la historia material del violín."""
salle = 2
mur = "nord"
place = 1
largeur = 1.2

[[oeuvres]]
titre = "Violín llamado «Antonius»"
artiste = "Antonio Stradivari"
annee = "1711"
image = "violon-antonius.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:%22The_Antonius%22_Violin_MET_DP105130.jpg"
technique = "Arce, abeto rojo, ébano; altura 58,4 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un violín del gran periodo de Stradivari, cuya fecha el museo pudo leer gracias a la luz ultravioleta. De 58 cm de alto, se muestra aquí ampliado."
description = """
Visto de frente, sobre un fondo gris claro, el violín muestra su tapa de abeto, de veta fina y \
apretada en el centro, que se ensancha hacia los bordes. El barniz, de un pardo anaranjado, está \
desgastado en varios lugares, en particular bajo el puente, allí donde la mano y la barbilla \
del violinista lo han frotado durante generaciones. Las efes, largas y elegantes, encuadran un \
puente claro; debajo, el cordal de ébano queda sujeto por un botón. El diapasón negro sube \
hasta el clavijero, donde cuatro clavijas oscuras sostienen las cuerdas, y luego hasta la \
voluta. Un filete incrustado rodea el borde de la caja."""
evocation = """
El nombre de Stradivari se ha convertido, en todas las lenguas, en sinónimo de perfección. Ante \
este violín se comprende, sin embargo, que se trata ante todo de una herramienta de trabajo: su \
barniz desgastado cuenta dos siglos de música, de arco y de ensayos. A menudo se ha buscado un \
secreto de Stradivari, en el barniz, en la madera o en un tratamiento químico; los \
especialistas ven más bien en ello la culminación de una larga vida de experimentos, de \
mediciones y de gestos repetidos. El violín dice también la historia de las mujeres músicas: \
perteneció a una violinista estadounidense, que lo tocó hasta su muerte."""
histoire = """
Antonio Stradivari lo construye en Cremona en 1711, en pleno centro de lo que se llama su \
período de oro. Más tarde es vendido en Ginebra a una estadounidense, Anne Faye Matthews, que \
lo toca hasta su muerte en 1915. Su hija, la escultora bostoniana Annie Bolton Matthews Bryant, \
lo hereda junto con otro Stradivari, el «Francesca», y lega los dos violines al Metropolitan \
Museum, adonde llegan en la primavera de 1934. Su fecha fue durante mucho tiempo discutida: el \
testamento hablaba de 1721, un experto neoyorquino leía 1717 en los años 1950. El estudio del \
museo estableció que la etiqueta lleva «17ii», es decir, 1711."""
facture = """
Tras los ensayos de un modelo alargado en los años 1690, Stradivari adopta a principios del \
siglo XVIII un patrón más ancho, de bóveda más baja que la de los Amati, que da un sonido más \
potente. Elige maderas de gran calidad, abeto para la tapa, arce para el fondo, los aros y la \
voluta, y las cubre con un barniz cálido y transparente. Como casi todos los violines antiguos \
aún tocados en el siglo XIX, este ha sido sin duda adaptado al toque moderno, con un mango más \
largo y más inclinado."""
details = [
  "El barniz desgastado bajo el puente, de un tono más claro.",
  "El filete incrustado a lo largo del borde de la caja.",
  "Las efes, finas y alargadas.",
  "Las cuatro clavijas oscuras y la voluta en lo alto.",
]
themes = ["violín", "Cremona", "Stradivari", "virtuosismo", "datación"]
anecdote = """
A simple vista, la etiqueta pegada en el interior del violín es difícil de leer. Bajo la luz \
ultravioleta, las cifras «17ii» aparecen con claridad: 1711, y no 1717 o 1721 como se había \
creído."""
salle = 2
mur = "nord"
place = 4
largeur = 1.1

[[oeuvres]]
titre = "Guitarra de seis órdenes"
artiste = "Joseph Benedid"
annee = "1787"
image = "guitare-benedid.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Guitar_MET_DT6822a.jpg"
technique = "Pino, ébano, arce, hueso, caoba"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una guitarra de seis pares de cuerdas, hecha en Cádiz en el momento en que la guitarra española gana su sexta cuerda. Se muestra aquí ampliada."
description = """
La guitarra es más pequeña y más fina que las nuestras, con una caja estrecha de cintura muy \
marcada. Su tapa, de un pardo dorado, está perforada por una roseta redonda rodeada de círculos \
incrustados. Doce cuerdas, agrupadas por pares, descienden desde el clavijero hacia un puente \
bajo y estrecho; bajo este, unas incrustaciones oscuras dibujan arabescos en forma de bigote. \
Sobre la roseta, el extremo del diapasón está adornado con pequeñas barras incrustadas. El \
mango, recto, lleva trastes; termina en una cabeza plana, recortada, donde las clavijas se \
insertan por detrás, y que adorna una plaquita oval clara."""
evocation = """
Esta guitarra cuenta un momento de transición. En el siglo XVII, la guitarra española tenía \
cinco órdenes, es decir, cinco pares de cuerdas, y servía sobre todo para acompañar rasgueando \
acordes. A finales del siglo XVIII se le añade un sexto par, en los graves, que permite tocar a \
la vez un bajo y una melodía. Poco después, las cuerdas dobles dejarán paso a seis cuerdas \
simples: ha nacido la guitarra clásica. El instrumento evoca también Cádiz, puerto abierto a \
América, sus fandangos, sus seguidillas y sus teatros, donde la guitarra acompaña a los \
cantantes."""
histoire = """
Joseph Benedid trabaja en Cádiz, en Andalucía, entonces uno de los puertos más ricos de Europa, \
adonde llegan los barcos de las Américas. Junto con la familia Pagés, es uno de los primeros \
constructores en fabricar guitarras de seis órdenes; este modelo, más ancho, debía resistir la \
tensión de seis pares de cuerdas. Las guitarras de Cádiz son entonces muy buscadas por los \
músicos: el gran guitarrista Fernando Sor cita a Benedid entre los constructores cuyos \
instrumentos prefiere. El Metropolitan Museum la compró en 1992, gracias al legado de Clara \
Mertens, en memoria de su marido André Mertens."""
facture = """
La tapa es de pino, una madera ligera que vibra con facilidad. En el interior, Benedid la ha \
reforzado con dos barras dispuestas en abanico bajo el puente, en lugar de las simples barras \
transversales de las guitarras más antiguas: es uno de los primeros ejemplos de este \
varetaje en abanico que el luthier Antonio de Torres perfeccionará en el siglo XIX y que aún \
equipa las guitarras clásicas. El diapasón es de ébano; el museo señala también arce, caoba y \
hueso. Las cuerdas, de tripa, se pulsaban con los dedos."""
details = [
  "Las doce cuerdas agrupadas por pares.",
  "Los arabescos oscuros en forma de bigote bajo el puente.",
