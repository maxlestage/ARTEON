largeur = 1.2

[[oeuvres]]
titre = "Arpa de cabeza humana"
artiste = "Style mangbetu"
annee = "antes de 1928"
image = "harpe-mangbetu.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1929.344"
technique = "Madera, piel, fibra vegetal, metal, cuenta de vidrio; mango: 36,9 cm"
collection = "Cleveland Museum of Art"
note = "Un arpa de cinco cuerdas cuyo mango termina en una cabeza de cráneo alargado, según el ideal de belleza de los mangbetu."
description = """
La caja de resonancia, colocada en horizontal, tiene la forma de una barca o de un gran pez: un \
casco de madera cubierto de una piel oscura, perforado de pequeños agujeros, cuyo extremo se \
afina. Por el otro extremo se eleva el mango, que sube en arco hacia lo alto y termina en una \
pequeña cabeza humana esculpida. Este rostro de ojos entornados lleva un cráneo muy alargado, \
estirado hacia atrás, y en la oreja una cuenta de vidrio azul. A lo largo del mango, cinco \
clavijas de madera están clavadas una sobre otra; de ellas parten cinco cuerdas finas que \
descienden en diagonal hacia la piel de la caja. La madera, oscura y con pátina, ha adquirido \
el brillo del metal."""
evocation = """
Entre los mangbetu del noreste del Congo, la cabeza alargada era un signo de belleza y de \
rango: se vendaba el cráneo de los recién nacidos para estirarlo, y se subrayaba esta forma con \
un peinado en abanico. Al dar este rostro a su arpa, el escultor hace de ella una persona, casi \
un retrato, que parece cantar con el músico. Se ha demostrado que muchos de estos objetos \
figurativos se hicieron a comienzos del siglo XX para los visitantes, los militares y los \
administradores europeos, que los buscaban: el arpa dice también el encuentro, desigual, entre \
una corte africana y la mirada colonial."""
histoire = """
Las arpas de cinco cuerdas adornadas con una figura humana eran tocadas por varios pueblos del \
norte del Congo, para acompañar los cantos de hombres o de mujeres; el cráneo alargado de esta \
es característico de los mangbetu. Fue adquirida en 1928 en Ekibondo, entonces en el Congo \
belga, bajo la colonización, por el pintor de Cleveland Paul Travis, durante su viaje por \
África central. La compraba por cuenta de la asociación African Art Sponsors y de los Gilpin \
Players, la compañía de teatro afroamericana de Cleveland, que la donaron después al Cleveland \
Museum of Art."""
facture = """
La caja se talla en un solo trozo de madera y luego se cubre con una piel tensa, sujeta con \
clavijas o con costuras. El mango, encajado en la caja, se esculpe con la cabeza en la misma \
pieza de madera. Las cuerdas, de fibra vegetal, se enrollan en las clavijas y se atan, abajo, \
como en la mayoría de las arpas de la región, a una varilla situada bajo la piel, que transmite \
sus vibraciones. El escultor ha trabajado la cabeza con gran economía: unos pocos planos nítidos \
para la frente, los párpados y la boca, y el espectacular estiramiento del cráneo."""
details = [
  "La cuenta de vidrio azul colgada de la oreja.",
  "El cráneo estirado hacia atrás, en lo alto del mango.",
  "Las cinco clavijas alineadas a lo largo del mango.",
  "Los pequeños agujeros practicados en la piel de la caja.",
]
themes = ["África central", "mangbetu", "arpa", "retrato", "colonización"]
anecdote = """
Los Gilpin Players, para quienes se compró esta arpa, eran la compañía de teatro de Karamu \
House, en Cleveland, uno de los teatros afroamericanos más antiguos de Estados Unidos. Su \
colección africana se incorporó al museo de Cleveland ya en 1929."""
