[[oeuvres]]
titre = "Kora"
artiste = "Tradition mandingue"
annee = "antes de 1918"
image = "kora.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1918.352"
technique = "Calabaza, madera, piel, cuerdas y cordeles; altura 111,8 cm, diámetro de la calabaza 32,4 cm"
collection = "Cleveland Museum of Art"
note = "El arpa-laúd de los griots de África occidental: tenía veintiuna cuerdas, de las que solo quedan unas pocas."
description = """
Una gran calabaza cortada por la mitad, cubierta de una piel tensa y amarillenta, forma una caja \
redonda de unos treinta centímetros. Un largo mango de madera la atraviesa de parte a parte: \
sale en punta bajo la caja y se eleva, ligeramente curvado, muy por encima de ella. Sobre la \
piel se alza un alto puente de madera, con muescas, que mantenía las cuerdas en dos hileras. A \
uno y otro lado del mango, dos cortas asas de madera sobresalen de la caja: el músico las \
agarra para sostener el instrumento frente a sí. Solo subsisten algunas cuerdas. El borde de la \
piel está fijado con pequeñas clavijas de madera clavadas alrededor de la calabaza."""
evocation = """
Entre los pueblos mandingas, la kora es el instrumento de los griots, los jeli, guardianes de \
la memoria. De generación en generación, estas familias de músicos transmiten las genealogías, \
las alabanzas de los linajes y las grandes epopeyas, como la de Sundiata Keita, fundador del \
imperio de Malí. Tocar la kora es, pues, hacer hablar a la historia. Esta kora desgastada, \
privada de la mayoría de sus cuerdas, lleva en el dorso costuras que reparan antiguas grietas: \
señal de que sirvió durante mucho tiempo y de que se quiso mantenerla en condiciones de tocar."""
histoire = """
La kora se toca en Gambia, Senegal, Guinea, Guinea-Bisáu y Malí; la tradición oral sitúa su \
origen en el antiguo reino de Kaabu. A finales del siglo XVIII, el explorador escocés Mungo \
Park describe ya una gran arpa de dieciocho cuerdas, que llama korro. Se ignora dónde y por \
quién fue fabricado este ejemplar, y cómo salió del África occidental, entonces bajo dominio \
colonial francés y británico. Fue donado al Cleveland Museum of Art en 1918 por Ralph King, \
junto con otros instrumentos musicales."""
facture = """
La caja es una calabaza, el fruto seco de una planta trepadora, cortada y cubierta con una piel \
de vaca tensa. El mango, de madera dura, atraviesa la calabaza y sirve de eje a todo el \
instrumento. Las veintiuna cuerdas, antaño de tiras de cuero, hoy a menudo de hilo de nailon, \
parten de un anillo en la base, pasan por las muescas del puente en dos hileras y se atan al \
mango mediante anillas de cuero que se deslizan para afinar. El músico pulsa las cuerdas con \
los pulgares y los índices, tocando a la vez un bajo, un motivo repetido e improvisaciones."""
details = [
  "El alto puente con muescas erguido sobre la piel.",
  "Las dos asas de madera que flanquean el mango.",
  "Las pequeñas clavijas clavadas alrededor de la calabaza.",
  "La punta del mango, que sobresale bajo la caja.",
]
themes = ["África occidental", "griot", "memoria", "kora", "epopeya"]
anecdote = """
La kora es hoy uno de los instrumentos africanos más conocidos en el mundo. Desde los años \
1970, griots tañedores de kora actúan en las grandes salas de conciertos y graban con músicos \
de jazz, de música clásica o de blues."""
