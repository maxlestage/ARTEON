place = 2
largeur = 1.3

[[artistes]]
nom = "Michele Todini"
vie = "Saluzzo (Piamonte), bautizado en 1616 – Roma, 1690"
biographie = """
Nacido en el Piamonte, Michele Todini se instala en Roma en su juventud y hace carrera como \
músico; está vinculado a la congregación de Santa Cecilia, que reúne a los músicos de la ciudad. \
Pero su pasión está en otra parte: la mecánica aplicada a la música. Durante años, imagina y \
hace construir instrumentos de transformación, teclados que gobiernan varios instrumentos a la \
vez, autómatas sonoros. A partir de los años 1650, los reúne en su casa romana, que abre a los \
visitantes con el nombre de Galleria Armonica. Es uno de los primeros museos de instrumentos \
musicales del mundo. En 1676 publica su descripción, la Dichiaratione della Galleria Armonica, \
que permite hoy reconstruir lo que mostraba. Para realizar sus máquinas, Todini se rodea de \
escultores, doradores y pintores, como el paisajista Gaspard Dughet. La empresa, demasiado \
ambiciosa, le causa graves dificultades financieras. Tras su muerte, la colección se dispersa; \
de toda la Galleria, solo el clave dorado del Metropolitan Museum ha llegado hasta nosotros."""
style = """
Todini no es un constructor en el sentido habitual: es un inventor y un director de escena. \
Asocia la música, la escultura, la pintura y la mecánica en conjuntos espectaculares, \
inspirados en la mitología, que debían sorprender al visitante tanto como encantarlo. Sus \
máquinas pertenecen plenamente a la cultura de la Roma barroca, enamorada de las fuentes \
animadas, los decorados de teatro y los gabinetes de curiosidades."""

[[artistes]]
nom = "Bartolomeo Cristofori"
vie = "Padua, 4 de mayo de 1655 – Florencia, 27 de enero de 1731"
biographie = """
Se sabe poco de los comienzos de Bartolomeo Cristofori en Padua, donde sin duda aprende la \
construcción de claves. En 1688, el gran príncipe Fernando de Médici, hijo del gran duque de \
Toscana, apasionado por la música, lo contrata en Florencia para mantener y construir los \
instrumentos de su corte. Cristofori dispone de un taller, de ayudantes y de medios. Construye \
claves, espinetas, instrumentos de cuerda, e inventa varios mecanismos. Hacia 1700, perfecciona \
un clave cuyas cuerdas son golpeadas por martillos y no pulsadas: un inventario de la corte lo \
menciona ese año. En 1711, el escritor Scipione Maffei publica en una revista erudita la \
descripción del invento, con un dibujo del mecanismo; traducido al alemán, el artículo dará a \
conocer el procedimiento más allá de los Alpes. Tras la muerte del gran príncipe, en 1713, \
Cristofori sigue al servicio de los Médici como conservador de su colección de instrumentos. \
Continúa perfeccionando su piano hasta el final de su vida. Se conservan tres de sus pianos, en \
Nueva York, Roma y Leipzig, junto con algunos claves y espinetas."""
style = """
Cristofori es tanto un ingeniero como un artesano. Sus instrumentos son sobrios por fuera, pero \
su mecánica es de una ingeniosidad asombrosa: el escape, que libera el martillo tras el golpe, \
y los apagadores siguen siendo los principios de todos los pianos. Concibió también cajas más \
sólidas para soportar cuerdas más tensas. Sin él, no habrían existido ni el piano de Mozart, ni \
el de Beethoven, ni el piano moderno."""

[[artistes]]
nom = "Andrea Amati"
vie = "Cremona, hacia 1505 – Cremona, hacia 1577"
biographie = """
Andrea Amati es el primer gran luthier de Cremona, ciudad de Lombardía entonces bajo dominio \
español. Se sabe poco de su formación; está establecido en su propia casa y su propio taller en \
los años 1530. Construye primero laúdes y violas, y luego se consagra a una familia de \
instrumentos todavía nueva: el violín, la viola y el violonchelo. Su talento le vale encargos \
prestigiosos, en particular de la corte de Francia, para la que realiza varios conjuntos de \
instrumentos pintados y dorados, el más famoso de los cuales lleva las armas del rey Carlos IX. \
Sus dos hijos, Antonio y Girolamo, toman el relevo del taller; su nieto Nicolò Amati, en el \
siglo XVII, será el luthier más célebre de su tiempo y formará, según toda verosimilitud, a \
Andrea Guarneri y quizá a Antonio Stradivari. Así, del taller de Andrea Amati salió toda la \
escuela de laudería de Cremona, que domina Europa durante cerca de dos siglos. Sus \
instrumentos, escasos, figuran hoy entre los más preciados de la laudería."""
style = """
Andrea Amati dio al violín su forma casi definitiva: caja de dos escotaduras, bóveda marcada, \
efes, voluta esculpida. Sus instrumentos, de pequeño tamaño, de barniz dorado, tienen un sonido \
suave y claro. Funda el método cremonés, que se basa en moldes interiores y en proporciones \
geométricas trazadas con el compás, transmitido a sus descendientes y luego a sus discípulos."""

[[artistes]]
nom = "Antonio Stradivari"
vie = "Cremona (?), hacia 1644 – Cremona, 18 de diciembre de 1737"
biographie = """
Se ignoran la fecha y el lugar exactos del nacimiento de Antonio Stradivari, probablemente en \
Cremona, hacia 1644. Una etiqueta de 1666 lo declara discípulo de Nicolò Amati, sin que esta \
formación sea segura. Establecido por su cuenta, trabaja primero en el espíritu de los Amati y \
luego experimenta, en los años 1690, con un violín más alargado. Hacia 1700 comienza lo que \
los especialistas llaman su período de oro, que dura unos veinte años: sus violines adquieren \
entonces su forma más lograda. Vive y trabaja en una casa de la plaza de San Domingo, en \
Cremona, con sus hijos Francesco y Omobono, que lo ayudan en el taller. Sus clientes son \
príncipes, cortes e iglesias de toda Europa. Construye también violonchelos, violas, guitarras \
y arpas. Trabaja hasta más de los noventa años. Se estima que fabricó más de un millar de \
instrumentos, de los que se conservan unos seiscientos. En el siglo XIX, virtuosos como \
Paganini y los comerciantes parisinos hacen de su nombre una leyenda."""
style = """
Los violines de Stradivari se reconocen por su elegancia: un contorno amplio y equilibrado, \
bóvedas más bajas que las de los Amati, efes finas, un barniz rojo anaranjado transparente. Su \
sonido, a la vez potente y rico, conviene a las grandes salas de conciertos. Sirven de modelo \
a casi todos los luthiers desde hace dos siglos, y siguen siendo codiciados por los más grandes \
solistas."""

[[artistes]]
nom = "Joseph Benedid"
vie = "Cádiz (España), 1760 – 1836"
biographie = """
La vida de Joseph Benedid es mal conocida. Trabaja en Cádiz, en Andalucía, en la segunda mitad \
del siglo XVIII y a principios del XIX. La ciudad es entonces una de las más ricas de España: \
desde 1717, concentra el comercio con las colonias de América, y su burguesía mercantil \
frecuenta los teatros, los salones y los cafés donde se canta y se baila al son de la guitarra. \
Cádiz se convierte en un centro de construcción de guitarras, en torno a la familia Pagés y a \
Benedid. Estos artesanos participan en una transformación decisiva del instrumento: construyen \
guitarras de seis órdenes, más anchas y más sólidas, y refuerzan la tapa con barras dispuestas \
en abanico. La guitarra del Metropolitan Museum, fechada en 1787, muestra ya estas dos \
novedades. A principios del siglo XIX, el guitarrista y compositor Fernando Sor cita a Benedid \
entre los constructores cuyos instrumentos aprecia. En los años siguientes, las cuerdas dobles \
ceden el paso a las seis cuerdas simples, y los constructores andaluces desempeñan un papel \
mayor en el nacimiento de la guitarra clásica."""
style = """
Las guitarras de Benedid son ligeras, de caja estrecha y cintura marcada, adornadas con \
sobriedad con incrustaciones oscuras alrededor de la roseta y del puente. Su varetaje en \
abanico, todavía discreto, anuncia el de Antonio de Torres, que fijará en el siglo XIX la forma \
de la guitarra clásica que se toca todavía hoy."""

[[artistes]]
nom = "Manol (Emmanuel Venios)"
vie = "Folegandros (Grecia) o Estambul, 1838 o 1845 – Estambul, 1915 o 1916"
biographie = """
Emmanuel Venios, a quien toda Estambul llamaba Manol, pertenece a la comunidad griega ortodoxa \
de la capital otomana. Las fuentes no concuerdan sobre su nacimiento: el Metropolitan Museum lo \
hace nacer en la isla de Folegandros en 1838, otros en Estambul en 1845. Habría sido primero \
carpintero y ebanista antes de consagrarse a la laudería, en los años 1870. En Constantinopla, \
ciudad donde conviven turcos, griegos, armenios y judíos, construye ūds y lavtas para los \
músicos de todas las comunidades, los de los cafés como los de los salones. Su taller conoce un \
gran éxito, y sus instrumentos son buscados por su sonoridad, su ligereza y la finura de su \
decoración. Se le atribuye la invención del ūd turco moderno, más pequeño y afinado más alto que \
el ūd árabe. Muere en 1915 o 1916, durante la Primera Guerra Mundial. Sus ūds son hoy piezas de \
colección, tocadas por los más grandes músicos, y han sido copiados por generaciones de luthiers \
en Turquía, Grecia y Armenia."""
style = """
Los ūds de Manol se reconocen por su caja ligera hecha de costillas muy finas, por sus tres \
rosetas finamente caladas y por su decoración de nácar, sobria o profusa según los encargos. Su \
sonido, claro y potente, definió el del ūd turco. Siguen siendo el modelo de referencia de los \
luthiers que fabrican ūds de estilo otomano."""

[[artistes]]
nom = "Inde du Sud"
vie = "Tamil Nadu, Karnataka, Andhra Pradesh y Kerala; tradición culta desde la Edad Media hasta nuestros días"
biographie = """
El sur de la India posee su propia tradición de música clásica, la música carnática, distinta \
de la música hindustaní del Norte. Se basa en ragas, modos melódicos asociados a emociones y a \
momentos, y en ciclos rítmicos, los talas; es sobre todo vocal y en gran medida religiosa, \
cantada en honor de los dioses. Durante siglos, se cultiva en los templos y en las cortes de los \
soberanos, en particular en Thanjavur, donde los Nayak y luego los maratas mantienen músicos, \
poetas y bailarines. En el tránsito de los siglos XVIII y XIX viven los tres grandes \
compositores de esta tradición, Tyagaraja, Muthuswami Dikshitar y Syama Sastri, cuyos cantos \
siguen estando en el corazón del repertorio. Los instrumentos del Sur, vina, violín adoptado en \
el siglo XIX, flauta de bambú, tambor mridangam, sirven ante todo para acompañar o imitar la \
voz. Los artesanos que los fabrican, a menudo procedentes de familias de carpinteros y de \
escultores, trabajan la madera de yaca, la laca, el pan de oro y la pintura, como para los \
objetos de los templos."""
style = """
Los instrumentos del sur de la India se distinguen por sus cajas talladas en la masa, sus \
cabezas esculpidas de monstruos protectores, los yalis, y una decoración donde se combinan el \
dorado, la pintura floral y el marfil o el hueso. Su forma está pensada para el toque sentado \
en el suelo y para los deslizamientos de notas, los gamakas, que hacen la expresividad de la \
música carnática."""

[[artistes]]
nom = "Atelier des Gotō"
vie = "Kioto, luego Edo (Japón), desde finales del siglo XV hasta el siglo XIX"
biographie = """
La familia Gotō es la más célebre dinastía de orfebres de Japón. Su fundador, Gotō Yūjō, \
fallecido en 1512, sirve al shogun Ashikaga Yoshimasa en Kioto y se especializa en las \
guarniciones de sable: pequeños adornos de metal, guardas, empuñaduras, que los guerreros \
llevan como joyas. Durante diecisiete generaciones, los maestros Gotō se transmiten el nombre, \
los modelos y los secretos del taller. Trabajan para los shoguns y los grandes señores, y una \
rama de la familia se encarga, a partir de finales del siglo XVI, de fabricar las grandes \
piezas de oro oficiales, los ōban. En el siglo XVII, bajo el shogunato de los Tokugawa, el \
taller se reparte entre Kioto y la nueva capital, Edo. Gotō Teijō, noveno maestro, nacido en \
1603 y fallecido en 1673, pasa por uno de los más hábiles del linaje: a él se atribuyen los \
adornos de metal del koto del Metropolitan Museum. El estilo de los Gotō, muy codificado, se \
convierte en el estilo oficial de las guarniciones de sable de los samuráis de alto rango hasta \
el siglo XIX."""
style = """
Los Gotō trabajan pequeños relieves de oro, plata y shakudō, una aleación de cobre y oro con \
pátina negra, sobre fondos finamente granulados. Sus temas favoritos, leones, dragones, flores, \
animales y emblemas de familia, están cincelados con una precisión minuciosa y una gran \
contención. Su arte, concebido para el ceremonial, privilegia la perfección técnica y el \
respeto a los modelos transmitidos."""

[[artistes]]
nom = "Tradition mandingue"
vie = "África occidental: Gambia, Senegal, Guinea, Guinea-Bisáu, Malí; desde la Edad Media"
biographie = """
Los mandingas, o mandé, son un conjunto de pueblos de África occidental, malinké, mandinka, \
bambara y otros, que se reclaman del imperio de Malí, fundado en el siglo XIII por Sundiata \
Keita. Su sociedad ha estado organizada durante mucho tiempo en grupos hereditarios, entre los \
cuales el de los jeli, los griots. Estas familias de músicos, narradores y genealogistas son los \
guardianes de la memoria: transmiten oralmente la historia de los linajes, las alabanzas de las \
grandes familias y la epopeya de Sundiata. Los griots sirven de consejeros, de mediadores y de \
maestros de ceremonias; sus instrumentos, la kora, el balafón, xilófono de calabazas, y el \
ngoni, pequeño laúd, se transmiten de padres a hijos junto con el repertorio. La kora parece \
aparecer en el oeste del mundo mandinga, en el antiguo reino de Kaabu, en los confines de \
Gambia, Casamance y Guinea-Bisáu. En la época colonial, la tradición de los griots se mantiene \
pese a los trastornos. Desde las independencias, conoce una proyección mundial, gracias a \
tañedores de kora convertidos en estrellas internacionales."""
style = """
La música de los griots mandingas se basa en la repetición y la variación: un motivo de base, \
tocado en bucle, sirve de fondo a improvisaciones y al canto de alabanza o de relato. Los \
instrumentos están hechos de materiales naturales, calabaza, madera, piel, cuero, y su \
fabricación, sencilla en apariencia, exige un gran conocimiento de la afinación y del sonido."""

[[artistes]]
nom = "Style mangbetu"
vie = "Noreste de la República Democrática del Congo, siglos XIX–XX"
biographie = """
Los mangbetu viven en el bosque y la sabana del noreste de la actual República Democrática del \
Congo, cerca del río Uele. En el siglo XIX forman un reino poderoso, cuyos soberanos viven en \
vastas cortes rodeadas de músicos, bailarines y artesanos. Los primeros viajeros europeos, en \
los años 1870, describen con admiración estas cortes y sus objetos. A finales del siglo XIX, la \
región es conquistada e integrada en el Estado Libre del Congo, propiedad personal del rey de \
los belgas Leopoldo II, y luego en el Congo belga a partir de 1908. Los administradores, \
militares y viajeros europeos buscan entonces los objetos mangbetu, en particular los que \
llevan la característica cabeza alargada: estatuillas, cerámicas, cajas, cuchillos y arpas. Los \
escultores, mangbetu pero también zande y de otros pueblos vecinos, multiplican estas figuras, \
en parte para este nuevo público. Los historiadores del arte han mostrado que así se formó a \
comienzos del siglo XX un estilo mangbetu, en el cruce de las tradiciones de corte y de la \
demanda colonial."""
style = """
El estilo mangbetu se reconoce por sus cabezas de cráneo estirado hacia atrás, de rasgos finos y \
serenos, a veces realzadas con un peinado en abanico o con una cuenta. Los escultores lo aplican \
a objetos utilitarios, arpas, cerámicas, cajas, que transforman en figuras humanas. El trabajo \
de la madera, liso y con pátina, busca la elegancia y la economía de las formas."""
