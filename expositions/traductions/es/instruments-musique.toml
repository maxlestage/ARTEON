[[oeuvres]]
titre = "Ūd"
artiste = "Manol (Emmanuel Venios)"
annee = "1916"
image = "oud-manol.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:%C5%AAd_MET_DP346448.jpg"
technique = "Abeto rojo, morera, maderas diversas, nácar, almáciga; 80 × 36,4 × 18,9 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un ūd salido del taller de Manol, el luthier de Estambul cuyos instrumentos siguen siendo una referencia entre los intérpretes de música otomana."
description = """
El ūd tiene forma de media pera. Su tapa, de abeto claro, está perforada por tres rosetas \
caladas: una grande en el centro y dos pequeñas más abajo, a los lados, recortadas en estrellas \
y en lacerías de gran finura. Debajo, una ancha placa oval de nácar, grabada con motivos \
florales, protege la tapa de los golpes del plectro. Las cuerdas, agrupadas por pares, se \
sujetan a un cordal pegado cerca del borde inferior. El mango, corto y sin trastes, está \
incrustado de roleos de nácar; termina en un clavijero bruscamente doblado hacia atrás, \
erizado de clavijas oscuras. De lado, se adivina la caja abombada, hecha de costillas de madera \
oscura subrayadas con filetes claros."""
evocation = """
El ūd es el instrumento rey de las músicas árabe, turca y persa, y el antepasado del laúd \
europeo. Su mango sin trastes permite tocar todos los intervalos de los maqams, esos modos que \
dividen la octava con mayor finura que la escala occidental. Hecho en Estambul por un luthier \
griego para músicos turcos, armenios, judíos o griegos, este instrumento evoca una capital \
cosmopolita donde las músicas circulaban de una comunidad a otra. Fechado en 1916, en plena \
Primera Guerra Mundial, pertenece también a los últimos años del Imperio otomano, cuyo mundo \
iba a desaparecer pocos años después."""
histoire = """
Emmanuel Venios, llamado Manol, es un luthier griego de Constantinopla, la actual Estambul. \
Sus ūds y sus lavtas, un pequeño laúd con trastes de la música otomana, eran buscados en vida \
por los mejores músicos de la ciudad, y lo siguen siendo hoy. Este ūd lleva la fecha de 1916, \
aunque Manol muere en 1915 o en 1916: es uno de los últimos instrumentos salidos de su taller. \
El Metropolitan Museum lo compró en 2014. Desde entonces lo ha tocado el udista estadounidense \
Ara Dinkjian, en un vídeo difundido por el museo."""
facture = """
La caja está hecha de costillas muy finas de morera, curvadas al calor y luego pegadas una \
junto a otra sobre un molde, como las duelas de un tonel. La tapa de abeto, delgada, se talla \
con sus tres rosetas antes de ser pegada. Se atribuye a Manol la puesta a punto de un ūd algo \
más pequeño y afinado más alto que los ūds árabes, convertido en el modelo del ūd turco. El \
museo señala también, entre sus materiales, almáciga, la resina aromática del lentisco. Las \
cuerdas se pulsan con un largo plectro, antaño una pluma."""
details = [
  "Las tres rosetas caladas, recortadas como encaje.",
  "La gran placa de nácar grabada, bajo las rosetas.",
  "El mango sin trastes, incrustado de roleos de nácar.",
  "El clavijero doblado en un ángulo casi recto.",
  "Las costillas oscuras de la caja, visibles de lado.",
]
themes = ["ūd", "Estambul", "Imperio otomano", "maqam", "nácar"]
anecdote = """
La palabra árabe al-ʿūd, «la madera», pasó a Europa por la España musulmana: dio laúd en \
español, liuto en italiano, luth en francés y lute en inglés. El laúd del Renacimiento es un \
descendiente directo del ūd."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Vina"
artiste = "Inde du Sud"
annee = "finales del siglo XVIII"
image = "vina.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/506151"
technique = "Madera de yaca, pan de oro, papel maché, hueso, acero, latón; 37,5 × 121,5 × 34 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El gran laúd de la música clásica de la India meridional, rematado por una cabeza de monstruo dorada."
description = """
La vina está tendida, como la sostiene el músico. A la derecha, una gran caja redondeada, de \
madera pardo rojiza, está cerrada por una tapa plana donde se apoyan las cuerdas; unas bandas \
doradas subrayan su borde. De ella parte un largo mango recto, sobre el que se alinean \
veinticuatro trastes de latón fijados sobre crestas de cera negra. Al final, el mango se curva \
en una cabeza de yali, un monstruo mítico, dorada y realzada de rojo. Bajo el mango, cerca de \
esta cabeza, una segunda caja redonda, de papel maché, está pintada de flores sobre fondo verde \
oscuro y de bandas rojas y doradas. Cuatro gruesas clavijas negras sostienen las cuerdas \
principales; otras tres, en el costado, tensan las cuerdas de bordón."""
evocation = """
En la India, la vina es el instrumento de Sarasvati, diosa del saber, de la palabra y de las \
artes, que casi siempre se representa sosteniéndola. Tocar la vina es, pues, practicar un arte \
sagrado tanto como una música culta. En la música carnática, la música clásica del Sur, es el \
instrumento de referencia, aquel cuyo sonido lento y deslizante imita la voz humana. La cabeza \
de yali, guardián de los templos del Sur, protege simbólicamente el instrumento. La decoración \
dorada y pintada hace de esta vina un objeto de prestigio, digno de una corte o de una gran \
familia de músicos."""
histoire = """
La palabra vina designa en sánscrito, desde la Antigüedad, varios instrumentos de cuerda. La \
forma de esta, con veinticuatro trastes fijos, se establece en el Sur en el siglo XVII; su \
puesta a punto se atribuye a la corte de los Nayak de Thanjavur. A finales del siglo XVIII, \
época de este instrumento, viven los tres grandes compositores de la música carnática, entre \
ellos Muthuswami Dikshitar, él mismo tañedor de vina. Se ignora para quién se hizo esta vina. \
Fue donada al Metropolitan Museum en 2009 por Michael Pellettieri, en memoria de Y. G. Srimati, \
música y artista."""
facture = """
La gran caja, el mango y la cabeza se tallan tradicionalmente en madera de yaca, un árbol \
frutal del sur de la India. La caja se vacía en la masa y luego se cierra con una tapa delgada. \
Los trastes de latón reposan sobre cera, que puede calentarse para desplazarlos y ajustar la \
afinación. El músico toca sentado en el suelo, con el instrumento colocado de través sobre las \
rodillas y la pequeña caja apoyada en el muslo izquierdo; la mano derecha pulsa las cuerdas, y \
la izquierda las desliza sobre los trastes para obtener los ornamentos característicos del \
canto carnático."""
details = [
  "La cabeza de yali dorada, con la boca abierta, al final del mango.",
  "La caja redonda de papel maché, pintada de flores.",
  "Los trastes de latón colocados sobre crestas de cera negra.",
  "Las tres clavijas laterales de las cuerdas de bordón.",
  "Las bandas doradas en el borde de la gran caja.",
]
themes = ["India", "música carnática", "Sarasvati", "sagrado", "yali"]
anecdote = """
Los trastes de la vina son altos: al tirar de la cuerda hacia un lado, el músico hace subir la \
nota sin cambiar de traste, como un cantante que se desliza de un sonido a otro. Es este \
deslizamiento, llamado gamaka, el que da a la música carnática su carácter."""
salle = 4
mur = "nord"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Koto, con su estuche y su funda"
artiste = "Atelier des Gotō"
annee = "comienzos del siglo XVII"
image = "koto.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Koto_MET_DP148476.jpg"
technique = "Maderas diversas, incrustaciones de marfil, carey, oro y plata, metal, laca, seda; 13 × 189,5 × 24,2 cm; adornos de metal de Gotō Teijō"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una cítara de trece cuerdas adornada por Gotō Teijō, maestro orfebre de la familia Gotō, presentada con su estuche lacado, su funda de seda y sus puentes."
description = """
Tres elementos se disponen uno bajo otro. Arriba, un largo estuche de laca negra, de tapa \
ligeramente abombada, decorado con grullas de oro inscritas en círculos y con pájaros en vuelo, \
está atado con un cordón naranja. En medio, el propio koto, de casi dos metros de largo: una \
caja ligeramente abombada, cuya madera muestra una veta ondulada, con los extremos adornados \
de carey, marfil y metal cincelado. Abajo, la funda de seda azul brocada de motivos florales, \
orlada de borlas rojas, con su vuelta de brocado dorado, y, delante de ella, una pequeña bolsa \
y los trece puentes, alineados como diminutos caballetes de pintor."""
evocation = """
El koto, llegado de China en el siglo VII o VIII, es en Japón el instrumento de la aristocracia, \
el que tocan las damas de la corte en las novelas de la época Heian. Este suntuoso koto \
pertenece al momento en que la sociedad de los guerreros adopta estos refinamientos. Las \
grullas, aves de larga vida, desean dicha y longevidad a su propietario; los leones y las flores \
de metal que adornan sus extremos son motivos de prestigio. El cuidado puesto en el estuche, la \
funda y los puentes muestra que el objeto se transmitía como un tesoro familiar, envuelto, \
guardado y desenvuelto según un verdadero ceremonial."""
histoire = """
Según una tradición recogida por el museo, este koto habría sido regalado por el señor Hosokawa \
Tadaoki al noble cortesano Karasumaru Mitsuhiro, en agradecimiento por haber ayudado, en 1600, \
a levantar el asedio del castillo de Tanabe, donde estaba encerrado el padre de Tadaoki, \
Hosokawa Yūsai. Sus adornos de metal se atribuyen a Gotō Teijō, noveno maestro de la familia \
Gotō. El estuche lacado se hizo más tarde, a comienzos del siglo XIX, y la funda data de los \
siglos XVIII y XIX. El Metropolitan Museum lo compró en 2007. El conservador Ken Moore ve en él \
el testimonio de una etapa importante de la historia de la música japonesa."""
facture = """
El koto es una larga caja hueca sobre la que se tensan trece cuerdas de seda; cada una reposa \
sobre un puente móvil que se desplaza para afinar el instrumento. El músico, arrodillado, \
pulsa las cuerdas con la mano derecha mediante plectros colocados en tres dedos. Aquí, los \
extremos están cubiertos de incrustaciones geométricas de marfil, carey, oro y plata, y de \
pequeñas esculturas de metal, leones y flores, enmarcadas de marfil. Los trece puentes están \
guarnecidos y rematados de plata."""
details = [
  "Las grullas de oro en círculos, en la tapa del estuche.",
  "La veta ondulada de la madera de la caja del koto.",
  "Los extremos del koto, donde brillan el carey y el metal.",
  "Los trece puentes alineados en primer plano.",
  "Las borlas rojas que orlan la funda de seda azul.",
]
themes = ["Japón", "koto", "laca", "orfebrería", "samurái", "grulla"]
anecdote = """
La tradición ligada a este koto afirma que hicieron falta mil días para terminarlo. La cifra es \
sin duda simbólica, pero la profusión de sus incrustaciones y de sus adornos de metal permite \
imaginar un trabajo de varios años."""
