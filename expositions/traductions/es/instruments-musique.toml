[exposition]
ordre = 67
nom_court = "Instrumentos musicales"
mouvement = "Instrumentos musicales del mundo"
cadre = "vitrine"
couleur = "#7d4320"
titre = "Instrumentos musicales del mundo, el arte de hacer cantar la madera"
artiste = "Todini, Cristofori, Amati, Stradivari, Manol, los Gotō, los griots…"
dates = "hacia 1560–1928"
accroche = "Exposición virtual · Metropolitan Museum of Art, Nueva York"
introduction = """
Un instrumento musical es una herramienta, pero también una escultura, un objeto de prestigio y \
la memoria de una cultura. La visita reúne diez instrumentos de cuerda, del violín del \
Renacimiento al arpa de África central: un clave dorado de la Roma barroca, el piano más \
antiguo que se conserva, dos violines de Cremona, una guitarra de Cádiz, un ūd de Estambul, una \
vina de la India meridional, un koto japonés, una kora y un arpa de África. El edificio se \
inspira en las galerías de instrumentos musicales del Metropolitan Museum de Nueva York: un \
salón de entrada para los teclados, una galería central para los violines y tres salas abiertas \
al resto del mundo."""
vitrine = "clavecin-todini.jpg"

[musee]
nom = "Galerías André Mertens de instrumentos musicales, Metropolitan Museum of Art"
ville = "Nueva York, Estados Unidos"
construction = "Galerías renovadas y reabiertas en 2018 y 2019"
presentation = """
Fundado en 1870 e instalado desde 1880 junto a Central Park, el Metropolitan Museum of Art \
posee una de las grandes colecciones de instrumentos musicales del mundo. Se la debe casi por \
completo a una mujer, Mary Elizabeth Adams Brown, esposa del banquero John Crosby Brown: a \
finales del siglo XIX reúne más de tres mil seiscientos instrumentos procedentes de todos los \
continentes y los dona al museo a partir de 1889. Las galerías que los presentan llevan el \
nombre de André Mertens. Cerradas por una larga renovación, reabrieron por etapas a partir de \
marzo de 2018, y la última sala en 2019. La exposición «The Art of Music» muestra en ellas unos \
ochocientos objetos que abarcan cuatro mil años, ordenados por épocas, para hacer ver los \
intercambios entre las culturas. Se ve allí el piano más antiguo del mundo, violines de \
Stradivari, un muro de setenta y cuatro instrumentos de metal dispuestos alrededor de una \
concha, y grabaciones permiten oír tocar los instrumentos expuestos."""
ici = """
El edificio de ARTEON retoma la idea de una sucesión de salas íntimas, de muros cálidos, donde \
cada instrumento tiene su vitrina. Se entra por el sur en «El salón dorado», de siete metros de \
altura, reservado a los dos teclados italianos. Al norte, la galería «Cremona, la edad de oro \
del violín» distribuye todo lo demás: al oeste «De Cádiz a Estambul», para la guitarra y el \
ūd; al este «De la India al Japón», para la vina y el koto; y al norte, por fin, «África, la \
kora y el arpa»."""

