[exposition]
ordre = 300
nom_court = "Tesoros de la Tierra"
mouvement = "Historia natural: minerales, fósiles y meteoritos"
cadre = "vitrine"
couleur = "#5b4b78"
titre = "Tesoros de la Tierra, minerales, fósiles y meteoritos"
artiste = "Golconda, el Mont Blanc, Solnhofen, Whitby, el mar Báltico, Gibeon…"
dates = "Hace 4500 millones de años – hoy"
accroche = "Exposición virtual · Museo Nacional de Historia Natural, París"
introduction = """
Aquí, el artista es la naturaleza, y cada obra lleva el nombre del lugar que la ha entregado: las minas de Golconda, las fisuras del Mont Blanc, las canteras de Solnhofen, los acantilados de Whitby, las playas del Báltico. La visita reúne diez tesoros, desde un meteorito más antiguo que la Tierra hasta el diamante Hope, desde un trilobites de más de 500 millones de años hasta el arqueópterix, mitad ave, mitad dinosaurio. El edificio se inspira en el Museo Nacional de Historia Natural, en el Jardin des Plantes de París: una alta nave bajo cubierta de cristal, como la de la Gran Galería de la Evolución, se abre al oeste a una galería de mineralogía y al este a la sala de los mares antiguos. Cada objeto se presenta allí en una vitrina profunda, a menudo ampliado para que el ojo capte sus detalles."""
vitrine = "diamant-hope.jpg"

[musee]
nom = "Gran Galería de la Evolución"
ville = "París, Francia (Jardin des Plantes)"
architecte = "Jules André; renovación: Paul Chemetov y Borja Huidobro"
construction = "1877–1889; reabierta en 1994"
presentation = """
El Museo Nacional de Historia Natural nace en 1793 en el antiguo Jardín Real de las plantas medicinales, fundado en el siglo XVII en la margen izquierda del Sena. Para sus colecciones de zoología, el arquitecto Jules André levanta, de 1877 a 1889, una vasta galería: una nave cubierta por una inmensa cristalera, bordeada de balcones superpuestos sostenidos por columnas de fundición. Cerrada en 1965 por falta de mantenimiento, es renovada por Paul Chemetov y Borja Huidobro y reabre en 1994 con el nombre de Gran Galería de la Evolución. En la nave, una caravana de animales naturalizados de la sabana africana desfila bajo una luz que varía como la del cielo. El jardín cuenta con otras galerías: la de Mineralogía y Geología, construida durante la monarquía de Julio por Charles Rohault de Fleury, que expone meteoritos, gemas y cristales gigantes, y la de Paleontología y Anatomía Comparada, abierta en 1898, donde se alza todavía el diplodocus donado por Andrew Carnegie en 1908."""
ici = """
El edificio de ARTEON reúne en una sola construcción las galerías del Jardin des Plantes. Se entra por el sur en el vestíbulo, color piedra, donde aguarda un meteorito. Se abre al norte a la gran nave, de 24 metros de largo y 14 de alto, como la nave bajo cristalera de la Gran Galería de la Evolución. Al oeste, una puerta conduce a la galería de Mineralogía, más baja, de muros gris perla, donde brillan las gemas y los cristales. Al este, la sala de los mares antiguos, de un verde agua pálido, reúne trilobites, amonites y nautilo. Se regresa por último a la nave, donde aguardan el diplodocus, el arqueópterix y el ámbar."""

