[[oeuvres]]
titre = "Escarabajo atrapado en ámbar del Báltico"
artiste = "Forêts d'ambre de la Baltique"
annee = "Eoceno, hace unos 45 millones de años"
image = "ambre-coleoptere.jpg"
credit = "Photo : James St. John"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Beetle_in_amber_(Amber_Formation,_Middle_Eocene;_Yantarnyi,_Samland_Peninsula_along_the_Baltic_Sea,_far-western_Russia)_(15111983330).jpg"
technique = "Ámbar (resina fósil) que contiene un escarabajo de unos 3,5 mm; vista al microscopio"
collection = "Colección no especificada (fotografía de James St. John)"
note = "Un escarabajo de 3,5 mm pegado a una colada de resina hace unos 45 millones de años, visto aquí al microscopio: el ámbar lo ha conservado con sus más mínimos relieves."
description = """
La imagen es una ampliación muy grande. En una materia translúcida de un amarillo dorado, que vira al naranja y al pardo en los bordes, un pequeño insecto alargado ocupa el centro. Es un escarabajo, visto de espaldas, con la cabeza arriba: su cuerpo pardo oscuro está cubierto de filas regulares de minúsculos puntos hundidos, alineados como las mallas de un tejido de punto. Se adivinan la cabeza, el corselete y los dos élitros, las alas duras que protegen el dorso. A su alrededor, la resina no es uniforme: zonas más claras, casi luminosas, alternan con velos más oscuros. Arriba a la derecha, una mancha roja marca la curva del borde de la piedra."""
evocation = """
El ámbar es una cápsula del tiempo. El insecto se posó en una colada de resina, quedó pegado a ella, y la resina lo cubrió: 45 millones de años después, sigue ahí, intacto, como si acabara de morir. Nada evoca mejor la inmovilidad del tiempo geológico. Estas inclusiones hicieron soñar mucho antes que la ciencia: se veían en ellas moscas y hormigas sepultadas en oro, y los poetas latinos ya se maravillaban. Siguen haciendo soñar desde que una novela y luego una película imaginaron hacer renacer dinosaurios a partir de un mosquito conservado en ámbar, idea que el estado real del ADN fósil hace imposible."""
histoire = """
Hace unos 45 millones de años, en el Eoceno, vastos bosques de coníferas cubrían el norte de Europa, bajo un clima más cálido que el actual. Su resina, arrastrada por los ríos, se acumuló en una capa de arena arcillosa que los mineros llaman la «tierra azul». El mayor yacimiento se encuentra en la península de Sambia, cerca de Kaliningrado, en Rusia, donde la mina a cielo abierto de Yantarny suministra lo esencial del ámbar mundial. Este escarabajo procede de allí. Desde la prehistoria, el mar arranca también trozos de ámbar de las capas submarinas y los arroja a las playas después de las tormentas: ya se recogía para hacerlo viajar, por la ruta del ámbar, hasta el Mediterráneo."""
facture = """
Fresca, la resina es pegajosa y viscosa. Enterrada, pierde poco a poco sus elementos volátiles, sus moléculas se unen en largas cadenas y se endurece en copal y luego, con millones de años, en ámbar. El insecto engullido se deseca en ese estuche sin aire, y la resina moldea cada relieve, hasta los pelos y las puntuaciones del caparazón. El ámbar es ligero: flota en el agua muy salada, propiedad que se utiliza para distinguirlo de sus imitaciones. La fotografía, tomada a través de un microscopio, muestra el insecto mucho más grande que una letra de este texto."""
details = [
  "Las filas de pequeños puntos hundidos en los élitros del escarabajo.",
  "La cabeza y el corselete, en la parte alta del cuerpo.",
  "Las zonas claras y oscuras de la resina en torno al insecto.",
  "La curva rojiza del borde de la piedra, arriba a la derecha.",
]
themes = ["ámbar", "insecto", "bosque", "eoceno", "tiempo"]
anecdote = """
Los griegos llamaban al ámbar élektron. Habían observado que, una vez frotado, atrae briznas y polvo: de esa palabra procede, mucho más tarde, la palabra electricidad."""
