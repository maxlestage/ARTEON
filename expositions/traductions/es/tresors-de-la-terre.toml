[[oeuvres]]
titre = "El arqueópterix de Berlín"
artiste = "Gisement de Solnhofen, Allemagne"
annee = "Jurásico superior, hace unos 150 millones de años; descubierto hacia 1876"
image = "archeopteryx-berlin.jpg"
credit = "Photo : H. Raab"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Archaeopteryx_lithographica_(Berlin_specimen).jpg"
technique = "Esqueleto e improntas de plumas en una placa de caliza litográfica"
collection = "Museum für Naturkunde, Berlín"
note = "Plumas y alas de ave, pero dientes, dedos con garras y una larga cola ósea de reptil: el espécimen de Berlín, el más completo de los arqueópterix, es uno de los fósiles más célebres del mundo."
description = """
Sobre una placa de caliza beige, hendida por largas fisuras, un animal del tamaño de una paloma yace con las alas extendidas. Se distinguen con nitidez los huesos, finos y claros, y alrededor la impronta de las plumas, que irradian en abanico de cada brazo. La cabeza, pequeña, está echada hacia atrás, a la izquierda, con el cuello curvado sobre el lomo; se adivinan los dientes en el hocico. Las dos patas, plegadas, descienden hacia la parte baja de la placa y terminan en pies de dedos con garras. Entre ellas, una larga cola hecha de vértebras se dirige hacia abajo a la izquierda, bordeada a cada lado por una hilera de plumas que dibuja una cola de arrastre."""
evocation = """
El arqueópterix se ha convertido en el símbolo de la evolución. El primer esqueleto se descubre en 1861, apenas dos años después de la publicación de El origen de las especies de Charles Darwin, y ofrece lo que reclamaban sus adversarios: una forma intermedia entre dos grandes grupos. Hoy se sabe que no es el antepasado directo de las aves, sino uno de los representantes de una familia de pequeños dinosaurios con plumas de los que descienden las aves. La postura del espécimen de Berlín, con la cabeza echada hacia atrás y el cuello arqueado, es la de numerosos fósiles de animales muertos en el agua: confiere a esta placa una intensidad dramática, como un instante congelado."""
histoire = """
El espécimen de Berlín sale a la luz hacia 1876 cerca de Eichstätt, en Baviera, en una cantera de caliza. Pasa por varias manos y luego la familia Häberlein, que ya había vendido el primer esqueleto al British Museum, lo pone a la venta. Para que no abandone Alemania, el industrial Werner von Siemens lo compra en 1880; el museo de historia natural de la universidad de Berlín se lo recompra al año siguiente. Es el primer arqueópterix descubierto con la cabeza completa. Se expone hoy en una sala del Museum für Naturkunde de Berlín. La fotografía muestra el original, y no uno de los numerosos moldes que circulan de él."""
facture = """
La caliza de Solnhofen es de un grano extraordinariamente fino: se formó a partir de un lodo calcáreo depositado en el fondo de lagunas de aguas estancadas, tan saladas y pobres en oxígeno que los carroñeros no vivían en ellas. Los cadáveres caídos al fondo quedaban cubiertos sin ser despedazados, y el lodo pudo conservar la huella de cada pluma, hasta las barbas. El fósil fue liberado de la piedra con aguja, grano a grano. Se distinguen aquí dos clases de plumas: las grandes plumas asimétricas de las alas, semejantes a las de las aves voladoras, y las de la cola, dispuestas por pares."""
details = [
  "Las plumas de las alas, cuya impronta irradia en abanico en torno a los brazos.",
  "La cabeza echada hacia atrás, al final del cuello curvado.",
  "Las garras en la punta de los dedos de los pies, en la parte baja de la placa.",
  "La larga cola ósea, bordeada por una pluma a cada lado de cada vértebra.",
]
themes = ["fósil", "dinosaurio", "ave", "evolución", "jurásico"]
anecdote = """
Según un relato muy repetido, el campesino que descubrió el espécimen de Berlín, Jakob Niemeyer, lo habría cedido para poder comprar una vaca. Pocos años después, el fósil se vendía por 20 000 marcos."""
