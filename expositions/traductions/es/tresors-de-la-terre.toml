[[oeuvres]]
titre = "Amonite Dactylioceras commune"
artiste = "Falaises de Whitby, Angleterre"
annee = "Jurásico inferior, hace unos 180 millones de años"
image = "ammonite-whitby.jpg"
credit = "Photo : Fred Cherrygarden"
licence = "CC BY-SA 4.0"
source = "https://commons.wikimedia.org/wiki/File:Dactylioceras_commune.jpg"
technique = "Concha fosilizada en una roca arcillosa; 7 cm de diámetro"
collection = "Colección particular (colección Cherrygarden)"
note = "Un amonite de 7 cm, mostrado aquí ampliado, hallado en Whitby, en la costa de Yorkshire. Estas conchas enrolladas eran para los habitantes serpientes convertidas en piedra."
description = """
Una concha enrollada en espiral plana, de un gris antracita, se destaca sobre un fondo blanco. Se cuentan varias vueltas, cada vez más anchas del centro hacia el exterior, encajadas unas en otras como una cuerda enrollada. Cada vuelta está adornada con costillas finas y apretadas, regulares como los dientes de un peine, que irradian del centro hacia el borde; cerca del exterior se desdoblan. El centro de la espiral, minúsculo, forma una pequeña concavidad. A la derecha, la concha desaparece en parte en la roca que aún la envuelve, una ganga gris y lisa; abajo, la última vuelta, más gastada, deja ver el relieve de las costillas visto de perfil."""
evocation = """
El amonite es una de las formas más familiares de la paleontología, y una de las más misteriosas para quienes lo hallaban sin comprenderlo. Su espiral evocó una serpiente enroscada, un cuerno de carnero, una rueda. Para los geólogos es también un reloj: las especies de amonites se sucedieron tan deprisa y estuvieron tan extendidas que permiten datar las rocas con un margen de menos de un millón de años. Su desaparición, hace 66 millones de años, al mismo tiempo que la de los grandes dinosaurios, recuerda por último la fragilidad de los grupos más prósperos: los amonites habían poblado los mares durante más de trescientos millones de años."""
histoire = """
Los acantilados de Whitby, en la costa de North Yorkshire, proporcionan amonites desde hace siglos: las tormentas y los desprendimientos los sueltan de la roca, y se recogen en la playa. Una leyenda los vincula a santa Hilda, la abadesa que fundó en el siglo VII la abadía de Whitby: habría convertido en piedra las serpientes que infestaban el lugar. Los comerciantes esculpían a veces una cabeza de serpiente en el extremo de la espiral para vender estas «piedras de serpiente» a los visitantes, y tres amonites figuran en el escudo de la ciudad. Este espécimen, hallado en Whitby, pertenece a una colección privada y fue fotografiado por su propietario."""
facture = """
El amonite era un molusco cefalópodo, primo de los pulpos, las sepias y el nautilo. Su concha estaba dividida en cámaras por tabiques; el animal vivía en la última, la más grande, y regulaba su flotación llenando las demás de gas o de líquido. El nombre Dactylioceras significa aproximadamente «cuerno en anillos»: alude a las costillas apretadas que rodean cada vuelta. En Whitby, los amonites se conservan a menudo en nódulos, bolas de roca más dura formadas a su alrededor en el lodo del fondo marino, que los protegieron del aplastamiento."""
details = [
  "Las costillas apretadas que irradian en cada vuelta de la espira.",
  "El desdoblamiento de las costillas cerca del borde exterior.",
  "La minúscula concavidad del centro, donde el animal comenzó su concha.",
  "La ganga de roca gris, aún adherida a la derecha.",
]
themes = ["fósil", "jurásico", "mar", "espiral", "leyenda"]
anecdote = """
La palabra amonite procede del dios egipcio Amón, representado con cuernos de carnero. El escritor romano Plinio el Viejo llamaba a estos fósiles «cuernos de Amón», por su parecido con un cuerno enrollado."""
