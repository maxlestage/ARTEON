[[oeuvres]]
titre = "El Diplodocus de Carnegie, montado en el Museo en 1908"
artiste = "Formation de Morrison, Wyoming"
annee = "Jurásico superior, hace unos 150 millones de años; molde y fotografía de 1908"
image = "diplodocus-paris.jpg"
cadre = "noir"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Carnegie_Diplodocus,_Paris_LCCN2014681898_(cropped).jpg"
technique = "Fotografía (negativo en vidrio) de la agencia Bain News Service; molde de yeso de un esqueleto de unos 25 m de largo"
collection = "Library of Congress, Washington (fotografía); galería de Paleontología y Anatomía Comparada, Museo Nacional de Historia Natural, París (molde)"
note = "En 1908, el multimillonario estadounidense Andrew Carnegie regala a Francia el molde de su diplodocus. Se le ve aquí durante el montaje en la galería de Paleontología del Museo, donde sigue estando."
description = """
La fotografía está tomada desde arriba, desde el balcón de una galería de museo. En el centro, el esqueleto de un dinosaurio gigante está siendo ensamblado sobre una tarima de madera. Se reconoce la enorme pelvis y las patas traseras, rectas como columnas, y luego la caja torácica, a la derecha, cuyas costillas descienden como las cuadernas del casco de un navío. La larga cola desciende en curva hacia abajo a la izquierda hasta el suelo. Alrededor, obreros con bata y caballeros de traje observan o trabajan; un hombre está encaramado en lo más alto, cerca del lomo. Escaleras, vitrinas llenas de fósiles y altas ventanas completan la escena. Arriba, una inscripción blanca indica: Carnegie Diplodocus, Paris."""
evocation = """
Esta imagen cuenta el nacimiento de una pasión: la del público por los dinosaurios. A comienzos del siglo XX, estos gigantes llegados de América atraen a las multitudes en los museos de Europa. Habla también de la época de los grandes mecenas: al regalar moldes de su diplodocus a los soberanos y a los jefes de Estado, Andrew Carnegie, rey del acero convertido en filántropo y militante de la paz, hacía de la ciencia un instrumento de diplomacia. Los obreros, diminutos al pie del esqueleto, dan la escala del monstruo. Y el propio lugar habla: es la galería que los visitantes del Jardin des Plantes recorren todavía hoy, con el mismo diplodocus en el centro."""
histoire = """
En julio de 1899, un equipo del Carnegie Museum de Pittsburgh descubre un esqueleto de saurópodo en Sheep Creek, en Wyoming. El paleontólogo John Bell Hatcher lo describe en 1901 con el nombre de Diplodocus carnegii, en honor de su mecenas. El rey Eduardo VII, que ha visto un dibujo en casa de Carnegie, desea uno para Londres: un molde completo se inaugura en 1905 en el museo de historia natural de Londres. Siguen otros, en Berlín, París, Viena, Bolonia, San Petersburgo, La Plata, Madrid o Ciudad de México. El molde parisino es montado en 1908 por un equipo llegado de Pittsburgh, bajo la dirección del director del Carnegie Museum, William Jacob Holland. Sigue erguido en la galería de Paleontología, abierta en 1898."""
facture = """
Cada hueso fue moldeado y luego reproducido en yeso reforzado, antes de ser ensamblado sobre una armadura de hierro que sostiene el conjunto. La pose es la que entonces se imaginaba: patas rectas bajo el cuerpo, cola arrastrando hasta el suelo. Los paleontólogos piensan hoy que la cola se mantenía horizontal, por encima del suelo, para equilibrar el largo cuello. La fotografía, tomada sobre una placa de vidrio por la agencia neoyorquina Bain News Service, forma parte de un inmenso fondo conservado en la Biblioteca del Congreso; su leyenda fue inscrita directamente sobre el negativo. Se presenta aquí en un marco negro."""
details = [
  "Las patas traseras, rectas como columnas, sobre la tarima de madera.",
  "Las espinas de las vértebras, erguidas a lo largo del lomo.",
  "La cola que desciende hasta el suelo, abajo a la izquierda.",
  "El hombre encaramado en lo más alto del esqueleto, cerca del lomo.",
  "La inscripción blanca, arriba, trazada sobre el negativo.",
]
themes = ["dinosaurio", "jurásico", "museo", "fotografía", "mecenazgo"]
anecdote = """
El molde de Londres, apodado Dippy, recibió a los visitantes del museo de historia natural durante más de un siglo. En 2017 cedió su lugar en el gran vestíbulo al esqueleto de una ballena azul, y salió después de gira por el Reino Unido."""
