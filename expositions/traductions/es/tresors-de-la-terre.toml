[[oeuvres]]
titre = "Trilobites Elrathia kingii"
artiste = "Schistes de Wheeler, Utah"
annee = "Cámbrico medio, hace algo más de 500 millones de años"
image = "trilobite-elrathia.jpg"
credit = "Photo : James St. John"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Elrathia_kingii_(fossil_trilobite)_(Wheeler_Formation,_Middle_Cambrian;_House_Range,_western_Utah,_USA)_3.jpg"
technique = "Caparazón fosilizado (calcita) en una pizarra arcillosa; unos 2,6 cm de ancho"
collection = "Colección no especificada (fotografía de James St. John)"
note = "De apenas 2,6 cm de ancho, mostrado aquí muy ampliado, este trilobites vivía en el fondo de un mar del Cámbrico, hace más de 500 millones de años. Es uno de los fósiles más extendidos del mundo."
description = """
Sobre la piedra gris, un pequeño animal ovalado, de un negro brillante, parece aún posado en el fondo del mar. Su cuerpo se divide en tres bandas a lo largo: un eje central abombado y dos lóbulos laterales más planos, de ahí el nombre de trilobites, «de tres lóbulos». Arriba, la cabeza forma una ancha media luna; en su centro se alza un abultamiento alargado, la glabela. El cuerpo está hecho de una docena de anillos articulados, apretados como las láminas de una armadura, que terminan a cada lado en una punta redondeada. Abajo, una pequeña cola en forma de escudo cierra el conjunto. El caparazón, negro, se destaca con nitidez sobre la roca más clara, ligeramente agrietada."""
evocation = """
El trilobites es uno de los primeros grandes éxitos de la vida animal. Aparece en el Cámbrico, cuando los océanos se pueblan de una súbita diversidad de formas, y fue uno de los primeros animales en poseer verdaderos ojos. Los trilobites vivieron cerca de 270 millones de años antes de desaparecer en la gran extinción del final del Pérmico. Este no tiene nada de excepcional: ni espinas ni ojos gigantes. Los paleontólogos estadounidenses lo apodan con cariño «Joe Trilobite», el trilobites corriente. Eso es precisamente lo que lo hace conmovedor: permite ver la vida cotidiana de un fondo marino, más de doscientos millones de años antes de los primeros dinosaurios."""
histoire = """
Elrathia kingii fue descrito en 1870 por el paleontólogo estadounidense Fielding Meek, que le dio el nombre de Clarence King, el geólogo que dirigía entonces el estudio del paralelo 40 a través del Oeste estadounidense. Procede de las pizarras de Wheeler, en las montañas de la House Range, al oeste de Utah. Las canteras de la región han proporcionado cantidades considerables: los explotadores parten la roca en placas y extraen miles de especímenes cada año. Por eso Elrathia es el trilobites que se encuentra con más frecuencia en las tiendas de fósiles y en las colecciones de aficionados de todo el mundo. Este espécimen fue fotografiado por el geólogo James St. John."""
facture = """
Como los insectos y los cangrejos, los trilobites eran artrópodos: su cuerpo estaba protegido por un caparazón articulado, reforzado con calcita, que debían abandonar para crecer. Muchos fósiles son, de hecho, mudas, y no animales muertos. Solo se ha conservado ese caparazón mineralizado; las patas, las antenas y las branquias han desaparecido. En las pizarras de Wheeler, un lodo fino depositado en un agua tranquila y pobre en oxígeno cubrió los caparazones sin dispersarlos. La roca se parte según sus capas y revela el fósil intacto, a menudo de un negro que contrasta con el gris de la pizarra."""
details = [
  "Los tres lóbulos a lo largo del cuerpo, que dieron su nombre al grupo.",
  "La glabela, el abultamiento alargado en medio de la cabeza.",
  "Los anillos articulados del tórax, terminados en puntas redondeadas.",
  "La pequeña cola en escudo, en la parte baja del fósil.",
]
themes = ["fósil", "cámbrico", "mar", "trilobites", "artrópodo"]
anecdote = """
Según testimonios recogidos en el siglo XX, los utes de Utah llevaban trilobites como amuleto, para protegerse de la enfermedad. El nombre que les daban evocaba pequeños insectos de agua alojados en una casa de piedra."""
