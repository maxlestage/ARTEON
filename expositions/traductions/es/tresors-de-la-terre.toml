[[artistes]]
nom = "Gibeon, Namibie"
vie = "Sur de Namibia, en torno a la ciudad de Gibeon; caída prehistórica"
biographie = """
El campo de meteoritos de Gibeon se extiende por el sur de Namibia, en la región de Hardap, en el corazón del Gran Namaqualand, un país de áridas mesetas. La caída tuvo lugar mucho antes de la historia escrita: un gran bloque de hierro, al entrar en la atmósfera, se rompió en una lluvia de fragmentos esparcidos a lo largo de cientos de kilómetros. Los nama, ganaderos de la región, conocían estas piedras pesadas y extraían de ellas metal para sus herramientas y sus armas. En el siglo XIX, muestras traídas a Europa son reconocidas como hierro meteorítico, y la región se convierte en uno de los lugares más ricos del mundo en meteoritos metálicos. Se han recogido cientos de masas, algunas de varios cientos de kilos. El cuerpo de origen era el núcleo metálico de un pequeño asteroide, formado en los primeros millones de años del sistema solar y luego puesto al descubierto y fragmentado por colisiones. Para frenar el saqueo, Namibia ha hecho de los meteoritos de Gibeon un patrimonio protegido; una treintena de grandes masas se exponen en Windhoek, la capital."""
style = """
El hierro de Gibeon es una octaedrita fina del grupo IVA, una aleación de hierro y níquel con alrededor de un 8 % de níquel. Una vez aserrado, pulido y atacado con ácido, revela figuras de Widmanstätten muy apretadas, de láminas estrechas y regulares, de gran elegancia. Es relativamente estable y se presta al pulido: joyeros, relojeros y cuchilleros lo utilizan para esferas, anillos o hojas, lo que lo ha convertido en uno de los meteoritos más extendidos en el mercado."""

[[artistes]]
nom = "Mines de Golconde, Inde"
vie = "Valle del Krishna, Decán (India meridional); diamantes explotados desde la Antigüedad hasta el siglo XIX"
biographie = """
Durante siglos, la India fue la única fuente de diamantes conocida en el mundo. Las piedras se extraían de los aluviones del valle del Krishna, en el Decán, donde miles de mineros excavaban y lavaban las gravas. Se tallaban y vendían en Golconda, una fortaleza y ciudad mercantil cercana a la actual Hyderabad, capital del sultanato de los Qutb Shahi de 1518 hasta su conquista por el emperador mogol Aurangzeb en 1687. El nombre de Golconda acabó designando todas las minas de la región y convirtiéndose en sinónimo de riqueza fabulosa. En el siglo XVII, el comerciante francés Jean-Baptiste Tavernier hace allí varios viajes y describe las minas, entre ellas la de Kollur, en el Krishna, de donde procedería el gran diamante azul vendido a Luis XIV. Los más célebres diamantes históricos nacieron allí: el Koh-i-Noor, hoy en las joyas de la corona británica, el Regente, expuesto en el Louvre, y el diamante Hope. El descubrimiento de yacimientos en Brasil, en el siglo XVIII, y luego en Sudáfrica, en el XIX, pone fin a la supremacía india."""
style = """
Los diamantes de Golconda son famosos por su excepcional limpidez: muchos pertenecen al tipo IIa, casi desprovistos de nitrógeno, de una transparencia que los joyeros comparan a la del agua. Algunos son de color, como el azul del Hope. Tallados primero en la India según formas que conservaban la mayor cantidad de materia, a menudo se volvieron a tallar en Europa. La expresión «diamante de Golconda» designa todavía hoy, en las subastas, una piedra antigua de rara pureza."""

[[artistes]]
nom = "Massif du Mont-Blanc, France"
vie = "Alpes occidentales, entre Francia, Italia y Suiza; granito de unos 300 millones de años, fisuras nacidas del levantamiento de los Alpes"
biographie = """
El macizo del Mont Blanc, que culmina a más de 4800 metros, está hecho en lo esencial de un granito muy antiguo, nacido hace unos 300 millones de años en las profundidades de una cadena montañosa hoy desaparecida. Durante la formación de los Alpes, este granito fue retomado, levantado y fracturado. Por las fisuras abiertas por estos movimientos circularon aguas calientes, cargadas de elementos disueltos, que tapizaron las cavidades de cristales: cuarzos límpidos o ahumados, fluoritas rosas, adularias. Los habitantes del valle de Chamonix los buscan desde hace siglos. Estos cristaleros, que recorrían los glaciares mucho antes que los alpinistas, son de los primeros en conocer la alta montaña; el sabio ginebrino Horace-Bénédict de Saussure, que alcanza la cima del Mont Blanc en 1787, habla de ellos en sus relatos de viaje. El oficio se perpetúa hoy, regulado por normas locales, y las piezas más hermosas ingresan en los museos: la galería de Mineralogía del Museo, en París, presenta varias."""
style = """
Los cristales del Mont Blanc son cristales de fisura: crecieron libremente en el vacío de una cavidad, lo que les da formas nítidas y caras brillantes. El macizo es célebre por sus cuarzos ahumados, a veces casi negros, y sobre todo por sus fluoritas rosas en octaedros, entre las más hermosas del mundo. Su asociación, el rosa sobre el pardo, es la firma de los grandes hallazgos de los cristaleros."""

[[artistes]]
nom = "Coulées de lave de la Serra Geral, Brésil"
vie = "Cuenca del Paraná (sur de Brasil, Uruguay, Paraguay, Argentina); comienzos del Cretácico, hace unos 130 millones de años"
biographie = """
Hace unos 130 millones de años, el supercontinente de Gondwana comienza a desgarrarse: América del Sur y África se alejan, y el océano Atlántico Sur se abre poco a poco entre ellas. Este desgarro se acompaña de erupciones de una magnitud inaudita. Por largas fisuras, inmensos volúmenes de lava basáltica se extienden en coladas sucesivas sobre el sur de América del Sur, y sobre la región que será Namibia, al otro lado del futuro océano. Apiladas, estas coladas forman hoy la Serra Geral, mesetas de roca oscura de más de un kilómetro de espesor en algunos lugares; las cataratas del Iguazú, en la frontera de Brasil y Argentina, se precipitan desde lo alto de estos basaltos. En algunas coladas, la lava estaba repleta de burbujas de gas. Mucho más tarde, aguas subterráneas ricas en sílice rellenaron estas cavidades de calcedonia, ágata y cuarzo. Rio Grande do Sul, en Brasil, y la región de Artigas, en Uruguay, se han convertido en los primeros productores mundiales de geodas de amatista."""
style = """
Las geodas de la Serra Geral se reconocen por su cáscara de basalto gris verdoso, su ribete de calcedonia y sus cristales de amatista apretados, de un violeta a menudo profundo. Algunas, alargadas como grutas, superan la talla de un hombre. De ellas se extraen también las ágatas bandeadas de Brasil, a menudo teñidas, y cristales de calcita que se posan sobre la amatista."""

[[artistes]]
nom = "Schistes de Wheeler, Utah"
vie = "House Range, oeste de Utah (Estados Unidos); Cámbrico medio, hace algo más de 500 millones de años"
biographie = """
Hace algo más de 500 millones de años, el oeste de la actual América del Norte estaba bordeado por un mar tropical, cercano al ecuador. Al pie de una plataforma calcárea, en una depresión donde el agua era tranquila y pobre en oxígeno, un lodo fino se acumulaba lentamente. Cubrió a los animales que vivían o morían en el fondo, y se convirtió en una roca laminada, las pizarras de Wheeler, que afloran hoy en las montañas de la House Range, al oeste de Utah, en un paisaje de desierto. Es la época de la «explosión cámbrica», en la que aparecen en poco tiempo la mayoría de los grandes grupos de animales. Los trilobites dominan estos fondos marinos, pero las pizarras de Wheeler han proporcionado también esponjas, medusas y animales de cuerpo blando, conservados como en las célebres pizarras de Burgess, en Canadá. Explotadas por canteras comerciales, suministran por sí solas gran parte de los trilobites vendidos en el mundo, y siguen interesando a los investigadores."""
style = """
Los fósiles de las pizarras de Wheeler se reconocen por su caparazón negro y brillante, de calcita, que contrasta con una pizarra gris claro y se desprende con facilidad al partir la roca. Los trilobites son allí numerosos, completos y bien articulados, a menudo de especies de pequeño tamaño, como Elrathia kingii. Su abundancia los convierte en una puerta de entrada ideal a la paleontología."""

[[artistes]]
nom = "Falaises de Whitby, Angleterre"
vie = "Costa de North Yorkshire; Jurásico inferior, hace unos 180 millones de años"
biographie = """
Los acantilados de Whitby, en la costa del mar del Norte, están hechos de rocas oscuras depositadas hace unos 180 millones de años, en el Jurásico inferior, en el fondo de un mar poco oxigenado. Rebosan de fósiles: amonites, belemnites, peces y grandes reptiles marinos como los ictiosaurios y los plesiosaurios. Su historia humana está ligada a estas piedras. En el siglo VII, santa Hilda funda en el acantilado una abadía cuyas ruinas dominan todavía la ciudad. Del siglo XVII al XIX se explotan las pizarras para extraer alumbre, utilizado para fijar los tintes, y los canteros sacan a la luz numerosos esqueletos. Whitby es también célebre por su azabache, una madera fósil negra y brillante; tras la muerte del príncipe Alberto en 1861, la reina Victoria lanza su moda para las joyas de luto. Por último, en esta costa hace Bram Stoker desembarcar al vampiro en su novela Drácula, aparecida en 1897. Los desprendimientos renuevan sin cesar los fósiles, que los paseantes recogen en las playas."""
style = """
Los fósiles de Whitby se distinguen por su conservación en nódulos, bolas de roca dura, y por su tono oscuro, a veces dorado por la pirita. Los amonites son allí tan numerosos que los geólogos han podido dividir el tiempo en zonas que llevan sus nombres. Dactylioceras, de costillas finas y apretadas, es la especie más típica, la de las «piedras de serpiente» de la leyenda."""

[[artistes]]
nom = "Récifs de l'Indo-Pacifique"
vie = "Pendientes de los arrecifes de coral, de Filipinas a las islas Fiyi y Australia; en la actualidad"
biographie = """
El nautilo cameral vive en las aguas tropicales del Indo-Pacífico, desde Filipinas e Indonesia hasta Nueva Guinea, el norte de Australia y las islas Fiyi. Frecuenta las pendientes abruptas que bordean los arrecifes de coral, a profundidades de a menudo varios cientos de metros, y sube de noche hacia aguas menos profundas para cazar o alimentarse de carroña. Lleva alrededor de la boca decenas de tentáculos sin ventosas y ve el mundo a través de unos ojos muy simples, sin cristalino, que funcionan como una cámara oscura. Su linaje, el de los nautiloideos, se remonta a casi 500 millones de años: sus conchas, rectas o enrolladas, poblaban ya los mares de la época de los trilobites, y sobrevivieron a las grandes extinciones que se llevaron a los amonites. El nautilo crece lentamente, vive una veintena de años y pone pocos huevos. La pesca intensiva de sus conchas ha hecho retroceder sus poblaciones: desde 2017, su comercio internacional está sometido a permisos."""
style = """
Vista desde fuera, la concha del nautilo es blanca, rayada de llamas pardo rojizas que se difuminan hacia la abertura. En corte, revela su belleza oculta: una espiral de cámaras regulares, de un pardo dorado, y una gran cámara tapizada de nácar irisado. Los orfebres del Renacimiento la pulían para hacer aparecer el nácar y la montaban en copa preciosa."""

[[artistes]]
nom = "Gisement de Solnhofen, Allemagne"
vie = "Valle del Altmühl, Baviera; Jurásico superior, hace unos 150 millones de años"
biographie = """
Hace unos 150 millones de años, Baviera estaba cubierta por un mar cálido salpicado de islas y arrecifes, en el borde del océano Tetis. Entre los arrecifes se extendían lagunas de aguas estancadas, muy saladas y sin oxígeno en el fondo. Un lodo calcáreo muy fino se depositaba allí en capas delgadas, que dieron la caliza de Solnhofen, explotada hoy en las canteras del valle del Altmühl, en torno a Solnhofen y Eichstätt. Desde la época romana se extraen de ella losas para suelos y tejados. En 1796, Alois Senefelder descubre que se puede imprimir a partir de estas piedras perfectamente lisas: es la invención de la litografía, que hará la fortuna de las canteras. Los obreros que parten las placas sacan a la luz fósiles de una finura inigualada: peces, cangrejos, límulos, libélulas, pterosaurios, el pequeño dinosaurio Compsognathus y sobre todo el arqueópterix. Una pluma aislada es descrita en 1861, y el primer esqueleto se descubre el mismo año; hoy se conocen una docena."""
style = """
Los fósiles de Solnhofen parecen grabados: aplastados entre dos láminas de caliza beige, conservan los contornos más delicados, alas de insectos, membranas de pterosaurios, plumas. Se encuentran incluso huellas de pisadas, y el rastro de un límulo que termina en el cuerpo del animal muerto. Este yacimiento es uno de los grandes modelos de lo que los paleontólogos llaman una conservación excepcional."""

[[artistes]]
nom = "Forêts d'ambre de la Baltique"
vie = "Norte de Europa, en el Eoceno, hace unos 45 millones de años; yacimientos de la península de Sambia (Kaliningrado, Rusia)"
biographie = """
Hace unos 45 millones de años, en el Eoceno, el clima de la Tierra era mucho más cálido que el actual, y grandes bosques de coníferas y de frondosas cubrían el norte de Europa, en las tierras de la actual Escandinavia. Sus árboles producían resina en abundancia. Arrastrada por los ríos, se acumuló en los sedimentos de un delta, donde se transformó lentamente en ámbar. Estos depósitos afloran hoy en torno al mar Báltico, sobre todo en la península de Sambia, cerca de Kaliningrado, donde la mina de Yantarny explota la capa de «tierra azul». El mar arranca también trozos que arroja a las playas después de las tormentas. Desde la prehistoria, el ámbar báltico es buscado e intercambiado: viajaba hasta el Mediterráneo por la ruta del ámbar, y los romanos lo apreciaban. En la Edad Media, los caballeros teutónicos controlan su recolección. En el siglo XVIII, la Cámara de Ámbar, regalada por el rey de Prusia al zar Pedro el Grande, es una de las decoraciones más famosas de Europa; desaparece durante la Segunda Guerra Mundial."""
style = """
El ámbar del Báltico, llamado succinita, va del amarillo miel al pardo rojizo, transparente o lechoso. Es célebre por la riqueza de sus inclusiones: insectos, arañas, flores, plumas, pelos de mamíferos, conservados en tres dimensiones con una precisión que ningún otro fósil alcanza. Los científicos han descrito en él miles de especies desaparecidas, que hacen revivir el bosque del Eoceno."""

[[artistes]]
nom = "Formation de Morrison, Wyoming"
vie = "Oeste de Estados Unidos, de Montana a Nuevo México; Jurásico superior, hace unos 155 a 148 millones de años"
biographie = """
La formación Morrison es un conjunto de capas de areniscas, arcillas y calizas que aflora en el oeste de Estados Unidos, de Montana a Nuevo México. Lleva el nombre de la pequeña ciudad de Morrison, en Colorado, cerca de la cual se descubren huesos de dinosaurios en 1877. Hace unos 150 millones de años era una vasta llanura atravesada por ríos, de clima cálido y seco, salpicada de lagos y de bosques de coníferas y helechos. Es el yacimiento de dinosaurios más célebre de América: ha proporcionado Diplodocus, Apatosaurus, Brontosaurus, Camarasaurus, Stegosaurus y Allosaurus. A finales del siglo XIX es escenario de la «guerra de los huesos» entre los paleontólogos rivales Othniel Marsh y Edward Drinker Cope, que se disputan las mejores canteras, en particular en Wyoming. En 1909, un investigador del Carnegie Museum, Earl Douglass, descubre en Utah un muro entero de osamentas, hoy protegido en el Dinosaur National Monument."""
style = """
La formación Morrison es el reino de los saurópodos, esos gigantes de largo cuello y larga cola, y de sus depredadores. Sus huesos, a menudo bien conservados y a veces hallados en esqueletos casi completos, han permitido los primeros grandes montajes de dinosaurios en los museos. Diplodocus, Stegosaurus o Allosaurus, todos procedentes de estas capas, han fijado para el gran público la imagen misma del dinosaurio."""
