[[oeuvres]]
titre = "Concha de nautilo, en corte"
artiste = "Récifs de l'Indo-Pacifique"
annee = "Especie actual, de un linaje de casi 500 millones de años"
image = "nautile.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Nautilus_pompilius_(YPM_IZ_047418).jpeg"
technique = "Concha de Nautilus pompilius aserrada en dos (aragonito y nácar); unos 18 cm"
collection = "Yale Peabody Museum, New Haven (Connecticut)"
note = "Una concha de nautilo aserrada en dos, de unos 18 cm de largo: sus cámaras sucesivas dibujan una espiral perfecta, y la gran cámara donde vivía el animal brilla de nácar."
description = """
La concha, cortada en dos a lo largo, se presenta sobre un fondo negro. A la derecha, una espiral de tabiques curvos, de un pardo dorado, se enrolla en torno a un minúsculo centro blanco: se cuentan allí una treintena de cámaras en forma de media luna, cada vez más grandes a medida que se alejan del corazón. A la izquierda se abre la última cámara, con mucho la más vasta, lisa y vacía, tapizada de un nácar crema que se tiñe de reflejos rosas, verdes y dorados según la luz. El borde exterior de la concha, más mate, dibuja una curva continua, desde el pico puntiagudo de la abertura, abajo a la izquierda, hasta la cima de la espiral."""
evocation = """
El nautilo es uno de los emblemas de la belleza natural. Su espiral, que crece sin cambiar de forma, ha fascinado a matemáticos y artistas. En el Renacimiento, los orfebres montaban conchas de nautilo sobre pies de plata dorada para hacer copas de aparato, orgullo de los gabinetes de curiosidades de los príncipes. Julio Verne dio su nombre al submarino del capitán Nemo. Para los biólogos es también un testigo: el nautilo es el último representante de un linaje de cefalópodos con concha que ya existía antes de los amonites y les sobrevivió. Cortar su concha es hacer visible la historia de toda una vida, cámara tras cámara."""
histoire = """
El nautilo cameral vive en el Indo-Pacífico, desde Filipinas e Indonesia hasta Australia y las islas Fiyi, a lo largo de las pendientes abruptas de los arrecifes de coral, a menudo a varios cientos de metros de profundidad; sube de noche para alimentarse. Sus conchas, muy buscadas, se han pescado durante mucho tiempo en gran número para el comercio de recuerdos y de nácar. Como crece lentamente y se reproduce poco, sus poblaciones han disminuido; en 2016 fue incluido en el apéndice II del convenio de Washington (CITES), que regula su comercio internacional. Este espécimen pertenece al Yale Peabody Museum; su fotografía fue publicada por el museo en el dominio público."""
facture = """
La concha está hecha de aragonito, una forma del carbonato de calcio. A medida que crece, el animal avanza en su concha y construye tras de sí un nuevo tabique: las cámaras vacías, llenas de gas y de un poco de líquido, sirven de flotador. Un fino tubo de tejido vivo, el sifón, las atraviesa todas y permite regular la cantidad de líquido, como los lastres de un submarino. El interior de la gran cámara está tapizado de nácar, hecho de minúsculas plaquetas apiladas que descomponen la luz en reflejos irisados."""
details = [
  "La treintena de cámaras en media luna, cada vez más grandes hacia el exterior.",
  "El minúsculo centro blanco, primera cámara del animal.",
  "Los reflejos rosas y verdes del nácar en la gran cámara.",
  "El pico puntiagudo de la abertura, abajo a la izquierda.",
]
themes = ["concha", "espiral", "mar", "nácar", "cefalópodo"]
anecdote = """
A menudo se lee que la espiral del nautilo sigue el número áureo. Es una idea preconcebida: las mediciones de numerosas conchas muestran que su espiral se ensancha según una proporción distinta, y variable de un individuo a otro."""
