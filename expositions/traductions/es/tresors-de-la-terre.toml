[[oeuvres]]
titre = "Rebanada del meteorito de Gibeon"
artiste = "Gibeon, Namibie"
annee = "Formado hace unos 4500 millones de años"
image = "meteorite-gibeon.jpg"
credit = "Photo : Kevin Walsh"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Gibeon_meteorite_slice.jpg"
technique = "Hierro meteorítico (aleación de hierro y níquel), octaedrita fina del grupo IVA; rebanada aserrada, pulida y atacada con ácido"
collection = "Colección no especificada (fotografía de Kevin Walsh, 2002)"
note = "Una rebanada de hierro caído del cielo, aserrada, pulida y luego atacada con ácido: aparece entonces un entramado de láminas metálicas, las figuras de Widmanstätten, que solo se forman en el corazón de un asteroide."
description = """
Sobre un fondo negro se destaca una placa de metal de contorno irregular, cortada con sierra de un bloque mayor. Su superficie, de un gris plateado, no es lisa: está enteramente cubierta por una red de bandas rectas y estrechas, que se cruzan según tres o cuatro direcciones. Dibujan triángulos, rombos y paralelogramos, como los hilos sacados de un tejido o las ramitas de un haz de leña. Algunas bandas brillan, otras parecen más oscuras según el modo en que devuelven la luz; los pequeños espacios que encierran tienen una textura más fina, casi granulosa. En los bordes, la rebanada se deshilacha en puntas y muescas, allí donde pasaba la superficie bruta del meteorito."""
evocation = """
Este dibujo geométrico es el archivo de un mundo desaparecido. Hace unos 4500 millones de años, en el nacimiento del sistema solar, se forman pequeños planetas en torno al joven Sol; en algunos, el metal fundido cae al centro y forma un núcleo. Las figuras de Widmanstätten solo nacen si ese metal se enfría con extrema lentitud, a razón de unos pocos grados por millón de años, en un cuerpo enterrado bajo kilómetros de roca. Una colisión rompió después ese asteroide, y uno de sus fragmentos terminó por cruzarse en el camino de la Tierra. Tocar una rebanada así es tocar el corazón de un astro, al que ninguna perforación permitirá jamás llegar en nuestro propio planeta."""
histoire = """
Los meteoritos de Gibeon cayeron mucho antes de la historia escrita, en una lluvia de fragmentos dispersos a lo largo de cientos de kilómetros en el sur de Namibia, en torno a la pequeña ciudad de Gibeon que les dio su nombre. Los nama, que viven en la región, extraían de ellos hierro para fabricar herramientas y puntas de armas. Los europeos los descubren en el siglo XIX: en la década de 1830, muestras traídas por un explorador británico son reconocidas en Londres como hierro llegado del espacio. Desde entonces se han recogido cientos de masas, de unos pocos gramos a varios cientos de kilos. Namibia las protege hoy como patrimonio nacional, y una treintena de las más grandes se exponen al aire libre, en una plaza de la capital, Windhoek."""
facture = """
El hierro de Gibeon contiene alrededor de un 8 % de níquel. Al enfriarse, se separó en dos aleaciones: la kamacita, pobre en níquel, en anchas láminas, y la taenita, más rica, en finos ribetes. Para revelarlas, se sierra el meteorito, se pule la rebanada como un espejo y luego se ataca con un ácido diluido, que corroe ambos metales a velocidades distintas. Las láminas se orientan según las caras de un octaedro: de ahí el nombre de octaedrita. Las de Gibeon son muy estrechas, menos de medio milímetro, lo que la clasifica entre las octaedritas finas."""
details = [
  "Las bandas paralelas que reaparecen según solo tres o cuatro direcciones.",
  "Los pequeños triángulos entre las láminas, rellenos de una textura más fina.",
  "El contraste entre láminas brillantes y láminas mates, que cambia con la luz.",
  "El contorno irregular, que sigue la forma del bloque de origen.",
]
themes = ["meteorito", "espacio", "hierro", "cristal", "sistema solar"]
anecdote = """
Se habla de «figuras de Widmanstätten», por el nombre del conde austríaco Alois von Beckh-Widmanstätten, que las observó en Viena en 1808. Pero el británico William Thomson ya las había descrito unos años antes, en Nápoles: por eso se las llama a veces «estructuras de Thomson»."""
salle = 1
mur = "est"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "El diamante Hope"
artiste = "Mines de Golconde, Inde"
annee = "Diamante indio conocido desde el siglo XVII; talla actual atestiguada en 1812; fotografía de 1974"
image = "diamant-hope.jpg"
credit = "Photo : Smithsonian Institution Archives"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Hope_Diamond_-_SIA.jpg"
technique = "Diamante azul de 45,52 quilates (25,6 × 21,8 mm), engastado en un colgante rodeado de dieciséis diamantes blancos"
collection = "National Museum of Natural History, Smithsonian Institution, Washington"
note = "El diamante azul más famoso del mundo: 45,52 quilates para algo más de 2,5 cm de largo, mostrado aquí muy ampliado. Fue tallado a partir del «Azul de Francia» de Luis XIV, robado en 1792."
description = """
En el centro de un colgante, una piedra ovalada de un azul profundo, casi negro en sus partes oscuras, devuelve la luz con sus facetas: triángulos y rombos más claros, de un azul acero, se encienden en su superficie. Su contorno no es del todo regular, ligeramente abombado de un lado. A su alrededor, una corona de dieciséis diamantes incoloros, tallados unos en pera y otros en cojín, centellea con reflejos blancos y violetas. Arriba, una anilla une la joya a una cadena de diamantes, borrosa al fondo; abajo cuelga un pequeño aro. La fotografía, tomada en 1974 por los servicios del Smithsonian, muestra la joya posada sobre un fondo de tela gris azulado."""
evocation = """
Pocas piedras han hecho soñar tanto. El diamante Hope resume tres siglos de historia: el esplendor de Luis XIV, la caída de la monarquía, la fortuna de los banqueros y de las herederas estadounidenses. Los periódicos de principios del siglo XX le inventaron una maldición, que habría golpeado a todos sus propietarios; se piensa que fue alimentada por los propios comerciantes, para hacer la piedra más deseable. Encarna también una idea democrática: el diamante más famoso del mundo pertenece hoy al público y se contempla gratuitamente, en un museo nacional. Por último, plantea un enigma de física: un diamante es carbono puro, y su color azul se debe solo a unos pocos átomos extraños."""
histoire = """
En 1668, el comerciante francés Jean-Baptiste Tavernier vende a Luis XIV un gran diamante azul comprado en la India, de más de 110 quilates. En 1673, el joyero de la corte, Jean Pittan, lo vuelve a tallar en una piedra de unos 69 quilates, el «Azul de Francia». Luis XV lo hace montar en 1749 en una insignia de la orden del Toisón de Oro. En septiembre de 1792 es robado junto con las joyas de la Corona en el Garde-Meuble, en París. Una piedra azul de 45 quilates reaparece en Londres en 1812 y entra después en la colección del banquero Henry Philip Hope, cuyo nombre conserva. Pierre Cartier la vende en 1911 a Evalyn Walsh McLean; tras su muerte, Harry Winston la compra y la dona al Smithsonian en 1958. En 2007, un molde de plomo del Azul de Francia, hallado en el Museo de París, confirmó que el Hope procedía de él."""
facture = """
El diamante Hope está tallado en cojín, con una corona de facetas arriba y un pabellón más profundo abajo, que devuelve la luz hacia el ojo. Su color procede de trazas de boro, unos pocos átomos por cada millón de átomos de carbono: absorben una parte de la luz roja y amarilla y solo dejan pasar el azul. Es un diamante llamado de tipo IIb, una categoría muy rara. Tiene otra propiedad asombrosa: iluminado con rayos ultravioleta y sumido de nuevo en la oscuridad, luce unos segundos con un resplandor rojo anaranjado. La joya que lo rodea, una montura de dieciséis diamantes blancos y una cadena de cuarenta y cinco diamantes, realza su color oscuro."""
details = [
  "El contorno algo asimétrico de la piedra azul.",
  "Las facetas del pabellón, que se iluminan en triángulos de un azul más claro.",
  "Los dieciséis diamantes blancos, donde alternan las tallas en pera y en cojín.",
  "La anilla, arriba, que sujeta el colgante a la cadena.",
]
themes = ["diamante", "azul", "luis xiv", "leyenda", "gema"]
anecdote = """
En 1958, Harry Winston envió el diamante al Smithsonian por correo, certificado, en un simple paquete de papel kraft asegurado por un millón de dólares. El embalaje, con sus sellos y su matasellos, se conserva hoy en el Museo Postal Nacional de Washington."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Fluorita rosa sobre cuarzo ahumado"
artiste = "Massif du Mont-Blanc, France"
annee = "Cristalizada en una fisura del granito, durante el levantamiento de los Alpes"
image = "fluorite-aiguille-verte.jpg"
credit = "Photo : Marie-Lan Taÿ Pamart"
licence = "CC BY 4.0"
source = "https://commons.wikimedia.org/wiki/File:Fluorite_on_smoky_quartz_Aiguille_Verte_MNHN_Minéralogie.jpg"
technique = "Fluorita (fluoruro de calcio) en octaedros, sobre un cristal de cuarzo ahumado; procedente de la Aiguille Verte (Alta Saboya)"
collection = "Galería de Mineralogía y Geología, Museo Nacional de Historia Natural, París"
note = "Octaedros de fluorita rosa anaranjado posados sobre un cristal de cuarzo ahumado: uno de los tesoros de las fisuras de cristales del macizo del Mont Blanc, recogido en la Aiguille Verte."
description = """
Un conjunto de cristales rosa salmón, casi anaranjados, se aferra a un cristal más oscuro, gris pardo, que se alza en lo alto de la composición: un cuarzo ahumado, del que se ve la cara plana y la punta. Los cristales rosas tienen caras triangulares muy nítidas; varios son octaedros casi perfectos, como dos pirámides pegadas por la base. Se apilan y se superponen, de tamaños diversos, los más grandes en el centro, los más pequeños en racimo en los bordes. Su superficie no está pulida: parece escarchada, finamente estriada o labrada con pequeños escalones. Atravesados por la luz de la vitrina, los bordes de los cristales se vuelven translúcidos y se encienden en un rosa más vivo sobre el pedestal gris pálido."""
evocation = """
Este objeto habla de la alta montaña. Procede de una fisura del granito, a varios miles de metros de altitud, adonde hubo que trepar, excavar y descender con la piedra a la espalda. Para los cristaleros de Chamonix, la fluorita rosa es el más bello tesoro del macizo, mucho más rara que el cuarzo. Su geometría fascina también: el octaedro, de ocho caras triangulares iguales, es uno de los cinco sólidos regulares que Platón asociaba a los elementos del mundo, y la naturaleza lo produce aquí sin ayuda de mano alguna. El contraste entre el rosa tierno y el cuarzo oscuro, en fin, tiene algo de composición de pintor, como una flor posada sobre una roca."""
histoire = """
La Aiguille Verte, de 4122 metros de altura, domina el valle de Chamonix; el inglés Edward Whymper realiza su primera ascensión en 1865, con dos guías suizos. Mucho antes que los alpinistas, cazadores de cristales, los cristaleros, recorrían ya los glaciares y las paredes del macizo en busca de los «hornos»: cavidades del granito tapizadas de cuarzo, que se localizan por una veta blanca en la roca. Las fluoritas rosas son allí raras y codiciadas. Este espécimen pertenece a las colecciones del Museo Nacional de Historia Natural y se expone en su galería de Mineralogía y Geología, en el Jardin des Plantes, junto a otros minerales de los Alpes franceses."""
facture = """
La fluorita es un fluoruro de calcio. En las fisuras de los Alpes, suele cristalizar en octaedros más que en cubos. Su color rosa, raro, se atribuye a minúsculos defectos del edificio cristalino, ligados a trazas de tierras raras y a la radiactividad natural del granito. El cuarzo ahumado debe también su tono pardo a esa radiactividad, que actúa sobre trazas de aluminio. Ambos minerales crecieron lentamente en aguas calientes cargadas de elementos disueltos que circulaban por la roca fisurada, mientras la cadena de los Alpes se levantaba."""
details = [
  "Las caras triangulares de los octaedros rosas, nítidas como facetas talladas.",
  "La superficie escarchada y estriada de los cristales, que nunca ha sido pulida.",
  "El cristal de cuarzo ahumado, gris pardo, que sirve de soporte al conjunto.",
  "Los bordes translúcidos donde la luz hace virar el rosa al anaranjado.",
]
themes = ["mineral", "cristal", "montaña", "alpes", "color"]
anecdote = """
La fluorita dio su nombre a la fluorescencia. En 1852, el físico británico George Gabriel Stokes acuña esta palabra al estudiar el resplandor que emiten algunas fluoritas cuando se las ilumina con luz ultravioleta."""
salle = 3
mur = "nord"
place = 3
largeur = 1.3

[[oeuvres]]
titre = "Geoda de amatista"
artiste = "Coulées de lave de la Serra Geral, Brésil"
annee = "Comienzos del Cretácico, hace unos 130 millones de años"
image = "geode-amethyste.jpg"
credit = "Photo : James St. John"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Amethyst_geode_(Serra_Geral_Formation,_Lower_Cretaceous;_southeastern_Brazil)_1_(32934451701).jpg"
technique = "Cuarzo (variedad amatista) y calcedonia, en una cavidad de una colada de basalto"
collection = "Mineral Museum, Montana Bureau of Mines and Geology, Butte (Montana)"
note = "Una burbuja de gas prisionera de una colada de lava, tapizada poco a poco por miles de cristales violetas: las geodas de amatista del sur de Brasil figuran entre las más grandes del mundo."
description = """
La geoda ha sido abierta y se presenta como un gran óvalo hueco, tendido sobre su pedestal. En el exterior, una corteza de roca de un gris verdoso forma la cáscara. Justo en el interior corre un borde blanco y gris, liso, como un ribete de porcelana. Luego vienen los cristales: miles de pequeñas pirámides apretadas, apuntando hacia el centro, de un violeta pálido cerca del borde, cada vez más oscuro hacia el fondo de la cavidad, donde algunas zonas parecen grises o casi negras. Arriba a la derecha, un pequeño grupo de cristales blancos y brillantes, sin duda de calcita, se destaca sobre el violeta. La luz atrapa las puntas y hace centellear toda la pared."""
evocation = """
La geoda es el tesoro oculto por excelencia: una piedra banal y gris por fuera, una gruta de cristales por dentro. Ha alimentado las leyendas de cavernas maravillosas y de piedras que encierran un mundo. Su color, el violeta, fue durante mucho tiempo el del poder y el de la Iglesia: los obispos llevaban un anillo de amatista. Pero la geoda habla sobre todo del tiempo: cada cristal creció átomo a átomo, a partir de un agua que rezumaba en la lava enfriada, durante duraciones que superan la imaginación. Recuerda también que la belleza mineral nace a veces de los cataclismos: aquí, de una de las mayores erupciones de la historia de la Tierra."""
histoire = """
Hace unos 130 millones de años, cuando América del Sur y África comienzan a separarse, inmensas coladas de basalto se extienden por el sur del continente, en capas sucesivas que forman hoy la Serra Geral. En la lava aún líquida quedan atrapadas burbujas de gas; mucho más tarde, aguas cargadas de sílice se infiltran en ellas y las llenan de cristales. En el estado de Rio Grande do Sul, en Brasil, y en la región vecina de Artigas, en Uruguay, los mineros siguen la capa de lava rica en geodas excavando galerías en la ladera de la colina. Las geodas, extraídas con martillo neumático, se serran y se venden en todo el mundo. Esta se expone en el museo de mineralogía de Butte, en Montana."""
facture = """
El crecimiento sigue un orden preciso. Las aguas que circulan por la cavidad depositan primero una fina capa de calcedonia, una sílice de cristales invisibles a simple vista: es el borde blanco. Luego el cuarzo cristaliza en prismas de los que solo asoma la punta, todas orientadas hacia el vacío central. El color de la amatista procede de trazas de hierro, transformadas por la radiactividad natural de las rocas. Es frágil: calentada a unos cientos de grados, la amatista se vuelve amarillo anaranjado, y buena parte de las «citrinas» vendidas en joyería son amatistas calentadas."""
details = [
  "La corteza de basalto gris verdoso, que formaba la pared de la burbuja de gas.",
  "El ribete blanco de calcedonia, primera capa depositada en la cavidad.",
  "Las puntas de los cristales, todas dirigidas hacia el centro.",
  "El pequeño grupo de cristales blancos, arriba a la derecha.",
  "El violeta que se oscurece hacia el fondo de la geoda.",
]
themes = ["mineral", "geoda", "cristal", "violeta", "volcán"]
anecdote = """
La palabra amatista procede del griego amethystos, «que no está ebrio». Los griegos creían que esta piedra protegía de la embriaguez, y se cuenta que bebían el vino en copas de amatista."""
salle = 3
mur = "sud"
place = 3
