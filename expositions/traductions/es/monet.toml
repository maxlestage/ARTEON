titre = "Monet, la luz en acción"
artiste = "Claude Monet"
dates = "1840–1926"
accroche = "Exposición virtual · Claude Monet"
introduction = """
Del jardín de Ville-d'Avray a los nenúfares de Giverny, acompañe sesenta años de \
pintura tras la pista de la luz: el sol naciente que dio nombre al \
impresionismo, las estaciones y las calles engalanadas con banderas, las series de los almiares y de las \
catedrales, y después el agua y las flores del jardín, hasta llegar a la abstracción."""
vitrine = "nympheas.jpg"

[musee]
nom = "Museo de Orsay"
ville = "París, Francia"
architecte = "Victor Laloux"
construction = "1898–1900"
presentation = """
Para la Exposición Universal de 1900, la Compañía del Ferrocarril de París a Orleans \
manda construir en la orilla izquierda, frente a las Tullerías, una estación y un hotel \
proyectados por Victor Laloux. Tras sus fachadas de piedra, la estación de Orsay oculta una inmensa nave \
de metal y cristal; se inaugura el 14 de julio de 1900. Al quedar sus andenes demasiado \
cortos para los trenes modernos, deja de prestar servicio a las grandes líneas en 1939. Salvada \
de la demolición, es transformada en museo por los arquitectos Renaud Bardon, \
Pierre Colboc y Jean-Paul Philippon, con la decoración interior de Gae Aulenti, \
y abre sus puertas en diciembre de 1986. La nave central, bajo la cubierta de cristal, acoge la escultura del \
siglo XIX, y los grandes relojes recuerdan la estación. Dedicado a las artes de 1848 a \
1914, Orsay conserva la mayor colección de pintura impresionista del mundo, \
con decenas de lienzos de Monet, desde La estación de Saint-Lazare hasta las Catedrales de Ruan."""
ici = """
El edificio de ARTEON toma de Orsay su nave bajo cubierta de cristal y de la Orangerie la sala \
blanca de los Nenúfares. Se entra por el sur en la nave de las esculturas, de treinta y seis metros de largo y diez \
de alto, donde se alzan tres esculturas estadounidenses del siglo XIX. En su mitad norte, dos puertas se enfrentan: al oeste la sala I · El \
nacimiento del impresionismo, al este la sala II · La ciudad y las series, de muros \
gris azulado. Al fondo de la nave, la sala III · Los Nenúfares, ancha y baja, de muros \
blancos, cierra la visita."""

