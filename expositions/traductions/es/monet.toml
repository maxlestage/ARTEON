[[sculptures]]
titre = "La esclava griega (The Greek Slave)"
artiste = "Hiram Powers"
annee = "1843"
modele = "greek-slave.stl"
technique = "Yeso (modelo original)"
collection = "Smithsonian American Art Museum, Washington"
note = "El modelo en yeso de la escultura más célebre de su tiempo, modelada en Florencia y expuesta en Londres en 1851."
description = """
Una joven desnuda, de pie y a tamaño natural, se mantiene en una pose serena, con el peso \
del cuerpo sobre una pierna, a la manera de las estatuas antiguas. Sus muñecas están \
unidas por una cadena: una mano descansa sobre un pilar, la otra, bajada, vela su \
desnudez. El rostro, desviado, se inclina hacia un lado, con la mirada baja y una \
expresión de resignación serena. Sobre el pilar se han dejado caer sus ropas, una tela \
con flecos, así como una cruz y un medallón colgados, signos de su fe cristiana y \
de sus vínculos familiares. El cuerpo es liso, las formas llenas y suaves, el \
cabello recogido en un moño. La figura, concebida para ser contemplada por todos los lados, \
invita al visitante a rodearla."""
evocation = """
Powers da a su obra un tema preciso: una joven griega capturada por los turcos \
durante la guerra de independencia griega y expuesta desnuda en un mercado de esclavos. Su \
desnudez, en principio inaceptable para el público estadounidense de la época, queda justificada \
por este relato: es sufrida, no ofrecida, y la joven permanece pura por su fe, \
que recuerda la cruz. El propio escultor insistía en esta lectura moral. En los \
Estados Unidos, la obra adquirió una resonancia inesperada: en un país donde la esclavitud es \
legal, los abolicionistas vieron en ella la imagen de la condición de los esclavos negros, y \
la volvieron contra quienes admiraban la estatua sin ver la esclavitud en su propia casa. \
Concentra así las contradicciones morales de su tiempo."""
histoire = """
Powers modela la estatua en arcilla en Florencia entre 1841 y 1843, y luego saca de ella este \
modelo en yeso, a partir del cual sus oficiales tallan los mármoles. El primer \
ejemplar, terminado en 1844, es comprado por un oficial inglés y permanece en Inglaterra. \
Otro parte de gira por los Estados Unidos de 1847 a 1849: más de cien mil visitantes \
pagan por verlo, y unos pastores garantizan su moralidad. Presentada en el Crystal \
Palace con motivo de la Exposición Universal de Londres en 1851, se convierte en una de las \
esculturas más famosas del mundo. Powers hace realizar seis versiones en mármol a \
tamaño natural, y numerosas reducciones. El yeso, que permaneció en el taller \
florentino, es adquirido junto con otros muchos modelos por el Smithsonian en 1968."""
facture = """
Como la mayoría de los escultores neoclásicos, Powers modela primero la figura en \
arcilla, saca de ella un vaciado en yeso y luego confía la talla del mármol a oficiales \
italianos, reservándose los acabados. Este yeso es, pues, el original de la obra, la \
matriz de todas las versiones. Los pequeños puntos metálicos clavados en su superficie \
permitían, mediante un aparato de puntos, trasladar las medidas al \
bloque de mármol con precisión. La pose se inspira directamente en la Venus de Médicis, \
que Powers podía ver en Florencia, en los Uffizi, pero el modelado es más suave y más \
naturalista."""
details = [
  "La cadena que une las dos muñecas de la joven.",
  "La cruz y el medallón colgados del pilar, junto a sus ropas.",
  "Los pequeños puntos metálicos repartidos por el yeso, huellas del sacado de puntos.",
  "El rostro vuelto de lado, que evita la mirada del espectador.",
]
themes = ["neoclasicismo", "esclavitud", "desnudo", "cautiverio", "fe"]
anecdote = """
En 1851, en Londres, el abolicionista afroamericano William Wells Brown, él mismo \
antiguo esclavo, depositó junto a la estatua una caricatura de la revista Punch, «The \
Virginian Slave», que mostraba a una esclava negra encadenada en la misma pose."""
