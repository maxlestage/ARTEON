[[oeuvres]]
titre = "Almiares, final del verano"
annee = "1890–1891"
image = "meules.jpg"
technique = "Óleo sobre lienzo, 60 × 100 cm"
collection = "Art Institute of Chicago"
note = "Dos almiares de trigo en Giverny: la primera de las grandes series, donde solo cambia el momento del día."
description = """
En un campo segado, cerca de Giverny, dos almiares de trigo se alzan uno junto a otro, \
uno grande, el otro más pequeño. Su forma es sencilla: una base redondeada coronada \
por un techo cónico, como dos pequeñas chozas de paja. El sol del final de la jornada \
los ilumina de lado y proyecta sobre el rastrojo sombras azules y violetas. \
Tras ellos, una línea de árboles y algunas casas cierran el horizonte, al pie de \
colinas azuladas. El cielo, pálido y velado, ocupa una amplia franja horizontal. No \
sucede nada, ningún campesino, ningún animal, ninguna carreta: solo dos formas \
macizas posadas en la cálida luz del final del verano, cuyos contornos vibran \
ligeramente en el aire."""
evocation = """
Con los Almiares, el tema se vuelve casi indiferente: lo que cuenta es el tiempo, \
la hora, la estación, la atmósfera. Al repetir el mismo motivo bajo luces \
distintas, Monet muestra que un objeto no tiene una apariencia fija y que nuestra percepción \
cambia sin cesar. Los almiares, reservas de grano de todo un año, evocan también la \
tierra nutricia, el ciclo de las estaciones y la permanencia del mundo rural, en una época \
en que Francia se industrializa; algunos historiadores han visto en ellos una celebración del terruño \
nacional. Por su forma depurada y su presencia maciza, adquieren el aspecto de \
monumentos rústicos, y anuncian las series que seguirán."""
histoire = """
Los almiares se encuentran en un campo vecino a la casa de Giverny, donde Monet se instaló \
en 1883. Empieza a pintarlos a finales del verano de 1890 y prosigue durante \
el otoño y el invierno, hasta principios de 1891, multiplicando los lienzos. Escribe \
entonces a su amigo el crítico Gustave Geffroy que se afana en una serie de efectos \
distintos, que el sol declina tan deprisa que no puede seguirlo, y que le hace falta \
trabajar mucho para plasmar la instantaneidad. En mayo de 1891, la galería Durand-Ruel \
expone quince Almiares: el éxito es inmediato y los lienzos se venden en pocos \
días, sobre todo a coleccionistas estadounidenses. El Art Institute de Chicago conserva \
hoy uno de los conjuntos más importantes de esta serie."""
facture = """
Monet trabaja en varios lienzos a la vez, pasando de uno a otro a lo largo de las \
horas para seguir la evolución de la luz, y luego los retoma largamente en el taller \
para armonizar la serie. La pincelada es densa, cruzada, superpuesta en capas espesas \
que dan a la superficie una textura granulosa. Ningún color es local: la \
paja dorada se mezcla con naranja, rosa y violeta, las sombras con azul y malva. \
El encuadre, sencillo y casi frontal, deja todo el espacio a las variaciones de \
color."""
details = [
  "Las sombras azul violeta que se estiran al pie de los almiares.",
  "El ribete de luz que subraya el contorno de los techos de paja.",
  "Las casas y los árboles del fondo, fundidos en la bruma cálida.",
  "El rastrojo del campo segado, resuelto en pequeños toques entrecruzados.",
]
themes = ["serie", "campo", "luz", "estaciones", "Giverny"]
anecdote = """
En 1896, en Moscú, el joven Vasili Kandinski descubre un Almiar de Monet. \
Contará que al principio no había reconocido el tema sin la ayuda del catálogo, y que \
aquel impacto le reveló la fuerza del color solo, desprendido del objeto."""
salle = 3
