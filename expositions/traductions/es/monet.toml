nom = "Edmonia Lewis"
vie = "Probablemente Greenbush (estado de Nueva York), hacia 1844 – Londres, 17 de septiembre de 1907"
biographie = """
Edmonia Lewis nace de un padre de origen afrohaitiano y de una madre de ascendencia \
ojibwa y africana. Huérfana muy joven, es criada en parte por la familia \
de su madre, que le pone el nombre de «Fuego salvaje». Gracias al apoyo de su hermano, ingresa en \
1859 en el Oberlin College, en Ohio, uno de los pocos centros que acogían a \
mujeres y a estudiantes negros. En 1862 es acusada allí de haber envenenado a dos \
compañeras blancas; defendida por el abogado negro John Mercer Langston, es \
absuelta, pero sufre una violenta agresión y debe abandonar la escuela sin título. En \
Boston, se forma con el escultor Edward Brackett y se da a conocer con \
retratos de abolicionistas, en particular un busto del coronel Robert Gould Shaw, cuyas \
copias vendidas financian su viaje a Europa. En Roma, donde se instala hacia \
1865-1866, frecuenta el círculo de escultoras estadounidenses reunidas en torno a \
Harriet Hosmer. Crea allí obras inspiradas en la historia afroamericana, como \
Forever Free, que celebra la emancipación, y temas amerindios tomados de \
Longfellow. Su Muerte de Cleopatra es una de las sensaciones de la Exposición del \
Centenario, en Filadelfia, en 1876. Convertida al catolicismo, recibe \
encargos de ricos visitantes, hasta que el gusto neoclásico pasa de moda. Sus \
últimos años son poco conocidos; solo en 2011 unas investigaciones establecieron \
que había muerto en Londres en 1907."""
style = """
Edmonia Lewis trabaja en la tradición neoclásica entonces dominante en Roma: mármol \
blanco, superficies lisas, referencias a la Antigüedad y a la literatura. Pero hace entrar en ella \
temas casi ausentes de la escultura de su tiempo: la emancipación de los \
esclavos, la dignidad de las mujeres negras, la vida de los pueblos amerindios. Al \
reivindicar el dominio de todo el proceso, hasta la talla del mármol, \
afirma plenamente su condición de artista. Primera escultora de ascendencia africana y \
amerindia en obtener un reconocimiento internacional, durante mucho tiempo olvidada, es \
hoy redescubierta como una figura pionera, cuya obra interroga las \
relaciones entre arte, identidad e historia estadounidense."""
