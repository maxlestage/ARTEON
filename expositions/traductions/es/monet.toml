[[oeuvres]]
titre = "La catedral de Ruan, armonía azul"
annee = "1893"
image = "cathedrale-rouen.jpg"
technique = "Óleo sobre lienzo, 91 × 63 cm"
collection = "Museo de Orsay, París"
note = "El portal al sol de la mañana, pintado desde una ventana de enfrente: la piedra se disuelve en la luz."
description = """
La fachada occidental de la catedral de Ruan ocupa todo el lienzo, vista de muy \
cerca y cortada por arriba por el marco: no se ven ni la cima de las torres ni la aguja. \
En el centro, el gran portal gótico se abre bajo una alta arcada finamente \
cincelada; encima se adivinan las galerías y el rosetón. A la izquierda, la torre \
de Saint-Romain se eleva en parte. El cielo solo aparece en una estrecha franja, a los \
lados. La piedra, todavía sumida en la sombra de la mañana, está bañada de azules profundos, \
mientras que los primeros toques de sol, dorados y rosados, alcanzan los relieves, \
los pináculos y las esculturas. Ningún transeúnte, ninguna vida en el atrio: solo la \
masa labrada del edificio, como suspendida en el aire."""
evocation = """
Al pintar más de treinta veces la misma fachada, Monet transforma un monumento cargado \
de historia y de fe en una simple pantalla sobre la que juega la luz. La catedral, \
símbolo de permanencia, se convierte paradójicamente en la imagen de la inestabilidad: cambia \
de color, de materia y casi de forma de una hora a otra. Se ha visto en ella una \
reflexión sobre el tiempo y la percepción, y algunos han leído una meditación casi \
religiosa sobre la luz, que parece emanar de la propia piedra. La elección de una \
obra maestra gótica, emblema del patrimonio nacional, tampoco es inocente en \
una Francia que redescubre entonces su Edad Media. Monet hace de ella, sin embargo, menos un \
monumento que una materia viva."""
histoire = """
Monet trabaja en Ruan durante dos inviernos, de febrero a abril de 1892 y luego en 1893. \
Alquila sucesivamente habitaciones en edificios situados frente a la catedral, \
sobre unas tiendas, desde donde pinta la fachada a distintas horas del día. De vuelta en \
Giverny, retoma largamente los lienzos para armonizar el conjunto, y fecha \
varios en 1894. En mayo de 1895 expone una veintena en casa de Durand-Ruel. Georges \
Clemenceau les dedica en La Justice un artículo entusiasta, «Revolución de \
catedrales», y desea que el Estado compre la serie entera, lo que no ocurrirá. \
El conde Isaac de Camondo, gran coleccionista, reúne varios, entre ellos este, \
y los lega al Louvre en 1911; hoy están en el Museo de Orsay."""
facture = """
La materia es el elemento más llamativo de la serie: Monet superpone capa tras capa \
una pasta espesa y rugosa, trabajada con el pincel casi seco, que acaba por \
parecerse a la propia piedra. Los contornos de la arquitectura desaparecen bajo \
esta costra coloreada. La gama es voluntariamente limitada, aquí dominada por los azules \
y los violetas, realzados con toques de ocre y naranja, colores complementarios que \
hacen vibrar la superficie. El encuadre ceñido suprime todo contexto, a la manera de un \
primer plano. El efecto de luz solo se lee plenamente con distancia."""
details = [
  "El portal central, cuyas esculturas se disuelven en la sombra azul.",
  "Los primeros toques de sol, dorados, sobre los pináculos y los relieves.",
  "La superficie rugosa de la pintura, que imita el grano de la piedra.",
  "La estrecha franja de cielo, casi del mismo color que la fachada.",
]
themes = ["serie", "catedral", "gótico", "luz", "Ruan"]
anecdote = """
Durante su estancia en Ruan, Monet escribe a Alice Hoschedé que ha pasado una noche de \
pesadillas: la catedral se desplomaba sobre él, y se le aparecía unas veces azul, \
otras rosa, otras amarilla."""
