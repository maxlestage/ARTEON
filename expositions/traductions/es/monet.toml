[[oeuvres]]
titre = "Mujeres en el jardín"
annee = "1866"
image = "femmes-jardin.jpg"
technique = "Óleo sobre lienzo, 255 × 205 cm"
collection = "Museo de Orsay, París"
note = "Un lienzo inmenso pintado al aire libre: Monet abre una zanja en el jardín para alcanzar la parte superior del cuadro."
description = """
Cuatro jóvenes con vestidos de verano se encuentran en un rincón de jardín inundado de \
sol. A la izquierda, una de ellas está sentada en la hierba, con su amplio vestido claro de dibujos extendido \
en corola a su alrededor; sostiene una sombrilla que proyecta sobre su rostro una sombra \
coloreada, y un ramo descansa sobre sus rodillas. Tras ella, otras dos mujeres \
permanecen de pie junto al tronco de un árbol, con flores en la mano; una de ellas hunde el \
rostro en el ramo que respira. A la derecha, una cuarta se lanza hacia un \
macizo de rosales para cortar una flor, sorprendida en pleno movimiento. Un sendero de \
arena atraviesa el primer plano en curva, cortado por la sombra de los follajes. El fondo \
está cerrado por un espeso telón de verdor: toda la mirada se concentra en la luz \
que cae sobre las telas blancas."""
evocation = """
El lienzo no cuenta nada: ni anécdota, ni episodio histórico, ni alegoría. Es \
precisamente lo que lo hacía desconcertante en 1867. Monet traslada aquí, a un formato \
inmenso hasta entonces reservado a los asuntos de historia, una simple escena de la vida moderna: \
jóvenes de la burguesía, vestidas a la última moda, en una tarde \
de verano. El verdadero tema es la luz que se filtra entre las hojas y se posa \
sobre los tejidos. Los historiadores ven en ella una respuesta ambiciosa al Almuerzo sobre la hierba \
de Manet y a las grandes figuras de Courbet, con una exigencia nueva: pintarlo todo \
del natural. Los rostros, poco individualizados, cuentan menos que el efecto de conjunto; \
Camille, la compañera del pintor, habría posado para varias de las figuras, de modo que \
el lienzo parece mostrar a una misma joven desde distintos ángulos."""
histoire = """
Monet empieza el lienzo en la primavera de 1866 en el jardín de una casa alquilada en \
Ville-d'Avray, cerca de París, tras renunciar a terminar su gigantesco Almuerzo \
sobre la hierba. Decidido a ejecutarlo todo al aire libre, lo prosigue durante el verano y luego \
lo termina en Honfleur, adonde se ha retirado para huir de sus acreedores. Presentado en el Salón \
de 1867, es rechazado por el jurado. Su amigo Frédéric Bazille, más acomodado, \
lo compra para ayudarlo. Tras la muerte de Bazille en combate en 1870, el lienzo vuelve a \
Monet por mediación de Manet, y el pintor lo conserva durante medio siglo. \
En 1921, por iniciativa de su amigo Georges Clemenceau, el Estado se lo compra: un gesto \
de reconocimiento hacia el viejo maestro, durante largo tiempo rechazado por las instituciones. \
Tras pasar por el Louvre, se expone en el Museo de Orsay desde 1986."""
facture = """
Monet trabaja enteramente del natural, lo que le obliga a esperar el regreso del \
sol para recuperar los mismos efectos. La luz se construye mediante contrastes \
francos: blancos resplandecientes de los vestidos al sol, sombras no grises sino teñidas de \
azul, de verde y de malva. Sobre el rostro de la mujer sentada, la sombra proyectada por \
la sombrilla toma el color de la tela, un efecto que repetirá a menudo. Las \
siluetas, de un modelado todavía firme, deben mucho a los grabados de moda de \
la época; los follajes, en cambio, están colocados en amplias manchas yuxtapuestas, sin dibujo \
previo."""
details = [
  "La sombra coloreada que la sombrilla proyecta sobre el rostro de la mujer sentada.",
  "Las manchas de sol que atraviesan el follaje y moteán el sendero de arena.",
  "El vestido de dibujos de la mujer sentada, desplegado en la hierba como una corola.",
  "A la derecha, la mano tendida hacia una rosa, detenida en pleno impulso.",
  "El ramo llevado al rostro, que oculta casi por completo las facciones de una de las jóvenes.",
]
themes = ["jardín", "aire libre", "luz", "moda", "verano"]
anecdote = """
Cuando el Estado compra el lienzo en 1921, lo paga 200 000 francos a un Monet ya \
célebre; cincuenta y cinco años antes, Bazille lo había adquirido por 2500 francos, \
abonados en pequeñas mensualidades para ayudar a su amigo, que no tenía un céntimo."""
salle = 2
mur = "ouest"
place = 1
largeur = 1.8

[[oeuvres]]
titre = "La urraca"
annee = "1868–1869"
image = "la-pie.jpg"
technique = "Óleo sobre lienzo, 89 × 130 cm"
collection = "Museo de Orsay, París"
note = "Un paisaje nevado cerca de Étretat, donde las sombras son azules: el Salón lo rechaza."
description = """
Un campo cubierto de nieve se extiende bajo un cielo pálido. Una valla de ramas entrelazadas \
atraviesa el lienzo, interrumpida a la izquierda por una pequeña cancela de madera; sobre el \
poste de esta se posa una urraca, única mancha negra de toda la composición. \
Tras la valla, a la derecha, se alzan casas bajas de tejados cargados de \
nieve, rodeadas de árboles cuyas ramas se doblan bajo el peso. El sol, bajo sobre \
el horizonte, ilumina la escena a contraluz: el seto proyecta sobre la nieve sombras \
que se alargan hasta el primer plano. La parte inferior del cuadro no es sino una \
vasta extensión blanca, apenas modelada por los hoyos y las huellas. Ningún personaje, \
ningún movimiento: solo el paisaje entumecido por el frío, los árboles inmóviles y \
el pájaro al acecho."""
evocation = """
La urraca es una meditación sobre el silencio y el frío, pero también sobre el color de la \
luz. Monet muestra en ella que la nieve nunca es simplemente blanca: se tiñe \
de amarillo allí donde la toca el sol, de azul y de violeta en la sombra. Esta \
observación, hoy trivial, desconcierta entonces a un público habituado a las sombras pardas o \
grises de la pintura de taller. La urraca, pequeño acento negro posado sobre la cancela, fija \
la mirada y da la escala de la inmensidad blanca; se ha podido ver en ella una presencia \
discreta de lo vivo en un mundo detenido, como una nota aislada en una partitura. El \
lienzo habla también de la situación del joven Monet: un pintor de recursos precarios, \
instalado lejos de París, que busca su camino al margen de los temas que esperaba el \
Salón."""
histoire = """
Monet pinta el lienzo durante el invierno de 1868-1869, en los alrededores de Étretat, donde se \
ha instalado con Camille y su hijo Jean, nacido en agosto de 1867. Cuenta entonces con el \
apoyo de un armador de El Havre, Louis-Joachim Gaudibert, que le ha encargado el \
retrato de su esposa. El paisaje de nieve es un género que Gustave Courbet ha vuelto a poner \
de moda, y Monet se entrega a él con pasión durante esos inviernos normandos. Enviado al \
Salón de 1869, el lienzo es rechazado por el jurado. Permanece después durante más de un \
siglo en colecciones particulares, poco visto por el público y ausente de los grandes \
relatos del impresionismo. No ingresa en las colecciones nacionales hasta 1984, \
tras una compra del Estado, y se incorpora al Museo de Orsay con la apertura de este en \
1986."""
facture = """
Todo el lienzo descansa en una gama restringida de blancos, pero ninguno es puro: Monet \
los mezcla con amarillo, rosa, azul y lila según su exposición a la luz. \
Las sombras se aplican en azul franco, sin negro. La pincelada varía según las materias: \
espesa y cremosa para la nieve apelmazada del primer plano, más fina y nerviosa para \
las ramas cubiertas de escarcha. La composición, muy horizontal, se ritma con la \
línea de la valla y la vertical de la cancela, sobre la que se recorta \
el único punto oscuro del pájaro."""
details = [
  "La urraca, posada sobre el poste de la cancela, único elemento negro del cuadro.",
  "Las sombras azules de la valla, estiradas sobre la nieve.",
  "La luz dorada del sol de invierno que golpea la parte alta de los setos.",
  "Los tejados de las casas, a la derecha, medio sepultados bajo la nieve.",
]
themes = ["nieve", "invierno", "paisaje", "sombras coloreadas", "Normandía"]
anecdote = """
Monet pintó más de un centenar de paisajes de nieve a lo largo de su vida. En enero \
de 1880, en Vétheuil, pintó incluso el Sena cubierto de hielo y luego el deshielo, cuando \
los bloques se quiebran y van a la deriva por el río."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Impresión, sol naciente"
annee = "1872"
image = "impression-soleil-levant.jpg"
technique = "Óleo sobre lienzo, 48 × 63 cm"
collection = "Museo Marmottan Monet, París"
note = "El puerto de El Havre entre la bruma. Un crítico burlón extrae de su título el nombre de «impresionistas»."
description = """
El puerto de El Havre al amanecer, envuelto en una bruma gris azulada. En el centro, un pequeño \
sol anaranjado, nítido como una pastilla, asciende sobre el agua; su reflejo se quiebra \
en una columna de trazos cortos anaranjados que desciende hacia nosotros. En primer plano, \
una barca oscura, con dos siluetas, se desliza sobre el agua; otras dos embarcaciones, \
más pálidas, se desdibujan tras ella. Al fondo se adivinan los mástiles de los \
veleros, las grúas del puerto y chimeneas cuyo humo se mezcla con la niebla. El \
cielo y el agua casi se confunden, en los mismos tonos de azul, de gris y de rosa \
anaranjado: no hay línea de horizonte nítida ni detalle preciso, solo formas que \
emergen poco a poco de la luz naciente."""
evocation = """
El lienzo capta un momento fugaz, aquel en que el sol atraviesa la bruma, y hace de él el \
propio tema del cuadro. El título lo dice: no se trata de una vista de El Havre, sino \
de una impresión, es decir, de la sensación de un instante. Para numerosos \
historiadores, la obra es también una imagen de la modernidad: un puerto industrial, sus \
grúas y sus humos, al día siguiente de la guerra de 1870, en una Francia que se \
reconstruye. Se ha visto en ella un símbolo de esperanza, el sol alzándose sobre un país maltrecho, \
aunque Monet nunca la presentó así. Convertida en emblema de todo un movimiento, \
resume la ambición impresionista: pintar no las cosas, sino la luz \
y el aire que las envuelven, en el tiempo que pasa."""
histoire = """
Monet pinta el lienzo en 1872 desde una habitación de hotel que da al antepuerto de \
El Havre, la ciudad de su infancia. Lo expone en París el 15 de abril de 1874, en el bulevar de \
los Capuchinos, en el antiguo estudio del fotógrafo Nadar, con motivo de la primera exposición \
del grupo que se convertirá en los impresionistas. Contará más tarde que le pidieron \
un título para el catálogo y que propuso simplemente «Impresión». El 25 de abril, \
Louis Leroy publica en Le Charivari su artículo burlón, «La Exposición de los \
impresionistas». El lienzo pertenece después a Ernest Hoschedé, en cuya venta \
el médico y coleccionista Georges de Bellio lo adquiere en 1878. Su hija y su \
yerno, Victorine y Eugène Donop de Monchy, lo donan al Museo Marmottan en 1940. \
Robado en 1985, es recuperado en Córcega en 1990."""
facture = """
La pintura se aplica en capas finas y fluidas, tan diluidas que el lienzo aparece \
por momentos. Unas pocas pinceladas bastan para figurar una barca o un mástil; \
el agua se hace con toques horizontales rápidos, el reflejo del sol con pequeñas \
comas anaranjadas, más espesas. Monet trabaja deprisa, para fijar un efecto que dura \
apenas unos minutos. La gama se reduce al gris azulado y al naranja, dos colores \
complementarios que se exaltan mutuamente. Se ha visto en ella el recuerdo de Turner, cuyos \
lienzos Monet vio en Londres en 1870-1871, y el de las estampas japonesas en la \
simplificación de las formas."""
details = [
  "El disco naranja del sol, posado casi plano sobre el cielo gris.",
  "El reflejo del sol, hecho de unos pocos trazos anaranjados superpuestos sobre el agua.",
  "Las dos siluetas de la barca del primer plano, reducidas a manchas oscuras.",
  "A la izquierda, los mástiles y las grúas que se disuelven en la bruma.",
  "La firma y la fecha, «Claude Monet 72», abajo a la izquierda.",
]
themes = ["puerto", "bruma", "alba", "sol", "modernidad"]
anecdote = """
En 2014, el astrónomo estadounidense Donald Olson, cruzando la altura del sol, los \
horarios de las mareas y los registros meteorológicos, propuso fechar con precisión la \
escena el 13 de noviembre de 1872, hacia las 7.35 de la mañana."""
salle = 2
mur = "ouest"
place = 3
largeur = 1.3

[[oeuvres]]
titre = "Amapolas"
annee = "1873"
image = "coquelicots.jpg"
technique = "Óleo sobre lienzo, 50 × 65 cm"
collection = "Museo de Orsay, París"
note = "Cerca de Argenteuil, Camille y su hijo Jean atraviesan un campo salpicado de manchas rojas."
description = """
En un día de verano, una pradera ondulada desciende en suave pendiente hacia nosotros. A \
la izquierda, una ancha franja de amapolas rojas atraviesa la hierba en diagonal. En \
primer plano, una mujer de vestido oscuro, con una sombrilla en la mano, avanza acompañada \
de un niño tocado con sombrero de paja, medio hundido en la hierba alta. \
Más arriba, cerca de la cresta, una segunda pareja, una mujer con sombrilla y un niño, \
baja la colina. A la derecha, una hilera de árboles cierra el horizonte, y entre su follaje \
se adivina una casa. El cielo, muy amplio, ocupa casi la mitad del \
lienzo; lo cruzan nubes blancas y algodonosas. Toda la escena respira el \
calor y la lentitud de una tarde de paseo por el campo."""
evocation = """
El cuadro celebra una felicidad sencilla: un paseo en familia por el campo \
de Argenteuil, pocos años después de la guerra y de la Comuna. Las dos parejas, arriba \
y abajo de la colina, se han interpretado a menudo como los mismos paseantes en dos momentos \
de su caminata; el cuadro sugeriría así el transcurrir del tiempo, a la manera \
de una secuencia. Las amapolas, flores silvestres y efímeras, refuerzan esta \
impresión de fugacidad. Monet no busca ni relato ni símbolo subrayado: los personajes \
son casi manchas de color entre otras, fundidos en el paisaje. Lo que cuenta es la \
sensación de un verano luminoso, y la imagen de una vida apacible que el pintor, \
aunque a menudo escaso de dinero, conoce entonces en Argenteuil."""
histoire = """
Monet se instala en Argenteuil, a orillas del Sena, a finales de 1871, tras \
estancias en Londres y en los Países Bajos. Vive allí hasta 1878 con Camille y Jean, y \
este período es uno de los más fecundos de su carrera; sus amigos Renoir, Sisley o \
Manet acuden a pintar a su lado. Las Amapolas se pintan en los alrededores \
durante el verano de 1873. A la primavera siguiente, el lienzo figura en la primera exposición de los \
impresionistas, en 1874, junto a Impresión, sol naciente. Pasa luego \
por varias colecciones, hasta la del pintor, historiador del arte y \
coleccionista Étienne Moreau-Nélaton, que lo dona al Museo del Louvre en 1906 junto con \
el conjunto de sus cuadros modernos. Se expone en el Museo de Orsay desde 1986."""
facture = """
Monet construye el lienzo mediante oposiciones de colores más que por el dibujo. Las \
amapolas son simples manchas de rojo vivo puestas sobre el verde de la hierba, color \
complementario que las hace vibrar; su tamaño disminuye con la distancia, lo que \
profundiza el espacio. La diagonal de las flores, que une a las dos parejas, estructura toda \
la composición. Las figuras están esbozadas con unos pocos toques, el rostro del niño \
reducido a una mancha clara. El cielo, pintado con pinceladas anchas y móviles, \
contrasta con la pincelada más menuda y apretada de la pradera."""
details = [
  "La sombrilla de la mujer del primer plano, que se recorta sobre el cielo.",
  "La segunda pareja, en lo alto de la pendiente, reducida a dos siluetas.",
  "Las amapolas, simples puntos rojos, sin pétalos ni tallos dibujados.",
  "La casa que se adivina entre los árboles, a la derecha.",
]
themes = ["amapolas", "campo", "familia", "verano", "paseo"]
anecdote = """
La donación hecha al Louvre en 1906 por Étienne Moreau-Nélaton incluía también El \
almuerzo sobre la hierba de Manet: el lienzo escandaloso del Salón de los Rechazados de 1863 y \
el apacible paseo de Monet ingresaron juntos en las colecciones nacionales."""
salle = 2
mur = "ouest"
place = 4
largeur = 1.3

[[oeuvres]]
titre = "El paseo, la mujer con sombrilla"
annee = "1875"
image = "femme-ombrelle.jpg"
technique = "Óleo sobre lienzo, 100 × 81 cm"
collection = "National Gallery of Art, Washington"
note = "Camille y Jean vistos desde abajo, contra el cielo: el viento, las nubes y la sombra verde de la sombrilla."
description = """
Una joven vestida de blanco se encuentra en lo alto de un talud florido, vista desde abajo, \
como si el pintor estuviera sentado en la hierba. Sostiene una sombrilla inclinada y \
vuelve hacia nosotros un rostro medio oculto por un velo. El viento levanta ese velo y los \
pliegues de su vestido, y tumba las hierbas a sus pies. Algo más atrás, tras la \
cresta, un niño con sombrero redondo solo aparece de medio cuerpo. La \
silueta de la mujer se recorta a contraluz sobre un cielo azul surcado de nubes \
blancas, que ocupa casi toda la superficie del cuadro. Su vestido, en sombra, se \
tiñe de azules y amarillos, y el verde de la pradera asciende en reflejos sobre la \
tela. La línea del horizonte está tan baja que no se ve nada del paisaje circundante."""
evocation = """
El cuadro tiene la ligereza de una instantánea familiar: Camille y Jean, la mujer y el \
hijo del pintor, sorprendidos durante un paseo. El punto de vista en contrapicado \
confiere sin embargo a la joven una presencia casi monumental, como una figura \
erguida contra el cielo. Todo habla de movimiento y del instante que pasa: el viento, las \
nubes, la mirada vuelta hacia el pintor. Se ha visto en él la expresión de una felicidad conyugal \
apacible; lo que vino después da al lienzo una resonancia melancólica, pues Camille muere \
cuatro años más tarde, en 1879, a los treinta y dos años. El cuadro habla también de la ambición de \
Monet de pintar la figura humana al aire libre, no posada en el taller, sino \
bañada y casi disuelta en la luz."""
histoire = """
Monet pinta el lienzo en Argenteuil durante el verano de 1875, en las praderas vecinas a la \
casa donde vive con Camille y Jean, que tiene entonces siete años. Lo presenta en la \
primavera de 1876 en la segunda exposición de los impresionistas, organizada en casa del \
marchante Paul Durand-Ruel, en la calle Le Peletier. La prensa se muestra aún muy hostil a \
estos lienzos considerados chapuceros, pero este tipo de figura al aire libre se convierte en una de las \
señas de identidad del pintor. El cuadro abandona más tarde Francia rumbo a los Estados Unidos. \
Pertenece a Paul Mellon, hijo del banquero Andrew Mellon, fundador de la National \
Gallery of Art, y a su esposa Rachel, llamada Bunny; el matrimonio lo dona al museo de \
Washington en 1983, junto con numerosas obras francesas de su colección."""
facture = """
El lienzo está pintado con una rapidez visible: pinceladas anchas y flexibles para el \
