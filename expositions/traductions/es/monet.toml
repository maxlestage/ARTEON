[[sculptures]]
titre = "La muerte de Tecumseh (The Dying Tecumseh)"
artiste = "Ferdinand Pettrich"
annee = "1856"
modele = "tecumseh.stl"
technique = "Mármol"
collection = "Smithsonian American Art Museum, Washington"
note = "El jefe shawnee, muerto en combate en 1813, tendido como un héroe antiguo: un mármol neoclásico."
description = """
Un guerrero amerindio yace en el suelo, con la parte superior del cuerpo incorporada y apoyada \
contra una roca, como en un último esfuerzo. Su cabeza se inclina; una herida marca \
su sien. Su mano derecha aún aprieta un tomahawk, como si se negara a soltar \
su arma. El cuerpo, poderosamente musculoso y casi desnudo, solo viste un taparrabos y \
algunos adornos. La figura se desarrolla a lo largo, a la manera de los héroes \
moribundos que ocupaban los ángulos de los frontones antiguos, e invita a rodearla \
para seguir sus líneas. El mármol blanco, pulido con esmero, da al cuerpo una \
presencia a la vez sensual e idealizada. Ninguna huella de la batalla lo rodea: \
el héroe está solo ante su muerte."""
evocation = """
Pettrich representa a Tecumseh según los códigos del héroe antiguo, a imagen de los \
guerreros moribundos de la escultura griega y romana, como el célebre Galo moribundo \
de los Museos Capitolinos. Esta elección hace del adversario vencido una figura noble y \
trágica. La escultura participa así del mito del «buen salvaje» y de la idea, muy \
extendida en el siglo XIX, de una desaparición ineluctable de los pueblos amerindios. Los \
historiadores subrayan en ella una ambigüedad: el homenaje rendido al valor del jefe shawnee \
coexiste con una visión que convierte la conquista en fatalidad heroica, en el momento \
mismo en que el gobierno estadounidense deporta a las naciones indias al oeste del \
Misisipi, en aplicación de la Ley de Traslado de los Indios de 1830."""
histoire = """
Tecumseh, jefe shawnee, intenta a principios del siglo XIX unir a las naciones amerindias \
contra el avance de los colonos estadounidenses, junto con su hermano Tenskwatawa, llamado el Profeta. \
Aliado de los británicos durante la guerra de 1812, muere el 5 de octubre de 1813 en la \
batalla del Támesis, en el actual Ontario, y su cuerpo nunca se identifica con \
certeza. Llegado a los Estados Unidos en 1835, el escultor alemán Ferdinand Pettrich \
concibe la figura en los años siguientes, cuando espera obtener encargos \
oficiales en Washington. No la hace tallar en mármol hasta 1856, mucho después de \
haber abandonado América. La obra se conserva luego largo tiempo en el Capitolio, antes de \
ser transferida a las colecciones nacionales, hoy el Smithsonian American Art \
Museum."""
facture = """
Formado en el taller de Bertel Thorvaldsen en Roma, Pettrich aplica aquí la lección \
neoclásica: anatomía idealizada, superficies lisas y pulidas, contornos nítidos, emoción \
contenida. El mármol blanco, sin ningún color, aleja el tema de todo realismo \
documental y lo vincula al universo de la Antigüedad. La composición alargada, en \
diagonal, conduce la mirada desde la mano crispada sobre el arma hasta la cabeza inclinada. \
Los elementos propios de la cultura shawnee, adornos o arma, se reducen a unos pocos \
atributos, subordinados a la belleza del desnudo."""
details = [
  "El tomahawk que la mano derecha del guerrero aún aprieta.",
  "La herida en la sien, discreta, que indica la causa de la muerte.",
  "La musculatura del torso, modelada como la de un atleta antiguo.",
  "La roca en la que se apoya el cuerpo, tratada con más sencillez que la figura.",
]
themes = ["neoclasicismo", "amerindios", "héroes", "muerte", "historia"]
anecdote = """
El coronel Richard Mentor Johnson presumió de haber matado a Tecumseh en la batalla del \
Támesis; ese título de gloria, nunca probado, le ayudó a llegar a vicepresidente de los \
Estados Unidos de 1837 a 1841, con Martin Van Buren."""
