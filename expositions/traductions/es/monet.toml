[[oeuvres]]
titre = "La calle Montorgueil, fiesta del 30 de junio de 1878"
annee = "1878"
image = "rue-montorgueil.jpg"
technique = "Óleo sobre lienzo, 81 × 50 cm"
collection = "Museo de Orsay, París"
note = "Una calle de París engalanada con banderas para la Exposición Universal: una multitud y banderas en toques vibrantes."
description = """
Vista desde lo alto, desde un balcón, una calle de París se hunde hacia el fondo del cuadro, \
flanqueada de altas fachadas. Decenas de banderas tricolores cuelgan de las ventanas, a \
ambos lados, y parecen ondear al viento; sus azules, blancos y rojos \
invaden casi toda la superficie. Abajo, la calzada está ocupada por una multitud \
compacta, representada mediante una multitud de pequeños toques oscuros y claros. A lo lejos, la \
calle se pierde en una luz blanca. El formato vertical, alto y estrecho, acentúa \
la impresión de profundidad y el vértigo de la mirada que se precipita hacia abajo. No se distingue ningún \
rostro ni ningún personaje en particular: las propias fachadas desaparecen casi \
tras las telas, y el verdadero tema es la fiesta, su movimiento y su brillo."""
evocation = """
El lienzo celebra un momento de júbilo colectivo y patriótico. El 30 de junio de 1878, París \
festeja la paz y la recuperación del país, siete años después de la derrota de 1870 y de la \
Comuna. Para la joven Tercera República, aún frágil, es la ocasión de \
afirmar sus colores; la bandera tricolor, omnipresente, adquiere valor de \
manifiesto. Monet apenas es un pintor político, pero capta la energía de una \
ciudad en fiesta y de una nación que se reencuentra. La multitud, disuelta en toques de \
color, se convierte en un ser colectivo, y las banderas que palpitan hacen de la calle un \
organismo vivo. Se ve a menudo en él una de las imágenes más alegres de la vida \
moderna que nos dejaron los impresionistas."""
histoire = """
El 30 de junio de 1878, en plena Exposición Universal, el gobierno organiza una gran \
fiesta de la Paz; el 14 de julio no será fiesta nacional hasta 1880. Monet, que vive \
entonces en París con grandes dificultades económicas, recorre las calles con su \
material. Pinta dos lienzos ese día: este, de la calle Montorgueil, y una vista de \
la calle Saint-Denis, hoy en el Museo de Bellas Artes de Ruan. El mismo día, Manet \
pinta por su parte la calle Mosnier engalanada, que ve desde su estudio. El lienzo se \
presenta al año siguiente en la cuarta exposición impresionista. Durante mucho tiempo en \
manos privadas, se conserva hoy en el Museo de Orsay, a pocas paradas \
de metro de la calle que representa."""
facture = """
Monet pinta deprisa, en unas pocas horas, para captar la fiesta antes de que se \
disperse. Las banderas están hechas de toques yuxtapuestos, cortos y enérgicos, de \
azul, de blanco y de rojo, que vibran unos contra otros sin llegar nunca a formar \
un contorno preciso. La multitud se trata de la misma manera, con pequeñas pinceladas, \
como un hormigueo. La perspectiva en picado y el encuadre vertical ceñido \
recuerdan las vistas urbanas de las estampas japonesas. Casi abstracto en algunos puntos, \
el lienzo se ha comparado a menudo, por su libertad de color, con las búsquedas de los \
fauves treinta años más tarde."""
details = [
  "Las banderas del primer plano, tan próximas que parecen rozar al espectador.",
  "La multitud, abajo, hecha de innumerables pequeños toques sin rostro.",
  "El fondo luminoso, donde la calle se disuelve en un blanco resplandeciente.",
  "Las fachadas casi enteramente ocultas por las telas tricolores.",
]
themes = ["fiesta", "París", "banderas", "multitud", "república"]
anecdote = """
Monet contará que paseaba ese día con su material cuando divisó un \
balcón: subió a pedir permiso para pintar en él, lo obtuvo y luego volvió a bajar \
de incógnito una vez terminado su trabajo."""
