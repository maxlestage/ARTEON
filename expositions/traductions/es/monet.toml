[[artistes]]
nom = "Claude Monet"
vie = "París, 14 de noviembre de 1840 – Giverny, 5 de diciembre de 1926"
biographie = """
Nacido en París, Oscar-Claude Monet crece en El Havre, donde se da a conocer primero por \
sus caricaturas. Hacia 1857-1858, el pintor Eugène Boudin lo inicia en la pintura al \
aire libre, que será la norma de toda su vida. En París, frecuenta la Academia \
Suiza, donde conoce a Camille Pissarro, y luego, tras un servicio militar en Argelia, \
el taller de Charles Gleyre, donde traba amistad con Renoir, Sisley y Bazille. Sus \
primeras marinas son admitidas en el Salón en 1865, pero sus lienzos más audaces son \
a menudo rechazados, y la pobreza lo persigue durante veinte años. En 1870 se casa con \
Camille Doncieux, madre de su hijo Jean, y luego se refugia en Londres durante la guerra, \
donde conoce al marchante Paul Durand-Ruel. Instalado en Argenteuil, organiza con \
sus amigos la primera exposición impresionista en 1874. Camille muere en 1879, un año \
y medio después del nacimiento de su segundo hijo, Michel. Monet vive luego con Alice \
Hoschedé y sus hijos, se instala en Giverny en 1883 y se casa con Alice en 1892. Las \
series de los años 1890 le traen por fin el éxito y el desahogo. Dedica sus \
últimos treinta años a su jardín de agua y a los Nenúfares, pese a la muerte de Alice en \
1911, la de su hijo Jean en 1914 y una catarata que amenaza su vista. Al día siguiente \
del armisticio de 1918, propone al Estado sus Grandes Decoraciones; se \
instalan en la Orangerie en 1927, pocos meses después de su muerte."""
style = """
Monet es el pintor que llevó más lejos el principio impresionista: pintar \
no los objetos, sino la luz y la atmósfera que los envuelven en un instante \
dado. Su pincelada fragmentada, hecha de comas de colores yuxtapuestas, sus sombras \
coloreadas y su casi abandono del negro hacen sus lienzos inmediatamente \
reconocibles. A partir de 1890 inventa la serie, pintando el mismo motivo a \
distintas horas y estaciones, para mostrar que la percepción cambia sin cesar. En \
sus últimos años, los Nenúfares, sin horizonte ni referencia, abren el camino a la \
pintura abstracta; los expresionistas abstractos estadounidenses, después de 1945, verán en \
él a un precursor."""

[[artistes]]
nom = "Hiram Powers"
vie = "Woodstock (Vermont), 29 de julio de 1805 – Florencia, 27 de junio de 1873"
biographie = """
Hijo de granjeros de Vermont, Hiram Powers sigue a su familia a Ohio y crece en \
Cincinnati, entonces ciudad pionera en pleno auge. Ingenioso y hábil con las manos, \
trabaja primero como mecánico, luego en el Western Museum de Cincinnati, donde \
fabrica y anima figuras de cera, entre ellas una impresionante evocación del Infierno de \
Dante. Aprende modelado con un escultor de la ciudad y descubre en sí un \
talento para el retrato. Respaldado por el rico mecenas Nicholas Longworth, parte en \
1834 hacia Washington, donde realiza los bustos de numerosas personalidades, entre ellas el \
presidente Andrew Jackson. En 1837 se instala en Florencia, gran centro de la \
escultura neoclásica, donde permanecerá hasta su muerte. Su taller se convierte en una parada \
obligada para los viajeros estadounidenses e ingleses, y traba amistad con los \
poetas Elizabeth Barrett Browning y Robert Browning. El triunfo de La esclava \
griega, expuesta en Europa y en los Estados Unidos, lo convierte en el escultor estadounidense \
más célebre de su tiempo. Produce luego numerosos bustos y figuras \
ideales, como El pescador, Proserpina, Eva o la figura alegórica de América. \
Inventor a ratos, perfecciona herramientas para el trabajo del mármol. Muere \
en Florencia en 1873 y reposa en el Cementerio de los Ingleses."""
style = """
Powers es uno de los grandes representantes del neoclasicismo estadounidense. Toma de \
la Antigüedad sus ideales de belleza, calma y pureza de las formas, pero añade un \
modelado flexible y naturalista, una atención a la textura de la piel que debe mucho \
a su práctica del retrato. Sus bustos, de gran parecido, son muy \
solicitados. Sus figuras ideales asocian el desnudo antiguo con relatos morales o \
cristianos, lo que las hace aceptables para el público puritano de su país. La Esclava \
griega contribuyó en gran medida a que se aceptaran la escultura y el desnudo en los Estados Unidos, \
y abrió el camino a los numerosos escultores estadounidenses que vinieron a trabajar a Italia."""

[[artistes]]
nom = "Ferdinand Pettrich"
vie = "Dresde, 1798 – Roma, 1872"
biographie = """
Hijo del escultor Franz Pettrich, Ferdinand Pettrich nace en Dresde, en Sajonia, y se \
forma primero con su padre. Parte luego a Roma, donde se convierte en discípulo del \
escultor danés Bertel Thorvaldsen, una de las figuras principales del neoclasicismo \
europeo. En 1835 emigra a los Estados Unidos, con la esperanza de encontrar encargos \
públicos en una joven nación que adorna entonces sus edificios oficiales, empezando por \
el Capitolio. Trabaja en Washington y en Filadelfia, pero sus proyectos oficiales \
apenas llegan a buen puerto. Durante esos años, se interesa por las delegaciones amerindias \
que acuden a negociar a la capital y realiza retratos de sus jefes, así como \
figuras inspiradas en su historia, entre ellas la de Tecumseh. Decepcionado de América, \
se traslada a Brasil a principios de la década de 1840 y trabaja para la corte del emperador \
Pedro II, para quien ejecuta retratos y decoraciones. Regresa por fin a Roma \
en los años 1850 y allí termina sus días. Su obra, repartida entre tres continentes, \
da testimonio de la circulación de los artistas neoclásicos europeos en el siglo XIX, de \
su búsqueda de encargos en las naciones nuevas y de la fascinación de la época \
por los pueblos del Nuevo Mundo."""
style = """
Discípulo de Thorvaldsen, Pettrich permanece fiel al ideal neoclásico: desnudos idealizados, \
mármol pulido, poses inspiradas en la estatuaria antigua, emoción contenida. Su originalidad \
radica en la elección de sus temas: representa a amerindios que pudo observar en \
Washington, aplicándoles los códigos del héroe griego o romano. Esta mezcla \
de observación e idealización, típica de su época, contribuye a fijar la imagen \
romántica del «indio» heroico y condenado. Su obra, poco conocida del gran \
público, interesa hoy a los historiadores por lo que revela de la mirada europea \
sobre América."""

