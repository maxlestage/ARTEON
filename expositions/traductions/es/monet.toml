[[oeuvres]]
titre = "El puente japonés"
annee = "1920–1922"
image = "pont-japonais.jpg"
technique = "Óleo sobre lienzo, 89 × 116 cm"
collection = "Museum of Modern Art, Nueva York"
note = "Casi ciego, Monet pinta de memoria el puente de su jardín: rojos y dorados que anuncian la abstracción."
description = """
A primera vista, apenas se distingue el tema: un enmarañado de toques \
rojos, anaranjados, amarillos y verdes invade todo el lienzo. Poco a poco, una forma se \
perfila: el arco de una pasarela que salva el estanque de Giverny, inmersa en \
una vegetación exuberante. Las glicinias que cubren el puente y las plantas que \
lo rodean se confunden con él en una masa densa y flamígera. Abajo, unos pocos \
tonos más oscuros sugieren el agua del estanque. No hay cielo, ni horizonte, ni referencia \
de escala. El motivo, pintado veinte años antes en una luz serena y con armonías \
de verdes y azules, aparece aquí como un brasero de colores, casi \
irreconocible."""
evocation = """
Estas últimas vistas del puente se han leído a menudo a la luz de la enfermedad de Monet: \
la catarata, que le velaba la vista, alteraba su percepción de los colores, y los azules \
se desvanecían en provecho de los amarillos, los rojos y los pardos. Pero traducen también \
una libertad nueva, una pintura del gesto y de la memoria, donde el motivo cuenta menos \
que la emoción. Se ha visto en ellas la expresión de una angustia, la de un anciano que siente \
que se le escapa la vista, y al mismo tiempo una energía feroz. Durante mucho tiempo desatendidos, \
juzgados como obras de un pintor disminuido, estos lienzos fueron rehabilitados después de \
1945, cuando los pintores del expresionismo abstracto estadounidense reconocieron en ellos a un \
precursor."""
histoire = """
La pasarela de madera, pintada de verde, se construye en el jardín de agua de Giverny \
poco después de la creación del estanque, en la década de 1890; Monet la concibió \
inspirándose en las estampas japonesas que coleccionaba. La pinta por primera \
vez en serie en 1899. Hacia 1918-1924, aquejado de catarata, vuelve a ella en \
una serie de lienzos mucho más violentos, que guarda en su taller. Operado del \
ojo derecho en 1923, recupera en parte la vista. Tras su muerte, estos lienzos permanecen en \
Giverny, en casa de su hijo Michel, hasta los años cincuenta, cuando marchantes y museos, \
sobre todo estadounidenses, empiezan a interesarse por ellos. El Museum of Modern Art de Nueva York \
adquiere este gracias al fondo Mrs. Simon Guggenheim."""
facture = """
La pintura se aplica en capas espesas, frotadas, arañadas, a veces aplastadas, \
con una energía que deja visibles la huella y la dirección de cada pincelada. \
Los tonos, saturados y cálidos, se superponen sin mezclarse, dejando \
transparentar las capas inferiores. El dibujo casi ha desaparecido: el arco del puente \
solo se sugiere mediante una curva más clara en la masa. El formato, bastante grande, \
y el encuadre ceñido, sin ningún retroceso, sumergen al espectador en la propia materia de \
la pintura."""
details = [
  "La curva clara del arco, a media altura, que se adivina en la masa coloreada.",
  "Las huellas de la brocha, dejadas visibles en la pasta espesa.",
  "Los pocos tonos oscuros, abajo, que sugieren el agua del estanque.",
  "Las glicinias del puente, convertidas en un revoltijo de rojos y anaranjados.",
]
themes = ["jardín", "japonismo", "abstracción", "vejez", "color"]
anecdote = """
Abandonados tras la Segunda Guerra Mundial, la casa y el jardín de \
Giverny fueron restaurados gracias a numerosos mecenas, en gran parte estadounidenses, y \
abiertos al público en 1980; el puente japonés fue reconstruido allí idéntico al original."""
