[[oeuvres]]
titre = "El Parlamento de Londres, puesta de sol"
annee = "1903"
image = "parlement-londres.jpg"
technique = "Óleo sobre lienzo, 81 × 92 cm"
collection = "National Gallery of Art, Washington"
note = "Pintado desde el hospital de Saint Thomas: la silueta del Parlamento anegada en la niebla anaranjada del Támesis."
description = """
Al otro lado del Támesis, la silueta del palacio de Westminster, sede del \
Parlamento británico, se alza como una sombra chinesca contra un cielo incendiado. Sus torres \
neogóticas y sus agujas, de un azul violáceo, parecen recortadas en la bruma, sin \
ningún detalle de arquitectura. El sol poniente, velado por la niebla, derrama \
tras el edificio una luz anaranjada que inflama todo el cielo. El río ocupa la \
mitad inferior del lienzo; devuelve estos colores en largos toques naranjas, \
rosas y violetas que ondulan en su superficie. El límite entre la orilla y el agua es \
casi invisible, y el edificio parece flotar. Todo está envuelto en una misma \
atmósfera cargada, donde el aire, el agua y la piedra parecen hechos de la misma materia \
luminosa."""
evocation = """
El Parlamento, símbolo del poderío británico y de la democracia parlamentaria, \
se convierte en Monet en una aparición casi irreal, sin peso ni materia, que se \
disuelve en la niebla. La arquitectura ya no es más que un pretexto: el verdadero \
tema es la atmósfera de Londres, esa mezcla de bruma, de humo industrial y de \
luz filtrada que el pintor consideraba única. Se ha visto en él un homenaje a Turner, cuyos \
lienzos había admirado durante su exilio londinense, y un diálogo con los Nocturnos \
de su amigo Whistler. El cuadro habla también de la fascinación de Monet, que tiene ya más \
de sesenta años, por una ciudad que asocia a su juventud y a unos años \
difíciles."""
histoire = """
Monet había residido en Londres durante la guerra de 1870, y allí había conocido al \
marchante Paul Durand-Ruel, que se convertiría en su principal valedor. Regresa allí en \
el otoño de 1899, luego a principios de 1900 y de 1901. Instalado en el hotel Savoy, pinta \
desde su habitación los puentes de Waterloo y de Charing Cross; para el Parlamento, \
obtiene permiso para trabajar en el hospital de Saint Thomas, en la orilla opuesta. Emprende un \
número muy grande de lienzos, que concluye en Giverny a lo largo de varios años. En mayo de \
1904, Durand-Ruel expone treinta y siete de estas vistas del Támesis, con gran éxito. \
Este lienzo, fechado en 1903, pertenece más tarde al coleccionista neoyorquino Chester \
Dale, cuya colección ingresa en la National Gallery of Art en 1963."""
facture = """
Monet pinta en capas sucesivas, primero del natural y luego largamente en el taller, \
buscando la unidad de color más que la fidelidad topográfica. El cuadro \
descansa en dos familias de colores complementarios: azules y violetas para el edificio \
y las sombras, anaranjados y rosas para el cielo y sus reflejos. La silueta del palacio \
carece de contornos nítidos; está hecha de toques verticales que se funden en el \
fondo. Sobre el agua, la pincelada se vuelve horizontal y entrecortada para sugerir el movimiento del \
río. El conjunto, muy trabajado, conserva sin embargo la apariencia de una visión fugaz."""
details = [
  "Las torres del palacio, reducidas a siluetas violetas sin detalle.",
  "Los reflejos anaranjados que centellean sobre el Támesis en toques horizontales.",
  "El cielo donde la niebla y la luz del ocaso se mezclan.",
  "La línea de la orilla, casi invisible, entre el palacio y el agua.",
]
themes = ["Londres", "niebla", "río", "ocaso", "serie"]
anecdote = """
El palacio que pinta Monet es entonces casi nuevo: el antiguo Parlamento ardió en \
octubre de 1834, un incendio del que Turner fue testigo y que pintó, antes de ser \
reconstruido en estilo neogótico por Charles Barry y Augustus Pugin."""
