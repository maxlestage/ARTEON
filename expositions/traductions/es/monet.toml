[[oeuvres]]
titre = "Nenúfares"
annee = "1906"
image = "nympheas.jpg"
technique = "Óleo sobre lienzo, 89,9 × 94,1 cm"
collection = "Art Institute of Chicago"
note = "Ya no hay orilla ni cielo: solo la superficie del estanque de Giverny, sus flores y los reflejos de las nubes."
description = """
El lienzo muestra únicamente la superficie de un estanque, vista de cerca y desde arriba, sin orilla ni \
horizonte. Islotes de hojas de nenúfar, planas y redondeadas, flotan en grupos \
irregulares; algunas flores rosas y blancas se abren en ellos como puntos de \
luz. Entre las hojas, el agua oscura refleja el cielo y las nubes en amplias \
manchas azules y blancas, así como el verde profundo de los árboles y los sauces que \
bordean el estanque, fuera del cuadro. Lo alto y lo bajo se confunden: ya no se sabe \
muy bien qué flota en la superficie, qué se encuentra bajo el agua y qué se refleja \
desde arriba. La mirada vaga de un islote a otro sin hallar punto de apoyo."""
evocation = """
Con los Nenúfares, Monet hace de un rincón de su jardín un mundo completo. Al suprimir \
la orilla y el cielo, obliga a la mirada a sumergirse en el agua, donde se mezclan la superficie, \
la profundidad y el reflejo. El cuadro se convierte en un lugar de contemplación, casi de \
meditación; se lo ha acercado a menudo a la sensibilidad japonesa que Monet admiraba. \
Para muchos historiadores, estos lienzos marcan el paso de la representación de un \
paisaje a una pintura de la sensación pura, y preparan los grandes paneles de \
la Orangerie. Hablan también del repliegue del pintor envejecido sobre su jardín, que \
él mismo modeló y que se convierte para él en el universo entero."""
histoire = """
En 1893, Monet compra un terreno situado al otro lado de la carretera y de la vía \
férrea que bordean su propiedad de Giverny. Obtiene permiso para desviar una \
parte del Ru, un brazo del Epte, para excavar allí un estanque, pese a la inquietud de los \
campesinos vecinos, que temen que esas plantas exóticas envenenen el agua. Planta allí \
nenúfares, amplía el estanque en 1901 y hace de él su motivo principal. En \
1909, la galería Durand-Ruel presenta cuarenta y ocho de estos lienzos bajo el título «Los \
Nenúfares, series de paisajes de agua». Este, pintado en 1906, pertenece después al \
gran coleccionista de Chicago Martin A. Ryerson, cuya colección ingresa en el Art \
Institute en 1933."""
facture = """
Monet abandona aquí la perspectiva tradicional: ya no hay punto de fuga ni \
línea de horizonte. La composición descansa en la distribución de los islotes de hojas, que \
parecen derivar lentamente, y en las verticales de los reflejos. La pincelada varía según \
lo que describe: pequeños toques densos y horizontales para las hojas, pinceladas \
más anchas y fluidas para el agua y los reflejos del cielo. Los colores, muy \
armonizados entre sí, azules, verdes y violetas salpicados de rosa, crean una armonía \
casi musical. El formato próximo al cuadrado, inusual para un paisaje, acentúa \
la ausencia de orientación."""
details = [
  "Las flores de nenúfar, unos pocos toques rosas y blancos aplicados en relieve.",
  "El reflejo de una nube blanca que atraviesa el agua oscura.",
  "Los reflejos verticales de los árboles de la orilla, ellos mismos invisibles.",
  "Las hojas que se estrechan hacia lo alto del lienzo y sugieren la profundidad.",
]
themes = ["agua", "jardín", "reflejos", "Giverny", "contemplación"]
anecdote = """
Monet compra sus nenúfares de colores al horticultor Joseph Bory Latour-Marliac, en \
Temple-sur-Lot, cuyos híbridos rosas y amarillos habían causado sensación en \
la Exposición Universal de 1889 en París."""
