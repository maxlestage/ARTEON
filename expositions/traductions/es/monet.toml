[[oeuvres]]
titre = "La estación de Saint-Lazare"
annee = "1877"
image = "gare-saint-lazare.jpg"
technique = "Óleo sobre lienzo, 75 × 104 cm"
collection = "Museo de Orsay, París"
note = "Bajo la cubierta de cristal, el vapor de las locomotoras se vuelve luz: Monet pinta doce versiones."
description = """
Nos encontramos bajo la gran nave de la estación de Saint-Lazare, en París. Una estructura \
metálica a dos aguas, guarnecida de cristaleras, encuadra la escena como un inmenso \
triángulo. En el centro, una locomotora negra avanza hacia nosotros escupiendo una nube de \
vapor blanco y azulado que sube hasta la cubierta de cristal. A ambos lados, otros \
trenes estacionan a lo largo de los andenes, por donde circulan pequeñas siluetas de viajeros \
y empleados. En primer plano, los raíles convergen hacia el espectador. Al fondo, \
más allá de la nave abierta, aparecen a la luz las fachadas de los edificios del \
barrio de Europa, a medio velar por el humo. Todo contrasta: la sombra de la \
nave y el resplandor del día, la pesadez de las máquinas y la ligereza del vapor."""
evocation = """
Pintar una estación en 1877 es elegir el motivo más moderno que existe: el ferrocarril, \
símbolo de velocidad, de industria y de progreso. Allí donde los pintores del Salón \
buscan todavía la belleza en la Antigüedad o la mitología, Monet la encuentra en el \
humo de las locomotoras y el hierro de las cubiertas. Émile Zola, defensor de los \
impresionistas, saluda estos lienzos y estima que los artistas deben hallar la \
poesía de las estaciones como sus padres hallaron la de los bosques y los ríos. El \
vapor desempeña aquí el papel que en otras obras tienen las nubes o la bruma: una materia \
cambiante, casi inmaterial, que capta la luz. Lo que se admira no es la máquina, sino la atmósfera \
que crea, un paisaje urbano recompuesto por la \
luz."""
histoire = """
A principios de 1877, Monet, que aún vive en Argenteuil, alquila un pequeño apeadero en la calle \
de Moncey, no lejos de la estación, y obtiene permiso para pintar en el interior de \
esta y a lo largo de las vías. En pocos meses realiza una serie de vistas, desde \
los andenes, bajo la nave o al pie del puente de Europa. En abril presenta \
varias en la tercera exposición impresionista, donde atraen la atención \
de la crítica. Este lienzo es adquirido por el pintor y coleccionista Gustave \
Caillebotte, amigo y sostén económico del grupo. A su muerte en 1894, Caillebotte lega \
su colección al Estado; tras largas discusiones, solo se acepta una parte, \
entre ella este lienzo, expuesto en el Museo del Luxemburgo a partir de 1897, luego en el \
Louvre y por último en el Museo de Orsay."""
facture = """
Monet no describe la estación como un ingeniero: las líneas de la estructura, nítidas y \
geométricas, sirven de marco fijo a todo lo que se mueve. Dentro de ese triángulo, \
el vapor se pinta con toques espesos y arremolinados de blanco, de azul, de \
rosa y de gris, aplicados en plena pasta. Las locomotoras son masas oscuras sin \
detalle mecánico, los viajeros simples comas. El contraste entre la sombra de la \
nave y la luz resplandeciente del fondo crea la profundidad, mientras que el humo unifica \
el conjunto."""
details = [
  "El vapor azulado que sube hasta la cubierta de cristal y la vuelve casi transparente.",
  "Los viajeros y los empleados, reducidos a unos pocos toques oscuros sobre el andén.",
  "Los edificios soleados del fondo, entrevistos a través del humo.",
  "Los raíles del primer plano, que convergen hacia el espectador.",
]
themes = ["estación", "vapor", "modernidad", "París", "ferrocarril"]
anecdote = """
La estación de Saint-Lazare inspira también a los amigos de Monet: Manet sitúa en sus inmediaciones El \
ferrocarril (1873), y Caillebotte pinta El puente de Europa (1876), que salva las \
vías justo a la salida de la estación."""
salle = 3
mur = "est"
place = 1
