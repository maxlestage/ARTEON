[[sculptures]]
titre = "El viejo fabricante de flechas (Old Arrow Maker)"
artiste = "Edmonia Lewis"
annee = "1866–1872"
modele = "arrow-maker.stl"
technique = "Mármol"
collection = "Smithsonian American Art Museum, Washington"
note = "De la primera escultora afroamericana y amerindia reconocida: un padre y su hija, según el poema de Longfellow."
description = """
Sobre un mismo pedestal, dos personajes están sentados uno junto al otro, formando un grupo compacto. \
El anciano, inclinado sobre su labor, talla una punta de flecha en una esquirla de \
piedra, absorto en la precisión de su gesto. A su lado, su hija trenza una estera \
de juncos colocada sobre sus rodillas. La escena transcurre, según el poema que la inspira, en el \
país de los dakotas, ante la tienda del fabricante de flechas, no lejos de las cataratas de \
Minnehaha. Las dos figuras, una concentrada en su trabajo, la otra más soñadora, \
se inscriben en una silueta piramidal. El formato es modesto, unos cincuenta \
centímetros de alto, lo que invita a acercarse para observar las manos y las \
herramientas. Nada dramático: es una escena de la vida cotidiana, impregnada de calma \
y de ternura."""
evocation = """
La obra ilustra un episodio de El canto de Hiawatha (1855) de Henry Wadsworth Longfellow, \
poema entonces inmensamente popular: Minnehaha, «Agua que ríe», vive junto a su \
padre, el viejo fabricante de flechas, antes de que el héroe Hiawatha venga a pedirla \
en matrimonio. Lewis elige un instante apacible, sin el héroe, centrado en el vínculo entre \
un padre y su hija y en el trabajo de las manos. Para una artista de ascendencia ojibwa \
por parte de madre, este tema era también una manera de representar a los pueblos indígenas \
con dignidad, lejos de las imágenes de salvajes amenazadores o de guerreros moribundos. Los \
historiadores recuerdan sin embargo que pasa por el filtro de un poema escrito por un \
blanco, de idealización plenamente romántica."""
histoire = """
Edmonia Lewis se instala en Roma hacia 1865-1866 y abre allí su taller. Encuentra \
pronto en el poema de Longfellow una fuente de inspiración y realiza varios \
bustos y grupos dedicados a Hiawatha y a Minnehaha, que gustan especialmente \
a los viajeros y coleccionistas estadounidenses de paso. El grupo del Viejo fabricante \
de flechas se concibe desde 1866, y se talla luego en mármol en varias ocasiones; este \
ejemplar data de 1872. La artista conoce a Longfellow durante su estancia en Roma, a \
finales de la década de 1860, y realiza después su busto, conservado en la Universidad de Harvard. \
Estos temas amerindios aseguran al taller de Lewis una clientela fiel durante cerca \
de dos décadas."""
facture = """
A diferencia de muchos escultores instalados en Roma, que confiaban la talla de \
sus mármoles a oficiales italianos, Lewis se empeñaba en realizar ella misma gran \
parte del trabajo, entre otras cosas para que no se pudiera negar que sus obras eran \
de su mano. El grupo obedece a los principios del neoclasicismo: mármol blanco, \
superficies lisas, gestos mesurados. Pero la artista introduce en él detalles precisos, \
peinados, vestidos o herramientas, que anclan la escena en una cultura particular. El \
pequeño formato conviene a una clientela privada."""
details = [
  "Las manos del anciano, ocupadas en tallar una punta de flecha.",
  "La estera de juncos que trenza la joven sobre sus rodillas.",
  "Los peinados y los vestidos, esculpidos con gran esmero en el detalle.",
  "La forma piramidal del grupo, que une al padre y a la hija.",
]
themes = ["amerindios", "familia", "literatura", "neoclasicismo", "trabajo"]
anecdote = """
La muerte de Cleopatra, presentada por Lewis en Filadelfia en 1876, tuvo un destino \
asombroso: sirvió durante mucho tiempo de monumento funerario a un caballo de carreras llamado \
Cleopatra, cerca de Chicago, antes de ser redescubierta y donada al Smithsonian en \
1994."""
