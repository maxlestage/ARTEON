[[oeuvres]]
titre = "Crepúsculo (La partida de croquet)"
artiste = "Pierre Bonnard"
annee = "1892"
image = "partie-de-croquet.jpg"
technique = "Óleo sobre lienzo, 130,5 × 162,5 cm"
collection = "Museo de Orsay, París"
note = "Un final de jornada en familia en el Delfinado, transformado en tapiz de motivos y siluetas."
description = """
La tarde cae sobre un jardín. En primer plano, una masa de follaje oscuro ocupa la parte baja del cuadro. En medio, unos jugadores de croquet permanecen inmóviles: a la izquierda, un hombre de chaqueta clara y sombrero de paja; en el centro, una mujer de vestido verde pálido con motivos, apoyada en su mazo, junto a un perro blanco; a su lado, otra mujer, de espaldas, con un vestido de grandes cuadros oscuros que se confunde con la sombra. A la derecha, sobre el césped todavía iluminado, una ronda de muchachas de vestidos claros baila en la luz dorada. Arriba, bajo una cortina de hojas, el cielo del ocaso se incendia con nubes naranjas. El pequeño aro del juego está clavado en la hierba."""
evocation = """
Bonnard parte de un momento banal, una partida de croquet en familia, y hace de él una imagen de ensueño. Los jugadores, en los que se reconoce habitualmente al padre y a la hermana del pintor, parecen inmovilizados en la tarde, mientras que la ronda luminosa de la derecha parece venir de otro mundo, como una danza de ninfas o un recuerdo de infancia. Se ha visto en él el paso del día a la noche, de lo real a lo imaginario. El cuadro dice también el gusto de los nabis por la vida íntima y familiar, apartada de los grandes temas, y su voluntad de hacer de la pintura una superficie decorativa, como un biombo o un tapiz."""
histoire = """
Bonnard pinta el lienzo en Le Grand-Lemps, en el Isère, donde su familia posee una propiedad y donde pasa sus veranos. Tiene entonces veinticinco años y acaba de renunciar a una carrera de jurista: en 1891, su cartel France-Champagne, pegado en París, lo dio a conocer, y comparte un taller en la rue Pigalle con Vuillard, Maurice Denis y el hombre de teatro Lugné-Poe. Miembro del grupo de los nabis desde 1889, busca una pintura nueva, nutrida del ejemplo de Gauguin y de las estampas japonesas. Este gran cuadro es una de sus primeras composiciones ambiciosas. Se encuentra hoy en el Museo de Orsay, que conserva un rico conjunto de obras nabis."""
facture = """
Bonnard aplana el espacio: no hay perspectiva nítida, sino planos superpuestos como decorados de teatro. Los tejidos se convierten en motivos, los cuadros y las flores de los vestidos están tratados en plano, a la manera de las estampas japonesas que admira. Los follajes forman arabescos festoneados. Los contrastes de luz, sombra espesa a la izquierda y verde deslumbrante a la derecha, estructuran el lienzo. Las figuras son siluetas sin modelado, casi recortadas."""
details = [
  "El vestido de cuadros de la mujer vista de espaldas, tratado como un motivo plano.",
  "La ronda de muchachas, a la derecha, en la luz dorada.",
  "El pequeño aro de croquet clavado en la hierba.",
  "Las nubes naranjas del ocaso, arriba a la derecha.",
  "La firma y la fecha, arriba a la izquierda.",
]
themes = ["familia", "jardín", "crepúsculo", "japonismo", "nabis"]
anecdote = """
Sus amigos nabis lo apodaban «el nabi muy japonés». En 1890, la gran exposición de estampas japonesas de la Escuela de Bellas Artes lo había conmovido: descubre allí que se puede sugerir el espacio sin perspectiva, con superficies planas y motivos."""
