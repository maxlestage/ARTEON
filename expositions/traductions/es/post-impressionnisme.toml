[[oeuvres]]
titre = "La gitana dormida"
artiste = "Henri Rousseau"
annee = "1897"
image = "bohemienne-endormie.jpg"
technique = "Óleo sobre lienzo, 129,5 × 200,7 cm"
collection = "Museum of Modern Art, Nueva York"
note = "En el desierto, bajo la luna, un león olfatea a una durmiente sin devorarla: un sueño en suspenso."
description = """
Es de noche, en un desierto de arena. En primer plano, una mujer de piel oscura duerme tendida en el suelo, vestida con una larga túnica de rayas multicolores; todavía sostiene un bastón de caminante. Junto a ella hay una mandolina y un cántaro de barro cocido. Un león de espesa melena se alza sobre ella, con la cola erguida, y la olfatea sin atacarla; su ojo brilla. Detrás se extiende una superficie de agua bordeada de montañas rosas y grises. El cielo azul noche, inmenso, ocupa casi la mitad del lienzo; arriba a la derecha, una luna llena de rostro humano ilumina la escena, y unas pocas estrellas centellean."""
evocation = """
Rousseau describió él mismo su tema: una negra errante, tañedora de mandolina, duerme profundamente, con su cántaro a su lado; un león pasa por casualidad, la olfatea y no la devora, bajo un efecto de luna muy poético. El cuadro se sostiene por entero en esta suspensión. Nada se mueve, ningún ruido: la amenaza y la paz coexisten. Se ha visto en él una imagen del sueño, pudiendo ser el león el que la durmiente ve en sueños, o una fábula sobre la protección de la inocencia. Los surrealistas admiraron esta lógica onírica, que aproxima sin explicación elementos ajenos unos a otros."""
histoire = """
Rousseau expone el lienzo en el Salón de los Independientes de 1897, donde sus obras suelen hacer reír al público. Propone luego venderlo a la ciudad de Laval, su ciudad natal, que lo rechaza. El cuadro desaparece entonces durante más de veinticinco años. Reaparece en París en 1923, cuando las vanguardias descubren a Rousseau y lo celebran como un precursor. Es adquirido por el gran coleccionista neoyorquino John Quinn y, tras la muerte de este, pasa a otras manos antes de ser donado en 1939 al Museum of Modern Art de Nueva York por Mrs. Simon Guggenheim."""
facture = """
Rousseau pinta con una minucia lisa: ninguna pincelada visible, contornos nítidos, colores puestos en superficies planas cuidadosamente degradadas. La perspectiva es simple y algo rígida, las proporciones aproximadas, pero la composición está muy estudiada: dos grandes bandas horizontales, el suelo y el cielo, y en el centro el león y la durmiente superpuestos. Las vivas rayas del vestido contrastan con la gama nocturna de azules y pardos. La melena del león está expresada mecha por mecha."""
details = [
  "La luna de rostro humano, arriba a la derecha.",
  "La mandolina y el cántaro colocados junto a la durmiente.",
  "Los pies descalzos de la mujer, a la izquierda, y sus ojos entornados.",
  "La cola erguida del león, trazada de un solo trazo contra el cielo.",
  "La firma y la fecha, abajo a la derecha.",
]
themes = ["noche", "desierto", "sueño", "león", "arte naíf"]
anecdote = """
Laval no quiso el cuadro en 1897. Hoy, la ciudad honra a su pintor: el Vieux-Château alberga un museo dedicado al arte naíf, y todavía se puede ver la porte Beucheresse, la torre de las antiguas murallas donde nació."""
