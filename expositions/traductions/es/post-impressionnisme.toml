[[artistes]]
nom = "Georges Seurat"
vie = "París, 2 de diciembre de 1859 – París, 29 de marzo de 1891"
biographie = """
Hijo de una familia parisina acomodada, Georges Seurat ingresa en 1878 en la Escuela de Bellas Artes, en el taller de Henri Lehmann, alumno de Ingres. Allí aprende el dibujo clásico, pero lee sobre todo a los sabios del color, Chevreul y Ogden Rood, y al crítico Charles Blanc. Tras su servicio militar en Brest, se consagra a potentes dibujos al lápiz Conté, todo en sombras aterciopeladas. En 1884, su gran lienzo Un baño en Asnières es rechazado en el Salón: lo expone con otros rechazados y participa en la fundación de la Sociedad de Artistas Independientes, donde conoce a Paul Signac. La Grande Jatte, mostrada en 1886, lo convierte en cabeza de fila de un movimiento nuevo, el neoimpresionismo, al que se suman durante un tiempo Pissarro y jóvenes pintores franceses y belgas. Discreto, metódico, pinta después Las modelos, Parada de circo, El chahut, y pasa sus veranos en las costas del Canal de la Mancha. Muere bruscamente en marzo de 1891, a los treinta y un años, cuando El circo, inacabado, se expone en los Independientes. Su familia descubre entonces que vivía con una joven, Madeleine Knobloch, con quien tenía un hijo."""
style = """
Seurat inventa una pintura basada en la ciencia: pequeños puntos de colores puros, yuxtapuestos según las leyes de los contrastes, que el ojo del espectador mezcla a distancia. Sus composiciones, muy construidas, inmovilizan la vida moderna en una quietud solemne. Su método, proseguido por Signac, alimentó el fauvismo de Matisse, el cubismo y la abstracción, que recogieron su lección: un cuadro es un ensamblaje meditado de colores y de líneas."""

[[artistes]]
nom = "Paul Signac"
vie = "París, 11 de noviembre de 1863 – París, 15 de agosto de 1935"
biographie = """
Nacido en una familia de comerciantes parisinos, Paul Signac abandona sus estudios de arquitectura por la pintura tras descubrir a Monet. Casi autodidacta, participa en 1884 en la fundación de la Sociedad de Artistas Independientes, donde traba amistad con Georges Seurat; adopta enseguida su método del color dividido y se convierte en su aliado más fiel. Tras la muerte de Seurat en 1891, es él quien defiende y mantiene vivo el neoimpresionismo. Marino apasionado, navega en numerosos veleros y descubre en 1892 el pequeño puerto de Saint-Tropez, donde se instala parte del año. En 1899, publica De Eugène Delacroix al neoimpresionismo, que expone la teoría del movimiento. Acoge a Matisse en Saint-Tropez en 1904 e influye directamente en los inicios del fauvismo. Próximo a los medios anarquistas, da dibujos a sus periódicos. Presidente durante mucho tiempo de la Sociedad de Artistas Independientes, a partir de 1908, pinta también innumerables acuarelas de puertos, de Marsella a Venecia y a Constantinopla. Muere en París en 1935."""
style = """
Signac amplía el punto de Seurat en pinceladas cuadradas, más grandes y más libres, puestas como las teselas de un mosaico. Sus colores se vuelven cada vez más deslumbrantes y decorativos. Sus puertos y sus marinas, bañados de luz mediterránea, y sus acuarelas rápidas muestran a un pintor más lírico que teórico. Por su libro y por su ejemplo, transmitió el color puro a los fauves."""

[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi, 24 de noviembre de 1864 – castillo de Malromé (Gironda), 9 de septiembre de 1901"
biographie = """
Henri de Toulouse-Lautrec nace en una antigua familia aristocrática del Mediodía; sus padres son primos hermanos. Adolescente, se rompe las dos piernas en 1878 y 1879: dejan de crecer, sin duda a causa de una enfermedad ósea hereditaria. Apartado de la vida de castillo, se consagra al dibujo, se forma con Princeteau y después, en París, con Bonnat y en el taller de Cormon, donde frecuenta a Émile Bernard, Louis Anquetin y Vincent van Gogh. Instalado en Montmartre, pinta sus cabarés, sus bailes y sus artistas: Aristide Bruant, La Goulue, Jane Avril, Yvette Guilbert. Su cartel para el Moulin Rouge, en 1891, lo hace célebre; dibuja una treintena y centenares de litografías. Observa también, sin juzgar, la vida de las casas de citas. Minado por el alcohol, es internado en 1899 en una clínica de Neuilly, donde dibuja de memoria una serie sobre el circo para probar su lucidez. Muere a los treinta y seis años en el castillo de Malromé, en casa de su madre. Esta y su amigo Maurice Joyant ofrecen sus obras a Albi, donde el museo Toulouse-Lautrec abre en 1922."""
style = """
Lautrec es ante todo un dibujante: una línea rápida, nerviosa, que capta una actitud, un tic, un rostro en unos pocos trazos. Toma de Degas y de las estampas japonesas los encuadres cortados y las vistas picadas, y pinta a menudo con esencia, sobre cartón, en pinceladas entrecortadas. Sus carteles, de superficies planas francas y rotulado integrado, fundaron el cartel moderno e inspiraron a generaciones de grafistas."""

[[artistes]]
nom = "Paul Sérusier"
vie = "París, 9 de noviembre de 1864 – Morlaix, 7 de octubre de 1927"
biographie = """
Hijo de una familia parisina acomodada, Paul Sérusier cursa sólidos estudios en el liceo Condorcet antes de ingresar en la Academia Julian, de la que llega a ser el massier, el alumno encargado de representar a los demás. En el verano de 1888, en Pont-Aven, conoce a Paul Gauguin, que le hace pintar el pequeño paisaje del Bois d'Amour que se llamará el Talismán. A su regreso, funda con Maurice Denis, Pierre Bonnard, Paul Ranson y Henri-Gabriel Ibels el grupo de los nabis, de una palabra hebrea que significa profetas, sugerida por el poeta Henri Cazalis. En 1889 y 1890, se une a Gauguin en Le Pouldu. Curioso de filosofía y de teosofía, traba amistad con el pintor holandés Jan Verkade y descubre con él, en la abadía benedictina de Beuron, en Alemania, una teoría de las proporciones sagradas. Se instala poco a poco en Bretaña, en Châteauneuf-du-Faou, donde pinta campesinos y leyendas. Enseña en la Academia Ranson y publica en 1921 un pequeño tratado, el ABC de la pintura. Muere en Morlaix en 1927."""
style = """
Sérusier es el teórico de los nabis: traduce en principios la lección de Gauguin, colores puros, formas simplificadas, rechazo de la imitación. Sus lienzos bretones asocian superficies planas decorativas y figuras estilizadas, de una gravedad casi religiosa. Más tarde, busca en la geometría y los números una armonía universal. Su Talismán sigue siendo una etapa decisiva hacia la pintura no figurativa."""

[[artistes]]
nom = "Émile Bernard"
vie = "Lille, 28 de abril de 1868 – París, 16 de abril de 1941"
biographie = """
Nacido en Lille, Émile Bernard llega niño a París y entra a los dieciséis años en el taller de Fernand Cormon, donde traba amistad con Toulouse-Lautrec, Louis Anquetin y Vincent van Gogh; es expulsado de él en 1886 por insubordinación. Parte entonces a pie por Normandía y Bretaña. Con Anquetin, perfecciona en 1887 el cloisonismo, superficies de color planas perfiladas con trazos oscuros como las vidrieras. En 1888, en Pont-Aven, pinta las Bretonas en el prado e intercambia con Gauguin las ideas de las que nace el sintetismo; en 1889, exponen juntos en el café Volpini, al margen de la Exposición Universal. Bernard se enemista después con Gauguin, a quien reprocha haber confiscado la invención. Muy creyente, se vuelve hacia la pintura religiosa, viaja a Italia y después vive una decena de años en Egipto, en El Cairo. De regreso en Francia, visita a Cézanne en Aix en 1904 y publica sus conversaciones; publica también las cartas que Van Gogh le había dirigido. Defiende desde entonces un retorno a la tradición de los maestros antiguos y muere en París en 1941."""
style = """
En sus años decisivos, de 1887 a 1891, Bernard simplifica radicalmente la pintura: grandes zonas de color puro, contornos oscuros, perspectiva abolida, influencias de las vidrieras, de las estampas japonesas y de la imaginería popular. Este lenguaje, compartido con Gauguin, abrió el camino a los nabis y al simbolismo. Su pintura más tardía, más clásica, quedó a la sombra de sus comienzos."""

[[artistes]]
nom = "Pierre Bonnard"
vie = "Fontenay-aux-Roses, 3 de octubre de 1867 – Le Cannet, 23 de enero de 1947"
biographie = """
Hijo de un alto funcionario del Ministerio de la Guerra, Pierre Bonnard cursa la licenciatura en derecho para tranquilizar a su padre, mientras frecuenta la Academia Julian, donde conoce a Sérusier, Maurice Denis y Ranson, y después la Escuela de Bellas Artes, donde traba amistad con Vuillard. Se une a los nabis, y su cartel France-Champagne, en 1891, le permite consagrarse al arte. Dibuja para La Revue blanche, ilustra libros para el marchante Ambroise Vollard, trabaja para el teatro y realiza biombos y litografías. En 1893, conoce a Marthe, de verdadero nombre Maria Boursin, que será su modelo de toda la vida y con quien se casa en 1925. Después de 1900, su paleta se aclara: pinta el Sena en Vernon, no lejos de Monet en Giverny, y después la luz del Mediodía. En 1926, compra una villa en Le Cannet, sobre Cannes, donde trabaja hasta su muerte, en 1947. Discreto, poco teórico, retocaba sin cesar sus lienzos, incluso colgados."""
style = """
Joven nabi, Bonnard compone superficies decorativas inspiradas en las estampas japonesas: superficies planas, motivos de tejidos, encuadres audaces, humor. Se convierte después en un inmenso colorista, que pinta de memoria interiores, jardines y desnudos bañados por una luz vibrante. Su libertad en el color y en la composición contó mucho para la pintura del siglo XX."""

[[artistes]]
nom = "Édouard Vuillard"
vie = "Cuiseaux (Saona y Loira), 11 de noviembre de 1868 – La Baule, 21 de junio de 1940"
biographie = """
Hijo de un oficial retirado, Édouard Vuillard se instala de niño en París con su familia. En el liceo Condorcet, traba amistad con Ker-Xavier Roussel, Maurice Denis y Aurélien Lugné-Poe, y después se une en la Academia Julian al grupo de los nabis. Tras la muerte de su padre, su madre mantiene un taller de costura en el piso familiar: esos interiores, esas mujeres trabajando y esas telas se convierten en sus primeros temas. Dibuja decorados y programas para el teatro de l'Œuvre de Lugné-Poe y frecuenta a los hermanos Natanson, fundadores de La Revue blanche, y a Misia, la esposa de uno de ellos. Pinta grandes paneles decorativos, como los Jardines públicos encargados en 1894 por Alexandre Natanson. Más tarde, se convierte en un retratista solicitado de la buena sociedad parisina, a menudo captada en su casa, en su decorado. Vive con su madre hasta la muerte de esta, en 1928, e ingresa en la Academia de Bellas Artes en 1937. Muere en La Baule en junio de 1940, durante el éxodo."""
style = """
Vuillard es el pintor de la intimidad. En pequeños formatos de colores sordos, mezcla figuras, papeles pintados y tejidos en un mosaico de motivos donde el espacio se pierde. Sus escenas silenciosas sugieren los sentimientos más que los muestran. En sus grandes decorados, recupera la suavidad mate del tapiz, gracias a la pintura al temple de cola."""

[[artistes]]
nom = "Henri Rousseau"
vie = "Laval, 21 de mayo de 1844 – París, 2 de septiembre de 1910"
biographie = """
Hijo de un hojalatero de Laval, Henri Rousseau se hace escribiente en casa de un procurador y después se alista en el ejército. En 1871, entra en el fielato de París, la administración que percibe los impuestos sobre las mercancías que entran en la ciudad: de ahí viene su apodo de Aduanero, aunque nunca fue aduanero. Pinta como autodidacta en sus ratos libres y expone a partir de 1886 en el Salón de los Independientes, abierto a todos, sin jurado. El público y la crítica se burlan de sus lienzos, que sigue enviando cada año. En 1893, se jubila para consagrarse a la pintura, da lecciones de violín y de dibujo y vive pobremente. Traba amistad con Alfred Jarry, también nacido en Laval, y después con Apollinaire, Robert Delaunay y Picasso, que organiza en 1908 un banquete en su honor en el Bateau-Lavoir. Tras ¡Sorpresa!, su primera selva, en 1891, pinta una veintena a partir de 1904. Muere en septiembre de 1910 en el hospital Necker, poco después de haber expuesto El sueño."""
style = """
Rousseau pinta sin formación académica, con una aplicación minuciosa: contornos nítidos, colores lisos, perspectiva ingenua, figuras frontales. Sus selvas, inventadas a partir de los invernaderos parisinos y de imágenes de álbumes, tienen una extrañeza onírica. Admirado por Picasso, Apollinaire y después los surrealistas, abrió el camino al reconocimiento del arte naíf."""
