[exposition]
ordre = 130
nom_court = "Posimpresionismo"
mouvement = "Neoimpresionismo, nabis y arte naíf"
cadre = "blanc"
couleur = "#2f6b5a"
titre = "Después del impresionismo: puntos, superficies planas y sueños"
artiste = "Seurat, Signac, Toulouse-Lautrec, el Aduanero Rousseau, los nabis…"
dates = "1884–1910"
accroche = "Exposición virtual · Art Institute of Chicago"
introduction = """
Después de 1884, jóvenes pintores quieren superar el impresionismo: Seurat y Signac descomponen el color en puntos, Toulouse-Lautrec capta la noche de Montmartre, Sérusier, Bonnard y Vuillard, los nabis, disponen superficies planas y motivos como en una estampa japonesa, y el Aduanero Rousseau pinta sueños de selva. Diez obras, de La Grande Jatte a El sueño. El edificio se inspira en el Art Institute of Chicago: se entra por la gran escalera, La Grande Jatte aguarda sola al fondo de la galería 240, y el Aduanero Rousseau ocupa una sala blanca y luminosa como las del Modern Wing."""
vitrine = "grande-jatte.jpg"

[musee]
nom = "Art Institute of Chicago"
ville = "Chicago, Estados Unidos"
architecte = "Shepley, Rutan and Coolidge"
construction = "1892–1893"
presentation = """
Fundado en 1879 como escuela y museo, el Art Institute se instala en 1893 en un palacio de estilo Beaux-Arts levantado en Michigan Avenue, junto a Grant Park, por el estudio bostoniano Shepley, Rutan and Coolidge: el edificio acogió primero los congresos de la Exposición Universal de 1893. Dos leones de bronce de Edward Kemeys guardan su entrada desde 1894. En el interior, una gran escalera de piedra conduce a las galerías de la planta superior, donde se encuentra uno de los conjuntos impresionistas y posimpresionistas más ricos fuera de Francia, con La Grande Jatte de Seurat, adquirida en 1926, y El dormitorio de Van Gogh. En 2009, el museo se amplía con el Modern Wing de Renzo Piano, de galerías blancas iluminadas por una cubierta que tamiza la luz del día. Es hoy uno de los mayores museos de arte de los Estados Unidos."""
ici = """
ARTEON conserva su gran ritmo. La gran escalera, un vestíbulo de piedra clara de 12 metros de altura, recibe al visitante por el sur y da acceso a tres salas. Al norte, la Galería 240 · El punto guarda La Grande Jatte sola en medio de su muro del fondo. Al oeste, Pont-Aven y los nabis; al este, Las noches de Montmartre, cuya puerta norte se abre a la última sala, El Aduanero Rousseau: la más blanca y, con 7 metros de altura, la más alta de las galerías, como en el Modern Wing. Las demás salas miden de 5,5 a 6 metros de altura."""

