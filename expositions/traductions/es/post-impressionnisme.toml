[[oeuvres]]
titre = "El sueño"
artiste = "Henri Rousseau"
annee = "1910"
image = "le-reve.jpg"
technique = "Óleo sobre lienzo, 204,5 × 298,5 cm"
collection = "Museum of Modern Art, Nueva York"
note = "Su último gran lienzo: una mujer desnuda en un canapé, transportada en sueños al corazón de una selva."
description = """
A la izquierda, una mujer desnuda de largos cabellos oscuros yace sobre un canapé de terciopelo rojo, con el brazo tendido hacia el bosque. Alrededor se extiende una selva exuberante: inmensas flores azules, rosas y blancas, hojas de todos los matices del verde, un árbol cargado de frutos naranjas, pájaros y monos en las ramas. En el centro, en la penumbra, un encantador de piel oscura, vestido con un paño a rayas, toca la flauta. Dos leones de ojos redondos miran a través de las hierbas; detrás del follaje se oculta una cabeza de elefante, y una serpiente anaranjada se desliza por la hierba a la derecha. Arriba, una luna llena brilla en un cielo claro."""
evocation = """
Rousseau dio la clave del cuadro: la mujer dormida en su canapé sueña que es transportada a este bosque y oye la música del encantador. La acompaña con un pequeño poema en el que la durmiente lleva el nombre de Yadwigha. El mueble de salón perdido en plena selva aproxima dos mundos, lo cotidiano parisino y el exotismo imaginario, como hace el sueño. Se ha visto en él una celebración de la sensualidad y de la imaginación, y una prefiguración del surrealismo, que hará del sueño una fuente de imágenes. Las fieras de ojos desorbitados, más asombradas que feroces, dan a la escena una extrañeza serena, entre paraíso y amenaza."""
histoire = """
Rousseau presenta El sueño en el Salón de los Independientes en marzo de 1910, acompañado de su poema. Esta vez, ya no es solo objeto de burla: desde hace unos años, Picasso, Apollinaire, Delaunay y toda una joven generación lo admiran, y Apollinaire saluda el cuadro en la prensa. Es su última gran obra: Rousseau muere unos meses más tarde, en septiembre de 1910, en el hospital Necker, por una herida en la pierna mal curada. El marchante Ambroise Vollard adquiere el lienzo, que pasa luego por varias colecciones antes de ser donado en 1954 al Museum of Modern Art de Nueva York por Nelson A. Rockefeller."""
facture = """
Rousseau construye su selva como un decorado de teatro, por planos superpuestos de follajes recortados uno a uno. Cada hoja está perfilada, pintada en plano, en una gama de verdes de asombrosa variedad. Nunca vio una selva tropical: dibuja las plantas de los invernaderos del Jardin des Plantes de París y copia animales en álbumes ilustrados. Las figuras tienen la rigidez de las imágenes populares, pero el conjunto posee una precisión y una riqueza decorativas que fascinaban a los pintores modernos."""
details = [
  "El canapé rojo, mueble de salón parisino extraviado en la selva.",
  "El encantador de la flauta, casi invisible en la sombra, en el centro.",
  "Los dos leones de ojos redondos que miran fijamente al espectador.",
  "La cabeza de elefante medio oculta entre el follaje, a la izquierda del encantador.",
  "La serpiente anaranjada que se desliza por la hierba, a la derecha.",
]
themes = ["selva", "sueño", "desnudo", "exotismo", "arte naíf"]
anecdote = """
Durante mucho tiempo se contó que Rousseau había visto los bosques de México durante su servicio militar. Es una leyenda, quizá alimentada por él mismo: nunca salió de Francia, y sus selvas nacieron en los invernaderos del Jardin des Plantes."""
