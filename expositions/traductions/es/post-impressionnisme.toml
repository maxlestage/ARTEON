[[oeuvres]]
titre = "Interior, madre y hermana del artista"
artiste = "Édouard Vuillard"
annee = "1893"
image = "mere-et-soeur.jpg"
technique = "Óleo sobre lienzo, 46,3 × 56,5 cm"
collection = "Museum of Modern Art, Nueva York"
note = "La madre, maciza y serena; la hermana, como absorbida por el papel pintado: un cónclave familiar."
description = """
En una pequeña estancia abarrotada, la madre del pintor está sentada muy derecha en una silla, en el centro, vestida con un traje negro que forma una masa compacta; sus manos reposan sobre las rodillas y nos mira. A la izquierda, su hija Marie, con un vestido de cuadros, se mantiene doblada por la mitad, torpemente, con la espalda encorvada contra el muro: su vestido se confunde casi con el papel pintado cubierto de manchas pardas y claras. Detrás de la madre, un mueble rojo parduzco; en el borde derecho, una pequeña mesa en la que hay un plato y un paño blanco. El suelo ocre sube en pendiente pronunciada hacia el fondo."""
evocation = """
Bajo su apariencia de escena cotidiana, el cuadro expresa una tensión. La madre, sólida e inmóvil, ocupa el lugar central; la hija, arrinconada a un lado, parece aplastada, como si la estancia la rechazara. Se han leído en él las relaciones de fuerza de una familia replegada sobre sí misma, y un eco del año 1893, en que Marie se casa con Ker-Xavier Roussel, amigo de Vuillard. El pintor, que vivirá siempre junto a su madre, observa a sus allegados con ternura pero sin afeites. Es el intimismo según Vuillard: pequeños interiores donde los motivos de los tejidos y de los papeles pintados cuentan tanto como los rostros."""
histoire = """
Tras la muerte de su padre, Vuillard vive en París con su madre, que mantiene a la familia con un taller de costura y corsés en el piso, y con su hermana Marie. Ese pequeño mundo femenino, las obreras, las telas, los gestos del trabajo, se convierte en su tema favorito. En 1893, año del cuadro, Marie se casa con el pintor Ker-Xavier Roussel, compañero de Vuillard en el liceo Condorcet y, como él, miembro de los nabis. Vuillard expone entonces con sus amigos y trabaja para el teatro de l'Œuvre de Lugné-Poe. El cuadro ingresó en el Museum of Modern Art de Nueva York en 1934."""
facture = """
Vuillard trabaja en pequeño formato, con una materia bastante seca y mate. Casi suprime el espacio: el papel pintado, el vestido de cuadros y el mueble forman un mosaico de motivos en el que las figuras se engastan. Los colores son sordos, pardos, ocres, negros, avivados por unas pocas manchas claras. La perspectiva está voluntariamente falseada, con un suelo que se vuelca hacia el espectador, como en las estampas japonesas, lo que refuerza la impresión de asfixia."""
details = [
  "La hermana encorvada a la izquierda, con su vestido de cuadros casi fundido en el papel pintado.",
  "Las manos de la madre apoyadas planas sobre las rodillas.",
  "El suelo que sube en pendiente pronunciada hacia el fondo.",
  "El plato y el paño blanco sobre la pequeña mesa, en el borde derecho.",
]
themes = ["familia", "interior", "intimismo", "motivo", "nabis"]
anecdote = """
Vuillard vivió con su madre hasta la muerte de esta, en 1928; tenía entonces casi sesenta años. Ella aparece en cientos de sus cuadros, de sus dibujos y de sus fotografías."""
salle = 3
mur = "sud"
place = 2
