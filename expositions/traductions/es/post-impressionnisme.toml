[[oeuvres]]
titre = "Un domingo por la tarde en la isla de la Grande Jatte"
artiste = "Georges Seurat"
annee = "1884–1886"
image = "grande-jatte.jpg"
technique = "Óleo sobre lienzo, 207,5 × 308,1 cm"
collection = "Art Institute of Chicago"
note = "Dos años de trabajo y decenas de estudios para un paseo dominical inmovilizado como un friso: el manifiesto del neoimpresionismo."
description = """
En una isla del Sena, a las puertas de París, unos paseantes disfrutan de un domingo de verano a orillas del agua. A la derecha, en primer plano, una pareja de perfil: la mujer, con vestido de polisón y sombrilla, lleva atado con una correa a un pequeño mono; el hombre lleva sombrero de copa y bastón. A la izquierda, un remero en camiseta sin mangas fuma en pipa, tendido en la hierba junto a un caballero de sombrero alto y una mujer sentada. En el centro, una madre y su niña de blanco caminan hacia nosotros. En otras partes, siluetas inmóviles: una pescadora a la orilla, dos soldados, un trompetista, una niña que corre. Sobre el río se deslizan veleros, una yola y un barco de vapor, mientras las sombras de los árboles cebrean el césped."""
evocation = """
Seurat pinta un ocio moderno en el que se cruzan todas las clases: burgueses, remeros, soldados, nodrizas. Pero nada se mueve. Los personajes, rígidos y solemnes, a menudo de perfil, parecen salidos de un friso antiguo; un amigo del pintor cuenta que quería hacer desfilar a la gente de hoy como en los frisos del Partenón. Los historiadores han leído en él mensajes distintos: una sátira discreta de la burguesía dominical, donde la mujer del mono pasaría por una mujer mantenida y la pescadora por un juego de palabras sobre el pecado; una imagen de la soledad en la multitud, cada cual aislado en su burbuja; o, por el contrario, para sus amigos anarquistas, la promesa de una sociedad armoniosa. Esa ambigüedad es su fuerza."""
histoire = """
Seurat comienza el lienzo en 1884, después de Un baño en Asnières, que mostraba a obreros en la otra orilla. Durante dos años, acude a la isla a observar a los paseantes y acumula pequeños estudios pintados sobre madera y dibujos al lápiz Conté, y luego compone el cuadro en el taller. En 1885, lo retoma por completo con su nueva técnica de puntos. Mostrado en mayo de 1886 en la octava y última exposición impresionista, provoca risas y escándalo; el crítico Félix Fénéon lo defiende y acuña la palabra neoimpresionismo. Expuesto después en los Independientes, y en Bruselas en 1887, es adquirido en 1924 por el coleccionista de Chicago Frederic Clay Bartlett, que lo dona al Art Institute en 1926, en memoria de su esposa Helen."""
facture = """
Sobre una primera capa aplicada con amplias pinceladas cruzadas, Seurat yuxtapone pequeños puntos de colores puros, en lugar de mezclarlos en la paleta: vistos a distancia, se funden en el ojo del espectador. Aplica las leyes del contraste simultáneo de Chevreul y los trabajos del físico estadounidense Ogden Rood, colocando junto a un color su complementario para hacerlo vibrar. La composición está regulada como una arquitectura, hecha de verticales, horizontales y perfiles paralelos. Hacia 1888-1889, añade un borde pintado de puntos oscuros para asegurar la transición con el marco."""
details = [
  "El pequeño mono atado con correa por la mujer de la sombrilla, a la derecha.",
  "La niña de blanco, en el centro, que camina hacia el espectador.",
  "El borde de puntos oscuros pintado alrededor del lienzo, añadido a posteriori.",
  "El perro negro que hurga en la hierba, en primer plano.",
  "El barco de vapor y los veleros sobre el Sena, al fondo.",
]
themes = ["ocio", "domingo", "Sena", "puntillismo", "sociedad"]
anecdote = """
El cuadro inspiró el musical Sunday in the Park with George, de Stephen Sondheim, estrenado en Broadway en 1984: en él se ve a Seurat componer su lienzo, y el primer acto termina con los actores inmóviles en la pose exacta de los personajes."""
salle = 2
mur = "nord"
place = 2
largeur = 3.0

[[oeuvres]]
titre = "Retrato de Félix Fénéon (Opus 217)"
artiste = "Paul Signac"
annee = "1890"
image = "portrait-feneon.jpg"
technique = "Óleo sobre lienzo, 73,5 × 92,5 cm"
collection = "Museum of Modern Art, Nueva York"
note = "El crítico que bautizó el neoimpresionismo, con una flor en la mano, ante un torbellino de colores."
description = """
De pie a la derecha, un hombre delgado se mantiene de perfil, vuelto hacia la izquierda: Félix Fénéon, con su perilla en punta, su abrigo anaranjado, su cuello blanco y su corbata roja. Sostiene con una mano un sombrero de copa y un bastón, y tiende con la otra, con un gesto refinado, una pequeña flor blanca. Detrás de él, el fondo no es una estancia sino un decorado abstracto que gira: un gran disco hecho de rayos y círculos de colores, olas verdes y rojas, arabescos amarillos, estrellas sobre un fondo azul, bolas que hacen pensar en planetas. En la esquina inferior izquierda, el número «Op. 217»; a la derecha, la firma de Signac."""
evocation = """
El retrato es a la vez un homenaje y un guiño. Fénéon, dandi impasible y crítico temido, aparece como un mago o un domador que hace surgir los colores. El decorado giratorio ilustra las ideas del sabio Charles Henry, amigo de los neoimpresionistas, para quien las líneas y los colores actúan sobre la emoción: las líneas ascendentes alegrarían, las descendentes entristecerían. El título completo, Sobre el esmalte de un fondo rítmico de medidas y ángulos, de tonos y matices, retrato del señor Félix Fénéon en 1890, y el número de opus, como en una partitura, acercan la pintura a la música. También se ha reconocido en el fondo un motivo inspirado en una tela japonesa."""
histoire = """
Signac y Fénéon se conocen desde mediados de la década de 1880. Empleado en el Ministerio de la Guerra, Fénéon escribe en pequeñas revistas; en 1886, en su folleto Los impresionistas en 1886, es el primero en analizar el método de Seurat e inventa el término neoimpresionismo. En 1890, Signac le propone hacer su retrato y compone este lienzo muy elaborado, que presenta en los Independientes de 1891 con su largo título. Unos años más tarde, en 1894, Fénéon, simpatizante anarquista, es detenido y juzgado en el proceso de los Treinta, antes de ser absuelto. El cuadro pertenece hoy al Museum of Modern Art de Nueva York."""
facture = """
Signac lleva aquí la pincelada dividida hacia el decorado. Los puntos, más gruesos y regulares que los de Seurat, cubren toda la superficie con una red apretada. Los colores juegan con los complementarios: el abrigo naranja se recorta sobre un azul estrellado, el verde responde al rojo. El fondo no busca ninguna profundidad: es plano, ritmado por curvas y bandas concéntricas que recuerdan el círculo cromático de Charles Henry. El perfil nítido del modelo, casi recortado, contrasta con ese torbellino."""
details = [
  "La pequeña flor blanca que Fénéon tiende con la punta de los dedos.",
  "Las estrellas amarillas sobre fondo azul, detrás del abrigo.",
  "La inscripción «Op. 217», en la esquina inferior izquierda.",
  "La perilla en punta que prolonga el perfil.",
]
themes = ["retrato", "crítica de arte", "espiral", "teoría de los colores", "música"]
anecdote = """
Fénéon sigue siendo célebre por sus «noticias en tres líneas»: en 1906, redacta de forma anónima para el diario Le Matin sucesos de una concisión feroz, reunidos mucho más tarde en un libro y admirados como pequeñas obras maestras de humor negro."""
salle = 2
mur = "est"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "En el Moulin Rouge"
artiste = "Henri de Toulouse-Lautrec"
annee = "1892–1895"
image = "au-moulin-rouge.jpg"
technique = "Óleo sobre lienzo, 123 × 141 cm"
collection = "Art Institute of Chicago"
note = "Una noche en el cabaré: unos amigos sentados a la mesa, La Goulue ante el espejo, y el propio Lautrec que pasa al fondo."
description = """
Una barandilla de madera corta en diagonal la esquina inferior izquierda y nos sitúa al borde de la pista. Alrededor de una mesa cargada de vasos, un grupo charla: unos hombres con sombrero, entre ellos el escritor Édouard Dujardin, de barba amarilla, una mujer con sombrero de flores y, de espaldas, una bailarina de moño pelirrojo. Al fondo, dos hombres cruzan la sala: uno muy alto con sombrero de copa y, a su lado, un hombre pequeño y barbudo con bombín, el propio Lautrec con su primo Gabriel Tapié de Céleyran. Más lejos, La Goulue se arregla el moño ante un espejo. En el borde derecho, cortado por el marco, surge el rostro de una mujer iluminado desde abajo por una luz verdosa, como una máscara."""
evocation = """
No es la fiesta desenfrenada que se espera del Moulin Rouge: nadie baila, los rostros están cansados, cada cual parece solo en medio de los demás. Lautrec muestra el reverso del placer nocturno, su fatiga y su melancolía, con una mirada a la vez cómplice y sin complacencia. Al pintarse al fondo, pequeño y de paso, se sitúa como testigo más que como actor. El rostro verde del primer plano, que a menudo se identifica con el de la bailarina inglesa May Milton, transforma la escena en una visión casi inquietante: bajo la luz artificial, la piel se vuelve maquillaje y el rostro se vuelve máscara. Se ha visto en ella una imagen de la modernidad urbana, brillante y desencantada."""
histoire = """
El Moulin Rouge abre en 1889 al pie de Montmartre, en la place Blanche, y Lautrec se convierte enseguida en un habitual; su Amazona en el circo Fernando cuelga en el foyer del establecimiento. Pinta este gran lienzo a comienzos de la década de 1890. El cuadro fue ampliado con una banda en escuadra, a la derecha y abajo, aquella donde aparece el rostro verde. Esa banda estuvo un tiempo separada, sin duda para hacer la obra más fácil de vender, y luego fue colocada de nuevo. El lienzo ingresa en 1928 en el Art Institute of Chicago, con la colección reunida por Frederic Clay Bartlett en memoria de su esposa Helen, la misma que hizo entrar allí La Grande Jatte."""
facture = """
Lautrec dibuja con el pincel: largas hachuras, contornos nerviosos, superficies a veces apenas cubiertas. Los colores son ácidos, verdes y anaranjados, los de la iluminación de gas y de electricidad que modela los rostros desde abajo. La composición debe mucho a Degas y a las estampas japonesas: la diagonal de la barandilla, las figuras cortadas por el marco, el primer plano vacío que hace entrar al espectador. El encuadre, próximo a una instantánea fotográfica, da la impresión de una escena captada al paso."""
details = [
  "Lautrec en persona, pequeño y barbudo, al fondo, junto a su altísimo primo.",
  "El rostro verde y empolvado de la mujer cortada por el borde derecho.",
  "La Goulue que se arregla el moño ante un espejo, al fondo.",
  "La barandilla en diagonal que corta la esquina inferior izquierda.",
  "El moño pelirrojo de la mujer vista de espaldas, en el centro de la mesa.",
]
themes = ["cabaré", "noche", "Montmartre", "autorretrato", "luz artificial"]
anecdote = """
Lautrec medía apenas más de un metro y medio: dos fracturas de las piernas, en su adolescencia, habían detenido su crecimiento. Le gustaba mostrarse con su primo Gabriel, muy alto, y esa pareja dispar divertía a Montmartre como aquí nos divierte."""
salle = 4
mur = "est"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Moulin Rouge – La Goulue"
artiste = "Henri de Toulouse-Lautrec"
annee = "1891"
image = "moulin-rouge-la-goulue.jpg"
cadre = "estampe"
technique = "Litografía en color (cartel), 191 × 117 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Su primer cartel: la bailarina de enaguas blancas, y Valentin le Désossé como sombra en primer plano."
description = """
En lo alto, el nombre del cabaré se repite tres veces, en letras rojas que comparten una misma M gigante; a la derecha se anuncian Concert, Bal tous les soirs, La Goulue. En el centro, la bailarina, de moño rubio y corpiño rojo de lunares blancos, levanta la pierna en una nube de enaguas blancas. Detrás de ella, los espectadores no son más que un friso de siluetas negras, sombreros altos y plumeros, bajo una hilera de lámparas amarillas. En primer plano, cortado por el borde, se alza el perfil gris de su pareja, Valentin le Désossé, con sombrero de copa y la mano tendida hacia nosotros. El suelo huye en diagonal; abajo, en grandes letras, se anuncia el baile de máscaras de los miércoles y sábados."""
evocation = """
Con este cartel, Lautrec hace entrar el arte en la calle. No describe el cabaré: da su impacto, su energía y su promesa, la del cuadrille naturalista, ese baile donde vuelan las enaguas y dejan ver la ropa interior. Todo se dice en unas pocas formas: la estrella luminosa en el centro, la multitud anónima reducida a sombras, y Valentin, mitad real, mitad caricatura, que sirve de contrapunto. Se ha visto en él la influencia del teatro de sombras de los cabarés de Montmartre, como el del Chat Noir. El cartel dice también un mundo donde el espectáculo se vuelve mercancía y donde el artista acepta trabajar para la publicidad sin renunciar a su estilo."""
histoire = """
El Moulin Rouge abrió en octubre de 1889; su director, Charles Zidler, encarga un nuevo cartel a Lautrec en 1891, cuando la publicidad del cabaré había sido confiada hasta entonces a Jules Chéret, el maestro del género. Impreso por Charles Lévy y pegado en los muros de París a finales de año, hace célebre a Lautrec casi de la noche a la mañana. Es su primerísimo cartel; una treintena de otros seguirán, para Aristide Bruant, Jane Avril o el Divan japonais. Sus grandes dimensiones obligaban a imprimirlo en varias hojas, cuyas uniones horizontales se ven. El ejemplar presentado aquí pertenece al Metropolitan Museum of Art."""
facture = """
Lautrec dibuja sus formas directamente sobre las piedras litográficas, una para cada color. Las superficies planas son francas y poco numerosas: el negro de las siluetas, el amarillo de las lámparas, el rojo de las letras, el gris de Valentin y el blanco del papel que forma las enaguas. El japonismo está en todas partes: contornos simples, encuadre cortado, suelo en diagonal, ausencia de modelado. El rotulado, dibujado a mano, forma parte de la composición al mismo título que las figuras."""
details = [
  "La M gigante que sirve a los tres «Moulin Rouge» de la parte superior.",
  "El perfil gris de Valentin le Désossé, cortado por el borde, en primer plano.",
  "La multitud reducida a un friso de siluetas negras.",
  "Los globos amarillos de las lámparas, alineados sobre los espectadores.",
  "La firma «HLautrec», abajo a la izquierda.",
]
themes = ["cartel", "cabaré", "danza", "Montmartre", "litografía"]
anecdote = """
En 1895, La Goulue deja el Moulin Rouge para bailar en una barraca de feria. Lautrec le pinta dos grandes paneles para adornar la entrada; cortados más tarde en trozos por un marchante, han sido reconstituidos y se encuentran hoy en el Museo de Orsay."""
salle = 4
mur = "sud"
place = 2
largeur = 1.17

[[oeuvres]]
titre = "El talismán (El Aven en el Bois d'Amour)"
artiste = "Paul Sérusier"
annee = "1888"
image = "le-talisman.jpg"
technique = "Óleo sobre madera, 27 × 21,5 cm"
collection = "Museo de Orsay, París"
note = "Un paisaje del tamaño de la tapa de una caja de puros, pintado al dictado de Gauguin: el acta de nacimiento de los nabis."
description = """
El pequeño panel muestra un rincón del río Aven, en el Bois d'Amour, cerca de Pont-Aven, pero se necesita un momento para reconocerlo. En la mitad superior, los árboles son manchas amarillas, verdes y violetas; una ancha banda rojo anaranjado, la orilla, atraviesa el cuadro en oblicuo, erizada de trazos verticales azul grisáceo que figuran los troncos. A la derecha, se adivina una casa de tejado azul. La mitad inferior es el reflejo de todo ello en el agua: grandes manchas amarillas, violetas y verdes, una masa oscura a la derecha, una zona azul claro en la esquina. Ningún detalle, ningún modelado: solo superficies de color puestas una junto a otra."""
evocation = """
Este minúsculo paisaje tiene valor de revelación: el color ya no tiene que imitar la naturaleza, debe traducir lo que se siente ante ella, aunque sea exagerándolo. Los amigos de Sérusier lo conservaron como un objeto mágico, de ahí su nombre de Talismán. En 1890, Maurice Denis extrae la lección de este descubrimiento en una frase que se haría célebre: recordar que un cuadro, antes de ser un caballo de batalla, una mujer desnuda o una anécdota cualquiera, es esencialmente una superficie plana cubierta de colores reunidos en un cierto orden. Se ve a menudo en este panel uno de los primeros pasos de la pintura hacia la abstracción, un cuarto de siglo antes de que llegara realmente a ella."""
histoire = """
En octubre de 1888, Paul Sérusier, alumno de la Academia Julian en París, reside en Pont-Aven, donde Gauguin arrastra a un grupo de jóvenes pintores. Según el relato que hará Maurice Denis, Gauguin lo lleva al Bois d'Amour y le pregunta cómo ve los árboles: si le parecen amarillos, que ponga amarillo, el más hermoso; si la sombra es azul, azul ultramar; si las hojas son rojas, bermellón. De regreso en París, Sérusier muestra el panel a sus compañeros, Denis, Bonnard, Ranson, Ibels: forman el grupo de los nabis. Conservado durante mucho tiempo por Maurice Denis y su familia, el Talismán ingresó en el Museo de Orsay en 1985."""
facture = """
Sérusier pinta deprisa, sobre la tapa de madera de una caja de puros, con amplias pinceladas planas de colores casi puros. Suprime la perspectiva, las sombras y los detalles, y reduce cada elemento a una mancha cuyo color se exalta. Se reconoce la lección del sintetismo de Gauguin y de Émile Bernard: simplificar, pintar de memoria y según la emoción. La pincelada sigue siendo, sin embargo, visible y viva, y la madera aparece por zonas entre los colores."""
details = [
  "La banda rojo anaranjado de la orilla, que cruza en oblicuo la parte alta del panel.",
  "Los troncos de los árboles reducidos a simples trazos verticales azul grisáceo.",
  "La casa de tejado azul, a la derecha, apenas esbozada.",
  "Los reflejos en el agua, convertidos en grandes manchas amarillas, violetas y verdes.",
]
themes = ["paisaje", "color puro", "Bretaña", "abstracción", "nabis"]
anecdote = """
En el reverso del panel, una inscripción precisa que fue hecho en octubre de 1888, bajo la dirección de Gauguin, por Sérusier, en Pont-Aven: una especie de certificado de nacimiento del cuadro que iba a dar su impulso a toda la pintura nabi."""
salle = 3
mur = "nord"
place = 1
largeur = 0.8

[[oeuvres]]
titre = "Madeleine en el Bois d'Amour"
artiste = "Émile Bernard"
annee = "1888"
image = "madeleine-bois-d-amour.jpg"
technique = "Óleo sobre lienzo, 138 × 163 cm"
collection = "Museo de Orsay, París"
note = "Su hermana de diecisiete años, tendida en el bosque de Pont-Aven, soñadora como una yacente."
description = """
Una joven de cabello rojizo está tendida cuan larga es en la parte baja del lienzo, sobre la hierba sembrada de pequeñas flores blancas. Lleva un largo vestido azul grisáceo, ha deslizado una mano bajo la cabeza y apoyado la otra sobre el pecho; con los ojos abiertos, mira al vacío. Detrás de ella se alza un bosque ralo: troncos delgados y oscuros, verticales, plantados sobre un suelo rosa y malva. Más lejos, entre los árboles, brillan los pálidos reflejos del río, y el follaje verde cierra la parte superior del cuadro. Abajo a la izquierda, el pintor firmó y fechó su obra."""
evocation = """
Madeleine Bernard, hermana menor del pintor, es para él una musa, y la representa como una figura ideal más que como una joven real. Tendida, inmóvil, con la mirada perdida, hace pensar en una yacente esculpida sobre una tumba medieval, o en una heroína de leyenda dormida en un bosque encantado. Se ha leído en ella el gusto de Bernard por la espiritualidad y el simbolismo: la joven parece en comunión con la naturaleza, absorta en un sueño interior. El propio nombre del lugar, el Bois d'Amour, añade una nota romántica. El cuadro adquiere una resonancia melancólica cuando se sabe que Madeleine morirá muy joven, antes de los veinticinco años."""
histoire = """
Émile Bernard llega a Pont-Aven en agosto de 1888, con su madre y Madeleine, entonces de diecisiete años, y allí se reencuentra con Paul Gauguin. Ese verano, los dos pintores intercambian intensamente: Bernard pinta sus Bretonas en el prado, Gauguin su Visión después del sermón, y nace lo que se llamará sintetismo. Madeleine fascina al pequeño grupo de artistas; más tarde se prometerá con el pintor Charles Laval, amigo de Gauguin. Ambos partirán a Egipto, donde Laval muere en 1894 y Madeleine al año siguiente, de tuberculosis. El cuadro pertenece hoy al Museo de Orsay."""
facture = """
La composición opone la larga horizontal del cuerpo a las verticales regulares de los troncos, como un pentagrama. Bernard simplifica las formas y pone los colores en amplias zonas: el azul del vestido, el rosa del suelo, el verde de la hierba y del follaje. La pincelada, hecha de pequeñas hachuras paralelas, sigue siendo visible, más flexible que las superficies planas perfiladas de negro de sus Bretonas del mismo año. La gama suave y algo apagada refuerza la atmósfera de ensoñación."""
details = [
  "La mano deslizada bajo la cabeza, gesto de ensueño.",
  "Los troncos delgados que ritman el fondo como barrotes.",
  "Los reflejos claros del río, entre los árboles.",
  "Las pequeñas flores blancas sembradas en la hierba, en primer plano.",
]
themes = ["retrato", "ensoñación", "Bretaña", "bosque", "simbolismo"]
anecdote = """
El Bois d'Amour, donde Madeleine posa ese verano, es también el lugar donde, unas semanas más tarde, Sérusier pinta el Talismán bajo la dirección de Gauguin: las dos obras, expuestas aquí una junto a otra, nacieron a orillas del mismo río, el Aven."""
salle = 3
