titre = "Renoir, la felicidad de pintar"
artiste = "Pierre-Auguste Renoir"
dates = "1841–1919"
accroche = "Exposición virtual · Pierre-Auguste Renoir"
introduction = """
Los bailes de Montmartre, los almuerzos a orillas del Sena, los niños y las muchachas: Renoir pinta el París alegre de finales del siglo XIX, bajo una luz que danza entre el follaje. Diez lienzos, de El palco a Muchachas al piano, pasando por sus tres grandes bailes."""
vitrine = "moulin-galette.jpg"

[musee]
nom = "Museo de Orsay"
ville = "París, Francia"
architecte = "Victor Laloux"
construction = "1898–1900"
presentation = """
El Museo de Orsay ocupa la antigua estación de Orsay, construida por Victor Laloux para la Exposición Universal de 1900 en la orilla izquierda del Sena, frente al jardín de las Tullerías. Su estructura metálica se oculta tras una fachada de piedra, y una inmensa cubierta de vidrio cubre la nave de las vías. Demasiado corta para los trenes modernos, la estación pierde sus grandes líneas ya en 1939; amenazada de demolición, acaba transformándose en museo. Los arquitectos de la agencia ACT y la italiana Gae Aulenti acondicionan la gran nave y sus galerías, y el museo abre en diciembre de 1986. Presenta el arte de 1848 a 1914, de la pintura a la fotografía, y la más rica colección impresionista del mundo. Renoir se encuentra aquí como en casa: el Baile en el Moulin de la Galette, legado por Caillebotte, los dos Bailes y las Muchachas al piano, adquiridas por el Estado en 1892, figuran entre los lienzos más queridos del museo."""
ici = """
A falta de planos, el edificio de ARTEON no es más que una sencilla evocación de Orsay: tres salas en enfilada, unidas por corredores, que se recorren en el orden de la carrera del pintor. La Sala I · Los años impresionistas, de muros beige rosado, reúne El palco y el gran baile de Montmartre. La Sala II · La vida moderna, de muros malva pálido, sigue a los remeros y las calles de París. La Sala III · Bailes y muchachas, de muros rosa tierno, presenta al fondo de la galería los tres grandes bailes uno junto a otro."""

