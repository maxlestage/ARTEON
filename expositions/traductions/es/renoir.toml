[[oeuvres]]
titre = "Muchachas al piano"
annee = "1892"
image = "jeunes-filles-piano.jpg"
technique = "Óleo sobre lienzo, 116 × 90 cm"
collection = "Museo de Orsay, París"
note = "Adquirida por el Estado francés: la primera obra de Renoir en ingresar en un museo nacional."
description = """
En un interior burgués, dos muchachas están ante un piano vertical. Una, rubia, con vestido blanco, está sentada y apoya las manos en el teclado, los ojos fijos en la partitura. La otra, morena, con vestido rosa, está de pie a su lado, inclinada, con un codo apoyado en el piano, y sigue la música con la mirada. Sus cabezas casi se tocan. Sobre el piano, un jarrón de flores; tras ellas, una pesada cortina y unos muebles se funden en una penumbra cálida. Ningún espectador, ninguna puerta abierta: la escena está cerrada sobre sí misma, enteramente ocupada por la atención que las dos muchachas prestan a la música."""
evocation = """
El cuadro evoca la felicidad tranquila de la vida familiar burguesa, donde el estudio del piano forma parte de la educación de las jóvenes. Lo que llama la atención es la complicidad silenciosa de los dos personajes, unidos por una misma concentración. Ningún drama, ninguna anécdota: Renoir busca una armonía entre las figuras, los colores y la música que se adivina. El cuadro marca también un momento de su carrera: a los cincuenta y un años, el antiguo rebelde del impresionismo recibe por fin la consagración oficial. Algunos críticos modernos han juzgado esta dulzura demasiado azucarada; otros ven en ella el logro de una búsqueda paciente de plenitud, más allá de la impresión fugaz."""
histoire = """
En 1892, por iniciativa del poeta Stéphane Mallarmé y del crítico Roger Marx, Henry Roujon, director de Bellas Artes, propone a Renoir que el Estado le compre una obra para el Museo del Luxemburgo, entonces dedicado a los artistas vivos. Renoir retoma el mismo tema en varios lienzos antes de entregar este, elegido para ingresar en las colecciones públicas. El reconocimiento es tardío: el pintor tiene más de cincuenta años y una larga carrera a sus espaldas. El cuadro permanece en el Luxemburgo, luego pasa al Louvre y, por último, al Museo de Orsay, donde sigue siendo una de las imágenes más conocidas de Renoir."""
facture = """
La pincelada es flexible, fundida, casi nacarada: Renoir abandona la sequedad de sus años de duda y recupera contornos suavizados. La paleta cálida juega con el blanco, el rosa, el rojo, el oro y el verde oscuro del fondo. Las dos figuras, entrelazadas, forman una pirámide equilibrada, y la diagonal del piano estructura el espacio. Se siente en ella la admiración de Renoir por los pintores franceses del siglo XVIII, Fragonard a la cabeza, de quienes amaba la gracia y la ligereza."""
details = [
  "La partitura abierta que siguen las dos muchachas.",
  "El codo de la muchacha de pie, apoyado en el piano.",
  "El jarrón de flores colocado sobre el piano.",
  "Las dos cabezas cercanas, una rubia, la otra morena.",
  "La pesada cortina que cierra el fondo.",
]
themes = ["música", "interior", "juventud", "intimidad", "burguesía"]
anecdote = """
Para este encargo, Renoir pintó varias versiones del mismo tema, muy próximas entre sí. Una está en el Metropolitan Museum de Nueva York, otra en el Museo de la Orangerie, en París, al otro lado del Sena, a pocos minutos a pie del Museo de Orsay."""
salle = 3
mur = "gauche"
place = 1
largeur = 1.1

[[artistes]]
nom = "Pierre-Auguste Renoir"
vie = "Limoges, 25 de febrero de 1841 – Cagnes-sur-Mer, 3 de diciembre de 1919"
biographie = """
Hijo de un sastre y de una costurera, Pierre-Auguste Renoir nace en Limoges en 1841 y crece en París, cerca del Louvre, adonde su familia se traslada cuando él tiene tres años. A los trece años entra de aprendiz con un pintor de porcelana, y luego decora abanicos y estores. En 1862 es admitido en la Escuela de Bellas Artes y frecuenta el taller de Charles Gleyre, donde se hace amigo de Claude Monet, Alfred Sisley y Frédéric Bazille. En 1869 pinta con Monet en La Grenouillère, a orillas del Sena: allí se elabora, en los dos amigos, la pincelada impresionista. Tras la guerra de 1870, participa en 1874 en la primera exposición del grupo, y luego en las siguientes, en gran pobreza. El éxito llega poco a poco, gracias a los retratos encargados por la burguesía, en particular el de Madame Charpentier y sus hijos, saludado en el Salón de 1879, y al apoyo del marchante Paul Durand-Ruel. En 1881, un viaje a Argelia y luego a Italia, donde descubre a Rafael y los frescos de Pompeya, abre un período de duda y de dibujo más severo. Se casa en 1890 con Aline Charigot, que le da tres hijos: Pierre, actor, Jean, futuro cineasta, y Claude. Aquejado desde los años 1890 de una poliartritis que deforma sus manos, adquiere en 1907 la finca de Les Collettes, en Cagnes-sur-Mer, y sigue pintando, con un pincel deslizado entre los dedos. Aline muere en 1915. Pocos meses antes de su muerte, en 1919, Renoir puede ver uno de sus lienzos colgado en el Louvre."""
style = """
Renoir es el pintor de la felicidad: bailes, almuerzos, niños, mujeres y flores, captados en una luz cálida que acaricia las pieles y se filtra a través del follaje. Su pincelada impresionista, ligera y colorida, hace vibrar las manchas de sol y las sombras azules. Después de 1881, busca más dibujo y solidez, antes de volver a una manera más fundida, nacarada, de tonos rojos y dorados, que culmina en sus desnudos tardíos. Heredero de Rubens y de los pintores del siglo XVIII, influyó en Bonnard, Matisse y el Picasso de los años 1920, que admiraban su sensualidad del color y de las formas."""
