[[oeuvres]]
titre = "Baile en el campo"
annee = "1883"
image = "danse-campagne.jpg"
technique = "Óleo sobre lienzo, 180 × 90 cm"
collection = "Museo de Orsay, París"
note = "Aline Charigot, risueña, abanico en mano: la alegría sencilla de un baile popular al aire libre."
description = """
Al aire libre, bajo los árboles de una taberna con baile, una pareja baila en primer plano. La joven, con vestido blanco salpicado de pequeñas flores rojas, tocada con un sombrero rojo, sostiene un abanico abierto; vuelve hacia nosotros un rostro risueño, de mejillas redondas y sonrosadas. Su pareja, con traje azul, la estrecha contra sí y casi hunde su rostro barbudo contra ella. Su sombrero de paja ha caído al suelo, a sus pies. A la izquierda, sobre una mesa, quedan un vaso, una servilleta arrugada y unos cubiertos, huellas de una comida que acaba. Tras ellos, el follaje forma un fondo verde y luminoso. Como en su pareja, las dos figuras, casi de tamaño natural, llenan toda la altura del lienzo."""
evocation = """
Todo aquí dice abandono y alegría: la risa de la bailarina, el abrazo franco de la pareja, el sombrero caído que nadie se molesta en recoger. Frente al Baile en la ciudad, envarado y silencioso, el Baile en el campo expresa la alegría sencilla de un baile de domingo. A menudo se ha visto en él una declaración de amor: la bailarina es Aline Charigot, la compañera de Renoir, que llegará a ser su esposa. El cuadro dice también la ternura del pintor por los placeres populares y por ese mundo modesto del que él mismo procede, hijo de un sastre y de una costurera."""
histoire = """
Aline Charigot, joven costurera originaria de Essoyes, en el Aube, conoce a Renoir hacia 1880; ya posaba, en primer plano, en El almuerzo de los remeros. En 1883, la pinta aquí frente a Paul Lhote, que sirve también de pareja en el Baile en la ciudad. La pareja tendrá un primer hijo, Pierre, en 1885, y se casará en 1890. Como su pareja, el cuadro es adquirido por Paul Durand-Ruel y permanece en la familia del marchante hasta finales de los años 1970, cuando ingresa en las colecciones nacionales. Se presenta hoy en el Museo de Orsay junto al Baile en la ciudad, del que es inseparable."""
facture = """
A diferencia de su pareja, el lienzo está construido sobre tonos cálidos: rojos, amarillos, anaranjados y verdes luminosos. Los contornos de las figuras siguen siendo firmes, signo de la nueva manera de Renoir, pero el follaje del fondo está brochado con toques libres y ligeros. El rostro de Aline, a plena luz, atrae de inmediato la mirada, mientras que el del hombre queda en la sombra. Las pequeñas flores rojas del vestido, esparcidas como manchas, animan la gran superficie blanca."""
details = [
  "El sombrero de paja de la pareja, caído en el suelo.",
  "El abanico abierto que la bailarina sostiene en la mano.",
  "Sobre la mesa, a la izquierda, los restos de una comida: un vaso y una servilleta arrugada.",
  "Las pequeñas flores rojas esparcidas sobre el vestido blanco.",
  "El rostro risueño de Aline, vuelto hacia el espectador.",
]
themes = ["baile", "taberna", "alegría", "pareja", "amor"]
anecdote = """
Aline Charigot era originaria de Essoyes, pueblo del Aube donde la pareja pasará numerosos veranos y donde Renoir comprará una casa. En el cementerio de Essoyes está enterrado el pintor, junto a ella."""
