[[oeuvres]]
titre = "Los paraguas"
annee = "hacia 1881–1886"
image = "parapluies.jpg"
technique = "Óleo sobre lienzo, 180 × 115 cm"
collection = "National Gallery, Londres"
note = "Comenzada con pinceladas impresionistas y terminada con líneas más nítidas: se ve cambiar el estilo de Renoir en un mismo cuadro."
description = """
Una calle de París bajo el aguacero. Una multitud de transeúntes se apretuja bajo paraguas azul grisáceo que forman sobre ellos un techo irregular. A la derecha, una mujer elegante acompaña a dos niñas; la más pequeña sostiene un aro y su varilla, y la mayor alza los ojos hacia nosotros. A la izquierda, en primer plano, una joven con la cabeza descubierta, sin paraguas, lleva una sombrerera en el brazo y se levanta un poco la falda: sin duda una modista o una costurera que entrega su trabajo. Tras ella, un hombre barbudo la mira, como si fuera a ofrecerle refugio. Al fondo, otros paraguas y otras siluetas se superponen. Los bordes del cuadro cortan a los personajes, como si la multitud continuara más allá."""
evocation = """
El cuadro cuenta la gran ciudad moderna, la de los bulevares haussmannianos, donde desconocidos de todas las condiciones se cruzan un instante. El paraguas se convierte en un signo social: la familia burguesa de la derecha dispone de uno, la joven obrera de la izquierda no. Se ha leído en él una escena de encuentro, incluso de galanteo, entre el hombre barbudo y la transeúnte. Pero la obra evoca también la crisis de Renoir a comienzos de los años 1880: contará más tarde al marchante Ambroise Vollard que tenía entonces la sensación de haber llegado al final del impresionismo y de no saber ya ni pintar ni dibujar. El cuadro guarda la huella de esa duda y de esa búsqueda."""
histoire = """
Renoir comienza el lienzo hacia 1881 y pinta primero la parte derecha. Lo retoma unos años más tarde, hacia 1885–1886, y repinta ampliamente la parte izquierda. Las radiografías muestran que la joven de la sombrerera estaba vestida al principio de otra manera. El marchante Paul Durand-Ruel compra el cuadro en 1892. Pasa más tarde al coleccionista irlandés Hugh Lane, muerto en 1915 en el naufragio del Lusitania. Su testamento legaba su colección a la National Gallery de Londres, pero un codicilo, firmado sin testigos, la destinaba a Dublín. Tras décadas de disputa, se alcanzó un acuerdo: Los paraguas, como otros cuadros de Lane, se presenta alternativamente en Londres y en la Hugh Lane Gallery de Dublín."""
facture = """
Las dos etapas se leen a simple vista. A la derecha, los rostros y las ropas están pintados con toques ligeros y fundidos, de contornos difusos, en el espíritu de los años impresionistas. A la izquierda, la joven está rodeada de un contorno nítido, con el rostro modelado con firmeza, bajo la influencia de Rafael y de Ingres, que Renoir estudió tras su viaje a Italia de 1881. Una armonía de azules y grises, casi monocroma, unifica el conjunto. Las curvas de los paraguas, repetidas y superpuestas, crean un ritmo que recuerda las estampas japonesas."""
details = [
  "El aro y la varilla que sostiene la niña pequeña, a la derecha.",
  "La sombrerera en el brazo de la joven sin paraguas, a la izquierda.",
  "La mirada del hombre barbudo posada sobre la transeúnte.",
  "La diferencia de pincelada entre los rostros difusos de la derecha y el, nítido, de la izquierda.",
  "Los paraguas que se superponen y ocultan por completo el cielo.",
]
themes = ["lluvia", "ciudad", "multitud", "moda", "parís"]
anecdote = """
Los historiadores han podido fechar las dos etapas del cuadro gracias a la moda femenina: los vestidos y sombreros de los personajes de la derecha corresponden a comienzos de los años 1880, mientras que el atuendo de la joven de la izquierda sigue la moda de 1885–1886."""
