[[oeuvres]]
titre = "Baile en la ciudad"
annee = "1883"
image = "danse-ville.jpg"
technique = "Óleo sobre lienzo, 180 × 90 cm"
collection = "Museo de Orsay, París"
note = "El contrapunto elegante del Baile en el campo: satén blanco, guantes largos y palmeras de un salón parisino."
description = """
En un salón, una pareja baila un vals, casi de tamaño natural. La joven, vista de tres cuartos, lleva un largo vestido de baile de satén blanco cuya cola se desliza sobre el parqué, y largos guantes blancos que suben por encima del codo; su cabello está recogido en un moño. Con los ojos bajos, el rostro de perfil, apoya una mano en el hombro de su pareja. Él, de frac negro, la sujeta por la cintura; su rostro barbudo casi desaparece tras la cabeza de su compañera. Al fondo, plantas verdes en maceta y un muro claro evocan un decorado de recepción. Las dos figuras ocupan toda la altura del estrecho lienzo, sin otro bailarín a su alrededor."""
evocation = """
La escena respira contención: los cuerpos apenas se tocan, las miradas no se cruzan, la bailarina parece absorta en sí misma. Se ha visto en ella la imagen de los códigos de la buena sociedad, donde el baile es un ritual reglado más que un placer. Concebido como pareja del Baile en el campo, el lienzo contrapone la ciudad al campo, el salón a la taberna con baile, el satén al algodón estampado, la reserva a la alegría. Algunos historiadores leen también en él el giro de Renoir hacia un arte más clásico, más frío y más escultórico, que marca estos años de cuestionamiento."""
histoire = """
Renoir pinta los dos bailes en 1883, el año en que el marchante Paul Durand-Ruel, su principal apoyo, le dedica una gran exposición individual en París. Los modelos son dos familiares: Suzanne Valadon para la bailarina y Paul Lhote, amigo del pintor, para la pareja, que posa también en el Baile en el campo. Durand-Ruel adquiere los dos lienzos, que permanecen casi un siglo en la familia del marchante. Ingresan en las colecciones nacionales a finales de los años 1970 y se exponen en el Museo de Orsay desde su apertura, reunidos uno junto a otro como Renoir los había concebido."""
facture = """
La superficie es lisa y cuidada, los contornos están nítidamente dibujados: Renoir, a su regreso de Italia, busca la firmeza de Rafael y de Ingres. El satén blanco se construye con grises, azules y rosas que hacen sentir sus pliegues y reflejos. La paleta fría, dominada por el blanco, el negro y el verde oscuro de las plantas, contrasta con los tonos cálidos de su pareja. El formato vertical, muy alargado, y el tamaño real de las figuras acentúan su elegancia."""
details = [
  "Los largos guantes blancos de la bailarina, que suben por encima del codo.",
  "La cola de satén que se extiende sobre el parqué.",
  "Los reflejos grises y azulados que modelan los pliegues del vestido blanco.",
  "El rostro del hombre, casi oculto tras la cabeza de su compañera.",
  "Las plantas verdes en maceta del salón, al fondo.",
]
themes = ["baile", "salón de baile", "elegancia", "pareja", "ciudad"]
anecdote = """
La bailarina, Suzanne Valadon, posó para Renoir, Puvis de Chavannes y Toulouse-Lautrec antes de convertirse ella misma en pintora. En 1894 es la primera mujer admitida a exponer en la Société nationale des beaux-arts."""
