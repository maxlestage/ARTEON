[[oeuvres]]
titre = "El palco"
annee = "1874"
image = "loge.jpg"
technique = "Óleo sobre lienzo, 80 × 63,5 cm"
collection = "The Courtauld, Londres"
note = "Presentada en la primera exposición impresionista: una elegante con vestido de rayas y su hermano Edmond, que otea la sala con los anteojos."
description = """
En un palco de teatro, una joven se mantiene en primer plano, con los brazos apoyados en el borde de terciopelo. Lleva un vestido de anchas rayas negras y blancas, un collar de perlas, pendientes, flores prendidas en el cabello y rosas en el escote. Su mano enguantada de blanco aprieta unos anteojos de teatro y un abanico. No mira al escenario: su rostro, ligeramente vuelto hacia nosotros, parece ofrecerse a las miradas del público. Tras ella, en la penumbra, un hombre de frac negro y pechera blanca levanta sus propios anteojos hacia lo alto de la sala. El encuadre es muy ceñido: no se ve ni el escenario ni los demás palcos, solo esta pareja recortada como en una instantánea."""
evocation = """
El cuadro muestra el teatro como un lugar adonde se va tanto para ser visto como para ver. La joven, inmóvil y engalanada, se deja contemplar, mientras su acompañante dirige los anteojos a otra parte, quizá hacia otro palco: se ha leído en ello una pequeña comedia de miradas, típica de la sociabilidad parisina de los años 1870. Su rostro, amable pero ausente, no revela nada de lo que piensa, y no se sabe si se aburre, espera o posa. Para los historiadores, la obra afirma también una ambición: probar que un pintor de la vida moderna puede igualar los retratos mundanos del Salón, no pintando princesas, sino parisinos de hoy, sorprendidos en sus placeres de la noche."""
histoire = """
Renoir pinta El palco en 1874 en su taller, con dos allegados por modelos: su hermano menor Edmond, periodista, posa para el hombre de los anteojos, y una joven de Montmartre conocida como Nini para la elegante. En abril de 1874, el lienzo figura en la primera exposición del grupo que pronto se llamará impresionista, en el antiguo taller del fotógrafo Nadar, en el bulevar des Capucines. Es bastante bien recibido por una crítica a menudo hostil al grupo. Renoir, siempre escaso de dinero, lo vende poco después al pequeño marchante apodado el père Martin por 425 francos, lo justo para pagar su alquiler. Tras varios propietarios, el cuadro es adquirido en los años 1920 por el industrial británico Samuel Courtauld, que lo dona después al instituto de historia del arte que funda en Londres."""
facture = """
Todo descansa en el contraste de las rayas negras y blancas. Renoir emplea aquí un negro aterciopelado, matizado de azul, contra la idea de que los impresionistas desterraban ese color. El rostro y la garganta están modelados con toques fundidos, casi lisos, mientras que las flores, el encaje y los guantes se resuelven con pequeñas pinceladas rápidas y brillantes. La luz artificial de la sala no tiene fuente visible: se posa sobre la piel, las perlas y la pechera. El encuadre, que corta el palco y relega al hombre a la sombra, recuerda las audacias de composición de Degas y de las estampas japonesas."""
details = [
  "Los anteojos del hombre, dirigidos hacia lo alto de la sala y no hacia el escenario.",
  "Las rosas colocadas en el escote, que responden a las flores del cabello.",
  "La mano enguantada de blanco que sostiene a la vez los anteojos y el abanico.",
  "Los reflejos azulados en los negros del vestido y del frac.",
  "El borde del palco, cortado en seco por la parte inferior del marco.",
]
themes = ["teatro", "mirada", "elegancia", "vida parisina", "retrato"]
anecdote = """
El hombre de los anteojos, Edmond Renoir, se ocupa ese mismo año del catálogo de la primera exposición impresionista. Según el relato de Monet, fue porque Edmond encontraba sus títulos demasiado monótonos por lo que el pintor propuso para una vista de El Havre la palabra «Impresión», que daría nombre al movimiento."""
salle = 1
mur = "gauche"
place = 1
largeur = 1.0

[[oeuvres]]
titre = "La niña de la regadera"
annee = "1876"
image = "arrosoir.jpg"
technique = "Óleo sobre lienzo, 100 × 73 cm"
collection = "National Gallery of Art, Washington"
note = "Una niña pequeña con vestido de terciopelo azul en un jardín en flor, pintada con pinceladas vivas y ligeras."
description = """
Una niña muy pequeña se mantiene de pie, muy erguida, en medio de un sendero de jardín. Lleva un vestido de terciopelo azul oscuro, ribeteado de encaje blanco en el cuello y los puños, y un lazo rojo sujeta su cabello rubio. Con una mano sostiene una pequeña regadera de metal; con la otra, unas flores recién cortadas. Sus mejillas rosadas y su mirada seria se dirigen al espectador. A su alrededor, el jardín desborda: macizos de flores rojas, blancas y amarillas, césped, arbustos de un verde denso. El sendero arenoso se adentra serpenteando tras ella y abre una profundidad. La línea del horizonte está colocada muy alta, de modo que la niña se recorta sobre un fondo casi enteramente hecho de verdor y flores."""
evocation = """
Renoir hace de la infancia un momento de gracia, y del jardín una especie de pequeño paraíso doméstico. El contraste es llamativo entre la niña, plantada allí con la gravedad de una persona mayor que posa, y la naturaleza que se estremece a su alrededor: se ha visto en ello a la vez la inocencia y la fragilidad de una edad que pasa deprisa. El cuadro dice también el lugar nuevo del niño en la familia burguesa de finales del siglo XIX, mimado, vestido con esmero y digno de ser pintado por sí mismo. Para Renoir, estos retratos de niños, sin drama ni anécdota, son la ocasión de celebrar lo que más le gusta pintar: la frescura de una piel, la suavidad de una tela y la luz de un día de verano."""
histoire = """
El lienzo data de 1876, el año en que Renoir trabaja también en el Baile en el Moulin de la Galette y participa en la segunda exposición impresionista, en casa del marchante Durand-Ruel. En esa época, sus grandes composiciones se venden mal, y los retratos de niños encargados por familias acomodadas le aseguran una parte esencial de sus ingresos. La identidad de la niña no está establecida con certeza, y se han propuesto varios nombres sin prueba decisiva. El cuadro pasa luego por diversas colecciones antes de cruzar el Atlántico. Entra en la colección del banquero neoyorquino Chester Dale, que reúne con su esposa Maud un notable conjunto de pintura francesa. A su muerte, Dale lega sus cuadros a la National Gallery of Art de Washington, que los recibe en 1963."""
facture = """
Renoir opone dos maneras en el mismo lienzo. El rostro y las manos están pintados con toques finos y fundidos, de gran delicadeza. El jardín, en cambio, está hecho de comas de color puro, rojas, amarillas, blancas y verdes, aplicadas una junto a otra sin contorno, que vibran a distancia. El vestido juega con toda una gama de azules y violetas, y el encaje se indica con unos cuantos empastes blancos. La luz es difusa, sin sombra dura: incluso las zonas de sombra siguen siendo coloreadas, azuladas o verdosas, según el principio impresionista."""
details = [
  "El lazo rojo en el cabello, única nota viva junto al rostro.",
  "El pequeño ramo de flores apretado en una mano de la niña.",
  "El encaje blanco del cuello y los puños, aplicado con unos pocos toques gruesos.",
  "El sendero que serpentea tras la niña y lleva el ojo hacia el fondo.",
]
themes = ["infancia", "jardín", "flores", "retrato", "verano"]
anecdote = """
El legado de Chester Dale a la National Gallery of Art viene acompañado de una condición: los cuadros de su colección no deben prestarse. Para ver La niña de la regadera hay que hacer, pues, casi siempre el viaje hasta Washington."""
salle = 1
mur = "droite"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Baile en el Moulin de la Galette"
annee = "1876"
image = "moulin-galette.jpg"
technique = "Óleo sobre lienzo, 131 × 175 cm"
collection = "Museo de Orsay, París"
note = "Una tarde de domingo en Montmartre: la luz cae en manchas a través de las acacias sobre los bailarines."
description = """
El patio de una taberna con baile en lo alto de Montmartre, un domingo soleado. A la izquierda y en el centro, parejas bailan; a la derecha, en primer plano, un grupo de jóvenes se ha instalado en un banco y en torno a una mesa donde brillan unos vasos. Una joven con vestido de rayas rosa y azul se inclina hacia un hombre visto de espaldas, tocado con un canotier, mientras otra, de pie tras ella, le pone la mano en el hombro. En el centro izquierda, una bailarina con vestido rosa gira con su pareja. Más lejos, la multitud se pierde en un hormigueo de sombreros de paja, de chisteras y de vestidos claros. Globos de luz, colgados de delgados postes, flotan sobre las cabezas. No se ve ningún edificio: solo árboles y rostros."""
evocation = """
El cuadro celebra una alegría colectiva: la de los empleados, las obreras, las costureras y los artistas que se reúnen el domingo para bailar. Las clases se rozan, las miradas se cruzan, se coquetea sin gravedad. Renoir ofrece de este baile una imagen feliz, sin embriaguez ni miseria, cuando el Montmartre de la época era un barrio pobre y Zola, ese mismo año, publicaba La taberna. A menudo se ha subrayado esta parte de idealización: Renoir no busca denunciar, sino mostrar que la felicidad ordinaria merece un gran lienzo. Su amigo Georges Rivière, que posó para él, defiende entonces el cuadro como un testimonio preciso de la vida parisina, digno de los lienzos de historia."""
histoire = """
El Moulin de la Galette, taberna instalada junto a los últimos molinos de la Butte, tomaba su nombre de las galettes que allí se servían. En 1876, Renoir alquila en la rue Cortot un taller con jardín, hoy museo de Montmartre, y según los recuerdos de Rivière, sus amigos lo ayudan a transportar cada día el gran lienzo hasta el baile. Esos amigos le sirven de modelos, junto con jóvenes del barrio como Estelle, en el banco, o Margot, que baila en el centro con el pintor cubano Pedro Vidal de Solares. El cuadro se presenta en la tercera exposición impresionista, en 1877. El pintor y coleccionista Gustave Caillebotte lo adquiere y luego lo lega al Estado a su muerte en 1894. Aceptado tras largas discusiones, ingresa en el Museo del Luxemburgo, luego en el Louvre y, por último, en el Museo de Orsay en su apertura, en 1986."""
facture = """
La luz es el verdadero tema: las manchas de sol filtradas por el follaje se aplican con toques de blanco, rosa y amarillo sobre las chaquetas oscuras, los vestidos, los rostros y el suelo. Las sombras son azules o violetas, nunca negras. La composición avanza en diagonal, desde el grupo de primer plano, cortado por el marco, hacia la multitud que se disuelve al fondo. Ningún punto central domina: el ojo circula de rostro en rostro, como se pasea por el baile. El negro de las ropas masculinas marca el ritmo del conjunto y hace cantar los tonos claros."""
details = [
  "Las manchas de sol rosas y amarillas sobre la chaqueta oscura del hombre visto de espaldas.",
  "Los vasos colocados sobre la mesa de primer plano, donde juega la luz.",
  "La pareja que baila en el centro izquierda, la joven de rosa.",
  "Los globos de luz suspendidos sobre la multitud.",
  "Al fondo, el mar de canotiers y de chisteras.",
]
themes = ["fiesta", "baile", "montmartre", "luz", "juventud", "domingo"]
anecdote = """
Renoir pintó una versión más pequeña de la misma escena. Subastada en Nueva York en mayo de 1990, fue adjudicada por 78,1 millones de dólares al industrial japonés Ryoei Saito, uno de los precios más altos jamás alcanzados en esa época por un cuadro."""
salle = 1
mur = "fond"
place = 1
largeur = 2.0

[[oeuvres]]
titre = "El almuerzo de los remeros"
annee = "1880–1881"
image = "dejeuner-canotiers.jpg"
technique = "Óleo sobre lienzo, 130 × 173 cm"
collection = "The Phillips Collection, Washington"
note = "En la terraza de la casa Fournaise, en Chatou: sus amigos, y Aline, su futura esposa, que juega con un perrito."
description = """
En el balcón de un restaurante a orillas del Sena, bajo un toldo de rayas rojas y blancas, una quincena de personas se demora al final de un almuerzo. La mesa, cubierta con un mantel blanco, sostiene botellas, vasos y racimos de uva. A la izquierda, una joven con sombrero de flores acerca el rostro a un perrito. Tras ella, un corpulento mozo con camiseta blanca y canotier se apoya en la balaustrada. A la derecha, en primer plano, un joven sentado a horcajadas en una silla charla con una joven y con un hombre inclinado hacia ella. En el centro, una mujer bebe de su vaso; al fondo, hombres con canotier, bombín o chistera conversan. Entre el follaje se vislumbran el río y unas velas."""
evocation = """
El cuadro es un himno a la amistad y a los nuevos ocios de los parisinos, a quienes el ferrocarril conduce en pocos minutos de la estación de Saint-Lazare a las orillas del Sena. En torno a la misma mesa se mezclan un coleccionista acaudalado, una actriz, costureras, remeros y pintores: se ha visto en ello la imagen de una sociedad más libre, donde uno se reúne por gusto más que por rango. Cada rostro es un retrato, y el conjunto parece un álbum de recuerdos. Se lee también la felicidad personal de Renoir, que coloca en primer plano a la joven de quien acaba de enamorarse. El momento elegido, el final de la comida, cuando se charla sin prisa por marcharse, dice el valor del tiempo libre."""
histoire = """
Renoir trabaja en este gran lienzo del verano de 1880 a 1881, en la casa Fournaise, restaurante y alquiler de barcas de la isla de Chatou, de la que es asiduo. Sus amigos acuden a posar uno a uno: el hijo y la hija del patrón, Alphonse y Alphonsine Fournaise, Aline Charigot, el pintor Gustave Caillebotte, la actriz Ellen Andrée, el coleccionista Charles Ephrussi, la actriz Jeanne Samary y algunos más. Los análisis muestran que modificó la composición sobre la marcha. El marchante Paul Durand-Ruel compra el cuadro y lo presenta en la séptima exposición impresionista, en 1882. Permanece en su familia hasta 1923, fecha en que el coleccionista estadounidense Duncan Phillips lo adquiere por 125 000 dólares. Se convierte en la pieza maestra de su museo de Washington, la Phillips Collection."""
facture = """
Renoir reúne en un solo lienzo el retrato de grupo, la escena de género, el bodegón y el paisaje. La mesa es un alarde: vasos, botellas y uvas centellean sobre un mantel cuyos blancos se tiñen de azul y de rosa. Las camisetas blancas de los remeros despliegan también toda una gama de blancos. La balaustrada, en diagonal, lleva el ojo hacia el fondo, mientras que el toldo cierra la composición por arriba. Los rostros están dibujados con más nitidez que en el Baile en el Moulin de la Galette, señal de que la manera de Renoir empieza a evolucionar."""
details = [
  "El perrito que Aline sostiene pegado a su rostro, en primer plano a la izquierda.",
  "El bodegón del mantel: botellas, vasos medio llenos y uvas.",
  "La joven que bebe, con el vaso ocultando la parte baja de su rostro.",
  "Al fondo, la chistera del coleccionista Charles Ephrussi.",
  "Entre el follaje, velas blancas sobre el Sena.",
]
themes = ["amistad", "remo", "sena", "ocio", "comida", "verano"]
anecdote = """
La joven que bebe en el centro es Ellen Andrée, actriz y modelo muy solicitada. Unos años antes había posado para Degas en La absenta, sentada con aire ausente en un café de la place Pigalle, una imagen mucho más sombría de la vida parisina."""
salle = 2
mur = "gauche"
place = 1
largeur = 1.9

[[oeuvres]]
titre = "Dos hermanas (En la terraza)"
annee = "1881"
image = "deux-soeurs.jpg"
technique = "Óleo sobre lienzo, 100,5 × 81 cm"
collection = "Art Institute of Chicago"
note = "Una joven y una niña con sombrero de flores, en la terraza de la casa Fournaise, frente al Sena."
description = """
En una terraza a orillas del agua, una joven está sentada, vestida con un traje azul oscuro y tocada con un sombrero rojo vivo. Ante ella, una niña con vestido blanco lleva un sombrero cubierto de flores de todos los colores. Sus manos descansan en el borde de una cesta llena de ovillos de lana. Los dos rostros, de mejillas rosadas, se vuelven hacia el espectador sin mirarlo realmente. Tras la balaustrada, una cortina de follaje y arbustos en flor deja entrever, más lejos, el agua del Sena y la orilla opuesta. Las dos figuras ocupan toda la mitad inferior del lienzo; el paisaje, arriba, parece casi un decorado tendido tras ellas."""
evocation = """
El cuadro contrapone dos edades de la vida: la infancia, aún redonda e ingenua, y la juventud que se despliega. Las flores de los sombreros responden a las del jardín, y a menudo se ha observado que Renoir asimila sus modelos femeninos a la naturaleza, a la vez frescas, decorativas y algo soñadoras, una visión que algunos historiadores juzgan hoy idealizada. La escena no tiene historia que contar: instala un momento de calma, una pausa en un día de verano, lejos de París. La obra dice también el gusto de la burguesía por las orillas del Sena, convertidas en el campo de juegos del domingo."""
histoire = """
Renoir pinta el lienzo en la primavera de 1881 en la terraza de la casa Fournaise, en Chatou, en el mismo momento en que termina El almuerzo de los remeros en el mismo lugar. El marchante Paul Durand-Ruel lo compra ya en el verano de 1881, señal de que la pintura de Renoir empieza a encontrar comprador. El cuadro se presenta en 1882 en la séptima exposición impresionista, con el título «En la terraza». Abandona luego Francia rumbo a Estados Unidos e ingresa en el Art Institute of Chicago en 1933, con la colección reunida por Annie Swan Coburn y legada en memoria suya y de su marido, Lewis Larned Coburn. Se ha convertido en una de las obras más populares del museo."""
facture = """
Los rostros y las manos, lisos y nacarados, recuerdan que Renoir comenzó como pintor de porcelana. El fondo, por el contrario, está tratado a grandes pinceladas, con toques libres de verde, azul y blanco, de modo que las figuras parecen colocadas ante un telón de fondo. Los colores son francos: el rojo del sombrero, el azul del vestido, el blanco de la niña y los tonos vivos de los ovillos forman un acorde deslumbrante. Los dos personajes se inscriben en una composición piramidal, estable y compacta."""
details = [
  "Los ovillos de lana multicolores en la cesta, en primer plano.",
  "El sombrero de la niña, cubierto de flores de todos los colores.",
  "El rojo vivo del sombrero de la joven, la mancha más intensa del cuadro.",
  "A lo lejos, entre las hojas, el agua del Sena y la otra orilla.",
  "El paso brusco entre los rostros lisos y el fondo apenas brochado.",
]
themes = ["juventud", "infancia", "chatou", "flores", "terraza"]
anecdote = """
A pesar de su título, el cuadro no representa a dos hermanas: la joven es Jeanne Darlot, que llegará a ser actriz, y la niña nunca ha sido identificada con certeza. El título «Dos hermanas» se impuso más tarde, junto al elegido por Renoir."""
salle = 2
mur = "droite"
place = 3
