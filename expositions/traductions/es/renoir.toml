[[oeuvres]]
titre = "Baile en Bougival"
annee = "1883"
image = "danse-bougival.jpg"
technique = "Óleo sobre lienzo, 181,9 × 98,1 cm"
collection = "Museum of Fine Arts, Boston"
note = "Una taberna con baile a orillas del Sena: la modelo es Suzanne Valadon, que llegará a ser pintora ella misma."
description = """
Una pareja baila en primer plano, casi de tamaño natural, bajo los árboles de una taberna al aire libre. La joven, con vestido blanco de volantes, tocada con un gorro rojo, se deja llevar, con una mano en el hombro de su pareja; su rostro sonrosado se aparta ligeramente de él. El hombre, con traje azul oscuro, se inclina hacia ella con insistencia; el ancho ala de su canotier oculta casi todo su rostro, del que solo se ve la barba. Tras ellos, otras personas están sentadas a las mesas y charlan bajo el follaje, en una luz verde y dorada. En el suelo, en primer plano, yacen cerillas y colillas. El formato muy alargado en altura concentra todo en los dos cuerpos enlazados."""
evocation = """
El cuadro capta un momento de seducción: el hombre se acerca, casi apremiante, mientras la joven aparta la cabeza, entre pudor, juego y abandono. Nada se dice, todo se sugiere, y esa ambigüedad hace el encanto de la escena. Se ven también en él los placeres populares de las orillas del Sena, adonde los parisinos acuden el domingo a beber, remar y bailar. Los detalles triviales del suelo recuerdan que la fiesta tiene sus resacas. Comparado con el Baile en la ciudad, más envarado, el Baile en Bougival expresa el impulso y la libertad de una juventud modesta, y a menudo se ha subrayado el movimiento giratorio del vals que Renoir logra sugerir."""
histoire = """
Renoir pinta el lienzo en 1883, el mismo año que los dos bailes del Museo de Orsay, de formato comparable. Bougival, pueblo de las orillas del Sena al oeste de París, era entonces célebre por sus tabernas con baile, no lejos de La Grenouillère, donde Renoir y Monet habían trabajado codo con codo en 1869. La pareja es Paul Lhote, amigo del pintor y periodista; la bailarina es Suzanne Valadon, joven modelo de Montmartre. Renoir extrae de la composición un dibujo publicado ese mismo año en la revista La Vie moderne, para ilustrar un relato de Lhote. Tras pasar por varias colecciones, el cuadro es adquirido en 1937 por el Museum of Fine Arts de Boston, del que es hoy una de las obras más célebres."""
facture = """
Renoir construye la escena sobre el contraste del azul oscuro del traje masculino y el blanco del vestido, que reaviva el rojo del gorro, colocado casi en el centro. Los contornos de las figuras son más firmes que en la época del Baile en el Moulin de la Galette, mientras que el fondo sigue tratado con toques libres y vibrantes de verde y amarillo. El movimiento nace de la inclinación de los cuerpos y del remolino del dobladillo del vestido. El formato vertical y el tamaño real de los personajes dan al espectador la impresión de estar al borde de la pista."""
details = [
  "Las cerillas y las colillas tiradas en el suelo, en primer plano.",
  "El ala del canotier que oculta casi por completo el rostro del hombre.",
  "El gorro rojo de la bailarina, destello de color en el corazón del lienzo.",
  "El bajo del vestido que gira con el movimiento del baile.",
  "Al fondo, clientes sentados a las mesas bajo los árboles.",
]
themes = ["baile", "taberna", "pareja", "seducción", "sena"]
anecdote = """
Suzanne Valadon había comenzado como acróbata de circo hasta que una caída la obligó a dejarlo; se hizo entonces modelo. En diciembre de 1883, el mismo año del cuadro, dio a luz a un hijo, Maurice, que llegará a ser el pintor Maurice Utrillo."""
salle = 3
mur = "fond"
place = 1
