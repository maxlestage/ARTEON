[[oeuvres]]
titre = "¡Independencia o muerte!"
artiste = "Pedro Américo"
annee = "1888"
image = "independencia-ou-morte.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Pedro_Am%C3%A9rico_-_Independ%C3%AAncia_ou_Morte_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 415 × 760 cm"
collection = "Museo Paulista (Museo del Ipiranga), Universidad de São Paulo"
note = "El 7 de septiembre de 1822, a orillas del Ipiranga, el príncipe Pedro proclama la independencia de Brasil. La inmensa tela mide más de siete metros: aquí se presenta reducida."
description = """
Sobre una colina de tierra roja, a orillas de un arroyo, un grupo de jinetes de \
uniforme se detiene. En el centro, montado en un caballo bayo, el príncipe Pedro alza su espada \
hacia el cielo. A su alrededor, sus compañeros agitan los sombreros. A la derecha, la \
guardia de honor, de uniformes blancos y cascos con crines, acude al galope, con los \
sables en alto, levantando polvo; algunos jinetes cruzan el arroyo, \
en primer plano. Detrás de ellos, una casa baja de tejado de tejas. A la izquierda, un \
boyero descalzo, con sombrero de paja, se ha detenido con sus bueyes y su \
carreta para contemplar la escena. Arriba, un gran cielo de nubes doradas cubre \
la mitad de la tela."""
evocation = """
La tela fija el episodio fundador de Brasil: el 7 de septiembre de 1822, cerca de São Paulo, \
el príncipe regente Pedro de Braganza, hijo del rey de Portugal, rompe con Lisboa. \
Pedro Américo hace de ello una escena heroica, ordenada como una batalla, en torno al \
gesto de la espada. Los historiadores han subrayado que embellece los hechos: el príncipe \
viajaba sin duda en una mula, con una pequeña escolta, en traje de camino. El \
propio pintor afirmaba que la realidad inspira al pintor pero no lo esclaviza. \
El boyero, a la izquierda, introduce al pueblo, simple testigo de una decisión tomada por \
las élites. Reproducida en los manuales escolares, la imagen ha moldeado para \
generaciones de brasileños la representación de su independencia."""
histoire = """
En 1886, la comisión encargada del monumento del Ipiranga, en São Paulo, acepta la oferta \
de Pedro Américo de pintar la proclamación de la independencia para el futuro edificio. \
El contrato le concede tres años; pinta la tela en Florencia, donde vive, y la \
termina en 1888, un año antes del plazo. Se presenta el 8 de abril de 1888 en \
la Academia de Bellas Artes de Florencia. Algunos críticos acusan entonces al pintor \
de haber imitado cuadros de batallas de Meissonier; los historiadores de hoy \
ven más bien un diálogo asumido con la pintura de historia de su tiempo. La tela \
se instala en el salón de honor del Museo Paulista, donde sigue \
expuesta, tras la gran restauración del museo concluida en 2022."""
facture = """
Pedro Américo, formado en Río de Janeiro y luego en París, domina todas las reglas de la \
gran pintura de historia académica. La composición se organiza en dos masas: el \
grupo del príncipe, arriba, en la colina, y la ola de la guardia, en diagonal, que \
se precipita hacia él. Los uniformes, los arreos y los caballos están detallados con \
precisión documental. El paisaje, la tierra roja y la vegetación de São Paulo, \
fueron estudiados sobre el terreno."""
details = [
  "El príncipe Pedro, con la espada en alto, en la cima de la colina.",
  "El boyero y su carreta de bueyes, testigos de la escena, a la izquierda.",
  "Los cascos de crines negras de la guardia de honor.",
  "Los jinetes que cruzan el arroyo del Ipiranga, en primer plano.",
  "La casa baja de tejado de tejas, a la derecha.",
]
themes = ["historia", "independencia", "brasil", "jinetes", "nación"]
anecdote = """
La tela, encargada para glorificar la monarquía brasileña, se termina en 1888. \
Al año siguiente, el 15 de noviembre de 1889, el emperador Pedro II, hijo del héroe del \
cuadro, es derrocado: es la República la que inaugura en 1895 el museo donde \
cuelga."""
salle = 4
mur = "nord"
place = 2
largeur = 3.6

[[oeuvres]]
titre = "Campesino cortando tabaco (Caipira picando fumo)"
artiste = "Almeida Júnior"
annee = "1893"
image = "caipira-picando-fumo.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Almeida_J%C3%BAnior_-_Caipira_Cutting_Tobacco_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 202 × 141 cm"
collection = "Pinacoteca del Estado de São Paulo"
note = "Sentado al sol ante su casa, un campesino del interior de São Paulo corta su tabaco para liar un cigarrillo."
description = """
Un hombre de edad madura está sentado en una viga de madera, ante su casa, a pleno \
sol. Lleva una camisa blanca abierta sobre el pecho y un pantalón de tela \
gris, remangado y manchado de tierra; va descalzo. Con la cabeza gacha, talla con un \
cuchillo una cuerda de tabaco negro que sostiene en la mano izquierda; tras la \
oreja, un trozo de hoja de maíz servirá para liar el cigarrillo. Detrás de él, \
el muro de la casa de bahareque se ha desconchado y deja ver los ladrillos y el \
entramado de madera; a la derecha, una puerta de tablas grises. En el suelo, tierra \
seca, piedras, virutas y la sombra de un follaje que mancha el suelo, \
abajo a la derecha."""
evocation = """
El caipira es el pequeño campesino del interior del estado de São Paulo, a menudo mestizo, \
al que los citadinos miraban entonces con desprecio. Almeida Júnior, nacido él mismo en una \
pequeña ciudad de ese interior, Itu, lo pinta a tamaño natural, como a un héroe de \
pintura de historia, pero ocupado en un gesto cotidiano y lento. El cuadro no se burla, \
no denuncia: muestra la dignidad tranquila de un hombre en su pobre \
casa, y el tiempo que pasa sin prisa. Se ve en él una de las primeras imágenes de un \
Brasil visto desde dentro, libre de la mirada europea y del exotismo. Para \
muchos historiadores, Almeida Júnior anuncia así la búsqueda de una identidad \
brasileña que los modernistas proseguirán en los años veinte."""
histoire = """
De regreso de París en 1882 tras seis años de estudios, Almeida Júnior se instala en São \
Paulo, pero pasa gran parte de su tiempo en Itu y en la campiña \
circundante. En los años 1890, abandona los temas religiosos e históricos \
por una serie de escenas de la vida de los caipiras: Caipira picando fumo, en 1893, es \
la más célebre. La tela pertenece hoy a la Pinacoteca del Estado de São \
Paulo, el museo de arte más antiguo de la ciudad, fundado en 1905, que conserva un gran \
conjunto de sus obras. Se ha convertido en una de las imágenes más conocidas de la \
pintura brasileña del siglo XIX."""
facture = """
Discípulo de Alexandre Cabanel en la Escuela de Bellas Artes de París, Almeida Júnior aplica \
el rigor del dibujo académico a un tema realista, que a menudo se compara con \
Courbet y Jules Bastien-Lepage. Su gran originalidad radica en la luz: un \
sol tropical, blanco y abrumador, que palidece los colores de la tierra y del muro y \
cava sombras nítidas. Las manos, los pies y el rostro, curtidos, están pintados \
con particular atención."""
details = [
  "El trozo de hoja de maíz prendido tras la oreja del campesino.",
  "La cuerda de tabaco negro y el cuchillo, en sus manos.",
  "Los pies descalzos posados sobre la tierra seca.",
  "El muro de bahareque desconchado, que deja ver el entramado de madera.",
  "La firma y la fecha, abajo a la derecha.",
]
themes = ["campesino", "trabajo", "sol", "brasil", "realismo"]
anecdote = """
Almeida Júnior muere trágicamente el 13 de noviembre de 1899, apuñalado en una calle de \
Piracicaba por el marido de la mujer a la que amaba, con quien lo unía el parentesco. \
Tenía cuarenta y nueve años."""
