[exposition]
ordre = 135
nom_court = "España y América"
mouvement = "España y América Latina en el siglo XIX"
cadre = "dore"
couleur = "#9a4a22"
titre = "España y América Latina, las dos orillas de una pintura"
artiste = "Fortuny, Sorolla, Casas, Zuloaga, Velasco, Herrán, Pedro Américo…"
dates = "1851–1913"
accroche = "Exposición virtual · Museo Nacional de Arte (MUNAL), Ciudad de México"
introduction = """
En el siglo XIX, mientras España busca su imagen entre la luz de \
Sorolla y la España negra de Zuloaga, las jóvenes naciones de América Latina \
inventan la suya: el valle de México de Velasco, el grito de independencia de \
Brasil, el campesino de São Paulo, el velorio de un niño en Puerto Rico. La visita reúne \
diez pintores, de Madrid y Barcelona a Ciudad de México, São Paulo, Buenos Aires y San \
Juan. El edificio se inspira en el Museo Nacional de Arte de México, instalado en un \
palacio de principios del siglo XX: un vestíbulo, un gran salón de recepción en el centro \
y unas salas que lo rodean por tres lados."""
vitrine = "paseo-orillas-mar.jpg"

[musee]
nom = "Museo Nacional de Arte (MUNAL)"
ville = "Ciudad de México, México"
architecte = "Silvio Contri"
construction = "1904–1911"
presentation = """
El Museo Nacional de Arte de México ocupa el antiguo palacio de la Secretaría de \
Comunicaciones y Obras Públicas, en la calle de Tacuba, en el centro histórico. Bajo la \
presidencia de Porfirio Díaz, el arquitecto italiano Silvio Contri lo construye a partir de \
1904 en un estilo ecléctico, que mezcla referencias neoclásicas y renacentistas: fachada \
de piedra, gran escalera de honor de doble tramo, salón de recepción con el techo pintado \
con una Alegoría del Progreso. Su fachada da a la plaza Manuel Tolsá, donde se alza el \
Caballito, la estatua ecuestre de Carlos IV, obra de Manuel Tolsá. \
El palacio se convierte en museo el 23 de julio de 1982 y es restaurado a finales de los años \
noventa. Sus salas recorren el arte mexicano desde la época colonial hasta mediados del siglo \
XX; las vistas del valle de México de José María Velasco y las telas de \
Saturnino Herrán figuran entre sus tesoros."""
ici = """
ARTEON retoma la ordenación del palacio: se entra por el sur en el vestíbulo de la \
plaza Tolsá, de muros de piedra clara, y luego en el salón de recepción, la mayor \
sala, de 24 metros de largo y 10 de alto, de muros rojo ladrillo, consagrada a \
España. Tres salas lo rodean: al oeste, la sala de México, de muros ocre; al \
este, la sala de Brasil, de un verde pálido; y al norte, por último, la sala del Río de la Plata \
y del Caribe, de muros rosa empolvado, donde concluye la visita."""

