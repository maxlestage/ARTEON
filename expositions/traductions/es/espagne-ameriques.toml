[[oeuvres]]
titre = "El velorio"
artiste = "Francisco Oller"
annee = "1893"
image = "el-velorio.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:El_Velorio_by_Francisco_Oller.jpg"
technique = "Óleo sobre lienzo, 240 × 400 cm"
collection = "Museo de Historia, Antropología y Arte, Universidad de Puerto Rico, San Juan"
note = "En una casa campesina de Puerto Rico, se celebra el velorio de un niño muerto, convertido en «angelito»: la obra maestra de Oller."
description = """
El interior de una gran choza de madera con techo de paja está lleno de gente. En el \
centro, sobre una mesa cubierta con un mantel de encaje, reposa un niño muerto, \
vestido de blanco y coronado de flores. A su alrededor, todo es fiesta: a la izquierda, \
parejas bailan, un hombre toca la guitarra, otros beben; en medio, un \
anciano encorvado sobre su bastón, un hombre que lanza su sombrero, un muchacho que retrocede \
riendo. A la derecha, un sacerdote de negro, sentado, parece incómodo, mientras un hombre \
le habla y una mujer de pañuelo blanco alza los brazos. Del techo cuelgan \
mazorcas de maíz, un racimo de plátanos, un cerdo asado. Unos perros corren por el suelo. Por las \
puertas se vislumbra el campo verde y unas palmeras."""
evocation = """
El baquiné, o velorio del angelito, era una costumbre popular de Puerto Rico, \
de origen africano y español: un niño bautizado, muerto inocente, va derecho al \
cielo, y se celebra su partida con cantos, bailes y bebidas. Oller, \
hombre de la Ilustración y del progreso, pinta esta fiesta con mirada crítica: veía en ella \
una superstición grosera, una orgía de apetitos brutales, según sus propias \
palabras. El cuadro contrapone el lado claro de la fiesta, a la izquierda, y el lado sombrío, a la \
derecha, donde los padres y el sacerdote permanecen ajenos al bullicio. Hoy se \
ve en él sobre todo un retrato colectivo de la sociedad rural puertorriqueña, \
los jíbaros, con sus negros, sus mestizos y sus blancos, y una imagen fundadora de \
la identidad de la isla."""
histoire = """
Oller comienza el cuadro en 1891 en una plantación de caña de azúcar de Carolina, \
cerca de San Juan, perteneciente a la familia Elzaburu: dos de sus miembros posan \
para el sacerdote y el sacristán, y unos trabajadores agrícolas y sus familias para las \
demás figuras. Expuesta en 1893 en San Juan, con motivo de la exposición del cuarto \
centenario del descubrimiento de Puerto Rico, la tela escandaliza a una parte de la crítica, \
que la juzga vulgar, pero el público se reconoce en ella. Se muestra después en el Salón \
de París en 1895. Propiedad de la Biblioteca Insular, es adquirida en 1915 por \
la Universidad de Puerto Rico, de cuyo museo está en el origen."""
facture = """
Oller frecuentó en París a Courbet, Pissarro y Cézanne, y el cuadro asocia estas dos \
herencias: el realismo, para esta gran escena de la vida popular pintada a \
la escala de la pintura de historia, y una luz clara, venida del \
impresionismo, que entra por las puertas y baña los muros de madera. La \
composición, pululante, multiplica las pequeñas escenas y los objetos cotidianos, a \
modo de inventario. El color es vivo, iluminado con blancos y rosas."""
details = [
  "El niño muerto coronado de flores, sobre la mesa del mantel de encaje.",
  "El cerdo asado colgado bajo el techo, por encima de las cabezas.",
  "El guitarrista sentado, a la izquierda.",
  "El paisaje verde y las palmeras, vislumbrados por la puerta y la ventana.",
  "Los dos perros que corren entre las piernas de los invitados.",
]
themes = ["velorio", "fiesta", "muerte", "puerto rico", "vida rural"]
anecdote = """
En la primera exposición del cuadro, un cronista de San Juan contó que \
numerosos visitantes afirmaban reconocer, entre los invitados del velorio, a \
parientes o vecinos."""
