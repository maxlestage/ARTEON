[[oeuvres]]
titre = "La vicaría (La boda española)"
artiste = "Marià Fortuny"
annee = "1868–1870"
image = "vicaria.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Mari%C3%A0_Fortuny_-_The_Spanish_Wedding_-_Google_Art_Project.jpg"
technique = "Óleo sobre tabla, 60 × 93,5 cm"
collection = "Museo Nacional de Arte de Cataluña, Barcelona"
note = "En la sacristía de una iglesia madrileña, una boda con trajes del siglo XVIII firma el registro: el cuadro que dio a Fortuny la fama en París."
description = """
En una amplia sala de muros adornados con tapices, acaba de celebrarse una boda. \
A la izquierda, ante unas estanterías de libros, el novio se inclina sobre la mesa para \
firmar el registro, bajo la mirada de un sacerdote de sotana negra. En el centro, la novia, con \
vestido de seda clara, espera rodeada de los testigos, de amigas con vestidos rosas y de \
hombres con trajes bordados, tricornios y calzones de satén. Tras ellos, una reja de \
hierro forjado cierra una capilla. A la derecha, sobre un banco de madera, un torero con traje de \
luces y una manola con mantilla contemplan la escena, mientras un anciano \
de torso desnudo, un religioso mendicante, atraviesa la estancia. En primer plano, un brasero de \
cobre colocado sobre el embaldosado y un papel caído en el suelo."""
evocation = """
Fortuny no pinta una boda de su tiempo: viste a sus personajes como \
en tiempos de Goya, a quien admiraba, y compone una España de fantasía, elegante y \
pintoresca, tal como los coleccionistas de París gustaban de soñarla. El cuadro \
contrapone dos mundos: la sociedad refinada de la boda, en el centro, y el pueblo, a la \
derecha, con el torero y la manola que asisten a la ceremonia como espectadores. \
Se ha visto en él una comedia de costumbres, llena de ironía: cada cual desempeña su papel, el sacerdote, \
los testigos, los curiosos. El tema cuenta, sin embargo, menos que el espectáculo de la \
pintura misma, que transforma sedas, dorados y baldosas en un centelleo \
de pinceladas. A este gusto por el detalle precioso la crítica española lo llamó \
«preciosismo»."""
histoire = """
Fortuny comienza el cuadro en Roma en 1868, poco después de su boda en Madrid con \
Cecilia de Madrazo, hija del pintor Federico de Madrazo, y lo termina en París en \
1870. Trabaja entonces bajo contrato con el gran marchante parisino Adolphe \
Goupil. Expuesta en la galería de este en la primavera de 1870, La vicaría causa \
sensación: Goupil la vende a una coleccionista, la señora Cassin, por 70 000 francos, \
uno de los precios más altos pagados entonces por un cuadro de un artista vivo. De la \
noche a la mañana, Fortuny se convierte en uno de los pintores más buscados de Europa, \
en particular por los coleccionistas estadounidenses. Tras pasar por varias colecciones, \
la tela es hoy uno de los cuadros más célebres del Museo Nacional de Arte de \
Cataluña, en Barcelona."""
facture = """
Sobre una pequeña tabla, Fortuny pinta con minuciosidad de miniaturista, con la \
punta de un pincel muy fino: cada figura mide apenas unos centímetros. La \
pincelada, viva y nerviosa, aplica toques de blanco y de oro que hacen centellear las \
sedas, los bordados y el metal. El decorado, inventado, reúne elementos que el \
pintor dibujó en iglesias y en casas de anticuarios. La luz cae desde arriba \
a la izquierda y se desliza sobre la boda, mientras los lados quedan en una penumbra dorada."""
details = [
  "El novio inclinado sobre la mesa, pluma en mano, para firmar el registro.",
  "El torero y la manola sentados en el banco, a la derecha, como simples espectadores.",
  "El brasero de cobre colocado sobre el embaldosado, en primer plano a la izquierda.",
  "El papel blanco caído en el suelo, en medio del pavimento rojo.",
  "La firma de Fortuny y la fecha, en el ángulo inferior izquierdo.",
]
themes = ["boda", "españa", "trajes", "preciosismo", "goya"]
anecdote = """
El hijo de Fortuny, Mariano Fortuny y Madrazo, nacido en 1871, se convierte en Venecia en un \
creador célebre: inventa el vestido Delphos, de seda finamente plisada, que lucían \
las elegantes de principios del siglo XX. Su palacio veneciano es hoy el museo \
Fortuny."""
salle = 2
mur = "sud"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Paseo a orillas del mar"
artiste = "Joaquín Sorolla"
annee = "1909"
image = "paseo-orillas-mar.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Joaqu%C3%ADn_Sorolla_y_Bastida_-_Strolling_along_the_Seashore_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 205 × 200 cm"
collection = "Museo Sorolla, Madrid"
note = "La esposa y la hija mayor del pintor caminan por la playa de Valencia, con los vestidos blancos levantados por el viento."
description = """
Dos mujeres vestidas de blanco caminan sobre la arena, a orillas del mar. A la izquierda, la \
mayor sujeta con la mano un gran sombrero de paja, del que escapa un largo velo \
violeta que el viento hace ondear tras ella; con la otra mano, sostiene una \
sombrilla cerrada, cuya tela se hincha. A la derecha, una joven de talle \
fino, con el cabello recogido en un moño, avanza sin sombrero y lleva este en la \
mano; su mirada se dirige hacia un lado. El pintor las ve desde un punto de vista \
ligeramente picado: no hay horizonte, solo la franja azul del mar y \
la espuma de las olas, arriba, y la arena dorada, abajo. Las sombras de las dos mujeres, \
violetas, se alargan sobre la playa."""
evocation = """
Sorolla pinta aquí a su esposa, Clotilde García del Castillo, y a su hija mayor, \
María, durante el verano de 1909, en una playa de Valencia. Todo el cuadro es una imagen \
de la felicidad familiar y del ocio de la burguesía a principios del siglo XX: se \
pasea a orillas del agua, con vestido de verano, por el placer del aire y de la luz. \
Pero el verdadero tema quizá sea el viento: levanta los velos, pega los \
vestidos, hincha la sombrilla y da a la escena un movimiento que parece captado al vuelo. \
Los blancos, que toman los reflejos azules del mar y dorados de la arena, muestran lo \
que Sorolla buscaba ante todo: pintar la luz mediterránea, la más \
deslumbrante que existe, al aire libre y sin trampas."""
histoire = """
A comienzos de 1909, Sorolla triunfa en Nueva York: la exposición que le dedica la \
Hispanic Society of America atrae a cerca de 160 000 visitantes en un mes, y la \
mayoría de las telas se venden. De regreso en España, pasa el verano en Valencia, su \
ciudad natal, con su familia, y pinta en la playa una serie de grandes cuadros, \
entre ellos este. No lo vende: la tela permanece en su casa de Madrid, construida \
en 1910 y 1911. Tras la muerte del pintor, en 1923, su viuda lega la casa y una \
gran parte de las obras al Estado español; el museo Sorolla abre allí sus puertas en \
1932. El cuadro, uno de los más queridos del museo, ha sido reproducido en innumerables \
carteles y tarjetas postales."""
facture = """
Sorolla pinta in situ, a orillas del agua, sobre un lienzo muy grande, con una pincelada \
ancha, rápida y empastada, aplicada sin retoques. Los vestidos blancos están hechos de \
decenas de matices: azul, malva, rosa, amarillo pálido, según la tela reciba el \
sol o la sombra. Las sombras, coloreadas de violeta, proceden de las lecciones del \
impresionismo, pero el dibujo sigue siendo firme. El encuadre picado, sin cielo, y el \
corte de las figuras recuerdan la fotografía y las estampas japonesas."""
details = [
  "El largo velo violeta que se escapa del sombrero de Clotilde.",
  "La sombrilla blanca que el viento hincha como una vela.",
  "El sombrero de paja que María lleva en la mano, con su cinta azul oscuro.",
  "Las sombras violetas de las dos mujeres sobre la arena.",
  "La firma y la fecha, abajo a la izquierda.",
]
themes = ["mar", "luz", "viento", "familia", "aire libre"]
anecdote = """
El suegro de Sorolla, Antonio García Peris, era fotógrafo en Valencia. Se \
conservan numerosas fotografías del pintor trabajando en la playa, ante \
telas inmensas, a veces resguardado del sol bajo una sombrilla o una tela tendida."""
salle = 2
mur = "nord"
place = 2
largeur = 2.0

[[oeuvres]]
titre = "Ramon Casas y Pere Romeu en un tándem"
artiste = "Ramon Casas"
annee = "1897"
image = "tandem.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Ramon_Casas_-_Ramon_Casas_and_Pere_Romeu_on_a_Tandem_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 191 × 215 cm"
collection = "Museo Nacional de Arte de Cataluña, Barcelona"
note = "El pintor y su amigo, dueño de la taberna Els Quatre Gats, pedalean juntos: la enseña de la bohemia modernista de Barcelona."
description = """
Dos hombres barbudos, vestidos de blanco, pedalean en un tándem, vistos de perfil, sobre un fondo \
liso color papel de estraza. Delante, Ramon Casas, tocado con un sombrero de tela, con la \
pipa en la boca, se inclina sobre el manillar, con una chaqueta oscura enrollada ante sí. \
Detrás, Pere Romeu, alto y delgado, con gorra blanca en la cabeza, se yergue y \
vuelve hacia nosotros un rostro crispado por el esfuerzo. Ambos llevan calzón \
abombado, altos calcetines rayados y zapatos bajos. La bicicleta negra, de ruedas \
finas, ocupa todo el ancho del cuadro. A lo lejos, a la izquierda, una simple línea \
dibuja la silueta de Barcelona, con una chimenea de fábrica. Arriba a la izquierda, \
unas hojas de árbol sobresalen del marco."""
evocation = """
Este doble retrato humorístico es un manifiesto. A finales del siglo XIX, la \
bicicleta es el símbolo mismo de la modernidad, de la velocidad y del deporte, y el \
tándem dice la amistad y la empresa común: Casas y Romeu acaban de lanzar \
juntos Els Quatre Gats, una taberna que será el corazón del modernismo catalán. El \
cuadro se burla con cariño de sus dos héroes, uno absorto en su pipa, el otro \
haciendo muecas, y toma el contrapié de la pintura oficial y de sus grandes temas. \
Dice también el orgullo de una Barcelona industrial, cuyas chimeneas \
aparecen en el horizonte, abierta a París y a la vanguardia. Cuando Casas lo \
sustituye, en 1901, por una tela en la que los dos amigos van en automóvil, la \
broma se convierte en una imagen del paso de un siglo a otro."""
histoire = """
Pere Romeu, que había frecuentado el cabaret del Chat Noir en París, abre en junio de 1897, \
con el apoyo de Casas y de Santiago Rusiñol, la taberna Els Quatre Gats, en la \
planta baja de la Casa Martí, un edificio neogótico del arquitecto Josep Puig \
i Cadafalch. Casas pinta este gran cuadro para decorar la sala. Según varias \
fuentes, una inscripción en catalán, hoy cortada, figuraba en el lado derecho. \
En 1901, la tela es sustituida por Ramon Casas y Pere Romeu en automóvil, y la \
revista Pèl & Ploma reproduce las dos imágenes como el fin del siglo XIX y el comienzo \
del XX. El cuadro pasa después a manos privadas; el museo de Barcelona lo adquiere en \
1963. Una copia adorna hoy la taberna, que sigue abierta."""
facture = """
Casas se inspira aquí en el cartel, arte del que es uno de los maestros en España: \
contornos negros marcados, planos de color, un fondo liso dejado casi vacío, como \
el papel de una litografía. La tela, apenas preparada, se transparenta en algunos puntos. \
El dibujo, de gran seguridad, lo dice todo en pocas líneas: la tensión de las piernas, \
la espalda encorvada, el esfuerzo. Solo los rostros, los calcetines rayados y los detalles de la \
bicicleta están tratados con mayor precisión."""
details = [
  "La pipa de Casas, delante, inclinado sobre el manillar.",
  "La mirada de Pere Romeu, vuelta hacia el espectador.",
  "La silueta de Barcelona y su chimenea de fábrica, a la izquierda, en el horizonte.",
  "El farol fijado en la parte delantera del tándem.",
  "Los calcetines rayados de colores vivos de los dos ciclistas.",
]
themes = ["bicicleta", "amistad", "modernismo", "humor", "barcelona"]
anecdote = """
En febrero de 1900, Els Quatre Gats acoge la primera exposición individual de un \
joven pintor de dieciocho años, Pablo Picasso, asiduo de la taberna: cuelga allí \
una serie de retratos de sus amigos, dibujados en respuesta a los célebres retratos al \
carboncillo de Casas."""
salle = 2
mur = "nord"
place = 6
largeur = 2.15

[[oeuvres]]
titre = "Las brujas de San Millán"
artiste = "Ignacio Zuloaga"
annee = "1907"
image = "brujas-san-millan.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Las_brujas_de_San_Mill%C3%A1n_-_Ignacio_Zuloaga_Zabaleta.jpg"
technique = "Óleo sobre lienzo, 204 × 198 cm"
collection = "Museo Nacional de Bellas Artes, Buenos Aires"
note = "Siete viejas de Castilla, agrupadas en la noche: la España negra de Zuloaga, adquirida por Buenos Aires en 1910."
description = """
Sobre un fondo de colinas sombrías, bajo un cielo de noche, siete viejas se \
mantienen muy juntas unas a otras. A la izquierda, dos mujeres de pie, vestidas de \
negro: una, de perfil, sostiene una rueca; la otra, de gruesas gafas redondas, \
lleva una cesta de mimbre en el brazo. En el centro, dos mujeres sentadas en el suelo, \
envueltas en mantones pardos y rojos, alzan los ojos. A la derecha, una mujer encorvada \
sobre su bastón asoma la cabeza de su manto, y otra, envuelta en un mantón verde, con los \
ojos entornados, permanece inmóvil; una última, en primer plano, se ve de espaldas. Ante \
ellas, en el suelo, un farol de hojalata. Una luz fría golpea los \
rostros arrugados y las manos nudosas."""
evocation = """
El título habla de brujas, pero el cuadro no muestra ninguna magia: solo \
campesinas ancianas, con sus herramientas y sus pobres ropas, a quienes la noche y \
la iluminación vuelven inquietantes. Zuloaga retoma una tradición española, la de las \
brujas y las viejas de Goya, para pintar una Castilla ruda, pobre e \
inmóvil. Es la España que los escritores de la generación del 98, tras la \
pérdida de las últimas colonias, querían mirar de frente, lejos del folclore feliz. \
La crítica de la época oponía de buen grado esta España negra de Zuloaga a \
la España blanca y luminosa de Sorolla. Los rostros, pintados con respeto, \
dan sin embargo a estas mujeres una dignidad grave, casi escultórica."""
histoire = """
Zuloaga pinta la tela en los últimos meses de 1907 en Segovia, donde vive su tío, el \
ceramista Daniel Zuloaga; hace posar a viejas segovianas y a criadas de \
su tío. El cuadro se presenta en 1908 en el Salón de la Sociedad Nacional de \
Bellas Artes, en París, y después en Nueva York en 1909. En 1910, Zuloaga es el pintor más \
representado de la Exposición Internacional de Arte del Centenario, en Buenos Aires, que \
celebra los cien años de la Revolución de Mayo: muestra allí treinta y seis obras. Con \
esa ocasión, el Estado argentino adquiere varias de sus telas, entre ellas esta, para el \
Museo Nacional de Bellas Artes, donde sigue hoy."""
facture = """
Zuloaga compone su cuadro como una escena de teatro: las figuras se destacan sobre \
un fondo plano, casi un decorado pintado. La luz, fría y violenta, cae sobre las \
cabezas como un foco, a la manera de los tenebristas españoles del siglo XVII. \
Los colores son apagados, negros, pardos, verdes mortecinos y rojos oscuros, y el \
dibujo, muy marcado, subraya cada arruga. Las figuras se organizan en triángulos, \
en torno a las dos mujeres sentadas."""
details = [
  "Las gafas redondas de la mujer de pie, que le dan un aire extraño.",
  "La rueca cargada de lana, a la izquierda.",
  "El farol de hojalata colocado en primer plano.",
  "La mujer encorvada sobre su bastón, que asoma la cabeza de su manto.",
]
themes = ["vejez", "castilla", "noche", "españa negra", "brujas"]
anecdote = """
Zuloaga era también coleccionista: poseía en su taller de París una gran \
tela del Greco, hoy en el Metropolitan Museum de Nueva York con el título \
La apertura del quinto sello. El joven Picasso la vio allí; se la cita a menudo entre \
las fuentes de Las señoritas de Avignon."""
salle = 2
mur = "sud"
place = 6
largeur = 2.0

[[oeuvres]]
titre = "El valle de México desde el cerro de Santa Isabel"
artiste = "José María Velasco"
annee = "1875"
image = "valle-de-mexico.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jos%C3%A9_Mar%C3%ADa_Velasco_-_The_Valley_of_Mexico_from_the_Santa_Isabel_Mountain_Range_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 137,5 × 226 cm"
collection = "Museo Nacional de Arte (MUNAL), Ciudad de México"
note = "Desde lo alto de una colina, el valle de México se extiende hasta los volcanes nevados: el paisaje convertido en emblema de la nación."
description = """
La mirada parte de una colina cubierta de rocas rojas y de matorrales, en \
primer plano, y se hunde sobre una inmensa llanura. A la izquierda, al pie de las rocas, una \
mujer indígena de falda roja, con una carga a la espalda, camina con un niño. Más \
lejos, un montículo redondeado oculta una parte del valle; tras él se extienden las \
aguas pálidas del lago de Texcoco y unas tierras llanas donde se adivinan caminos y, \
al fondo, la ciudad de México. En el horizonte, a la izquierda, se alzan los dos \
volcanes cubiertos de nieve, el Popocatépetl y el Iztaccíhuatl. El cielo ocupa casi \
la mitad de la tela: grandes nubes blancas y grises se acumulan en él, y un chaparrón \
cae a lo lejos, a la derecha."""
evocation = """
Velasco no pinta solo un hermoso panorama: hace del valle de México, \
cuna de la antigua Tenochtitlan de los aztecas y corazón del país, una imagen de la \
nación entera. Los volcanes, ligados a una leyenda de amantes desdichados, la ciudad, \
los lagos y la mujer indígena en primer plano reúnen la naturaleza, la historia y \
el pueblo. En un México que apenas sale de las guerras de la Reforma y de \
la intervención francesa, este paisaje apacible y grandioso propone una imagen de unidad \
y de orgullo. Los historiadores ven en él también la mirada de un científico: cada roca, \
cada planta, cada nube está observada con la exactitud de un naturalista. El \
cuadro se ha convertido en uno de los símbolos visuales de México."""
histoire = """
Velasco vive al pie del Tepeyac, al norte de la ciudad de México, y recorre sin cesar las \
colinas que dominan el valle. Entre 1875 y 1892, pinta una docena de \
vistas, y esta, tomada desde el cerro de Santa Isabel, es la más célebre. Sus \
grandes paisajes representan después a México en las exposiciones internacionales, en \
Filadelfia, París y Chicago, y le valen una fama que rebasa su país. \
La tela pertenece hoy al Museo Nacional de Arte, en la ciudad de México, que conserva el \
conjunto más importante de sus obras. En 2025, la National Gallery de Londres \
dedicó a Velasco una exposición, la primera que ha consagrado a un artista \
de América Latina."""
facture = """
Discípulo del paisajista italiano Eugenio Landesio en la Academia de San Carlos, Velasco \
construye su cuadro con rigor: un primer plano oscuro y detallado, un valle \
que se aclara a medida que se aleja, montañas azuladas en el horizonte. La \
perspectiva aérea, que palidece los colores a lo lejos, da una impresión \
de espacio inmenso. Su formación científica se lee en la precisión de las rocas, de \
la vegetación y de las nubes. Algunos elementos, como las cumbres, están recompuestos \
de memoria."""
details = [
  "Los dos volcanes nevados, a la izquierda, en el horizonte.",
  "La mujer de falda roja y el niño que descienden por el sendero, abajo a la izquierda.",
  "El chaparrón que cae bajo las nubes, a lo lejos a la derecha.",
  "Las aguas pálidas del lago de Texcoco, en medio de la llanura.",
]
themes = ["paisaje", "valle", "volcanes", "nación", "méxico"]
anecdote = """
En la Academia de San Carlos, donde enseña perspectiva y paisaje, Velasco tuvo \
entre sus alumnos al joven Diego Rivera, que más tarde le rindió homenaje \
como a uno de sus maestros."""
