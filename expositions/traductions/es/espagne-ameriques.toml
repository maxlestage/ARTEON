[[oeuvres]]
titre = "La ofrenda"
artiste = "Saturnino Herrán"
annee = "1913"
image = "la-ofrenda.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Saturnino_Herr%C3%A1n_-_The_offering_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 182 × 210 cm"
collection = "Museo Nacional de Arte (MUNAL), Ciudad de México"
note = "Para el día de Muertos, una familia cruza los canales de Xochimilco en una barca cargada de flores de cempasúchil."
description = """
Una larga barca de fondo plano, una trajinera, se desliza sobre el agua verde de un canal. \
Está cargada de gruesos manojos de flores anaranjadas, los cempasúchiles, o claveles \
de las Indias. De pie en el centro, un joven de camisa blanca, con un tallo en la mano, \
lleva un ramo al hombro. Tras él, un anciano de bigote blanco y \
gran sombrero sostiene la larga pértiga que hace avanzar la barca. A la izquierda, un hombre \
barbudo, con la cabeza gacha, se envuelve en su sarape; a la derecha, una mujer sentada, de \
espaldas, lleva un bebé dormido en su rebozo, y una niña nos mira. Al \
fondo, bajo los arcos de madera de la barca, otras embarcaciones cargadas \
de gente se suceden por el canal."""
evocation = """
En México, para el día de Muertos, a principios de noviembre, se adornan las tumbas y los \
altares con cempasúchil, la flor anaranjada cuyo color y perfume guían, según se dice, \
las almas de los difuntos. Herrán reúne en la barca todas las edades de la vida: el bebé, \
la niña, el joven, la mujer, los dos ancianos. Se ha visto en ello una imagen del \
río de la vida que lleva a cada uno hacia la muerte, tema grave tratado sin lo macabro. La \
tela está pintada en 1913, en plena revolución mexicana, y algunos historiadores leen en ella \
la inquietud de un país en guerra. Afirma sobre todo una identidad nueva: \
la de un México mestizo e indígena, digno y recogido, que Herrán sitúa en el centro \
de la gran pintura."""
histoire = """
Saturnino Herrán tiene veintiséis años cuando pinta La ofrenda, en la ciudad de México, donde hizo \
toda su carrera sin salir nunca a estudiar a Europa. Formado en la Academia de San \
Carlos, busca pintar temas mexicanos con los medios de la pintura \
moderna de su tiempo, la del simbolismo y el modernismo. Los canales de Xochimilco, \
al sur de la capital, donde circulan aún las trajineras cargadas de flores y de \
verduras, le proporcionan el escenario. El cuadro es hoy una de las obras más \
conocidas del Museo Nacional de Arte, que conserva buena parte de la \
producción del artista, muerto a los treinta y un años."""
facture = """
Herrán combina un dibujo sólido y académico, aprendido en San Carlos, con un color \
decorativo: verdes y ocres mates, casi apagados, sobre los que estalla \
el naranja vivo de las flores. La composición, muy apretada, corta las figuras y la \
barca con los bordes del marco y estrecha a los personajes en primer plano. El punto de \
vista picado y la línea de horizonte situada muy alta recuerdan las búsquedas de los \
pintores europeos del Art Nouveau y del simbolismo."""
details = [
  "Los manojos de cempasúchil anaranjado, que llenan toda la parte baja de la barca.",
  "El bebé dormido en el rebozo de su madre, a la derecha.",
  "La mirada grave de la niña, vuelta hacia nosotros.",
  "La fila de barcas cargadas de gente, a lo lejos, arriba a la izquierda.",
  "La firma y la fecha, abajo a la izquierda.",
]
themes = ["día de muertos", "flores", "edades de la vida", "xochimilco", "méxico"]
anecdote = """
Herrán dejó inconclusa su gran obra, Nuestros dioses, un friso previsto para el nuevo \
Teatro Nacional de México: en el centro, imaginaba a la diosa azteca Coatlicue \
fundida con Cristo en la cruz, imagen del México mestizo."""
