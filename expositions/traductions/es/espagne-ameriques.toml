[[oeuvres]]
titre = "Retrato de Manuelita Rosas"
artiste = "Prilidiano Pueyrredón"
annee = "1851"
image = "manuelita-rosas.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Retrato_de_Manuelita_Rosas_-_Prilidiano_Pueyrred%C3%B3n.jpg"
technique = "Óleo sobre lienzo, 199 × 166 cm"
collection = "Museo Nacional de Bellas Artes, Buenos Aires"
note = "La hija del gobernador Juan Manuel de Rosas, con vestido rojo, color del partido federal: un retrato oficial encargado por los partidarios del régimen."
description = """
Una joven morena está de pie, de cuerpo entero, en un salón de cortinajes oscuros. \
Lleva un gran vestido de terciopelo rojo con volantes, cubierto de encajes \
blancos bordados, y lazos en la cintura; los hombros descubiertos. Una \
diadema brilla en su cabello, adornado con una flor roja, y un collar de piedras \
rodea su cuello; brazaletes de oro ciñen sus muñecas. Su mano derecha se apoya \
en una consola de mármol, sobre una carta; a su lado, un gran jarrón de porcelana \
con un ramo de flores. A la derecha, un sillón tapizado de terciopelo rojo. El \
rostro, apenas sonriente, se vuelve hacia nosotros con dulzura."""
evocation = """
Manuela Rosas, llamada Manuelita, es la hija de Juan Manuel de Rosas, que gobierna \
Buenos Aires con mano de hierro desde los años 1830. Anfitriona de su padre, \
pasaba por suavizar el régimen e interceder en favor de los perseguidos. El retrato \
es una imagen política: el rojo, llamado punzó, es el color de los federales, el partido \
de Rosas, que todos debían llevar so pena de resultar sospechosos. La carta colocada bajo su \
mano recuerda su papel de intermediaria, a quien se dirigían súplicas. Pero \
Pueyrredón, procedente de una familia largo tiempo exiliada bajo Rosas, pinta también a una mujer \
real, de rostro sencillo y benévolo, lejos de un icono. Pocos meses después, \
el régimen se derrumbaba."""
histoire = """
En 1850, una comisión de partidarios de Rosas decide ofrecer a Manuelita su \
retrato y confía su ejecución al joven Prilidiano Pueyrredón. El formato y el \
color del vestido le son impuestos. El pintor hace observar que el efecto del rojo \
punzó sería desastroso; se decide entonces cubrir el vestido de encajes para \
atenuar su brillo. El retrato debe presentarse durante un homenaje a Manuelita, en \
1851. En febrero de 1852, Rosas es derrotado en Caseros y se exilia en Inglaterra con su \
hija. En 1903, el marido de Manuelita, Máximo Terrero, dona el cuadro al Museo \
Histórico Nacional; pasa después al Museo Nacional de Bellas Artes de Buenos \
Aires, en los años treinta."""
facture = """
Pueyrredón sigue la tradición del retrato de aparato europeo: figura de cuerpo entero, \
cortinajes, mobiliario lujoso, fondo oscuro que hace resaltar el vestido. Cuida las \
materias con virtuosismo: el terciopelo profundo, la transparencia de los encajes, el brillo \
de las joyas y de la porcelana. El rostro, en cambio, está tratado con sencillez, \
sin adulación. Se conserva también un estudio preparatorio de la cabeza en el Museo \
Nacional de Bellas Artes."""
details = [
  "La carta deslizada bajo la mano derecha de Manuelita.",
  "Los encajes blancos que cubren el vestido rojo para atenuar su brillo.",
  "La flor roja y la pequeña diadema en su cabello.",
  "El jarrón de porcelana decorado con oro y su ramo, a la izquierda.",
]
themes = ["retrato", "poder", "rojo", "argentina", "política"]
anecdote = """
En Argentina, el 3 de noviembre, aniversario de la muerte de Prilidiano Pueyrredón en \
1870, es el Día Nacional del Artista Plástico, en homenaje a quien se \
considera el primer gran pintor del país."""
