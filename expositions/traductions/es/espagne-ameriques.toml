largeur = 3.6

[[artistes]]
nom = "Marià Fortuny"
vie = "Reus (Cataluña), 11 de junio de 1838 – Roma, 21 de noviembre de 1874"
biographie = """
Marià Fortuny i Marsal, huérfano muy joven, es criado en Reus por su abuelo, \
artesano. A los catorce años, ingresa en la escuela de la Llotja de Barcelona. En 1857, una \
beca lo lleva a Roma. Tres años después, la Diputación de Barcelona lo envía a \
Marruecos para seguir la guerra que España libra allí: descubre la luz del norte de \
África, que nutrirá toda su obra, y pinta La batalla de Tetuán. Sus escenas \
orientalistas y sus cuadros de género con trajes del siglo XVIII seducen al \
marchante parisino Goupil, que le ofrece un contrato. En 1867, se casa en Madrid con \
Cecilia de Madrazo, hija del pintor Federico de Madrazo. El éxito de La vicaría, en \
1870, lo convierte en uno de los pintores más caros de Europa. Se instala después en \
Granada, cerca de la Alhambra, y luego en Portici, cerca de Nápoles, en busca de una \
pintura más libre. Muere en Roma, a los treinta y seis años, víctima de la malaria."""
style = """
Fortuny es el maestro del «preciosismo»: cuadros de pequeño formato, de una \
virtuosidad deslumbrante, donde la pincelada viva y los toques luminosos hacen centellear \
los tejidos y los objetos. Acuarelista y grabador de primer orden, influyó en \
toda una generación de pintores españoles e italianos, y sus últimas obras, \
pintadas al aire libre, anuncian la pintura de luz de Sorolla."""

[[artistes]]
nom = "Joaquín Sorolla"
vie = "Valencia (España), 27 de febrero de 1863 – Cercedilla, 10 de agosto de 1923"
biographie = """
Joaquín Sorolla y Bastida pierde a sus padres, víctimas del cólera, a los dos \
años; lo crían una tía y un tío cerrajero en Valencia. Estudia en \
la escuela de bellas artes de la ciudad, obtiene en 1885 una beca para Roma y \
reside en París, donde descubre el naturalismo y la pintura al aire libre. En 1888, \
se casa con Clotilde García del Castillo, hija de un fotógrafo, que será su modelo \
toda la vida; tienen tres hijos. Instalado en Madrid, se da a conocer con \
cuadros de tema social y luego triunfa con sus escenas de playa: gran premio en \
la Exposición Universal de París en 1900, exposición en la galería Georges Petit en \
1906 y, sobre todo, en la Hispanic Society of America de Nueva York en 1909. Su \
fundador, Archer Huntington, le encarga Visión de España, catorce inmensos \
lienzos sobre las regiones del país, terminados en 1919. En junio de 1920, mientras pinta \
en su jardín, lo golpea una hemiplejía; ya no volverá a pintar y muere tres años \
más tarde."""
style = """
Sorolla es el pintor de la luz mediterránea. Trabajando al aire libre sobre \
grandes lienzos, con una pincelada ancha, rápida y segura, capta el sol sobre el \
mar, los reflejos sobre los cuerpos mojados y las telas blancas. Próximo al \
impresionismo sin adoptar su pincelada dividida, conserva un dibujo firme. Su \
«luminismo» marcó la pintura española y tuvo un inmenso éxito en América."""

[[artistes]]
nom = "Ramon Casas"
vie = "Barcelona, 4 de enero de 1866 – Barcelona, 29 de febrero de 1932"
biographie = """
Ramon Casas i Carbó nace en una familia acomodada de Barcelona, enriquecida en Cuba. A \
los quince años, parte a París y entra en el taller del retratista Carolus-Duran. \
Reparte después su vida entre París y Barcelona y vive un tiempo en Montmartre, \
sobre el Moulin de la Galette, con su amigo Santiago Rusiñol. De regreso en \
Cataluña, se convierte con él en el cabeza de fila del modernismo: apoya la \
taberna Els Quatre Gats, abierta en 1897, y funda revistas como Pèl & Ploma. \
Pintor de la vida moderna, pinta también temas graves de la actualidad, como \
una ejecución pública a garrote o una carga de la guardia civil contra \
obreros. Realiza una larga galería de retratos al carboncillo de las personalidades \
de su tiempo y se convierte en un cartelista afamado, para el anís del Mono o el \
champán Codorníu. Pasa sus últimos años entre Barcelona y su casa de \
Sant Benet de Bages, donde se casa en 1922 con su antigua modelo, Júlia Peraire."""
style = """
Casas aúna la elegancia del retrato mundano, aprendida junto a Carolus-Duran, y la \
mirada directa de los pintores de la vida moderna, Manet o Degas. Su dibujo, de gran \
seguridad, y su sentido de la composición, nutrido por el cartel y la estampa \
japonesa, dan a sus obras una modernidad inmediata. Hizo entrar a la \
pintura catalana en la Europa de la Belle Époque."""

[[artistes]]
nom = "Ignacio Zuloaga"
vie = "Eibar (País Vasco), 26 de julio de 1870 – Madrid, 31 de octubre de 1945"
biographie = """
Ignacio Zuloaga y Zabaleta nace en una familia de artesanos célebres por sus \
metales damasquinados; su tío Daniel es ceramista en Segovia. Tras una estancia en \
Roma, se instala en 1890 en París, donde se relaciona con Rusiñol, Casas, y después con \
Rodin y el pintor Émile Bernard. Poco reconocido al principio en España, reside en \
Andalucía y luego sobre todo en Castilla, en Segovia, donde encuentra sus modelos: campesinos, \
enanos, toreros, gitanos, viejas. Se casa en 1899 con Valentine Dethomas, hermana \
de un pintor francés. Sus envíos a los Salones de París, y luego sus exposiciones en \
Europa, en América del Sur y en Estados Unidos, le procuran una gloria \
internacional, mientras la crítica española le reprocha dar una imagen \
sombría del país. Gran aficionado al arte, posee telas del Greco y de Goya. En \
1925, adquiere el castillo de Pedraza, en Castilla, y funda un museo en Zumaia, \
en el País Vasco. Muere en Madrid en 1945."""
style = """
Zuloaga pinta una España áspera y dramática, heredada del Greco, de Velázquez y de \
Goya: figuras monumentales, dibujo marcado, colores apagados, paisajes de Castilla \
bajo cielos de tormenta. Próximo a los escritores de la generación del 98, fijó \
la imagen de una España negra y austera, opuesta a la luz de Sorolla, y \
fue uno de los pintores españoles más célebres de su tiempo."""

[[artistes]]
nom = "José María Velasco"
vie = "Temascalcingo (México), 6 de julio de 1840 – Villa de Guadalupe Hidalgo, 26 de agosto de 1912"
biographie = """
José María Velasco Gómez nace en una familia modesta del Estado de México, que \
se instala pronto en la capital. Ingresa en 1858 en la Academia de San Carlos, donde \
el paisajista italiano Eugenio Landesio le enseña la pintura de paisaje y la \
perspectiva. Apasionado por las ciencias, estudia también botánica, zoología y \
geología, se hace miembro de la Sociedad Mexicana de Historia Natural e ilustra sus \
publicaciones con láminas de plantas y aves. Sucede a Landesio como \
profesor en San Carlos, donde forma a numerosos alumnos. Instalado en Guadalupe, al \
pie del Tepeyac, pinta incansablemente el valle de México, sus volcanes, sus lagos \
y sus haciendas, pero también los ferrocarriles y los puentes que transforman el \
país. Sus telas representan a México en las exposiciones internacionales de \
Filadelfia en 1876, de París en 1889 y de Chicago en 1893. Muere en 1912, \
al comienzo de la revolución mexicana."""
style = """
Velasco es el gran paisajista de México. A la composición clásica aprendida de \
Landesio, añade la observación de un naturalista: geología de las rocas, especies \
vegetales, formación de las nubes. Sus vastos panoramas, de luz límpida, \
dieron al país una imagen de sí mismo e hicieron del paisaje un género nacional, que \
retomarán los pintores del siglo XX."""

[[artistes]]
nom = "Saturnino Herrán"
vie = "Aguascalientes (México), 9 de julio de 1887 – Ciudad de México, 8 de octubre de 1918"
biographie = """
Saturnino Herrán Guinchard es hijo de un profesor de Aguascalientes, que alienta \
su don para el dibujo. Tras la muerte de su padre, a principios de siglo, se instala \
con su madre en la ciudad de México e ingresa en la Academia de San Carlos. Sigue allí las enseñanzas del \
pintor catalán Antonio Fabrés, y luego de Germán Gedovius, y se codea con otros estudiantes \
llamados a un gran futuro, como Diego Rivera. Para vivir, trabaja como \
dibujante y enseña dibujo. Sin salir nunca de México, se forja una \
manera personal, nutrida del simbolismo y del Art Nouveau europeos, que pone al \
servicio de temas mexicanos: trabajadores, mujeres del pueblo, leyendas indígenas, \
fiestas populares. En 1914, se casa con Rosario Arellano, que le da un hijo. Ese mismo \
año, emprende un vasto proyecto decorativo, Nuestros dioses, para el nuevo Teatro \
Nacional. Una enfermedad del estómago se lo lleva en 1918, a los treinta y un años, antes de que \
pudiera terminarlo."""
style = """
Herrán es el principal representante del modernismo mexicano. Asocia un dibujo \
académico sólido a un color decorativo, de tonos mates iluminados con toques vivos, \
y a composiciones apretadas y monumentales. Al hacer de los indígenas y de los mestizos \
los héroes de la gran pintura, prepara el terreno del muralismo mexicano de los \
años veinte."""

[[artistes]]
nom = "Pedro Américo"
vie = "Areia (Brasil), 29 de abril de 1843 – Florencia, 7 de octubre de 1905"
biographie = """
Pedro Américo de Figueiredo e Melo nace en la provincia de Paraíba, en el \
Nordeste de Brasil. Niño prodigio del dibujo, acompaña a los diez años una expedición \
científica por el interior del país y luego ingresa en la Academia Imperial de \
Bellas Artes de Río de Janeiro. Gracias a una beca del emperador Pedro II, parte a \
estudiar a París, en la Escuela de Bellas Artes, y sigue también cursos de ciencias y de \
filosofía; obtiene un doctorado en la universidad de Bruselas. De regreso en \
Brasil, enseña en la Academia Imperial y pinta grandes escenas de historia, \
entre ellas La batalla de Avaí, episodio de la guerra del Paraguay, que suscita polémica. Se \
instala después en Florencia, donde pinta ¡Independencia o muerte!. Tras la \
proclamación de la República, es elegido diputado de la Asamblea Constituyente en \
1890. Autor de novelas y ensayos, vuelve a vivir en Italia, donde muere en \
1905."""
style = """
Pedro Américo es el gran pintor de historia del Brasil imperial. Formado en las reglas \
académicas europeas, compone vastas telas de puestas en escena \
espectaculares, detalladas con precisión documental. Sus imágenes, reproducidas \
en los manuales escolares, fijaron en la memoria colectiva los grandes episodios \
de la historia nacional, desde la independencia hasta la guerra del Paraguay."""

[[artistes]]
nom = "Almeida Júnior"
vie = "Itu (Brasil), 8 de mayo de 1850 – Piracicaba, 13 de noviembre de 1899"
biographie = """
José Ferraz de Almeida Júnior nace en Itu, pequeña ciudad del interior del estado de \
São Paulo. Notado muy pronto por sus dibujos, ingresa en 1869 en la Academia \
Imperial de Bellas Artes de Río de Janeiro, donde es alumno de Victor Meirelles. \
De regreso en Itu, abre un taller de retratista. En 1876, el emperador Pedro II, \
de paso por la ciudad, ve sus obras y le concede una pensión para estudiar en \
Europa. En París, entra en el taller de Alexandre Cabanel en la Escuela de \
Bellas Artes y expone en el Salón. De vuelta en Brasil en 1882, se instala en São Paulo, \
pinta retratos, escenas religiosas e históricas, y da clases. Pero \
es pintando la vida de los caipiras, los campesinos del interior, como encuentra su \
camino, en los años 1890: Caipira picando fumo, La lectura, Saudade. Su carrera \
se interrumpe bruscamente en 1899, cuando es asesinado en Piracicaba."""
style = """
Almeida Júnior aplica el oficio académico aprendido en París a temas brasileños \
de lo cotidiano. Su realismo, atento a los gestos, a los rostros y a los interiores \
modestos, y su luz tropical, blanca y cruda, lo convierten en el primer pintor en \
mirar el Brasil rural sin exotismo. Los modernistas brasileños de los años veinte \
lo saludaron como un precursor."""

[[artistes]]
nom = "Prilidiano Pueyrredón"
vie = "Buenos Aires, 24 de enero de 1823 – San Isidro, 3 de noviembre de 1870"
biographie = """
Prilidiano Pueyrredón es hijo de Juan Martín de Pueyrredón, héroe de \
la independencia y director supremo de las Provincias Unidas del Río de la Plata. Opuesta \
al gobernador Juan Manuel de Rosas, su familia vive exiliada en Europa y en Brasil \
durante gran parte de su juventud. Estudia en París ingeniería y \
arquitectura, a la vez que se forma en la pintura, y reside en Río de Janeiro. \
De regreso en Buenos Aires en 1849, pinta allí el retrato de Manuelita Rosas, que lo \
hace célebre. Tras la caída de Rosas, trabaja como arquitecto e ingeniero, \
en particular en la reforma de la Pirámide de Mayo, en 1856, en la plaza principal de \
la ciudad. Pinta numerosos retratos de la buena sociedad, pero también escenas \
del campo argentino, con sus gauchos y sus estancias, y desnudos que causan \
escándalo. Pasa sus últimos años en su casa de San Isidro, a orillas del Río de \
la Plata, donde muere a los cuarenta y siete años."""
style = """
Pueyrredón es considerado el primer gran pintor argentino. Retratista \
atento, formado en las lecciones del academicismo europeo, cuida las materias y el \
parecido. En sus escenas rurales, de luz clara y observación \
precisa, fija por primera vez la vida de la pampa, abriendo el camino a una \
pintura nacional."""

[[artistes]]
nom = "Francisco Oller"
vie = "San Juan (Puerto Rico), 17 de junio de 1833 – San Juan, 17 de mayo de 1917"
biographie = """
Francisco Manuel Oller y Cestero nace en una familia acomodada de San Juan, entonces \
colonia española. Aprende el dibujo en su ciudad y luego parte a estudiar a Madrid, en \
la Academia de San Fernando, con Federico de Madrazo. En 1858, se instala en \
París, entra en el taller de Thomas Couture y frecuenta la Academia Suiza, donde traba \
amistad con Camille Pissarro, nacido como él en el Caribe, y con Paul \
Cézanne. Admira a Courbet y expone en el Salón. Entre varias estancias en Europa, \
vuelve a Puerto Rico, donde abre una academia de dibujo y pintura. Defensor de \
la abolición de la esclavitud y de la instrucción pública, pinta los paisajes, las \
plantaciones y la gente de su isla, y bodegones de frutas tropicales. En \
los años 1880, se establece definitivamente en Puerto Rico. Allí pinta El velorio y \
La escuela del maestro Rafael Cordero, homenaje a un maestro negro. Muere en San Juan \
en 1917."""
style = """
Oller es uno de los raros pintores latinoamericanos que se codearon con los \
impresionistas desde sus comienzos. Su arte asocia el realismo de Courbet, en la \
elección de temas populares, y la luz clara y la pincelada libre de los \
impresionistas. Se le considera el padre de la pintura puertorriqueña y uno \
de los primeros en haber dado al arte del Caribe una identidad propia."""
