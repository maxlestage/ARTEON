[[oeuvres]]
titre = "La habitación azul"
artiste = "Suzanne Valadon"
annee = "1923"
image = "chambre-bleue.jpg"
technique = "Óleo sobre lienzo, 90 × 116 cm"
collection = "Centro Pompidou, París (depósito en el Museo de Bellas Artes de Limoges)"
note = "Una odalisca de nuevo cuño: en pijama de rayas, con un cigarrillo en los labios y libros a su lado, no posa para nadie."
description = """
Una mujer morena, de formas plenas, está tumbada en una cama cubierta con una colcha \
azul de grandes hojas blancas y amarillas. Lleva una camiseta rosa de finos tirantes y \
un pantalón de pijama de anchas rayas verdes y blancas; tiene los pies desnudos. \
Apoyada en una gran almohada blanca, con un cigarrillo en la comisura de los labios, \
mira hacia otro lado, absorta en sus pensamientos. A la izquierda, dos libros, uno \
rojo y otro amarillo, descansan sobre la cama. Unos cortinajes azules enmarcan la \
escena como un telón de teatro, ante un muro tapizado con motivos vegetales de tonos \
apagados, rosas, ocres y verdes. Abajo a la izquierda, la firma y la fecha."""
evocation = """
Valadon retoma un tema antiguo de la pintura, la mujer tendida, de la Venus de Urbino \
de Tiziano a la Olympia de Manet, y lo invierte. Su modelo no está desnuda, ni se \
ofrece, ni está idealizada: va vestida para su comodidad, fuma, ha leído o va a leer, y \
no se preocupa por el espectador. Los libros colocados junto a ella señalan una vida \
interior. A menudo se ha visto en este lienzo una imagen de la libertad de la mujer \
moderna de los años veinte, pintada por una artista que había sido ella misma modelo \
de Renoir, de Puvis de Chavannes o de Toulouse-Lautrec, y que conocía desde dentro la \
mirada de los pintores sobre el cuerpo femenino."""
histoire = """
Suzanne Valadon pinta La habitación azul en 1923, en París, a punto de cumplir sesenta \
años, en el momento en que su pintura alcanza por fin el éxito entre los marchantes y \
los coleccionistas. El cuadro entra en las colecciones nacionales ya en los años veinte, \
signo de un reconocimiento oficial poco común para una pintora en vida. Pertenece hoy \
al Centro Pompidou, Museo Nacional de Arte Moderno, que lo ha depositado en el Museo \
de Bellas Artes de Limoges, en el Lemosín natal de la artista. Ha sido una de las \
obras estelares de la gran retrospectiva dedicada a Valadon, presentada en el Centro \
Pompidou-Metz en 2023 y después en el Centro Pompidou de París en 2025."""
facture = """
Valadon perfila sus formas con un trazo oscuro y marcado, herencia de su oficio de \
dibujante, alentado por Degas. Dentro de estos contornos, el color se aplica en planos \
francos y saturados: el azul profundo de las telas, el verde ácido de las rayas, el \
rosa de la camiseta. Los motivos decorativos de la colcha y del papel pintado, casi tan \
presentes como la figura, recuerdan a Matisse, pero Valadon rechaza toda elegancia \
convencional: el cuerpo es robusto, los pies anchos, el rostro sin afeites. La figura \
se extiende a todo lo ancho del lienzo."""
details = [
  "El cigarrillo en los labios, detalle entonces considerado poco apropiado en una mujer.",
  "Los dos libros, rojo y amarillo, colocados a la izquierda sobre la cama.",
  "El trazo oscuro que perfila el brazo, la pierna y los pies desnudos.",
  "Las hojas blancas de la colcha azul, aplicadas como plantillas.",
  "La firma y la fecha, abajo a la izquierda.",
]
themes = ["mujer", "modernidad", "interior", "odalisca", "libertad"]
anecdote = """
Antes de ser pintora, Suzanne Valadon se llamaba Marie-Clémentine. Según la tradición, \
fue Toulouse-Lautrec quien le puso el sobrenombre de Suzanne, en alusión al episodio \
bíblico de Susana y los viejos, porque posaba para pintores mayores que ella."""
