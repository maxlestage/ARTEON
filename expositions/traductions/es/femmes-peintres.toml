[exposition]
ordre = 105
nom_court = "Mujeres pintoras"
mouvement = "Mujeres pintoras, siglos XVI–XX"
cadre = "dore"
couleur = "#8a3a5c"
titre = "Mujeres pintoras, cuatro siglos de miradas"
artiste = "Anguissola, Leyster, Kauffman, Morisot, Cassatt, Valadon…"
dates = "1555–1923"
accroche = "Exposición virtual · National Museum of Women in the Arts, Washington"
introduction = """
Durante siglos, las mujeres fueron mantenidas al margen de las academias, de los \
talleres y de las clases de dibujo del natural con modelo desnudo: las que pintaron lo \
hicieron a fuerza de talento y de tenacidad, a menudo gracias a un padre o a un marido \
artista. Esta visita reúne a diez de ellas, desde la Cremona de 1555 hasta el París de \
los años veinte: retratos de familia, escenas de género, flores, autorretratos que \
reivindican un oficio, impresionismo y modernidad. El edificio se inspira en el \
National Museum of Women in the Arts de Washington, antiguo templo masónico convertido \
en 1987 en el primer gran museo dedicado a las mujeres artistas: se entra por su gran \
vestíbulo de mármol con entreplanta, antes de pasar a los salones."""
vitrine = "berceau.jpg"

[musee]
nom = "National Museum of Women in the Arts"
ville = "Washington, Estados Unidos"
architecte = "Waddy Butler Wood"
construction = "1907–1908"
presentation = """
En 1981, la coleccionista Wilhelmina Cole Holladay y su marido Wallace fundan en \
Washington un museo dedicado a las mujeres artistas, entonces casi ausentes de las \
grandes colecciones. En 1983 compran un antiguo templo masónico, levantado en 1907–1908 \
a pocas calles de la Casa Blanca, en estilo neorrenacentista, por el arquitecto Waddy \
Butler Wood. Restaurado, el edificio abre al público en 1987. Su corazón es el gran \
vestíbulo, una sala de aparato de mármol de dos plantas de altura, iluminada por \
lámparas de araña, desde la que una doble escalera sube hacia la entreplanta. Las \
galerías presentan una colección de varios miles de obras, del Renacimiento a nuestros \
días, de Lavinia Fontana y Clara Peeters a Frida Kahlo y Louise Bourgeois. Tras dos \
años de renovación, el museo reabrió sus puertas en octubre de 2023."""
ici = """
ARTEON retoma la disposición del templo. El gran vestíbulo, una sala luminosa de 16 \
metros por 14 y 10 metros de altura, recibe al visitante por el sur. Al oeste se abre el \
Salón I · Las pioneras, de paredes rosa empolvado. Al norte, dos puertas abiertas en el \
muro del fondo, allí donde sube la doble escalera del museo real, conducen a La \
entreplanta · Las impresionistas, tan amplia como el vestíbulo pero aquí a la misma \
altura, y de 6,5 metros de alto. Se regresa por último, a través del vestíbulo, hacia el \
este y el Salón II · Luz y libertad, de paredes color crema. Los dos salones, de 5,5 \
metros de alto, son más íntimos."""

