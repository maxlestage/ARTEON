[[artistes]]
nom = "Sofonisba Anguissola"
vie = "Cremona, hacia 1532 – Palermo, 16 de noviembre de 1625"
biographie = """
Sofonisba es la mayor de las seis hijas de Amilcare Anguissola, un pequeño noble culto \
de Cremona, en Lombardía, que hace instruir a todos sus hijos. Aprende pintura con \
Bernardino Campi, y luego con Bernardino Gatti: un aprendizaje con un maestro, \
excepcional para una joven. Su padre da a conocer sus obras a personajes influyentes; \
el propio Miguel Ángel, según las fuentes de la época, la anima y comenta sus dibujos. \
En 1559, su reputación le vale ser llamada a la corte de España, en Madrid, como dama \
de compañía de la joven reina Isabel de Valois, esposa de Felipe II, a quien enseña a \
dibujar; allí pinta numerosos retratos de la familia real. Casada a comienzos de la \
década de 1570 con un noble siciliano, Fabrizio de Moncada, se instala en Sicilia. \
Viuda, se casa con un capitán de navío genovés, Orazio Lomellino, y vive en Génova y \
después en Palermo. En 1624, muy anciana y casi ciega, recibe la visita del joven \
Antoon van Dyck, que la dibuja y anota sus palabras sobre la pintura. Muere en Palermo \
al año siguiente, con más de noventa años."""
style = """
Anguissola renueva el retrato haciendo entrar en él la vida: sonrisas, miradas \
intercambiadas, gestos captados del natural, allí donde la tradición prefería la pose \
solemne. Sus numerosos autorretratos, ante el caballete, ante el clavicémbalo o con un \
libro en la mano, hacen de ella una de las primeras artistas en construir su propia \
imagen. Atenta a lo natural y a los detalles, en la tradición lombarda, demostró que \
una mujer podía alcanzar una fama europea y abrió el camino a las retratistas de \
corte."""

[[artistes]]
nom = "Judith Leyster"
vie = "Haarlem, bautizada el 28 de julio de 1609 – Heemstede, 10 de febrero de 1660"
biographie = """
Judith Leyster nace en Haarlem en 1609 en una familia de cerveceros y pañeros; el \
nombre de la cervecería paterna, la Estrella Polar (Leyster), se convierte en el de la \
familia. Ya en 1628, cuando no tiene veinte años, un cronista de la ciudad la cita \
entre los pintores de talento. Trabaja en el entorno de Frans Hals, sin que se sepa si \
fue su alumna. En 1633 es admitida como maestra en el gremio de San Lucas de Haarlem, \
lo que le permite regentar un taller y formar aprendices. En 1635 lleva ante el gremio \
una disputa que la enfrenta a Frans Hals, quien había acogido a un aprendiz que se \
marchó de su casa sin autorización. En 1636 se casa con el pintor Jan Miense Molenaer; \
la pareja se instala en Ámsterdam y luego regresa a Heemstede, cerca de Haarlem. Madre \
de varios hijos, pinta desde entonces mucho menos, pero participa sin duda en los \
negocios de su marido. Muere en 1660. Olvidada durante más de dos siglos, con sus obras \
atribuidas a Hals o a Molenaer, es redescubierta en 1893 por el historiador Cornelis \
Hofstede de Groot."""
style = """
Leyster sobresale en las escenas de género: músicos, bebedores, niños que juegan, a \
menudo iluminados con vela o con farol. Su pincelada viva y libre recuerda a la de \
Frans Hals, hasta el punto de que sus cuadros le fueron atribuidos durante mucho \
tiempo, pero sus escenas nocturnas y sus interiores más íntimos, como La proposición, \
en la que un hombre ofrece dinero a una mujer que cose, revelan una mirada propia. \
Firmaba con un monograma, sus iniciales atravesadas por una estrella."""

[[artistes]]
nom = "Rachel Ruysch"
vie = "La Haya, 3 de junio de 1664 – Ámsterdam, 12 de agosto de 1750"
biographie = """
Rachel Ruysch nace en La Haya en 1664 y crece en Ámsterdam, en un medio erudito: su \
padre, Frederik Ruysch, profesor de anatomía y de botánica, posee un célebre gabinete \
de curiosidades repleto de especímenes naturales, que ella observa desde la infancia. \
Su madre, Maria Post, es hija del arquitecto Pieter Post. Hacia los quince años entra \
como aprendiz con Willem van Aelst, uno de los mejores pintores de flores de \
Ámsterdam. En 1693 se casa con el retratista Juriaen Pool, con quien tiene diez hijos, \
sin dejar nunca de pintar. En 1701 es admitida con su marido en la cofradía de pintores \
de La Haya. De 1708 a 1716 es pintora de la corte del elector palatino Juan Guillermo, \
en Düsseldorf, que le encarga cuadros para sí mismo y para sus allegados. Tras la \
muerte del elector, regresa a Ámsterdam. Su carrera dura casi setenta años: celebrada \
por los poetas en vida, pinta hasta pasados los ochenta años y muere en Ámsterdam en \
1750."""
style = """
Ruysch lleva la naturaleza muerta de flores a un refinamiento extremo: composiciones \
asimétricas y movidas, ramos que parecen desbordar el marco, fondo oscuro del que \
brotan los colores. Cada flor, cada insecto, cada gota de agua está resuelto con una \
exactitud de naturalista, heredada del medio científico de su padre. Pintados con \
lentitud y relativamente poco numerosos, sus cuadros figuraban entre los más buscados \
de su tiempo."""

[[artistes]]
nom = "Angelica Kauffman"
vie = "Coira (Suiza), 30 de octubre de 1741 – Roma, 5 de noviembre de 1807"
biographie = """
Hija del pintor Joseph Johann Kauffman, Angelica nace en Coira, en los Grisones, y \
crece entre Suiza, Austria e Italia, adonde su padre la lleva según los encargos. Niña \
prodigio, habla varios idiomas, canta y pinta desde la adolescencia. En Italia, en \
Florencia, Roma y Nápoles, copia a los maestros antiguos y frecuenta los círculos \
neoclásicos; en 1764 retrata al historiador del arte Johann Joachim Winckelmann. En \
1766 se instala en Londres, donde conoce un éxito inmediato como retratista y pintora \
de historia, entabla amistad con Joshua Reynolds y se convierte, en 1768, en uno de los \
miembros fundadores de la Royal Academy. En 1781 se casa con el pintor decorador \
Antonio Zucchi y se establece en Roma al año siguiente. Su taller de la via Sistina se \
convierte en lugar de encuentro de la Europa culta: Goethe, durante su viaje a Italia, \
la frecuenta asiduamente. Muere en Roma en 1807, y sus solemnes funerales son \
organizados por el escultor Antonio Canova."""
style = """
Kauffman es una de las grandes figuras del neoclasicismo. Se atreve con la pintura de \
historia, el género más prestigioso, casi reservado a los hombres, y elige de buen \
grado heroínas de la Antigüedad y de la literatura. Sus figuras de perfiles puros, sus \
ropajes flexibles, sus colores suaves y sus composiciones en friso fueron ampliamente \
difundidos por el grabado y reproducidos en porcelana, muebles y decoraciones \
interiores, en particular las del arquitecto Robert Adam."""

[[artistes]]
nom = "Adélaïde Labille-Guiard"
vie = "París, 11 de abril de 1749 – París, 24 de abril de 1803"
biographie = """
Hija de un comerciante parisino, Adélaïde Labille se forma primero en la miniatura con \
François-Élie Vincent, luego en el pastel con Maurice Quentin de La Tour y, por último, \
en la pintura al óleo con el hijo de su primer maestro, François-André Vincent. Casada \
en 1769 con Louis-Nicolas Guiard, se separa de él una decena de años más tarde. \
Miembro de la Academia de San Lucas, expone allí con éxito sus pasteles y sus \
retratos. El 31 de mayo de 1783 es recibida en la Academia Real de Pintura y Escultura. \
En 1787 se convierte en primera pintora de Mesdames, las tías de Luis XVI. Durante la \
Revolución, pinta a diputados de la Asamblea Constituyente y aboga por la admisión de \
las mujeres en la Academia y por su formación. En 1793 debe destruir un gran lienzo \
encargado por el conde de Provenza, hermano del rey, que se había vuelto sospechoso. \
Sigue enseñando, rodeada de sus alumnas, se casa en 1800 con François-André Vincent, \
compañero de siempre, y muere en París en 1803."""
style = """
Pastelista virtuosa antes de pasar al óleo, Labille-Guiard es una retratista de gran \
franqueza: adula poco a sus modelos y da con precisión los rostros, las telas y los \
accesorios. Sus retratos de aparato rivalizan con los de Vigée Le Brun, con un \
realismo más sobrio. Por su enseñanza y su compromiso, contribuyó a abrir a las \
mujeres el acceso a la formación artística."""

[[artistes]]
nom = "Berthe Morisot"
vie = "Bourges, 14 de enero de 1841 – París, 2 de marzo de 1895"
biographie = """
Hija de un alto funcionario, Berthe Morisot crece en París en un medio acomodado. Con \
su hermana Edma, toma lecciones de dibujo y luego copia a los maestros en el Louvre; \
las dos jóvenes reciben los consejos de Camille Corot, que las inicia en la pintura al \
aire libre. Berthe expone en el Salón desde 1864. En 1868 conoce a Édouard Manet, que \
la pinta en varias ocasiones, en particular en El balcón. En 1874 rompe con el Salón y \
participa en la primera exposición de los impresionistas; ese mismo año se casa con \
Eugène Manet, hermano del pintor, que apoya su carrera. Su hija Julie nace en 1878. \
Miembro de los más fieles del grupo, Morisot cuenta entre sus amigos a Degas, Monet, \
Renoir y el poeta Stéphane Mallarmé. En 1894, el Estado adquiere uno de sus lienzos \
para el Museo del Luxemburgo. Muere al año siguiente, a los cincuenta y cuatro años, \
de una enfermedad contraída al cuidar de su hija."""
style = """
Morisot tiene la pincelada más libre del impresionismo: pinceladas rápidas, a menudo \
en zigzag, que a veces dejan ver el lienzo y dan a sus cuadros el aspecto de un \
boceto. Pinta sobre todo la vida de las mujeres y de los niños de su entorno, \
interiores, jardines, tocados, en una luz clara y armonías de blancos nacarados. \
Reducida durante mucho tiempo al papel de modelo de Manet, hoy es reconocida como una \
de las figuras principales del movimiento."""

[[artistes]]
nom = "Mary Cassatt"
vie = "Allegheny City (Pensilvania), 22 de mayo de 1844 – Le Mesnil-Théribus (Oise), 14 de junio de 1926"
biographie = """
Nacida cerca de Pittsburgh en una familia acomodada, Mary Cassatt pasa parte de su \
infancia en Europa. Estudia en la Pennsylvania Academy of the Fine Arts de Filadelfia y \
se instala en París en 1866, pese a las reticencias de su padre. Copia a los maestros \
en el Louvre, viaja por Italia, España y los Países Bajos, y expone en el Salón a \
partir de 1868. En 1877, Edgar Degas la invita a unirse a los impresionistas: expone \
con ellos en 1879, 1880, 1881 y 1886, única estadounidense del grupo. A partir de la \
década de 1880 se dedica sobre todo al tema de la madre y el niño. En 1890, una gran \
exposición de estampas japonesas en la Escuela de Bellas Artes le inspira una serie de \
grabados en color de gran modernidad. Asesora de ricos coleccionistas estadounidenses, \
en particular Louisine y Henry Havemeyer, contribuye a hacer entrar el impresionismo \
en los museos de Estados Unidos. Aquejada de cataratas, debe dejar de pintar hacia \
1914 y muere en 1926 en su castillo de Beaufresne, en el Oise."""
style = """
Cassatt une el rigor del dibujo, aprendido de los maestros antiguos y de Degas, al \
color claro de los impresionistas. Sus escenas de mujeres y de niños, encuadradas de \
cerca, captan los gestos cotidianos con acierto y sin sentimentalismo. La influencia \
de las estampas japonesas se lee en sus composiciones descentradas, sus planos de \
color y sus líneas nítidas, sobre todo en sus grabados en color de 1890-1891."""

[[artistes]]
nom = "Eva Gonzalès"
vie = "París, 19 de abril de 1849 – París, 6 de mayo de 1883"
biographie = """
Hija del novelista Emmanuel Gonzalès, que presidió la Sociedad de Gente de Letras, Eva \
Gonzalès crece en París en un medio de escritores y artistas. A partir de 1866 sigue \
las clases del pintor Charles Chaplin, que dirige un taller reservado a las mujeres. \
En 1869 se convierte en alumna de Édouard Manet y posa para él: el retrato que este \
expone en el Salón de 1870 la muestra con vestido blanco, pintando ante un caballete. \
Ella misma debuta en el Salón ese mismo año. Como su maestro, no participa en las \
exposiciones impresionistas y sigue presentando sus obras en el Salón oficial, pese a \
los rechazos. Pinta escenas de la vida moderna, retratos, pasteles y naturalezas \
muertas, a menudo con su hermana Jeanne como modelo. En 1879 se casa con el grabador \
Henri Guérard. Muere en mayo de 1883, a los treinta y cuatro años, pocos días después \
del nacimiento de su hijo y poco después de la muerte de Manet. Una exposición \
retrospectiva le es dedicada en París ya en 1885."""
style = """
Gonzalès permanece fiel a la manera de Manet: contrastes francos, negros profundos, \
planos de color luminosos, figuras nítidamente recortadas. Sus temas son los de la \
vida moderna, palcos de teatro, interiores, mujeres en su tocador, tratados con una \
elegancia contenida. Con los años, su paleta se aclara y sus pasteles ganan en \
suavidad al contacto con el impresionismo, sin que adopte nunca la pincelada dividida \
de sus amigos."""

[[artistes]]
nom = "Suzanne Valadon"
vie = "Bessines-sur-Gartempe (Alto Vienne), 23 de septiembre de 1865 – París, 7 de abril de 1938"
biographie = """
Marie-Clémentine Valadon nace en el Lemosín, hija natural de una lencera que pronto se \
instala en París. Crece en Montmartre, encadena pequeños oficios, trabaja un tiempo en \
un circo y luego se convierte, adolescente, en modelo de pintores: Pierre Puvis de \
Chavannes, Auguste Renoir, Henri de Toulouse-Lautrec. Los observa y dibuja de forma \
autodidacta. En 1883 da a luz a un hijo, el futuro pintor Maurice Utrillo. Edgar Degas, \
a quien muestra sus dibujos, la anima, le compra láminas y la inicia en el grabado. En \
1894 es la primera mujer admitida en la Sociedad Nacional de Bellas Artes. Casada en \
1896 con Paul Mousis, un hombre de negocios acomodado, se dedica poco a poco a la \
pintura al óleo. Hacia 1909 lo deja por André Utter, pintor amigo de su hijo y \
veintiún años más joven que ella, con quien se casa en 1914. En los años veinte conoce \
por fin el éxito, expone con regularidad y vende bien. Muere en París en 1938."""
style = """
Valadon dibuja ante todo, y su pintura conserva la fuerza del trazo: contornos oscuros \
y marcados perfilan cuerpos sólidos, pintados sin idealización. Sus desnudos \
femeninos, obra de una mujer que había sido ella misma modelo, rompen con la tradición \
de la mirada masculina. Sus colores vivos y sus fondos decorativos la acercan a \
Gauguin y a los nabis, pero no se adscribió a ningún grupo y siguió una vía muy \
personal."""

[[artistes]]
nom = "Anna Ancher"
vie = "Skagen (Dinamarca), 18 de agosto de 1859 – Skagen, 15 de abril de 1935"
biographie = """
Anna Brøndum nace en Skagen, pequeño puerto pesquero en el extremo norte de Jutlandia, \
donde sus padres regentan la posada de la localidad. A partir de la década de 1870, el \
lugar atrae a pintores llegados en busca de la excepcional luz de esta costa, y la \
posada se convierte en su punto de encuentro. La joven Anna dibuja en medio de ellos; \
sigue después, en Copenhague, de 1875 a 1878, las clases de la escuela de dibujo para \
mujeres del paisajista Vilhelm Kyhn. En 1880 se casa con el pintor Michael Ancher, uno \
de los artistas de la colonia; su hija Helga nace en 1883. Aunque a menudo se esperaba \
de una mujer casada que abandonara la pintura, ella prosigue su obra. En 1888-1889 \
estudia en París con Pierre Puvis de Chavannes. Expone en Dinamarca y en el \
extranjero y se convierte en una de las pintoras más apreciadas de su país. Pasa casi \
toda su vida en Skagen, donde su casa, conservada tal como ella la dejó, es hoy un \
museo."""
style = """
Anna Ancher es la pintora de la luz en los interiores. Representa la vida cotidiana de \
Skagen, mujeres trabajando, ancianos, niños, estancias atravesadas por el sol, con una \
atención constante a los colores y a los reflejos. Su gusto por los colores puros y las \
formas simplificadas, más audaz que el de muchos pintores de la colonia, anuncia la \
pintura moderna. Sigue siendo una de las grandes figuras de la pintura danesa."""
