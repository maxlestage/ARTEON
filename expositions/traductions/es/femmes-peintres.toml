[[oeuvres]]
titre = "Autorretrato con dos alumnas"
artiste = "Adélaïde Labille-Guiard"
annee = "1785"
image = "autoportrait-deux-eleves.jpg"
technique = "Óleo sobre lienzo, 210,8 × 151,1 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "A tamaño natural, con vestido de raso, la pintora se muestra trabajando rodeada de dos alumnas: un alegato en favor del lugar de las mujeres en el arte."
description = """
En un taller sumido en la penumbra, una mujer elegante está sentada ante un gran \
caballete, del que solo se ve el reverso del lienzo. Lleva un vestido de raso gris \
azulado de reflejos plateados y un sombrero de paja adornado con plumas de avestruz y \
cintas azules. Con la paleta y los pinceles en una mano y un pincel en la otra, y el \
largo tiento deslizado bajo el brazo, se vuelve hacia nosotros como si fuéramos su \
modelo. Detrás de su sillón de terciopelo verde, dos jóvenes permanecen muy juntas: una \
nos mira, la otra observa atentamente el lienzo. Al fondo, en la sombra, se adivinan un \
busto de hombre anciano y una estatuilla de mujer con ropajes. A la derecha, sobre un \
taburete de terciopelo rojo, hay unos rollos de papel y una tela rosa."""
evocation = """
La obra es un manifiesto. Dos años antes, Labille-Guiard fue admitida en la Academia \
Real de Pintura, que no aceptaba a más de cuatro mujeres a la vez y cuya escuela seguía \
cerrada a las alumnas. Al pintarse a tamaño natural, en un formato reservado por lo \
común a los retratos de aparato, rodeada de dos jóvenes a las que ella misma forma, \
afirma que una mujer puede no solo pintar, sino también enseñar y transmitir. Su \
elegante atuendo responde asimismo a los rumores malintencionados que atribuían su \
talento a la ayuda de un hombre: es ella quien sostiene el pincel. Se ve por último una \
imagen de solidaridad: las dos alumnas abrazadas forman con su maestra una pequeña \
comunidad de artistas, y la mirada de una de ellas nos toma por testigos."""
histoire = """
Adélaïde Labille-Guiard expone el cuadro en el Salón de 1785, en el Louvre. Las dos \
alumnas están identificadas: Marie-Gabrielle Capet, que llegará a ser una retratista \
reconocida y permanecerá junto a su maestra hasta la muerte de esta, y Marie-Marguerite \
Carreaux de Rosemond, fallecida joven en 1788. El busto del fondo representa al padre \
de la artista. En 1790, en plena Revolución, Labille-Guiard toma la palabra en la \
Academia para pedir que las mujeres puedan ser admitidas sin límite de número. El \
cuadro permanece en su familia hasta principios del siglo XX y después pasa a \
colecciones privadas; es donado al Metropolitan Museum of Art de Nueva York en 1953 por \
Julia A. Berwind."""
facture = """
Formada en el pastel junto a Maurice Quentin de La Tour, Labille-Guiard se muestra aquí \
como una virtuosa colorista al óleo: el raso del vestido, con sus pliegues quebrados y \
sus reflejos plateados, es un alarde de maestría. Cada materia está diferenciada: la \
paja, la pluma, el terciopelo, la madera del caballete, el yeso del busto. La \
composición piramidal culmina en las cabezas de las alumnas y se equilibra con la gran \
oblicua del caballete, a la izquierda. La luz, procedente de la izquierda, recorta a \
las tres mujeres sobre un fondo pardo verdoso casi uniforme."""
details = [
  "En el montante del caballete, abajo a la izquierda, la firma y la fecha.",
  "Los reflejos plateados del raso, logrados con toques de blanco puro.",
  "Las plumas de avestruz del sombrero, que ondulan sobre la cabeza.",
  "Al fondo, en la sombra, el busto del padre de la artista.",
  "Sobre el taburete de terciopelo rojo, los rollos de papel y la tela rosa.",
]
themes = ["autorretrato", "taller", "enseñanza", "academia", "solidaridad"]
anecdote = """
El 31 de mayo de 1783, la Academia Real recibió el mismo día a Adélaïde Labille-Guiard \
y a Élisabeth Vigée Le Brun. El público se divirtió contraponiendo a las dos \
retratistas como rivales: una era la protegida de María Antonieta; la otra se \
convertiría en 1787 en la pintora de las tías del rey, las Mesdames."""
salle = 1
mur = "nord"
position = -0.2
largeur = 1.7

[[oeuvres]]
titre = "La partida de ajedrez"
artiste = "Sofonisba Anguissola"
annee = "1555"
image = "partie-d-echecs.jpg"
technique = "Óleo sobre lienzo, 72 × 97 cm"
collection = "Museo Nacional, Poznań"
note = "Tres hermanas de la artista y su criada en torno a un tablero de ajedrez: juegan, sonríen, se miran, algo poco común en un retrato de 1555."
description = """
Ante un gran árbol y un paisaje abierto, tres jóvenes ricamente vestidas se reúnen en \
torno a una mesa cubierta con una alfombra oriental, sobre la que descansa un tablero \
de ajedrez. A la izquierda, la mayor, Lucia, con vestido de brocado anaranjado, apoya \
una mano en el tablero y alza los ojos hacia nosotros, serena y segura de sí. Frente a \
ella, Minerva, de negro y oro, levanta la mano como para conceder la partida o para \
protestar. Entre ambas, la pequeña Europa observa a su hermana con una amplia sonrisa \
divertida. Detrás de Minerva, una anciana criada inclina la cabeza para seguir el \
juego. Los collares de perlas, los tocados bordados y los encajes de los cuellos \
hablan del rango de la familia. Al fondo se extiende un paisaje azulado de colinas, \
agua y aldeas, casi una vista de ensueño."""
evocation = """
El tema es una afirmación discreta: el ajedrez pasaba por ser un juego de inteligencia \
y de estrategia, apreciado por los hombres y por las cortes. Mostrar a unas hermanas \
que juegan, y una de las cuales dirige visiblemente la partida, equivale a celebrar su \
ingenio tanto como su gracia. Se ha visto en ello un reflejo de la excepcional \
educación que Amilcare Anguissola dio a sus seis hijas: letras, música, pintura. La \
mirada de Lucia, vuelta hacia fuera, parece dirigirse a la propia pintora, como una \
complicidad entre hermanas. Sobre todo, la obra mezcla retrato y escena de género: \
rostros identificables, pero captados en un instante vivo, con sonrisas y gestos que \
los retratos de la época, rígidos y solemnes, apenas mostraban."""
histoire = """
Sofonisba Anguissola tiene algo más de veinte años cuando pinta este lienzo, en \
Cremona, en la casa familiar. Lo firma y lo fecha en el borde del tablero, en latín, \
presentándose como hija de Amilcare. Hacia 1566, el historiador Giorgio Vasari, de \
paso por Cremona, ve el cuadro en casa de su padre y lo describe con admiración: las \
figuras, escribe en esencia, parecen vivas y solo les falta la palabra. El lienzo pasa \
después por varias grandes colecciones, entre ellas la de Luciano Bonaparte, hermano de \
Napoleón, antes de ser adquirido en París en 1823 por el conde polaco Atanazy \
Raczyński. Su colección se presenta hoy en el Museo Nacional de Poznań, en Polonia."""
facture = """
Anguissola pinta cada rostro con la precisión de una retratista, pero los enlaza \
mediante una red de miradas y de gestos que circula de una figura a otra. Las telas \
están tratadas con esmero: reflejos del brocado, bordados de oro, perlas, encajes. Las \
figuras, cortadas a media altura por la mesa, ocupan el primer plano ante un paisaje \
de lejanías azuladas, al modo de los pintores lombardos y venecianos. El tablero en \
perspectiva y las manos finamente dibujadas muestran la formación recibida en Cremona \
con Bernardino Campi y luego con Bernardino Gatti."""
details = [
  "En el borde del tablero, la inscripción latina que lleva la firma y la fecha.",
  "La mano levantada de Minerva, a la derecha, que parece ceder o reclamar.",
  "La amplia sonrisa de la pequeña Europa, rara en un retrato del siglo XVI.",
  "La alfombra oriental que cubre la mesa, con sus motivos geométricos.",
  "El rostro arrugado de la criada, en el extremo derecho.",
]
themes = ["familia", "hermanas", "juego", "ajedrez", "renacimiento"]
anecdote = """
Fue a finales del siglo XV, en España y en Italia, cuando la reina del ajedrez se \
convirtió en la pieza más poderosa del juego, capaz de recorrer todo el tablero. Cuando \
Sofonisba pinta a sus hermanas, esa «dama» omnipotente existía desde hacía solo unas \
décadas."""
salle = 2
mur = "nord"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "Autorretrato"
artiste = "Judith Leyster"
annee = "hacia 1630"
image = "autoportrait-leyster.jpg"
technique = "Óleo sobre lienzo, 74,6 × 65,1 cm"
collection = "National Gallery of Art, Washington"
note = "Con el pincel en la mano, se vuelve hacia nosotros sonriendo: una joven pintora segura de su talento, ante el violinista que está pintando."
description = """
Una joven está sentada de tres cuartos, con el brazo derecho apoyado en el respaldo de \
su silla, y se vuelve hacia nosotros con la boca entreabierta como si fuera a hablar. \
Viste un traje oscuro de mangas de seda rosa violáceo, una inmensa gorguera de encaje \
blanco y una toca clara que le despeja la frente. Con la mano derecha sostiene un \
pincel muy fino cuya punta casi toca el lienzo; con la izquierda, su paleta y un puñado \
de pinceles. A la derecha, en el caballete, hay un cuadro en curso: un violinista \
risueño, tocado con una boina azul, toca balanceándose. El fondo es un muro pardo \
grisáceo liso, donde nada distrae del rostro, de las manos y de la obra."""
evocation = """
Este retrato es una demostración. Leyster se muestra en él doblemente: como retratista, \
por su propio rostro vivo y sonriente, y como pintora de género, por el alegre músico \
del caballete, tema que hacía el éxito de los talleres de Haarlem. La boca abierta y la \
pose distendida rompen con la dignidad rígida de los retratos de la época y recuerdan \
el arte de Frans Hals. Se ha observado a menudo que no viste ropa de trabajo: la \
gorguera y la seda dicen que se presenta como una mujer respetable y acomodada, y no \
como una simple artesana. Se lee en ello el orgullo de una joven que reivindica un \
oficio casi enteramente masculino, y el derecho a sobresalir en él."""
histoire = """
Leyster tiene unos veinte años cuando pinta este cuadro, en Haarlem. Se piensa que lo \
presentó al ingresar, en 1633, en el gremio de San Lucas de la ciudad, siendo una de \
las primeras mujeres admitidas como maestra: puede entonces abrir un taller y formar \
aprendices. Tras su muerte, su nombre se desvanece; sus cuadros, firmados con un \
discreto monograma, se venden como obras de Frans Hals. Solo en 1893 el historiador \
neerlandés Cornelis Hofstede de Groot le devuelve su obra. Este retrato entra en 1949 \
en la National Gallery of Art de Washington, donación de Robert Woods Bliss y su \
esposa, ya correctamente atribuido a la artista."""
facture = """
La pincelada es rápida, visible, resuelta: el encaje de la gorguera está hecho de \
pequeños acentos blancos aplicados en superficie, los reflejos de la seda con unas \
pocas pinceladas. Leyster aprendió esta libertad en el entorno de Frans Hals. Opone el \
rostro, modelado con suavidad, al violinista del caballete, pintado de forma más \
sumaria, como un boceto. La gama es sobria, de grises, negros y blancos, avivada por el \
rosa de la manga y el rojo de la falda. La diagonal del brazo y del pincel une a la \
artista con su obra."""
details = [
  "El pincel finísimo, sostenido con ligereza, cuya punta roza el lienzo.",
  "El encaje de la gorguera, logrado con pequeños toques blancos.",
  "El violinista de la boina azul, que ríe mientras toca.",
  "La paleta y el puñado de pinceles, abajo a la derecha.",
  "El respaldo de la silla, cortado por el borde izquierdo del cuadro.",
]
themes = ["autorretrato", "taller", "música", "siglo de oro", "haarlem"]
anecdote = """
El examen del cuadro ha revelado que Leyster había pintado primero en el caballete un \
rostro femenino, antes de cubrirlo con el violinista. El cuadro dentro del cuadro \
cambió, pues, de tema sobre la marcha, pasando del retrato a la escena de género."""
salle = 2
mur = "sud"
place = 1
largeur = 1.1

[[oeuvres]]
titre = "Flores en un jarrón"
artiste = "Rachel Ruysch"
annee = "hacia 1685"
image = "fleurs-dans-un-vase.jpg"
technique = "Óleo sobre lienzo, 57 × 43,5 cm"
collection = "National Gallery, Londres"
note = "Un ramo exuberante surgido de la sombra, pintado por una joven de unos veinte años que llegaría a ser la más célebre pintora de flores de su tiempo."
description = """
Sobre una repisa de piedra, un jarrón de vidrio casi invisible en la sombra sostiene un \
ramo exuberante que se eleva en diagonal. En el centro, una gran peonía rosa pálido de \
corazón verde atrae primero la mirada. A su alrededor se abren lirios martagón \
anaranjados, racimos blancos de espino albar y de viburno, aguileñas azules y blancas, \
y madreselva amarilla que cae hacia abajo. Espigas de trigo maduro y largas hierbas se \
alzan hacia arriba. A la derecha, aislado, un capullo de peonía rojo oscuro. Un tallo \
cargado con una cápsula de semillas sobresale de la repisa, hacia nosotros. Mirando \
bien, se descubren pequeños insectos escondidos entre las flores y el follaje."""
evocation = """
Un ramo así nunca existió tal cual: reúne flores de primavera y espigas ya maduras, \
que no crecen al mismo tiempo. La pintora lo compone a partir de estudios hechos en \
distintas estaciones, para crear una imagen ideal de la naturaleza. En la Holanda del \
siglo XVII, estas naturalezas muertas hablan también del paso del tiempo: la flor \
abierta, el capullo y el tallo que se inclina recuerdan que la belleza es breve, como \
la vida. Se ha visto en ello un eco de la cultura científica de la familia: el padre de \
Rachel, Frederik Ruysch, anatomista y botánico, coleccionaba especímenes naturales. \
Ella pinta cada especie con la exactitud de una naturalista, pero la ordena con un \
sentido dramático muy personal."""
histoire = """
Rachel Ruysch pinta este lienzo hacia 1685, en Ámsterdam, cuando tiene apenas una \
veintena de años y acaba de salir del taller de su maestro, Willem van Aelst, uno de \
los mejores pintores de flores de la ciudad. Se reconoce su influencia en el fondo \
oscuro y en la composición asimétrica, en diagonal. Construye después una carrera \
excepcional de más de sesenta años: sus ramos alcanzan precios superiores a los de \
muchos pintores de su tiempo, y el elector palatino Juan Guillermo la nombra pintora \
de su corte en Düsseldorf. El cuadro ingresó en la National Gallery de Londres en \
1974, gracias al legado del coleccionista Alan Evans."""
facture = """
Ruysch trabaja con finas capas de óleo, casi sin huella de pincel, para dar la textura \
de cada pétalo: el terciopelo de la peonía, la cera de los lirios, la delicadeza de las \
aguileñas. La luz, procedente de la izquierda, esculpe las flores más claras sobre el \
fondo casi negro, mientras que las hojas se hunden en la sombra. La composición dibuja \
una curva, desde las espigas de lo alto hasta el tallo que pende ante la repisa, y \
rechaza la simetría. El jarrón, apenas visible, deja el ramo como suspendido en la \
oscuridad."""
details = [
  "El saltamontes casi oculto en la madreselva, en la parte baja del ramo.",
  "Las diminutas hormigas que corren sobre las flores.",
  "El capullo de peonía rojo, aislado a la derecha del ramo.",
  "Las espigas de trigo maduro, en lo más alto, mezcladas con las flores de primavera.",
  "El tallo que cae por encima del borde de la repisa, hacia nosotros.",
]
themes = ["flores", "naturaleza muerta", "botánica", "vanitas", "siglo de oro"]
anecdote = """
En 1723, Rachel Ruysch y su marido ganaron un premio gordo en una lotería de \
Ámsterdam. Ella no dejó por ello de pintar: trabajaba todavía a más de ochenta años e \
inscribía con orgullo su edad junto a su firma."""
salle = 2
mur = "sud"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Autorretrato indeciso entre la música y la pintura"
artiste = "Angelica Kauffman"
annee = "1794"
image = "entre-musique-et-peinture.jpg"
technique = "Óleo sobre lienzo"
collection = "National Trust, Nostell Priory (Yorkshire)"
note = "Como Hércules en la encrucijada, la pintora debe elegir: la Música la retiene de la mano, la Pintura le muestra un templo en la cima de una montaña."
description = """
Tres jóvenes vestidas a la antigua ocupan todo el ancho del lienzo. En el centro, con \
vestido blanco ceñido por un cinturón azul y oro, Angelica Kauffman se representa joven. \
A la izquierda, sentada ante una columna y un pesado cortinaje, la Música, con vestido \
rojo y echarpe malva, coronada de flores y con una partitura sobre las rodillas, le \
sostiene tiernamente la mano derecha. A la derecha, de pie, la Pintura, de azul, con \
mangas amarillas y echarpe rojo ondulante, sostiene una paleta y pinceles y extiende el \
brazo hacia la lejanía: en la cima de una montaña escarpada se alza un pequeño templo \
circular. La artista, con la cabeza inclinada hacia la Música, adelanta ya la mano \
izquierda hacia la paleta, como si su gesto hubiera elegido antes que su mirada."""
evocation = """
Kauffman retoma un tema célebre de la Antigüedad, Hércules en la encrucijada, dividido \
entre el placer fácil y la virtud exigente. Aquí, la elección es la de una vocación. La \
Música representa un talento que ella también poseía, y un camino más fácil; la Pintura \
muestra la senda escarpada que lleva al templo de la gloria. La mirada de la artista, \
vuelta hacia la Música con pesar y ternura, y su mano tendida hacia la paleta expresan \
una despedida más que una vacilación. Pintado por una mujer en la cima de su \
reputación, el cuadro recuerda también que una carrera de pintora de historia era una \
elección difícil para una mujer: en época reciente se ha convertido en una imagen \
emblemática de la historia de las mujeres artistas."""
histoire = """
Angelica Kauffman pinta este cuadro en Roma en 1794, cuando tiene más de cincuenta años \
y su taller de la via Sistina recibe a la Europa culta. El tema remite a su juventud: \
niña prodigio, cantaba y tocaba tan bien como dibujaba, y se cuenta que un día tuvo \
que elegir entre una carrera de cantante y la pintura. Ya había tratado este tema \
algunos años antes, en otra versión. El gran formato y la referencia erudita a Hércules \
muestran que se sitúa entre los pintores de historia, el género más prestigioso. El \
cuadro se conserva hoy en Nostell Priory, una mansión de Yorkshire que pertenece al \
National Trust."""
facture = """
La composición, en friso, alinea las tres figuras paralelamente al plano del cuadro, \
como en un bajorrelieve antiguo, principio caro al neoclasicismo. Los colores puros, \
rojo, blanco, azul y amarillo, se responden de una figura a otra. El dibujo es nítido, \
los ropajes flexibles y lisos, los rostros idealizados, de perfiles regulares. Una \
diagonal une la partitura de la Música, el brazo de la artista y el brazo alzado de la \
Pintura hasta el templo, arrastrando la mirada de izquierda a derecha, del pasado hacia \
el futuro."""
details = [
