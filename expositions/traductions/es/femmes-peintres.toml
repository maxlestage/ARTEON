[[oeuvres]]
titre = "La cuna"
artiste = "Berthe Morisot"
annee = "1872"
image = "berceau.jpg"
technique = "Óleo sobre lienzo, 56 × 46 cm"
collection = "Museo de Orsay, París"
note = "Edma, la hermana de la artista, vela a su hija dormida: una imagen íntima de la maternidad, mostrada en la primera exposición impresionista."
description = """
Una joven con vestido oscuro está sentada a la izquierda, con la barbilla apoyada en la \
mano, y contempla una cuna. El bebé duerme, medio oculto tras el velo de muselina que \
cae en cascada desde lo alto de la cuna. La otra mano de la madre descansa en el borde, \
junto al velo, y la línea de su mirada conduce el ojo de su rostro al del niño. El \
fondo se reparte entre una cortina clara, a la izquierda, y un lienzo de pared oscuro, \
a la derecha. Todo lo demás es un juego de blancos, visillos, sábana, muselina, \
almohada, apenas teñidos de rosa, de gris y de azul. Una cinta negra al cuello de la \
joven y algunos ribetes rosas puntúan esta blancura."""
evocation = """
El cuadro se lee en primer lugar como una imagen apacible de la maternidad, pero es más \
ambiguo de lo que parece. Edma, que pintaba junto a Berthe desde la infancia, renunció \
a la pintura al casarse en 1869. Su mirada ensimismada, casi melancólica, se ha \
interpretado como la de una mujer que contempla la vida que ha elegido, o que se le ha \
impuesto. El velo que separa a la madre del niño crea a la vez protección y distancia. \
Para Berthe, todavía soltera en 1872, es también el retrato de su hermana más cercana, \
pintado con una atención que solo permiten la intimidad de una casa y la confianza \
entre dos mujeres."""
histoire = """
Berthe Morisot pinta el lienzo en 1872, poco después del nacimiento de Blanche, la hija \
de Edma y de su marido, el oficial de marina Adolphe Pontillon. Dos años más tarde lo \
presenta en la primera exposición del grupo al que pronto se llamará impresionista, \
inaugurada el 15 de abril de 1874 en el antiguo taller del fotógrafo Nadar, en el \
bulevar de los Capuchinos. La crítica, a menudo hostil al grupo, se muestra más amable \
con este delicado cuadro, pero no encuentra comprador. Permanece en la familia, en \
particular con Blanche, el bebé de la cuna ya adulto, antes de ser adquirido por el \
Museo del Louvre en 1930. Expuesto en el Jeu de Paume, pasa al Museo de Orsay en su \
inauguración, en 1986."""
facture = """
Morisot trabaja con pinceladas largas y ligeras, que dejan respirar la pintura. \
Construye casi todo el cuadro con blancos, rosados, azulados o grises, aplicados en \
capas transparentes que dan la ligereza de la muselina. El vestido oscuro de Edma y el \
lienzo de pared oscuro, a la derecha, sirven de contrapunto. La composición descansa \
en una diagonal, del rostro de la madre al bebé, cruzada por la del velo. El encuadre \
cerrado encierra al espectador en la intimidad de la habitación."""
details = [
  "La muselina de la cuna, hecha de toques blancos casi transparentes.",
  "La mano de Edma apoyada en el borde de la cuna.",
  "El rostro del bebé, apenas esbozado tras el velo.",
  "La cinta negra al cuello de la joven madre.",
  "El ribete rosa que bordea el velo, en diagonal.",
]
themes = ["maternidad", "sueño", "intimidad", "hermanas", "impresionismo"]
anecdote = """
Berthe Morisot fue la única mujer que expuso en la primera exposición impresionista, \
en 1874. Participó en todas las siguientes salvo una, la de 1879, el año que siguió al \
nacimiento de su hija Julie."""
salle = 3
mur = "nord"
position = -0.2
largeur = 1.2

[[oeuvres]]
titre = "Un palco en el Théâtre des Italiens"
artiste = "Eva Gonzalès"
annee = "hacia 1874"
image = "loge-aux-italiens.jpg"
technique = "Óleo sobre lienzo, 98 × 130 cm"
collection = "Museo de Orsay, París"
note = "Una joven con traje de noche y su acompañante en un palco de teatro: rechazado en el Salón de 1874, el lienzo es aceptado allí cinco años después."
description = """
Una joven con vestido de noche azul pálido, de hombros descubiertos, se apoya en el \
borde de terciopelo rojo de un palco de teatro. Lleva una cinta de terciopelo negro al \
cuello, una rosa en el cabello y otra en el corpiño, largos guantes blancos y una \
pulsera de oro. Sostiene unos gemelos de teatro de marfil y nos mira con aire soñador, \
algo ausente. Tras ella, un hombre barbudo de frac negro y pechera blanca está de perfil \
y mira hacia la derecha, fuera del cuadro, hacia el escenario o la sala. A la izquierda, \
un pesado cortinaje rojo y oro, con borlas, enmarca el palco; en el borde, un ramo \
envuelto en papel blanco, de flores azules en torno a una rosa. El fondo es casi \
negro."""
evocation = """
El teatro es uno de los grandes temas de la vida moderna para los pintores de los años \
1870: se va para ver el espectáculo, pero también para ser visto. Gonzalès ofrece una \
versión serena y enigmática. Los dos personajes no se miran: la mujer se vuelve hacia \
nosotros, el hombre hacia un más allá que no vemos, y esta falta de intercambio crea \
una distancia silenciosa. Se ha leído en ello una reflexión sobre el lugar de la mujer \
en el palco, expuesta a las miradas como un adorno, con sus flores, sus guantes y sus \
joyas, pero cuyo rostro pensativo deja adivinar una vida interior. El cuadro muestra \
también la ambición de una joven pintora que se adueña de un gran formato y de un tema \
mundano."""
histoire = """
Eva Gonzalès pinta el lienzo hacia 1874 haciendo posar a dos allegados: su hermana \
menor, Jeanne, y el grabador Henri Guérard, con quien Eva se casará en 1879. Lo \
presenta en el Salón de 1874, cuyo jurado lo rechaza. Fiel al ejemplo de su maestro \
Manet, no se une a los impresionistas, que abren ese mismo año su primera exposición, \
y persevera con el Salón oficial. Vuelve a presentar el cuadro en 1879 y esta vez es \
aceptado. Tras la prematura muerte de la artista, en 1883, permanece en su familia. Su \
hijo, Jean Guérard, lo ofrece al Estado en 1927; se expone en el Museo de Orsay desde \
1986."""
facture = """
La lección de Manet está por todas partes: contrastes francos entre el negro del frac, \
el fondo oscuro y la blancura de las carnes, de los guantes y de la pechera; colores \
aplicados en amplios planos, sin medias tintas inútiles; figuras encuadradas de cerca, \
a media altura, como en una fotografía. Gonzalès añade una dulzura personal en el azul \
pálido del vestido y en el tratamiento nacarado de la piel. El ramo y el cortinaje con \
borlas, pintados con soltura, enmarcan la escena. El gran formato da a los personajes \
una presencia casi a tamaño natural."""
details = [
  "Los gemelos de teatro de marfil, sostenidos por la mano enguantada de blanco.",
  "El ramo envuelto en papel blanco, apoyado en el borde a la izquierda.",
  "La cinta de terciopelo negro y su colgante, al cuello de la joven.",
  "Los clavos dorados que adornan el borde de terciopelo rojo del palco.",
  "La firma de la artista, abajo a la izquierda, bajo el ramo.",
]
themes = ["teatro", "vida moderna", "pareja", "mirada", "parís"]
anecdote = """
Eva Gonzalès fue la única alumna oficial de Édouard Manet, quien hizo su retrato en \
1870, mostrándola con vestido blanco ante su caballete. Murió en mayo de 1883, pocos \
días después de dar a luz a su hijo, y menos de una semana después de la muerte de \
Manet."""
salle = 3
mur = "est"
position = -0.2
largeur = 1.5

[[oeuvres]]
titre = "Niña en un sillón azul"
artiste = "Mary Cassatt"
annee = "1878"
image = "fauteuil-bleu.jpg"
technique = "Óleo sobre lienzo, 89,5 × 129,8 cm"
collection = "National Gallery of Art, Washington"
note = "Una niña despatarrada, cansada, en un salón invadido de sillones azules: Cassatt pinta el aburrimiento de la infancia sin el menor empalago."
description = """
Una niña está arrellanada en un gran sillón azul, con las piernas abiertas, un brazo \
doblado tras la cabeza, la mirada perdida hacia un lado. Lleva un vestido blanco de \
volantes, un cinturón escocés y calcetines oscuros con dibujos. Su sillón, tapizado con \
una tela azul celeste salpicada de flores y follaje, ocupa casi toda la mitad derecha \
del cuadro. En otro sillón, a la izquierda, un perrito grifón duerme hecho un ovillo. \
Detrás, un sofá y un tercer sillón de la misma tela, sobre un suelo pardo grisáceo, \
llevan la mirada hacia las luminosas ventanas del fondo. En el centro, el suelo vacío \
forma un gran espacio extrañamente desnudo. Abajo a la izquierda, la firma de la \
artista."""
evocation = """
Lejos de los niños formales y sonrientes de la pintura de la época, Cassatt muestra a \
una niña que se aburre, en una pose relajada que se consideraba poco apropiada para una \
niña. No es un adorno del salón, sino una persona con su propio humor. La historiadora \
del arte Griselda Pollock ha visto en ella una de las imágenes más radicales de la \
infancia de su tiempo. Los sillones demasiado grandes, que parecen casi tragársela, \
hablan del lugar de un niño en un mundo de adultos. El perro dormido le responde como \
un doble: dos seres ociosos en un interior burgués. La obra afirma también la mirada de \
una artista que observa la infancia sin sentimentalismo."""
histoire = """
Cassatt pinta el lienzo en París en 1878, poco después de conocer a Edgar Degas, que la \
ha invitado a exponer con los impresionistas. Degas le encuentra la modelo, la hija de \
unos amigos suyos, la aconseja y, según ella, trabaja él mismo en el fondo. Envía el \
cuadro a la sección estadounidense de la Exposición Universal de 1878, cuyo jurado lo \
rechaza. Veinticinco años más tarde, en una carta al marchante Ambroise Vollard, que \
acaba de comprárselo, aún expresa su enfado. El cuadro pasa después al marchante \
parisino Hector Brame y es adquirido en 1963 por el coleccionista Paul Mellon y su \
esposa, que lo donan en 1983 a la National Gallery of Art de Washington."""
facture = """
La pincelada tiene una libertad inusual: en los sillones, el motivo de la tela se \
resuelve con pinceladas rápidas, en zigzags rojos, amarillos y verdes, que rozan la \
abstracción. La composición descentrada, cortada por los bordes, y la gran zona vacía \
del suelo recuerdan a Degas y a las estampas japonesas que ambos artistas admiraban. El \
punto de vista es bajo, casi a la altura de un niño. Dominan los azules, realzados por \
el blanco del vestido y el escocés del cinturón. El estudio del cuadro en la National \
Gallery ha confirmado la intervención de Degas en el fondo."""
details = [
  "La firma «Mary Cassatt», abajo a la izquierda.",
  "El pequeño grifón dormido en el sillón de la izquierda.",
  "El brazo doblado tras la cabeza, gesto de abandono y de aburrimiento.",
  "Los motivos de la tela, pintados en vivos zigzags casi abstractos.",
  "Las luminosas ventanas del fondo, apenas esbozadas.",
]
themes = ["infancia", "aburrimiento", "interior", "perro", "impresionismo"]
anecdote = """
El perrito del cuadro es un grifón de Bruselas, sin duda regalo de Degas, que lo \
había recibido del pintor Ludovic-Napoléon Lepic, criador de esta raza. Cassatt \
permaneció fiel a los grifones toda su vida."""
salle = 3
mur = "ouest"
position = -0.2
largeur = 1.6

[[oeuvres]]
titre = "Sol en la habitación azul"
artiste = "Anna Ancher"
annee = "1891"
image = "soleil-chambre-bleue.jpg"
technique = "Óleo sobre lienzo, 65,2 × 58,8 cm"
collection = "Skagens Museum, Skagen (Dinamarca)"
note = "Su hija Helga, absorta en su labor, en el salón azul de su abuela: el verdadero tema es la luz."
description = """
En una habitación de paredes de un azul profundo, una niña rubia está sentada de \
espaldas junto a una ventana, inclinada sobre una labor de ganchillo. El sol entra por \
las ventanas de cortinas anaranjadas, a la derecha, y dibuja en la pared de la \
izquierda dos grandes manchas de luz blanca, donde se recortan las sombras de las \
plantas colocadas en el alféizar. Los rayos se alargan también sobre el suelo en \
bandas amarillas. Alrededor de la niña, sillas de asientos azules, una mesita cubierta \
con un tapete rojo, un taburete redondo. Arriba a la izquierda, en la sombra, un \
retrato enmarcado. Al fondo, entre las dos ventanas, un mueble coronado por un espejo. \
Los cabellos de la niña, atrapados a contraluz, se encienden como una llama."""
evocation = """
No ocurre nada, y ese es todo el tema. Anna Ancher capta un instante suspendido de la \
vida doméstica, el silencio de una habitación donde una niña trabaja sin saberse \
observada. La verdadera protagonista es la luz del Norte, rasante y cambiante, que \
transforma la pared azul en una superficie vibrante y proyecta las sombras de las \
plantas como una imagen dentro de la imagen. Se ha visto en ello un eco de los \
interiores holandeses del siglo XVII, con sus mujeres ocupadas junto a una ventana, \
pero visto con una sensibilidad moderna. El cuadro evoca también la transmisión entre \
tres generaciones de mujeres: la abuela, cuya es la estancia; la madre, que pinta; la \
hija, absorta en su labor."""
histoire = """
Anna Ancher pinta este cuadro en 1891 en Skagen, en el extremo norte de Dinamarca, \
donde nació y donde se formó una colonia de artistas en torno a la posada que regentaban \
sus padres. La habitación es el salón de su madre, la abuela de la niña: el título \
danés completo lo precisa. La modelo es Helga, la hija única de Anna y del pintor \
Michael Ancher, nacida en 1883. Anna pintará a menudo los interiores de la casa \
familiar y de su propia casa, bajo luces diferentes. El cuadro pertenece al Skagens \
Museum, fundado en 1908 por pintores de la colonia, entre ellos Michael Ancher, y por \
el hotelero Degn Brøndum, hermano de Anna."""
facture = """
Ancher construye el cuadro mediante el color: un azul intenso para la pared, que \
calientan el anaranjado de las cortinas y el amarillo de los rayos sobre el suelo. La \
pincelada es amplia y visible, sobre todo en las manchas de sol, aplicadas en grueso \
con blancos azulados. Esta atención a los colores complementarios y a la luz acerca la \
obra al impresionismo. La figura, pequeña y vista de espaldas, es solo un elemento de \
la composición, al mismo nivel que las sillas y las ventanas."""
details = [
  "Las sombras de las plantas del alféizar, proyectadas sobre la pared azul.",
  "Los cabellos rubios de la niña, iluminados por el contraluz.",
  "Las bandas de sol amarillo sobre el suelo.",
  "El retrato enmarcado, arriba a la izquierda, en la sombra.",
  "La firma y la fecha, abajo a la derecha.",
]
themes = ["luz", "interior", "infancia", "azul", "skagen"]
anecdote = """
Anna y Michael Ancher figuraron juntos en el antiguo billete danés de 1000 coronas: un \
honor poco común para un matrimonio de pintores, y para una mujer artista. Su casa de \
Skagen, conservada con su mobiliario, se puede visitar hoy."""
salle = 4
