[[oeuvres]]
titre = "Manaò tupapaú (El espíritu de los muertos vela)"
annee = "1892"
image = "manao-tupapau.jpg"
technique = "Óleo sobre lienzo, 73 × 92 cm"
collection = "Buffalo AKG Art Museum"
note = "Su joven compañera, asustada, tendida en la oscuridad: tras ella, el espíritu de los muertos vela."
description = """
Una joven desnuda yace boca abajo sobre una cama cubierta con un pareo azul y una sábana clara. Con el rostro vuelto hacia nosotros, los ojos muy abiertos, mantiene las manos cerca de la cara, petrificada por el miedo. A la izquierda, detrás de la cama, se halla de perfil una silueta oscura encapuchada, de gran ojo redondo: el espíritu de los muertos, el tupapau. El fondo, violeta y azul noche, está salpicado de flores claras, semejantes a chispas. Toda la escena está bañada en una penumbra en la que se destacan el cuerpo cobrizo de la joven y el blanco de la sábana. El cuerpo tendido ocupa todo el ancho del cuadro, paralelo al borde inferior, mientras el espectro permanece apartado, inmóvil."""
evocation = """
Gauguin propuso él mismo una lectura del cuadro: el miedo de la joven ante los tupapau, espíritus de los muertos que los tahitianos creían que vagaban de noche y a los que se mantenía a distancia dejando una lámpara encendida. Las flores luminosas del fondo serían los resplandores que señalan su presencia. El lienzo une así el espíritu de la viva que imagina y el espíritu del muerto que vela. Retoma también, invirtiéndola, la pose de la Olimpia de Manet, lo que lo convierte en una reflexión sobre el desnudo europeo. Hoy la obra suscita malestar: la modelo, Teha'amana, compañera de Gauguin, tenía trece años según su propio relato, y se relee este miedo como el de una adolescente ante un hombre adulto."""
histoire = """
Según Gauguin, el cuadro nace de una noche de 1892 en Mataiea: de regreso tarde de Papeete, encuentra su cabaña a oscuras, la lámpara apagada, y a Teha'amana tendida, aterrorizada. Cuenta esta escena y explica la construcción del lienzo en un manuscrito destinado a su hija, el Cuaderno para Aline, y luego en Noa Noa, el relato de su estancia. Lo considera una de sus obras mayores y lo presenta en la exposición Durand-Ruel de 1893. Saca de él también estampas, litografía y grabados en madera. Tras varios propietarios, el lienzo entra en 1965, con la colección de A. Conger Goodyear, en la Albright-Knox Art Gallery de Búfalo, rebautizada Buffalo AKG Art Museum en 2023."""
facture = """
Gauguin explica que construyó el lienzo sobre una armonía sombría de violetas, azules apagados y anaranjados, para sugerir la noche y el espanto: la «parte musical» del cuadro, según sus palabras. Las formas están simplificadas y perfiladas, el fondo tratado como un tapiz plano donde las flores flotan sin profundidad. La figura del espectro, rígida y de perfil, recuerda esculturas arcaicas, en contraste con el modelado flexible de la joven. La luz no viene de ninguna fuente visible: parece emanar de la sábana y del cuerpo."""
details = [
  "El gran ojo abierto del espíritu, a la izquierda.",
  "Los ojos desorbitados de la joven, vueltos hacia nosotros.",
  "Las flores claras del fondo, como resplandores en la noche.",
  "Las manos crispadas cerca del rostro.",
]
themes = ["noche", "miedo", "espíritus", "desnudo", "creencias"]
anecdote = """
En su Autorretrato con sombrero, pintado en París hacia 1893-1894 y conservado en el museo de Orsay, Gauguin se representó ante Manaò tupapaú colgado en la pared de su taller. El lienzo aparece allí invertido, pues se pintaba en un espejo."""
salle = 2
mur = "gauche"
place = 3
largeur = 1.4

[[oeuvres]]
titre = "El caballo blanco"
annee = "1898"
image = "cheval-blanc.jpg"
technique = "Óleo sobre lienzo, 140 × 91,5 cm"
collection = "Museo de Orsay, París"
note = "Un caballo que bebe, en un río donde el blanco se vuelve verde bajo el follaje: rechazado por su comitente."
description = """
En un claro a orillas del agua, un caballo blanco, con la cabeza baja, bebe en un río. Ocupa la parte inferior y el centro del lienzo, con el pelaje teñido de verde y de azul por los reflejos del follaje. Más arriba, dos jinetes desnudos montan a pelo, uno de ellos sobre un caballo alazán. Alrededor, la vegetación tropical lo invade todo: troncos, follajes, flores, y una larga rama que serpentea en lo alto de la composición. El agua misma se cubre de colores arbitrarios, que ya nada tienen de realista. El cielo no aparece: la composición, muy vertical, se cierra sobre esta escena apacible, como un jardín cerrado. Ningún ruido parece turbar este momento suspendido, en que hombres y bestias comparten la frescura del sotobosque."""
evocation = """
A primera vista, es una escena de vida cotidiana, un momento de frescura y de silencio. Pero el caballo, aislado y luminoso, adquiere una presencia casi sobrenatural: se lo ha relacionado con creencias polinesias que asocian el caballo blanco con lo sagrado, e incluso con el mundo de los muertos, sin saber si Gauguin pensaba en ello. Pintado poco después del gran lienzo ¿De dónde venimos?, en un período de enfermedad y de desesperación, el cuadro propone una visión apaciguada de armonía entre el hombre, el animal y la naturaleza, un paraíso que el pintor ya apenas hallaba en su vida. Afirma también la libertad del color: el blanco puede volverse verde si el ojo y la composición lo exigen."""
histoire = """
En 1898, Gauguin vive en Punaauia, en la costa oeste de Tahití, enfermo y acribillado de deudas; para sobrevivir, acepta un empleo de dibujante en Obras Públicas de Papeete. Un farmacéutico de la ciudad le encarga entonces un cuadro, pero el asunto fracasa. Gauguin envía el lienzo a Francia a su amigo el pintor Daniel de Monfreid, que recibe sus envíos, guarda sus obras y busca compradores para él. El lienzo permanece mucho tiempo en casa de Monfreid, que acaba cediéndolo al Estado francés en 1927. Entra así en las colecciones nacionales y, tras el Louvre, pasa al museo de Orsay en su apertura en 1986."""
facture = """
El formato vertical y el punto de vista picado, que suprime el cielo y el horizonte, proceden de las estampas japonesas, que Gauguin admiraba y coleccionaba. La composición se construye en arabescos: la rama sinuosa de arriba, la curva del cuello del caballo, los contornos de los jinetes. Los colores se liberan de toda descripción: el blanco del caballo se carga de verde y de azul, el agua se adorna con tonos inesperados. La materia, delgada, deja jugar la textura del lienzo. Se han comparado los jinetes con el friso del Partenón, del que Gauguin poseía reproducciones."""
details = [
  "Los reflejos verdes y azules sobre el pelaje blanco del caballo.",
  "El jinete desnudo sobre su caballo alazán, en lo alto del lienzo.",
  "La rama que serpentea arriba, como una liana.",
  "La ausencia total de cielo y de horizonte.",
]
themes = ["caballo", "río", "naturaleza", "color", "japonismo"]
anecdote = """
El farmacéutico de Papeete que había encargado el lienzo, Ambroise Millaud, lo rechazó: encontraba el caballo demasiado verde. Ese rechazo fue lo que llevó a Gauguin a enviarlo a Francia."""
salle = 3
