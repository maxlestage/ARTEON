[[oeuvres]]
titre = "La visión después del sermón"
annee = "1888"
image = "vision-sermon.jpg"
technique = "Óleo sobre lienzo, 72,2 × 91 cm"
collection = "National Galleries of Scotland, Edimburgo"
note = "Unas bretonas con cofia ven a Jacob luchar con el ángel, sobre un campo enteramente rojo."
description = """
En primer plano, una hilera de bretonas con cofias blancas almidonadas, vistas de espaldas o de perfil, bajan los ojos o juntan las manos. Su oración acaba de terminar: el cura les ha leído el episodio del Génesis en que Jacob lucha toda una noche con un ángel. Este combate aparece arriba a la derecha, en pequeño, sobre un campo de un rojo bermellón liso, sin horizonte ni sombra: el ángel de alas amarillo oro y Jacob se agarran como dos luchadores. El tronco de un manzano corta el lienzo en diagonal y separa el mundo real de las mujeres del mundo de la visión. A la izquierda del tronco, una vaca minúscula cruza el prado rojo. En el extremo derecho, cortado por el borde, aparece el rostro de un sacerdote de ojos cerrados."""
evocation = """
Gauguin ya no pinta lo que ve sino lo que otros imaginan: escribe a Van Gogh que, para él, el paisaje y la lucha solo existen en el espíritu de las campesinas en oración. El rojo irreal señala que se ha abandonado el mundo visible. Se ha visto en ello el manifiesto de una pintura que prefiere la idea, el sueño y el símbolo a la observación, lo que la crítica llamará pronto simbolismo. Bretaña se convierte en una tierra de fe sencilla y arcaica, que Gauguin, venido de París, idealiza en parte. Algunos historiadores reconocen sus propios rasgos en el sacerdote del borde derecho, como si se colocara a sí mismo como oficiante de esta visión. La lucha de Jacob con el ángel se ha leído también como la imagen del combate del artista con su arte."""
histoire = """
Gauguin pinta el lienzo en Pont-Aven en septiembre de 1888, poco después de la llegada del joven Émile Bernard, cuyas Bretonas en la pradera, hechas de superficies planas perfiladas, le han impresionado vivamente. Los pardones, esas fiestas religiosas bretonas en las que las feligresas se reúnen con su traje, le proporcionan el tema. Consciente de estar ante un punto de inflexión, describe su composición en una carta a Van Gogh, acompañada de un boceto. Unas semanas más tarde, en octubre, parte a reunirse con Vincent en Arlés. El lienzo, que el artista conserva al principio consigo, pasa después por varias colecciones privadas antes de ser comprado en 1925 por las National Galleries of Scotland, en Edimburgo. Allí se ha convertido en una de las obras más célebres del museo y en una de las imágenes fundacionales del arte moderno."""
facture = """
Es el primer gran ejemplo del cloisonismo, o sintetismo: superficies de color puro, aplicadas en planos y perfiladas con contornos oscuros, como el plomo de una vidriera o los tabiques de un esmalte. La perspectiva desaparece: el campo rojo se alza como un muro, y la escala cambia bruscamente entre las cofias gigantes del primer plano y los luchadores en miniatura. El tronco en diagonal y las figuras cortadas por el marco proceden de las estampas japonesas, como la pose de los luchadores, que se acerca a los cuadernos de bocetos de Hokusai. Las cofias, simplificadas en formas casi abstractas, dan ritmo a la composición como alas blancas."""
details = [
  "El tronco del manzano que atraviesa el lienzo en diagonal, entre lo real y la visión.",
  "La pequeña vaca, a la izquierda del tronco, como extraviada en el campo rojo.",
  "Las alas amarillas del ángel, única nota dorada sobre el rojo.",
  "El perfil del sacerdote de ojos cerrados, cortado por el borde derecho.",
  "Las cofias y los grandes cuellos blancos, dibujados como formas recortadas.",
]
themes = ["religión", "bretaña", "visión", "sintetismo", "japonismo"]
anecdote = """
Gauguin quiso ofrecer el cuadro a una iglesia. Con Émile Bernard y Charles Laval, lo llevó hasta la de Nizon, cerca de Pont-Aven, pero el rector lo rechazó, sin duda desconcertado por ese tema sagrado tratado de manera tan extraña."""
salle = 1
mur = "gauche"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Autorretrato con aureola y serpiente"
annee = "1889"
image = "autoportrait-aureole.jpg"
technique = "Óleo sobre madera, 79,2 × 51,3 cm"
collection = "National Gallery of Art, Washington"
note = "Mitad santo, mitad diablo: una aureola, una serpiente y manzanas, pintadas en la puerta de un armario de posada en Le Pouldu."
description = """
El busto de Gauguin se recorta sobre dos grandes superficies planas, una de rojo vivo, otra de amarillo oro. Su rostro, de tres cuartos, tiene los párpados pesados y la mirada de soslayo, a la vez cansada y socarrona. Sobre su cabeza flota una aureola amarilla, puesta de través como un sombrero. Arriba a la izquierda cuelgan dos manzanas rojas de una rama. Más abajo, su mano sostiene entre el índice y el corazón una pequeña serpiente, a la manera de un cigarrillo. En la parte inferior del panel se alzan tallos verdes estilizados, rematados por flores, que ondulan como arabescos. La cabeza, la mano y la serpiente parecen flotar en un espacio sin profundidad, sin suelo ni decorado, como signos puestos sobre una superficie coloreada."""
evocation = """
Gauguin se representa como un ser doble, a la vez santo y tentador: la aureola de los elegidos por un lado, la serpiente y las manzanas del Génesis por otro. Se lee a menudo en ello una caricatura de sí mismo, mitad seria, mitad irónica: el maestro venerado por el pequeño círculo de jóvenes pintores que lo rodea en Bretaña, y el seductor que se burla de la moral burguesa. Los historiadores ven también la afirmación de un artista que se quiere aparte, por encima de las reglas, casi mago o profeta, en el momento en que el simbolismo hace del artista un vidente. El tono sigue siendo deliberadamente ambiguo, entre la provocación y la confesión. Este doble rostro anuncia el personaje que Gauguin cultivará toda su vida: el del salvaje, el maldito y el elegido a la vez."""
histoire = """
En el otoño de 1889, Gauguin se instala en Le Pouldu, pequeña aldea del Finisterre más aislada que Pont-Aven, en la posada que regenta Marie Henry. Con el pintor holandés Jacob Meyer de Haan, que lo ayuda entonces económicamente, y otros amigos, decora su comedor. Este autorretrato está pintado en una de las puertas de un armario; la otra recibe un retrato de Meyer de Haan, pensativo, ante una lámpara y unos libros. Marie Henry conserva los paneles tras la marcha de los pintores. El autorretrato entra más tarde en la colección de Chester Dale, gran coleccionista neoyorquino, cuyo conjunto de pinturas francesas pasa a la National Gallery of Art de Washington en 1963, tras su muerte."""
facture = """
El panel de madera se trata como un rótulo o una vidriera: dos superficies planas de color franco, sin modelado ni profundidad, sobre las que las formas se recortan con nitidez. Los contornos sinuosos de los tallos, de la mano y de la serpiente crean un ritmo decorativo próximo al Art Nouveau que nace entonces. El rostro conserva, en cambio, un ligero modelado que lo hace resaltar. Se reconoce en él la influencia de las estampas japonesas y de la imaginería popular, que Gauguin y sus amigos admiraban por su sencillez. El encuadre cerrado y la frontalidad recuerdan también los iconos religiosos."""
details = [
  "La aureola amarilla, puesta de soslayo como un sombrero.",
  "La pequeña serpiente sostenida entre dos dedos, a modo de cigarrillo.",
  "Las dos manzanas rojas suspendidas arriba a la izquierda.",
  "Los tallos verdes estilizados que ondulan en la parte inferior del panel.",
]
themes = ["autorretrato", "religión", "tentación", "ironía", "bretaña"]
anecdote = """
En 1894, de regreso de Tahití, Gauguin quiso recuperar las obras dejadas en la posada de Le Pouldu. Marie Henry se negó a devolvérselas, y el pintor perdió el pleito que le puso."""
salle = 1
mur = "droite"
place = 3
largeur = 0.85

[[oeuvres]]
titre = "Mujeres de Tahití"
annee = "1891"
image = "femmes-tahiti.jpg"
technique = "Óleo sobre lienzo, 69 × 91,5 cm"
collection = "Museo de Orsay, París"
note = "Dos mujeres sentadas en la arena, una con pareo, otra con vestido rosa: la Polinesia tal como la descubre Gauguin."
description = """
Dos jóvenes están sentadas en la arena, tan cerca del borde inferior que parecen ocupar todo el espacio. La de la izquierda lleva un pareo rojo de flores blancas; con la cabeza inclinada y la mirada perdida, se apoya en una mano. La de la derecha lleva un vestido rosa de mangas largas, de los que imponían los misioneros; trenza hojas, con aire ausente. Detrás de ellas, la arena dorada cede el sitio a una franja de mar verde y luego a una línea de espuma blanca. No aparece ningún cielo. Las dos figuras, macizas, casi esculpidas, no se hablan ni se miran: cada una parece encerrada en su ensueño, en el calor inmóvil de una tarde."""
evocation = """
Gauguin buscaba en Tahití un mundo intacto, lejos de la Europa industrial. Lo que pinta aquí es más ambiguo: una de las mujeres lleva el pareo tradicional, la otra el vestido llegado de las misiones, señal de que la colonización ya ha transformado la isla. El cuadro yuxtapone estas dos prendas sin comentario. La inmovilidad de las dos mujeres, su aire cansado o soñador se han leído como la expresión del misterio y de la melancolía que Gauguin atribuía a las tahitianas, una visión en parte soñada, alimentada por lecturas como El matrimonio de Loti, de Pierre Loti. Hoy se interroga también esta mirada de hombre europeo sobre mujeres colonizadas, reducidas a presencias silenciosas."""
histoire = """
Gauguin desembarca en Papeete en junio de 1891, provisto de una misión oficial no remunerada del Ministerio de Instrucción Pública. Decepcionado por la capital colonial, demasiado europea para su gusto, se instala en otoño en Mataiea, en la costa sur de la isla. Este lienzo se cuenta entre los primeros que pinta allí. Retoma la composición en 1892 en una segunda versión, Parau api (¿Qué novedades hay?), conservada hoy en Dresde. El lienzo de Orsay fue donado a los museos nacionales en 1923 por el vizconde Guy du Cholet. Expuesto en el Louvre, y después en el museo del Jeu de Paume, dedicado al impresionismo, pasa al museo de Orsay en su apertura en 1986."""
facture = """
La composición descansa en bandas horizontales superpuestas, arena, mar, espuma, como un friso. Los dos cuerpos, anchos y escultóricos, ocupan casi toda la superficie y están cortados por la parte inferior del marco, lo que acerca al espectador. Gauguin aplica los colores en amplias zonas poco moduladas, pero el modelado de los rostros y de los brazos, en tonos cobrizos, es más suave que en Pont-Aven. El rosa del vestido, el rojo del pareo y el verde del mar juegan con los contrastes de complementarios. La pintura, a menudo delgada y mate, deja en algunos puntos transparentar la trama del lienzo."""
details = [
  "El contraste de las prendas: pareo a la izquierda, vestido de misionero a la derecha.",
  "Las manos de la mujer de la derecha, ocupadas en trenzar.",
  "La línea de espuma blanca, arriba, que cierra el horizonte.",
  "Los rostros cerrados, que no se vuelven el uno hacia el otro.",
]
themes = ["tahití", "mujeres", "playa", "colonización", "melancolía"]
anecdote = """
Para pagarse el viaje, Gauguin puso a la venta unas treinta de sus obras en el Hôtel Drouot en febrero de 1891. Un entusiasta artículo de Octave Mirbeau, publicado en la prensa, sirvió de prefacio al catálogo."""
salle = 2
mur = "gauche"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Ia Orana Maria (Te saludo, María)"
annee = "1891"
image = "ia-orana-maria.jpg"
technique = "Óleo sobre lienzo, 113,7 × 87,6 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una Anunciación tahitiana: la Virgen y el Niño con pareo rojo, con aureola, entre las frutas."
description = """
En el centro, una tahitiana vestida con un pareo rojo lleva sobre el hombro a un niño desnudo. Ambos tienen la cabeza ceñida por una fina aureola dorada: son la Virgen y el Niño. Detrás, dos mujeres con el torso desnudo, ceñidas con pareos, avanzan con las manos juntas ante el pecho, en un gesto de saludo. A la izquierda, medio oculto por un arbusto en flor, un ángel de alas amarillas les muestra a la madre y al niño. En primer plano, sobre una especie de altar de madera, se amontonan frutas, entre ellas plátanos, como una ofrenda. El fondo está hecho de un camino, colinas, árboles y palmeras, bajo un cielo apenas visible. Abajo a la izquierda, el pintor ha inscrito en mayúsculas el título tahitiano."""
evocation = """
El título es el saludo tahitiano «Ia ora na» dirigido a María: las primeras palabras del Ave María, las del ángel Gabriel. Gauguin transpone así la escena cristiana al decorado y con los rostros de Tahití. Se ha visto en ello un eco del cristianismo traído por los misioneros, que han transformado profundamente la sociedad polinesia. Se ha visto también el sueño, caro a Gauguin, de una religión universal donde las creencias se encuentran: las dos mujeres en oración están tomadas de un templo budista de Java. La obra hace, en fin, de la Polinesia un paraíso original, donde lo sagrado se mezcla sin esfuerzo con lo cotidiano, las frutas y la luz, a contrapelo de una Europa que el pintor juzgaba corrompida."""
histoire = """
Es el primer gran lienzo de la primera estancia tahitiana, pintado en Mataiea entre finales de 1891 y comienzos de 1892. Gauguin lo describe con orgullo a su amigo Daniel de Monfreid, detallando el ángel, las dos mujeres, la Virgen y el Niño. De regreso en París, lo presenta en noviembre de 1893 en la galería Durand-Ruel, entre sus obras tahitianas; la crítica está dividida y las ventas decepcionan. De coleccionista en coleccionista, el cuadro llega después a Nueva York, donde pertenece a Sam A. Lewisohn, heredero de una familia de coleccionistas de arte moderno. Este lo lega al Metropolitan Museum of Art en 1951, que ha hecho de él una de las piezas maestras de sus salas posimpresionistas."""
facture = """
Gauguin compone el lienzo como un retablo, en registros superpuestos: la naturaleza muerta en primer plano, las figuras en medio, el paisaje arriba. Los colores son saturados y se aplican en superficies planas: el rojo del pareo de la Virgen responde al amarillo de las alas y al verde profundo de la vegetación. Las dos mujeres en oración retoman casi idénticamente un relieve del templo de Borobudur, en Java, conocido por una fotografía que el pintor había llevado consigo. Los contornos son nítidos, el modelado de los cuerpos suave y cobrizo. La inscripción pintada, como en un rótulo o un icono, forma parte de la composición."""
details = [
  "El ángel de alas amarillas, casi oculto por las flores a la izquierda.",
  "Las discretas aureolas de la madre y del niño.",
  "Las manos juntas de las dos mujeres, gesto tomado de un relieve javanés.",
  "Las frutas apiladas en primer plano, como una ofrenda.",
  "La inscripción «IA ORANA MARIA» abajo a la izquierda.",
]
themes = ["religión", "tahití", "maternidad", "sincretismo", "ofrenda"]
anecdote = """
Antes de elegir Tahití, Gauguin había pensado en Tonkín, donde solicitó un puesto en 1889, y después en Madagascar. Ese mismo año, en la Exposición Universal de París, había quedado fascinado por la aldea javanesa reconstruida."""
salle = 2
mur = "droite"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Arearea (Alegrías)"
annee = "1892"
image = "arearea.jpg"
technique = "Óleo sobre lienzo, 75 × 94 cm"
collection = "Museo de Orsay, París"
note = "Un perro rojo en primer plano, una flautista, y a lo lejos mujeres que bailan ante un ídolo."
description = """
En primer plano, dos mujeres están sentadas al pie de un gran árbol cuyo tronco atraviesa el lienzo en diagonal. Una lleva un vestido blanco, la otra uno azul; una toca una flauta, la otra mira fijamente al espectador. Ante ellas, un perro rojo anaranjado, con la cabeza gacha, olfatea el suelo. El terreno está hecho de amplias extensiones de colores vivos. Más arriba en el lienzo, en segundo plano, unas mujeres semivestidas bailan o rezan ante una gran estatua de divinidad, erguida sobre un pedestal. El follaje del árbol ocupa el lado derecho. Ningún horizonte, ningún cielo: la escena sube hacia lo alto del cuadro como un decorado de teatro, y la mirada pasa del perro a las músicas y luego al rito lejano."""
evocation = """
El título tahitiano significa «diversión» o «alegrías»: Gauguin pinta una edad de oro en que se vive al ritmo de la música, del reposo y de los ritos. La flauta y la danza evocan un tiempo liberado del trabajo, opuesto a la Europa industrial de la que ha huido. Esta visión idílica es en parte inventada: las antiguas religiones polinesias habían sido entonces ampliamente borradas por las misiones, y el ídolo del fondo es en gran parte imaginario, compuesto a partir de fuentes diversas. El cuadro dice, pues, menos la realidad de Tahití que el sueño de un paraíso perdido, que Gauguin se esfuerza por hacer revivir mediante la pintura y el mito."""
histoire = """
Gauguin pinta el lienzo en 1892 en Mataiea, en pleno corazón de su primera estancia. De regreso en Francia a finales de agosto de 1893, enfermo y sin dinero, lo apuesta todo a una gran exposición en Durand-Ruel en noviembre, cuyo catálogo prologa el poeta Charles Morice. Arearea figura en ella. El perro rojo desata las burlas de visitantes y críticos, que ven en él el colmo de lo arbitrario: un color sin relación con la naturaleza. Algunos artistas y aficionados, en cambio, saludan la audacia de estos lienzos. Tras pasar por varias colecciones, la obra entra en las colecciones nacionales francesas y pertenece hoy al museo de Orsay, en París."""
facture = """
Gauguin organiza el lienzo en planos escalonados hacia arriba, sin perspectiva ni horizonte. Los colores ya no describen la naturaleza, construyen la imagen: el perro es rojo y el suelo multicolor porque la composición lo exige. Estas superficies planas yuxtapuestas, perfiladas con contornos flexibles, heredan el sintetismo de Pont-Aven pero ganan en suavidad y en brillo. El tronco oblicuo, que estructura la superficie, recuerda las estampas japonesas. La materia es delgada, aplicada sobre un lienzo de trama gruesa que da al color un aspecto mate, próximo al fresco."""
details = [
  "El perro rojo del primer plano, que hizo reír a los visitantes en 1893.",
  "La flauta que sostiene una de las dos mujeres sentadas.",
  "La mirada directa de la segunda mujer, vuelta hacia nosotros.",
  "El ídolo y las bailarinas, a lo lejos, en lo alto del lienzo.",
  "El tronco de árbol que corta la composición en diagonal.",
]
themes = ["tahití", "música", "paraíso", "rito", "color"]
anecdote = """
Los títulos tahitianos que Gauguin pintaba en sus lienzos contienen a menudo faltas: dominaba la lengua solo de manera imperfecta. Participaban, sin embargo, del efecto buscado, un misterio que el público parisino no podía descifrar."""
salle = 2
mur = "gauche"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Nafea Faa Ipoipo? (¿Cuándo te casas?)"
annee = "1892"
image = "nafea.jpg"
technique = "Óleo sobre lienzo, 101 × 77 cm"
collection = "Colección particular"
note = "Dos jóvenes tahitianas, una con vestido de misionera, otra con una flor en la oreja, ante un paisaje amarillo y verde."
description = """
Dos jóvenes tahitianas están sentadas una detrás de otra en un paisaje abierto. La del primer plano, sentada directamente en el suelo, lleva un pareo y una prenda superior clara, con una flor blanca prendida tras la oreja; su rostro es calmado, casi impasible. Justo detrás de ella, la segunda, vestida con un vestido rosa de cuello alto y mangas largas, típico de las misiones, levanta una mano en un gesto que parece una advertencia o una pregunta. A su alrededor se extienden campos de un amarillo vivo, verdes y azules, un árbol, montañas al fondo y, a lo lejos, minúsculas siluetas. Las dos figuras, apretadas una contra otra, forman un único bloque en primer plano."""
evocation = """
El título plantea una pregunta, «¿Cuándo te casas?», a la que la escena no responde con claridad. A menudo se ha interpretado la flor llevada en la oreja como la señal, en Tahití, de una joven en busca de esposo, y el gesto de la segunda como una advertencia o un consejo. Las dos mujeres encarnarían dos mundos: la tradición polinesia y la educación cristiana. El cuadro habla así del matrimonio, de la juventud y del futuro, pero también de la transformación de la isla por la colonización. Su seriedad, casi grave, contradice la alegría que cabría esperar de tal tema y da a la obra una tensión sorda, entre la espera y la inquietud."""
histoire = """
Gauguin pinta el lienzo en Tahití en 1892 y lo trae a Francia al año siguiente; figura en la exposición Durand-Ruel de noviembre de 1893. A comienzos del siglo XX, entra en la colección del basilense Rudolf Staechelin. La fundación familiar lo presta durante casi medio siglo al Kunstmuseum de Basilea, donde se convierte en una de las obras estrella del museo. En 2015, la familia lo vende a un comprador privado, que la prensa dice catarí, por una suma que lo sitúa entre los cuadros más caros jamás vendidos. Tras una última presentación en Basilea, en la Fundación Beyeler, en una gran exposición Gauguin ese mismo año, abandona Suiza y desaparece de las salas públicas."""
facture = """
Gauguin superpone las dos figuras en un solo bloque, procedimiento frecuente en sus lienzos tahitianos, que da a la escena la estabilidad de un bajorrelieve. Los colores se aplican en amplias superficies planas contrastadas: el rosa del vestido contra el amarillo intenso del campo, los verdes y los azules del fondo. Los contornos son flexibles, el modelado de los rostros y de los brazos se reduce a unos matices cobrizos. La perspectiva está aplanada: el paisaje sube en bandas hacia lo alto del lienzo, y las lejanías solo se señalan por el pequeño tamaño de los personajes."""
details = [
  "La flor blanca prendida tras la oreja de la joven del primer plano.",
  "La mano levantada de la mujer del vestido rosa, gesto que sigue siendo enigmático.",
  "El título tahitiano pintado en el lienzo, con la firma y la fecha.",
  "Las siluetas minúsculas a lo lejos, en los campos.",
]
themes = ["tahití", "matrimonio", "juventud", "colonización", "espera"]
anecdote = """
El precio de la venta de 2015 ha seguido envuelto en el misterio: la prensa lo anunció primero en torno a 300 millones de dólares, y después documentos judiciales vinculados a un litigio han hablado de una cantidad cercana a 210 millones."""
salle = 2
mur = "droite"
place = 2
