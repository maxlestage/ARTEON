[[oeuvres]]
titre = "¿De dónde venimos? ¿Qué somos? ¿Adónde vamos?"
annee = "1897–1898"
image = "dou-venons-nous.jpg"
technique = "Óleo sobre lienzo, 139 × 374,6 cm"
collection = "Museum of Fine Arts, Boston"
note = "Su lienzo más grande, que se lee de derecha a izquierda: del nacimiento a la muerte. Lo quería como su testamento."
description = """
En un friso de casi cuatro metros se despliegan una docena de figuras, en un paisaje de orilla de río de tonos azul verdoso. A la derecha, un lactante duerme en el suelo, velado por tres mujeres en cuclillas. En el centro, un gran personaje de pie, con los brazos levantados, coge una fruta. Más a la izquierda, un niño come una fruta junto a dos gatos y una cabra. Detrás, un ídolo azul de brazos levantados domina la parte izquierda. En el extremo izquierdo, una anciana replegada sobre sí misma se toma la cabeza entre las manos; a sus pies, un extraño pájaro blanco sostiene un lagarto. Al fondo, dos figuras envueltas en púrpura pasan conversando. Las dos esquinas superiores, amarillo oro, llevan el título a la izquierda y la firma a la derecha."""
evocation = """
Gauguin quiso resumir en él su pensamiento sobre la condición humana. El lienzo se lee de derecha a izquierda, como un ciclo de vida: el nacimiento con el niño dormido, la juventud y la madurez en el centro, con el recolector de fruta que evoca el árbol del conocimiento, y después la vejez resignada de la mujer cercana a la muerte. El ídolo representaría el más allá, y el pájaro blanco, según el propio Gauguin, la inutilidad de las palabras vanas. El título, tres preguntas sin respuesta, pone el conjunto bajo el signo de la inquietud más que de la fe. El lienzo mezcla referencias bíblicas, creencias polinesias y recuerdos: la anciana se inspira en una momia peruana que Gauguin había visto en París."""
histoire = """
El año 1897 es el más sombrío de su vida: se entera de la muerte de su hija predilecta, Aline, arrebatada a los diecinueve años por una neumonía; está enfermo, endeudado, aislado en Punaauia. Pinta este inmenso lienzo a finales del año, en un mes aproximadamente según él, sobre una tela de yute basta, y lo considera su testamento. En 1898 parte hacia París, donde el marchante Ambroise Vollard lo expone a finales de año con ocho cuadros que se relacionan con él. Comprado después por un coleccionista de Burdeos, Gabriel Frizeau, pasa por otras manos en Francia y luego en los Estados Unidos, antes de ser adquirido en 1936 por el Museum of Fine Arts de Boston, que lo conserva desde entonces."""
facture = """
Gauguin trata el lienzo como un fresco: las esquinas amarillas imitan, dice, una pintura mural deteriorada en los ángulos, y la pintura delgada y mate se ajusta a la trama gruesa del yute. La gama está dominada por azules y verdes profundos, caldeados por los tonos cobrizos de los cuerpos. No hay una perspectiva única: las figuras, de escalas diferentes, se reparten en grupos como en un bajorrelieve, unidos por las curvas del paisaje. El formato muy alargado obliga a la mirada a recorrer la obra como se sigue un relato. Varias figuras retoman personajes de lienzos anteriores."""
details = [
  "El lactante dormido, abajo a la derecha, comienzo del relato.",
  "El personaje central que coge una fruta, con los brazos levantados.",
  "El ídolo azul de brazos levantados, a la izquierda.",
  "El pájaro blanco que sostiene un lagarto, a los pies de la anciana.",
  "El título pintado en la esquina amarilla de arriba a la izquierda.",
]
themes = ["vida", "muerte", "destino", "espiritualidad", "tahití"]
anecdote = """
Gauguin cuenta a Daniel de Monfreid que, tras terminar el lienzo, se fue a la montaña a tragar arsénico para morir. La dosis, demasiado fuerte, le hizo vomitar: sobrevivió tras una noche de sufrimientos."""
