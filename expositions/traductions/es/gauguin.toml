[[artistes]]
nom = "Paul Gauguin"
vie = "París, 7 de junio de 1848 – Atuona (Hiva Oa, islas Marquesas), 8 de mayo de 1903"
biographie = """
Nacido en París en 1848, Paul Gauguin pasa sus primeros años en Lima, en Perú, en la familia de su madre, hija de la militante socialista y feminista Flora Tristán. De regreso en Francia, se enrola en la marina mercante y después en la marina nacional. En 1871 entra en casa de un agente de cambio en París y triunfa en las finanzas; en 1873 se casa con una danesa, Mette Gad, que le dará cinco hijos. Pintor de domingo, coleccionista de impresionistas, alumno y amigo de Camille Pissarro, participa en sus exposiciones de 1879 a 1886. Tras el crac de 1882, abandona la Bolsa para dedicarse a la pintura, a costa de la pobreza y de la separación de su familia, que se queda en Copenhague. Reside en Pont-Aven a partir de 1886, parte en 1887 a Panamá y a la Martinica con Charles Laval, y después elabora en Bretaña, con Émile Bernard, el sintetismo. A finales de 1888, pasa dos meses en Arlés junto a Van Gogh, estancia que concluye con el drama de la oreja cortada. En 1891 parte hacia Tahití, regresa en 1893 para exponer en Durand-Ruel sin gran éxito, y vuelve a partir definitivamente en 1895. Enfermo, endeudado, enfrentado a la administración colonial y a la misión católica, se instala en 1901 en las Marquesas, en Atuona, donde muere en 1903. La gran retrospectiva del Salón de Otoño de 1906 revela la amplitud de su obra."""
style = """
Gauguin rompe con el impresionismo, que juzga demasiado apegado a la observación. Simplifica las formas, las perfila con contornos oscuros y las rellena de colores puros, aplicados en superficies planas y elegidos por su fuerza expresiva más que por su parecido: un perro puede ser rojo, un campo bermellón. Sus lienzos, alimentados por estampas japonesas, arte popular bretón, artes de Java, de Egipto o de Polinesia, buscan expresar ideas, sueños y creencias. Pintor, pero también escultor, ceramista y grabador en madera, abre el camino a los nabis, a quienes Paul Sérusier transmite sus lecciones desde 1888, a los fauves, a Picasso y a los expresionistas alemanes. Su mirada sobre la Polinesia y sobre las jovencísimas compañeras que tomó allí es hoy objeto de una relectura crítica."""
