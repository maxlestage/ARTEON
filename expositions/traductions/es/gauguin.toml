titre = "Gauguin, la lejanía en colores"
artiste = "Paul Gauguin"
dates = "1848–1903"
accroche = "Exposición virtual · Paul Gauguin"
introduction = """
De Pont-Aven a Tahití, Gauguin lo deja todo para encontrar una pintura más libre: superficies planas de colores puros perfilados en negro, rojos y amarillos imposibles, visiones y mitos. Nueve lienzos, desde La visión después del sermón hasta su gran testamento, ¿De dónde venimos?"""
vitrine = "nafea.jpg"

[musee]
nom = "Gliptoteca Ny Carlsberg"
ville = "Copenhague, Dinamarca"
architecte = "Vilhelm Dahlerup"
construction = "abierto en 1897"
presentation = """
El cervecero Carl Jacobsen, heredero de la cerveza Carlsberg, colecciona escultura antigua y francesa; la dona al público, y Copenhague le construye un museo frente a los jardines de Tivoli. El edificio de Vilhelm Dahlerup abre en 1897; Hack Kampmann lo amplía en 1906 y, en 1996, Henning Larsen le añade un ala para la pintura francesa. En el corazón del museo, el jardín de invierno reúne palmeras y estatuas bajo una cúpula de cristal. La Gliptoteca, que debe su nombre a la escultura, conserva también un rico conjunto de pintura francesa y uno de los fondos más importantes de Gauguin fuera de Francia. El pintor había vivido en Copenhague en 1884–1885, en la familia de su esposa danesa, Mette Gad, y muchos lienzos de sus comienzos y de Tahití se quedaron en Dinamarca, donde Mette los vendía para criar a sus hijos."""
ici = """
El edificio de ARTEON no es más que una evocación sencilla: tres salas en enfilada, unidas por pasillos, sin plano dibujado, que siguen el viaje del pintor. La Sala I · Pont-Aven, de muros beige claro, muestra la Bretaña del sintetismo. Un pasillo conduce a la Sala II · La primera estancia en Tahití, la más rica, de muros arena dorada, y después a la Sala III · El testamento, de muros verde pálido, donde el gran friso de ¿De dónde venimos? cierra la visita."""

