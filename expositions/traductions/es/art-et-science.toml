[[oeuvres]]
titre = "Primera lámina de los músculos (De humani corporis fabrica)"
artiste = "André Vésale"
annee = "1543"
image = "premiere-planche-des-muscles.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:De_humani_corporis_fabrica_(27).jpg"
technique = "Xilografía, página del libro impreso en Basilea por Johannes Oporinus"
collection = "Colecciones especiales de la Universidad de Ámsterdam"
note = "Un desollado camina por un paisaje italiano: la primera lámina de los músculos del gran tratado que refundó la anatomía."
description = """
Un hombre despojado de su piel está de pie, de frente, en medio de un paisaje. Avanza un paso, con la cabeza echada hacia el cielo, los brazos abiertos y las manos extendidas, como en un gesto de lamentación. Todos los músculos superficiales están al descubierto: los pectorales, los abdominales recortados en cuadros, los largos músculos de los muslos y de los brazos, marcados con pequeñas letras que remiten al texto. Detrás de él se extiende una campiña ondulada, con colinas, casas, ruinas antiguas, obeliscos, una pirámide y arcadas. Arriba, el título latino PRIMA MUSCULORUM TABULA, el encabezamiento del libro con el nombre de Vesalio y el número de la página."""
evocation = """
Vesalio presenta sus desollados como estatuas antiguas, vivos y en movimiento, en lugar de mostrarlos tendidos sobre la mesa de disección. Se ha visto en ello un eco de las meditaciones sobre la muerte, pero también el orgullo de una ciencia nueva que se atreve a mirar bajo la piel. El paisaje salpicado de ruinas recuerda la Italia del Renacimiento, donde se redescubría la Antigüedad. El mensaje del libro es claro: la anatomía ya no debe leerse en los textos de Galeno, el médico griego cuya autoridad reinaba desde hacía trece siglos, sino aprenderse en el propio cuerpo humano. Vesalio muestra que Galeno había descrito a menudo animales, monos o cerdos, más que hombres."""
histoire = """
Vesalio tiene solo veintiocho años cuando aparece, en 1543, en Basilea, en la imprenta de Johannes Oporinus, el De humani corporis fabrica libri septem, «Siete libros sobre la estructura del cuerpo humano». Profesor en Padua, fundaba allí su enseñanza en la disección, que practicaba él mismo. Los grabados fueron dibujados en Venecia, en el entorno de Tiziano; a menudo se atribuyen, al menos en parte, a Jan Steven van Calcar, pero la cuestión sigue discutida. Los tacos de madera fueron enviados de Venecia a Basilea al otro lado de los Alpes. El libro, dedicado al emperador Carlos V, escandaliza a los fieles de Galeno antes de imponerse como el fundamento de la anatomía moderna. En 1555 aparece una segunda edición."""
facture = """
La xilografía alcanza aquí una finura pocas veces igualada. Los tallados siguen la forma de los músculos, como las propias fibras, y los sombreados modelan los volúmenes. El dibujo conjuga la exactitud anatómica, controlada por Vesalio, y una manera veneciana de situar la figura en el espacio, con un contrapposto inspirado en la escultura antigua. El paisaje, tratado con más ligereza, se aleja hasta el horizonte. Pequeñas letras grabadas en los músculos remiten a una leyenda: la imagen se lee con el texto, como un mapa con su leyenda."""
details = [
  "Las pequeñas letras sembradas sobre los músculos, que remiten a las explicaciones del texto.",
  "Los obeliscos y la pirámide, a la derecha, en el paisaje.",
  "Las arcadas en ruinas, al pie de las colinas, a la derecha.",
  "La cabeza echada hacia atrás, casi como la de un mártir.",
  "El número de página, 170, arriba a la izquierda.",
]
themes = ["anatomía", "cuerpo", "medicina", "renacimiento", "paisaje"]
anecdote = """
Los tacos de madera de la Fabrica sirvieron para tiradas durante casi cuatro siglos, hasta una edición de 1934. Conservados en la biblioteca de la Universidad de Múnich, fueron destruidos durante los bombardeos de la ciudad en 1944."""
