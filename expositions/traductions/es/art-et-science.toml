[[oeuvres]]
titre = "El rinoceronte"
artiste = "Albrecht Dürer"
annee = "1515"
image = "rhinoceros.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Albrecht_Dürer,_The_Rhinoceros,_1515,_NGA_47903.jpg"
technique = "Xilografía, con un texto impreso en alemán"
collection = "National Gallery of Art, Washington"
note = "Durero nunca vio al animal: lo grabó a partir de un boceto y de una carta llegados de Lisboa, y su imagen tuvo valor de referencia durante más de dos siglos."
description = """
Un rinoceronte macizo, visto de perfil, avanza hacia la derecha y ocupa casi toda la hoja. Su piel no parece una piel: está hecha de placas rígidas, remachadas y rematadas como las piezas de una armadura, salpicadas de círculos, escamas y pequeñas rosetas. Las patas están enfundadas en escamas, el cuello se pliega como una gorguera y, sobre el gran cuerno de la nariz, un pequeño cuerno retorcido brota en el hombro. El suelo no es más que una línea, con algunas piedras. Arriba a la derecha, la fecha 1515, la palabra RHINOCERUS y el monograma del artista; arriba del todo, en cinco líneas, un texto alemán relata la llegada de la bestia a Portugal."""
evocation = """
Para los europeos de 1515, el rinoceronte es una criatura casi legendaria, conocida por los autores antiguos: ninguno se había visto en Europa desde la época romana. Durero hace de él una máquina de guerra viviente, cuya coraza recuerda las armaduras que se forjaban en Núremberg. El texto cuenta que la bestia es enemiga mortal del elefante, que lo ataca con la cabeza gacha para abrirle el vientre, y que es rápida, audaz y astuta. Es el ejemplo mismo de una imagen que mezcla observación e imaginación: una precisión extrema en el detalle, puesta al servicio de un animal en parte inventado, que todo el mundo tuvo sin embargo por verdadero."""
histoire = """
El animal, un rinoceronte indio, era un regalo del sultán de Guyarat al gobernador de la India portuguesa, Afonso de Albuquerque, quien lo envió al rey Manuel I. Desembarcado en Lisboa en mayo de 1515, causó sensación. El rey se lo ofreció después al papa León X, pero el barco que lo transportaba naufragó frente a la costa ligur a comienzos de 1516 y la bestia se ahogó. Entretanto, una carta acompañada de un boceto había llegado a Núremberg. Durero hizo con ello un dibujo a pluma, hoy en el British Museum, y después esta xilografía, tirada en muchísimos ejemplares y reeditada varias veces tras su muerte. Esta prueba se conserva en la National Gallery of Art de Washington, que difunde libremente su reproducción."""
facture = """
La xilografía se trabaja en relieve: se vacía con la gubia todo lo que debe quedar en blanco, y solo las líneas, dejadas en pie, reciben la tinta. Durero dibujaba sus composiciones y probablemente confiaba el tallado a un especialista, pero lleva la técnica a una finura excepcional: sombreados paralelos para modelar los flancos, entramados cruzados para las sombras, una siembra de pequeños círculos para el grano de la piel. El encuadre cerrado, en el que el cuerno y la cola casi tocan los bordes, confiere al animal una presencia monumental. Sin color ni decorado, toda la mirada se concentra en la materia de la coraza."""
details = [
  "El pequeño cuerno retorcido sobre el hombro, que los rinocerontes reales no tienen.",
  "El texto alemán de arriba, que fecha por error la llegada de la bestia en 1513.",
  "El monograma de Durero, una gran A que cobija una D, bajo la palabra RHINOCERUS.",
  "Las patas cubiertas de escamas, como las de un reptil.",
  "El borde de las placas, en el hombro y en la grupa, como el reborde de una armadura.",
]
themes = ["animal", "exotismo", "xilografía", "imaginación", "renacimiento"]
anecdote = """
A pesar de sus errores, la imagen de Durero fue referencia durante muchísimo tiempo: los libros de historia natural la copiaron hasta el siglo XVIII, pequeño cuerno dorsal incluido, aun cuando ya se habían visto en Europa otros rinocerontes vivos."""
salle = 2
mur = "ouest"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "Flamenco americano (lámina 431)"
artiste = "John James Audubon"
annee = "1838"
image = "flamant-rose.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:431_American_Flamingo.jpg"
technique = "Aguafuerte y aguatinta coloreados a mano, grabados por Robert Havell; hoja de casi un metro de alto"
collection = "Biblioteca de la Universidad de Pittsburgh"
note = "Para representar al ave a tamaño natural en la página, Audubon le hace doblar el cuello hasta el suelo: el formato del libro dicta la pose."
description = """
Un flamenco rosa, inmenso, se inclina al borde de una orilla herbosa. Su largo cuello describe un lazo que desciende hasta el suelo, y su pico acodado, negro y amarillo, roza casi la hierba. El plumaje es de un rojo coral, más intenso en las alas plegadas, donde asoman plumas negras. Las patas, interminables y de un rosa pálido, terminan en pies palmeados apoyados en el filo de la orilla. Más abajo, sobre una extensión de agua tranquila bordeada por una costa llana, otros flamencos, diminutos, caminan o se alimentan. En la parte superior de la hoja, unos dibujos lineales muestran aparte el pico, visto desde varios ángulos, y una pata, como en un tratado de anatomía."""
evocation = """
Audubon quería mostrar cada ave de América a su tamaño real, y esa regla produce aquí una imagen impresionante: el ave parece demasiado grande para la página y debe plegarse a ella. La pose, que recoge el gesto del flamenco hurgando en el cieno, es a la vez exacta y teatral. El contraste entre el ave gigante del primer plano y sus congéneres lejanos crea la profundidad del paisaje. Los estudios del pico recuerdan que el libro quería ser también una obra de ciencia. Se ha visto a menudo en Las aves de América el retrato de una naturaleza todavía salvaje y de una abundancia que parecía inagotable; varias de las especies pintadas por Audubon, como la paloma migratoria o el periquito de Carolina, han desaparecido desde entonces."""
histoire = """
Al no encontrar editor en Estados Unidos, Audubon parte en 1826 hacia Gran Bretaña. Las aves de América aparecen allí por entregas, vendidas por suscripción, de 1827 a 1838: 435 láminas en el formato llamado «doble elefante», grabadas y coloreadas en su mayor parte en Londres por Robert Havell hijo, a partir de las acuarelas del pintor. El flamenco pertenece a las últimas entregas, en 1838. Las acuarelas originales, vendidas por la viuda de Audubon, se conservan en la New-York Historical Society. Se calcula que se reunieron unos doscientos ejemplares completos, de los que subsisten algo más de cien; este pertenece a la Universidad de Pittsburgh, y el Natural History Museum de Londres posee otro."""
facture = """
Audubon trabajaba a partir de aves que acababa de abatir: las fijaba, aún flexibles, con alambres sobre un tablero cuadriculado para darles una actitud viva, y después las pintaba a la acuarela, realzada con pastel y gouache. Havell trasladaba el dibujo al cobre combinando el aguafuerte y el buril, para los contornos y las plumas, y la aguatinta, que da a los fondos sus tintas granulosas. Cada hoja era luego coloreada a mano por un equipo de coloristas. El paisaje, a menudo confiado a ayudantes o al grabador, se mantiene sencillo para dejar que el ave domine."""
details = [
  "Los estudios del pico y de la pata, numerados, en la parte superior de la hoja.",
  "Las plumas negras de las alas, apenas visibles bajo el rojo del plumaje.",
  "Los flamencos lejanos, en el agua, que dan la escala del paisaje.",
  "La leyenda grabada abajo: American Flamingo, con el nombre latino del ave.",
]
themes = ["aves", "américa", "tamaño natural", "ornitología", "aguatinta"]
anecdote = """
En diciembre de 2010, un ejemplar completo de Las aves de América fue adjudicado en Sotheby's, en Londres, por más de 7,3 millones de libras esterlinas, lo que lo convertía entonces en el libro impreso más caro jamás vendido en subasta."""
salle = 2
mur = "nord"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Discomedusae (lámina 8 de Formas artísticas de la naturaleza)"
artiste = "Ernst Haeckel"
annee = "1899–1904"
image = "discomedusae.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Haeckel_Discomedusae_8.jpg"
technique = "Litografía en color a partir de un dibujo de Haeckel"
collection = "Lámina de la colección Kunstformen der Natur, Leipzig y Viena"
note = "Medusas dibujadas como lámparas de araña o joyas: Haeckel quiere demostrar que la naturaleza inventa por sí misma formas de arte."
description = """
Sobre un fondo blanco flotan cuatro medusas, numeradas y dispuestas como en una lámina de museo. La más grande, arriba a la derecha, abre una umbrela azul de bordes festoneados, de la que cuelgan brazos anaranjados plisados, una masa de flecos azul pálido y una cabellera de filamentos rojos tan largos que serpentean hasta el pie de la hoja. Arriba a la izquierda, una medusa azul malva deja arrastrar tentáculos en forma de sacacorchos. A la derecha, una umbrela amarilla estriada de marrón, como una pantalla de lámpara, lleva brazos rosados e hilos amarillos. Abajo, una medusa vista desde debajo dibuja una roseta azul de corazón naranja."""
evocation = """
Haeckel, ferviente discípulo de Darwin, veía en la naturaleza un único gran conjunto regido por leyes, donde la belleza nace de sí misma: simetrías, radios, espirales. El título de la colección, Formas artísticas de la naturaleza, expresa su proyecto: ofrecer a los artistas y al público un repertorio de formas reales, más inventivas que cualquier ornamento. La gran medusa lleva una carga más íntima: Haeckel la había llamado Desmonema annasethe, en recuerdo de su primera esposa, Anna Sethe, fallecida en 1864, y en sus largos filamentos se ha leído la imagen de una cabellera. Estas láminas alimentaron el Art Nouveau, que buscaba precisamente sus motivos en las plantas y los animales."""
histoire = """
Haeckel publica las Kunstformen der Natur en entregas de diez láminas, de 1899 a 1904, en la editorial Bibliographisches Institut, en Leipzig y Viena. Hizo él mismo los dibujos, a partir de sus observaciones al microscopio, de sus estancias junto al mar y de los especímenes traídos por las grandes expediciones científicas, como la del navío británico Challenger, cuyos radiolarios había estudiado. La mayoría de las láminas fueron litografiadas por Adolf Giltsch. La colección de cien láminas tiene un gran éxito, en Alemania y luego en toda Europa. Las medusas de esta lámina recogen especies que Haeckel había descrito en su gran monografía, Das System der Medusen, publicada a partir de 1879."""
facture = """
Haeckel compone cada lámina como un ornamento: los organismos se disponen en arabesco sobre un fondo blanco, sin ningún decorado. El dibujo, de gran precisión anatómica, insiste en los elementos repetidos: festones de la umbrela, pliegues de los brazos, canales radiales. La litografía en color, que exige una piedra por tinta, permite colores francos y pasajes delicados: azules fríos de las umbrelas, rojos y anaranjados de los filamentos. Las largas líneas ondulantes de los tentáculos, que atraviesan toda la hoja, anuncian las curvas en latigazo del Art Nouveau."""
details = [
  "Los filamentos rojos de la gran medusa, que descienden hasta el pie de la lámina.",
  "La medusa vista desde debajo, abajo, cuya umbrela forma una roseta.",
  "Los tentáculos en sacacorchos de la medusa azul malva, arriba a la izquierda.",
  "Los pequeños números, del 1 al 4, que remiten a las explicaciones del texto.",
]
themes = ["medusas", "mar", "simetría", "art nouveau", "zoología"]
anecdote = """
Para la puerta monumental de la Exposición Universal de París, en 1900, el arquitecto René Binet se inspiró directamente en los radiolarios dibujados por Haeckel, esos organismos marinos microscópicos de esqueletos de sílice calados."""
salle = 2
mur = "nord"
place = 4
largeur = 1.2

[[oeuvres]]
titre = "Piña y cucarachas (lámina 1 de la Metamorphosis insectorum Surinamensium)"
artiste = "Maria Sibylla Merian"
annee = "1705"
image = "ananas-merian.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Metamorphosis_insectorum_Surinamensium_-_KW_1792_A_19_-_plaat01.jpg"
technique = "Grabado en cobre coloreado a mano, grabado por Joseph Mulder a partir de Merian"
collection = "Koninklijke Bibliotheek, La Haya"
note = "La primera lámina del libro que Merian trajo de Surinam: una piña en flor, invadida por cucarachas en distintas etapas de su vida."
description = """
Una piña se alza en el centro de la hoja, todavía sobre su planta, rodeada de largas hojas verde grisáceo bordeadas de espinas, que se abren en abanico. El fruto, coronado por un penacho de hojas, está cubierto de escamas azuladas y doradas; de su base brotan grandes hojas rojas moteadas de amarillo. Alrededor, cucarachas: dos adultas de alas pardas desplegadas vuelan en lo alto, otra, con las alas plegadas, está posada sobre una hoja, y una cucaracha joven y pálida de largas antenas trepa a la derecha. Abajo, una pequeña esfera parda y dos insectos más pequeños completan la escena. Sin decorado: la planta y sus huéspedes se recortan sobre el papel claro."""
evocation = """
Merian no coloca los insectos en casillas: los muestra vivos, sobre la planta que los alimenta, en varias etapas de su metamorfosis. Esta manera de vincular al animal, su alimento y su ciclo de vida la convierte en pionera de lo que se llamará ecología. Abrir el libro con la piña no es casualidad: este fruto de las Américas, raro y caro en Europa, era el símbolo mismo del lujo exótico. Pero Merian instala en él, sin falso pudor, las cucarachas que lo devoran. También se ha leído su libro como un testimonio sobre la colonia neerlandesa de Surinam, fundada en el trabajo de los esclavos, de los que habla en varias ocasiones en sus textos."""
histoire = """
En 1699, a los cincuenta y dos años, Merian se embarca hacia Surinam, colonia neerlandesa de América del Sur, con su hija Dorothea Maria, para estudiar los insectos. Trabaja allí casi dos años, ayudada por esclavos africanos y amerindios que le traen especímenes e información, hasta que la enfermedad la obliga a regresar en 1701. En Ámsterdam prepara un gran libro de sesenta láminas, la Metamorphosis insectorum Surinamensium, que publica en 1705 a su costa, por suscripción, en latín y en neerlandés. Las láminas fueron grabadas por varios grabadores, entre ellos Joseph Mulder, que firmó esta; los ejemplares de lujo se colorean a mano. Este ejemplar pertenece a la Biblioteca Real de los Países Bajos, en La Haya."""
facture = """
Merian pintaba del natural, a la acuarela y al gouache sobre vitela, siguiendo la evolución de las orugas y las larvas que criaba ella misma. Los grabadores trasladaron sus estudios al cobre con un trazo fino y ligero, que la acuarela de los coloristas cubre casi por completo: el color se impone sobre el negro del grabado. La composición está construida como un retrato: la planta, vista de frente, llena la página, y los insectos se reparten a su alrededor como satélites. Los verdes, los rojos y los pardos se aplican en tintas francas, con realces más oscuros para los volúmenes."""
details = [
  "La firma del grabador, J. Mulder sculp., abajo a la izquierda.",
  "Las dos cucarachas en vuelo, arriba, con las alas pardas muy abiertas.",
  "La cucaracha joven y pálida, sin alas, de largas antenas, sobre una hoja a la derecha.",
  "Las diminutas espinas que bordean cada hoja de la piña.",
]
themes = ["insectos", "metamorfosis", "surinam", "frutas", "mujeres sabias"]
anecdote = """
Tras la muerte de Merian, en 1717, el zar Pedro el Grande compró buena parte de sus acuarelas y de sus estudios. Siguen conservándose en San Petersburgo, en las colecciones de la Academia de Ciencias de Rusia."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Rosal de cien hojas foliáceo (Rosa centifolia foliacea)"
artiste = "Pierre-Joseph Redouté"
annee = "1817–1824"
image = "rosier-a-cent-feuilles.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Redoute_-_Rosa_centifolia_foliacea.jpg"
technique = "Grabado a punteado impreso en color y retocado a la acuarela, grabado por Langlois"
collection = "Lámina del libro Les Roses, París"
note = "El retrato de una variedad de rosa, flores, capullos y hojas, por el pintor al que se apodaba el Rafael de las flores."
description = """
Una rama de rosal se despliega sobre el papel blanco, desde el tallo espinoso, abajo, hasta los capullos, arriba. En la cima se abren dos grandes rosas de un rosa tierno, de pétalos apretados y enrollados en copa, una abierta del todo, la otra aún a medio cerrar. Alrededor, capullos en distintas etapas, envueltos en sus sépalos verdes, cuyas puntas se recortan en pequeñas hojas. El follaje, abundante, muestra folíolos dentados de un verde intenso, vistos unas veces por el haz, otras por el envés, más pálido. Abajo, dos leyendas grabadas en cursiva dan el nombre latino, Rosa centifolia foliacea, y el nombre francés, Rosier à cent feuilles foliacé."""
evocation = """
La rosa es la flor más cargada de símbolos en Occidente: el amor, la belleza, la fugacidad del tiempo. Redouté no busca, sin embargo, ni alegoría ni ramo: hace el retrato de una variedad precisa, tal como un botánico o un jardinero podrán reconocerla. El detalle que le da su nombre, los sépalos transformados en pequeñas hojas, se pone en evidencia con esmero. El libro nació en el París del Imperio y de la Restauración, donde el cultivo de rosas estaba de moda: la emperatriz Josefina había reunido una célebre colección en la Malmaison, y los horticultores multiplicaban las variedades nuevas. Estas láminas guardan su memoria, y algunas de las rosas pintadas por Redouté son hoy difíciles de encontrar en los jardines."""
histoire = """
Les Roses aparecen en París por entregas, de 1817 a 1824, y forman tres volúmenes de 168 láminas. Los textos son del botánico Claude-Antoine Thory, que describe cada variedad. La emperatriz Josefina, que había protegido a Redouté, había muerto en 1814: el libro se asocia a menudo con su rosaleda de la Malmaison, pero los modelos proceden de varios jardines y viveros de la región parisina. El éxito fue tal que una edición de menor formato siguió ya en la década de 1820. Buscadas por los coleccionistas, las láminas se han separado a menudo de los volúmenes para enmarcarlas, y figuran hoy entre las imágenes de flores más reproducidas del mundo."""
facture = """
Redouté perfeccionó el grabado a punteado impreso en color. En lugar de líneas, el grabador excava en el cobre una multitud de puntos más o menos apretados, que logran los modelados sin contornos duros. Los colores se depositan sobre la misma plancha con pequeños tampones de tela, las muñequillas, y se imprimen de una sola pasada; la prueba se retoca luego a mano con acuarela. El resultado imita la transparencia de la acuarela sobre vitela, en la que Redouté sobresalía. El fondo blanco, sin sombra proyectada, aísla la planta como en un herbario."""
details = [
  "Los sépalos de los capullos, recortados como pequeñas hojas: es el sentido de la palabra foliáceo.",
  "Las finas espinas del tallo, abajo del todo.",
  "El envés pálido de algunas hojas, que se vuelven hacia nosotros.",
  "Las menciones grabadas abajo: P. J. Redouté pinx., el impresor Rémond y el grabador Langlois.",
]
themes = ["rosas", "botánica", "flores", "color", "jardines"]
anecdote = """
