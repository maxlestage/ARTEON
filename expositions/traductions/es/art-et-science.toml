[[oeuvres]]
titre = "El hombre de Vitruvio"
artiste = "Léonard de Vinci"
annee = "hacia 1490"
image = "homme-de-vitruve.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Da_Vinci_Vitruve_Luc_Viatour.jpg"
technique = "Pluma y tinta parda sobre punta de metal, sobre papel, aproximadamente 34 × 25 cm"
collection = "Gallerie dell'Accademia, Venecia"
note = "Un hombre inscrito en un círculo y en un cuadrado: Leonardo pone en imagen las proporciones ideales del cuerpo descritas por el arquitecto romano Vitruvio."
description = """
En el centro de una hoja cubierta de escritura, un hombre desnudo está dibujado dos veces, superpuesto: una vez con los brazos en horizontal y los pies juntos, otra con los brazos alzados y las piernas separadas. En la primera posición se inscribe en un cuadrado; en la segunda, sus manos y sus pies tocan un círculo cuyo centro es el ombligo. El rostro, enmarcado por rizos, mira al frente, grave. Pequeños trazos marcan sobre el cuerpo las divisiones de las proporciones, en el pecho, en las rodillas, a lo largo de los brazos. Bajo la figura corre una escala graduada; encima y debajo, líneas de texto están escritas al revés, de derecha a izquierda."""
evocation = """
El arquitecto romano Vitruvio afirmaba que un hombre bien proporcionado, con brazos y piernas abiertos, se inscribe a la vez en un círculo y en un cuadrado, las dos figuras perfectas, y que la arquitectura debía imitar esas proporciones. En el Renacimiento la idea fascina: el cuerpo humano sería un modelo reducido del universo. Otros artistas de la época se ejercitaron en esta figura, a menudo con torpeza. Leonardo resuelve el problema al no dar el mismo centro a las dos formas: el círculo gira en torno al ombligo, el cuadrado en torno al sexo. El dibujo se ha convertido en el símbolo mismo de la alianza entre el arte y la ciencia, y del humanismo que sitúa al hombre en el centro del mundo."""
histoire = """
Leonardo realiza este dibujo en Milán, hacia 1490, cuando está al servicio de Ludovico Sforza y estudia a la vez arquitectura, anatomía y proporciones. El texto que lo acompaña parafrasea el libro tercero del tratado De architectura de Vitruvio y enumera después, medida tras medida, las relaciones entre las partes del cuerpo y su altura: la envergadura de los brazos, por ejemplo, es igual a la estatura del hombre. La hoja pasó más tarde a la colección del pintor milanés Giuseppe Bossi, y entró en 1822 en las Gallerie dell'Accademia de Venecia. Muy sensible a la luz, se expone solo en contadas ocasiones y por periodos breves."""
facture = """
Leonardo traza primero la construcción con punta de metal, con compás y regla, y retoma después los contornos a pluma y con tinta parda, con un trazo seguro y ligero. Sombreados finos, típicos de su mano izquierda, modelan la musculatura con economía. La doble pose da una impresión de movimiento, casi de animación, en el corazón de una figura geométrica inmóvil. Como en todos los cuadernos de Leonardo, imagen y texto forman un todo: su escritura en espejo, trazada de derecha a izquierda, enmarca el dibujo."""
details = [
  "El ombligo, centro exacto del círculo.",
  "La escala graduada trazada bajo la figura.",
  "Los pequeños trazos que dividen el cuerpo en fracciones de su altura.",
  "La escritura en espejo de Leonardo, que hay que leer ante un espejo.",
  "Los cuatro brazos y las cuatro piernas, que sugieren un movimiento.",
]
themes = ["proporciones", "cuerpo", "geometría", "humanismo", "renacimiento"]
anecdote = """
El Hombre de Vitruvio figura en la cara italiana de las monedas de un euro. En 2019, su préstamo al Louvre para la exposición Leonardo da Vinci fue suspendido primero por un tribunal italiano, al que acudió una asociación de protección del patrimonio, antes de ser autorizado."""
