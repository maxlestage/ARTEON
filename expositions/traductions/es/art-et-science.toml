[[oeuvres]]
titre = "La pulga (Micrographia, esquema XXXIV)"
artiste = "Robert Hooke"
annee = "1665"
image = "puce-micrographia.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:HookeFlea01.jpg"
technique = "Grabado en cobre, gran lámina desplegable del libro Micrographia"
collection = "Biblioteca Nacional de Gales, Aberystwyth"
note = "Una pulga vista al microscopio y ampliada en una inmensa lámina desplegable: para el público de 1665, la revelación de un mundo invisible."
description = """
Una pulga, vista de perfil, ocupa toda la hoja. Su cuerpo ovalado está hecho de anillos que se solapan como las placas de una armadura, erizados de cerdas rígidas plantadas en hileras. La cabeza, pequeña, lleva un ojo redondo y piezas bucales puntiagudas; las patas, articuladas, están cubiertas de pelos y terminan en garras curvas. Las patas traseras, muy largas y plegadas bajo el cuerpo, dejan adivinar la potencia del salto. Letras capitales, de la A a la L, están colocadas sobre las distintas partes del cuerpo y remiten a la descripción del texto. No hay sombra proyectada ni decorado: el insecto está solo, como suspendido sobre la página blanca."""
evocation = """
Para los lectores de 1665, la pulga es el más vil de los parásitos, que se aplasta sin mirarlo. Hooke hace de ella un objeto de admiración: en su texto se maravilla de su fuerza y de la belleza de su armadura, y la lámina le confiere la dignidad de un retrato. La imagen dice el choque del microscopio: bajo la lente, lo minúsculo se vuelve monumental, y la naturaleza revela por doquier un orden y una finura insospechados. Para los sabios de la Royal Society, que querían fundar el conocimiento en la experiencia y la observación, tales imágenes eran pruebas tanto como ilustraciones: hacían ver a todos lo que solo unos pocos habían podido observar."""
histoire = """
Robert Hooke es el curador de experimentos de la Royal Society de Londres, fundada en 1660, que le pide presentar, sesión tras sesión, observaciones hechas al microscopio. Las reúne en Micrographia, publicada en enero de 1665 con el aval de la Sociedad e ilustrada con 38 láminas grabadas: el ojo de una mosca, la punta de una aguja, copos de nieve, mohos, una rodaja de corcho. El libro tiene un gran éxito entre el público culto. En su diario, Samuel Pepys cuenta que veló hasta las dos de la madrugada para leerlo, y lo considera el libro más ingenioso que jamás haya leído. Esta lámina procede del ejemplar de la Biblioteca Nacional de Gales."""
facture = """
Hooke dibujó él mismo sus observaciones. El microscopio de la época solo muestra con nitidez una pequeña zona a la vez, y el insecto vivo se mueve: por ello reconstruyó el animal entero a partir de numerosas vistas sucesivas, bajo iluminaciones diferentes. El grabado traduce esos dibujos mediante una red muy densa de líneas finas y paralelas que siguen la curvatura de cada segmento y dan a las placas un aspecto lustroso, casi metálico. El gran formato de la lámina, que se despliega fuera del libro, forma parte del efecto: el lector experimenta físicamente la ampliación."""
details = [
  "El ojo redondo de la pulga, en el costado de la pequeña cabeza.",
  "Las garras curvas en el extremo de las patas, que le permiten agarrarse.",
  "Las cerdas rígidas plantadas en hileras sobre cada anillo del cuerpo.",
  "Las letras de la A a la L, que remiten al texto de Hooke.",
]
themes = ["microscopio", "insectos", "invisible", "grabado", "royal society"]
anecdote = """
Fue en Micrographia donde Hooke, al observar una fina rodaja de corcho, describió sus pequeños alvéolos con el nombre de cells, pequeñas cámaras: la palabra ha perdurado, y la biología hizo de ella la célula."""
