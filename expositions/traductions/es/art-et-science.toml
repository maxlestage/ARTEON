[exposition]
ordre = 65
nom_court = "Arte y ciencia"
mouvement = "Arte y ciencia: la naturaleza dibujada"
cadre = "estampe"
couleur = "#2f5d50"
titre = "Arte y ciencia, la naturaleza dibujada"
artiste = "Leonardo, Durero, Vesalio, Merian, Audubon, Haeckel…"
dates = "1291–1904"
accroche = "Exposición virtual · Natural History Museum, Londres"
introduction = """
Durante siglos, sabios y artistas se necesitaron mutuamente: para describir una planta, un insecto, un músculo o el contorno de un continente, primero había que saber dibujarlo. La visita reúne diez imágenes en las que la observación se vuelve arte, del rinoceronte de Durero a las medusas de Haeckel, del Hombre de Vitruvio de Leonardo al flamenco rosa de Audubon, con un astrolabio yemení y el mapamundi del primer atlas moderno. El edificio se inspira en el Natural History Museum de Londres: tras un pórtico, una elevada nave, la Hintze Hall, se abre al oeste y al este a dos galerías y, al fondo, a un gabinete."""
vitrine = "flamant-rose.jpg"

[musee]
nom = "Natural History Museum"
ville = "Londres, Reino Unido"
architecte = "Alfred Waterhouse"
construction = "1873–1881"
presentation = """
A mediados del siglo XIX, las colecciones de historia natural del British Museum, nacidas del legado del médico Hans Sloane, desbordan sus salas de Bloomsbury. El naturalista Richard Owen, que las dirige, consigue la construcción de un edificio independiente en South Kensington, una «catedral de la naturaleza». Tras la muerte de Francis Fowke, ganador del concurso, Alfred Waterhouse retoma el proyecto en estilo románico: las obras comienzan en 1873 y el museo abre sus puertas el 18 de abril de 1881. La fachada está revestida por completo de terracota de color ante y gris azulado, un material que resiste el hollín londinense, y adornada con plantas y animales esculpidos: las especies vivas en el lado oeste, las especies extinguidas en el lado este. En el centro, la gran nave, rebautizada Hintze Hall en 2014, lleva un techo de paneles pintados con plantas; desde 2017 cuelga en ella el esqueleto de una ballena azul, en lugar de la célebre réplica de diplodoco. El museo, que no adoptó su nombre actual hasta 1992, es gratuito."""
ici = """
El edificio de ARTEON retoma el eje del museo de Waterhouse: un pórtico y luego una nave muy alta a la que se abren las galerías. Se entra por el sur al pórtico de Cromwell Road, de muros de piedra clara, y después a la Hintze Hall, de veintiocho metros de largo y dieciocho de alto, color terracota, donde se reúnen los animales. Al oeste se abre la galería de las plantas y los insectos, de un verde tierno; al este, la galería del cuerpo humano, de un rosa pálido. Al fondo de la nave, al norte, el gabinete del mundo, cuadrado, guarda los instrumentos y los mapas."""

