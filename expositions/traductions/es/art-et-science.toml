[[artistes]]
nom = "Albrecht Dürer"
vie = "Núremberg, 21 de mayo de 1471 – Núremberg, 6 de abril de 1528"
biographie = """
Hijo de un orfebre llegado de Hungría, Albrecht Dürer aprende primero el oficio de su padre y entra en 1486 en el taller del pintor Michael Wolgemut, en Núremberg, donde también se ilustran libros. Tras un viaje de aprendiz hacia el Rin, se casa con Agnes Frey en 1494 y parte ese mismo año a Venecia, donde descubre la pintura italiana. A su regreso abre su taller y publica en 1498 el Apocalipsis, una serie de grandes xilografías que lo hace célebre en toda Europa. Pinta autorretratos de una seguridad nueva y estudios de la naturaleza de una precisión inaudita, como la Liebre de 1502 o la Gran mata de hierba de 1503. Una segunda estancia en Venecia, de 1505 a 1507, confirma su reputación, y el emperador Maximiliano I le concede una pensión. Sus grabados en cobre de 1513–1514, El caballero, la Muerte y el Diablo, San Jerónimo en su celda y Melencolia I, figuran entre los más célebres de la historia. Tras un viaje a los Países Bajos en 1520–1521, se adhiere a las ideas de Lutero y consagra sus últimos años a tratados de geometría y de proporciones humanas."""
style = """
Durero une el rigor del dibujo gótico alemán y las lecciones del Renacimiento italiano: perspectiva, proporciones, modelado. Grabador ante todo, llevó la xilografía y el grabado en cobre a un grado de finura jamás alcanzado, haciendo de la estampa un arte de pleno derecho, difundido por toda Europa. Sus estudios de animales y de plantas, a la acuarela y al gouache, observan la naturaleza con una exactitud de naturalista. Su monograma AD, presente en casi todas sus obras, era conocido en todo el continente y ampliamente copiado."""

[[artistes]]
nom = "John James Audubon"
vie = "Les Cayes (Saint-Domingue), 26 de abril de 1785 – Nueva York, 27 de enero de 1851"
biographie = """
Hijo natural de un oficial de marina y plantador francés, Jean Audubon, y de una joven criada, Jeanne Rabin, fallecida pocos meses después de su nacimiento, se cría en Couëron, cerca de Nantes. En 1803, para evitarle el servicio militar, su padre lo envía a América, a una propiedad familiar de Pensilvania, Mill Grove, donde se apasiona por las aves. Casado en 1808 con Lucy Bakewell, prueba fortuna como comerciante en Kentucky, donde posee esclavos. Arruinado en 1819, vive de retratos y clases de dibujo, y después se fija una meta: pintar todas las aves de América del Norte. Recorre bosques, marismas y costas, de Luisiana a Labrador. Al no encontrar editor en Estados Unidos, parte en 1826 hacia Inglaterra y Escocia, donde su aire de trampero causa sensación. Publica allí Las aves de América, de 1827 a 1838, acompañadas de una Biografía ornitológica escrita con el escocés William MacGillivray. De regreso en América, emprende una obra sobre los mamíferos de América del Norte, que concluye con el pastor John Bachman y sus propios hijos. Muere en Nueva York en 1851."""
style = """
Audubon rompe con las aves rígidas, posadas de perfil sobre una rama: las muestra a tamaño natural y en acción, cazando, alimentándose, peleando, en su medio. Sus composiciones dramáticas y a menudo decorativas deben mucho a su talento de dibujante y a su experiencia de cazador y observador sobre el terreno. Sus láminas han moldeado la imagen de la naturaleza estadounidense; las sociedades de protección de aves fundadas en Estados Unidos a partir de 1886 tomaron su nombre."""

[[artistes]]
nom = "Ernst Haeckel"
vie = "Potsdam, 16 de febrero de 1834 – Jena, 9 de agosto de 1919"
biographie = """
Hijo de un jurista prusiano, Ernst Haeckel estudia medicina en Wurzburgo, Berlín y Viena, y sigue en Berlín la enseñanza del zoólogo Johannes Müller, que lo inicia en el estudio de los animales marinos. Tras una estancia en Mesina en 1859–1860, publica una monografía sobre los radiolarios, organismos microscópicos de esqueleto de sílice, ilustrada con sus propios dibujos. En 1862 se convierte en profesor de la Universidad de Jena, donde enseñará hasta 1909. La lectura de Darwin lo conmociona: se convierte en el más ardiente propagador de la teoría de la evolución en Alemania y dibuja los primeros árboles genealógicos de lo vivo. Acuña palabras con gran futuro, como ecología, en 1866. En 1864, la muerte de su joven esposa, Anna Sethe, lo sume en la desesperación. Viajero infatigable, de las Canarias a Ceilán, describe millares de especies nuevas. Su obra tiene también aspectos sombríos: algunos de sus dibujos de embriones, demasiado esquemáticos, fueron acusados de forzar las semejanzas, y sus teorías clasificaron a los pueblos humanos según una jerarquía racial hoy rechazada. Muere en Jena en 1919."""
style = """
Haeckel dibujaba como pensaba: buscando el orden, la simetría y el parentesco de las formas. Sus láminas, muy precisas pero dispuestas como ornamentos, ponen en valor los radios, las espirales y las estructuras repetidas de lo vivo. Quiso demostrar que la naturaleza es por sí misma artista. Sus Formas artísticas de la naturaleza proporcionaron a arquitectos, vidrieros y decoradores del Art Nouveau un inmenso repertorio de motivos, y siguen inspirando a grafistas y diseñadores."""

[[artistes]]
nom = "Maria Sibylla Merian"
vie = "Fráncfort del Meno, 2 de abril de 1647 – Ámsterdam, 13 de enero de 1717"
biographie = """
Hija del editor y grabador Matthäus Merian el Viejo, muerto cuando ella tenía tres años, Maria Sibylla crece en Fráncfort en el taller de su padrastro, el pintor de flores Jacob Marrel, que le enseña dibujo y pintura. De adolescente cría gusanos de seda y orugas para observar su transformación, en una época en que muchos creen todavía que los insectos nacen del barro. Casada en 1665 con el pintor Johann Andreas Graff, se establece en Núremberg, publica un libro de flores y luego, en 1679, un primer libro sobre las orugas y sus plantas nutricias. En 1685 se une, con su madre y sus dos hijas, a una comunidad religiosa, los labadistas, en Frisia, y se separa de su marido. Establecida en Ámsterdam en 1691, vende allí pinturas y especímenes y frecuenta a los coleccionistas. En 1699 parte hacia Surinam con su hija menor, Dorothea Maria, y regresa dos años después para preparar su gran libro, publicado en 1705. Víctima de un ataque en 1715, muere en Ámsterdam en 1717. Linneo citó sus láminas para describir numerosas especies."""
style = """
Merian une la precisión del naturalista y la gracia de la pintura de flores alemana y holandesa. Su gran innovación es reunir en una sola imagen el ciclo de un insecto, huevo, oruga, crisálida y adulto, con la planta de la que se alimenta: una imagen de lo vivo en relación, y no un catálogo de especies aisladas. Sus composiciones, elegantes y vivas, influyeron en la ilustración naturalista durante más de un siglo."""

[[artistes]]
nom = "Pierre-Joseph Redouté"
vie = "Saint-Hubert (actual Bélgica), 10 de julio de 1759 – París, 19 de junio de 1840"
biographie = """
Nacido en las Ardenas, en una familia de pintores, Pierre-Joseph Redouté deja la casa muy joven para trabajar como pintor itinerante. En 1782 se reúne en París con su hermano mayor Antoine-Ferdinand, decorador de teatro. Conoce al botánico Charles-Louis L'Héritier de Brutelle, que lo inicia en la botánica y le confía la ilustración de sus libros, así como al pintor Gerard van Spaendonck, maestro de la pintura de flores sobre vitela. Recibe el título de dibujante del gabinete de la reina María Antonieta y, tras la Revolución, trabaja para el Muséum d'histoire naturelle. La emperatriz Josefina lo convierte en su pintor de flores: publica Les Liliacées, de 1802 a 1816, y después Les Roses, de 1817 a 1824. Profesor de dibujo en el Muséum, cuenta entre sus alumnas con princesas y damas de la buena sociedad. A pesar de su gloria, sus gastos y las dificultades del mercado del libro ilustrado lo dejan en apuros al final de su vida. Muere en París en 1840."""
style = """
Redouté alía la exactitud que exigen los botánicos, que deben poder reconocer cada especie, con una elegancia de composición y una delicadeza de color que hacen de sus láminas obras de arte. Llevó a la perfección el grabado a punteado impreso en color, que logra la transparencia de la acuarela. Apodado el Rafael de las flores, sigue siendo la referencia de la ilustración botánica, y sus rosas y sus lirios no han dejado de reproducirse."""

[[artistes]]
nom = "André Vésale"
vie = "Bruselas, 31 de diciembre de 1514 – isla de Zante (Grecia), 15 de octubre de 1564"
biographie = """
Nacido en Bruselas en una familia de boticarios y médicos al servicio de los emperadores, Andries van Wesel, llamado Vesalio, estudia en Lovaina y luego en París, donde sigue las lecciones de los anatomistas Jacques Dubois y Johann Winter de Andernach. Allí se enseña una anatomía leída en los libros de Galeno, mientras un barbero se encarga de la disección. Por falta de cuerpos, el joven Vesalio va a buscar huesos al patíbulo de Montfaucon. Doctorado en Padua en 1537, se convierte allí enseguida en profesor de cirugía y de anatomía, y disecciona él mismo ante sus estudiantes. Constata poco a poco que muchas descripciones de Galeno valen para animales, no para el hombre. En 1543, a los veintiocho años, publica en Basilea la Fabrica, acompañada de un compendio, la Epitome. Ese mismo año se convierte en médico del emperador Carlos V y después de su hijo Felipe II de España. En 1564 emprende una peregrinación a Jerusalén; en el camino de vuelta muere en la isla de Zante, en Grecia, antes de haber cumplido cincuenta años."""
style = """
Vesalio no era un artista, pero concibió sus libros como obras de arte: dirigió su ilustración, eligió a los dibujantes, controló el grabado y la maquetación. Su principio es simple y revolucionario: ver antes de creer, y mostrar lo que se ha visto. Sus desollados y sus esqueletos situados en paisajes, elegantes y melancólicos, fueron copiados por toda Europa y fijaron por mucho tiempo la imagen del cuerpo en los libros de medicina."""

[[artistes]]
nom = "Léonard de Vinci"
vie = "Vinci (Toscana), 15 de abril de 1452 – Amboise, 2 de mayo de 1519"
biographie = """
Hijo ilegítimo de un notario florentino, Leonardo crece en Vinci, en la Toscana, y entra hacia 1469 en el taller de Andrea del Verrocchio, en Florencia, donde aprende pintura, escultura y mecánica. En 1482 parte hacia Milán al servicio de Ludovico Sforza, como ingeniero, organizador de fiestas y pintor: allí pinta la Virgen de las Rocas y la Última Cena. Tras la caída de Ludovico, en 1499, pasa por Mantua y Venecia, y regresa a Florencia, donde comienza la Gioconda hacia 1503 y sirve un tiempo a César Borgia como ingeniero militar. Vuelve a Milán y se instala en Roma en 1513. En 1516, el rey Francisco I lo invita a Francia y lo aloja en el castillo de Cloux, cerca de Amboise, donde muere en 1519. Durante toda su vida llenó millares de páginas de cuadernos: máquinas, vuelo de las aves, movimiento de las aguas, botánica, geología y sobre todo anatomía. Disecó cuerpos humanos en Florencia, en el hospital de Santa Maria Nuova, y en Pavía con el médico Marcantonio della Torre. Sus dibujos anatómicos, que permanecieron inéditos, se encuentran hoy en su mayoría en la colección real británica, en Windsor."""
style = """
Leonardo funda la pintura en la observación y el conocimiento: anatomía, óptica, botánica. Inventa el sfumato, ese modelado vaporoso que funde los contornos en la sombra, y una perspectiva atmosférica en la que los lejanos se azulean. Dibujante prodigioso, se sirve de la pluma, de la piedra negra, de la sanguina y de la punta de metal para pensar tanto como para representar. Sus cuadernos, donde la imagen se mezcla con la escritura en espejo, hacen de él la figura misma del genio del Renacimiento, a la vez artista y sabio."""

[[artistes]]
nom = "Yémen, dynastie rasoulide"
vie = "Yemen (Taʿizz, Zabid, Adén), 1229–1454"
biographie = """
Los rasulíes son una familia de origen turcomano, según la mayoría de los historiadores, aunque reivindicaran una ascendencia árabe. Llegan a Yemen al servicio de los ayubíes, la dinastía de Saladino, que había conquistado el país en 1174. En 1229, su gobernador, Nur al-Din ʿUmar ibn ʿAli ibn Rasul, toma el poder por su cuenta y funda un sultanato que durará hasta 1454. Desde sus capitales de Taʿizz y Zabid, los sultanes controlan el puerto de Adén, encrucijada del comercio entre la India, el África oriental, Egipto y el Mediterráneo. Esa riqueza financia mezquitas, madrasas y una corte erudita. Varios sultanes escriben ellos mismos: al-Muzaffar Yusuf, que reina de 1250 a 1295, compone en particular un tratado de remedios; su hijo al-Ashraf ʿUmar, autor del astrolabio expuesto aquí, escribe sobre las estrellas y los instrumentos. Los rasulíes encargan también en Egipto y en Siria vidrios esmaltados y cobres incrustados con su emblema, una rosa de cinco pétalos."""
style = """
La corte rasulí fue uno de los grandes focos de ciencia y de arte del mundo islámico medieval. Astrónomos, médicos y agrónomos trabajaban allí bajo la protección de sultanes que eran ellos mismos sabios. Los objetos de corte, instrumentos de latón grabados e incrustados, vidrios esmaltados, aguamaniles y candelabros, llevan a menudo inscripciones a nombre del sultán y la rosa de cinco pétalos de la dinastía, y combinan la precisión técnica con un refinado decorado caligráfico y vegetal."""

[[artistes]]
nom = "Abraham Ortelius"
vie = "Amberes, 14 de abril de 1527 – Amberes, 28 de junio de 1598"
biographie = """
Nacido en Amberes en una familia llegada de Augsburgo, Abraham Ortelius pierde pronto a su padre. En 1547 está inscrito en el gremio de San Lucas como iluminador de mapas: colorea a mano mapas impresos, que vende junto con libros, estampas y antigüedades. Sus viajes de negocios, a las ferias de Fráncfort, a Francia, a Italia y a Inglaterra, le permiten reunir los mejores mapas de su tiempo y relacionarse con los sabios, en particular con Gerardus Mercator, que se convierte en su amigo. Tiene la idea de reunir mapas del mismo formato en un solo volumen: el Theatrum Orbis Terrarum aparece en 1570 y hace su fortuna. En 1575 recibe el título de geógrafo del rey Felipe II de España. Apasionado por la Antigüedad, publica también mapas históricos, colecciones de imágenes antiguas y un diccionario de nombres de lugares antiguos, que no deja de enriquecer. Mantiene una vasta correspondencia con los humanistas de toda Europa. Muere en Amberes en 1598, sin haber dejado nunca de aumentar su atlas."""
style = """
Ortelius no era un cartógrafo de campo sino un editor, un compilador crítico y un hombre de gusto. Elige para cada región el mejor mapa disponible, lo hace redibujar en un formato común y cita sus fuentes, una práctica nueva. Sus mapas, grabados con nitidez y adornados con cartelas y nubes al gusto del Renacimiento flamenco, unen la información y la belleza. Su atlas sirvió de modelo a la cartografía europea hasta el siglo XVII."""

[[artistes]]
nom = "Robert Hooke"
vie = "Freshwater (isla de Wight), 18 de julio de 1635 – Londres, 3 de marzo de 1703"
biographie = """
Hijo de un pastor de la isla de Wight, Robert Hooke muestra muy pronto talento para la mecánica y el dibujo; a la muerte de su padre es colocado brevemente, según se dice, con el pintor Peter Lely en Londres, y después ingresa en la escuela de Westminster y en la Universidad de Oxford. Allí se convierte en ayudante del químico Robert Boyle, para quien construye una bomba de aire. En 1662, la recién nacida Royal Society lo nombra curador de experimentos: debe presentar otros nuevos en cada sesión. Publica Micrographia en 1665 y se convierte en profesor de geometría del Gresham College de Londres. Tras el gran incendio de 1666, es uno de los inspectores encargados de la reconstrucción de la ciudad y trabaja con el arquitecto Christopher Wren, en particular en el Monumento que conmemora el incendio. Se le debe la ley de la elasticidad que lleva su nombre y trabajos sobre la luz, los fósiles, los relojes y la gravitación, que lo enfrentaron duramente a Isaac Newton. Muere en Londres en 1703. No se conoce ningún retrato autenticado suyo."""
style = """
Hooke no era un artista de oficio, sino un dibujante excepcional. Sus láminas, de una precisión y una amplitud nunca vistas, muestran lo invisible con los medios del grabado artístico: gran formato, modelado riguroso, luz dominada. Micrographia fundó la ilustración científica al microscopio, y sus imágenes, la pulga y el piojo a la cabeza, no han dejado de copiarse y reproducirse hasta hoy."""
