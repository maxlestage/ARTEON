[[oeuvres]]
titre = "Astrolabio del príncipe rasulí ʿUmar"
artiste = "Yémen, dynastie rasoulide"
annee = "1291 (690 de la héjira)"
image = "astrolabe-rasoulide.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Astrolabe_of_‘Umar_ibn_Yusuf_ibn_‘Umar_ibn_‘Ali_ibn_Rasul_al-Muzaffari_MET_DP170386.jpg"
technique = "Latón fundido y martillado, calado, cincelado, con incrustaciones de plata; diámetro 15,6 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un instrumento para leer el cielo, fabricado en Yemen por un príncipe sabio, futuro sultán. Diámetro real: 15,6 cm."
description = """
Un disco de latón dorado, grueso, se mantiene en pie, rematado por un pequeño frontón calado de roleos, el trono, del que cuelga una anilla de suspensión. El ancho borde, graduado, está cubierto de cifras e inscripciones en árabe. En el centro, una placa grabada con una red de círculos y líneas, el tímpano, está cubierta por un encaje de metal recortado, la araña, cuyas puntas en forma de llamas y de ganchos designan estrellas. Un eje central sujeta todas las piezas, y una regla pivota a su alrededor. El metal presenta huellas de desgaste y algunas desconchaduras: el objeto se usó. Su reverso, invisible aquí, lleva una alidada, la regleta de puntería."""
evocation = """
El astrolabio es un mapa del cielo que se sostiene en la mano. Al apuntar al sol o a una estrella y hacer girar después la araña sobre el tímpano, se podía leer la hora, de día como de noche, conocer la posición de los astros, medir la altura de un edificio y, en el mundo islámico, determinar las horas de las oraciones. Imaginado en el mundo griego y perfeccionado por los sabios de lengua árabe, el instrumento pasó luego a Europa por España. Este habla del lugar de la ciencia en la corte rasulí: un príncipe maneja en él, por sí mismo, el cálculo y la herramienta, a la vez artesano y astrónomo. Su belleza no es un adorno añadido: nace de la precisión."""
histoire = """
Las inscripciones indican que el astrolabio fue hecho por ʿUmar ibn Yusuf, hijo del sultán rasulí al-Muzaffar Yusuf, y fechado en el año 690 de la héjira, es decir, 1291. El príncipe, apasionado por las ciencias, se convirtió en 1295 en el tercer sultán de la dinastía, con el nombre de al-Ashraf ʿUmar, pero murió al año siguiente. Es autor de obras de astronomía y de un tratado sobre la construcción de astrolabios. Se ignora cuándo salió el instrumento de Yemen. Pertenecía al neoyorquino Edward C. Moore, orfebre y diseñador de la casa Tiffany, cuya colección fue legada al Metropolitan Museum of Art en 1891; el museo publica hoy libremente sus fotografías."""
facture = """
El cuerpo del astrolabio, la madre, es de latón fundido y luego martillado; su reborde forma un alojamiento donde encajan los tímpanos, cuatro placas grabadas para distintas latitudes. La araña, cortada con sierra y con lima, debe estar lo bastante calada para dejar ver el tímpano y lo bastante sólida para no deformarse: sus volutas son a la vez ornamento y estructura. Las graduaciones y las inscripciones están grabadas con buril, con incrustaciones de plata. El trazado de los círculos, calculado por la geometría y trasladado con compás, condiciona la exactitud del instrumento."""
details = [
  "El trono calado, arriba, y su anilla de suspensión.",
  "Las puntas de la araña, que marcan cada una una estrella.",
  "Las graduaciones del borde, en todo el contorno del disco.",
  "La red de círculos del tímpano, visible bajo la araña.",
]
themes = ["astronomía", "instrumento", "islam", "yemen", "medida"]
anecdote = """
La palabra astrolabio viene del griego y significa aproximadamente «que atrapa los astros». Hacia 1391, el poeta inglés Geoffrey Chaucer escribió para un niño, su hijo Lewis, un Tratado del astrolabio, uno de los primeros textos científicos en lengua inglesa."""
