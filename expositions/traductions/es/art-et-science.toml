[[oeuvres]]
titre = "Typus Orbis Terrarum (mapamundi)"
artiste = "Abraham Ortelius"
annee = "1570"
image = "typus-orbis-terrarum.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:OrteliusWorldMap1570.jpg"
technique = "Grabado en cobre coloreado a mano, grabado por Frans Hogenberg"
collection = "Biblioteca del Congreso, Washington"
note = "El mapamundi que abre el Theatrum Orbis Terrarum, considerado el primer atlas moderno."
description = """
El mundo entero cabe en un gran óvalo cuadriculado de meridianos y paralelos, rodeado de nubes azules que se enroscan en los ángulos. Europa, África y Asia ocupan la derecha, las Américas la izquierda, con una América del Sur abultada y una América del Norte desmesuradamente ancha. Toda la parte inferior del mapa la ocupa un inmenso continente austral, con la inscripción TERRA AUSTRALIS NONDUM COGNITA, la tierra austral aún no conocida. Sobre los mares navegan un barco y monstruos marinos. Arriba, una cartela da el título; abajo, una segunda cartela lleva una frase latina de Cicerón. Las tierras están realzadas con amarillos, rosas y verdes pálidos."""
evocation = """
El mapa muestra el mundo tal como lo conocen los europeos casi ochenta años después del primer viaje de Cristóbal Colón: las costas del Atlántico y de África están trazadas con seguridad, pero el Pacífico, el interior de los continentes y las regiones polares siguen siendo inciertos, y el gran continente austral es cuestión de hipótesis. La frase de Cicerón, tomada de las Tusculanas, pregunta qué puede parecer grande en los asuntos humanos a quien conoce la eternidad y la inmensidad del mundo. Invita a la modestia: vista desde lo alto, la Tierra vuelve irrisorias las ambiciones de los hombres. El título del libro, Teatro del mundo, dice lo mismo: la Tierra es un escenario que se abarca de una sola mirada."""
histoire = """
Abraham Ortelius, comerciante de mapas y antigüedades en Amberes, publica el 20 de mayo de 1570 el Theatrum Orbis Terrarum, una colección de mapas de formato y estilo uniformes, grabados para la ocasión y acompañados de textos, con la lista de los cartógrafos de los que se sirvió. Es la invención del atlas moderno, aunque la palabra no llegará hasta más tarde, con Mercator. Este mapamundi, grabado por Frans Hogenberg, se apoya en particular en el gran mapa mural publicado por Mercator en 1569. El libro tiene un éxito inmediato: se reedita y se amplía una treintena de veces en cuarenta años, en latín y después en otras varias lenguas. Este ejemplar coloreado pertenece a la Biblioteca del Congreso, en Washington."""
facture = """
El mapa está grabado al buril sobre cobre, con un trazo nítido que permite inscribir cientos de nombres en pequeñas capitales y en cursivas. La proyección oval despliega toda la superficie del globo sobre la hoja, curvando los meridianos hacia los polos. Los ornamentos, nubes enroscadas, cartelas de volutas y cintas, pertenecen al vocabulario decorativo del Renacimiento flamenco. El color no se imprimía sino que se aplicaba a mano, a la acuarela: el comprador podía encargar un ejemplar coloreado, más caro, a iluminadores de mapas, el oficio que el propio Ortelius ejerció en sus comienzos."""
details = [
  "La cartela de abajo, con la frase de Cicerón en capitales.",
  "Las palabras TERRA AUSTRALIS NONDUM COGNITA, sobre el continente imaginario del sur.",
  "La mención de Cristóbal Colón y del año 1492, sobre América del Norte.",
  "El abultamiento de la costa oeste de América del Sur, corregido en las ediciones siguientes.",
  "El monstruo marino del océano Índico, abajo a la derecha.",
]
themes = ["cartografía", "mundo", "descubrimientos", "atlas", "amberes"]
anecdote = """
En su diccionario geográfico, el Thesaurus geographicus de 1596, Ortelius sugiere que las Américas fueron arrancadas de Europa y de África por terremotos e inundaciones: se ve en ello una de las primeras intuiciones de la deriva de los continentes."""
