[exposition]
ordre = 55
nom_court = "Joyas"
mouvement = "Joyas, orfebrería y tesoros"
cadre = "vitrine"
couleur = "#7a5a1c"
titre = "Joyas y tesoros, cuatro mil años de orfebrería"
artiste = "Fabergé, Lalique, Tiffany, orfebres de Egipto, de Limoges, de Popayán…"
dates = "hacia 1887 a. C. – 1907"
accroche = "Exposición virtual · Bóveda Verde (Grünes Gewölbe), Dresde"
introduction = """
Desde el Egipto de los faraones, los orfebres transforman el oro, las piedras y el \
esmalte en objetos de poder, de fe y de seducción. La visita reúne diez tesoros, desde \
el pectoral de una princesa egipcia hasta las joyas Art Nouveau de Lalique y de \
Tiffany, pasando por un camafeo de Augusto, un altar románico, una corona de \
esmeraldas de los Andes y un huevo imperial de Fabergé. El edificio se inspira en la \
Bóveda Verde de Dresde, el tesoro de los príncipes de Sajonia: una sucesión de \
gabinetes bajos que se recorren como quien abre cofrecillos, hasta el salón de los \
objetos preciosos, más amplio y más alto. Cada objeto, a menudo diminuto, se presenta \
aquí ampliado en una vitrina profunda, sobre un fondo de terciopelo oscuro."""
vitrine = "couronne-des-andes.jpg"

[musee]
nom = "Bóveda Verde (Grünes Gewölbe)"
ville = "Dresde, Alemania"
construction = "1723–1729"
presentation = """
En 1547, el elector Mauricio de Sajonia manda añadir un ala al castillo de Dresde; en \
la planta baja, unas salas abovedadas albergan el tesoro secreto de los príncipes. Se \
las llama la Bóveda Verde por el color verde de las bases y de los capiteles de sus \
columnas. De 1723 a 1729, Augusto el Fuerte, elector de Sajonia y rey de Polonia, las \
transforma en una serie de salas de aparato abiertas a los visitantes: es uno de los \
museos más antiguos de Europa. Se pasa allí del gabinete del ámbar a la sala del \
marfil, de las salas de plata al salón de los objetos preciosos, revestido de espejos, \
y luego a la cámara de las joyas. El tesoro cuenta también con la Corte de Delhi, \
teatro en miniatura de oro y piedras preciosas de Johann Melchior Dinglinger, y con el \
Diamante Verde de Dresde, de 41 quilates. El bombardeo de febrero de 1945 destruye \
tres salas; las colecciones, llevadas a la URSS, regresan en 1958. La Bóveda Verde \
histórica, restituida en su estado del siglo XVIII, reabre en 2006."""
ici = """
El edificio de ARTEON retoma la idea de la Bóveda Verde: una sucesión de gabinetes que \
se recorre de oeste a este. Se entra por el sur en el vestíbulo verde, de muros color \
malaquita pálida, y se pasa luego al gabinete de las antigüedades, de muros de ámbar \
claro, y a la cámara del tesoro, color marfil: tres salas de 10 metros por 8, de 5,5 \
metros de altura. Viene después el salón de los objetos preciosos, más amplio y más \
alto, de muros gris plata como los espejos de su modelo. La visita termina en el \
gabinete de las joyas, de un verde tierno. Los objetos reposan en vitrinas murales \
tapizadas de terciopelo oscuro."""

