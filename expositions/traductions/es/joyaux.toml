[[artistes]]
nom = "Égypte, Moyen Empire"
vie = "Valle del Nilo, hacia 2030–1650 a. C."
biographie = """
El Imperio Medio comienza cuando el rey tebano Mentuhotep II reunifica Egipto, \
dividido desde el final del Imperio Antiguo, hacia 2030 antes de nuestra era. Bajo la \
dinastía XII, la de los Amenemhat y los Sesostris, el país conoce dos siglos de \
estabilidad y prosperidad. Los reyes instalan su capital cerca de la entrada del Fayum, \
una vasta depresión fértil que aprovechan mediante grandes obras, y se hacen enterrar \
en pirámides de adobe, en Licht, en Illahun, en Dahshur o en Hawara. Egipto extiende \
su autoridad sobre Nubia, rica en oro, y comercia con el Levante. Los orfebres de los \
talleres reales dominan la soldadura, la filigrana, la granulación y la incrustación \
de piedras duras. Las más bellas joyas de la época se han hallado en las tumbas de \
princesas, en Dahshur en 1894 y 1895 por Jacques de Morgan, y en Illahun en 1914. Más \
tarde, los propios egipcios considerarán el Imperio Medio como la edad clásica de su \
lengua y de su literatura."""
style = """
La joyería del Imperio Medio posee una elegancia y una precisión pocas veces \
igualadas. Se basa en un vocabulario de signos jeroglíficos, halcones, escarabajos, \
cartelas, signos de vida, que hacen de cada joya un amuleto y una frase. Los colores \
tienen un sentido: el rojo de la cornalina, el azul del lapislázuli, el verde azulado \
de la turquesa. El cloisonné de piedras talladas una a una, sin esmalte, es su gran \
especialidad."""

[[artistes]]
nom = "Rome impériale"
vie = "Roma y el Imperio romano, siglo I a. C. – siglo III d. C."
biographie = """
El arte de la piedra grabada procede de Grecia y del Oriente helenístico, donde los \
reyes hacían grabar su retrato en gemas. En Roma alcanza su apogeo bajo Augusto, \
primer emperador, de 27 a. C. a 14 d. C., y bajo sus sucesores de la dinastía \
julio-claudia. Los mejores grabadores, a menudo griegos, como Dioscórides, que grabó \
el sello de Augusto, trabajan para la familia imperial y a veces firman sus obras. \
Producen dos clases de objetos: los entalles, grabados en hueco para servir de sellos, \
y los camafeos, esculpidos en relieve en piedras de capas. Los grandes camafeos \
imperiales, regalados a allegados o a aliados, son verdaderos cuadros políticos: la \
Gemma Augustea, conservada en Viena, muestra a Augusto entronizado junto a la diosa \
Roma, y el Gran Camafeo de Francia, en la Biblioteca Nacional, a la familia imperial \
bajo Tiberio. En la Edad Media, numerosos camafeos antiguos se engastaron en cruces, \
relicarios y coronas; en el Renacimiento, los príncipes y los papas los coleccionaron \
con pasión."""
style = """
El camafeo romano asocia la virtuosidad técnica con la propaganda. El grabador \
aprovecha las capas de la piedra como un pintor sus colores: figura blanca sobre fondo \
oscuro, a veces una tercera capa para un detalle. Los retratos, idealizados y serenos, \
se inspiran en la escultura griega clásica; los atributos divinos, égida, corona de \
laurel, transforman al emperador en héroe o en dios. Este lenguaje inspiró los \
camafeos del Renacimiento y los de la época napoleónica."""

[[artistes]]
nom = "Basse-Saxe, orfèvrerie du XIᵉ siècle"
vie = "Sajonia (norte de la actual Alemania), siglo XI"
biographie = """
En el siglo XI, Sajonia es una de las regiones más ricas del Sacro Imperio Romano \
Germánico. De ella procedían los emperadores de la dinastía otoniana, y las minas de \
plata del Harz, explotadas desde finales del siglo X, alimentan una intensa actividad \
artística en torno a las grandes sedes episcopales y las abadías: Hildesheim, \
Magdeburgo, Essen, Brunswick. El obispo Bernward de Hildesheim, muerto en 1022, manda \
fundir puertas de bronce y encarga cruces y candelabros de orfebrería. Los orfebres, \
laicos o monjes, trabajan para los obispos y para las grandes familias nobles, que \
regalan a las iglesias altares, cruces y relicarios para asegurar su salvación y \
afirmar su rango. En Brunswick, la familia de los condes Brunón, y luego los Güelfos, \
duques de Sajonia y de Baviera, enriquecen durante siglos el tesoro de la iglesia de \
San Blas, que el más célebre de ellos, Enrique el León, hace reconstruir en el siglo \
XII. Este tesoro de los Güelfos, rico en altares portátiles, cruces y brazos \
relicarios, está hoy repartido entre Berlín, Cleveland y otros museos."""
style = """
La orfebrería sajona del siglo XI hereda el lujo otoniano: oro, gemas en cabujón, \
perlas, esmalte cloisonné y niel componen superficies deslumbrantes en las que la \
materia preciosa es en sí misma una imagen de la luz divina. Las figuras, repujadas, \
se alinean bajo arcadas, en poses frontales y solemnes. Este rigor anuncia el arte \
románico, cuyo gran foco será, en el siglo siguiente, la orfebrería de los valles del \
Mosa y del Rin."""

[[artistes]]
nom = "Limoges, ateliers d'émaillerie"
vie = "Limoges (Lemosín), siglos XII–XIV"
biographie = """
Hacia mediados del siglo XII se desarrollan en Limoges talleres de esmaltadores, en \
una ciudad de peregrinación activa en torno a la abadía de Saint-Martial. No trabajan \
el oro, sino el cobre, más económico, que cubren de esmalte y de dorado. Su producción, \
abundante y de calidad constante, conquista toda la Europa cristiana: se la designa con \
el nombre latino de opus lemovicense, la obra de Limoges. Los talleres fabrican \
relicarios, cruces, báculos de obispos, copones, candelabros, placas de encuadernación \
e incluso efigies funerarias. Se encontraban en Italia, en España, en Inglaterra y en \
Escandinavia. Los artesanos permanecen casi todos en el anonimato; a veces aparecen \
algunos nombres, como el de Alpais, que firma un célebre copón conservado en el \
Louvre. La producción declina en el siglo XIV, durante la guerra de los Cien Años. \
Limoges recobra la gloria a finales del siglo XV con una técnica nueva, el esmalte \
pintado, que Léonard Limosin ilustrará en el siglo siguiente."""
style = """
El esmalte de Limoges se reconoce por su paleta dominada por el azul, del lapislázuli \
al azul claro, realzada con verde, amarillo, rojo y blanco, sobre el fondo dorado del \
cobre grabado con roleos. Las figuras, de dibujo claro y firme, se inscriben bajo \
arcadas o en medallones. Esta producción en serie, de modelos repetidos, no impide el \
esplendor: puso la magnificencia de la orfebrería al alcance de innumerables iglesias."""

[[artistes]]
nom = "Allemagne, orfèvres de la Renaissance"
vie = "Sacro Imperio Romano Germánico (Núremberg, Augsburgo, Múnich…), siglo XVI"
biographie = """
En el siglo XVI, las ciudades libres de Alemania del Sur, enriquecidas por el comercio \
y las minas de plata, se convierten en grandes centros de la orfebrería europea. En \
Núremberg y en Augsburgo, cientos de maestros, reunidos en gremios estrictos, deben \
presentar una obra maestra para ser admitidos y punzonar sus trabajos. El más célebre, \
Wenzel Jamnitzer, trabaja para cuatro emperadores sucesivos. Los príncipes, como los \
duques de Baviera en Múnich, los electores de Sajonia en Dresde o el archiduque \
Fernando II en el castillo de Ambras, reúnen en sus gabinetes de curiosidades copas, \
autómatas y joyas. Las formas del Renacimiento italiano, columnas, frontones, \
grutescos, llegan a los talleres a través de los grabados: ornamentistas como Virgil \
Solis, en Núremberg, o Erasmus Hornick publican modelos de colgantes que los orfebres \
copian y combinan. Los retratos pintados por Holbein o Cranach muestran estas joyas \
llevadas sobre el pecho, en los sombreros o en las mangas. Fundidas, transformadas o \
remontadas según las modas y las necesidades de dinero, solo han llegado hasta \
nosotros en escaso número."""
style = """
La joya del Renacimiento alemán es una pequeña escultura: figuras de bulto redondo \
esmaltadas de blanco, arquitecturas en miniatura, monstruos marinos y grutescos. El \
esmalte de colores vivos, blanco, rojo, verde, azul, cubre el oro cincelado, y las \
piedras, talladas en tabla o en cabujón, van acompañadas de perlas, a menudo \
irregulares y colgantes. El efecto buscado es la abundancia y la sorpresa, para \
mirar de cerca, como los objetos de los gabinetes de curiosidades."""

[[artistes]]
nom = "Popayán, orfèvres de la Nouvelle-Grenade"
vie = "Popayán (actual Colombia), siglos XVI–XVIII"
biographie = """
Fundada en 1537 por el conquistador Sebastián de Belalcázar en un alto valle de los \
Andes, al sur de la actual Colombia, Popayán se convierte en una ciudad de notables, de \
conventos y de iglesias. Su riqueza procede del oro, extraído en las minas y los ríos \
de las regiones vecinas, en particular hacia la costa del Pacífico, por africanos \
reducidos a esclavitud. Las élites de la ciudad, propietarias de minas y de \
haciendas, rivalizan en generosidad con las iglesias y las cofradías, esas asociaciones \
de fieles que organizan el culto de un santo o de la Virgen y cuidan de sus \
ornamentos. Los orfebres locales, cuyos nombres están casi todos olvidados, fabrican \
para ellas custodias, cálices, coronas y adornos de estatuas. Las esmeraldas proceden \
de las minas de la región de Muzo, al norte de Bogotá, ya explotadas antes de la \
llegada de los españoles. Integrada en el siglo XVIII en el virreinato de Nueva \
Granada, Popayán sigue siendo célebre por sus procesiones de Semana Santa, inscritas \
en 2009 en el patrimonio cultural inmaterial de la UNESCO."""
style = """
La orfebrería religiosa de Nueva Granada adopta las formas europeas, barrocas y luego \
rococó, conocidas por los objetos importados y los grabados, pero las trata con una \
prodigalidad propia del Nuevo Mundo: oro grueso, esmeraldas en abundancia, efectos de \
profusión. El repujado, los calados y las piedras en tabla o en gota dan a estos \
objetos un brillo hecho para ser visto de lejos, a la luz de los cirios y de las \
procesiones."""

[[artistes]]
nom = "Paris, orfèvres-bijoutiers du XVIIIᵉ siècle"
vie = "París, siglo XVIII"
biographie = """
En el siglo XVIII, París domina la fabricación de objetos de lujo en Europa. Los \
orfebres-joyeros, miembros del poderoso gremio de los orfebres, se especializan en las \
«joyas» en el sentido de la época: tabaqueras, estuches, cajas de lunares, neceseres y \
puños de bastón. Sus obras de oro llevan punzones obligatorios, el del maestro y los \
del control, con una letra que cambia cada año: así se pueden fechar con precisión. La \
tabaquera se convierte en el accesorio indispensable del hombre y de la mujer de \
mundo, y el rey regala a los embajadores cajas adornadas con su retrato. Los orfebres \
trabajan con miniaturistas, esmaltadores y grabadores. Pierre-François Delafons, \
admitido como maestro en 1732 y muerto en 1787, es uno de estos fabricantes. La familia \
Van Blarenberghe, originaria de Lille, se especializó en las vistas minúsculas: \
Louis-Nicolas, nacido en 1716, pintor de batallas para el Ministerio de la Guerra, y su \
hijo Henri-Joseph pintan fiestas, puertos, batallas y castillos para las tapas de las \
cajas."""
style = """
La tabaquera parisina es una obra maestra de miniaturización y de precisión: bisagra \
perfecta, tapa que cierra sin holgura, oro de varios colores cincelado con flores, \
esmalte, laca o miniaturas bajo vidrio. Sigue las modas, rococó hacia 1750 y luego \
neoclásica. Las vistas de los Van Blarenberghe, de exactitud topográfica, hacen de \
ellas también documentos valiosos sobre los lugares y las fiestas de la época."""

[[artistes]]
nom = "Maison Fabergé"
vie = "San Petersburgo, 1842–1918"
biographie = """
Gustav Fabergé, joyero de una familia de origen hugonote establecida en los países \
bálticos, abre su tienda en San Petersburgo en 1842. Su hijo Carl, nacido en 1846, \
sigue a su familia a Dresde, la ciudad de la Bóveda Verde, donde frecuenta una escuela \
de comercio, se forma con un joyero de Fráncfort y viaja luego por Europa para \
estudiar las colecciones, antes de ponerse al frente de la casa en 1872. Quiere que el \
valor de un objeto resida en su invención y en su perfección más que en el peso de las \
piedras. En 1885, el zar Alejandro III le encarga un huevo de Pascua para la \
emperatriz María Fiódorovna, el huevo de la gallina, y Fabergé se convierte en \
proveedor de la corte. Nicolás II continúa la tradición, regalando cada año un huevo \
a su madre y otro a su esposa: se fabrican unos cincuenta huevos imperiales hasta \
1916. La casa emplea hasta a quinientas personas, en talleres dirigidos por maestros \
como Mijaíl Perjin y Henrik Wigström, y abre sucursales en Moscú, en Odesa, en Kiev y \
en Londres. Nacionalizada por los bolcheviques en 1918, desaparece; Carl Fabergé huye \
de Rusia y muere en Lausana en 1920."""
style = """
El estilo Fabergé bebe del siglo XVIII francés, del Renacimiento, del arte ruso antiguo \
y a veces del Art Nouveau. Se reconoce por sus esmaltes translúcidos sobre fondo \
guilloché, de una paleta muy amplia, por sus oros de colores diferentes, por sus flores \
y sus animales de piedras duras de Rusia, y por un acabado irreprochable. Sus huevos \
imperiales, con sus sorpresas, se han convertido en el símbolo del lujo de los últimos \
Románov."""

[[artistes]]
nom = "René Lalique"
vie = "Aÿ (Marne), 6 de abril de 1860 – París, 1 de mayo de 1945"
biographie = """
Nacido en la Champaña, René Lalique pierde a su padre a los dieciséis años y entra de \
aprendiz con el joyero parisino Louis Aucoc, a la vez que sigue cursos en la École des \
arts décoratifs. Pasa después dos años en Londres, donde estudia en el Sydenham \
College. De regreso en París, dibuja joyas para grandes casas, como Cartier o \
Boucheron, y retoma en 1885 el taller del joyero Jules d'Estape. En la década de 1890 \
inventa una joyería nueva, en la que los insectos, las flores, las mujeres y los \
paisajes sustituyen a los ríos de diamantes. Sarah Bernhardt lleva sus joyas; en la \
Exposición Universal de 1900, su vitrina causa sensación, y es ascendido a oficial de \
la Legión de Honor. El coleccionista Calouste Gulbenkian se convierte en su gran \
mecenas. Después de 1905, Lalique se vuelca en el vidrio: dibuja frascos de perfume \
para François Coty y funda luego sus propias vidrierías, en Combs-la-Ville y después \
en Wingen-sur-Moder, en Alsacia. Sus jarrones, sus luminarias y sus mascotas de \
radiador hacen de él uno de los maestros del Art Déco. Muere en París en 1945."""
style = """
Lalique liberó la joyería de la tiranía del diamante. Elige sus materiales por su \
efecto, esmalte plique-à-jour, cuerno, marfil, vidrio, ópalo, piedra de luna, y los \
asocia al oro con total libertad. Sus motivos, tomados de la naturaleza y del \
simbolismo, libélulas, pavos reales, mujeres-flor, serpientes, hacen de la joya una \
obra de arte de pleno derecho. Su influencia sobre el Art Nouveau europeo fue inmensa, \
y su trabajo del vidrio abrió el camino al Art Déco."""

[[artistes]]
nom = "Louis Comfort Tiffany"
vie = "Nueva York, 18 de febrero de 1848 – Nueva York, 17 de enero de 1933"
biographie = """
Hijo de Charles Lewis Tiffany, fundador de la casa Tiffany & Co., Louis Comfort \
Tiffany prefiere la pintura a la empresa familiar. Alumno de George Inness y de Samuel \
Colman, viaja por Europa y por el norte de África, de donde trae telas orientalistas. \
En la década de 1870 se interesa por el vidrio y busca obtener el color en la masa \
misma del material, sin pintura. En 1879 funda una empresa de decoración interior, que \
reforma varios salones de la Casa Blanca en 1882, y se dedica luego a la vidriera y al \
vidrio soplado, al que da el nombre de Favrile. Sus talleres, convertidos en Tiffany \
Studios, producen vidrieras, mosaicos, jarrones y las célebres lámparas de pantalla de \
vidrio. Tras la muerte de su padre, en 1902, se convierte en director artístico de \
Tiffany & Co. y se lanza a la joyería, presentada por primera vez en San Luis en 1904. \
Construye entonces Laurelton Hall, su residencia de Long Island, verdadero manifiesto \
de su arte. Pasado de moda tras la Primera Guerra Mundial, crea una fundación para \
jóvenes artistas y muere en Nueva York en 1933."""
style = """
Tiffany quería hacer entrar la belleza de la naturaleza en los objetos de todos los \
días. Pintor del color, busca sus efectos en el vidrio irisado, los ópalos y los \
esmaltes, y sus motivos, libélulas, glicinas, peonías, dientes de león, proceden de la \
observación directa de los jardines. Su obra es la gran contribución estadounidense al \
Art Nouveau, más naturalista y menos literaria que el arte francés."""
