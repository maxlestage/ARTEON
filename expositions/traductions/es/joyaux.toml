[[oeuvres]]
titre = "Pectoral y collar de Sithathoryunet"
artiste = "Égypte, Moyen Empire"
annee = "hacia 1887–1878 a. C."
image = "pectoral-sithathoryunet.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Pectoral_and_Necklace_of_Sithathoryunet_with_the_Name_of_Senwosret_II_MET_DT531.jpg"
technique = "Oro, cornalina, lapislázuli, turquesa y granate; cuentas de oro, de cornalina, de lapislázuli, de turquesa y de feldespato verde; pectoral de 4,5 × 8,2 cm, collar de 82 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "La joya de una princesa de la dinastía XII, con el nombre del rey Sesostris II: dos halcones de oro y piedras flanquean el nombre real. El pectoral mide apenas 8 cm de ancho."
description = """
Un largo collar de cuentas en forma de gota, en el que se alternan el oro, la cornalina \
rojo anaranjado, el lapislázuli azul noche y la turquesa, sostiene en su centro un \
pequeño pectoral calado. Dos halcones, aves del dios Horus, se miran de frente, con \
las garras posadas sobre una barra decorada con zigzags; cada uno lleva en la cabeza un \
disco solar. Entre ellos, una cartela, el óvalo que encierra los nombres reales, \
contiene el nombre de coronación del rey Sesostris II, escrito con un disco solar, un \
escarabajo y el signo de la colina. Bajo la cartela, un pequeño dios arrodillado \
sostiene en cada mano un largo tallo de palmera con muescas. A ambos lados, dos cobras \
erguidas dejan colgar el signo anj, la cruz de la vida."""
evocation = """
El pectoral se lee como una frase en jeroglíficos y como una oración. El dios \
arrodillado es Heh, la personificación del infinito: los tallos de palmera con muescas \
servían para contar los años, y su imagen significa «millones de años». Los halcones \
solares y los signos de vida rodean el nombre del rey: el sol concede al soberano una \
vida y un reinado eternos. Llevada sobre el pecho de una princesa, la joya afirmaba su \
vínculo con el faraón y la ponía bajo la protección de los mismos dioses. En Egipto, el \
adorno nunca era un simple ornamento: cada color, cada forma tenía un valor mágico, y \
las joyas acompañaban a su propietaria a la tumba, para la eternidad."""
histoire = """
Sithathoryunet era una princesa de la dinastía XII, sin duda hija de Sesostris II; fue \
enterrada cerca de la pirámide de este rey, en Illahun, a la entrada del Fayum. En \
1914, el equipo del arqueólogo británico Flinders Petrie excava su tumba, saqueada ya \
en la Antigüedad. Pero en un nicho lleno de barro endurecido, los ladrones no habían \
visto los cofres de la princesa: el egiptólogo Guy Brunton pasa varios días \
despejando, cuenta a cuenta, las joyas, cuyos cofres de madera se habían podrido. \
Según las reglas de reparto entonces vigentes, el Servicio de Antigüedades Egipcias se \
queda con una parte del tesoro, entre ella la diadema de la princesa, hoy en el museo \
de El Cairo; el resto lo compra en 1916 el Metropolitan Museum."""
facture = """
El pectoral está hecho con la técnica del cloisonné: el orfebre suelda sobre una placa \
de oro finas tiras de oro que dibujan cada pluma y cada contorno, y luego incrusta en \
ellas pequeñas piezas de piedra talladas una a una con la forma exacta de su alvéolo. \
Cientos de fragmentos de cornalina, de lapislázuli, de turquesa y de granate se \
ajustan así sin la menor holgura. El reverso, de oro, repite todo el dibujo en fino \
cincelado. El lapislázuli procedía de las montañas del actual Afganistán, la turquesa \
del Sinaí."""
details = [
  "El escarabajo de lapislázuli en el centro de la cartela real.",
  "Las plumas de los halcones, cada una hecha con una pieza de piedra recortada.",
  "Los tallos de palmera con muescas que sostiene el pequeño dios Heh.",
  "Los signos de vida anj colgados de las dos cobras.",
  "Las cuentas de oro en forma de gota, que se alternan con la cornalina y el lapislázuli.",
]
themes = ["egipto", "oro", "faraón", "eternidad", "cloisonné"]
anecdote = """
El nombre de la princesa, Sat-Hathor-Iunet, significa «hija de Hathor de Dendera», la \
diosa del amor y de la belleza venerada en esa ciudad del Alto Egipto. Sus joyas \
escaparon a los saqueadores antiguos, que no habían visto el nicho donde reposaban."""
salle = 2
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Camafeo: retrato del emperador Augusto"
artiste = "Rome impériale"
annee = "hacia 41–54 d. C."
image = "camee-auguste.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Sardonyx_cameo_portrait_of_the_Emperor_Augustus_MET_DP155547.jpg"
technique = "Sardónice, 3,7 × 2,9 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Esculpido en una piedra de capas, el perfil blanco de Augusto se recorta sobre un fondo pardo. El camafeo, de menos de 4 cm de alto, se talló varias décadas después de la muerte del emperador."
description = """
El primer emperador romano aparece en busto, de perfil, esculpido en relieve blanco \
sobre un fondo rojo pardo translúcido. Es joven, de rostro liso, nariz recta y cabello \
espeso y rizado ceñido por una corona de laurel cuyas cintas flotan tras la nuca. El \
hombro, a la derecha, está desnudo, cruzado en diagonal por el tahalí, la correa que \
sostiene la espada. Sobre el pecho se echa la égida, una piel cubierta de escamas y \
bordeada de serpientes, donde se distingue en el centro una cabeza de Gorgona de \
cabellos de serpientes y, más abajo, una segunda cabeza, la de un dios de los vientos \
de mechones alborotados. La piedra ovalada es apenas mayor que una moneda."""
evocation = """
El camafeo hace de Augusto más que un hombre. La égida, la coraza de piel adornada con \
la cabeza de Medusa, pertenece a Júpiter y a Minerva: llevarla es estar protegido y \
armado por los dioses, y el Metropolitan Museum ve en ella la imagen de un semidiós \
victorioso. Se ha interpretado la cabeza del dios de los vientos como una alusión a los \
vientos de verano que empujaban hacia Roma los barcos cargados con el trigo de Egipto, \
provincia conquistada por Augusto. Tallado bajo el emperador Claudio, su sobrino nieto, \
este retrato de un Augusto eternamente joven, muerto casi treinta años antes, servía \
también a la dinastía reinante: honrar al fundador divinizado era afirmar la \
legitimidad de sus herederos."""
histoire = """
Los camafeos con la efigie de la familia imperial eran objetos de corte: regalados por \
el emperador a allegados, a dignatarios o a aliados, circulaban en un círculo muy \
restringido y se transmitían como tesoros. Este data del reinado de Claudio, de 41 a \
54, que cultivó con esmero el culto a Augusto divinizado. Se desconoce su recorrido \
durante los siglos siguientes. El Metropolitan Museum lo adquirió en 1942 gracias al \
legado de Joseph Pulitzer, el magnate de la prensa que dio su nombre al célebre premio \
de periodismo. Cuenta entre los más bellos retratos de Augusto en camafeo, junto con \
el camafeo Blacas del British Museum, cuya pose y atributos son muy próximos."""
facture = """
La sardónice es una ágata formada por capas paralelas de colores diferentes. El \
grabador elige una piedra cuya capa superior es blanca y cuya capa inferior es rojo \
pardo; retira la capa blanca en todas partes salvo en la figura, que resalta en \
relieve claro sobre el fondo oscuro. El trabajo no se hace con cincel, sino por \
abrasión: taladros y pequeñas ruedas, untados de polvo abrasivo y de aceite, desgastan \
la piedra poco a poco. Allí donde la capa blanca se adelgaza, el fondo transparece y \
da al rostro y al hombro sus delicadas sombras."""
details = [
  "Las cintas de la corona de laurel que flotan tras la nuca.",
  "La cabeza de Gorgona, de cabellos de serpientes, en el centro de la égida.",
  "La cabeza del dios de los vientos, de mechones alborotados, sobre la égida.",
  "El tahalí que cruza en diagonal el hombro desnudo.",
  "Las escamas de la égida, grabadas una a una.",
]
themes = ["roma", "emperador", "retrato", "piedra grabada", "poder"]
anecdote = """
Augusto sellaba sus cartas con una piedra grabada. Según el historiador Suetonio, usó \
primero una esfinge, luego el retrato de Alejandro Magno y, por último, su propio \
retrato, grabado por Dioscórides, que sus sucesores siguieron utilizando."""
salle = 2
mur = "sud"
place = 2
largeur = 0.75

[[oeuvres]]
titre = "Altar portátil de la condesa Gertrudis"
artiste = "Basse-Saxe, orfèvrerie du XIᵉ siècle"
annee = "hacia 1045"
image = "autel-portatif-gertrude.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1931.462.jpg"
technique = "Oro, esmalte cloisonné, pórfido, piedras preciosas, perlas, niel, alma de madera; 10,5 × 27,5 × 21 cm"
collection = "Cleveland Museum of Art"
note = "Un altar de viaje de oro, encargado por una condesa de Brunswick: una de las piezas más antiguas y suntuosas del tesoro de los Güelfos. Mide 27,5 cm de largo."
description = """
Es un cofrecillo rectangular, de poco más de un palmo de largo, colocado sobre un \
zócalo. En la parte superior, una placa de pórfido rojo oscuro, moteada de blanco, \
forma el ara; el marco de oro que la rodea lleva una inscripción latina. Los cuatro \
lados son galerías de arcadas: bajo cada arco, entre columnillas torsas y nieladas, \
se alza una figura de oro en relieve, de pie y nimbada. Se reconocen en ellas a Cristo, \
la Virgen, apóstoles y arcángeles, pero también personajes de rango real e imperial. \
Las cenefas están sembradas de piedras de colores, de perlas y de pequeñas placas de \
esmalte; bajo el altar, una trampilla daba acceso a las reliquias."""
evocation = """
Un altar portátil permitía celebrar la misa fuera de una iglesia consagrada, de viaje \
o en una capilla privada: se colocaban el pan y el vino sobre la piedra, encima de las \
reliquias. El objeto dice también la ambición de quien lo ofreció. El pórfido, piedra \
púrpura reservada en la Antigüedad a los emperadores, y la presencia de soberanos entre \
los santos afirman, según el Cleveland Museum, las pretensiones de Gertrudis y de su \
familia a una ascendencia imperial. La inscripción lo dice con sencillez: «Gertrudis \
ofrece a Cristo, para vivir feliz en él, esta piedra que brilla de gemas y de oro». El \
don precioso es un intercambio: el oro entregado aquí abajo a cambio de la salvación \
eterna."""
histoire = """
La condesa Gertrudis, viuda del conde Liudolfo de Brunswick, muerto en 1038, manda \
hacer este altar hacia 1045, así como dos cruces de oro, una a su nombre y otra al \
nombre de su marido, también conservadas en Cleveland. Entra en el tesoro de la \
iglesia de San Blas de Brunswick, la futura catedral, que los Güelfos, duques de \
Sajonia y luego de Brunswick, enriquecen durante siglos: es el tesoro de los Güelfos, \
o Welfenschatz. En 1929, la casa de Brunswick-Luneburgo vende el conjunto a un \
consorcio de marchantes de Fráncfort, que lo presenta en Estados Unidos. El Cleveland \
Museum adquiere el altar en 1931. Gran parte del resto, cedida en 1935 al Estado \
prusiano, se encuentra hoy en Berlín; los herederos de aquellos marchantes judíos han \
reclamado su restitución, sin obtenerla."""
facture = """
El orfebre trabajó el oro a repujado: cada figura se martilla por el reverso en una \
lámina fina y se retoma luego con el cincel por el anverso, antes de fijarla sobre el \
alma de madera del cofrecillo. Las columnillas están decoradas con niel, una mezcla \
negra de azufre y de metal fundido en los huecos grabados, que dibuja motivos en \
zigzag. Las gemas están engastadas en cabujón, simplemente pulidas y redondeadas: \
todavía no se sabía tallar las piedras en facetas. Pequeñas placas de esmalte \
cloisonné completan este decorado en el que la materia preciosa hace brillar el marco \
del ara."""
details = [
  "La placa de pórfido, rojo oscuro moteado de blanco, en la parte superior.",
  "Las columnillas nieladas, torsas como bastones de caramelo.",
  "Las figuras de oro de pie bajo las arcadas, cada una con su nimbo.",
  "Los cabujones rojos, azules y verdes engastados en las cenefas.",
]
themes = ["edad media", "oro", "reliquias", "poder", "arte románico"]
anecdote = """
Bajo el altar, una pequeña trampilla se abre a una cavidad donde se hallaron reliquias \
de santos, envueltas en trozos de seda. El Cleveland Museum las conserva y las \
inventaría una a una: reliquias de san Bartolomé, de san Gregorio, de san Vicente o \
de santa Gertrudis."""
salle = 3
mur = "nord"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "Relicario: la Crucifixión y Cristo en majestad"
artiste = "Limoges, ateliers d'émaillerie"
annee = "hacia 1180–1190"
image = "chasse-limoges.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Chasse_with_the_Crucifixion_and_Christ_in_Majesty_MET_DT128.jpg"
technique = "Cobre dorado, esmalte campeado; 26,2 × 30,2 × 11,6 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un relicario en forma de casa, destinado a albergar reliquias: el azul y el verde del esmalte de Limoges sobre el brillo del cobre dorado. Mide 30 cm de largo."
description = """
El relicario tiene la forma de una casa o de una pequeña iglesia, apoyada sobre cuatro \
pies, con un tejado a dos aguas coronado por una cresta calada con agujeros en forma de \
ojo de cerradura, adornada con un cabujón de cristal y una esfera. En la fachada, en el \
centro, Cristo en la cruz, rodeado por la Virgen y san Juan; sobre la cruz, la \
inscripción IHS XPS, abreviatura de Jesucristo, y dos ángeles de busto en medallones. \
A cada lado, bajo arcadas, se alzan dos apóstoles. En el tejado, Cristo en majestad \
entronizado en una mandorla, la aureola en forma de almendra, entre otros seis \
apóstoles. Las figuras, de vestiduras azules y verdes, se recortan sobre un fondo de \
oro grabado con roleos."""
evocation = """
En la Edad Media, las reliquias, restos u objetos que habían tocado a un santo, eran \
el corazón de la vida religiosa: se acudía de lejos a venerarlas, se les pedía curación \
y protección. El relicario les da una morada digna de ellas, hecha de oro y de colores \
que evocan la Jerusalén celeste descrita por el Apocalipsis, ciudad de oro puro y de \
piedras preciosas. Su decoración enlaza dos momentos: en la fachada, el sacrificio de \
Cristo muerto en la cruz; en el tejado, su regreso en gloria al fin de los tiempos, \
rodeado de los apóstoles. Entre ambos, las reliquias del santo, que siguió a Cristo, \
esperan la resurrección prometida."""
histoire = """
En los siglos XII y XIII, los talleres de Limoges producen esmaltes en tal cantidad \
que se los llama en toda Europa «la obra de Limoges», opus lemovicense. Los \
relicarios, de todos los tamaños, partían hacia las iglesias de Francia, de España, de \
Inglaterra o de Escandinavia. Se ignora para qué santuario se hizo este y qué reliquias \
contenía. Como muchos objetos de iglesia, abandonó su lugar de origen para unirse a las \
colecciones de aficionados. El financiero estadounidense J. Pierpont Morgan, uno de los \
mayores coleccionistas de su tiempo, lo adquiere; tras su muerte, en 1913, su hijo lo \
dona en 1917 al Metropolitan Museum, junto con miles de otras obras de su colección."""
facture = """
El esmalte campeado, especialidad de Limoges, se hace sobre una placa de cobre gruesa. \
El esmaltador cava con el buril las zonas que se han de colorear, dejando en relieve los \
contornos; rellena los huecos con polvo de vidrio coloreado con óxidos metálicos y \
cuece luego la placa al horno, donde el polvo se funde y se vitrifica. Tras el pulido, \
el cobre que ha quedado a la vista se dora y se graba. Aquí, las figuras están \
esmaltadas sobre un fondo de oro, mientras que otros relicarios muestran figuras de oro \
sobre fondo azul; los rostros y las manos, dejados en metal, simplemente están grabados \
y dorados."""
details = [
  "La inscripción IHS XPS sobre la cruz.",
  "Los dos ángeles de busto en los medallones, a ambos lados de la cruz.",
  "La mandorla de Cristo en majestad, en medio del tejado.",
  "La cresta calada con agujeros en forma de ojo de cerradura y su cabujón de cristal.",
  "Las pequeñas rosetas azules y blancas que bordean los paneles.",
]
themes = ["edad media", "reliquias", "esmalte", "crucifixión", "limoges"]
anecdote = """
Tras el asesinato de Tomás Becket, arzobispo de Canterbury muerto en su catedral en \
1170, los talleres de Limoges fabricaron varias decenas de relicarios que ilustraban su \
martirio, y que difundieron su culto por toda Europa."""
salle = 3
mur = "sud"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Colgante: Cupido en una hornacina"
artiste = "Allemagne, orfèvres de la Renaissance"
annee = "hacia 1560–1580"
image = "pendentif-amour.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Hanger_in_de_vorm_van_Amor_in_een_nis_Hanger_met_Amor_in_een_nis,_BK-17058.jpg"
technique = "Oro parcialmente esmaltado, piedras preciosas, perlas; 5,5 × 3,9 cm"
collection = "Rijksmuseum, Ámsterdam"
note = "Una joya de corte del Renacimiento: un pequeño Cupido esmaltado de blanco se alza en un pórtico de columnas rojas, sobre una piedra tallada en tabla. Mide 5,5 cm de alto."
description = """
El colgante está construido como una pequeña arquitectura. En el centro, bajo un arco, \
un Cupido regordete, esmaltado de blanco, se yergue sobre un montículo verde, con su \
arco en la mano. Lo enmarcan dos columnas esmaltadas de rojo, bajo un remate de \
volutas verdes y azules adornado con una piedra verde rectangular; a cada lado, una \
pequeña criatura fantástica esmaltada de blanco se inclina hacia fuera. Bajo sus pies, \
una piedra incolora tallada en tabla ocupa el centro, flanqueada por dos piedras rojas \
en forma de corazón y por dos perlas redondas. Racimos de granos de oro y roleos \
negros y blancos completan el conjunto. Una anilla esmaltada permite colgarlo; una \
perla irregular pende por debajo."""
evocation = """
Cupido, el dios del amor cuyas flechas hacen nacer la pasión, era un tema ideal para \
una joya ofrecida en prenda de afecto o llevada por galantería; las dos piedras rojas \
talladas en forma de corazón repiten el tema. En el Renacimiento, estos colgantes se \
llevaban sobre el pecho, colgados de una cadena, o prendidos al corpiño y al sombrero; \
mostraban el rango, la riqueza y el gusto de su propietario, hombre o mujer. El \
decorado de arquitectura, con sus columnas y su arco, traslada al oro el vocabulario \
de los monumentos antiguos puesto de nuevo en valor por el Renacimiento italiano, que \
los orfebres del Norte adoptan a mediados del siglo XVI."""
histoire = """
No se conoce ni al orfebre ni al primer propietario de esta joya, atribuida a un taller \
alemán de los años 1560-1580. En esa época, las grandes ciudades del Sacro Imperio, \
Núremberg y Augsburgo a la cabeza, cuentan con cientos de orfebres organizados en \
gremios, y los modelos de colgantes circulan gracias a los grabados de ornamentistas \
como Virgil Solis o Erasmus Hornick, que los talleres copian y combinan. Estas joyas, \
a menudo desmontadas según las modas para recuperar el oro y las piedras, se han vuelto \
raras. Esta entró en el Rijksmuseum en 1960. Los coleccionistas del siglo XIX las \
buscaban tanto que algunos orfebres fabricaron entonces imitaciones, lo que hace \
delicado el estudio de cada pieza."""
facture = """
El orfebre ensambló numerosas piezas pequeñas de oro, fundidas, cinceladas y soldadas, \
y las cubrió luego de esmalte. En la figura de Cupido, minúscula escultura de bulto \
redondo, el esmalte blanco opaco se aplica directamente sobre el relieve: es el llamado \
esmalte «de bulto redondo», típico de las joyas del Renacimiento. En otras partes, el \
rojo de las columnas y el verde de las volutas rellenan pequeños huecos practicados en \
el oro. Las piedras están engastadas en cajas de oro. La piedra incolora del centro está \
tallada en tabla, es decir, aplanada en la parte superior, una talla muy apreciada en \
el siglo XVI."""
details = [
  "El Cupido esmaltado de blanco, de pie sobre su montículo verde.",
  "Las dos piedras rojas talladas en forma de corazón.",
  "Los racimos de granos de oro, a ambos lados de la piedra central.",
  "La perla irregular colgada bajo la joya.",
  "La anilla de suspensión, esmaltada de azul y de blanco.",
]
themes = ["renacimiento", "amor", "joya de corte", "esmalte", "perlas"]
anecdote = """
Muchas «joyas del Renacimiento» de los grandes museos son en realidad del siglo XIX. Se \
comprendió al estudiar los dibujos del orfebre de Aquisgrán Reinhold Vasters, \
conservados en el Victoria and Albert Museum de Londres: preparaba en ellos hábiles \
pastiches, vendidos como antiguos."""
salle = 4
mur = "sud"
place = 1
largeur = 0.75

[[oeuvres]]
titre = "La Corona de los Andes"
artiste = "Popayán, orfèvres de la Nouvelle-Grenade"
annee = "hacia 1660 (diadema) y hacia 1770 (arcos)"
image = "couronne-des-andes.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Crown_of_the_Virgin_of_the_Immaculate_Conception,_known_as_the_Crown_of_the_Andes_MET_DP365520.jpg"
technique = "Oro repujado y cincelado, esmeraldas; altura 34,3 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "La corona de una estatua de la Virgen de la Inmaculada Concepción, en Popayán, en la actual Colombia: más de dos kilos de oro y unas 450 esmeraldas."
description = """
La corona se compone de una ancha banda calada, la diadema, de la que parten arcos que \
se unen en lo alto bajo un globo y una cruz. El oro, repujado en gruesos follajes, en \
volutas y en conchas, forma un encaje de metal en el que están engastadas cientos de \
esmeraldas: cuadradas o rectangulares, talladas en tabla, dibujan flores y cruces; \
otras, en forma de gota, cuelgan libremente bajo los arcos. Una hilera de pequeñas \
esmeraldas alineadas recorre la base. En lo alto, el globo calado sostiene una cruz \
cubierta de esmeraldas. De 34 centímetros de altura, la corona estaba hecha para una \
estatua mayor que el natural."""
evocation = """
La corona hace de la Virgen una reina, la reina del cielo, según una imagen querida por \
la Iglesia católica, y la riqueza de sus materiales dice el fervor de toda una ciudad. \
En la América española, las estatuas de la Virgen y de los santos se vestían, se \
adornaban y se coronaban para las fiestas y las procesiones; sus joyas, ofrecidas por \
los fieles y las cofradías, formaban el tesoro común de la comunidad. La corona cuenta \
también la historia colonial: el oro de la región lo extraían africanos reducidos a \
esclavitud, y las esmeraldas procedían de las minas colombianas explotadas por los \
españoles. Su decoración, barroca y luego rococó, sigue las modas de Europa, \
interpretadas por orfebres locales."""
histoire = """
Según la tradición, los habitantes de Popayán ofrecieron una corona a la Virgen tras \
haberse librado de una epidemia de viruela en la década de 1590. El objeto que ha \
llegado hasta nosotros es compuesto: el globo y la cruz se remontarían al siglo XVI, la \
diadema a hacia 1660, y los arcos se añadieron hacia 1770. Durante siglos, la cofradía \
de la Inmaculada Concepción la saca en Semana Santa. En 1914 obtiene del papa la \
autorización para venderla en beneficio de obras de caridad, pero el comprador, un \
grupo de inversores estadounidenses reunido por Warren J. Piper, de Chicago, no se \
presenta hasta 1936. Expuesta en Estados Unidos, puesta varias veces en venta, entra en \
el Metropolitan Museum en 2015; en Colombia, algunas voces han deseado su regreso."""
facture = """
Los orfebres trabajaron un oro de 18 a 22 quilates a repujado, martillándolo por el \
reverso para hacer surgir los relieves, y lo cincelaron y calaron luego para que la \
luz atraviese la corona. Las esmeraldas, de tamaños y calidades diversos, están \
engastadas en cajas de oro: muchas están talladas en tabla, otras en pera. Las dos \
campañas de trabajos se leen en la decoración: follajes carnosos y simétricos de la \
diadema, volutas más ligeras de los arcos, conformes al gusto del siglo XVIII."""
details = [
  "Las esmeraldas en forma de gota que cuelgan bajo los arcos.",
  "La cruz de la cumbre, hecha de esmeraldas rectangulares alineadas.",
  "El globo calado que sostiene la cruz.",
  "La hilera regular de pequeñas esmeraldas en la base de la banda.",
]
themes = ["esmeralda", "oro", "virgen maría", "américa española", "barroco"]
anecdote = """
La esmeralda más grande de la corona recibe el apodo de «esmeralda de Atahualpa»: se \
cuenta que habría pertenecido al último emperador inca, capturado por Francisco \
Pizarro en 1532. Ningún documento permite probarlo."""
salle = 4
mur = "nord"
place = 2
largeur = 1.25

[[oeuvres]]
titre = "Tabaquera con vistas del castillo de Chanteloup"
artiste = "Paris, orfèvres-bijoutiers du XVIIIᵉ siècle"
annee = "caja 1748–1749, miniaturas 1767"
image = "tabatiere-chanteloup.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Snuffbox_with_six_views_at_Chanteloup_(The_Choiseul_Box)_MET_DP169997.jpg"
technique = "Oro cincelado, vidrio, miniaturas sobre vitela; 4,4 × 7,9 × 5,7 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una caja de tabaco de oro, de 8 cm de largo, cuyas caras encuadran cada una una vista en miniatura del dominio del duque de Choiseul, pintada con una precisión asombrosa."
description = """
La tabaquera es un pequeño cofrecillo rectangular de oro, cuyas caras, tapa, fondo y \
lados, llevan cada una una miniatura bajo vidrio, enmarcada por una cenefa de oro \
cincelada con flores y motivos ondulados. La vista que aquí se presenta muestra, a \
vista de pájaro, un gran castillo de tejados de pizarra azul, con su patio y sus alas \
en ángulo. Ante él se extiende un vasto jardín regular: bosquetes recortados, calles \
rectas, parterres y, en el centro, un largo estanque que desciende en gradas hacia el \
espectador. A lo lejos, el campo se pierde en una bruma azulada. Diminutos paseantes \
animan las calles."""
evocation = """
El tabaco de rapé, reducido a polvo y aspirado por la nariz, era en el siglo XVIII una \
moda de toda la Europa elegante, y la tabaquera, que se sacaba en sociedad, un \
accesorio de prestigio, como un reloj o una espada. Esta es además el retrato de un \
lugar: Chanteloup, cerca de Amboise, pertenecía al duque de Choiseul, primer ministro \
de Luis XV. Caído en desgracia en 1770, se retiró allí y mantuvo una brillante corte, \
adonde sus amigos acudían a mostrarle su fidelidad. Poseer u ofrecer una caja adornada \
con sus tierras era exhibir un vínculo con él. Por su exactitud, las miniaturas hacen \
también de la caja un recuerdo, como una fotografía avant la lettre."""
histoire = """
La caja de oro se fabricó en París en 1748-1749, sin duda por el orfebre \
Pierre-François Delafons, admitido como maestro en 1732. Las miniaturas, en cambio, \
datan de 1767 y se atribuyen a Louis-Nicolas van Blarenberghe: se montaron, pues, casi \
veinte años después de la fabricación de la caja. Choiseul había comprado Chanteloup en \
1761 y lo había hecho ampliar y embellecer; gran aficionado a las tabaqueras, poseía \
una importante colección, pero se ignora si esta le perteneció. Fue donada al \
Metropolitan Museum en 1976 por Charles y Jayne Wrightsman, grandes coleccionistas de \
arte francés del siglo XVIII."""
facture = """
La caja es obra de un orfebre-joyero: las placas de oro, cinceladas con flores y \
motivos ondulados, se ensamblan alrededor de un armazón, y la tapa gira sobre una \
bisagra ajustada con gran precisión. Las miniaturas están pintadas al gouache sobre \
vitela y protegidas luego por un vidrio. Los Van Blarenberghe, padre e hijo, eran \
célebres por sus vistas minúsculas: en unos pocos centímetros cuadrados se cuentan las \
ventanas del castillo y los árboles de las calles, y los personajes miden solo unos \
milímetros."""
details = [
  "El largo estanque en gradas, en el centro, que conduce al castillo.",
  "Los tejados de pizarra azul y las alas en ángulo del patio.",
  "Los paseantes minúsculos, apenas mayores que la cabeza de un alfiler.",
  "La cenefa de oro cincelada con flores de cinco pétalos.",
]
themes = ["siglo xviii", "oro", "miniatura", "jardín", "tabaco"]
anecdote = """
Del castillo de Chanteloup, vendido tras la Revolución y demolido en 1823, no queda \
casi nada, salvo la pagoda china que Choiseul hizo levantar en el parque. Las vistas \
de las tabaqueras figuran entre los mejores testimonios de lo que fue."""
salle = 4
mur = "sud"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Huevo del enrejado de rosas"
artiste = "Maison Fabergé"
annee = "1907"
image = "oeuf-treillis-de-roses.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:House_of_Fabergé_-_Rose_Trellis_Egg_-_Walters_44501.jpg"
technique = "Oro, esmalte, diamantes; 7,7 × 5,9 cm"
collection = "Walters Art Museum, Baltimore"
note = "El huevo de Pascua que Nicolás II regaló a la emperatriz Alejandra en 1907, en recuerdo del nacimiento de su hijo. Mide menos de 8 cm de alto."
description = """
El huevo, de menos de ocho centímetros de alto, está cubierto de un esmalte verde \
tierno, translúcido, a través del cual se adivinan las finas estrías grabadas en el \
oro. Un enrejado de bandas engastadas con pequeños diamantes lo envuelve en rombos \
regulares. Por este enrejado trepa un rosal: tallos de oro amarillo, hojas esmaltadas \
de verde y rosas rosadas, más pálidas en el corazón, se reparten por toda la \
superficie, como en el cenador de un jardín. En la cumbre, un diamante plano está \
engastado en un collarín de oro. El huevo se abre en dos para revelar una sorpresa, \
hoy desaparecida."""
evocation = """
Los huevos son el corazón de la fiesta de la Pascua ortodoxa: se regalan intercambiando \
el beso pascual y la fórmula «Cristo ha resucitado». Los Románov hicieron de ellos \
obras maestras de joyería. Este celebra el nacimiento, en agosto de 1904, del zarévich \
Alexis, el heredero tan esperado tras cuatro hijas. Las rosas y el verdor de un jardín \
en primavera hablan de amor y de renovación. Hoy sabemos cuán frágil era esa imagen de \
felicidad familiar: el niño padecía hemofilia, algo que la corte ocultaba, y toda la \
familia fue asesinada por los bolcheviques en 1918."""
histoire = """
De 1885 a 1916, la casa Fabergé fabrica para la familia imperial huevos de Pascua cada \
uno de los cuales es único. La guerra ruso-japonesa interrumpe la serie en 1904 y \
1905; el 22 de abril de 1907, Nicolás II regala este a su esposa, Alejandra Fiódorovna. \
La factura de Fabergé, fechada la víspera, asciende a 8 300 rublos. El huevo contenía \
un collar de diamantes y un retrato en miniatura del zarévich sobre marfil, rodeado de \
diamantes, hoy perdidos. En 1917, los tesoros imperiales se trasladan al Kremlin; el \
huevo pasa luego a manos del marchante Alexandre Polovtsoff, en París. El coleccionista \
estadounidense Henry Walters lo adquiere en 1930 y lega su colección a Baltimore a su \
muerte, en 1931."""
facture = """
El fondo del huevo es un ejemplo del guilloché, la especialidad de Fabergé: un torno \
mecánico graba en el oro finas líneas regulares, y luego el esmaltador cubre la \
superficie con varias capas de esmalte translúcido, cocidas una tras otra y pulidas, \
que hacen centellear el metal como la seda. Las rosas y las hojas, de oro esmaltado, \
se aplican por encima, lo mismo que el enrejado de diamantes. El huevo sale del taller \
de Henrik Wigström, el orfebre finlandés que dirigió la fabricación de los huevos \
imperiales después de 1903."""
details = [
  "Las estrías grabadas del oro, visibles bajo el esmalte verde.",
  "Las líneas de pequeños diamantes que forman el enrejado.",
  "Las rosas esmaltadas, más pálidas en el corazón que en los bordes.",
  "El diamante plano engastado en la cumbre del huevo.",
]
themes = ["fabergé", "pascua", "rusia", "rosas", "románov"]
anecdote = """
Varios huevos imperiales desaparecieron tras la revolución. En 2014 se supo que un \
chatarrero estadounidense, que quería fundir un pequeño huevo de oro comprado en un \
mercadillo, poseía en realidad el tercer huevo imperial, regalado en 1887 y perdido \
desde los años veinte."""
salle = 5
mur = "sud"
place = 1
largeur = 0.75

[[oeuvres]]
titre = "Mujer-libélula, adorno de corpiño"
artiste = "René Lalique"
annee = "hacia 1897–1898"
image = "femme-libellule.jpg"
credit = "Photo : Sailko"
licence = "CC BY 3.0"
source = "https://commons.wikimedia.org/wiki/File:René_lalique,_pettorale_libellula,_in_oro,_smalti,_crisoprazio,_calcedonio,_pietre_lunari_e_diamanti,_1897-98_ca._01.jpg"
technique = "Oro, esmalte, crisoprasa, calcedonia, piedras de luna, diamantes; 23 × 26,5 cm"
collection = "Museo Calouste Gulbenkian, Lisboa"
note = "La joya más célebre del Art Nouveau: una mujer-insecto de alas de esmalte, presentada en la Exposición Universal de París de 1900. Mide 23 cm de alto y 26,5 cm de ancho."
description = """
Un busto de mujer se alza sobre el cuerpo de una libélula. Su cabeza, tocada con un \
casco de grandes ojos de insecto esmaltados de azul y de verde, se inclina, con los \
párpados bajos; su pecho desnudo es de un verde pálido de piedra. De sus hombros \
parten dos inmensas alas de esmalte translúcido verde pálido, nervadas como verdaderas \
alas de insecto y puntuadas por grandes óvalos azul verdoso engastados con pequeñas \
piedras claras. Sobre las alas, dos garras de oro se curvan como zarpas de rapaz. Bajo \
el busto, una cabeza de monstruo de oro, enmarcada por dos brazos replegados; más \
abajo, el largo abdomen de la libélula, hecho de anillos de oro, de esmalte azul oscuro \
y de cabujones claros, se alarga hasta una cola bífida."""
evocation = """
Lalique hace de una joya un ser híbrido, a la vez mujer, insecto y monstruo, que \
pertenece al mundo del sueño y del simbolismo de fin de siglo. La libélula, amada por \
los artistas del Art Nouveau y por las estampas japonesas que los inspiraban, evoca la \
ligereza, la metamorfosis, el brillo fugaz de un verano. Pero la mujer de ojos bajos, \
prisionera de este cuerpo de insecto y de estas garras, tiene también algo inquietante: \
se ha visto en ella una figura de la mujer fatal, seductora y peligrosa, tan querida \
por la literatura de la época. Sobre todo, el objeto afirma una idea nueva: el valor de \
una joya no reside en el peso de las piedras, sino en la invención del artista."""
histoire = """
Lalique concibe este adorno hacia 1897-1898, cuando renueva la joyería parisina. Según \
el museo Gulbenkian, fue sin duda llevado en escena por Sarah Bernhardt, clienta y \
amiga del joyero. En 1900, la mujer-libélula figura entre las joyas que causan \
sensación en la vitrina de Lalique en la Exposición Universal de París. El coleccionista \
Calouste Gulbenkian, hombre de negocios armenio enriquecido con el petróleo, la \
adquiere en 1903. Admirador y amigo de Lalique, reúne en casi treinta años unas ciento \
cincuenta de sus obras. Hoy se presentan en una sala que les está consagrada en el \
museo Gulbenkian de Lisboa, inaugurado en 1969."""
facture = """
Las alas son de esmalte «plique-à-jour»: el esmalte translúcido se vierte en una red de \
alvéolos de oro sin fondo, como una vidriera en miniatura, de modo que la luz las \
atraviesa. Están articuladas, lo que les da un ligero movimiento. Lalique asocia el \
oro y el esmalte a piedras que entonces se consideraban modestas, crisoprasa, \
calcedonia, piedras de luna, y a algunos diamantes, eligiendo cada materia por su color \
y no por su precio. El busto, esculpido y pulido con finura, muestra la habilidad de un \
artista que había aprendido el dibujo y el modelado antes de hacerse joyero."""
details = [
  "El casco de grandes ojos de insecto que cubre la cabeza de la mujer.",
  "Las nervaduras de oro de las alas, como en una verdadera libélula.",
  "Los grandes óvalos azul verdoso rodeados de pequeñas piedras claras, en los extremos de las alas.",
  "Las garras de oro curvadas sobre los hombros.",
  "La larga cola bífida, en lo más bajo de la joya.",
]
themes = ["art nouveau", "libélula", "mujer", "esmalte", "metamorfosis"]
anecdote = """
Después de 1905, Lalique abandona poco a poco la joyería por el vidrio: frascos de \
perfume para François Coty, jarrones, lámparas, mascotas de radiador de automóvil. Su \
vidriería de Wingen-sur-Moder, en Alsacia, fundada en 1921, sigue produciendo cristal \
con su nombre."""
salle = 5
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Adorno para el cabello con libélulas"
artiste = "Louis Comfort Tiffany"
annee = "hacia 1904"
image = "ornement-libellules.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Hair_Ornament_MET_DT5610.jpg"
technique = "Oro, plata, platino, ópalos negros, ópalos boulder, granates demantoides, rubíes, esmalte; altura 8,3 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Dos libélulas de ópalo posadas sobre cabezuelas de diente de león en semilla: una de las primeras joyas de Tiffany, de 8 cm de alto, conservada largo tiempo por la familia de su clienta Louisine Havemeyer."
description = """
Dos libélulas se han posado sobre dos bolas de diente de león en semilla. Los vilanos \
están resueltos con una malla de hilos de metal sembrada de minúsculos granos blancos; \
una de las bolas está en parte soplada, como si el viento ya se hubiera llevado parte \
de las semillas. Las libélulas tienen alas de fino encaje de metal, nervadas como \
verdaderas alas. Sus largos abdómenes están hechos de segmentos de ópalo azul de \
reflejos cambiantes, montados uno tras otro; sus grandes ojos son ópalos rosados, y su \
tórax está sembrado de pequeños granates verdes. Bajo las flores, dos tallos de plata \
unidos por una montura curva forman el peine que se deslizaba en el moño."""
evocation = """
Tiffany, pintor de formación, quería que sus joyas fueran fragmentos de naturaleza, \
observados de cerca y sin jerarquía: una mala hierba como el diente de león vale aquí \
tanto como una rosa. La libélula, insecto fetiche del Art Nouveau, se posa sobre lo que \
el menor soplo dispersa: la joya habla de fragilidad y del paso del tiempo, con su bola \
ya medio volada. Es también un objeto de adorno, hecho para ser visto en el peinado de \
una mujer, donde los reflejos de los ópalos cambian con cada movimiento. Frente al Art \
Nouveau francés de Lalique, Tiffany propone una versión estadounidense, más naturalista \
y menos inquietante."""
histoire = """
Hijo de Charles Lewis Tiffany, fundador de la célebre casa de joyería neoyorquina, \
Louis Comfort Tiffany se había hecho un nombre con el vidrio y las vidrieras. Hacia \
1902, tras la muerte de su padre, se lanza a la joyería, con la esmaltadora Julia \
Munson, y presenta sus primeras joyas en la Exposición Universal de San Luis, en 1904. \
Este peine data de ese período. Permaneció en la familia de Louisine Havemeyer, gran \
coleccionista neoyorquina, amiga de Mary Cassatt y clienta fiel de Tiffany, que había \
decorado su residencia de la Quinta Avenida. Una de sus descendientes, Linden \
Havemeyer Wise, lo donó al Metropolitan Museum en 2002, en memoria de ella."""
facture = """
Las alas están hechas con una red de hilos de metal soldados, de una finura que imita \
las nervaduras verdaderas. Los ópalos de Australia, cortados en pequeños segmentos y \
montados uno tras otro, resuelven los reflejos cambiantes del abdomen de las libélulas. \
Los granates demantoides, de un verde vivo y brillante, procedían entonces de los \
montes Urales, en Rusia. La malla de las bolas de diente de león, con sus granos de \
esmalte, supone un trabajo paciente, enteramente hecho a mano. El conjunto combina los \
saberes del orfebre, del lapidario y del esmaltador."""
