[[oeuvres]]
titre = "Cabeza real de Ifé"
artiste = "Ifé, royaume yoruba"
annee = "Siglo XIV – principios del siglo XV"
image = "tete-ife.jpg"
credit = "Photo : Sailko"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Arte_yoruba,_nigeria,_testa_da_ife,_12-15mo_secolo.JPG"
technique = "Aleación de cobre (latón) fundida a la cera perdida, altura aproximada 35 cm"
collection = "Museo Británico, Londres"
note = "Una cabeza coronada, de tamaño natural, fundida en metal en Ifé, la ciudad santa de los yoruba: sin duda el retrato idealizado de un rey, el ooni. Con unos 35 cm de altura, se muestra aquí ampliada."
description = """
Una cabeza de hombre, de tamaño casi natural, se alza sobre un cuello cilíndrico. El \
rostro, ovalado y pleno, es de una calma perfecta: párpados pesados, nariz ancha y \
recta, labios carnosos y bien dibujados, cerrados. Toda su superficie está recorrida por \
finas líneas verticales, apretadas y paralelas, que descienden de la frente hasta la \
barbilla. Alrededor de la boca y en la mandíbula, una hilera de pequeños orificios perfora el \
metal. La cabeza lleva una alta corona hecha de hileras de perlas tubulares, adornada en la \
parte delantera con una roseta y rematada por un penacho trenzado que termina en una punta con \
forma de botón. El metal, patinado, ha adquirido un tono verde oscuro, que deja asomar \
en algunos puntos destellos rojizos."""
evocation = """
La corona de perlas, reservada al rey, designa muy probablemente a un ooni, soberano \
sagrado de Ifé, la ciudad que los yoruba consideran el lugar donde se creó el mundo. \
El rostro no es el de un individuo captado del natural, sino una imagen ideal: \
joven, sereno, sin defecto. Los historiadores ven en él la expresión de una realeza fuera del \
tiempo, más que el retrato de un hombre. Las finas estrías se han interpretado como \
escarificaciones o como el recuerdo de un velo de perlas que cubría el rostro del rey, \
que no debía ser visto; los pequeños orificios servían sin duda para fijar perlas, \
una barba o ese velo. Se piensa que estas cabezas lucían peinados o \
vestiduras durante ritos funerarios o conmemorativos."""
histoire = """
En 1938, unos obreros que excavaban los cimientos en el recinto de Wunmonije, cerca \
del palacio del ooni en Ifé, sacan a la luz un conjunto de cabezas de metal. Su \
descubrimiento asombra a los sabios europeos. La mayoría permanecen en Nigeria, entonces \
colonia británica, y hoy las conservan los museos nacionales del país. \
Esta sale de Ifé e ingresa en el Museo Británico en 1939, con el número de inventario \
Af1939,34.1. Su salida sigue siendo objeto de debate en Nigeria, que desea el regreso de las obras \
salidas del país durante el período colonial. La cabeza se ha convertido en el emblema del arte \
de Ifé: ha figurado en grandes exposiciones dedicadas a la ciudad y es \
una de las piezas más famosas del museo de Londres."""
facture = """
La cabeza está fundida a la cera perdida: el escultor modela el rostro en cera sobre un \
núcleo de arcilla, lo reviste con un molde, hace fundir la cera y la sustituye por el \
metal en fusión. Las paredes son finas y regulares, signo de un gran dominio \
técnico. El modelado de las carnes, muy suave, los párpados rematados y los labios de \
contorno nítido atestiguan una observación atenta del rostro humano, que los artistas \
de Ifé practicaban también en la terracota. Las estrías se grabaron en la cera \
antes de la fundición, una a una."""
details = [
  "Las finas estrías verticales que cubren todo el rostro.",
  "Los pequeños orificios alrededor de la boca y a lo largo de la mandíbula.",
  "La roseta en el centro de la corona de perlas.",
  "El penacho trenzado erguido en lo alto de la cabeza.",
  "Los párpados pesados, entornados, de contorno delicadamente rematado.",
]
themes = ["realeza", "retrato", "yoruba", "bronce", "nigeria"]
anecdote = """
Cuando el etnólogo alemán Leo Frobenius vio en Ifé, en 1910, cabezas de este estilo, \
se negó a reconocer en ellas la obra de artistas africanos e imaginó que procedían de \
la Atlántida o de colonos griegos: un prejuicio que la arqueología ha desmentido \
por completo desde entonces."""
salle = 2
mur = "nord"
place = 2
largeur = 0.7

[[oeuvres]]
titre = "Colgante-máscara de la reina madre Idia"
artiste = "Royaume du Bénin, Edo"
annee = "Siglo XVI"
image = "masque-idia.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Queen_Mother_Pendant_Mask-_Iyoba_MET_DP231460.jpg"
technique = "Marfil, incrustaciones de hierro y latón, 23,8 × 12,7 × 6,4 cm"
collection = "Museo Metropolitano de Arte, Nueva York"
note = "Una pequeña máscara de marfil que el oba de Benín llevaba en el cinturón, con la efigie de su madre, Idia, primera reina madre del reino. Con 24 cm de altura, se muestra aquí ampliada."
description = """
El rostro de una mujer, esculpido en marfil, mira de frente. Los rasgos \
son finos y regulares: nariz recta, labios carnosos, ojos almendrados cuyas \
pupilas están incrustadas de hierro. En la frente, dos bandas verticales de hierro marcan \
el lugar de unas escarificaciones. El cabello, trenzado en pequeños bucles, está representado \
mediante una siembra de círculos. En lo alto, una especie de diadema calada alinea diminutas \
cabezas de hombres barbudos, tocados a la europea, que alternan con peces. Un \
collar calado del mismo tipo rodea la barbilla. El marfil, amarilleado por el tiempo, está \
recorrido por finas grietas, y se adivinan huellas verdes de metal alrededor de la \
boca."""
evocation = """
A principios del siglo XVI, el oba Esigie vence en una guerra al reino \
vecino de Igala gracias, según la tradición, a los consejos y los poderes de su madre, Idia. \
Crea para ella el título de iyoba, reina madre, con su propio palacio. La máscara \
celebra a esta mujer de poder. Las pequeñas cabezas barbudas son portugueses, llegados \
por mar a finales del siglo XV: para los edo, estos extranjeros venidos del océano \
estaban asociados a Olokun, dios de las aguas y de la riqueza. Los peces del fango, \
capaces de sobrevivir fuera del agua, evocan el paso entre dos mundos y el \
poder del oba, rey divino. El oba llevaba este colgante en la cadera durante las \
ceremonias de purificación del reino."""
histoire = """
La máscara fue esculpida para la corte de Benin City, en la actual Nigeria, por la \
corporación de los escultores de marfil, al servicio exclusivo del oba. En febrero de 1897, \
una expedición militar británica toma e incendia la ciudad, exilia al oba \
Ovonramwen y se lleva varios miles de objetos del palacio. Este forma parte del \
botín; pasa después por colecciones británicas antes de ser adquirido por \
Nelson Rockefeller, que lo dona al Met en 1972. Nigeria y la familia real de \
Benín reclaman desde hace décadas el regreso de estas obras. Desde 2021, museos \
y universidades de Alemania, Estados Unidos y el Reino Unido han comenzado a \
restituir objetos saqueados en 1897; esta máscara, en cambio, sigue en Nueva York."""
facture = """
El marfil, material real en Benín, está tallado con extrema finura: las cabezas de la \
diadema, de pocos milímetros de altura, tienen cada una su barba y su sombrero. El \
escultor juega con los contrastes: superficies lisas del rostro, relieve granuloso de la \
cabellera, calados de la corona y del collar. El hierro, incrustado en los ojos y en \
la frente, oscurece la mirada e intensifica la presencia. En el reverso, unas \
asas permitían sujetar la máscara al cinturón."""
details = [
  "Las pequeñas cabezas de portugueses barbudos que forman la corona.",
  "Los peces del fango que alternan con ellas.",
  "Las dos bandas de hierro verticales en medio de la frente.",
  "Las pupilas de hierro, una de las cuales ha conservado todo su brillo oscuro.",
]
themes = ["reina madre", "poder", "marfil", "portugueses", "restitución"]
anecdote = """
El gemelo de esta máscara, en el Museo Británico, se convirtió en el emblema del FESTAC 77, gran \
festival de las artes africanas organizado en Lagos en 1977. Nigeria había solicitado su \
préstamo; al no obtenerlo, hizo realizar una copia, y la máscara se ha convertido en un \
símbolo de las demandas de restitución."""
salle = 2
mur = "nord"
place = 3
largeur = 0.8

[[oeuvres]]
titre = "Placa del jefe guerrero"
artiste = "Royaume du Bénin, Edo"
annee = "hacia 1540–1570"
image = "plaque-chef-guerrier.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Plaque-_Warrior_Chief_MET_1979.206.98.jpeg"
technique = "Latón fundido a la cera perdida, 47,4 × 21,5 × 6,1 cm"
collection = "Museo Metropolitano de Arte, Nueva York"
note = "Una de las centenares de placas de latón que cubrían los pilares del palacio real de Benín: un jefe de guerra con atuendo de gala."
description = """
Sobre una placa rectangular de metal, un hombre de pie se destaca en altorrelieve, de \
frente, casi como una estatua. Lleva un casco alto, trenzado y guarnecido de puntas y \
de una pluma curvada, y su cuello desaparece en un alto collar de perlas. El torso está \
desnudo; un paño de bordes ornamentados, anudado en la cadera, le llega a las rodillas, \
y unas pulseras rodean sus muñecas y sus tobillos. Con la mano izquierda sostiene \
una larga lanza vertical. El fondo está grabado con motivos de hojas de cuatro \
lóbulos, apenas visibles. En los bordes de la placa, varios agujeros redondos muestran por dónde \
pasaban los clavos que la fijaban a la madera."""
evocation = """
Las placas formaban una especie de archivo en imágenes de la corte: el oba y sus \
dignatarios, los guerreros, los músicos, los ritos, los extranjeros portugueses. Este \
jefe, rígido y frontal, no es un individuo sino un rango: el casco, el collar de \
perlas de coral y la lanza dicen su condición y su función militar, al servicio del \
rey. En el siglo XVI, Benín es un poderoso reino en expansión, que comercia con \
los portugueses. El propio metal cuenta ese comercio: el latón llegaba en parte \
en forma de manillas, pulseras de metal que los europeos intercambiaban por \
marfil, pimienta, tejidos y, más tarde, cautivos. Las hojas grabadas \
del fondo se relacionan a menudo con el culto a Olokun."""
histoire = """
La placa fue fundida por la corporación de los fundidores de Benin City, instalada en \
una calle reservada y que trabajaba para el único oba. Clavada a un pilar del palacio, fue \
retirada de allí más tarde y guardada con las demás. En febrero de 1897, tras la muerte de \
miembros de una expedición británica, una fuerza de más de un millar de hombres toma la \
ciudad, la incendia y se lleva los tesoros del palacio, entre ellos unas novecientas placas, \
vendidas para pagar la operación y dispersadas por los museos de Europa y América. \
Desde 2021, instituciones de Alemania, Estados Unidos y el Reino Unido han devuelto \
a Nigeria centenares de objetos o su propiedad; en 2021, el Met devolvió él mismo \
a Nigeria dos placas salidas ilegalmente de las colecciones nacionales nigerianas. \
Esta ingresó en el Met en 1979 con la colección de Nelson Rockefeller."""
facture = """
La placa está fundida de una sola vez, a la cera perdida, figura y fondo juntos. El \
relieve es muy fuerte: la cabeza y los hombros se separan casi por completo del \
fondo. El fundidor trabajó la cera con minuciosidad para representar las perlas del collar una a \
una, las trenzas del casco y los motivos del paño. El fondo, plano, está punzonado con \
pequeños puntos y grabado con hojas, lo que lo hace vibrar bajo la luz. La \
composición, simétrica y frontal, estaba pensada para leerse de lejos, sobre los \
pilares."""
details = [
  "El alto collar de perlas que oculta el cuello del guerrero.",
  "El casco trenzado, erizado de puntas, y su pluma curvada.",
  "Las hojas de cuatro lóbulos grabadas en el fondo, a ambos lados.",
  "Los agujeros de los clavos, en las esquinas y en los bordes de la placa.",
]
themes = ["guerrero", "corte real", "latón", "saqueo", "restitución"]
anecdote = """
Los fundidores de Benin City siguen trabajando: la corporación de los Igun Eronmwon, \
instalada en la misma calle desde hace siglos, aún hoy funde objetos de \
latón a la cera perdida, según los métodos de sus antepasados."""
salle = 2
mur = "sud"
place = 4
largeur = 0.9

[[oeuvres]]
titre = "Máscara de corredor (gunyege)"
artiste = "Dan"
annee = "principios del siglo XX (?)"
image = "masque-dan.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1972.331"
technique = "Madera, metal, cuero y materias orgánicas, altura 22,9 cm"
collection = "Museo de Arte de Cleveland"
note = "Una máscara de los dan de Costa de Marfil o de Liberia, de frente alta y ojos rodeados de metal, que llevaba un corredor en las carreras enmascaradas. Con 23 cm de altura, se muestra aquí ampliada."
description = """
La máscara, de madera oscura y pulida, tiene forma de óvalo alargado, ligeramente abombado. La \
frente, muy alta y lisa, ocupa casi la mitad del rostro. Los ojos son dos \
grandes orificios redondos, rodeados de anillos de metal claro que les dan una mirada fija \
y luminosa. La nariz es corta, las fosas nasales bien marcadas. La boca, entreabierta, \
deja ver una hilera de dientes. Alrededor del rostro, una línea de pequeños orificios sigue \
el borde de la máscara. La superficie parda, patinada por el uso, está surcada de finas líneas \
y marcada por manchas más claras allí donde la madera se ha desgastado o frotado."""
evocation = """
Entre los dan, una máscara no es una simple escultura: es la morada de un espíritu \
del bosque, que se manifiesta en la aldea cuando la máscara es llevada, con su \
traje, por un bailarín cuya identidad permanece secreta. Cada máscara tiene una función y un \
nombre. Este tipo de frente alta, del norte del país dan, se llama sagbwe o gunyege. El \
gunyege es una «máscara corredora»: participaba en carreras organizadas cada \
semana durante la estación seca. Sus ojos redondos y grandes, según se dice, permitían al \
portador ver bien mientras corría. La máscara podía también proteger contra el fuego, cuando \
sopla el harmatán, viento seco y peligroso venido del Sáhara."""
histoire = """
El Museo de Arte de Cleveland no conoce el nombre del escultor ni la aldea de origen \
de la máscara: solo se sabe que fue tallada por un artista de estilo dan, en la \
región que hoy se extiende entre Costa de Marfil y Liberia, sin duda a principios \
del siglo XX. Como muchos objetos dan, fue adquirida por coleccionistas \
occidentales en una época en que apenas se anotaba el contexto de los objetos. \
Perteneció a Katherine White, gran coleccionista de arte africano de Cleveland, que \
la donó al museo en 1972. Los especialistas han observado que sus ojos fueron \
modificados: originalmente eran ranuras, transformadas más tarde en círculos, signo \
de que la máscara cambió de función a lo largo de su vida."""
facture = """
El escultor talló la máscara en un solo bloque de madera, con azuela y luego con \
cuchillo, vaciando el interior para que se ajustara al rostro. La superficie fue \
ennegrecida y pulida; el uso y los cuidados repetidos le han dado su pátina brillante. El \
estilo dan del norte se reconoce por la frente alta y abombada, el óvalo regular y los \
volúmenes simples y tensos. Los orificios del contorno servían para sujetar un tocado de \
fibras y el traje que ocultaba al portador; los anillos de metal se añadieron \
alrededor de los ojos."""
details = [
  "Los anillos de metal que rodean los ojos redondos.",
  "En el ojo derecho de la máscara, la huella de la antigua ranura, antes del ensanchamiento.",
  "La hilera de pequeños orificios que sigue el borde del rostro.",
  "Los dientes visibles en la boca entreabierta.",
]
themes = ["máscara", "espíritu", "carrera", "bosque", "costa de marfil"]
anecdote = """
Entre los dan, no se dice que un hombre lleve una máscara: es el espíritu de la máscara el que \
aparece. Revelar quién se oculta bajo el traje era una prohibición grave, y las mujeres \
y los niños no debían saberlo."""
salle = 3
mur = "nord"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Cabeza de guardián de relicario (nlô byeri)"
artiste = "Fang"
annee = "Siglo XIX"
image = "tete-byeri-fang.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Sculptural_Element_from_a_Reliquary_Ensemble-_Head_(The_Great_Bieri)_MET_DT1238.jpg"
technique = "Madera, aleación de cobre, aceite de palma, 46,5 × 24,8 × 16,8 cm"
collection = "Museo Metropolitano de Arte, Nueva York"
note = "Una cabeza fang de Gabón, conocida con el sobrenombre de «Gran Byeri»: velaba sobre una caja que contenía las reliquias de los antepasados de una familia."
description = """
Una gran cabeza de madera negra y brillante se alza sobre un largo cuello cilíndrico, \
clavado en un pedestal moderno. El rostro, en forma de corazón alargado, está dominado por una \
frente enorme y abombada, que desciende en dos arcos hacia los ojos. Estos son dos discos de \
metal, deslustrados, colocados en el fondo de unas cavidades. La nariz, larga y estrecha, llega a una pequeña \
boca de labios apretados, proyectada hacia delante sobre una barbilla puntiaguda. A cada \
lado, una larga trenza plana enmarca el rostro y desciende a lo largo del cuello, guarnecida de \
dos discos. Una profunda grieta atraviesa la madera desde la coronilla hasta la barbilla. \
La superficie, reluciente, parece aún húmeda en algunos puntos."""
evocation = """
Entre los fang, los huesos de los antepasados importantes, y sobre todo sus cráneos, se \
conservaban en cajas cilíndricas de corteza, custodiadas por el jefe de familia. Sobre \
la tapa, una estatua o, como aquí, una cabeza, el byeri, velaba por estas reliquias \
y las protegía de las miradas de los no iniciados. El rostro no es un retrato. Con \
su gran frente y sus proporciones de recién nacido, se ha visto en él la unión del antepasado y \
del niño, de la muerte y del renacimiento. Se ha hablado a menudo de su calma, de su \
concentración casi meditativa. Para los artistas europeos de principios del siglo XX, \
estas cabezas fueron una revelación: una escultura que simplifica las formas sin \
perder nada de su fuerza."""
histoire = """
La cabeza fue esculpida en el siglo XIX por un artista betsi, uno de los grupos fang de \
Gabón. El culto del byeri retrocede a partir de finales del siglo XIX, bajo la presión \
de los misioneros y de la administración colonial francesa, que lo combaten: \
muchos relicarios son entonces destruidos, separados de sus cajas o vendidos. Las \
cabezas y las estatuas llegan así a Europa, donde comerciantes y coleccionistas las \
buscan, sin las reliquias que custodiaban. Esta, convertida en una de las más \
famosas, entró en la colección de Nelson Rockefeller, que la legó al Met \
en 1979 junto con su conjunto de arte de África, Oceanía y América."""
facture = """
El escultor talló la cabeza y el cuello en una sola pieza de madera. Los volúmenes se \
reducen a unas pocas formas plenas: la cúpula de la frente, los planos hundidos de las mejillas, \
el avance de la boca. Las trenzas, planas, forman un marco que equilibra la \
composición. La madera se untaba regularmente con aceite de palma durante los ritos: la \
materia, al acumularse, ha formado esta costra negra y reluciente, que aún rezuma. \
Los ojos de metal atrapan la luz en la penumbra."""
details = [
  "Los dos discos de metal de los ojos, en el fondo de sus órbitas.",
  "La grieta que recorre desde lo alto de la frente hasta la barbilla.",
  "Las trenzas planas, a cada lado, guarnecidas de dos discos redondos.",
  "La superficie reluciente, espesada por el aceite de palma acumulado.",
  "El largo cuello, que se hundía en la caja de reliquias.",
]
themes = ["antepasados", "relicario", "gabón", "madera", "culto"]
anecdote = """
Durante la iniciación de los jóvenes, los fang sacaban los byeri de sus cajas y \
los hacían bailar detrás de un cortinaje, como marionetas, para presentar a los \
antepasados a la nueva generación."""
salle = 3
mur = "nord"
