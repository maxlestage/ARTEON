[exposition]
ordre = 28
nom_court = "África, Oceanía, América"
mouvement = "Artes de África, Oceanía y América"
cadre = "vitrine"
couleur = "#8a4b2a"
titre = "Rostros de los antepasados: artes de África, Oceanía y América"
artiste = "Ifé, Benín, dan, fang, maoríes, elema, olmecas, tairona, lakota…"
dates = "900 a. C. – hacia 1900"
accroche = "Exposición virtual · Museo del Quai Branly – Jacques Chirac, París"
introduction = """
Durante mucho tiempo llamadas «artes primitivas» o «artes primeras», las artes de África, \
Oceanía y América son las de reinos, ciudades y sociedades que tienen cada una su \
historia, sus talleres y sus maestros. La visita reúne diez objetos, desde el \
rostro de jade olmeca, con más de dos milenios de antigüedad, hasta una camisa lakota pintada \
hacia 1890: cabezas reales de Ifé y de Benín, máscaras y relicarios de África \
occidental y central, colgante maorí, tabla sagrada de Papúa, oro de Colombia. \
Varios abandonaron su país durante conquistas coloniales: su historia lo cuenta. El \
edificio se inspira en el Museo del Quai Branly – Jacques Chirac, de Jean Nouvel, en París: \
una rampa de entrada y luego una larga planta de colores de tierra donde los continentes se \
suceden sin tabiques cerrados."""
vitrine = "masque-idia.jpg"

[musee]
nom = "Museo del Quai Branly – Jacques Chirac"
ville = "París, Francia"
architecte = "Jean Nouvel"
construction = "inaugurado en 2006"
presentation = """
El museo nace de la voluntad del presidente Jacques Chirac y de su amigo el \
coleccionista Jacques Kerchache, que querían dar a las artes de África, Asia, \
Oceanía y América el lugar que merecían en los museos franceses. Una \
primera selección de obras maestras entra en el Louvre, en el Pabellón de las Sesiones, en 2000 \
; el nuevo museo, que reúne las colecciones del Museo del Hombre y del Museo \
Nacional de las Artes de África y Oceanía, abre en junio de 2006 a orillas del Sena. Jean \
Nouvel lo concibió como un largo edificio sobre pilotes en medio de un jardín \
diseñado por Gilles Clément; un muro vegetal de Patrick Blanc cubre una de las fachadas, \
y unas cajas de colores sobresalen de la fachada norte. En el interior, una larga rampa \
blanca asciende hasta la planta de las colecciones, un espacio único y sombrío donde los \
continentes se suceden. El museo lleva el nombre de Jacques Chirac desde 2016. En 2021, \
Francia seleccionó allí veintiséis objetos del tesoro real de Abomey, tomados en 1892, para \
devolverlos a la República de Benín."""
ici = """
El edificio de ARTEON conserva el recorrido del museo parisino: una subida y luego una larga \
planta donde los continentes se suceden. Se entra por el sur en «La rampa», de ocho \
metros de altura, que se abre al norte a la planta, una sucesión este-oeste de cuatro salas \
de siete metros de altura con muros color tierra. En el centro, la sala «África · Ifé \
y el reino de Benín»; al oeste, «Oceanía»; al este, «África · Máscaras y \
relicarios» y, al fondo de la planta, «América». Los objetos se presentan \
en profundas vitrinas murales, sobre un fondo de terciopelo oscuro."""

