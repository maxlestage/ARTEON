[[oeuvres]]
titre = "Colgante hei-tiki"
artiste = "Māori"
annee = "Siglo XIX"
image = "hei-tiki.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Unknown_artist_-_Pendant_(Hei-tiki)_-_1969.107_-_Cleveland_Museum_of_Art.jpg"
technique = "Nefrita (pounamu, jade de Nueva Zelanda), 16,9 × 10,2 cm"
collection = "Museo de Arte de Cleveland"
note = "Un colgante de jade verde en forma de figura humana, que los maoríes llevaban al cuello y se transmitía de generación en generación. Con 17 cm de altura, se muestra aquí ampliado."
description = """
Una pequeña figura humana, tallada en una piedra de un verde profundo, está sentada, con \
las piernas recogidas y separadas, que forman abajo una ancha base redondeada. Su cabeza, \
enorme, ocupa casi la mitad de la altura y se inclina hacia un lado. Dos grandes ojos \
redondos, cada uno hecho de un anillo en relieve alrededor de un botón central, se encuentran así \
a alturas diferentes; a su lado, una boca y una mano quedan reducidas a \
curvas grabadas. Los brazos, doblados, dibujan dos asas a uno y otro lado del torso \
plano. Entre los miembros, unos calados dejan pasar la luz. La piedra está pulida hasta \
brillar; su verde, casi negro en las hendiduras, se aclara en las aristas \
y se salpica en algunos puntos de vetas más claras."""
evocation = """
Hei significa «llevado al cuello» y tiki designa una figura humana. Para los maoríes, estos \
colgantes son taonga, tesoros cargados de mana, el prestigio y el poder \
espiritual de quienes los han llevado. Se transmiten en las familias de jefes, \
a lo largo de las generaciones, y unen a los vivos con sus antepasados. ¿Qué representa la \
figura? Se ha visto en ella a Tiki, el primer hombre de los relatos maoríes, o a un antepasado; el \
Museo de Arte de Cleveland recuerda también la hipótesis de Hine-te-iwaiwa, antepasada \
legendaria, modelo de mujer y protectora de los nacimientos. La cabeza inclinada y la \
postura recogida se han comparado a veces con las de un embrión."""
histoire = """
El pounamu, ese jade verde, solo se encuentra en la isla del Sur de Nueva Zelanda, \
sobre todo en la costa oeste y en los ríos; los maoríes llaman, por cierto, a la isla \
Te Wai Pounamu, «las aguas del jade». La piedra circulaba mediante intercambios por todo el \
país. En el siglo XIX, numerosos hei-tiki salen de Nueva Zelanda, colonizada por \
los británicos a partir de 1840, comprados o recogidos por viajeros, marinos \
y coleccionistas. Este pasó por la colección del inglés Harry \
Beasley, gran coleccionista de objetos del Pacífico, y después por la de John Wise. \
Ingresó en el Museo de Arte de Cleveland en 1969, donado por Mr. y Mrs. James B. Wadhams."""
facture = """
La nefrita es una piedra muy dura, que no se puede tallar con cuchillo. Antes de la \
llegada de las herramientas de metal europeas, los escultores maoríes la cortaban \
serrándola con hojas de arenisca y agua, luego la vaciaban y la perforaban con \
taladros de piedra, y la pulían durante horas con arena: la fabricación \
de un hei-tiki podía llevar meses. Las formas, plenas y redondeadas, se ajustan al \
grosor de la placa de piedra de partida. El pulido, llevado al extremo, hace brotar \
la profundidad del color."""
details = [
  "La gran cabeza inclinada hacia un lado.",
  "El ojo redondo, rodeado de un grueso reborde de piedra.",
  "Los brazos doblados en asa a cada lado del torso.",
  "Los calados entre los brazos, las piernas y el torso.",
  "Los matices del verde, más oscuro en las hendiduras.",
]
themes = ["jade", "antepasados", "adorno", "polinesia", "nueva zelanda"]
anecdote = """
Los ojos de los hei-tiki solían estar incrustados de nácar de paua, la oreja de mar de \
Nueva Zelanda de reflejos azul verdoso, o de cera roja. En este, los ojos están \
tallados en la propia piedra, en anillos concéntricos."""
salle = 4
mur = "nord"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Tabla de espíritu (hohao)"
artiste = "Elema, golfe de Papouasie"
annee = "antes de 1930"
image = "planche-esprit-elema.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1971.154"
technique = "Madera pintada, altura 123,2 cm"
collection = "Museo de Arte de Cleveland"
note = "Una tabla sagrada de Papúa Nueva Guinea, habitada por un espíritu del monte cuyo nombre llevaba, y conservada en la casa de los hombres."
description = """
Una tabla de madera ovalada, de más de un metro de altura, termina arriba y abajo en \
una corta espiga. Sobre un fondo blanqueado, un personaje está grabado y pintado en rojo pardo. \
Es casi todo rostro: dos grandes ojos almendrados, de pupilas hechas de \
círculos concéntricos, enmarcan una nariz larga y puntiaguda, esculpida en relieve, y una \
ancha boca erizada de dientes en zigzag. Encima, unos chevrones y dientes de sierra \
forman como un tocado. Bajo el rostro, dos pequeños brazos se alzan, con las manos abiertas, \
a uno y otro lado de un cuerpo en forma de huevo, pintado de rojo, en cuyo centro un \
círculo marca el ombligo. Dos piernas flacas, dobladas, descienden hacia abajo. Unas \
bandas de chevrones siguen los bordes de la tabla."""
evocation = """
Entre los elema, que viven en la costa del golfo de Papúa, al sur de \
Nueva Guinea, cada tabla estaba habitada por un espíritu del monte, cuyo nombre \
llevaba. Las tablas se guardaban en la gran casa de los hombres, en el corazón \
de la aldea, con otros objetos sagrados, al abrigo de la mirada de las mujeres y de los niños. \
Se les pedía, según relatan los observadores de principios del siglo XX, protección y \
éxito, tanto en la caza como en la guerra. El rostro pintado no es el de un hombre: \
es la presencia del espíritu, hecha visible. Los motivos geométricos repiten \
formas que se encuentran en las grandes máscaras de las ceremonias elema."""
histoire = """
La tabla fue esculpida y pintada antes de 1930 en la región del golfo de Papúa, \
entonces administrada por Australia. En esa época, la llegada de los misioneros y de los \
administradores trastoca la vida religiosa: las grandes ceremonias se hacen más raras, \
se abandonan casas de los hombres y muchos objetos sagrados son vendidos o \
se los llevan coleccionistas y museos occidentales. El antropólogo australiano \
Francis Edgar Williams estudia entonces la región de Orokolo y describe las ceremonias \
elema. La tabla ingresó en el Museo de Arte de Cleveland en 1971, donada por el Dr. y \
Mrs. Thomas Munro."""
facture = """
La tabla está tallada en un solo panel de madera, adelgazado y redondeado, con sus dos \
espigas. Solo la nariz está esculpida en relieve; todo lo demás se obtiene mediante el grabado de \
surcos poco profundos y después con la pintura. Los colores son pigmentos naturales: \
ocre rojo y blanco de cal o de arcilla, sobre el pardo de la madera. El decorado, casi \
simétrico, se organiza en torno al eje de la nariz."""
details = [
  "Las pupilas hechas de círculos concéntricos.",
  "La nariz puntiaguda, único elemento esculpido en relieve.",
  "La boca de dientes en zigzag.",
  "Las pequeñas manos alzadas a uno y otro lado del cuerpo rojo.",
  "El círculo del ombligo en el centro del cuerpo.",
]
themes = ["espíritu", "casa de los hombres", "pintura", "papúa", "sagrado"]
anecdote = """
Los elema daban a cada tabla el nombre del espíritu que la habitaba: para ellos, estas \
tablas no eran imágenes intercambiables, sino seres individuales, a los que \
se conocía y se nombraba como a personas."""
salle = 4
mur = "nord"
place = 3
largeur = 0.6

[[oeuvres]]
titre = "Rostro de jade"
artiste = "Olmèques"
annee = "900–400 a. C."
image = "visage-olmeque.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/310279"
technique = "Jadeíta, 14,6 × 14 × 7,6 cm"
collection = "Museo Metropolitano de Arte, Nueva York"
note = "Un rostro humano tallado en una jadeíta verde oscura por los olmecas del golfo de México, la más antigua gran civilización de Mesoamérica. Con 15 cm de altura, se muestra aquí ampliado."
description = """
Un rostro de hombre, de frente, está tallado en una piedra verde, oscura y veteada de \
manchas más claras. Los rasgos son plenos y poderosos: anchos pómulos, nariz corta \
y chata, párpados pesados, ojos almendrados apenas abiertos, hundidos en leves \
ranuras. La boca, de labios gruesos, se entreabre, y sus comisuras descienden \
ligeramente. El rostro está cortado limpiamente por encima de la frente, como por una banda, y por \
los lados; pequeños orificios perforan los bordes, cerca de las orejas. La superficie, pulida, \
atrapa la luz en los relieves y la retiene en las hendiduras. No se ven ni cuello ni \
cabellera: es una máscara más que una cabeza."""
evocation = """
Los olmecas, que vivían en la costa del golfo de México, en los actuales estados de \
Veracruz y Tabasco, son conocidos por sus cabezas colosales de basalto y por \
sus objetos de jade. Para ellos, como después para los mayas y los aztecas, la \
piedra verde era más preciosa que el oro: evocaba el agua, el maíz tierno, la vida \
y el aliento. Este rostro ideal, calmo y grave, se ha relacionado con los de los soberanos \
y sus antepasados. La boca de comisuras caídas recuerda las figuras olmecas que \
se dicen «de rostro de jaguar», seres que mezclan al hombre y al animal. Se ignora si estas \
máscaras se llevaban puestas, sujetas a un traje, o se depositaban en las tumbas."""
histoire = """
El rostro fue tallado entre 900 y 400 antes de nuestra era, en la época en que La Venta, en \
el actual Tabasco, es el gran centro olmeca. No se conocen ni su lugar de hallazgo \
ni su historia antigua: como la mayoría de los jades olmecas de los museos, \
apareció en el mercado del arte sin indicación de excavación. Estos objetos preciosos \
circulaban ya en la Antigüedad: los mayas y los aztecas los encontraban, los \
conservaban y los reutilizaban como reliquias, varios siglos después de su \
fabricación. Este perteneció a la coleccionista neoyorquina Alice K. Bache, \
que lo legó al Met en 1977."""
facture = """
La jadeíta es una piedra tan dura que no se deja tallar por herramientas de \
metal ordinarias; los olmecas, por otra parte, no las tenían. El escultor la desgastó \
pacientemente con abrasivos, arena y agua, cordeles y taladros de \
madera o de hueso, y luego la pulió largamente. El trabajo se aprecia en la suavidad de los \
pasajes entre los volúmenes: las mejillas, los párpados y los labios parecen modelados \
como cera. Las perforaciones laterales, hechas con taladro, permitían sin duda \
fijar el rostro."""
details = [
  "Los ojos entornados, simples ranuras en la piedra.",
  "La boca entreabierta, de comisuras ligeramente caídas.",
  "Las vetas más claras que atraviesan la jadeíta.",
  "Los pequeños orificios practicados en los bordes, cerca de las orejas.",
]
themes = ["jade", "mesoamérica", "rostro", "soberano", "méxico"]
anecdote = """
Los aztecas ya coleccionaban antigüedades olmecas: una máscara de piedra verde \
de estilo olmeca, con más de dos mil años de antigüedad en aquella época, fue hallada entre las \
ofrendas enterradas en el Templo Mayor de Tenochtitlan."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Colgante del personaje enmascarado"
artiste = "Tairona"
annee = "900–1600"
image = "pendentif-tairona.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Masked_Figure_Pendant_MET_DP215717.jpg"
technique = "Oro fundido a la cera perdida, 13,3 × 14,6 × 5,1 cm"
collection = "Museo Metropolitano de Arte, Nueva York"
note = "Un colgante de oro de los tairona, pueblo de la Sierra Nevada de Santa Marta, en el norte de Colombia: un hombre enmascarado bajo un inmenso tocado. Con 15 cm de ancho, se muestra aquí ampliado."
description = """
Un hombrecillo robusto se mantiene de pie, de frente, sobre piernas cortas y macizas. Sus \
brazos cuelgan a lo largo del cuerpo y sus manos aferran dos objetos que terminan en \
espirales, a la altura de las caderas. Un cinturón trenzado le ciñe la cintura. Su rostro \
desaparece tras una máscara animal de ancha boca guarnecida de dientes. Encima se eleva \
un tocado inmenso, mucho más ancho que él: dos pequeñas cabezas de ave de pico \
curvo se inclinan en lo alto del cráneo; a cada lado, dos grandes elementos planos, \
en forma de alas o de cabezas de ave provistas de un ojo, se extienden como \
orejas; más arriba todavía, dos arcos de hilo de oro trenzado se enroscan en volutas, \
acompañados de discos en espiral. El oro, de un amarillo cálido, brilla en los relieves."""
evocation = """
El personaje es sin duda un hombre de alto rango, jefe o sacerdote, ataviado para una \
ceremonia. La máscara y el tocado de cabezas de ave sugieren una transformación: \
durante el rito, el hombre toma la fuerza del animal. Para los pueblos de Colombia, \
el oro no era una moneda sino una materia sagrada, ligada al sol y a la \
fertilidad, que hacía brillar a quien lo llevaba. Los kogi, los arhuacos y los \
wiwa, descendientes de los tairona que aún viven en la Sierra Nevada, se \
consideran los guardianes del equilibrio del mundo."""
histoire = """
Los tairona construían aldeas de piedra, unidas por escaleras y por \
caminos empedrados, en las laderas de la Sierra Nevada de Santa Marta, por encima del mar \
Caribe. Sus orfebres produjeron numerosos colgantes de este tipo entre el siglo X \
y el XVI. A partir de 1525, los españoles fundan Santa Marta y buscan \
el oro de la región; tras décadas de guerras, los tairona se repliegan a las \
alturas de la montaña. Gran parte del oro amerindio capturado por los \
conquistadores fue fundida en lingotes; las piezas conservadas proceden sobre todo de tumbas. \
Esta fue donada al Met en 1991 por el coleccionista Jan Mitchell."""
facture = """
El colgante está fundido a la cera perdida: el orfebre modelaba cada elemento en cera, \
enrollaba finos hilos de cera para las espirales y los torzales, lo recubría todo \
de arcilla y luego hacía correr el metal en fusión en lugar de la cera. Los tairona \
utilizaban a menudo una aleación de oro y cobre, llamada tumbaga, de la que hacían \
aflorar el oro en la superficie mediante un tratamiento químico, para darle el brillo del oro \
puro. El trabajo combina partes macizas, como el cuerpo, y partes caladas \
muy ligeras."""
details = [
  "Las dos pequeñas cabezas de ave de pico ganchudo, en lo alto del cráneo.",
  "Los arcos de hilo de oro trenzado que se enroscan en volutas.",
  "La máscara de ancha boca dentada, que oculta el rostro.",
  "Los objetos con espirales que el personaje sostiene en cada mano.",
  "Los dedos de los pies, delicadamente indicados, bajo los pies robustos.",
]
themes = ["oro", "orfebrería", "colombia", "máscara", "transformación"]
anecdote = """
La «Ciudad Perdida», la ciudad perdida de los tairona, con sus terrazas de piedra \
ocultas en la selva de la Sierra Nevada, solo fue revelada al gran público en \
los años setenta, tras su descubrimiento por saqueadores de tumbas."""
salle = 5
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Camisa pintada de jefe"
artiste = "Lakota"
annee = "hacia 1890"
image = "chemise-lakota.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:America,_Native_North_American,_Central_Plains,_Lakota_Sioux,_19th_century_-_Hide_Shirt_-_1984.1046_-_Cleveland_Museum_of_Art.tif"
technique = "Piel, pigmentos, cuentas de vidrio, cabello humano, 97,8 × 150 cm"
collection = "Museo de Arte de Cleveland"
note = "Una camisa de piel pintada de los lakota de las Grandes Llanuras, adornada con bandas de cuentas y mechones de cabello: cada mechón recuerda una hazaña guerrera."
description = """
La camisa, extendida con los brazos abiertos, mide un metro cincuenta de una manga a otra. \
Está hecha de pieles curtidas, cortadas con sencillez. La parte alta y las mangas \
están pintadas de un verde algo azulado, la parte baja de un amarillo vivo: los dos \
colores se funden uno en otro a la altura de la cintura. En el cuello, un pequeño \
peto de cuentas está rayado con bandas horizontales. En los hombros y a lo largo de las mangas \
corren anchas bandas bordadas con cuentas de vidrio, de fondo blanco, adornadas con rombos \
y pequeñas cruces rojas, azules y verdes. A lo largo de estas bandas cuelgan largos \
mechones de cabello oscuro, atados en su parte superior con tiras rojas. El bajo de la \
camisa y los puños terminan en flecos de piel recortada."""
evocation = """
Entre los lakota, una de las naciones de las que los europeos llamaron sioux, las \
camisas pintadas eran ante todo el privilegio de los grandes jefes, los «portadores de \
camisa». Este rango se ganaba con el valor y el sacrificio, y se perdía si se \
faltaba a los deberes. Los dos colores se han interpretado a menudo como el cielo y la \
tierra. Los mechones de cabello, entregados por miembros de la familia, representaban \
cada uno una hazaña de guerra. Hacia 1890, cuando se hace esta camisa, los lakota \
están confinados en reservas; la camisa pintada se ha convertido en el honor de los antiguos \
combatientes, un recuerdo de la vida libre de las Llanuras."""
histoire = """
La camisa fue hecha hacia 1890, en el momento más sombrío de la historia lakota. Los \
bisontes han sido exterminados, las tierras de las Black Hills, sagradas para los lakota, \
fueron tomadas por Estados Unidos tras el descubrimiento de oro, y las familias viven en \
reservas. El 29 de diciembre de 1890, el ejército estadounidense masacra a varios cientos de \
lakota, hombres, mujeres y niños, en Wounded Knee, en la reserva de Pine Ridge. Se \
ignora quién hizo y llevó esta camisa y cómo salió de su familia. Perteneció \
a David S. McMillan, de Cleveland, que la legó al museo en 1984."""
facture = """
La camisa está hecha de pieles de cérvido curtidas, cosidas con tendón. Los colores se \
aplican con pincel, en grandes superficies, con pigmentos minerales o, ya en \
esa época, con colores comprados en los almacenes. Las bandas están bordadas con pequeñas \
cuentas de vidrio importadas de Europa, cosidas en hileras apretadas: era un trabajo de \
mujeres, muy apreciado, que sustituyó poco a poco al bordado tradicional con púas \
de puercoespín. Los flecos y los mechones dan movimiento a la prenda cuando \
el hombre camina o baila."""
details = [
  "Los mechones de cabello negro que cuelgan a lo largo de las bandas de cuentas.",
  "Las pequeñas cruces rojas bordadas sobre fondo de cuentas blancas.",
  "El degradado en el que el verde de arriba se funde en el amarillo de abajo.",
  "Los flecos de piel recortada en el bajo de la camisa y en los puños.",
]
themes = ["llanuras", "jefe", "cuentas", "honor", "reservas"]
anecdote = """
Las cuentas de vidrio que bordaban las mujeres lakota procedían en gran parte de \
Venecia y Bohemia: cruzaban el Atlántico y remontaban luego el Misuri \
hasta los puestos comerciales de las Grandes Llanuras."""
salle = 5
mur = "est"
place = 2
largeur = 1.8

[[artistes]]
nom = "Ifé, royaume yoruba"
vie = "Ifé (suroeste de la actual Nigeria), siglos XII–XV"
biographie = """
Ifé, o Ilé-Ifẹ̀, es para los yoruba la ciudad santa por excelencia: allí, según \
sus relatos, los dioses crearon la tierra y el primer rey, Oduduwa, fundó \
la dinastía de la que descienden los soberanos de los demás reinos yoruba. Entre el siglo XII \
y el XV aproximadamente, Ifé es una gran ciudad amurallada, en el corazón de \
redes de intercambio que la unen con el río Níger y, más allá, con las rutas del Sáhara. \
Sus calles están pavimentadas con fragmentos de cerámica colocados de canto, y sus talleres fabrican \
cuentas de vidrio, material real. Sus artistas, cuyos nombres desconocemos, \
dejaron cabezas y figuras de terracota y de aleación de cobre de un \
naturalismo sin equivalente en África en esa época, ligadas al culto de los reyes y a \
sus funerales. Después del siglo XV, la influencia política de Ifé declina en favor \
de Oyo y de Benín, pero la ciudad conserva su prestigio religioso. Su soberano, el ooni, \
sigue contándose entre los grandes jefes tradicionales de Nigeria. Las excavaciones del siglo XX, \
desde las de Leo Frobenius en 1910 hasta el descubrimiento de Wunmonije en 1938, han revelado este \
patrimonio al mundo."""
style = """
El arte de Ifé impresiona por su naturalismo idealizado: rostros calmos, carnes plenas, \
proporciones justas, pero rasgos sin edad ni defecto. Los fundidores dominaban la fundición \
a la cera perdida de piezas de paredes muy finas, y los modeladores de terracota \
iban del retrato a la expresividad más libre. Este arte influyó profundamente en \
el de la vecina Benín, cuya tradición cuenta que un fundidor de Ifé habría enseñado \
la fundición del metal a los artistas de la corte."""

[[artistes]]
nom = "Royaume du Bénin, Edo"
vie = "Benin City (sur de la actual Nigeria), siglo XIII – la actualidad"
biographie = """
El reino de Benín, que no debe confundirse con la vecina República de Benín, es \
el Estado de los edo, en el sur de la actual Nigeria. Su capital, Benin City, está rodeada \
de largas murallas de tierra. A su cabeza reina el oba, rey sagrado, cuya dinastía se remonta \
según la tradición a un príncipe venido de Ifé. En los siglos XV y XVI, bajo los obas \
Ewuare, Ozolua y Esigie, el reino se extiende y se convierte en una potencia regional. Los \
portugueses llegan en los años 1480 y comercian con la corte: marfil, pimienta, \
tejidos y, más tarde, cautivos, a cambio de latón, tejidos y armas. En el palacio, \
corporaciones de artistas, fundidores de latón y escultores de marfil y de madera, \
trabajan para el único oba: producen cabezas conmemorativas, placas, estatuas \
y adornos. En febrero de 1897, una expedición británica toma la ciudad, la incendia, \
exilia al oba Ovonramwen y se lleva miles de objetos, hoy dispersos en \
los museos del mundo. La monarquía se restablece en 1914; el actual oba, Ewuare II, \
pide junto con Nigeria el regreso de estas obras, parte de las cuales ha comenzado a volver \
desde 2021."""
style = """
El arte de corte de Benín es un arte de Estado, al servicio de la memoria del rey. Se \
reconoce por sus figuras frontales y jerarquizadas, por la precisión de los adornos, perlas \
de coral, collares, armas, y por la virtuosidad de la fundición a la cera perdida. Las \
placas y los marfiles cuentan la vida de la corte y el encuentro con los europeos, \
convertidos ellos mismos en motivos. Los fundidores de Benin City perpetúan este saber hacer \
hoy en día."""

[[artistes]]
nom = "Dan"
vie = "Oeste de Costa de Marfil y Liberia, siglos XIX–XX"
biographie = """
Los dan viven en las regiones de bosque y sabana arbolada que se extienden a ambos \
lados de la frontera entre Costa de Marfil y Liberia, en torno a la ciudad de \
Man. Cultivadores de arroz, viven en aldeas independientes, sin rey, donde \
la autoridad se reparte entre los ancianos, los jefes de familia y asociaciones \
de hombres. Las máscaras ocupan en ella un lugar esencial: son las manifestaciones \
de espíritus del bosque, que aparecen en la aldea para juzgar los conflictos, \
acompañar la iniciación de los muchachos, divertir, cantar, bailar o correr. Una máscara \
puede cambiar de función a lo largo de su vida, ascender en prestigio y acabar como máscara \
de juez respetado. Los escultores dan, algunos de los cuales fueron célebres en vida, \
como Zlan a principios del siglo XX, trabajaban por encargo y eran conocidos por \
su manera propia. Las máscaras dan entraron en gran número en las colecciones \
occidentales en el siglo XX, y los etnólogos Hans Himmelheber y Eberhard Fischer \
recogieron, de los propios dan, una parte de su historia y de sus \
usos."""
style = """
El estilo dan se reconoce por sus máscaras ovaladas, de volúmenes lisos y tensos, de frente \
abombada, boca plena y ojos en ranura o redondos. La superficie, ennegrecida y pulida, \
adquiere una pátina profunda. Su sencillez y su equilibrio han hecho de las máscaras dan \
modelos admirados por los artistas y los coleccionistas del siglo XX."""

[[artistes]]
nom = "Fang"
vie = "Gabón, Guinea Ecuatorial y sur de Camerún, siglo XIX"
biographie = """
Los fang son un conjunto de pueblos de lengua bantú establecidos en los bosques de \
Gabón, de Guinea Ecuatorial y del sur de Camerún. En el siglo XIX, migran \
hacia el sur y el oeste y alcanzan la región del estuario del Gabón y del Ogooué, \
donde los exploradores y comerciantes europeos los encuentran. Su sociedad, sin \
poder central, se basa en linajes cuya unidad está garantizada por el culto a los \
antepasados, el byeri: los cráneos y los huesos de los difuntos importantes se conservan en \
cajas de corteza, coronadas por estatuas o cabezas protectoras. Varios \
grupos, como los betsi, los ntumu o los okak, tienen cada uno su estilo. Con la \
colonización francesa y la cristianización, a partir de finales del siglo XIX, el \
culto del byeri es combatido y decae; numerosas esculturas son destruidas o \
vendidas. Los fang tienen también máscaras, como las de la asociación ngil, que administraba \
justicia. Llegadas a París a principios del siglo XX, las esculturas fang figuran \
entre las que más impresionaron a los artistas de la vanguardia, Derain, Vlaminck o \
Picasso."""
style = """
La escultura fang busca el equilibrio entre volúmenes plenos: gran frente abombada, \
rostro cóncavo en forma de corazón, boca adelantada, miembros poderosos. La superficie, negra \
y reluciente, se nutre de aceite a lo largo de los ritos. Los escultores buscan una \
impresión de calma y de dominio de sí, cualidades que los fang atribuían a los \
antepasados."""

[[artistes]]
nom = "Māori"
vie = "Aotearoa – Nueva Zelanda, siglo XIII – la actualidad"
biographie = """
Los maoríes son el pueblo polinesio que se estableció en Nueva Zelanda, a la que \
llaman Aotearoa, hacia el siglo XIII, tras largas navegaciones en piragua \
desde la Polinesia oriental. Organizados en tribus, los iwi, y en clanes, \
desarrollan en estas islas frías una cultura original: grandes casas de reunión \
esculpidas, piraguas de guerra, tatuaje facial, el moko, tejido de lino, armas y \
adornos de jade. La piedra verde, el pounamu, es una de las materias más \
preciosas; sirve para hacer azuelas, mazas y colgantes. El \
primer europeo en alcanzar estas costas es el holandés Abel Tasman en 1642, y después \
James Cook en 1769. En el siglo XIX llegan los balleneros, los misioneros y los \
colonos; en 1840, el tratado de Waitangi coloca el país bajo soberanía británica, \
y las guerras y la pérdida de tierras que siguen trastornan la sociedad maorí. Los \
objetos antiguos, convertidos en taonga, tesoros, están hoy en el centro de las demandas \
de devolución y del renacimiento cultural maorí."""
style = """
El arte maorí cubre las superficies de espirales, curvas y motivos repetidos, esculpidos \
en madera, hueso o piedra. Las figuras humanas, a menudo estilizadas hasta el extremo, \
representan antepasados y portan el mana de quienes las poseyeron. El trabajo \
del jade, lento y paciente, da formas plenas, pulidas hasta la transparencia."""

[[artistes]]
nom = "Elema, golfe de Papouasie"
vie = "Costa del golfo de Papúa (Papúa Nueva Guinea), siglo XIX – principios del siglo XX"
biographie = """
Los elema viven en la costa este del golfo de Papúa, al sur de la gran isla de \
Nueva Guinea, en una región de deltas, manglares y playas, en torno a la \
bahía de Orokolo. Sus aldeas se organizan en torno a grandes casas de los hombres, los \
eravo, de fachadas muy altas, donde se inicia a los muchachos y donde se guardan los \
objetos sagrados, entre ellos las tablas de espíritu. La vida religiosa estaba marcada por \
grandes ciclos de ceremonias, que podían durar años y terminaban con la \
salida de decenas de inmensas máscaras, los hevehe, hechas de corteza batida pintada \
tendida sobre una armadura de ratán. A principios del siglo XX, la región queda bajo \
administración australiana; las misiones y los cambios de la vida económica \
hacen retroceder, y luego desaparecer, estos grandes ciclos a lo largo del siglo XX. \
El antropólogo Francis Edgar Williams los describió en detalle en su libro Drama \
of Orokolo, publicado en 1940. Muchos objetos elema partieron entonces hacia los museos \
de Australia, Europa y América."""
style = """
El arte elema asocia la escultura en bajorrelieve, el grabado y la pintura. Sus \
figuras, muy estilizadas, se reducen a un rostro de grandes ojos perfilados, una nariz \
saliente y una boca dentada, rodeados de chevrones y zigzags. Los colores, \
rojo, blanco y negro, se extraen de la tierra y del carbón."""

[[artistes]]
nom = "Olmèques"
vie = "Costa del golfo de México (Veracruz y Tabasco), hacia 1500–400 a. C."
biographie = """
Los olmecas son la más antigua de las grandes civilizaciones de Mesoamérica. \
Viven en las tierras bajas húmedas y pantanosas del sur del golfo de México, en \
los actuales estados de Veracruz y Tabasco. Ignoramos el nombre que se daban a sí mismos \
: el de olmecas, «gente del país del caucho», les fue atribuido por los \
arqueólogos a partir de un término azteca. Hacia 1200 a. C., San Lorenzo se convierte en un \
gran centro, con sus terrazas y sus monumentos de basalto, entre ellos cabezas \
colosales de soberanos de más de dos metros de altura. Hacia 900 a. C., La Venta \
le sucede, con su pirámide de tierra y sus ofrendas enterradas de jade y de \
serpentina. Los olmecas traen de muy lejos piedras verdes, obsidiana \
y conchas, y sus imágenes se difunden por gran parte de México. \
Hacia 400 a. C., La Venta es abandonada. Pero muchos rasgos olmecas, el \
culto de las piedras verdes, el juego de pelota, ciertas divinidades, se encuentran entre los \
mayas y los pueblos que les siguieron."""
style = """
El arte olmeca es un arte de la masa y de la piedra dura: cabezas colosales de \
basalto, hachas, máscaras y figurillas de jade pulido. Los rostros tienen rasgos plenos, \
párpados pesados y una boca gruesa de comisuras caídas, a veces mezclados con \
rasgos de jaguar. Su gravedad y su perfección técnica hicieron de los jades \
olmecas objetos de prestigio hasta la época azteca."""

[[artistes]]
nom = "Tairona"
vie = "Sierra Nevada de Santa Marta (norte de Colombia), hacia 900–1600"
biographie = """
Los tairona ocupaban la Sierra Nevada de Santa Marta, macizo aislado del norte de \
Colombia que se eleva en pocas decenas de kilómetros desde la orilla del mar Caribe \
hasta cumbres nevadas de más de 5 000 metros. Entre el siglo X y el XVI, \
construyen allí centenares de aldeas y pequeñas ciudades, con terrazas, \
escaleras, canales y caminos empedrados con piedra, de los cuales el más célebre es \
Teyuna, la «Ciudad Perdida». Agricultores, cultivan maíz, yuca y \
frutas en las laderas y comercian con la costa. Sus orfebres producen \
colgantes, adornos de nariz y de labios, cuentas y figurillas de oro y de tumbaga. A \
partir de 1525, la fundación de Santa Marta por los españoles abre un largo período \
de conflictos; los tairona, vencidos a finales del siglo XVI, se repliegan a las \
alturas. Sus descendientes, los kogi, los arhuacos, los wiwa y los kankuamo, viven \
todavía en la Sierra y mantienen allí sus tradiciones."""
style = """
La orfebrería tairona se reconoce por sus figuras humanas achaparradas, coronadas por \
tocados enormes poblados de aves y de espirales, y por el uso de hilos de oro trenzados \
imitados en la cera. Fundida a la cera perdida, a menudo en tumbaga dorada en la superficie, \
figura entre las más inventivas de la América antigua, junto a las de los \
muisca, los quimbaya o los sinú."""

[[artistes]]
nom = "Lakota"
vie = "Grandes Llanuras de América del Norte (Dakotas, Nebraska, Wyoming, Montana), siglo XVIII – la actualidad"
biographie = """
Los lakota son la más occidental de las tres grandes divisiones de la nación que los \
europeos llamaron sioux, junto a los dakota y los nakota. Venidos de la región \
de los Grandes Lagos, se establecen en el siglo XVIII en las Grandes Llanuras, adoptan \
el caballo y viven de la caza del bisonte, siguiendo a las manadas. Organizados en siete \
tribus, entre ellas los oglala y los sicangu, hacen de las Black Hills su territorio \
sagrado. En el siglo XIX, el avance de los colonos, del ferrocarril y del ejército de \
Estados Unidos los arrastra a una serie de guerras: bajo la guía de jefes como \
Red Cloud, Sitting Bull y Crazy Horse, obtienen victorias, entre ellas la de \
Little Bighorn en 1876. Pero la destrucción de los bisontes y la pérdida de las Black Hills los \
obligan a vivir en reservas, donde su religión y su lengua son \
combatidas. En diciembre de 1890, la masacre de Wounded Knee marca el final de este \
período. Los lakota viven hoy sobre todo en las reservas de Dakota del Sur y \
del Norte, como Pine Ridge y Standing Rock."""
style = """
El arte lakota es ante todo un arte de la indumentaria y de los objetos cotidianos: pieles \
pintadas, bordados con púas de puercoespín y luego con cuentas de vidrio, de motivos \
geométricos de rombos, triángulos y cruces. Las mujeres eran las grandes \
artistas; los hombres pintaban los relatos de sus hazañas en las pieles y en las \
camisas."""
