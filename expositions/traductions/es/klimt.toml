[exposition]
ordre = 170
nom_court = "Klimt"
mouvement = "Secesión vienesa"
cadre = "dore"
couleur = "#a8821c"
titre = "Klimt, el oro y la vida"
artiste = "Gustav Klimt"
dates = "1862–1918"
accroche = "Exposición virtual · Gustav Klimt"
introduction = """
En la Viena de 1900, Gustav Klimt funda la Secesión y cubre sus lienzos de oro, de \
espirales y de mosaicos. El beso, Adele Bloch-Bauer, las alegorías de la vida y de la \
muerte: siete lienzos, desde los paisajes del lago Attersee hasta las últimas grandes \
composiciones."""
vitrine = "baiser.jpg"

[musee]
nom = "Belvedere Superior"
ville = "Viena, Austria"
architecte = "Johann Lukas von Hildebrandt"
construction = "1717–1723"
presentation = """
El Belvedere es la residencia de verano que el príncipe Eugenio de Saboya, vencedor de \
los otomanos, hace construir a las puertas de Viena por Johann Lukas von Hildebrandt: \
dos palacios barrocos se responden en los dos extremos de un jardín en terrazas. El \
Belvedere Superior, terminado en 1723, servía para fiestas y recepciones; su pieza \
maestra es el salón de mármol, de dos pisos de altura, con el techo pintado por Carlo \
Carlone. Allí se firma, en 1955, el tratado de Estado que devuelve a Austria su \
soberanía. Pasado a los Habsburgo, el palacio alberga desde 1781 la galería de pintura \
imperial, abierta al público. Presenta hoy el arte austríaco y la mayor colección del \
mundo de cuadros de Klimt, entre ellos El beso, adquirido por el Estado ya en 1908, y \
Judith."""
ici = """
ARTEON conserva de él el salón de mármol y su altura. El vestíbulo, un paso bajo y sin \
obras, se abre al norte al Salón de mármol, de 18 metros de largo y 9 de alto, de \
muros gris lila pálido. Se lo atraviesa para llegar, al oeste, a la Sala I · La \
Secesión y, al este, a la Sala II · El período dorado, dos salas gemelas de 6 metros de \
altura. La visita termina en el propio salón de mármol, donde El beso aguarda al \
fondo, en el muro norte."""

