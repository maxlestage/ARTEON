[[artistes]]
nom = "Gustav Klimt"
vie = "Baumgarten, cerca de Viena, 14 de julio de 1862 – Viena, 6 de febrero de 1918"
biographie = """
Gustav Klimt nace en 1862 en Baumgarten, a las puertas de Viena, segundo de los siete \
hijos de Ernst Klimt, grabador en oro llegado de Bohemia, y de Anna Finster. La \
familia es modesta. A los catorce años ingresa en la Escuela de Artes Decorativas de \
Viena, adonde se une a él su hermano Ernst. Con él y su compañero Franz Matsch, \
funda una compañía de decoradores que obtiene grandes encargos oficiales: techos de \
las escaleras del Burgtheater, pinturas de la gran escalera del Kunsthistorisches \
Museum. En 1892, la muerte de su padre y luego de su hermano Ernst lo trastorna. En \
1897 funda con otros artistas la Secesión vienesa, de la que es primer presidente, \
para abrir Austria al arte moderno europeo. Los grandes lienzos encargados para la \
universidad de Viena, la Filosofía, la Medicina y la Jurisprudencia, desencadenan un \
escándalo: Klimt renuncia al encargo en 1905 y abandona la Secesión. Estos lienzos \
desaparecerán en un incendio en 1945. Se abre entonces el período dorado, con El beso \
y los retratos de mujeres de la alta burguesía, y luego el friso en mosaico del \
palacio Stoclet en Bruselas. Nunca se casa, tiene varios hijos naturales y comparte su \
vida con la diseñadora de moda Emilie Flöge, con quien pasa sus veranos a orillas del \
Attersee. Apoya a los jóvenes artistas, entre los que destaca Egon Schiele. Víctima \
de un ataque en enero de 1918, muere en Viena el 6 de febrero."""
style = """
Formado en una pintura académica muy segura, Klimt supera pronto el realismo \
histórico hacia una pintura en la que el cuerpo humano, modelado con finura, se \
recorta sobre superficies decorativas planas. Su marca más reconocible es el empleo de \
la hoja de oro y de ornamentos tomados de Bizancio, de Egipto, de la Grecia arcaica y \
del arte japonés. Las mujeres, sensuales o inquietantes, y los grandes temas del amor, \
de la vida y de la muerte dominan su obra; sus paisajes cuadrados, por su parte, rozan \
la abstracción. Al borrar la frontera entre pintura y artes decorativas, encarnó el \
Art Nouveau vienés y abrió el camino al expresionismo de Schiele y de Kokoschka."""
