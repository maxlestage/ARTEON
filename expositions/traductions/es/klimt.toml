[[oeuvres]]
titre = "La virgen"
annee = "1913"
image = "la-vierge.jpg"
technique = "Óleo sobre lienzo, 190 × 200 cm"
collection = "Galería Nacional de Praga"
note = "Jóvenes dormidas, enredadas en una espiral de telas de colores: el sueño de una muchacha."
description = """
En el centro de una gran composición casi cuadrada, una joven duerme, con la cabeza \
inclinada, los ojos cerrados y el rostro apacible. A su alrededor, otras jóvenes, \
desnudas o semivestidas, están atrapadas en el mismo torbellino: una se arquea, otras \
se enroscan sobre sí mismas o se acurrucan, otra más parece despertar. Sus cuerpos se \
entremezclan en un inmenso drapeado de colores vivos, violeta, rosa, anaranjado y azul, \
sembrado de flores, de círculos y de espirales, que forma una especie de isla \
flotante. Alrededor, el fondo azul noche, casi negro, no deja adivinar ni suelo ni \
horizonte: el grupo parece suspendido en el vacío, como en el espacio de un sueño, sin \
peso y sin dirección."""
evocation = """
El título orienta la lectura: se ve tradicionalmente a la muchacha dormida en el \
centro y, a su alrededor, sus sueños o las etapas de su despertar a la sensualidad y a \
la vida de mujer. Las poses de las demás figuras, del abandono al repliegue, se han \
entendido como los estados sucesivos de una misma persona, de la inocencia al deseo. El \
sueño, en Klimt, es a menudo un momento de vida interior más que un simple descanso. El \
cuadro refleja la atmósfera de una Viena donde Freud había publicado La interpretación \
de los sueños en 1900 y donde la sexualidad femenina se convertía en tema de estudio y \
de debate. Muestra también a un Klimt que, tras el oro, celebra el color, la juventud \
y la vitalidad del cuerpo."""
histoire = """
Pintada en 1913, La virgen pertenece a los últimos años de Klimt, cuando ha \
abandonado el oro por composiciones muy coloridas. No es un encargo sino una gran \
alegoría, como Muerte y vida, a la que hace eco con su grupo de cuerpos flotando en el \
vacío. En esa fecha, Klimt es un artista reconocido en toda Europa central y expone con \
regularidad fuera de Viena. El cuadro entra después en las colecciones públicas de \
Praga, entonces una de las grandes ciudades de Austria-Hungría: solo después de 1918, \
con el nacimiento de Checoslovaquia, se encuentra en el extranjero. Conservado por la \
Galería Nacional, es una de las pocas grandes alegorías de Klimt visibles fuera de \
Austria y una de las joyas de sus colecciones de arte moderno."""
facture = """
Klimt abandona aquí la hoja de oro en favor de una paleta deslumbrante, en la que \
dominan los violetas, los rosas, los anaranjados y los azules. Los ornamentos ya no \
son geométricos y metálicos sino florales, inspirados en los tejidos y en el arte del \
Extremo Oriente que Klimt coleccionaba. La composición en espiral enrolla los cuerpos \
alrededor de la figura central y los recorta sobre un fondo oscuro casi uniforme, que \
aviva los colores. Los cuerpos, de contornos flexibles, conservan la línea elegante \
heredada de sus innumerables dibujos del natural."""
details = [
  "El rostro apacible de la muchacha dormida, en el centro del torbellino.",
  "Las flores y las espirales que cubren el inmenso drapeado.",
  "El fondo azul noche, sin suelo ni horizonte, donde el grupo parece flotar.",
  "Los brazos y las piernas entremezclados, que cuesta atribuir a cada figura.",
]
themes = ["sueño", "dormir", "juventud", "feminidad", "color"]
anecdote = """
Klimt dibujaba sin descanso a las modelos que posaban en su taller, dormidas, \
tumbadas o abandonadas. Dejó varios miles de dibujos, muchos más que cuadros, y \
muchas de las poses de La virgen proceden de ellos."""
salle = 4
mur = "est"
position = 5
