[[oeuvres]]
titre = "El beso"
annee = "1907–1908"
image = "baiser.jpg"
technique = "Óleo y hoja de oro sobre lienzo, 180 × 180 cm"
collection = "Österreichische Galerie Belvedere, Viena"
note = "Dos amantes abrazados al borde de un prado florido, envueltos en oro: la obra más célebre de Viena."
description = """
Al borde de un pequeño prado florido que se interrumpe de golpe, como al borde de un \
acantilado, una pareja se abraza sobre un fondo de oro moteado. El hombre, coronado de \
hiedra, inclina la cabeza para besar la mejilla de la mujer; su rostro está casi \
enteramente oculto. Ella está arrodillada, con los ojos cerrados, la cabeza echada \
hacia atrás sobre el hombro, una mano sobre la nuca de su compañero y flores en el \
cabello. Sus cuerpos se confunden en una sola forma dorada: la túnica del hombre está \
cubierta de rectángulos negros, blancos y plateados, el vestido de la mujer de \
círculos y de motivos florales coloreados. Los pies desnudos de la mujer, crispados, \
sobresalen del borde del prado, sobre el vacío dorado."""
evocation = """
El beso se ha convertido en la imagen universal del amor, pero es más ambiguo de lo que \
parece. La mujer, con los ojos cerrados, parece a la vez abandonarse y contenerse; sus \
manos y sus pies crispados, al borde del vacío, han hecho hablar de un éxtasis que \
roza el peligro. Los motivos se han leído como símbolos: rectángulos masculinos para el \
hombre, círculos y flores femeninos para la mujer, reunidos en una misma envoltura de \
oro. Se ha querido reconocer a Klimt y a su compañera Emilie Flöge en la pareja, sin \
ninguna prueba. El oro, tomado de los iconos, hace de este abrazo un momento fuera del \
tiempo, casi sagrado. El cuadro resume, en fin, la ambición de la Secesión: unir \
pintura y artes decorativas en una obra de arte total."""
histoire = """
Klimt pinta El beso en 1907-1908, en la cumbre de su período dorado, pocos años \
después de la agotadora querella de las pinturas de la universidad. La obra se presenta \
en 1908 en la Kunstschau, la gran exposición de arte organizada en Viena por Klimt y \
sus amigos tras su salida de la Secesión, con el título «Pareja de enamorados». \
Durante la exposición, el Ministerio de Instrucción Pública la adquiere para la Moderne \
Galerie del Estado, antecesora del Belvedere, por 25 000 coronas, una suma \
considerable. El cuadro no ha abandonado desde entonces las colecciones públicas \
austríacas. Está colgado en el Belvedere Superior, el antiguo palacio del príncipe \
Eugenio de Saboya, donde atrae cada año a visitantes de todo el mundo."""
facture = """
Klimt superpone a la pintura al óleo hoja de oro, aplicada en capas y a veces en leve \
relieve, con una destreza de orfebre. El contraste entre los rostros y las manos, \
pintados con delicadeza, y las vestiduras reducidas a superficies planas de ornamentos \
da la impresión de una aparición. El formato cuadrado, el fondo sin profundidad y la \
silueta de la pareja, reunida en una sola forma alargada, concentran toda la mirada en \
el abrazo. El prado, sembrado de pequeñas flores, recuerda los tapices medievales, \
mientras que el oro evoca los iconos y los mosaicos bizantinos."""
details = [
  "Los dedos de los pies de la mujer, crispados al borde del prado como al borde de un precipicio.",
  "La corona de hiedra del hombre y las flores en el cabello de la mujer.",
  "Los rectángulos negros y blancos de la túnica, opuestos a los círculos coloreados del vestido.",
  "Las manos del hombre que enmarcan el rostro de la mujer y lo vuelven hacia él.",
  "Los finos destellos dorados esparcidos por el fondo, como un polvo de estrellas.",
]
themes = ["amor", "pareja", "oro", "abrazo", "bizantino"]
anecdote = """
Por San Valentín de 2022, el Belvedere dividió una reproducción digital en alta \
definición de El beso en 10 000 fragmentos, vendidos en línea en forma de NFT: una \
manera inesperada de hacer entrar la obra de 1908 en la era digital."""
salle = 4
mur = "nord"
position = 0
