[[oeuvres]]
titre = "Vestido de baile de lentejuelas"
artiste = "Ateliers anonymes des années folles"
annee = "hacia 1926"
image = "robe-de-danse-paillettes.jpg"
licence = "Domaine public"
source = "https://www.rijksmuseum.nl/nl/collectie/BK-1973-370-A"
technique = "Tul negro, crepé de China, lentejuelas; largo 110 cm (probablemente Francia)"
collection = "Rijksmuseum, Ámsterdam"
note = "Un vestido corto, sin mangas, que chorrea lentejuelas negras: la silueta «garçonne» de los años locos."
description = """
El vestido llega a la rodilla. Sin mangas, cae recto desde unos hombros estrechos, con un escote redondo y profundo. Está hecho de tul negro enteramente cubierto de lentejuelas negras y plateadas, cosidas en líneas verticales apretadas, que chorrean como una lluvia de luz. A la altura de las caderas, donde se sitúa la cintura de estos años, un ancho cinturón de flores estilizadas rodea el vestido: grandes corolas rosas, doradas y azules, perfiladas con volutas cobrizas y puntos amarillos, todas hechas de lentejuelas. A los lados, bajo las caderas, dos paños de tul transparente se ensanchan. El dobladillo es recto y está subrayado por una banda de lentejuelas."""
evocation = """
Hacia 1925, la mujer de los años locos, a quien en Francia se llama la «garçonne», se corta el pelo, acorta su vestido hasta la rodilla y borra su cintura. El vestido se convierte en un simple tubo recto, llevado sin corsé, que deja los brazos y las piernas libres para bailar el charlestón y el fox-trot. Lo que pierde en corte, lo gana en brillo: perlas y lentejuelas cubren la tela y centellean a cada movimiento bajo las luces de las salas de baile. El cinturón de flores, de formas perfiladas y colores vivos, pertenece plenamente al Art Déco, celebrado en París con ocasión de la Exposición Internacional de Artes Decorativas de 1925."""
histoire = """
El Rijksmuseum describe este vestido como obra de un taller anónimo, quizá francés, y lo fecha hacia 1926. El museo lo llama «vestido de noche corto o vestido de baile»: el largo a la rodilla y los paños que se abren a los lados estaban hechos para bailar. Ingresó en el Rijksmuseum en 1973, adquirido con el apoyo de una fundación de mecenas, al mismo tiempo que otros vestidos de la década de 1920. Estos vestidos de lentejuelas se producían en gran número, en París y en otros lugares, a menudo bordados en talleres especializados. Su peso y la fragilidad del tul explican que pocos hayan llegado hasta nosotros en buen estado."""
facture = """
El vestido es casi un rectángulo: la ficha del museo lo describe como un modelo de una sola pieza, sin mangas, de cintura baja, con un escote redondo delante y en U en la espalda. Toda la riqueza está en el bordado. Miles de lentejuelas han sido cosidas una a una sobre el tul, en hileras verticales, para alargar la silueta. Las flores del cinturón se construyen con lentejuelas de varios colores, dispuestas en círculos y volutas. El museo señala lentejuelas de materia sintética. Bajo las caderas, dos bandas de tul fruncido, aplicadas a los lados, dan vuelo al bajo del vestido."""
details = [
  "Las hileras verticales de lentejuelas, como una lluvia.",
  "El cinturón de flores de lentejuelas, puesto sobre las caderas.",
  "Las corolas rosas y doradas perfiladas con volutas cobrizas.",
  "Los paños de tul transparente que se ensanchan a los lados.",
  "El escote redondo y los hombros estrechos, sin mangas.",
]
themes = ["años locos", "garçonne", "lentejuelas", "art déco", "baile"]
anecdote = """
La palabra «garçonne» fue popularizada por la novela de Victor Margueritte, La Garçonne, publicada en 1922, cuya heroína vive libremente y lleva el pelo corto. El libro causó escándalo."""
