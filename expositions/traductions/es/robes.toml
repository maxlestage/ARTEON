[[oeuvres]]
titre = "Vestido de noche de decoración geométrica"
artiste = "Ateliers anonymes des années folles"
annee = "1920"
image = "robe-du-soir-1920.jpg"
licence = "Domaine public"
source = "https://www.rijksmuseum.nl/nl/collectie/BK-1973-364"
technique = "Crepé de China y raso de seda, bordado de cordoncillo negro, oro y plata; largo 107 cm (probablemente París)"
collection = "Rijksmuseum, Ámsterdam"
note = "Un vestido recto, rojo y negro, sin cintura marcada: en 1920, el vestido de noche se convierte en una superficie geométrica."
description = """
El vestido es recto, sin cintura marcada, y llega por debajo de la rodilla. La parte superior es de crepé de seda rojo coral, con pequeñas mangas cortas; un cuello de raso negro rodea el escote redondo y se anuda por delante en un lazo. Sobre el pecho, dos bandas bordadas en forma de escalera descienden y terminan en gancho. Más abajo, un gran panel aplicado ocupa el delantero: un enrejado de cordoncillo negro cubre una zona crema, que termina en un borde recortado en almenas, subrayado de oro; bajo él viene una banda de raso negro. Una banda roja, y luego una falda negra, rematan el vestido. A los lados, paños negros caen libremente."""
evocation = """
Al terminar la Primera Guerra Mundial, el vestido cambia de lógica. El cuerpo ya no está esculpido por un corsé: el vestido cae recto desde los hombros, como una túnica, y la decoración sustituye al corte. Aquí, todo es cuestión de superficies y de líneas: escaleras, enrejados, almenas, bandas de colores francos, rojo, negro, crema y oro. El Rijksmuseum vincula esta decoración a un Jugendstil geométrico, el que, de Viena a París, preparó el Art Déco. El vestido ya se acorta, dejando ver la parte baja de las piernas. Este estilo anuncia la silueta de los años locos, plana y rectilínea, que se encontrará, más corta aún, en el vestido de baile vecino."""
histoire = """
Se ignora quién hizo este vestido: el Rijksmuseum lo atribuye a un taller anónimo, quizá parisino, y lo fecha en 1920. El museo de Ámsterdam conserva una importante colección de trajes, en gran parte neerlandeses, que expone por rotación porque la luz daña las telas. El vestido ingresó allí en 1973, adquirido con el apoyo de una fundación de mecenas creada para enriquecer las colecciones del museo. Da testimonio de esos vestidos de noche de la inmediata posguerra, menos conocidos que las grandes creaciones firmadas, pero que muestran cómo una casa de costura o una modista seguía la nueva moda."""
facture = """
El vestido se construye con muy poco corte: según la ficha del museo, es un modelo recto, sin pinzas, hecho de unos pocos grandes paneles de tela. El trabajo reside en el ensamblaje de materias y colores. El crepé de China, flexible y mate, contrasta con el raso negro, liso y brillante. La decoración se obtiene cosiendo planos sobre la tela cordoncillos, pequeños cordones de seda negra, oro y plata, que dibujan las escaleras, el enrejado y el borde almenado: es un bordado en relieve, rápido de ejecutar y muy gráfico. El panel del delantero flota libremente y se mueve con el andar."""
details = [
  "El cuello de raso negro anudado por delante.",
  "Las dos escaleras bordadas que descienden sobre el pecho.",
  "El enrejado negro sobre fondo crema.",
  "El borde almenado, subrayado por un cordoncillo dorado.",
  "Los paños negros que caen a los lados.",
]
themes = ["años veinte", "geometría", "crepé de china", "bordado", "vestido recto"]
anecdote = """
El crepé de China, a pesar de su nombre, no necesita venir de China: es una seda ligera de grano fino, tejida con hilos muy torcidos, que fabricaban en particular los sederos de Lyon."""
