image = "robe-a-tournure.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/157306"
technique = "Algodón y seda (Estados Unidos)"
collection = "Metropolitan Museum of Art, Nueva York (Brooklyn Museum Costume Collection)"
note = "Visto de perfil, el vestido proyecta todo su volumen hacia atrás: es el polisón de la década de 1880, en rayas azul marino."
description = """
El maniquí se ve de perfil. El vestido está cortado en una tela de anchas rayas azul marino y crema. El corpiño, muy ajustado, sube hasta el cuello, donde un cuello recto de seda color ciruela se cierra con un lazo; las mangas largas y estrechas siguen el brazo. Sobre la falda inferior, plisada con pliegues planos, las rayas corren en horizontal. Por encima, una sobrefalda drapeada sube sobre la cadera en gruesos pliegues redondeados y luego se une a la parte trasera. Allí, en la parte baja de la espalda, el vestido forma un saliente casi horizontal, como una repisa, del que cae hasta el suelo un largo paño de rayas verticales. El delantero es plano; todo el volumen está detrás."""
evocation = """
Tras la campana de la crinolina, el vuelo de las faldas se desplaza hacia atrás a partir de finales de la década de 1860. En la de 1880, este «polisón» regresa más rígido y más saliente que nunca: la parte baja de la espalda sobresale como una bandeja. Delante, la falda es plana y estrecha; de perfil, la mujer dibuja una línea arqueada, casi arquitectónica. Las rayas juegan con ello: verticales en el corpiño y el paño trasero, horizontales en la falda plisada, subrayan cada volumen. El azul marino y el crema, el cuello alto y las mangas ceñidas dan a este vestido de día un aire nítido y casi deportivo, que conviene a los paseos y a las temporadas de veraneo."""
histoire = """
Este vestido fue confeccionado en Estados Unidos entre 1885 y 1888; no se conocen ni la modista ni la clienta. Se compone de dos piezas, el corpiño y la falda. Fue donado en 1960 al Brooklyn Museum por H. Dunscombe Colt. En 2009, el Brooklyn Museum confió al Metropolitan Museum toda su colección de trajes, que se conserva desde entonces en el Costume Institute. En esa época, los patrones de costura publicados por los periódicos de moda y la máquina de coser, extendida desde la década de 1850, permiten a muchas mujeres seguir la moda, en casa de una modista o en la suya propia."""
facture = """
La forma no se sostiene sola: bajo la falda, la mujer ata a su cintura un polisón, pequeño cojín relleno o armazón de láminas de acero, que proyecta la parte trasera del vestido. La modista drapeó luego la sobrefalda alrededor de ese volumen, recogiendo la tela con puntadas ocultas para formar los gruesos pliegues de la cadera. El juego de las rayas exige un corte preciso: la misma tela se corta al hilo para el corpiño y el paño trasero, y al bies para la falda plisada, de modo que las rayas cambien de sentido de una pieza a otra. El corpiño, forrado y con ballenas, se cierra por delante."""
details = [
  "El cuello recto de seda color ciruela, cerrado con un lazo.",
  "El saliente del polisón, en la parte baja de la espalda.",
  "Las rayas horizontales de la falda plisada.",
  "El largo paño de rayas verticales que cae por detrás.",
  "Los gruesos pliegues drapeados sobre la cadera.",
]
themes = ["polisón", "rayas", "drapeado", "década de 1880", "silueta"]
anecdote = """
Algunos polisones de la década de 1880 estaban hechos de láminas de acero articuladas, que se replegaban al sentarse y recuperaban su forma al levantarse."""
