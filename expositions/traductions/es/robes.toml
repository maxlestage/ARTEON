[exposition]
ordre = 69
nom_court = "Vestidos"
mouvement = "El vestido, de la corte de Jorge II a los años locos"
cadre = "vitrine"
couleur = "#9c4f6e"
titre = "Vestidos, la silueta y la tela"
artiste = "Casa Worth, modistas anónimas…"
dates = "hacia 1750–hacia 1926"
accroche = "Exposición virtual · Fashion Museum, Assembly Rooms, Bath"
introduction = """
En menos de dos siglos, el vestido cambia varias veces de forma por completo. Hacia 1750, armado sobre un miriñaque, es más ancho que alto; hacia 1810, cae recto desde el pecho; hacia 1835, son las mangas las que se hinchan; hacia 1858, la falda se vuelve campana; hacia 1886, todo el vuelo pasa a la espalda; en 1926, el vestido llega a la rodilla y ya no marca la cintura. Esta exposición sigue diez vestidos, del vestido de corte inglés al vestido de baile de lentejuelas de los años locos, mirando lo que hace cada silueta: las armazones ocultas debajo, el corte y las telas, sedas brocadas, algodones estampados, tules, rasos, crepés. Ocho proceden del Costume Institute del Metropolitan Museum de Nueva York, dos del Rijksmuseum de Ámsterdam. El edificio se inspira en las Assembly Rooms de Bath, salones de baile del siglo XVIII que albergaron durante mucho tiempo el museo de la moda de la ciudad."""
vitrine = "robe-de-cour.jpg"

[musee]
nom = "Fashion Museum, Assembly Rooms de Bath"
ville = "Bath, Inglaterra"
architecte = "John Wood el Joven"
construction = "1769–1771"
presentation = """
En el siglo XVIII, Bath, ciudad balnearia del oeste de Inglaterra, es el punto de encuentro de la buena sociedad, que acude a tomar las aguas, bailar, jugar a las cartas y dejarse ver. El arquitecto John Wood el Joven, a quien se debe también el Royal Crescent, levanta allí de 1769 a 1771 nuevos salones de reunión, las Assembly Rooms, llamadas también «Upper Rooms». Tras una fachada sobria de piedra rubia se suceden un inmenso salón de baile, un salón de té, un salón octogonal y, algo más tarde, una sala de juego. Jane Austen lleva allí a las heroínas de La abadía de Northanger y de Persuasión. Incendiadas durante un bombardeo en 1942, las salas se restauran y reabren en 1963. Ese mismo año, la colección de trajes reunida por la historiadora de la moda Doris Langley Moore se instala en el sótano: es el museo del Traje, convertido más tarde en el Fashion Museum, una de las grandes colecciones de moda de Europa. Desde entonces ha dejado las Assembly Rooms para preparar un nuevo emplazamiento en la ciudad."""
ici = """
El edificio de ARTEON retoma la sucesión de las Assembly Rooms en torno a su salón octogonal. Se entra por el sur en «El vestíbulo», de muros de piedra rubia, que conduce a «El Octógono», donde dos vestidos del siglo XVIII reciben al visitante. Al oeste se extiende «El salón de baile», de treinta y cuatro metros de largo y diez de alto, donde cuatro vestidos cuentan las siluetas del siglo XIX, del Imperio al polisón. Al este, «El salón de té» reúne dos vestidos de la casa Worth; al norte, «La sala de juego», más íntima, acoge dos vestidos de los años locos."""

