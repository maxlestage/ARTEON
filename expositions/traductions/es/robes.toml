[[oeuvres]]
titre = "Vestido de té"
artiste = "Maison Worth"
annee = "1894"
image = "robe-de-the-worth.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/159189"
technique = "Seda labrada, seda y algodón, encaje; casa Worth, París"
collection = "Metropolitan Museum of Art, Nueva York (Brooklyn Museum Costume Collection)"
note = "Un vestido para recibir en casa a la hora del té: amplio, con cola, en una seda labrada plateada de la casa Worth."
description = """
El maniquí, peinado con rizos recogidos, está de perfil, con un abanico pintado a mano. Su vestido parece caer de los hombros al suelo en una sola capa, sin cintura marcada, y se alarga por detrás en una cola que se extiende en pliegues. La tela, plateada y crema, está cubierta por un motivo repetido de palmetas en abanico, tejidas en la seda. Los hombros están cubiertos por un ancho cuello de encaje crudo; las mangas, muy hinchadas hasta el codo, se adornan con lazos de cinta verde pálido y crema. Por la abertura del delantero se vislumbra una seda lisa verde agua. Unos guantes blancos suben hasta el codo."""
evocation = """
El vestido de té aparece en la década de 1870 en Inglaterra y Francia. Es un vestido de interior que se lleva a última hora de la tarde para recibir, en torno al té, a amigos íntimos, entre el atuendo de día y el de la cena. Más libre que los vestidos de ciudad, se lleva con un corsé menos apretado y cae con soltura desde los hombros: evoca los vestidos amplios de los pintores prerrafaelitas y el gusto artístico de aquella época. Sin embargo, en Worth sigue siendo un vestido de lujo, hecho de una seda preciosa y adornado con encaje. Las mangas hinchadas, de moda en 1894, recuerdan que, pese a todo, sigue la silueta de su tiempo."""
histoire = """
Charles Frederick Worth, inglés establecido en París, fundó su casa en la rue de la Paix en 1858 e inventó el oficio de gran modisto: presenta sus modelos sobre maniquíes vivos y firma sus vestidos con una etiqueta. En 1894, un año antes de su muerte, sus hijos Gaston y Jean-Philippe dirigen ya en gran medida la casa. Este vestido fue donado al Brooklyn Museum en 1931 por la princesa Viggo, conforme al deseo de las señoritas Hewitt, Sarah y Eleanor, fundadoras del museo de diseño convertido en el Cooper Hewitt de Nueva York. Con la colección de trajes del Brooklyn Museum, se conserva desde 2009 en el Costume Institute del Metropolitan Museum."""
facture = """
La casa Worth trabaja en estrecha relación con los sederos de Lyon, que tejen para ella telas labradas con motivos a menudo dibujados expresamente. Aquí, el motivo de palmetas, en hilos claros sobre un fondo más oscuro, está tejido en la tela y cambia de brillo según la luz. El corte en largos paneles, sin cintura marcada, deja que la seda caiga de los hombros a la cola, para que el motivo siga siendo continuo. El forro verde agua, visible por delante, crea un contraste de color. Las mangas están montadas con frunces sobre el hombro, y el encaje del cuello está aplicado a mano."""
details = [
  "El motivo de palmetas en abanico, tejido en la seda.",
  "El ancho cuello de encaje crudo sobre los hombros.",
  "Los lazos de cinta verde pálido en las mangas.",
  "La seda verde agua que se vislumbra por la abertura del delantero.",
  "La cola que se extiende en pliegues sobre el suelo.",
]
themes = ["vestido de interior", "worth", "seda labrada", "encaje", "belle époque"]
anecdote = """
La hora del té de la tarde, el «afternoon tea», se difunde en Inglaterra a mediados del siglo XIX. Se atribuye a menudo su invención a Anna, duquesa de Bedford, que encontraba demasiado largo el tiempo entre el almuerzo y la cena."""
