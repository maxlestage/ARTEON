[[oeuvres]]
titre = "Vestido de corte"
artiste = "Couturières anonymes"
annee = "hacia 1750"
image = "robe-de-cour.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/82426"
technique = "Seda e hilos metálicos, llevado sobre amplios miriñaques (Inglaterra)"
collection = "Metropolitan Museum of Art, Nueva York (Costume Institute)"
note = "Un vestido más ancho que alto: en la corte de Inglaterra, la seda azul bordada de plata se extiende sobre unos miriñaques desmesurados."
description = """
Visto de frente, el vestido forma un rectángulo casi perfecto, mucho más ancho que alto. Encima, un busto estrecho: el corpiño, muy ajustado, se abre en cuadrado sobre el pecho, y su pieza central está bordada con una gran estrella de follajes plateados. Las mangas terminan en el codo con vueltas ribeteadas de plata, de las que salen volantes de encaje blanco. A cada lado de la cintura, la falda parte en horizontal, sostenida por los miriñaques, y luego cae a plomo hasta el suelo. Sobre la seda azul pálido se esparcen lunares y ramilletes plateados. Todo el bajo de la falda está cubierto por una ancha cenefa de plata, hecha de ramas y flores sobre un fondo de redecilla, que acaba en festones a ras del suelo."""
evocation = """
Este vestido no está hecho para la vida diaria, sino para presentarse ante el rey. En la corte de Inglaterra, bajo Jorge II, las mujeres se presentan con un vestido de ceremonia cuyos miriñaques son más anchos que los de la moda de ciudad. La falda se convierte en un gran panel de aparato, una superficie plana donde se pueden desplegar la tela y sus bordados como un cuadro. La plata, que brilla a la luz de las velas, dice la riqueza de quien lo lleva. El cuerpo, en cambio, casi desaparece: solo se ve un busto delgado puesto sobre un inmenso pedestal. En la corte británica, estos miriñaques seguirán siendo de rigor hasta comienzos del siglo XIX, mucho después de que la moda los abandonara."""
histoire = """
Como casi todos los vestidos del siglo XVIII, este es anónimo. Fue confeccionado en Inglaterra hacia mediados del siglo, en una época en que el barrio londinense de Spitalfields es el gran centro de la sedería inglesa; una modista lo cosió y luego lo adornó con bordados y encajes de metal. Se ignora para qué dama de la corte se hizo. Se conserva en varias piezas: vestido, falda y peto. El Metropolitan Museum lo adquirió en 1965 gracias al legado de Irene Lewisohn, una de las fundadoras del museo neoyorquino de arte del traje del que nació el Costume Institute. Los vestidos de corte de aquella época, a menudo cortados para reutilizar la seda y la plata, rara vez han llegado enteros hasta nosotros."""
facture = """
La silueta depende de la armazón oculta bajo la falda: unos miriñaques, hechos de aros de junco, de ballena o de metal, atados a la cintura y que se proyectan a cada lado sobre las caderas. Para cubrir semejante anchura, la falda está hecha de numerosos paños enteros de seda, cosidos uno junto a otro: se ven las costuras verticales en el delantero. La decoración metálica combina dos técnicas. Los pequeños motivos están esparcidos sobre la tela, mientras que la gran cenefa del bajo es un encaje de hilos de plata, aplicado sobre la seda. El delantero del corpiño es un peto aparte, prendido o cordado sobre el cuerpo con ballenas."""
details = [
  "La gran estrella de follajes bordada sobre el peto.",
  "Los volantes de encaje blanco que salen de las mangas a la altura del codo.",
  "Las costuras verticales de los paños de seda de la falda.",
  "La cenefa de plata festoneada en el bajo de la falda.",
  "Los lunares plateados esparcidos con regularidad sobre el fondo azul.",
]
themes = ["siglo xviii", "corte", "miriñaques", "plata", "inglaterra"]
anecdote = """
Con tales miriñaques había que cruzar las puertas de lado y sentarse con precaución. Algunos miriñaques eran articulados: se podían levantar los costados para pasar con más facilidad."""
salle = 2
mur = "nord"
place = 1
largeur = 1.9

[[oeuvres]]
titre = "Vestido a la inglesa de rayas"
artiste = "Couturières anonymes"
annee = "1785–1787"
image = "robe-a-l-anglaise.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/81105"
technique = "Tafetán de seda rayado, con pañuelo de gasa (Francia)"
collection = "Metropolitan Museum of Art, Nueva York (Costume Institute)"
note = "Rayas rosas y blancas, una espalda ajustada, ya sin miriñaques: en vísperas de la Revolución, el vestido se simplifica."
description = """
El maniquí se ve de tres cuartos. El vestido está cortado en una seda de rayas verticales rosa salmón y crema, que siguen el cuerpo desde el pecho hasta el suelo. El corpiño, bien ajustado, desciende en punta hasta la cintura; las mangas, largas y estrechas, terminan un poco por encima de la muñeca con una pequeña vuelta. Sobre los hombros y el pecho, un gran pañuelo de gasa blanca, guarnecido de volantes, se hincha como una gorguera y se cruza por delante. El vestido se abre sobre una falda de la misma seda, guarnecida a media altura con dos hileras de volantes fruncidos. Detrás, el vuelo se lleva hacia la parte baja de la espalda y el vestido arrastra ligeramente por el suelo, donde asoma un zapato de cuero claro."""
evocation = """
En la década de 1780, la moda francesa se apasiona por Inglaterra, su vida en el campo, sus paseos y sus telas sencillas. El vestido «a la inglesa» es su signo: abandona los anchos miriñaques y los pliegues sueltos en la espalda de los vestidos a la francesa. El cuerpo vuelve a ser visible, con una cintura fina y una falda redondeada por detrás gracias a un pequeño cojín. Las rayas, muy de moda en vísperas de la Revolución, alargan la silueta. El gran pañuelo de gasa, hinchado sobre el pecho, da la línea abombada de esos años, la que se ve en los retratos de Élisabeth Vigée Le Brun. Es un vestido de ciudad y de paseo, más flexible que el traje de corte."""
histoire = """
El vestido fue confeccionado en Francia entre 1785 y 1787, en una época en que las modistas de París, como Rose Bertin, proveedora de María Antonieta, lanzan las nuevas guarniciones. No se conocen ni el nombre de la modista ni el de la clienta. El vestido y su falda se conservan juntos. El Metropolitan Museum los adquirió en 1966, gracias al legado de Irene Lewisohn, como el vestido de corte presentado a su lado. Las rayas de la seda son lo bastante anchas para que se siga fácilmente el corte de cada pieza, lo que lo convierte en un valioso testigo de cómo se construía un vestido a finales del siglo XVIII."""
facture = """
Lo que distingue al vestido a la inglesa es su espalda: en lugar de caer libremente desde los hombros, la seda está cortada y cosida lo más cerca del cuerpo hasta la cintura, y luego se abre en pliegues para formar la falda. La modista ha jugado con las rayas. En el corpiño y las mangas siguen la longitud del cuerpo; en los volantes de la falda, fruncidos muy apretados, se estrechan y cambian de ritmo. El tafetán, ligero y algo rígido, conserva bien la forma de los volantes. Debajo, un corsé con ballenas afina la cintura, y un pequeño cojín atado a los riñones sostiene la parte trasera de la falda."""
details = [
  "Las rayas rosa salmón y crema, que siguen el cuerpo.",
  "El gran pañuelo de gasa blanca, hinchado sobre el pecho.",
  "Las dos hileras de volantes fruncidos de la falda.",
  "La punta del corpiño en la cintura.",
  "El zapato de cuero claro que asoma bajo el dobladillo.",
]
themes = ["siglo xviii", "anglomanía", "rayas", "tafetán", "paseo"]
anecdote = """
El pañuelo abombado de esos años, que hinchaba el pecho como una chorrera, fue apodado «pañuelo mentiroso»: daba al busto una plenitud que no siempre tenía."""
salle = 2
mur = "nord"
place = 3
largeur = 1.4

[[oeuvres]]
titre = "Vestido de noche de seda amarilla"
artiste = "Couturières anonymes"
annee = "hacia 1810"
image = "robe-du-soir-empire.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/82154"
technique = "Seda (Francia)"
collection = "Metropolitan Museum of Art, Nueva York (Costume Institute)"
note = "Una columna de un amarillo resplandeciente: bajo el Imperio, la cintura sube bajo el pecho y la seda vuelve a los salones."
description = """
El vestido, de un amarillo oro intenso, cae casi recto desde lo alto del pecho hasta el suelo. La cintura está situada muy alta, justo bajo los senos, y marcada por una estrecha banda clara, trabajada como un bordado. Encima, el pequeño corpiño está fruncido en finas nervaduras verticales, cortadas por dos galones más claros; el escote, ancho y redondeado, deja al descubierto la parte alta de los hombros. Las mangas son cortos globos hinchados, hechos de dos bullones superpuestos. La falda, lisa y sin un adorno, se ensancha apenas hacia abajo y toca el suelo. Bajo la luz, la seda deja ver ligeras rayas horizontales, debidas al tejido, y algunas manchas debidas al tiempo."""
evocation = """
Hacia 1800, las elegantes han adoptado el vestido columna, inspirado en las estatuas antiguas, la mayoría de las veces de muselina de algodón blanca. Hacia 1810, la línea sigue siendo la misma, pero el color regresa. Bajo el Imperio, Napoleón fomenta las sederías de Lyon, que habían sufrido con la Revolución, y la corte imperial retoma el lujo de las telas. Este amarillo franco, que se lleva por la noche, debía resplandecer a la luz de las velas. La silueta, por su parte, libera el cuerpo: ya no hay miriñaques ni cintura estrangulada, sino una línea vertical que alarga a la mujer y deja adivinar su forma. Bajo el vestido, un corsé corto sostiene solo el pecho."""
histoire = """
El vestido fue confeccionado en Francia hacia 1810, sin duda por una modista parisina cuyo nombre se desconoce. Se compone de varias piezas, conservadas juntas. El Metropolitan Museum lo adquirió en 1937 con cargo al Rogers Fund, uno de los grandes fondos de adquisición del museo, antes incluso de que el Costume Institute se incorporase al Metropolitan en 1946. Los vestidos de seda de color de esta época son más raros que los vestidos de muselina blanca: sus tintes, sensibles a la luz, a menudo se han desvaído, y muchos fueron recortados para seguir la moda. Este ha conservado un amarillo muy vivo."""
facture = """
El corte es sencillo y económico: unos pocos paños rectos de seda forman la falda, algo más anchos en la espalda, y se fruncen bajo el pecho sobre la banda de la cintura. Todo el trabajo se concentra en el corpiño. La seda se frunce allí en nervaduras paralelas, sujetas con costuras, lo que la hace pegarse al busto sin pinzas. Las mangas están hechas con dos bandas de seda fruncidas una encima de otra, para obtener dos pequeños bullones. La banda clara de la cintura, como los galones del corpiño, aporta un toque de luz sobre el amarillo liso."""
details = [
  "La banda clara de la cintura, justo bajo el pecho.",
  "Las finas nervaduras fruncidas del corpiño.",
  "Las mangas de dos bullones superpuestos.",
  "Las ligeras rayas del tejido, visibles en la falda.",
  "La ausencia de todo adorno en la falda.",
]
themes = ["imperio", "cintura alta", "seda", "amarillo", "neoclasicismo"]
anecdote = """
Los vestidos de esta época, de cintura tan alta, se llaman a menudo en inglés «Regency», por la regencia del futuro Jorge IV, de 1811 a 1820: son los que llevan las heroínas de Jane Austen en los salones de Bath."""
salle = 3
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Vestido de mangas de pernil"
artiste = "Couturières anonymes"
annee = "1832–1835"
image = "robe-a-manches-gigot.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/159123"
technique = "Algodón estampado y lino (Estados Unidos)"
collection = "Metropolitan Museum of Art, Nueva York (Brooklyn Museum Costume Collection)"
note = "Hombros inmensos y una cintura devuelta a su sitio: la silueta romántica en algodón estampado de ramilletes."
description = """
El vestido está hecho de un algodón claro estampado con ramilletes de flores rosas, rojas y verdes, esparcidos entre grandes volutas crema punteadas de pequeños puntos. El escote, muy amplio, deja al descubierto la parte alta de los hombros; el corpiño está fruncido en pliegues que convergen hacia el centro, y se ajusta a la cintura con un cinturón de la misma tela. Las mangas son enormes: hinchadas como globos del hombro al codo, se estrechan luego a lo largo del antebrazo y se cierran en la muñeca con un pequeño volante. La falda, fruncida en la cintura, se redondea ampliamente y llega a la altura del tobillo. Vista de frente, la silueta dibuja dos triángulos que se unen en la cintura."""
evocation = """
Tras la columna del Imperio, la cintura vuelve a su lugar natural hacia 1825, y todo se ensancha a su alrededor: los hombros, gracias a las mangas, y la falda, sostenida por enaguas. La cintura parece así más fina todavía. Es la moda de los años románticos, la de las heroínas de Balzac y las litografías de moda de París, que circulan hasta América. El nombre de «pernil» viene de la forma de la manga, que recuerda un pernil de cordero. Hacia 1835, estas mangas alcanzan su mayor amplitud; ya en 1836 se desinflan y el vuelo desciende hacia la parte baja del brazo. Este vestido capta, pues, la moda en su cima."""
histoire = """
Este vestido fue confeccionado en Estados Unidos a comienzos de la década de 1830, para una mujer cuyo nombre se ignora. Muestra que la moda llegada de Europa se seguía de cerca en América, donde se recibían los periódicos de moda parisinos y londinenses. Fue donado en 1990 al Brooklyn Museum por Mrs. Harold N. Weber. En 2009, el Brooklyn Museum confió al Metropolitan Museum toda su colección de trajes, desde entonces conservada en el Costume Institute. Los vestidos de algodón de este tipo, llevados de día, se lavaban y se gastaban: han llegado a nosotros con menos frecuencia que los vestidos de seda de las grandes ocasiones."""
facture = """
La tela cuenta tanto como el corte. A principios del siglo XIX, la estampación con rodillo de cobre permite imprimir el algodón en continuo, mucho más deprisa que con plancha de madera: los algodones floreados se vuelven asequibles para un amplio público. Aquí, el fondo crema, las volutas y los ramilletes de varios colores suponen varias pasadas. El corte de las mangas exige mucha tela: cada una está cortada en una pieza ancha redondeada en la parte alta, fruncida en el hombro y luego ajustada sobre el antebrazo. Para que conservaran su forma, a veces se deslizaban debajo almohadillas rellenas de plumón."""
details = [
  "Las mangas hinchadas hasta el codo y luego ceñidas sobre el antebrazo.",
  "Los frunces del corpiño que convergen hacia el centro.",
  "Los ramilletes de flores rosas y rojas esparcidos sobre el fondo claro.",
  "Las volutas crema punteadas de pequeños puntos.",
  "El pequeño volante que cierra cada muñeca.",
]
themes = ["romanticismo", "mangas de pernil", "algodón estampado", "flores", "américa"]
anecdote = """
Las mangas de estos años eran tan anchas que a veces se sostenían desde dentro con pequeños cojines o armazones atados al hombro, para evitar que se cayeran."""
salle = 3
mur = "nord"
place = 4
largeur = 1.25

[[oeuvres]]
titre = "Vestido de baile de tul con miriñaque de aros"
artiste = "Couturières anonymes"
annee = "1856–1859"
image = "robe-de-bal-a-crinoline.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/126927"
technique = "Seda y tul de seda, encaje negro, llevado sobre una crinolina (América o Europa)"
collection = "Metropolitan Museum of Art, Nueva York (Costume Institute)"
note = "Una nube de tul marfil cruzada de encaje negro: la crinolina de acero permite faldas de baile inmensas y ligeras."
description = """
El vestido forma una enorme campana, cuya falda toca el suelo por todo su contorno. El corpiño, ceñido y en punta en la cintura, deja los hombros desnudos: lo atraviesan bandas de tul fruncido, cada una ribeteada con un fino encaje negro, que forman una ancha berta. Las mangas son simples bullones de tul. Sobre la falda, el tul marfil cae en velos transparentes sobre un fondo de seda. El bajo está cubierto de numerosos volantes escalonados, también ribeteados de encaje negro, que dibujan líneas horizontales alrededor del vestido. Por encima, una gran banda de tul dibuja un zigzag en forma de M, como una guirnalda puesta sobre la falda."""
evocation = """
Hacia 1856, un invento cambia la silueta: la crinolina-jaula, hecha de aros de acero flexibles unidos por cintas. Sustituye a las gruesas enaguas de crin y almidón y permite faldas más anchas que nunca, pero ligeras. Los vestidos de baile se benefician de ello: se superponen metros de tul y de gasa, que parecen flotar alrededor de la bailarina. El contraste del marfil y el negro, el encaje en zigzag y los volantes dan movimiento a una forma que sin embargo es fija. Es la época del Segundo Imperio en Francia, de los bailes de las Tullerías en torno a la emperatriz Eugenia y de los valses de Strauss en Viena: la falda de campana gira a cada paso."""
histoire = """
El Metropolitan Museum describe este vestido como americano o europeo: su lugar exacto de fabricación no se conoce, como tampoco el nombre de la modista. El tul de seda se fabricaba entonces a máquina en Francia e Inglaterra, y los vestidos de baile seguían de cerca la moda de París, a ambos lados del Atlántico. El vestido, en dos piezas, corpiño y falda, fue donado al Costume Institute en 1969 por Mary Pierrepont Beckwith, junto con otros vestidos de baile del siglo XIX. Un tul tan fino es muy frágil: que haya llegado hasta nosotros en tan buen estado es raro para un vestido de esta época."""
facture = """
Un vestido así se construye por capas. Debajo, la crinolina da la forma; encima, una enagua de seda oculta los aros; luego vienen los velos de tul, montados con frunces sobre la cintura. Los volantes del bajo están hechos de bandas de tul fruncidas y cosidas en hileras apretadas, cada una ribeteada con un encaje negro de bolillos o a máquina. El gran zigzag es una banda aplicada, prendida y luego cosida sobre la falda. El corpiño, en cambio, es sólido: forrado y con ballenas, lleva la berta de tul como una gorguera y ciñe la cintura en punta, lo que hace parecer la falda aún más ancha."""
details = [
  "La berta de tul fruncido, ribeteada de encaje negro, sobre los hombros.",
  "La punta del corpiño que se hunde en la falda.",
  "El gran zigzag de encaje negro puesto sobre la falda.",
  "Los volantes escalonados del bajo, como olas regulares.",
  "La transparencia del tul marfil sobre el fondo de seda.",
]
themes = ["segundo imperio", "crinolina", "tul", "baile", "encaje"]
anecdote = """
La palabra «crinolina» viene del crin de caballo, que se tejía con lino para atiesar las enaguas. El nombre se ha conservado para la jaula de acero que las sustituyó."""
salle = 3
mur = "nord"
place = 7
largeur = 1.5

[[oeuvres]]
titre = "Vestido de polisón de rayas"
artiste = "Couturières anonymes"
