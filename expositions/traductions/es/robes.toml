[[artistes]]
nom = "Couturières anonymes"
vie = "Inglaterra, Francia y Estados Unidos, siglos XVIII–XIX"
biographie = """
Hasta mediados del siglo XIX, los vestidos no llevan el nombre de quien los hizo. En París, Luis XIV concede en 1675 a las modistas el derecho a formar su propia corporación y a vestir a las mujeres; en Inglaterra, la «mantua-maker» desempeña el mismo papel. Un vestido nace entonces del trabajo de varios oficios: el mercader vende la seda, a menudo tejida en Lyon o en Spitalfields, la modista corta y ensambla, la comerciante de modas añade cintas, encajes y galones. Algunos nombres han atravesado el tiempo, como Rose Bertin, comerciante de modas de María Antonieta. En el siglo XIX, las modistas trabajan en un taller o en casa de sus clientas, a partir de los grabados de los periódicos de moda, que difunden la moda de París hasta América. La máquina de coser, extendida a partir de la década de 1850, y los patrones publicados por los periódicos aceleran su trabajo. Sus nombres se han perdido casi todos: sus vestidos, guardados en las familias y donados luego a los museos, siguen siendo su única firma."""
style = """
Su arte sigue reglas colectivas, fijadas por la corte y luego por los periódicos de moda, y no por un único creador. Se basa en un conocimiento íntimo de las telas, que se cortan lo menos posible y que se vuelven a montar al compás de las modas, y en un saber hacer transmitido de taller en taller: ajustar un corpiño, montar una falda sobre miriñaques, una crinolina o un polisón, colocar una guarnición."""

[[artistes]]
nom = "Maison Worth"
vie = "París, 1858 – 1956"
biographie = """
La casa fue fundada en 1858 en el número 7 de la rue de la Paix, en París, por Charles Frederick Worth, un inglés nacido en 1825 en Lincolnshire, formado en casas de tejidos de Londres y luego en Gagelin en París, asociado primero con el sueco Otto Bobergh. Gracias a la princesa de Metternich, se convierte en el modisto de la emperatriz Eugenia y de la corte del Segundo Imperio, luego de las cortes de Europa, de las actrices y de las ricas estadounidenses. Presenta sus modelos sobre mujeres vivas y firma sus vestidos con una etiqueta: así inventa el oficio de gran modisto. A su muerte, en 1895, le suceden sus hijos: Gaston dirige la empresa, Jean-Philippe dibuja los modelos. La generación siguiente, con Jean-Charles Worth, retoma la casa en el siglo XX. Hostigada por nuevos modistos, la casa se une a la de Paquin en 1954 y cierra poco después, en 1956, tras casi un siglo de actividad."""
style = """
El estilo Worth se basa en sederías suntuosas, a menudo tejidas en Lyon a partir de dibujos encargados para la casa, y en cortes de gran precisión. Worth hace evolucionar la silueta de temporada en temporada, de la crinolina al polisón; sus hijos prolongan ese lujo en la Belle Époque, con vestidos de baile bordados y vestidos de interior de telas labradas."""

[[artistes]]
nom = "Ateliers anonymes des années folles"
vie = "Francia, años veinte"
biographie = """
En la década de 1920, París sigue siendo la capital de la moda. Junto a las grandes casas de costura, cuyos nombres son conocidos, trabajan una multitud de casas pequeñas, de modistas y de talleres especializados, bordadores, plumistas, fabricantes de perlas y de lentejuelas, que abastecen a toda la profesión. Tras la Primera Guerra Mundial, el vestido se simplifica: recto, sin corsé, cada vez más corto, se presta a una decoración aplicada en plano, bordados geométricos, perlas o lentejuelas. Estos vestidos, a menudo vendidos al extranjero o copiados de los modelos parisinos, rara vez han conservado su etiqueta. Los museos, como el Rijksmuseum de Ámsterdam, los conservan bajo el nombre de talleres anónimos, indicando solo su origen probable. Muestran, sin embargo, toda la audacia de la moda de los años locos, la de la garçonne, el jazz y el Art Déco."""
style = """
Su estilo es el del Art Déco: líneas rectas, motivos geométricos, colores francos, brillo de las perlas y las lentejuelas. El corte se reduce al mínimo, unos pocos paneles de tela sin pinzas, y toda la riqueza pasa a la decoración y a las materias, crepé de China, raso y tul."""
