[[oeuvres]]
titre = "Vestido de baile de espigas de trigo"
artiste = "Maison Worth"
annee = "1900"
image = "robe-de-bal-worth.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/155944"
technique = "Raso de seda bordado, strass, encaje y tul; casa Worth, París"
collection = "Metropolitan Museum of Art, Nueva York (Brooklyn Museum Costume Collection)"
note = "Un raso rosa por el que suben espigas bordadas y con lentejuelas: un vestido de baile de la casa Worth en el año 1900."
description = """
El vestido es de raso rosa pálido, liso y brillante. El corpiño, muy ajustado, desciende en punta sobre el delantero de la falda; el escote, asimétrico, está velado de tul gris pálido y ribeteado de un encaje crudo que forma también las pequeñas mangas. La falda, lisa sobre las caderas, se ensancha hacia abajo en corola y se extiende por detrás en una larga cola. En el delantero, dos grandes tallos bordados suben del dobladillo hacia la cintura, cargados de espigas de trigo doradas; otras espigas atraviesan el corpiño en diagonal y se dispersan sobre la cola. Los bordados centellean: hay strass prendidos entre los hilos dorados."""
evocation = """
En 1900, el año de la Exposición Universal de París, el vestido de baile está en la cumbre del lujo. La silueta es la de la Belle Époque: busto adelantado, cintura estrecha, falda pegada a las caderas y ensanchada abajo, como una flor invertida. Las espigas de trigo, motivo de la naturaleza y de la cosecha, responden al gusto del Art Nouveau por las plantas, pero aquí se dibujan con gran regularidad. El rosa pálido y el oro, bajo la iluminación eléctrica que llega a los salones de baile, debían brillar con mil destellos. Un vestido así se lleva solo unas pocas noches, para los grandes bailes de la temporada, en París, Londres o Nueva York."""
histoire = """
Tras la muerte de Charles Frederick Worth en 1895, la casa pasa a sus hijos: Gaston se ocupa de la gestión, Jean-Philippe de la creación. La casa viste entonces a las cortes de Europa y a la alta sociedad estadounidense, cuyas clientas cruzan el Atlántico para encargar su guardarropa en París. Este vestido fue donado al Brooklyn Museum en 1957 por la sucesión de Mrs. Arthur F. Schermerhorn, de una gran familia neoyorquina. Se compone de dos piezas, el corpiño y la falda. En 2009, con toda la colección de trajes del Brooklyn Museum, se incorporó al Costume Institute del Metropolitan Museum."""
facture = """
El raso, tejido para que la seda flote en la superficie, da esa luz lisa y continua, que el bordado viene a interrumpir. Las espigas están bordadas a mano con hilos dorados, con strass que atrapan la luz; sus tallos, en largas líneas curvas, guían la mirada de abajo hacia la cintura. La falda está hecha de paños cortados en punta, estrechos arriba y anchos abajo, para pegarse a las caderas y luego abrirse. El corpiño está montado sobre un forro con ballenas. El tul gris y el encaje del escote, drapeados en diagonal, suavizan la línea nítida del raso."""
details = [
  "Los dos grandes tallos de espigas bordados en el delantero de la falda.",
  "Las espigas puestas en diagonal sobre el corpiño.",
  "El encaje crudo de las pequeñas mangas.",
  "El tul gris pálido que vela el escote.",
  "La cola de raso, sembrada también de espigas.",
]
themes = ["belle époque", "baile", "worth", "bordado", "raso"]
anecdote = """
Las clientas de la casa Worth venían a veces de muy lejos: las ricas estadounidenses hacían el viaje a París para encargar de una sola vez los vestidos de toda una temporada."""
