[[oeuvres]]
titre = "Stańczyk"
artiste = "Jan Matejko"
annee = "1862"
image = "stanczyk.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jan_Matejko_-_Stańczyk_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 88 × 120 cm"
collection = "Museo Nacional de Varsovia"
note = "Durante un baile en la corte, el bufón del rey permanece solo, abatido: acaba de enterarse de la pérdida de Smolensk."
description = """
En una sala sombría del castillo real, un hombre vestido de rojo de pies a cabeza, tocado con un gorro de bufón con cascabeles, se desploma en un gran sillón de madera. Con las piernas estiradas y las manos cruzadas sobre el vientre, mira fijamente el suelo, con el rostro cerrado. Sobre la mesa que tiene a su izquierda, cubierta con un tapete bordado, hay una carta abierta entre otros papeles. Detrás, una ventana se abre a la noche: se adivinan las torres de la catedral del Wawel y, en el cielo, un cometa. A la derecha, por una puerta abierta, se ve una sala iluminada: cortesanos con trajes de fiesta bailan y ríen. En el suelo, delante del bufón, yace su cetro de bufón, el bastón con cabeza de loco que ha dejado caer."""
evocation = """
Stańczyk, bufón de los reyes Jagellón a comienzos del siglo XVI, había quedado en la memoria polaca como un sabio disfrazado de loco. Matejko hace de él el único hombre lúcido de la corte: mientras los demás bailan, ha comprendido que la pérdida de Smolensk, tomada por Moscú en 1514, anuncia la decadencia del reino. El cometa, presagio de desgracia, y el cetro abandonado dicen lo mismo. Pintado en 1862, cuando Polonia está repartida entre sus vecinos, en vísperas de la insurrección de enero de 1863, el cuadro se dirige a los contemporáneos: contrapone la despreocupación de las élites a la dolorosa conciencia de la historia. Matejko dio al bufón sus propios rasgos, como si se reconociera en ese testigo impotente."""
histoire = """
Matejko tiene veinticuatro años cuando pinta este lienzo en Cracovia; le hace famoso. Su título completo lo sitúa durante un baile en la corte de la reina Bona, lo cual es inexacto: en 1514, Bona Sforza aún no se había casado con el rey Segismundo I, y la carta que hay sobre la mesa lleva además la fecha de 1533, una contradicción que los historiadores siguen discutiendo. La Sociedad de Amigos de las Bellas Artes de Cracovia compra el cuadro para su lotería; un ganador llamado Korytko lo conserva. El Museo Nacional de Varsovia lo adquiere en 1924. Saqueado por los nazis durante la Segunda Guerra Mundial y confiscado después por la Unión Soviética, no regresa a Polonia hasta hacia 1956. En 2024-2025, el Louvre lo expuso en la muestra «Figuras del loco»."""
facture = """
Matejko construye su cuadro en dos espacios opuestos: a la izquierda, la penumbra en la que se encuentra el bufón; a la derecha, la sala de baile, luminosa y difusa. El rojo del traje, casi monocromo, se recorta sobre el verde profundo de la cortina y el marrón de las maderas. El pintor describe con esmero las texturas, el tapete bordado de la mesa, la madera tallada del sillón, el papel arrugado, pero deja a los bailarines en una vaporosa bruma. Esta puesta en escena teatral, heredada de la pintura de historia de Múnich, busca hacer reflexionar tanto como conmover."""
details = [
  "La carta con el sello rojo sobre la mesa, que anuncia la mala noticia.",
  "El cometa en el cielo nocturno, junto a las torres de la catedral.",
  "El cetro del bufón, abandonado en el suelo, a la derecha.",
  "Las manos cruzadas de Stańczyk, inertes, en el centro exacto del cuadro.",
  "Los bailarines difusos de la sala contigua, en una luz dorada.",
]
themes = ["historia", "bufón", "polonia", "presagio", "soledad"]
anecdote = """
En 1869, jóvenes conservadores de Cracovia publican panfletos satíricos con el título «La carpeta de Stańczyk» (Teka Stańczyka). Su bando político, influyente en Galitzia durante décadas, conservará el nombre de «stańczycy»."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Sobre la tumba de un combatiente de Dios (El último taborita)"
artiste = "Mikoláš Aleš"
annee = "1877"
image = "dernier-taborite.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Ales_U_hrobu.jpg"
technique = "Óleo sobre lienzo, 48 × 75,5 cm"
collection = "Galería Nacional de Praga"
note = "En la nieve, un viejo jinete husita se detiene ante una tumba, mientras a lo lejos arde una aldea."
description = """
Una llanura cubierta de nieve se extiende bajo un cielo bajo, gris y dorado. En el centro, un jinete montado en un caballo pardo se ha detenido. Lleva coraza, un manto raído y un gorro de piel; su larga lanza, adornada con una banderola, se alza hacia el cielo. Con las manos juntas sobre el pomo de la silla, inclina la cabeza, y su caballo también, con el hocico casi en la nieve. Delante de él, una gran roca cubierta de nieve y dos cruces de madera inclinadas marcan unas tumbas. A la izquierda, a lo lejos, pasa una tropa armada; a la derecha, a su espalda, arden unas casas y sube el humo. Pájaros negros revolotean sobre la llanura. El cuadro está firmado y fechado abajo a la derecha."""
evocation = """
Los «combatientes de Dios» son los husitas, partidarios del reformador Jan Hus, quemado en Constanza en 1415; los taboritas formaban su ala más radical, derrotada en 1434 en la batalla de Lipany. El título convierte a este jinete en el último superviviente de una causa perdida, que viene a recogerse ante la tumba de un compañero. En la Bohemia de 1877, gobernada desde Viena, el pasado husita se había convertido en un símbolo nacional, el de un pueblo capaz de alzarse por su fe y su lengua. Aleš no muestra su gloria sino su duelo: la imagen de una fidelidad que sobrevive a la derrota, en un paisaje invernal donde todo parece acabado."""
histoire = """
Aleš pinta este pequeño cuadro en 1877, poco después de dejar la Academia de Bellas Artes de Praga, en una época en que vive con estrechez. Es también el año en que prepara, con František Ženíšek, sus proyectos para la decoración del Teatro Nacional, la gran obra de los artistas checos de su generación. Sus lienzos de historia, sombríos y meditativos, encuentran entonces pocos compradores, y Aleš se volverá cada vez más hacia el dibujo y la ilustración, que harán su popularidad. La obra pertenece hoy a la Galería Nacional de Praga, que conserva un amplio conjunto de sus pinturas y de sus dibujos."""
facture = """
En este formato modesto, Aleš trabaja una gama restringida: el blanco azulado de la nieve, los grises y los dorados del cielo, los marrones del caballo y del jinete. El cielo está pincelado con anchas pinceladas visibles, casi como un boceto, mientras que el arnés, la coraza y la lanza se describen con precisión. La silueta oscura del caballo, recortada sobre la nieve, carga con toda la emoción. Se percibe en ella al dibujante, que piensa en contornos nítidos, y la herencia romántica de los paisajes de invierno."""
details = [
  "La cabeza baja del caballo, que parece compartir el duelo de su amo.",
  "Las dos cruces de madera inclinadas, medio enterradas en la nieve.",
  "La aldea en llamas en el horizonte, a la derecha.",
  "La tropa armada que se aleja a lo lejos, a la izquierda.",
  "La firma «M. Aleš 1877», abajo a la derecha.",
]
themes = ["husitas", "invierno", "duelo", "bohemia", "jinete"]
anecdote = """
El coral de los husitas, «Vosotros que sois los combatientes de Dios» (Ktož jsú boží bojovníci), resuena también en Mi patria de Bedřich Smetana: el compositor lo cita en los poemas sinfónicos Tábor y Blaník, escritos en la misma época que este cuadro."""
salle = 2
mur = "sud"
place = 4
largeur = 1.1

[[oeuvres]]
titre = "Los eslavos en su patria de origen (La epopeya eslava, I)"
artiste = "Alfons Mucha"
annee = "1912"
image = "slaves-patrie-origine.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Slovane_v_pravlasti_81x61m.jpg"
technique = "Temple al huevo y óleo sobre lienzo, 610 × 810 cm"
collection = "Ciudad de Praga"
note = "La primera de los veinte lienzos de la Epopeya eslava: una pareja de eslavos se esconde en la noche, mientras arde una aldea."
description = """
Bajo un inmenso cielo estrellado, una llanura se extiende en la noche. En primer plano, abajo a la izquierda, un hombre y una mujer vestidos de blanco se agazapan entre la maleza: se estrechan el uno contra el otro, y uno de ellos fija al espectador con unos ojos agrandados por el miedo. Detrás de ellos, jinetes armados empujan ante sí rebaños robados, y en el horizonte, a la izquierda, arde una aldea. A la derecha, como una aparición suspendida en el cielo, un sacerdote pagano barbudo, con el torso desnudo y coronado, abre los brazos de par en par. Una espada dorada cuelga de su cintura. Lo sostienen dos figuras: un joven por un lado, y una muchacha con flores azules por el otro. Sus largas telas blancas caen hasta la maleza."""
evocation = """
El subtítulo del lienzo, «Entre el látigo turaniano y la espada de los godos», resume la visión de Mucha: los primeros eslavos, pueblo pacífico de cultivadores y pastores, atrapados entre los nómadas llegados del este y los guerreros germánicos. La pareja oculta, a la que se ha llamado el Adán y la Eva de los eslavos, encarna el sufrimiento de todo un pueblo. En el cielo, el sacerdote implora a los dioses; según la interpretación habitual, el joven representa la guerra justa, defensiva, y la muchacha la paz. Mucha, que se había hecho célebre en París con sus carteles, quería contar la historia de los pueblos eslavos para darles confianza en su porvenir. La obra mezcla así realismo y visión mística."""
histoire = """
La idea de una gran epopeya de los eslavos madura en Mucha a comienzos del siglo XX. En 1909 obtiene el apoyo del mecenas estadounidense Charles Richard Crane, y en 1910 alquila una parte del castillo de Zbiroh, en Bohemia, para pintar allí sus lienzos gigantes. Este, el primero del ciclo, se termina en 1912. Los once primeros lienzos se muestran en el Clementinum de Praga en 1919; el ciclo completo de veinte lienzos se presenta en 1928 en el Palacio de Exposiciones y se dona a la ciudad de Praga, con la condición de que construya un pabellón para albergarlo. Escondida durante la guerra, la Epopeya se expone a partir de 1963 en el castillo de Moravský Krumlov, y después en Praga y en el extranjero."""
facture = """
Mucha pinta al temple de huevo, con toques de óleo, sobre un lienzo de más de seis metros por ocho. Adopta una gama apagada de azules, grises y malvas, de la que estallan los blancos de las vestiduras y el naranja del incendio. La composición superpone dos mundos: abajo, una escena realista, pintada a partir de modelos a los que hacía posar y fotografiaba; arriba, una visión luminosa, casi transparente. Las estrellas, aplicadas con pequeños toques, dan profundidad al cielo. Se reconoce al dibujante del Art Nouveau en las largas telas que caen como cintas."""
details = [
  "Los ojos desorbitados de uno de los dos fugitivos, que miran directamente hacia nosotros.",
  "La aldea en llamas, en el horizonte izquierdo.",
  "Los jinetes que se llevan los rebaños, en el centro.",
  "El sacerdote suspendido en el cielo, con los brazos abiertos, a la derecha.",
  "La espada dorada que cuelga de la cintura del sacerdote.",
]
themes = ["epopeya", "eslavos", "noche", "mitología", "nación"]
anecdote = """
Los veinte lienzos de la Epopeya eslava ocuparon a Mucha casi dieciocho años, de 1910 a 1928. Como el pabellón prometido no llegó a construirse en vida del artista, el ciclo ha conocido desde entonces numerosos traslados entre Praga y Moravia."""
salle = 2
mur = "nord"
place = 3
largeur = 4.5

[[oeuvres]]
titre = "La celda del condenado I"
artiste = "Mihály Munkácsy"
annee = "1870"
image = "cellule-du-condamne.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Munkácsy,_Mihály_-_Condemned_Cell_I_-_Google_Art_Project.jpg"
technique = "Óleo sobre tabla, 139 × 193,5 cm"
collection = "Galería Nacional Húngara, Budapest"
note = "La víspera de su ejecución, un bandolero húngaro recibe la visita de los aldeanos: el cuadro que hizo famoso a Munkácsy en el Salón de París."
description = """
En una celda abovedada, de muros de piedra desnuda, la luz cae de una pequeña ventana enrejada. En el centro derecha, un hombre con bigote, camisa blanca y chaleco oscuro está sentado ante una mesa cubierta con un mantel blanco, donde arden dos velas. Con el codo apoyado en la mesa, mira al frente con aire duro y ausente. Tras él, un soldado monta guardia, con fusil de bayoneta. A la derecha, una mujer de negro llora, con la frente contra el muro, y una niña con falda roja está junto a ella. A la izquierda, aldeanos han venido a ver al condenado: hombres con sombrero, una anciana, una muchacha con una cesta, una madre con su bebé. En primer plano, un muchacho se acerca con las manos juntas; en el suelo hay una escudilla."""
evocation = """
El personaje principal es un betyár, uno de esos bandoleros de la Gran Llanura húngara. Tras el fracaso de la guerra de independencia de 1848-1849, muchos jóvenes se habían echado al monte, y el pueblo veía a menudo en ellos a héroes más que a criminales. La ley permitía al condenado recibir a sus allegados y a los curiosos antes de la ejecución. Munkácsy no dice si este hombre es inocente o culpable: toda la fuerza del cuadro reside en esa incertidumbre, y en la variedad de las reacciones, piedad, curiosidad, oración, desesperación. Se ha visto en él una crítica social, nutrida del realismo francés, y una meditación sobre la muerte y la justicia."""
histoire = """
Munkácsy pinta este cuadro en Düsseldorf, donde estudia con el pintor de género Ludwig Knaus; es su primera obra importante. Expuesto en el Salón de París en 1870, llama allí mucho la atención y vale al joven pintor de veintiséis años una medalla y, después, una fama inmediata. Un coleccionista estadounidense lo compra poco después de terminarlo, y el lienzo parte hacia los Estados Unidos. Munkácsy, instalado en París desde 1871, retomó el tema en otras versiones. Casi un siglo más tarde, el Estado húngaro adquiere esta primera versión a un coleccionista privado; se expone en la Galería Nacional Húngara, en el castillo de Buda."""
facture = """
Munkácsy pinta sobre un panel de madera, sobre un fondo muy oscuro del que las figuras emergen en toques de luz: camisas blancas, mantel, rostros. Su paleta parda, casi negra, es típica de sus comienzos; le gustaba el betún, un pigmento que da a las sombras un terciopelo profundo. La composición dispone a los personajes como en un escenario de teatro, en semicírculo en torno al condenado, cada uno con un gesto que cuenta su emoción. La pincelada, ancha y vigorosa, rompe con el acabado liso de los pintores académicos."""
details = [
  "Las dos velas encendidas sobre el mantel blanco, junto al condenado.",
  "La mujer de negro que llora contra el muro, a la derecha.",
  "El muchacho de manos juntas, en primer plano.",
  "La escudilla en el suelo, quizá para recoger limosnas.",
  "La luz que cae de la ventana enrejada, arriba en el centro.",
]
themes = ["realismo", "prisión", "muerte", "hungría", "pueblo"]
anecdote = """
El betún, que Munkácsy empleaba de buen grado para sus sombras, nunca llega a secar del todo: con el tiempo, ennegrece y agrieta la pintura. Muchos de sus lienzos se han oscurecido así, y plantean hoy difíciles problemas de restauración."""
salle = 3
mur = "sud"
place = 2
largeur = 1.95

[[oeuvres]]
titre = "El ataque de Smârdan"
artiste = "Nicolae Grigorescu"
annee = "1885"
image = "attaque-smardan.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Nicolae_Grigorescu_-_Atacul_de_la_Smardan_-_Muzeul_National_de_Arta_al_Romaniei.jpg"
technique = "Óleo sobre lienzo, 295 × 388 cm"
collection = "Museo Nacional de Historia de Rumanía, Bucarest"
note = "Enero de 1878: entre la nieve y el humo, la infantería rumana asalta un reducto otomano."
description = """
Una llanura nevada desaparece bajo un cielo gris y un espeso humo de pólvora. De derecha a izquierda, una línea de infantes rumanos se lanza al ataque, con la bayoneta calada, inclinados hacia delante. Llevan capotes grises y gorros negros con pompón rojo. En primer plano a la derecha, un soldado más alto que los demás avanza con paso decidido, con el fusil apretado contra sí. A lo lejos, a la izquierda, a través del humo, se distinguen las manchas rojas de los fez de los soldados otomanos que defienden la posición. En primer plano, un soldado muerto yace boca arriba en la nieve, con su fusil a su lado; más lejos, un gorro caído y otro cuerpo. Ningún general, ninguna bandera: solo hombres en el frío."""
evocation = """
La toma de Smârdan, cerca de Vidin, en Bulgaria, el 12 de enero de 1878 según el calendario juliano entonces en uso (el 24 según el nuestro), es uno de los últimos combates de la guerra de independencia rumana contra el Imperio otomano. Rumanía había proclamado su independencia en mayo de 1877; será reconocida en el congreso de Berlín en 1878. Grigorescu hace de ella una imagen fundacional de la nación, pero una imagen sin énfasis: el héroe es colectivo y anónimo, y la muerte está en primer plano. El ímpetu de los soldados y el cuerpo tendido en la nieve dicen juntos el precio de la libertad. El cuadro se ha convertido en un icono de la memoria nacional rumana."""
histoire = """
En 1877, Grigorescu es uno de los cuatro pintores oficiales enviados al frente con el ejército rumano, junto con Carol Popp de Szathmari, Sava Henția y George Demetrescu Mirea. Llena allí cuadernos de bocetos de soldados, heridos y prisioneros. De regreso en el taller, saca de ellos varios cuadros de batalla, entre ellos este gran lienzo terminado en 1885. Existen réplicas posteriores. El original pertenece al Museo Nacional de Historia de Rumanía, en Bucarest. Ausente de las salas durante más de veinte años, el lienzo volvió a presentarse allí en 2023-2024, tras una importante restauración, en una exposición dedicada a los pintores de la guerra de independencia."""
facture = """
Grigorescu, formado junto a los pintores de Barbizon, trata la batalla como un paisaje de atmósfera: la nieve, el humo y el cielo se funden en una misma gama de grises azulados, en la que solo los pompones y los fez ponen puntos rojos. El movimiento lo da la diagonal de la línea de soldados, que sube de derecha a izquierda, y la silueta del gran infante en primer plano. La pincelada es rápida, casi esbozada en la lejanía, más precisa en las figuras cercanas, alimentadas por los bocetos hechos en el frente."""
details = [
  "El soldado muerto en primer plano, tendido boca arriba, con el fusil a su lado.",
  "El gorro negro con pompón rojo caído en la nieve.",
