[[oeuvres]]
titre = "El veranillo de San Martín (Babie lato)"
artiste = "Józef Chełmoński"
annee = "1875"
image = "babie-lato.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Józef_Chełmoński_-_Indian_summer_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 119,7 × 156,5 cm"
collection = "Museo Nacional de Varsovia"
note = "Tendida en un prado otoñal, una joven pastora juega con los hilos de la Virgen que flotan en el aire."
description = """
Una joven campesina yace boca arriba en un prado de hierba rasa, sobre una tela extendida. Lleva una larga falda y una camisa blancas, un pañuelo amarillo, un collar en un cordón oscuro y un anillo. Descalza, con los ojos entornados, levanta el brazo derecho y sostiene con la punta de los dedos largos hilos de araña plateados que el viento se lleva. Cerca de su mano izquierda yace su látigo de pastora, un palo provisto de una cuerda. Detrás de ella, un perro negro está sentado y vigila el rebaño. El horizonte, muy bajo, corta el cuadro: se ven vacas moteadas, pardas y blancas, y algunas siluetas de campesinos. Encima, un gran cielo gris azulado, en parte cubierto, ocupa más de la mitad del lienzo."""
evocation = """
En polaco, babie lato designa a la vez el veranillo de San Martín, esos últimos días hermosos del otoño, y los hilos de la Virgen, los filamentos que las jóvenes arañas dejan flotar en el aire en esta estación. Chełmoński capta un momento de pereza y de ensoñación: la pastora olvida el rebaño, y el mundo parece suspendido. El cuadro nace de un viaje del pintor a Ucrania, en los confines orientales de la antigua Polonia, en la primavera y el verano de 1874. Muestra el campo sin idealizarlo: la joven es una verdadera campesina, de pies sucios, sorprendida en un abandono casi sensual. Esa franqueza fue lo que escandalizó a una parte del público de la época."""
histoire = """
Chełmoński pinta el cuadro en Varsovia y lo presenta a la venta a comienzos de 1875 en la Sociedad de Fomento de las Bellas Artes, la Zachęta. El crítico Lucjan Siemieński se burla de él en el periódico Czas: la escena de los hilos de la Virgen es poética, escribe, pero habría que haber lavado los pies de la joven. El pintor se lleva el lienzo a París y luego lo vende, probablemente hacia 1885, al conde Ignacy Korwin-Milewski. El Museo Nacional de Varsovia lo compra en 1924. Llevado por los alemanes a Austria al final de la guerra, se recupera en 1945 en el castillo de Fischhorn y regresa a Varsovia en 1946."""
facture = """
Chełmoński, formado en Varsovia y luego en Múnich, pinta con un espíritu naturalista. Su paleta es apagada, hecha de marrones, grises y verdes amortiguados; solo el blanco de la falda, trabajado en empaste espeso, y el amarillo del pañuelo iluminan el lienzo. El horizonte muy bajo deja al cielo un espacio inmenso, pincelado con toques ligeros. La figura, vista en escorzo, con los pies hacia nosotros, se estira en diagonal a lo largo de todo el cuadro. Los hilos de araña están trazados con un pincel finísimo, casi invisibles."""
details = [
  "Los hilos de la Virgen, casi invisibles, entre los dedos de la joven.",
  "El perro negro sentado, que vigila el rebaño en su puesto.",
  "Los pies descalzos y polvorientos, en primer plano a la izquierda.",
  "El látigo de pastora junto a su mano izquierda.",
  "La firma «Józef Chełmoński 1875», abajo a la izquierda.",
]
themes = ["otoño", "campesina", "ensoñación", "campo", "realismo"]
anecdote = """
El 29 de septiembre de 1944, durante el levantamiento de Varsovia, el cuadro sirvió un tiempo para tapar una ventana del museo. El director Stanisław Lorentz, que lo anotó en su diario, lo hizo descolgar y ponerlo a salvo."""
salle = 3
