[[artistes]]
nom = "Jan Matejko"
vie = "Cracovia, 24 de junio de 1838 – Cracovia, 1 de noviembre de 1893"
biographie = """
Nacido en Cracovia, entonces ciudad libre pronto anexionada por Austria, Jan Matejko es hijo de un profesor de música checo y de una madre de origen germano-polaco. Estudia en la Escuela de Bellas Artes de Cracovia y después, brevemente, en Múnich y en Viena. De regreso en su ciudad, ya casi no la abandonará. Stańczyk, en 1862, le da a conocer; siguen El sermón de Skarga (1864) y Rejtan (1866), que causa escándalo al mostrar la responsabilidad de la nobleza en los repartos de Polonia. En 1873 asume la dirección de la Escuela de Bellas Artes de Cracovia, donde forma, entre otros, a Jacek Malczewski y a Stanisław Wyspiański. Sus inmensos lienzos, La batalla de Grunwald (1878) y El homenaje prusiano (1882), que ofrece a la nación, hacen de él el pintor de la historia polaca, en una época en que el país ha desaparecido del mapa. Muere en Cracovia en 1893."""
style = """
Matejko inventa una pintura de historia a la vez espectacular y reflexiva: multitudes inmensas, trajes y objetos descritos con precisión de arqueólogo, colores intensos, y rostros que juzgan la historia tanto como la viven. Anima sus lienzos con anacronismos deliberados para transmitir un mensaje a los polacos de su tiempo. Su imaginería ha moldeado durante generaciones la memoria nacional polaca."""

[[artistes]]
nom = "Mikoláš Aleš"
vie = "Mirotice (Bohemia), 18 de noviembre de 1852 – Praga, 10 de julio de 1913"
biographie = """
Nacido en una familia modesta del sur de Bohemia, Mikoláš Aleš ingresa en la Academia de Bellas Artes de Praga a finales de la década de 1860 y la deja a mediados de la de 1870, sin gran apoyo. Vive mucho tiempo en la pobreza. En 1877 gana con František Ženíšek el concurso para la decoración del vestíbulo del Teatro Nacional, símbolo del despertar checo; concibe allí el ciclo La patria, pero la obra le acarrea muchos contratiempos. Sus cuadros de historia se venden mal, y se vuelve hacia el dibujo: ilustraciones de canciones populares, de cuentos y de libros infantiles, dibujos para los periódicos satíricos, cartones para los esgrafiados y las pinturas que adornan numerosas fachadas de Praga y de Bohemia. Poco a poco, sus jinetes husitas, sus campesinos y sus héroes legendarios se hacen familiares a todos los checos. Muere en Praga en 1913."""
style = """
Aleš es ante todo un dibujante: trazo vivo y flexible, siluetas nítidas, una estilización que toma prestado del arte popular. Sus pinturas, a menudo de pequeño formato, son meditativas y melancólicas. Forjó una imaginería nacional checa, de los husitas a los pastores, que se encuentra en los libros, en los muros de las casas y hasta en las escuelas."""

[[artistes]]
nom = "Alfons Mucha"
vie = "Ivančice (Moravia), 24 de julio de 1860 – Praga, 14 de julio de 1939"
biographie = """
Nacido en Moravia, Alfons Mucha trabaja primero como pintor de decorados de teatro en Viena y después estudia en Múnich gracias a un protector. En 1887 se instala en París, sigue los cursos de la Academia Julian y vive de ilustraciones. A finales de 1894, el cartel que dibuja para Gismonda, con Sarah Bernhardt, le hace célebre de la noche a la mañana; la actriz lo contrata. Sus carteles, sus paneles decorativos y sus joyas hacen de él una de las figuras del Art Nouveau. En la Exposición Universal de 1900 decora el pabellón de Bosnia-Herzegovina. Pasa después varias temporadas en los Estados Unidos, donde encuentra al mecenas de su gran proyecto, la Epopeya eslava, que pinta en Bohemia de 1910 a 1928. Después de 1918 diseña los primeros sellos y billetes de Checoslovaquia. Detenido e interrogado por la Gestapo en 1939, muere unos meses más tarde en Praga."""
style = """
Mucha es conocido por sus mujeres de cabelleras ondulantes, rodeadas de aureolas y de arabescos, dibujadas con un trazo flexible y coloreado en tonos suaves: el «estilo Mucha» del Art Nouveau. En la Epopeya eslava, pone ese sentido decorativo al servicio de una pintura de historia monumental y visionaria, donde la luz y el símbolo cuentan tanto como el relato."""

[[artistes]]
nom = "Mihály Munkácsy"
vie = "Munkács (act. Mukáchevo, Ucrania), 20 de febrero de 1844 – Endenich (Bonn), 1 de mayo de 1900"
biographie = """
Nacido Michael Lieb en una familia de origen alemán, Munkácsy adopta más tarde el nombre de su ciudad natal. Huérfano muy joven, es aprendiz de carpintero antes de poder estudiar pintura, en Pest, y después en Viena, en Múnich y en Düsseldorf. La celda del condenado, premiada con medalla en el Salón de París en 1870, le hace célebre. Instalado en París en 1871, se casa con la viuda de un barón y mantiene en la avenida de Villiers un salón frecuentado por todo el París mundano. El marchante Charles Sedelmeyer organiza el éxito internacional de sus grandes lienzos: Milton dictando El paraíso perdido (1878), y después la trilogía de Cristo, Cristo ante Pilato (1881), Gólgota (1884) y Ecce Homo (1896), que recorren Europa y América. Pinta también La conquista de Hungría para el nuevo Parlamento de Budapest. Aquejado de una grave enfermedad nerviosa, muere en un asilo cerca de Bonn en 1900."""
style = """
Munkácsy une el realismo de Courbet y la tradición del cuadro de género de Düsseldorf: escenas populares o bíblicas puestas en escena como en el teatro, fondos oscuros de los que surgen rostros expresivos. Su paleta parda, a menudo con betún, se aclara en sus paisajes y en sus salones parisinos. Fue el pintor húngaro más célebre de su siglo."""

[[artistes]]
nom = "Nicolae Grigorescu"
vie = "Pitaru (Valaquia), 15 de mayo de 1838 – Câmpina, 21 de julio de 1907"
biographie = """
Nacido en una aldea de Valaquia, Nicolae Grigorescu aprende el oficio de pintor de iconos en Bucarest. Todavía adolescente, pinta imágenes para iglesias y monasterios, entre ellos el de Agapia, en Moldavia. En 1861, una beca le permite partir a París. Pasa poco tiempo en la Escuela de Bellas Artes y prefiere el bosque de Fontainebleau, donde descubre a los pintores de Barbizon y la pintura al aire libre. De regreso en Rumanía, expone con éxito y viaja mucho. En 1877 sigue al ejército rumano durante la guerra de independencia como pintor oficial, y trae de ella bocetos y cuadros de batalla. Reparte después su vida entre Francia y Rumanía, y luego se instala en Câmpina, al pie de los Cárpatos, donde muere en 1907. La Academia Rumana lo había elegido miembro de honor en 1899. Se le considera el fundador de la pintura rumana moderna."""
style = """
Grigorescu aprendió en Barbizon a pintar la luz y el aire. Sus campesinas, sus pastores, sus carros de bueyes por caminos polvorientos, pintados con una pincelada rápida y clara, fijaron la imagen del campo rumano. Sus cuadros de guerra conservan la misma sensibilidad a la atmósfera. Su retrato figura hoy en el billete rumano de diez lei."""

[[artistes]]
nom = "Józef Chełmoński"
vie = "Boczki, cerca de Łowicz, 7 de noviembre de 1849 – Kuklówka, 6 de abril de 1914"
biographie = """
Nacido en una familia de pequeña nobleza de Mazovia, Józef Chełmoński crece en el campo, entre los caballos y los campesinos que pintará toda su vida. Estudia en Varsovia con Wojciech Gerson y después en la Academia de Múnich, a partir de 1872. De regreso en Varsovia, comparte un taller en el hotel Europejski con otros jóvenes pintores y viaja a Ucrania, cuyas estepas lo inspiran. En 1875 parte hacia París, donde permanece más de diez años: sus escenas del campo polaco y ucraniano, sus tiros lanzados al galope, como El tiro de cuatro (Czwórka, 1881), cosechan éxito en el Salón y entre los marchantes. En 1887 regresa a Polonia y pronto se instala en Kuklówka, una aldea de Mazovia, donde vive retirado y pinta en adelante paisajes, aves y cielos. Allí muere en 1914."""
style = """
Chełmoński es el gran pintor realista del campo polaco: caballos fogosos, campesinos trabajando o descansando, llanuras inmensas bajo grandes cielos. Su pintura, al principio parda y enérgica, se apacigua en sus últimos años en paisajes contemplativos, perdices en la nieve, grullas y cigüeñas, donde la naturaleza se vuelve casi sagrada."""

[[artistes]]
nom = "Pál Szinyei Merse"
vie = "Szinyeújfalu (act. Eslovaquia), 4 de julio de 1845 – Jernye, 2 de febrero de 1920"
biographie = """
Procedente de una antigua familia noble de la Alta Hungría, Pál Szinyei Merse ingresa en 1864 en la Academia de Bellas Artes de Múnich, donde sigue los cursos de Alexander von Wagner y después de Karl von Piloty. Allí se une a Wilhelm Leibl, que lo anima a pintar al aire libre, y deja la Academia en 1869 para trabajar solo. Picnic en mayo, pintado en 1873, es recibido con incomprensión. Casado ese mismo año, acaparado por preocupaciones de dinero y de familia, desanimado por la crítica, deja de pintar en 1882 y no retoma la pintura hasta una decena de años después. En 1894, una retrospectiva organizada por sus amigos revela por fin su importancia. Elegido diputado en 1896, defiende la reforma de la enseñanza artística y preside a partir de 1905 la Escuela Superior de Bellas Artes de Budapest, donde apoya a los jóvenes pintores de la colonia de Nagybánya. Muere en Jernye en 1920."""
style = """
Szinyei es el primer pintor húngaro del plein air: pone unos junto a otros colores puros y luminosos, verdes y rojos francos, para devolver el resplandor del sol. Llegado a esta pintura clara al mismo tiempo que los impresionistas, pero sin ellos, conserva un dibujo más construido, heredado de Múnich. Es el precursor de la pintura moderna en Hungría."""

[[artistes]]
nom = "Tivadar Csontváry Kosztka"
vie = "Kisszeben (act. Sabinov, Eslovaquia), 5 de julio de 1853 – Budapest, 20 de junio de 1919"
biographie = """
Tivadar Kosztka, hijo de un médico farmacéutico, se hace él mismo farmacéutico. En 1880, cuenta, una voz le anuncia que será el mayor pintor de la ruta del sol, mayor que Rafael. Trabaja todavía largos años en su propia farmacia para reunir el dinero necesario y luego, pasados los cuarenta, parte a estudiar pintura a Múnich, en la escuela de Simon Hollósy, en 1894, y brevemente a París. Viaja después sin descanso en busca de temas grandiosos: Dalmacia, Italia, Grecia, Egipto, Palestina y el Líbano, donde pinta Baalbek y El cedro solitario en 1906 y 1907. Adopta el nombre de Csontváry. Sus exposiciones en París en 1907 y después en Budapest solo encuentran burlas. Aislado, cada vez más extraño, casi deja de pintar después de 1910 y muere en Budapest en 1919."""
style = """
Csontváry es inclasificable: sus lienzos gigantes, pintados en colores saturados e irreales, con una precisión obsesiva, son visiones de lugares sagrados o cargados de historia. Ni impresionista ni académico, se le ha acercado a los pintores ingenuos y a los expresionistas. Redescubierto tras su muerte, es hoy uno de los pintores más queridos de Hungría; un museo le está dedicado en Pécs."""

[[artistes]]
nom = "Jacek Malczewski"
vie = "Radom, 15 de julio de 1854 – Cracovia, 8 de octubre de 1929"
biographie = """
Nacido en Radom, en la Polonia bajo dominación rusa, Jacek Malczewski pasa parte de su juventud en el campo, en casa de un tío. En 1873 ingresa en la Escuela de Bellas Artes de Cracovia, donde es alumno de Jan Matejko, y después reside en París en 1876-1877 y frecuenta la Escuela de Bellas Artes. Sus primeros grandes cuadros relatan el destino de los deportados polacos en Siberia, inspirados en el poema Anhelli de Juliusz Słowacki. En 1884 participa en una expedición arqueológica en Asia Menor. Hacia 1890, su arte vira hacia el simbolismo: Melancolía, luego El círculo vicioso, y una multitud de cuadros poblados de quimeras, de faunos, de ángeles y de figuras de la muerte, donde se representa a menudo a sí mismo. Profesor en la Academia de Bellas Artes de Cracovia, se convierte en su rector en 1912. Muere en Cracovia en 1929; su hijo Rafał Malczewski será también pintor."""
style = """
Malczewski es el gran maestro del simbolismo polaco. Mezcla figuras pintadas con un realismo minucioso, campesinos, insurgentes, autorretratos, con criaturas mitológicas, en paisajes luminosos del campo polaco. Sus colores vivos y su dibujo sólido sirven a alegorías sobre la patria, el arte y la muerte, a menudo enigmáticas."""

[[artistes]]
nom = "Olga Boznańska"
vie = "Cracovia, 15 de abril de 1865 – París, 26 de octubre de 1940"
biographie = """
Hija de un ingeniero polaco y de una madre francesa, Olga Boznańska aprende pintura en Cracovia en cursos privados, pues la Escuela de Bellas Artes no admite a mujeres. En 1886 parte a Múnich, donde estudia en talleres privados y pronto abre el suyo. Sus retratos son allí notados y expuestos en Europa. En 1898 se instala en París, en un taller del bulevar du Montparnasse que ya no abandonará. Miembro de la Sociedad Nacional de Bellas Artes, expone por toda Europa y en los Estados Unidos, y recibe la Legión de Honor. Sigue, sin embargo, apegada a Polonia y envía regularmente sus obras a las exposiciones de Cracovia y de Varsovia. Pinta sobre todo retratos, pero también interiores, flores y vistas de París tomadas desde su ventana. Sus últimos años, en un taller abarrotado, están marcados por la soledad y las dificultades materiales. Muere en París en 1940."""
style = """
Boznańska es ante todo retratista. Pinta a menudo sobre cartón, con toques finos y mates, en una gama de grises, marrones y tonos velados que debe mucho a Whistler. Sus modelos, envueltos en una luz suave, parecen perdidos en sus pensamientos. Sus retratos, de gran intensidad psicológica, la convierten en una de las grandes pintoras europeas de su tiempo."""

[[artistes]]
nom = "Osman Hamdi Bey"
vie = "Constantinopla, 30 de diciembre de 1842 – Constantinopla, 24 de febrero de 1910"
biographie = """
Hijo del gran visir İbrahim Edhem Pachá, Osman Hamdi es enviado a París en 1860 para estudiar derecho; allí se apasiona por la pintura y frecuenta los talleres de pintores orientalistas. De regreso en Constantinopla en 1869, ocupa diversos cargos administrativos, en particular en Bagdad, y organiza en 1873 la participación otomana en la Exposición Universal de Viena, para la cual publica con Marie de Launay un álbum sobre los trajes populares de Turquía. En 1881 se convierte en director del Museo Imperial, futuro museo arqueológico de Estambul. Funda la Escuela de Bellas Artes de la ciudad, hace adoptar una ley que prohíbe la exportación de antigüedades y dirige él mismo excavaciones, en particular en Sidón, donde descubre en 1887 la necrópolis real y el sarcófago llamado de Alejandro. Paralelamente, no deja de pintar, y expone en particular en el Salón de París. Muere en su casa de Kuruçeşme, a orillas del Bósforo, en 1910."""
style = """
Osman Hamdi retoma la manera precisa y luminosa de los orientalistas franceses, pero la invierte: en lugar de un Oriente soñado por Occidente, pinta escenas de su propia cultura, a menudo con dignidad y a veces con ironía, utilizando sus propias fotografías y su entorno como modelos. Se le considera un pionero de la pintura moderna en Turquía."""
