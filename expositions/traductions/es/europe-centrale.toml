[[oeuvres]]
titre = "Niña con crisantemos"
artiste = "Olga Boznańska"
annee = "1894"
image = "fillette-chrysanthemes.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Olga_Boznańska_-_Girl_with_Chrysanthemums_-_MNK_II-b-1032_-_National_Museum_Kraków.jpg"
technique = "Óleo sobre cartón, 88,5 × 69 cm"
collection = "Museo Nacional de Cracovia"
note = "Una niña pálida de cabello pelirrojo sostiene crisantemos blancos y nos mira fijamente con sus grandes ojos oscuros."
description = """
Una niña está de pie, de frente, contra un muro gris claro. Lleva un vestido gris antracita de mangas abullonadas y, contra el costado, un ramo de grandes crisantemos blancos de pétalos desgreñados. Sus largos cabellos pelirrojos, revueltos, enmarcan un rostro muy pálido en el que resaltan dos grandes ojos negros y una boca roja. Sus manos, de dedos entrelazados, sujetan los largos tallos verdes a la altura de la cintura. Detrás de ella, a la derecha, su sombra se proyecta en el muro, y manchas pardas aparecen en el fondo, allí donde transparece la imprimación del cartón. Abajo a la derecha, la pintora ha firmado y fechado: «Boznańska 94»."""
evocation = """
La mirada fija y grave de la niña, que nada viene a suavizar, da al retrato algo inquietante. Los crisantemos, flores de Todos los Santos tanto en Polonia como en Francia, asocian a la niña con la idea de la muerte y del paso del tiempo. Se ha visto en ella la imagen de una infancia melancólica, demasiado seria para su edad, y un eco del simbolismo que entonces se extiende por Europa. Pero Boznańska no cuenta una historia: capta una presencia, una tensión interior. Esa fuerza psicológica es lo que ha hecho de este cuadro su obra más célebre."""
histoire = """
Boznańska pinta este retrato en 1894 en Múnich, donde se ha instalado para estudiar pintura, pues las academias estaban entonces cerradas a las mujeres. Allí tiene un taller y empieza a exponer en Alemania y en Polonia. Cuatro años más tarde parte hacia París, donde vivirá más de cuarenta años. El cuadro es adquirido por el Museo Nacional de Cracovia en 1950. Considerado la obra maestra de la artista, ha sido restaurado recientemente gracias al mecenazgo de la fundación BNP Paribas, y se presenta en el edificio principal del museo, en Cracovia."""
facture = """
Boznańska pinta sobre cartón, en capas delgadas y mates, con una gama reducida de grises, marrones y blancos. Admira a Whistler y a Manet, de quienes retiene la armonía de tonos apagados y la pose frontal sobre un fondo neutro. El vestido y el muro están pincelados con rápidos trazos amplios, mientras que los crisantemos se aplican con toques espesos y nerviosos de blanco puro. El rostro, en cambio, está modelado con delicadeza. El fondo dejado al descubierto en algunos puntos forma parte del efecto."""
details = [
  "Los grandes ojos negros, que siguen al visitante.",
  "Los crisantemos blancos, pintados con toques espesos.",
  "La sombra de la niña en el muro, a la derecha.",
  "Los dedos entrelazados que aprietan los tallos.",
  "La firma «Boznańska 94», abajo a la derecha.",
]
themes = ["retrato", "infancia", "melancolía", "flores", "mirada"]
anecdote = """
El Museo Nacional de Cracovia fue la primera institución polaca en comprar una pintura de Boznańska para las colecciones nacionales: en 1896 adquirió su Retrato del pintor Paweł Nauen, pintado en 1893."""
