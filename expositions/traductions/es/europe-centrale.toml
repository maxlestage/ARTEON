[exposition]
ordre = 128
nom_court = "Europa central"
mouvement = "Europa central y oriental, siglo XIX"
cadre = "dore"
couleur = "#7d2f3a"
titre = "Europa central y oriental, los pintores de las naciones"
artiste = "Matejko, Mucha, Munkácsy, Boznańska, Csontváry, Osman Hamdi…"
dates = "1862–1912"
accroche = "Exposición virtual · Galería de los Sukiennice, Cracovia"
introduction = """
De Cracovia a Budapest, de Praga a Bucarest y a Estambul, los pintores del siglo XIX formados en Múnich, en Viena o en París regresan a su tierra con una misión: dar imagen a pueblos sin Estado o a Estados recién nacidos. La visita reúne a once artistas polacos, checos, húngaros, rumano y otomano, desde la gran pintura de historia de Matejko y de Mucha hasta el realismo campesino, el plein air de Szinyei Merse y las visiones de Malczewski y de Csontváry. El edificio se inspira en la galería de pintura polaca del siglo XIX instalada en la planta superior de la lonja de los paños de Cracovia, los Sukiennice: un vestíbulo y, a continuación, cuatro grandes salas en enfilada, de paredes coloreadas como las de un salón de otros tiempos."""
vitrine = "stanczyk.jpg"

[musee]
nom = "Galería de la pintura polaca del siglo XIX en los Sukiennice"
ville = "Cracovia, Polonia"
architecte = "Tomasz Pryliński (restauración de 1875–1879)"
construction = "Lonja medieval; galería abierta en 1879"
presentation = """
En el centro de la gran plaza del Mercado de Cracovia, los Sukiennice, la lonja de los paños, albergan desde la Edad Media los puestos de los mercaderes. Tras un incendio en 1555, el edificio gótico recibe un remate renacentista, un ático adornado con mascarones. Entre 1875 y 1879, bajo el alcalde Mikołaj Zyblikiewicz, la ciudad lo hace restaurar por el arquitecto Tomasz Pryliński, que mezcla el gótico y el Renacimiento. El 7 de octubre de 1879, el consejo municipal funda allí el Museo Nacional de Cracovia; el pintor Henryk Siemiradzki dona, para iniciar la colección, su lienzo gigante Las antorchas de Nerón. Las cuatro grandes salas de la planta superior llevan hoy los nombres de Bacciarelli, Michałowski, Siemiradzki y Chełmoński, y recorren la pintura polaca desde la Ilustración hasta el simbolismo, cada una en torno a un cuadro central, como en un salón del siglo XIX. Cerrada de 2006 a 2010 por una gran renovación, la galería reabrió en 2010."""
ici = """
El edificio de ARTEON retoma la idea de la planta superior de los Sukiennice: cuatro grandes salas idénticas, de dieciocho metros por catorce y nueve de altura, en enfilada de oeste a este, cada una con una obra maestra en el centro del muro norte. Se entra por el sur en un vestíbulo color piedra y después en la sala «Historia y leyenda», de rojo pompeyano, donde aguarda la Epopeya eslava de Mucha. Se atraviesa luego, de puerta en puerta, la sala «El pueblo y la guerra», de verde grisáceo, la sala «El plein air», de ocre, y por último la sala «Enigmas y símbolos», de un malva apagado."""

