[[oeuvres]]
titre = "El domador de tortugas"
artiste = "Osman Hamdi Bey"
annee = "1906"
image = "dresseur-de-tortues.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Osman_Hamdi_Bey_-_The_Tortoise_Trainer_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 221,5 × 120 cm"
collection = "Museo Pera, Estambul"
note = "Un anciano de túnica roja, con una flauta a la espalda, intenta en vano adiestrar a unas tortugas: una sonrisa irónica sobre el Imperio otomano."
description = """
En una sala alta de una mezquita ruinosa, ante una ventana de arco apuntado, un anciano barbudo está de pie, de perfil, ligeramente inclinado. Lleva una larga túnica roja de dobladillo bordado, ceñida a la cintura, y un gran turbante de bandas amarillas y violetas. Sus manos, cruzadas a la espalda, sostienen una flauta de caña, el ney; un pequeño tambor, el nakkare, cuelga a su espalda. A sus pies, cinco tortugas pacen hojas verdes esparcidas sobre el enlosado, sin prestarle la menor atención. Alrededor de la ventana, los muros están cubiertos de azulejos de cerámica azules y turquesas, y de una inscripción caligrafiada; en algunos puntos, el revestimiento se ha desprendido y deja ver el ladrillo."""
evocation = """
El cuadro se lee con mayor frecuencia como una sátira: la de las reformas lentas e ineficaces del Imperio otomano, en particular de las Tanzimat, que el viejo domador, con sus métodos de otra época, no logra hacer avanzar. Su atuendo, anterior al fez y a los trajes a la europea, y sus instrumentos de derviche lo vinculan a un mundo caduco. Se ha visto en él un autorretrato, pues Osman Hamdi se fotografiaba a menudo con trajes para preparar sus cuadros. Poco comprendido en su creación, el cuadro adquirió un sentido nuevo tras la revolución de los Jóvenes Turcos, en 1908. La inscripción sobre la ventana dice: «La curación de los corazones es el encuentro con el Amado»."""
histoire = """
Osman Hamdi pinta esta primera versión en 1906 y la envía al Salón de París, en el Grand Palais, con el título El hombre de las tortugas. El decorado se inspira en una sala alta de la Mezquita Verde de Bursa, antigua capital otomana. Una segunda versión, más pequeña, fechada en 1907, se conserva en una colección particular. La primera perteneció al empresario turco Erol Aksoy; en diciembre de 2004 se vende en subasta en Estambul por unos cinco millones de liras turcas, un récord entonces para un pintor turco. Adquirida por la fundación Suna e İnan Kıraç, es la obra más célebre del Museo Pera, abierto en 2005."""
facture = """
Osman Hamdi, formado en París en el entorno de los pintores orientalistas, aplica su precisión académica a una escena de su propia cultura. Describe con minuciosidad los azulejos de cerámica, la caligrafía, la seda de la túnica, las escamas de las tortugas. El formato muy estrecho y alto acentúa la verticalidad de la silueta y de la ventana. El rojo de la túnica, en el centro, resalta sobre los azules profundos del decorado. La luz, que viene de la ventana del fondo, ilumina el enlosado y los muros desconchados."""
details = [
  "Las cinco tortugas que pacen sin preocuparse del domador.",
  "La flauta ney sostenida a la espalda, y el tambor colgado del hombro.",
  "Los azulejos de cerámica caídos, que dejan ver el ladrillo.",
  "La inscripción caligrafiada sobre la ventana.",
  "La firma del pintor y la fecha, abajo a la derecha.",
]
themes = ["sátira", "oriente", "tortugas", "reforma", "traje"]
anecdote = """
Osman Hamdi habría encontrado la idea en un artículo de la revista Le Tour du monde, leído años antes, que describía a unos domadores que hacían caminar a sus tortugas en fila al son del tambor. Los herpetólogos han identificado sus tortugas como Testudo graeca ibera."""
