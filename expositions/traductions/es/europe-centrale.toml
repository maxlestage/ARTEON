[[oeuvres]]
titre = "Ruinas del teatro griego de Taormina"
artiste = "Tivadar Csontváry Kosztka"
annee = "1904–1905"
image = "theatre-taormine.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Csontváry_Kosztka,_Tivadar_-_Ruins_of_the_Greek_Theatre_at_Taormina_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 302 × 570 cm"
collection = "Galería Nacional Húngara, Budapest"
note = "El teatro antiguo de Taormina, en Sicilia, frente al mar y al Etna nevado, bajo un cielo amarillo dorado: una visión gigantesca."
description = """
En primer plano se extiende el teatro antiguo de Taormina, visto desde las gradas: el muro de la escena, de ladrillo, perforado por arcos y adornado con algunas columnas, está en ruinas, y bloques de mármol blanco yacen en la orquesta invadida de hierba. Por las brechas del muro se ve el mar de un azul intenso, una bahía de playa curva y un pueblo a orillas del agua. Más allá, una larga cadena de montañas oscuras sube hacia la derecha hasta el cono nevado del Etna, de donde se escapa un penacho de humo. A la derecha, en la colina, se alzan las casas de Taormina. El cielo es extraño: una banda de un amarillo dorado luminoso a la izquierda, coronada de nubes malvas y de una estela verde. Por un arco, a la derecha, se vislumbra un árbol en flor."""
evocation = """
Csontváry se decía llamado a convertirse en el mayor «pintor de la ruta del sol»; buscaba los lugares donde la luz y la historia se encuentran. En Taormina lo halla todo a la vez: las ruinas de una civilización desaparecida, el mar, el volcán y el sol. El cuadro confronta la obra humana que se derrumba y la naturaleza eterna, el tiempo de los hombres y el de la tierra. Sus colores irreales y su precisión obsesiva le dan un carácter de visión, entre el paisaje y la aparición. A menudo se ha acercado su arte a la pintura ingenua y al expresionismo, pero no pertenece a ninguna escuela."""
histoire = """
Csontváry, antiguo farmacéutico convertido en pintor pasados los cuarenta años, viaja por Italia y se aloja en Taormina en 1904. Allí pinta este inmenso lienzo, de casi seis metros de ancho, desde un punto de vista ya elegido por los pintores románticos, y lo termina en 1905. Expone sus grandes lienzos en París en 1907 y luego en Budapest, donde son mal comprendidos. A su muerte, en 1919, su obra es casi desconocida. Salvados por un admirador, sus lienzos se van reconociendo poco a poco como un tesoro nacional. Este, uno de los más célebres de la pintura húngara, se expone en la Galería Nacional Húngara, en una sala dedicada al pintor."""
facture = """
Csontváry pinta al óleo en anchas superficies planas de colores saturados, puestas unas junto a otras sin transición: el amarillo del cielo, el azul del mar, el blanco del Etna. Renuncia casi a la perspectiva aérea, de modo que las lejanías son tan nítidas como el primer plano. Las ruinas, en cambio, se describen ladrillo a ladrillo, con minucioso esmero. El formato muy alargado, dos veces más ancho que alto, despliega el paisaje como un panorama. El trazo del dibujo sigue siendo visible en algunos puntos."""
details = [
  "El penacho de humo que se escapa del Etna nevado, a la derecha.",
  "El árbol en flor entrevisto por un arco del muro de la escena.",
  "Los bloques de mármol blanco esparcidos en la orquesta.",
  "Las casas de Taormina, en la colina de la derecha.",
  "La banda de cielo amarillo dorado, bajo las nubes malvas.",
]
themes = ["ruinas", "volcán", "sicilia", "sol", "visión"]
anecdote = """
Según un relato a menudo repetido, tras la muerte del pintor en 1919, sus grandes lienzos estuvieron a punto de venderse como toldos para carretas; el joven arquitecto Gedeon Gerlóczy los compró en una subasta y los salvó."""
