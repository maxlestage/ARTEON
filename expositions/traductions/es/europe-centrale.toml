[[oeuvres]]
titre = "Melancolía"
artiste = "Jacek Malczewski"
annee = "1890–1894"
image = "melancolie.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Malczewski_Jacek_Melancholia.jpg"
technique = "Óleo sobre lienzo, 139 × 240 cm"
collection = "Fundación Raczyński, Museo Nacional de Poznań (galería de Rogalin)"
note = "De un lienzo puesto en un caballete brota una multitud de insurgentes, sacerdotes y niños, que se precipita hacia una ventana guardada por la Melancolía."
description = """
En un taller de pintor de paredes verdosas, un hombre está sentado ante su caballete, arriba a la izquierda, minúsculo y pálido. De su lienzo parece salir un torrente humano que atraviesa toda la estancia en diagonal: insurgentes armados con guadañas y picas, sacerdotes, soldados de la época napoleónica, mujeres de luto, prisioneros encadenados, niños. Algunos blanden sables y una bandera roja, otros llevan violines, libros o pinceles. Cuanto más avanza la multitud hacia la derecha, más envejecen los rostros; solo unos pocos ancianos alcanzan el alféizar de la gran ventana. Tras ella, en el jardín bañado de sol, una mujer envuelta en negro permanece inmóvil, de espaldas: es la Melancolía, que guarda el paso."""
evocation = """
El título completo, «Melancolía. Prólogo. Visión. El último siglo en Polonia», anuncia una meditación sobre la historia. La multitud resume un siglo de esperanzas y de derrotas, desde los repartos de Polonia hasta las insurrecciones de 1830 y de 1863: sus generaciones se apiñan hacia la ventana, símbolo de la libertad, pero ninguna logra franquearla. La Melancolía les cierra el camino. El pintor del taller, de donde todo parece nacer, interroga también el papel del artista: ¿es él quien hace revivir a esos fantasmas, o son ellos quienes lo obsesionan? El cuadro se considera a menudo el manifiesto del simbolismo polaco."""
histoire = """
Malczewski trabaja en este gran lienzo en Cracovia de 1890 a 1894. Profesor y luego rector de la Academia de Bellas Artes de la ciudad, retomará el tema de la ronda humana unos años más tarde en El círculo vicioso, y Stanisław Wyspiański hará de una danza semejante el símbolo de la sociedad polaca en su obra Las bodas, en 1901. El cuadro pertenece a la colección del conde Edward Aleksander Raczyński, que reunió para su galería del castillo de Rogalin un hermoso conjunto de pinturas de Malczewski; hoy es propiedad de la Fundación Raczyński, en depósito en el Museo Nacional de Poznań."""
facture = """
Malczewski, discípulo de Matejko, conserva de su maestro el dibujo sólido y el gusto por la multitud, pero los pone al servicio de una visión. Cada figura está pintada de manera realista, del natural, aunque la escena entera es imposible. La composición descansa en una gran diagonal, que parte del caballete arriba a la izquierda y desciende hacia la ventana a la derecha, como una ola. La luz verde y dorada del taller contrasta con el resplandor del jardín tras el cristal y con la silueta negra de la Melancolía."""
details = [
  "El pintor minúsculo ante su caballete, arriba a la izquierda, de donde sale la multitud.",
  "La mujer de negro tras la ventana, de espaldas, que guarda el paso.",
  "Los ancianos aferrados al alféizar de la ventana, a la derecha.",
  "El violín y los libros que llevan algunos personajes, en lugar de armas.",
  "La bandera roja y los sables en el centro del tumulto.",
]
themes = ["simbolismo", "polonia", "memoria", "insurrección", "artista"]
anecdote = """
Se cuenta que Malczewski pedía a sus alumnos de la Academia de Cracovia que «pintaran de modo que Polonia resucite»: para él, la pintura debía mantener viva a una nación borrada del mapa."""
