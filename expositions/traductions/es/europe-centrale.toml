[[oeuvres]]
titre = "Picnic en mayo (Majális)"
artiste = "Pál Szinyei Merse"
annee = "1873"
image = "pique-nique-en-mai.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Szinyei_Merse,_Pál_-_Picnic_in_May_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 127 × 162,5 cm"
collection = "Galería Nacional Húngara, Budapest"
note = "Unos jóvenes hacen un picnic en una colina bajo el sol de mayo: un plein air pintado un año antes de la primera exposición impresionista."
description = """
En la ladera de una colina de un verde deslumbrante, en parte en sombra, seis jóvenes se han instalado para un almuerzo sobre la hierba. Sobre una gran manta roja, un hombre con sombrero negro se apoya en el codo, junto a una joven con vestido blanco de lazos violetas. A su lado, un hombre de traje oscuro toma la mano de una joven pelirroja con vestido rosa, con un abanico en la mano. Otro hombre, tendido boca abajo, de espaldas, se inclina sobre los restos de la comida: una cesta, una botella, platos sobre un mantel blanco. En primer plano, un hombre con sombrero de paja se agacha para coger una flor. La hierba está salpicada de amapolas y flores del campo; en lo alto de la colina, dos paseantes con sombrilla se recortan contra el cielo."""
evocation = """
El cuadro celebra la primavera, la juventud y el placer de estar juntos al sol, en una feliz armonía entre los seres y la naturaleza. Szinyei se inspira en los picnics de los artistas de Múnich, donde vivía entonces. Llega al plein air y al color claro al mismo tiempo que los impresionistas franceses, pero sin conocerlos: la primera exposición impresionista no tiene lugar en París hasta 1874. Para los húngaros, Majális se ha convertido en la imagen misma de la despreocupación y de la luz, y en un símbolo de la modernidad de su pintura. El título designa la fiesta de mayo, una salida campestre tradicional en primavera."""
histoire = """
Szinyei pinta el lienzo en Múnich en 1873, a su regreso de una estancia en su Alta Hungría natal. Sus contemporáneos, acostumbrados a la pintura de historia sombría y esmerada, lo ridiculizan: esos verdes crudos y esas sombras coloreadas les parecen inacabados. Desanimado por las críticas y por preocupaciones familiares, el pintor deja de pintar a comienzos de la década de 1880 y se retira a sus tierras. Hay que esperar a una retrospectiva organizada por sus amigos en 1894 para que su obra sea por fin reconocida. Szinyei llega a ser después presidente de la Escuela Superior de Bellas Artes de Budapest. Hoy es uno de los cuadros más queridos de la Galería Nacional Húngara."""
facture = """
Szinyei pinta con colores puros y saturados: verdes francos para la hierba, que la luz hace pasar del amarillo al azul, y el rojo vivo de la manta, el color complementario, que hace vibrar el conjunto. Las sombras ya no son pardas sino verdes o violáceas. La composición, muy equilibrada, coloca al grupo en un óvalo en el centro de una pendiente en diagonal. La pincelada sigue siendo más construida y más lisa que la de los impresionistas, heredera de la enseñanza de Múnich. Hoy se distingue una fina red de craquelados en el cielo."""
details = [
  "El hombre tendido boca abajo, de espaldas: es el propio pintor.",
  "La gran manta roja, que responde al verde de la colina.",
  "Las dos paseantes con sombrilla, diminutas, en lo alto de la colina.",
  "Las amapolas esparcidas en la hierba, alrededor del grupo.",
  "El hombre del sombrero de paja que coge una flor, en primer plano.",
]
themes = ["primavera", "plein air", "juventud", "picnic", "color"]
anecdote = """
Szinyei cuenta en sus recuerdos que se pintó a sí mismo en el cuadro: es el joven tendido boca abajo, de espaldas, ocupado en comer, en el centro del grupo."""
salle = 4
mur = "sud"
place = 3
