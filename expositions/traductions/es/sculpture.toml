[[oeuvres]]
titre = "Heracles arquero"
artiste = "Antoine Bourdelle"
annee = "1909"
image = "herakles-archer.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Herakles_the_Archer_-_MET_-_24.232.jpg"
technique = "Bronce con pátina dorada"
collection = "Museo Metropolitano de Arte, Nueva York"
note = "El héroe, con el arco tenso, apunta a las aves del lago Estínfalo: una línea de fuerza que rompe con el modelado de Rodin."
description = """
Un hombre desnudo, de músculos nudosos, tensa un gran arco. Su pie derecho se apoya muy alto \
sobre una roca, con la pierna replegada en horizontal, mientras que la izquierda, tendida hacia \
atrás, se apoya en el suelo. El busto se inclina hacia delante; el brazo izquierdo, tendido, \
sostiene el arco cuya curva se alza sobre él, y el brazo derecho tira de la \
cuerda. La cabeza, de perfil, apunta a un blanco invisible. El cuerpo y el arco forman una \
figura geométrica, hecha de líneas rectas y ángulos. En la fotografía, el \
bronce dorado se recorta ante un gran ventanal abierto a unos árboles."""
evocation = """
El tema es uno de los doce trabajos de Hércules: matar a las aves monstruosas del lago \
Estínfalo, de plumas de bronce. Bourdelle hace de él un símbolo de la energía humana \
concentrada en un fin. La obra fue saludada como un manifiesto: tras el modelado \
tembloroso de Rodin, recupera el rigor de la escultura griega arcaica, \
que Bourdelle admiraba, y la construcción por grandes planos. Expresa una \
tensión extrema, pero dominada, casi arquitectónica. A principios del siglo XX, \
abre el camino a una escultura que busca menos la vida que la estructura."""
histoire = """
Bourdelle, tras quince años como oficial de Rodin, busca su propio camino. En \
1909, modela el Heracles a partir de un oficial deportista, el comandante Doyen-Parigot, \
que posa para él en esa difícil posición. La obra se expone en el Salón de la \
Sociedad Nacional de Bellas Artes en 1910 y obtiene un éxito inmediato. El \
coleccionista Gabriel Thomas financia la primera fundición. El escultor realiza \
después varias versiones, de tamaños diferentes. El ejemplar del Museo Metropolitano \
de Nueva York ingresó allí en 1924, en vida del artista. Otros están en el \
museo Bourdelle de París, en el museo de Orsay y en Montauban, su ciudad natal."""
facture = """
Bourdelle construye la figura por planos nítidos, como un arquitecto: los músculos \
se simplifican en masas angulosas, los contornos son tajantes. La composición \
descansa en triángulos y diagonales, en el plano mismo del arco, de modo que \
la escultura se lee casi como un relieve, de frente. La roca, tratada en bloques \
en bruto, sirve de contrapeso. La cabeza, de rostro estilizado, recuerda a los guerreros de los \
frontones del templo de Egina, que pueden verse en Múnich."""
details = [
  "El pie derecho, colocado muy alto sobre la roca.",
  "El arco inmenso, cuya curva domina toda la figura.",
  "Los músculos de la espalda, tratados en planos angulosos.",
  "El rostro de perfil, tenso hacia el blanco.",
]
themes = ["mitología", "héroe", "tensión", "arcaísmo", "bronce"]
anecdote = """
El taller de Bourdelle, en el barrio de Montparnasse, se ha convertido en el museo \
Bourdelle, abierto en 1949; la calle donde se encuentra, la antigua impasse du Maine, \
lleva hoy su nombre."""
