[[oeuvres]]
titre = "El Mediterráneo"
artiste = "Aristide Maillol"
annee = "1902–1905"
image = "mediterranee.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:La_Méditerranée_-_Aristide_Maillol_-_Musée_du_Louvre_Sculptures_des_jardins_FNAC_9492_-_TU_254.jpg"
technique = "Bronce"
collection = "Jardín de las Tullerías, París (Museo del Louvre)"
note = "Una mujer sentada, con la cabeza apoyada en la mano: ni historia ni drama, solo volúmenes en equilibrio."
description = """
Una mujer desnuda está sentada sobre un pedestal bajo. Su pierna derecha está replegada y alzada, \
con la rodilla en alto; la izquierda está tendida bajo ella. Su codo derecho se apoya en esa \
rodilla y su mano sostiene la cabeza, inclinada, mientras que la mano izquierda se apoya \
en el pedestal. El rostro, calmo, de rasgos regulares, mira hacia abajo. Las \
formas son plenas, los hombros anchos, los muslos poderosos; todo el cuerpo \
se inscribe en un volumen compacto. La fotografía muestra el bronce, de pátina \
verdín, colocado sobre un pedestal de piedra en una alameda de las Tullerías, \
ante árboles podados."""
evocation = """
Maillol dio a su estatua el nombre del mar de su infancia, en Banyuls: no \
cuenta nada, encarna una tierra, una luz, un equilibrio. Después de Rodin, que \
esculpía el movimiento y la pasión, propone la calma y la mesura, en el \
espíritu de la escultura griega. La pose de la cabeza en la mano, imagen tradicional \
de la meditación, no remite aquí a ningún relato. Se ha visto en ella el punto de partida de un clasicismo moderno, atento a las solas \
formas, que marcó toda la escultura del período de entreguerras."""
histoire = """
Maillol, que acaba de dejar la pintura y el tapiz por la escultura, \
trabaja en esta figura a principios de siglo, según su esposa, Clotilde. El yeso, \
expuesto en el Salón de Otoño de 1905, causa sensación. El conde alemán Harry Kessler, \
su mecenas, encarga una versión en piedra. Mucho más tarde, en 1923, el Estado \
encarga un mármol, terminado en 1927, hoy en el museo de Orsay. Los bronces de \
Maillol instalados en los jardines del Carrousel y de las Tullerías proceden de la \
donación de Dina Vierny, su última modelo, aceptada en 1964 por André Malraux, \
entonces ministro de Asuntos Culturales."""
facture = """
Maillol modela volúmenes simples y cerrados: el cuerpo se inscribe en un cubo, \
casi sin vacío entre los miembros. Las superficies son lisas, sin los accidentes \
de luz caros a Rodin; los detalles se borran ante la masa. Las proporciones, \
robustas, rechazan la elegancia alargada de los desnudos académicos. Este gusto por la forma \
plena viene de la Antigüedad griega, de las esculturas egipcias y del arte románico \
de su Rosellón natal, pero también de la obra de Gauguin, a quien conoció en tiempos de los \
Nabis."""
details = [
  "La cabeza, apoyada en la mano, inclinada hacia abajo.",
  "La rodilla derecha alzada, que sirve de apoyo al codo.",
  "La mano izquierda, plana sobre el pedestal.",
  "El perfil compacto del cuerpo, sin brazo separado en el vacío.",
]
themes = ["clasicismo", "mediterráneo", "desnudo", "calma", "bronce"]
anecdote = """
En el Salón de Otoño de 1905, el escritor André Gide escribió a propósito de la estatua: \
«Es bella; no significa nada; es una obra silenciosa». Ese \
mismo Salón causaba escándalo con los lienzos de Matisse y sus amigos, los fauves."""
