[[oeuvres]]
titre = "El pensador"
artiste = "Auguste Rodin"
annee = "modelo hacia 1880"
image = "penseur.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:The_Thinker_MET_DP-13618-011.jpg"
technique = "Bronce, en su tamaño original (unos 72 cm de altura)"
collection = "Museo Metropolitano de Arte, Nueva York"
note = "Concebido para dominar La puerta del Infierno, el poeta sentado ante su obra se ha convertido en la imagen misma del pensamiento."
description = """
Un hombre desnudo está sentado sobre una roca, inclinado hacia delante. Su barbilla reposa en el dorso de \
su mano derecha, cuyo codo se apoya, curiosamente, en el muslo izquierdo: todo el \
busto se retuerce para lograr este gesto. La mano izquierda cuelga, relajada, sobre la rodilla. Los \
pies, poderosos, se agarran a la roca, con los dedos encogidos. La espalda está \
arqueada, los hombros son macizos, el cuello grueso; el rostro, en sombra, mira hacia \
abajo, como hacia un abismo. Ningún atributo, ningún vestido, ninguna inscripción \
dice quién es. En la fotografía, la pátina oscura del bronce atrapa la luz \
en los relieves de los músculos y deja las hendiduras en la negrura."""
evocation = """
Rodin pensaba primero en Dante, sentado sobre La puerta del Infierno y meditando su \
poema ante los condenados que se agitan a sus pies. Al salir de la Puerta, la \
figura pierde su nombre: se convierte en «el Pensador», el hombre que reflexiona y, para \
muchos, la imagen del esfuerzo intelectual. Rodin explicaba que su personaje no \
piensa solo con la frente fruncida sino con todos sus músculos, hasta los \
dedos de los pies crispados: el pensamiento es aquí un trabajo físico, casi un sufrimiento. Este \
cuerpo de atleta, heredado de Miguel Ángel, se ha leído también como el del obrero o \
el del creador, y el propio artista lo eligió para velar sobre su tumba."""
histoire = """
En 1880, el Estado encarga a Rodin una puerta monumental para un futuro museo de Artes \
Decorativas. El escultor elige el Infierno de Dante y coloca en el centro del tímpano una \
figura sentada, de unos 70 cm de altura, a la que llama «el Poeta». El museo no ve \
nunca la luz, pero Rodin sigue trabajando en la Puerta y extrae de ella figuras \
independientes. El pensador se expone solo desde finales de los años 1880 y se amplía \
en 1902–1904 hasta casi dos metros. Este gran bronce, donado por suscripción, se \
instala ante el Panteón en 1906, antes de incorporarse al jardín del museo Rodin en \
1922. El bronce del Museo Metropolitano de Nueva York, presentado aquí, recupera el tamaño \
original de la figura, el que tiene en la Puerta."""
facture = """
Rodin modela primero en arcilla; después la figura se vacía en yeso y se funde en \
bronce a la cera perdida o a la arena; cada tirada recibe su pátina. El modelado \
nunca es liso: pequeños bultos y hendiduras hacen vibrar la luz sobre la \
piel. La pose cerrada, replegada sobre sí misma, da a la figura la compacidad de un \
bloque, que Rodin admiraba en Miguel Ángel. Las manos y los pies, deliberadamente \
grandes, concentran la fuerza. La versión ampliada se realizó con la ayuda de un \
especialista de la reducción y la ampliación mecánicas, Henri Lebossé."""
details = [
  "El codo derecho apoyado en el muslo izquierdo, que retuerce todo el busto.",
  "Los dedos del pie derecho, encogidos sobre el borde de la roca.",
  "La mano izquierda, abandonada, que contrasta con la tensión de la derecha.",
  "Las arcadas superciliares en voladizo, que hunden la mirada en la sombra.",
]
themes = ["pensamiento", "dante", "cuerpo", "bronce", "meditación"]
anecdote = """
Rodin reposa con su compañera Rose Beuret en el jardín de su casa de Meudon, cerca \
de París. Sobre su tumba, muertos ambos en 1917, vela una gran tirada de \
El pensador, según el deseo del escultor."""
salle = 1
mur = "ouest"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "El esclavo moribundo"
artiste = "Michel-Ange"
annee = "1513–1516"
image = "esclave-mourant.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Dying_slave_Louvre_MR_1590,_Louvre.jpg"
technique = "Mármol, 2,28 m de altura"
collection = "Museo del Louvre, París"
note = "Esculpida para la tumba del papa Julio II y luego descartada del proyecto, la figura parece deslizarse entre el sueño y la agonía."
description = """
Un joven desnudo, mayor que el natural, se mantiene en pie, con el peso del cuerpo sobre la \
pierna derecha y la izquierda flexionada. Su brazo derecho está replegado sobre el pecho, donde una \
delgada banda de tela le ciñe el torso; el brazo izquierdo, alzado, pasa por detrás de la cabeza. \
La cabeza está echada hacia atrás, los ojos cerrados, la boca entreabierta. El cuerpo \
parece deslizarse, como atrapado por el sueño o por la muerte. Detrás de él, contra la \
pierna izquierda, un bloque apenas desbastado deja adivinar la silueta de un mono. El \
mármol pulido de la piel contrasta con las partes que han quedado en bruto, estriadas por las \
herramientas, en la parte baja de la estatua. En la fotografía, la figura blanca se destaca sobre \
la penumbra de una sala del Louvre."""
evocation = """
El título de «Esclavo moribundo» no es de Miguel Ángel: no se sabe exactamente \
qué debían representar estos cautivos. Se ha visto en ellos las provincias sometidas por el \
papa, las artes liberales privadas de su protector a la muerte de Julio II o, según \
la lectura neoplatónica, el alma prisionera del cuerpo que aspira a liberarse. \
El mono, símbolo tradicional de la imitación, haría entonces de esta figura una \
alegoría de la pintura o de la escultura. Pero la obra habla ante todo por el \
cuerpo: belleza ideal, sensualidad del abandono, ligadura que oprime el pecho. El \
contraste entre el abandono de este cautivo y la torsión violenta de su compañero, \
el Esclavo rebelde, formaba sin duda parte del proyecto."""
histoire = """
En 1505, el papa Julio II encarga a Miguel Ángel una tumba colosal, poblada de \
decenas de estatuas. El proyecto, interrumpido sin cesar, se reduce tras la muerte del \
papa en 1513; es entonces cuando el artista esculpe los dos Esclavos del Louvre. Finalmente \
no encontraron lugar en la tumba, terminada en 1545 en la iglesia de \
San Pedro in Vincoli, en Roma, en torno al Moisés. Miguel Ángel los regala a Roberto \
Strozzi, un exiliado florentino que lo había acogido durante una enfermedad; Strozzi los \
dona al rey Francisco I. Pasan al condestable Anne de Montmorency, en el castillo \
de Écouen, y luego al cardenal de Richelieu, en su castillo del Poitou. Confiscados en la \
Revolución, ingresan en el Louvre en 1794."""
facture = """
Miguel Ángel talla directamente el bloque de mármol de Carrara, atacando la figura \
por una cara, como si la liberara de la piedra. Las marcas de la gradina, cincel \
dentado, son todavía visibles en las partes inacabadas, mientras que el torso y las \
piernas han sido pulidos. Este contraste, llamado non finito, fascinó a los \
escultores de los siglos siguientes, Rodin el primero. La pose en espiral, el \
contrapposto y la cabeza echada hacia atrás derivan de lo antiguo, en particular del \
Laocoonte, descubierto en Roma en 1506, que Miguel Ángel había visto salir de la tierra."""
details = [
  "La banda de tela tensa sobre el pecho, único signo de cautiverio.",
  "El mono apenas esbozado, en el bloque tras la pierna izquierda.",
  "Las huellas del cincel dentado en el mármol que ha quedado en bruto, abajo.",
  "Los párpados cerrados y la boca entreabierta del rostro echado hacia atrás.",
]
themes = ["renacimiento", "cautiverio", "mármol", "inacabado", "cuerpo"]
anecdote = """
Miguel Ángel habló toda su vida de la «tragedia de la sepultura»: la tumba de \
Julio II, encargada en 1505, lo ocupó, entre contratos sucesivos y \
pleitos, durante cuarenta años."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.7

[[oeuvres]]
titre = "Bacanal: un fauno provocado por unos niños"
artiste = "Le Bernin"
annee = "hacia 1616–1617"
image = "bacchanale-faune.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Bacchanal-_A_Faun_Teased_by_Children_MET_DP248148.jpg"
technique = "Mármol, esculpido junto con su padre, Pietro Bernini"
collection = "Museo Metropolitano de Arte, Nueva York"
note = "Una obra de juventud, tallada a los dieciocho años junto a su padre: la virtuosidad de Bernini ya se anuncia en ella."
description = """
Un joven fauno desnudo, coronado de pámpanos, trepa por el tronco de un árbol. Con el cuerpo \
arqueado hacia atrás, tiende el brazo derecho hacia los racimos de uva y las frutas que \
cuelgan de una rama, arriba. Dos niños mofletudos, apretados el uno contra el otro, \
se han encaramado junto a las frutas y lo rechazan o lo importunan; uno de ellos ríe \
abiertamente. Al pie del árbol, un tercer niño ha caído de espaldas, con las \
piernas en el aire. El tronco, rodeado de una vid, lleva una piel de fiera cuya cabeza \
cuelga en la parte baja de la composición. El conjunto forma una espiral ascendente, que se \
descubre al rodear la escultura: cada lado ofrece una escena \
distinta."""
evocation = """
El fauno y los niños pertenecen al cortejo de Baco, dios del vino: la escena \
es una fiesta, una imagen de la abundancia y de la embriaguez alegre. El deseo del fauno \
por las frutas, que los niños le disputan, puede leerse como un juego sobre la \
tentación o simplemente como una comedia campestre, a la manera de los poetas \
antiguos. Para los historiadores, la obra muestra sobre todo a un joven que quiere \
probar que puede rivalizar con los escultores de la Antigüedad, de los que las \
colecciones romanas estaban repletas. El movimiento, el instante captado y la alegría \
anuncian el estilo que Bernini impondrá en Roma pocos años más tarde."""
histoire = """
Bernini creció en el taller de su padre, Pietro Bernini, escultor florentino \
establecido en Roma. Hacia 1616–1617, padre e hijo trabajan juntos en este \
grupo, destinado sin duda a un jardín o a la galería de un coleccionista. La parte \
de cada uno es objeto de debate: la concepción audaz y la ejecución de las figuras se \
atribuyen a menudo al hijo, de unos dieciocho años entonces, mientras que el padre \
habría guiado el conjunto. El grupo permaneció largo tiempo poco conocido del público. Es \
hoy una de las piezas maestras de la escultura barroca en el Museo Metropolitano \
de Arte de Nueva York, donde se descubren, al rodearlo, sus distintas \
caras."""
facture = """
El grupo está tallado en un solo bloque de mármol, vaciado con audacia: los brazos \
tendidos, los racimos y los pies de los niños se destacan en el vacío. Bernini \
varía las superficies para imitar las materias: piel pulida y brillante, cabellos \
excavados con trépano, corteza estriada, hojas de vid recortadas, pelaje de la piel de \
fiera. Esta capacidad de hacer olvidar la piedra será su sello, en \
el Apolo y Dafne o el Rapto de Proserpina de la villa Borghese. La \
composición en espiral invita a rodear la obra."""
details = [
  "El niño que ríe, arriba, con la mejilla contra la de su compañero.",
  "Los racimos de uva, excavados uno a uno en el mármol.",
  "El niño caído de espaldas, al pie del árbol.",
  "La cabeza de la piel de fiera, que cuelga a lo largo del tronco.",
  "Las orejas puntiagudas y la corona de pámpanos del fauno.",
]
themes = ["barroco", "baco", "infancia", "virtuosismo", "mármol"]
anecdote = """
Bernini pasaba por niño prodigio: según sus primeros biógrafos, dibujó \
aún niño, ante el papa Pablo V, una cabeza de san Pablo, y el papa habría \
predicho que sería el Miguel Ángel de su tiempo."""
salle = 2
mur = "nord"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Psique reanimada por el beso del Amor"
artiste = "Antonio Canova"
annee = "1787–1793"
image = "psyche-ranimee.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Psyche_revived_Louvre_MR1777.jpg"
technique = "Mármol, 1,55 × 1,68 m"
collection = "Museo del Louvre, París"
note = "El Amor se inclina para despertar a Psique de un sueño mortal: dos cuerpos que se buscan, en forma de X."
description = """
Una joven medio tendida sobre una roca se incorpora y alza los brazos para \
rodear el rostro de un joven alado. Él, con una rodilla en tierra tras ella, la \
sostiene con un brazo pasado bajo sus hombros y pone la otra mano sobre su pecho. \
Sus rostros se rozan, a punto de besarse. Las grandes alas del Amor \
se alzan hacia el cielo, mientras las piernas de Psique se estiran hacia la derecha: \
los dos cuerpos dibujan una X, cuyo centro es el círculo formado por los brazos \
en torno a las dos cabezas. Un paño se desliza sobre las caderas de Psique. En la foto, tomada \
en el Louvre, el mármol blanco se destaca sobre un muro de piedra dorado por la luz."""
evocation = """
El tema procede de El asno de oro, novela latina de Apuleyo. Psique, mortal amada por \
el Amor, debe traer de los Infiernos un cofrecillo de belleza que no ha de abrir; \
curiosa, lo abre y cae en un sueño de muerte, hasta que el Amor la \
despierta. Canova elige el instante más tierno: el retorno a la vida por el amor. \
Psique significa el alma en griego; el mito se ha leído como la historia del alma humana \
que, tras pruebas, se une al amor divino. La escultura ha sido para muchos el \
modelo del neoclasicismo: una sensualidad serena, sin violencia, detenida en el umbral del \
beso."""
histoire = """
En 1787, en Roma, un coleccionista escocés, el coronel John Campbell, encarga a \
Canova un grupo según Apuleyo. El escultor trabaja en él hasta 1793, pero \
la obra no se entrega a su comitente. Es adquirida a principios del siglo XIX \
por Joachim Murat, cuñado de Napoleón, e ingresa en el Louvre en 1824. \
Canova esculpió de ella una segunda versión, conservada en el museo del Hermitage, en \
San Petersburgo. El grupo del Louvre es hoy una de las esculturas más \
admiradas del museo, en la galería Miguel Ángel, no lejos de los dos Esclavos, donde la \
luz natural resbala sobre el mármol pulido."""
facture = """
Canova modelaba primero un boceto en arcilla y luego un modelo de yeso a tamaño \
natural, jalonado de puntos de referencia metálicos; sus ayudantes desbastaban el mármol a \
partir de esos puntos, y él se reservaba el acabado. Pulía las \
superficies con esmero y les aplicaba, según se dice, una ligera pátina de cera para \
suavizar la blancura y dar a la piedra la tibieza de la piel. Las alas, \
talladas muy finamente, y los brazos vaciados atestiguan una virtuosidad técnica \
extrema. La composición está pensada para verse desde varios puntos de vista."""
details = [
  "El círculo de los brazos de Psique en torno a la cabeza del Amor.",
  "Las dos alas erguidas, finas como plumas verdaderas.",
  "La mano del Amor posada bajo el seno de Psique.",
  "El paño que se desliza sobre las caderas y cae sobre la roca.",
]
themes = ["neoclasicismo", "amor", "mitología", "beso", "mármol"]
anecdote = """
En El asno de oro, el Amor despierta a Psique no con un beso, sino con un pinchazo \
inofensivo de su flecha; Canova prefirió, para su escultura, la imagen de un beso \
suspendido."""
salle = 2
mur = "nord"
place = 3
largeur = 2.0

[[oeuvres]]
titre = "Ugolino y sus hijos"
artiste = "Jean-Baptiste Carpeaux"
annee = "1865–1867"
image = "ugolin.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ugolino_and_His_Sons_MET_DP247545.jpg"
technique = "Mármol, casi dos metros de altura, según el modelo de 1857–1861"
collection = "Museo Metropolitano de Arte, Nueva York"
note = "Un padre emparedado con sus hijos, que se muerde los dedos de desesperación: el Infierno de Dante en mármol."
description = """
Sobre una roca, un hombre anciano, desnudo y musculoso, está sentado, con los pies crispados uno \
sobre otro. Se lleva las manos a la boca y se muerde los dedos; su mirada fija, \
bajo las cejas fruncidas, se pierde en el vacío. A su alrededor se aprietan cuatro \
muchachos. Uno, arrodillado, alza hacia él un rostro suplicante y se aferra a su \
pierna. Otro, más joven, se acurruca contra su rodilla. El más pequeño ya está \
desplomado, tendido sobre los muslos de su hermano. Los cuerpos se apilan en pirámide, \
desde la pierna del padre hasta su cabeza. El grupo reposa sobre un pedestal octogonal; en \
la fotografía, el mármol blanco se destaca sobre un fondo gris liso."""
evocation = """
En el canto XXXIII del Infierno, Dante encuentra al conde Ugolino della Gherardesca, \
señor pisano emparedado en una torre con sus hijos y nietos, y condenado a \
morir de hambre. Sus hijos le ofrecen su propia carne para alimentarlo. Carpeaux \
capta el momento en que el padre, viendo su sufrimiento, se roe las manos de dolor, \
mientras ellos creen que tiene hambre. Los versos más sombríos del poema, que dejan \
adivinar un desenlace terrible, alimentaron la imaginación romántica. La obra expresa la \
angustia de un padre impotente y la intensidad de una escultura que quiere conmover \
tanto como la pintura de historia."""
histoire = """
Premio de Roma en 1854, Carpeaux debe enviar desde la Villa Médicis trabajos que \
prueben sus progresos. Elige, contra el parecer de la Academia, un tema sacado de \
Dante y no de la Antigüedad, y un grupo complejo donde se esperaba una figura. \
Modelado en Roma entre 1857 y 1861, el yeso es finalmente aceptado y fundido en \
bronce; expuesto en París, asienta la reputación de su autor. Este bronce está \
hoy en el museo de Orsay. Una versión en mármol, del mismo tamaño, se talla después \
en 1865–1867: es la que conserva el Museo Metropolitano de Nueva York, \
donde se erige en el gran patio de la escultura europea."""
facture = """
Carpeaux busca la lección de Miguel Ángel, cuyas figuras de la capilla Sixtina estudia en \
Roma, y del Laocoonte antiguo, otro drama de un padre y de sus hijos. Los \
cuerpos, muy anatómicos, encajan en una pirámide apretada, que hay que \
rodear para comprender su estructura. Las superficies conservan la energía del \
modelado: músculos tensos, venas salientes, mechones en desorden. El mármol fue \
tallado por oficiales según el modelo del artista, que supervisó su \
acabado."""
