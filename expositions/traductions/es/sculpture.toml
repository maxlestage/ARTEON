[[artistes]]
nom = "Michel-Ange"
vie = "Caprese (Toscana), 6 de marzo de 1475 – Roma, 18 de febrero de 1564"
biographie = """
Michelangelo Buonarroti nace en una familia florentina de pequeña nobleza. Aprendiz \
del pintor Domenico Ghirlandaio, pronto llama la atención de Lorenzo de Médici, que \
lo acoge en su palacio y en su jardín de esculturas antiguas. En Roma, \
esculpe a los veinticuatro años la Piedad de San Pedro; de regreso en Florencia, \
talla el David, terminado en 1504, que lo convierte en el primer escultor de Italia. El \
papa Julio II lo llama a Roma para su tumba y luego le impone pintar la bóveda \
de la capilla Sixtina (1508–1512). La tumba, reducida año tras año, lo ocupa \
durante cuatro décadas. En Florencia, concibe para los Médici la Sacristía \
Nueva de San Lorenzo y sus sepulcros. Instalado definitivamente en Roma en 1534, \
pinta el Juicio Final de la Sixtina, escribe poemas y se convierte en arquitecto de \
la basílica de San Pedro, de la que traza la cúpula. Muere a casi \
ochenta y nueve años, trabajando aún en una Piedad que quedó inacabada. Sus \
contemporáneos lo llamaban «el divino»."""
style = """
Miguel Ángel se quería ante todo escultor: decía liberar la figura prisionera \
del bloque. Sus cuerpos heroicos, musculosos, a menudo en torsión, expresan la fuerza y \
la angustia del alma. Muchas de sus estatuas quedan inacabadas, y ese non finito, \
donde la figura parece surgir de la piedra, fascinó a los siglos siguientes, hasta \
Rodin. Su influencia en la escultura y la pintura europeas es inmensa."""

[[artistes]]
nom = "Le Bernin"
vie = "Nápoles, 7 de diciembre de 1598 – Roma, 28 de noviembre de 1680"
biographie = """
Gian Lorenzo Bernini es hijo del escultor florentino Pietro Bernini, que \
se instala en Roma cuando el niño tiene siete u ocho años. Formado en el taller paterno, \
pronto es notado por los grandes coleccionistas romanos, en particular el \
cardenal Escipión Borghese, para quien esculpe en los años 1620 el Rapto de \
Proserpina, el David y Apolo y Dafne. El papa Urbano VIII, elegido en 1623, hace de \
él el artista oficial de Roma: traza el baldaquino de bronce de San Pedro y \
después, bajo Alejandro VII, la columnata de la plaza de San Pedro. Realiza también la \
capilla Cornaro y su Éxtasis de santa Teresa, y la fuente de los Cuatro Ríos, en \
la plaza Navona. Escultor, arquitecto, urbanista, decorador de teatro, domina la \
vida artística romana durante medio siglo. En 1665, Luis XIV lo invita a París \
para el proyecto del Louvre; sus planos no se aceptan, pero esculpe un célebre \
busto del rey, hoy en Versalles. Muere en Roma a los ochenta y un años."""
style = """
Bernini hace del mármol una materia viva: carne que cede bajo los dedos, \
cabellos, follajes, telas que vuelan. Capta el instante de una acción, como un \
director de escena, y une escultura, arquitectura y luz en un espectáculo total. \
Su arte define el barroco romano y fue imitado en toda la Europa católica."""

[[artistes]]
nom = "Antonio Canova"
vie = "Possagno (Véneto), 1 de noviembre de 1757 – Venecia, 13 de octubre de 1822"
biographie = """
Hijo de un cantero, criado por su abuelo, Antonio Canova se forma en \
Venecia, donde abre muy joven su propio taller. En 1781, se instala en Roma, \
de la que apenas volverá a salir. El grupo de Teseo y el Minotauro y luego las tumbas \
de los papas Clemente XIV y Clemente XIII lo hacen célebre en toda Europa. Los \
soberanos y los coleccionistas se disputan sus obras: Psique y el Amor, \
Hebe, las Tres Gracias. Napoleón lo hace venir a París y le encarga su retrato \
como Marte pacificador; su hermana Paulina Borghese posa para la Venus victoriosa. \
Tras la caída del Imperio, en 1815, Canova es enviado a París por el papa para \
recuperar las obras de arte llevadas de Roma por los ejércitos franceses, y trae de vuelta gran parte de ellas. \
Colmado de honores, hace construir en su pueblo natal de Possagno un templo inspirado en el Panteón, donde está enterrado. Su taller de \
yesos se ha convertido allí en museo."""
style = """
Canova es el maestro del neoclasicismo: formas ideales, inspiradas en lo antiguo, \
composiciones claras, una belleza calma donde la emoción permanece contenida. \
Trabajaba la superficie del mármol con un esmero extremo, hasta darle la suavidad \
de la piel. Para sus contemporáneos, era el nuevo Fidias; los románticos \
le reprocharon su frialdad."""

[[artistes]]
nom = "Jean-Baptiste Carpeaux"
vie = "Valenciennes, 11 de mayo de 1827 – Courbevoie, 12 de octubre de 1875"
biographie = """
Hijo de un albañil, Jean-Baptiste Carpeaux sigue a su familia a París, donde estudia en la \
Petite École de dibujo y luego en la Escuela de Bellas Artes, en el taller de François \
Rude. Tras varios fracasos, obtiene el Premio de Roma en 1854. En la Villa \
Médicis, estudia a Miguel Ángel y compone, pese a las reticencias de la Academia, \
su grupo de Ugolino. De regreso en París, se convierte en el escultor favorito del Segundo \
Imperio: retrata al príncipe imperial y a la princesa Matilde, y \
decora el pabellón de Flore, en el Louvre. Para la fachada de la nueva Ópera de Charles Garnier, \
esculpe La danza, desvelada en 1869: la desnudez alegre de sus bailarinas causa \
escándalo, y un desconocido arroja una botella de tinta sobre el grupo. Realiza \
después la fuente del Observatorio, con las Cuatro Partes del mundo. Enfermo de \
cáncer, en conflicto con su esposa, muere a los cuarenta y ocho años. Su taller \
difundió numerosas reducciones de sus obras."""
style = """
Carpeaux rompe con la contención neoclásica: sus figuras ríen, bailan, sufren, \
y el modelado conserva la viveza del boceto. Heredero de Rude y admirador de \
Miguel Ángel, busca el movimiento y la expresión. Sus bustos captan la \
personalidad de sus modelos, a menudo sorprendidos con una sonrisa. Por la energía de su \
modelado y su gusto por el drama, abre el camino a Rodin."""

[[artistes]]
nom = "Auguste Rodin"
vie = "París, 12 de noviembre de 1840 – Meudon, 17 de noviembre de 1917"
biographie = """
Hijo de un empleado de la prefectura de policía, Auguste Rodin aprende dibujo en la \
Petite École, pero fracasa tres veces en el concurso de la Escuela de Bellas Artes. \
Trabaja largo tiempo como ornamentista y oficial para otros escultores, en París \
y luego en Bruselas. En 1864, conoce a Rose Beuret, su compañera de toda la vida. \
Un viaje a Italia, en 1875–1876, le revela a Miguel Ángel. Su Edad de bronce, expuesta \
en 1877, es tan verídica que se le acusa de haberla moldeado del natural. En 1880, el Estado le \
encarga La puerta del Infierno, inspirada en Dante, en la que trabajará hasta \
su muerte, y de la que nacen El pensador y El beso. Vienen después Los burgueses de \
Calais y el Balzac, rechazado por sus comitentes en 1898. De 1883 a 1892 aproximadamente, \
vive una relación apasionada con la escultora Camille Claudel. La Exposición \
Universal de 1900, donde presenta sus obras en un pabellón propio, le \
procura una gloria internacional. Instalado en Meudon y en el hôtel Biron, dona en \
1916 su obra al Estado; se casa con Rose en enero de 1917 y muere pocos meses \
después de ella."""
style = """
Rodin libera la escultura de las convenciones académicas: modela por bultos y \
hendiduras que hacen vibrar la luz, conserva la huella de los dedos, se atreve con el fragmento, \
lo inacabado, el ensamblaje de figuras. El cuerpo expresa el pensamiento y la pasión. \
Considerado el padre de la escultura moderna, formó o influyó en Claudel, \
Bourdelle, Brancusi y muchos otros."""

[[artistes]]
nom = "Camille Claudel"
vie = "Fère-en-Tardenois (Aisne), 8 de diciembre de 1864 – Montfavet (Vaucluse), 19 de octubre de 1943"
biographie = """
Hermana mayor del poeta Paul Claudel, Camille Claudel modela la arcilla desde la infancia. En \
Nogent-sur-Seine, el escultor Alfred Boucher la alienta; en París, sigue los \
cursos de la academia Colarossi. Boucher la presenta a Rodin, que la admite \
hacia 1884 en su taller: trabaja en las manos y los pies de las figuras de \
La puerta del Infierno y de Los burgueses de Calais. Se convierte en su alumna, su \
colaboradora, su modelo y su amante. Esculpe Sakountala, El vals, \
retratos impresionantes. La ruptura con Rodin, en los años 1890, la deja \
sola, sin protector ni dinero; crea entonces sus obras más \
personales, La edad madura, Las conversadoras, La ola. Poco a poco, se aísla, se cree \
perseguida por Rodin y destruye una parte de sus obras. En marzo de 1913, una \
semana después de la muerte de su padre, su familia la hace internar. Pasa los treinta \
últimos años de su vida en un asilo, en Ville-Évrard y luego en Montdevergues, cerca \
de Aviñón, sin volver a esculpir. Un museo le está consagrado en Nogent-sur-Seine \
desde 2017."""
style = """
Formada junto a Rodin, Camille Claudel se distingue de él por el gusto del relato, de las \
composiciones en movimiento y de los pequeños grupos de la vida cotidiana, inspirados \
a veces en el arte japonés. Trabaja con virtuosismo el mármol, el ónice y el \
bronce. Largo tiempo reducida a su papel junto a Rodin, hoy se la reconoce \
como una escultora mayor."""

[[artistes]]
nom = "Edgar Degas"
vie = "París, 19 de julio de 1834 – París, 27 de septiembre de 1917"
biographie = """
Hijo de un banquero, Edgar Degas renuncia al derecho por la pintura. Ingresa \
brevemente en la Escuela de Bellas Artes, admira a Ingres y pasa tres años en Italia, \
de 1856 a 1859, copiando a los maestros. Comienza con cuadros de historia y \
retratos, y luego se vuelca en la vida moderna: carreras de caballos, cafés-concierto, \
lavanderas y, sobre todo, bailarinas de la Ópera, a las que observa en los ensayos y \
entre bastidores. Participa en la organización de las exposiciones impresionistas a partir \
de 1874, rechazando al mismo tiempo la etiqueta y la pintura al aire libre. Practica el \
pastel, el grabado, el monotipo, la fotografía. Con la vista en declive, trabaja cada vez \
más en escultura, en el secreto de su taller, modelando en cera \
bailarinas, caballos y mujeres en su aseo. Solo muestra al público una \
escultura, la Pequeña bailarina de catorce años, en 1881. A su muerte, se encuentran \
en el taller más de ciento cincuenta ceras, muchas de las cuales se funden después en \
bronce."""
style = """
Degas compone como un fotógrafo: encuadres cortados, puntos de vista picados, \
gestos captados al vuelo. Dibujante sin par, busca la verdad del movimiento y \
del oficio. En escultura, trabaja la cera con libertad, como un estudio, y se atreve a \
mezclar materiales reales. Sus ceras, descubiertas tras su muerte, fueron una \
revelación para los escultores del siglo XX."""

[[artistes]]
nom = "Antoine Bourdelle"
vie = "Montauban, 30 de octubre de 1861 – Le Vésinet, 1 de octubre de 1929"
biographie = """
Hijo de un ebanista, Antoine Bourdelle aprende a tallar la madera en \
el taller paterno, estudia luego en la Escuela de Bellas Artes de Toulouse y en la de \
París, que abandona pronto, rechazando la enseñanza académica. Se instala en \
el barrio de Montparnasse, donde conservará su taller toda la vida. Su monumento \
a los muertos de la guerra de 1870, en Montauban, terminado a principios de siglo, sorprende por \
su violencia expresiva. De 1893 a 1908, trabaja como oficial para Rodin, \
que lo estima mucho. Se libera de él con el Heracles arquero, en 1909, y después \
con los relieves del teatro de los Campos Elíseos, inspirados en Isadora Duncan. \
Realiza grandes monumentos, entre ellos el del general Alvear en Buenos Aires y el \
del poeta Adam Mickiewicz en París. Profesor en la academia de la Grande Chaumière, \
forma a numerosos alumnos, entre ellos Alberto Giacometti y Germaine Richier. \
Su taller se convirtió en el museo Bourdelle en 1949."""
style = """
Bourdelle busca en la escultura griega arcaica y en el arte románico una \
grandeza arquitectónica: planos tajantes, volúmenes simplificados, composiciones \
construidas. Conserva de Rodin el sentido del drama y de la energía, pero los somete a \
la estructura. Su arte establece el vínculo entre Rodin y la escultura monumental del siglo \
XX."""

[[artistes]]
nom = "Aristide Maillol"
vie = "Banyuls-sur-Mer, 8 de diciembre de 1861 – Banyuls-sur-Mer, 27 de septiembre de 1944"
biographie = """
Nacido a orillas del Mediterráneo, en los Pirineos Orientales, Aristide Maillol sube \
a París para ser pintor e ingresa en la Escuela de Bellas Artes. Se une a los \
Nabis, pinta lienzos decorativos y funda en Banyuls un taller de tapices. \
Hacia 1900, una enfermedad de los ojos lo obliga a abandonar ese trabajo minucioso: se \
consagra a la escultura, primero en madera y terracota, luego en piedra y \
bronce. El Mediterráneo, presentado en el Salón de Otoño de 1905, lo hace célebre. El \
conde Harry Kessler se convierte en su mecenas, lo lleva a Grecia en 1908 y publica \
libros ilustrados con sus xilografías. Maillol reparte su vida entre \
Marly-le-Roi y Banyuls, y esculpe casi únicamente el cuerpo femenino, así como \
monumentos a los muertos para las ciudades de su región. A partir de 1934, Dina Vierny \
se convierte en su modelo; fundará en París el museo Maillol. Muere en 1944, a \
consecuencia de un accidente de automóvil."""
style = """
Maillol opone a Rodin una escultura de la calma y de la plenitud: mujeres de \
formas plenas, de poses sencillas, de volúmenes cerrados y superficies lisas. \
Recupera el espíritu de la Grecia clásica sin copiarla. Su clasicismo moderno \
marcó profundamente la escultura europea de la primera mitad del siglo XX."""
