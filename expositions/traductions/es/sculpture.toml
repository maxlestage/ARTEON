[[oeuvres]]
titre = "Pequeña bailarina de catorce años"
artiste = "Edgar Degas"
annee = "1878–1881"
image = "petite-danseuse.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Edgar_Degas,_Little_Dancer_Aged_Fourteen,_1878-1881,_NGA_110292.jpg"
technique = "Cera, cabello, cinta de seda, tutú y zapatillas de tela; casi un metro de altura"
collection = "Galería Nacional de Arte, Washington"
note = "La única escultura que Degas expuso: una pequeña bailarina de la Ópera, de cera, vestida con un tutú de verdad."
description = """
Una adolescente delgada está de pie, con la cabeza alzada, los ojos entornados. Sus manos \
están unidas a la espalda, sus brazos tendidos hacia atrás, y su pierna derecha está \
adelantada, con el pie vuelto hacia fuera, en una posición de danza en reposo. \
Lleva un corpiño ajustado, un tutú de tul y zapatillas; su cabello, cabello \
auténtico, está recogido en una trenza con una cinta. El rostro, con la barbilla adelantada y los \
labios apretados, no está idealizado. En la fotografía, la cera tostada de la piel \
contrasta con la tela amarillenta del corpiño y el gris del tutú, sobre un fondo gris liso."""
evocation = """
Degas muestra una «petite rat» de la Ópera, una de esas niñas de familias pobres \
que ingresaban muy jóvenes en la escuela de danza. La pose orgullosa, con la barbilla en alto, dice a la \
vez la disciplina del oficio y una forma de desafío. En 1881, los críticos se \
escandalizan: hablan de fealdad, de vicio, de tipo criminal, lo que dice mucho sobre \
la mirada que se dirigía entonces a estas niñas. Hoy se ve más bien una figura \
de una verdad asombrosa y una de las obras más modernas de su tiempo: la \
escultura abandona el mármol y el mito por la realidad de la vida moderna."""
histoire = """
La modelo es Marie van Goethem, joven alumna de la escuela de danza de la Ópera de París, \
de una familia de origen belga. Degas trabaja en la figura a partir de 1878, \
dibujando a su modelo desde todos los ángulos y modelando primero una versión desnuda. \
Anunciada en 1880, la escultura solo se presenta en la sexta exposición de los \
impresionistas, en 1881, en una vitrina de cristal. Después ya no sale del \
taller. Tras la muerte de Degas en 1917, la cera se encuentra y se vacía en \
bronce, a partir de 1922, en una treintena de ejemplares. La cera original, \
adquirida por el coleccionista Paul Mellon, ingresó en la National Gallery of Art \
con su colección."""
facture = """
Degas modela la figura en cera coloreada sobre una armadura de metal, con materiales \
de recuperación para rellenarla. Luego la viste con ropas auténticas: corpiño, \
tutú de tul, zapatillas de tela, peluca de cabello auténtico y cinta de seda. Recubre en parte las telas de cera para fundirlas con la \
figura. Esta mezcla de materias, entonces inédita en la escultura culta, recuerda \
las muñecas y las figuras de cera anatómicas; anuncia los ensamblajes del siglo \
XX."""
details = [
  "La cinta anudada sobre la trenza de cabello auténtico.",
  "Las manos unidas a la espalda, con los brazos tendidos.",
  "El pie derecho adelantado y vuelto hacia fuera.",
  "La barbilla alzada y los ojos entornados.",
]
themes = ["danza", "ópera", "infancia", "cera", "vida moderna"]
anecdote = """
En la exposición de 1881, la bailarina se presentaba en una vitrina de cristal, \
como un espécimen de museo: una elección deliberada de Degas, que reforzó el malestar \
de numerosos visitantes."""
