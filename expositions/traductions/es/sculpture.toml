[exposition]
ordre = 145
nom_court = "Escultura"
mouvement = "La escultura, del Renacimiento a Rodin"
cadre = "vitrine"
couleur = "#6b4f2e"
titre = "La escultura, del mármol de Miguel Ángel al bronce de Rodin"
artiste = "Miguel Ángel, Bernini, Canova, Carpeaux, Rodin, Claudel, Degas…"
dates = "1513–1909"
accroche = "Exposición virtual · Museo Rodin, París"
introduction = """
Cuatro siglos de escultura, del mármol que Miguel Ángel arranca al bloque hasta el \
bronce de Rodin, que hace de la materia un drama y de la superficie una vibración. \
La visita reúne diez obras de nueve escultores, de Bernini a Maillol, presentadas mediante \
fotografías en vitrinas, como en un gabinete de aficionado. El edificio \
se inspira en el hôtel Biron, donde Rodin se instaló en 1908 y que se ha convertido en el museo \
Rodin: un vestíbulo donde aguarda El pensador y luego una sucesión de cuatro salones de \
boiseries claras, alineados como frente al jardín."""
vitrine = "baiser.jpg"

[musee]
nom = "Museo Rodin (hôtel Biron)"
ville = "París, Francia"
architecte = "Jean Aubert"
construction = "1727–1732"
presentation = """
El hôtel Biron se construye entre 1727 y 1732, en la rue de Varenne, para Abraham Peyrenc de \
Moras, un financiero enriquecido. Toma más tarde el nombre del mariscal de Biron, que \
lo ocupa a partir de 1753 y manda trazar sus jardines. En el siglo XIX, las \
religiosas del Sagrado Corazón instalan en él un internado de señoritas. Cuando la ley \
les prohíbe enseñar, en 1904, deben marcharse, y el Estado alquila las estancias \
a artistas: Matisse, Cocteau, la bailarina Isadora Duncan, el poeta Rilke, que \
da a conocer el lugar a Rodin. El escultor alquila allí unos salones a partir de 1908. En \
1916, dona al Estado sus obras y sus colecciones, con la condición de que se \
presenten aquí: el museo abre en 1919, dos años después de su muerte. En los salones de \
boiseries rocalla, iluminados por altas ventanas, pueden verse hoy sus \
mármoles, sus yesos y la sala de Camille Claudel; el jardín alberga El pensador, \
La puerta del Infierno y Los burgueses de Calais."""
ici = """
El edificio de ARTEON evoca la planta baja del hôtel Biron. Se entra por el sur \
en el vestíbulo, donde El pensador recibe al visitante. Al norte se abre el gran \
salón, de siete metros y medio de altura, consagrado a La puerta del Infierno. Da paso a una \
sucesión de salones alineados de oeste a este, como los que dan al jardín: al \
oeste, la galería de los maestros antiguos, de Miguel Ángel a Canova; al este, la sala \
Claudel y Degas y, al final de la sucesión, la sala «Después de Rodin». Los muros, \
crema, gris perla o verde pálido, recuerdan las boiseries pintadas del hôtel."""

