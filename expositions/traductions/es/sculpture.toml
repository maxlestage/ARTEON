[[oeuvres]]
titre = "El beso"
artiste = "Auguste Rodin"
annee = "1882–1898"
image = "baiser.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Rodin_TheKiss_20050609.JPG"
technique = "Mármol, 1,82 m de altura"
collection = "Museo Rodin, París"
note = "Paolo y Francesca, los amantes del Infierno de Dante, sorprendidos en el instante de su primer beso."
description = """
Sobre un bloque de mármol que ha quedado en bruto, un hombre y una mujer desnudos están sentados, abrazados. La \
mujer ha pasado el brazo alrededor del cuello del hombre y alza hacia él su rostro; una \
de sus piernas reposa sobre la de su compañero. El hombre se inclina para besarla; \
su mano, posada en el muslo de la mujer, parece dudar en tocarla, y la otra \
sostiene un libro, casi oculto. Los rostros, medio ocultos, se unen en lo \
alto del grupo. Los cuerpos son lisos y pulidos, la roca rugosa. La fotografía \
muestra la obra en un salón del hôtel Biron, ante boiseries oscuras, sobre un \
parqué de motivos."""
evocation = """
El grupo representa ante todo a Paolo Malatesta y Francesca da Rimini, a quienes Dante \
encuentra en el círculo de los lujuriosos: leyendo juntos la historia de Lancelot \
y Ginebra, se besaron, y el marido de Francesca los mató. Rodin los \
muestra antes de la falta y del castigo, en el ímpetu del deseo. Una vez fuera de la \
Puerta del Infierno, el grupo pierde su relato y se convierte en «el Beso», imagen \
universal del amor carnal, tierno y compartido. Se ha subrayado a menudo que la \
mujer toma la iniciativa tanto como el hombre. Para el propio Rodin, la obra seguía siendo \
más tradicional que sus búsquedas más audaces."""
histoire = """
Rodin modela la pareja hacia 1882 para La puerta del Infierno y luego la retira de la \
composición, quizá porque su felicidad concuerda mal con la desesperación de las \
demás figuras. El grupo conoce pronto el éxito en yeso y en bronce. En 1888, \
el Estado encarga una ampliación en mármol; Rodin la hace tallar por \
oficiales y la presenta en el Salón de 1898, junto al yeso de su Balzac. Expuesto \
después en el museo del Luxemburgo, entonces museo de los artistas vivos, se incorpora al museo Rodin, en el hôtel Biron, con la apertura \
de este en 1919. El beso es hoy la obra más célebre del museo, \
presentada en la planta baja."""
facture = """
Como la mayoría de los escultores de su tiempo, Rodin no tallaba él mismo sus \
mármoles: modelaba en arcilla, y unos oficiales trasladaban el modelo a la \
piedra mediante puntos, bajo su control. Exige aquí un pulido muy suave sobre \
los cuerpos, que parecen bañados de luz, y deja en bruto el bloque en el que \
están sentados: la vida nace de la materia informe, a la manera del non finito de \
Miguel Ángel. La composición es cerrada, casi cúbica, y los dos cuerpos se \
responden en diagonales."""
details = [
  "La mano del hombre, posada en el muslo de la mujer, apenas apoyada.",
  "El brazo de la mujer, pasado tras el cuello de su amante.",
  "El contraste entre la piel pulida y la roca dejada en bruto.",
  "El libro que sostiene el hombre, recuerdo de la lectura que perdió a los amantes.",
]
themes = ["amor", "dante", "beso", "mármol", "deseo"]
anecdote = """
Existen tres grandes mármoles de El beso tallados en vida de Rodin: el \
del Estado francés, en el museo Rodin, el encargado por el coleccionista Edward Perry \
Warren, hoy en la Tate de Londres, y el de Carl Jacobsen, en la Ny \
Carlsberg Glyptotek de Copenhague."""
salle = 3
mur = "nord"
place = 2
largeur = 1.8

[[oeuvres]]
titre = "La edad madura"
artiste = "Camille Claudel"
annee = "1899 (segunda versión)"
image = "age-mur.jpg"
credit = "Photo : Jean-Pierre Dalbéra"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Lâge_mur_(Musée_Rodin)_(4921654776).jpg"
technique = "Bronce, fundición hacia 1913"
collection = "Museo Rodin, París (donación de Paul Claudel, 1952)"
note = "Un hombre maduro se aleja, arrastrado por una vieja, mientras una joven de rodillas tiende los brazos hacia él."
description = """
Sobre una base alargada, ondulada como una ola o un terreno en pendiente, tres figuras \
desnudas se suceden. A la izquierda, una vieja descarnada, envuelta en un gran paño \
que ondea tras ella como alas, arrastra a un hombre de edad madura sujetándolo \
por los hombros. Él avanza tambaleándose, con las rodillas flexionadas, el brazo izquierdo tendido hacia \
atrás. A la derecha, una joven arrodillada tiende los dos brazos hacia él; sus \
manos ya no se tocan. Todo el grupo se inclina hacia la izquierda, como arrastrado. En \
la fotografía, tomada en el museo Rodin, el bronce oscuro se destaca ante los muros \
rosas y el gran espejo de un salón."""
evocation = """
La obra se ha leído como una alegoría del paso del tiempo: el hombre deja la juventud \
para seguir a la vejez, o a la muerte, que se lo lleva. Pero casi siempre se ve en ella \
también la historia de la artista: Rodin, dividido entre Camille Claudel, la joven \
suplicante, y su compañera Rose Beuret, a quien sigue apegado. Paul Claudel, \
hermano de Camille, veía en ella a su hermana de rodillas, suplicante, abandonada. Claudel \
va sin embargo más allá del relato personal: el vacío entre las manos, el movimiento del \
paño, la pendiente del suelo hacen de la separación un drama universal, esculpido con una \
fuerza que solo a ella pertenece."""
histoire = """
Camille Claudel concibe el grupo en 1893–1894, en el momento en que se separa de \
Rodin. El Estado encarga un bronce en 1895, pero el encargo se anula en 1899, \
decisión en la que la escultora vio la mano de Rodin. Retoma entonces \
la composición, hace una segunda versión y la manda fundir en 1902 para un \
coleccionista, el capitán Tissier: ese bronce está en el museo de Orsay. El ejemplar \
del museo Rodin, fundido hacia 1913, el año en que Camille Claudel es internada, fue \
donado en 1952 por Paul Claudel. Se presenta en el hôtel Biron en la sala \
consagrada a la escultora."""
facture = """
Claudel construye su grupo sobre una diagonal que parte de la joven y asciende \
hacia el paño de la vieja, siguiendo los brazos tendidos. El paño, hinchado \
como una vela, es un alarde de virtuosismo: arrastra la composición. Los \
cuerpos, modelados con precisión, conservan las lecciones del taller de Rodin, pero la \
escultora añade una narración en friso, que se lee de derecha a izquierda. En la \
primera versión, el hombre sostenía aún la mano de la joven; en la \
segunda, las manos se han separado."""
details = [
  "El vacío entre las manos de la joven y la del hombre.",
  "El paño de la vieja, hinchado como alas.",
  "Las rodillas flexionadas del hombre, que avanza a su pesar.",
  "La base en pendiente, que arrastra a todo el grupo hacia la izquierda.",
]
themes = ["separación", "vejez", "destino", "autobiografía", "bronce"]
anecdote = """
La joven arrodillada fue editada también sola en bronce, con el título de \
La suplicante, por el fundidor y marchante Eugène Blot, que apoyó a Camille Claudel \
en sus años difíciles."""
