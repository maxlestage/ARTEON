[[oeuvres]]
titre = "La Trinidad"
artiste = "Andreï Roublev"
annee = "hacia 1411 o hacia 1425–1427"
image = "trinite-roublev.jpg"
technique = "Témpera sobre tabla de madera, 142 × 114 cm"
collection = "Galería Tretiakov, Moscú (confiada desde 2023 a la Iglesia ortodoxa rusa)"
note = "Tres ángeles sentados en torno a una mesa: el icono más venerado de Rusia, pintado en honor de san Sergio de Radonezh."
description = """
Tres ángeles de grandes alas doradas están sentados en torno a una mesa blanca, sobre la que se encuentra una copa que contiene la cabeza de un ternero. Tienen rostros semejantes, inclinados, y cada uno sostiene un fino bastón de viajero. El de la izquierda, erguido, lleva un manto de reflejos dorados; el del centro, con túnica púrpura y manto azul, inclina la cabeza hacia él; el de la derecha, con manto verde claro, se inclina también. Tras ellos, apenas indicados, aparecen una casa a la izquierda, un árbol en el centro, una roca a la derecha. El fondo dorado ha sufrido mucho y la superficie conserva las huellas de numerosas lagunas."""
evocation = """
El icono representa la hospitalidad de Abraham: según el Génesis, tres visitantes misteriosos se presentan ante él en la encina de Mambré. Los cristianos han visto en ello una imagen de la Trinidad. Rublev suprime a Abraham y a Sara para conservar solo a los tres ángeles, en diálogo silencioso: la tradición reconoce a menudo al Padre a la izquierda, al Hijo en el centro, ante el árbol que evoca la Cruz, y al Espíritu a la derecha, pero existen otras lecturas. La copa sobre la mesa recuerda el sacrificio y la eucaristía. El círculo en el que se inscriben las tres figuras expresa la unidad y el amor. Pintado para honrar a san Sergio, que predicaba la unidad en una Rusia dividida, el icono se ha convertido en un símbolo de paz y de contemplación."""
histoire = """
El icono fue pintado para la catedral de la Trinidad del monasterio fundado por san Sergio de Radonezh, en Serguiev Posad, al nordeste de Moscú, sin duda a petición de su sucesor, el higúmeno Nikon. Su fecha es discutida: hacia 1411 o hacia 1425–1427. En 1551, el concilio de los Cien Capítulos lo convierte en el modelo que debe seguirse para representar la Trinidad. Cubierto durante mucho tiempo por un revestimiento de orfebrería y por repintes, se despeja a partir de 1904 y luego más completamente en 1918–1919. Ingresado en 1929 en la galería Tretiakov, fue entregado en 2023 a la Iglesia ortodoxa rusa, pese a la inquietud de los restauradores por su conservación."""
facture = """
Rublev pinta al huevo sobre una tabla de tilo preparada con yeso. La composición está regida por la geometría: los tres ángeles se inscriben en un círculo, los dos ángeles laterales enmarcan al del centro como los lados de una copa. La perspectiva es llamada invertida: el escabel y la mesa se ensanchan hacia el fondo, lo que atrae al espectador hacia el interior de la imagen. Los colores son claros y luminosos, sobre todo el azul de lapislázuli, llamado golubets, que une las tres figuras."""
details = [
  "La copa en el centro de la mesa, con la cabeza del animal sacrificado.",
  "Los finos bastones rojos que sostienen los tres ángeles.",
  "El árbol de Mambré, sobre el ángel central.",
  "El pequeño rectángulo pintado en el frente de la mesa.",
  "Los escabeles dibujados en perspectiva invertida, bajo los pies de los ángeles.",
]
themes = ["icono", "trinidad", "ángeles", "hospitalidad", "ortodoxia"]
anecdote = """
La película Andréi Rublev de Andréi Tarkovski, rodada en blanco y negro y terminada en 1966, concluye con largos planos en color de los iconos del pintor, entre ellos la Trinidad."""
