[[oeuvres]]
titre = "La Dama del unicornio: «A mi único deseo»"
artiste = "Tapissiers anonymes"
annee = "hacia 1500"
image = "mon-seul-desir.jpg"
cadre = "aucun"
technique = "Tapiz de lana y seda, 377 × 473 cm"
collection = "Museo de Cluny – Museo Nacional de la Edad Media, París"
note = "El sexto y más misterioso de los tapices de la Dama del unicornio, rodeada de su divisa bordada sobre una tienda."
description = """
Sobre un fondo rojo sembrado de flores, pequeños árboles y animales, una isla azul noche, cubierta también de flores, sostiene la escena. En el centro, ante una gran tienda azul salpicada de llamitas de oro, una joven ricamente vestida está de pie. Sostiene un collar entre las manos, sobre un cofrecillo abierto que le presenta su doncella. A ambos lados, un león y un unicornio erguidos apartan los faldones de la tienda y portan estandartes rojos cruzados por una banda azul con tres lunas crecientes de plata. En lo alto de la tienda corre la inscripción «A mi único deseo». Un perrito está sentado sobre un cojín colocado en un banco; conejos, un perro, un mono, aves y árboles cargados de frutos pueblan todo el espacio, sin perspectiva ni sombra."""
evocation = """
Los otros cinco tapices de la serie ilustran los cinco sentidos: el gusto, el oído, la vista, el olfato y el tacto. Este, el mayor, sigue siendo un enigma. Según una lectura extendida, la dama deposita su collar en el cofrecillo: renunciaría a los placeres de los sentidos, dominados por el libre albedrío. Otros historiadores piensan, por el contrario, que lo toma y ven en la escena un sexto sentido, el del corazón, que gobierna a los otros cinco. La propia divisa se presta a ambos sentidos, amor cortés o deseo espiritual. El león y el unicornio, portadores de las armas, recuerdan la nobleza y la pureza; el jardín cerrado y florido evoca el paraíso. La obra resume la cultura refinada de finales de la Edad Media, entre devoción y arte de vivir aristocrático."""
histoire = """
Las armas, de gules con banda de azur cargada de tres lunas crecientes de plata, son las de los Le Viste, familia de juristas lioneses establecida en París; se duda entre Jean Le Viste, muerto en 1500, y uno de sus parientes como comitente. Los cartones se atribuyen a un pintor parisino, a menudo llamado el Maestro de Ana de Bretaña, y el tejido a un taller de los Países Bajos del Sur. En el siglo XIX, las seis piezas se encuentran en el castillo de Boussac, en la Creuse, donde el inspector de monumentos históricos Prosper Mérimée las advierte en 1841 y se alarma por su estado. George Sand las da a conocer en sus escritos. El Estado las compra en 1882 para el Museo de Cluny, donde se presentan en una sala redonda que se les dedica."""
facture = """
El tapiz está tejido en lana, con algunos realces de seda, sobre una urdimbre de lana: el tapicero reproduce punto por punto un cartón pintado a tamaño natural. El fondo llamado «de mil flores», sembrado de plantas y animales repartidos con regularidad, es típico de finales del siglo XV. Los colores, poco numerosos, proceden de tintes vegetales: la rubia para el rojo, el glasto para el azul, la gualda para el amarillo. Las figuras están dispuestas como en un escenario, sin sombra, para seguir siendo legibles desde lejos en el muro de un castillo."""
details = [
  "Las letras «A mi único deseo» en el lambrequín de la tienda.",
  "Las tres lunas crecientes de plata de los Le Viste en los dos estandartes.",
  "El perrito blanco sentado sobre un cojín, a la izquierda de la dama.",
  "Un pequeño mono en cuclillas a los pies de la dama, en la isla florida.",
  "Los conejos que se esconden un poco por todas partes en el fondo rojo.",
]
themes = ["tapiz", "unicornio", "deseo", "mil flores", "cinco sentidos"]
anecdote = """
Los tapices han ganado un público inesperado: en las películas de Harry Potter, los muros de la sala común de Gryffindor están cubiertos de reproducciones de la Dama del unicornio, cuyos fondos rojos combinan con los colores de la casa."""
salle = 1
mur = "ouest"
place = 1
largeur = 4.5

[[oeuvres]]
titre = "Maestà di Santa Trinita"
artiste = "Cimabue"
annee = "hacia 1280–1290"
image = "maesta-santa-trinita.jpg"
technique = "Témpera y oro sobre tabla, 385 × 223 cm"
collection = "Galería de los Uffizi, Florencia"
note = "La Virgen en majestad sobre un trono inmenso, rodeada de ocho ángeles: el gran retablo de Cimabue para la iglesia de Santa Trinita."
description = """
Sobre un fondo de oro, bajo un frontón puntiagudo, la Virgen está sentada en un trono monumental de madera dorada, taraceado y calado como una arquitectura. Lleva al Niño sobre la rodilla izquierda y lo señala con la mano derecha. Jesús, vestido como un pequeño adulto, bendice y sostiene un rollo. Ocho ángeles, cuatro a cada lado, están escalonados unos sobre otros a lo largo del trono, con sus alas multicolores formando como cortinas. Bajo el trono se abren tres arcadas: en ellas se ven cuatro profetas de medio cuerpo, dos a los lados que alzan los ojos, dos en el centro, uno de ellos un rey coronado, cada uno con una filacteria. El manto azul de María está surcado por finos realces de oro."""
evocation = """
La imagen sigue el modelo bizantino de la Virgen Hodigitria, «la que muestra el camino»: María presenta a su hijo como la vía de salvación. Los profetas del Antiguo Testamento, situados bajo el trono, son los cimientos sobre los que descansa la venida de Cristo; se los identifica con Jeremías, Abraham, David e Isaías, cuyos rollos llevan versículos que anuncian la Encarnación. El oro del fondo no representa ningún lugar: es la luz divina. Pero Cimabue empieza a dar a las figuras una presencia nueva, rostros más suaves, un trono que se hunde en el espacio. Los historiadores ven en ello un momento de transición, en el que la pintura italiana hereda todavía del icono a la vez que prepara la revolución de Giotto, su discípulo según la tradición."""
histoire = """
La tabla fue pintada para el altar mayor de la iglesia de Santa Trinita, en Florencia, atendida por los monjes de Vallombrosa. Su fecha sigue discutida, entre las décadas de 1280 y 1290. En el siglo XV, al haber cambiado el gusto, es sustituida en el altar por un retablo de Alesso Baldovinetti y relegada a una capilla y luego a los edificios del convento. Entra en las colecciones públicas florentinas en el siglo XIX y llega a la Galería de los Uffizi en 1919. Hoy se expone allí en la misma sala que las Vírgenes en majestad de Duccio y de Giotto, una cercanía convertida en lección de historia del arte: tres maneras de pintar el mismo tema, en una treintena de años."""
facture = """
Cimabue pinta a la témpera, con pigmentos aglutinados con yema de huevo, sobre una tabla de madera cubierta de yeso y cola. El oro se aplica en hojas sobre un bol rojo y luego se bruñe, y las aureolas están grabadas con pequeños punzones. Los pliegues de los vestidos se trazan con líneas de oro paralelas, una técnica bizantina llamada crisografía. El trono, visto en ligera perspectiva, crea un espacio todavía incierto, pero los rostros están modelados con sombras verdosas bajo las carnaciones, según la práctica de la época."""
details = [
  "Las alas de los ángeles, de plumas coloreadas en escamas del blanco al rojo.",
  "Los finos trazos de oro que surcan el manto azul de la Virgen.",
  "El rey David coronado, en el centro bajo el trono, junto a Abraham.",
  "Los dos profetas laterales que levantan la cabeza hacia la Virgen.",
]
themes = ["virgen en majestad", "fondo de oro", "ángeles", "profetas", "bizantino"]
anecdote = """
En 2019, una pequeña tabla de Cimabue, el Cristo burlado, fue descubierta en la cocina de una casa de Compiègne, donde pasaba por un icono sin valor. Vendida en subasta en Senlis, alcanzó los 24 millones de euros."""
salle = 2
mur = "ouest"
place = 4
largeur = 2.23

[[oeuvres]]
titre = "Maestà di Ognissanti"
artiste = "Giotto"
annee = "hacia 1306–1310"
image = "maesta-ognissanti.jpg"
technique = "Témpera y oro sobre tabla, 325 × 204 cm"
collection = "Galería de los Uffizi, Florencia"
note = "Una Virgen que por fin pesa sobre su trono: el gran retablo de Giotto para la iglesia de Ognissanti, en Florencia."
description = """
Bajo un frontón de fondo dorado, la Virgen se sienta en un tabernáculo gótico de mármol blanco, con pináculos, gabletes y arco trilobulado. Maciza, envuelta en un manto azul oscuro casi negro sobre una túnica blanca, sostiene al Niño sentado sobre su rodilla. El pequeño Jesús, con túnica rosa, bendice con la mano derecha y sostiene un rollo. A ambos lados del trono se apiñan santos y ángeles, vistos de perfil, los más lejanos ocultos en parte por los montantes. En primer plano, dos ángeles arrodillados ofrecen jarrones de flores, lirios y rosas; tras ellos, otros dos presentan una corona y un cofrecillo. El trono descansa sobre escalones de mármol veteado."""
evocation = """
Con Giotto, la Virgen deja de ser una imagen sagrada suspendida en el oro para convertirse en una presencia física: se sienten sus rodillas bajo el manto, el peso de su cuerpo sobre el asiento, y el Niño tiene la complexión de un bebé de verdad. Los ángeles y los santos, que contemplan la escena, ponen al espectador en la misma posición que ellos. Las flores ofrecidas tienen un sentido preciso: los lirios evocan la pureza de María, las rosas su amor y la Pasión venidera. A menudo se ha leído esta tabla como el acta de nacimiento de la pintura occidental moderna, fundada en la observación de lo real. Sin embargo, sigue siendo una imagen de culto, vuelta hacia el fiel, y el oro conserva en ella todo su valor."""
histoire = """
Giotto pinta este retablo hacia 1306–1310 para la iglesia florentina de Ognissanti, que pertenecía entonces a la orden religiosa de los Humillados. Acaba de terminar los frescos de la capilla de los Scrovegni en Padua y es el artista más reputado de Italia. La tabla, colocada en el altar principal de la iglesia, es citada con admiración en el siglo XV por el escultor Lorenzo Ghiberti en sus Comentarios. En el siglo XIX pasa a las colecciones de la Academia de Florencia y entra en 1919 en la Galería de los Uffizi. Se expone junto a las grandes Vírgenes en majestad de Cimabue y de Duccio, lo que permite medir de una ojeada todo lo que cambió en pocas décadas."""
facture = """
Giotto trabaja a la témpera sobre fondo de oro, como sus predecesores, pero abandona los trazos de oro bizantinos de los paños en favor de un modelado continuo, mediante degradados de sombra y de luz. El trono está construido con una perspectiva coherente: se ven sus lados en profundidad, a través de las aberturas. Las figuras se superponen parcialmente, lo que crea planos sucesivos. La gama es sobria, dominada por el azul oscuro del manto y el blanco de la túnica, y la luz parece venir de una única fuente."""
details = [
  "La boca entreabierta de la Virgen, que deja ver los dientes.",
  "La transparencia del velo blanco que cubre su pecho.",
  "Los jarrones de lirios y rosas que sostienen los ángeles arrodillados.",
  "Los rostros de los santos entrevistos a través de los calados del trono gótico.",
]
themes = ["virgen en majestad", "volumen", "realismo", "fondo de oro", "ángeles"]
anecdote = """
Dante dedicó dos versos a la gloria de Giotto en el Purgatorio: Cimabue creyó tener el primer puesto en la pintura, escribe, y ahora es Giotto quien tiene la fama, de modo que la de su maestro se oscurece."""
salle = 2
mur = "est"
place = 4
largeur = 2.04

[[oeuvres]]
titre = "La Virgen con el Niño rodeada de ángeles (Díptico de Melun)"
artiste = "Jean Fouquet"
annee = "hacia 1450–1455"
image = "vierge-de-melun.jpg"
technique = "Óleo sobre tabla de roble, 92 × 83,5 cm"
collection = "Real Museo de Bellas Artes (KMSKA), Amberes"
note = "El ala derecha del díptico encargado por Étienne Chevalier, tesorero de Carlos VII: una Virgen reina de extraña palidez."
description = """
La Virgen, sentada en un trono adornado de perlas y piedras preciosas, ocupa casi toda la altura de la tabla. Lleva una alta corona de oro y perlas y un gran manto forrado de armiño, abierto sobre un corpiño gris azulado desatado del que sale un seno redondo y blanco. Sus ojos están bajos. Sobre su rodilla, el Niño, desnudo y regordete, mira hacia la izquierda, con aire grave. Alrededor, los ángeles llenan el espacio: serafines rojo vivo y querubines azules, de cuerpos lisos como estatuas de cera, apretados unos contra otros. La tez de la Virgen y del Niño es de una blancura de porcelana, sin ninguna sombra de color."""
evocation = """
El violento contraste entre la palidez de las figuras santas y el rojo y el azul saturados de los ángeles da al cuadro su carácter irreal, casi moderno. Los serafines rojos, que arden de amor divino, y los querubines azules, que simbolizan el conocimiento, forman una corte celestial. María aparece en ella como una reina de corte, a la moda de la época: frente depilada, talle alto, corpiño con cordones. Una tradición atestiguada desde el siglo XVII quiere que tenga los rasgos de Agnès Sorel, favorita de Carlos VII, muerta en 1450, de quien Étienne Chevalier fue albacea. Nada lo prueba, pero esta idea ha alimentado la imagen de una obra en la que lo sagrado y la belleza profana se mezclan de manera turbadora."""
histoire = """
Étienne Chevalier, tesorero de Francia con Carlos VII, encarga este díptico para la colegiata de Nuestra Señora de Melun, su ciudad natal, donde su esposa Catherine Budé es enterrada en 1452. En el ala izquierda aparece arrodillado, presentado por su santo patrón, san Esteban; ante esta, reza a la Virgen. El díptico permanece en Melun hasta finales del siglo XVIII, cuando el cabildo lo vende. Las dos tablas se separan entonces. Esta se incorpora a la colección del burgomaestre de Amberes Florent van Ertborn, legada a su muerte, en 1840, al museo de Amberes. El ala de Étienne Chevalier, por su parte, se conserva en la Gemäldegalerie de Berlín."""
facture = """
Fouquet pinta al óleo, técnica procedente de los Países Bajos, con precisión de miniaturista: perlas, piedras talladas, piel de armiño y cordones están representados uno a uno. Pero simplifica los volúmenes hasta la geometría: la cabeza de la Virgen es un óvalo, su seno una esfera, los angelotes formas lisas como madera torneada. Esta alianza de detalle flamenco y de claridad monumental, aprendida quizá en Italia, es la marca de Fouquet. Los tres colores, blanco, rojo y azul, se aplican casi sin transición."""
details = [
  "Las perlas y las piedras talladas del trono y de la corona.",
  "El cordón dorado del corpiño, desatado sobre el pecho.",
  "Los serafines rojos y los querubines azules, sin un solo pliegue de vestido.",
  "El velo transparente que desciende de la corona tras la cabeza.",
]
themes = ["virgen con el niño", "ángeles", "corte de francia", "retrato", "color"]
anecdote = """
El marco original del díptico estaba adornado con medallones esmaltados. Uno de ellos, un autorretrato de Fouquet en esmalte pintado sobre cobre, se encuentra hoy en el Louvre: es uno de los autorretratos aislados más antiguos del arte occidental."""
salle = 3
mur = "sud"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Las muy ricas horas del duque de Berry: Enero"
artiste = "Frères de Limbourg"
annee = "hacia 1411–1416"
image = "tres-riches-heures-janvier.jpg"
technique = "Iluminación sobre pergamino, folio de unos 29 × 21 cm"
collection = "Museo Condé, Chantilly"
note = "El duque Juan de Berry recibe en su mesa por Año Nuevo: la página de enero del más célebre manuscrito iluminado del mundo."
description = """
En una gran sala cubierta con un tapiz de batalla, el duque Juan de Berry está sentado a la derecha, de perfil, vestido de azul y tocado con un gorro de piel. Tras él, una gran pantalla de mimbre redonda forma como una aureola. Ante él, una mesa cubierta con un mantel blanco sostiene platos, perritos y un gran salero de oro en forma de navío. A su lado está sentado un eclesiástico de rojo. Una multitud de cortesanos, criados, coperos y escuderos trinchantes se afana. Sobre la escena, un oficial invita a los visitantes: se leen las palabras «Aproche, aproche». Arriba, un semicírculo azul estrellado muestra el carro del sol y los signos de Capricornio y Acuario."""
evocation = """
La página celebra el primer mes del año, tiempo de aguinaldos, esos regalos que se intercambiaban en la corte, y el duque aparece en ella como un príncipe generoso y magnífico. Todo habla de lujo: vajilla de oro, telas bordadas con flores de lis y cisnes heridos, emblema del duque, perritos familiares hasta sobre la mesa. Se ha visto en ella el retrato de una corte francesa justo antes de los desastres de la guerra de los Cien Años, Azincourt en 1415. El calendario astronómico de lo alto recuerda que la vida humana se inscribe en el orden del cosmos y del tiempo. Las Muy ricas horas son también un libro de oraciones: la belleza terrenal prepara en él a la devoción."""
histoire = """
Juan de Berry, hermano del rey Carlos V y gran coleccionista, encarga hacia 1411 este libro de horas a los tres hermanos de Limbourg, Paul, Jean y Herman. En 1416, el duque y los tres pintores mueren el mismo año, sin duda de peste, dejando la obra inacabada. Es completada hacia 1440 por un pintor anónimo, al que a menudo se identifica con Barthélemy d'Eyck, y hacia 1485–1489 por Jean Colombe para el duque Carlos I de Saboya. En el siglo XIX, el duque de Aumale, hijo de Luis Felipe, lo compra en Italia en 1856 y lo coloca en su biblioteca de Chantilly, que dona en 1884 al Instituto de Francia junto con el castillo y todas sus colecciones."""
facture = """
Los pigmentos se aplican con goma sobre el pergamino, con pincel muy fino. El azul intenso procede del lapislázuli, piedra importada de Afganistán y más costosa que el oro; el oro, en hoja o en polvo, realza las vajillas y los bordados. Los Limbourg superponen los planos como en un decorado de teatro: mesa, comensales, tapiz, que se abre a su vez sobre una batalla. La precisión de los rostros y de las telas, a escala de unos milímetros, acerca estas páginas a la pintura de caballete."""
details = [
  "Las palabras «Aproche, aproche» escritas en letras de oro sobre el chambelán.",
  "El salero de oro en forma de navío, en la mesa, a la derecha del duque.",
  "Los perritos que pasean sobre el mantel, junto al duque.",
  "El galgo blanco tendido en primer plano, a la derecha.",
  "El carro del sol en el semicírculo azul, entre los signos del zodíaco.",
]
themes = ["iluminación", "calendario", "corte", "banquete", "zodíaco"]
anecdote = """
El duque de Aumale prohibió que sus colecciones se prestaran: el manuscrito no sale, pues, nunca de Chantilly. Frágil, casi nunca se expone, y la mayoría de los visitantes solo descubre un facsímil."""
salle = 3
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "La Coronación de la Virgen"
artiste = "Enguerrand Quarton"
annee = "1453–1454"
image = "couronnement-quarton.jpg"
technique = "Óleo sobre tabla, 183 × 220 cm"
collection = "Museo Pierre-de-Luxembourg, Villeneuve-lès-Avignon"
note = "Toda la creación, del cielo al infierno, en torno a la Virgen coronada: un retablo cuyo contrato de encargo se conserva."
description = """
En el centro de la parte alta, la Virgen, con vestido de brocado de oro, las manos cruzadas sobre el pecho y su gran manto azul extendido sobre una nube, es coronada por el Padre y el Hijo, representados idénticos, envueltos en rojo y oro. Entre ellos planea la paloma del Espíritu Santo, cuyas alas rozan sus bocas. A su alrededor, sobre fondo de oro, se apiñan los coros de los ángeles, los patriarcas, los apóstoles, los santos y las santas, y una multitud de elegidos de todas las condiciones, papas, reyes, monjes y simples fieles. Más abajo, bajo una franja de cielo, se extiende la tierra: a la izquierda Roma, a la derecha Jerusalén, en el centro un Cristo en la cruz, ante el cual un cartujo vestido de blanco reza de rodillas. Abajo del todo se abren el purgatorio, de donde los ángeles liberan a las almas, y el infierno."""
evocation = """
El retablo figura el orden entero del universo cristiano, del cielo al infierno, como una catedral en imagen. La Trinidad está en la cima; la Virgen, intercesora de los hombres, en el centro; la Iglesia terrenal, con sus dos capitales, Roma y Jerusalén, une los dos mundos; la Cruz es el eje de la salvación. La representación del Padre y del Hijo con rasgos rigurosamente semejantes afirma su igualdad en el seno de la Trinidad: es un punto de doctrina exigido por el contrato. El paisaje de la parte baja, con su mar y sus montañas, es uno de los primeros grandes paisajes naturales de la pintura francesa, y se ha querido reconocer en él lugares de Provenza."""
histoire = """
El 24 de abril de 1453, en Villeneuve-lès-Avignon, el sacerdote Jean de Montagnac firma un contrato con Enguerrand Quarton, pintor establecido en Aviñón, para un retablo destinado al altar de la capilla de la Trinidad, en la iglesia de la cartuja del Val-de-Bénédiction. Este contrato, conservado, es uno de los más detallados de la Edad Media: enumera los personajes, su lugar, las ciudades que deben representarse, dejando algunos puntos a la elección del pintor. La obra debía entregarse en septiembre de 1454. Permanece entre los cartujos hasta la Revolución y pasa luego al hospicio de la ciudad. Hoy se presenta en el museo Pierre-de-Luxembourg de Villeneuve-lès-Avignon."""
facture = """
Quarton, procedente del norte de Francia, une varias tradiciones: la precisión y el paisaje flamencos, la monumentalidad y la claridad de las formas italianas, el brillo de una luz mediterránea. Las figuras celestiales son grandes formas simples, de colores puros, rojo, azul y oro, dispuestas simétricamente. Las multitudes de elegidos están tratadas en cabezas apretadas, claramente individualizadas. Abajo, la escala cambia: la tierra se ve desde lo alto, minúscula, con un horizonte lejano que se pierde en la bruma azulada."""
details = [
  "El Padre y el Hijo, de rostros y vestidos idénticos.",
  "La paloma del Espíritu Santo, cuyas alas unen las dos bocas.",
  "El pequeño cartujo de hábito blanco arrodillado ante la cruz.",
  "Roma a la izquierda y Jerusalén a la derecha, en el paisaje terrenal.",
  "Las almas sacadas del purgatorio por ángeles, abajo del todo.",
]
themes = ["trinidad", "virgen", "paraíso", "infierno", "provenza"]
anecdote = """
El contrato precisaba que el Padre y el Hijo debían pintarse sin ninguna diferencia entre ellos. Quarton obedeció al pie de la letra: solo su posición, a uno y otro lado de la Virgen, permite distinguirlos."""
salle = 3
mur = "ouest"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "La Anunciación entre san Ansano y santa Margarita"
artiste = "Simone Martini"
annee = "1333"
image = "annonciation-martini.jpg"
technique = "Témpera y oro sobre tabla, 184 × 210 cm (305 × 265 cm con el marco)"
collection = "Galería de los Uffizi, Florencia"
note = "Pintada con su cuñado Lippo Memmi para la catedral de Siena: el ángel, la Virgen que retrocede y palabras de oro en relieve."
description = """
Sobre un fondo de oro casi continuo, bajo arcos góticos festoneados rematados por gabletes, el arcángel Gabriel acaba de posarse a la izquierda, con una rodilla aún en tierra, su manto escocés de cuadros hinchado por el impulso. Sostiene una rama de olivo y lleva una corona de follaje. De su boca sale el saludo, inscrito en letras de oro que cruzan la tabla hacia la Virgen. María, sentada en un trono a la derecha, se vuelve, con el cuerpo torcido en un movimiento de retroceso, recogiendo su manto azul contra el cuello; mantiene el pulgar en el libro que leía. Entre ellos, un jarrón de lirios. Arriba, la paloma rodeada de ángeles. A los lados, san Ansano y santa Margarita."""
evocation = """
El Evangelio de Lucas dice que María se turbó ante la palabra del ángel: Simone Martini traduce esta turbación con un gesto de retirada casi temeroso, de gran verdad humana bajo la elegancia de las líneas. Las palabras del ángel, «Ave gratia plena Dominus tecum», hechas visibles y en relieve, convierten la palabra divina en un objeto de luz. La rama de olivo, símbolo de paz, sustituye aquí al lirio que lleva habitualmente Gabriel; se ha visto en ello una alusión a Siena, que evitaba el lirio, emblema de su rival Florencia. San Ansano, el evangelizador de la ciudad, recuerda el destino cívico del retablo. Es la imagen misma del gótico sienés: refinamiento cortés y fervor místico."""
histoire = """
El retablo se encarga para el altar de San Ansano en la catedral de Siena, uno de los cuatro altares dedicados a los santos patronos de la ciudad. Una inscripción lo firma y lo fecha: Simone Martini y Lippo Memmi de Siena, 1333. Lippo, cuñado de Simone, pintó sin duda una parte de las figuras laterales. Trasladado más tarde al oratorio de Sant'Ansano in Castelvecchio, parte en 1799 hacia los Uffizi de Florencia, a cambio de dos cuadros de Luca Giordano. Su marco original fue sustituido en el siglo XIX por el actual encuadre neogótico. Hacia 1336, Simone Martini dejará Siena por la corte papal de Aviñón, donde morirá."""
facture = """
Todo descansa en la línea: contornos flexibles, curvas alargadas, pliegues que ondulan como una caligrafía. El oro ocupa lo esencial de la superficie y está trabajado de todas las maneras: bruñido, punzonado con motivos, grabado e incluso modelado en relieve para las letras del saludo. Los colores son escasos y preciosos: el azul de lapislázuli del manto de María, el rosa y el blanco, la tela escocesa del ángel. El espacio apenas se sugiere, mediante el trono y el suelo de mármol, en favor de un efecto de orfebrería."""
details = [
  "Las letras de oro en relieve que van de la boca del ángel a la Virgen.",
  "El manto escocés de cuadros de Gabriel, aún levantado por el vuelo.",
  "El pulgar de la Virgen metido en su libro para guardar la página.",
  "El jarrón de lirios en el centro, sobre el suelo de mármol.",
  "Los profetas pintados en los medallones de los gabletes, sobre los arcos.",
]
themes = ["anunciación", "ángel", "siena", "fondo de oro", "gótico"]
anecdote = """
En Aviñón, Simone Martini trabó amistad con Petrarca. Pintó para él un retrato de Laura, hoy perdido, que el poeta celebra en dos sonetos del Canzoniere."""
salle = 4
mur = "est"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "La Anunciación"
artiste = "Fra Angelico"
annee = "hacia 1425–1426"
image = "annonciation-fra-angelico.jpg"
technique = "Témpera y oro sobre tabla, 194 × 194 cm con la predela"
collection = "Museo del Prado, Madrid"
note = "Bajo un pórtico florentino, el ángel saluda a María, mientras Adán y Eva abandonan el jardín del Edén: la caída y la salvación, lado a lado."
description = """
A la derecha, un pórtico abierto, de columnas finas y bóvedas azul noche sembradas de estrellas de oro, cobija la escena. El ángel Gabriel, con túnica rosa bordada de oro, las grandes alas rayadas erguidas, se inclina con las manos cruzadas sobre el pecho. Frente a él, la Virgen, sentada, manto azul sobre túnica rosa, un libro abierto sobre las rodillas, cruza también los brazos y baja la cabeza. Detrás, una pequeña habitación con un banco. Un rayo de oro desciende en diagonal desde el ángulo superior izquierdo, donde aparecen dos manos, y porta la paloma del Espíritu Santo. A la izquierda, en un jardín rebosante de flores y árboles frutales, un ángel expulsa a Adán y Eva, vestidos con pieles, que se alejan llorando."""
evocation = """
El cuadro reúne en un mismo espacio la culpa y la reparación: Eva hizo entrar el pecado en el mundo, María, «nueva Eva», acoge al que debe redimirlo. El rayo que atraviesa el jardín del paraíso perdido para alcanzar a la Virgen une los dos episodios. Los gestos semejantes del ángel y de María, con los brazos cruzados, dicen la humildad y la aceptación. Una golondrina posada en la barra de hierro del pórtico se ha interpretado como el anuncio de la primavera y de la Resurrección. La arquitectura clara y mesurada, inspirada en las logias de Brunelleschi, muestra a un pintor dominico que reza mediante la imagen pero conoce las novedades del Renacimiento florentino."""
histoire = """
Fra Angelico pinta este retablo hacia 1425–1426 para la iglesia del convento de San Domenico, en Fiésole, en las colinas de Florencia, donde profesó sus votos. La predela, bajo la tabla principal, narra en cinco pequeñas escenas la vida de la Virgen. A principios del siglo XVII, el convento se desprende de ella y la obra llega a España, por intermediarios aún discutidos; acaba en el monasterio real de las Descalzas Reales de Madrid, de donde ingresa en el Museo del Prado en 1861. Una restauración concluida en 2019 le devolvió el brillo de sus colores y de su oro, con ocasión de una gran exposición que se le dedicó."""
facture = """
Fra Angelico alía la tradición gótica, el oro de las aureolas y de los rayos, la preciosidad de las telas, con la nueva perspectiva de Brunelleschi: las columnas, las bóvedas y la habitación del fondo se organizan según líneas de fuga coherentes. La luz es clara y uniforme, las sombras ligeras. Los colores son puros y luminosos, rosas, azules y blancos, aplicados en capas finas. El jardín del paraíso, tratado flor por flor, recuerda la minuciosidad de los iluminadores."""
details = [
  "Las dos manos divinas en el ángulo superior izquierdo, de donde parte el rayo.",
  "La paloma del Espíritu Santo que se desliza a lo largo del rayo de oro.",
  "La golondrina posada en la barra de hierro, sobre la columna central.",
  "El medallón esculpido de una cabeza barbada, en el centro de las arcadas.",
  "Adán y Eva vestidos con pieles, expulsados por un ángel hacia la izquierda.",
]
themes = ["anunciación", "paraíso", "perspectiva", "ángel", "dominico"]
anecdote = """
Fra Angelico no era un apodo en vida del pintor: se le llamaba fray Juan de Fiésole. El papa Juan Pablo II lo beatificó en 1982 y lo proclamó patrono de los artistas en 1984."""
salle = 4
mur = "nord"
place = 2
