[exposition]
ordre = 10
nom_court = "Edad Media"
mouvement = "Arte medieval y gótico"
cadre = "dore"
couleur = "#2e4a8c"
titre = "La Edad Media, el oro y la luz"
artiste = "Cimabue, Duccio, Giotto, Rublev, los Limbourg, Fouquet…"
dates = "hacia 1280–1500"
accroche = "Exposición virtual · Museo de Cluny, París"
introduction = """
Fondos de oro, iconos, retablos y miniaturas: desde finales del siglo XIII hasta 1500, la pintura aprende a dar peso a los cuerpos y profundidad al espacio sin renunciar al esplendor de lo sagrado. La visita reúne las tres grandes Vírgenes en majestad de Cimabue, Duccio y Giotto, la Anunciación sienesa de Simone Martini, la Trinidad de Andréi Rublev, Fra Angelico, los hermanos de Limbourg, Jean Fouquet y Enguerrand Quarton. El edificio se inspira en el Museo de Cluny, en París, alojado en un palacete gótico con su capilla, y dibuja una iglesia: un nártex donde aguarda la Dama del unicornio, una alta nave, dos capillas laterales y un ábside."""
vitrine = "trinite-roublev.jpg"

[musee]
nom = "Museo de Cluny"
ville = "París, Francia"
construction = "finales del siglo XV"
presentation = """
En el corazón del Barrio Latino, el Museo de Cluny reúne dos monumentos adosados: las termas galorromanas de Lutecia, cuya gran sala fría, el frigidarium, ha conservado su bóveda antigua, y el palacete que los abades de Cluny hacen construir a finales del siglo XV para sus estancias en París. Esta residencia de gótico flamígero, con su patio, su torreón de escalera y su capilla cuya bóveda descansa sobre un pilar central, es uno de los pocos grandes palacetes medievales conservados en la capital. En 1832, el coleccionista Alexandre Du Sommerard se instala en él con sus objetos de la Edad Media; tras su muerte, el Estado compra el palacete y la colección, y el museo abre en 1844. Hoy se ven en él esculturas, vidrieras, orfebrería, marfiles y tapices, y sobre todo el tapiz de la Dama del unicornio, adquirido en 1882 y presentado en una sala redonda que se le reserva. Renovado, el museo reabrió en 2022."""
ici = """
El edificio de ARTEON toma de Cluny la Dama del unicornio y su espíritu gótico, y dibuja el plano de una iglesia de muros de piedra clara. Se entra por el sur al nártex, ancho y poco profundo, donde está colgado el tapiz. Al norte se abre la nave, estrecha y de dieciséis metros de altura: «La nave · Las Maestà de Florencia». Hacia su extremo, dos puertas se enfrentan: al oeste la capilla de Francia, al este la capilla de la Anunciación, dos salas cuadradas más bajas. Al fondo de la nave, en el eje, el ábside, de catorce metros de altura, muestra la Madonna Rucellai desde la entrada."""

