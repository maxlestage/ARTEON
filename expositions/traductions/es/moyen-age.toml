[[oeuvres]]
titre = "La Madonna Rucellai"
artiste = "Duccio di Buoninsegna"
annee = "1285"
image = "madone-rucellai.jpg"
technique = "Témpera y oro sobre tabla, 450 × 290 cm"
collection = "Galería de los Uffizi, Florencia"
note = "Encargada a un sienés por una cofradía florentina en 1285: una de las mayores tablas pintadas del siglo XIII."
description = """
En una alta tabla con frontón, rodeada de un marco original sembrado de pequeños medallones de santos, la Virgen está sentada en un trono de madera calada, visto en escorzo, guarnecido con un paño de motivos. Lleva un manto azul oscuro bordeado de un galón de oro que serpentea hasta sus pies. El Niño, sobre sus rodillas, con túnica blanca y paño rosa, tiende la mano hacia su madre. Seis ángeles arrodillados, tres a cada lado, están superpuestos como si flotaran en el oro: sostienen el trono y alzan los ojos hacia María. Sus vestidos, rosas, malvas, verdes y azules, de tonos suaves y cambiantes, contrastan con la masa oscura del manto."""
evocation = """
Duccio conserva la solemnidad del icono bizantino, pero la suaviza: el rostro de la Virgen está impregnado de melancolía, el Niño esboza un gesto tierno, los ángeles parecen jóvenes cortesanos en adoración. Los historiadores reconocen en ello la elegancia que será la marca de la escuela sienesa, más sensible a la gracia de las líneas y de los colores que a la masa de los cuerpos. La cenefa de oro del manto, que dibuja un arabesco continuo, se compara a menudo con el arte gótico francés, que Duccio pudo conocer por los manuscritos y los objetos preciosos. La obra es también la imagen de una devoción colectiva: la de una cofradía laica que cantaba las alabanzas de la Virgen."""
histoire = """
El 15 de abril de 1285, la Compañía de los Laudesi, cofradía florentina que se reunía en la iglesia dominica de Santa Maria Novella para cantar alabanzas a la Virgen, firma un contrato con el sienés Duccio para una gran tabla. El cuadro toma más tarde el nombre de la capilla de la familia Rucellai, donde se coloca. Vasari, en el siglo XVI, lo atribuye a Cimabue, y este error dura hasta el siglo XX, cuando la comparación con el contrato y el análisis del estilo imponen el nombre de Duccio. La tabla entra en los Uffizi en 1948. Una restauración llevada a cabo a finales del siglo XX recuperó el azul del manto, oscurecido por repintes."""
facture = """
Duccio pinta a la témpera sobre un fondo de oro bruñido y punzonado. Las carnes están modeladas en capas finas sobre una base verde. El trono se presenta de tres cuartos, lo que abre un espacio, pero los ángeles no descansan sobre ningún suelo. Los colores claros y cambiantes de los vestidos, rosa que pasa a malva, verde al azul, son una firma sienesa. La cenefa de oro del manto, de pliegues sinuosos, introduce una línea flexible de inspiración gótica. El marco es original, con sus medallones pintados."""
details = [
  "El galón de oro que serpentea sobre el manto, hasta los pies de la Virgen.",
  "La estrella de oro en el hombro y en el velo de María.",
  "Los medallones de santos pintados en el marco original.",
  "Los pies descalzos de los ángeles arrodillados, posados en el vacío.",
]
themes = ["virgen en majestad", "siena", "ángeles", "fondo de oro", "cofradía"]
anecdote = """
En 1855, el pintor inglés Frederic Leighton expuso un cuadro que mostraba esta Madonna llevada en triunfo por las calles de Florencia, según una leyenda de Vasari; la reina Victoria lo compró. Entonces se la creía de Cimabue."""
