[[artistes]]
nom = "Tapissiers anonymes"
vie = "Cartones pintados en París, tejido en los Países Bajos del Sur, hacia 1500"
biographie = """
Los seis tapices de la Dama del unicornio no están firmados, como casi todos los tapices de finales de la Edad Media. Son fruto de un trabajo a varias manos. Un pintor concibe primero el dibujo general; aquí se reconoce el estilo de un artista parisino activo hacia 1500, llamado por convención el Maestro de Ana de Bretaña, a quien algunos historiadores identifican con Jean d'Ypres, autor de vidrieras, miniaturas y grabados para libros impresos. Un cartonista amplía después este modelo al tamaño real del tapiz. Por último, unos tapiceros, sin duda en un taller de los Países Bajos del Sur, la actual Bélgica, tejen la pieza. Los comitentes, los Le Viste, son una familia de juristas originaria de Lyon, convertida en poderosa al servicio del rey en París. En esa época, los tapices son los objetos más prestigiosos de una morada noble: calientan los muros, se transportan de castillo en castillo y exhiben la riqueza de su propietario. Su precio supera a menudo el de los cuadros."""
style = """
Estos tapices pertenecen al género «de mil flores», característico de finales del siglo XV y comienzos del XVI: un fondo liso sembrado de plantas floridas, aves y pequeños animales, sobre el que se destacan figuras elegantes. Los personajes, de trajes suntuosos, están dispuestos sin perspectiva, con gran claridad. Este estilo mezcla la observación de la naturaleza y el gusto cortés por el símbolo y la alegoría."""

[[artistes]]
nom = "Cimabue"
vie = "Florencia, hacia 1240 – ¿Pisa?, hacia 1302"
biographie = """
Cenni di Pepo, llamado Cimabue, nació en Florencia hacia 1240. Se sabe poco de su vida: algunos documentos y la reputación que le crearon Dante y luego Vasari, que en el siglo XVI lo convierte en el primero de los pintores modernos. En 1272 se le menciona en Roma. Trabaja después en Asís, en la basílica superior de San Francisco, donde pinta al fresco una Crucifixión y escenas de la vida de la Virgen y de los apóstoles, hoy muy deterioradas por la oxidación de los blancos de plomo. Pinta para Florencia dos grandes crucifijos, entre ellos el de Santa Croce, gravemente dañado por la inundación del Arno en 1966 y convertido en símbolo de ese desastre, y la Maestà de Santa Trinita. En 1301–1302 está en Pisa, donde realiza la figura de san Juan en el mosaico del ábside de la catedral, su única obra documentada con certeza. Muere poco después. Según la tradición, habría descubierto al joven Giotto dibujando una oveja sobre una piedra y lo habría acogido en su taller."""
style = """
Cimabue parte de la pintura bizantina, la maniera greca, con sus fondos de oro, sus figuras frontales y sus pliegues realzados con oro. Pero le da una energía nueva: rostros expresivos, cuerpos más macizos, tronos construidos en el espacio, emoción dramática en sus crucifijos. Abre el camino a Giotto y a Duccio."""

[[artistes]]
nom = "Giotto"
vie = "Colle di Vespignano (Toscana), hacia 1267 – Florencia, 8 de enero de 1337"
biographie = """
Giotto di Bondone nace hacia 1267 en el Mugello, al norte de Florencia, en una familia de campesinos. La tradición, referida por Vasari, cuenta que guardaba ovejas cuando Cimabue lo descubrió. Se formó sin duda en el taller de este. En la década de 1290, participa probablemente en la decoración de la basílica superior de Asís, con el ciclo de la vida de san Francisco, cuya atribución sigue discutida. Hacia 1303–1305, pinta en Padua los frescos de la capilla de los Scrovegni, su obra maestra: la vida de la Virgen y de Cristo en casi cuarenta escenas, bajo una bóveda azul estrellada. Trabaja después en Florencia, en Santa Croce para las capillas Bardi y Peruzzi, en Roma y en Nápoles para el rey Roberto de Anjou. Pintor más célebre de su tiempo, jefe de un gran taller, es también un hombre de negocios avisado. En 1334, Florencia lo nombra arquitecto de la catedral: diseña el campanario que lleva su nombre. Muere en 1337 y es enterrado en la catedral."""
style = """
Giotto rompe con las convenciones bizantinas: da a las figuras un volumen, un peso y emociones humanas, sitúa a los personajes en un espacio coherente y narra las historias sagradas con claridad dramática. Sus frescos sirvieron de escuela a generaciones de pintores, de Masaccio a Miguel Ángel, que lo copió."""

[[artistes]]
nom = "Jean Fouquet"
vie = "Tours, hacia 1420 – Tours, entre 1478 y 1481"
biographie = """
Jean Fouquet nace en Tours hacia 1420, en la época en que la corte de Carlos VII reside en el valle del Loira. Su formación es mal conocida; pudo trabajar en París, quizá junto al Maestro de Bedford, iluminador. Hacia 1445–1446, reside en Roma, donde pinta el retrato del papa Eugenio IV, hoy perdido, y descubre la arquitectura y la pintura del Renacimiento italiano. De regreso en Tours, abre un taller y trabaja para el rey y para los grandes oficiales de la corte: el retrato de Carlos VII y el del canciller Guillaume Jouvenel des Ursins, en el Louvre, el Díptico de Melun y el libro de horas de Étienne Chevalier, cuyas miniaturas están hoy dispersas, la mayoría en Chantilly. Ilustra también las Grandes Crónicas de Francia y las Antigüedades judías de Flavio Josefo. En 1475, Luis XI le concede el título de pintor del rey. Muere en Tours antes de 1481, y su nombre cae en el olvido hasta su redescubrimiento en el siglo XIX."""
style = """
Fouquet reúne dos mundos: la minuciosidad y la técnica al óleo de los pintores flamencos, y la claridad geométrica, la perspectiva y las arquitecturas antiguas descubiertas en Italia. Sus figuras son simples, monumentales, sus colores nítidos. Es el primer gran pintor del Renacimiento en Francia y un retratista de primer orden."""

[[artistes]]
nom = "Frères de Limbourg"
vie = "Nimega (ducado de Güeldres), nacidos hacia 1385–1390 – muertos los tres en 1416"
biographie = """
Paul, Jean y Herman de Limbourg nacen en Nimega, en la actual Holanda, en una familia de artistas: su padre es escultor en madera y su tío, Jean Malouel, es el pintor del duque de Borgoña. Muy jóvenes, Jean y Herman son enviados como aprendices a casa de un orfebre parisino. Hacia 1402, Felipe el Atrevido, duque de Borgoña, emplea a Paul y a Jean para ilustrar una Biblia moralizada. A la muerte de Felipe, en 1404, pasan al servicio de su hermano Juan, duque de Berry, uno de los mayores coleccionistas de su tiempo. Para él iluminan las Bellas horas, hoy en el Metropolitan Museum de Nueva York, y luego, a partir de 1411 aproximadamente, las Muy ricas horas. El duque los trata con favor: Paul recibe una casa en Bourges y el título de ayuda de cámara. En 1416, los tres hermanos mueren en pocos meses, quizá de una epidemia de peste, el mismo año que su protector, dejando inacabado su gran manuscrito."""
style = """
Los Limbourg llevan la iluminación gótica internacional a su cima: colores preciosos, elegancia de las siluetas, gusto por el lujo y los trajes. Añaden a ello una observación nueva de la naturaleza y de los lugares reales, castillos, paisajes, labores del campo, que anuncia la pintura flamenca de Van Eyck. Sus calendarios han fijado durante siglos la imagen que nos hacemos de la Edad Media."""

[[artistes]]
nom = "Enguerrand Quarton"
vie = "Diócesis de Laon (Picardía), hacia 1415–1420 – ¿Aviñón?, después de 1466"
biographie = """
Enguerrand Quarton, o Charonton, nace en la diócesis de Laon, en el norte de Francia, hacia 1415–1420. Se formó sin duda en el Norte, en contacto con la pintura flamenca, antes de descender a Provenza. Se le encuentra en Aix-en-Provence en 1444, en Arlés en 1446 y luego en Aviñón a partir de 1447, donde permanece activo hasta 1466. La ciudad, antigua residencia de los papas, es entonces una encrucijada de artistas llegados del Norte, de Italia y de España. Quarton es uno de los pocos pintores del siglo XV cuya obra queda fijada por contratos: en 1452 pinta con Pierre Villate una Virgen de la Misericordia para la familia Cadard, hoy en Chantilly; en 1453–1454, la Coronación de la Virgen de Villeneuve-lès-Avignon. Se le atribuye también la célebre Piedad de Villeneuve-lès-Avignon, en el Louvre, y algunas miniaturas. Su rastro se pierde después de 1466."""
style = """
Quarton es el principal maestro de la escuela de Aviñón. Asocia el realismo flamenco, la monumentalidad italiana y una luz meridional cruda, que recorta las formas con nitidez. Sus composiciones son rigurosas, simétricas y de gran intensidad espiritual. Sus paisajes, bañados de una luz clara, figuran entre los primeros de la pintura francesa, y sus figuras, simplificadas en grandes formas, tienen una fuerza escultórica."""

[[artistes]]
nom = "Simone Martini"
vie = "Siena, hacia 1284 – Aviñón, julio de 1344"
biographie = """
Simone Martini nace en Siena hacia 1284 y se formó sin duda en el entorno de Duccio. Su primera gran obra conocida es la Maestà pintada al fresco en 1315 en la sala del Consejo del Palacio Público de Siena, que retoca en 1321. Trabaja después para el rey Roberto de Anjou en Nápoles, que lo ennoblece en 1317, y luego en Pisa, en Orvieto y en Asís, donde decora la capilla de San Martín de la basílica inferior. En el Palacio Público de Siena se le atribuye también el célebre retrato ecuestre de Guidoriccio da Fogliano, cuya atribución es discutida. En 1324 se casa con Giovanna, hermana del pintor Lippo Memmi, con quien firma la Anunciación de 1333. Hacia 1335–1336, se instala en Aviñón, entonces sede del papado, donde pinta para la corte pontificia y traba amistad con Petrarca, que le encarga unas iluminaciones para su manuscrito de Virgilio. Muere en Aviñón en 1344."""
style = """
Simone Martini es el gran maestro del gótico sienés: líneas flexibles y elegantes, colores refinados, oro trabajado como orfebrería, figuras de gracia cortés. Sin embargo, sabe observar: gestos verdaderos, rostros expresivos, emociones matizadas. Su estancia en Aviñón difundió este estilo por toda Europa, donde alimentó el gótico internacional."""

[[artistes]]
nom = "Fra Angelico"
vie = "Vicchio (Toscana), hacia 1395 – Roma, 18 de febrero de 1455"
biographie = """
Guido di Pietro nace hacia 1395 en el Mugello, al norte de Florencia. Pintor ya formado, ingresa hacia 1420 en el convento dominico de San Domenico de Fiésole y toma el nombre de fray Juan, Fra Giovanni. Pinta entonces retablos para su convento y para las iglesias de Florencia y de Cortona. En 1436, los dominicos se instalan en el convento de San Marcos de Florencia, reconstruido a expensas de Cosme de Médicis. Fra Angelico y su taller cubren sus muros de frescos, uno en cada celda de monje, para ayudar a la meditación; el más célebre es la Anunciación en lo alto de la escalera. A partir de 1445, trabaja en Roma para los papas Eugenio IV y luego Nicolás V, de quien decora la capilla privada en el Vaticano, y en Orvieto. De 1450 a 1452 es prior de su convento de Fiésole. Muere en Roma en 1455 y es enterrado en Santa Maria sopra Minerva, donde su lápida lo muestra con hábito de dominico."""
style = """
Fra Angelico concilia la piedad y el esplendor del gótico, el oro, los colores claros y preciosos, con los descubrimientos del Renacimiento florentino: perspectiva, arquitectura antigua, volumen de los cuerpos. Su luz uniforme y serena, sus figuras recogidas, se ponen al servicio de la oración. Monje y artista a la vez, ha sido visto como el modelo del pintor cristiano, y sus ángeles músicos se han reproducido hasta el infinito."""

[[artistes]]
nom = "Duccio di Buoninsegna"
vie = "Siena, hacia 1255 – Siena, hacia 1318–1319"
biographie = """
Duccio di Buoninsegna nace en Siena hacia 1255. Se le menciona por primera vez en 1278, por la pintura de unos cofres destinados a los archivos del municipio. En 1285, una cofradía de Florencia le encarga la Madonna Rucellai, prueba de que su reputación rebasa ya su ciudad. Su vida privada es agitada: los archivos conservan huella de numerosas multas y deudas. Entre 1308 y 1311, pinta para el altar mayor de la catedral de Siena la Maestà, inmenso retablo pintado por sus dos caras: la Virgen en majestad rodeada de santos en el anverso, y en el reverso decenas de escenas de la vida de Cristo. El 9 de junio de 1311, es llevado en solemne procesión desde el taller hasta la catedral, al son de las campanas, por toda la ciudad. El retablo fue desmembrado en el siglo XVIII; lo esencial se conserva en el Museo de la Obra de la catedral de Siena. Duccio muere hacia 1318–1319, dejando deudas a sus hijos."""
style = """
Duccio es el fundador de la escuela sienesa. Humaniza la tradición bizantina: rostros suaves y pensativos, gestos tiernos, colores claros y cambiantes, líneas flexibles procedentes del gótico francés. Sus pequeñas escenas narrativas, en el reverso de la Maestà, figuran entre las más ingeniosas de su tiempo, y su influencia se advierte en Simone Martini y los hermanos Lorenzetti."""

[[artistes]]
nom = "Andreï Roublev"
vie = "Hacia 1360 – Moscú, monasterio Andrónikov, hacia 1428–1430"
biographie = """
No se conoce ni la fecha ni el lugar de nacimiento de Andréi Rublev, monje y pintor de iconos, nacido hacia 1360. Habría sido monje en el monasterio de la Trinidad fundado por san Sergio de Radonezh y luego en el monasterio Andrónikov de Moscú. La primera mención de su nombre data de 1405: trabaja con el célebre Teófanes el Griego y otro maestro, Prójor de Gorodets, en los iconos y los frescos de la catedral de la Anunciación, en el Kremlin de Moscú. En 1408, con el pintor Daniil Chiorni, pinta los frescos de la catedral de la Dormición en Vladímir, de los que se conserva una parte del Juicio Final. Trabaja después en el monasterio de la Trinidad, para el que pinta la Trinidad, y luego en el monasterio Andrónikov, donde muere hacia 1428–1430. Venerado muy pronto como modelo, fue canonizado por la Iglesia ortodoxa rusa en 1988. Pocas obras se le atribuyen con certeza."""
style = """
Rublev da al icono ruso su forma más pura: figuras alargadas y graciosas, rostros suaves y recogidos, composiciones basadas en el círculo, colores claros y luminosos, dominados por un azul célebre. A la tensión dramática de Teófanes el Griego, opone la paz y la armonía. Su arte siguió siendo la referencia de la iconografía rusa durante siglos."""
