[[oeuvres]]
titre = "La convaleciente"
artiste = "Gwen John"
annee = "hacia 1915–1925"
image = "la-convalescente.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.89676.html"
technique = "Óleo sobre lienzo, 41,3 × 33,8 cm"
collection = "National Gallery of Art, Washington"
note = "En un sillón de mimbre, una joven de vestido oscuro lee una carta junto a una taza rosa: un silencio pintado a media voz."
description = """
En un sillón de mimbre guarnecido con un cojín blanco está sentada una joven de largos cabellos castaños, ligeramente de tres cuartos. Lleva un vestido malva oscuro, casi violeta, que cae hasta el borde inferior del lienzo. Con los ojos bajos, lee una hoja blanca, quizá una carta, que sostiene con las dos manos sobre las rodillas. A la derecha, sobre una pequeña mesa redonda cubierta con un mantel blanco, hay una taza rosa sobre su platillo y una tetera pardo rojiza salpicada de puntos blancos. El muro del fondo, de un beige pálido, está sembrado de pequeñas manchas doradas, como un papel pintado. Todo es calma, todo es suave, sin una sombra marcada."""
evocation = """
El título dice la convalecencia, ese tiempo suspendido entre la enfermedad y la vida ordinaria, en el que se permanece sentado, leyendo y esperando. Gwen John no cuenta más: ni el contenido de la carta ni la enfermedad se precisan. La joven, absorta, parece ignorar que se la mira; su rostro pálido y sus párpados bajos dicen un cansancio apacible, casi una oración. Como a menudo en la artista, la figura solitaria en una habitación se convierte en la imagen de una vida interior, hecha de recogimiento y atención. Gwen John pintó este tema varias veces, con ligeras variaciones, como quien retoma una meditación."""
histoire = """
Nacida en Gales en 1876, hermana mayor del pintor Augustus John, Gwen John estudia en la Slade School de Londres y se instala en Francia en 1904. En París se convierte en modelo y amante de Rodin, y luego se retira a Meudon, donde lleva una vida cada vez más solitaria y se convierte al catolicismo. A partir de 1910, el abogado neoyorquino John Quinn pasa a ser su principal apoyo y le compra regularmente sus obras. Este cuadro lo adquiere a la artista en noviembre de 1924 la sucesión de Quinn, fallecido unos meses antes, y se vende en 1927 en Nueva York con el título de Muchacha leyendo una carta. Paul Mellon y su esposa lo compran en 1986 y lo donan en 1994 a la National Gallery of Art. Gwen John muere en Dieppe en 1939."""
facture = """
Gwen John pinta con pequeñas pinceladas secas y mates, puestas una junto a otra como teselas, sobre una preparación cretosa que absorbe el óleo. La paleta se reduce deliberadamente a unos pocos tonos próximos, beiges, grises, malvas y blancos, que solo realzan el rosa de la taza y el rojizo de la tetera. Las formas están simplificadas, los contornos difusos, sin sombras proyectadas: la luz es uniforme, difusa, como filtrada por una cortina. En algunos puntos, pequeñas faltas en la capa pictórica dejan ver el fondo claro, lo que refuerza el aspecto de fresco antiguo. El trenzado del sillón de mimbre apenas está esbozado, en unos pocos trazos ocre."""
details = [
  "La hoja blanca que la joven lee, con los ojos bajos.",
  "La taza rosa sobre su platillo, al borde de la mesa.",
  "La tetera pardo rojiza salpicada de puntos blancos.",
  "El sillón de mimbre, cuyo trenzado se adivina a la izquierda.",
  "Las pequeñas manchas doradas del papel pintado.",
]
themes = ["intimidad", "lectura", "convalecencia", "silencio", "habitación"]
anecdote = """
Gwen John posó para Rodin, en particular para la Musa de su monumento a Whistler, el pintor estadounidense que había sido su profesor en París."""
