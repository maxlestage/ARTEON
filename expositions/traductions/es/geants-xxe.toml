[exposition]
ordre = 195
nom_court = "Gigantes del siglo XX"
mouvement = "Los gigantes de principios del siglo XX: Matisse, Kandinsky, Klee, Rousseau, Redon, Modigliani…"
cadre = "noir"
couleur = "#9b2a1e"
titre = "Los gigantes de principios del siglo XX, de Matisse a Klee"
artiste = "Matisse, Kandinsky, Klee, Rousseau, Redon, Modigliani, Kollwitz…"
dates = "1900–1923"
accroche = "Exposición virtual · Museo Reina Sofía, Madrid"
introduction = """
Entre 1900 y 1923, un puñado de artistas cambia el rostro de la pintura. Matisse hace del color un tema en sí mismo, Kandinsky lo libera de los objetos, los cubistas desmontan las figuras en facetas; el Aduanero Rousseau, Odilon Redon y Paul Klee abren las puertas del sueño mucho antes que los surrealistas; Käthe Kollwitz, Modigliani, Paula Modersohn-Becker y Gwen John buscan la verdad de un rostro o el silencio de una habitación. Todos murieron hace mucho tiempo y sus obras son hoy de dominio público: los diez cuadros y estampas de esta visita proceden de museos de Chicago, Washington, Nueva York y Cleveland, que publican sus fotografías sin restricciones. Los gigantes que llegaron después, Picasso, Dalí o Frida Kahlo, siguen protegidos por los derechos de autor: aquí solo se evocan, nunca se muestran. El edificio se inspira en el Museo Reina Sofía de Madrid, el antiguo hospital convertido en museo del arte del siglo XX: un vestíbulo, una gran sala blanca para las vanguardias y, a ambos lados, dos salas más íntimas, una para el sueño, otra para los rostros."""
vitrine = "femme-aquarium.jpg"

[musee]
nom = "Museo Nacional Centro de Arte Reina Sofía"
ville = "Madrid, España"
architecte = "Francesco Sabatini; ampliación de Jean Nouvel"
construction = "finales del siglo XVIII; centro de arte desde 1986"
presentation = """
El Reina Sofía ocupa el antiguo Hospital General de Madrid, levantado en el siglo XVIII, en lo esencial durante el reinado de Carlos III: un inmenso edificio austero, ordenado en torno a patios interiores, cuya construcción dirigió el arquitecto Francesco Sabatini y del que solo se edificó una parte del proyecto. El hospital cierra en 1965; amenazado de demolición, el edificio es protegido, restaurado y abre en 1986 como centro de arte, antes de convertirse en 1988 en el museo nacional de arte moderno, con el nombre de la reina Sofía. Sus dos torres de ascensores de cristal, añadidas a la fachada, y la ampliación de Jean Nouvel, inaugurada en 2005 bajo una gran cubierta roja, lo han convertido en un hito del barrio de Atocha. El museo conserva obras de Picasso, Dalí, Miró y Juan Gris; su sala más célebre, en la segunda planta, es la del Guernica, llegado en 1992 con sus dibujos preparatorios."""
ici = """
El edificio de ARTEON toma del Reina Sofía sus muros blancos y las altas salas de antiguo hospital. Se entra por el sur en el vestíbulo Sabatini, de siete metros de altura, y después en la sala de las vanguardias, la más amplia, de dieciocho metros de ancho y nueve de alto, donde Matisse, Kandinsky y Marcoussis cuelgan uno junto a otro. Desde allí, una puerta al oeste conduce al gabinete del sueño, el de Klee, el Aduanero Rousseau y Redon; una puerta al este lleva a la sala de los rostros y la intimidad, la de Käthe Kollwitz, Modigliani, Paula Modersohn-Becker y Gwen John. Son dos salas de doce metros por diez, de muros blanco cálido, más bajas e íntimas."""

