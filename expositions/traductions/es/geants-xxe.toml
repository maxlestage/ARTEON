[[artistes]]
nom = "Henri Matisse"
vie = "Le Cateau-Cambrésis (Norte), 31 de diciembre de 1869 – Niza, 3 de noviembre de 1954"
biographie = """
Hijo de un comerciante de granos del norte de Francia, Henri Matisse se destina primero al derecho y trabaja como pasante de procurador. En 1890, inmovilizado por una apendicitis, recibe de su madre una caja de colores: es una revelación. Parte para París, ingresa en 1895 en la Escuela de Bellas Artes, en el taller de Gustave Moreau, descubre el impresionismo y a Cézanne, y luego la luz del Midi en Córcega. En 1898 se casa con Amélie Parayre. Tras un verano en Saint-Tropez junto a Signac en 1904, pinta en Collioure con Derain, en 1905, los lienzos que causan escándalo en el Salón de Otoño y lo convierten en el jefe de los «fauves». Apoyado por los Stein y luego por los coleccionistas rusos Shchukin y Morozov, abre una academia y viaja a Marruecos. A partir de 1917 trabaja sobre todo en Niza, donde pinta sus odaliscas. Gravemente enfermo en 1941, inventa en sus últimos años los gouaches recortados y concibe la capilla del Rosario de Vence. Muere en Niza en 1954."""
style = """
Matisse hace del color el motor de la pintura: puesto en planos puros, construye el espacio, la luz y la emoción sin recurrir al modelado ni a la perspectiva. Su dibujo, de gran economía, busca el arabesco esencial. Soñaba con un arte de equilibrio y serenidad, decorativo en el sentido más noble. Es uno de los grandes inventores de la pintura del siglo XX; sus interiores, sus papeles recortados y su libertad cromática alimentaron la abstracción estadounidense y a generaciones de pintores y creadores."""

[[artistes]]
nom = "Vassily Kandinsky"
vie = "Moscú, 16 de diciembre de 1866 – Neuilly-sur-Seine, 13 de diciembre de 1944"
biographie = """
Kandinsky estudia derecho y economía en Moscú y parece destinado a una carrera universitaria antes de abandonarlo todo, a los treinta años, por la pintura. Parte en 1896 a Múnich, donde funda un grupo de artistas y vive con la pintora Gabriele Münter, en Múnich y en Murnau. Sus paisajes se liberan poco a poco de la representación y, hacia 1910-1911, pinta sus primeros grandes lienzos abstractos. En 1911 publica De lo espiritual en el arte y funda con Franz Marc el Blaue Reiter, el Jinete Azul. La guerra lo devuelve a Rusia, donde participa en las instituciones artísticas de la revolución. De regreso a Alemania a finales de 1921, enseña en la Bauhaus de 1922 hasta su cierre por los nazis en 1933, en Weimar, Dessau y luego Berlín. Se instala entonces en Neuilly-sur-Seine, cerca de París, donde pinta hasta su muerte en 1944. En Estados Unidos es coleccionado muy pronto, primero por Arthur Jerome Eddy en Chicago y luego por Solomon R. Guggenheim en Nueva York."""
style = """
Kandinsky pasa de las manchas de color arremolinadas de sus años muniqueses a la geometría precisa del periodo de la Bauhaus, y luego a las formas flexibles, casi biológicas, de sus últimos años parisinos. En todo momento compara la pintura con la música: colores y formas deben actuar directamente sobre el alma, como sonidos. Pintor y teórico, dio al arte abstracto sus primeros textos fundacionales."""

[[artistes]]
nom = "Louis Marcoussis"
vie = "Varsovia, 1878 – Cusset (Allier), 1941"
biographie = """
Nacido Ludwik Markus en Varsovia, entonces en el Imperio ruso, el futuro Marcoussis estudia pintura en la Academia de Bellas Artes de Cracovia, se instala luego en París en 1903 y pasa por la academia Julian. Para vivir, dibuja durante varios años caricaturas para periódicos humorísticos. Hacia 1910 se relaciona con Guillaume Apollinaire, que le encuentra su nombre artístico, con Georges Braque y con Pablo Picasso, y adopta el cubismo; participa en 1912 en el Salón de la Sección de Oro. En 1913 se casa con la pintora Alice Halicka. Voluntario en el ejército francés durante la Primera Guerra Mundial, retoma después la pintura y realiza en particular pinturas sobre vidrio, inspiradas en el arte popular polaco. En la década de 1930 se consagra sobre todo al grabado e ilustra a poetas, entre ellos Apollinaire. Refugiado en el Allier tras la derrota de 1940, muere en Cusset, cerca de Vichy, en 1941."""
style = """
Marcoussis practica un cubismo elegante y legible, hecho de grandes planos nítidos, de gamas sordas de grises y azules caldeadas con rojos y pardos, de imitaciones de materias y de letras pintadas. Menos radical que Picasso o Braque, busca el equilibrio y la claridad de la composición. Grabador notable, dio al cubismo una versión poética y precisa, que se prolonga en sus estampas y sus ilustraciones."""

[[artistes]]
nom = "Paul Klee"
vie = "Münchenbuchsee (Suiza), 18 de diciembre de 1879 – Muralto (Suiza), 29 de junio de 1940"
biographie = """
Hijo de un profesor de música alemán y de una cantante suiza, Paul Klee crece en Berna y duda largo tiempo entre la música y la pintura. Estudia en Múnich, donde se establece y se relaciona con Kandinsky y los artistas del Blaue Reiter. En 1914, un viaje a Túnez con August Macke y Louis Moilliet le revela el color: anota entonces en su diario que el color y él ya son uno solo. Movilizado durante la guerra, es llamado en 1921 a la Bauhaus, en Weimar y luego en Dessau, donde enseña diez años y es vecino de Kandinsky. Profesor de la Academia de Düsseldorf a partir de 1931, es despedido por los nazis en 1933 y regresa a Berna. Afectado por una grave enfermedad de la piel, la esclerodermia, pinta sin embargo con una energía nueva cientos de obras en sus últimos años, antes de morir en 1940 en el Tesino."""
style = """
Klee inventa un universo poético donde se mezclan signos, escrituras, figuras, paisajes y arquitecturas imaginarias. Pasa libremente de la abstracción al dibujo casi infantil, con humor y fantasía, pero apoyándose en una reflexión teórica muy rigurosa sobre la línea, el color y el ritmo, inspirada en la música. Su inmensa obra, de más de nueve mil números, influyó en el surrealismo y en la abstracción de posguerra."""

[[artistes]]
nom = "Henri Rousseau"
vie = "Laval, 21 de mayo de 1844 – París, 2 de septiembre de 1910"
biographie = """
Hijo de un hojalatero de Laval, Henri Rousseau se convierte en pasante de un procurador y luego se alista en el ejército. En 1871 ingresa en el fielato de París, la administración que cobra los impuestos sobre las mercancías que entran en la ciudad: de ahí viene su apodo de Aduanero, aunque nunca fue aduanero. Pinta como autodidacta en sus ratos libres y expone a partir de 1886 en el Salón de los Independientes, abierto a todos, sin jurado. El público y la crítica se burlan de sus lienzos, que sigue enviando cada año. En 1893 se jubila para consagrarse a la pintura, da clases de violín y de dibujo y vive pobremente. Se relaciona con Alfred Jarry, también nacido en Laval, y luego con Apollinaire, Robert Delaunay y Picasso, que organiza en 1908 un banquete en su honor en el Bateau-Lavoir. Tras ¡Sorprendido!, su primera selva, en 1891, pinta una veintena a partir de 1904. Muere en septiembre de 1910 en el hospital Necker, poco después de haber expuesto El sueño."""
style = """
Rousseau pinta sin formación académica, con una aplicación minuciosa: contornos nítidos, colores lisos, perspectiva ingenua, figuras frontales. Sus selvas, inventadas a partir de los invernaderos parisinos y de imágenes de álbumes, tienen una extrañeza de sueño. Admirado por Picasso, Apollinaire y luego los surrealistas, abrió el camino al reconocimiento del arte naíf."""

[[artistes]]
nom = "Odilon Redon"
vie = "Burdeos, 20 de abril de 1840 – París, 6 de julio de 1916"
biographie = """
Bertrand Jean Redon, llamado Odilon, pasa una infancia solitaria en la finca familiar de Peyrelebade, en el Médoc. Estudia un tiempo arquitectura y luego pintura en París en el taller de Gérôme, sin éxito. Su verdadero encuentro es el del grabador Rodolphe Bresdin, en Burdeos, que le enseña el aguafuerte y la libertad de la imaginación. Durante más de veinte años, Redon trabaja en negro, al carboncillo y en litografía: los álbumes En el sueño, en 1879, A Edgar Poe, Los orígenes u Homenaje a Goya pueblan su obra de ojos flotantes, cabezas cortadas y monstruos. Huysmans lo celebra en A contrapelo en 1884, y los poetas simbolistas, con Mallarmé a la cabeza, se convierten en sus amigos. Hacia 1890, tras el nacimiento de su hijo Arï, se vuelve hacia el color, pastel y óleo, y pinta flores, mitos y grandes decoraciones, como las de la abadía de Fontfroide. Los Nabis lo veneran, y expone en el Armory Show de Nueva York en 1913."""
style = """
Redon quiere, según sus propias palabras, poner la lógica de lo visible al servicio de lo invisible. Sus negros, de una profunda suavidad aterciopelada, dan vida a criaturas nacidas del sueño y de la ciencia de su tiempo, microbios y seres híbridos. Sus colores, más tarde, se aplican en pinceladas preciosas que parecen irradiar. Independiente de toda escuela, abrió el camino a los Nabis, a Matisse y a los surrealistas, que veían en él a un precursor."""

[[artistes]]
nom = "Käthe Kollwitz"
vie = "Königsberg (Prusia Oriental), 8 de julio de 1867 – Moritzburg, cerca de Dresde, 22 de abril de 1945"
biographie = """
Nacida Käthe Schmidt en Königsberg en una familia liberal y muy religiosa, estudia dibujo y pintura en Berlín y Múnich, en las escuelas reservadas a las mujeres, pues las academias les estaban entonces cerradas. En 1891 se casa con el médico Karl Kollwitz y se instala con él en un barrio obrero del norte de Berlín, donde encuentra sus modelos entre los pacientes de su marido. Su ciclo grabado La revuelta de los tejedores, inspirado en una obra de Gerhart Hauptmann, la hace célebre a finales de la década de 1890, seguido de La guerra de los campesinos. En octubre de 1914, su hijo menor Peter muere en Flandes; ese duelo marca toda su obra, desde las xilografías del ciclo La guerra hasta el monumento de los Padres en duelo, terminado en 1932. Primera mujer elegida para la Academia Prusiana de las Artes, en 1919, es expulsada de ella por los nazis en 1933 y ya no puede exponer. Su marido muere en 1940, su nieto Peter cae en Rusia en 1942 y su casa de Berlín es destruida por las bombas en 1943. Refugiada en Moritzburg, muere allí pocos días antes del fin de la guerra."""
style = """
Grabadora y escultora ante todo, Käthe Kollwitz trabaja casi exclusivamente en blanco y negro, al aguafuerte, en litografía y en xilografía. Reduce el decorado a nada y concentra todo en los rostros, las manos y los cuerpos castigados: el hambre, el trabajo, la revuelta, la muerte, la maternidad. Su trazo ancho y grave, de gran economía, hace de ella una de las voces más fuertes del arte comprometido y del realismo expresionista alemán."""

[[artistes]]
nom = "Amedeo Modigliani"
vie = "Liorna (Italia), 12 de julio de 1884 – París, 24 de enero de 1920"
biographie = """
Nacido en Liorna en una familia judía sefardí culta pero arruinada, Amedeo Modigliani, de salud frágil, estudia pintura en Liorna, Florencia y Venecia, nutrido de los maestros del Renacimiento. En 1906 se instala en París, primero en Montmartre y luego en Montparnasse. Entre 1909 y 1914, animado por el escultor Constantin Brancusi, se consagra sobre todo a la escultura y talla cabezas de piedra alargadas, antes de que su salud lo obligue a renunciar a ello. De vuelta a la pintura, realiza los retratos de sus amigos, Soutine, Max Jacob, Cocteau, y una serie de desnudos; en su exposición en la galería Berthe Weill, en 1917, la policía exige su retirada el mismo día de la inauguración. Sus marchantes, Paul Guillaume y luego Léopold Zborowski, lo apoyan. En 1917 conoce a Jeanne Hébuterne, que le da una hija en 1918. Minado por la tuberculosis, el alcohol y la miseria, muere en 1920 a los treinta y cinco años, en el momento en que su pintura empieza a venderse."""
style = """
Modigliani creó una figura humana inmediatamente reconocible: rostro ovalado, cuello estirado, nariz larga, ojos almendrados a menudo sin pupilas, hombros caídos. Este canon une la gracia de los pintores sieneses y de Botticelli, la simplificación de la escultura africana y arcaica y la construcción de Cézanne. Ni fauve ni cubista, permanece al margen de los movimientos de su tiempo, pero comparte con los expresionistas la voluntad de traducir una presencia interior más que un parecido."""

[[artistes]]
nom = "Paula Modersohn-Becker"
vie = "Dresde, 8 de febrero de 1876 – Worpswede (cerca de Bremen), 20 de noviembre de 1907"
biographie = """
Nacida en Dresde en una familia culta establecida en Bremen en 1888, Paula Becker sigue una formación de maestra, como desean sus padres, mientras toma clases de dibujo y pintura en Londres y Berlín. En 1898 se une a Worpswede, colonia de artistas enclavada en las turberas cerca de Bremen, donde se relaciona con la escultora Clara Westhoff, futura esposa del poeta Rilke. Entre 1900 y 1907 hace cuatro estancias en París, donde descubre a Cézanne, a Gauguin, a los Nabis y los retratos de El Fayum. En 1901 se casa con el pintor Otto Modersohn, viudo y padre de una niña pequeña. Ahogándose en la vida conyugal y en el círculo de Worpswede, que juzga torpe su pintura, parte sola a París en 1906, donde pinta autorretratos y bodegones de una libertad nueva. De regreso en Worpswede, muere en noviembre de 1907, dieciocho días después del nacimiento de su hija Mathilde, a los treinta y un años. Solo había vendido unos pocos cuadros; dejaba más de setecientos."""
style = """
Paula Modersohn-Becker superó el realismo sentimental de los pintores de Worpswede en favor de una pintura de formas simples y macizas, de colores sordos y materia granulosa. Inspirada por Cézanne, Gauguin y el arte arcaico, pinta a las campesinas, los niños, las madres y sobre todo a sí misma, con una gravedad y una franqueza inéditas. Pionera del expresionismo alemán, es también una de las primeras mujeres que hicieron de su propio cuerpo el tema de su arte."""

[[artistes]]
nom = "Gwen John"
vie = "Haverfordwest (Gales), 22 de junio de 1876 – Dieppe, 18 de septiembre de 1939"
biographie = """
Hija de un procurador, Gwendolen Mary John crece en Tenby, en la costa de Gales, con su hermano menor Augustus, futuro pintor célebre. De 1895 a 1898 estudia en la Slade School of Fine Art de Londres y sigue luego en París la enseñanza de Whistler. En 1904 se instala en Francia, donde vivirá hasta su muerte. Se convierte en modelo y amante de Auguste Rodin, y luego se retira en 1911 a Meudon, donde se convierte al catolicismo y pinta, para las religiosas del convento vecino, una serie de retratos de su fundadora. A partir de 1910, el coleccionista neoyorquino John Quinn le compra regularmente sus obras y le asegura una preciosa independencia. Solo tiene una exposición individual en vida, en Londres, en 1926. Tras la muerte de Quinn, pinta cada vez menos y vive en gran soledad. Muere en Dieppe en 1939, largo tiempo eclipsada por la gloria de su hermano antes de ser reconocida como una de las grandes pintoras británicas de su siglo."""
style = """
Gwen John pinta casi siempre lo mismo: una mujer sola, sentada en una habitación, o un rincón de interior vacío, una silla, una ventana. Sus cuadros, a menudo pequeños, están hechos de pinceladas secas y mates, sobre preparaciones cretosas, en una gama de tonos muy próximos, grises, beiges, rosas apagados. Retoma un mismo motivo en varias versiones, con ligeras variaciones, y da a estas escenas silenciosas una intensidad casi religiosa."""
