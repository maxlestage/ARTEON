[[oeuvres]]
titre = "Mujer ante una pecera"
artiste = "Henri Matisse"
annee = "1921–1923"
image = "femme-aquarium.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/27984"
technique = "Óleo sobre lienzo, 81,2 × 100,2 cm"
collection = "Art Institute of Chicago"
note = "Con los codos apoyados en una mesa y la barbilla sobre los brazos, una joven mira dar vueltas a unos peces rojos: el Matisse sereno y ensimismado de los años de Niza."
description = """
En un interior cerrado, una joven de cabello castaño cortado a la altura de la barbilla está acodada en una mesa de madera clara. Ha cruzado los brazos y apoya en ellos la barbilla; su mirada, algo vaga, se posa en una pecera de cristal redonda, a la izquierda, donde nadan unos peces rojos. Delante de la pecera, unas piñas y una larga rama de abeto yacen sobre la mesa, no lejos de una pequeña tarjeta blanca. La joven viste una blusa rosa y se recuesta en un sillón acolchado. Tras ella, un biombo azul cubre casi todo el fondo con un motivo de anillos entrelazados; una franja de un verde vivo y, a la izquierda, una cortina de rayas dejan adivinar una ventana. La luz es uniforme, sin sombras dramáticas, y el borde inferior del lienzo corta la mesa muy cerca de nosotros."""
evocation = """
El cuadro no cuenta nada: muestra un tiempo suspendido, el de la ensoñación. La joven mira los peces como se mira el fuego o el mar, sin llegar a verlos del todo. Los peces rojos reaparecen a menudo en Matisse a partir de 1912, el año de su primera estancia en Marruecos, donde había observado, según se dice, a hombres que soñaban durante horas ante una pecera: en su obra se convierten en una imagen de la contemplación misma. Como subraya el museo, el motivo del biombo, deliberadamente apagado, alimenta la atmósfera meditativa de la escena. Lejos de los estallidos del fauvismo, Matisse persigue aquí el ideal que formulaba ya en 1908: un arte de equilibrio y tranquilidad, que sea para el espíritu como un buen sillón que alivia la fatiga."""
histoire = """
A finales de 1917, Matisse se instala en Niza, donde pasará en adelante la mayor parte del año. En sus habitaciones de hotel, y luego en el apartamento que alquila desde 1921 en la plaza Charles-Félix, compone interiores llenos de telas, alfombras y biombos. Recuerda en ellos las exposiciones de arte islámico que había visitado y sus viajes a Argelia y Marruecos, de donde había traído cerámicas, tejidos y azulejos. Terminado en 1923, el lienzo se vende el 12 de junio de ese año a sus marchantes parisinos, Bernheim-Jeune; dos días después lo compra el pintor y coleccionista de Chicago Frederic Clay Bartlett. Lo dona en 1926 al Art Institute, junto con otras obras maestras, entre ellas Un domingo por la tarde en la isla de la Grande Jatte de Seurat, en memoria de su esposa Helen Birch Bartlett."""
facture = """
Matisse pinta aquí con una contención nueva. Los colores están apagados: azul grisáceo del biombo, rosa pálido de la blusa, ocre de la mesa, marrón del borde; solo el verde vivo de la franja vertical y el anaranjado de los peces hacen cantar algunas notas más francas. La pincelada sigue visible, rápida, a menudo fluida, y deja en algunos puntos entrever el lienzo, sobre todo en la pecera, resuelta con unos pocos reflejos blancos y un contorno ligero. El motivo del biombo está pintado con un gesto amplio, sin preocupación por la exactitud: funciona como un fondo decorativo que sostiene todo el espacio. Vista desde algo más arriba, la mesa se inclina hacia el espectador, como si estuviéramos sentados frente a la modelo, al otro lado de la pecera."""
details = [
  "Los peces rojos, reducidos a unas pocas pinceladas anaranjadas en la pecera.",
  "La barbilla apoyada en los brazos cruzados y la mirada que se pierde.",
  "Las piñas y la rama de abeto tendidas sobre la mesa.",
  "La pequeña tarjeta blanca, única mancha clara a la derecha de la mesa.",
  "Los anillos entrelazados del biombo azul, detrás de la modelo.",
]
themes = ["interior", "ensoñación", "niza", "peces rojos", "ornamento"]
anecdote = """
El 12 de junio de 1923, Matisse vende el cuadro a Bernheim-Jeune; el 14, ya lo ha comprado Frederic Clay Bartlett, de Chicago, por 11 200 francos. Menos de tres años después, cuelga en el Art Institute."""
salle = 2
mur = "nord"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Improvisación 30 (Cañones)"
artiste = "Vassily Kandinsky"
annee = "1913"
image = "improvisation-30.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/8991"
technique = "Óleo sobre lienzo, 111 × 111,3 cm"
collection = "Art Institute of Chicago"
note = "Cañones que escupen su humo, torres que vacilan: en vísperas de 1914, Kandinsky deja que el color improvise como una música."
description = """
Un lienzo cuadrado, saturado de colores vivos que chocan entre sí. Abajo a la derecha, dos grandes ruedas negras y unos fustes oscuros apuntados hacia la izquierda forman cañones; ante ellos se elevan nubes grises y blancas, como un humo. En el centro flota una gran masa azul profundo, perfilada con un trazo pardo, semejante a un navío o a una colina. Encima, a la derecha, unas torres inclinadas, una roja y con ventanas, las otras blancas y apenas dibujadas, parecen a punto de derrumbarse. A la izquierda, una especie de torre negra calada se alza ante una nube blanca, mientras abajo una hilera de pequeñas manchas de color evoca una multitud. Montañas rojas, amarillas y verdes cierran la parte alta del cuadro. La firma y la fecha, 1913, están inscritas abajo a la izquierda."""
evocation = """
Kandinsky llamaba «improvisaciones» a los cuadros nacidos, decía, de impulsos espontáneos y en gran parte inconscientes, por oposición a las «composiciones» largamente preparadas. Aquí, el título entre paréntesis designa el único motivo que se reconoce con certeza: los cañones. A su amigo Arthur Jerome Eddy, coleccionista de Chicago, le escribió que quizá podían explicarse por las incesantes conversaciones sobre la guerra que habían llenado el año, pero que el verdadero contenido del cuadro era lo que experimenta el espectador bajo el efecto de las formas y las combinaciones de colores. Un año después estallaba la Primera Guerra Mundial, y no se ha dejado de ver en esas torres que se tambalean un presentimiento."""
histoire = """
Kandinsky pinta este lienzo en Múnich en 1913, en el momento en que da el paso hacia la abstracción. Dos años antes ha fundado con Franz Marc el Blaue Reiter y publicado De lo espiritual en el arte, donde acerca la pintura a la música, ese arte que no imita nada y toca sin embargo directamente el alma. El abogado Arthur Jerome Eddy figura entre los primerísimos estadounidenses que compran sus obras; adquiere esta, probablemente al propio pintor. En 1914, la guerra obliga a Kandinsky, súbdito ruso, a abandonar Alemania. Tras la muerte de Eddy, en 1920, su viuda y su hijo conservan el cuadro y lo donan en 1931 al Art Institute of Chicago."""
facture = """
Kandinsky superpone dos lenguajes. Por un lado, grandes campos de color puestos en pinceladas anchas y espesas, azul ultramar, amarillo, rojo, verde esmeralda, rosa, que se responden sin formar objetos. Por otro, una red de líneas negras o pardas, trazadas con un pincel fino y nervioso, que dibujan las torres, las ruedas y los fustes de los cañones, o corren libremente por el lienzo. Los colores no se quedan dentro de los contornos: se desbordan, se orlan de pequeñas pinceladas dentadas, como vibraciones. El dibujo, medio borrado, deja las cosas en el límite de lo reconocible, para que cada color actúe por sí mismo, como un sonido."""
details = [
  "Las dos ruedas negras y los fustes de los cañones, abajo a la derecha.",
  "Las bocanadas de humo gris y blanco ante los cañones.",
  "Las torres inclinadas, una de ellas roja y con ventanas.",
  "La gran mancha azul profundo en el centro del cuadro.",
  "La firma y la fecha, 1913, abajo a la izquierda.",
]
themes = ["abstracción", "música", "guerra", "color", "improvisación"]
anecdote = """
Kandinsky contó que una noche, en Múnich, quedó cautivado por un cuadro de una belleza inexplicable, sin ningún tema reconocible: era uno de sus propios lienzos, colocado de lado. Concluyó que el objeto perjudicaba a su pintura."""
salle = 2
mur = "nord"
place = 3
largeur = 1.5

[[oeuvres]]
titre = "El músico"
artiste = "Louis Marcoussis"
annee = "1914"
image = "le-musicien.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.46638.html"
technique = "Óleo sobre lienzo, 146 × 114,3 cm"
collection = "National Gallery of Art, Washington"
note = "Un músico de frac, desmontado en facetas grises y azules, en un salón donde yace la partitura de un vals: el cubismo según Marcoussis."
description = """
Un hombre de frac ocupa toda la altura del lienzo, descompuesto en planos grises, azules y negros que se superponen. Se adivina su rostro estrecho, cortado en dos, con una pequeña boca rosa, y luego una pechera blanca y una pajarita. Sostiene en vertical ante sí un instrumento de cuerda del que se reconocen la voluta, las clavijas y las efes, pintado como una madera veteada. A su alrededor, un salón se reconstruye por fragmentos: a la derecha, el teclado de un piano y un atril con una partitura en la que se lee «Malvina valse»; a la izquierda, un pequeño jarrón de flores sobre una consola; arriba, paños de colgadura roja damascada; abajo, un suelo de vetas de madera. La firma, «MARCOUSSIS 1914», está pintada en capitales abajo a la izquierda."""
evocation = """
El músico es uno de los temas favoritos del cubismo, junto con la guitarra y el bodegón de café: permite reunir en un solo cuadro una figura, un instrumento y la idea misma de la música, ese arte del tiempo que no se puede ver. Marcoussis lo trata con elegancia: el frac, la pajarita, el vals popular hablan de un mundo de salones y cafés-concierto, el del París de vísperas de la guerra. Las palabras pintadas, como en Braque y Picasso, anclan la imagen en la realidad más banal, una partitura como las que se venden en cualquier tienda de música, al tiempo que recuerdan que el cuadro sigue siendo una superficie plana, donde las letras se sostienen tan bien como las figuras."""
histoire = """
Nacido Ludwik Markus en Varsovia, el pintor llega a París a comienzos de siglo y frecuenta pronto a Apollinaire, Braque y Picasso. Adopta el cubismo hacia 1910 y participa en 1912 en el Salón de la Sección de Oro, que reúne a los cubistas al margen de Picasso y Braque. El músico se presenta en el Salón de los Independientes de 1914, donde lo compra el estadounidense Rodman Wanamaker. Revendido en Nueva York en 1928, lo adquiere al año siguiente el coleccionista Chester Dale, cuya inmensa colección de pintura francesa ingresa en 1963 en la National Gallery of Art de Washington. Más tarde, Marcoussis se consagrará cada vez más al grabado y a la ilustración de poetas."""
facture = """
Marcoussis practica aquí un cubismo sintético: en lugar de desmenuzar el objeto en minúsculas facetas, lo reconstruye en grandes planos nítidos, recortados como papeles pegados. La gama es sorda, grises azulados, negros y blancos, caldeada por el rojo de la colgadura y los pardos de la madera. Varias superficies imitan materias: el damasco rojo con motivos, las vetas de la madera resueltas a la manera de los pintores decoradores, una técnica que Braque había introducido en el cubismo. En los planos grises, la pincelada sigue visible, en pequeños trazos paralelos que modelan los volúmenes. Las letras de la partitura y de la firma, pintadas con esmero, subrayan la superficie plana del lienzo."""
details = [
  "La partitura colocada en el atril, donde se lee «Malvina valse».",
  "La voluta y las clavijas del instrumento, en el centro.",
  "La pequeña pajarita blanca y la pechera del frac.",
  "Las teclas negras del piano, a la derecha.",
  "La colgadura roja damascada, arriba a la izquierda.",
]
themes = ["cubismo", "música", "retrato", "salón", "falsa madera"]
anecdote = """
Su nombre artístico se lo encontró su amigo Guillaume Apollinaire: Marcoussis es el de un pueblo del Essonne, al sur de París."""
salle = 2
mur = "nord"
place = 4
largeur = 1.5

[[oeuvres]]
titre = "Árbol y arquitectura, ritmos"
artiste = "Paul Klee"
annee = "1920"
image = "arbre-et-architecture.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.130844.html"
technique = "Óleo sobre papel, 27,9 × 38,3 cm"
collection = "National Gallery of Art, Washington"
note = "Casas cuadriculadas, árboles en forma de bola y una plaza que sube hacia una pequeña torre: una ciudad de ensueño construida como una partitura."
description = """
Sobre una pequeña hoja de papel, Klee construye una ciudad frágil. A izquierda y derecha, dos altas casas de tejados rojos se miran de frente, cuadriculadas por una red de líneas negras, como entramados de madera o ventanas; una se abre abajo en una arcada. En el centro, una plaza en trapecio sube hacia un edificio verde, coronado por un pequeño tejado puntiagudo con un punto negro, como un reloj o un nidal. Al fondo, árboles redondos, verde oscuro, rojos o rosas, puestos sobre finos tallos, flotan entre los tejados. Los colores, ocres, rosas, verdes, amarillos y algunos blancos espesos, se aplican en manchas difusas que desbordan las líneas. Abajo a la derecha se lee una pequeña firma: «Klee»."""
evocation = """
El título reúne tres palabras que vuelven sin cesar en Klee: el árbol, que crece; la arquitectura, que se construye; el ritmo, que los une como en la música. Hijo de un profesor de música y de una cantante, violinista él mismo, Klee concebía la pintura como una partitura, donde líneas y manchas de color regresan a intervalos regulares. La ciudad que pinta no existe en ningún lugar: es un viejo burgo pasado por el sueño, con sus perspectivas imposibles y sus árboles-globo. Ese mismo año escribe que «el arte no reproduce lo visible; hace visible». Los surrealistas reconocerán pronto en él a un hermano: lo exponen en París ya en 1925."""
histoire = """
En 1920, Klee vive en Múnich. Tras la guerra, que pasó lejos del frente, su reputación crece muy deprisa: ese año se le dedica una gran exposición en la galería Hans Goltz, y su texto «Confesión creadora» aparece en una antología de escritos de artistas. A finales de año, Walter Gropius lo invita a enseñar en la Bauhaus de Weimar, adonde llega a principios de 1921 y donde permanecerá diez años. Este pequeño cuadro, pintado al óleo sobre papel, pertenece a ese momento de transición, entre las acuarelas luminosas traídas de Túnez en 1914 y la enseñanza de la Bauhaus. Ingresó en la National Gallery of Art en 2004, donación de los coleccionistas neoyorquinos Benjamin y Lillian Hertzberg."""
facture = """
Klee pinta al óleo sobre un papel delgado, lo que da al color un aspecto mate y aterciopelado. Aplica manchas de color, frotadas y difuminadas, que se funden unas con otras; una red de líneas negras, trazadas con pincel fino, estructura la imagen sin encerrar nunca del todo los colores. Todavía se ven las huellas de la brocha y el grano del soporte. Unas pinceladas de blanco, más espesas, puestas sobre el tejado central y a lo largo del edificio, hacen la luz. Este diálogo entre una trama dibujada y colores libres, que Klee comparaba de buen grado con la polifonía musical, está en el corazón de su arte."""
details = [
  "Las dos casas cuadriculadas de negro, frente a frente.",
  "La pequeña torre verde del centro, con un punto negro.",
  "Los árboles redondos, puestos como globos sobre sus tallos.",
  "La plaza en trapecio que sube hacia el fondo.",
  "La pequeña firma «Klee», abajo a la derecha.",
]
themes = ["ciudad", "sueño", "ritmo", "árboles", "música"]
anecdote = """
A partir de 1911, Klee llevó un minucioso catálogo de su obra, donde anotaba cada pieza con un año y un número: llegó a registrar más de nueve mil obras."""
salle = 3
mur = "nord"
place = 1
largeur = 0.6

[[oeuvres]]
titre = "La comida del león"
artiste = "Henri Rousseau"
annee = "hacia 1907"
image = "repas-du-lion.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/438822"
technique = "Óleo sobre lienzo, 113,7 × 160 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "En una selva inventada en París, bajo un disco pálido, un león devora a su presa entre flores gigantes."
description = """
Una selva tropical llena todo el lienzo, hasta el horizonte. Hojas inmensas, verde oscuro, verde tierno o gris azulado, se superponen en capas apretadas; altos troncos negros suben como estacas. De ellas se destacan flores extraordinarias: racimos amarillos colgantes, lotos azules y rosas y, a la izquierda, una gran planta blanca de plumas caídas. En el centro, por un claro, un disco blanco, sol o luna, se pone entre dos colinas, bajo un cielo azul pálido. Abajo, medio oculto entre las hierbas, un león de melena leonada sostiene entre las fauces una presa de pelaje moteado, quizá un leopardo, y un hilo de sangre roja corre. Mira fijamente al espectador. La firma, «Henri Rousseau», está inscrita abajo a la derecha."""
evocation = """
Rousseau nunca vio una selva. Sus bosques son paraísos inventados, a la vez exuberantes y amenazadores, donde la belleza inmóvil de las flores convive con la crueldad de las fieras. El drama es aquí casi minúsculo, perdido en la parte baja del lienzo, como si la naturaleza entera permaneciera indiferente al combate. Esta mezcla de calma y violencia, de precisión e inverosimilitud, da al cuadro la extraña lógica de los sueños. Los poetas y los pintores de la vanguardia, Apollinaire, Picasso, Robert Delaunay, admiraron y defendieron a este pintor autodidacta, que pintaba sus visiones con la seriedad de un primitivo; muchos artistas del sueño, después de él, le deben algo."""
histoire = """
Nacido en Laval en 1844, Henri Rousseau trabaja más de veinte años en el fielato de París, el servicio que grava las mercancías a la entrada de la ciudad: de ahí su apodo de Aduanero. Autodidacta, expone a partir de 1886 en el Salón de los Independientes, entre burlas, y se jubila en 1893 para consagrarse a la pintura. Su primera selva, ¡Sorprendido!, data de 1891; se multiplican en los últimos años de su vida, de 1904 a su muerte, en 1910. En 1908, Picasso ofrece en su honor, en su taller del Bateau-Lavoir, un banquete que se ha hecho célebre. La comida del león perteneció al coleccionista neoyorquino Sam A. Lewisohn, que lo legó al Metropolitan Museum en 1951."""
facture = """
Rousseau pinta con paciencia de artesano. Cada hoja se dibuja, se perfila y luego se rellena de un color liso, modelado con apenas unos matices; los verdes, innumerables, van del casi negro al verde agua. Superpone los planos como los lienzos pintados de un decorado de teatro, del primer plano oscuro al fondo claro, sin verdadera perspectiva atmosférica, de modo que todo es igualmente nítido, de lo más cercano a lo más lejano. La superficie es lisa, casi sin huella de pincel. Trabajaba de memoria y a partir de imágenes, sin salir nunca de Francia: sus flores agrandadas, mayores que el león, solo obedecen al orden decorativo del cuadro."""
details = [
  "El león, medio oculto entre las hierbas, que mira fijamente al espectador.",
  "El hilo de sangre roja sobre la presa de pelaje moteado.",
  "El disco blanco que se pone entre las colinas.",
  "Los lotos azules y rosas, y los racimos amarillos colgantes.",
  "La firma «Henri Rousseau», abajo a la derecha.",
]
themes = ["selva", "sueño", "fiera", "exotismo", "arte naíf"]
anecdote = """
«Cuando entro en los invernaderos y veo esas plantas extrañas de países exóticos, me parece que entro en un sueño», habría confiado Rousseau. Sus selvas vírgenes nacieron bajo las cristaleras del Jardin des Plantes de París."""
