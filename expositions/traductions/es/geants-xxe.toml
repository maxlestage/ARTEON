[[oeuvres]]
titre = "Jacques y Berthe Lipchitz"
artiste = "Amedeo Modigliani"
annee = "1916"
image = "lipchitz.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/27987"
technique = "Óleo sobre lienzo, 81,3 × 54,3 cm"
collection = "Art Institute of Chicago"
note = "El retrato de boda de un escultor de Montparnasse y su joven esposa, pintado por su amigo Modigliani en 1916."
description = """
Ante un muro gris azulado, una pareja posa como para una fotografía de boda. De pie a la izquierda, Jacques Lipchitz domina la composición: un largo rostro ovalado, ojos pequeños y claros, una boca fina, un jersey gris verdoso de cuello alto bajo una chaqueta pardo rojiza. Su brazo pasa por detrás de su esposa, y su mano reaparece a la derecha, posada cerca de su hombro. Sentada más abajo, Berthe inclina suavemente la cabeza; su rostro alargado, de mejillas rosadas, tiene ojos almendrados oscuros y una pequeña boca roja, y su vestido negro se adorna con un ancho cuello blanco festoneado. Tras ellos, un montante claro y un panel pardo recortan el fondo. Arriba, el nombre del escultor, «LIPCHITZ», está escrito en capitales, y la firma «modigliani» se lee en el ángulo derecho."""
evocation = """
Modigliani no busca el parecido fotográfico: alarga los rostros, reduce los ojos a almendras, simplifica las formas hasta hacer de cada modelo una suerte de icono. Y sin embargo la pareja está ahí, con sus caracteres: el hombre, rígido y algo solemne, la joven, más dulce y soñadora. La pose recuerda los retratos de boda de los estudios fotográficos, pero la ternura pasa por un gesto discreto, ese brazo que rodea a Berthe. Los rostros almendrados y los cuellos alargados deben mucho a las esculturas africanas y arcaicas que admiraban los dos hombres, escultores ambos, en una época en que Montparnasse inventaba el arte moderno."""
histoire = """
Formado en Italia, Modigliani se instala en París en 1906 y vive pronto en Montparnasse. Allí conoce al escultor Jacques Lipchitz, llegado de Lituania, quien, para ayudar a su amigo siempre sin dinero, le encarga este retrato con ocasión de su boda con la poetisa rusa Berthe Kitrosser. Lipchitz conserva el cuadro algunos años y lo cambia hacia 1921 con el marchante Léonce Rosenberg; Frederic Clay y Helen Birch Bartlett lo compran en 1922, y ingresa en 1926 en el Art Institute of Chicago, en la colección donada en memoria de Helen Birch Bartlett. A pesar de su talento, Modigliani no encontró compradores hasta después de su muerte, en enero de 1920, precipitada por la tuberculosis y su legendaria vida de bohemio."""
facture = """
La pintura, bastante magra, deja ver la trama del lienzo. Los fondos están pintados en amplios planos gris azulado, pardo y ocre; los contornos se trazan con el pincel en una línea oscura, flexible y continua, que perfila los rostros y las prendas. Las carnaciones, anaranjadas y rosas, se modelan muy ligeramente, casi planas; las mejillas de Berthe son dos manchas rojas redondeadas. La composición se organiza en verticales: el montante claro en el centro, el borde del panel pardo, la alta figura de pie. El fondo, las prendas y las sombras comparten la misma gama sorda, que hace resaltar los rostros. Las letras capitales del nombre, trazadas con pincel, recuerdan las inscripciones de los retratos antiguos."""
details = [
  "El nombre «LIPCHITZ», escrito en capitales en la parte alta del lienzo.",
  "El cuello blanco festoneado del vestido de Berthe.",
  "Las mejillas de Berthe, dos manchas de rosa redondeadas.",
  "La mano de Jacques que reaparece a la derecha, cerca del hombro de su esposa.",
  "La firma «modigliani», en minúsculas, en el ángulo superior derecho.",
]
themes = ["retrato", "pareja", "boda", "montparnasse", "amistad"]
anecdote = """
Según Lipchitz, Modigliani había terminado el retrato en dos días. El escultor lo persuadió de que siguiera trabajando en él dos semanas más, para poder pagarle un honorario más alto."""
