[[oeuvres]]
titre = "Vieja fábrica"
artiste = "Paula Modersohn-Becker"
annee = "1900"
image = "vieille-usine.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.150903.html"
technique = "Óleo sobre cartón, 38,7 × 53,7 cm"
collection = "National Gallery of Art, Washington"
note = "Un viejo edificio y su chimenea solitaria al borde de los prados, bajo un cielo gris: un estudio rápido, pintado el año en que Paula Modersohn-Becker descubre París."
description = """
Bajo un cielo gris y azul pálido por el que pasan nubes oscuras, un largo edificio ocupa la izquierda de la composición. Su gran tejado pardo, casi negro, veteado de rojo, desciende hasta un muro ocre anaranjado con pequeñas aberturas oscuras; el hastial, vuelto hacia la derecha, está salpicado de manchas claras, como ventanas tapiadas o un revoco desprendido a placas. Tras el tejado se eleva una alta chimenea. En primer plano se extiende una pradera verde; matorrales y jóvenes coníferas oscuras se alzan a izquierda y derecha, y una hilera de árboles cierra el horizonte. Ninguna figura, ningún humo: el lugar parece abandonado. Abajo a la izquierda, la fecha «1900» está trazada en la pasta."""
evocation = """
Paula Modersohn-Becker no busca aquí ni lo pintoresco ni la denuncia social: la vieja fábrica es para ella una forma, una masa sencilla colocada en el paisaje. El edificio, con su tejado abrumador y su chimenea solitaria, tiene algo grave y casi humano, como una silueta que espera. Bajo el cielo pesado, el conjunto desprende una melancolía silenciosa, la de las cosas gastadas por el tiempo. Esta manera de reducir el motivo a unas pocas grandes masas, sin anécdota, anuncia los retratos, los bodegones y los autorretratos que pintará en los años siguientes, entre los más nuevos de su tiempo."""
histoire = """
Nacida en Dresde en 1876, Paula Becker se une en 1898 a la colonia de artistas de Worpswede, un pueblo del páramo cerca de Bremen, donde los pintores trabajan del natural, en medio de las turberas. A principios de 1900 parte para París: estudia en la academia Colarossi, visita la Exposición Universal y descubre a Cézanne en casa del marchante Ambroise Vollard. En 1901 se casa con el pintor Otto Modersohn. Regresa varias veces a París y muere en 1907, a los treinta y un años, menos de tres semanas después del nacimiento de su hija. En vida vendió muy pocos cuadros; hoy se la considera una de las pioneras del expresionismo alemán. Este cartón ingresó en la National Gallery of Art en 2012, legado de Ruth Cole Kainen."""
facture = """
El estudio está pintado deprisa, con óleo espeso y graso, sobre un simple cartón. La pincelada, muy visible, cambia según las superficies: corta y cruzada en el cielo, donde el blanco, el azul y el gris se mezclan sin fundirse; más ancha y apoyada en el muro y el tejado; arremolinada en los matorrales y los árboles. Los colores son pocos y terrosos, pardo, ocre, verde profundo, caldeados por unas vetas rojas sobre el tejado. Las formas se simplifican en grandes masas, sin detalle inútil: unas manchas oscuras bastan para hacer ventanas, unos trazos verticales una hilera de árboles. Nada está acabado, y todo está dicho."""
details = [
  "La alta chimenea, única vertical contra el cielo.",
  "Las vetas rojas sobre el gran tejado oscuro.",
  "Las pequeñas manchas claras que salpican el hastial.",
  "La hilera de árboles oscuros en el horizonte, a la derecha.",
  "La fecha «1900», trazada en la pasta abajo a la izquierda.",
]
themes = ["paisaje", "fábrica", "cielo", "estudio", "sencillez"]
anecdote = """
El poeta Rainer Maria Rilke, que la había conocido en Worpswede, le dedicó en 1908, un año después de su muerte, su «Réquiem por una amiga»."""
