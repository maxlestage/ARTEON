[[oeuvres]]
titre = "Pandora"
artiste = "Odilon Redon"
annee = "1910–1912"
image = "pandora.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.46531.html"
technique = "Óleo sobre lienzo, 143,5 × 62,9 cm"
collection = "National Gallery of Art, Washington"
note = "La primera mujer de la mitología griega sostiene el cofre fatal entre flores irreales: uno de los últimos sueños en color de Redon."
description = """
Sobre un lienzo alto y estrecho, una joven está de pie, casi de espaldas, vuelta hacia la derecha. Su cabello pelirrojo está sujeto por una diadema dorada; lleva un amplio manto azul turquesa, drapeado sobre un vestido blanco, y baja los ojos hacia un pequeño cofre oscuro que sostiene ante sí. Tras ella se alzan montañas azuladas, apenas esbozadas, bajo un cielo rosa nacarado. A sus pies y a la derecha abundan flores que no se parecen a ninguna especie conocida: anchas manchas blancas como pétalos, destellos amarillos, anaranjados, rojos, verdes y azules, sembrados en lluvia de colores. Toda la parte alta del cuadro se baña en una luz pulverulenta. La firma, «Odilon Redon», está inscrita abajo a la derecha."""
evocation = """
Según el poeta griego Hesíodo, Pandora es la primera mujer, modelada por los dioses y colmada de todos los dones, enviada luego a los hombres con un recipiente que no debía abrir; al levantar la tapa, deja escapar todos los males, y solo la Esperanza queda en el fondo. Redon no pinta la catástrofe, sino el instante anterior: una joven pensativa, absorta en el cofre, en medio de una naturaleza todavía intacta. La curiosidad se convierte en ensoñación, y el mito en una meditación silenciosa. Las flores deslumbrantes que la rodean dejan al espectador dudar entre la amenaza y la promesa, entre el paraíso que va a perderse y la esperanza que permanece."""
histoire = """
Nacido en Burdeos en 1840, Odilon Redon fue primero, durante más de veinte años, el maestro de los «negros»: carboncillos y litografías poblados de ojos flotantes, arañas sonrientes y cabezas cortadas, que los escritores simbolistas admiraban. En la década de 1890, el color invade su obra, primero pasteles y luego óleos, y pinta hasta su muerte, en 1916, ramos, barcas y figuras mitológicas bañadas de luz. Pandora data de esos últimos años; el tema lo ocupó en varias ocasiones. El cuadro se subasta en París, en el hôtel Drouot, en 1922, y cruza luego el Atlántico; el coleccionista neoyorquino Chester Dale lo compra en 1950, y ingresa en la National Gallery of Art en 1963."""
facture = """
Redon pinta al óleo como trabajaba el pastel: con frotados ligeros, velos transparentes y pequeñas pinceladas yuxtapuestas, dejando asomar en algunos puntos el grano del lienzo. La parte alta del cuadro, casi vacía, está hecha de capas rosadas y grises frotadas unas sobre otras, de las que nace una luz pulverulenta. La figura apenas está perfilada, su manto modelado con azules y verdes transparentes. Abajo, por el contrario, la materia se espesa y se fragmenta en destellos de color puro, casi abstractos, como un mosaico de piedras preciosas. El formato muy estrecho, el de un panel decorativo, aísla la figura como en una hornacina."""
details = [
  "El pequeño cofre oscuro que Pandora mira con los ojos bajos.",
  "La diadema dorada en su cabello pelirrojo.",
  "El manto turquesa drapeado sobre el vestido blanco.",
  "Las grandes flores blancas, como pétalos de luz, a la derecha.",
  "Las montañas azuladas, apenas dibujadas, tras la figura.",
]
themes = ["mitología", "simbolismo", "sueño", "flores", "curiosidad"]
anecdote = """
En Hesíodo, Pandora abre una gran jarra, y no una caja: la «caja de Pandora» procede de una traducción latina del Renacimiento, popularizada por Erasmo. Y es, sin embargo, ese cofre el que pinta Redon, como casi todos los artistas."""
salle = 3
mur = "nord"
place = 3
largeur = 0.8

[[oeuvres]]
titre = "Autorretrato"
artiste = "Käthe Kollwitz"
annee = "1915"
image = "autoportrait-kollwitz.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1941.493"
technique = "Litografía, 27,2 × 23,4 cm"
collection = "Cleveland Museum of Art"
note = "El rostro cansado y grave de una madre que acaba de perder a su hijo en la guerra, dibujado con tiza litográfica, sin ninguna complacencia."
description = """
Sobre una hoja de papel crema aparece un rostro de mujer de frente, encuadrado muy de cerca, sin cuerpo ni decorado. El cabello, peinado hacia atrás, solo se indica con unas masas grises que se deshilachan en los bordes. El rostro está sumido en una sombra granulosa, hecha de innumerables puntos negros; en algunos lugares, el blanco del papel, dejado en reserva, hace la luz, en la frente, alrededor de un ojo, en el caballete de la nariz y en la barbilla. Los ojos, marcados por ojeras y ligeramente asimétricos, miran de frente; los párpados son pesados, la boca cerrada, las mejillas hundidas. El cuello se pierde abajo en unos trazos rápidos. Abajo a la derecha, la artista firmó a lápiz: «Käthe Kollwitz»."""
evocation = """
Käthe Kollwitz se representó durante toda su vida, un centenar de veces, en dibujo, grabado y escultura. Estos autorretratos nunca halagan: registran el cansancio, la edad y la pena. Este se hizo el año siguiente a la muerte de su hijo menor, Peter, muerto en Flandes en octubre de 1914, a los dieciocho años, en las primeras semanas de la guerra. No se ve en él ningún signo exterior de luto, ninguna lágrima: solo una mirada que sostiene la nuestra, agotada pero lúcida. Esa misma sobriedad hace de la imagen, más allá del retrato de una mujer, el de todas las madres a las que la guerra privó de sus hijos."""
histoire = """
Nacida en Königsberg en 1867, Käthe Kollwitz se instala en Berlín con su marido Karl, médico en un barrio obrero, cuyos pacientes se convierten en sus modelos. Sus ciclos grabados, La revuelta de los tejedores y luego La guerra de los campesinos, la hacen célebre en el cambio de siglo. La muerte de Peter trastorna su obra: durante casi dieciocho años trabaja en un monumento a su hijo, los Padres en duelo, instalado en 1932 en un cementerio militar alemán de Bélgica, cerca de su tumba. En 1919 se convierte en la primera mujer elegida para la Academia Prusiana de las Artes. Esta prueba pertenece al Cleveland Museum of Art desde 1941, con la colección de Mr. y Mrs. Lewis B. Williams."""
facture = """
La litografía permite dibujar con tiza grasa, sobre la piedra o sobre un papel de transporte, y luego imprimir la imagen con toda la espontaneidad del dibujo. Kollwitz saca de ella aquí un efecto impresionante: la tiza, pasada sobre una superficie granulosa, deja una trama de pequeños puntos y finas estrías verticales que dan a la sombra la textura de una tela o de una piel. Construye el rostro por masas más que por contornos, y deja que los bordes se deshagan en el blanco del papel. El encuadre cerrado y la ausencia de todo decorado concentran la atención en la mirada. Unos trazos más nerviosos, abajo, bastan para sugerir el cuello de la prenda."""
details = [
  "Los ojos con ojeras, ligeramente asimétricos, que miran fijamente al espectador.",
  "El blanco del papel dejado en reserva sobre la frente y el caballete de la nariz.",
  "La trama de pequeños puntos y estrías de la tiza litográfica.",
  "El cabello peinado hacia atrás, indicado con simples masas grises.",
  "La firma a lápiz, abajo a la derecha.",
]
themes = ["autorretrato", "duelo", "guerra", "estampa", "maternidad"]
anecdote = """
En agosto de 1914, fue Käthe Kollwitz quien convenció a su marido de dejar que Peter se alistara como voluntario. Su diario, llevado durante más de treinta años, conserva la huella de ese remordimiento y de su largo trabajo de duelo."""
salle = 4
mur = "nord"
place = 1
