[[oeuvres]]
titre = "The Gulf Stream"
artiste = "Winslow Homer"
annee = "1899"
image = "gulf-stream.jpg"
technique = "Óleo sobre lienzo, 71,4 × 124,8 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un marinero solo en una barca desarbolada, rodeado de tiburones, con una tromba marina en el horizonte."
description = """
En alta mar, un hombre negro, con el torso desnudo, está medio tendido en la cubierta de una pequeña \
barca a la deriva, que escora peligrosamente. El mástil está roto; tallos de caña de \
azúcar se escapan de la bodega. Alrededor del barco, tiburones dan vueltas en las olas \
azul oscuro, con las fauces abiertas. El hombre no los mira: fija la vista en el horizonte, con aire cansado \
o resignado. A la derecha, en el horizonte, una tromba marina se alza entre el mar y las nubes; \
muy lejos, a la izquierda, casi invisible, pasa un velero. Algunos peces \
voladores yacen en la cubierta. El oleaje, poderoso, levanta la barca y cierra el horizonte, \
aislando al marinero en medio del océano, sin tierra ni socorro a la vista."""
evocation = """
Homer pinta una meditación sobre la condición humana frente a una naturaleza indiferente: un \
hombre solo, privado de todo medio de actuar, amenazado a la vez por los tiburones, la tormenta \
y la deriva. La elección de un marinero negro, a finales del siglo XIX, ha suscitado \
numerosas lecturas. Se ha visto en ella una evocación de la historia de la esclavitud y de la \
trata atlántica, y de la situación precaria de los afroamericanos tras el fracaso de la \
Reconstrucción. Otros leen en ella un cuadro más personal: Homer, ya envejecido, \
acababa de perder a su padre en 1898, y la obra adquiere acentos de meditación sobre la \
muerte. Los historiadores han subrayado también la fuerza serena del personaje, que \
afronta la situación sin ceder al pánico."""
histoire = """
El cuadro nace de varias estancias de Homer en el Caribe y en Florida, en particular \
en las Bahamas en 1884-1885 y en 1898-1899. Allí había pintado a la acuarela marineros \
negros, tiburones y barcas, algunas de cuyas hojas anuncian directamente la \
composición. De regreso en su taller de Prouts Neck, en la costa de Maine, \
realiza el gran lienzo en 1899. Expuesto a partir de 1900, en particular en la Pennsylvania \
Academy of the Fine Arts, intriga e inquieta por la dureza de su tema, y le cuesta \
encontrar comprador. En 1906, el jurado de la exposición de la National Academy of \
Design recomienda por unanimidad su adquisición al Metropolitan Museum of Art, que lo adquiere \
ese mismo año."""
facture = """
Homer, procedente de la ilustración y de la acuarela, pinta aquí con una pincelada amplia y \
enérgica. Las olas se construyen con grandes pinceladas, azules profundos, \
verdes y blancos de espuma. La composición descansa en una diagonal inestable: la barca \
escorada, la cubierta inclinada, el cuerpo del hombre que sigue la pendiente. Los rojos y los \
marrones del barco y de la caña de azúcar contrastan con los azules del agua. La tromba y \
el velero lejano se reducen a unos pocos toques, para que todo converja en \
el hombre y los tiburones."""
details = [
  "Los tallos de caña de azúcar que desbordan de la bodega.",
  "Los peces voladores varados en la cubierta.",
  "La tromba marina que se alza en el horizonte, a la derecha.",
  "El diminuto velero, en el fondo a la izquierda, demasiado lejos para prestar auxilio.",
  "El tocón del mástil roto.",
]
themes = ["mar", "soledad", "peligro", "muerte", "caribe"]
anecdote = """
Molesto por las preguntas sobre la suerte del marinero, Homer escribió a su marchante que se \
podía tranquilizar a los curiosos: el hombre no murió de hambre, ni fue devorado por los \
tiburones ni alcanzado por la tromba, y fue salvado por un barco que no aparece en el \
cuadro."""
