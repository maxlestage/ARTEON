largeur = 1.1

[[oeuvres]]
titre = "The Child's Bath (El baño)"
artiste = "Mary Cassatt"
annee = "1893"
image = "bain-enfant.jpg"
technique = "Óleo sobre lienzo, 100,3 × 66,1 cm"
collection = "Art Institute of Chicago"
note = "Vista desde arriba, como una estampa japonesa: la ternura de un gesto cotidiano."
description = """
Una mujer sentada sostiene sobre las rodillas a un niño pequeño envuelto a medias en una toalla \
blanca y le lava los pies en una palangana colocada en el suelo. Ambas con la cabeza \
inclinada, miran el agua; la mano de la mujer rodea el pie del niño, que \
se apoya con una mano en su rodilla. La mujer lleva un amplio vestido de anchas rayas \
claras y de colores. A su alrededor, la intimidad de una habitación: una alfombra de motivos \
florales, una jarra en el suelo, a la derecha, y, en la parte alta del cuadro, un mueble \
pintado. El punto de vista, muy elevado, se abisma sobre la escena, de modo que el suelo parece \
alzarse como una pared y las dos figuras ocupan casi toda la altura del \
lienzo."""
evocation = """
Mary Cassatt dedicó gran parte de su obra a las mujeres y los niños, no \
como alegorías sentimentales, sino como escenas observadas de la vida \
cotidiana. Aquí, la ternura se expresa mediante un gesto simple y concentrado, compartido en \
silencio. Las miradas convergen en el mismo punto, el agua de la palangana, y crean \
una intimidad de la que el espectador queda casi excluido. Se ha visto en ella una visión moderna de la \
maternidad, hecha de atención y cuidado más que de idealización religiosa, en \
oposición a las Vírgenes con el Niño de la tradición. Algunos historiadores subrayan también \
la actualidad del tema del baño, en una época en que la higiene y la educación de los niños \
pequeños se convertían en preocupaciones nuevas para las familias burguesas."""
histoire = """
Cassatt pinta The Child's Bath en 1893, el año en que realiza la gran pintura \
mural «La mujer moderna», destinada al Woman's Building de la Exposición Universal de \
Chicago, y en que la galería Durand-Ruel le dedica en París una importante exposición \
individual. Instalada en Francia desde 1874, vinculada a Degas, que la había invitado a \
exponer con los impresionistas, se encuentra entonces en la cumbre de su carrera. El año \
1890 había sido decisivo: la gran exposición de estampas japonesas de la École des \
Beaux-Arts la había impulsado a renovar su manera, primero en el grabado en \
color y después en la pintura. El cuadro es adquirido por el Art Institute of Chicago \
en 1910, en vida de la artista, y desde entonces figura entre las obras más populares \
del museo."""
facture = """
La composición debe mucho a las estampas japonesas de Utamaro y de sus contemporáneos: \
vista cenital, suelo enderezado, motivos decorativos yuxtapuestos, ausencia de horizonte, \
figuras apretadas en el encuadre. Las rayas del vestido, la alfombra florida y el mueble \
pintado se responden como superficies planas de color, mientras que la carne del \
niño se modela con suavidad. La pincelada, libre y visible en los tejidos, sigue siendo \
impresionista, pero el dibujo, firme y preciso, muestra la influencia de Degas. Los \
colores claros y frescos traducen la luz suave de una habitación."""
details = [
  "Las dos cabezas inclinadas hacia el agua, que miran el mismo punto.",
  "El pie del niño sostenido en la mano de la mujer, sobre la palangana.",
  "La jarra colocada sobre la alfombra, a la derecha.",
  "Las rayas del vestido, que contrastan con la piel desnuda del niño.",
  "La alfombra de motivos, vista desde arriba, que asciende hasta la mitad del cuadro.",
]
themes = ["maternidad", "infancia", "intimidad", "japonismo", "cotidianidad"]
anecdote = """
Mary Cassatt nunca se casó ni tuvo hijos. Para sus escenas de maternidad, \
hacía posar a modelos, a menudo mujeres y niños de su entorno o \
de su vecindario, que no eran necesariamente madre e hijo en la vida real."""
