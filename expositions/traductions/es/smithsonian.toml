pirámide luminosa. Su formación junto a Jean-Léon Gérôme, en París, se advierte en la \
precisión del dibujo y la solidez de los volúmenes. Gran conocedor de la anatomía y de la \
perspectiva, preparaba sus composiciones mediante rigurosos estudios. El rojo de la \
sangre, único color vivo en una gama de marrones y negros, atrae de inmediato la mirada \
hacia la mano del cirujano."""
details = [
