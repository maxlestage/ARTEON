[[sculptures]]
titre = "The Fugitive's Story"
artiste = "John Rogers"
annee = "1869"
modele = "fugitives-story.stl"
technique = "Yeso pintado"
collection = "Smithsonian American Art Museum, Washington"
note = "Una mujer fugitiva cuenta su historia a tres abolicionistas, entre ellos el poeta Whittier."
description = """
Una joven negra, vestida con sencillez, estrecha a su bebé contra sí y relata \
su huida a tres hombres reunidos a su alrededor. No son figuras anónimas: \
Rogers ha representado a tres grandes figuras del abolicionismo, el poeta John Greenleaf \
Whittier, el pastor Henry Ward Beecher y el periodista William Lloyd Garrison. Sus \
rostros son retratos reconocibles, de rasgos marcados por la edad. Los hombres, \
de levita, escuchan con gravedad; sus actitudes, inclinadas o atentas, \
convergen todas hacia la mujer y su hijo. El grupo compone una pequeña escena de \
teatro, con sus gestos y sus miradas, detenida en el yeso a la manera de un cuadro \
viviente, y se descubre poco a poco al darle la vuelta."""
evocation = """
Realizado en 1869, cuatro años después de la abolición de la esclavitud por la Decimotercera Enmienda, \
el grupo rinde un homenaje retrospectivo a los militantes que habían combatido la esclavitud \
durante décadas. La fugitiva, madre que protege a su hijo, encarna la humanidad negada \
por la esclavitud y la fuerza del testimonio, que fue una de las principales armas de los \
abolicionistas: relatos de esclavos evadidos, conferencias, periódicos. Los tres hombres \
representan la conciencia moral del Norte a través de la poesía, la religión y la prensa. Hoy se \
observa que la palabra de la mujer está en el centro de la escena, pero que los \
héroes cuyos nombres se recuerdan son los tres hombres blancos: el grupo refleja los \
límites de su época tanto como sus ideales."""
histoire = """
John Rogers, que compartía las convicciones abolicionistas, dedica este grupo en 1869 \
a hombres a quienes el público del Norte conocía y admiraba. El año anterior, \
ya había representado a personalidades reales en The Council of War, donde Lincoln \
discute con el general Grant y el secretario de Guerra Stanton. Como sus demás \
obras, The Fugitive's Story está concebido para reproducirse en yeso y venderse por \
catálogo, en un formato adaptado al salón burgués. El tema, más meditativo que sus \
escenas de guerra, se dirige a un público sensible a la memoria de la lucha \
antiesclavista, tras un conflicto que había costado cientos de miles \
de vidas. El Smithsonian American Art Museum conserva un ejemplar, digitalizado en 3D \
y difundido en libre acceso."""
facture = """
Aquí, lo principal es el parecido: Rogers debe hacer reconocibles unos \
rostros célebres, ampliamente difundidos entonces por la fotografía y el grabado. Los \
modela con esmero en arcilla, antes de seguir su procedimiento habitual: modelo de \
bronce, moldes flexibles, vaciados en yeso pintados con un tono uniforme. La disposición \
de las cuatro figuras en círculo obliga al espectador a dar la vuelta al grupo, ofreciendo cada \
lado un rostro o un gesto distinto. Los detalles de las ropas y de las manos \
son precisos a pesar del pequeño tamaño del conjunto."""
details = [
  "El bebé que la fugitiva estrecha contra sí.",
  "Los rostros de los tres abolicionistas, auténticos retratos.",
  "Las levitas y las manos, modeladas con precisión a pesar del pequeño tamaño.",
  "El tono uniforme que unifica el conjunto, típico de los grupos de Rogers.",
]
themes = ["abolicionismo", "esclavitud", "testimonio", "maternidad", "escultura de género"]
anecdote = """
William Lloyd Garrison, uno de los tres oyentes, había publicado su periódico The \
Liberator cada semana de 1831 a finales de 1865: dejó de editarlo una vez \
abolida la esclavitud por la Decimotercera Enmienda, al considerar cumplida su misión."""
salle = 4
x = 2.5
z = 2
hauteur = 0.56
matiere = "#b9ab93"
socle = 1.0

[[sculptures]]
titre = "Mascarilla de Abraham Lincoln"
artiste = "Clark Mills"
annee = "1865"
modele = "lincoln-mask.stl"
technique = "Yeso, moldeado del natural"
collection = "National Portrait Gallery, Washington"
note = "Moldeada dos meses antes de su asesinato: el rostro de un presidente agotado por cuatro años de guerra."
description = """
El rostro de Abraham Lincoln aparece tal como era en febrero de 1865, con los ojos cerrados, \
moldeado directamente sobre la piel. Las mejillas están hundidas, los pómulos salientes, \
arrugas profundas surcan la frente y enmarcan la boca. Una barba corta cubre la \
barbilla y la mandíbula, sin bigote, como en sus últimos retratos \
fotográficos. En la mejilla derecha, cerca de la boca, se distingue el lunar \
del presidente. Los labios están apretados, los párpados pesados. La mascarilla se limita al \
rostro, sin el cuello ni el cabello. No es una escultura interpretada, sino una \
impronta, de una precisión casi turbadora, de cada pliegue y cada relieve de la \
piel."""
evocation = """
A diferencia de un retrato pintado o esculpido, la mascarilla ni halaga ni idealiza: \
guarda la huella exacta de los rasgos, como una fotografía en relieve. Comparada con la primera \
mascarilla de Lincoln, tomada por Leonard Volk en 1860, antes de su elección, esta muestra \
cuánto marcaron al hombre cuatro años de guerra civil: adelgazamiento, fatiga, \
gravedad. A menudo se la presenta como el testimonio más conmovedor del precio personal \
pagado por el presidente para preservar la Unión y abolir la esclavitud. Tomada pocas \
semanas antes de la victoria y del asesinato del 14 de abril de 1865, ha adquirido valor de \
reliquia. Los ojos cerrados, que impone la técnica, le dan retrospectivamente \
el aspecto de una máscara mortuoria, aunque Lincoln estaba entonces bien vivo."""
histoire = """
Clark Mills, el escultor de la estatua ecuestre de Andrew Jackson en Washington, cuya \
fundición había colado también la estatua de la Libertad que corona la cúpula del Capitolio, \
realiza este vaciado en febrero de 1865, sin duda con vistas a un busto o una estatua del \
presidente. Lincoln acaba de ser reelegido e inicia su segundo mandato el 4 de marzo. El molde \
original permite sacar varias pruebas de yeso a lo largo de los años, y copias \
circulan entre escultores y coleccionistas. Junto con la de Volk, la mascarilla de \
Mills se ha convertido en un documento de referencia para conocer el verdadero rostro de Lincoln, \
consultado a menudo por los artistas que le han dedicado monumentos. El ejemplar de \
la National Portrait Gallery ha sido digitalizado en 3D por el Smithsonian."""
facture = """
El moldeado del natural sigue una técnica antigua: el rostro, untado con una sustancia grasa \
para que el yeso no se adhiera a la piel ni al vello, se cubre de yeso líquido, \
que se deja fraguar unos minutos antes de retirarlo. Se obtiene un molde en \
hueco, en el que luego se vierte yeso para obtener la mascarilla en relieve. El \
modelo debe permanecer perfectamente inmóvil, con los ojos cerrados. Mills, antiguo yesero formado \
en las obras de Charleston, dominaba este procedimiento. El yeso blanco, sin color \
ni retoques, restituye la textura de la piel, la barba y las más mínimas arrugas."""
details = [
  "El lunar en la mejilla derecha, cerca de la boca.",
  "Los surcos profundos que descienden de la nariz hacia las comisuras de los labios.",
  "La barba sin bigote, cuya textura se adivina.",
  "Los párpados cerrados, pesados de cansancio.",
]
themes = ["retrato", "guerra de secesión", "presidente", "memoria", "moldeado"]
anecdote = """
John Hay, uno de los secretarios de Lincoln, escribió más tarde que esta mascarilla era de una \
tristeza indecible: el rostro de un hombre sobre el que el dolor y las preocupaciones \
habían hecho su peor obra, sin lograr, sin embargo, vencerlo."""
salle = 4
x = 0
z = -2
hauteur = 0.3
matiere = "platre"
socle = 1.15

[[sculptures]]
titre = "Buda vestido con una túnica que figura los mundos de la existencia"
artiste = "Chine, dynastie des Qi du Nord"
annee = "550–577"
modele = "buddha.stl"
technique = "Caliza"
collection = "Freer Gallery of Art, Washington"
note = "El «Buda cósmico»: en su túnica, en ligero relieve, los seis mundos de la existencia, de los paraísos a los infiernos."
description = """
Este gran Buda de piedra, de pie, ha perdido la cabeza y las manos, pero su cuerpo conserva \
una presencia imponente. Viste la túnica monástica, que cae recta hasta los \
tobillos y se ajusta al cuerpo, casi cilíndrico, sin formar pliegues marcados. Toda la \
superficie de esta túnica está cubierta de escenas esculpidas en muy bajo relieve y de \
líneas grabadas. En lo alto, palacios y seres celestes evocan los mundos de los \
dioses; más abajo se despliegan escenas del mundo de los humanos, con personajes, \
edificios y árboles; abajo del todo, junto al dobladillo, aparecen los infiernos, \
donde se adivinan condenados atormentados. Hay que acercarse mucho, y dar la vuelta a \
la estatua, para empezar a leer estas imágenes."""
evocation = """
En el pensamiento budista, los seres renacen sin cesar en seis mundos: los de los \
dioses, los semidioses, los humanos, los animales, los espíritus hambrientos y los condenados de los \
infiernos, según el peso de sus actos. Al llevar estos mundos en su túnica, el Buda \
aparece como abarcando el universo entero: su presencia se extiende a todos los seres, \
hasta los más desdichados, y ofrece a cada uno la posibilidad de la liberación. Muchos \
especialistas lo identifican con el Buda cósmico Vairocana, descrito en el Sutra de \
la Guirnalda de Flores como conteniendo en sí todos los mundos; otros ven en él al \
Buda histórico, Shakyamuni. Para los fieles del siglo VI, esta imagen era un \
soporte de meditación sobre el lugar de cada ser en el ciclo de los renacimientos."""
histoire = """
La estatua fue esculpida en el norte de China bajo la dinastía de los Qi del Norte (550-577), \
período de gran fervor budista en que la corte y la aristocracia financiaban templos \
y cuevas santuario. Se ignora el templo exacto del que procede. Como muchas \
esculturas budistas chinas, salió de China a comienzos del siglo XX, en \
un contexto de disturbios y de saqueo de los lugares religiosos que alimentaba el mercado del \
arte occidental. Ingresa en la Freer Gallery of Art en 1923, el año de la apertura \
del museo, fundado gracias al legado del coleccionista Charles Lang Freer. A comienzos de la década \
de 2010, el Smithsonian la digitalizó en 3D, lo que permitió descifrar mejor las \
escenas de la túnica, difíciles de leer sobre la piedra desgastada."""
facture = """
La estatua está tallada en una caliza de grano fino, que se presta a un trabajo \
minucioso. El cuerpo casi cilíndrico y la túnica pegada a la piel son \
característicos del estilo de los Qi del Norte, marcado por el arte indio de la época gupta: \
a los drapeados en cascada del período anterior sucede una vestidura lisa, convertida \
casi en un soporte. Sobre esta superficie, el escultor grabó y modeló en muy bajo \
relieve las escenas de los mundos de la existencia, como lo habría hecho con una pintura. En \
origen, la estatua estaba probablemente pintada, lo que hacía estas escenas mucho más \
legibles."""
details = [
  "En lo alto de la túnica, los palacios y los seres celestes que figuran los paraísos.",
  "Junto al dobladillo, las escenas de los infiernos y sus condenados.",
  "La superficie lisa de la túnica, que se ajusta al cuerpo sin pliegues marcados.",
  "Las roturas del cuello y de los brazos: la cabeza y las manos han desaparecido.",
]
themes = ["budismo", "cosmos", "renacimiento", "china", "espiritualidad"]
anecdote = """
Este Buda fue uno de los primeros objetos que el Smithsonian puso en línea en 3D, en 2013: \
ahora cualquiera puede hacer girar la estatua en su pantalla y observar las escenas de \
la túnica bajo iluminaciones imposibles de obtener en la galería."""
salle = 5
