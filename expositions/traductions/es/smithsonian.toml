accroche = "Exposición virtual · Museos del Smithsonian"
introduction = """
Un museo inspirado en los del Smithsonian en Washington: un gran patio cubierto \
presidido por el George Washington de Greenough, los paisajes del Hudson y de la \
Sierra Nevada, los retratos de Whistler, Sargent y Eakins, las esculturas de \
John Rogers y un gabinete asiático como el de la Freer Gallery. Las esculturas son \
escaneos 3D del Smithsonian, de libre acceso."""
vitrine = "mere-whistler.jpg"

[musee]
nom = "Smithsonian American Art Museum"
ville = "Washington, Estados Unidos"
construction = "1836–1867"
presentation = """
El Smithsonian American Art Museum ocupa, junto con la National Portrait Gallery, el antiguo \
Patent Office de Washington, donde en otro tiempo se registraban las patentes de invención. Iniciado en \
1836 y concluido en 1867, este vasto cuadrilátero neoclásico con pórticos, de una \
arquitectura inspirada en los templos griegos, es uno de los edificios públicos más antiguos de \
la capital. Durante la guerra de Secesión sirve de hospital, y Walt Whitman acude a él para \
velar a los heridos; en 1865 se celebra allí el baile de la segunda investidura de Lincoln. \
Amenazado de demolición en la década de 1950, se salva y se confía al Smithsonian, que \
abre en él sus dos museos en 1968. Desde 2007, su patio interior, el Kogod Courtyard, está \
cubierto por una cubierta acristalada ondulante diseñada por Foster and Partners. El museo recorre \
el arte estadounidense desde la época colonial, de los paisajes de la Hudson River School a las \
obras contemporáneas."""
ici = """
ARTEON conserva su planta en torno a un patio. El patio cubierto, un cuadrado de 20 metros de \
lado y 12 metros de altura, bajo una cubierta acristalada, recibe al visitante por el sur, a los pies del \
George Washington de Greenough. Tres salas lo rodean: al oeste, Los paisajes \
estadounidenses, de paredes verde pálido; al norte, Los retratos, de paredes rosadas, ambas \
de 6 metros de altura; al este, Las esculturas de género, más bajas, de paredes gris perla. \
Una puerta al norte de esta última da acceso a la sala más pequeña, El gabinete \
asiático, de paredes color arena, donde concluye la visita."""

