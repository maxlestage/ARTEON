[[sculptures]]
titre = "George Washington"
artiste = "Horatio Greenough"
annee = "1840"
modele = "washington.stl"
technique = "Mármol"
collection = "National Museum of American History, Washington"
note = "Encargada para la rotonda del Capitolio: Washington con el torso desnudo, como un Zeus antiguo. El público, escandalizado, la hizo trasladar."
description = """
Sentado en un trono macizo, George Washington aparece con el torso desnudo, como un dios de \
la Antigüedad. Un manto drapeado cubre sus piernas y cae sobre el asiento; \
calza sandalias. Su brazo derecho está alzado, con el índice apuntando al cielo, mientras que \
con la mano izquierda presenta una espada envainada, con la empuñadura vuelta hacia el \
espectador. El rostro grave es el del héroe de la Independencia, pero el cuerpo \
poderoso es el del Júpiter de los escultores antiguos. Los costados del trono están ornados con \
bajorrelieves: Apolo conduciendo el carro del Sol y Hércules niño estrangulando a las \
serpientes enviadas contra él. En la parte trasera, pequeñas figuras representan a Cristóbal \
Colón y a un amerindio. La estatua supera los tres metros de altura."""
evocation = """
Greenough quería dar a la joven república un monumento digno de la Antigüedad, \
representando a su fundador con los rasgos de Zeus, según la estatua colosal que \
Fidias había esculpido para Olimpia y que solo se conocía por \
descripciones. El gesto se ha leído como un mensaje político: la mano alzada señala la \
fuente superior del poder, mientras que la espada tendida, con la empuñadura por delante, recuerda que \
Washington devolvió su mando y renunció al poder, como el romano Cincinato. \
Los relieves del trono asocian América a la luz y a la fuerza naciente. Pero \
para el público estadounidense, poco familiarizado con el arte neoclásico, la desnudez del padre de la \
nación pareció escandalosa, incluso ridícula: la obra revela el desajuste entre un ideal \
erudito y el gusto de una democracia."""
histoire = """
En 1832, con motivo del centenario del nacimiento de Washington, el Congreso encarga a \
Greenough, instalado en Florencia, una estatua destinada a la rotonda del Capitolio. El \
escultor trabaja en ella casi ocho años, haciendo tallar la obra en un enorme bloque \
de mármol. Concluida en 1840, la estatua cruza el Atlántico y se instala en la \
rotonda en 1841. La acogida es desastrosa: está mal iluminada, su masa inquieta y \
su desnudez escandaliza. Ya en 1843 es trasladada al césped este del Capitolio, expuesta \
a la intemperie; incluso se construye un cobertizo de madera para protegerla. En 1908 es \
trasladada al Smithsonian, al edificio del Castle, y después, en 1964, al nuevo \
museo de historia y tecnología, convertido en el National Museum of American History."""
facture = """
Greenough sigue la enseñanza neoclásica recibida en Roma en el entorno del escultor \
danés Bertel Thorvaldsen: formas idealizadas, superficies lisas, referencias a lo antiguo. \
Modela primero la figura, de la que se saca un modelo en yeso, y después la estatua se \
talla en mármol blanco con la ayuda de operarios italianos, según la costumbre de los \
talleres florentinos. La cabeza se inspira en el busto de Washington realizado del natural \
por Jean-Antoine Houdon en 1785, mientras que el torso y la pose retoman el tipo del \
Zeus entronizado. El paño, de pliegues profundos, contrasta con el pulido de la piel."""
details = [
  "El índice derecho alzado hacia el cielo.",
  "La espada envainada, tendida con la empuñadura por delante, signo de la renuncia al poder.",
  "Las sandalias a la antigua que asoman bajo el paño.",
  "En los costados del trono, Apolo en su carro y Hércules niño con las serpientes.",
]
themes = ["héroe", "antigüedad", "nación", "neoclasicismo", "poder"]
anecdote = """
La estatua suscitó muchas burlas en Washington: se bromeaba sobre un presidente \
que salía del baño o que tendía el brazo para reclamar su ropa. Ninguna otra \
efigie oficial del padre de la nación fue tan escarnecida."""
