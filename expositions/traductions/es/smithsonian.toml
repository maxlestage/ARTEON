[[oeuvres]]
titre = "The Oxbow (El meandro del Connecticut)"
artiste = "Thomas Cole"
annee = "1836"
image = "oxbow.jpg"
technique = "Óleo sobre lienzo, 130,8 × 193 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Tras la tormenta, el río dibuja un meandro: a un lado el bosque salvaje, al otro los campos cultivados."
description = """
Desde la cima del monte Holyoke, en Massachusetts, la mirada se hunde en el valle \
del Connecticut. El lienzo se divide en dos. A la izquierda, un bosque oscuro y un árbol \
fulminado por el rayo, de ramas rotas, se aferran al escarpe, mientras la tormenta \
se aleja soltando aún cortinas de lluvia sobre las colinas. A la derecha, bajo un \
cielo que se despeja, el río describe un amplio meandro entre campos cultivados, \
pastos y bosquecillos; finas columnas de humo se elevan de las granjas y pequeños barcos \
se deslizan sobre el agua. En primer plano, casi oculto entre las rocas, un pintor \
diminuto, con sombrero, está sentado ante su caballete y se vuelve hacia nosotros; \
junto a él se ven una sombrilla y una carpeta de dibujos. La diagonal de la tormenta \
y la de la colina conducen el ojo de la sombra a la luz."""
evocation = """
A menudo se lee el cuadro como un diálogo entre dos Américas: la naturaleza salvaje, \
sublime y amenazadora, y el paisaje domesticado por los colonos, apacible y próspero. \
Cole no se decanta con claridad. En sus escritos celebra la belleza de las extensiones \
vírgenes y se inquieta al verlas desbrozadas a gran velocidad; algunos historiadores \
ven por ello en el valle cultivado una promesa, otros el comienzo de una pérdida. \
La tormenta que pasa puede representar un momento de cambio, el de un país que elige su \
camino. Al representarse trabajando, en el punto de unión de los dos mundos, el pintor \
reivindica su papel de testigo e intérprete del territorio, en una época en que los jóvenes \
Estados Unidos buscan en sus paisajes una grandeza comparable a las ruinas y a las \
catedrales de Europa."""
histoire = """
Cole pinta The Oxbow en 1835-1836, mientras trabaja en El curso del Imperio, el gran \
ciclo de cinco lienzos encargado por el comerciante neoyorquino Luman Reed. Destina este \
paisaje de gran formato a la exposición anual de la National Academy of Design, en Nueva \
York, y elige un lugar ya célebre: el meandro visto desde el monte Holyoke era una de las \
etapas del turismo pintoresco en Nueva Inglaterra, reproducido en guías y \
grabados. El lienzo se expone en la Academia en 1836, el mismo año en que Cole publica su « \
Ensayo sobre el paisaje americano», alegato en favor de la belleza propia de los parajes del Nuevo \
Mundo. El título completo, muy descriptivo, precisa que se trata de una vista tomada después de una \
tormenta. La obra pasa luego por colecciones privadas antes de ser donada al \
Metropolitan Museum of Art en 1908 por Mrs. Russell Sage."""
facture = """
Cole contrapone dos maneras de pintar: a la izquierda, empastes vigorosos, troncos \
retorcidos y verdes oscuros casi negros; a la derecha, una pintura más lisa, de \
verdes tiernos y ocres dorados, donde los campos se detallan con la punta del pincel. \
El formato panorámico y el punto de vista elevado retoman la tradición de las vistas \
topográficas y de los paisajes europeos, de Claudio de Lorena a Turner, que Cole había \
estudiado durante su viaje de 1829-1832. La luz, que horada las nubes sobre \
el valle, unifica la composición y dramatiza el paso de un mundo a otro."""
details = [
  "Abajo, en el centro, el propio pintor, diminuto, sentado ante su caballete.",
  "A la izquierda, el árbol fulminado de ramas quebradas, emblema de la naturaleza salvaje.",
  "La cortina de lluvia que aún cae sobre las colinas de la izquierda.",
  "Las finas columnas de humo que se elevan de las granjas del valle.",
  "En la colina del fondo, las parcelas desbrozadas en las que se ha creído leer unas letras.",
]
themes = ["paisaje", "naturaleza salvaje", "tormenta", "río", "autorretrato"]
anecdote = """
Algunos historiadores han creído descifrar, en los claros de la colina del fondo, \
unas letras hebreas que forman la palabra Noé y, leídas al revés, como desde el cielo, \
Shaddai, «el Todopoderoso». ¿Una firma divina oculta en el paisaje? \
La hipótesis sigue siendo discutida."""
salle = 2
mur = "ouest"
position = -5
largeur = 1.9

[[oeuvres]]
titre = "Among the Sierra Nevada, California"
artiste = "Albert Bierstadt"
annee = "1868"
image = "sierra-nevada.jpg"
technique = "Óleo sobre lienzo, 183 × 305 cm"
collection = "Smithsonian American Art Museum, Washington"
note = "Pintada en Roma a partir de sus bocetos del Oeste: una visión grandiosa, casi divina, de las montañas de California."
description = """
En el corazón de un circo de montañas, un lago inmóvil refleja cumbres nevadas que \
parecen surgir de la bruma. La luz atraviesa un cielo de tormenta, cae en rayos oblicuos \
sobre los acantilados de granito e incendia el centro del lienzo. A la derecha, una cascada \
se precipita por una pared vertiginosa y se pierde en el vapor; a la izquierda, grandes árboles \
oscuros enmarcan la escena como el telón de un teatro. En primer plano, en la orilla, \
unos ciervos se han detenido al borde del agua, y aves acuáticas se posan o \
alzan el vuelo sobre la superficie. Ni rastro humano: ni sendero, ni casa, ni viajero. \
El inmenso lienzo, de más de tres metros de ancho, sitúa al visitante ante un panorama a \
la vez preciso e imposible, tanto es lo que se reúne en una sola mirada."""
evocation = """
Bierstadt compone una especie de jardín del Edén estadounidense, una tierra prometida bañada por una \
luz casi religiosa. Los rayos que atraviesan las nubes se han leído a menudo como \
signo de una bendición concedida al Oeste, en el momento en que Estados Unidos culmina la \
conquista del continente: el primer ferrocarril transcontinental se inaugura al año \
siguiente, en 1869. El cuadro exalta la idea de «destino manifiesto», la convicción \
de que la nación estaba llamada a extenderse hasta el Pacífico. Pero silencia \
a los pueblos amerindios que vivían en esos valles y eran expulsados de ellos. Hoy se ve en él \
tanto una celebración de la naturaleza grandiosa como una imagen idealizada, \
casi publicitaria, de un territorio ofrecido a colonos e inversores."""
histoire = """
Bierstadt descubre la Sierra Nevada y el valle de Yosemite en 1863, durante un largo \
viaje hacia el Oeste con el escritor Fitz Hugh Ludlow, y trae de él numerosos \
estudios pintados del natural. Cinco años después, durante una estancia en Europa, \
compone en su taller de Roma esta vista imaginaria, ensamblada a partir de sus \
bocetos: ningún lugar real corresponde exactamente a este panorama. Antes de enviarla a \
América, la expone en Europa, en particular en Londres y en Berlín, para dar a conocer \
el Oeste americano al público europeo y afianzar allí su reputación. El lienzo pasa \
después a una colección privada estadounidense. Es legado al Smithsonian American Art \
Museum en 1977 por Helen Huntington Hull, y desde entonces figura entre las obras emblemáticas del \
museo."""
facture = """
Formado en Düsseldorf, Bierstadt aplica el método de esta escuela: un dibujo minucioso, \
una superficie lisa en la que la pincelada desaparece, una precisión que llega hasta los reflejos en \
el agua y las siluetas de los animales. Combina este realismo del detalle con una puesta en \
escena teatral: contraluz, violentos contrastes entre zonas de sombra y claros de \
luz, árboles a modo de bastidores, cumbres dispuestas como un decorado. Los tonos cálidos del \
centro, dorados y rosados, se oponen a los azules fríos de las montañas y a los verdes profundos \
de los primeros planos. El formato muy grande, pensado para exponerse en solitario, contribuye al \
efecto."""
details = [
  "La cascada, a la derecha, que cae de una alta pared en una nube de vapor.",
  "Los ciervos detenidos al borde del lago, en primer plano.",
  "Los rayos de sol que atraviesan las nubes e hieren los acantilados.",
  "Las aves acuáticas que rizan la superficie del lago.",
  "El reflejo casi perfecto de las montañas en el agua.",
]
themes = ["montaña", "oeste estadounidense", "luz", "lago", "naturaleza salvaje"]
anecdote = """
El compañero de viaje de Bierstadt en 1863, el escritor Fitz Hugh Ludlow, estaba casado con \
una tal Rosalie. La pareja se divorció poco después, y en 1866 Rosalie se casó con el \
pintor, que se la llevó al año siguiente a su larga estancia europea."""
salle = 2
mur = "ouest"
position = 0.5
largeur = 3.0

[[oeuvres]]
titre = "Niagara"
artiste = "Frederic Edwin Church"
annee = "1857"
image = "niagara.jpg"
technique = "Óleo sobre lienzo, 101,6 × 229,9 cm"
collection = "National Gallery of Art, Washington"
note = "Sin orilla en primer plano: el espectador está al borde del vacío, sobre las cataratas."
description = """
El espectador se encuentra suspendido sobre el vacío, en el punto preciso en que el agua \
se despeña. No hay orilla, ni roca, ni paseante que sirva de referencia: el primer \
plano lo ocupa la lámina verde y blanca del río que se desliza hacia el precipicio. \
La Herradura, la gran catarata vista desde el lado canadiense, dibuja una vasta curva que \
se hunde hacia el fondo, hasta el horizonte donde se perfila una orilla lejana, baja y \
boscosa. Una inmensa nube de rocío sube del abismo y se mezcla con el cielo. A la derecha, un \
arcoíris se forma en la bruma. El formato muy alargado, más de dos veces más \
ancho que alto, estira la catarata de un borde a otro y da a la mirada la sensación de \
recorrer todo el paisaje de un solo movimiento."""
evocation = """
A mediados del siglo XIX, el Niágara es el gran símbolo natural de Estados Unidos, su \
respuesta a los monumentos de Europa. Church lo convierte en una experiencia física: sin tierra \
firme bajo los pies, el visitante siente el vértigo y la potencia del agua, lo que la \
época llamaba lo sublime, mezcla de temor y asombro. El arcoíris, \
signo bíblico de la alianza entre Dios y los hombres tras el Diluvio, se ha \
interpretado a menudo como una promesa dirigida a la nación, en una América protestante que \
veía en sus paisajes la huella de la Creación. También se ha visto en él una visión casi \
científica, fiel a la mirada de Alexander von Humboldt, a quien Church admiraba: la naturaleza \
observada con exactitud, pero concebida como un todo vivo, en perpetuo movimiento."""
histoire = """
Church viaja al Niágara en varias ocasiones en 1856 y multiplica los dibujos y los \
bocetos al óleo, desde todos los ángulos, antes de pintar el gran lienzo en su \
taller de Nueva York en la primavera de 1857. El cuadro se presenta en solitario en la galería de los \
marchantes Williams, Stevens & Williams, y miles de visitantes pagan su entrada para \
verlo; una cromolitografía asegura su difusión. Se expone después en \
Londres, donde llama mucho la atención, y regresa luego a Estados Unidos. Presentado en la Exposición \
Universal de París de 1867, obtiene en ella una medalla. La Corcoran Gallery of Art de \
Washington lo adquiere en 1876. Al cierre de ese museo, en 2014, su colección se \
dispersa, y el Niagara pasa a la National Gallery of Art."""
facture = """
Church pinta con una precisión casi fotográfica: se distingue la transparencia \
del agua verde al borde de la catarata, la espuma que se deshilacha, la luz que atraviesa \
el rocío. Su pincelada permanece invisible, como la de su maestro Thomas Cole y la de los \
paisajistas de la escuela del Hudson, pero rompe con sus composiciones enmarcadas \
por árboles y rocas. El formato panorámico, tomado de los panoramas y de las vistas \
topográficas, y la supresión del primer plano son decisiones audaces. Los \
colores se mantienen contenidos, verdes, blancos azulados y grises dorados, para que todo el efecto \
resida en el movimiento del agua y en la luz."""
details = [
  "El borde de la catarata, en primer plano, donde el agua se vuelve translúcida al despeñarse.",
  "El arcoíris, a la derecha, que nace en la bruma.",
  "La nube de rocío que se confunde con las nubes del cielo.",
  "La línea lejana de la orilla, muy baja, que acentúa la inmensidad.",
]
themes = ["agua", "sublime", "paisaje", "nación", "arcoíris"]
anecdote = """
Diez años después, Church volvió sobre el tema con un cuadro vertical, Las cataratas del \
Niágara vistas desde el lado estadounidense (1867), en el que la catarata cae esta vez de arriba abajo del \
lienzo. Se conserva en la Scottish National Gallery, en Edimburgo."""
salle = 2
mur = "ouest"
position = 5.6
largeur = 2.2

[[oeuvres]]
titre = "Arreglo en gris y negro n.º 1 (La madre del artista)"
artiste = "James McNeill Whistler"
annee = "1871"
image = "mere-whistler.jpg"
technique = "Óleo sobre lienzo, 144,3 × 162,4 cm"
collection = "Museo de Orsay, París"
note = "El pintor quería una armonía de grises y negros; el mundo vio en ella el retrato de todas las madres."
description = """
Una anciana vestida de negro está sentada de perfil, vuelta hacia la izquierda, con las manos \
posadas sobre las rodillas, sosteniendo un pañuelo blanco. Lleva una cofia de encaje \
blanco y puños de encaje a juego. Sus pies descansan sobre un pequeño taburete. \
El decorado queda reducido a casi nada: un muro gris, un zócalo negro, una cortina oscura, \
a la izquierda, salpicada de motivos claros y, colgado de la pared, un marco con un amplio paspartú \
blanco que contiene una estampa del artista que representa el Támesis. La mujer no mira \
al espectador; fija la vista en un punto frente a ella, inmóvil. Las líneas horizontales \
y verticales del muro, del marco y de la cortina construyen una red de rectángulos en \
la que la silueta, de espalda muy recta, se inscribe como una forma oscura."""
evocation = """
Whistler quería que se mirase este cuadro como una composición de formas y de \
tonos, a la manera de una pieza de música, de ahí su título de «arreglo». \
Defendía el arte por el arte y se burlaba de quienes buscaban en él un sentimiento. El \
público, sin embargo, vio en él algo muy distinto: la austera dignidad de una madre anciana, su \
paciencia, una forma de recogimiento casi religioso. Anna McNeill Whistler, mujer \
piadosa y rigurosa, se había reunido con su hijo en Londres durante la guerra de Secesión. \
Con el tiempo, la obra se ha convertido en un icono de la maternidad, e incluso en un símbolo de \
Estados Unidos durante la crisis de los años treinta. Este desajuste entre la intención del pintor \
y la lectura del público forma parte de su historia y de su fama."""
histoire = """
El cuadro se pinta en 1871 en la casa de Whistler en Chelsea, a orillas del \
Támesis. Según el relato transmitido, la pose, prevista en un principio de pie, resultó \
demasiado fatigosa para Anna Whistler, de más de sesenta años, y fue sustituida por \
una pose sentada. En 1872, la obra se presenta en la Royal Academy de Londres, donde \
estuvo a punto de ser rechazada. Whistler, a menudo escaso de dinero, la empeña más tarde. En \
1891, gracias en particular al apoyo de Stéphane Mallarmé y de Georges Clemenceau, el Estado \
francés la adquiere para el Museo del Luxemburgo, consagrado a los artistas vivos: para \
Whistler, es una consagración. El cuadro pasa después al Louvre y, en 1986, al \
Museo de Orsay. Ha viajado mucho, en particular a Estados Unidos en 1932-1934."""
facture = """
La paleta se reduce deliberadamente a grises, negros y blancos, con algunos \
tonos cálidos apenas perceptibles. Whistler aplica una pintura muy diluida, en capas \
finas y casi transparentes, que limpia y retoma hasta obtener la armonía \
buscada. La composición, hecha de planos planos y de rectángulos encajados, debe mucho \
a las estampas japonesas que el artista coleccionaba, como la cortina de motivos, y a \
Velázquez, a quien admiraba por sus negros y sus grises. El perfil estricto, recortado sobre el \
muro, recuerda también la tradición de las medallas y de las siluetas."""
details = [
  "El pañuelo blanco que la anciana sostiene entre las manos.",
  "El pequeño taburete bajo sus pies, que la separa del suelo.",
  "La cortina oscura de motivos, a la izquierda, inspirada en los tejidos japoneses.",
  "El marco en la pared: un aguafuerte de Whistler que representa el Támesis.",
  "Los encajes de la cofia y de los puños, únicos toques de blanco vivo.",
]
themes = ["madre", "retrato", "armonía", "gris", "japonismo"]
anecdote = """
En 1934, el servicio de correos de Estados Unidos emitió con motivo del Día de la Madre un sello que reproducía el \
cuadro, con la inscripción « In memory and in honor of the mothers of America ». El \
retrato de la señora Whistler se convirtió entonces en una imagen nacional."""
salle = 3
mur = "ouest"
position = 0
largeur = 1.6

[[oeuvres]]
titre = "The Gross Clinic (La clínica del doctor Gross)"
artiste = "Thomas Eakins"
annee = "1875"
image = "gross-clinic.jpg"
technique = "Óleo sobre lienzo, 243,8 × 198,1 cm"
collection = "Philadelphia Museum of Art y Pennsylvania Academy of the Fine Arts"
note = "Una operación en el anfiteatro de Filadelfia: el cirujano se vuelve, con el bisturí ensangrentado en la mano."
description = """
En el anfiteatro del Jefferson Medical College de Filadelfia, el doctor Samuel D. \
Gross, de cabello gris alborotado, se ha interrumpido en plena operación para dirigirse \
a los estudiantes. Sostiene un bisturí en la mano derecha, con los dedos enrojecidos de sangre. \
Ante él, sobre la mesa, el paciente, un joven del que apenas se ve más que el \
muslo abierto y los pies, está rodeado por el equipo: unos ayudantes mantienen \
abierta la incisión, otro sostiene sobre su rostro un paño empapado en cloroformo. A la \
izquierda, una mujer de negro, sin duda una pariente del enfermo, se protege los ojos con un \
gesto convulso. En las gradas sumidas en la penumbra, unos estudiantes observan; \
un ayudante toma notas. La luz cae de un tragaluz e ilumina la frente del \
cirujano."""
evocation = """
Eakins hace del cirujano un héroe moderno, un hombre de ciencia de saber seguro, en la \
estela de La lección de anatomía del doctor Tulp de Rembrandt. El contraste entre la calma \
del maestro y el espanto de la mujer opone la razón a la emoción, la ciencia al miedo. \
La operación practicada, que permitía tratar una infección del hueso sin amputar la \
pierna, ilustra los progresos de la cirugía estadounidense, de la que Filadelfia era \
un gran centro. El realismo crudo de la sangre y de la carne fue recibido como una provocación; \
hoy se ve en él la afirmación de la verdad como valor supremo de la pintura \
y la ambición de Eakins de mostrar la vida moderna de su ciudad, sus sabios y sus \
instituciones, sin embellecer nada."""
histoire = """
Eakins, que había seguido cursos de anatomía en el Jefferson Medical College, pinta este \
gran cuadro en 1875 con la esperanza de presentarlo en la Exposición Universal del \
Centenario, organizada en Filadelfia en 1876. El jurado de la sección de bellas artes \
lo descarta, sin duda escandalizado por su crudeza; el lienzo acaba colgado en el \
pabellón médico del ejército, entre el material hospitalario. La crítica se divide: \
unos saludan la fuerza del retrato, otros se horrorizan. En 1878, \
la asociación de antiguos alumnos del Jefferson Medical College lo adquiere por una suma \
modesta y lo dona a la escuela, donde permanece más de un siglo. Cuando la universidad decide \
venderlo, en 2006, una movilización pública permite al Philadelphia Museum of Art \
y a la Pennsylvania Academy of the Fine Arts adquirirlo conjuntamente."""
facture = """
Eakins construye la escena en claroscuro, a la manera de Rembrandt y de los pintores \
