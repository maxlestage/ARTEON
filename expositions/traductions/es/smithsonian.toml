[[oeuvres]]
titre = "Madame X (Madame Pierre Gautreau)"
artiste = "John Singer Sargent"
annee = "1883–1884"
image = "madame-x.jpg"
technique = "Óleo sobre lienzo, 208,6 × 109,9 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El retrato causó escándalo en el Salón: Sargent abandonó París. Lo consideraba el mejor que había pintado."
description = """
Una joven se mantiene en pie, con el cuerpo vuelto hacia nosotros y la cabeza de perfil. \
Lleva un vestido de satén negro de profundo escote, sujeto a los hombros por \
finos tirantes adornados con piedras. Su piel, de una blancura nacarada, contrasta \
violentamente con el negro de la tela y el fondo pardo y cálido. Su mano derecha se apoya en \
un velador, con la muñeca vuelta en un gesto tenso; la izquierda sostiene un abanico \
plegado. En su pelo recogido brilla una pequeña diadema en forma de media luna. \
Ningún otro accesorio, ningún decorado distrae la mirada: todo descansa en la \
silueta, el contraste del negro y el blanco y la línea del perfil, nítido como el \
de una medalla."""
evocation = """
Sargent quería pintar a una belleza célebre del París mundano, Virginie Amélie Avegno, \
nacida en Nueva Orleans y esposa del banquero Pierre Gautreau, estadounidense como él \
e instalado en Francia. El retrato celebra una elegancia fría y escultórica, \
casi abstracta. La media luna evoca a Diana, la cazadora de la mitología, \
diosa altiva e inaccesible. Pero el París de 1884 vio en ella una imagen de arrogancia y \
de seducción exhibida, la de una mujer que hace de su belleza un espectáculo. El cuadro \
dice la ambición de un joven pintor de veintiocho años que quería dar un golpe de efecto \
en el Salón, y la estrecha frontera que separaba la audacia del escándalo en la buena \
sociedad de la Tercera República."""
histoire = """
Sargent solicita él mismo a su modelo, que acepta posar; las sesiones tienen lugar en \
París y, en el verano de 1883, en la propiedad de los Gautreau en Paramé, en Bretaña. Presentado \
en el Salón de 1884 con el título «Retrato de la señora ***», el cuadro desata burlas \
e indignación. Se critica la palidez de la piel, la pose y, sobre todo, el tirante \
derecho, pintado entonces caído sobre el brazo, juzgado indecente. La madre de la modelo pide a \
Sargent que retire la obra, a lo que él se niega. Después repinta el tirante sobre \
el hombro y conserva el lienzo en su taller. Al escasear los encargos parisinos, \
se instala en Londres en 1886. En 1916 vende el cuadro al Metropolitan Museum of Art \
bajo un título que silencia el nombre de la modelo: Madame X."""
facture = """
Alumno de Carolus-Duran, Sargent domina una pintura rápida y fluida, heredada de \
Velázquez y de Frans Hals. Aquí contiene su virtuosismo: la pincelada sigue siendo suelta en \
el vestido y el fondo, pero la carne se trata en superficies lisas, de un blanco teñido de \
gris y de lila, que evoca los polvos con que la joven se cubría. El encuadre \
vertical y estrecho, la silueta recortada sobre un fondo liso recuerdan los retratos de \
cuerpo entero de Velázquez y de Manet. El contorno es de una nitidez casi gráfica."""
details = [
  "La media luna de diamantes, en el cabello, atributo de Diana.",
  "El tirante derecho, repintado sobre el hombro tras el escándalo del Salón.",
  "La mano derecha crispada sobre el borde del velador.",
  "La oreja ligeramente rosada, único toque de color en un rostro muy pálido.",
  "El abanico plegado, casi invisible contra el satén negro.",
]
themes = ["retrato", "elegancia", "escándalo", "parís", "moda"]
anecdote = """
Sargent pintó también una segunda versión del retrato, que dejó inacabada y conservó \
en su taller. Fue adquirida en 1925, el año de su muerte, por la Tate, en Londres, \
donde se encuentra todavía."""
salle = 3
mur = "nord"
