hauteur = 1.5
matiere = "pierre"
socle = 0.4

[[artistes]]
nom = "Thomas Cole"
vie = "Bolton (Inglaterra), 1 de febrero de 1801 – Catskill (Nueva York), 11 de febrero de 1848"
biographie = """
Nacido en Lancashire, en plena revolución industrial, Thomas Cole es primero \
aprendiz de un grabador de motivos para telas estampadas. En 1818, su familia emigra \
a Estados Unidos; vive en Filadelfia y luego en Ohio, donde se hace retratista \
itinerante y aprende pintura casi por sí solo. Establecido en Nueva York en 1825, remonta \
el Hudson y pinta los montes Catskill: sus primeros paisajes son adquiridos por los \
pintores John Trumbull y Asher B. Durand, y el éxito es inmediato. De 1829 a 1832, \
viaja por Inglaterra e Italia, donde estudia a Claudio de Lorena, a Turner y las ruinas \
romanas. A su regreso, el comerciante Luman Reed le encarga El curso del Imperio, cinco \
lienzos sobre el nacimiento, la gloria y la caída de una civilización (1833-1836). En 1836, \
se casa con Maria Bartow y se establece en Catskill, en Cedar Grove, donde acoge a su único \
verdadero discípulo, Frederic Church. Pinta aún el ciclo del Viaje de la vida (1840), \
vuelve a Europa en 1841-1842 y muere de pleuresía en 1848, a los cuarenta y siete años. \
Durand le rinde homenaje en Kindred Spirits (1849)."""
style = """
Cole es considerado el fundador de la escuela del Hudson, primer movimiento de \
paisaje propiamente estadounidense. Asocia una observación atenta de la naturaleza, anotada \
en dibujos tomados del natural, con una composición erudita recompuesta en el taller. \
Sus paisajes contraponen a menudo la sombra y la luz, lo salvaje y lo cultivado, y \
poseen una dimensión moral o religiosa: para él, la naturaleza estadounidense era un \
libro en el que se leía la Creación. Sus ciclos alegóricos, como El curso del Imperio, \
prolongan esta reflexión sobre el destino de las naciones. Durand, Church y toda la \
generación siguiente de paisajistas se nutrieron de su ejemplo."""

[[artistes]]
nom = "Albert Bierstadt"
vie = "Solingen (Prusia), 7 de enero de 1830 – Nueva York, 18 de febrero de 1902"
biographie = """
Nacido en Renania, Albert Bierstadt tiene solo un año cuando su familia emigra a New Bedford, \
puerto ballenero de Massachusetts. En 1853 regresa a Alemania para estudiar en \
Düsseldorf, cuya academia atrae entonces a numerosos estadounidenses; allí trata a Emanuel \
Leutze y a Worthington Whittredge, y recorre los Alpes e Italia. De vuelta en 1857, \
se une en 1859 a la expedición del agrimensor Frederick W. Lander hacia las montañas \
Rocosas, de la que trae bocetos y fotografías. Sus grandes lienzos del Oeste, \
como Las Montañas Rocosas, pico de Lander (1863), lo convierten en uno de los pintores más \
célebres y mejor pagados de América. En 1863 descubre Yosemite; en 1866 \
se casa con Rosalie, la exmujer del escritor Fitz Hugh Ludlow. Reside en Europa de \
1867 a 1869, y luego pinta California, Canadá y Alaska. Pero a partir de la década de \
1880 el gusto cambia: la crítica juzga teatrales sus lienzos, su gran casa \
de Irvington, a orillas del Hudson, se incendia en 1882, y sus negocios decaen hasta la \
quiebra en 1895. Muere en Nueva York en 1902, casi olvidado."""
style = """
Bierstadt une la precisión de la escuela de Düsseldorf, dibujo minucioso y superficie \
lisa, con un sentido del espectáculo heredado del romanticismo. Sus vistas del Oeste están \
recompuestas en el taller a partir de estudios tomados del natural: reúne en ellas cumbres, \
cascadas, lagos y luces doradas para crear una imagen ideal, más grandiosa que \
la realidad. Exponía sus lienzos gigantes en solitario, como acontecimientos. Sus imágenes \
contribuyeron decisivamente a forjar la visión del Oeste en la opinión estadounidense y \
europea, y alimentaron el interés por lugares como Yosemite. Objeto de burla por su \
grandilocuencia al final de su vida, fue redescubierto en la segunda mitad del siglo \
XX."""

[[artistes]]
nom = "Frederic Edwin Church"
vie = "Hartford (Connecticut), 4 de mayo de 1826 – Nueva York, 7 de abril de 1900"
biographie = """
Hijo de un rico hombre de negocios de Hartford, Frederic Edwin Church se convierte en 1844 \
en alumno de Thomas Cole en Catskill, privilegio raro: Cole prácticamente no formó a \
ningún otro discípulo. Ya en 1848, a los veintidós años, es elegido miembro de la National Academy \
of Design. Apasionado por los escritos del naturalista Alexander von Humboldt, parte en \
1853 hacia Colombia y Ecuador, adonde vuelve en 1857. Niagara (1857) y luego El \
corazón de los Andes (1859) causan sensación: expuestos en solitario, los lienzos atraen a multitudes \
de pago. Siguen Crepúsculo en la naturaleza salvaje (1860), Los icebergs (1861), \
tras un viaje frente a las costas de Labrador, y Cotopaxi (1862). En 1860 se casa con Isabel \
Carnes; la muerte de dos de sus hijos, en 1865, lo afecta profundamente. Viaja \
después por Europa y Oriente Próximo (1867-1869), y luego hace construir sobre \
el Hudson Olana, una residencia de inspiración persa cuyo parque también diseña. A \
partir de la década de 1870, el reumatismo le impide poco a poco pintar. Muere en \
Nueva York en 1900, cuando su estilo ha pasado de moda."""
style = """
Church lleva a su cima las ambiciones de la escuela del Hudson. Alía la exactitud \
de un naturalista, atento a la geología, la botánica y los fenómenos del cielo, con \
la búsqueda de efectos grandiosos: puestas de sol ardientes, volcanes, hielos, \
cataratas. Su pintura, lisa y minuciosa, expresa tanto la transparencia del agua \
como la incandescencia de las nubes. Concebía sus grandes lienzos como espectáculos, \
presentados en solitario, con una iluminación estudiada y un marco monumental. Célebre en \
vida, olvidado a comienzos del siglo XX, hoy se le considera uno de los mayores \
paisajistas estadounidenses."""

[[artistes]]
nom = "James McNeill Whistler"
vie = "Lowell (Massachusetts), 11 de julio de 1834 – Londres, 17 de julio de 1903"
biographie = """
James Abbott McNeill Whistler pasa parte de su infancia en San Petersburgo, donde \
su padre, ingeniero, construye una línea de ferrocarril para el zar. De vuelta en \
Estados Unidos, ingresa en la academia militar de West Point, de la que es expulsado en 1854, \
y luego aprende grabado trabajando como cartógrafo. En 1855 parte hacia París, \
frecuenta el taller de Charles Gleyre y entabla amistad con Fantin-Latour y Courbet. Establecido \
en Londres en 1859, reparte su vida entre las dos capitales. Su Sinfonía en blanco n.º \
1, La joven de blanco, causa sensación en el Salón de los Rechazados de 1863. \
Colecciona porcelanas y estampas de Extremo Oriente, pinta sus «nocturnos» \
del Támesis y sus «arreglos». En 1877, el crítico John Ruskin lo acusa de haber \
arrojado un bote de pintura a la cara del público; Whistler le interpone una demanda por \
difamación, que gana en 1878, pero con una indemnización de un farthing, un cuarto de \
penique. Arruinado por los gastos, quiebra en 1879 y se marcha a grabar a Venecia. Las \
décadas de 1880 y 1890 le aportan por fin el reconocimiento, tanto en Francia como en \
Inglaterra. Muere en Londres en 1903."""
style = """
Whistler reivindica el arte por el arte: la pintura no debe ni narrar ni moralizar, \
sino crear una armonía de formas y colores, como la música. De ahí sus títulos, « \
sinfonías», «arreglos», «nocturnos». Su paleta se reduce a menudo a \
unos pocos tonos próximos, aplicados en capas finas y fluidas. Toma de las estampas \
japonesas sus composiciones asimétricas, sus planos de color y sus encuadres, y de \
Velázquez el arte de los grises y los negros. Grabador de primer orden, renovó también \
el aguafuerte. Su concepción de una pintura autónoma, desligada del tema, anuncia \
la abstracción y marcó tanto a los simbolistas como a los modernos."""

[[artistes]]
nom = "Thomas Eakins"
vie = "Filadelfia, 25 de julio de 1844 – Filadelfia, 25 de junio de 1916"
biographie = """
Thomas Eakins pasa casi toda su vida en su ciudad natal, Filadelfia. Tras \
estudiar en la Pennsylvania Academy of the Fine Arts, completados con cursos de anatomía \
en el Jefferson Medical College, parte en 1866 hacia París. Allí estudia en la École des \
Beaux-Arts en el taller de Jean-Léon Gérôme, trabaja también con Léon Bonnat y con el \
escultor Augustin Dumont, y descubre en 1869 a Velázquez y a Ribera en el Museo del Prado, \
en Madrid. De regreso en 1870, pinta a los remeros del río Schuylkill y, después, La \
clínica del doctor Gross en 1875. Profesor en la Pennsylvania Academy a partir de \
1876, y luego director, impone en ella el estudio del modelo desnudo y la disección. En 1886, \
se ve obligado a dimitir tras retirar el taparrabos a un modelo masculino ante \
alumnas. Apasionado por la fotografía, colabora con Eadweard Muybridge en \
el estudio del movimiento. En 1884 se casa con la pintora Susan Macdowell, su antigua \
alumna. Mantenido largo tiempo al margen, pinta La clínica del doctor Agnew en 1889 y solo \
recibe tardíamente algunos honores. Muere en Filadelfia en 1916."""
style = """
Eakins es el gran pintor realista estadounidense de su siglo. Al rigor académico \
aprendido con Gérôme, añade un conocimiento científico de la anatomía, de la \
perspectiva y del movimiento, estudiados mediante la disección y la fotografía. Sus \
cuadros, construidos con una precisión geométrica, rechazan toda adulación: sus \
retratos muestran las arrugas, el cansancio, la introspección. Su paleta oscura y su \
claroscuro deben mucho a los maestros españoles y a Rembrandt. Incomprendido en \
vida, es reconocido en el siglo XX como una figura mayor; a través de su alumno Thomas \
Anshutz, maestro de Robert Henri, influyó también en los realistas de la escuela \
Ashcan."""

[[artistes]]
nom = "John Singer Sargent"
vie = "Florencia, 12 de enero de 1856 – Londres, 14 de abril de 1925"
biographie = """
Nacido en Florencia de padres estadounidenses establecidos en Europa, John Singer Sargent crece al \
compás de los viajes familiares entre Italia, Francia, Suiza y Alemania, y no \
descubre Estados Unidos hasta los veinte años. En 1874 ingresa en París en el taller del \
retratista Carolus-Duran y se impone pronto en el Salón, con Humo de ámbar gris (1880), \
El Jaleo (1882) o Las hijas de Edward Darley Boit (1882). El escándalo de Madame X, en \
1884, frena su carrera parisina: en 1886 se instala en Londres, en el \
barrio de Chelsea. Pintado en el pueblo de Broadway, Carnation, Lily, Lily, Rose \
(1885-1886) es adquirido por la Tate en 1887. Sargent se convierte en el retratista más \
solicitado de la alta sociedad inglesa y estadounidense. Hacia 1907, cansado de los encargos, \
abandona casi el retrato por la acuarela y por grandes decoraciones murales en la \
Boston Public Library y en el Museum of Fine Arts de Boston. Enviado al frente en 1918 \
como pintor de guerra, trae de él Gaseados (Gassed, 1919). Muere en Londres en \
1925."""
style = """
Sargent es célebre por su virtuosismo: una pincelada rápida, amplia y fluida, a menudo \
dada de una sola vez, que produce una impresión de total desenvoltura. Heredero de \
Velázquez y de Frans Hals por la enseñanza de Carolus-Duran, practicó también \
el impresionismo junto a Monet, en Giverny. Sus retratos captan la elegancia, \
el rango social y la personalidad de los modelos, con un agudo sentido de las telas, \
los reflejos y las poses. Sus acuarelas, libres y luminosas, figuran entre las \
más bellas de su tiempo. Juzgado superficial durante mucho tiempo por la crítica modernista, ha \
recuperado desde los años ochenta un lugar de primer plano."""

[[artistes]]
nom = "Mary Cassatt"
vie = "Allegheny City, Pensilvania, 22 de mayo de 1844 – Le Mesnil-Théribus, Oise, 14 de junio de 1926"
biographie = """
Procedente de una familia acomodada de Pensilvania, Mary Cassatt pasa parte de su infancia \
en Europa. Estudia en la Pennsylvania Academy of the Fine Arts y parte en 1866 \
hacia París, donde la École des Beaux-Arts sigue cerrada a las mujeres: toma clases \
particulares, en particular con Jean-Léon Gérôme, y copia a los maestros en el Louvre. \
Admitida en el Salón desde 1868, se instala definitivamente en París en 1874. En 1877, Edgar \
Degas la invita a exponer con los impresionistas; participa en sus exposiciones \
de 1879, 1880, 1881 y 1886, única estadounidense del grupo. Sus padres y su hermana Lydia \
se reúnen con ella en París. Tras la gran exposición de estampas japonesas de 1890, \
realiza una serie de grabados en color. En 1893 pinta una vasta decoración \
para el Woman's Building de la Exposición de Chicago, hoy perdida. Asesora de \
coleccionistas estadounidenses como Louisine y Henry Havemeyer, contribuye a hacer \
entrar el impresionismo en los museos de Estados Unidos. Aquejada de cataratas, \
deja de trabajar hacia 1914 y muere en su castillo de Beaufresne, en el Oise."""
style = """
Mary Cassatt aplica la modernidad impresionista a un universo que conoce \
desde dentro: la vida de las mujeres, la maternidad, el té, la lectura, el palco de teatro. \
Formada en un dibujo riguroso, admiradora de Degas, privilegia la construcción de las \
figuras y los encuadres inesperados antes que la disolución de las formas en la \
luz. Las estampas japonesas le inspiran vistas cenitales, planos de color y \
motivos decorativos. Fue también una notable grabadora, en particular en sus estampas \
en color de 1891, que combinan punta seca y aguatinta. Su obra abrió el camino a las \
mujeres artistas estadounidenses y dio al tema de la madre y el niño una mirada \
moderna."""

[[artistes]]
nom = "Winslow Homer"
vie = "Boston, 24 de febrero de 1836 – Prouts Neck (Maine), 29 de septiembre de 1910"
biographie = """
Hijo de un comerciante de Boston, Winslow Homer aprende el oficio con un litógrafo, \
y se convierte después en ilustrador independiente del semanario Harper's Weekly. Durante la \
guerra de Secesión, sigue al ejército del Potomac y dibuja la vida cotidiana de los \
soldados; su cuadro Prisioneros del frente (1866) lo da a conocer y figura en la \
Exposición Universal de París de 1867, ciudad en la que reside cerca de un año. En la \
década de 1870 pinta la infancia rural, las escuelas de campo, las actividades de \
ocio al aire libre, y se inicia en la acuarela. Una estancia de unos veinte meses en Cullercoats, pueblo de \
pescadores del mar del Norte, en 1881-1882, transforma su arte: el mar, las tempestades y \
la lucha de los hombres contra los elementos pasan a ser sus grandes temas. En 1883 \
se instala en Prouts Neck, en la costa de Maine, donde vive en soledad frente al océano. \
Viaja, sin embargo, a Florida, a las Bahamas, a las Bermudas, y a los bosques de los \
Adirondacks y de Quebec, de donde trae acuarelas deslumbrantes. Soltero y \
reservado, muere en su taller de Prouts Neck en 1910."""
style = """
Homer es, junto con Eakins, uno de los grandes pintores del realismo estadounidense. Procedente de \
la ilustración, conserva el sentido de una composición clara y de un relato inmediatamente \
legible. Su pintura es franca, construida por grandes masas, con una pincelada \
vigorosa que da peso al agua y a las rocas. Observa la naturaleza sin \
sentimentalismo: el mar es en ella poderoso, a menudo amenazador, y el hombre se mide con \
fuerzas que lo superan. Sus acuarelas, de una libertad y una luminosidad \
excepcionales, elevaron este medio a la categoría de gran arte en Estados Unidos. Se le considera \
a menudo el más estadounidense de los pintores de su siglo."""

[[artistes]]
nom = "Horatio Greenough"
vie = "Boston, 6 de septiembre de 1805 – Somerville (Massachusetts), 18 de diciembre de 1852"
biographie = """
Hijo de un rico promotor inmobiliario de Boston, Horatio Greenough se interesa muy \
joven por la escultura y estudia en Harvard. En 1825 parte hacia Roma, donde frecuenta \
el entorno del escultor danés Bertel Thorvaldsen. Tras un breve regreso a \
Estados Unidos, se establece en 1828 en Florencia, convirtiéndose en uno de los primeros escultores \
estadounidenses en hacer carrera en Italia, donde se encuentran mármol, operarios y modelos \
antiguos. El escritor James Fenimore Cooper, su primer gran protector, le encarga \
un grupo de angelotes cantores y luego apoya su candidatura para la estatua de \
Washington, que el Congreso le confía en 1832. Realiza también para el Capitolio El \
rescate (The Rescue), grupo que muestra a un pionero que protege a su familia de un \
guerrero amerindio, instalado en 1853 y retirado en 1958. De regreso en Estados Unidos en 1851, \
publica ensayos sobre arquitectura y objetos, en los que defiende la idea de que la forma \
debe derivar de la función. Muere bruscamente de una fiebre cerebral en 1852, a los \
cuarenta y siete años."""
style = """
Greenough pertenece a la generación neoclásica formada en Italia en la estela de \
Canova y de Thorvaldsen: busca la belleza ideal, las formas puras y la \
referencia a la Antigüedad griega y romana. Su George Washington lleva esta lógica \
hasta el final, con el riesgo de chocar al público estadounidense. Pero fue también un pensador \
original: en sus escritos, critica la imitación de estilos antiguos en arquitectura \
y propugna formas dictadas por el uso, tomando como modelos los barcos y las \
máquinas. Estas ideas hacen de él un precursor del funcionalismo, a menudo relacionado con \
la fórmula «la forma sigue a la función» del arquitecto Louis Sullivan."""

[[artistes]]
nom = "John Rogers"
vie = "Salem (Massachusetts), 30 de octubre de 1829 – New Canaan (Connecticut), 26 de julio de 1904"
biographie = """
Procedente de una familia de Salem, John Rogers interrumpe sus estudios por razones de \
salud y trabaja como mecánico en talleres de maquinaria, y después en una \
compañía ferroviaria de Hannibal, en Misuri. Escultor aficionado, modela \
pequeñas figuras de arcilla en sus ratos libres. En 1858 parte a estudiar a Europa, a \
París y luego a Roma, pero la enseñanza neoclásica lo decepciona y regresa al cabo de \
unos meses. En 1859, un pequeño grupo, Los jugadores de damas, obtiene un gran éxito \
en una venta benéfica en Chicago. Rogers se instala en Nueva York, expone La \
venta de esclavos y funda después su empresa: concibe grupos de género y los \
reproduce en yeso para venderlos a precio moderado, por catálogo. Durante la guerra de \
Secesión, sus escenas de soldados y civiles alcanzan un inmenso éxito. Crea \
así varias decenas de modelos, vendidos en decenas de miles de ejemplares, \
hasta que la enfermedad le obliga a cesar su actividad en la década de 1890. Pasa \
sus últimos años en New Canaan, donde su taller se conserva hoy."""
style = """
Los «grupos Rogers» son escenas de género en tres dimensiones, pequeñas, \
narrativas y accesibles, en las antípodas de las estatuas de mármol idealizadas de la época. \
Rogers relata en ellos historias de la vida cotidiana, de la guerra, de la literatura \
o del teatro, con un realismo preciso de los rostros, los trajes y los objetos, y un \
humor a menudo tierno. Su innovación es también industrial: vaciado en serie, yeso \
pintado, patentes, venta por correspondencia. Hizo entrar la escultura en \
miles de hogares de la clase media estadounidense, y sus grupos se han convertido en \
documentos valiosos sobre los sentimientos y los debates de su tiempo, en particular sobre \
la esclavitud y la guerra."""

[[artistes]]
nom = "Clark Mills"
vie = "Condado de Onondaga (estado de Nueva York), 1810 – Washington, 12 de enero de 1883"
biographie = """
Huérfano muy joven, Clark Mills crece en el estado de Nueva York y ejerce diversos \
oficios manuales antes de hacerse yesero y estucador. Establecido en Charleston, en \
Carolina del Sur, en la década de 1830, perfecciona un método de moldeado del \
natural que le permite realizar bustos a bajo precio; un busto del político \
John C. Calhoun lo da a conocer. En 1848, sin haber visto nunca una estatua ecuestre, \
obtiene el encargo de un monumento a Andrew Jackson para Washington. Construye \
él mismo su fundición y, tras varios fracasos, logra la fundición de la estatua, \
inaugurada en 1853 en Lafayette Square, frente a la Casa Blanca: el caballo encabritado, \
en equilibrio sobre sus patas traseras, es una hazaña técnica, y es la primera \
estatua ecuestre de bronce fundida en Estados Unidos. Realiza después una estatua ecuestre \
de George Washington, inaugurada en 1860. Entre 1860 y 1862, su fundición cuela la \
estatua de la Libertad de Thomas Crawford, que corona la cúpula del Capitolio, con la \
ayuda decisiva de Philip Reid, un obrero al que mantenía esclavizado. Muere en \
Washington en 1883."""
style = """
Mills es un autodidacta, formado por la práctica artesanal del yeso y de la fundición \
más que por las academias. Su talento es ante todo técnico: moldeado del natural, \
fundición del bronce, dominio del equilibrio de las masas, como muestra el caballo encabritado de \
Jackson, que se sostiene sin más apoyo que sus patas traseras. Sus retratos, basados \
en la impronta directa de los rostros, privilegian el parecido más que \
la idealización. Aunque su estilo pareció ingenuo a los escultores formados en Europa, desempeñó un \
papel pionero en el nacimiento de la fundición artística en Estados Unidos y en la estatuaria \
monumental de Washington."""

[[artistes]]
nom = "Chine, dynastie des Qi du Nord"
vie = "China del Norte, 550–577, capital Ye (en la actual provincia de Hebei)"
biographie = """
En el siglo VI, China está dividida entre varias dinastías rivales. En el norte, tras \
la desintegración de los Wei del Norte, se enfrentan los Qi del Norte, al este, y los Zhou del \
Norte, al oeste. Fundada en 550 por Gao Yang, la dinastía de los Qi del Norte reina desde \
Ye, su capital; su corte combina tradiciones chinas y culturas de los pueblos de las \
estepas. Sus soberanos son fervientes budistas: financian templos, \
monasterios y cuevas santuario, como las de Xiangtangshan, excavadas en las \
montañas próximas a la capital. Las esculturas son obra de talleres de canteros \
anónimos, que trabajaban por encargo de la corte, de monjes o de laicos piadosos \
que esperaban acumular así méritos. Llegado de la India por las rutas de Asia \
central, el budismo conoce entonces un auge prodigioso, y numerosos textos se \
traducen, como el Sutra de la Guirnalda de Flores, que describe un universo en el que cada \
partícula contiene todos los mundos. En 577, los Zhou del Norte, que perseguían el \
budismo, conquistan el reino de los Qi y extienden en él las destrucciones. En 581, la \
dinastía Sui reunifica pronto China y restaura la religión. El descubrimiento en 1996, \
en Qingzhou, en Shandong, de cientos de estatuas enterradas reveló el esplendor de la \
escultura de esta época."""
style = """
La escultura de los Qi del Norte marca un punto de inflexión. A las siluetas esbeltas y a los drapeados \
en cascada de los Wei del Norte suceden cuerpos más plenos, casi cilíndricos, \
envueltos en túnicas finas que se pegan a la piel, a la manera de la escultura india \
de la época gupta, cuyos modelos llegaban a China por Asia central. Los \
rostros se vuelven más redondos y más serenos. Las estatuas solían estar pintadas y \
doradas, a veces cubiertas de motivos. Este estilo más natural, atento al volumen del \
cuerpo, prepara el arte de las dinastías Sui y Tang, edad de oro de la escultura budista \
china."""
