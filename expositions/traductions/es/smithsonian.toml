[[sculptures]]
titre = "The Wounded Scout, a Friend in the Swamp"
artiste = "John Rogers"
annee = "1864"
modele = "wounded-scout.stl"
technique = "Yeso pintado"
collection = "Smithsonian American Art Museum, Washington"
note = "Durante la guerra de Secesión, un esclavo fugitivo sostiene a un soldado de la Unión herido: un grupo vendido en miles de ejemplares."
description = """
En un pantano, un hombre negro descalzo, vestido con una camisa y un pantalón raídos, \
sostiene a un soldado del ejército de la Unión, herido y sin fuerzas. El soldado, de \
uniforme, pasa un brazo por los hombros de su salvador y se abandona contra él. \
El hombre negro lo sujeta con firmeza, con el cuerpo tenso por el esfuerzo y la atención. A sus \
pies, entre los juncos y las hierbas del pantano, se desliza una serpiente, recordatorio de los \
peligros del lugar. El grupo, de unos sesenta centímetros de altura, está concebido para ser \
visto desde todos los lados, colocado sobre una mesa o una repisa de salón. El título completo, « \
El explorador herido, un amigo en el pantano», subraya la relación de confianza que une \
a los dos personajes."""
evocation = """
El grupo celebra la ayuda que los esclavos fugitivos y los afroamericanos del Sur \
prestaban a los soldados de la Unión, guiándolos, ocultándolos o cuidándolos. \
En 1864, cuando la guerra arrecia y regimientos negros combaten en \
el ejército federal, la obra afirma una fraternidad entre blancos y negros en la lucha \
contra la esclavitud. Se han señalado, no obstante, sus ambigüedades: el hombre negro es en ella un \
salvador abnegado, pero al servicio del soldado blanco, en un papel que sigue siendo el \
del auxiliar. Para las familias del Norte que lo compraban, este grupo era un signo de \
compromiso patriótico y abolicionista, y un recuerdo de los sacrificios de la guerra, \
instalado en el corazón del hogar."""
histoire = """
John Rogers concibe The Wounded Scout en 1864, en plena guerra de Secesión, cuando \
sus grupos de yeso ya habían conquistado al público del Norte. Había empezado por \
temas ligados a la esclavitud, como La venta de esclavos en 1859, y luego multiplicó las escenas \
de la vida de los soldados y de los civiles durante el conflicto, que respondían a la actualidad \
vivida por sus compradores. The Wounded Scout figura entre sus mayores éxitos. Como \
los demás grupos, se vende por catálogo y en la sala de exposición del \
artista en Nueva York, a un precio accesible para las familias de clase media. El \
Smithsonian American Art Museum conserva numerosos grupos de Rogers; este forma \
parte de las obras digitalizadas en 3D y difundidas en libre acceso."""
facture = """
Rogers modela primero sus figuras en arcilla, luego hace fundir un modelo de bronce, a \
partir del cual se realizan moldes flexibles. Estos moldes permiten vaciar en \
serie pruebas de yeso, ensambladas y cubiertas con una pintura uniforme de color \
masilla, que evoca la piedra o el bronce y disimula las imperfecciones. La precisión del \
detalle, en los pliegues de la ropa, las manos o los juncos, es notable para una \
producción en serie. La composición compacta, casi piramidal, asegura la solidez \
del objeto y su legibilidad desde todos los lados."""
details = [
  "El brazo del soldado pasado por los hombros de su salvador.",
  "Los pies descalzos del hombre negro, apoyados en el suelo del pantano.",
  "La serpiente que se desliza entre los juncos, a sus pies.",
  "El esmero puesto en los pliegues de la ropa y en el uniforme del soldado.",
]
themes = ["guerra de secesión", "esclavitud", "fraternidad", "socorro", "escultura de género"]
anecdote = """
Para protegerse de las copias piratas, Rogers patentó sus creaciones: la mayoría de \
sus grupos llevan, inscritos en el yeso, su nombre y la mención de la patente con su \
fecha. Construyó así una de las primeras empresas de arte popular en serie de \
Estados Unidos."""
