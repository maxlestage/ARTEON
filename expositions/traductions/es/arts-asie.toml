[exposition]
ordre = 25
nom_court = "Artes de Asia"
mouvement = "Pintura china, persa y mogola"
cadre = "estampe"
couleur = "#9a3324"
titre = "Montañas, jardines y emperadores: la pintura de Asia"
artiste = "Fan Kuan, Guo Xi, Zhao Mengfu, Behzad, Reza Abbasi, Bichitr…"
dates = "hacia 1000–1630"
accroche = "Exposición virtual · Museo Guimet, París"
introduction = """
Seis siglos de pintura de Asia, desde la China de los Song hasta la India de los Grandes Mogoles. En \
China, paisajes a la tinta sobre seda o sobre papel, pintados en rollos que se despliegan y se \
contemplan como quien emprende un viaje. En Irán y en la India, miniaturas de manuscritos y de \
álbumes, con colores de piedras preciosas, hechas para príncipes letrados. El edificio se inspira \
en el Museo Guimet de París, fundado por Émile Guimet y abierto en 1889: un vestíbulo, la alta \
rotonda de la biblioteca y luego salas dedicadas cada una a un país."""
vitrine = "voyageurs-monts-ruisseaux.jpg"

[musee]
nom = "Museo Guimet"
ville = "París, Francia"
construction = "abierto en 1889"
presentation = """
Industrial lionés apasionado por las religiones de Asia, Émile Guimet trae de un viaje alrededor \
del mundo, en 1876, centenares de objetos y de libros procedentes de Japón, China y la India. \
Abre un primer museo en Lyon en 1879, después cede sus colecciones al Estado y hace construir en \
París, en la plaza de Iéna, un museo que abre sus puertas en 1889. En la esquina, la fachada se \
redondea en una rotonda, en cuya cima la biblioteca circular conserva la decoración que quiso el \
fundador. En 1945, el museo pasa a ser el departamento de artes asiáticos de los museos \
nacionales: recibe las colecciones asiáticas del Louvre y le cede sus antigüedades egipcias. \
Renovado entre 1996 y 2001 por los arquitectos Henri y Bruno Gaudin, que hacen entrar en él \
abundantemente la luz, presenta hoy una de las mayores colecciones de arte asiático fuera de \
Asia, desde Afganistán hasta Japón: esculturas jemeres, bronces y pinturas de China, artes de la \
India y del Himalaya."""
ici = """
El edificio de ARTEON conserva el recorrido del museo parisino: un vestíbulo y luego una alta \
sala central que evoca la rotonda de la biblioteca, aquí de planta cuadrada. Se entra por el sur \
en el vestíbulo de Iéna y después en «La rotonda · Los grandes paisajes Song», de diez metros de \
altura. Se abre a tres salas más bajas, de seis metros: al oeste, la sala de China · Yuan y \
Ming; al este, la sala de Irán · Herat, Tabriz, Isfahán; y al norte, en el eje, la sala de la \
India · Los Grandes Mogoles. Los muros van del blanco roto al beige dorado."""

