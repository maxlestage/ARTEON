[[oeuvres]]
titre = "Jahangir visita al asceta Jadrup"
artiste = "Govardhan"
annee = "hacia 1616–1620"
image = "jahangir-jadrup.jpg"
technique = "Pigmentos, tinta y oro sobre papel, página de álbum (atribuida a Govardhan)"
collection = "Museo Guimet, París"
note = "Dejando su séquito y su caballo al pie de la colina, el emperador se sienta humildemente ante la gruta de un asceta hindú."
description = """
La página está dividida en dos. Arriba, sobre una colina, ante la entrada oscura y estrecha de \
una gruta, dos hombres están sentados cara a cara. A la izquierda, el asceta Jadrup, de una \
delgadez extrema, casi desnudo, solo lleva un taparrabos y habla alzando las manos. A la \
derecha, el emperador Jahangir, con aureola, vestido de blanco y con turbante naranja, lo \
escucha. Detrás, árboles y, a lo lejos, una ciudad azulada. En medio de la página, una \
extensión de tierra desnuda separa los dos mundos. Abajo espera el séquito imperial: decenas de \
cortesanos con turbante, cada uno con un rostro distinto, un caballo gris adornado con una \
gualdrapa dorada, una sombrilla y un estandarte. Una orla de vid y de pájaros enmarca la \
escena."""
evocation = """
Jahangir, musulmán, se interesa, como su padre Akbar, por las sabidurías de la India. En sus \
memorias, cuenta sus conversaciones con Jadrup, un asceta hindú al que admira por su \
conocimiento de los textos filosóficos del Vedanta. El pintor traduce esta admiración en \
imágenes: el emperador ha dejado tras de sí caballo, armas y cortesanos, y se sienta en el \
propio suelo, a la altura del santo. El gran vacío del centro de la página marca la distancia \
entre el mundo del poder y el de la renuncia. Se lee en ella la tolerancia religiosa de la corte \
mogola, donde se buscaban verdades comunes a las diferentes tradiciones."""
histoire = """
Jahangir conoce a Jadrup hacia 1616-1617 cerca de Ujjain, en el centro de la India, y lo visita \
varias veces; volverá a verlo más tarde en Mathura, donde el asceta se ha instalado. Consigna \
estos encuentros en sus memorias, que hace ilustrar por los pintores de su taller. Esta página \
se atribuye a Govardhan, conocido por sus retratos de santos y de ascetas. Pertenece hoy al \
Museo Guimet de París, que conserva una de las más importantes colecciones de pintura india de \
Francia; otra versión de la escena se encuentra en los Harvard Art Museums."""
facture = """
Govardhan sobresale en el modelado de los cuerpos: el torso descarnado de Jadrup, sus costillas \
salientes y sus brazos flacos están modelados con una suavidad casi táctil. En la multitud, \
cada rostro es un auténtico retrato, de perfil o de tres cuartos, con sus matices de tez. La \
ciudad lejana, difuminada en una bruma azul, muestra la influencia de la pintura europea, \
conocida a través de los grabados. Dominan los colores de tierra, ocre y arena; realzan la \
mancha clara de las vestiduras imperiales."""
details = [
  "La entrada estrecha y oscura de la gruta, entre los dos hombres.",
  "El cuerpo descarnado del asceta, con las costillas visibles.",
  "El caballo gris del emperador y su gualdrapa dorada.",
  "La sombrilla y el estandarte real sobre la multitud.",
  "La ciudad lejana, difuminada en una bruma azul, a la derecha.",
]
themes = ["espiritualidad", "asceta", "emperador", "tolerancia", "imperio mogol"]
anecdote = """
En sus memorias, Jahangir describe el retiro de Jadrup como un simple agujero excavado en la \
ladera de una colina, de abertura tan estrecha que apenas se podía entrar. El asceta vivía allí \
solo, desnudo, y el emperador dice haber disfrutado enormemente de sus conversaciones."""
