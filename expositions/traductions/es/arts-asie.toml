[[oeuvres]]
titre = "El sueño de Jahangir"
artiste = "Abu'l Hasan"
annee = "hacia 1618"
image = "jahangir-shah-abbas.jpg"
technique = "Pigmentos, tinta y oro sobre papel, 23,8 × 15,4 cm"
collection = "Freer Gallery of Art, Washington"
note = "De pie sobre un león, el emperador mogol estrecha entre sus brazos al sah de Irán, posado sobre un cordero: un sueño de Jahangir, puesto en imágenes por su pintor favorito."
description = """
Dos soberanos se abrazan, de pie sobre un globo terráqueo en el que se reconocen continentes. A \
la derecha, más grande, el emperador Jahangir, con chaqueta verde y turbante blanco; a la \
izquierda, más pequeño, Shah Abbas, rey de Irán, con túnica rosa. Bajo sus pies, un león y un \
cordero yacen uno junto a otro, apacibles. Tras ellos, un inmenso disco de oro radiante, \
apoyado en una media luna cuyas puntas sostienen dos cabezas de angelitos alados, se recorta \
sobre un cielo turquesa. Pequeñas inscripciones en persa se reparten por la imagen. El conjunto \
está montado en una página de álbum enmarcada con roleos, flores y pájaros."""
evocation = """
Según una inscripción, la imagen ilustra un sueño de Jahangir, en el que se le había aparecido \
Shah Abbas. Bajo la apariencia de la amistad, es una imagen de dominación: Jahangir es más \
grande, es él quien acoge, y su león, imagen de la fuerza, ocupa una gran parte del globo, hasta \
empujar al cordero hacia el oeste. El león tendido junto al cordero evoca también la justicia \
del reinado, tan perfecta que el fuerte ya no devora al débil. Los dos imperios se disputaban \
entonces la ciudad de Kandahar, en el actual Afganistán: se ha visto en ello el deseo de \
Jahangir de zanjar esta rivalidad, al menos en sueños."""
histoire = """
La página está pintada hacia 1618 por Abu'l Hasan, a quien Jahangir había honrado con el título \
de «Nadir al-Zaman», la maravilla de la época. Forma parte de una serie de imágenes alegóricas \
que el emperador encarga a finales de los años 1610 para expresar su visión del poder. Tras el \
saqueo de Delhi por el rey de Irán Nadir Shah en 1739, numerosas pinturas mogolas parten hacia \
Irán; esta se monta en el siglo XVIII, con su orla florida, en el álbum llamado «de San \
Petersburgo». La Freer Gallery of Art de Washington la adquiere en 1945."""
facture = """
Abu'l Hasan asocia la precisión del retrato mogol, atento a los rasgos de cada rostro, con \
motivos venidos de Europa: el globo terráqueo copiado de los mapas y los globos europeos, las \
cabezas de angelitos, el modelado de los cuerpos. El gran disco de oro, finamente estriado de \
rayos, da a la imagen su resplandor. Los colores son claros y francos, verde, rosa, turquesa, \
sobre los que se recortan las dos siluetas. La orla, con sus flores y sus pájaros, fue añadida \
más tarde."""
details = [
  "El león y el cordero tendidos uno junto a otro sobre el globo.",
  "El mapa del globo, con sus continentes y sus mares.",
  "Las dos cabezas de angelitos alados en las puntas de la media luna.",
  "La diferencia de tamaño entre Jahangir y Shah Abbas.",
  "Los pájaros ocultos en la orla florida.",
]
themes = ["poder", "sueño", "diplomacia", "símbolo", "imperio mogol"]
anecdote = """
Los dos soberanos nunca se encontraron. El abrazo pintado no cambió nada en su rivalidad: en \
