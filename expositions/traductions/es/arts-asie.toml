[[oeuvres]]
titre = "Viajeros entre montañas y arroyos"
artiste = "Fan Kuan"
annee = "hacia 1000"
image = "voyageurs-monts-ruisseaux.jpg"
technique = "Rollo vertical, tinta y colores tenues sobre seda, 206,3 × 103,3 cm"
collection = "Museo Nacional del Palacio, Taipéi"
note = "Una montaña inmensa, casi vertical, domina una diminuta caravana de mulas: la imagen fundacional del gran paisaje chino."
description = """
El rollo, de más de dos metros de altura, se lee de abajo arriba. En primer plano, grandes \
rocas redondeadas cierran el camino. Justo encima, una colina cubierta de árboles nudosos ocupa \
todo el ancho de la pintura; a la derecha, al pie de los árboles, una pequeña caravana de mulas \
cargadas avanza por un sendero, guiada por dos hombres, y entre el follaje se adivinan los \
tejados de un templo. Luego viene una franja de bruma pálida, como un vacío. Más allá se alza la \
montaña principal, una pared enorme y frontal que llena los dos tercios superiores del rollo, \
coronada de matorrales oscuros. En su flanco derecho, una cascada cae en un fino hilo blanco, \
casi invisible en la masa de la roca."""
evocation = """
Todo está hecho para que el espectador se sienta diminuto: los viajeros miden apenas unos \
centímetros frente a una montaña que parece surgir ante él. Se ha visto en ella la expresión de \
un orden del mundo caro a los letrados de los Song del Norte, donde cada cosa ocupa su lugar, \
desde la piedra hasta la cima, y donde el hombre no es más que una parte de un conjunto que lo \
supera. La montaña central, rodeada de colinas más bajas, se ha comparado a menudo con un \
soberano rodeado de sus ministros. La tradición cuenta que Fan Kuan renunció a imitar a los \
maestros para tomar como modelos la naturaleza y, después, su propio corazón: la pintura pasa así \
por ser la imagen misma de un arte nacido de la contemplación directa de las montañas."""
histoire = """
Fan Kuan vive en el cambio del milenio, bajo la dinastía de los Song del Norte, retirado en las \
montañas de Shaanxi, cerca de la antigua capital Chang'an. El rollo no está fechado y se ignora \
para quién fue pintado. Pasa por numerosas colecciones antes de entrar en la de los Qing. En el \
siglo XX, comparte el largo exilio de los tesoros del palacio imperial de Pekín, embalados en \
cajas en 1933 para escapar del ejército japonés, trasladados por toda China durante la guerra y \
luego transportados a Taiwán en 1948-1949. Hoy es una de las joyas del Museo Nacional del \
Palacio de Taipéi, que, para protegerlo de la luz, solo lo expone unas semanas, con varios años \
de intervalo."""
facture = """
La roca está construida con una multitud de pequeñas pinceladas verticales, apretadas como gotas \
de lluvia: los historiadores chinos hablan de «arrugas en gotas de lluvia», una manera asociada \
al nombre de Fan Kuan. Estas rinden el grano y la masa de la piedra mejor que cualquier \
contorno. La tinta, aplicada en capas sobre la seda hoy oscurecida, va del gris ligero al negro \
profundo del follaje. La composición, frontal y simétrica, superpone tres planos separados por \
la bruma, sin perspectiva única: la mirada asciende, plano tras plano, hasta la cima."""
details = [
  "La caravana de mulas y sus dos conductores, abajo a la derecha.",
  "Los tejados de un templo que asoman entre los árboles, a la derecha de la colina.",
  "La cascada, un simple trazo blanco en el flanco derecho de la gran pared.",
  "La franja de bruma al pie de la montaña, que crea un vacío entre los planos.",
  "Los millares de pequeñas pinceladas verticales que forman la roca.",
]
themes = ["montaña", "paisaje", "viaje", "naturaleza", "song del norte"]
anecdote = """
La firma del pintor permaneció oculta casi mil años. Solo en 1958 un investigador del museo, Li \
Lin-ts'an, descubre los dos caracteres de su nombre, Fan Kuan, disimulados en el follaje, abajo \
a la derecha, muy cerca de los viajeros."""
salle = 2
mur = "nord"
place = 1
largeur = 1.05

[[oeuvres]]
titre = "Comienzo de la primavera"
artiste = "Guo Xi"
annee = "1072"
image = "debut-du-printemps.jpg"
technique = "Rollo vertical, tinta y colores tenues sobre seda, 158,3 × 108,1 cm"
collection = "Museo Nacional del Palacio, Taipéi"
note = "Firmado y fechado por el pintor de la corte del emperador Shenzong: la montaña despierta entre la bruma, todavía desnuda, al primer soplo de la primavera."
description = """
Una montaña se eleva ondulante en el centro del rollo, como una columna de nubes petrificadas. \
Sus rocas de formas blandas se enroscan unas sobre otras y se esfuman en la bruma que sube de \
los valles. En primer plano, sobre bloques redondeados, árboles aún desnudos retuercen sus \
ramas. Por todas partes se ocultan pequeñas escenas: abajo a la izquierda, unos pescadores en \
una barca amarrada; abajo a la derecha, una familia que desembarca en la orilla; más arriba, a \
la derecha, los tejados de un templo o de un pabellón anidados en una hondonada, y cascadas que \
se precipitan por la ladera. A la izquierda, la mirada se escapa hacia un valle lejano. Arriba \
a la derecha, se añadió un poema mucho más tarde."""
evocation = """
La pintura capta un momento preciso: el final del invierno, cuando la vida regresa, la bruma se \
levanta y los hombres retoman sus actividades. Guo Xi dejó reflexiones sobre su arte, reunidas \
por su hijo en un tratado, el Alto mensaje de los bosques y las fuentes: en él explica que un \
buen paisaje debe permitir al funcionario retenido en la ciudad viajar, contemplar, pasear y \
morar en él con el espíritu. Se ha leído también esta montaña como una imagen política: un pico \
dominante, rodeado de cumbres ordenadas, a la manera del emperador rodeado de su corte, en la \
época en que el emperador Shenzong emprendía grandes reformas."""
histoire = """
Guo Xi es llamado a la corte hacia 1068 por el joven emperador Shenzong, que admira tanto su \
talento que le encomienda la decoración de numerosos muros y biombos del palacio. El rollo \
lleva, en su borde izquierdo, una breve inscripción del pintor: el título y la fecha, el año \
renzi, que corresponde a 1072. Tras la muerte de Shenzong en 1085, el gusto de la corte cambia y \
sus pinturas son descolgadas. Sin embargo, el Comienzo de la primavera pasa a las colecciones \
imperiales; en el siglo XVIII, el emperador Qianlong hace inscribir en él un poema de su mano, \
arriba a la derecha. Con los tesoros de la Ciudad Prohibida, llega a Taiwán en 1948-1949."""
facture = """
Guo Xi reúne en una sola imagen las «tres distancias» que describe en su tratado: la distancia \
en altura, cuando se alzan los ojos hacia la cima; la distancia en profundidad, cuando se \
sumerge uno en los valles; y la distancia llana, cuando la mirada corre hacia el horizonte. Las \
rocas están modeladas con aguadas de tinta degradadas y trazos enroscados que les dan el aspecto \
de nubes. Las ramas de los árboles, ganchudas como pinzas de cangrejo, proceden de la tradición \
del pintor Li Cheng. Unas pinceladas de color tenue animan la seda."""
details = [
  "La breve inscripción del pintor, con el título y la fecha, en el borde izquierdo.",
  "Los pescadores en su barca amarrada, abajo a la izquierda.",
  "La familia que llega a la orilla, abajo a la derecha.",
  "Las ramas ganchudas de los árboles desnudos, en primer plano.",
  "El poema del emperador Qianlong y su sello, arriba a la derecha.",
]
themes = ["primavera", "montaña", "bruma", "corte imperial", "song del norte"]
anecdote = """
Según el crítico Deng Chun, en el siglo XII las pinturas de Guo Xi cayeron en tal desgracia \
tras la muerte de Shenzong que se las vio servir de trapos para limpiar las mesas del palacio. \
El padre de Deng Chun obtuvo entonces del emperador el derecho a recogerlas."""
salle = 2
mur = "nord"
place = 4
largeur = 1.1

[[oeuvres]]
titre = "Colores de otoño en los montes Qiao y Hua"
artiste = "Zhao Mengfu"
annee = "1295"
image = "couleurs-automne-qiao-hua.jpg"
technique = "Rollo horizontal, tinta y colores sobre papel, 28,4 × 93,2 cm"
collection = "Museo Nacional del Palacio, Taipéi"
note = "Pintado para un amigo que nunca había visto la tierra de sus antepasados: dos montañas de Shandong en medio de los marjales, en otoño."
description = """
El rollo horizontal se despliega de derecha a izquierda, como se lee un texto chino. Una vasta \
llanura húmeda, cubierta de cañas y de marjales, se extiende bajo un cielo pálido. A la derecha \
se alza un pico azul en forma de triángulo puntiagudo: el monte Hua. A la izquierda, una \
montaña baja y redondeada, de un azul verdoso oscuro, casi en forma de hogaza: el monte Que, o \
Qiao. Entre ambos, grupos de árboles de hojas rojas y amarillas, sauces, algunas casas bajas, \
un pequeño rebaño. Abajo a la izquierda, unos pescadores tienden sus redes desde las barcas. El \
cielo está invadido de inscripciones y de sellos rojos, añadidos por los sucesivos \
coleccionistas."""
evocation = """
La pintura es un regalo de amistad y un objeto de memoria. Su destinatario, el letrado Zhou Mi, \
descendía de una familia de Shandong, pero vivía en el Sur y nunca había visto la región de sus \
antepasados. Zhao Mengfu, que acababa de servir allí como funcionario, le pinta este paisaje \
para contárselo. Se ha visto en él también un manifiesto: bajo el dominio mongol, Zhao vuelve \
voluntariamente a la manera de los pintores antiguos, de los Tang y de las Cinco Dinastías, y \
afirma así la continuidad de la cultura china. La calma del paisaje, sin drama ni montaña \
abrumadora, traduce el ideal de una vida retirada, sencilla y letrada."""
histoire = """
Zhao Mengfu, descendiente de la familia imperial de los Song, aceptó servir a la nueva dinastía \
mongola de los Yuan, lo que algunos de sus contemporáneos le reprocharon. Nombrado en la región \
de Jinan, en Shandong, regresa al Sur en 1295 y pinta este rollo para Zhou Mi. Su propia \
inscripción, en el centro izquierda, cuenta esta historia y fecha la obra en el duodécimo mes \
del primer año de la era Yuanzhen, a finales de 1295. El rollo pasa luego de colección en \
colección, y cada propietario estampa en él su sello, antes de entrar en el palacio imperial. El \
emperador Qianlong lo cubre de poemas y de sellos. Hoy se conserva en Taipéi."""
facture = """
Zhao Mengfu elige una ingenuidad aparente: los árboles son casi más grandes que las casas, la \
llanura se ve desde lo alto sin profundidad real, las montañas están colocadas como objetos. \
Este estilo arcaizante imita a los maestros antiguos, en particular a Dong Yuan, cuyas largas \
pinceladas flexibles, en fibras de cáñamo, retoma. El azul mineral de las dos cumbres recuerda \
la pintura «azul y verde» de los Tang. Para Zhao, pintura y caligrafía proceden del mismo \
pincel: cada tronco, cada caña es un trazo de escritura, puesto con tinta casi seca sobre el \
papel."""
details = [
  "A la derecha, el pico triangular del monte Hua; a la izquierda, la masa redondeada del monte Qiao.",
  "Los pescadores y sus redes, en las barcas, abajo a la izquierda.",
  "Las hojas rojas y amarillas del otoño entre los árboles de la llanura.",
  "La inscripción de Zhao Mengfu, a la izquierda del centro, que cuenta la génesis de la pintura.",
  "Las decenas de sellos rojos de los coleccionistas, entre ellos los del emperador Qianlong.",
]
themes = ["paisaje", "otoño", "amistad", "letrados", "dinastía yuan"]
anecdote = """
En la primavera de 1748, el emperador Qianlong, que viaja entonces por Shandong, la región \
pintada por Zhao Mengfu, añade en el rollo un poema dedicado al monte Qiao, fechado en esa \
estación: está inscrito arriba a la izquierda, sobre la montaña redondeada."""
salle = 3
mur = "ouest"
position = 0
largeur = 2.0

[[oeuvres]]
titre = "El alto monte Lu"
artiste = "Shen Zhou"
annee = "1467"
image = "mont-lu.jpg"
technique = "Rollo vertical, tinta y colores tenues sobre papel, 193,8 × 98,1 cm"
collection = "Museo Nacional del Palacio, Taipéi"
note = "Ofrecido por Shen Zhou a su maestro Chen Kuan por su septuagésimo cumpleaños: una montaña que nunca había visto, imagen de la virtud del viejo letrado."
description = """
Las montañas se apilan hasta lo alto del rollo, de casi dos metros de altura. A la izquierda, \
una larga cascada blanca cae por tramos a lo largo de un acantilado, junto a una pasarela de \
madera adosada a la pared, y luego se pierde en un torrente que serpentea hasta la parte baja \
de la pintura. A la derecha, en primer plano, grandes pinos de troncos retorcidos se aferran a \
las rocas. Abajo del todo, diminuto, un letrado de túnica clara se mantiene en pie sobre un \
saliente de roca y contempla la cascada. Arriba a la derecha, unos pitones rocosos emergen de \
las nubes. El título, tres grandes caracteres, y un largo poema de mano del pintor ocupan el \
cielo, arriba a la derecha."""
evocation = """
El monte Lu, en la provincia de Jiangxi, es una de las montañas más famosas de China, cantada \
por los poetas desde hace siglos. Shen Zhou la asocia a su maestro Chen Kuan, cuya familia era \
originaria de esa región: en su poema, la altura de la montaña se convierte en imagen de la \
grandeza moral del anciano. La pintura no es, pues, una vista, sino un homenaje, y el pequeño \
personaje al pie de la cascada se ha interpretado a veces como el propio maestro, o como el \
discípulo que lo contempla. Se lee en ella el ideal de los pintores letrados: pintar un paisaje \
para expresar un pensamiento, una amistad, una admiración."""
histoire = """
En 1467, Shen Zhou tiene cuarenta años. Vive cerca de Suzhou, la gran ciudad letrada del bajo \
Yangzi, y nunca ha ocupado un cargo oficial. Para el septuagésimo aniversario de Chen Kuan, su \
antiguo profesor, pinta este rollo de gran formato, el más ambicioso de sus comienzos, e \
inscribe en él un poema compuesto para la ocasión. Shen Zhou se convertirá después en el \
fundador de la escuela de Wu, que domina la pintura letrada de la región de Suzhou durante más \
de un siglo. El rollo entra más tarde en las colecciones imperiales de los Qing y luego llega a \
Taiwán con los tesoros del palacio. Se conserva en el Museo Nacional del Palacio de Taipéi."""
facture = """
Shen Zhou rinde homenaje al pintor Wang Meng, uno de los grandes maestros de los Yuan, de quien \
retoma la composición densa, sin vacíos, y las innumerables pequeñas pinceladas enroscadas que \
dan a las rocas una textura estremecida. El pincel es minucioso, casi nervioso, muy lejos de la \
manera amplia y rápida de sus obras más tardías. Domina la tinta, realzada con tintes ligeros, \
ocre y azul pálido. La composición en zigzag conduce la mirada del torrente a la cascada y luego \
hasta las cumbres, donde la caligrafía del poema prolonga la pintura."""
details = [
  "El diminuto letrado de pie al pie de la cascada, abajo del todo.",
  "La larga caída de agua que cae por tramos, a la izquierda.",
  "La pasarela de madera adosada al acantilado, junto a la cascada.",
  "Los grandes pinos de troncos retorcidos, abajo a la derecha.",
  "El título en tres grandes caracteres y el largo poema, arriba a la derecha.",
]
themes = ["montaña", "homenaje", "cascada", "letrados", "dinastía ming"]
anecdote = """
Shen Zhou nunca estuvo en el monte Lu. Compuso esta montaña de memoria y de imaginación, a \
partir de los poemas que la celebran y del estilo de Wang Meng: para un pintor letrado, la \
verdad de un paisaje residía en su sentido más que en su parecido."""
salle = 3
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "La seducción de Yusuf"
artiste = "Behzad"
annee = "1488"
image = "yusuf-et-zuleykha.jpg"
technique = "Pigmentos, tinta y oro sobre papel, página de un manuscrito del Bustán de Saadi"
collection = "Biblioteca Nacional de Egipto (Dar al-Kutub), El Cairo"
note = "En un palacio de puertas cerradas con llave, el hermoso Yusuf escapa de Zuleijá: una arquitectura vertiginosa, pintada en Herat para el sultán Husayn Bayqara."
description = """
Un palacio se muestra en corte, como una casa de muñecas: se ven a la vez sus fachadas, sus \
escaleras y sus estancias. A la izquierda, una escalera de madera roja sube en zigzag de un piso \
a otro. Por todas partes, muros cubiertos de azulejos de cerámica azules, turquesa y blancos, \
puertas cerradas, ventanas enrejadas, hornacinas. En lo más alto, en la estancia central, un \
joven de túnica verde, con la cabeza rodeada de un nimbo de llamas de oro, se arranca de una \
mujer de rojo que intenta retenerlo por el vestido. Paneles de poesía caligrafiada se insertan \
en la decoración. El palacio desborda el marco: un pabellón de cúpula y un balcón rojo avanzan \
sobre el margen moteado de oro."""
evocation = """
La historia viene del Corán y de la Biblia: Yusuf, el José del Génesis, es deseado por Zuleijá, \
la esposa de su amo egipcio. El poeta Saadi la cuenta en el Bustán, y Yami, contemporáneo de \
Behzad, la había desarrollado poco antes: Zuleijá hace construir un palacio de siete cámaras, \
cuyas puertas cierra una a una, pero las puertas se abren ante Yusuf, que huye. En la cultura \
sufí, el relato tiene un sentido espiritual: Yusuf es el alma que resiste al deseo, y la gracia \
divina abre las puertas de la trampa. El laberinto de estancias cerradas, sin salida aparente, \
se ha leído a menudo como la imagen del mundo y de sus tentaciones."""
histoire = """
La página pertenece a un manuscrito del Bustán, «el Vergel», colección de relatos morales \
compuesta por Saadi en 1257. Se copia e ilustra en 1488 en Herat, en el actual Afganistán, \
entonces brillante capital de los últimos príncipes timúridas, para la biblioteca del sultán \
Husayn Bayqara, cuyo retrato adorna el doble frontispicio. El pintor Behzad, entonces en plena \
madurez, firma en él varias pinturas, entre ellas esta, que figuran entre las pocas obras que \
los historiadores le atribuyen con certeza. El manuscrito, uno de los más importantes de la \
pintura persa, se conserva hoy en El Cairo, en la Biblioteca Nacional de Egipto."""
facture = """
Behzad emplea los colores más preciosos de su tiempo: el azul de lapislázuli, el verde de \
malaquita, el bermellón y el oro. Los motivos de los azulejos, lacerías geométricas y arabescos \
florales, reproducen fielmente la decoración de la arquitectura timúrida. La perspectiva no \
tiene punto de fuga: cada estancia se ve desde el ángulo que mejor la muestra, y los planos \
encajan como cajones. Las diagonales de la escalera y del cuerpo de Yusuf dan movimiento a una \
imagen por lo demás inmóvil. Las figuras, pequeñas, se distinguen por sus gestos expresivos."""
