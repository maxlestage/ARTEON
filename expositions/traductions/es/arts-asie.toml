[[artistes]]
nom = "Fan Kuan"
vie = "Huayuan (Shaanxi), activo hacia 990 – hacia 1030"
biographie = """
Se sabe poco de Fan Kuan, uno de los más grandes pintores de paisaje de la historia china. Su \
verdadero nombre era Fan Zhongzheng; «Kuan», que significa «ancho» o «indulgente», sería un \
apodo ligado a su carácter bonachón. Originario de Huayuan, en la provincia de Shaanxi, vive \
bajo los primeros emperadores de la dinastía de los Song del Norte. Los textos antiguos lo \
describen como un hombre sencillo, aficionado al vino, atraído por el taoísmo e indiferente a \
los honores. Habría estudiado primero la pintura de Li Cheng y luego, según la tradición, \
decidido que la naturaleza era un maestro mejor que los hombres. Se retira entonces a las \
montañas Zhongnan y Taihua, cerca de la antigua capital Chang'an, donde pasa los días \
observando las rocas, las nubes y la luz. Desde el siglo XI, el crítico Guo Ruoxu lo cuenta, \
junto con Li Cheng y Guan Tong, entre los tres grandes maestros del paisaje de su tiempo. Muy \
pocas obras pueden atribuírsele con certeza: Viajeros entre montañas y arroyos es la única que \
obtiene unanimidad. Sus fechas de nacimiento y de muerte siguen siendo desconocidas; aún vivía a \
comienzos del siglo XI."""
style = """
Fan Kuan es el pintor de la montaña monumental, frontal, abrumadora, vista como un mundo en sí \
mismo. Sus rocas están construidas con innumerables pequeñas pinceladas verticales que \
expresan su densidad y su grano. Sus composiciones, simétricas y escalonadas, separan los \
planos con la bruma. Fijó por siglos el ideal del gran paisaje de los Song del Norte, que \
copiaron y reinterpretaron los pintores de los Yuan, de los Ming y de los Qing."""

[[artistes]]
nom = "Guo Xi"
vie = "Wenxian (Henan), hacia 1020 – hacia 1090"
biographie = """
Guo Xi nace hacia 1020 en Wenxian, en la provincia de Henan, bajo la dinastía de los Song del \
Norte. Formado, al parecer, en parte por sí mismo, estudia las obras del gran paisajista Li \
Cheng y se da a conocer por sus pinturas murales. Hacia 1068, es llamado a la corte de Kaifeng \
por el joven emperador Shenzong, que lo admira hasta el punto de encomendarle la decoración de \
numerosos edificios del palacio y de las administraciones. Se convierte en uno de los pintores \
más destacados de la Academia imperial y forma discípulos. Sus ideas sobre la pintura son \
reunidas por su hijo Guo Si en un tratado, el Alto mensaje de los bosques y las fuentes, uno de \
los textos más importantes de la teoría china del paisaje. En él describe la observación de las \
estaciones, de las horas y de las distancias, y el papel consolador del paisaje para el hombre \
retenido en la ciudad por sus deberes. A la muerte de Shenzong, en 1085, el gusto de la corte \
cambia y su obra cae en desgracia. Muere hacia 1090. Su influencia sigue siendo inmensa: el \
estilo llamado «Li-Guo», que une su nombre al de Li Cheng, domina el paisaje del Norte durante \
varios siglos."""
style = """
Guo Xi pinta montañas vivas, casi cambiantes, hechas de rocas en forma de nubes y de árboles de \
ramas ganchudas. Juega con la bruma y las aguadas de tinta degradadas para hacer sentir el aire, \
la estación y la hora. Teórico de las «tres distancias», compone paisajes donde la mirada puede \
subir, sumergirse y alejarse a la vez. Su pintura une la grandeza del paisaje monumental a una \
observación muy fina de la naturaleza."""

[[artistes]]
nom = "Zhao Mengfu"
vie = "Huzhou (Zhejiang), 1254 – Huzhou, 1322"
biographie = """
Zhao Mengfu nace en 1254 en Huzhou, al sur del lago Tai, en una rama de la familia imperial de \
los Song. Tiene veinticinco años cuando, en 1279, los mongoles de Kublai Khan culminan la \
conquista de China y fundan la dinastía de los Yuan. Vive al principio retirado y luego, en \
1286, acepta la invitación de Kublai y parte a servir en la nueva capital, Dadu, la actual \
Pekín. Esta decisión le vale el desprecio de ciertos letrados que permanecieron fieles a los \
Song. Ocupa cargos en provincias, en particular en Shandong, y asciende después hasta la \
dirección de la Academia Hanlin, en el más alto rango de la administración. Su esposa, Guan \
Daosheng, es ella misma pintora y calígrafa, y su hijo Zhao Yong sigue su camino. Calígrafo \
genial, Zhao Mengfu creó un estilo de escritura que sigue siendo un modelo hasta nuestros días. \
En pintura, practica todos los géneros, paisajes, caballos, bambúes, rocas, y propugna el \
retorno al espíritu de los maestros antiguos. Muere en Huzhou en 1322, colmado de honores \
póstumos."""
style = """
Zhao Mengfu rechaza la virtuosidad decorativa de la Academia de los Song del Sur y vuelve a los \
maestros de los Tang y de las Cinco Dinastías, con una sencillez voluntariamente arcaica. Para \
él, pintar y escribir proceden del mismo gesto: dice que las rocas deben trazarse como la \
escritura «blanco volante» y los árboles como la escritura sigilar. Fundó la estética de la \
pintura letrada, que domina el arte chino hasta el siglo XX."""

[[artistes]]
nom = "Shen Zhou"
vie = "Xiangcheng, cerca de Suzhou, 1427 – 1509"
biographie = """
Shen Zhou nace en 1427 en Xiangcheng, cerca de Suzhou, en una familia acomodada de propietarios \
y de letrados, bajo la dinastía de los Ming. Su abuelo y su padre son poetas, pintores y \
coleccionistas, y crece rodeado de libros y de obras antiguas. A diferencia de la mayoría de \
los letrados de su tiempo, nunca se presenta a los exámenes imperiales y rechaza los cargos \
oficiales; se cuenta que quería permanecer junto a su madre, a la que cuidó hasta una edad muy \
avanzada. Consagra su vida a la poesía, a la caligrafía, a la pintura y al coleccionismo, y \
recibe a amigos y discípulos en su propiedad. Estudia de cerca a los maestros de los Yuan, Wang \
Meng, Huang Gongwang, Ni Zan y Wu Zhen, de quienes posee o copia obras. Su reputación atrae a \
numerosos alumnos, entre ellos Wen Zhengming, que prolongará su enseñanza. Shen Zhou es \
considerado el fundador de la escuela de Wu, por el antiguo nombre de la región de Suzhou. \
Muere en 1509, a los más de ochenta años, figura respetada de toda la sociedad letrada."""
style = """
Shen Zhou comienza con una manera minuciosa, densa, inspirada en Wang Meng, y luego evoluciona \
hacia un pincel más amplio, más libre y más rápido. Sus paisajes, a menudo acompañados de sus \
propios poemas, muestran los paseos y las amistades de los letrados de Suzhou. Pintó también \
flores, pájaros y escenas de la vida cotidiana. Con sus discípulos, hizo de Suzhou el centro de \
la pintura letrada de los Ming."""

[[artistes]]
nom = "Behzad"
vie = "Herat, hacia 1450-1460 – Tabriz, hacia 1535"
biographie = """
Kamal al-Din Behzad nace en Herat, en el actual Afganistán, hacia mediados del siglo XV. \
Huérfano muy joven, es criado, según las fuentes antiguas, por el pintor Mirak Naqqash, director \
de la biblioteca real. Herat es entonces la capital de los últimos príncipes timúridas y uno de \
los grandes focos de la cultura persa. Behzad goza allí de la protección del sultán Husayn \
Bayqara y de su ministro Mir Ali Shir Navai, poeta y mecenas. Ilustra los manuscritos más \
lujosos de la biblioteca real, entre ellos el Bustán de Saadi de 1488. A comienzos del siglo \
XVI, Herat cae en manos de los uzbekos y luego de los safávidas de Irán. Behzad se traslada a \
Tabriz, donde, en 1522, un decreto de Shah Ismail lo nombra director de la biblioteca y del \
taller real. Allí forma a una nueva generación de pintores y contribuye al auge de la pintura \
safávida. Muere hacia 1535, rodeado de una inmensa reputación: durante mucho tiempo se le \
atribuyeron muchas más obras de las que pintó, y su nombre se ha vuelto sinónimo de perfección \
en todo el mundo persa, del Imperio otomano a la India."""
style = """
Behzad renueva la miniatura persa dando vida a sus personajes: posturas variadas, gestos \
expresivos, escenas de la vida cotidiana deslizadas en los relatos. Sus composiciones, muy \
construidas, se organizan en torno a diagonales y a arquitecturas complejas, de decorados \
fielmente reproducidos. Sus colores son intensos pero armoniosos. Su influencia se extiende a \
toda la pintura persa, otomana y mogola del siglo XVI."""

[[artistes]]
nom = "Sultan Muhammad"
vie = "Tabriz, activo hacia 1505 – hacia 1545"
biographie = """
Sultan Muhammad es el más grande pintor de la primera generación safávida, pero su vida sigue \
siendo mal conocida. Se forma sin duda en Tabriz, en la tradición de los pintores turcomanos \
que trabajaban para los príncipes Aq Qoyunlu, antes de la llegada al poder de Shah Ismail I, \
fundador de la dinastía safávida, en 1501. A comienzos de los años 1520, dirige el taller real \
de Tabriz y desempeña un papel mayor en el gran proyecto del Shahnameh destinado al príncipe \
Tahmasp, del que habría sido uno de los maestros del dibujo. Pinta en él, entre otras, La corte \
de Gayumars, página que le vale la admiración de sus contemporáneos. Se le atribuyen también \
pinturas de un célebre Diván del poeta Hafez, hacia 1527, y de una Jamsa de Nizami realizada \
para el sah Tahmasp entre 1539 y 1543, hoy en la British Library de Londres. Su hijo, Mirza \
Ali, se convierte también en un pintor importante del taller real. Se pierde su rastro en los \
años 1540, cuando Shah Tahmasp, ganado por la devoción, se aparta poco a poco de la pintura."""
style = """
Sultan Muhammad une la imaginación desbordada de la pintura turcomana de Tabriz, sus rocas \
fantásticas y sus colores vivos, al rigor de la escuela de Herat. Sus páginas rebosan de \
detalles minúsculos, de rostros ocultos en las rocas, de personajes llenos de humor. Su paleta, \
rica en rosas, malvas y turquesas, y su sentido del movimiento hacen de él el maestro del \
primer estilo safávida."""

[[artistes]]
nom = "Reza Abbasi"
vie = "¿Kashan?, hacia 1565 – Isfahán, 1635"
biographie = """
Reza Abbasi, o Riza-yi Abbasi, nace hacia 1565, sin duda en Kashan, hijo de Ali Asghar, pintor \
al servicio de los soberanos safávidas. Entra joven en el taller de Shah Abbas I, ascendido al \
trono en 1588, que hace de Isfahán su nueva capital y la cubre de mezquitas, de palacios y de \
jardines. El rey le concede el título de Abbasi, que asocia su nombre al del soberano. A \
comienzos del siglo XVII, se aleja un tiempo de la corte, lo que le reprocha el cronista \
Iskandar Beg Munshi, y luego regresa y sigue siendo el pintor más renombrado del reino. En \
lugar de ilustrar grandes manuscritos, se dedica sobre todo a las hojas sueltas, dibujos y \
pinturas destinados a los álbumes de los coleccionistas: jóvenes elegantes, amantes, derviches, \
ancianos, escenas pastorales. Forma a numerosos discípulos, entre ellos Muin Musavvir, que dejó \
un retrato suyo. Su hijo, Shafi Abbasi, se convierte a su vez en un pintor reputado, \
especialista en flores y pájaros. Reza Abbasi muere en Isfahán en 1635, en la cima de su \
gloria."""
style = """
Reza Abbasi es ante todo un dibujante. Su línea caligráfica, flexible y nerviosa, se hincha y se \
adelgaza para seguir los pliegues de los vestidos y las curvas de los cuerpos. Sus figuras, \
elegantes, indolentes, a menudo sensuales, se recortan sobre fondos sencillos realzados con \
oro. Impuso en Isfahán el gusto por la página de álbum y definió el estilo de la pintura \
safávida del siglo XVII, imitado durante generaciones."""

[[artistes]]
nom = "Bichitr"
vie = "India mogola, activo hacia 1610 – hacia 1660"
biographie = """
Bichitr es un pintor hindú de la corte mogola, del que solo se conoce lo que revelan sus obras \
firmadas. Su nombre, de origen sánscrito, significa «maravilloso» o «asombroso». Formado en el \
taller imperial bajo el reinado de Jahangir, emperador de 1605 a 1627, se hace notar por \
retratos y alegorías políticas de extrema finura, como aquella en la que el emperador prefiere \
a un jeque sufí antes que a los reyes. Se representa a sí mismo en ella, lo que muestra la \
estima de que gozaba. Se convierte en uno de los pintores favoritos de Shah Jahan, hijo de \
Jahangir, emperador de 1628 a 1658 y constructor del Taj Mahal. Participa en la ilustración de \
la gran crónica oficial del reinado, el Padshahnama, conservada hoy en la colección real \
británica, y pinta numerosos retratos del emperador, de los príncipes y de los dignatarios. Sus \
obras fechadas se extienden a lo largo de varias décadas, hasta mediados del siglo XVII. Se \
ignoran las fechas de su nacimiento y de su muerte."""
style = """
Bichitr lleva a su cima el acabado de la pintura mogola: retratos de una precisión asombrosa, \
joyas y tejidos rendidos hasta el último detalle, colores luminosos. Integra con soltura \
motivos europeos, angelitos, paisajes en perspectiva atmosférica, modelado de los rostros, en \
composiciones solemnes y simbólicas. Sus imágenes sirven a la gloria imperial sin perder una \
gran humanidad en los rostros."""

[[artistes]]
nom = "Abu'l Hasan"
vie = "Corte mogola, 1588 o 1589 – después de 1630"
biographie = """
Abu'l Hasan nace en 1588 o 1589 en el entorno del príncipe Salim, el futuro emperador Jahangir, \
que lo llama «nacido en su casa». Su padre, Aqa Riza, era un pintor venido de Herat, que entró \
al servicio del príncipe. Precoz, firma hacia los trece años un dibujo a partir de un grabado \
de Alberto Durero que representa a san Juan, hoy en el Ashmolean Museum de Oxford. Cuando Salim \
se convierte en emperador en 1605, Abu'l Hasan se impone como uno de los primeros pintores del \
taller imperial. Pinta la imagen de la entronización de Jahangir, numerosos retratos y las \
grandes alegorías políticas del reinado, en las que el emperador triunfa de sus enemigos o \
abraza al rey de Irán. Jahangir escribe en sus memorias que su obra no tiene igual y le da el \
título de Nadir al-Zaman, «la maravilla de la época». Se le atribuyen también unas Ardillas en \
un plátano, hacia 1610, hoy en la British Library, célebres por su naturalismo. Tras la muerte \
de Jahangir en 1627, se pierde poco a poco su rastro."""
style = """
Abu'l Hasan es un retratista de gran seguridad, capaz de captar la psicología de un rostro. \
Asimiló muy pronto las lecciones del grabado europeo, que funde en la tradición persa e india: \
modelado, globos, angelitos, aureolas radiantes. Sus alegorías, ricas en símbolos, dieron al \
arte mogol una dimensión política y visionaria nueva."""

[[artistes]]
nom = "Govardhan"
vie = "India mogola, activo hacia 1596 – hacia 1645"
biographie = """
Govardhan es un pintor hindú de la corte mogola, hijo de un pintor del taller del emperador \
Akbar. Comienza a trabajar a finales del siglo XVI, bajo Akbar, participando en la ilustración \
de manuscritos históricos y literarios. Prosigue su carrera bajo Jahangir y luego bajo Shah \
Jahan, es decir, casi medio siglo al servicio de los emperadores. Hacia 1610, el pintor Daulat \
lo representa, con otros maestros del taller imperial, en un retrato de grupo de los artistas \
de la corte. Govardhan se distingue por sus retratos llenos de calidez y sobre todo por sus \
imágenes de santos, de ascetas, de músicos y de derviches, temas que trata con una simpatía \
particular. Pinta también escenas de corte y retratos del emperador y de los príncipes, entre \
ellos un célebre doble retrato de Shah Jahan y de su hijo Dara Shikoh. Varias de sus obras se \
conservan en el Museo Guimet de París. Se pierde su rastro hacia mediados del siglo XVII; sus \
fechas de nacimiento y de muerte no se conocen."""
style = """
Govardhan es el pintor de la dulzura y de la interioridad. Su modelado, sutil, rinde la textura \
de la piel, la delgadez de los ascetas, el peso de los cuerpos. Sus rostros, atentos y graves, \
parecen siempre habitados por un pensamiento. Compone escenas calmas, de colores de tierra, \
donde la luz y el espacio desempeñan un gran papel, y sigue siendo uno de los grandes \
retratistas del arte mogol."""
