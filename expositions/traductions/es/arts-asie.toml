[[oeuvres]]
titre = "Los dos amantes"
artiste = "Reza Abbasi"
annee = "1630"
image = "deux-amants.jpg"
technique = "Pigmentos, tinta y oro sobre papel, 18,1 × 11,9 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Firmada y fechada, un abrazo pintado en Isfahán al final de la vida del pintor: una hoja suelta, hecha para ser coleccionada en un álbum."
description = """
Dos jóvenes están sentados, enlazados, tan apretados que ya no forman más que una sola masa. El \
primero lleva un manto pardo forrado de verde y una bufanda anaranjada; el segundo, vestido de \
verde, lleva un pañuelo azul en la cabeza. Sus dos rostros redondos, mejilla contra mejilla, \
casi se parecen. A su alrededor, el fondo ocre está cubierto de una vegetación pintada con oro: \
altas hierbas en penachos, follajes, nubes estilizadas en lo alto. En el suelo, una botella de \
vino, una copa, frutas esparcidas y un plato de granadas. A la izquierda, unas líneas de \
escritura dan la fecha y la firma. Una orla azul adornada con roleos de oro enmarca la escena."""
evocation = """
La imagen respira la sensualidad de la corte safávida de Isfahán a principios del siglo XVII. \
El vino, las frutas y el abrazo evocan la poesía persa, donde el amor humano y la embriaguez \
son también, a menudo, metáforas del amor divino. Reza Abbasi deja voluntariamente flotar una \
ambigüedad: los dos amantes se parecen tanto que durante mucho tiempo se ha debatido sobre su \
identidad. La obra testimonia también un cambio de época: ya no se pintan solo manuscritos para \
el rey, sino hojas sueltas, compradas por cortesanos y mercaderes para sus álbumes, donde se \
admira ante todo la mano del artista."""
histoire = """
Reza Abbasi es entonces el pintor más célebre de Irán. Ha servido a Shah Abbas I, que hizo de \
Isfahán su capital y le dio el derecho a llevar su nombre. El rey muere en 1629; al año \
siguiente, Reza, ya anciano, firma y fecha esta página. La inscripción, a la izquierda, indica \
que fue terminada en el mes de shawwal del año 1039 de la hégira, es decir, en la primavera de \
1630, y concluye con su firma. Como muchas de estas hojas, sin duda fue montada en un álbum. \
Entra en el Metropolitan Museum of Art de Nueva York en 1950."""
facture = """
La línea es la gran fuerza de Reza Abbasi: un trazo caligráfico que se engruesa y se adelgaza, \
se enrosca en los pliegues de los vestidos y da a los cuerpos su flexibilidad. Las dos figuras \
se inscriben en una forma compacta, casi una pirámide. La gama es restringida, pardo, verde, \
anaranjado y azul, aplicada sobre un fondo ocre donde la vegetación está dibujada con oro, con \
un pincel rápido. Este estilo, elegante y nervioso, fue imitado por generaciones de pintores de \
Isfahán."""
details = [
  "La botella de vino y la copa dejadas en el suelo, a la izquierda.",
  "La inscripción a la izquierda, con la fecha y la firma del pintor.",
  "Los dos rostros mejilla contra mejilla, casi idénticos.",
  "Las hierbas y los follajes dibujados con oro sobre el fondo ocre.",
  "El plato de granadas y las frutas esparcidas en la parte inferior de la página.",
]
themes = ["amor", "abrazo", "vino", "isfahán", "álbum"]
anecdote = """
El cronista de Shah Abbas, Iskandar Beg Munshi, reprocha a Reza Abbasi haber abandonado durante \
un tiempo su arte y la corte para frecuentar a luchadores y gente humilde, y añade que tenía un \
carácter difícil. El pintor acabó, sin embargo, regresando al servicio del rey."""
