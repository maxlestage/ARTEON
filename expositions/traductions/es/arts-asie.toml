[[oeuvres]]
titre = "Jahangir prefiere a un jeque sufí antes que a los reyes"
artiste = "Bichitr"
annee = "hacia 1615–1618"
image = "jahangir-cheikh-soufi.jpg"
technique = "Pigmentos, tinta y oro sobre papel, 25,3 × 18,1 cm"
collection = "Freer Gallery of Art, Washington"
note = "Sentado sobre un reloj de arena, el emperador tiende un libro a un viejo sufí e ignora al sultán otomano y al rey de Inglaterra, que esperan a sus pies."
description = """
El emperador Jahangir, sentado en un trono en forma de reloj de arena, está rodeado por un \
inmenso disco de oro que asocia el sol y la media luna. Tiende un libro a un anciano de larga \
barba blanca, un jeque sufí. Debajo de él, en fila, esperan un sultán otomano tocado con un \
turbante, el rey Jacobo I de Inglaterra con su gorguera y su sombrero de pluma y, abajo del \
todo, un hombre de turbante rojo que sostiene una pequeña pintura: el propio pintor. Al pie del \
reloj de arena, dos angelitos escriben en su base, mientras otros dos vuelan en lo alto de la \
página, uno armado con un arco, el otro con el rostro entre las manos. Una ancha orla de flores \
enmarca el conjunto."""
evocation = """
El mensaje está inscrito arriba y abajo de la imagen: aunque los reyes están ante él, el \
emperador vuelve su mirada hacia los derviches. Jahangir se presenta así como un soberano \
místico, que prefiere la sabiduría espiritual al poder terrenal. Pero es también una imagen de \
propaganda: el nombre de Jahangir, «Nur al-Din», significa «luz de la fe», de ahí la aureola \
solar. El reloj de arena recuerda la fugacidad del tiempo, y los ángeles inscriben en él el \
deseo de que la vida del emperador dure mil años. Los dos soberanos extranjeros, relegados a un \
lado, dicen el lugar que Jahangir creía ocupar en el mundo."""
histoire = """
La página está pintada hacia 1615-1618, cuando la corte reside a menudo en Aymer, cerca del \
santuario del santo sufí Muin al-Din Chishti, a quien venera el emperador; el anciano suele \
identificarse como el jeque Husain, guardián de ese santuario. Es también la época en que el \
embajador inglés Sir Thomas Roe reside en la corte, de 1615 a 1619, y regala al emperador \
retratos europeos: el de Jacobo I sirvió de modelo. En el siglo XVIII, la página se monta en un \
gran álbum reunido en Irán, llamado «álbum de San Petersburgo». La Freer Gallery of Art de \
Washington la adquiere en 1942."""
facture = """
Bichitr lleva a la perfección el acabado de los pintores mogoles: cada rostro es un retrato \
individualizado, cada joya está rendida con precisión de orfebre, y el oro ilumina la inmensa \
aureola. Toma del arte europeo, conocido a través de los grabados y los cuadros traídos por los \
jesuitas y los embajadores, el modelado de los rostros, los angelitos y el retrato del rey de \
Inglaterra. Estos elementos extranjeros se mezclan sin fricción con la alfombra azul de \
arabescos, los colores intensos y la orla floral persa."""
details = [
  "El reloj de arena que sirve de trono, y la arena que se escurre.",
  "El rey Jacobo I de Inglaterra, su gorguera blanca y sus joyas.",
  "El autorretrato de Bichitr, de turbante rojo, abajo a la izquierda.",
  "Los dos angelitos que escriben en la base del reloj de arena.",
  "Arriba, el angelito con el arco y el que se oculta el rostro.",
]
themes = ["poder", "misticismo", "tiempo", "retrato", "imperio mogol"]
anecdote = """
Sir Thomas Roe cuenta que había presentado a Jahangir una miniatura inglesa, convencido de que \
ningún pintor indio podría igualarla. El emperador hizo hacer copias tan fieles que el \
embajador, a la luz de una vela, tuvo dificultades para reconocer el original."""
