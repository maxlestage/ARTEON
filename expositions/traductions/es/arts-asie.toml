[[oeuvres]]
titre = "La corte de Gayumars"
artiste = "Sultan Muhammad"
annee = "hacia 1522–1525"
image = "cour-de-gayumars.jpg"
technique = "Pigmentos, tinta y oro sobre papel, página del Shahnameh del sah Tahmasp"
collection = "Aga Khan Museum, Toronto"
note = "El primer rey del mundo, vestido con pieles de leopardo, reina sobre los hombres y las bestias: la página más célebre del Shahnameh del sah Tahmasp."
description = """
En el centro de la página, sobre una roca en forma de trono, el rey Gayumars está sentado con \
las piernas cruzadas, vestido con pieles de leopardo. A su alrededor, las montañas forman un \
anfiteatro de rocas de colores irreales, rosa, malva, azul, turquesa, ocre, del que brota una \
cascada. Las dos figuras que lo flanquean, de pie a la izquierda y arrodillada a la derecha, se \
identifican con su hijo Siyamak y su nieto Hushang. En las laderas, decenas de cortesanos, \
también vestidos con pieles de animales, forman un círculo. Leones, leopardos, ciervos y zorros \
se mezclan con los hombres sin temor. El cielo es de oro, surcado de nubes a la china. Los \
versos del poema enmarcan la escena, y un árbol se escapa del marco hacia lo alto del margen."""
evocation = """
El Shahnameh, el «Libro de los reyes» concluido por el poeta Ferdousí hacia el año 1010, cuenta \
la historia de Irán desde la creación del mundo. Gayumars es su primer rey: vive en las \
montañas, enseña a los hombres a vestirse con pieles, y los animales acuden por sí mismos a \
rendirle homenaje. La página muestra una edad de oro, una armonía entre los hombres, las bestias \
y la naturaleza, justo antes de la tragedia: Siyamak será muerto por un demonio. Se ha visto en \
ella una imagen ideal de la realeza, pintada para la educación del joven príncipe Tahmasp. El \
gran especialista Stuart Cary Welch veía en ella una de las cumbres de toda la pintura persa."""
histoire = """
El Shahnameh del sah Tahmasp es el manuscrito más ambicioso de la pintura persa: más de 250 \
pinturas realizadas en Tabriz, en el taller real de los safávidas, a partir de los años 1520. \
Sultan Muhammad, jefe del taller, pinta esta página entre las primeras. Hacia 1544, el cronista \
Dust Muhammad la cita como una obra ante la cual los más grandes pintores se inclinaban. En \
1568, el sah Tahmasp regala el manuscrito al sultán otomano Selim II. Adquirido a comienzos del \
siglo XX por el barón Edmond de Rothschild, es comprado en 1959 por el coleccionista \
estadounidense Arthur Houghton, que lo desmiembra. La página pertenece hoy al Museo Aga Khan de \
Toronto, inaugurado en 2014."""
facture = """
La página funde dos tradiciones: la pintura visionaria de Tabriz, de rocas atormentadas y \
colores deslumbrantes, y la refinada precisión de la escuela de Herat, heredada de Behzad. El \
pincel, a veces reducido a unos pocos pelos, traza centenares de figuras y de animales, algunos \
de los cuales miden solo unos milímetros. Las rocas, modeladas en degradados pastel, parecen \
hechas de esponja o de coral. El cielo está cubierto con pan de oro, y el margen está sembrado \
de motas de oro. Una lupa revela detalles invisibles a simple vista."""
details = [
  "Los rostros humanos y animales ocultos en las formas de las rocas.",
  "Gayumars, sentado con las piernas cruzadas, vestido con pieles de leopardo.",
  "Los leones y los leopardos tendidos tranquilamente entre los cortesanos.",
  "El cielo de oro y sus nubes arremolinadas a la china.",
  "El árbol que se escapa del marco, sobre el texto.",
]
themes = ["mito", "realeza", "edad de oro", "animales", "epopeya"]
anecdote = """
En 1994, Irán intercambió un cuadro de Willem de Kooning, Woman III, conservado en el Museo de \
Arte Contemporáneo de Teherán, por las 118 páginas restantes del Shahnameh del sah Tahmasp, que \
regresaron así a Irán."""
salle = 4
mur = "est"
position = 0
