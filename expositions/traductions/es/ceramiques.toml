[exposition]
ordre = 24
nom_court = "Cerámicas"
mouvement = "Cerámicas y porcelanas del mundo"
cadre = "vitrine"
couleur = "#2f4f7f"
titre = "Cerámicas y porcelanas del mundo, la tierra y el fuego"
artiste = "Jingdezhen, Longquan, raku, zuñi, Gubbio, Delft, Meissen, Sèvres, Wedgwood…"
dates = "siglos XIII–XIX"
accroche = "Exposición virtual · Museo Nacional de Cerámica, Sèvres"
introduction = """
La cerámica es el más universal de los artes: en todas partes los hombres han modelado la arcilla \
y la han endurecido al fuego. La visita da la vuelta al mundo en diez piezas, del celadón de los \
Song al azul y blanco de los Ming y a los esmaltes rosa de los Qing, de un cuenco de té japonés a \
una tinaja de agua zuñi, de la mayólica italiana a la loza de Delft, hasta las porcelanas de \
Meissen y de Sèvres y el gres de Wedgwood. El edificio se inspira en el Museo Nacional de \
Cerámica de Sèvres, nacido de las colecciones reunidas por Alexandre Brongniart: un vestíbulo \
da paso a una larga galería dedicada a China, desde la cual se accede a tres salas, las de la \
tierra modelada a mano, las de las lozas y las de las manufacturas de Europa."""
vitrine = "jarre-dragon-xuande.jpg"

[musee]
nom = "Museo Nacional de Cerámica"
ville = "Sèvres, Francia"
construction = "1876"
presentation = """
En 1740, una manufactura de porcelana se instala en el castillo de Vincennes; en 1756 se \
traslada a Sèvres, a un vasto edificio construido para ella, y Luis XV la compra en 1759 para \
convertirla en manufactura real. En 1800, el sabio Alexandre Brongniart asume su dirección, que \
conservará durante casi medio siglo. Mineralogista y químico, reúne cerámicas de todos los países \
y de todas las épocas para estudiar las tierras, los vidriados y las cocciones, y en 1824 funda un \
museo de la cerámica y del vidrio, abierto tanto a los sabios como a los artesanos. En 1876, la \
manufactura y su museo dejan sus antiguos locales por nuevos edificios, levantados a orillas del \
Sena, a la entrada del parque de Saint-Cloud. Las colecciones presentan allí las terracotas de \
la Antigüedad, los gres y las porcelanas de Asia, las lozas de Europa y la producción de Sèvres \
misma. Desde 2010, museo y manufactura forman un único establecimiento, Sèvres – Cité de la \
céramique, donde artesanos aún tornean y pintan la porcelana a mano."""
ici = """
El edificio de ARTEON toma del museo de Sèvres su principio: clasificar las cerámicas por \
grandes familias, como quería Brongniart, y mostrarlas en vitrina. Se entra por el sur en el \
vestíbulo Brongniart, de muros crema, y luego en la galería de China, de treinta metros de \
largo y ocho de alto, de muros verde celadón pálido. Al norte se abre la sala «La tierra \
modelada a mano», color arcilla, donde un cuenco japonés convive con una tinaja zuñi; al \
oeste, la sala de las lozas de Europa; al este, la de las manufacturas de Europa, de Meissen \
a Wedgwood."""

