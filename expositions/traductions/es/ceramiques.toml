[[oeuvres]]
titre = "Jarrón meiping"
artiste = "Chine, fours de Longquan"
annee = "siglo XIII"
image = "meiping-longquan.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1957.52.jpg"
technique = "Gres porcelánico con cubierta de celadón, alt. 23,5 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "Un jarrón de hombro redondo, cubierto con un vidriado verde azulado que imita el jade: el celadón de los Song del Sur. Mide 23,5 cm de alto."
description = """
El jarrón se eleva desde un pie estrecho, se ensancha en un hombro amplio y redondeado y se \
estrecha de golpe en un cuello diminuto, apenas más ancho que un gollete. Es la forma \
meiping, el «jarrón de ciruelo». No hay decoración pintada ni grabada: toda la superficie está \
cubierta por un único vidriado espeso, de un verde pálido que tira a azul, lechoso y \
suave como una piedra pulida. Anchas acanaladuras horizontales, regulares, ciñen \
la panza desde el hombro hasta el pie; el vidriado se acumula en sus huecos y adquiere allí un \
tono más intenso. La silueta, ligeramente esbelta, se sostiene sola, sin ningún adorno \
: la forma y el color bastan."""
evocation = """
Los alfareros de Longquan buscaban imitar el jade, la piedra más preciosa de \
China, símbolo de pureza y de virtud para los letrados. Bajo los Song, la élite culta \
prefiere a los decorados recargados la belleza de una forma justa y de un color único: ese gusto \
por la sobriedad, que se vincula con la pintura monocroma y con el pensamiento del \
budismo chan, hace de la contención una marca de refinamiento. El nombre de meiping, dado \
más tarde, evoca la costumbre de colocar en él una sola rama de ciruelo en flor, primera \
floración del final del invierno y emblema del letrado que resiste la adversidad; sin embargo, en \
origen estos jarrones servían sobre todo para conservar el vino. Se ve en él el ideal \
de un arte que se borra tras la materia."""
histoire = """
Los hornos de Longquan, en las colinas del suroeste de Zhejiang, producen gres con \
cubierta verde desde la época de los Song del Norte. Cuando la corte Song, expulsada de \
Kaifeng por los yurchen en 1127, se instala en Hangzhou, en la misma provincia, su \
producción gana en finura: es en el siglo XIII cuando nacen estas cubiertas espesas \
de un verde azulado. Largos hornos de túnel, construidos en la ladera de la colina, cuecen entonces \
miles de piezas en cada hornada, que se venden en todo el imperio y se exportan por mar \
hasta Japón, el Sudeste Asiático, Oriente Medio y las costas de África \
Oriental. Este jarrón fue adquirido en 1957 por el museo de Cleveland, gracias al fondo John L. \
Severance, al marchante Men-Chu Wang."""
facture = """
El jarrón está torneado en una pasta clara y dura, próxima a la porcelana, y luego cubierto \
con varias capas sucesivas de vidriado: los alfareros de Longquan cocían \
ligeramente la pieza, la sumergían de nuevo y volvían a empezar, hasta obtener una \
cubierta a veces más gruesa que la propia pared. Cocida a alta temperatura en un \
horno privado de oxígeno, la pequeña cantidad de hierro contenida en el vidriado adquiere este \
tono verde, mientras que las burbujas y los cristales que quedan en suspensión le dan su \
profundidad lechosa. Los chinos llaman a este tono fenqing, el «verde pulverizado»."""
details = [
  "El cuello diminuto, casi un simple gollete, en lo alto de un hombro muy ancho.",
  "Las acanaladuras horizontales que marcan el ritmo de toda la altura de la panza.",
  "Los hilos más oscuros del vidriado, allí donde se espesa en los huecos.",
  "La ausencia total de decoración pintada: solo el color hace de adorno.",
]
themes = ["celadón", "jade", "china", "song", "monocromo"]
anecdote = """
La palabra «celadón» es francesa. Procedería de Céladon, el pastor enamorado de \
L'Astrée, novela de Honoré d'Urfé publicada a partir de 1607, que llevaba cintas verde \
pálido: el color de los gres chinos recordó a este héroe a los aficionados del siglo XVII."""
salle = 2
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Jarra del dragón"
artiste = "Chine, fours impériaux de Jingdezhen"
annee = "reinado de Xuande (1426–1435)"
image = "jarre-dragon-xuande.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT5083.jpg"
technique = "Porcelana con decoración de azul de cobalto bajo cubierta, alt. 48,3 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un gran dragón serpentea alrededor de esta jarra imperial, que lleva en el hombro la marca del emperador Xuande. Mide 48,3 cm de alto."
description = """
La jarra, tan alta como ancha, tiene un hombro poderoso, un cuello corto y una base \
estrecha. Alrededor de la panza corre un dragón azul sobre fondo blanco: con la boca \
abierta, la crin al viento, el cuerpo cubierto de escamas se despliega en una larga \
ondulación, y sus patas con garras se aferran al vacío. A su alrededor flotan \
nubes de cabezas enroscadas. En el hombro, una línea de pequeños caracteres inscribe la \
marca del reinado de Xuande. El cuello está rodeado por un friso de nubes, y la parte baja de la \
panza por una corona de pétalos de loto estilizados, erguidos como una empalizada. El \
cobalto va del azul profundo, casi negro en las escamas, a tonos más claros en el \
vientre del dragón."""
evocation = """
El dragón es en China una criatura benéfica, señor de las aguas y de la lluvia, y \
desde hace mucho tiempo el emblema del emperador, el Hijo del Cielo. En una pieza salida de los \
hornos imperiales, afirma el poder de la dinastía Ming, que expulsó a los mongoles \
en 1368 y reina entonces sobre un imperio próspero. Su cuerpo en movimiento, entre las nubes, \
expresa la energía que une el cielo y la tierra. El azul y blanco, producido sobre todo para \
la exportación bajo los mongoles, se convierte con los primeros emperadores Ming en un arte cortesano \
: los entendidos chinos han colocado siempre las porcelanas del reinado de Xuande entre \
las más bellas jamás hechas."""
histoire = """
Bajo los Ming, la ciudad de Jingdezhen, en la provincia de Jiangxi, alberga hornos \
colocados bajo el control de la corte, que abastecen al palacio de Pekín de vajilla y \
de jarrones de aparato. Las piezas se encargan allí por series y se controlan una a una; \
las excavaciones han hallado, rotas y enterradas, las que habían sido rechazadas. \
El emperador Xuande, que reina de 1426 a 1435, es un letrado, pintor él mismo, atento a \
las artes: bajo su reinado la inscripción de la marca imperial en las \
porcelanas se vuelve sistemática. Se ignora cuándo la jarra salió de China; fue \
donada al Metropolitan Museum en 1937 por Robert E. Tod."""
facture = """
La porcelana de Jingdezhen combina dos materiales: el caolín, una arcilla blanca, y una \
piedra feldespática molida. La decoración se pinta a pincel con óxido de cobalto sobre \
la pieza cruda y luego se recubre con un vidriado transparente: una sola cocción, hacia 1300 \
°C, lo fija todo. El cobalto empleado entonces, importado del mundo persa, da un azul \
intenso, salpicado de manchas casi negras allí donde el pigmento se ha concentrado: los \
aficionados chinos aprendieron a amar esos accidentes, signo de las piezas de esta época. Las \
grandes jarras de este tipo se montaban en varias partes torneadas por separado y luego \
ensambladas antes de la cocción."""
details = [
  "La marca del reinado de Xuande, en pequeños caracteres alineados en el hombro.",
  "Las escamas del dragón, dibujadas una a una, de un azul casi negro.",
  "Las patas del dragón, con las garras al descubierto.",
  "La corona de pétalos de loto en la parte baja de la panza.",
  "El friso de nubes que rodea el cuello.",
]
themes = ["porcelana", "azul y blanco", "dragón", "emperador", "ming"]
anecdote = """
El azul y blanco chino ha dado la vuelta al mundo: imitado en Irán, en Turquía, en Japón, \
luego en Delft y en Inglaterra, figura entre los decorados cerámicos más copiados de \
la historia. La pirámide de Delft, en una sala vecina, es una heredera suya."""
salle = 2
mur = "nord"
place = 7
largeur = 1.2

[[oeuvres]]
titre = "Jarrón de los melocotones"
artiste = "Chine, fours impériaux de Jingdezhen"
annee = "reinado de Qianlong (1736–1795)"
image = "vase-aux-peches.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1944.184.1.jpg"
technique = "Porcelana con decoración de esmaltes de la familia rosa, alt. 51,4 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "En este gran jarrón imperial, un melocotonero con flores y frutos se enrosca alrededor de la panza: un deseo de larga vida. Mide 51,4 cm de alto."
description = """
El jarrón tiene la forma llamada tianqiuping, el «jarrón de globo celeste»: una panza casi \
esférica coronada por un largo cuello recto. Sobre el fondo blanco, un viejo melocotonero nudoso \
surge de la parte baja de la panza y lanza sus ramas alrededor de todo el jarrón. Grandes melocotones, \
de un rosa intenso que palidece hacia el amarillo, cuelgan en racimos entre las hojas verde \
tierno y turquesa. El pintor ha reunido en el árbol las flores y los frutos: \
flores blancas y rosas, capullos, melocotones maduros. Una rama más ligera sube \
hasta el cuello, donde aún florece. El tronco, gris y pardo, está representado con sus nudos \
y su corteza, como en una pintura sobre seda."""
evocation = """
El melocotón es en China el fruto de la inmortalidad: según la leyenda, la Reina Madre \
de Occidente cultiva en su jardín del monte Kunlun melocotoneros cuyos frutos, maduros cada \
tres mil años, dan la vida eterna. Un jarrón cubierto de melocotones es, pues, un deseo \
de longevidad, regalado por ejemplo en un cumpleaños. Los jarrones de este tipo llevan \
a menudo nueve melocotones: en chino, jiu significa «nueve» y, con la misma pronunciación, «mucho \
tiempo». En este decorado donde la flor y el fruto se codean, se lee también el ciclo de \
las estaciones reunido en una sola imagen de abundancia, en pleno largo reinado de Qianlong, \
uno de los más prósperos de la historia china."""
histoire = """
La familia rosa debe su nombre, dado en el siglo XIX por el coleccionista francés Albert \
Jacquemart, a un esmalte rosa obtenido a partir de oro, llegado a China hacia 1720 por \
mediación de los europeos, sin duda jesuitas al servicio del emperador Kangxi. \
Bajo Yongzheng y luego bajo Qianlong, los talleres de Jingdezhen y los del palacio de Pekín \
dominan a la perfección estos esmaltes y producen para la corte piezas de una finura \
extrema. Este jarrón perteneció a Elisabeth Severance Prentiss, filántropa de Cleveland, \
que lo legó al museo en 1944 junto con su pareja."""
facture = """
Los esmaltes de la familia rosa se pintan sobre la porcelana ya cocida y vidriada y luego se \
fijan con una segunda cocción, a baja temperatura, en un pequeño horno de mufla. Su \
novedad reside en el blanco opaco, a base de arsénico, que el pintor mezcla con los colores: \
así puede degradar los tonos, del rosa intenso al rosa pálido, y modelar el volumen de los \
frutos. Las hojas se aplican en planos de verde y de turquesa, y las nervaduras y el \
tronco se perfilan con un trazo fino. La regularidad del globo y la blancura sin defecto del fondo \
atestiguan la maestría de los hornos imperiales."""
details = [
  "Los melocotones, cuyo rosa se funde hacia el amarillo pálido, como en un fruto de verdad.",
  "El tronco nudoso que surge en la parte baja de la panza.",
  "La rama florida que trepa a lo largo del cuello.",
  "Las flores y los capullos que se codean con los frutos maduros en el mismo árbol.",
]
themes = ["porcelana", "familia rosa", "melocotón", "longevidad", "qing"]
anecdote = """
El emperador Qianlong, gran coleccionista, hizo grabar en cerámicas antiguas de \
sus colecciones poemas que él mismo había compuesto en su honor. Bajo su \
reinado, la porcelana imperial lo imitaba todo: el bronce, el jade, la madera, la laca."""
salle = 2
mur = "sud"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Cuenco de té de raku negro"
artiste = "Japon, céramique raku"
annee = "principios del siglo XVII"
image = "bol-raku-noir.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DP247421.jpg"
technique = "Terracota con vidriado raku negro, 9,2 × 9,5 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un cuenco modelado a mano, sin torno, para la ceremonia del té: el arte de la irregularidad buscada. Mide 9,2 cm de alto y aquí se muestra muy ampliado."
description = """
El cuenco es casi cilíndrico, apenas más ancho que alto, con paredes rectas que \
se ensanchan ligeramente hacia abajo y un pie corto. Su borde no es del todo \
redondo: ondula, se aplana en algunos puntos, y la pared conserva ligeras facetas, \
huellas de la espátula que la formó. Toda la superficie está cubierta de un vidriado negro, \
mate y granuloso, por el que asoman reflejos pardo rojizos. Nada está decorado: la forma, el \
peso, la materia y el color lo son todo. El cuenco está hecho para sostenerse con las dos manos, \
a la altura del rostro, mientras se bebe el té verde batido hasta formar espuma."""
evocation = """
Este cuenco pertenece al mundo de la ceremonia del té, tal como la configuró el maestro Sen \
no Rikyū en el siglo XVI: un arte de recibir basado en la sencillez, el desprendimiento \
y la atención al momento presente. El gusto llamado wabi prefiere en ella lo rústico a lo \
suntuoso, lo irregular a lo perfecto, lo gastado a lo nuevo. El negro del cuenco, que hace resaltar el \
verde vivo del té, invita al recogimiento. Su asimetría no es torpeza: \
hace único cada cuenco y, en la tradición japonesa, un cuenco puede recibir un nombre, \
una historia, un linaje de propietarios. Se ha visto en él el exacto opuesto de la porcelana \
imperial china, lisa y perfecta."""
histoire = """
El raku nace en Kioto en los años 1570–1580, cuando el alfarero Chōjirō, que hasta entonces fabricaba \
tejas, realiza para Sen no Rikyū los primeros cuencos de té modelados a \
mano. Según la tradición, el regente Toyotomi Hideyoshi habría regalado después a la \
familia un sello con el carácter raku, «alegría, comodidad», tomado del nombre de su \
palacio, el Jurakudai: la palabra quedó en la familia y en su cerámica. Este cuenco, de \
la época Momoyama o de los primerísimos años de la época de Edo, no se atribuye a \
ningún alfarero concreto. El Metropolitan Museum lo adquirió en 1917, con cargo al fondo Rogers."""
facture = """
El cuenco no está torneado: se modela a mano a partir de una bola de arcilla y luego se \
adelgaza y se ahueca con la espátula. Tras una primera cocción, recibe varias capas \
de un vidriado hecho con una piedra negra molida, rica en hierro y en manganeso. La cocción \
se hace pieza por pieza, en un pequeño horno calentado con carbón vegetal y avivado con \
fuelle; cuando el vidriado se ha fundido, el alfarero retira el cuenco incandescente con \
largas pinzas y lo deja enfriar bruscamente al aire. Este choque da al negro su \
aspecto profundo y ligeramente rugoso."""
details = [
  "El borde irregular, que ondula y se aplana en algunos puntos.",
  "Las ligeras facetas dejadas por la espátula en la pared.",
  "Los reflejos pardo rojizos en el negro del vidriado.",
  "El pie bajo y estrecho, sobre el que el cuenco parece apoyarse en retirada.",
]
themes = ["ceremonia del té", "wabi", "raku", "japón", "imperfección"]
anecdote = """
La familia Raku de Kioto perpetúa este arte desde hace más de cuatro siglos: sus jefes \
sucesivos llevan el nombre de Raku Kichizaemon, y el heredero actual es el decimosexto de \
la estirpe. En Occidente, la palabra designa también una técnica de cocción rápida inspirada en \
esta tradición."""
salle = 3
mur = "nord"
place = 2
largeur = 0.7

[[oeuvres]]
titre = "Tinaja de agua del pájaro de la lluvia"
artiste = "Pueblo de Zuni"
annee = "1850–1860"
image = "jarre-zuni-oiseau-de-pluie.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1937.898.jpg"
technique = "Terracota con engobe blanco, decoración pintada en negro y rojo, 25,5 × 33 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "Una tinaja de agua pintada por una alfarera zuñi de Nuevo México, donde volutas y ganchos figuran el pájaro que trae la lluvia. Mide 33 cm de ancho."
description = """
La tinaja es ancha y rechoncha: una panza redonda, un hombro marcado, un cuello corto y \
recto. Sobre un fondo blanco cremoso, un decorado negro cubre casi toda la superficie. En la \
panza, grandes formas escalonadas, rellenas de finas rayas oblicuas, encajan \
unas en otras; en el centro, un gran círculo perfilado de negro, prolongado por un \
gancho, atrae la mirada. Flecos de trazos verticales cuelgan como dientes de \
peine. El cuello lleva otro friso, donde reaparecen una forma ovalada y motivos \
escalonados. Pequeños toques de un rojo pardo animan el negro. La base, recubierta de pardo \
oscuro, ha quedado sin decoración."""
evocation = """
En las tierras áridas del suroeste estadounidense, la lluvia es la condición misma de la vida, \
y buena parte de la vida religiosa de los zuñis está orientada hacia ella. El «pájaro de la \
lluvia», que los especialistas reconocen en estas volutas y ganchos, asocia el \
pájaro, mensajero entre la tierra y el cielo, con las nubes cargadas de agua; las formas \
escalonadas evocan a menudo, en el arte de los pueblos, las nubes en terrazas. Pintado en la \
tinaja que sirve para transportar y guardar el agua, este decorado es a la vez adorno y plegaria. El \
sentido preciso de cada motivo, transmitido en el seno de la comunidad, no siempre es, sin embargo, \
conocido por los investigadores."""
histoire = """
La tinaja fue modelada hacia 1850–1860 en el pueblo de Zuni, en el oeste de \
Nuevo México, territorio que Estados Unidos acababa de anexionar tras la guerra contra \
México. Entre los zuñis, la alfarería es cosa de mujeres, que se transmiten las \
técnicas y los motivos; la alfarera no dejó su nombre. A partir de 1879, expediciones de la \
Smithsonian Institution llevan a Washington miles de piezas de \
alfarería zuñi, y los coleccionistas empiezan a buscarlas. Esta fue \
donada en 1937 al museo de Cleveland por Amelia Elizabeth White, coleccionista \
establecida en Santa Fe y defensora de las artes amerindias. Se ignoran las \
circunstancias en que había salido del pueblo."""
facture = """
La tinaja se monta sin torno, a la colombina: la alfarera superpone rollos de arcilla, \
luego los alisa y adelgaza la pared con un trozo de calabaza. A continuación la cubre \
con un engobe blanco, una arcilla fina diluida en agua, aplicado en varias \
capas. El decorado se pinta con un pincel hecho de una hoja de yuca masticada: el \
negro se obtiene de vegetales y minerales, el rojo de una tierra ocre. La cocción se hace \
al aire libre, con la tinaja colocada bajo un abrigo de combustible, a menudo excremento de oveja, \
que arde unas horas."""
details = [
  "El gran círculo en el centro de la panza, perfilado de negro y prolongado por un gancho.",
  "Las finas rayas oblicuas que rellenan las formas escalonadas.",
  "Los flecos de trazos verticales, como cortinas de lluvia.",
  "Los pequeños toques rojos colocados entre el negro.",
  "La base oscura, sin decoración, sobre la que descansa la tinaja.",
]
themes = ["pueblo", "lluvia", "pájaro", "agua", "amerindio"]
anecdote = """
Las mujeres zuñis llevaban estas tinajas llenas de agua sobre la cabeza, apoyadas en un pequeño \
anillo trenzado de yuca. La base de estas tinajas es, por cierto, ligeramente cóncava, para \
mantenerse bien sobre ese anillo."""
salle = 3
