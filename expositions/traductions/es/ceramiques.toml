[[oeuvres]]
titre = "Plato de las Tres Gracias"
artiste = "Maestro Giorgio Andreoli"
annee = "hacia 1525"
image = "plat-trois-graces.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1945.2.jpg"
technique = "Mayólica (loza) pintada, realzada con reflejos metálicos, diám. 44,8 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "Las Tres Gracias desnudas bajo palmeras, en un paisaje italiano: un plato de aparato de Gubbio, realzado con reflejos de oro. Mide 44,8 cm de diámetro."
description = """
En el centro del plato, en un medallón, tres jóvenes desnudas se mantienen abrazadas sobre \
una pradera: la del medio, vista de espaldas, posa las manos sobre los hombros de sus \
compañeras, que se presentan de frente y de tres cuartos. Llevan collares \
rojos y el cabello recogido. Tras ellas se alzan tres palmeras; a lo lejos \
se extienden colinas, un río y, a la izquierda, una ciudad de tejados rojos. A uno \
y otro lado, dos fuentes vierten agua azul junto a cortinajes dispuestos sobre \
pedestales. El ancho borde del plato, el ala, lleva un friso de follaje y de rombos \
inscritos en medallones, sobre fondo azul. Por todas partes, reflejos dorados e irisados juegan \
en la superficie."""
evocation = """
Las Tres Gracias, hijas de Zeus en la mitología griega, personifican la belleza, la \
alegría y la abundancia; los autores antiguos veían en ellas también los beneficios que se dan, \
que se reciben y que se devuelven. Su grupo, con la figura central vista de espaldas, \
retoma una célebre composición antigua, redescubierta en el Renacimiento y difundida por \
el grabado. En un gran plato de aparato, que se exponía en un aparador en lugar de \
usarse en la mesa, este tema profano expresa el gusto de las cortes italianas por la Antigüedad \
y la cultura humanista. El reflejo metálico, que hace brillar la pieza a la luz de las velas, \
da a una simple terracota el brillo de un metal precioso."""
histoire = """
Gubbio, pequeña ciudad de Umbría que pertenece entonces al ducado de Urbino, debe su fama \
cerámica al taller de Maestro Giorgio Andreoli, especialista en el reflejo metálico. A \
principios del siglo XVI, este taller aplica el lustre a sus propias piezas y recibe otras, \
pintadas en otros lugares, para añadirles esos reflejos. El plato llevaba una firma y una \
fecha, leídas en el siglo XIX, pero se rompió y desaparecieron durante la \
reparación. Perteneció al coleccionista ruso Alexandre Basilewsky, en París, cuya \
colección fue comprada en 1884 por el zar Alejandro III para el Hermitage de \
San Petersburgo. Salido más tarde de ese museo, pasó por el marchante neoyorquino \
Rosenberg & Stiebel antes de ingresar en el museo de Cleveland en 1945."""
facture = """
La mayólica es una terracota cubierta de un esmalte blanco y opaco, a base de estaño, \
sobre el que se pinta con óxidos metálicos: azul de cobalto, verde de cobre, amarillo \
de antimonio, naranja de hierro, violeta de manganeso. Tras la cocción de este decorado, el taller \
de Gubbio añade el lustre: una mezcla de compuestos de plata y de cobre, aplicada con \
pincel en ciertas zonas y fijada luego con una nueva cocción, a baja temperatura, \
en un humo espeso. Los metales se depositan entonces en una película muy fina que \
devuelve la luz en reflejos de oro y de rubí. Esta técnica, llegada del mundo \
islámico por España, era un secreto de taller celosamente guardado."""
details = [
  "La Gracia del medio, vista de espaldas, que abraza a sus dos compañeras.",
  "Los collares rojos en el cuello de las tres jóvenes.",
  "La pequeña ciudad de tejados rojos, a lo lejos a la izquierda.",
  "Las dos fuentes cuya agua azul fluye junto a los cortinajes.",
  "Los reflejos dorados del lustre en el ala y en el borde del plato.",
]
themes = ["mayólica", "mitología", "renacimiento", "lustre", "belleza"]
anecdote = """
La palabra «mayólica» procedería de Mallorca: las lozas con reflejo metálico de España llegaban \
a Italia a bordo de barcos que pasaban por esa isla, y los italianos dieron ese nombre a la \
cerámica que admiraban, antes de aplicarlo a su propia producción."""
salle = 4
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Pirámide de flores"
artiste = "Faïencerie De Metaale Pot"
annee = "hacia 1692–1700"
image = "pyramide-a-fleurs-delft.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Bloempiramide,_BK-2004-4-A.jpg"
technique = "Loza pintada en azul, once elementos, alt. 156 cm"
collection = "Rijksmuseum, Ámsterdam"
note = "Una torre de loza azul de varios pisos, erizada de picos donde se clavaban flores cortadas: el lujo de Holanda a finales del siglo XVII. Mide 1,56 m de alto."
description = """
De más de un metro y medio de altura, la pirámide se eleva como una pagoda. Se asienta sobre \
un pedestal cuadrado sostenido por cuatro leones tumbados. En la cara del pedestal, en un \
interior abierto a un jardín, personajes vestidos a la china conversan, uno \
de ellos tocando un instrumento de cuerda. Más arriba, figuras con busto de mujer, \
rematadas en volutas, sostienen una plataforma de la que parten nueve pisos cuadrados, cada vez \
más pequeños. Cada piso está provisto, en las esquinas, de picos tubulares donde se \
introducían los tallos de las flores, y pintado con pequeñas escenas, personajes y jarrones \
con flores. En la cima, un busto de mujer corona el conjunto. Todo está pintado en azul de \
cobalto sobre fondo blanco."""
evocation = """
En el siglo XVII, las flores, y en primer lugar el tulipán, son en las Provincias Unidas objeto de \
pasión, de saber y de especulación: durante la «tulipomanía» de 1636–1637, el bulbo \
de una variedad rara llegó a venderse al precio de una casa. Una pirámide como esta \
permitía componer un ramo espectacular, con cada flor aislada en su pico, y \
mostrar a la vez la riqueza y el gusto de su dueño. Su decoración dice también la fascinación de \
Europa por China, conocida a través de las porcelanas traídas por la Compañía de las \
Indias Orientales: pagoda, personajes y paisajes se imaginan a partir de ellas, por \
pintores que nunca habían visto Asia."""
histoire = """
En el siglo XVII, Delft ve cómo muchas de sus antiguas cervecerías, en declive, se reconvierten \
en fábricas de loza. Cuando los disturbios del final de los Ming desorganizan la llegada de \
porcelana china, a mediados de siglo, los ceramistas de Delft toman el relevo e \
imitan el azul y blanco. Las pirámides de flores están de moda a finales de siglo, en \
particular en la corte de Guillermo III de Orange y de su esposa María II, reina \
de Inglaterra, que con ellas adorna sus residencias. Esta pirámide se atribuye a la fábrica \
De Metaale Pot, entonces dirigida por Lambertus van Eenhoorn. Forma pareja con una \
segunda pirámide; el Rijksmuseum las compró juntas en 2004, con la ayuda de \
varias fundaciones y mecenas."""
facture = """
La loza de Delft es una terracota recubierta de un esmalte blanco de estaño, que imita \
la blancura de la porcelana sin tener su dureza ni su transparencia. La decoración se \
pinta con cobalto sobre el esmalte aún crudo, que absorbe el color como un papel: el pintor \
debe trabajar rápido y sin arrepentimientos. Cada piso se modela y se cuece por separado, y luego \
los elementos se apilan unos sobre otros. Los pisos huecos servían de \
depósitos de agua, donde se sumergían los tallos. El dibujo, de un azul matizado del más claro al \
más oscuro, se inspira en las porcelanas chinas de finales del siglo XVII."""
details = [
  "El busto de mujer que corona la cima de la pirámide.",
  "Los picos tubulares en las esquinas de cada piso, destinados a los tallos de las flores.",
  "El músico que toca un instrumento de cuerda, en la cara del pedestal.",
  "Los cuatro leones tumbados que sirven de pies.",
  "Las figuras con busto de mujer y volutas que sostienen la plataforma.",
]
themes = ["loza", "delft", "flores", "tulipán", "chinoiserie"]
anecdote = """
De las numerosas fábricas de loza activas en Delft en el siglo XVII, solo una ha sobrevivido hasta \
nuestros días: De Porceleyne Fles, fundada en 1653 y conocida como Royal Delft, donde \
aún se pinta la loza a mano."""
salle = 4
mur = "ouest"
place = 2
largeur = 0.7

[[oeuvres]]
titre = "Plato del servicio de los cisnes"
artiste = "Johann Joachim Kändler"
annee = "1737–1741"
image = "assiette-service-aux-cygnes.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1951.103.jpg"
technique = "Porcelana dura con decoración en relieve, esmaltes y oro, diám. 42 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "Dos cisnes y una garza en relieve en un plato en forma de concha, con las armas del conde de Brühl: el servicio de porcelana más célebre del siglo XVIII. Mide 42 cm de diámetro."
description = """
El plato, de borde ondulado, es casi enteramente blanco. Todo su hueco está esculpido en \
relieve: anchas costillas irradian desde la parte superior como las de una concha de \
vieira. En el centro, dos cisnes nadan frente a frente entre los juncos, sobre un agua \
agitada por remolinos; encima de ellos, una garza alza el vuelo con las alas desplegadas. En \
el ala, ramilletes de flores y pequeños insectos están pintados en colores vivos, y el \
borde se subraya con un fino festón de oro. Arriba, un blasón timbrado con coronas y \
sostenido por dos leones lleva las armas unidas del conde Heinrich von Brühl y de su \
esposa, nacida condesa Kolowrat-Krakowsky."""
evocation = """
Todo el servicio es un himno al agua: cisnes, garzas, conchas, juncos, peces y \
divinidades marinas se responden de una pieza a otra. El tema jugaría con el nombre del \
comitente: en alemán, Brühl designa una pradera húmeda, un prado pantanoso. Para \
el ministro del elector de Sajonia, este servicio era un instrumento de prestigio: las \
grandes cenas de corte, con sus centenares de piezas a juego, eran una puesta en \
escena del poder. El blanco casi desnudo de los relieves, apenas realzado con flores, dice también \
el orgullo de Meissen, primera manufactura europea que dominó la verdadera porcelana, \
capaz de rivalizar con China y Japón."""
histoire = """
El conde Heinrich von Brühl, favorito y luego primer ministro de Augusto III, elector de \
Sajonia y rey de Polonia, se convierte en 1733 en director de la manufactura de Meissen. Se hace \
hacer allí, entre 1737 y 1741, un servicio de mesa de más de dos mil piezas, modelado \
por Johann Joachim Kändler con su colaborador Johann Friedrich Eberlein. El servicio \
permaneció en la familia Brühl hasta el siglo XX; disperso desde entonces, se reparte \
entre numerosos museos y colecciones. Este plato, que pasó por el palacio Brühl de Varsovia \
y por el conde Szembek, descendiente de la familia, fue donado al museo de Cleveland en \
1951 por la casa Rosenberg & Stiebel, con motivo del trigésimo quinto aniversario del museo."""
facture = """
La porcelana dura de Meissen se hace con caolín, feldespato y cuarzo, cocidos hacia \
1400 °C: es blanca, dura, translúcida en capa fina. Para un servicio de esta \
envergadura, Kändler esculpe primero un modelo original, del que se sacan moldes de yeso; \
la pasta se prensa en ellos, de modo que cada plato reproduce fielmente el relieve, como una \
pequeña escultura. Los relieves se dejan blancos, para que la luz juegue sobre las \
ondulaciones del agua y las plumas de las aves. Las flores del ala, pintadas al esmalte, \
se inspiran en las porcelanas del Extremo Oriente, muy buscadas en la corte de Sajonia."""
details = [
  "Los dos cisnes que se miran de frente entre los juncos.",
  "La garza que alza el vuelo, con las alas abiertas, sobre ellos.",
  "Las costillas radiantes de la concha esculpida en el fondo del plato.",
  "El blasón de los Brühl, sostenido por dos leones, en lo alto del ala.",
  "Los pequeños insectos pintados entre las flores.",
]
themes = ["porcelana", "meissen", "cisne", "agua", "rococó"]
anecdote = """
El secreto de la porcelana dura se desveló en Sajonia hacia 1708 gracias al alquimista Johann \
Friedrich Böttger, a quien el rey Augusto el Fuerte mantenía prisionero para que le \
fabricara oro. No encontró el oro, sino el «oro blanco» que hizo la fortuna de \
Sajonia."""
salle = 5
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Sopera del rey"
artiste = "Manufacture de Sèvres"
annee = "1756–1757"
image = "terrine-du-roi.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1949.15.jpg"
technique = "Porcelana blanda, fondo verde, decoración pintada y dorada, alt. 24,2 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "Una sopera con pies de fondo verde, adornada con amorcillos pintados en cartuchos dorados: el lujo de los primeros años de Sèvres. Mide 24,2 cm de alto."
description = """
La sopera, ovalada y abombada, se apoya en cuatro pies curvados, adornados con hojas \
de acanto doradas, y se prolonga a los lados en asas caladas, en forma de ramas \
retorcidas. Su tapa abombada está rematada por un fruto amarillo anaranjado rodeado de hojas \
verdes, que sirve de asidero. El fondo es de un verde vivo y luminoso, enmarcado por roleos \
de oro. En la panza, un gran cartucho blanco muestra dos amorcillos regordetes, sentados sobre \
nubes, que juegan con una guirnalda de flores, junto a un carcaj y flechas. En \
la tapa, otro cartucho presenta un pequeño trofeo de atributos apoyado sobre una \
nube."""
evocation = """
Los amorcillos, las flores y las nubes pertenecen al repertorio del rococó, el arte de la \
gracia y del placer que triunfa en Francia bajo Luis XV, y cuyo pintor más célebre es François Boucher. \
Una sopera servía para presentar en la mesa los guisos y \
las sopas; pero una pieza tan preciosa estaba hecha para ser admirada tanto como para \
servir. Habla del arte de vivir de una élite para la que la comida era un espectáculo, y \
de la ambición de una manufactura respaldada por el rey y por Madame de Pompadour, que quería \
superar a Meissen. Los amorcillos que juegan en el cielo convierten un plato de cocina en una \
pequeña escena de mitología amable."""
histoire = """
Fundada en Vincennes hacia 1740, la manufactura se instala en 1756 en Sèvres, a medio camino entre \
París y Versalles. Esta sopera figura entre sus primeras producciones en el lugar: \
la letra D pintada bajo la pieza, entre las dos L entrelazadas del monograma de Luis XV, \
corresponde al año 1756. Los cartuchos se asocian al pintor Charles-Nicolas \
Dodin, especialista en figuras, ingresado en la manufactura en 1754 y que trabajará allí casi \
cincuenta años. El modelo lleva el nombre de «sopera del rey». El museo de Cleveland \
compró la pieza en 1949, gracias al fondo John L. Severance."""
facture = """
Antes de 1770, Sèvres no dispone del caolín necesario para la porcelana dura: produce \
una porcelana llamada blanda, hecha de una frita vítrea mezclada con arcilla, cocida a \
menor temperatura. Más frágil y más difícil de trabajar, ofrece en cambio un vidriado en el que \
los colores se funden ligeramente, de donde resultan tonos de una suavidad \
y un brillo particulares. El fondo verde se aplica en capa regular, \
reservando cartuchos blancos que luego se pintan con pincel fino, al modo de \
miniaturas. El oro, aplicado en polvo y luego bruñido, dibuja los roleos y subraya los \
relieves de los pies y de las asas."""
details = [
  "Los dos amorcillos sentados sobre las nubes, con su guirnalda de flores.",
  "El fruto rodeado de hojas que sirve de asidero a la tapa.",
  "Los pies en volutas, cubiertos de hojas de acanto doradas.",
  "Las asas caladas en forma de ramas retorcidas.",
  "Los roleos de oro que enmarcan los cartuchos sobre el fondo verde.",
]
themes = ["porcelana", "sèvres", "rococó", "amorcillos", "arte de la mesa"]
anecdote = """
Cada pieza de Sèvres lleva una letra que indica su año: A para 1753, B para 1754, \
y así sucesivamente. Al llegar a la Z en 1777, la manufactura vuelve a empezar con letras \
dobles, AA, BB… Gracias a este sistema, las porcelanas de Sèvres se datan con precisión de un año."""
salle = 5
mur = "est"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Jarrón Portland"
artiste = "Josiah Wedgwood"
annee = "hacia 1790"
image = "vase-portland.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1918.823.jpg"
technique = "Gres fino llamado jaspe, negro, con relieves blancos aplicados, alt. 26,4 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "La copia en gres «jaspe» de un célebre jarrón romano de vidrio camafeo: el gran desafío técnico de Wedgwood. Mide 26,4 cm de alto."
description = """
El jarrón tiene la forma de un ánfora achaparrada: una panza ovoide, un cuello estrecho, dos asas \
que caen desde los hombros. Sobre el fondo negro, figuras blancas en relieve se destacan \
como camafeos. A la izquierda, un hombre envuelto en un manto sale de un pórtico; en el centro, una joven \
sentada sobre una roca sostiene en el regazo una serpiente, o un monstruo marino, que \
se yergue hacia ella; encima vuela un pequeño Amor armado con un arco; a la derecha, un hombre \
barbudo la mira, apoyado en una roca. Un árbol de ramas finas extiende su follaje \
sobre la escena. El pie se subraya con un delgado filete blanco."""
evocation = """
El sentido de la escena, ya misterioso en el jarrón antiguo, nunca se ha establecido con \
certeza. Las interpretaciones más frecuentes ven en ella las bodas del héroe Peleo y \
de la ninfa marina Tetis, futuros padres de Aquiles, o una alegoría del amor y de \
la muerte; otros han leído en ella un episodio de la historia de Augusto. Para Wedgwood y sus \
contemporáneos, lo esencial estaba en otra parte: reproducir el jarrón más admirado de \
la Antigüedad era demostrar que la industria inglesa podía igualar el arte de los Antiguos. \
Este jarrón se ha convertido en uno de los emblemas del neoclasicismo, ese regreso a la Antigüedad que \
se extiende por toda Europa a finales del siglo XVIII."""
histoire = """
El jarrón original, de vidrio camafeo, se hizo en Roma hacia comienzos de nuestra era. En el \
siglo XVII pertenece a la familia Barberini, luego al diplomático y coleccionista \
William Hamilton, que lo cede a la duquesa de Portland; de ella conserva el nombre. En 1786, \
su hijo, el tercer duque de Portland, se lo presta a Josiah Wedgwood. El alfarero tarda casi \
cuatro años en lograr una copia satisfactoria, al precio de innumerables pruebas: las \
piezas se agrietan o se deforman, los relieves se desprenden en la cocción. La primera \
edición, terminada hacia 1790, cuenta solo con unas decenas de ejemplares. Este jarrón fue \
donado al museo de Cleveland en 1918 por la señora L. E. Holden. El original se conserva en el \
British Museum."""
facture = """
El jaspe, puesto a punto por Wedgwood hacia 1774–1775 tras miles de pruebas anotadas \
en sus cuadernos, es un gres fino, sin esmaltar, a base de sulfato de bario, que se \
puede teñir en la masa: azul, verde, lila, amarillo o, como aquí, negro. Las figuras \
se moldean aparte en una pasta blanca y luego se aplican una a una sobre el jarrón aún \
húmedo, antes de la cocción. Para imitar el vidrio camafeo del original, donde el fondo oscuro \
transparece bajo las partes más delgadas del vidrio blanco, los relieves se \
retocaron a mano, adelgazándolos y cincelándolos, para crear sombras y transparencias."""
details = [
  "El pequeño Amor que vuela sobre la escena, con un arco en la mano.",
  "La mujer sentada que sostiene en el regazo una serpiente o un monstruo marino.",
  "El hombre que sale de un pórtico, a la izquierda.",
  "Los relieves blancos adelgazados hasta dejar adivinar el fondo negro.",
]
themes = ["neoclasicismo", "antigüedad", "jaspe", "wedgwood", "camafeo"]
anecdote = """
En 1845, un visitante del British Museum rompió el jarrón antiguo en numerosísimos \
fragmentos. Pegado con paciencia, fue restaurado de nuevo en 1948 y luego a finales de los \
años ochenta. Las copias de Wedgwood guardan la memoria de su estado anterior al drama."""
salle = 5
mur = "sud"
place = 2
largeur = 0.8

[[artistes]]
nom = "Chine, fours de Longquan"
vie = "Región de Longquan, provincia de Zhejiang (China), del siglo X al XVII"
biographie = """
Longquan es una región de colinas boscosas del suroeste de Zhejiang, rica en arcilla, \
en madera y en cursos de agua: todo lo que necesitan los alfareros. Allí se cuecen gres con \
cubierta verde desde la época de los Song del Norte, en la línea de los celadones de Yue, \
producidos más al norte en la misma provincia. La producción despega en el siglo XII, \
cuando la corte Song, expulsada de Kaifeng por los yurchen, se instala en Hangzhou: la \
demanda de las élites del Sur y del comercio marítimo no deja de crecer. Los alfareros \
construyen en la ladera de las colinas hornos llamados «dragones», largos túneles de ladrillo donde \
se cuecen de una vez miles de piezas. En el siglo XIII ponen a punto las \
cubiertas espesas de un verde azulado que hacen su gloria. Bajo los Yuan y a comienzos de los \
Ming, Longquan abastece aún a la corte y exporta masivamente, de Japón a Egipto y a las \
costas de África Oriental; luego el azul y blanco de Jingdezhen la suplanta poco \
a poco. Los arqueólogos han localizado en la región muchísimos yacimientos de hornos."""
style = """
El celadón de Longquan se reconoce por sus formas simples y plenas, a menudo tomadas de \
bronces antiguos o de objetos de culto, y por su cubierta espesa, de un verde tierno \
y lechoso, que recuerda el jade. La decoración, cuando existe, es sobria: algunas \
acanaladuras, pétalos grabados, peces moldeados en relieve. Este gusto por la perfección \
discreta ha marcado profundamente la cerámica de Asia oriental, y los celadones de \
Longquan, conservados como tesoros en Japón, se han imitado hasta en Europa."""

[[artistes]]
nom = "Chine, fours impériaux de Jingdezhen"
vie = "Jingdezhen, provincia de Jiangxi (China), desde el siglo XI"
biographie = """
Jingdezhen, ciudad del noreste de Jiangxi, debe su nombre a la era Jingde (1004–1007) del \
emperador Song Zhenzong, que hizo fabricar allí porcelana para el palacio. Las \
montañas vecinas proporcionan el caolín y la piedra de porcelana, los bosques la leña \
de los hornos, y el río permite expedir las piezas. Bajo los Yuan, los alfareros \
ponen a punto allí la decoración de azul de cobalto bajo cubierta. Desde los inicios de la dinastía \
Ming se establecen allí hornos imperiales: trabajan para la corte según \
encargos precisos, bajo el control de funcionarios. Bajo los Qing, la manufactura \
conoce una nueva edad de oro gracias a directores sabios como Tang Ying, en el cargo bajo \
Yongzheng y Qianlong, que multiplica los inventos técnicos. La ciudad, donde \
trabajaban miles de obreros especializados, exportaba también al mundo entero \
: fue por Jingdezhen como Europa descubrió la porcelana. El jesuita francés \
François-Xavier d'Entrecolles describió sus secretos en dos célebres cartas, en \
1712 y 1722. Jingdezhen sigue siendo hoy la capital china de la porcelana."""
style = """
Las porcelanas imperiales de Jingdezhen se distinguen por la perfección de su pasta, \
blanca y fina, y por el rigor de sus decoraciones, a menudo tomadas de modelos dibujados en \
la corte: dragones, fénix, flores y frutos portadores de deseos. El azul de cobalto de los \
Ming, y luego los esmaltes de la familia verde y de la familia rosa bajo los Qing, han fijado \
para el mundo entero la imagen de la porcelana china. Sus formas y sus motivos han \
sido copiados de Irán a Japón, y de Delft a Meissen."""

[[artistes]]
nom = "Japon, céramique raku"
vie = "Kioto (Japón), desde finales del siglo XVI"
biographie = """
La cerámica raku nace en Kioto en la época Momoyama, en el círculo del maestro del té Sen \
no Rikyū (1522–1591). Este, al servicio de los señores de la guerra Oda Nobunaga y luego de \
Toyotomi Hideyoshi, lleva la ceremonia del té hacia una sencillez extrema y busca \
cuencos que respondan a ese ideal. Se los encarga a Chōjirō, un artesano que fabricaba \
tejas y figuras de terracota. Chōjirō modela a mano, sin torno, cuencos \
negros o rojos, sobrios y graves, cocidos uno a uno. Tras su muerte, su taller se transmite \
de generación en generación en una familia que toma el nombre de Raku, según la \
tradición gracias a un sello regalado por Hideyoshi. En el siglo XVII, otros artistas \
se apropian de la técnica, como Hon'ami Kōetsu, calígrafo y letrado, cuyos cuencos \
cuentan entre los más admirados. Los maestros del té dan a los cuencos nombres poéticos \
y los conservan en cajas de madera inscritas, transmitidas con su historia. La \
familia Raku prosigue hoy su labor en Kioto."""
style = """
El raku se reconoce por su tierra ligera y porosa, por sus formas modeladas a mano, \
irregulares, y por sus vidriados espesos, negros o rojos. El cuenco está pensado para la \
mano y para los labios tanto como para el ojo. Esta estética del wabi, hecha de \
sencillez y de imperfección aceptada, ha nutrido toda la cerámica japonesa y luego, en el \
siglo XX, la de los alfareros occidentales, de Bernard Leach a los ceramistas estadounidenses \
que han inventado un «raku» a su manera."""

[[artistes]]
nom = "Pueblo de Zuni"
vie = "Valle del río Zuni, Nuevo México (Estados Unidos)"
biographie = """
Los zuñis, que se llaman a sí mismos A:shiwi, viven en el valle del río Zuni, \
en el oeste de Nuevo México, en tierras habitadas por sus antepasados desde hace \
siglos. Como los demás pueblos pueblo, hopis, acomas o lagunas, viven en \
aldeas de casas de varios pisos de piedra y adobe, y cultivan maíz en un país \
seco. En 1540, la expedición española de Francisco Vásquez de Coronado, en busca de las \
legendarias «siete ciudades de Cíbola», llega a sus aldeas. Vienen luego los \
misioneros, la rebelión de los pueblos de 1680 contra los españoles y, en 1848, \
la anexión por Estados Unidos. A pesar de estos trastornos, los zuñis han conservado su \
lengua, sus ceremonias y sus artes: la alfarería, la joyería de plata y de \
turquesa, los fetiches esculpidos. La cerámica, hecha por las mujeres para el agua, el \
grano y las ceremonias, transmite un repertorio de motivos antiguo. A finales del siglo XIX, \
sabios como Frank Hamilton Cushing, que vivió varios años entre ellos, \
y numerosos coleccionistas dieron a conocer esta alfarería mucho más allá del pueblo."""
style = """
La alfarería zuñi se reconoce por su engobe blanco crema, sobre el que la alfarera pinta en \
negro y en rojo pardo decoraciones que lo cubren todo: rosetas, formas escalonadas, rayas, \
volutas del «pájaro de la lluvia» y, a veces, ciervos cuya boca une una línea con el \
corazón. Las tinajas tienen una panza ancha y un cuello corto. Este estilo, aún vivo, es \
practicado hoy por alfareras y alfareros zuñis."""

[[artistes]]
nom = "Maestro Giorgio Andreoli"
vie = "Intra, en el lago Mayor, hacia 1465 – Gubbio, 1553"
biographie = """
Giorgio Andreoli nace hacia 1465 en Intra, a orillas del lago Mayor. Se instala con \
sus hermanos en Gubbio, pequeña ciudad de Umbría que depende de los duques de Urbino, y obtiene allí la \
ciudadanía a finales del siglo XV. Dirige allí un taller de cerámica cuya fama \
se debe a una especialidad: el lustre metálico, esa película irisada que da a las \
lozas reflejos de oro y de rubí. Su rojo rubí, en particular, es muy afamado. \
El taller alcanza su apogeo entre 1515 y 1540 aproximadamente: aplica lustre a sus propias piezas, \
pero también a platos pintados por otros talleres, en especial en Urbino, que se le \
envían para recibir esta decoración. Muchas piezas llevan en el reverso su firma \
abreviada, «M° G°», y una fecha, trazadas al lustre. Sus hijos, entre ellos Vincenzo, llamado Maestro \
Cencio, continúan su actividad. Las mayólicas de Gubbio, ya buscadas por los \
príncipes del Renacimiento, fueron apasionadamente coleccionadas en el siglo XIX y \
figuran hoy en los más grandes museos."""
style = """
Maestro Giorgio es ante todo un maestro del lustre más que un pintor de escenas: su arte \
consiste en hacer centellear la superficie de la mayólica. Sus platos asocian las cenefas \
de ornamentos del Renacimiento, roleos, grutescos, trofeos, y temas \
mitológicos o bíblicos a menudo tomados de grabados, realzados con reflejos dorados y \
rojos. Este lujo centelleante, heredado de las lozas hispanomoriscas, ha hecho de Gubbio, \
junto con Deruta, el gran centro de la mayólica con reflejo metálico italiana."""

[[artistes]]
nom = "Faïencerie De Metaale Pot"
vie = "Delft (Provincias Unidas), siglos XVII–XVIII"
biographie = """
La fábrica de loza De Metaale Pot, «el Pote de Metal», es una de las numerosas manufacturas \
que hacen famosa a Delft en los siglos XVII y XVIII. La ciudad, en el corazón de \
Holanda, entre La Haya y Róterdam, es entonces próspera: alberga una de las \
cámaras de la Compañía de las Indias Orientales, cuyos navíos traen de Asia \
cargamentos de porcelana china. Cuando la guerra que acompaña la caída de los Ming, \
a mediados del siglo XVII, desorganiza los hornos chinos, las llegadas escasean: \
los ceramistas de Delft aprovechan la ocasión e imitan el azul y blanco. Muchos \
se instalan en antiguas cervecerías, numerosas en una ciudad donde la cerveza declina. \
Cada fábrica tiene su rótulo y su marca: el Hacha de Porcelana, la Rosa, el \
Pavo Real, la Garra de Porcelana, el Pote de Metal. A finales del siglo XVII, bajo la \
dirección de Lambertus van Eenhoorn, De Metaale Pot produce piezas de gran lujo, \
entre ellas pirámides de flores, como su rival De Grieksche A de Adrianus Kocx, proveedor \
de la reina María II. En el siglo XVIII, la competencia de la porcelana europea y de \
la loza fina inglesa provoca el declive de Delft."""
style = """
La loza de Delft se reconoce por su esmalte de un blanco lechoso y su decoración azul de \
cobalto, a veces polícroma, de gran libertad de pincel. Sus pintores toman de \
China pagodas, personajes y flores, que mezclan con paisajes holandeses, con \
escenas bíblicas y con escudos de armas. Sus piezas de aparato, pirámides, jarrones para tulipanes, \
placas, se difunden por toda Europa, y el «azul de Delft» fue imitado de \
Londres a Fráncfort."""

[[artistes]]
nom = "Johann Joachim Kändler"
vie = "Fischbach (Sajonia), 15 de junio de 1706 – Meissen, 18 de mayo de 1775"
biographie = """
Hijo de pastor, Johann Joachim Kändler nace en 1706 en Fischbach, cerca de Dresde. \
Aprende escultura con Benjamin Thomae, escultor de la corte, y participa en la \
decoración de los palacios de Augusto el Fuerte, elector de Sajonia y rey de Polonia. Notado por el \
príncipe, ingresa en 1731 en la manufactura de porcelana de Meissen, fundada una veintena \
de años antes, y se convierte en ella ya en 1733 en maestro modelador. Augusto el Fuerte le \
encarga primero animales de gran tamaño, águilas, pavos reales, monos, para el Palacio \
Japonés de Dresde, un desafío técnico: estas piezas se agrietan a menudo en la cocción. \
Kändler comprende que la porcelana se presta mejor a la pequeña escala: crea \
figurillas, personajes de la comedia italiana, pastores, damas con miriñaque, músicos, \
pájaros, a menudo destinadas a adornar las mesas de los banquetes. Para el conde de Brühl, \
concibe el servicio de los cisnes, la obra más ambiciosa de su carrera. En más de \
cuarenta años, modela un número considerable de modelos, y sigue al servicio de la \
manufactura hasta su muerte, en Meissen, en 1775."""
style = """
Kändler piensa como un escultor barroco: sus figuras están en movimiento, captadas en un \
gesto, una torsión, una mirada intercambiada, y sus relieves, como los del servicio de los cisnes, \
transforman los objetos de uso en esculturas. Impuso la porcelana como un arte de \
pleno derecho en Europa, y sus figurillas, copiadas por todas las manufacturas, de \
Chelsea a Nymphenburg, fijaron durante mucho tiempo el género de la estatuilla de porcelana."""

[[artistes]]
nom = "Manufacture de Sèvres"
vie = "Vincennes, hacia 1740 – Sèvres, desde 1756"
biographie = """
La manufactura nace hacia 1740 en el castillo de Vincennes, donde obreros llegados de la \
manufactura de Chantilly intentan descubrir el secreto de la porcelana. Respaldada por \
financieros, y luego por Luis XV y Madame de Pompadour, se traslada en 1756 a Sèvres, \
cerca del castillo de Bellevue que pertenece a la marquesa. En 1759, el rey la compra: \
se convierte en manufactura real, y sus piezas sirven de regalos diplomáticos en \
toda Europa. Se rodea de artistas: el orfebre Jean-Claude Duplessis dibuja las \
formas, el escultor Étienne Maurice Falconet dirige el taller de escultura, François \
Boucher proporciona modelos. A partir de 1770, produce también porcelana dura, \
gracias al caolín descubierto cerca de Limoges. La Revolución, y luego Napoleón, mantienen la \
manufactura, que dirige desde 1800 el sabio Alexandre Brongniart. En los siglos XIX y XX, \
acoge nuevos artistas y nuevas técnicas, de los gres del \
Art Nouveau a las creaciones contemporáneas. Aún en activo, produce a \
mano, en sus edificios de 1876, piezas encargadas por el Estado y obras de \
artistas invitados."""
style = """
El estilo de Sèvres en el siglo XVIII se reconoce por sus fondos de color intenso, azul \
celeste, azul lapislázuli, verde, rosa, enmarcados por oro cincelado, y por sus cartuchos pintados como \
miniaturas: amorcillos, paisajes, pájaros, flores. Sus formas, a menudo dibujadas por \
Duplessis, siguen la flexibilidad del rococó antes de plegarse al gusto neoclásico. Imitada \
en toda Europa, la manufactura encarnó durante mucho tiempo el lujo a la francesa."""

[[artistes]]
nom = "Josiah Wedgwood"
vie = "Burslem (Staffordshire), 1730 – Etruria (Staffordshire), 3 de enero de 1795"
biographie = """
Josiah Wedgwood nace en 1730 en Burslem, en Staffordshire, en el seno de una familia de \
alfareros. Empieza a trabajar a los nueve años, tras la muerte de su padre, en el taller \
familiar. Afectado de viruela en la infancia, conserva de ella una pierna enferma, que será \
amputada en 1768. Al no poder ya tornear, se consagra a la experimentación: anota \
en sus cuadernos miles de pruebas de pastas y vidriados. Establecido por cuenta propia en \
1759, perfecciona una loza fina de color crema, adoptada por la reina Carlota, \
que le autoriza a llamarla «Queen's ware». En 1769, con su socio Thomas Bentley, \
abre cerca de Stoke una manufactura modelo bautizada Etruria, en homenaje a los \
etruscos, a quienes se atribuían entonces los vasos griegos. Crea allí el basalto negro y luego \
el jaspe. Pionero de la industria, divide el trabajo, abre salas de exposición en \
Londres, publica catálogos, apoya la construcción de canales. Miembro de la Royal \
Society, combate la trata de esclavos y difunde un célebre medallón con la \
inscripción «Am I not a man and a brother?». Su nieto es el naturalista \
Charles Darwin."""
style = """
Wedgwood supo aliar el arte y la industria: formas simples y elegantes, \
reproducibles en gran número, una calidad constante, y decoraciones confiadas a \
artistas como el escultor John Flaxman. Su jaspe azul pálido con relieves blancos, inspirado en \
los camafeos antiguos, se ha convertido en la imagen misma del neoclasicismo inglés. Sus métodos de \
fabricación y de venta han hecho de él uno de los padres de la industria moderna."""
