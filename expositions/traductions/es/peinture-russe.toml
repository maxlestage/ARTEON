El Demonio obsesionó a Vrúbel hasta la locura: en 1902, cuando su Demonio derribado ya estaba expuesto en San Petersburgo, acudía cada mañana a retocarlo ante el público, cambiando su rostro y sus colores, poco antes de que su enfermedad mental obligara a internarlo."""
