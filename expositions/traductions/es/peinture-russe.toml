[[artistes]]
nom = "Ilia Répine"
vie = "Chuguyev (Ucrania), 5 de agosto de 1844 – Kuokkala (Finlandia), 29 de septiembre de 1930"
biographie = """
Hijo de un colono militar de la región de Járkov, Ilia Repin aprende primero la pintura de iconos. En 1863 parte a San Petersburgo y al año siguiente ingresa en la Academia imperial de bellas artes. Los sirgadores del Volga le hacen famoso en 1873. Pensionado de la Academia, reside después en París de 1873 a 1876, y se une en 1878 a los Itinerantes, la sociedad de artistas que quiere mostrar la vida del pueblo ruso. Instalado un tiempo en Moscú, frecuenta el círculo de Savva Mámontov en Abramtsevo. Pinta escenas de historia, como Iván el Terrible y su hijo (1885), escenas de la vida contemporánea, como No lo esperaban, y numerosos retratos, entre ellos los de León Tolstói y Músorgski. Profesor en la Academia a partir de 1894, forma a numerosos alumnos, entre ellos Valentín Serov. En 1899 se instala en su casa de Penates, en Kuokkala, en el golfo de Finlandia. Tras la revolución, Finlandia se hace independiente: Repin se queda allí y no regresa a la Rusia soviética. Muere en Kuokkala en 1930."""
style = """
Repin es el mayor pintor realista ruso. Sobresale en dar vida a una multitud, en dar a cada rostro su carácter y en captar la emoción de un instante. Su pincelada, vigorosa y segura, su conocimiento del dibujo y su sentido dramático lo convierten en el maestro de los Itinerantes. Fue erigido en modelo por el arte soviético, pero su influencia sobrepasa ese marco: sigue siendo el pintor de referencia de la vida rusa en el siglo XIX."""

[[artistes]]
nom = "Vassili Sourikov"
vie = "Krasnoyarsk, 24 de enero de 1848 – Moscú, 19 de marzo de 1916"
biographie = """
Vasili Súrikov nace en Krasnoyarsk, en Siberia, en una familia de cosacos establecida allí desde el siglo XVII. Notado por su talento de dibujante, obtiene el apoyo de un rico comerciante de la ciudad, Piotr Kuznetsov, que le paga los estudios: ingresa en 1869 en la Academia imperial de bellas artes de San Petersburgo. Tras participar en la decoración de la catedral de Cristo Salvador de Moscú, se instala en esa ciudad, cuya arquitectura antigua le fascina. Se consagra entonces a la pintura de historia: La mañana de la ejecución de los streltsí (1881), Ménshikov en Beriozovo (1883), La boyarda Morózova (1887). La muerte de su esposa, en 1888, lo sume en una profunda crisis; se rehace en Siberia y pinta La toma de la ciudad de nieve. Siguen grandes composiciones dedicadas a la conquista de Siberia por Yermak, al paso de los Alpes por Suvórov y a Stenka Razin. Miembro de los Itinerantes, se ha convertido en el gran pintor de la historia rusa. Muere en Moscú en 1916."""
style = """
Súrikov inventa una pintura de historia en la que el pueblo tiene el papel principal: sus inmensos lienzos están poblados de multitudes cuyos rostros han sido estudiados del natural. Busca menos ilustrar un acontecimiento que hacer sentir su drama colectivo. Su sentido del color, rico y profundo, y su arte de la composición, que organiza el caos de una multitud, han hecho de él un modelo para los pintores de historia rusos."""

[[artistes]]
nom = "Ivan Aïvazovski"
vie = "Feodosia (Crimea), 29 de julio de 1817 – Feodosia, 2 de mayo de 1900"
biographie = """
Ivan Aivazovski nace en Feodosia, puerto de Crimea, en una modesta familia armenia. Sus dotes para el dibujo se notan muy pronto, y unos protectores le permiten ingresar en 1833 en la Academia imperial de bellas artes de San Petersburgo, en la clase de paisaje. Sale de ella con una medalla de oro que le vale una larga estancia en Italia, donde sus marinas obtienen un gran éxito. De regreso a Rusia, se convierte en 1844 en pintor del estado mayor de la marina. Se instala después definitivamente en Feodosia, donde construye una casa, un taller y una galería. Trabaja allí sin descanso, viajando a menudo por Europa, Oriente e incluso hasta América, en 1892. Dedica una parte de su fortuna a su ciudad natal, donde financia, entre otras cosas, la conducción de agua. Colmado de honores, expone por toda Europa y realiza millares de cuadros. Muere en Feodosia en 1900, dejando un lienzo inacabado en su caballete."""
style = """
Aivazovski es el gran pintor del mar. Pinta de memoria, en el taller, tempestades, naufragios, batallas navales y claros de luna. Su dominio de la transparencia del agua y de la luz, a menudo espectacular, hace de él un heredero del romanticismo. Muy popular, fijó durante mucho tiempo la imagen de la marina rusa."""

[[artistes]]
nom = "Arkhip Kouïndji"
vie = "Mariúpol, 1841 o 1842 – San Petersburgo, 24 de julio de 1910"
biographie = """
Arkhip Kuindzhi nace en Mariúpol, en el mar de Azov, en una pobre familia griega. Huérfano muy joven, guarda gansos y trabaja en casa de comerciantes. Se forma casi solo en la pintura; según sus biógrafos, habría ido a Feodosia a pedir consejo a Aivazovski, sin gran éxito. Tras varios fracasos, se hace oyente libre de la Academia imperial de bellas artes de San Petersburgo a finales de la década de 1860. Se une a los Itinerantes en 1875 y se separa de ellos en 1880, el año de Noche de luna en el Dniéper, que expone solo. Tras una última exposición en 1882, deja de mostrar sus obras durante una veintena de años, aunque sigue pintando. Profesor en la Academia a partir de 1894, es apartado de ella en 1897 por haber apoyado a los estudiantes contestatarios. Entre sus alumnos figuran Nicolás Roerich y Arkadi Rílov. Enriquecido, crea en 1909 una sociedad de artistas a la que lega su fortuna. Muere en San Petersburgo en 1910."""
style = """
Kuindzhi es el pintor de los efectos de luz: claros de luna, puestas de sol, rayos que atraviesan un bosque de abedules. Simplifica el paisaje en grandes masas para hacer brotar algunas zonas de color intenso. Sus investigaciones sobre los pigmentos y los colores complementarios anuncian las audacias del simbolismo y de una pintura decorativa."""

[[artistes]]
nom = "Ivan Chichkine"
vie = "Yelábuga, 25 de enero de 1832 – San Petersburgo, 20 de marzo de 1898"
biographie = """
Ivan Shishkin nace en Yelábuga, en el Kama, en una familia de comerciantes. Estudia en la escuela de pintura de Moscú y luego en la Academia imperial de bellas artes de San Petersburgo, de 1856 a 1860. Una beca le permite residir en Alemania y en Suiza, en particular en Düsseldorf, donde se perfecciona en el paisaje y el grabado. De regreso a Rusia, se consagra casi exclusivamente al bosque y a los campos de su país. Miembro fundador de los Itinerantes en 1870, expone regularmente con ellos. Se casa con la hermana del paisajista Fiódor Vasíliev, que muere unos años más tarde, y luego vuelve a casarse con una alumna, la pintora Olga Lagoda, a la que también pierde. Estos duelos lo marcan profundamente. Dirige el taller de paisaje de la Academia a partir de 1894. Muere en 1898 en San Petersburgo, en su taller, ante su caballete."""
style = """
Shishkin es el pintor del bosque ruso, que conoce como naturalista: dibuja cada árbol, cada helecho, cada piedra con una precisión fotográfica. Sus grandes paisajes compuestos, de luz clara, unen esta exactitud a una emoción ante la inmensidad de la naturaleza. Ha marcado profundamente la imagen que los rusos se hacen de su país."""

[[artistes]]
nom = "Isaac Levitan"
vie = "Kybartai (Lituania), 30 de agosto de 1860 – Moscú, 4 de agosto de 1900"
biographie = """
Isaac Levitán nace en una pobre familia judía de Lituania, entonces en el Imperio ruso. En 1873 ingresa en la escuela de pintura, escultura y arquitectura de Moscú, donde tiene por maestros a Alexéi Savrásov y Vasili Polénov. La muerte de sus padres lo deja sin recursos; vive en la miseria durante sus estudios. En 1879, Pavel Tretiakov compra uno de sus cuadros, Día de otoño en Sokólniki. Entabla amistad con Antón Chéjov y pasa varios veranos en el Volga, en Plyos. En 1892, la expulsión de los judíos de Moscú lo obliga a abandonar la ciudad por un tiempo. Sus grandes paisajes, como La Vladimirka, Sobre el reposo eterno, Marzo o Otoño dorado, lo hacen célebre. Es elegido académico en 1898 y enseña paisaje en la escuela de Moscú. Enfermo del corazón, muere a los treinta y nueve años, en 1900."""
style = """
Levitán es el pintor del «paisaje de ánimo»: busca en la naturaleza rusa, a menudo modesta, un campo, un camino, un río, la expresión de un sentimiento, de la melancolía a la alegría. Su pincelada libre, su arte de la luz y su sencillez han hecho de él el maestro del paisaje ruso a finales del siglo XIX."""

[[artistes]]
nom = "Viktor Vasnetsov"
vie = "Lopial (gobernación de Viatka), 15 de mayo de 1848 – Moscú, 23 de julio de 1926"
biographie = """
Hijo de un sacerdote de aldea, Viktor Vasnetsov estudia en el seminario de Viatka, renuncia luego al sacerdocio y parte en 1867 a San Petersburgo, donde ingresa en la Academia imperial de bellas artes. Pinta primero escenas de la vida popular y expone con los Itinerantes. En 1876 reside en París, con Repin y Polénov. Instalado en Moscú en 1878, frecuenta la finca de Abramtsevo, en casa de Savva Mámontov, donde diseña una pequeña iglesia y decorados de teatro. Se vuelve entonces hacia los cuentos y las leyendas de la antigua Rusia: Después del combate de Igor, Aliónushka, Iván Tsarévich sobre el lobo gris, Los bogatires. De 1885 a 1896 decora la catedral de San Vladimiro de Kiev. Diseña también edificios, entre ellos la fachada de la galería Tretiakov y su propia casa-taller de Moscú, hoy un museo. Muere en Moscú en 1926."""
style = """
Vasnetsov es el pintor de las leyendas rusas. Da a los héroes de las bylinas y de los cuentos una presencia monumental, con composiciones simples y simétricas venidas de los iconos. Su gusto por los ornamentos antiguos y el arte popular ha alimentado el estilo neorruso en arquitectura y decoración, así como la ilustración de los cuentos rusos."""

[[artistes]]
nom = "Mikhaïl Vroubel"
vie = "Omsk, 17 de marzo de 1856 – San Petersburgo, 14 de abril de 1910"
biographie = """
Hijo de un jurista militar, Mijaíl Vrúbel cursa estudios de derecho en San Petersburgo antes de ingresar, en 1880, en la Academia imperial de bellas artes, donde sigue la enseñanza de Pavel Chistiakov. En 1884 parte a Kiev para restaurar y completar los frescos medievales de la iglesia de San Cirilo, y reside en Venecia para estudiar el arte bizantino. Instalado en Moscú en 1889, entra en el círculo de Savva Mámontov, para quien crea cerámicas, decorados de ópera y grandes paneles. En 1896 se casa con la cantante Nadezhda Zabela, a la que pinta a menudo. Sus obras desconciertan a la crítica, pero el movimiento del Mundo del Arte acaba defendiéndolo. El nacimiento de su hijo Savva, en 1901, y luego su muerte en 1903, lo afectan duramente. A partir de 1902 sufre graves trastornos mentales y pasa sus últimos años en clínicas. Ciego desde 1906, muere en San Petersburgo en 1910."""
style = """
Vrúbel inventa una pintura hecha de facetas, como un mosaico o un cristal, en la que el color vibra en destellos. Nutrido de arte bizantino y de leyendas, crea un mundo de sueño habitado por demonios, princesas y criaturas fantásticas. Es el gran precursor del simbolismo ruso y de la edad de plata."""

[[artistes]]
nom = "Valentin Serov"
vie = "San Petersburgo, 19 de enero de 1865 – Moscú, 5 de diciembre de 1911"
biographie = """
Valentín Serov es hijo del compositor Alexandr Serov y de la compositora Valentina Bergman. Tras la muerte de su padre, en 1871, viaja mucho con su madre, a Múnich y a París, donde empieza a dibujar junto a Repin. Sigue luego a su maestro a Moscú, y después ingresa en 1880 en la Academia imperial de bellas artes, en el taller de Pavel Chistiakov. Amigo de la familia Mámontov, pasa parte de su juventud en Abramtsevo, donde pinta La muchacha de los melocotones en 1887. Se convierte en el retratista más solicitado de Rusia, pintando tanto a los industriales y los artistas como a la familia imperial. Enseña en la escuela de pintura de Moscú de 1897 a 1909 y participa en el movimiento del Mundo del Arte. En 1905, tras el Domingo Sangriento, abandona la Academia en señal de protesta. Diseña en 1909 el cartel de los Ballets Rusos con la bailarina Anna Pávlova. Muere en Moscú en 1911."""
style = """
Serov es el gran retratista ruso de su tiempo. Alía la solidez del dibujo aprendido con Repin a una pincelada libre y luminosa próxima al impresionismo. Sus retratos captan el carácter de sus modelos, a menudo con una ironía discreta. En sus últimos años, evoluciona hacia una manera más sintética y decorativa."""
