[[oeuvres]]
titre = "Los bogatires"
artiste = "Viktor Vasnetsov"
annee = "1881–1898"
image = "bogatyrs.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Viktor_Vasnetsov_-_Богатыри_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 295,3 × 446 cm"
collection = "Galería Tretiakov, Moscú"
note = "Tres héroes de las leyendas rusas montan guardia en las fronteras: Dobrynia Nikítich, Iliá Múrometz y Aliosha Popóvich."
description = """
En una estepa herbosa, bajo un cielo nuboso, tres jinetes con armadura se mantienen uno junto a otro, de cara a nosotros. En el centro, sobre un enorme caballo negro, el de más edad, Iliá Múrometz, de barba gris, se lleva la mano a la frente a modo de visera para escrutar el horizonte; una maza de armas cuelga de su muñeca, y sostiene una lanza. A la izquierda, sobre un caballo blanco de crin flotante, Dobrynia Nikítich, de larga barba, desenvaina ya su espada y porta un escudo rojo. A la derecha, sobre un caballo alazán que baja la cabeza, el joven Aliosha Popóvich, imberbe, sostiene su arco y sus flechas. Los tres guerreros llevan cotas de malla y cascos puntiagudos. En primer plano, jóvenes abetos brotan de la hierba."""
evocation = """
Los bogatires son los héroes de las bylinas, los cantos épicos de la antigua Rusia: defienden la tierra rusa contra los nómadas de la estepa. Vasnetsov los muestra como centinelas, acechando al enemigo en los confines del país. Las tres figuras encarnan cualidades complementarias: la fuerza tranquila y la sabiduría de Iliá, la nobleza y el valor de Dobrynia, la destreza y la astucia de Aliosha. En la época en que el Imperio ruso busca sus raíces nacionales, el cuadro se convierte en una imagen de la propia Rusia, sólida y vigilante, enraizada en su paisaje. Ha sido reproducido hasta el infinito, incluso en los libros escolares, y sigue siendo una de las imágenes más familiares de la cultura rusa."""
histoire = """
Vasnetsov dibuja un primer boceto del cuadro en París, en 1876, cuando reside allí con Repin y Vasili Polénov. No termina el gran lienzo hasta 1898, tras casi veinte años de trabajo, llevado en lo esencial en Moscú, donde frecuenta el círculo del mecenas Savva Mámontov. Durante todos esos años, estudia las armas y los trajes antiguos y busca modelos. Pavel Tretiakov adquiere la obra en 1898, el año de su muerte; fue una de sus últimas adquisiciones. Desde entonces ha seguido siendo una de las obras más célebres de la galería."""
facture = """
Vasnetsov da a sus tres jinetes una presencia monumental: el punto de vista bajo, a ras de la hierba, los hace alzarse contra el cielo. La composición es simétrica y estable, como un icono o un retablo, con Iliá en el centro. Las armas y los arneses están pintados con gran precisión, basada en el estudio de piezas antiguas. La paleta, en la que dominan los verdes, los grises y los pardos, se anima con el rojo del escudo y el brillo del caballo blanco."""
details = [
  "La mano de Iliá Múrometz a modo de visera sobre sus ojos.",
  "La maza de armas que cuelga de la muñeca de Iliá.",
  "La espada que Dobrynia saca a medias de su vaina.",
  "El caballo alazán de Aliosha que baja la cabeza hacia la hierba.",
  "Los jóvenes abetos del primer plano, a los pies de los caballos.",
]
themes = ["leyenda", "héroes", "caballos", "rusia", "epopeya"]
anecdote = """
Vasnetsov prestó a sus héroes rostros de su entorno: se dice que Aliosha Popóvich tiene los rasgos de Andréi Mámontov, el hijo del mecenas de Abramtsevo, y que Dobrynia se parece al propio pintor."""
