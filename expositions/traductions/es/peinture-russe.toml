[exposition]
ordre = 125
nom_court = "Pintura rusa"
mouvement = "Pintura rusa, de los Itinerantes a la edad de plata"
cadre = "dore"
couleur = "#8b2c25"
titre = "La pintura rusa, de los Itinerantes a la edad de plata"
artiste = "Repin, Aivazovski, Súrikov, Levitán, Vrúbel, Serov…"
dates = "1850–1898"
accroche = "Exposición virtual · Galería Tretiakov, Moscú"
introduction = """
En el siglo XIX, la pintura rusa se emancipa de la Academia imperial: en 1870, los Itinerantes fundan una sociedad de exposiciones ambulantes y pintan la vida del pueblo, la historia nacional y la naturaleza rusa, mientras que a finales de siglo el círculo de Abramtsevo abre el camino al sueño y a las leyendas. La visita reúne a nueve pintores, de Aivazovski a Vrúbel, en diez lienzos procedentes de la galería Tretiakov de Moscú y del Museo Ruso de San Petersburgo. El edificio se inspira en la galería Tretiakov: se entra por un vestíbulo que evoca la fachada diseñada por Viktor Vasnetsov y luego se recorre una sucesión de salas altas, desde la gran sala de los Itinerantes hasta la de las leyendas."""
vitrine = "bogatyrs.jpg"

[musee]
nom = "Galería Tretiakov"
ville = "Moscú, Rusia"
architecte = "Viktor Vasnetsov (fachada)"
construction = "1902–1904 (fachada)"
presentation = """
En 1856, Pavel Tretiakov, un rico comerciante de textiles moscovita, compra sus primeros cuadros de pintores rusos contemporáneos, con la idea de fundar una galería nacional. Durante cuarenta años apoya a los Itinerantes, encarga retratos de escritores y amplía sin cesar su casa del barrio de Zamoskvoreche, al sur del Kremlin, con salas iluminadas por claraboyas. En 1892 ofrece a la ciudad de Moscú su colección y la de su hermano Serguéi; la galería municipal abre al público al año siguiente. A principios del siglo XX, el pintor Viktor Vasnetsov diseña la fachada que la hace famosa: un frontón en forma de kokóshnik, el tocado de las mujeres rusas, un bajorrelieve de san Jorge, emblema de Moscú, y un friso de ornamentos coloreados en el estilo de las antiguas iglesias rusas. Hoy la galería conserva el arte ruso desde los iconos hasta principios del siglo XX; el arte más reciente se expone en un segundo edificio, en el Krymski Val."""
ici = """
El edificio de ARTEON retoma la idea de la Tretiakov: una casa de coleccionista convertida en una sucesión de salas altas. Se entra por el sur en el vestíbulo de Vasnetsov, de muros crema, y luego en la sala de los Itinerantes, la más vasta, de nueve metros de altura, de muros ocre claro. Al oeste se abre la sala «El mar y la noche», de muros beige; al este, la sala «El bosque y la llanura», de un verde pálido. Al norte de esta, se termina en la sala «El círculo de Abramtsevo», de muros rosa empolvado."""

