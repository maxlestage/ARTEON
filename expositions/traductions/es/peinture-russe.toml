[[oeuvres]]
titre = "Los sirgadores del Volga"
artiste = "Ilia Répine"
annee = "1870–1873"
image = "haleurs-volga.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Ilya_Repin_-_Barge_Haulers_on_the_Volga_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 131,5 × 281 cm"
collection = "Museo Ruso, San Petersburgo"
note = "Once hombres uncidos con correas de cuero tiran de una barcaza a lo largo del Volga: el lienzo que hizo famoso a Repin a los veintinueve años."
description = """
En una ribera de arena amarilla, a orillas de un río inmenso y calmo, once hombres avanzan hacia nosotros, encorvados, atados con correas de cuero a un largo cable que los une a un velero. Forman una sola fila, una especie de friso humano que se extiende de izquierda a derecha. A la cabeza, un hombre barbudo con la frente ceñida por un trapo mira al frente con gravedad. Detrás de él, un sirgador alto fuma en pipa; otros, a su lado, bajan la cabeza hacia la arena. En medio de la fila, un muchacho con camisa rosa, más erguido que los demás, tira de su correa como si quisiera desprenderse de ella. El último, con la cabeza gacha, parece al límite de sus fuerzas. A lo lejos, bajo un cielo claro, un barco de vapor deja un fino penacho de humo."""
evocation = """
El cuadro muestra el trabajo más duro de la Rusia del siglo XIX, el de los burlaki, esos jornaleros que remolcaban a fuerza de brazos las barcazas que remontaban la corriente. Repin no pinta un discurso: hace el retrato de once individuos, de la resignación a la rebeldía, y cada uno tiene su carácter. El contraste entre la luz resplandeciente del verano y el abatimiento de los hombres hace su suerte más impresionante. Se ha visto en el joven de rosa, que se yergue, la imagen de una generación que rechaza su condición, y en el pequeño vapor del horizonte el anuncio del fin de un oficio que las máquinas iban a reemplazar. La obra se convierte enseguida, en Rusia como en el extranjero, en el emblema de una pintura que mira al pueblo de frente."""
histoire = """
En 1868, siendo aún alumno de la Academia imperial de bellas artes, Repin divisa en el Neva, cerca de San Petersburgo, un equipo de sirgadores, cuya miseria le impresiona en medio de paseantes con trajes de verano. En el verano de 1870 desciende el Volga con el paisajista Fiódor Vasíliev y se aloja en la aldea de Shiriáievo, cerca de Samara, donde dibuja a los sirgadores, sus rostros y sus harapos. El gran duque Vladímir Alexándrovich, hermano del futuro Alejandro III, le encarga el lienzo, terminado en 1873. Se muestra ese mismo año en la Exposición Universal de Viena y luego en la de París en 1878. Tras la revolución, ingresa en el Museo Ruso de San Petersburgo."""
facture = """
Repin compone su cuadro como un bajorrelieve: la fila de sirgadores ocupa una franja horizontal, y la mirada la recorre de rostro en rostro. La arena ocre, el cielo azul pálido y el agua plateada forman un fondo luminoso sobre el que se destacan los ropajes pardos, grises y rojos. La pincelada, precisa en los rostros y las manos, se vuelve más amplia en el paisaje. Los numerosos estudios hechos en el Volga dan a cada figura su verdad de tipo y de actitud."""
details = [
  "El jefe de fila, de rostro de sabio, cuya mirada fija al espectador.",
  "El muchacho de camisa rosa, que intenta aflojar su correa.",
  "La pipa del sirgador que camina justo detrás del primero.",
  "El pequeño barco de vapor y su humo, en el horizonte, a la derecha.",
  "El cesto de mimbre abandonado sobre la arena, en primer plano.",
]
themes = ["trabajo", "pueblo", "volga", "realismo", "río"]
anecdote = """
El jefe de fila tiene un modelo conocido: Kanin, un sirgador que Repin encontró en el Volga y que, según el pintor, era un antiguo sacerdote expulsado de su orden. En sus recuerdos, Repin cuenta cuánto le impresionó este rostro, de profunda sabiduría, desde su primer encuentro."""
salle = 2
mur = "sud"
place = 2
largeur = 2.8

[[oeuvres]]
titre = "Los cosacos zaporogos escribiendo una carta al sultán de Turquía"
artiste = "Ilia Répine"
annee = "1880–1891"
image = "cosaques-zaporogues.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Repin_Cossacks.jpg"
technique = "Óleo sobre lienzo, 203 × 358 cm"
collection = "Museo Ruso, San Petersburgo"
note = "Reunidos en torno a una mesa, los cosacos dictan entre risas una respuesta llena de insultos al sultán que les exigía someterse."
description = """
Una veintena de cosacos se apiñan en torno a una mesa rústica colocada al aire libre, en un campamento erizado de lanzas. En el centro, un joven escribano de negro, pluma en mano, escribe lo que los demás le dictan. Todo el mundo ríe, y cada uno a su manera: un gigante de caftán rojo y gorro blanco se agarra el vientre, un anciano calvo de cráneo rapado se inclina, hilarante, otro, con el torso desnudo y visto de espaldas, se apoya en la mesa. El jefe, tocado con un gorro de piel, fuma su pipa con una sonrisa burlona mientras dicta la frase siguiente. En primer plano, de espaldas, un cosaco de cráneo desnudo y otro de abrigo blanco, a la derecha, cierran la escena. Por todas partes hay armas: sables, fusiles, una bandura."""
evocation = """
Según una tradición, los cosacos de la Sich zaporoga, comunidad de guerreros libres establecida en el Dniéper, habrían respondido en 1676 a un ultimátum del sultán otomano Mehmed IV con una carta plagada de injurias. El texto, conocido por copias tardías, es sin duda apócrifo, pero Repin ve en él la imagen de una libertad alegre e insolente. El cuadro es un estudio de la risa: muestra todos sus matices, de la risita a la carcajada. Celebra también la fraternidad de una comunidad que no reconoce más amo que ella misma. Con frecuencia se ha leído la obra como un himno al espíritu de independencia de los cosacos, que hoy se disputan las memorias rusa y ucraniana."""
histoire = """
Repin oye leer el texto de la carta a finales de la década de 1870, en el círculo del mecenas Savva Mámontov. En 1880 hace un primer boceto y parte en verano a Ucrania con su joven alumno Valentín Serov para dibujar tipos, trajes y armas. El historiador Dmytro Yavornytsky, especialista en los cosacos, le aconseja y posa para el escribano; el general Mijaíl Dragomírov presta sus rasgos al jefe, el atamán Iván Sirko. Tras más de diez años de trabajo, el lienzo se termina en 1891. El zar Alejandro III lo compra por 35 000 rublos, la mayor suma pagada hasta entonces por un cuadro ruso. Una segunda versión, iniciada en 1889, se encuentra en el museo de arte de Járkov."""
facture = """
La composición está construida en pirámide en torno a la mesa, con el escribano en el centro y una corona de rostros a su alrededor. Repin cuida cada cabeza como un retrato. La luz blanca de un día velado unifica la escena, y las manchas de color vivo, el rojo de un caftán, el azul de una chaqueta, el blanco de un abrigo, dan ritmo a la multitud. Los objetos, armas, pipas, gorros, están pintados a partir de piezas auténticas estudiadas en los museos y en casa de coleccionistas."""
details = [
  "El escribano en el centro, pluma en mano, que sonríe mientras escribe.",
  "El jefe que fuma su pipa, con la barbilla alzada, mientras dicta.",
  "El gigante de caftán rojo y gorro blanco que se agarra el vientre.",
  "El cráneo rapado, adornado con un largo mechón, del cosaco con el torso desnudo.",
  "Las lanzas y los estandartes que se alzan en el cielo blanco.",
]
themes = ["risa", "cosacos", "historia", "libertad", "ucrania"]
anecdote = """
La carta de los cosacos ha inspirado la poesía francesa: Guillaume Apollinaire da su propia versión, insultos incluidos, en La canción del mal amado, publicada en el libro Alcools en 1913, con el título Respuesta de los cosacos zaporogos al sultán de Constantinopla."""
salle = 2
mur = "sud"
place = 4
largeur = 3.5

[[oeuvres]]
titre = "La boyarda Morózova"
artiste = "Vassili Sourikov"
annee = "1887"
image = "boyarine-morozova.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Surikov_Boyarynya_Morozova_gtg.jpg"
technique = "Óleo sobre lienzo, 304 × 587,5 cm"
collection = "Galería Tretiakov, Moscú"
note = "Encadenada en un trineo, una noble dama fiel a la antigua fe es conducida a través de Moscú y alza dos dedos en señal de desafío."
description = """
En una calle nevada de Moscú, un trineo atraviesa la multitud de izquierda a derecha. Una mujer vestida de negro va sentada en él, encadenada, de rostro pálido y demacrado; levanta la mano derecha, con dos dedos tendidos hacia el cielo. A su alrededor, la multitud reacciona: a la izquierda, un sacerdote se burla, un muchacho corre junto al trineo riendo; a la derecha, mujeres con ricos abrigos y chales bordados bajan los ojos, lloran o se inclinan. Una vieja mendiga arrodillada le tiende la mano. En primer plano a la derecha, un loco de Dios casi desnudo, sentado descalzo en la nieve, con una cadena al cuello, responde con el mismo gesto de los dos dedos. Al fondo se ven tejados nevados, cúpulas y un icono en una fachada."""
evocation = """
El cuadro evoca el cisma que desgarra a la Iglesia rusa en el siglo XVII. El patriarca Nikon reforma los ritos e impone, entre otras cosas, santiguarse con tres dedos en lugar de dos. Quienes se niegan, los viejos creyentes, son perseguidos. La boyarda Teodosia Morózova, una de las grandes damas de la corte, permanece fiel a la antigua fe: detenida en 1671, morirá de hambre en 1675 en un foso de la prisión de Borovsk. Súrikov no elige el suplicio, sino el momento en que pasa ante el pueblo, y hace de la multitud el verdadero tema: burla, miedo, piedad, admiración. El gesto de los dos dedos, repetido por el loco de Dios, se convierte en un signo de resistencia."""
histoire = """
Súrikov oyó en su infancia, en Krasnoyarsk, el relato de la vida de Morózova contado por una tía. Hace un primer boceto en 1881 y trabaja después varios años, buscando en las calles de Moscú los rostros de la multitud. Para la boyarda, tarda mucho en encontrar el rostro justo; se inspira, según se dice, en una vieja creyente llegada de los Urales y en una pariente. Pinta la nieve del natural, estudiando las huellas de los patines del trineo. Presentado en 1887 en la decimoquinta exposición de los Itinerantes, el lienzo causa sensación; Pavel Tretiakov lo compra para su galería, donde ocupa desde entonces toda una pared."""
facture = """
El lienzo es muy ancho, y el trineo, que lo atraviesa en diagonal, arrastra la mirada de izquierda a derecha como el movimiento del cortejo. Súrikov coloca la mancha negra de la boyarda en el centro de una multitud de colores suntuosos: brocados, chales de flores, pieles, rojos y azules profundos. La nieve nunca es blanca: refleja azules, rosas, violetas, observados al aire libre. El pintor alterna las figuras de perfil, de frente y de espaldas para dar la impresión de una multitud real."""
details = [
  "La mano levantada de la boyarda, con dos dedos tendidos.",
  "El loco de Dios sentado en la nieve, descalzo, que repite su gesto.",
  "El sacerdote que se burla, a la izquierda, con su abrigo de piel.",
  "El muchacho que corre junto al trineo, en la nieve derretida.",
  "El icono bajo su pequeño alero, en la fachada, arriba a la derecha.",
]
themes = ["fe", "historia", "multitud", "nieve", "resistencia"]
anecdote = """
Súrikov contaba que la idea de la figura le vino de una corneja: un día había visto al ave posada en la nieve, con un ala extendida, formando una mancha negra que no pudo olvidar durante años, antes de reencontrarla en la boyarda de negro sobre la nieve."""
salle = 2
mur = "nord"
place = 3
largeur = 4.5

[[oeuvres]]
titre = "La novena ola"
artiste = "Ivan Aïvazovski"
annee = "1850"
image = "neuvieme-vague.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hovhannes_Aivazovsky_-_The_Ninth_Wave_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 221 × 332 cm"
collection = "Museo Ruso, San Petersburgo"
note = "Al amanecer, unos náufragos agarrados a un mástil afrontan la más fuerte de las olas: la marina más célebre de la pintura rusa."
description = """
La tempestad de la noche acaba de terminar, pero el mar sigue aún desatado. En primer plano, unos náufragos se aferran a un resto de mástil, único vestigio de su navío. Uno de ellos agita una tela roja hacia el cielo. Ante ellos, a la izquierda, una ola inmensa se alza y empieza a romper, con la cresta cubierta de espuma. Otras olas, más lejos, ruedan hacia el horizonte. En el centro del cielo, el sol naciente atraviesa las nubes e inunda la escena de una luz dorada, amarilla, naranja y rosa. Su luz atraviesa las olas, que se vuelven verdes y transparentes, y hace centellear la superficie del agua. No se ve ninguna costa, ningún otro barco: solo el mar y el cielo."""
evocation = """
Los marinos creían que, en una tempestad, la novena ola era la más fuerte, la más temible: es ella la que amenaza aquí a los náufragos. El cuadro opone el furor del mar y la promesa de la luz: el sol que se levanta puede leerse como un signo de esperanza, y los hombres, minúsculos, no renuncian. Se ha visto en él una meditación romántica sobre la debilidad y el valor del hombre ante la naturaleza. El tema, la lucha de los hombres contra los elementos, vuelve a lo largo de toda la obra de Aivazovski, que había conocido él mismo tempestades en el mar y convirtió el combate con el océano en el gran tema de su vida."""
histoire = """
Aivazovski pinta La novena ola en 1850, cuando ya es el pintor oficial del estado mayor de la marina imperial y un artista muy solicitado, cuyas grandes marinas atraen a las multitudes a las exposiciones de San Petersburgo. El cuadro obtiene enseguida un inmenso éxito y el emperador Nicolás I lo adquiere para las colecciones imperiales. Se conserva primero en el museo del Hermitage y pasa en 1897 al Museo Ruso, recién creado en San Petersburgo para reunir el arte nacional. Ha seguido siendo una de sus obras más populares, reproducida en innumerables libros e imágenes."""
facture = """
Aivazovski pinta en el taller, de memoria, y trabaja deprisa. Aplica finas capas transparentes, que dan al agua su profundidad, y luego realza la espuma y los reflejos con pequeños toques claros. La luz viene del fondo del cuadro, lo que vuelve translúcidas las olas e ilumina a contraluz a los personajes. La paleta, muy cálida para una tempestad, pasa del violeta al verde esmeralda y al oro. La composición, con el sol en el centro y la gran ola a la izquierda, recuerda los naufragios de los pintores románticos."""
details = [
  "La tela roja que un náufrago agita para pedir ayuda.",
  "La transparencia verde de las olas atravesadas por el sol.",
  "La espuma que vuela desde la cresta de la gran ola, a la izquierda.",
  "Los cabos que aún flotan alrededor del mástil roto.",
]
themes = ["mar", "tempestad", "naufragio", "luz", "esperanza"]
anecdote = """
Aivazovski nunca pintaba el mar del natural: observaba largamente y luego pintaba en el taller, de memoria, convencido de que el movimiento de las olas y de las nubes no se deja copiar. Habría realizado así unos seis mil cuadros a lo largo de su vida."""
salle = 3
mur = "ouest"
place = 2
largeur = 3.3

[[oeuvres]]
titre = "Noche de luna en el Dniéper"
artiste = "Arkhip Kouïndji"
annee = "1880"
image = "nuit-lune-dniepr.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Kuindzhi_Moonlit_night_on_the_Dnieper_1880_grm_x2.jpg"
technique = "Óleo sobre lienzo, 105 × 144 cm"
collection = "Museo Ruso, San Petersburgo"
note = "La luna llena se refleja en el río: en 1880, el público hizo cola para ver este único cuadro expuesto en una sala oscura."
description = """
La noche cubre casi todo el cuadro. Arriba, entre nubes oscuras, la luna llena brilla con una luz verde pálida e ilumina el borde de las nubes. Abajo, el Dniéper, ancho y calmo, atraviesa el lienzo; la luna traza en él un largo reflejo luminoso de un verde fosforescente. En la orilla, en primer plano, apenas se distinguen unas chozas de aldea y la silueta de un pequeño molino. Todo lo demás, la tierra, el cielo, el horizonte, se funde en la sombra. No aparece ningún personaje: nada se mueve, solo la luz vive. Hoy, el lienzo está mucho más oscuro que en origen, y hay que acercarse para discernir los detalles de la orilla."""
evocation = """
Kuindzhi hace de la luz el único tema de su cuadro. El claro de luna, tan intenso que parece emanar del lienzo, da al paisaje ucraniano una dimensión casi mágica, entre la realidad y el sueño. Los contemporáneos vieron en él un tour de force, algunos una especie de prodigio; otros, sobre todo pintores, se preguntaron si el efecto no era más bien de ilusión que de pintura. Se ha visto también una meditación sobre el silencio y la inmensidad de la noche, y un anuncio de las investigaciones simbolistas de finales de siglo, en las que el paisaje se convierte en estado de ánimo. El Dniéper, río de la Ucrania natal del pintor, adquiere aquí una grandeza solemne."""
histoire = """
Kuindzhi termina el lienzo en 1880, poco después de dejar a los Itinerantes, y decide exponerlo solo, en San Petersburgo, en una sala de la Sociedad de Fomento de los Artistas, en la calle Bolshaya Morskaya. Las ventanas están tapadas, y un haz de luz eléctrica ilumina el cuadro en la oscuridad. Durante semanas, una multitud hace cola en la calle. Incluso antes de la exposición, el gran duque Constantino Konstantínovich compra el lienzo; lo lleva después en sus viajes por mar, y el aire salino habría contribuido a deteriorarlo. Más tarde ingresa en el Museo Ruso."""
facture = """
Kuindzhi obtiene su efecto por contraste: grandes masas oscuras, casi uniformes, y algunas zonas de colores muy claros y saturados, aplicados en capas gruesas. Estudiaba las propiedades de los pigmentos y el efecto de los colores complementarios, que yuxtaponía para hacer vibrar el verde de la luna. Pero empleaba también betún, un pigmento pardo que se oscurece y se resquebraja con el tiempo: es él quien explica el oscurecimiento actual del cuadro."""
details = [
  "La luna, pequeño disco verde pálido, al borde de un claro entre las nubes.",
  "El reflejo de la luna, en estela verde, sobre el río.",
  "La silueta del pequeño molino en la orilla, ante el reflejo.",
  "Los tejados de las casas, apenas visibles en la sombra, a la derecha.",
]
themes = ["noche", "luna", "río", "luz", "ucrania"]
anecdote = """
En 1880, la luz del cuadro era tan intensa que unos visitantes, convencidos de que había una lámpara escondida detrás, iban a mirar por la parte de atrás del lienzo. Kuindzhi, sin embargo, solo había utilizado pintura, y una iluminación dirigida sobre el cuadro en la sala oscura."""
salle = 3
mur = "nord"
