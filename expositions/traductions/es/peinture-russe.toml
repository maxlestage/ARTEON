[[oeuvres]]
titre = "El Demonio sentado"
artiste = "Mikhaïl Vroubel"
annee = "1890"
image = "demon-assis.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Mikhail_Vrubel_-_Демон_(сидящий)_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 114 × 211 cm"
collection = "Galería Tretiakov, Moscú"
note = "Inspirado en el poema de Lérmontov, un joven gigante pensativo está sentado en un jardín de flores de piedra, al ponerse el sol."
description = """
Un joven poderoso, de abundantes cabellos negros, está sentado, con los brazos rodeando las rodillas recogidas y las manos juntas. Su torso desnudo es musculoso, pero su rostro, vuelto de lado, es triste y ausente. Una tela azul drapea sus piernas. Es tan grande que lo alto de su cabeza sobrepasa el marco. A su alrededor, un extraño jardín de flores de pétalos angulosos, como cristales o piedras talladas, rosas, violetas, grises y azules, cubre la derecha del cuadro. A la izquierda, el cielo del atardecer es púrpura, y nubes enrojecidas por la puesta de sol se extienden sobre una línea de oro, en el horizonte. Todo el espacio parece apretado contra la figura."""
evocation = """
El cuadro se inspira en El Demonio, el poema de Mijaíl Lérmontov: un espíritu caído, harto de un mundo que desprecia, se enamora de una princesa georgiana. Vrúbel escribe a su hermana que su Demonio es un espíritu menos malvado que sufriente y triste, pero poderoso y majestuoso. Lo muestra joven, hermoso, perdido en su soledad, a la vez dios y prisionero. Con frecuencia se ha acercado esta figura al propio Vrúbel, artista incomprendido y atormentado. El Demonio se convierte en el gran tema de su vida: vuelve a él en numerosas obras hasta El Demonio derribado de 1902. Esta figura anuncia el simbolismo ruso y la edad de plata, en la que el arte explora los sueños y la inquietud interior."""
histoire = """
En 1890, Vrúbel, instalado en Moscú desde hace poco y acogido en el círculo del mecenas Savva Mámontov, recibe el encargo de ilustraciones para una edición de las obras de Lérmontov, publicada en 1891 para el cincuentenario de la muerte del poeta. Sus dibujos para El Demonio desconciertan a los críticos, que los juzgan torpes. El Demonio sentado, pintado el mismo año, es el primer gran lienzo que consagra al tema. Largo tiempo incomprendido, Vrúbel no es reconocido hasta el final de su vida; el cuadro es hoy una de las obras emblemáticas de la galería Tretiakov, que posee un vasto conjunto de su obra."""
facture = """
Vrúbel pinta por facetas, con espátula tanto como con pincel, con pinceladas planas y angulosas que recuerdan el mosaico o las vidrieras. Había estudiado en Kiev y en Venecia los mosaicos bizantinos, y esta influencia se ve en las flores cristalinas y en el cielo. El encuadre, muy cerrado, corta la cabeza de la figura y da una impresión de encierro. Los colores, azules profundos, violetas, rosas, oro, crean una atmósfera irreal de crepúsculo."""
details = [
  "La parte superior de la cabeza del Demonio, cortada por el borde del cuadro.",
  "Las manos juntas, de dedos entrelazados, bajo las rodillas.",
  "Las flores angulosas, como talladas en piedra, a la derecha.",
  "La línea de oro de la puesta de sol, a la izquierda.",
]
themes = ["demonio", "soledad", "poesía", "simbolismo", "crepúsculo"]
