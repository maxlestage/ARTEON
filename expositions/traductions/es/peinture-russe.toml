[[oeuvres]]
titre = "La muchacha de los melocotones"
artiste = "Valentin Serov"
annee = "1887"
image = "jeune-fille-peches.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Valentin_Serov_-_Девочка_с_персиками._Портрет_В.С.Мамонтовой_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 91 × 85 cm"
collection = "Galería Tretiakov, Moscú"
note = "Vera Mámontova, de doce años, hija del mecenas Savva Mámontov, sentada a la mesa del comedor de Abramtsevo."
description = """
En un comedor luminoso, una muchacha de cabello castaño, con blusa rosa anudada con un lazo negro adornado con una flor roja, está sentada a una mesa cubierta con un mantel blanco. Sostiene un melocotón entre las manos y mira al espectador con aire serio, algo enfurruñado. Sobre la mesa, ante ella, hay otros tres melocotones, hojas de arce amarillentas y un cuchillo. Detrás de ella, contra la pared blanca, se alinean sillas de madera oscura; un plato de loza azul cuelga de la pared, y una pequeña figurilla de colores está colocada sobre un mueble. A la derecha, por una gran ventana, se divisan los follajes amarillos del final del verano."""
evocation = """
El cuadro capta un instante ordinario y hace de él una imagen de la felicidad: la juventud, la luz, la frescura de una casa de campo. Serov, que vuelve entonces de Italia, escribe a su prometida que ya solo quiere pintar lo que es alegre. Dirá más tarde que había buscado ante todo la frescura, la que se experimenta en la naturaleza y que no se ve en los cuadros. La mirada directa de Vera, a la vez infantil y grave, da vida al retrato. La obra se considera a menudo un manifiesto de una pintura nueva, más libre y luminosa, que abre el camino al impresionismo ruso."""
histoire = """
Serov tiene veintidós años cuando pinta, a finales del verano de 1887, el retrato de Vera Mámontova en la finca de Abramtsevo, cerca de Moscú, donde ha pasado parte de su infancia. La propiedad pertenece a Savva Mámontov, industrial de los ferrocarriles y gran mecenas, que acoge allí a Repin, Vasnetsov, Polénov y luego Vrúbel. Vera posa largas sesiones en el comedor. Mostrado poco después en Moscú, el cuadro da a conocer al joven pintor. Hoy es uno de los retratos más conocidos de la galería Tretiakov."""
facture = """
Serov pinta a plena luz, con una pincelada libre y visible que recuerda a los impresionistas franceses, pero conserva la solidez del dibujo aprendido con Repin y Pavel Chistiakov. La luz, venida de la ventana, resbala sobre el mantel, la blusa y el rostro, y se colorea de reflejos. El rosa de la blusa, el blanco del mantel y el verde amarillento de los follajes forman una armonía clara. El encuadre, ligeramente descentrado, da una impresión de naturalidad."""
details = [
  "El melocotón que Vera sostiene entre las manos, apoyado sobre el mantel.",
  "La flor roja prendida en el lazo negro de lunares de la blusa.",
  "El plato de loza azul colgado de la pared, arriba a la izquierda.",
  "La firma «Серов 87», abajo a la derecha.",
  "Los follajes amarillos que se divisan por la ventana.",
]
themes = ["retrato", "infancia", "luz", "abramtsevo", "frutas"]
anecdote = """
Vera Mámontova se casó en 1903 con Alexandr Samarin y murió de una neumonía en 1907, a los treinta y dos años. Serov, que la había conocido de niña en Abramtsevo, la había pintado como la imagen misma de la juventud."""
