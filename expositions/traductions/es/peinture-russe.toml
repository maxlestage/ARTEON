[[oeuvres]]
titre = "Mañana en un bosque de pinos"
artiste = "Ivan Chichkine"
annee = "1889"
image = "matin-foret-pins.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Shishkin,_Ivan_-_Morning_in_a_Pine_Forest.jpg"
technique = "Óleo sobre lienzo, 139 × 213 cm"
collection = "Galería Tretiakov, Moscú"
note = "Una osa y sus oseznos juegan sobre un pino abatido en la bruma de la mañana; los osos son de Konstantín Savitski."
description = """
En un bosque de grandes pinos, la bruma del amanecer se levanta y la luz del sol se filtra entre los troncos, arriba a la derecha. En el centro, un pino quebrado por la tempestad ha caído de través, con el tronco hendido que deja ver la madera clara. Cuatro osos juegan a su alrededor: dos oseznos trepan por el tronco, un tercero se alza sobre las patas traseras a la derecha, sobre otra rama rota, mientras que la madre, abajo, vigila. En primer plano, el suelo está cubierto de musgo, hierbas y raíces. A la izquierda, los abetos permanecen en una sombra azulada; a la derecha, las copas de los pinos adquieren un color dorado. Al fondo, los troncos se desdibujan en la niebla."""
evocation = """
El cuadro celebra el bosque ruso, inmenso, antiguo, todavía salvaje, que Shishkin pintó toda su vida y conocía como botánico. La escena de los osos le añade una nota de ternura y casi de humor: la naturaleza no es solo grandiosa, está viva y llena de juegos. La mañana, la bruma, la luz que asciende hacen del lienzo un himno al despertar de la naturaleza. Es uno de los cuadros más queridos y más reproducidos de Rusia, hasta el punto de que a menudo se olvida la gravedad del pino arrancado, en el centro, que recuerda la violencia de las tempestades y el ciclo de la vida y de la muerte en el bosque."""
histoire = """
Shishkin prepara el cuadro a partir de estudios hechos en los bosques de la región de Tver, en torno al lago Seliguer. Confía los osos a su amigo Konstantín Savitski, pintor de escenas de género y de animales, que sin duda había tenido la idea de este grupo. El cuadro se presenta en 1889 en la decimoséptima exposición de los Itinerantes con las dos firmas. Pavel Tretiakov lo compra pero, según el relato transmitido, hace borrar la firma de Savitski, estimando que la concepción y lo esencial de la ejecución correspondían a Shishkin. Desde entonces, la obra se presenta bajo el solo nombre de Shishkin, con mención de la participación de Savitski."""
facture = """
Shishkin pinta con una precisión casi científica las cortezas, las agujas, los musgos y las ramas rotas. Construye la profundidad mediante la bruma: los troncos del fondo se vuelven cada vez más pálidos y azulados. La luz dorada, que entra en diagonal por arriba a la derecha, se opone a los verdes fríos de la izquierda. Los osos de Savitski, pintados con una pincelada más flexible, se funden en el conjunto gracias a la armonía de los pardos."""
details = [
  "El osezno erguido sobre las patas traseras, a la derecha, que mira a lo lejos.",
  "El tronco hendido del pino abatido, de madera clara y desgarrada.",
  "La luz dorada que ilumina la copa de los pinos, arriba a la derecha.",
  "Los troncos del fondo que desaparecen en la bruma azulada.",
]
themes = ["bosque", "osos", "mañana", "bruma", "naturaleza"]
anecdote = """
En Rusia, a este cuadro se le llama a menudo «Los tres osos», cuando en realidad hay cuatro. Su popularidad se debe también a una confitería: desde principios del siglo XX, una fábrica de chocolate de Moscú reproduce sus osos en el envoltorio de sus bombones, que todavía se venden hoy."""
salle = 4
mur = "est"
place = 2
largeur = 2.1

[[oeuvres]]
titre = "Sobre el reposo eterno"
artiste = "Isaac Levitan"
annee = "1894"
image = "repos-eternel.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Levitan_nad_vech_pok28.jpg"
technique = "Óleo sobre lienzo, 150 × 206 cm"
collection = "Galería Tretiakov, Moscú"
note = "Una pequeña iglesia de madera y un cementerio dominan un río inmenso bajo un cielo de tormenta: el paisaje más meditativo de Levitán."
description = """
Desde lo alto de un promontorio verdeante, se domina una extensión de agua inmensa, gris plata, que se extiende hasta el horizonte. En el promontorio, en primer plano a la izquierda, una pequeña iglesia de madera de techo inclinado está rodeada de árboles que el viento hace doblarse. Una luz brilla en su ventana. Muy cerca, se distinguen las cruces inclinadas de un viejo cementerio, casi borradas en la hierba. A lo lejos, una isla baja y alargada flota sobre el agua, y unas orillas planas se pierden en la bruma. El cielo ocupa más de la mitad del cuadro: pesadas nubes grises y blancas se amontonan, se aproxima una tormenta, mientras que una luz pálida aún se abre paso a la izquierda."""
evocation = """
El título dice el sentido del cuadro: sobre el cementerio, sobre el «reposo eterno», se despliegan la inmensidad del agua y del cielo, indiferente a la vida de los hombres. La iglesia minúscula, con su pequeña luz, es como una presencia humana frágil ante la eternidad de la naturaleza. Se ha visto en él una meditación sobre la muerte, sobre la brevedad de la vida y sobre la soledad, temas que obsesionaban a Levitán, a menudo melancólico y ya enfermo del corazón. El pintor escribió a Pavel Tretiakov que se había puesto en él por entero, con toda su alma. Es el paisaje ruso transformado en meditación filosófica, a la manera de un poema."""
histoire = """
Levitán pinta el lienzo en 1893–1894, tras un verano pasado a orillas del lago Udomlia, en la provincia de Tver, cuyo paisaje le proporciona la extensión de agua. Para la iglesia, retoma un estudio hecho unos años antes en Plyos, en el Volga, donde había pasado varios veranos: una pequeña iglesia de madera que había pintado a la luz de la tarde. El cuadro se presenta en 1894 y Pavel Tretiakov lo compra enseguida para su galería, donde sigue expuesto. Levitán, que atravesaba entonces un período de duda y de melancolía, lo consideraba una de sus obras más personales."""
facture = """
Levitán simplifica el paisaje en grandes masas: el verde del promontorio, el gris plateado del agua, el cielo nuboso. El punto de vista elevado y la línea del horizonte situada en el medio dan la impresión de un espacio sin límites. La pincelada, amplia en el cielo, se vuelve más fina en los árboles agitados por el viento. La paleta, casi monocroma, juega con los matices de gris, de verde y de blanco, que apenas calienta la pequeña luz de la iglesia."""
details = [
  "La luz que brilla en la ventana de la pequeña iglesia.",
  "Las cruces inclinadas del cementerio, abajo a la izquierda.",
  "Los árboles que se doblan bajo el viento, junto a la iglesia.",
  "La isla larga y plana, en medio de la extensión de agua.",
]
themes = ["paisaje", "río", "muerte", "cielo", "soledad"]
anecdote = """
Levitán era amigo íntimo del escritor Antón Chéjov, a quien había conocido joven, en el ambiente de las escuelas de arte de Moscú; el hermano de Chéjov, Nikolái, era su compañero de estudios. Ambos hombres compartían la misma mirada sobre la melancolía del paisaje ruso."""
