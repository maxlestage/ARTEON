position = 0
largeur = 1.87

[[oeuvres]]
titre = "Jarra firmada por Ennion"
artiste = "Ennion"
annee = "primera mitad del siglo I d. C."
image = "cruche-d-ennion.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Glass_jug_MET_DP121998.jpg"
technique = "Vidrio soplado en molde, altura 18,4 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una jarra de vidrio ámbar cuyo decorado lleva, en un pequeño cartucho, el nombre de su creador: Ennion, uno de los primeros artistas vidrieros conocidos. Mide 18,4 cm."
description = """
Una pequeña jarra de vidrio pardo ámbar, de cuello ancho, se asienta sobre su base. Un \
asa clara, casi blanca, parte del hombro, sube hasta el borde y allí se repliega en \
un pequeño rizo. La superficie está enteramente cubierta por un decorado en relieve, \
dispuesto en bandas superpuestas. En el cuello, costillas verticales; en el hombro, \
un friso de hojas y de motivos en abanico alojados en arquillos; en medio del cuerpo, \
una red de rombos, interrumpida por un pequeño cartucho rectangular donde se leen \
letras griegas; más abajo, largas acanaladuras verticales. En algunos puntos, una \
película blanquecina e irisada vela el vidrio."""
evocation = """
El cartucho lleva, en griego, el nombre de Ennion y el verbo «hizo»: es una firma, \
insertada en el decorado como una marca de fábrica. En una época en que los artesanos \
permanecen casi siempre anónimos, Ennion reivindica su obra y la convierte en un \
argumento de prestigio. La jarra imita con su decorado la vajilla de metal precioso, \
pero en una materia nueva, ligera y translúcida. Testimonia una revolución técnica: \
en pocas décadas, el vidrio, antes escaso, se convierte en un objeto de mesa extendido \
por todo el Imperio romano."""
histoire = """
Ennion trabajó en la primera mitad del siglo I de nuestra era, probablemente en Sidón, \
en la costa del actual Líbano, uno de los grandes centros del vidrio antiguo. Sus \
obras firmadas, copas, vasos y jarras, han aparecido en varios puntos del \
Mediterráneo, en particular en el norte de Italia, lo que ha hecho suponer que \
instaló allí un taller. Esta jarra ingresó en el Metropolitan Museum en 1917, \
donación del banquero y coleccionista J. Pierpont Morgan. En 2014, el museo dedicó una \
exposición a Ennion, reuniendo gran parte de sus obras conocidas."""
facture = """
El soplado del vidrio se inventó en el siglo I antes de nuestra era, en la costa \
siro-palestina. Ennion lo combinó con el molde: el vidriero sopla una burbuja de \
vidrio caliente en un molde de varias piezas, cuyo decorado en hueco se imprime en \
relieve sobre la pared. Así puede reproducir el mismo modelo, con su firma. El asa, \
hecha de un vidrio de otro color, se añade en caliente, se estira y luego se \
repliega. La finura de los relieves supone moldes de gran precisión."""
details = [
  "El pequeño cartucho de letras griegas, a la izquierda de la red de rombos.",
  "El rizo que forma el asa al replegarse sobre el borde.",
  "Los motivos en abanico alojados bajo arquillos, en el hombro.",
  "Las acanaladuras verticales de la parte baja, como las de una columna.",
  "La película irisada dejada por la alteración del vidrio en la tierra.",
]
themes = ["vidrio", "firma", "artesanía", "roma", "mesa"]
anecdote = """
En algunas de sus copas, Ennion añade a su firma una breve fórmula griega que se \
traduce por «que el comprador se acuerde»: una manera, ya entonces, de fidelizar a su \
clientela."""
salle = 5
mur = "nord"
place = 2
largeur = 0.75

[[artistes]]
nom = "Mésopotamie, époque néo-sumérienne"
vie = "Sur de Mesopotamia (actual Irak), hacia 2150–2000 a. C."
biographie = """
En la llanura del Tigris y el Éufrates, los sumerios fundaron, desde el IV milenio \
antes de nuestra era, las primeras ciudades e inventaron la escritura cuneiforme, \
trazada con una caña sobre tablillas de arcilla. Hacia 2350, Sargón de Acad unifica \
la región bajo su imperio; a su caída, las ciudades sumerias recobran la \
independencia. Es la época llamada neosumeria, que ve brillar primero el Estado de \
Lagash y su capital Girsu, bajo el príncipe Gudea, y después la tercera dinastía de \
Ur, cuyos reyes construyen grandes zigurats. Los soberanos se presentan entonces menos \
como conquistadores que como pastores de su pueblo, piadosos y constructores de \
templos. Sus talleres producen estatuas de piedra dura, relieves, sellos cilíndricos \
finamente grabados y una abundante literatura. Hacia 2000 antes de nuestra era, Ur \
cae bajo los golpes de los elamitas, y la lengua sumeria deja poco a poco de \
hablarse, aunque sigue siendo durante casi dos milenios la lengua culta y religiosa de \
Mesopotamia."""
style = """
La escultura neosumeria busca la calma, la estabilidad y la duración. Las estatuas, a \
menudo de diorita, tienen formas compactas y cerradas, superficies pulidas, manos \
juntas y grandes ojos abiertos, vueltos hacia la divinidad. La escritura forma parte \
de la obra: grabada en la túnica o en la espalda, nombra al modelo y proclama su \
piedad. Esta sobriedad majestuosa ha hecho de Gudea una de las figuras más \
reconocibles del Oriente antiguo."""

[[artistes]]
nom = "Assyrie, règne d'Assurnasirpal II"
vie = "Norte de Mesopotamia (actual Irak), 883–859 a. C."
biographie = """
Asiria ocupa el norte de Mesopotamia, en torno al Tigris y la ciudad de Assur, que le \
da su nombre. En el siglo IX antes de nuestra era, sus reyes lanzan cada año campañas \
militares y construyen un imperio que se extenderá, dos siglos más tarde, de Irán a \
Egipto. Asurnasirpal II, que reina de 883 a 859, es uno de sus fundadores. Elige como \
capital Kalhu, la actual Nimrud, que rodea de murallas y puebla de deportados. Levanta \
allí el Palacio Noroeste, decorado con cientos de losas esculpidas: escenas de guerra \
y de caza, cortejos de tributarios, genios protectores y toros alados de cabeza humana \
que guardan las puertas. Sus sucesores prosiguen esta tradición en Jorsabad y en \
Nínive. El imperio se derrumba en 612 antes de nuestra era, cuando Nínive cae bajo los \
golpes de los babilonios y los medos. Redescubiertos en el siglo XIX, estos palacios \
revelaron a Europa un arte hasta entonces conocido solo por la Biblia; los yacimientos \
de Nimrud fueron gravemente dañados en 2015."""
style = """
El relieve asirio sirve al poder real. Las losas, alineadas a lo largo de los muros, \
forman relatos continuos o hileras de figuras protectoras, a menudo atravesadas por \
una inscripción. El estilo es preciso y decorativo: perfiles nítidos, músculos \
estilizados, cabelleras y barbas rizadas en filas regulares, plumas y flecos cincelados. \
Esta claridad majestuosa, hecha para impresionar a los visitantes del palacio, marcó \
el arte de la Persia aqueménida."""

[[artistes]]
nom = "Égypte, Moyen Empire"
vie = "Valle del Nilo, hacia 2030–1650 a. C."
biographie = """
El Imperio Medio comienza cuando Mentuhotep II, príncipe de Tebas, reunifica Egipto \
tras un período de divisiones, hacia 2030 antes de nuestra era. Bajo la dinastía XII, \
la de los Amenemhat y los Sesostris, el país conoce una larga prosperidad: los reyes \
acondicionan el oasis del Fayum, construyen fortalezas en Nubia y pirámides de ladrillo \
cerca de Menfis. Los gobernadores de provincia, como los de Meir en el Egipto Medio, \
se hacen excavar ricas tumbas decoradas. La literatura egipcia conoce entonces su edad \
clásica, con cuentos y enseñanzas copiados durante siglos. En las tumbas se depositan \
modelos de madera de graneros, barcos y talleres, estatuillas de sirvientes y \
figurillas de loza, como los hipopótamos azules, destinadas a acompañar al muerto en \
el más allá. Las creencias funerarias se amplían: la salvación eterna, antes reservada \
al rey, se convierte en la esperanza de todos los que pueden permitirse una tumba. El \
período se cierra con la llegada al poder de los hicsos, venidos de Asia, en el norte \
del país."""
style = """
El arte del Imperio Medio une el rigor de las convenciones egipcias a una observación \
nueva de la naturaleza y de los rostros. Los retratos reales muestran rasgos marcados, \
a veces cansados. Los pequeños objetos de las tumbas, de madera pintada o de loza, \
tienen una gran frescura: formas simples y plenas, colores vivos, decorado tomado de \
la vida del Nilo. Muestran un arte destinado a la eternidad, pero atento al mundo de \
los vivos."""

[[artistes]]
nom = "Égypte, Nouvel Empire"
vie = "Valle del Nilo, hacia 1550–1070 a. C."
biographie = """
El Imperio Nuevo se abre hacia 1550 antes de nuestra era, cuando los príncipes de \
Tebas expulsan a los hicsos y reunifican Egipto. Durante cinco siglos, bajo las \
dinastías XVIII, XIX y XX, el país se convierte en una potencia imperial, de Nubia a \
Siria. Es la época de Hatshepsut, de Tutmosis III, de Akenatón y de Tutankamón, y \
después de los Ramsés. Tebas, la actual Luxor, es su capital religiosa: allí se \
amplían los templos de Karnak y de Luxor, y los reyes se hacen enterrar en el Valle de \
los Reyes. Los altos funcionarios, escribas e intendentes, como Hunefer bajo Seti I, \
disponen también de tumbas pintadas y de un mobiliario funerario cuidado. Es entonces \
cuando se difunde el Libro de los muertos: una recopilación de unas doscientas \
fórmulas, copiadas en papiro e ilustradas con viñetas, que cada cual elegía según sus \
medios. Talleres de escribas y de pintores preparaban ejemplares, a veces de \
antemano, dejando espacio para inscribir el nombre del futuro difunto."""
style = """
La pintura del Imperio Nuevo sigue las reglas fijadas desde el Imperio Antiguo: \
figuras de perfil con los hombros de frente, colores aplicados en plano, personajes \
alineados en registros, texto e imagen entremezclados. Dentro de este marco, los \
artistas alcanzan una gran elegancia: líneas flexibles, detalles de los vestidos de \
lino, armonías de blanco, ocre, verde y azul. Las viñetas del Libro de los muertos \
han fijado para siempre nuestra imagen del más allá egipcio."""

[[artistes]]
nom = "Égypte romaine"
vie = "Egipto, provincia del Imperio romano, siglos I–III d. C."
biographie = """
En el año 30 antes de nuestra era, tras la muerte de Cleopatra, Egipto se convierte en \
provincia romana, gobernada en nombre del emperador y encargada de alimentar a Roma \
con su trigo. Hereda tres siglos de dominación griega, bajo los reyes Ptolomeos: las \
ciudades albergan una población mezclada de egipcios, griegos y romanos, que hablan \
griego, veneran a la vez a los dioses egipcios y griegos, y siguen la moda del \
Imperio. En el Fayum, gran oasis agrícola al oeste del Nilo, y en otras regiones, las \
familias acomodadas siguen haciendo momificar a sus muertos, según la tradición \
egipcia, pero a menudo sustituyen las máscaras por retratos pintados sobre madera. \
Estos retratos, producidos sobre todo en los siglos I y II, han aparecido en gran \
número a partir de la década de 1880, en particular por obra del arqueólogo británico \
Flinders Petrie en Hawara y del marchante Theodor Graf. Sus autores han permanecido \
anónimos, pero se distinguen talleres y manos diferentes. La práctica decae en el \
siglo III y después desaparece."""
style = """
Los retratos del Fayum aplican a un rito egipcio la pintura griega de caballete. El \
rostro se ve de frente, a menudo ligeramente de tres cuartos, con grandes ojos que \
fijan al espectador. El modelado por la luz, los reflejos y los toques de cera dan una \
presencia sobrecogedora. Redescubiertos a finales del siglo XIX, se han comparado a \
menudo con los iconos bizantinos, cuya mirada frontal anuncian."""

[[artistes]]
nom = "Peintre d'Amasis"
vie = "Atenas, activo hacia 560–515 a. C."
biographie = """
No se conoce ni el verdadero nombre ni la vida de este pintor ateniense. Los \
arqueólogos lo llaman el Pintor de Amasis porque varios vasos que decoró llevan la \
firma de un alfarero llamado Amasis, que los modeló: desde hace mucho se discute si se \
trata del mismo hombre, a la vez alfarero y pintor. El nombre de Amasis, forma griega \
de un nombre egipcio, ha hecho suponer un origen extranjero, o vínculos con Egipto, \
pero nada está probado. Activo durante cerca de medio siglo, es, junto con Exequias, \
el mayor maestro de la figura negra ática, en la época en que Atenas se impone en el \
mercado de los vasos pintados, exportados hasta Etruria. Se le atribuyen más de un \
centenar de vasos: ánforas, copas, jarras y lécitos. Pinta en ellos dioses, en \
particular Dioniso y su cortejo de sátiros y ménades, héroes, pero también escenas de \
la vida cotidiana, más raras en su época, como la boda y el trabajo de la lana. Asiste, \
al final de su carrera, a la aparición de la figura roja."""
style = """
El Pintor de Amasis tiene un dibujo nítido, preciso y lleno de ingenio. Sus figuras, \
a menudo pequeñas y elegantes, se reparten con equilibrio sobre el vaso. Cuida los \
motivos de las telas, los gestos y las actitudes, y sabe dar la vida de un cortejo o \
de un baile. Su humor y su frescura de observación lo distinguen de su contemporáneo \
Exequias, más solemne."""

[[artistes]]
nom = "Peintre de Berlin"
vie = "Atenas, activo hacia 500–460 a. C."
biographie = """
Como la mayoría de los pintores de vasos griegos, este maestro no firmó sus obras y su \
nombre se ha perdido. A principios del siglo XX, el arqueólogo británico John Beazley \
reconoce su mano en un ánfora conservada en Berlín, que muestra a Hermes acompañado \
de un sátiro, y le da el nombre de ese museo. Mediante la comparación paciente de los \
detalles, le atribuye después cientos de vasos. El Pintor de Berlín trabaja en Atenas \
durante unos cuarenta años, en la época de las guerras médicas, cuando la ciudad \
rechaza a los persas en Maratón y en Salamina. Pertenece a la generación que sigue a \
los inventores de la figura roja y la lleva a su perfección. Decora sobre todo vasos \
grandes, ánforas, cráteras e hidrias, pero también ánforas panatenaicas de figuras \
negras, ofrecidas a los vencedores de los juegos de Atenas. Sus temas son dioses, \
héroes, atletas y músicos. Sus obras, muy buscadas, han aparecido tanto en Grecia como \
en Italia, donde los etruscos importaban los vasos atenienses."""
style = """
El Pintor de Berlín se reconoce por sus figuras aisladas, a menudo una sola por cara, \
que se recortan sobre el barniz negro sin marco ni suelo. Su dibujo es fluido y \
elegante, sus siluetas esbeltas siguen la curva del vaso. Está atento a los pliegues \
de las telas y al movimiento de los cuerpos. Esta composición despojada, de gran \
fuerza, es uno de los logros de la pintura griega arcaica."""

[[artistes]]
nom = "Grèce hellénistique"
vie = "Mundo griego, de Grecia a Egipto y Asia, 323–31 a. C."
biographie = """
La época helenística comienza con la muerte de Alejandro Magno, en el 323 antes de \
nuestra era. Sus conquistas llevaron la lengua y la cultura griegas de Egipto hasta la \
India; sus generales se reparten el imperio y fundan reinos, como el de los Ptolomeos \
en Egipto o el de los Seléucidas en Asia. Nuevas capitales, Alejandría, Antioquía, \
Pérgamo, rivalizan en bibliotecas, teatros y talleres de artistas. Alejandría, con su \
faro y su Museo, se convierte en la mayor ciudad del mundo griego, encrucijada de \
sabios, poetas y artistas, y ciudad de espectáculos. Los escultores trabajan allí el \
mármol y el bronce para los reyes, los santuarios y una clientela privada que busca \
pequeñas estatuillas para adornar las casas. Poco a poco, Roma extiende su dominio \
sobre estos reinos; la época termina en el 31 antes de nuestra era, con la batalla de \
Accio, que precede al fin del Egipto de los Ptolomeos y de Cleopatra."""
style = """
La escultura helenística amplía el repertorio griego: junto a los dioses y héroes \
idealizados, muestra niños, ancianos, músicos, bailarines, sufrimientos y emociones. \
Ama el movimiento, las torsiones del cuerpo, los ropajes virtuosos y los efectos \
teatrales. Esta libertad fue admirada por los romanos, que multiplicaron sus copias, y \
después por los escultores del Renacimiento y del barroco."""

[[artistes]]
nom = "Rome, fin de la République"
vie = "Italia romana, siglos II–I a. C."
biographie = """
En los siglos II y I antes de nuestra era, Roma, dueña de Italia, conquista Grecia y \
el Oriente helenístico. El botín, las obras de arte y los artistas griegos afluyen: la \
aristocracia romana adopta con pasión la cultura griega, su literatura, su filosofía y \
sus artes. Las familias ricas se hacen construir, en la bahía de Nápoles, en torno al \
Vesubio, lujosas villas de campo y de costa, donde se retiran lejos de los asuntos de \
Roma. Pompeya, Herculano, Estabia, Boscoreale u Oplontis han conservado numerosos \
ejemplos. Sus muros están enteramente pintados por equipos de artesanos, a menudo \
anónimos, que trabajan según modelos griegos. El período es también el de las guerras \
civiles, de Mario y Sila a César, que terminan con la victoria de Octavio, el futuro \
Augusto. La erupción del Vesubio, en el 79 de nuestra era, fijó bajo la ceniza estos \
decorados, redescubiertos a partir del siglo XVIII."""
style = """
La pintura mural romana de esta época corresponde al segundo estilo pompeyano: el muro \
ya no se limita a imitar placas de mármol, sino que se abre en trampantojo a \
columnatas, jardines, paisajes o grandes figuras. Los colores son intensos, dominan el \
rojo y el negro, y el modelado por la luz procede de la pintura griega. Estos frescos \
son casi todo lo que nos queda de la gran pintura antigua."""

[[artistes]]
nom = "Ennion"
vie = "Probablemente Sidón (actual Líbano), activo en la primera mitad del siglo I d. C."
biographie = """
Ennion es uno de los primeros vidrieros de la historia cuyo nombre se conoce, porque \
lo inscribió, en griego, en el decorado de sus obras. Su vida solo se conoce por sus \
objetos. Trabaja a comienzos del Imperio romano, bajo los emperadores julio-claudios, \
poco después de la invención del soplado del vidrio en la costa del Levante. Se le \
sitúa con mayor frecuencia en Sidón, ciudad fenicia famosa por su vidrio. Sus copas, \
vasos, jarras y pequeñas ánforas, soplados en moldes, han aparecido en varios puntos \
del Mediterráneo, del Próximo Oriente al norte de Italia, donde son particularmente \
numerosos: se ha deducido que pudo abrir allí un taller, o que sus obras eran muy \
buscadas en esa región. Las técnicas que dominaba se difundieron por todo el Imperio, \
haciendo del vidrio un objeto cotidiano. En 2014–2015, el Metropolitan Museum de \
Nueva York reunió gran parte de sus obras conocidas en la exposición «Ennion: Master \
of Roman Glass»."""
style = """
Ennion es un maestro del vidrio soplado en molde. Sus vasos, de paredes finas, llevan \
un decorado en relieve apretado, repartido en bandas: costillas, follaje, redes de \
rombos, acanaladuras, inspirados en la orfebrería. Juega con vidrios de colores, \
ámbar, azul, verde, púrpura, con asas de otro tono. Su firma, integrada en el \
decorado, convierte el objeto de serie en una obra de autor."""
