[exposition]
ordre = 5
nom_court = "Antigüedad"
mouvement = "Antigüedad: Egipto, Oriente, Grecia, Roma"
cadre = "vitrine"
couleur = "#8a5416"
titre = "La Antigüedad, de las orillas del Nilo a la bahía de Nápoles"
artiste = "Egipto, Sumer, Asiria, Grecia, Roma…"
dates = "hacia 2090 a. C. – 120 d. C."
accroche = "Exposición virtual · British Museum, Londres"
introduction = """
Dos mil años de arte en torno al Mediterráneo y el Próximo Oriente: un hipopótamo de \
loza azul y un Libro de los muertos egipcio, un príncipe sumerio en oración y un genio \
alado del palacio de Nimrud, vasos griegos de figuras negras y rojas, una bailarina de \
bronce, una pintura mural hallada cerca de Pompeya, una jarra de vidrio firmada y un \
retrato del Fayum. Estos diez objetos, obra de artesanos en su mayoría anónimos, \
hablan de la muerte y del más allá, del poder de los reyes, de la música y de las \
fiestas. El edificio se inspira en el British Museum de Londres: se cruza un pórtico y \
se desemboca en un vasto patio cubierto, la Great Court, al que se abren las galerías \
de Egipto, de Grecia y de Roma."""
vitrine = "hippopotame-william.jpg"

[musee]
nom = "British Museum"
ville = "Londres, Reino Unido"
architecte = "Robert Smirke; Foster + Partners para la Great Court"
construction = "1823–1852; Great Court inaugurada en 2000"
presentation = """
El British Museum nace en 1753, por una ley del Parlamento, de las colecciones legadas \
por el médico Hans Sloane, y abre en 1759 en un palacete del barrio de Bloomsbury. Las \
adquisiciones se multiplican, desde la piedra de Rosetta hasta las esculturas del \
Partenón: a partir de 1823, el arquitecto Robert Smirke levanta un vasto cuadrilátero \
de estilo neogriego, cuya fachada sur alinea una columnata jónica, en torno a un patio \
interior. En 1857, su hermano Sydney construye allí la sala de lectura circular, bajo \
una cúpula, pronto rodeada de almacenes de libros. Tras la salida de la British \
Library, el estudio de Norman Foster despeja el patio y lo cubre con una cubierta de \
vidrio de más de tres mil cristales triangulares: la Great Court, inaugurada en 2000, \
se presenta como la mayor plaza cubierta de Europa. Alrededor, las galerías egipcias, \
asirias, griegas y romanas figuran entre las más ricas del mundo, y la entrada es \
gratuita."""
ici = """
El edificio de ARTEON retoma el encadenamiento del British Museum: un pórtico y luego \
un gran patio cubierto del que parten las galerías. Se entra por el sur en el Pórtico, \
de paredes de piedra clara, y después en la Great Court, cuadrada, de dieciséis metros \
de altura, donde aguardan los relieves de Oriente. Al oeste, la Galería Egipcia, de \
veinticuatro metros de largo y color arena; al norte, la Sala Griega, de paredes ocre \
rosado; al este, la Sala Romana, de un rojo pompeyano suavizado."""

