[[oeuvres]]
titre = "Estatua de Gudea"
artiste = "Mésopotamie, époque néo-sumérienne"
annee = "hacia 2090 a. C."
image = "statue-de-goudea.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Statue_of_Gudea_MET_DT861.jpg"
technique = "Diorita, 44 × 21,5 × 29,5 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El príncipe de Lagash, sentado, con las manos juntas: su estatua rezaba por él, día y noche, en el templo. Mide 44 cm de altura."
description = """
Un hombre está sentado en un asiento bajo y cúbico, con los pies descalzos colocados \
uno junto a otro sobre la peana. Se le ve de frente, inmóvil, con el busto erguido. \
Sus manos están juntas ante el pecho, una apretada dentro de la otra. Viste una larga \
túnica que deja descubiertos el hombro y el brazo derechos, y cuyo borde, sobre el \
otro hombro, está subrayado por finos flecos. Sobre su cabeza, un gorro de ala ancha \
está cubierto de pequeños rizos regulares, como un vellón. El rostro es lleno y \
apacible, con grandes ojos almendrados delineados por un trazo, cejas dibujadas en \
relieve y la boca cerrada. En toda la parte de la túnica que cubre las rodillas, \
columnas de signos cuneiformes están grabadas con esmero en la piedra negra."""
evocation = """
La estatua no es un simple retrato: es un sustituto. Colocada en un templo, ante la \
divinidad, debía rezar sin descanso en lugar del príncipe y asegurarle el favor de los \
dioses. Las manos juntas, la mirada fija y los ojos muy abiertos traducen esa atención \
perpetua. Gudea no se muestra como guerrero, sino como soberano piadoso y constructor: \
las inscripciones de sus estatuas recuerdan los templos que construyó o restauró. La \
inscripción de esta le da incluso un nombre, que el museo traduce por «Gudea, el \
hombre que construyó el templo, que su vida sea larga». La piedra más dura, elegida \
para durar, expresa el deseo de una presencia eterna ante los dioses."""
histoire = """
Gudea gobierna el Estado de Lagash, en el sur de Mesopotamia, a finales del III \
milenio antes de nuestra era. Hace esculpir numerosas estatuas de sí mismo, destinadas \
a los templos de su capital, Girsu, la actual Tello, en Irak. De allí procede \
probablemente esta. A partir de 1877, las excavaciones francesas de Ernest de Sarzec \
en Tello sacan a la luz una serie de estas estatuas, hoy en el Museo del Louvre, que \
revelan al mundo la civilización sumeria. Otras aparecen después en el mercado del \
arte. Esta ingresa en el Metropolitan Museum de Nueva York en 1959, adquirida con el \
fondo Harris Brisbane Dick."""
facture = """
La diorita es una piedra negra, densa y muy dura, difícil de tallar: según sus propias \
inscripciones, Gudea la hacía traer de Magan, una región lejana que se sitúa hacia la \
actual Omán. El escultor ha conservado una forma compacta, casi un bloque, sin partes \
frágiles que sobresalgan. Ha pulido las superficies lisas, el rostro, los brazos, los \
pies, y ha reservado el grabado fino para los detalles: rizos del gorro, flecos, uñas \
y signos de escritura. Las proporciones son deliberadamente achaparradas, con una \
cabeza ancha y manos poderosas."""
details = [
  "Los pequeños rizos del gorro, grabados uno a uno como un vellón de lana.",
  "Los dedos de la mano derecha, apretados en la mano izquierda, en el gesto de la oración.",
  "Las columnas de signos cuneiformes que cubren las rodillas.",
  "El borde con flecos de la túnica que desciende del hombro izquierdo.",
  "Los dedos detallados de los pies descalzos, apoyados planos sobre la peana.",
]
themes = ["sumer", "oración", "soberano", "escritura", "piedra"]
anecdote = """
Gudea dejó también dos grandes cilindros de arcilla, conservados en el Louvre, que \
cuentan cómo un sueño le ordenó reconstruir el templo del dios Ningirsu. Es el texto \
literario más largo en lengua sumeria que se conoce."""
salle = 2
mur = "nord"
place = 5
largeur = 0.8

[[oeuvres]]
titre = "Genio alado con cabeza de águila"
artiste = "Assyrie, règne d'Assurnasirpal II"
annee = "hacia 883–859 a. C."
image = "genie-a-tete-d-aigle.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Relief_panel_MET_DP375422.jpg"
technique = "Alabastro yesífero, 236,2 × 177,8 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una losa del palacio del rey Asurnasirpal II en Nimrud: un espíritu protector alado, con cabeza de águila, vela por la morada del rey."
description = """
Sobre una gran losa de piedra clara, un ser erguido camina de perfil hacia la \
izquierda. Tiene cuerpo de hombre, musculoso, pero cabeza de águila de pico ganchudo, \
coronada por una cresta de plumas, y dos grandes alas desplegadas a la espalda. Viste \
una túnica corta y, encima, un largo manto con flecos que se abre sobre su pierna \
adelantada; sus pies calzan sandalias. Una de sus manos, levantada, sostiene entre los \
dedos un pequeño objeto redondeado; la otra, baja, lleva un cubo por el asa. Brazaletes \
adornados con una roseta rodean sus muñecas, y un collar cuelga de su cuello. Una banda \
de escritura cuneiforme atraviesa toda la losa a media altura, grabada sobre el cuerpo \
y el manto."""
evocation = """
Estos seres híbridos, a los que los textos asirios llaman apkallu, son sabios y \
espíritus protectores. En los muros del palacio montaban guardia, a menudo cerca de \
las puertas o en torno a la imagen del rey. Se interpreta el pequeño objeto que \
sostienen como una especie de hisopo, mojado en el cubo para rociar y purificar: el \
gesto alejaría a los malos espíritus. Otros han visto en él la polinización del árbol \
sagrado, símbolo de fertilidad. La inscripción que recorre la losa, repetida en todo \
el palacio, enumera los títulos y las conquistas del rey: la imagen protege, el texto \
proclama. Juntos expresan un poder real puesto bajo la guarda de los dioses."""
histoire = """
Asurnasirpal II, rey de Asiria de 883 a 859 antes de nuestra era, hace de Kalhu, la \
actual Nimrud, en el norte de Irak, su nueva capital. Construye allí un inmenso \
palacio, el Palacio Noroeste, cuyos muros están cubiertos de losas esculpidas. \
Sepultadas bajo las ruinas, son sacadas a la luz a partir de 1845 por el inglés Austen \
Henry Layard, que envía un gran número de ellas al British Museum. Otras se reparten \
después entre museos y universidades de Europa y de Estados Unidos. Esta ingresa en el \
Metropolitan Museum en 1932, donación de John D. Rockefeller Jr., junto con otros \
relieves del palacio y dos colosos guardianes de las puertas, un toro y un león alados \
con cabeza humana."""
facture = """
El relieve está esculpido en alabastro yesífero, una piedra blanda de la región, que \
podía tallarse en grandes losas y grabarse con finura. El escultor combina varios \
puntos de vista: la cabeza y las piernas están de perfil, los hombros casi de frente. \
Detalla con precisión ornamental las plumas de las alas, los flecos del manto y los \
músculos de la pantorrilla, hinchados hasta la abstracción. El relieve es bajo y \
regular, pensado para verse de cerca, a lo largo de los muros. Originalmente, las \
losas estaban realzadas con colores."""
details = [
  "El pico ganchudo del águila, abierto, y el ojo redondo rodeado por un reborde.",
  "La roseta grabada en cada uno de los brazaletes.",
  "El cubo sostenido por el asa, decorado con líneas horizontales.",
  "Los signos cuneiformes que pasan sin interrupción sobre el manto.",
  "La pantorrilla tallada en masas musculares casi geométricas.",
]
themes = ["asiria", "palacio", "protección", "escritura", "híbrido"]
anecdote = """
Para inaugurar su palacio de Kalhu, Asurnasirpal II ofreció, según una estela hallada \
en el yacimiento, un banquete de diez días a 69 574 invitados, y mandó inventariar las \
carnes, el pan y las jarras de vino."""
salle = 2
mur = "nord"
place = 3
largeur = 1.78

[[oeuvres]]
titre = "Hipopótamo «William»"
artiste = "Égypte, Moyen Empire"
annee = "hacia 1961–1878 a. C."
image = "hippopotame-william.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Standing_Hippopotamus_MET_DP248993.jpg"
technique = "Loza egipcia, 11,2 × 20 × 7,5 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un hipopótamo de loza azul, cubierto de flores de loto, depositado en una tumba: la mascota del Metropolitan Museum. Mide 20 cm de largo."
description = """
Un hipopótamo se mantiene en pie sobre sus cuatro patas cortas, con la cabeza \
ligeramente baja, como si avanzara despacio por el agua. Su cuerpo macizo y redondeado \
es de un azul turquesa luminoso. Sobre ese fondo, trazos negros dibujan plantas del \
pantano: grandes flores de loto abiertas, capullos, hojas y largos tallos que se \
enroscan en sus flancos, su lomo y su cabeza. Se distinguen sus pequeños ojos \
saltones, sus orejas redondas y sus narinas en la punta del ancho hocico. La \
superficie brillante está en algunos lugares desgastada y manchada, y en las patas se \
ve la huella de restauraciones: tres de ellas han sido reconstruidas."""
evocation = """
Para los egipcios, el hipopótamo es un animal ambiguo. En el Nilo, es uno de los más \
peligrosos, capaz de volcar una barca, y puede encarnar las fuerzas del desorden. Pero \
la hembra, que protege ferozmente a sus crías, se asocia también al nacimiento y a la \
fertilidad. Las plantas pintadas sobre su cuerpo transforman al animal en paisaje: \
lleva sobre sí el pantano donde vive, lugar de vida desbordante, que los egipcios \
vinculaban con la creación del mundo y el renacimiento. Depositado en la tumba, \
evocaba ese mundo acuático del que el difunto esperaba renacer. Sus patas fueron \
probablemente rotas a propósito, para que no pudiera dañar al muerto."""
histoire = """
El hipopótamo data de la dinastía XII, en el Imperio Medio, entre los reinados de \
Sesostris I y de Sesostris II. Fue hallado en 1910 en Meir, en el Egipto Medio, en un \
pozo funerario asociado a la capilla del intendente Senbi II, junto con un segundo \
hipopótamo. Ingresa en el Metropolitan Museum en 1917, donación de Edward S. Harkness. \
Su apodo procede de Inglaterra: en 1931, la revista humorística Punch publica la \
historia de una familia que consulta como un oráculo una reproducción en color del \
hipopótamo, al que llama «William». El Metropolitan recoge el relato en su boletín ese \
mismo año, y el nombre queda ligado a la estatuilla."""
facture = """
La loza egipcia no es cerámica de arcilla: es una pasta de cuarzo molido, modelada y \
luego cocida, que se cubre en superficie con un vidriado. El cobre que contiene le \
da ese azul verdoso intenso, el color del agua, de la vegetación y de la regeneración. \
El decorado se pintó en negro antes de la cocción. El artesano simplificó las formas \
del animal en volúmenes plenos y redondos, aunque observando con acierto su postura, \
su pesada cabeza y sus ojos situados en lo alto del cráneo, los de un animal que vive \
a flor de agua."""
details = [
  "Las flores de loto abiertas, pintadas en negro sobre los flancos.",
  "Los pequeños ojos saltones y las orejas redondas, en lo alto de la cabeza.",
  "La pata delantera izquierda, original, y las otras tres, restauradas.",
  "Los tallos que serpentean hasta el hocico.",
  "Las zonas donde el vidriado, desgastado, deja ver un azul más pálido.",
]
themes = ["egipto", "animal", "nilo", "más allá", "loza"]
anecdote = """
Convertido en la mascota oficiosa del Metropolitan Museum, «William» aparece en \
carteles, tarjetas y peluches. Sus tres patas restauradas son de un tono algo \
distinto: se distinguen de la pata original si se mira de cerca."""
salle = 3
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "El pesaje del corazón, Libro de los muertos de Hunefer"
artiste = "Égypte, Nouvel Empire"
annee = "hacia 1275 a. C."
image = "papyrus-hounefer.jpg"
cadre = "bois"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_judgement_of_the_dead_in_the_presence_of_Osiris.jpg"
technique = "Tinta y pigmentos sobre papiro"
collection = "British Museum, Londres"
note = "El juicio del escriba Hunefer: su corazón es pesado contra la pluma de la verdad, antes de ser presentado a Osiris, rey del más allá."
description = """
La escena se lee de izquierda a derecha. Hunefer, vestido de lino blanco, es conducido \
de la mano por Anubis, el dios de cabeza de chacal. En el centro se alza una gran \
balanza: Anubis, arrodillado, vigila su astil. En un platillo reposa el corazón del \
muerto, dentro de un pequeño vaso; en el otro, una pluma. Junto a la balanza aguarda \
Ammit, monstruo de cabeza de cocodrilo. Tot, el dios de cabeza de ibis, anota el \
resultado en su paleta de escriba. Después Horus, de cabeza de halcón, conduce a \
Hunefer ante Osiris, sentado en una capilla, de piel verde y tocado con una alta \
corona blanca. Tras él se encuentran Isis y Neftis. En el registro superior, Hunefer, \
arrodillado, reza ante una hilera de dioses sentados, jueces del tribunal."""
evocation = """
Para los egipcios, el corazón es la sede del pensamiento, de la memoria y de la \
conciencia. En la balanza se compara con la pluma de Maat, diosa de la verdad y del \
orden del mundo: debe ser tan ligero como ella, es decir, puro de faltas. Si el \
corazón pesa demasiado, Ammit, la «devoradora», lo engulle, y el muerto desaparece \
para siempre. Aquí la prueba se supera: Hunefer es declarado «justo de voz» y admitido \
junto a Osiris, el dios muerto y resucitado que reina sobre el más allá. La imagen no \
cuenta una esperanza incierta: al pintar el veredicto favorable, debía también, por su \
sola presencia en la tumba, garantizar su desenlace."""
histoire = """
Hunefer era escriba de las ofrendas divinas e intendente del rey Seti I, a comienzos \
de la dinastía XIX. Su Libro de los muertos, un rollo de papiro de varios metros de \
largo, fue depositado en su tumba en Tebas, la actual Luxor. Estos rollos, que los \
egipcios llamaban «Fórmulas para salir al día», reunían encantamientos destinados a \
guiar al difunto en el más allá. El de Hunefer, particularmente cuidado, fue comprado \
en 1852 por el British Museum a Antoine Clot, llamado Clot Bey, médico francés al \
servicio del virrey de Egipto. El rollo fue cortado en hojas, hoy conservadas bajo \
vidrio; el pesaje del corazón es su página más célebre."""
facture = """
El papiro se hace con finas láminas extraídas del tallo de la planta, dispuestas en \
dos capas cruzadas, luego prensadas y secadas: se ven sus fibras horizontales. El \
pintor traza primero los contornos con tinta y después aplica colores francos en \
plano: blanco del lino, ocres de las pieles, verde y azul de las pelucas y los \
tocados, negro de carbón. Las figuras siguen las convenciones egipcias: cabeza y \
piernas de perfil, hombros de frente, tamaño según la importancia. El texto \
jeroglífico, en columnas, se integra en la imagen y la enmarca."""
details = [
  "La pluma de Maat, en el platillo de la balanza, frente al corazón en su pequeño vaso.",
  "Ammit, la devoradora, de cabeza de cocodrilo, sentada al pie de la balanza.",
  "Tot, de cabeza de ibis, que anota el veredicto en su paleta.",
  "Los cuatro hijos de Horus, de pie sobre una flor de loto, ante el trono de Osiris.",
  "Hunefer arrodillado, arriba a la izquierda, ante los dioses del tribunal.",
]
themes = ["egipto", "más allá", "juicio", "dioses", "escritura"]
anecdote = """
Durante la momificación, los embalsamadores retiraban la mayoría de los órganos, pero \
dejaban el corazón en su sitio, porque sería pesado en el juicio. A veces se colocaba \
sobre el pecho un escarabeo de piedra, grabado con una fórmula, para que no \
testificara contra su dueño."""
salle = 3
mur = "ouest"
place = 4
largeur = 2.6

[[oeuvres]]
titre = "Retrato de una joven de rojo"
artiste = "Égypte romaine"
annee = "90–120 d. C."
image = "jeune-femme-en-rouge.jpg"
cadre = "bois"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Portrait_of_a_young_woman_in_red_MET_09.181.6_EGDP011294.jpg"
technique = "Encáustica y pan de oro sobre madera de tilo, 38,1 × 18,4 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un retrato del Fayum: pintado sobre madera, se colocaba sobre el rostro de la momia, en lugar de las antiguas máscaras."
description = """
Sobre una tabla estrecha, redondeada en lo alto, una joven nos mira de frente. Su \
rostro ovalado, de tez mate, está iluminado por reflejos claros en la nariz, la frente \
y la barbilla. Tiene grandes ojos oscuros, subrayados por pestañas negras y \
coronados por cejas espesas. Sus cabellos negros, rizados, enmarcan su frente; una \
corona de hojas doradas los ciñe. Lleva pendientes y un collar, y viste una túnica y \
un manto de un rojo profundo, con una banda oscura que desciende del hombro. La parte \
baja de la tabla, desnuda, deja ver la madera, manchada por las resinas y las vendas \
que la envolvían."""
evocation = """
Estos retratos mezclan tres mundos. El rito es egipcio: el cuerpo es momificado y el \
rostro debe seguir presente por la eternidad. La técnica y el estilo son griegos, y la \
moda, peinado, joyas y vestido, es la del Imperio romano. La corona de oro, colocada \
sobre una cabellera pintada, se ha relacionado con las coronas que se ponían sobre la \
cabeza de los muertos, signo de su victoria sobre la muerte. La mirada frontal, \
intensa, parece dirigirse directamente a los vivos. Lo que sorprende hoy es la \
individualidad del rostro: una persona concreta, que creeríamos reconocer, y cuyo \
nombre, sin embargo, se ha perdido."""
histoire = """
Desde la conquista del año 30 antes de nuestra era, Egipto es una provincia romana, \
donde conviven egipcios, griegos y romanos. En los siglos I y II, familias acomodadas \
hacen pintar retratos sobre madera, que se deslizan entre las vendas sobre el rostro \
de la momia. Se les llama retratos del Fayum, por el nombre del oasis donde se \
descubrieron muchos, a finales del siglo XIX. Se conocen cerca de un millar, \
dispersos por los museos del mundo. Este retrato ingresó en el Metropolitan Museum en \
1909, adquirido con el fondo Rogers. Los historiadores siguen debatiendo: ¿fueron \
pintados algunos retratos en vida del modelo y recortados a su muerte?"""
facture = """
El retrato está pintado a la encáustica: los pigmentos se mezclan con cera de abeja, \
aplicada en caliente o en forma de emulsión, que da a los colores su brillo y su \
profundidad. El pintor aplica la cera en toques espesos, visibles en la mejilla y el \
cuello, y modela el rostro mediante la luz, con sombras y reflejos, al modo de la \
pintura griega. Las hojas de la corona están hechas de pan de oro, pegado directamente \
sobre la tabla. El soporte es una fina tabla de tilo."""
details = [
  "Las hojas de oro de la corona, dispuestas en rombos sobre los rizos negros.",
  "El pequeño reflejo blanco en cada ojo, que anima la mirada.",
  "Los toques de cera espesa en la mejilla y en el cuello.",
  "El pendiente dorado, a la derecha, bajo los cabellos.",
  "La parte baja de la tabla, sin pintura, manchada por el embalsamamiento.",
]
themes = ["retrato", "más allá", "egipto", "roma", "mirada"]
anecdote = """
Los retratos del Fayum son casi los únicos retratos pintados de la Antigüedad \
grecorromana que han llegado hasta nosotros: los cuadros sobre madera de los grandes \
pintores griegos, admirados por los autores antiguos, han desaparecido todos."""
salle = 3
mur = "sud"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Lécito: el cortejo nupcial"
artiste = "Peintre d'Amasis"
annee = "hacia 550–530 a. C."
image = "lecythe-du-peintre-d-amasis.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Terracotta_lekythos_(oil_flask)_MET_DT5501.jpg"
technique = "Terracota de figuras negras, altura 17,5 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un pequeño frasco ateniense para aceite: unos novios en un carro, escoltados a la luz de las antorchas hacia su nueva casa. Mide 17,5 cm."
description = """
En el cuerpo de este pequeño frasco de un asa, un friso de figuras negras se recorta \
sobre el fondo anaranjado de la arcilla. A la izquierda, un carro de dos ruedas, \
tirado por mulas, lleva a una pareja; una mujer sostiene en él una corona. El cortejo \
avanza hacia la derecha: una mujer camina junto al tiro, un hombre barbudo la sigue y \
otra mujer blande dos antorchas encendidas. A la derecha, una jamba decorada con un \
damero representa la puerta de la casa adonde se dirigen. La piel de las mujeres está \
pintada de blanco. En el hombro del vaso, una fila de jóvenes baila, y un friso de \
puntos separa las dos escenas."""
evocation = """
En Atenas, la boda culmina con un cortejo: por la tarde, la novia deja la casa de su \
padre y es conducida en carro a la de su esposo, a la luz de las antorchas, entre \
cantos y bailes. El pintor ofrece una imagen ordenada y alegre, en la que cada \
personaje tiene su papel. El Metropolitan conserva un segundo lécito del mismo pintor, \
del mismo tamaño, dedicado al trabajo de la lana por mujeres. Juntos, los dos vasos \
muestran los momentos fuertes de la vida de una ateniense: el matrimonio y el trabajo \
del hogar. Se ha supuesto que fueron hechos para una mujer, quizá con motivo de su \
boda."""
histoire = """
El lécito es un frasco destinado al aceite, perfumado o no, que los griegos usaban \
para el aseo, las ofrendas y los ritos funerarios. Este fue fabricado en Atenas hacia \
mediados del siglo VI antes de nuestra era, cuando los vasos áticos se exportaban a \
todo el mundo mediterráneo. Se atribuye al Pintor de Amasis, uno de los grandes \
maestros de la figura negra. El Metropolitan Museum lo compró en 1956 gracias a una \
donación de Walter C. Baker; el lécito de las hilanderas había ingresado allí ya en \
1931. Los dos vasos se exponen hoy juntos, en las galerías griegas del museo."""
facture = """
La técnica de la figura negra nació en Corinto y fue perfeccionada en Atenas. El \
pintor aplica las siluetas con un engobe de arcilla muy fina, que se volverá negro y \
brillante con la cocción, y después graba los detalles con una punta, dejando aparecer \
la arcilla clara: pliegues, crines, arneses. Añade blanco para la piel de las mujeres \
y rojo para algunas prendas. El Pintor de Amasis se distingue por un dibujo preciso y \
cuidado, figuras elegantes y una atención especial a los motivos de las telas."""
details = [
  "La rueda del carro, de finos radios incisos en el negro.",
  "Las dos antorchas de llamas múltiples, alzadas sobre las mulas.",
  "El damero blanco y negro de la jamba de la puerta, a la derecha.",
  "Los rostros blancos de las mujeres, frente al rostro negro del hombre barbudo.",
  "La fila de jóvenes bailarinas en el hombro del vaso.",
]
themes = ["boda", "cortejo", "atenas", "mujeres", "figuras negras"]
anecdote = """
El Pintor de Amasis toma su nombre del alfarero Amasis, que firmó varios de los vasos \
que él decoró. Quizá fueran un único y mismo hombre. Amasis es la forma griega de un \
nombre egipcio, que llevó también un faraón de la misma época."""
salle = 4
mur = "ouest"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Ánfora: el citaredo"
artiste = "Peintre de Berlin"
annee = "hacia 490 a. C."
image = "amphore-du-peintre-de-berlin.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Terracotta_amphora_(jar)_MET_DT272.jpg"
technique = "Terracota de figuras rojas, altura 41,5 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un joven músico canta con la cabeza echada hacia atrás mientras toca la cítara: una sola figura, sobre el negro brillante del vaso."
description = """
En el cuerpo negro y lustroso de una gran ánfora de dos asas, un único personaje se \
recorta, del color anaranjado de la arcilla. Es un joven vestido con una larga túnica \
fina y un manto de pliegues apretados. Sostiene contra sí una gran cítara, el \
instrumento de cuerda de los concursos, de la que cuelga una tela bordada con flecos. \
Su cabeza está echada hacia atrás, la boca entreabierta: canta acompañándose. Su \
cuerpo se arquea ligeramente, como llevado por la música, y sus pies descalzos \
parecen flotar sobre el fondo negro. En la otra cara del vaso, un hombre barbudo, \
apoyado en un bastón, lo escucha: se le interpreta como un juez del concurso."""
evocation = """
El cantor con cítara, o citaredo, es uno de los músicos más admirados de Grecia. En \
Atenas, grandes concursos de música se celebraban durante las Panateneas, la fiesta de \
la diosa Atenea, y los vencedores recibían premios importantes. El vaso capta el \
instante en que el músico, arrebatado por su canto, olvida todo lo que le rodea. El \
juez, en la otra cara, recuerda que se trata de una competición. Pero la imagen \
supera la anécdota: al aislar una silueta sobre el negro, el pintor hace de la música \
una presencia casi divina, que recuerda a Apolo, el dios citaredo."""
histoire = """
El ánfora fue pintada en Atenas hacia 490 antes de nuestra era, los años de la batalla \
de Maratón, por uno de los mejores pintores de su tiempo. Su nombre no ha llegado \
hasta nosotros: se le llama el Pintor de Berlín, por un ánfora conservada en los \
museos de Berlín. Fue el arqueólogo británico John Beazley quien reconoció su mano, a \
principios del siglo XX, comparando el dibujo de los ojos, las manos y los pliegues. \
El Metropolitan Museum adquirió este vaso en 1956, con el fondo Fletcher. Figura entre \
las obras más célebres de sus galerías griegas."""
facture = """
La figura roja, inventada en Atenas hacia 530 antes de nuestra era, invierte la \
figura negra: el pintor deja los personajes en reserva, del color de la arcilla, y \
pinta el fondo de negro. Los detalles ya no se graban, sino que se trazan con pincel, \
en líneas finas y ligeros relieves, o con engobe diluido para los matices. El Pintor \
de Berlín gusta de las figuras aisladas, sin marco ni suelo, que se recortan en toda \
la altura del vaso. Su dibujo es flexible y nervioso, atento al movimiento de las \
telas."""
details = [
  "La cabeza echada hacia atrás del cantor y su boca entreabierta.",
  "La tela bordada con puntos y con flecos que cuelga de la cítara.",
  "Los finos pliegues de la túnica, trazados en líneas paralelas.",
  "Los pies descalzos, apoyados sin ninguna línea de suelo.",
  "Los desconchones del barniz negro, que dejan ver la arcilla en algunos puntos.",
]
themes = ["música", "concurso", "atenas", "figuras rojas", "canto"]
anecdote = """
John Beazley atribuyó cientos de vasos a pintores anónimos estudiando su manera de \
dibujar los detalles, como un perito en caligrafías: el Pintor de Berlín es uno de los \
primeros que identificó así, en un artículo de 1911."""
salle = 4
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Bailarina velada y enmascarada"
artiste = "Grèce hellénistique"
annee = "siglos III–II a. C."
image = "danseuse-voilee.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Bronze_statuette_of_a_veiled_and_masked_dancer_MET_DP118070.jpg"
technique = "Bronce, altura 20,5 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una bailarina envuelta en velos gira sobre sí misma: todo el movimiento pasa por los pliegues de la tela. Mide 20,5 cm."
description = """
Una mujer baila, con el cuerpo enteramente envuelto en telas. Un velo ligero cubre su \
cabeza y su rostro, bajo el cual se adivina una máscara. Su cuerpo se retuerce: la \
cabeza se inclina hacia un hombro, el busto gira, las caderas parten en sentido \
contrario. Un brazo, oculto bajo el manto, lo tiende contra su pecho; la otra mano, \
a su espalda, tira de un lienzo de tela hacia atrás, lo que pega el tejido a sus \
formas y hace nacer una red de pliegues tensos. Bajo el manto, un vestido más grueso \
cae en pliegues profundos hasta el suelo. Un pie avanza, calzado con una fina \
sandalia. El bronce, oscuro y con pátina, conserva huellas verdes de corrosión."""
evocation = """
La estatuilla muestra sin duda a una bailarina profesional, una de esas artistas de \
mimo y de danza que actuaban en las grandes ciudades del mundo griego, y por las que \
Alejandría era célebre. El velo y la máscara ocultan su identidad: ya no es una \
persona, sino un personaje, y su cuerpo se convierte por entero en expresión. Se ha \
visto en ella el espíritu de la época helenística, que sucede a Alejandro Magno: un \
gusto nuevo por el movimiento, el espectáculo y la vida cotidiana. El escultor busca \
menos la belleza ideal que el instante fugaz de una vuelta de baile."""
histoire = """
Tras las conquistas de Alejandro, la cultura griega se extiende desde Egipto hasta \
Asia central, y grandes capitales como Alejandría se convierten en focos artísticos. \
La estatuilla procedería de Alejandría, pero su lugar de hallazgo no es seguro. \
Perteneció al marchante de arte Joseph Brummer y luego al coleccionista neoyorquino \
Walter C. Baker, que la adquiere en 1948 y la lega al Metropolitan Museum. Ingresa \
allí en 1972, de ahí el apodo de «bailarina Baker» con que a menudo se la designa. \
Es hoy uno de los bronces griegos más admirados del museo."""
facture = """
La estatuilla está fundida en bronce según la técnica de la cera perdida: el escultor \
modela la figura en cera, la reviste de arcilla, luego hace fundir la cera y vierte el \
metal en su lugar. Toda la virtuosidad está en el ropaje: dos capas de tela \
superpuestas, un velo fino que se ciñe al cuerpo y deja adivinar el vestido que hay \
debajo. Los pliegues irradian desde la mano que tira del tejido. La estatuilla está \
concebida para verse desde todos los lados, rodeándola."""
details = [
  "El velo tenso sobre el rostro, bajo el cual se adivina la máscara.",
  "La mano oculta a la espalda, que tira del manto hacia atrás.",
  "La red de pliegues tensos que parte de esa mano hacia el hombro.",
  "El pie calzado que asoma bajo el vestido.",
  "Las manchas verdes de corrosión, en la parte baja de la tela.",
]
themes = ["danza", "movimiento", "ropaje", "espectáculo", "bronce"]
anecdote = """
Los bronces griegos rara vez han sobrevivido: el metal, valioso, se refundía casi \
siempre. La mayoría de las grandes estatuas de bronce solo se conocen por copias \
romanas en mármol, lo que hace precioso cada original, por pequeño que sea."""
salle = 4
mur = "nord"
