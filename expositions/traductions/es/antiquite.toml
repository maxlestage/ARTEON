[[oeuvres]]
titre = "Mujer tocando la cítara"
artiste = "Rome, fin de la République"
annee = "hacia 50–40 a. C."
image = "joueuse-de-cithare-boscoreale.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Wall_painting_from_Room_H_of_the_Villa_of_P._Fannius_Synistor_at_Boscoreale_MET_DP105943.jpg"
technique = "Fresco, 186,7 × 186,7 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un fresco de la villa de Publio Fannio Sinistor en Boscoreale, sepultada por el Vesubio en el año 79 como la vecina Pompeya."
description = """
Sobre un fondo rojo vivo, una mujer está sentada en un asiento ricamente torneado, de \
respaldo calado, guarnecido con un cojín azul. Viste un traje púrpura y un amplio \
manto blanco que cubre sus rodillas; una diadema de oro ciñe sus cabellos y unos \
pendientes brillan en sus orejas. Sostiene contra sí una gran cítara dorada, cuyas \
cuerdas roza, pero no mira el instrumento: sus ojos se fijan en el espectador. Detrás \
del respaldo del asiento, una niña se inclina y mira, ella también, al frente. Abajo \
corre una banda de suelo claro; arriba, una cornisa pintada, adornada con dentículos, \
corona el muro."""
evocation = """
La escena pertenece a un gran friso de personajes, pintado casi a tamaño natural, cuyo \
sentido ha sido muy discutido. Según la interpretación del Metropolitan Museum, estos \
paneles reproducen pinturas hechas para una corte real de Macedonia, a comienzos de la \
época helenística, y celebrarían una boda dinástica. La diadema y el asiento casi \
regio hacen de la intérprete una persona de alto rango: se ha propuesto ver en ella a una \
reina o princesa macedonia, con su hija o su hermana menor. Para el rico propietario \
romano, estas imágenes expresaban su cultura griega y su gusto por el fasto."""
histoire = """
La villa de Publio Fannio Sinistor se encontraba en Boscoreale, a pocos kilómetros al \
norte de Pompeya. Sus pinturas fueron ejecutadas hacia 50–40 antes de nuestra era, y \
luego la casa quedó sepultada bajo las cenizas en la erupción del Vesubio, en el 79 de \
nuestra era. Sacada a la luz en 1900, es despojada de sus frescos, cortados y \
vendidos en subasta en París en 1903. El Metropolitan Museum adquiere entonces un \
conjunto importante, que incluye este panel, que adornaba la gran sala llamada sala H. \
Los demás paneles de esta sala están hoy repartidos entre varios museos, en Italia y \
en Europa."""
facture = """
La pintura es un fresco: los colores, diluidos en agua, se aplican sobre un enlucido \
de cal aún fresco, con el que hacen cuerpo al secarse. El fondo, de un rojo brillante, \
se alisaba después con esmero. Es el segundo estilo pompeyano, que abre el muro con \
falsas arquitecturas y grandes figuras. El pintor modela los rostros mediante la luz, \
con toques rápidos, y da la materia de las telas y el metal dorado del instrumento. \
Las grietas del panel atestiguan su edad y su desprendimiento del muro."""
details = [
  "La mirada de la niña, sobre el respaldo, vuelta hacia nosotros.",
  "La diadema de oro y el pendiente de la música.",
  "Las patas torneadas del asiento, pintadas como madera roja y dorada.",
  "La cornisa pintada con dentículos, en lo más alto del panel.",
  "Las grietas del enlucido, que dibujan una red sobre el fondo rojo.",
]
themes = ["música", "fresco", "pompeya", "retrato", "rojo"]
anecdote = """
El Metropolitan Museum ha vuelto a montar una habitación entera de la misma villa, con \
sus muros pintados con vistas de arquitecturas, jardines y pórticos: se puede entrar \
en ella y permanecer en el interior de una estancia romana tal como se veía antes del \
año 79."""
salle = 5
