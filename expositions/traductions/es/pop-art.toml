[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi, 24 de noviembre de 1864 – castillo de Malromé (Gironda), 9 de septiembre de 1901"
biographie = """
Henri de Toulouse-Lautrec nace en una antigua familia aristocrática del Mediodía. \
Siendo adolescente se rompe las dos piernas en 1878 y 1879: dejan de crecer, \
probablemente a causa de una enfermedad ósea hereditaria. Se consagra entonces al \
dibujo, se forma en París con Bonnat y luego en el taller de Cormon, donde frecuenta a \
Émile Bernard y a Vincent van Gogh. Instalado en Montmartre, pinta sus cabarés, sus \
bailes y sus estrellas: Aristide Bruant, La Goulue, Jane Avril, Yvette Guilbert. Su \
cartel para el Moulin Rouge, en 1891, lo hace célebre; dibujará una treintena, y \
centenares de litografías. Minado por el alcohol, es internado en 1899 en una clínica \
de Neuilly. Muere a los treinta y seis años en el castillo de Malromé, en casa de su \
madre."""
style = """
Lautrec es ante todo un dibujante: una línea rápida, nerviosa, que capta una actitud, \
un tic, un rostro en unos pocos trazos. Toma de Degas y de las estampas japonesas los \
encuadres cortados y las vistas en picado. Sus carteles, de superficies planas \
francas y rotulado integrado, fundaron el cartel moderno e hicieron de las estrellas de \
Montmartre imágenes tan conocidas como las marcas."""

[[artistes]]
nom = "Alfons Mucha"
vie = "Ivančice (Moravia), 24 de julio de 1860 – Praga, 14 de julio de 1939"
biographie = """
Nacido en Moravia, entonces en el Imperio austríaco, Alfons Mucha trabaja primero como \
pintor de decorados de teatro en Viena y luego estudia en Múnich gracias a un \
protector. Instalado en París en 1887, sigue los cursos de las academias Julian y \
Colarossi y vive con dificultad de sus ilustraciones. A finales de 1894, dibuja casi \
por casualidad el cartel de Gismonda para Sarah Bernhardt: pegado en París a \
principios de 1895, causa sensación. La trágica le confía sus carteles durante seis \
años, y el impresor Champenois lo contrata. Carteles, paneles decorativos, joyas, \
anuncios: su estilo se convierte en la imagen misma del Art Nouveau. De regreso en \
Bohemia en 1910, dedica casi veinte años a la Epopeya eslava y luego diseña los \
primeros billetes y sellos de Checoslovaquia. Detenido e interrogado por la Gestapo en \
1939, muere poco después en Praga."""
style = """
Mucha creó un lenguaje inmediatamente reconocible: una figura ideal, inscrita en una \
arcada o en un círculo, rodeada de ornamentos, de flores y de letras dibujadas, con un \
contorno oscuro y regular y colores suaves. Hizo del cartel un arte de pleno derecho, \
y su estilo, redescubierto en los años sesenta, inspiró el cartel psicodélico y el \
cómic."""

[[artistes]]
nom = "William Michael Harnett"
vie = "Clonakilty (Irlanda), 10 de agosto de 1848 – Nueva York, 29 de octubre de 1892"
biographie = """
Nacido en el condado de Cork, en Irlanda, en plena hambruna, William Michael Harnett \
llega de niño a Filadelfia con su familia. Adolescente, aprende el oficio de grabador \
de platería, a la vez que sigue clases nocturnas en la Academia de Bellas Artes de \
Pensilvania y luego, en Nueva York, en la Cooper Union y en la National Academy of \
Design. Hacia 1875 empieza a pintar bodegones: jarras, pipas, periódicos, libros, \
billetes de banco. De 1880 a 1886 reside en Europa, sobre todo en Múnich, donde su \
manera se afina. En 1885, en París, pinta After the Hunt, gran trampantojo de \
trofeos de caza que le da fama en Estados Unidos. De regreso en Nueva York, aquejado \
de reumatismo, muere en 1892, a los cuarenta y cuatro años. Largo tiempo olvidado, es \
redescubierto a finales de la década de 1930."""
style = """
Harnett es el maestro del trampantojo estadounidense. Elige objetos modestos y \
gastados, pipas, libros con las esquinas dobladas, instrumentos de música, caza, y los \
pinta a su tamaño real, contra un fondo plano y cercano, con una precisión que borra la \
pincelada. Sus composiciones sabias, heredadas de los holandeses, han seducido al \
público de los saloons y de los grandes almacenes tanto como a los coleccionistas."""

[[artistes]]
nom = "John Frederick Peto"
vie = "Filadelfia, 21 de mayo de 1854 – Nueva York, 23 de noviembre de 1907"
biographie = """
John Frederick Peto crece en Filadelfia y estudia a finales de la década de 1870 en la \
Academia de Bellas Artes de Pensilvania, donde expone después bodegones. Allí traba \
amistad con William Michael Harnett, seis años mayor que él, cuyo ejemplo es decisivo. \
Pero no conoce ni la gloria ni a los grandes compradores. En 1889 se instala con su \
familia en Island Heights, en la costa de Nueva Jersey, donde toca la corneta en las \
reuniones religiosas del verano. Allí pinta durante casi veinte años, apartado, \
tarjeteros, libros gastados, linternas y puertas de armario. A su muerte, en 1907, está \
olvidado; algunas de sus telas se venden incluso con el nombre de Harnett, con \
falsas firmas, hasta que el historiador Alfred Frankenstein le devuelve, hacia 1950, \
su nombre y su obra."""
style = """
Peto pinta los mismos temas que Harnett, pero con una pincelada más libre, una luz más \
suave y objetos más pobres, abollados, rotos, como roídos por el tiempo. Sus \
composiciones planas, hechas de planos y de manchas de color, y su melancolía \
silenciosa se han emparentado en el siglo XX con la pintura moderna."""

[[artistes]]
nom = "John Haberle"
vie = "New Haven (Connecticut), 1856 – New Haven, 1933"
biographie = """
John Haberle nace en New Haven y pasa allí casi toda su vida. Aprende el grabado y la \
litografía, trabaja para impresores y luego es contratado en el museo Peabody de la \
Universidad de Yale, donde dibuja para el paleontólogo Othniel Charles Marsh. Sigue \
también clases en la National Academy of Design de Nueva York. A mediados de la década \
de 1880 se da a conocer por sus trampantojos de billetes, sellos y recortes de \
periódico, tan convincentes que se sospecha que son collages. Pinta después \
composiciones más vastas, como A Bachelor's Drawer, un cajón de soltero lleno de \
billetes, tarjetas y fotografías, o Grandma's Hearthstone, una chimenea de tamaño \
natural. Problemas de vista lo obligan poco a poco a renunciar a ese trabajo \
minucioso. Muere en su ciudad natal en 1933."""
style = """
Haberle lleva el trampantojo hasta el desafío. Elige objetos planos, billetes, sellos, \
fotografías, etiquetas, que puede reproducir a su tamaño exacto sin que el ojo \
descubra la trampa, y juega con humor con lo verdadero y lo falso, hasta en sus \
títulos. Sus cuadros son también archivos de la cultura impresa de su tiempo."""

[[artistes]]
nom = "Raphaelle Peale"
vie = "Annapolis (Maryland), 17 de febrero de 1774 – Filadelfia, 4 de marzo de 1825"
biographie = """
Raphaelle Peale es hijo de Charles Willson Peale, retratista de George Washington, \
naturalista y fundador en Filadelfia de un museo de historia natural y de retratos. \
Formado por su padre, trabaja con él en el museo, donde prepara animales \
disecados, y pinta retratos y miniaturas. A partir de la década de 1810 se dedica \
sobre todo al bodegón, un género que América considera entonces menor, y se convierte \
en su primer gran especialista en su país. Su vida es difícil: la gota, el alcohol y \
probablemente los productos tóxicos empleados en taxidermia arruinan su salud, y sus \
cuadros se venden mal. Muere en Filadelfia en 1825, a los cincuenta y un años. Sus \
bodegones figuran hoy entre las obras más admiradas de la pintura estadounidense \
antigua."""
style = """
Peale compone bodegones sobrios y rigurosos: unas pocas frutas, una fuente, un vaso, \
alineados sobre una repisa ante un fondo oscuro, bajo una luz franca. Heredero de los \
holandeses del siglo XVII, busca la claridad más que la abundancia, y resuelve cada \
materia con una precisión que roza el trampantojo. Es el gran antecesor del bodegón \
estadounidense."""

[[artistes]]
nom = "James Gillray"
vie = "Chelsea (Londres), 13 de agosto de 1756 – Londres, 1 de junio de 1815"
biographie = """
Hijo de un antiguo soldado, James Gillray crece en Chelsea en la comunidad de los \
hermanos moravos, una Iglesia protestante austera. Aprende primero el grabado de \
letras y luego ingresa en 1778 en las escuelas de la Royal Academy. Pero es la \
caricatura lo que lo hace célebre. A partir de la década de 1790 trabaja casi \
exclusivamente para la editora Hannah Humphrey, en cuya casa vive, en Bond Street y \
luego en el número 27 de St James's Street. Ridiculiza por turno al rey Jorge III, a \
los ministros William Pitt y Charles James Fox, a la Revolución francesa y a Napoleón, \
al que reduce a un «pequeño Boney» furioso. Sus estampas circulan hasta el continente. \
Hacia 1810, su vista y su razón declinan; tras un intento de suicidio, deja de grabar \
y muere en 1815, en la casa de St James's Street."""
style = """
Gillray fijó las reglas de la caricatura política moderna: personajes deformados pero \
reconocibles, bocadillos de texto que salen de las bocas, composiciones profusas \
llenas de detalles que leer. Su aguafuerte rápido y violento y sus colores aplicados a \
mano hacen de cada lámina un espectáculo. Es uno de los antecesores directos del \
dibujo de prensa y del cómic."""

[[artistes]]
nom = "Winsor McCay"
vie = "Canadá o Míchigan, hacia 1867 – Nueva York, 26 de julio de 1934"
biographie = """
Los orígenes de Zenas Winsor McCay siguen siendo inciertos: habría nacido en Canadá o \
en Míchigan, entre 1867 y 1871. Crece en Míchigan, donde recibe las únicas \
lecciones verdaderas de su vida de un profesor de dibujo de perspectiva. Trabaja \
primero para circos y museos de curiosidades populares, de los que pinta los carteles \
y los decorados, y luego se hace dibujante de prensa en Cincinnati. En 1903 entra en \
el New York Herald, donde crea Little Sammy Sneeze y Dream of the Rarebit Fiend y, \
en 1905, Little Nemo in Slumberland. Pionero de la animación, realiza una primera \
película a partir de Little Nemo en 1911 y luego Gertie el dinosaurio en 1914. Al \
servicio del magnate de la prensa William Randolph Hearst, dedica sus últimos años \
sobre todo a dibujos editoriales, y muere en Nueva York en 1934."""
style = """
McCay es el primer gran virtuoso del cómic: aprovecha toda la superficie de la página, \
hace variar el tamaño de las viñetas según el relato y dibuja arquitecturas de una \
precisión asombrosa. Su trazo claro, marcado por el Art Nouveau, sirve a un imaginario \
del sueño y de la metamorfosis que ha influido en generaciones de autores y ha abierto \
el camino al dibujo animado."""

[[artistes]]
nom = "Juan Gris"
vie = "Madrid, 23 de marzo de 1887 – Boulogne-sur-Seine, 11 de mayo de 1927"
biographie = """
José Victoriano González-Pérez estudia ingeniería en Madrid y luego se orienta hacia \
el dibujo. En 1906 se instala en París, en el Bateau-Lavoir, en Montmartre, donde ve \
nacer el cubismo en el taller de su vecino y compatriota Picasso. Para vivir, dibuja \
para periódicos satíricos como L'Assiette au beurre. Se dedica a la pintura a partir \
de 1910 y expone por primera vez en 1912, en el Salon des indépendants; ese mismo \
año realiza sus primeros papeles pegados y firma un contrato con el marchante \
Daniel-Henry Kahnweiler. Durante la guerra permanece en Francia, en gran pobreza, y se \
convierte en uno de los representantes más rigurosos del cubismo. En la década de \
1920 crea decorados y trajes para los Ballets Rusos. Enfermo, muere en 1927, a los \
cuarenta años."""
style = """
Gris es el gran arquitecto del cubismo. Parte de una estructura abstracta, una \
cuadrícula de líneas y planos de color, y hace aparecer en ella los objetos de todos \
los días: periódicos, botellas, pipas, naipes. Sus colores francos, su composición \
calculada y la nitidez de sus formas marcaron toda la pintura constructiva de los \
años veinte."""

[[artistes]]
nom = "Kurt Schwitters"
vie = "Hannover, 20 de junio de 1887 – Kendal (Inglaterra), 8 de enero de 1948"
biographie = """
Hijo de comerciantes acomodados de Hannover, Kurt Schwitters estudia pintura en la \
Academia de Dresde. Durante la guerra trabaja como dibujante industrial en una \
fábrica. En 1919 inventa Merz, un arte hecho de todos los materiales, desechos \
incluidos, y expone sus primeros cuadros-collage en Berlín, en la galería Der Sturm. \
Mantenido al margen por los dadaístas berlineses, crea su propio dadá en Hannover, con \
su revista Merz, sus poemas sonoros y sus espectáculos, y construye en su casa el \
Merzbau, una arquitectura interior que invade varias habitaciones. Calificado de \
artista degenerado por los nazis, huye a Noruega en 1937 y luego a Gran Bretaña en \
1940, donde es internado varios meses en la isla de Man. Termina su vida en la región \
de los Lagos y muere en Kendal en 1948."""
style = """
Schwitters hace arte con todo: billetes, etiquetas, envoltorios, madera, cuerdas, \
palabras y sonidos. Sus collages siguen siendo, sin embargo, composiciones rigurosas, \
donde cada fragmento cuenta por su color y su forma. Su manera de recoger los \
desechos de la cultura de consumo abrió el camino al pop art, a los nuevos realistas y \
al arte de hoy."""
