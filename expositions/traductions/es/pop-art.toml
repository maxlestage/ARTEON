[exposition]
ordre = 200
nom_court = "Antes del pop art"
mouvement = "Cartel, trampantojo, caricatura, collage"
cadre = "noir"
couleur = "#b3122e"
titre = "Antes del pop art, la imagen popular, de las estrellas del cartel a los collages"
artiste = "Toulouse-Lautrec, Mucha, Harnett, Peto, Gillray, McCay, Gris, Schwitters…"
dates = "1808–1920"
accroche = "Exposición virtual · Museum Ludwig, Colonia"
introduction = """
El pop art de los años sesenta no surgió de la nada. Cuando Andy Warhol repite el rostro \
de Marilyn Monroe, cuando Roy Lichtenstein amplía una viñeta de cómic o cuando Claes \
Oldenburg esculpe una hamburguesa gigante, retoman imágenes que el cartel, el \
trampantojo, la caricatura y el collage habían vuelto familiares mucho antes que ellos. \
Como las obras del pop art están protegidas por derechos de autor, esta exposición \
muestra a sus antecesores, ya de dominio público: diez obras de 1808 a 1920, desde las \
estrellas de Toulouse-Lautrec y de Mucha hasta los billetes de banco pintados de John \
Haberle, desde la tienda de caricaturas de Gillray hasta el Little Nemo de Winsor McCay, \
desde el Fantômas de Juan Gris hasta los collages de Kurt Schwitters. El edificio se \
inspira en el Museum Ludwig de Colonia, una de las grandes colecciones de pop art de \
Europa: un vestíbulo, una gran nave de doce metros de altura y tres salas blancas \
alrededor. Los grabados y los cuadros pequeños se presentan aquí ampliados."""
vitrine = "jane-avril.jpg"

[musee]
nom = "Museum Ludwig"
ville = "Colonia, Alemania"
architecte = "Peter Busmann y Godfrid Haberer"
construction = "inaugurado en 1986"
presentation = """
En 1976, los coleccionistas Peter e Irene Ludwig, industriales del chocolate de \
Aquisgrán, donan a la ciudad de Colonia unas 350 obras de arte moderno, entre ellas un \
conjunto excepcional de pop art estadounidense; a cambio, la ciudad se compromete a \
construir un museo que lleve su nombre. El edificio, diseñado por Peter Busmann y \
Godfrid Haberer, abre sus puertas en 1986 entre la catedral y el Rin. Al principio \
alberga también el Wallraf-Richartz-Museum, que lo abandona en 2001 para instalarse en \
un edificio propio. Se reconoce por sus cubiertas en diente de sierra, cuyos lucernarios \
reparten por las salas una luz uniforme; bajo la plaza vecina se encuentra la sala de \
conciertos de la Filarmónica. Hoy pueden verse allí Warhol, Lichtenstein, Rauschenberg, \
Johns y Oldenburg, una de las colecciones de Picasso más importantes, la vanguardia \
rusa y una rica colección de fotografías."""
ici = """
Como en el Museum Ludwig, amplios volúmenes blancos se abren unos a otros. Se entra por \
el sur al vestíbulo, sobrio, de siete metros de altura, y luego a la gran nave, de \
veinte metros de ancho y doce de alto, donde «Las estrellas del cartel» reúnen la Jane \
Avril de Toulouse-Lautrec y la Sarah Bernhardt como Lorenzaccio de Mucha. Al oeste, la \
sala «Los objetos cotidianos» reúne los trampantojos de Harnett, de Peto, de Haberle y \
de Raphaelle Peale; al este, «La risa y el cómic» cuelga a Gillray y el Little Nemo de \
Winsor McCay; al norte, «Papeles pegados y collages» muestra el Fantômas de Juan Gris y \
la Pequeña danza de Kurt Schwitters. Todos los muros son de un blanco cálido."""

