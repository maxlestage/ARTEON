[[oeuvres]]
titre = "El Taj Mahal visto desde el Yamuna, Agra"
artiste = "Samuel Bourne"
annee = "años 1860"
image = "taj-mahal.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Gezicht_op_de_Taj_Mahal_vanaf_de_Yamuna_rivier,_RP-F-F80408.jpg"
technique = "Copia sobre papel albuminado"
collection = "Rijksmuseum, Ámsterdam"
note = "El mausoleo de mármol blanco erigido por el emperador Shah Jahan, visto desde la orilla del Yamuna por el más célebre fotógrafo británico de la India."
description = """
El Taj Mahal se alza sobre su alta terraza, a orillas del río Yamuna, cuya agua \
tranquila ocupa la derecha de la imagen. El fotógrafo se ha situado en la ribera, de modo \
que se ve el monumento de tres cuartos: la gran cúpula bulbosa, las pequeñas \
cúpulas que la rodean, los arcos profundos de la fachada y los minaretes. A la izquierda, un \
edificio de arenisca roja coronado de cúpulas y quioscos enmarca el conjunto. Un largo \
muro de contención bordea el río. En primer plano, árboles y una playa de arena \
donde se adivinan pequeñas figuras. El mausoleo se refleja débilmente en el agua. En la parte inferior \
de la imagen, el negativo lleva la inscripción «Bourne 1087»."""
evocation = """
El Taj Mahal es una tumba de amor: el emperador mogol Shah Jahan lo hizo construir \
para su esposa Mumtaz Mahal, muerta en 1631 al dar a luz a su decimocuarto \
hijo. Su blancura y su simetría perfecta evocan, según numerosos historiadores, el \
paraíso prometido por el Corán, con sus jardines y sus aguas. Al mostrarlo desde el \
río y no desde el jardín y su larga alameda de agua, Bourne ofrece de él una imagen \
menos esperada: el mausoleo aparece como un palacio a la orilla del agua, algo \
lejano, casi irreal en la luz blanca. Para los británicos, que \
gobernaban entonces la India, estas imágenes testimoniaban una civilización refinada que \
admiraban a la vez que la dominaban."""
histoire = """
El Taj Mahal se construye en Agra a partir de 1632 por miles de artesanos venidos de \
todo el imperio mogol; el mausoleo se concluye hacia 1643, el conjunto hacia 1653. A la \
muerte de Shah Jahan, en 1666, es sepultado junto a su esposa. En el siglo XIX, el monumento, \
en parte deteriorado, se convierte en etapa obligada de los viajeros británicos. Samuel Bourne, \
llegado a la India en 1863, lo fotografía durante sus giras; su estudio, Bourne & \
Shepherd, vende luego las copias bajo un número, aquí el 1087, a quien quiera comprarlas, \
y sus vistas se difunden ampliamente por Europa. Esta copia pertenece al Rijksmuseum \
de Ámsterdam, que ha puesto sus reproducciones en el dominio público."""
facture = """
Bourne trabaja con colodión húmedo, con una gran cámara de madera y placas de \
vidrio que debe preparar en el lugar, bajo una tienda negra, en el calor de la India. \
Admirador de los paisajes pintorescos, compone sus vistas como un pintor: los árboles \
del primer plano forman un contraste oscuro, la diagonal de la ribera y del muro \
conduce la mirada hacia el monumento, y el río abre el espacio a la derecha. El mármol \
blanco, muy luminoso, es difícil de reproducir: Bourne elige una luz que preserva \
los detalles de la fachada sin quemarlos."""
details = [
  "La firma «Bourne 1087», inscrita en el negativo, al pie de la imagen.",
  "El reflejo del mausoleo en el agua tranquila del Yamuna.",
  "Las pequeñas cúpulas que rodean la gran cúpula bulbosa.",
  "Las diminutas siluetas en la playa, al pie del muro.",
  "El edificio de arenisca roja a la izquierda, que contrasta con el mármol blanco.",
]
themes = ["india", "mausoleo", "amor", "imperio mogol", "viaje"]
anecdote = """
Una leyenda tenaz pretende que Shah Jahan quería hacerse construir, en la otra orilla, un \
Taj Mahal negro. Las excavaciones realizadas enfrente, en el jardín de Mahtab Bagh, han revelado \
un jardín de recreo vuelto hacia el mausoleo, pero ninguna segunda tumba."""
salle = 4
mur = "est"
place = 2
largeur = 3.2

[[oeuvres]]
titre = "Fachada oeste de la Gran Pagoda (Angkor Wat)"
artiste = "Émile Gsell"
annee = "1866"
image = "angkor-vat.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Façade_Ouest_de_la_Grande_Pagode_MET_DP151650.jpg"
technique = "Copia sobre papel albuminado a partir de un negativo de vidrio, 25,1 × 30,3 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una de las primerísimas fotografías de Angkor Wat, tomada en 1866 por un fotógrafo francés establecido en Saigón."
description = """
Una ancha calzada de piedra, invadida de hierbas, conduce hacia el templo. Al fondo se \
alzan las torres de Angkor Wat, en forma de capullo de loto, esculpidas con cornisas \
superpuestas: la más alta en el centro, otras dos a cada lado, una cuarta \
medio oculta a la izquierda. Delante de ellas, los tejados de las galerías se escalonan en varios \
niveles, y una escalera sube hacia una terraza y un pórtico esculpido. A la izquierda, \
cocoteros, palmeras y un pabellón de madera de techo puntiagudo; a la derecha, grandes \
árboles oscuros. En primer plano, el enlosado desunido y la vegetación muestran \
un monumento que apenas se mantiene ya. El cielo, sin nubes, es de un blanco \
uniforme."""
evocation = """
Para los europeos de la década de 1860, Angkor es una «ciudad perdida» en medio de la \
selva, revelada por los relatos del naturalista Henri Mouhot, publicados tras su muerte. Las \
fotografías de Gsell aportan la prueba: el templo existe, inmenso y casi \
intacto. El mito del descubrimiento resulta sin embargo engañoso. Angkor Wat nunca fue \
abandonado: monjes budistas vivían en él y los camboyanos acudían en \
peregrinación, como recuerda aquí el pabellón de madera, que pertenece sin duda al \
monasterio. La imagen dice también el interés de Francia, que acababa de imponer su \
protectorado sobre Camboya, en 1863, y hará de Angkor un símbolo de su presencia en \
Indochina."""
histoire = """
Angkor Wat se construye en la primera mitad del siglo XII, bajo el rey jemer \
Suryavarman II, como templo dedicado al dios Vishnú y, sin duda, como santuario \
funerario del rey; se convierte después en lugar de culto budista. En 1866, Émile Gsell \
se dirige a Angkor con el oficial de marina Ernest Doudart de Lagrée, al inicio de la \
misión de exploración del Mekong, y realiza allí una serie de vistas de los templos. Son \
de las primeras fotografías del sitio, tomadas el mismo año que las del \
escocés John Thomson. El cartón de montaje de esta copia, retirado aquí, lleva el título \
«Cambodge, ruines d'Ang-Kor». La prueba pertenece a la colección Gilman, adquirida \
por el Metropolitan Museum de Nueva York en 2005."""
facture = """
Gsell utiliza el colodión húmedo, en un clima tropical donde el calor, la humedad y \
los insectos complican cada toma. Se sitúa en el eje de la calzada, que \
ahonda la perspectiva y lleva el ojo hasta la torre central, según la simetría querida \
por los arquitectos jemeres. El cielo ha quedado blanco: las placas de la época, sobre todo \
sensibles al azul, no podían registrar a la vez las nubes y el detalle de \
las piedras. Algunos follajes algo borrosos delatan el viento durante la exposición."""
details = [
  "La torre central, la más alta, que figura el monte Meru, centro del mundo.",
  "El pabellón de madera de techo puntiagudo, a la izquierda, signo de la presencia de los monjes.",
  "Las hierbas que crecen entre las losas de la calzada.",
  "El pórtico esculpido en lo alto de la escalera, en el centro de la imagen.",
]
themes = ["camboya", "templo", "jemer", "selva", "exploración"]
anecdote = """
Angkor Wat es uno de los pocos grandes templos jemeres orientados al oeste, dirección \
asociada al dios Vishnú y a la muerte. Por eso los viajeros, como Gsell, \
se acercaban a él por esta fachada, al final de la larga calzada que cruza los fosos."""
salle = 4
mur = "nord"
place = 3
largeur = 2.2

[[oeuvres]]
titre = "La torre Eiffel en construcción"
artiste = "Louis-Émile Durandelle"
annee = "1888"
image = "tour-eiffel-construction.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Louis-Emile_Durandelle,_The_Eiffel_Tower_-_State_of_the_Construction,_1888.jpg"
technique = "Copia sobre papel albuminado"
collection = "J. Paul Getty Museum, Los Ángeles"
note = "A finales de 1888, la torre se eleva sobre el Campo de Marte: el fotógrafo Durandelle sigue las obras, etapa por etapa, para la empresa de Gustave Eiffel."
description = """
La torre se alza, vista de frente, en medio de un solar. Sus cuatro pilares de hierro \
se unen bajo una primera plataforma, y luego suben hasta el segundo piso, ya \
terminado; encima, la parte alta no es aún más que un tronco de celosía metálica, \
coronado por un andamio. El gran arco decorativo, bajo el primer piso, enmarca a lo lejos \
el palacio del Trocadero y sus dos torres. Al pie de la torre, algunos árboles y \
barracones de obra. El suelo, en primer plano, es de tierra removida y escombros. \
El cielo brumoso, de un beige uniforme, hace resaltar el encaje oscuro de las vigas."""
evocation = """
Para Gustave Eiffel, estas fotografías son una demostración: día tras día, la \
torre se eleva según el calendario previsto. Responden a los artistas y escritores que, \
en 1887, habían firmado una protesta contra «la inútil y monstruosa torre Eiffel \
». Hoy la imagen fascina precisamente porque muestra la torre inacabada, como \
un esqueleto en formación: se comprende en ella cómo el hierro, ensamblado pieza a \
pieza, permite subir más alto que cualquier mampostería. Celebra al ingeniero y al \
obrero, la industria y el progreso, valores de la Exposición Universal de 1889, que \
conmemoraba el centenario de la Revolución francesa."""
histoire = """
La torre es concebida en 1884 por dos ingenieros de la empresa Eiffel, Maurice \
Koechlin y Émile Nouguier, y retrabajada luego con el arquitecto Stephen Sauvestre. \
Elegida para la Exposición Universal de 1889, se construye en poco más de \
dos años: las obras comienzan el 28 de enero de 1887, y la torre se concluye el 31 de marzo de \
1889, cuando Eiffel iza la bandera tricolor en su cima. Con sus 300 metros de altura, \
sigue siendo hasta 1930 la construcción más alta del mundo. Durandelle fotografía \
las obras desde los cimientos; sus vistas, reunidas en álbumes titulados «État \
d'avancement des travaux», son regaladas por Eiffel a personalidades. Esta copia \
pertenece al museo J. Paul Getty de Los Ángeles."""
facture = """
Durandelle fotografía a menudo la torre desde el mismo punto de vista, en su eje, de modo que \
las vistas sucesivas pueden compararse como las imágenes de una película: se ve la torre \
crecer de una copia a otra. Trabaja con una gran cámara y placas de \
vidrio de gran formato, que dan una nitidez notable a las celosías de hierro. La \
frontalidad y la simetría perfectas dan a la torre el aspecto de un monumento clásico. \
La copia albuminada, de tono sepia, ha palidecido con el tiempo, lo que acentúa la bruma."""
details = [
  "El palacio del Trocadero, hoy desaparecido, visible bajo el gran arco.",
  "El andamio de la cima, allí donde la obra continúa.",
  "Los arcos bajo el primer piso, puramente decorativos: no sostienen nada.",
  "Los barracones de obra y los árboles jóvenes al pie de los pilares.",
]
themes = ["parís", "hierro", "obra", "ingeniero", "exposición universal"]
anecdote = """
El palacio del Trocadero, construido para la Exposición Universal de 1878, fue sustituido para \
la de 1937 por el actual palacio de Chaillot, que conservó parte de sus \
estructuras."""
salle = 5
mur = "nord"
place = 2
largeur = 1.7

[[oeuvres]]
titre = "La Casa Batlló, Barcelona"
artiste = "Antoni Gaudí"
annee = "1904–1906"
image = "casa-batllo.jpg"
credit = "Photo : ChristianSchd"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Casa_Batllo_Overview_Barcelona_Spain_cut.jpg"
technique = "Fachada de piedra arenisca de Montjuïc, vidrio, cerámica y fundición; fotografía de 2013"
collection = "Passeig de Gràcia 43, Barcelona"
note = "Gaudí transforma un edificio corriente en una fachada ondulante, cubierta de mosaico y coronada por un tejado de escamas: la obra más reciente de la exposición, fotografiada en la actualidad."
description = """
La fachada se alza entre dos edificios más clásicos, de piedra beige. En la \
planta baja y en el primer piso, grandes ventanales de montantes de piedra en forma \
de hueso se abren a la calle. Encima, la fachada, como sembrada de escamas y de pastillas \
de color, azules, verdes y rosas, ondula suavemente; pequeños balcones de hierro en \
forma de máscaras se aferran a ella, piso tras piso. El tejado, curvo y abombado, está \
cubierto de tejas esmaltadas que brillan como la piel de un reptil. A la izquierda, una \
torrecilla coronada por una cruz de cuatro brazos domina el conjunto. Abajo, en la \
acera, unos transeúntes se detienen a mirar; es el final del día, y las ventanas \
están iluminadas."""
evocation = """
Los barceloneses apodaron el edificio la «casa de los huesos» o la «casa de los \
bostezos», por sus columnas y sus aberturas. Una interpretación \
extendida ve en él la leyenda de san Jorge, patrón de Cataluña: el tejado sería el \
lomo del dragón, la torrecilla y su cruz la lanza del santo, los balcones los cráneos de las \
víctimas. Gaudí no dejó ninguna explicación. La obra expresa sobre todo su idea de que \
la arquitectura debe inspirarse en la naturaleza, que ignora la línea recta: sus formas \
evocan el mar, las algas, los huesos o las escamas. Testimonia también la \
prosperidad de la burguesía catalana, que rivalizaba en audacia a lo largo del Passeig de \
Gràcia."""
histoire = """
El industrial textil Josep Batlló poseía en el Passeig de Gràcia, la gran \
avenida del Eixample de Barcelona, un edificio construido en 1877. En lugar de \
demolerlo, Gaudí lo transforma de 1904 a 1906: rehace la fachada, añade un piso y \
el tejado, agranda el patio interior y rediseña la vivienda de la familia. Su \
colaborador Josep Maria Jujol participa en la decoración. En la misma manzana \
se encuentran la Casa Amatller de Puig i Cadafalch y la Casa Lleó Morera de Domènech i \
Montaner, otros dos maestros del modernismo catalán: este conjunto fue apodado la «manzana \
de la discordia». Abierta al público desde 2002, la Casa Batlló está inscrita en el \
patrimonio mundial de la Unesco desde 2005."""
facture = """
La fachada es de piedra arenisca de Montjuïc, la colina de Barcelona, tallada en formas flexibles \
que parecen modeladas más que esculpidas. Gaudí la recubre con un revoque donde están \
incrustados trozos de vidrio de color y discos de cerámica, según la técnica del \
trencadís, mosaico de fragmentos que empleó a menudo. Los balcones son de fundición. \
Las tejas del tejado, de forma redondeada, adquieren reflejos cambiantes según la \
luz. Toda la fachada está concebida como una superficie viva, que se modifica con \
la hora del día."""
details = [
  "Las columnas de los grandes ventanales del primer piso, en forma de hueso.",
  "Los balcones en forma de máscaras, horadados por dos grandes ojos.",
  "La torrecilla y su cruz de cuatro brazos, a la izquierda del tejado.",
  "Las tejas esmaltadas del tejado, como las escamas de un dragón.",
  "Los trozos de vidrio de color incrustados en la fachada.",
]
themes = ["modernismo", "barcelona", "naturaleza", "mosaico", "fachada"]
anecdote = """
En el patio interior, Gaudí hizo variar el color de los azulejos de cerámica, del \
azul oscuro arriba al azul muy pálido abajo, para que la luz que cae desde el lucernario \
parezca igual en todos los pisos."""
salle = 5
mur = "est"
place = 2
largeur = 1.7

[[artistes]]
nom = "Giovanni Battista Piranesi"
vie = "Mogliano Veneto (República de Venecia), 4 de octubre de 1720 – Roma, 9 de noviembre de 1778"
biographie = """
Hijo de un cantero veneciano, Giovanni Battista Piranesi aprende arquitectura con \
su tío, ingeniero encargado de los diques de la laguna, así como la perspectiva y la decoración \
teatral. En 1740, parte a Roma como dibujante en el séquito del embajador de Venecia. La \
ciudad antigua lo conmueve profundamente. A falta de encargos de arquitectura, aprende el grabado y publica en 1743 \
una primera colección de arquitecturas imaginarias. Tras un regreso a Venecia, se instala \
definitivamente en Roma hacia 1747 y abre una tienda donde vende sus propias estampas. \
Las Vistas de Roma, las Cárceles imaginarias y los cuatro volúmenes de las Antigüedades romanas \
(1756) lo hacen célebre en toda Europa. Defiende con pasión, frente a los \
admiradores de Grecia, la originalidad de los romanos. El papa veneciano Clemente XIII lo \
nombra caballero, y el sobrino del papa, el cardenal Rezzonico, le confía su única \
obra de arquitecto: la iglesia de Santa Maria del Priorato, en el Aventino, donde está \
enterrado. Diseña también chimeneas, jarrones y muebles. Tras su muerte, su \
hijo Francesco prosigue su obra y se lleva los cobres a París."""
style = """
Piranesi es un arquitecto que graba: piensa en volúmenes, en estructuras y en sombras. \
Sus aguafuertes, de una energía de trazo sin equivalente, mezclan exactitud \
arqueológica e imaginación, hasta el punto de que agranda de buen grado las ruinas para \
hacerlas más impresionantes. Su visión de la Roma antigua, grandiosa y melancólica, ha \
alimentado el neoclasicismo, a arquitectos como Soane, y luego el imaginario romántico; \
sus Cárceles inspiran todavía a cineastas e ilustradores."""

[[artistes]]
nom = "Étienne-Louis Boullée"
vie = "París, 1728 – París, 1799"
biographie = """
Hijo de un arquitecto, Étienne-Louis Boullée quería ser pintor, pero su padre \
lo orienta hacia la arquitectura. Sigue la enseñanza de Jacques-François Blondel y de \
Jean-Laurent Legeay, vuelto de Roma con el gusto por las formas antiguas y las grandes \
composiciones. Elegido miembro de la Academia Real de Arquitectura en 1762, construye para \
ricos clientes varios palacetes en París y residencias en el campo, \
de los que casi no queda nada. A partir de los años 1780, renuncia poco a poco a construir \
para dedicarse a la enseñanza y a vastos proyectos dibujados, biblioteca \
real, ópera, catedral, palacio, cenotafios, que nunca se realizarán. Desarrolla en ellos \
una arquitectura de volúmenes geométricos puros, esfera, cilindro, pirámide, a \
una escala colosal, y redacta un tratado, Arquitectura, ensayo sobre el arte. Entre sus \
alumnos figuran Jean-François Chalgrin, el arquitecto del Arco del Triunfo, y \
Jean-Nicolas-Louis Durand, cuyas lecciones influirán en todo el siglo XIX. Muere \
en París en 1799, dejando sus dibujos a la nación. Largo tiempo olvidado, es redescubierto \
en el siglo XX, y su ensayo se publica por primera vez en 1953."""
style = """
Boullée busca conmover con la sola geometría: volúmenes simples, desmesurados, \
repetidos, y el juego de la luz y de la sombra, que quería capaz de hacer nacer \
la melancolía o la admiración. Sus dibujos a la aguada, más próximos a la pintura que al \
plano técnico, anuncian la arquitectura visionaria. Se han reconocido en sus proyectos a los \
antepasados de muchos monumentos modernos."""

[[artistes]]
nom = "Francis Frith"
vie = "Chesterfield (Inglaterra), 7 de octubre de 1822 – Cannes, 25 de febrero de 1898"
biographie = """
Nacido en una familia cuáquera de Derbyshire, Francis Frith hace primero carrera en el \
comercio en Liverpool: funda una empresa de venta al por mayor de comestibles, luego una imprenta, \
y las vende con provecho a mediados de los años 1850. Apasionado por la fotografía, \
decide entonces partir hacia Oriente. Entre 1856 y 1859, hace tres viajes a \
Egipto, Nubia, Palestina y Siria, con varios aparatos, entre ellos una cámara \
gigante para placas de 16 × 20 pulgadas. Sus vistas de las pirámides, de los templos de \
Luxor o de Abu Simbel, publicadas en libros y en álbumes de copias originales, causan \
sensación en Gran Bretaña. A su regreso, se instala en Reigate, en Surrey, y \
funda la casa F. Frith & Co., que emprende la tarea de fotografiar las ciudades y los \
pueblos del Reino Unido. Sus operadores recorren el país durante décadas, y \
la empresa vende copias y luego postales hasta 1971. Frith, que escribe \
también sobre religión y moral, muere en 1898 en su villa de Cannes. Sus archivos \
forman hoy un fondo de varios cientos de miles de vistas de \
Gran Bretaña."""
style = """
Frith es un fotógrafo de la exactitud: muestra los monumentos tal como son, en \
grandes formatos de una nitidez asombrosa, con encuadres claros, a menudo frontales, \
y pequeños personajes para dar la escala. Sus textos insisten en la veracidad de \
la fotografía, opuesta a las vistas embellecidas de los pintores orientalistas. Contribuyó \
a fundar la fotografía de viajes y, con su empresa, la postal ilustrada."""

[[artistes]]
nom = "Sébah & Joaillier"
vie = "Constantinopla (Imperio otomano), taller activo a partir de 1888"
biographie = """
El taller Sébah & Joaillier es uno de los grandes estudios fotográficos de \
Constantinopla a finales del Imperio otomano. Toma el relevo del estudio fundado en 1857 \
por Pascal Sébah, fotógrafo nacido en Constantinopla, establecido en el barrio de Pera, \
donde vivían numerosos europeos. Pascal Sébah fotografía los monumentos, los \
paisajes y los habitantes del Imperio, abre una sucursal en El Cairo y proporciona las \
fotografías de un álbum oficial sobre los trajes populares de Turquía, preparado para \
la Exposición Universal de Viena en 1873. Tras su muerte, en 1886, su hijo Jean \
Pascal Sébah se asocia en 1888 con el francés Policarpe Joaillier: la razón social \
pasa a ser Sébah & Joaillier. El estudio vende a los viajeros vistas numeradas y tituladas \
de Constantinopla, de sus mezquitas, de sus palacios, de sus fuentes y del Bósforo, \
así como retratos y escenas de la vida cotidiana. Trabaja también para la \
corte otomana. Sus copias, conservadas hoy en numerosas bibliotecas y \
museos, constituyen una fuente valiosa para la historia de Estambul y de sus \
monumentos."""
style = """
Las vistas del estudio aúnan la nitidez documental con una composición cuidada, heredada \
de la pintura de paisaje: puntos de vista elevados, perspectivas profundas, luz \
pareja. Pensadas para los viajeros, están numeradas, tituladas en francés, lengua \
internacional de la época, y vendidas por unidades o en álbumes. Fijaron para \
Europa la imagen de una Constantinopla a la vez bizantina y otomana."""

[[artistes]]
nom = "Samuel Bourne"
vie = "Muckleston (Staffordshire, Inglaterra), 30 de octubre de 1834 – Nottingham, 24 de abril de 1912"
biographie = """
Hijo de un granjero de Staffordshire, Samuel Bourne trabaja primero como empleado de \
banco en Nottingham, a la vez que practica la fotografía como aficionado; se hace \
notar a finales de los años 1850 por sus paisajes de la región de los Lagos. En 1863, \
deja el banco y parte a la India. Instalado en Simla, la capital de verano del \
gobierno británico, al pie del Himalaya, se asocia con Charles Shepherd: \
su estudio toma el nombre de Bourne & Shepherd. Entre 1863 y 1866, realiza tres \
grandes expediciones fotográficas por el Himalaya, con decenas de porteadores \
cargados con sus cámaras, sus placas de vidrio y sus productos químicos; en \
1866, fotografía a más de 5500 metros de altitud, en el paso de Manirang. Recorre \
también las llanuras de la India del Norte, de Delhi a Agra y a Benarés, y \
Cachemira, y relata sus viajes en el British Journal of Photography. En 1870, \
regresa a Inglaterra, dirige una empresa de hilatura de algodón en Nottingham y \
abandona la fotografía por la acuarela. El estudio Bourne & Shepherd, uno de los más \
antiguos del mundo, funcionó en la India hasta 2016."""
style = """
Bourne es un paisajista en el espíritu de lo pintoresco inglés: busca puntos \
de vista equilibrados, con un primer plano de árboles o de rocas, una lámina de agua y un \
monumento o una montaña a lo lejos. Técnicamente irreprochable, domina el colodión \
húmedo en condiciones extremas. Sus miles de vistas han moldeado la imagen de la India \
en Europa, pero reflejan también la mirada del poder colonial."""

[[artistes]]
nom = "Émile Gsell"
vie = "Sainte-Marie-aux-Mines (Alto Rin), 31 de diciembre de 1838 – Saigón, 16 de octubre de 1879"
biographie = """
Nacido en Alsacia, en un valle industrial de los Vosgos, Émile Gsell se alista en \
el ejército y parte a Cochinchina, donde Francia acaba de establecerse, a comienzos de los \
años 1860. Allí descubre la fotografía y decide quedarse en el Extremo Oriente: \
instalado en Saigón, abre uno de los primeros talleres fotográficos de la colonia. \
En 1866, acompaña a Camboya al oficial de marina Ernest Doudart de Lagrée, jefe \
de la misión de exploración del Mekong, y realiza en Angkor una serie de vistas de los \
templos que figuran entre las primerísimas fotografías del sitio. Fotografía \
también Cochinchina, sus ciudades, sus canales, sus paisajes y sus habitantes, y luego \
Tonkín, al norte de Vietnam. Su taller de Saigón proporciona retratos a los colonos y \
vistas a las administraciones y a los viajeros; sus álbumes contribuyen a dar a \
conocer Indochina en Francia. Muere en Saigón en 1879, a los cuarenta años. Sus \
copias, dispersas, se conservan hoy en grandes colecciones públicas, \
en Francia y en Estados Unidos."""
style = """
Gsell es un fotógrafo documental: vistas frontales, encuadres amplios, afán de \
mostrar el conjunto de un edificio o de un paisaje. Sus copias, de tono cálido, son \
de gran sobriedad. Trabajando en condiciones difíciles, fijó el estado \
de Angkor antes de las grandes obras de despeje y restauración del siglo XX, lo \
que da a sus imágenes un valor de testimonio, aunque sirvieran también a la \
propaganda colonial."""

[[artistes]]
nom = "Louis-Émile Durandelle"
vie = "Francia, 1839 – 1917"
biographie = """
Louis-Émile Durandelle es uno de los grandes fotógrafos de arquitectura de la Francia del \
Segundo Imperio y de la Tercera República. Comienza su carrera junto a \
Hyacinthe-César Delmaet, con quien se asocia: la firma Delmaet y Durandelle \
aparece en numerosas copias. Tras la muerte de Delmaet, prosigue solo la \
actividad. Se especializa en un género entonces nuevo: la fotografía de obras. \
Durante años, sigue la construcción de la Ópera de Charles Garnier, de la que \
fotografía los cimientos, la estructura metálica, las esculturas y los decorados, \
reunidos en álbumes. Documenta también la construcción de la basílica del Sagrado Corazón, en \
Montmartre, y de numerosos edificios de París. Para la Exposición Universal de 1889, \
fotografía la torre Eiffel, desde los cimientos, en la primavera de 1887, hasta su \
conclusión. Estas series, encargadas por los contratistas, los arquitectos o el Estado, \
servían para dar cuenta del avance de las obras y conservar la memoria de las \
técnicas. Redescubiertas en el siglo XX, se conservan en particular en el museo \
de Orsay, en la Biblioteca Nacional de Francia y en el museo Getty de Los Ángeles."""
style = """
Durandelle fotografía la arquitectura en vías de hacerse más que el monumento \
acabado: andamios, grúas, vigas y obreros se convierten en sus temas. Sus vistas \
frontales, nítidas y metódicas, tomadas a menudo desde el mismo punto en fechas sucesivas, \
forman verdaderas crónicas. Su rigor, sin efecto pintoresco, fue admirado \
en el siglo XX como una estética del ingeniero."""

[[artistes]]
nom = "Antoni Gaudí"
vie = "Reus (Cataluña), 25 de junio de 1852 – Barcelona, 10 de junio de 1926"
biographie = """
Hijo de un calderero, Antoni Gaudí i Cornet crece en el campo catalán, donde \
observa largamente las plantas, los animales y las rocas; se cuenta que \
atribuía su sentido del espacio al taller de su padre, donde se daba forma a volúmenes \
en el cobre. Estudia arquitectura en Barcelona y obtiene su título en 1878. Ese \
mismo año, conoce al industrial Eusebi Güell, que se convierte en su mecenas y para quien \
construye el palacio Güell, el parque Güell y la iglesia de la Colonia Güell. Sus \
primeras obras, como la Casa Vicens, se inspiran en el arte mudéjar; inventa \
luego un estilo muy personal, nutrido de gótico y de naturaleza. En 1883, asume la \
dirección de las obras de la Sagrada Família, templo comenzado el año anterior, que \
lo ocupará hasta su muerte. A principios del siglo XX, construye en Barcelona la Casa \
Batlló, y después la Casa Milà, llamada la Pedrera. A partir de 1914, se consagra \
exclusivamente a la Sagrada Família, viviendo casi como un asceta. Atropellado por un tranvía \
el 7 de junio de 1926, muere tres días después y es enterrado en la cripta de la \
basílica. Siete de sus obras están inscritas en el patrimonio mundial de la Unesco."""
style = """
Gaudí rechaza el ángulo recto y la fachada plana: sus edificios ondulan, se inclinan y \
se cubren de mosaicos de cerámica rota, el trencadís. Busca sus formas \
con ayuda de maquetas hechas de cadenetas lastradas, para encontrar arcos que se sostienen \
sin contrafuertes. Su obra, en la encrucijada del modernismo catalán, del gótico y de \
la observación de la naturaleza, sigue siendo una de las más originales de la historia de \
la arquitectura."""
