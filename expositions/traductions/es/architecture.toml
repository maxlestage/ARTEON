[exposition]
ordre = 290
nom_court = "Arquitectura"
mouvement = "La arquitectura del mundo, en imágenes"
cadre = "noir"
couleur = "#3f4f5c"
titre = "Construir el mundo: la arquitectura en grabados, dibujos y fotografías"
artiste = "Piranesi, Boullée, Frith, Bourne, Gsell, Durandelle, Gaudí…"
dates = "1750–1912"
accroche = "Exposición virtual · Sir John Soane's Museum, Londres"
introduction = """
Antes del cine y del avión, fue a través de la imagen como Europa descubrió los grandes \
edificios del mundo: grabados, dibujos de arquitectos y después copias fotográficas \
traídas de Egipto, de Turquía, de la India o de Camboya. La visita reúne nueve imágenes, desde las \
cárceles soñadas de Piranesi hasta el cenotafio imaginado por Boullée para Newton, desde las pirámides \
de Guiza hasta los templos de Angkor, desde las obras de la torre Eiffel hasta la fachada de la \
Casa Batlló de Gaudí. El edificio se inspira en el Sir John Soane's Museum, de Londres, la \
casa-museo de un arquitecto coleccionista: un vestíbulo, una alta sala bajo \
cúpula, una biblioteca roja, un salón amarillo y un gabinete de pinturas."""
vitrine = "cenotaphe-newton.jpg"

[musee]
nom = "Sir John Soane's Museum"
ville = "Londres, Reino Unido"
architecte = "Sir John Soane"
construction = "1792–1824"
presentation = """
El arquitecto John Soane, autor del Banco de Inglaterra, compra en 1792 una casa de \
Lincoln's Inn Fields, en Londres, y luego las dos casas vecinas, que reconstruye \
una tras otra hasta 1824. Hace de ellas a la vez su vivienda, su estudio y un \
museo para sus alumnos: vaciados antiguos, fragmentos de capiteles, maquetas, cuadros \
y miles de dibujos de arquitectura se amontonan en ellas hasta bajo los lucernarios. En 1833, \
una ley votada por el Parlamento le permite legar el conjunto a la nación, con la condición \
de que nada sea cambiado de sitio; el museo abre a su muerte, en 1837, y la entrada sigue \
siendo gratuita. Se descubren en él espacios asombrosos: la cúpula, iluminada desde \
lo alto, sobre la cripta donde reposa el sarcófago del faraón Seti I; la sala \
de los cuadros, cuyas paredes se abren como postigos para mostrar las series de \
Hogarth y dibujos de Piranesi; la biblioteca pintada de rojo pompeyano; los \
salones amarillos de la primera planta."""
ici = """
El edificio de ARTEON retoma, más simple y más grande, el encadenamiento de las estancias \
de la casa de Soane. Se entra por el sur en el vestíbulo de Lincoln's Inn Fields, \
de paredes color piedra, que se abre a la cúpula: una sala cuadrada de catorce \
metros de altura, donde las cárceles de Piranesi y el cenotafio de Boullée enmarcan la puerta del \
norte. Al oeste, la biblioteca roja, color de Pompeya, reúne Roma, Egipto y \
Bizancio; al este, el salón amarillo acoge a los fotógrafos viajeros, de la India a \
Camboya. Al norte, el gabinete de pinturas muestra la arquitectura moderna: la torre Eiffel \
en obras y la Casa Batlló."""

