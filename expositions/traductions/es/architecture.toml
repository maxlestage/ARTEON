[[oeuvres]]
titre = "El puente levadizo (Cárceles imaginarias, lámina VII)"
artiste = "Giovanni Battista Piranesi"
annee = "hacia 1745–1750, plancha retocada en 1761"
image = "prisons-pont-levis.jpg"
cadre = "estampe"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Giovanni_Battista_Piranesi_-_The_Drawbridge,_plate_VII_from_the_series_Carceri_d'Invenzione_-_Google_Art_Project.jpg"
technique = "Aguafuerte, unos 55 × 41 cm"
collection = "Cooper Hewitt, Smithsonian Design Museum, Nueva York"
note = "Escaleras, pasarelas y puentes levadizos se enredan bajo bóvedas sin fin: una cárcel nacida de la imaginación de Piranesi, convertida en una de las imágenes más célebres de la arquitectura soñada."
description = """
La mirada se hunde en un espacio inmenso, cerrado por todos lados, del que no se ven ni el \
techo ni el suelo. Macizos pilares de piedra sostienen arcos, galerías y \
escaleras que suben, giran y se cruzan en todas direcciones. En el centro, \
un puente levadizo de madera, suspendido de cuerdas y poleas, une dos pasarelas. \
A la derecha, una torre redonda con una ventana enrejada se aferra a la mampostería, con una \
gran linterna colgada de su flanco. Por todas partes, diminutas siluetas caminan por los \
puentes, se asoman a las balaustradas o suben los escalones, aplastadas por la escala del \
edificio. Abajo a la izquierda, una gran rueda erizada de púas y unas cadenas hacen \
pensar en instrumentos de suplicio."""
evocation = """
Piranesi no graba una cárcel real: inventa un lugar imposible, donde las \
perspectivas se contradicen y donde nunca se sabe de dónde viene la luz. Se ha visto \
en estas Cárceles imaginarias un homenaje a la grandeza de la arquitectura romana, de la que \
admiraba las bóvedas y los cimientos colosales, pero también una pesadilla de \
encierro, donde el hombre se pierde en un espacio que él mismo ha construido. El tema procedía \
del teatro: los decoradores de ópera de la época, como los Bibiena, pintaban \
mazmorras grandiosas para la escena. Piranesi hace de él un asunto por derecho propio. En el siglo XIX, \
los románticos leyeron en ellas el vértigo del sueño; en el XX, se las ha acercado a los \
espacios sin salida de Kafka o a las escaleras imposibles de Escher."""
histoire = """
Llegado de Venecia a Roma en 1740, el joven Piranesi, formado como arquitecto, apenas encuentra \
edificios que construir y se vuelve hacia el grabado. Hacia 1749-1750, publica \
en casa del marchante Giovanni Bouchard una serie de catorce láminas sin título ni \
leyenda, las Invenzioni capric di carceri, «invenciones caprichosas de cárceles». \
En 1761, ya célebre, retoma todas las láminas: las oscurece, les añade \
cadenas, inscripciones, escaleras, y graba dos nuevas. Esta segunda \
edición, titulada Carceri d'invenzione, cuenta con dieciséis láminas. Los cobres, conservados \
tras su muerte por su hijo, están hoy en Roma, en el Istituto centrale per la \
grafica, heredero de la antigua Calcografía, que ha tirado de ellos numerosas pruebas. \
Esta ingresó en el museo Cooper Hewitt, en Nueva York, en 1959."""
facture = """
El aguafuerte permite a Piranesi dibujar con la punta en el barniz que cubre el \
cobre, con la libertad de un croquis: los trazos corren rápidos, se superponen, \
dejan zonas apenas esbozadas. Para la segunda edición, hace morder el ácido \
más profundamente y multiplica los rayados cruzados, de modo que las sombras se vuelven \
densas y casi negras. La composición, en contrapicado, yuxtapone varios puntos \
de vista, herencia de los decorados de teatro, y hace parecer el espacio más alto de lo que \
podría ser. Las pequeñas figuras, indicadas con unos pocos trazos, dan la escala."""
details = [
  "El puente levadizo, en el centro, sujeto por cuerdas que descienden de poleas.",
  "La torre redonda de la derecha, con su ventana enrejada y su gran linterna.",
  "Los diminutos prisioneros o guardianes que caminan por las pasarelas.",
  "La rueda erizada de púas, abajo a la izquierda.",
  "La escalera que se enrosca en espiral en torno a un pilar, a la izquierda del centro.",
]
themes = ["arquitectura imaginaria", "prisión", "vértigo", "grabado", "sueño"]
anecdote = """
En sus Confesiones de un inglés comedor de opio (1821), Thomas De Quincey cuenta que \
el poeta Coleridge le había descrito unos grabados de Piranesi llamados los «Sueños»: \
escaleras sin fin, que compara con las visiones del opio. Son las Cárceles."""
salle = 2
mur = "nord"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "Vista del anfiteatro Flavio, llamado el Coliseo (Vistas de Roma)"
artiste = "Giovanni Battista Piranesi"
annee = "1776"
image = "colisee.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Veduta_dell'Anfiteatro_Flavio_detto_il_Colosseo,_from-_'Vedute_di_Roma'_(Views_of_Rome)_MET_DP104275.jpg"
technique = "Aguafuerte; hoja de 76,2 × 101,6 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El Coliseo visto desde lo alto, como desde un globo: Piranesi desvela de una sola mirada las gradas en ruinas, la arena y el doble recinto."
description = """
El Coliseo ocupa toda la hoja, visto desde arriba y en diagonal, como si el grabador se hubiera \
elevado sobre Roma. En primer plano, la parte derrumbada del recinto deja ver \
el grosor de los muros, las arcadas superpuestas y los corredores abovedados que sostenían las \
gradas. Al fondo, el recinto exterior, intacto en toda su altura, dibuja una \
curva regular de arcadas. Las gradas de piedra han desaparecido: solo quedan las \
bóvedas que las sostenían, invadidas de maleza. En el centro de la arena, vasta y \
vacía, se alza una cruz; en todo el contorno, pequeñas capillas jalonan el perímetro. \
Unos paseantes diminutos cruzan la explanada. Abajo, dos cartelas grabadas \
dan el título y una leyenda señalada con letras."""
evocation = """
Piranesi quiere mostrar la grandeza de la Roma antigua, pero también lo que el tiempo ha \
hecho de ella. El Coliseo aparece como un paisaje más que como un edificio: una montaña \
hueca, roída, donde la vegetación recupera sus derechos. La vista desde arriba, que nadie \
podía tener entonces, sirve también para explicar: hace comprender de un vistazo \
cómo estaba construido el anfiteatro, y la leyenda designa los lugares de los cónsules, \
de los senadores, de los caballeros o de las mujeres. Para Piranesi, que defendía la \
superioridad de los romanos sobre los griegos en un vivo debate de su tiempo, estas ruinas \
probaban el genio de los constructores romanos. La cruz y las capillas recuerdan que \
el anfiteatro se había convertido en un lugar de oración dedicado a los mártires cristianos."""
histoire = """
Las Vedute di Roma, o Vistas de Roma, son la empresa de toda una vida: Piranesi graba \
las primeras láminas hacia 1748 y trabaja en ellas hasta su muerte, en 1778, hasta un \
total de unas 135 vistas. Vendidas por unidades en su tienda romana, son \
compradas por los viajeros del Grand Tour, jóvenes aristócratas ingleses, franceses o \
alemanes llegados a completar su educación en Italia, que las llevan a su país como \
recuerdos. Moldean durante mucho tiempo la imagen que Europa se hace de Roma: \
algunos visitantes confiesan su decepción ante unas ruinas menos grandiosas que en \
los grabados. Esta vista a vuelo de pájaro, una de las últimas de la serie, está fechada en \
1776. La prueba expuesta pertenece al Metropolitan Museum de Nueva York desde 1959."""
facture = """
La lámina, de formato muy grande, está grabada al aguafuerte con una precisión \
de arquitecto: cada arcada, cada bóveda, cada piedra derrumbada está descrita. \
Piranesi refuerza los contrastes haciendo morder más profundamente las sombras del \
primer plano, mientras el fondo permanece claro, lo que acentúa la profundidad. El \
punto de vista elevado, casi imposible, le permite mostrar a la vez el interior y \
el exterior del monumento. Los paseantes, voluntariamente minúsculos, lo engrandecen \
todavía más."""
details = [
  "La cruz en el centro de la arena, rodeada por las pequeñas capillas de un vía crucis.",
  "Las letras grabadas sobre el edificio, que remiten a la leyenda al pie de la hoja.",
  "La parte derrumbada del recinto, en primer plano, que muestra la estructura en sección.",
  "La maleza y los arbustos que crecen sobre las bóvedas.",
  "La firma «Cav. Piranesi F.», abajo a la derecha: Piranesi era caballero.",
]
themes = ["roma", "ruinas", "antigüedad", "grand tour", "grabado"]
anecdote = """
En 1749, el papa Benedicto XIV consagró el Coliseo a la memoria de los mártires cristianos y \
hizo instalar en él un vía crucis: de ahí la cruz y las capillas de la arena. Fueron \
retiradas en el siglo XIX, durante las excavaciones de los subsuelos."""
salle = 3
mur = "ouest"
place = 2
largeur = 3.0

[[oeuvres]]
titre = "Cenotafio de Newton, corte (efecto de noche en el interior)"
artiste = "Étienne-Louis Boullée"
annee = "1784"
image = "cenotaphe-newton.jpg"
cadre = "estampe"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Étienne-Louis_Boullée,_Cénotaphe_de_Newton_-_04_-_Coupe,_représentation_de_jour_avec_effet_intérieur_de_nuit.jpg"
technique = "Pluma, tinta y aguada sobre papel"
collection = "Biblioteca Nacional de Francia, Departamento de Estampas, París"
note = "Para honrar a Isaac Newton, Boullée imagina una esfera hueca de unos ciento cincuenta metros: de día, su bóveda perforada de agujeros se convierte en un cielo estrellado."
description = """
El dibujo muestra el monumento cortado en dos, como una maqueta seccionada por la mitad. \
En el centro, una inmensa esfera hueca está engastada en un zócalo circular de dos \
gradas, cuyas terrazas están plantadas con hileras de cipreses. El interior de la \
esfera es enteramente negro, sembrado de estrellas y de un astro más brillante: es la \
bóveda vista desde dentro. En lo más bajo, en el punto más profundo, un diminuto sarcófago \
reposa sobre una tarima, rodeado de unas pocas siluetas apenas visibles. Un largo \
corredor en pendiente conduce a él desde el exterior. Fuera, el cielo es claro y nuboso: \
es de día. En el grosor del zócalo, a cada lado, se abre una galería abovedada en \
semicírculo."""
evocation = """
Newton, muerto en 1727, había explicado con la gravitación el movimiento de los astros. \
Boullée le ofrece una tumba a la medida del universo: la esfera, forma perfecta, sin \
principio ni fin, representa el propio cosmos. El visitante, descendido al fondo de esta \
cáscara, estaría solo ante el sarcófago y un cielo artificial, sobrecogido por lo que los \
filósofos del siglo XVIII llamaban lo sublime: una emoción hecha de admiración y \
de espanto ante la inmensidad. El proyecto es también un homenaje de la Ilustración a la ciencia: \
la arquitectura ya no sirve en él a un rey o a un dios, sino a un sabio. Se ha calificado este género \
de proyecto de arquitectura «parlante»: la forma del edificio dice por sí sola lo que \
celebra."""
histoire = """
Boullée dibuja este proyecto en 1784, a los cincuenta y seis años, cuando casi había dejado de \
construir para dedicarse a la enseñanza y a proyectos teóricos. Nadie se lo \
encargó, y nunca se pensó en construirlo: una esfera de ese \
tamaño superaba con mucho los medios técnicos de la época. Un cenotafio es además \
una tumba vacía, pues Newton reposa en la abadía de Westminster. El dibujo debía ilustrar \
el tratado de Boullée, Arquitectura, ensayo sobre el arte, donde defiende una arquitectura de \
grandes volúmenes geométricos, hecha para conmover. El texto quedó manuscrito. A su muerte, \
en 1799, el arquitecto legó sus dibujos a la nación; se conservan en la \
Biblioteca Nacional. Redescubiertos en el siglo XX, le han dado su gloria póstuma, y \
el ensayo se publicó por fin en 1953."""
facture = """
Boullée trabaja a la aguada: extiende tinta diluida con el pincel, en capas más o \
menos oscuras, para modelar los volúmenes con la luz más que con el trazo. \
Opone violentamente el negro profundo del interior al gris claro del cielo exterior; \
se jactaba de haber inventado una «arquitectura de las sombras». Las estrellas no son más que \
pequeños puntos claros sobre el fondo negro. La composición es estrictamente simétrica, \
reducida a unas pocas formas puras: círculo, semicírculos, rectángulos. Los cipreses, árboles \
de los cementerios, y los pequeños personajes dan la escala colosal del monumento."""
details = [
  "El diminuto sarcófago de Newton, en el fondo de la esfera.",
  "Las estrellas, más apretadas arriba a la derecha, como una vía láctea.",
  "Las hileras de cipreses en las terrazas del zócalo.",
  "El largo corredor de suave pendiente que conduce a la tumba.",
  "El pequeño sello redondo de la Biblioteca Nacional, abajo en el centro.",
]
themes = ["esfera", "newton", "ilustración", "arquitectura utópica", "cosmos", "sublime"]
anecdote = """
Boullée había previsto también el efecto inverso: otro dibujo de la misma serie muestra el \
cenotafio de noche, con el cielo exterior negro, mientras el interior está iluminado por un \
gran globo luminoso suspendido en el centro de la esfera, como un sol."""
salle = 2
mur = "nord"
place = 1
largeur = 3.2

[[oeuvres]]
titre = "Las pirámides de Guiza, vistas desde el suroeste"
artiste = "Francis Frith"
annee = "hacia 1857 (copia hacia 1865)"
image = "pyramides-gizeh.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Francis_Frith_-_Pyramids_Of_El-Geezeh_(From_The_Southwest)_-_Google_Art_Project.jpg"
technique = "Copia sobre papel albuminado, 38,1 × 48,9 cm"
collection = "Los Angeles County Museum of Art (LACMA)"
note = "Las tres grandes pirámides alineadas en el desierto, fotografiadas sobre una placa de vidrio gigante por un viajero inglés que hizo tres veces el viaje a Egipto."
description = """
Tres pirámides se alzan más allá de una extensión de arena y guijarros. En el centro, \
la más alta en apariencia es la de Kefrén, que conserva en su cima un resto de \
su revestimiento de caliza lisa. A la derecha, más lejos, se eleva la de Keops, la \
Gran Pirámide. A la izquierda, la más pequeña, la de Micerino, está precedida de tres \
pirámides más modestas, llamadas de las reinas. En primer plano, sobre un montículo oscuro \
cubierto de guijarros, dos hombres están sentados en el suelo; un poco más lejos, una montura \
y su guardián esperan. El cielo, muy claro, es casi blanco. La luz rasante \
hace resaltar las hiladas de piedra, escalón tras escalón, en los flancos de las \
pirámides."""
evocation = """
Para el público inglés de la década de 1850, estas imágenes son una revelación: por \
primera vez se ven las pirámides tal como son, sin la interpretación de un \
grabador. Frith, que también escribía, acompañaba sus fotografías con textos donde \
insistía en su veracidad. Las pequeñas figuras del primer plano dan la escala y \
recuerdan que estas montañas de piedra fueron levantadas por hombres, hace más de \
cuatro mil quinientos años. El contraste entre el desierto casi abstracto y la \
geometría perfecta de las pirámides hace de la imagen una meditación sobre el tiempo y la \
permanencia, tema caro a la Inglaterra victoriana, que veía en Egipto el alba de \
la civilización."""
histoire = """
Francis Frith, que hizo fortuna en el comercio en Liverpool, parte a Egipto en \
1856 con su material fotográfico. Regresa dos veces, hasta 1859, remonta \
el Nilo hasta Nubia, y luego visita Palestina y Siria. Sus fotografías se \
publican en Londres en libros y álbumes ilustrados con verdaderas copias pegadas en las \
páginas, como Egypt and Palestine Photographed and Described. Cosechan un gran \
éxito y existen en varios formatos, entre ellos estas grandes copias realizadas a partir de \
negativos de vidrio de unos 40 por 50 centímetros. Esta fue sin duda tirada \
unos años después de la toma, hacia 1865. Pertenece hoy al museo \
de arte del condado de Los Ángeles."""
facture = """
Frith utiliza el colodión húmedo, procedimiento exigente: la placa de vidrio debe ser \
embadurnada, sensibilizada, expuesta y revelada en unos minutos, antes de que la capa \
se seque. En el calor del desierto, el éter del colodión se evapora muy deprisa, y \
hay que trabajar en una tienda-laboratorio sofocante. La copia se hace por contacto \
sobre un papel albuminado, untado con clara de huevo, que da detalles muy finos. La \
composición, muy simple, superpone tres bandas horizontales, el primer plano oscuro, \
la arena clara y el cielo blanco, sobre las que se recortan los triángulos de las \
pirámides."""
details = [
  "La cima de la pirámide de Kefrén, que conserva un resto de su revestimiento original.",
  "Las tres pequeñas pirámides de las reinas, delante de la de Micerino, a la izquierda.",
  "La montura y su guardián, minúsculos en medio de la arena.",
  "Los dos hombres sentados en primer plano, que dan la escala.",
]
themes = ["egipto", "pirámides", "desierto", "viaje", "fotografía"]
anecdote = """
De regreso en Inglaterra, Frith funda en Reigate la empresa F. Frith & Co., que \
fotografía miles de ciudades y pueblos británicos y vende sus vistas, \
y luego postales, hasta su cierre en 1971."""
salle = 3
mur = "nord"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Interior de Santa Sofía, Constantinopla"
artiste = "Sébah & Joaillier"
annee = "finales de los años 1880"
image = "sainte-sophie.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Sainte_Sophie_LCCN2004667900.jpg"
technique = "Copia sobre papel albuminado"
collection = "Biblioteca del Congreso, Washington"
note = "Bajo la cúpula de Justiniano, convertida en mezquita en 1453, los grandes medallones de caligrafía otomana: una vista vendida a los viajeros de paso por Constantinopla."
description = """
La fotografía está tomada desde un punto elevado, a la entrada de la nave, frente al ábside. La \
mirada abarca el inmenso espacio: arriba, el borde de la cúpula central, perforado por una \
corona de ventanas; debajo, una semicúpula, y luego otras más pequeñas, que \
encajan hasta el fondo. A cada lado, dos pisos de arcadas sobre columnas se abren \
a las naves laterales y a las tribunas. Grandes discos oscuros llevan, en letras \
doradas, nombres escritos en árabe. Abajo, se distinguen tribunas de madera y \
mármol y decenas de lámparas suspendidas de largos hilos, que descienden casi \
hasta el suelo. En las pechinas, bajo la cúpula, aparecen ángeles de alas \
desplegadas. En la parte inferior de la imagen, el estudio ha inscrito «Sainte Sophie 127»."""
evocation = """
Santa Sofía resume por sí sola la historia de Constantinopla: gran iglesia del \
Imperio bizantino durante nueve siglos, y luego mezquita imperial de los sultanes otomanos. La \
fotografía muestra esta doble vida: la arquitectura querida por Justiniano y los ángeles \
bizantinos de las pechinas, pero también las adiciones otomanas, medallones, púlpito, tribunas \
y lámparas. Para los viajeros europeos de finales del siglo XIX, cada vez más \
numerosos, una imagen así fijaba el recuerdo de un lugar célebre tanto en toda la cristiandad \
como en el mundo musulmán. Se lee en ella sobre todo el asombro ante la cúpula, que \
parece flotar sobre una corona de luz, como ya decían los autores \
bizantinos."""
histoire = """
La iglesia de Santa Sofía, la «Sabiduría divina», se construye de 532 a 537 por orden \
del emperador Justiniano, a cargo de dos sabios, Antemio de Trales e Isidoro de Mileto. En \
1453, cuando el sultán Mehmed II toma Constantinopla, se convierte en mezquita y recibe \
poco a poco sus minaretes. De 1847 a 1849, el sultán Abdülmecid la hace restaurar por los \
arquitectos ticineses Gaspare y Giuseppe Fossati: es entonces cuando se cuelgan los ocho \
grandes medallones caligrafiados por Kazasker Mustafa İzzet Efendi, con los nombres de Dios, del \
Profeta, de los cuatro primeros califas y de los dos nietos del Profeta. El estudio \
Sébah & Joaillier vendía esta vista, numerada 127, a los visitantes de paso. Esta copia \
se conserva en la Biblioteca del Congreso, en Washington."""
facture = """
Fotografiar un interior tan vasto y oscuro era un reto: hacía falta una larga \
exposición para que la débil luz de las ventanas impresionara la placa de vidrio. El \
fotógrafo eligió un punto de vista alto y un objetivo bastante amplio para hacer caber \
en el encuadre las arcadas laterales y el encaje de las cúpulas, en estricta \
simetría. La copia albuminada ha adquirido con el tiempo ese tono amarillo dorado, típico de las \
fotografías de la época, que armoniza extrañamente con el oro de los mosaicos."""
details = [
  "Los medallones de Alá y de Mahoma, a ambos lados del ábside.",
  "Los serafines, ángeles de seis alas, en las pechinas bajo la cúpula.",
  "Las lámparas de aceite, suspendidas muy bajas de largos hilos.",
  "La tribuna de columnillas, a la izquierda, añadida en época otomana.",
  "La inscripción «Sainte Sophie 127», dejada por el estudio al pie de la imagen.",
]
themes = ["bizancio", "islam", "cúpula", "estambul", "caligrafía"]
anecdote = """
Santa Sofía ha cambiado varias veces de estatus: transformada en museo en 1934 por el \
gobierno de Mustafa Kemal Atatürk, volvió a ser mezquita en 2020, aunque \
sigue abierta a los visitantes fuera de las horas de oración."""
salle = 3
