[exposition]
ordre = 60
nom_court = "Ilustración"
mouvement = "Rococó y neoclasicismo"
cadre = "baroque"
couleur = "#8e3b4f"
titre = "El siglo de las Luces, del rococó al neoclasicismo"
artiste = "Watteau, Boucher, Fragonard, Chardin, David, Ingres…"
dates = "1717–1814"
accroche = "Exposición virtual · Wallace Collection, Londres"
introduction = """
En el siglo XVIII, la pintura pasa de la gracia del rococó, con sus fiestas galantes, sus desnudos nacarados y sus juegos amorosos, al rigor del neoclasicismo, que exalta la virtud antigua en vísperas de la Revolución. Diez lienzos siguen este viraje, de Watteau a Fragonard, de Chardin a Canaletto, Gainsborough y Vigée Le Brun, hasta David e Ingres. El edificio se inspira en la Wallace Collection de Londres, la residencia de Hertford House, donde salones de paredes coloridas se ordenan en torno a un patio cubierto por una cristalera. La última sala, alta y solemne, evoca la sala Daru del Louvre y sus grandísimos formatos de David."""
vitrine = "escarpolette.jpg"

[musee]
nom = "Wallace Collection"
ville = "Londres, Reino Unido"
construction = "abierta en 1900"
presentation = """
Hertford House, al norte de Oxford Street, es un palacete de finales del siglo XVIII construido para el duque de Manchester, que dio su nombre a la plaza que lo bordea, Manchester Square. Los marqueses de Hertford hacen de él su residencia londinense y, a lo largo de cuatro generaciones, acumulan en ella cuadros, muebles, porcelanas de Sèvres y armaduras; el cuarto marqués, que vive en París, reúne lo esencial de las obras maestras del siglo XVIII francés. Su heredero, Sir Richard Wallace, amplía la casa para instalar la colección, que su viuda lega a la nación en 1897. El museo abre en 1900, con la condición de que la colección permanezca íntegra y sin añadidos. Los salones, con paredes tapizadas de telas de colores, conservan el ambiente de una residencia, y el patio interior está cubierto por una cristalera desde 2000. Allí se ven El columpio de Fragonard, Watteau, Boucher, Canaletto y El caballero risueño de Frans Hals."""
ici = """
El edificio de ARTEON retoma el plano de Hertford House: un patio cubierto en el centro y salones a su alrededor. Se entra por el sur, en el patio cubierto, cuadrado y de diez metros de altura bajo su cristalera. Al oeste se abre el salón I · Las fiestas galantes, de paredes rosa pálido; al este, el salón II · La vida y los rostros, de paredes verde tierno, dos estancias de seis metros de altura. Al norte, la gran sala neoclásica, de más de veintitrés metros de ancho y diez de alto, con paredes rojo pálido, evoca la sala Daru del Louvre y acoge a David e Ingres."""

