[[oeuvres]]
titre = "La gran odalisca"
artiste = "Jean-Auguste-Dominique Ingres"
annee = "1814"
image = "grande-odalisque.jpg"
technique = "Óleo sobre lienzo, 91 × 162 cm"
collection = "Museo del Louvre, París"
note = "Encargada por la reina de Nápoles, hermana de Napoleón: un desnudo recostado, alargado, de una perfección de línea que desconcertó a sus contemporáneos."
description = """
Una mujer desnuda, tendida sobre un diván de terciopelo azul, nos da la espalda y mira por encima del hombro, impasible. Sus cabellos están recogidos en un turbante de seda rayada, adornado con una joya y una borla dorada. Con la mano derecha sostiene lánguidamente un abanico de plumas de pavo real; sus piernas cruzadas se alargan hasta el borde derecho del lienzo. A su alrededor, telas preciosas: una pesada cortina azul bordada a la derecha, cojines, una seda amarilla y una sábana blanca arrugada a la izquierda, una piel bajo sus piernas. Abajo a la derecha, un pebetero y una larga pipa; abajo a la izquierda, joyas. El fondo es oscuro, sin ventana ni profundidad."""
evocation = """
La odalisca, mujer del harén, pertenece al imaginario oriental que fascina a la Europa de principios del siglo XIX. Ingres nunca vio Oriente: compone un mundo soñado a partir de relatos de viaje, grabados y objetos. Se ha subrayado la ambigüedad de esta imagen: el cuerpo se ofrece a la mirada, pero el rostro permanece frío y distante. El cuadro prolonga la tradición de los desnudos reclinados, de Giorgione a Tiziano, y la pose de Madame Récamier pintada por David, pero desplaza el ideal antiguo hacia el exotismo. Las críticas feministas, a partir de los años setenta, han visto en él un ejemplo de la mirada masculina sobre el cuerpo de las mujeres, mientras que otros insisten en la búsqueda formal de Ingres: la belleza de la línea antes que la verdad anatómica."""
histoire = """
Instalado en Roma desde 1806, Ingres recibe de Carolina Murat, hermana de Napoleón y reina de Nápoles, el encargo de un desnudo destinado a hacer pareja con otro desnudo del pintor, la Durmiente de Nápoles, adquirido por su marido. Pinta el lienzo en 1814, pero la caída del Imperio y la de los Murat, en 1815, impiden la entrega. Ingres lo expone en el Salón de 1819, en París, donde es mal recibido: los críticos juzgan las proporciones falsas, la espalda demasiado larga, el modelado demasiado liso y los colores fríos. El cuadro pasa después por varias colecciones particulares. El Louvre lo adquiere en 1899, en una época en que Ingres se ha convertido en una referencia para los pintores modernos, de Degas a Matisse."""
facture = """
Ingres, alumno de David, reivindica la primacía del dibujo. La línea continua que recorre del cuello a los dedos de los pies cuenta más que la anatomía: la espalda está alargada, el brazo estirado, la cadera ensanchada, para crear una curva perfecta. El modelado es muy suave, casi sin sombras, y la piel parece pulida como el esmalte. La pincelada es invisible, la superficie lisa. La piel nacarada se destaca sobre el azul frío de la cortina y del diván, calentado por la seda amarilla y las rayas del turbante. Los accesorios, plumas, pedrería, telas, están pintados con una minuciosidad que debe mucho a los maestros flamencos y a Rafael, su modelo absoluto."""
details = [
  "La espalda desmesuradamente larga, que forma una sola curva del cuello a la cadera.",
  "El abanico de plumas de pavo real, sostenido lánguidamente por la mano derecha.",
  "El turbante de seda rayada, sujeto por una joya y prolongado por una borla dorada.",
  "A la derecha, la larga pipa y el pebetero, accesorios del Oriente soñado.",
  "Abajo a la derecha, la firma de Ingres y la fecha, 1814, seguidas de la palabra «Rom».",
]
themes = ["desnudo", "orientalismo", "línea", "harén", "neoclasicismo"]
anecdote = """
En 1989, el colectivo de artistas feministas Guerrilla Girls manipuló la Gran odalisca, dotándola de una cabeza de gorila, en un cartel que preguntaba si las mujeres debían estar desnudas para entrar en el Metropolitan Museum de Nueva York, donde la mayoría de los desnudos eran femeninos y muy pocos artistas eran mujeres."""
