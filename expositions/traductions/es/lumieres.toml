[[oeuvres]]
titre = "Mr. y Mrs. Andrews"
artiste = "Thomas Gainsborough"
annee = "hacia 1750"
image = "mr-mrs-andrews.jpg"
technique = "Óleo sobre lienzo, 69,8 × 119,4 cm"
collection = "National Gallery, Londres"
note = "Una joven pareja de propietarios de Suffolk posa ante sus campos: retrato y paisaje reunidos en un mismo lienzo."
description = """
Bajo un gran roble, a la izquierda, una joven pareja posa al aire libre. Robert Andrews, de pie, con tricornio y chaqueta clara, una escopeta bajo el brazo, se apoya con indolencia en el respaldo de un banco de hierro forjado de volutas verdes; su perro de caza levanta la cabeza hacia él. En el banco, su esposa Frances, con vestido de seda azul pálido y sombrero de paja, se sienta muy erguida, con las manos sobre las rodillas. A la derecha, toda una mitad del lienzo está ocupada por sus tierras: un campo de trigo segado con gavillas doradas, prados donde pacen ovejas, setos, bosquecillos y, a lo lejos, entre los árboles, una torre de iglesia. El cielo de verano se carga de grandes nubes grises y blancas."""
evocation = """
El cuadro celebra un matrimonio y una propiedad. Los Andrews no se muestran en un salón, sino en medio de los campos que hacen su fortuna: el trigo segado, las ovejas, los setos de una hacienda bien cuidada. Se ha visto en él la imagen de la gentry terrateniente inglesa y de la revolución agrícola, con su trigo sembrado en hileras regulares. En Modos de ver (Ways of Seeing, 1972), el crítico John Berger lo convirtió en el ejemplo mismo de la pintura como afirmación de la propiedad, una lectura que otros historiadores han matizado. La escopeta y el perro recuerdan también el derecho de caza, reservado a los propietarios. Gainsborough, que prefería el paisaje al retrato, encuentra aquí la manera de reunir ambos géneros."""
histoire = """
Robert Andrews y Frances Carter se casan en noviembre de 1748 en Sudbury, la ciudad natal de Gainsborough, en Suffolk. El retrato se pinta poco después, hacia 1750, cuando el joven pintor, de regreso de Londres, busca clientela entre las familias de la región. La hacienda representada es la de Auberies, cerca de Sudbury, propiedad de Robert Andrews. El cuadro permanece después en la familia durante dos siglos, casi desconocido del público. Revelado con motivo de una exposición dedicada a Gainsborough en Ipswich en 1927, es vendido por los descendientes en 1960 y adquirido por la National Gallery de Londres, donde se ha convertido en una de las imágenes más familiares de la pintura inglesa."""
facture = """
Gainsborough combina dos tradiciones. Las figuras, pequeñas y algo rígidas, pertenecen a la «conversation piece», el retrato de grupo de cuerpo entero y pequeño formato, de moda en la Inglaterra de la época, que el pintor había conocido en Londres junto al grabador francés Hubert Gravelot. El paisaje, por su parte, está observado con un esmero que viene de los holandeses, como Jacob van Ruisdael, a quien Gainsborough había copiado. Los colores son frescos: el azul del vestido responde al azul grisáceo del cielo, el oro de las gavillas al verde de los prados. La pincelada es fina y minuciosa en los rostros y las telas, más libre en las nubes."""
details = [
  "Sobre las rodillas de Frances, una zona que quedó inacabada, un simple boceto marrón.",
  "El banco de hierro forjado, de volutas rococó pintadas de verde.",
  "Las gavillas de trigo doradas, en primer plano a la derecha.",
  "El perro de caza que alza los ojos hacia su amo.",
  "Las diminutas ovejas que pacen en el prado, al fondo.",
]
themes = ["retrato", "paisaje", "campo", "matrimonio", "propiedad"]
anecdote = """
Nadie sabe qué pensaba pintar Gainsborough sobre las rodillas de Frances Andrews, dejadas en estado de boceto: se ha propuesto un libro, un abanico, un ave cazada por su marido, o incluso un hijo por venir."""
salle = 3
mur = "sud"
place = 1
