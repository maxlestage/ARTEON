[[oeuvres]]
titre = "La peregrinación a la isla de Citera"
artiste = "Antoine Watteau"
annee = "1717"
image = "pelerinage-cythere.jpg"
technique = "Óleo sobre lienzo, 129 × 194 cm"
collection = "Museo del Louvre, París"
note = "La obra de ingreso de Watteau en la Academia Real, para la cual se inventó una categoría nueva: la «fiesta galante»."
description = """
A orillas de un lago, bajo grandes árboles dorados, una decena de parejas vestidas de seda se disponen a abandonar una colina. A la derecha, al pie de un busto de Venus enguirnaldado de rosas, una pareja sentada se demora todavía: el hombre habla al oído de su compañera, que baja los ojos hacia su abanico, mientras un pequeño Amor sentado sobre un carcaj la tira de la falda. Un poco más allá, un hombre ayuda a una mujer a levantarse; luego un peregrino, bastón en mano, arrastra a su compañera de vestido amarillo, que lanza una última mirada hacia atrás. Así bajan las parejas hacia la orilla, a la izquierda, donde espera una barca dorada rodeada de una nube de Amores. Al fondo, montañas azuladas se funden en un cielo nacarado."""
evocation = """
El tema procede del teatro: en Las tres primas de Dancourt, estrenada en 1700, unos jóvenes parten en peregrinación hacia Citera, la isla de Venus, para encontrar el amor. Watteau lo convierte en una ensoñación. Desde un célebre artículo del historiador Michael Levey, la escena suele leerse como una partida: los peregrinos han honrado a Venus y abandonan la isla a su pesar, de ahí la mirada atrás de la joven. Las tres parejas de la derecha serían entonces los momentos sucesivos de un mismo relato, de la persuasión a la partida. Bajo la elegancia asoma una melancolía: el placer es fugaz, la luz es la de un final de jornada. Tras la austeridad de los últimos años de Luis XIV, muerto en 1715, el cuadro encarna el nuevo gusto de la Regencia por la intimidad, la música y el juego amoroso."""
histoire = """
Admitido por la Academia Real de Pintura y Escultura en 1712, Watteau debía entregar una obra de ingreso cuyo tema se le dejaba elegir. La hace esperar cinco años: el lienzo no se presenta hasta el 28 de agosto de 1717. La Academia lo recibe, pero en el acta el título «la peregrinación a la isla de Citera» aparece tachado y sustituido por «una fiesta galante»: se crea para Watteau una categoría que no existía. El éxito es tal que el pintor realiza poco después una segunda versión, más cargada, adquirida más tarde por Federico II de Prusia y conservada hoy en el castillo de Charlottenburg, en Berlín. El lienzo de 1717 permanece en las colecciones de la Academia, nacionalizadas durante la Revolución, y entra así en el Louvre."""
facture = """
Watteau pinta deprisa, en capas finas y transparentes, con una pincelada ligera y vibrante heredada de Rubens, a quien había estudiado en el palacio del Luxemburgo. Los colores cambiantes de las sedas, rosas, amarillos, azules, se destacan sobre un paisaje de ocres y verdes difuminados. La composición sigue una diagonal que desciende de derecha a izquierda, del busto de Venus hasta la barca, y el friso de las figuras dibuja una línea ondulante. Los personajes proceden de sus cuadernos: Watteau dibujaba sin cesar, a la sanguina y a la piedra negra, y recurría a esas hojas para componer sus cuadros."""
details = [
  "A la derecha, el busto de Venus coronado de rosas, medio oculto entre el follaje.",
  "El pequeño Amor sentado sobre un carcaj, que tira de la falda de la joven del abanico.",
  "El bastón de peregrino y la corta esclavina del hombre de rosa, en el centro.",
  "La joven del vestido amarillo, que se vuelve por última vez hacia la colina.",
  "A la izquierda, la barca de proa dorada y la ronda de Amores que se eleva en el cielo.",
]
themes = ["fiesta galante", "amor", "viaje", "melancolía", "teatro"]
anecdote = """
Según una anécdota que se cuenta a menudo, los alumnos de David, a comienzos del siglo XIX, juzgaban la pintura de Watteau tan frívola que se divertían bombardeando este cuadro con bolitas de miga de pan."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.94

[[oeuvres]]
titre = "Diana saliendo del baño"
artiste = "François Boucher"
annee = "1742"
image = "diane-bain.jpg"
technique = "Óleo sobre lienzo, 57 × 73 cm"
collection = "Museo del Louvre, París"
note = "Presentada en el Salón de 1742: la diosa cazadora, en reposo tras el baño, se convierte en pretexto para celebrar la carne nacarada."
description = """
En un claro, a orillas de un arroyo, dos jóvenes desnudas descansan sobre telas tendidas en la hierba. Sentada a la derecha sobre un paño azul, Diana, reconocible por la pequeña media luna que lleva en el cabello, cruza las piernas y mira su pie; un hilo de perlas se desliza entre sus dedos. A su lado, una compañera arrodillada, con una cinta azul en el pelo, se inclina hacia el suelo. En torno a ellas, los atributos de la caza: un carcaj rojo lleno de flechas abajo a la izquierda y, a la derecha, un arco y la caza abatida, aves y una liebre. A la izquierda, dos perros de caza se acercan al agua. Los juncos, los árboles y un rincón de cielo pálido forman un fondo de verdor azulado."""
evocation = """
Diana es la diosa virgen de la caza, esquiva y temida: en la mitología, el cazador Acteón, que la había sorprendido en el baño, fue convertido en ciervo y devorado por sus propios perros. Boucher no retiene nada de esta amenaza. Del mito solo conserva algunos atributos y pinta un momento de reposo íntimo, en el que el espectador se convierte en un Acteón sin peligro. El tema antiguo sirve de pretexto para el desnudo, que la clientela aristocrática aprecia en sus gabinetes y pequeños aposentos. Se ha visto en ella la esencia misma del gusto rococó: la gracia antes que la grandeza, el placer de los ojos antes que la lección moral. Es precisamente lo que le reprochará Diderot, que denuncia en sus Salones de la década de 1760 el artificio y la afectación de Boucher."""
histoire = """
Boucher expone el cuadro en el Salón de 1742, en el Louvre, cuando ya es uno de los pintores más solicitados de París. Recibido en la Academia Real en 1734, trabaja también para la manufactura de tapices de Beauvais y para las residencias reales; unos años más tarde se convertirá en el pintor favorito de Madame de Pompadour. El pequeño formato del lienzo conviene a un aficionado privado, y el cuadro pasa después de colección en colección. Tras la Revolución, el gusto cambia: el neoclasicismo rechaza a Boucher, juzgado frívolo, y sus obras pierden valor. El Louvre no adquiere este lienzo hasta mediados del siglo XIX, cuando los aficionados redescubren el arte del siglo XVIII. Se ha convertido en la obra más célebre del pintor."""
facture = """
Boucher trabaja la carne en tonos nacarados, blancos rosados y marfil, que hace destacar por contraste con el azul intenso del paño y los verdes oscuros del fondo. La luz viene de la izquierda y resbala sobre los cuerpos sin sombras duras. El dibujo es flexible, todo en curvas: la línea de las piernas cruzadas, la redondez de los hombros, los pliegues de la tela. Los accesorios, caza, flechas, perlas, están pintados con la precisión de una naturaleza muerta. El paisaje, en cambio, se trata con más libertad, casi como un decorado de teatro, a la manera de los modelos de tapiz que Boucher dibujaba para Beauvais."""
details = [
  "La pequeña media luna, emblema de Diana, prendida en su cabello.",
  "El hilo de perlas que se desliza entre los dedos de la diosa.",
  "Abajo a la izquierda, el carcaj rojo lleno de flechas con plumas blancas.",
  "La firma de Boucher, abajo en el centro, sobre una piedra a la orilla del agua.",
  "La caza dispuesta a la derecha, pintada con la precisión de una naturaleza muerta.",
]
themes = ["mitología", "desnudo", "caza", "baño", "rococó"]
anecdote = """
Pierre-Auguste Renoir, que había empezado como pintor de porcelana, amaba este cuadro más que ningún otro: contaba que fue el primer lienzo que lo cautivó en el Louvre y que le había sido fiel toda su vida."""
salle = 2
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Los felices azares del columpio"
artiste = "Jean-Honoré Fragonard"
annee = "1767–1768"
image = "escarpolette.jpg"
technique = "Óleo sobre lienzo, 81 × 64,2 cm"
collection = "Wallace Collection, Londres"
note = "Encargada por un aficionado galante, la imagen más célebre del rococó: una joven en un columpio y un enamorado escondido entre los rosales."
description = """
En un parque frondoso, bajo una bóveda de árboles atravesada por una luz dorada, una joven de vestido de seda rosa se lanza en un columpio. El movimiento levanta sus enaguas y hace volar uno de sus zapatos, que sale disparado hacia la izquierda. Abajo a la izquierda, medio recostado en un macizo de rosales, un joven tiende el brazo y su sombrero hacia ella, con la mirada alzada bajo sus faldas. A la derecha, en la sombra, un hombre de más edad tira de las cuerdas del columpio sin ver nada de la escena. Dos estatuas parecen observar: a la izquierda, un Amor sobre un pedestal, con un dedo sobre los labios; bajo el columpio, dos pequeños amorcillos abrazados a un delfín. Abajo a la derecha, un perrito blanco ladra."""
evocation = """
Todo el cuadro es un guiño amoroso. El zapato que vuela, el sombrero tendido, las flores arrugadas: los historiadores del arte han señalado en él una serie de símbolos galantes, y el propio columpio evocaba desde hacía tiempo la inconstancia y el juego de la seducción. El Amor que pide silencio convierte al espectador en cómplice. El hombre mayor que empuja el columpio sin ver nada, a quien suele tomarse por el marido, es el burlado clásico de las comedias de la época. Se ha visto en este lienzo la cumbre del libertinaje elegante del final del reinado de Luis XV, un arte de placer y complicidad, concebido para un aficionado y no para el público del Salón. Es también lo que la generación de David, en nombre de la virtud, condenará."""
histoire = """
El origen del cuadro se conoce por el Diario del autor dramático Charles Collé, que recoge en 1767 el relato del pintor Gabriel-François Doyen: un hombre de la corte le había pedido que pintara a su amante en un columpio empujado por un obispo, él mismo situado de modo que viera las piernas de la bella. Doyen, pintor de historia, se negó y sugirió a Fragonard, que aceptó. Tradicionalmente se identifica al comitente con el barón de Saint-Julien, recaudador general del clero. En el cuadro, el obispo se ha convertido en un hombre mayor de traje oscuro. Tras pasar por varias colecciones, el lienzo es adquirido en 1865 por el cuarto marqués de Hertford, en París. Forma parte del legado de Lady Wallace a la nación británica en 1897, origen de la Wallace Collection."""
facture = """
Fragonard, alumno de Chardin y después de Boucher, pinta con una libertad de pincel asombrosa. El vestido rosa, en el centro de la composición, está hecho de pinceladas vivas y ligeras que hacen estremecerse la seda; recibe toda la luz, mientras que los dos hombres permanecen en un claroscuro verdoso. El follaje está trabajado en masas espumosas, casi abstractas de cerca. La composición descansa sobre una diagonal que va del joven de la izquierda al viejo de la derecha, pasando por el columpio, como el recorrido de un péndulo. Una restauración concluida en 2021 devolvió al cuadro sus colores vivos y la profundidad de su cielo."""
details = [
  "El zapato rosa que vuela hacia la izquierda, por encima del macizo de flores.",
  "La estatua del Amor, con el dedo sobre los labios, inspirada en una escultura de Falconet.",
  "El sombrero que el joven tiende hacia la joven.",
  "El anciano en la sombra, a la derecha, que sujeta las cuerdas sin ver nada.",
  "El perrito blanco, abajo a la derecha, que ladra.",
]
themes = ["amor", "juego", "jardín", "libertinaje", "rococó"]
anecdote = """
El título con el que se conoce el cuadro en Francia procede del grabado que de él hizo Nicolas de Launay, publicado en 1782 con el nombre «Los felices azares del columpio»: fue este grabado el que hizo célebre la imagen mucho más allá del círculo del comitente."""
salle = 2
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "La raya"
artiste = "Jean Siméon Chardin"
annee = "hacia 1725–1726"
image = "raie.jpg"
technique = "Óleo sobre lienzo, 114,5 × 146 cm"
collection = "Museo del Louvre, París"
note = "Una raya abierta en canal, un gato al acecho, ostras: la naturaleza muerta que hizo entrar a Chardin en la Academia Real en 1728."
description = """
Sobre una mesa de piedra, en una cocina oscura, una raya cuelga de un gancho, en el centro, con su cara blanca vuelta hacia nosotros y el vientre abierto, rojo y nacarado. Su boca y sus orificios nasales dibujan un extraño rostro, casi humano. A la izquierda, un gato de pelo erizado apoya las patas sobre un montón de ostras abiertas, atraído por la comida, junto a un manojo de cebolletas. Bajo la raya, dos pescados. A la derecha, un mantel blanco arrugado, un cazo de cobre, una botella, una jarra de gres vidriado verde oscuro, una espumadera y un cuchillo cuyo mango sobresale de la mesa. El fondo es un muro de piedra marrón, sin ventana ni decorado, donde la luz se agarra por momentos."""
evocation = """
El cuadro juega con un contraste impactante entre la belleza de la pintura y la crudeza del tema. La raya eviscerada, que parece mirarnos haciendo una mueca, tiene algo de inquietante; se ha visto en ella una meditación sobre la carne y la muerte, en la tradición de las naturalezas muertas de cocina flamencas, pero también un realismo de una franqueza nueva. El gato, vivo y nervioso, introduce una pequeña tensión: acecha las ostras y quizá lo vuelque todo. Para un joven pintor procedente del artesanado parisino, el lienzo es también una demostración: prueba que un tema humilde, situado en lo más bajo de la jerarquía de los géneros, puede rivalizar con la gran pintura."""
histoire = """
En 1728, Chardin, todavía desconocido, expone varios cuadros en la Exposición de la Juventud, una muestra al aire libre celebrada en la plaza Dauphine de París el día del Corpus Christi. Algunos académicos los advierten. El 25 de septiembre de 1728, Chardin presenta La raya y El aparador a la Academia Real de Pintura y Escultura, que lo admite y lo recibe el mismo día como «pintor con talento para los animales y las frutas», un favor rarísimo. Los dos lienzos se convierten en sus obras de ingreso. Permanecen colgados en las salas de la Academia, entonces instalada en el Louvre, donde generaciones de alumnos pueden estudiarlos, y pasan al museo con la Revolución."""
facture = """
Chardin construye sus formas mediante capas gruesas, aplicadas y retocadas, sin alisar la superficie: la materia permanece visible, granulosa, casi modelada en la carne de la raya. Toma de flamencos y holandeses el tema de cocina, pero lo depura: pocos objetos, elegidos y dispuestos en pirámide en torno a la raya. Los colores son apagados, marrones, grises, ocres, realzados por los rojos del pescado y el blanco resplandeciente del mantel. La luz unifica el conjunto y hace vibrar las texturas: pelaje del gato, cobre, gres, ostra húmeda."""
details = [
  "El «rostro» de la raya, formado por su boca y sus orificios nasales.",
  "El gato erizado, a la izquierda, que apoya una pata sobre las ostras.",
  "El cuchillo cuyo mango sobresale del borde de la mesa, hacia nosotros.",
  "Los reflejos del cobre del cazo, detrás del mantel blanco.",
  "La espumadera agujereada, en el extremo derecho, medio cortada por el borde del cuadro.",
]
themes = ["naturaleza muerta", "cocina", "animales", "realismo", "gato"]
anecdote = """
Más de siglo y medio después de Chardin, el joven Henri Matisse, entonces alumno en París, copió La raya en el Louvre. Esta copia se conserva hoy en el Museo Matisse de Le Cateau-Cambrésis, su ciudad natal."""
salle = 3
mur = "nord"
place = 2
largeur = 1.46

[[oeuvres]]
titre = "El patio del cantero"
artiste = "Giovanni Antonio Canal, dit Canaletto"
annee = "hacia 1725"
image = "cour-tailleurs-pierre.jpg"
technique = "Óleo sobre lienzo, 123,8 × 162,9 cm"
collection = "National Gallery, Londres"
note = "Ni palacio ni fiesta: una obra en un barrio corriente de Venecia, pintada con una verdad casi fotográfica."
description = """
En primer plano se extiende el campo San Vidal, una plaza de Venecia convertida en obra: bloques de piedra blanca, en bruto o ya tallados, cubren el suelo en torno a un cobertizo de tablas donde trabajan los canteros. Más allá corre el Gran Canal, surcado de góndolas, y en la otra orilla se alzan la iglesia de Santa Maria della Carità y su alto campanario puntiagudo. A derecha e izquierda, altas casas de ladrillo rojo, con las contraventanas abiertas, ropa tendida en las ventanas y tiestos de flores en los balcones. La vida del barrio se adivina por doquier: una mujer asomada a un balcón, otra a su ventana, y abajo a la izquierda una madre que acude corriendo hacia un niño pequeño caído en el suelo."""
evocation = """
Canaletto pinta aquí una Venecia sin aparato, lejos de las ceremonias y de la plaza de San Marcos. Se ha visto en ella una de sus obras más personales: la mirada se detiene en el trabajo cotidiano, el desorden de una obra y la vida familiar de un barrio, con una ternura que recuerda a la pintura de género holandesa. La propia obra habla de una ciudad en perpetua reconstrucción: las piedras están sin duda destinadas a la iglesia de San Vidal, muy cercana, cuya fachada se rehacía entonces. El contraste entre la luz fría del cielo y el calor de los ladrillos, entre la animación del primer plano y la calma de la otra orilla, confiere a la escena una poesía discreta, sin pintoresquismo forzado."""
histoire = """
El cuadro data de los comienzos de Canaletto, antes de que los viajeros ingleses del Grand Tour le reclamaran sobre todo los monumentos famosos de la ciudad; se ignora para quién fue pintado. El punto de vista se toma desde el campo San Vidal, allí donde el puente de la Accademia aún no existía. En la otra orilla, el campanario de la Carità se derrumbó en 1744, y los edificios de la antigua cofradía albergan desde principios del siglo XIX las Gallerie dell'Accademia. El lienzo perteneció al coleccionista inglés sir George Beaumont, pintor aficionado y protector de jóvenes artistas, que ofreció su colección a la nación para contribuir a la creación de la National Gallery de Londres; el cuadro ingresa en ella en 1828."""
facture = """
Canaletto, hijo de un pintor de decorados de teatro, domina a la perfección la perspectiva. Preparaba sus vistas con dibujos tomados del natural, quizá con ayuda de una cámara óptica, y luego las recomponía en el taller. La pincelada es precisa pero viva: los bloques de piedra están modelados por la luz, la madera del cobertizo se representa tabla por tabla, las pequeñas figuras se colocan con un pincel vivaz. El cielo ocupa casi la mitad del lienzo, cargado de nubes grises que atraviesa una luz rasante. Las sombras proyectadas, nítidas y largas, cruzan la plaza en diagonal."""
details = [
  "Abajo a la izquierda, una madre que acude corriendo hacia su hijo caído en el suelo.",
  "El alto campanario puntiagudo de la Carità, que se derrumbará en 1744.",
  "Los canteros trabajando en el cobertizo de tablas, a la derecha.",
  "La ropa blanca que se seca en las ventanas de la casa de la derecha.",
  "Las góndolas amarradas a lo largo del Gran Canal, en el centro.",
]
themes = ["venecia", "ciudad", "trabajo", "vida cotidiana", "veduta"]
anecdote = """
El puente de la Accademia, construido en 1854, une hoy el campo San Vidal con la otra orilla, aproximadamente en el lugar donde Canaletto pintó las góndolas: la plaza, liberada de su obra, se ha convertido en uno de los pasos más transitados de Venecia."""
salle = 3
