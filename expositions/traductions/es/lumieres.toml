[[oeuvres]]
titre = "Madame Vigée Le Brun y su hija Julie"
artiste = "Élisabeth Vigée Le Brun"
annee = "1789"
image = "vigee-le-brun-fille.jpg"
technique = "Óleo sobre tabla, 130 × 94 cm"
collection = "Museo del Louvre, París"
note = "Pintado pocos meses antes de la Revolución: el abrazo de una madre y su hija, vestidas «a la griega»."
description = """
Sobre un fondo liso gris pardo, una joven sentada estrecha entre sus brazos a una niña pequeña que se acurruca contra ella, con la mejilla pegada a la suya. La madre, la propia artista, lleva un sencillo vestido blanco a la antigua que deja un hombro al descubierto, un chal rojo y oro anudado a la cintura y una cinta roja en sus cabellos castaños rizados. Sobre sus rodillas se extiende un paño verde oliva. Su hija Julie, con un vestido azul, rodea con un brazo el cuello de su madre. Los dos rostros se tocan y miran al espectador: el de la madre, sereno y sonriente, el de la niña, más travieso. Ningún accesorio, ningún decorado: todo se concentra en el abrazo."""
evocation = """
El cuadro celebra la ternura materna, valor puesto en alza a finales del siglo XVIII, en particular bajo la influencia de Rousseau, que invitaba a las madres a criar ellas mismas a sus hijos. Vigée Le Brun se representa no como pintora, sin pinceles ni paleta, sino como madre, una elección audaz para una artista que debía defender sin cesar su condición profesional. Con frecuencia se ha visto en él un eco de las Vírgenes con el Niño de Rafael, a quien admiraba: el abrazo y la composición piramidal recuerdan a la Madonna della seggiola. El vestido blanco y la cinta siguen la moda «a la griega» que la pintora contribuía a lanzar, en consonancia con el naciente gusto neoclásico."""
histoire = """
Vigée Le Brun pinta este segundo retrato doble con su hija en 1789, tres años después de una primera versión, también en el Louvre, que había causado sensación en el Salón de 1787. Se encuentra entonces en la cima de su carrera: retratista oficial de María Antonieta, miembro de la Academia Real desde 1783. Pero su cercanía a la reina la hace sospechosa. A principios de octubre de 1789, cuando la familia real es conducida por la fuerza de Versalles a París, abandona la capital con Julie, disfrazada, en una diligencia rumbo a Italia. Comienza entonces un exilio de doce años, de Roma a San Petersburgo. El cuadro, que permaneció en Francia, pertenece hoy al Louvre, que conserva las dos versiones."""
facture = """
La pintora construye una composición piramidal, cerrada sobre sí misma por los brazos entrelazados. El fondo neutro, sin profundidad, hace resaltar las carnaciones claras, modeladas con suavidad, sin contornos duros. Los colores son pocos y francos: el blanco del vestido, el rojo de la cinta y del chal, el azul del vestido de Julie, el verde oliva del paño. La tabla de madera, lisa, permite un acabado muy esmerado. La sencillez de las prendas, inspiradas en la antigüedad, rompe con las sedas y los polvos del rococó y anuncia la estética neoclásica."""
details = [
  "La cinta roja anudada en los rizos castaños de la madre.",
  "El chal rojo y oro, con flecos, que cae sobre el paño verde.",
  "Las dos mejillas que se tocan y las dos miradas vueltas hacia nosotros.",
  "El hombro desnudo de la madre, como en una estatua antigua.",
  "Las finas líneas verticales del fondo: las juntas de las tablas del soporte.",
]
themes = ["retrato", "maternidad", "autorretrato", "ternura", "antigüedad"]
anecdote = """
En 1787, la primera versión de este retrato doble dio que hablar por un detalle: la pintora sonríe en ella dejando ver los dientes, lo que un cronista del Salón juzgó una afectación contraria a todas las reglas de la pintura y de los buenos modales."""
