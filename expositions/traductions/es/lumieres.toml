[[artistes]]
nom = "Antoine Watteau"
vie = "Valenciennes, 10 de octubre de 1684 – Nogent-sur-Marne, 18 de julio de 1721"
biographie = """
Hijo de un maestro tejador de Valenciennes, ciudad que se había vuelto francesa poco antes de su nacimiento, Antoine Watteau se forma primero con un pintor local y luego llega a París hacia 1702. Allí vive pobremente, copiando en serie cuadros de devoción, antes de entrar con Claude Gillot, pintor de escenas de teatro y de la comedia italiana, y después con el decorador Claude Audran, conserje del palacio del Luxemburgo, donde descubre el ciclo de María de Médici pintado por Rubens. Segundo en el premio de Roma en 1709, nunca irá a Italia. Admitido por la Academia Real en 1712, no es recibido en ella hasta 1717, con La peregrinación a la isla de Citera. El financiero Pierre Crozat lo aloja y le abre su colección de dibujos. Aquejado de tuberculosis y de humor inquieto, cambia sin cesar de alojamiento. Reside en Londres en 1719-1720 y después pinta para su amigo el marchante Edme-François Gersaint un célebre rótulo de tienda. Muere a los treinta y seis años. Su amigo Jean de Jullienne hace grabar después lo esencial de su obra, que se difunde por toda Europa."""
style = """
Watteau inventa la fiesta galante: parejas elegantes con trajes de seda, a veces con disfraces de teatro, conversan, tocan música o se cortejan en parques soñados. Su pincelada rápida y ligera, heredada de Rubens y de los venecianos, hace brillar las telas y funde los paisajes en una bruma dorada. Sus innumerables dibujos a los tres lápices alimentan sus composiciones. Tras la gracia asoma una melancolía que constituye su singularidad. Abre el camino al rococó, de Boucher a Fragonard."""

[[artistes]]
nom = "François Boucher"
vie = "París, 29 de septiembre de 1703 – París, 30 de mayo de 1770"
biographie = """
Hijo de un dibujante de motivos de bordado, François Boucher pasa brevemente por el taller de François Lemoyne y trabaja como grabador, en particular para la recopilación de los dibujos de Watteau publicada por Jean de Jullienne. Ganador del gran premio de la Academia en 1723, parte a sus expensas a Italia, donde permanece de 1728 a 1731. De regreso en París, es recibido en la Academia Real en 1734. Su carrera es entonces fulgurante: proporciona modelos a la manufactura de tapices de Beauvais, dirige después la de los Gobelinos, dibuja decorados de ópera y modelos para la porcelana de Vincennes y de Sèvres, y decora las residencias reales de Versalles, Fontainebleau y Marly. La marquesa de Pompadour, favorita de Luis XV, se convierte en su protectora; de ella pinta sus retratos más célebres. En 1765 es nombrado primer pintor del rey y director de la Academia. Pero el gusto cambia, y Diderot ataca en sus Salones un arte que juzga artificial y licencioso. Boucher muere en París en 1770, dejando una obra inmensa."""
style = """
Boucher es el pintor por excelencia del rococó. Pinta escenas mitológicas, pastorales y desnudos de carnes nacaradas, en una paleta clara de rosas, azules y blancos. Sus composiciones, todo curvas y arabescos, tienen una gracia decorativa pensada para los interiores, las boiseries y los tapices. Su virtuoso dibujo se difunde por toda Europa mediante el grabado. Criticado por Diderot y rechazado por el neoclasicismo, es rehabilitado en el siglo XIX."""

[[artistes]]
nom = "Jean-Honoré Fragonard"
vie = "Grasse, 5 de abril de 1732 – París, 22 de agosto de 1806"
biographie = """
Nacido en Grasse en una modesta familia de comerciantes, Jean-Honoré Fragonard llega niño a París. Colocado con un notario, muestra tal afición por el dibujo que lo llevan con Chardin y luego con Boucher. Gran premio de la Academia en 1752, reside en la Academia de Francia en Roma de 1756 a 1761; allí dibuja los jardines de la villa de Este, en Tívoli, junto a su amigo Hubert Robert, y viaja con el abate de Saint-Non. Su gran cuadro de historia, Coreso y Calírroe, le vale ser admitido por la Academia en 1765 y es comprado para el rey. Sin embargo, abandona la carrera oficial para trabajar para aficionados privados: escenas galantes, figuras de fantasía, paisajes. En 1769 se casa con Marie-Anne Gérard, miniaturista originaria de Grasse; la hermana de esta, Marguerite Gérard, se convierte en su alumna. El ciclo de Los progresos del amor, encargado por Madame du Barry para su pabellón de Louveciennes, le es devuelto. Durante la Revolución, apoyado por David, participa en la organización del Museo, el futuro Louvre. Pasado de moda, muere casi olvidado en 1806."""
style = """
Fragonard pinta con un virtuosismo y una rapidez asombrosos. Su pincelada libre y fogosa trata las telas, los follajes y los rostros en unos pocos toques, en particular en sus célebres figuras de fantasía. Heredero de Boucher, admirador de Rubens y de los venecianos, da al rococó un impulso más sensual y más vivo, entre libertinaje, escenas familiares y paisajes luminosos. Olvidado en el siglo XIX y después redescubierto, aparece como un precursor de la pintura libre de los impresionistas."""

[[artistes]]
nom = "Jean Siméon Chardin"
vie = "París, 2 de noviembre de 1699 – París, 6 de diciembre de 1779"
biographie = """
Hijo de un carpintero parisino que fabricaba billares, entre otros para el rey, Jean Siméon Chardin se forma con los pintores de historia Pierre-Jacques Cazes y Noël-Nicolas Coypel, pero elige pronto los géneros considerados menores. Miembro de la Academia de San Lucas, la corporación de los pintores, es recibido en la Academia Real en 1728 como pintor de animales y de frutas. En la década de 1730 se vuelca hacia las escenas de género: interiores burgueses, criadas, niños jugando a las cartas o haciendo pompas de jabón. En 1740 presenta al rey Luis XV La bendición de la mesa. Sus cuadros, difundidos por el grabado, se vuelven muy populares. Viudo en 1735, se vuelve a casar en 1744. Alojado en el Louvre a partir de 1757, es tesorero de la Academia y, durante más de diez años, encargado de colgar los cuadros del Salón. Al final de su vida, con la vista debilitada, se vuelca hacia el pastel y realiza autorretratos impresionantes, tocado con un gorro y con anteojos. Diderot lo admira sin reservas. Muere en el Louvre en 1779."""
style = """
Chardin pinta objetos humildes, jarras, frutas, caza, y escenas domésticas silenciosas, sin anécdota ni moraleja subrayada. Su materia es espesa, granulosa, aplicada con pinceladas superpuestas que dan a las cosas una presencia casi táctil. Sus composiciones, sencillas y equilibradas, se bañan en una luz suave que unifica los tonos. Lejos de la gracia decorativa del rococó, su arte de la verdad y del recogimiento marcó profundamente a Cézanne, Matisse y la naturaleza muerta moderna."""

[[artistes]]
nom = "Giovanni Antonio Canal, dit Canaletto"
vie = "Venecia, octubre de 1697 – Venecia, 19 de abril de 1768"
biographie = """
Hijo del pintor de decorados de teatro Bernardo Canal, de donde viene su apodo de «pequeño Canal», Giovanni Antonio Canal trabaja primero con su padre para las óperas de Venecia y de Roma. En Roma, hacia 1720, descubre las vistas de ruinas y de monumentos y decide consagrarse a la veduta, la vista de ciudad. De regreso en Venecia, pinta para aficionados venecianos y luego, cada vez más, para los ricos viajeros ingleses del Grand Tour, que quieren llevarse a casa un recuerdo de la ciudad. El mercader Joseph Smith, futuro cónsul británico en Venecia, se convierte en su agente y su principal coleccionista; su colección será comprada en 1762 por el rey Jorge III. Cuando la guerra de Sucesión austríaca agota el flujo de visitantes, Canaletto parte a Londres en 1746 y reside allí cerca de diez años, pintando el Támesis, Westminster y las mansiones aristocráticas. De vuelta en Venecia, no es admitido en la Academia veneciana hasta 1763. Su sobrino y alumno Bernardo Bellotto prolonga su arte hasta Dresde y Varsovia."""
style = """
Canaletto es el maestro de la veduta. Combina una perspectiva rigurosa, heredada de los decorados de teatro, con una observación minuciosa de los edificios, los barcos y la multitud. Se ayudaba sin duda de una cámara óptica para sus estudios, pero recomponía libremente sus vistas en el taller. Sus primeros lienzos, de cielos nubosos y sombras contrastadas, son los más libres; los más tardíos, de una claridad cristalina, más sistemáticos. Fijó para siempre la imagen de Venecia."""

[[artistes]]
nom = "Thomas Gainsborough"
vie = "Sudbury (Suffolk), bautizado el 14 de mayo de 1727 – Londres, 2 de agosto de 1788"
biographie = """
Hijo de un comerciante de paños de Sudbury, en Suffolk, Thomas Gainsborough parte a Londres hacia los trece años para aprender el oficio. Allí frecuenta al grabador francés Hubert Gravelot y el ambiente artístico de Saint Martin's Lane, y restaura paisajes holandeses para unos marchantes. En 1746 se casa con Margaret Burr, vuelve después a Sudbury y se establece luego en Ipswich, donde retrata a la pequeña nobleza de la región. En 1759 se instala en Bath, ciudad balnearia de moda, donde una clientela aristocrática le encarga grandes retratos de cuerpo entero; allí estudia los retratos de Van Dyck. Miembro fundador de la Royal Academy en 1768, se establece en Londres en 1774, en Schomberg House, en Pall Mall. Se convierte en uno de los retratistas preferidos de la familia real y en el gran rival de Joshua Reynolds, presidente de la Academia. Enemistado con esta por la colocación de sus cuadros, deja de exponer en ella a partir de 1784. Muere de cáncer en 1788. Durante toda su vida prefirió pintar paisajes, que sin embargo se vendían mal."""
style = """
Gainsborough tiene una pincelada de una ligereza y una libertad excepcionales: rápidos trazos transparentes que hacen vibrar sedas y follajes. Admirador de Van Dyck, da a sus retratos una elegancia aérea y sitúa de buen grado a sus modelos en la naturaleza. Sus paisajes, inspirados en los holandeses y luego en Rubens, abren el camino a Constable, su compatriota de Suffolk, y a la gran pintura de paisaje inglesa."""

[[artistes]]
nom = "Élisabeth Vigée Le Brun"
vie = "París, 16 de abril de 1755 – París, 30 de marzo de 1842"
biographie = """
Hija del pastelista Louis Vigée, que muere cuando ella solo tiene doce años, Élisabeth Vigée aprende pintura casi sola, copiando a los maestros y gracias a los consejos de artistas amigos de su padre. Adolescente, ya sostiene a su familia con sus retratos. En 1776 se casa con el marchante de cuadros Jean-Baptiste-Pierre Le Brun. A partir de 1778 pinta a la reina María Antonieta, de quien realiza una treintena de retratos. Gracias a la intervención de la reina, es recibida en la Academia Real en 1783, el mismo día que Adélaïde Labille-Guiard, aunque el número de mujeres en ella estaba limitado a cuatro. Cercana a la corte, abandona París en octubre de 1789. Su exilio la lleva a Italia, a Viena y luego a Rusia, donde reside de 1795 a 1801; en todas partes, las cortes y las academias la acogen. De regreso en Francia en 1802, viaja aún a Inglaterra y a Suiza. Publica sus Memorias al final de su vida, de 1835 a 1837, y deja unos 660 retratos y cerca de 200 paisajes."""
style = """
Vigée Le Brun es una de las grandes retratistas de su tiempo. Favorece a sus modelos sin envararlos: poses naturales, sonrisas, miradas directas, prendas sencillas y flexibles que les aconseja llevar. Su pincelada fluida y sus carnaciones luminosas deben mucho a Rubens y a Van Dyck, a quienes estudia en un viaje a Flandes. Entre la gracia del rococó y la sencillez neoclásica, inventa una imagen sensible e íntima de la mujer y de la maternidad."""

[[artistes]]
nom = "Jacques-Louis David"
vie = "París, 30 de agosto de 1748 – Bruselas, 29 de diciembre de 1825"
biographie = """
Huérfano de padre a los nueve años, Jacques-Louis David es criado por sus tíos y entra en el taller de Joseph-Marie Vien. Tras varios fracasos, obtiene el premio de Roma en 1774 y reside en Italia de 1775 a 1780; el estudio de la antigüedad y de Poussin transforma allí su arte. De regreso en París, triunfa en los Salones con Belisario en 1781, El juramento de los Horacios en 1785, La muerte de Sócrates en 1787 y Los lictores llevan a Bruto los cuerpos de sus hijos en 1789. Comprometido con la Revolución, diputado en la Convención en 1792, vota la muerte de Luis XVI, forma parte del Comité de Seguridad General y organiza las grandes fiestas revolucionarias. Encarcelado tras la caída de Robespierre, pinta después Las sabinas, concluidas en 1799, y luego se une a Bonaparte, que lo nombra primer pintor en 1804; pinta entonces La consagración de Napoleón. Proscrito como regicida al regreso de los Borbones, se exilia en Bruselas en 1816 y muere allí en 1825. Su taller formó a toda una generación: Gros, Girodet, Gérard, Ingres."""
style = """
David funda la pintura neoclásica. Contra la gracia del rococó, impone un dibujo firme, contornos nítidos, composiciones claras inspiradas en los bajorrelieves antiguos y en Poussin, y una superficie lisa donde la pincelada se borra. Sus temas exaltan la virtud cívica, el sacrificio y el heroísmo. Pintor comprometido, pone su arte al servicio de la Revolución y luego del Imperio. Por su enseñanza y sus alumnos, domina la pintura europea durante medio siglo."""

[[artistes]]
nom = "Jean-Auguste-Dominique Ingres"
vie = "Montauban, 29 de agosto de 1780 – París, 14 de enero de 1867"
biographie = """
Hijo de un pintor y escultor decorador de Montauban, también músico, Jean-Auguste-Dominique Ingres estudia en la academia de Toulouse y toca el violín en la orquesta del Capitolio: el «violon d'Ingres» («violín de Ingres») se ha convertido en una expresión. En 1797 entra en el taller de David en París. Premio de Roma en 1801, no parte hacia Italia hasta 1806, por falta de fondos. Permanece en Roma mucho más allá de su estancia oficial, viviendo en parte de retratos dibujados a la mina de plomo, y luego se establece en Florencia. Sus envíos al Salón, juzgados extraños, son mal recibidos. El éxito llega en 1824 con El voto de Luis XIII: regresa a París, abre un taller muy concurrido y se convierte en el cabeza de la escuela clásica frente a Delacroix y los románticos. Herido por la acogida dispensada al Martirio de san Sinforiano en 1834, dirige la Academia de Francia en Roma de 1835 a 1841. Colmado de honores, pinta a más de ochenta años El baño turco. Muere en París en 1867 y lega a su ciudad natal gran parte de sus dibujos."""
style = """
Ingres sitúa el dibujo por encima de todo: «el dibujo es la probidad del arte», decía. Sus figuras, de línea pura y continua, están a menudo deformadas en favor de la armonía: cuellos alargados, espaldas estiradas. El modelado es liso, la pincelada invisible, y las sedas, las joyas o las cabelleras se representan con una precisión impresionante. Heredero de David y de Rafael, es también un soñador de Oriente. Sus libertades con la anatomía fascinaron a Degas, Picasso y los pintores modernos."""
