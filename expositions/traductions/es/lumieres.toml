[[oeuvres]]
titre = "El juramento de los Horacios"
artiste = "Jacques-Louis David"
annee = "1784–1785"
image = "serment-horaces.jpg"
technique = "Óleo sobre lienzo, 330 × 425 cm"
collection = "Museo del Louvre, París"
note = "Tres hermanos juran vencer o morir por Roma: presentado en el Salón de 1785, el cuadro manifiesto del neoclasicismo."
description = """
En una sala de muros de piedra desnuda, ritmada por tres arcadas sobre columnas dóricas, tres grupos se yuxtaponen. A la izquierda, tres hermanos con casco, apretados unos contra otros, tienden el brazo con un mismo impulso. En el centro, su padre, con manto rojo, blande hacia el cielo las tres espadas que van a recibir. A la derecha, apartadas, las mujeres de la familia se desploman de dolor: Camila, hermana de los Horacios y prometida de uno de los Curiacios, y Sabina, hermana de los Curiacios y esposa de uno de los Horacios, abatidas una contra otra; tras ellas, una anciana resguarda a dos niños pequeños bajo su velo. El suelo de losas, en perspectiva, prolonga la escena hacia nosotros. Ni mobiliario ni paisaje distraen la mirada."""
evocation = """
El tema procede de la historia romana narrada por Tito Livio: bajo el rey Tulo Hostilio, Roma y Alba deciden resolver su guerra mediante un combate entre tres campeones de cada bando, los Horacios por Roma, los Curiacios por Alba. Las dos familias están unidas por matrimonios, de ahí el drama. El juramento, ausente de los textos antiguos, es una invención de David: condensa en un gesto el sacrificio del individuo a la patria. La oposición entre los hombres, tensos y rectilíneos, y las mujeres, encorvadas y abrumadas, enfrenta el deber cívico al sentimiento privado. Encargado para el rey cuatro años antes de la Revolución, el cuadro se convirtió después en un símbolo de la virtud republicana."""
histoire = """
El lienzo fue encargado en 1784 por la Dirección de los Edificios del Rey, dirigida por el conde de Angiviller, que quería fomentar una pintura de historia edificante. Para recuperar la inspiración antigua, David parte a Roma con su esposa y su alumno Jean-Germain Drouais, y allí pinta el cuadro. Expuesto primero en su taller romano, atrae a artistas y aficionados, y luego llega a París para el Salón de 1785, donde causa sensación y asegura la fama de su autor. Destinado a las colecciones reales, ingresa en el Louvre con la Revolución. Hoy está colgado allí en la sala Daru, junto a otros grandísimos formatos de David y de sus alumnos."""
facture = """
David rompe con la gracia rococó. La composición tiene un rigor geométrico: tres arcadas, tres grupos, tres espadas. Las figuras, dispuestas como en un bajorrelieve antiguo, se destacan sobre un fondo oscuro y poco profundo. El dibujo es firme, los contornos nítidos, las musculaturas escultóricas, estudiadas del modelo vivo y de la estatuaria antigua. Los colores, rojos, blancos y azules, se aplican con franqueza y la pincelada desaparece bajo una superficie lisa. Una luz lateral, procedente de la izquierda, golpea las figuras y excava fuertes sombras, en la tradición de Caravaggio y de Poussin, a quienes David había estudiado en Roma."""
details = [
  "Las tres espadas blandidas por el padre, en el punto de convergencia de la composición.",
  "Las piernas de los tres hermanos, tensas como arcos, en el mismo impulso.",
  "La rueca depositada en el suelo, a la derecha, símbolo del hogar y del trabajo de las mujeres.",
  "Las tres arcadas del fondo, una para cada grupo de personajes.",
  "La anciana, al fondo a la derecha, que resguarda a dos niños bajo su velo.",
]
themes = ["historia", "antigüedad", "patria", "sacrificio", "neoclasicismo"]
anecdote = """
Una réplica reducida del cuadro, pintada en 1786 por David con la ayuda de su alumno Anne-Louis Girodet para el conde de Vaudreuil, se conserva hoy al otro lado del Atlántico, en el Toledo Museum of Art, en Ohio."""
