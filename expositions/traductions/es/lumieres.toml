[[oeuvres]]
titre = "La muerte de Marat"
artiste = "Jacques-Louis David"
annee = "1793"
image = "mort-de-marat.jpg"
technique = "Óleo sobre lienzo, 165 × 128 cm"
collection = "Reales Museos de Bellas Artes de Bélgica, Bruselas"
note = "Pintado en los meses posteriores al asesinato del revolucionario, el 13 de julio de 1793: un mártir laico, a la manera de una Piedad."
description = """
Jean-Paul Marat acaba de morir en su bañera. Su cabeza, envuelta en un paño blanco, cae sobre su hombro, con los ojos cerrados. Su brazo derecho cuelga fuera de la bañera y sostiene aún una pluma; su mano izquierda aprieta una carta, colocada sobre una tabla cubierta con un paño verde que le sirve de escritorio. En el pecho, una herida de la que mana un hilo de sangre que tiñe el agua y la sábana blanca. En el suelo, el cuchillo ensangrentado. En primer plano a la derecha, una caja de madera lleva un tintero, una pluma, un asignado y una nota, y la inscripción «A Marat, David», como una dedicatoria grabada en una tumba. Toda la mitad superior del lienzo está vacía, de un marrón oscuro y vibrante."""
evocation = """
David transforma un asesinato en icono político. Marat, diputado montañés y periodista de El Amigo del Pueblo, es presentado como un mártir de la Revolución: muere pobre, trabajando, con la pluma en la mano. La pose del brazo caído recuerda la de Cristo muerto en los Descendimientos y las Piedades, en particular la de Caravaggio, que David conocía; se ha hablado de «Piedad revolucionaria». La nota colocada sobre la caja acompaña a un asignado destinado a una madre de familia cuyo marido murió por la patria: frente a la carta de la asesina, subraya la generosidad de la víctima. El rostro apaciguado borra la enfermedad de la piel que padecía Marat, y el vacío del fondo confiere a la escena una gravedad casi religiosa."""
histoire = """
El 13 de julio de 1793, Charlotte Corday, joven normanda cercana a los girondinos, se hace recibir en casa de Marat, en la calle de los Cordeliers, con el pretexto de denunciarle a unos conspiradores, y lo apuñala en su baño. Al día siguiente, en la Convención, un diputado pide a David, que ya había pintado a Le Peletier de Saint-Fargeau asesinado, que inmortalice a Marat; el pintor acepta y organiza también sus funerales. El cuadro se ofrece a la Convención en noviembre de 1793 y se cuelga en la sala de sesiones. Tras la caída de Robespierre, se devuelve a David en 1795. El pintor, exiliado en Bruselas bajo la Restauración, muere allí en 1825; sus descendientes donan más tarde el cuadro al museo de esa ciudad, donde ingresa a finales del siglo XIX."""
facture = """
La composición es de una sobriedad extrema: una horizontal, la de la bañera y el escritorio, una vertical, la de la caja, y un gran vacío encima. El cuerpo de Marat, vivamente iluminado, está modelado como una escultura antigua, con una palidez de mármol. El fondo, frotado con pinceladas finas y apretadas, vibra con una luz sorda, más clara a la derecha. Los objetos del primer plano, la caja de madera veteada, el papel, la pluma, están pintados con el realismo minucioso de una naturaleza muerta, casi en trampantojo. La paleta es reducida: blancos, verdes, marrones y el rojo de la sangre."""
details = [
  "La carta de Charlotte Corday, fechada el 13 de julio de 1793, en la mano de Marat.",
  "La pluma que aún sostiene la mano que cuelga fuera de la bañera.",
  "El cuchillo de mango blanco, manchado de sangre, depositado en el suelo.",
  "La inscripción «A Marat, David» sobre la caja, y más abajo «El año dos».",
  "La herida bajo la clavícula, casi discreta, y la sangre que enrojece el agua.",
]
themes = ["revolución", "muerte", "mártir", "política", "historia"]
anecdote = """
Bajo la dedicatoria, David fechó su obra «El año dos»: el calendario republicano, que hacía comenzar el año II el 22 de septiembre de 1793, acababa de ser adoptado por la Convención, en octubre, mientras él pintaba el cuadro."""
