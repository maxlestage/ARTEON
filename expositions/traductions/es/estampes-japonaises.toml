[[oeuvres]]
titre = "El actor Ōtani Oniji III en el papel del criado Edobei"
artiste = "Tōshūsai Sharaku"
annee = "1794"
image = "sharaku-oniji.jpg"
technique = "Estampa nishiki-e sobre fondo de mica negra, formato ōban, unos 38 × 25 cm"
collection = "Museo Nacional de Tokio"
note = "Un actor de kabuki en un papel de bandido, con las manos crispadas hacia delante: el más célebre de los retratos de Sharaku."
description = """
Sobre un fondo gris oscuro y centelleante, se ve a un hombre de busto, de tres cuartos, con el rostro vuelto hacia la derecha. Sus cejas negras están fruncidas, sus ojos fijan duramente a un adversario invisible, su boca se aprieta en una línea caída. Sus cabellos están recogidos en un moño apretado, con la frente rasurada de los hombres del pueblo. Lleva una prenda rayada marrón y ocre sobre un quimono negro, y lanza hacia delante ambas manos, con los dedos separados, como para agarrar o amenazar. Esas manos parecen sorprendentemente pequeñas en comparación con el rostro. En el hombro, un emblema redondo lleva el blasón del actor. A la derecha, la firma de Sharaku y, bajo ella, la marca del editor."""
evocation = """
Edobei es un criado brutal, un matón que se dispone a despojar a su víctima: Sharaku hace de él una figura de amenaza concentrada, tensa como un resorte. Pero tras el personaje, lo que muestra es al actor, con sus rasgos propios, su mandíbula, sus arrugas, lo que contrasta con los retratos aduladores de la época. Se ha supuesto a menudo que este realismo sin complacencia disgustó a los actores y a sus admiradores, y explicaría la brevedad de la carrera de Sharaku, pero no es más que una hipótesis. Para la mirada moderna, estos rostros próximos a la caricatura, de una intensidad asombrosa, figuran entre los retratos más expresivos del arte japonés."""
histoire = """
En el quinto mes de 1794, en el teatro Kawarazaki-za de Edo, Ōtani Oniji III interpreta el papel de Edobei en la obra Koi nyōbō somewake tazuna. Ese mismo mes, el editor Tsutaya Jūzaburō lanza a un artista desconocido, Sharaku, con una espectacular serie de veintiocho retratos de actores de busto sobre fondo de mica negra, entre ellos este. Diez meses después, Sharaku deja de publicar y desaparece. Olvidado en Japón, es redescubierto por los coleccionistas occidentales a finales del siglo XIX. El ejemplar del Museo Nacional de Tokio, uno de los más bellos conocidos, está clasificado como bien cultural importante de Japón."""
facture = """
El fondo está impreso con mica (kira-zuri): un polvo mineral mezclado con el color, que centellea bajo la luz y da al retrato un brillo precioso. Sharaku simplifica las formas al extremo: grandes superficies oscuras de la prenda, líneas nítidas del rostro, asimetría marcada de los ojos y la boca. Las manos, voluntariamente reducidas, acentúan la tensión del gesto. El encuadre cerrado, que corta el cuerpo a la altura de la cintura, viene de los retratos de actores de busto puestos de moda unos años antes por los artistas de la escuela Katsukawa."""
details = [
  "Las manos de dedos separados, sorprendentemente pequeñas.",
  "Las cejas fruncidas y la boca apretada hacia abajo.",
  "El centelleo del fondo de mica, al cambiar de ángulo.",
  "La firma vertical a la derecha: Tōshūsai Sharaku ga.",
]
themes = ["kabuki", "actor", "retrato", "teatro", "caricatura"]
anecdote = """
Fue un alemán, Julius Kurth, quien dio la fama a Sharaku: en un libro de 1910, lo situaba entre los mayores retratistas de la historia. Desde entonces, las pruebas de Sharaku se han convertido en unas de las más buscadas de todo el grabado japonés."""
