[[oeuvres]]
titre = "El jardín de los ciruelos en Kameido"
artiste = "Utagawa Hiroshige"
annee = "1857"
image = "pruniers-kameido.jpg"
technique = "Estampa nishiki-e (grabado en madera a color), formato ōban vertical, unos 36 × 24 cm"
collection = "Rijksmuseum, Ámsterdam"
note = "Una lámina de las Cien vistas famosas de Edo: el tronco de un viejo ciruelo corta la imagen, y el jardín en flor aparece detrás."
description = """
En primer plano, un enorme tronco de ciruelo, casi negro, atraviesa toda la imagen en diagonal; está tan cerca que se sale del encuadre por arriba y por la izquierda. De sus ramas salen unos ramilletes cubiertos de flores blancas de corazón amarillo, dibujadas una a una. Detrás se extiende el jardín: decenas de ciruelos en flor, más pequeños, una cerca de bambú y diminutos paseantes que admiran los árboles. El suelo es verde, el cielo pasa del rojo vivo, arriba, al blanco rosado cerca del horizonte. En la esquina superior izquierda, el ángulo de un tejado oscuro. Arriba a la derecha, dos cartuchos dan el nombre de la serie y el del lugar; abajo a la izquierda, la firma de Hiroshige en un cartucho rojo."""
evocation = """
La floración de los ciruelos, a finales del invierno, es en Japón la primera fiesta de la primavera, antes de la de los cerezos: se iba en familia a contemplar las flores y a respirar su perfume todavía en el frío. El ciruelo, que florece sobre una madera nudosa y casi muerta, es también desde hace mucho una imagen de la perseverancia y del renacer. Hiroshige sitúa al espectador en el propio jardín, oculto tras el árbol, como un paseante que se hubiera acercado demasiado. Se ha visto en este encuadre audaz, que corta el motivo principal y relega a los personajes a lo lejos, una de las invenciones más modernas del grabado japonés: la naturaleza ya no es un decorado, sino el tema, visto a la altura de una persona."""
histoire = """
La estampa pertenece a las Cien vistas famosas de Edo, la última gran serie de Hiroshige, publicada por el editor Uoya Eikichi de 1856 a 1858; lleva la fecha de 1857. El jardín de Kameido, al este del Sumida, era un lugar de paseo célebre: se acudía a ver el Garyūbai, el «ciruelo del dragón acostado», un árbol tan viejo que sus ramas caían hasta el suelo. Los historiadores han subrayado que la serie, iniciada poco después del gran terremoto que devastó Edo en 1855, celebra una ciudad en reconstrucción y sus placeres recobrados. Como todas las láminas de la serie, esta se tiró en numerosos ejemplares. Este se conserva en el Rijksmuseum de Ámsterdam."""
facture = """
Las Cien vistas adoptan todas el formato vertical, inusual para el paisaje. Hiroshige lleva aquí al extremo el recurso del primer plano gigante, tomado en parte de las perspectivas occidentales que conocía por las estampas «a la holandesa». El cielo está impreso en bokashi: el grabador limpiaba la tinta sobre la plancha para obtener un degradado continuo del rojo al blanco. El contraste entre el tronco oscuro, de contornos irregulares, y las flores blancas reservadas en el papel da a la imagen su fuerza."""
details = [
  "El tronco negro que se sale del encuadre a la izquierda, arriba y abajo.",
  "Los diminutos paseantes tras la cerca de bambú.",
  "El degradado del cielo, del rojo vivo al blanco rosado.",
  "Las flores blancas de corazón amarillo, dibujadas una a una.",
  "La firma de Hiroshige en el cartucho rojo, abajo a la izquierda.",
]
themes = ["primavera", "ciruelo", "jardín", "edo", "japonismo"]
anecdote = """
El Garyūbai debía su nombre, «ciruelo del dragón acostado», a sus ramas que caían al suelo y volvían a echar raíces en él, como un dragón tendido. El árbol y el jardín desaparecieron durante la gran inundación de 1910. En 1887, Van Gogh copió esta estampa al óleo."""
salle = 2
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Lluvia repentina sobre el puente Shin-Ōhashi en Atake"
artiste = "Utagawa Hiroshige"
annee = "1857"
image = "averse-ohashi.jpg"
technique = "Estampa nishiki-e, formato ōban vertical, unos 36 × 24 cm"
collection = "Brooklyn Museum, Nueva York"
note = "Una tormenta de verano sorprende a los transeúntes en el gran puente del Sumida: la imagen de la lluvia más célebre del arte japonés."
description = """
Visto desde lo alto, un largo puente de madera atraviesa la imagen en diagonal, de abajo a la izquierda hacia la derecha. Unos transeúntes se apresuran por él, encorvados bajo el aguacero: dos personas apretadas bajo un paraguas, un hombre con sombrero de paja, otros que se protegen con una estera. La lluvia cae en miles de trazos finos y oscuros que cubren toda la imagen. Sobre el río gris, un hombre de pie empuja con una pértiga una larga balsa de madera. En la otra orilla, el barrio de Atake no es más que una silueta de árboles ahogada en la bruma. Arriba, una nube negra pesa sobre la escena. Los pilares del puente, en entramado, se hunden en el agua azul oscuro del primer plano."""
evocation = """
Hiroshige capta un instante de la vida corriente de Edo: la tormenta de verano que estalla sin avisar y hace correr a todo el mundo. No hay héroe ni acontecimiento, solo anónimos sorprendidos por el tiempo, y el espectador casi tiene la impresión de mojarse. Con frecuencia se ha visto en ella una expresión del sentimiento japonés de la impermanencia: un momento fugaz, captado al vuelo, que habrá pasado en pocos minutos. El contraste entre las pequeñas siluetas apresuradas y el hombre de la balsa, solo e inmóvil en el río, se ha leído también como una meditación sobre la condición humana. Para los artistas europeos, esta lluvia dibujada con líneas fue una revelación: se podía representar el mal tiempo mismo."""
histoire = """
La estampa, fechada en 1857, pertenece a las Cien vistas famosas de Edo, publicadas por Uoya Eikichi. El puente Shin-Ōhashi, el «nuevo gran puente», cruzaba el Sumida desde 1693. El barrio de Atake, en la orilla este, tomaba su nombre del Atake maru, un inmenso navío del shogun amarrado allí durante mucho tiempo. Hiroshige tenía entonces unos sesenta años; murió al año siguiente, antes del final de la serie. Sus estampas llegaron a Europa en gran número tras la apertura de Japón, y los pintores impresionistas las coleccionaron. Este ejemplar forma parte de la serie completa de las Cien vistas conservada en el Brooklyn Museum de Nueva York."""
facture = """
La lluvia es la proeza del grabador: cientos de trazos paralelos, de una finura extrema, tallados en la madera con inclinaciones ligeramente distintas, lo que da la impresión de un aguacero oblicuo y cambiante. La nube negra está impresa en degradado, como la profundidad del río. El punto de vista picado, el puente cortado por el borde de la imagen y la ausencia de cielo despejado pertenecen a las audacias de esta serie tardía."""
details = [
  "Los dos transeúntes apretados bajo un mismo paraguas, a la izquierda del puente.",
  "Los trazos de lluvia, que no están todos inclinados del mismo modo.",
  "El hombre que empuja su balsa, solo en medio del río.",
  "La orilla de Atake, reducida a una silueta gris.",
  "El entramado de los pilares del puente, en primer plano.",
]
themes = ["lluvia", "puente", "tormenta", "edo", "japonismo"]
anecdote = """
En 1887, en París, Vincent van Gogh copió esta estampa al óleo, exagerando sus colores, y la rodeó de un marco pintado cubierto de ideogramas copiados de otras estampas. El cuadro, El puente bajo la lluvia, se encuentra hoy en el Museo Van Gogh de Ámsterdam."""
salle = 2
mur = "nord"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Fuegos de zorros la noche de Año Nuevo, bajo el árbol de los trajes en Ōji"
artiste = "Utagawa Hiroshige"
annee = "1857"
image = "feux-renards-oji.jpg"
technique = "Estampa nishiki-e, formato ōban vertical, unos 36 × 24 cm"
collection = "Brooklyn Museum, Nueva York"
note = "La noche de Año Nuevo, los zorros de toda la región se reúnen bajo un viejo árbol antes de ir al santuario de Inari."
description = """
En la noche de invierno, un gran árbol desnudo extiende sus ramas negras sobre un cielo azul oscuro salpicado de estrellas. A su pie, una veintena de zorros blancos están reunidos, sentados o de pie; junto a la cabeza de cada uno brilla una pequeña llama anaranjada. A la izquierda, otros zorros llegan por detrás del tronco. En la llanura oscura, a lo lejos, se acerca una larga fila de pequeñas luces: otros zorros en camino. Unos almiares de paja se alzan en los campos, y en el horizonte se adivina la masa oscura de un bosque. A la izquierda, unas ramas de pino ponen una pincelada de verde en la noche. Los cartuchos de la serie y del título ocupan el ángulo superior derecho."""
evocation = """
En Japón, el zorro es el mensajero de Inari, la divinidad del arroz y de la prosperidad, y pasa también por un ser mágico capaz de adoptar forma humana. Los «fuegos de zorros», esos resplandores misteriosos que se divisaban de noche en el campo, se les atribuían. Hiroshige muestra aquí el mundo invisible que convive con el mundo de los campesinos: lo maravilloso se instala en medio de campos familiares. Según la creencia, los campesinos contaban esos fuegos para predecir la cosecha del año siguiente. En una serie dedicada a lugares reales de Edo, esta lámina, una de las pocas que representan una leyenda, cierra el ciclo del invierno con una nota de misterio y esperanza."""
histoire = """
La estampa, fechada en 1857, lleva el número 118 de las Cien vistas famosas de Edo: es la última de la parte dedicada al invierno. Ōji, entonces una aldea al norte de Edo, albergaba el santuario de Inari más venerado de la región de Kantō. La leyenda decía que, la noche de Año Nuevo, los zorros de las ocho provincias se reunían bajo un gran almez, el Shōzoku enoki, el «árbol de los trajes», para vestirse allí con sus ropas de ceremonia antes de visitar el santuario. El árbol ha desaparecido, pero un pequeño santuario marca todavía su emplazamiento. Este ejemplar se conserva en el Brooklyn Museum de Nueva York, con toda la serie."""
facture = """
Hiroshige hace de la noche una materia: el azul profundo del cielo se oscurece hacia arriba mediante un degradado, y las estrellas son diminutos puntos reservados en el papel. Los zorros, trazados con un trazo fino, conservan la blancura del papel, lo que los hace brillar en la oscuridad. Las llamas están impresas en naranja vivo, único color cálido de la imagen. La fila de luces que se empequeñece hacia el horizonte crea profundidad sin ninguna línea de perspectiva."""
details = [
  "La pequeña llama que flota junto a la cabeza de cada zorro.",
  "La fila de luces que se acerca a lo lejos en la llanura.",
  "Las estrellas, simples puntos de papel blanco en el cielo azul.",
  "Los almiares de paja, a la derecha, en los campos de invierno.",
]
themes = ["noche", "zorro", "leyenda", "año nuevo", "invierno"]
anecdote = """
La leyenda revive cada año: desde principios de la década de 1990, los habitantes de Ōji organizan, la noche del 31 de diciembre, una procesión de zorros, en la que los participantes, maquillados o enmascarados como zorros, caminan con farolillos hasta el santuario de Inari."""
salle = 2
mur = "nord"
place = 4
largeur = 1.1

[[oeuvres]]
titre = "Bajo la ola, frente a Kanagawa (La gran ola de Kanagawa)"
artiste = "Katsushika Hokusai"
annee = "hacia 1830–1832"
image = "grande-vague.jpg"
technique = "Estampa nishiki-e (grabado en madera a color), 25,7 × 37,9 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "La lámina más célebre de las Treinta y seis vistas del monte Fuji: una ola gigante va a abatirse sobre tres barcas, mientras el Fuji, diminuto, aguarda a lo lejos."
description = """
A la izquierda, una ola inmensa se alza y se curva sobre el mar; su espuma se recorta en garras blancas que parecen dispuestas a atrapar a los hombres. Tres largas barcas esbeltas se hunden en los senos de las olas. Sus remeros, apretados unos contra otros, se aferran con la cabeza gacha. En el centro, al fondo, aparece el monte Fuji, pequeño cono de cima nevada, encajado entre dos olas. En primer plano, una ola más pequeña repite exactamente su forma, como un segundo Fuji de agua. El cielo, de un beige pálido, se oscurece hacia el horizonte, por donde pasan algunas nubes. Arriba a la izquierda, un cartucho da el nombre de la serie y el título de la estampa, con la firma del artista a su lado."""
evocation = """
La imagen opone la fuerza desmesurada de la naturaleza y la fragilidad de los hombres, que a pesar de todo siguen remando. En medio de este caos, el Fuji permanece inmóvil: la montaña sagrada, símbolo de permanencia, parece minúscula y sin embargo inquebrantable. Su nombre se ha relacionado con palabras que significan «sin igual» e «inmortal», y la montaña era objeto de un verdadero culto en Edo. Se ha observado también que la imagen se lee de forma distinta según el sentido de la mirada: de derecha a izquierda, como un texto japonés, la ola se abalanza hacia el espectador; de izquierda a derecha, a la occidental, parece alejarse. Hokusai, con más de setenta años, resume en ella todo su arte del movimiento captado en un instante suspendido."""
histoire = """
La estampa abre la serie de las Treinta y seis vistas del monte Fuji, publicada hacia 1830–1832 por el editor Nishimuraya Yohachi. Hokusai, que tiene más de setenta años, sale de unos años difíciles, marcados por la enfermedad y los apuros de dinero. La serie tiene tanto éxito que se le añaden diez vistas más, hasta sumar cuarenta y seis láminas. La gran ola se tiró en miles de ejemplares, vendidos a bajo precio. Llegadas a Europa tras la apertura de Japón, sus pruebas fascinaron a pintores, músicos y escritores del japonismo. Este ejemplar, de una bella frescura, forma parte de la colección reunida por Louisine y Henry O. Havemeyer, legada al Metropolitan Museum of Art de Nueva York en 1929."""
facture = """
Hokusai emplea el azul de Prusia, un pigmento sintético importado hacía poco, más intenso y duradero que el índigo vegetal. La línea de horizonte muy baja procede de las perspectivas occidentales que había estudiado en los grabados holandeses. La estampa es un trabajo de equipo: Hokusai dibuja, un grabador talla una plancha de madera por color, un impresor aplica los colores uno a uno a mano sobre el papel, y el editor financia y vende."""
details = [
  "Las garras de espuma en la cima de la ola, como dedos ganchudos.",
  "El Fuji nevado, minúsculo, en el hueco de las olas.",
  "La pequeña ola del primer plano, que tiene la forma del Fuji.",
  "Los remeros tendidos en el fondo de las barcas, con la cabeza gacha.",
  "La firma junto al cartucho: Hokusai aratame Iitsu hitsu.",
]
themes = ["mar", "ola", "fuji", "azul de prusia", "naturaleza"]
anecdote = """
Claude Debussy tenía una copia de La gran ola en su despacho. Para la cubierta de la partitura de La mer, publicada en 1905, hizo reproducir la ola de Hokusai, sin el Fuji ni las barcas."""
salle = 3
mur = "nord"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Viento del sur, cielo despejado (El Fuji rojo)"
artiste = "Katsushika Hokusai"
annee = "hacia 1830–1832"
image = "fuji-rouge.jpg"
technique = "Estampa nishiki-e, 25,4 × 37,8 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Al amanecer de finales del verano, el Fuji se enrojece bajo el sol naciente: una montaña, un cielo y nada más."
description = """
La montaña ocupa toda la parte derecha de la imagen: un inmenso triángulo rojo ladrillo que se eleva hasta el borde superior. Cerca de la cima, estelas de nieve blanca descienden por la roca oscura. Al pie, una ancha banda azul verdosa está cubierta de multitud de arbolillos, figurados por diminutas pinceladas apretadas como un pelaje. A la izquierda, el cielo azul profundo está atravesado por largas hileras de pequeñas nubes blancas, alineadas como escamas. No hay aldea, ni viajero, ni barco: ninguna presencia humana. Arriba a la izquierda, el cartucho del título y la firma de Hokusai se recortan sobre el cielo."""
evocation = """
El título japonés, Gaifū kaisei, significa «viento del sur, cielo despejado»: la suave brisa de finales del verano que despeja la bruma y descubre la montaña al amanecer. Hokusai reduce el Fuji a su forma más simple, casi un signo, y hace de él una presencia monumental y silenciosa. Para los habitantes de Edo, el Fuji era una montaña sagrada, que cofradías de peregrinos escalaban cada verano y de la que se reproducían incluso pequeñas copias en los santuarios de la ciudad. Se ha visto en esta imagen desnuda, sin un solo personaje, una forma de contemplación religiosa tanto como un paisaje. Todavía hoy, el Fuji rojo pasa en Japón por una imagen de buen augurio."""
histoire = """
La estampa forma parte de las Treinta y seis vistas del monte Fuji, publicadas hacia 1830–1832 por Nishimuraya Yohachi, como La gran ola. La serie aprovechaba la moda del culto al Fuji en Edo y la llegada de un nuevo pigmento, el azul de Prusia. El Fuji rojo se tiró en gran número y las pruebas varían mucho de una tirada a otra: colores suaves y matizados aquí, rojo más franco y uniforme en otras. Junto con La gran ola y La tormenta bajo la cima, forma el trío más célebre de la serie. Este ejemplar ingresó en el Metropolitan Museum of Art de Nueva York en 1939, con la colección legada por Henry L. Phillips."""
facture = """
Pocas planchas, pocos colores: el rojo, dos azules, el verde y el blanco del papel bastan. El cielo y la montaña están impresos en degradados, obtenidos limpiando la tinta sobre la plancha de madera antes de cada tirada. Los árboles son pequeñas marcas repetidas, casi un motivo textil. El grano de la madera, visible en las superficies planas, anima las grandes extensiones. La composición se apoya en dos diagonales que se unen en la cima, descentrada hacia la derecha."""
details = [
  "Las estelas de nieve que descienden de la cima como regueros.",
  "Los arbolillos apretados al pie de la montaña, como un pelaje.",
  "Las hileras de nubes blancas, alineadas en escamas.",
  "La cima descentrada hacia la derecha, casi al borde de la imagen.",
]
themes = ["fuji", "montaña", "amanecer", "cielo", "paisaje"]
anecdote = """
El fenómeno existe de verdad: a finales del verano y principios del otoño, cuando la nieve se ha derretido, el Fuji adopta a veces un tono rojo al salir el sol. Los japoneses lo llaman aka-Fuji, el «Fuji rojo», y los fotógrafos acechan ese momento."""
salle = 3
mur = "ouest"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Joven contemplando flores de ciruelo de noche"
artiste = "Suzuki Harunobu"
annee = "hacia 1766"
image = "harunobu-prunier-nuit.jpg"
technique = "Estampa nishiki-e con grabado en relieve seco (karazuri), 32,4 × 21 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "En una veranda, una joven alza un farol hacia un ciruelo en flor: una de las primeras estampas a todo color."
description = """
Una joven se encuentra en una veranda de madera, junto a una balaustrada naranja que atraviesa la imagen en diagonal. Vestida con un largo quimono rayado adornado con medallones redondos, tiende el brazo y alza un farol de papel en el extremo de una vara para iluminar una rama de ciruelo en flor que se adelanta sobre ella. El fondo es enteramente negro: es de noche. Las flores blancas de corazón amarillo se destacan sobre la oscuridad. A la derecha, una roca clara emerge de la sombra, y arriba una banda beige figura una capa de bruma. El suelo de la veranda, abajo, es de un beige pálido. La joven tiene el rostro suave y redondo, y las manos y los pies menudos, típicos de Harunobu."""
evocation = """
La escena es a la vez sencilla y poética: un paseo nocturno para ver las primeras flores de la primavera. Se la ha relacionado con un célebre poema del Kokinshū, la antología imperial del siglo X, en el que Ōshikōchi no Mitsune escribe que la oscuridad de una noche de primavera oculta el color de las flores de ciruelo, pero no puede ocultar su perfume. El farol en alto expresa ese deseo de ver lo que la noche roba. Los personajes de Harunobu, frágiles y sin edad, parecen vivir en un mundo de ensueño más que en el Edo real. Este refinamiento, nutrido de referencias literarias, estaba destinado a un público culto que gustaba de reconocer, tras la imagen, un poema o una leyenda."""
histoire = """
En 1765, círculos de aficionados acaudalados de Edo encargan a Harunobu calendarios ilustrados, que se intercambian por Año Nuevo. Para estas imágenes de lujo, grabadores e impresores perfeccionan la impresión a una decena de colores, con marcas precisas para ajustar cada plancha: es el nacimiento del nishiki-e, la «imagen de brocado». Los editores retoman enseguida el procedimiento para el gran público. Esta estampa, realizada hacia 1766, data de esos años de invención. El fondo negro liso, difícil de imprimir sin huellas, es raro en la época. Ingresó en el Metropolitan Museum of Art de Nueva York en 1929."""
facture = """
El formato chūban, más pequeño que el ōban, conviene a la intimidad de las escenas de Harunobu. La gran superficie negra realza las flores y el farol, dejados en la blancura del papel. Algunas partes están grabadas en relieve seco, sin tinta (karazuri): el papel, prensado sobre una plancha grabada, conserva un ligero relieve visible con luz rasante. Los colores, de origen vegetal, se han suavizado con el tiempo."""
details = [
  "El farol de papel de seis caras, sostenido en el extremo de una vara.",
  "Las flores de ciruelo de corazón amarillo, sobre el fondo negro.",
  "Los medallones redondos del quimono rayado.",
  "La roca clara, a la derecha, que sale de la sombra.",
]
themes = ["noche", "ciruelo", "primavera", "poesía", "joven"]
anecdote = """
El pintor Shiba Kōkan cuenta en sus memorias que, tras la muerte de Harunobu, en 1770, dibujó estampas a su estilo y las firmó con su nombre, sin que nadie se diera cuenta."""
salle = 4
mur = "ouest"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Tres bellezas de nuestro tiempo"
artiste = "Kitagawa Utamaro"
annee = "hacia 1793"
image = "trois-beautes.jpg"
technique = "Estampa nishiki-e, formato ōban, unos 37 × 25 cm"
collection = "Museum of Fine Arts, Boston"
note = "Las tres jóvenes más admiradas de Edo hacia 1793: una cantante y dos camareras de casas de té."
description = """
Tres jóvenes están representadas de busto, en primer plano, dispuestas en triángulo. Arriba, la cantante Tomimoto Toyohina baja los ojos hacia la izquierda. Abajo a la izquierda, Naniwaya Okita sostiene una tela drapeada sobre el hombro; abajo a la derecha, Takashima Ohisa sostiene un abanico redondo adornado con un motivo de hojas de roble, su emblema. Las tres llevan altos peinados lacados, prendidos con peines y alfileres. Sus rostros se parecen mucho, de un óvalo pálido con ojos estrechos y pequeños labios rojos. El fondo es liso, de un gris muy claro. Arriba a la derecha, un cartucho da el título y los nombres de las tres mujeres; la firma de Utamaro se lee a la izquierda."""
evocation = """
La estampa da testimonio de una verdadera cultura de la celebridad en el Edo del siglo XVIII. Estas jóvenes no eran cortesanas sino personalidades conocidas de todos: Okita servía en una casa de té cerca del templo Sensō-ji, en Asakusa, Ohisa en la tienda de su familia en Ryōgoku, y los clientes acudían a verlas como se va a ver a una estrella. Sus retratos se vendían como fotografías de ídolos. Utamaro juega con una paradoja: idealiza los tres rostros según el canon de belleza de su tiempo, pero los diferencia con ínfimos matices, la curva de una ceja, la forma de un ojo, que los aficionados sabían reconocer."""
histoire = """
La estampa es publicada hacia 1793 por Tsutaya Jūzaburō, el editor más audaz de Edo, que había hecho de Utamaro su estrella. Okita y Ohisa, rivales en popularidad, fueron entonces representadas por numerosos artistas, y se habló de las «tres bellezas de la era Kansei». Son también los años de las reformas de la era Kansei, con las que el gobierno trataba de reprimir el lujo y las diversiones. Utamaro retomó varias veces este trío bajo formas distintas. Este ejemplar se conserva en el Museum of Fine Arts de Boston, cuya colección de estampas japonesas, una de las más ricas fuera de Japón, debe mucho al coleccionista William Sturgis Bigelow."""
facture = """
Utamaro fue uno de los primeros en encuadrar a las mujeres de busto, en primer plano, a la manera de los retratos de actores. Los rostros están hechos solo de unas pocas líneas, sin sombra ni modelado. Toda la virtuosidad está en los peinados: el grabador talló uno a uno los finos cabellos de la frente y la nuca. La composición piramidal y la paleta contenida, hecha de negros, ocres y algunos rojos, dan a la imagen una gran elegancia."""
details = [
  "El abanico redondo de Ohisa, con su emblema de hojas de roble.",
  "Los finos cabellos de la nuca y las sienes, grabados uno a uno.",
  "El cartucho arriba a la derecha, que nombra a las tres jóvenes.",
  "Las ínfimas diferencias entre los tres rostros.",
]
themes = ["belleza", "retrato", "celebridad", "edo", "mujeres"]
anecdote = """
Poco después, la censura prohibió inscribir en las estampas el nombre de las jóvenes que no eran cortesanas. Utamaro y sus editores eludieron la prohibición con acertijos: pequeños dibujos cuya lectura daba el nombre de la modelo."""
