[[oeuvres]]
titre = "Gallo y gallina con hortensias"
artiste = "Itō Jakuchū"
annee = "1759"
image = "jakuchu-coqs-hortensias.jpg"
technique = "Colores sobre seda, rollo vertical, unos 142 × 80 cm"
collection = "Museo de las Colecciones Imperiales (Sannomaru Shōzōkan), Tokio"
note = "Uno de los treinta rollos del Reino colorido de los seres vivos, pintado para un templo de Kioto: un gallo y una gallina bajo una cascada de hortensias."
description = """
En la parte baja de la composición, un gallo de plumaje rojizo y pardo, de cresta rojo vivo, se inclina hacia el suelo; su larga cola negra se curva en arco sobre él. A la derecha, una gallina de plumaje moteado de pardo y blanco picotea con la cabeza baja. Tras ellos, una roca oscura salpicada de musgo azul verdoso. Encima, hortensias azules y blancas descienden en racimos apretados desde lo alto del rollo, con sus amplias hojas. Flores rosas se abren junto al gallo, y flores blancas al pie de la roca. Arriba a la izquierda, un pajarillo se posa en una rama. A la izquierda, una inscripción vertical da la fecha y la firma del pintor, seguida de dos sellos rojos."""
evocation = """
Este rollo pertenece al Dōshoku sai-e, el «Reino colorido de los seres vivos», un conjunto de treinta pinturas de aves, flores, insectos y peces. Jakuchū, budista fervoroso, lo ofreció a un templo: para él, cada ser vivo, del gallo a la flor, posee la naturaleza de Buda y merece ser pintado con el mismo fervor. Se ha visto en él una celebración casi extática de la vida, en la que la abundancia de formas y colores expresa la riqueza del mundo. El gallo, animal familiar, se convierte bajo su pincel en una criatura resplandeciente, casi fantástica. Esta obra no es una estampa popular sino una pintura única, ejecutada para durar."""
histoire = """
La inscripción fecha la obra en el otoño de 1759. Jakuchū, antiguo verdulero de Kioto que dejó su negocio para pintar, trabaja unos diez años en esta serie. La ofrece al templo zen Shōkoku-ji de Kioto, con un tríptico de Buda, en 1765 y luego en 1770, para adornar las ceremonias religiosas. En 1889, el templo, en dificultades, ofrece los treinta rollos a la familia imperial, que le entrega a cambio una fuerte suma. Hoy se conservan en el Museo de las Colecciones Imperiales, en Tokio, y fueron declarados tesoro nacional en 2021."""
facture = """
Jakuchū utiliza una seda muy fina y pigmentos minerales de la mejor calidad, que explican la frescura de los colores tras más de dos siglos y medio. A veces pinta también por el reverso de la seda, para matizar los tonos vistos por transparencia. Cada pluma, cada pétalo está dibujado con una precisión obsesiva, pero la composición, muy densa y sin profundidad, sigue siendo decorativa. Se inspira en las pinturas chinas de aves y flores y en la observación directa."""
details = [
  "Las plumas del cuello del gallo, dibujadas una a una, como llamas doradas.",
  "Los pétalos de hortensia, azules o blancos, cada uno perfilado con un trazo fino.",
  "El pajarillo posado arriba a la izquierda.",
  "La inscripción a la izquierda, que fecha la pintura en el otoño de 1759.",
  "Los puntos de musgo azul verdoso sobre la roca oscura.",
]
themes = ["gallo", "flores", "aves", "naturaleza", "budismo"]
anecdote = """
Según una antigua tradición, Jakuchū criaba gallos en su jardín y los observó largamente antes de pintarlos. Los gallos son, en efecto, uno de los temas que más a menudo representó."""
