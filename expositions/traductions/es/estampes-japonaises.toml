[[oeuvres]]
titre = "La princesa Takiyasha y el espectro esqueleto"
artiste = "Utagawa Kuniyoshi"
annee = "hacia 1844"
image = "takiyasha-squelette.jpg"
technique = "Estampa nishiki-e, tríptico de tres hojas ōban, unos 36 × 74 cm"
collection = "British Museum, Londres"
note = "En un palacio en ruinas, una princesa hechicera hace surgir un esqueleto gigante para aterrorizar a dos guerreros."
description = """
La imagen se despliega en tres hojas. A la izquierda, la princesa Takiyasha, con un suntuoso quimono rojo y azul, lee en voz alta un rollo de conjuros, bajo una persiana de bambú desgarrada que pende de un techo enrejado. En el centro, dos guerreros, el samurái Ōya no Tarō Mitsukuni y su compañero, están en cuclillas sobre el entarimado, frente al monstruo. Sobre ellos, a lo ancho de las hojas central y derecha, un esqueleto gigantesco surge de la oscuridad: se inclina a través de la persiana desgarrada, con las órbitas vacías vueltas hacia los hombres y los largos dedos óseos posados sobre las lamas de bambú. El suelo está sembrado de escombros."""
evocation = """
La estampa pertenece al gusto de la época por las historias de fantasmas y de venganza, que el teatro kabuki y las novelas ilustradas escenificaban con deleite. Takiyasha es la hija del rebelde Taira no Masakado, muerto en 940; busca vengar a su padre mediante la magia, y el guerrero Mitsukuni es enviado a combatirla. El esqueleto gigante encarna la amenaza sobrenatural, pero también la muerte misma que se inclina sobre los vivos. Kuniyoshi juega con virtuosismo con el efecto sorpresa: el espectador, como los guerreros, descubre el monstruo de golpe. La imagen muestra cuánto amaba el grabado del siglo XIX lo espectacular y el escalofrío."""
histoire = """
Kuniyoshi se inspira en una novela de Santō Kyōden publicada en 1806, en la que Takiyasha, retirada en el viejo palacio en ruinas de su padre en Sōma, reúne a conjurados y recurre a la brujería. En la novela, Mitsukuni se enfrenta a una multitud de esqueletos; Kuniyoshi los sustituye por un solo esqueleto gigante, mucho más impresionante. El tríptico se publica hacia 1844, en los años posteriores a las reformas de la era Tenpō, cuando la censura prohíbe los retratos de actores y cortesanas y empuja a los artistas hacia los temas históricos y legendarios. Este ejemplar se conserva en el British Museum de Londres."""
facture = """
El tríptico, tres hojas ōban vendidas juntas, permite una composición muy amplia, que Kuniyoshi aprovecha haciendo pasar el esqueleto de una hoja a otra. El esqueleto tiene una exactitud anatómica rara en el arte japonés: los historiadores piensan que Kuniyoshi había estudiado obras de anatomía occidentales difundidas por los holandeses. El fondo negro, el blanco óseo y los pocos colores vivos de la princesa crean un contraste teatral."""
details = [
  "El rollo de conjuros que lee la princesa, a la izquierda.",
  "Los dedos óseos del esqueleto posados sobre la persiana de bambú.",
  "El samurái Mitsukuni, en el centro, que fija al monstruo.",
  "Los cartuchos rojos que dan el nombre de los personajes.",
  "La firma de Kuniyoshi al pie de cada una de las tres hojas.",
]
themes = ["fantástico", "esqueleto", "leyenda", "guerrero", "tríptico"]
anecdote = """
El padre de Takiyasha, Taira no Masakado, siguió siendo una figura temida. Su tumba, el Kubizuka, se encuentra todavía en medio de las torres de oficinas de Ōtemachi, en Tokio, y la tradición dice que quienes quisieron trasladarla fueron golpeados por la desgracia."""
