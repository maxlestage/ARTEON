[[artistes]]
nom = "Katsushika Hokusai"
vie = "Edo (Tokio), 1760 – Edo, 10 de mayo de 1849"
biographie = """
Nacido en el barrio de Honjo, al este de Edo, Hokusai es primero aprendiz de grabador en madera. En 1778 entra en el taller de Katsukawa Shunshō, especialista en retratos de actores, y firma sus primeras estampas con el nombre de Shunrō. Tras dejar ese taller, lo toca todo: ilustraciones de novelas, estampas de lujo para los círculos de poetas, pinturas, manuales de dibujo. Cambia sin cesar de nombre artístico, más de una treintena de veces, y según la tradición se muda más de noventa veces. A partir de 1814 aparecen los volúmenes de la Manga, miles de bocetos de gentes, animales y cosas. Hacia 1830, con más de setenta años, publica las Treinta y seis vistas del monte Fuji, que lo hacen célebre, y luego las Cien vistas del monte Fuji. Firma entonces «el viejo loco por el dibujo». Pobre hasta el final, ayudado por su hija Ōi, también pintora, muere a los ochenta y ocho años en Edo lamentando, según se dice, no haber tenido unos años más para llegar a ser un verdadero pintor. Descubierto en Europa en la segunda mitad del siglo XIX, se convierte en la figura misma del arte japonés para los occidentales."""
style = """
Hokusai es un dibujante insaciable, que quiere captarlo todo: el movimiento del agua, los gestos de los artesanos, la forma de las montañas. Combina la tradición japonesa y china con la perspectiva occidental, descubierta en los grabados holandeses. Sus composiciones, basadas en formas geométricas simples, círculos y triángulos, tienen una fuerza de signo. El azul de Prusia, los encuadres audaces y la energía del trazo de sus paisajes marcaron profundamente a los impresionistas, al Art Nouveau y a toda la imagen moderna."""

[[artistes]]
nom = "Utagawa Hiroshige"
vie = "Edo (Tokio), 1797 – Edo, 12 de octubre de 1858"
biographie = """
Nacido Andō Tokutarō en una familia de samuráis de baja categoría encargados de la lucha contra incendios en el castillo de Edo, Hiroshige pierde a sus dos padres hacia los doce años y hereda el cargo de su padre. Poco después entra en el taller de Utagawa Toyohiro y recibe el nombre de Hiroshige. Dibuja primero actores y bellezas, sin gran éxito. El paisaje lo revela: en 1833–1834 aparecen las Cincuenta y tres estaciones del Tōkaidō, la gran ruta entre Edo y Kioto, que obtienen un éxito inmenso. Ya había cedido su cargo de bombero, en 1823, para dedicarse a la estampa. Publica decenas de series de vistas, del Kisokaidō a los lugares célebres de Edo, así como imágenes de flores y aves. En 1856 se hace monje budista y emprende las Cien vistas famosas de Edo, su última gran serie. Muere en 1858, probablemente víctima de la epidemia de cólera que azota la ciudad. Sus estampas, llegadas en masa a Europa, son coleccionadas por Van Gogh, Monet y Whistler."""
style = """
Hiroshige es el poeta del paisaje y de las estaciones. Más tierno que Hokusai, capta la atmósfera de un lugar en un momento preciso: la lluvia, la nieve, la bruma, el claro de luna. Sus degradados de azul, rojo y gris, sus primeros planos gigantes y sus encuadres cortados inspiraron a los impresionistas y a Van Gogh, que lo copió. Muestra también, con humor y ternura, a los viajeros y a la gente corriente."""

[[artistes]]
nom = "Suzuki Harunobu"
vie = "Hacia 1725 – Edo (Tokio), 1770"
biographie = """
Se sabe poco de la juventud de Harunobu, ni de su formación. Sus primeras obras conocidas, retratos de actores impresos en dos o tres colores, datan de finales de la década de 1750. Su estilo debe mucho al pintor de Kioto Nishikawa Sukenobu, cuyos libros ilustrados mostraban mujeres graciosas y frágiles. El giro llega en 1765: aficionados acaudalados de Edo, reunidos en círculos de poesía, le encargan calendarios ilustrados, que se intercambian por Año Nuevo. Con los grabadores y los impresores, Harunobu perfecciona para ellos la impresión a todo color, con una decena de planchas: el nishiki-e. Los editores venden después estas imágenes al público, que se las disputa. En cinco años, hasta su muerte repentina en 1770, Harunobu produce varios cientos de estampas: jóvenes enamorados, escenas de la vida cotidiana, elegantes parodias de la poesía clásica, retratos de la célebre camarera de casa de té Kasamori Osen. Se convierte en el maestro más imitado de su tiempo, hasta el punto de que otros firmaron con su nombre tras su muerte."""
style = """
Harunobu crea un mundo de dulzura y ensueño, poblado de jóvenes de siluetas finas, manos menudas y rostros casi idénticos. Sus estampas de pequeño formato juegan con colores tiernos, fondos lisos y el grabado en relieve seco. Le gustan las alusiones literarias ocultas, que el espectador culto debía reconocer. Su invención del nishiki-e abre la edad de oro de la estampa en color."""

[[artistes]]
nom = "Kitagawa Utamaro"
vie = "Hacia 1753 – Edo (Tokio), 1806"
biographie = """
El lugar y la fecha de nacimiento de Utamaro siguen siendo inciertos. Se forma con el pintor Toriyama Sekien, conocido por sus libros ilustrados de criaturas fantásticas. A comienzos de la década de 1780 conoce al editor Tsutaya Jūzaburō, que lo aloja, lo publica y hace de él su estrella. Se da a conocer primero por magníficos libros ilustrados de poemas cómicos, entre ellos el Libro de los insectos de 1788, de observaciones de gran finura. Hacia 1791–1793 inventa el retrato de mujer de busto, en primer plano, y se convierte en el maestro indiscutible de los bijin-ga, las imágenes de mujeres hermosas: cortesanas del barrio de Yoshiwara, camareras célebres, madres e hijos, mujeres trabajando. Tras la muerte de Tsutaya en 1797, trabaja para numerosos editores. En 1804 es arrestado por haber representado al gran caudillo Toyotomi Hideyoshi, tema prohibido, y condenado a llevar grilletes durante cincuenta días. Muere dos años después. En 1891, Edmond de Goncourt le dedica un libro que establece su reputación en Europa."""
style = """
Utamaro es el pintor de la belleza femenina. Sus mujeres, esbeltas y de rostros alargados, están captadas en su intimidad: un peinado, un gesto, una mirada. Encuadra a sus modelos en primer plano, de busto, y hace del rostro, de la nuca y del cabello, grabados con una finura extrema, el corazón de la imagen. Su línea flexible y sus fondos de mica fascinaron a los japonistas, de Goncourt a Toulouse-Lautrec."""

[[artistes]]
nom = "Tōshūsai Sharaku"
vie = "Activo en Edo (Tokio) en 1794–1795; fechas de nacimiento y muerte desconocidas"
biographie = """
Sharaku es el enigma del grabado japonés. Aparece de pronto en el quinto mes de 1794, cuando el editor Tsutaya Jūzaburō publica de golpe veintiocho grandes retratos de actores de kabuki de busto, sobre fondo de mica negra, firmados con ese nombre desconocido. En los meses siguientes aparecen otras series, de cuerpo entero y cada vez más convencionales; luego, a comienzos de 1795, tras unas ciento cuarenta estampas en diez meses, Sharaku desaparece sin dejar rastro. Su identidad ha hecho correr mucha tinta: se ha querido ver en él a Hokusai, Utamaro u otros artistas conocidos. Una nota escrita en 1844 por el erudito Saitō Gesshin lo identifica con Saitō Jūrōbei, un actor de nō al servicio del señor de Awa, y documentos hallados desde entonces han reforzado esta hipótesis, hoy la más aceptada. Poco apreciado en su tiempo, Sharaku cae en el olvido en Japón. Es redescubierto por los coleccionistas occidentales, y en 1910 el libro del alemán Julius Kurth lo consagra como uno de los grandes retratistas de la historia del arte."""
style = """
Sharaku muestra a los actores sin embellecerlos: narices ganchudas, mandíbulas pesadas, arrugas, miradas bizcas, manos crispadas. Simplifica las formas, acentúa las asimetrías y sitúa sus figuras sobre fondos de mica centelleantes. El resultado participa a la vez del retrato psicológico y de la caricatura, con una intensidad que el grabado japonés nunca había alcanzado y que apenas volverá a alcanzar."""

[[artistes]]
nom = "Utagawa Kuniyoshi"
vie = "Edo (Tokio), 1797 – Edo, 1861"
biographie = """
Hijo de un tintorero de seda de Edo, Kuniyoshi entra hacia 1811 en el taller del gran Utagawa Toyokuni, maestro de los retratos de actores. Sus comienzos son difíciles, y vive varios años en la pobreza. El éxito llega hacia 1827 con una serie dedicada a los ciento ocho héroes del Suikoden, una novela china de bandidos de gran corazón, que lanza la moda de las estampas de guerreros, los musha-e. Kuniyoshi se convierte en su maestro, pero toca también el paisaje, las leyendas, las escenas cómicas y los animales. Durante las reformas de la era Tenpō, a partir de 1842, la censura prohíbe los retratos de actores y cortesanas: la esquiva con malicia, prestando los rasgos de los actores a gatos, ranas o peces, y desliza alusiones satíricas al poder en sus trípticos. Gran amante de los gatos, siempre tenía varios en su taller. Forma a numerosos alumnos, entre ellos Tsukioka Yoshitoshi, uno de los últimos grandes maestros de la estampa. Muere en Edo en 1861."""
style = """
Kuniyoshi es el maestro de lo espectacular: guerreros en pleno combate, monstruos, fantasmas, ballenas gigantes, a menudo desplegados en trípticos. Toma del grabado occidental el modelado, la perspectiva y la anatomía, y los mezcla con una imaginación desbordante y un humor constante. Sus composiciones audaces y su gusto por lo fantástico anuncian el manga e inspiraron el arte del tatuaje japonés."""

[[artistes]]
nom = "Itō Jakuchū"
vie = "Kioto, 1716 – Kioto, 1800"
biographie = """
Hijo mayor de un rico mayorista de verduras del mercado de Nishiki, en Kioto, Jakuchū se hace cargo del negocio familiar a los veintitrés años, a la muerte de su padre. Pero el comercio le interesa poco: estudia pintura, primero con un maestro de la escuela Kanō, luego copiando las pinturas chinas conservadas en los templos de Kioto y, sobre todo, observando la naturaleza. Hacia los cuarenta años deja el negocio a su hermano menor para dedicarse por entero a la pintura. Cercano al monje zen Daiten, del templo Shōkoku-ji, que le habría dado su nombre de artista, pinta durante una decena de años los treinta rollos del Reino colorido de los seres vivos, ofrecidos al templo. Practica también la tinta monocroma, de gran libertad, e inventa técnicas originales, como sus biombos divididos en miles de pequeños cuadrados. El gran incendio de Kioto, en 1788, destruye su casa; pasa sus últimos años cerca del templo Sekihō-ji, al sur de la ciudad, donde dibuja estatuas de discípulos de Buda. Largo tiempo descuidado, es hoy uno de los pintores más admirados de Japón."""
style = """
Jakuchū es un pintor singular, que no pertenece a ninguna escuela. Une la precisión casi científica de la observación, pluma a pluma y pétalo a pétalo, a una imaginación decorativa y a veces extraña. Sus colores, de una intensidad y una frescura excepcionales, y sus composiciones densas, sin profundidad, dan a sus aves y a sus flores una presencia casi sobrenatural. No es un artista del ukiyo-e, sino un contemporáneo de los primeros maestros del grabado en color."""
