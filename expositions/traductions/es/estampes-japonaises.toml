[exposition]
ordre = 75
nom_court = "Ukiyo-e"
mouvement = "Ukiyo-e, el grabado japonés"
cadre = "estampe"
couleur = "#2c4a7e"
titre = "Ukiyo-e, las imágenes del mundo flotante"
artiste = "Hokusai, Hiroshige, Utamaro, Sharaku…"
dates = "1759–1857"
accroche = "Exposición virtual · Museo Nacional de Tokio"
introduction = """
Ukiyo-e, «imágenes del mundo flotante»: en Edo, la actual Tokio, estampas grabadas en madera y vendidas por el precio de un cuenco de fideos muestran a los actores de kabuki, a las bellezas de moda y, después, los paisajes y las leyendas. La visita sigue esta edad de oro, de las primeras estampas en color de Harunobu a las Cien vistas de Edo de Hiroshige, pasando por La gran ola de Hokusai, con una pintura sobre seda de Itō Jakuchū como contrapunto. El edificio se inspira en el Honkan del Museo Nacional de Tokio y en las casas japonesas: salas bajas de paredes color papel, unidas por una larga galería, el engawa. Las estampas, que miden unos treinta centímetros, se presentan ampliadas."""
vitrine = "grande-vague.jpg"

[musee]
nom = "Museo Nacional de Tokio"
ville = "Tokio, Japón"
architecte = "Watanabe Jin (Honkan)"
construction = "Honkan abierto en 1938"
presentation = """
Fundado en 1872, el Museo Nacional de Tokio es el museo más antiguo de Japón. Instalado en el parque de Ueno, ocupa varios edificios; el primero, diseñado por el arquitecto inglés Josiah Conder, quedó arruinado por el gran terremoto de Kantō en 1923. El Honkan, el edificio principal que lo sustituye, es obra de Watanabe Jin y abre en 1938: una construcción de hormigón armado a la occidental, coronada por un gran tejado de tejas a la japonesa, en el estilo llamado «de la corona imperial». Una escalera monumental conduce a la planta superior, donde las salas siguen la historia del arte japonés, de la prehistoria a la época de Edo. Las estampas ukiyo-e, que la luz deteriora, se exponen allí por turnos, unas semanas cada vez, en una sala que les está dedicada; el museo conserva miles, junto con pinturas, sables, lacas, quimonos y numerosos tesoros nacionales."""
ici = """
El edificio de ARTEON toma del Honkan sus salas de estampas y de la casa japonesa su planta a escala humana: techos de tres a cuatro metros, paredes color papel washi. Se entra por el sur en el genkan, que da a «El engawa · Las cien vistas de Edo», larga galería de casi veinte metros. Al norte, esta comunica con la sala I · Hokusai y el Fuji, al oeste, y con la sala III · Visiones, al este. Entre ambas, la sala II · Bellezas y actores las une: se pasa por ella de la sala I a la sala III, antes de volver a la galería."""

