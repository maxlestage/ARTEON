[[artistes]]
nom = "Jan van Eyck"
vie = "Maaseik (?), hacia 1390 – Brujas, 1441"
biographie = """
Jan van Eyck aparece por primera vez en los documentos en 1422, en La Haya, al servicio de Juan de Baviera, conde de Holanda. En 1425 se convierte en pintor y ayuda de cámara del duque de Borgoña Felipe el Bueno, uno de los príncipes más ricos de Europa, que le paga una pensión y le confía misiones secretas. En 1428-1429, acompaña a la embajada enviada a Portugal para negociar el matrimonio del duque con la infanta Isabel, de la que pinta el retrato. Hacia 1430 se instala en Brujas, donde se casa; el duque sostiene a uno de sus hijos sobre la pila bautismal. En 1432 concluye el gran políptico de El Cordero Místico, en Gante, comenzado por su hermano Hubert, muerto en 1426. Siguen una veintena de cuadros firmados o atribuidos: retratos de presencia impresionante, como El hombre del turbante rojo o Los esposos Arnolfini, y retablos como La Virgen del canciller Rolin. Muere en Brujas en 1441, celebrado como el primer pintor de su tiempo."""
style = """
Van Eyck lleva la pintura al óleo a una perfección jamás alcanzada: mediante veladuras superpuestas, expresa la luz, la transparencia y la textura de cada materia, del brocado a la piel arrugada. Su mirada abarca a la vez lo inmenso y lo minúsculo, un paisaje lejano y un reflejo en una perla. Su realismo, cargado de símbolos religiosos, funda la escuela de los primitivos flamencos y fascina a Italia, que busca sus cuadros. Su divisa, Als ich can, «como puedo», exhibe una modestia puramente retórica."""

[[artistes]]
nom = "Rogier van der Weyden"
vie = "Tournai, hacia 1399-1400 – Bruselas, 18 de junio de 1464"
biographie = """
Nacido en Tournai con el nombre de Rogier de le Pasture, se forma en el taller de Robert Campin, donde figura inscrito como aprendiz en 1427, y se convierte en maestro en 1432. Hacia 1435 se instala en Bruselas, de la que es pintor oficial, y traduce su nombre al flamenco. Para el ayuntamiento pinta grandes paneles sobre la justicia, hoy destruidos, que causaban la admiración de los viajeros. Dirige un taller muy activo y recibe encargos de toda Europa: del canciller Nicolas Rolin, para quien pinta el Juicio Final de los Hospicios de Beaune, de la corte de Borgoña, de mercaderes y de príncipes italianos. En 1450, año jubilar, viaja a Roma. Rico y respetado, muere en Bruselas en 1464. Su influencia, difundida por sus discípulos y por innumerables copias, domina la pintura flamenca, alemana y española hasta principios del siglo XVI."""
style = """
Rogier van der Weyden retoma la precisión de Van Eyck, pero la pone al servicio de la emoción. Sus composiciones, a menudo en friso, tienen la claridad de relieves esculpidos; sus líneas angulosas, sus paños quebrados y sus rostros en lágrimas dan al dolor una intensidad nueva. Retratista refinado, crea un tipo de retrato aristocrático, elegante y contenido, sobre fondo neutro. Copiados durante décadas, sus modelos han hecho de él el pintor más imitado del norte de Europa en el siglo XV."""

[[artistes]]
nom = "Hans Memling"
vie = "Seligenstadt (Hesse), hacia 1430-1440 – Brujas, 11 de agosto de 1494"
biographie = """
Hans Memling nace en Alemania, en Seligenstadt, cerca de Fráncfort. Se ignora todo de su formación, pero su arte sugiere un paso por el taller de Rogier van der Weyden en Bruselas. En 1465 obtiene la ciudadanía de Brujas, uno de los grandes centros comerciales de Europa, donde pasa el resto de su vida. Allí se convierte en el pintor más solicitado de la ciudad: sus clientes son banqueros y mercaderes italianos, como Tommaso Portinari, representante de los Médicis, ingleses, miembros de la corte de Borgoña e instituciones religiosas. Su gran Juicio Final, destinado a Florencia, es capturado en el mar en 1473 por un corsario de Danzig y sigue estando en Gdansk. Para el hospital de San Juan de Brujas pinta varios retablos y el relicario de santa Úrsula, concluido en 1489, que se conservan todavía allí. En 1480 figura entre los mayores contribuyentes de la ciudad. A su muerte, en 1494, un notario de Brujas anota que pasaba por el pintor más hábil de toda la cristiandad."""
style = """
Memling suaviza la herencia de Van Eyck y de Rogier: sus figuras calmas, de rostros ovalados y serenos, se bañan en una luz uniforme y en paisajes apacibles. Su dibujo es límpido, su color fresco, sus composiciones equilibradas y simétricas. Retratista solicitado, coloca a sus modelos ante ventanas o paisajes abiertos, una fórmula que los pintores italianos adoptan con entusiasmo. Largo tiempo olvidado, es redescubierto en el siglo XIX por los románticos, que ven en él al más puro de los primitivos."""

[[artistes]]
nom = "Jérôme Bosch"
vie = "Bolduque, hacia 1450 – Bolduque, agosto de 1516"
biographie = """
Jheronimus van Aken nace hacia 1450 en Bolduque, ciudad próspera del ducado de Brabante, en una familia de pintores: su abuelo, su padre y sus tíos ejercen el oficio. Firma sus obras con un nombre tomado del de su ciudad, Jheronimus Bosch. Hacia 1480 se casa con Aleid van de Meervenne, de familia acomodada, que le aporta fortuna y tierras. Es miembro de la Ilustre Cofradía de Nuestra Señora, una asociación religiosa influyente para la que realiza diversos trabajos. Apenas parece haber salido de su ciudad, pero su reputación se extiende lejos: Felipe el Hermoso, duque de Borgoña, le encarga en 1504 un gran Juicio Final, y sus cuadros son buscados por los coleccionistas de los Países Bajos, de Italia y de España. Muere en 1516; la cofradía celebra sus funerales el 9 de agosto. Tras su muerte, sus invenciones son imitadas y copiadas profusamente. El rey Felipe II de España, su más fervoroso admirador, reúne sus obras en El Escorial, de donde proceden las que conserva hoy el Prado."""
style = """
El Bosco inventa un mundo sin equivalente: criaturas híbridas, mitad hombres, mitad objetos, demonios, frutas gigantes, arquitecturas orgánicas. Bajo la fantasía se esconde un moralista que denuncia los pecados y la locura de los hombres, con un vocabulario nutrido de proverbios, sermones y creencias populares. Su pintura, rápida y fluida, de colores vivos sobre fondos claros, rompe con el acabado minucioso de sus predecesores. Imitado desde el siglo XVI, entre otros por Brueghel, fue saludado en el siglo XX como precursor del surrealismo."""

[[artistes]]
nom = "Albrecht Dürer"
vie = "Núremberg, 21 de mayo de 1471 – Núremberg, 6 de abril de 1528"
biographie = """
Hijo de un orfebre húngaro establecido en Núremberg, Albrecht Durero aprende primero el oficio de su padre y entra en 1486 en el taller del pintor Michael Wolgemut. Tras cuatro años de viaje por las tierras del Rin, se casa con Agnes Frey en 1494 y parte enseguida hacia Venecia, donde descubre la pintura italiana. De regreso en Núremberg, publica en 1498 el Apocalipsis, una serie de grandes grabados en madera que le hace célebre en toda Europa. Vuelve a Venecia de 1505 a 1507 y allí pinta La fiesta del Rosario para los mercaderes alemanes de la ciudad. A partir de 1512 trabaja para el emperador Maximiliano I, que le concede una pensión. Sus tres grabados al buril más célebres, entre ellos Melencolia I, datan de 1513-1514. En 1520-1521 viaja a los Países Bajos, donde los artistas de Amberes lo reciben como a un príncipe, y conoce a Erasmo. Dedica sus últimos años a tratados de geometría, de fortificación y de proporciones humanas, y muere en Núremberg en 1528."""
style = """
Durero reúne la precisión del Norte y la ciencia italiana de la perspectiva y de las proporciones, que es el primer alemán en estudiar como teórico. Grabador sin igual, lleva el grabado en madera y en cobre a una finura nunca vista, y difunde así su arte por toda Europa. Sus acuarelas de plantas, animales y paisajes figuran entre los primeros estudios de naturaleza autónomos. Con sus autorretratos, impone además una nueva imagen del artista, sabio y creador."""

[[artistes]]
nom = "Lucas Cranach l'Ancien"
vie = "Kronach (Franconia), hacia 1472 – Weimar, 16 de octubre de 1553"
biographie = """
Lucas Cranach toma su nombre de su ciudad natal, Kronach, en Franconia, donde se forma junto a su padre, pintor. Hacia 1501 se encuentra en Viena, donde pinta retratos de humanistas y escenas religiosas en grandes paisajes de bosque. En 1505, el elector de Sajonia Federico el Sabio lo llama a Wittenberg como pintor de corte, cargo que conserva bajo tres electores sucesivos. En 1508 recibe un escudo de armas adornado con una serpiente alada, que se convierte en su firma. Dirige un taller muy productivo, con sus hijos Hans y Lucas, y se convierte en uno de los hombres más ricos de la ciudad: posee una farmacia, una imprenta, casas, y es varias veces burgomaestre. Amigo de Martín Lutero, le hace múltiples retratos e ilustra sus escritos: se convierte en el pintor de la Reforma. Tras la derrota de los príncipes protestantes en 1547, se reúne con el elector Juan Federico en su cautiverio y luego lo sigue a Weimar, donde muere en 1553."""
style = """
Cranach inventa un arte de corte seductor e inmediatamente reconocible: contornos nítidos, colores vivos aplicados en planos, fondos oscuros o lisos, cuerpos femeninos esbeltos de rostros menudos. Sus Venus, Judit y Lucrecia, tan elegantes como ambiguas, mezclan moral y erotismo. Retratista eficaz, fija la imagen de Lutero y de los príncipes protestantes, difundida en series por su taller. Su estilo, largo tiempo juzgado manierista, ha fascinado a los artistas modernos, con Picasso a la cabeza."""

[[artistes]]
nom = "Hans Holbein le Jeune"
vie = "Augsburgo, hacia 1497-1498 – Londres, 1543"
biographie = """
Hijo del pintor Hans Holbein el Viejo, aprende el oficio en Augsburgo antes de establecerse en Basilea hacia 1515. Allí dibuja para los grandes impresores de la ciudad, pinta fachadas y retablos, y hace varios retratos de Erasmo, el más célebre humanista de su tiempo. Sus grabados de La danza de la muerte, dibujados en la década de 1520, le dan a conocer en toda Europa. Cuando la Reforma llega a Basilea y los encargos religiosos escasean, parte a Londres en 1526, provisto de una recomendación de Erasmo para Tomás Moro, cuya familia retrata. De regreso en Basilea en 1528, vuelve definitivamente a Inglaterra en 1532. Allí retrata a los mercaderes alemanes de la Hansa y luego entra al servicio de Enrique VIII, de quien se convierte en pintor hacia 1536: fija la imagen del rey, de sus esposas y de sus ministros. En 1539 es enviado a pintar a Ana de Cléveris, con quien el rey se casa antes de repudiarla pocos meses después. Muere en Londres en el otoño de 1543."""
style = """
Holbein es el retratista más preciso del Renacimiento: sus dibujos preparatorios, ejecutados en pocas sesiones, captan un rostro con una objetividad sin complacencia, y luego la pintura restituye cada tela y cada joya con una nitidez de orfebre. Combina el realismo flamenco con la amplitud y la claridad de composición aprendidas de Italia. Sus retratos de Enrique VIII y de su corte han moldeado la imagen que conservamos de la Inglaterra de los Tudor."""

[[artistes]]
nom = "Pieter Bruegel l'Ancien"
vie = "Brabante (?), hacia 1525-1530 – Bruselas, 9 de septiembre de 1569"
biographie = """
Casi nada se sabe de su juventud, ni siquiera su lugar de nacimiento exacto. En 1551 es admitido como maestro en el gremio de San Lucas de Amberes. Pronto parte hacia Italia, donde reside sobre todo en Roma, hasta hacia 1554; atraviesa los Alpes a la ida y a la vuelta y trae de ellos dibujos de montañas. En Amberes trabaja para el editor de estampas Hieronymus Cock, de la casa de Los Cuatro Vientos, que graba y difunde sus composiciones: paisajes, proverbios, pecados capitales a la manera del Bosco. A partir de finales de la década de 1550 se dedica más a la pintura. En 1563 se casa en Bruselas con Mayken Coecke, hija del pintor Pieter Coecke van Aelst, y se instala en esa ciudad. Allí pinta, para ricos aficionados como Niclaes Jongelinck o el cardenal de Granvela, la serie de las Estaciones, las escenas campesinas y las parábolas de sus últimos años. Muere en 1569, dejando dos hijos aún niños, Pieter y Jan, que fundan una dinastía de pintores. Se conocen una cuarentena de sus cuadros, doce de ellos en el Kunsthistorisches Museum."""
style = """
Brueghel mira el mundo desde lo alto, en vastos panoramas poblados de multitudes minúsculas, o desde muy cerca, en medio de los campesinos. Heredero del Bosco por su gusto por los proverbios y la sátira, hace de la naturaleza y de la gente sencilla verdaderos temas de pintura. Sus figuras achaparradas, sus colores francos y sus composiciones en diagonal tienen una legibilidad ejemplar. Abre el camino a la pintura de género y al paisaje holandés del siglo XVII."""
