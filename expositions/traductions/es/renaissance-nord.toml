[[oeuvres]]
titre = "Los esposos Arnolfini"
artiste = "Jan van Eyck"
annee = "1434"
image = "epoux-arnolfini.jpg"
technique = "Óleo sobre tabla de roble, 82,2 × 60 cm"
collection = "National Gallery, Londres"
note = "Un mercader de Lucca y su esposa en su alcoba de Brujas: un espejo, un perro, una firma en la pared y uno de los retratos más enigmáticos de la historia."
description = """
En una alcoba estrecha, un hombre y una mujer están de pie, de la mano. Él, vestido con un amplio manto oscuro ribeteado de piel y tocado con un inmenso sombrero de paja teñida de negro, levanta la mano derecha. Ella, con un vestido verde forrado de piel blanca, sujeta con la otra mano los pesados pliegues de su falda y baja la mirada. A su alrededor, todo está descrito con minuciosidad de orfebre: la araña de cobre donde arde una sola vela en pleno día, las naranjas dejadas junto a la ventana, los zuecos de madera abandonados en el suelo, la cama con colgaduras rojas, el perrito de pelo alborotado. Al fondo, un espejo convexo refleja la habitación entera, vista de espaldas, y a dos visitantes de pie en el umbral."""
evocation = """
Durante mucho tiempo se leyó este cuadro como la escena de una boda de la que el pintor sería testigo: era la célebre hipótesis de Erwin Panofsky, en 1934, que veía un símbolo en cada objeto, la vela única como la mirada de Dios, el perro como la fidelidad, los zapatos quitados como un suelo sagrado. Hoy los historiadores son más prudentes. El gesto solemne se parece a un juramento, pero nada prueba que se trate de una ceremonia, y el vientre redondeado de la mujer no señala un embarazo: responde a la moda de la época. Queda la imagen de una prosperidad orgullosa de sí misma, naranjas importadas, alfombras, araña, pieles, la de un mundo en el que los mercaderes rivalizan en lujo con los príncipes."""
histoire = """
El cuadro está firmado y fechado en la pared, encima del espejo. El hombre es casi con seguridad Giovanni di Nicolao Arnolfini, mercader de Lucca establecido en Brujas, donde trabajaba entonces Van Eyck. Como su primera esposa, Costanza Trenta, había muerto en 1433, la identidad de la mujer sigue siendo objeto de discusión: ¿una segunda esposa desconocida o un retrato en memoria de una difunta? A principios del siglo XVI, la tabla pertenece a Margarita de Austria, gobernadora de los Países Bajos, que la recibió de un cortesano español, Diego de Guevara. Pasa después a María de Hungría y luego a los reyes de España. Tras la batalla de Vitoria, en 1813, un oficial británico, James Hay, la lleva a Inglaterra; la National Gallery la compra en 1842."""
facture = """
Van Eyck no inventó la pintura al óleo, pero le saca un partido inédito: superponiendo finas capas de color translúcidas, las veladuras, obtiene verdes profundos, rojos saturados y pasajes de luz de una suavidad nueva. La luz entra por la ventana de la izquierda y resbala sobre cada materia, el cobre pulido, la piel, la madera del suelo. La perspectiva no obedece a un único punto de fuga, como en Italia, sino a una observación paciente, casi táctil. El espejo, de apenas unos centímetros de ancho, muestra la virtuosidad de un pintor capaz de representar el mundo en miniatura."""
details = [
  "Encima del espejo: Johannes de eyck fuit hic 1434, «Jan van Eyck estuvo aquí».",
  "Alrededor del espejo, diez diminutos medallones narran la Pasión de Cristo.",
  "En el reflejo, dos siluetas en el umbral, una de las cuales podría ser el pintor.",
  "Una sola vela arde en la araña, en pleno día.",
  "En la silla, una santa tallada, quizá Margarita, patrona de las parturientas.",
]
themes = ["retrato", "pareja", "espejo", "interior", "símbolos", "brujas"]
anecdote = """
En el siglo XVII, el cuadro se hallaba en las colecciones reales de Madrid, donde Velázquez pudo verlo. A menudo se ha comparado su espejo con el de Las meninas (1656), en cuyo fondo aparecen, reflejados, el rey y la reina de España."""
salle = 2
mur = "nord"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "El Descendimiento"
artiste = "Rogier van der Weyden"
annee = "antes de 1443"
image = "descente-de-croix.jpg"
technique = "Óleo sobre tabla, 204,5 × 261,5 cm"
collection = "Museo del Prado, Madrid"
note = "Diez figuras casi de tamaño natural apretadas en una caja dorada: el dolor más intenso de la pintura flamenca."
description = """
El cuerpo de Cristo, de una palidez de cera, acaba de ser desclavado de la cruz. Dos hombres ancianos, Nicodemo y José de Arimatea, lo sostienen, uno por los hombros, el otro por las piernas, mientras un joven sirviente, aún encaramado a la escalera, sujeta su brazo. A la izquierda, la Virgen se desvanece: su cuerpo cae formando una curva que repite la de su hijo, sostenida por san Juan, vestido de rojo, y por una santa mujer de verde. A la derecha, María Magdalena se retuerce las manos. Las figuras, casi de tamaño natural, se apiñan sobre un suelo estrecho donde yacen un cráneo y un hueso, ante un fondo de oro sin profundidad: parecen estatuas pintadas alineadas en la caja de un retablo esculpido."""
evocation = """
Rogier no busca narrar, sino hacer sentir. El paralelismo entre el cuerpo de Cristo y el de su madre expresa una idea cara a la devoción de su tiempo, la compasión en sentido pleno: María sufre con su hijo hasta compartir su muerte. Las lágrimas pintadas una a una, los párpados enrojecidos, las manos crispadas invitan al fiel a llorar a su vez. El cráneo a los pies de la escena recuerda que el Gólgota era, según la tradición, el lugar donde reposaba Adán: el sacrificio de Cristo redime el pecado del primer hombre. Por último, la puesta en escena en una caja de retablo acerca la pintura a la escultura, a la que pretende igualar y luego superar por el color y la vida."""
histoire = """
La tabla fue encargada por la gran cofradía de los ballesteros de Lovaina, una hermandad de tiradores, para su capilla de Nuestra Señora Extramuros. Su éxito es inmediato: se copia e imita durante todo el siglo. Hacia mediados del siglo XVI, María de Hungría, hermana de Carlos V y gobernadora de los Países Bajos, la obtiene de la cofradía, que recibe a cambio un órgano y una copia pintada por Michiel Coxcie. La obra pasa después a España, donde Felipe II, sobrino de María, la hace colocar en el monasterio de El Escorial. Allí permanece casi cuatro siglos antes de incorporarse al Museo del Prado en 1939. Hoy es una de las piezas maestras de su colección de primitivos flamencos."""
facture = """
Rogier compone en friso, como un escultor: las diez figuras ocupan todo el ancho de la tabla, sin paisaje ni cielo, ante un fondo dorado que cierra el espacio. Los cuerpos encajan en una larga curva que va de la Virgen a Cristo y luego a la Magdalena. Los colores, el azul intenso del manto de María, el rojo de san Juan, el brocado de oro del anciano que sostiene las piernas, se aplican en veladuras brillantes, a la manera de Van Eyck. Pero donde Van Eyck observa, Rogier dramatiza: el dibujo anguloso de los paños y la expresión de los rostros sirven ante todo a la emoción."""
details = [
  "En los ángulos dorados de la parte superior, diminutas ballestas recuerdan a los comitentes.",
  "Las lágrimas transparentes que corren por las mejillas de la Virgen y de san Juan.",
  "Junto a la mano de la Virgen, el cráneo de Adán y un hueso, al pie del Gólgota.",
  "La curva del cuerpo de María, que repite la de Cristo justo encima.",
  "El brocado de oro con motivos vegetales del anciano a la derecha de Cristo.",
]
themes = ["pasión", "dolor", "compasión", "religión", "retablo"]
anecdote = """
La tabla no es rectangular: un saliente, en el centro del borde superior, aloja la parte alta de la cruz y la escalera, de ahí los ángulos negros de la reproducción. Esta forma, habitual en los retablos esculpidos de la época, refuerza la ilusión de un grupo de estatuas dentro de su caja."""
salle = 2
mur = "sud"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "Retrato de hombre con una medalla romana"
artiste = "Hans Memling"
annee = "hacia 1474–1480"
image = "homme-medaille.jpg"
technique = "Óleo sobre tabla, 31 × 23,2 cm"
collection = "Real Museo de Bellas Artes (KMSKA), Amberes"
note = "Un italiano de Flandes muestra una moneda con la efigie de Nerón, ante un paisaje apacible: un retrato de humanista, obra del pintor más solicitado de Brujas."
description = """
Un hombre vestido de negro, con un gorro oscuro, se presenta de tres cuartos, muy cerca de nosotros, como tras una ventana. Sus cabellos castaños y rizados enmarcan un rostro sereno, de mirada dirigida al espectador. El cuello de su camisa blanca, fruncido, se cierra con un cordón. En el ángulo inferior derecho, su mano sostiene entre los dedos una moneda de bronce en la que se reconoce el perfil laureado del emperador Nerón. Detrás de él se abre un paisaje apacible: colinas boscosas, un estanque donde se deslizan unos cisnes, un pequeño jinete sobre un caballo blanco, una palmera y, a lo lejos, un castillo en una altura, bajo un cielo claro salpicado de ligeras nubes."""
evocation = """
La medalla es la clave del cuadro. Sostener una moneda antigua es presentarse como humanista, como aficionado a esa Antigüedad que Italia redescubre entonces con pasión. El vestido, a la moda italiana, y este gusto por las antigüedades han llevado a buscar al modelo entre los italianos presentes en Flandes. Se ha propuesto al diplomático veneciano Bernardo Bembo, embajador ante Carlos el Temerario a principios de la década de 1470, cuyos emblemas eran precisamente el laurel y la palmera, ambos presentes en el cuadro; otros han pensado en un medallista o en un coleccionista. Ninguna hipótesis está probada. En todo caso, el retrato expresa el encuentro de dos mundos: la precisión flamenca al servicio de la cultura humanista italiana."""
histoire = """
Establecido en Brujas desde 1465, Memling cuenta entre sus clientes con numerosos italianos: banqueros de la sucursal de los Médicis, mercaderes, diplomáticos de paso, que llevan sus retratos a su país. Esta pequeña tabla, pintada para tenerla en la mano o colocarla sobre un mueble, pertenece sin duda a esa clientela. Su historia antigua es mal conocida: reaparece en Lyon a principios del siglo XIX, antes de ingresar en el museo de Amberes, que la conserva con el número de inventario 5. Hoy el museo la expone bajo el nombre de Bernardo Bembo, con prudencia. Figura entre los retratos más estudiados de Memling, pues ilustra los estrechos vínculos entre los pintores flamencos y sus comitentes italianos."""
facture = """
El pintor reúne dos tradiciones. Del retrato flamenco conserva la pose de tres cuartos, la precisión de las carnaciones y la factura casi tangible de la mano que adelanta la medalla hasta el borde del cuadro, como sobre el alféizar de una ventana. Pero en lugar del habitual fondo negro, abre tras el modelo un paisaje luminoso, pintado en perspectiva aérea: los verdes palidecen y azulean a medida que se alejan. La gama es contenida, negro, blanco, carne, sobre el azul del cielo, y el trazado de los rizos, mechón a mechón, muestra la finura del pincel al óleo."""
details = [
  "En la moneda, la inscripción latina con el nombre de Nerón rodea su perfil laureado.",
  "Abajo, en el centro, dos hojas de laurel, quizá un emblema del modelo.",
  "A la derecha, una palmera, árbol poco flamenco, a la orilla del estanque.",
  "Sobre el agua, unos cisnes, y en la orilla un diminuto jinete sobre un caballo blanco.",
  "La fina red de craquelados de la pintura, bien visible en el rostro.",
]
themes = ["retrato", "humanismo", "antigüedad", "paisaje", "italia"]
anecdote = """
Memling pasa por ser el primer pintor al norte de los Alpes que colocó un retrato ante un paisaje abierto. La idea hizo fortuna en Italia: pronto se la encuentra en los retratistas de Florencia y Venecia, del Perugino al joven Rafael."""
salle = 2
mur = "est"
place = 1
largeur = 0.75

[[oeuvres]]
titre = "El jardín de las delicias"
artiste = "Jérôme Bosch"
annee = "hacia 1490–1500"
image = "jardin-des-delices.jpg"
technique = "Óleo sobre tablas de roble, tríptico abierto, 205,5 × 384,9 cm"
collection = "Museo del Prado, Madrid"
note = "El paraíso, un jardín de placeres extraños y después el infierno: el más misterioso de los trípticos, que se lee de izquierda a derecha como una historia de la humanidad."
description = """
Abierto, el tríptico se lee de izquierda a derecha. La tabla izquierda muestra el paraíso terrenal: Dios presenta a Eva, recién creada, a Adán que despierta, en medio de animales familiares o exóticos, una jirafa, un elefante, junto a una extraña fuente rosa. El gran panel central es un inmenso jardín poblado por cientos de cuerpos desnudos, hombres y mujeres, que se bañan, se abrazan, cabalgan en ronda en torno a un estanque, se deslizan en conchas, burbujas de cristal y frutas gigantes, fresas, cerezas, moras. A la derecha, el infierno, sumido en la noche y los incendios: instrumentos de música convertidos en instrumentos de suplicio, un monstruo con cabeza de ave que devora a los condenados y un hombre-árbol con el cuerpo de cáscara de huevo rota."""
evocation = """
El sentido del tríptico se debate desde hace siglos. La lectura más extendida ve en él una advertencia: entre la creación de la primera pareja y la condenación, el jardín central mostraría a la humanidad entregada al placer de los sentidos, una voluptuosidad tan frágil como las frutas maduras y las burbujas de cristal que la cobijan. Otros han visto en él un paraíso de inocencia perdida o, en el siglo XX, el ideal secreto de una secta. Las frutas, las aves, los peces tenían entonces connotaciones eróticas que el público culto sabía leer. El Bosco, ferviente católico, miembro de una cofradía religiosa de su ciudad, pinta menos un sueño que un sermón, pero un sermón de una invención tan desbordada que los surrealistas lo adoptaron como antepasado."""
histoire = """
En 1517, un año después de la muerte del Bosco, Antonio de Beatis, secretario de un cardenal en viaje, describe el cuadro en el palacio de los condes de Nassau en Bruselas: es sin duda un encargo de esta gran familia de la corte de Borgoña, quizá de Enrique III de Nassau. En 1568, el duque de Alba lo confisca a Guillermo de Orange, heredero de los Nassau y jefe de la rebelión de los Países Bajos, y pasa a un hijo natural del duque, Fernando de Toledo. A la muerte de este, Felipe II lo compra y lo envía en 1593 al monasterio de El Escorial. Ingresa en el Prado en 1939. Su título actual es moderno: los inventarios españoles lo llamaban, entre otros nombres, el cuadro del madroño, cuyos frutos rojos salpican el jardín."""
facture = """
El Bosco pinta rápido y ligero, en capas finas sobre una preparación clara que hace resplandecer los colores: rosas tiernos, azules de porcelana, verdes ácidos en el jardín, negros y resplandores rojizos de incendio en el infierno. El dibujo subyacente, revelado por la imagen infrarroja, muestra que modificaba sus figuras durante el trabajo. La composición, de horizonte muy alto, superpone los planos sin perspectiva unitaria, lo que permite desplegar una multitud de episodios legibles uno a uno. Cerradas, las puertas muestran en grisalla el mundo en el tercer día de la Creación: un globo transparente donde la tierra emerge de las aguas."""
details = [
  "En el infierno, una línea de música en las nalgas de un condenado aplastado bajo un laúd.",
  "El hombre-árbol del infierno, de rostro melancólico, tomado a veces por un autorretrato.",
  "Un búho acecha en la abertura redonda de la fuente del paraíso.",
  "En el centro, una ronda de jinetes desnudos gira en torno a un estanque de bañistas.",
  "En el infierno, dos orejas gigantes, atravesadas por una flecha, empujan una hoja de cuchillo.",
]
themes = ["paraíso", "infierno", "pecado", "fantástico", "tríptico", "deseo"]
anecdote = """
En 2014, una estudiante estadounidense transcribió la breve melodía pintada en las nalgas de un condenado del infierno, la tocó y la subió a internet: esta música del infierno, de cinco siglos de antigüedad, dio la vuelta a la red."""
salle = 2
mur = "ouest"
place = 2
largeur = 3.6

[[oeuvres]]
titre = "Autorretrato con abrigo de piel"
artiste = "Albrecht Dürer"
annee = "1500"
image = "autoportrait-durer.jpg"
technique = "Óleo sobre tabla de tilo, 67,1 × 48,9 cm"
collection = "Alte Pinakothek, Múnich"
note = "A los 28 años, Durero se pinta de frente, a la manera de una imagen de Cristo: el artista se proclama creador."
description = """
Sobre un fondo casi negro, un hombre de 28 años mira de frente al espectador, en una simetría casi perfecta. Sus largos cabellos rizados, de un castaño dorado, caen en bucles regulares sobre los hombros; una barba cuidada enmarca un rostro grave, de ojos fijos. Lleva un manto pardo ribeteado de espesa piel, de mangas rasgadas, cuyo cuello roza su mano, en la parte inferior del cuadro. A la izquierda, a la altura de los ojos, la fecha 1500 corona su célebre monograma, una gran A que cabalga sobre una D. A la derecha, una inscripción latina en letras de oro dice quién es, de dónde viene y a qué edad se representó. Nada más: ni decorado, ni objeto, ni atributo del oficio."""
evocation = """
Nunca un pintor se había representado así. La pose frontal, reservada hasta entonces a las imágenes de Cristo, la simetría, los cabellos que caen como los del Salvador en los iconos: todo invita a ver a Durero a semejanza de Cristo. No se trata de una blasfemia, sino de una idea de su tiempo: el hombre es creado a imagen de Dios y el artista, por su don, participa del poder creador divino. La mano, en el centro de la parte inferior del cuadro, es el instrumento de ese don. La obra dice también la ambición de un hijo de orfebre que quiere ver la pintura reconocida como arte liberal, digna de un sabio y de un humanista, y ya no como un simple oficio manual."""
histoire = """
Durero pinta esta tabla en Núremberg en 1500, un año cargado de expectativas, que muchos creían cercano al fin de los tiempos. No tiene comitente: es una afirmación de sí mismo, en un momento en que, de regreso de Venecia, mide la distancia entre el prestigio de los pintores italianos y la condición de artesano de los del Norte. El retrato permanece mucho tiempo en Núremberg, donde acaba entrando en las colecciones de la ciudad y exponiéndose en el ayuntamiento. En 1805 es adquirido para las colecciones de Baviera y llega a Múnich; está colgado desde 1836 en la Alte Pinakothek, de la que se ha convertido en una de las obras más célebres."""
facture = """
Durero construye su rostro sobre una trama geométrica, buscando unas proporciones ideales que estudiará toda su vida. El triángulo de la cabellera, el eje vertical de la nariz y la estricta frontalidad dan a la imagen una estabilidad de estatua. Sobre el fondo oscuro, la luz viene de la izquierda y modela el rostro con suavidad. Cada mechón, cada pelo de la piel está trazado con un pincel finísimo, con la precisión de un grabador habituado al buril. Los tonos pardos y dorados, poco numerosos, unifican el conjunto."""
details = [
  "A la izquierda, la fecha 1500 sobre el monograma AD, célebre en toda Europa.",
  "A la derecha, en latín: Durero de Núremberg se pintó así, con sus colores, a los 28 años.",
  "La mano de dedos finos, que pellizca el cuello de piel en la parte inferior del cuadro.",
