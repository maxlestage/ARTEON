[exposition]
ordre = 30
nom_court = "Renacimiento del Norte"
mouvement = "Primitivos flamencos y Renacimiento del Norte"
cadre = "ebene"
couleur = "#3e4f6a"
titre = "Primitivos flamencos y Renacimiento del Norte, el mundo al detalle"
artiste = "Van Eyck, Van der Weyden, Memling, El Bosco, Durero, Cranach, Holbein, Brueghel"
dates = "1434–1568"
accroche = "Exposición virtual · Kunsthistorisches Museum, Viena"
introduction = """
En Brujas, en Bruselas, en Núremberg o en Amberes, los pintores del Norte inventan en los siglos XV y XVI una pintura al óleo de una precisión inaudita, donde cada reflejo, cada pelo de piel, cada brizna de hierba cuenta. La visita sigue ese hilo a lo largo de más de un siglo, desde Los esposos Arnolfini de Van Eyck hasta El jardín de las delicias del Bosco, desde los retratos de Durero, Cranach y Holbein hasta los paisajes y las fiestas aldeanas de Brueghel. El edificio se inspira en el Kunsthistorisches Museum de Viena: se entra bajo un alto vestíbulo con cúpula y después se accede a unas salas de paredes revestidas de tela, entre ellas una gran sala Brueghel, como aquella en la que Viena reúne la colección más rica del mundo de sus cuadros."""
vitrine = "chasseurs-dans-la-neige.jpg"

[musee]
nom = "Kunsthistorisches Museum"
ville = "Viena, Austria"
architecte = "Gottfried Semper y Carl von Hasenauer"
construction = "1871–1891"
presentation = """
En el Ring de Viena, el emperador Francisco José manda levantar dos palacios gemelos que se miran de frente, uno para las ciencias naturales y otro para las colecciones de arte reunidas por los Habsburgo durante siglos. Diseñado por Gottfried Semper y Carl von Hasenauer, el Kunsthistorisches Museum se construye entre 1871 y 1891 y abre sus puertas ese último año. Tras sus fachadas neorrenacentistas coronadas por una cúpula, una gran escalera de mármol, decorada con pinturas de Hans Makart y de Gustav Klimt, conduce al vestíbulo con cúpula y, después, a las galerías de pintura, iluminadas por claraboyas y de paredes revestidas de tela. Allí se ven los Tizianos, los Rubens y los Velázquez de los Habsburgo, los retratos de Durero y, sobre todo, una docena de cuadros de Pieter Brueghel el Viejo, la colección más rica del mundo de sus obras, reunidos en una misma sala. El museo conserva también la Kunstkammer de los Habsburgo, con el salero de oro de Benvenuto Cellini."""
ici = """
El edificio de ARTEON retoma el corazón del museo vienés: una alta sala con cúpula desde la que se accede a las galerías de pintura. Se entra por el sur al vestíbulo con cúpula, cuadrado y de dieciséis metros de altura. Al oeste se abre la sala I · Los primitivos flamencos, de paredes beige cálido; al este, la sala II · El Renacimiento alemán, de paredes verde pálido, dos salas cuadradas de doce metros de lado y siete de altura. Al norte, en el eje, la sala Brueghel, la más vasta, de dieciocho metros de ancho y paredes rosa beige, cierra la visita."""

