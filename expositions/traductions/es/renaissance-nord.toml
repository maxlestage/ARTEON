[[oeuvres]]
titre = "Judit con la cabeza de Holofernes"
artiste = "Lucas Cranach l'Ancien"
annee = "hacia 1530"
image = "judith-cranach.jpg"
technique = "Óleo sobre tabla de tilo, 87,7 × 58,1 cm"
collection = "Kunsthistorisches Museum, Viena"
note = "La heroína bíblica, engalanada como una princesa de la corte de Sajonia, posa la mano sobre la cabeza del general al que acaba de decapitar."
description = """
Una joven vista de medio cuerpo se yergue tras un parapeto de piedra, sobre un fondo negro. Lleva un amplio sombrero de terciopelo rojo, tras el cual flotan plumas blancas, un vestido rojo de corpiño bordado, de mangas abullonadas ceñidas con cordones negros, y varios collares superpuestos. Su larga cabellera pelirroja desciende hasta la cintura. Con la mano derecha, enguantada y cubierta de anillos, sostiene en pie una gran espada; con la izquierda, apoya los dedos en la cabeza barbada de Holofernes, colocada sobre el parapeto, con la boca entreabierta y los ojos en blanco. Su rostro pálido y liso no delata ninguna emoción: mira a lo lejos, como indiferente a su gesto."""
evocation = """
El libro de Judit cuenta cómo una viuda de Betulia, ciudad sitiada por el ejército asirio, seduce al general Holofernes y luego lo decapita mientras duerme, salvando a su pueblo. Judit encarna la virtud y el valor que triunfan sobre la fuerza bruta; en tiempos de la Reforma, se ha leído también en ella la imagen del débil que, con la ayuda de Dios, derriba al tirano. Pero Cranach hace de ella igualmente una figura de seducción: vestida a la última moda de las cortes alemanas, se une a la galería de heroínas ambiguas, Salomé, Lucrecia, Venus, que su taller multiplica para una clientela principesca. El contraste entre su calma impasible y la cabeza cortada crea una turbación a la vez moral y erótica."""
histoire = """
Hacia 1530, Cranach es desde hace un cuarto de siglo el pintor de los príncipes electores de Sajonia en Wittenberg, donde dirige un vasto taller. El tema de Judit conoce allí un gran éxito en la década de 1530: se conocen numerosas versiones, de busto o de medio cuerpo, a veces asociadas a una Salomé. Esta tabla se menciona en las colecciones imperiales de Viena desde la década de 1610, en la época en que los Habsburgo, empezando por el emperador Rodolfo II, buscan con avidez la pintura alemana de la generación de Durero. Hoy forma parte del rico conjunto de obras de Cranach del Kunsthistorisches Museum, que permite seguir la evolución del pintor y de su taller."""
facture = """
Cranach pinta sobre madera de tilo con gran nitidez: contornos precisos, superficies lisas, colores francos sin degradados marcados. El rojo domina, del sombrero a las mangas, y se opone al fondo negro que recorta la silueta como un emblema. La figura, acercada y cortada a la cintura, se sitúa tras un parapeto que sirve a la vez de mesa y de frontera entre la imagen y nosotros. El rostro, de modelado apenas indicado, obedece a un tipo femenino casi idéntico de un cuadro a otro, ojos almendrados, frente alta, mentón pequeño, que el taller reproducía a partir de modelos."""
details = [
  "A la izquierda, junto a la cabeza, la minúscula firma del pintor: una serpiente alada.",
  "Los guantes rasgados, sobre los que se han puesto anillos de oro.",
  "La hoja de la espada, erguida en vertical, que bordea el cuadro como una columna.",
  "Las plumas blancas que flotan en la negrura tras el sombrero.",
  "El cuello cortado de Holofernes, en la parte inferior del cuadro, de un realismo crudo.",
]
themes = ["biblia", "heroína", "seducción", "moda", "corte"]
anecdote = """
La serpiente alada que firma el cuadro procede del escudo de armas concedido a Cranach en 1508 por el elector Federico el Sabio. Hacia 1537, sus alas, hasta entonces erguidas, se abaten como las de un ave: un indicio valioso para fechar las obras del taller."""
salle = 3
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Los embajadores"
artiste = "Hans Holbein le Jeune"
annee = "1533"
image = "ambassadeurs.jpg"
technique = "Óleo sobre tabla de roble, 207 × 209,5 cm"
collection = "National Gallery, Londres"
note = "Dos jóvenes franceses en Londres, rodeados de los instrumentos del saber, y una calavera deformada que flota a sus pies."
description = """
Dos hombres de cuerpo entero, a tamaño natural, flanquean un estante de dos baldas, ante una cortina de damasco verde. A la izquierda, Jean de Dinteville, embajador de Francisco I ante Enrique VIII, lleva un jubón de raso rosa, un amplio manto negro forrado de piel y el medallón de la Orden de San Miguel. A la derecha, su amigo Georges de Selve, obispo de Lavaur, viste una larga túnica parda más austera. En la balda superior, cubierta con una alfombra oriental, instrumentos de astronomía: un globo celeste, relojes de sol, un torquetum. En la balda inferior, un globo terráqueo, un libro de aritmética, un laúd, un estuche de flautas y un libro de cánticos. En primer plano, una forma blanquecina y alargada atraviesa en oblicuo el pavimento."""
evocation = """
El cuadro celebra a dos hombres cultos, en la cumbre de su juventud y de su saber: ciencias del cielo arriba, ciencias de la tierra, del número y de la música abajo. Pero todo está minado. Una cuerda del laúd está rota, posible imagen de la discordia; el libro está abierto por unos cánticos luteranos, cuando Europa se desgarra entre católicos y reformados y mientras Inglaterra inicia ese año su ruptura con Roma. La forma oblicua del primer plano es una calavera, visible solo de soslayo: un memento mori que recuerda que la muerte borra toda gloria. En el ángulo superior izquierdo, medio oculto por la cortina, un pequeño crucifijo parece ofrecer el único recurso."""
histoire = """
En la primavera de 1533, Georges de Selve visita en Londres a Jean de Dinteville, en misión ante Enrique VIII en el momento de la boda del rey con Ana Bolena. Dinteville encarga a Holbein, que había regresado a Inglaterra el año anterior, este doble retrato a tamaño natural, que se lleva a su castillo de Polisy, en Champaña. El cuadro sale de la familia en el siglo XVII, pasa por varias ventas y llega a Inglaterra a finales del siglo XVIII. La National Gallery lo adquiere en 1890 al conde de Radnor. Durante mucho tiempo se ignoró quiénes eran los dos hombres: solo fueron identificados con certeza hacia 1900, gracias sobre todo al nombre de Polisy inscrito en el globo terráqueo."""
facture = """
Holbein une la precisión flamenca a la monumentalidad italiana. Cada materia está representada con una exactitud asombrosa: la seda, el terciopelo, la piel, el latón de los instrumentos, los motivos de la alfombra. La calavera es una anamorfosis, una imagen deliberadamente deformada mediante un cálculo de perspectiva, que solo se endereza vista en ángulo rasante. El pavimento reproduce el dibujo del suelo de mármol del santuario de la abadía de Westminster. La composición, casi cuadrada, descansa en una simetría estable que la oblicua de la calavera viene a romper."""
details = [
  "En la vaina de la daga de Dinteville, su edad: 29 años.",
  "En el canto del libro en que se apoya Georges de Selve, su edad: 25 años.",
  "En el ángulo superior izquierdo, medio oculto por la cortina, un pequeño crucifijo.",
  "En el laúd, una cuerda rota.",
  "En el globo terráqueo, en Francia, el nombre de Polisy, el castillo de Dinteville.",
]
themes = ["retrato", "saber", "vanidad", "muerte", "diplomacia", "anamorfosis"]
anecdote = """
Se ha supuesto que el cuadro estaba colgado cerca de una puerta o de una escalera: al pasar de lado, el visitante veía de pronto enderezarse la calavera. En la National Gallery, todavía hoy la gente se pega a la pared, al borde del cuadro, para verla aparecer."""
salle = 3
mur = "est"
place = 2
largeur = 2.1

[[oeuvres]]
titre = "La Torre de Babel"
artiste = "Pieter Bruegel l'Ancien"
annee = "1563"
image = "tour-de-babel.jpg"
technique = "Óleo sobre tabla de roble, 114 × 155 cm"
collection = "Kunsthistorisches Museum, Viena"
note = "Una torre colosal, inspirada en el Coliseo, se alza a orillas de un puerto flamenco: el sueño de orgullo de los hombres, ya agrietado."
description = """
Una torre inmensa, redonda y de varios pisos, ocupa el centro del cuadro y sobrepasa las nubes. Construida en torno a un peñasco, mezcla las arcadas de un anfiteatro antiguo con andamios, grúas y rampas por las que circulan carros. Los pisos inferiores, de piedra clara, parecen ya desgastados, mientras que la cima, de ladrillo rojo, sigue en obras. A sus pies se extiende una ciudad flamenca de tejados apretados y, a la derecha, un puerto donde atracan navíos y balsas de madera. En primer plano, a la izquierda, el rey Nemrod, con un manto claro, visita las obras con su séquito; ante él, unos canteros se arrodillan y se postran."""
evocation = """
El Génesis cuenta que los hombres, que hablaban todos una misma lengua, quisieron construir una torre cuya cima tocase el cielo; Dios confundió sus lenguas y los dispersó. Brueghel hace de ello una meditación sobre el orgullo. El rey Nemrod, a quien la tradición atribuye la empresa, se hace venerar como un soberano absoluto, mientras que los pisos, que no son horizontales, y los cimientos asentados directamente sobre la roca parecen condenar la obra de antemano. Se ha visto en ella una alusión a Amberes, metrópoli mercantil donde se cruzaban entonces todas las lenguas de Europa, y a la vanidad de los grandes proyectos humanos. El modelo del Coliseo evoca Roma, símbolo de poder, pero también de persecución para muchos contemporáneos."""
histoire = """
Brueghel firma y fecha la tabla en 1563, el año de su boda y de su instalación en Bruselas. Había visto el Coliseo durante su viaje a Italia, una decena de años antes. En 1566, el cuadro pertenece al rico mercader de Amberes Niclaes Jongelinck, gran coleccionista de sus obras. Entra más tarde en las colecciones del emperador Rodolfo II, en Praga, apasionado de la pintura flamenca, y luego en las colecciones imperiales de Viena. Brueghel pintó al menos otra Torre de Babel, más pequeña y más sombría, hoy en el museo Boijmans Van Beuningen de Róterdam, donde la torre, mucho más alta, perfora ya las nubes."""
facture = """
Brueghel describe la obra como un ingeniero: grúas de rueda movidas por hombres que caminan en su interior, andamios, polipastos, cabañas de obreros, todo está observado con exactitud, a una escala minúscula. La vista picada y el horizonte alto reúnen la torre, la ciudad y el puerto en un solo panorama. La luz, procedente de la izquierda, da relieve a la masa clara de la torre, que se recorta sobre el cielo pálido y el mar. El contraste entre el bloque monumental y la multitud de pequeñas figuras hace sentir la escala desmesurada de la empresa."""
details = [
  "En primer plano, el rey Nemrod, coronado, y los canteros arrodillados.",
  "A la derecha de la torre, una grúa de rueda, movida por hombres que caminan en su interior.",
  "En lo más alto, una nube se agarra ya a los últimos pisos.",
  "Los pisos que no son paralelos al suelo: la torre parece inclinarse ya.",
  "En el puerto, unos navíos descargan materiales y una balsa de madera atraca.",
]
themes = ["biblia", "orgullo", "arquitectura", "ciudad", "obra"]
anecdote = """
Brueghel pintó una tercera Torre de Babel, sobre marfil, mencionada en 1577 en el inventario del célebre miniaturista Giulio Clovio, a quien había conocido en Roma. Hoy está perdida."""
salle = 4
mur = "ouest"
place = 2
largeur = 1.7

[[oeuvres]]
titre = "Cazadores en la nieve (El invierno)"
artiste = "Pieter Bruegel l'Ancien"
annee = "1565"
image = "chasseurs-dans-la-neige.jpg"
technique = "Óleo sobre tabla de roble, 116,5 × 162 cm"
collection = "Kunsthistorisches Museum, Viena"
note = "Tres cazadores regresan casi con las manos vacías, con el valle helado a sus pies: uno de los paisajes de invierno más célebres del mundo."
description = """
En primer plano, tres cazadores fatigados suben una colina nevada, seguidos de sus perros de cabezas gachas; uno lleva a la espalda un flaco zorro. A la izquierda, ante una posada cuyo letrero cuelga torcido, unos aldeanos mantienen un gran fuego para chamuscar un cerdo. Una hilera de árboles negros y desnudos marca el descenso hacia el valle, donde se extienden estanques helados cubiertos de diminutos patinadores y jugadores. Más lejos, un pueblo, una iglesia, un molino atrapado por el hielo y, en el horizonte, improbables picos alpinos bajo un cielo verde grisáceo. Unos cuervos están posados en las ramas; una urraca planea sobre el vacío."""
evocation = """
El cuadro capta el invierno tal como se vive: el frío, el hambre, el cansancio del regreso, pero también el juego y la vida colectiva que continúan. A menudo se ha leído en él el ciclo inmutable de las estaciones y el lugar modesto del hombre en la naturaleza. La escasa presa de los cazadores, un solo zorro, contrasta con la alegre agitación de los patinadores: la dureza y la alegría coexisten. El cuadro se ha relacionado también con los inviernos rigurosos de esos años, en el corazón de lo que se llama la Pequeña Edad de Hielo, aunque Brueghel compone un paisaje ideal más que una vista fiel: sus montañas no tienen nada de flamenco."""
histoire = """
La tabla forma parte de una serie de seis cuadros dedicados a los momentos del año, encargada por el mercader de Amberes Niclaes Jongelinck para su residencia. Se conservan cinco: tres están en Viena, Cazadores en la nieve, Día sombrío y El regreso del rebaño, uno en Praga, La siega del heno, y uno en Nueva York, Los segadores. En 1594, la ciudad de Amberes ofrece la serie al archiduque Ernesto de Austria, gobernador de los Países Bajos. A su muerte, al año siguiente, los cuadros pasan a su hermano, el emperador Rodolfo II, y después se incorporan a la colección del archiduque Leopoldo Guillermo y a las colecciones imperiales de Viena."""
facture = """
La composición descansa en una gran diagonal: la línea de los árboles y de los cazadores lleva la mirada desde el ángulo izquierdo hacia la profundidad, de un solo impulso, hasta las montañas. La paleta se reduce a tres registros: el blanco de la nieve, los pardos y negros de las figuras y los árboles, el verde frío y azulado del hielo y del cielo. Esta economía basta para expresar el silencio del aire helado. Las siluetas oscuras sobre fondo blanco y la vista picada evocan la estampa. Brueghel, que había cruzado los Alpes, recompone sus recuerdos de montaña en un valle imaginario."""
details = [
  "El letrero de la posada, medio descolgado: un ciervo y un santo arrodillado.",
  "El flaco zorro que lleva uno de los cazadores, única pieza del día.",
  "Las huellas de pasos de los hombres y de los perros en la nieve fresca.",
  "Abajo a la derecha, la rueda del molino, inmovilizada por el hielo.",
  "La urraca que planea sobre el valle, única mancha en movimiento en el cielo.",
]
themes = ["invierno", "paisaje", "estaciones", "caza", "pueblo", "nieve"]
anecdote = """
El cineasta Andréi Tarkovski admiraba este cuadro: en Solaris (1972), su cámara recorre largamente sus detalles, como un recuerdo de la Tierra para un héroe perdido en el espacio, y recupera su atmósfera en un paisaje de nieve de El espejo (1975)."""
