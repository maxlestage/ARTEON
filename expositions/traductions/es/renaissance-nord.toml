mur = "nord"
place = 3
largeur = 1.8

[[oeuvres]]
titre = "El banquete de bodas"
artiste = "Pieter Bruegel l'Ancien"
annee = "1568"
image = "repas-de-noces.jpg"
technique = "Óleo sobre tabla de roble, 113 × 164 cm"
collection = "Kunsthistorisches Museum, Viena"
note = "En un granero, un banquete de bodas aldeano: la novia preside bajo su corona de papel y los platos llegan sobre una puerta desmontada."
description = """
La escena transcurre en un granero, cuya pared del fondo está hecha de gavillas de trigo amontonadas. Una larga mesa, en diagonal, acoge a los comensales apretados en bancos. En el centro, la novia, con los ojos entornados y las manos juntas, está sentada ante un tapiz verde del que pende una corona de papel. En primer plano, dos hombres con delantal llevan sobre una puerta desmontada unos platos de papilla. A la izquierda, un hombre vierte cerveza en unas jarras; dos gaiteros esperan, uno de ellos mirando los platos con ojo goloso; un niño con un gorro demasiado grande lame su plato, sentado en el suelo. En el extremo derecho, un monje franciscano habla con un hombre vestido de negro, con la espada al cinto."""
evocation = """
Brueghel observa el mundo campesino sin desprecio ni idealización. La alegría es sencilla, la comida modesta, la fiesta a la vez ruidosa y laboriosa. El propio novio sigue sin aparecer: según una costumbre flamenca, no se sentaba a la mesa de honor, y se ha propuesto reconocerlo en el hombre que sirve la bebida o en el que pasa los platos. Algunos ven en el cuadro una crítica de la gula; otros leen en él una simpatía real por la vida colectiva del pueblo. La presencia del monje y del señor, venidos de otros mundos, muestra a una sociedad entera reunida en torno a una mesa, con sus jerarquías y sus intercambios."""
histoire = """
Pintado en Bruselas el año anterior a la muerte de Brueghel, el cuadro pertenece a las escenas campesinas de sus últimos años, junto con La danza de la boda o La danza de los campesinos. Lo adquiere en 1594 en Bruselas el archiduque Ernesto de Austria, gobernador de los Países Bajos, y entra después en la colección del archiduque Leopoldo Guillermo, también gobernador de los Países Bajos en el siglo XVII y gran coleccionista, antes de incorporarse a las colecciones imperiales de Viena. El borde inferior de la tabla fue recortado y luego completado con una banda de cinco centímetros. La composición fue copiada en numerosas ocasiones, entre otros por Pieter Brueghel el Joven, hijo del pintor."""
facture = """
La mesa, colocada en diagonal, crea una profundidad inmediata y conduce la mirada del primer plano al fondo del granero. Las figuras delanteras, macizas y casi cortadas por el marco, están pintadas a gran escala, como si el espectador acabara de entrar. Brueghel reparte colores francos en un ritmo regular: rojos de los gorros y de los jubones, blancos de los delantales y de las tocas, verde del tapiz que aísla a la novia. Los gestos, las posturas, el paso de los portadores están observados con una justeza que hace de cada comensal un carácter."""
details = [
  "La corona de papel suspendida sobre la novia, ante el tapiz verde.",
  "El gaitero que mira de reojo los platos de papilla.",
  "El niño sentado en el suelo, con un gorro rojo demasiado grande, que lame su plato.",
  "Los platos llevados sobre una puerta sacada de sus goznes.",
  "Al fondo a la izquierda, la multitud de invitados que se apiña a la entrada del granero.",
]
themes = ["fiesta", "campesinos", "boda", "banquete", "pueblo", "música"]
anecdote = """
Según el biógrafo Karel van Mander, en 1604, Brueghel y su amigo el mercader Hans Franckert se disfrazaban de campesinos para mezclarse en las kermeses y las bodas de aldea, llevando regalos como si fueran de la familia."""
