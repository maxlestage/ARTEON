[[oeuvres]]
titre = "El niño judío (Bambino ebreo)"
artiste = "Medardo Rosso"
annee = "hacia 1892"
image = "enfant-juif.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1970.33"
technique = "Cera sobre yeso"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "En la cera, Rosso capta un rostro de niño que parece a la vez formarse y desvanecerse, como una impresión."
description = """
Una pequeña cabeza de niño, con la parte alta de los hombros, emerge de una masa de materia \
clara, de un blanco crema manchado de pardo. Los rasgos apenas están fijados: los ojos, \
bajos o cerrados, son solo dos huecos de sombra; la nariz, pequeña y redonda, y los \
labios apretados se adivinan más de lo que se ven. Las mejillas son llenas, el \
mentón redondo. El cabello no está esculpido: una colada irregular cubre el \
cráneo, y en un lado la materia forma un abultamiento, como una oreja o un \
bucle. La cabeza se inclina ligeramente. La superficie, lisa y brillante en algunos puntos, \
rugosa en otros, tiene el aspecto de una carne translúcida. Sobre el fondo gris oscuro de la \
fotografía, la luz que viene de la izquierda deja parte del rostro en \
la bruma."""
evocation = """
Rosso quería captar una impresión, como los pintores impresionistas: el modo en que \
un rostro se nos aparece un instante, bajo cierta luz, antes de \
desvanecerse. El museo de Cleveland subraya que utilizó la fluidez de la cera \
para sugerir el movimiento fugaz de una expresión infantil y la fragilidad de \
la propia infancia. Casi nada se sabe de la modelo; solo el título la designa. \
Pero lo esencial está en otra parte: este rostro que se disuelve en la materia anuncia una \
escultura hecha de luz y de atmósfera más que de contornos. Rosso tenía \
esta cabeza por una de sus obras más logradas, y los futuristas, Boccioni \
a la cabeza, verán en él a un precursor."""
histoire = """
Tras ser expulsado de la Academia de Brera, en Milán, Medardo Rosso se instala en \
París en 1889. Frecuenta allí los ambientes de vanguardia y traba amistad con Rodin, \
antes de que los dos escultores se enemisten. Hacia 1892, modela El niño judío, \
que retomará muchas veces, en cera, en yeso o en bronce, como la mayoría \
de sus temas: su obra cuenta con pocos temas, retomados y variados sin cesar. \
Expone sus ceras en París, y luego por toda Europa. En 1912, en su Manifiesto \
técnico de la escultura futurista, Boccioni lo saluda como el único gran escultor \
moderno que intentó abrir la escultura al espacio y a la luz que \
la rodean."""
facture = """
Rosso vierte primero un yeso, y luego lo recubre con una capa de cera caliente, que \
retoca hasta obtener el efecto deseado. La cera, ligeramente translúcida, recoge la \
luz como una piel; permite pasos insensibles del relieve al hueco, \
sin arista ni contorno. Según el museo de Cleveland, Rosso cultivaba voluntariamente \
superficies ásperas, sin pulir, lejos del acabado de las esculturas de salón. La parte baja del \
busto se pierde en una masa informe, sin pedestal: la cabeza no se destaca de la \
materia, emerge de ella. La obra está pensada para verse de frente, desde un solo punto \
de vista, como un cuadro. Las manchas pardas que jaspean la cera añaden a \
la impresión de carne y de tiempo."""
details = [
  "Los ojos, reducidos a dos huecos de sombra.",
  "La colada de cera que cubre el cráneo a modo de cabello.",
  "Las manchas pardas que jaspean la cera clara.",
  "La parte baja del busto, que se pierde en una masa informe.",
]
themes = ["infancia", "cera", "luz", "impresión", "rostro"]
anecdote = """
Rosso fotografiaba él mismo sus esculturas, eligiendo el ángulo y la iluminación, \
y retocaba a veces sus copias: quería que se vieran sus obras tal como las \
había concebido, desde un solo punto de vista."""
salle = 5
mur = "nord"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Cabeza hierática de Ezra Pound"
artiste = "Henri Gaudier-Brzeska"
annee = "1914"
image = "ezra-pound.jpg"
cadre = "noir"
credit = "Photo : National Gallery of Art"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.143144.html"
technique = "Mármol, talla directa; 90,5 × 45,7 × 48,9 cm, unos 310 kg"
collection = "National Gallery of Art, Washington"
note = "Tallada en un bloque de mármol de más de 300 kilos, la cabeza del poeta se convierte en un ídolo: un retrato vorticista."
description = """
Una cabeza de mármol claro, de casi un metro de altura, se alza como un mojón o un \
menhir. El rostro se reduce a unas pocas formas geométricas talladas en seco: una nariz \
recta en largo prisma, dos arcadas horizontales bajo las cuales los ojos son solo \
rendijas, un bigote de puntas curvadas hacia abajo, como un doble \
gancho, y una perilla en triángulo agudo. La cabellera forma en lo alto un volumen \
redondeado, excavado con una especie de chevron. El resto del bloque es casi liso: sin \
orejas, sin cuello diferenciado, una base que se ensancha como unos hombros. El mármol, \
de un blanco cálido ligeramente rosado, está recorrido por finas vetas grises y por una \
fisura cerca de la base. Vista de tres cuartos, la cabeza parece mirar a lo lejos, \
impasible."""
evocation = """
Hierático: la palabra designa lo que es sagrado, fijado en una actitud solemne, \
como las estatuas del antiguo Egipto. Gaudier-Brzeska no busca el \
parecido; hace del poeta una figura de autoridad, casi un dios, algo \
parecido a un tótem. Se reconocen sin embargo la perilla y el bigote que llevaba Pound. \
A menudo se ha señalado también la silueta fálica del bloque, símbolo de energía \
creadora. La obra es uno de los manifiestos del vorticismo, el movimiento bautizado por \
el propio Pound, que quería captar la energía del mundo moderno en formas \
tensas y concentradas, como en el centro de un torbellino. Un siglo después, \
es una de las imágenes más fuertes de la vanguardia londinense anterior a 1914."""
histoire = """
Llegado a Londres en 1911, Henri Gaudier-Brzeska conoce al poeta estadounidense Ezra \
Pound en 1913. Los dos hombres se hacen amigos, y Pound, que defiende al joven \
escultor, le procura el bloque de mármol de su retrato. Gaudier lo talla a comienzos \
de 1914, a los veintidós años. Ese mismo año aparece la revista Blast, manifiesto del \
vorticismo, donde publica un texto resonante sobre la historia de la escultura. En \
agosto de 1914, regresa a Francia para alistarse; muere en el frente, en \
Neuville-Saint-Vaast, el 5 de junio de 1915. Pound le consagra en 1916 un libro de \
recuerdos, y la cabeza de mármol permanece largo tiempo en su posesión, como el retrato \
del amigo desaparecido."""
facture = """
Gaudier-Brzeska practica la talla directa: ataca él mismo el bloque, sin \
modelo de yeso que unos oficiales ampliarían, como hacía Rodin. \
Respeta la masa de la piedra, de la que la cabeza conserva la forma compacta y el peso \
de más de trescientos kilos. Los rasgos se obtienen con unas pocas muescas y \
planos que se encuentran en ángulo vivo: es la sombra, más que el relieve, la que dibuja \
los ojos, el bigote y la boca. A menudo se acerca la obra a las grandes \
estatuas de la isla de Pascua, como la que Gaudier podía ver en el British Museum, \
que frecuentaba asiduamente. La superficie, ligeramente granulosa, conserva la huella de la \
herramienta."""
details = [
  "El bigote curvado, tallado como un doble gancho.",
  "La perilla en triángulo, apuntada hacia abajo.",
  "Los ojos reducidos a rendijas bajo las arcadas horizontales.",
  "El chevron excavado en la masa de la cabellera.",
  "La fina fisura que corre cerca de la base del mármol.",
]
