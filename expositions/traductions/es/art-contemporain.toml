[exposition]
ordre = 210
nom_court = "Escultura moderna"
mouvement = "Escultura moderna, de Rodin al futurismo"
cadre = "aucun"
couleur = "#9a4a2c"
titre = "En los orígenes de la escultura de hoy, de Rodin a Gaudier-Brzeska"
artiste = "Rodin, Lehmbruck, Saint-Gaudens, Barlach, Boccioni, Duchamp-Villon, Rosso, Gaudier-Brzeska"
dates = "1875–1916"
accroche = "Exposición virtual · Tate Modern, Londres"
introduction = """
¿Cómo llegó la escultura a ser moderna? En unos cuarenta años, desde \
La edad de bronce de Rodin hasta las cabezas talladas por Gaudier-Brzeska en vísperas de la \
Gran Guerra, los escultores renuncian al relato y a la alegoría para hacer hablar \
al cuerpo, a la materia y al movimiento. La visita reúne diez obras de ocho artistas, \
franceses, alemanes, italianos y estadounidense: grandes cuerpos desnudos, monumentos a la \
memoria, el futurismo que quiere esculpir la velocidad, el cubismo que talla la forma \
en facetas, rostros que se disuelven en la luz o se transforman en ídolos. \
Como las obras de hoy están protegidas por los derechos de autor, la exposición remonta \
a sus fuentes: sin estos pioneros, ni Giacometti, ni Moore, ni Louise Bourgeois \
habrían esculpido como lo hicieron. El edificio se inspira en la Tate Modern de \
Londres: un vestíbulo, luego la inmensa nave de la antigua sala de turbinas, y tres \
galerías en sucesión al norte."""
vitrine = "age-d-airain.jpg"

[musee]
nom = "Tate Modern"
ville = "Londres, Reino Unido"
architecte = "Giles Gilbert Scott (la central); Herzog & de Meuron (el museo)"
construction = "1947–1963 (la central); museo inaugurado en 2000"
presentation = """
En la orilla sur del Támesis, frente a la catedral de San Pablo, la central eléctrica \
de Bankside se construye en dos etapas, de 1947 a 1963, según los planos de Sir Giles \
Gilbert Scott, el arquitecto de la central de Battersea. Este largo edificio de ladrillo, \
dominado por una chimenea de 99 metros, deja de funcionar en 1981. En 1995, la Tate \
elige a los arquitectos suizos Herzog & de Meuron para convertirlo en su museo de arte \
moderno y contemporáneo. Conservan la envoltura de ladrillo, colocan sobre el tejado una \
larga caja de vidrio luminosa y transforman la antigua sala de turbinas, vaciada de sus \
máquinas, en una nave de 3400 metros cuadrados que atraviesa todo el edificio y a la que se \
desciende por una rampa de suave pendiente. La reina Isabel II inaugura la Tate Modern el \
11 de mayo de 2000. Cada año se invita a un artista a ocupar esta nave: Louise \
Bourgeois abre la serie en 2000. En 2016, una torre de ladrillo calado, hoy el \
Blavatnik Building, amplía el museo, cuyas colecciones permanentes son \
gratuitas."""
ici = """
El edificio de ARTEON recoge la idea maestra de la Tate Modern: una nave inmensa \
entre la calle y las galerías. Se entra por el sur en el vestíbulo sur, y se desemboca \
en el Turbine Hall, de 44 metros de largo y 20 de alto, de muros de hormigón claro, donde \
se exponen los grandes cuerpos: La edad de bronce y el Adán de Rodin, la Mujer de pie \
de Lehmbruck y la Victoria dorada de Saint-Gaudens. Al norte, como las galerías \
orientadas al Támesis, tres salas blancas se comunican en sucesión, de oeste a \
este: «Memoria y monumentos», con Rodin y Barlach, «El movimiento», con \
Boccioni y Duchamp-Villon, y luego «Rostros nuevos», con Medardo Rosso y \
Gaudier-Brzeska."""

