[[artistes]]
nom = "Auguste Rodin"
vie = "París, 12 de noviembre de 1840 – Meudon, 17 de noviembre de 1917"
biographie = """
Hijo de un empleado de la prefectura de policía, Auguste Rodin aprende dibujo en la \
Petite École, pero fracasa tres veces en el concurso de la Escuela de Bellas Artes. \
Trabaja largo tiempo para otros, como ornamentista y oficial, en París y luego en \
Bruselas, donde se instala tras la guerra de 1870. Un viaje a Italia, en \
1875–1876, le revela a Miguel Ángel. La edad de bronce, expuesta en 1877, lo da a conocer \
entre escándalos. En 1880, el Estado le encarga La puerta del Infierno, inspirada en \
Dante, en la que trabajará hasta su muerte y de la que nacen Adán, El pensador \
y El beso. Siguen Los burgueses de Calais, inaugurados en 1895, y el Balzac, \
rechazado por sus clientes en 1898. La Exposición Universal de 1900, donde \
presenta su obra en un pabellón propio, le aporta una gloria \
internacional. En 1916, dona al Estado sus obras y sus colecciones; muere \
al año siguiente en Meudon."""
style = """
Rodin libera la escultura del relato y de las convenciones académicas: modela por \
abultamientos y huecos que hacen vibrar la luz, conserva la huella de los dedos, se atreve con el \
fragmento, lo inacabado, la repetición de una misma figura. El cuerpo solo expresa el \
pensamiento y la pasión. Casi todos los escultores de esta exposición se \
definieron con él o contra él."""

[[artistes]]
nom = "Wilhelm Lehmbruck"
vie = "Meiderich (Duisburgo), 4 de enero de 1881 – Berlín, 25 de marzo de 1919"
biographie = """
Hijo de un minero del Ruhr, Wilhelm Lehmbruck estudia en la escuela de artes decorativas \
y luego en la Academia de Bellas Artes de Düsseldorf. Sus primeras obras deben mucho \
a Rodin y a la escultura monumental de su tiempo. En 1910, se instala en París, \
donde descubre a Maillol y traba amistad con Brancusi, Archipenko y Modigliani. Su Mujer \
arrodillada, de 1911, de miembros desmesuradamente estirados, es saludada como una obra \
mayor y viaja hasta Nueva York, al Armory Show de 1913. La guerra lo devuelve a \
Alemania: empleado en un hospital militar de Berlín, queda conmovido por los \
sufrimientos de los heridos y esculpe El hombre abatido, monumento a la desolación de los \
soldados. Se refugia en Zúrich en 1916. De vuelta en Berlín al final de la guerra, elegido miembro de \
la Academia Prusiana de las Artes, pone fin a sus días en marzo de 1919, a los treinta y ocho \
años. En 1937, los nazis lo clasifican entre los artistas «degenerados»."""
style = """
Lehmbruck parte de la plenitud clásica de Maillol para ir hacia figuras \
alargadas, graves y melancólicas, donde el alargamiento de los miembros expresa el recogimiento \
o el dolor. Sin gestos espectaculares, sus cuerpos expresan un estado interior: es \
uno de los grandes escultores del expresionismo alemán."""

[[artistes]]
nom = "Augustus Saint-Gaudens"
vie = "Dublín (Irlanda), 1 de marzo de 1848 – Cornish (Nuevo Hampshire), 3 de agosto de 1907"
biographie = """
Hijo de un zapatero francés y de una madre irlandesa, Augustus Saint-Gaudens tiene seis \
meses cuando su familia deja Dublín para Nueva York. A los trece años, entra de \
aprendiz con un grabador de camafeos, a la vez que sigue clases nocturnas de dibujo. \
En 1867, parte a París e ingresa en la Escuela de Bellas Artes, y luego se instala en Roma. \
De regreso a Estados Unidos, se da a conocer con el monumento al almirante Farragut, \
inaugurado en Nueva York en 1881. Siguen el Lincoln de pie de Chicago, el memorial Adams \
en Washington, figura velada y meditativa, y el memorial al coronel Shaw y a su \
regimiento de soldados negros, en Boston, en 1897. Vive en París de 1897 a 1900, y luego \
se instala en Cornish, en Nuevo Hampshire, donde se forma a su alrededor una colonia de \
artistas. En 1907, el año de su muerte, dibuja una moneda de oro de veinte dólares, \
considerada a menudo la más hermosa de las monedas estadounidenses."""
style = """
Saint-Gaudens une la ciencia académica aprendida en París a un realismo directo y \
sensible. Sus monumentos, retratos y relieves dan a la alegoría un rostro \
humano. Es el mayor escultor estadounidense de su tiempo, el heredero más \
cumplido de la tradición de las Bellas Artes en el momento en que los modernos la \
ponen en cuestión."""

[[artistes]]
nom = "Ernst Barlach"
vie = "Wedel (Holstein), 2 de enero de 1870 – Rostock, 24 de octubre de 1938"
biographie = """
Hijo de un médico, Ernst Barlach estudia artes decorativas en Hamburgo, luego \
escultura en la Academia de Dresde, y reside en París a mediados de los años 1890. \
Durante varios años, busca su camino entre la cerámica, la ilustración y la \
escultura decorativa. Un viaje a Rusia, en 1906, es una revelación: los campesinos \
y los mendigos de las estepas le inspiran figuras macizas, envueltas en \
sus ropas. Apoyado por el marchante berlinés Paul Cassirer, se instala en \
1910 en Güstrow, en Mecklemburgo. Es también un autor de teatro reconocido y un \
grabador en madera. Tras la Primera Guerra Mundial, crea monumentos a los caídos \
para Güstrow, Kiel, Magdeburgo o Hamburgo, obras de duelo más que de gloria. Los \
nazis lo juzgan «degenerado»: sus monumentos son retirados, cientos de sus \
obras confiscadas en los museos. Aislado, muere en Rostock en 1938."""
style = """
Barlach esculpe cuerpos envueltos, reducidos a masas simples y cerradas, \
talladas en grandes planos como la madera. Heredero de la escultura gótica alemana, \
da a figuras humildes, mendigos, campesinos, mujeres rezando, una intensidad \
espiritual: miedo, espera, ímpetu, éxtasis o duelo."""

[[artistes]]
nom = "Umberto Boccioni"
vie = "Reggio Calabria, 19 de octubre de 1882 – Sorte, cerca de Verona, 17 de agosto de 1916"
biographie = """
Umberto Boccioni crece según los destinos de su padre, funcionario, y luego \
se instala en Roma en 1901. Con su amigo Gino Severini, aprende junto a Giacomo \
Balla la pintura divisionista, hecha de pinceladas de color puro. Tras estancias \
en París y en Rusia, se establece en Milán en 1907. En 1910, conoce al poeta \
Marinetti, fundador del futurismo, y firma el Manifiesto de los pintores futuristas; su \
gran lienzo La ciudad que sube celebra la energía de la ciudad moderna. En 1912, \
expone en París con los futuristas, descubre la escultura cubista y publica el \
Manifiesto técnico de la escultura futurista. Sus Formas únicas de continuidad \
en el espacio, de 1913, se convierten en el icono del movimiento. Partidario de la entrada en \
guerra de Italia, se alista en 1915. Muere en agosto de 1916, a los treinta y tres años, \
tras una caída de caballo durante un ejercicio militar, cerca de Verona."""
style = """
Boccioni quiere pintar y esculpir el movimiento, la velocidad, la vida moderna. En sus \
esculturas, el objeto se prolonga en el espacio, se mezcla con su entorno, estalla en \
planos que se penetran. Muerto joven, dejó pocas obras, pero sus ideas han \
alimentado toda la escultura del siglo XX."""

[[artistes]]
nom = "Raymond Duchamp-Villon"
vie = "Damville (Eure), 5 de noviembre de 1876 – Cannes, 9 de octubre de 1918"
biographie = """
Hijo de un notario normando, Raymond Duchamp crece en una familia de artistas: su \
hermano mayor se convierte en el pintor Jacques Villon, sus hermanos menores Marcel y Suzanne Duchamp \
serán también pintores. Comienza estudios de medicina en París, pero una \
grave crisis de reumatismo lo obliga a abandonarlos; durante su convalecencia, se \
pone a esculpir, de forma autodidacta, y pronto expone en los Salones parisinos. \
Hacia 1911, las reuniones de Puteaux, en casa de su hermano Jacques, lo acercan a los \
cubistas. En 1912, concibe la fachada de la «Maison cubiste» presentada en el Salón \
de Otoño y participa en el Salón de la Sección de Oro; en 1913, expone en el Armory \
Show de Nueva York. En 1914, termina su obra maestra, El caballo; movilizado en el \
servicio de sanidad, esculpe aún, cerca del frente, El gallo galo. Aquejado de fiebre \
tifoidea en 1916, muere en 1918 en el hospital militar de Cannes."""
style = """
Duchamp-Villon es uno de los primeros escultores cubistas. Reduce lo vivo a \
formas simples y tensas, que encajan como piezas mecánicas, para expresar \
la energía más que la apariencia. Escultor y arquitecto de corazón, buscaba una \
síntesis entre lo orgánico y la máquina."""

[[artistes]]
nom = "Medardo Rosso"
vie = "Turín, 21 de junio de 1858 – Milán, 31 de marzo de 1928"
biographie = """
Medardo Rosso crece en el norte de Italia, en Milán sobre todo. Ingresa en 1882 en \
la Academia de Brera, de la que es expulsado al año siguiente por indisciplina. Sus primeras obras muestran \
temas populares, niños, porteras, cantantes callejeros. En 1889, se \
instala en París, donde vivirá largo tiempo; frecuenta los ambientes \
impresionistas, traba amistad con Rodin y luego se enemista con él, convencido de que su \
Balzac debe mucho a sus propias investigaciones. Expone sus ceras en París y por \
toda Europa, y encuentra defensores entre los críticos y los \
coleccionistas. Tras Ecce Puer, en 1906, ya apenas crea temas nuevos \
y retoma sin fin sus obras antiguas. De regreso en Italia, es saludado por los \
futuristas como un precursor. Muere en Milán en 1928."""
style = """
Rosso es el escultor de la impresión: quiere expresar lo que el ojo percibe en un \
instante, un rostro en la luz, una silueta en la calle. Sus ceras, de formas \
fundidas y sin contorno, se miran desde un solo punto de vista, como cuadros, y \
abren la escultura al espacio y a la atmósfera."""

[[artistes]]
nom = "Henri Gaudier-Brzeska"
vie = "Saint-Jean-de-Braye (Loiret), 4 de octubre de 1891 – Neuville-Saint-Vaast (Paso de Calais), 5 de junio de 1915"
biographie = """
Hijo de un carpintero de los alrededores de Orleans, Henri Gaudier es un alumno brillante. \
Gracias a becas, estudia en Inglaterra y viaja a Alemania, donde dibuja \
sin descanso en los museos. En París, en 1910, conoce a Sophie Brzeska, \
escritora polaca casi veinte años mayor que él; viven juntos, y él \
añade su apellido al suyo. La pareja parte a Londres en 1911. Pobre, Gaudier esculpe \
de noche, dibuja los animales del zoo y estudia las antigüedades del British Museum. Traba \
amistad con Ezra Pound, el pintor Wyndham Lewis y el escultor Jacob Epstein, y \
participa en 1914 en el vorticismo y en su revista, Blast. Cuando estalla la guerra, \
regresa a Francia para alistarse. Distinguido por su valor, muere en el Artois, en \
Neuville-Saint-Vaast, el 5 de junio de 1915, a los veintitrés años. Desde las trincheras, \
aún había enviado a Blast un último texto sobre la escultura."""
style = """
Gaudier-Brzeska defiende la talla directa, la energía de los volúmenes y la lección de las artes \
antiguas y lejanas, de Egipto, África u Oceanía. En solo cuatro años de trabajo, \
pasa del modelado heredado de Rodin a formas geométricas, compactas y \
poderosas, que anuncian la escultura inglesa del siglo XX."""
