[[oeuvres]]
titre = "La edad de bronce"
artiste = "Auguste Rodin"
annee = "1875–1876"
image = "age-d-airain.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1918.328"
technique = "Bronce, tamaño natural; fundición encargada en 1916 y supervisada por el artista"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "Un joven desnudo despierta, con la mano sobre la cabeza: tan verdadero que se acusó a Rodin de haberlo vaciado de un modelo vivo."
description = """
Un joven desnudo, de tamaño natural, está de pie sobre un pedestal cuadrado. Su brazo \
derecho está doblado sobre la cabeza, con la mano posada en la coronilla, como \
si saliera del sueño o de un ensueño. El brazo izquierdo también está alzado, doblado por el \
codo, con el puño cerrado a la altura del rostro en torno a un objeto que ya no está. El \
rostro, vuelto hacia lo alto, tiene los ojos entornados y la boca entreabierta. Las piernas \
están juntas, una rodilla ligeramente flexionada, y todo el cuerpo parece ascender, de los \
pies hasta el codo erguido. Sobre el fondo gris de la fotografía, el bronce muy \
oscuro conserva reflejos rojizos allí donde la luz acaricia los hombros, el torso \
y los muslos, y una ligera sombra se alarga tras la estatua."""
evocation = """
Cuando la muestra por primera vez, en Bruselas, Rodin llama a su figura El \
vencido, y el joven sostiene una lanza: se ha visto en él a un soldado herido, quizá un \
eco de la derrota francesa de 1870. Al retirar el arma, el escultor borra \
la anécdota. El título definitivo remite a las edades de la humanidad imaginadas por los poetas \
antiguos; se lee en él el despertar del hombre a la conciencia, la humanidad que sale de la \
noche. Rodin deja sin embargo el sentido abierto: sin atributo ni relato, es el cuerpo \
solo, su ímpetu y su fatiga, lo que transmite la emoción. Para el museo de Cleveland, esta \
figura enigmática expresa la sensualidad y el poder psicológico del desnudo masculino. \
Ahí comienza la escultura moderna: una estatua que ya no cuenta una historia."""
histoire = """
Rodin, que vive entonces en Bruselas, trabaja durante largos meses en esta figura a partir de un \
joven soldado belga, antes y después de un viaje a Italia donde descubre a Miguel Ángel. \
Presentado en Bruselas a comienzos de 1877, y luego en el Salón de París el mismo año, el \
yeso causa escándalo: el modelado es tan exacto que se sospecha que el escultor haya \
vaciado directamente el cuerpo de su modelo, una trampa a los ojos de la Academia. Rodin \
se defiende con fotografías y testimonios; en 1880, el Estado le compra \
la obra y manda fundir un bronce. La edición de Cleveland tiene una historia aparte: \
en 1916, Ralph King, administrador del museo, la encarga al artista para donarla a \
la institución. Rodin, ya al final de su vida, supervisa él mismo la fundición, de una \
calidad excepcional según el museo."""
facture = """
Rodin modela su figura en arcilla girando en torno a su modelo, perfil tras \
perfil, para captar el cuerpo desde todos los ángulos: conservará este método toda su \
vida. De ello resulta una superficie de gran finura, donde los músculos no se \
subrayan como en las figuras académicas, sino que se adivinan bajo la piel, en el juego \
de la luz. Esa misma exactitud hizo nacer la sospecha del vaciado. La \
edición de Cleveland recibió la pátina que prefería el escultor, de un rojo oscuro \
al que llamaba, según refiere el museo, «uva aplastada»; se adivina en la \
fotografía. Privado de su lanza, el puño izquierdo permanece cerrado sobre el vacío, y ese gesto \
suspendido añade misterio a la figura."""
details = [
  "La mano derecha posada en la coronilla, como al salir del sueño.",
  "El puño izquierdo cerrado sobre una lanza desaparecida.",
  "Los ojos entornados y la boca entreabierta del rostro alzado.",
  "Los reflejos rojizos de la pátina sobre los hombros y el torso.",
  "El pedestal cuadrado, desnudo, sin roca ni accesorio.",
]
themes = ["despertar", "cuerpo", "juventud", "bronce", "escándalo"]
anecdote = """
Para probar su buena fe, Rodin hizo fotografiar a su modelo, un joven soldado belga \
llamado Auguste Neyt, para que se pudieran comparar el cuerpo vivo y la estatua, y \
pidió a otros escultores que testificaran que modelaba sin vaciado."""
salle = 2
mur = "ouest"
place = 3
largeur = 3.2

[[oeuvres]]
titre = "Adán"
artiste = "Auguste Rodin"
annee = "modelo de 1881"
image = "adam.jpg"
cadre = "noir"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/11320"
technique = "Bronce con pátina marrón oscura, fundido hacia 1924; 198,1 × 73,7 cm, base de 76,2 × 73,7 cm"
collection = "Art Institute of Chicago, Chicago"
note = "Concebido para alzarse ante La puerta del Infierno, el primer hombre parece a la vez nacer y desplomarse."
description = """
Un hombre desnudo, de poderosa musculatura, está de pie sobre una base rocosa, pero nada en \
él es recto. Su cabeza cae pesadamente de lado, casi recostada sobre el hombro, \
como si el cuello ya no pudiera sostenerla. Una pierna está levantada, con el pie apoyado en una \
piedra, la rodilla adelantada; una mano se agarra a ella, al extremo de un brazo retorcido que \
atraviesa el cuerpo. El otro brazo cuelga a lo largo del flanco, con el índice extendido hacia el suelo. Los \
hombros, el pecho y los antebrazos son nudosos, surcados de músculos y venas. \
En la fotografía, tomada de tres cuartos ante un fondo gris claro, la pátina marrón \
oscura brilla sobre los relieves y deja los huecos en sombra, de modo que la figura \
parece esculpida por la luz."""
evocation = """
Rodin bebió en Miguel Ángel, como recuerda el Art Institute de Chicago. La pose \
procede de la Creación de Adán pintada en el techo de la Capilla Sixtina: Rodin endereza \
la figura recostada del fresco y traslada al brazo derecho de su estatua el \
gesto con que Adán recibe la vida. La torsión del brazo izquierdo procede de otra \
obra de Miguel Ángel, el Cristo muerto de la Piedad de Florencia. Rodin mezcla así el \
nacimiento y la muerte: el primer hombre, apenas sacado de la tierra, lleva ya el \
peso de la culpa que transmitirá a la humanidad. Ante La puerta del Infierno, \
debía recibir al visitante junto a Eva, la pareja por la que, según la Biblia, el mal \
entra en el mundo."""
histoire = """
En 1880, el Estado encarga a Rodin una puerta de bronce para un futuro museo de Artes \
Decorativas, en París; el escultor elige el Infierno de Dante. Prevé flanquear \
esta Puerta del Infierno con dos grandes figuras, Adán y Eva, y modela Adán desde \
1881. Pero el museo nunca ve la luz, la puerta no se funde en vida del \
artista, y las dos estatuas cobran independencia. Rodin no deja sin embargo de \
reutilizar su figura: de ella saca Las tres sombras, que coronan la Puerta. En \
1916, dona al Estado su obra con el derecho de tirar pruebas; así es como \
el bronce de Chicago fue fundido hacia 1924, unos años después de su muerte, \
a partir de su modelo."""
facture = """
Adán mide casi dos metros: es mayor que el natural, y Rodin exagera \
aún más lo que la naturaleza propone. Las manos son enormes, el cuello se quiebra casi en \
ángulo recto, el busto se tuerce en un sentido y las piernas en el otro. Ningún modelo \
podría mantener mucho tiempo esta pose, que no tiene nada de equilibrio; es la \
roca, bajo el pie levantado, la que parece retener la figura. El modelado procede por abultamientos \
y huecos, acentúa los tendones y las venas, y deja aquí y allá la huella de la \
mano. La base rocosa, apenas desbastada, forma parte de la obra: el primer hombre \
sale aún de la materia bruta de la que fue formado."""
details = [
  "La cabeza que cae, casi en ángulo recto con el cuello.",
  "El índice apuntado hacia el suelo, tomado del gesto del Adán de Miguel Ángel.",
  "El brazo retorcido que atraviesa el cuerpo para agarrar la rodilla.",
  "El pie crispado sobre una piedra, con los dedos aferrados.",
  "Las venas marcadas de los antebrazos y de las manos.",
]
themes = ["creación", "dante", "miguel ángel", "cuerpo", "culpa"]
anecdote = """
En lo alto de La puerta del Infierno, Las tres sombras son tres ejemplares de una misma \
figura derivada de Adán, dispuestos en círculo, con las cabezas inclinadas, como tres condenados \
que señalan el abismo. A Rodin le gustaba así repetir y ensamblar una misma forma."""
salle = 2
mur = "est"
place = 3
largeur = 3.2

[[oeuvres]]
titre = "Mujer de pie (Stehende weibliche Figur)"
artiste = "Wilhelm Lehmbruck"
annee = "modelo de 1910"
image = "femme-debout.jpg"
cadre = "noir"
credit = "Photo : National Gallery of Art"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.50290.html"
technique = "Bronce, fundido en Múnich en 1957; 191,2 × 54 × 39,9 cm"
collection = "National Gallery of Art, Washington"
note = "Alta, serena, con los ojos bajos, una mujer sujeta su paño: en 1910, en París, Lehmbruck busca la paz de las formas."
description = """
Una mujer desnuda está de pie, casi inmóvil, sobre una base baja de bordes \
irregulares. Su mano derecha sujeta sobre la cadera un paño que resbala y envuelve sus \
piernas hasta los tobillos, en largos pliegues verticales. La mano izquierda cuelga, abierta, a lo \
largo del cuerpo. La cabeza, pequeña, se inclina suavemente de lado y hacia abajo; con \
los párpados bajos, los rasgos regulares, parece absorta en sus pensamientos. El \
cabello está recogido hacia atrás. El cuerpo es sólido, de caderas anchas y hombros \
redondeados, pero las piernas, ceñidas por la tela, lo alargan como una columna. Sobre \
el fondo blanco de la fotografía, la pátina oscura, verdosa en algunos puntos, se cubre \
de reflejos claros en el pecho, el vientre y las rodillas."""
evocation = """
Nada cuenta aquí una historia: ni nombre de diosa, ni atributo. El gesto de sujetar \
un paño recuerda a las Venus antiguas saliendo del baño, pero Lehmbruck hace de él un \
momento de recogimiento silencioso. La figura expresa calma, contención, una presencia \
vuelta hacia el interior. Esta paz casi clásica muestra lo que el joven \
escultor alemán vino a buscar a París: una escultura basada en la masa y \
el equilibrio, próxima a la de Maillol. Pero la cabeza inclinada y la mirada baja \
anuncian ya la melancolía de sus figuras siguientes, cada vez más alargadas, que \
harán de él uno de los grandes escultores del expresionismo alemán y uno de los \
primeros en decir, con el solo cuerpo, la desolación de su tiempo."""
histoire = """
Formado en la Academia de Bellas Artes de Düsseldorf, Wilhelm Lehmbruck se instala en París \
en 1910 con su familia, y permanece allí hasta la guerra. Expone en el Salón \
de Otoño, estudia a Rodin y a Maillol, traba amistad con artistas llegados de toda Europa, \
como Brancusi, Archipenko o Modigliani. Esta Mujer de pie pertenece a sus \
primeros años parisinos; desde el año siguiente, su Mujer arrodillada, de \
miembros desmesuradamente alargados, marca un giro. La edición de Washington fue fundida en Múnich en 1957, casi cuarenta años después de \
la muerte del artista, a partir de su modelo de 1910."""
facture = """
Lehmbruck modela su figura a escala humana: con su base, mide 1,91 \
metros. Simplifica los volúmenes, renuncia a los detalles anatómicos y da al cuerpo un \
modelado amplio y suave, por el que la luz resbala sin tropiezo. El paño desempeña un papel de \
construcción: sus pliegues verticales, apretados en torno a las piernas, funden la figura en \
un solo bloque y le dan la estabilidad de una columna. La cabeza, algo pequeña para \
el cuerpo, deja adivinar el alargamiento de las obras futuras. La superficie no es \
lisa por todas partes: el cabello, en particular, conserva un grano más rugoso, y la \
pátina oscura, mezclada de verde, capta la luz por placas."""
details = [
  "La mano que sujeta el paño sobre la cadera.",
  "Los pliegues verticales de la tela, como las acanaladuras de una columna.",
  "La cabeza inclinada y los párpados bajos.",
  "El cabello recogido hacia atrás, de modelado más granuloso.",
  "Los pies desnudos que asoman bajo el paño, sobre la base irregular.",
]
themes = ["mujer", "calma", "paño", "clasicismo", "melancolía"]
anecdote = """
En Duisburgo, su ciudad, un museo lleva el nombre de Wilhelm Lehmbruck desde 1964. Su \
edificio de vidrio y hormigón fue diseñado por su hijo, el arquitecto Manfred \
Lehmbruck."""
salle = 2
mur = "sud"
place = 4
largeur = 2.9

[[oeuvres]]
titre = "La Victoria"
artiste = "Augustus Saint-Gaudens"
annee = "1892–1903"
image = "victoire.jpg"
cadre = "noir"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/12019"
technique = "Bronce dorado, fundido entre 1914 y 1916; 96,5 × 24,1 × 47 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Con las alas desplegadas y una palma en la mano: la Victoria dorada que guía en Nueva York al general Sherman, en reducción."
description = """
Una mujer alada, vestida con una larga túnica que ondea tras ella, avanza con paso \
decidido sobre una roca. Todo el bronce está dorado. Su brazo derecho se tiende hacia delante y \
hacia lo alto, como para mostrar el camino; con la otra mano, aprieta contra su \
pecho una larga palma, de un metal más oscuro. Una corona de laurel sujeta \
su cabello recogido. Sus grandes alas, de plumas finamente cinceladas, se abren a su \
espalda. El viento pega la túnica contra sus piernas y la hace ondear hacia atrás, \
dejando ver un pie calzado con una sandalia. Vista de perfil en la fotografía, la \
figura dibuja una gran diagonal, del puño tendido a la punta de las alas. En \
el frente de la base, se adivina una inscripción grabada."""
evocation = """
La Victoria es una figura de la Antigüedad: la Niké de los griegos, alada, mensajera del \
triunfo, cuyo ejemplo más célebre es la Victoria de Samotracia, en el Louvre. \
Saint-Gaudens la hace marchar ante el caballo del general William Tecumseh Sherman, \
uno de los jefes nordistas de la guerra de Secesión. No combate: guía, \
con el brazo tendido, y la palma que lleva anuncia la victoria tanto como la paz \
recobrada. Pero su rostro no tiene nada de diosa convencional: es el de una mujer \
real, atenta, casi grave. En medio de los cuerpos desnudos de Rodin y de Lehmbruck, \
representa la otra vía de la escultura hacia 1900, la de la alegoría \
monumental, llevada aquí a su perfección justo antes de desaparecer."""
histoire = """
Tras la muerte del general Sherman, en 1891, Saint-Gaudens recibe el encargo de un \
monumento ecuestre en su memoria para Nueva York. Trabaja en él más de diez años, en \
parte en París, donde instala su taller a finales de los años 1890 y donde presenta \
el yeso en la Exposición Universal de 1900. El monumento, de bronce dorado, es \
inaugurado en 1903 en la entrada sureste de Central Park, en Grand Army Plaza: el \
general a caballo sigue allí a la Victoria que marcha ante él. Posteriormente se hicieron reducciones de la \
Victoria sola. La del Metropolitan Museum, de poco menos \
de un metro de altura, fue fundida entre 1914 y 1916, unos años después de la muerte del \
escultor."""
facture = """
Saint-Gaudens, formado en la Escuela de Bellas Artes de París, posee toda la ciencia de \
la escultura académica, pero la pone al servicio de un realismo vivo. La \
reducción conserva la precisión del gran monumento: cada pluma de las alas está \
cincelada, cada pliegue de la túnica sigue el movimiento del cuerpo y el empuje del viento. La \
composición descansa en el contraste entre la vertical del cuerpo y las oblicuas del \
brazo, de las alas y del paño, que dan la impresión de una marcha rápida. El dorado \
uniforme, que recuerda el oro del monumento neoyorquino, hace de la figura un bloque de \
luz; solo la palma, de un tono más oscuro, se destaca sobre ella y atrae la \
mirada hacia el corazón de la composición."""
details = [
  "La corona de laurel en el cabello recogido.",
  "La palma, de un metal más oscuro que el dorado.",
  "Las plumas de las alas, cinceladas una a una.",
  "La sandalia del pie que avanza, bajo la túnica levantada por el viento.",
  "La inscripción grabada en el frente de la base.",
]
themes = ["victoria", "alegoría", "oro", "monumento", "américa"]
anecdote = """
Para el rostro de la Victoria, Saint-Gaudens hizo posar a Hettie Anderson, una joven \
afroamericana que fue una de sus modelos favoritas; también se le atribuye el \
perfil de la Libertad que dibujó en 1907 para una moneda de oro de veinte dólares."""
salle = 2
mur = "sud"
place = 10
largeur = 2.9

[[oeuvres]]
titre = "Cabeza de Pierre de Wissant (Los burgueses de Calais)"
artiste = "Auguste Rodin"
annee = "1886"
image = "pierre-de-wissant.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1920.120"
technique = "Bronce; cabeza de gran tamaño, llamada «heroica»"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "Uno de los seis burgueses que se ofrecieron a la muerte para salvar Calais: Rodin aísla su cabeza, devastada por la angustia."
description = """
Una cabeza de hombre se alza sobre un cuello grueso, sin hombros, separada de todo cuerpo. \
Está ligeramente inclinada y vuelta de lado. Los párpados, pesados, están casi \
cerrados; la boca se entreabre, algo torcida, como en un suspiro o una \
queja. Las cejas se contraen y la frente se arruga. El cabello corto no está \
dibujado mechón a mechón: forma una masa rugosa, como amasada a golpes \
de pulgar. Las orejas son salientes, y un ligero repliegue ciñe el cuello. El \
bronce oscuro, de reflejos verdes, está patinado y brillante: la luz resbala sobre los \
pómulos, la nariz y el mentón, mientras la sombra invade las órbitas. Sobre el fondo \
gris oscuro de la fotografía, la cabeza parece surgir sola de la noche."""
evocation = """
En 1347, tras un largo asedio, Calais debe rendirse al rey de Inglaterra Eduardo III. \
Según el cronista Froissart, el rey exige que seis notables salgan de la ciudad, \
descalzos y con la cabeza descubierta, con la cuerda al cuello, para entregarle las llaves y ser ejecutados. \
Eustache de Saint-Pierre se designa el primero, y otros cinco lo siguen, entre ellos \
Pierre de Wissant; la reina Felipa de Henao obtendrá su perdón. Rodin no \
muestra héroes triunfantes, sino hombres que caminan hacia la muerte, cada uno \
a solas con su miedo. En este rostro, como señala el museo de Cleveland, la angustia expresa \
un sufrimiento moral extremo: el monumento no celebra la gloria, hace sentir \
el precio del sacrificio."""
histoire = """
En 1884, la ciudad de Calais encarga a Rodin un monumento a Eustache de Saint-Pierre. \
El escultor propone representar a los seis burgueses juntos, al mismo nivel, sin \
jerarquía, lo que desconcierta a sus clientes. Estudia a cada hombre por separado, \
primero desnudo, luego vestido, y modela las cabezas aparte. Según el museo de Cleveland, \
expone una versión de tamaño natural de Pierre de Wissant como obra independiente \
incluso antes de la conclusión del monumento, y después realiza numerosas versiones, de \
distintos tamaños y materiales. El grupo se inaugura en Calais en 1895, colocado sobre \
un alto pedestal, cuando Rodin lo habría querido casi a ras de suelo, en \
medio de los transeúntes."""
facture = """
Rodin aísla la cabeza como un fragmento: ya no hay cuerpo, ni relato, solo \
la expresión. Separar una parte, agrandarla, reducirla, combinarla con otras: \
este procedimiento está en el corazón de su trabajo, y sus herederos lo convertirán en regla. En el \
vocabulario de los escultores, una cabeza «heroica» es mayor que el natural. El \
modelado es aquí de gran vigor: el cabello conserva la huella de los dedos, las \
mejillas y la frente se hunden y se hinchan para captar la luz. El rostro \
no es simétrico, la boca se desliza hacia un lado, un párpado cae más que el otro; \
es ese desequilibrio, más que cualquier detalle, lo que hace visible la angustia."""
details = [
  "Los párpados pesados, casi cerrados.",
  "La boca entreabierta, ligeramente torcida.",
  "El cabello rugoso, modelado a grandes golpes de pulgar.",
  "El cuello grueso, cortado en seco, sin hombros.",
  "Los reflejos verdes de la pátina sobre la frente y las mejillas.",
]
themes = ["memoria", "sacrificio", "angustia", "monumento", "fragmento"]
anecdote = """
Los Burgueses de Calais también están en Londres: un ejemplar del grupo se alza \
desde 1915 en los jardines de la Torre Victoria, a los pies del Parlamento, a unos pocos \
kilómetros río arriba de la Tate Modern, en la otra orilla del Támesis."""
