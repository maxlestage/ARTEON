[[oeuvres]]
titre = "El vengador (Der Rächer)"
artiste = "Ernst Barlach"
annee = "1914"
image = "le-vengeur.jpg"
cadre = "noir"
credit = "Photo : National Gallery of Art"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.206701.html"
technique = "Bronce"
collection = "National Gallery of Art, Washington"
note = "Envuelto en su manto, un hombre blande una espada y se lanza hacia delante: el ímpetu guerrero de 1914, captado por Barlach."
description = """
Un hombre se arroja hacia delante, con el cuerpo casi horizontal, como lanzado a una \
carrera furiosa. Está por entero envuelto en un amplio manto que forma un bloque \
anguloso, de grandes planos lisos, como tallados en madera. De ese bloque solo salen \
la cabeza, los brazos y un pie desnudo, que se apoya en una base rectangular. Los \
brazos, alzados sobre la cabeza, aferran una espada cuya hoja pasa en arco \
sobre la espalda, lista para abatirse. El rostro, pequeño, de ojos muy abiertos, mira \
fijamente al frente. El bronce pardo, de superficie finamente martilleada, presenta aquí y allá \
manchas verdes. Sobre el fondo gris claro de la fotografía, la silueta dibuja una \
cuña apuntada hacia delante, y su sombra se alarga sobre el suelo."""
evocation = """
El título designa a un justiciero, el que devuelve golpe por golpe. Como muchos \
artistas y escritores alemanes, Barlach comparte al principio el entusiasmo que \
se apodera del país en agosto de 1914, y El vengador lleva la marca de ese ímpetu: la guerra \
aparece en él como una justa revancha, una fuerza que arrasa con todo. Sin embargo la figura no tiene \
ni uniforme ni arma moderna; es una fuerza elemental, una ráfaga más que un \
soldado. Barlach se apartará pronto de esa exaltación: movilizado brevemente, \
se convierte en adversario de la guerra, y sus monumentos a los caídos posteriores a 1918 serán \
obras de duelo y recogimiento. El vengador sigue siendo el testigo de un momento \
de ceguera colectiva, en el umbral del desastre."""
histoire = """
En 1914, Ernst Barlach tiene cuarenta y cuatro años. Desde 1910, vive en Güstrow, pequeña \
ciudad de Mecklemburgo, y su marchante berlinés, Paul Cassirer, lo apoya desde hace \
varios años. Ha encontrado su estilo tras un viaje a Rusia, en 1906, de donde \
trajo figuras de campesinos y mendigos macizas y envueltas. El \
vengador nace en los primeros meses de la guerra: Barlach aplica en él este lenguaje de \
bloques drapeados a un tema de actualidad. Veinte años después, su obra será juzgada \
«degenerada» por los nazis, sus monumentos a los caídos, demasiado poco heroicos a sus \
ojos, retirados de las iglesias y de las plazas, y cientos de sus obras confiscadas \
en los museos alemanes."""
facture = """
Barlach es ante todo un escultor de la madera, y se nota incluso en el bronce: las \
formas están cortadas en grandes planos netos, de aristas vivas, heredados de la escultura \
medieval alemana y de las figurillas populares. El cuerpo desaparece bajo el manto, \
reducido a una masa geométrica, una especie de cuña inclinada hacia delante. Los únicos \
detalles son el rostro, las manos y el pie, que dan la figura humana. El \
movimiento nace de la diagonal y de los pliegues echados hacia atrás, como por el viento \
de la carrera. En ese mismo momento, los futuristas italianos intentan esculpir la \
velocidad haciendo estallar la forma; Barlach obtiene el ímpetu por el medio inverso, una \
masa compacta y cerrada."""
details = [
  "La hoja de la espada, curvada en arco sobre la espalda.",
  "El pie desnudo, único apoyo de toda la masa lanzada hacia delante.",
  "Los grandes planos lisos del manto, como tallados a hachazos.",
  "El pequeño rostro de ojos muy abiertos, atrapado en el cuello.",
  "Las manchas verdes de la pátina sobre el bronce pardo.",
]
themes = ["guerra", "ímpetu", "cólera", "memoria", "expresionismo"]
anecdote = """
Para el ángel suspendido que crea en 1927 en la catedral de Güstrow, en memoria \
de los muertos de la guerra, Barlach da al rostro los rasgos de Käthe Kollwitz. Los \
nazis lo hicieron fundir; una segunda fundición, escondida durante la guerra, permitió \
rehacerlo."""
salle = 3
mur = "nord"
place = 3
largeur = 2.8

[[oeuvres]]
titre = "Antigracioso (Antigrazioso)"
artiste = "Umberto Boccioni"
annee = "1913"
image = "antigracieux.jpg"
cadre = "noir"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/485518"
technique = "Bronce, fundido en 1950; 58,4 × 53,3 × 41,9 cm, 47,6 kg"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El rostro de su madre, una casa y la luz se funden en un solo bloque: la escultura futurista según Boccioni."
description = """
Sobre un alto pilar de madera en bruto, hendido a lo largo, se posa un busto de bronce \
que al principio cuesta leer. Se reconoce, sin embargo, una cabeza de mujer mayor, de ojos \
entornados, nariz fuerte, boca torcida, pero todos los rasgos parecen sacudidos, \
desplazados, como arrugados por una fuerza venida de fuera. Las mejillas y el mentón se \
hinchan en lóbulos. En lo alto de la cabeza se alzan formas abultadas, moño \
o sombrero, una de las cuales, puntiaguda, parece un brote. Detrás, un bloque \
geométrico de aristas vivas, semejante a un lienzo de pared o a la fachada de una casa, \
se hunde en el cráneo. A la izquierda, una especie de escuadra brota en el vacío. El \
bronce pardo verdoso reluce sobre un fondo gris."""
evocation = """
La modelo es la madre del artista, a quien pintó a menudo. Pero Boccioni no busca \
el parecido: el título, Antigracioso, es una provocación contra la belleza \
amable de la escultura de salón y contra la imitación de los griegos. Los futuristas \
quieren representar no un objeto aislado, sino el objeto mezclado con lo que lo rodea, con \
la luz, la casa, la calle, el movimiento de la vida moderna. Aquí, la cabeza y la \
casa se penetran: el retrato se convierte en la experiencia de una persona en su \
entorno, tal como la perciben la mirada y la memoria. Bajo la violencia de las formas \
asoma sin embargo una ternura: la de un hijo que vuelve sin cesar al rostro de \
su madre para probar en él sus ideas nuevas."""
histoire = """
Pintor, firmante en 1910 del Manifiesto de los pintores futuristas, Umberto Boccioni \
se vuelve hacia la escultura en 1912, tras una estancia en París donde descubre la \
escultura cubista. El 11 de abril de 1912, publica el Manifiesto técnico de la \
escultura futurista, y en 1913 presenta sus primeras esculturas en París, en la \
galería La Boétie. Antigracioso data de ese año de intensa invención, el mismo que \
sus célebres Formas únicas de continuidad en el espacio. Boccioni muere en 1916, \
a los treinta y tres años, y buena parte de sus yesos desaparece tras su muerte. Este \
bronce fue fundido en 1950, más de treinta años después, a partir del modelo del \
artista."""
facture = """
Boccioni modela en yeso, material flexible que le permite excavar, añadir, \
cortar. En su manifiesto, pedía abolir la línea cerrada de la estatua y \
romper la tradición de los materiales nobles, mármol y bronce, en favor del vidrio, \
la madera, el cartón, el hierro, el cemento, el cuero, la tela, los espejos o la \
luz eléctrica. La ironía quiere que su obra nos haya llegado en bronce. Las \
formas alternan aquí lo lleno y lo hueco, lo abombado y lo plano; los planos del muro \
cortan los del rostro, de modo que ya no se sabe dónde acaba la cabeza y dónde empieza \
el espacio. La escultura cambia de aspecto a cada paso que se da a su alrededor."""
details = [
  "El bloque geométrico, como un muro o una casa, que penetra la cabeza.",
  "La forma puntiaguda, semejante a un brote, en lo alto del cráneo.",
  "Los ojos entornados, reducidos a rendijas entre los pliegues de las mejillas.",
  "La escuadra de metal que brota en el lado izquierdo.",
  "El pilar de madera en bruto, hendido, que sirve de pedestal.",
]
themes = ["futurismo", "madre", "retrato", "movimiento", "espacio"]
anecdote = """
Boccioni tomó a menudo a su madre como modelo: ella aparece también, con las manos cruzadas, en el \
centro de su gran cuadro La materia (1912), donde su cuerpo se funde con la ciudad y con \
la luz que la rodean."""
salle = 4
mur = "nord"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "El gallo galo"
artiste = "Raymond Duchamp-Villon"
annee = "modelo de 1916"
image = "coq-gaulois.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1972.227"
technique = "Bronce pintado, relieve; fundido en 1919 a partir del yeso de 1916"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "Esculpido por un soldado escultor cerca del frente, el gallo cubista se yergue ante el sol naciente de la victoria."
description = """
Un medallón ovalado, bordeado por un ancho marco negro de relieve irregular, encierra un gallo \
dorado. El ave está construida con formas geométricas: un cuerpo en hoja \
cortante, una cresta enrollada en volutas, alas y cola hechas de cintas \
planas apiladas como peldaños, patas angulosas. Se yergue, con la cabeza alzada \
hacia lo alto del medallón. Tras él, rayos rojos, estriados, se lanzan sobre el \
fondo negro; abajo a la izquierda, una bola roja figura el sol. El relieve juega así \
con tres colores, el oro, el rojo y el negro. En la fotografía, tomada ligeramente de \
lado ante un fondo gris, el dorado brilla sobre las aristas y se desgasta en algunos puntos, \
dejando ver el metal."""
evocation = """
El gallo es el emblema de Francia, gracias a un juego de palabras latino: gallus designa a \
la vez al gallo y al galo. Durante la guerra, se lo encuentra por todas partes, en los \
carteles, las postales, las medallas. Según el museo de Cleveland, los \
soldados reconocían en este gallo y este sol naciente símbolos de victoria. \
Duchamp-Villon convierte esta imagen patriótica en una forma moderna, sin \
sentimentalismo, pero legible para todos: el gallo canta al alba, tras la noche de las \
trincheras. Junto al Vengador de Barlach, la obra muestra el otro rostro de la guerra \
en el arte, ya no el ímpetu del combate, sino la esperanza, esculpida por un hombre que \
no vería la paz."""
histoire = """
Movilizado en 1914 en el servicio de sanidad, él que había comenzado estudios de \
medicina, Raymond Duchamp-Villon sigue esculpiendo en sus horas libres. \
Según el museo de Cleveland, talla el yeso de este relieve en 1916, cuando \
sirve en el ejército: está destinado a la entrada de un teatro provisional construido cerca \
del frente para los soldados. Ese mismo año, contrae la fiebre tifoidea. Muere \
en el hospital militar de Cannes el 9 de octubre de 1918, un mes antes del armisticio. En \
1919, se funden cinco bronces a partir de su yeso, en memoria del artista; el \
de Cleveland es uno de ellos."""
facture = """
El yeso no fue modelado sino tallado, de ahí estas aristas vivas y estos planos netos. \
El gallo se reduce a formas simples, hoja, voluta, cinta, que encajan como \
las piezas de una máquina: es el principio que Duchamp-Villon había llevado más \
lejos en El caballo, en 1914, donde el animal se funde con la mecánica. El bronce está \
pintado, cosa rara: el oro, el rojo y el negro recuerdan los rótulos y los decorados \
de teatro, hechos para verse de lejos, a la entrada de una sala. El medallón, con \
su marco grueso, está pensado para integrarse en una fachada: Duchamp-Villon se interesó \
siempre por la arquitectura."""
details = [
  "Las plumas de la cola y del ala, en cintas planas apiladas como peldaños.",
  "La bola roja del sol, abajo a la izquierda.",
  "Los rayos rojos estriados que atraviesan el fondo negro.",
  "La cresta del gallo, enrollada en volutas.",
  "El ancho marco negro, de relieve irregular, que rodea el medallón.",
]
themes = ["cubismo", "guerra", "francia", "sol", "emblema"]
anecdote = """
Nacido Raymond Duchamp, el escultor añadió a su nombre el de Villon, ya elegido por \
su hermano mayor Gaston, convertido en el pintor Jacques Villon en homenaje al poeta François \
Villon. Su hermano menor, Marcel Duchamp, conservó su nombre."""
salle = 4
