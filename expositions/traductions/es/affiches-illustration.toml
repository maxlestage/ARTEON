[[oeuvres]]
titre = "El Thermogène engendra calor"
artiste = "Leonetto Cappiello"
annee = "1909"
image = "thermogene.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Leonetto_Cappiello_-_Thermogène_warms_you_up_-_Google_Art_Project.jpg"
technique = "Litografía en color, 159,5 × 114,5 cm"
collection = "Museo del Cartel de Wilanów, Museo Nacional de Varsovia"
note = "Un pierrot escupe fuego mientras aprieta contra sí una bola de algodón: para vender un remedio, Cappiello inventa una figura inolvidable."
description = """
Sobre un fondo negro liso, un extraño personaje avanza con paso de baile, con una pierna \
lanzada hacia atrás. Lleva unas mallas de un verde brillante, de reflejos azules, \
guantes blancos, y tiene una cabeza de payaso lívida y calva, con la boca muy abierta. De \
esa boca brota, hacia arriba, una gran llama naranja y amarilla. Contra su \
pecho, aprieta con ambos brazos una gran nube rosa y mullida. El texto ocupa los \
bordes del cartel en letras capitales: arriba, en amarillo, «Le Thermogène», luego, \
en rojo, «engendre la chaleur»; a la derecha, «et guérit : »; abajo, en rojo, « \
toux, rhumatismes, points de côté, etc. ». La firma de Cappiello, trazada en verde, \
está a la izquierda, a la altura de las rodillas."""
evocation = """
El Thermogène era un algodón medicinal, impregnado de un producto que calienta la piel, \
que se aplicaba sobre el pecho o la espalda contra los resfriados y los dolores. \
En lugar de mostrar el producto o a un enfermo, Cappiello inventa una imagen absurda e \
inolvidable: un pierrot que tiene tanto calor que escupe fuego, abrazando su algodón \
como un tesoro. La idea es simple y se lee en un segundo, incluso desde un tranvía. \
Es el principio del cartel moderno, que Cappiello impone a comienzos del siglo XX: \
una sola figura, llamativa, a menudo divertida, asociada para siempre a una marca. El \
pierrot del Thermogène sirvió además de emblema del producto durante décadas, \
hasta en sus envases."""
histoire = """
Nacido en Livorno, Leonetto Cappiello llega a París en 1898 y se da a conocer primero \
como caricaturista, en particular en Le Rire. Dibuja su primer cartel en 1899 y \
trabaja pronto bajo contrato con el impresor Pierre Vercasson, cuyo sello \
figura en este cartel. El Thermogène se le encarga en 1909; el cartel se tira \
en numerosos ejemplares y se reimprime, con variantes de texto y de formato. \
Figura de inmediato entre sus imágenes más célebres, junto con el Chocolat Klaus de \
1903 o el Cinzano de 1910. Este ejemplar pertenece al Museo del Cartel de \
Wilanów, cerca de Varsovia, que depende del Museo Nacional de Varsovia: inaugurado en 1968, \
suele presentarse como el primer museo del mundo enteramente dedicado al \
cartel."""
facture = """
Cappiello rompe con los carteles Art Nouveau cargados de ornamentos. Coloca una figura \
única, vivamente coloreada, sobre un fondo negro que la hace brotar, como un actor bajo \
el foco. El verde ácido de las mallas, con sus reflejos azules, contrasta con \
el naranja de las llamas y el rosa del algodón: colores opuestos, elegidos para \
verse de lejos. El dibujo, procedente de la caricatura, es flexible y rápido, y el \
movimiento de la figura, una pierna lanzada hacia atrás, da la impresión de que \
atraviesa el cartel. El texto queda relegado a los bordes, en capitales simples y \
legibles."""
details = [
  "La llama que brota de la boca abierta del pierrot.",
  "Los reflejos azules que modelan las mallas verdes.",
  "El pequeño sello redondo y azul del impresor Vercasson, a la derecha, sobre el fondo negro.",
  "La firma de Cappiello, trazada en verde a la izquierda.",
]
themes = ["publicidad", "humor", "color", "remedio", "cartel"]
anecdote = """
Antes de dibujar carteles, Cappiello se había hecho célebre en París con un álbum \
de caricaturas, Nos actrices, publicado en 1899, en el que retrataba con una gracia \
afectuosa a las estrellas de la escena parisina."""
salle = 2
mur = "sud"
place = 1
largeur = 1.15

[[oeuvres]]
titre = "¡Los venceremos! 2.º Empréstito de la Defensa Nacional"
artiste = "Abel Faivre"
annee = "1916"
image = "on-les-aura.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:2e_Emprunt_de_la_Défense_nationale._Souscrivez_(1916)_On_les_aura_!_-_affiche_-_Abel_Faivre_-_btv1b9013991f.jpg"
technique = "Litografía en color, aproximadamente 120 × 80 cm, impresa por Devambez, París"
collection = "Biblioteca Nacional de Francia, París"
note = "Un joven soldado con casco se lanza, con el brazo en alto, gritando «¡On les aura!»: el cartel más famoso de la Gran Guerra en Francia."
description = """
Un joven soldado francés, visto de medio cuerpo, surge del borde izquierdo del cartel. Lleva \
el casco de acero y el capote de los poilus, aprieta su fusil con una mano, con el cañón apuntando \
hacia delante, y alza el otro brazo muy alto, con la mano bien abierta, como para arrastrar \
a sus camaradas. Su rostro, vuelto de lado, está abierto en un grito; sus ojos \
desorbitados brillan de entusiasmo. El fondo permanece casi vacío, de un beige claro. Arriba \
a la izquierda, trazado a mano como una escritura espontánea: «On les aura !». Abajo \
a la derecha, en letras capitales, «2ᵉ Emprunt de la Défense nationale», y, en \
gran escritura inclinada, «Souscrivez». Abajo del todo, en caracteres pequeños, el nombre \
del impresor Devambez, en París."""
evocation = """
«¡Valor! ¡On les aura!»: la fórmula concluye una orden del día del general Pétain \
a los defensores de Verdún, el 10 de abril de 1916, y se convierte de inmediato en una consigna \
nacional. Faivre la retoma para un cartel que no muestra ni al enemigo ni la muerte, \
solo el impulso y la confianza de un soldado muy joven. El mensaje es doble: \
apoyar a los combatientes y suscribir el empréstito, es decir, prestar su dinero al \
Estado para financiar la guerra. El cartel hace de cada ahorrador un combatiente de la \
retaguardia. Este rostro heroico, casi sonriente, contrasta con la realidad de Verdún, \
donde cientos de miles de hombres son muertos o heridos en 1916: es una imagen \
de propaganda, concebida para mantener la moral del país."""
histoire = """
Para pagar una guerra mucho más larga y costosa de lo previsto, el Estado francés \
lanza varios grandes empréstitos entre los particulares. El segundo empréstito de la \
Defensa Nacional se abre en el otoño de 1916. Como para el primero, lo acompaña una vasta \
campaña de carteles: se piden imágenes a dibujantes conocidos, y \
sus carteles se pegan por toda Francia. Abel Faivre, caricaturista \
de renombre, había dibujado ya en 1915 un cartel que llamaba a los franceses a entregar su oro \
al Banco de Francia, en el que un gallo galo abate a un soldado alemán. Este, \
impreso por la casa Devambez, obtiene un éxito considerable y sigue siendo la imagen \
más conocida de la propaganda francesa de la guerra. Este ejemplar se conserva en el \
Departamento de Estampas de la Biblioteca Nacional de Francia."""
facture = """
Faivre, dibujante de prensa, trabaja aquí como un pintor: el soldado está modelado \
con lápiz litográfico, con sombreados vigorosos y negros profundos, en \
una gama sobria de marrones, grises y beige, apenas realzada con color en el \
rostro y las manos. La figura, cortada por el borde izquierdo y lanzada en diagonal, \
parece salir del cartel hacia el espectador. El brazo en alto y el fusil forman dos \
oblicuas que dan el impulso. El texto trazado a mano, «On les aura !» y « \
Souscrivez», da la impresión de una palabra espontánea, mientras que el nombre \
del empréstito está compuesto en capitales oficiales."""
details = [
  "La mano levantada, de dedos separados, que parece llamar a los demás soldados.",
  "La manga clara remangada en la muñeca del brazo en alto.",
  "El rasgo de «Souscrivez», que se hunde hacia la parte baja del cartel.",
  "El nombre del impresor Devambez, muy pequeño, al pie del cartel.",
]
themes = ["guerra", "propaganda", "verdún", "patriotismo", "cartel"]
anecdote = """
El casco de acero que lleva el soldado, el casco Adrian, solo se distribuye a las tropas \
francesas a partir del otoño de 1915: al comienzo de la guerra, los infantes \
partían al combate con quepis y pantalón rojo garanza."""
salle = 2
mur = "sud"
place = 4
largeur = 0.9

[[artistes]]
nom = "William Hogarth"
vie = "Londres, 10 de noviembre de 1697 – Londres, 26 de octubre de 1764"
biographie = """
Hijo de un maestro de escuela que intentó abrir un café donde solo se hablara latín y \
acabó encarcelado por deudas, William Hogarth crece en Londres entre estrecheces. Aprendiz \
de un grabador en plata, se establece por su cuenta hacia 1720 como grabador y luego \
aprende pintura. En 1729 se casa en secreto con la hija del pintor James Thornhill. \
El éxito llega en 1732 con La carrera de una prostituta, una serie de seis cuadros \
que él mismo graba y vende por suscripción: son sus «asuntos morales modernos». \
Siguen La carrera de un libertino, El matrimonio a la moda, La industria y la pereza, \
y luego Gin Lane y Beer Street. Para proteger sus estampas de las copias, obtiene en \
1735 una ley sobre el derecho de los grabadores. Retratista de renombre, es también uno de los \
gobernadores del Hospital de Niños Expósitos de Londres, que convierte en uno de los \
primeros lugares donde el público puede ver obras de artistas ingleses. En 1753 \
publica un tratado, El análisis de la belleza, y en 1757 se convierte en pintor oficial del rey. \
Muere en Londres en 1764."""
style = """
Hogarth inventa la sátira en serie: historias en varias imágenes, para leer en \
orden, llenas de detalles, de enseñas y de inscripciones que comentan la acción. \
Mezcla en ellas la caricatura, el teatro y el sermón moral. Grabador popular tanto como \
pintor, dio al inglés el adjetivo «hogarthian» y abrió el camino a los \
caricaturistas ingleses, de Gillray a Cruikshank, y luego a las historias en imágenes del siglo \
XIX."""

[[artistes]]
nom = "Francisco de Goya"
vie = "Fuendetodos (Aragón), 30 de marzo de 1746 – Burdeos, 16 de abril de 1828"
biographie = """
Hijo de un dorador, Francisco de Goya se forma en Zaragoza, fracasa dos veces en el concurso \
de la Real Academia de Madrid y viaja luego a Italia. Establecido en Madrid en 1775, \
pinta para la Real Fábrica de Tapices cartones llenos de vida popular, \
que lo dan a conocer. Miembro de la Academia de San Fernando en 1780, pintor del rey en \
1786, se convierte en el retratista de la corte y de la aristocracia ilustrada. En \
1792-1793, una grave enfermedad lo deja completamente sordo. Se vuelve entonces hacia \
obras más personales: los Caprichos aparecen en 1799, el año en que es nombrado \
primer pintor de cámara. La invasión francesa y la guerra de la Independencia, a \
partir de 1808, le inspiran los Desastres de la guerra y los cuadros del Dos y del \
Tres de Mayo de 1808. Retirado en su casa de la Quinta del Sordo, cubre sus muros \
con las Pinturas negras. Inquieto por el regreso del absolutismo bajo Fernando VII, \
se exilia en 1824 en Burdeos, donde practica aún la litografía, y muere allí en 1828."""
style = """
Goya pasa de las escenas claras y graciosas de su juventud a una pintura cada vez más \
libre, sombría y visionaria. Grabador genial, hace del aguafuerte y de la \
aguatinta un medio para expresar la sátira, la violencia y las pesadillas de su tiempo, \
sin embellecer nada. Sus series grabadas, de los Caprichos a los Desastres de la guerra, \
marcaron a Delacroix, a Manet, a los románticos y a los surrealistas; se le considera a menudo \
el primero de los pintores modernos."""

[[artistes]]
nom = "Katsushika Hokusai"
vie = "Edo (hoy Tokio), 1760 – Edo, 10 de mayo de 1849"
biographie = """
Nacido en un barrio de artesanos de Edo, Hokusai aprende muy joven el grabado en madera, \
y entra hacia 1778 en el taller del pintor Katsukawa Shunshō, especialista en \
retratos de actores. Se separa de él y explora todas las escuelas, japonesas, \
chinas e incluso occidentales, de las que estudia la perspectiva. A lo largo de su larga \
vida, cambia más de treinta veces de nombre artístico y se muda, según se dice, más de \
noventa veces. Ilustra novelas, dibuja surimono, esas estampas de \
lujo que se regalaban en Año Nuevo, y publica libros de modelos, entre ellos la Manga a partir de \
1814. Hacia 1830-1832, con más de setenta años, alcanza su mayor éxito \
con las Treinta y seis vistas del monte Fuji, entre las que figura la Gran Ola. Prosigue con \
series de cascadas, de puentes y de flores, y luego se dedica sobre todo a la pintura. \
Pobre hasta el final, ayudado por su hija Ōi, también pintora, muere a los \
ochenta y ocho años lamentando, según se dice, no haber tenido unos años \
más para llegar a ser un verdadero pintor."""
style = """
Hokusai es un dibujante insaciable, capaz de representarlo todo: la ola y la \
gota de agua, el fantasma y el artesano, la montaña y el insecto. Su trazo vivo, su \
sentido del movimiento y sus encuadres audaces, nutridos de perspectiva occidental, \
renovaron la estampa japonesa. Descubierto en Europa a mediados del siglo XIX, \
se convierte en la gran figura del japonismo e influye en Degas, Van Gogh, Monet y los \
artistas del Art Nouveau."""

[[artistes]]
nom = "Rodolphe Töpffer"
vie = "Ginebra, 31 de enero de 1799 – Ginebra, 8 de junio de 1846"
biographie = """
Hijo del pintor ginebrino Wolfgang-Adam Töpffer, Rodolphe quiere ser primero pintor \
a su vez, pero una enfermedad de los ojos le obliga a renunciar. Se vuelve hacia las \
letras, reside en París para estudiar y abre en 1824, en Ginebra, un internado de \
muchachos que dirige con su esposa. Para divertir a sus alumnos, dibuja \
historias cómicas y los lleva cada año de excursión a pie por los Alpes: de \
ellas saca relatos ilustrados, los Viajes en zigzag. En 1832 se convierte en profesor de \
retórica y bellas letras en la Academia de Ginebra. Alentado por Goethe, que ha \
admirado sus álbumes, publica a partir de 1833 sus historias en estampas: el señor \
Jabot, el señor Crépin, el señor Vieux Bois, el señor Pencil, el doctor Festus, \
el señor Cryptogame. Escribe también relatos, reunidos con el título de Nouvelles \
genevoises, y ensayos sobre el arte, entre ellos un Ensayo de fisiognomía dedicado a su \
manera de dibujar. Conservador en política, es miembro del Consejo Representativo de \
Ginebra. Enfermo, muere a los cuarenta y siete años."""
style = """
Töpffer inventa lo que él llama la «literatura en estampas»: una historia \
contada mediante una sucesión de dibujos, cada uno acompañado de una leyenda, en la que el sentido nace de \
el encadenamiento. Su trazo rápido y deliberadamente torpe privilegia la expresión \
y el movimiento. Reflexionó como teórico sobre este nuevo lenguaje, y muchos \
historiadores lo consideran hoy el padre de la historieta."""

[[artistes]]
nom = "John Tenniel"
vie = "Londres, 28 de febrero de 1820 – Londres, 25 de febrero de 1914"
biographie = """
Hijo de un maestro de armas y de baile de origen hugonote, John Tenniel aprende en \
gran parte solo, copiando las esculturas antiguas del British Museum. A los veinte años, \
pierde casi por completo la vista de un ojo en un accidente de esgrima. Expone muy \
pronto en la Royal Academy y, en 1845, obtiene un premio en el concurso para la decoración del \
nuevo palacio de Westminster, donde pinta después un fresco. En 1850 entra en \
Punch, el gran semanario satírico londinense; tras la muerte de John Leech, en \
1864, se convierte en su principal caricaturista político y publica en él durante \
medio siglo más de dos mil dibujos, entre ellos «Dropping the Pilot», en 1890, sobre el \
cese de Bismarck. Ilustrador solicitado, dibuja para las Fábulas de Esopo y para \
Lalla Rookh de Thomas Moore, pero son Alicia en el país de las maravillas, en 1865, y luego \
A través del espejo, en 1871, los que le aseguran una gloria duradera. Ennoblecido en \
1893, se jubila en 1901 y muere en Londres poco antes de cumplir \
noventa y cuatro años."""
style = """
Tenniel tiene un dibujo preciso, casi escultórico, heredado del estudio de los antiguos, puesto al \
servicio del humor. Sus personajes, plantados con nitidez, de rostros fuertemente \
caracterizados, proceden de la caricatura política. Sus ilustraciones para Lewis \
Carroll fijaron para siempre el aspecto de Alicia, del Sombrerero o del Gato de \
Cheshire: casi todas las adaptaciones posteriores se inspiran en ellas."""

[[artistes]]
nom = "Gustave Doré"
vie = "Estrasburgo, 6 de enero de 1832 – París, 23 de enero de 1883"
biographie = """
Niño prodigio, Gustave Doré dibuja desde muy temprana edad. A los quince años, de paso \
por París con sus padres, obtiene un contrato del editor Charles Philipon y \
publica el mismo año un álbum de caricaturas, Los trabajos de Hércules. Colabora en el \
Journal pour rire y, en 1854, publica la Historia de la Santa Rusia, una sátira en \
imágenes que a menudo se cuenta entre los antepasados de la historieta. Se lanza después \
a la ilustración de los grandes textos: Rabelais, los Cuentos droláticos de Balzac, \
el Infierno de Dante en 1861, los Cuentos de Perrault, Don Quijote, la Biblia, las Fábulas \
de La Fontaine. Hace trabajar a decenas de grabadores. Adulado en Gran Bretaña, \
ve abrirse en Londres, en 1869, la Doré Gallery, dedicada a sus cuadros, y publica en ella \
con Blanchard Jerrold Londres, una peregrinación. Aspira, sin embargo, a ser \
reconocido como pintor y escultor, y sufre la indiferencia de la crítica \
francesa. Vive con su madre, cuya muerte, en 1879, lo afecta profundamente, y \
muere en París en 1883, a los cincuenta y un años."""
style = """
Doré es un visionario del blanco y negro: multitudes inmensas, paisajes vertiginosos, \
violentos contrastes de luz y sombra. Compone sus imágenes como decorados de \
teatro o de ópera, con un sentido de lo espectacular que ha marcado el imaginario popular. \
Sus ilustraciones de Dante, de la Biblia o de Perrault se han reproducido por \
todo el mundo, y su eco se encuentra en numerosos decorados del cine \
fantástico."""

[[artistes]]
nom = "Jules Chéret"
vie = "París, 31 de mayo de 1836 – Niza, 23 de septiembre de 1932"
biographie = """
Hijo de un obrero tipógrafo, Jules Chéret entra a los trece años como aprendiz de un \
litógrafo y sigue cursos nocturnos de dibujo. En 1858 dibuja un cartel para \
Orfeo en los infiernos, la opereta de Offenbach. Establecido en Londres de 1859 a 1866, allí \
descubre los grandes carteles ingleses en color y trabaja en particular para el \
perfumista Eugène Rimmel. A su regreso, funda en París su propia imprenta, equipada \
con prensas inglesas, y revoluciona el cartel francés: grandes litografías en \
color, figuras en movimiento, rotulación integrada en la imagen. En 1881 cede su \
taller a la imprenta Chaix, de la que sigue siendo director artístico. Dibuja para \
teatros, music-halls, bailes, aperitivos, jabones, petróleo \
de alumbrado o pistas de patinaje, más de un millar de carteles en total. Recibe la \
Legión de Honor en 1890. Hacia 1900 se dedica más a la pintura \
decorativa. Retirado en Niza, muere allí a los noventa y seis años; el Museo de \
Bellas Artes de la ciudad lleva su nombre."""
style = """
Chéret es el padre del cartel ilustrado moderno. Sus composiciones, hechas para la \
calle, se basan en unos pocos colores vivos superpuestos, una figura femenina ligera y \
danzante, y letras dibujadas que forman cuerpo con la imagen. Admirador de Watteau \
y de Tiepolo, da a la publicidad la gracia de la fiesta galante. Abre el camino a \
Toulouse-Lautrec, a Mucha y a toda la generación de los cartelistas de la Belle Époque."""

[[artistes]]
nom = "Aubrey Beardsley"
vie = "Brighton, 21 de agosto de 1872 – Menton, 16 de marzo de 1898"
biographie = """
Aquejado de tuberculosis desde la infancia, Aubrey Beardsley crece en Brighton en una \
familia modesta y se apasiona por la música, la literatura y el dibujo. A los dieciséis \
años, se hace oficinista en Londres, primero en casa de un agrimensor y luego en una \
compañía de seguros. En 1891, el pintor Edward Burne-Jones, a quien muestra sus \
dibujos, lo anima. El editor J. M. Dent le confía la ilustración de La muerte \
de Arturo de Thomas Malory, y luego la revista The Studio lo revela al público en 1893. Sus \
ilustraciones para la Salomé de Oscar Wilde, en 1894, lo hacen célebre y escandaloso. \
Director artístico de la revista The Yellow Book, es despedido en 1895 en el momento del \
proceso de Wilde, aunque este nunca había escrito para la revista. Colabora \
después en The Savoy e ilustra la Lisístrata de Aristófanes y El rizo robado \
de Alexander Pope. Agotado por la enfermedad, se convierte al catolicismo en \
1897 y parte en busca del sol a la Costa Azul, donde muere a los veinticinco años."""
style = """
Beardsley creó en pocos años un estilo de una originalidad absoluta: un blanco y negro \
puro, sin medios tonos, hecho de grandes planos negros, de líneas de una finura \
extrema y de ornamentos refinados. Mezcla en él la estampa japonesa, la cerámica griega, \
el rococó y una ironía a menudo provocadora. Su arte, concebido para la reproducción \
fotomecánica, marcó el Art Nouveau, la ilustración del siglo XX y el diseño gráfico."""

[[artistes]]
nom = "Théophile-Alexandre Steinlen"
vie = "Lausana, 10 de noviembre de 1859 – París, diciembre de 1923"
biographie = """
Nacido en Lausana, Théophile-Alexandre Steinlen estudia un tiempo en la universidad de su \
ciudad y luego trabaja como dibujante de motivos para una fábrica de tejidos de \
Mulhouse. En 1881 se instala en París, en Montmartre, donde frecuenta el cabaré del \
Chat Noir de Rodolphe Salis. Colabora en el periódico del cabaré, ilustra después las \
canciones de Aristide Bruant y dibuja durante años para el Gil Blas illustré, donde \
aparecen cientos de sus imágenes de la calle, de los obreros y de los oficios menudos. \
Se convierte en uno de los grandes cartelistas de su tiempo, con la Gira del Chat Noir, la \
Leche pura esterilizada de la Vingeanne o el gran cartel La Calle, dibujado para \
el impresor Charles Verneau. Cercano a los medios anarquistas y socialistas, da \
numerosos dibujos a la prensa comprometida, como L'Assiette au beurre. Naturalizado \
francés en 1901, da testimonio durante la Gran Guerra del sufrimiento de los soldados, \
de los refugiados y de los civiles. Muere en París en 1923."""
style = """
Steinlen es un dibujante de la vida moderna: observa a los obreros, las \
lavanderas, los niños, los gatos y la miseria de los arrabales con una profunda \
simpatía. Su trazo flexible y poderoso, sus siluetas simplificadas y sus colores \
francos, nutridos por la estampa japonesa, dan a sus carteles una gran fuerza. \
Su arte comprometido marcó al joven Picasso y a los dibujantes de prensa del siglo XX."""

[[artistes]]
nom = "Winsor McCay"
vie = "Canadá o Míchigan, hacia 1867 – Nueva York, 26 de julio de 1934"
biographie = """
Los orígenes de Zenas Winsor McCay siguen siendo inciertos: habría nacido en Canadá o \
en Míchigan, entre 1867 y 1871. Crece en Míchigan, donde recibe las \
únicas verdaderas lecciones de su vida de un profesor de dibujo de perspectiva. \
Trabaja primero para circos y museos de curiosidades populares, de los que \
pinta los carteles y los decorados, en particular en Chicago y luego en Cincinnati, donde se convierte en \
dibujante de prensa. En 1903 entra en el New York Herald. Allí crea Little Sammy \
Sneeze y Dream of the Rarebit Fiend, y luego, en 1905, Little Nemo in Slumberland. \
Pionero de la animación, realiza una primera película a partir de Little Nemo en 1911, y luego \
Gertie el dinosaurio en 1914, que presenta en los escenarios de music-hall, y El \
hundimiento del Lusitania en 1918. Pasado al servicio del magnate de la prensa William Randolph \
Hearst, dedica sus últimos años sobre todo a dibujos editoriales. Muere en \
Nueva York, en Brooklyn, en 1934."""
style = """
McCay es el primer gran virtuoso de la historieta: explota toda la \
superficie de la página, hace variar el tamaño de las viñetas al compás del relato y dibuja \
arquitecturas de una precisión asombrosa. Su trazo claro, marcado por el Art Nouveau, \
sirve a un imaginario del sueño y de la metamorfosis. Influyó en generaciones \
de autores, de Maurice Sendak a los dibujantes europeos, y abrió el camino al dibujo \
animado."""

[[artistes]]
nom = "Leonetto Cappiello"
vie = "Livorno, 9 de abril de 1875 – Cannes, 2 de febrero de 1942"
biographie = """
Nacido en Livorno, en la Toscana, en una familia de comerciantes, Leonetto Cappiello aprende \
a dibujar prácticamente solo. Se instala en París en 1898, donde sus retratos caricaturescos \
de las estrellas de la escena, reunidos en el álbum Nos actrices en 1899, y sus dibujos \
para Le Rire lo hacen pronto célebre. Ese mismo año dibuja su primer cartel, \
para el periódico Frou-Frou. Trabajando pronto bajo contrato con el impresor Pierre \
Vercasson, se convierte en el maestro del cartel publicitario: Chocolat Klaus en 1903, Le \
Thermogène en 1909, y luego Cinzano, Campari, el Bouillon Kub o los zapatos Bally. \
Dibuja para todo tipo de productos, y sus figuras fantasiosas se hacen \
familiares a millones de transeúntes. Es también pintor y decorador. Naturalizado \
francés en 1930, abandona París durante la Segunda Guerra Mundial para la Costa \
Azul y muere en Cannes en 1942."""
style = """
Cappiello es considerado el padre del cartel publicitario moderno. Sustituye \
las composiciones decorativas del Art Nouveau por una sola figura, a menudo \
fantasiosa, de colores vivos, destacada sobre un fondo oscuro o liso, y que queda en la \
memoria asociada a la marca. Procedente de la caricatura, tiene el sentido de la síntesis y del \
movimiento. Su método inspiró a los cartelistas del Art Déco, de Cassandre a Paul \
Colin."""

[[artistes]]
nom = "Abel Faivre"
vie = "Lyon, 30 de marzo de 1867 – Niza, 13 de agosto de 1945"
biographie = """
Jules-Abel Faivre estudia primero en la École des Beaux-Arts de Lyon, su ciudad natal, \
y luego en París, en la Académie Julian. Expone retratos y escenas de género en el \
Salón, pero se da a conocer sobre todo como dibujante humorístico en la prensa \
ilustrada, entonces en pleno auge: Le Rire, Le Journal, L'Assiette au beurre y muchos \
otros publican sus dibujos, a menudo dedicados a los defectos de la burguesía y a \
las conversaciones de salón. Sus leyendas, muy trabajadas, son tan divertidas como sus \
imágenes. Durante la Primera Guerra Mundial, pone su talento al servicio de la \
propaganda: dibuja para la prensa caricaturas patrióticas y firma varios \
carteles para los empréstitos de la Defensa Nacional y la recogida del oro, entre ellos On les \
aura !, en 1916, el más célebre. Tras la guerra, sigue dibujando para la \
prensa y pintando. Muere en Niza en 1945, a los setenta y ocho años."""
style = """
Faivre es ante todo un caricaturista de ojo agudo y trazo seguro, que retrata con un \
dibujo rápido los ridículos de la sociedad de la Belle Époque. En sus carteles de \
guerra, adopta una manera más grave, casi pictórica, con lápiz litográfico, \
y sabe condensar una emoción colectiva en una sola figura. Sus dibujos de prensa \
lo convierten en un testigo valioso de las costumbres de su tiempo."""
