[[oeuvres]]
titre = "El té de los locos (Alicia en el país de las maravillas)"
artiste = "John Tenniel"
annee = "1865"
image = "the-du-chapelier-fou.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Alice_par_John_Tenniel_25.png"
technique = "Xilografía a contrafibra de los hermanos Dalziel, a partir del dibujo de Tenniel"
collection = "Alice's Adventures in Wonderland, Macmillan, Londres, 1865"
note = "Alicia, la Liebre de Marzo, el Lirón dormido y el Sombrerero: la ilustración que fijó para siempre el rostro de los personajes de Lewis Carroll."
description = """
Bajo un árbol, ante una casa, una larga mesa cubierta con mantel blanco está llena de \
tazas y platillos. A la izquierda, Alicia, con sus largos cabellos claros sobre los hombros, está \
hundida en un gran sillón y mira a sus anfitriones con aire malhumorado. En el centro, la \
Liebre de Marzo, con chaqueta y lazo, tiene las orejas erguidas. A su lado, \
el Lirón, pequeño roedor dormido, está encajado entre la Liebre y el Sombrerero, que \
se apoyan en él como en un cojín. El Sombrerero, a la derecha, lleva un inmenso \
sombrero de copa con una etiqueta que indica un precio: «In this style 10/6». Lleva \
una gran pajarita de lunares y la mano posada cerca de un plato. Una tetera decorada \
reina en medio de la mesa. Abajo a la izquierda, el monograma del artista."""
evocation = """
En el capítulo VII del libro, Alicia da con una merienda que nunca termina: el Sombrerero \
explica que se ha peleado con el Tiempo, y que desde entonces son siempre las seis, \
la hora del té. Se cambia de sitio en lugar de lavar las tazas, se plantean adivinanzas \
sin respuesta, se interrumpe al otro. Lewis Carroll, profesor de matemáticas en \
Oxford, se burla en ella de las reglas absurdas de la cortesía victoriana y del ritual sagrado \
del té. Suele vincularse la expresión inglesa «loco como un sombrerero» con los \
sombrereros intoxicados por el mercurio con que se trataba el fieltro, y «loco como una \
liebre de marzo» con la agitación de las liebres en primavera. El dibujo de Tenniel da a \
esta locura un aire perfectamente serio: ese contraste es lo que hace reír."""
histoire = """
Lewis Carroll, cuyo verdadero nombre era Charles Dodgson, había ilustrado él mismo en un principio el \
manuscrito regalado a la pequeña Alice Liddell. Para la edición, se dirige a John \
Tenniel, el célebre dibujante de Punch, y sigue de cerca su trabajo, discutiendo \
cada dibujo. Las cuarenta y dos ilustraciones son grabadas en madera por los hermanos \
Dalziel. En 1865, Tenniel juzga demasiado mediocre la impresión de la primera tirada: Carroll \
hace retirar los ejemplares y reimprimir el libro, que aparece fechado en 1866. Solo \
subsisten una veintena de ejemplares de la tirada retirada. El éxito es inmenso, y \
Tenniel ilustra también la continuación, A través del espejo, aparecida a finales de 1871. Sus imágenes \
se han retomado desde entonces en innumerables ediciones y traducciones del libro, en \
inglés y en todas las lenguas."""
facture = """
Tenniel dibujaba con gran precisión directamente sobre el taco de madera preparado; \
los grabadores del taller Dalziel ahuecaban luego la madera alrededor de cada trazo. \
La xilografía a contrafibra, tallada en una madera muy dura cortada transversalmente al tronco, \
permite líneas de gran finura y, sobre todo, imprimir la imagen al mismo tiempo \
que el texto, en la misma página. Tenniel construye la imagen como un dibujo de prensa: \
un encuadre cerrado, sombreados cruzados para las sombras, personajes plantados de \
perfil, de rostros expresivos. Su costumbre de la caricatura política se lee en el \
Sombrerero, de rasgos acusados."""
details = [
  "La etiqueta del sombrero: «In this style 10/6», diez chelines y seis peniques, el precio del modelo.",
  "El Lirón dormido, encajado entre la Liebre y el Sombrerero.",
  "La tetera del centro, en la que los dos compinches acabarán intentando meter al Lirón.",
  "El monograma de Tenniel, abajo a la izquierda.",
]
themes = ["infancia", "absurdo", "té", "literatura", "disparate"]
anecdote = """
A los veinte años, Tenniel perdió casi por completo la vista de un ojo en un asalto \
de esgrima con su padre, cuyo florete había perdido el botón. Se lo ocultó mucho tiempo \
a su padre y dibujó durante toda su carrera con un solo ojo bueno."""
