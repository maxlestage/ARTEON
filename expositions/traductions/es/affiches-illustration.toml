[[oeuvres]]
titre = "Gin Lane (La calle del ginebra)"
artiste = "William Hogarth"
annee = "1751"
image = "gin-lane.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:William_Hogarth,_Gin_Lane,_1751,_NGA_30433.jpg"
technique = "Aguafuerte y buril sobre papel"
collection = "National Gallery of Art, Washington (colección Rosenwald)"
note = "En una calle miserable de Londres, la ginebra lo destruye todo: una madre ebria deja caer a su hijo, las casas se derrumban, solo el prestamista prospera."
description = """
El grabado muestra una calle de Londres en ruinas, vista desde arriba. En primer plano, sentada \
en unos escalones, una mujer aturdida, con las piernas cubiertas de llagas, toma una pizca \
de rapé mientras su bebé se desliza de sus brazos y cae por el hueco de la escalera \
de un sótano. Abajo a la derecha, un buhonero esquelético, dormido contra el muro, sostiene \
aún un vaso; en su cesta asoma un panfleto contra la ginebra. A la izquierda, ante \
la tienda del prestamista, un carpintero y una ama de casa vienen a empeñar su \
sierra y sus cazuelas. Al fondo, la calle se desmorona: una casa se hunde, un barbero \
se ha ahorcado bajo el tejado, un loco gesticula, un niño ensartado en la punta de una \
pica, y se deposita a una muerta en un ataúd. Sobre los tejados se alza un \
campanario. Bajo la imagen, tres estrofas en inglés maldicen la ginebra."""
evocation = """
Hogarth contrapone Gin Lane a otra lámina, Beer Street, la calle de la cerveza, donde unos \
londinenses bien alimentados beben cerveza inglesa, trabajan y prosperan. Aquí, \
por el contrario, la ginebra barata arruina los cuerpos, las familias y la propia ciudad: \
solo el usurero, el destilador y el sepulturero hacen negocio. La madre indigna \
del centro se ha relacionado con un suceso que había conmocionado a Londres en 1734: una \
mujer, Judith Defour, había estrangulado a su hijita para vender su ropa y \
comprar ginebra. El campanario de la iglesia de St George de Bloomsbury parece contemplar la \
escena a lo lejos, impotente. Se ha visto en ella un sermón en imágenes, pero también un documento sobre \
la miseria del barrio de St Giles, uno de los más pobres de la ciudad. El horror se \
mezcla en ella con un humor negro que aún mantiene su eficacia."""
histoire = """
En la primera mitad del siglo XVIII, Londres conoce lo que se ha llamado la «locura \
de la ginebra»: el alcohol de grano, destilado por todas partes y vendido por unos peniques, provoca \
miseria, crímenes y muertes. En 1751, el Parlamento prepara una ley para limitar su \
venta. Hogarth publica entonces, el 1 de febrero, Gin Lane y Beer Street, seguidas el mismo \
año de Las cuatro etapas de la crueldad. Su amigo el escritor y magistrado Henry Fielding \
acaba de publicar un ensayo sobre el aumento de los robos, que acusa también a la ginebra. \
Los versos grabados bajo la imagen son del pastor James Townley. Para llegar a un público \
popular, Hogarth vende estas estampas a un chelín la pieza. La ley sobre la ginebra se aprueba el \
mismo año, y el consumo disminuye en los años siguientes. Este ejemplar pertenece \
a la National Gallery of Art de Washington."""
facture = """
Hogarth, formado en el grabado sobre plata, graba él mismo la plancha de cobre combinando \
el aguafuerte, por la libertad del dibujo, y el buril, por los tallados nítidos y \
regulares. Anunciaba haber publicado estas láminas de la manera más económica \
posible, para un público popular: trazos marcados, contrastes francos, personajes \
expresivos hasta la caricatura. La composición, construida con una perspectiva profunda, \
conduce el ojo del primer plano, donde todo cae, hacia el fondo, donde todo se derrumba. Los \
letreros, las enseñas y los versos grabados bajo la imagen forman parte del relato, que se lee \
como los textos de una historieta."""
details = [
  "El letrero sobre el sótano, abajo a la izquierda: borracho por un penique, borracho perdido por dos, la paja gratis.",
  "La enseña del prestamista, S. Gripe, cuyo nombre evoca la codicia.",
  "El barbero ahorcado bajo el tejado de la casa en ruinas, arriba a la derecha.",
  "El campanario coronado por una estatua del rey Jorge I, al fondo.",
  "El precio, «Price 1s», grabado abajo del todo a la derecha.",
]
themes = ["sátira", "alcohol", "londres", "miseria", "moral"]
anecdote = """
Al ser copiadas y vendidas más baratas sus exitosas estampas, Hogarth obtuvo del \
Parlamento, en 1735, una ley apodada «Hogarth's Act», que protegía por \
primera vez en Inglaterra a los grabadores contra las falsificaciones de sus obras."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "El sueño de la razón produce monstruos (Caprichos, lámina 43)"
artiste = "Francisco de Goya"
annee = "1799"
image = "sommeil-raison.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Francisco_José_de_Goya_y_Lucientes_-_The_sleep_of_reason_produces_monsters_(No._43),_from_Los_Caprichos_-_Google_Art_Project.jpg"
technique = "Aguafuerte y aguatinta, aproximadamente 21,5 × 15 cm"
collection = "Nelson-Atkins Museum of Art, Kansas City (primera edición)"
note = "Un hombre se ha dormido sobre su mesa de trabajo; tras él surgen búhos, murciélagos y un lince: la lámina más famosa de los Caprichos."
description = """
Un hombre vestido a la moda de finales del siglo XVIII se ha desplomado sobre una mesa, con la \
cabeza hundida entre los brazos. Junto a él yacen unas hojas y un portalápiz. \
Tras su espalda, una nube de criaturas nocturnas se alza de la oscuridad: búhos \
y lechuzas de ojos redondos, uno de los cuales parece tenderle un lápiz, \
murciélagos que vuelan hacia lo alto de la imagen, un gato negro agazapado del que solo \
se ven los ojos. A la derecha, tumbado en el suelo, un lince de orejas puntiagudas fija al \
durmiente sin moverse. En el costado de la mesa, unas letras claras dan el título: \
El sueño de la razón produce monstruos. El fondo, de un gris granuloso, se oscurece a \
medida que las bestias se multiplican, hasta las siluetas negras que se pierden en \
el cielo."""
evocation = """
En español, sueño significa a la vez el dormir y el soñar: la razón que duerme o \
la razón que sueña. Los historiadores ven en ella ante todo un manifiesto de la Ilustración, que \
Goya compartía con sus amigos reformistas: cuando la razón se adormece, las \
supersticiones, la ignorancia y los vicios, figurados por las aves nocturnas, vuelven a \
imponerse. Un comentario manuscrito antiguo, conservado en el Prado, explica que \
la fantasía abandonada de la razón produce monstruos imposibles, pero que unida \
a ella es madre de las artes. La lámina puede leerse, por tanto, también como un \
retrato del artista, asediado por las visiones que alimentan su obra. El lince, \
animal de vista penetrante, permanece despierto mientras el hombre duerme. Dos siglos después, \
la imagen se ha convertido en el emblema mismo de la pesadilla."""
histoire = """
Goya trabaja en los Caprichos a partir de 1797, pocos años después de la grave enfermedad \
que lo dejó sordo. Esta lámina debía abrir en un principio la colección: un dibujo \
preparatorio, conservado en el Museo del Prado, muestra al mismo durmiente con una inscripción \
que lo presenta como el autor soñando. En la versión definitiva, \
ocupa el centro de la serie, con el número 43, y es un autorretrato de Goya, de \
perfil, el que abre las ochenta láminas. El 6 de febrero de 1799, el Diario de Madrid \
anuncia la puesta a la venta de los Caprichos en una tienda de perfumes y licores de \
la calle del Desengaño, en la planta baja de la casa del pintor. La venta cesa al \
cabo de unos días, sin duda por temor a la Inquisición. En 1803, Goya cede \
las planchas de cobre y los ejemplares sin vender al rey, a cambio de una pensión para su \
hijo."""
facture = """
Goya combina dos técnicas de grabado en hueco sobre cobre. El aguafuerte le permite \
dibujar libremente con la punta sobre un barniz, como con una pluma: contornos del \
hombre, plumas de los búhos, alas de los murciélagos. La aguatinta, una resina fina \
espolvoreada sobre la plancha y luego mordida con ácido, crea los fondos grises de aspecto granuloso \
y los matices de sombra, como una aguada. Al proteger ciertas zonas del ácido, \
hace surgir el título en letras claras sobre la mesa y las alas blancas del búho \
central. Las pruebas de la primera edición, como esta, conservan un grano fino y \
unos grises profundos."""
details = [
  "El búho que tiende un portalápiz al durmiente, como para obligarlo a dibujar.",
  "Los ojos brillantes de un gato negro, agazapado justo detrás de la espalda del hombre.",
  "El lince tumbado a la derecha, único animal que permanece inmóvil.",
  "El título grabado en letras claras en el costado de la mesa.",
  "Los murciélagos que se pierden en el gris del cielo, arriba.",
]
themes = ["sueño", "razón", "ilustración", "pesadilla", "sátira"]
anecdote = """
Las planchas de cobre originales de los Caprichos existen todavía. Ingresadas en las colecciones \
reales en 1803, se conservan en la Calcografía Nacional, en Madrid, que ha tirado de ellas \
numerosas ediciones póstumas hasta el siglo XX."""
salle = 3
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Los bañistas, doble página del Hokusai manga (tomo IV)"
artiste = "Katsushika Hokusai"
annee = "1816"
image = "hokusai-manga.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hokusai-MangaBathingPeople.jpg"
technique = "Xilografía impresa en negro y gris, doble página de un libro"
collection = "Hokusai manga, tomo IV; ejemplares en numerosos museos"
note = "Nadadores, buceadores, un jinete en el agua: una página de los cuadernos de Hokusai, enciclopedia dibujada de la vida japonesa publicada en quince volúmenes."
description = """
En dos páginas enfrentadas, una veintena de bañistas chapotean en un agua \
figurada mediante finas líneas onduladas. A la izquierda, un hombre trepa por un gran \
poste, otros se zambullen de cabeza o forcejean y, abajo, un jinete \
cruza a nado, tendido sobre el cuello de su caballo, que estira las patas. A la derecha, \
los nadadores adoptan todas las posturas: uno flota con un gran aro alrededor del \
cuerpo, otro lleva un gran fardo al hombro, otros se vuelven, bucean o \
parecen caminar por el fondo del agua, entre plantas acuáticas, pequeñas tortugas y \
peces negros. Los cuerpos, apenas cubiertos con un taparrabos, están captados en pleno \
movimiento, sin decorado ni paisaje. Arriba a la derecha, unos caracteres indican el \
tema de la página."""
evocation = """
La palabra manga, que Hokusai elige para estos volúmenes, significa aproximadamente «dibujos al \
correr del pincel» o «bocetos diversos». Aún no designa la historieta \
japonesa, aunque esta le tomó prestado el nombre en el siglo XX. Estas páginas son \
ante todo modelos: repertorios de formas destinados a alumnos y artesanos, \
que podían copiar en ellos un gesto, un animal o una herramienta. Pero se percibe sobre todo la \
curiosidad insaciable de Hokusai por el cuerpo humano en movimiento, y su humor: los \
nadadores tienen gestos concentrados, asustados o beatíficos. La doble página funciona \
como una lámina de estudio, casi una descomposición del movimiento, mucho antes de la \
fotografía. Se han reconocido en ella técnicas de natación practicadas en Japón en la época \
de Edo, incluso por los guerreros."""
histoire = """
Durante una estancia en Nagoya, en 1812, Hokusai realiza para sus alumnos cientos de \
bocetos. Un editor de la ciudad saca de ellos un primer volumen, publicado en 1814, cuyo \
éxito es tal que la serie continúa: este tomo IV aparece en 1816. Los doce \
primeros volúmenes salen entre 1814 y 1834; los tres últimos, compuestos en parte \
de dibujos que habían quedado inéditos, aparecen mucho más tarde, el decimoquinto en 1878, casi \
treinta años después de la muerte del artista. El conjunto reúne miles de figuras: \
gentes de oficio, dioses, animales, plantas, paisajes, fantasmas. Impresos en gran número y \
vendidos a precio moderado, los volúmenes circulan por todo Japón. En el siglo XIX \
llegan a Europa, donde los artistas los descubren con pasión: la Manga se convierte en uno \
de los libros japoneses más admirados en París, en tiempos del japonismo."""
facture = """
Cada página es una xilografía: Hokusai dibuja con pincel sobre un papel fino, \
que el grabador pega del revés sobre una tabla de cerezo antes de tallar la madera \
alrededor de los trazos. Una segunda tabla imprime los planos grises, aquí el agua y algunas \
sombras. El trazo es rápido, flexible, de gran economía: unas pocas curvas \
bastan para una espalda que se arquea o una pierna que bate el agua. Las figuras están \
dispersas por la página sin marco ni suelo, como en una hoja de bocetos, y el ojo \
pasa libremente de una a otra. El agua, representada con líneas onduladas paralelas, \
unifica el conjunto."""
details = [
  "El jinete tendido sobre su caballo, que nada con las patas estiradas, abajo a la izquierda.",
  "El bañista que trepa por el gran poste, a la izquierda.",
  "Las pequeñas tortugas y los peces negros, abajo a la derecha.",
  "El nadador que flota con un gran aro alrededor del cuerpo, arriba a la derecha.",
]
themes = ["cuerpo", "movimiento", "agua", "japón", "boceto", "manga"]
anecdote = """
Según un relato famoso pero discutido, el grabador Félix Bracquemond habría descubierto un \
volumen de la Manga en 1856, en casa de su impresor parisino, donde había servido para embalar \
porcelanas venidas de Japón. Luego se lo habría mostrado con entusiasmo a sus \
amigos artistas."""
salle = 3
mur = "sud"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Historia del señor Jabot, una lámina"
artiste = "Rodolphe Töpffer"
annee = "1833"
image = "histoire-de-m-jabot.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Histoire_de_Mr_Jabot_-_par_Rodolphe_Töpffer_-_btv1b8529023n_(44_of_70).jpg"
technique = "Autografía (litografía a partir de un dibujo a pluma), álbum apaisado de aproximadamente 16 × 25 cm"
collection = "Biblioteca Nacional de Francia, París"
note = "Tres viñetas, tres leyendas: el señor Jabot, que quiere entrar en la alta sociedad, en apuros con sus perros. Uno de los primerísimos álbumes de historieta."
description = """
La página está dividida en tres viñetas rectangulares, trazadas a pluma, con bajo \
cada una una leyenda manuscrita. En la primera, el señor Jabot, con el sombrero volando, \
las piernas flacas en escuadra, forcejea en medio de tres perritos que se le echan \
encima; la leyenda explica que los perros son tan amables que casi los encuentra \
demasiado confianzudos. En la segunda, él ya no está: los tres perros, atados a los \
pies de su cama en el hotel, esperan, tumbados junto a una silla. En la tercera, \
tocado con un sombrero alto y recto, tiende tarjetas de visita a un criado tieso \
ante una puerta: lleva quince tarjetas a casa del señor du Bocage, dice la leyenda, pues la \
familia se compone de quince personas. El trazo es rápido, casi garabateado, y \
los decorados se reducen a unas pocas líneas."""
evocation = """
El señor Jabot es un burgués vanidoso que sueña con entrar en la buena sociedad e \
imita torpemente sus usos: las visitas, los bailes, los buenos modales. Töpffer \
se burla de él con una ironía tierna, mostrando el desajuste entre sus pretensiones \
y sus gestos de marioneta. Lo cómico reside aquí en el ritmo: la repetición, la elipsis \
entre las viñetas, el remate de la tercera leyenda, de un absurdo muy serio. \
Es exactamente lo que hará más tarde la historieta: hacer nacer el sentido del \
paso de una imagen a otra. Töpffer era consciente de ello; explicaba que sus \
dibujos, sin el texto, solo tendrían un significado oscuro, y que el texto, sin \
los dibujos, no significaría nada. Para muchos historiadores, es el nacimiento de un \
nuevo lenguaje."""
histoire = """
Hijo de un pintor ginebrino, Töpffer dirige en Ginebra un internado de muchachos. Ya en \
1827 dibuja para divertirlos historias en imágenes que no piensa publicar. \
Sus álbumes manuscritos circulan, sin embargo, y llegan hacia 1830 hasta Goethe, en \
Weimar, que los lee con entusiasmo y desea verlos impresos. Alentado, \
Töpffer publica en 1833 la Historia del señor Jabot, la primera de sus historias en \
aparecer, reproducida en la imprenta ginebrina de Freydig. Siguen el señor Crépin y \
el señor Vieux Bois en 1837, y luego el señor Pencil y el doctor Festus. El éxito \
supera pronto Suiza: aparecen ediciones piratas en París, y las historias de \
Töpffer son copiadas e imitadas por toda Europa. Este ejemplar del álbum se \
conserva en el Departamento de Estampas de la Biblioteca Nacional de Francia."""
facture = """
Töpffer dibuja a pluma, con un trazo deliberadamente libre, casi infantil, que \
privilegia la expresión sobre la exactitud. Utiliza la autografía, una variante de la \
litografía: dibuja y escribe con tinta grasa sobre un papel especial, cuyo \
trazado se transfiere luego a la piedra litográfica para la impresión. El procedimiento \
le permite trabajar deprisa y escribir él mismo sus leyendas, sin pasar por un \
grabador. Las viñetas, de anchura variable, se separan con un simple trazo; el texto, \
siempre bajo la imagen, avanza al mismo paso que el dibujo. Él mismo teorizó esta \
manera en su Ensayo de fisiognomía, en 1845."""
details = [
  "El sombrero que vuela sobre la cabeza del señor Jabot, en la primera viñeta.",
  "El monograma RT de Töpffer, bajo la viñeta central.",
  "El número de la página, 34, arriba a la derecha.",
  "El criado tieso como un palo ante la puerta, en la última viñeta.",
]
