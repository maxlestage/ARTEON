[[oeuvres]]
titre = "Gira del Chat Noir de Rodolphe Salis"
artiste = "Théophile-Alexandre Steinlen"
annee = "1896"
image = "tournee-chat-noir.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Théophile-Alexandre_Steinlen_-_Tournée_du_Chat_Noir_de_Rodolphe_Salis_(Tour_of_Rodolphe_Salis'_Chat_Noir)_-_Google_Art_Project.jpg"
technique = "Litografía en color, 135,9 × 95,9 cm"
collection = "Zimmerli Art Museum, Universidad Rutgers, New Brunswick (Nueva Jersey)"
note = "Un gato negro sentado, con aureola como un santo, anuncia la gira de la troupe del célebre cabaré de Montmartre: el cartel más famoso de Steinlen."
description = """
Un gran gato negro, sentado, con el cuerpo de perfil y la cabeza vuelta hacia nosotros, ocupa \
toda la mitad izquierda del cartel. Su silueta está perfilada por un ribete dorado, sus \
ojos claros almendrados fijan al transeúnte, sus bigotes se estiran como hilos. \
Tras su cabeza brilla una aureola roja, ornada como un rosetón gótico, en la que se \
adivinan letras. El gato está sentado sobre una cinta roja en la que se inscribe en grandes \
letras el nombre de Rodolphe Salis; a la derecha, sobre el fondo ocre, las palabras «Tournée du \
Chat Noir», en letras rojas y negras dibujadas a mano. Arriba, un discreto \
«Prochainement». A lo largo del borde derecho corre la dirección del impresor Charles Verneau; \
abajo a la izquierda, la firma de Steinlen."""
evocation = """
El gato negro era el emblema del cabaré de Rodolphe Salis, y Steinlen hace de él una \
especie de ídolo. La aureola, que recuerda a los santos de las vidrieras, es una broma \
típica del espíritu del lugar, mezcla de devoción paródica y de burla: el cabaré \
se daba aires de vieja taberna, con un decorado de falsas antigüedades y \
camareros vestidos de académicos. En las letras del halo se ha leído la divisa «Montjoye \
Montmartre», pastiche del grito de guerra de los reyes de Francia, «Montjoie \
Saint-Denis». El gato, misterioso, independiente, algo inquietante, encarna también la \
bohemia artística de Montmartre, insolente con el burgués. Steinlen, que adoraba a los \
gatos, los dibujó toda su vida."""
histoire = """
Rodolphe Salis abre en 1881, en el bulevar de Rochechouart, al pie de Montmartre, el \
cabaré del Chat Noir, que se convierte en el punto de encuentro de poetas, cancioneros y \
pintores. En 1885 se instala en la calle de Laval, hoy calle Victor-Massé, en una \
casa más amplia donde se ofrecen célebres espectáculos de teatro de sombras. Salis \
publica también un semanario, Le Chat Noir, en el que colabora Steinlen. En \
1896 lleva a su troupe de gira por provincias y encarga a Steinlen este cartel, \
impreso por Charles Verneau, para anunciarla de ciudad en ciudad. Salis muere al año \
siguiente, en 1897, y el cabaré cierra poco después. El cartel, en cambio, nunca ha dejado \
de reproducirse. Este ejemplar pertenece al Zimmerli Art Museum de la Universidad \
Rutgers, en Estados Unidos."""
facture = """
Steinlen simplifica la forma del gato hasta convertirla en una silueta, un gran plano \
negro recortado, realzado solo con unas pocas líneas doradas que sugieren el pelaje y \
las patas. Esta manera de perfilar las formas y de aplicar colores francos sin \
modelado procede de las estampas japonesas, muy admiradas en París. La paleta se limita a \
unos pocos tonos: el negro, el rojo, el ocre del fondo y el oro. Las letras, dibujadas a \
mano, forman parte de la composición: la C de «Chat» se redondea, la cola del gato se \
curva entre las letras de Rodolphe. El conjunto está concebido para ser legible desde \
muy lejos."""
details = [
  "La aureola roja, dibujada como un rosetón de vidriera, tras la cabeza del gato.",
  "La cola que se enrosca entre las letras de Rodolphe.",
  "La palabra «Prochainement», sola arriba a la derecha.",
  "La firma de Steinlen, abajo a la izquierda, y la dirección del impresor Verneau, a lo largo del borde derecho.",
]
themes = ["gato", "montmartre", "cabaré", "bohemia", "publicidad"]
anecdote = """
Existen dos estados de este cartel: en uno se lee «Tournée du Chat Noir de \
Rodolphe Salis», en el otro, «Tournée du Chat Noir avec Rodolphe Salis». Aquí se expone \
la primera versión."""
salle = 2
mur = "nord"
place = 4
largeur = 1.0

[[oeuvres]]
titre = "Little Nemo in Slumberland, lámina del 29 de septiembre de 1907"
artiste = "Winsor McCay"
annee = "1907"
image = "little-nemo.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Little_Nemo_1907-09-29_(borderless).jpg"
technique = "Impresión en color sobre papel de periódico, una página entera del suplemento dominical"
collection = "Publicada en el New York Herald, el 29 de septiembre de 1907"
note = "Convertido en gigante, Little Nemo vaga entre los rascacielos de Nueva York antes de despertarse en su cama: una página de la más suntuosa historieta de comienzos del siglo XX."
description = """
La página está dividida en siete viñetas de distintos tamaños. Arriba, en todo el \
ancho, Nemo, un niño en pijama blanco, y el Imp, un pequeño salvaje vestido con una \
falda de hierbas, están en cuclillas de noche sobre el tejado de un rascacielos: un proyector \
barre el cielo y escribe en él que el rey Morfeo ofrece nueve trillones de dólares a quien \
encuentre a Nemo. En las tres viñetas siguientes, altas y estrechas, los dos niños, \
convertidos en gigantes, descienden por las fachadas; a sus pies, en la calle, una multitud \
diminuta y un tranvía amarillo. Más abajo, Nemo llega al río donde están amarrados \
transatlánticos y entra en él hasta las rodillas, mientras Flip, su compañero bromista, \
acude corriendo por los tejados llamándolo. En la última viñeta, muy pequeña, Nemo está \
en su cama, zarandeado por su madre."""
evocation = """
Cada domingo, Little Nemo, cuyo nombre significa «nadie» en latín, parte en sueños \
hacia Slumberland, el país del sueño, donde lo espera la hija del rey Morfeo; cada \
domingo, la aventura acaba con un despertar brusco, a menudo una caída de la cama. McCay \
explora así todas las lógicas del sueño: cambios de tamaño, ciudades que se \
deforman, perspectivas imposibles. Esta página muestra también el Nueva York de 1907, \
el de los primeros rascacielos, los transatlánticos y las multitudes, visto como un decorado a la \
vez maravilloso y abrumador. El niño gigante, perdido en una ciudad demasiado grande, \
busca simplemente su camino. Se ha visto en ella una imagen de la infancia frente al mundo moderno; \
la historieta se convierte aquí en un arte del sueño."""
histoire = """
Winsor McCay comienza Little Nemo in Slumberland el 15 de octubre de 1905, en el \
suplemento dominical en color del New York Herald, uno de los grandes diarios de \
la ciudad. La serie aparece cada semana a toda página, un formato inmenso que deja \
al dibujante total libertad de maquetación. El éxito es considerable: se saca de ella \
una comedia musical en Broadway en 1908, juguetes, postales. En \
1911, McCay pasa al magnate de la prensa William Randolph Hearst y prosigue la \
serie con otro título, antes de retomarla brevemente en el Herald en la década de \
1920. Impresas en un frágil papel de periódico, estas páginas fueron descuidadas durante mucho tiempo; \
desde entonces han sido objeto de numerosas reediciones, algunas en el formato original."""
facture = """
McCay, que había aprendido dibujo de perspectiva, construye sus viñetas como decorados \
de teatro: las fachadas de los rascacielos, con sus centenares de ventanas, están \
trazadas con una precisión de arquitecto. Hace variar el tamaño y la forma de las \
viñetas según la acción: muy altas y estrechas cuando Nemo desciende a lo largo de los \
edificios, anchas cuando la ciudad se extiende, minúscula para el regreso a la cama. Sus dibujos \
a tinta, muy finos, se coloreaban en la imprenta, en planos de tonos \
pastel. El rotulado de los bocadillos, a mano, forma parte de la imagen. La influencia del \
Art Nouveau se lee en el título decorativo, en lo alto de la página."""
details = [
  "El mensaje del rey Morfeo escrito por el proyector en el cielo, en la primera viñeta.",
  "El tranvía amarillo y la multitud diminuta al pie de los rascacielos, en la cuarta viñeta.",
  "Los transatlánticos amarrados a los muelles, más pequeños que Nemo.",
  "La firma de Winsor McCay, en la última viñeta, cerca de la cama.",
  "La mención del copyright del New York Herald, abajo a la izquierda.",
]
themes = ["sueño", "infancia", "nueva york", "historieta", "rascacielos"]
anecdote = """
McCay fue también un pionero del dibujo animado. En 1914 presentaba en escena a Gertie \
el dinosaurio: de pie ante la pantalla, daba órdenes al animal dibujado, que \
parecía obedecerle, y luego desaparecía tras la pantalla para reaparecer en la \
película, a lomos de Gertie."""
salle = 5
mur = "est"
place = 2
