[[oeuvres]]
titre = "Londres visto desde el ferrocarril (Over London – by Rail)"
artiste = "Gustave Doré"
annee = "1872"
image = "londres-chemin-de-fer.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:YCBA_London_a_Pilgrimage_06_(cropped).jpg"
technique = "Xilografía de Adolphe Pannemaker a partir de Gustave Doré, lámina del libro London: A Pilgrimage"
collection = "Yale Center for British Art, New Haven (colección Paul Mellon)"
note = "Desde un viaducto, la mirada se hunde en los patios de las casas obreras de Londres: la imagen más célebre del Londres de Doré."
description = """
La mirada queda enmarcada por un arco de ladrillo, como si uno se asomara desde un \
viaducto de ferrocarril. Debajo se alinean, hasta perderse de vista, casas obreras \
todas iguales, pegadas unas a otras, con sus chimeneas de ladrillo y \
sus tejados de teja. Cada una tiene tras de sí un diminuto patio cerrado con tablas, \
donde se apiñan los habitantes: mujeres sentadas, niños, un barril, ropa tendida. Otros \
se asoman a las ventanas. Al fondo, otro viaducto de arcadas cierra la perspectiva, y \
un tren pasa por él soltando un penacho de humo que se mezcla con el cielo gris. En primer \
plano a la derecha, chimeneas y tejados muy oscuros. La luz cae \
desde arriba, entre los muros, sobre los patios alineados como viñetas."""
evocation = """
Doré muestra el Londres de los pobres de la era industrial, que el ferrocarril salva \
sin detenerse. Las casas repetidas hasta el infinito, los patios estrechos como \
celdas, la gente hacinada dicen la miseria y el anonimato de la gran ciudad moderna. \
El viajero del tren lo ve todo y no comparte nada: el arco que enmarca la imagen lo sitúa \
en lo alto, como espectador. Una parte de la crítica inglesa de la época reprochó a \
Doré haber ennegrecido la ciudad y haberla visto con ojos de romántico francés; \
otros reconocieron en ella una verdad que los londinenses acomodados preferían ignorar. \
La imagen sigue siendo hoy una de las más reproducidas del Londres victoriano, y uno de los \
grandes testimonios visuales sobre la ciudad industrial."""
histoire = """
En 1868, el periodista inglés Blanchard Jerrold propone a Doré, entonces inmensamente \
popular en Gran Bretaña, un gran libro sobre Londres. Durante varias estancias, \
los dos hombres recorren la ciudad, de los muelles a las carreras de Epsom, de los salones \
de la aristocracia a los asilos nocturnos, a veces escoltados por policías en los barrios \
más peligrosos. Doré toma pocos bocetos in situ y compone después sus dibujos \
de memoria. London: A Pilgrimage aparece en 1872 en Grant & Co., primero por \
entregas y luego en volumen, con unos ciento ochenta grabados. La obra resulta \
cara y la acogida de la crítica es dividida, pero se impone como un testimonio \
mayor sobre la ciudad victoriana. Este ejemplar pertenece al Yale Center for British \
Art, en New Haven."""
facture = """
Doré dibujaba directamente sobre el taco de madera, a la aguada y a lápiz, en tonos \
degradados más que en trazos. Los grabadores que trabajaban para él, aquí Adolphe \
Pannemaker, debían traducir esos grises en una red apretada de finos tallados paralelos: \
es el llamado grabado «de tono», que imita la pintura. De ahí esa atmósfera de \
bruma y hollín, donde domina el negro. La composición juega con una perspectiva \
vertiginosa, una vista cenital que huye hacia el viaducto del fondo, y con la repetición \
casi mecánica de las chimeneas y los patios. El arco del primer plano da al \
espectador su lugar."""
details = [
  "El tren y su penacho de humo, sobre el viaducto del fondo.",
  "Los barriles y las empalizadas de tablas que separan los patios.",
  "Los habitantes asomados a las ventanas, a la izquierda.",
  "La firma de Doré, diminuta, abajo a la izquierda.",
]
themes = ["ciudad", "londres", "industria", "miseria", "ferrocarril"]
anecdote = """
Vincent van Gogh admiraba este libro. En 1890, en el asilo de Saint-Rémy, pintó \
a partir de otro de sus grabados, el patio de la prisión de Newgate, su Ronda de \
presos, conservada hoy en el Museo Pushkin de Moscú."""
salle = 4
mur = "est"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Baile del Moulin Rouge"
artiste = "Jules Chéret"
annee = "1889"
image = "bal-moulin-rouge.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Bal_au_Moulin_Rouge,_by_Jules_Chéret.jpg"
technique = "Litografía en color, cartel impreso por Chaix, París"
collection = "Hessisches Landesmuseum, Darmstadt"
note = "El cartel de la inauguración del Moulin Rouge, en la plaza Blanche, en 1889: bailarinas risueñas cabalgan asnos a los pies del molino."
description = """
Sobre un fondo claro, un gran molino de un rojo vivo, de aspas de madera, se alza en el centro. \
Ante él, una joven rubia de vestido amarillo escotado, tocada con un sombrero \
florido, cabalga riendo sobre un asno negro; sostiene las riendas con una mano y una rama \
con la otra. Tras ella, otra bailarina, con los brazos en alto, se arregla el peinado. A la \
izquierda, en tonos grises, azules y rosas, como atrapadas en un torbellino, otras \
mujeres pasan sobre asnos o bailan. Arriba, gruesas letras rojas sombreadas de \
azul forman un arco: Bal du Moulin Rouge, place Blanche. Abajo, el programa: \
todas las noches y domingos de día, gran fiesta los miércoles y sábados. La firma de \
Chéret está inscrita a la izquierda, cerca del borde."""
evocation = """
Chéret inventa aquí una imagen de la fiesta parisina que va a perdurar: una joven \
libre, risueña, en movimiento, a la que pronto se llamará una «chérette». No es \
ni una diosa ni una cortesana, sino una parisina de juerga, y su brillo sirve para \
vender un lugar de placer. Los asnos y el molino recuerdan que Montmartre era \
todavía, poco antes, un pueblo de molinos y campos. Todo respira la ligereza \
del París de la Exposición Universal de 1889, la de la torre Eiffel. Los críticos \
gustaban de comparar las figuras voladoras y los colores claros de Chéret con los \
de Watteau y de Tiepolo, a quienes admiraba. Para muchos contemporáneos, sus carteles \
transformaban la calle en un museo abierto a todos."""
histoire = """
El Moulin Rouge abre sus puertas el 6 de octubre de 1889, al pie de la colina de Montmartre, \
en la plaza Blanche, durante la Exposición Universal. Sus fundadores, Joseph Oller y \
Charles Zidler, lo conciben como un lugar de baile y de espectáculo donde se mezclen todas \
las clases sociales, y encargan el cartel de inauguración a Chéret, el maestro indiscutido \
del género, que trabaja entonces para la gran imprenta Chaix. El cartel anuncia el \
baile y sus veladas de fiesta en los muros de París. Dos años después, en 1891, el \
Moulin Rouge encargará un nuevo cartel a un joven pintor, Henri de \
Toulouse-Lautrec, que hará famosa en él a la bailarina La Goulue. La imagen de Chéret fue \
reproducida en formato reducido en la revista Les Maîtres de l'affiche, que difundía los \
más bellos carteles entre los coleccionistas. Este ejemplar se conserva en el Hessisches \
Landesmuseum de Darmstadt."""
facture = """
Chéret dibuja él mismo sus carteles sobre la piedra litográfica, una piedra por \
color. Reduce deliberadamente su paleta a unos pocos tonos, el rojo, el amarillo, \
el azul y el negro, que superpone y hace vibrar mediante sombreados y punteados. \
Las mezclas ópticas obtenidas dan ese difuminado luminoso alrededor de las figuras. La \
composición está hecha para leerse de lejos, en un instante: un personaje principal \
en diagonal, en pleno movimiento, y letras dibujadas a mano que forman parte de la \
imagen. Las figuras secundarias, casi transparentes, sugieren la multitud y la \
música."""
details = [
  "Las aspas del molino, trazadas en rojo sobre el cielo azul.",
  "Las flores rosas esparcidas sobre el vestido amarillo de la amazona.",
  "La bailarina de brazos en alto, detrás, que se arregla el peinado.",
  "La dirección de la imprenta, «Imp. Chaix (Ateliers Chéret), 20 rue Bergère», a lo largo del borde izquierdo.",
]
themes = ["fiesta", "parís", "montmartre", "baile", "publicidad"]
anecdote = """
En 1890, Chéret recibe la Legión de Honor por haber creado una nueva rama del \
arte, aplicando el arte a la impresión comercial e industrial. El Museo de \
Bellas Artes de Niza, ciudad donde murió, lleva hoy su nombre."""
salle = 2
mur = "nord"
place = 1
largeur = 1.0

[[oeuvres]]
titre = "«He besado tu boca, Iokanaan» (Salomé)"
artiste = "Aubrey Beardsley"
annee = "1893–1894"
image = "salome-climax.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Aubrey_Beardsley's_Illustrations_to_Salome_by_Oscar_Wilde_MET_DP863674.jpg"
technique = "Impresión fotomecánica de línea a partir de un dibujo a tinta china"
collection = "Metropolitan Museum of Art, Nueva York (carpeta publicada por John Lane, 1906–1907)"
note = "Salomé flota en el aire y contempla la cabeza cortada de san Juan Bautista: la escena final de la obra de Oscar Wilde, en blanco y negro absoluto."
description = """
Sobre un fondo repartido entre el blanco y el negro, Salomé flota en el aire, \
arrodillada sobre el vacío, con los cabellos erguidos en mechones rizados como cuernos o \
serpientes. Sostiene entre sus manos la cabeza cortada de san Juan Bautista, \
Iokanaan, y la mira directamente a los ojos, con su rostro muy cerca del suyo. De la cabeza, \
de largos cabellos enmarañados, cae un fino hilo de sangre que desciende hasta la parte baja de \
la imagen, en un charco negro; de este charco se eleva un alto lirio. Arriba a la \
izquierda, una masa de círculos y medias lunas, como burbujas o escamas, forma \
un decorado casi abstracto. Una gran curva blanca, en el centro, recorta una media luna \
de luz sobre el negro. Todo está dibujado a línea, sin ningún gris."""
evocation = """
La obra de Oscar Wilde termina en este momento: Salomé, que ha obtenido del rey Herodes la \
cabeza del profeta que la había rechazado, besa por fin esa boca muerta y le dice: \
«He besado tu boca, Iokanaan». Beardsley hace de ello una imagen de una audacia inaudita \
para la Inglaterra victoriana: el deseo y la muerte unidos, sin patetismo, con una \
elegancia glacial. El lirio, flor de la pureza, nace de la sangre del santo, como un símbolo \
irónico. La imagen encarna la estética decadente de finales de siglo, fascinada por la \
mujer fatal y por un Oriente soñado. El estilo, nutrido de estampas japonesas y de vasos \
griegos, escandalizó tanto como la propia obra, cuya representación había sido \
prohibida en Londres en 1892."""
histoire = """
Beardsley, de veinte años, dibuja una primera versión de esta escena en 1893, tras haber \
leído Salomé, que Wilde acababa de publicar en francés. El dibujo se reproduce en abril de \
1893 en el primer número de la revista The Studio, en un artículo que revela al \
joven artista al público. El editor John Lane le encarga entonces las ilustraciones de \
la traducción inglesa de la obra, publicada en 1894. Beardsley redibuja la escena, \
más depurada, con el título The Climax. Varios de sus dibujos para el libro, \
juzgados indecentes, son rechazados o retocados antes de la publicación. Tras la muerte del \
artista, Lane reedita las ilustraciones en carpeta, en 1906-1907: de esta \
colección procede esta hoja, hoy en el Metropolitan Museum de Nueva York."""
facture = """
Beardsley dibuja con pluma y tinta china sobre papel blanco, con una \
precisión de orfebre. Rechaza el modelado y el sombreado: la imagen solo conoce dos \
valores, el negro pleno y el blanco desnudo, separados por líneas de una finura extrema, \
a veces bordeadas de pequeños trazos como pestañas. Los grandes planos negros, los vacíos \
blancos y los arabescos de los cabellos se equilibran como en una estampa japonesa. \
El dibujo se reproduce mediante un procedimiento fotomecánico, el cliché de línea, que imprime \
exactamente el trazo del artista, sin grabador intermediario. Beardsley concibió su \
estilo para este procedimiento nuevo."""
details = [
  "El hilo de sangre que cae de la cabeza hasta el charco, abajo.",
  "El lirio que crece en el charco de sangre.",
  "Los cabellos de Salomé, erguidos en mechones rizados.",
  "El borde de pequeños trazos, como pestañas, a lo largo de la gran curva blanca.",
  "Los racimos de círculos y medias lunas, arriba a la izquierda.",
]
themes = ["decadencia", "mujer fatal", "teatro", "blanco y negro", "japonismo"]
anecdote = """
Beardsley murió de tuberculosis a los veinticinco años, en Menton. Pocos días antes de su \
muerte, suplicó por carta a su editor Leonard Smithers que destruyera sus dibujos \
obscenos; Smithers no hizo nada de eso."""
salle = 5
mur = "nord"
place = 2
