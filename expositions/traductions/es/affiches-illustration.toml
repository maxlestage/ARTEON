[exposition]
ordre = 158
nom_court = "Carteles y cómic"
mouvement = "Carteles, grabado e historieta"
cadre = "estampe"
couleur = "#a3352b"
titre = "La imagen impresa, del grabado al cartel y la historieta"
artiste = "Hogarth, Goya, Hokusai, Töpffer, Tenniel, Doré, Chéret, Steinlen, McCay…"
dates = "1751–1916"
accroche = "Exposición virtual · Biblioteca Forney, Hôtel de Sens, París"
introduction = """
Antes del cine y la televisión, la gran imagen popular es impresa: el grabado \
vendido a un chelín, el libro ilustrado, la página del periódico dominical, el cartel pegado en \
los muros de la ciudad. La visita sigue esta historia de 1751 a 1916, desde las sátiras \
grabadas de Hogarth y de Goya hasta los carteles de Chéret, de Steinlen y de Cappiello, pasando \
por los cuadernos de Hokusai, las primeras historias en imágenes de Töpffer, \
la Alicia de Tenniel y el Little Nemo de Winsor McCay. El edificio se inspira en el Hôtel \
de Sens, mansión gótica del Marais, en París, que alberga la Biblioteca Forney y su \
colección de carteles: un porche, una gran sala, una torre cuadrada, una biblioteca \
y un gabinete. Los grabados y las páginas de libros, a menudo pequeños, se presentan aquí \
ampliados."""
vitrine = "tournee-chat-noir.jpg"

[musee]
nom = "Hôtel de Sens · Biblioteca Forney"
ville = "París, Francia"
construction = "Finales del siglo XV y comienzos del XVI; Biblioteca Forney desde 1961"
presentation = """
Hasta 1622, París depende del arzobispado de Sens, en Borgoña. Para alojar a sus \
arzobispos durante sus estancias en la capital, el arzobispo Tristan de Salazar \
manda construir, a partir de finales del siglo XV, esta mansión al borde del Marais, cerca del \
Sena. Es una de las pocas grandes residencias medievales conservadas en París: un \
porche de arco apuntado entre dos torrecillas, tejados empinados, buhardillas \
labradas, una torre cuadrada que alberga la escalera de caracol. La reina Margot vive en ella en 1605 y 1606. \
Ocupado más tarde por artesanos y comercios, el edificio es adquirido por el Ayuntamiento \
de París en 1911 y largamente restaurado. Desde 1961 alberga la Biblioteca \
Forney, fundada en 1886 gracias al legado del industrial Samuel-Aimé Forney para los \
artesanos del barrio de Saint-Antoine. Dedicada a las artes decorativas, a los oficios artísticos \
y a las artes gráficas, conserva una de las más importantes colecciones públicas \
de carteles de Francia. En la fachada sigue incrustada una bala de cañón, con la fecha \
del 28 de julio de 1830."""
ici = """
El edificio de ARTEON toma del Hôtel de Sens su porche, su torre cuadrada y sus muros \
de piedra clara. Se entra por el sur en «El porche», que da a «La gran \
sala · El cartel», de dieciséis metros de largo y ocho de alto, donde los carteles se \
enfrentan en los muros norte y sur. Al oeste, «La torre · Sátira y pesadillas», cuadrada \
y de nueve metros de altura, reúne los grabados. Al norte, «La biblioteca · El libro \
ilustrado»; al este, «El gabinete · La línea y la viñeta», más bajo y más íntimo, \
pone fin a la visita."""

