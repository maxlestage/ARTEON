[[artistes]]
nom = "Carel Fabritius"
vie = "Middenbeemster (Holanda), bautizado el 27 de febrero de 1622 – Delft, 12 de octubre de 1654"
biographie = """
Hijo de un maestro de escuela de Beemster, un pólder al norte de Ámsterdam, Carel Pietersz \
empieza trabajando como carpintero: el nombre latino de Fabritius, que adopta, \
procedería de faber, el artesano. A principios de la década de 1640, ingresa en el taller de \
Rembrandt en Ámsterdam, del que se convierte en uno de los discípulos más dotados. Su joven esposa \
muere en 1643; regresa durante algún tiempo a su pueblo natal. Hacia 1650, se \
instala en Delft, se vuelve a casar y en 1652 ingresa en el gremio de San Lucas. Allí pinta \
retratos, vistas de la ciudad y trampantojos, y participa en el renacimiento de \
la pintura de Delft, junto a Pieter de Hooch y el joven Vermeer. El 12 de octubre de \
1654, la explosión del polvorín de la ciudad destruye su casa; muere a causa de sus \
heridas a los treinta y dos años. Gran parte de su obra ha desaparecido: hoy se le \
atribuyen menos de una quincena de cuadros."""
style = """
Formado por Rembrandt, Fabritius invierte la lección de su maestro: coloca figuras \
oscuras sobre fondos claros y luminosos. Su pincelada es libre, espesa, y \
se interesa por la perspectiva y las ilusiones ópticas. Sus investigaciones sobre la luz \
del día contaron sin duda para los pintores de Delft, empezando por Vermeer, \
a quien a menudo se ha considerado su heredero."""

[[artistes]]
nom = "Jacob Jordaens"
vie = "Amberes, 19 de mayo de 1593 – Amberes, 18 de octubre de 1678"
biographie = """
Hijo de un comerciante de telas de Amberes, Jacob Jordaens se forma con Adam van \
Noort, que fue también uno de los maestros de Rubens. Admitido como maestro en el gremio de San Lucas \
en 1615 como pintor al temple, se casa al año siguiente con Catharina, la hija de \
su maestro. Nunca hace el viaje a Italia y conoce el arte italiano por los \
grabados y por los cuadros de las colecciones de Amberes. Colabora con Rubens, \
en particular en decoraciones y cartones de tapiz, y dirige un taller muy \
activo. Tras la muerte de Rubens y de Van Dyck, en 1640 y 1641, se convierte en el primer \
pintor de la ciudad. Trabaja tanto para la Iglesia como para las cortes extranjeras: hacia \
1651–1652, pinta para la viuda del estatúder Federico Enrique el gran Triunfo del \
príncipe, en la sala de Orange del palacio Huis ten Bosch, en La Haya. En la década de \
1650, se convierte al calvinismo. Muere en 1678, y reposa en Putte, justo al \
otro lado de la frontera, en un cementerio protestante."""
style = """
Jordaens es el pintor de la Flandes carnal y alegre: figuras robustas apretadas \
en primer plano, colores cálidos, luz dorada, pincelada grasa. Aprendió de Rubens \
el impulso barroco, pero sus modelos son más populares, y sus fiestas, como El rey bebe \
o Como cantan los viejos, mezclan el brillo de la vida con la moral de los proverbios."""

[[artistes]]
nom = "Antoine van Dyck"
vie = "Amberes, 22 de marzo de 1599 – Londres, 9 de diciembre de 1641"
biographie = """
Hijo de un rico comerciante de sedas de Amberes, Antoine van Dyck es un niño \
prodigio: entra de aprendiz a los diez años y pinta solo desde la adolescencia. Hacia \
1617–1620, trabaja en el taller de Rubens, que lo considera su mejor \
colaborador. En 1620, hace una primera estancia en Londres, y luego parte para Italia, \
donde permanece de 1621 a 1627: allí estudia a Tiziano y pinta, en Génova, los retratos de \
la aristocracia. De regreso en Amberes, se convierte en pintor de la infanta Isabel, \
gobernadora de los Países Bajos españoles, y pinta grandes retablos. En 1632, Carlos I \
lo llama a Londres, lo arma caballero y le concede el título de pintor principal de \
Su Majestad. Allí pinta al rey, a la reina Enriqueta María, a sus hijos y a toda la \
corte. Hacia 1640, se casa con Mary Ruthven, dama de honor de la reina. Agotado y enfermo, \
muere en Londres en 1641, pocos días después del nacimiento de su hija, y es \
enterrado en la antigua catedral de San Pablo."""
style = """
Van Dyck inventó el retrato aristocrático moderno: figuras esbeltas, \
poses naturales y elegantes, manos finas, telas de seda que brillan, \
fondos de paisaje o de columnas. Da a sus modelos una dignidad sin rigidez. Los \
retratistas ingleses del siglo XVIII, Gainsborough y Reynolds a la cabeza, se \
reclamaron de él."""

[[artistes]]
nom = "Clara Peeters"
vie = "Amberes (?), hacia 1588 – después de 1621"
biographie = """
Casi nada se sabe de la vida de Clara Peeters, salvo lo que dicen sus cuadros. \
Nació sin duda en Amberes hacia 1588; los archivos de la ciudad mencionan \
varias mujeres con ese nombre, sin que se pueda saber cuál es la pintora. Sus \
primeros cuadros fechados, de 1607 y 1608, cuando no tiene veinte años, son \
bodegones de comida y de flores, entre los más antiguos del género en Europa. \
Pinta mesas cargadas de pescados, de caza, de quesos, de pasteles, de \
copas de orfebrería, con una precisión excepcional. Su rastro se pierde a principios de la década de \
1620, tras su último cuadro fechado conocido. Hoy se le atribuyen \
algunas decenas de cuadros, varios de ellos en el Museo del Prado, en Madrid, ingresados en \
las colecciones reales españolas desde el siglo XVII. Firmaba a menudo sus \
obras, y deslizó su propio reflejo en varias de ellas."""
style = """
Clara Peeters dispone sus objetos sobre una mesa vista algo desde arriba, ante un fondo \
oscuro, cada uno bien distinto de los demás. Su pincelada minuciosa resuelve las materias con \
una verdad asombrosa: corteza de queso, escamas de pescado, metal repujado, \
vidrio. Contribuyó a fundar el bodegón de comida, que los pintores de Haarlem \
desarrollaron después."""

[[artistes]]
nom = "Pieter Claesz"
vie = "Berchem (cerca de Amberes), hacia 1597 – Haarlem, sepultado el 1 de enero de 1661"
biographie = """
Pieter Claesz nace hacia 1597 en Berchem, cerca de Amberes, en los Países Bajos españoles. Se \
ignora todo de su formación, pero sus primeras obras recuerdan los bodegones \
flamencos de Clara Peeters o de Osias Beert. A principios de la década de 1620, se instala en \
Haarlem, en Holanda, donde pasa el resto de su vida. Allí se convierte, junto con Willem Claesz \
Heda, en el maestro del bodegón llamado monocromo: unos pocos objetos corrientes, una \
jarra, un vaso, un arenque, una hogaza de pan, colocados sobre un mantel en una luz \
gris. Pinta también vanitas, en particular hacia 1630. Muy productivo, vende \
sus cuadros a una clientela burguesa. Su hijo, Nicolaes Berchem, llegará a ser uno \
de los paisajistas más célebres de su tiempo. Pieter Claesz muere en Haarlem a finales \
de 1660 y es sepultado el 1 de enero de 1661."""
style = """
Claesz reduce el bodegón a lo esencial: pocos objetos, una paleta de pardos, \
grises y ocres, una luz suave que viene de la ventana. Este estilo tonal, que unifica la \
escena en una misma atmósfera, rompe con la acumulación colorista de los flamencos. \
Da a los objetos más modestos una presencia grave y silenciosa."""

[[artistes]]
nom = "Willem Claesz Heda"
vie = "Haarlem, hacia 1594 – Haarlem, hacia 1680"
biographie = """
Willem Claesz Heda nace en Haarlem hacia 1594 y pasa allí toda su vida. Sus primeras \
obras conocidas, a principios de la década de 1620, son vanitas; se especializa luego \
en las mesas servidas, que se llaman banketjes, pequeños banquetes, u \
ontbijtjes, pequeños desayunos. Ya en 1628, el historiador Samuel Ampzing lo cita entre los \
pintores que honran a la ciudad. Junto con Pieter Claesz, lleva a su perfección \
el bodegón monocromo de los años 1630: un mantel blanco, platería, \
vasos, ostras y un limón, en una luz plateada. Miembro respetado del \
gremio de San Lucas, del que es varias veces dirigente, forma \
discípulos, entre ellos su hijo Gerrit Willemsz Heda, que pinta a su manera. Hacia 1640, sus \
composiciones se vuelven más grandes y más ricas. Muere en Haarlem hacia 1680, a \
una edad muy avanzada."""
style = """
Heda es el pintor de los reflejos: estaño, plata, oro y vidrio, resueltos con una \
delicadeza incomparable en una gama casi monocroma de grises y blancos. Sus \
mesas en desorden, donde una copa está volcada y un limón a medio pelar, dan la \
impresión de una comida suspendida. Su sobriedad elegante ha hecho de él uno de los maestros \
del bodegón europeo."""

[[artistes]]
nom = "Jan Davidsz de Heem"
vie = "Utrecht, 1606 – Amberes, 1683 o 1684"
biographie = """
Jan Davidsz de Heem nace en Utrecht en 1606, hijo de un músico. Se forma sin duda \
en su ciudad natal, en el entorno del pintor de flores Balthasar van der Ast. A \
mediados de la década de 1620, se instala en Leiden, donde pinta bodegones de \
libros y vanitas en tonos apagados. Hacia 1635–1636, parte para Amberes y allí se \
hace ciudadano: según el biógrafo Joachim von Sandrart, habría elegido la ciudad \
porque allí se encontraban frutas raras y los más hermosos objetos en abundancia. Al \
contacto con la pintura flamenca, su paleta se aclara y sus composiciones se vuelven \
suntuosas: grandes mesas de aparato, guirnaldas y ramos. Regresa a Utrecht \
a finales de la década de 1660, pero la invasión francesa de 1672 lo devuelve a Amberes, donde \
muere en 1683 o 1684. Sus hijos, entre ellos Cornelis de Heem, y numerosos discípulos \
prolongaron su manera."""
style = """
De Heem reúne la precisión holandesa y el esplendor flamenco. Sus ramos y sus \
mesas de aparato, ricos en colores brillantes sobre fondo oscuro, están compuestos con un \
sentido del movimiento barroco. Fue el modelo de los pintores de flores de finales del \
siglo XVII y del XVIII, tanto en Flandes como en Holanda."""

[[artistes]]
nom = "Adriaen Coorte"
vie = "Middelburg (?), hacia 1665 – Middelburg (?), después de 1707"
biographie = """
No se conoce ni la fecha de nacimiento ni la de muerte de Adriaen Coorte, nacido sin \
duda en Middelburg o en sus alrededores hacia 1665. Hacia 1680, parece haber aprendido \
su oficio en Ámsterdam con Melchior d'Hondecoeter, el pintor de aves, de quien se \
reconocen algunos motivos en sus primeras obras. De regreso en Middelburg, en \
Zelanda, trabaja allí el resto de su vida. Los archivos lo mencionan en 1695, cuando \
el gremio de San Lucas le impone una multa. Pinta casi exclusivamente cuadros pequeños, \
a menudo al óleo sobre papel pegado luego sobre madera: unas fresas, \
espárragos, grosellas, conchas, nísperos, sobre un reborde de piedra. Sus \
obras firmadas van de 1683 a 1707; se han catalogado unas ochenta. Olvidado \
durante casi dos siglos y medio, es redescubierto a partir de 1952 por \
el historiador Laurens J. Bol, que organiza una exposición en Dordrecht en 1958 y luego \
publica su catálogo en 1977."""
style = """
Coorte es el poeta del bodegón mínimo: unas frutas u hortalizas, un \
reborde de piedra, un fondo oscuro y una luz que viene de arriba. Sus pequeños formatos, \
de una sencillez casi abstracta, desprenden un silencio meditativo. Redescubiertos en el siglo \
XX, se han acercado a la pintura moderna por su desnudez."""

[[artistes]]
nom = "Jacob van Ruisdael"
vie = "Haarlem, 1628 o 1629 – Ámsterdam, marzo de 1682"
biographie = """
Jacob van Ruisdael nace en Haarlem en 1628 o 1629. Su padre, Isaack, es fabricante de marcos y \
marchante de cuadros, y su tío, Salomon van Ruysdael, es uno de los grandes \
paisajistas de la ciudad; probablemente se forma con ellos. Desde los \
dieciocho años, firma paisajes de una madurez asombrosa. Ingresa en el gremio de \
San Lucas de Haarlem en 1648. A principios de la década de 1650, viaja hacia la frontera \
alemana, donde descubre colinas boscosas y molinos de agua. Hacia 1656, se \
instala en Ámsterdam, donde pasa el resto de su vida. Allí pinta bosques, \
cascadas inspiradas en Escandinavia, playas, vistas de Haarlem y molinos. \
Forma a algunos discípulos, entre ellos Meindert Hobbema. No se casa. Muere en \
Ámsterdam en 1682 y es enterrado en la iglesia de San Bavón de Haarlem, su ciudad \
natal."""
style = """
Ruisdael es el mayor paisajista holandés. Sus cielos inmensos, sus árboles \
atormentados, sus molinos y sus cascadas dan a la naturaleza una grandeza dramática y \
a menudo melancólica. Sus composiciones sólidas, sus contrastes de luz y su \
paleta sobria alimentaron el paisaje romántico, de Constable a Caspar David Friedrich."""

[[artistes]]
nom = "Meindert Hobbema"
vie = "Ámsterdam, bautizado el 31 de octubre de 1638 – Ámsterdam, 7 de diciembre de 1709"
biographie = """
Nacido en Ámsterdam en 1638, Meindert Lubbertsz adopta el nombre de Hobbema desde su juventud. \
Hacia 1657, ingresa en el taller de Jacob van Ruisdael, quien declarará más tarde \
que lo sirvió y aprendió con él durante algunos años: es su único \
discípulo conocido. Sus primeras obras retoman los temas de su maestro, sotobosques, \
caminos, molinos de agua, en una luz más clara. A lo largo de la década de \
1660, pinta sus mejores cuadros de bosques y de granjas, muy apreciados por los \
aficionados de Ámsterdam. En 1668, se casa con Eeltje Vinck, cocinera al servicio de un \
burgomaestre de Ámsterdam; Ruisdael es testigo de la boda. Ese mismo año, obtiene un \
empleo en el arbitrio de la ciudad, que conserva hasta su muerte, y desde entonces pinta \
mucho menos. Muere pobre en Ámsterdam en 1709, y es enterrado en una tumba \
de la asistencia pública."""
style = """
Hobbema pinta paisajes apacibles y soleados: caminos forestales, molinos de \
agua, granjas en el linde del bosque, donde la luz se filtra entre los follajes. Menos \
dramático que Ruisdael, prefiere la armonía y la claridad. Su Avenida de \
Middelharnis, de perspectiva rigurosa, es una de las imágenes más célebres de \
la campiña holandesa."""

[[artistes]]
nom = "Frans Hals"
vie = "Amberes, hacia 1582–1583 – Haarlem, sepultado el 1 de septiembre de 1666"
biographie = """
Frans Hals nace en Amberes hacia 1582–1583, en una familia de pañeros. Tras la toma \
de la ciudad por los españoles en 1585, sus padres se instalan en Haarlem, en \
Holanda. Allí se forma, quizá con Karel van Mander, e ingresa en el gremio de \
San Lucas en 1610. En 1616, su gran retrato de grupo de los oficiales de la guardia \
cívica de San Jorge lo hace célebre. Pinta desde entonces a los notables de Haarlem, \
a las guardias cívicas, pero también a figuras populares, bebedores, músicos, niños \
risueños. Casado dos veces, padre de numerosos hijos, tiene a menudo deudas. En su \
vejez, la ciudad le paga una pensión. Hacia 1664, ya octogenario, pinta \
a los regentes y las regentas del hospicio de ancianos de Haarlem, obras maestras \
de una sobriedad asombrosa. Muere en 1666. Olvidado en el siglo XVIII, es \
redescubierto en el XIX; su antiguo hospicio alberga hoy el museo Frans Hals."""
style = """
Hals es el pintor del instante: sus modelos ríen, hablan, se vuelven, sorprendidos \
por una pincelada rápida y visible, aplicada sin retoques. Sus negros, sus blancos y sus \
acordes sobrios fascinaron a los pintores del siglo XIX, de Courbet a Manet y a Van \
Gogh, que veían en él a un precursor de la pintura moderna."""

[[artistes]]
nom = "Jan Steen"
vie = "Leiden, hacia 1626 – Leiden, sepultado el 3 de febrero de 1679"
biographie = """
Hijo de un cervecero católico de Leiden, Jan Steen nace hacia 1626. Se inscribe en \
la universidad de la ciudad en 1646, y luego se forma en la pintura, según las fuentes \
antiguas con Nicolaus Knüpfer en Utrecht, con Adriaen van Ostade en Haarlem y con \
Jan van Goyen en La Haya. En 1648, es uno de los fundadores del gremio de San Lucas \
de Leiden. Al año siguiente, se casa con Margriet van Goyen, la hija de su maestro. \
Lleva una vida itinerante: La Haya, Delft, donde alquila una cervecería, Warmond, y luego \
Haarlem de 1661 a 1670. De regreso en Leiden, obtiene en 1672 el permiso para abrir \
una posada. Viudo, se vuelve a casar en 1673. Muy productivo, pinta escenas de \
taberna, fiestas familiares, médicos a la cabecera de jóvenes, temas \
bíblicos y mitológicos. Muere en Leiden en 1679. Su fama de alegre bebedor, \
alimentada por sus propios cuadros, es en gran parte una leyenda."""
style = """
Steen es el gran narrador de la pintura holandesa. Sus escenas animadas, pobladas de \
personajes expresivos, ilustran a menudo proverbios y mezclan comedia y moral, \
a la manera del teatro. Se pone de buen grado en escena a sí mismo. Su técnica, heredada \
de la pintura minuciosa de Leiden, sabe también volverse amplia y rápida."""

[[artistes]]
nom = "Pieter de Hooch"
vie = "Róterdam, bautizado el 20 de diciembre de 1629 – Ámsterdam, sepultado el 24 de marzo de 1684"
biographie = """
Hijo de un albañil y de una comadrona, Pieter de Hooch nace en Róterdam en 1629. Se \
forma en Haarlem, según un biógrafo antiguo con el paisajista Nicolaes Berchem. En \
1652, está en Delft, donde trabaja también como sirviente de un rico comerciante de \
telas, que posee varios de sus cuadros. En 1654 se casa con Jannetje van der \
Burch e ingresa al año siguiente en el gremio de San Lucas de Delft. Allí, entre \
1655 y 1660 aproximadamente, pinta sus obras maestras: patios, interiores \
bañados de luz, madres y criadas trabajando, en el mismo ambiente que \
Vermeer. Hacia 1660–1661, se instala en Ámsterdam, donde su pintura se vuelve más \
lujosa, con interiores patricios y personajes elegantes. Sus últimos \
años son mal conocidos: muere en 1684 en el manicomio de Ámsterdam. En el siglo XIX, \
varios cuadros de Vermeer se vendieron bajo su nombre, señal de la \
proximidad de sus dos artes."""
style = """
De Hooch es el pintor de la casa holandesa: patios empedrados, vestíbulos, estancias en \
enfilada que se abren unas a otras. Su perspectiva rigurosa, su luz \
cálida y sus figuras serenas dan a la vida doméstica una serenidad ejemplar. \
Comparte con Vermeer el gusto por la luz del día."""
