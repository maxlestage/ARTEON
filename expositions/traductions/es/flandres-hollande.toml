[exposition]
ordre = 52
nom_court = "Flandes y Holanda"
mouvement = "Paisajes, bodegones y escenas de género de los Países Bajos"
cadre = "ebene"
couleur = "#3a5566"
titre = "Flandes y Holanda, el siglo de oro de lo cotidiano"
artiste = "Hals, Steen, De Hooch, Ruisdael, Clara Peeters, Van Dyck, Jordaens…"
dates = "1615–1705"
accroche = "Exposición virtual · Mauritshuis, La Haya"
introduction = """
En el siglo XVII, los antiguos Países Bajos están divididos en dos: al norte, la República de las \
Provincias Unidas, mercantil y protestante; al sur, Flandes, que sigue siendo española y \
católica. A ambos lados de la frontera, los pintores inventan géneros nuevos \
para una clientela de burgueses: el paisaje, el bodegón, la escena de la vida \
cotidiana. La visita reúne a trece pintores, desde Clara Peeters hasta Adriaen Coorte, y \
la fiesta flamenca de Jordaens y de Van Dyck. El edificio se inspira en el Mauritshuis de \
La Haya: un vestíbulo, una sala dorada en el centro y, a su alrededor, tres gabinetes \
de muros coloreados."""
vitrine = "chardonneret.jpg"

[musee]
nom = "Mauritshuis"
ville = "La Haya, Países Bajos"
architecte = "Jacob van Campen y Pieter Post"
construction = "1636–1641"
presentation = """
En 1631, el conde Juan Mauricio de Nassau-Siegen, primo del estatúder Federico Enrique, \
compra un terreno a orillas del Hofvijver, el estanque que bordea el Binnenhof, el corazón del \
poder en La Haya. Allí hace construir de 1636 a 1641, mientras gobierna el Brasil \
holandés, una residencia proyectada por Jacob van Campen y Pieter Post: un bloque de dos \
plantas, estrictamente simétrico, modelo del clasicismo holandés. Un incendio devasta el \
interior en 1704; la reconstrucción concluye en 1718 con la sala dorada, cuyo \
techo y cuyos sobrechimeneas pinta Giovanni Antonio Pellegrini. Adquirido por \
el Estado en 1820, el edificio acoge en 1822 el Gabinete Real de Pinturas, procedente de las \
colecciones de los príncipes de Orange. Ampliado por Hans van Heeswijk y reabierto en 2014, el \
Mauritshuis expone cerca de ochocientos cuadros, entre ellos La joven de la perla y El \
jilguero. Hoy evoca también la fortuna colonial de su constructor, procedente \
del azúcar brasileño y del trabajo de los esclavos africanos."""
ici = """
El edificio de ARTEON retoma la simetría del Mauritshuis, en una sola planta. Se entra \
por el sur en el vestíbulo, donde El jilguero recibe al visitante, y luego se pasa a \
la sala dorada, de nueve metros de altura, de muros de oro pálido en recuerdo de la decoración de \
Pellegrini: Jordaens y Van Dyck representan en ella a Flandes. Al oeste se abre el \
gabinete de los bodegones, de muros color topo; al este, la sala de los paisajes, verde \
pálido; al norte, la sala de la vida cotidiana, de color rosa viejo, dedicada a Hals, \
Steen y De Hooch."""

