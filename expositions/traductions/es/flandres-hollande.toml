[[oeuvres]]
titre = "El patio de una casa en Delft"
artiste = "Pieter de Hooch"
annee = "1658"
image = "cour-maison-delft.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Pieter_de_Hooch_-_The_Courtyard_of_a_House_in_Delft.jpg"
technique = "Óleo sobre lienzo, 73,5 × 60 cm"
collection = "National Gallery, Londres"
note = "Una criada y una niña en un patio empedrado y, al fondo del pasillo, una mujer que mira la calle: la paz de una casa de Delft."
description = """
El cuadro está dividido en dos por un pilar de ladrillo. A la izquierda, un arco de dovelas \
rojas y blancas se abre a un pasillo que atraviesa la casa; al fondo, una mujer con \
chaqueta negra y falda roja, de espaldas, mira la calle y las fachadas de enfrente. Un postigo \
rojo está abierto sobre el muro. Sobre el arco, una placa de piedra lleva una \
inscripción fechada en 1614. A la derecha, en un pequeño patio empedrado de ladrillos, una \
criada tocada de blanco, con una fuente en la mano, desciende un escalón llevando a una \
niña, que alza los ojos hacia ella. Una parra cubre un cobertizo de madera; un \
cubo y una escoba yacen sobre el empedrado. El cielo es azul, apenas nuboso."""
evocation = """
De Hooch hace de un momento sin historia un cuadro entero: un patio limpio, una \
niña guiada, una mujer que mira hacia fuera. Se leen en él las virtudes domésticas que \
Holanda valoraba, el orden, la limpieza, la educación, y el papel central de las mujeres \
en la casa. El umbral entre el interior y la calle, entre lo privado y lo público, está \
en el corazón de la composición. La placa sobre el arco procede del convento \
de San Jerónimo de Delft; invita al transeúnte a la paciencia y a la humildad, pues \
primero hay que descender para ser elevado. Se ha visto en esta inscripción la clave moral \
del cuadro."""
histoire = """
De Hooch vive en Delft desde principios de la década de 1650; ingresa en el gremio de \
San Lucas de la ciudad en 1655. En 1658 pinta una serie de patios y de casas \
soleadas, en los mismos años en que su contemporáneo Vermeer pinta La callejuela: los \
historiadores discuten todavía quién influyó en quién. La placa de 1614 existía de \
verdad: coronaba la entrada del antiguo convento. El cuadro perteneció al \
estadista británico Robert Peel; la National Gallery lo adquiere en 1871 con \
una parte de su colección."""
facture = """
De Hooch construye su escena con un rigor de arquitecto. El pilar central separa \
dos espacios, y cada uno se abre a otro más lejano: el pasillo conduce a la calle, \
el patio al cobertizo. Las líneas de los ladrillos y del empedrado siguen una perspectiva \
exacta. La luz de la tarde caldea los rojos y los amarillos del ladrillo, \
hace brillar la cal y recorta sombras nítidas. Las figuras, pequeñas, se integran \
en la arquitectura sin dominarla."""
details = [
  "La placa de piedra sobre el arco, fechada en 1614.",
  "Las iniciales P.D.H. y la fecha 1658, al pie del pilar de la izquierda.",
  "La mujer de espaldas al fondo del pasillo, que mira la calle.",
  "La escoba y el cubo de madera colocados sobre el empedrado.",
  "La parra que cubre el cobertizo, a la derecha.",
]
themes = ["vida cotidiana", "Delft", "casa", "luz", "perspectiva"]
anecdote = """
Los neerlandeses tienen una palabra para estas aberturas que comunican una estancia con otra, \
y luego con la calle: doorkijkje, la vista a través. De Hooch hizo de ello su firma, hasta \
el punto de que la palabra acompaña casi siempre a su nombre."""
