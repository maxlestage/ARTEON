[[oeuvres]]
titre = "Bodegón con copa dorada"
artiste = "Willem Claesz Heda"
annee = "1635"
image = "nature-morte-gobelet-dore.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Stilleven_met_vergulde_bokaal,_SK-A-4830.jpg"
technique = "Óleo sobre tabla, 88 × 113 cm"
collection = "Rijksmuseum, Ámsterdam"
note = "Una comida interrumpida: ostras abiertas, limón a medio pelar, copa de plata volcada a los pies de un gran cáliz dorado."
description = """
Una mesa está a medias cubierta con un mantel de damasco blanco, arrugado y remangado. \
Sobre platos de estaño, ostras abiertas, un panecillo partido y un cucurucho de \
papel; un cuchillo de mango negro sobresale de un plato. Detrás, un salero \
de plata, una jarrita de vidrio, una copa de vino tinto y un gran roemer, copa de \
pie verde llena de vino blanco. A la derecha se alzan un alto cáliz dorado, cuya \
tapa está coronada por una figurilla de soldado, y una gran jarra de estaño de \
tapa abierta. Una copa de plata está volcada sobre el mantel. En el borde de la mesa, \
un limón a medio pelar deja colgar su piel en espiral; al lado, un vaso tumbado."""
evocation = """
Este género de cuadro se llamaba banketje, pequeño banquete. La comida parece haber \
sido abandonada en el instante: la copa ha caído, el limón sigue empezado, las ostras \
esperan. Este desorden se ha leído como una imagen de lo efímero, de los placeres que \
pasan y de las cosas que se vuelcan. Los objetos de lujo, el cáliz de orfebrería, \
el limón llegado del sur, las ostras, invitaban quizá a la moderación; el limón, \
hermoso pero amargo, se ha entendido a veces como símbolo de una apariencia engañosa. Pero \
el cuadro es ante todo un elogio de la luz y de las materias, ofrecido a \
burgueses orgullosos de su prosperidad."""
histoire = """
Heda pasa toda su carrera en Haarlem, donde es miembro del gremio de San Lucas y \
donde se especializa en las mesas servidas. Ya en 1628, el historiador de la ciudad Samuel \
Ampzing cita su nombre entre los pintores que dan gloria a Haarlem. En 1635 está \
en la cumbre de su manera tonal, que comparte con Pieter Claesz: unos pocos objetos \
escogidos, una paleta reducida, una luz gris. Esta gran tabla, una de las más \
ambiciosas que pintó, es hoy uno de los bodegones más admirados \
del Rijksmuseum."""
facture = """
El cuadro es casi monocromo: gris, plata, oro, blanco y verde oscuro. La \
luz, que viene de la izquierda, resbala sobre el metal, atraviesa el vidrio y hace cantar \
los pliegues del mantel. La composición asciende en pirámide de izquierda a derecha, \
hasta el cáliz dorado que marca su cima. Heda pinta en capas finas, sin \
pincelada visible, y resuelve con igual justeza el reflejo del estaño, la transparencia \
del roemer y la nacarada de las ostras."""
details = [
  "La espiral de la cáscara de limón que cuelga del borde de la mesa.",
  "La pequeña figura de soldado que corona la tapa del cáliz dorado.",
  "El cucurucho de papel colocado en el plato de la izquierda, junto a las ostras.",
  "La copa de plata volcada, de la que se ve la parte inferior del pie.",
  "La firma HEDA y la fecha 1635, en el borde del mantel.",
]
themes = ["bodegón", "comida", "lujo", "luz", "Haarlem"]
anecdote = """
El limón, importado de España o de Italia, seguía siendo un lujo en las Provincias Unidas; \
se exprimía su zumo sobre las ostras. Su piel pelada en espiral, mitad lisa mitad rugosa, \
se convirtió en un pasaje de bravura que los pintores de bodegones gustaban de mostrar."""
salle = 3
mur = "ouest"
place = 3
largeur = 1.13

[[oeuvres]]
titre = "Jarrón de flores"
artiste = "Jan Davidsz de Heem"
annee = "hacia 1670"
image = "vase-de-fleurs.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jan_Davidsz_de_Heem_-_Vase_of_Flowers_-_1099_-_Mauritshuis.jpg"
technique = "Óleo sobre lienzo, 74,2 × 52,6 cm"
collection = "Mauritshuis, La Haya"
note = "Un ramo imposible: flores de todas las estaciones reunidas en un jarrón de vidrio, con frutas, insectos y un caracol."
description = """
Sobre un reborde de piedra, ante un fondo oscuro, un jarrón de vidrio redondo contiene un \
ramo exuberante. Lirios blancos y un lirio anaranjado se lanzan hacia lo alto, con \
amapolas, un iris violeta y un tulipán rayado de rojo y blanco. En el centro \
se abren rosas, una gran flor jaspeada de rosa y blanco, azulejos y \
campanillas azules. Espigas de trigo, grosellas espinosas, un albaricoque abierto y un \
melocotón se mezclan con las flores. Sobre el reborde reposan moras, cerezas y \
racimos de grosellas blancas y rojas. Por todas partes, la vida bulle: mariposas, \
abejorro, orugas, y un caracol que trepa por el jarrón. La firma está \
inscrita en la piedra, a la derecha."""
evocation = """
Ningún jardín ha ofrecido jamás este ramo: estas flores no se abren en el mismo \
momento del año. El pintor las ha reunido a partir de estudios hechos en cada estación, \
para componer una enciclopedia de la belleza natural. El cuadro celebra la riqueza \
de la creación y la pasión de los neerlandeses por la horticultura, que había hecho del \
tulipán un objeto de especulación. Se ha visto en él también una vanitas: las flores se marchitarán, \
los frutos se pudrirán, la oruga y el caracol roen ya las hojas. Los \
historiadores han propuesto lecturas religiosas, el trigo del pan eucarístico o la \
mariposa de la resurrección, pero el sentido permanece abierto."""
histoire = """
Jan Davidsz de Heem pinta este cuadro hacia 1670, en sus últimos años, cuando es \
uno de los pintores de flores más célebres de Europa, dividido entre Amberes y su \
ciudad natal, Utrecht. Sus ramos se venden muy caros y han formado a toda una \
generación de pintores de flores, tanto en Flandes como en Holanda. El cuadro perteneció \
a una colección privada en Suiza, y luego pasó por el comercio de arte de Maastricht. \
Ingresó en el Mauritshuis en 1993, gracias a una importante contribución del barón Hans \
Heinrich Thyssen-Bornemisza y al apoyo de la Asociación Rembrandt."""
facture = """
De Heem dispone las flores en una masa amplia y asimétrica, que desborda el jarrón y \
se abre en abanico. Sobre el fondo oscuro, los blancos, los rojos y los azules brillan \
como piedras preciosas. Cada pétalo está modelado con finas veladuras, capas de \
color transparentes, que dan al terciopelo de las rosas y al raso de los lirios su \
brillo. El vidrio del jarrón deja ver los tallos en el agua, y la luz, que viene de la \
izquierda, hace resaltar las flores del primer plano."""
details = [
  "El caracol que trepa por el jarrón, a la izquierda.",
  "Los tallos visibles a través del vidrio, en el agua.",
  "El tulipán estriado de rojo y blanco, flor de lujo en el siglo XVII.",
  "La gran mariposa amarilla y negra, posada abajo sobre el reborde de piedra.",
  "La firma J. D. De Heem, en el reborde a la derecha.",
]
themes = ["flores", "bodegón", "insectos", "estaciones", "vanitas"]
anecdote = """
Henri Matisse copió en el Louvre, en 1893, un bodegón de De Heem, Un postre. En \
1915 pintó de él una nueva versión, transformada por la geometría del cubismo, \
hoy en el Museum of Modern Art de Nueva York."""
salle = 3
mur = "nord"
place = 2
largeur = 0.85

[[oeuvres]]
titre = "Bodegón con fresas silvestres"
artiste = "Adriaen Coorte"
annee = "1705"
image = "fraises-des-bois.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Adriaen_Coorte_-_Still_Life_with_Wild_Strawberries_-_1106_-_Mauritshuis.jpg"
technique = "Óleo sobre papel pegado sobre tabla, 16,5 × 14 cm"
collection = "Mauritshuis, La Haya"
note = "Un pequeño montón de fresas silvestres y una flor de fresal sobre un reborde de piedra. El cuadro original no es mayor que una mano: aquí se muestra ampliado más de cuatro veces."
description = """
Sobre un reborde de piedra gris, de arista ligeramente desportillada, hay un montón de \
fresas silvestres de un rojo vivo, salpicadas de diminutos granos claros. Algunas están \
todavía unidas a su tallo, con sus sépalos verdes; otras, apenas \
maduras, siguen blancas. Un tallo se yergue en medio del montón y lleva una flor de \
fresal de cinco pétalos blancos y corazón amarillo, rodeada de capullos. Una hoja \
dentada se extiende a la derecha. Delante del reborde, un tallo cae con un último fruto y \
un capullo. Alrededor, el fondo es pardo negruzco, apenas aclarado arriba a la derecha. La \
firma del pintor está inscrita en la cara del reborde, y la fecha en la piedra \
debajo."""
evocation = """
Coorte prescinde de todo: ni vajilla preciosa, ni mantel, ni símbolo \
evidente. Solo quedan unos frutos del bosque, captados en el silencio, como en \
una meditación. La flor erguida sobre las fresas maduras y los frutos aún \
blancos reúne en una sola imagen todo el ciclo de la planta, floración, crecimiento, \
madurez, y cabe leer en ella el paso del tiempo. En la tradición cristiana, la \
fresa, fruto humilde que crece a ras de suelo, se asociaba también con la Virgen y con el \
paraíso. Frente a los ramos suntuosos de De Heem, este pequeño cuadro muestra otro \
camino: la grandeza por la modestia."""
histoire = """
Adriaen Coorte trabaja en Middelburg, en Zelanda, lejos de los grandes centros de Ámsterdam \
o de Haarlem. Pinta casi siempre en formatos pequeños, sobre papel luego pegado \
sobre tabla, para una clientela local. Este cuadro, fechado en 1705, figura entre sus \
últimas obras conocidas: sus cuadros firmados van de 1683 a 1707. Tras su muerte, \
cae casi por completo en el olvido. Hay que esperar a un artículo del historiador neerlandés \
Laurens J. Bol, en 1952, y luego a una exposición en el museo de Dordrecht en 1958, para que \
su nombre reaparezca; el Mauritshuis conserva hoy varios de sus pequeños \
cuadros."""
facture = """
Coorte pinta al óleo sobre una simple hoja de papel, con pinceles \
minúsculos: cada grano de fresa es un punto de color aplicado uno a uno. La luz, \
que viene de arriba a la izquierda, modela los frutos y los recorta sobre un fondo oscuro, \
ligeramente degradado. El reborde de piedra, visto de frente, sirve de escenario y da a la \
composición su estabilidad. La paleta se limita al rojo, al verde, al blanco y al pardo."""
details = [
  "Los diminutos granos claros pintados uno a uno sobre cada fresa.",
  "La flor blanca del fresal, de corazón amarillo, erguida sobre los frutos.",
  "Las fresas todavía blancas, sin madurar, mezcladas con las rojas.",
  "El tallo que cuelga delante del reborde, con un último fruto.",
  "La firma en la cara del reborde, y la fecha 1705 debajo.",
]
themes = ["bodegón", "frutas", "silencio", "miniatura", "Zelanda"]
anecdote = """
Casi nada se sabe de la vida de Coorte. Uno de los escasos rastros de archivo data de \
1695: el gremio de San Lucas de Middelburg le impone una multa por haber vendido un \
cuadro sin ser miembro."""
salle = 3
mur = "sud"
place = 2
largeur = 0.6

[[oeuvres]]
titre = "El molino de Wijk bij Duurstede"
artiste = "Jacob van Ruisdael"
annee = "hacia 1668–1670"
image = "moulin-de-wijk.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:De_molen_bij_Wijk_bij_Duurstede,_SK-C-211.jpg"
technique = "Óleo sobre lienzo, 83 × 101 cm"
collection = "Rijksmuseum, Ámsterdam"
note = "Un molino sombrío se alza contra un cielo de tormenta, a orillas del Lek: el paisaje holandés convertido en monumento."
description = """
El punto de vista es muy bajo, a ras del agua. A la derecha, sobre una orilla reforzada con \
pilotes de madera, se eleva un gran molino de piedra, redondo y achaparrado, rodeado por una \
galería; sus aspas se recortan contra el cielo. Tras él aparecen los tejados de \
la pequeña ciudad de Wijk bij Duurstede, el castillo de Duurstede, a la izquierda del molino, y \
una torre cuadrada. En el camino, a la derecha, unas mujeres tocadas de blanco se alejan. A \
la izquierda se extiende el Lek, ancho brazo del Rin, por donde se desliza un velero de velas blancas. \
En primer plano, unos juncos se estremecen al borde del agua agitada. Encima, un cielo \
inmenso, cargado de nubes grises y blancas, ocupa dos tercios del lienzo."""
evocation = """
El molino es el emblema mismo de Holanda, país ganado al agua gracias al trabajo de \
los hombres y a la fuerza del viento. Ruisdael lo sitúa en primer término y lo hace parecer \
gigantesco, como un monumento. Contra el cielo de tormenta, la silueta oscura expresa \
una resistencia tranquila; la luz que atraviesa las nubes promete el claro. A veces se \
ha buscado en sus paisajes un sentido religioso o moral; se ve en ellos sobre todo una \
poesía grave, que hizo decir a Goethe que Ruisdael era un poeta. El cuadro se ha \
convertido, para los neerlandeses, en la imagen de su paisaje nacional."""
histoire = """
Ruisdael, establecido en Ámsterdam desde mediados de la década de 1650, pinta este lienzo \
hacia 1668–1670. Wijk bij Duurstede es una pequeña ciudad a orillas del Lek, al sureste \
de Utrecht; él estuvo allí o se sirvió de dibujos, pero recompuso el lugar \
para dar al molino más presencia. El cuadro perteneció al banquero \
amsterdamés Adriaan van der Hoop, que legó su colección a la ciudad de Ámsterdam en \
1854. Prestado desde 1885 al Rijksmuseum, se ha convertido en uno de los paisajes más \
célebres de la pintura holandesa."""
facture = """
El horizonte, muy bajo, deja al cielo lo esencial del lienzo. El molino, sombrío, se \
recorta contra las nubes claras, y luego la luz toca un aspa y la fachada: \
Ruisdael juega sin cesar con estos contrastes. La orilla curva, bordeada de pilotes, conduce \
la mirada del primer plano hasta el molino. La paleta se mantiene sobria, hecha de grises, pardos \
y verdes, y las sombras de las nubes hacen correr sobre el paisaje zonas de luz \
y de sombra."""
details = [
  "Las mujeres tocadas de blanco que caminan por el camino, a la derecha.",
  "El velero blanco sobre el río, a la izquierda.",
  "Los pilotes de madera que sujetan la orilla.",
  "La galería que rodea el molino, a media altura.",
  "El castillo de Duurstede, medio oculto tras los árboles, a la izquierda del molino.",
]
themes = ["paisaje", "molino", "cielo", "río", "Holanda"]
anecdote = """
El molino pintado por Ruisdael fue derribado a principios del siglo XIX; aún se ven \
sus cimientos. A menudo se lo confunde con el molino Rijn en Lek, todavía en pie a \
pocas calles de allí."""
salle = 4
mur = "est"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "La avenida de Middelharnis"
artiste = "Meindert Hobbema"
annee = "1689"
image = "allee-de-middelharnis.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Meindert_Hobbema_001.jpg"
technique = "Óleo sobre lienzo, 103,5 × 141 cm"
collection = "National Gallery, Londres"
note = "Un camino bordeado de grandes árboles podados corre en línea recta hacia el pueblo de Middelharnis, en la isla de Goeree-Overflakkee."
description = """
Un camino de arena, surcado de rodadas, parte de la parte inferior del cuadro y corre en línea recta \
hasta el centro del horizonte. A cada lado se alzan árboles altos y muy delgados, \
de tronco desnudo, que solo conservan el follaje en la copa. Un hombre seguido de un perro \
desciende la avenida hacia nosotros. A la izquierda, más allá de los campos, el pueblo de Middelharnis y \
el campanario de su iglesia; a la derecha, una granja de tejados rojos, ante la que una \
pareja conversa. En primer plano, a la derecha, un hombre atiende los árboles jóvenes de un \
vivero alineados en hileras. Zanjas llenas de agua bordean el camino. El cielo, \
inmenso, está animado por nubes blancas."""
evocation = """
El cuadro está construido como una lección de perspectiva, con su punto de fuga \
único y su simetría casi perfecta, y sin embargo respira. Es un paisaje hecho \
por el hombre: un camino trazado a cordel, árboles plantados y podados, campos \
drenados, un vivero. Hobbema celebra así el orden y la prosperidad de un campo \
domesticado, muy lejos de los bosques salvajes de su maestro Ruisdael. El jardinero que \
cuida los árboles jóvenes, al pie de los grandes, evoca el tiempo largo: se planta para \
las generaciones venideras. Y la mirada, guiada por el camino, corre hasta el pueblo y \
más allá."""
histoire = """
Hobbema fue discípulo de Ruisdael en Ámsterdam. Tras su matrimonio en 1668, ocupa un \
empleo municipal y pinta mucho menos: este cuadro, fechado en 1689, es una obra \
tardía y excepcional. Middelharnis es un pueblo de la isla de Goeree-Overflakkee, \
en el sur de Holanda. Poco considerado en vida, Hobbema se convierte en el siglo XIX \
en uno de los pintores holandeses más buscados por los coleccionistas \
ingleses. El cuadro pertenece entonces al estadista Robert Peel; la National \
Gallery lo adquiere en 1871 con una parte de su colección."""
facture = """
Los troncos verticales, regularmente espaciados, ritman el lienzo como las columnas \
de una nave y guían la mirada hacia el punto de fuga. El camino claro forma un gran \
triángulo luminoso en el centro. Hobbema emplea una paleta más fresca y más clara \
que en sus cuadros de sotobosque: verdes tiernos, azules, ocres pálidos. La pincelada fina \
de los follajes contrasta con las grandes masas del cielo, pintadas con mayor amplitud."""
details = [
  "El campanario de la iglesia de Middelharnis, a la izquierda del camino.",
  "El hombre y su perro que descienden la avenida hacia nosotros.",
  "A la derecha, el hombre que cuida los árboles jóvenes del vivero.",
  "Las rodadas abiertas en la arena por las ruedas de los carros.",
  "La pareja que conversa ante la granja de tejados rojos.",
]
themes = ["paisaje", "perspectiva", "árboles", "camino", "cielo"]
anecdote = """
A partir de 1668, Hobbema es aforador de vinos del arbitrio de Ámsterdam: mide el \
contenido de los toneles importados para calcular el impuesto. Este oficio regular explica que \
sus cuadros se vuelvan raros en la segunda mitad de su vida."""
salle = 4
mur = "est"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "El bebedor alegre"
artiste = "Frans Hals"
annee = "hacia 1628–1630"
image = "joyeux-buveur.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Een_schutter_die_een_berkenmeier_vasthoudt,_bekend_als_%E2%80%98De_vrolijke_drinker%E2%80%99,_SK-A-135.jpg"
technique = "Óleo sobre lienzo, 81 × 66,5 cm"
collection = "Rijksmuseum, Ámsterdam"
note = "Un hombre de gran sombrero alza su vaso y nos saluda con la mano: un instante captado al vuelo, como una instantánea."
description = """
Un hombre aparece de medio cuerpo, casi de frente, ante un fondo neutro gris beige. \
Lleva un amplio sombrero negro de alas flexibles, un bigote retorcido hacia arriba y una perilla; \
sus mejillas están rojas, sus ojos chispean y su boca se entreabre como si fuera a \
hablar. Un gran cuello de encaje blanco cubre sus hombros, sobre un jubón de \
color amarillo ocre ceñido por un cinturón; un medallón cuelga sobre su pecho. Con una \
mano levantada, los dedos separados, hace una seña a alguien, quizá a nosotros. Con \
la otra, sostiene una gran copa de pie, un berkemeyer, llena de una bebida dorada. El \
monograma del pintor aparece en el fondo, a la derecha."""
evocation = """
El cuadro da la impresión de un instante tomado del natural: el bebedor acaba de \
volverse hacia nosotros, nos interpela, quizá nos invita a brindar. Se ignora quién \
es. El Rijksmuseum lo titula hoy «Un miliciano con un berkemeyer, conocido como El \
bebedor alegre»: su atuendo evoca a las milicias cívicas de Haarlem, que Hals pintaba en \
grandes retratos de grupo. No se trata sin embargo de un retrato oficial, sino \
más bien de una figura de carácter, entre el retrato y la escena de género. A veces se ha visto en él \
una advertencia contra la embriaguez; se ve sobre todo la alegría y el calor de una \
sociedad a la que le gusta beber en compañía."""
histoire = """
Hals pinta este cuadro en Haarlem hacia 1628–1630, en la época en que multiplica las figuras \
risueñas: bebedores, músicos, niños. Estos lienzos, hechos quizá para el mercado \
más que por encargo, labraron su reputación de pintor de la alegría de vivir; la \
más célebre después de esta, Malle Babbe, una vieja que se ríe con una \
jarra, se conserva en Berlín. El cuadro ingresó en el Rijksmuseum desde principios del \
siglo XIX. Como su autor, durante mucho tiempo juzgado demasiado descuidado, fue reevaluado en el siglo XIX, \
cuando los realistas y los impresionistas reconocieron en Hals a un precursor \
de su pintura libre."""
facture = """
Hals pinta deprisa, directamente, sin dibujo previo aparente. El cuello de encaje está \
hecho de trazos blancos en zigzag, la mano levantada con unas pocas pinceladas que la \
hacen borrosa, como en movimiento. La paleta se reduce al negro, al ocre, al blanco \
y al rojo de las mejillas, aplicados sobre una preparación clara. En una época en que se aman las \
superficies lisas, su pincelada visible, casi brutal, da a la figura una vida \
extraordinaria."""
details = [
  "La mano levantada, pintada con unas pocas pinceladas, como en movimiento.",
  "El monograma FH, a la derecha, a la altura del hombro.",
  "La gran copa de pie, cuyo contenido dorado capta la luz.",
  "El medallón colgado sobre el pecho.",
  "El cuello de encaje, resuelto con trazos blancos en zigzag.",
]
themes = ["retrato", "convivialidad", "bebida", "Haarlem", "instantánea"]
anecdote = """
En 1872, Manet va a ver los Hals en Haarlem. Al año siguiente, expone en el Salón La \
cerveza, un bebedor con pipa tan próximo a Hals que el pintor Alfred Stevens habría \
exclamado: bebe cerveza de Haarlem."""
salle = 5
