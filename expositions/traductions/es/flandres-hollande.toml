[[oeuvres]]
titre = "El jilguero"
artiste = "Carel Fabritius"
annee = "1654"
image = "chardonneret.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Carel_Fabritius_-_The_Goldfinch_-_605_-_Mauritshuis.jpg"
technique = "Óleo sobre tabla, 33,5 × 22,8 cm"
collection = "Mauritshuis, La Haya"
note = "Un pajarillo encadenado a su comedero, pintado el mismo año en que su autor muere en la explosión del polvorín de Delft. La tabla, apenas mayor que una hoja de cuaderno, se muestra aquí ampliada."
description = """
Sobre un muro claro, encalado, un pequeño comedero de madera pintado de gris está \
sujeto por dos ménsulas. Dos aros de madera en semicírculo lo rodean, uno \
por encima, otro a media altura. Sobre el aro superior se posa un jilguero, con el \
cuerpo vuelto hacia la derecha y la cabeza girada hacia nosotros. Se reconoce su antifaz rojo, \
sus mejillas blancas y la franja amarillo vivo de su ala. Una cadenilla muy fina, casi \
invisible, lo retiene: desciende a lo largo del comedero y cuelga en bucle bajo \
él. Encima, a la izquierda, un minúsculo recipiente. La sombra del pájaro y de la \
percha se alarga sobre el muro, a la derecha. Abajo, la firma y la fecha están trazadas en \
mayúsculas. No hay nada más: ni habitación, ni ventana, ni paisaje."""
evocation = """
El jilguero era un pájaro de compañía muy apreciado en la Holanda del siglo \
XVII. Se le enseñaba a tirar con el pico, de una cadenilla, de un pequeño cubo \
de agua o de semillas: de ahí su nombre neerlandés de puttertje, el pequeño sacador. En la \
pintura religiosa, este pájaro que se alimenta de semillas de cardo anunciaba la \
Pasión de Cristo; Fabritius, por su parte, hace de él un retrato, vivo y atento. Se ha visto en él \
una imagen del cautiverio, de la fidelidad o de la fragilidad de la vida, tanto más \
conmovedora cuanto que el pintor murió pocos meses después. Es también una \
demostración de virtuosismo: a cierta distancia, el pájaro parece realmente posado sobre \
un muro."""
histoire = """
Fabritius pinta esta tabla en Delft en 1654. No se sabe para quién, ni para qué \
servía: se ha supuesto que estaba fijada a un mueble o a un revestimiento de madera, para engañar \
al ojo. El 12 de octubre de 1654, el polvorín de la ciudad explota y devasta todo un \
barrio; Fabritius, herido en el derrumbe de su casa, muere a causa de sus heridas \
a los treinta y dos años. El cuadro reaparece en el siglo XIX en casa del crítico francés \
Théophile Thoré-Bürger, el redescubridor de Vermeer. Vendido en París tras su muerte, \
es adquirido en 1896 para el Mauritshuis por su director, Abraham Bredius. Se ha \
convertido, junto con La joven de la perla, en uno de los cuadros más famosos del museo."""
facture = """
A diferencia de los pintores minuciosos de Leiden, Fabritius deja ver su pincelada. El pájaro \
está construido con unas pocas pinceladas rápidas, la franja amarilla del ala aplicada en \
pasta espesa, el plumón sugerido más que descrito. Discípulo de Rembrandt, renunció sin embargo \
a los fondos oscuros de su maestro: la figura se recorta en claro sobre claro, \
contra un muro luminoso, y es la sombra proyectada la que le da su relieve. Vista de cerca, \
la pintura es libre y casi esbozada; vista de lejos, la ilusión es perfecta."""
details = [
  "La cadenilla, pintada de un solo trazo claro, que cuelga en bucle bajo el comedero.",
  "La franja amarilla del ala, aplicada con toques espesos.",
  "La sombra del pájaro y de la percha, proyectada sobre el muro a la derecha.",
  "La firma C FABRITIVS 1654, en mayúsculas, como inscrita en el yeso.",
  "El minúsculo recipiente colocado sobre el comedero.",
]
themes = ["pájaro", "trampantojo", "Delft", "cautiverio", "luz"]
anecdote = """
La novela de Donna Tartt El jilguero, publicada en 2013 y galardonada con el premio Pulitzer \
en 2014, tiene como hilo conductor este cuadro, que un adolescente se lleva de entre las ruinas \
de un museo neoyorquino golpeado por un atentado."""
salle = 1
mur = "nord"
place = 1
largeur = 0.7

[[oeuvres]]
titre = "El rey bebe"
artiste = "Jacob Jordaens"
annee = "hacia 1640–1645"
image = "le-roi-boit.jpg"
cadre = "dore"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jacob_Jordaens_-_The_Feast_of_the_Bean_King_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 242 × 300 cm"
collection = "Kunsthistorisches Museum, Viena"
note = "En la noche de Reyes, el anciano que ha encontrado el haba en el roscón es rey: cada vez que bebe, toda la mesa grita «¡El rey bebe!»."
description = """
En una sala de vidrieras, una gran familia está reunida en torno a una mesa. A \
la derecha, un anciano de barba blanca, tocado con una corona de papel dorado, bebe a \
largos tragos, con una jarra en la mano: es el rey del haba. En el centro, una joven \
también coronada, la reina, permanece serena y nos mira. A su alrededor, se \
grita, se ríe, se alzan los vasos; un hombre de azul echa la cabeza atrás gritando, y a \
la derecha un hombre tocado con un gorro de plumas ríe a carcajadas. A la izquierda, un comensal \
indispuesto se inclina hacia delante, mientras una niña bebe a su vez. En primer \
plano se amontonan jarras, fuentes y cesta de pan; un perro pide comida, un gato duerme. \
En lo alto, una cartela adornada con una máscara lleva una inscripción latina."""
evocation = """
La fiesta de los Reyes era una de las grandes celebraciones de Flandes: un roscón \
contenía un haba, y quien la encontraba se convertía en rey por una noche. Nombraba a su \
corte, consejero, cantor, bufón o copero, a menudo mediante papeletas sorteadas, \
y cada vez que bebía, había que gritar «¡El rey bebe!», bajo pena de multa. \
Jordaens celebra la abundancia y el calor de una casa flamenca, pero la inscripción, \
«Nada se parece más a un loco que un hombre ebrio», recuerda la lección: como en \
Jan Steen, la risa y la moral van juntas. Se ha creído reconocer en el viejo rey \
los rasgos de Adam van Noort, suegro y antiguo maestro del pintor."""
histoire = """
Jordaens pintó este tema en numerosas ocasiones a partir de finales de la década de \
1630: se conocen versiones en París, Bruselas, Kassel o San Petersburgo. \
La de Viena, una de las más grandes, data de los años en que, tras la muerte de Rubens \
en 1640 y de Van Dyck en 1641, Jordaens se convierte en el primer pintor de Amberes. Perteneció \
al archiduque Leopoldo Guillermo, gobernador de los Países Bajos españoles de 1647 a \
1656 y apasionado coleccionista, que se llevó sus cuadros a Viena. Pasado a las \
colecciones imperiales de los Habsburgo, el lienzo ingresó en el Kunsthistorisches Museum, \
donde se sigue exponiendo."""
facture = """
Las figuras, a tamaño natural, se apretujan contra el borde del cuadro como si la fiesta \
desbordara hacia nosotros. La composición asciende en diagonal, desde el bodegón de \
vajilla de abajo a la izquierda hasta el viejo rey a la derecha. Jordaens toma de Rubens las \
carnaciones rosadas y la pincelada generosa, pero sus modelos son más terrenales, tomados de \
las gentes de su entorno. La luz entra por la ventana de la izquierda y hace brillar \
el metal de las jarras, las mejillas rojas y las telas blancas."""
details = [
  "La cartela con la máscara risueña, arriba, con el lema latino sobre la embriaguez.",
  "El espejo colgado a la izquierda, donde se reflejan dos rostros.",
  "Las coronas de papel dorado del viejo rey y de la joven reina.",
  "El gato hecho un ovillo abajo a la derecha, indiferente al estruendo.",
  "Las pequeñas papeletas caídas al suelo, junto a las botas del bebedor de azul.",
]
themes = ["fiesta", "Epifanía", "familia", "embriaguez", "Flandes"]
anecdote = """
También en Francia se gritaba «¡El rey bebe!» en la comida de la Epifanía. El haba escondida \
en el roscón de Reyes, y la corona de papel que la acompaña, perpetúan \
hoy la costumbre pintada por Jordaens."""
salle = 2
mur = "nord"
place = 1
largeur = 3.0

[[oeuvres]]
titre = "Carlos I a la caza"
artiste = "Antoine van Dyck"
annee = "hacia 1635"
image = "charles-ier-a-la-chasse.jpg"
cadre = "dore"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Anthony_van_Dyck_-_Charles_I_at_the_Hunt_(cropped).jpg"
technique = "Óleo sobre lienzo, 266 × 207 cm"
collection = "Museo del Louvre, París"
note = "El rey de Inglaterra, apeado del caballo, posa como un caballero: ni corona, ni armadura, y sin embargo toda la majestad real."
description = """
En un paisaje, al borde de un bosque, Carlos I está de pie, a la izquierda, de tres \
cuartos. Lleva un amplio sombrero negro, un jubón de raso plateado, calzas \
rojas y altas botas claras con espuelas; una espada pende de su costado. Con una mano en \
la cadera y la otra apoyada en un bastón, vuelve la cabeza y nos mira por encima del \
hombro, con una seguridad tranquila. Tras él, un caballerizo sostiene su caballo \
gris, que baja la cabeza; un joven paje aparece entre ambos. Un gran árbol despliega \
sus ramas sobre el grupo. A la izquierda, el terreno desciende hacia una llanura y el \
mar, donde se adivina un velero, bajo un cielo de final de tarde. Abajo a la derecha, una \
inscripción latina designa al rey."""
evocation = """
Van Dyck representa al rey sin ningún atributo del poder: ni cetro, ni trono, ni \
manto de armiño. La majestad se expresa a través de la soltura, esa elegancia sin esfuerzo que se \
esperaba de un caballero. El punto de vista, tomado algo desde abajo, engrandece a un \
soberano de baja estatura, y el caballo que baja la cabeza parece inclinarse ante \
él. Es la imagen que Carlos quería dar de sí mismo: un príncipe refinado, aficionado al \
arte, seguro de su derecho divino. Con la perspectiva del tiempo, se lee también en ella la distancia de un rey que \
se negó a compartir el poder con su Parlamento; la guerra civil lo llevó al \
cadalso en 1649."""
histoire = """
Instalado en Londres en 1632, Van Dyck se convierte en el pintor principal de Carlos I, que \
lo ennoblece. Pinta este retrato hacia 1635, en el apogeo de su favor. Se ignora dónde \
se encontraba el cuadro en tiempos del rey; se menciona en Francia desde la primera \
mitad del siglo XVIII. Madame du Barry, favorita de Luis XV, lo poseía \
cuando se lo vendió a Luis XVI en 1775. Incorporado a las colecciones reales, \
pasa con ellas al Louvre tras la Revolución. Allí se ha convertido en uno de los retratos \
más admirados, y en un modelo para los retratistas europeos."""
facture = """
De Tiziano, estudiado durante sus años italianos, Van Dyck retuvo la riqueza del \
colorido y la fusión de la figura con el paisaje. El raso plateado del jubón está \
resuelto con pinceladas rápidas y brillantes, que captan la luz contra el fondo \
oscuro del follaje. Las armonías son sutiles: plata, rojo apagado, pardo y verde. \
La composición se organiza en diagonal, del rey hacia el caballo, y deja a la izquierda una \
salida luminosa que aísla la silueta real."""
details = [
  "La mano apoyada en la cadera, gesto de soltura y de autoridad.",
  "El caballo gris que baja la cabeza, como si saludara al rey.",
  "La perla que brilla en la oreja del rey.",
  "A lo lejos, a la izquierda, el mar y un velero diminuto.",
  "Las espuelas sujetas a las botas de cuero claro.",
]
themes = ["retrato", "rey", "Inglaterra", "elegancia", "caballo"]
anecdote = """
Luis XVI, que compra el cuadro en 1775, descendía de Carlos I por la hija de \
este, Enriqueta de Inglaterra. Los dos reyes conocieron el mismo destino: Carlos fue \
decapitado en Londres en 1649, Luis XVI en París en 1793."""
salle = 2
mur = "nord"
place = 4
largeur = 2.07

[[oeuvres]]
titre = "Bodegón con quesos, almendras y bretzels"
artiste = "Clara Peeters"
annee = "hacia 1615"
image = "fromages-amandes-bretzels.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Clara_Peeters_-_Still_Life_with_Cheeses,_Almonds_and_Pretzels_-_1203_-_Mauritshuis.jpg"
technique = "Óleo sobre tabla, 34,5 × 49,5 cm"
collection = "Mauritshuis, La Haya"
note = "Quesos, bretzels, pan y vino sobre una mesa; y, en la tapa de estaño de la jarra, el diminuto reflejo de la pintora. La tabla mide menos de 50 cm de ancho."
description = """
Sobre una mesa de madera, ante un fondo oscuro, se apilan los quesos: una gran \
rueda empezada, otra de corteza verdosa colocada delante, un trozo más seco \
encima y, sobre un plato de estaño elevado, un montículo de mantequilla en virutas \
estriadas. A la derecha se alzan una jarra de gres pardo con tapa de estaño y un alto \
vaso con tapa, lleno de vino, sobre un pie dorado; un panecillo está colocado tras \
él. En primer plano, dos bretzels entrelazados, un cuchillo de mango de plata que \
sobresale del borde de la mesa y una fuente de porcelana china azul y blanca, llena \
de almendras y frutos secos. Algunas almendras han caído sobre la mesa."""
evocation = """
Nada aquí de banquete principesco: es la mesa de una casa acomodada, con productos \
que flamencos y holandeses consideraban propios, el queso, la mantequilla, el \
pan. La porcelana china, en cambio, recuerda el comercio lejano que enriquece \
los puertos de los Países Bajos. El cuchillo grabado con el nombre de la pintora es un cuchillo de \
novia, regalo tradicional de las bodas, y el minúsculo autorretrato oculto en el \
reflejo de la jarra es una manera discreta, pero insistente, de afirmar su presencia \
en un oficio casi enteramente masculino. Cabe leer en ello un orgullo de artista: \
firmar dos veces, con su nombre y con su rostro."""
histoire = """
Clara Peeters trabaja en Amberes a principios del siglo XVII. Sus primeros cuadros \
fechados, de 1607 y 1608, la convierten en una de las primeras en pintar bodegones \
de comida, incluso antes que la mayoría de los maestros holandeses. Esta tabla data de \
hacia 1615. Es adquirida por el Mauritshuis en 2012, gracias a los Amigos del museo, a \
la Lotería BankGiro y a la Asociación Rembrandt. En 2016, el Museo del Prado dedica \
a Clara Peeters una exposición, la primera de su historia consagrada a una mujer \
pintora. El Mauritshuis, rico en bodegones holandeses, ha ganado con ella uno de los \
ejemplos más antiguos del género."""
facture = """
El punto de vista, ligeramente en picado, destaca cada objeto sin ocultarlo tras \
otro. Peeters pinta con pinceles muy finos, sobre tabla: los agujeros del queso, \
las estrías de la mantequilla, las migas del pan, el brillo del estaño y la transparencia del \
vidrio están resueltos con una precisión de orfebre. El fondo casi negro hace resaltar \
los ocres y los blancos cremosos, y la luz, que viene de la izquierda, da a cada forma \
un volumen firme."""
details = [
  "En la tapa de estaño de la jarra, el reflejo de una mujer tocada de blanco: la propia pintora.",
  "El nombre de Clara Peeters grabado en el mango de plata del cuchillo.",
  "Las virutas de mantequilla estriadas, sobre el plato elevado.",
  "La fuente de porcelana china azul y blanca, llena de almendras y frutos secos.",
  "Los dos bretzels entrelazados al borde de la mesa.",
]
themes = ["bodegón", "comida", "queso", "autorretrato", "mujeres pintoras"]
anecdote = """
No es el único autorretrato oculto de Clara Peeters. En un bodegón de \
1612 conservado en Karlsruhe, se pinta seis veces, diminuta, en los relieves de una \
copa dorada."""
salle = 3
mur = "ouest"
place = 1
largeur = 0.95

[[oeuvres]]
titre = "Vanitas"
artiste = "Pieter Claesz"
annee = "1630"
image = "vanite-claesz.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Pieter_Claesz_-_Vanitas_Still_Life_-_943_-_Mauritshuis.jpg"
technique = "Óleo sobre tabla, 39,5 × 56 cm"
collection = "Mauritshuis, La Haya"
note = "Un cráneo, un reloj, una lámpara apagada y un vaso volcado: todo recuerda que el tiempo pasa y que la muerte llega."
description = """
Sobre una mesa cubierta con un tapete verde oliva, una pila de libros viejos de páginas gastadas \
sirve de pedestal a un cráneo humano, colocado sobre una hoja de papel. Un hueso largo asoma \
tras él y una pluma de ganso está posada sobre los libros. A la izquierda, una lámpara de aceite \
apagada convive con una copa de pie tumbada de costado. En primer plano, un reloj \
de bolsillo dorado está abierto, con la tapa levantada; una cinta azul está sujeta a él, y una \
pequeña llave cuelga del borde de la mesa. Detrás, un muro desnudo, de un gris beige, recibe una \
luz suave que viene de la izquierda. En el canto de un libro, el pintor ha inscrito su \
monograma y la fecha."""
evocation = """
El título viene del Eclesiastés: «Vanidad de vanidades, todo es vanidad». Cada \
objeto encierra un sentido que los contemporáneos leían sin dificultad. El cráneo y el hueso hablan de \
la muerte, el reloj del tiempo que transcurre, la lámpara apagada de una vida que concluye, el \
vaso volcado de la vanidad de los placeres, los libros y la pluma de la del saber. En la \
Holanda calvinista, estos cuadros invitaban a meditar sobre la salvación. Pero plantean \
también una paradoja: al predicar el desprecio de las cosas, el pintor celebra su belleza, \
y se admira el brillo del oro y la transparencia del vidrio tanto como la lección."""
histoire = """
Pieter Claesz, establecido en Haarlem desde los años 1620, pinta esta tabla en 1630, en el \
momento en que inventa con Willem Claesz Heda un bodegón casi monocromo. Las \
vanitas son entonces muy buscadas, en particular en Leiden, ciudad universitaria donde \
gustan los cráneos, los libros y los relojes de arena. Claesz pintó varias, con \
unos pocos objetos solamente, dispuestos en un rincón de mesa. Este cuadro, que pasó por \
una colección sueca y por el comercio de arte de La Haya, fue adquirido por el Mauritshuis \
en 1960, con el apoyo de la Asociación Rembrandt."""
facture = """
La gama es voluntariamente restringida: pardos, ocres, grises y verdes apagados, \
realzados únicamente por el oro del reloj y el azul de la cinta. Una luz única, \
que viene de la izquierda, resbala sobre los objetos y unifica la escena en una atmósfera gris. \
La composición se organiza en diagonal, de la lámpara a los libros, y el cráneo, en lo \
alto, es su centro. Claesz resuelve con la misma atención la porosidad del hueso, el \
papel arrugado y el vidrio grueso."""
details = [
  "El monograma PC y la fecha 1630, en el canto de un libro, a la derecha.",
  "La pequeña llave del reloj, en el extremo de la cinta azul, que cuelga del borde de la mesa.",
  "La pluma de ganso colocada sobre los libros, a la derecha del cráneo.",
  "La copa de pie volcada, en la que se ven los botones de vidrio en relieve.",
  "Las páginas dobladas y gastadas de los libros apilados.",
]
themes = ["vanitas", "muerte", "tiempo", "bodegón", "Haarlem"]
anecdote = """
Su hijo, Nicolaes Berchem, llegó a ser uno de los paisajistas italianizantes más \
solicitados de Holanda. No firmaba Claesz, sino Berchem, por el nombre de la aldea \
natal de su padre, cerca de Amberes."""
salle = 3
mur = "ouest"
place = 2
