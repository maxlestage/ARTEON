[[oeuvres]]
titre = "Como cantan los viejos, así pían los jóvenes"
artiste = "Jan Steen"
annee = "hacia 1668–1670"
image = "comme-les-vieux-chantent.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jan_Steen_-_%27As_the_Old_Sing,_So_Pipe_the_Young%27_-_742_-_Mauritshuis.jpg"
technique = "Óleo sobre lienzo, 134 × 163 cm"
collection = "Mauritshuis, La Haya"
note = "Una fiesta familiar donde los adultos beben, fuman y cantan, ante los ojos de los niños que los imitan; el padre que ríe bajo su sombrero negro es el propio Jan Steen."
description = """
Una familia celebra una fiesta en una habitación iluminada por una ventana a la izquierda. Una joven \
con chaqueta verde ribeteada de piel, recostada en su sillón, tiende su vaso \
que un criado llena alzando bien alta una jarra. Detrás de ella, un anciano con \
gorro de piel sonríe. En el centro, una mujer sostiene a un recién nacido en fajas. A \
la derecha, una vieja con capucha oscura sigue con el dedo una hoja de canción. \
Tras ella, un hombre hilarante bajo un sombrero negro tiende una larga pipa a un niño \
pequeño; un adolescente tocado con piel toca la gaita, una niña mira a \
hurtadillas. Sobre la mesa: uvas, limón, ostras. Un loro rojo, una jaula de \
pájaros, y un perro en primer plano."""
evocation = """
El título recoge un proverbio neerlandés, popularizado por los emblemas del poeta \
Jacob Cats: los niños reproducen lo que hacen sus padres. El verbo neerlandés \
pijpen juega con varios sentidos: tocar la flauta, fumar en pipa, e incluso beber. Aquí, \
la vieja canta, el padre enseña a fumar a su hijo, la madre bebe, y los \
pequeños siguen el ejemplo. El loro, el pájaro que repite, da la clave. Steen se \
representa a sí mismo como mal ejemplo, con una autoironía jubilosa: el \
espectador ríe, y luego se reconoce. Jordaens había ilustrado ya el mismo proverbio en \
1638, en Amberes: la sabiduría popular une a Flandes y Holanda."""
histoire = """
Steen trató este proverbio en varias ocasiones; el Mauritshuis conserva otra \
versión, más pequeña y algo anterior. Esta, la más ambiciosa, data de los \
años en que vive en Haarlem, antes de su regreso a Leiden en 1670. Se pierde su rastro \
hasta principios del siglo XIX: vendida en 1816 en Warmond, cerca de Leiden, pasa \
luego a la colección Steengracht, en La Haya. Con la dispersión de esa \
colección, llega al Mauritshuis en 1913. Su atribución nunca ha sido puesta \
en duda."""
facture = """
Formado en el gusto de la pintura minuciosa de Leiden, Steen sabe resolver cada materia: la \
seda lavanda de la falda, la piel, el estaño, el pelo del perro. Pero pinta aquí \
con mayor amplitud, sobre un gran lienzo, y dispone sus personajes como los actores \
de una escena de teatro, en friso, con gestos muy legibles. Los colores vivos, \
verde, rosa, rojo, estallan en la luz de la ventana. Cada rostro tiene su \
expresión, y el ojo pasa de un episodio a otro como en una historia."""
details = [
  "El loro rojo en su percha, arriba a la izquierda: el pájaro que repite.",
  "El hilo de vino que cae de la jarra alzada hasta el vaso.",
  "La larga pipa de barro que el padre tiende al niño.",
  "La hoja de canción que la vieja sigue con el dedo.",
  "El perro que levanta la cabeza hacia la mesa, en primer plano.",
]
themes = ["familia", "proverbio", "fiesta", "música", "educación"]
anecdote = """
En neerlandés, se dice todavía de una casa en desorden que es «una casa de Jan \
Steen», een huishouden van Jan Steen: la fama de sus alegres jaleos \
pintados ha sobrevivido más de tres siglos."""
salle = 5
mur = "nord"
place = 2
