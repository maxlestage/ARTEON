[[oeuvres]]
titre = "El emperador Justiniano y su corte"
artiste = "Mosaïstes de Ravenne"
annee = "hacia 547"
image = "justinien.jpg"
cadre = "aucun"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Meister_von_San_Vitale_in_Ravenna_003.jpg"
technique = "Mosaico mural: teselas de pasta de vidrio, de piedra y de oro"
collection = "Basílica de San Vital, Rávena (muro norte del ábside)"
note = "El emperador bizantino, el obispo Maximiano y su séquito llevan a la iglesia el pan de la eucaristía, sobre un fondo de oro."
description = """
Sobre un fondo de oro, una docena de hombres se mantienen de pie, de frente, alineados como para una fotografía oficial. En el centro, el emperador Justiniano lleva una corona de perlas y un nimbo, y un gran manto de púrpura prendido al hombro por una fíbula de piedras preciosas. Sostiene una amplia copa de oro. A su izquierda, calvo y enjuto, el obispo Maximiano, cuyo nombre está escrito sobre su cabeza, blande una cruz engastada de gemas; dos diáconos lo siguen con un libro de Evangelios adornado de piedras y un incensario humeante. A la derecha del emperador vienen unos dignatarios con manto blanco de banda púrpura y, después, unos soldados apretados tras un escudo marcado con el monograma de Cristo. Los pies, calzados con sandalias, se apoyan en un suelo verde sin profundidad."""
evocation = """
La escena muestra una procesión: el emperador lleva el pan de la eucaristía, como Teodora, en el muro de enfrente, lleva el vino. Justiniano nunca estuvo en Rávena, pero la imagen lo hace presente para siempre en el santuario, junto al altar. Su nimbo dice que reina por voluntad de Dios, y la composición reúne los tres pilares de su poder: la Iglesia con Maximiano, la administración con los dignatarios, el ejército con los soldados. A veces se ha comparado a los compañeros del emperador con los apóstoles reunidos en torno a Cristo. Los historiadores aún discuten la identidad de algunos personajes, como el hombre situado a la derecha del emperador, a veces reconocido como el general Belisario."""
histoire = """
La iglesia de San Vital se comienza hacia 526, cuando Rávena pertenece al reino ostrogodo, gracias al dinero de un rico banquero, Juliano el Argentario. En 540, los ejércitos de Justiniano recuperan la ciudad: la iglesia pasa a ser un escaparate del poder bizantino en Italia. El obispo Maximiano, nombrado por el emperador, la consagra en 547 o 548; los mosaicos del ábside, entre ellos este panel, datan de esos años. Rávena sigue siendo después, durante dos siglos, la sede del gobernador bizantino de Italia. El panel nunca ha abandonado su muro; junto con los demás monumentos paleocristianos de la ciudad, San Vital figura en la lista del Patrimonio Mundial de la Unesco desde 1996."""
facture = """
El mosaicista ensambla miles de pequeños cubos, las teselas, hundidos en mortero fresco: piedra para algunos tonos, pasta de vidrio coloreada para los demás y hoja de oro entre dos capas de vidrio para el fondo. Las teselas, colocadas ligeramente en sesgo, captan la luz de las ventanas y hacen vibrar el oro. Los rostros, de grandes ojos marcados por las ojeras, están individualizados, pero los cuerpos, sin volumen, se alinean en un ritmo regular de verticales blancas y púrpuras. Ninguna sombra, ningún paisaje: el espacio terrenal se borra ante una presencia solemne."""
details = [
  "El nombre MAXIMIANVS, escrito con teselas negras sobre la cabeza del obispo.",
  "La fíbula de piedras preciosas que prende el manto de púrpura del emperador.",
  "El crismón, monograma de Cristo, en el gran escudo verde de los soldados.",
  "El incensario humeante que balancea el diácono del extremo derecho.",
  "Los pies de los personajes, que se superponen sin llegar a posarse en el suelo.",
]
themes = ["emperador", "poder", "procesión", "oro", "mosaico"]
anecdote = """
Ni Justiniano ni Teodora pusieron jamás los pies en Rávena. Sus retratos en mosaico hacen allí las veces de presencia: en la Antigüedad, la imagen oficial del emperador lo representaba en todo el Imperio, hasta el punto de que se le rendían honores como a su propia persona."""
salle = 2
mur = "nord"
place = 2
largeur = 3.0

[[oeuvres]]
titre = "La emperatriz Teodora y su séquito"
artiste = "Mosaïstes de Ravenne"
annee = "hacia 547"
image = "theodora.jpg"
cadre = "aucun"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Meister_von_San_Vitale_in_Ravenna_006.jpg"
technique = "Mosaico mural: teselas de pasta de vidrio, de piedra y de oro"
collection = "Basílica de San Vital, Rávena (muro sur del ábside)"
note = "Frente a Justiniano, la emperatriz lleva el cáliz del vino de la misa, rodeada de sus damas de la corte."
description = """
La emperatriz Teodora se alza en el centro, con nimbo, bajo una hornacina en forma de concha. Lleva una diadema de la que cuelgan largas hileras de perlas, un pesado collar de piedras preciosas y un manto de púrpura cuyo borde está bordado con tres personajes en marcha. Sostiene un cáliz de oro adornado de gemas. A la izquierda, un dignatario levanta la cortina de una puerta, junto a una fuente que brota de una columnilla; otro hombre está a su lado. A la derecha, sus damas la siguen, vestidas con telas de motivos, de rojo, verde y blanco. Sobre ellas, un tapiz rayado de azul, blanco y rojo aparece recogido. Una ancha orla adornada de cabujones enmarca el conjunto."""
evocation = """
Teodora responde a Justiniano: lleva el vino de la eucaristía como él el pan, y la pareja imperial parece así participar para siempre en la misa que se celebra en el ábside. Los tres personajes bordados en su manto son los Reyes Magos que llevan sus presentes al Niño: la emperatriz también hace su ofrenda. La puerta, la cortina y la fuente sugieren que se halla en el umbral, a punto de entrar en la iglesia. En esta imagen se ha visto la revancha de una mujer de origen modesto, hija de un domador de osos del Hipódromo y antigua actriz, que llegó a ser la igual del emperador. También se ha propuesto reconocer a su lado a Antonina, la esposa del general Belisario, sin certeza."""
histoire = """
El panel se realiza al mismo tiempo que el de Justiniano, para la consagración de San Vital en 547 o 548. Teodora muere en Constantinopla en 548: la imagen es, pues, uno de los últimos retratos hechos en vida suya, o casi. El historiador de corte Procopio, que la admira en sus escritos oficiales, la abruma en su Historia secreta, y en parte a través de él se ha formado su leyenda. En 532, durante la revuelta de Niká, habría convencido a Justiniano de no huir de la ciudad. Como el de su esposo, su retrato ha permanecido en su sitio durante catorce siglos."""
facture = """
El mosaicista juega con la riqueza de los textiles: los vestidos de las damas de la corte forman un catálogo de motivos, rombos, flores, rayas, realizados tesela a tesela. Las perlas de la diadema y del collar están hechas de teselas de nácar o de vidrio blanco, que captan la luz. Como en el panel de Justiniano, las figuras son frontales, sin sombra, alineadas sobre un suelo verde; pero aquí la arquitectura, con la hornacina, la puerta y la fuente, esboza un lugar. El gran nimbo de oro destaca la cabeza de la emperatriz sobre la concha de la hornacina."""
details = [
  "Los tres Reyes Magos bordados en oro en el bajo del manto de Teodora.",
  "Los largos colgantes de perlas que caen de la diadema hasta los hombros.",
  "La fuente sobre su columnilla, a la izquierda, junto a la puerta.",
  "La cortina levantada por el dignatario, que deja entrever la sombra de una estancia.",
  "Las telas de motivos distintos de cada una de las damas de la corte.",
]
themes = ["emperatriz", "ofrenda", "perlas", "corte", "mosaico"]
anecdote = """
Según Procopio, durante la revuelta de Niká de 532, cuando Justiniano pensaba en huir, Teodora habría declarado que la púrpura imperial es un hermoso sudario. El emperador se quedó, la revuelta fue aplastada, y fue tras esa revuelta cuando se construyó la nueva Santa Sofía."""
salle = 2
mur = "nord"
place = 6
largeur = 3.0

[[oeuvres]]
titre = "La Deesis"
artiste = "Byzance"
annee = "hacia 1261"
image = "deesis-sainte-sophie.jpg"
cadre = "aucun"
credit = "Photo : Myrabella"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Deesis_mosaic_Hagia_Sophia.jpg"
technique = "Mosaico mural: teselas de pasta de vidrio, de piedra y de oro"
collection = "Santa Sofía, Estambul (tribuna sur)"
note = "Cristo entre la Virgen y san Juan Bautista, que rezan por la humanidad: el mosaico más célebre de Santa Sofía."
description = """
Sobre un fondo de oro, destacan tres grandes figuras en busto. En el centro, Cristo, con un nimbo crucífero, bendice con la mano derecha y sostiene con la izquierda un libro de Evangelios de cubierta de oro. Viste una túnica dorada y un manto azul. A la izquierda, la Virgen, con un velo oscuro, inclina la cabeza hacia él; a la derecha, san Juan Bautista, con el pelo y la barba en mechones desordenados y la frente arrugada, también se inclina. Unas letras griegas dan sus nombres: MP ΘΥ para la Madre de Dios, IC XC para Jesucristo y «san Juan el Precursor». Toda la mitad inferior del panel ha desaparecido: solo queda un revoque gris sobre el que flotan los fragmentos de mosaico."""
evocation = """
Deesis significa en griego «oración» o «súplica». La Virgen y Juan Bautista, los dos testigos más cercanos a Cristo, interceden ante él por los hombres el día del Juicio. El tema está muy extendido en Bizancio, tanto en los iconos como en lo alto de las iconostasis. Lo que aquí llama la atención es la humanidad de los rostros: la tristeza contenida de la Virgen, la inquietud de Juan, la dulzura grave de Cristo. A menudo se han comparado estos rostros, modelados como en pintura, con el arte italiano que se inventa en ese mismo momento, con Cimabue y Giotto. Las lagunas, lejos de borrar la imagen, le dan la presencia frágil de una aparición."""
histoire = """
En 1204, los cruzados de la cuarta cruzada toman y saquean Constantinopla, que permanece en manos de los latinos hasta 1261. La mayoría de los historiadores fechan la Deesis en los años posteriores a la reconquista de la ciudad por Miguel VIII Paleólogo, cuando Santa Sofía es devuelta al culto ortodoxo; otros la sitúan antes, en el siglo XII. El panel adorna la tribuna sur, la galería del piso superior. Después de 1453, la iglesia, convertida en mezquita, ve cómo sus mosaicos figurativos se van cubriendo poco a poco de revoque. Se descubren en los años treinta por el Instituto Bizantino de América, dirigido por Thomas Whittemore. La mitad inferior del panel, en cambio, está perdida."""
facture = """
Las teselas de los rostros son minúsculas y están colocadas en líneas apretadas que siguen los volúmenes, como las pinceladas de un pintor: se pasa sin brusquedad del rosa al verde oliva de las sombras. El mosaicista eligió teselas de colores muy matizados para modelar las mejillas, los párpados, los mechones de la barba. Las letras y los contornos se trazan con teselas oscuras. El fondo de oro, dispuesto en hileras regulares, refleja la luz cambiante de las ventanas de la tribuna."""
details = [
  "Las letras IC XC a ambos lados de la cabeza de Cristo.",
  "Los mechones revueltos de san Juan Bautista, el profeta del desierto.",
  "El libro de Evangelios engastado de piedras que sostiene Cristo.",
  "La cruz inscrita en el nimbo de Cristo, reservada solo a él.",
  "Los fragmentos del manto de la Virgen, que flotan sobre el revoque gris.",
]
themes = ["intercesión", "juicio", "rostro", "oro", "mosaico"]
anecdote = """
No lejos de la Deesis, en las tribunas, una inscripción en el suelo lleva el nombre de Henricus Dandolo: recuerda al dogo de Venecia Enrico Dandolo, que dirigió la cuarta cruzada contra Constantinopla y murió en la ciudad en 1205."""
salle = 2
mur = "sud"
place = 2
largeur = 3.0

[[oeuvres]]
titre = "El Cristo Pantocrátor del Sinaí"
artiste = "Byzance"
annee = "siglo VI"
image = "pantocrator-du-sinai.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Spas_vsederzhitel_sinay.jpg"
technique = "Encáustica sobre tabla, 84 × 45,5 cm"
collection = "Monasterio de Santa Catalina del Sinaí, Egipto"
note = "Uno de los iconos más antiguos que se conservan: Cristo, señor de todo, pintado a la cera en tiempos de Justiniano."
description = """
Cristo aparece en busto, de frente, ante una arquitectura apenas esbozada: un muro bajo, una hornacina, un cielo azul en el que brillan dos estrellas. Un gran nimbo de oro, rodeado de azul y decorado con una cruz casi borrada, rodea su cabeza. Sus cabellos largos y castaños caen por detrás del hombro izquierdo; su barba es corta. Viste una túnica y un manto de color pardo purpúreo. Con la mano derecha bendice; con la izquierda aprieta contra sí un grueso libro de Evangelios, cuya cubierta de oro está adornada con una cruz, piedras y perlas. Su rostro no es simétrico: para el espectador, la mitad izquierda es serena y dulce, la mitad derecha más severa, con una ceja levantada y un ojo más grande."""
evocation = """
Pantocrátor significa en griego «el que lo sostiene todo»: Cristo es aquí el señor del mundo, el juez y el salvador. La asimetría del rostro ha sido muy comentada: en ella se han visto las dos naturalezas de Cristo, divina y humana, reunidas en una sola persona, o también la misericordia y la justicia. La mirada directa, que se fija en cada fiel, hace del icono un encuentro más que un retrato. El libro precioso recuerda que Cristo es la Palabra de Dios. Junto con algunos otros iconos del Sinaí, esta imagen es uno de los escasos testimonios del arte de los iconos anterior a la querella de las imágenes, que hizo destruir un gran número de ellos en los siglos VIII y IX."""
histoire = """
El icono fue pintado sin duda en Constantinopla, en el siglo VI, quizá para el monasterio que el emperador Justiniano manda fortificar al pie del monte Sinaí. Al siglo siguiente, la conquista árabe deja el monasterio fuera del Imperio: cuando los emperadores iconoclastas mandan destruir las imágenes religiosas, entre 726 y 843, sus órdenes no llegan al Sinaí. El icono se conserva allí desde hace catorce siglos. Repintado con el paso del tiempo, fue limpiado y restaurado en 1962, lo que reveló la pintura original. El historiador del arte Kurt Weitzmann lo dio a conocer junto con los demás iconos antiguos del monasterio, que alberga la colección de iconos bizantinos más rica del mundo."""
facture = """
El icono está pintado a la encáustica: los pigmentos se mezclan con cera caliente, aplicada con pincel o con espátula, como en los retratos funerarios del Fayum, en el Egipto romano. La cera da una materia espesa y luminosa, y permite pasajes suaves en el rostro, del rosa al pardo. El modelado, las sombras, la luz que viene de la izquierda pertenecen todavía a la pintura antigua. Solo el oro del nimbo y la frontalidad anuncian el arte más abstracto de los siglos siguientes."""
details = [
  "Los dos ojos de Cristo, de tamaño y expresión diferentes.",
  "Los dos dedos levantados de la mano derecha, en gesto de bendición.",
  "Las perlas y las piedras de la cubierta del libro de Evangelios.",
  "Las dos estrellas doradas en el cielo azul, a ambos lados del nimbo.",
  "El muro y la hornacina del fondo, como en un retrato antiguo.",
]
themes = ["cristo", "icono", "mirada", "encáustica", "sinaí"]
anecdote = """
El monasterio de Santa Catalina, donde se conserva el icono, está habitado sin interrupción desde el siglo VI. Sus murallas de granito, levantadas bajo Justiniano, siguen en pie, y su biblioteca guarda uno de los fondos de manuscritos más antiguos del mundo."""
salle = 3
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "La Virgen de Vladimir"
artiste = "Byzance"
annee = "hacia 1130"
image = "vierge-de-vladimir.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Vladimirskaja_ikona_Bo%C5%BEiej_Materi.jpg"
technique = "Temple sobre tabla, 104 × 69 cm"
collection = "Galería Tretiakov, Moscú (iglesia de San Nicolás de Tolmachi)"
note = "Pintada en Constantinopla, el más venerado de los iconos rusos: la Virgen aprieta contra su mejilla al Niño, que la abraza."
description = """
Sobre un fondo de oro desgastado, la Virgen aparece de medio cuerpo, envuelta en un manto oscuro que le cubre la cabeza, bordeado de oro y marcado con una estrella en la frente. Lleva al Niño en el brazo derecho y apoya la mano izquierda en el pecho. El Niño, con túnica dorada, se arroja contra ella: su mejilla toca la de su madre, su brazo izquierdo le rodea el cuello y por debajo asoma la planta de su pie. La Virgen no lo mira: sus ojos oscuros, bajo unas cejas arqueadas, se vuelven hacia el espectador. Alrededor, el ancho borde de la tabla está cubierto de lagunas y de huellas de clavos. En los ángulos superiores, las letras griegas abreviadas nombran a la Madre de Dios."""
evocation = """
El icono pertenece al tipo de la Virgen de la Ternura, Eleúsa en griego, que los rusos llaman Umilenie. El abrazo del Niño dice el amor de una madre, pero la mirada grave de la Virgen, vuelta hacia nosotros, dice que ella ya conoce la Pasión por venir: la ternura se mezcla con dolor. Para los rusos, el icono se ha convertido en la protectora de Moscú y de todo el país. Se le han atribuido varias liberaciones de la ciudad: se la ha llevado en procesión en los momentos de peligro y ha presenciado la coronación de los zares. Es así, a la vez, una obra de arte bizantina y un símbolo nacional ruso."""
histoire = """
El icono se pinta en Constantinopla, sin duda hacia 1130, y se envía poco después a Kiev. En 1155, el príncipe Andrés Bogoliubski se lo lleva al norte, a Vladimir, de la que toma el nombre. En 1395, cuando Tamerlán amenaza Moscú, se lo traslada allí; acaba por quedarse en la catedral de la Dormición del Kremlin. Repintado y dañado varias veces, es restaurado en 1918: se descubre entonces que solo los rostros, y algunos fragmentos, se remontan al siglo XII, pues el resto fue rehecho entre los siglos XIII y XVI. Ingresado en la Galería Tretiakov en 1930, se expone desde 1999 en la iglesia de San Nicolás de Tolmachi, contigua al museo, donde de nuevo se reza ante él."""
facture = """
Los rostros, única parte original, muestran la finura de la pintura de Constantinopla en el siglo XII. El pintor aplica primero un fondo oliva, el sankir, y luego construye las luces con capas finas y transparentes de tonos claros, hasta los realces en el caballete de la nariz y bajo los ojos. Los rasgos se trazan con una línea flexible y segura: la curva de las cejas, la boca pequeña, la nariz larga. Los vestidos del Niño están surcados por finas líneas de oro que hacen centellear la tela."""
details = [
  "Las dos mejillas de la madre y del Niño, pegadas una contra otra.",
  "La planta del pie izquierdo del Niño, visible bajo su túnica dorada.",
  "El brazo del Niño que rodea el cuello de su madre.",
  "La estrella bordada en el velo de la Virgen, sobre la frente.",
  "Las líneas de oro que surcan la túnica del Niño.",
]
themes = ["virgen", "ternura", "icono", "rusia", "constantinopla"]
anecdote = """
Según la tradición, Tamerlán dio media vuelta en 1395 el mismo día en que el icono llegaba a Moscú. La Iglesia rusa conmemora todavía cada año este encuentro, el 26 de agosto del calendario juliano, es decir, el 8 de septiembre del nuestro."""
salle = 3
mur = "ouest"
