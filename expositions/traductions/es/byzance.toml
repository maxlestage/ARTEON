[[oeuvres]]
titre = "Icono tejido de la Virgen con el Niño"
artiste = "Égypte copte"
annee = "siglo VI"
image = "icone-tissee-copte.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://www.clevelandart.org/art/1967.144"
technique = "Tapiz de lana, 178,7 × 110,5 cm"
collection = "Cleveland Museum of Art"
note = "Un icono raro, tejido con más de veinte colores de lana en Egipto, antes de la querella de las imágenes."
description = """
En el centro del tapiz, la Virgen, vestida de azul oscuro, se sienta en trono de frente sobre un asiento guarnecido con un cojín rojo; sostiene al Niño sobre sus rodillas. Dos arcángeles de alas azules, con túnica blanca, se mantienen a su lado, con un largo bastón en la mano, ante dos columnas. Una inscripción griega, encima, nombra a san Miguel, santa María y san Gabriel. Más arriba, Cristo se sienta en trono en una gloria circular, entre dos ángeles, sobre un cielo estrellado. Una ancha orla de follaje, flores y frutos, entre ellos granadas, enmarca el conjunto; lleva medallones en los que aparecen los bustos de los apóstoles, cada uno nombrado en griego. Amplias lagunas agujerean el tejido, sobre todo en la parte superior."""
evocation = """
Este tapiz es un verdadero icono: se colgaba en el muro de una iglesia para venerarlo. Superpone dos imágenes, la Virgen con el Niño en la tierra y Cristo en gloria en el cielo, unidas por los ángeles: en ellas se ha visto la Encarnación y la Majestad divina reunidas. Los apóstoles de la orla forman como una corte a su alrededor. Los frutos y las flores evocan el paraíso, un jardín exuberante en el corazón de un país de desierto. Los grandes ojos fijos, los rostros redondos, los colores francos son típicos del Egipto cristiano, donde se llama coptos a los cristianos y a su arte."""
histoire = """
El tapiz se teje en Egipto en el siglo VI, cuando el país forma todavía parte del Imperio bizantino, como atestiguan las inscripciones griegas. No se sabe en qué iglesia estuvo colgado. El clima seco de Egipto ha permitido la conservación de numerosos textiles de esa época, a menudo hallados en tumbas, pero un icono tejido de este tamaño es excepcional. El museo de Cleveland lo adquiere en 1967 a una coleccionista neoyorquina, Mrs. Paul Mallon; se ignora su recorrido anterior. Junto con los iconos del Sinaí, es una de las escasas imágenes religiosas conservadas anteriores a la crisis iconoclasta."""
facture = """
Es un tapiz: los hilos de trama de lana teñida, de más de veinte colores, se pasan a mano entre los hilos de urdimbre y se aprietan hasta ocultarlos, zona de color por zona de color. Los tejedores funden los tonos para modelar los rostros y los pliegues, como lo haría un pintor. Según el museo, un tapiz así costaba más caro que una pintura en aquella época. Los hilos de lana se han desgastado de forma desigual, lo que explica los agujeros: el fondo oscuro que aparece debajo es el tejido sobre el que hoy está montado."""
details = [
  "La inscripción griega sobre los arcángeles y la Virgen.",
  "El disco marcado con una cruz que sostiene el ángel de la derecha.",
  "Las granadas rojas y las flores de la orla.",
  "Los bustos de los apóstoles en los medallones, nombrados en griego.",
  "Cristo en gloria, arriba, en un círculo azul sembrado de estrellas.",
]
themes = ["tapiz", "virgen", "ángeles", "egipto", "copto"]
anecdote = """
Los textiles coptos fueron exhumados por millares a finales del siglo XIX en las necrópolis egipcias, en particular en Antinoópolis, excavada por el francés Albert Gayet a partir de 1896, y después dispersados entre los museos de todo el mundo."""
