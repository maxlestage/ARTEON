[[oeuvres]]
titre = "Virgen de la Ternura (Eleúsa)"
artiste = "Angelos Akotantos"
annee = "hacia 1425–1450"
image = "eleousa-akotantos.jpg"
licence = "CC0"
source = "https://www.clevelandart.org/art/2010.154"
technique = "Temple y oro sobre tabla, 96 × 70 cm"
collection = "Cleveland Museum of Art"
note = "Atribuida al mayor pintor de la Creta veneciana: una Virgen de la Ternura destinada a una iconostasis."
description = """
La Virgen, en busto, se recorta sobre un fondo de oro agrietado, en una tabla de remate redondeado. Está envuelta en un manto rojo oscuro, el maforio, que le cubre la cabeza y los hombros; debajo asoma un gorro azul, y tres estrellas de oro adornan su frente y sus hombros. Inclina la cabeza hacia el Niño, que lleva en el brazo izquierdo y sostiene con la mano derecha, de largos dedos. El Niño, vestido con una túnica azul pálido sembrada de pequeños motivos y un manto anaranjado, aprieta su mejilla contra la de su madre y alza los ojos hacia ella. Sostiene un rollo; tiene las piernas cruzadas y los pies desnudos asoman. El bajo de la manga de la Virgen está bordeado por un fleco de oro."""
evocation = """
Como la Virgen de Vladimir, colgada a su lado, este icono pertenece al tipo de la Eleúsa, la Virgen de la Ternura. Tres siglos las separan: la fórmula se ha transmitido de generación en generación, pues un icono debe permanecer fiel a su modelo. Pero el pintor cretense pone en él su propia dulzura, más serena: la mirada de la Virgen está baja, melancólica, y el Niño, en lugar de arrojarse contra ella, la mira. El rollo que sostiene recuerda que él es también la Palabra de Dios. Grande y visible desde lejos, el icono estaba sin duda colocado sobre una iconostasis, el tabique que separa a los fieles del santuario en las iglesias ortodoxas."""
histoire = """
Desde principios del siglo XIII, Creta pertenece a Venecia. En Candía, la actual Heraclión, talleres de pintores griegos trabajan a la vez para las iglesias ortodoxas y para clientes católicos, y exportan sus iconos por todo el Mediterráneo. El museo de Cleveland atribuye este a Angelos Akotantos, el más reputado de ellos en la primera mitad del siglo XV. Su recorrido anterior al siglo XX se desconoce; pasa por un marchante romano en 1989 y luego por una colección privada de Roma, antes de ser adquirido por el museo de Cleveland en 2010."""
facture = """
El pintor trabaja al temple de huevo sobre una tabla de madera preparada, y aplica el fondo con hoja de oro. Las carnaciones se construyen según el método cretense: un fondo pardo verdoso y luego luces cada vez más claras, aplicadas en pequeños toques paralelos que se ven en la mejilla y el cuello de la Virgen. Los pliegues del manto rojo se dibujan con largas líneas oscuras y angulosas. En los vestidos del Niño, finos trazos de oro hacen brillar la tela. El contorno es nítido, el modelado suave: es la elegancia que dará fama a la escuela cretense."""
details = [
  "Las tres estrellas de oro sobre el velo, signo de la virginidad de María.",
  "Los pequeños toques claros paralelos que modelan el cuello de la Virgen.",
  "El rollo apretado en la mano del Niño.",
  "Los pies desnudos y cruzados del Niño, en la parte baja de la tabla.",
  "El fleco de oro en el borde de la manga de la Virgen, a la izquierda.",
]
themes = ["virgen", "ternura", "creta", "icono", "venecia"]
anecdote = """
Según el museo de Cleveland, es la única obra conocida de Angelos Akotantos en Estados Unidos. Los iconos cretenses viajaban lejos: a principios del siglo XVI, el emperador de Etiopía Lebna Dengel envió monjes a comprarlos para sus iglesias."""
salle = 3
mur = "ouest"
place = 3
largeur = 1.2

[[oeuvres]]
titre = "La Virgen con el Niño entronizados (marfil Stroganov)"
artiste = "Byzance"
annee = "950–1025"
image = "ivoire-stroganoff.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://www.clevelandart.org/art/1925.1293"
technique = "Marfil esculpido, 25,3 × 17,2 × 1,8 cm"
collection = "Cleveland Museum of Art"
note = "Una placa de marfil esculpida en Constantinopla, aquí ampliada: en realidad mide 25 cm de alto."
description = """
En un marco estrecho, la Virgen está sentada de frente sobre un trono monumental de respaldo recortado en lóbulos, guarnecido con dos gruesos cojines y adornado con rosetas. Sus pies descansan en un escabel, colocado a su vez sobre una amplia tarima decorada con piedras preciosas esculpidas. Lleva al Niño sobre las rodillas, en el centro exacto de la placa. El Niño, con nimbo, alza la mano derecha para bendecir y sostiene un rollo con la izquierda. La Virgen apoya una mano en su hombro. En los ángulos superiores, dos ángeles en busto, con las alas desplegadas, tienden las manos hacia ellos. Una inscripción griega recorre el frente de la tarima. Las columnillas del trono están esculpidas a calados."""
evocation = """
La Virgen es aquí el trono mismo de Cristo: el Niño, sentado erguido sobre sus rodillas, no tiene nada de lactante. Bendice como un adulto, con el rostro impasible, para hacer visible el misterio de la Encarnación, Dios hecho hombre. Los ángeles, a medio cuerpo, parecen surgir del cielo para señalar este misterio al fiel. El lujo del trono, de la tarima y de los cojines recoge el de la corte imperial: María aparece como emperatriz celestial. Esta imagen, tallada en marfil, materia rara y costosa, servía para la oración privada de grandes personajes de Constantinopla."""
histoire = """
La placa se esculpe en Constantinopla hacia el año mil, en la época de la dinastía macedónica, cuando los talleres de la capital producen sus más hermosos marfiles. No se sabe para quién. Pasa después por una larga serie de colecciones: en París, luego en Inglaterra, con el anticuario Francis Douce, muerto en 1834, y más tarde en Roma, en la colección del conde Serguéi Stroganov, estadista e historiador del arte ruso, que le dejó su nombre. Pasada a la colección Malcolm y vendida en Christie's en 1913, fue donada en 1925 al museo de Cleveland por el mecenas Jeptha Homer Wade."""
facture = """
El marfil de elefante, importado de África o de la India, se talla en forma de placa y luego se vacía con cincel y gubia: el fondo se rebaja varios milímetros para hacer resaltar las figuras en alto relieve. El escultor detalla con precisión de orfebre los pliegues del manto, las rosetas del respaldo, los cabujones de la tarima, los mechones de los ángeles. Las finas vetas que surcan la superficie son las del propio marfil. En origen, algunos detalles estaban quizá realzados con oro o con color."""
details = [
  "La mano del Niño levantada para bendecir, con dos dedos extendidos.",
  "Los dos cojines del trono, hinchados y ceñidos en los extremos.",
  "Las rosetas esculpidas en el respaldo en forma de lóbulos.",
  "La inscripción griega grabada en el frente de la tarima.",
  "Las finas estrías naturales del marfil en todo el fondo.",
]
themes = ["marfil", "virgen", "trono", "ángeles", "constantinopla"]
anecdote = """
El conde Serguéi Stroganov, que dio su nombre al marfil, fundó en 1825 en Moscú una escuela de dibujo para artesanos. Todavía existe: es la Academia Stroganov de artes industriales."""
salle = 4
mur = "est"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "San Mateo, página de un leccionario"
artiste = "Byzance"
annee = "1057–1063"
image = "lectionnaire-saint-matthieu.jpg"
licence = "CC0"
source = "https://www.clevelandart.org/art/1942.1512"
technique = "Temple y oro sobre vitela, 28,8 × 24,3 cm"
collection = "Cleveland Museum of Art"
note = "El evangelista escribe bajo una arcada de oro: una página de un libro regalado por una emperatriz a un monasterio de Constantinopla."
description = """
Bajo una arcada sostenida por dos columnas de mármol oscuro de capiteles dorados, san Mateo está sentado en un asiento guarnecido con un cojín rojo. Anciano, de barba y cabellos blancos, viste una túnica azul y un manto beige. Inclinado, escribe en un cuaderno apoyado sobre sus rodillas. Ante él, un mueble de madera oscura, un atril-armario, sostiene un tintero e instrumentos. El suelo es de mármol verde veteado de blanco, y el fondo, de hoja de oro. Sobre él, su nombre está escrito en letras griegas rojas. Alrededor de la imagen, el pergamino ha quedado desnudo; está gastado, manchado y desgarrado en algunos puntos del borde derecho."""
evocation = """
Los retratos de los cuatro evangelistas abren tradicionalmente los libros de Evangelios, en todo el mundo cristiano. Garantizan la autenticidad del texto: Mateo, Marcos, Lucas y Juan pasaban por testigos directos de la vida de Cristo, o por allegados de testigos. El modelo viene de la Antigüedad, cuando se colocaba el retrato del autor al frente de sus obras: Mateo se parece a un filósofo griego. El oro del fondo lo sitúa, sin embargo, fuera del tiempo, en la luz divina. El cuidado puesto en las herramientas del copista, tintero, plumas, recuerda también el trabajo de los monjes que copiaban estos libros."""
histoire = """
Esta página procede de un leccionario, un libro que reúne los pasajes de los Evangelios leídos durante la misa, en el orden del año litúrgico. Según el museo de Cleveland, el libro fue regalado en 1063 al monasterio de la Santísima Trinidad de Calki, una de las islas de los Príncipes, cerca de Constantinopla, por la emperatriz Catalina, esposa de Isaac I Comneno, emperador de 1057 a 1059. En una fecha desconocida, el libro fue desmembrado y sus páginas dispersadas, como tantos manuscritos iluminados. Esta fue adquirida en 1942 por el museo de Cleveland al marchante neoyorquino Dikran Kelekian."""
facture = """
El pintor trabaja sobre vitela, una piel de ternero finamente preparada. Aplica primero la hoja de oro del fondo, bruñida con el bruñidor para que brille, y luego los colores al temple, en capas delgadas. Los pliegues del manto se logran con líneas claras y oscuras que sugieren el volumen, a la manera antigua. El mármol del suelo y de las columnas se imita con vetas pintadas. Con el tiempo, el color se ha desconchado en algunos lugares, en el hombro de Mateo y en el atril, dejando ver el pergamino."""
details = [
  "El nombre del evangelista, ὁ ἅγιος Ματθαῖος, en letras rojas sobre el oro.",
  "El tintero y las herramientas de copista colocados sobre el atril.",
  "El cojín rojo del asiento, bajo el manto de Mateo.",
  "Las vetas blancas del mármol verde, en el suelo.",
  "Las columnas de mármol rojo oscuro y sus capiteles dorados.",
]
themes = ["evangelista", "escritura", "manuscrito", "oro", "constantinopla"]
anecdote = """
Los primeros leccionarios bizantinos recibían a menudo encuadernaciones de orfebrería, cubiertas de metal precioso, de piedras preciosas y a veces de marfil: el propio libro se llevaba en procesión y los fieles lo besaban."""
