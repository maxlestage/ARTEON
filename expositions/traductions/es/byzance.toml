[exposition]
ordre = 8
nom_court = "Bizancio"
mouvement = "Bizancio y el Oriente cristiano"
cadre = "dore"
couleur = "#7d5a12"
titre = "Bizancio y el Oriente cristiano, el cielo de oro"
artiste = "Rávena, Constantinopla, Angelos Akotantos, Egipto copto, Armenia, Etiopía…"
dates = "siglos VI–XVII"
accroche = "Exposición virtual · Santa Sofía, Estambul"
introduction = """
Durante mil años, desde Justiniano hasta la caída de Constantinopla en 1453, el Imperio bizantino inventa un arte del oro y de la presencia: mosaicos en los que el emperador se codea con los santos, iconos que se rezan y se besan, marfiles y libros de Evangelios preciosos como relicarios. La visita sigue este arte desde Rávena hasta Creta, y después entre los demás cristianos de Oriente, en Egipto, Armenia y Etiopía, a lo largo de once obras. El edificio se inspira en Santa Sofía de Estambul: un nártex alargado, una nave cuadrada muy alta bajo la cúpula, dos naves laterales y, al fondo, un ábside."""
vitrine = "vierge-de-vladimir.jpg"

[musee]
nom = "Santa Sofía"
ville = "Estambul, Turquía"
architecte = "Antemio de Trales e Isidoro de Mileto"
construction = "532–537"
presentation = """
En 532, la revuelta de Niká arrasa Constantinopla y la basílica de la Sabiduría divina, Hagia Sophia, se convierte en humo. El emperador Justiniano la manda reconstruir de inmediato a dos sabios, el matemático Antemio de Trales e Isidoro de Mileto: la nueva iglesia se consagra en 537. Su cúpula, de unos treinta y un metros de anchura, parece flotar sobre la nave gracias a la corona de cuarenta ventanas abiertas en su base. Hundida en 558 tras varios seísmos, se reconstruye más alta. Durante nueve siglos, Santa Sofía es la catedral del Imperio, donde se corona a los emperadores. Tras la toma de la ciudad por Mehmed II en 1453, se convierte en mezquita: se le añaden minaretes y los mosaicos figurativos se cubren poco a poco de revoque. Museo desde 1934, fue devuelta al culto musulmán en 2020. Todavía pueden verse los mármoles de Justiniano y, en las tribunas, los mosaicos descubiertos en el siglo XX, entre ellos la Deesis."""
ici = """
El edificio de ARTEON retoma la disposición de Santa Sofía. Se entra por el sur en el nártex, un largo vestíbulo de veinticuatro metros. Este se abre a la nave bajo la cúpula, una sala cuadrada de veinticuatro metros de lado y veinte de altura, de muros color oro, donde se reúnen los mosaicos. Al oeste, la nave lateral de los iconos; al este, la nave lateral del tesoro, más baja y más íntima. Al norte, al fondo de la nave, el ábside presenta las cristiandades de Oriente: Egipto, Armenia y Etiopía."""

