[[artistes]]
nom = "Mosaïstes de Ravenne"
vie = "Rávena (Italia), siglos V–VI"
biographie = """
Rávena, en la costa adriática, se convierte en 402 en la capital del Imperio romano de Occidente, al abrigo de sus marismas. La emperatriz Gala Placidia hace construir allí un pequeño mausoleo cubierto de mosaicos azul noche. Tras la caída del Imperio de Occidente, la ciudad es la capital del rey ostrogodo Teodorico, que reina sobre Italia de 493 a 526 y hace decorar la iglesia de San Apolinar el Nuevo. En 540, los ejércitos del emperador bizantino Justiniano toman la ciudad: San Vital y luego San Apolinar in Classe, consagrada en 549, reciben las más bellas decoraciones de su tiempo. Rávena sigue siendo después la sede del gobernador bizantino de Italia, el exarca, hasta su toma por los lombardos en 751. Los mosaicistas que trabajaron en estas obras son anónimos. Los historiadores discuten si venían de Constantinopla o si formaban un taller local, formado en los modelos de la capital; es probable que ambos se mezclaran. Ocho monumentos de la ciudad figuran conjuntamente en la lista del Patrimonio Mundial de la Unesco desde 1996."""
style = """
Los mosaicos de Rávena muestran el paso del arte romano al arte bizantino: las figuras pierden su volumen y su sombra, se colocan de frente sobre un fondo de oro o de azul profundo y se alinean en filas solemnes. El color es deslumbrante, y los rostros de grandes ojos están, sin embargo, individualizados. Este lenguaje del oro y de la frontalidad, que hace de la imagen una presencia más que una escena, marcará todo el arte cristiano de Oriente y, más tarde, a los primitivos italianos."""

[[artistes]]
nom = "Byzance"
vie = "Imperio bizantino, Constantinopla, 330–1453"
biographie = """
En 330, el emperador Constantino inaugura su nueva capital en el sitio de la antigua Bizancio, a orillas del Bósforo: Constantinopla. Cuando el Imperio romano de Occidente desaparece en 476, el de Oriente continúa durante cerca de mil años; hoy se lo llama Imperio bizantino, pero sus habitantes se decían romanos. Bajo Justiniano, en el siglo VI, alcanza su mayor extensión y construye Santa Sofía. Desde alrededor de 726 hasta 843, la querella de las imágenes divide el Imperio: los iconoclastas hacen destruir las representaciones de Cristo y de los santos, hasta que el culto de los iconos se restablece definitivamente. Bajo la dinastía macedónica, en los siglos X y XI, los talleres de la capital producen marfiles, manuscritos, esmaltes y sedas de lujo. En 1204, los cruzados saquean Constantinopla; la ciudad es recuperada en 1261 por Miguel VIII Paleólogo, y el arte conoce un último auge. El 29 de mayo de 1453, los otomanos de Mehmed II toman la ciudad. El arte bizantino sobrevive en los países ortodoxos, desde Grecia hasta Rusia, y en los talleres de la Creta veneciana."""
style = """
El arte bizantino es ante todo un arte religioso e imperial. Privilegia la frontalidad, el fondo de oro que sitúa a las figuras fuera del tiempo, tipos fijados por la tradición para que cada imagen siga siendo fiel a su modelo. El icono no es un simple cuadro: el respeto rendido a la imagen pasa, según los teólogos, a la persona representada. Sin embargo, de siglo en siglo, los artistas renuevan estas fórmulas, desde la elegancia antigua del año mil hasta la humanidad conmovida de los rostros del siglo XIII."""

[[artistes]]
nom = "Angelos Akotantos"
vie = "Candía (Creta), activo en la primera mitad del siglo XV"
biographie = """
Angelos Akotantos vive en Candía, la actual Heraclión, capital de Creta, entonces posesión de Venecia. La ciudad alberga en el siglo XV una importante corporación de pintores griegos, que trabajan para las iglesias ortodoxas de la isla, para clientes católicos y para la exportación. Akotantos es uno de los más reputados. Se le conoce por documentos de archivo venecianos, entre ellos un testamento fechado en 1436, y por iconos firmados en griego «de la mano de Angelos». Entre estos, una Virgen Kardiotissa, conservada en el Museo Bizantino y Cristiano de Atenas, es una de las más célebres. Muere a mediados del siglo XV, poco antes o poco después de la caída de Constantinopla, que empuja a numerosos artistas bizantinos a refugiarse en Creta. Sus modelos, copiados y recopiados, fijan por mucho tiempo los tipos de la escuela cretense, que seguirán Andreas Ritzos a finales del siglo y, en el siglo siguiente, el joven Domínikos Theotokópoulos, futuro Greco, nacido en Candía."""
style = """
Akotantos reúne la tradición de Constantinopla y una precisión nueva: contornos nítidos, carnaciones modeladas con finos toques claros paralelos, pliegues angulosos y rítmicos, abundante oro. Sus Vírgenes tienen una dulzura grave y contenida. Esta manera elegante, fácil de transmitir mediante dibujos de modelos, se convierte en la firma de la escuela cretense, cuyos iconos se difunden desde Venecia hasta Etiopía."""

[[artistes]]
nom = "Égypte copte"
vie = "Egipto cristiano, desde el siglo IV"
biographie = """
Según la tradición, el evangelista Marcos habría fundado la Iglesia de Alejandría. El cristianismo se extiende por Egipto desde los primeros siglos, y el país se convierte, en el siglo IV, en la cuna del monacato cristiano, con san Antonio, ermitaño del desierto, y san Pacomio, que funda las primeras comunidades de monjes. En el concilio de Calcedonia, en 451, buena parte de los cristianos de Egipto rechaza la definición de la naturaleza de Cristo adoptada por el Imperio: su Iglesia se separa de la de Constantinopla. La palabra copto viene del árabe qubt, que a su vez procede del griego Aiguptios, egipcio. La conquista árabe, entre 639 y 642, hace pasar Egipto a la dominación musulmana, pero los coptos siguen siendo numerosos y forman todavía hoy la comunidad cristiana más importante de Oriente Próximo. Su arte, conocido por las iglesias y los monasterios, las pinturas murales, las esculturas y sobre todo los textiles conservados por la arena seca, mezcla la herencia del Egipto grecorromano y los temas cristianos."""
style = """
El arte copto ama los colores francos, los rostros redondos de grandes ojos fijos, las figuras frontales y simplificadas, y las decoraciones exuberantes de follaje, frutos y animales. Hereda los retratos del Fayum y el arte helenístico de Alejandría, pero avanza hacia una estilización cada vez más marcada. Sus tejidos de lana y de lino, a menudo tejidos en tapiz, figuran entre los más bellos textiles de la Antigüedad tardía."""

[[artistes]]
nom = "Arménie"
vie = "Armenia, Cilicia y diáspora armenia, desde el siglo IV"
biographie = """
Según la tradición, el rey Tiridates III, convertido por san Gregorio el Iluminador, hace del cristianismo la religión oficial de Armenia a principios del siglo IV. Hacia 405, el monje Mesrop Mashtots inventa un alfabeto propio para la lengua armenia, que permite traducir la Biblia y da origen a una rica literatura. Situada entre Bizancio, Persia y después el mundo árabe y turco, Armenia pierde a menudo su independencia. A finales del siglo XII, unos príncipes armenios fundan en Cilicia, en el sudeste de Asia Menor, un reino que dura hasta 1375: sus monasterios producen los más bellos manuscritos iluminados armenios, entre ellos los del pintor Toros Roslin en el siglo XIII. Tras su caída, los armenios se dispersan por el Imperio otomano, Persia, Crimea, Polonia e incluso la India. Grandes mercaderes, financian iglesias, manuscritos y objetos litúrgicos, y conservan con fervor los libros antiguos, que hacen encuadernar de nuevo o rescatan cuando les han sido arrebatados."""
style = """
La iluminación armenia se distingue por sus colores vivos y saturados, sus tablas de cánones adornadas con aves y plantas, sus márgenes poblados de ornamentos y una lectura personal de los modelos bizantinos. Los orfebres armenios, por su parte, sobresalen en la plata repujada, los esmaltes y las piedras preciosas de las encuadernaciones y los relicarios. Las cruces de piedra esculpidas, los jachkar, son otra creación propia del arte armenio."""

[[artistes]]
nom = "Éthiopie chrétienne"
vie = "Reino de Aksum y después imperio de Etiopía, desde el siglo IV"
biographie = """
En el siglo IV, el rey Ezana de Aksum, en el norte de la actual Etiopía, se convierte al cristianismo bajo la influencia de Frumencio, un cristiano de Tiro al que Atanasio de Alejandría consagra obispo. La Iglesia etíope queda después vinculada a la de Alejandría, que le envía sus obispos hasta el siglo XX. Su lengua litúrgica es el ge’ez, la antigua lengua de Aksum, escrita en un alfabeto propio. En el siglo XII o XIII, bajo el rey Lalibela, se excavan en la roca las célebres iglesias que llevan su nombre. En el siglo XV, el emperador Zara Yaqob, que reina de 1434 a 1468, reforma la Iglesia y fomenta la copia y la ilustración de los libros sagrados en los monasterios. Los vínculos con el Mediterráneo se refuerzan entonces: llegan a Etiopía iconos cretenses, y un pintor veneciano, Nicolò Brancaleon, trabaja en la corte a finales de siglo. Las iglesias y los monasterios etíopes conservan todavía hoy miles de manuscritos iluminados."""
style = """
La pintura etíope, sobre pergamino, sobre tabla o sobre los muros de las iglesias, privilegia el trazo de tinta negra, los colores puros aplicados en superficies planas, el amarillo, el rojo, el verde, y los grandes ojos almendrados vueltos hacia el espectador. Los pliegues se convierten en motivos, las orlas se cubren de entrelazos y cheurones. Heredera de los modelos coptos, siríacos y bizantinos, los transforma en un lenguaje gráfico muy reconocible."""
