[[oeuvres]]
titre = "Evangelio armenio con cubierta de plata"
artiste = "Arménie"
annee = "manuscrito: siglo XIII; encuadernación: 1691"
image = "evangeliaire-armenien.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/446861"
technique = "Tinta y temple sobre pergamino; encuadernación de plata dorada repujada, esmaltes, piedras y vidrios de colores, 26 × 18,7 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Un libro de los Evangelios armenio, revestido cuatro siglos después con una encuadernación de orfebrería: el libro mide 26 cm de alto."
description = """
El libro se presenta cerrado, de pie, visto de frente. Su cubierta de plata dorada está trabajada en relieve. En el centro, una placa muestra la Natividad: la Virgen tendida junto al Niño envuelto en pañales en su pesebre, José de pie, el buey y la mula encima, y unos pastores que se acercan. En la parte alta de la escena, rebaños, jinetes que siguen una estrella, los Reyes Magos y una hilera de cabezas de ángeles. El fondo es de esmalte azul turquesa. Bajo la escena corre una inscripción. Alrededor, una ancha orla de esmalte verde está cubierta de sarmientos de vid, racimos de uva y piedras de color: granates, turquesas, cabujones azules. Por un lado se entrevé el lomo del libro, guarnecido de terciopelo verde."""
evocation = """
Para los armenios, el libro de los Evangelios es más que un texto: es un objeto sagrado, llevado en procesión, besado, a veces considerado protector. Se transmitía de generación en generación, se rescataba cuando había sido robado, se hacía encuadernar de nuevo cuando se desgastaba. Aquí, un manuscrito del siglo XIII recibe en 1691 un ropaje de orfebrería digno de su valor. La Natividad recuerda que el Evangelio anuncia el nacimiento del Salvador; la vid, imagen de Cristo y del vino eucarístico, lo rodea. El libro une dos épocas de la historia armenia, el reino de Cilicia y la diáspora."""
histoire = """
El manuscrito fue copiado y pintado en el siglo XIII, probablemente en Cilicia, el reino armenio fundado en el sudeste de Asia Menor, cuyos talleres de iluminación viven entonces su edad de oro. El museo no precisa dónde se realizó la encuadernación, fechada en 1691; la inscripción armenia muestra que fue encargada por armenios. A finales del siglo XVII, las comunidades armenias están dispersas entre el Imperio otomano, Persia y Europa, y sus mercaderes financian trabajos así para sus iglesias. El libro ingresó en el Metropolitan Museum of Art en 1916, donación de Mrs. Edward S. Harkness."""
facture = """
La cubierta está hecha de láminas de plata trabajadas al repujado: el orfebre golpea el metal por el revés para hacer resaltar las figuras y luego precisa los detalles con el cincel por el derecho. Algunas partes están doradas. Los fondos están cubiertos de esmaltes de colores, polvo de vidrio fundido en los huecos del metal, azul para el cielo de la Natividad, verde para la orla. Piedras y vidrios de colores, engastados en bezeles, dan ritmo al marco. En el interior, las páginas de pergamino están escritas a tinta y pintadas al temple."""
details = [
  "La estrella, arriba a la derecha, que siguen los Reyes Magos a caballo.",
  "El buey y la mula inclinados sobre el pesebre.",
  "La hilera de cabezas de ángeles entre las nubes, en lo alto de la escena.",
  "Los racimos de uva en relieve en la orla de esmalte verde.",
  "La gran turquesa y los granates engastados en el marco.",
]
themes = ["evangelio", "natividad", "orfebrería", "esmalte", "armenia"]
anecdote = """
Armenia es considerada tradicionalmente el primer reino que adoptó el cristianismo como religión oficial, a principios del siglo IV. Su alfabeto, creado hacia 405 por el monje Mesrop Mashtots, sirvió primero para traducir la Biblia."""
