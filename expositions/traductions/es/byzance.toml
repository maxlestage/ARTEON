[[oeuvres]]
titre = "San Lucas, página de un libro de los Evangelios"
artiste = "Éthiopie chrétienne"
annee = "hacia 1440–1480"
image = "evangeliaire-ethiopien-saint-luc.jpg"
licence = "CC0"
source = "https://www.clevelandart.org/art/1999.212"
technique = "Tinta y temple sobre vitela, 37 × 25 cm"
collection = "Cleveland Museum of Art"
note = "El evangelista Lucas y su toro, pintados en Tigray, al norte de Etiopía, con colores vivos y motivos geométricos."
description = """
San Lucas está sentado de tres cuartos, sobre un bloque adornado con un motivo de aspas, bajo una arcada. Tiene largos cabellos grises y una barba gris dibujada trazo a trazo. Sostiene en la mano izquierda un libro abierto, blanco, y en la derecha una larga caña con la que escribe. Su túnica está enteramente cubierta de líneas onduladas anaranjadas y rojas, que dibujan los pliegues como curvas de nivel. Su nimbo se recorta sobre un fondo verde, y la parte baja del fondo está rayada de naranja. Encima, en el arco de la arcada, un toro salta junto a unas líneas de escritura ge’ez. Una orla de motivos geométricos rodea la página, de pergamino atezado y bordes gastados."""
evocation = """
El toro es el símbolo de Lucas, uno de los cuatro animales que representan a los evangelistas desde los primeros siglos cristianos. El retrato sigue un modelo llegado de la Antigüedad a través de los libros coptos, siríacos y bizantinos: el autor sentado que escribe. Pero el pintor etíope lo transforma en un dibujo coloreado, de líneas rítmicas y grandes ojos almendrados, muy lejos del modelado griego. El texto en ge’ez, la lengua litúrgica de la Iglesia etíope, es una oración cuyo sentido es aproximadamente: «Haced esta imagen de san Lucas con este toro; que su oración y sus bendiciones estén con nosotros. Amén.»"""
histoire = """
La página procede de un libro de los Evangelios realizado en la región de Tigray, al norte de Etiopía, hacia 1440–1480, bajo el reinado de Zara Yaqob o de sus sucesores, una época de gran actividad para los monasterios y sus talleres de copia. El libro fue desmembrado más tarde, y sus páginas pasaron al mercado del arte. Esta fue adquirida en 1999 por el museo de Cleveland a un librero de libros antiguos de Ohio. Como muchos manuscritos etíopes sacados del país, el libro fue cortado para venderse página a página, una práctica hoy muy criticada."""
facture = """
El pintor traza primero todos los contornos a tinta, con un trazo seguro, y luego rellena las superficies con colores francos, sin sombra ni degradado: amarillo, verde, naranja, rojo. El volumen se sustituye por el ritmo de las líneas, que cubren la túnica con una red ondulante. La orla de la página, hecha de cheurones y entrelazos, recuerda los motivos de los tejidos y de las cruces etíopes. El soporte es un pergamino grueso, que se ha oscurecido y deshilachado con el uso."""
details = [
  "El toro, símbolo de Lucas, arriba en la arcada.",
  "Las líneas de escritura ge’ez junto al toro.",
  "La larga caña que el evangelista apoya sobre su libro.",
  "Las líneas onduladas anaranjadas que dibujan los pliegues de la túnica.",
  "Las bandas anaranjadas que rayan el fondo, a la izquierda, bajo el brazo del santo.",
]
themes = ["evangelista", "manuscrito", "etiopía", "ge’ez", "color"]
anecdote = """
El cristianismo se convirtió en religión oficial del reino de Aksum, en el norte de la actual Etiopía, hacia mediados del siglo IV, bajo el rey Ezana: mucho antes de la evangelización de la mayoría de los países del norte de Europa."""
