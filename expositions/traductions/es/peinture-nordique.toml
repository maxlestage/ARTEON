[[oeuvres]]
titre = "Baile de San Juan"
artiste = "Anders Zorn"
annee = "1897"
image = "danse-saint-jean.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Midsummer_Dance_(Anders_Zorn)_-_Nationalmuseum_-_18607.tif"
technique = "Óleo sobre lienzo, 140 × 98 cm"
collection = "Nationalmuseum, Estocolmo"
note = "En un pueblo de Dalarna, las parejas bailan toda la noche de San Juan, en la luz que no se apaga."
description = """
En el patio cubierto de hierba de una granja, bailan varias parejas. En primer plano, una joven de falda negra, corpiño blanco con tirantes rojos y pañuelo blanco gira en brazos de un hombre de sombrero negro; sus rostros están casi ocultos, todo está en el movimiento. Detrás de ellos, otras parejas y espectadores se apiñan en una semioscuridad. A la izquierda, un granero de troncos grises cuya puerta abierta deja ver otras siluetas; al fondo, una casa pintada de rojo, de ventanas blancas, cuyo hastial se ilumina. A la derecha, el mástil de San Juan, adornado con coronas, se alza en un cielo pálido y lleva en su cima la bandera sueca. El suelo está pisoteado, las faldas giran en torbellino."""
evocation = """
San Juan, o Midsommar, es en Suecia la gran fiesta de la luz: la noche más corta del año, en que el día no termina. Zorn, que había crecido en Mora, veía en ella la pervivencia de un antiquísimo culto a la naturaleza, más pagano que cristiano. Como subraya el Nationalmuseum, no sitúa el mástil en el centro: lo que pinta es la experiencia misma del baile, los aromas de la noche de verano y la luz. El cuadro es también un manifiesto: en Dalarna, un movimiento de despertar religioso había hecho retroceder las fiestas y la música populares, y Zorn, rico y célebre, se empeña en defenderlas. El primer rayo del alba, sobre el hastial rojo, anuncia que el baile ha durado toda la noche."""
histoire = """
En 1896, tras años pasados en el extranjero, sobre todo en París, Zorn se instala con su mujer Emma en Mora, su pueblo natal. Según sus notas, visita ese año el pueblo vecino de Morkarlby con el príncipe Eugenio de Suecia, también pintor; Zorn manda venir a un violinista, el baile comienza en un patio y el príncipe, entusiasmado, le insta a pintar la escena. Zorn la pinta al año siguiente, en junio y parte de julio de 1897, después de la puesta de sol. El cuadro es donado al Nationalmuseum en 1903 por la Real Academia de Bellas Artes. Existe otra versión, pintada casi al mismo tiempo, en el Museo Pushkin de Moscú, y una réplica más pequeña encargada en 1903 por un coleccionista estadounidense."""
facture = """
Zorn pinta deprisa, con grandes pinceladas cargadas de materia, que dejan las formas borrosas como si aún se movieran. Los blancos de los corpiños y los pañuelos atrapan la luz difusa de la noche clara; el negro de las faldas y los sombreros da al cuadro su estructura. El gran formato vertical y la pareja situada muy cerca de nosotros, cortada por el borde inferior del marco, hacen entrar al espectador en la ronda. La luz, muy particular, fue observada en el lugar, de noche, durante semanas."""
details = [
  "La bandera sueca en lo alto del mástil, a la derecha.",
  "El hastial de la casa roja, iluminado por la primera luz de la mañana.",
  "La puerta abierta del granero, donde se encuentran los espectadores.",
  "Los tirantes rojos del traje tradicional de la bailarina.",
]
themes = ["danza", "san juan", "noche clara", "fiesta", "dalarna"]
anecdote = """
Para mantener viva la tradición, Zorn regalaba al pueblo de Morkarlby un mástil de San Juan, repintado de rojo cada año. Escribe que consideraba un deber sagrado estar presente para vestirlo de follaje, antes de que lo alzaran a medianoche."""
salle = 4
mur = "est"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Hoguera de San Juan"
artiste = "Nikolai Astrup"
annee = "1912 y 1926"
image = "feux-saint-jean.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Nikolai_Astrup_-_Bonfire_celebrating_Midsummer_Night_-_NG.M.03609_-_National_Museum_of_Art,_Architecture_and_Design.jpg"
technique = "Óleo sobre papel pegado a tablero de fibras, 89 × 105 cm"
collection = "Nasjonalmuseet, Oslo"
note = "La gran hoguera de San Juan en la orilla del lago Jølster, en el oeste de Noruega, entre montañas."
description = """
En el centro de un valle encajonado, una inmensa hoguera se alza sobre un montículo cubierto de hierba. Sus llamas amarillas y anaranjadas se retuercen en volutas, como lenguas o crestas de animales fantásticos, y una enorme columna de humo gris sube hasta lo alto del cuadro, donde se extiende en nubes. Ante el brasero se recorta una silueta oscura, solitaria. Más lejos, en la pendiente de la derecha, una multitud de pequeños personajes se mantiene en grupos. Alrededor, altas montañas verde oscuro cierran el horizonte; sus cumbres llevan aún nieve, y una cascada blanca desciende por la derecha. Más abajo se adivina el agua del lago. Abajo a la izquierda, una segunda hoguera, más pequeña, humea en la hierba."""
evocation = """
La noche de San Juan, en Noruega, se encienden hogueras y la gente se reúne para jugar, bailar y recoger flores. Para Astrup, apegado a la idea de una comunión entre los hombres y la naturaleza, estos ritos recordaban las fuerzas mágicas de la naturaleza: según el museo de Oslo, las hogueras, el baile y las flores servían a la vez para proteger y para conjurar. El cuadro opone la figura solitaria, frente al fuego, a la multitud que charla y coquetea en la pendiente. Las llamas cobran en él una vida casi animal. La mezcla de realismo en el paisaje y de ensoñación romántica en el fuego es, según el mismo museo, característica de su arte."""
histoire = """
Tras sus estudios, Astrup vuelve en 1902 al valle de Jølster, donde había crecido en la casa parroquial de Ålhus; en 1913 se instala con su familia en Sandalstrand, en la orilla sur del lago Jølstravatnet. No cesa de retomar sus motivos preferidos, tanto en pintura como en xilografía en color: pintó varias versiones de la hoguera de San Juan en Sandalstrand. Esta fue comenzada en 1912 y retomada en 1926, dos años antes de su muerte. El Nasjonalmuseet de Oslo la adquirió en 1984. En 2015 fue presentada en Oslo y en Helsinki en la exposición El Norte mágico, dedicada al arte finlandés y noruego hacia 1900."""
facture = """
Astrup pinta aquí al óleo sobre papel, pegado después a un tablero. Perfila las formas, simplifica las montañas en grandes masas oscuras y reserva los colores más vivos para el fuego, cuyas llamas están estilizadas en arabescos decorativos. La materia es espesa, trabajada en capas sucesivas, pues retocaba sus cuadros durante años. El contraste entre los verdes profundos de la noche clara y el anaranjado del brasero hace de la llama una fuente de luz que irradia sobre todo el cuadro."""
details = [
  "La silueta solitaria, negra, de pie ante el brasero.",
  "Las llamas que se curvan en ganchos, como cabezas de dragón.",
  "La cascada blanca en la pendiente de la derecha.",
  "La pequeña hoguera que humea abajo a la izquierda, apartada.",
]
themes = ["san juan", "fuego", "montaña", "fiesta", "noruega"]
anecdote = """
Hijo de pastor, Astrup sufría asma y una salud frágil. Muere de neumonía en 1928, a los cuarenta y siete años. Su granja de Sandalstrand, donde vivió con su mujer Engel y sus ocho hijos, se conoce hoy con el nombre de Astruptunet."""
salle = 4
mur = "nord"
place = 2
largeur = 1.15

[[oeuvres]]
titre = "Riddarfjärden en Estocolmo"
artiste = "Eugène Jansson"
annee = "1898"
image = "riddarfjarden.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Riddarfjärden,_Stockholm_(Eugène_Jansson)_-_Nationalmuseum_-_18703.tif"
technique = "Óleo sobre lienzo, 150 × 135 cm"
collection = "Nationalmuseum, Estocolmo"
note = "Estocolmo de noche, vista desde las alturas de Södermalm: la bahía de Riddarfjärden y las luces de la ciudad, todo en azul."
description = """
La vista se hunde desde una altura sobre una vasta extensión de agua nocturna, de un azul profundo, que ocupa casi todo el cuadro. A lo lejos, la ciudad no es más que una franja oscura salpicada de luces, cuyos reflejos descienden en el agua en largas estelas verticales. Algunos campanarios puntiagudos se recortan sobre una delgada franja de cielo enrojecido, último resto del crepúsculo o primera señal del alba. Más arriba, el cielo es un torbellino de trazos azul grisáceo. En primer plano, más abajo, una orilla oscura bordea el agua; las farolas forman en ella grandes espirales de luz blanca, como galaxias. En el extremo izquierdo, la silueta de un edificio, con su tejado y su chimenea, se recorta sobre ese halo. Abajo a la derecha, la firma y la fecha."""
evocation = """
Jansson pinta la ciudad que ve desde su casa, pero hace de ella una visión casi cósmica: el agua se convierte en un abismo, las lámparas en astros. El azul, que lo invade todo, expresa la melancolía de las noches de Estocolmo, su silencio y su belleza. Sus contemporáneos lo apodaron el «pintor azul». Los historiadores subrayan en estos nocturnos la influencia de Edvard Munch, y comparan las espirales de luz con las de Van Gogh. Jansson, socialista convencido, de origen modesto, muestra también una ciudad moderna, iluminada por sus farolas, sus muelles y sus barcos, donde la actividad humana ya solo se adivina por la luz."""
histoire = """
Por falta de dinero, Jansson no hizo, como la mayoría de los pintores de su generación, el viaje de estudios a París; no sale de los países nórdicos hasta 1900. Tras la muerte de su padre, en 1891, se instala con su madre y su hermano en Södermalm, el barrio popular del sur de Estocolmo, en un piso de la calle Bastugatan encaramado en las alturas, con vistas a la bahía de Riddarfjärden y a la ciudad vieja. Hasta 1904 aproximadamente, la mayoría de sus cuadros son vistas nocturnas tomadas desde su ventana o desde las calles vecinas. En 1898, el año de este cuadro, el banquero y coleccionista Ernest Thiel visita su taller y le compra tres telas: es el comienzo del reconocimiento."""
facture = """
El cuadro es casi monocromo: azules, negro, algunos blancos y una sola nota roja en el horizonte. Jansson deja bien visibles sus pinceladas, en largos trazos paralelos en el agua y en curvas cruzadas en el cielo, de modo que toda la superficie vibra. Los reflejos de las luces se aplican en guiones verticales, los halos de las farolas en espirales espesas. La composición es muy simple, en bandas horizontales, lo que da a la inmensidad del agua toda su fuerza, y anuncia la abstracción hacia la que tienden sus nocturnos."""
details = [
  "Los reflejos de las luces de la ciudad, en largas estelas verticales sobre el agua.",
  "Los campanarios que se recortan sobre la delgada franja de cielo rojo.",
  "Las espirales luminosas de las farolas, en la orilla del primer plano.",
  "La silueta de un tejado y una chimenea, a la izquierda, sobre el halo.",
]
themes = ["noche", "ciudad", "azul", "estocolmo", "agua"]
anecdote = """
Sus amigos pintores lo llamaban también «Jansson-petróleo», porque sus cuadros azules les hacían pensar en la luz cálida de las lámparas de petróleo, según el Nationalmuseum."""
salle = 4
mur = "sud"
place = 2
largeur = 1.35

[[oeuvres]]
titre = "La madre de Lemminkäinen"
artiste = "Akseli Gallen-Kallela"
annee = "1897"
image = "mere-lemminkainen.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Akseli_Gallen-Kallela_-_Lemminkäisen_äiti_-_A_I_640_-_Finnish_National_Gallery.jpg"
technique = "Témpera sobre lienzo, 85,5 × 108,5 cm"
collection = "Ateneum, Galería Nacional de Finlandia, Helsinki"
note = "A orillas del río de los muertos, una madre vela el cuerpo de su hijo, que ha rescatado y vuelto a coser, e implora al cielo: una escena del Kalevala."
description = """
En una ribera de guijarros, a orillas de un río negro, una mujer anciana está sentada, con un pañuelo blanco en la cabeza, una mano posada sobre el cuerpo desnudo de un joven tendido sobre una sábana blanca. Tiene los ojos cerrados y el rostro vuelto hacia el suelo, el cabello rubio extendido sobre el lienzo. Ella levanta hacia el cielo una mirada llena de angustia y de espera. Arriba, en el centro, finos rayos dorados y ondulados descienden del cielo. Tras ellos, junto al agua, una hilera de piedras rojas, como manchadas de sangre; arriba a la izquierda, sobre el río sombrío, nada un cisne. En primer plano, entre los guijarros, yacen cráneos y huesos, y brotan extrañas flores pálidas."""
evocation = """
El Kalevala, la epopeya nacional finlandesa compilada en el siglo XIX por Elias Lönnrot, cuenta que el héroe Lemminkäinen fue muerto al querer abatir el cisne de Tuonela, el reino de los muertos, y que su cuerpo fue arrojado en pedazos al río. Su madre lo rastrilló en el agua, cosió sus miembros y espera la abeja que debe traerle miel de las moradas de Ukko, el dios del cielo, para devolverlo a la vida. El pintor compone una piedad pagana. Para él, el corazón del cuadro era el amor materno. Pintado dos años después de la muerte de su hija mayor, arrebatada por la difteria, figura entre las obras en las que se ha visto cómo su arte se hacía más sombrío y más intenso."""
histoire = """
Gallen-Kallela pinta este cuadro en 1897, durante aproximadamente un año, en Kalela, el taller que se hizo construir en plena selva, a orillas del lago Ruovesi. Son los años de sus grandes escenas del Kalevala, como la Defensa del Sampo, cuando Finlandia, gran ducado del Imperio ruso, busca afirmar su cultura frente a la rusificación. El cuadro ingresa ya en 1898 en las colecciones del Ateneum, dentro de la colección Antell, financiada por un legado privado destinado al arte finlandés. No ha vuelto a salir del museo, del que es una de las obras emblemáticas. Una versión al gouache, durante mucho tiempo discutida, se conserva en el museo Serlachius de Mänttä."""
facture = """
Gallen-Kallela elige la témpera, más mate y más apagada que el óleo, que da a los colores el aspecto de un fresco antiguo. Desde comienzos de los años 1890 ha abandonado el naturalismo aprendido en París por un estilo sintético, inspirado en el simbolismo: contornos dibujados, grandes superficies de color, composición en friso. El fondo negro del río hace resaltar el blanco de la sábana y la palidez del cuerpo. Los guijarros del primer plano están pintados uno a uno, con una precisión casi obsesiva."""
details = [
  "El cisne de Tuonela, que nada sobre el río negro, arriba a la izquierda.",
  "Los rayos dorados y ondulados que descienden del cielo, en el centro.",
  "La hilera de piedras rojas, como ensangrentadas, a lo largo del agua.",
  "Los cráneos y los huesos entre los guijarros, en primer plano.",
  "Las flores pálidas y rígidas, flores del país de los muertos.",
]
themes = ["kalevala", "madre", "muerte", "mito", "finlandia"]
anecdote = """
Según una tradición recogida en Finlandia, el pintor habría hecho posar a su propia madre y, para obtener en su rostro una verdadera expresión de desesperación, le habría contado historias tristes y terribles durante las sesiones."""
