[exposition]
ordre = 155
nom_court = "Pintura nórdica"
mouvement = "La luz del Norte, pintura escandinava"
cadre = "bois"
couleur = "#2f5470"
titre = "La luz del Norte, pintura escandinava y finlandesa"
artiste = "Krøyer, Hammershøi, Larsson, Zorn, Schjerfbeck, Gallen-Kallela, Simberg…"
dates = "1883–1926"
accroche = "Exposición virtual · Ateneum, Helsinki"
introduction = """
Entre 1880 y 1920, los pintores de Dinamarca, Suecia, Noruega y Finlandia, formados en París, regresan a sus países para pintar lo que solo pertenece al Norte: las tardes de verano que no terminan, la luz rasante de los interiores de invierno, las fiestas de San Juan y los mitos del Kalevala. La visita reúne a once pintores, de la playa de Skagen a las orillas del lago Jølster, en once cuadros. El edificio se inspira en el Ateneum de Helsinki, el palacio de las artes neorrenacentista de la plaza de la Estación: un vestíbulo, una gran sala central alta y simétrica, dos galerías laterales y, al fondo, una sala dedicada a los tesoros finlandeses del museo."""
vitrine = "soiree-ete-skagen.jpg"

[musee]
nom = "Ateneum"
ville = "Helsinki, Finlandia"
architecte = "Theodor Höijer"
construction = "1887"
presentation = """
En el siglo XIX, los medios artísticos finlandeses lucharon durante mucho tiempo por conseguir un edificio que reuniera su escuela de dibujo y sus colecciones. El Ateneum, diseñado por el arquitecto Theodor Höijer, se terminó en 1887 junto a la plaza de la Estación, en el corazón de Helsinki. Su nombre evoca el Ateneo antiguo, y su fachada neorrenacentista, perfectamente simétrica, es un programa esculpido: los bustos del arquitecto Bramante, del pintor Rafael y del escultor Fidias sobre la entrada, cuatro cariátides que representan las artes y, en el frontón, el lema latino Concordia res parvae crescunt, «con la concordia, las cosas pequeñas crecen», esculturas de Carl Eneas Sjöstrand; entre las ventanas, dieciséis medallones de Ville Vallgren. El edificio albergó también durante mucho tiempo escuelas de arte. Renovado de 1985 a 1991, es hoy uno de los museos de la Galería Nacional de Finlandia y conserva los grandes cuadros de la edad de oro finlandesa, de Gallen-Kallela, Schjerfbeck o Simberg. En 1903, la Calle en Auvers-sur-Oise hizo de su colección la primera del mundo en contar con una tela de Van Gogh."""
ici = """
El edificio de ARTEON retoma la simetría del Ateneum en torno a un eje central. Se entra por el sur en el vestíbulo, de muros crema, que da a la gran sala, cuadrada, de once metros de altura, dedicada a Skagen y a Sundborn. A uno y otro lado se abren dos galerías gemelas: al oeste, «Los interiores», de muros gris perla, dedicados a las estancias silenciosas de Copenhague, de Skagen y de París; al este, «Las noches claras», de un azul pálido, para las fiestas y las noches del verano nórdico. Al fondo, al norte, la sala finlandesa, de muros ocre claro, reúne tres cuadros emblemáticos del Ateneum."""

