largeur = 1.6

[[artistes]]
nom = "Peder Severin Krøyer"
vie = "Stavanger (Noruega), 23 de julio de 1851 – Skagen (Dinamarca), 21 de noviembre de 1909"
biographie = """
Nacido en Noruega de una madre considerada incapaz de criarlo, Peder Severin Krøyer crece en Copenhague con su tía y su tío, el zoólogo Henrik Krøyer. Dotado desde muy joven, ingresa a los doce años en la Real Academia de Bellas Artes. Ya en 1874, el fabricante de tabaco Heinrich Hirschsprung le compra sus primeras obras y se convierte en su mecenas y amigo. De 1877 a 1881 viaja por Europa, estudia en París con Léon Bonnat y descubre a los impresionistas. En 1882 pasa su primer verano en Skagen, pueblo de pescadores en la punta norte de Dinamarca, donde se ha formado una colonia de artistas en torno a Michael y Anna Ancher. Pinta allí a los pescadores, y luego las fiestas y las veladas de los artistas. En 1889 se casa con Marie Triepcke, también pintora, que se convierte en su modelo favorita; se instalan en Skagen en 1891 y tienen una hija, Vibeke. Pero la salud de Krøyer se deteriora: hace varias estancias en un hospital psiquiátrico, y la pareja se separa, antes de divorciarse en 1905. Su vista disminuye hasta la ceguera; pinta, sin embargo, casi hasta el final. Muere en Skagen en 1909. Sus cuadros figuran hoy entre los más caros de la pintura danesa."""
style = """
Retratista brillante y pintor de grandes composiciones de grupo, Krøyer une un dibujo preciso, aprendido en la Academia y con Bonnat, a la claridad del aire libre impresionista. Es el pintor de la luz de Skagen: sol de mediodía sobre los pescadores y, a partir de los años 1890, las horas azules de las tardes de verano, en que mar y cielo se funden. Hizo de Skagen un mito del arte danés."""

[[artistes]]
nom = "Carl Larsson"
vie = "Estocolmo, 28 de mayo de 1853 – Falun, 22 de enero de 1919"
biographie = """
Carl Larsson nace en el casco antiguo de Estocolmo en una familia muy pobre; su padre es violento, su madre, lavandera, mantiene a la familia. A los trece años, un maestro lo anima a ingresar en la Real Academia de Bellas Artes, donde se impone poco a poco. Gana primero su vida como dibujante de prensa e ilustrador. En 1877 parte a París, donde conoce años difíciles. En 1882 se une a la colonia de artistas escandinavos de Grez-sur-Loing, cerca de Fontainebleau: allí conoce a la pintora Karin Bergöö, con quien se casa en 1883, y adopta la acuarela. De regreso en Suecia, enseña en Gotemburgo y luego se instala con Karin en Lilla Hyttnäs, la casa de Sundborn que el padre de Karin les regaló en 1888. Sus ocho hijos se convierten en sus modelos, y los álbumes ilustrados de la casa, empezando por Ett hem en 1899, lo hacen célebre en toda Europa. Pinta también grandes decoraciones, en particular para el Nationalmuseum; la última, Midvinterblot, terminada en 1915, es rechazada al principio. Al final de su vida sufre depresiones y muere en 1919, poco después de un ataque."""
style = """
Larsson es el pintor de la felicidad doméstica: acuarelas luminosas, de trazo de ilustrador, donde la vida de familia, las fiestas y los interiores de Sundborn se describen con humor y ternura. Sus imágenes, inspiradas en los grabados japoneses y en el movimiento Arts and Crafts, contribuyeron a definir un estilo sueco claro, sencillo y colorido, que aún influye en la decoración de las casas."""

[[artistes]]
nom = "Vilhelm Hammershøi"
vie = "Copenhague, 15 de mayo de 1864 – Copenhague, 13 de febrero de 1916"
biographie = """
Hijo de un comerciante de Copenhague, Vilhelm Hammershøi aprende dibujo desde los ocho años y luego estudia en la Real Academia de Bellas Artes de Dinamarca. De 1883 a 1885 sigue también la enseñanza de Peder Severin Krøyer en una escuela libre. Debuta en el Salón de Charlottenborg en 1885 con el retrato de su hermana Anna, pero su arte desconcierta pronto a las instituciones: en 1888, el jurado de Charlottenborg se niega a exponerlo. En 1891 se casa con Ida Ilsted, hermana de su amigo el pintor Peter Ilsted; ella se convierte en la figura, a menudo vista de espaldas, de sus interiores. Hammershøi vive casi siempre en Copenhague, en pisos antiguos que elige con cuidado, en particular en el número 30 y luego en el 25 de la calle Strandgade. Viaja sin embargo por Europa y ama especialmente Londres, de la que pinta las brumas y el British Museum. Discreto, taciturno, es admirado por artistas y escritores como Rainer Maria Rilke. Muere de cáncer en 1916. Olvidado durante mucho tiempo, fue redescubierto a finales del siglo XX, con retrospectivas en París, Nueva York y Londres."""
style = """
Hammershøi pinta casi siempre los mismos temas: estancias vacías o habitadas por una sola figura, fachadas sin transeúntes, paisajes desiertos. Su paleta de grises, blancos y pardos, sus composiciones geométricas y su luz suave crean una atmósfera de silencio y extrañeza. Se le ha comparado con Vermeer y con Whistler; es hoy uno de los pintores daneses más conocidos del mundo."""

[[artistes]]
nom = "Anna Ancher"
vie = "Skagen (Dinamarca), 18 de agosto de 1859 – Skagen, 15 de abril de 1935"
biographie = """
Anna Brøndum nace en Skagen, en la punta norte de Jutlandia, donde su padre regenta el hotel Brøndum. Los pintores que se alojan allí la inician muy pronto en su arte. Estudia después tres años dibujo en Copenhague, en la escuela del paisajista Vilhelm Kyhn, y más tarde en París, en el taller de Pierre Puvis de Chavannes. En 1880 se casa con el pintor Michael Ancher, venido a Skagen; tienen una hija, Helga. En una época en que se espera de una mujer casada que renuncie a su oficio, ella sigue pintando toda su vida. Es la única de los pintores de Skagen que nació allí, y pinta a la gente que conoce: pescadores, ancianas, criadas, niños, y las estancias de su propia casa. Sus cuadros representan el arte danés en el extranjero, en particular en la Exposición Universal de Chicago de 1893. Recibe en 1913 la medalla Ingenio et Arti. Muere en Skagen en 1935. La casa de los Ancher, legada por su hija, se ha convertido en museo, y la pareja figuraba en los billetes daneses de mil coronas emitidos en 2004."""
style = """
Anna Ancher es una colorista atenta a la luz natural: sol que entra en una estancia, reflejos en un muro, contraluz tras una cortina. Pinta la vida cotidiana de las mujeres y de los humildes de Skagen con gravedad y sin pintoresquismo, en el espíritu del «avance moderno» del arte nórdico. Se la considera una de las mayores artistas danesas."""

[[artistes]]
nom = "Harriet Backer"
vie = "Holmestrand (Noruega), 21 de enero de 1845 – Oslo, 25 de marzo de 1932"
biographie = """
Harriet Backer nace en una familia acomodada de armadores, en Holmestrand, al sur de Noruega; la familia se instala en Christiania, la actual Oslo, en 1856. Toma lecciones de dibujo desde los doce años y luego estudia con varios maestros noruegos. Acompaña también a su hermana, la pianista y compositora Agathe Backer Grøndahl, en sus giras europeas. De 1874 a 1878 trabaja en Múnich con el pintor Eilif Peterssen y luego se instala en París, donde estudia con Léon Bonnat y Jean-Léon Gérôme y comparte un taller con su amiga Kitty Kielland. Descubre allí la pintura al aire libre y pasa a los temas de la vida contemporánea. En 1889 recibe una medalla de plata en la Exposición Universal. De regreso en Noruega en 1888, dirige de 1889 a 1912 una escuela de pintura que forma a una generación de artistas, entre ellos Nikolai Astrup. Pinta despacio, solo termina unos ciento ochenta cuadros y recibe las más altas distinciones de su país. Muere en Oslo en 1932."""
style = """
Harriet Backer es la gran pintora noruega de los interiores: salones burgueses, estancias campesinas, iglesias rurales. Formada en el realismo, se aparta de él mediante una pincelada libre y una búsqueda muy avanzada del color, que construye mancha a mancha, como un acorde musical. Pionera entre las mujeres artistas de su tiempo, marcó duraderamente el arte noruego."""

[[artistes]]
nom = "Anders Zorn"
vie = "Mora (Suecia), 18 de febrero de 1860 – Mora, 22 de agosto de 1920"
biographie = """
Anders Zorn crece en la granja de sus abuelos, cerca de Mora, en Dalarna. De 1875 a 1880 estudia en la Real Academia de Bellas Artes de Estocolmo, donde su talento asombra a sus profesores; los encargos llegan pronto. En 1885 se casa con Emma Lamm, procedente de una rica familia de comerciantes judíos de Estocolmo, culta y apasionada por el arte, que lo apoya toda su vida. Viaja mucho, a Londres, a España, a Italia, a Estados Unidos, y vive largo tiempo en París, donde se une al pintor finlandés Albert Edelfelt. A los veintinueve años es nombrado caballero de la Legión de Honor con ocasión de la Exposición Universal de 1889. Retratista muy solicitado, pinta al rey Óscar II y a tres presidentes estadounidenses, entre ellos Theodore Roosevelt. En 1896 vuelve a instalarse en Mora, en la casa que amplía, Zorngården; pinta allí la vida campesina y las bañistas, y se empeña en preservar la música popular y las viejas casas de madera. Grabador al aguafuerte de renombre, es también escultor. Muere en Mora en 1920; con Emma, lega sus bienes al Estado sueco."""
style = """
Zorn es un virtuoso de la pincelada: le bastan unos pocos trazos anchos y rápidos para dar un rostro, una tela o un reflejo en el agua. Sobresale tanto en los retratos mundanos como en las escenas de la vida campesina de Dalarna y en los desnudos al aire libre. Sus aguafuertes, hechos de trazos libres, figuran entre los más admirados de su tiempo."""

[[artistes]]
nom = "Nikolai Astrup"
vie = "Kalvåg (Noruega), 30 de agosto de 1880 – Førde (Noruega), 21 de enero de 1928"
biographie = """
Nikolai Astrup nace en la costa oeste de Noruega y crece en Jølster, en la casa parroquial de Ålhus, donde su padre es pastor; es el mayor de once hermanos. Su padre quiere hacer de él un pastor y lo envía a la escuela de la catedral de Trondheim, pero el muchacho prefiere el dibujo. En 1899 parte a Kristiania, la actual Oslo, e ingresa pronto en la escuela de pintura de Harriet Backer, donde estudia hasta 1901. Reside después en París, donde frecuenta la Academia Colarossi, y viaja por Alemania. Desde 1902 vuelve a vivir en Jølster, que apenas abandonará ya. En 1907 se casa con Engel Sunde, con quien tiene ocho hijos; en 1913 la familia se instala en Sandalstrand, a orillas del lago Jølstravatnet, donde cultiva su jardín y pinta incansablemente los mismos paisajes. Expone en Kristiania y en Bergen, y se convierte en uno de los artistas más originales de su generación. Asmático, de salud frágil, muere de neumonía en 1928, a los cuarenta y siete años."""
style = """
Astrup pinta y graba los paisajes y las costumbres de Jølster con colores intensos y formas simplificadas, fuertemente perfiladas. Neorromántico, mezcla la observación precisa de la naturaleza con una ensoñación casi mágica. Sus xilografías en color, que retocaba a mano, son de gran inventiva. Se le ha comparado a menudo con Munch, con cuadros más luminosos y más serenos."""

[[artistes]]
nom = "Eugène Jansson"
vie = "Estocolmo, 18 de marzo de 1862 – Nacka (Suecia), 15 de junio de 1915"
biographie = """
Eugène Jansson nace en Estocolmo en una familia modesta pero apasionada por la música y el arte. Una escarlatina contraída a los catorce años le deja una salud frágil, mala vista y mal oído. Estudia en el Tekniska skolan, con el pintor Edvard Perséus, y luego en la Real Academia de Bellas Artes, pero no tiene medios para ir a París. Socialista, participa en el movimiento de los «Opositores», que impugnan la Academia. Tras la muerte de su padre en 1891, vive con su madre y su hermano Adrian en Södermalm, en las alturas que dominan la bahía de Riddarfjärden. De allí extrae, hasta hacia 1904, una larga serie de nocturnos azules. En 1898, el banquero Ernest Thiel le compra sus primeras telas y se convierte en su principal coleccionista; la galería Thiel, en Estocolmo, conserva aún el mayor conjunto de sus obras. Agotado por sus vistas de ciudad, se vuelve hacia 1907 hacia la figura: nadador asiduo, pinta a los marineros y a los atletas de los baños de la Marina. Muere en 1915 de una hemorragia cerebral."""
style = """
En su período azul, Jansson pinta Estocolmo de noche en vastas vistas picadas, dominadas por el azul, de pinceladas cruzadas y visibles, donde las luces de la ciudad se convierten en halos y espirales. Estos nocturnos, próximos a Munch por su intensidad, se deslizan poco a poco hacia la abstracción. Sus desnudos masculinos más tardíos, potentes y luminosos, se redescubren hoy."""

[[artistes]]
nom = "Akseli Gallen-Kallela"
vie = "Pori (Finlandia), 26 de abril de 1865 – Estocolmo, 7 de marzo de 1931"
biographie = """
Nacido Axel Gallén en Pori, en una familia de lengua sueca, estudia en Helsinki contra el parecer de su padre y luego en París, de 1884 a 1889, en la Academia Julian y con Cormon. Adopta allí primero el naturalismo de Jules Bastien-Lepage. En 1890 se casa con Mary Slöör; su viaje de bodas a Carelia, donde recoge cantos e imágenes para ilustrar el Kalevala, abre el camino al «carelianismo». En 1895, la muerte de su hija mayor, Impi Marjatta, lo trastorna. De 1896 a 1899 pinta sus grandes escenas del Kalevala, como la Defensa del Sampo y la Madre de Lemminkäinen, en su taller de Kalela, en el bosque. En la Exposición Universal de París de 1900 decora al fresco el pabellón finlandés. En 1907 finlandiza su nombre en Akseli Gallen-Kallela. Vive también dos años en Kenia, a partir de 1909 y, tras la independencia de Finlandia, diseña para el nuevo Estado banderas y condecoraciones. Muere en 1931 en Estocolmo, a la vuelta de un viaje a Copenhague."""
style = """
Gallen-Kallela pasa del realismo aprendido en París a un estilo sintético y simbolista: contornos firmes, colores francos, composiciones decorativas. Da rostro a los héroes del Kalevala y se convierte en el pintor de la identidad finlandesa. Pintor, grabador, fresquista, diseñador y arquitecto de sus propios talleres, es la gran figura de la edad de oro del arte finlandés."""

[[artistes]]
nom = "Helene Schjerfbeck"
vie = "Helsinki, 10 de julio de 1862 – Saltsjöbaden (Suecia), 23 de enero de 1946"
biographie = """
A los cuatro años, Helene Schjerfbeck cae por una escalera y se lesiona la cadera: cojeará toda su vida. Su talento es tan precoz que ingresa a los once años en la escuela de dibujo de la Sociedad Finlandesa de Bellas Artes. Gracias a becas, parte en 1880 a París, trabaja en la Academia Colarossi y pinta en Bretaña, en Pont-Aven. En 1887-1888, en St Ives, en Cornualles, pinta La convaleciente, premiada con medalla en la Exposición Universal de 1889. Sus esponsales con un pintor sueco se rompen en 1885. En los años 1890 enseña en Helsinki y luego, enferma, se instala en 1902 con su madre en Hyvinkää, pequeña ciudad alejada del mundo del arte, donde vive cerca de veinte años. Inventa allí, casi sola, un arte moderno y desnudo. A partir de 1913, el marchante Gösta Stenman la da a conocer; su primera exposición individual tiene lugar en 1917. Tras la muerte de su madre, vive en Ekenäs. En 1944 se refugia en Suecia, en Saltsjöbaden, donde pinta sus últimos autorretratos, y muere en 1946."""
style = """
Schjerfbeck comienza con un realismo virtuoso, aprendido en París, y luego simplifica sin cesar: formas reducidas a lo esencial, colores apagados, superficies raspadas y desgastadas. Sus retratos y su larga serie de autorretratos, hasta los rostros casi borrados de la vejez, figuran entre las cimas de la pintura moderna nórdica. Conocida durante mucho tiempo sobre todo en Finlandia y en Suecia, es hoy celebrada en el mundo entero."""

[[artistes]]
nom = "Hugo Simberg"
vie = "Hamina (Finlandia), 24 de junio de 1873 – Ähtäri (Finlandia), 12 de julio de 1917"
biographie = """
Hijo de un coronel, Hugo Simberg nace en Hamina, en el sureste de Finlandia. Una tía, que dirige una escuela en la casa familiar y pinta como aficionada, lo anima a hacerse artista. Estudia en la escuela de dibujo de Viipuri y luego, de 1893 a 1895, en la de la Sociedad Finlandesa de Bellas Artes, donde Helene Schjerfbeck es una de sus profesoras. De 1895 a 1897 se convierte en alumno particular de Akseli Gallen-Kallela, en su taller de Kalela, en el bosque. Viaja después a Londres, a París y a Italia. Sus pequeñas obras extrañas, pobladas de diablos, esqueletos y ángeles, son bien acogidas en las exposiciones de otoño. En el otoño de 1902 cae gravemente enfermo; tras su curación, pinta El ángel herido. De 1904 a 1906 decora con Magnus Enckell la iglesia de San Juan de Tampere: sus pinturas, con la serpiente y los muchachos desnudos que llevan una guirnalda, causan escándalo y solo son aprobadas por un voto de diferencia. Enseña después en el Ateneum, se casa con Anni Bremer en 1910 y muere en 1917, a los cuarenta y cuatro años."""
style = """
Simberg es el gran simbolista finlandés: con medios muy sencillos, un dibujo ingenuo, colores apagados, crea un mundo a la vez macabro y tierno, donde la Muerte cultiva su jardín, donde los diablos tocan el violín y donde los ángeles están heridos. Sin explicar jamás sus imágenes, les da una profundidad melancólica que sigue conmoviendo ampliamente al público."""
