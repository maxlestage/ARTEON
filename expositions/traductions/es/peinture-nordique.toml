[[oeuvres]]
titre = "Tarde de verano en la playa de Skagen"
artiste = "Peder Severin Krøyer"
annee = "1893"
image = "soiree-ete-skagen.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:P.S._Krøyer_-_Summer_evening_on_Skagen's_Beach._Anna_Ancher_and_Marie_Krøyer_walking_together._-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 100 × 150 cm"
collection = "Skagens Museum, Skagen (Dinamarca)"
note = "Anna Ancher y Marie Krøyer, la esposa del pintor, pasean del brazo junto al mar, a la hora azul de una tarde de verano."
description = """
Dos mujeres con largos vestidos blancos caminan una al lado de la otra a lo largo de la orilla, del brazo, y se alejan de nosotros. Una, sin sombrero, lleva un moño oscuro; la otra va tocada con un sombrero de paja amarillo. Avanzan sobre la arena mojada, junto a un mar perfectamente en calma cuyas olitas depositan un fino ribete de espuma. El resto del lienzo está casi vacío: a la derecha, la gran playa clara, donde la arena conserva la huella de las pisadas; a la izquierda, el agua de un azul lechoso que se confunde con el cielo, sin línea de horizonte nítida. Al fondo, a la derecha, una franja de dunas verdes cierra la vista. Las dos paseantes, pequeñas en la inmensidad, están situadas en el tercio izquierdo del cuadro, donde la mirada las encuentra enseguida."""
evocation = """
Krøyer pinta la hora azul, ese momento de las tardes de verano escandinavas en que el sol ya puesto deja que el mar y el cielo se bañen en una misma luz fría y suave, y que fascinaba a los pintores de Skagen. Las dos mujeres son dos artistas, amigas, esposas de dos pintores de la colonia: Anna Ancher, nacida en Skagen, y Marie Krøyer. El cuadro celebra su complicidad, pero tiene también algo de melancólico: nos dan la espalda, y el paisaje parece suspendido fuera del tiempo. A menudo se ha releído a la luz de lo que vino después, el distanciamiento del matrimonio Krøyer y la enfermedad del pintor. Se ha convertido en la imagen misma del verano danés y de Skagen, reproducida hasta el infinito."""
histoire = """
Krøyer descubre Skagen, pueblo de pescadores en la punta norte de Jutlandia, en 1882; se instala allí con Marie en 1891. Para este cuadro fotografía al menos dos veces a Anna Ancher y a Marie caminando del brazo junto al agua, y pinta varios bocetos del motivo, dos de los cuales se encuentran en la Colección Hirschsprung de Copenhague. La gran tela es comprada en 1895, durante una exposición en Múnich, por una cantante de ópera alemana; pasa después años en un chalet de montaña en Austria y cae en el olvido. Cuando reaparece, en 1978, en una subasta de Copenhague, la adquiere el editor de prensa alemán Axel Springer. Su viuda la dona al museo de Skagen, que la recibe en 1986, en agradecimiento por el salvamento de los judíos de Dinamarca por los daneses en 1943."""
facture = """
Krøyer, formado en París con Léon Bonnat, retuvo de los impresionistas el gusto por el aire libre, pero conserva un dibujo preciso. La paleta se reduce a azules, malvas y blancos, que algunos toques amarillos calientan sobre la arena. La composición descansa en la gran diagonal de la orilla, que parte de abajo a la izquierda y huye hacia el fondo a la derecha, y en el contraste entre las dos figuras nítidas y el espacio vaporoso que las rodea. Los vestidos blancos, que atrapan la última luz, son el punto más claro del cuadro."""
details = [
  "Las huellas de pisadas en la arena, en primer plano a la derecha.",
  "El sombrero de paja amarillo, único color cálido del grupo.",
  "El fino ribete de espuma que sigue la línea de la orilla.",
  "La firma, abajo a la izquierda: S. Krøyer, Skagen, 93.",
]
themes = ["playa", "hora azul", "amistad", "verano", "skagen"]
anecdote = """
Durante la restauración del cuadro, en 2005, se hallaron granos de arena adheridos a la pintura por toda la superficie del lienzo: la prueba de que Krøyer lo había pintado, al menos en parte, en la propia playa."""
salle = 2
mur = "nord"
place = 1
largeur = 2.4

[[oeuvres]]
titre = "Desayuno bajo el gran abedul"
artiste = "Carl Larsson"
annee = "1896"
image = "petit-dejeuner-bouleau.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Breakfast_under_the_Big_Birch._From_A_Home_(26_watercolours)_(Carl_Larsson)_-_Nationalmuseum_-_24220.tif"
technique = "Acuarela sobre papel, 32 × 43 cm"
collection = "Nationalmuseum, Estocolmo"
note = "La familia Larsson desayuna en el jardín de su casa de Sundborn: una de las acuarelas que hicieron soñar a toda Suecia."
description = """
En un jardín de verano, una larga mesa de madera está dispuesta sobre la hierba, a la sombra de un gran abedul cuyo tronco blanco ocupa toda la izquierda de la imagen. Alrededor, una familia numerosa está sentada a la mesa: dos muchachos con camisa a rayas y gorra, vistos de espaldas en el banco, niñas con vestido rojo y gorro blanco, una niña pequeña con sombrero rojo que se vuelve hacia nosotros y, en el extremo de la mesa, la madre con vestido gris y sombrero de pluma. Un gran perro pelirrojo apoya la cabeza sobre la mesa, entre los comensales. Detrás, la casa de madera pintada de rojo, con una jardinera verde bajo la ventana, y una empalizada gris. A la izquierda, una silla anaranjada ha quedado vacía; una gallina picotea en la hierba, y dos botellas yacen al pie del árbol."""
evocation = """
Larsson pinta a su propia familia, a su mujer Karin y a sus hijos, en la casa de Lilla Hyttnäs, en Sundborn, en Dalarna. La escena expresa la felicidad sencilla del verano sueco: comer al aire libre, los niños, los animales, la luz filtrada por las hojas. La silla vacía, en primer plano, suele entenderse como la del propio pintor, que se ha levantado para mostrarnos a los suyos. Pero este idilio es también un programa: una vida sana, sin lujo ni fachada, cercana a la naturaleza y a la artesanía. Larsson, que había conocido una infancia muy pobre y desdichada en Estocolmo, construye en estas imágenes el hogar feliz que no tuvo. Han moldeado la idea que los suecos, y muchos otros, se hacen de la casa ideal."""
histoire = """
En 1888, el padre de Karin, Adolf Bergöö, regala a la joven pareja una pequeña casa de madera en Sundborn, cerca de Falun. Carl y Karin la transforman y la decoran ellos mismos, mezclando la tradición campesina sueca con el nuevo gusto del Art Nouveau. En los años 1890, Larsson dedica a la casa y a la vida familiar una serie de acuarelas, entre ellas esta, hoy conservada en el Nationalmuseum de Estocolmo. En 1899, el editor Bonnier publica veinticuatro, en color, en un álbum titulado Ett hem (Un hogar). El libro conoce un inmenso éxito e influye duraderamente en la decoración de los interiores suecos. Una antología alemana, Das Haus in der Sonne (La casa al sol), difunde después sus imágenes por toda Europa."""
facture = """
Larsson, ilustrador de oficio, perfila cada forma con un trazo de tinta fino y flexible y luego aplica la acuarela en tonos claros y transparentes. Las superficies planas de color, el contorno marcado y el encuadre, con el tronco cortado en el borde izquierdo y el gran primer plano de hierba casi vacío, recuerdan los grabados japoneses que coleccionaban los artistas de su generación. La hierba está hecha de largos trazos rápidos, casi caligráficos. El rojo de los vestidos y de la casa responde al verde tierno del follaje."""
details = [
  "Dos corazones, unas iniciales entrelazadas y una fecha grabados en la corteza del abedul.",
  "El perro pelirrojo que apoya la cabeza sobre la mesa, entre los niños.",
  "Las dos botellas tumbadas en la hierba, al pie del árbol.",
  "La gallina blanca que picotea junto a la silla vacía.",
  "El monograma del pintor, C L, abajo en el centro.",
]
themes = ["familia", "jardín", "verano", "comida", "casa"]
anecdote = """
Carl y Karin Larsson tuvieron ocho hijos, que son los modelos de casi todas estas acuarelas. Su casa de Sundborn, convertida en Carl Larsson-gården, sigue perteneciendo a sus descendientes, que la abren a los visitantes cada verano."""
salle = 2
mur = "nord"
place = 4
largeur = 1.3

[[oeuvres]]
titre = "Interior de Strandgade, sol sobre el suelo"
artiste = "Vilhelm Hammershøi"
annee = "1901"
image = "strandgade-soleil.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Stue_i_Strandgade_med_solskin_på_gulvet.jpg"
technique = "Óleo sobre lienzo, 46,5 × 52 cm"
collection = "SMK – Galería Nacional de Dinamarca, Copenhague"
note = "El salón del pintor en Copenhague, su mujer Ida de espaldas, y el sol que dibuja la ventana sobre el suelo."
description = """
Una estancia casi vacía, de muros revestidos de madera en un gris muy claro. A la izquierda, una mujer de vestido negro está sentada de espaldas en una silla, inclinada sobre una pequeña mesa de caoba en media luna; solo se ve su nuca y la masa oscura de su vestido. En la pared, sobre ella, dos pequeños marcos. En el centro, una alta ventana de cristales pequeños, velada por cortinas de muselina blanca recogidas a los lados, deja entrar el sol, que proyecta sobre el suelo gris la forma luminosa de los cristales. A la derecha, una gran puerta blanca de paneles, cerrada, ocupa todo un paño de la pared. Ningún objeto cuenta una historia, ningún ruido parece posible: la luz es el único acontecimiento del cuadro."""
evocation = """
La mujer vista de espaldas es Ida, la esposa del pintor, a quien suele representar así, absorta en una ocupación que no vemos. Esta figura que se sustrae da al cuadro su misterio: el espectador es admitido en la estancia sin ser recibido en ella. Estos interiores se han comparado mucho con los de Vermeer y los pintores holandeses del siglo XVII, con sus mujeres silenciosas junto a una ventana; pero en Hammershøi no hay carta ni instrumento de música, nada más que una espera. Decía amar, por sí mismos, las casas antiguas, los muebles viejos y la atmósfera tan particular que los rodea. El poeta Rainer Maria Rilke, que lo visitó, veía en él a un pintor del que no se puede hablar deprisa."""
histoire = """
De 1898 a 1908 aproximadamente, Hammershøi e Ida viven en el número 30 de la calle Strandgade, en una casa antigua del barrio de Christianshavn, en Copenhague. El piso es a la vez su taller y su motivo: pinta allí unos sesenta interiores, variando ligeramente la posición de un mueble, de una puerta o de la luz. Estos cuadros no son registros fieles: suprime tiradores, corta muebles, deja zonas vacías. Durante mucho tiempo, una parte del público y de las instituciones permaneció desconcertada ante este arte; ya en 1888, el jurado de la exposición de Charlottenborg se había negado a exponerlo. Este cuadro ingresa en 1924 en el museo nacional de Copenhague, por legado. Hoy figura entre las obras más célebres del museo."""
facture = """
Hammershøi pinta en capas finas, con una pincelada suave que deja ver el grano de la tela. Su paleta se limita al negro, al blanco, a los grises y a los pardos, pero es de una gran sutileza: durante la limpieza del cuadro, en 2012, la restauradora contó más de cuarenta blancos distintos. La composición está hecha de verticales y de rectángulos, puertas, ventana, marcos, revestimientos, y de la gran mancha luminosa del suelo. La figura, desplazada hacia el borde izquierdo, equilibra por sí sola la masa clara de la puerta."""
details = [
  "Sobre el suelo, la imagen de los cristales de la ventana, deformada por la perspectiva.",
  "Los dos pequeños marcos colgados en la pared sobre la mujer.",
  "La nuca inclinada de Ida, única parte visible de su rostro.",
  "El monograma V H, discreto, abajo a la derecha.",
]
themes = ["interior", "silencio", "luz", "soledad", "copenhague"]
anecdote = """
Interrogado en 1907 sobre sus colores escasos y apagados, Hammershøi respondió que no sabía por qué los elegía: le resultaba natural, y pensaba que un cuadro funciona tanto mejor, en cuanto al color, cuanto menos contiene."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "La joven en la cocina"
artiste = "Anna Ancher"
annee = "1883–1886"
image = "fille-cuisine.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Girl_in_the_Kitchen_(Anna_Ancher).jpg"
technique = "Óleo sobre lienzo, 87,7 × 68,5 cm"
collection = "Colección Hirschsprung, Copenhague"
note = "Una criada de espaldas, ante la ventana de una cocina de Skagen: el sol atraviesa la cortina amarilla e incendia la estancia."
description = """
Una joven está de pie, de espaldas, ante la encimera de una pequeña cocina. Lleva una falda de un rojo vivo y un corpiño verde oscuro; el cabello recogido en un moño. Ante ella, una ventana de cristales pequeños está medio oculta por una cortina amarillo pálido que el sol atraviesa y vuelve casi incandescente. Sobre la encimera, cuencos y paños; en el estante de debajo, un mortero amarillo y su mano. A la derecha, una puerta de madera parda está abierta de par en par a otra estancia, también luminosa. En primer plano a la izquierda, sobre un banco, coles, zanahorias y pescados planos puestos en una fuente. El suelo de anchas tablas se extiende hasta nosotros. Abajo a la derecha, la pintora ha firmado e inscrito dos fechas."""
evocation = """
Anna Ancher pinta un gesto ordinario, realizado por una mujer cuyo rostro no se ve, y hace de él un momento de recogimiento. El verdadero tema es la luz: la que incendia la cortina, la que entra por la puerta y la que se posa sobre el muro de la izquierda. Se piensa en las criadas de Vermeer y de Pieter de Hooch, que los pintores daneses admiraban. Pero la escena pertenece a la vida modesta de Skagen, donde la pintora creció. En un medio artístico dominado por los hombres, Anna Ancher, esposa y madre, elige pintar el mundo de las mujeres y el trabajo doméstico, con gravedad y sin anécdota. El cuadro figura entre las obras que marcan, en Dinamarca, el avance de una pintura más verdadera, atenta a la vida cotidiana."""
histoire = """
Como indican las dos fechas de la firma, Anna Ancher trabajó en este cuadro durante varios años, entre 1883 y 1886, en Skagen, donde vivía con su marido, el pintor Michael Ancher. Un estudio preparatorio para esta composición se conserva en el museo de Skagen. La tela es adquirida en 1904 por la colección reunida por Heinrich Hirschsprung, un fabricante de tabaco de Copenhague, mecenas y amigo de los pintores daneses de su tiempo, que había apoyado también a Krøyer desde sus comienzos. Hirschsprung dona su colección al Estado danés; esta se convierte en un museo, instalado en un pequeño edificio junto al parque Østre Anlæg, en Copenhague, donde el cuadro sigue expuesto."""
facture = """
El cuadro está construido a contraluz: la figura se recorta como una silueta oscura sobre la ventana, y la luz viene hacia nosotros. Anna Ancher consigue la cortina soleada con gruesos toques de amarillo, anaranjado y blanco, casi en relieve. El rojo de la falda, único color saturado, atrae la mirada hacia el centro. Los muros encalados adoptan, según la iluminación, tonos grises, rosados o azulados: la pintora estudia, como colorista, el modo en que la luz natural cambia los colores de una estancia."""
details = [
  "La cortina amarilla atravesada por el sol, sobre la cabeza de la criada.",
  "El mortero amarillo y su mano, en el estante de abajo.",
  "Las coles, las zanahorias y los pescados planos puestos sobre el banco, a la izquierda.",
  "La firma abajo a la derecha, con dos fechas: 1883 y 1886.",
]
themes = ["interior", "trabajo", "contraluz", "cocina", "skagen"]
anecdote = """
Anna Ancher es la única de los pintores de Skagen que nació allí: es hija del propietario del hotel Brøndum, donde se alojaban los artistas llegados de Copenhague. Fue allí donde conoció la pintura, y a su futuro marido."""
salle = 3
mur = "nord"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "Interior azul"
artiste = "Harriet Backer"
annee = "1883"
image = "interieur-bleu.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Harriet_Backer_-_Blue_Interior_-_NG.M.02582_-_National_Museum_of_Art,_Architecture_and_Design.jpg"
technique = "Óleo sobre lienzo, 84 × 66 cm"
collection = "Nasjonalmuseet, Oslo"
note = "La pintora Asta Nørregaard, amiga de la artista, en un piso parisino bañado por una luz azul."
description = """
En un salón burgués, una joven de vestido oscuro está sentada en un sillón azul, absorta en lo que tiene entre las manos. La luz viene de la derecha, por una ventana que oculta en parte una pesada cortina azul noche. Al fondo, contra la pared, un secreter de un rojo anaranjado, coronado por un pequeño cuadro enmarcado que muestra un velero sobre un mar azul. A la izquierda, un gran espejo de marco dorado refleja macetas de flores rosas. A la derecha, una planta verde de anchas hojas se alza en un cubremacetas claro, junto a dos sillas de cojines azules. Sobre el parqué, en primer plano, un cojín y algunos objetos de colores parecen haber sido abandonados. Todo se baña en una misma atmósfera azulada."""
evocation = """
El título habla de un interior azul pero, como subraya el museo de Oslo, la estancia no es azul en sí misma: es la luz del día, tamizada por la cortina, la que tiñe los muros, los muebles y las sombras. A Harriet Backer le interesa menos su modelo que el modo en que la luz hace existir un lugar. El cuadro muestra también un mundo de mujeres artistas: la modelo es Asta Nørregaard, pintora noruega, que vivía como Backer en París. Backer comparaba las manchas de color de un cuadro con las estrellas de una constelación, que deben mantenerse unidas en un acorde perfecto, como las notas de una música."""
histoire = """
Harriet Backer se instala en París en 1878; estudia allí con Léon Bonnat y Jean-Léon Gérôme, y descubre la pintura al aire libre y el impresionismo. Abandona entonces los temas históricos por escenas de la vida contemporánea: Interior azul, pintado en el piso parisino de su amiga, es uno de los primeros ejemplos. El cuadro se expone el mismo año en Copenhague y en la exposición de otoño de Kristiania, la actual Oslo, donde es bien recibido. Ingresa en 1964 en las colecciones de la Galería Nacional de Oslo, hoy el Nasjonalmuseet. En 1982-1983 viaja a Estados Unidos, a Washington, Nueva York y Minneápolis, en la exposición Northern Light, que da a conocer al público estadounidense la pintura nórdica."""
facture = """
Backer trabaja despacio, con pinceladas libres y distintas, buscando el acorde justo de cada color con sus vecinos. El azul domina, de la cortina casi negra a los pálidos reflejos del techo, pero es realzado por el rojo del secreter, el verde de la planta y el dorado del espejo. Estudia el contraste entre la luz fría que viene de la ventana y la sombra de la estancia, y sugiere la profundidad solo con el color, sin dibujo marcado."""
details = [
  "El gran espejo dorado, a la izquierda, donde se reflejan flores rosas.",
  "El pequeño cuadro de un velero, colgado sobre el secreter rojo.",
  "Los objetos de colores puestos sobre un cojín, en el parqué.",
  "La cortina azul noche que cierra el cuadro a la derecha.",
]
themes = ["interior", "azul", "luz", "mujeres", "parís"]
anecdote = """
Harriet Backer, que trabajaba muy despacio, solo dejó unos ciento ochenta cuadros. De 1889 a 1912 dirige una escuela de pintura en Kristiania, donde estudia, entre otros, el joven Nikolai Astrup, presente también en esta exposición."""
