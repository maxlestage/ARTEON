[[oeuvres]]
titre = "La convaleciente"
artiste = "Helene Schjerfbeck"
annee = "1888"
image = "convalescente.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Helene_Schjerfbeck_-_The_Convalescent.jpg"
technique = "Óleo sobre lienzo, 92 × 107 cm"
collection = "Ateneum, Galería Nacional de Finlandia, Helsinki"
note = "Una niña que se recupera de una enfermedad, acomodada en un sillón de mimbre, contempla una rama que brota: el regreso de la vida."
description = """
Una niña de cabello pelirrojo alborotado está sentada en un gran sillón de mimbre, apoyada contra gruesas almohadas blancas y envuelta en una sábana o manta clara, que cae hasta el suelo. Lleva un corpiño oscuro. Inclinada hacia delante, hacia una mesa de madera oscura, sostiene delicadamente un ramito de minúsculas hojas, plantado en una pequeña taza azul y blanca. Lo mira con una atención intensa. Sobre la mesa, libros, una garrafa y objetos de cristal atrapan la luz. Detrás de ella, una ventana ilumina la escena por la izquierda, y otra luz parece venir de la derecha. El fondo de la estancia, oscuro, está hecho de revestimientos de madera. Abajo a la izquierda, la firma y la fecha."""
evocation = """
El niño enfermo era un tema corriente de la pintura de los años 1880, a menudo tratado de manera patética. Schjerfbeck hace de él un cuadro de la curación: el ramito que brota, en primavera, responde a la vida que vuelve al cuerpo de la niña, y la luz que invade los blancos expresa el regreso de las fuerzas. Se ha visto en él también una especie de autorretrato simbólico: la pintora, coja desde una caída en la infancia, acababa de ver rotos sus esponsales con un pintor sueco, en parte a causa de su salud. La mirada concentrada de la niña, enteramente vuelta hacia ese pequeño milagro, da al cuadro una emoción sin sentimentalismo."""
histoire = """
Schjerfbeck pinta este cuadro en St Ives, en Cornualles, donde se había formado una colonia de artistas llegados de toda Europa; permanece allí en 1887-1888. La modelo, cuyo nombre se ignora, sería una niña de unos seis años, muy viva, a quien su institutriz dejaba posar de buen grado para los pintores. El cuadro se expone en el Salón de París de 1888 con el título Primer verdor, y es traído después a Finlandia, donde la Sociedad Finlandesa de Bellas Artes lo adquiere el mismo año. Algunos críticos lo encuentran entonces demasiado francés, otros elogian su libertad. Al año siguiente, en la Exposición Universal de París de 1889, recibe una medalla de bronce. Es hoy uno de los cuadros más queridos del Ateneum."""
facture = """
La pincelada es viva y libre, en particular en los blancos de las almohadas y de la sábana, hechos de matices grises, azulados y dorados. Schjerfbeck, formada en París, muestra en ella lo que ha retenido de la pintura al aire libre y del impresionismo: una luz venida de dos lados, reflejos en el cristal, contornos que se disuelven. El trenzado del sillón de mimbre está logrado con virtuosismo. Es su último gran cuadro dentro del espíritu realista de los años 1880: después simplificará cada vez más formas y colores."""
details = [
  "El ramito de hojas diminutas, en la taza azul y blanca.",
  "El cabello de la niña, iluminado a contraluz.",
  "El trenzado del sillón de mimbre, a la izquierda.",
  "La firma H. Schjerfbeck y la fecha, abajo a la izquierda.",
]
themes = ["infancia", "curación", "primavera", "luz", "interior"]
anecdote = """
En 2006, el Ateneum pidió al público que eligiera el cuadro de la nación finlandesa. La convaleciente quedó en segundo lugar, justo detrás de El ángel herido de Simberg, colgado en esta misma sala."""
salle = 5
mur = "est"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "El ángel herido"
artiste = "Hugo Simberg"
annee = "1903"
image = "ange-blesse.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hugo_Simberg_-_The_Wounded_Angel_-_Google_Art_Project.jpg"
technique = "Óleo sobre lienzo, 127 × 154 cm"
collection = "Ateneum, Galería Nacional de Finlandia, Helsinki"
note = "Dos muchachos graves llevan en una camilla a un ángel de ojos vendados y ala herida: el cuadro más querido de Finlandia."
description = """
Dos muchachos avanzan de izquierda a derecha por un camino de tierra, llevando entre ambos una camilla hecha de dos pértigas. Sobre ella está sentada una joven ángel, con vestido blanco y grandes alas blancas; una venda blanca le rodea la cabeza a la altura de los ojos, y su ala izquierda está manchada de sangre. Con la cabeza gacha, descalza, aprieta un pequeño ramillete de campanillas de invierno. El muchacho de la izquierda, todo de negro y con sombrero, mira el suelo; el de la derecha, con chaqueta parda, vuelve hacia nosotros una mirada sombría y seria. El paisaje es desolado: una tierra parda, algunos matorrales secos, pequeñas flores blancas, luego una bahía de aguas grises y, a lo lejos, una orilla baja bajo un cielo pálido."""
evocation = """
Simberg siempre se negó a explicar este cuadro: quería que despertara en cada cual una emoción, fuera cual fuese. Se sabe, sin embargo, que lo pintó tras una grave enfermedad, en 1902-1903, cuya curación vivió como un milagro, un renacimiento; el ángel herido ha sido leído a menudo como una imagen de su propia fragilidad. Se ha visto también la vulnerabilidad de la inocencia y de los ideales, llevados por niños demasiado graves para su edad. Las campanillas de invierno anuncian la curación y la primavera. El muchacho que nos mira nos toma por testigos, como para decir que esta escena nos concierne a todos. El cortejo parece dirigirse hacia los establecimientos de beneficencia que bordeaban entonces este parque, entre ellos una escuela para muchachas ciegas."""
histoire = """
Simberg trabajaba este tema desde su regreso de Italia, en 1898. Sus bocetos y las fotografías que tomó para preparar el cuadro muestran variantes: el ángel transportado en una carretilla, o llevado por pequeños diablos. El paisaje, en cambio, no cambia: es el parque de Eläintarha en Helsinki, a orillas de la bahía de Töölönlahti, lugar de paseo popular. Presentado en la exposición de otoño del Ateneum en 1903, el cuadro entusiasma a los pintores, empezando por Gallen-Kallela, como Simberg cuenta a su hermana en una carta; le vale un premio del Estado. En 1905-1906, Simberg pinta una gran versión al fresco en la iglesia de San Juan de Tampere, hoy catedral. En 2006, el público del Ateneum lo eligió cuadro nacional de Finlandia."""
facture = """
Simberg pinta en un estilo voluntariamente simple, casi ingenuo, que recuerda el arte popular y la miniatura. Las figuras están perfiladas, dispuestas de perfil como en un friso, sobre un fondo de paisaje tratado en anchas bandas horizontales. La paleta es apagada y terrosa, pardos, grises, ocres, de la que se destacan el blanco luminoso del ángel y el negro de los trajes. Casi no hay sombras: el simbolismo pasa aquí por la claridad del dibujo más que por los efectos."""
details = [
  "La pequeña mancha de sangre en el ala izquierda del ángel.",
  "El ramillete de campanillas de invierno que el ángel aprieta en la mano.",
  "Los pies descalzos del ángel, que cuelgan sobre el camino.",
  "La mirada del muchacho de la derecha, vuelta hacia el espectador.",
  "La orilla baja de la bahía de Töölönlahti, en el horizonte.",
]
themes = ["ángel", "infancia", "simbolismo", "curación", "misterio"]
anecdote = """
Simberg ni siquiera dio título a su cuadro: en el catálogo de la exposición de 1903, solo escribió un guion en lugar del nombre. El título de El ángel herido se impuso después."""
salle = 5
mur = "nord"
