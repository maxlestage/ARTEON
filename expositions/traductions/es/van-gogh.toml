[[oeuvres]]
titre = "Los lirios"
annee = "1889"
image = "iris.jpg"
technique = "Óleo sobre lienzo, 74,3 × 94,3 cm"
collection = "J. Paul Getty Museum, Los Ángeles"
note = "Pintado en el jardín del asilo de Saint-Rémy, la primera semana: un único lirio blanco entre los azules."
description = """
La mirada se sumerge en un macizo de lirios en flor, visto de muy cerca, sin horizonte ni cielo. Las flores azul violáceo, de pétalos ondulados, se alzan sobre largas hojas verdes en forma de hoja de espada que se entrecruzan. Ocupan casi todo el ancho del lienzo, cada una con su forma propia, unas abiertas, otras todavía en capullo. Entre ellas se destaca un lirio blanco, único. En primer plano, la tierra es de un pardo rojizo; al fondo, la hierba del jardín y una mata de flores anaranjadas iluminan la composición. El encuadre corta las plantas en los bordes, como si el macizo se prolongara más allá del cuadro. El ojo circula de una flor a otra sin encontrar jamás un centro, como en un jardín que se recorre."""
evocation = """
Pintados en los primerísimos días de su internamiento voluntario, Los lirios dan testimonio de un impulso vital recobrado: la pintura es para Van Gogh un medio de mantener la enfermedad a distancia. El jardín cerrado del asilo se convierte en un mundo en sí mismo, exuberante y luminoso. Cada flor parece tener su personalidad, retorcerse, inclinarse o erguirse como un ser vivo. El lirio blanco aislado se ha interpretado a menudo como una figura de la soledad, incluso como un autorretrato simbólico del pintor entre los demás, pero esta no es más que una lectura entre otras. Lo que más llama la atención es la ausencia de angustia aparente: el lienzo celebra la primavera, el crecimiento y la belleza sencilla de las plantas."""
histoire = """
El 8 de mayo de 1889, tras varias crisis, Van Gogh ingresa voluntariamente en el asilo de Saint-Paul-de-Mausole, en Saint-Rémy-de-Provence. Se le autoriza a pintar en el jardín, y se lanza enseguida sobre los lirios en flor. Considera el lienzo un estudio, pero Theo lo envía al Salon des Indépendants de septiembre de 1889. En 1892, el crítico Octave Mirbeau, uno de los primeros defensores del pintor, lo compra por 300 francos. En noviembre de 1987 se vende en subasta en Nueva York por 53,9 millones de dólares al empresario australiano Alan Bond, un récord mundial en su momento. Incapaz de pagarlo por completo, este debe deshacerse de él, y el J. Paul Getty Museum de Los Ángeles lo adquiere en 1990."""
facture = """
Los lirios deben mucho a las estampas japonesas: contornos marcados, superficies planas de color, encuadre cercano y cortado, ausencia de perspectiva profunda. Van Gogh les asocia su pincelada propia, espesa y nerviosa, que sigue el movimiento de las hojas y los pétalos. Hace jugar los complementarios, el azul violáceo de las flores contra el anaranjado de las flores del fondo y el pardo rojizo de la tierra. Las investigaciones han mostrado que los lirios eran originalmente más violetas: el pigmento rojo mezclado con el azul se ha desvanecido con el tiempo."""
details = [
  "El único lirio blanco, aislado en medio de las flores azules.",
  "Las hojas en forma de hoja de espada, que se cruzan como espadas.",
  "La tierra pardo rojiza del primer plano.",
  "Las flores anaranjadas del fondo, contrapunto del azul de los lirios.",
  "Los contornos oscuros que rodean cada pétalo, a la japonesa.",
]
themes = ["flores", "jardín", "japonismo", "primavera", "asilo"]
anecdote = """
En 1987, el comprador de Los lirios solo pudo pujar gracias a un préstamo concedido en una mitad por Sotheby's, la propia casa de subastas. Revelada después, esta práctica provocó un escándalo y arrojó dudas sobre la escalada de precios de la época."""
