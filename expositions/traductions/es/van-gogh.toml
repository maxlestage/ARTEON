[[oeuvres]]
titre = "Los comedores de patatas"
annee = "1885"
image = "mangeurs-pommes-de-terre.jpg"
technique = "Óleo sobre lienzo, 82 × 114 cm"
collection = "Van Gogh Museum, Ámsterdam"
note = "Una familia campesina a la luz de una lámpara: la primera gran composición, pintada en tierras pardas."
description = """
Cinco campesinos están reunidos en torno a una mesa, en una estancia baja de techo con vigas. Una lámpara de petróleo colgada ilumina sus rostros huesudos y sus manos nudosas. A la izquierda, un joven se vuelve hacia una muchacha con cofia blanca; a la derecha, un hombre de más edad tiende su taza a una anciana que sirve el café. En primer plano, una niña vista de espaldas se recorta como una silueta oscura contra la luz. Todos toman de una única fuente de patatas. En la pared se distinguen un reloj y una pequeña imagen piadosa; al fondo, una ventana y algunos utensilios. El encuadre cerrado encierra a la familia en un espacio casi asfixiante, donde cada uno queda atrapado en el mismo círculo de luz amarilla, mientras los rincones de la estancia se pierden en la sombra."""
evocation = """
Van Gogh quería mostrar, como explica a su hermano, que esa gente que come sus patatas bajo la lámpara ha cavado la tierra con las mismas manos que mete en la fuente: una comida honradamente ganada con el trabajo manual. Lejos de las escenas rurales idealizadas, se niega a embellecer a sus modelos y les da rasgos rudos, casi caricaturescos, que los acercan a los tubérculos que recogen. Se ha leído en ella una forma de comunión silenciosa, casi religiosa, en torno a una comida compartida. La obra expresa también la ambición del joven pintor, hijo de pastor en ruptura con su entorno: convertirse en un pintor de campesinos, en la estela de Jean-François Millet, a quien admiraba profundamente. Es una profesión de fe social tanto como artística, a contracorriente de la pintura clara y amable que triunfaba entonces en París."""
histoire = """
Van Gogh pinta el lienzo en abril de 1885 en Nuenen, pueblo del Brabante donde su padre era pastor, pocas semanas después de la muerte repentina de este. Se prepara desde el invierno multiplicando los estudios de cabezas y de manos, y la familia De Groot, unos vecinos, le sirve de modelo. Realiza también un boceto pintado, más pequeño, y una litografía que envía a sus amigos. El pintor Anthon van Rappard, amigo suyo desde hacía años, critica tan duramente esa litografía que su amistad no lo sobrevive. Van Gogh envía el gran lienzo a Theo, a París, pero no encuentra comprador. Conservado en la familia, pertenece hoy a la Fundación Vincent van Gogh y es una de las obras más destacadas del Van Gogh Museum de Ámsterdam."""
facture = """
La paleta es deliberadamente sombría: pardos, verdes oliva y grises, que Van Gogh compara con el color de una patata polvorienta sin pelar. La luz de la lámpara, única fuente de iluminación, crea fuertes contrastes y esculpe los rostros en planos abruptos, en la tradición del claroscuro de los maestros holandeses como Rembrandt. La pincelada es gruesa y marcada, sobre todo en las manos y las cabezas. Se percibe también la herencia de la Escuela de La Haya, y en particular de Jozef Israëls, pintor de interiores campesinos al que Van Gogh admiraba."""
details = [
  "La lámpara de petróleo colgada, cuya luz cae sobre la fuente.",
  "La niña de espaldas, silueta oscura bordeada de luz.",
  "Las manos de articulaciones prominentes, que sostienen tenedores y tazas.",
  "El reloj y la pequeña imagen piadosa colgados de la pared.",
  "La anciana que sirve el café, a la derecha.",
]
themes = ["campesinos", "comida", "familia", "trabajo", "claroscuro"]
anecdote = """
Dos años más tarde, cuando ya pinta con los colores claros de París, Van Gogh escribe todavía a su hermana Willemien que ese cuadro de los campesinos comiendo patatas sigue siendo, a su juicio, lo mejor que ha hecho."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.7

[[oeuvres]]
titre = "Autorretrato"
annee = "1887"
image = "autoportrait-1887.jpg"
technique = "Óleo sobre cartón, 41 × 32,5 cm"
collection = "Art Institute of Chicago"
note = "En París, Van Gogh descubre el puntillismo: el rostro se construye con pequeñas pinceladas de colores puros."
description = """
Van Gogh se representa de busto, de tres cuartos, con la mirada dirigida al espectador. Lleva una chaqueta oscura; su barba y su cabello pelirrojos, cortos, enmarcan un rostro de pómulos salientes y frente despejada. Nada sitúa la escena: el fondo es un campo de pequeñas pinceladas de color que vibran en torno a la cabeza. El propio rostro está hecho de trazos yuxtapuestos, verdes, rojos, amarillos y anaranjados, que se funden a distancia en una carnación viva. La expresión es grave, algo tensa, y ningún accesorio distrae la atención. El pequeño formato, pintado sobre cartón, refuerza la impresión de un estudio íntimo, hecho con rapidez ante el espejo, donde el pintor se observa tanto como experimenta una nueva manera de pintar."""
evocation = """
Este rostro escrutado sin complacencia habla ante todo de una búsqueda de identidad: en París, Van Gogh se busca como hombre y como pintor, y el autorretrato se convierte en su laboratorio. La mirada intensa, casi inquieta, se ha relacionado a menudo con su temperamento nervioso. Pero la obra habla sobre todo de modernidad: al adoptar la pincelada dividida de los neoimpresionistas, el antiguo pintor de los campesinos del Brabante muestra que quiere unirse a la vanguardia parisina. No se trata para él de aplicar una teoría, sino de hacer vibrar el color para dar presencia. Se ha visto en ella el paso decisivo entre el realismo sombrío de sus comienzos y la pintura expresiva que le dará fama en Arlés: en pocos meses, el pintor de las tierras pardas se ha convertido en colorista."""
histoire = """
Van Gogh llega a París en marzo de 1886 y se instala en casa de su hermano Theo, primero en la rue Laval y después en el número 54 de la rue Lepic, en Montmartre. Frecuenta durante unos meses el taller del pintor Fernand Cormon, donde conoce a Henri de Toulouse-Lautrec y a Émile Bernard, y descubre en las galerías y en las exposiciones a los impresionistas y a los neoimpresionistas. En la primavera de 1887 pinta junto a Paul Signac en Asnières y ensaya la pincelada dividida de Georges Seurat: este retrato data de ese período. En dos años realiza en París más de una veintena de autorretratos, a menudo sobre soportes baratos como este cartón. El cuadro ingresó en 1954 en el Art Institute of Chicago, con cargo a la colección Joseph Winterbotham, un fondo destinado a la compra de arte europeo."""
facture = """
Van Gogh toma de Seurat y Signac el principio de la pincelada dividida, pero sin su rigor científico: sus puntos se alargan en guiones, cambian de dirección y siguen los volúmenes del rostro. Yuxtapone colores complementarios, el anaranjado de la barba contra los azules y los verdes, rojos contra verdes en la carne, para que se exalten mutuamente. La luz ya no procede de una fuente precisa, como en Nuenen: nace del propio color, y la mezcla se produce en el ojo del espectador."""
details = [
  "Los guiones verdes y rojos que modelan la mejilla y la frente.",
  "La barba pelirroja, aplicada en pinceladas anaranjadas contra un fondo más frío.",
  "El fondo animado de pequeñas pinceladas apretadas, sin decorado alguno.",
  "Los ojos claros, de mirada fija y algo inquieta.",
]
themes = ["autorretrato", "parís", "puntillismo", "colores complementarios", "identidad"]
anecdote = """
En marzo de 1886, Van Gogh se presenta en París sin avisar y hace llegar a Theo una nota garabateada a lápiz: lo espera en el Louvre, en el Salon carré. Los dos hermanos vivirán juntos durante dos años."""
salle = 2
mur = "nord"
place = 1
largeur = 0.9

[[oeuvres]]
titre = "Autorretrato con sombrero de fieltro gris"
annee = "1887"
image = "autoportrait-feutre.jpg"
technique = "Óleo sobre lienzo, 44 × 37,5 cm"
collection = "Van Gogh Museum, Ámsterdam"
note = "Las pinceladas irradian en torno a la cabeza como una aureola: el estilo de su última etapa ya está aquí."
description = """
El pintor se muestra de busto, casi de frente, con un sombrero de fieltro gris y una chaqueta azul. Su rostro de mejillas hundidas, de barba y cabello pelirrojos, está ligeramente vuelto hacia un lado, pero los ojos claros se fijan en el espectador con intensidad. A su alrededor, el fondo está hecho solo de pinceladas cortas y paralelas, azules y anaranjadas, que irradian desde la cabeza como una corona. La propia chaqueta está estriada de trazos de color, y el sombrero, lejos de ser uniformemente gris, se carga de reflejos azulados. Ningún objeto, ningún decorado: todo se concentra en el rostro, que parece surgir del fondo vibrante como una aparición, con una presencia casi escultórica."""
evocation = """
Al cabo de dos años en París, Van Gogh se presenta aquí como un hombre de ciudad, tocado con el fieltro de los burgueses en lugar del sombrero de paja que luce en otros autorretratos. La mirada penetrante y las mejillas hundidas delatan también el cansancio: más tarde dirá que dejó París enfermo y agotado, anhelando la calma y el sol del Mediodía. El resplandor de las pinceladas en torno a la cabeza se ha comparado con una aureola, como si el pintor reivindicara una vocación casi religiosa por el arte, él que había querido ser pastor. La obra afirma sobre todo que ha encontrado su camino: un lenguaje personal en el que el color y la dirección de la pincelada expresan tanto como los rasgos del rostro."""
histoire = """
El cuadro se pinta durante el invierno de 1887-1888, poco antes de la partida de Van Gogh hacia Arlés, en febrero de 1888. Es uno de los más logrados de los autorretratos parisinos, una síntesis de todo lo que ha aprendido en contacto con los impresionistas, con Seurat y con Signac. Como la mayor parte de sus lienzos, queda en poder de Theo, que muere en enero de 1891, solo seis meses después de su hermano. Su viuda, Johanna van Gogh-Bonger, conserva gran parte de la obra y consagra su vida a darla a conocer, organizando exposiciones y ventas. Su hijo, Vincent Willem, confía en 1962 la colección a la Fundación Vincent van Gogh, que la deposita en el Van Gogh Museum, inaugurado en Ámsterdam en 1973."""
facture = """
Van Gogh lleva aquí la pincelada dividida hacia un sistema personal: trazos cortos y gruesos, todos orientados, que siguen la forma de la cabeza en el rostro e irradian a su alrededor en el fondo. Organiza el lienzo en parejas de complementarios: azul y anaranjado en el fondo, rojo anaranjado de la barba contra los verdes de la carnación. La materia, aplicada en pasta, capta la luz. Este ritmo de las pinceladas, a la vez estructurado y nervioso, anuncia los cielos en movimiento de Saint-Rémy y se aleja ya del neoimpresionismo ortodoxo."""
details = [
  "Los trazos azules y anaranjados del fondo, que irradian en torno a la cabeza.",
  "Los reflejos de color sobre el fieltro gris del sombrero.",
  "Las pinceladas verdes y rojas que modelan las mejillas hundidas.",
  "Los ojos claros, casi transparentes, que fijan al espectador.",
]
themes = ["autorretrato", "parís", "colores complementarios", "modernidad", "identidad"]
anecdote = """
Como se pinta ante un espejo, Van Gogh se ve invertido: sus autorretratos no lo muestran tal como lo veían los demás. Cuenta a su hermana que compró un buen espejo expresamente, por falta de dinero para pagar modelos."""
salle = 2
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Los girasoles"
annee = "1888"
image = "tournesols.jpg"
technique = "Óleo sobre lienzo, 92,1 × 73 cm"
collection = "National Gallery, Londres"
note = "Pintados para decorar la habitación de Gauguin en Arlés: una sinfonía de amarillos sobre fondo amarillo."
description = """
Un jarrón de barro cocido colocado sobre una mesa contiene una quincena de girasoles. Nada más: la mesa, de un amarillo más intenso, y la pared, de un amarillo pálido, se unen en una simple línea horizontal. Las flores están en todas las etapas de su vida: unas plenamente abiertas, con los pétalos en corona; otras todavía frescas; otras marchitas, reducidas a su corazón erizado de semillas, con los pétalos cayendo como lenguas de fuego. Los tallos se cruzan, las cabezas se vuelven en todas direcciones, unas vistas de frente, otras de perfil o desde abajo. El ramo, amplio y tupido, desborda el jarrón por todos lados. El pintor firmó «Vincent» directamente sobre la panza del jarrón, como se firma un objeto decorado."""
evocation = """
Para Van Gogh, el girasol es casi un emblema personal: escribe a Theo que otros pintores se asocian con la peonía o la malvarrosa, pero que a él le corresponde un poco el girasol. El amarillo representa para él la luz del Mediodía, el calor y una forma de esperanza. Pintados para acoger a Gauguin, estos ramos hablan de amistad y del sueño de un taller compartido, el «taller del Mediodía». La presencia, una junto a otra, de flores abiertas y marchitas se ha leído también como una meditación sobre el ciclo de la vida, del esplendor a la muerte, en la tradición de las vanitas holandesas. Cabe ver, por último, una apuesta de pintor: lograr un cuadro deslumbrante con un solo color, declinado en todos sus tonos."""
histoire = """
En agosto de 1888, en Arlés, Van Gogh espera la llegada de Paul Gauguin, a quien confía convencer de fundar con él una comunidad de artistas. Para decorar la Casa Amarilla, pinta en pocos días cuatro lienzos de girasoles, trabajando deprisa porque las flores se marchitan. Este es el cuarto. Gauguin llega el 23 de octubre y admira esos ramos. En enero de 1889, tras la crisis de diciembre, Vincent pinta varias repeticiones, entre ellas las del Van Gogh Museum de Ámsterdam y el Philadelphia Museum of Art. El lienzo de Londres, conservado en la familia, fue adquirido en 1924 por la National Gallery gracias al fondo creado por el industrial Samuel Courtauld para la compra de pintura francesa moderna."""
facture = """
Van Gogh afronta un desafío: pintar amarillo sobre amarillo. Emplea los amarillos de cromo, entonces recientes, del limón al anaranjado, y los hace vibrar con pequeños acentos de verde, pardo y azul. La materia es muy espesa: los corazones de las flores están modelados en relieve, casi esculpidos con el pincel, mientras que el fondo se trabaja de manera más uniforme. Contornos oscuros rodean por momentos las formas, como en las estampas japonesas y en los lienzos cloisonnistas de su amigo Émile Bernard. La composición frontal, sin profundidad, hace de este ramo una imagen casi decorativa."""
details = [
  "La firma «Vincent», pintada en la panza del jarrón.",
  "Los corazones de las flores marchitas, en relieve, erizados de semillas.",
  "La línea horizontal que separa la mesa de la pared, único punto de referencia del espacio.",
  "Los pétalos que se retuercen como llamas en las flores más maduras.",
]
themes = ["flores", "naturaleza muerta", "amarillo", "amistad", "ciclo de la vida"]
anecdote = """
A finales de 1888, Gauguin pinta a Van Gogh pintando girasoles. Según el relato que hizo mucho después, Vincent habría exclamado ante el retrato: «Soy yo, pero yo vuelto loco.»"""
salle = 3
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "La noche estrellada sobre el Ródano"
annee = "1888"
image = "nuit-etoilee-rhone.jpg"
technique = "Óleo sobre lienzo, 72,5 × 92 cm"
collection = "Museo de Orsay, París"
note = "Las farolas de gas de Arlés se reflejan en el río bajo la Osa Mayor."
description = """
Ha caído la noche sobre el Ródano, en Arlés. En un vasto cielo azul verdoso, siete estrellas dibujan la Osa Mayor, cada una rodeada de un halo claro. A lo lejos, la línea de los muelles y las casas está puntuada por las farolas de gas, cuyos reflejos amarillos y anaranjados se alargan sobre el agua en largas columnas temblorosas. El río, de un azul profundo, ocupa todo el ancho del lienzo. En la orilla del primer plano hay barcas amarradas, y una pareja pasea del brazo junto al agua. El cielo llena la mitad superior del cuadro, y sus estrellas responden a las luces de la ciudad, como si la tierra y el cielo se devolvieran su resplandor. El conjunto respira la calma de una tarde de finales de verano."""
evocation = """
Van Gogh soñaba desde hacía tiempo con pintar un cielo estrellado. La noche no es aquí ni amenazadora ni lúgubre: está llena de colores, y el alumbrado moderno de gas dialoga con la luz lejana de las estrellas. La pareja del primer plano da a la escena una ternura apacible. Las estrellas tenían para él un alcance casi espiritual: unas semanas antes escribía a Theo que su visión siempre le hacía soñar, y se preguntaba por qué los puntos luminosos del cielo habrían de ser menos accesibles que los puntos negros de las ciudades en un mapa, añadiendo que, así como se toma el tren para ir a Tarascón, se toma la muerte para ir a una estrella. Con frecuencia se ha leído este cuadro como un momento de sosiego, antes de la tormenta de los meses siguientes."""
histoire = """
Van Gogh pinta el lienzo a finales de septiembre de 1888 en el muelle del Ródano, a pocos minutos de la Casa Amarilla donde acaba de instalarse. Trabaja en el lugar, de noche, y describe a Theo en una carta los colores de su cuadro. Es uno de los pocos lienzos expuestos en vida: en septiembre de 1889, Theo lo envía al Salon des Indépendants de París, junto con Los lirios. Tras la muerte del pintor, la obra permanece en manos privadas hasta 1975, año en que el señor y la señora Robert Kahn-Sriber la donan al Estado francés. Hoy se expone en el Museo de Orsay, que conserva también la pequeña versión de La habitación, pintada en Saint-Rémy."""
facture = """
Van Gogh compone con una gama de azules, azul de Prusia, ultramar, cobalto, realzada con verdes y violetas, y reserva los amarillos y los anaranjados para las luces. Las estrellas se aplican en gruesas pinceladas radiantes, rodeadas de halos. Los reflejos en el agua se logran con largos trazos verticales, quebrados, que sugieren el movimiento del río. Pinta sin negro: la oscuridad nace de los azules profundos. La pincelada, regular, todavía bastante serena, y la composición horizontal dan a la escena una placidez que ya no tendrán los cielos de Saint-Rémy."""
details = [
  "Las siete estrellas de la Osa Mayor, cada una con su halo.",
  "Los reflejos de las farolas de gas, alargados en columnas amarillas sobre el agua.",
  "La pareja que camina junto al río, en primer plano.",
  "Las barcas amarradas en la orilla.",
]
themes = ["noche", "estrellas", "río", "luz", "arlés"]
anecdote = """
Se cuenta que Van Gogh pintaba de noche con velas fijadas en su sombrero. Ninguna fuente fiable lo confirma: en sus cartas, solo explica que trabaja en el lugar, de noche, a la luz de la ciudad."""
salle = 3
mur = "nord"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "El dormitorio en Arlés"
annee = "1888"
image = "chambre-arles.jpg"
technique = "Óleo sobre lienzo, 72,4 × 91,3 cm"
collection = "Van Gogh Museum, Ámsterdam"
note = "Su habitación de la Casa Amarilla, en colores planos y francos: «un reposo absoluto», escribe a Gauguin."
description = """
La habitación es estrecha y está ligeramente torcida: la pared del fondo, abierta por una ventana de postigos verdes entornados, parece huir en diagonal. Una gran cama de madera amarilla ocupa la derecha, con dos almohadas verde pálido y una manta roja. Dos sillas de paja, también amarillas, se miran de frente, y un pequeño tocador sostiene una palangana, una jarra y unos frascos. En la pared de la izquierda cuelga un espejo. En la pared de la derecha, sobre la cama, hay colgados un paisaje y dos retratos, y de unas perchas penden prendas de ropa. El suelo de baldosas rojas huye hacia el fondo en una perspectiva acentuada. No hay personajes: solo los objetos, sencillos y escasos, cuentan la vida de su ocupante."""
evocation = """
Van Gogh quería que la sola visión del cuadro descansara la cabeza, o más bien la imaginación, como escribe a Theo: es el color, y no el tema, lo que debe sugerir el reposo y el sueño. La habitación es también el corazón de su sueño arlesiano: acaba de arreglar la Casa Amarilla, la primera casa verdaderamente suya, que espera compartir con otros pintores. Los objetos por pares, dos sillas, dos almohadas, dos retratos, se han interpretado como signo de un deseo de compañía, en vísperas de la llegada de Gauguin. Sin embargo, el espacio algo desvencijado y la perspectiva vertiginosa dejan aflorar una inquietud. Esta paradoja entre la aspiración a la paz y la tensión sorda constituye la fuerza de este retrato de un lugar."""
histoire = """
Van Gogh pinta su habitación a mediados de octubre de 1888, en la Casa Amarilla, en la place Lamartine de Arlés. El cuadro forma parte de la decoración que prepara para recibir a Gauguin, y envía un boceto a Theo. A comienzos de 1889, mientras está hospitalizado, una crecida del Ródano vuelve húmeda la casa y el lienzo resulta dañado. En Saint-Rémy, en septiembre de 1889, pinta dos repeticiones: una del mismo formato, hoy en el Art Institute of Chicago, y otra más pequeña, destinada a su madre y a su hermana, conservada en el Museo de Orsay. La versión original, conservada en la familia, se encuentra en el Van Gogh Museum. La Casa Amarilla, por su parte, fue destruida por un bombardeo en 1944."""
facture = """
Van Gogh detalla él mismo sus colores en una carta a Gauguin: paredes lila pálido, suelo de un rojo quebrado, sillas y cama amarillo de cromo, almohadas y sábana verde limón muy pálido, manta rojo sangre, tocador anaranjado, palangana azul, ventana verde. Suprime las sombras y pinta con tintas planas, rodeadas de contornos, a la manera de las estampas japonesas, aunque conserva una pincelada visible y espesa. Los análisis han mostrado que las paredes, hoy azules, eran originalmente violetas: el pigmento rojo, poco estable, se ha desvanecido."""
details = [
  "Los postigos verdes de la ventana, entornados hacia el exterior.",
  "Las dos almohadas, una junto a otra, sobre la gran cama amarilla.",
  "El pequeño espejo de marco negro, colgado de la pared de la izquierda.",
  "Sobre la cama, los retratos de sus amigos Eugène Boch y Paul-Eugène Milliet.",
  "Las baldosas rojas del suelo, pintadas con trazos rápidos que aceleran la perspectiva.",
]
themes = ["interior", "reposo", "hogar", "japonismo", "soledad"]
anecdote = """
En 2016, con motivo de una exposición que reunía las tres versiones del cuadro, el Art Institute of Chicago hizo reconstruir la habitación a tamaño natural y la ofreció en alquiler en Airbnb, por unos pocos dólares la noche."""
