[[oeuvres]]
titre = "El café de noche"
annee = "1888"
image = "cafe-de-nuit.jpg"
technique = "Óleo sobre lienzo, 72,4 × 92,1 cm"
collection = "Yale University Art Gallery, New Haven"
note = "Rojo sangre y verde amargo: un café donde «uno puede arruinarse, volverse loco, cometer crímenes»."
description = """
Se descubre la sala de un café casi desierto, poco después de medianoche, como indica el reloj colgado al fondo. En el centro, una mesa de billar verde proyecta sobre el suelo una larga sombra. Cuatro lámparas colgadas, rodeadas de halos amarillos y anaranjados, iluminan la estancia con crudeza. A lo largo de las paredes rojas, algunos clientes solitarios están desplomados en las mesas, adormilados o con la cabeza entre los brazos. Junto al billar, de pie, un hombre de traje claro, el patrón, mira hacia nosotros. Al fondo, un mostrador cargado de botellas y una puerta velada por una cortina, que da a una estancia más clara. El suelo amarillo parece volcarse hacia el espectador, y unas sillas vacías aguardan en primer plano."""
evocation = """
Van Gogh quiso hacer de este café un lugar de desolación: escribe a Theo que ha intentado expresar con el rojo y el verde las terribles pasiones humanas. Los colores chocan entre sí en lugar de armonizarse, y la luz cruda de las lámparas, sin calor, acentúa el malestar. Los bebedores aislados y los noctámbulos, que acuden allí por no poder pagar un alojamiento, componen una imagen de soledad urbana. El patrón, de pie e inmóvil, parece reinar sobre ese espacio como un inquietante guardián. Ya no es el realismo social de Nuenen, sino una pintura en la que el color transmite directamente la emoción, lo que hará de este lienzo una referencia para los expresionistas del siglo XX."""
histoire = """
El Café de la Gare, en la place Lamartine, estaba regentado por Joseph y Marie Ginoux; Van Gogh se aloja allí varios meses antes de mudarse al lado, a la Casa Amarilla. A principios de septiembre de 1888, pasa tres noches pintando la sala, durmiendo de día. Escribe a Theo que es uno de los lienzos más feos que ha hecho, pero que lo considera equivalente, aunque distinto, a Los comedores de patatas. En noviembre, Gauguin pinta a su vez el mismo café, con Marie Ginoux en primer plano. El lienzo es adquirido por el gran coleccionista moscovita Iván Morózov, nacionalizado tras la revolución y luego vendido por el gobierno soviético en 1933. El estadounidense Stephen C. Clark lo lega en 1961 a la Universidad de Yale."""
facture = """
Van Gogh juega con las disonancias: rojo sangre de las paredes, verde del techo y del billar, amarillo del suelo. Opone los complementarios no para apaciguarlos, sino para hacerlos gritar. Los halos de las lámparas, hechos de círculos concéntricos de pinceladas amarillas y anaranjadas, anuncian los astros arremolinados de Saint-Rémy. La perspectiva picada, muy acentuada, estira la estancia y da la sensación de que el suelo se desvanece. Los contornos oscuros y las superficies planas deben mucho a las estampas japonesas, pero la materia, espesa, sigue muy presente."""
details = [
  "El reloj del fondo, que marca poco más de medianoche.",
  "La sombra larga y oscura que proyecta el billar sobre el suelo amarillo.",
  "Los halos concéntricos en torno a las cuatro lámparas.",
  "El patrón de blanco, de pie junto al billar, que mira hacia nosotros.",
  "La cortina de la puerta del fondo, que da a una estancia más clara.",
]
themes = ["noche", "café", "soledad", "color", "malestar"]
anecdote = """
A comienzos del siglo XXI, un descendiente de Iván Morózov reclamó el cuadro ante la justicia estadounidense, al considerar que había sido expoliado por el Estado soviético. Los tribunales dieron la razón a la Universidad de Yale, que lo conserva todavía."""
