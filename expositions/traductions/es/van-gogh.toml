[[oeuvres]]
titre = "Campo de trigo con cuervos"
annee = "1890"
image = "champ-ble-corbeaux.jpg"
technique = "Óleo sobre lienzo, 50,5 × 103 cm"
collection = "Van Gogh Museum, Ámsterdam"
note = "Auvers-sur-Oise, julio de 1890: un cielo de tormenta, tres caminos y una bandada de cuervos. Muere unas semanas más tarde."
description = """
Un campo de trigo maduro se extiende por todo el ancho de este lienzo muy alargado, bajo un cielo de tormenta azul oscuro, casi negro en las alturas, donde flotan dos nubes más claras. Tres caminos lo atraviesan: el del centro, pardo rojizo bordeado de hierba verde, avanza hacia el fondo y se interrumpe bruscamente en medio de los trigos; los otros dos parten hacia la izquierda y hacia la derecha y salen del cuadro. Sobre el campo, una nube de cuervos negros, pintados con un simple trazo, levanta el vuelo o se lanza en picado hacia las espigas. El trigo amarillo dorado, agitado, parece doblegarse bajo el viento. Ninguna figura humana, ninguna casa: nada más que la tierra, el cielo y los pájaros."""
evocation = """
Por haber sido pintado poco antes de su muerte, este cuadro se ha leído durante mucho tiempo como un testamento. El cielo amenazador, los cuervos y el camino que se interrumpe se han interpretado como presagios funestos, quizá más de lo debido. Van Gogh escribe entonces a Theo y Johanna que ha pintado inmensas extensiones de trigo bajo cielos turbulentos, y que no le costó expresar en ellas la tristeza y la soledad extrema. Pero añade que espera mostrar también lo que ve de sano y de fortificante en el campo. La obra se sostiene en este frágil equilibrio entre angustia y vitalidad, entre la amenaza del cielo y la plenitud de los trigos maduros."""
histoire = """
El 20 de mayo de 1890, Van Gogh deja Saint-Rémy para ir a Auvers-sur-Oise, al norte de París, donde lo atiende el doctor Paul Gachet, médico y aficionado al arte. Se aloja en la posada Ravoux y pinta a un ritmo desenfrenado: más de setenta cuadros en poco más de dos meses. A principios de julio, de regreso de una tensa visita a Theo en París, pinta este campo bajo la tormenta. El 27 de julio se hiere con un disparo de revólver, en circunstancias nunca del todo aclaradas, y muere dos días después en la posada, con Theo a su cabecera. El cuadro, conservado en la familia, pertenece a la Fundación Vincent van Gogh."""
facture = """
Van Gogh adopta en Auvers un formato de doble cuadrado, muy alargado, que utiliza para una serie de paisajes panorámicos. La pintura se aplica con rapidez, en pinceladas espesas y anchas, a menudo sobre el color todavía fresco. Los complementarios se enfrentan: el amarillo de los trigos contra el azul del cielo, el rojo del camino contra el verde de la hierba. Los cuervos se reducen a signos, simples uves negras trazadas de un gesto. En lugar de conducir la mirada hacia un punto de fuga, los caminos se abren hacia el espectador, lo que vuelve inestable el espacio."""
