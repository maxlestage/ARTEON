[[oeuvres]]
titre = "Terraza de café por la noche"
annee = "1888"
image = "terrasse-cafe.jpg"
technique = "Óleo sobre lienzo, 80,7 × 65,3 cm"
collection = "Museo Kröller-Müller, Otterlo"
note = "Una noche sin negro: el amarillo de la terraza contra el azul profundo del cielo estrellado."
description = """
Una terraza de café, iluminada por un gran farol colgado bajo el toldo amarillo, ocupa la izquierda del lienzo. Los clientes están sentados en torno a pequeñas mesas redondas, mientras un camarero con delantal blanco circula entre ellas. La luz dorada se extiende sobre la pared, el toldo y los adoquines de la plaza, que adquieren tonos anaranjados, rosados y violetas. A la derecha, una calle se adentra entre fachadas oscuras de ventanas iluminadas; unos transeúntes caminan hacia el fondo, donde se adivina un carruaje. Sobre los tejados, una franja de cielo azul profundo está sembrada de estrellas, pintadas como grandes flores claras. La mirada se desliza así desde la animada terraza hasta el cielo, siguiendo la calle que se hunde en la noche."""
evocation = """
Van Gogh escribe a Theo que a menudo le parece que la noche es aún más ricamente colorida que el día: este cuadro lo demuestra. Opone dos mundos, el calor artificial y acogedor de la terraza iluminada y la inmensidad serena del cielo estrellado. Se ha visto en él una imagen de la vida moderna, con sus cafés y su nuevo alumbrado, tal como la describía la literatura de su tiempo: el propio Van Gogh evoca el comienzo de Bel-Ami, de Maupassant, donde aparece un café parisino por la noche. Las estrellas, que aparecen aquí por primera vez en su obra, anuncian un motivo que llegará a ser esencial para él, cargado de una forma de espiritualidad y de esperanza."""
histoire = """
Van Gogh pinta el lienzo a mediados de septiembre de 1888 en la place du Forum, en el corazón de Arlés, instalando su caballete al aire libre, de noche. Lo describe en una carta a su hermana Willemien, insistiendo en el placer de pintar en el lugar, de noche. Es el primer lienzo en que representa un cielo estrellado, pocos días antes de La noche estrellada sobre el Ródano. La obra fue adquirida más tarde por Helene Kröller-Müller, rica coleccionista neerlandesa que reunió, a comienzos del siglo XX, cerca de noventa cuadros de Van Gogh y fue una de las primeras en calibrar su importancia. En 1938 abre su museo en el corazón del parque nacional de Hoge Veluwe, en Otterlo, donde el lienzo sigue expuesto."""
facture = """
El cuadro se apoya en el contraste de los complementarios: el amarillo y el anaranjado de la terraza contra el azul y el violeta del cielo. Van Gogh construye la oscuridad con azules profundos, verdes sombríos y violetas. Rodea las formas con contornos oscuros, a la manera de las estampas japonesas. La perspectiva se hunde hacia el fondo de la calle y guía la mirada de la terraza al cielo. Los adoquines se resuelven con pequeñas pinceladas redondeadas y coloreadas, como un mosaico, y las estrellas se aplican en pasta espesa sobre el azul."""
details = [
  "El camarero con delantal blanco, entre las mesas.",
  "El gran farol colgado de la pared, fuente de toda la luz amarilla.",
  "Los adoquines de la plaza, en pequeñas pinceladas rosadas, anaranjadas y violetas.",
  "Las estrellas semejantes a flores, en la franja de cielo sobre la calle.",
  "El carruaje que se distingue al fondo de la calle.",
]
themes = ["noche", "café", "estrellas", "ciudad", "luz"]
anecdote = """
El café sigue existiendo en la place du Forum, en Arlés. Ha tomado el nombre de Café Van Gogh y luce ahora una fachada amarilla que recuerda al cuadro, atrayendo cada año a visitantes de todo el mundo."""
