[[oeuvres]]
titre = "La noche estrellada"
annee = "1889"
image = "nuit-etoilee.jpg"
technique = "Óleo sobre lienzo, 73,7 × 92,1 cm"
collection = "Museum of Modern Art, Nueva York"
note = "La vista desde su ventana en el asilo, antes del alba: un cielo que se arremolina sobre el pueblo dormido."
description = """
Bajo un cielo inmenso, un pequeño pueblo duerme al pie de unas colinas azules. El cielo ocupa la mayor parte del lienzo: grandes volutas de luz se enroscan en él como olas, y una doble espiral gira en su centro. Once estrellas llamean, rodeadas de halos amarillos y blancos, y arriba a la derecha brilla una luna creciente anaranjada, cercada de luz. Junto al ciprés, una estrella más grande y más clara que las demás: la estrella de la mañana. En primer plano, a la izquierda, un ciprés oscuro se lanza como una llama hasta lo alto del cuadro. En el pueblo, unas casas de ventanas iluminadas rodean una iglesia de campanario afilado, y las colinas ondulan retomando el movimiento del cielo."""
evocation = """
La noche estrellada se ha convertido en la imagen misma de Van Gogh, y en ella se leen a menudo los tormentos de su enfermedad. Pero el pintor expresa también una antigua fascinación por las estrellas, que asociaba con el infinito y el más allá. El ciprés, árbol de los cementerios en Provenza, une la tierra con el cielo: se ha visto en él un símbolo de muerte tanto como un impulso hacia la eternidad. La iglesia, que se parece más a las del Brabante, se ha interpretado como un recuerdo del país natal. El contraste entre el pueblo apacible y el cielo en ebullición sugiere una naturaleza atravesada por energías que el hombre dormido no percibe. En 1971, la canción Vincent, de Don McLean, que comienza con «Starry, starry night», aumentó aún más la fama del cuadro."""
histoire = """
Van Gogh pinta el lienzo hacia mediados de junio de 1889 en el asilo de Saint-Rémy. Desde la ventana enrejada de su habitación, orientada al este, ve un campo de trigo cercado por muros y, más allá, unas colinas. No tiene derecho a pintar en su habitación: trabaja de día en un taller de la planta baja, apoyándose en sus estudios y en su memoria, y añade el pueblo y el ciprés. Escribe a Theo que vio el campo antes de la salida del sol, con la estrella de la mañana, muy grande. Poco satisfecho, confía más tarde a Émile Bernard que se dejó llevar a hacer estrellas demasiado grandes. Tras varios propietarios, entre ellos el poeta Julien Leclercq, el lienzo ingresa en 1941 en el Museum of Modern Art de Nueva York, por canje de obras legadas por Lillie P. Bliss."""
facture = """
Todo es movimiento: Van Gogh pinta con pinceladas espesas, curvas y rítmicas, que siguen las formas y arrastran el ojo en un torbellino continuo. El cielo se construye con azules profundos, contra los que estallan los amarillos de los astros. El ciprés, casi negro, se modela con largas pinceladas onduladas y verticales que se oponen a las horizontales del pueblo y a las espirales del cielo. El pueblo, dibujado de manera más rectilínea, aporta un contrapunto sereno. El relieve de la materia, muy marcado, capta la luz y da al cielo una presencia casi física."""
details = [
  "La luna creciente anaranjada, arriba a la derecha, envuelta en un halo.",
  "La gran doble espiral que gira en el centro del cielo.",
  "La estrella de la mañana, más grande y más clara, junto al ciprés.",
  "El campanario afilado de la iglesia, que se alza sobre los tejados.",
  "Las ventanas amarillas de las casas, únicas huellas de vida humana.",
]
themes = ["noche", "cielo", "estrellas", "ciprés", "pueblo"]
anecdote = """
Unos astrónomos han comprobado que, en la primavera de 1889, el planeta Venus brillaba efectivamente al alba en el cielo de Saint-Rémy: la estrella de la mañana que Van Gogh dice haber visto desde su ventana es muy probablemente ella."""
