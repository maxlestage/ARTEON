[[artistes]]
nom = "Vincent van Gogh"
vie = "Groot-Zundert (Países Bajos), 30 de marzo de 1853 – Auvers-sur-Oise, 29 de julio de 1890"
biographie = """
Hijo de un pastor protestante, Vincent van Gogh crece en el Brabante neerlandés. A los dieciséis años entra en Goupil & Cie, marchantes de arte, y trabaja en La Haya, Londres y París, antes de ser despedido en 1876. Se vuelca entonces hacia la religión, fracasa en su intento de ser pastor y predica entre los mineros del Borinage, en Bélgica. Es allí, en 1880, a los veintisiete años, donde decide hacerse artista. Su hermano menor Theo, marchante de arte en París, lo apoya económicamente hasta el final y recibe de él centenares de cartas, testimonio insustituible de su pensamiento. Tras años de aprendizaje en Bruselas, La Haya y Nuenen, donde pinta a los campesinos, pasa por Amberes y se reúne con Theo en París en 1886: allí descubre el impresionismo, el neoimpresionismo y las estampas japonesas, y su paleta se aclara. En febrero de 1888 parte hacia Arlés, donde sueña con fundar un taller del Mediodía. Gauguin se une a él allí, pero la convivencia termina pronto: en diciembre de 1888, durante una crisis, Van Gogh se mutila la oreja izquierda. Sujeto a crisis cuya naturaleza sigue siendo objeto de debate, ingresa en 1889 en el asilo de Saint-Rémy-de-Provence, donde pinta sin descanso, y se instala en mayo de 1890 en Auvers-sur-Oise. El 27 de julio, herido de bala, muere dos días después. Vendió muy pocos lienzos en vida, aunque el crítico Albert Aurier empezaba a reparar en él. Gracias a Johanna van Gogh-Bonger, viuda de Theo, que publica sus cartas y hace exponer sus obras, su fama se hace mundial a comienzos del siglo XX."""
style = """
La pintura de Van Gogh se reconoce a primera vista: una pincelada espesa y visible, en trazos cortos, en rayados o en torbellinos, que da a cada superficie, cielo, campo o rostro, un movimiento propio. Emplea el color de manera libre y expresiva, jugando con los contrastes de complementarios, no para copiar la naturaleza sino para traducir emociones. De las estampas japonesas retiene los contornos marcados, las superficies planas y los encuadres audaces. Su obra, unos 850 cuadros y cerca de 1300 dibujos realizados en diez años, abrió el camino al fauvismo de Matisse, Derain y Vlaminck, y al expresionismo alemán, que le deben esa libertad del color y del gesto."""
