[[oeuvres]]
titre = "Almendro en flor"
annee = "1890"
image = "amandier.jpg"
technique = "Óleo sobre lienzo, 73,3 × 92,4 cm"
collection = "Van Gogh Museum, Ámsterdam"
note = "Un regalo por el nacimiento de su sobrino: ramas en flor sobre un cielo azul, a la japonesa."
description = """
Unas ramas de almendro en flor se recortan sobre un cielo azul turquesa, sin suelo ni horizonte. Vistas desde abajo, como si uno estuviera tumbado bajo el árbol, se extienden por toda la superficie del lienzo y se ramifican en ramitas cada vez más finas. Las flores, blancas teñidas de rosa, están representadas en diferentes etapas: algunas bien abiertas, mostrando su corazón, otras todavía en capullos rosados. Las ramas, de un pardo verdoso, están rodeadas de contornos oscuros y se retuercen con soltura. El encuadre corta las ramitas en los bordes, de modo que la escena parece un fragmento de un árbol más vasto. Nada viene a turbar este diálogo entre el azul del cielo y la fragilidad de las flores."""
evocation = """
El almendro es el primer árbol en florecer, a finales del invierno: simboliza la renovación y la vida que vuelve a empezar. Al elegirlo para saludar el nacimiento de su sobrino, Van Gogh ofrece al recién nacido un emblema de esperanza y de crecimiento. El cuadro, pensado para colgarse en el dormitorio de los padres, habla también del profundo afecto que lo une a Theo y a su esposa Johanna. Pintado en un período de relativa calma, justo antes de una nueva crisis, adquiere el valor de una promesa frágil. La serenidad de la imagen, su cielo luminoso y su elegancia decorativa dan testimonio de un sosiego que rara vez se encuentra en tal grado en su obra de Saint-Rémy."""
histoire = """
El 31 de enero de 1890, Johanna, la esposa de Theo, da a luz a un niño, al que sus padres llaman Vincent Willem, como su tío. Este, conmovido, se pone enseguida a pintar este cuadro en el asilo de Saint-Rémy, en febrero de 1890; anuncia a su madre que lo destina a su dormitorio. Poco después, sufre una grave crisis que le impide trabajar durante casi dos meses. Theo y Jo acaban colgando el lienzo sobre el piano de su salón, en París. Conservado en la familia tras la muerte de los dos hermanos, pertenece a la Fundación Vincent van Gogh y se ha convertido en una de las obras más queridas del Van Gogh Museum."""
facture = """
La influencia de las estampas japonesas alcanza aquí su cima: contornos nítidos, superficies planas de color, motivo visto de cerca y cortado por el marco, fondo liso sin perspectiva. Van Gogh, que coleccionaba esos grabados desde Amberes y París, se apropia de su lenguaje. El azul del cielo, aplicado en pinceladas apretadas, sirve de estuche al blanco de las flores, a su vez matizado de rosa y de verde. Las flores se pintan en pasta espesa, lo que les da relieve, mientras que las ramas se trazan con un trazo flexible. La gama reducida crea una armonía luminosa y serena."""
details = [
  "Los capullos rosados, junto a las flores ya abiertas.",
  "Los contornos oscuros que rodean las ramas, como en una estampa.",
  "El relieve de las flores blancas, pintadas en pasta espesa.",
  "Las ramitas cortadas por los bordes del cuadro, a la japonesa.",
]
themes = ["flores", "nacimiento", "primavera", "japonismo", "familia"]
anecdote = """
El sobrino para quien se pintó este almendro, Vincent Willem van Gogh, convertido en ingeniero, creó la fundación que dio origen al Van Gogh Museum. Fallecido en 1978, vio abrirse en 1973 el museo que expone hoy su regalo de nacimiento."""
