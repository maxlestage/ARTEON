titre = "Van Gogh, el color en movimiento"
artiste = "Vincent van Gogh"
dates = "1853–1890"
accroche = "Exposición virtual · Vincent van Gogh"
introduction = """
De Los comedores de patatas de Nuenen al último campo de trigo de Auvers, recorra en 3D cinco años de pintura que cambiaron el color para siempre. Cada lienzo ha sido reconstruido pincelada a pincelada, en relieve, en tres salas dispuestas en torno a un atrio alto y luminoso."""
vitrine = "nuit-etoilee.jpg"

[musee]
nom = "Museo Van Gogh"
ville = "Ámsterdam, Países Bajos"
architecte = "Gerrit Rietveld"
construction = "inaugurado en 1973"
presentation = """
A la muerte de Vincent en 1890, sus lienzos pasan a su hermano Theo y, después, a la viuda de este, Johanna van Gogh-Bonger, que consagra su vida a darlos a conocer. Su hijo, Vincent Willem, cede la colección a una fundación, y el Estado neerlandés construye para ella un museo en el Museumplein de Ámsterdam. Diseñado por Gerrit Rietveld, figura del movimiento De Stijl, y terminado tras su muerte, ocurrida en 1964, el edificio abre sus puertas en 1973: un volumen sencillo de hormigón y cristal, organizado en torno a un alto espacio central bañado por la luz cenital, desde el que una escalera da acceso a las plantas. En 1999 se le añade un ala ovalada obra de Kisho Kurokawa, destinada a las exposiciones temporales. El museo conserva el mayor conjunto del mundo de obras de Van Gogh: más de doscientos cuadros, unos quinientos dibujos y la mayor parte de sus cartas, desde Los comedores de patatas hasta Los girasoles."""
ici = """
El edificio de ARTEON retoma la idea maestra de Rietveld. El atrio, un cuadrado de 10 metros de lado y 9 metros de altura, de muros casi blancos, al que se entra por el sur, distribuye todas las salas. La visita sigue la vida del pintor: al oeste, la Sala I · Nuenen y París, de muros beige; se regresa al atrio para llegar, al norte, a la Sala II · Arlés, la más grande, de un amarillo paja pálido; por último, al este, la Sala III · Saint-Rémy y Auvers, de muros gris azulado. Con sus 5 metros de altura, las tres salas resultan íntimas tras el impulso del atrio."""

