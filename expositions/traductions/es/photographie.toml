[[oeuvres]]
titre = "Avenue des Gobelins"
artiste = "Eugène Atget"
annee = "1925"
image = "avenue-des-gobelins.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Avenue_des_Gobelins_MET_DP105534.jpg"
technique = "Copia a la gelatina de plata a partir de un negativo sobre vidrio, 21,9 × 17,3 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "El escaparate de un sastre, donde maniquíes sonrientes y pantalones etiquetados se mezclan con los reflejos de la calle: el París más corriente vuelto extraño."
description = """
Tras un gran cristal, se exponen a la venta prendas de hombre. En primer plano, pantalones a rayas, doblados sobre soportes, llevan grandes etiquetas de precio; en el centro, una chaqueta de tweed sin cabeza tiende manos de cera. Más arriba, bustos de maniquíes de rostros empolvados, con bigote, tocados con canotiers o sombreros blandos, miran en todas direcciones. Pero sobre el cristal se superponen los reflejos de la calle: los árboles de la avenida, las fachadas de los edificios de enfrente, la acera. Maniquíes y fachadas se confunden, hasta el punto de que ya no se sabe qué está dentro y qué fuera. A la izquierda, un montante del escaparate está adornado con un motivo de rombos."""
evocation = """
Atget se presentaba como un simple proveedor de «documentos para artistas». Sin embargo, sus escaparates, con sus maniquíes congelados en sonrisas de cera y sus reflejos fantasmales, fascinaron a los surrealistas, que veían en ellos surgir la extrañeza de lo cotidiano. La imagen superpone dos mundos: la mercancía, con sus precios y sus poses convencionales, y la ciudad real, que la atraviesa en transparencia. Se lee también en ella el fin de una época: Atget, a casi setenta años, fotografía un París de pequeños comercios que la modernidad empieza a borrar. El filósofo Walter Benjamin escribió que fotografiaba las calles como se fotografía el lugar de un crimen."""
histoire = """
Antiguo marino y comediante, Atget se establece como fotógrafo en París hacia 1890 y vende sus imágenes a pintores y decoradores, y después a las bibliotecas y museos de la ciudad. En la década de 1920 fotografía cada vez más las fachadas y escaparates de las tiendas, entre ellas las de la avenue des Gobelins. En 1925, la joven estadounidense Berenice Abbott, entonces asistente de Man Ray, lo visita y le compra copias. Tras la muerte de Atget en 1927, adquiere gran parte de su fondo, lo da a conocer mediante libros y exposiciones, y lo cede en 1968 al Museum of Modern Art de Nueva York. Esta copia ingresó en el Metropolitan Museum en 1987."""
facture = """
Atget trabaja hasta el final con una pesada cámara de madera de fuelle, sobre trípode, y placas de vidrio de 18 × 24 cm, un material ya pasado de moda en la década de 1920. Sus exposiciones, bastante largas, exigen calles tranquilas, que fotografía a menudo a primera hora de la mañana. Ante un escaparate, no busca eliminar los reflejos como haría un fotógrafo de catálogo: los deja invadir la imagen y compone con ellos. El encuadre frontal, ceñido al cristal, aplana el espacio y pone en el mismo plano el maniquí, la etiqueta y el árbol de la avenida."""
details = [
  "El maniquí de la izquierda, de sonrisa congelada, vuelto hacia sus vecinos.",
  "Las etiquetas de precio: 42 F, 35, 49 F, 32…",
  "El reflejo de los árboles de la avenida en la parte alta del cristal.",
  "Las manos de cera que asoman de las mangas de la chaqueta central.",
  "El montante decorado con rombos, a la izquierda.",
]
themes = ["parís", "escaparate", "reflejo", "maniquí", "surrealismo"]
anecdote = """
En 1926, Man Ray publica en La Révolution surréaliste una fotografía de Atget que muestra a unos parisinos observando un eclipse. Atget habría pedido que no se pusiera su nombre: no eran, decía, más que documentos que hacía."""
