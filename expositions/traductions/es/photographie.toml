[[oeuvres]]
titre = "El entrepuente (The Steerage)"
artiste = "Alfred Stieglitz"
annee = "1907"
image = "entrepont.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:The_Steerage_MET_DP232922.jpg"
technique = "Fotograbado tirado en 1913 o antes, 32,2 × 25,8 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Los pasajeros más pobres de un transatlántico, vistos desde arriba: una escena captada al vuelo, a la vez documento y composición de formas, y una de las primeras fotografías modernas."
description = """
La imagen está cortada en dos por una pasarela blanca que la atraviesa en oblicuo. Arriba, en la cubierta superior, una multitud de hombres con gorra y sombrero se apretuja contra una barandilla de cadenas; en medio, un joven tocado con un canotier claro mira hacia abajo. Debajo, en la cubierta inferior, mujeres con chal y pañuelo, niños, un hombre con los tirantes cruzados a la espalda, ropa que se seca, una gran marmita. A la izquierda, un mástil cilíndrico; a la derecha, una escalera de metal sube hacia la cubierta superior. Los dos grupos, muy próximos, no se unen: la pasarela, vacía, los separa."""
evocation = """
Stieglitz contó que había visto allí un conjunto de formas ligadas entre sí: el círculo del sombrero de paja, la oblicua del mástil, la diagonal de la escalera, el blanco de la pasarela y, bajo esas formas, el sentimiento que tenía de la vida. El entrepuente es así a la vez un documento sobre los migrantes de su tiempo y una composición casi abstracta, recortada en planos como un lienzo cubista. Picasso, a quien se la mostraron, habría reconocido en este fotógrafo a alguien que trabajaba con el mismo espíritu que él. Se la ha tomado a menudo por una imagen de inmigrantes que llegan a América; el barco, en realidad, partía hacia Europa."""
histoire = """
En junio de 1907, Stieglitz parte hacia Europa con su mujer y su hija a bordo del Kaiser Wilhelm II, uno de los mayores transatlánticos de la época. Viajando en primera clase, descubre desde la cubierta la parte reservada a los pasajeros más pobres, corre a buscar su cámara y toma una sola imagen. Sin embargo, deja el negativo de lado durante cuatro años, ocupado en particular con el autocromo, el nuevo procedimiento en color de los hermanos Lumière. No lo publica hasta octubre de 1911, en su revista Camera Work, lo expone en 1913 en su galería 291 y le dedica en 1915 un número entero de la revista 291. Esta copia forma parte de la colección Stieglitz ingresada en el Metropolitan Museum en 1933."""
facture = """
Stieglitz se sirve de una cámara de mano de placas de vidrio, una Auto-Graflex, que le permite captar la escena sin trípode; solo tenía, según dijo, una única placa lista. La imagen se presenta aquí en fotograbado, una impresión con tinta a partir de una plancha de cobre grabada fotográficamente, procedimiento que empleaba para Camera Work y para sus grandes tiradas, y cuyos negros profundos le gustaban. La composición se apoya en diagonales contrariadas, pasarela, mástil y escalera, y en un encuadre que corta a los personajes en los bordes, sin centro ni punto de fuga."""
details = [
  "El canotier redondo y claro del joven acodado arriba, en el centro.",
  "Las cadenas de la barandilla, que dibujan festones regulares.",
  "Los tirantes cruzados en la espalda de un hombre, abajo a la derecha.",
  "La ropa tendida a la izquierda, bajo la pasarela.",
  "La escalera de metal que sube en diagonal, a la derecha.",
]
themes = ["migración", "transatlántico", "multitud", "modernidad", "geometría"]
anecdote = """
Sin laboratorio a bordo, Stieglitz no pudo revelar su placa hasta París, casi una semana después, en el cuarto oscuro de un fotógrafo que permaneció anónimo y que le habría dicho que era un honor recibirlo."""
