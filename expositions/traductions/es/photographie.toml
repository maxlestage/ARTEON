[[oeuvres]]
titre = "La gran ola, Sète"
artiste = "Gustave Le Gray"
annee = "1857"
image = "grande-vague.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:-The_Great_Wave,_Sète-_MET_DT1167.jpg"
technique = "Copia sobre papel albuminado a partir de negativo sobre vidrio al colodión, 33,7 × 41,4 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una ola rompe ante el rompeolas del puerto de Sète, bajo un cielo de tormenta atravesado por el sol: la marina fotográfica que deslumbró al Segundo Imperio."
description = """
El mar ocupa toda la mitad inferior de la imagen. En primer plano, rocas negras y relucientes sobre las que la espuma se rompe en estelas blancas. Más lejos, una larga ola horizontal rueda hacia la orilla, cresta blanca sobre agua oscura. A la izquierda, la masa rectangular y negra del rompeolas corta el horizonte; un chorro de espuma brota en su extremo. Arriba, el cielo es inmenso: nubes pesadas, casi negras a la derecha, desgarradas y luminosas en el centro, donde el sol oculto hace irradiar una luz plateada que se refleja en el mar. Abajo a la derecha se lee la firma del fotógrafo."""
evocation = """
Le Gray rivaliza aquí con los pintores de marinas. La fotografía, tenida por fría y documental, se convierte en un espectáculo romántico: el poder del mar, la luz dramática, el contraste entre la ola efímera y la masa inmóvil del espigón. Se ha visto en ella una meditación sobre el tiempo, el instante fugaz de la ola bajo un cielo que parece eterno. Estas imágenes impresionaron a sus contemporáneos porque parecían lograr lo imposible: congelar el agua en movimiento conservando un cielo de nubes detalladas, cuando las fotografías de la época mostraban por lo común cielos blancos y vacíos. Devolvieron a la fotografía la ambición de los grandes cuadros."""
histoire = """
Pintor formado en el taller de Paul Delaroche, Le Gray se convierte en uno de los grandes fotógrafos del Segundo Imperio. Hacia 1856-1857 realiza una serie de marinas en Normandía y luego en el Mediterráneo, en Sète, donde fotografía en 1857 el puerto y su rompeolas bajo distintos cielos. Estas grandes copias, expuestas y vendidas en París y en Londres, obtienen un éxito considerable. Pero su estudio parisino, lujoso y mal gestionado, se hunde en 1860; Le Gray abandona Francia y termina su vida en Egipto. Sus marinas, largo tiempo olvidadas por el gran público, fueron redescubiertas a finales del siglo XX. Esta copia fue donada al Metropolitan Museum en 1976."""
facture = """
Le Gray, inventor de un negativo sobre papel encerado, utiliza aquí el colodión sobre vidrio, más sensible y más preciso. La dificultad de las marinas es conocida: el cielo, mucho más luminoso que el mar, ya está sobreexpuesto cuando el mar apenas empieza a aparecer. Para varias de sus vistas, Le Gray copia juntos dos negativos, uno para el cielo y otro para el mar, empalmando cuidadosamente el horizonte. La exposición, lo bastante corta para captar la ola, deja la espuma de las rocas en estelas sedosas. El gran formato y el tono cálido de la albúmina dan a la imagen la presencia de un cuadro."""
details = [
  "El chorro de espuma que brota en el extremo del rompeolas, a la izquierda.",
  "La cresta de la gran ola, nítida de un borde al otro de la imagen.",
  "Las rocas del primer plano, relucientes de agua.",
  "El sol oculto, cuya luz atraviesa las nubes en el centro.",
  "La firma de Le Gray, abajo a la derecha.",
]
themes = ["mar", "cielo", "marina", "luz", "puerto"]
anecdote = """
En octubre de 1999, en París, durante la venta en Sotheby's de la colección de André y Marie-Thérèse Jammes, una copia de La gran ola, Sète se adjudica por 5,5 millones de francos: un récord mundial, entonces, para una fotografía vendida en subasta."""
salle = 2
mur = "nord"
place = 1
