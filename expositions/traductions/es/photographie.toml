[[oeuvres]]
titre = "Vista desde la ventana en Le Gras"
artiste = "Nicéphore Niépce"
annee = "1827"
image = "point-de-vue-du-gras.jpg"
cadre = "vitrine"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Untitled_(point_de_vue),_Niépce_1827_—_HRC_2020_(cropped).jpg"
technique = "Heliografía: betún de Judea sobre placa de estaño, 16,7 × 20,3 cm"
collection = "Harry Ransom Center, Universidad de Texas, Austin"
note = "La fotografía conservada más antigua: la vista que tenía Niépce desde una ventana de su casa de Borgoña, fijada tras una exposición de varios días."
description = """
Una placa de metal gris de esquinas redondeadas, rayada y picada, en la que hay que buscar la imagen. Poco a poco se dibuja una vista: la que Niépce tenía desde una ventana del piso superior de su casa de Le Gras, en Saint-Loup-de-Varennes, cerca de Chalon-sur-Saône. A la izquierda se alza un edificio alto y oscuro, que suele identificarse con el palomar; a la derecha, otra ala de la casa; en el centro, un tejado inclinado, la masa redonda de un árbol y, a lo lejos, una línea de horizonte pálida bajo un cielo claro. Nada se mueve, nadie aparece. Los muros de la izquierda y los de la derecha están iluminados a la vez, como si el sol hubiera golpeado la escena por ambos lados. En las esquinas, unos abultamientos del metal atrapan la luz."""
evocation = """
Este paisaje banal de tejados y muros es el primer fragmento del mundo fijado por la sola acción de la luz, sin la mano de un dibujante. Niépce llamaba a su procedimiento heliografía, la escritura del sol. La imagen tiene algo de fantasmal: apenas se sostiene sobre la placa, y su luz llegada de ambos lados recuerda que no registra un instante sino una duración, el paso del sol de este a oeste. Se ve en ella el punto de partida de una revolución de la mirada: por primera vez, una máquina conserva la huella exacta de un lugar. Habla también de la tenacidad de un inventor de provincias, que buscaba desde 1816 fijar la imagen de la cámara oscura, y de la modestia de sus comienzos: una vista de su propia casa, la más sencilla que pueda haber."""
histoire = """
Según su correspondencia, Niépce realiza la imagen en el verano de 1827. En otoño viaja a Inglaterra y se la muestra al botánico Francis Bauer, que lo anima a presentar su invento a la Royal Society; pero Niépce se niega a desvelar el secreto y la sociedad no da curso a la propuesta. Deja la placa a Bauer. Cuando Daguerre y Talbot anuncian sus procedimientos en 1839, Bauer la hace exponer en la Royal Society para recordar la anterioridad de Niépce. Pasa después de mano en mano y cae en el olvido tras 1898. En 1952, los historiadores Helmut y Alison Gernsheim la encuentran; su colección es adquirida en 1963 por la Universidad de Texas. La placa se expone en el vestíbulo del Harry Ransom Center de Austin, en una vitrina sellada que la protege del aire."""
facture = """
Niépce cubre una placa de estaño aleado con plomo con una fina capa de betún de Judea, un asfalto natural que se endurece con la luz. Colocada al fondo de una cámara oscura orientada hacia el patio, la placa permanece expuesta muchísimo tiempo: durante mucho se habló de ocho horas, pero el investigador Jean-Louis Marignier, que repitió el experimento, estima que hicieron falta varios días. Un baño de esencia de lavanda y petróleo blanco disuelve después el betún que quedó blando. Donde se ha endurecido, forma las luces; el metal desnudo da las sombras. La imagen es única, sin negativo, y solo se lee bien bajo una luz rasante."""
details = [
  "Los dos edificios oscuros que enmarcan la vista, a izquierda y derecha.",
  "El tejado inclinado, en el centro, que dibuja una amplia diagonal clara.",
  "La silueta redonda de un árbol, justo a la izquierda del centro.",
  "Los abultamientos brillantes en las esquinas de la placa, huellas de golpes ocurridos después de 1952.",
  "Los arañazos y picaduras del metal, que se mezclan con la imagen.",
]
themes = ["invención", "luz", "ventana", "campo", "heliografía"]
anecdote = """
Durante un cuarto de siglo, esta imagen solo se conoció por una copia muy retocada a mano por Helmut Gernsheim para hacerla legible. No fue hasta finales de la década de 1970 cuando la propia placa se reprodujo tal como es."""
salle = 1
mur = "ouest"
place = 1
largeur = 1.2

[[oeuvres]]
titre = "Boulevard du Temple"
artiste = "Louis Daguerre"
annee = "1838"
image = "boulevard-du-temple.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Boulevard_du_Temple_by_Daguerre.jpg"
technique = "Daguerrotipo, placa de cobre plateado, unos 13 × 16 cm"
collection = "Múnich (placa original muy deteriorada); imagen conocida por las copias de Beaumont Newhall"
note = "Un bulevar de París visto desde una ventana, una mañana de primavera: en la acera, un hombre que se hace lustrar las botas es sin duda el primer ser humano fotografiado."
description = """
Visto desde lo alto, un gran bulevar parisino bordeado de árboles se pierde en diagonal hacia el fondo, entre edificios de varios pisos erizados de chimeneas. En primer plano, a la derecha, un edificio claro y tejados; a la izquierda, las fachadas, los toldos de las tiendas y la acera arbolada. La calzada parece vacía: ni un coche, ni un caballo, ni un transeúnte. Sin embargo, abajo a la izquierda, en la esquina de la acera, se encuentra una pequeña silueta oscura: un hombre de pie, con una pierna apoyada en un soporte, ante otra forma inclinada, sin duda un limpiabotas. El detalle es ínfimo, pero el ojo, una vez que lo ha encontrado, ya no ve otra cosa. El cielo, blanco, está surcado de marcas dejadas en la placa."""
evocation = """
El bulevar del Temple era una de las calles más animadas de París, la de los teatros de melodrama, apodada el bulevar del Crimen. En la placa, toda esa multitud ha desaparecido: peatones y coches de punto se movían demasiado deprisa para dejar huella durante los minutos de exposición. Solo permanecen los que se quedaron inmóviles. La imagen expresa así la paradoja de la fotografía naciente: registra lo que está quieto y borra el movimiento, hasta convertir una ciudad viva en ciudad desierta. El hombrecillo de las botas, entrado por casualidad en la historia, se ha convertido en el símbolo del anónimo que la fotografía hace perdurable. Recuerda también que la imagen es un tiempo condensado, no un instante."""
histoire = """
Daguerre, pintor de decorados e inventor del Diorama, prosigue desde 1829 el procedimiento iniciado con Niépce. En la primavera de 1838 fotografía el bulevar desde una ventana vecina a su Diorama, a varias horas del día; se conservan la vista de la mañana y la del mediodía. En enero de 1839, Arago anuncia el invento a la Academia de Ciencias; en marzo, Daguerre muestra la placa al estadounidense Samuel Morse, que la describe en una carta publicada en Nueva York. En octubre se la ofrece, en un tríptico, al rey Luis I de Baviera. Conservadas en Múnich, las placas se deterioran, y una restauración intentada hacia 1970 las arruina. Se conocen gracias a las copias realizadas hacia 1937 por Beaumont Newhall, futuro director de la George Eastman House."""
facture = """
El daguerrotipo es una placa de cobre cubierta de plata pulida como un espejo, sensibilizada con vapores de yodo. Tras la exposición en la cámara oscura, la imagen todavía invisible se revela con vapores de mercurio y luego se fija en un baño salino. El resultado es una imagen única, de una finura extraordinaria, que solo puede reproducirse volviendo a fotografiarla y que hay que inclinar para verla en positivo. Como casi todos los daguerrotipos, está invertida de izquierda a derecha, como en un espejo. Aquí, la exposición duró varios minutos, bastantes para borrar todo lo que se movía."""
details = [
  "Abajo a la izquierda, el hombre inmóvil que se hace lustrar las botas, con una pierna levantada.",
  "La forma inclinada ante él, la del limpiabotas, más borrosa.",
  "Las innumerables chimeneas que erizan los tejados, a la derecha.",
  "Los árboles alineados del bulevar, que se pierden en la bruma hacia el fondo.",
  "Los arañazos y manchas de la placa, visibles en el cielo.",
]
themes = ["parís", "calle", "invención", "daguerrotipo", "tiempo de exposición"]
anecdote = """
El Estado francés compra el procedimiento en 1839 y lo declara libre para el mundo entero. Pero unos días antes, el agente de Daguerre lo había hecho patentar en Inglaterra: el Reino Unido fue así casi el único país donde hubo que pagar una licencia para hacer daguerrotipos."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "La puerta abierta"
artiste = "William Henry Fox Talbot"
annee = "1844"
image = "porte-ouverte.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:The_Open_Door_MET_DP148629.jpg"
technique = "Copia sobre papel salado a partir de un negativo sobre papel (calotipo), 14,3 × 19,4 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "Una escoba apoyada contra una puerta de la abadía de Lacock: la lámina VI de El lápiz de la naturaleza, el primer libro ilustrado con fotografías puesto a la venta."
description = """
Una puerta de madera claveteada se abre hacia el interior, en un muro de piedra, sobre una estancia oscura. Contra la hoja, una escoba de ramas está apoyada en oblicuo, con su largo mango atravesando la imagen. Arriba, colgado de la puerta, pende un arnés. A la derecha, sobre el pilar de piedra, un farol cuelga de un gancho; tallos de vid trepadora, sin hojas, se enroscan a ambos lados de la entrada. En la sombra, al fondo, se adivina una ventana de pequeños cristales que deja pasar un poco de luz. En el suelo, el sol dibuja nítidamente la sombra de la escoba. Toda la imagen se baña en un tono marrón dorado, propio del papel salado."""
evocation = """
Talbot acompaña la lámina con un breve texto en el que invoca el ejemplo de la pintura holandesa, que tomaba por temas escenas de la vida cotidiana, y observa que el ojo de un pintor se detiene a menudo allí donde la gente corriente no ve nada digno de mención. La puerta abierta es una de las primeras fotografías concebidas como obra de arte más que como documento. El umbral entre luz y oscuridad, el objeto humilde dejado allí, la ausencia de personajes dan a la escena una poesía silenciosa: en ella se ha leído una invitación a entrar, o la presencia discreta de los criados que acaban de abandonar el lugar. Anuncia una fotografía que sabe mirar las cosas sencillas."""
histoire = """
Sabio y propietario de la abadía de Lacock, en Wiltshire, Talbot busca desde 1834 fijar las imágenes sobre papel. En 1841 patenta el calotipo, que permite tirar tantos positivos como se quiera a partir de un mismo negativo. Para mostrar sus usos, publica de 1844 a 1846, en seis fascículos, The Pencil of Nature, «el lápiz de la naturaleza»: veinticuatro copias pegadas a mano, cada una acompañada de un texto. La puerta abierta figura en ella como lámina VI; existen varias variantes. El libro fue un fracaso comercial, pero marca una fecha en la historia del libro. Esta copia procede de la colección Gilman, adquirida por el Metropolitan Museum en 2005."""
facture = """
El calotipo se basa en una hoja de papel de carta impregnada de yoduro de plata. Tras una exposición de uno o dos minutos al sol, la imagen todavía invisible se revela con ácido gálico: es el descubrimiento decisivo de la imagen latente. Se obtiene un negativo sobre papel, que luego se copia por contacto sobre una hoja de papel salado. Las fibras del papel suavizan los contornos y dan a las imágenes un grano aterciopelado, menos preciso que el del daguerrotipo pero más próximo al dibujo. Talbot encuadra aquí como un pintor, con una gran diagonal y un fuerte contraste de sombra y luz."""
details = [
  "La escoba de ramitas, cuya sombra se proyecta nítidamente en el suelo.",
  "El farol de metal colgado del pilar de la derecha.",
  "El arnés colgado arriba a la izquierda, sobre la hoja de la puerta.",
  "La ventana de pequeños cristales que reluce al fondo de la estancia oscura.",
  "Las cabezas de clavos alineadas sobre la madera de la puerta.",
]
themes = ["calotipo", "cotidiano", "umbral", "luz", "naturaleza muerta"]
anecdote = """
En octubre de 1833, a orillas del lago de Como, Talbot se esfuerza por dibujar el paisaje con ayuda de una cámara lúcida. De este fracaso nace su idea: lograr que las imágenes de la naturaleza se impriman por sí solas, de forma duradera, sobre el papel."""
salle = 3
mur = "nord"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Sarah Bernhardt"
artiste = "Nadar"
annee = "hacia 1864"
image = "sarah-bernhardt.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Sarah_Bernhardt,_par_Nadar,_1864.jpg"
technique = "Copia a la gelatina de plata a partir de un negativo sobre vidrio, 21,1 × 16,2 cm"
collection = "J. Paul Getty Museum, Los Ángeles"
note = "La joven Sarah Bernhardt, de veinte años, envuelta en terciopelo en el estudio de Nadar: un retrato de una sobriedad plenamente moderna, antes de la gloria."
description = """
Una joven, acodada en un pedestal de madera, tiene el rostro vuelto de perfil hacia la izquierda, con la mirada perdida a lo lejos. Su cabellera oscura y rizada forma una masa espesa en torno al rostro; un pequeño pendiente brilla en el lóbulo. Va envuelta en un amplio manto de terciopelo negro, deslizado sobre un hombro que deja desnudo, y cuyos pesados pliegues, brillantes por momentos, ocupan toda la parte baja de la imagen. El fondo es un simple muro gris, sin decorado ni accesorios. La luz, procedente de la izquierda, modela suavemente la frente, la mejilla, el cuello y la clavícula, únicas zonas claras entre los negros y los grises."""
evocation = """
Nadar escribió que lo más difícil en fotografía no es la técnica sino captar el carácter de aquel a quien se fotografía. Aquí no hay columnas ni cortinas pintadas como en los fabricantes de tarjetas de visita: solo la joven, el terciopelo y la luz. El perfil grave, el hombro desnudo, la mirada ausente componen una imagen a la vez sensual y melancólica. Ya se adivina en ella a la trágica que iba a convertirse en la actriz más célebre de su tiempo. El retrato muestra también cómo la fotografía se emancipó pronto de la pintura de aparato para buscar, en un rostro, una presencia interior."""
histoire = """
Hacia 1864, Sarah Bernhardt tiene unos veinte años. Formada en el Conservatorio, debutó en la Comédie-Française en 1862, pero la dejó tras una disputa, y su carrera aún busca su rumbo. Posa en casa de Nadar, que trabaja desde 1860 en un vasto estudio acristalado en el 35 del bulevar des Capucines, por donde desfila todo el París de las artes y las letras. Durante la sesión se toman varias imágenes, con poses y ropajes distintos; hoy figuran entre las más célebres de Nadar. Los negativos del estudio pertenecen hoy al Estado francés; esta copia, realizada más tarde a partir del negativo, pertenece al J. Paul Getty Museum."""
facture = """
Nadar utiliza el negativo sobre vidrio al colodión húmedo, que da imágenes nítidas y ricas en medios tonos al precio de una exposición de varios segundos: el modelo debe apoyarse para permanecer inmóvil, lo que justifica aquí el pedestal. Trabaja con luz natural, en un estudio acristalado. El fondo neutro, el encuadre a media figura y el juego de las masas oscuras del terciopelo contra la piel clara concentran la atención en el rostro. Esta sobriedad, heredada de su oficio de caricaturista atento a las fisonomías, es su sello."""
details = [
  "El pendiente redondo que atrapa la luz.",
  "Los reflejos satinados sobre los pliegues del terciopelo.",
  "El hombro desnudo, única mancha clara en la masa oscura del manto.",
  "El pedestal de madera con paneles, abajo a la izquierda, donde se acoda.",
]
themes = ["retrato", "teatro", "mujer", "perfil", "terciopelo"]
anecdote = """
El 15 de abril de 1874, el antiguo estudio de Nadar, en el 35 del bulevar des Capucines, acoge la primera exposición de los pintores que pronto se llamarían impresionistas, entre ellos Monet, Renoir, Degas y Berthe Morisot. Nadar solo había alquilado el local."""
salle = 4
mur = "est"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Julia Jackson"
artiste = "Julia Margaret Cameron"
annee = "1867"
image = "julia-jackson.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Julia_Jackson_MET_DT1121.jpg"
technique = "Copia sobre papel albuminado a partir de un negativo sobre vidrio al colodión, 27,4 × 20,6 cm"
collection = "Metropolitan Museum of Art, Nueva York"
note = "La sobrina de la fotógrafa, futura madre de Virginia Woolf: un rostro medio en sombra, captado de muy cerca."
description = """
Un rostro de joven ocupa casi toda la imagen, visto de frente y de muy cerca. La luz viene de la derecha y solo ilumina una mitad del rostro: la frente, el ojo, la mejilla y el ala de la nariz salen de la sombra, mientras que el otro lado se funde con el negro. Los largos cabellos, sueltos, caen en ondas sobre los hombros y se pierden en el fondo oscuro. Los ojos, grandes, fijan al espectador sin sonreír. Sin decorado, sin joyas, sin ropa legible: solo el rostro, el cuello y una masa de sombra. La nitidez es escasa y los contornos flotan ligeramente, como si la imagen respirara."""
evocation = """
Julia Margaret Cameron buscaba menos el parecido que la belleza y la vida interior de sus modelos. Este retrato frontal, sin artificio, tiene una intensidad casi sagrada: el rostro emerge de la sombra como una aparición. Sus contemporáneos, acostumbrados a retratos nítidos y posados, le reprochaban este desenfoque y estos encuadres cerrados; hoy se ve en ellos una modernidad asombrosa, una manera de hacer sentir una presencia más que una superficie. Julia Jackson era célebre por su belleza. La imagen cobra un sentido más cuando se sabe que será la madre de Virginia Woolf y de la pintora Vanessa Bell: muerta en 1895, inspirará a su hija el personaje de Mrs Ramsay en Al faro."""
histoire = """
En 1867, Julia Jackson tiene veintiún años; es hija de Maria Pattle, una de las hermanas de la fotógrafa, que es también su madrina. Cameron, instalada desde 1860 en Freshwater, en la isla de Wight, la fotografía en varias ocasiones ese año, el de la boda de la joven con el abogado Herbert Duckworth. Viuda tres años después, se vuelve a casar en 1878 con el escritor Leslie Stephen. Cameron, que vendía sus copias a través de marchantes londinenses, hizo de su sobrina una de sus modelos predilectas. Esta copia fue adquirida por el Metropolitan Museum en 1996."""
facture = """
Cameron trabaja al colodión húmedo, sobre grandes placas de vidrio, con objetivos que imponen poses largas en su estudio, un antiguo gallinero acristalado. Contó que detenía el enfoque en cuanto la imagen le parecía bella, en lugar de llevarlo hasta la nitidez perfecta que exigían los demás fotógrafos. Acepta también los accidentes del copiado, manchas, goteos o arañazos. El encuadre muy cerrado, como un detalle de cuadro, y la iluminación lateral que sumerge la mitad del rostro en la sombra recuerdan a los pintores italianos que admiraba."""
details = [
  "La línea de sombra que parte el rostro, de la frente a la barbilla.",
  "El reflejo de luz en el ojo iluminado.",
  "Los mechones más claros que se destacan a la derecha.",
  "Las pequeñas manchas y rozaduras de la copia, dejadas tal cual.",
]
themes = ["retrato", "belleza", "sombra", "familia", "desenfoque"]
anecdote = """
En 1926, Virginia Woolf y el crítico Roger Fry publican en la Hogarth Press, la editorial de los Woolf, una recopilación de las fotografías de Cameron, Victorian Photographs of Famous Men and Fair Women: la sobrina nieta rinde homenaje a su tía abuela."""
salle = 4
mur = "nord"
place = 2
