[[oeuvres]]
titre = "El caballo en movimiento (Sallie Gardner al galope)"
artiste = "Eadweard Muybridge"
annee = "1878"
image = "cheval-en-mouvement.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Horse_in_Motion_high_res.jpg"
technique = "Tarjeta fotográfica que reúne doce vistas instantáneas, unos 14 × 22 cm"
collection = "Library of Congress, Washington"
note = "Doce imágenes tomadas en menos de un segundo muestran lo que el ojo no podía ver: un caballo al galope se despega por completo del suelo, con las patas recogidas bajo el cuerpo."
description = """
En una tarjeta impresa, doce pequeñas imágenes se disponen en tres filas de cuatro. Cada una muestra la misma yegua negra, Sallie Gardner, montada por un jinete, que galopa de izquierda a derecha ante un fondo blanco surcado de líneas verticales numeradas. De una imagen a otra, la posición de las patas cambia: replegadas bajo el vientre, lanzadas hacia delante, apoyadas una a una. En la segunda y la tercera imagen, ningún casco toca el suelo. La última casilla, abajo a la derecha, muestra al caballo detenido. Bajo las imágenes, un texto impreso en inglés da el nombre de la yegua, el de su propietario, Leland Stanford, la pista de Palo Alto y la fecha: 19 de junio de 1878."""
evocation = """
Durante siglos, los pintores representaron el caballo al galope con las patas extendidas hacia delante y hacia atrás, en la pose llamada galope volador. Las imágenes de Muybridge demuestran que es falso: el caballo sí se despega del suelo, pero cuando sus patas están recogidas bajo el cuerpo. La fotografía se convierte en un instrumento de conocimiento que corrige al ojo humano. Estas viñetas fascinaron tanto a los sabios como a los artistas; Degas, en particular, se inspiró en ellas para sus caballos. Sobre todo, al descomponer el movimiento en instantes sucesivos, abren el camino al cine: basta hacerlas desfilar rápidamente para ver galopar a la yegua."""
histoire = """
Leland Stanford, magnate de los ferrocarriles y antiguo gobernador de California, cría caballos de carreras en su finca de Palo Alto. Convencido de que los pintores se equivocan sobre los aires del caballo, recurre a comienzos de la década de 1870 a Eadweard Muybridge, conocido por sus vistas del valle de Yosemite. Los primeros ensayos resultan borrosos. En junio de 1878, Muybridge alinea doce cámaras a lo largo de la pista; unos hilos tendidos a través disparan los obturadores al paso del caballo. Las tarjetas, publicadas por una galería de San Francisco, se reproducen enseguida en la prensa de todo el mundo. Suele contarse que Stanford había apostado una fuerte suma sobre la cuestión; nada lo prueba."""
facture = """
Para obtener imágenes nítidas de un caballo lanzado a toda velocidad se necesitan tiempos de exposición muy breves, que Muybridge estima en menos de una dosmilésima de segundo. Instala a lo largo de la pista un fondo blanco marcado con líneas verticales espaciadas 27 pulgadas, y obturadores de resorte accionados eléctricamente. Los negativos al colodión, expuestos a pleno sol californiano, apenas dan más que siluetas. En esta edición de la tarjeta, los contornos han sido retocados y el fondo redibujado para hacer el conjunto más legible."""
details = [
  "La segunda y la tercera imagen, donde los cuatro cascos están en el aire, con las patas recogidas.",
  "Las líneas verticales numeradas del fondo, espaciadas unos 69 cm.",
  "La silueta del jinete, casi inmóvil de una imagen a otra.",
  "La última viñeta, donde la yegua está detenida.",
  "La mención de copyright de 1878, abajo a la izquierda.",
]
themes = ["movimiento", "caballo", "ciencia", "instante", "cine"]
anecdote = """
En 1874, Muybridge mató de un disparo de revólver al amante de su mujer. Juzgado al año siguiente, fue absuelto por un jurado que consideró justificado el asesinato, y partió después varios meses a fotografiar América Central."""
