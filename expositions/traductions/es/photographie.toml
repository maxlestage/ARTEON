[exposition]
ordre = 115
nom_court = "Fotografía"
mouvement = "Los inicios de la fotografía"
cadre = "noir"
couleur = "#6b4f35"
titre = "Los inicios de la fotografía, la huella de la luz"
artiste = "Niépce, Daguerre, Talbot, Nadar, Cameron, Le Gray, Muybridge, Atget, Stieglitz…"
dates = "1827–1911"
accroche = "Exposición virtual · George Eastman Museum, Rochester"
introduction = """
En menos de un siglo, la fotografía pasa del experimento de laboratorio al arte moderno: una placa de estaño expuesta durante días enteros, el primer transeúnte captado en un bulevar de París, el negativo sobre papel, el retrato, la marina, el movimiento descompuesto, la calle y, por último, el color. La visita reúne a diez pioneros, de Niépce a Prokudin-Gorski, en diez imágenes. El edificio se inspira en el George Eastman Museum de Rochester, el museo de fotografía más antiguo, instalado en la casa del fundador de Kodak: un vestíbulo, un jardín de invierno en el centro y tres salones alrededor."""
vitrine = "grande-vague.jpg"

[musee]
nom = "George Eastman Museum"
ville = "Rochester, Nueva York, Estados Unidos"
architecte = "J. Foster Warner"
construction = "1902–1905 (la casa); museo abierto en 1949"
presentation = """
George Eastman, el fundador de la sociedad Kodak, hace construir de 1902 a 1905, en el 900 de East Avenue, en Rochester, una vasta residencia neogeorgiana diseñada por el arquitecto J. Foster Warner: una cincuentena de estancias sobre una estructura de hormigón armado a prueba de incendios, rodeada de jardines, invernaderos y una pequeña granja. Tras la fachada clásica, la casa tiene una modernidad insólita para la época: generador eléctrico, teléfono interior, ascensor, aspiración central y un gran órgano, en torno al cual Eastman anima la vida musical de la ciudad hasta su muerte en 1932. Legada a la Universidad de Rochester, la propiedad es cedida en 1948 al museo fundado el año anterior, que abre el 9 de noviembre de 1949 en los antiguos salones. Es el museo más antiguo dedicado a la fotografía. Conserva más de 400 000 fotografías y negativos, miles de cámaras y una gran filmoteca, que se descubre en el Dryden Theatre. El historiador Beaumont Newhall lo dirigió de 1958 a 1971."""
ici = """
El edificio de ARTEON toma de la casa Eastman sus estancias de habitación de paredes claras y cálidas y su jardín de invierno, situado aquí en el corazón del plano. Se entra por el sur en «El vestíbulo», de techo bajo, donde aguarda la primera fotografía de la historia. Se abre al norte a «El jardín de invierno», una sala cuadrada de doce metros de lado y nueve de altura, de paredes verde pálido. Al oeste se abre la sala «Los inventores», al este «El retrato» y al norte «El siglo nuevo», donde la fotografía se vuelve moderna y pasa al color."""

