[[artistes]]
nom = "Nicéphore Niépce"
vie = "Chalon-sur-Saône, 7 de marzo de 1765 – Saint-Loup-de-Varennes, 5 de julio de 1833"
biographie = """
Joseph Niépce, que tomará el nombre de Nicéphore, nace en una familia acomodada de Chalon-sur-Saône. Tras estudiar con los oratorianos, sirve en el ejército de la Revolución, luego es administrador en Niza, antes de volver a Borgoña a comienzos del siglo XIX. Con su hermano Claude inventa el pireolóforo, un motor de combustión que hace avanzar un barco por el Saona y recibe una patente en 1807. A partir de 1816, en su propiedad de Le Gras, en Saint-Loup-de-Varennes, busca fijar la imagen de la cámara oscura. Hacia 1822 consigue copiar un grabado por la acción de la luz y en 1827 obtiene la vista de su ventana, la fotografía conservada más antigua. Sin apoyos en Inglaterra, se asocia en 1829 con Louis Daguerre, que trabaja en las mismas investigaciones. Muere repentinamente en 1833, arruinado por sus inventos, sin haber visto el éxito del procedimiento. En 1839, el Estado concede una pensión a su hijo Isidore, en reconocimiento de la parte de su padre en el invento."""
style = """
Niépce es un inventor más que un artista: busca un procedimiento, no un estilo. Sus imágenes, heliografías sobre metal, vidrio o piedra, son escasas, borrosas y casi ilegibles. Su importancia está en otra parte: demuestran que se puede fijar de forma duradera una imagen por la sola luz, idea de la que saldrán el daguerrotipo y, poco a poco, toda la fotografía."""

[[artistes]]
nom = "Louis Daguerre"
vie = "Cormeilles-en-Parisis, 18 de noviembre de 1787 – Bry-sur-Marne, 10 de julio de 1851"
biographie = """
Louis Jacques Mandé Daguerre empieza como aprendiz de dibujante de arquitectura, luego trabaja con el pintor de panoramas Pierre Prévost y se convierte en un decorador de teatro solicitado en París. En 1822 abre con Charles Bouton el Diorama, un espectáculo de grandes cuadros transparentes cuya iluminación cambia ante los ojos del público. Interesado por la cámara oscura, se entera de las investigaciones de Niépce y se asocia con él en 1829. Tras la muerte de su socio, descubre que una imagen invisible puede revelarse con vapores de mercurio y luego encuentra el modo de fijarla. El 7 de enero de 1839, el sabio François Arago anuncia el invento a la Academia de Ciencias; el Estado compra el procedimiento a cambio de pensiones para Daguerre y para el hijo de Niépce, y lo hace público en agosto. El daguerrotipo conquista el mundo en pocos meses. Ese mismo año, un incendio destruye el Diorama. Daguerre se retira a Bry-sur-Marne, donde aún pinta un trampantojo para la iglesia del pueblo."""
style = """
Daguerre llega a la fotografía por el espectáculo: conoce la luz y la ilusión del decorado. El daguerrotipo que perfecciona da imágenes únicas sobre metal, de una nitidez estupefaciente, pero imposibles de multiplicar. Impone durante veinte años el retrato fotográfico y hace de la fotografía un fenómeno popular, antes de ser suplantado por los procedimientos de negativo."""

[[artistes]]
nom = "William Henry Fox Talbot"
vie = "Melbury (Dorset), 11 de febrero de 1800 – Lacock (Wiltshire), 17 de septiembre de 1877"
biographie = """
Hijo de una familia de la aristocracia inglesa, Talbot crece en la abadía de Lacock, en Wiltshire. Alumno de Harrow y luego del Trinity College, en Cambridge, se hace matemático, miembro de la Royal Society y, de 1832 a 1835, diputado por Chippenham. En 1833, sus dificultades para dibujar en el lago de Como le dan la idea de fijar las imágenes sobre papel. Ya en 1834-1835 obtiene «dibujos fotogénicos» y un pequeño negativo de una ventana de Lacock. El anuncio del daguerrotipo, en enero de 1839, lo empuja a presentar sus trabajos en Londres. En 1841 patenta el calotipo, procedimiento de negativo sobre papel que permite tirar varias copias, y publica después The Pencil of Nature, el primer libro ilustrado con fotografías puesto a la venta. Sus patentes, que defiende ante los tribunales, frenan la difusión del procedimiento en Inglaterra hasta un juicio perdido en 1854. Espíritu universal, estudia también la luz, inventa un procedimiento de grabado fotográfico y participa en el desciframiento de las escrituras cuneiformes."""
style = """
Talbot inventó el principio que dominó la fotografía hasta la era digital: un negativo del que se tiran tantos positivos como se quiera. Sus calotipos, de grano suave y tonos marrones, tienen la poesía del dibujo. Fotografía su casa, sus objetos, la gente de Lacock, y presiente todos los usos del medio, del arte al documento."""

[[artistes]]
nom = "Nadar"
vie = "París, 6 de abril de 1820 – París, 20 de marzo de 1910"
biographie = """
Gaspard-Félix Tournachon empieza estudios de medicina en Lyon, que abandona a la muerte de su padre, en 1837, para mantener a su familia. Periodista y caricaturista de la bohemia parisina, firma Nadar y publica en 1854 el Panthéon Nadar, una inmensa litografía en la que figuran cientos de celebridades. Ese mismo año abre un estudio de fotografía en la rue Saint-Lazare y fotografía a Baudelaire, Delacroix, George Sand o Gérard de Nerval. En 1858 realiza desde un globo la primera fotografía aérea. En 1860 se instala en el 35 del bulevar des Capucines y después fotografía las catacumbas y las cloacas de París con luz artificial. En 1863 hace construir el Gigante, un globo gigantesco; Julio Verne se inspira en él para Michel Ardan, anagrama de Nadar. Durante el sitio de París, en 1870, organiza globos para transportar el correo. Su hijo Paul se hace cargo del estudio; Nadar muere a casi noventa años."""
style = """
Nadar hace del retrato fotográfico un arte. Fondo neutro, luz natural, encuadre a media figura, rechazo de los accesorios: todo está dispuesto para revelar el carácter del modelo, que su ojo de caricaturista sabe leer. Sus retratos de escritores y artistas componen la gran galería de su siglo. Curioso de todo, fue también un pionero de la fotografía aérea y de la iluminación artificial."""

[[artistes]]
nom = "Julia Margaret Cameron"
vie = "Calcuta, 11 de junio de 1815 – Kalutara (Ceilán), 26 de enero de 1879"
biographie = """
Julia Margaret Pattle nace en Calcuta en una familia vinculada a la Compañía de las Indias. Durante una estancia en el cabo de Buena Esperanza, traba amistad con el astrónomo John Herschel, que le dará a conocer la fotografía. Casada en 1838 con Charles Hay Cameron, jurista, mantiene un salón de renombre en Calcuta y luego se instala en Inglaterra. En 1860, la familia compra una casa en Freshwater, en la isla de Wight, vecina a la del poeta Alfred Tennyson. Hacia finales de 1863, a los cuarenta y ocho años, recibe de su hija y su yerno una cámara fotográfica. Transforma un gallinero en estudio y la carbonera en cuarto oscuro, y realiza en una docena de años unas novecientas fotografías: retratos de Tennyson, de Herschel, de Darwin, de Carlyle, escenas inspiradas en la Biblia y en la poesía. Ya en 1865, el South Kensington Museum, el actual Victoria and Albert Museum, adquiere sus obras. En 1875 parte con su marido a Ceilán, donde muere cuatro años después."""
style = """
Cameron rechaza la nitidez y la corrección del retrato comercial. Encuadra de muy cerca, acepta el desenfoque, las manchas y los accidentes, y busca en los rostros la belleza y la grandeza moral. Largo tiempo ridiculizada como aficionada, hoy se la considera una de las grandes retratistas de la historia de la fotografía."""

[[artistes]]
nom = "Gustave Le Gray"
vie = "Villiers-le-Bel, 30 de agosto de 1820 – El Cairo, 30 de julio de 1884"
biographie = """
Hijo único de un mercero, Gustave Le Gray es primero escribiente de notario, luego estudia pintura en el taller de Paul Delaroche, en París, y reside en Italia. Realiza sus primeros daguerrotipos hacia 1847, pero le interesa la fotografía sobre papel: perfecciona un negativo sobre papel encerado, que publica en 1851. Enseña fotografía a numerosos alumnos, entre ellos Charles Nègre, Henri Le Secq y Maxime Du Camp. En 1851 participa en la Misión Heliográfica, encargada de fotografiar los monumentos de Francia, y contribuye a fundar la Sociedad Heliográfica. En 1855 abre un lujoso estudio en París, se convierte en el fotógrafo de Napoleón III y realiza sus célebres marinas y sus vistas del bosque de Fontainebleau. Pero su empresa, mal gestionada, quiebra. En 1860 parte por el Mediterráneo con Alexandre Dumas, fotografía a Garibaldi y Palermo, y luego se establece en Egipto, donde enseña dibujo en El Cairo hasta su muerte."""
style = """
Le Gray es a la vez un técnico inventivo y un artista formado en la pintura. Busca en la fotografía los efectos de la gran pintura de paisaje: cielos dramáticos, contraluces, masas de sombra. Sus marinas y sus bosques dieron a la fotografía francesa del Segundo Imperio su ambición artística."""

[[artistes]]
nom = "Eadweard Muybridge"
vie = "Kingston upon Thames, 9 de abril de 1830 – Kingston upon Thames, 8 de mayo de 1904"
biographie = """
Nacido Edward James Muggeridge cerca de Londres, parte joven a Estados Unidos y se hace librero en San Francisco. Gravemente herido en un accidente de diligencia en 1860, regresa a Inglaterra, donde aprende fotografía. De vuelta en California, se da a conocer, con el nombre de Eadweard Muybridge, por grandes vistas del valle de Yosemite. A comienzos de la década de 1870, Leland Stanford le pide que fotografíe a sus caballos en movimiento. En 1874 mata al amante de su mujer; absuelto, viaja a América Central. En 1878, en Palo Alto, sus series de caballos al galope dan la vuelta al mundo. Inventa después el zoopraxiscopio, que proyecta sus imágenes en movimiento, y da conferencias en América y Europa. De 1884 a 1886, en la Universidad de Pensilvania, fotografía miles de movimientos de hombres, mujeres y animales, publicados en 1887 con el título Animal Locomotion. Termina su vida en su ciudad natal."""
style = """
Muybridge transformó la fotografía en instrumento de análisis: sus series descomponen el movimiento en instantes que el ojo no puede captar. Sus cuadrículas de imágenes, sobre fondo reticulado, alimentaron a los sabios, a los pintores, de Degas a Marcel Duchamp y Francis Bacon, y a los inventores del cine. Mostró también, con su zoopraxiscopio, que una sucesión de imágenes fijas proyectadas rápidamente recrea la ilusión del movimiento."""

[[artistes]]
nom = "Eugène Atget"
vie = "Libourne, 12 de febrero de 1857 – París, 4 de agosto de 1927"
biographie = """
Huérfano muy joven, Jean-Eugène-Auguste Atget es criado por sus abuelos en Burdeos y luego se enrola en la marina mercante. Se hace después comediante en una compañía ambulante, donde conoce a Valentine Delafosse Compagnon, su compañera hasta la muerte de esta, en 1926. Una enfermedad de la garganta lo obliga a dejar los escenarios; tras un intento en la pintura, se vuelca hacia la fotografía. Hacia 1890 se instala en París y cuelga en su puerta el rótulo «Documentos para artistas». Durante más de treinta años fotografía metódicamente el viejo París: calles, patios, escaleras, tiendas, oficios menudos, jardines de Versalles y de Saint-Cloud. El museo Carnavalet y la Biblioteca Histórica de la Ciudad de París le compran miles de imágenes. Al final de su vida, lo descubren Man Ray, su vecino de la rue Campagne-Première, y Berenice Abbott, que salvará y dará a conocer su obra tras su muerte."""
style = """
Atget fotografía sin efectismos, con cámara de estudio y luz natural, calles a menudo vacías. Su objetivo es documentar, y sus cerca de diez mil imágenes forman un inmenso inventario de París. Pero la precisión de su mirada, sus escaparates y sus reflejos sedujeron a los surrealistas, y después a los fotógrafos documentales estadounidenses, que vieron en él a un padre de la fotografía moderna."""

[[artistes]]
nom = "Alfred Stieglitz"
vie = "Hoboken (Nueva Jersey), 1 de enero de 1864 – Nueva York, 13 de julio de 1946"
biographie = """
Hijo de inmigrantes alemanes, Alfred Stieglitz parte a estudiar a Berlín en la década de 1880, primero ingeniería y luego fotoquímica, y empieza a fotografiar. De vuelta en Nueva York en 1890, lucha para que la fotografía sea reconocida como un arte. En 1902 funda la Photo-Secession y lanza en 1903 la revista Camera Work, impresa en fotograbado con un esmero extremo. En 1905 abre en el 291 de la Quinta Avenida una pequeña galería, llamada 291, donde expone fotógrafos pero también, entre los primeros en Estados Unidos, a Matisse, Rodin, Picasso o Cézanne. Su propia fotografía evoluciona de un estilo pictorialista hacia imágenes nítidas y construidas, como El entrepuente. En 1924 se casa con la pintora Georgia O'Keeffe, a quien fotografía durante años. En la década de 1920 realiza sus Equivalents, fotografías de nubes, y después dirige otras galerías hasta su muerte, en 1946."""
style = """
Stieglitz es a la vez fotógrafo, editor y marchante. Su obra sigue la evolución de la fotografía: primero imágenes vaporosas que imitan la pintura, luego una fotografía franca, que asume la nitidez, el encuadre y la geometría de lo real. Con su revista y sus galerías, hizo entrar la fotografía y el arte moderno europeo en los museos estadounidenses."""

[[artistes]]
nom = "Sergueï Prokoudine-Gorski"
vie = "Funikova Gora (gobernación de Vladímir), 30 de agosto de 1863 – París, 27 de septiembre de 1944"
biographie = """
De la nobleza rusa, Serguéi Mijáilovich Prokudin-Gorski estudia química en San Petersburgo, con Dmitri Mendeléiev según sus biógrafos, así como música y pintura. Dirige la fábrica metalúrgica de su suegro y se convierte en miembro activo de la sección fotográfica de la Sociedad Técnica Imperial Rusa. En 1901 abre un estudio y un laboratorio en San Petersburgo; al año siguiente estudia en Berlín la fotografía en tres colores con el profesor Adolf Miethe. Su retrato en color de Tolstói, en 1908, lo hace célebre. En 1909, Nicolás II le encomienda la misión de fotografiar el Imperio ruso: recorre durante años Rusia, el Cáucaso y Asia Central. Tras la revolución, abandona el país en 1918 con una parte de sus placas y se instala en París en 1922, donde abre un estudio con sus hijos. Muere unas semanas después de la liberación de París."""
style = """
Prokudin-Gorski no inventa la fotografía en color, pero la lleva a un nivel de calidad y ambición inédito. Sus miles de vistas, de una precisión y una frescura asombrosas, forman un retrato único del Imperio ruso en vísperas de la revolución: paisajes, iglesias, campesinos, obreros, pueblos de Asia Central."""
