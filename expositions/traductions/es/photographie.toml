[[oeuvres]]
titre = "Alim Khan, emir de Bujará"
artiste = "Sergueï Prokoudine-Gorski"
annee = "1911"
image = "emir-de-boukhara.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Alim_Khan_(1880–1944),_Emir_of_Bukhara,_photographed_by_S.M._Prokudin-Gorskiy_in_1911.jpg"
technique = "Tres negativos sobre vidrio tomados tras filtros azul, verde y rojo; colores recompuestos digitalmente"
collection = "Library of Congress, Washington"
note = "El último emir de Bujará posa con su túnica de seda azul: una de las primeras grandes fotografías en color, tomada tres veces en blanco y negro."
description = """
Un hombre corpulento, de barba negra, tocado con un turbante blanco, está sentado, con las piernas separadas, ante un muro de tierra gris. Lleva una larga túnica de seda de un azul intenso, salpicada de grandes flores malvas, rosas y verdes y ribeteada con un galón rojo. En el pecho brillan placas de condecoraciones y un cordón de ayudante; un ancho cinturón de oro cincelado le ciñe la cintura. Con una mano sostiene la empuñadura dorada de un sable cuya vaina desciende hasta el suelo, junto a sus botas negras. A ambos lados, dos puertas de madera tallada, de un naranja cálido, enmarcan la escena. La mirada es grave, algo cansada."""
evocation = """
El retrato muestra a un soberano de Asia Central en vísperas de la desaparición de su mundo. Alim Khan, subido al trono a comienzos de 1911, reina sobre un emirato bajo protectorado ruso; las condecoraciones de estilo europeo de su pecho conviven con la seda y el oro de la corte de Bujará. Nueve años después, el Ejército Rojo tomará la ciudad y el emir huirá a Afganistán, donde morirá en el exilio. Para nosotros, habituados al blanco y negro de los inicios de la fotografía, el color produce un choque: abole la distancia del siglo y vuelve la escena de pronto cercana, casi contemporánea."""
histoire = """
Químico formado en San Petersburgo, Prokudin-Gorski se apasiona por la fotografía en color. En 1909, el zar Nicolás II le concede su apoyo y un vagón acondicionado como laboratorio para fotografiar el Imperio ruso en toda su diversidad. En 1911 viaja a Asia Central y fotografía al emir en Bujará. Sus vistas estaban destinadas a proyectarse en color ante un público. Tras la revolución, abandona Rusia en 1918 y se instala en París en 1922. En 1948, cuatro años después de su muerte, la Library of Congress compra a sus herederos cerca de 1900 negativos. Digitalizados a partir de 2000, han sido recompuestos en color y son de libre acceso."""
facture = """
El método, propuesto por el físico James Clerk Maxwell ya en 1855, consiste en tomar sucesivamente tres fotografías en blanco y negro, a través de un filtro azul, uno verde y uno rojo. Prokudin-Gorski las registra en una misma placa de vidrio alargada, que la cámara desplaza entre las tomas. Proyectadas juntas a través de los mismos filtros y superpuestas, las tres imágenes reconstituyen los colores. Como las tomas se suceden durante varios segundos, todo lo que se mueve se desdobla en franjas de color: el emir tuvo que permanecer perfectamente inmóvil. La imagen presentada es una recomposición digital de los tres negativos."""
details = [
  "Las grandes flores malvas y rosas esparcidas sobre la seda azul.",
  "El cinturón de oro cincelado, hecho de placas abombadas.",
  "Las estrellas de las condecoraciones, en el pecho.",
  "Las puertas de madera talladas con motivos geométricos, a cada lado.",
  "Las grietas del muro de tierra, detrás del emir.",
]
themes = ["color", "retrato", "asia central", "poder", "imperio ruso"]
anecdote = """
Antes de este viaje, Prokudin-Gorski había causado sensación con un retrato en color de León Tolstói, tomado en 1908 en Yásnaia Poliana y difundido en tarjetas postales: este éxito le abrió las puertas de la familia imperial."""
