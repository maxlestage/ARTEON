[[oeuvres]]
titre = "El Château Noir"
annee = "1900–1904"
image = "chateau-noir.jpg"
technique = "Óleo sobre lienzo, 73,7 × 96,6 cm"
collection = "National Gallery of Art, Washington"
note = "Una edificación ocre en medio de los pinos, cerca de Aix, bajo un cielo azul ultramar."
description = """
Sobre una densa masa de pinos y encinas, una edificación de muros ocre anaranjado se alza en una altura, iluminada como a pleno sol. Se distinguen altas ventanas de arco apuntado, de aire gótico, una pequeña puerta rojiza y, a la derecha, un ala más baja coronada por un tejado azul oscuro. El cielo, de un azul intenso, está animado por toques verdes y violetas que lo acercan al follaje. A la izquierda, un tronco delgado y claro se eleva en oblicuo. La vegetación ocupa toda la mitad inferior del cuadro, en verdes, azules y negros profundos; abajo a la izquierda, una mancha ocre señala el suelo rocoso. Ningún personaje, ningún camino conduce al edificio."""
evocation = """
El lugar lleva un nombre de leyenda, y el cuadro mantiene ese misterio: una morada medio oculta, inaccesible, como surgida del bosque. A menudo se ha subrayado el tono dramático, casi inquieto, de las últimas vistas del Château Noir, donde el cielo oscuro parece pesar sobre el edificio. Algunos ven en ello un regreso al romanticismo juvenil de Cézanne, otros el eco de sus últimos años, solitarios y ensombrecidos por la diabetes. La arquitectura humana y la naturaleza salvaje se mezclan sin confundirse: la piedra cálida, sólida y geométrica se opone a la exuberancia fría de la vegetación. Más allá del motivo, el cuadro expresa el apego del pintor a esa campiña de Aix que recorrió toda su vida."""
histoire = """
El Château Noir es una gran mansión de estilo neogótico, construida en el siglo XIX en el camino que va de Aix al pueblo de Le Tholonet, al este de la ciudad. A pesar de su nombre, está edificada en piedra ocre; su nombre ha alimentado muchas leyendas locales. Cézanne recorre estas colinas boscosas desde los años 1880. Tras la venta del Jas de Bouffan, la propiedad familiar, en 1899, intenta en vano comprar el castillo; alquila en él una estancia para guardar su material y pinta por los alrededores hasta el final de su vida. Esta tela pertenece a la serie de vistas pintadas a comienzos de los años 1900. Ingresó en la National Gallery of Art de Washington en 1958, donación de Eugene y Agnes Meyer."""
facture = """
Toda la superficie está cubierta de pinceladas cortas, en trazos oblicuos, que dan la misma textura al cielo y a los árboles y ligan los planos entre sí. El contraste principal opone el ocre anaranjado de la edificación al azul del cielo, dos colores complementarios que se refuerzan. La pintura se aplica en capas sucesivas, unas veces finas, otras gruesas, con una manera más libre que la de los años 1880. Los contornos se deshacen, las formas se unen en algunos puntos: los historiadores hablan de «passage». Esta libertad fascinará a los fauves y a los cubistas."""
details = [
  "Las ventanas en ojiva, unos pocos trazos oscuros sobre la fachada ocre.",
  "La puerta roja, pequeña nota cálida en el corazón del edificio.",
  "El tronco claro de la izquierda, que atraviesa la composición en oblicuo.",
  "Los toques verdes puestos en el cielo, como si el follaje subiera hasta él.",
  "El tejado azul del ala derecha, que casi se confunde con el cielo.",
]
themes = ["arquitectura", "bosque", "provenza", "misterio", "soledad"]
anecdote = """
Picasso poseía también un Château Noir de Cézanne, pintado hacia 1904–1906. Ingresado en las colecciones nacionales con la dación de la colección personal de Picasso tras su muerte, se conserva hoy en el Museo Picasso de París."""
salle = 2
mur = "droite"
place = 3
