[[artistes]]
nom = "Paul Cézanne"
vie = "Aix-en-Provence, 19 de enero de 1839 – Aix-en-Provence, 22 de octubre de 1906"
biographie = """
Hijo de Louis-Auguste Cézanne, sombrerero enriquecido y convertido en banquero, Paul crece en Aix-en-Provence. En el colegio Bourbon traba una profunda amistad con Émile Zola, con quien recorre la campiña aixense. Para complacer a su padre, comienza estudios de derecho y luego consigue partir a París en 1861. Frecuenta la Academia Suiza, copia en el Louvre, conoce a Pissarro, Monet y Renoir, pero el Salón lo rechaza casi cada año. Sus primeras telas, sombrías y violentas, desconciertan. Durante la guerra de 1870 se oculta en L'Estaque con Hortense Fiquet, que le da un hijo, Paul, en 1872. Junto a Pissarro, en Pontoise y Auvers-sur-Oise, aclara su paleta. Expone con los impresionistas en 1874 y 1877, entre las burlas de la crítica, y luego se aleja de París. El año 1886 es decisivo: la publicación de La obra pone fin a su amistad con Zola, se casa con Hortense y la muerte de su padre lo pone a salvo de las necesidades. Retirado en Aix, trabaja con obstinación, lejos del mundo del arte. En 1895, su primera exposición individual en casa de Ambroise Vollard lo revela a los jóvenes pintores, que empiezan a considerarlo un maestro. Tras la venta del Jas de Bouffan, la casa familiar, hace construir en 1902 su taller de Les Lauves. Enfermo de diabetes, sigue pintando del natural hasta el final: sorprendido por una tormenta en octubre de 1906, muere pocos días después. La retrospectiva del Salón de Otoño de 1907 consagra su influencia."""
style = """
Cézanne quiere hacer del impresionismo «algo sólido y duradero como el arte de los museos», según una fórmula que se le atribuye. Construye las formas con el propio color, en pinceladas yuxtapuestas y orientadas, más que con el dibujo y la sombra. Simplifica los objetos en volúmenes, combina varios puntos de vista y acepta las deformaciones que sirven al equilibrio del cuadro. En 1904 aconseja a Émile Bernard tratar la naturaleza «por el cilindro, la esfera, el cono». Esta lección alimenta directamente el cubismo de Braque y de Picasso, pero también a Matisse y a buena parte del arte abstracto: se le considera uno de los padres de la pintura moderna."""
