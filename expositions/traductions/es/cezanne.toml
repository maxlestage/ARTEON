[[oeuvres]]
titre = "Las grandes bañistas"
annee = "1900–1906"
image = "grandes-baigneuses.jpg"
technique = "Óleo sobre lienzo, 210,5 × 250,8 cm"
collection = "Philadelphia Museum of Art"
note = "Cuerpos y árboles que forman una catedral: la última gran tela, dejada inacabada."
description = """
En una orilla arenosa, más de una docena de mujeres desnudas se reparten en dos grupos, a izquierda y derecha, enmarcadas por grandes troncos de árboles que se inclinan uno hacia otro hasta formar un alto arco abierto al cielo. A la izquierda, una bañista de pie se apoya contra un árbol; otras están sentadas, en cuclillas o tendidas. A la derecha, una mujer sentada domina su grupo, de cara a nosotros. En el centro, una pequeña extensión de agua donde nada una silueta; en la otra orilla, dos figuras de pie y, a lo lejos, un pueblo con un campanario, bajo un cielo azul atravesado por nubes blancas. En primer plano, una bañista inclinada recoge un paño blanco puesto en el suelo."""
evocation = """
Cézanne retoma un tema muy antiguo, el de los desnudos en un paisaje ideal, caro a Tiziano y a Poussin: una edad de oro en que la humanidad vive en armonía con la naturaleza. Pero sus bañistas no tienen ni nombre ni historia mitológica, y sus cuerpos, sin seducción, se tratan como elementos del paisaje, al mismo título que los árboles y el agua. En ello se ha visto la síntesis de toda su investigación: unir la figura humana y la naturaleza en una construcción estable y monumental. Para muchos historiadores, esta última gran tela abre el camino al arte del siglo XX: Picasso y Matisse meditan su lección, y se aproximan a menudo a estos desnudos angulosos Las señoritas de Aviñón, pintadas en 1907."""
histoire = """
En los diez últimos años de su vida, Cézanne lleva adelante tres grandes composiciones de bañistas, hoy en Londres, en la Fundación Barnes y en Filadelfia; esta es la más grande. Trabaja en ella varios años, sobre todo en el taller de Les Lauves, construido en 1902. Tímido y pudoroso, no hace posar a modelos desnudos: se apoya en dibujos antiguos y en recuerdos de esculturas y de cuadros vistos en el Louvre. La tela sigue inacabada a su muerte, en octubre de 1906. Pasa después por colecciones parisinas, mientras la gloria póstuma del pintor no deja de crecer. El Philadelphia Museum of Art la adquiere en 1937 gracias al fondo Wilstach."""
facture = """
La pintura está muy diluida, aplicada en capas finas y transparentes que dejan ver a menudo el lienzo blanco. Una paleta restringida, azules, ocres y tonos carne, unifica cuerpos, árboles y cielo. Los cuerpos, alargados y simplificados, están rodeados de contornos azules. La composición descansa en un gran triángulo formado por los troncos, que enmarca los dos grupos de figuras inclinadas en el mismo sentido. El cielo, hecho de toques rectangulares, se trata como una materia tan sólida como la tierra. Las deformaciones son voluntarias y sirven a la arquitectura de conjunto."""
details = [
  "El minúsculo campanario, a lo lejos, entre los troncos de la izquierda.",
  "La nadadora en medio del agua, apenas indicada.",
  "Los contornos azules que rodean los cuerpos.",
  "Los rostros sin rasgos, reducidos a óvalos.",
  "Las zonas donde el lienzo blanco queda visible, prueba del carácter inacabado.",
]
themes = ["bañistas", "desnudo", "naturaleza", "arcadia", "geometría"]
anecdote = """
Para poder sacar sus telas más grandes del taller de Les Lauves, Cézanne hizo abrir en un muro una alta y estrecha hendidura. Todavía hoy puede verse en el taller, convertido en un museo abierto a los visitantes."""
salle = 3
