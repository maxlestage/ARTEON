[[oeuvres]]
titre = "La montaña Sainte-Victoire"
annee = "1904"
image = "sainte-victoire.jpg"
technique = "Óleo sobre lienzo"
note = "Vista desde Les Lauves, su último taller: Cézanne pintó la montaña más de ochenta veces."
description = """
La montaña ocupa la parte alta del cuadro: una masa azul violeta cuya cresta se eleva hacia una cumbre aguda antes de estirarse en una larga meseta hacia la derecha. Bajo ella se extiende la llanura, hecha de un mosaico de pequeños planos ocre, anaranjados, verdes y azules en los que se adivinan campos, bosquecillos y algunas casas. En primer plano, una ancha franja de hierba verde claro atraviesa todo el lienzo; árboles de troncos delgados se alzan en ella, a izquierda y derecha. El cielo, lejos de ser uniforme, está pintado con grandes toques azules, verdes y grises, semejantes a los del paisaje. En algunos puntos, la tela aparece al desnudo, sin ningún color."""
evocation = """
La Sainte-Victoire es la montaña de la infancia de Cézanne, la de sus paseos con Zola por la campiña de Aix. Volver sin cesar al mismo motivo es para él buscar lo que permanece bajo la luz cambiante: habla a menudo, en sus cartas, de «realizar» sus sensaciones ante la naturaleza. En esta serie se ha visto una búsqueda casi espiritual, llevada a cabo por un hombre envejecido y enfermo que siente que le falta el tiempo. La montaña se convierte en el símbolo de una Provenza arraigada, sólida y atemporal. En las últimas versiones, la llanura y el cielo se disuelven en manchas de color, al borde de la abstracción, lo que convertirá estas telas en referencias para los pintores abstractos del siglo XX."""
histoire = """
Cézanne pinta la Sainte-Victoire desde los años 1870, y sobre todo a partir de los años 1880, desde el Jas de Bouffan o los alrededores de Bellevue. En 1902 manda construir un taller en la colina de Les Lauves, al norte de Aix. Sube casi a diario, por el camino, hasta un punto de vista que domina la llanura, frente a la montaña: allí nace la última serie, pintada entre 1902 y 1906. El joven pintor Émile Bernard le visita en 1904 y recoge sus palabras sobre la pintura; en enero de 1906, Maurice Denis y Ker-Xavier Roussel vienen a su vez y lo fotografían trabajando ante el motivo. Estas vistas tardías se hallan hoy dispersas entre Europa, Estados Unidos y Rusia."""
facture = """
El lienzo está construido con manchas de color yuxtapuestas, a menudo rectangulares, aplicadas sin dibujo previo. La misma pincelada sirve para la tierra y para el cielo, lo que unifica toda la superficie. Los colores cálidos, ocres y anaranjados, hacen avanzar la llanura, mientras que los azules y los violetas empujan la montaña hacia el fondo. La pintura, a menudo fina y casi transparente, deja ver en algunos puntos la tela, como en las acuarelas que Cézanne practica mucho en esa misma época. El aparente carácter inacabado forma parte del método: cada pincelada responde a las demás más que al detalle del paisaje."""
details = [
  "La cumbre, aplicada con toques azules y malvas sin contorno continuo.",
  "Las pequeñas manchas anaranjadas, en el centro, que sugieren tejados.",
  "Los troncos delgados del primer plano, trazados con un simple trazo oscuro.",
  "Las zonas de tela desnuda, en el cielo y abajo a la izquierda.",
]
themes = ["montaña", "provenza", "paisaje", "abstracción", "permanencia"]
anecdote = """
La tradición vincula el nombre de la montaña con la victoria del general romano Mario sobre los teutones, en 102 a. C., en la región de Aix. Picasso, gran admirador de Cézanne, compra en 1958 el castillo de Vauvenargues, al pie de su vertiente norte; allí está enterrado."""
