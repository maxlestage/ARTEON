[[salles]]
nom = "Sala III · Las grandes bañistas"
theme = "1900–1906: la última gran tela, inacabada, que abre el camino al cubismo."
murs = "#e3e4ea"

[[oeuvres]]
titre = "Autorretrato"
annee = "1878–1880"
image = "autoportrait.jpg"
technique = "Óleo sobre lienzo, 60,3 × 46,9 cm"
collection = "The Phillips Collection, Washington"
note = "Una mirada de soslayo, una cabeza sólida como un bloque: Cézanne se pinta como pinta una montaña."
description = """
El pintor se muestra de busto, de tres cuartos, con el cuerpo vuelto hacia la derecha y la cabeza ligeramente girada hacia nosotros. El cráneo calvo, muy iluminado, forma una amplia cúpula rosa y blanca; una corona de cabello castaño se riza en la nuca y una barba espesa y oscura devora la parte baja del rostro. Los ojos, entornados, nos observan de lado, sin sombra de sonrisa. Viste una chaqueta oscura, de un verde pardo, cuyo cuello dibuja ángulos netos bajo la barba. Tras él, ningún decorado, ningún atributo de pintor: un fondo oliváceo, pintado con toques desiguales, más oscuro a la izquierda y más dorado a la derecha. La figura llena casi todo el lienzo, y el borde izquierdo deja ver la tela desnuda."""
evocation = """
Nada hay aquí del artista inspirado o mundano: Cézanne se observa con la misma neutralidad que una manzana o una roca. Los historiadores del arte han visto en ello el momento en que renuncia a los efectos dramáticos de sus comienzos en favor de una observación paciente, casi impersonal. La mirada oblicua, algo recelosa, concuerda con lo que se sabe del hombre: huraño, tímido, susceptible, cada vez más retirado en Aix y huyendo del París de los salones. El rostro no traduce una emoción pasajera, sino una presencia duradera, construida por masas. Hacia los cuarenta años, todavía ignorado por el público y burlado por la crítica, se representa como un trabajador obstinado más que como un pintor reconocido: un hombre que duda de todo, salvo de su método."""
histoire = """
Cézanne pintó más de una veintena de autorretratos al óleo, en parte por falta de otros modelos: trabajaba despacio, exigía largas sesiones y pocas personas aceptaban posar para él. Este data de los años 1878–1880. El pintor reparte entonces su tiempo entre París, L'Estaque y Aix; ha expuesto con los impresionistas en 1874 y en 1877, entre los sarcasmos de la prensa, y luego deja de participar en sus exposiciones. Vive con estrechez de la pensión que le pasa su padre. Conservado durante mucho tiempo en colecciones privadas, el cuadro fue adquirido a finales de los años veinte por Duncan Phillips, coleccionista de Washington que fue de los primeros estadounidenses en defender a Cézanne y que había abierto al público, en 1921, su propia casa-museo."""
facture = """
La pincelada, todavía ancha y espesa, se aplica en trazos paralelos que siguen los planos del rostro: frente, pómulo, arista de la nariz. El modelado no se logra mediante degradados de sombra, sino por la yuxtaposición de rosas, ocres y verdes fríos. Esta manera de construir con pinceladas orientadas, madurada junto a Pissarro en Pontoise y en Auvers, es lo que los historiadores llaman su «pincelada constructiva». La paleta, restringida, descansa en el acorde del verde oliva del fondo y de la carne rosada. El contorno de la chaqueta, retomado con trazos oscuros, cierra la forma como un bloque."""
details = [
  "La parte alta del cráneo, aplicada con toques casi blancos, capta toda la luz.",
  "La oreja enrojecida, pequeña mancha cálida en la masa oscura del cabello.",
  "Los párpados pesados, medio caídos, que dan a la mirada su aire suspicaz.",
  "En el borde izquierdo, una franja de tela desnuda que el color no ha cubierto.",
]
themes = ["autorretrato", "mirada", "soledad", "construcción"]
anecdote = """
Amigo de infancia de Émile Zola en el colegio de Aix, Cézanne fue reconocido a menudo en Claude Lantier, el pintor fracasado de la novela La obra (1886). La cortés carta con la que agradece a Zola el envío del libro es la última que se conoce entre ambos."""
salle = 1
mur = "gauche"
place = 1
largeur = 0.85

[[oeuvres]]
titre = "Madame Cézanne en el sillón rojo"
annee = "hacia 1877"
image = "madame-cezanne.jpg"
technique = "Óleo sobre lienzo, 72,4 × 56 cm"
collection = "Museum of Fine Arts, Boston"
note = "Hortense Fiquet, su compañera, posa como un bodegón en el gran sillón rojo."
description = """
Hortense Fiquet está sentada, de frente, en un amplio sillón acolchado de un rojo vivo, cuyos reposabrazos se enroscan a ambos lados y del que cuelgan borlas de pasamanería. Lleva una chaqueta gris azulada de anchas mangas, cerrada en el cuello con un gran lazo de cinta azul claro, y una larga falda de volantes, rayada de verde, azul y malva, que desciende hasta el borde inferior del cuadro. Tiene las manos cruzadas sobre el regazo. Su rostro ovalado, enmarcado por cabello castaño recogido en un moño, permanece sereno, sin expresión marcada. Detrás de ella, un papel pintado ocre dorado está sembrado de pequeños motivos azules en forma de flores de cuatro pétalos; abajo a la izquierda, una franja verde oscuro marca el zócalo. El encuadre corta el sillón y el vestido."""
evocation = """
El título habla tanto del sillón como de la mujer, y no es casualidad: Cézanne mira a su compañera con la misma atención que a un objeto, sin pretender halagarla ni contar su carácter. En estos retratos se ha leído a menudo cierta frialdad, incluso el rastro de una pareja difícil; otros ven sobre todo la paciencia de una modelo que aceptó horas de pose inmóvil. El cuadro evoca también una vida casi clandestina: en 1877, Cézanne todavía oculta a su padre la existencia de Hortense y de su hijo. La gran masa roja que envuelve la figura le confiere, sin embargo, un calor y una estabilidad monumentales, como un estuche, y el cara a cara del rojo y del verde hace vibrar esta escena inmóvil."""
histoire = """
Cézanne conoce a Hortense Fiquet, joven nacida en el Jura que trabaja como modelo, en París hacia 1869; su hijo Paul nace en 1872. La pintará cerca de treinta veces, más que a ningún otro modelo. Este retrato data de 1877 aproximadamente, el año en que expone por última vez con los impresionistas. La pareja no se casa hasta abril de 1886, en Aix, pocos meses antes de la muerte de Louis-Auguste Cézanne, padre del pintor. Tras la desaparición del artista, el cuadro figura entre las obras reunidas en el Salón de Otoño de 1907 para la gran retrospectiva que revela a Cézanne a toda una generación de pintores. Ingresa en el Museum of Fine Arts de Boston en 1944, legado por el coleccionista Robert Treat Paine II."""
facture = """
Las rayas de la falda se logran con largas pinceladas verticales yuxtapuestas, verdes, azules y malvas, sin fundido: el color puro construye el volumen y el movimiento de los pliegues. El rojo del sillón y el verde del vestido, colores complementarios, se exaltan mutuamente. El propio sillón no se modela con la sombra, sino con rojos más cálidos o más fríos, más rosados o más oscuros. Contornos azules rodean en algunos puntos las formas. La composición, casi simétrica, instala la figura en pirámide en el centro del lienzo, firmemente calzada contra el fondo plano del papel pintado."""
details = [
  "Las borlas rojas que cuelgan a ambos lados del sillón.",
  "El gran lazo azul claro, punto más luminoso del vestido.",
  "Los pequeños motivos azules del papel pintado, como flores de cuatro pétalos.",
  "Las manos cruzadas, reducidas a unos pocos planos de carne.",
  "La franja verde oscuro abajo a la izquierda, que ancla la composición.",
]
themes = ["retrato", "interior", "pareja", "color", "mujer"]
anecdote = """
En octubre de 1907, el poeta Rainer Maria Rilke descubre este cuadro en el Salón de Otoño y le dedica una larga descripción en una carta a su esposa, Clara, en la que analiza el diálogo de los rojos y los azules. Sus Cartas sobre Cézanne se han convertido en un clásico."""
salle = 1
mur = "droite"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "El muchacho del chaleco rojo"
annee = "1888–1890"
image = "gilet-rouge.jpg"
technique = "Óleo sobre lienzo, 89,5 × 72,4 cm"
collection = "National Gallery of Art, Washington"
note = "Michelangelo di Rosa, un joven modelo italiano, con sombrero y la mano en la cadera: Cézanne lo pintó al menos cuatro veces."
description = """
Un adolescente permanece de pie, de tres cuartos, ante una pesada cortina de pliegues verticales. Lleva un sombrero pardo de ala ancha, una camisa clara, una corbata azul, un chaleco rojo vivo con solapas, una chaqueta gris azulada y un pantalón verde pardo ceñido por un cinturón azul oscuro. A la izquierda, su brazo doblado apoya la mano en la cadera; a la derecha, el otro brazo cuelga a lo largo del cuerpo, larguísimo, con la mano cayendo casi hasta el borde inferior del cuadro. El rostro pálido, de mejillas rosadas, está vuelto hacia nosotros, con una expresión vaga y algo ausente. Abajo a la izquierda se adivina el respaldo de una silla de madera; detrás, el tapiz alterna motivos de follaje, ocres y gris verdoso."""
evocation = """
El muchacho no es un personaje cuya historia pueda contarse: su nombre o su humor importan poco. Cézanne hace de este joven con traje pintoresco un motivo de colores y líneas, cuyo chaleco rojo es el corazón ardiente. La pose, con la mano en la cadera, recuerda los retratos de aparato de la tradición, pero aplicada a un modelo de condición modesta pierde toda arrogancia. A menudo se ha leído en él una melancolía adolescente, una ensoñación lánguida que refuerza la mirada perdida. Sobre todo, la libertad tomada con las proporciones del cuerpo, en beneficio del equilibrio del lienzo, fascinó a los pintores del siglo XX: la pintura ya no tiene que copiar la naturaleza, obedece a sus propias leyes."""
histoire = """
Cézanne pinta este cuadro en París, hacia 1888–1890. Su modelo es un joven italiano, Michelangelo di Rosa, que posa para los artistas. El pintor extrae de él al menos cuatro lienzos, en poses distintas, además de acuarelas: hoy se encuentran en Zúrich, Nueva York, Filadelfia y Washington. La versión de Washington perteneció al banquero Jakob Goldschmidt. En la venta de su colección en Sotheby's de Londres, en octubre de 1958, fue adquirida por el coleccionista estadounidense Paul Mellon por 220 000 libras esterlinas, un récord en su época para un cuadro vendido en subasta. Este precio espectacular ocupó entonces las portadas de los periódicos. Paul Mellon y su esposa lo donaron a la National Gallery of Art en 1995."""
facture = """
La pintura se aplica en anchas pinceladas planas que recortan cada superficie en planos: la chaqueta en facetas gris azuladas, el cortinaje en bandas oblicuas, el rostro en unas pocas porciones de carne rosa y verde. El rojo del chaleco, situado en el centro, es la nota más intensa; a su alrededor, los azules y los verdes lo realzan. Los contornos, retomados con trazos azul oscuro, permanecen a menudo abiertos. Cézanne alarga y deforma libremente los miembros para equilibrar la composición vertical. Algunas zonas, como el pantalón o la silla, apenas están esbozadas, lo que deja ver la construcción del cuadro."""
details = [
  "El sombrero pardo de ala ancha, colocado como un disco sobre el rostro.",
  "La corbata azul, que responde al azul oscuro del cinturón.",
  "A la derecha, la mano que cuelga casi hasta el borde inferior del lienzo.",
  "Abajo a la izquierda, el respaldo de madera de la silla, apenas esbozado.",
  "Los pliegues del tapiz, recortados en anchas bandas de color.",
]
themes = ["retrato", "juventud", "modelo", "rojo", "color"]
anecdote = """
Otra versión del cuadro, conservada en la Fundación Bührle de Zúrich, fue robada por hombres armados en febrero de 2008, junto con otras tres telas. No fue recuperada hasta 2012, en Serbia, durante una operación policial."""
salle = 1
mur = "gauche"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "Los jugadores de cartas"
annee = "1890–1895"
image = "joueurs-cartes.jpg"
technique = "Óleo sobre lienzo, 47,5 × 57 cm"
collection = "Museo de Orsay, París"
note = "Dos campesinos de Aix frente a frente, absortos e inmóviles: una partida que parece durar para la eternidad."
description = """
En una estancia oscura, dos hombres se enfrentan a ambos lados de una pequeña mesa cubierta con un tapete anaranjado cuya esquina cae hacia nosotros. A la izquierda, con un sombrero hongo pardo y una pipa de arcilla blanca en la boca, un jugador de chaqueta violácea sostiene las cartas junto al cuerpo, sentado muy erguido. A la derecha, su compañero, de sombrero blando y chaqueta amarillo pálido, bigote caído, se inclina algo más, con la mirada baja sobre su juego. Ninguno de los dos habla ni levanta los ojos hacia el otro. Entre ellos, una botella oscura se alza en medio de la mesa, casi en el centro del cuadro. Al fondo, un muro rojo pardo y un zócalo de madera; a la izquierda, el montante de una silla."""
evocation = """
No ocurre nada, y eso es lo que impresiona: ni trampa, ni disputa, ni apuesta visible, a diferencia de las escenas de garito de la pintura holandesa o caravaggiesca. En él se ha visto la dignidad silenciosa de los campesinos provenzales, que Cézanne, hijo de banquero, observa con respeto y sin pintoresquismo. Otros leen el cara a cara de dos temperamentos, uno rígido y sombrío, otro encorvado y claro. La botella, como un eje, separa y une a la vez a los dos hombres. La concentración de los jugadores se corresponde con la del pintor, que exigía a sus modelos largas horas de inmovilidad: el juego se convierte en una forma de meditación, y la escena de género adquiere la gravedad de un retrato."""
histoire = """
A comienzos de los años 1890, Cézanne emprende en Aix una serie de cinco cuadros de jugadores de cartas, preparados mediante numerosos estudios de campesinos aislados. Sus modelos son obreros agrícolas y jornaleros del Jas de Bouffan, la propiedad familiar, y no actores disfrazados. Se piensa que las dos versiones más amplias, con cuatro y cinco personajes, hoy en el Metropolitan Museum de Nueva York y en la Fundación Barnes de Filadelfia, fueron pintadas las primeras; las tres siguientes solo conservan dos jugadores. Como fuente se cita a menudo un cuadro de jugadores de cartas atribuido a los hermanos Le Nain, conservado en el museo de Aix. Esta versión, la más pequeña, ingresa en el Louvre en 1911 con el legado del conde Isaac de Camondo y pasa al Museo de Orsay en 1986."""
facture = """
La composición es casi simétrica, organizada en torno a la botella vertical, y las dos siluetas forman como dos arcos que se responden. Cézanne simplifica los volúmenes: sombreros, brazos y torsos se convierten en formas plenas y firmes. Los colores se oponen en acordes cálidos y fríos, el anaranjado del tapete contra los violetas y los amarillos de las chaquetas. La pincelada, visible y orientada, construye los pliegues de las ropas plano a plano. La luz no procede de una fuente precisa: nace de los propios colores. El borde de la mesa, ligeramente inclinado, delata la libertad tomada con la perspectiva."""
details = [
  "La pipa de arcilla blanca del jugador de la izquierda, única nota clara de su rostro.",
  "El reflejo de luz en la botella, que marca el eje del cuadro.",
  "Las cartas, simples manchas blancas y azuladas, imposibles de leer.",
  "La esquina del tapete anaranjado que cae hacia nosotros bajo la mesa.",
  "Las piernas y la silla de la izquierda, apenas esbozadas en la penumbra.",
]
themes = ["campesinos", "juego", "silencio", "provenza", "cara a cara"]
anecdote = """
Otra versión con dos jugadores, más grande, procedente de una colección griega, fue adquirida en 2011 por la familia reinante de Catar, por más de 250 millones de dólares según la prensa: un récord en su momento para una obra de arte."""
salle = 1
mur = "droite"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "La cesta de manzanas"
annee = "hacia 1893"
image = "panier-pommes.jpg"
technique = "Óleo sobre lienzo, 65 × 80 cm"
collection = "Art Institute of Chicago"
note = "La mesa se inclina, la botella también: Cézanne muestra los objetos desde varios puntos de vista a la vez."
description = """
Sobre una mesa de madera parda, una cesta llena de manzanas verdes, amarillas y rojas se ladea hacia delante, colocada de través sobre un pequeño bloque que la levanta por detrás. Varias frutas se han escapado y reposan sobre un mantel blanco arrugado, de gruesos pliegues, que cubre el centro de la mesa y cae hacia nosotros. Detrás se alza una botella de vino verde oscuro, ligeramente inclinada. A la derecha, un plato sostiene una pila de bizcochos alargados, apilados en entramado. Una manzana aislada, en el extremo derecho, espera al borde de la mesa. El fondo es un muro gris azulado, liso y uniforme, que hace resaltar los colores cálidos de las frutas. Abajo a la izquierda, la firma «P. Cézanne»."""
evocation = """
Es una escena doméstica banal, pero la estabilidad que se espera de un bodegón aparece aquí perturbada: todo parece a punto de deslizarse y, sin embargo, todo se sostiene. En ella se ha visto la huella del tiempo de la percepción, el ojo que se desplaza de un objeto a otro a lo largo de las sesiones, más que una imagen captada de un solo golpe. El bodegón, género juzgado menor por la Academia, se convierte en Cézanne en un laboratorio tan ambicioso como la gran pintura de historia. Las manzanas, frutas cotidianas, carecen aquí de sentido simbólico: ni pecado ni vanidad, solo peso, volumen y color. Este desplazamiento del tema hacia la pintura misma anuncia el arte del siglo XX, de Braque a Morandi."""
histoire = """
Cézanne pinta este cuadro hacia 1893, en una época en que vive sobre todo en Provenza y apenas expone; sigue siendo un desconocido para el gran público. Dos años más tarde, en 1895, el joven marchante Ambroise Vollard le dedica en su galería de la rue Laffitte, en París, su primera exposición individual: revela a los jóvenes pintores sus bodegones y sus paisajes, y lanza por fin su carrera comercial. La cesta de manzanas pasa más tarde a la colección del pintor y mecenas de Chicago Frederic Clay Bartlett. En 1926 la dona al Art Institute of Chicago dentro de la colección creada en memoria de su esposa, Helen Birch Bartlett, que incluye también Un domingo por la tarde en la isla de la Grande Jatte de Seurat."""
facture = """
Cézanne construye las manzanas con pequeños toques de color puestos uno junto a otro, de rojos y amarillos cálidos hacia verdes más fríos, en lugar de modelarlas con la sombra y la luz. Los contornos se retoman con trazos azules o pardos, a veces duplicados. Los blancos del mantel están hechos de grises azulados y malvas. El encuadre cerrado y el punto de vista ligeramente picado acercan los objetos al espectador. Se cuenta que el pintor calzaba sus frutas y sus platos con monedas o trozos de madera para obtener exactamente la inclinación deseada."""
details = [
  "El borde delantero de la mesa, que no enlaza a uno y otro lado del mantel.",
  "El pequeño bloque deslizado bajo la cesta para hacerla inclinarse hacia nosotros.",
  "La botella, cuyos dos flancos no son simétricos.",
  "La pila de bizcochos, vista casi desde arriba mientras el plato se ve de lado.",
  "La firma abajo a la izquierda, rara en un pintor que firmaba poco.",
]
themes = ["bodegón", "manzanas", "perspectiva", "equilibrio", "mesa"]
anecdote = """
El crítico Gustave Geffroy, uno de sus primeros defensores, cuenta que Cézanne le confió querer «asombrar a París con una manzana». La frase ha quedado asociada a todos sus bodegones."""
salle = 1
mur = "gauche"
place = 3
largeur = 1.3

[[oeuvres]]
titre = "La bahía de Marsella, vista desde L'Estaque"
annee = "hacia 1885"
image = "estaque.jpg"
technique = "Óleo sobre lienzo, 80,2 × 100,6 cm"
collection = "Art Institute of Chicago"
note = "Los tejados ocre, el azul denso del mar y las colinas: un paisaje construido en planos de color."
description = """
Desde las alturas del pueblo de L'Estaque, la mirada se hunde por encima de tejados de tejas anaranjadas hacia la vasta bahía de Marsella. En primer plano, casas de muros ocre y ventanas oscuras se encajan como bloques, rodeadas de unos pocos árboles. Varias chimeneas de fábrica se alzan entre los tejados, una de las cuales, a la derecha, deja escapar un penacho de humo blanco. A la izquierda, una lengua de tierra ocre y verde avanza hacia el agua. El mar, de un azul profundo y casi uniforme, ocupa todo el centro del cuadro, sin una sola barca. A lo lejos, un espigón delgado y luego la línea de colinas grises y malvas que cierran la bahía, bajo un cielo pálido estriado de nubes ligeras."""
evocation = """
Cézanne no pinta ni el animado puerto de Marsella ni la agitación de las olas: fija una imagen de permanencia, un Mediterráneo inmóvil, casi mineral. Allí donde los impresionistas buscaban el instante fugaz, él busca lo que dura. El pequeño humo de fábrica, único signo de movimiento, recuerda sin embargo que L'Estaque es entonces un pueblo industrial, que vive de sus tejares. El lugar tiene también para él un valor íntimo: es un refugio familiar, donde su madre alquila una casa y donde puede vivir al abrigo de la mirada paterna. En él se ha visto un paisaje a la vez real y reconstruido, ordenado como una arquitectura. Veinte años después, Braque vendrá a pintar aquí sus primeros paisajes cubistas, en la estela directa de Cézanne."""
histoire = """
L'Estaque es un pueblo de pescadores y tejares al oeste de Marsella. Cézanne se refugia allí en 1870 con Hortense para escapar a la movilización durante la guerra franco-prusiana, y regresa en numerosas ocasiones hasta mediados de los años 1880. Pinta allí más de una decena de vistas de la bahía, desde ángulos cercanos. En 1882, Renoir le visita; enfermo, es cuidado por Cézanne y su madre. Esta tela, pintada hacia 1885, pertenece a la serie de la madurez, en la que el paisaje se simplifica en grandes planos. Fue adquirida por Martin A. Ryerson, industrial y mecenas de Chicago, uno de los grandes benefactores del Art Institute, que la legó al museo con su colección en 1933."""
facture = """
El cuadro está construido en tres bandas horizontales, el pueblo, el mar y las colinas, superpuestas más que encajadas por la perspectiva. La profundidad nace sobre todo del color: los ocres y anaranjados cálidos del primer plano avanzan, el azul frío del mar retrocede. Sin embargo, las colinas del fondo están pintadas con tanta nitidez como los tejados, de modo que el mar parece erguirse como un muro. La pincelada del agua, densa y regular, en toques horizontales, contrasta con las trazas más libres del cielo. Las casas se reducen a volúmenes geométricos simples."""
details = [
  "El penacho de humo blanco, a la derecha, único elemento en movimiento.",
  "El fino espigón que corta el mar en diagonal, a la izquierda.",
  "Los muros de las casas, reducidos a planos de color sin detalle.",
  "Las colinas del fondo, tan nítidas como los tejados del primer plano.",
  "Los pequeños prados verde vivo sobre la lengua de tierra, a la izquierda.",
]
themes = ["mar", "provenza", "paisaje", "pueblo", "mediterráneo"]
anecdote = """
En una carta a Pissarro de julio de 1876, Cézanne describe L'Estaque en estos términos: «Es como una carta de baraja. Tejados rojos sobre el mar azul». La fórmula resume ya lo que busca: formas netas y colores francos."""
salle = 2
mur = "gauche"
