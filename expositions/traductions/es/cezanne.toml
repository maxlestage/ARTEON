titre = "Cézanne, la construcción del color"
artiste = "Paul Cézanne"
dates = "1839–1906"
accroche = "Exposición virtual · Paul Cézanne"
introduction = """
Manzanas que parecen talladas en piedra, jugadores de cartas inmóviles, el mar en L'Estaque y la montaña Sainte-Victoire pintada una y otra vez: Cézanne construye el mundo con el color. Picasso lo llamaba «nuestro padre a todos»."""
vitrine = "panier-pommes.jpg"

[musee]
nom = "Museo Granet"
ville = "Aix-en-Provence, Francia"
presentation = """
En Aix-en-Provence, ciudad natal de Cézanne, el Museo Granet ocupa el antiguo priorato de los caballeros de Malta, un edificio del siglo XVII vecino a la iglesia de Saint-Jean-de-Malte, en el barrio Mazarin. El museo de la ciudad se instala allí en el siglo XIX y toma el nombre del pintor aixense François Marius Granet, que le legó sus colecciones. El joven Cézanne frecuenta la escuela de dibujo instalada entre esos mismos muros, pero la ciudad ignora durante mucho tiempo su genio: su conservador, Henri Pontier, habría jurado que ningún Cézanne entraría en el museo en vida suya. Hoy el museo posee una decena de obras del pintor, en gran parte depositadas por el Estado. Renovado y ampliado en 2006, con motivo del centenario de la muerte de Cézanne, expone también, en la cercana capilla de los Penitentes Blancos, la colección de arte moderno reunida por Jean Planque, amigo de Picasso y de Dubuffet."""
ici = """
El edificio de ARTEON es solo una evocación sencilla: tres salas en enfilada, unidas por pasillos, sin plano trazado. Se comienza por la Sala I · Los seres y las cosas, de muros beige piedra, con los retratos, los jugadores de cartas y las manzanas. Un pasillo conduce a la Sala II · La Provenza, de muros verde grisáceo pálido, ante el mar de L'Estaque y la Sainte-Victoire, y después a la Sala III · Las grandes bañistas, de muros gris azulado, donde la última gran tela del pintor cierra la visita."""

[[salles]]
nom = "Sala I · Los seres y las cosas"
theme = "1877–1895: los retratos, los jugadores de cartas y los bodegones, construidos pincelada a pincelada."
murs = "#ece4d6"

[[salles]]
