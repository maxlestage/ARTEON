[exposition]
ordre = 190
nom_court = "Abstracción"
mouvement = "Vanguardias y abstracción"
cadre = "noir"
couleur = "#b8261b"
titre = "Las vanguardias, el nacimiento de la abstracción"
artiste = "Kandinsky, Mondrian, Malévich, Klee, af Klint…"
dates = "1907–1930"
accroche = "Exposición virtual · Solomon R. Guggenheim Museum, Nueva York"
introduction = """
Entre 1907 y 1930, en Suecia, París, Milán, Moscú, Weimar y Hannover, unos pintores renuncian a imitar el mundo visible: el color, la línea y la forma se convierten en su propio tema. Cubismo, futurismo, orfismo, suprematismo, De Stijl, Bauhaus y dadá se reúnen aquí en diez obras, desde los lienzos secretos de Hilma af Klint hasta el cuadrado negro de Malévich y las líneas negras de Mondrian. El edificio se inspira en el Museo Guggenheim de Nueva York, concebido por Frank Lloyd Wright para una colección nacida de la pasión de Solomon R. Guggenheim por Kandinsky: un vestíbulo bajo, una rotonda blanca muy alta y unas bahías de exposición a su alrededor."""
vitrine = "composition-viii.jpg"

[musee]
nom = "Solomon R. Guggenheim Museum"
ville = "Nueva York, Estados Unidos"
architecte = "Frank Lloyd Wright"
construction = "1956–1959"
presentation = """
El coleccionista Solomon R. Guggenheim, asesorado por la pintora Hilla Rebay, reúne en los años treinta un conjunto de arte no figurativo centrado en Kandinsky, que se muestra desde 1939 en un primer Museum of Non-Objective Painting. En 1943 encarga a Frank Lloyd Wright un edificio para albergarlo; el proyecto dura dieciséis años, y el arquitecto muere seis meses antes de la inauguración, en octubre de 1959, en la Quinta Avenida, frente a Central Park. El museo da la espalda a la cuadrícula de Manhattan: una espiral de hormigón blanco, más ancha arriba que abajo, envuelve una rotonda iluminada por un lucernario. El visitante desciende por una rampa continua contemplando las obras colgadas del muro curvo. Inscrito en la lista del Patrimonio Mundial de la Unesco en 2019 junto con otros edificios de Wright, el Guggenheim conserva uno de los más bellos conjuntos de Kandinsky del mundo."""
ici = """
ARTEON retoma la secuencia querida por Wright, pero sin la rampa. El vestíbulo de entrada, de solo 4 metros de altura y estrecho, conduce al norte a La rotonda · Hacia la abstracción, un cuadrado de 18 metros de lado bajo un lucernario a 18 metros de altura. Desde allí se accede a tres bahías más íntimas, de 5 metros de altura: la Bahía oeste · Cubismo y futurismo, la Bahía este · Suprematismo y De Stijl y, al fondo, la Bahía norte · Dadá y Bauhaus. Todos los muros son de un blanco cálido, como en el museo."""

