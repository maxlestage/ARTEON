[[artistes]]
nom = "Hilma af Klint"
vie = "Solna (Suecia), 26 de octubre de 1862 – Djursholm (Suecia), 21 de octubre de 1944"
biographie = """
Nacida en una familia de oficiales de marina, Hilma af Klint estudia de 1882 a 1887 en la Real Academia de Bellas Artes de Estocolmo, una de las pocas escuelas de arte entonces abiertas a las mujeres. Lleva después una respetada carrera de retratista y paisajista, y realiza dibujos botánicos y científicos. Pero se interesa también por el espiritismo y la teosofía: a partir de 1896 se reúne con otras cuatro amigas, el grupo de las Cinco, en sesiones en las que practican el dibujo automático. En 1906 comienza las Pinturas para el templo, 193 obras concluidas en 1915, entre las primeras abstracciones de la historia. El pensador Rudolf Steiner, a quien admira, ve sus cuadros en 1908 sin alentarla. Sigue pintando y escribiendo hasta su muerte, a consecuencia de un accidente, en 1944. Deja más de un millar de obras y miles de páginas de cuadernos, y pide que su trabajo abstracto no se muestre hasta veinte años después. Revelada en 1986, es hoy reconocida como una pionera mayor de la abstracción."""
style = """
Hilma af Klint inventa una pintura de símbolos: espirales, círculos, conchas, letras y palabras cifradas, colores cargados de sentido, organizados casi siempre en series que cuentan una evolución. Sus grandes formatos de tonos pastel, pintados en superficies planas y nítidas, mezclan la precisión del dibujo científico y una imaginería espiritual. Su redescubrimiento ha obligado a reescribir la historia de la abstracción, durante mucho tiempo atribuida solo a Kandinsky, Mondrian y Malévich."""

[[artistes]]
nom = "Vassily Kandinsky"
vie = "Moscú, 16 de diciembre de 1866 – Neuilly-sur-Seine, 13 de diciembre de 1944"
biographie = """
Kandinsky estudia derecho y economía en Moscú y parece destinado a una carrera universitaria antes de abandonarlo todo, a los treinta años, por la pintura. Parte en 1896 hacia Múnich, donde funda un grupo de artistas y vive con la pintora Gabriele Münter, en Múnich y en Murnau. Sus paisajes se liberan poco a poco de la representación y, hacia 1910-1911, pinta sus primeros grandes lienzos abstractos. En 1911 publica De lo espiritual en el arte y funda con Franz Marc el Blaue Reiter, el Jinete Azul. La guerra lo devuelve a Rusia, donde participa en las instituciones artísticas de la revolución. De regreso a Alemania a finales de 1921, enseña en la Bauhaus de 1922 hasta su cierre por los nazis en 1933, en Weimar, Dessau y luego Berlín. Se instala entonces en Neuilly-sur-Seine, cerca de París, donde pinta hasta su muerte en 1944. Coleccionado muy pronto en Estados Unidos por Solomon R. Guggenheim, es uno de los artistas fundadores del museo que lleva su nombre."""
style = """
Kandinsky pasa de las manchas de color arremolinadas de sus años muniqueses a la geometría precisa del periodo de la Bauhaus y luego a las formas flexibles, casi biológicas, de sus últimos años parisinos. En todo momento compara la pintura con la música: colores y formas deben actuar directamente sobre el alma, como sonidos. Pintor y teórico, dio al arte abstracto sus primeros textos fundadores."""

[[artistes]]
nom = "Robert Delaunay"
vie = "París, 12 de abril de 1885 – Montpellier, 25 de octubre de 1941"
biographie = """
Criado en parte por unos tíos tras la separación de sus padres, Robert Delaunay se forma con un decorador de teatro antes de dedicarse a la pintura. Pasa por el neoimpresionismo, admira a Cézanne y luego se acerca al cubismo con sus series dedicadas a la iglesia de Saint-Séverin y a la torre Eiffel, a partir de 1909. En 1910 se casa con la pintora de origen ucraniano Sonia Terk, con quien lleva durante toda su vida una investigación común sobre el color. En 1911, Kandinsky lo invita a la primera exposición del Blaue Reiter en Múnich, donde es muy admirado. Sus Ventanas y sus Formas circulares, a partir de 1912, figuran entre las primeras pinturas no figurativas de Francia; Apollinaire bautiza como orfismo su pintura. Tras años pasados en España y Portugal durante la guerra, regresa a París, realiza en 1937 inmensos decorados para la Exposición Internacional y muere de cáncer en Montpellier en 1941."""
style = """
Delaunay hace del color el verdadero tema del cuadro. Apoyándose en las teorías del químico Chevreul sobre el contraste simultáneo, yuxtapone colores complementarios que vibran y crean el movimiento sin recurrir al dibujo. Sus discos y sus círculos de colores influyeron en los pintores del Blaue Reiter y abrieron el camino a una abstracción luminosa y alegre."""

[[artistes]]
nom = "Juan Gris"
vie = "Madrid, 23 de marzo de 1887 – Boulogne-sur-Seine, 11 de mayo de 1927"
biographie = """
José Victoriano González-Pérez estudia ingeniería en Madrid y luego se orienta hacia el dibujo. En 1906 se instala en París, en el Bateau-Lavoir, en Montmartre, donde ve nacer el cubismo en el taller de su vecino y compatriota Picasso. Para vivir, dibuja para periódicos satíricos como L'Assiette au beurre. Se dedica a la pintura a partir de 1910 y expone por primera vez en 1912, en el Salón de los Independientes. Ese mismo año experimenta con los papeles pegados y firma un contrato con el marchante Daniel-Henry Kahnweiler. Durante la guerra permanece en Francia, en gran pobreza, y se convierte en uno de los representantes más rigurosos del cubismo. En los años veinte crea decorados y trajes para los Ballets Rusos de Diaguilev y expone sus ideas en conferencias. Enfermo, muere en 1927 a los cuarenta años, en Boulogne-sur-Seine, dejando una obra de bodegones de gran claridad."""
style = """
Gris es el gran arquitecto del cubismo. Parte de una estructura abstracta, una rejilla de líneas y planos de colores, y hace aparecer en ella los objetos: decía en esencia que él hacía de un cilindro una botella, allí donde Cézanne hacía de una botella un cilindro. Sus colores francos, su composición calculada y la nitidez de sus formas marcaron el purismo y toda la pintura construida de los años veinte."""

[[artistes]]
nom = "Umberto Boccioni"
vie = "Reggio Calabria, 19 de octubre de 1882 – Verona, 17 de agosto de 1916"
biographie = """
Hijo de un funcionario a menudo trasladado, Umberto Boccioni crece en varias ciudades de Italia antes de instalarse en Roma a comienzos del siglo. Allí descubre, junto a Giacomo Balla, la pintura divisionista, hecha de toques de color puro, y se relaciona con Gino Severini. Tras viajes a París y a Rusia, se establece en Milán en 1907. En 1910 conoce al poeta Filippo Tommaso Marinetti, fundador del futurismo, y redacta con Carrà, Russolo, Balla y Severini el manifiesto de los pintores futuristas. Se convierte en su principal pintor y teórico, y participa en 1912 en la exposición que da a conocer el movimiento en París, Londres y Berlín. Se vuelve también hacia la escultura, publica un manifiesto sobre ese tema y en 1914 un libro, Pintura y escultura futuristas. Voluntario en 1915, muere en agosto de 1916, a los treinta y tres años, por una caída de caballo durante un ejercicio militar cerca de Verona."""
style = """
Boccioni quiere pintar el movimiento y la energía de la vida moderna en lugar de objetos inmóviles. Pasa de la pincelada dividida, en largos filamentos de color, a una construcción en planos y líneas de fuerza inspirada en el cubismo. Sus estados de ánimo, sus ciudades en obras y sus esculturas dinámicas hicieron del futurismo italiano una de las vanguardias mayores anteriores a 1914."""

[[artistes]]
nom = "Fernand Léger"
vie = "Argentan, 4 de febrero de 1881 – Gif-sur-Yvette, 17 de agosto de 1955"
biographie = """
Hijo de un ganadero normando, Fernand Léger se forma primero como dibujante de arquitectura y se instala en París en 1900. Descubre a Cézanne, frecuenta La Ruche, la colonia de artistas de Montparnasse, e inventa hacia 1911-1913 un cubismo hecho de formas tubulares y de contrastes de colores. Movilizado en 1914, es gaseado en Verdún en 1916. La experiencia del frente y de las máquinas transforma su arte: en los años veinte pinta la ciudad, los objetos y los trabajadores en colores puros, realiza la película Ballet mecánico en 1924 y participa en el movimiento del Esprit nouveau con Le Corbusier y Ozenfant. Enseña en su taller a numerosos alumnos llegados de todo el mundo. Refugiado en Estados Unidos de 1940 a 1945, regresa a Francia, ingresa en el partido comunista, multiplica las grandes composiciones, los mosaicos, las vidrieras y las cerámicas, y muere en 1955 en Gif-sur-Yvette."""
style = """
Léger pinta el mundo moderno con formas simples y poderosas: cilindros, contornos negros, superficies planas de colores vivos. Trata al hombre y a la máquina con la misma solidez y busca un arte claro, accesible a todos, a la escala del muro y de la ciudad. Su lenguaje influyó en el cartel, el diseño y el arte monumental del siglo XX."""

[[artistes]]
nom = "Kasimir Malevitch"
vie = "Kiev, 23 de febrero de 1879 – Leningrado, 15 de mayo de 1935"
biographie = """
Nacido en Kiev en una familia de origen polaco, Kasimir Malévich crece en el campo de Ucrania, cuyos iconos y arte popular lo marcan de forma duradera. Instalado en Moscú en 1907, pasa muy pronto del impresionismo al primitivismo inspirado en los campesinos y luego al cubofuturismo. En 1913 concibe los decorados de la ópera futurista Victoria sobre el Sol. En diciembre de 1915, en Petrogrado, presenta el Cuadrado negro y funda el suprematismo, una pintura de formas geométricas puras sobre fondo blanco. Tras la revolución de 1917, ocupa cargos oficiales, enseña en Vítebsk, donde funda el grupo Unovis, y dirige después un instituto de investigación en Leningrado. En 1927 expone en Varsovia y en Berlín y deja allí parte de sus obras. Sospechoso a ojos del régimen estalinista, brevemente detenido en 1930, vuelve a una pintura figurativa antes de morir de cáncer en 1935."""
style = """
Malévich reduce la pintura a sus elementos primeros: el cuadrado, el círculo, la cruz, el color puro flotando sobre un espacio blanco infinito. El suprematismo quiere expresar la sensación pura, más allá de todo objeto. Su Cuadrado negro se ha convertido en el símbolo de la ruptura radical del arte moderno, y su obra influyó en el constructivismo, el diseño y el arte minimalista."""

[[artistes]]
nom = "Piet Mondrian"
vie = "Amersfoort (Países Bajos), 7 de marzo de 1872 – Nueva York, 1 de febrero de 1944"
biographie = """
Hijo de un maestro de escuela calvinista, Pieter Mondriaan se forma en la Academia de Bellas Artes de Ámsterdam y pinta al principio paisajes holandeses, molinos, árboles y pólderes. Próximo a la teosofía, descubre el cubismo en París, donde vive de 1912 a 1914 y simplifica la ortografía de su nombre en Mondrian. Bloqueado en los Países Bajos durante la guerra, funda en 1917 con Theo van Doesburg la revista De Stijl, que da nombre al movimiento. De regreso a París en 1919, elabora el neoplasticismo: líneas negras, colores primarios y blanco. Su taller de la rue du Départ, dispuesto como una de sus composiciones, se convierte en lugar de peregrinación para los artistas. Se enemista con Van Doesburg, que introduce la diagonal. En 1938, la amenaza de la guerra lo empuja hacia Londres y luego, en 1940, hacia Nueva York, cuyo jazz y cuyos ritmos inspiran sus últimos lienzos. Allí muere de una neumonía en 1944."""
style = """
Mondrian llevó la abstracción a su punto más depurado: únicamente líneas horizontales y verticales, los tres colores primarios, el blanco, el negro y el gris. Sus composiciones asimétricas buscan un equilibrio dinámico, imagen de una armonía universal. Han marcado de forma duradera la arquitectura, el diseño, la tipografía y la moda."""

[[artistes]]
nom = "Paul Klee"
vie = "Münchenbuchsee (Suiza), 18 de diciembre de 1879 – Muralto (Suiza), 29 de junio de 1940"
biographie = """
Hijo de un profesor de música alemán y de una cantante suiza, Paul Klee crece en Berna y duda durante mucho tiempo entre la música y la pintura. Estudia en Múnich, donde se instala y se relaciona con Kandinsky y los artistas del Blaue Reiter. En 1914, un viaje a Túnez con August Macke y Louis Moilliet le revela el color: anota entonces en su diario que el color y él ya son uno solo. Movilizado durante la guerra, es llamado en 1921 a la Bauhaus, en Weimar y luego en Dessau, donde enseña diez años y es vecino de Kandinsky. Profesor en la Academia de Düsseldorf a partir de 1931, es despedido por los nazis en 1933 y regresa a Berna. Afectado por una grave enfermedad de la piel, la esclerodermia, pinta sin embargo con una energía nueva cientos de obras en sus últimos años, antes de morir en 1940 en el Tesino."""
style = """
Klee inventa un universo poético en el que se mezclan signos, escrituras, figuras, paisajes y arquitecturas imaginarias. Pasa libremente de la abstracción al dibujo casi infantil, con humor y fantasía, pero apoyándose en una reflexión teórica muy rigurosa sobre la línea, el color y el ritmo, inspirada en la música. Su inmensa obra, de más de nueve mil números, influyó en el surrealismo y en la abstracción de posguerra."""

[[artistes]]
nom = "Kurt Schwitters"
vie = "Hannover, 20 de junio de 1887 – Kendal (Inglaterra), 8 de enero de 1948"
biographie = """
Hijo de acomodados comerciantes de Hannover, Kurt Schwitters estudia pintura en la Academia de Dresde. Durante la guerra, trabaja como dibujante industrial en una fábrica. En 1919 inventa Merz, un arte hecho con todos los materiales, desechos incluidos, y expone sus primeros cuadros-collage en Berlín, en la galería Der Sturm. Rechazado por los dadaístas berlineses, crea su propio dadá en Hannover con su revista Merz, sus poemas, entre ellos la Ursonate, una sonata hecha de sonidos sin significado, y sus espectáculos. En su casa construye durante años el Merzbau, una arquitectura interior que invade varias habitaciones. Calificado de artista degenerado por los nazis, huye a Noruega en 1937 y luego a Gran Bretaña en 1940, donde es internado varios meses en la isla de Man. Termina sus días en la región de los Lagos, donde empieza un último Merzbau en un granero, y muere en Kendal en 1948. El Merzbau de Hannover fue destruido por un bombardeo en 1943."""
style = """
Schwitters hace arte con todo: billetes, etiquetas, madera, cordeles, palabras y sonidos. Pero sus collages siguen siendo composiciones rigurosas, en las que cada fragmento cuenta por su color y su forma, en la encrucijada del dadá y el constructivismo. Su práctica del ensamblaje y de la instalación abrió el camino al pop art, a los nuevos realistas y al arte de hoy."""
