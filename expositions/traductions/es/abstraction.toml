[[oeuvres]]
titre = "Senecio"
artiste = "Paul Klee"
annee = "1922"
image = "senecio.jpg"
technique = "Óleo sobre gasa pegada sobre cartón, 40,5 × 38 cm"
collection = "Kunstmuseum Basel, Basilea"
note = "Una cabeza redonda como una luna, hecha de cuadrados de color: un viejo travieso, entre máscara de teatro y juego de niños."
description = """
Sobre un fondo anaranjado, una gran cabeza perfectamente redonda ocupa casi toda la superficie. Está recortada en rectángulos de colores suaves: amarillo, rosa, blanco, ocre. Dos ojos redondos y rojos miran al espectador. No son iguales: sobre el ojo izquierdo se alza un triángulo blanco, como una ceja levantada, mientras que el ojo derecho está rematado por un fino arco verde. La nariz no es más que una línea, la boca dos pequeños cuadrados violetas. El cuello es un apilamiento de rectángulos de colores, y los hombros, abajo, dibujan un gran arco. A la izquierda se lee la firma de Klee y el año 1922."""
evocation = """
El título juega con las palabras: senecio, el senecio o hierba cana, es una planta cuyo nombre latino viene de senex, el anciano, y el subtítulo alemán Baldgreis significa más o menos pronto anciano. El rostro tiene algo de payaso, de máscara de teatro y de marioneta, que Klee gustaba de fabricar para su hijo Felix. La asimetría de los ojos le da una expresión a la vez asombrada, escéptica y divertida. En él se ha visto a veces un autorretrato disfrazado. Klee muestra que un rostro puede nacer de unas pocas formas geométricas y que el color solo puede expresar un carácter, con un humor y una libertad próximos al dibujo infantil, pero muy sabios."""
histoire = """
Klee pinta Senecio en 1922 en Weimar, donde enseña en la Bauhaus desde 1921. Da allí cursos sobre la forma y el color y reencuentra, en 1922, a Kandinsky, su amigo desde la época del Blaue Reiter. Meticuloso, Klee inscribe cada una de sus obras en un catálogo personal: esta lleva el número 181 del año 1922, visible junto a su firma. El cuadro es hoy uno de los más conocidos del Kunstmuseum de Basilea. En 1933, los nazis expulsarán a Klee de su puesto de profesor en Düsseldorf; se refugia entonces en Berna, su ciudad natal, y varias de sus obras se exhibirán como arte degenerado en 1937."""
facture = """
Klee pinta al óleo sobre una gasa, un tejido ligero, preparada y luego pegada sobre cartón. La superficie rugosa y raspada en algunos puntos deja ver la trama y da a los colores un aspecto mate y polvoriento, próximo al fresco. El círculo del rostro, trazado como con compás, está dividido en un tablero irregular de tonos cálidos y claros, que recuerda sus cuadros de cuadrados de colores. El color es el verdadero tema: Klee estudia, en la Bauhaus, la forma en que los tonos vecinos se responden y se modifican."""
details = [
  "El triángulo blanco sobre el ojo izquierdo, como una ceja levantada.",
  "La fina ceja verde, en arco, sobre el ojo derecho.",
  "Los dos pequeños cuadrados violetas que forman la boca.",
  "La firma y el número 1922 / 181, a la izquierda del rostro.",
]
themes = ["rostro", "máscara", "humor", "color", "bauhaus"]
anecdote = """
Klee era también un excelente violinista. De joven, tocó en la orquesta de Berna y dudó entre la música y la pintura. Se casó con una pianista, Lily Stumpf, y la música alimentó toda su reflexión sobre el ritmo en la pintura."""
