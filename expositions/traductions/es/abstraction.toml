[[oeuvres]]
titre = "Composición con rojo, azul y amarillo"
artiste = "Piet Mondrian"
annee = "1930"
image = "composition-rouge-bleu-jaune.jpg"
technique = "Óleo sobre lienzo, 45 × 45 cm"
collection = "Kunsthaus Zürich"
note = "Tres colores primarios, blanco y líneas negras: la forma más célebre del neoplasticismo, pintada en París para un amigo arquitecto."
description = """
Un gran cuadrado rojo ocupa casi todo el cuarto superior derecho, sobrepasando ampliamente el centro. Está bordeado a la izquierda y abajo por gruesas líneas negras, verticales y horizontales, que recortan el resto del lienzo en rectángulos. Abajo a la izquierda, un pequeño rectángulo azul; abajo a la derecha, minúsculo, un rectángulo amarillo, rematado por un corto trazo negro. Las demás superficies son blancas. Algunas líneas negras se detienen antes del borde, otras lo tocan. No hay diagonal, ni curva, ni sombra: solo rectas que se cruzan en ángulo recto y tres colores primarios. Abajo a la izquierda, en el azul, se distinguen las iniciales PM y la fecha 30."""
evocation = """
Mondrian busca una armonía universal, más allá de las apariencias: la horizontal y la vertical, el color y lo no coloreado, lo grande y lo pequeño deben equilibrarse. Este equilibrio nunca es simétrico: la masa roja es contrarrestada por los pequeños rectángulos azul y amarillo, como pesos en una balanza. Nutrido de teosofía, el pintor veía en estas relaciones puras la imagen de una sociedad futura apaciguada, en la que el arte se fundiría con la arquitectura y con la vida. Su pintura, de una sencillez extrema en apariencia, ha marcado profundamente la arquitectura, el diseño, la moda y el diseño gráfico del siglo XX."""
histoire = """
Mondrian pinta este lienzo en París, en su taller de la rue du Départ, a petición del arquitecto zuriqués Alfred Roth, que había trabajado con Le Corbusier. En el reverso escribe una dedicatoria fechada el 30 de enero de 1930, en la que afirma que contar solo con las relaciones, buscando su equilibrio en el arte y en la vida, es preparar el futuro. Retoma después la misma composición en otras versiones, agrandándola cada vez cinco centímetros sin cambiar el ancho de las líneas negras. Roth lo conservó casi sesenta años antes de donarlo al Kunsthaus de Zúrich en 1987."""
facture = """
A pesar de su aire mecánico, todo está pintado a mano. De cerca se ven la huella del pincel, las sucesivas capas de blanco, ligeros craquelados. Las líneas negras no tienen todas el mismo grosor, y Mondrian ajustó largamente su posición a lo largo de sus ensayos. Los colores se aplican en superficies puras, sin mezcla. El pequeño formato, de 45 centímetros de lado, concentra la tensión entre la gran superficie roja y los demás planos."""
details = [
  "Las iniciales PM y la fecha 30, pintadas abajo a la izquierda, en el azul.",
  "El pequeño rectángulo amarillo, abajo a la derecha, rematado por un trazo negro.",
  "Las líneas negras que se detienen antes del borde del lienzo.",
  "Los finos craquelados y la huella del pincel en los blancos.",
]
themes = ["neoplasticismo", "colores primarios", "equilibrio", "de stijl", "geometría"]
anecdote = """
En 1965, el modisto Yves Saint Laurent presenta una colección de vestidos rectos de punto inspirados en las composiciones de Mondrian, con sus líneas negras y sus bloques de colores primarios: los vestidos Mondrian se convierten en una de las imágenes de la moda de los años sesenta."""
