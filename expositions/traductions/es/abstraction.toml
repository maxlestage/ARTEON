[[oeuvres]]
titre = "Das Undbild (El cuadro-y)"
artiste = "Kurt Schwitters"
annee = "1919"
image = "das-undbild.jpg"
technique = "Ensamblaje: papeles, cartón, madera y metal, con gouache, sobre cartón, 35,8 × 28 cm"
collection = "Staatsgalerie Stuttgart"
note = "Desechos de la ciudad pegados y clavados: uno de los primeros cuadros Merz de Schwitters, el arte de unirlo todo con un simple «y»."
description = """
El cuadro es un ensamblaje de objetos encontrados. Arriba, sobre un papel ocre, destaca una gran palabra en letras negras: und, es decir, «y». A la izquierda, una amplia forma blanca y curva, como una vela o una luna creciente, atraviesa la composición. En el centro derecha, un triángulo azul vivo atrae la mirada. Alrededor se amontonan fragmentos de etiquetas, billetes y periódicos, entre ellos una dirección comercial, E. Sökeland & Söhne, Berlin N.W. 21, el número 97 y, abajo, el fragmento de una palabra impresa en grandes letras, ferde. Unas varillas de madera, clavos, una arandela y piezas de metal están fijados al soporte, y una gran curva oscura cierra el ángulo inferior derecho."""
evocation = """
La palabra und, «y», da su título al cuadro y expresa su principio: unir lo que no estaba hecho para ir junto. Para Schwitters, el arte Merz consiste en combinar todos los materiales posibles, nobles o no, y en darles el mismo valor. En la Alemania vencida de 1919, donde todo parece por reconstruir, recoge los restos de la ciudad, billetes, envoltorios, trozos de madera, para hacer con ellos un mundo nuevo. A menudo se ve en ello el espíritu dadá, irónico y antiburgués, pero Schwitters sigue siendo ante todo un compositor atento al equilibrio de las formas y los colores: su dadá es constructivo y poético más que destructor."""
histoire = """
Durante la guerra, Schwitters trabaja como dibujante industrial en una fábrica cerca de Hannover. En 1919 inventa la palabra Merz y presenta sus primeros cuadros Merz en Berlín, en la galería Der Sturm de Herwarth Walden, un lugar clave de la vanguardia. Das Undbild data de este año decisivo. El club dadá de Berlín se niega a acogerlo, pero él se relaciona con Hans Arp, Raoul Hausmann y Tristan Tzara, y hará de Hannover una capital dadá él solo. Calificado de artista degenerado por los nazis, abandona Alemania en 1937. El cuadro pertenece hoy a la Staatsgalerie de Stuttgart."""
facture = """
Schwitters pega, clava y pinta. Papeles impresos, cartón, madera y metal se ensamblan y luego se unen con la pintura, que unifica los colores y suaviza las transiciones. La composición irradia desde el centro en grandes diagonales, a la manera de los cuadros cubistas y futuristas. La gama, hecha de pardos, ocres y blancos, se realza con el brillo del azul. Las letras impresas se tratan como formas de pleno derecho, y el relieve de los objetos hace salir el cuadro de la superficie plana."""
details = [
  "La palabra und en grandes letras negras, arriba del todo.",
  "La etiqueta E. Sökeland & Söhne, Berlin N.W. 21, a la izquierda.",
  "El número 97, a la derecha del triángulo azul.",
  "Los clavos, las varillas de madera y la gran curva oscura abajo a la derecha.",
]
themes = ["dadá", "collage", "merz", "tipografía", "recuperación"]
anecdote = """
La palabra Merz procede de un fragmento de publicidad del Commerz- und Privatbank, un banco alemán, que Schwitters había recortado y pegado en un cuadro de 1919. Hizo de ella el nombre de todo su arte, de su revista e incluso de sí mismo."""
