[[oeuvres]]
titre = "Cuadrado negro"
artiste = "Kasimir Malevitch"
annee = "1915"
image = "carre-noir.jpg"
technique = "Óleo sobre lino, 79,5 × 79,5 cm"
collection = "Galería Tretiakov, Moscú"
note = "El punto cero de la pintura: un cuadrado negro sobre fondo blanco, colgado en 1915 en lugar de un icono."
description = """
Sobre un lienzo cuadrado, un gran cuadrilátero negro está colocado en el centro de un fondo blanco, que lo rodea con un amplio margen. Nada más: ni objeto, ni horizonte, ni sombra. De cerca, sin embargo, el cuadrado no es ni perfectamente cuadrado ni perfectamente negro. Sus lados no son del todo paralelos, sus ángulos no son del todo rectos. Su superficie está cubierta de una red tupida de craquelados, a través de los cuales afloran colores más claros, rojizos o crema, procedentes de las capas pintadas debajo. El blanco del fondo, también agrietado, ha adquirido con el tiempo un tono gris y amarillento. El cuadro ha envejecido como un objeto antiguo."""
evocation = """
Malévich llama suprematismo a la supremacía de la sensación pura en el arte: la pintura se libera de la obligación de representar. El cuadrado negro es para él el punto cero de las formas, el origen a partir del cual todo puede reconstruirse. Al colgarlo en el ángulo superior de la sala, lugar reservado a los iconos en las casas rusas, hace de él una imagen sagrada de un género nuevo. En él se ha visto un gesto de tabla rasa, incluso de nihilismo, pero también una experiencia mística, una ventana abierta al infinito. Pintado en plena guerra, dos años antes de la revolución, el cuadrado se ha convertido en el icono mismo del arte moderno."""
histoire = """
El cuadro se muestra por primera vez en diciembre de 1915 en Petrogrado, en la Última exposición futurista de cuadros 0,10, donde Malévich presenta sus primeras obras suprematistas. Más tarde lo fechará en 1913, para vincularlo con los decorados que había concebido para la ópera futurista Victoria sobre el Sol. Pintará otras versiones en los años veinte y a principios de los treinta. A su muerte, en 1935, se fija un cuadrado negro en el coche fúnebre. Conservado en la Galería Tretiakov, este primer cuadrado, muy frágil, fue estudiado con rayos X en 2015: dos composiciones anteriores, una cubofuturista, otra protosuprematista, están ocultas bajo el negro."""
facture = """
Malévich pintó su cuadrado a mano alzada, sin regla estricta, sobre composiciones más antiguas. El negro está hecho de varias capas, de ahí el craquelado que hoy revela los tonos de debajo. El fondo blanco no es el lienzo desnudo, sino una capa pintada, también trabajada con pincel. La irregularidad de los bordes, visible de cerca, da al cuadrado una ligera vibración: no es una figura de geometría, sino una forma viva, colocada sobre un espacio blanco que parece sin límite."""
details = [
  "La red de craquelados que cubre toda la superficie negra.",
  "Los colores claros que afloran en las grietas del negro.",
  "Los bordes del cuadrado, ligeramente irregulares y no del todo paralelos.",
  "El margen blanco, también agrietado y amarilleado por el tiempo.",
]
themes = ["suprematismo", "monocromo", "icono", "geometría", "revolución"]
anecdote = """
En 2015, los investigadores de la Galería Tretiakov descifraron en el margen blanco una inscripción a lápiz atribuida a Malévich: una alusión a una broma de Alphonse Allais, que había publicado en 1897 un rectángulo negro humorístico."""
