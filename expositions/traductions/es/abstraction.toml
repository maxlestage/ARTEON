[[oeuvres]]
titre = "Los Diez Mayores, n.º 7, La edad adulta"
artiste = "Hilma af Klint"
annee = "1907"
image = "dix-plus-grandes-7.jpg"
technique = "Temple sobre papel pegado sobre lienzo, 315 × 235 cm"
collection = "Fundación Hilma af Klint, Estocolmo"
note = "Una abstracción de más de tres metros, pintada años antes que las de Kandinsky, y que permaneció oculta durante casi ochenta años."
description = """
Sobre un fondo malva pálido se alza una inmensa forma amarilla, compuesta por dos masas superpuestas que solo se tocan en un punto, en el centro del cuadro, como un reloj de arena o una semilla que se abre. La masa superior, marcada con los números romanos I y II, está recorrida por husos trazados en rojo, rosa, blanco y punteado negro; la inferior, numerada III, está rayada de líneas negras que se estrechan hacia abajo. Alrededor flotan motivos más pequeños: discos verdes y amarillos arriba, hojas rojas en forma de trébol a la izquierda, una flor negra, huevos, espirales y bucles blancos que parecen una escritura. Abajo del todo, bajo un friso negro, una palabra está trazada en letra cursiva: vestalasket."""
evocation = """
Los Diez Mayores cuentan las edades de la vida humana: dos cuadros para la infancia, dos para la juventud, cuatro para la edad adulta y dos para la vejez. Este pertenece a la madurez, y en él se ha visto una imagen de la plenitud: formas que crecen, se desdoblan y florecen como organismos vivos. Las letras, las palabras inventadas y los colores responden a un vocabulario simbólico personal, nutrido de teosofía y de botánica; los historiadores leen en ellos, en particular, la unión de los contrarios, de lo masculino y lo femenino. Para Hilma af Klint, la pintura debía hacer visible un mundo espiritual invisible. Su redescubrimiento, desde los años ochenta, ha trastocado la historia de la abstracción, durante mucho tiempo contada sin ella y sin las mujeres."""
histoire = """
Desde los años 1890, Hilma af Klint participa con otras cuatro amigas, el grupo de las Cinco, en sesiones espiritistas. En 1906 emprende lo que describe como un encargo recibido de guías espirituales: las Pinturas para el templo, un ciclo de 193 obras concluido en 1915. Los Diez Mayores constituyen su corazón; los pinta en otoño de 1907, a un ritmo muy rápido, en su taller de Estocolmo. Solo los muestra a unos pocos allegados y pide que sus obras abstractas no se expongan hasta veinte años después de su muerte. Conservadas por su sobrino y luego por una fundación, aparecen en 1986 en Los Ángeles, en la exposición The Spiritual in Art, y triunfan después en el Moderna Museet de Estocolmo en 2013 y en el Guggenheim de Nueva York en 2018."""
facture = """
El cuadro está pintado al temple sobre grandes hojas de papel ensambladas y luego pegadas sobre lienzo: un formato gigante que la artista trabajaba colocado en el suelo. Los colores se extienden en superficies planas, sin modelado ni sombra, y se delimitan con contornos nítidos. La paleta, hecha de malva, amarillo dorado, verde y rosa, no tiene nada de la pintura académica de su tiempo. Formada en la Real Academia de Bellas Artes de Estocolmo, Hilma af Klint era también una dibujante botánica precisa: se nota en la regularidad de las curvas y en la simetría de la composición, organizada a lo largo de un eje vertical."""
details = [
  "Los números romanos I, II y III, colocados sobre las grandes formas amarillas.",
  "El punto único donde se tocan las dos masas, en el centro del cuadro.",
  "A la izquierda, el tallo rojo que lleva hojas en forma de trébol.",
  "A la derecha, unos bucles blancos que parecen formar una escritura desconocida.",
  "Abajo del todo, la palabra vestalasket trazada en letra cursiva.",
]
themes = ["edades de la vida", "espiritualidad", "botánica", "símbolos", "abstracción"]
anecdote = """
La exposición de Hilma af Klint presentada en el Guggenheim de Nueva York en 2018 y 2019, donde la serie de Los Diez Mayores estaba colgada a lo largo de la rampa de la rotonda, atrajo a más de 600 000 visitantes: se convirtió en la más visitada de toda la historia del museo."""
salle = 2
mur = "nord"
place = 4
largeur = 2.35

[[oeuvres]]
titre = "Composición VIII"
artiste = "Vassily Kandinsky"
annee = "1923"
image = "composition-viii.jpg"
technique = "Óleo sobre lienzo, 140 × 201 cm"
collection = "Solomon R. Guggenheim Museum, Nueva York"
note = "Pintada en la Bauhaus de Weimar en julio de 1923: círculos, triángulos y líneas rectas suenan como los instrumentos de una orquesta."
description = """
Sobre un fondo claro, crema y azulado, sin horizonte ni objeto reconocible, flotan decenas de formas geométricas. Arriba a la izquierda, un gran círculo negro de corazón violeta, rodeado de un halo rosa, domina el lienzo, acompañado de un pequeño disco rojo. En el centro se alza un gran triángulo con la punta hacia arriba, atravesado por líneas. Unos tableros de ajedrez negros y blancos, o coloreados, se lanzan en diagonal; una hilera de semicírculos se alinea debajo como una sucesión de arcos. A la derecha, haces de rectas paralelas suben hacia lo alto, entre pequeños círculos transparentes, y una rejilla de líneas finas se destaca sobre el fondo. En otros puntos, discos amarillos, azules o violetas, a menudo con aureola, puntúan la superficie como notas."""
evocation = """
Kandinsky concebía la pintura como una música para los ojos: llama Impresiones, Improvisaciones y Composiciones a sus lienzos abstractos, y reserva este último título para sus obras más meditadas. Aquí, cada forma tiene su voz: el ángulo agudo del triángulo, la tensión de las rectas, la calma de los círculos. El gran círculo negro y rosa, arriba a la izquierda, ha sido a menudo comparado con un astro que rige todo el cuadro; Kandinsky escribirá más tarde que el círculo reúne en sí las mayores oposiciones. Comparado con los torbellinos de color anteriores a 1914, el lienzo atestigua un giro: al contacto con el constructivismo ruso y luego con la Bauhaus, la emoción pasa ahora por una geometría precisa, sin perder nada de su lirismo."""
histoire = """
De regreso a Alemania a finales de 1921 tras siete años en Rusia, Kandinsky es llamado en 1922 por el arquitecto Walter Gropius a la Bauhaus de Weimar, la escuela que quiere reunir el arte, la artesanía y la industria. Enseña allí la forma y el color y pinta esta octava Composición en julio de 1923. A partir de 1930, el magnate estadounidense Solomon R. Guggenheim, guiado por la artista y asesora Hilla Rebay, visita a Kandinsky y compra buen número de sus lienzos. Composición VIII ingresa en su fundación, creada en 1937, y después en el Museum of Non-Objective Painting abierto en Nueva York en 1939, antecesor del actual Guggenheim: ha seguido siendo uno de sus emblemas."""
facture = """
Las formas se trazan con regla y compás y luego se rellenan con colores aplicados en superficies planas y nítidas, sin empastes. El fondo claro, ligeramente matizado, crea un espacio sin profundidad fija en el que los elementos parecen flotar a distancias distintas. El pintor juega con los contrastes: líneas negras finísimas frente a amplias superficies, bordes cortantes frente a halos difuminados, como alrededor del gran círculo. No hay ni centro único ni simetría: el equilibrio nace de tensiones que se compensan, que Kandinsky analizará en su libro Punto y línea sobre el plano, publicado por la Bauhaus en 1926."""
details = [
  "El halo rosa, difuminado, que rodea el gran círculo negro arriba a la izquierda.",
  "Los tableros de ajedrez negros y blancos, colocados en diagonal a la izquierda del triángulo central.",
  "La hilera de semicírculos alineados como arcos, bajo el centro del lienzo.",
  "La pequeña rejilla de líneas finas, a la derecha, con sus cuadrados rosas.",
]
themes = ["música", "geometría", "círculo", "bauhaus", "abstracción"]
anecdote = """
Kandinsky pintó diez grandes Composiciones entre 1910 y 1939. Las tres primeras fueron destruidas durante la Segunda Guerra Mundial: solo se las conoce por fotografías en blanco y negro."""
salle = 2
mur = "nord"
place = 2
largeur = 2.0

[[oeuvres]]
titre = "La Torre Eiffel roja"
artiste = "Robert Delaunay"
annee = "1911–1912"
image = "tour-eiffel-rouge.jpg"
technique = "Óleo sobre lienzo, 125 × 90,3 cm"
collection = "Solomon R. Guggenheim Museum, Nueva York"
note = "El símbolo del París moderno se retuerce y se fragmenta bajo la luz: una de las Torres de Delaunay, entre cubismo y color puro."
description = """
La torre Eiffel, pintada de un rojo ladrillo, ocupa toda la altura del lienzo. Sus cuatro pilares se separan ampliamente hacia abajo, como vistos desde abajo, mientras que la cima, estrecha, toca el borde superior. Su silueta no es recta: la primera plataforma se retuerce, los montantes se doblan, y la torre parece vacilar. A su alrededor, los edificios de París se reducen a facetas grises, azules y blancas que encajan unas en otras. A la derecha, gruesas nubes blancas se enroscan en bolas; arriba, unos paños azul oscuro enmarcan la escena como cortinas corridas ante una ventana. Abajo a la derecha, una gran curva amarillo pálido se desliza a lo largo del borde, cerca de la firma del pintor."""
evocation = """
Para Delaunay, la torre de 1889 es el emblema del mundo nuevo: el hierro, el ingeniero, la ciudad gigante, la telegrafía sin hilos cuya antena está instalada en su cima. Al quebrarla, no la destruye, sino que busca pintar la experiencia de quien la mira: el vértigo, la cabeza que se levanta y se baja, los puntos de vista que se superponen. El propio pintor calificó de destructiva esta etapa, en la que la arquitectura se disloca bajo el efecto de la luz. En ella se ha visto una celebración alegre de la modernidad, pero también el presentimiento de un mundo inestable en vísperas de la Gran Guerra. Sus amigos poetas, Apollinaire y Blaise Cendrars, cantarán también la torre."""
histoire = """
Delaunay pinta la torre Eiffel a partir de 1909 y vuelve a ella sin cesar hasta finales de los años veinte. En 1910 se casa con la pintora Sonia Terk, con quien llevará a cabo todas sus investigaciones sobre el color. En primavera de 1911, sus Torres se cuelgan en el Salón de los Independientes en la sala de los cubistas; ese mismo año, Kandinsky lo invita a la primera exposición del Blaue Reiter, en Múnich, donde sus lienzos impresionan a los jóvenes pintores alemanes. En 1912, Apollinaire inventa para él la palabra orfismo, que designa una pintura en la que el color solo se convierte en el tema. Esta versión roja, pintada en 1911 y 1912, pertenece hoy al Guggenheim de Nueva York, que conserva varias Torres de Delaunay."""
facture = """
Delaunay toma del cubismo la fragmentación en facetas y la multiplicación de los puntos de vista, pero rechaza los tonos pardos y grises de Picasso y Braque: el rojo vivo de la torre estalla contra los azules y los blancos. La pincelada es libre, visible, aplicada por planos cortos. La composición se basa en un contraste de colores complementarios y en un movimiento giratorio, subrayado por las curvas de las nubes y del borde derecho. La herencia de Cézanne, a quien Delaunay admiraba, se lee en la construcción de las casas en pequeños cubos."""
details = [
  "La primera plataforma de la torre, retorcida como si se escabullera.",
  "Las gruesas nubes blancas en bolas, a la derecha, sobre los tejados.",
  "Los paños azul oscuro de arriba, que recuerdan a unas cortinas.",
  "La firma del pintor, abajo a la derecha, junto a la curva amarillo pálido.",
]
themes = ["parís", "torre eiffel", "ciudad moderna", "orfismo", "movimiento"]
anecdote = """
Construida para la Exposición Universal de 1889 y destinada a ser demolida al cabo de veinte años, la torre Eiffel se salvó gracias a la radio: su antena de telegrafía sin hilos la hacía demasiado útil. Siguió siendo la construcción más alta del mundo hasta 1930."""
salle = 2
mur = "sud"
place = 2
largeur = 1.05

[[oeuvres]]
titre = "Retrato de Pablo Picasso"
artiste = "Juan Gris"
annee = "1912"
image = "portrait-de-picasso.jpg"
technique = "Óleo sobre lienzo, 93,3 × 74,4 cm"
collection = "Art Institute of Chicago"
note = "El joven Gris rinde homenaje a su mayor y vecino del Bateau-Lavoir, paleta en mano: su primer gran lienzo cubista."
description = """
Un hombre de cabello negro y corto está sentado, con el busto vuelto hacia la izquierda y el rostro de tres cuartos. Sus rasgos están recortados en facetas: la nariz, los ojos y la boca se repiten ligeramente desplazados, como vistos desde varios ángulos. Lleva una camisa clara y una chaqueta azul, cuyos grandes botones redondos resaltan como pequeños relieves. En la mano derecha, abajo a la derecha, sostiene una paleta cargada de manchas de azul, amarillo, rojo y negro: es un pintor trabajando. Tras él, el fondo no está hecho más que de triángulos y rombos grises, beige y azules, recortados por grandes oblicuas regulares. Abajo a la derecha, una inscripción dedica el lienzo a Pablo Picasso."""
evocation = """
Este retrato es a la vez un homenaje y una declaración. Homenaje a Picasso, inventor del cubismo junto con Braque, a quien Gris ve trabajar cada día en el Bateau-Lavoir; declaración de independencia también, pues Gris afirma en él una manera propia, más clara, más ordenada, casi matemática. Los historiadores subrayan cuánto contrasta este cubismo riguroso con el, más intuitivo, de sus mayores: allí donde Picasso y Braque disuelven las formas en una bruma de facetas, Gris construye una rejilla luminosa. Al mostrar a su modelo con la paleta en la mano, celebra al pintor como inventor de formas nuevas, en el momento mismo en que él entra en la historia de la vanguardia."""
histoire = """
Nacido en Madrid, Gris llega a París en 1906 y se instala en el Bateau-Lavoir, la colonia de talleres de Montmartre donde vive Picasso. Se gana la vida al principio dibujando para periódicos satíricos y no se dedica realmente a la pintura hasta 1910. En primavera de 1912 presenta este retrato en el Salón de los Independientes: es su primera aparición pública, y la crítica advierte enseguida a este recién llegado del cubismo. Poco después, el marchante Daniel-Henry Kahnweiler, el de Picasso y Braque, lo contrata. El cuadro se halla hoy en el Art Institute de Chicago, gracias a la donación del coleccionista Leigh B. Block."""
facture = """
Todo el lienzo se apoya en una red de grandes líneas oblicuas, paralelas y espaciadas con regularidad, que lo recortan en bandas y rombos. En cada casilla, Gris trata por separado la luz y la sombra, lo que hace vibrar los volúmenes como un cristal. La paleta se restringe a los azules, los grises y los pardos, con algunas notas cálidas en el rostro y la paleta. La pintura se aplica en pequeños toques apretados, casi puntillistas, que dan a la superficie una textura regular."""
details = [
  "La paleta sostenida abajo a la derecha, con sus manchas de color puro.",
  "Los botones de la camisa, dibujados como pequeños círculos en relieve.",
  "El rostro desdoblado, cuyos ojos parecen vistos desde dos ángulos.",
  "La inscripción abajo a la derecha, que dedica el cuadro a Pablo Picasso.",
]
themes = ["retrato", "cubismo", "pintor", "amistad", "geometría"]
anecdote = """
Juan Gris es un nombre adoptado: el pintor se llamaba José Victoriano González-Pérez. Murió a los cuarenta años, en 1927, de una enfermedad de los riñones, tras haber dibujado decorados y trajes para los Ballets Rusos de Diaguilev."""
salle = 3
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "La ciudad que sube"
artiste = "Umberto Boccioni"
annee = "1910"
image = "ville-qui-monte.jpg"
technique = "Óleo sobre lienzo, 199,3 × 301 cm"
collection = "Museum of Modern Art, Nueva York"
note = "Uno de los primeros grandes cuadros futuristas: caballos, obreros y obras arrastrados por la misma energía, en la periferia de Milán."
description = """
En el centro del lienzo, un gigantesco caballo rojo, de collar azul, se lanza con la cabeza baja hacia la izquierda, tan grande que ocupa casi todo el ancho. Unos hombres minúsculos se aferran a sus riendas y se inclinan hacia atrás con todo su peso, con los brazos tensos, para retenerlo. A la izquierda, otro caballo, blanco, se encabrita en una explosión de crines. Al fondo, bajo un cielo pálido, se alzan edificios en construcción cubiertos de andamios, chimeneas de fábrica que humean y siluetas de tranvías. Hombres, bestias y decorado se disuelven en estelas de luz: todo parece arrastrado por un mismo torbellino, de abajo arriba y de derecha a izquierda."""
evocation = """
Boccioni explica que quiso hacer en él una gran síntesis del trabajo, de la luz y del movimiento. El tema es la ciudad moderna en vías de nacer: la periferia de Milán, sus obras y sus fábricas. El caballo, fuerza antigua, y el obrero, nuevo héroe, se unen para construir el futuro. El cuadro ilustra el culto futurista a la energía, la velocidad y la máquina, proclamado por el poeta Marinetti en 1909. En él se ha visto un himno optimista al progreso; con la distancia, se lee también la fascinación por la fuerza y la violencia que llevará a buen número de futuristas a exaltar la guerra."""
histoire = """
Boccioni pinta este lienzo en Milán en 1910 y a principios de 1911, pocos meses después de haber firmado con Carrà, Russolo, Balla y Severini el manifiesto de los pintores futuristas. El cuadro, presentado al principio con el título El trabajo, se expone en Milán en 1911 y después, en 1912, en la exposición itinerante de los futuristas, que causa escándalo en París, Londres y Berlín. Durante esta gira, lo compra el compositor Ferruccio Busoni; Boccioni hará su retrato en 1916, pocas semanas antes de morir. El Museum of Modern Art de Nueva York lo adquiere en 1951."""
facture = """
Boccioni utiliza la pincelada dividida que aprendió en Roma junto a Giacomo Balla: largos filamentos de color puro, colocados uno junto a otro, que siguen las líneas de fuerza del movimiento en lugar de describir los objetos. El rojo del caballo se opone al azul de su collar y a los blancos luminosos. La gran diagonal que parte de abajo arrastra todo el cuadro. El formato, de tres metros de ancho, es el de las grandes pinturas de historia: la figuración subsiste todavía, pero se deshace bajo la velocidad."""
details = [
  "Los obreros inclinados hacia atrás, con los brazos tensos, aferrados a las riendas.",
  "El collar azul del caballo rojo, en el centro del lienzo.",
  "Los andamios y las chimeneas que humean, arriba del todo a la derecha.",
  "La firma U. Boccioni, abajo a la derecha.",
]
themes = ["futurismo", "ciudad", "trabajo", "caballos", "energía", "milán"]
anecdote = """
La escultura más célebre de Boccioni, Formas únicas de continuidad en el espacio, modelada en 1913, figura hoy en la cara nacional italiana de la moneda de 20 céntimos de euro."""
salle = 3
mur = "nord"
place = 2
largeur = 3.0

[[oeuvres]]
titre = "La ciudad"
artiste = "Fernand Léger"
annee = "1919"
image = "la-ville.jpg"
technique = "Óleo sobre lienzo, 231,1 × 298,4 cm"
collection = "Philadelphia Museum of Art"
note = "La gran ciudad de posguerra en superficies planas de color puro: carteles, vigas, escaleras y hombres-máquina."
description = """
El lienzo está recortado en bandas verticales de colores francos, como una calle vista a través de una sucesión de carteles y fachadas. En el centro derecha se alza una ancha columna malva. Arriba a la izquierda y a la derecha, unos pilones metálicos dibujan sus celosías negras sobre el cielo. Por todas partes, unas letras recortadas con plantilla, entre ellas una gran B abajo a la izquierda, recuerdan los paneles publicitarios. En el medio, una escalera de peldaños negros y blancos es subida por dos personajes grises, de cuerpos hechos de cilindros como autómatas. A la derecha, un panel enmarcado de azul muestra una silueta verde. Rojo, amarillo, azul, verde y negro se responden sin mezclarse nunca."""
evocation = """
Léger celebra la ciudad moderna como un espectáculo: carteles, señales, metal y movimiento. No hay una calle en perspectiva, sino una serie de impresiones yuxtapuestas, como las del transeúnte que atraviesa la ciudad a toda velocidad, o como el montaje de una película. Los hombres, reducidos a formas mecánicas, no son aplastados por la máquina: tienen la misma dignidad que los objetos, la misma solidez. Pintado justo después de la Gran Guerra, el lienzo expresa la confianza de la reconstrucción y el optimismo de un mundo industrial. Ha nutrido el arte del cartel, el diseño gráfico y la pintura mural del siglo XX."""
histoire = """
Movilizado en 1914, Léger pasa dos años en el frente como zapador antes de ser gaseado en Verdún en 1916. Regresa fascinado por las máquinas y por los hombres sencillos con los que ha convivido. En 1919 pinta La ciudad, el mayor lienzo de su llamado periodo mecánico, y lo expone en el Salón de los Independientes de 1920. El cuadro es adquirido por el pintor y coleccionista estadounidense Albert Eugene Gallatin, que lo muestra en su Museum of Living Art, abierto en 1927 en la Universidad de Nueva York, uno de los primeros museos de arte moderno de Estados Unidos. Ingresa después en el museo de Filadelfia con toda su colección."""
facture = """
Léger aplica sus colores en superficies puras, delimitadas, sin degradado, a la manera de un cartel. Solo los personajes están modelados en gris, como piezas de metal pulidas. El principio es el del contraste, que el pintor teoriza: contraste de colores, de formas rectas y curvas, de superficies planas y de volúmenes. Las letras de plantilla y el recorte en paneles verticales dan una impresión de collage sin serlo. El formato, de casi tres metros, anuncia su ambición mural."""
details = [
  "Los dos personajes grises, en forma de autómatas, en la escalera central.",
  "La gran B de plantilla, abajo a la izquierda.",
  "La columna malva que corta el lienzo, en el centro derecha.",
  "La firma F. Léger, Paris 19, abajo a la derecha.",
]
themes = ["ciudad", "máquina", "publicidad", "color", "modernidad"]
anecdote = """
Léger contó que fue en el frente, ante la culata de un cañón de 75 abierta a pleno sol, donde descubrió la belleza del objeto mecánico: una revelación más fuerte, decía, que todos los museos."""
