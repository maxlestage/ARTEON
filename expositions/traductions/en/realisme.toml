[exposition]
ordre = 80
nom_court = "Realism"
mouvement = "Realism and Impressionism"
cadre = "dore"
couleur = "#3d5a4c"
titre = "From Realism to Modern Life"
artiste = "Courbet, Millet, Rosa Bonheur, Manet, Degas, Caillebotte, Pissarro"
dates = "1849–1882"
accroche = "Virtual exhibition · National Gallery of Art, Washington"
introduction = """
In the mid-nineteenth century, Realism brought great painting down from Olympus: make \
way for peasants, workers, village funerals and the streets of Paris. Courbet, Millet and \
Rosa Bonheur show the countryside as it is; Manet, Degas, Caillebotte and Pissarro paint \
modern life and open the way to Impressionism. The building is inspired by the West \
Building of the National Gallery of Art in Washington: a high colonnaded rotunda at the \
centre, a gallery on each side and, to the east, a cabinet in enfilade."""
vitrine = "dejeuner-sur-l-herbe.jpg"

[musee]
nom = "National Gallery of Art, West Building"
ville = "Washington, United States"
architecte = "John Russell Pope"
construction = "1937–1941"
presentation = """
A banker and former Secretary of the Treasury, Andrew W. Mellon gave the nation, in 1937, \
his collection of paintings and the funds to build a museum on the National Mall. The \
architect John Russell Pope designed a neoclassical temple of pink Tennessee marble; he \
died shortly after work began, and his associates completed it. The building, now called \
the West Building, opened in March 1941. At its centre, the rotunda, crowned by a dome \
inspired by the Pantheon in Rome, is ringed by columns of dark green marble and shelters \
a fountain topped by a Mercury. Two long sculpture galleries run east and west and \
distribute the painting galleries, lit by skylights. The museum presents European \
painting from the Middle Ages to the nineteenth century, from Leonardo da Vinci, whose \
only painting on view in the Americas it owns, to Manet, Monet and Degas. In 1978 the \
East Building, designed by Ieoh Ming Pei, was added."""
ici = """
ARTEON’s building takes up the plan of the West Building: a rotunda at the centre, \
galleries on either side. You enter from the south into the Mall vestibule, then into the \
rotunda, square, fourteen metres high, where Luncheon on the Grass and Olympia hang. To \
the west opens “West Gallery · Realism”; to the east, “East Gallery · Modern Life”, two \
rooms eighteen metres long with cream walls. At the end of the east gallery, a last door \
leads to the “East Cabinet · City and Village”."""

