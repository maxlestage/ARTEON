[[oeuvres]]
titre = "Robe à la Française"
artiste = "Couturières anonymes"
annee = "c. 1765"
image = "robe-a-la-francaise.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Robe_%C3%A0_la_Fran%C3%A7aise_MET_DT5011.jpg"
technique = "Brocaded silk; open gown and matching petticoat, worn over panniers"
collection = "Metropolitan Museum of Art, New York (Costume Institute)"
note = "A court gown with immense hips: set over panniers, the glacier-blue silk spreads out almost horizontally."
description = """
Seen from the front, the gown is almost as wide as it is tall. The very fitted bodice \
descends to a point over the stomach; the sleeves end at the elbow, in ruffles of \
silk. On either side of the waist, the skirt extends horizontally before falling \
straight: beneath, panniers, light frames tied at the hips, support it. \
The gown is open at the front and reveals a matching petticoat, trimmed at the bottom with two \
rows of pleats. The edges of the opening are covered with a broad band of \
pleated silk, framed by a curled braid in old gold, which runs from the neckline to \
the hem. On the pale blue ground, small bouquets of flowers and light stems \
are scattered everywhere, woven into the fabric. At the back, the gown lengthens into a short \
train that touches the floor."""
evocation = """
The robe à la française is the great formal dress of the eighteenth century, worn at \
court as in the salons. Its width has nothing practical about it: it forces the wearer to pass through \
doors sideways and imposes a slow, gliding gait. That is precisely what is \
asked of it. It displays the rank of the woman who wears it, her fortune, and the leisure \
of a life in which one does not work with one’s hands. The flowers scattered over the silk, the \
pale tones and the frilly trimmings answer to the Rococo taste, that of the \
panelling, porcelains and fêtes galantes of Watteau and Boucher. The body, \
for its part, remains constrained: beneath the gown, a boned stay straightens the bust and slims the \
waist. This silhouette faded in the 1780s in favour of simpler \
gowns, and the Revolution swept it away with the Ancien Régime."""
histoire = """
In the eighteenth century, such a gown was not the work of a known designer. One first chose \
the fabric, which cost by far the most: a patterned silk, woven on drawlooms \
in the great centres of silk-making, such as Lyon or the London district of Spitalfields. A dressmaker cut and assembled it, then a milliner \
and dealer in fashion goods added the trimmings, ruffles and braids, which were changed as fashion dictated. \
The Metropolitan Museum describes it simply as European, c. 1765: its exact place of \
manufacture is not known. The gown and its petticoat, kept together, \
entered the Costume Institute in 2001, purchased with the bequest of Irene Lewisohn, one \
of the founders of the New York museum of costume art from which the Costume \
Institute was born."""
facture = """
The gown is made of full widths of silk, assembled so as to waste as little \
as possible of a precious fabric: it could be unpicked and remade according to fashion. \
At the back, the silk falls from the shoulders in broad flat pleats and drops freely to the \
floor. At the front, the opening of the bodice is filled by an inserted piece, trimmed with a \
ladder of small bows. The edges are covered with silk pleated into small squares, \
bordered with braid. The flowers are brocaded: the weaver makes them appear with \
supplementary threads, only where the pattern requires."""
details = [
  "The panniers that widen the hips without rounding the skirt at front or back.",
  "The silk ruffles at the elbow, to which lace cuffs were sewn.",
  "The silk pleated into small squares, bordered with braid, that follows the whole opening.",
  "The brocaded bouquets, regularly scattered over the pale blue ground.",
  "The two rows of pleats at the hem of the petticoat.",
]
themes = ["18th century", "court", "panniers", "silk", "Rococo"]
anecdote = """
The pleats that fall from the shoulders at the back of these gowns bear the name of Antoine \
Watteau, who dressed so many of his figures in them. In Gersaint’s Shopsign, painted \
in 1720, a customer seen from behind shows a fine example, nearly half a century before \
this gown."""
salle = 2
mur = "nord"
place = 2
largeur = 1.8

[[oeuvres]]
titre = "High-Waisted Evening Dress"
artiste = "Couturières anonymes"
annee = "1804–1805"
image = "robe-empire.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Evening_dress_MET_DT7445.jpg"
technique = "Cotton muslin embroidered white on white, with train (France)"
collection = "Metropolitan Museum of Art, New York (Costume Institute)"
note = "A column of white muslin: at the time of Napoleon’s coronation, fashionable women dressed like ancient statues."
description = """
On a mannequin wearing a turban, a white dress falls straight to the floor. The \
waist is set very high, just beneath the bust, and marked by an \
embroidered band. The square neckline is wide and low; the sleeves are short puffs, \
gathered and finished with a small ruffle. At the front, a column of embroidered rosettes, linked \
to one another, descends from the waistband to the hem, where it blossoms into \
a border of foliage. At the back, the dress lengthens into a long rounded train, \
also edged with embroidery, which spreads over the floor. Beneath the hem peeks a small \
flat shoe. To present it, the museum has dressed the mannequin with long gloves, a \
pearl necklace and a gilded fan, as for an evening party."""
evocation = """
After the panniers and brocaded silks of the Ancien Régime, this dress seems to come \
from another world. It draws on Greek and Roman statues and vases, which the \
excavations at Pompeii and Herculaneum and engravings had made fashionable: woman \
becomes a draped column. White evokes marble, simplicity a republican \
virtue, even if that simplicity is costly. The portraits of the time, such as \
Madame Récamier painted by David in 1800, show the same ideal of naturalness and \
antique grace. People also read in these dresses a form of freedom: no more panniers, \
no more rigid stays, the line of the body can be guessed. Caricaturists nonetheless mocked \
these half-clad fashionable women, shivering in winter in their muslin."""
histoire = """
The dress dates from 1804–1805, the years when Napoleon Bonaparte became emperor and \
was crowned at Notre-Dame, on 2 December 1804. Around Josephine, the imperial court \
set the tone for all of Europe, and the style that would be called Empire took hold. \
Cotton muslin, long imported from India, was now also woven in \
Europe; it was embroidered in white by specialist embroiderers. Who \
sewed this dress and who wore it is unknown. The long train indicates formal dress, for \
the evening or receptions. The Metropolitan Museum purchased it in 1983, thanks to \
gifts made in memory of Elizabeth N. Lawrence, and presents it as French."""
facture = """
The dress is a lesson in economy of means: a few straight widths of muslin, \
gathered beneath the bust and at the back, suffice to create the silhouette. All the \
richness lies in the white-on-white embroidery, worked by needle, in slight relief, \
which plays with light rather than with colour. The high waist shortens the \
bust and lengthens the leg, and the train, spreading behind, gives the body the \
verticality of a column. The almost transparent fabric was worn over a light \
chemise and petticoat."""
details = [
  "The embroidered band beneath the bust, marking the high waist.",
  "The column of embroidered rosettes down the middle of the front.",
  "The border of foliage at the bottom of the skirt and around the train.",
  "The gathered puff sleeves, finished with a small ruffle.",
  "The flat, heelless shoe that peeks out from the hem.",
]
themes = ["Empire", "Antiquity", "muslin", "white", "embroidery"]
anecdote = """
The style known as Empire was born before the Empire: as early as the late 1790s, under the \
Directory, the fashionable women nicknamed the Merveilleuses were already wearing these high-waisted \
dresses in white muslin. The name became fixed afterward, after the reign of \
Napoleon."""
salle = 2
mur = "nord"
place = 4
largeur = 1.6

[[oeuvres]]
titre = "Crinoline Ball Gown"
artiste = "Couturières anonymes"
annee = "c. 1860"
image = "robe-a-crinoline.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ball_gown_MET_DT7576.jpg"
technique = "Patterned silk and cotton, worn over a crinoline (probably United States)"
collection = "Metropolitan Museum of Art, New York (Costume Institute)"
note = "An immense bell of blue silk: around 1860, the steel-hooped crinoline reigned over the ballrooms of Europe and America."
description = """
A mannequin with brown hair pinned up in a chignon stands in three-quarter view, a \
feather fan in her hands. Her dress forms a perfect bell, very wide at the \
base, without a crooked fold. The tight bodice, pointed at the waist, leaves the \
shoulders bare: the neckline is edged with a bertha, a collar of lace and blue ribbon \
set in a V. The sleeves are no more than small ruffles of ribbon. On the skirt, a large \
woven pattern unfurls its curves: long palm motifs, like those of cashmere \
shawls, white and silvery on a sky-blue ground, between which open \
small bouquets of blue flowers. No trimming interrupts the pattern: \
the fabric is sufficient in itself."""
evocation = """
The crinoline is the silhouette of the Second Empire in France, and of America before \
the Civil War. Its width keeps others at a distance: one does not approach a woman \
so dressed, one greets her. The slim waist, bare shoulders and immense skirt \
compose an image of delicate, almost motionless femininity, that of the lady of the \
house and of the ballroom dancer. It is also a product of the industrial age: the \
hoops are of steel, made in large series, and the patterned silks come from \
increasingly mechanized factories. Caricaturists, Daumier in Paris or the \
draughtsmen of Punch in London, mocked these cages in which women seemed \
imprisoned, which knocked over furniture and encumbered public carriages."""
histoire = """
This ball gown was probably made in the United States around 1860, after \
Paris models, which fashion magazines circulated through their colour \
engravings. Its precise history is not known: it entered the Metropolitan \
Museum in 1983, given by Mrs. Frederick van Beuren Joy in memory of Mrs. Jacob \
Harsen Halsted. The crinoline itself changed greatly within a few years. At first \
a stiff petticoat of horsehair and linen fabric, whence its name, around \
1856 it became a light cage of steel hoops linked by tapes. This invention \
made it possible to widen the skirt without layering heavy petticoats, and fashion seized on it \
at once, from the courts of Europe to the salons of New York."""
facture = """
The whole dress is designed for the crinoline it covers: the skirt, gathered at the \
waist, is made of several straight widths that flare out to the floor. The pattern, very \
large, is woven into the fabric; since the invention of the Jacquard loom at the start of the \
century, such complex designs could be repeated mechanically over great \
lengths. The lace bertha laid over the shoulders extends the horizontal line \
of the neckline and makes the waist look slimmer, by contrast with the fullness of the \
skirt."""
details = [
  "The bertha of lace and ribbon set in a V over the shoulders.",
  "The large white palm motifs inspired by cashmere shawls.",
  "The point of the bodice, which descends over the skirt.",
  "The small sleeves in ruffles of blue ribbon.",
  "The feather fan held by the mannequin.",
]
themes = ["crinoline", "ball", "Second Empire", "silk", "industry"]
anecdote = """
The crinoline caught fire easily. In 1871, in Ireland, Emily and Mary Wilde, \
half-sisters of the future writer Oscar Wilde, died of their burns after a ball: the \
dress of one had caught fire near a fireplace, and the other had ignited \
while trying to rescue her."""
salle = 2
mur = "nord"
place = 7
largeur = 1.8

[[oeuvres]]
titre = "Bustle Ball Gown"
artiste = "Charles Frederick Worth"
annee = "c. 1872"
image = "robe-de-bal-worth.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ball%2Bgown%2BMET%2BDT426.jpg"
technique = "Silk, embroidered braids and fringes; House of Worth, Paris"
collection = "Metropolitan Museum of Art, New York (Costume Institute)"
note = "A gown by the first great couturier: the crinoline has receded, and all the fullness is now gathered at the back."
description = """
In profile, the silhouette has changed: the front of the gown is almost flat, and all \
the fullness goes toward the back, where the sea-green silk swells into a great drape before \
spreading into a train on the floor. The front of the skirt is barred with four broad horizontal \
bands: cream braids embroidered with small red, blue and yellow flowers, each finished with a thick golden fringe. \
The same fringe edges the bodice, \
which opens in lapels over the chest, and the basque that covers the hips. The \
sleeves, long to the elbow, end in a fringed cuff, tied with a small \
bow of dark velvet. Other bows, violet-blue, close the bodice over the \
chest."""
evocation = """
This gown shows the moment when the crinoline gave way to the bustle: a cushion \
or small frame, attached at the base of the back, now supported the skirt toward \
the rear. A woman is seen in profile, like a figure in motion, and the \
train underlines every step. Fringes and embroidered braids pile up effects of \
richness, in the taste of an age that loves abundance of ornament, hangings \
and trimmings. Signed Worth, the gown also says something else: the client \
no longer buys merely a fabric and workmanship, but the name of a designer. To wear \
Worth was to follow the example of the Empress Eugénie, who had made him famous, and to \
join the princesses and wealthy American women who came to the rue de la Paix to be \
dressed."""
histoire = """
Charles Frederick Worth opened his house at 7, rue de la Paix, in 1858. Around 1872, \
the Empire had fallen and the Empress Eugénie lived in exile in England, but the house \
had come through the war and the Commune, and its clientele was now international. \
Wealthy American women numbered among its best clients: they ordered \
several outfits on each stay and carried them back to New York or Boston in \
their trunks. The first owner of this gown is not known. It was \
given to the Metropolitan Museum in 1946 by Mrs. Philip K. Rhinelander, from an \
old New York family. Preserved in several pieces, it bears witness to the care \
with which these Parisian outfits were kept for generations."""
facture = """
Worth designed a model and had it executed in his workshops by dozens \
of seamstresses, adapting it to each client’s measurements. He is reputed to have \
organized his production in standardized elements, bodices, sleeves and skirts, which could be \
combined at will. Here, the close-fitting basque bodice is cut separately. The underskirt, \
barred with braids, stays flat at the front, while the overskirt is lifted and \
draped at the back, above the bustle. The interplay of materials, smooth silk, fine embroidery \
and thick fringes, gives relief to a single colour."""
details = [
  "The silk drape that swells at the base of the back, above the bustle.",
  "The four braids embroidered with flowers that bar the front of the skirt.",
  "The long golden fringes, which moved with every step.",
  "The small dark bows at the wrist and on the chest.",
  "The train that spreads on the floor, behind the gown.",
]
themes = ["haute couture", "bustle", "Worth", "fringes", "Paris"]
anecdote = """
Worth is held to be the first couturier to have shown his designs on living women, \
forerunners of the fashion model. The first was his own wife, Marie Vernet, \
a shop assistant like him at the silk merchant Gagelin when they \
met."""
salle = 2
mur = "nord"
place = 9
largeur = 1.6

[[oeuvres]]
titre = "Ball Gown"
artiste = "Jacques Doucet"
annee = "1898–1900"
image = "robe-de-bal-doucet.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ball_gown_MET_65.184.65a-b_front_CP4.jpg"
technique = "Silk and metallic threads, tulle, silk flowers"
collection = "Metropolitan Museum of Art, New York (Brooklyn Museum Costume Collection)"
note = "A ball gown in a shimmering sea green: Doucet, couturier of actresses, makes of it a stem that lengthens into a train."
description = """
The mannequin wears a long dress of soft green, with silvery glints. The \
very fitted bodice hugs the bust and nips in the waist; the heart-shaped neckline \
is softened by a drape of flesh-coloured tulle that rises toward the shoulders. There are \
no sleeves: the gown is held by two straps set at the edge of the shoulders, each \
adorned with a cluster of silk flowers in a deeper green. The skirt, smooth over the \
hips, flares toward the bottom like a corolla and stretches behind into a train that traces \
waves on the floor. The fabric is crossed with fine creases and gleams, like the \
surface of a crumpled leaf."""
evocation = """
Around 1900, fashion loved curves: those of Art Nouveau, of stems and \
flowers, which one finds in the very line of this gown. The body took the shape \
of an S, bust forward and back arched, thanks to a new corset with a straight \
front. Doucet, a passionate lover of the eighteenth century, liked pale colours, \
tulles, lace and artificial flowers: his gowns have the softness of a \
pastel. Made for dancing, this one was meant to shimmer with every movement. It \
belongs to the Belle Époque, when Parisian couture dressed aristocrats, \
grand bourgeois ladies and actresses, and when dress was a matter of \
social display, changed several times a day."""
histoire = """
Jacques Doucet then ran one of the most refined houses in Paris, in the rue de la \
Paix, a few steps from Worth. His clients were society women and famous actresses, \
such as Réjane or Sarah Bernhardt, whom he dressed in town as on stage. \
For whom this gown was made is unknown. It was given to the Brooklyn Museum in \
1965 by Mrs. Daniel M. McKeon and Robert Hoguet Jr. In 2009, the Brooklyn Museum \
entrusted to the Metropolitan Museum its entire costume collection, one of the \
most important in the United States, which is now kept at the Costume Institute under the \
name Brooklyn Museum Costume Collection. Like most gowns of the time, \
it is made up of several separate pieces."""
facture = """
Doucet worked the material as much as the cut: here, a silk combined with metallic \
threads, whose crumpled surface catches the light and shifts from green to \
silver. The bodice rests on an inner boned framework that gives it its \
shape without any visible fold. The skirt is cut in widths narrow at the top and wide at \
the bottom, to cling to the hips and then open into a train. The flesh-coloured tulle of the \
neckline creates the illusion of bare skin, and the flowers set on the shoulders \
replace sleeves."""
details = [
  "The clusters of dark green silk flowers set on each shoulder.",
  "The flesh-coloured tulle that softens the neckline.",
  "The point of the waist, at the centre of the bodice.",
  "The silvery glints of the fabric, more visible in the folds.",
  "The undulating train that spreads behind the gown.",
]
themes = ["Belle Époque", "ball", "Art Nouveau", "silk", "couture"]
anecdote = """
A great collector, Doucet sold his eighteenth-century paintings and furniture in 1912 \
to turn to the art of his own time. In 1924, advised by André Breton, \
he bought from Picasso Les Demoiselles d’Avignon, now in the Museum of Modern Art in \
New York."""
salle = 3
mur = "nord"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Evening Coat"
artiste = "Paul Poiret"
annee = "1912"
image = "manteau-du-soir-poiret.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Opera_coat_MET_DP142046.jpg"
technique = "Silk satin, velvet, metallic threads"
collection = "Metropolitan Museum of Art, New York (Costume Institute)"
note = "An evening coat of yellow satin, without buttons, to be worn without a corset: Poiret wraps the body as in a kimono."
description = """
On a mannequin with short sculpted hair, a full coat of golden-yellow satin \
crosses over at the front and descends to the ankles. It has no buttons: it \
closes in wrap fashion, held at the waist by a large round fastening of black \
velvet. A small black collar and broad silver-grey lapels frame the bust. The \
very wide sleeves fall from the shoulder like a kimono’s and end in \
large cuffs. Openwork bands, worked with metallic threads in bronze and verdigris \
colours, cover the upper arms, the wrists and the whole right edge \
of the coat. At the bottom, the front panel rounds off and reveals, beneath, a black dress \
finely pleated."""
evocation = """
Paul Poiret boasted of having freed women from the corset: the claim is disputed, \
for other couturiers were moving in the same direction, but this coat shows the \
break clearly. It does not constrain the waist, it envelops. The body is no longer sculpted by \
tailoring, it is draped, as in the garments of the East. Poiret drew on an imagined Japan, \
Persia and Turkey, and on the shock of the Ballets Russes, whose dazzling \
sets thrilled Paris from 1909. The bright yellow, black and silver, \
laid down in broad surfaces, broke with the pastel tones of the Belle Époque. Worn \
to go to the opera or the theatre, such a coat was made for a striking entrance: \
one looked less dressed than costumed."""
histoire = """
In 1912, Poiret was at the height of his fame. A former employee of Doucet and then of the house of \
Worth, he had opened his own house in 1903 and in 1909 moved into a \
private mansion on the avenue d’Antin, near the Champs-Élysées. He was not content with \
couture: in 1911, he launched a perfume house, Rosine, and the Martine workshop, where \
young girls with no artistic training designed patterns for fabrics and \
decoration. The following year, in 1913, he left on a lecture tour of the \
United States, where his designs were copied en masse. This coat was bought by the \
Metropolitan Museum in 1982, with the bequest of Irene Lewisohn, to illustrate this \
moment when Parisian fashion looked toward the Orient."""
facture = """
Poiret cut in large simple forms and straight lines, instead of moulding the \
garment to the body with darts and whalebone. The fullness falls freely, and \
it is the fabric itself, a heavy, shining satin, that creates the volume. The \
contrasts are deliberate: smooth, luminous satin against dark openwork bands, \
matt black velvet against grey satin. The closure, a simple fastening at the waist, \
recalls the way a kimono is crossed and held by a sash."""
details = [
  "The large round fastening of black velvet, at the waist.",
  "The silver-grey lapels and the small black velvet collar.",
  "The openwork bands with bronze glints on the shoulders and wrists.",
  "The wide sleeves, falling from the shoulder like those of a kimono.",
  "The pleated black dress glimpsed beneath the coat.",
]
themes = ["Poiret", "Orientalism", "Japonisme", "coat", "evening"]
anecdote = """
On 24 June 1911, Poiret gave in his garden the Thousand and Second Night, a \
Persian party at which guests had to come in Oriental costume. Those who arrived in \
ordinary evening dress were asked to put on a costume provided by the house before \
entering."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Delphos Gown"
artiste = "Mariano Fortuny"
annee = "1919–1920"
image = "robe-delphos.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Delphos,_1969.39.1(2).jpg"
technique = "Pleated silk taffeta, collar and belt printed with gold, glass beads (Venice)"
collection = "Palais Galliera, Museum of Fashion of the City of Paris"
note = "A column of pleated grey silk: the Delphos gown, inspired by a Greek statue, is worn without a corset and stored rolled upon itself."
description = """
On a dressmaker’s bust, the gown falls in a single sweep, straight to the floor, where \
it flares slightly and ripples. All of the silk, a silvery grey, is crossed by \
fine vertical pleats, tight and irregular, which follow the body without constricting it. \
There are no sleeves: the shoulders are bare, and the gown rises to the neck in a \
small straight collar. This collar and the belt, set beneath the bust, are made from a single \
silk ribbon printed with gold, in geometric patterns. Along the sides, tiny \
yellow glass beads form a line of shining dots, from the shoulder to the \
bottom of the gown. Against the black background of the photograph, the silk seems lit from \
within."""
evocation = """
Mariano Fortuny named his gown after the Charioteer of Delphi, a Greek bronze statue \
discovered in 1896, whose long tunic falls in vertical pleats. The Delphos is a \
dream of Antiquity, like the Empire gown a century earlier, but it goes further: \
it holds only by its fabric and dresses the body without constraining it. At first, \
it was worn mostly at home, as a luxurious dressing gown, before it \
took hold as evening wear. Dancers, actresses and women of letters adopted it. Marcel Proust \
dresses his heroine Albertine in it in The Captive: for the narrator, these gowns \
conjure up the memory of Venice and its palaces, and become the image of a desire \
that cannot be grasped."""
histoire = """
Fortuny, a painter and inventor settled in Venice, perfected the Delphos around 1907 \
with his companion and future wife, Henriette Negrin, and in 1909 filed in Paris a \
patent for his pleating process. He then made it for decades in \
his Venetian workshops, in many colours, and sold it in Paris, London and then \
New York. This example, dated 1919–1920, formed a set with a coat and \
a belt. It entered the collections of the City of Paris in 1969, a gift of \
Mme Faure-Beaulieu, and now belongs to the Palais Galliera. The museum notes that \
this model with a high collar, which repeats the motif of the belt, is quite rare. At the back, \
a label bears the words Fortuny déposé, fabriqué en Italie."""
facture = """
The secret of Fortuny pleating has never been fully revealed. The silk, dyed in \
successive baths to obtain shifting shades, is pleated by hand, \
then the pleats are set by heat. Here, five widths of taffeta were sewn \
together to form a tube. The glass beads, from Murano, are not \
merely decorative: they weigh down the silk and make it hang straight. The collar and \
belt are printed with gilt patterns, using the printing processes that Fortuny \
developed for his velvets inspired by old fabrics."""
details = [
  "The fine, irregular vertical pleats that cover the entire gown.",
  "The small high collar printed with gold, matching the belt.",
  "The line of yellow glass beads along the side.",
  "The bottom of the gown, which flares and ripples on the floor.",
]
themes = ["Antiquity", "pleating", "Venice", "silk", "invention"]
anecdote = """
A Delphos is not folded: it is twisted on itself like a skein of wool and \
stored rolled in a small box. Fortuny delivered it that way, and the pleating \
regained its shape on unpacking."""
salle = 4
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Robe de Style"
artiste = "Jeanne Lanvin"
annee = "Spring–Summer 1924"
image = "robe-de-style-lanvin.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Robe_de_Style_MET_DT222865.jpg"
technique = "Silk taffeta, metallic threads, beads and sequins, metallic lace"
collection = "Metropolitan Museum of Art, New York (Costume Institute)"
note = "In the age of the short, straight dress, Jeanne Lanvin keeps the full skirt of bygone gowns: this is her famous robe de style."
description = """
The dress is of black silk taffeta, sleeveless, with a low waist set on \
the hips. Above, the bodice is straight and flat; below, the skirt rounds out, \
gathered, and stops at mid-calf. A wide round neckline is edged with a \
sheer cream-coloured collar. On the chest, garlands of silver sequins \
trace festoons, and two long chains of sequins hang from the shoulders. On \
the skirt, large oval motifs, embroidered with beads and metallic threads on a pale \
green ground, seem scattered at random. The bottom of the dress is underlined with two silver \
ribbons, then a tall band of metallic lace, silver and \
champagne in colour, which spreads out like a corolla."""
evocation = """
In the 1920s, fashion favoured the tube dress, straight and short, which erased the \
waist and hips: this was the look of the garçonne. Jeanne Lanvin offered another \
femininity. Her robe de style kept the low waist of its time but gave it back a full \
skirt, recalling the panniers of the eighteenth century and the dresses of girls \
of former days. This blend of nostalgia and modernity appealed to women who did not \
recognize themselves in the androgynous silhouette. Black, long the colour of mourning \
and now the colour of chic, serves here as a ground for silver and beads, which sparkle \
under the electric light of ballrooms and theatres."""
histoire = """
Jeanne Lanvin, at first a milliner, opened her house in the rue du Faubourg-Saint-Honoré in \
1889. The dresses she sewed for her daughter Marguerite, born in 1897, pleased so much \
that she created a line for children, then for girls and their mothers. \
In the 1920s, the robe de style became her signature, offered each season \
in taffeta, velvet or muslin, from white to black by way of the blue \
that would be called Lanvin blue. This one belongs to the spring–summer 1924 collection. \
It was given to the Metropolitan Museum in 1962 by Mrs. Albert Spalding, and \
is among the many robes de style kept at the Costume Institute."""
facture = """
The contrast of materials makes the whole dress: a black taffeta firm enough to \
hold the skirt’s volume, and embroideries that catch the light. The embroidery workshops of \
the house of Lanvin worked beads, sequins and metallic threads with \
great precision. The skirt rests on no framework: gathered at the low \
waist, it is held by the stiffness of the fabric and sometimes by a tulle petticoat. \
The silvery lace of the hem, lighter, makes the bottom of the dress float."""
details = [
  "The garlands of silver sequins on the chest.",
  "The two chains of sequins that hang from the shoulders.",
  "The bead-embroidered medallions on the black skirt.",
  "The tall band of metallic lace at the bottom of the dress.",
]
themes = ["Roaring Twenties", "robe de style", "Lanvin", "embroidery", "black"]
anecdote = """
The logo of the house of Lanvin, still in use, shows a mother and her little girl \
holding hands. Drawn by Paul Iribe, it is inspired by a photograph of \
Jeanne Lanvin and her daughter Marguerite, taken in 1907."""
salle = 4
mur = "nord"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "Furisode with Pines, Cranes and Plum Blossoms"
artiste = "Japon, XIXᵉ siècle"
annee = "19th century"
image = "furisode-pins-et-grues.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Furisode_MET_SLP2452_1-retouched.jpg"
technique = "Dyed patterned silk satin, silk embroidery, couched gold and silver threads, yūzen dyeing, 175.5 × 117 cm"
collection = "Metropolitan Museum of Art, New York (Robert Lehman Collection)"
note = "A long-sleeved kimono for a young woman: pines, cranes and plum blossoms embroidered with gold on orange silk."
description = """
The kimono is displayed flat, arms outstretched, as it is hung in Japan on a \
rack. It forms a great T of bright orange silk. The very long sleeves fall \
almost to the knees. At the bottom, old pines with twisted trunks raise their \
branches covered with green and blue needles, above a ground strewn with bamboo \
leaves. Higher up, white cranes fly between wreaths of plum \
blossom, white, gold and grey. The wide collar runs all the way down the front. \
The hem, thickened by padding, forms a roll that gives weight to the bottom of the \
garment. Near the ground, between the trunks, one can make out what seems to be a small \
tortoise."""
evocation = """
Furisode means “swinging sleeves.” This kimono with very long sleeves is \
reserved for unmarried young women: it is said that waving one’s sleeves was a \
discreet way of expressing one’s feelings. The decoration brings together auspicious \
symbols. The pine, ever green, and the crane, said by tradition to live a thousand years, \
express wishes for long life; the plum blossom, which opens at the end of winter, \
heralds renewal. With bamboo, pine and plum form the “three friends of \
winter,” which withstand the cold. Such a garment suits great days, New Year or a \
family celebration: it speaks at once of the youth of the wearer \
and of the wishes made for her."""
histoire = """
This furisode was made in Japan in the nineteenth century, at the end of the Edo period or the \
beginning of the Meiji era, when the country opened to the West after two centuries of \
seclusion. At the same time, kimonos reached Europe and America: they were \
collected, painters dressed their models in them, and Parisian couturiers \
drew on them for their evening coats, as Poiret would. This one belongs \
to the Robert Lehman Collection, assembled by the New York banker and his father, \
Philip Lehman, and entered the Metropolitan Museum in 1975. It stands beside \
Renaissance paintings and Impressionists, a reminder of the place these fabrics held \
in the great American collections."""
facture = """
The decoration combines several techniques, as is often the case with luxury kimonos. The ground \
is a patterned silk satin, perhaps dyed with beni, the red drawn from safflower. Part \
of the motifs is dyed by the yūzen process, in which rice paste reserves the \
outlines before the colours are painted. The rest is embroidered in satin stitch, in \
green, blue and white silks. The gold and silver threads, too stiff to \
pass through the fabric, are couched on its surface and fixed with small stitches. \
Stencilled imitations of tie-dyeing complete the whole."""
details = [
  "The white cranes in full flight, at the top of the garment.",
  "The wreaths of plum blossom, highlighted with gold threads.",
  "The old pines with gnarled trunks, at the bottom of the kimono.",
  "The long sleeves, which descend almost to the knees.",
  "The padded hem, thicker than the rest of the fabric.",
]
themes = ["Japan", "kimono", "embroidery", "cranes", "good fortune"]
anecdote = """
The furisode has not disappeared: in Japan, it remains the dress of young women on the day of \
coming of age, Seijin no hi, celebrated each year in January in all the \
cities of the country."""
salle = 5
mur = "est"
place = 2
largeur = 1.9

[[oeuvres]]
titre = "Man’s Kente Cloth"
artiste = "Tisserands asante (Ghana)"
annee = "19th century"
image = "kente.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Kente_Cloth_MET_1972.56.1.jpeg"
technique = "Cotton and silk, narrow strips woven then sewn edge to edge"
collection = "Metropolitan Museum of Art, New York (African art)"
note = "A ceremonial cloth of the Asante of Ghana, woven in narrow strips, which a man wears draped like a toga."
description = """
The mannequin is wrapped in a vast cloth that covers it from the shoulders to the \
ankles and leaves the right arm and shoulder bare, in the manner of a toga. The fabric \
forms a checkerboard: green, yellow, orange and brown rectangles alternate, crossed \
by fine stripes. Looking closely, one sees that it is made of narrow strips, \
sewn side by side, whose patterns shift from one strip to the next. On the left \
shoulder, the panel thrown back reveals a brighter border, striped with \
red, blue and yellow, which runs down the front. The thick, supple fabric \
forms large folds around the body and falls to the feet."""
evocation = """
Among the Asante, kente is a prestige cloth, tied to royal power. The finest, woven of silk, \
were reserved for the king, the Asantehene, and his entourage, who \
wore them at great ceremonies; certain patterns could not be worn \
without the king’s consent. Each design has a name, often drawn from a proverb, an \
event or a person. Meanings are also attached to colours: yellow evokes \
gold and wealth, green growth and harvests. To wear kente draped \
in this way is to display one’s rank and belonging. Today, it has become an \
emblem of Ghana and, far beyond, of African and African American pride."""
histoire = """
Kente developed in the Asante kingdom, in the heart of present-day Ghana; the \
village of Bonwire, near the capital Kumasi, remains its great weaving centre. \
Silk was not produced locally: weavers unravelled silk cloths \
imported by European merchants to recover the threads, before \
they could buy yarn. This nineteenth-century piece mixes cotton and silk. The Metropolitan \
Museum purchased it in 1972; its earlier history is not documented. In the nineteenth \
century, the Asante kingdom long resisted the British, who burned \
Kumasi in 1874 and carried off part of the royal treasure, before annexing the country in the \
early twentieth century. Nothing indicates that this kente comes from those lootings."""
facture = """
Kente is woven by men, on a horizontal pedal loom that produces \
only narrow strips, about ten centimetres wide. The weaver alternates \
two manners: passages where the weft, very tight, hides the warp and forms blocks of colour, \
and others where supplementary threads draw small motifs. \
The strips, several metres long, are then cut and sewn edge to edge, \
offsetting the blocks to obtain the checkerboard. A large man’s cloth often combines \
more than twenty strips."""
details = [
  "The checkerboard of green, yellow and orange rectangles.",
  "The seams between the narrow strips, visible up close.",
  "The border striped with red and blue, on the left shoulder.",
  "The right shoulder left bare, as the way of draping it requires.",
]
themes = ["Africa", "Ghana", "weaving", "kingship", "drapery"]
anecdote = """
According to a legend of Bonwire, two weavers, Kurugu and Ameyaw, learned their \
art by watching the spider Ananse weave its web, then reproduced its patterns, at first \
with raffia fibres."""
salle = 5
mur = "nord"
place = 2
largeur = 0.8

[[artistes]]
nom = "Couturières anonymes"
vie = "Europe and North America, 18th–19th century"
biographie = """
Before the invention of haute couture, the dresses of fashionable women bore \
no designer’s name. In Paris, Louis XIV granted dressmakers in 1675 the right to \
form their own guild and to dress women, which until then had been done by \
tailors, who kept the making of boned stays. A dress was then born of \
the collaboration of several trades: the merchant sold the silk, the dressmaker cut \
and assembled, the milliner added ribbons, lace, flowers and braids. \
A few names have come down through time, such as Rose Bertin, milliner to \
Marie Antoinette, or Louis-Hippolyte Leroy, who dressed Josephine for the coronation of \
1804. But the immense majority of the dresses kept in museums are anonymous. In the \
nineteenth century, dressmakers worked in workshops or at home, from the \
engravings of fashion magazines, and the sewing machine, widespread from the middle of the \
century, sped up their work. In America, they adapted models coming from \
Paris. Their names have almost all been lost; their dresses, handed down in \
families and then given to museums, remain their only signature."""
style = """
Theirs is an art of fabric more than of cut: silk is so costly that it is \
cut as little as possible and remade as fashions change. Know-how is \
passed from workshop to workshop: fitting a bodice, mounting a skirt on panniers \
or a crinoline, setting a trimming. The silhouette changes according to collective \
rules, set by the court and then by the magazines, and not by a single designer. \
It is this world that Worth would overturn by signing his designs."""

[[artistes]]
nom = "Charles Frederick Worth"
vie = "Bourne (England), 13 October 1825 – Paris, 10 March 1895"
biographie = """
Born in Lincolnshire, Charles Frederick Worth had a difficult childhood after \
his father’s ruin. As a teenager, he left for London as an apprentice to \
textile merchants, among them Swan & Edgar, and came to know silks and the \
fashionable clientele. Around 1846, he settled in Paris, speaking no French, and entered \
Gagelin, a house renowned for its silks and shawls. There he met Marie \
Vernet, a shop assistant, whom he married and for whom he designed dresses that clients \
soon demanded. In 1858, with the Swede Otto Bobergh, he opened his own house at \
7, rue de la Paix. Princess Pauline de Metternich, wife of the Austrian \
ambassador, wore his dresses at the Tuileries and brought him to the attention of the Empress \
Eugénie, who became his client. From then on Worth dressed the court, actresses and \
wealthy American women. He survived the fall of the Empire and remained, until his death in \
1895, the most famous couturier in the world. His sons Gaston and Jean-Philippe \
took over the house, which remained active until the mid-twentieth century."""
style = """
Worth invented the couturier as creator: instead of carrying out his clients’ ideas, \
he proposed to them each season designs of his own, shown on living \
women, and signed his dresses with a label bearing his name. He loved sumptuous \
silks, often from Lyon, impeccable cuts and silhouettes that he caused to \
evolve, from the crinoline to the bustle. His method, half artist, half industrialist, founded \
Parisian haute couture."""

[[artistes]]
nom = "Jacques Doucet"
vie = "Paris, 19 February 1853 – Neuilly-sur-Seine, 30 October 1929"
biographie = """
Jacques Doucet was born into a family of Parisian tradesmen: the house of Doucet, \
in the rue de la Paix, sold fine lingerie, lace and shirts. In the 1870s he added \
a department of women’s couture, which became one of the most elegant \
houses in Paris. Society women and great actresses, \
Réjane or Sarah Bernhardt, dressed there. Doucet knew how to recognize talent: Paul \
Poiret made his debut with him, and Madeleine Vionnet worked there before opening her \
own house. A man of taste, he assembled a famous collection of paintings, drawings and \
furniture of the eighteenth century, which he sold at auction in 1912 to turn to \
the art of his own time. Advised by writers such as André Breton, he bought \
Picasso, Matisse, Modigliani, and The Snake Charmer by Henri Rousseau, which he \
bequeathed to the Louvre. He also founded a great library of art and archaeology, which he \
gave to the University of Paris, and a literary library. He died in 1929 \
at Neuilly, where he had fitted out a studio decorated by Art Deco designers."""
style = """
Doucet is the couturier of grace and lightness: pastel tones, tulles, \
muslins, antique lace and silk flowers, in a taste nourished by the eighteenth \
century. His supple, vaporous dresses flatter the arched body of the Belle Époque \
without seeming heavy. He brought to couture the eye of a collector, attentive \
to rare materials, and trained a generation of designers, among them Poiret and Vionnet, who \
would invent twentieth-century fashion."""

[[artistes]]
nom = "Paul Poiret"
vie = "Paris, 20 April 1879 – Paris, 30 April 1944"
biographie = """
The son of a Parisian cloth merchant, Paul Poiret was placed young with an umbrella \
maker, but he preferred to draw dresses, which he sold to couture houses. \
Jacques Doucet hired him, then he moved to Worth before opening his own house in \
1903. In a few years, he imposed a new silhouette, straight and high-waisted, \
which he publicized through illustrated albums, entrusted to Paul Iribe in 1908 \
then to Georges Lepape in 1911. Settled on the avenue d’Antin, he gave parties that remain \
famous, launched the Rosine perfumes and the Martine workshop, collaborated with the painter \
Raoul Dufy on his fabrics and travelled in Europe and the United States to present his \
designs. During the First World War, he was mobilized and worked on \
army clothing. After 1918, fashion changed, simpler and more sporting, and \
his spending became ruinous. At the Exhibition of Decorative Arts in 1925, he \
presented his creations on three barges moored on the Seine, but his house closed \
in 1929. He died in Paris in 1944, forgotten and poor."""
style = """
Poiret cut straight, draped rather than constructed, and dreamed of a theatrical Orient: \
turbans, tunics, harem trousers, kimono coats. His bright colours, \
violets, greens, oranges, broke with the pallor of the Belle Époque. He was one of the \
first to make fashion a complete art of living, from perfume to interior decoration, and \
to collaborate with painters and illustrators. His taste for spectacle foreshadows \
the great couturiers of the twentieth century."""

[[artistes]]
nom = "Mariano Fortuny"
vie = "Granada, 11 May 1871 – Venice, 2 May 1949"
biographie = """
Mariano Fortuny y Madrazo was the son of the Catalan painter Marià Fortuny, who died when he \
was three, and of Cecilia de Madrazo, from a great family of Madrid \
artists. Raised in Paris, then settled in Venice with his mother in 1889, he grew up \
amid the antique fabrics she collected. At first a painter, he became \
passionate about theatre and Wagner’s opera, and invented stage lighting \
systems, among them a dome that diffuses indirect light, patented in the early twentieth \
century. With his companion, Henriette Negrin, whom he would marry in 1924, he turned to \
textiles: the Knossos scarf, inspired by Cretan frescoes, then the Delphos gown, \
around 1907. In the Palazzo Pesaro degli Orfei, where he lived and worked, he dyed, \
pleated and printed velvets and silks by processes of his own invention, then opened \
a printed-fabric factory on the island of the Giudecca. His dresses sold in \
Paris, London and New York. He died in Venice in 1949; his palace has become the \
Fortuny museum."""
style = """
Fortuny is an inventor as much as a couturier. He did not follow fashion: he created \
timeless designs, inspired by Greek Antiquity, the Venetian Renaissance and \
the East, which he produced almost unchanged for decades. His pleated silks \
and gold-printed velvets play with light like his theatre lighting. \
His freedom of cut, which leaves the body free, has inspired many designers, from \
Madame Grès to Issey Miyake."""

[[artistes]]
nom = "Jeanne Lanvin"
vie = "Paris, 1 January 1867 – Paris, 6 July 1946"
biographie = """
The eldest of a large and modest family, Jeanne Lanvin worked from adolescence \
for milliners and dressmakers. In 1889, she opened her own hat shop \
in the rue du Faubourg-Saint-Honoré. After the birth of her daughter Marguerite, in \
1897, she sewed her such charming dresses that her clients asked for them for their \
own children: she opened a department for little girls, then for girls \
and women. In 1909, she joined the Chambre Syndicale de la Couture \
Parisienne. In the 1920s, her house became one of the most important in \
Paris: she launched the robe de style, home collections with the decorator \
Armand-Albert Rateau, a menswear line and perfumes, among them Arpège in 1927. She \
had her own dyeing and embroidery workshops. She remained at the head of her \
house until her death in 1946; her daughter, who had become Countess Jean de Polignac, \
succeeded her. Founded in 1889, the house of Lanvin is today the oldest French \
couture house still in operation."""
style = """
Lanvin cultivated a soft, romantic elegance, far from the severity of the \
garçonne. Her robes de style, meticulous embroideries and signature colours, \
such as a deep blue said to be inspired by the frescoes of Fra Angelico, made her \
reputation. She drew on old painting, historical costume and the \
arts of the East, but translated these memories into simple, modern lines, to \
dress mothers and daughters together."""

[[artistes]]
nom = "Japon, XIXᵉ siècle"
vie = "Japan, late Edo period (1603–1868) and early Meiji era (1868–1912)"
biographie = """
The kimono descends from the kosode, a garment with narrow sleeves first worn as \
an undergarment, which became in the sixteenth century the outer garment of men and \
women alike. Under the Tokugawa shoguns, during the Edo period, peace and the growth of \
cities enriched the merchants, who vied in luxury of dress despite the \
sumptuary laws meant to limit it. Kyoto remained its great centre: the \
weavers of the Nishijin district produced silks and brocades there, and yūzen dyeing, \
which makes it possible to paint true pictures on fabric, developed there at the \
end of the seventeenth century. Dyers, embroiderers and weavers, organized in \
specialized workshops, worked from pattern books that circulated fashionable \
motifs. After 1868, the Meiji era opened Japan to the West; men of the court and \
the administration gradually adopted European dress, but the kimono remained the \
garment of women and of great occasions. Exported and collected, it fascinated \
the Europe of Japonisme and inspired painters and couturiers."""
style = """
The kimono keeps an unchanging cut: a few straight panels, cut from a single \
narrow roll of fabric, assembled in the shape of a T. All the invention therefore goes \
into the decoration, conceived as a picture unfolding over the body. Seasons, poetry, \
auspicious symbols guide the choice of motifs; dyeing, embroidery and gold threads \
are combined with virtuosity. This beauty laid flat has deeply marked Western \
fashion."""

[[artistes]]
nom = "Tisserands asante (Ghana)"
vie = "Asante kingdom, present-day Ghana, 18th–19th century"
biographie = """
The Asante kingdom formed around 1700 around Kumasi, under King Osei Tutu; according to \
tradition, a Golden Stool descended from the sky then sealed the union of the chiefdoms \
and embodied the soul of the nation. Rich from the gold of its mines and its trade, the \
kingdom dominated for two centuries a large part of present-day Ghana. Weaving there \
was a men’s activity, organized in specialized villages around the capital, \
Bonwire among them, placed under the king’s protection. The king’s weavers created for him \
new patterns, some of which were reserved for him. In the nineteenth century, the kingdom \
faced the British settled on the coast in several wars: \
Kumasi was burned in 1874, King Prempeh I was exiled in 1896, and the country was \
annexed to the Gold Coast colony in the early twentieth century. Kente survived \
colonization and became, after Ghana’s independence in 1957, a national symbol. \
Weavers continue to work today at Bonwire, on the same narrow \
looms."""
style = """
Kente is an art of colour and geometry. On narrow strips, the \
weaver alternates solid blocks and small motifs, then the strips, sewn \
offset, compose a vibrant checkerboard. Each combination carries a name and a meaning, \
known to initiates. Yellow, green, red, blue and black answer one another with great \
vividness. This art of assembly has inspired many artists and designers, in \
Africa as in the diaspora."""
