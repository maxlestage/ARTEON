[exposition]
ordre = 68
nom_court = "Fashion and Costume"
mouvement = "Fashion and Costume, from the 18th Century to the Roaring Twenties"
cadre = "vitrine"
couleur = "#7a3b55"
titre = "Fashion and Costume: Two Centuries of Elegance"
artiste = "Worth, Doucet, Poiret, Fortuny, Lanvin…"
dates = "1765–1924"
accroche = "Virtual exhibition · Palais Galliera, Paris"
introduction = """
A dress tells the story of its age: the court of Louis XV in the panniers of a \
robe à la française, the dream of Antiquity in Empire muslin, the industrial age in the \
steel hoops of crinolines. The visit follows ten garments, from 1765 to the \
Roaring Twenties, when Paris, with Worth, Doucet, Poiret and Lanvin, invented the profession of \
great couturier, and opened itself to the kimonos of Japan as to the cloths of Africa. Most \
come from the Costume Institute of the Metropolitan Museum in New York; Fortuny’s Delphos \
gown belongs to the Palais Galliera. The building is inspired by this Parisian palace \
turned fashion museum: a vestibule, a great gallery and three rooms with \
dimly lit display cases."""
vitrine = "robe-a-la-francaise.jpg"

[musee]
nom = "Palais Galliera, Museum of Fashion of the City of Paris"
ville = "Paris, France"
architecte = "Léon Ginain"
construction = "1878–1894"
presentation = """
The palace owes its existence to the will of a great Genoese collector, Maria \
Brignole-Sale, Duchess of Galliera. In 1878, she had the architect Léon \
Ginain build, on the hill of Chaillot, a palace intended to display her paintings and \
works of art, which she planned to give to the City of Paris. She changed her mind and her \
collections finally went to Genoa, her native city: only the building, completed \
in 1894, came to Paris. In the Italian Renaissance style, in pale stone, it opens \
onto a garden through an arcaded façade adorned with statues. After hosting \
exhibitions, it became in 1977 the Museum of Fashion and Costume of the City of \
Paris. Its collections, among the richest in the world, range from the eighteenth century to the \
present day. As light damages textiles, nothing is on permanent display: the \
museum presents its dresses in successive exhibitions, in rooms with dimmed \
lighting. In 2020, new galleries fitted out in the vaulted cellars enlarged \
the visit."""
ici = """
The ARTEON building keeps from the Palais Galliera its pale stone and its display cases. One \
enters from the south into “The Vestibule,” seven metres high, with stone walls. It \
opens onto “The Great Gallery,” thirty-four metres long and ten high, with \
powder-pink walls, where four dresses range from 1765 to 1872. To the west, the room “The Belle \
Époque of the Couturiers” brings together Doucet and Poiret; to the north, “The Roaring Twenties” \
sets Fortuny’s Delphos against Lanvin’s robe de style; to the east, “Costumes \
of the World” presents a Japanese kimono and an Asante kente."""

