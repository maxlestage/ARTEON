[[oeuvres]]
titre = "Plum Garden at Kameido"
artiste = "Utagawa Hiroshige"
annee = "1857"
image = "pruniers-kameido.jpg"
technique = "Nishiki-e print (colour woodblock), vertical ōban format, approximately 36 × 24 cm"
collection = "Rijksmuseum, Amsterdam"
note = "A sheet from the One Hundred Famous Views of Edo: the trunk of an old plum tree bars the image, and the flowering garden appears behind it."
description = """
In the foreground, an enormous plum-tree trunk, almost black, crosses the whole image \
diagonally; it is so close that it runs out of the frame at top and left. From its branches \
spring a few twigs covered with white, yellow-hearted blossoms, drawn one by \
one. Behind it stretches the garden: dozens of smaller flowering plum trees, \
a bamboo fence and tiny strollers admiring the trees. The ground is \
green, the sky passes from vivid red, at the top, to pinkish white near the horizon. In the \
upper left corner, the angle of a dark roof. At upper right, two cartouches \
give the name of the series and that of the place; at lower left, Hiroshige's signature \
in a red cartouche."""
evocation = """
The blossoming of the plum trees, at the end of winter, is in Japan the first festival of \
spring, before that of the cherry trees: families went to contemplate the flowers and \
to breathe in their scent in the still-cold air. The plum, which blooms on gnarled \
and nearly dead wood, has also long been an image of perseverance and \
renewal. Hiroshige places the viewer in the garden itself, hidden behind the tree, \
like a stroller who has come too close. This daring framing, \
which slices off the main motif and pushes the figures into the distance, has been seen as one \
of the most modern inventions of the Japanese print: nature is no longer a \
backdrop, it becomes the subject, seen at human height."""
histoire = """
The print belongs to the One Hundred Famous Views of Edo, Hiroshige's last great series, \
published by the publisher Uoya Eikichi from 1856 to 1858; it bears the date \
1857. The Kameido garden, east of the Sumida, was a renowned place for strolling: \
people came to see the Garyūbai, the \"reclining dragon plum\", a tree so old that \
its branches drooped to the ground. Historians have stressed that the series, \
begun shortly after the great earthquake that ravaged Edo in 1855, celebrates a \
city in reconstruction and its rediscovered pleasures. Like all the sheets in the \
series, this one was printed in many copies. This impression is kept at the \
Rijksmuseum in Amsterdam."""
facture = """
The One Hundred Views all adopt the vertical format, unusual for landscape. \
Hiroshige pushes to the extreme the device of the giant foreground, borrowed in part \
from the Western perspectives he knew through \"Dutch-style\" prints. \
The sky is printed in bokashi: the printer wiped the ink on the block to \
obtain a continuous gradation from red to white. The contrast between the dark trunk, with its \
irregular contours, and the white flowers reserved in the paper gives the image \
its strength."""
details = [
  "The black trunk running out of the frame at left, top and bottom.",
  "The tiny strollers behind the bamboo fence.",
  "The gradation of the sky, from vivid red to pinkish white.",
  "The white, yellow-hearted blossoms, drawn one by one.",
  "Hiroshige's signature in the red cartouche, at lower left.",
]
themes = ["spring", "plum", "garden", "Edo", "Japonisme"]
anecdote = """
The Garyūbai owed its name, \"reclining dragon plum\", to its branches that \
drooped to the ground and took root again there, like a dragon stretched out. The tree and the \
garden disappeared in the great flood of 1910. In 1887, Van Gogh copied this \
print in oils."""
salle = 2
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Sudden Shower over Shin-Ōhashi Bridge and Atake"
artiste = "Utagawa Hiroshige"
annee = "1857"
image = "averse-ohashi.jpg"
technique = "Nishiki-e print, vertical ōban format, approximately 36 × 24 cm"
collection = "Brooklyn Museum, New York"
note = "A summer storm surprises passers-by on the great bridge over the Sumida: the most famous image of rain in Japanese art."
description = """
Seen from above, a long wooden bridge crosses the image diagonally, from lower left to \
the right. Passers-by hurry across, bent beneath the downpour: two people huddled \
under an umbrella, a man in a straw hat, others sheltering \
under a mat. The rain falls in thousands of fine, dark lines covering the whole \
image. On the grey river, a standing man poles a long wooden raft. \
On the far bank, the Atake district is no more than a silhouette of trees \
drowned in mist. At the top, a black cloud weighs on the scene. The bridge's piers, \
cross-braced, plunge into the dark blue water in the foreground."""
evocation = """
Hiroshige captures a moment of ordinary Edo life: the summer storm that bursts without \
warning and sends everyone running. There is neither hero nor event, only \
anonymous people surprised by the weather, and the viewer almost feels wet. \
It has often been seen as an expression of the Japanese sense of impermanence: a \
fleeting moment, caught on the fly, that will be past in a few minutes. The contrast between the \
little hurrying figures and the raftsman, alone and motionless on the river, has \
also been read as a meditation on the human condition. For European \
artists, this rain drawn in lines was a revelation: one could depict \
bad weather itself."""
histoire = """
The print, dated 1857, belongs to the One Hundred Famous Views of Edo, published by Uoya \
Eikichi. The Shin-Ōhashi bridge, the \"new great bridge\", had spanned the Sumida since \
1693. The Atake district, on the east bank, took its name from the Atake maru, an immense \
shogunal ship long moored at that spot. Hiroshige was then about sixty \
years old; he died the following year, before the series was finished. His prints \
reached Europe in great numbers after the opening of Japan, and the \
Impressionist painters collected them. This impression is part of the complete series \
of the One Hundred Views held at the Brooklyn Museum in New York."""
facture = """
The rain is the engraver's feat: hundreds of parallel lines, of extreme fineness, \
cut in the wood at slightly different angles, which \
gives the impression of an oblique, shifting downpour. The black cloud is printed in \
gradation, like the depth of the river. The plunging viewpoint, the bridge cut off by \
the edge of the image and the absence of clear sky are among the boldnesses of this \
late series."""
details = [
  "The two passers-by huddled under a single umbrella, at left on the bridge.",
  "The lines of rain, which are not all slanted the same way.",
  "The man poling his raft, alone in the middle of the river.",
  "The Atake shore, reduced to a grey silhouette.",
  "The cross-bracing of the bridge piers, in the foreground.",
]
themes = ["rain", "bridge", "storm", "Edo", "Japonisme"]
anecdote = """
In 1887, in Paris, Vincent van Gogh copied this print in oils, exaggerating its \
colours, and surrounded it with a painted border covered with ideograms copied from other \
prints. The painting, Bridge in the Rain, is now in the Van Gogh Museum in \
Amsterdam."""
salle = 2
mur = "nord"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Foxfires on New Year's Eve at the Changing Tree, Ōji"
artiste = "Utagawa Hiroshige"
annee = "1857"
image = "feux-renards-oji.jpg"
technique = "Nishiki-e print, vertical ōban format, approximately 36 × 24 cm"
collection = "Brooklyn Museum, New York"
note = "On New Year's Eve, the foxes of the whole region gather beneath an old tree before going to the Inari shrine."
description = """
In the winter night, a great bare tree spreads its black branches over a dark blue sky \
dotted with stars. At its foot, some twenty white foxes are gathered, \
seated or standing; near the head of each glows a small orange flame. On \
the left, other foxes arrive behind the trunk. In the dark plain, in the distance, \
a long line of small lights approaches: more foxes on their way. Haystacks \
stand in the fields, and one makes out on the horizon the dark mass of a \
wood. On the left, a few pine branches add a touch of green to the night. The \
cartouches of the series and the title occupy the upper right corner."""
evocation = """
In Japan, the fox is the messenger of Inari, the deity of rice and prosperity, \
and is also believed to be a magical being able to take human form. The \"foxfires\", \
those mysterious glows seen at night in the countryside, were attributed to them. \
Hiroshige shows here the invisible world that borders the world of the \
peasants: the marvellous settles amid familiar fields. According to belief, \
peasants counted these fires to predict the next year's harvest. In a \
series devoted to real places in Edo, this sheet, one of the few to depict \
a legend, closes the winter cycle on a note of mystery and hope."""
histoire = """
The print, dated 1857, bears the number 118 of the One Hundred Famous Views of Edo: it is the \
last of the section devoted to winter. Ōji, then a village north of Edo, \
housed the most venerated Inari shrine of the Kantō region. Legend \
had it that on New Year's Eve the foxes of the eight provinces gathered beneath \
a great hackberry, the Shōzoku enoki, the \"costume tree\", to put on their \
ceremonial garb before visiting the shrine. The tree has disappeared, but a \
small shrine still marks its location. This impression is kept at the \
Brooklyn Museum in New York, with the entire series."""
facture = """
Hiroshige makes the night a material: the deep blue of the sky darkens toward the \
top in a gradation, and the stars are tiny dots reserved in the paper. \
The foxes, outlined in fine strokes, keep the whiteness of the paper, which makes them \
glow in the darkness. The flames are printed in vivid orange, the only warm colour \
of the image. The line of lights shrinking toward the horizon creates depth without \
any perspective lines."""
details = [
  "The small flame floating near the head of each fox.",
  "The line of lights approaching in the distance across the plain.",
  "The stars, simple dots of white paper in the blue sky.",
  "The haystacks, on the right, in the winter fields.",
]
themes = ["night", "fox", "legend", "New Year", "winter"]
anecdote = """
The legend lives again each year: since the early 1990s, the people of Ōji \
have organised, on the night of 31 December, a procession of foxes, in which the participants, \
made up or masked as foxes, walk by lantern light to the Inari shrine."""
salle = 2
mur = "nord"
place = 4
largeur = 1.1

[[oeuvres]]
titre = "Under the Wave off Kanagawa (The Great Wave)"
artiste = "Katsushika Hokusai"
annee = "c. 1830–1832"
image = "grande-vague.jpg"
technique = "Nishiki-e print (colour woodblock), 25.7 × 37.9 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The most famous sheet of the Thirty-Six Views of Mount Fuji: a giant wave is about to crash down on three boats, while Fuji, tiny, waits in the distance."
description = """
On the left, an immense wave rears up and curls over the sea; its foam \
breaks into white claws that seem ready to seize the men. Three long, \
slender boats plunge into the troughs. Their rowers, huddled against one \
another, cling on, heads bowed. At the centre, far in the background, Mount Fuji appears, \
a small snow-capped cone, wedged between two waves. In the foreground, a \
smaller wave repeats exactly its shape, like a second Fuji of water. The sky, a \
pale beige, darkens toward the horizon, where a few clouds pass. At upper left, \
a cartouche gives the name of the series and the title of the print, with beside it the \
artist's signature."""
evocation = """
The image sets the boundless force of nature against the fragility of men, who \
nevertheless keep rowing. In the midst of this chaos, Fuji remains still: the \
sacred mountain, a symbol of permanence, seems tiny and yet unshakeable. Its \
name has been linked to words meaning \"without equal\" and \"immortal\", and the mountain \
was the object of a veritable cult in Edo. It has also been noted that the image reads \
differently according to the direction of the gaze: from right to left, like Japanese text, the \
wave rushes toward the viewer; from left to right, in the Western way, it seems to \
recede. Hokusai, at over seventy, sums up here all his art of movement \
caught in a suspended instant."""
histoire = """
The print opens the series of the Thirty-Six Views of Mount Fuji, published around 1830–1832 by \
the publisher Nishimuraya Yohachi. Hokusai, who was over seventy, was emerging from \
difficult years, marked by illness and money worries. The series was such a \
success that ten further views were added, making forty-six sheets. The \
Great Wave was printed in thousands of copies, sold at low prices. Arriving in \
Europe after the opening of Japan, its impressions fascinated the painters, \
musicians and writers of Japonisme. This impression, of fine freshness, is part \
of the collection assembled by Louisine and Henry O. Havemeyer, bequeathed to the \
Metropolitan Museum of Art in New York in 1929."""
facture = """
Hokusai uses Prussian blue, a synthetic pigment recently imported, more \
intense and more durable than vegetable indigo. The very low horizon line comes from \
the Western perspectives he had studied in Dutch engravings. \
The print is a team effort: Hokusai draws, an engraver cuts one woodblock per \
colour, a printer lays down the colours one by one by hand on the paper, and \
the publisher finances and sells."""
details = [
  "The claws of foam at the crest of the wave, like hooked fingers.",
  "Snow-capped Fuji, very small, in the hollow of the waves.",
  "The small wave in the foreground, which has the shape of Fuji.",
  "The rowers lying in the bottom of the boats, heads bowed.",
  "The signature beside the cartouche: Hokusai aratame Iitsu hitsu.",
]
themes = ["sea", "wave", "Fuji", "Prussian blue", "nature"]
anecdote = """
Claude Debussy had an impression of the Great Wave in his study. For the \
cover of the score of La Mer, published in 1905, he had Hokusai's wave reproduced, \
without Fuji or the boats."""
salle = 3
mur = "nord"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "South Wind, Clear Sky (Red Fuji)"
artiste = "Katsushika Hokusai"
annee = "c. 1830–1832"
image = "fuji-rouge.jpg"
technique = "Nishiki-e print, 25.4 × 37.8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "At daybreak in late summer, Fuji reddens under the rising sun: one mountain, one sky, and nothing else."
description = """
The mountain fills the whole right-hand part of the image: an immense brick-red \
triangle rising to the top edge. Near the summit, streaks of white snow \
run down the dark rock. At the foot, a broad blue-green band is \
covered with a multitude of small trees, rendered by tiny touches packed \
like fur. On the left, the deep blue sky is crossed by long rows of \
small white clouds, aligned like scales. There is no village, no traveller, no \
boat: no human presence. At upper left, the title cartouche and \
Hokusai's signature stand out against the sky."""
evocation = """
The Japanese title, Gaifū kaisei, means \"south wind, clear sky\": the gentle breeze \
of late summer that chases away the mist and reveals the mountain at daybreak. \
Hokusai reduces Fuji to its simplest form, almost a sign, and makes of it a \
monumental, silent presence. For the people of Edo, Fuji was a \
sacred mountain, which confraternities of pilgrims climbed each summer and of which small \
copies were even made in the city's shrines. This stripped-down image, without a single \
figure, has been seen as a form of religious contemplation \
as much as a landscape. Even today, Red Fuji is considered in Japan to be \
an auspicious image."""
histoire = """
The print is part of the Thirty-Six Views of Mount Fuji, published around 1830–1832 by \
Nishimuraya Yohachi, like the Great Wave. The series took advantage of the vogue for the cult \
of Fuji in Edo, and of the arrival of a new pigment, Prussian blue. Red Fuji \
was printed in large numbers and impressions vary greatly from one printing to another: \
soft, nuanced colours here, a more frank and uniform red elsewhere. With the \
Great Wave and Thunderstorm Beneath the Summit, it forms the most famous trio of the \
series. This impression entered the Metropolitan Museum of Art in New York in 1939, \
with the collection bequeathed by Henry L. Phillips."""
facture = """
Few blocks, few colours: the red, two blues, the green and the white of the paper \
are enough. The sky and the mountain are printed in gradations, obtained by wiping \
the ink on the wooden block before each impression. The trees are small repeated \
marks, almost a textile pattern. The grain of the wood, visible in the flat areas, enlivens \
the large surfaces. The composition rests on two diagonals meeting at the \
summit, off-centre to the right."""
details = [
  "The streaks of snow running down from the summit like drips.",
  "The small trees packed at the foot of the mountain, like fur.",
  "The rows of white clouds, aligned like scales.",
  "The summit off-centre to the right, almost at the edge of the image.",
]
themes = ["Fuji", "mountain", "dawn", "sky", "landscape"]
anecdote = """
The phenomenon really exists: in late summer and early autumn, when the \
snow has melted, Fuji sometimes takes on a red tint at sunrise. The Japanese \
call it aka-Fuji, \"Red Fuji\", and photographers watch for this moment."""
salle = 3
mur = "ouest"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Young Woman Admiring Plum Blossoms at Night"
artiste = "Suzuki Harunobu"
annee = "c. 1766"
image = "harunobu-prunier-nuit.jpg"
technique = "Nishiki-e print with blind embossing (karazuri), 32.4 × 21 cm"
collection = "Metropolitan Museum of Art, New York"
note = "On a veranda, a young woman raises a lantern toward a flowering plum tree: one of the first full-colour prints."
description = """
A young woman stands on a wooden veranda, beside an orange balustrade that \
crosses the image diagonally. Dressed in a long striped kimono ornamented with round medallions, \
she stretches out her arm and raises a paper lantern on the end of a pole, to light \
a flowering plum branch that reaches out above her. The background is entirely \
black: it is night. The white, yellow-hearted blossoms stand out against the darkness. \
On the right, a pale rock emerges from the shadow, and at the top a beige band suggests \
a layer of mist. The veranda floor, at the bottom, is a pale beige. The young woman \
has the soft, round face and the tiny hands and feet typical of Harunobu."""
evocation = """
The scene is at once simple and poetic: a nocturnal stroll to see the \
first flowers of spring. It has been linked to a famous poem from the Kokinshū, \
the tenth-century imperial anthology, in which Ōshikōchi no Mitsune writes that the darkness \
of a spring night hides the colour of the plum blossoms, but cannot hide \
their fragrance. The raised lantern expresses this desire to see what the night conceals. \
Harunobu's figures, fragile and ageless, seem to live in a dream world \
rather than in the real Edo. This refinement, nourished by literary references, was \
intended for a cultivated public who liked to recognise, behind the image, a poem or a \
legend."""
histoire = """
In 1765, circles of wealthy Edo amateurs commissioned from Harunobu illustrated \
calendars, which they exchanged at New Year. For these luxury images, engravers and \
printers perfected printing in some ten colours, with precise registration marks to align each \
block: this was the birth of nishiki-e, the \"brocade picture\". Publishers immediately took up the process \
for the general public. This print, made around 1766, dates from these years of invention. \
The plain black background, difficult to print without marks, is rare at the time. It entered the Metropolitan \
Museum of Art in New York in 1929."""
facture = """
The chūban format, smaller than the ōban, suits the intimacy of Harunobu's scenes. \
The large black flat area sets off the flowers and the lantern, left in the \
whiteness of the paper. Certain parts are blind-embossed, without ink (karazuri): the \
paper, pressed on a carved block, keeps a slight relief visible in raking \
light. The colours, of vegetable origin, have softened with time."""
details = [
  "The six-sided paper lantern, held on the end of a pole.",
  "The yellow-hearted plum blossoms, against the black background.",
  "The round medallions of the striped kimono.",
  "The pale rock, on the right, emerging from the shadow.",
]
themes = ["night", "plum", "spring", "poetry", "young woman"]
anecdote = """
The painter Shiba Kōkan relates in his memoirs that after Harunobu's death, in \
1770, he drew prints in his style and signed them with his name, without anyone \
noticing."""
salle = 4
mur = "ouest"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Three Beauties of the Present Day"
artiste = "Kitagawa Utamaro"
annee = "c. 1793"
image = "trois-beautes.jpg"
technique = "Nishiki-e print, ōban format, approximately 37 × 25 cm"
collection = "Museum of Fine Arts, Boston"
note = "The three most admired young women in Edo around 1793: a singer and two teahouse waitresses."
description = """
Three young women are shown in bust, in close-up, arranged in a triangle. \
At the top, the singer Tomimoto Toyohina lowers her eyes to the left. At lower \
left, Naniwaya Okita holds a cloth draped over her shoulder; at lower right, \
Takashima Ohisa holds a round fan decorated with a pattern of oak leaves, her \
emblem. All three wear tall lacquered hairstyles, studded with combs and \
pins. Their faces closely resemble one another, a pale oval with narrow eyes and \
small red lips. The background is plain, a very light grey. At upper right, a \
cartouche gives the title and the names of the three women; Utamaro's signature is read \
on the left."""
evocation = """
The print bears witness to a veritable culture of celebrity in eighteenth-century \
Edo. These young women were not courtesans but personalities known \
to all: Okita served in a teahouse near the Sensō-ji temple, in Asakusa, \
Ohisa in her family's shop in Ryōgoku, and customers came to see them as \
one goes to see a star. Their portraits sold like photographs of idols. \
Utamaro plays on a paradox: he idealises the three faces according to the canon of beauty \
of his time, but differentiates them by tiny nuances, the curve of an eyebrow, the \
shape of an eye, which connoisseurs knew how to recognise."""
histoire = """
The print was published around 1793 by Tsutaya Jūzaburō, the boldest publisher in \
Edo, who had made Utamaro his star. Okita and Ohisa, rivals in popularity, \
were then portrayed by many artists, and people spoke of the \"three beauties \
of the Kansei era\". These are also the years of the Kansei reforms, \
by which the government sought to suppress luxury and entertainments. \
Utamaro took up this trio several times in different forms. This impression is \
kept at the Museum of Fine Arts in Boston, whose collection of Japanese prints, \
one of the richest outside Japan, owes much to the collector William Sturgis \
Bigelow."""
facture = """
Utamaro was one of the first to frame women in bust, in close-up, in the manner \
of actor portraits. The faces are made of only a few lines, without shadow \
or modelling. All the virtuosity lies in the hairstyles: the engraver cut one by one \
the fine hairs of the forehead and nape. The pyramidal composition and the restrained palette, \
made of blacks, ochres and a few reds, give the image great \
elegance."""
details = [
  "Ohisa's round fan, with its emblem of oak leaves.",
