[[oeuvres]]
titre = "The Actor Ōtani Oniji III as the Servant Edobei"
artiste = "Tōshūsai Sharaku"
annee = "1794"
image = "sharaku-oniji.jpg"
technique = "Nishiki-e print on a black mica ground, ōban format, approximately 38 × 25 cm"
collection = "Tokyo National Museum"
note = "A kabuki actor in the role of a brigand, hands clenched forward: the most famous of Sharaku's portraits."
description = """
Against a dark, glittering grey background, a man is seen in bust, three-quarter view, his \
face turned to the right. His black eyebrows are knitted, his eyes stare \
hard at an invisible adversary, his mouth is clamped in a downturned line. His \
hair is gathered in a tight topknot, with the shaved forehead of common men. He \
wears a striped garment of brown and ochre over a black kimono, and throws forward both \
hands, fingers spread, as if to seize or threaten. These hands look astonishingly \
small in relation to the face. On the shoulder, a round emblem bears the actor's \
crest. At right, Sharaku's signature, and beneath it the publisher's mark."""
evocation = """
Edobei is a brutal servant, a henchman about to rob his victim: \
Sharaku makes of him a figure of concentrated menace, tense as a spring. But \
behind the character, it is the actor he shows, with his own features, his jaw, his wrinkles, which \
contrasts with the flattering portraits of the day. It has \
often been supposed that this unsparing realism displeased the actors and their \
admirers, and would explain the brevity of Sharaku's career, but this is \
only a hypothesis. To the modern eye, these faces close to caricature, of striking \
intensity, count among the most expressive portraits in Japanese \
art."""
histoire = """
In the fifth month of 1794, at the Kawarazaki-za theatre in Edo, Ōtani Oniji III played the \
role of Edobei in the play Koi nyōbō somewake tazuna. The same month, the publisher Tsutaya \
Jūzaburō launched an unknown artist, Sharaku, with a spectacular series of twenty-eight \
bust portraits of actors on a black mica ground, including this one. Ten months later, \
Sharaku stopped publishing and disappeared. Forgotten in Japan, he was rediscovered by \
Western collectors in the late nineteenth century. The impression in the Tokyo National Museum, \
one of the finest known, is designated an Important Cultural Property of Japan."""
facture = """
The ground is printed with mica (kira-zuri): a mineral powder mixed with the colour, which \
glitters in the light and gives the portrait a precious sheen. Sharaku simplifies \
forms to the extreme: large dark surfaces of the garment, sharp lines of the \
face, pronounced asymmetry of the eyes and mouth. The hands, deliberately \
reduced, heighten the tension of the gesture. The tight framing, which cuts the body at the \
waist, comes from the bust-length actor portraits made fashionable a few years earlier \
by the artists of the Katsukawa school."""
details = [
  "The hands with spread fingers, astonishingly small.",
  "The knitted eyebrows and the mouth clamped downward.",
  "The glitter of the mica ground, as the angle changes.",
  "The vertical signature at right: Tōshūsai Sharaku ga.",
]
themes = ["kabuki", "actor", "portrait", "theatre", "caricature"]
anecdote = """
It was a German, Julius Kurth, who made Sharaku's fame: in a book of 1910, \
he ranked him among the greatest portraitists in history. Since then, Sharaku's prints \
have become among the most sought-after of all Japanese prints."""
salle = 4
mur = "est"
place = 1
largeur = 1.1

[[oeuvres]]
titre = "Princess Takiyasha Summoning a Skeleton Spectre"
artiste = "Utagawa Kuniyoshi"
annee = "c. 1844"
image = "takiyasha-squelette.jpg"
technique = "Nishiki-e print, triptych of three ōban sheets, approximately 36 × 74 cm"
collection = "British Museum, London"
note = "In a ruined palace, a sorceress princess conjures up a giant skeleton to terrify two warriors."
description = """
The image unfolds across three sheets. On the left, Princess Takiyasha, in a \
sumptuous red and blue kimono, reads aloud from a scroll of incantations, beneath a \
torn bamboo blind hanging from a lattice ceiling. At the centre, two warriors, \
the samurai Ōya no Tarō Mitsukuni and his companion, crouch on the floor, \
facing the monster. Above them, across the full width of the central and \
right sheets, a gigantic skeleton surges from the darkness: it leans through the \
torn blind, its empty sockets turned toward the men, its long bony fingers \
resting on the bamboo slats. The floor is strewn with debris."""
evocation = """
The print belongs to the taste of the time for ghost stories and \
tales of vengeance, which kabuki theatre and illustrated novels staged with \
delight. Takiyasha is the daughter of the rebel Taira no Masakado, killed in 940; she \
seeks to avenge her father by magic, and the warrior Mitsukuni is sent to \
fight her. The giant skeleton embodies the supernatural threat, but also death \
itself leaning over the living. Kuniyoshi plays like a virtuoso on the effect of \
surprise: the viewer, like the warriors, discovers the monster all at once. \
The image shows how much the nineteenth-century print loved spectacle and the thrill."""
histoire = """
Kuniyoshi drew on a novel by Santō Kyōden published in 1806, in which Takiyasha, withdrawn \
in her father's old ruined palace at Sōma, gathers conspirators and calls on \
sorcery. In the novel, Mitsukuni faces a crowd of skeletons; Kuniyoshi \
replaces them with a single giant skeleton, far more striking. The triptych was \
published around 1844, in the years following the Tenpō reforms, when \
censorship forbade portraits of actors and courtesans and pushed artists toward \
historical and legendary subjects. This impression is kept at the British Museum \
in London."""
facture = """
The triptych, three ōban sheets sold together, allows a very wide composition, \
which Kuniyoshi exploits by carrying the skeleton across from one sheet to the next. The \
skeleton has an anatomical accuracy rare in Japanese art: historians \
think that Kuniyoshi had studied Western anatomy books brought in by \
the Dutch. The black ground, the bone white and the few vivid colours of the \
princess create a theatrical contrast."""
details = [
  "The scroll of incantations read by the princess, at left.",
  "The skeleton's bony fingers resting on the bamboo blind.",
  "The samurai Mitsukuni, at the centre, staring at the monster.",
  "The red cartouches naming the characters.",
  "Kuniyoshi's signature at the bottom of each of the three sheets.",
]
themes = ["fantastic", "skeleton", "legend", "warrior", "triptych"]
anecdote = """
Takiyasha's father, Taira no Masakado, has remained a feared figure. His tomb, the \
Kubizuka, still stands among the office towers of Ōtemachi, in Tokyo, and \
tradition holds that those who tried to move it were struck by misfortune."""
salle = 5
mur = "nord"
place = 1
largeur = 2.1

[[oeuvres]]
titre = "Rooster and Hen with Hydrangeas"
artiste = "Itō Jakuchū"
annee = "1759"
image = "jakuchu-coqs-hortensias.jpg"
technique = "Colours on silk, hanging scroll, approximately 142 × 80 cm"
collection = "Museum of the Imperial Collections (Sannomaru Shōzōkan), Tokyo"
note = "One of the thirty scrolls of the Colourful Realm of Living Beings, painted for a Kyoto temple: a rooster and a hen beneath a cascade of hydrangeas."
description = """
At the bottom of the composition, a rooster with russet and brown plumage, its crest bright red, \
bends toward the ground; its long black tail curves in an arc above him. On the \
right, a hen with plumage speckled brown and white pecks, head lowered. \
Behind them, a dark rock dotted with blue-green moss. Above, blue and white \
hydrangeas descend in tight clusters from the top of the scroll, with their \
broad leaves. Pink flowers blossom near the rooster, and white flowers \
at the foot of the rock. At upper left, a small bird perches on a branch. On \
the left, a vertical inscription gives the date and the painter's signature, followed by \
two red seals."""
evocation = """
This scroll belongs to the Dōshoku sai-e, the \"Colourful Realm of Living Beings\", a \
set of thirty paintings of birds, flowers, insects and fish. Jakuchū, \
a fervent Buddhist, offered it to a temple: for him, every living being, from the rooster to the \
flower, possesses Buddha-nature and deserves to be painted with the same fervour. It has \
been seen as an almost ecstatic celebration of life, in which the abundance of forms and \
colours expresses the richness of the world. The rooster, a familiar animal, becomes under his \
brush a blazing, almost fantastic creature. This work is not a popular \
print but a unique painting, made to last."""
histoire = """
The inscription dates the work to the autumn of 1759. Jakuchū, a former Kyoto greengrocer \
who had given up his business to paint, worked for about ten years on \
this series. He offered it to the Zen temple Shōkoku-ji in Kyoto, together with a Buddha \
triptych, in 1765 and then in 1770, to adorn religious ceremonies. In 1889, the \
temple, in difficulty, gave the thirty scrolls to the imperial family, who paid \
it a large sum in return. They are now kept at the Museum of the \
Imperial Collections in Tokyo, and were designated a national treasure in 2021."""
facture = """
Jakuchū uses a very fine silk and mineral pigments of the best quality, \
which explain the freshness of the colours after more than two and a half centuries. He sometimes \
also paints on the back of the silk, to nuance the hues seen through transparency. \
Every feather, every petal is drawn with obsessive precision, but the \
composition, very dense and without depth, remains decorative. He draws on \
Chinese paintings of birds and flowers and on direct observation."""
details = [
  "The feathers of the rooster's neck, drawn one by one, like golden flames.",
  "The hydrangea petals, blue or white, each outlined with a fine line.",
  "The small bird perched at the very top left.",
  "The inscription at left, which dates the painting to autumn 1759.",
  "The dots of blue-green moss on the dark rock.",
]
themes = ["rooster", "flowers", "birds", "nature", "Buddhism"]
anecdote = """
According to an old tradition, Jakuchū raised roosters in his garden and observed them \
at length before painting them. Roosters are, indeed, one of the subjects he \
depicted most often."""
salle = 5
mur = "est"
place = 1
largeur = 0.9

[[artistes]]
nom = "Katsushika Hokusai"
vie = "Edo (Tokyo), 1760 – Edo, 10 May 1849"
biographie = """
Born in the Honjo district, east of Edo, Hokusai was first an apprentice woodblock engraver. In 1778, he entered the studio of Katsukawa Shunshō, a specialist in \
actor portraits, and signed his first prints with the name Shunrō. After leaving this \
studio, he turned his hand to everything: novel illustrations, luxury prints for poetry \
circles, paintings, drawing manuals. He constantly changed his artist name, more than \
thirty times, and according to tradition moved more than ninety times. \
From 1814 appeared the volumes of the Manga, thousands of sketches of people, \
animals and things. Around 1830, at over seventy, he published the \
Thirty-Six Views of Mount Fuji, which made him famous, then the One Hundred Views of Mount Fuji. \
He then signed himself \"the old man mad about drawing\". Poor to the end, helped by his daughter Ōi, \
herself a painter, he died at eighty-eight in Edo, regretting, it is said, \
not having a few more years to become a true painter. Discovered in \
Europe in the second half of the nineteenth century, he became for Westerners the very figure of \
Japanese art."""
style = """
Hokusai is an insatiable draughtsman who wants to capture everything: the movement of water, \
the gestures of craftsmen, the shape of mountains. He combines Japanese and \
Chinese tradition with the Western perspective discovered in Dutch engravings. \
His compositions, based on simple geometric forms, circles and triangles, \
have the force of a sign. The Prussian blue, the bold framing and the energy of the \
line in his landscapes deeply marked the Impressionists, Art Nouveau and \
the whole modern image."""

[[artistes]]
nom = "Utagawa Hiroshige"
vie = "Edo (Tokyo), 1797 – Edo, 12 October 1858"
biographie = """
Born Andō Tokutarō into a family of low-ranking samurai in charge of firefighting \
at Edo Castle, Hiroshige lost both parents around the age of \
twelve and inherited his father's post. Shortly afterward he entered the studio \
of Utagawa Toyohiro and received the name Hiroshige. He first drew actors and \
beauties, without great success. Landscape revealed him: in 1833–1834 appeared the \
Fifty-Three Stations of the Tōkaidō, the great road between Edo and Kyoto, which enjoyed \
immense success. He had already given up his post as a fireman, in 1823, to devote himself \
to printmaking. He published dozens of series of views, from the Kisokaidō to the famous sites of \
Edo, as well as pictures of flowers and birds. In 1856, he became a Buddhist \
monk and undertook the One Hundred Famous Views of Edo, his last great series. He \
died in 1858, probably carried off by the cholera epidemic that struck the city. His \
prints, which arrived in Europe en masse, were collected by Van Gogh, Monet and \
Whistler."""
style = """
Hiroshige is the poet of landscape and the seasons. Gentler than Hokusai, he captures \
the atmosphere of a place at a precise moment: rain, snow, mist, \
moonlight. His gradations of blue, red and grey, his giant foregrounds and \
cropped framings inspired the Impressionists and Van Gogh, who copied him. He also shows, \
with humour and tenderness, travellers and ordinary people."""

[[artistes]]
nom = "Suzuki Harunobu"
vie = "c. 1725 – Edo (Tokyo), 1770"
biographie = """
Little is known of Harunobu's youth, or of his training. His first known \
works, actor portraits printed in two or three colours, date from \
the late 1750s. His style owes much to the Kyoto painter Nishikawa \
Sukenobu, whose illustrated books showed graceful, fragile women. The \
turning point came in 1765: wealthy Edo amateurs, gathered in poetry circles, \
commissioned from him illustrated calendars, which they exchanged at New Year. With the \
engravers and printers, Harunobu perfected for them full-colour printing, \
with some ten blocks: nishiki-e. Publishers then sold these \
images to the public, who snapped them up. In five years, until his sudden death in 1770, \
Harunobu produced several hundred prints: young lovers, scenes of daily \
life, elegant parodies of classical poetry, portraits of the famous \
teahouse waitress Kasamori Osen. He became the most imitated master of his \
time, to the point that others signed his name after his death."""
style = """
Harunobu creates a world of softness and dream, peopled with young people of \
slender silhouettes, tiny hands and almost identical faces. His small-format prints \
play on tender colours, plain grounds and blind embossing. He loves \
hidden literary allusions, which the cultivated viewer was expected to recognise. His \
invention of nishiki-e opens the golden age of the colour print."""

[[artistes]]
nom = "Kitagawa Utamaro"
vie = "c. 1753 – Edo (Tokyo), 1806"
biographie = """
Utamaro's place and date of birth remain uncertain. He trained with the \
painter Toriyama Sekien, known for his illustrated books of fantastic creatures. In the \
early 1780s, he met the publisher Tsutaya Jūzaburō, who housed him, published him \
and made him his star. He first became known through magnificent books \
illustrated with comic poems, including the Book of Insects of 1788, with observations \
of great finesse. Around 1791–1793, he invented the bust-length portrait of a woman, in \
close-up, and became the undisputed master of bijin-ga, pictures of beautiful women: \
courtesans of the Yoshiwara district, famous waitresses, mothers and children, women at \
work. After Tsutaya's death in 1797, he worked for many publishers. In \
1804, he was arrested for depicting the great warlord Toyotomi Hideyoshi, \
a forbidden subject, and sentenced to wear handcuffs for fifty days. He died \
two years later. In 1891, Edmond de Goncourt devoted a book to him that made his \
reputation in Europe."""
style = """
Utamaro is the painter of feminine beauty. His women, slender with elongated faces, \
are captured in their intimacy: a hairstyle, a gesture, a glance. He \
frames his sitters in close-up, in bust, and makes of the face, the nape and the \
hair, engraved with extreme finesse, the heart of the image. His supple line and \
mica grounds fascinated the Japonistes, from Goncourt to Toulouse-Lautrec."""

[[artistes]]
nom = "Tōshūsai Sharaku"
vie = "Active in Edo (Tokyo) in 1794–1795; dates of birth and death unknown"
biographie = """
Sharaku is the enigma of the Japanese print. He appears suddenly in the fifth month of \
1794, when the publisher Tsutaya Jūzaburō publishes all at once twenty-eight large bust portraits \
of kabuki actors, on a black mica ground, signed with this unknown name. In the \
following months appeared other series, full-length and increasingly \
conventional; then, in early 1795, after about one hundred and forty prints in ten \
months, Sharaku vanished without a trace. His identity has caused much \
ink to flow: some have wanted to see in him Hokusai, Utamaro or other known artists. A note \
written in 1844 by the scholar Saitō Gesshin identifies him with Saitō Jūrōbei, a Noh actor \
in the service of the lord of Awa, and documents found since have strengthened this \
hypothesis, now the most widely accepted. Little appreciated in his day, Sharaku fell into \
oblivion in Japan. He was rediscovered by Western collectors, and in 1910 \
the book by the German Julius Kurth established him as one of the great portraitists of \
art history."""
style = """
Sharaku shows actors without beautifying them: hooked noses, heavy jaws, wrinkles, \
shifty glances, clenched hands. He simplifies forms, accentuates asymmetries and \
places his figures on glittering mica grounds. The result is part \
psychological portrait and part caricature, of an intensity that the Japanese print \
had never reached and would scarcely reach again."""

[[artistes]]
nom = "Utagawa Kuniyoshi"
vie = "Edo (Tokyo), 1797 – Edo, 1861"
biographie = """
The son of an Edo silk dyer, Kuniyoshi entered around 1811 the studio of the great \
Utagawa Toyokuni, master of actor portraits. His beginnings were difficult, and he \
lived for several years in poverty. Success came around 1827 with a series \
devoted to the one hundred and eight heroes of the Suikoden, a Chinese novel of brigands with hearts of gold, \
which launched the vogue for warrior prints, musha-e. Kuniyoshi became its \
master, but he also turned his hand to landscape, legends, comic scenes and \
animals. During the Tenpō reforms, from 1842, censorship forbade \
portraits of actors and courtesans: he got around it with mischief, lending the \
actors' features to cats, frogs or fish, and slipped \
satirical allusions to the authorities into his triptychs. A great lover of cats, he \
always kept several in his studio. He trained many pupils, including Tsukioka \
Yoshitoshi, one of the last great masters of the print. He died in Edo in 1861."""
style = """
Kuniyoshi is the master of the spectacular: warriors in the midst of battle, monsters, \
ghosts, giant whales, often spread across triptychs. He borrows from \
Western engraving modelling, perspective and anatomy, and mixes them with an \
overflowing imagination and constant humour. His bold compositions and \
taste for the fantastic foreshadow manga and inspired the art of Japanese tattooing."""

[[artistes]]
nom = "Itō Jakuchū"
vie = "Kyoto, 1716 – Kyoto, 1800"
biographie = """
The eldest son of a wealthy vegetable wholesaler of the Nishiki market in Kyoto, Jakuchū \
took over the family business at twenty-three, on his father's death. But \
trade interested him little: he studied painting, first with a master of the \
Kanō school, then by copying the Chinese paintings kept in the temples of \
Kyoto, and above all by observing nature. Around the age of forty, he left the business to \
his younger brother to devote himself entirely to painting. Close to the Zen monk \
Daiten, of the Shōkoku-ji temple, who is said to have given him his artist name, he painted for \
about ten years the thirty scrolls of the Colourful Realm of Living Beings, offered \
to the temple. He also practised monochrome ink painting, with great freedom, and invented original \
techniques, such as his screens divided into thousands of small squares. The \
great fire of Kyoto, in 1788, destroyed his house; he spent his last years \
near the Sekihō-ji temple, south of the city, where he drew statues of disciples \
of the Buddha. Long neglected, he is today one of the most admired painters in \
Japan."""
style = """
Jakuchū is a singular painter, who belongs to no school. He unites the \
almost scientific precision of observation, feather by feather and petal by petal, \
with a decorative and sometimes strange imagination. His colours, of exceptional intensity and \
freshness, and his dense compositions, without depth, give \
his birds and flowers an almost supernatural presence. He is not an \
ukiyo-e artist, but a contemporary of the first masters of the colour \
print."""
