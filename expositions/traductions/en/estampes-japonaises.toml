nom_court = "Ukiyo-e"
mouvement = "Ukiyo-e, the Japanese Woodblock Print"
cadre = "estampe"
couleur = "#2c4a7e"
titre = "Ukiyo-e, Pictures of the Floating World"
artiste = "Hokusai, Hiroshige, Utamaro, Sharaku…"
dates = "1759–1857"
accroche = "Virtual exhibition · Tokyo National Museum"
introduction = """
Ukiyo-e, \"pictures of the floating world\": in Edo, present-day Tokyo, prints carved \
on wood and sold for the price of a bowl of noodles show kabuki actors, \
fashionable beauties, and then landscapes and legends. The visit follows this golden age, \
from Harunobu's first colour prints to Hiroshige's One Hundred Views of Edo, \
by way of Hokusai's Great Wave, with, as a counterpoint, a painting on silk \
by Itō Jakuchū. The building is inspired by the Honkan of the Tokyo National Museum and by \
Japanese houses: low rooms with paper-coloured walls, linked by a \
long veranda, the engawa. The prints, which measure about thirty centimetres, \
are shown enlarged."""
vitrine = "grande-vague.jpg"

[musee]
nom = "Tokyo National Museum"
ville = "Tokyo, Japan"
architecte = "Watanabe Jin (Honkan)"
construction = "Honkan opened in 1938"
presentation = """
Founded in 1872, the Tokyo National Museum is the oldest museum in Japan. Set \
in Ueno Park, it occupies several buildings; the first, designed by \
the English architect Josiah Conder, was ruined by the Great Kantō Earthquake \
of 1923. The Honkan, the main building that replaced it, is the work of Watanabe Jin \
and opened in 1938: a Western-style reinforced-concrete construction, crowned with a great \
Japanese tiled roof, in the style known as \"Imperial Crown\". A \
monumental staircase leads to the upper floor, where the galleries follow the history of Japanese art, \
from prehistory to the Edo period. Ukiyo-e prints, which light damages, are \
displayed there on rotation, a few weeks at a time, in a gallery devoted to them; the museum holds thousands, along with paintings, swords, \
lacquerware, kimonos and numerous national treasures."""
ici = """
ARTEON's building borrows from the Honkan its print galleries and from the Japanese house \
its human-scale plan: ceilings of three to four metres, walls the colour of \
washi paper. One enters from the south into the genkan, which opens onto \"The Engawa · The One Hundred \
Views of Edo\", a long veranda of nearly twenty metres. To the north, it serves Room \
I · Hokusai and Fuji, to the west, and Room III · Visions, to the east. Between them, \
Room II · Beauties and Actors links them: one passes through it from Room I to Room \
III, before returning to the veranda."""

