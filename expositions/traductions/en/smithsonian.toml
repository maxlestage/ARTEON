[[sculptures]]
titre = "Life Mask of Abraham Lincoln"
artiste = "Clark Mills"
annee = "1865"
modele = "lincoln-mask.stl"
technique = "Plaster, cast from life"
collection = "National Portrait Gallery, Washington"
note = "Cast two months before his assassination: the face of a president worn out by four years of war."
description = """
The face of Abraham Lincoln appears as it was in February 1865, eyes closed, \
cast directly on the skin. The cheeks are hollow, the cheekbones prominent, deep \
wrinkles cross the forehead and frame the mouth. A short beard covers the \
chin and jaw, without a moustache, as in his last photographic \
portraits. On the right cheek, near the mouth, the president's mole can be made out. \
The lips are pressed together, the eyelids heavy. The mask is limited to the \
face, without the neck or hair. This is not an interpreted sculpture, but an \
imprint, of an almost unsettling precision, of every fold and every contour of the \
skin."""
evocation = """
Unlike a painted or sculpted portrait, the mask neither flatters nor idealises: it \
keeps the exact trace of the features, like a photograph in relief. Compared with the first \
mask of Lincoln, taken by Leonard Volk in 1860, before his election, this one shows \
how much four years of civil war marked the man: thinness, weariness, \
gravity. It is often presented as the most poignant testimony to the personal price \
paid by the president to preserve the Union and abolish slavery. Taken a few \
weeks before the victory and the assassination of 14 April 1865, it has taken on the value of a \
relic. The closed eyes, required by the technique, retrospectively give it \
the appearance of a death mask, although Lincoln was then very much alive."""
histoire = """
Clark Mills, sculptor of the equestrian statue of Andrew Jackson in Washington, whose \
foundry had also cast the statue of Freedom crowning the dome of the Capitol, \
made this cast in February 1865, probably with a view to a bust or statue of the \
president. Lincoln had just been re-elected and began his second term on 4 March. The original mould \
made it possible to take several plaster copies over the years, and casts \
circulated among sculptors and collectors. Together with Volk's, Mills's mask \
has become a reference document for knowing Lincoln's true face, \
often consulted by the artists who devoted monuments to him. The copy in \
the National Portrait Gallery was digitised in 3D by the Smithsonian."""
facture = """
Life casting follows an ancient technique: the face, coated with a greasy substance \
so that the plaster adheres neither to skin nor hair, is covered with liquid plaster, \
which is left to set for a few minutes before being removed. This yields a hollow mould, \
into which plaster is then poured to obtain the mask in relief. The \
sitter must remain perfectly still, eyes closed. Mills, a former plasterer trained \
on the building sites of Charleston, had mastered this process. The white plaster, with no colour \
or retouching, preserves the texture of the skin, the beard and the finest wrinkles."""
details = [
  "The mole on the right cheek, near the mouth.",
  "The deep furrows running from the nose to the corners of the lips.",
  "The beard without a moustache, whose texture can be sensed.",
  "The closed eyelids, heavy with fatigue.",
]
themes = ["portrait", "Civil War", "president", "memory", "casting"]
anecdote = """
John Hay, one of Lincoln's secretaries, later wrote that this mask was of an \
unspeakable sadness: the face of a man on whom grief and cares had \
done their worst, without managing to defeat him."""
