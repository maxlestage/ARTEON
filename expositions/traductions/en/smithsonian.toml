[[artistes]]
nom = "Thomas Cole"
vie = "Bolton (England), 1 February 1801 – Catskill (New York), 11 February 1848"
biographie = """
Born in Lancashire at the height of the Industrial Revolution, Thomas Cole was first \
apprenticed to an engraver of designs for printed cloth. In 1818, his family emigrated \
to the United States; he lived in Philadelphia and then in Ohio, where he became an \
itinerant portraitist and learned painting almost on his own. Settled in New York in 1825, he went up \
the Hudson and painted the Catskill Mountains: his first landscapes were bought by the \
painters John Trumbull and Asher B. Durand, and success was immediate. From 1829 to 1832, \
he travelled in England and Italy, where he studied Claude Lorrain, Turner and the Roman \
ruins. On his return, the merchant Luman Reed commissioned The Course of Empire, five \
canvases on the birth, glory and fall of a civilisation (1833–1836). In 1836, \
he married Maria Bartow and settled at Cedar Grove in Catskill, where he took in his only \
true pupil, Frederic Church. He also painted the cycle The Voyage of Life (1840), \
returned to Europe in 1841–1842, and died of pleurisy in 1848, at forty-seven. \
Durand paid tribute to him in Kindred Spirits (1849)."""
style = """
Cole is regarded as the founder of the Hudson River School, the first truly American \
landscape movement. He combines careful observation of nature, recorded \
in drawings made on the spot, with a learned composition reworked in the studio. \
His landscapes often oppose shadow and light, the wild and the cultivated, and \
carry a moral or religious dimension: for him, American nature was a \
book in which Creation could be read. His allegorical cycles, such as The Course of Empire, \
extend this reflection on the destiny of nations. Durand, Church and the whole \
following generation of landscapists drew on his example."""

[[artistes]]
nom = "Albert Bierstadt"
vie = "Solingen (Prussia), 7 January 1830 – New York, 18 February 1902"
biographie = """
Born in the Rhineland, Albert Bierstadt was only one year old when his family emigrated to New Bedford, \
a whaling port in Massachusetts. In 1853, he returned to Germany to study at \
Düsseldorf, whose academy then attracted many Americans; there he mixed with Emanuel \
Leutze and Worthington Whittredge, and travelled through the Alps and Italy. Back in 1857, he \
joined in 1859 the expedition of the surveyor Frederick W. Lander to the Rocky \
Mountains, from which he brought back sketches and photographs. His large canvases of the West, \
such as The Rocky Mountains, Lander's Peak (1863), made him one of the most \
famous and best-paid painters in America. In 1863, he discovered Yosemite; in 1866, \
he married Rosalie, the ex-wife of the writer Fitz Hugh Ludlow. He stayed in Europe from \
1867 to 1869, then painted California, Canada and Alaska. But from the 1880s \
on, taste changed: critics judged his canvases theatrical, his large house \
at Irvington, on the Hudson, burned in 1882, and his affairs declined until \
bankruptcy in 1895. He died in New York in 1902, almost forgotten."""
style = """
Bierstadt marries the precision of the Düsseldorf school, meticulous drawing and a smooth \
surface, with a sense of spectacle inherited from Romanticism. His views of the West are \
recomposed in the studio from studies made on the spot: he gathers peaks, \
waterfalls, lakes and golden light to create an ideal image, grander than \
nature. He exhibited his giant canvases alone, like events. His images \
contributed greatly to shaping the vision of the West in American and \
European opinion, and fed interest in sites such as Yosemite. Mocked for his \
grandiloquence late in life, he was rediscovered in the second half of the 20th \
century."""

[[artistes]]
nom = "Frederic Edwin Church"
vie = "Hartford (Connecticut), 4 May 1826 – New York, 7 April 1900"
biographie = """
Son of a wealthy Hartford businessman, Frederic Edwin Church became in 1844 \
a pupil of Thomas Cole at Catskill, a rare privilege: Cole trained practically no \
other disciple. By 1848, at twenty-two, he was elected a member of the National Academy \
of Design. Passionate about the writings of the naturalist Alexander von Humboldt, he left in \
1853 for Colombia and Ecuador, where he returned in 1857. Niagara (1857) and then The \
Heart of the Andes (1859) caused a sensation: exhibited alone, the canvases drew paying \
crowds. There followed Twilight in the Wilderness (1860), The Icebergs (1861), \
after a voyage off Labrador, and Cotopaxi (1862). In 1860, he married Isabel \
Carnes; the death of two of their children, in 1865, affected him deeply. He then travelled \
in Europe and the Near East (1867–1869), then had Olana built above \
the Hudson, a Persian-inspired residence whose grounds he also designed. From \
the 1870s, rheumatism gradually prevented him from painting. He died in \
New York in 1900, by which time his style had gone out of fashion."""
style = """
Church takes the ambitions of the Hudson River School to their peak. He combines the exactness \
of a naturalist, attentive to geology, botany and the phenomena of the sky, with \
the pursuit of grand effects: blazing sunsets, volcanoes, ice, \
cataracts. His smooth, meticulous painting renders both the transparency of water \
and the incandescence of clouds. He conceived his large canvases as spectacles, \
shown alone, with carefully designed lighting and monumental framing. Famous in his \
lifetime, forgotten in the early 20th century, he is today regarded as one of the \
greatest American landscape painters."""

[[artistes]]
nom = "James McNeill Whistler"
vie = "Lowell (Massachusetts), 11 July 1834 – London, 17 July 1903"
biographie = """
James Abbott McNeill Whistler spent part of his childhood in Saint Petersburg, where \
his father, an engineer, built a railway line for the tsar. Back in the \
United States, he entered the military academy at West Point, from which he was dismissed in 1854, \
then learned etching while working as a cartographer. In 1855, he left for Paris, \
attended the studio of Charles Gleyre and befriended Fantin-Latour and Courbet. Settled \
in London in 1859, he divided his life between the two capitals. His Symphony in White, No. \
1, The White Girl, caused a sensation at the Salon des Refusés in 1863. He \
collected Far Eastern porcelain and prints, and painted his “nocturnes” \
of the Thames and his “arrangements.” In 1877, the critic John Ruskin accused him of having \
flung a pot of paint in the public's face; Whistler sued him for \
libel, which he won in 1878, but with damages of one farthing, a quarter of a \
penny. Ruined by the costs, he went bankrupt in 1879 and left to make etchings in Venice. The \
1880s and 1890s finally brought him recognition, in France as in \
England. He died in London in 1903."""
style = """
Whistler claims art for art's sake: painting should neither narrate nor moralise, \
but create a harmony of forms and colours, like music. Hence his titles, \
“symphonies,” “arrangements,” “nocturnes.” His palette is often reduced to \
a few neighbouring tones, applied in thin, fluid layers. He borrows from Japanese \
prints their asymmetrical compositions, flat areas of colour and framing, and from \
Velázquez the art of greys and blacks. A first-rate printmaker, he also renewed \
etching. His conception of an autonomous painting, detached from subject, foreshadows \
abstraction and left its mark on the Symbolists as on the moderns."""

[[artistes]]
nom = "Thomas Eakins"
vie = "Philadelphia, 25 July 1844 – Philadelphia, 25 June 1916"
biographie = """
Thomas Eakins spent almost his whole life in his native city, Philadelphia. After \
studies at the Pennsylvania Academy of the Fine Arts, supplemented by anatomy courses \
at the Jefferson Medical College, he left in 1866 for Paris. There he studied at the École des \
Beaux-Arts in the studio of Jean-Léon Gérôme, also worked with Léon Bonnat and the \
sculptor Augustin Dumont, then discovered Velázquez and Ribera in 1869 at the Prado \
in Madrid. Back in 1870, he painted the rowers of the Schuylkill River, then The \
Gross Clinic in 1875. A teacher at the Pennsylvania Academy from \
1876, then director, he imposed there the study of the nude model and dissection. In 1886, he \
was forced to resign after removing the loincloth from a male model in front of \
female students. A passionate photographer, he collaborated with Eadweard Muybridge on the \
study of motion. In 1884, he married the painter Susan Macdowell, his former \
pupil. Long kept at the margins, he painted The Agnew Clinic in 1889 and \
received a few honours only late in life. He died in Philadelphia in 1916."""
style = """
Eakins is the great American realist painter of his century. To the academic rigour \
learned from Gérôme, he adds a scientific knowledge of anatomy, \
perspective and movement, studied through dissection and photography. His \
paintings, built with geometric precision, refuse all flattery: his \
portraits show the wrinkles, the fatigue, the introspection. His dark palette and \
chiaroscuro owe much to the Spanish masters and to Rembrandt. Misunderstood in his \
lifetime, he is recognised in the 20th century as a major figure; through his pupil Thomas \
Anshutz, teacher of Robert Henri, he also influenced the realists of the \
Ashcan School."""

[[artistes]]
nom = "John Singer Sargent"
vie = "Florence, 12 January 1856 – London, 14 April 1925"
biographie = """
Born in Florence to American parents settled in Europe, John Singer Sargent grew up \
amid family travels between Italy, France, Switzerland and Germany, and did not \
discover the United States until the age of twenty. In 1874, he entered the studio of the portraitist \
Carolus-Duran in Paris and quickly made his mark at the Salon, with Fumée d'ambre gris (1880), \
El Jaleo (1882) and The Daughters of Edward Darley Boit (1882). The scandal of Madame X, in \
1884, slowed his Parisian career: in 1886, he settled in London, in the \
Chelsea district. Painted in the village of Broadway, Carnation, Lily, Lily, Rose \
(1885–1886) was bought by the Tate in 1887. Sargent became the most \
sought-after portraitist of English and American high society. Around 1907, tired of commissions, \
he almost gave up portraiture for watercolour and for large mural decorations at the \
Boston Public Library and the Museum of Fine Arts, Boston. Sent to the front in 1918 \
as a war painter, he brought back Gassed (1919). He died in London in \
1925."""
style = """
Sargent is famous for his virtuosity: a quick, broad and fluid touch, often \
applied in a single go, which gives an impression of total ease. Heir to \
Velázquez and Frans Hals through Carolus-Duran's teaching, he also practised \
Impressionism alongside Monet, at Giverny. His portraits capture the elegance, \
the social rank and the personality of his sitters, with a keen sense of fabrics, \
reflections and poses. His watercolours, free and luminous, rank among the finest \
of their time. Long judged superficial by modernist critics, he has \
regained a leading place since the 1980s."""

[[artistes]]
nom = "Mary Cassatt"
vie = "Allegheny City, Pennsylvania, 22 May 1844 – Le Mesnil-Théribus, Oise, 14 June 1926"
biographie = """
From a well-to-do Pennsylvania family, Mary Cassatt spent part of her childhood \
in Europe. She studied at the Pennsylvania Academy of the Fine Arts, then left in 1866 \
for Paris, where the École des Beaux-Arts remained closed to women: she took private \
lessons, notably from Jean-Léon Gérôme, and copied the masters at the Louvre. \
Accepted at the Salon as early as 1868, she settled permanently in Paris in 1874. In 1877, Edgar \
Degas invited her to exhibit with the Impressionists; she took part in their exhibitions \
of 1879, 1880, 1881 and 1886, the only American in the group. Her parents and her sister Lydia \
joined her in Paris. After the great exhibition of Japanese prints in 1890, she \
produced a series of colour prints. In 1893, she painted a vast decoration \
for the Woman's Building at the Chicago Exposition, now lost. An adviser to \
American collectors such as Louisine and Henry Havemeyer, she helped bring \
Impressionism into the museums of the United States. Suffering from cataracts, she \
stopped working around 1914 and died at her château of Beaufresne, in the Oise."""
style = """
Mary Cassatt applies Impressionist modernity to a world she knew from \
within: the lives of women, motherhood, tea, reading, the theatre box. \
Trained in rigorous drawing, an admirer of Degas, she favours the construction of \
figures and unexpected framing over the dissolution of forms in \
light. Japanese prints inspired in her plunging views, flat areas of colour and \
decorative patterns. She was also a remarkable printmaker, notably in her colour \
prints of 1891, combining drypoint and aquatint. Her work opened the way for \
American women artists and gave the theme of mother and child a modern \
gaze."""

[[artistes]]
nom = "Winslow Homer"
vie = "Boston, 24 February 1836 – Prouts Neck (Maine), 29 September 1910"
biographie = """
Son of a Boston merchant, Winslow Homer learned the trade with a lithographer, \
then became a freelance illustrator for the weekly Harper's Weekly. During the \
Civil War, he followed the Army of the Potomac and drew the daily life of the \
soldiers; his painting Prisoners from the Front (1866) made him known and was shown at \
the Exposition Universelle in Paris in 1867, a city where he stayed nearly a year. In the \
1870s, he painted rural childhood, country schools, outdoor leisure, \
and took up watercolour. A stay of about twenty months at Cullercoats, a North Sea fishing \
village, in 1881–1882, transformed his art: the sea, storms and \
men's struggle against the elements became his great subjects. In 1883, he \
settled at Prouts Neck, on the coast of Maine, where he lived in solitude facing the ocean. \
He nonetheless travelled to Florida, the Bahamas, Bermuda, and the forests of the \
Adirondacks and Quebec, from which he brought back brilliant watercolours. Unmarried \
and secretive, he died in his studio at Prouts Neck in 1910."""
style = """
Homer is, with Eakins, one of the great painters of American realism. Coming from \
illustration, he retains a sense of clear composition and an immediately \
legible narrative. His painting is frank, built in broad masses, with a \
vigorous touch that gives weight to water and rocks. He observes nature without \
sentimentality: the sea is powerful, often threatening, and man measures himself against \
forces beyond him. His watercolours, of exceptional freedom and luminosity, \
raised the medium to the rank of high art in the United States. He is \
often held to be the most American of the painters of his century."""

[[artistes]]
nom = "Horatio Greenough"
vie = "Boston, 6 September 1805 – Somerville (Massachusetts), 18 December 1852"
biographie = """
Son of a wealthy Boston real-estate developer, Horatio Greenough took an interest in \
sculpture very young and studied at Harvard. In 1825, he left for Rome, where he frequented \
the circle of the Danish sculptor Bertel Thorvaldsen. After a brief return to the \
United States, he settled in 1828 in Florence, becoming one of the first American \
sculptors to make a career in Italy, where marble, craftsmen and antique \
models were to be found. The writer James Fenimore Cooper, his first great patron, commissioned from him \
a group of singing cherubs, then backed his candidacy for the statue of \
Washington, which Congress entrusted to him in 1832. He also made for the Capitol The \
Rescue, a group showing a pioneer protecting his family from a Native American \
warrior, installed in 1853 and removed in 1958. Back in the United States in 1851, \
he published essays on architecture and objects, in which he defended the idea that form \
should follow from function. He died suddenly of brain fever in 1852, at \
forty-seven."""
style = """
Greenough belongs to the neoclassical generation trained in Italy in the wake of \
Canova and Thorvaldsen: he seeks ideal beauty, pure forms and reference to \
Greek and Roman Antiquity. His George Washington pushes this logic \
to the limit, at the risk of offending the American public. But he was also an \
original thinker: in his writings, he criticises the imitation of past styles in architecture \
and advocates forms dictated by use, taking ships and \
machines as models. These ideas make him a forerunner of functionalism, often linked with \
the phrase “form follows function” of the architect Louis Sullivan."""

[[artistes]]
nom = "John Rogers"
vie = "Salem (Massachusetts), 30 October 1829 – New Canaan (Connecticut), 26 July 1904"
biographie = """
From a Salem family, John Rogers interrupted his studies for reasons of \
health and worked as a machinist in machine shops, then for a \
railroad company in Hannibal, Missouri. An amateur sculptor, he modelled \
small clay figures in his spare time. In 1858, he left to study in Europe, in \
Paris and then Rome, but the neoclassical teaching disappointed him and he returned after \
a few months. In 1859, a small group, The Checker Players, was a great success \
at a charity sale in Chicago. Rogers settled in New York, exhibited The Slave \
Auction, then founded his business: he designed genre groups and \
reproduced them in plaster to sell at moderate prices, by catalogue. During the Civil \
War, his scenes of soldiers and civilians met with immense success. He thus created \
several dozen models, sold in tens of thousands of copies, \
until illness forced him to cease his activity in the 1890s. He spent \
his last years in New Canaan, where his studio is preserved today."""
style = """
The “Rogers groups” are three-dimensional genre scenes, small, \
narrative and accessible, the opposite of the idealised marble statues of the period. \
In them Rogers tells stories of daily life, war, literature \
or theatre, with a precise realism of faces, costumes and objects, and an \
often tender humour. His innovation was also industrial: serial casting, painted \
plaster, patents, mail-order sales. He brought sculpture into \
thousands of American middle-class homes, and his groups have become precious \
documents on the feelings and debates of his time, in particular on \
slavery and war."""

[[artistes]]
nom = "Clark Mills"
vie = "Onondaga County (New York State), 1810 – Washington, 12 January 1883"
biographie = """
An orphan at a young age, Clark Mills grew up in New York State and worked at various \
manual trades before becoming a plasterer and stucco worker. Settled in Charleston, \
South Carolina, in the 1830s, he developed a method of life casting that \
allowed him to make busts at low cost; a bust of the politician \
John C. Calhoun made him known. In 1848, having never seen an equestrian statue, he \
won the commission for a monument to Andrew Jackson for Washington. He built \
his own foundry and, after several failures, succeeded in casting the statue, \
unveiled in 1853 in Lafayette Square, opposite the White House: the rearing horse, \
balanced on its hind legs, is a technical feat, and it was the first \
bronze equestrian statue cast in the United States. He then made an equestrian statue \
of George Washington, unveiled in 1860. Between 1860 and 1862, his foundry cast \
Thomas Crawford's statue of Freedom, which crowns the dome of the Capitol, with the \
decisive help of Philip Reid, a worker whom he held in slavery. He died in \
Washington in 1883."""
style = """
Mills was self-taught, trained by the craft practice of plaster and casting \
rather than by academies. His talent was above all technical: life casting, \
bronze founding, mastery of the balance of masses, as shown by Jackson's rearing horse, \
which stands with no support other than its hind legs. His portraits, based on \
the direct imprint of faces, favour likeness over \
idealisation. Though his style seemed naïve to sculptors trained in Europe, he played a \
pioneering role in the birth of art founding in the United States and in the monumental \
statuary of Washington."""

[[artistes]]
nom = "Chine, dynastie des Qi du Nord"
vie = "Northern China, 550–577, capital Ye (in present-day Hebei province)"
biographie = """
In the 6th century, China was divided among several rival dynasties. In the north, after \
the breakup of the Northern Wei, the Northern Qi, in the east, and the Northern \
Zhou, in the west, fought one another. Founded in 550 by Gao Yang, the Northern Qi dynasty ruled from \
Ye, its capital; its court blended Chinese traditions and the cultures of the peoples of the \
steppes. Its rulers were fervent Buddhists: they funded temples, \
monasteries and cave sanctuaries, such as those at Xiangtangshan, carved into the \
mountains near the capital. The sculptures were the work of workshops of anonymous \
stone carvers, working on commission from the court, monks or pious laypeople \
who hoped thereby to accumulate merit. Brought from India along the routes of Central \
Asia, Buddhism then experienced a prodigious rise, and many texts were \
translated, such as the Flower Garland Sutra, which describes a universe in which every \
particle contains all worlds. In 577, the Northern Zhou, who were persecuting \
Buddhism, conquered the kingdom of the Qi and extended the destruction there. In 581, the \
Sui dynasty soon reunified China and restored the religion. The discovery in 1996, \
at Qingzhou, in Shandong, of hundreds of buried statues revealed the brilliance of the \
sculpture of this period."""
style = """
Northern Qi sculpture marks a turning point. To the slender silhouettes and cascading \
drapery of the Northern Wei succeed fuller, almost cylindrical bodies, \
wrapped in thin robes clinging to the skin, in the manner of the Indian sculpture \
of the Gupta period, whose models reached China through Central Asia. The \
faces become rounder and more serene. The statues were often painted \
and gilded, sometimes covered with patterns. This more natural style, attentive to the volume of the \
body, prepares the art of the Sui and Tang dynasties, the golden age of Chinese Buddhist \
sculpture."""
