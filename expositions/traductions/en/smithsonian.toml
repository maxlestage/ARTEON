[[oeuvres]]
titre = "The Gulf Stream"
artiste = "Winslow Homer"
annee = "1899"
image = "gulf-stream.jpg"
technique = "Oil on canvas, 71.4 × 124.8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A lone sailor on a dismasted boat, ringed by sharks, a waterspout on the horizon."
description = """
On the open sea, a Black man, bare-chested, lies half-reclined on the deck of a small \
crippled boat, which lists dangerously. The mast is broken; stalks of sugar \
cane spill from the hold. Around the boat, sharks circle in the dark \
blue waves, jaws open. The man does not look at them: he stares out to sea, looking weary \
or resigned. On the right, on the horizon, a waterspout rises between sea and clouds; \
far off to the left, almost invisible, a sailing ship passes. A few flying \
fish lie on the deck. The powerful swell lifts the boat and closes off the horizon, \
isolating the sailor in the middle of the ocean, with no land or help in sight."""
evocation = """
Homer paints a meditation on the human condition in the face of an indifferent nature: a \
lone man, deprived of any means of action, threatened at once by the sharks, the storm \
and the drift. The choice of a Black sailor, at the end of the 19th century, has prompted \
many readings. It has been seen as an evocation of the history of slavery and of \
the Atlantic slave trade, and of the precarious situation of African Americans after the failure of \
Reconstruction. Others read it as a more personal painting: Homer, ageing, \
had just lost his father in 1898, and the work takes on overtones of meditation on \
death. The quiet strength of the figure, who faces his fate without giving way to panic, has also \
been stressed by historians."""
histoire = """
The painting grew out of several of Homer's stays in the Caribbean and Florida, notably \
in the Bahamas in 1884–1885 and in 1898–1899. There he had painted in watercolour Black \
sailors, sharks and boats, some of whose sheets directly foreshadow the \
composition. Back in his studio at Prouts Neck, on the coast of Maine, he \
completed the large canvas in 1899. Exhibited from 1900, notably at the Pennsylvania \
Academy of the Fine Arts, it intrigued and disturbed by the harshness of its subject, and struggled \
to find a buyer. In 1906, the jury of the National Academy of \
Design exhibition unanimously recommended its purchase by the Metropolitan Museum of Art, which acquired it \
the same year."""
facture = """
Homer, who came from illustration and watercolour, paints here with a broad, energetic \
touch. The waves are built up in great strokes of the brush, deep blues, \
greens and the white of foam. The composition rests on an unstable diagonal: the \
listing boat, the sloping deck, the man's body following the slope. The reds and \
browns of the boat and the sugar cane cut against the blues of the water. The waterspout and \
the distant ship are reduced to a few touches, so that everything converges on \
the man and the sharks."""
details = [
  "The sugar cane stalks spilling from the hold.",
  "The flying fish stranded on the deck.",
  "The waterspout rising on the horizon, at right.",
  "The tiny ship, far off at the back left, too distant to bring help.",
  "The stump of the broken mast.",
]
themes = ["sea", "solitude", "danger", "death", "Caribbean"]
anecdote = """
Irritated by questions about the sailor's fate, Homer wrote to his dealer that the \
curious could be reassured: the man did not die of hunger, was not devoured by the \
sharks nor struck by the waterspout, and was rescued by a ship that does not appear in the \
painting."""
salle = 2
mur = "nord"
place = 2
largeur = 1.4

[[sculptures]]
titre = "George Washington"
artiste = "Horatio Greenough"
annee = "1840"
modele = "washington.stl"
technique = "Marble"
collection = "National Museum of American History, Washington"
note = "Commissioned for the Capitol rotunda: Washington bare-chested, as an ancient Zeus. The shocked public had it moved."
description = """
Seated on a massive throne, George Washington is portrayed bare-chested, like a god of \
Antiquity. A draped cloak covers his legs and falls over the seat; he wears \
sandals. His right arm is raised, the index finger pointing to the sky, while \
in his left hand he presents a sheathed sword, the hilt turned toward the \
viewer. The grave face is that of the hero of Independence, but the \
powerful body is that of the Jupiter of ancient sculptors. The sides of the throne are adorned with \
bas-reliefs: Apollo driving the chariot of the Sun, and the infant Hercules strangling the \
serpents sent against him. At the back, small figures represent Christopher \
Columbus and a Native American. The statue stands more than three metres high."""
evocation = """
Greenough wanted to give the young republic a monument worthy of Antiquity, by \
portraying its founder in the guise of Zeus, after the colossal statue that \
Phidias had sculpted for Olympia and that was known only through \
descriptions. The gesture has been read as a political message: the raised hand points to the \
higher source of power, while the outstretched sword, hilt first, recalls that \
Washington gave up his command and renounced power, like the Roman Cincinnatus. \
The reliefs of the throne associate America with light and nascent strength. But \
to the American public, little familiar with neoclassical art, the nudity of the father of the \
nation seemed shocking, even ridiculous: the work reveals the gap between a \
learned ideal and the taste of a democracy."""
histoire = """
In 1832, for the centenary of Washington's birth, Congress commissioned from \
Greenough, then living in Florence, a statue intended for the Capitol rotunda. The \
sculptor worked on it for nearly eight years, having the work carved from an enormous block \
of marble. Completed in 1840, the statue crossed the Atlantic and was installed in the \
rotunda in 1841. The reception was disastrous: it was poorly lit, its mass unsettling \
and its nudity shocking. As early as 1843, it was moved to the east lawn of the Capitol, exposed \
to the weather; a wooden shelter was even built to protect it. In 1908, it was \
transferred to the Smithsonian, in the Castle building, then, in 1964, to the new \
museum of history and technology, now the National Museum of American History."""
facture = """
Greenough follows the neoclassical teaching he received in Rome in the circle of the Danish \
sculptor Bertel Thorvaldsen: idealised forms, smooth surfaces, references to the antique. \
He first modelled the figure, from which a plaster model was made, then the statue was \
carved in white marble with the help of Italian craftsmen, following the practice of \
Florentine workshops. The head is inspired by the bust of Washington made from life \
by Jean-Antoine Houdon in 1785, while the torso and pose take up the type of the \
enthroned Zeus. The drapery, with its deep folds, contrasts with the polish of the skin."""
details = [
  "The right index finger raised toward the sky.",
  "The sheathed sword, held out hilt first, sign of the renunciation of power.",
  "The antique-style sandals emerging from the drapery.",
  "On the sides of the throne, Apollo on his chariot and the infant Hercules with the serpents.",
]
themes = ["hero", "antiquity", "nation", "neoclassicism", "power"]
anecdote = """
The statue provoked much mockery in Washington: people joked about a president \
fresh from the bath, or stretching out his arm to ask for his clothes. No other \
official effigy of the father of the nation was so ridiculed."""
