[[oeuvres]]
titre = "The Oxbow (The Bend of the Connecticut)"
artiste = "Thomas Cole"
annee = "1836"
image = "oxbow.jpg"
technique = "Oil on canvas, 130.8 × 193 cm"
collection = "Metropolitan Museum of Art, New York"
note = "After the storm, the river traces a loop: on one side the wild forest, on the other the cultivated fields."
description = """
From the summit of Mount Holyoke in Massachusetts, the gaze plunges down to the Connecticut \
Valley. The canvas is divided in two. On the left, a dark forest and a \
lightning-struck tree with broken branches cling to the escarpment, while the storm \
moves off, still letting fall curtains of rain over the hills. On the right, beneath a \
clearing sky, the river describes a broad loop amid cultivated fields, \
pastures and groves; thin wisps of smoke rise from the farms and small boats \
glide over the water. In the foreground, almost hidden among the rocks, a tiny \
painter in a hat sits before his easel and turns back toward us; \
beside him lie a parasol and a portfolio. The diagonal of the storm \
and that of the hill lead the eye from shadow into light."""
evocation = """
The painting is often read as a dialogue between two Americas: wild nature, \
sublime and threatening, and the landscape tamed by settlers, peaceful and prosperous. \
Cole does not decide outright. In his writings, he celebrates the beauty of untouched \
expanses and worries at seeing them cleared at great speed; some historians \
therefore see in the cultivated valley a promise, others the beginning of a loss. \
The passing storm may represent a moment of turning, that of a country choosing its \
path. By portraying himself at work, at the junction of the two worlds, the painter \
claims his role as witness and interpreter of the land, at a time when the young \
United States sought in its landscapes a grandeur comparable to the ruins and \
cathedrals of Europe."""
histoire = """
Cole painted The Oxbow in 1835–1836, while working on The Course of Empire, the great \
cycle of five canvases commissioned by the New York merchant Luman Reed. He intended this \
large-format landscape for the annual exhibition of the National Academy of Design in New \
York, and chose an already famous site: the meander seen from Mount Holyoke was one of the \
stops on the picturesque tour of New England, reproduced in guidebooks and \
engravings. The canvas was shown at the Academy in 1836, the very year Cole published his \
“Essay on American Scenery,” a plea for the distinctive beauty of the sites of the New \
World. The full title, highly descriptive, specifies that it is a view taken after a \
thunderstorm. The work then passed through private collections before being given to the \
Metropolitan Museum of Art in 1908 by Mrs. Russell Sage."""
facture = """
Cole contrasts two ways of painting: on the left, vigorous impasto, twisted trunks \
and dark greens verging on black; on the right, a smoother paint surface, with tender \
greens and golden ochres, where the fields are detailed with the tip of the brush. \
The panoramic format and elevated viewpoint draw on the tradition of topographical views \
and European landscapes, from Claude Lorrain to Turner, which Cole had \
studied on his journey of 1829–1832. The light breaking through the clouds above \
the valley unifies the composition and dramatises the passage from one world to the other."""
details = [
  "At the bottom, in the centre, the painter himself, tiny, seated before his easel.",
  "On the left, the lightning-struck tree with shattered branches, emblem of wild nature.",
  "The curtain of rain still falling on the hills at left.",
  "The thin wisps of smoke rising from the farms in the valley.",
  "On the hill in the background, the cleared plots in which some have read letters.",
]
themes = ["landscape", "wild nature", "storm", "river", "self-portrait"]
anecdote = """
Historians have thought they could make out, in the clearings of the hill in the background, \
Hebrew letters forming the word Noah and, read upside down as if from the sky, \
Shaddai, “the Almighty.” A divine signature hidden in the landscape? \
The hypothesis remains debated."""
salle = 2
mur = "ouest"
position = -5
largeur = 1.9

[[oeuvres]]
titre = "Among the Sierra Nevada, California"
artiste = "Albert Bierstadt"
annee = "1868"
image = "sierra-nevada.jpg"
technique = "Oil on canvas, 183 × 305 cm"
collection = "Smithsonian American Art Museum, Washington"
note = "Painted in Rome from his sketches of the West: a grand, almost divine vision of California's mountains."
description = """
In the heart of a mountain amphitheatre, a still lake reflects snow-capped peaks that \
seem to rise out of the mist. Light pierces a stormy sky, falls in slanting rays \
on the granite cliffs and sets the centre of the canvas ablaze. On the right, a waterfall \
tumbles down a vertiginous wall and vanishes into vapour; on the left, tall dark \
trees frame the scene like a theatre curtain. In the foreground, on the shore, \
deer have paused at the water's edge, and waterbirds alight or take \
flight on the surface. Not a trace of humankind: no path, no house, no traveller. \
The immense canvas, more than three metres wide, places the viewer before a panorama at once \
precise and impossible, so completely is everything gathered into a single glance."""
evocation = """
Bierstadt composes a kind of American Garden of Eden, a promised land bathed in an \
almost religious light. The rays piercing the clouds have often been read as \
the sign of a blessing bestowed on the West, just as the United States completes the \
conquest of the continent: the first transcontinental railroad was inaugurated the \
following year, in 1869. The painting exalts the idea of “Manifest Destiny,” the conviction \
that the nation was called to extend to the Pacific. But it passes over in silence \
the Native American peoples who lived in these valleys and were driven from them. Today it is seen \
as much as a celebration of grand nature as an idealised, \
almost promotional image of a territory offered to settlers and investors."""
histoire = """
Bierstadt discovered the Sierra Nevada and the Yosemite Valley in 1863, on a long \
journey west with the writer Fitz Hugh Ludlow, and brought back numerous \
studies painted on the spot. Five years later, during a stay in Europe, he \
composed in his Rome studio this imaginary view, assembled from his \
sketches: no real place corresponds exactly to this panorama. Before sending it to \
America, he exhibited it in Europe, notably in London and Berlin, to make \
the American West known to European audiences and establish his reputation there. The canvas then joined \
a private American collection. It was bequeathed to the Smithsonian American Art \
Museum in 1977 by Helen Huntington Hull, and has since ranked among the museum's \
masterpieces."""
facture = """
Trained in Düsseldorf, Bierstadt applies the method of that school: meticulous drawing, \
a smooth surface in which the brushwork disappears, a precision extending to the reflections in \
the water and the silhouettes of the animals. He combines this realism of detail with a \
theatrical staging: backlighting, violent contrasts between zones of shadow and breaks of \
light, trees as wings, peaks arranged like a stage set. The warm tones of the \
centre, golden and rosy, are set against the cold blues of the mountains and the deep greens \
of the foreground. The very large format, conceived to be exhibited alone, contributes to the \
effect."""
details = [
  "The waterfall, on the right, falling from a high wall into a cloud of vapour.",
  "The deer paused at the lake's edge, in the foreground.",
  "The rays of sunlight piercing the clouds and striking the cliffs.",
  "The waterbirds rippling the surface of the lake.",
  "The almost perfect reflection of the mountains in the water.",
]
themes = ["mountain", "American West", "light", "lake", "wild nature"]
anecdote = """
Bierstadt's travelling companion in 1863, the writer Fitz Hugh Ludlow, was married to \
a certain Rosalie. The couple divorced soon afterward, and in 1866 Rosalie married the \
painter, who took her the following year on his long European stay."""
salle = 2
mur = "ouest"
position = 0.5
largeur = 3.0

[[oeuvres]]
titre = "Niagara"
artiste = "Frederic Edwin Church"
annee = "1857"
image = "niagara.jpg"
technique = "Oil on canvas, 101.6 × 229.9 cm"
collection = "National Gallery of Art, Washington"
note = "No shore in the foreground: the viewer stands at the edge of the void, above the falls."
description = """
The viewer is suspended above the void, at the very spot where the water \
tips over. There is no bank, no rock, no stroller to serve as a point of reference: the foreground \
is filled by the green and white sheet of the river sliding toward the precipice. \
Horseshoe Falls, the great cataract seen from the Canadian side, traces a vast curve that \
recedes toward the back, to the horizon where a distant shore, low and \
wooded, appears. An immense cloud of spray rises from the abyss and mingles with the sky. On the right, a \
rainbow forms in the mist. The very elongated format, more than twice as \
wide as it is high, stretches the falls from edge to edge and gives the eye the sensation of \
sweeping across the whole landscape in a single movement."""
evocation = """
In the mid-19th century, Niagara was the great natural symbol of the United States, their \
answer to the monuments of Europe. Church makes it a physical experience: with no solid \
ground underfoot, the viewer feels the vertigo and the power of the water, what the \
age called the sublime, a mixture of dread and wonder. The rainbow, \
biblical sign of the covenant between God and humankind after the Flood, has often been \
interpreted as a promise made to the nation, in a Protestant America that \
saw in its landscapes the mark of Creation. It has also been seen as an almost \
scientific vision, faithful to the outlook of Alexander von Humboldt, whom Church admired: nature \
observed with exactness, yet grasped as a living whole, in perpetual motion."""
histoire = """
Church visited Niagara several times in 1856 and made numerous drawings and \
oil sketches from every angle, before painting the large canvas in his \
New York studio in the spring of 1857. The painting was shown alone in the gallery of the \
dealers Williams, Stevens & Williams, and thousands of visitors paid admission to \
see it; a chromolithograph ensured its circulation. It was then exhibited in \
London, where it drew great notice, before returning to the United States. Shown at the \
Exposition Universelle in Paris in 1867, it won a medal there. The Corcoran Gallery of Art in \
Washington bought it in 1876. When that museum closed in 2014, its collection was \
dispersed, and Niagara joined the National Gallery of Art."""
facture = """
Church paints with an almost photographic precision: one can make out the transparency \
of the green water at the edge of the falls, the foam trailing away, the light passing through \
the spray. His brushwork remains invisible, as with his teacher Thomas Cole and the \
landscapists of the Hudson River School, but he breaks with their compositions framed \
by trees and rocks. The panoramic format, borrowed from panoramas and topographical \
views, and the suppression of the foreground are bold choices. The \
colours remain restrained, greens, bluish whites and golden greys, so that the whole effect \
rests on the movement of the water and the light."""
details = [
  "The brink of the falls, in the foreground, where the water turns translucent as it tips over.",
  "The rainbow, on the right, born in the mist.",
  "The cloud of spray merging with the clouds in the sky.",
  "The distant line of the shore, very low, which heightens the sense of immensity.",
]
themes = ["water", "sublime", "landscape", "nation", "rainbow"]
anecdote = """
Ten years later, Church returned to the subject with a vertical painting, Niagara Falls, \
from the American Side (1867), in which the cataract this time falls from the top to the bottom of \
the canvas. It is held at the Scottish National Gallery in Edinburgh."""
salle = 2
mur = "ouest"
position = 5.6
largeur = 2.2

[[oeuvres]]
titre = "Arrangement in Grey and Black No. 1 (Portrait of the Artist's Mother)"
artiste = "James McNeill Whistler"
annee = "1871"
image = "mere-whistler.jpg"
technique = "Oil on canvas, 144.3 × 162.4 cm"
collection = "Musée d'Orsay, Paris"
note = "The painter wanted a harmony of grey and black; the world saw in it the portrait of all mothers."
description = """
An elderly lady dressed in black sits in profile, turned to the left, her hands \
resting in her lap, holding a white handkerchief. She wears a white lace cap \
and matching lace cuffs. Her feet rest on a small footstool. \
The setting is reduced to almost nothing: a grey wall, a black baseboard, a dark curtain \
on the left, scattered with light motifs, and, hanging on the wall, a frame with a wide white \
mount containing a print by the artist of the Thames. The woman does not look at \
the viewer; she gazes at a point before her, motionless. The horizontal \
and vertical lines of the wall, the frame and the curtain build a network of rectangles \
into which the silhouette, with its very straight back, fits as a dark shape."""
evocation = """
Whistler wanted the painting to be looked at as a composition of forms and \
tones, in the manner of a piece of music, hence his title “arrangement.” He \
defended art for art's sake and mocked those who sought sentiment in it. The \
public nevertheless saw something quite different: the austere dignity of an aged mother, her \
patience, a kind of almost religious recollection. Anna McNeill Whistler, a \
pious and rigorous woman, had joined her son in London during the Civil War. \
Over time, the work became an icon of motherhood, and even a symbol of \
America during the crisis of the 1930s. This gap between the painter's intention \
and the public's reading is part of its history and its fame."""
histoire = """
The painting was made in 1871 in Whistler's house in Chelsea, on the banks of the \
Thames. According to the account handed down, the pose, first planned standing, proved \
too tiring for Anna Whistler, then over sixty, and was replaced by \
a seated pose. In 1872, the work was shown at the Royal Academy in London, where it \
was nearly rejected. Whistler, often short of money, later pawned it. In \
1891, thanks in part to the support of Stéphane Mallarmé and Georges Clemenceau, the French \
State bought it for the Musée du Luxembourg, devoted to living artists: for \
Whistler, this was a consecration. The painting then passed to the Louvre and, in 1986, to the \
Musée d'Orsay. It has travelled widely, notably to the United States in 1932–1934."""
facture = """
The palette is deliberately reduced to greys, blacks and whites, with a few barely perceptible \
warm tones. Whistler applies very thinned paint, in thin, almost transparent \
layers, which he wipes away and reworks until he achieves the desired harmony. \
The composition, made of flat planes and interlocking rectangles, owes much to the \
Japanese prints the artist collected, like the patterned curtain, and to \
Velázquez, whom he admired for his blacks and greys. The strict profile, cut out against the \
wall, also recalls the tradition of medals and silhouettes."""
details = [
  "The white handkerchief the old lady holds in her hands.",
  "The small footstool beneath her feet, lifting her from the floor.",
  "The dark patterned curtain, on the left, inspired by Japanese fabrics.",
  "The framed picture on the wall: an etching by Whistler of the Thames.",
  "The lace of the cap and cuffs, the only touches of bright white.",
]
themes = ["mother", "portrait", "harmony", "grey", "Japonisme"]
anecdote = """
In 1934, the United States Post Office issued a Mother's Day stamp reproducing the \
painting, with the inscription “In memory and in honor of the mothers of America.” The \
portrait of Mrs. Whistler then became a national image."""
salle = 3
mur = "ouest"
position = 0
largeur = 1.6

[[oeuvres]]
titre = "The Gross Clinic (Dr. Gross's Clinic)"
artiste = "Thomas Eakins"
annee = "1875"
image = "gross-clinic.jpg"
technique = "Oil on canvas, 243.8 × 198.1 cm"
collection = "Philadelphia Museum of Art and Pennsylvania Academy of the Fine Arts"
note = "An operation in the Philadelphia amphitheatre: the surgeon turns, scalpel in his bloodied hand."
description = """
In the amphitheatre of the Jefferson Medical College in Philadelphia, Dr. Samuel D. \
Gross, his grey hair dishevelled, has paused in mid-operation to address \
the students. He holds a scalpel in his right hand, his fingers reddened with blood. \
Before him, on the table, the patient, a young man of whom one sees little but the \
opened thigh and the feet, is surrounded by the team: assistants hold the \
incision open, another holds a cloth soaked in chloroform over his face. On the \
left, a woman in black, probably a relative of the patient, shields her eyes with a \
convulsive gesture. In the tiers sunk in half-darkness, students look on; \
an assistant takes notes. Light falls from a skylight and illuminates the surgeon's \
forehead."""
evocation = """
Eakins makes the surgeon a modern hero, a man of science with sure knowledge, in the \
line of Rembrandt's The Anatomy Lesson of Dr. Nicolaes Tulp. The contrast between the master's calm \
and the woman's horror sets reason against emotion, science against fear. \
The operation performed, which made it possible to treat a bone infection without amputating the \
leg, illustrates the progress of American surgery, of which Philadelphia was a \
great centre. The raw realism of the blood and flesh was received as a provocation; \
today it is seen as the assertion of truth as painting's supreme value, \
and as Eakins's ambition to show the modern life of his city, its scientists and its \
institutions, without embellishing anything."""
histoire = """
Eakins, who had taken anatomy courses at the Jefferson Medical College, painted this \
large picture in 1875 in the hope of showing it at the Centennial Exhibition, \
held in Philadelphia in 1876. The fine arts jury rejected it, \
probably shocked by its crudeness; the canvas was finally hung in the army's \
medical pavilion, among hospital equipment. Critics were divided: \
some hailed the power of the portrait, others were horrified. In 1878, \
the Jefferson Medical College alumni association bought it for a modest sum \
and gave it to the school, where it remained for more than a century. When the university decided \
to sell it, in 2006, a public mobilisation enabled the Philadelphia Museum of Art \
and the Pennsylvania Academy of the Fine Arts to acquire it jointly."""
facture = """
Eakins builds the scene in chiaroscuro, in the manner of Rembrandt and the Spanish painters, \
Velázquez and Ribera, whom he had studied at the Prado. The background is almost black, \
and the light, concentrated on Gross's forehead, his hand and the wound, draws a \
pyramid of light. His training under Jean-Léon Gérôme in Paris shows in the \
precision of the drawing and the solidity of the volumes. A fine connoisseur of anatomy and \
perspective, he prepared his compositions through rigorous studies. The red of the \
blood, the only vivid colour in a range of browns and blacks, immediately draws the eye \
to the surgeon's hand."""
details = [
  "Gross's scalpel and bloodied fingers, at the centre of the light.",
  "The woman in black, on the left, hiding her face with a clenched hand.",
  "At the far right, among the spectators, Eakins has portrayed himself drawing.",
  "No gloves or gowns: in 1875, surgeons operated in frock coats.",
  "The chloroform cloth placed over the patient's face.",
]
themes = ["medicine", "science", "realism", "portrait", "Philadelphia"]
anecdote = """
In 2006, Thomas Jefferson University agreed to sell the painting for 68 million \
dollars to the National Gallery of Art in Washington and the Crystal Bridges museum in \
Arkansas. Philadelphia raised the sum within the allotted time to keep the work in \
the city."""
salle = 3
mur = "nord"
position = -4
largeur = 2.0

[[oeuvres]]
titre = "Madame X (Madame Pierre Gautreau)"
artiste = "John Singer Sargent"
annee = "1883–1884"
image = "madame-x.jpg"
technique = "Oil on canvas, 208.6 × 109.9 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The portrait caused a scandal at the Salon: Sargent left Paris. He considered it the best he had ever painted."
description = """
A young woman stands, her body turned toward us and her head in profile. She \
wears a black satin gown with a plunging neckline, held on the shoulders by \
thin straps adorned with jewels. Her skin, of a pearly whiteness, contrasts \
violently with the black of the fabric and the warm brown background. Her right hand rests on \
a small table, the wrist turned back in a tense gesture; the left holds a folded \
fan. In her upswept hair gleams a small crescent-moon diadem. \
No other accessory, no setting distracts the eye: everything rests on the \
silhouette, the contrast of black and white and the line of the profile, as sharp as that \
of a medal."""
evocation = """
Sargent wanted to paint a famous beauty of society Paris, Virginie Amélie Avegno, \
born in New Orleans and wife of the banker Pierre Gautreau, like him an \
American settled in France. The portrait celebrates a cold, sculptural elegance, \
almost abstract. The crescent moon evokes Diana, the huntress of mythology, \
a haughty and unattainable goddess. But the Paris of 1884 saw in it an image of arrogance and \
flaunted allure, that of a woman who makes a spectacle of her beauty. The painting \
speaks of the ambition of a twenty-eight-year-old painter who wanted to make a splash \
at the Salon, and of the narrow line separating daring from scandal in the polite \
society of the Third Republic."""
histoire = """
Sargent himself approached his model, who agreed to pose; the sittings took place in \
Paris and, in the summer of 1883, on the Gautreau estate at Paramé, in Brittany. Shown \
at the Salon of 1884 under the title “Portrait of Mme ***,” the painting unleashed mockery \
and indignation. Critics objected to the pallor of the skin, the pose, and above all the right \
strap, then painted slipping down the arm, judged indecent. The sitter's mother asked \
Sargent to withdraw the work, which he refused to do. He then repainted the strap \
on the shoulder and kept the canvas in his studio. As Parisian commissions dried up, he \
settled in London in 1886. In 1916, he sold the painting to the Metropolitan Museum of Art \
under a title that withholds the sitter's name: Madame X."""
facture = """
A pupil of Carolus-Duran, Sargent commands a quick, fluid painting style inherited from \
Velázquez and Frans Hals. Here he holds back his virtuosity: the brushwork remains supple in \
the gown and the background, but the flesh is treated in smooth surfaces, of a white tinged with \
grey and lilac, which evokes the powder with which the young woman covered herself. The \
tall, narrow framing and the silhouette cut out against a plain background recall the full-length portraits by \
Velázquez and Manet. The contour is of an almost graphic sharpness."""
details = [
  "The diamond crescent moon in her hair, attribute of Diana.",
  "The right strap, repainted on the shoulder after the Salon scandal.",
  "The right hand clenched on the edge of the small table.",
  "The slightly rosy ear, the only touch of colour in a very pale face.",
  "The folded fan, almost invisible against the black satin.",
]
themes = ["portrait", "elegance", "scandal", "Paris", "fashion"]
anecdote = """
Sargent also painted a second version of the portrait, left unfinished, which he kept \
in his studio. It was bought in 1925, the year of his death, by the Tate in London, \
where it remains today."""
salle = 3
mur = "nord"
position = 3.5
largeur = 1.1

[[oeuvres]]
titre = "The Child's Bath (The Bath)"
artiste = "Mary Cassatt"
annee = "1893"
image = "bain-enfant.jpg"
technique = "Oil on canvas, 100.3 × 66.1 cm"
collection = "Art Institute of Chicago"
note = "Seen from above, like a Japanese print: the tenderness of an everyday gesture."
description = """
A seated woman holds on her lap a small child half wrapped in a white towel \
and washes its feet in a basin set on the floor. Both heads \
bowed, they gaze at the water; the woman's hand encircles the child's foot, while the child \
leans one hand on her knee. The woman wears a loose gown with broad \
light, colourful stripes. Around them, the intimacy of a bedroom: a rug with \
floral patterns, a pitcher on the floor, at right, and, at the top of the painting, a painted \
piece of furniture. The very high viewpoint plunges onto the scene, so that the floor seems to \
rise like a wall and the two figures fill almost the whole height of the \
canvas."""
evocation = """
Mary Cassatt devoted a large part of her work to women and children, not \
as sentimental allegories, but as observed scenes of daily \
life. Here, tenderness is conveyed through a simple, concentrated gesture, shared in \
silence. The gazes converge on the same point, the water in the basin, and create \
an intimacy from which the viewer is almost excluded. It has been seen as a modern vision of \
motherhood, made of attention and care rather than religious idealisation, \
the opposite of the Madonnas and Child of tradition. Some historians also stress \
the topicality of the bath theme, at a time when hygiene and the upbringing of young \
children were becoming new concerns for bourgeois families."""
histoire = """
Cassatt painted The Child's Bath in 1893, the year she produced the great \
mural “Modern Woman” for the Woman's Building at the Chicago World's \
Fair, and when the Durand-Ruel gallery devoted an important solo exhibition to her in Paris. \
Settled in France since 1874, close to Degas, who had invited her to \
exhibit with the Impressionists, she was then at the peak of her career. The year \
1890 had been decisive: the great exhibition of Japanese prints at the École des \
Beaux-Arts had pushed her to renew her manner, first in colour printmaking, \
then in painting. The painting was acquired by the Art Institute of Chicago \
in 1910, during the artist's lifetime, and has since ranked among the museum's most popular \
works."""
facture = """
The composition owes much to Japanese prints by Utamaro and his contemporaries: \
plunging view, tilted floor, juxtaposed decorative patterns, absence of horizon, \
figures tightly packed within the frame. The stripes of the gown, the flowered rug and the painted \
furniture answer one another as flat surfaces of colour, while the child's flesh \
is modelled with softness. The brushwork, free and visible in the fabrics, remains \
Impressionist, but the drawing, firm and precise, shows the influence of Degas. The \
light, fresh colours convey the soft light of a bedroom."""
details = [
  "The two heads bowed toward the water, looking at the same point.",
  "The child's foot held in the woman's hand, above the basin.",
  "The pitcher set on the rug, at right.",
  "The stripes of the gown, contrasting with the child's bare skin.",
  "The patterned rug, seen from above, rising to the middle of the painting.",
]
themes = ["motherhood", "childhood", "intimacy", "Japonisme", "daily life"]
anecdote = """
Mary Cassatt never married and had no children. For her scenes of motherhood, \
she used posed models, often women and children from her circle or \
neighbourhood, who were not necessarily mother and child in real life."""
