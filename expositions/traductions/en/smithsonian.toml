[[sculptures]]
titre = "The Fugitive's Story"
artiste = "John Rogers"
annee = "1869"
modele = "fugitives-story.stl"
technique = "Painted plaster"
collection = "Smithsonian American Art Museum, Washington"
note = "A woman on the run tells her story to three abolitionists, among them the poet Whittier."
description = """
A young Black woman, simply dressed, holds her baby close and tells \
of her escape to three men gathered around her. They are not anonymous figures: \
Rogers portrayed three great figures of abolitionism, the poet John Greenleaf \
Whittier, the pastor Henry Ward Beecher and the journalist William Lloyd Garrison. Their \
faces are recognisable portraits, with features marked by age. The men, \
in frock coats, listen gravely; their attitudes, leaning or attentive, \
all converge on the woman and her child. The group makes up a small theatrical \
scene, with its gestures and glances, frozen in plaster like a tableau \
vivant, and reveals itself gradually as one walks around it."""
evocation = """
Made in 1869, four years after the abolition of slavery by the Thirteenth Amendment, \
the group pays retrospective homage to the activists who had fought slavery \
for decades. The fugitive, a mother protecting her child, embodies the humanity denied \
by slavery and the force of testimony, which was one of the abolitionists' principal \
weapons: accounts by escaped slaves, lectures, newspapers. The three men \
represent the moral conscience of the North through poetry, religion and the press. It is \
noted today that the woman's voice is at the centre of the scene, but that the \
heroes whose names are remembered are the three white men: the group reflects the \
limits of its time as much as its ideals."""
histoire = """
John Rogers, who shared abolitionist convictions, devoted this group in 1869 \
to men whom the Northern public knew and admired. The year before, he \
had already portrayed real figures in The Council of War, in which Lincoln \
confers with General Grant and Secretary of War Stanton. Like his other \
works, The Fugitive's Story was designed to be reproduced in plaster and sold by \
catalogue, in a format suited to the bourgeois parlour. The subject, more meditative than his \
war scenes, addresses a public sensitive to the memory of the antislavery \
struggle, in the aftermath of a conflict that had cost hundreds of thousands \
of lives. The Smithsonian American Art Museum holds a copy, digitised in 3D \
and made freely available."""
facture = """
Here, the main challenge is likeness: Rogers must make famous faces recognisable, \
widely circulated at the time through photography and engraving. He \
modelled them carefully in clay, before following his usual process: bronze model, \
flexible moulds, plaster casts painted in a uniform tint. The arrangement \
of the four figures in a circle obliges the viewer to walk around the group, each \
side offering a different face or gesture. The details of the clothing and hands \
are precise despite the small size of the whole."""
details = [
  "The baby the fugitive holds close.",
  "The faces of the three abolitionists, true portraits.",
  "The frock coats and hands, modelled with precision despite the small size.",
  "The uniform tint unifying the whole, typical of Rogers's groups.",
]
themes = ["abolitionism", "slavery", "testimony", "motherhood", "genre sculpture"]
anecdote = """
William Lloyd Garrison, one of the three listeners, had published his newspaper The \
Liberator weekly from 1831 to the end of 1865: he ceased publication once \
slavery had been abolished by the Thirteenth Amendment, considering his mission accomplished."""
