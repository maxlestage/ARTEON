[[sculptures]]
titre = "Buddha Robed with the Realms of Existence"
artiste = "Chine, dynastie des Qi du Nord"
annee = "550–577"
modele = "buddha.stl"
technique = "Limestone"
collection = "Freer Gallery of Art, Washington"
note = "The “Cosmic Buddha”: on his robe, in light relief, the six realms of existence, from the heavens to the hells."
description = """
This large standing stone Buddha has lost his head and hands, but his body retains \
an imposing presence. He wears the monastic robe, which falls straight to the \
ankles and clings to the almost cylindrical body without forming marked folds. The whole \
surface of the robe is covered with scenes sculpted in very low relief and \
incised lines. Toward the top, palaces and celestial beings evoke the realms of the \
gods; lower down unfold scenes of the human world, with figures, \
buildings and trees; at the very bottom, near the hem, the hells appear, \
where tormented damned souls can be made out. One must come very close, and walk around \
the statue, to begin to read these images."""
evocation = """
In Buddhist thought, beings are endlessly reborn in six realms: those of the \
gods, demigods, humans, animals, hungry ghosts and the damned of the \
hells, according to the weight of their deeds. By carrying these realms on his robe, the Buddha \
appears to encompass the entire universe: his presence extends to all beings, \
even the most unfortunate, and offers each the possibility of deliverance. Many \
specialists identify him with the cosmic Buddha Vairocana, described in the Flower \
Garland Sutra as containing all worlds within himself; others see in him the \
historical Buddha, Shakyamuni. For the faithful of the 6th century, this image was a \
support for meditation on each being's place in the cycle of rebirths."""
histoire = """
The statue was sculpted in northern China under the Northern Qi dynasty (550–577), \
a period of great Buddhist fervour when the court and aristocracy funded temples \
and cave sanctuaries. The exact temple from which it comes is unknown. Like many \
Chinese Buddhist sculptures, it left China in the early 20th century, in \
a context of unrest and looting of religious sites that fed the Western art \
market. It entered the Freer Gallery of Art in 1923, the year the museum \
opened, founded thanks to the bequest of the collector Charles Lang Freer. In the early \
2010s, the Smithsonian digitised it in 3D, which made it possible to decipher better the \
scenes on the robe, difficult to read on the worn stone."""
facture = """
The statue is carved from a fine-grained limestone, which lends itself to meticulous \
work. The almost cylindrical body and the robe clinging to the skin are \
characteristic of the Northern Qi style, marked by the Indian art of the Gupta period: \
the cascading drapery of the previous period gives way to a smooth garment, become \
almost a support. On this surface, the sculptor incised and modelled in very low \
relief the scenes of the realms of existence, as he would have done on a painting. \
Originally, the statue was probably painted, which made these scenes far more \
legible."""
details = [
  "At the top of the robe, the palaces and celestial beings representing the heavens.",
  "Near the hem, the scenes of the hells and their damned.",
  "The smooth surface of the robe, which clings to the body without marked folds.",
  "The breaks at the neck and arms: the head and hands are lost.",
]
themes = ["Buddhism", "cosmos", "rebirth", "China", "spirituality"]
anecdote = """
This Buddha was one of the first objects the Smithsonian put online in 3D, in 2013: \
anyone can now rotate the statue on their screen and observe the scenes on \
the robe under lighting impossible to achieve in the gallery."""
