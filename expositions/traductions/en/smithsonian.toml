accroche = "Virtual Exhibition · Smithsonian Museums"
introduction = """
A museum inspired by those of the Smithsonian in Washington: a great covered court \
where Greenough's George Washington presides, landscapes of the Hudson and the \
Sierra Nevada, portraits by Whistler, Sargent and Eakins, sculptures by \
John Rogers, and an Asian cabinet in the spirit of the Freer Gallery. The sculptures are \
3D scans from the Smithsonian, freely available to the public."""
vitrine = "mere-whistler.jpg"

[musee]
nom = "Smithsonian American Art Museum"
ville = "Washington, United States"
construction = "1836–1867"
presentation = """
The Smithsonian American Art Museum occupies, together with the National Portrait Gallery, the former \
Patent Office in Washington, where patents for inventions were once filed. Begun in \
1836 and completed in 1867, this vast neoclassical quadrangle with porticoes, its \
architecture inspired by Greek temples, is one of the oldest public buildings in \
the capital. During the Civil War it served as a hospital, and Walt Whitman came to \
tend the wounded there; in 1865 it hosted the ball for Lincoln's second inauguration. \
Threatened with demolition in the 1950s, it was saved and entrusted to the Smithsonian, which \
opened its two museums there in 1968. Since 2007, its inner court, the Kogod Courtyard, has been \
covered by an undulating glass canopy designed by Foster and Partners. The museum traces \
American art from the colonial era, from the landscapes of the Hudson River School to \
contemporary works."""
ici = """
ARTEON keeps its plan around a court. The covered court, a square 20 metres on \
each side and 12 metres high, beneath a glass roof, welcomes visitors from the south, at the foot of \
Greenough's George Washington. Three rooms surround it: to the west, American \
Landscapes, with pale green walls; to the north, Portraits, with pink walls, both \
6 metres high; to the east, Genre Sculptures, lower, with pearl-grey walls. \
A door on the north side of the latter opens onto the smallest room, the Asian \
Cabinet, with sand-coloured walls, where the visit ends."""

