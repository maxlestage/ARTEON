[[sculptures]]
titre = "The Wounded Scout, a Friend in the Swamp"
artiste = "John Rogers"
annee = "1864"
modele = "wounded-scout.stl"
technique = "Painted plaster"
collection = "Smithsonian American Art Museum, Washington"
note = "During the Civil War, a fugitive slave supports a wounded Union soldier: a group sold in the thousands."
description = """
In a swamp, a barefoot Black man, dressed in a worn shirt and trousers, \
supports a Union army soldier, wounded and at the end of his strength. The soldier, in \
uniform, puts an arm around his rescuer's shoulders and slumps against him. \
The Black man holds him firmly, his body taut with effort and vigilance. At their \
feet, among the reeds and grasses of the marsh, a snake slithers, a reminder of the \
dangers of the place. The group, about sixty centimetres high, is designed to be \
seen from all sides, set on a table or a parlour mantelpiece. The full title, \
“The Wounded Scout, a Friend in the Swamp,” underscores the bond of trust uniting \
the two figures."""
evocation = """
The group celebrates the help that fugitive slaves and Black Southerners \
gave to Union soldiers, by guiding them, hiding them or nursing them. \
In 1864, as the war raged and Black regiments fought in \
the federal army, the work asserts a fraternity between whites and Blacks in the struggle \
against slavery. Its ambiguities have nonetheless been noted: the Black man is a \
devoted rescuer, but in the service of the white soldier, in a role that remains that of \
the auxiliary. For the Northern families who bought it, this group was a sign of \
patriotic and abolitionist commitment, and a reminder of the sacrifices of the war, \
installed in the heart of the home."""
histoire = """
John Rogers conceived The Wounded Scout in 1864, in the midst of the Civil War, when \
his plaster groups had already won over the Northern public. He had begun with \
subjects related to slavery, such as The Slave Auction in 1859, then multiplied scenes \
of the lives of soldiers and civilians during the conflict, which answered the current events \
his buyers were living through. The Wounded Scout ranks among his greatest successes. Like \
his other groups, it was sold by catalogue and in the artist's showroom \
in New York, at a price accessible to middle-class families. The \
Smithsonian American Art Museum holds many Rogers groups; this one is \
among the works digitised in 3D and made freely available."""
facture = """
Rogers first modelled his figures in clay, then had a bronze model cast, from \
which flexible moulds were made. These moulds made it possible to cast plaster \
copies in series, assembled and then covered with a uniform putty-coloured paint, \
which evokes stone or bronze and hides imperfections. The precision of the \
detail, in the folds of the clothing, the hands or the reeds, is remarkable for \
mass production. The compact, almost pyramidal composition ensures the solidity of \
the object and its legibility from every side."""
details = [
  "The soldier's arm around his rescuer's shoulders.",
  "The Black man's bare feet, planted on the swamp floor.",
  "The snake slipping between the reeds, at their feet.",
  "The care given to the folds of the clothing and the soldier's uniform.",
]
themes = ["Civil War", "slavery", "fraternity", "rescue", "genre sculpture"]
anecdote = """
To protect himself against pirated copies, Rogers had his creations patented: most of \
his groups bear, inscribed in the plaster, his name and the patent notice with its \
date. He thus built one of the first mass-produced popular art businesses in the \
United States."""
