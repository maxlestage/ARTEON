[[oeuvres]]
titre = "Very Slippy Weather"
artiste = "James Gillray"
annee = "1808"
image = "very-slippy-weather.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.96111.html"
technique = "Hand-coloured etching and engraving on wove paper, after an idea by the Reverend John Sneyd; plate 26.1 × 20.5 cm"
collection = "National Gallery of Art, Washington"
note = "An old gentleman slips on the ice in front of the shop where Gillray sells his caricatures, displayed in the window before the eyes of all London."
description = """
A cobbled London street in winter. In the foreground, a bald old man, in a green \
coat, striped waistcoat and yellow breeches, falls backward on the slippery pavement: one \
booted leg flies up, his hat goes flying behind him with his wig, his cane escapes him, \
gold coins roll across the cobbles. He still holds a \
thermometer in his hand. A small dog barks on the left, a boy in a purple jacket laughs on the right. \
Behind him, passers-by have their backs turned: a dandy with a monocle, an officer in a \
red coat topped with an immense plumed bicorne, a man in a tricorne, another in a \
brown coat. Captivated, they gaze at the window of a shop covered with coloured \
prints, in three rows, whose titles can be read. Above shines the gilded sign \
HUMPHREY; on the right, behind the door of number 27, a customer in a hat watches the \
street."""
evocation = """
Gillray stages his own shop: the window of Hannah Humphrey, his publisher, \
where his new prints drew idlers every day. The passers-by crowd around it as before a screen, so \
absorbed that they do not see the old man falling behind them. The gag is twofold: the fall, the eternal \
mainspring of farce, and the thermometer the victim brandishes, as if to check that it is really freezing. But the image \
speaks above all of the place caricature had taken in the London of 1800: a \
popular image, sold in sheets, looked at in the street by all classes, from \
officer to urchin. This is already the mass culture that pop art would celebrate, a \
century and a half later."""
histoire = """
At the end of the eighteenth century, London was the capital of caricature, and James Gillray \
was its master. His prints, which ridiculed King George III, ministers and \
Napoleon, were published and sold by Hannah Humphrey, with whom he lodged. In 1797 the \
shop moved to 27 St James's Street, in the heart of the district of elegant clubs. \
Very Slippy Weather was published on 10 February 1808, as the line engraved \
beneath the image indicates. The idea came from the Reverend John Sneyd, a friend of Gillray, an amateur who \
supplied him with subjects. In the window one recognizes several of his hit plates, \
including Taking Physick and Tiddy-Doll, in which Napoleon appears as a baker \
putting gingerbread kings into the oven. Three years later, mental illness would put an end \
to his career."""
facture = """
Gillray engraves on copper by etching, drawing freely with the point in the \
ground, then reinforces certain lines with the burin. The line is lively, nervous, full \
of accidents: grimacing faces, folds of clothing, round cobbles of the roadway. The \
colouring is done afterward by hand, sheet by sheet, in watercolour, by \
colourists in the publisher's employ: green of the coat, red of the uniform, yellow of \
the breeches and the frame. The composition is built like a theatre scene, \
with the fall in the foreground, the audience in the middle ground and the shop window as backdrop. \
The little prints in the window, drawn in miniature with their titles, form \
an image within the image."""
details = [
  "The thermometer the old man brandishes as he falls.",
  "The hat flying off with the wig, and the gold coins rolling across the cobbles.",
  "The caricatures in the window, whose titles can be read, such as Taking Physick.",
  "The officer in the large plumed bicorne, who does not even turn around.",
  "The little dog barking and the boy laughing, on either side of the old man.",
]
themes = ["caricature", "street", "london", "humour", "print"]
anecdote = """
Hannah Humphrey's name shines in gold letters above the shop window: Gillray, \
who worked almost exclusively for her from the 1790s on, died in 1815 \
in that same house in St James's Street."""
salle = 4
mur = "est"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "Little Nemo in Slumberland: Climbing the Great North Pole"
artiste = "Winsor McCay"
annee = "1907"
image = "little-nemo-north-pole.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.142154.html"
technique = "Pen, brush and black ink over pencil lines, on two-part board, 70.5 × 54.6 cm (drawing)"
collection = "National Gallery of Art, Washington"
note = "The original drawing of a Sunday page: Nemo and his companions climb the North Pole, from which all the snows blow, before waking up in bed."
description = """
The large sheet, drawn in black ink on yellowed board, contains thirteen panels. \
At the top, the title LITTLE NEMO IN SLUMBERLAND stretches out in large white letters from which \
icicles hang. In an ice palace with vaults dripping with stalactites, \
an old man with a long nose and a pointed cap shows two bundled-up children, Nemo \
and a little girl, an immense pillar: the great North Pole, “a thousand feet high,” \
from which all the snows and all the winds come. The children climb the staircase \
that winds around it. In the third row, two giant pipes, one bell-shaped, \
spew out water and the wind that turns it to snow; the storm rises and fills the \
panels with white flakes on a black ground. In the last row, the children are lost in the \
snow, then Nemo wakes up in his bed, scolded for having kicked off his covers."""
evocation = """
Every Sunday, from 1905 to 1911, in the New York Herald, Nemo, a little boy whose \
Latin name means “nobody,” sets off in dreams for the kingdom of Slumberland, and \
each page ends with his waking. Here, the dream turns to cold and fear: \
the slippery staircase, the frozen watch, the snow engulfing the children convey the \
sensation of the sleeper who has pushed off his sheets. The final explanation, prosaic and \
funny, brings us back to the real world. McCay turns the newspaper page, a cheap image thrown away \
on Monday, into a fairy-tale spectacle. Lichtenstein and Warhol would in turn draw on \
this culture of Sunday comics, whose heroes, speech balloons and printing \
colours they would copy."""
histoire = """
Little Nemo in Slumberland first appeared on 15 October 1905 in the colour Sunday \
supplement of the New York Herald. This plate, marked with a \
1907 copyright in the newspaper's name, bears in the margin the pencil notation “Mar 3,” \
probably its publication date, Sunday 3 March 1907. McCay handed the newspaper \
his drawings in black and white, at large scale; the Herald's engravers and printers \
then prepared the colours, following the instructions written in the \
margins. The drawing, made of two boards joined together, has kept these workshop annotations, \
valuable for understanding how illustrated newspapers were made. It is now \
in the National Gallery of Art in Washington."""
facture = """
McCay first draws in pencil, then inks fine, even outlines with the pen \
and fills the large black masses with the brush. The page was conceived for \
colour, absent here: the notes written at the top and bottom of the sheet specify that \
the pole and the characters are to be printed with the black plate alone, and “the \
rest in the blue plate.” The pure black and white reveals all the better the draughtsman's \
virtuosity: ice architecture in perspective, countless stalactites, \
snowflakes rendered by hundreds of small white circles on a black ground. The size of the \
panels varies, and the last ones, overrun by snow, become almost abstract \
before the return to bed."""
details = [
  "The title of the page, each letter of which bears icicles.",
  "The spiral staircase winding around the pole, panel after panel.",
  "The two giant pipes that make the snow, in the third row.",
  "The snowflakes drawn one by one, in small white circles, on a black ground.",
  "The instructions to the printer, handwritten at the top and bottom of the sheet.",
]
themes = ["comics", "dream", "snow", "childhood", "newspaper"]
anecdote = """
From 1906, McCay also performed on the music-hall stage, where he drew at \
top speed before the audience; it was there that he would later present his first \
animated films."""
salle = 4
mur = "est"
place = 3
largeur = 2.4

[[oeuvres]]
titre = "Fantômas"
artiste = "Juan Gris"
annee = "1915"
image = "fantomas.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.56101.html"
technique = "Oil on canvas, 59.8 × 73.3 cm"
collection = "National Gallery of Art, Washington"
note = "A popular novel, a newspaper, a pipe and a fruit bowl on a table: the Cubist still life opens to the culture of the newsstand."
description = """
On a wooden table with painted grain, seen at once from the front and from above, \
objects overlap in cut-out planes, like papers pasted one on \
another. On the left, the green cover of a novel bears the title FANTÔMAS in \
black letters and a black mask; below, columns of text and, beside them, the number 65 \
circled in white. At the centre and on the right, a folded daily newspaper shows LE JOURNAL, twice. \
A black pipe stands out against a green ground. A stemmed glass and a fruit bowl are \
no more than white outlines, drawn as if in chalk, which cut across the planes. \
At the top, a moulded wooden baseboard and a mauve wall; on the right, a red curtain; at \
lower right, a fabric with grey and black diamonds. Touches of yellow, blue and \
green burst across the whole."""
evocation = """
Fantômas, “the genius of crime,” is the black hero of a series of popular novels by \
Pierre Souvestre and Marcel Allain, published from 1911 and brought to the screen by \
Louis Feuillade in 1913 and 1914. Cheap, sold under garish covers, these \
novels delighted avant-garde poets: Guillaume Apollinaire and Max Jacob, friends \
of Gris, founded a “Society of the Friends of Fantômas.” By placing the pulp novel \
and the daily paper beside the pipe and the fruit bowl, Gris makes the culture of the newsstand \
a subject for painting, on a par with the noble objects of the still life. The mask, \
a figure of disguise, also expresses the painting's game, in which everything is imitation and \
pretence."""
histoire = """
Juan Gris painted Fantômas in Paris in 1915, in the midst of the war. A Spaniard, he was not \
mobilized, but his friends were at the front and his dealer, Daniel-Henry Kahnweiler, \
a German citizen, had had to leave France; his property had been sequestered. Gris \
was then living in great hardship. Since 1912, following Picasso and Braque, he had \
practised papier collé, made of newspapers, wallpapers and labels. In \
1915 he returned to oil painting, but imitating with the brush the effects of \
collage: false wood grain, newspaper clippings, printed patterns. The painting, signed at lower \
left, belongs to this series of still lifes. It is now in the \
National Gallery of Art in Washington."""
facture = """
Gris builds the painting like a collage, but everything is painted. The large planes with \
sharp edges overlap, shaded with a slight dark halo that sets them off like \
sheets of paper laid one on top of another. The wood of the table, rendered in fine, regular \
streaks, imitates the “faux bois” papers that the Cubists pasted into \
their compositions. The letters of the newspaper and the novel are painted like printed \
fragments, cut off by the edge of the planes. The objects themselves are no more \
than white outlines, laid over the flat areas of colour. The result is \
both trompe-l'œil and abstraction, and joins, by another path, the \
painters of the neighbouring gallery."""
details = [
  "The green cover of the novel, with its title FANTÔMAS and its black mask.",
  "The letters LE JOURNAL, cut and repeated, like fragments of newsprint.",
  "The black pipe on its green ground, at the right of the painting.",
  "The white outlines of a glass and a fruit bowl, cutting across the planes.",
  "The false wood grain, imitating a pasted paper.",
]
themes = ["cubism", "popular novel", "newspaper", "still life", "mask"]
anecdote = """
Before devoting himself to painting, Gris earned his living in Paris by drawing for \
satirical newspapers such as L'Assiette au beurre: the popular image was his first \
trade."""
salle = 5
mur = "nord"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "Little Dance (Mz. 65. Kleiner Tanz)"
artiste = "Kurt Schwitters"
annee = "1920"
image = "little-dance.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1963.1"
technique = "Collage of printed papers, torn and cut, mounted on a sheet of board"
collection = "Cleveland Museum of Art, Cleveland"
note = "Tickets, candy wrapper and poster lettering: with the refuse of the city, Schwitters composes a little dance of colours."
description = """
At the centre of a grey mounting sheet, a small rectangle is covered with torn and \
cut papers, pasted in every direction. The dominant tones are beige, brown \
and grey: kraft paper, cardboard, crumpled wrapping papers. Fragments \
of posters or newspapers show large red and black letters, cut off, \
illegible. At the centre, small tickets are piled up: one, bordered with black and \
orange stripes, bears the number 21.00, another the number 3145, a third a red \
band. At lower right, a paper printed in blue can be partly read: one recognizes \
the wrapper of “Siesta” caramels from the house of Wildhagen, which touts sweets made with \
natural fruit juices. Beneath the collage, in pencil, the artist wrote Mz. 65. Kleiner \
Tanz and signed Kurt Schwitters 1920."""
evocation = """
The title, Little Dance, invites us to look at the collage as a movement. The oblique \
fragments seem to turn around the centre, and the red, in a few patches, leaps \
from one edge to the other among the whites, greys and ochres, like a dancer in \
the midst of a crowd. The materials, for their part, come from the everyday life of postwar \
Germany: tickets, candy wrappers, scraps of posters. Schwitters does not \
seek to denounce, like the Berlin Dadaists; he gathers these remnants and \
gives them a new beauty. Advertising refuse turned into the matter of art anticipates \
the collages of Richard Hamilton and Eduardo Paolozzi, who would inaugurate British pop art \
in the 1950s."""
histoire = """
In 1919, in Hanover, Schwitters invented the word Merz, taken from a fragment of the \
inscription Commerz- und Privatbank cut from an advertisement, to designate an art \
made of all materials. He applied it to paintings, poems, performances and, \
for his small collages on paper, to Merzzeichnungen, “Merz drawings”: this is \
what the abbreviation Mz. inscribed beneath the work means, followed by its number, 65. In \
1920 he made a great many of them, with what he picked up in the street, on trams \
and in wastepaper baskets. In 1923 he founded his journal Merz and became \
one of the great figures of Dada in Germany. The collage is now in the \
Cleveland Museum of Art."""
facture = """
Schwitters tears and cuts his papers, overlaps them, glues them, then partly covers \
them to find a balance of forms and colours. The torn, irregular edges \
alternate with the clean cuts of the scissors. The printed letters are \
chosen for their shape more than their meaning: a 0, a fragment of a word, \
numerals. The small format requires a tight composition, in which every piece counts. \
The oblique planes, inherited from Cubism and Futurism, give the rectangle its momentum. \
The paper has yellowed and browned with time, which today accentuates the warm range \
of ochres and browns, from which the red stands out all the more vividly."""
details = [
  "The ticket bordered with black and orange stripes, marked 21.00, at the centre.",
  "The “Siesta” caramel wrapper, printed in blue, at lower right.",
  "The large red letters, cut off, at the top and along the left edge.",
  "The torn edges of the kraft paper, next to the clean cuts of the scissors.",
  "The pencil inscription Mz. 65. Kleiner Tanz, beneath the collage.",
]
themes = ["collage", "merz", "dada", "advertising", "refuse"]
anecdote = """
Schwitters was also a poet: his Ursonate, a “primitive sonata” made of syllables \
without meaning, lasts nearly forty minutes when recited in full."""
salle = 5
mur = "nord"
place = 3
largeur = 2.0

[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi, 24 November 1864 – Château de Malromé (Gironde), 9 September 1901"
biographie = """
Henri de Toulouse-Lautrec was born into an old aristocratic family of southern France. \
As an adolescent he broke both legs, in 1878 and 1879: they stopped growing, \
probably because of a hereditary bone disease. He then devoted himself to drawing, \
training in Paris with Bonnat and then in Cormon's studio, where he met Émile \
Bernard and Vincent van Gogh. Settled in Montmartre, he painted its cabarets, its dances and \
its stars: Aristide Bruant, La Goulue, Jane Avril, Yvette Guilbert. His poster \
for the Moulin Rouge, in 1891, made him famous; he would design about thirty, and \
hundreds of lithographs. Undermined by alcohol, he was confined in 1899 to a \
clinic in Neuilly. He died at thirty-six at the Château de Malromé, at his mother's home."""
style = """
Lautrec is first of all a draughtsman: a quick, nervous line that captures \
an attitude, a tic, a face in a few strokes. From Degas and Japanese prints he borrows the \
cropped framing and plunging views. His posters, with their bold flat areas of colour \
and integrated lettering, founded the modern poster and made the stars of \
Montmartre images as well known as brands."""

[[artistes]]
nom = "Alfons Mucha"
vie = "Ivančice (Moravia), 24 July 1860 – Prague, 14 July 1939"
biographie = """
Born in Moravia, then part of the Austrian Empire, Alfons Mucha first worked as a \
theatre scene painter in Vienna, then studied in Munich thanks to a patron. \
Settled in Paris in 1887, he attended the Académies Julian and Colarossi and lived \
precariously on his illustrations. At the end of 1894, almost by chance, he designed the poster \
for Gismonda for Sarah Bernhardt: plastered across Paris in early 1895, it caused \
a sensation. The tragedienne entrusted him with her posters for six years, and the printer \
Champenois put him under contract. Posters, decorative panels, jewellery, advertisements: \
his style became the very image of Art Nouveau. Back in Bohemia in 1910, he devoted \
nearly twenty years to the Slav Epic, then designed the first banknotes and stamps of \
Czechoslovakia. Arrested and interrogated by the Gestapo in 1939, he died shortly afterward in \
Prague."""
style = """
Mucha created an immediately recognizable language: an ideal figure, set \
within an arch or a circle, surrounded by ornaments, flowers and drawn letters, \
with a dark, even outline and soft colours. He made the poster an \
art in its own right, and his style, rediscovered in the 1960s, inspired \
the psychedelic poster and comics."""

[[artistes]]
nom = "William Michael Harnett"
vie = "Clonakilty (Ireland), 10 August 1848 – New York, 29 October 1892"
biographie = """
Born in County Cork, Ireland, in the midst of the famine, William Michael Harnett arrived \
as a child in Philadelphia with his family. As an adolescent he learned the trade of silverware engraver, \
while taking evening classes at the Pennsylvania Academy of the Fine Arts and \
then, in New York, at the Cooper Union and the National Academy of Design. \
Around 1875 he began to paint still lifes: tankards, pipes, newspapers, books, \
banknotes. From 1880 to 1886 he stayed in Europe, mostly in Munich, where his \
manner became more refined. In 1885, in Paris, he painted After the Hunt, a large trompe-l'œil of \
hunting trophies that made his fame in the United States. Back in New York, suffering \
from rheumatism, he died in 1892, at forty-four. Long forgotten, he was \
rediscovered in the late 1930s."""
style = """
Harnett is the master of American trompe-l'œil. He chooses modest, worn objects, \
pipes, dog-eared books, musical instruments, game, and paints them at actual \
size, against a flat, close background, with a precision that erases the brushwork. \
His learned compositions, inherited from the Dutch, appealed to the public of saloons \
and department stores as much as to collectors."""

[[artistes]]
nom = "John Frederick Peto"
vie = "Philadelphia, 21 May 1854 – New York, 23 November 1907"
biographie = """
John Frederick Peto grew up in Philadelphia and studied in the late 1870s at \
the Pennsylvania Academy of the Fine Arts, where he subsequently exhibited still lifes. He \
became friends there with William Michael Harnett, six years his senior, whose example was decisive. \
But he knew neither fame nor major buyers. In 1889 he moved with \
his family to Island Heights, on the New Jersey coast, where he played the cornet at summer \
religious meetings. There he painted for nearly twenty years, in seclusion, \
letter racks, worn books, lanterns and cupboard doors. At his death in \
1907 he was forgotten; some of his canvases were even sold under Harnett's name, \
with false signatures, until the historian Alfred Frankenstein \
restored to him, around 1950, his name and his work."""
style = """
Peto paints the same subjects as Harnett, but with a freer touch, a softer light \
and poorer objects, battered, torn, as if gnawed by time. \
His flat compositions, made of planes and patches of colour, and their silent \
melancholy were compared in the twentieth century to modern painting."""

[[artistes]]
nom = "John Haberle"
vie = "New Haven (Connecticut), 1856 – New Haven, 1933"
biographie = """
John Haberle was born in New Haven and spent almost his whole life there. He learned engraving \
and lithography, worked for printers, then was hired at the Peabody Museum of \
Yale University, where he drew for the paleontologist Othniel Charles Marsh. He also took \
classes at the National Academy of Design in New York. In the mid-1880s he became known \
for his trompe-l'œil paintings of banknotes, stamps and newspaper clippings, so convincing that they were suspected \
of being collages. He then painted larger compositions, such as A Bachelor's Drawer, a bachelor's \
drawer filled with bills, cards and photographs, or Grandma's Hearthstone, a \
life-size fireplace. Eyesight problems gradually forced him to give up this \
meticulous work. He died in his native city in 1933."""
style = """
Haberle pushes trompe-l'œil to the point of a challenge. He chooses flat objects, banknotes, \
stamps, photographs, labels, which he can reproduce at their exact size without \
the eye detecting the trick, and plays humorously on the true and the false, even in \
his titles. His paintings are also archives of the print culture of his time."""

[[artistes]]
nom = "Raphaelle Peale"
vie = "Annapolis (Maryland), 17 February 1774 – Philadelphia, 4 March 1825"
biographie = """
Raphaelle Peale was the son of Charles Willson Peale, portraitist of George \
Washington, naturalist and founder in Philadelphia of a museum of natural history and \
portraits. Trained by his father, he worked with him at the museum, where he prepared stuffed \
animals, and painted portraits and miniatures. From the 1810s on, he devoted himself mainly to \
still life, a genre that America then considered minor, and became the first great \
specialist in it in his country. His life was difficult: gout, alcohol and probably the toxic substances used in \
taxidermy ruined his health, and his paintings sold poorly. He died in Philadelphia \
in 1825, at fifty-one. His still lifes are now counted among the \
most admired works of early American painting."""
style = """
Peale composes sober and rigorous still lifes: a few fruits, a dish, a \
glass, lined up on a ledge against a dark ground, under a frank light. \
An heir to the Dutch of the seventeenth century, he seeks clarity more than abundance, and \
renders each material with a precision that verges on trompe-l'œil. He is the great \
forefather of American still life."""

[[artistes]]
nom = "James Gillray"
vie = "Chelsea (London), 13 August 1756 – London, 1 June 1815"
biographie = """
The son of a former soldier, James Gillray grew up in Chelsea in the community of the Moravian \
Brethren, an austere Protestant church. He first learned letter engraving, \
then in 1778 entered the schools of the Royal Academy. But it was caricature that \
made him famous. From the 1790s he worked almost exclusively for \
the publisher Hannah Humphrey, with whom he lived, in Bond Street and then at 27 St James's \
Street. He ridiculed in turn King George III, the ministers William Pitt and \
Charles James Fox, the French Revolution and Napoleon, whom he reduced to a raging “little \
Boney.” His prints circulated as far as the Continent. Around 1810 his sight and \
his reason declined; after a suicide attempt, he stopped engraving and died in \
1815, in the house in St James's Street."""
style = """
Gillray fixed the rules of modern political caricature: deformed \
but recognizable figures, speech balloons coming out of mouths, teeming compositions \
full of details to read. His rapid, violent etching and his hand-applied colours \
make each plate a spectacle. He is one of the direct forefathers of the \
newspaper cartoon and of comics."""

[[artistes]]
nom = "Winsor McCay"
vie = "Canada or Michigan, c. 1867 – New York, 26 July 1934"
biographie = """
The origins of Zenas Winsor McCay remain uncertain: he was probably born in Canada or \
in Michigan, between 1867 and 1871. He grew up in Michigan, where he received the \
only real lessons of his life from a teacher of perspective drawing. He \
worked first for circuses and dime museums, whose posters and \
sets he painted, then became a newspaper cartoonist in Cincinnati. In \
1903 he joined the New York Herald, where he created Little Sammy Sneeze and Dream of the \
Rarebit Fiend, then, in 1905, Little Nemo in Slumberland. A pioneer of animation, he \
made a first film based on Little Nemo in 1911, then Gertie the Dinosaur in 1914. \
Having entered the service of the press baron William Randolph Hearst, he devoted his \
last years mainly to editorial cartoons, and died in New York in 1934."""
style = """
McCay is the first great virtuoso of comics: he exploits the whole \
surface of the page, varies the size of the panels with the needs of the story and draws \
architecture of astonishing precision. His clear line, marked by Art Nouveau, \
serves an imagination of dream and metamorphosis that influenced generations of \
authors and opened the way for animated film."""

[[artistes]]
nom = "Juan Gris"
vie = "Madrid, 23 March 1887 – Boulogne-sur-Seine, 11 May 1927"
biographie = """
José Victoriano González-Pérez studied engineering in Madrid, then turned to \
drawing. In 1906 he moved to Paris, to the Bateau-Lavoir in Montmartre, where he saw \
Cubism being born in the studio of his neighbour and compatriot Picasso. To make a living he \
drew for satirical newspapers such as L'Assiette au beurre. He devoted himself to \
painting from 1910 and exhibited for the first time in 1912, at the Salon des \
Indépendants; the same year he made his first papiers collés and signed a \
contract with the dealer Daniel-Henry Kahnweiler. During the war he stayed in \
France, in great poverty, and became one of the most rigorous representatives \
of Cubism. In the 1920s he created sets and costumes for the Ballets \
Russes. Ill, he died in 1927, at forty."""
style = """
Gris is the great architect of Cubism. He starts from an abstract structure, a grid \
of lines and coloured planes, then lets everyday objects appear in it: \
newspapers, bottles, pipes, playing cards. His bold colours, his calculated composition and \
the sharpness of his forms left their mark on all the constructed painting of the \
1920s."""

[[artistes]]
nom = "Kurt Schwitters"
vie = "Hanover, 20 June 1887 – Kendal (England), 8 January 1948"
biographie = """
The son of well-to-do shopkeepers in Hanover, Kurt Schwitters studied painting at the Academy \
of Dresden. During the war he was employed as an industrial draughtsman in a \
factory. In 1919 he invented Merz, an art made of all materials, refuse included, \
and exhibited his first collage paintings in Berlin, at the Der Sturm gallery. Kept \
at a distance by the Berlin Dadaists, he created his own Dada in Hanover, with his journal \
Merz, his sound poems and his performances, and built in his house the Merzbau, \
an interior architecture that overran several rooms. Branded a degenerate artist \
by the Nazis, he fled to Norway in 1937, then to Great Britain in 1940, where he was \
interned for several months on the Isle of Man. He ended his life in the Lake District and \
died in Kendal in 1948."""
style = """
Schwitters makes art out of everything: tickets, labels, wrappers, wood, string, \
words and sounds. His collages nonetheless remain rigorous compositions, in which each \
fragment counts for its colour and form. His way of gathering the refuse of \
consumer culture opened the way for pop art, the New Realists and the art of \
today."""
