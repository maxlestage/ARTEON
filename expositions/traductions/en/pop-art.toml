[[oeuvres]]
titre = "Jane Avril"
artiste = "Henri de Toulouse-Lautrec"
annee = "1899"
image = "jane-avril.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.42691.html"
technique = "Five-colour lithograph (poster) on thin wove paper, 56 × 38 cm"
collection = "National Gallery of Art, Washington"
note = "The Moulin Rouge dancer, a snake coiled on her black dress: the last poster Toulouse-Lautrec designed for his friend Jane Avril."
description = """
Against the bare cream-coloured paper, a dancer twists, seen almost full-length. \
Her long black dress, a single flat area of colour, traces a sinuous silhouette that runs \
down to the bottom of the sheet, where a red petticoat flares out. A snake with yellow \
and blue-green coils winds around her body, from the knees to the shoulder, and rests its \
head on her chest. Leaning forward, her arms bent at the level of her face, she spreads \
open hands like claws; her pale face, framed by yellow hair, \
tilts beneath an enormous hat with red feathers that takes over the top of the poster. On the \
left, the name JANE Avril is set in hand-drawn black letters. On the right \
edge, in small print, appears the printer's name, H. Stern, Paris; at lower right, the \
artist's monogram in a circle and the date 1899."""
evocation = """
Jane Avril is one of the stars of the Montmartre of the 1890s, and one of Lautrec's most \
loyal friends. A slender, strange dancer nicknamed “la Mélinite” after \
an explosive, she stands apart from the exuberance of La Goulue with a nervous \
and melancholy grace. The snake makes her a charmer, an Eve or a femme fatale, \
and echoes the undulations of her dance. But the image matters above all as a sign: a \
black body, a name, three or four colours, which the passer-by recognizes at first \
glance from across the street. This is already what Andy Warhol would do with his \
stars, reduced to a face and a few flat areas of colour, and repeated like posters."""
histoire = """
Born Jeanne Beaudon in 1868, Jane Avril had a difficult childhood and as a teenager \
spent several months in the Salpêtrière hospital. She then danced at the Bal \
Bullier, the Moulin Rouge and the Jardin de Paris, where Lautrec noticed her. He \
depicted her often: in 1893 he devoted the Jardin de Paris poster to her and \
showed her as an elegant spectator in that for the Divan Japonais. This poster, \
printed in 1899 by H. Stern in Paris, is the last he designed for her; that \
same year the artist, undermined by alcohol, was confined for several weeks in a \
clinic in Neuilly. In those years the craze for “affichomanie” led \
enthusiasts to collect posters, which were peeled off walls or bought \
directly from the printers."""
facture = """
Lithography allows Lautrec to draw directly on the stone, in crayon or \
with a brush, then to print each colour from a different stone: five here. \
The drawing is reduced to the essentials: a supple, almost calligraphic outline, and \
large areas of flat colour that read from a distance. The black dress is a single \
mass, without modelling, across which the snake traces a pale arabesque, where the yellow \
slides into blue by a slight gradation. The paper left in reserve serves as the ground, and \
the hand-drawn lettering is part of the image. This economy of means, \
inherited from Japanese prints, is that of the modern poster, and later of the \
screenprints of pop art."""
details = [
  "The yellow and blue snake, coiled around the dress, its head resting on her chest.",
  "The hat with red feathers, which takes over the whole top of the poster.",
  "The open, outstretched hands, as in a gesture of dance or enchantment.",
  "The name JANE Avril, in hand-drawn letters, set against the emptiness of the ground.",
  "Lautrec's monogram in a circle, above the date 1899.",
]
themes = ["poster", "dance", "star", "montmartre", "snake"]
anecdote = """
Jane Avril, who later published her memoirs, acknowledged that she owed Lautrec a good \
part of her fame, which began with the first poster he devoted to her in 1893."""
salle = 2
mur = "nord"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "Lorenzaccio (Sarah Bernhardt)"
artiste = "Alfons Mucha"
annee = "1896–1900"
image = "lorenzaccio.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1973.1018"
technique = "Colour lithograph, reduction of the poster published in the journal Les Maîtres de l'Affiche (plate 114, Chaix printing house, Paris)"
collection = "Cleveland Museum of Art, Cleveland"
note = "Sarah Bernhardt in a black doublet, in a male role: Mucha's poster for Musset's Lorenzaccio, in the reduction published by the journal Les Maîtres de l'Affiche."
description = """
In the centre of a large sheet with pale margins, a very narrow vertical strip \
holds the whole poster. A young man with short brown hair, wearing a \
dark doublet and a full brown cloak with puffed sleeves, stands \
pensive, one hand raised to his mouth; with the other he clasps a book with a green \
binding to himself. A dagger hangs from his embroidered belt. Behind him, a background of \
golden foliage and brocade patterns is set within an arch, bordered with the words \
SARAH BERNHARDT, ANNO DOMINI and MDCCCXCVI. At the top, two dragons with spread wings, \
one pale green, the other white, attack a golden shield studded with red balls. \
A cartouche announces the title, LORENZACCIO, a play by Alfred de Musset, and another, at \
the bottom, the Théâtre de la Renaissance. In the margin, a caption reads Les Maîtres de \
l'Affiche, plate 114."""
evocation = """
Sarah Bernhardt is the first great modern star: her voice, her gowns, her \
whims and her tours make headlines in newspapers around the world, and she watches \
over her image closely. In 1896, at over fifty, she plays Lorenzo de' Medici, the \
young man who, in sixteenth-century Florence, becomes the companion in debauchery of \
his cousin, Duke Alexander, the better to assassinate him. Mucha shows her meditating, her \
hand on her lips, as if hesitating on the threshold of the crime; the dragon biting the Medici \
arms is often read as an image of tyranny. The actress, her name and her \
role merge into an icon, as the film stars silkscreened by Warhol would later do."""
histoire = """
Written in 1834, Alfred de Musset's Lorenzaccio was considered unperformable: too long, \
too many characters, too many sets. Sarah Bernhardt finally premiered it on stage in \
December 1896, in an adaptation by Armand d'Artois, at the Théâtre de la Renaissance, \
which she was then managing. Since the success of Gismonda in early 1895, Mucha had been designing \
her posters, printed by F. Champenois, whose name appears at the bottom of the \
composition. The original poster, about two metres high, was pasted up in the \
streets of Paris. The sheet shown here is a reduction of it, published in Les Maîtres \
de l'Affiche, a monthly journal launched in 1895 by the Chaix printing house under the \
direction of Jules Chéret, which until 1900 offered collectors the \
finest posters in Europe in small format."""
facture = """
Mucha here takes up the format he invented for Gismonda: a very narrow vertical \
strip that makes the actress a full-length figure, almost life-size in \
the original poster, like a saint in a stained-glass window. The outline is dark and \
even, the colours muted: browns, golds, pale greens, with a few touches \
of red on the shield and at the garter. The background is covered with brocade patterns and \
scrollwork, and the lettering, in drawn capitals, is integrated into the decoration of the arch. \
The reduction, also printed by lithography, retains the richness of the colour range. \
Outlined flat areas and text mingled with the image anticipate all of twentieth-century graphic design."""
details = [
  "The hand raised to the lips, Lorenzo's gesture of hesitation before the murder.",
  "The pale green dragon biting the golden shield with the Medici red balls.",
  "The name SARAH BERNHARDT and the date MDCCCXCVI, inscribed around the arch.",
  "The dagger at the belt and the green-bound book, clasped to the body.",
  "The caption in the margin: Les Maîtres de l'Affiche, plate 114, Chaix printing house.",
]
themes = ["poster", "theatre", "star", "art nouveau", "cross-dressing"]
anecdote = """
Sarah Bernhardt played several male roles: after Lorenzo, she would be Hamlet in \
1899, then Napoleon's son in Edmond Rostand's L'Aiglon, in 1900."""
salle = 2
mur = "nord"
place = 5
largeur = 2.2

[[oeuvres]]
titre = "For Sunday's Dinner"
artiste = "William Michael Harnett"
annee = "1888"
image = "for-sundays-dinner.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/111377"
technique = "Oil on canvas, 94.3 × 53.6 cm"
collection = "Art Institute of Chicago, Chicago"
note = "A plucked chicken hangs from an old wooden door: a trompe-l'œil so precise that one feels one could touch the bird's pimpled skin."
description = """
On a door of planks painted a very dark green, almost black, a chicken hangs \
upside down, tied by one leg to a nail with string. \
The other, yellow leg splays out to the left, its toes clenched. The body, almost \
entirely plucked, shows yellowish, pimpled skin to which a few white \
feathers still cling; the severed neck hangs down to the bottom, the dark red head turned toward \
the ground. A soft shadow falls across the door, on the right. At the sides, heavy \
brass hardware: two hinges on the right, at top and bottom, and a double cut-out \
lock plate on the left. Nails, holes, cracks and a fallen feather \
dot the worn wood. At lower left, one reads the signature HARNETT and the date 1888."""
evocation = """
The title speaks of a family meal: the Sunday chicken, prepared as on \
the farm. The door with its rough planks, old hardware and rusty nails \
evokes a country kitchen, and with it a nostalgia for a simpler, rural America, \
at the moment when the cities were growing at great speed. But \
the image is also stark: the severed neck, the bare flesh, the forgotten feathers recall \
the animal's death, as in Dutch game still lifes. Harnett does not \
tell a story; he presents an object, alone, frontal, life-size. This \
taste for the ordinary object promoted to star would be that of the pop painters, from Warhol to \
Oldenburg."""
histoire = """
Born in Ireland and raised in Philadelphia, Harnett began as an engraver of silverware \
before becoming a painter of still lifes. After six years spent in Europe, \
mostly in Munich, he returned to the United States in 1886 and settled in New York. His \
reputation then rested on After the Hunt, a large trompe-l'œil of game and hunting \
gear hung in a New York saloon, where, it is said, customers came to check \
whether the objects were real. For Sunday's Dinner dates from these New York years, \
four years before his death in 1892. Forgotten after he died, Harnett was not rediscovered until the \
late 1930s, when America was looking for the roots of a national art. The \
painting now belongs to the Art Institute of Chicago."""
facture = """
Trompe-l'œil rests on a few rules that Harnett applies rigorously: a flat, close \
background, here the door, which rules out any depth; objects at their actual \
size; a lateral light that casts sharp shadows. In this narrow space, \
the painter details every material: the fibres and cracks of the wood, the pitted metal of \
the hardware, the poultry skin bristling with pores and bits of feathers, the white \
down laid on in small thick touches. The brushwork almost disappears, as if the \
paint wished to be forgotten. The vertical, narrow format, that of a door panel, \
reinforces the illusion of an object hanging there, before us."""
details = [
  "The small white feathers still clinging to the pimpled skin.",
  "The splayed leg, with clenched toes, tracing a diagonal to the left.",
  "The brass hinges, on the right, whose shape echoes that of the chicken.",
  "The double cut-out lock plate and the fallen feather, on the left.",
  "The signature and date, at lower left, as if inscribed in the wood.",
]
themes = ["trompe-l'œil", "still life", "kitchen", "object", "countryside"]
anecdote = """
Harnett also painted banknotes; according to an often-repeated account, the \
Treasury agents responsible for tracking down counterfeit money are said to have warned \
him against such lifelike images."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Card Rack with a Jack of Hearts"
artiste = "John Frederick Peto"
annee = "c. 1895"
image = "card-rack.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1973.30"
technique = "Oil on canvas"
collection = "Cleveland Museum of Art, Cleveland"
note = "Letters, a playing card, a portrait of Lincoln and newspaper clippings slipped under the ribbons of a letter rack: the bulletin board of an ordinary life."
description = """
On a board painted an almost black green, brown ribbons, tacked down in a square and \
crossed in an X, hold a small collection of papers. At the top, a playing card, \
the jack of hearts, sticks out behind a sea-green envelope and a green notebook with a \
red edge, set askew. At lower left, a folded yellow paper, a brown card \
and a small photograph: the portrait of Abraham Lincoln, recognizable by his beard. \
On the right, a blue envelope is tucked under a ribbon whose frayed end \
hangs in the void. All around are other traces: torn corners of yellow paper, \
still held by their tacks, at upper left; a white card; scribbled \
figures; the initials J.F.P. carved into the wood, at upper right; and finally, at \
the bottom, a torn label, a newspaper clipping, a match and a cigarette butt."""
evocation = """
Letter racks were the bulletin boards of the nineteenth century: into them one slipped the \
mail, cards, newspaper clippings, everything one needed to keep close at \
hand. Peto makes of it the portrait of an existence through its papers, and the reflection \
of a very human desire to collect and to remember. Nothing in it is precious: \
everything is worn, torn, frayed, as if time had passed over these objects. The \
photograph of Lincoln, the president assassinated in 1865, which Peto often places in \
his paintings, adds a note of mourning and national memory. This mixture of anonymous \
printed matter, a playing card and a famous face anticipates Robert \
Rauschenberg's assemblages and the picture panels of pop art."""
histoire = """
Peto trained at the Pennsylvania Academy of the Fine Arts in Philadelphia and became friends \
with Harnett, whose work he admired. But he did not know his success. In 1889, \
he moved to Island Heights, a small seaside resort in New Jersey, where he painted \
far from exhibitions and played the cornet at summer religious meetings. At his \
death in 1907 he was almost unknown. Several of his paintings were later given \
false Harnett signatures, since Harnett's work sold for more, and it was not until around 1950 that \
the historian Alfred Frankenstein restored each artist's works to him. Peto painted \
letter racks throughout his career; this one, from the 1890s, is now \
in the Cleveland Museum of Art."""
facture = """
Peto paints more freely than Harnett. His objects have slightly blurred outlines, \
muted colours laid down in visible touches, and a soft light that bathes them \
rather than cutting them out. The illusion rests first of all on the composition: everything is \
flat, on the very plane of the picture, so that no object betrays the surface of the \
canvas. The cast shadows of the ribbons and papers, the dog-eared edges, the tears \
and the hanging threads create the relief; even the cigarette butt, at the bottom, seems about to fall \
out of the frame. The patches of colour, the green of the notebook, the blue of the envelope, the yellow \
of the paper, answer one another against the dark ground as in an abstract composition."""
details = [
  "The jack of hearts sticking out at the top, behind the sea-green envelope.",
  "The small photographic portrait of Abraham Lincoln, at the bottom of the letter rack.",
  "The initials J.F.P., as if carved with a knife in the wood, at upper right.",
  "The torn corners of yellow paper, still held under their tacks.",
  "The cigarette butt and the match, at the bottom, which seem to come out of the picture.",
]
themes = ["trompe-l'œil", "papers", "memory", "lincoln", "object"]
anecdote = """
Peto's letter racks were first put to commercial use: as early as 1879 he painted \
one for a Philadelphia coal company, which displayed it as a sign."""
salle = 3
mur = "ouest"
place = 3
largeur = 2.0

[[oeuvres]]
titre = "Imitation"
artiste = "John Haberle"
annee = "1887"
image = "imitation.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.106596.html"
technique = "Oil on canvas, 25.4 × 35.6 cm"
collection = "National Gallery of Art, Washington"
note = "A one-dollar bill, a fifty-cent note, stamps and coins, all painted, even the frame: the title admits the sleight of hand."
description = """
Everything one sees is painted, including the frame. A light wooden moulding, with orange \
grain, surrounds a dark, purplish-brown ground on which two American \
banknotes lie. The larger, a crumpled, worn one-dollar bill torn at the edges, shows at the centre \
the portrait of George Washington in a medallion, \
the word ONE, red serial numbers and the inscription Washington, D.C. On top of it, \
a small fifty-cent note, the “fractional currency” of the period, bears a \
portrait of a man and a gold seal. At upper right, a copper coin; beside it, the \
signature J. Haberle, New Haven, Ct., 1887. On the frame itself, at lower left, \
spill over a small photograph of a bearded man, postage stamps, one blue, the other \
olive, a silver coin and fragments of stamps; at the bottom, a label bears the \
artist's name."""
evocation = """
The title, Imitation, is a challenge thrown to the viewer: everything here is fake, and yet \
everything seems within reach of the fingertips. To paint money is to play on \
two illusions at once: that of painting, which makes one believe in an object, and that \
of paper currency, which makes one believe in a value. In the America of the late \
nineteenth century, where the value of paper money against gold was bitterly debated, these \
crumpled bills, passed from hand to hand, also speak of everyday life and \
small sums. Seventy-five years later, in 1962, Andy Warhol would in turn paint \
dollar bills, lined up like a printing plate."""
histoire = """
John Haberle spent almost his whole life in New Haven, Connecticut. Trained as an \
engraver and lithographer, he also worked at Yale University's Peabody Museum, where \
he drew for the paleontologist Othniel Charles Marsh. His paintings of money, exhibited \
from the mid-1880s, caused a sensation by their precision. They flirted with \
the forbidden: American law punished the reproduction of currency, and the Treasury \
was watching. Imitation, signed and dated 1887, belongs to the series in which Haberle pushes \
illusion as far as possible, to the point of painting the frame and the objects that seem \
stuck to it. The painting is now in the National Gallery of Art in \
Washington."""
facture = """
Haberle pushes precision even further than Harnett. He reproduces with the brush the \
guilloché patterns of the banknotes, their ornate lettering, the numbers, the signatures and the \
fine engraving of the portraits, on a scale so small that one must step close to \
see it. He also imitates wear: folds, creases in the paper, stains, tears. The painted \
frame extends the game: the stamps and the photograph appear glued to the \
moulding, outside the picture, as if the illusion spilled over into our world. The \
dark, neutral ground, without depth, and the even light prevent the eye from gauging \
space; everything seems placed on the very surface of the canvas, at actual size."""
details = [
  "The portrait of George Washington, at the centre of the crumpled one-dollar bill.",
  "The red serial numbers, painted digit by digit.",
  "The small photograph of a bearded man, set on the painted frame.",
  "The postage stamps and their fragments, spilling onto the moulding.",
  "The signature J. Haberle, New Haven, at upper right of the dark ground.",
]
themes = ["trompe-l'œil", "money", "banknote", "illusion", "object"]
anecdote = """
When one of his money paintings was exhibited in Chicago, a critic claimed that the \
bills were real bills glued onto the canvas; Haberle had the \
painting examined, and it proved to be entirely painted."""
salle = 3
mur = "nord"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Still Life—Strawberries, Nuts, &c."
artiste = "Raphaelle Peale"
annee = "1822"
image = "strawberries-nuts.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/120154"
technique = "Oil on wood panel, 41.1 × 57.8 cm"
collection = "Art Institute of Chicago, Chicago"
note = "A glass bowl filled with strawberries, an orange, nuts and Chinese porcelain: the abundance of the young America, arranged on a ledge."
description = """
On a bare wooden ledge, against a dark ground, objects are lined up from left \
to right as on a stage. At the centre, a large stemmed glass bowl, closed \
with a lid topped by a knob, is filled to the brim with red strawberries packed against one \
another. In front of it, in a wide white porcelain dish, an orange \
with two green leaves sits enthroned on a bed of hazelnuts and almonds. On the left, \
a two-handled sugar bowl, decorated with a medallion showing a seated figure beside an \
anchor, before the sea and a ship, rests on a stack of saucers. On the right, a white \
cream pitcher with a gilded rim and, on the ledge, a small cluster of dried fruit \
still attached to its stem, probably raisins, which trails down to the edge. At lower \
right, one reads the signature Raphaelle Peale Pinxt 1822."""
evocation = """
Raphaelle Peale here paints riches that are modest, but chosen. The porcelain \
made in China for the American market is an imported luxury, a sign of the \
prosperity and commercial power of the young republic; the anchor, traditional attribute \
of Hope, recalls the ships that bring it back. The strawberries \
may have come from a hothouse, grown out of season, an experiment that the \
Peale family carried out on their farm near Philadelphia. The perfect order of the objects, \
lined up like goods in a shop window, makes the still life a eulogy of domestic comfort \
and commerce. A century and a half later, Warhol's soup cans would in turn \
speak of American abundance, in rows."""
histoire = """
Raphaelle Peale was the son of Charles Willson Peale, painter, naturalist and \
founder in Philadelphia of one of the first museums in the United States. Like his brothers, \
named Rembrandt, Rubens or Titian, he was given the name of a great painter and learned \
the trade from his father. He was one of the first American artists to \
specialize in still life, a genre then little esteemed, and exhibited it from the 1810s \
at the Pennsylvania Academy of the Fine Arts. This panel of 1822 dates from the \
last years of his life, marked by illness and hardship; he died in 1825. \
Nourished by the Dutch still lifes of the seventeenth century, his art paved the way for the \
trompe-l'œil paintings of Harnett and Peto, hung in the same gallery."""
facture = """
Peale paints on a wooden panel with a smooth grain, which allows meticulous and almost \
invisible execution. The composition is of great simplicity: a horizontal \
ledge, a dark ground, a light coming from the left that makes the glass and porcelain gleam \
and models each fruit. The painter carefully distinguishes the materials: \
the transparency of the bowl and the reflections on its lid, the bumpy skin of the orange, the shine of the \
hazelnuts, the white enamel of the dish, the painted decoration of the sugar bowl. The objects barely overlap, \
each keeping its place, which gives the painting a solemn calm, \
between the merchant's display and the altar."""
details = [
  "The strawberries piled up behind the glass, slightly distorted by its curvature.",
  "The orange with its two leaves, set like a crown on the nuts.",
  "The medallion of the Chinese porcelain sugar bowl, with its anchor and ship.",
  "The cream pitcher with its gilded rim, standing out against the dark ground.",
  "The signature Raphaelle Peale Pinxt 1822, traced at the edge of the ledge.",
]
themes = ["still life", "fruit", "porcelain", "abundance", "commerce"]
anecdote = """
Raphaelle Peale also painted a famous “deception,” Venus Rising from the Sea—A \
Deception: a white towel, painted in trompe-l'œil, seems to hang in front of a \
painting of a nude that it almost entirely conceals."""
