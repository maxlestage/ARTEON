[exposition]
ordre = 200
nom_court = "Before Pop Art"
mouvement = "Poster, trompe-l'œil, caricature, collage"
cadre = "noir"
couleur = "#b3122e"
titre = "Before Pop Art: The Popular Image, from Poster Stars to Collages"
artiste = "Toulouse-Lautrec, Mucha, Harnett, Peto, Gillray, McCay, Gris, Schwitters…"
dates = "1808–1920"
accroche = "Virtual exhibition · Museum Ludwig, Cologne"
introduction = """
Pop art of the 1960s did not come out of nowhere. When Andy Warhol repeats the face \
of Marilyn Monroe, when Roy Lichtenstein blows up a comic-book panel or when Claes \
Oldenburg sculpts a giant hamburger, they are borrowing images that the poster, \
the trompe-l'œil, the caricature and the collage had made familiar long before them. \
Because pop art is still protected by copyright, this exhibition shows its \
ancestors, now in the public domain: ten works from 1808 to 1920, from the \
stars of Toulouse-Lautrec and Mucha to John Haberle's painted banknotes, \
from Gillray's caricature shop to Winsor McCay's Little Nemo, from Juan Gris's \
Fantômas to the collages of Kurt Schwitters. The building takes its inspiration from the Museum Ludwig \
in Cologne, one of the great pop art collections in Europe: an entrance hall, a great \
hall twelve metres high and three white galleries around it. Prints and \
small paintings are shown here enlarged."""
vitrine = "jane-avril.jpg"

[musee]
nom = "Museum Ludwig"
ville = "Cologne, Germany"
architecte = "Peter Busmann and Godfrid Haberer"
construction = "opened in 1986"
presentation = """
In 1976, the collectors Peter and Irene Ludwig, chocolate manufacturers from Aachen, \
gave the city of Cologne some 350 works of modern art, including an exceptional \
group of American pop art; in return, the city undertook to build a museum bearing \
their name. The building, designed by Peter Busmann and Godfrid Haberer, opened in \
1986 between the cathedral and the Rhine. At first it also housed the \
Wallraf-Richartz-Museum, which left in 2001 for a building of its own. It is \
recognizable by its sawtooth roofs, whose skylights spread an even light through \
the galleries; beneath the neighbouring square lies the concert hall of the \
Philharmonie. Today it shows Warhol, Lichtenstein, Rauschenberg, Johns and \
Oldenburg, one of the most important Picasso collections, the Russian avant-garde and \
a rich collection of photographs."""
ici = """
As at the Museum Ludwig, large white spaces open onto one another. You \
enter from the south into the plain hall, seven metres high, then into the great hall, \
twenty metres wide and twelve high, where “Poster Stars” brings together \
Toulouse-Lautrec's Jane Avril and Mucha's Sarah Bernhardt as Lorenzaccio. To \
the west, the “Everyday Objects” gallery gathers the trompe-l'œil paintings of Harnett, \
Peto, Haberle and Raphaelle Peale; to the east, “Laughter and Comics” \
displays Gillray and Winsor McCay's Little Nemo; to the north, “Pasted Papers and \
Collages” shows Juan Gris's Fantômas and Kurt Schwitters's Little Dance. All \
the walls are a warm white."""

