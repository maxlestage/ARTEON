[[oeuvres]]
titre = "The Venus of Urbino"
artiste = "Titien"
annee = "1538"
image = "venus-urbino.jpg"
technique = "Oil on canvas, 119 × 165 cm"
collection = "Uffizi Gallery, Florence"
note = "A young nude woman, reclining on a bed, looks at the viewer: the model of the reclining nude for centuries."
description = """
A young blonde woman lies nude on an unmade bed, with white sheets, set on a red mattress. Propped on two pillows, she holds a bunch of roses in her right hand and rests her left on her belly. She turns her head towards us and looks at us frankly. At her feet, a small red-and-white dog sleeps, curled in a ball. The left half of the room is closed off by a dark green curtain; on the right, a brighter room, paved with flagstones, opens at the back onto a window in which a potted tree and the evening sky can be seen. Two servants there rummage in a marriage chest to take out clothes."""
evocation = """
Nothing really indicates that she is the goddess: no Cupid, no mythological attribute, only the roses and the myrtle in the window, plants of Venus. The woman is in a rich Venetian home, at the intimate moment of dressing. Many historians read the painting as an image of marriage: the nuptial chest, the dog, symbol of fidelity, the roses of love. Others see in it first of all a sensual painting intended for a prince’s pleasure. The direct gaze, at once calm and provocative, accounts for the work’s modernity: the viewer is no longer a hidden voyeur, but is looked at. Manet would remember it for his Olympia."""
histoire = """
The painting was bought from Titian in 1538 by Guidobaldo della Rovere, son of the Duke of Urbino, who refers to it in his correspondence simply as the nude woman; he became Duke of Urbino the same year. The work remained in Urbino and then in Pesaro in the della Rovere collections until 1631: it then arrived in Florence with the inheritance of Vittoria della Rovere, wife of Grand Duke Ferdinando II de’ Medici, like the diptych by Piero della Francesca. Later displayed in the Uffizi’s Tribune, admired, copied and sometimes criticised for its nudity, it is one of the most famous paintings in the museum."""
facture = """
Titian takes up the pose of Giorgione’s Sleeping Venus, kept in Dresden, which he himself had completed after his elder’s death; but he awakens the figure and transports her into an interior. The body, modelled by passages of golden light almost without outline, stands out against the white of the sheets and the dark green of the curtain. The composition is cut in two by the edge of the curtain, which falls over the woman’s sex. The reds of the mattress and of the servant’s dress, answering one another, balance the whole: colour builds the painting."""
details = [
  "The small dog asleep at the foot of the bed.",
  "The bunch of roses in the young woman’s right hand.",
  "In the background, the kneeling servant, her head plunged into the marriage chest.",
  "The pot of myrtle set on the window ledge.",
  "The ring on the little finger of the left hand.",
]
themes = ["nude", "venus", "marriage", "intimacy", "sensuality", "venice"]
anecdote = """
Visiting the Uffizi, the American writer Mark Twain was scandalised by this painting: in his travel narrative A Tramp Abroad, in 1880, he calls it the most obscene picture in the world, remarking that no writer would dare to describe in words what all the visitors come to contemplate there."""
