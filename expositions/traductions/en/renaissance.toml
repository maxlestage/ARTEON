[[oeuvres]]
titre = "The Tempest"
artiste = "Giorgione"
annee = "c. 1506–1508"
image = "tempete.jpg"
technique = "Oil on canvas, 82 × 73 cm"
collection = "Gallerie dell’Accademia, Venice"
note = "A storm, a soldier, a nursing mother: the most enigmatic painting of the Venetian Renaissance."
description = """
A landscape crossed by a river fills the whole picture. On the left, a young man in a red and white costume, leaning on a long staff, looks to the right. Near him stand a brick wall and two stumps of broken columns. On the right, on the other side of the water, a nearly nude woman, a white cloth over her shoulders, sits in the grass and nurses a child; she turns a grave gaze towards us. Between them, a wooden bridge spans the river and leads to a town with white walls, with a dome and towers. Above, the dark green sky is torn by a lightning bolt, sign of the approaching storm."""
evocation = """
No one knows what this painting represents, and that may be its subject. It has been seen as Adam and Eve after the Fall, a mythological scene, an allegory of Fortune, Fortitude and Charity, or a meditation on all-powerful nature. The broken columns would evoke the fragility of human affairs, the lightning divine power. For many historians, Giorgione here invents a painting of poetry rather than of history: the figures, isolated, without dialogue, merge into the landscape, and it is the atmosphere of the storm, the strange light that precedes rain, that becomes the true subject of the work."""
histoire = """
The Tempest is one of the few works attributed with certainty to Giorgione. In 1530, the Venetian scholar Marcantonio Michiel described it in the house of the patrician Gabriele Vendramin, one of the great collectors of Venice, as a small landscape on canvas with the storm, a gypsy woman and a soldier. The painting had probably been made for a refined connoisseur, able to savour its enigma. It then passed through several Venetian collections, notably that of the Giovanelli princes, from whom the Italian State bought it in 1932 for the Gallerie dell’Accademia in Venice, where it has been displayed since."""
facture = """
Giorgione paints in oil, directly on the canvas, without rigorous preparatory drawing: he composes and corrects as he paints. The colours, laid in transparent layers, melt into one another and create a humid, vibrating atmosphere. The deep green of the sky, the white lightning and the foliage gilded by the last light build space better than geometric perspective. This painting through colour and light, Venetian colorito, stands opposed to Florentine disegno and would be developed by Titian."""
details = [
  "The lightning bolt, almost at the centre of the sky, above the town.",
  "The two broken columns on their base, behind the young man.",
  "The woman’s gaze, turned towards the viewer.",
  "The small white bird on the roof of a house, on the right.",
]
themes = ["landscape", "storm", "enigma", "nature", "venice"]
anecdote = """
An X-ray revealed that in place of the young man, Giorgione had first painted a nude woman seated at the water’s edge, perhaps bathing. This pentimento shows that he improvised his subject as he worked."""
