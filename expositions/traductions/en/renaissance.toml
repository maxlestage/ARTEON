[exposition]
ordre = 20
nom_court = "Renaissance"
mouvement = "Italian Renaissance"
cadre = "dore"
couleur = "#7a2e2e"
titre = "The Italian Renaissance, the Invention of Man"
artiste = "Botticelli, Leonardo, Raphael, Michelangelo, Titian…"
dates = "1460–1538"
accroche = "Virtual exhibition · Uffizi Gallery, Florence"
introduction = """
In the 15th century, Florence rediscovered Antiquity, invented perspective and placed man at the centre of the picture; a century later, Rome and Venice carried this revolution to its peak. From Filippo Lippi to Titian, ten paintings tell the story of this passage, from the Madonnas of the Quattrocento to the Venetian nudes. The building is inspired by Vasari’s Uffizi Gallery: a long U-shaped corridor lined with rooms, the Botticelli Room, the Medici’s red Tribune and the small corridor running along the Arno."""
vitrine = "naissance-de-venus.jpg"

[musee]
nom = "Uffizi Gallery"
ville = "Florence, Italy"
architecte = "Giorgio Vasari"
construction = "1560–1581"
presentation = """
In 1560, Cosimo I de’ Medici commissioned Giorgio Vasari to build, between the Palazzo Vecchio and the Arno, a building for the offices, the uffizi, of Florence’s magistracies. Completed in 1581 by Alfonso Parigi and Bernardo Buontalenti, the building forms a very elongated U around a narrow square open to the river, bordered by a portico of pietra serena, the grey stone of Tuscany. In 1565, Vasari linked it to the Pitti Palace by a corridor that crosses the Arno over the Ponte Vecchio. From 1581, Francesco I de’ Medici installed on the top floor a gallery of antiquities and paintings, then had Buontalenti build the Tribune, an octagonal room beneath a dome inlaid with mother-of-pearl. In 1737, Anna Maria Luisa, the last of the Medici, bequeathed the collections to Florence on condition that they never leave it. Opened to the public in the 18th century, the gallery today presents one of the richest collections of Italian painting: Giotto, Botticelli, Leonardo, Michelangelo, Raphael, Titian."""
ici = """
ARTEON’s building takes up the U of the Uffizi. One enters from the south into the Grand Staircase room, then climbs north to “The First Corridor · The Quattrocento”, twenty-four metres long. On its east side open the Botticelli Room, square, then the Tribune, smaller and taller, whose red walls recall the setting of the Medici treasure. At the end, the corridor on the Arno, thirty metres long, crosses the building from east to west and leads to the last room, “The West Corridor · Venice”, which descends back to the south among Giorgione and Titian."""

