[[oeuvres]]
titre = "Virgin and Child with Two Angels"
artiste = "Filippo Lippi"
annee = "c. 1460–1465"
image = "vierge-deux-anges.jpg"
technique = "Tempera on panel, 95 × 63.5 cm"
collection = "Uffizi Gallery, Florence"
note = "Nicknamed “la Lippina”: a Virgin as an elegant young Florentine woman, before a window opening onto a landscape."
description = """
The Virgin is seated in profile, hands joined, in an armchair of which only the carved scroll armrest is visible, in the foreground. She wears a dark blue dress and an elaborate headdress of transparent veils and ribbons, studded with pearls. Before her, two angels, of whom only the face of the second is visible, support the Christ Child, who reaches out his arms to his mother. The angel in the foreground turns towards us with the broad smile of a mischievous child. The whole scene is framed by a window of grey stone, painted in trompe l’oeil like a real frame. Behind, a vast landscape of hills, rocks and rivers extends to a distant city, under a pale sky."""
evocation = """
Lippi brings the divine closer to everyday life. His Virgin is no longer a remote icon on a gold ground, but a real young woman, dressed in the Florentine fashion, whose hairstyle and profile recall the portraits of ladies of the time. An old tradition, reported by Vasari, holds that she has the features of Lucrezia Buti, the nun whom the painter, himself a monk, abducted from Prato and who bore him a son, the painter Filippino Lippi; nothing can prove it. The angel who smiles at the viewer creates a new complicity: he invites us to enter the scene. The open landscape, finally, speaks of the Quattrocento’s curiosity about the visible world, which painting now wanted to show as it is."""
histoire = """
The panel dates from Lippi’s maturity, in the early 1460s, when the Carmelite friar was working mainly in Prato, where he painted the frescoes of the cathedral choir. It is not known for whom it was made: its medium size suggests a work of private devotion, intended for a home rather than a church. The painting had an immediate success in the workshop: his pupil Sandro Botticelli took up the composition, almost line for line, in several early Madonnas. Kept in the collections of the grand dukes of Tuscany, it was transferred to the Uffizi in the late 18th century from the Poggio Imperiale villa. It is today one of the most reproduced images in the museum."""
facture = """
Lippi paints in tempera, with fine, superimposed hatching, which gives the faces a pearly softness. He remembers Masaccio, whom he had seen painting at the Carmine convent, for the volume of the bodies, but adds a supple, graceful line that would be passed on to Botticelli. The painted window, which acts as a frame, is a remarkable invention: it separates the viewer’s space from that of the picture. The landscape, with its needle-like rocks and bluish distances, was perhaps inspired by Flemish painting, much admired in Florence."""
details = [
  "The transparent veil and the pearls of the Virgin’s headdress.",
  "The angel smiling as he looks at the viewer, in the foreground.",
  "The scroll armrest of the armchair, at lower left.",
  "The grey stone frame, entirely painted in trompe l’oeil.",
  "The city and the needle-like rocks of the landscape, behind the Virgin.",
]
themes = ["virgin and child", "angels", "landscape", "devotion", "elegance"]
anecdote = """
An unruly monk, Lippi was several times rescued from trouble by Cosimo de’ Medici, his patron. Vasari relates that Cosimo once shut him up in his palace so that he would finish a commission, and that the painter escaped by climbing down from the window on knotted sheets."""
salle = 2
mur = "ouest"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "The Diptych of the Duke and Duchess of Urbino"
artiste = "Piero della Francesca"
annee = "c. 1465–1475"
image = "ducs-urbino.jpg"
technique = "Tempera and oil on panel, two panels of 47 × 33 cm"
collection = "Uffizi Gallery, Florence"
note = "Battista Sforza and Federico da Montefeltro, face to face in profile, above the hills of their duchy."
description = """
Two panels face one another. On the left, Battista Sforza, Countess of Urbino, is seen in profile, her complexion very pale, her blonde hair braided and wound in white ribbons, beneath a veil and a small diadem of pearls. She wears a black dress with a gold brocade sleeve and a pearl necklace. On the right, her husband Federico da Montefeltro answers her, also in profile, in a brilliant red robe and cap, his nose marked by a deep notch. Behind them stretches a single landscape, seen from very high: hills, fields, fortified towns, a lake where boats glide, up to the bluish mountains of the horizon. The two faces stand out sharply against the sky."""
evocation = """
The profile, inherited from ancient medals, makes these portraits official images, almost coins: it celebrates the power, dignity and memory of the couple rather than their intimacy. The shared landscape running from one panel to the other speaks of the union of the spouses and their rule over the territory of Urbino. It has often been thought that the portrait of Battista, who died very young in 1472 after giving Federico a son, is posthumous, which would explain her waxen pallor. The duke, a famous condottiere and great humanist, shows himself as a man of war and of learning: the diptych is the portrait of a court that made Urbino one of the most refined centres of the Renaissance."""
histoire = """
Piero della Francesca worked on several occasions for Federico da Montefeltro, lord and then duke of Urbino, whose palace brought together artists, mathematicians and men of letters. The diptych was probably painted around the death of Battista Sforza, in 1472; the date remains debated. On the reverse, Piero painted the triumphs of the two spouses, on chariots drawn by white horses and unicorns, accompanied by Latin inscriptions in their glory. The panels, perhaps originally joined by hinges, remained in Urbino until 1631: upon the extinction of the della Rovere family, heirs of the Montefeltro, they passed to Florence with the inheritance of Vittoria della Rovere, wife of Grand Duke Ferdinando II de’ Medici."""
facture = """
Piero, as much a mathematician as a painter, builds his figures as pure volumes: Battista’s neck is a column, Federico’s cap a cylinder. The clear, even light, without dramatic shadows, bathes the faces and the landscape in the same serenity. The landscape, meticulous and distant, recalls the Flemish painters, whose works were appreciated at the court of Urbino; Piero indeed uses oil, a technique from the North, for the glazes. Aerial perspective, which makes distances bluer and paler, gives an immense depth to these small panels."""
details = [
  "Federico’s hooked, notched nose, and his tight mouth.",
  "The beauty mark and wrinkles on the duke’s cheek, painted without flattery.",
  "Battista’s hairstyle, braided with white ribbons and studded with gems.",
  "The tiny boats on the lake, behind Federico.",
  "The fortified towns and towers, set on the hills.",
]
themes = ["portrait", "profile", "power", "couple", "landscape", "perspective"]
anecdote = """
Federico is always shown in left profile: in a tournament he had lost his right eye, and the lance had also cut into his nose. It is said that he afterwards had the bridge of his nose cut away to widen his field of vision."""
salle = 2
mur = "ouest"
place = 4
largeur = 1.5

[[oeuvres]]
titre = "The Dead Christ"
artiste = "Andrea Mantegna"
annee = "c. 1480"
image = "christ-mort.jpg"
technique = "Tempera on canvas, 68 × 81 cm"
collection = "Pinacoteca di Brera, Milan"
note = "Christ’s body seen from the feet: one of the most striking foreshortenings in painting."
description = """
Christ’s body, lying on a slab of pink marble, is seen from the feet, as if the viewer were standing at the end of the table. The soles of the feet, pierced by nails, are in the foreground; the body then stretches towards the top of the picture, covered by a shroud with deep folds, up to the head thrown back on a pillow. The hands, laid along the body, also show their wounds. On the left, crowded into a corner, three figures weep: the aged Virgin wiping her eyes with a handkerchief, Saint John with hands joined, and, almost out of the frame, Mary Magdalene. On the right, a small ointment jar recalls the perfumes of embalming. The room is dark and bare."""
evocation = """
Mantegna places the viewer as close as possible to death, almost against the corpse. There is no landscape, no angels, no glory: only a heavy, livid body, presented in its materiality. This viewpoint makes us witnesses of the mourning, beside the weepers, and invites us to meditate on the wounds and sacrifice of Christ, as the devotions of the time did. The contrast between the restraint of the body and the grief of faces distorted by tears is striking. Historians also see in it a demonstration: the painter, passionate about perspective and ancient sculpture, proves that he can represent the human body from the most difficult angle there is."""
histoire = """
The date of this painting is debated, between the 1470s and the end of the painter’s life. It seems to have remained in Mantegna’s workshop in Mantua, where he was court painter to the Gonzaga. At his death, in 1506, his sons found it among his possessions and offered it for sale; it was acquired shortly afterwards by Cardinal Sigismondo Gonzaga. After a long journey through private collections, it entered in 1824 the Pinacoteca di Brera, the great museum of Milan created in the Napoleonic era, where it is today one of the most famous works. Its original purpose remains unknown; its small format suggests a picture for private meditation."""
facture = """
Mantegna paints in tempera on a fine canvas, in an almost monochrome range of greys, muted pinks and browns, which gives the body the colour of stone. The shroud, with folds hollowed like marble, betrays his admiration for sculpture. The foreshortening is not mathematically exact: the feet are smaller than they should be and the head larger, because rigorous perspective would have hidden the torso behind enormous feet. Mantegna corrects the optics so that the gaze travels over the whole body, up to the face."""
details = [
  "The nail holes in the soles of the feet and on the backs of the hands.",
  "The Virgin’s face, wrinkled and twisted by tears, on the left.",
  "The ointment jar placed on the slab, at upper right.",
  "The folds of the shroud, carved like marble.",
]
themes = ["passion", "death", "mourning", "perspective", "foreshortening"]
anecdote = """
Christ’s feet are deliberately too small. Had Mantegna applied exactly the laws of perspective that he mastered so well, they would have hidden a large part of the body: the painter sacrificed accuracy to emotion."""
salle = 2
mur = "ouest"
place = 6
largeur = 1.15

[[oeuvres]]
titre = "Primavera (Spring)"
artiste = "Sandro Botticelli"
annee = "c. 1480"
image = "printemps.jpg"
technique = "Tempera on panel, 207 × 319 cm"
collection = "Uffizi Gallery, Florence"
note = "In an orange grove, Venus welcomes the return of spring: a secular mythological painting, a rare thing in Florence."
description = """
Nine figures line up on a meadow strewn with flowers, before a grove of orange trees laden with fruit. At the centre, set slightly back, Venus, dressed in white and red, raises her hand in a gesture of welcome; above her, a blindfolded Cupid looses an arrow. On the right, Zephyrus, the wind of spring, blue and puffed out, seizes the nymph Chloris, from whose mouth flowers emerge; beside her, Flora, crowned and wearing a dress embroidered with flowers, scatters them by the handful. On the left, the three Graces dance holding hands, in transparent veils, and Mercury, sword at his side, drives away the clouds with his caduceus."""
evocation = """
The exact meaning of the painting remains one of the great enigmas of art history. One first reads in it the cycle of the season: from right to left, the March wind fertilises the earth, which covers itself with flowers, under the reign of Venus. Historians have proposed literary sources, such as Ovid’s Fasti, where Chloris becomes Flora, and the poems of Angelo Poliziano, friend of the Medici. It has also been seen as a Neoplatonic allegory, inspired by Marsilio Ficino, in which earthly love rises towards spiritual love, or as a tribute to a marriage. The oranges, the mala medica, would evoke the Medici themselves. The painting celebrates beauty, love and the rebirth of nature."""
histoire = """
Spring is mentioned in 1499 in the inventory of the Florentine palace of Lorenzo di Pierfrancesco de’ Medici, cousin of Lorenzo the Magnificent, for whom it was probably painted; it has been proposed to link it to his marriage, in 1482. In the mid-16th century, Vasari saw it, with the Birth of Venus, in the Medici villa at Castello. The painting, forgotten like its author for centuries, was rediscovered in the 19th century, when Botticelli fascinated the English Pre-Raphaelites. After a stay at the Galleria dell’Accademia, it has been displayed at the Uffizi since 1919. A restoration, completed in 1982, gave back its clear colours from beneath blackened varnishes."""
facture = """
Botticelli paints in tempera on large joined poplar panels. The dark background of the grove sets off the pale bodies, lined up as on a frieze, without real depth: the painter prefers the rhythm of silhouettes to perspective. Everything rests on line: crisp contours, transparent veils with rippling folds, loosened hair, elongated, light bodies that seem barely to touch the ground. The meadow is a carpet of flowers painted one by one, with the precision of a herbarium, in the spirit of millefleurs tapestries."""
details = [
  "The flowers coming from the mouth of Chloris, pursued by Zephyrus.",
  "Cupid, blindfolded, aiming at one of the three Graces.",
  "Flora’s dress, embroidered with cornflowers, roses and daisies.",
  "Mercury, on the left, parting the clouds with his caduceus.",
  "The golden oranges of the grove, above the figures.",
]
themes = ["mythology", "spring", "love", "flowers", "medici", "dance"]
anecdote = """
Botanists have examined the painting’s meadow flower by flower: they identified in it several dozen real species of the Tuscan countryside in spring, including irises, cornflowers, forget-me-nots and wild strawberries."""
salle = 3
mur = "nord"
place = 2
largeur = 3.2

[[oeuvres]]
titre = "The Birth of Venus"
artiste = "Sandro Botticelli"
annee = "c. 1484–1486"
image = "naissance-de-venus.jpg"
technique = "Tempera on canvas, 172.5 × 278.5 cm"
collection = "Uffizi Gallery, Florence"
note = "Driven by the winds, the goddess born of the foam comes ashore on a shell: pagan beauty returns to painting."
description = """
At the centre, Venus, nude, standing on a great scallop shell, glides over the sea towards the shore. She covers her breast with one hand and her sex with her long red-gold hair, lifted by the wind. On the left, Zephyrus, the west wind, entwined with a female figure, probably the breeze Aura, blows to push the shell; roses fall around them. On the right, on the wooded shore, a young woman in a white dress scattered with cornflowers, an Hora, goddess of the seasons, steps forward to cover the goddess with a pink mantle embroidered with flowers. The sea, ruffled with small V-shaped waves, extends to the horizon, under a pale sky."""
evocation = """
The painting illustrates the ancient myth of the birth of Venus, risen from the sea foam, as sung by Hesiod and then by Poliziano in his Stanze. It is one of the first great images of the female nude since Antiquity, and one of the first mythological works of this size in Florence. In the minds of the Neoplatonic humanists around the Medici, it has been seen as the birth of ideal beauty, reflection of divine beauty, which uplifts the soul. Venus keeps the modest pose of the ancient statues that Botticelli could have seen, but her melancholy, distant face gives her an unreal, almost spiritual grace."""
histoire = """
The patron is not known with certainty: as for Spring, one thinks of a member of the Medici cadet branch, perhaps Lorenzo di Pierfrancesco. Vasari describes the two paintings in the mid-16th century in the Medici villa at Castello, near Florence. The Birth of Venus entered the Uffizi in 1815. Long judged mannered and forgotten, Botticelli was rediscovered in the 19th century by English critics and painters, and this Venus became one of the most famous images in the world. It has remained at the heart of the Uffizi’s Botticelli Room, of which it is today the most looked-at work."""
facture = """
Botticelli paints on canvas, a support still rare in Florence for a work of this size, in a light, lean tempera that gives the surface a matte look. He highlights with gold Venus’s hair, the leaves of the orange trees and the wings of the winds. The composition is almost symmetrical, organised around the goddess. Drawing dominates: fluid contours, waves reduced to a decorative pattern, bodies elongated in defiance of anatomy. Venus’s long neck and sloping shoulder are impossible, but they create the undulating line that makes all the grace of the figure."""
details = [
  "The gold highlights in Venus’s hair.",
  "The roses falling around the winds, on the left.",
  "The small V-shaped waves, like a fabric pattern.",
  "The pink mantle embroidered with daisies held out by the Hora, on the right.",
  "The reeds, at lower left, and the gilded edge of the shell.",
]
themes = ["mythology", "venus", "beauty", "nude", "sea", "antiquity"]
anecdote = """
A persistent legend holds that Venus has the features of Simonetta Vespucci, the beautiful Genoese woman admired by Florence, who died in 1476. No document proves it, and the painting was made nearly ten years after her death."""
salle = 3
mur = "est"
place = 2
largeur = 2.78

[[oeuvres]]
titre = "The Annunciation"
artiste = "Léonard de Vinci"
annee = "c. 1472–1476"
image = "annonciation.jpg"
technique = "Oil and tempera on panel, 98 × 217 cm"
collection = "Uffizi Gallery, Florence"
note = "One of Leonardo’s first works, painted at about twenty in Verrocchio’s workshop."
description = """
The scene takes place in a garden, before a Tuscan villa. On the left, the angel Gabriel, kneeling in the flowering grass, a lily in his hand, raises two fingers to bless and announce to Mary that she will bear the Son of God. On the right, the Virgin is seated before the corner of the house, with its protruding corner stones. She interrupts her reading, her right hand resting on an open book, and raises her left hand as a sign of surprise. The book rests on a richly carved marble lectern. Between the two figures, a low wall opens the view onto a row of cypresses and dark trees, then onto a distant harbour, mountains and water, drowned in blue mist."""
evocation = """
The Annunciation, a very frequent subject, becomes in the young Leonardo a calm and solemn encounter. The angel’s lily speaks of Mary’s purity; it is also the emblem of Florence. The enclosed garden, separated from the world by a low wall, recalls the hortus conclusus, the traditional image of virginity. Mary’s gesture, a mixture of astonishment and acceptance, conveys the moment of the Gospel dialogue. But what strikes most is the place given to nature: the flowering meadow, the trees, the misty landscape in the background already bear witness to Leonardo’s curiosity about the real world, botany and atmosphere."""
histoire = """
The painting comes from the church of San Bartolomeo a Monteoliveto, near Florence. It was painted in the workshop of Andrea del Verrocchio, where Leonardo trained, probably with the participation of other members of the workshop; the lectern is directly inspired by the tomb of Piero and Giovanni de’ Medici, sculpted by Verrocchio for the church of San Lorenzo. Entering the Uffizi in 1867, it was then attributed to Domenico Ghirlandaio. Only after long discussions did historians recognise it as an early work by Leonardo, an attribution now widely accepted. The Uffizi also holds Verrocchio’s Baptism of Christ, in which the young Leonardo painted one of the angels."""
facture = """
Leonardo mixes tempera and oil, which allows him softer transitions. The folds of the garments, of sculptural fullness, recall the drapery studies he painted on linen, after cloths dipped in clay. In the background, atmospheric perspective, which blurs the mountains in a bluish veil, announces his future manner. Certain awkward passages betray the painter’s youth: Mary’s right arm, too long, and the uncertain relationship between the Virgin, the lectern and the building, which have been explained by a painting conceived to be seen from an angle, from the right."""
details = [
  "The white lily held by the angel, emblem of purity and of Florence.",
  "The marble lectern, carved with motifs inspired by Antiquity.",
  "The flowers of the meadow, painted one by one.",
  "The harbour and the mountains, in the blue mist, at the centre of the painting.",
]
themes = ["annunciation", "angel", "virgin", "garden", "landscape", "perspective"]
anecdote = """
The angel’s wings, painted by Leonardo after real bird wings, were lengthened later by another hand, more clumsily: the retouching can still be made out."""
salle = 3
mur = "sud"
place = 2
largeur = 2.17

[[oeuvres]]
titre = "The Doni Tondo (The Holy Family)"
artiste = "Michel-Ange"
annee = "c. 1505–1507"
image = "tondo-doni.jpg"
technique = "Tempera and oil on panel, diameter 120 cm"
collection = "Uffizi Gallery, Florence"
note = "The only finished panel painting indisputably attributed to Michelangelo, painted for a wealthy Florentine merchant."
description = """
In a round picture, the Holy Family forms a compact block in the foreground. The Virgin, seated on the ground, her legs folded beneath a blue dress, turns in a powerful twist to take the Child handed to her by Saint Joseph, seated behind her, bearded and bald. Mary’s muscular arms, her broad shoulders and her pink dress with taut folds make her an almost heroic figure. Behind a low wall, the young Saint John the Baptist, dressed in an animal skin, looks up at the group. In the background, on a stone semicircle, five nude young men, seated or standing, rest or embrace, before a landscape of hills and a lake."""
evocation = """
The painting superimposes several ages of salvation history, according to a frequently proposed reading: in the background, the nudes represent pagan humanity, before the Law; Saint John, at the boundary, is the last prophet; in the foreground, the Holy Family opens the time of grace. The Child, held above Mary’s head, seems also to evoke his future destiny. Michelangelo, above all a sculptor, imposes a new vision: monumental bodies, in motion, expressing strength rather than gentleness. The nudes in the background, with no obvious narrative justification, anticipate the Ignudi he would paint shortly afterwards on the ceiling of the Sistine Chapel."""
histoire = """
The painting was commissioned by Agnolo Doni, a wealthy Florentine cloth merchant, perhaps on the occasion of his marriage to Maddalena Strozzi, in 1504, or of the birth of their daughter, in 1507. Tondi, round paintings, were then devotional objects prized in private homes. Michelangelo painted it in Florence, between the completion of the David and his departure for Rome. The panel has kept its original frame, of carved and gilded wood, probably designed by the artist himself, decorated with heads in relief and the crescent moons of the Strozzi arms. Passing later into the Medici collections, it is today one of the jewels of the Uffizi."""
facture = """
Michelangelo paints as he sculpts: the figures, ringed by a crisp outline, have the hardness of marble. He lays down vivid, acid colours, pink, orange, light blue, green, in smooth flat areas, with shifting reflections, the cangianti, which model volumes rather than melting them into shadow. This is far from Leonardo’s sfumato. The spiral composition, inscribed in the circle, gives the group an upward movement. This palette and these twisted bodies would directly inspire the Mannerist painters, Pontormo and Rosso Fiorentino."""
details = [
  "The twist of the Virgin, who turns round to take the Child.",
  "The young Saint John, behind the low wall, on the right.",
  "The nude young men in the background, seated on a stone wall.",
  "The shifting colours of the pink dress and Joseph’s orange mantle.",
]
themes = ["holy family", "body", "sculpture", "tondo", "nude"]
anecdote = """
According to Vasari, Agnolo Doni found the price of seventy ducats asked by Michelangelo too high. The painter then took the painting back and demanded double; the merchant, who was set on his tondo, ended up paying one hundred and forty ducats."""
salle = 4
mur = "est"
place = 1
largeur = 1.2

[[oeuvres]]
titre = "Madonna of the Goldfinch"
artiste = "Raphaël"
annee = "c. 1505–1506"
image = "vierge-chardonneret.jpg"
technique = "Oil on panel, 107 × 77 cm"
collection = "Uffizi Gallery, Florence"
note = "Painted in Florence for a friend’s wedding, shattered by a landslide in 1548, restored in 2008."
description = """
The Virgin is seated on a rock, in the middle of a meadow, an open book in her left hand. Dressed in a red robe and a blue mantle, she lowers her eyes gently towards the two children standing against her knees. On the left, the young Saint John the Baptist, dressed in an animal skin, a bowl at his belt, holds in his hands a goldfinch that he presents to the Christ Child. The latter, standing between his mother’s legs, his foot placed on hers, reaches out his hand to stroke the bird. Behind, a peaceful landscape stretches to the horizon: a bridge, a river, slender trees, a town and bluish mountains under a cloudy sky."""
evocation = """
Beneath the appearance of a tender, familiar scene, the painting foretells the Passion. The goldfinch, which according to tradition feeds on thistles and thorns, was the emblem of Christ’s crown of thorns; a legend also held that it received its red spot by pricking itself on Christ’s brow. The book held by Mary, that of the Scriptures, makes her the seat of Divine Wisdom. Raphael thus takes up a grave theme, but wraps it in a serene harmony: crossing glances, delicate gestures, a calmed nature. It is the very image of the ideal of beauty and balance with which his name remains associated."""
histoire = """
Vasari relates that Raphael, established in Florence, painted this picture for his friend Lorenzo Nasi, on the occasion of his wedding. In 1548, a landslide caused the Nasi house to collapse, and the panel broke into many pieces. It was immediately glued back together, but cracks and successive repaintings gradually disfigured it. Having entered the Medici collections, it is kept at the Uffizi. A restoration of nearly ten years, carried out by the Opificio delle Pietre Dure of Florence and completed in 2008, consolidated the wood and restored the painting’s original colours."""
facture = """
In Florence, the young Raphael studies Leonardo: he borrows from him the pyramidal composition, in which the three figures are inscribed in a stable triangle, and the softened modelling of the faces. But he keeps the clarity and limpidity of his master Perugino. The pure colours, red and blue, answer the green of the meadow. The light is even, the landscape brightens towards the horizon according to aerial perspective. Everything is governed by measure: the gestures flow into one another, the glances link the figures, and nothing disturbs the balance of the whole."""
details = [
  "The tiny goldfinch, in Saint John’s hands.",
  "The Child’s foot placed on his mother’s.",
  "Saint John’s bowl, hanging from his belt.",
  "The bridge and the town, in the landscape on the left and right.",
  "The fine fracture lines, still perceptible up close.",
]
themes = ["virgin and child", "childhood", "bird", "landscape", "harmony"]
anecdote = """
The restoration completed in 2008 took about ten years of work, far more than the time Raphael spent in Florence, from 1504 to 1508. Rid of its yellowed varnishes, the painting regained a sky and a mantle of intense blue."""
