[[artistes]]
nom = "Filippo Lippi"
vie = "Florence, c. 1406 – Spoleto, 1469"
biographie = """
An orphan, Filippo Lippi was entrusted as a child to the Carmelite convent of Santa Maria del Carmine in Florence, where he took his vows in 1421. There he saw Masaccio paint the frescoes of the Brancacci Chapel, which decided his vocation. A monk ill-suited to religious life, he obtained the protection of Cosimo de’ Medici, who gave him commissions and pulled him out of several scrapes. He painted altarpieces, Madonnas and Annunciations for the churches and families of Florence. In 1452, he settled in Prato to paint the frescoes of the cathedral choir, dedicated to Saint Stephen and Saint John the Baptist. There he abducted Lucrezia Buti, a young nun; from their union was born in 1457 Filippino Lippi, who would also become a great painter. The scandal was immense, but the Medici’s intervention spared him the worst. He trained the young Sandro Botticelli in his workshop. In 1467 he left for Spoleto, where he decorated the cathedral apse; he died there in 1469, and Lorenzo the Magnificent had a funerary monument raised to him."""
style = """
Lippi forms the link between the gravity of Masaccio and the grace of the second half of the century. He humanises sacred figures: his Madonnas are young Florentine women with elegant hairstyles, his angels mischievous children. His supple lines, transparent veils and open landscapes behind painted windows are recognisable at first glance. Through Botticelli, his pupil, and his son Filippino, his graceful manner deeply marked Florentine painting."""

[[artistes]]
nom = "Piero della Francesca"
vie = "Borgo San Sepolcro (Tuscany), c. 1415–1420 – Borgo San Sepolcro, 12 October 1492"
biographie = """
The son of a merchant of Borgo San Sepolcro, a small town in the upper Tiber valley, Piero della Francesca trained as a painter and studied mathematics. In 1439 he worked in Florence alongside Domenico Veneziano, and discovered the art of Masaccio, of Brunelleschi and perspective. He then pursued an itinerant career in the service of the courts of central Italy: Ferrara, Rimini with Sigismondo Malatesta, Rome, and above all Urbino, where Federico da Montefeltro welcomed him on several occasions. His great masterpiece is the fresco cycle of the Legend of the True Cross in the church of San Francesco in Arezzo, painted in the 1450s and 1460s. He also painted the Flagellation of Urbino, the Baptism of Christ in London and the Brera altarpiece, in which Federico appears kneeling. Always tied to his native town, where he held public office, he devoted his last years to writing learned treatises on arithmetic, perspective and geometric solids. He died in 1492, on the very day Christopher Columbus reached America."""
style = """
Piero builds his paintings like demonstrations: rigorous perspective, figures reduced to simple volumes, calculated proportions. A clear, calm light, without violent shadows, bathes his scenes in a solemn stillness. His figures, with impassive faces, seem outside time. Long forgotten, he was rediscovered in the 20th century, and modern painters, from Seurat to the Italian Metaphysical painters, admired his silent geometry."""

[[artistes]]
nom = "Andrea Mantegna"
vie = "Isola di Carturo (Veneto), c. 1431 – Mantua, 13 September 1506"
biographie = """
Born near Padua, Andrea Mantegna entered the workshop of the painter Francesco Squarcione at a very young age; Squarcione adopted him and trained him through his collection of antiquities. Padua, a university town where Giotto and Donatello had worked, was then a centre of humanism. Still an adolescent, Mantegna painted the frescoes of the Ovetari Chapel in the church of the Eremitani, almost entirely destroyed by a bombing raid in 1944. In 1453 he married Nicolosia, daughter of the Venetian painter Jacopo Bellini and sister of Giovanni Bellini, on whom he exerted a strong influence. In 1460 he became court painter to the Gonzaga in Mantua, a post he held until his death. There he painted the famous Camera degli Sposi in the ducal palace, completed in 1474, whose ceiling opens in trompe l’oeil onto the sky, then the great series of the Triumphs of Caesar, now at Hampton Court. A collector of antiquities and an innovative engraver, he also worked for Isabella d’Este, wife of Marquis Francesco II Gonzaga. He died in Mantua in 1506."""
style = """
Mantegna is the painter of stone and of Antiquity: his figures have the hardness of statues, his architecture and costumes are reconstructed with an archaeologist’s precision. He pushes perspective to the most daring viewpoints, ceilings seen from below and foreshortened bodies. His incisive drawing, cool colours and engravings, circulated throughout Europe, marked Bellini and Dürer."""

[[artistes]]
nom = "Sandro Botticelli"
vie = "Florence, c. 1445 – Florence, 17 May 1510"
biographie = """
Alessandro Filipepi, son of a Florentine tanner, owes his nickname of Botticelli, little barrel, to one of his elder brothers. After a probable apprenticeship with a goldsmith, he entered the workshop of Filippo Lippi in the early 1460s, then frequented that of Verrocchio. He opened his own workshop around 1470 and became the favourite painter of the Medici circle and the humanists around them. In 1481–1482, Pope Sixtus IV called him to Rome with other masters to paint the walls of the Sistine Chapel. Back in Florence, he painted his great mythological compositions, Spring and the Birth of Venus, and many Madonnas in tondo. In the 1490s, Florence was shaken by the sermons of the Dominican Savonarola; Botticelli’s painting became more austere and more tormented, as in the Calumny of Apelles or the Mystic Nativity. He also produced a series of drawings for Dante’s Divine Comedy. Out of fashion at the end of his life, he died in 1510. He would be truly rediscovered only in the 19th century."""
style = """
Botticelli is above all a draughtsman: line, supple and nervous, defines forms, animates the veils and the hair lifted by the wind. His figures, elongated and light, with melancholy faces, seem to float more than walk. He prefers decorative rhythm to perspective and poetry to plausibility. Forgotten for three centuries, he fascinated the Pre-Raphaelites and Art Nouveau, and his Venus has become a universal icon of beauty."""

[[artistes]]
nom = "Léonard de Vinci"
vie = "Vinci (Tuscany), 15 April 1452 – Amboise, 2 May 1519"
biographie = """
The illegitimate son of a notary, Leonardo grew up in Vinci, near Florence, then entered in the late 1460s the workshop of Andrea del Verrocchio, painter, sculptor and goldsmith. There he learned all the techniques and painted his first works, including the Annunciation. Around 1482 he left for Milan, in the service of Ludovico Sforza, as an engineer, organiser of festivities and painter: there he produced the Virgin of the Rocks and the Last Supper, at the convent of Santa Maria delle Grazie. After Ludovico’s fall, in 1499, he led an itinerant life between Venice, Florence, where he began the Mona Lisa, Milan and Rome. He filled thousands of pages of notebooks, written from right to left, on anatomy, the flight of birds, water, optics and machines. In 1516, King Francis I invited him to France and installed him at the Clos Lucé manor, near the château of Amboise, where he died in 1519. He left very few finished paintings, but a reputation as a universal genius."""
style = """
Leonardo wants to paint nature as the eye sees it. He invents sfumato, a blended modelling, without outlines, that wraps forms in a soft shadow, and aerial perspective, which blues and blurs distances. His pyramidal compositions, his figures caught in a movement of the soul and his misty landscapes were imitated by Raphael and by the whole following generation."""

[[artistes]]
nom = "Michel-Ange"
vie = "Caprese (Tuscany), 6 March 1475 – Rome, 18 February 1564"
biographie = """
Michelangelo Buonarroti, son of a Florentine magistrate, entered in 1488 the workshop of the painter Domenico Ghirlandaio, then frequented the Medici sculpture garden, where Lorenzo the Magnificent noticed him. In Rome, he sculpted the Pietà of Saint Peter’s, completed in 1499; in Florence, from 1501 to 1504, the David, symbol of the Republic. It was then that he painted for Agnolo Doni the only finished panel painting attributed to him without reservation. In 1508, Pope Julius II commissioned from him the ceiling of the Sistine Chapel, which he painted almost alone until 1512. He then worked on the tomb of Julius II, the Moses, the Medici funerary chapel at San Lorenzo. Back in Rome, he painted the Last Judgment on the altar wall of the Sistine, completed in 1541, then became architect of Saint Peter’s Basilica, whose dome he designed. A poet, he also wrote sonnets. He died in Rome at nearly eighty-nine; his body was brought back to Florence."""
style = """
Above all a sculptor, Michelangelo makes the human body, especially nude and male, the means of expressing every passion. His figures, powerful, twisted, often unfinished in sculpture, seem to struggle against the material. In painting, he lays vivid, shifting colours on sculptural forms. His terribilità, that grandiose and anxious force, opened the way to Mannerism and Baroque art."""

[[artistes]]
nom = "Raphaël"
vie = "Urbino, 1483 – Rome, 6 April 1520"
biographie = """
Raffaello Sanzio was the son of Giovanni Santi, painter and poet at the court of Urbino, who died when the boy was eleven. The young man then trained with Perugino, whose manner he assimilated so well that their works are sometimes confused. From 1504 to 1508, he lived mainly in Florence, where he discovered Leonardo and Michelangelo and painted a series of Madonnas, including the Madonna of the Goldfinch. In 1508, Pope Julius II called him to Rome to decorate his apartments in the Vatican: the Stanze, including the School of Athens, are among the summits of the Renaissance. Under Leo X, he directed a very large workshop, drew the cartoons for the Sistine tapestries, was named architect of Saint Peter’s and charged with surveying the monuments of ancient Rome. He also painted portraits, such as that of Baldassare Castiglione. He died suddenly at thirty-seven; he is buried in the Pantheon."""
style = """
Raphael made the synthesis of his time: Leonardo’s softness, Michelangelo’s strength, Perugino’s clarity. His perfectly balanced compositions, graceful figures and limpid colours embody the classical ideal. For more than three centuries, the academies of all Europe held him to be the absolute model of the great painter, before the Pre-Raphaelites rejected him."""

[[artistes]]
nom = "Giorgione"
vie = "Castelfranco Veneto, c. 1477–1478 – Venice, 1510"
biographie = """
Very little is known of Giorgio da Castelfranco, nicknamed Giorgione, big George. Born in a small town of the Venetian mainland, he probably trained in Venice in the circle of Giovanni Bellini. He worked mainly for a circle of cultured patricians, lovers of music, poetry and small-format paintings, with sometimes enigmatic subjects. A very small number of works are attributed to him with certainty: the Castelfranco altarpiece, the Tempest, the Three Philosophers in Vienna, the portrait of Laura. In 1508, with the young Titian, he painted the façade frescoes of the Fondaco dei Tedeschi, the warehouse of the German merchants in Venice, of which only fragments remain. He died of the plague in autumn 1510, at about thirty. Several of his unfinished paintings were completed by Titian, such as the Sleeping Venus in Dresden, so that the boundary between their two oeuvres remains debated."""
style = """
Giorgione transformed Venetian painting in a few years. He paints directly in oil, without preliminary drawing, and lets colour and light model forms. His dreamy figures merge into atmospheric landscapes, where emotion counts for more than the story told. His paintings of poetry, without obvious subject, opened the way to Titian and to modern landscape."""

[[artistes]]
nom = "Titien"
vie = "Pieve di Cadore (Veneto), c. 1488–1490 – Venice, 27 August 1576"
biographie = """
Tiziano Vecellio was born in the mountains of Cadore and arrived in Venice as a child. He trained with Giovanni Bellini, then worked alongside Giorgione, several of whose works he completed after his death in 1510. In 1518, the gigantic Assumption in the church of the Frari made him the leading painter of Venice. He then painted for the courts of Italy, the Este of Ferrara, the Gonzaga of Mantua, the della Rovere of Urbino, then for Emperor Charles V, who made him a Count Palatine in 1533 and a knight, and for his son Philip II of Spain, to whom he sent his great mythologies, the poesie. A sought-after portraitist of popes and princes, he directed an active workshop for more than sixty years. In his last years his painting became ever freer, almost formless, made of impasted touches sometimes laid with the finger. He died in Venice in 1576, during a plague epidemic; he is buried in the Frari."""
style = """
Titian is the master of colour. He builds his paintings in successive layers of oil, in transparent glazes and thick touches, and makes forms arise from light rather than from drawing. His golden nudes, penetrating portraits and sensual mythologies fixed the models of the genre for centuries. Rubens, Velázquez, Rembrandt, then Delacroix and Manet all measured themselves against him."""
