[[oeuvres]]
titre = "Armor of Henry II, King of France"
artiste = "Armuriers de la cour de France"
annee = "c. 1555"
image = "armure-henri-ii.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Armor_of_Henry_II,_King_of_France_(reigned_1547–59)_MET_DP256970.jpg"
technique = "Embossed steel, blued, gilded and silvered, leather, textile; height 188 cm, 24.2 kg"
collection = "Metropolitan Museum of Art, New York"
note = "A parade armor covered in gold and silver reliefs, made for the king who died of a lance blow in a tournament."
description = """
The armor stands upright, complete, from the crest of the helmet to the sabatons that cover the feet. The closed helmet, topped by a chased crest, leaves only a narrow slit for the eyes. The entire surface, from the breastplate to the greaves, is covered with relief decoration: scrolling foliage, figures and animals, in which gold and silver alternate with the dark steel ground. At the center of the breastplate, a warrior in the antique manner receives arms held out to him by two kneeling women. On the pauldrons, Apollo pursues the nymph Daphne and, elsewhere, triumphs over the serpent Python, which he has just slain. Articulated steel lames cover the arms, thighs and feet; a red leather belt and a crimson velvet skirt below the waist complete the presentation."""
evocation = """
Such an armor was not made for battle, where the reliefs would have caught blows instead of deflecting them: it is a parade armor, to be worn at solemn entries, reviews and court festivities. It turns the king into an ancient hero, like the Roman warrior on the breastplate, and places his reign under the sign of Apollo, god of light and of the arts. The crescent moon, Henry II's personal emblem, recurs in several places in the decoration; it has often been linked to Diane de Poitiers, the king's favorite, whose namesake goddess wears the crescent. Through its chased steel, the French court displays the Renaissance taste for Antiquity and mythology, and vies in magnificence with the Emperor Charles V."""
histoire = """
The armor was made around 1555 for Henry II (1519–1559), son of Francis I and king of France since 1547. Its decoration is based on designs by artists in the service of the court: the Metropolitan Museum attributes part of it to the painter Jean Cousin the Elder and perhaps to the illuminator Baptiste Pellerin; it was long credited to the goldsmith and engraver Étienne Delaune, whose very similar designs for armor survive. The metal was then embossed, chased, and gilded and silvered. The king loved jousting: on 30 June 1559, during a tournament held in Paris to celebrate the Peace of Cateau-Cambrésis and princely marriages, the broken lance of the captain of Montgomery pierced his visor; he died ten days later. The armor entered the Metropolitan Museum in 1939."""
facture = """
The decoration is worked in repoussé: the armorer hammers the steel plate from behind to make the figures stand out, then the chaser defines the outlines from the front. The relief remains shallow, so that the plates keep their strength and the joints move freely. The ground was blued, which darkens it, then the reliefs received gold and silver, which answer one another in the light like the colors of a painting. Drawings from the court, preserved at the Met and in other museums, show how a single design passed from paper to steel."""
details = [
  "The crescent moon, emblem of Henry II, slipped into several places in the decoration.",
  "At the center of the breastplate, the warrior in the antique manner and the two kneeling women.",
  "The pauldrons, where Apollo pursues the nymph Daphne.",
  "The chased crest of the helmet and the narrow slit of the visor.",
  "The articulated lames of the sabatons, which follow the shape of the foot.",
]
themes = ["Renaissance", "parade", "mythology", "king", "goldsmithing"]
anecdote = """
Henry II died in a tournament accident, not in war. His widow, Catherine de' Medici, afterwards had the Hôtel des Tournelles, the palace near which the joust had taken place, demolished; the Place des Vosges now occupies part of its site."""
salle = 1
mur = "nord"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Armor of George Clifford, Earl of Cumberland"
artiste = "Ateliers royaux de Greenwich"
annee = "1586"
image = "armure-clifford.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Armor_Garniture_of_George_Clifford_(1558–1605),_Third_Earl_of_Cumberland_MET_DT259974.jpg"
technique = "Etched and gilded steel, leather, textile; height 176.5 cm, 27.2 kg"
collection = "Metropolitan Museum of Art, New York"
note = "The best-preserved garniture from the royal workshops at Greenwich, made for the champion of Queen Elizabeth I."
description = """
The armor is mounted upright on a wooden stand. The steel, almost black, is crossed by broad gilded bands that run from neck to feet, like the braid on a garment. Within these bands a ribbon interlaces in regular knots around roses, fleurs-de-lis and a cipher formed of two back-to-back Es. The rounded breastplate descends to a point over the belly, following the fashion of the doublets of the period, known as "peascod". The closed helmet, pierced with breathing holes, has a projecting visor shaped like a beak. Below the waist protrudes the red fabric of the costume worn beneath. Articulated gauntlets, cuisses, poleyns and sabatons complete the ensemble, whose slender silhouette is that of a courtier as much as of a warrior."""
evocation = """
The decoration is a declaration of loyalty. The roses are those of the Tudors, the fleurs-de-lis recall the English kings' claim to the throne of France, and the two back-to-back Es form the cipher of Elizabeth I. To wear this armor was to present oneself as the queen's servant and knight. It also speaks of the culture of the tournament at the Elizabethan court: every year, on 17 November, the anniversary of her accession, the queen attended jousts in which courtiers vied in devices, costumes and compliments. In this chivalric theater, at a time when firearms already dominated the battlefield, armor was a stage costume as much as a protection."""
histoire = """
Around 1515, Henry VIII set up in his palace at Greenwich, near London, a workshop of armorers who had come from Germany, to rival the workshops of Milan and Augsburg. In 1586, under the direction of the master armorer Jacob Halder, the workshop made for George Clifford (1558–1605), third Earl of Cumberland, a garniture: an armor completed by extra pieces that allowed it to be adapted to war or to the different events of the tournament. A sailor and privateer, Clifford led several expeditions against Spain and in 1590 became the queen's champion at the jousts. The design for his armor appears in a late 16th-century album devoted to the Greenwich armors, now in the Victoria and Albert Museum. The Metropolitan Museum acquired it in 1932."""
facture = """
Greenwich armors are recognizable by their ample, clean forms and their engraved rather than embossed decoration. The ornamental bands were etched: the steel is protected with a varnish, the design is traced in it with a point, then an acid bites the exposed lines; gold is then applied to these bands. The contrast between dark steel and gold gives the armor the look of an embroidered garment. The extra pieces, largely preserved, were attached to the armor by rivets, straps and hooks."""
details = [
  "The two back-to-back Es, cipher of Queen Elizabeth I, caught in the gilded interlace.",
  "The Tudor roses and the fleurs-de-lis that alternate along the bands.",
  "The pointed breastplate, in the fashion of Elizabethan doublets.",
  "The breathing holes pierced in the visor of the helmet.",
  "The red fabric that protrudes below the waist, between the plates.",
]
themes = ["tournament", "Elizabethan", "England", "chivalry", "engraving"]
anecdote = """
A miniature by Nicholas Hilliard shows George Clifford as the queen's champion, dressed in a similar armor: pinned to his hat he wears a glove, a token said to have been given to him by Elizabeth I."""
salle = 1
mur = "nord"
place = 5
largeur = 1.4

[[oeuvres]]
titre = "Corinthian-Type Helmet"
artiste = "Grèce archaïque"
annee = "c. 650–600 BC"
image = "casque-corinthien.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Bronze_helmet_of_Corinthian_type_MET_DP119913.jpg"
technique = "Hammered bronze, 23 × 26.8 × 21.2 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The helmet of the Greek hoplites, beaten from a single sheet of bronze: it covers the whole head and lets only the eyes and mouth show."
description = """
The helmet, twenty-three centimeters high and seen here in three-quarter view, has the shape of a bronze bell that encloses the skull, the cheeks and the nape. Its surface, covered with a green patina flecked with brown, keeps the gleam of the metal in places. On the front, two large openings for the eyes are separated by a nasal, a narrow strip that protects the nose. The cheek pieces descend to the chin and leave between them a vertical slit for the mouth. At the back, the edge flares slightly to clear the nape. A row of small holes runs along the edges: they were used to sew on a lining of leather or felt, which made the helmet bearable and cushioned blows."""
evocation = """
The Corinthian helmet is the very image of the Greek warrior. It covers the face with an impassive metal mask that makes the fighter anonymous and frightening. But it also isolates: one hears poorly in it and sees little at the sides, which suits the hoplite, a foot soldier who fought shoulder to shoulder in the phalanx, his round shield partly protecting his neighbor. The citizen-soldier paid for his own equipment: such a helmet marks a man of some means. Vase painters and sculptors made it the attribute of heroes and of Athena, often shown with the helmet pushed up on the forehead, the face uncovered, as if one could see the warrior at rest behind the mask."""
histoire = """
The type appeared around 700 BC, probably in the region of Corinth, hence its name, already used by the historian Herodotus in the 5th century BC. This helmet, dated to the second half of the 7th century, belongs to the first generations of the model, which would later evolve toward more rounded forms. For two centuries it equipped the hoplites of many Greek cities. After a battle, the victors often dedicated the arms taken from the enemy in the great sanctuaries: hundreds of helmets have thus been found at Olympia. This one entered the Metropolitan Museum in 1920, acquired through the Rogers Fund, named for a donor who had bequeathed to the museum a fortune intended for purchases."""
facture = """
The helmet was hammered from a single plate of bronze, an alloy of copper and tin, without any joins: a tour de force, for the metal has to be drawn out over the crown while being left thicker at the edges, without ever splitting it. The armorer worked over a form, regularly reheating the metal to keep it from becoming brittle. The edges were then pierced for the lining. Originally, the polished bronze was the color of gold; the green patina is the result of corrosion over the centuries."""
details = [
  "The nasal, a narrow strip of metal between the two eyes.",
  "The vertical slit between the cheek pieces, at the level of the mouth.",
  "The row of small holes along the edges, for sewing on the lining.",
  "The slightly flared back edge, which clears the nape.",
  "The brown spots where the bronze shows through the green patina.",
]
themes = ["Greece", "hoplite", "bronze", "antiquity", "helmet"]
anecdote = """
Greek sculptors often portrayed generals wearing a Corinthian helmet pushed up on the forehead. This is how Pericles appears in the Roman copies of his portrait by Kresilas, preserved notably in the British Museum and the Vatican."""
salle = 2
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Sutton Hoo Helmet"
artiste = "Royaume d'Est-Anglie"
annee = "early 7th century"
image = "casque-sutton-hoo.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Sutton_Hoo_helmet_2016.png"
technique = "Iron, tinned bronze, gilt bronze, silver, garnets; height 31.8 cm"
collection = "British Museum, London"
note = "Found crushed into hundreds of fragments in a ship burial, the helmet of an Anglo-Saxon king, reconstructed in 1970–1971."
description = """
The helmet, seen from the front against a black background, encloses the whole head. A metal mask covers the face: one can make out eyebrows, a nose, a mouth and a moustache in relief, around two empty eye sockets. The eyebrows, inlaid with silver wire and small garnets, end at the temples in gilded boar heads. A metal crest runs across the top of the skull, from forehead to nape, and each of its ends bears a dragon's head. On the cap and on the broad cheek pieces, bronze plates, now browned and incomplete, bore stamped scenes. Between the original fragments, the missing parts have been filled in to restore the helmet's complete form."""
evocation = """
The metal face gives its wearer an almost supernatural presence. The nose, moustache and eyebrows together form a bird or a dragon in flight, wings spread, whose head joins that of the crest: a protective animal set upon the face. Boars were, in the Germanic world, symbols of strength and warlike protection; the poem Beowulf, moreover, mentions helmets adorned with boars. The stamped scenes, dancing warriors and a horseman overthrowing an enemy, link the helmet to a world of heroes, and perhaps of gods. The helmets found in the graves of Vendel and Valsgärde, in Sweden, show very similar decoration and attest to the ties between the two shores of the North Sea."""
histoire = """
In 1939, at Sutton Hoo in Suffolk, the archaeologist Basil Brown excavated the largest of the burial mounds for the owner of the estate, Edith Pretty. He uncovered the imprint of a ship about twenty-seven meters long, whose timber had vanished, and a burial chamber filled with precious objects. It is most often seen as the grave of Rædwald, king of East Anglia who died around 624, though without certainty. The helmet, rusted and crushed by the collapse of the chamber, was reduced to several hundred fragments. Edith Pretty gave the whole treasure to the British Museum. A first reconstruction, carried out in 1945–1946, was entirely redone in 1970–1971 by Nigel Williams: it is the one we see today."""
facture = """
The iron cap was covered with plates of tinned bronze, hence silvery in appearance, stamped with dies: the thin sheet was pressed over a relief to imprint a scene, repeated several times. Strips of gilt bronze separated these panels. The eyebrows inlaid with silver wire, the set garnets and the gilded boar heads attest to a goldsmith's skill, the same that produced the gold-and-garnet buckles and clasps found in the same grave. The 1970–1971 reconstruction replaced each fragment according to the stamped motifs and the traces of corrosion."""
details = [
  "The small gilded boar heads at the ends of the eyebrows.",
  "The silver wire inlaid in the eyebrows, beside the garnets.",
  "The moustache and mouth in relief, beneath the nose of the mask.",
  "The dragon's head at the end of the crest, above the forehead.",
  "The browned fragments of the stamped plates, on the cap.",
]
themes = ["Anglo-Saxon", "tomb", "archaeology", "king", "early Middle Ages"]
anecdote = """
The garnets of one of the two eyebrows have no gold foil behind them, so that this eye shines less brightly than the other. Archaeologists have seen in this an allusion to Odin, the one-eyed god of the Germanic peoples; the hypothesis remains debated."""
salle = 2
mur = "ouest"
place = 2
largeur = 0.85

[[oeuvres]]
titre = "Ō-yoroi Armor, Known as Ashikaga Takauji's"
artiste = "Japon, époque de Kamakura"
annee = "early 14th century"
image = "o-yoroi.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Armor_(Yoroi)_MET_DT784.jpg"
technique = "Iron, lacquer, leather, silk, gilt copper; height 95.3 cm, 11.8 kg"
collection = "Metropolitan Museum of Art, New York"
note = "The great armor of the mounted archers of medieval Japan, which tradition attributes to the founder of the Ashikaga shogunate."
description = """
The armor is displayed on a stand, without a figure. At the top, the helmet, an iron cap of riveted plates, bears two large gilt-copper horns in the shape of a V, the kuwagata, and a broad, flared neck guard made of rows of lamellae, whose edges turn back on either side of the face. Below, the cuirass forms a kind of box: its front is covered with a leather stamped with patterns, in which a figure can be made out. Plates covered with the same leather protect the upper chest. The lower part of the armor is a skirt in several panels, made of rows of small lacquered lamellae, bound together by silk cords whose colors, cream, brown, orange and green, have faded with time."""
evocation = """
The ō-yoroi, the "great armor", was that of high-ranking warriors who fought on horseback, bow in hand, in the 12th, 13th and 14th centuries. Its box-like form, its large plates and its smooth leather on the chest answer the needs of this kind of combat: the bowstring had to slide without catching. But it is also a sign of rank, through its cost and the richness of its lacing, whose colors could distinguish a warrior on the battlefield. The great horns of the helmet were an insignia, not a defense. Through this type of armor, Japan fixed the image of the samurai of epic tales such as the Tale of the Heike, in which warriors name themselves before fighting."""
histoire = """
According to a tradition reported by the Metropolitan Museum, this armor belonged to Ashikaga Takauji (1305–1358), who helped overthrow the Kamakura shogunate in 1333 and then founded the Ashikaga shogunate, and he is said to have offered it to the Shinomura Hachimangū shrine, near Kyoto. No document confirms this, and little is known of its history before its acquisition by Bashford Dean, first curator of arms and armor at the Metropolitan Museum, who gave it to the museum in 1914. It is among the few Japanese armors of this period preserved outside Japan, and in 1989 the museum devoted a study to it in its scholarly journal."""
facture = """
A Japanese armor of this type is not made of large forged plates, as in Europe, but of hundreds of small lamellae of iron and hardened leather, pierced with holes, lacquered to resist moisture, then assembled in rows by silk lacing, the odoshi. The whole is flexible and relatively light, but slow to make and to maintain. The leather on the chest was decorated with a stencil. The helmet, made of plates riveted in rays, is the work of a specialized smith, and the gilt-copper ornaments that of chasers."""
details = [
  "The two gilded V-shaped horns of the helmet, the kuwagata.",
  "The broad neck guard of lamellae, turned back on either side of the face.",
  "The stamped leather of the cuirass, in which a figure appears.",
  "The rows of lacquered lamellae of the skirt, held by silk cords.",
  "The faded colors of the lacing, from cream to green.",
]
themes = ["Japan", "samurai", "lacquer", "silk", "horseman"]
anecdote = """
Bashford Dean, who brought this armor into the Met, was originally a specialist in fishes, a professor of zoology at Columbia University. He was at once curator of reptiles and fishes at the American Museum of Natural History and curator of armor at the Met."""
salle = 3
mur = "est"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Pair of Swords (Daishō)"
artiste = "Japon, époque d'Edo"
annee = "katana blade dated 1440; mounts late 18th century"
image = "daisho.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Blades_and_Mountings_for_a_Pair_of_Swords_(Daishō)_MET_DT306021.jpg"
technique = "Steel, lacquered wood, ray skin, silk, copper alloys, gold; katana 86.7 cm, wakizashi 66 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The long and short swords that every samurai wore at the belt: 15th-century blades in 18th-century mounts."
description = """
The two swords lie horizontally, one above the other, sheathed in their scabbards. At the top, the katana, the long sword, eighty-seven centimeters in length; below, the wakizashi, shorter. The black lacquered scabbards are smooth and glossy, slightly curved like the blades they protect; each has, near its mouth, a small pierced projection through which passed the cord that fastened it to the belt. On the right, a round, flat guard, the tsuba, separates the scabbard from the hilt. The hilts are bound in a beige silk braid crossed in diamonds, which lets the ray skin show through. Everything is sober, matching, almost austere: only the small metal fittings reveal the luxury of the whole."""
evocation = """
In the Edo period (1603–1868), the pair of swords was both the weapon and the badge of the samurai, the only class permitted to wear it. The daishō, literally "the long and the short", was slipped into the belt, cutting edge upward. It was worn not only for fighting: in a Japan at peace for more than two centuries, it declared the warrior's rank, dignity and discipline. The perfect harmony of the two mounts, made together, is its expression. According to an oft-cited saying, the sword is the soul of the samurai: old blades were handed down and venerated from generation to generation, as here, where 15th-century blades were refitted three centuries later."""
histoire = """
The katana blade bears a date corresponding to 1440, in the middle of the Muromachi period; the wakizashi blade was likewise forged in the 15th century. At the end of the 18th century, an owner had them remounted together in new, matching fittings: this was the custom, the old blades remaining precious while the mounts followed fashion. The metal ornaments are attributed to Iwamoto Konkan, a chaser of the Iwamoto school in Edo. In 1876, an edict of the Meiji government banned the wearing of swords in public and put an end to this tradition. The pair belonged to the New York collector Howard Mansfield, who gave it to the Metropolitan Museum in 1936 together with his collection of Japanese objects."""
facture = """
A Japanese blade is forged by folding the steel over on itself several times, then combining a hard steel for the edge with a softer steel for the core. Before quenching, the smith coats the blade with clay, thinner near the edge: the edge cools faster and becomes very hard, while the back remains supple. The boundary between the two draws on the blade a wavy line, the hamon. The mounts are the work of other craftsmen: lacquerers for the scabbards, chasers for the guard and the small fittings in copper alloys, such as shibuichi, a mixture of copper and silver."""
details = [
  "The tsuba, a round, flat guard between the hilt and the scabbard.",
  "The silk braid crossed in diamonds that binds the hilts.",
  "The small pierced projection on each scabbard, for the belt cord.",
  "The longer curve of the long sword, at the top.",
  "The black lacquer of the scabbards, polished like a mirror.",
]
themes = ["Japan", "samurai", "sword", "lacquer", "Edo"]
anecdote = """
In Japan, a smith signs and dates his blade on the tang, the part hidden inside the hilt. To read the signature of a sword, one must therefore remove the hilt, which is held by a simple bamboo peg, the mekugi."""
salle = 3
mur = "nord"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Pavise with the Emblems of Burgundy"
artiste = "Pays-Bas bourguignons"
annee = "c. 1474–1475"
image = "pavois-bourguignon.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Standschild_(pavese)_met_Andreaskruis_Bourgondisch_schild_met_Andreas-kruis,_NG-KOG-2517-C.jpg"
technique = "Lime wood, linen canvas, deer leather, iron, paint; 105 × 60.4 cm"
collection = "Rijksmuseum, Amsterdam (on loan from the Koninklijk Oudheidkundig Genootschap)"
note = "A large infantryman's shield painted with the cross of Saint Andrew and the fire steels, emblems of the dukes of Burgundy."
description = """
The shield, one meter high, is a long, curved panel, rounded at the top and narrowing toward the bottom, where it ended in a point now broken. A vertical ridge divides it into two halves: the left is painted white, the right dark blue. Over it, a great red X-shaped cross, the cross of Saint Andrew, fills the whole surface. Between its arms, four yellow B-shaped motifs represent fire steels, the pieces of steel that were struck against a flint to make fire, and four small white and black stones stand for flints. All around, small red flames burst forth. The paint is cracked and flaking in places, and the upper right edge is chipped."""
evocation = """
The pavise speaks the heraldic language of the house of Burgundy. The cross of Saint Andrew, patron of the dukes, was their rallying sign; it would later pass into the Spanish flags under the name of the Burgundian cross. The fire steel striking the flint from which sparks fly was the emblem of Philip the Good, and it still forms the collar of the Order of the Golden Fleece. Painted on the shield of an archer or crossbowman, this decoration made each soldier a bearer of his prince's signs, recognizable from afar. It speaks of the ambition of Charles the Bold, who dreamed of making his territories a kingdom and wanted an army to match."""
histoire = """
The pavise served the infantry, in particular the crossbowmen: planted in the ground by means of an iron spike, it formed a shelter behind which one reloaded one's weapon. According to the Rijksmuseum, this shield was probably captured by the people of Cologne from the troops of Charles the Bold, Duke of Burgundy, when he sought to reinstate Archbishop Robert of the Palatinate, driven from his archbishopric. In this war the duke besieged the city of Neuss for nearly a year, in 1474–1475, without managing to take it. The shield belongs to the Koninklijk Oudheidkundig Genootschap, a learned society of Amsterdam, which placed it on loan at the Rijksmuseum in 1974."""
facture = """
The body of the shield is made of lime wood, light, shaped and curved. It was covered with linen canvas, then with glued deer leather, before being painted. This layered construction made the shield more resistant to blows and kept the wood from splitting. On the back, left unpainted, four attachment points received leather straps, and a network of nails probably held a small cushion. The decoration is painted quickly, in broad flat areas and bold colors, like a sign: it had to be read from afar, on the battlefield."""
details = [
  "The red X-shaped cross, running from one corner to the other.",
  "The yellow B-shaped fire steels, emblem of Philip the Good.",
  "The small white and black flints, from which the sparks fly.",
  "The red flames scattered over the whole ground.",
  "The broken point, at the bottom, above which two holes received an iron spike.",
]
