[[oeuvres]]
titre = "Turban Helmet"
artiste = "Empire ottoman"
annee = "late 15th – 16th century"
image = "casque-turban.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Turban_Helmet_MET_DP147136.jpg"
technique = "Steel, iron, silver, gold; height 30.2 cm, diameter 22.9 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A bulbous helmet with spiral fluting that imitates the folds of a turban; Arabic inscriptions run along its gilded bands."
description = """
The helmet, thirty centimeters high, has the shape of a bulb topped by a tall spike. Its central part, in dark steel, is hollowed with flutes that spiral around, like the folds of a wound cloth. Two gilded bands frame it, at the top around the spike and at the bottom above the edge. They bear large Arabic letters inlaid with silver, which stand out against a finely engraved gold ground. The lower edge is cut with two rounded notches for the eyes, on either side of a vertical support intended for a nasal. Small rings along the edge held a mail aventail that protected the neck. Two leaf-shaped gilded motifs adorn the fluted part."""
evocation = """
The name "turban helmet", given by modern historians, comes from its great size and its flutes, which imitate the folds of a turban; it has been thought that it was worn over a thick cap or a turban. The warrior thus displays, even on his armor, the headdress of civil life and the written word. The inscriptions, in Arabic, combine, depending on the helmet, formulas of blessing, verses from the Quran and the titles of the sovereign. They place the fighter under divine protection and make of the warlike object a vehicle for calligraphy, where writing becomes ornament and talisman."""
histoire = """
Turban helmets appeared in the late 15th century among the Turkmen who then dominated Iran and eastern Anatolia, and the Ottomans adopted the form. The Met attributes this one to a Turkish workshop, perhaps in Istanbul, working in the manner of Turkmen armorers. Many of these helmets were kept for centuries in the Ottoman arsenal housed in the former Byzantine church of Hagia Irene in Istanbul, where weapons made on the spot and booty taken in the conquests in Iran and the Caucasus accumulated. In the 19th century, some of these arms left the arsenal and reached the European market. This helmet entered the Metropolitan Museum in 1904."""
facture = """
Like most turban helmets, it was shaped with a hammer from a single piece of steel, to obtain the bulb and the spiral flutes: difficult work, which requires raising and hollowing the metal in alternation. The decoration combines two techniques: gilding, on the bands and the leaf motifs, and silver inlay, which consists of cutting into the metal to hammer in a silver wire or sheet. The letters, broad and slender, are drawn in a monumental style made to be read at a distance."""
details = [
  "The spiral flutes, which imitate the folds of a turban.",
  "The Arabic letters inlaid with silver on the lower gilded band.",
  "The two rounded notches for the eyes.",
  "The vertical nasal support, at the center of the forehead.",
  "The small rings along the edge, which held the mail aventail.",
]
themes = ["Ottoman", "calligraphy", "turban", "steel", "Islam"]
anecdote = """
The church of Hagia Irene in Istanbul, built under the emperor Justinian in the 6th century, was never converted into a mosque. After the Ottoman conquest of 1453 it served as an arsenal, then as a museum of arms; concerts are held there today."""
