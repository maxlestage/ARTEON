[[oeuvres]]
titre = "Sabre (Shamshir) and Scabbard"
artiste = "Inde du Nord, Lucknow"
annee = "blade 18th century; hilt and scabbard dated 1819"
image = "shamshir-lucknow.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Saber_(Shamshir)_with_Scabbard_MET_DP164593.jpg"
technique = "Steel, silver, enamel, ivory, gold, glass; length with scabbard 98.4 cm"
collection = "Metropolitan Museum of Art, New York"
note = "An 18th-century blade in a mount of ivory and enameled silver, probably made at Lucknow in 1819."
description = """
The sabre and its scabbard are displayed side by side, upright. On the left, the blade, long and strongly curved, ends in a tapering point; on the gray steel one can make out fine undulations and, near the guard, a small stamped mark. The ivory hilt, curved, ends in an animal head enameled in blue, with red eyes; the cross guard, in chased silver, likewise ends in two small enameled heads, and a gilded ring set with an oval cartouche makes the junction. On the right, the scabbard is entirely covered with enameled silver: blue or black medallions, in which birds stand out, alternate with green, red and yellow flowers. Two rings served to suspend it; the bottom is in openwork silver."""
evocation = """
The shamshir, whose name means sword or sabre in Persian, originated in Iran: its narrow, strongly curved blade is made for slicing with a drawing motion, on horseback. Adopted throughout the Indo-Persian world, it became a ceremonial weapon as much as a fighting one. This one brings together two eras: an old blade, admired for the quality of its steel, and a new mount that follows court fashion. The birds on the scabbard, ducks, waders, birds in flight, evoke the gardens and pools dear to Persian and Mughal culture, and lend the weapon an unexpected gentleness. At Lucknow, in the early 19th century, such a sabre spoke of its owner's wealth and refinement more than of his valor."""
histoire = """
The blade was forged in the 18th century, probably in India. In 1819 it received a new hilt and scabbard, which the Met attributes to an Indian workshop, probably at Lucknow, capital of the kingdom of Awadh. This was the time when the ruler of Awadh, Ghazi-ud-Din Haidar, took the title of king, and when the court multiplied its prestige commissions. The sabre later joined the collection of George Cameron Stone (1859–1935), an American engineer who had assembled thousands of arms from every continent and published in 1934 a glossary of arms and armor that is still consulted. He bequeathed his collection to the Metropolitan Museum at his death in 1935."""
facture = """
The undulations of the blade are those of a crucible steel, which Europeans called Damascus steel: melted into small ingots then forged at low temperature, it retains a structure that, once the blade is polished and etched with acid, draws a pattern of waves. The mount combines carved ivory with silver, engraved and then covered with champlevé enamel: the goldsmith hollows small cells in the metal, fills them with colored glass powder, then fires the object to melt it. The transparent blues and greens let the silver beneath shine through."""
details = [
  "The animal head enameled in blue, with red eyes, at the end of the hilt.",
  "The two small enameled heads that terminate the guard.",
  "The white birds in the blue and black medallions of the scabbard.",
  "The two suspension rings, on the side of the scabbard.",
  "The fine undulations of the steel, visible on the blade.",
]
themes = ["India", "Lucknow", "enamel", "sabre", "ivory"]
anecdote = """
George Cameron Stone collected arms of every era and every country. His illustrated glossary of arms and armor, published in 1934, a year before his death, remains a reference work for curators and collectors."""
