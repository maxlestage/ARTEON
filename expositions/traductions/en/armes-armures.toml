[exposition]
ordre = 45
nom_court = "Arms and Armor"
mouvement = "Arms and Armor"
cadre = "vitrine"
couleur = "#6a3b22"
titre = "Arms and Armor, the Art of War"
artiste = "Greenwich, Paris, Burgundy, Japan, Ottoman Empire, India…"
dates = "7th century BC – 1819"
accroche = "Virtual exhibition · Metropolitan Museum of Art, New York"
introduction = """
An armor, a helmet, a sabre are instruments of war, but they are also the work of goldsmiths, chasers, lacquerers and painters, made to protect, to impress and to proclaim the rank of the person who wears them. The visit brings together ten objects, from the helmet of a Greek hoplite to the ivory pistols of Catherine II, by way of the Anglo-Saxon king of Sutton Hoo, the samurai, the dukes of Burgundy, the kings of France and England, the Ottomans and India. The building draws on the arms and armor galleries of the Metropolitan Museum of Art in New York: a great, high court in which two royal armors stand, from which four galleries open. The objects are displayed in showcases."""
vitrine = "armure-henri-ii.jpg"

[musee]
nom = "Metropolitan Museum of Art"
ville = "New York, United States"
construction = "Founded in 1870; established on Fifth Avenue in 1880"
presentation = """
Founded in 1870 by a group of New York citizens who wanted to give their city a great art museum, the Metropolitan Museum of Art moved in 1880 into a brick building designed by Calvert Vaux and Jacob Wrey Mould, on the edge of Central Park. Continually enlarged, it received in 1902 its great Beaux-Arts façade on Fifth Avenue, designed by Richard Morris Hunt. Arms and armor have had a department of their own there since 1912, under the direction of Bashford Dean, a zoologist with a passion for Japanese armor. The collection was enriched by the purchase of the Duke of Dino's collection in 1904, then by the bequest of the engineer George Cameron Stone in 1935, rich in arms from Asia and the Islamic world. On the ground floor, a great court assembles European equestrian armors, riders and horses clad in steel; around it, galleries are devoted to Europe, Japan, the Islamic world and firearms."""
ici = """
ARTEON's building takes up the idea of the Met's court, from which the galleries radiate. One enters from the south into "The Court of Armors", twenty meters wide and eleven meters high, with stone-colored walls, where two royal armors, French and English, face each other. To the west opens "Heroes' Helmets", devoted to Greece and the king of Sutton Hoo; to the east, "Samurai Japan". To the north, "The Shield and the Pistol" brings together a Burgundian pavise and the pistols of Catherine II, then leads to the last room, "From Istanbul to Lucknow"."""

