[[artistes]]
nom = "Armuriers de la cour de France"
vie = "Paris, mid-16th century"
biographie = """
Under Francis I and Henry II, the French court wanted to rival Italy and the Emperor Charles V even in armor. The kings employed armorers based in Paris, sometimes from Italy or Germany, and associated them with the artists of the court. The decoration of parade armor was then born on paper: goldsmiths, engravers and painters drew complete designs, breastplate, pauldrons, helmet, shield, which the armorers and chasers then translated into steel. Among these designers, one may cite the goldsmith and engraver Étienne Delaune (1518 or 1519 – 1583), who worked for the Royal Mint, the painter Jean Cousin the Elder and the illuminator Baptiste Pellerin. Several armors and shields from this group have come down to us and are preserved in the Louvre, the Musée de l'Armée, Vienna or New York; their preparatory drawings, scattered among several museums in Europe and America, make it possible to follow the passage from design to object. The Wars of Religion, from 1562, slowed this sumptuous production without entirely halting it."""
style = """
The armors of the French court are recognizable by their all-over decoration in low relief, in which mythological figures, trophies, scrolls and grotesques mingle, in the spirit of the School of Fontainebleau. Gold, silver and blued steel play together like the colors of a painting. These armors make steel a support for images, on a par with enamel or tapestry, and were admired and imitated throughout Europe."""

[[artistes]]
nom = "Ateliers royaux de Greenwich"
vie = "Greenwich, near London, c. 1515 – mid-17th century"
biographie = """
The young Henry VIII, crowned in 1509, wanted armor worthy of the greatest princes, which was then supplied by the workshops of Milan, Augsburg or Nuremberg. Around 1515 he set up in his palace at Greenwich, on the Thames, a workshop of armorers who had come from Germany, known as the "Almains". The workshop worked first for the king himself, then, under Elizabeth I, for the great lords of the court, who obtained permission to order from it. The master armorer Jacob Halder directed it at the end of the 16th century; an album of drawings made at that time, preserved in the Victoria and Albert Museum, shows some thirty garnitures commissioned by courtiers. The workshop declined in the 17th century, when armor lost its usefulness on the battlefield, and disappeared with the English Civil War. Its armors are now preserved notably in the Royal Armouries, in London and Leeds, in the Royal Collection and in the Metropolitan Museum."""
style = """
Greenwich armors combine ample, clean forms, inherited from German models, with etched and gilded decoration arranged in bands on steel often blued or blackened. They were often delivered as garnitures, with extra pieces for war and for the different events of the tournament. Their sober elegance has made them the symbol of Elizabethan chivalry."""

[[artistes]]
nom = "Pays-Bas bourguignons"
vie = "States of the dukes of Burgundy, from Dijon to Bruges, 1363–1477"
biographie = """
In 1363, King John II the Good gave the duchy of Burgundy to his son Philip the Bold. Through marriages, inheritances and conquests, his descendants, John the Fearless, Philip the Good and Charles the Bold, assembled an immense whole: Burgundy and Franche-Comté, but above all the rich provinces of the Low Countries, Flanders, Artois, Brabant, Holland. Their court, most often at Brussels, Bruges or Lille, was one of the most brilliant in Europe: Jan van Eyck, Rogier van der Weyden, the tapestry weavers of Arras and Tournai, goldsmiths and illuminators were all to be found there. In 1430, Philip the Good founded the Order of the Golden Fleece. His son Charles the Bold, duke in 1467, sought to link his territories and to obtain a royal crown; he came up against the Rhenish cities, the Swiss and King Louis XI. Defeated at Grandson and Morat in 1476, he was killed before Nancy on 5 January 1477. The Low Countries then passed to the Habsburgs through the marriage of his daughter Mary to Maximilian of Austria."""
style = """
Burgundian art combines luxury and emblems. The dukes multiplied signs of recognition, cross of Saint Andrew, fire steels and sparks, devices and livery colors, painted on standards, tents, the clothing of their retainers and the arms of their soldiers. The same taste for splendor and precision animates the painting of the Flemish Primitives, and the tapestry and goldsmithing of their court."""

[[artistes]]
nom = "Russie, armuriers de la cour impériale"
vie = "Saint Petersburg and Tula, 18th century"
biographie = """
At the beginning of the 18th century, Peter the Great gave Russia a modern arms industry, centered on the Tula arms factory, founded in 1712, and that of Sestroretsk, near Saint Petersburg. Besides muskets for the army, these workshops and those of the capital produced luxury arms for the court: hunting guns and pistols, presentation arms, matching garnitures. Some armorers came from Germany or other European countries, and all worked in the taste of the European courts, rocaille and then neoclassical. Johan Adolph Grecke, maker of the pistols exhibited here, was one of these craftsmen: armorer to the court at Saint Petersburg, he is known from works and documents of 1755 to 1790. Under Catherine II, empress from 1762 to 1796, these arms were used for court hunts and above all as gifts: they were given to sovereigns, ambassadors and favorites. The Hermitage Museum and the Kremlin Armory today preserve important groups of them."""
style = """
Russian luxury arms of the 18th century rival those of Paris and London in the quality of their mechanisms, but are distinguished by the richness of their materials: ivory, blued and gilded steel, mother-of-pearl, gold and silver chasing. They take up the forms and ornaments in fashion in Europe, rocaille and then antique motifs, with a marked taste for splendor."""

[[artistes]]
nom = "Grèce archaïque"
vie = "Greek world, c. 800–480 BC"
biographie = """
The Archaic period is the name given to the three centuries preceding the Persian Wars. The Greeks, divided among hundreds of independent cities, founded colonies all around the Mediterranean and the Black Sea, adopted the alphabet and saw the birth of the poems of Homer and Hesiod. In the cities a new way of fighting appeared: the phalanx of hoplites, heavily armed foot soldiers drawn up in close lines, each protected by a large round shield, a cuirass, greaves and a bronze helmet. These soldiers were citizens prosperous enough to pay for their equipment, and their military role went hand in hand with their place in the life of the city. Corinth, a trading city on the isthmus that links the Peloponnese to the rest of Greece, was then one of the great centers of art and craftsmanship, renowned for its painted vases and its bronzes. The great sanctuaries, Olympia and Delphi, received arms by the thousands as offerings. The period ended with the Greek victories over the Persians at Marathon, in 490, and at Salamis, in 480 BC."""
style = """
Archaic art loves clean forms, taut contours and stylization: kouroi with their fixed smile, black-figure vases, bronzes with smooth surfaces. Armorers shared this taste for simple, powerful forms, in which beauty arises from adaptation to function. The Corinthian helmet, with its enveloping curves and almond-shaped openings, is one of the most accomplished examples."""

[[artistes]]
nom = "Royaume d'Est-Anglie"
vie = "Eastern England (Norfolk and Suffolk), 6th–9th century"
biographie = """
After the Romans left Britain, at the beginning of the 5th century, peoples from the shores of the North Sea, Angles, Saxons and Jutes, settled in the east of the island. In the 6th century several kingdoms formed, among them that of the East Angles, East Anglia, which corresponds roughly to the present counties of Norfolk and Suffolk. Its dynasty reached its height under Rædwald, who died around 624 and whom the historian Bede the Venerable counts among the kings who held overlordship over the other English kingdoms. Rædwald had himself baptized but, according to Bede, kept an altar to the old gods beside that of Christ. The royal court maintained ties with Scandinavia, the Frankish world and even Byzantium, as the objects from Sutton Hoo show. East Anglia converted to Christianity in the course of the 7th century. In the 9th century it was conquered by the Vikings, who killed King Edmund in 869, afterwards honored as a saint."""
style = """
The art of the pagan Anglo-Saxons is a goldsmiths' art: buckles, clasps, brooches and weapons are covered with interlaced stylized animals and cloisonné of gold and garnets. Human and animal figures break down into motifs that coil and interlock, to be deciphered at close range. This art, shared with Scandinavia, would later nourish the illuminations of Christian manuscripts in Ireland and Northumbria."""

[[artistes]]
nom = "Japon, époque de Kamakura"
vie = "Japan, 1185–1333"
biographie = """
In 1185, at the end of the Genpei War between the Taira and Minamoto clans, Minamoto no Yoritomo triumphed and established his military government at Kamakura, far from the imperial court at Kyoto; in 1192 he received the title of shogun. For the first time, the warriors, the bushi or samurai, governed the country alongside the emperor, whose role became chiefly religious and symbolic. After Yoritomo's death, power passed to the Hōjō family, regents of the shogunate. In 1274 and 1281 Japan repelled two Mongol invasion attempts, at the cost of a heavy military effort. Discontent and debts then weakened the regime. In 1333, the Emperor Go-Daigo, aided by warriors who rallied to him such as Ashikaga Takauji and Nitta Yoshisada, overthrew the Kamakura shogunate. The period also saw the rise of Zen Buddhism and the Pure Land schools, of a realistic sculpture and of the great war tales such as the Tale of the Heike."""
style = """
Kamakura art is marked by the warriors' taste for the vigorous and the true: sculptures by Unkei with taut muscles, painted scrolls recounting battles, unflattering portraits. Armorers then produced the great ō-yoroi armors with their colorful lacing, and smiths produced blades held to be the finest in the history of the Japanese sword, such as those of Masamune."""

[[artistes]]
nom = "Japon, époque d'Edo"
vie = "Japan, 1603–1868"
biographie = """
In 1603, Tokugawa Ieyasu, victor at Sekigahara three years earlier, received the title of shogun and established his government at Edo, present-day Tokyo. His descendants governed Japan for more than two and a half centuries. The country closed itself almost entirely to foreigners, internal wars ceased, and society was divided into orders: warriors, peasants, artisans and merchants. The samurai, who now scarcely fought, became administrators in the service of the shogun and the daimyo, lords of the provinces; wearing the two swords remained their privilege and their distinguishing mark. Peace favored the rise of the cities, Edo, Osaka, Kyoto, and of a brilliant urban culture: kabuki theater, prints, poetry, decorative arts. Sword craftsmen, smiths, polishers, lacquerers and chasers of mounts, then worked as much for show as for use. In 1868, the Meiji Restoration returned power to the emperor; in 1876, the wearing of swords was banned, and the samurai disappeared as a class."""
style = """
The arms of the Edo period combine the tradition of old blades, preserved and remounted, with the refinement of mounts that are veritable jewels of metal. Chasers and lacquerers vied in invention in the guards, the small hilt fittings and the scabbards, at times sober, at times covered with landscapes or animals. Every detail of the sword became a collector's object."""

[[artistes]]
nom = "Empire ottoman"
vie = "Anatolia, the Balkans and the Near East, c. 1300–1922"
biographie = """
Around 1300, a Turkish chieftain named Osman founded a small principality in northwestern Anatolia, on the borders of the Byzantine Empire. His descendants, the Ottomans, expanded into the Balkans and Asia Minor; in 1453, Sultan Mehmed II took Constantinople, which became Istanbul, capital of the empire. In the 16th century, Selim I conquered Syria and Egypt, and Suleiman the Magnificent pushed on to Baghdad, Buda and the gates of Vienna. The Ottoman army, with its Janissaries, its artillery and its cavalry, was then one of the most powerful in the world. The imperial workshops of Istanbul brought together craftsmen from across the empire and from conquered lands, notably Iran and the Caucasus, and produced arms, armor, ceramics, textiles and manuscripts for the palace. Weakened from the 18th century on in the face of Austria and Russia, the empire survived until the First World War; it disappeared in 1922, and the Republic of Turkey was proclaimed the following year."""
style = """
Ottoman arms art combines the power of forms, inherited from the Turkmen and from Iran, with precious decoration: gilding, silver inlays, calligraphy, floral scrolls and, later, precious stones. Inscriptions, prayers, verses or titles of the sultan, are an essential element of this decoration. The weapon thus becomes an object of prestige and piety as much as an instrument of war."""

[[artistes]]
nom = "Inde du Nord, Lucknow"
vie = "Lucknow, kingdom of Awadh (northern India), 18th–19th century"
biographie = """
In the 18th century, the Mughal Empire, which had dominated most of India since the 16th century, fragmented. Its provincial governors became almost independent princes: such was the case of the nawabs of Awadh, in the rich Gangetic plain. In 1775 the nawab Asaf-ud-Daula made Lucknow his capital; there he built the Bara Imambara and attracted poets, musicians, architects and craftsmen from Delhi, then in decline. The city became one of the great centers of Indo-Persian culture: Urdu poetry, music, kathak dance, refined cuisine, goldsmithing and enameling. The nawabs maintained close, and increasingly unequal, relations with the English East India Company. In 1818–1819, Ghazi-ud-Din Haidar took the title of king, symbolically breaking with the Mughal emperor. In 1856 the British annexed Awadh; the following year, Lucknow was one of the centers of the great revolt of 1857."""
style = """
The workshops of Lucknow are renowned for their enamels on silver, with transparent blues and greens, often adorned with birds, fish and flowers. Luxury arms combine old blades, Persian or Indian, with new mounts of ivory, jade, enameled silver or gold. These ceremonial sabres speak of the refinement of a court where the weapon was above all an insignia of rank."""
