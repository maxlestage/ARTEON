[[oeuvres]]
titre = "Pair of Pistols of Empress Catherine II"
artiste = "Russie, armuriers de la cour impériale"
annee = "1786"
image = "pistolets-catherine-ii.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Pair_of_Flintlock_Pistols_of_Empress_Catherine_the_Great_(1729–1796)_MET_LC-1986_265_1_2-009.jpg"
technique = "Steel, ivory, gold, brass; length of each pistol 36.8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Signed by Johan Adolph Grecke, armorer to the court of Saint Petersburg: two ivory-stocked pistols made for Catherine II."
description = """
The two pistols lie head to tail, one above the other, on a gray ground. Their stock and grip are carved from ivory, a creamy white veined with fine crazing. The barrels, of blued steel almost black, are enhanced with gilded scrolls near the breech. On the side, the flintlock shows the cock, which held the flint, and the frizzen against which it struck. On the upper pistol, the name GRECKE can be read, engraved on the lock. The curved grip ends in a cap of chased and gilded metal; on the lower pistol, a silver-and-gold mount in the form of rocaille adorns the side opposite the lock. Each weapon measures thirty-seven centimeters."""
evocation = """
These pistols were made not for war but for prestige and pleasure: they belonged to a garniture of hunting arms, a matching set intended for a sovereign. Ivory, a fragile and costly material, says a great deal: such arms showed the wealth of the court and the skill of its craftsmen, capable of rivaling Paris or London. Under Catherine II, Saint Petersburg wished to be a European capital of the arts and sciences, and luxury arms contributed to this image. Given away or dispersed, such garnitures also served as diplomatic gifts and marks of favor, as their fate shows."""
histoire = """
Johan Adolph Grecke, an armorer in the service of the Russian imperial court, is documented from 1755 to 1790. In 1786 he made for Catherine II, empress since 1762, a garniture of hunting arms with ivory mounts: a pair of pistols, a hunting gun and a carbine. The initial E, for Ekaterina, the Russian form of her name, appears on the escutcheon of the grips. The set was later dispersed: part of it passed to Stanisław August Poniatowski, a former favorite of the empress who became king of Poland; the hunting gun is now in the National Museum in Warsaw, the carbine is lost. The pistols were given to the Met in 1986 by the banker John M. Schiff, in memory of his wife."""
facture = """
The work brings together several trades. The armorer forged the barrels and adjusted the flintlocks, whose mechanism produces a spark from the impact of the flint on the steel of the frizzen. A sculptor carved the ivory, a hard and brittle material that must be assembled from several pieces. The chaser and the gilder made the fittings, with rocailles and scrolls inspired by Rococo taste. The barrels, blued, were decorated with gold. The whole had to remain perfectly functional: a luxury weapon was also a precision weapon."""
details = [
  "The name GRECKE engraved on the lock of the upper pistol.",
  "The cock and frizzen of the flintlock, ready to strike.",
  "The gold scrolls on the dark steel of the barrels.",
  "The silver and gold rocaille mount on the lower pistol.",
  "The chased and gilded caps at the ends of the grips.",
]
themes = ["Russia", "hunting", "ivory", "Rococo", "firearms"]
anecdote = """
The flintlock that equips these pistols was perfected in the early 17th century at Lisieux, in Normandy, in the circle of Marin Le Bourgeoys, a craftsman in the service of Henry IV and then Louis XIII. Its principle served European firearms for more than two centuries."""
