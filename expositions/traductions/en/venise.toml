[[oeuvres]]
titre = "The Departure of the Bucintoro for the Lido on Ascension Day"
artiste = "Francesco Guardi"
annee = "c. 1775–1780"
image = "bucentaure.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Guardi_-_Le_Départ_du_Bucentaure_vers_le_Lido_de_Venise,_le_jour_de_l'Ascension,_vers_1770_-_1780,_INV_20009.jpg"
technique = "Oil on canvas, 66 × 101 cm"
collection = "Musée du Louvre, Paris"
note = "On Ascension Day, the doge's golden galley sets off for the Lido to wed the sea: Venice in festival, in a vibrant light."
description = """
The Bacino of San Marco is covered with boats. At the centre, the Bucintoro, a great \
red and gold ceremonial galley with carved sides, advances, driven by rows of \
oars. Around it crowd gondolas, gilded barges and sailing vessels with \
bristling masts. On the right, on the quay, one recognises the Doge's Palace, the campanile \
and the domes of the basilica of San Marco. In the distance, at left, the church and \
campanile of San Giorgio Maggiore; at the centre of the horizon, the dome of the Salute. \
In the foreground, on the quay, a crowd of Venetians, men in cloaks and tricornes, \
women in light gowns, watches the procession. A little dog trots among them. The cloudy \
sky occupies more than half the canvas."""
evocation = """
Every year, on Ascension Day, the doge boarded the Bucintoro and made for \
the Lido channel, where he threw a gold ring into the Adriatic while pronouncing \
words of marriage. This "marriage with the sea" celebrated Venice's dominion \
over the waters. When Guardi painted the scene, the Republic was no more than a \
declining power, which would disappear in 1797, but the festival kept all its splendour. His painting, \
nervous and luminous, seems to capture the bustle of an instant rather than the solidity \
of monuments. It has been seen as an image of Venice in its last years, already regarded \
as a memory."""
histoire = """
The canvas belongs to a series of twelve paintings, the Feste ducali, devoted to \
the great ceremonies of the doge, beginning with those that followed the election of Alvise IV \
Mocenigo in 1763. Guardi draws on compositions by Canaletto, known through the \
engravings of Giovanni Battista Brustolon, and transforms them with his personal touch. \
Ten of the twelve canvases of the series are now in the Louvre. The Bucintoro seen \
here, built in 1729, was the last: in 1798, after the fall of the Republic, \
French troops stripped it of its gilded carvings and burned them to \
recover the gold."""
facture = """
Guardi learned the craft in the family studio, with his brother Gian Antonio, then \
began to paint views of Venice in the wake of Canaletto. But his touch \
is quite different: rapid, broken up, made of little commas of colour that suggest \
the gondoliers, the reflections or the silhouettes of the crowd. The architecture, \
slightly tremulous, seems to float between water and sky, in a grey \
and silvery light. This freedom would be admired by nineteenth-century painters."""
details = [
  "The rows of oars emerging from the sides of the Bucintoro.",
  "The campanile of San Marco and the domes of the basilica, at right.",
  "The dome of the Salute, at the centre of the horizon.",
  "The standing gondoliers, sketched in a few touches.",
  "The little dog trotting in the foreground.",
]
themes = ["venice", "festival", "lagoon", "veduta", "ceremony"]
anecdote = """
Almost nothing remains of the last Bucintoro. The Naval History Museum of Venice \
preserves carved fragments and a large model, which make it possible to \
imagine the galley that Guardi painted."""
