[[oeuvres]]
titre = "Dresden from the Right Bank of the Elbe"
artiste = "Bernardo Bellotto"
annee = "1748"
image = "dresde-rive-droite.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Canaletto_-_Dresden_seen_from_the_Right_Bank_of_the_Elbe,_beneath_the_Augusts_Bridge_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 133 × 237 cm"
collection = "Gemäldegalerie Alte Meister, Dresden"
note = "A Venetian on the Elbe: the most famous view of Dresden, which preserves the image of a city destroyed in 1945."
description = """
From the right bank of the Elbe, one discovers the old town of Dresden, on the other \
side of the river. On the left, the long stone Augustus Bridge lines up its arches on the calm \
water. Above the rooftops rises the great stone dome of the Frauenkirche, \
the Church of Our Lady. On the right, the Hofkirche, the Catholic court church, is \
still under construction: its tower is wrapped in scaffolding. Beside it, palaces with \
pale façades are reflected in the river. In the foreground, on the sandy bank, \
strollers, fishermen and boatmen go about their business; boats \
are moored, another is crossing. The sky, immense and changing, occupies more \
than half the canvas."""
evocation = """
Bellotto paints a modern and proud capital, that of the Elector Augustus III, who had \
summoned him from Venice. The city was growing and being embellished: the Protestant dome of the \
Frauenkirche, completed a few years earlier, and the new Catholic court \
church, built by a Catholic prince ruling over a Lutheran land, answer each other on \
either side of the bridge. The painting celebrates the order and prosperity of a state. It has \
taken on, for us, the value of testimony: almost everything it shows was destroyed \
by the bombing of February 1945, and its precision makes it an image of memory."""
histoire = """
Nephew and pupil of Canaletto, Bellotto arrived in Dresden in 1747, called by Augustus III, \
Elector of Saxony and King of Poland, who named him court painter. He undertook \
for him a great series of views of Dresden and Pirna, of monumental format. This \
canvas, dated 1748, is one of the first. In Germany and Poland, Bellotto \
went by the name of his uncle, Canaletto, which long kept the \
confusion alive. The painting has belonged ever since to the Dresden collections. Put in safekeeping \
during the war, it was taken to Moscow by the Red Army in 1945, with the other \
masterpieces of the gallery, and returned to Dresden in 1955."""
facture = """
Bellotto learned from Canaletto the rigour of the veduta: exact perspective and \
meticulously described architecture; it is thought that he used, like him, a \
camera obscura. But his palette is colder than his uncle's: silvery blues and greys, \
frank shadows, heavy clouds in the Dutch manner. He paints very \
large canvases where every window is legible, and animates the foregrounds with figures \
taken from everyday life. The light sculpts the façades and makes \
their reflections shimmer on the Elbe."""
details = [
  "The scaffolding surrounding the tower of the Hofkirche, still unfinished.",
  "The dome of the Frauenkirche, above the rooftops.",
  "The reflections of the palaces in the still water of the river, at right.",
  "The strollers and fishermen on the bank, in the left foreground.",
  "The arches of the Augustus Bridge, spanning the whole left side of the painting.",
]
themes = ["city", "river", "veduta", "architecture", "memory"]
anecdote = """
This viewpoint over the old town still bears, in Dresden, the name of \
"Canaletto-Blick", Canaletto's view. To rebuild the Frauenkirche, completed \
in 2005, Bellotto's views were consulted among the historical documents."""
