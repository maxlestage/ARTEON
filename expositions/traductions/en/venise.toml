[[oeuvres]]
titre = "Self-Portrait as Winter"
artiste = "Rosalba Carriera"
annee = "1730–1731"
image = "autoportrait-hiver.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Rosalba_Carriera_-_Self-Portrait_as_%22Winter%22_(1730-1731)_-_Google_Art_Project.jpg"
technique = "Pastel on paper, 46.5 × 34 cm"
collection = "Gemäldegalerie Alte Meister, Dresden"
note = "At fifty-seven, the most sought-after portraitist in Europe depicts herself as an allegory of Winter, muffled in fur. The sheet measures less than half a metre; it is shown here enlarged."
description = """
A woman of mature age, seen in bust and three-quarter view, looks at us with a faint \
smile. Her light eyes are slightly shadowed. On her head she wears a large cap of \
white fur flecked with black, like ermine, together with a blue velvet cap \
from which hangs a golden tassel. A blue cloak edged with the same fur covers her \
shoulders and opens onto a white shirt. Pearls hang from her ears. The \
background, grey and neutral, darkens around the head, so that the pale face and the \
white fur stand out sharply. No object, no setting, no painter's attribute: \
everything lies in the figure and in her gaze."""
evocation = """
Rosalba often painted the four seasons in the guise of graceful young women. \
Here, she lends herself to the allegory, but without flattery: she \
shows a face marked by age, with rare frankness. Winter is the season of \
old age; the fur, which warms, also evokes the comfort and luxury of an \
artist who has reached the summit of her reputation. One can read in it humour, a \
lucid awareness of passing time and the pride of a woman who lived by her art. \
The self-portrait asserts the place of a woman painter, admitted by the academies of Rome \
and Paris at a time when they admitted very few."""
histoire = """
Rosalba Carriera executed this self-portrait around 1730–1731, during her stay at the \
imperial court in Vienna. She was then the most sought-after portraitist in Europe: \
sovereigns, princes and Grand Tour travellers filed through her Venetian studio. The \
pastel joined the collection of the Electors of Saxony, in Dresden. Prince \
Frederick Augustus, the future Augustus III, who had met her in Venice in his youth, \
assembled indeed the largest group of her pastels. Put in safekeeping during the Second \
World War, these paintings escaped the destruction of the city and are \
now displayed in the Gemäldegalerie Alte Meister, together with Bellotto's views of \
Dresden."""
facture = """
Pastel is a stick of almost pure pigment, crushed onto the paper. Rosalba made of \
it a major art. She works in light layers, blended with the finger or \
a stump, to obtain the velvety softness of skin; then she lays on the accents with a quick stroke: \
the white of the pearls, the strands of fur, the sparkle of the eye. The \
intense blue of the velvet answers the grey of the background. Fragile, pastel fears knocks and \
light: this is why it is kept under glass."""
details = [
  "The hairs of the fur, rendered by quick strokes of white and black.",
  "The pearls of the earrings, laid in with a single touch.",
  "The golden tassel hanging from the blue velvet cap.",
  "The slight shadows under the eyes, rendered without indulgence.",
]
themes = ["self-portrait", "winter", "allegory", "women", "pastel"]
anecdote = """
Rosalba began her career painting miniatures for the lids of snuffboxes. \
She was one of the first to paint them on ivory, a luminous support that \
became the rule for eighteenth-century miniatures."""
