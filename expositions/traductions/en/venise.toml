[exposition]
ordre = 35
nom_court = "Venice"
mouvement = "Venice, from Bellini to Tiepolo"
cadre = "dore"
couleur = "#1f5c66"
titre = "Venice, Colour and Light, from Bellini to Tiepolo"
artiste = "Bellini, Carpaccio, Veronese, Tintoretto, Tiepolo…"
dates = "1475–1780"
accroche = "Virtual exhibition · Gallerie dell'Accademia, Venice"
introduction = """
For three centuries, Venice invented a painting of colour and light: the oil painting \
brought by Antonello da Messina, the luminous altarpieces of Giovanni \
Bellini, Carpaccio's narratives, then the feasts of Veronese and the storms of \
Tintoretto, down to the last glow of the eighteenth century, from Tiepolo's festivities to \
the views of Guardi and Bellotto. The visit brings together eleven painters in eleven works. The building \
is modelled on the Gallerie dell'Accademia, housed in the former Scuola della \
Carità: one passes from the portal to the chapter hall with its golden walls, then to the long \
banquet hall and the salons of the Settecento."""
vitrine = "reve-sainte-ursule.jpg"

[musee]
nom = "Gallerie dell'Accademia"
ville = "Venice, Italy"
architecte = "Andrea Palladio (the convent); Giannantonio Selva (the museum)"
construction = "14th–16th centuries; museum opened in 1817"
presentation = """
The Gallerie dell'Accademia occupy, on the Grand Canal, the complex of Santa \
Maria della Carità: the church, rebuilt in the fifteenth century, the convent of the Lateran \
canons, begun by Andrea Palladio in 1561 and never completed, and the Scuola della \
Carità, the oldest of the six Scuole Grandi, the great lay confraternities of \
Venice. In 1807, under Napoleonic rule, the Academy of Fine Arts, founded \
in 1750, moved in; the architect Giannantonio Selva divided the church into rooms and \
walled up its Gothic windows. The collections, enriched with paintings from the suppressed churches and \
convents, opened to the public in 1817. One enters through the classical façade of \
the Scuola, remodelled around 1760 by Giorgio Massari and Bernardino Maccaruzzi. The first \
room, the former chapter hall, retains its fifteenth-century gilded coffered wooden \
ceiling, and the Albergo room preserves the Presentation of the Virgin at the Temple, which \
Titian painted for this very wall. The museum holds the finest group of Venetian painting \
in the world."""
ici = """
The ARTEON building follows its sequence. One enters from the south into "The Carità \
Portal", a vestibule of pale stone. To the north opens "The Chapter Hall", eighteen metres \
wide and nine high, with golden ochre walls: the masters of the Quattrocento and Lotto. To the \
east, "The Banquet Hall", thirty-two metres long and twelve high, evokes the naves of the former \
church where the giant canvases hang: Veronese, Tintoretto, Tiepolo. To the west, "The Settecento \
Salons", lower, with sea-green walls, bring together the eighteenth century."""

