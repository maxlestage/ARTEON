image = "banquet-cleopatre.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Giambattista_Tiepolo_-_The_Banquet_of_Cleopatra_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 250.3 × 357 cm"
collection = "National Gallery of Victoria, Melbourne"
note = "To win a wager, Cleopatra is about to dissolve a pearl in her cup and drink it before Mark Antony's eyes: Antiquity dressed as a Venetian festivity."
description = """
The banquet takes place beneath a portico open to the sky, between tall fluted columns. \
At the centre, at a table covered with a white cloth, Cleopatra is seated, \
in a golden silk gown with a wide collar, a pearl necklace at her throat. With her \
right hand, she holds a pearl above a glass cup. Opposite her, Mark \
Antony, helmeted, wrapped in a red cloak, watches her, seated in an armchair. \
Around them, servants, pages, soldiers and courtiers in Oriental costume \
observe the scene; in the left foreground, a man in a blue hat, seen from behind, \
brings a dish. A greyhound sits before the table. On the balustrade at the back, \
spectators lean over to see."""
evocation = """
Pliny the Elder tells that Cleopatra wagered with Mark Antony that she would spend a \
fortune on a single meal. At dessert, she had one of the \
two largest pearls in the world, which she wore as an earring, dissolved in vinegar, and drank it. \
Tiepolo chooses the suspended instant when the queen is about to drop the pearl: a gesture \
of defiance, luxury and power. Historians also see in it a portrait of eighteenth-century \
Venice, a city of festivities and expense, whose power was in decline. The \
costumes mix Antiquity, the Orient and sixteenth-century fashion, in homage to \
Veronese's feasts."""
histoire = """
Tiepolo began the painting for a client who remains uncertain, perhaps the English \
merchant Joseph Smith, patron of Canaletto. The writer Francesco Algarotti, who \
bought paintings for Augustus III, Elector of Saxony and King of Poland, discovered it \
unfinished in the studio and had it completed for Dresden. The canvas nevertheless left Saxony: in 1764, Catherine II of Russia bought it in Amsterdam, and it remained \
at the Hermitage in Saint Petersburg for more than a century and a half. In 1932, the \
Soviet government, which was selling masterpieces to obtain foreign currency, \
let it go; the National Gallery of Victoria acquired it in 1933. Tiepolo took up the subject in \
fresco at the Palazzo Labia in Venice."""
facture = """
Tiepolo paints with a light, rapid touch, with a bright palette dominated by gold, \
white, red and the pale blue of the sky. The setting, with its columns and \
balustrade seen from below, recalls the feasts of Veronese, whom he admired. The \
light, even and silvery, bathes the whole painting, without deep shadows. The figures \
are arranged as on a theatre stage, around a central void in which Cleopatra's \
gesture is played out; the white tablecloth makes it the brightest point."""
details = [
  "The pearl that Cleopatra holds above the glass cup.",
  "The plumed helmet of Mark Antony, seated at the right of the table.",
  "The greyhound seated in the foreground, at right.",
  "The man in the blue hat bringing a dish, at left.",
  "The birds crossing the sky, above the balustrade.",
]
themes = ["antiquity", "banquet", "luxury", "wager", "theatre"]
anecdote = """
Tiepolo had married in 1719 Maria Cecilia Guardi, sister of the painters Gian Antonio and \
Francesco Guardi, one of whose views of Venice is exhibited in the neighbouring salons. Two of \
their sons, Giandomenico and Lorenzo, became his assistants."""
