[[oeuvres]]
titre = "Saint Jerome in His Study"
artiste = "Antonello de Messine"
annee = "c. 1475"
image = "saint-jerome-cabinet.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Antonello_da_Messina_-_St_Jerome_in_his_study_-_National_Gallery_London.jpg"
technique = "Oil on lime panel, 45.7 × 36.2 cm"
collection = "National Gallery, London"
note = "A scholar in a miniature cathedral: the saint reads, alone, at a desk-cabinet set up beneath Gothic vaults. The panel measures less than half a metre; it is shown here enlarged."
description = """
We look through a great stone arch, as through an open window. \
Beyond stretches a vast vaulted interior, halfway between church and palace, its floor tiled \
in green and white. At the centre, on a wooden platform, Saint Jerome reads, seated at his \
desk, dressed in the red robe of a cardinal. Around him, shelves hold \
books, boxes and faience vases; his red hat rests on a chest, \
at right. A cat lies on the platform, near two potted plants. In the \
colonnaded gallery on the right, a lion pads slowly forward. Through the windows, one \
glimpses hills, a river and birds in the sky. On the stone ledge in the foreground, a partridge, a peacock and a copper basin seem to await \
the visitor."""
evocation = """
Jerome, the scholar who translated the Bible into Latin in the late fourth century, was the \
model of the humanists: the man of study withdrawn from the world. Antonello makes of him a man of \
letters of his own day, installed in a studiolo like those owned by the scholars of the \
Renaissance. The painting is also a meditation on knowledge and sight: everything in it \
is ordered by perspective, which leads the eye from the arch to the open book, \
at the exact centre of the composition. The animals and plants have been read as \
symbols: the peacock, an image of immortality, the partridge, associated with truth, the potted \
plants, evocations of salvation and the Passion. The lion recalls the legend of the saint who \
removed a thorn from its paw, and whom the animal never left again."""
histoire = """
The small panel probably dates from 1474–1475, when Antonello, coming from \
Sicily, was preparing to stay in Venice; it has been supposed that he brought it as a \
demonstration of his skill, to attract commissions. In 1529, the Venetian connoisseur \
Marcantonio Michiel described it in the house of the merchant Antonio Pasqualino, \
and noted that some believed it to be by Jan van Eyck or Hans Memling, so Flemish \
did its minuteness appear. The painting then passed to England; in the nineteenth century, it \
belonged to the Baring family, Earls of Northbrook. Its attribution to Antonello, \
established in 1856 by the historians Crowe and Cavalcaselle, is no longer disputed. It \
entered the National Gallery in London in 1894."""
facture = """
Antonello is one of the first Italians to master oil painting in the \
Flemish manner: thin, transparent layers that render the gleam of \
metal, the grain of wood or the light gliding over the tiles. The construction in \
perspective, very rigorous, recalls Piero della Francesca. The light comes from \
several sides at once: from the front, through the arch, and from the back, through the \
windows, which gives the vast space a calm, golden atmosphere, of a depth \
astonishing in so small a format."""
details = [
  "The cat lying on the platform, at left, near the potted plants.",
  "The lion advancing in the half-light of the gallery, at right.",
  "The peacock and the partridge perched on the stone ledge, in the foreground.",
  "The tiny hills and river glimpsed through the windows.",
  "The red cardinal's hat resting on the chest, at right.",
]
themes = ["study", "perspective", "saint", "humanism", "animals"]
anecdote = """
Saint Jerome was never a cardinal: that dignity did not exist in his day. But \
Renaissance painters give him the red robe and hat, because he had been in Rome the \
secretary of Pope Damasus."""
salle = 2
mur = "nord"
position = -6
largeur = 1.0

[[oeuvres]]
titre = "San Giobbe Altarpiece"
artiste = "Giovanni Bellini"
annee = "c. 1487"
image = "pala-san-giobbe.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Giovanni_Bellini_-_San_Giobbe_Altarpiece_-_WGA1704.jpg"
technique = "Oil on panel, 471 × 258 cm"
collection = "Gallerie dell'Accademia, Venice"
note = "Beneath a golden vault like that of San Marco, the Virgin is enthroned among six saints, while three musician angels play at her feet."
description = """
The panel, very tall and arched at the top, depicts a chapel. A coffered vault opens onto \
an apse covered in gold mosaic, against which seraphim and a Latin \
inscription stand out. At the centre, on a high marble throne, the Virgin, in a blue mantle, holds \
the naked Child on her lap and raises her right hand. On either side stand six \
saints. On the left, Saint Francis, in a brown habit, opens his hand; behind him appears \
Saint John the Baptist; then Job, an almost naked old man, joins his hands. On the right, Saint \
Dominic reads a red book, Saint Sebastian, his body pierced with arrows, stands \
upright, and Saint Louis of Toulouse wears a bishop's mitre. At the foot of the throne, three \
angels play two lutes and a viol."""
evocation = """
Job, the man tried by God, and Saint Sebastian, invoked against the plague, recall \
the sick and the epidemics that regularly struck Venice; the altarpiece has been linked \
to the plague of 1485. The Virgin, who intercedes for mankind, protects the faithful here. \
Bellini gives this heavenly gathering the calm of a silent conversation, what \
is called a "sacra conversazione". The golden apse evokes the basilica of \
San Marco: the scene takes place in a Venetian church, almost familiar. \
The inscription on the vault hails Mary as the spotless flower of virginal \
modesty. The music of the angels, finally, suggests the harmony of heaven, which the believer \
thinks he hears before the altar."""
histoire = """
Bellini painted the altarpiece for an altar in the Franciscan church of San Giobbe, in \
Cannaregio, linked to the confraternity of the same name; the exact patron remains unknown. \
The work, undated, is generally placed around 1487; it was in place by 1493. \
Painted for its setting, it extended the real architecture: the painted pilasters \
continued those of the stone frame of the altar, so that the painted \
chapel seemed to open into the wall of the church. The altarpiece remained in the \
church until the early nineteenth century, at the time of the Napoleonic suppressions, then \
entered the Gallerie dell'Accademia. Separated from its frame, which remained at San Giobbe, it \
lost part of its illusion there, but gained an immense public."""
facture = """
Bellini is one of the first Venetians to paint a large altarpiece in oil. From it he \
draws deep colours and a soft, warm light that unifies the whole scene. \
The vanishing point is set low, so that the vault is seen from below, like a \
worshipper standing before the altar. The painting in a single piece, in which all the figures \
share the same space, breaks with the compartmented polyptychs of the preceding \
generation. One recognises in it the example of Antonello da Messina, whose altarpiece for San \
Cassiano, painted in Venice in 1475–1476, had struck the painters of the city."""
details = [
  "The inscription in capital letters on the gold mosaic of the apse.",
  "The golden seraphim lined up beneath the inscription.",
  "The arrows planted in Saint Sebastian's body.",
  "The red book that Saint Dominic reads.",
  "The three musician angels seated on the steps of the throne.",
]
themes = ["sacra conversazione", "virgin", "music", "plague", "architecture"]
anecdote = """
Bellini signed IOANNES BELLINVS on a small painted cartellino at the foot of the throne, just \
beneath the angel playing at the centre: a trompe-l'œil signature, like a paper laid \
on the step, which one must look for to see."""
salle = 2
mur = "nord"
position = 0
largeur = 2.2

[[oeuvres]]
titre = "The Dream of Saint Ursula"
artiste = "Vittore Carpaccio"
annee = "1495"
image = "reve-sainte-ursule.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Vittore_carpaccio,_Dream_of_St_Ursula_01.jpg"
technique = "Tempera on canvas, 274 × 267 cm"
collection = "Gallerie dell'Accademia, Venice"
note = "In a peaceful Venetian bedroom, Princess Ursula sleeps; an angel enters and announces her martyrdom."
description = """
A bright, tidy bedroom, seen like a stage set. On the left, beneath a \
red canopy, Ursula sleeps in a large bed, her cheek resting on her hand, covered \
with a white sheet and a red blanket. Her crown is set at the foot of the bed. In the \
background, two arched windows reveal potted plants; a half-open door \
gives onto another room. On the walls, statuettes, a sconce, open \
cupboards. On the right, on a small table, an open book and an hourglass. Through the door, \
a fair-haired angel in a blue robe has just entered, a palm in his hand; the morning light \
enters with him and traces a broad golden patch on the floor. In the foreground, \
almost hidden, a little dog sleeps."""
evocation = """
The Golden Legend tells that Ursula, a Christian Breton princess, agrees to marry \
a pagan prince on condition that he convert and that she first make a \
pilgrimage to Rome with eleven thousand virgins; on the return, all are massacred by the \
Huns at Cologne. Here, the angel announces this destiny to her in a dream. Carpaccio chooses a peaceful, \
almost domestic moment: nothing announces violence, except the palm of martyrdom. \
The ordered room, the open windows, the plants have been read as images \
of the saint's purity and inner life. For Venetians, it was also \
a familiar room, that of a wealthy house in their own city."""
histoire = """
The canvas belongs to the cycle of nine large paintings of the life of Ursula that \
Carpaccio produced between 1490 and about 1495 for the Scuola di Sant'Orsola, a small \
confraternity housed against the Dominican church of Santi Giovanni e Paolo. The Dream, \
dated 1495 on a small cartellino, is one of the last episodes painted. After the \
suppression of the confraternities under Napoleonic rule, the canvases entered the Gallerie dell'Accademia in \
1812; since 1923 they have been gathered in a room \
devoted to them. In the nineteenth century, the English critic John Ruskin became enamoured of this \
figure of a saint: in 1876–1877, he obtained permission to study and copy the painting, \
taken down for him, in a separate room."""
facture = """
Carpaccio paints in tempera on canvas, a common technique in Venice, where damp \
damages frescoes. He builds the room in perspective, with its beamed ceiling \
and its furniture receding towards the back, and fills it with objects observed with \
the precision of an inventory. The light, tranquil, enters by the door and the windows \
and casts sharp shadows. The colours are sober: red of the bed and canopy, \
green of the panelling, blue of the angel. This narrative clarity, learned from Gentile \
Bellini, makes him the great storyteller of Venetian painting."""
details = [
  "The crown set at the foot of the bed, on the step.",
  "The hourglass on the small table, beside the open book.",
  "The two potted plants behind the windows in the background.",
  "The palm held by the angel, a sign of the martyrdom to come.",
  "The little dog lying in the foreground, at bottom centre.",
]
themes = ["dream", "saint", "angel", "bedroom", "golden legend"]
anecdote = """
Carpaccio, the dish of thin slices of raw beef, bears the painter's name: Giuseppe \
Cipriani, at Harry's Bar in Venice, is said to have christened it so around 1950, the year of a \
major Carpaccio exhibition, because of the vivid reds of his paintings."""
salle = 2
mur = "sud"
position = 4.5
largeur = 2.6

[[oeuvres]]
titre = "Portrait of a Young Man in His Study"
artiste = "Lorenzo Lotto"
annee = "c. 1530"
image = "jeune-homme-cabinet.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Accademia_-_Ritratto_di_giovane_gentiluomo_nel_suo_studio_-_Lorenzo_Lotto_cat.912.jpg"
technique = "Oil on canvas, 98 × 111 cm"
collection = "Gallerie dell'Accademia, Venice"
note = "A pale young man leafs through a large book, surrounded by objects that seem to speak of his melancholy."
description = """
A young man, seen half-length, sits before a table covered with a green cloth. He \
wears a loose black garment with puffed sleeves and a white shirt closed at the \
collar. His face, long and pale, is turned towards us, but his gaze seems distant. \
With his left hand, he turns the pages of a large ledger lying before him. On the \
table lie a blue fringed shawl, a folded letter, a small gold chain, \
scattered rose petals and a lizard. The background is plunged in shadow: one can make out \
objects hanging on the wall and a chest. At far left, a window opens onto a blue \
sky and a line of hills, the only escape of light in this closed room."""
evocation = """
This is one of the most mysterious portraits of the Renaissance. The young man seems \
to turn away from the pleasures of the world, hunting and music, evoked by a horn and a \
lute relegated to the shadows, for study or work, without finding peace in it. The \
fallen petals, the letter, the lizard have been read as allusions to disappointed love, \
to the flight of time or to illness: in Italian, it is sometimes called the "young \
invalid". Lotto, restless and solitary, often lent his sitters this tormented inner \
life. The exact meaning of the objects remains debated, and that is what gives the \
portrait its strength."""
histoire = """
Lotto painted this portrait around 1530 in Venice, where he had settled again in 1525 after about \
twelve years spent in Bergamo. The sitter has not been identified. The painting remained \
long in a private collection in Treviso, where its attribution to Lotto was \
recognised in 1923. The Italian State bought it in 1930 for the Gallerie dell'Accademia. It \
sits there beside the great Venetian altarpieces, but belongs to another world: \
that of the private portrait, made for an intimate circle. The ledger that the \
young man leafs through has suggested an account book, which would make him a merchant or \
an administrator, but no source confirms this."""
facture = """
Lotto paints with an almost Flemish precision: every object, from the lizard to the fringes \
of the shawl, is described with care. The composition is unusual: the young man is pushed to the left, \
the table fills the whole right side, and the format, wider than \
tall, leaves much room for the objects. The deep blacks of the garment contrast \
with the acid green of the cloth and the blue of the shawl. A cold light, coming from the \
left, isolates the face and hands. Unlike Titian, his contemporary, Lotto prefers \
sharp contours and a more uneasy atmosphere."""
details = [
  "The little lizard resting on the blue shawl.",
  "The rose petals scattered on the green cloth.",
  "The folded letter and the gold chain, at the edge of the book.",
  "The window open onto a landscape, at the very top left.",
]
themes = ["portrait", "melancholy", "symbols", "reading", "vanitas"]
anecdote = """
From 1538 until his death Lotto kept an account book that has come down to us: in it one reads his \
commissions, his debts and his misfortunes. In 1550, at Ancona, he even organised a lottery \
of his unsold paintings, which brought him very little."""
salle = 2
mur = "nord"
position = 6
largeur = 1.15

[[oeuvres]]
titre = "The Miracle of Saint Mark Freeing the Slave"
artiste = "Le Tintoret"
annee = "1548"
image = "miracle-esclave.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jacopo_Tintoretto_-_The_Miracle_of_St_Mark_Freeing_the_Slave_-_WGA22480.jpg"
technique = "Oil on canvas, 416 × 544 cm"
collection = "Gallerie dell'Accademia, Venice"
note = "Saint Mark dives from the sky, head first, to save a slave from torture: the canvas that made Tintoretto famous, at thirty."
description = """
Before a portico and a garden closed off by a trellis, a crowd presses around \
a naked man stretched on his back on the ground. Executioners set upon him, but their \
instruments break: a man in a turban brandishes a hammer, another shows a \
broken stick, splintered pieces of wood litter the ground. The spectators \
lean in, stupefied. Above them, Saint Mark, in a red tunic and orange cloak, \
plunges from the sky head down, in a burst of light surrounding his head. On the right, \
on a dais, the slave's master, in a red robe, leans out of his seat, \
overwhelmed. On the left, a woman holds a child, and a man clings to a column \
to see better."""
evocation = """
The Golden Legend tells that a slave, in the service of a lord of Provence, went off \
against his master's prohibition to venerate the relics of Saint Mark; on his return, \
he was condemned to have his eyes put out and his legs broken, but the instruments of \
torture shattered. For the confraternity of Saint Mark, this miracle celebrated the \
power of the patron saint of Venice. Tintoretto makes of it a striking spectacle: the saint \
bursts in mid-flight, without anyone seeing him, and the stupefaction spreads through the \
crowd. It has been seen as the assertion of a new painting, founded on movement, \
foreshortening and surprise."""
histoire = """
The Scuola Grande di San Marco, one of the richest confraternities in Venice, commissioned the \
canvas for its meeting hall. Tintoretto, about thirty years old, had never yet painted \
anything so large. According to his biographer Carlo Ridolfi, some of the brothers \
hesitated to accept the work, and the painter took it back home until it was \
asked for again. The painting was finally admired: the writer Pietro Aretino congratulated the \
painter on it in a letter of April 1548. Tintoretto would go on to paint other miracles of \
Saint Mark for the same confraternity. Seized by the French in 1797, the canvas returned to \
Venice in 1815 and then entered the Gallerie dell'Accademia."""
facture = """
According to Ridolfi, Tintoretto had inscribed on the wall of his studio a motto: the drawing \
of Michelangelo and the colour of Titian. One recognises both here: \
powerful bodies seen in foreshortening, like the plunging saint or the prone slave, and \
vivid colours, reds, oranges, blues. The composition is built like a stage \
scene: a deep space, figures pressed in the foreground, gestures that \
converge on the outstretched body. The brushwork is rapid, sometimes sketchy; Titian and \
his supporters reproached the young painter for this hasty execution."""
details = [
  "The saint plunging from the sky, head first, seen in foreshortening.",
  "The pieces of wood and the broken tools around the slave.",
  "The man clinging to a column, at upper left.",
  "The master, on the right, leaning out of his seat.",
  "The woman holding a child, at the left edge of the crowd.",
]
themes = ["miracle", "saint mark", "crowd", "movement", "venice"]
anecdote = """
Tintoretto's nickname, "il Tintoretto", that is "the little dyer", comes \
from the trade of his father, who dyed cloth in Venice. His real name was Jacopo \
Robusti."""
salle = 3
mur = "sud"
position = 0
largeur = 4.2

[[oeuvres]]
titre = "The Wedding Feast at Cana"
artiste = "Paolo Véronèse"
annee = "1562–1563"
image = "noces-de-cana.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Les_Noces_de_Cana_-_Paolo_Veronese_-_Musée_du_Louvre_Peintures_INV_142_;_MR_384.jpg"
technique = "Oil on canvas, 677 × 994 cm"
collection = "Musée du Louvre, Paris"
note = "Christ's first miracle, water turned into wine, becomes a Venetian banquet of more than a hundred and thirty figures: the largest canvas in the Louvre."
description = """
Beneath a blue sky crossed by clouds, a terrace lined with colonnades hosts an \
immense feast. The tables form a U around a paved space. At the centre, facing \
us, Christ, haloed, sits between his mother and his disciples; they are almost \
the only ones to remain solemn. Around them, dozens of guests in sumptuous costumes, \
Venetian or Oriental, eat, drink and converse; at the far left end of the \
table, the bride and groom. In the foreground, in the middle, a group of musicians plays \
the viol. On the right, a servant pours wine from a large jar, and a man in a \
brocade robe examines his cup. Behind the balustrade, servants carve meat; \
on the rooftops, onlookers lean over. Dogs and a cat wander among the \
feet."""
evocation = """
The Gospel of John tells that at the wedding at Cana, the wine ran short and Jesus \
turned water into wine: it is his first miracle. Veronese makes of it the most \
sumptuous feast imaginable, in the image of the banquets of the Venetian aristocracy. But the religious \
meaning remains at the centre: Christ, motionless amid the commotion, looks at the \
viewer, and just above him, behind the balustrade, a servant carves the \
meat, a gesture that has been likened to the sacrifice of the Lamb. The hourglass set before the \
musicians has been read as a reminder of passing time. Intended for a refectory, the \
canvas seated the monks, during their meals, at Christ's own table."""
histoire = """
On 6 June 1562, the Benedictines of the monastery of San Giorgio Maggiore, in Venice, \
commissioned from Veronese a canvas for the end wall of their new refectory, \
built by Andrea Palladio. The contract asked that as many figures as \
possible be fitted in. Helped by his brother Benedetto, the painter delivered it in September 1563. In \
1797, French troops carried it off as booty: the canvas was cut into horizontal \
strips and rolled up for the journey, then sewn back together in Paris. In 1815, at the time of the \
restitutions, Vivant Denon judged it too fragile to leave again; Venice received in \
its place a large painting by Charles Le Brun. Since 2007, a full-size digital \
copy has occupied its original place."""
facture = """
Veronese organises the crowd with an architect's clarity: colonnades inspired by \
Palladio and Antiquity close off the sides, a balustrade divides the painting into \
two registers, and the sky opens the space at the centre. The colours, bright and \
frank, are laid in great chords of reds, greens, yellows and blues, and \
the silks and brocades shimmer under an even light. The restoration \
carried out at the Louvre from 1989 revealed that the steward's cloak, in the \
foreground at left, had been repainted red: it was originally green."""
details = [
  "The musicians at the centre: tradition recognises Veronese in white, Titian in red, and Tintoretto.",
  "The servant pouring wine from a large jar, at right.",
  "The hourglass set on the table, before the musicians.",
  "The bride and groom, at the left end of the table.",
  "The onlookers leaning over the rooftops and balconies, at the very top.",
]
themes = ["banquet", "miracle", "music", "feast", "architecture", "venice"]
anecdote = """
At the Louvre, The Wedding Feast at Cana hangs in the Salle des États, opposite the \
Mona Lisa: the crowd pressing to photograph Leonardo's portrait \
often turns its back on the largest canvas in the museum."""
salle = 3
mur = "nord"
position = 0
largeur = 4.5

