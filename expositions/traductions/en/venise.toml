[[artistes]]
nom = "Antonello de Messine"
vie = "Messina (Sicily), c. 1430 – Messina, February 1479"
biographie = """
Antonello was born in Messina, in Sicily, into a family of craftsmen. He trained in \
Naples, with the painter Colantonio, in a city where the Aragonese court \
collected Flemish painting: there he discovered the paintings of Jan van Eyck and of \
his successors, and their technique of oil painting. Vasari would later relate \
that he had gone to learn it in Flanders, a legend that nothing confirms. \
Antonello then worked mainly in Sicily and Calabria, where he painted altarpieces and \
portraits. In 1475–1476, he stayed in Venice. There he painted the altarpiece for the church of San \
Cassiano, of which only fragments remain, now in Vienna, and portraits \
that struck the Venetians by their presence, like the Condottiere in the Louvre. The Duke \
of Milan, Galeazzo Maria Sforza, then sought to attract him to his court. Antonello returned \
nonetheless to Messina, where he died in early 1479; his son Jacobello took over \
the studio."""
style = """
Antonello unites the minuteness and light of the Flemish with the geometry and breadth of the \
Italians. His portraits, in bust length, in three-quarter view against a black ground, look at the \
viewer with a new intensity. His stay in Venice played a decisive role: \
Giovanni Bellini and his contemporaries adopted oil painting and the large \
single-piece altarpiece there."""

[[artistes]]
nom = "Giovanni Bellini"
vie = "Venice, c. 1430–1435 – Venice, 29 November 1516"
biographie = """
Giovanni Bellini grew up in the studio of his father, the painter Jacopo Bellini, with \
his brother Gentile. In 1453, his sister Nicolosia married Andrea Mantegna, whose sculptural \
drawing marked his early works. Gradually, Bellini moved away from it and sought a \
softer light, which bathes figures and landscapes; the arrival of Antonello da \
Messina in Venice, in 1475, encouraged him to adopt oil painting. He became the \
official painter of the Republic: he worked on the great canvases of the Doge's \
Palace, destroyed in the fire of 1577, and painted the portrait of Doge Leonardo \
Loredan. His studio, very active, trained an entire generation, to which Giorgione \
and Titian are linked. In 1506, Albrecht Dürer, passing through Venice, wrote that he was \
very old, but still the best painter in the city. To the end of his long \
life, Bellini renewed himself, with the Feast of the Gods and the Young Woman with a Mirror."""
style = """
Bellini is the founder of Venetian painting: he makes colour and \
light, more than drawing, the soul of the picture. His Madonnas with Child, of grave \
tenderness, his saints placed in sunlit landscapes and his great \
sacre conversazioni fixed for a century the model of the Venetian altarpiece."""

[[artistes]]
nom = "Vittore Carpaccio"
vie = "Venice, c. 1465 – Venice or Capodistria, c. 1525–1526"
biographie = """
Little is known of the youth of Vittore Carpaccio, born into a family of \
Venetian merchants. His training remains obscure, but his art owes much to Gentile \
Bellini, the painter of the city's great ceremonies. Carpaccio established himself as the \
painter of the scuole, the confraternities of Venice, which commissioned for their halls \
great narrative cycles. For the Scuola di Sant'Orsola, he painted from 1490 to about 1495 \
the Stories of Saint Ursula. For the Scuola di San Giovanni Evangelista, he \
depicted a miracle of the relic of the Cross near the Rialto bridge, then of wood. \
From 1502 to 1507, he decorated the Scuola di San Giorgio degli Schiavoni, the confraternity of the \
Dalmatians, with Saint George slaying the dragon and Saint Augustine in his study, \
still in place. When Venetian taste turned to Giorgione and Titian, he \
worked more and more for clients on the mainland and in Istria. His son \
Benedetto, also a painter, settled in Capodistria."""
style = """
Carpaccio is a storyteller. He sets holy legends in the Venice of his \
day, with its palaces, canals, costumes and familiar objects, described with \
an inventory's precision. His clear, even light, his compositions ordered \
like stage scenes, were rediscovered in the nineteenth century by John Ruskin."""

[[artistes]]
nom = "Lorenzo Lotto"
vie = "Venice, c. 1480 – Loreto, 1556 or 1557"
biographie = """
Born in Venice, Lorenzo Lotto spent most of his career far from his city. He \
worked first in Treviso, where he painted the portrait of Bishop Bernardo de' Rossi, \
then in the Marche, at Recanati. In 1509, he was paid for work in the \
Vatican Palace in Rome, at the moment when Raphael was beginning his frescoes there. From 1513 to 1525, he lived \
in Bergamo, where he painted his largest altarpieces and the frescoes of the Suardi chapel \
at Trescore. Back in Venice, he stayed there a few years, but the city was dominated by \
Titian, whose style and success he did not share. He set off again, from one commission to \
the next, between Venice, Treviso and the Marche. From 1538, he noted his works \
and debts in an account book. Old and poor, he retired in 1554 to the \
sanctuary of the Santa Casa of Loreto, as an oblate, and died there. Forgotten, he was \
rediscovered at the end of the nineteenth century by the historian Bernard Berenson."""
style = """
Lotto is the painter of unease. His portraits probe the inner life of their \
sitters, surrounded by objects charged with meaning. His altarpieces surprise by their \
lively gestures, acid colours and unexpected compositions. Independent of Titian, \
attentive to Northern art and to Dürer, he occupies a place apart in Venetian \
painting."""

[[artistes]]
nom = "Le Tintoret"
vie = "Venice, 1518 or 1519 – Venice, 31 May 1594"
biographie = """
Jacopo Robusti, known as Tintoretto, was the son of a Venetian dyer. According to his \
biographer Carlo Ridolfi, he is said to have spent a brief time in Titian's studio, from which he was \
dismissed, and to have trained mostly on his own, drawing from casts \
of Michelangelo's sculptures. The Miracle of the Slave, in 1548, made him famous. He \
married Faustina Episcopi, daughter of a dignitary of the Scuola di San Marco. In 1564, the \
Scuola Grande di San Rocco held a competition for the ceiling of its Albergo room: \
instead of a sketch, Tintoretto installed a finished canvas, which he gave to \
the confraternity. There he would paint, until 1587, more than fifty paintings, one of the \
greatest ensembles ever produced by a single painter. After the fire at the Doge's \
Palace in 1577, he worked on its new decoration, with the Paradise, one of the \
largest canvases in the world. He almost never left Venice and died in 1594; he is \
buried at the Madonna dell'Orto. His daughter Marietta and his son Domenico were his \
assistants."""
style = """
Tintoretto seeks movement and drama: bold foreshortenings, diagonals, violent light \
bursting from the shadow, agitated crowds. He paints fast, with a rapid touch that \
scandalised his contemporaries. Ridolfi relates that he composed his scenes with \
small wax figurines placed in lit boxes. El Greco and Rubens owe \
him much."""

[[artistes]]
nom = "Paolo Véronèse"
vie = "Verona, 1528 – Venice, 19 April 1588"
biographie = """
Paolo Caliari, known as Veronese, was the son of a stonecutter from Verona. He \
trained with the painter Antonio Badile, whose daughter he would later marry. Settled \
in Venice around 1553, he at once received commissions for the ceilings of the Doge's \
Palace, then decorated the church of San Sebastiano, where he would be buried. Around 1560, he painted \
the frescoes of the Villa Barbaro at Maser, built by Palladio: trompe-l'œil, \
landscapes and figures who seem to step into the rooms. His great meals, painted \
for convent refectories, made his fame. In 1573, the tribunal of the \
Inquisition summoned him over a Last Supper judged irreverent, peopled with \
buffoons, German soldiers and dogs; rather than alter the canvas, he \
changed its title, which became The Feast in the House of Levi. With his brother Benedetto and his sons \
Carletto and Gabriele, he ran a prosperous studio, which continued his work after \
his death, in 1588."""
style = """
Veronese is the painter of splendour: majestic architecture, clear skies, \
elegant crowds dressed in silks and brocades. His colour, luminous and silvery, \
laid in great chords, without heavy shadows, made him the model for decorators, \
from Tiepolo to Delacroix. His secular feasts, scarcely religious, also herald the \
taste for spectacle that would be Venice's in the eighteenth century."""

[[artistes]]
nom = "Giambattista Tiepolo"
vie = "Venice, 5 March 1696 – Madrid, 27 March 1770"
biographie = """
Son of a Venetian merchant, Giambattista Tiepolo trained with the painter Gregorio \
Lazzarini. In 1719, he married Maria Cecilia Guardi, sister of the painters Gian Antonio and \
Francesco Guardi. In the 1720s, his frescoes in the Archbishop's Palace at Udine \
made his reputation; he then decorated palaces in Milan, Bergamo and Venice, \
such as the Palazzo Labia with the story of Antony and Cleopatra. From 1750 to 1753, he \
worked in Würzburg, for the Prince-Bishop, at the Residenz: there he painted the Imperial \
Hall and the immense ceiling of the staircase, which represents Olympus and the four \
continents. In 1756, he became the first president of the Venice Academy of \
Painting. In 1762, King Charles III called him to Madrid to decorate the ceilings of \
his new royal palace. He worked there with his sons Giandomenico and Lorenzo, but \
taste was changing, and the neoclassical painter Anton Raphael Mengs rivalled him. \
Tiepolo died in Madrid in 1770."""
style = """
Tiepolo is the last great decorator of the Baroque tradition. He opens ceilings \
onto immense, luminous skies, where figures seen from below float among the \
clouds. His clear palette, his pale and golden colours, his theatrical stagings \
extend the art of Veronese. With him ends great Venetian history painting, \
just before the triumph of neoclassicism."""

[[artistes]]
nom = "Rosalba Carriera"
vie = "Venice, 1673 – Venice, 15 April 1757"
biographie = """
Daughter of an employee of the Republic and a lacemaker, Rosalba Carriera began \
by drawing lace patterns, then painted miniatures for the lids of \
snuffboxes, often on ivory. In the early eighteenth century, she turned to \
pastel and quickly became famous: the Accademia di San Luca in Rome admitted her among its \
members. Grand Tour travellers, princes and sovereigns passing through \
Venice had themselves portrayed by her; the Elector of Saxony, the future Augustus III, \
collected her works. In 1720–1721, she stayed in Paris with the banker and \
collector Pierre Crozat; there she painted the young Louis XV and met Antoine \
Watteau, whose portrait she made. The Académie royale de peinture received her by \
acclamation. In 1730, she worked in Vienna for Emperor Charles VI. She lived in \
Venice with her sisters, Giovanna, who assisted her, and Angela, wife of the painter Giovanni \
Antonio Pellegrini. Afflicted with cataracts, operated on without success, she lost her sight and \
died in 1757."""
style = """
Rosalba Carriera made of pastel, until then a sketching technique, a first-rate \
art. Her portraits, of a vaporous softness, render skin, powder, \
lace and furs with a new lightness. Her Parisian stay launched the \
fashion for pastel portraiture in France, where Maurice Quentin de La Tour and Jean-Baptiste \
Perronneau followed her example."""

[[artistes]]
nom = "Bernardo Bellotto"
vie = "Venice, c. 1721 – Warsaw, 17 November 1780"
biographie = """
Son of Canaletto's sister, Bernardo Bellotto entered his uncle's studio very young, \
where he learned the veduta, the city view, and engraving. In 1742, he left for \
Rome, then painted views of cities in northern Italy, such as Verona and Turin. In \
1747, he settled in Dresden, at the invitation of the Elector of Saxony Augustus III, who \
named him court painter. There he painted for ten years large views of the city and \
its surroundings. The Seven Years' War forced him to leave: he worked in Vienna for \
the Empress Maria Theresa, then in Munich. Back in Dresden, he found a city \
devastated by the Prussian bombardments of 1760. After the death of Augustus III, he \
went to Warsaw, where King Stanisław August Poniatowski made him his court painter. \
He painted more than twenty views of the city there and died in Warsaw in 1780."""
style = """
Bellotto pushes the veduta towards exactness: very wide views, architecture described \
stone by stone, cold light and sharp shadows. Less brilliant than his uncle, more \
grave, he also paints the cities of Central Europe. His views of Warsaw served to \
rebuild the old town, destroyed during the Second World War."""

[[artistes]]
nom = "Pietro Longhi"
vie = "Venice, 5 November 1701 – Venice, 8 May 1785"
biographie = """
Pietro Falca, son of a Venetian goldsmith, took the name Longhi when he became a \
painter. He trained in Verona with Antonio Balestra, then in Bologna with \
Giuseppe Maria Crespi, a painter of scenes of everyday life. His beginnings were those \
of a history painter: in 1734, he painted in fresco the Fall of the Giants on \
the staircase of the Palazzo Sagredo in Venice. But around 1740, he found his path with \
small paintings showing the life of Venetian patricians: the dancing lesson, the \
concert, the toilette, the visit, the ridotto where one gambled masked. These scenes pleased \
the nobility of the city, who recognised themselves in them. The playwright Carlo Goldoni, who portrayed \
the same society in the theatre, hailed his talent in a poem. Longhi took part in the life \
of the Venice Academy and from 1763 directed a drawing school. His son \
Alessandro became a renowned portraitist."""
style = """
Longhi is the chronicler of eighteenth-century Venice: small formats, figures a \
little stiff like dolls, soft colours, peaceful interiors. Without the biting \
satire of his English contemporary William Hogarth, he observes with a light \
irony the rites of an aristocracy at play. His paintings are today a precious \
source on the costumes, masks and interiors of his time."""

[[artistes]]
nom = "Francesco Guardi"
vie = "Venice, 5 October 1712 – Venice, 1 January 1793"
biographie = """
Francesco Guardi was born in Venice into a family of painters originally from the Trentino. On \
the death of their father, Domenico, in 1716, the family studio passed to his elder brothers, \
and above all to Gian Antonio, with whom Francesco painted for years religious \
pictures and copies. Their sister Maria Cecilia married Giambattista Tiepolo in 1719. \
After Gian Antonio's death, in 1760, Francesco devoted himself to views of Venice and \
to capricci, imaginary landscapes of ruins and lagoons. He worked for \
foreign travellers and for Venetian connoisseurs, in the wake of Canaletto, \
but with an increasingly free manner. In 1782, he was commissioned to paint the \
festivities offered in Venice to Pope Pius VI and the Grand Dukes of Russia. He was admitted \
to the Academy only late, as a perspective painter. He died in Venice at the very \
start of 1793; his son Giacomo continued to sell views of the city."""
style = """
Guardi paints a vibrant, shifting Venice, made of rapid touches, reflections and \
sketched silhouettes, under grey and silvery skies. Less exact than Canaletto, \
he captures atmosphere more than architecture. Unrecognised in his lifetime, he was admired \
in the nineteenth century, and has been seen as a distant precursor of the Impressionists."""
