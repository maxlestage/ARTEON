mur = "nord"
position = 0
largeur = 2.4

[[oeuvres]]
titre = "The Rhinoceros"
artiste = "Pietro Longhi"
annee = "1751"
image = "rhinoceros.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Pietro_Longhi_-_The_Rhinoceros_-_WGA13408.jpg"
technique = "Oil on canvas, 62 × 50 cm"
collection = "Ca' Rezzonico, Museum of the Venetian Eighteenth Century, Venice"
note = "Clara, the rhinoceros who toured Europe, exhibited at the Venice carnival before masked spectators."
description = """
In a plank enclosure, its floor strewn with straw, an Indian rhinoceros chews a \
tuft of hay. It fills the whole lower half of the painting, in profile, its \
thick skin folded like armour. Behind a barrier, spectators watch it. \
On the left, its keeper, in a brown coat, brandishes the animal's horn and a \
whip. Beside him, an unmasked man in a blue jacket, then two figures \
dressed in the bauta, the Venetian carnival disguise, with tricorne, black cape and \
white mask. Behind them, three women, one of whom wears a small black oval mask. \
On the right, a young man in a red coat smokes a pipe. On the wall, a cartellino bears \
an inscription."""
evocation = """
The painting is first of all a document: it shows a real beast, Clara, a female \
rhinoceros from India, whom the Dutch captain Douwemout van der Meer took around \
Europe for seventeen years. But Longhi is as interested in the \
spectators as in the animal. The masked Venetians, impassive, seem as strange \
as the beast they contemplate, and this play of gazes creates a discreet irony. The \
painting bears witness to the scientific curiosity of the Age of Enlightenment and to the Venetian \
taste for carnival spectacles, where one came, behind a mask, to see the \
wonders of the world."""
histoire = """
Clara arrived in Venice in January 1751 and caused a sensation during the carnival. The \
patrician Giovanni Grimani then commissioned from Longhi this "true portrait", as the \
inscription on the cartellino states, which also gives the year and the painter's name. Longhi \
painted at least one other version, now in the National Gallery in London. The \
Grimani canvas belongs to the civic museums of Venice and is exhibited at Ca' \
Rezzonico, a palace on the Grand Canal that became in 1936 the museum of the Venetian eighteenth century, where \
it sits beside many other scenes by the painter."""
facture = """
Longhi paints small cabinet pictures, made to be looked at closely, in the \
tradition of genre scenes. His touch is fine, his colours soft, with \
harmonies of browns, whites and pale blues. The figures, a little stiff, \
almost dolls, are lined up as on the stage of a small theatre. The animal, on the \
other hand, is rendered with concern for exactness: the weight of the body, the folds of \
the skin, down to the dung left on the floor."""
details = [
  "The horn that the keeper brandishes: Clara had lost it shortly before.",
  "The cartellino, at upper right, with the dedication to Giovanni Grimani.",
  "The moretta, the small black mask that women held in their teeth.",
  "The young man in a red coat smoking a pipe, on the right.",
]
themes = ["animal", "carnival", "masks", "curiosity", "daily life"]
anecdote = """
Clara was the most famous animal of her century: engravings, medals and \
figurines bearing her likeness were sold, and Jean-Baptiste Oudry painted her life-size \
in Paris in 1749. She died in London in 1758."""
