[[oeuvres]]
titre = "The Scream"
artiste = "Edvard Munch"
annee = "1893"
image = "cri.jpg"
technique = "Tempera and crayon on cardboard, 91 × 73.5 cm"
collection = "Nasjonalmuseet, Oslo"
note = "On a bridge, beneath a blood-coloured sky, a figure covers its ears: the very image of modern anguish."
description = """
In the foreground, a hairless human figure, with a pale face hollowed like a skull, stands on a bridge or raised road, bordered by a railing that runs diagonally to the left. It raises its hands to its cheeks, eyes wide, mouth open in a cry or a howl. Its dark body undulates like a flame. Further along the bridge, two figures in hats walk away, indifferent. Behind, a midnight-blue fjord winds between hills, with two small boats. Above, the sky is streaked with long undulating bands of red, orange and yellow, like a conflagration."""
evocation = """
Munch recounted several times the experience from which the painting was born: walking at sunset with two friends, he saw the sky turn blood red, stopped, exhausted, and felt a great infinite scream pass through nature. It is therefore not the figure that screams, but the world around it, and it covers its ears. The painting turns anguish into a landscape: the lines of the sky, the water and the body undulate together. It has been seen as the loneliness of modern man, the fear of madness that haunted Munch, the death of his loved ones, and the figure has been compared to a Peruvian mummy exhibited in Paris. The Scream has become the universal icon of anxiety."""
histoire = """
The scene is set on Ekeberg hill, which overlooks Kristiania, present-day Oslo, and its fjord. Munch noted the memory as early as 1892, then painted this version in 1893, while dividing his life between Berlin and Norway. It was exhibited the same year in a series of paintings on love, the core of his Frieze of Life. Munch made several versions of the subject: two in pastel or crayon, a lithograph in 1895, a tempera around 1910. This version entered the National Gallery in Oslo in 1910, thanks to a gift from the collector Olaf Schou. Stolen on 12 February 1994, the day of the opening of the Lillehammer Olympic Games, it was recovered in May of the same year. It is now in the Nasjonalmuseet."""
facture = """
Munch paints on raw cardboard, left visible in places, which gives the work a quick, unfinished look. He mixes tempera, laid on in fluid layers, with strokes of crayon that accentuate the undulations. The colours are arbitrary and violent: the orange-red of the sky answers the blue of the fjord. Two systems of lines are opposed: the rigid straight lines of the bridge, which plunge towards the background, and the curves of the landscape and the body. This expressive distortion, in the service of emotion, makes Munch one of the fathers of Expressionism."""
details = [
  "The hands pressed to the ears, as if to shut out the scream.",
  "The two walkers in hats, at the far end of the bridge, who see nothing.",
  "The two small boats on the fjord, at the centre.",
  "The strip of raw cardboard visible along the right edge.",
  "At lower left, the signature “E. Munch 1893”.",
]
themes = ["anguish", "solitude", "twilight", "expressionism", "nature"]
anecdote = """
In the sky, at upper left, a short sentence is written in pencil: “Can only have been painted by a madman”. Long attributed to a malicious visitor, it was recognised in 2021, through the study of the handwriting, as being in Munch’s own hand."""
