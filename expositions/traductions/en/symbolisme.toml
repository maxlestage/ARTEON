[[artistes]]
nom = "Alfons Mucha"
vie = "Ivančice (Moravia), 24 July 1860 – Prague, 14 July 1939"
biographie = """
Born in Moravia, then part of the Austrian Empire, Alfons Mucha first worked as a theatre scene painter in Vienna, then, thanks to a patron, studied in Munich. He settled in Paris in 1887, attended classes at the Académies Julian and Colarossi and lived precariously from his illustrations. At the end of 1894, almost by chance, he designed the poster for Gismonda for Sarah Bernhardt: posted across Paris in January 1895, it caused a sensation. The tragic actress entrusted him with all her posters for six years, and the printer Champenois took him under contract. Posters, decorative panels, jewellery for Fouquet, advertisements: his style became the very image of Art Nouveau. He decorated the Bosnia and Herzegovina Pavilion at the 1900 Exposition Universelle. After several stays in the United States, he returned to Bohemia in 1910 to devote nearly twenty years to the Slav Epic. He designed the first banknotes and stamps of independent Czechoslovakia in 1918. Arrested and interrogated by the Gestapo in 1939, he died shortly afterwards in Prague."""
style = """
Mucha created an immediately recognisable language: an ideal woman, often in profile, her hair spread in arabesques, set within a circle or halo and surrounded by flowers, jewels and ornaments. He combines a dark, regular outline with soft colours, and blends Byzantine, Japanese and Slavic sources. His Documents décoratifs of 1902, a collection of models, spread his style through the applied arts. Rediscovered in the 1960s, he inspired the psychedelic poster and comic art."""

[[artistes]]
nom = "Pierre Puvis de Chavannes"
vie = "Lyon, 14 December 1824 – Paris, 24 October 1898"
biographie = """
The son of a mining engineer, Pierre Puvis de Chavannes gave up engineering studies after an illness and discovered Italy, which decided his vocation. He trained briefly with Delacroix and then with Thomas Couture, but soon found his own way alone. His first submissions to the Salon were often rejected; success came in the 1860s with large allegorical compositions intended for the museum in Amiens. He then became the great mural painter of the Third Republic: the life of Saint Geneviève at the Panthéon, the Sacred Grove for the amphitheatre of the Sorbonne, the decorations of the museums of Lyon and Rouen, of the Paris Hôtel de Ville and of the Boston Public Library. In 1890 he took part in founding the Société Nationale des Beaux-Arts, of which he became president. Admired by young painters and institutions alike, he married in 1897 Princess Marie Cantacuzène, his companion of long standing, who died a few months before him."""
style = """
Puvis simplifies forms, reduces colours to pale, matt tones, and suppresses detail and movement to attain a calm, timeless grandeur. His figures, motionless in stripped-down landscapes, suggest an idea rather than tell a story. This language of silence and flat colour made him the common precursor of Symbolism, of Gauguin, of Seurat, of the Nabis and even of the young Picasso of the Blue Period."""

[[artistes]]
nom = "Gustave Moreau"
vie = "Paris, 6 April 1826 – Paris, 18 April 1898"
biographie = """
The son of a Parisian architect, Gustave Moreau entered the École des Beaux-Arts in the studio of François-Édouard Picot, but it was Théodore Chassériau, his elder, who marked him most. From 1857 to 1859 he stayed in Italy, where he tirelessly copied the masters of the Renaissance. He triumphed at the Salon of 1864 with Oedipus and the Sphinx, then exhibited in 1876 his Salome and the watercolour The Apparition, which fascinated writers from Huysmans to Jean Lorrain. Gradually he withdrew from the Salon and worked in the secrecy of his studio, accumulating projects and sketches. Elected to the Académie des Beaux-Arts in 1888, he became a professor at the École des Beaux-Arts in 1891: his teaching, free and open, trained Matisse, Rouault and Marquet. Shortly before his death he turned his house on rue de La Rochefoucauld into a museum, which he bequeathed to the State with several thousand works. The Musée Gustave-Moreau opened in 1903."""
style = """
Moreau is the great painter of myth and learned reverie. He overloads his canvases with architecture, jewels and ornaments borrowed from India, Persia and Byzantium, traced with a fine brush on grounds sometimes painted very freely, almost abstract. His heroines, Salome, Semele, Galatea, embody the femme fatale or the unattainable ideal. He gave Symbolism its most precious images, and the freedom of his sketches appealed to the Fauves and the Surrealists."""

[[artistes]]
nom = "Odilon Redon"
vie = "Bordeaux, 20 April 1840 – Paris, 6 July 1916"
biographie = """
Bertrand Jean Redon, known as Odilon, spent a solitary childhood on the family estate of Peyrelebade, in the Médoc. He studied architecture for a time, then painting in Paris in Gérôme’s studio, without success. His real encounter was with the engraver Rodolphe Bresdin, in Bordeaux, who taught him etching and the freedom of the imagination. For more than twenty years Redon worked in black, in charcoal and lithography: the albums Dans le rêve in 1879, À Edgar Poe, Les Origines or Hommage à Goya peopled his work with floating eyes, severed heads and monsters. Huysmans celebrated him in À rebours in 1884, and the Symbolist poets, Mallarmé foremost, became his friends. Around 1890, after the birth of his son Arï, he turned to colour, pastel and oil, and painted flowers, myths and large decorative schemes, such as those of the Abbey of Fontfroide. The Nabis revered him, and he exhibited at the Armory Show in New York in 1913."""
style = """
Redon wished, in his own words, to put the logic of the visible at the service of the invisible. His blacks, of a deep velvety quality, give life to creatures born of dream and of the science of his time, microbes and hybrid beings. His colours, later, are laid on in precious touches that seem to radiate. Independent of any school, he opened the way for the Nabis, Matisse and the Surrealists, who saw in him a precursor."""

[[artistes]]
nom = "John Everett Millais"
vie = "Southampton, 8 June 1829 – London, 13 August 1896"
biographie = """
A child prodigy, John Everett Millais entered the Royal Academy Schools at the age of eleven, the youngest pupil ever admitted. In 1848 he founded, with William Holman Hunt and Dante Gabriel Rossetti, the Pre-Raphaelite Brotherhood, which wished to return to the sincerity of the painters before Raphael and to the scrupulous study of nature. His Christ in the House of His Parents, in 1850, provoked a scandal, and Charles Dickens attacked it violently. The critic John Ruskin came to the group’s defence; Millais fell in love with Ruskin’s wife, Effie Gray, who obtained an annulment of her marriage and married the painter in 1855. Millais then became one of the richest and most popular artists in England, a sought-after portraitist and the author of sentimental scenes such as Bubbles, used in a soap advertisement. Made a baronet in 1885 and elected president of the Royal Academy a few months before his death, he was buried in St Paul’s Cathedral."""
style = """
In his Pre-Raphaelite years, Millais painted with minute precision, from nature, in clear, brilliant colours, and composed scenes laden with symbols. He then evolved towards a broader, freer touch, inspired by Velázquez and the old masters. Ophelia remains one of the most reproduced images in English painting and the model for a whole line of beautiful Symbolist dead women."""

[[artistes]]
nom = "Dante Gabriel Rossetti"
vie = "London, 12 May 1828 – Birchington-on-Sea, 9 April 1882"
biographie = """
The son of Gabriele Rossetti, an Italian poet and patriot exiled in London and a scholar of Dante, and brother of the poet Christina Rossetti, Dante Gabriel grew up between painting and literature. A pupil for a time of Ford Madox Brown, he founded the Pre-Raphaelite Brotherhood in 1848 with Millais and Hunt. He met Elizabeth Siddal, who became his model, his pupil and, in 1860, his wife; her death in 1862 devastated him. Settled afterwards in Chelsea, in a house on Cheyne Walk where he kept a menagerie, he painted a series of ideal female figures, inspired by Fanny Cornforth, Alexa Wilding and above all Jane Morris, wife of his friend William Morris. His Poems, published in 1870, were attacked as immoral; exhausted and dependent on chloral, he suffered a serious breakdown in 1872 and died ten years later on the coast of Kent. He influenced Burne-Jones, Morris and the whole Aesthetic movement."""
style = """
Painter and poet, Rossetti blends the two arts: he wrote sonnets for his paintings and inscribed verses on their frames. After the precision of his early Pre-Raphaelite days, he painted half-length women, with abundant hair, full lips and a distant gaze, in rich, warm colours. These icons of beauty and dream heralded European Symbolism and the Aestheticism of the end of the century."""

[[artistes]]
nom = "John William Waterhouse"
vie = "Rome, 1849 (baptised 6 April) – London, 10 February 1917"
biographie = """
The son of two English painters settled in Rome, John William Waterhouse spent his early years in Italy before the family returned to London. He helped his father in the studio, then in 1870 entered the Royal Academy Schools. His first successes were classical scenes in the taste of Lawrence Alma-Tadema, such as Saint Eulalia, in 1885. With The Lady of Shalott, in 1888, he turned to the subjects dear to the Pre-Raphaelites: the Arthurian legend, Tennyson, Keats, Shakespeare and Greek myths. Elected a member of the Royal Academy in 1895, he painted Hylas and the Nymphs the following year, then a long series of sorceresses, mermaids and nymphs. Settled in St John’s Wood, he led a quiet life, married to the painter Esther Kenworthy. His painting, which fell out of fashion after his death in 1917, has found an immense public again since the 1970s."""
style = """
Often called “the modern Pre-Raphaelite”, Waterhouse unites the poetic subjects and dreamy women of Rossetti with the freer touch of French open-air painting and of Jules Bastien-Lepage. His compositions are clear, his figures solidly drawn, his landscapes vibrant. He carried the Pre-Raphaelite tradition into the twentieth century and fixed, for the general public, the image of the heroines of legend and mythology."""

[[artistes]]
nom = "Arnold Böcklin"
vie = "Basel, 16 October 1827 – San Domenico di Fiesole, 16 January 1901"
biographie = """
Born in Basel, Arnold Böcklin studied painting in Düsseldorf, then travelled to Geneva, Brussels and Paris before discovering Rome in 1850: Italy and its ancient landscape became the heart of his work. The beginnings were difficult, and for a long time he lived in straitened circumstances. He taught for a while at the newly founded art school in Weimar, painted frescoes in Basel, then lived in turn in Munich, Florence and Zurich. His canvases peopled with centaurs, naiads, fauns and tritons first brought him mockery, then, from the 1880s, immense fame, above all in Germany, where he was regarded as the greatest living painter. In 1872 he painted himself with Death playing the violin behind his shoulder. Struck by a stroke in 1892, he settled near Florence, at Fiesole, where he died in 1901. Several of his children died young, and death is one of his constant themes."""
style = """
Böcklin blends the classical heritage of Italy with a Nordic imagination, powerful and at times brutal. His landscapes, rigorously constructed, take on a strange atmosphere, and his mythological creatures have a fleshly, almost comic presence. His painting, in frank colours, often in tempera, nourished German Symbolism, Max Klinger, Giorgio De Chirico and metaphysical painting, then the Surrealists, who admired his mystery."""

[[artistes]]
nom = "Edvard Munch"
vie = "Ådalsbruk, Løten (Norway), 12 December 1863 – Ekely, near Oslo, 23 January 1944"
biographie = """
Edvard Munch grew up in Kristiania, present-day Oslo, in a family marked by illness: his mother died of tuberculosis when he was five, his elder sister Sophie when he was thirteen. He abandoned his engineering studies for painting and frequented the Kristiania bohemians. A scholarship took him to Paris in 1889, where he discovered Impressionism, Gauguin and Van Gogh. In 1892 his exhibition in Berlin caused a scandal and had to close after a week: the affair contributed to the birth of the Berlin Secession. Munch lived there for several years and composed the Frieze of Life, a cycle on love, anguish and death, of which The Scream is part. Exhausted by alcohol and breakdowns, he sought treatment in Copenhagen in 1908–1909, then returned to Norway. He painted the large canvases of the Aula of the University of Oslo and lived in seclusion at Ekely. In 1937 the Nazis removed his works from German museums. He bequeathed his output to the city of Oslo."""
style = """
Munch paints states of mind rather than appearances: he simplifies forms, distorts bodies and landscape, and uses violent, symbolic colours. His undulating lines, close to Art Nouveau, unite the figure and its setting in a single emotion. An innovative printmaker, he renewed the woodcut and lithography. He is considered one of the fathers of Expressionism, which developed in Germany in his wake."""

[[artistes]]
nom = "Fernand Khnopff"
vie = "Grembergen (Belgium), 12 September 1858 – Brussels, 12 November 1921"
biographie = """
Fernand Khnopff spent part of his childhood in Bruges, a silent city that would haunt his work. He began studying law, abandoned it for the Académie des Beaux-Arts in Brussels, then discovered in Paris, at the Exposition Universelle of 1878, the works of Gustave Moreau and Edward Burne-Jones. In 1883 he founded, with James Ensor and other young artists, the circle Les XX, a hotbed of the Belgian avant-garde. He then exhibited at Joséphin Péladan’s Rose+Croix Salons in Paris, then at the Vienna Secession, where he enjoyed great success. His sister Marguerite, his favourite model, appears in many of his paintings. He illustrated Georges Rodenbach’s Bruges-la-Morte, designed sets and costumes for the Théâtre de la Monnaie, and wrote for the English review The Studio. In the early twentieth century he had built for himself in Brussels a house-studio conceived as a temple. In 1908 he married Marthe Worms, from whom he was divorced soon after."""
style = """
Khnopff is the most refined of the Belgian Symbolists: motionless figures, fixed gazes, androgynous faces, empty and enigmatic settings. He works with a fine, smooth touch, in pale ranges, often from his own photographs. Silence, memory, withdrawal into oneself and the mystery of desire are his themes. His influence was great in Vienna, notably on Gustav Klimt."""
