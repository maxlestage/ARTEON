[exposition]
ordre = 160
nom_court = "Symbolism"
mouvement = "Symbolism and Art Nouveau"
cadre = "dore"
couleur = "#5e3a6e"
titre = "Symbolism: Dreams, Myths and Visions"
artiste = "Moreau, Redon, Munch, Böcklin, Rossetti, Millais, Mucha…"
dates = "1851–1914"
accroche = "Virtual exhibition · Musée Gustave-Moreau, Paris, and Tate Britain, London"
introduction = """
Against realism and Impressionism, the Symbolists sought to paint what the eye cannot see: dreams, myth, anguish, death and desire. The visit follows this current from the English Pre-Raphaelites of the mid-century to the visions of Redon, by way of Munch’s The Scream, Böcklin’s Isle of the Dead and the Art Nouveau arabesques of Mucha. The building is modelled on Gustave Moreau’s house-studio in Paris, whose very tall great studio is covered with paintings from floor to ceiling, and, for the English room, on the galleries of Tate Britain in London."""
vitrine = "cri.jpg"

[musee]
nom = "Musée Gustave-Moreau"
ville = "Paris, France"
architecte = "Albert Lafon"
construction = "opened in 1903"
presentation = """
At 14 rue de La Rochefoucauld, in the Nouvelle Athènes district, Gustave Moreau’s parents bought a town house in 1852 where the painter would live until his death. As he grew older, Moreau thought about the future of his work: in 1895 he had the architect Albert Lafon raise the house to create two immense superimposed studios, conceived from the outset as a museum and linked by a spectacular spiral staircase. On his death in 1898 he bequeathed to the State the house and everything in it; the museum opened in 1903, with Georges Rouault, his former pupil at the École des Beaux-Arts, as its first curator. Visitors can still see the artist’s small apartment, with its furniture and mementoes, then the studios, where paintings, watercolours and cartoons cover the walls from floor to ceiling, while thousands of drawings sleep in cabinets with pivoting panels."""
ici = """
ARTEON follows the same progression, from the house to the studio, on a single level. The small, low vestibule welcomes visitors from the south with Mucha’s Zodiac. To the north opens The Great Studio, ten metres high, with pinkish-beige walls, where the French canvases crowd the back wall as at Moreau’s. Two side doors lead, to the west, to The Pre-Raphaelite Gallery, square, in the manner of the rooms of Tate Britain, then, to the east, to The Northern Room, the lowest of the three large rooms, where the visit ends."""

