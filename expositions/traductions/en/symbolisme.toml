[[oeuvres]]
titre = "Caresses"
artiste = "Fernand Khnopff"
annee = "1896"
image = "caresses.jpg"
technique = "Oil on canvas, 50.5 × 150 cm"
collection = "Royal Museums of Fine Arts of Belgium, Brussels"
note = "A young man and a sphinx with a cheetah’s body, cheek to cheek: the enigma of desire, painted by the great Belgian Symbolist."
description = """
On a very elongated canvas, a young man with red hair, bare-chested, a blue and grey loincloth tied at the waist, stands at left and looks straight at us. In his right hand he holds a staff topped with wings and a blue ball. Pressed against him is a creature with the body of a spotted cheetah and the head of a woman with blonde hair, her eyes half closed, who leans her cheek against his and rests a paw on his hip. Her long spotted tail unfolds to the right. In the background are a dark cypress, a white wall bearing signs, two blue columns, and a reddish desert landscape beneath a pale sky."""
evocation = """
Khnopff draws on the myth of Oedipus and the Sphinx, and on the canvas that Gustave Moreau had devoted to it in 1864. But the confrontation has become an embrace: the sphinx no longer poses a riddle, she caresses, and the young man seems to hesitate between surrender and resistance. It has been seen as the opposition between mind and sensuality, art letting itself be seduced by the flesh, or the fin-de-siècle theme of the femme fatale. The work long bore the title L’Art, and the winged staff might designate the artist. The two faces, which strangely resemble each other, are inspired by the painter’s sister, Marguerite: the young man’s androgyny blurs the boundary between the sexes still further."""
histoire = """
Khnopff painted this canvas in Brussels in 1896, at the height of his reputation. A founding member of the avant-garde circle Les XX in 1883, he also exhibited in Paris, at Joséphin Péladan’s Rose+Croix Salons, and looked towards England, where he admired Burne-Jones and wrote for the review The Studio. His works were much admired in Vienna: the Vienna Secession gave him a prominent place, and Klimt took a lesson from his enigmatic figures. The painting, known under several titles, L’Art, Caresses or The Caresses of the Sphinx, is now one of the masterpieces of the Symbolist collections of the Royal Museums of Fine Arts of Belgium in Brussels, displayed in the Fin-de-Siècle Museum."""
facture = """
The very elongated frieze format recalls ancient bas-reliefs and obliges the gaze to glide from left to right, from the young man’s face to the sphinx’s tail. Khnopff paints with a fine, smooth touch, in a pale range of beiges, ochres and pinks, barely enlivened by the blue of the columns and the loincloth. He often worked from his own photographs, which he retouched and recomposed. The even light and the absence of strong shadow give the scene a dreamlike stillness, reinforced by the enigmatic, empty setting."""
details = [
  "The winged staff topped with a blue ball, in the young man’s hand.",
  "The mysterious inscriptions on the white wall at the centre.",
  "The cheetah’s paw resting on the young man’s hip.",
  "The two blue columns standing alone in the landscape, at right.",
]
themes = ["sphinx", "desire", "androgyny", "mythology", "femme fatale"]
anecdote = """
In the early twentieth century Khnopff had built for himself in Brussels a white, blue and gold house-studio, conceived as a temple dedicated to himself. It was demolished in 1938; only photographs remain."""
