[[oeuvres]]
titre = "La Vicaría (The Spanish Wedding)"
artiste = "Marià Fortuny"
annee = "1868–1870"
image = "vicaria.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Mari%C3%A0_Fortuny_-_The_Spanish_Wedding_-_Google_Art_Project.jpg"
technique = "Oil on panel, 60 × 93.5 cm"
collection = "Museu Nacional d'Art de Catalunya, Barcelona"
note = "In the sacristy of a Madrid church, a wedding party in eighteenth-century costume signs the register: the painting that made Fortuny’s fame in Paris."
description = """
In a vast room with walls hung with tapestries, a wedding has just been celebrated. On the left, before shelves of books, the groom leans over the table to sign the register, under the eye of a priest in a black cassock. At the centre, the bride, in a gown of pale silk, waits surrounded by the witnesses, by friends in pink dresses and by men in embroidered coats, tricorn hats and satin breeches. Behind them, a wrought-iron grille closes off a chapel. On the right, on a wooden bench, a bullfighter in his suit of lights and a manola in a mantilla watch the scene, while an old man bare to the waist, a mendicant friar, crosses the room. In the foreground, a copper brazier stands on the tiled floor and a paper lies fallen on the ground."""
evocation = """
Fortuny does not paint a wedding of his own time: he dresses his figures as in the days of Goya, whom he admired, and composes a fanciful Spain, elegant and picturesque, such as Paris collectors loved to dream of. The painting contrasts two worlds: the refined society of the wedding party, at the centre, and the common people, on the right, with the bullfighter and the manola who attend the ceremony as spectators. It has been seen as a comedy of manners, full of irony: everyone plays his part, the priest, the witnesses, the onlookers. The subject, however, counts for less than the spectacle of the painting itself, which transforms silks, gilding and floor tiles into a shimmer of touches. It is this taste for precious detail that Spanish critics called “preciosismo”."""
histoire = """
Fortuny began the painting in Rome in 1868, shortly after his marriage in Madrid to Cecilia de Madrazo, daughter of the painter Federico de Madrazo, and finished it in Paris in 1870. He was then working under contract for the great Parisian dealer Adolphe Goupil. Shown in Goupil’s gallery in the spring of 1870, La Vicaría caused a sensation: Goupil sold it to a woman collector, Mme Cassin, for 70,000 francs, one of the highest prices then paid for a painting by a living artist. Overnight, Fortuny became one of the most sought-after painters in Europe, especially among American collectors. Having passed through several collections, the canvas is today one of the most famous paintings in the Museu Nacional d’Art de Catalunya, in Barcelona."""
facture = """
On a small wooden panel, Fortuny paints with a miniaturist’s meticulousness, with the tip of a very fine brush: each figure measures only a few centimetres. The lively, nervous touch lays on highlights of white and gold that make the silks, embroidery and metal sparkle. The invented setting brings together elements that the painter had drawn in churches and at antique dealers’. The light falls from the upper left and glides over the wedding party, while the sides remain in a golden half-light."""
details = [
  "The groom bent over the table, pen in hand, to sign the register.",
  "The bullfighter and the manola seated on the bench, on the right, as mere spectators.",
  "The copper brazier on the tiled floor, in the left foreground.",
  "The white paper fallen to the ground, in the midst of the red floor.",
  "Fortuny’s signature and the date, in the lower left corner.",
]
themes = ["wedding", "spain", "costumes", "preciosismo", "goya"]
anecdote = """
Fortuny’s son, Mariano Fortuny y Madrazo, born in 1871, became a celebrated designer in Venice: he invented the Delphos gown, in finely pleated silk, worn by fashionable women in the early twentieth century. His Venetian palace is today the Fortuny museum."""
salle = 2
mur = "sud"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Strolling along the Seashore"
artiste = "Joaquín Sorolla"
annee = "1909"
image = "paseo-orillas-mar.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Joaqu%C3%ADn_Sorolla_y_Bastida_-_Strolling_along_the_Seashore_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 205 × 200 cm"
collection = "Museo Sorolla, Madrid"
note = "The painter’s wife and eldest daughter walk along the beach at Valencia, their white dresses lifted by the wind."
description = """
Two women dressed in white walk on the sand, at the water’s edge. On the left, the older one holds a large straw hat with her hand, from which a long violet veil escapes, streaming behind her in the wind; in her other hand she carries a closed parasol, its fabric swelling. On the right, a young woman with a slim waist, her hair pinned up in a bun, advances bareheaded and holds her hat in her hand; her gaze turns to the side. The painter sees them from a slightly plunging viewpoint: there is no horizon, only the blue band of the sea and the foam of the waves, at the top, and the golden sand, at the bottom. The violet shadows of the two women stretch across the beach."""
evocation = """
Sorolla here paints his wife, Clotilde García del Castillo, and their eldest daughter, María, in the summer of 1909, on a beach at Valencia. The whole painting is an image of family happiness and of the leisure of the bourgeoisie in the early twentieth century: one strolls by the water, in summer dresses, for the pleasure of air and light. But the real subject is perhaps the wind: it lifts the veils, presses the dresses to the body, swells the parasol, and gives the scene a movement that seems caught in flight. The whites, which pick up the blue reflections of the sea and the gold of the sand, show what Sorolla sought above all: to paint Mediterranean light, the most dazzling there is, in the open air and without cheating."""
histoire = """
In early 1909, Sorolla triumphed in New York: the exhibition devoted to him by the Hispanic Society of America drew nearly 160,000 visitors in a month, and most of the canvases were sold. Back in Spain, he spent the summer at Valencia, his native city, with his family, and painted on the beach a series of large pictures, among them this one. He did not sell it: the canvas stayed in his house in Madrid, built in 1910 and 1911. After the painter’s death, in 1923, his widow bequeathed the house and a large part of the works to the Spanish state; the Sorolla museum opened its doors there in 1932. The painting, one of the museum’s best loved, has been reproduced on countless posters and postcards."""
facture = """
Sorolla paints on the spot, at the water’s edge, on a very large canvas, with a broad, rapid, rich touch, laid down without retouching. The white dresses are made of dozens of shades: blue, mauve, pink, pale yellow, depending on whether the fabric receives sun or shade. The shadows, coloured violet, come from the lessons of Impressionism, but the drawing remains firm. The plunging framing, without sky, and the cropping of the figures recall photography and Japanese prints."""
details = [
  "The long violet veil flying off Clotilde’s hat.",
  "The white parasol that the wind swells like a sail.",
  "The straw hat that María holds in her hand, with its dark blue ribbon.",
  "The violet shadows of the two women on the sand.",
  "The signature and date, at lower left.",
]
themes = ["sea", "light", "wind", "family", "open air"]
anecdote = """
Sorolla’s father-in-law, Antonio García Peris, was a photographer in Valencia. Many photographs survive of the painter at work on the beach, before immense canvases, sometimes sheltered from the sun beneath a parasol or a stretched cloth."""
salle = 2
mur = "nord"
place = 2
largeur = 2.0

[[oeuvres]]
titre = "Ramon Casas and Pere Romeu on a Tandem"
artiste = "Ramon Casas"
annee = "1897"
image = "tandem.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Ramon_Casas_-_Ramon_Casas_and_Pere_Romeu_on_a_Tandem_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 191 × 215 cm"
collection = "Museu Nacional d'Art de Catalunya, Barcelona"
note = "The painter and his friend, proprietor of the tavern Els Quatre Gats, pedal together: the emblem of Barcelona’s modernista bohemia."
description = """
Two bearded men, dressed in white, pedal a tandem, seen in profile, against a plain background the colour of kraft paper. At the front, Ramon Casas, wearing a canvas hat, pipe in mouth, leans over the handlebars, a dark jacket rolled up in front of him. Behind, Pere Romeu, tall and thin, a white cap on his head, sits upright and turns towards us a face tense with effort. Both wear baggy knickerbockers, high striped socks and low shoes. The black bicycle, with its slender wheels, fills the whole width of the painting. In the distance, on the left, a simple line draws the silhouette of Barcelona, with a factory chimney. At upper left, a few tree leaves protrude into the frame."""
evocation = """
This humorous double portrait is a manifesto. At the end of the nineteenth century, the bicycle was the very symbol of modernity, speed and sport, and the tandem speaks of friendship and shared enterprise: Casas and Romeu had just launched Els Quatre Gats together, a tavern that would become the heart of Catalan modernisme. The painting gently mocks its two heroes, one absorbed in his pipe, the other grimacing, and takes the opposite tack to official painting and its grand subjects. It also expresses the pride of an industrial Barcelona, whose chimneys appear on the horizon, open to Paris and to the avant-garde. When Casas replaced it, in 1901, with a canvas in which the two friends ride in an automobile, the joke became an image of the passage from one century to the next."""
histoire = """
Pere Romeu, who had frequented the Chat Noir cabaret in Paris, opened in June 1897, with the support of Casas and Santiago Rusiñol, the tavern Els Quatre Gats, on the ground floor of the Casa Martí, a Neo-Gothic building by the architect Josep Puig i Cadafalch. Casas painted this large picture to decorate the room. According to several sources, an inscription in Catalan, now cut off, appeared on the right side. In 1901, the canvas was replaced by Ramon Casas and Pere Romeu in an Automobile, and the magazine Pèl & Ploma reproduced the two images as the end of the nineteenth century and the beginning of the twentieth. The painting then passed into private hands; the Barcelona museum bought it in 1963. A copy adorns the tavern today, still open."""
facture = """
Casas here draws on the poster, an art of which he was one of the masters in Spain: heavy black outlines, flat areas of colour, a plain background left almost empty, like the paper of a lithograph. The barely prepared canvas shows through in places. The drawing, extremely sure, says everything in a few lines: the tension of the legs, the bent back, the effort. Only the faces, the striped socks and the details of the bicycle are treated with greater precision."""
details = [
  "Casas’s pipe, at the front, as he leans over the handlebars.",
  "Pere Romeu’s gaze, turned towards the viewer.",
  "The silhouette of Barcelona and its factory chimney, on the left, on the horizon.",
  "The lantern fixed to the front of the tandem.",
  "The brightly coloured striped socks of the two cyclists.",
]
themes = ["bicycle", "friendship", "modernisme", "humour", "barcelona"]
anecdote = """
In February 1900, Els Quatre Gats hosted the first solo exhibition of an eighteen-year-old painter, Pablo Picasso, a regular at the tavern: he hung there a series of portraits of his friends, drawn in response to Casas’s famous charcoal portraits."""
salle = 2
mur = "nord"
place = 6
largeur = 2.15

[[oeuvres]]
titre = "The Witches of San Millán"
artiste = "Ignacio Zuloaga"
annee = "1907"
image = "brujas-san-millan.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Las_brujas_de_San_Mill%C3%A1n_-_Ignacio_Zuloaga_Zabaleta.jpg"
technique = "Oil on canvas, 204 × 198 cm"
collection = "Museo Nacional de Bellas Artes, Buenos Aires"
note = "Seven old women of Castile, huddled together in the night: Zuloaga’s Black Spain, bought by Buenos Aires in 1910."
description = """
Against a background of dark hills, under a night sky, seven old women stand pressed close together. On the left, two women standing, dressed in black: one, in profile, holds a distaff; the other, with big round spectacles, carries a wicker basket on her arm. At the centre, two women seated on the ground, wrapped in brown and red shawls, raise their eyes. On the right, a woman bent over her stick pokes her head out of her cloak, and another, draped in a green shawl, eyes half closed, stands motionless; a last one, in the foreground, is seen from behind. In front of them, set on the ground, is a tin lantern. A cold light strikes the wrinkled faces and the gnarled hands."""
evocation = """
The title speaks of witches, but the painting shows no magic: only elderly peasant women, with their tools and poor clothes, made disquieting by the night and the lighting. Zuloaga takes up a Spanish tradition, that of Goya’s witches and old women, to paint a Castile that is harsh, poor and unmoving. This is the Spain that the writers of the Generation of 1898, after the loss of the last colonies, wanted to face squarely, far from happy folklore. Critics of the day readily contrasted this Black Spain of Zuloaga with the white, luminous Spain of Sorolla. The faces, painted with respect, nevertheless give these women a grave, almost sculptural dignity."""
histoire = """
Zuloaga painted the canvas in the last months of 1907 in Segovia, where his uncle, the ceramist Daniel Zuloaga, lived; he had old Segovian women and servants of his uncle pose. The painting was shown in 1908 at the Salon of the Société nationale des beaux-arts in Paris, then in New York in 1909. In 1910, Zuloaga was the best-represented painter at the International Centennial Art Exhibition in Buenos Aires, which celebrated the hundred years of the May Revolution: he showed thirty-six works there. On that occasion, the Argentine state bought several of his canvases, this one among them, for the National Museum of Fine Arts, where it still hangs."""
facture = """
Zuloaga composes his picture like a stage scene: the figures stand out against a flat background, almost a painted set. The light, cold and violent, falls on the heads like a spotlight, in the manner of the Spanish tenebrists of the seventeenth century. The colours are muted, blacks, browns, dulled greens and dark reds, and the heavily stressed drawing underlines every wrinkle. The figures are organised in triangles, around the two seated women."""
details = [
  "The round spectacles of the standing woman, which give her a strange air.",
  "The distaff loaded with wool, on the left.",
  "The tin lantern set in the foreground.",
  "The woman bent over her stick, poking her head out of her cloak.",
]
themes = ["old age", "castile", "night", "black spain", "witches"]
anecdote = """
Zuloaga was also a collector: in his Paris studio he owned a large canvas by El Greco, today in the Metropolitan Museum in New York under the title The Opening of the Fifth Seal. The young Picasso saw it there; it is often cited among the sources of Les Demoiselles d’Avignon."""
salle = 2
mur = "sud"
place = 6
largeur = 2.0

[[oeuvres]]
titre = "The Valley of Mexico from the Santa Isabel Mountain Range"
artiste = "José María Velasco"
annee = "1875"
image = "valle-de-mexico.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jos%C3%A9_Mar%C3%ADa_Velasco_-_The_Valley_of_Mexico_from_the_Santa_Isabel_Mountain_Range_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 137.5 × 226 cm"
collection = "Museo Nacional de Arte (MUNAL), Mexico City"
note = "From the top of a hill, the Valley of Mexico stretches away to the snow-capped volcanoes: the landscape that became the emblem of the nation."
description = """
The gaze starts from a hill covered with red rocks and scrub, in the foreground, and plunges down onto an immense plain. On the left, at the foot of the rocks, an Indigenous woman in a red skirt, a burden on her back, walks with a child. Further off, a rounded knoll hides part of the valley; behind it stretch the pale waters of Lake Texcoco and flat lands where tracks can be made out and, far in the distance, the city of Mexico. On the horizon, to the left, rise the two snow-covered volcanoes, Popocatépetl and Iztaccíhuatl. The sky takes up nearly half of the canvas: great white and grey clouds pile up in it, and a shower falls in the distance, on the right."""
evocation = """
Velasco does not merely paint a fine panorama: he makes the Valley of Mexico, cradle of the ancient Aztec Tenochtitlan and heart of the country, an image of the whole nation. The volcanoes, tied to a legend of unhappy lovers, the city, the lakes and the Indigenous woman in the foreground bring together nature, history and the people. In a Mexico barely emerging from the wars of the Reform and from the French intervention, this peaceful, grandiose landscape offers an image of unity and pride. Historians also see in it the eye of a scientist: every rock, every plant, every cloud is observed with a naturalist’s exactness. The painting has become one of Mexico’s visual symbols."""
histoire = """
Velasco lived at the foot of the Tepeyac, north of Mexico City, and ceaselessly roamed the hills overlooking the valley. Between 1875 and 1892 he painted a dozen views of it, and this one, taken from the Cerro de Santa Isabel, is the most famous. His large landscapes then represented Mexico at international exhibitions, in Philadelphia, Paris and Chicago, and earned him a renown that extended beyond his country. The canvas belongs today to the Museo Nacional de Arte, in Mexico City, which holds the most important group of his works. In 2025, the National Gallery in London devoted an exhibition to Velasco, the first it had dedicated to a Latin American artist."""
facture = """
A pupil of the Italian landscape painter Eugenio Landesio at the Academy of San Carlos, Velasco builds his picture with rigour: a dark, detailed foreground, a valley that grows lighter as it recedes, bluish mountains on the horizon. Aerial perspective, which pales the colours in the distance, gives an impression of immense space. His scientific training can be read in the precision of the rocks, the vegetation and the clouds. Certain elements, such as the peaks, are recomposed from memory."""
details = [
  "The two snow-capped volcanoes, on the left, on the horizon.",
  "The woman in the red skirt and the child going down the path, at lower left.",
  "The shower falling beneath the clouds, in the distance on the right.",
  "The pale waters of Lake Texcoco, in the middle of the plain.",
]
themes = ["landscape", "valley", "volcanoes", "nation", "mexico"]
anecdote = """
At the Academy of San Carlos, where he taught perspective and landscape, Velasco counted among his students the young Diego Rivera, who later paid tribute to him as one of his masters."""
salle = 3
mur = "nord"
place = 2
largeur = 2.26

[[oeuvres]]
titre = "The Offering"
artiste = "Saturnino Herrán"
annee = "1913"
image = "la-ofrenda.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Saturnino_Herr%C3%A1n_-_The_offering_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 182 × 210 cm"
collection = "Museo Nacional de Arte (MUNAL), Mexico City"
note = "For the Day of the Dead, a family crosses the canals of Xochimilco in a boat laden with cempasúchil flowers."
description = """
A long flat-bottomed boat, a trajinera, glides over the green water of a canal. It is loaded with big sheaves of orange flowers, the cempasúchiles, or marigolds. Standing at the centre, a young man in a white shirt, a stem in his hand, carries a bouquet on his shoulder. Behind him, an old man with a white moustache and a broad hat holds the long pole that propels the boat. On the left, a bearded man, head bowed, wraps himself in his sarape; on the right, a seated woman, seen from behind, carries a sleeping baby in her rebozo, and a little girl looks at us. In the background, beneath the wooden arches of the boat, other crowded boats follow one another along the canal."""
evocation = """
In Mexico, for the Day of the Dead, in early November, graves and altars are decked with cempasúchil, the orange flower whose colour and scent guide, it is said, the souls of the departed. Herrán gathers in the boat all the ages of life: the baby, the little girl, the young man, the woman, the two old men. It has been seen as an image of the river of life that leads everyone towards death, a grave subject treated without the macabre. The canvas was painted in 1913, in the midst of the Mexican Revolution, and some historians read in it the anxiety of a country at war. Above all it asserts a new identity: that of a mestizo and Indigenous Mexico, dignified and reflective, which Herrán places at the centre of great painting."""
histoire = """
Saturnino Herrán was twenty-six when he painted The Offering, in Mexico City, where he spent his whole career without ever going to study in Europe. Trained at the Academy of San Carlos, he sought to paint Mexican subjects with the means of the modern painting of his day, that of Symbolism and modernismo. The canals of Xochimilco, south of the capital, where trajineras laden with flowers and vegetables still ply, provided him with the setting. The painting is today one of the best-known works in the Museo Nacional de Arte, which holds a large part of the artist’s output; he died at thirty-one."""
facture = """
Herrán combines a solid, academic drawing, learned at San Carlos, with a decorative colour: matt, almost dulled greens and ochres, against which the bright orange of the flowers bursts forth. The very tight composition cuts the figures and the boat at the edges of the frame and presses the figures together in the foreground. The plunging viewpoint and the very high horizon line recall the experiments of the European painters of Art Nouveau and Symbolism."""
details = [
  "The sheaves of orange cempasúchil, filling the whole bottom of the boat.",
  "The baby asleep in its mother’s rebozo, on the right.",
  "The grave gaze of the little girl, turned towards us.",
  "The line of crowded boats, in the distance, at upper left.",
  "The signature and date, at lower left.",
]
themes = ["day of the dead", "flowers", "ages of life", "xochimilco", "mexico"]
anecdote = """
Herrán left unfinished his great work, Our Gods, a frieze planned for the new National Theatre of Mexico: at its centre, he imagined the Aztec goddess Coatlicue fused with Christ on the cross, an image of mestizo Mexico."""
salle = 3
mur = "sud"
place = 2
largeur = 2.1

[[oeuvres]]
titre = "Independence or Death!"
artiste = "Pedro Américo"
annee = "1888"
image = "independencia-ou-morte.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Pedro_Am%C3%A9rico_-_Independ%C3%AAncia_ou_Morte_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 415 × 760 cm"
collection = "Museu Paulista (Museu do Ipiranga), University of São Paulo"
note = "On 7 September 1822, on the banks of the Ipiranga, Prince Pedro proclaims the independence of Brazil. The immense canvas measures more than seven metres: it is shown here reduced."
description = """
On a hill of red earth, beside a stream, a group of horsemen in uniform comes to a halt. At the centre, mounted on a bay horse, Prince Pedro raises his sword to the sky. Around him, his companions wave their hats. On the right, the honour guard, in white uniforms and crested helmets, rushes up at a gallop, sabres raised, kicking up dust; some riders cross the stream, in the foreground. Behind them, a low house with a tiled roof. On the left, a barefoot oxherd, a straw hat on his head, has stopped with his oxen and cart to watch the scene. Above, a great sky with golden clouds covers half of the canvas."""
evocation = """
The canvas fixes the founding episode of Brazil: on 7 September 1822, near São Paulo, the prince regent Pedro of Braganza, son of the king of Portugal, broke with Lisbon. Pedro Américo makes it a heroic scene, ordered like a battle, around the gesture of the sword. Historians have stressed that it embellishes the facts: the prince was probably travelling on a mule, with a small escort, in travelling dress. The painter himself maintained that reality inspires the painter but does not enslave him. The oxherd, on the left, introduces the people, mere witnesses to a decision taken by the elites. Reproduced in school textbooks, the image has shaped for generations of Brazilians the representation of their independence."""
histoire = """
In 1886, the commission in charge of the Ipiranga monument, in São Paulo, accepted Pedro Américo’s offer to paint the proclamation of independence for the future building. The contract gave him three years; he painted the canvas in Florence, where he lived, and finished it in 1888, a year ahead of the deadline. It was shown on 8 April 1888 at the Academy of Fine Arts in Florence. Some critics then accused the painter of having imitated battle pictures by Meissonier; historians today see in it rather a deliberate dialogue with the history painting of its time. The canvas is installed in the main hall of the Museu Paulista, where it is still on view, after the museum’s major restoration completed in 2022."""
facture = """
Pedro Américo, trained in Rio de Janeiro and then in Paris, masters all the rules of grand academic history painting. The composition is organised in two masses: the prince’s group, above, on the hill, and the wave of the guard, on the diagonal, which surges towards him. The uniforms, harnesses and horses are detailed with documentary precision. The landscape, the red earth and the vegetation of São Paulo, were studied on the spot."""
details = [
  "Prince Pedro, sword raised, at the top of the hill.",
