[[oeuvres]]
titre = "Caipira Cutting Tobacco (Caipira picando fumo)"
artiste = "Almeida Júnior"
annee = "1893"
image = "caipira-picando-fumo.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Almeida_J%C3%BAnior_-_Caipira_Cutting_Tobacco_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 202 × 141 cm"
collection = "Pinacoteca do Estado de São Paulo"
note = "Seated in the sun before his house, a peasant from the interior of São Paulo cuts his tobacco to roll a cigarette."
description = """
A middle-aged man sits on a wooden beam, in front of his house, in full sun. He wears a white shirt open at the chest and grey canvas trousers, rolled up and stained with earth; he is barefoot. Head bowed, he shaves with a knife a twist of black tobacco that he holds in his left hand; behind his ear, a piece of corn husk will serve to roll the cigarette. Behind him, the wattle-and-daub wall of the house has crumbled and shows the bricks and the wooden lattice; on the right, a door of grey planks. On the ground, dry earth, stones, shavings, and the shadow of foliage dappling the ground, at lower right."""
evocation = """
The caipira is the small peasant of the interior of the state of São Paulo, often of mixed descent, whom city dwellers then regarded with contempt. Almeida Júnior, himself born in a small town of that interior, Itu, paints him life-size, like a hero of history painting, but busy with a slow, everyday gesture. The painting does not mock, does not denounce: it shows the quiet dignity of a man in his poor house, and time passing without haste. In it one sees one of the first images of a Brazil seen from within, freed from the European gaze and from exoticism. For many historians, Almeida Júnior thus foreshadows the search for a Brazilian identity that the modernists would pursue in the 1920s."""
histoire = """
Returning from Paris in 1882 after six years of study, Almeida Júnior settled in São Paulo, but he spent much of his time in Itu and the surrounding countryside. In the 1890s, he abandoned religious and historical subjects for a series of scenes from the life of the caipiras: Caipira picando fumo, in 1893, is the most famous. The canvas belongs today to the Pinacoteca do Estado de São Paulo, the city’s oldest art museum, founded in 1905, which holds a large group of his works. It has become one of the best-known images of nineteenth-century Brazilian painting."""
facture = """
A pupil of Alexandre Cabanel at the École des beaux-arts in Paris, Almeida Júnior applies the rigour of academic drawing to a realist subject, often compared to Courbet and Jules Bastien-Lepage. His great originality lies in the light: a tropical sun, white and overwhelming, which pales the colours of the earth and the wall and carves sharp shadows. The weathered hands, feet and face are painted with particular attention."""
details = [
  "The piece of corn husk tucked behind the peasant’s ear.",
  "The twist of black tobacco and the knife, in his hands.",
  "The bare feet resting on the dry earth.",
  "The crumbling wattle-and-daub wall, showing the wooden lattice.",
  "The signature and date, at lower right.",
]
themes = ["peasant", "labour", "sun", "brazil", "realism"]
anecdote = """
Almeida Júnior died tragically on 13 November 1899, stabbed in a street of Piracicaba by the husband of the woman he loved, to whom he was related. He was forty-nine."""
salle = 4
mur = "sud"
place = 2
largeur = 1.41

[[oeuvres]]
titre = "Portrait of Manuelita Rosas"
artiste = "Prilidiano Pueyrredón"
annee = "1851"
image = "manuelita-rosas.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Retrato_de_Manuelita_Rosas_-_Prilidiano_Pueyrred%C3%B3n.jpg"
technique = "Oil on canvas, 199 × 166 cm"
collection = "Museo Nacional de Bellas Artes, Buenos Aires"
note = "The daughter of Governor Juan Manuel de Rosas, in a red dress, the colour of the Federalist party: an official portrait commissioned by supporters of the regime."
description = """
A young dark-haired woman stands full-length in a drawing room hung with dark drapery. She wears a large red velvet dress with flounces, covered with embroidered white lace, and ribbons at the waist; her shoulders are bare. A diadem glitters in her hair, which is adorned with a red flower, and a necklace of stones encircles her neck; gold bracelets clasp her wrists. Her right hand rests on a marble console, on a letter; beside it, a large porcelain vase holds a bouquet of flowers. On the right, an armchair upholstered in red velvet. The face, barely smiling, turns towards us gently."""
evocation = """
Manuela Rosas, known as Manuelita, was the daughter of Juan Manuel de Rosas, who had governed Buenos Aires with an iron hand since the 1830s. Hostess to her father, she was thought to soften the regime and to intercede on behalf of the persecuted. The portrait is a political image: red, called punzó, was the colour of the Federalists, Rosas’s party, which everyone had to wear on pain of being suspect. The letter lying under her hand recalls her role as intermediary, to whom petitions were addressed. But Pueyrredón, who came from a family long exiled under Rosas, also paints a real woman, with a simple, kindly face, far from an icon. A few months later, the regime collapsed."""
histoire = """
In 1850, a commission of Rosas’s supporters decided to give Manuelita her portrait and entrusted its execution to the young Prilidiano Pueyrredón. The format and the colour of the dress were imposed on him. The painter pointed out that the effect of the punzó red would be disastrous; it was then decided to cover the dress with lace to soften its glare. The portrait was to be presented at a tribute to Manuelita, in 1851. In February 1852, Rosas was defeated at Caseros and went into exile in England with his daughter. In 1903, Manuelita’s husband, Máximo Terrero, gave the painting to the National Historical Museum; it then passed to the National Museum of Fine Arts in Buenos Aires, in the 1930s."""
facture = """
Pueyrredón follows the tradition of the European state portrait: full-length figure, draperies, luxurious furniture, a dark background that makes the dress stand out. He treats the materials with virtuosity: the deep velvet, the transparency of the lace, the sparkle of the jewels and the porcelain. The face, by contrast, is treated with simplicity, without flattery. A preparatory study of the head is also preserved in the National Museum of Fine Arts."""
details = [
  "The letter slipped under Manuelita’s right hand.",
  "The white lace covering the red dress to soften its glare.",
  "The red flower and the small diadem in her hair.",
  "The porcelain vase decorated with gold, and its bouquet, on the left.",
]
themes = ["portrait", "power", "red", "argentina", "politics"]
anecdote = """
In Argentina, 3 November, the anniversary of Prilidiano Pueyrredón’s death in 1870, is National Visual Artist’s Day, in tribute to the man regarded as the country’s first great painter."""
salle = 5
mur = "est"
place = 2
largeur = 1.66

[[oeuvres]]
titre = "The Wake (El velorio)"
artiste = "Francisco Oller"
annee = "1893"
image = "el-velorio.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:El_Velorio_by_Francisco_Oller.jpg"
technique = "Oil on canvas, 240 × 400 cm"
collection = "Museo de Historia, Antropología y Arte, University of Puerto Rico, San Juan"
note = "In a peasant house in Puerto Rico, the wake of a dead child, become a “little angel”, is celebrated: Oller’s masterpiece."
description = """
The interior of a large wooden hut with a thatched roof is full of people. At the centre, on a table covered with a lace cloth, lies a small dead child, dressed in white and crowned with flowers. Around it, a feast is under way: on the left, couples dance, a man plays the guitar, others drink; in the middle, an old man bent over his stick, a man tossing his hat, a boy stepping back laughing. On the right, a priest in black, seated, seems ill at ease, while a man speaks to him and a woman in a white headscarf raises her arms. From the roof hang ears of corn, a bunch of bananas, a roast pig. Dogs run on the floor. Through the doors, the green countryside and palm trees can be glimpsed."""
evocation = """
The baquiné, or wake of the little angel, was a popular custom of Puerto Rico, of African and Spanish origin: a baptised child, dying innocent, goes straight to heaven, and its departure is celebrated with songs, dances and drink. Oller, a man of the Enlightenment and of progress, paints this feast with a critical eye: he saw in it a crude superstition, an orgy of brutal appetites, in his own words. The painting contrasts the bright side of the feast, on the left, with the dark side, on the right, where the parents and the priest remain strangers to the commotion. Today it is seen above all as a collective portrait of Puerto Rican rural society, the jíbaros, with its Black, mixed-race and white members, and a founding image of the island’s identity."""
histoire = """
Oller began the painting in 1891 on a sugar plantation in Carolina, near San Juan, belonging to the Elzaburu family: two of its members posed for the priest and the sacristan, and farm labourers and their families for the other figures. Shown in 1893 in San Juan, at the exhibition for the fourth centenary of the discovery of Puerto Rico, the canvas shocked part of the critical establishment, which judged it vulgar, but the public recognised itself in it. It was then shown at the Paris Salon in 1895. Property of the Biblioteca Insular, it was acquired in 1915 by the University of Puerto Rico, whose museum it was the origin of."""
facture = """
Oller frequented Courbet, Pissarro and Cézanne in Paris, and the painting combines these two legacies: realism, for this great scene of popular life painted on the scale of history painting, and a clear light, coming from Impressionism, which enters through the doors and bathes the wooden walls. The teeming composition multiplies small scenes and everyday objects, in the manner of an inventory. The colour is lively, lit with whites and pinks."""
details = [
  "The dead child crowned with flowers, on the table with the lace cloth.",
  "The roast pig hanging beneath the roof, above the heads.",
  "The seated guitar player, on the left.",
  "The green landscape and the palm trees, glimpsed through the door and the window.",
  "The two dogs running between the guests’ legs.",
]
themes = ["wake", "feast", "death", "puerto rico", "rural life"]
anecdote = """
At the painting’s first exhibition, a San Juan columnist reported that many visitors claimed to recognise, among the guests at the wake, relatives or neighbours."""
salle = 5
mur = "ouest"
place = 2
largeur = 3.6

[[artistes]]
nom = "Marià Fortuny"
vie = "Reus (Catalonia), 11 June 1838 – Rome, 21 November 1874"
biographie = """
Marià Fortuny i Marsal, orphaned very young, was raised in Reus by his grandfather, a craftsman. At fourteen, he entered the Llotja school in Barcelona. In 1857, a scholarship took him to Rome. Three years later, the province of Barcelona sent him to Morocco to follow the war that Spain was waging there: he discovered the light of North Africa, which would nourish his whole oeuvre, and painted The Battle of Tetouan. His Orientalist scenes and genre pictures in eighteenth-century costume attracted the Parisian dealer Goupil, who offered him a contract. In 1867, he married Cecilia de Madrazo in Madrid, daughter of the painter Federico de Madrazo. The success of La Vicaría, in 1870, made him one of the most expensive painters in Europe. He then settled in Granada, near the Alhambra, then in Portici, near Naples, seeking a freer painting. He died in Rome, at thirty-six, carried off by malaria."""
style = """
Fortuny is the master of “preciosismo”: small-format pictures of dazzling virtuosity, in which the lively touch and luminous highlights make fabrics and objects sparkle. A watercolourist and printmaker of the first rank, he influenced a whole generation of Spanish and Italian painters, and his last works, painted in the open air, foreshadow the painting of light of Sorolla."""

[[artistes]]
nom = "Joaquín Sorolla"
vie = "Valencia (Spain), 27 February 1863 – Cercedilla, 10 August 1923"
biographie = """
Joaquín Sorolla y Bastida lost his parents, carried off by cholera, at the age of two; he was raised by an aunt and an uncle who was a locksmith in Valencia. He studied at the city’s school of fine arts, then in 1885 obtained a scholarship for Rome, and stayed in Paris, where he discovered Naturalism and open-air painting. In 1888, he married Clotilde García del Castillo, daughter of a photographer, who would be his model all his life; they had three children. Settled in Madrid, he made his name with paintings on social subjects, then triumphed with his beach scenes: a grand prize at the Paris Universal Exposition of 1900, an exhibition at the Galerie Georges Petit in 1906, and above all at the Hispanic Society of America in New York in 1909. Its founder, Archer Huntington, commissioned from him Vision of Spain, fourteen immense canvases on the regions of the country, completed in 1919. In June 1920, while he was painting in his garden, he suffered a hemiplegic stroke; he never painted again and died three years later."""
style = """
Sorolla is the painter of Mediterranean light. Working in the open air on large canvases, with a broad, rapid and sure touch, he captures the sun on the sea, the reflections on wet bodies and white fabrics. Close to Impressionism without adopting its divided touch, he keeps a firm drawing. His “luminism” left its mark on Spanish painting and enjoyed an immense success in America."""

[[artistes]]
nom = "Ramon Casas"
vie = "Barcelona, 4 January 1866 – Barcelona, 29 February 1932"
biographie = """
Ramon Casas i Carbó was born into a well-off Barcelona family, enriched in Cuba. At fifteen, he left for Paris and entered the studio of the portraitist Carolus-Duran. He then divided his life between Paris and Barcelona and for a time lived in Montmartre, above the Moulin de la Galette, with his friend Santiago Rusiñol. Back in Catalonia, he became with him the leader of modernisme: he supported the tavern Els Quatre Gats, opened in 1897, and founded magazines such as Pèl & Ploma. A painter of modern life, he also painted grave subjects from current events, such as a public execution by garrotte or a Civil Guard charge against workers. He produced a long gallery of charcoal portraits of the personalities of his time and became a renowned poster artist, for the anisette of El Mono or Codorníu champagne. He spent his last years between Barcelona and his house at Sant Benet de Bages, where in 1922 he married his former model, Júlia Peraire."""
style = """
Casas combines the elegance of the society portrait, learned from Carolus-Duran, with the direct gaze of the painters of modern life, Manet or Degas. His drawing, extremely sure, and his sense of layout, nourished by the poster and the Japanese print, give his works an immediate modernity. He brought Catalan painting into the Europe of the Belle Époque."""

[[artistes]]
nom = "Ignacio Zuloaga"
vie = "Eibar (Basque Country), 26 July 1870 – Madrid, 31 October 1945"
biographie = """
Ignacio Zuloaga y Zabaleta was born into a family of craftsmen famous for their damascened metalwork; his uncle Daniel was a ceramist in Segovia. After a stay in Rome, he settled in Paris in 1890, where he became friends with Rusiñol, Casas, then with Rodin and the painter Émile Bernard. Little recognised at first in Spain, he stayed in Andalusia, then above all in Castile, in Segovia, where he found his models: peasants, dwarfs, bullfighters, gypsies, old women. In 1899, he married Valentine Dethomas, sister of a French painter. His submissions to the Paris Salons, then his exhibitions in Europe, South America and the United States, brought him international fame, while Spanish critics reproached him for giving a dark image of the country. A great art lover, he owned canvases by El Greco and Goya. In 1925, he acquired the castle of Pedraza, in Castile, and founded a museum at Zumaia, in the Basque Country. He died in Madrid in 1945."""
style = """
Zuloaga paints a harsh and dramatic Spain, inherited from El Greco, Velázquez and Goya: monumental figures, heavy drawing, muted colours, landscapes of Castile under stormy skies. Close to the writers of the Generation of 1898, he fixed the image of a black and austere Spain, the opposite of Sorolla’s light, and was one of the most famous Spanish painters of his time."""

[[artistes]]
nom = "José María Velasco"
vie = "Temascalcingo (Mexico), 6 July 1840 – Villa de Guadalupe Hidalgo, 26 August 1912"
biographie = """
José María Velasco Gómez was born into a modest family of the State of Mexico, which soon moved to the capital. In 1858 he entered the Academy of San Carlos, where the Italian landscape painter Eugenio Landesio taught him landscape painting and perspective. A passionate scientist, he also studied botany, zoology and geology, became a member of the Mexican Society of Natural History and illustrated its publications with plates of plants and birds. He succeeded Landesio as professor at San Carlos, where he trained many students. Settled in Guadalupe, at the foot of the Tepeyac, he tirelessly painted the Valley of Mexico, its volcanoes, its lakes and its haciendas, but also the railways and bridges that were transforming the country. His canvases represented Mexico at the international exhibitions of Philadelphia in 1876, Paris in 1889 and Chicago in 1893. He died in 1912, at the beginning of the Mexican Revolution."""
style = """
Velasco is the great landscape painter of Mexico. To the classical composition learned from Landesio, he adds the observation of a naturalist: the geology of rocks, plant species, the formation of clouds. His vast panoramas, of limpid light, gave the country an image of itself and made landscape a national genre, which twentieth-century painters would take up."""

[[artistes]]
nom = "Saturnino Herrán"
vie = "Aguascalientes (Mexico), 9 July 1887 – Mexico City, 8 October 1918"
biographie = """
Saturnino Herrán Guinchard was the son of a teacher from Aguascalientes, who encouraged his gift for drawing. After his father’s death, at the beginning of the century, he moved with his mother to Mexico City and entered the Academy of San Carlos. There he followed the teaching of the Catalan painter Antonio Fabrés, then of Germán Gedovius, and rubbed shoulders with other students destined for a great future, such as Diego Rivera. To make a living, he worked as a draughtsman and taught drawing. Without ever leaving Mexico, he forged a personal manner, nourished by European Symbolism and Art Nouveau, which he put at the service of Mexican subjects: workers, women of the people, Indigenous legends, popular festivals. In 1914, he married Rosario Arellano, who gave him a son. That same year, he undertook a vast decorative project, Our Gods, for the new National Theatre. A stomach illness carried him off in 1918, at thirty-one, before he could finish it."""
style = """
Herrán is the main representative of Mexican modernismo. He combines a solid academic drawing with a decorative colour, with matt tones lit by bright touches, and with tight, monumental compositions. By making Indigenous and mestizo people the heroes of great painting, he prepares the ground for the Mexican muralism of the 1920s."""

[[artistes]]
nom = "Pedro Américo"
vie = "Areia (Brazil), 29 April 1843 – Florence, 7 October 1905"
biographie = """
Pedro Américo de Figueiredo e Melo was born in the province of Paraíba, in the Brazilian Northeast. A child prodigy of drawing, at ten he accompanied a scientific expedition into the interior of the country, then entered the Imperial Academy of Fine Arts in Rio de Janeiro. Thanks to a scholarship from Emperor Pedro II, he went to study in Paris, at the École des beaux-arts, and also took courses in science and philosophy; he obtained a doctorate at the University of Brussels. Back in Brazil, he taught at the Imperial Academy and painted large history scenes, among them The Battle of Avaí, an episode of the Paraguayan War, which caused controversy. He then settled in Florence, where he painted Independence or Death!. After the proclamation of the Republic, he was elected deputy to the Constituent Assembly in 1890. An author of novels and essays, he returned to live in Italy, where he died in 1905."""
style = """
Pedro Américo is the great history painter of imperial Brazil. Trained in European academic rules, he composes vast canvases with spectacular staging, detailed with documentary precision. His images, reproduced in school textbooks, have fixed in collective memory the great episodes of national history, from independence to the Paraguayan War."""

[[artistes]]
nom = "Almeida Júnior"
vie = "Itu (Brazil), 8 May 1850 – Piracicaba, 13 November 1899"
biographie = """
José Ferraz de Almeida Júnior was born in Itu, a small town in the interior of the state of São Paulo. Noticed very early for his drawings, he entered the Imperial Academy of Fine Arts in Rio de Janeiro in 1869, where he was a pupil of Victor Meirelles. Back in Itu, he opened a portraitist’s studio. In 1876, Emperor Pedro II, passing through the town, saw his works and granted him a pension to study in Europe. In Paris, he entered the studio of Alexandre Cabanel at the École des beaux-arts and exhibited at the Salon. Returning to Brazil in 1882, he settled in São Paulo, painted portraits, religious and historical scenes, and gave lessons. But it was in painting the life of the caipiras, the peasants of the interior, that he found his path, in the 1890s: Caipira picando fumo, Reading, Saudade. His career was brutally cut short in 1899, when he was murdered in Piracicaba."""
style = """
Almeida Júnior applies the academic craft learned in Paris to everyday Brazilian subjects. His realism, attentive to gestures, faces and modest interiors, and his tropical light, white and raw, make him the first painter to look at rural Brazil without exoticism. The Brazilian modernists of the 1920s hailed him as a precursor."""

[[artistes]]
nom = "Prilidiano Pueyrredón"
vie = "Buenos Aires, 24 January 1823 – San Isidro, 3 November 1870"
biographie = """
Prilidiano Pueyrredón was the son of Juan Martín de Pueyrredón, hero of independence and Supreme Director of the United Provinces of the Río de la Plata. Opposed to Governor Juan Manuel de Rosas, his family lived in exile in Europe and Brazil during a large part of his youth. He studied engineering and architecture in Paris, while training in painting, and stayed in Rio de Janeiro. Returning to Buenos Aires in 1849, he painted there the portrait of Manuelita Rosas, which made him famous. After Rosas’s fall, he worked as an architect and engineer, notably on the remodelling of the May Pyramid, in 1856, in the city’s main square. He painted many portraits of high society, but also scenes of the Argentine countryside, with its gauchos and estancias, and nudes that caused scandal. He spent his last years in his house at San Isidro, on the banks of the Río de la Plata, where he died at forty-seven."""
style = """
Pueyrredón is regarded as the first great Argentine painter. An attentive portraitist, trained in the lessons of European academicism, he takes care over materials and likeness. In his rural scenes, of clear light and precise observation, he fixes for the first time the life of the pampa, opening the way to a national painting."""

[[artistes]]
nom = "Francisco Oller"
vie = "San Juan (Puerto Rico), 17 June 1833 – San Juan, 17 May 1917"
biographie = """
Francisco Manuel Oller y Cestero was born into a well-off family of San Juan, then a Spanish colony. He learned drawing in his city, then went to study in Madrid, at the Academy of San Fernando, under Federico de Madrazo. In 1858, he settled in Paris, entered the studio of Thomas Couture and frequented the Académie Suisse, where he became friends with Camille Pissarro, born like him in the Caribbean, and with Paul Cézanne. He admired Courbet and exhibited at the Salon. Between several stays in Europe, he returned to Puerto Rico, where he opened an academy of drawing and painting. A defender of the abolition of slavery and of public education, he painted the landscapes, plantations and people of his island, and still lifes of tropical fruit. In the 1880s, he settled permanently in Puerto Rico. There he painted The Wake and The School of Master Rafael Cordero, a tribute to a Black schoolteacher. He died in San Juan in 1917."""
style = """
Oller is one of the few Latin American painters to have rubbed shoulders with the Impressionists from their beginnings. His art combines the realism of Courbet, in the choice of popular subjects, with the clear light and free touch of the Impressionists. He is regarded as the father of Puerto Rican painting and one of the first to have given the art of the Caribbean an identity of its own."""
