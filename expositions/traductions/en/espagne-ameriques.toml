[exposition]
ordre = 135
nom_court = "Spain and the Americas"
mouvement = "Spain and Latin America in the 19th Century"
cadre = "dore"
couleur = "#9a4a22"
titre = "Spain and Latin America: Two Shores of a Painting"
artiste = "Fortuny, Sorolla, Casas, Zuloaga, Velasco, Herrán, Pedro Américo…"
dates = "1851–1913"
accroche = "Virtual exhibition · Museo Nacional de Arte (MUNAL), Mexico City"
introduction = """
In the nineteenth century, while Spain sought its image between the light of Sorolla and the “Black Spain” of Zuloaga, the young nations of Latin America invented their own: Velasco’s Valley of Mexico, Brazil’s cry of independence, the peasant of São Paulo, a child’s wake in Puerto Rico. The visit brings together ten painters, from Madrid and Barcelona to Mexico City, São Paulo, Buenos Aires and San Juan. The building is inspired by the Museo Nacional de Arte in Mexico City, housed in an early twentieth-century palace: a vestibule, a great reception salon at the centre, and rooms surrounding it on three sides."""
vitrine = "paseo-orillas-mar.jpg"

[musee]
nom = "Museo Nacional de Arte (MUNAL)"
ville = "Mexico City, Mexico"
architecte = "Silvio Contri"
construction = "1904–1911"
presentation = """
The National Museum of Art in Mexico City occupies the former palace of the Ministry of Communications and Public Works, on Tacuba Street, in the historic centre. Under the presidency of Porfirio Díaz, the Italian architect Silvio Contri built it from 1904 in an eclectic style, mixing Neoclassical and Renaissance references: a stone façade, a grand ceremonial staircase with a double flight, a reception salon with a ceiling painted with an Allegory of Progress. Its façade looks onto Plaza Manuel Tolsá, where the Caballito stands, the equestrian statue of Charles IV, the work of Manuel Tolsá. The palace became a museum on 23 July 1982, then was restored in the late 1990s. Its galleries trace Mexican art from the colonial period to the mid-twentieth century; José María Velasco’s views of the Valley of Mexico and the canvases of Saturnino Herrán are among its treasures."""
ici = """
ARTEON takes up the layout of the palace: you enter from the south into the vestibule of Plaza Tolsá, with its pale stone walls, then into the reception salon, the largest room, twenty-four metres long and ten high, with brick-red walls, devoted to Spain. Three rooms surround it: to the west, the Mexico room, with ochre walls; to the east, the Brazil room, in a pale green; to the north, finally, the room of the Río de la Plata and the Caribbean, with powder-pink walls, where the visit ends."""

