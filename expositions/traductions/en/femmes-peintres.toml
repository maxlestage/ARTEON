[[oeuvres]]
titre = "Self-Portrait with Two Pupils"
artiste = "Adélaïde Labille-Guiard"
annee = "1785"
image = "autoportrait-deux-eleves.jpg"
technique = "Oil on canvas, 210.8 × 151.1 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Life-size, in a satin gown, the painter shows herself at work surrounded by two pupils: a plea for the place of women in art."
description = """
In a studio plunged in half-light, an elegant woman sits before a large easel, of which \
only the back of the canvas can be seen. She wears a blue-grey satin gown with silvery \
highlights and a straw hat trimmed with ostrich feathers and blue ribbons. Palette and \
brushes in one hand, a brush in the other, the long rod of her maulstick slipped under \
her arm, she turns towards us as though we were her sitter. Behind her green velvet \
armchair, two young women stand pressed close together: one looks at us, the other \
gazes intently at the canvas. In the background, in shadow, one can make out the bust of \
an elderly man and a statuette of a draped woman. On the right, on a red velvet stool, \
lie rolls of paper and a pink piece of fabric."""
evocation = """
The work is a manifesto. Two years earlier, Labille-Guiard had been admitted to the \
Royal Academy of Painting, which allowed no more than four women at a time and whose \
school remained closed to female students. By painting herself life-size, in a format \
normally reserved for state portraits, surrounded by two young women whom she is \
training herself, she asserts that a woman can not only paint, but teach and pass on \
her art. Her refined attire also answers the malicious rumours that attributed her \
talent to a man’s help: it is she who holds the brush. Finally, the picture conveys \
solidarity: the two pupils, arms entwined, form with their mistress a small community of \
artists, and the gaze of one of them takes us to witness."""
histoire = """
Adélaïde Labille-Guiard exhibited the painting at the Salon of 1785 at the Louvre. The \
two pupils have been identified: Marie-Gabrielle Capet, who would become a recognised \
portraitist and remained with her mistress until the latter’s death, and Marie-Marguerite \
Carreaux de Rosemond, who died young in 1788. The bust in the background represents the \
artist’s father. In 1790, in the midst of the Revolution, Labille-Guiard spoke at the \
Academy to ask that women be admitted without any limit on their number. The painting \
remained in her family until the early twentieth century, then passed into private \
collections; it was given to the Metropolitan Museum of Art in New York in 1953 by \
Julia A. Berwind."""
facture = """
Trained in pastel under Maurice Quentin de La Tour, Labille-Guiard shows herself here to \
be a virtuoso colourist in oil: the satin of the gown, with its crisp folds and silvery \
highlights, is a tour de force. Every material is differentiated: straw, feather, \
velvet, the wood of the easel, the plaster of the bust. The pyramidal composition \
culminates in the heads of the pupils and is balanced by the great oblique of the easel \
on the left. The light, coming from the left, sets the three women against an almost \
uniform brown-green background."""
details = [
  "On the upright of the easel, at lower left, the signature and the date.",
  "The silvery highlights of the satin, rendered with touches of pure white.",
  "The ostrich feathers of the hat, undulating above the head.",
  "In the background, in shadow, the bust of the artist’s father.",
  "On the red velvet stool, the rolls of paper and the pink fabric.",
]
themes = ["self-portrait", "studio", "teaching", "academy", "solidarity"]
anecdote = """
On 31 May 1783, the Royal Academy admitted Adélaïde Labille-Guiard and Élisabeth Vigée \
Le Brun on the same day. The public delighted in setting the two portraitists against \
each other as rivals: one was the protégée of Marie Antoinette, the other would become, \
in 1787, the painter of the King’s aunts, Mesdames."""
salle = 1
mur = "nord"
position = -0.2
largeur = 1.7

[[oeuvres]]
titre = "The Game of Chess"
artiste = "Sofonisba Anguissola"
annee = "1555"
image = "partie-d-echecs.jpg"
technique = "Oil on canvas, 72 × 97 cm"
collection = "National Museum, Poznań"
note = "Three of the artist’s sisters and their maid around a chessboard: they play, smile, look at one another, a rarity in a portrait of 1555."
description = """
In front of a large tree and an open landscape, three richly dressed young girls are \
gathered around a table covered with an Oriental carpet, on which a chessboard has been \
placed. On the left, the eldest, Lucia, in an orange brocade gown, rests one hand on the \
board and raises her eyes towards us, calm and self-assured. Opposite her, Minerva, in \
black and gold, lifts her hand as if to concede the game or to protest. Between them, \
little Europa watches her sister with a broad, amused smile. Behind Minerva, an old \
maid tilts her head to follow the game. Pearl necklaces, embroidered caps and lace \
collars speak of the family’s rank. In the background stretches a bluish landscape of \
hills, water and villages, almost a dreamlike view."""
evocation = """
The subject is a discreet statement: chess was regarded as a game of intelligence and \
strategy, prized by men and by courts. To show sisters at play, one of whom is \
visibly winning, is to celebrate their wit as much as their grace. It has been seen as \
a reflection of the exceptional education that Amilcare Anguissola gave his six \
daughters: letters, music, painting. Lucia’s gaze, turned outwards, seems to address the \
painter herself, like a complicity between sisters. Above all, the work blends portrait \
and genre scene: recognisable faces, but caught in a lively moment, with smiles and \
gestures that the stiff, solemn portraits of the period scarcely ever showed."""
histoire = """
Sofonisba Anguissola was little more than twenty when she painted this canvas, in \
Cremona, in the family home. She signed and dated it on the edge of the chessboard, in \
Latin, presenting herself as Amilcare’s daughter. Around 1566, the historian Giorgio \
Vasari, passing through Cremona, saw the painting at her father’s house and described it \
with admiration: the figures, he wrote in essence, seem alive and lack only speech. The \
canvas then passed through several major collections, including that of Lucien \
Bonaparte, Napoleon’s brother, before being acquired in Paris in 1823 by the Polish \
count Atanazy Raczyński. His collection is now displayed in the National Museum in \
Poznań, Poland."""
facture = """
Anguissola paints each face with a portraitist’s precision, but links them through a \
network of glances and gestures that passes from one figure to the next. The fabrics are \
treated with care: the sheen of the brocade, gold embroidery, pearls, lace. The \
figures, cut off at half length by the table, occupy the foreground in front of a \
landscape whose distances turn blue, in the manner of the Lombard and Venetian painters. \
The chessboard in perspective and the finely drawn hands show the training she received \
in Cremona under Bernardino Campi and then Bernardino Gatti."""
details = [
  "On the edge of the chessboard, the Latin inscription bearing the signature and the date.",
  "Minerva’s raised hand, on the right, which seems to concede or to protest.",
  "The broad smile of little Europa, rare in a sixteenth-century portrait.",
  "The Oriental carpet covering the table, with its geometric patterns.",
  "The wrinkled face of the maid, at the far right.",
]
themes = ["family", "sisters", "game", "chess", "renaissance"]
anecdote = """
It was at the end of the fifteenth century, in Spain and Italy, that the queen in chess \
became the most powerful piece in the game, able to cross the whole board. When Sofonisba \
painted her sisters, this all-powerful “lady” had existed for only a few decades."""
salle = 2
mur = "nord"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "Self-Portrait"
artiste = "Judith Leyster"
annee = "c. 1630"
image = "autoportrait-leyster.jpg"
technique = "Oil on canvas, 74.6 × 65.1 cm"
collection = "National Gallery of Art, Washington"
note = "Brush in hand, she turns towards us with a smile: a young painter confident in her talent, in front of the fiddler she is painting."
description = """
A young woman sits in three-quarter view, her right arm resting on the back of her \
chair, and turns towards us, her mouth slightly open as if about to speak. She wears a \
dark dress with pink-violet silk sleeves, an immense white lace ruff and a light cap \
that frees her forehead. In her right hand she holds a very fine brush whose tip almost \
touches the canvas; in her left, her palette and a handful of brushes. On the right, on \
the easel, a painting in progress: a laughing fiddler in a blue beret plays as he \
sways. The background is a plain grey-brown wall, where nothing distracts from the \
face, the hands and the work."""
evocation = """
This portrait is a demonstration. Leyster shows herself twice over: as a portraitist, \
through her own lively, smiling face, and as a genre painter, through the cheerful \
musician on the easel, a subject that made the success of the Haarlem studios. The open \
mouth and relaxed pose break with the rigid dignity of portraits of the period and \
recall the art of Frans Hals. It has often been remarked that she is not in working \
dress: the ruff and the silk say that she presents herself as a respectable woman of \
means, and not as a mere craftswoman. One reads in it the pride of a young woman who \
lays claim to an almost entirely male profession, and to the right to excel in it."""
histoire = """
Leyster was in her early twenties when she painted this picture, in Haarlem. It is \
thought that she presented it when she entered the city’s Guild of Saint Luke in 1633, \
one of the very first women to be admitted as a master: she could then open a studio and \
train apprentices. After her death her name faded; her paintings, signed with a discreet \
monogram, were sold as works by Frans Hals. It was only in 1893 that the Dutch \
historian Cornelis Hofstede de Groot restored her œuvre to her. This portrait entered \
the National Gallery of Art in Washington in 1949, a gift of Robert Woods Bliss and his \
wife, already correctly attributed to the artist."""
facture = """
The brushwork is rapid, visible, dashing: the lace of the ruff is made of small white \
accents laid on the surface, the highlights of the silk of a few strokes of the brush. \
Leyster learned this freedom in the circle of Frans Hals. She contrasts the face, \
softly modelled, with the fiddler on the easel, painted more summarily, like a sketch. \
The palette is sober, greys, blacks and whites, enlivened by the pink of the sleeve and \
the red of the skirt. The diagonal of the arm and the brush links the artist to her \
work."""
details = [
  "The very fine brush, held lightly, its tip brushing the canvas.",
  "The lace of the ruff, rendered with small white touches.",
  "The fiddler in the blue beret, laughing as he plays.",
  "The palette and the handful of brushes, at lower right.",
  "The back of the chair, cut off by the left edge of the painting.",
]
themes = ["self-portrait", "studio", "music", "golden age", "haarlem"]
anecdote = """
Examination of the painting revealed that Leyster had first painted a female face on the \
easel, before covering it with the fiddler. The picture within the picture thus changed \
subject along the way, passing from portrait to genre scene."""
salle = 2
mur = "sud"
place = 1
largeur = 1.1

[[oeuvres]]
titre = "Flowers in a Vase"
artiste = "Rachel Ruysch"
annee = "c. 1685"
image = "fleurs-dans-un-vase.jpg"
technique = "Oil on canvas, 57 × 43.5 cm"
collection = "National Gallery, London"
note = "A profuse bouquet springing from the shadows, painted by a woman in her early twenties who would become the most famous flower painter of her day."
description = """
On a stone ledge, a glass vase almost invisible in the shadows holds a profuse bouquet \
that rises diagonally. At the centre, a large pale pink peony with a green heart draws \
the eye first. Around it bloom orange martagon lilies, white clusters of hawthorn and \
snowball viburnum, blue and white columbines, and yellow honeysuckle that falls \
towards the bottom. Ears of ripe wheat and long grasses shoot upwards. On the right, \
isolated, a dark red peony bud. A stem bearing a seed capsule spills over the ledge, \
towards us. Looking closely, one discovers small insects hidden among the flowers and \
foliage."""
evocation = """
Such a bouquet never existed as it stands: it brings together spring flowers and \
already ripe ears of wheat, which do not grow at the same time. The painter composes it \
from studies made in different seasons, to create an ideal image of nature. In \
seventeenth-century Holland, such still lifes also speak of the passing of time: the \
flower in full bloom, the bud and the drooping stem remind us that beauty is brief, \
like life. It has been seen as an echo of the scientific culture of her family: \
Rachel’s father, Frederik Ruysch, an anatomist and botanist, collected natural \
specimens. She paints each species with a naturalist’s exactness, but arranges it with \
a very personal sense of drama."""
histoire = """
Rachel Ruysch painted this canvas around 1685, in Amsterdam, when she was only in her \
early twenties and had barely left the studio of her master, Willem van Aelst, one of \
the city’s finest flower painters. His influence can be recognised in the dark \
background and the asymmetrical, diagonal composition. She went on to build an \
exceptional career of more than sixty years: her bouquets fetched higher prices than \
those of many painters of her time, and the Elector Palatine Johann Wilhelm named her \
court painter in Düsseldorf. The painting entered the National Gallery in London in \
1974, thanks to the bequest of the collector Alan Evans."""
facture = """
Ruysch works in thin layers of oil, almost without a trace of the brush, to render the \
texture of each petal: the velvet of the peony, the wax of the lilies, the delicacy of \
the columbines. The light, coming from the left, sculpts the palest flowers against the \
almost black background, while the leaves plunge into shadow. The composition traces a \
curve, from the ears at the top down to the stem that hangs in front of the ledge, and \
refuses symmetry. The barely visible vase leaves the bouquet as if suspended in the \
darkness."""
details = [
  "The grasshopper almost hidden in the honeysuckle, at the base of the bouquet.",
  "The tiny ants running over the flowers.",
  "The red peony bud, isolated to the right of the bouquet.",
  "The ears of ripe wheat, at the very top, mingled with spring flowers.",
  "The stem drooping over the edge of the ledge, towards us.",
]
themes = ["flowers", "still life", "botany", "vanitas", "golden age"]
anecdote = """
In 1723, Rachel Ruysch and her husband won a large prize in an Amsterdam lottery. She \
nonetheless carried on painting: she was still working in her eighties and proudly \
inscribed her age next to her signature."""
salle = 2
mur = "sud"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Self-Portrait Hesitating between the Arts of Music and Painting"
artiste = "Angelica Kauffman"
annee = "1794"
image = "entre-musique-et-peinture.jpg"
technique = "Oil on canvas"
collection = "National Trust, Nostell Priory (Yorkshire)"
note = "Like Hercules at the crossroads, the painter must choose: Music holds her by the hand, Painting points her to a temple at the top of a mountain."
description = """
Three young women dressed in the antique style fill the whole width of the canvas. At \
the centre, in a white gown with a blue and gold sash, Angelica Kauffman portrays \
herself as a young woman. On the left, seated before a column and a heavy curtain, \
Music, in a red gown and mauve scarf, crowned with flowers, a score on her lap, \
tenderly holds her right hand. On the right, standing, Painting, in blue, with yellow \
sleeves and a floating red scarf, holds a palette and brushes and stretches her arm \
towards the distance: at the summit of a steep mountain stands a small circular \
temple. The artist, her head inclined towards Music, is already moving her left hand \
towards the palette, as if her gesture had chosen before her gaze."""
evocation = """
Kauffman takes up a famous theme from Antiquity, Hercules at the crossroads, torn \
between easy pleasure and demanding virtue. Here, the choice is that of a vocation. \
Music represents a talent she also possessed, and an easier path; Painting shows the \
steep road that leads to the temple of glory. The artist’s gaze, turned towards Music \
with regret and tenderness, and her hand stretched towards the palette speak of a \
farewell rather than a hesitation. Painted by a woman at the height of her reputation, \
the picture also recalls that a career as a history painter was a difficult choice for \
a woman: in recent times it has become an emblematic image in the history of women \
artists."""
histoire = """
Angelica Kauffman painted this picture in Rome in 1794, when she was over fifty and her \
studio on the Via Sistina received cultivated Europe. The subject refers back to her \
youth: a child prodigy, she sang and played as well as she drew, and it is said that she \
once had to choose between a career as a singer and painting. She had already treated \
the theme a few years earlier, in another version. The large format and the learned \
reference to Hercules show that she placed herself among the history painters, the most \
prestigious genre. The painting is now kept at Nostell Priory, a Yorkshire house owned \
by the National Trust."""
facture = """
The composition, in the form of a frieze, aligns the three figures parallel to the \
picture plane, as on an antique bas-relief, a principle dear to Neoclassicism. The pure \
colours, red, white, blue and yellow, answer one another from figure to figure. The \
drawing is clean, the drapery supple and smooth, the faces idealised with regular \
profiles. A diagonal links the score held by Music, the artist’s arm and the raised arm \
of Painting to the temple, drawing the eye from left to right, from the past towards \
the future."""
details = [
  "The crown of violet flowers in the hair of Music.",
  "The two clasped hands of Music and the artist, at the centre.",
  "The palette, with its few touches of colour, held by Painting.",
  "At the very top right, the small temple on the mountain.",
  "The red scarf of Painting, lifted by the wind.",
]
themes = ["self-portrait", "vocation", "music", "allegory", "neoclassicism"]
anecdote = """
In 1768, Angelica Kauffman was one of only two women among the founding members of the \
Royal Academy in London, together with the flower painter Mary Moser. It was then not \
until 1936 that another woman was elected a full member."""
salle = 2
mur = "ouest"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "The Cradle"
artiste = "Berthe Morisot"
annee = "1872"
image = "berceau.jpg"
technique = "Oil on canvas, 56 × 46 cm"
collection = "Musée d’Orsay, Paris"
note = "Edma, the artist’s sister, watches over her sleeping daughter: an intimate image of motherhood, shown at the first Impressionist exhibition."
description = """
A young woman in a dark dress sits on the left, her chin resting on her hand, gazing at \
a cradle. The baby sleeps, half hidden behind the muslin veil that cascades down from \
the top of the cradle. The mother’s other hand rests on the edge, near the veil, and the \
line of her gaze leads the eye from her face to the child’s. The background is divided \
between a light curtain on the left and a section of dark wall on the right. All the \
rest is a play of whites, net curtains, sheet, muslin, pillow, barely tinted with pink, \
grey and blue. A black ribbon at the young woman’s neck and a few pink edgings punctuate \
this whiteness."""
evocation = """
The picture reads first as a peaceful image of motherhood, but it is more ambiguous \
than it appears. Edma, who had painted alongside Berthe since childhood, gave up \
painting when she married in 1869. Her dreamy, almost melancholy gaze has been \
interpreted as that of a woman contemplating the life she chose, or that was imposed on \
her. The veil that separates mother from child creates both protection and distance. \
For Berthe, still unmarried in 1872, it is also the portrait of her closest sister, \
painted with an attention that only the intimacy of a home and trust between two women \
allow."""
histoire = """
Berthe Morisot painted the canvas in 1872, shortly after the birth of Blanche, the \
daughter of Edma and her husband, the naval officer Adolphe Pontillon. Two years later, \
she showed it at the first exhibition of the group soon to be called the Impressionists, \
which opened on 15 April 1874 in the former studio of the photographer Nadar, on the \
Boulevard des Capucines. The critics, often hostile to the group, were kinder to this \
delicate picture, but it found no buyer. It remained in the family, notably with \
Blanche, the baby of the cradle now grown up, before being acquired by the Louvre in \
1930. Shown at the Jeu de Paume, it joined the Musée d’Orsay when it opened in 1986."""
facture = """
Morisot works in long, light strokes that let the paint breathe. She builds almost the \
whole picture from whites, pinkish, bluish or grey, laid in transparent layers that \
convey the lightness of the muslin. Edma’s dark dress and the dark section of wall on \
the right serve as counterpoint. The composition rests on a diagonal, from the mother’s \
face to the baby, crossed by that of the veil. The tight framing encloses the viewer in \
the intimacy of the room."""
details = [
  "The muslin of the cradle, made of almost transparent white touches.",
  "Edma’s hand resting on the edge of the cradle.",
  "The baby’s face, barely sketched behind the veil.",
  "The black ribbon at the young mother’s neck.",
  "The pink edging that borders the veil, on the diagonal.",
]
themes = ["motherhood", "sleep", "intimacy", "sisters", "impressionism"]
anecdote = """
Berthe Morisot was the only woman to exhibit at the first Impressionist exhibition, in \
1874. She took part in all the following ones except one, that of 1879, the year after \
the birth of her daughter Julie."""
salle = 3
mur = "nord"
position = -0.2
largeur = 1.2

[[oeuvres]]
titre = "A Box at the Théâtre des Italiens"
artiste = "Eva Gonzalès"
annee = "c. 1874"
image = "loge-aux-italiens.jpg"
technique = "Oil on canvas, 98 × 130 cm"
collection = "Musée d’Orsay, Paris"
note = "A young woman in evening dress and her companion in a theatre box: rejected by the Salon of 1874, the canvas was accepted there five years later."
description = """
A young woman in a pale blue evening gown, with bare shoulders, leans on the red \
velvet edge of a theatre box. She wears a black velvet ribbon at her neck, a rose in \
her hair and another at her bodice, long white gloves and a gold bracelet. She holds a \
pair of ivory opera glasses and looks at us with a dreamy, slightly absent air. Behind \
her, a bearded man in a black tailcoat and white shirt front stands in profile and looks \
to the right, out of the picture, towards the stage or the auditorium. On the left, a \
heavy red and gold curtain with tassels frames the box; on the ledge lies a bouquet \
wrapped in white paper, made of blue flowers around a rose. The background is almost \
black."""
evocation = """
The theatre is one of the great subjects of modern life for the painters of the 1870s: \
one goes there to see the performance, but also to be seen. Gonzalès gives a calm and \
enigmatic version of it. The two figures do not look at each other: the woman turns \
towards us, the man towards an elsewhere we cannot see, and this absence of exchange \
creates a silent distance. It has been read as a reflection on the place of woman in the \
box, exposed to view like an ornament, with her flowers, her gloves and her jewels, but \
whose pensive face hints at an inner life. The picture also shows the ambition of a \
young painter who takes on a large format and a fashionable subject."""
histoire = """
Eva Gonzalès painted the canvas around 1874, having two people close to her pose: her \
younger sister Jeanne and the engraver Henri Guérard, whom Eva would marry in 1879. She \
submitted it to the Salon of 1874, whose jury rejected it. Faithful to the example of \
her master Manet, she did not join the Impressionists, who opened their first \
exhibition the same year, and persevered with the official Salon. She submitted the \
painting again in 1879, and this time it was accepted. After the artist’s premature \
death in 1883, it remained in her family. Her son, Jean Guérard, gave it to the State \
in 1927; it has been displayed at the Musée d’Orsay since 1986."""
facture = """
Manet’s lesson is everywhere: bold contrasts between the black of the tailcoat, the \
dark background and the whiteness of the flesh, the gloves and the shirt front; colours \
laid in broad planes, without needless half-tones; figures framed closely, at half \
length, as in a photograph. Gonzalès adds a personal softness in the pale blue of the \
gown and the pearly treatment of the skin. The bouquet and the tasselled curtain, \
brushed freely, frame the scene. The large format gives the figures an almost \
life-size presence."""
details = [
  "The ivory opera glasses, held in the white-gloved hand.",
  "The bouquet wrapped in white paper, resting on the ledge at left.",
  "The black velvet ribbon and its pendant, at the young woman’s neck.",
  "The gilt studs that adorn the red velvet edge of the box.",
  "The artist’s signature, at lower left, beneath the bouquet.",
]
themes = ["theatre", "modern life", "couple", "gaze", "paris"]
anecdote = """
Eva Gonzalès was the only official pupil of Édouard Manet, who painted her portrait in \
1870, showing her in a white dress before her easel. She died in May 1883, a few days \
after giving birth to her son, and less than a week after the death of Manet."""
