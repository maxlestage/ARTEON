[[oeuvres]]
titre = "Little Girl in a Blue Armchair"
artiste = "Mary Cassatt"
annee = "1878"
image = "fauteuil-bleu.jpg"
technique = "Oil on canvas, 89.5 × 129.8 cm"
collection = "National Gallery of Art, Washington"
note = "A child slumped, weary, in a drawing room overrun with blue armchairs: Cassatt paints the boredom of childhood without a hint of sentimentality."
description = """
A little girl is sprawled in a large blue armchair, legs apart, one arm folded behind \
her head, her gaze lost to the side. She wears a white dress with ruffles, a tartan sash \
and dark patterned stockings. Her armchair, covered in a sky-blue fabric sprinkled with \
flowers and foliage, occupies almost the whole right half of the picture. In another \
armchair, on the left, a small griffon dog sleeps curled in a ball. Behind, a sofa and \
a third armchair in the same fabric, set on a grey-brown floor, lead the eye towards \
the bright windows at the back. At the centre, the empty floor forms a large, \
strangely bare space. At lower left, the artist’s signature."""
evocation = """
Far from the well-behaved, smiling children of the painting of her day, Cassatt shows a \
bored little girl, in a relaxed pose that was thought improper for a young girl. She is \
not an ornament of the drawing room, but a person with a mood of her own. The art \
historian Griselda Pollock saw in it one of the most radical images of childhood of \
its time. The oversized armchairs, which seem almost to swallow her, speak of a child’s \
place in a world of adults. The sleeping dog answers her like a double: two idle \
creatures in a bourgeois interior. The work also asserts the gaze of an artist who \
observes childhood without sentimentality."""
histoire = """
Cassatt painted the canvas in Paris in 1878, shortly after meeting Edgar Degas, who had \
invited her to exhibit with the Impressionists. Degas found her the model, the daughter \
of friends of his, advised her and, according to her, worked on the background \
himself. She sent the picture to the American section of the 1878 Exposition \
Universelle, whose jury rejected it. Twenty-five years later, in a letter to the dealer \
Ambroise Vollard, who had just bought it from her, she still voiced her anger. The \
painting then passed to the Parisian dealer Hector Brame, and in 1963 was acquired by \
the collector Paul Mellon and his wife, who gave it in 1983 to the National Gallery of \
Art in Washington."""
facture = """
The brushwork is of unusual freedom: on the armchairs, the pattern of the fabric is \
rendered with rapid strokes, in red, yellow and green zigzags, that verge on \
abstraction. The off-centre composition, cut by the edges, and the large empty area of \
floor recall Degas and the Japanese prints that the two artists admired. The viewpoint \
is low, almost at the child’s height. Blues dominate, set off by the white of the dress \
and the tartan of the sash. Study of the painting at the National Gallery has confirmed \
Degas’s intervention in the background."""
details = [
  "The signature “Mary Cassatt”, at lower left.",
  "The little griffon asleep in the armchair on the left.",
  "The arm folded behind the head, a gesture of abandon and boredom.",
  "The patterns of the fabric, painted in bright, almost abstract zigzags.",
  "The bright windows at the back, barely sketched.",
]
themes = ["childhood", "boredom", "interior", "dog", "impressionism"]
anecdote = """
The little dog in the painting is a Brussels Griffon, probably given by Degas, who had \
it from the painter Ludovic-Napoléon Lepic, a breeder of the type. Cassatt remained \
faithful to griffons all her life."""
