[[oeuvres]]
titre = "Sunshine in the Blue Room"
artiste = "Anna Ancher"
annee = "1891"
image = "soleil-chambre-bleue.jpg"
technique = "Oil on canvas, 65.2 × 58.8 cm"
collection = "Skagens Museum, Skagen (Denmark)"
note = "Her daughter Helga, absorbed in her work, in her grandmother’s blue sitting room: the real subject is the light."
description = """
In a room with deep blue walls, a fair-haired little girl sits with her back to us near \
a window, bent over some crochet work. The sun enters through the windows with their \
orange curtains, on the right, and casts on the left-hand wall two large patches of \
white light, in which the shadows of the plants on the sill are cut out. The rays also \
stretch across the floor in yellow bands. Around the child are chairs with blue seats, \
a small table covered with a red cloth, a round stool. At upper left, in shadow, a \
framed portrait. At the back, between the two windows, a piece of furniture topped by a \
mirror. The child’s hair, caught in the backlight, glows like a flame."""
evocation = """
Nothing happens, and that is the whole subject. Anna Ancher captures a suspended moment \
of domestic life, the silence of a room where a child works without knowing she is \
watched. The true protagonist is the northern light, raking and changing, which turns \
the blue wall into a vibrating surface and projects the shadows of the plants like a \
picture within the picture. It has been seen as an echo of seventeenth-century Dutch \
interiors, with their women busy beside a window, but seen with a modern sensibility. \
The picture also evokes the transmission between three generations of women: the \
grandmother whose room it is, the mother who paints, the daughter absorbed in her \
work."""
histoire = """
Anna Ancher painted this picture in 1891 in Skagen, at the northern tip of Denmark, \
where she was born and where an artists’ colony had formed around the inn run by her \
parents. The room is her mother’s sitting room, the child’s grandmother’s: the full \
Danish title says so. The model is Helga, the only daughter of Anna and the painter \
Michael Ancher, born in 1883. Anna would often paint the interiors of the family home \
and of her own house, under different lights. The painting belongs to the Skagens \
Museum, founded in 1908 by painters of the colony, including Michael Ancher, and by the \
hotelier Degn Brøndum, Anna’s brother."""
facture = """
Ancher builds the picture through colour: an intense blue for the wall, warmed by the \
orange of the curtains and the yellow of the rays on the floor. The brushwork is broad \
and visible, especially in the patches of sunlight, laid on thickly with bluish whites. \
This attention to complementary colours and to light brings the work close to \
Impressionism. The figure, small and seen from behind, is only one element of the \
composition, on a par with the chairs and the windows."""
details = [
  "The shadows of the windowsill plants, cast on the blue wall.",
  "The child’s fair hair, lit by the backlight.",
  "The bands of yellow sunlight on the floor.",
  "The framed portrait, at upper left, in shadow.",
  "The signature and the date, at lower right.",
]
themes = ["light", "interior", "childhood", "blue", "skagen"]
anecdote = """
Anna and Michael Ancher appeared together on the old Danish 1,000-krone banknote: a rare \
honour for a couple of painters, and for a woman artist. Their house in Skagen, \
preserved with its furniture, can be visited today."""
salle = 4
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "The Blue Room"
artiste = "Suzanne Valadon"
annee = "1923"
image = "chambre-bleue.jpg"
technique = "Oil on canvas, 90 × 116 cm"
collection = "Centre Pompidou, Paris (on deposit at the Musée des Beaux-Arts, Limoges)"
note = "An odalisque of a new kind: in striped pyjamas, a cigarette on her lips, books beside her, she poses for no one."
description = """
A full-figured, dark-haired woman lies on a bed covered with a blue bedspread \
patterned with large white and yellow leaves. She wears a pink top with thin straps and \
pyjama trousers with broad green and white stripes; her feet are bare. Propped on a big \
white pillow, a cigarette at the corner of her lips, she looks elsewhere, lost in \
thought. On the left, two books, one red, one yellow, lie on the bed. Blue hangings \
frame the scene like a theatre curtain, in front of a wall papered with plant motifs in \
faded tones, pink, ochre and green. At lower left, the signature and the date."""
evocation = """
Valadon takes up an ancient subject of painting, the reclining woman, from Titian’s \
Venus of Urbino to Manet’s Olympia, and turns it upside down. Her model is neither \
nude, nor offered, nor idealised: she is dressed for comfort, smokes, has read or is \
about to read, and does not care about the viewer. The books beside her signal an inner \
life. This canvas has often been seen as an image of the freedom of the modern woman of \
the 1920s, painted by an artist who had herself been a model for Renoir, Puvis de \
Chavannes and Toulouse-Lautrec, and who knew from the inside the painters’ gaze on the \
female body."""
histoire = """
Suzanne Valadon painted The Blue Room in 1923, in Paris, at nearly sixty, at the moment \
when her painting was at last meeting with success among dealers and collectors. The \
picture entered the national collections as early as the 1920s, a sign of official \
recognition rare for a woman painter in her lifetime. It now belongs to the Centre \
Pompidou, Musée national d’art moderne, which has deposited it at the Musée des \
Beaux-Arts in Limoges, in the artist’s native Limousin. It was one of the highlights of \
the major Valadon retrospective shown at the Centre Pompidou-Metz in 2023, then at the \
Centre Pompidou in Paris in 2025."""
facture = """
Valadon outlines her forms with a dark, emphatic line, a legacy of her skill as a \
draughtswoman, encouraged by Degas. Within these contours, the colour is laid in bold, \
saturated flat areas: the deep blue of the fabrics, the acid green of the stripes, the \
pink of the top. The decorative patterns of the bedspread and the wallpaper, almost as \
present as the figure, recall Matisse, but Valadon refuses any conventional elegance: \
the body is massive, the feet broad, the face unpainted. The figure stretches across \
the full width of the canvas."""
details = [
  "The cigarette on her lips, a detail then thought improper in a woman.",
  "The two books, red and yellow, lying on the bed at left.",
  "The dark line that outlines the arm, the leg and the bare feet.",
  "The white leaves of the blue bedspread, laid on like stencils.",
  "The signature and the date, at lower left.",
]
themes = ["woman", "modernity", "interior", "odalisque", "freedom"]
anecdote = """
Before becoming a painter, Suzanne Valadon was called Marie-Clémentine. According to \
tradition, it was Toulouse-Lautrec who nicknamed her Suzanne, in allusion to the \
biblical episode of Susanna and the Elders, because she posed for painters older than \
herself."""
