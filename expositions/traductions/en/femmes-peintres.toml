[exposition]
ordre = 105
nom_court = "Women Painters"
mouvement = "Women painters, 16th–20th century"
cadre = "dore"
couleur = "#8a3a5c"
titre = "Women Painters, Four Centuries of Vision"
artiste = "Anguissola, Leyster, Kauffman, Morisot, Cassatt, Valadon…"
dates = "1555–1923"
accroche = "Virtual exhibition · National Museum of Women in the Arts, Washington"
introduction = """
For centuries, women were kept out of the academies, the studios and the life-drawing \
classes: those who painted did so through talent and sheer persistence, often thanks to \
an artist father or husband. This visit brings together ten of them, from the Cremona of \
1555 to the Paris of the 1920s: family portraits, genre scenes, flowers, self-portraits \
that lay claim to a profession, Impressionism and modernity. The building is inspired by \
the National Museum of Women in the Arts in Washington, a former Masonic temple that in \
1987 became the first major museum devoted to women artists: you enter through its great \
marble hall with its mezzanine, before passing into the salons."""
vitrine = "berceau.jpg"

[musee]
nom = "National Museum of Women in the Arts"
ville = "Washington, United States"
architecte = "Waddy Butler Wood"
construction = "1907–1908"
presentation = """
In 1981, the collector Wilhelmina Cole Holladay and her husband Wallace founded a museum \
in Washington devoted to women artists, who were then almost absent from the major \
collections. In 1983 they bought a former Masonic temple, built in 1907–1908 in the \
Renaissance Revival style by the architect Waddy Butler Wood, a few streets from the \
White House. Restored, the building opened to the public in 1987. Its heart is the Great \
Hall, a two-storey marble state room lit by chandeliers, from which a double staircase \
rises to the mezzanine. The galleries present a collection of several thousand works, \
from the Renaissance to the present day, from Lavinia Fontana and Clara Peeters to Frida \
Kahlo and Louise Bourgeois. After two years of renovation, the museum reopened in \
October 2023."""
ici = """
ARTEON follows the layout of the temple. The Great Hall, a light-filled room 16 metres \
by 14 and 10 metres high, welcomes visitors from the south. To the west opens Salon I · \
The Pioneers, with powder-pink walls. To the north, two doors cut into the end wall, \
where the double staircase rises in the real museum, lead to The Mezzanine · The \
Impressionists, as large as the hall but here on the same level, and 6.5 metres high. \
Finally, you return through the hall to the east and Salon II · Light and Freedom, with \
cream walls. The two salons, 5.5 metres high, are more intimate."""

