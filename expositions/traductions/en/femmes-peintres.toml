[[artistes]]
nom = "Sofonisba Anguissola"
vie = "Cremona, c. 1532 – Palermo, 16 November 1625"
biographie = """
Sofonisba was the eldest of the six daughters of Amilcare Anguissola, a cultivated minor \
nobleman of Cremona, in Lombardy, who had all his children educated. She learned \
painting under Bernardino Campi, then Bernardino Gatti: an apprenticeship with a master, \
exceptional for a young girl. Her father brought her works to the attention of \
influential figures; Michelangelo himself, according to the sources of the time, \
encouraged her and commented on her drawings. In 1559, her reputation earned her a \
summons to the Spanish court in Madrid, as lady-in-waiting to the young queen \
Elisabeth of Valois, wife of Philip II, whom she taught to draw; there she painted many \
portraits of the royal family. Married in the early 1570s to a Sicilian nobleman, \
Fabrizio de Moncada, she settled in Sicily. Widowed, she married a Genoese ship’s \
captain, Orazio Lomellino, and lived in Genoa and then Palermo. In 1624, very old and \
almost blind, she received a visit from the young Anthony van Dyck, who drew her and \
noted down her remarks on painting. She died in Palermo the following year, at over \
ninety."""
style = """
Anguissola renewed the portrait by bringing life into it: smiles, exchanged glances, \
gestures caught from life, where tradition preferred the solemn pose. Her many \
self-portraits, at the easel, at the harpsichord or with a book in hand, make her one of \
the first artists to construct her own image. Attentive to naturalness and to detail, in \
the Lombard tradition, she showed that a woman could achieve a European reputation and \
opened the way for court portraitists."""

[[artistes]]
nom = "Judith Leyster"
vie = "Haarlem, baptised 28 July 1609 – Heemstede, 10 February 1660"
biographie = """
Judith Leyster was born in Haarlem in 1609 into a family of brewers and clothmakers; the \
name of her father’s brewery, the Pole Star (Leyster), became the family’s name. As early \
as 1628, when she was not yet twenty, a chronicler of the city listed her among the \
talented painters. She worked in the circle of Frans Hals, though it is not known \
whether she was his pupil. In 1633 she was admitted as a master to the Haarlem Guild of \
Saint Luke, which allowed her to keep a studio and train apprentices. In 1635 she \
brought before the guild a dispute with Frans Hals, who had taken in an apprentice who \
had left her without permission. In 1636 she married the painter Jan Miense Molenaer; \
the couple settled in Amsterdam, then returned to Heemstede, near Haarlem. A mother of \
several children, she painted far less from then on, but probably took part in her \
husband’s business. She died in 1660. Forgotten for more than two centuries, her works \
attributed to Hals or to Molenaer, she was rediscovered in 1893 by the historian \
Cornelis Hofstede de Groot."""
style = """
Leyster excels in genre scenes: musicians, drinkers, children at play, often lit by \
candle or lantern. Her lively, free brushwork recalls that of Frans Hals, so much so \
that her paintings were long attributed to him, but her night scenes and her more \
intimate interiors, such as The Proposition, in which a man offers money to a woman who \
is sewing, reveal a gaze of her own. She signed with a monogram, her initials pierced by \
a star."""

[[artistes]]
nom = "Rachel Ruysch"
vie = "The Hague, 3 June 1664 – Amsterdam, 12 August 1750"
biographie = """
Rachel Ruysch was born in The Hague in 1664 and grew up in Amsterdam, in a learned \
milieu: her father, Frederik Ruysch, professor of anatomy and botany, owned a famous \
cabinet of curiosities filled with natural specimens, which she observed from \
childhood. Her mother, Maria Post, was the daughter of the architect Pieter Post. At \
about fifteen, she was apprenticed to Willem van Aelst, one of the best flower painters \
in Amsterdam. In 1693 she married the portraitist Juriaen Pool, with whom she had ten \
children, without ever ceasing to paint. In 1701 she was admitted, with her husband, to \
the painters’ confraternity of The Hague. From 1708 to 1716 she was court painter to \
the Elector Palatine Johann Wilhelm, in Düsseldorf, who commissioned paintings from \
her for himself and for his circle. After the Elector’s death, she returned to \
Amsterdam. Her career lasted nearly seventy years: celebrated by poets in her \
lifetime, she painted until well past eighty and died in Amsterdam in 1750."""
style = """
Ruysch took the flower still life to an extreme refinement: asymmetrical, animated \
compositions, bouquets that seem to overflow the frame, a dark background from which \
the colours spring. Each flower, each insect, each drop of water is rendered with a \
naturalist’s exactness, inherited from her father’s scientific milieu. Slowly painted \
and relatively few in number, her pictures were among the most sought after of her \
time."""

[[artistes]]
nom = "Angelica Kauffman"
vie = "Chur (Switzerland), 30 October 1741 – Rome, 5 November 1807"
biographie = """
The daughter of the painter Joseph Johann Kauffman, Angelica was born in Chur, in the \
Grisons, and grew up between Switzerland, Austria and Italy, where her father took her \
as commissions required. A child prodigy, she spoke several languages, sang and \
painted from adolescence. In Italy, in Florence, Rome and Naples, she copied the old \
masters and frequented Neoclassical circles; in 1764 she painted the portrait of the art \
historian Johann Joachim Winckelmann. In 1766 she settled in London, where she enjoyed \
immediate success as a portraitist and history painter, befriended Joshua Reynolds and, \
in 1768, became one of the founding members of the Royal Academy. In 1781 she married \
the decorative painter Antonio Zucchi and settled in Rome the following year. Her \
studio on the Via Sistina became a meeting place for cultivated Europe: Goethe, during \
his Italian journey, visited her assiduously. She died in Rome in 1807, and her solemn \
funeral was organised by the sculptor Antonio Canova."""
style = """
Kauffman is one of the great figures of Neoclassicism. She dared to paint history, the \
most prestigious genre, almost reserved for men, and willingly chose heroines of \
Antiquity and of literature. Her figures with pure profiles, her supple drapery, her \
soft colours and her frieze-like compositions were widely circulated through engraving \
and reproduced on porcelain, furniture and interior decoration, notably that of the \
architect Robert Adam."""

[[artistes]]
nom = "Adélaïde Labille-Guiard"
vie = "Paris, 11 April 1749 – Paris, 24 April 1803"
biographie = """
The daughter of a Parisian merchant, Adélaïde Labille trained first in miniature under \
François-Élie Vincent, then in pastel under Maurice Quentin de La Tour, and finally in \
oil painting under her first master’s son, François-André Vincent. Married in 1769 to \
Louis-Nicolas Guiard, she separated from him about ten years later. A member of the \
Académie de Saint-Luc, she exhibited her pastels and portraits there with success. On \
31 May 1783 she was admitted to the Royal Academy of Painting and Sculpture. In 1787 \
she became first painter to Mesdames, the aunts of Louis XVI. During the Revolution, \
she painted deputies of the Constituent Assembly and argued for the admission of women \
to the Academy and for their training. In 1793 she had to destroy a large canvas \
commissioned by the Count of Provence, the king’s brother, which had become suspect. \
She continued to teach, surrounded by her pupils, married François-André Vincent, her \
lifelong companion, in 1800, and died in Paris in 1803."""
style = """
A virtuoso pastellist before turning to oil, Labille-Guiard is a portraitist of great \
frankness: she flatters her sitters little and renders faces, fabrics and accessories \
with precision. Her state portraits rival those of Vigée Le Brun, with a more sober \
realism. Through her teaching and her commitment, she helped open access to artistic \
training for women."""

[[artistes]]
nom = "Berthe Morisot"
vie = "Bourges, 14 January 1841 – Paris, 2 March 1895"
biographie = """
The daughter of a senior civil servant, Berthe Morisot grew up in Paris in a \
comfortable milieu. With her sister Edma, she took drawing lessons and then copied the \
masters at the Louvre; the two young women received advice from Camille Corot, who \
introduced them to open-air painting. Berthe exhibited at the Salon from 1864. In 1868 \
she met Édouard Manet, who painted her several times, notably in The Balcony. In 1874 \
she broke with the Salon and took part in the first Impressionist exhibition; the same \
year she married Eugène Manet, the painter’s brother, who supported her career. Their \
daughter Julie was born in 1878. One of the most loyal members of the group, Morisot \
counted Degas, Monet, Renoir and the poet Stéphane Mallarmé among her friends. In \
1894 the State bought one of her canvases for the Musée du Luxembourg. She died the \
following year, at fifty-four, of an illness contracted while nursing her daughter."""
style = """
Morisot has the freest brushwork in Impressionism: rapid strokes, often zigzagging, that \
sometimes leave the canvas visible and give her pictures the look of a sketch. She \
paints chiefly the lives of the women and children of her milieu, interiors, gardens, \
dressing, in a clear light and harmonies of pearly whites. Long reduced to the role of \
Manet’s model, she is now recognised as one of the major figures of the movement."""

[[artistes]]
nom = "Mary Cassatt"
vie = "Allegheny City (Pennsylvania), 22 May 1844 – Le Mesnil-Théribus (Oise), 14 June 1926"
biographie = """
Born near Pittsburgh into a well-off family, Mary Cassatt spent part of her childhood \
in Europe. She studied at the Pennsylvania Academy of the Fine Arts in Philadelphia, \
then settled in Paris in 1866, despite her father’s reluctance. She copied the masters \
at the Louvre, travelled in Italy, Spain and the Netherlands, and exhibited at the \
Salon from 1868. In 1877, Edgar Degas invited her to join the Impressionists: she \
exhibited with them in 1879, 1880, 1881 and 1886, the only American in the group. From \
the 1880s she devoted herself chiefly to the theme of mother and child. In 1890, a \
major exhibition of Japanese prints at the École des Beaux-Arts inspired in her a \
series of colour prints of great modernity. An adviser to wealthy American collectors, \
notably Louisine and Henry Havemeyer, she helped bring Impressionism into American \
museums. Afflicted by cataracts, she had to stop painting around 1914 and died in 1926 \
at her château of Beaufresne, in the Oise."""
style = """
Cassatt combines the rigour of drawing, learned from the old masters and from Degas, \
with the clear colour of the Impressionists. Her scenes of women and children, closely \
framed, capture everyday gestures with accuracy and without sentimentality. The \
influence of Japanese prints can be seen in her off-centre compositions, her flat \
areas of colour and her clean lines, above all in her colour prints of 1890–1891."""

[[artistes]]
nom = "Eva Gonzalès"
vie = "Paris, 19 April 1849 – Paris, 6 May 1883"
biographie = """
The daughter of the novelist Emmanuel Gonzalès, who presided over the Société des gens \
de lettres, Eva Gonzalès grew up in Paris among writers and artists. From 1866 she \
attended the classes of the painter Charles Chaplin, who ran a studio reserved for \
women. In 1869 she became the pupil of Édouard Manet and posed for him: the portrait he \
exhibited at the Salon of 1870 shows her in a white dress, painting before an easel. \
She herself made her Salon debut the same year. Like her master, she did not take part \
in the Impressionist exhibitions and continued to show her work at the official Salon, \
despite rejections. She painted scenes of modern life, portraits, pastels and still \
lifes, often with her sister Jeanne as model. In 1879 she married the engraver Henri \
Guérard. She died in May 1883, aged thirty-four, a few days after the birth of her son \
and shortly after the death of Manet. A retrospective exhibition was devoted to her in \
Paris as early as 1885."""
style = """
Gonzalès remains faithful to Manet’s manner: bold contrasts, deep blacks, luminous flat \
areas, sharply cut figures. Her subjects are those of modern life, theatre boxes, \
interiors, women at their toilette, treated with a restrained elegance. Over the years \
her palette lightens and her pastels grow softer through contact with Impressionism, \
though she never adopts the broken brushwork of her friends."""

[[artistes]]
nom = "Suzanne Valadon"
vie = "Bessines-sur-Gartempe (Haute-Vienne), 23 September 1865 – Paris, 7 April 1938"
biographie = """
Marie-Clémentine Valadon was born in the Limousin, the illegitimate daughter of a \
laundress who soon moved to Paris. She grew up in Montmartre, took on a string of odd \
jobs, worked for a time in a circus, and then, as a teenager, became a model for \
painters: Pierre Puvis de Chavannes, Auguste Renoir, Henri de Toulouse-Lautrec. She \
observed them and drew as a self-taught artist. In 1883 she gave birth to a son, the \
future painter Maurice Utrillo. Edgar Degas, to whom she showed her drawings, \
encouraged her, bought sheets from her and introduced her to engraving. In 1894 she was \
the first woman admitted to the Société nationale des beaux-arts. Married in 1896 to \
Paul Mousis, a well-off businessman, she gradually devoted herself to oil painting. \
Around 1909 she left him for André Utter, a painter and friend of her son, twenty-one \
years her junior, whom she married in 1914. In the 1920s she at last found success, \
exhibited regularly and sold well. She died in Paris in 1938."""
style = """
Valadon draws first, and her painting keeps the strength of line: dark, emphatic \
contours enclose solid bodies, painted without idealisation. Her female nudes, the work \
of a woman who had herself been a model, break with the tradition of the male gaze. Her \
bright colours and decorative backgrounds bring her close to Gauguin and the Nabis, but \
she attached herself to no group and followed a highly personal path."""

[[artistes]]
nom = "Anna Ancher"
vie = "Skagen (Denmark), 18 August 1859 – Skagen, 15 April 1935"
biographie = """
Anna Brøndum was born in Skagen, a small fishing port at the far north of Jutland, \
where her parents ran the town’s inn. From the 1870s the place attracted painters who \
came in search of the exceptional light of this coast, and the inn became their \
meeting place. The young Anna drew in their midst; she then attended, in Copenhagen, \
from 1875 to 1878, the women’s drawing school of the landscape painter Vilhelm Kyhn. In \
1880 she married the painter Michael Ancher, one of the artists of the colony; their \
daughter Helga was born in 1883. Although a married woman was often expected to give up \
painting, she continued her work. In 1888–1889 she studied in Paris under Pierre Puvis \
de Chavannes. She exhibited in Denmark and abroad and became one of the most esteemed \
painters of her country. She spent almost her whole life in Skagen, where her house, \
preserved as she left it, is now a museum."""
style = """
Anna Ancher is the painter of light in interiors. She depicts the daily life of Skagen, \
women at work, old men, children, rooms flooded with sun, with constant attention to \
colour and reflections. Her taste for pure colours and simplified forms, bolder than \
that of many painters of the colony, foreshadows modern painting. She remains one of \
the great figures of Danish painting."""
