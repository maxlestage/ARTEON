[[oeuvres]]
titre = "The Drawbridge (Imaginary Prisons, plate VII)"
artiste = "Giovanni Battista Piranesi"
annee = "c. 1745–1750, plate reworked in 1761"
image = "prisons-pont-levis.jpg"
cadre = "estampe"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Giovanni_Battista_Piranesi_-_The_Drawbridge,_plate_VII_from_the_series_Carceri_d'Invenzione_-_Google_Art_Project.jpg"
technique = "Etching, approximately 55 × 41 cm"
collection = "Cooper Hewitt, Smithsonian Design Museum, New York"
note = "Staircases, walkways and drawbridges intertwine beneath endless vaults: a prison born of Piranesi’s imagination, which became one of the most famous images of dreamed architecture."
description = """
The eye plunges into an immense space, closed on all sides, of which neither the \
ceiling nor the floor can be seen. Massive stone piers support arches, galleries and \
staircases that rise, turn and cross in every direction. At the centre, \
a wooden drawbridge, suspended from ropes and pulleys, links two walkways. \
On the right, a round tower pierced by a barred window clings to the masonry, a \
large lantern hanging from its flank. Everywhere, tiny figures walk on the \
bridges, lean on the balustrades or climb the steps, dwarfed by the scale of \
the structure. At lower left, a great wheel bristling with spikes and chains \
suggest instruments of torture."""
evocation = """
Piranesi does not engrave a real prison: he invents an impossible place, where \
perspectives contradict one another and where one never knows where the light comes from. These Imaginary \
Prisons have been seen as a tribute to the grandeur of Roman architecture, whose \
vaults and colossal foundations he admired, but also as a nightmare \
of confinement, in which man loses himself in a space he has himself built. The theme came \
from the theatre: the opera designers of the day, like the Bibiena, painted grandiose \
dungeons for the stage. Piranesi makes of it a subject in its own right. In the nineteenth \
century, the Romantics read in it the vertigo of dreams; in the twentieth, they have been compared to the \
inescapable spaces of Kafka or the impossible staircases of Escher."""
histoire = """
Having come from Venice to Rome in 1740, the young Piranesi, trained as an architect, found \
few buildings to build and turned to engraving. Around 1749–1750, he published \
with the dealer Giovanni Bouchard a suite of fourteen plates without title or \
caption, the Invenzioni capric di carceri, “capricious inventions of prisons”. \
In 1761, by then famous, he reworked all the plates: he darkened them, adding \
chains, inscriptions and staircases, and engraved two new ones. This second \
edition, entitled Carceri d’invenzione, comprises sixteen plates. The copper plates, kept \
after his death by his son, are today in Rome, at the Istituto centrale per la \
grafica, heir to the former Calcografia, which has pulled numerous impressions from them. \
This one entered the Cooper Hewitt museum, in New York, in 1959."""
facture = """
Etching allows Piranesi to draw with the point in the varnish covering the \
copper, with the freedom of a sketch: lines run fast, overlap, \
leave zones barely sketched. For the second edition, he had the acid bite \
more deeply and multiplied the cross-hatching, so that the shadows become \
dense and almost black. The composition, seen from below, juxtaposes several \
viewpoints, a legacy of stage design, and makes the space seem higher than it \
could be. The small figures, indicated in a few strokes, give the scale."""
details = [
  "The drawbridge, at the centre, held by ropes descending from pulleys.",
  "The round tower on the right, with its barred window and large lantern.",
  "The tiny prisoners or guards walking on the walkways.",
  "The wheel bristling with spikes, at lower left.",
  "The staircase winding in a spiral around a pillar, left of centre.",
]
themes = ["imaginary architecture", "prison", "vertigo", "engraving", "dream"]
anecdote = """
In his Confessions of an English Opium-Eater (1821), Thomas De Quincey relates that \
the poet Coleridge had described to him engravings by Piranesi called the “Dreams”: \
endless staircases, which he compares to opium visions. They are the Prisons."""
salle = 2
mur = "nord"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "View of the Flavian Amphitheatre, Known as the Colosseum (Views of Rome)"
artiste = "Giovanni Battista Piranesi"
annee = "1776"
image = "colisee.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Veduta_dell'Anfiteatro_Flavio_detto_il_Colosseo,_from-_'Vedute_di_Roma'_(Views_of_Rome)_MET_DP104275.jpg"
technique = "Etching; sheet 76.2 × 101.6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The Colosseum seen from above, as from a balloon: Piranesi reveals at a single glance its ruined tiers, the arena and the double enclosure."
description = """
The Colosseum fills the whole sheet, seen from above and at an angle, as if the engraver had \
risen above Rome. In the foreground, the collapsed part of the enclosure reveals \
the thickness of the walls, the superimposed arcades and the vaulted corridors that carried the \
tiers. In the background, the outer enclosure, intact over its whole height, draws a \
regular curve of arcades. The stone tiers have vanished: only the \
vaults that supported them remain, overgrown with scrub. At the centre of the vast, empty \
arena, a cross stands; all around, small chapels line the perimeter. \
A few tiny strollers cross the esplanade. Below, two engraved cartouches \
give the title and a caption keyed with letters."""
evocation = """
Piranesi wants to show the grandeur of ancient Rome, but also what time has \
made of it. The Colosseum appears as a landscape more than as a building: a hollow, \
gnawed mountain, where vegetation reclaims its rights. The view from above, which no one \
could then have, also serves to explain: it makes one understand at a glance \
how the amphitheatre was built, and the caption designates the seats of the consuls, \
senators, knights or women. For Piranesi, who defended the \
superiority of the Romans over the Greeks in a lively debate of his time, these ruins \
proved the genius of the Roman builders. The cross and chapels recall that \
the amphitheatre had become a place of prayer dedicated to the Christian martyrs."""
histoire = """
The Vedute di Roma, or Views of Rome, were a lifelong undertaking: Piranesi \
engraved the first plates around 1748 and worked on them until his death, in 1778, for a \
total of about 135 views. Sold singly in his Roman shop, they were \
bought by Grand Tour travellers, young English, French or German aristocrats \
who came to complete their education in Italy and took them home as \
souvenirs. They shaped for a long time the image Europe had of Rome: \
some visitors confessed their disappointment before ruins less grandiose than in \
the engravings. This bird’s-eye view, one of the last of the series, is dated \
1776. The impression exhibited has belonged to the Metropolitan Museum in New York since 1959."""
facture = """
The plate, of very large format, is etched with an architect’s precision: \
every arcade, every vault, every collapsed stone is described. \
Piranesi strengthens the contrasts by having the shadows of the foreground bitten more deeply, \
while the background remains light, which deepens the perspective. The \
raised, almost impossible viewpoint allows him to show both the inside and \
the outside of the monument. The strollers, deliberately tiny, make it grander \
still."""
details = [
  "The cross at the centre of the arena, surrounded by the small chapels of a Way of the Cross.",
  "The letters engraved on the building, which refer to the caption at the bottom of the sheet.",
  "The collapsed part of the enclosure, in the foreground, which shows the structure in section.",
  "The scrub and shrubs growing on the vaults.",
  "The signature “Cav. Piranesi F.”, at lower right: Piranesi was a knight.",
]
themes = ["Rome", "ruins", "antiquity", "Grand Tour", "engraving"]
anecdote = """
In 1749, Pope Benedict XIV consecrated the Colosseum to the memory of the Christian martyrs and had a \
Way of the Cross installed there: hence the cross and chapels in the arena. They were \
removed in the nineteenth century, during the excavation of the underground levels."""
salle = 3
mur = "ouest"
place = 2
largeur = 3.0

[[oeuvres]]
titre = "Newton’s Cenotaph, Section (Night Effect Inside)"
artiste = "Étienne-Louis Boullée"
annee = "1784"
image = "cenotaphe-newton.jpg"
cadre = "estampe"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Étienne-Louis_Boullée,_Cénotaphe_de_Newton_-_04_-_Coupe,_représentation_de_jour_avec_effet_intérieur_de_nuit.jpg"
technique = "Pen, ink and wash on paper"
collection = "Bibliothèque nationale de France, Département des Estampes, Paris"
note = "To honour Isaac Newton, Boullée imagines a hollow sphere about one hundred and fifty metres across: by day, its vault pierced with holes becomes a starry sky."
description = """
The drawing shows the monument cut in two, like a model sliced down the middle. \
At the centre, an immense hollow sphere is set into a circular base with two \
tiers, whose terraces are planted with rows of cypresses. The interior of the \
sphere is entirely black, sown with stars and a brighter orb: this is the \
vault seen from within. At the very bottom, at the deepest point, a tiny sarcophagus \
rests on a platform, surrounded by a few barely visible figures. A long \
sloping corridor leads to it from outside. Outside, the sky is clear and cloudy: \
it is daytime. In the thickness of the base, on each side, opens a gallery vaulted in a \
semicircle."""
evocation = """
Newton, who died in 1727, had explained the movement of the stars by gravitation. \
Boullée offers him a tomb on the scale of the universe: the sphere, a perfect form, with no \
beginning or end, represents the cosmos itself. The visitor, having descended to the bottom of this \
shell, would be alone before the sarcophagus and an artificial sky, seized by what \
eighteenth-century philosophers called the sublime: an emotion made of admiration and \
dread before immensity. The project is also an Enlightenment tribute to science: \
architecture here no longer serves a king or a god, but a scholar. This kind \
of project has been called “speaking” architecture: the form of the building says by itself what it \
celebrates."""
histoire = """
Boullée drew this project in 1784, at the age of fifty-six, when he had almost stopped \
building to devote himself to teaching and theoretical projects. No one \
had commissioned it from him, and there was never any question of building it: a sphere of this \
size was far beyond the technical means of the period. A cenotaph is, moreover, an empty \
tomb, Newton lying in Westminster Abbey. The drawing was meant to illustrate \
Boullée’s treatise, Architecture, Essay on Art, in which he defends an architecture of \
great geometric volumes, made to move. The text remained in manuscript. At his death, \
in 1799, the architect bequeathed his drawings to the nation; they are kept in the \
Bibliothèque nationale. Rediscovered in the twentieth century, they brought him posthumous fame, and \
the essay was at last published in 1953."""
facture = """
Boullée works in wash: he spreads diluted ink with a brush, in layers more or \
less dark, to model volumes by light rather than by line. He \
violently opposes the deep black of the interior to the pale grey of the outside sky; he \
prided himself on having invented an “architecture of shadows”. The stars are only \
small pale dots on the black ground. The composition is strictly symmetrical, \
reduced to a few pure forms: circle, semicircles, rectangles. The cypresses, trees \
of cemeteries, and the small figures give the monument’s colossal scale."""
details = [
  "Newton’s tiny sarcophagus, at the very bottom of the sphere.",
  "The stars, denser at upper right, like a Milky Way.",
  "The rows of cypresses on the terraces of the base.",
  "The long, gently sloping corridor that leads to the tomb.",
  "The small round stamp of the Bibliothèque nationale, at bottom centre.",
]
themes = ["sphere", "Newton", "Enlightenment", "utopian architecture", "cosmos", "sublime"]
anecdote = """
Boullée had also foreseen the opposite effect: another drawing in the same series shows the \
cenotaph by night, the outside sky black, while the interior is lit by a \
great luminous globe hung at the centre of the sphere, like a sun."""
salle = 2
mur = "nord"
place = 1
largeur = 3.2

[[oeuvres]]
titre = "The Pyramids of Giza, from the Southwest"
artiste = "Francis Frith"
annee = "c. 1857 (print c. 1865)"
image = "pyramides-gizeh.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Francis_Frith_-_Pyramids_Of_El-Geezeh_(From_The_Southwest)_-_Google_Art_Project.jpg"
technique = "Albumen print, 38.1 × 48.9 cm"
collection = "Los Angeles County Museum of Art (LACMA)"
note = "The three great pyramids lined up in the desert, photographed on a giant glass plate by an English traveller who made the journey to Egypt three times."
description = """
Three pyramids rise beyond a stretch of sand and pebbles. At the centre, \
the one that looks tallest is that of Khafre, which keeps at its summit a remnant of \
its smooth limestone casing. On the right, further off, rises that of Khufu, the \
Great Pyramid. On the left, the smallest, that of Menkaure, is preceded by three \
more modest pyramids, known as the queens’ pyramids. In the foreground, on a dark mound \
covered with pebbles, two men sit on the ground; a little further off, a mount \
and its keeper wait. The sky, very pale, is almost white. The raking light \
brings out the courses of stone, step after step, on the sides of the \
pyramids."""
evocation = """
For the English public of the 1850s, these images were a revelation: for the \
first time, the pyramids were seen as they are, without an engraver’s interpretation. Frith, who also wrote, accompanied his photographs with texts in which he \
insisted on their truthfulness. The small figures in the foreground give the scale and \
recall that these mountains of stone were raised by men, more than \
four thousand five hundred years ago. The contrast between the almost abstract desert and the \
perfect geometry of the pyramids makes the image a meditation on time and \
permanence, a theme dear to Victorian England, which saw in Egypt the dawn of \
civilisation."""
histoire = """
Francis Frith, who had made a fortune in trade in Liverpool, left for Egypt in \
1856 with his photographic equipment. He returned twice, until 1859, went up \
the Nile as far as Nubia, then visited Palestine and Syria. His photographs were \
published in London in books and albums illustrated with real prints pasted into the \
pages, such as Egypt and Palestine Photographed and Described. They enjoyed great \
success and exist in several formats, including these large prints made from \
glass negatives of about 40 by 50 centimetres. This one was probably printed \
a few years after the exposure, around 1865. It belongs today to the Los Angeles County \
Museum of Art."""
facture = """
Frith uses wet collodion, a demanding process: the glass plate must be \
coated, sensitised, exposed and developed within minutes, before the layer \
dries. In the desert heat, the ether in the collodion evaporates very fast, and \
one must work in a stifling laboratory tent. The print is made by contact \
on albumen paper, coated with egg white, which yields very fine detail. The \
composition, very simple, superimposes three horizontal bands, the dark foreground, \
the pale sand and the white sky, against which the triangles of the \
pyramids are silhouetted."""
details = [
  "The summit of the pyramid of Khafre, which keeps a remnant of its original casing.",
  "The three small queens’ pyramids, in front of that of Menkaure, on the left.",
  "The mount and its keeper, tiny amid the sand.",
  "The two men seated in the foreground, who give the scale.",
]
themes = ["Egypt", "pyramids", "desert", "travel", "photography"]
anecdote = """
Back in England, Frith founded in Reigate the firm F. Frith & Co., which \
photographed thousands of British towns and villages and sold their views, \
then postcards, until its closure in 1971."""
salle = 3
mur = "nord"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Interior of Hagia Sophia, Constantinople"
artiste = "Sébah & Joaillier"
annee = "late 1880s"
image = "sainte-sophie.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Sainte_Sophie_LCCN2004667900.jpg"
technique = "Albumen print"
collection = "Library of Congress, Washington"
note = "Beneath Justinian’s dome, which became a mosque in 1453, the great medallions of Ottoman calligraphy: a view sold to travellers passing through Constantinople."
description = """
The photograph is taken from a high vantage point, at the entrance to the nave, facing the apse. The \
eye takes in the immense space: at top, the rim of the central dome, pierced by a \
crown of windows; below, a half-dome, then other smaller ones, which \
nest together to the far end. On each side, two storeys of arcades on columns open \
onto the aisles and galleries. Large dark discs bear, in \
gilded letters, names written in Arabic. Below, one can make out galleries of wood and \
marble and dozens of lamps hung on long cords, which descend almost \
to the floor. In the pendentives, beneath the dome, angels appear with wings \
spread. At the bottom of the image, the studio has inscribed “Sainte Sophie 127”."""
evocation = """
Hagia Sophia sums up the whole history of Constantinople: great church of \
the Byzantine Empire for nine centuries, then imperial mosque of the Ottoman sultans. The \
photograph shows this double life: the architecture willed by Justinian and the Byzantine \
angels of the pendentives, but also the Ottoman additions, medallions, pulpit, galleries \
and lamps. For European travellers of the late nineteenth century, ever more \
numerous, such an image fixed the memory of a place famous throughout Christendom \
as in the Muslim world. One reads in it above all the wonder before the dome, which \
seems to float above a crown of light, as the Byzantine authors already said."""
histoire = """
The church of Hagia Sophia, “Divine Wisdom”, was built from 532 to 537 on the order \
of the emperor Justinian, by two scholars, Anthemius of Tralles and Isidore of Miletus. In \
1453, when Sultan Mehmed II took Constantinople, it became a mosque and gradually \
received its minarets. From 1847 to 1849, Sultan Abdülmecid had it restored by the \
Ticinese architects Gaspare and Giuseppe Fossati: it was then that the eight \
great medallions calligraphed by Kazasker Mustafa İzzet Efendi were hung, bearing the names of God, of the \
Prophet, of the first four caliphs and of the Prophet’s two grandsons. The studio \
Sébah & Joaillier sold this view, numbered 127, to passing visitors. This print \
is kept in the Library of Congress, in Washington."""
facture = """
Photographing so vast and dark an interior was a challenge: a long \
exposure was needed for the weak light from the windows to register on the glass plate. The \
photographer chose a high viewpoint and a lens wide enough to fit \
within the frame the side arcades and the nesting of the domes, in strict \
symmetry. The albumen print has taken on with time this golden yellow tone, typical of \
photographs of the period, which strangely matches the gold of the mosaics."""
details = [
  "The medallions of Allah and Muhammad, on either side of the apse.",
  "The seraphim, six-winged angels, in the pendentives beneath the dome.",
  "The oil lamps, hung very low on long cords.",
  "The gallery with small columns, on the left, added in the Ottoman period.",
  "The inscription “Sainte Sophie 127”, left by the studio at the bottom of the image.",
]
themes = ["Byzantium", "Islam", "dome", "Istanbul", "calligraphy"]
anecdote = """
Hagia Sophia has changed status several times: turned into a museum in 1934 by the \
government of Mustafa Kemal Atatürk, it became a mosque again in 2020, while \
remaining open to visitors outside prayer times."""
salle = 3
mur = "sud"
place = 3
largeur = 2.4

[[oeuvres]]
titre = "The Taj Mahal from the Yamuna, Agra"
artiste = "Samuel Bourne"
annee = "1860s"
image = "taj-mahal.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Gezicht_op_de_Taj_Mahal_vanaf_de_Yamuna_rivier,_RP-F-F80408.jpg"
technique = "Albumen print"
collection = "Rijksmuseum, Amsterdam"
note = "The white marble mausoleum raised by the emperor Shah Jahan, seen from the bank of the Yamuna by the most famous British photographer of India."
description = """
The Taj Mahal stands on its high terrace, on the edge of the Yamuna river, whose calm \
water occupies the right of the image. The photographer stood on the bank, so \
that the monument is seen in three-quarter view: the great bulbous dome, the small \
domes around it, the deep arches of the façade and the minarets. On the left, a \
red sandstone building crowned with domes and kiosks frames the whole. A long \
retaining wall runs along the river. In the foreground, trees and a stretch of sand \
where small figures can be made out. The mausoleum is faintly reflected in the water. At the bottom \
of the image, the negative bears the inscription “Bourne 1087”."""
evocation = """
The Taj Mahal is a tomb of love: the Mughal emperor Shah Jahan had it built \
for his wife Mumtaz Mahal, who died in 1631 giving birth to their fourteenth \
child. Its whiteness and perfect symmetry evoke, according to many historians, the \
paradise promised by the Qur’an, with its gardens and waters. By showing it from the \
river rather than from the garden and its long water channel, Bourne gives a less expected image of it: the mausoleum appears as a palace at the water’s edge, a little \
distant, almost unreal in the white light. For the British, who \
then governed India, these images testified to a refined civilisation that they \
admired while dominating it."""
histoire = """
The Taj Mahal was built at Agra from 1632 by thousands of craftsmen from \
all over the Mughal empire; the mausoleum was completed around 1643, the whole complex around 1653. At his \
death, in 1666, Shah Jahan was buried beside his wife. In the nineteenth century, the monument, \
partly dilapidated, became an obligatory stop for British travellers. Samuel Bourne, \
who arrived in India in 1863, photographed it on his tours; his studio, Bourne & \
Shepherd, then sold the prints under a number, here 1087, to anyone wishing to buy them, \
and his views were widely distributed in Europe. This print belongs to the Rijksmuseum \
in Amsterdam, which has placed its reproductions in the public domain."""
facture = """
Bourne works in wet collodion, with a large wooden camera and glass plates that he \
had to prepare on the spot, under a black tent, in the heat of India. \
An admirer of picturesque landscapes, he composes his views like a painter: the trees \
of the foreground form a dark repoussoir, the diagonal of the bank and the wall \
leads the eye towards the monument, and the river opens the space on the right. The white \
marble, very luminous, is difficult to render: Bourne chooses a light that preserves \
the details of the façade without burning them out."""
details = [
  "The signature “Bourne 1087”, inscribed on the negative, at the bottom of the image.",
  "The reflection of the mausoleum in the calm water of the Yamuna.",
  "The small domes surrounding the great bulbous dome.",
  "The tiny silhouettes on the beach, at the foot of the wall.",
  "The red sandstone building on the left, which contrasts with the white marble.",
]
themes = ["India", "mausoleum", "love", "Mughal Empire", "travel"]
anecdote = """
