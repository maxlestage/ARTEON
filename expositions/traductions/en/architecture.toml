[[oeuvres]]
titre = "West Façade of the Great Pagoda (Angkor Wat)"
artiste = "Émile Gsell"
annee = "1866"
image = "angkor-vat.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Façade_Ouest_de_la_Grande_Pagode_MET_DP151650.jpg"
technique = "Albumen print from a glass negative, 25.1 × 30.3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "One of the very first photographs of Angkor Wat, taken in 1866 by a French photographer based in Saigon."
description = """
A broad stone causeway, overgrown with grass, leads to the temple. In the background rise \
the towers of Angkor Wat, shaped like lotus buds, carved with superimposed \
cornices: the tallest at the centre, two others on either side, a fourth half \
hidden on the left. In front of them, the roofs of the galleries step down over several \
levels, and a staircase climbs to a terrace and a carved porch. On the left, \
coconut palms, palm trees and a wooden pavilion with a pointed roof; on the right, large \
dark trees. In the foreground, the broken paving and vegetation show \
a monument that is scarcely maintained any more. The sky, cloudless, is a uniform \
white."""
evocation = """
For Europeans of the 1860s, Angkor was a “lost city” in the midst of the \
jungle, revealed by the accounts of the naturalist Henri Mouhot, published after his death. \
Gsell’s photographs provide the proof: the temple exists, immense and almost \
intact. The myth of discovery is nevertheless misleading. Angkor Wat was never \
abandoned: Buddhist monks lived there and Cambodians came on \
pilgrimage, as the wooden pavilion recalls here, which no doubt belongs to the \
monastery. The image also speaks of the interest of France, which had just imposed its \
protectorate on Cambodia, in 1863, and would make of Angkor a symbol of its presence in \
Indochina."""
histoire = """
Angkor Wat was built in the first half of the twelfth century, under the Khmer king \
Suryavarman II, as a temple dedicated to the god Vishnu and, probably, as the king’s \
funerary sanctuary; it later became a place of Buddhist worship. In 1866, Émile Gsell \
went to Angkor with the naval officer Ernest Doudart de Lagrée, at the outset of the \
Mekong exploration mission, and made there a series of views of the temples. These are \
among the first photographs of the site, taken the same year as those of \
the Scot John Thomson. The mount of this print, removed here, bears the title \
“Cambodge, ruines d’Ang-Kor”. The print belongs to the Gilman collection, acquired \
by the Metropolitan Museum in New York in 2005."""
facture = """
Gsell uses wet collodion, in a tropical climate where heat, humidity and \
insects complicate every exposure. He places himself on the axis of the causeway, which \
deepens the perspective and leads the eye to the central tower, following the symmetry desired \
by the Khmer architects. The sky remained white: the plates of the period, mainly \
sensitive to blue, could not record both the clouds and the detail of the \
stones. Some slightly blurred foliage betrays the wind during the exposure."""
details = [
  "The central tower, the tallest, which represents Mount Meru, centre of the world.",
  "The wooden pavilion with a pointed roof, on the left, a sign of the monks’ presence.",
  "The grass growing between the slabs of the causeway.",
  "The carved porch at the top of the staircase, at the centre of the image.",
]
themes = ["Cambodia", "temple", "Khmer", "jungle", "exploration"]
anecdote = """
Angkor Wat is one of the few great Khmer temples facing west, a direction \
associated with the god Vishnu and with death. This is why travellers, like Gsell, \
approached it by this façade, at the end of the long causeway that crosses the moat."""
salle = 4
mur = "nord"
place = 3
largeur = 2.2

[[oeuvres]]
titre = "The Eiffel Tower under Construction"
artiste = "Louis-Émile Durandelle"
annee = "1888"
image = "tour-eiffel-construction.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Louis-Emile_Durandelle,_The_Eiffel_Tower_-_State_of_the_Construction,_1888.jpg"
technique = "Albumen print"
collection = "J. Paul Getty Museum, Los Angeles"
note = "At the end of 1888, the tower rises above the Champ-de-Mars: the photographer Durandelle follows the building site, stage by stage, for Gustave Eiffel’s firm."
description = """
The tower stands, seen from the front, in the middle of a wasteland. Its four iron piers \
join beneath a first platform, then rise to the second level, already \
completed; above, the upper part is still only a trunk of metal latticework, \
topped by scaffolding. The great decorative arch, beneath the first level, frames in the distance \
the Trocadéro palace and its two towers. At the foot of the tower, a few trees and \
site huts. The ground, in the foreground, is made of turned earth and rubble. \
The hazy sky, a uniform beige, brings out the dark lace of the girders."""
evocation = """
For Gustave Eiffel, these photographs are a demonstration: day after day, the \
tower rises according to the planned schedule. They answer the artists and writers who, \
in 1887, had signed a protest against “the useless and monstrous Eiffel Tower”. \
Today, the image fascinates precisely because it shows the unfinished tower, like \
a skeleton taking shape: one understands in it how iron, assembled piece by \
piece, allows one to climb higher than any masonry. It celebrates the engineer and \
the worker, industry and progress, values of the Exposition Universelle of 1889, which \
marked the centenary of the French Revolution."""
histoire = """
The tower was conceived in 1884 by two engineers of the Eiffel firm, Maurice \
Koechlin and Émile Nouguier, then reworked with the architect Stephen Sauvestre. \
Selected for the Exposition Universelle of 1889, it was built in a little over \
two years: work began on 28 January 1887, and the tower was completed on 31 March \
1889, when Eiffel hoisted the tricolour flag at its summit. At 300 metres high, it \
remained until 1930 the tallest structure in the world. Durandelle photographed the \
site from the foundations; his views, gathered in albums entitled “État \
d’avancement des travaux”, were presented by Eiffel to dignitaries. This print \
belongs to the J. Paul Getty Museum in Los Angeles."""
facture = """
Durandelle often photographs the tower from the same viewpoint, on its axis, so that \
successive views can be compared like the frames of a film: one sees the tower \
grow from one print to the next. He works with a large camera and large-format glass \
plates, which give remarkable sharpness to the iron latticework. The \
perfect frontality and symmetry give the tower the air of a classical monument. \
The albumen print, in sepia tone, has paled with time, which accentuates the haze."""
details = [
  "The Trocadéro palace, now vanished, visible beneath the great arch.",
  "The scaffolding at the top, where work continues.",
  "The arches beneath the first level, purely decorative: they carry nothing.",
  "The site huts and young trees at the foot of the piers.",
]
themes = ["Paris", "iron", "building site", "engineer", "Exposition Universelle"]
anecdote = """
The Trocadéro palace, built for the Exposition Universelle of 1878, was replaced for \
that of 1937 by the present Palais de Chaillot, which kept part of its \
structures."""
salle = 5
mur = "nord"
place = 2
largeur = 1.7

[[oeuvres]]
titre = "Casa Batlló, Barcelona"
artiste = "Antoni Gaudí"
annee = "1904–1906"
image = "casa-batllo.jpg"
credit = "Photo : ChristianSchd"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Casa_Batllo_Overview_Barcelona_Spain_cut.jpg"
technique = "Façade of Montjuïc sandstone, glass, ceramic and cast iron; photograph of 2013"
collection = "Passeig de Gràcia 43, Barcelona"
note = "Gaudí transforms an ordinary building into an undulating façade, covered in mosaic and crowned by a scaly roof: the most recent work in the exhibition, photographed in our own day."
description = """
The façade rises between two more classical buildings, in beige stone. On the \
ground and first floors, large bays with bone-shaped stone mullions open onto the street. Above, the façade, as if sown with scales and discs \
of colour, blue, green and pink, undulates gently; small iron balconies in the \
shape of masks cling to it, floor after floor. The roof, curved and domed, is \
covered with glazed tiles that shine like the skin of a reptile. On the left, a \
turret topped by a four-armed cross dominates the whole. Below, on the \
pavement, passers-by stop to look; it is the end of the day, and the windows \
are lit."""
evocation = """
The people of Barcelona nicknamed the building the “house of bones” or the “house of \
yawns”, because of its columns and openings. A widespread interpretation sees in it the legend of Saint George, patron saint of Catalonia: the roof would be the \
dragon’s back, the turret and its cross the saint’s lance, the balconies the skulls of the \
victims. Gaudí left no explanation. The work expresses above all his idea that \
architecture should draw inspiration from nature, which knows no straight line: its forms \
evoke the sea, seaweed, bones or scales. It also bears witness to the \
prosperity of the Catalan bourgeoisie, who vied in daring along the Passeig de \
Gràcia."""
histoire = """
The textile industrialist Josep Batlló owned on the Passeig de Gràcia, the great \
avenue of Barcelona’s Eixample, a building constructed in 1877. Rather than \
demolish it, Gaudí transformed it from 1904 to 1906: he redid the façade, added a floor and \
the roof, enlarged the inner courtyard and redesigned the family’s apartment. His \
collaborator Josep Maria Jujol took part in the decoration. On the same block are \
the Casa Amatller by Puig i Cadafalch and the Casa Lleó Morera by Domènech i \
Montaner, two other masters of Catalan Modernisme: this group was nicknamed the “block of \
discord”. Open to the public since 2002, the Casa Batlló has been a UNESCO \
World Heritage Site since 2005."""
facture = """
The façade is of Montjuïc sandstone, from Barcelona’s hill, cut into supple forms \
that seem modelled rather than carved. Gaudí covers it with a rendering in which are \
embedded fragments of coloured glass and ceramic discs, following the technique of \
trencadís, a mosaic of fragments that he often used. The balconies are of cast iron. \
The roof tiles, rounded in shape, take on changing reflections according to the \
light. The whole façade is conceived as a living surface, which changes with \
the time of day."""
details = [
  "The columns of the large bays of the first floor, bone-shaped.",
  "The mask-shaped balconies, pierced with two large eyes.",
  "The turret and its four-armed cross, on the left of the roof.",
  "The glazed roof tiles, like a dragon’s scales.",
  "The fragments of coloured glass embedded in the façade.",
]
themes = ["Modernisme", "Barcelona", "nature", "mosaic", "façade"]
anecdote = """
In the inner courtyard, Gaudí varied the colour of the ceramic tiles, from dark \
blue at the top to very pale blue at the bottom, so that the light falling from the skylight \
appears equal on every floor."""
salle = 5
mur = "est"
place = 2
largeur = 1.7

[[artistes]]
nom = "Giovanni Battista Piranesi"
vie = "Mogliano Veneto (Republic of Venice), 4 October 1720 – Rome, 9 November 1778"
biographie = """
The son of a Venetian stonemason, Giovanni Battista Piranesi learned architecture from \
his uncle, an engineer in charge of the lagoon’s dykes, as well as perspective and \
stage design. In 1740, he left for Rome as a draughtsman in the retinue of the Venetian \
ambassador. The ancient city overwhelmed him. For lack of architectural commissions, he learned engraving and published in 1743 \
a first collection of imaginary architecture. After a return to Venice, he settled \
permanently in Rome around 1747 and opened a shop where he sold his own prints. \
The Views of Rome, the Imaginary Prisons and the four volumes of the Roman Antiquities \
(1756) made him famous throughout Europe. He defended passionately, against the \
admirers of Greece, the originality of the Romans. The Venetian Pope Clement XIII \
made him a knight, and the pope’s nephew, Cardinal Rezzonico, entrusted him with his only \
architectural commission: the church of Santa Maria del Priorato, on the Aventine, where he is \
buried. He also designed chimneypieces, vases and furniture. After his death, his \
son Francesco continued his work and took the copper plates to Paris."""
style = """
Piranesi is an architect who engraves: he thinks in volumes, structures and shadows. \
His etchings, of an energy of line without equal, combine archaeological \
exactness and imagination, to the point that he readily enlarges ruins to make them \
more striking. His vision of ancient Rome, grandiose and melancholy, \
nourished Neoclassicism, architects such as Soane, then the Romantic imagination; \
his Prisons still inspire filmmakers and illustrators."""

[[artistes]]
nom = "Étienne-Louis Boullée"
vie = "Paris, 1728 – Paris, 1799"
biographie = """
The son of an architect, Étienne-Louis Boullée wanted to become a painter, but his father \
steered him towards architecture. He followed the teaching of Jacques-François Blondel and of \
Jean-Laurent Legeay, who had returned from Rome with a taste for antique forms and grand \
compositions. Elected to the Royal Academy of Architecture in 1762, he built for \
wealthy clients several town houses in Paris and country residences, \
of which almost nothing remains. From the 1780s, he gradually gave up building \
to devote himself to teaching and vast drawn projects, a royal library, \
opera house, cathedral, palace, cenotaphs, which would never be realised. In them he \
developed an architecture of pure geometric volumes, sphere, cylinder, pyramid, on \
a colossal scale, and wrote a treatise, Architecture, Essay on Art. Among his \
pupils were Jean-François Chalgrin, the architect of the Arc de Triomphe, and \
Jean-Nicolas-Louis Durand, whose lessons would influence the whole nineteenth century. He died \
in Paris in 1799, leaving his drawings to the nation. Long forgotten, he was rediscovered \
in the twentieth century, and his essay was published for the first time in 1953."""
style = """
Boullée seeks to move through geometry alone: simple, outsized, repeated \
volumes, and the play of light and shadow, which he believed capable of giving birth to \
melancholy or admiration. His wash drawings, closer to painting than to \
technical plans, foreshadow visionary architecture. His projects have been recognised as \
the ancestors of many modern monuments."""

[[artistes]]
nom = "Francis Frith"
vie = "Chesterfield (England), 7 October 1822 – Cannes, 25 February 1898"
biographie = """
Born into a Quaker family in Derbyshire, Francis Frith first made a career in \
trade in Liverpool: he founded a wholesale grocery business, then a printing works, \
and sold them at a profit in the mid-1850s. A passionate photographer, he \
then decided to leave for the East. Between 1856 and 1859, he made three journeys to \
Egypt, Nubia, Palestine and Syria, with several cameras, including a giant camera \
for 16 × 20 inch plates. His views of the pyramids, the temples of Luxor and Abu Simbel, published in books and albums of original prints, caused a \
sensation in Britain. On his return, he settled in Reigate, in Surrey, and \
founded the firm F. Frith & Co., which set about photographing the towns and \
villages of the United Kingdom. His operators travelled the country for decades, and \
the firm sold prints and then postcards until 1971. Frith, who also wrote \
on religion and morality, died in 1898 at his villa in Cannes. His archives \
today form a collection of several hundred thousand views of \
Great Britain."""
style = """
Frith is a photographer of exactness: he shows monuments as they are, in \
large formats of stunning sharpness, with clear, often frontal framing, \
and small figures to give the scale. His texts insist on the truthfulness of \
photography, as opposed to the embellished views of Orientalist painters. He helped \
found travel photography and, through his firm, the illustrated postcard."""

[[artistes]]
nom = "Sébah & Joaillier"
vie = "Constantinople (Ottoman Empire), studio active from 1888"
biographie = """
The Sébah & Joaillier studio is one of the great photographic studios of \
Constantinople at the end of the Ottoman Empire. It succeeded the studio founded in 1857 \
by Pascal Sébah, a photographer born in Constantinople, based in the Pera district, \
where many Europeans lived. Pascal Sébah photographed the monuments, \
landscapes and inhabitants of the Empire, opened a branch in Cairo and supplied the \
photographs for an official album on the folk costumes of Turkey, prepared for the \
Vienna World’s Fair in 1873. After his death, in 1886, his son Jean \
Pascal Sébah went into partnership in 1888 with the Frenchman Policarpe Joaillier: the company name \
became Sébah & Joaillier. The studio sold to travellers numbered and titled views \
of Constantinople, its mosques, palaces, fountains and the Bosphorus, \
as well as portraits and scenes of daily life. It also worked for the \
Ottoman court. Its prints, kept today in many libraries and \
museums, constitute a precious source for the history of Istanbul and its \
monuments."""
style = """
The studio’s views combine documentary sharpness with a careful composition, inherited \
from landscape painting: high viewpoints, deep perspectives, even light. \
Designed for travellers, they are numbered, titled in French, the international \
language of the period, and sold singly or in albums. They fixed for \
Europe the image of a Constantinople at once Byzantine and Ottoman."""

[[artistes]]
nom = "Samuel Bourne"
vie = "Muckleston (Staffordshire, England), 30 October 1834 – Nottingham, 24 April 1912"
biographie = """
The son of a Staffordshire farmer, Samuel Bourne first worked as a bank clerk in \
Nottingham, while practising photography as an amateur; he made his name in the late 1850s with his landscapes of the Lake District. In 1863, he \
left the bank and set out for India. Settled in Simla, the summer capital of the \
British government, at the foot of the Himalayas, he went into partnership with Charles Shepherd: \
their studio took the name Bourne & Shepherd. Between 1863 and 1866, he led three \
major photographic expeditions in the Himalayas, with dozens of porters \
carrying his cameras, glass plates and chemicals; in \
1866, he photographed at more than 5,500 metres altitude, at the Manirang Pass. He \
also travelled the plains of northern India, from Delhi to Agra and Benares, and \
Kashmir, and recounted his journeys in the British Journal of Photography. In 1870, he \
returned to England, ran a cotton-spinning business in Nottingham and \
neglected photography for watercolour. The Bourne & Shepherd studio, one of the \
oldest in the world, operated in India until 2016."""
style = """
Bourne is a landscapist in the spirit of the English picturesque: he seeks balanced \
viewpoints, with a foreground of trees or rocks, a stretch of water and a \
monument or mountain in the distance. Technically irreproachable, he mastered wet collodion \
in extreme conditions. His thousands of views shaped the image of India \
in Europe, but they also reflect the gaze of colonial power."""

[[artistes]]
nom = "Émile Gsell"
vie = "Sainte-Marie-aux-Mines (Haut-Rhin), 31 December 1838 – Saigon, 16 October 1879"
biographie = """
Born in Alsace, in an industrial valley of the Vosges, Émile Gsell enlisted in \
the army and left for Cochinchina, where France had just established itself, in the early \
1860s. There he discovered photography and decided to remain in the Far East: \
settled in Saigon, he opened one of the first photographic studios in the colony. \
In 1866, he accompanied to Cambodia the naval officer Ernest Doudart de Lagrée, head \
of the Mekong exploration mission, and made at Angkor a series of views of the \
temples that rank among the very first photographs of the site. He also photographed \
Cochinchina, its towns, canals, landscapes and inhabitants, then \
Tonkin, in the north of Vietnam. His Saigon studio supplied portraits to colonists and \
views to administrations and travellers; his albums helped make \
Indochina known in France. He died in Saigon in 1879, at forty. His \
prints, scattered, are today kept in major public collections, \
in France and the United States."""
style = """
Gsell is a documentary photographer: frontal views, ample framing, a concern to \
show the whole of a building or a landscape. His prints, warm in tone, are \
of great sobriety. Working in difficult conditions, he recorded the state \
of Angkor before the great clearing and restoration works of the twentieth century, which \
gives his images the value of testimony, even if they also served colonial \
propaganda."""

[[artistes]]
nom = "Louis-Émile Durandelle"
vie = "France, 1839 – 1917"
biographie = """
Louis-Émile Durandelle is one of the great architectural photographers of France under the \
Second Empire and the Third Republic. He began his career alongside \
Hyacinthe-César Delmaet, with whom he went into partnership: the signature Delmaet et Durandelle \
appears on many prints. After Delmaet’s death, he continued the business \
alone. He specialised in a then-new genre: construction-site photography. \
For years, he followed the construction of Charles Garnier’s Opera, photographing \
the foundations, the metal framework, the sculptures and decorations, \
gathered in albums. He also documented the construction of the Basilica of the Sacré-Cœur, in \
Montmartre, and of many buildings in Paris. For the Exposition Universelle of 1889, \
he photographed the Eiffel Tower, from the foundations, in spring 1887, to its \
completion. These series, commissioned by contractors, architects or the State, \
served to report on the progress of the works and to preserve the memory of \
techniques. Rediscovered in the twentieth century, they are kept notably at the Musée \
d’Orsay, the Bibliothèque nationale de France and the Getty Museum in Los Angeles."""
style = """
Durandelle photographs architecture in the making rather than the finished monument: \
scaffolding, cranes, beams and workers become his subjects. His frontal, sharp \
and methodical views, often taken from the same point on successive dates, \
form true chronicles. Their rigour, without picturesque effect, was admired \
in the twentieth century as an engineer’s aesthetic."""

[[artistes]]
nom = "Antoni Gaudí"
vie = "Reus (Catalonia), 25 June 1852 – Barcelona, 10 June 1926"
biographie = """
The son of a boilermaker, Antoni Gaudí i Cornet grew up in the Catalan countryside, where he \
observed plants, animals and rocks at length; it is reported that he \
attributed his sense of space to his father’s workshop, where volumes were shaped \
in copper. He studied architecture in Barcelona and obtained his diploma in 1878. The \
same year, he met the industrialist Eusebi Güell, who became his patron and for whom \
he built the Palau Güell, Park Güell and the church of the Colonia Güell. His \
early works, such as the Casa Vicens, drew on Mudéjar art; he then invented \
a very personal style, nourished by Gothic and nature. In 1883, he took over \
the direction of the Sagrada Família, a temple begun the year before, which \
would occupy him until his death. In the early twentieth century, he built in Barcelona the Casa \
Batlló, then the Casa Milà, known as La Pedrera. From 1914, he devoted himself \
exclusively to the Sagrada Família, living almost as an ascetic. Struck by a tram \
on 7 June 1926, he died three days later and was buried in the crypt of the \
basilica. Seven of his works are inscribed on the UNESCO World Heritage List."""
style = """
Gaudí rejects the right angle and the flat façade: his buildings undulate, lean and \
cover themselves in mosaics of broken ceramic, the trencadís. He seeks his forms \
with models made of weighted chains, to find arches that stand \
without buttresses. His work, at the crossroads of Catalan Modernisme, Gothic and \
the observation of nature, remains one of the most original in the history of \
architecture."""
