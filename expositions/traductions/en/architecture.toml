[exposition]
ordre = 290
nom_court = "Architecture"
mouvement = "The Architecture of the World, in Images"
cadre = "noir"
couleur = "#3f4f5c"
titre = "Building the World: Architecture in Engravings, Drawings and Photographs"
artiste = "Piranesi, Boullée, Frith, Bourne, Gsell, Durandelle, Gaudí…"
dates = "1750–1912"
accroche = "Virtual exhibition · Sir John Soane’s Museum, London"
introduction = """
Before cinema and the aeroplane, it was through images that Europe discovered the great \
buildings of the world: engravings, architects’ drawings, then photographic prints \
brought back from Egypt, Turkey, India or Cambodia. The visit brings together nine images, from \
Piranesi’s dreamed-up prisons to the cenotaph imagined by Boullée for Newton, from the pyramids \
of Giza to the temples of Angkor, from the building site of the Eiffel Tower to the façade of \
Gaudí’s Casa Batlló. The building is inspired by Sir John Soane’s Museum in London, the \
house-museum of an architect-collector: a vestibule, a tall domed room, \
a red library, a yellow drawing room and a picture room."""
vitrine = "cenotaphe-newton.jpg"

[musee]
nom = "Sir John Soane’s Museum"
ville = "London, United Kingdom"
architecte = "Sir John Soane"
construction = "1792–1824"
presentation = """
The architect John Soane, designer of the Bank of England, bought a house in \
Lincoln’s Inn Fields, London, in 1792, then the two neighbouring houses, which he rebuilt \
one after another until 1824. He made it at once his home, his office and a \
museum for his students: antique casts, fragments of capitals, models, paintings \
and thousands of architectural drawings were crammed into it, right up to the skylights. In 1833, \
an Act of Parliament allowed him to bequeath the whole to the nation, on condition \
that nothing be moved; the museum opened at his death, in 1837, and admission is \
still free. It contains astonishing spaces: the dome, lit from \
above, over the crypt where the sarcophagus of the pharaoh Seti I lies; the Picture \
Room, whose walls open like shutters to reveal the series by \
Hogarth and drawings by Piranesi; the library painted in Pompeian red; the \
yellow drawing rooms of the first floor."""
ici = """
ARTEON’s building takes up, in simpler and larger form, the sequence of rooms \
in Soane’s house. One enters from the south into the Lincoln’s Inn Fields vestibule, \
with its stone-coloured walls, which opens onto the dome: a square room fourteen \
metres high, where Piranesi’s prisons and Boullée’s cenotaph frame the door to the \
north. To the west, the red library, the colour of Pompeii, brings together Rome, Egypt and \
Byzantium; to the east, the yellow drawing room welcomes the travelling photographers, from India to \
Cambodia. To the north, the picture room shows modern architecture: the Eiffel Tower \
under construction and the Casa Batlló."""

