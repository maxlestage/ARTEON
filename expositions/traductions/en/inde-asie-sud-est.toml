[exposition]
ordre = 26
nom_court = "India and Southeast Asia"
mouvement = "India and Southeast Asia"
cadre = "vitrine"
couleur = "#9a4a1c"
titre = "Gods, Buddhas and Princes: The Art of India and Southeast Asia"
artiste = "Gandhara, Gupta, Chola, Java, Angkor, Pagan, Rajputs, Ravi Varma…"
dates = "3rd century – 1899"
accroche = "Virtual exhibition · Chhatrapati Shivaji Maharaj Vastu Sangrahalaya, Mumbai"
introduction = """
Sixteen centuries of art born in India and carried, with Buddhism and Hinduism, \
as far as Java, Cambodia, Burma and Thailand. Along the way we meet a Gandharan \
bodhisattva draped in the Greek manner, a Gupta Buddha in red sandstone, Shiva dancing \
in his circle of flames, a head from Borobudur and a many-faced god from Angkor, \
followed by pages painted for the Rajput courts and a painting by Raja Ravi Varma. \
The building is inspired by the Chhatrapati Shivaji Maharaj museum in Mumbai: one passes \
through a porch and enters beneath a lofty dome, while two wings open out on either \
side, one for the sculpture of Southeast Asia, the other for painting."""
vitrine = "nataraja.jpg"

[musee]
nom = "Chhatrapati Shivaji Maharaj Vastu Sangrahalaya (formerly the Prince of Wales Museum)"
ville = "Mumbai (Bombay), India"
architecte = "George Wittet"
construction = "1905–1922"
presentation = """
In the early twentieth century, notables of Bombay decided to found a museum \
in memory of the visit of the Prince of Wales, the future George V, who laid its \
foundation stone in November 1905. The Scottish architect George Wittet, who would \
also design the Gateway of India on the harbour, conceived a building in the Indo-Saracenic style: \
walls of grey basalt and pale stone, balconies and arches borrowed from Mughal architecture \
and the palaces of western India, and, at the centre, a great dome. \
Completed during the First World War, the building first served as a military \
hospital and opened to the public only in 1922. In 1998 it was renamed after Chhatrapati \
Shivaji Maharaj, founder of the Maratha kingdom in the seventeenth century. Surrounded by a garden, \
the museum today brings together tens of thousands of objects: sculptures from ancient \
India, bronzes, miniatures, weapons, textiles and natural history \
collections."""
ici = """
The ARTEON building takes up the composition of the Mumbai museum: a porch, a lofty \
central hall beneath the dome and two symmetrical wings. One enters from the south into \
the Porch, with its pale stone walls, and then the Dome Hall, square and sixteen metres \
high, where the dancing Shiva faces the visitor between the Gandharan bodhisattva \
and the Gupta Buddha. To the west, the Southeast Asia Gallery, twenty metres long and sand-coloured, \
brings together Java, Angkor, Pagan and Thailand; to the \
east, the Gallery of Paintings, in terracotta pink, presents the Rajput courts \
and Ravi Varma."""

