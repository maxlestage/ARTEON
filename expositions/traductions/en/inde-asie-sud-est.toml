[[oeuvres]]
titre = "Standing Bodhisattva Maitreya"
artiste = "Gandhara, époque kouchane"
annee = "c. 3rd century"
image = "maitreya-gandhara.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DP123372.jpg"
technique = "Gray schist, 163.2 × 53.3 × 20.3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The Buddha of the future, as an Indian prince draped like a Roman: the art of Gandhara was born of the meeting of India and the Greek world."
description = """
A young man stands, life-size, before a broad stone disc \
that forms his halo. His wavy hair falls in curls over his shoulders and \
is tied at the top of his head in a double-looped topknot. He wears a fine \
moustache turned up at the tips. His torso partly bare, he is adorned with jewellery: layered necklaces, \
a cord hung with amulets across his chest, bracelets and an \
armlet. A draped cloth passes over his left shoulder and falls in a broad \
arched scarf in front of his thighs; a long pleated skirt descends to the \
ankles. On his feet are strapped sandals. The right forearm, which was once raised, \
is missing. On the base, small figures at prayer surround an \
object placed at the centre."""
evocation = """
Maitreya is the Buddha to come: according to Buddhist tradition, he waits in heaven \
for the moment to be reborn on earth and teach again, when the teaching of the \
historical Buddha has been forgotten. Before this final birth, he is a \
bodhisattva, a being of Awakening who has chosen to remain among men to help them. \
This is why the sculptor shows him as a prince, with the jewels and moustache \
of the nobles of his day, and not as a monk with a shaven head. The topknot with loops and the \
small water flask, which the left hand still seems to grasp, are his usual attributes. \
The resemblance of this face and drapery to Roman statues has often been noted: \
an Indian god dressed in the antique manner."""
histoire = """
Gandhara extends around Peshawar, in the north-west of present-day Pakistan. \
After Alexander the Great passed through, Greek kingdoms ruled there, and the region \
became, under the Kushan empire, a crossroads between India, Iran, Central \
Asia and the Roman world. Buddhist monasteries there were filled with statues and \
reliefs carved in the local schist. This statue probably stood in \
one of these sanctuaries, at the foot of a stupa or in a chapel. Its exact findspot \
is unknown. It entered the Metropolitan Museum of Art in 1991, purchased \
thanks to a gift from the Lita Annenberg Hazen Charitable Trust."""
facture = """
Gray schist, a fine, dense rock, lends itself to detail: the sculptor was able to \
carve into it the tight folds of the cloth, the locks of hair and the links \
of the necklaces. The drapery, which follows the body and falls in heavy, regular folds, \
comes from Greco-Roman sculpture, as does the slight bend of one leg that \
animates the pose. The statue was carved to be seen from the front, set against a wall: \
the halo and the back are more summary. Originally, the stone was perhaps \
enhanced with colour or gilding."""
details = [
  "The fine moustache with upturned tips, like a prince’s.",
  "The cord of amulets that crosses the chest diagonally.",
  "The scarf falling in an arc in front of the thighs, with its regular folds.",
  "The strapped sandals, tied between the toes.",
  "The small worshippers at prayer carved on the base.",
]
themes = ["Buddhism", "bodhisattva", "Gandhara", "Greek influence", "drapery"]
anecdote = """
The two giant Buddhas of Bamiyan in Afghanistan, 38 and 55 metres high, \
belonged to the Buddhist world that inherited from Gandhara. They were destroyed with \
explosives by the Taliban in March 2001."""
salle = 2
mur = "ouest"
place = 3
largeur = 0.8

[[oeuvres]]
titre = "Standing Buddha Offering Protection"
artiste = "Inde du Nord, époque gupta"
annee = "late 5th century"
image = "bouddha-mathura.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT237.jpg"
technique = "Red sandstone, 85.5 × 42.5 × 16.5 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Carved at Mathura, this Buddha, his body wrapped in fine folds, embodies the classical model that all of Asia imitated."
description = """
The Buddha stands facing the viewer, his body upright and calm. His head is covered \
with small snail-shell curls, surmounted by a rounded protuberance. \
His eyelids are lowered, his earlobes elongated, and his full face \
remains perfectly serene. He wears a monastic robe so fine that it seems \
wet: it clings to the body, revealing the shoulders, belly and legs, \
and is marked only by cord-like folds that descend in regular \
garlands over the whole figure. His left hand holds the edge of \
the cloth; the right, which was raised with the palm open, is broken. Behind the head, \
a fragment of the halo preserves a finely chiselled foliage decoration."""
evocation = """
The lost gesture of the right hand, palm turned toward the worshipper, is the abhaya-mudra, \
the gesture of reassurance: “do not be afraid.” The statue tells no story; \
it shows a being who has reached Awakening, detached from the world, whose perfect, \
smooth body speaks of inner peace. Indian texts list the physical marks \
of an exceptional being, such as the protuberance on the skull or the elongated lobes, which \
the sculptor respects. Under the Guptas, these signs merge into an image of great \
gentleness, long regarded as the classical expression of the \
Buddha. Pilgrims from China and Southeast Asia brought back \
copies, and this model was imitated from Java to Thailand."""
histoire = """
The Gupta dynasty ruled northern India from the fourth century; this period \
is often called the classical age of Indian art. Two great workshops of \
Buddhist sculpture then dominated: Sarnath, near Benares, where the Buddha \
preached his first sermon, and Mathura, on the Yamuna, south of Delhi. Mathura \
worked a red sandstone speckled with pale flecks, quarried nearby, and had produced \
statues for all of northern India for centuries. This figure comes from \
that workshop; it probably stood in a monastery. The Metropolitan Museum \
of Art purchased it in 1979, thanks to a gift from Enid A. Haupt."""
facture = """
The sculptor achieved the wet-cloth effect by treating the robe as a \
second skin, on which he laid, in very low relief, folds in parallel \
ridges. The volume of the body, simplified and rounded, is not muscular: it is \
conceived as an ideal form rather than an observed body. The rather soft red sandstone of \
Mathura allows this smooth modelling and the chiselling of the halo. The \
statue, set against a stele, was made to be seen from the front."""
details = [
  "The folds of the robe in fine cords, descending in garlands.",
  "The small curls of the hair, coiled like shells.",
  "The left hand pinching the edge of the cloth at hip height.",
  "The fragment of halo, at upper left, decorated with foliate scrolls.",
  "The pale flecks of the red sandstone, characteristic of the Mathura quarries.",
]
themes = ["Buddhism", "classical age", "serenity", "red sandstone", "Gupta"]
anecdote = """
The largest metal Buddha of this period, more than two metres high, was \
discovered in 1861 by engineers building a railway at \
Sultanganj, in Bihar. It is now kept in the Birmingham museum, in \
England."""
salle = 2
mur = "est"
place = 1
largeur = 1.0

[[oeuvres]]
titre = "Nataraja, Shiva as Lord of the Dance"
artiste = "Inde du Sud, époque chola"
annee = "11th century"
image = "nataraja.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1930.331.jpg"
technique = "Bronze, 113 × 102 × 30 cm"
collection = "Cleveland Museum of Art"
note = "Shiva dances in a circle of flames to destroy and recreate the universe: the most famous image in Indian art."
description = """
Within a great ring bristling with flames, a four-armed god dances on one \
leg. His right leg, slightly bent, crushes a small figure lying on \
the base; the left is raised and stretches across the body toward the right. The \
two upper arms spread apart: the right hand holds a small hourglass-shaped \
drum, the left a flame. The lower right hand is raised, palm open; the \
lower left arm passes in front of the chest, the hand hanging down and pointing to the \
raised foot. The god wears a tall fan-shaped headdress, earrings, \
necklaces and anklets. His face remains calm, almost smiling. The \
lotus-shaped base is pierced with two holes."""
evocation = """
For the devotees of Shiva, time is cyclical: the world is born, endures, is destroyed \
and is recreated without end, and it is the god’s dance that sets its rhythm. The drum \
marks the beat of creation, the flame announces destruction, and the ring \
of fire represents the universe. The raised hand tells the worshipper not to fear; the one that \
points to the lifted foot shows the path to liberation. The crushed dwarf embodies \
ignorance, or forgetfulness of self, which the dance overcomes. This dance is associated with the \
temple of Chidambaram, in the Tamil country, where Shiva is worshipped under this name. The \
perfect balance of the figure, at once whirlwind and stillness, has made Nataraja a \
symbol of India."""
histoire = """
From the ninth to the thirteenth century, the Chola dynasty dominated southern India from the Tamil \
country. Its kings covered their kingdom with stone temples and had bronze statues cast for \
these sanctuaries for use in processions: at festivals, \
they were dressed in silks, covered with flowers and jewels and carried through \
the streets. The holes in the base were used to attach the carrying poles. This statue was \
sold in 1930 to the Cleveland Museum of Art by the dealer C. T. Loo, based in \
Paris and New York; it is not known which temple it comes from. It remains \
one of the most admired works in the museum."""
facture = """
Chola bronzes are cast by the lost-wax method: the model, sculpted in wax, \
is coated in clay and then heated; the wax runs out and the molten metal takes its \
place. As the mould is broken to free the statue, each piece is unique. The \
sculptor then reworks the details of the jewellery and face with a chisel. Treatises \
fix the proportions of the body, but the best craftsmen add suppleness and \
verve. Here, the whole composition is inscribed within the circle, around the vertical axis \
of the supporting leg."""
details = [
  "The small hourglass drum, in the raised right hand.",
  "The flame resting in the left palm, like an offering.",
  "The dwarf of ignorance, beneath the right foot, raising his head toward the god.",
  "The regular tongues of flame that bristle on the ring of fire.",
  "The two holes in the base, through which the processional carrying poles passed.",
]
themes = ["Hinduism", "Shiva", "dance", "cosmos", "bronze", "procession"]
anecdote = """
In 2004, India gave CERN, the great European particle physics laboratory \
near Geneva, a two-metre-high statue of Shiva Nataraja: it \
evokes the dance of matter and energy."""
salle = 2
mur = "nord"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Head of the Buddha from Borobudur"
artiste = "Java, dynastie Shailendra"
annee = "early 9th century"
image = "tete-bouddha-borobudur.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1942.1087.jpg"
technique = "Volcanic stone (andesite), h. 30.6 cm"
collection = "Cleveland Museum of Art"
note = "One of hundreds of Buddha heads from the largest Buddhist monument in the world, in the heart of Java. It stands 31 cm high."
description = """
A Buddha’s head, alone, rests on a modern base. The stone is grey and \
porous, pitted with tiny holes. The hair is made of large round curls, \
coiled in spirals and aligned in tight rows, which also cover the \
protuberance at the top of the skull. The face is broad and full, with round cheeks. The \
heavy eyelids are almost closed, and the gaze filters downward. The \
eyebrows form two clean arcs that meet the ridge of the nose. The mouth, with \
full lips, sketches a barely perceptible smile. The earlobes, \
greatly elongated, descend to the jaw. The head was detached at the \
neck from the statue to which it belonged."""
evocation = """
The face expresses no particular emotion, but a state: the inner peace \
of one who has attained Awakening. The lowered eyelids turn the gaze inward, \
toward meditation. The long lobes recall that the Buddha, born a \
prince, once wore heavy ear ornaments, which he renounced. At \
Borobudur, the Buddha statues were placed in niches and in openwork \
stupas, along a path that leads the pilgrim, terrace after terrace, \
from the world of desires toward the summit, an image of Awakening. This face was one of the \
arrival points of that ascent. Detached from the monument, it also bears witness to \
the history of its dispersal."""
histoire = """
Borobudur was built around 800, in central Java, under the Buddhist \
Shailendra dynasty. Abandoned after a few centuries, overgrown with vegetation and \
volcanic ash, it was uncovered from 1814 on the orders of the \
British governor of Java, Thomas Stamford Raffles. In the nineteenth and early twentieth centuries, \
under Dutch colonial administration, hundreds of Buddha heads \
were removed or stolen and scattered around the world. This one was sold in 1942 \
to the Cleveland Museum of Art by the dealer Raphaël Stora, of New York. The monument, \
restored from 1907 to 1911 and then, with UNESCO, from 1975 to 1982, has been a World \
Heritage Site since 1991."""
facture = """
Andesite, a volcanic rock abundant in Java, is rough and full of \
bubbles: it rules out polish and overly fine detail. The sculptor therefore \
worked in large simple masses, the globe of the skull, the oval of the face, the arcs \
of the eyebrows, and let light play over the curls in relief. Originally, \
the stone was probably covered with a painted coating, now vanished. The \
hundreds of statues of the monument were carved to a single model, by \
teams of sculptors."""
details = [
  "The round curls of the hair, all coiled in the same direction.",
  "The small holes in the volcanic stone, visible on the cheeks.",
  "The heavy eyelids, which reveal only a slit.",
  "The earlobes elongated to the jaw.",
]
themes = ["Buddhism", "Java", "meditation", "volcanic stone", "scattered heritage"]
anecdote = """
In 1896, during the visit of King Chulalongkorn of Siam to Java, the Dutch \
colonial administration gave him several cartloads of sculptures taken from \
Borobudur. They are still kept in the National Museum in Bangkok."""
salle = 3
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Bust of Hevajra"
artiste = "Empire khmer, style du Bayon"
annee = "late 12th – early 13th century"
image = "buste-hevajra.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT5215.jpg"
technique = "Sandstone, 132.1 × 73.7 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A god with tiered faces, smiling like the towers of the Bayon: the Buddhism of Angkor under King Jayavarman VII."
description = """
Of this large statue only the upper body and the heads remain. In the first \
tier, a broad face, with half-closed eyes, smiles gently; two other faces, \
seen in profile, extend it at the sides, so that the god looks in three \
directions. Above, a second tier repeats the same arrangement: a smaller face \
seen from the front, framed by two profiles. The main face wears a band across \
the forehead and long pendant earrings. The shoulders are broad, but \
the arms are gone; only a stump remains, on the left, and a large break \
hollows the chest. The stone, grey and granular, is worn by time."""
evocation = """
Hevajra is a deity of Tantric Buddhism, a form of Vajrayana that came from \
north-eastern India. His texts describe him with eight heads and sixteen arms, dancing, \
holding in each hand a cup made from a skull: a fearsome figure, who \
destroys illusions and passions. The Khmer sculptors nonetheless made of him \
a peaceful image, with smiling faces. These multiple faces, which look in \
every direction, recall the face towers of the Bayon, the temple built at the \
centre of Angkor Thom by Jayavarman VII. In them people have seen the image of a compassion that \
watches over the whole kingdom. Hevajra seems to have been much venerated in the Khmer \
empire at this time."""
histoire = """
From the ninth to the fifteenth century the Khmer empire dominated much of mainland \
Southeast Asia, from its capital, Angkor, in the north-west of present-day Cambodia. At the \
end of the twelfth century, King Jayavarman VII, a Buddhist, rebuilt the city after \
a war against Champa, founded Angkor Thom, raised the Bayon and covered his \
kingdom with temples, hospitals and rest houses. This bust dates from his reign or \
that of his immediate successors. It entered the Metropolitan Museum of Art \
in 1936. In 2023, the Met announced the return to Cambodia and Thailand of \
sixteen sculptures linked to the dealer Douglas Latchford, accused of trafficking; this bust, \
acquired much earlier, was not among them."""
facture = """
The statue is carved in sandstone, the stone of almost all the temples of \
Angkor. The Bayon style is recognized by its broad faces, lowered eyes \
and thick lips stretched in a slight smile. Here, the heads are stacked in \
tiers that fit within a pyramidal silhouette. The sculptor \
repeated the same face, varying only its orientation, which gives the whole \
great unity. The jewellery is carved in low relief, without cutting into the mass \
of the stone."""
details = [
  "The slight smile of the lips, shared by all the faces.",
  "The profile faces, on each side, looking toward the sides.",
  "The second tier of faces, smaller, above the first.",
  "The long pendant earrings of the main face.",
  "The large break in the chest and the stump of the arm, on the left.",
]
themes = ["Buddhism", "Angkor", "smile", "Khmer", "faces"]
anecdote = """
The Bayon, at the centre of Angkor Thom, bears on its towers more than two hundred \
giant faces carved in stone. Many historians believe they blend the \
features of a bodhisattva with those of King Jayavarman VII himself."""
salle = 3
mur = "nord"
place = 5
largeur = 1.2

[[oeuvres]]
titre = "Buddha Seated on a Double Lotus"
artiste = "Birmanie, royaume de Pagan"
annee = "late 11th century"
image = "bouddha-pagan.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT5633.jpg"
technique = "Bronze inlaid with silver and copper, 23.5 × 18.4 × 12.4 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A small bronze from Pagan, the city of a thousand temples, at the moment when Burma adopted Theravada Buddhism. It measures 23.5 cm."
description = """
The Buddha sits cross-legged, the soles of his feet turned toward the sky, on \
a base formed of two rows of lotus petals, some turned upward, \
others downward. His left hand rests, palm open, in his lap; the \
right descends to the knee, the fingers brushing the ground. His clinging monastic robe \
leaves the right shoulder bare; a folded panel of cloth falls over the left \
shoulder to the waist. The head, covered with small curls, bears at the top a \
protuberance ending in a knob. The face is round and peaceful, the eyes \
lowered. The metal, golden in tone, has remained smooth and bright."""
evocation = """
The gesture of the right hand is one of the most important in Buddhist art: it is \
called “calling the earth to witness.” According to the traditional account, at the moment \
when the Buddha, seated beneath the tree at Bodh Gaya, was about to attain Awakening, the demon \
Mara challenged his right to do so; the Buddha then touched the earth, which \
bore witness in his favour, and Mara fled. The statue thus represents the very instant \
of Awakening. This theme, which came from the great Buddhist centres of north-eastern India, \
became, at Pagan and then throughout Burma, the most widespread image of the Buddha."""
histoire = """
In the eleventh century, King Anawrahta unified around Pagan, on the Irrawaddy, the \
first great Burmese monarchy, and favoured Theravada Buddhism. For two and a half \
centuries, the kings and faithful of Pagan built thousands of brick temples \
and stupas, adorned with mural paintings and filled with statues. \
Monks and pilgrims travelled between Pagan, Bodh Gaya and Sri Lanka, which \
explains the influence of Indian art on this bronze. The kingdom declined after the \
Mongol invasions of the late thirteenth century. This Buddha entered the Metropolitan \
Museum of Art in 2003."""
facture = """
The statuette is cast in bronze by the lost-wax method, then chiselled. According to the \
museum’s description, it is inlaid with silver and copper: thin threads \
of metal of a different colour were set into the bronze to highlight \
certain details, a refined technique reserved for pieces of quality. The \
proportions, the broad shoulders, the slim waist and the round face, follow the \
models of eastern India under the Pala dynasty, which Burmese craftsmen \
knew well."""
details = [
  "The fingers of the right hand brushing the ground, in front of the knee.",
  "The double row of lotus petals on the base, open upward and downward.",
  "The folded panel of cloth that falls over the left shoulder.",
  "The small knob that tops the protuberance of the skull.",
]
themes = ["Buddhism", "Burma", "Awakening", "bronze", "lotus"]
anecdote = """
On the plain of Pagan, more than two thousand brick temples and stupas, built between \
the eleventh and thirteenth centuries, are still standing. The site was inscribed as a \
UNESCO World Heritage Site in 2019."""
salle = 3
mur = "sud"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Buddha Seated, Calling the Earth to Witness"
artiste = "Thaïlande, héritage de Sukhothai"
annee = "late 15th – 16th century"
image = "bouddha-thailande.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT8728.jpg"
technique = "Bronze, 49.5 × 31.7 × 19.1 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The flame at the top of the skull and the slender silhouette come from Sukhothai, the first great Thai kingdom."
description = """
The Buddha sits with his legs folded, the right leg resting on the left, on a \
cushion edged with a row of beads, itself carried by a massive base. His right hand \
descends to the knee, the fingers almost touching the ground; the left rests in his \
lap. The body is slender and supple, the shoulders broad, the waist narrow. A fine \
clinging robe leaves the right shoulder bare, and a long panel of cloth falls from the left \
shoulder to the navel. The head, covered with small pointed curls, ends \
in a tall flame. The oval face, with its aquiline nose and arched eyebrows, \
sketches a smile. The bronze, dark, keeps traces of verdigris and \
rust."""
evocation = """
Like the Pagan bronze displayed beside it, this Buddha calls the earth to witness: he \
represents the moment when, beneath the tree of Awakening, he triumphs over Mara. But the image \
is here more airy. The flame that springs from the top of the skull represents the radiance \
of his wisdom; it became a typical feature of the Thai Buddha. The \
fluid silhouette, almost without muscles or bones, seeks to render a supernatural body, in keeping \
with the comparisons of the texts: arms like an elephant’s trunk, a chin like \
a mango stone. For the faithful, these statues are living presences, which \
they venerate, dress and cover with gold leaf."""
histoire = """
In the thirteenth century, Thai princes founded, in the north of the central plain, the kingdom \
of Sukhothai. Its kings adopted Theravada Buddhism from Sri Lanka and had \
bronzes cast in a new style, slender and serene. In the fifteenth century, Sukhothai \
passed under the authority of the kingdom of Ayutthaya, further south, but its statues remained \
the model for founders for centuries, in Ayutthaya as in the kingdom of \
Lan Na, to the north. This Buddha, cast in the late fifteenth or sixteenth century, belongs to \
that lineage. It was given to the Metropolitan Museum of Art in 1981 by \
Mr. and Mrs. A. Richard Benedek."""
facture = """
The statue is cast by the lost-wax method in several parts, then assembled and \
chiselled. The Thai founders sought continuous curves: the line that runs from the \
shoulder to the hand resting on the knee, or that of the panel of cloth, reads in a single \
stroke. The fingers, almost all of the same length, are a feature of the Sukhothai style. \
The bronze was probably gilded originally; the present patina, dark and \
stained with green, is due to time."""
details = [
  "The tall flame that springs from the top of the skull.",
  "The fingers of the right hand, almost all of the same length.",
  "The long panel of cloth that falls from the left shoulder to the navel.",
  "The row of beads that edges the cushion beneath the legs.",
  "The arched eyebrows that meet above the aquiline nose.",
]
themes = ["Buddhism", "Thailand", "Awakening", "bronze", "flame"]
anecdote = """
The Golden Buddha of Wat Traimit in Bangkok, in the Sukhothai style, weighs about five \
and a half tonnes. Covered in stucco to hide it, it passed for centuries as a \
simple plaster statue, until in 1955 the stucco cracked during a \
move."""
salle = 3
mur = "sud"
place = 5
largeur = 0.9

[[oeuvres]]
titre = "Krishna and Radha in a Grove, Page from a Gita Govinda"
artiste = "Sahibdin"
annee = "c. 1665"
image = "krishna-radha-bosquet.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DP259542.jpg"
technique = "Ink and opaque watercolor on paper, 24.4 × 19.7 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A spring night on the banks of the Yamuna: the court painting of Mewar illustrates the great love poem of Krishna and Radha."
description = """
Night has fallen over a forest: a crescent moon shines in a blue sky \
scattered with white stars. At left, beneath a leafy bower stretched against a \
red ground and decorated with garlands of white, pink and orange flowers, Krishna, with \
blue skin and wearing a crown, sits on a carpet beside Radha; he \
tenderly touches her chin. Golden vases are set before them. At the centre, \
alone among the trees, a young woman in a yellow checked skirt and \
a red veil stands, her hand raised. At right, trees with \
stylized foliage, red, green and yellow, and flowers. Below flows a \
dark river, where lotuses bloom."""
evocation = """
The Gita Govinda, “the cowherd’s song,” is a Sanskrit poem written in the twelfth century \
by Jayadeva. It tells, in springtime, the love of Krishna, the god who grew up \
among cowherds, and Radha: jealousy, separation, the messages carried \
by a confidante, then the reunion in the groves on the banks of the Yamuna. \
For the devotees of Krishna, this human love is also the image of the soul \
seeking God. The young woman alone in the forest is probably the confidante, \
go-between for the lovers. The painter makes the whole of nature, flowering trees, moon \
and river, an echo of their passion, as in the poem."""
histoire = """
Mewar, whose capital is Udaipur, in Rajasthan, is one of the oldest \
Rajput kingdoms. After the peace concluded with the Mughal emperor Jahangir in 1615, \
its rulers employed a workshop of painters that illustrated the great \
religious and poetic texts in series of dozens, even hundreds, of pages. \
The Metropolitan Museum attributes this page from a now-dispersed Gita Govinda \
to Sahibdin, the master of that workshop, documented c. 1628–1655, and dates it c. \
1665; part of the execution may fall to his pupils. It was given to the \
museum in 1988 by the Ernest Erickson Foundation."""
facture = """
The painting is made of opaque watercolor, based on mineral and vegetable pigments \
bound with gum, laid in flat areas on prepared and burnished paper. The colors are \
bold and juxtaposed without shadows: red, yellow, green, lapis blue. The trees \
are repeated motifs, almost ornaments, and the figures, seen in profile, \
have the large almond eye of the Mewar style. A few touches of gold make \
the jewellery and vessels gleam. The red and yellow border frames the scene like a \
window."""
details = [
  "The crescent moon and the white stars pricked into the sky.",
  "Krishna’s gesture, lifting Radha’s chin.",
  "The garlands of flowers hung from the bower.",
  "The golden vases set on the carpet before the couple.",
  "The lotus buds in the dark river, at lower left.",
]
themes = ["Krishna", "Radha", "love", "night", "poetry", "Rajput"]
anecdote = """
The Gita Govinda has for centuries been sung in the worship of the Jagannath temple, \
at Puri, in Odisha, and its verses have inspired dancers and musicians throughout India, \
from Odissi to devotional song."""
salle = 4
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Shiva and Parvati Playing Chaupar, Page from a Rasamanjari"
artiste = "Devidasa de Nurpur"
annee = "1694–1695"
image = "shiva-parvati-chaupar.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT5245.jpg"
technique = "Opaque watercolor, ink, silver and gold on paper, 16.5 × 27.6 cm (image)"
collection = "Metropolitan Museum of Art, New York"
note = "The god Shiva and his wife contest a game of dice: the painting of the Punjab hills, at Basohli, in burning colors."
description = """
Against a uniform bright yellow ground, beneath a thin band of white and blue sky, Shiva and \
Parvati sit facing each other on a tiger skin, of which the claws and, \
beneath Shiva, the head are visible. Shiva, with ash-white skin streaked with red marks, \
wears a topknot, a third eye on his forehead, a snake knotted at his neck and a long \
rosary of seeds. He sits cross-legged and gazes at his wife. Parvati, \
in a striped red skirt and orange veil, raises her right hand as if to press \
her point. Between them, the chaupar board, cross-shaped, holds \
conical pieces; three long dice lie beside it. Two trees with dark foliage \
frame the scene, above brown hills."""
evocation = """
The Rasamanjari, “the bouquet of delights,” is a Sanskrit poetic treatise by \
Bhanudatta that classifies lovers and above all heroines according to their character and \
situation, each type illustrated by a verse. The painters of Basohli drew from it \
series in which the lovers are often gods. Here, the game of dice \
between Shiva and Parvati, a familiar scene of mythology, becomes a lovers’ \
quarrel: the game serves as a pretext for teasing, reproaches and \
reconciliation. The great ascetic, master of destruction, appears as an \
attentive husband, and Parvati as a shrewd heroine who stands her ground. The yellow ground, without \
depth, places this dispute outside time."""
histoire = """
Basohli is a small principality in the foothills of the Himalaya, on the banks of the \
Ravi river, in what is now the territory of Jammu. In the late seventeenth century, its \
rajas maintained painters who created a bold style, one of the first \
of the painting known as Pahari, “of the hills.” According to its colophon, this Rasamanjari \
series was painted by Devidasa in 1694–1695. Like many Indian \
series, it was dispersed in the twentieth century among collectors and museums. \
This page was given to the Metropolitan Museum of Art in 1957 by Dr. \
J. C. Burnett; the museum counts it among the masterpieces of its Indian \
collection."""
facture = """
The Basohli style is striking for its saturated colors, laid in broad flat areas: \
yellow, red, brown, deep green. The figures, in profile, have an immense, \
lotus-shaped eye that dominates the face. The painter mixed silver \
and gold into the opaque watercolor for the jewellery; in the Basohli workshops, \
fragments of beetle wings were also sometimes glued on to imitate the gleam of emeralds. \
The broad dark red border, characteristic of these series, sets the scene apart \
like a picture."""
details = [
  "The tiger’s head, beneath Shiva, and its curved claws at the four corners.",
  "The snake knotted around Shiva’s neck.",
  "The three long dice set beside the cross-shaped board.",
  "Parvati’s raised hand, palm open, at the centre of the debate.",
  "The large almond eye of both figures, typical of Basohli.",
]
themes = ["Shiva", "Parvati", "game", "couple", "Pahari", "color"]
anecdote = """
Chaupar, played with pieces on a cross-shaped board, is the ancestor of Indian \
pachisi and of Western parlour games such as Ludo. It is said that the Mughal emperor Akbar played it at \
Fatehpur Sikri on a giant board drawn in the courtyard, with slave girls as \
pieces."""
salle = 4
mur = "nord"
place = 5
largeur = 1.3

[[oeuvres]]
titre = "Damayanti and the Swan (Hamsa Damayanti)"
artiste = "Raja Ravi Varma"
annee = "1899"
image = "hamsa-damayanti.jpg"
cadre = "dore"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Ravi_Varma-Princess_Damayanthi_talking_with_Royal_Swan_about_Nala.jpg"
technique = "Oil on canvas"
collection = "Sree Chitra Art Gallery, Thiruvananthapuram"
note = "A swan comes to speak of love to a princess: Indian mythology painted in oils, in the European manner, by the most popular painter in India."
description = """
A young woman stands on the steps of a marble terrace, at the edge \
of a pool. She wears a red sari with a gold border, draped in the \
Maharashtrian manner, and a pink blouse; a flower is tucked in her black hair, \
pearls adorn her neck and ears, bracelets her wrists. Leaning on a \
balustrade, her cheek resting on her hand, she listens, dreamy. Before her, on the \
top of an octagonal pillar covered with lotus leaves, a white swan turns its \
head toward her, as if speaking to her. Behind, a fluted column, a \
red wall and a park with dark trees; at lower right, pink lotuses bloom \
in the water. The signature and date are inscribed at lower left."""
evocation = """
The story of Nala and Damayanti is told in the Mahabharata. Nala, king of \
Nishadha, captures a marvellous swan which, in exchange for its freedom, promises to \
sing his praises to Princess Damayanti of Vidarbha. The painter shows \
the moment when the bird speaks to her of Nala: without ever having seen him, she falls in love. \
Ravi Varma chooses the intimate moment, the reverie, rather than action. For the \
Indians of his time, seeing the heroines of the epics in the guise of women of \
their own day, in saris, in a palace setting, was a striking novelty: \
their gods and heroes became close, almost familiar."""
histoire = """
Ravi Varma painted this picture in 1899, at the height of his fame, when he was \
working for the maharajas of Travancore, Baroda and Mysore and his lithographic \
press was spreading his compositions throughout the country. The subject of Damayanti and \
the swan is among his greatest successes: chromolithograph reproductions of it \
decorated countless homes. The painting is kept at \
the Sree Chitra Art Gallery in Thiruvananthapuram, Kerala, opened in 1935 in the \
former capital of the kingdom of Travancore, which holds an important group of \
the painter’s works."""
facture = """
Ravi Varma was one of the first Indian painters to fully master European \
oil painting, with its glazes, its modelling in light and shade \
and its perspective. He renders materials with virtuosity: the silk of the sari, \
its gold edging, the marble, the swan’s feathers. The large vertical format, the \
nearly life-size figure and the classical architectural setting recall the \
academic painting of Victorian Europe. The soft light, coming from the left, \
models the young woman’s face and arm."""
details = [
  "Damayanti’s gesture, her cheek resting on her hand, lost in thought.",
  "The swan’s orange beak turned toward the princess.",
  "The gold edging of the red sari, catching the light.",
  "The pink lotus buds in the water, at lower right.",
  "The signature, Ravi Varma, and the date of 1899, at lower left.",
]
themes = ["Mahabharata", "love", "swan", "princess", "oil painting"]
anecdote = """
Later, at the choosing of her husband, Damayanti sees five identical Nalas: four \
gods have taken on his appearance. She recognizes the real one because he sweats, blinks \
and his feet touch the ground, which the gods are \
unable to do."""
salle = 4
mur = "est"
place = 2
largeur = 1.1

[[artistes]]
nom = "Gandhara, époque kouchane"
vie = "Gandhara (north-western Pakistan and eastern Afghanistan today), 1st–5th century"
biographie = """
Gandhara is a region of fertile valleys around Peshawar, at the mouth of the \
routes linking India to Central Asia and Iran. Conquered by Alexander the \
Great in 327–326 BCE, it was afterwards governed by Greek kings, \
then by dynasties from the steppes. In the first centuries CE, it \
belonged to the Kushan empire, which stretched from Central Asia to the Ganges valley \
and whose king Kanishka, in the second century, protected Buddhism. Monasteries and \
stupas multiplied in the region, at Taxila, in the Swat valley, around \
Peshawar. Sculptors there made by the thousand statues and reliefs \
of grey schist, then of stucco, recounting the life of the Buddha. It was there, as at \
Mathura, that the first images of the Buddha in human \
form appeared around the first century, whereas before he had been represented only by symbols. This art \
declined with the Hun invasions in the fifth century, but its models were transmitted \
along the Silk Roads as far as China and Japan."""
style = """
The art of Gandhara blends Indian Buddhist subjects with the forms of \
Greco-Roman art: faces with straight profiles, wavy hair, drapery with deep folds \
recalling the toga, slightly swaying poses. The bodhisattvas wear the \
jewellery and moustache of Kushan princes. This synthesis gave Asia one \
of its first models of the Buddha."""

[[artistes]]
nom = "Inde du Nord, époque gupta"
vie = "Northern India, c. 320 – mid-6th century"
biographie = """
The Gupta dynasty was founded around 320 by Chandragupta I, in the Ganges \
valley. His successors, Samudragupta and then Chandragupta II, extended their empire over \
most of northern India, around capitals such as Pataliputra, \
present-day Patna. The Guptas were Hindu, but also protected Buddhist \
and Jain monasteries. Their era is remembered as a golden age: \
Sanskrit literature shone with the poet and playwright Kalidasa, whom \
tradition links to the court of Chandragupta II, and the sciences developed. \
The Chinese pilgrim Faxian, who travelled through India in the early fifth century, described \
prosperous towns and flourishing monasteries. In the workshops of Mathura and \
Sarnath the models of the Buddha and of the Hindu gods were then fixed. At the same \
time, in the neighbouring Deccan, under the allied Vakataka dynasty, the sanctuaries of Ajanta were \
excavated and painted. The empire weakened in the late fifth century \
under pressure from the invasions of the Hephthalite Huns and disappeared in the sixth century."""
style = """
Gupta sculpture seeks an ideal and inner beauty: smooth, supple bodies, \
full faces with lowered eyes, robes so fine they seem \
transparent. It abandons the heavy drapery of Gandhara for soft, \
continuous modelling. This classical style served as a reference for the Buddhist art of all of Asia, \
from Southeast Asia to China."""

[[artistes]]
nom = "Inde du Sud, époque chola"
vie = "Tamil country (south-eastern India), mid-9th – 13th century"
biographie = """
The Cholas are a very ancient Tamil lineage, already mentioned in the inscriptions \
of the emperor Ashoka in the third century BCE. In the mid-ninth century, a \
new dynasty established itself at Thanjavur, in the Kaveri delta, and built within \
a few generations the leading power of southern India. Rajaraja I, who \
reigned from 985 to 1014, conquered Kerala and northern Sri Lanka and had the great \
Brihadishvara temple, dedicated to Shiva, built at Thanjavur. His son Rajendra I \
led an expedition to the Ganges, then a naval expedition against the kingdom of \
Srivijaya, in Southeast Asia, and founded a new capital, \
Gangaikondacholapuram. Chola kings and queens richly endowed the temples, \
which received lands, jewels and bronze statues for worship and \
processions. The dynasty weakened in the thirteenth century and disappeared around 1279. Its \
founders left a tradition that is still alive: in the town of Swamimalai, \
in the Tamil country, statues are still cast by the lost-wax method using the same \
methods."""
style = """
Chola bronzes unite the rigour of religious treatises, which fix the \
proportions and attributes of each god, with great freedom of movement. \
Slender, springy bodies, precise hand gestures, finely chiselled jewellery: these \
statues, made to be carried in procession, rank among the summits of \
metal sculpture."""

[[artistes]]
nom = "Java, dynastie Shailendra"
vie = "Central Java (Indonesia), 8th – 9th century"
biographie = """
In the eighth century, the centre of the island of Java, a region of very fertile volcanic \
plains, was dominated by the Shailendra dynasty, the “lords of the \
mountain.” These Buddhist kings, followers of Mahayana, maintained ties \
with Sumatra, with India and with the great monasteries of Bengal. They had \
several stone sanctuaries built on the Kedu plain, near present-day Yogyakarta, \
among them Borobudur, raised around 800: a hill enveloped in \
superimposed terraces, covered with more than two thousand carved panels and \
more than five hundred statues of the Buddha. At the same time, a neighbouring Hindu \
dynasty built the temples of Prambanan, dedicated to Shiva. In the tenth century, the centre \
of power shifted to eastern Java, probably in part because of \
volcanic eruptions, and the great monuments of the centre were gradually \
abandoned. Borobudur, forgotten beneath the vegetation, was rediscovered by \
Europeans only in the early nineteenth century."""
style = """
Shailendra art adapts Indian models of the Gupta and post-Gupta period to \
the volcanic stone of Java. Its Buddhas are peaceful and massive, with full faces \
and lowered eyes; its reliefs recount with gentleness and precision the life \
of the Buddha and the everyday world of Java. Borobudur is its masterpiece."""

[[artistes]]
nom = "Empire khmer, style du Bayon"
vie = "Angkor (present-day Cambodia), late 12th – early 13th century"
biographie = """
The Khmer empire was born in the early ninth century, when King Jayavarman II \
proclaimed himself universal sovereign on Mount Kulen, north of the Tonlé Sap lake. His \
successors established their capital at Angkor and raised there, over more than three \
centuries, ever vaster temple-mountains, among them Angkor Wat, built in the \
twelfth century under Suryavarman II and dedicated to Vishnu. In 1177, the Cham from central \
present-day Vietnam sacked Angkor. Prince Jayavarman VII drove them out and became \
king around 1181. A fervent Buddhist, he rebuilt the capital, Angkor Thom, enclosed \
by walls and opened by gates surmounted by giant faces, and raised at its \
centre the Bayon. He also founded great monasteries, such as Ta Prohm and Preah Khan, \
as well as hospitals and rest houses along the roads. The style that bears \
the name of the Bayon flourished under his reign and that of his successors. The empire \
then declined, and Angkor ceased to be the capital in the fifteenth century."""
style = """
The Bayon style is recognized by its broad, full faces, lowered eyes and \
thick lips stretched in an inward smile, which has been called the “Angkor \
smile.” It multiplies heads and faces turned toward the four \
directions. Its sculptures, more human and meditative than those of Angkor Wat, \
express the Buddhist fervour of the reign of Jayavarman VII."""

[[artistes]]
nom = "Birmanie, royaume de Pagan"
vie = "Pagan, on the Irrawaddy (present-day Myanmar), 11th – 13th century"
biographie = """
Pagan, on the arid plain of central Burma, on the Irrawaddy river, was \
at first a small Burmese city. In the mid-eleventh century, King Anawrahta made it \
the capital of the country’s first unified kingdom. According to tradition, he turned \
to Theravada Buddhism after the conquest of Thaton, a Mon city in the south, from which he \
brought back monks, texts and craftsmen. His successors, such as Kyanzittha, \
who had the Ananda temple built, continued his work. For more than two \
centuries, kings, queens and ordinary faithful built thousands of temples, \
monasteries and stupas, to acquire merit. Ties were close \
with Sri Lanka, another centre of Theravada, and with the holy places of India, such as \
Bodh Gaya, whose temple Pagan helped to restore. Weakened, the kingdom did not withstand \
the attacks of the Mongols of the Yuan dynasty in the late thirteenth century. Its \
temples, often damaged by earthquakes, have remained a great place of pilgrimage."""
style = """
The art of Pagan draws on eastern India under the Pala dynasty, from which it takes \
the Buddhas with broad shoulders and slim waists, seated on lotuses. It \
adds a Burmese taste for round, serene faces and for the richness of \
materials, inlaid bronze, lacquer and gilding. Its models left a lasting mark on \
Burmese Buddhist sculpture."""

[[artistes]]
nom = "Thaïlande, héritage de Sukhothai"
vie = "Kingdoms of Sukhothai, Ayutthaya and Lan Na (present-day Thailand), 13th – 16th century"
biographie = """
In the thirteenth century, Thai chiefs freed themselves from Khmer rule and \
founded, in the north of the central plain of present-day Thailand, the kingdom of \
Sukhothai. Its kings adopted Theravada Buddhism, which came from Sri Lanka through \
monks, and covered their capital and its twin city, Si \
Satchanalai, with monasteries, stupas and statues. The founders of Sukhothai \
then created a new type of Buddha, with a fluid silhouette and a flame on \
the top of the skull, and invented the image of the walking Buddha, in the round. In the \
fifteenth century, Sukhothai passed under the authority of Ayutthaya, a kingdom founded in 1351 further \
south, which became the great power of the country until its destruction by the \
Burmese in 1767. In the north, the kingdom of Lan Na, whose capital has been Chiang Mai \
since the late thirteenth century, developed its own school of bronze-casters. In all \
these kingdoms, the statues of Sukhothai remained a model, copied and venerated for \
centuries, down to the present day."""
style = """
The Buddha of the Sukhothai tradition is slender, supple, almost immaterial: broad \
shoulders, slim waist, arms in long curves, fingers of the same length, oval face \
with an aquiline nose and a light smile, a flame at the top of the head. This image, of \
great purity of line, has become the emblem of Thai Buddhist art."""

[[artistes]]
nom = "Sahibdin"
vie = "Active in Udaipur (Mewar, Rajasthan), c. 1628 – c. 1655"
biographie = """
Neither Sahibdin’s date of birth nor that of his death is known: only his \
works, several of which bear his name and a date, allow his \
career to be traced. A Muslim painter in the service of the Hindu rulers of Mewar, he directed \
the royal workshop at Udaipur under Maharana Jagat Singh I, who reigned from 1628 to \
1652, then in the early reign of Raj Singh I. His first dated work is a \
Ragamala, a “garland of musical modes,” painted in 1628. He then illustrated \
the Rasikapriya, a poem on lovers, a Bhagavata Purana devoted to the life of \
Krishna, and above all several books of the immense Ramayana commissioned by Jagat \
Singh, completed in the early 1650s and illustrated with several hundred \
paintings. This was the period when Mewar, at peace with the Mughal empire since \
1615, could devote its wealth to the arts. Sahibdin, who probably knew \
Mughal painting, nonetheless kept and asserted a style of his own, belonging to Rajasthan, which \
his successors took up for decades."""
style = """
Sahibdin composed his pages like tapestries: backgrounds of bright flat colors, \
red, yellow or green, figures in profile with large eyes, stylized trees, \
architecture seen from the front. He often recounts several moments of a story in \
a single image. His clarity and the strength of his colors defined the classical \
style of Mewar painting."""

[[artistes]]
nom = "Devidasa de Nurpur"
vie = "Native of Nurpur (Punjab hills), active c. 1680 – c. 1720"
biographie = """
Devidasa belonged to a family of painters from Nurpur, a small principality of the \
Punjab hills, at the foot of the Himalaya. These hills were then divided \
among a multitude of small Rajput states, often united by marriages, between \
which painters moved. Like many artists of these regions, Devidasa \
worked for several neighbouring courts, depending on commissions. His name \
is known thanks to the colophon of a series of paintings of the Rasamanjari, Bhanudatta’s \
poetic treatise on lovers, which states that he painted it in 1694–1695 \
for the court of Basohli. This document is precious: in the Indian painting of \
this period, signed or dated works are rare, and this series serves as a \
benchmark for dating and attributing many other pages in the Basohli style. His \
Rasamanjari series was dispersed in the twentieth century: pages from it are found today \
in the Metropolitan Museum in New York and in other collections in India, Europe and \
America."""
style = """
Devidasa practised the Basohli style in its maturity: ardent colors in \
flat areas, yellow or red grounds, figures in profile with immense eyes, jewellery highlighted \
with gold and silver. His compositions are airier and his figures more \
elegant than those of the early Basohli series, foreshadowing the gentleness of the \
Pahari schools of the eighteenth century."""

[[artistes]]
nom = "Raja Ravi Varma"
vie = "Kilimanoor (Travancore, Kerala), 29 April 1848 – Kilimanoor, 2 October 1906"
biographie = """
Ravi Varma was born into an aristocratic family linked to the royal house of \
Travancore, in southern India. A painter uncle gave him his first lessons, and \
Maharaja Ayilyam Thirunal brought him to the palace in Thiruvananthapuram, where he \
observed the court painters and the European paintings in the royal collections. He \
largely taught himself oil painting, watching in particular \
a passing European portraitist, Theodore Jensen, at work. In the \
1870s, his first successes, such as a Nair Lady Adorning Her Hair awarded a prize at an exhibition \
in Madras, made him known. He became the portraitist of princes and \
notables, and painted for the Maharaja of Baroda, Sayajirao Gaekwad III, a series of \
scenes drawn from the epics. He sent paintings to the World’s Columbian Exposition in \
Chicago in 1893. In 1894, he founded near Bombay a lithographic press that \
disseminated in large numbers, at low prices, color images of Indian gods and \
heroes; he sold it a few years later. He died in his native town in \
1906."""
style = """
Ravi Varma joined the technique of European academic painting, oil, modelling, \
perspective, large formats, to subjects from Indian mythology and literature. \
His heroines in saris, with idealized faces, fixed for generations \
the appearance of gods and goddesses in popular imagery, from chromolithographs to \
posters and Indian cinema."""
