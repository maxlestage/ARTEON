[[oeuvres]]
titre = "The Night Watch"
artiste = "Rembrandt"
annee = "1642"
image = "ronde-nuit.jpg"
technique = "Oil on canvas, 379.5 × 453.5 cm"
collection = "Rijksmuseum, Amsterdam"
note = "Captain Banninck Cocq's militia sets off: a group portrait that became a scene of theater."
description = """
At the center, Captain Frans Banninck Cocq, in black with a red sash, steps toward us and extends his left hand while speaking to his lieutenant, Willem van Ruytenburch, dressed all in light yellow and wearing a feathered hat. Around them, a company of militiamen sets itself in motion in cheerful disorder: a man in red loads his musket, another blows on the priming pan, a third fires; a standard-bearer brandishes the banner, a drummer beats his drum at the right, a dog barks. Pikes and lances cross at the top. At the left, a little girl dressed in gold, bathed in light, wears a dead chicken at her belt. Behind, a stone arch, and a shield on which the names of the guardsmen are inscribed."""
evocation = """
The painting is a collective portrait: the members of the company who paid to appear are represented in it, but Rembrandt blends them into an action instead of lining them up. It has been seen as the pride of a civic militia, guarantor of the order and liberties of the city, at a time when these companies had lost most of their military role and were becoming honorary societies. The luminous little girl is often interpreted as an allegorical figure of the company of arquebusiers: the chicken's claws recall their emblem. The general movement, the march toward the viewer, have made the painting an image of the drive and prosperity of the Dutch Republic in the Golden Age."""
histoire = """
Around 1639, Captain Banninck Cocq's company commissioned this painting for the great hall of the Kloveniersdoelen, seat of the Amsterdam arquebusiers, which received a whole series of company portraits by different painters. Completed in 1642, the year of Saskia's death, it did not provoke the scandal that legend has imagined. In 1715, transported to the town hall, it was trimmed on all sides to fit a wall; at the left, two figures disappeared. It then entered the national collections. During the Second World War, it was hidden, rolled up, in shelters, notably a cave near Maastricht. The Rijksmuseum, whose building opened in 1885, reserves a room for it at the end of its gallery of honor."""
facture = """
Rembrandt upsets the genre of the militia portrait: instead of rows of equally lit heads, he creates a dramatic scene in which the light isolates a few figures, the captain, the lieutenant, the little girl, and leaves the others in half-light. The shadow of the captain's hand, cast on the lieutenant's costume, gives the measure of the space. The golden embroideries are painted in thicknesses that catch the light. The title, which appeared well after the painter's death, comes from the darkened varnish that dimmed the canvas: the scene in fact takes place in broad daylight."""
details = [
  "The shadow of the captain's left hand on the lieutenant's yellow jacket.",
  "The little girl in the golden dress, with a dead chicken hanging from her belt.",
  "The dog barking near the drum, at the right.",
  "The shield above the arch, on which the names of the guardsmen are inscribed.",
  "The militiaman in red, at the left, busy loading his musket.",
]
themes = ["militia", "group portrait", "movement", "chiaroscuro", "Amsterdam"]
anecdote = """
Since 2019, the "Operation Night Watch" project has been studying and restoring the painting before the public's eyes, in a glass chamber. In 2021, the parts cut off in 1715 were reconstituted with the help of artificial intelligence, based on an old copy by Gerrit Lundens, and exhibited for a time beside the original."""
