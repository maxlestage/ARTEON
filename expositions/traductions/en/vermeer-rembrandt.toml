[[oeuvres]]
titre = "The Astronomer"
artiste = "Johannes Vermeer"
annee = "1668"
image = "astronome.jpg"
technique = "Oil on canvas, 51 × 45 cm"
collection = "Musée du Louvre, Paris"
note = "A scholar reaches out to a celestial globe, in the light of the window."
description = """
In a study lit by a window at the left, a man with long hair, dressed in a loose blue-green dressing gown, sits and leans toward a celestial globe set on the table. With his right hand, he brushes its surface, as if to make the heavens turn; the other hand rests on the edge of the table, near an open book. A thick carpet with colored patterns covers the table, on which an astrolabe can be seen. Behind him, a cupboard holds a few books; on the wall hangs a painting representing Moses saved from the waters. The stained-glass panes of the window let through a soft light that falls on the face, the hand and the globe."""
evocation = """
The painting celebrates the modern scholar, at the hour when the United Provinces were a great hearth of the sciences: astronomy, cartography, optics. The book open on the table has been identified as a treatise by Adriaan Metius, open at the passage that recommends seeking from God the inspiration to study the stars. The Moses saved from the waters, on the wall, has been interpreted in the same sense: Moses, raised at the Egyptian court, was held to be learned in all the wisdom of the Egyptians, astronomy included. Science and faith are thus not opposed here. It has been supposed that the model was Antonie van Leeuwenhoek, a Delft scientist born the same year as Vermeer, an attractive hypothesis but never demonstrated."""
histoire = """
Signed and dated 1668, it is one of the very few dated canvases by Vermeer. It no doubt forms a pair with The Geographer, preserved in the Städel Museum in Frankfurt, in which the same model and the same gown are recognizable; the two paintings passed together through several sales in the 18th century. At the end of the 19th century, The Astronomer entered the collection of the Rothschild family in Paris. Seized by the Nazis in 1940 and destined for Hitler's collection, it was returned to the family after the war. In 1983, it entered the Louvre by dation, that is, in payment of inheritance taxes, and it is today one of the museum's only two Vermeers, with The Lacemaker."""
facture = """
The light from the window slides over the face, the globe and the folds of the gown, while the background remains in a golden half-light. Vermeer describes with precision instruments that he no doubt knew directly: the globe corresponds to a model published by Jodocus Hondius in 1600, whose constellation figures can be recognized. The carpet, rendered in thick touches of color, contrasts with the gown, painted in broad planes of blue. The tight composition places the scholar and the globe on the diagonal of the light."""
details = [
  "The scholar's right hand, resting on the globe among the constellations.",
  "The signature and the date, inscribed on the door of the cupboard.",
  "The astrolabe set on the table carpet.",
  "The painting of Moses saved from the waters, partly visible at the right.",
  "The small diamonds of the window's stained glass, from which the light comes.",
]
themes = ["science", "astronomy", "knowledge", "light", "interior"]
anecdote = """
When the Nazis seized the painting from the Rothschilds, they affixed on the back a small swastika-shaped stamp, which designated it as confiscated property. The mark is still visible on the back of the canvas."""
