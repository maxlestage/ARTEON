[[artistes]]
nom = "Johannes Vermeer"
vie = "Delft, baptized 31 October 1632 – Delft, buried 15 December 1675"
biographie = """
Johannes Vermeer was baptized in Delft in 1632. His father, Reynier Jansz, a silk weaver, kept an inn on the main square and dealt in paintings. Nothing is known of the young man's training. In April 1653, he married Catharina Bolnes, from a well-off Catholic family, and probably converted to Catholicism; the couple settled with Catharina's mother, Maria Thins, in the Catholic quarter of the city. The same year, he joined the Guild of Saint Luke, of which he would several times be one of the officers. His first paintings were mythological and religious scenes; around 1657, he turned to the domestic interiors that would make his fame. He painted slowly, two paintings a year on average by some estimates, and had a loyal patron, Pieter van Ruijven, who owned a large part of his work. The couple had fifteen children, eleven of whom were still living at his death. In 1672, the French invasion of the United Provinces collapsed the art market; overwhelmed by debts, Vermeer died suddenly at forty-three, and his widow would say that he had sunk into despair. Quickly forgotten, he was rediscovered in the mid-19th century by the French critic Théophile Thoré-Bürger. Some thirty-five paintings are attributed to him today."""
style = """
Vermeer is the painter of quiet light: almost always coming from a window at the left, it bathes interiors in which one or two figures read, write, play music or work. His colors are limpid, dominated by natural ultramarine blue and yellow, and he renders reflections with small points of light. His compositions, of rigorous geometry, freeze an ordinary moment in a suspended silence. His use of the camera obscura is still debated. Rare, long forgotten, he became in the 20th century one of the most admired painters, from Proust to Dalí, and a reference for all interior painting."""

[[artistes]]
nom = "Rembrandt"
vie = "Leiden, 15 July 1606 – Amsterdam, 4 October 1669"
biographie = """
Rembrandt Harmenszoon van Rijn was born in Leiden, the son of a well-to-do miller. Enrolled for a time at the university, he chose painting: three years of apprenticeship with Jacob van Swanenburgh in Leiden, then six months in Amsterdam with Pieter Lastman, a history painter trained in Italy. Back in Leiden, he worked alongside Jan Lievens; both were noticed by Constantijn Huygens, secretary to the stadtholder. Around 1631, he settled in Amsterdam with the art dealer Hendrick Uylenburgh, whose cousin Saskia he married in 1634. A sought-after portraitist, he bought in 1639 a large house on the Jodenbreestraat, today's Rembrandt House, and trained many pupils. But bereavements accumulated: three children died in infancy, and Saskia died in 1642, shortly after the birth of their son Titus. He then lived with Hendrickje Stoffels, with whom he had a daughter, Cornelia. His collector's expenses and the decline in commissions led him to bankruptcy in 1656; his house and possessions were sold. He nevertheless continued to paint and to receive important commissions, such as The Syndics of the Drapers' Guild. Hendrickje died in 1663, Titus in 1668. Rembrandt died the following year and was buried in the Westerkerk in Amsterdam, in a rented grave whose exact location is unknown today."""
style = """
Rembrandt is the master of chiaroscuro: a warm, golden light brings a face, a hand, an object out of the shadow, and concentrates emotion. His touch evolves from a smooth precision, in the 1630s, toward an ever thicker and freer paint, worked with the brush and sometimes the knife, which gives flesh and fabrics a striking relief. A painter, draftsman and printmaker of the first rank, he renewed the group portrait as well as the biblical scene, seeking psychological truth rather than ideal beauty. His pupils, from Ferdinand Bol to Carel Fabritius, spread his manner; in the 19th century, Delacroix and Van Gogh admired him profoundly."""
