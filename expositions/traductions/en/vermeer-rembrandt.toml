architecte = "Pierre Cuypers"
construction = "1876–1885"
presentation = """
The national museum of the Netherlands was born in The Hague in 1800 and moved to Amsterdam in 1808. To give it a true palace, the State entrusted Pierre Cuypers, a champion of the Gothic Revival, with a red-brick building, constructed from 1876 to 1885, which combines Gothic towers and high roofs with Dutch Renaissance ornament; a vaulted passage runs right through it, still used today by cyclists. On the first floor, the gallery of honor, lined with alcoves, leads like the nave of a church to the Night Watch room, designed for Rembrandt's painting. After ten years of work led by the Spanish architects Cruz y Ortiz, the museum reopened in 2013, with its covered courtyards and restored painted decoration. The Dutch Golden Age can be seen there in full: Rembrandt, Frans Hals, Jan Steen, and four paintings by Vermeer, including the Milkmaid."""
ici = """
ARTEON's building takes up the axis of the Rijksmuseum: a gallery of honor leading to the Night Watch. One enters from the south into "The Gallery of Honor · Rembrandt", thirty meters long and nine meters wide, with grayish beige walls. In its northern part, two doors face each other: to the east Vermeer's cabinet, to the west the Delft cabinet, two small, square, low-ceilinged rooms with very pale gray walls, made for intimate paintings. At the end of the gallery, the Night Watch room, square and taller, presents the canvas at its actual size."""

