[[oeuvres]]
titre = "The Goldfinch"
artiste = "Carel Fabritius"
annee = "1654"
image = "chardonneret.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Carel_Fabritius_-_The_Goldfinch_-_605_-_Mauritshuis.jpg"
technique = "Oil on panel, 33.5 × 22.8 cm"
collection = "Mauritshuis, The Hague"
note = "A small bird chained to its feeder, painted in the very year its author died in the explosion of the Delft gunpowder store. The panel, barely larger than a sheet of notebook paper, is shown here enlarged."
description = """
On a light, whitewashed wall, a small wooden feeder painted grey is fixed by two brackets. Two semicircular wooden hoops surround it, one above, the other at mid-height. On the upper hoop perches a goldfinch, its body turned to the right, its head swivelled towards us. One recognises its red mask, its white cheeks and the bright yellow bar of its wing. A very fine little chain, almost invisible, holds it: it runs down the feeder and hangs in a loop beneath it. On top, to the left, a tiny container. The shadow of the bird and of the perch stretches across the wall, to the right. At the bottom, the signature and date are traced in capitals. There is nothing else: no room, no window, no landscape."""
evocation = """
The goldfinch was a much-loved pet bird in seventeenth-century Holland. It was taught to draw up with its beak, on the end of a little chain, a small bucket of water or seed: hence its Dutch name, puttertje, the little drawer of water. In religious painting, this bird that feeds on thistle seeds foretold the Passion of Christ; Fabritius, for his part, makes a portrait of it, lively and alert. It has been seen as an image of captivity, of fidelity or of the fragility of life, all the more poignant since the painter died a few months later. It is also a demonstration of virtuosity: from a certain distance, the bird seems truly perched on a wall."""
histoire = """
Fabritius painted this panel in Delft in 1654. We do not know for whom, or what it was used for: it has been supposed that it was fixed to a piece of furniture or a wainscot, to deceive the eye. On 12 October 1654, the city's gunpowder store exploded and devastated an entire district; Fabritius, wounded in the collapse of his house, died of his injuries at the age of thirty-two. The painting resurfaced in the nineteenth century in the possession of the French critic Théophile Thoré-Bürger, the rediscoverer of Vermeer. Sold in Paris after his death, it was bought in 1896 for the Mauritshuis by its director, Abraham Bredius. It has become, with Girl with a Pearl Earring, one of the most famous paintings in the museum."""
facture = """
Unlike the fine painters of Leiden, Fabritius lets his brushwork show. The bird is built up in a few rapid brushstrokes, the yellow bar of the wing laid on in thick paste, the down suggested rather than described. A pupil of Rembrandt, he nevertheless gave up the dark grounds of his master: the figure stands out light on light, against a luminous wall, and it is the cast shadow that gives it relief. Seen from close up, the painting is free and almost sketched; seen from afar, the illusion is perfect."""
details = [
  "The little chain, painted in a single light stroke, hanging in a loop beneath the feeder.",
  "The yellow bar of the wing, laid on in thick touches.",
  "The shadow of the bird and the perch, cast on the wall to the right.",
  "The signature C FABRITIVS 1654, in capitals, as if inscribed in plaster.",
  "The tiny container set on top of the feeder.",
]
themes = ["bird", "trompe l'oeil", "delft", "captivity", "light"]
anecdote = """
Donna Tartt's novel The Goldfinch, published in 2013 and awarded the Pulitzer Prize in 2014, takes this painting as its guiding thread, carried off by a teenager from the ruins of a New York museum struck by a bombing."""
salle = 1
mur = "nord"
place = 1
largeur = 0.7

[[oeuvres]]
titre = "The King Drinks"
artiste = "Jacob Jordaens"
annee = "c. 1640–1645"
image = "le-roi-boit.jpg"
cadre = "dore"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jacob_Jordaens_-_The_Feast_of_the_Bean_King_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 242 × 300 cm"
collection = "Kunsthistorisches Museum, Vienna"
note = "On the evening of Epiphany, the old man who has found the bean in the cake is king: every time he drinks, the whole table cries “The king drinks!”"
description = """
In a room with stained-glass windows, a large family is gathered around a table. On the right, an old man with a white beard, wearing a gilded paper crown, drinks in long draughts, a jug in his hand: he is the bean king. At the centre, a young woman, also crowned, the queen, remains calm and looks at us. Around them, people shout, laugh, raise their glasses; a man in blue throws back his head, crying out, and on the right a man in a feathered cap laughs heartily. On the left, a guest overcome by sickness leans forward, while a little girl drinks in her turn. In the foreground are piled jugs, dishes and a bread basket; a dog begs, a cat sleeps. At the top, a cartouche adorned with a mask bears a Latin inscription."""
evocation = """
The feast of the Kings was one of the great festivities of Flanders: a cake contained a bean, and whoever found it became king for the evening. He named his court, counsellor, singer, jester or cupbearer, often by drawing lots, and every time he drank, everyone had to cry “The king drinks!”, on pain of a fine. Jordaens celebrates the abundance and warmth of a Flemish household, but the inscription, “Nothing more resembles a fool than a drunk man”, recalls the lesson: as in Jan Steen, laughter and morality go together. It has been thought that the old king bears the features of Adam van Noort, the painter's father-in-law and former master."""
histoire = """
Jordaens painted this subject many times from the end of the 1630s: versions are known in Paris, Brussels, Kassel and Saint Petersburg. The Vienna one, among the largest, dates from the years when, after the death of Rubens in 1640 and of Van Dyck in 1641, Jordaens became the leading painter of Antwerp. It belonged to Archduke Leopold William, governor of the Spanish Netherlands from 1647 to 1656 and a passionate collector, who took his paintings to Vienna. Having passed into the imperial Habsburg collections, the canvas entered the Kunsthistorisches Museum, where it is still displayed."""
facture = """
The life-size figures press against the edge of the picture as if the festivity were spilling over towards us. The composition rises on a diagonal, from the still life of tableware at lower left to the old king on the right. Jordaens takes from Rubens the rosy flesh tones and generous brushwork, but his models are earthier, drawn from the people around him. The light enters through the window on the left and makes the metal of the jugs, the red cheeks and the white fabrics gleam."""
details = [
  "The cartouche with the grimacing mask, at the top, bearing the Latin motto on drunkenness.",
  "The mirror hanging on the left, in which two faces are reflected.",
  "The gilded paper crowns of the old king and the young queen.",
  "The cat curled up at lower right, indifferent to the din.",
  "The small slips of paper fallen on the floor, near the boots of the drinker in blue.",
]
themes = ["feast", "epiphany", "family", "drunkenness", "flanders"]
anecdote = """
In France too, people cried “The king drinks!” at the Epiphany meal. The bean hidden in the galette des rois, and the paper crown that goes with it, perpetuate to this day the custom painted by Jordaens."""
salle = 2
mur = "nord"
place = 1
largeur = 3.0

[[oeuvres]]
titre = "Charles I at the Hunt"
artiste = "Antoine van Dyck"
annee = "c. 1635"
image = "charles-ier-a-la-chasse.jpg"
cadre = "dore"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Anthony_van_Dyck_-_Charles_I_at_the_Hunt_(cropped).jpg"
technique = "Oil on canvas, 266 × 207 cm"
collection = "Musée du Louvre, Paris"
note = "The King of England, dismounted, poses as a gentleman: no crown, no armour, and yet all the royal majesty."
description = """
In a landscape, at the edge of a wood, Charles I stands on the left, in three-quarter view. He wears a broad black hat, a doublet of silvery satin, red breeches and tall pale spurred boots; a sword hangs at his side. One hand on his hip, the other resting on a cane, he turns his head and looks at us over his shoulder, with quiet assurance. Behind him, an equerry holds his grey horse, which lowers its head; a young page appears between them. A great tree spreads its branches above the group. On the left, the ground slopes down to a plain and the sea, where a sailing ship can be made out, beneath a late-day sky. At lower right, a Latin inscription identifies the king."""
evocation = """
Van Dyck represents the king without any attribute of power: no sceptre, no throne, no ermine mantle. Majesty comes through ease, that effortless elegance expected of a gentleman. The viewpoint, taken slightly from below, enlarges a sovereign of small stature, and the horse lowering its head seems to bow before him. This is the image Charles wished to give of himself: a refined prince, a lover of art, certain of his divine right. With hindsight, one also reads in it the remoteness of a king who refused to share power with his Parliament; civil war led him to the scaffold in 1649."""
histoire = """
Settled in London in 1632, Van Dyck became the principal painter of Charles I, who knighted him. He painted this portrait around 1635, at the height of his favour. We do not know where the painting was in the king's time; it is mentioned in France from the first half of the eighteenth century. Madame du Barry, favourite of Louis XV, owned it when she sold it to Louis XVI in 1775. Having entered the royal collections, it passed with them to the Louvre after the Revolution. There it has become one of the most admired portraits, and a model for European portraitists."""
facture = """
From Titian, whom he studied during his Italian years, Van Dyck retained the richness of colouring and the fusion of the figure into the landscape. The silvery satin of the doublet is rendered in rapid, shimmering touches that catch the light against the dark background of the foliage. The harmonies are subtle: silver, muted red, brown and green. The composition is organised on a diagonal, from the king to the horse, and leaves on the left a luminous opening that isolates the royal silhouette."""
details = [
  "The hand placed on the hip, a gesture of ease and authority.",
  "The grey horse lowering its head, as if saluting the king.",
  "The pearl gleaming at the king's ear.",
  "In the distance, on the left, the sea and a tiny sailing ship.",
  "The spurs fastened to the boots of pale leather.",
]
themes = ["portrait", "king", "england", "elegance", "horse"]
anecdote = """
Louis XVI, who bought the painting in 1775, was descended from Charles I through the latter's daughter, Henrietta of England. The two kings met the same fate: Charles was beheaded in London in 1649, Louis XVI in Paris in 1793."""
salle = 2
mur = "nord"
place = 4
largeur = 2.07

[[oeuvres]]
titre = "Still Life with Cheeses, Almonds and Pretzels"
artiste = "Clara Peeters"
annee = "c. 1615"
image = "fromages-amandes-bretzels.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Clara_Peeters_-_Still_Life_with_Cheeses,_Almonds_and_Pretzels_-_1203_-_Mauritshuis.jpg"
technique = "Oil on panel, 34.5 × 49.5 cm"
collection = "Mauritshuis, The Hague"
note = "Cheeses, pretzels, bread and wine on a table; and, in the pewter lid of the jug, the tiny reflection of the painter. The panel measures less than 50 cm wide."
description = """
On a wooden table, against a dark background, cheeses are piled up: a large wheel, cut into, another with a greenish rind set in front of it, a drier piece above and, on a raised pewter plate, a mound of butter in streaked curls. On the right stand a jug of brown stoneware with a pewter lid and a tall lidded glass, filled with wine, on a gilded foot; a small bread roll is set behind it. In the foreground, two interlaced pretzels, a silver-handled knife projecting over the edge of the table and a blue-and-white Chinese porcelain dish, filled with almonds and dried fruit. A few almonds have fallen onto the table."""
evocation = """
Nothing here of a princely banquet: it is the table of a comfortable household, with produce that the Flemish and Dutch considered their own, cheese, butter, bread. The Chinese porcelain, by contrast, recalls the distant trade that enriched the ports of the Netherlands. The knife engraved with the painter's name is a bridal knife, a traditional wedding gift, and the tiny self-portrait hidden in the reflection of the jug is a discreet but insistent way of asserting her presence in an almost entirely male profession. One may read in it an artist's pride: signing twice, with her name and with her face."""
histoire = """
Clara Peeters worked in Antwerp in the early seventeenth century. Her first dated paintings, of 1607 and 1608, make her one of the very first to paint meal still lifes, even before most of the Dutch masters. This panel dates from around 1615. It was bought by the Mauritshuis in 2012, thanks to the Friends of the museum, the BankGiro Loterij and the Rembrandt Association. In 2016, the Prado Museum devoted an exhibition to Clara Peeters, the first in its history dedicated to a woman painter. The Mauritshuis, rich in Dutch still lifes, thereby gained one of the earliest examples of the genre."""
facture = """
The slightly plunging viewpoint sets off each object without hiding it behind another. Peeters paints with very fine brushes, on panel: the holes of the cheese, the streaks of the butter, the crumbs of the bread, the gleam of the pewter and the transparency of the glass are rendered with a goldsmith's precision. The almost black background brings out the ochres and creamy whites, and the light, coming from the left, gives each form a firm volume."""
details = [
  "In the pewter lid of the jug, the reflection of a woman in a white cap: the painter herself.",
  "The name of Clara Peeters engraved on the silver handle of the knife.",
  "The streaked curls of butter, on the raised plate.",
  "The blue-and-white Chinese porcelain dish, filled with almonds and dried fruit.",
  "The two interlaced pretzels at the edge of the table.",
]
themes = ["still life", "meal", "cheese", "self-portrait", "women painters"]
anecdote = """
This is not Clara Peeters's only hidden self-portrait. In a still life of 1612 preserved in Karlsruhe, she paints herself six times, tiny, in the bosses of a gilded goblet."""
salle = 3
mur = "ouest"
place = 1
largeur = 0.95

[[oeuvres]]
titre = "Vanitas Still Life"
artiste = "Pieter Claesz"
annee = "1630"
image = "vanite-claesz.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Pieter_Claesz_-_Vanitas_Still_Life_-_943_-_Mauritshuis.jpg"
technique = "Oil on panel, 39.5 × 56 cm"
collection = "Mauritshuis, The Hague"
note = "A skull, a watch, an extinguished lamp and an overturned glass: everything recalls that time passes and that death comes."
description = """
On a table covered with an olive-green cloth, a pile of old books with worn pages serves as a base for a human skull, set on a sheet of paper. A long bone projects behind it and a goose quill lies on the books. On the left, an extinguished oil lamp stands beside a stemmed glass lying on its side. In the foreground, a gilded pocket watch lies open, its lid raised; a blue ribbon is attached to it, and a small key hangs over the edge of the table. Behind, a bare wall, beige-grey, receives a soft light from the left. On the edge of a book, the painter has inscribed his monogram and the date."""
evocation = """
The title comes from Ecclesiastes: “Vanity of vanities, all is vanity.” Each object carries a meaning that contemporaries read without difficulty. The skull and the bone speak of death, the watch of time running out, the extinguished lamp of a life coming to an end, the overturned glass of the vanity of pleasures, the books and the quill of that of knowledge. In Calvinist Holland, these paintings invited meditation on salvation. But they also pose a paradox: in preaching contempt for things, the painter celebrates their beauty, and one admires the gleam of the gold and the transparency of the glass as much as the lesson."""
histoire = """
Pieter Claesz, settled in Haarlem since the 1620s, painted this panel in 1630, at the moment when, together with Willem Claesz Heda, he was inventing an almost monochrome still life. Vanitas paintings were then in great demand, particularly in Leiden, a university town where skulls, books and hourglasses were prized. Claesz painted several, with only a few objects, arranged on the corner of a table. This painting, which passed through a Swedish collection and the art trade in The Hague, was bought by the Mauritshuis in 1960, with the support of the Rembrandt Association."""
facture = """
The range is deliberately restricted: browns, ochres, greys and muted greens, enlivened only by the gold of the watch and the blue of the ribbon. A single light, coming from the left, glides over the objects and unifies the scene in a grey atmosphere. The composition is organised on a diagonal, from the lamp to the books, and the skull, at the summit, is its centre. Claesz renders with the same attention the porosity of the bone, the crumpled paper and the thick glass."""
details = [
  "The monogram PC and the date 1630, on the edge of a book, on the right.",
  "The small key of the watch, at the end of the blue ribbon, hanging over the edge of the table.",
  "The goose quill resting on the books, to the right of the skull.",
  "The overturned stemmed glass, whose raised glass prunts can be seen.",
  "The dog-eared, worn pages of the stacked books.",
]
themes = ["vanitas", "death", "time", "still life", "haarlem"]
anecdote = """
His son, Nicolaes Berchem, became one of the most sought-after Italianate landscape painters in Holland. He did not sign Claesz, but Berchem, after the birthplace of his father's village, near Antwerp."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Still Life with a Gilt Cup"
artiste = "Willem Claesz Heda"
annee = "1635"
image = "nature-morte-gobelet-dore.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Stilleven_met_vergulde_bokaal,_SK-A-4830.jpg"
technique = "Oil on panel, 88 × 113 cm"
collection = "Rijksmuseum, Amsterdam"
note = "An interrupted meal: open oysters, a half-peeled lemon, a silver cup overturned at the foot of a tall gilt goblet."
description = """
A table is half covered with a white damask cloth, crumpled and turned back. On pewter plates, open oysters, a broken bread roll and a paper cone; a black-handled knife projects from a plate. Behind, a silver salt cellar, a small glass jug, a glass of red wine and a large roemer, a green stemmed glass filled with white wine. On the right stand a tall gilt goblet, whose lid is surmounted by a small figure of a soldier, and a large pewter jug with its lid open. A silver cup lies overturned on the cloth. At the edge of the table, a half-peeled lemon lets its peel hang in a spiral; beside it, a glass lying on its side."""
evocation = """
This type of painting was called a banketje, a little banquet. The meal seems to have been abandoned that very instant: the cup has fallen, the lemon is partly eaten, the oysters wait. This disorder has been read as an image of the ephemeral, of pleasures that pass and things that spill. The luxury objects, the goldsmith's goblet, the lemon from the south, the oysters, perhaps invited moderation; the lemon, beautiful but bitter, has sometimes been understood as a symbol of deceptive appearance. But the painting is above all a eulogy of light and materials, offered to burghers proud of their prosperity."""
histoire = """
Heda spent his whole career in Haarlem, where he was a member of the Guild of Saint Luke and specialised in laid tables. As early as 1628, the city historian Samuel Ampzing cited his name among the painters who brought glory to Haarlem. In 1635 he was at the height of his tonal manner, which he shared with Pieter Claesz: a few chosen objects, a reduced palette, a grey light. This large panel, one of the most ambitious he painted, is today one of the most admired still lifes in the Rijksmuseum."""
facture = """
The painting is almost monochrome: grey, silver, gold, white and dark green. The light, coming from the left, glides over the metal, passes through the glass and makes the folds of the cloth sing. The composition rises in a pyramid from left to right, up to the gilt goblet that marks its summit. Heda paints in thin layers, without visible brushwork, and renders with equal exactness the reflection of the pewter, the transparency of the roemer and the nacre of the oysters."""
details = [
  "The spiral of lemon peel hanging over the edge of the table.",
  "The small figure of a soldier crowning the lid of the gilt goblet.",
  "The paper cone set on the plate at left, beside the oysters.",
  "The overturned silver cup, whose underside of the foot can be seen.",
  "The signature HEDA and the date 1635, on the edge of the cloth.",
]
themes = ["still life", "meal", "luxury", "light", "haarlem"]
anecdote = """
The lemon, imported from Spain or Italy, remained a luxury in the United Provinces; its juice was squeezed over oysters. Its peel, cut in a spiral, half smooth and half rough, became a piece of bravura that still-life painters loved to show."""
salle = 3
mur = "ouest"
place = 3
largeur = 1.13

[[oeuvres]]
titre = "Vase of Flowers"
artiste = "Jan Davidsz de Heem"
annee = "c. 1670"
image = "vase-de-fleurs.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jan_Davidsz_de_Heem_-_Vase_of_Flowers_-_1099_-_Mauritshuis.jpg"
technique = "Oil on canvas, 74.2 × 52.6 cm"
collection = "Mauritshuis, The Hague"
note = "An impossible bouquet: flowers of every season gathered in a glass vase, with fruit, insects and a snail."
description = """
On a stone ledge, against a dark background, a round glass vase holds a teeming bouquet. White lilies and an orange lily rise upwards, with poppies, a purple iris and a tulip streaked red and white. At the centre open roses, a large flower variegated pink and white, cornflowers and blue bindweed. Ears of wheat, gooseberries, a split apricot and a peach mingle with the flowers. On the ledge lie blackberries, cherries and bunches of white and red currants. Everywhere, life teems: butterflies, a bumblebee, caterpillars, and a snail climbing the side of the vase. The signature is inscribed on the stone, on the right."""
evocation = """
No garden ever offered this bouquet: these flowers do not bloom at the same moment of the year. The painter gathered them from studies made in each season, to compose an encyclopaedia of natural beauty. The painting celebrates the richness of creation and the Dutch passion for horticulture, which had made the tulip an object of speculation. It has also been seen as a vanitas: the flowers will wither, the fruit will rot, the caterpillar and the snail are already gnawing the leaves. Historians have proposed religious readings, the wheat of the eucharistic bread or the butterfly of resurrection, but the meaning remains open."""
histoire = """
Jan Davidsz de Heem painted this picture around 1670, in his last years, when he was one of the most famous flower painters in Europe, divided between Antwerp and his native city of Utrecht. His bouquets sold for very high prices and trained a whole generation of flower painters, in Flanders as in Holland. The painting belonged to a private collection in Switzerland, then passed through the art trade in Maastricht. It entered the Mauritshuis in 1993, thanks to an important contribution from Baron Hans Heinrich Thyssen-Bornemisza and the support of the Rembrandt Association."""
facture = """
De Heem arranges the flowers in an ample, asymmetrical mass that overflows the vase and opens like a fan. Against the dark ground, the whites, reds and blues shine like precious stones. Each petal is modelled with fine glazes, transparent layers of colour, which give the velvet of the roses and the satin of the lilies their lustre. The glass of the vase lets the stems be seen in the water, and the light, coming from the left, brings out the flowers in the foreground."""
details = [
  "The snail climbing the side of the vase, on the left.",
  "The stems visible through the glass, in the water.",
  "The tulip streaked red and white, a luxury flower in the seventeenth century.",
  "The large yellow and black butterfly, resting at the bottom on the stone ledge.",
  "The signature J. D. De Heem, on the ledge at right.",
]
themes = ["flowers", "still life", "insects", "seasons", "vanitas"]
anecdote = """
Henri Matisse copied a still life by De Heem, A Dessert, at the Louvre in 1893. In 1915 he painted a new version of it, transformed by the geometry of Cubism, now in the Museum of Modern Art in New York."""
