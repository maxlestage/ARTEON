[exposition]
ordre = 52
nom_court = "Flanders and Holland"
mouvement = "Landscapes, still lifes and genre scenes of the Low Countries"
cadre = "ebene"
couleur = "#3a5566"
titre = "Flanders and Holland, the Golden Age of Everyday Life"
artiste = "Hals, Steen, De Hooch, Ruisdael, Clara Peeters, Van Dyck, Jordaens…"
dates = "1615–1705"
accroche = "Virtual exhibition · Mauritshuis, The Hague"
introduction = """
In the seventeenth century, the old Low Countries were split in two: in the north, the merchant, Protestant Republic of the United Provinces; in the south, Flanders, which remained Spanish and Catholic. On both sides of the border, painters invented new genres for a clientele of burghers: landscape, still life, the scene of everyday life. The visit brings together thirteen painters, from Clara Peeters to Adriaen Coorte, and the Flemish festivity of Jordaens and Van Dyck. The building is inspired by the Mauritshuis in The Hague: a vestibule, a golden room at the centre and, around it, three cabinets with coloured walls."""
vitrine = "chardonneret.jpg"

[musee]
nom = "Mauritshuis"
ville = "The Hague, Netherlands"
architecte = "Jacob van Campen and Pieter Post"
construction = "1636–1641"
presentation = """
In 1631, Count John Maurice of Nassau-Siegen, cousin of the stadtholder Frederick Henry, bought a plot of land beside the Hofvijver, the pond that runs alongside the Binnenhof, the heart of power in The Hague. Between 1636 and 1641, while he was governing Dutch Brazil, he had a residence built there, designed by Jacob van Campen and Pieter Post: a two-storey block, strictly symmetrical, a model of Dutch classicism. A fire ravaged the interior in 1704; the reconstruction was completed in 1718 with the Golden Room, whose ceiling and overmantels were painted by Giovanni Antonio Pellegrini. Bought by the State in 1820, the building received in 1822 the Royal Cabinet of Paintings, drawn from the collections of the Princes of Orange. Extended by Hans van Heeswijk and reopened in 2014, the Mauritshuis displays nearly eight hundred paintings, including Girl with a Pearl Earring and The Goldfinch. Today it also recalls the colonial fortune of its builder, drawn from Brazilian sugar and the labour of enslaved Africans."""
ici = """
ARTEON's building takes up the symmetry of the Mauritshuis, on a single level. Visitors enter from the south into the vestibule, where The Goldfinch welcomes them, then proceed to the Golden Room, nine metres high, with walls of pale gold in memory of Pellegrini's decoration: Jordaens and Van Dyck represent Flanders there. To the west opens the cabinet of still lifes, with taupe walls; to the east, the room of landscapes, pale green; to the north, the room of everyday life, in old rose, devoted to Hals, Steen and De Hooch."""

