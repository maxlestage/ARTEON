[[oeuvres]]
titre = "Still Life with Wild Strawberries"
artiste = "Adriaen Coorte"
annee = "1705"
image = "fraises-des-bois.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Adriaen_Coorte_-_Still_Life_with_Wild_Strawberries_-_1106_-_Mauritshuis.jpg"
technique = "Oil on paper mounted on panel, 16.5 × 14 cm"
collection = "Mauritshuis, The Hague"
note = "A small heap of wild strawberries and a strawberry flower on a stone ledge. The original painting is no larger than a hand: it is shown here enlarged more than fourfold."
description = """
On a ledge of grey stone, its edge slightly chipped, lies a heap of bright red wild strawberries, speckled with tiny pale seeds. Some are still attached to their stems, with their green sepals; a few others, barely ripe, remain white. A stem rises in the middle of the heap and bears a strawberry flower with five white petals and a yellow heart, surrounded by buds. A serrated leaf spreads out on the right. In front of the ledge, a stem hangs down with a last fruit and a bud. All around, the background is brown-black, barely lightened at upper right. The painter's signature is inscribed on the face of the ledge, and the date on the stone below."""
evocation = """
Coorte dispenses with everything: no precious tableware, no tablecloth, no obvious symbol. All that remains is a few fruits of the woods, caught in silence, as in a meditation. The flower rising above the ripe strawberries and the still-white fruits brings together in a single image the whole cycle of the plant, flowering, growth, ripeness, and one may read in it the passing of time. In the Christian tradition, the strawberry, a humble fruit that grows close to the ground, was also associated with the Virgin and with paradise. Beside De Heem's sumptuous bouquets, this small painting shows another path: greatness through modesty."""
histoire = """
Adriaen Coorte worked in Middelburg, in Zeeland, far from the great centres of Amsterdam or Haarlem. He almost always painted small formats, on paper later glued to panel, for a local clientele. This painting, dated 1705, is among his last known works: his signed paintings run from 1683 to 1707. After his death, he was almost totally forgotten. It took an article by the Dutch historian Laurens J. Bol, in 1952, then an exhibition at the Dordrecht museum in 1958, for his name to reappear; the Mauritshuis today holds several of his small paintings."""
facture = """
Coorte paints in oil on a simple sheet of paper, with minuscule brushes: each seed of the strawberry is a dot of colour set down one by one. The light, coming from upper left, models the fruits and sets them off against a dark ground, slightly graded. The stone ledge, seen from the front, serves as a stage and gives the composition its stability. The palette is limited to red, green, white and brown."""
details = [
  "The minuscule pale seeds painted one by one on each strawberry.",
  "The white strawberry flower, with its yellow heart, rising above the fruits.",
  "The still-white strawberries, not yet ripe, mixed in with the red ones.",
  "The stem hanging in front of the ledge, with a last fruit.",
  "The signature on the face of the ledge, and the date 1705 below it.",
]
themes = ["still life", "fruit", "silence", "miniature", "zeeland"]
anecdote = """
Almost nothing is known of Coorte's life. One of the rare archival traces dates from 1695: the Middelburg Guild of Saint Luke fined him for selling a painting without being a member."""
salle = 3
mur = "sud"
place = 2
largeur = 0.6

[[oeuvres]]
titre = "The Mill at Wijk bij Duurstede"
artiste = "Jacob van Ruisdael"
annee = "c. 1668–1670"
image = "moulin-de-wijk.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:De_molen_bij_Wijk_bij_Duurstede,_SK-C-211.jpg"
technique = "Oil on canvas, 83 × 101 cm"
collection = "Rijksmuseum, Amsterdam"
note = "A dark mill stands against a stormy sky, on the bank of the Lek: the Dutch landscape become monument."
description = """
The viewpoint is very low, at water level. On the right, on a bank reinforced with wooden piles, rises a great stone mill, round and squat, ringed by a gallery; its sails are silhouetted against the sky. Behind it appear the roofs of the little town of Wijk bij Duurstede, Duurstede Castle, to the left of the mill, and a square tower. On the path, at right, women in white caps walk away. On the left stretches the Lek, a broad arm of the Rhine, on which a sailing boat with white sails glides. In the foreground, reeds quiver at the edge of the choppy water. Above, an immense sky, laden with grey and white clouds, occupies two thirds of the canvas."""
evocation = """
The mill is the very emblem of Holland, a country won from the water through human labour and the force of the wind. Ruisdael places it in the front rank and makes it appear gigantic, like a monument. Against the stormy sky, the dark silhouette expresses a quiet resistance; the light that pierces the clouds promises a clearing. People have sometimes sought a religious or moral meaning in his landscapes; what one sees above all is a grave poetry, which led Goethe to say that Ruisdael was a poet. For the Dutch, the painting has become the image of their national landscape."""
histoire = """
Ruisdael, settled in Amsterdam since the mid-1650s, painted this canvas around 1668–1670. Wijk bij Duurstede is a small town on the Lek, south-east of Utrecht; he went there or used drawings, but he recomposed the site to give the mill greater presence. The painting belonged to the Amsterdam banker Adriaan van der Hoop, who bequeathed his collection to the city of Amsterdam in 1854. On loan to the Rijksmuseum since 1885, it has become one of the most famous landscapes in Dutch painting."""
facture = """
The very low horizon leaves the sky most of the canvas. The mill, dark, is silhouetted against the pale clouds, then the light touches a sail and the façade: Ruisdael constantly plays on these contrasts. The curving bank, lined with piles, leads the eye from the foreground to the mill. The palette remains sober, made of greys, browns and greens, and the shadows of the clouds send zones of light and shade running across the landscape."""
details = [
  "The women in white caps walking along the path, on the right.",
  "The white sailing boat on the river, on the left.",
  "The wooden piles that hold back the bank.",
  "The gallery that runs around the mill, at mid-height.",
  "Duurstede Castle, half hidden behind the trees, to the left of the mill.",
]
themes = ["landscape", "mill", "sky", "river", "holland"]
anecdote = """
The mill painted by Ruisdael was demolished in the early nineteenth century; its foundations can still be seen. It is often confused with the Rijn en Lek mill, still standing a few streets away."""
salle = 4
mur = "est"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "The Avenue at Middelharnis"
artiste = "Meindert Hobbema"
annee = "1689"
image = "allee-de-middelharnis.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Meindert_Hobbema_001.jpg"
technique = "Oil on canvas, 103.5 × 141 cm"
collection = "National Gallery, London"
note = "A road lined with tall pollarded trees runs straight towards the village of Middelharnis, on the island of Goeree-Overflakkee."
description = """
A sandy road, rutted, starts from the bottom of the picture and runs straight to the centre of the horizon. On each side rise tall, very slender trees with bare trunks, which keep their foliage only at the crown. A man followed by a dog walks down the avenue towards us. On the left, beyond the fields, the village of Middelharnis and the steeple of its church; on the right, a farm with red roofs, in front of which a couple chat. In the foreground, at right, a man tends the young trees of a nursery planted in rows. Ditches full of water line the road. The sky, immense, is animated with white clouds."""
evocation = """
The painting is constructed like a lesson in perspective, with its single vanishing point and almost perfect symmetry, and yet it breathes. It is a landscape made by man: a road laid out with a line, trees planted and pruned, drained fields, a nursery. Hobbema thus celebrates the order and prosperity of a domesticated countryside, far from the wild forests of his master Ruisdael. The gardener who tends the young trees, at the foot of the tall ones, evokes the long span of time: one plants for generations to come. And the gaze, guided by the road, runs on to the village and beyond."""
histoire = """
Hobbema was a pupil of Ruisdael in Amsterdam. After his marriage in 1668, he took a municipal post and painted much less: this painting, dated 1689, is a late and exceptional work. Middelharnis is a village on the island of Goeree-Overflakkee, in the south of Holland. Little esteemed in his lifetime, Hobbema became in the nineteenth century one of the Dutch painters most sought after by English collectors. The painting then belonged to the statesman Robert Peel; the National Gallery acquired it in 1871 with part of his collection."""
facture = """
The vertical trunks, regularly spaced, give the canvas its rhythm like the columns of a nave and guide the eye to the vanishing point. The pale road forms a great luminous triangle at the centre. Hobbema employs a fresher, lighter palette than in his woodland paintings: tender greens, blues, pale ochres. The fine touch of the foliage contrasts with the great masses of the sky, painted more broadly."""
details = [
  "The steeple of the Middelharnis church, to the left of the road.",
  "The man and his dog walking down the avenue towards us.",
  "On the right, the man tending the young trees of the nursery.",
  "The ruts cut in the sand by cart wheels.",
  "The couple chatting in front of the red-roofed farm.",
]
themes = ["landscape", "perspective", "trees", "road", "sky"]
anecdote = """
From 1668, Hobbema was a wine gauger for the Amsterdam excise: he measured the contents of imported barrels to calculate the tax. This regular job explains why his paintings became rare in the second half of his life."""
salle = 4
mur = "est"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "The Merry Drinker"
artiste = "Frans Hals"
annee = "c. 1628–1630"
image = "joyeux-buveur.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Een_schutter_die_een_berkenmeier_vasthoudt,_bekend_als_%E2%80%98De_vrolijke_drinker%E2%80%99,_SK-A-135.jpg"
technique = "Oil on canvas, 81 × 66.5 cm"
collection = "Rijksmuseum, Amsterdam"
note = "A man in a big hat raises his glass and greets us with his hand: an instant caught on the wing, like a snapshot."
description = """
A man is seen half-length, almost face on, against a neutral beige-grey background. He wears a broad black hat with a soft brim, an upturned moustache and a small beard; his cheeks are red, his eyes sparkle and his mouth is slightly open as if he were about to speak. A large white lace collar covers his shoulders, over a yellow-ochre doublet drawn in by a belt; a medallion hangs on his chest. With one hand raised, fingers spread, he signals to someone, perhaps to us. In the other, he holds a large stemmed glass, a berkemeyer, filled with a golden drink. The painter's monogram appears on the background, on the right."""
evocation = """
The painting gives the impression of an instant taken from life: the drinker has just turned towards us, calls out to us, perhaps invites us to clink glasses. We do not know who he is. The Rijksmuseum today titles it “A Militiaman Holding a Berkemeyer, Known as the Merry Drinker”: his dress evokes the civic guards of Haarlem, whom Hals painted in large group portraits. It is not, however, an official portrait, but rather a character study, between portrait and genre scene. It has sometimes been seen as a warning against drunkenness; what one sees above all is the gaiety and warmth of a society that likes to drink together."""
histoire = """
Hals painted this picture in Haarlem around 1628–1630, at the time when he was producing numerous laughing figures: drinkers, musicians, children. These canvases, made perhaps for the market rather than on commission, established his reputation as a painter of the joy of living; the most famous after this one, the Malle Babbe, an old woman cackling with a tankard, is in Berlin. The painting entered the Rijksmuseum at the very beginning of the nineteenth century. Like its author, long judged too careless, it was reappraised in the nineteenth century, when the Realists and the Impressionists recognised in Hals a precursor of their free painting."""
facture = """
Hals paints quickly, directly, with no apparent preliminary drawing. The lace collar is made of white zigzag hatchings, the raised hand of a few brushstrokes that make it blurred, as if in motion. The palette is reduced to black, ochre, white and the red of the cheeks, laid on a light ground. At a time when smooth surfaces were favoured, his visible, almost brutal brushwork gives the figure an extraordinary life."""
details = [
  "The raised hand, painted in a few brushstrokes, as if in motion.",
  "The monogram FH, on the right, at shoulder height.",
  "The large stemmed glass, whose golden contents catch the light.",
  "The medallion hanging on the chest.",
  "The lace collar, rendered with white zigzag hatchings.",
]
themes = ["portrait", "conviviality", "drink", "haarlem", "snapshot"]
anecdote = """
In 1872, Manet went to see the Hals paintings in Haarlem. The following year, he exhibited at the Salon Le Bon Bock, a pipe-smoking drinker so close to Hals that the painter Alfred Stevens is said to have quipped: he is drinking Haarlem beer."""
salle = 5
mur = "est"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "As the Old Sing, So Pipe the Young"
artiste = "Jan Steen"
annee = "c. 1668–1670"
image = "comme-les-vieux-chantent.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jan_Steen_-_%27As_the_Old_Sing,_So_Pipe_the_Young%27_-_742_-_Mauritshuis.jpg"
technique = "Oil on canvas, 134 × 163 cm"
collection = "Mauritshuis, The Hague"
note = "A family feast where the adults drink, smoke and sing, under the eyes of the children who imitate them; the father laughing under his black hat is Jan Steen himself."
description = """
A family makes merry in a room lit by a window on the left. A young woman in a green jacket trimmed with fur, leaning back in her armchair, holds out her glass, which a servant fills, raising a jug high. Behind her, an old man in a fur cap smiles. At the centre, a woman holds a swaddled infant. On the right, an old woman in a dark hood follows a song sheet with her finger. Behind her, a hilarious man under a black hat holds out a long pipe to a small boy; an adolescent in a fur cap plays the bagpipes, a little girl looks on furtively. On the table: grapes, a lemon, oysters. A red parrot, a bird cage, and a dog in the foreground."""
evocation = """
The title takes up a Dutch proverb, made popular by the emblems of the poet Jacob Cats: children reproduce what their parents do. The Dutch word pijpen plays on several meanings, to play the pipe, to smoke a pipe, and even to drink. Here, the old woman sings, the father teaches his son to smoke, the mother drinks, and the little ones follow the example. The parrot, the bird that repeats, gives the key. Steen portrays himself as a bad example, with delightful self-mockery: the viewer laughs, then recognises himself. Jordaens had already illustrated the same proverb in 1638, in Antwerp: popular wisdom unites Flanders and Holland."""
histoire = """
Steen treated this proverb several times; the Mauritshuis holds another version, smaller and slightly earlier. This one, the most ambitious, dates from the years when he lived in Haarlem, before his return to Leiden in 1670. It is lost from view until the early nineteenth century: sold in 1816 at Warmond, near Leiden, it then entered the Steengracht collection in The Hague. When that collection was dispersed, it joined the Mauritshuis in 1913. Its attribution has never been in doubt."""
facture = """
Trained in the taste for the fine painting of Leiden, Steen knows how to render every material: the lavender silk of the skirt, the fur, the pewter, the dog's skin. But here he paints more broadly, on a large canvas, and arranges his figures like the actors of a stage scene, in a frieze, with very legible gestures. The bright colours, green, pink, red, burst forth in the light of the window. Each face has its expression, and the eye passes from one episode to the next as in a story."""
details = [
  "The red parrot on its perch, at upper left: the bird that repeats.",
  "The stream of wine falling from the raised jug into the glass.",
  "The long clay pipe that the father holds out to the little boy.",
  "The song sheet that the old woman follows with her finger.",
  "The dog raising its head towards the table, in the foreground.",
]
themes = ["family", "proverb", "feast", "music", "education"]
anecdote = """
In Dutch, a disorderly household is still called “a Jan Steen household”, een huishouden van Jan Steen: the reputation of his merry painted chaos has survived more than three centuries."""
salle = 5
mur = "nord"
place = 2
largeur = 1.63

[[oeuvres]]
titre = "The Courtyard of a House in Delft"
artiste = "Pieter de Hooch"
annee = "1658"
image = "cour-maison-delft.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Pieter_de_Hooch_-_The_Courtyard_of_a_House_in_Delft.jpg"
technique = "Oil on canvas, 73.5 × 60 cm"
collection = "National Gallery, London"
note = "A maidservant and a little girl in a paved courtyard, and, at the end of the passage, a woman looking at the street: the peace of a Delft house."
description = """
The painting is cut in two by a brick pillar. On the left, an arch with red and white voussoirs opens onto a passage that runs through the house; at the end, a woman in a black jacket and red skirt, seen from behind, looks at the street and the façades opposite. A red shutter stands open on the wall. Above the arch, a stone plaque bears an inscription dated 1614. On the right, in a small brick-paved courtyard, a maidservant in a white cap, a dish in her hand, goes down a step holding a little girl, who looks up at her. A trellis covers a wooden lean-to; a bucket and a broom lie on the paving. The sky is blue, barely cloudy."""
evocation = """
De Hooch makes a whole painting from a moment without a story: a clean courtyard, a child being guided, a woman looking outside. One reads in it the domestic virtues that Holland prized, order, cleanliness, education, and the central role of women in the household. The threshold between interior and street, between private and public, is at the heart of the composition. The plaque above the arch comes from the Saint Jerome convent in Delft; it invites the passer-by to patience and humility, for one must first go down to be raised up. This inscription has been seen as the moral key to the painting."""
histoire = """
De Hooch had lived in Delft since the early 1650s; he joined the city's Guild of Saint Luke in 1655. In 1658 he painted a series of sunlit courtyards and houses, in the same years as his contemporary Vermeer painted The Little Street: historians still debate who influenced whom. The plaque of 1614 did exist: it surmounted the entrance of the former convent. The painting belonged to the British statesman Robert Peel; the National Gallery acquired it in 1871 with part of his collection."""
facture = """
De Hooch builds his scene with an architect's rigour. The central pillar separates two spaces, and each opens onto another further away: the passage leads to the street, the courtyard to the lean-to. The lines of the bricks and paving follow an exact perspective. The afternoon light warms the reds and yellows of the brick, makes the whitewash gleam and cuts out sharp shadows. The figures, small, are integrated into the architecture without dominating it."""
details = [
  "The stone plaque above the arch, dated 1614.",
  "The initials P.D.H. and the date 1658, at the foot of the left-hand pillar.",
  "The woman seen from behind at the end of the passage, looking at the street.",
  "The broom and the wooden bucket resting on the paving.",
  "The trellis covering the lean-to, on the right.",
]
themes = ["everyday life", "delft", "house", "light", "perspective"]
anecdote = """
The Dutch have a word for these openings that lead from one room to another, then onto the street: doorkijkje, the view through. De Hooch made it his signature, to the point that the word almost always accompanies his name."""
salle = 5
mur = "ouest"
place = 2
largeur = 0.75

[[artistes]]
nom = "Carel Fabritius"
vie = "Middenbeemster (Holland), baptised 27 February 1622 – Delft, 12 October 1654"
biographie = """
The son of a schoolmaster of the Beemster, a polder north of Amsterdam, Carel Pietersz began by working as a carpenter: the Latin name Fabritius, which he adopted, is said to derive from faber, the craftsman. In the early 1640s, he entered Rembrandt's studio in Amsterdam, becoming one of his most gifted pupils. His young wife died in 1643; he returned for a time to his native village. Around 1650, he settled in Delft, remarried and in 1652 joined the Guild of Saint Luke. There he painted portraits, views of the city and trompe-l'oeil works, and took part in the renewal of Delft painting, alongside Pieter de Hooch and the young Vermeer. On 12 October 1654, the explosion of the city's gunpowder store destroyed his house; he died of his injuries at the age of thirty-two. A large part of his work has disappeared: fewer than fifteen paintings are attributed to him today."""
style = """
Trained by Rembrandt, Fabritius reverses his master's lesson: he places dark figures against light, luminous grounds. His brushwork is free, thick, and he is interested in perspective and optical illusions. His researches into daylight undoubtedly mattered for the Delft painters, starting with Vermeer, whom he has often been made the heir of."""

[[artistes]]
nom = "Jacob Jordaens"
vie = "Antwerp, 19 May 1593 – Antwerp, 18 October 1678"
biographie = """
The son of an Antwerp linen merchant, Jacob Jordaens trained with Adam van Noort, who was also one of Rubens's masters. Admitted as a master to the Guild of Saint Luke in 1615 as a painter in distemper, he married the following year Catharina, the daughter of his master. He never made the journey to Italy and knew Italian art through prints and through the paintings in Antwerp's collections. He collaborated with Rubens, notably on decorations and tapestry cartoons, and ran a very active studio. After the deaths of Rubens and Van Dyck, in 1640 and 1641, he became the city's leading painter. He worked for the Church as well as for foreign courts: around 1651–1652, he painted for the widow of the stadtholder Frederick Henry the great Triumph of the Prince, in the Orange Hall of the Huis ten Bosch palace in The Hague. In the 1650s, he converted to Calvinism. He died in 1678, and lies at Putte, just across the border, in a Protestant cemetery."""
style = """
Jordaens is the painter of a fleshy, joyful Flanders: robust figures pressed into the foreground, warm colours, golden light, rich brushwork. He learned Baroque momentum from Rubens, but his models are more popular, and his festivals, like The King Drinks or As the Old Sing, combine the brilliance of life with the morality of proverbs."""

[[artistes]]
nom = "Antoine van Dyck"
vie = "Antwerp, 22 March 1599 – London, 9 December 1641"
biographie = """
The son of a wealthy Antwerp silk merchant, Anthony van Dyck was a child prodigy: he began his apprenticeship at ten and was painting on his own by his teens. Around 1617–1620, he worked in Rubens's studio, who considered him his best collaborator. In 1620, he made a first stay in London, then left for Italy, where he remained from 1621 to 1627: there he studied Titian and painted, in Genoa, portraits of the aristocracy. Back in Antwerp, he became painter to the Infanta Isabella, governess of the Spanish Netherlands, and painted large altarpieces. In 1632, Charles I summoned him to London, knighted him and gave him the title of principal painter to His Majesty. There he painted the king, Queen Henrietta Maria, their children and the entire court. Around 1640, he married Mary Ruthven, lady-in-waiting to the queen. Exhausted and ill, he died in London in 1641, a few days after the birth of his daughter, and was buried in old Saint Paul's Cathedral."""
style = """
Van Dyck invented the modern aristocratic portrait: slender figures, natural and elegant poses, fine hands, shimmering silk fabrics, landscape or column backgrounds. He gives his sitters a dignity without stiffness. The English portraitists of the eighteenth century, Gainsborough and Reynolds foremost, claimed him as their model."""

[[artistes]]
nom = "Clara Peeters"
vie = "Antwerp (?), c. 1588 – after 1621"
biographie = """
Almost nothing is known of Clara Peeters's life, other than what her paintings say. She was probably born in Antwerp around 1588; the city's archives mention several women of this name, without it being possible to know which is the painter. Her first dated paintings, of 1607 and 1608, when she was not yet twenty, are still lifes of meals and flowers, among the earliest of the genre in Europe. She painted tables laden with fish, game, cheeses, pastries and goldsmith's cups, with exceptional precision. Her trail goes cold in the early 1620s, after her last known dated painting. A few dozen paintings are attributed to her today, including several in the Prado Museum in Madrid, which entered the Spanish royal collections as early as the seventeenth century. She often signed her works, and slipped her own reflection into several of them."""
style = """
Clara Peeters arranges her objects on a table seen from slightly above, against a dark background, each clearly distinct from the others. Her meticulous brushwork renders materials with striking truth: cheese rind, fish scales, embossed metal, glass. She helped to found the meal still life, which the Haarlem painters later developed."""

[[artistes]]
nom = "Pieter Claesz"
vie = "Berchem (near Antwerp), c. 1597 – Haarlem, buried 1 January 1661"
biographie = """
Pieter Claesz was born around 1597 in Berchem, near Antwerp, in the Spanish Netherlands. Nothing is known of his training, but his first works recall the Flemish still lifes of Clara Peeters or Osias Beert. In the early 1620s, he settled in Haarlem, in Holland, where he spent the rest of his life. There he became, with Willem Claesz Heda, the master of the so-called monochrome still life: a few ordinary objects, a jug, a glass, a herring, a loaf of bread, set on a tablecloth in a grey light. He also painted vanitas pictures, particularly around 1630. Very productive, he sold his paintings to a bourgeois clientele. His son, Nicolaes Berchem, would become one of the most famous landscape painters of his time. Pieter Claesz died in Haarlem at the end of 1660 and was buried on 1 January 1661."""
style = """
Claesz reduces the still life to the essential: few objects, a palette of browns, greys and ochres, a soft light coming from the window. This tonal style, which unifies the scene in a single atmosphere, breaks with the colourful accumulation of the Flemish. It gives the humblest objects a grave and silent presence."""

[[artistes]]
nom = "Willem Claesz Heda"
vie = "Haarlem, c. 1594 – Haarlem, c. 1680"
biographie = """
Willem Claesz Heda was born in Haarlem around 1594 and spent his entire life there. His first known works, in the early 1620s, are vanitas pictures; he then specialised in laid tables, called banketjes, little banquets, or ontbijtjes, little breakfasts. As early as 1628, the historian Samuel Ampzing cited him among the painters who did honour to the city. With Pieter Claesz, he brought to perfection the monochrome still life of the 1630s: a white tablecloth, silverware, glasses, oysters and a lemon, in a silvery light. A respected member of the Guild of Saint Luke, of which he was several times one of the officers, he trained pupils, including his son Gerrit Willemsz Heda, who painted in his manner. Around 1640, his compositions became larger and richer. He died in Haarlem around 1680, at a very advanced age."""
style = """
Heda is the painter of reflections: pewter, silver, gold and glass, rendered with incomparable delicacy in an almost monochrome range of greys and whites. His disordered tables, where a cup is overturned and a lemon half peeled, give the impression of a suspended meal. His elegant sobriety has made him one of the masters of European still life."""

[[artistes]]
nom = "Jan Davidsz de Heem"
vie = "Utrecht, 1606 – Antwerp, 1683 or 1684"
biographie = """
Jan Davidsz de Heem was born in Utrecht in 1606, the son of a musician. He probably trained in his native city, in the circle of the flower painter Balthasar van der Ast. In the mid-1620s, he settled in Leiden, where he painted still lifes of books and vanitas pictures in muted tones. Around 1635–1636, he left for Antwerp and became a citizen there: according to the biographer Joachim von Sandrart, he chose the city because rare fruits and the finest objects were to be found there in abundance. In contact with Flemish painting, his palette brightened and his compositions became sumptuous: great table displays, garlands and bouquets. He returned to Utrecht in the late 1660s, but the French invasion of 1672 brought him back to Antwerp, where he died in 1683 or 1684. His sons, including Cornelis de Heem, and many pupils continued his manner."""
style = """
De Heem unites Dutch precision with Flemish splendour. His bouquets and sumptuous tables, rich in dazzling colours against a dark ground, are composed with a Baroque sense of movement. He was the model for flower painters of the late seventeenth and eighteenth centuries, in Flanders as in Holland."""

[[artistes]]
nom = "Adriaen Coorte"
vie = "Middelburg (?), c. 1665 – Middelburg (?), after 1707"
biographie = """
Neither the date of birth nor the date of death of Adriaen Coorte is known; he was probably born in or near Middelburg around 1665. Around 1680, he seems to have learned his craft in Amsterdam with Melchior d'Hondecoeter, the bird painter, a few of whose motifs are found in his early works. Back in Middelburg, in Zeeland, he worked there for the rest of his life. The archives mention him in 1695, when the Guild of Saint Luke fined him. He painted almost exclusively small pictures, often in oil on paper later glued to wood: a few strawberries, asparagus, currants, shells, medlars, on a stone ledge. His signed works run from 1683 to 1707; about eighty have been catalogued. Forgotten for nearly two and a half centuries, he was rediscovered from 1952 by the historian Laurens J. Bol, who organised an exhibition in Dordrecht in 1958 and then published his catalogue in 1977."""
style = """
Coorte is the poet of the minimal still life: a few fruits or vegetables, a stone ledge, a dark background and a light coming from above. His small formats, of an almost abstract simplicity, give off a meditative silence. Rediscovered in the twentieth century, they have been compared to modern painting for their austerity."""

[[artistes]]
nom = "Jacob van Ruisdael"
vie = "Haarlem, 1628 or 1629 – Amsterdam, March 1682"
biographie = """
Jacob van Ruisdael was born in Haarlem in 1628 or 1629. His father, Isaack, was a frame-maker and picture dealer, and his uncle, Salomon van Ruysdael, was one of the city's great landscape painters; it was probably with them that he trained. From the age of eighteen, he signed landscapes of astonishing maturity. He joined the Haarlem Guild of Saint Luke in 1648. In the early 1650s, he travelled towards the German border, where he discovered wooded hills and watermills. Around 1656, he settled in Amsterdam, where he spent the rest of his life. There he painted forests, waterfalls inspired by Scandinavia, beaches, views of Haarlem and windmills. He trained a few pupils, including Meindert Hobbema. He never married. He died in Amsterdam in 1682 and was buried in the church of Saint Bavo in Haarlem, his native city."""
style = """
Ruisdael is the greatest Dutch landscape painter. His immense skies, tormented trees, mills and waterfalls give nature a dramatic and often melancholy grandeur. His solid compositions, contrasts of light and sober palette fed Romantic landscape, from Constable to Caspar David Friedrich."""

[[artistes]]
nom = "Meindert Hobbema"
vie = "Amsterdam, baptised 31 October 1638 – Amsterdam, 7 December 1709"
biographie = """
Born in Amsterdam in 1638, Meindert Lubbertsz took the name Hobbema in his youth. Around 1657, he entered the studio of Jacob van Ruisdael, who would later declare that Hobbema had served him and learned from him for a few years: he is his only known pupil. His first works take up his master's subjects, undergrowth, paths, watermills, in a lighter light. During the 1660s, he painted his best forest and farm paintings, much appreciated by Amsterdam connoisseurs. In 1668, he married Eeltje Vinck, a cook in the service of an Amsterdam burgomaster; Ruisdael was a witness at the wedding. The same year, he obtained a post at the city's excise office, which he kept until his death, and from then on he painted much less. He died poor in Amsterdam in 1709, and was buried in a pauper's grave."""
style = """
Hobbema paints peaceful, sunlit landscapes: forest paths, watermills, farms at the edge of the woods, where light filters through the foliage. Less dramatic than Ruisdael, he prefers harmony and clarity. His Avenue at Middelharnis, with its rigorous perspective, is one of the most famous images of the Dutch countryside."""

[[artistes]]
nom = "Frans Hals"
vie = "Antwerp, c. 1582–1583 – Haarlem, buried 1 September 1666"
biographie = """
Frans Hals was born in Antwerp around 1582–1583, into a family of cloth merchants. After the city was taken by the Spanish in 1585, his parents settled in Haarlem, in Holland. He trained there, perhaps with Karel van Mander, and joined the Guild of Saint Luke in 1610. In 1616, his large group portrait of the officers of the Saint George civic guard made him famous. From then on he painted the notables of Haarlem, the civic guards, but also popular figures, drinkers, musicians, laughing children. Married twice, father of many children, he was often in debt. In his old age, the city paid him a pension. Around 1664, more than eighty years old, he painted the regents and regentesses of the Haarlem old men's almshouse, masterpieces of striking sobriety. He died in 1666. Forgotten in the eighteenth century, he was rediscovered in the nineteenth; his former almshouse now houses the Frans Hals Museum."""
style = """
Hals is the painter of the instant: his sitters laugh, speak, turn round, caught by a rapid, visible brushstroke, laid down without retouching. His blacks, his whites and his sober harmonies fascinated nineteenth-century painters, from Courbet to Manet and Van Gogh, who saw in him a precursor of modern painting."""

[[artistes]]
nom = "Jan Steen"
vie = "Leiden, c. 1626 – Leiden, buried 3 February 1679"
biographie = """
The son of a Catholic brewer of Leiden, Jan Steen was born around 1626. He enrolled at the city's university in 1646, then trained in painting, according to early sources with Nicolaus Knüpfer in Utrecht, Adriaen van Ostade in Haarlem and Jan van Goyen in The Hague. In 1648, he was one of the founders of the Leiden Guild of Saint Luke. The following year, he married Margriet van Goyen, the daughter of his master. He led an itinerant life: The Hague, Delft, where he rented a brewery, Warmond, then Haarlem from 1661 to 1670. Back in Leiden, he obtained permission in 1672 to open an inn. A widower, he remarried in 1673. Very productive, he painted tavern scenes, family feasts, doctors at the bedside of young women, and biblical and mythological subjects. He died in Leiden in 1679. His reputation as a jolly drinker, fed by his own paintings, is largely a legend."""
style = """
Steen is the great storyteller of Dutch painting. His lively scenes, peopled with expressive figures, often illustrate proverbs and mix comedy and morality, in the manner of the theatre. He readily puts himself in the picture. His technique, inherited from the fine painting of Leiden, can also be broad and rapid."""

[[artistes]]
nom = "Pieter de Hooch"
vie = "Rotterdam, baptised 20 December 1629 – Amsterdam, buried 24 March 1684"
biographie = """
The son of a mason and a midwife, Pieter de Hooch was born in Rotterdam in 1629. He trained in Haarlem, according to an early biographer with the landscape painter Nicolaes Berchem. In 1652 he was in Delft, where he also worked as a servant to a rich linen merchant, who owned several of his paintings. He married Jannetje van der Burch in 1654 and joined the Delft Guild of Saint Luke the following year. It was there, between about 1655 and 1660, that he painted his masterpieces: courtyards, interiors bathed in light, mothers and maidservants at work, in the same milieu as Vermeer. Around 1660–1661, he settled in Amsterdam, where his painting became more luxurious, with patrician interiors and elegant figures. His last years are poorly known: he died in 1684 in the Amsterdam madhouse. In the nineteenth century, several paintings by Vermeer were sold under his name, a sign of the closeness of their two arts."""
style = """
De Hooch is the painter of the Dutch house: paved courtyards, vestibules, rooms in enfilade that open onto one another. His rigorous perspective, warm light and calm figures give domestic life an exemplary serenity. He shares with Vermeer a taste for daylight."""
