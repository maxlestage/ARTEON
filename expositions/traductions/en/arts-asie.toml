[exposition]
ordre = 25
nom_court = "Arts of Asia"
mouvement = "Chinese, Persian and Mughal painting"
cadre = "estampe"
couleur = "#9a3324"
titre = "Mountains, Gardens and Emperors: The Painting of Asia"
artiste = "Fan Kuan, Guo Xi, Zhao Mengfu, Behzad, Reza Abbasi, Bichitr…"
dates = "c. 1000–1630"
accroche = "Virtual exhibition · Musée Guimet, Paris"
introduction = """
Six centuries of Asian painting, from Song China to the India of the Great Mughals. In China, landscapes in ink on silk or paper, painted on scrolls that are unrolled and contemplated as one might travel. In Iran and India, miniatures from manuscripts and albums, in the colors of precious stones, made for learned princes. The building is inspired by the Musée Guimet in Paris, founded by Émile Guimet and opened in 1889: a vestibule, the tall rotunda of the library, then galleries each devoted to a single country."""
vitrine = "voyageurs-monts-ruisseaux.jpg"

[musee]
nom = "Musée Guimet"
ville = "Paris, France"
construction = "opened in 1889"
presentation = """
A Lyon industrialist passionate about the religions of Asia, Émile Guimet brought back from a journey around the world in 1876 hundreds of objects and books from Japan, China and India. He opened a first museum in Lyon in 1879, then gave his collections to the State and had a museum built in Paris, on the place d'Iéna, which opened in 1889. At the corner, the façade curves into a rotunda, at the top of which the circular library keeps the decoration chosen by the founder. In 1945 the museum became the department of Asian arts of the national museums: it received the Asian collections of the Louvre and ceded its Egyptian antiquities to it. Renovated from 1996 to 2001 by the architects Henri and Bruno Gaudin, who let light flood in, it now presents one of the largest collections of Asian art outside Asia, from Afghanistan to Japan: Khmer sculpture, Chinese bronzes and paintings, and the arts of India and the Himalayas."""
ici = """
The ARTEON building keeps the layout of the Paris museum: a vestibule, then a tall central hall that evokes the rotunda of the library, here square in plan. Visitors enter from the south into the Iéna vestibule, then into “The Rotunda · The Great Song Landscapes”, ten meters high. It opens onto three lower galleries, six meters high: to the west the China Gallery · Yuan and Ming, to the east the Iran Gallery · Herat, Tabriz, Isfahan, and to the north, on the central axis, the India Gallery · The Great Mughals. The walls range from off-white to golden beige."""

