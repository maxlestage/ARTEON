[[oeuvres]]
titre = "Travelers among Mountains and Streams"
artiste = "Fan Kuan"
annee = "c. 1000"
image = "voyageurs-monts-ruisseaux.jpg"
technique = "Hanging scroll, ink and light colors on silk, 206.3 × 103.3 cm"
collection = "National Palace Museum, Taipei"
note = "An immense, almost vertical mountain towers over a tiny caravan of mules: the founding image of the great Chinese landscape."
description = """
The scroll, more than two meters high, is read from bottom to top. In the foreground, large rounded rocks bar the way. Just above, a hill covered with gnarled trees spans the width of the painting; at the right, at the foot of the trees, a small caravan of laden mules advances along a path, led by two men, and the roofs of a temple can be glimpsed among the foliage. Then comes a band of pale mist, like an emptiness. Beyond it rises the main mountain, an enormous frontal wall that fills the upper two thirds of the scroll, crowned with dark bushes. On its right flank, a waterfall falls in a thin white thread, almost invisible against the mass of rock."""
evocation = """
Everything is designed to make the viewer feel tiny: the travelers measure only a few centimeters before a mountain that seems to rise up directly in front of him. It has been seen as the expression of a world order dear to the scholars of the Northern Song, in which everything has its place, from the stone to the summit, and in which man is only a part of a whole that exceeds him. The central mountain, surrounded by lower hills, has often been compared to a sovereign surrounded by his ministers. Tradition holds that Fan Kuan gave up imitating the masters to take nature, and then his own heart, as his models: the painting thus passes for the very image of a painting born of the direct contemplation of mountains."""
histoire = """
Fan Kuan lived at the turn of the year 1000, under the Northern Song dynasty, withdrawn into the mountains of Shaanxi, near the former capital Chang'an. The scroll is undated and it is not known for whom it was painted. It passed through many collections before entering that of the Qing. In the 20th century it followed the long exile of the treasures of the imperial palace in Beijing, packed into crates in 1933 to escape the Japanese army, moved across China during the war, then shipped to Taiwan in 1948–1949. It is today one of the jewels of the National Palace Museum in Taipei, which, to protect it from light, displays it only for a few weeks, several years apart."""
facture = """
The rock is built up from a multitude of small vertical touches, as dense as raindrops: Chinese historians speak of “raindrop texture strokes”, a manner associated with the name of Fan Kuan. They convey the grain and mass of the stone better than any outline. The ink, laid down in layers on silk now darkened, ranges from pale gray to the deep black of the foliage. The composition, frontal and symmetrical, superimposes three planes separated by mist, without a single perspective: the eye climbs, plane after plane, to the summit."""
details = [
  "The caravan of mules and their two drivers, at the lower right.",
  "The roofs of a temple peeking out between the trees, to the right of the hill.",
  "The waterfall, a simple white line on the right flank of the great wall of rock.",
  "The band of mist at the foot of the mountain, which creates an emptiness between the planes.",
  "The thousands of small vertical touches that form the rock.",
]
themes = ["mountain", "landscape", "journey", "nature", "Northern Song"]
anecdote = """
The painter's signature remained hidden for nearly a thousand years. It was only in 1958 that a researcher at the museum, Li Lin-ts'an, discovered the two characters of his name, Fan Kuan, concealed in the foliage at the lower right, very close to the travelers."""
salle = 2
mur = "nord"
place = 1
largeur = 1.05

[[oeuvres]]
titre = "Early Spring"
artiste = "Guo Xi"
annee = "1072"
image = "debut-du-printemps.jpg"
technique = "Hanging scroll, ink and light colors on silk, 158.3 × 108.1 cm"
collection = "National Palace Museum, Taipei"
note = "Signed and dated by the court painter of the Emperor Shenzong: the mountain awakens in the mist, still bare, at the first breath of spring."
description = """
A mountain rises, undulating, at the center of the scroll, like a column of petrified clouds. Its soft-shaped rocks coil around one another and fade into the mist that rises from the valleys. In the foreground, on rounded boulders, still leafless trees twist their branches. Small scenes are hidden everywhere: at the lower left, fishermen in a moored boat; at the lower right, a family disembarking on the bank; higher up, at the right, the roofs of a temple or pavilion nestled in a hollow, and waterfalls tumbling down the slope. At the left, the eye escapes toward a distant valley. At the upper right, a poem was added much later."""
evocation = """
The painting captures a precise moment: the end of winter, when life returns, the mist lifts and people resume their activities. Guo Xi left reflections on his art, gathered by his son into a treatise, the Lofty Message of Forests and Streams: in it he explains that a good landscape should allow the official kept in the city to travel in it, to contemplate it, to wander in it and to dwell in it in spirit. This mountain has also been read as a political image: a dominant peak, surrounded by orderly summits, in the manner of the emperor surrounded by his court, at the time when the Emperor Shenzong was launching great reforms."""
histoire = """
Guo Xi was summoned to court around 1068 by the young Emperor Shenzong, who admired his talent so much that he entrusted him with the decoration of many walls and screens in the palace. The scroll bears, on its left edge, a short inscription by the painter: the title and the date, the renzi year, which corresponds to 1072. After Shenzong's death in 1085, court taste changed and his paintings were taken down. Early Spring nevertheless passed into the imperial collections; in the 18th century the Emperor Qianlong had a poem in his own hand inscribed on it, at the upper right. With the treasures of the Forbidden City, it reached Taiwan in 1948–1949."""
facture = """
Guo Xi brings together in a single image the “three distances” that he describes in his treatise: the high distance, when one raises one's eyes toward the summit, the deep distance, when one plunges into the valleys, and the level distance, when the gaze runs off to the horizon. The rocks are modeled with graded ink washes and curling strokes that give them the appearance of clouds. The branches of the trees, hooked like crab claws, come from the tradition of the painter Li Cheng. A few touches of light color enliven the silk."""
details = [
  "The painter's short inscription, with the title and the date, on the left edge.",
  "The fishermen in their moored boat, at the lower left.",
  "The family arriving on the bank, at the lower right.",
  "The hooked branches of the bare trees, in the foreground.",
  "The poem of the Emperor Qianlong and his seal, at the upper right.",
]
themes = ["spring", "mountain", "mist", "imperial court", "Northern Song"]
anecdote = """
According to the critic Deng Chun, in the 12th century Guo Xi's paintings fell so thoroughly out of favor after Shenzong's death that they were seen being used as rags to wipe the palace tables. Deng Chun's father then obtained from the emperor the right to collect them."""
salle = 2
mur = "nord"
place = 4
largeur = 1.1

[[oeuvres]]
titre = "Autumn Colors on the Qiao and Hua Mountains"
artiste = "Zhao Mengfu"
annee = "1295"
image = "couleurs-automne-qiao-hua.jpg"
technique = "Handscroll, ink and colors on paper, 28.4 × 93.2 cm"
collection = "National Palace Museum, Taipei"
note = "Painted for a friend who had never seen the land of his ancestors: two mountains of Shandong amid the marshes, in autumn."
description = """
The horizontal scroll unrolls from right to left, as one reads Chinese text. A vast wet plain, covered with reeds and marshes, stretches beneath a pale sky. At the right stands a blue peak shaped like a sharp triangle: Mount Hua. At the left, a low, rounded mountain of dark blue-green, almost loaf-shaped: Mount Que, or Qiao. Between the two, clumps of trees with red and yellow leaves, willows, a few low houses, a small flock. At the lower left, fishermen cast their nets from boats. The sky is crowded with inscriptions and red seals, added by successive collectors."""
evocation = """
The painting is a gift of friendship and an object of memory. Its recipient, the scholar Zhou Mi, descended from a family of Shandong, but he lived in the South and had never seen the region of his ancestors. Zhao Mengfu, who had just served there as an official, painted this landscape for him in order to describe it to him. It has also been seen as a manifesto: under Mongol rule, Zhao deliberately returns to the manner of the ancient painters, those of the Tang and the Five Dynasties, and thus asserts the continuity of Chinese culture. The calm of the landscape, with neither drama nor overwhelming mountain, expresses the ideal of a retired, simple and scholarly life."""
histoire = """
Zhao Mengfu, a descendant of the imperial family of the Song, had agreed to serve the new Mongol dynasty of the Yuan, which some of his contemporaries held against him. Appointed in the region of Jinan, in Shandong, he returned to the South in 1295 and painted this scroll for Zhou Mi. His own inscription, at the center left, tells this story and dates the work to the twelfth month of the first year of the Yuanzhen era, at the end of 1295. The scroll then passed from collection to collection, each owner affixing his seal to it, before entering the imperial palace. The Emperor Qianlong covered it with his poems and his seals. It is today preserved in Taipei."""
facture = """
Zhao Mengfu chooses an apparent naivety: the trees are almost larger than the houses, the plain is seen from above without real depth, the mountains are set down like objects. This archaizing style imitates the old masters, notably Dong Yuan, whose long, supple strokes, like hemp fibers, he takes up. The mineral blue of the two peaks recalls the “blue-and-green” painting of the Tang. For Zhao, painting and calligraphy are the work of the same brush: each trunk, each reed is a stroke of writing, laid down in almost dry ink on the paper."""
details = [
  "At the right, the triangular peak of Mount Hua; at the left, the rounded mass of Mount Qiao.",
  "The fishermen and their nets, in the boats, at the lower left.",
  "The red and yellow autumn leaves among the trees of the plain.",
  "Zhao Mengfu's inscription, left of center, which tells the genesis of the painting.",
  "The dozens of red seals of the collectors, including those of the Emperor Qianlong.",
]
themes = ["landscape", "autumn", "friendship", "scholars", "Yuan dynasty"]
anecdote = """
In the spring of 1748, the Emperor Qianlong, then traveling in Shandong, the region painted by Zhao Mengfu, added to the scroll a poem devoted to Mount Qiao, dated to that season: it is inscribed at the upper left, above the rounded mountain."""
salle = 3
mur = "ouest"
position = 0
largeur = 2.0

[[oeuvres]]
titre = "Lofty Mount Lu"
artiste = "Shen Zhou"
annee = "1467"
image = "mont-lu.jpg"
technique = "Hanging scroll, ink and light colors on paper, 193.8 × 98.1 cm"
collection = "National Palace Museum, Taipei"
note = "Offered by Shen Zhou to his teacher Chen Kuan for his seventieth birthday: a mountain he had never seen, an image of the old scholar's virtue."
description = """
The mountains pile up to the top of the scroll, which is nearly two meters high. At the left, a long white waterfall falls in stages along a cliff, near a wooden footbridge clinging to the rock face, then loses itself in a torrent that winds to the bottom of the painting. At the right, in the foreground, tall pines with twisted trunks cling to the rocks. At the very bottom, tiny, a scholar in a pale robe stands on a ledge of rock and gazes at the waterfall. At the upper right, rocky pinnacles emerge from the clouds. The title, three large characters, and a long poem in the painter's own hand fill the sky at the upper right."""
evocation = """
Mount Lu, in Jiangxi province, is one of the most famous mountains of China, sung by poets for centuries. Shen Zhou associates it with his teacher Chen Kuan, whose family came from this region: in his poem, the height of the mountain becomes the image of the old man's moral greatness. The painting is therefore not a view but a tribute, and the small figure at the foot of the waterfall has sometimes been interpreted as the teacher himself, or as the disciple who contemplates him. It expresses the ideal of the scholar-painters: to paint a landscape in order to express a thought, a friendship, an admiration."""
histoire = """
In 1467, Shen Zhou was forty. He lived near Suzhou, the great scholarly city of the lower Yangzi, and had never held an official post. For the seventieth birthday of Chen Kuan, his former teacher, he painted this large-format scroll, the most ambitious of his early career, and inscribed on it a poem composed for the occasion. Shen Zhou would go on to become the founder of the Wu school, which dominated scholarly painting in the Suzhou region for more than a century. The scroll later entered the imperial collections of the Qing, then reached Taiwan with the palace treasures. It is preserved in the National Palace Museum in Taipei."""
facture = """
Shen Zhou pays homage to the painter Wang Meng, one of the great masters of the Yuan, whose dense composition, without voids, and countless small curling strokes, which give the rocks a quivering texture, he takes up. The brush is meticulous, almost nervous, far from the broad and rapid manner of his later works. Ink dominates, enhanced with light tints of ochre and pale blue. The zigzag composition leads the eye from the torrent to the waterfall, then up to the summits, where the calligraphy of the poem extends the painting."""
details = [
  "The tiny scholar standing at the foot of the waterfall, at the very bottom.",
  "The long waterfall that falls in stages, at the left.",
  "The wooden footbridge clinging to the cliff, near the waterfall.",
  "The tall pines with twisted trunks, at the lower right.",
  "The title in three large characters and the long poem, at the upper right.",
]
themes = ["mountain", "tribute", "waterfall", "scholars", "Ming dynasty"]
anecdote = """
Shen Zhou never went to Mount Lu. He composed this mountain from memory and imagination, from the poems that celebrate it and from the style of Wang Meng: for a scholar-painter, the truth of a landscape lay in its meaning more than in its likeness."""
salle = 3
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "The Seduction of Yusuf"
artiste = "Behzad"
annee = "1488"
image = "yusuf-et-zuleykha.jpg"
technique = "Pigments, ink and gold on paper, page from a manuscript of Saadi's Bustan"
collection = "National Library of Egypt (Dar al-Kutub), Cairo"
note = "In a palace with locked doors, the handsome Yusuf escapes from Zuleykha: a dizzying architecture, painted in Herat for Sultan Husayn Bayqara."
description = """
A palace is shown in cross-section, like a dollhouse: one sees at once its façades, its staircases and its rooms. At the left, a staircase of red wood climbs in a zigzag from one floor to the next. Everywhere, walls covered with blue, turquoise and white ceramic tiles, closed doors, latticed windows, niches. At the very top, in the central room, a young man in a green robe, his head surrounded by a nimbus of golden flames, tears himself away from a woman in red who tries to hold him back by his garment. Panels of calligraphed poetry are set into the décor. The palace overflows the frame: a domed pavilion and a red balcony project into the gold-flecked margin."""
evocation = """
The story comes from the Qur'an and the Bible: Yusuf, the Joseph of Genesis, is desired by Zuleykha, the wife of his Egyptian master. The poet Saadi tells it in the Bustan, and Jami, a contemporary of Behzad, had developed it shortly before: Zuleykha has a palace built with seven chambers, each of whose doors she locks, but the doors open before Yusuf as he flees. In Sufi culture, the tale has a spiritual meaning: Yusuf is the soul that resists desire, and divine grace opens the doors of the trap. The labyrinth of closed rooms, with no apparent way out, has often been read as an image of the world and its temptations."""
histoire = """
The page belongs to a manuscript of the Bustan, “the Orchard”, a collection of moral tales composed by Saadi in 1257. It was copied and illustrated in 1488 in Herat, in present-day Afghanistan, then the brilliant capital of the last Timurid princes, for the library of Sultan Husayn Bayqara, whose portrait adorns the double frontispiece. The painter Behzad, then at the height of his maturity, signed several paintings in it, including this one, which are among the few works that historians attribute to him with certainty. The manuscript, one of the most important of Persian painting, is today preserved in Cairo, in the National Library of Egypt."""
facture = """
Behzad uses the most precious colors of his time: lapis lazuli blue, malachite green, vermilion and gold. The tile patterns, geometric interlace and floral arabesques, faithfully reproduce the decoration of Timurid architecture. The perspective has no vanishing point: each room is seen from the angle that shows it best, and the planes fit together like drawers. The diagonals of the staircase and of Yusuf's body give movement to an otherwise motionless image. The small figures are distinguished by their expressive gestures."""
details = [
  "The nimbus of golden flames that surrounds Yusuf's head.",
  "Zuleykha, in red, gripping the young man's garment.",
  "The red wooden staircase that climbs in a zigzag, at the left.",
  "The red balcony and the domed pavilion that overflow the frame.",
  "The calligraphed verses, set into the walls like real inscriptions.",
]
themes = ["temptation", "architecture", "poetry", "Sufism", "Herat"]
anecdote = """
Babur, the founder of the Mughal empire, passed judgment on Behzad in his memoirs: he praises the great delicacy of his work, but finds that he was poor at beardless faces, to which he gave an overly long double chin, whereas his bearded faces were admirable."""
salle = 4
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "The Court of Gayumars"
artiste = "Sultan Muhammad"
annee = "c. 1522–1525"
image = "cour-de-gayumars.jpg"
technique = "Pigments, ink and gold on paper, page from the Shahnameh of Shah Tahmasp"
collection = "Aga Khan Museum, Toronto"
note = "The first king of the world, clad in leopard skins, rules over men and beasts: the most famous page of the Shahnameh of Shah Tahmasp."
description = """
At the center of the page, on a rock shaped like a throne, King Gayumars sits cross-legged, clad in leopard skins. Around him, the mountains form an amphitheater of rocks in unreal colors, pink, mauve, blue, turquoise, ochre, from which a waterfall gushes. The two figures who flank him, standing at the left and kneeling at the right, are identified as his son Siyamak and his grandson Hushang. On the slopes, dozens of courtiers, also clothed in animal skins, form a circle. Lions, leopards, deer and foxes mingle with the men without fear. The sky is gold, crossed by Chinese-style clouds. The verses of the poem frame the scene, and a tree escapes the frame toward the top of the margin."""
evocation = """
The Shahnameh, the “Book of Kings” completed by the poet Ferdowsi around the year 1010, tells the history of Iran from the creation of the world. Gayumars is its first king: he lives in the mountains, teaches men to clothe themselves in skins, and the animals come of their own accord to pay him homage. The page shows a golden age, a harmony between men, beasts and nature, just before tragedy: Siyamak will be killed by a demon. It has been seen as an ideal image of kingship, painted for the education of the young prince Tahmasp. The great specialist Stuart Cary Welch saw in it one of the summits of all Persian painting."""
histoire = """
The Shahnameh of Shah Tahmasp is the most ambitious manuscript of Persian painting: more than 250 paintings produced in Tabriz, in the royal workshop of the Safavids, beginning in the 1520s. Sultan Muhammad, head of the workshop, painted this page among the first. Around 1544, the chronicler Dust Muhammad cites it as a work before which the greatest painters bowed. In 1568, Shah Tahmasp presented the manuscript to the Ottoman sultan Selim II. Bought in the early 20th century by Baron Edmond de Rothschild, it was acquired in 1959 by the American collector Arthur Houghton, who dismembered it. The page now belongs to the Aga Khan Museum in Toronto, opened in 2014."""
facture = """
The page fuses two traditions: the visionary painting of Tabriz, with its tormented rocks and dazzling colors, and the refined precision of the Herat school, inherited from Behzad. The brush, sometimes reduced to a few hairs, traces hundreds of figures and animals, some of which measure only a few millimeters. The rocks, modeled in pastel gradations, seem made of sponge or coral. The sky is laid in gold leaf, and the margin is strewn with flecks of gold. A magnifying glass reveals details invisible to the naked eye."""
details = [
  "The human and animal faces hidden in the shapes of the rocks.",
  "Gayumars, seated cross-legged, clad in leopard skins.",
  "The lions and leopards lying quietly among the courtiers.",
  "The golden sky and its swirling Chinese-style clouds.",
  "The tree that escapes the frame, above the text.",
]
themes = ["myth", "kingship", "golden age", "animals", "epic"]
anecdote = """
In 1994, Iran exchanged a painting by Willem de Kooning, Woman III, held in the Tehran Museum of Contemporary Art, for the 118 remaining pages of the Shahnameh of Shah Tahmasp, which thus returned to Iran."""
salle = 4
mur = "est"
position = 0
largeur = 1.2

[[oeuvres]]
titre = "The Lovers"
artiste = "Reza Abbasi"
annee = "1630"
image = "deux-amants.jpg"
technique = "Pigments, ink and gold on paper, 18.1 × 11.9 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Signed and dated, an embrace painted in Isfahan late in the painter's life: a single leaf, made to be collected in an album."
description = """
Two young people sit entwined, so close that they form only a single mass. The first wears a brown coat lined with green and an orange scarf; the second, dressed in green, wears a blue headscarf. Their two round faces, cheek to cheek, almost resemble each other. Around them, the ochre ground is covered with vegetation painted in gold: tall grasses in plumes, foliage, stylized clouds at the top. On the ground, a wine bottle, a cup, scattered fruit and a dish of pomegranates. At the left, a few lines of writing give the date and the signature. A blue border ornamented with golden scrolls frames the scene."""
evocation = """
The image breathes the sensuality of the Safavid court of Isfahan in the early 17th century. The wine, the fruit and the embrace evoke Persian poetry, in which human love and intoxication are also, often, metaphors for divine love. Reza Abbasi deliberately lets an ambiguity hover: the two lovers resemble each other so closely that their identity has long been debated. The work also bears witness to a change of era: one no longer paints only manuscripts for the king, but single leaves, bought by courtiers and merchants for their albums, in which above all the hand of the artist is admired."""
histoire = """
Reza Abbasi was by then the most famous painter in Iran. He had served Shah Abbas I, who made Isfahan his capital and granted him the right to bear his name. The king died in 1629; the following year, Reza, by now an old man, signed and dated this page. The inscription, at the left, states that it was completed in the month of Shawwal of the year 1039 of the Hijra, that is, in the spring of 1630, and ends with his signature. Like many of these leaves, it was probably mounted in an album. It entered the Metropolitan Museum of Art in New York in 1950."""
facture = """
Line is Reza Abbasi's great strength: a calligraphic stroke that thickens and thins, curls into the folds of garments and gives the bodies their suppleness. The two figures fit into a compact form, almost a pyramid. The palette is restricted, brown, green, orange and blue, set on an ochre ground where the vegetation is drawn in gold, with a rapid brush. This style, elegant and nervous, was imitated by generations of painters in Isfahan."""
details = [
  "The wine bottle and the cup set on the ground, at the left.",
  "The inscription at the left, with the date and the painter's signature.",
  "The two faces cheek to cheek, almost identical.",
  "The grasses and foliage drawn in gold on the ochre ground.",
  "The dish of pomegranates and the fruit scattered at the bottom of the page.",
]
themes = ["love", "embrace", "wine", "Isfahan", "album"]
anecdote = """
The chronicler of Shah Abbas, Iskandar Beg Munshi, reproaches Reza Abbasi for having for a time neglected his art and the court to keep company with wrestlers and common people, adding that he had a difficult character. The painter nevertheless ended by returning to the king's service."""
salle = 4
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Jahangir Preferring a Sufi Shaykh to Kings"
artiste = "Bichitr"
annee = "c. 1615–1618"
image = "jahangir-cheikh-soufi.jpg"
technique = "Pigments, ink and gold on paper, 25.3 × 18.1 cm"
collection = "Freer Gallery of Art, Washington"
note = "Seated on an hourglass, the emperor hands a book to an old Sufi and ignores the Ottoman sultan and the king of England who wait at his feet."
description = """
The Emperor Jahangir, seated on a throne in the shape of an hourglass, is surrounded by an immense golden disk combining the sun and the crescent moon. He hands a book to an old man with a long white beard, a Sufi shaykh. Below him, in a line, wait an Ottoman sultan wearing a turban, King James I of England with his ruff and plumed hat, and, at the very bottom, a man in a red turban holding a small painting: the painter himself. At the foot of the hourglass, two little angels write on its base, while two others fly at the top of the page, one armed with a bow, the other with his face in his hands. A wide border of flowers frames the whole."""
evocation = """
The message is inscribed at the top and bottom of the image: though kings stand before him, the emperor turns his gaze toward the dervishes. Jahangir thus presents himself as a mystic sovereign, who prefers spiritual wisdom to earthly power. But it is also an image of propaganda: the name of Jahangir, “Nur al-Din”, means “light of the faith”, hence the solar halo. The hourglass recalls the flight of time, and the angels inscribe on it the wish that the emperor's life may last a thousand years. The two foreign sovereigns, relegated to the side, speak of the place Jahangir believed he held in the world."""
histoire = """
The page was painted around 1615–1618, when the court often stayed at Ajmer, near the shrine of the Sufi saint Muin al-Din Chishti, whom the emperor venerated; the old man is generally identified as Shaykh Husain, guardian of this shrine. It is also the period when the English ambassador Sir Thomas Roe was at court, from 1615 to 1619, and gave the emperor European portraits: that of James I served as a model. In the 18th century, the page was mounted in a large album assembled in Iran, known as the “Saint Petersburg Album”. The Freer Gallery of Art in Washington acquired it in 1942."""
facture = """
Bichitr takes the finish of the Mughal painters to perfection: each face is an individualized portrait, each jewel is rendered with a goldsmith's precision, and gold lights up the immense halo. He borrows from European art, discovered through the engravings and paintings brought by the Jesuits and the ambassadors, the modeling of the faces, the little angels and the portrait of the king of England. These foreign elements blend seamlessly with the blue arabesque carpet, the intense colors and the Persian floral border."""
details = [
  "The hourglass that serves as a throne, and the sand running through it.",
  "King James I of England, his white ruff and his jewels.",
  "Bichitr's self-portrait, in a red turban, at the lower left.",
  "The two cherubs writing on the base of the hourglass.",
  "At the top, the cherub with the bow and the one hiding his face.",
]
themes = ["power", "mysticism", "time", "portrait", "Mughal empire"]
anecdote = """
Sir Thomas Roe relates that he had presented Jahangir with an English miniature, convinced that no Indian painter could equal it. The emperor had copies made so faithful that the ambassador, by candlelight, had difficulty recognizing the original."""
salle = 5
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Jahangir's Dream"
artiste = "Abu'l Hasan"
annee = "c. 1618"
image = "jahangir-shah-abbas.jpg"
technique = "Pigments, ink and gold on paper, 23.8 × 15.4 cm"
collection = "Freer Gallery of Art, Washington"
note = "Standing on a lion, the Mughal emperor clasps in his arms the shah of Iran, standing on a lamb: a dream of Jahangir, put into images by his favorite painter."
description = """
Two sovereigns embrace, standing on a terrestrial globe on which continents can be recognized. At the right, taller, the Emperor Jahangir, in a green jacket and white turban; at the left, smaller, Shah Abbas, king of Iran, in a pink robe. Beneath their feet, a lion and a lamb lie side by side, peaceful. Behind them, an immense radiating golden disk, set on a crescent moon whose points are held by two winged cherub heads, stands out against a turquoise sky. Small inscriptions in Persian are scattered through the image. The whole is mounted on an album page framed with scrolls, flowers and birds."""
evocation = """
According to an inscription, the image illustrates a dream of Jahangir, in which Shah Abbas had appeared to him. Under the appearance of friendship, it is an image of domination: Jahangir is taller, it is he who welcomes, and his lion, image of strength, occupies a large part of the globe, even pushing the lamb toward the west. The lion lying beside the lamb also evokes the justice of the reign, so perfect that the strong no longer devour the weak. The two empires were then contesting the city of Kandahar, in present-day Afghanistan: some have seen in it Jahangir's wish to settle this rivalry, at least in a dream."""
histoire = """
The page was painted around 1618 by Abu'l Hasan, whom Jahangir had honored with the title “Nadir al-Zaman”, the wonder of the age. It is part of a series of allegorical images that the emperor commissioned in the late 1610s to express his vision of power. After the sack of Delhi by the king of Iran Nadir Shah in 1739, many Mughal paintings left for Iran; this one was mounted in the 18th century, with its flowered border, in the album known as the “Saint Petersburg Album”. The Freer Gallery of Art in Washington acquired it in 1945."""
facture = """
Abu'l Hasan combines the precision of Mughal portraiture, attentive to the features of each face, with motifs from Europe: the terrestrial globe copied from European maps and globes, the cherub heads, the modeling of the bodies. The great golden disk, finely striated with rays, gives the image its brilliance. The colors are clear and frank, green, pink, turquoise, against which the two figures stand out. The border, with its flowers and birds, was added later."""
details = [
  "The lion and the lamb lying side by side on the globe.",
  "The map of the globe, with its continents and seas.",
  "The two winged cherub heads at the points of the crescent moon.",
  "The difference in size between Jahangir and Shah Abbas.",
  "The birds hidden in the flowered border.",
]
themes = ["power", "dream", "diplomacy", "symbol", "Mughal empire"]
anecdote = """
The two sovereigns never met. The painted embrace changed nothing in their rivalry: in 1622, barely four years after this image, Shah Abbas seized Kandahar, which the Mughals would manage to retake only briefly."""
salle = 5
mur = "nord"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Jahangir Visiting the Ascetic Jadrup"
artiste = "Govardhan"
annee = "c. 1616–1620"
image = "jahangir-jadrup.jpg"
technique = "Pigments, ink and gold on paper, album page (attributed to Govardhan)"
collection = "Musée Guimet, Paris"
note = "Leaving his retinue and his horse at the foot of the hill, the emperor sits humbly before the cave of a Hindu ascetic."
description = """
The page is divided in two. At the top, on a hill, before the dark, narrow entrance of a cave, two men sit facing each other. At the left, the ascetic Jadrup, extremely thin, almost naked, wearing only a loincloth, speaks with raised hands. At the right, the Emperor Jahangir, haloed, in white garments and an orange turban, listens to him. Behind, trees and, in the distance, a bluish city. In the middle of the page, an expanse of bare earth separates the two worlds. At the bottom, the imperial retinue waits: dozens of courtiers in turbans, each with a distinct face, a gray horse adorned with a golden saddle cloth, a parasol and a standard. A border of vines and birds frames the scene."""
evocation = """
Jahangir, a Muslim, takes an interest, like his father Akbar, in the wisdoms of India. In his memoirs, he recounts his conversations with Jadrup, a Hindu ascetic whom he admires for his knowledge of the philosophical texts of the Vedanta. The painter translates this admiration into images: the emperor has left behind his horse, his arms and his courtiers, and sits directly on the ground, at the level of the holy man. The great void in the middle of the page marks the distance between the world of power and that of renunciation. It expresses the religious tolerance of the Mughal court, where common truths were sought among the different traditions."""
histoire = """
Jahangir met Jadrup around 1616–1617 near Ujjain, in central India, and visited him several times; he saw him again later at Mathura, where the ascetic had settled. He recorded these meetings in his memoirs, which he had illustrated by the painters of his workshop. This page is attributed to Govardhan, known for his portraits of holy men and ascetics. It now belongs to the Musée Guimet in Paris, which holds one of the most important collections of Indian painting in France; another version of the scene is in the Harvard Art Museums."""
facture = """
Govardhan excels in the rendering of bodies: Jadrup's emaciated torso, his protruding ribs and thin arms are modeled with an almost tactile softness. In the crowd, each face is a true portrait, in profile or three-quarter view, with its nuances of complexion. The distant city, blurred in a blue haze, shows the influence of European painting, known through engravings. Earth colors, ochre and sand, dominate; they set off the pale patch of the imperial garments."""
details = [
  "The narrow, dark entrance of the cave, between the two men.",
  "The emaciated body of the ascetic, his ribs visible.",
  "The emperor's gray horse and its golden saddle cloth.",
  "The parasol and the royal standard above the crowd.",
  "The distant city, blurred in a blue haze, at the right.",
]
themes = ["spirituality", "ascetic", "emperor", "tolerance", "Mughal empire"]
anecdote = """
In his memoirs, Jahangir describes Jadrup's retreat as a mere hole dug into the side of a hill, with an opening so narrow that one entered only with difficulty. The ascetic lived there alone, naked, and the emperor says he took great pleasure in their conversations."""
salle = 5
mur = "ouest"
place = 2
largeur = 1.0

[[artistes]]
nom = "Fan Kuan"
vie = "Huayuan (Shaanxi), active c. 990 – c. 1030"
biographie = """
Little is known about Fan Kuan, one of the greatest landscape painters in Chinese history. His real name was Fan Zhongzheng; “Kuan”, which means “broad” or “lenient”, is said to be a nickname linked to his easygoing character. A native of Huayuan, in Shaanxi province, he lived under the first emperors of the Northern Song dynasty. Early texts describe him as a simple man, fond of wine, drawn to Taoism and indifferent to honors. He is said to have first studied the painting of Li Cheng, then, according to tradition, decided that nature was a better teacher than men. He then withdrew to the Zhongnan and Taihua mountains, near the former capital Chang'an, where he spent his days observing rocks, clouds and light. As early as the 11th century, the critic Guo Ruoxu ranked him, with Li Cheng and Guan Tong, among the three great masters of landscape of his time. Very few works can be attributed to him with certainty: Travelers among Mountains and Streams is the only one on which there is unanimity. His dates of birth and death remain unknown; he was still alive in the early 11th century."""
style = """
Fan Kuan is the painter of the monumental mountain, frontal, overwhelming, seen as a world in itself. His rocks are built from innumerable small vertical touches that convey their density and grain. His compositions, symmetrical and tiered, separate the planes with mist. He fixed for centuries the ideal of the great Northern Song landscape, which the painters of the Yuan, Ming and Qing copied and reinterpreted."""

[[artistes]]
nom = "Guo Xi"
vie = "Wenxian (Henan), c. 1020 – c. 1090"
biographie = """
Guo Xi was born around 1020 in Wenxian, in Henan province, under the Northern Song dynasty. Apparently partly self-taught, he studied the works of the great landscape painter Li Cheng and made a name for himself with his murals. Around 1068, he was summoned to the court at Kaifeng by the young Emperor Shenzong, who admired him so much that he entrusted him with the decoration of many palace and government buildings. He became one of the most prominent painters of the Imperial Academy and trained pupils. His ideas on painting were gathered by his son Guo Si in a treatise, the Lofty Message of Forests and Streams, one of the most important texts of Chinese landscape theory. In it he describes the observation of seasons, hours and distances, and the consoling role of landscape for the man kept in the city by his duties. At Shenzong's death, in 1085, court taste changed and his work fell out of favor. He died around 1090. His influence remains immense: the so-called “Li-Guo” style, which joins his name to that of Li Cheng, dominated northern landscape for several centuries."""
style = """
Guo Xi paints living, almost moving mountains, made of cloud-shaped rocks and trees with hooked branches. He plays with mist and graded ink washes to make one feel the air, the season and the hour. A theorist of the “three distances”, he composes landscapes in which the gaze can climb, plunge and recede at once. His painting combines the grandeur of the monumental landscape with a very fine observation of nature."""

[[artistes]]
nom = "Zhao Mengfu"
vie = "Huzhou (Zhejiang), 1254 – Huzhou, 1322"
biographie = """
Zhao Mengfu was born in 1254 in Huzhou, south of Lake Tai, into a branch of the imperial family of the Song. He was twenty-five when, in 1279, the Mongols of Kublai Khan completed their conquest of China and founded the Yuan dynasty. At first he lived in retirement, then, in 1286, accepted Kublai's invitation and went to serve in the new capital, Dadu, present-day Beijing. This choice earned him the scorn of certain scholars who had remained loyal to the Song. He held posts in the provinces, notably in Shandong, then rose through the ranks to the direction of the Hanlin Academy, the highest rank of the administration. His wife, Guan Daosheng, was herself a painter and calligrapher, and their son Zhao Yong followed their path. A calligrapher of genius, Zhao Mengfu created a style of writing that remains a model to this day. In painting, he practiced every genre, landscapes, horses, bamboo, rocks, and advocated a return to the spirit of the ancient masters. He died in Huzhou in 1322, laden with posthumous honors."""
style = """
Zhao Mengfu rejects the decorative virtuosity of the Southern Song Academy and returns to the masters of the Tang and the Five Dynasties, with a deliberately archaic simplicity. For him, painting and writing are one and the same gesture: he says that rocks should be drawn like the “flying white” script and trees like seal script. He founded the aesthetic of scholar painting, which dominated Chinese art until the 20th century."""

[[artistes]]
nom = "Shen Zhou"
vie = "Xiangcheng, near Suzhou, 1427 – 1509"
biographie = """
Shen Zhou was born in 1427 in Xiangcheng, near Suzhou, into a well-off family of landowners and scholars, under the Ming dynasty. His grandfather and father were poets, painters and collectors, and he grew up surrounded by books and ancient works. Unlike most scholars of his time, he never sat the imperial examinations and refused official posts; it is reported that he wished to stay with his mother, whom he cared for until a very advanced age. He devoted his life to poetry, calligraphy, painting and collecting, receiving friends and disciples on his estate. He studied closely the masters of the Yuan, Wang Meng, Huang Gongwang, Ni Zan and Wu Zhen, whose works he owned or copied. His reputation attracted many pupils, among them Wen Zhengming, who would carry on his teaching. Shen Zhou is considered the founder of the Wu school, named after the old name of the Suzhou region. He died in 1509, at more than eighty years of age, a respected figure of the whole scholarly society."""
style = """
Shen Zhou begins with a meticulous, dense manner inspired by Wang Meng, then evolves toward a broader, freer and faster brush. His landscapes, often accompanied by his own poems, show the walks and friendships of the scholars of Suzhou. He also painted flowers, birds and scenes of daily life. With his pupils, he made Suzhou the center of Ming scholar painting."""

[[artistes]]
nom = "Behzad"
vie = "Herat, c. 1450–1460 – Tabriz, c. 1535"
biographie = """
Kamal al-Din Behzad was born in Herat, in present-day Afghanistan, around the middle of the 15th century. An orphan at a very young age, he was raised, according to early sources, by the painter Mirak Naqqash, director of the royal library. Herat was then the capital of the last Timurid princes and one of the great centers of Persian culture. There Behzad enjoyed the protection of Sultan Husayn Bayqara and his minister Mir Ali Shir Navai, a poet and patron. He illustrated the most luxurious manuscripts of the royal library, including Saadi's Bustan of 1488. In the early 16th century, Herat fell to the Uzbeks, then to the Safavids of Iran. Behzad made his way to Tabriz, where, in 1522, a decree of Shah Ismail named him director of the library and the royal workshop. There he trained a new generation of painters and contributed to the rise of Safavid painting. He died around 1535, surrounded by an immense reputation: he was long credited with far more works than he painted, and his name became synonymous with perfection throughout the Persian world, from the Ottoman Empire to India."""
style = """
Behzad renews the Persian miniature by bringing his figures to life: varied postures, expressive gestures, scenes of daily life slipped into the narratives. His highly structured compositions are organized around diagonals and complex architectures, with faithfully reproduced décor. His colors are intense but harmonious. His influence extends to all Persian, Ottoman and Mughal painting of the 16th century."""

[[artistes]]
nom = "Sultan Muhammad"
vie = "Tabriz, active c. 1505 – c. 1545"
biographie = """
Sultan Muhammad is the greatest painter of the first Safavid generation, but his life remains poorly known. He probably trained in Tabriz, in the tradition of the Turkmen painters who worked for the Aq Qoyunlu princes, before the accession in 1501 of Shah Ismail I, founder of the Safavid dynasty. In the early 1520s, he directed the royal workshop in Tabriz and played a major role in the great Shahnameh project intended for Prince Tahmasp, for which he is thought to have been one of the master draftsmen. There he painted, among others, the Court of Gayumars, a page that won him the admiration of his contemporaries. He is also credited with paintings in a famous Divan of the poet Hafez, around 1527, and in a Khamseh of Nizami made for Shah Tahmasp between 1539 and 1543, now in the British Library in London. His son, Mirza Ali, also became an important painter of the royal workshop. His trail is lost in the 1540s, when Shah Tahmasp, won over by devotion, gradually turned away from painting."""
style = """
Sultan Muhammad unites the unbridled imagination of Turkmen painting in Tabriz, its fantastic rocks and vivid colors, with the rigor of the Herat school. His pages teem with minute details, faces hidden in the rocks, figures full of humor. His palette, rich in pinks, mauves and turquoises, and his sense of movement make him the master of the early Safavid style."""

[[artistes]]
nom = "Reza Abbasi"
vie = "Kashan?, c. 1565 – Isfahan, 1635"
biographie = """
Reza Abbasi, or Riza-yi Abbasi, was born around 1565, probably in Kashan, the son of Ali Asghar, a painter in the service of the Safavid rulers. He entered the workshop of Shah Abbas I, who ascended the throne in 1588, made Isfahan his new capital and covered it with mosques, palaces and gardens, while still young. The king granted him the title of Abbasi, which associates his name with that of the sovereign. In the early 17th century, he withdrew for a time from the court, which the chronicler Iskandar Beg Munshi reproached him for, then returned and remained the most renowned painter of the kingdom. Rather than illustrating great manuscripts, he devoted himself above all to single leaves, drawings and paintings intended for collectors' albums: elegant young men, lovers, dervishes, old men, pastoral scenes. He trained many pupils, among them Muin Musavvir, who left a portrait of him. His son, Shafi Abbasi, in turn became a renowned painter, a specialist in flowers and birds. Reza Abbasi died in Isfahan in 1635, at the height of his fame."""
style = """
Reza Abbasi is above all a draftsman. His calligraphic line, supple and nervous, swells and thins to follow the folds of garments and the curves of bodies. His figures, elegant, nonchalant, often sensual, stand out against simple grounds enhanced with gold. He imposed in Isfahan the taste for the album page and defined the style of 17th-century Safavid painting, imitated for generations."""

[[artistes]]
nom = "Bichitr"
vie = "Mughal India, active c. 1610 – c. 1660"
biographie = """
Bichitr is a Hindu painter of the Mughal court, of whom we know only what his signed works reveal. His name, of Sanskrit origin, means “marvelous” or “astonishing”. Trained in the imperial workshop during the reign of Jahangir, emperor from 1605 to 1627, he drew attention with portraits and political allegories of extreme finesse, such as the one in which the emperor prefers a Sufi shaykh to kings. He portrays himself in it, which shows the esteem in which he was held. He became one of the favorite painters of Shah Jahan, Jahangir's son, emperor from 1628 to 1658 and builder of the Taj Mahal. He took part in the illustration of the great official chronicle of the reign, the Padshahnama, now in the British Royal Collection, and painted many portraits of the emperor, princes and dignitaries. His dated works span several decades, until around the middle of the 17th century. The dates of his birth and death are unknown."""
style = """
Bichitr takes the finish of Mughal painting to its peak: portraits of striking precision, jewels and fabrics rendered down to the last detail, luminous colors. He easily integrates European motifs, cherubs, landscapes in atmospheric perspective, modeling of faces, into solemn and symbolic compositions. His images serve imperial glory while retaining great humanity in the faces."""

[[artistes]]
nom = "Abu'l Hasan"
vie = "Mughal court, 1588 or 1589 – after 1630"
biographie = """
Abu'l Hasan was born in 1588 or 1589 in the household of Prince Salim, the future Emperor Jahangir, who called him “born in his house”. His father, Aqa Riza, was a painter from Herat who had entered the prince's service. Precocious, at about the age of thirteen he signed a drawing after an engraving by Albrecht Dürer depicting Saint John, now in the Ashmolean Museum in Oxford. When Salim became emperor in 1605, Abu'l Hasan established himself as one of the foremost painters of the imperial workshop. He painted the image of Jahangir's accession, many portraits and the great political allegories of the reign, in which the emperor triumphs over his enemies or embraces the king of Iran. Jahangir writes in his memoirs that his work is without equal and gave him the title Nadir al-Zaman, “the wonder of the age”. He is also credited with Squirrels in a Plane Tree, around 1610, now in the British Library, famous for their naturalism. After Jahangir's death in 1627, his trail is gradually lost."""
style = """
Abu'l Hasan is a portraitist of great assurance, able to capture the psychology of a face. He very early absorbed the lessons of European engraving, which he fused into the Persian and Indian tradition: modeling, globes, cherubs, radiant halos. His allegories, rich in symbols, gave Mughal art a new political and visionary dimension."""

[[artistes]]
nom = "Govardhan"
vie = "Mughal India, active c. 1596 – c. 1645"
biographie = """
Govardhan is a Hindu painter of the Mughal court, the son of a painter in the workshop of the Emperor Akbar. He began working in the late 16th century, under Akbar, taking part in the illustration of historical and literary manuscripts. He continued his career under Jahangir, then under Shah Jahan, thus spending nearly half a century in the service of the emperors. Around 1610, the painter Daulat depicted him, with other masters of the imperial workshop, in a group portrait of the court artists. Govardhan is distinguished by his portraits full of warmth and above all by his images of holy men, ascetics, musicians and dervishes, subjects he treats with particular sympathy. He also painted court scenes and portraits of the emperor and princes, including a famous double portrait of Shah Jahan and his son Dara Shikoh. Several of his works are preserved in the Musée Guimet in Paris. His trail is lost around the middle of the 17th century; his dates of birth and death are not known."""
style = """
Govardhan is the painter of gentleness and inwardness. His subtle modeling conveys the texture of skin, the thinness of ascetics, the weight of bodies. His faces, attentive and grave, always seem inhabited by a thought. He composes calm scenes in earth colors, in which light and space play a great role, and remains one of the great portraitists of Mughal art."""
