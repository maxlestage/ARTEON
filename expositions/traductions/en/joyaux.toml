[[oeuvres]]
titre = "Snuffbox with Views of the Château de Chanteloup"
artiste = "Paris, orfèvres-bijoutiers du XVIIIᵉ siècle"
annee = "box 1748–1749, miniatures 1767"
image = "tabatiere-chanteloup.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Snuffbox_with_six_views_at_Chanteloup_(The_Choiseul_Box)_MET_DP169997.jpg"
technique = "Chased gold, glass, miniatures on vellum; 4.4 × 7.9 × 5.7 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A gold tobacco box, 8 cm long, each face of which frames a miniature view of the estate of the Duc de Choiseul, painted with astonishing precision."
description = """
The snuffbox is a small rectangular gold casket, each face of which, lid, \
base and sides, bears a miniature under glass, framed by a gold border chased with \
flowers and wave patterns. The view shown here depicts, from a bird's-eye perspective, a large \
château with blue slate roofs, with its courtyard and projecting wings. In front of it \
extends a vast formal garden: clipped groves, straight avenues, parterres and, at the \
centre, a long ornamental pool that descends in steps toward the viewer. In the distance, the \
countryside is lost in a bluish haze. Tiny strollers animate the avenues."""
evocation = """
Snuff, ground to powder and inhaled through the nose, was in the eighteenth century a \
fashion across all of elegant Europe, and the snuffbox, taken out in company, a \
prestige accessory, like a watch or a sword. This one is moreover the portrait \
of a place: Chanteloup, near Amboise, belonged to the Duc de Choiseul, chief \
minister of Louis XV. Disgraced in 1770, he retired there and held a brilliant court, to which \
his friends came to show their loyalty. To own or give a box adorned with \
his lands was to display a tie with him. By their exactness, the miniatures \
also make the box a souvenir, like a photograph before the word existed."""
histoire = """
The gold box was made in Paris in 1748–1749, probably by the goldsmith \
Pierre-François Delafons, admitted as a master in 1732. The miniatures, for their part, date from 1767 and \
are attributed to Louis-Nicolas van Blarenberghe: they were therefore mounted nearly \
twenty years after the box was made. Choiseul had bought Chanteloup in 1761 and \
had it enlarged and embellished; a great lover of snuffboxes, he owned an \
important collection of them, but it is not known whether this one belonged to him. It was given to the \
Metropolitan Museum in 1976 by Charles and Jayne Wrightsman, great collectors of \
eighteenth-century French art."""
facture = """
The box is the work of a goldsmith-jeweller: the gold plates, chased with flowers and \
wave patterns, are assembled around a frame, and the lid pivots on a \
hinge fitted with great precision. The miniatures are painted in gouache \
on vellum, then protected by glass. The Van Blarenberghes, father and son, were \
famous for their tiny views: in a few square centimetres, one can count the \
windows of the château and the trees of the avenues, and the figures measure only \
a few millimetres."""
details = [
  "The long stepped pool, at the centre, leading to the château.",
  "The blue slate roofs and the projecting wings of the courtyard.",
  "The tiny strollers, scarcely larger than a pinhead.",
  "The gold border chased with five-petalled flowers.",
]
themes = ["eighteenth century", "gold", "miniature", "garden", "tobacco"]
anecdote = """
Of the Château de Chanteloup, sold after the Revolution and demolished in 1823, almost \
nothing remains, apart from the Chinese pagoda that Choiseul had built in the park. The views \
on the snuffboxes rank among the best testimonies to what it was."""
salle = 4
mur = "sud"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Rose Trellis Egg"
artiste = "Maison Fabergé"
annee = "1907"
image = "oeuf-treillis-de-roses.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:House_of_Fabergé_-_Rose_Trellis_Egg_-_Walters_44501.jpg"
technique = "Gold, enamel, diamonds; 7.7 × 5.9 cm"
collection = "Walters Art Museum, Baltimore"
note = "The Easter egg given by Nicholas II to Empress Alexandra in 1907, in memory of the birth of their son. It is less than 8 cm high."
description = """
The egg, less than eight centimetres high, is covered with a soft green, translucent \
enamel, through which one can make out the fine striations engraved in the gold. A trellis \
of bands set with small diamonds wraps it in regular lozenges. On this trellis \
climbs a rosebush: stems of yellow gold, leaves enamelled in green and pink \
roses, paler at the heart, are scattered over the whole surface, as on a garden \
arbour. At the top, a flat diamond is set in a gold collar. The egg opens in \
two to reveal a surprise, now lost."""
evocation = """
Eggs are at the heart of the Orthodox Easter celebration: they are exchanged with the \
Easter kiss and the greeting “Christ is risen.” The Romanovs made of them \
masterpieces of jewellery. This one celebrates the birth, in August 1904, of the tsarevich \
Alexei, the long-awaited heir after four daughters. The roses and the greenery of a \
garden in spring speak of love and renewal. We know today how fragile this \
image of family happiness was: the child had haemophilia, which the court \
concealed, and the whole family was murdered by the Bolsheviks in 1918."""
histoire = """
From 1885 to 1916, the House of Fabergé made for the imperial family Easter eggs, \
each one unique. The Russo-Japanese War interrupted the series in 1904 and 1905; \
on 22 April 1907, Nicholas II gave this one to his wife, Alexandra Feodorovna. \
Fabergé's invoice, dated the day before, came to 8,300 roubles. The egg contained a \
diamond necklace and a miniature portrait of the tsarevich on ivory, surrounded by \
diamonds, now lost. In 1917, the imperial treasures were transferred to the Kremlin; \
the egg then passed into the hands of the dealer Alexandre Polovtsoff in Paris. The American \
collector Henry Walters bought it in 1930 and bequeathed his collection to \
Baltimore on his death in 1931."""
facture = """
The ground of the egg is an example of guilloché, Fabergé's specialty: a \
mechanical lathe engraves fine, regular lines in the gold, then the enameller covers the \
surface with several layers of translucent enamel, fired one after another and polished, \
which make the metal shimmer like silk. The roses and leaves, in enamelled gold, \
are applied over it, as is the diamond trellis. The egg came out of \
the workshop of Henrik Wigström, the Finnish goldsmith who directed the making of the imperial \
eggs after 1903."""
details = [
  "The engraved striations of the gold, visible beneath the green enamel.",
  "The lines of small diamonds that form the trellis.",
  "The enamelled roses, paler at the heart than at the edges.",
  "The flat diamond set at the top of the egg.",
]
themes = ["fabergé", "easter", "russia", "roses", "romanov"]
anecdote = """
Several imperial eggs vanished after the Revolution. In 2014 it emerged that an \
American scrap dealer, who meant to melt down a small gold egg bought at a flea market, \
in fact held the third imperial egg, given in 1887 and lost since the \
1920s."""
salle = 5
mur = "sud"
place = 1
largeur = 0.75

[[oeuvres]]
titre = "Dragonfly Woman, Corsage Ornament"
artiste = "René Lalique"
annee = "c. 1897–1898"
image = "femme-libellule.jpg"
credit = "Photo : Sailko"
licence = "CC BY 3.0"
source = "https://commons.wikimedia.org/wiki/File:René_lalique,_pettorale_libellula,_in_oro,_smalti,_crisoprazio,_calcedonio,_pietre_lunari_e_diamanti,_1897-98_ca._01.jpg"
technique = "Gold, enamel, chrysoprase, chalcedony, moonstones, diamonds; 23 × 26.5 cm"
collection = "Calouste Gulbenkian Museum, Lisbon"
note = "The most famous jewel of Art Nouveau: an insect-woman with enamel wings, shown at the Paris Universal Exposition in 1900. It is 23 cm high and 26.5 cm wide."
description = """
A woman's bust rises from the top of a dragonfly's body. Her head, wearing a \
helmet with large insect eyes enamelled in blue and green, bends forward, the eyelids \
lowered; her bare breast is the pale green of stone. From her shoulders spring two \
immense wings of pale green translucent enamel, veined like real insect wings \
and punctuated with large blue-green ovals set with small clear stones. Above \
the wings, two gold talons curl like the claws of a bird of prey. Beneath the bust, \
a gold monster's head, framed by two folded arms; lower down, the long abdomen of \
the dragonfly, made of rings of gold, dark blue enamel and pale cabochons, stretches \
to a forked tail."""
evocation = """
Lalique makes of a jewel a hybrid being, at once woman, insect and monster, which \
belongs to the world of dream and fin-de-siècle Symbolism. The dragonfly, loved by \
Art Nouveau artists and by the Japanese prints that inspired them, evokes \
lightness, metamorphosis, the fleeting brilliance of a summer. But the woman with lowered eyes, \
a prisoner of this insect body and these claws, also has something disquieting \
about her: she has been seen as a figure of the femme fatale, seductive and dangerous, dear to \
the literature of the time. Above all, the object asserts a new idea: the value of a \
jewel lies not in the weight of the stones, but in the artist's invention."""
histoire = """
Lalique conceived this ornament around 1897–1898, at the moment when he was renewing Parisian \
jewellery. According to the Gulbenkian Museum, it was probably worn on stage by Sarah \
Bernhardt, a client and friend of the jeweller. In 1900, the dragonfly woman was among the \
jewels that caused a sensation in Lalique's display at the Paris Universal \
Exposition. The collector Calouste Gulbenkian, an Armenian businessman who made his fortune in \
oil, bought it in 1903. An admirer and friend of Lalique, he assembled over nearly thirty \
years some one hundred and fifty of his works. They are now displayed in \
a room devoted to them at the Gulbenkian Museum in Lisbon, opened in 1969."""
facture = """
The wings are in “plique-à-jour” enamel: translucent enamel is poured into a \
network of bottomless gold cells, like a miniature stained-glass window, so that light \
passes through them. They are articulated, which gives them a slight movement. Lalique \
combines gold and enamel with stones then considered modest, chrysoprase, chalcedony, \
moonstones, and a few diamonds, choosing each material for its colour \
and not for its price. The bust, finely carved and polished, shows the skill of an \
artist who had learned drawing and modelling before becoming a jeweller."""
details = [
  "The helmet with large insect eyes that crowns the woman's head.",
  "The gold veins of the wings, as on a real dragonfly.",
  "The large blue-green ovals ringed with small clear stones, at the tips of the wings.",
  "The curved gold talons above the shoulders.",
  "The long forked tail, at the very bottom of the jewel.",
]
themes = ["art nouveau", "dragonfly", "woman", "enamel", "metamorphosis"]
anecdote = """
After 1905, Lalique gradually abandoned jewellery for glass: perfume bottles \
for François Coty, vases, chandeliers, automobile radiator mascots. His glassworks at \
Wingen-sur-Moder, in Alsace, founded in 1921, still produces crystal under his name."""
salle = 5
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Dragonfly Hair Ornament"
artiste = "Louis Comfort Tiffany"
annee = "c. 1904"
image = "ornement-libellules.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Hair_Ornament_MET_DT5610.jpg"
technique = "Gold, silver, platinum, black opals, boulder opals, demantoid garnets, rubies, enamel; height 8.3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Two opal dragonflies perched on dandelion heads gone to seed: one of Tiffany's first jewels, 8 cm high, long kept by the family of his client Louisine Havemeyer."
description = """
Two dragonflies have alighted on two dandelion globes gone to seed. The \
pappus is rendered by a mesh of metal wires sprinkled with tiny \
white grains; one of the globes is partly blown away, as if the wind had already carried off \
some of the seeds. The dragonflies have wings of fine metal lace, \
veined like real wings. Their long abdomens are made of segments of \
blue opal with shifting reflections, mounted end to end; their large eyes are \
pinkish opals, and their thorax is sprinkled with small green garnets. Beneath the flowers, two \
silver stems joined by a curved mount form the comb that slipped into the \
chignon."""
evocation = """
Tiffany, a painter by training, wanted his jewels to be fragments of nature, \
observed up close and without hierarchy: a weed like the dandelion is worth \
as much here as a rose. The dragonfly, the emblematic insect of Art Nouveau, alights on what the slightest \
breath disperses: the jewel speaks of fragility and the passing of time, with its globe \
already half blown away. It is also an object of adornment, made to be seen in a \
woman's coiffure, where the reflections of the opals change with every movement. Facing \
Lalique's French Art Nouveau, Tiffany offers an American version, more \
naturalistic and less disquieting."""
histoire = """
The son of Charles Lewis Tiffany, founder of the famous New York jewellery \
house, Louis Comfort Tiffany had made a name for himself with glass and stained glass. \
Around 1902, after his father's death, he turned to jewellery, with the enameller \
Julia Munson, and presented his first jewels at the Louisiana Purchase Exposition in \
St. Louis in 1904. This comb dates from that period. It remained in the family of \
Louisine Havemeyer, a great New York collector, a friend of Mary Cassatt and \
a loyal client of Tiffany, who had decorated her Fifth Avenue home. One of \
her descendants, Linden Havemeyer Wise, gave it to the Metropolitan Museum in 2002, in \
her memory."""
facture = """
The wings are made of a network of soldered metal wires, of a fineness that imitates real \
veins. The Australian opals, cut into small segments and mounted one \
behind another, render the shifting reflections of the dragonflies' abdomens. \
The demantoid garnets, a bright and brilliant green, then came from the Ural Mountains in \
Russia. The mesh of the dandelion globes, with its enamel grains, calls for \
patient work, done entirely by hand. The whole combines the skills of the goldsmith, the \
lapidary and the enameller."""
details = [
  "The half-blown globe, from which part of the seeds has flown away.",
  "The wings of metal lace, veined like real ones.",
  "The segments of blue opal, mounted end to end, of the abdomens.",
  "The large pinkish opal eyes of the two insects.",
  "The small green garnets scattered over the thoraxes.",
]
themes = ["art nouveau", "dragonfly", "nature", "opal", "america"]
anecdote = """
Tiffany's famous lamps, with glass shades decorated with dragonflies or \
wisteria, were long attributed to Tiffany alone. We now know that many \
were designed by Clara Driscoll, who ran the workshop of the women responsible for \
cutting and assembling the glass."""
salle = 5
mur = "sud"
place = 3
largeur = 0.8

[[artistes]]
nom = "Égypte, Moyen Empire"
vie = "Nile Valley, c. 2030–1650 BC"
biographie = """
The Middle Kingdom began when the Theban king Mentuhotep II reunified Egypt, \
divided since the end of the Old Kingdom, around 2030 BC. Under the Twelfth \
Dynasty, that of the Amenemhats and the Senwosrets, the country enjoyed two centuries of \
stability and prosperity. The kings established their capital near the entrance to the \
Fayum, a vast fertile depression that they developed through great works, and \
had themselves buried in mud-brick pyramids, at Lisht, Lahun, Dahshur or \
Hawara. Egypt extended its authority over Nubia, rich in gold, and traded with the \
Levant. The goldsmiths of the royal workshops mastered soldering, filigree, \
granulation and the inlaying of hardstones. The finest jewels of the period \
were found in the tombs of princesses, at Dahshur in 1894 and 1895 by Jacques de \
Morgan, and at Lahun in 1914. Later, the Egyptians themselves would regard the \
Middle Kingdom as the classical age of their language and literature."""
style = """
Middle Kingdom jewellery has an elegance and precision rarely equalled. \
It rests on a vocabulary of hieroglyphic signs, falcons, scarabs, \
cartouches, signs of life, which make each jewel an amulet and a sentence. \
Colours have meaning: the red of carnelian, the blue of lapis lazuli, the blue-green \
of turquoise. Cloisonné with stones cut one by one, without enamel, is its \
great specialty."""

[[artistes]]
nom = "Rome impériale"
vie = "Rome and the Roman Empire, 1st century BC – 3rd century AD"
biographie = """
The art of engraved stones came from Greece and the Hellenistic East, where kings \
had their portraits engraved on gems. In Rome, it reached its peak under \
Augustus, the first emperor, from 27 BC to AD 14, and under his successors \
of the Julio-Claudian dynasty. The best engravers, often Greek, such as \
Dioskourides, who engraved Augustus's seal, worked for the imperial family and \
sometimes signed their works. They produced two kinds of objects: intaglios, \
engraved in the hollow to serve as seals, and cameos, carved in relief in \
layered stones. The great imperial cameos, given to relatives or allies, \
are veritable political pictures: the Gemma Augustea, kept in Vienna, shows \
Augustus enthroned beside the goddess Roma, and the Grand Camée de France, in the \
Bibliothèque nationale, the imperial family under Tiberius. In the Middle Ages, many \
ancient cameos were set on crosses, reliquaries and crowns; in the \
Renaissance, princes and popes collected them with passion."""
style = """
The Roman cameo combines technical virtuosity with propaganda. The engraver exploits \
the layers of the stone as a painter does his colours: white figure on a dark \
ground, sometimes a third layer for a detail. The portraits, idealized and \
serene, draw on classical Greek sculpture; divine attributes, aegis, \
laurel wreath, transform the emperor into a hero or a god. This language inspired \
the cameos of the Renaissance and those of the Napoleonic era."""

[[artistes]]
nom = "Basse-Saxe, orfèvrerie du XIᵉ siècle"
vie = "Saxony (northern Germany today), 11th century"
biographie = """
In the eleventh century, Saxony was one of the richest regions of the Holy Roman \
Empire. The emperors of the Ottonian dynasty came from it, and the silver mines of the Harz, worked \
since the end of the tenth century, fed intense artistic activity around the \
great episcopal sees and abbeys: Hildesheim, Magdeburg, Essen, Brunswick. Bishop Bernward of \
Hildesheim, who died in 1022, had bronze doors cast and commissioned goldsmiths' crosses and \
candlesticks. The goldsmiths, lay or monastic, worked for bishops and for the great \
noble families, who gave churches altars, crosses and reliquaries to ensure \
their salvation and assert their rank. In Brunswick, the family of the Brunones counts, then the \
Guelphs, dukes of Saxony and Bavaria, enriched the treasury of the \
church of Saint Blaise over centuries, which the most famous of them, Henry the Lion, had \
rebuilt in the twelfth century. This Guelph Treasure, rich in portable altars, crosses \
and arm reliquaries, is now divided between Berlin, Cleveland and other \
museums."""
style = """
Eleventh-century Saxon goldsmiths' work inherits Ottonian luxury: gold, cabochon gems, \
pearls, cloisonné enamel and niello compose dazzling surfaces in which the precious \
material itself is an image of divine light. The figures, in repoussé, are \
lined up beneath arcades, in frontal and solemn poses. This rigour \
anticipates Romanesque art, of which the goldsmiths' work of the Meuse and Rhine valleys would be, in the \
following century, the great centre."""

[[artistes]]
nom = "Limoges, ateliers d'émaillerie"
vie = "Limoges (Limousin), 12th–14th century"
biographie = """
Around the middle of the twelfth century, enamellers' workshops developed in Limoges, \
a pilgrimage city active around the abbey of Saint-Martial. They did not work \
gold, but copper, more economical, which they covered with enamel and gilding. Their \
production, abundant and of constant quality, conquered all of Christian Europe: it \
was known by the Latin name opus lemovicense, the work of Limoges. The workshops \
made chasses, crosses, bishops' croziers, ciboria, \
candlesticks, book-cover plaques and even funerary effigies. They were found in \
Italy, Spain, England and Scandinavia. The craftsmen remain almost all \
anonymous; a few names appear at times, such as that of Alpais, who signed a \
famous ciborium kept in the Louvre. Production declined in the fourteenth century, during the \
Hundred Years' War. Limoges regained glory at the end of the fifteenth century with a \
new technique, painted enamel, which Léonard Limosin would illustrate in the following century."""
style = """
Limoges enamel is recognizable by its palette dominated by blue, from lapis to pale \
blue, highlighted with green, yellow, red and white, on the gilded ground of the copper engraved \
with scrolling foliage. The figures, clearly and firmly drawn, are set beneath arcades or \
in medallions. This serial production, with its repeated models, does not preclude \
brilliance: it brought the splendour of goldsmiths' work within reach of countless churches."""

[[artistes]]
nom = "Allemagne, orfèvres de la Renaissance"
vie = "Holy Roman Empire (Nuremberg, Augsburg, Munich…), 16th century"
biographie = """
In the sixteenth century, the free cities of southern Germany, enriched by trade and \
silver mines, became great centres of European goldsmiths' work. In Nuremberg and \
Augsburg, hundreds of masters, united in strict guilds, had to \
produce a masterpiece to be admitted and to stamp their works with a hallmark. The most famous, \
Wenzel Jamnitzer, worked for four successive emperors. Princes, such as the \
dukes of Bavaria in Munich, the electors of Saxony in Dresden or Archduke Ferdinand II at \
Ambras Castle, gathered in their cabinets of curiosities cups, \
automata and jewels. The forms of the Italian Renaissance, columns, pediments, \
grotesques, reached the workshops through engravings: ornament designers such as Virgil \
Solis, in Nuremberg, or Erasmus Hornick published pendant designs that \
goldsmiths copied and combined. The portraits painted by Holbein or Cranach show these \
jewels worn on the chest, on hats or on sleeves. Melted down, transformed or \
remounted according to fashion and the need for money, they have come down to us only in \
small numbers."""
style = """
The jewel of the German Renaissance is a small sculpture: figures in the round \
enamelled in white, miniature architecture, sea monsters and grotesques. Enamel \
in bright colours, white, red, green, blue, covers the chased gold, and the stones, \
table-cut or cabochon, are accompanied by pearls, often irregular and \
pendant. The effect sought is abundance and surprise, to be viewed up close, like \
the objects in cabinets of curiosities."""

[[artistes]]
nom = "Popayán, orfèvres de la Nouvelle-Grenade"
vie = "Popayán (present-day Colombia), 16th–18th century"
biographie = """
Founded in 1537 by the conquistador Sebastián de Belalcázar in a high valley of the \
Andes, in the south of present-day Colombia, Popayán became a city of notables, \
convents and churches. Its wealth came from gold, mined in the mines and \
rivers of the neighbouring regions, particularly toward the Pacific coast, by enslaved \
Africans. The city's elites, owners of mines and estates, \
vied in generosity toward the churches and confraternities, the associations of \
the faithful that organize the cult of a saint or of the Virgin and maintain her \
ornaments. The local goldsmiths, whose names are almost all forgotten, made \
for them monstrances, chalices, crowns and adornments for statues. The \
emeralds came from the mines of the Muzo region, north of Bogotá, already worked \
before the arrival of the Spanish. Attached in the eighteenth century to the Viceroyalty of \
New Granada, Popayán remains famous for its Holy Week processions, \
inscribed in 2009 on UNESCO's Intangible Cultural Heritage list."""
style = """
The religious goldsmiths' work of New Granada adopts European forms, Baroque \
and then Rococo, known from imported objects and engravings, but treats them with \
a prodigality peculiar to the New World: thick gold, emeralds in abundance, effects of \
profusion. The repoussé, the openwork and the table-cut or drop-shaped stones give these \
objects a brilliance made to be seen from afar, in the light of candles and \
processions."""

[[artistes]]
nom = "Paris, orfèvres-bijoutiers du XVIIIᵉ siècle"
vie = "Paris, 18th century"
biographie = """
In the eighteenth century, Paris dominated the making of luxury objects in Europe. The \
goldsmith-jewellers, members of the powerful guild of goldsmiths, specialized \
in “bijoux” in the sense of the period: snuffboxes, cases, patch boxes, \
nécessaires and cane handles. Their gold works bore obligatory \
hallmarks, the master's and those of the inspection, with a letter that changed every \
year: they can thus be dated precisely. The snuffbox became the \
indispensable accessory of the man and woman of the world, and the king gave ambassadors \
boxes adorned with his portrait. The goldsmiths worked with miniaturists, \
enamellers and engravers. Pierre-François Delafons, admitted as master in 1732 and dead in \
1787, was one of these makers. The Van Blarenberghe family, from Lille, \
specialized in tiny views: Louis-Nicolas, born in 1716, a battle painter for the \
Ministry of War, and his son Henri-Joseph painted festivities, harbours, \
battles and châteaux for the lids of boxes."""
style = """
The Parisian snuffbox is a masterpiece of miniaturization and precision: \
perfect hinge, a lid that closes without play, gold of several colours chased with \
flowers, enamel, lacquer or miniatures under glass. It follows fashion, Rococo around 1750, \
then Neoclassical. The views of the Van Blarenberghes, topographically exact, \
also make them valuable documents on the places and festivities of the period."""

[[artistes]]
nom = "Maison Fabergé"
vie = "Saint Petersburg, 1842–1918"
biographie = """
Gustav Fabergé, a jeweller from a family of Huguenot origin established in the \
Baltic countries, opened his shop in Saint Petersburg in 1842. His son Carl, born in 1846, followed \
his family to Dresden, the city of the Green Vault, where he attended a commercial school, \
trained with a Frankfurt jeweller and then travelled in Europe to study the \
collections, before taking over the head of the house in 1872. He wanted the value of an \
object to rest on its invention and perfection rather than on the weight of the stones. In \
1885, Tsar Alexander III commissioned from him an Easter egg for Empress Maria \
Feodorovna, the Hen Egg, and Fabergé became supplier to the court. Nicholas II \
continued the tradition, giving each year one egg to his mother and one to his wife: about \
fifty imperial eggs were made up to 1916. The house employed up to \
five hundred people, in workshops directed by masters such as Mikhail Perkhin and \
Henrik Wigström, and opened branches in Moscow, Odessa, Kiev and London. \
Nationalized by the Bolsheviks in 1918, it disappeared; Carl Fabergé fled Russia \
and died in Lausanne in 1920."""
style = """
The Fabergé style draws on eighteenth-century France, the Renaissance, old Russian art \
and sometimes Art Nouveau. It is recognizable by its translucent enamels over a guilloché \
ground, in a very wide palette, by its golds of different colours, its flowers \
and animals in Russian hardstones, and by an impeccable finish. Its imperial \
eggs, with their surprises, have become the symbol of the luxury of the last Romanovs."""

[[artistes]]
nom = "René Lalique"
vie = "Aÿ (Marne), 6 April 1860 – Paris, 1 May 1945"
biographie = """
Born in Champagne, René Lalique lost his father at sixteen and was apprenticed to \
the Parisian jeweller Louis Aucoc, while attending classes at the École des arts \
décoratifs. He then spent two years in London, where he studied at Sydenham College. \
Back in Paris, he designed jewels for great houses, such as Cartier or \
Boucheron, then in 1885 took over the workshop of the jeweller Jules d'Estape. In the \
1890s he invented a new jewellery, in which insects, flowers, women and \
landscapes replaced rivers of diamonds. Sarah Bernhardt wore his jewels; at \
the Universal Exposition of 1900, his display caused a sensation, and he was promoted officer \
of the Légion d'honneur. The collector Calouste Gulbenkian became his great patron. \
After 1905, Lalique turned to glass: he designed perfume bottles for \
François Coty, then founded his own glassworks, at Combs-la-Ville, then at \
Wingen-sur-Moder, in Alsace. His vases, light fittings and radiator mascots \
made him one of the masters of Art Deco. He died in Paris in 1945."""
style = """
Lalique freed jewellery from the tyranny of the diamond. He chose his materials for \
their effect, plique-à-jour enamel, horn, ivory, glass, opal, moonstone, and \
combined them with gold in complete freedom. His motifs, borrowed from nature and \
Symbolism, dragonflies, peacocks, flower-women, snakes, make the jewel a work of art in \
its own right. His influence on European Art Nouveau was immense, and his work in \
glass opened the way for Art Deco."""

[[artistes]]
nom = "Louis Comfort Tiffany"
vie = "New York, 18 February 1848 – New York, 17 January 1933"
biographie = """
The son of Charles Lewis Tiffany, founder of Tiffany & Co., Louis Comfort \
Tiffany preferred painting to the family business. A pupil of George Inness and \
Samuel Colman, he travelled in Europe and North Africa, bringing back Orientalist \
canvases. In the 1870s he took an interest in glass and sought to obtain \
colour in the very mass of the material, without paint. In 1879 he founded an interior \
decoration company, which redesigned rooms of the White House in 1882, then \
devoted itself to stained glass and blown glass, to which he gave the name Favrile. His \
workshops, which became Tiffany Studios, produced stained-glass windows, mosaics, vases and \
the famous lamps with glass shades. After his father's death in 1902, he \
became artistic director of Tiffany & Co. and turned to jewellery, first presented \
in St. Louis in 1904. He then built Laurelton Hall, his Long Island \
residence, a veritable manifesto of his art. Out of fashion after the First \
World War, he created a foundation for young artists and died in New York in \
1933."""
style = """
Tiffany wanted to bring the beauty of nature into everyday objects. \
A painter of colour, he sought its effects in iridescent glass, opals and \
enamels, and his motifs, dragonflies, wisteria, peonies, dandelions, came from \
direct observation of gardens. His work is the great American contribution to \
Art Nouveau, more naturalistic and less literary than French art."""
