[exposition]
ordre = 55
nom_court = "Jewels"
mouvement = "Jewellery, goldsmiths' work and treasures"
cadre = "vitrine"
couleur = "#7a5a1c"
titre = "Jewels and Treasures: Four Thousand Years of Goldsmiths' Work"
artiste = "Fabergé, Lalique, Tiffany, goldsmiths of Egypt, Limoges, Popayán…"
dates = "c. 1887 BC – 1907"
accroche = "Virtual exhibition · Green Vault (Grünes Gewölbe), Dresden"
introduction = """
Since the Egypt of the pharaohs, goldsmiths have transformed gold, stones and enamel into \
objects of power, faith and seduction. The visit brings together ten treasures, from the \
pectoral of an Egyptian princess to the Art Nouveau jewels of Lalique and Tiffany, by way of \
a cameo of Augustus, a Romanesque altar, a crown of Andean emeralds and an \
imperial Fabergé egg. The building takes its inspiration from the Green Vault in Dresden, the treasury of the \
princes of Saxony: a suite of low cabinets through which one passes as one would open \
caskets, as far as the salon of precious objects, larger and higher. Each object, often \
tiny, is shown here enlarged in a deep display case, against a background of dark \
velvet."""
vitrine = "couronne-des-andes.jpg"

[musee]
nom = "Green Vault (Grünes Gewölbe)"
ville = "Dresden, Germany"
construction = "1723–1729"
presentation = """
In 1547, Elector Maurice of Saxony had a wing added to Dresden Castle; on the \
ground floor, vaulted rooms housed the princes' secret treasure. They came to be \
called the Green Vault, after the green colour of their column bases and capitals. \
From 1723 to 1729, Augustus the Strong, Elector of Saxony and King of Poland, \
transformed them into a suite of state rooms open to visitors: it is one of the \
oldest museums in Europe. One passes from the Amber Cabinet to the Ivory Room, \
from the silver rooms to the salon of precious objects, lined with mirrors, then to the Jewel \
Room. The treasury also contains the Court of Delhi, a miniature theatre of gold and \
gems by Johann Melchior Dinglinger, and the Dresden Green Diamond, of 41 carats. \
The bombing of February 1945 destroyed three rooms; the collections, taken to the \
USSR, returned in 1958. The historic Green Vault, restored to its eighteenth-century \
state, reopened in 2006."""
ici = """
ARTEON's building takes up the idea of the Green Vault: a suite of cabinets through which \
one passes from west to east. One enters from the south into the green vestibule, with walls \
the colour of pale malachite, then moves on to the cabinet of antiquities, with light amber \
walls, and to the treasure room, ivory in colour: three rooms of 10 by 8 metres, \
5.5 metres high. Next comes the salon of precious objects, larger and higher, with \
silver-grey walls like the mirrors of its model. The visit ends in the Jewel \
Cabinet, a soft green. The objects rest in wall display cases lined with dark \
velvet."""

