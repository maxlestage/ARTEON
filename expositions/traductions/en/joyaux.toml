[[oeuvres]]
titre = "Pectoral and Necklace of Sithathoryunet"
artiste = "Égypte, Moyen Empire"
annee = "c. 1887–1878 BC"
image = "pectoral-sithathoryunet.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Pectoral_and_Necklace_of_Sithathoryunet_with_the_Name_of_Senwosret_II_MET_DT531.jpg"
technique = "Gold, carnelian, lapis lazuli, turquoise and garnet; beads of gold, carnelian, lapis lazuli, turquoise and green feldspar; pectoral 4.5 × 8.2 cm, necklace 82 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The jewel of a princess of the Twelfth Dynasty, bearing the name of King Senwosret II: two falcons of gold and stones frame the royal name. The pectoral is barely 8 cm wide."
description = """
A long necklace of drop-shaped beads, alternating gold, orange-red carnelian, \
midnight-blue lapis lazuli and turquoise, supports at its centre a small \
openwork pectoral. Two falcons, birds of the god Horus, face each other, their talons resting \
on a bar decorated with zigzags; each wears a sun disk on its head. Between \
them, a cartouche, the oval that frames royal names, contains the throne name \
of King Senwosret II, written with a sun disk, a scarab and the sign of the \
hill. Beneath the cartouche, a small kneeling god holds in each hand a long \
notched palm stem. On either side, two rearing cobras let hang the \
ankh sign, the cross of life."""
evocation = """
The pectoral reads like a sentence in hieroglyphs, and like a prayer. The kneeling \
god is Heh, the personification of infinity: the notched palm stems \
were used to count the years, and his image means “millions of years.” The \
solar falcons and the signs of life surround the king's name: the sun grants the \
sovereign an eternal life and reign. Worn on the breast of a princess, the jewel \
asserted her bond with the pharaoh and placed her under the protection of the same gods. In \
Egypt, adornment was never mere ornament: each colour, each form \
had a magical value, and jewels accompanied their owner into the tomb, \
for eternity."""
histoire = """
Sithathoryunet was a princess of the Twelfth Dynasty, probably a daughter of \
Senwosret II; she was buried near that king's pyramid, at Lahun, at the entrance \
to the Fayum. In 1914, the team of the British archaeologist Flinders Petrie excavated her \
tomb, which had been plundered in antiquity. But in a niche filled with hardened mud, the thieves \
had missed the princess's jewel caskets: the Egyptologist Guy Brunton spent several \
days freeing the jewels, bead by bead, from the wooden caskets, which had \
rotted. According to the sharing rules then in force, the Egyptian Antiquities \
Service kept part of the treasure, including the princess's diadem, now in the \
Cairo museum; the rest was bought in 1916 by the Metropolitan Museum."""
facture = """
The pectoral is made in the cloisonné technique: the goldsmith solders thin strips of gold onto a gold \
plate to outline each feather and each contour, then inlays small pieces of \
stone, each cut to the exact shape of its cell. Hundreds of fragments of carnelian, lapis lazuli, turquoise and \
garnet are thus fitted together without the slightest gap. The back, in gold, repeats the whole \
design in fine chasing. The lapis lazuli came from the mountains of present-day Afghanistan, \
the turquoise from Sinai."""
details = [
  "The lapis lazuli scarab at the centre of the royal cartouche.",
  "The falcons' feathers, each made from a cut piece of stone.",
  "The notched palm stems held by the little god Heh.",
  "The ankh signs of life hanging from the two cobras.",
  "The drop-shaped gold beads, alternating with carnelian and lapis lazuli.",
]
themes = ["egypt", "gold", "pharaoh", "eternity", "cloisonné"]
anecdote = """
The princess's name, Sat-Hathor-Iunet, means “daughter of Hathor of Dendera,” the \
goddess of love and beauty worshipped in that city of Upper Egypt. Her jewels \
escaped the ancient plunderers, who had not seen the niche in which they lay."""
salle = 2
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Cameo: Portrait of the Emperor Augustus"
artiste = "Rome impériale"
annee = "c. AD 41–54"
image = "camee-auguste.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Sardonyx_cameo_portrait_of_the_Emperor_Augustus_MET_DP155547.jpg"
technique = "Sardonyx, 3.7 × 2.9 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Carved in a layered stone, Augustus's white profile stands out against a brown ground. The cameo, less than 4 cm high, was cut several decades after the emperor's death."
description = """
The first Roman emperor appears in bust form, in profile, carved in white relief on a \
translucent reddish-brown ground. He is young, his face smooth, his nose straight, his \
thick, curly hair encircled by a laurel wreath whose ribbons float behind the \
nape. The shoulder, on the right, is bare, crossed diagonally by the baldric, the strap \
that holds the sword. Across the chest is thrown the aegis, a scaly skin \
edged with snakes, on which one can make out at the centre a Gorgon head with snaky \
hair and, lower down, a second head, that of a wind god with tousled \
locks. The oval stone is scarcely larger than a coin."""
evocation = """
The cameo makes of Augustus more than a man. The aegis, the skin breastplate adorned with the head \
of Medusa, belongs to Jupiter and Minerva: to wear it is to be protected and armed \
by the gods, and the Metropolitan Museum sees in it the image of a victorious demigod. The \
head of the wind god has been interpreted as an allusion to the summer winds that drove \
to Rome the ships laden with the grain of Egypt, a province conquered by Augustus. Cut \
under the emperor Claudius, his great-nephew, this portrait of an eternally young Augustus, \
dead for nearly thirty years, also served the ruling dynasty: to honour the \
deified founder was to affirm the legitimacy of his heirs."""
histoire = """
Cameos bearing the likeness of the imperial family were court objects: given by \
the emperor to relatives, dignitaries or allies, they circulated in a \
very restricted circle and were handed down like treasures. This one dates from the reign of \
Claudius, from 41 to 54, who carefully maintained the cult of the deified Augustus. Its history \
over the following centuries is not known. The Metropolitan Museum bought it in 1942 \
thanks to the bequest of Joseph Pulitzer, the press magnate who gave his name to the famous \
journalism prize. It ranks among the finest portraits of Augustus on a cameo, along with \
the Blacas Cameo in the British Museum, whose pose and attributes are very close."""
facture = """
Sardonyx is an agate made of parallel layers of different colours. The \
engraver chooses a stone whose upper layer is white and whose lower layer \
is reddish brown; he removes the white layer everywhere except on the figure, which \
stands out in pale relief against the dark ground. The work is not done with a chisel, but \
by abrasion: drills and small wheels, coated with abrasive powder and oil, \
wear the stone away little by little. Where the white layer thins, the ground shows through and \
gives the face and shoulder their delicate shadows."""
details = [
  "The ribbons of the laurel wreath floating behind the nape.",
  "The Gorgon head, with snaky hair, at the centre of the aegis.",
  "The head of the wind god, with tousled locks, on the aegis.",
  "The baldric crossing the bare shoulder diagonally.",
  "The scales of the aegis, engraved one by one.",
]
themes = ["rome", "emperor", "portrait", "engraved stone", "power"]
anecdote = """
Augustus sealed his letters with an engraved stone. According to the historian Suetonius, he \
first used a sphinx, then the portrait of Alexander the Great, and finally his own \
portrait, engraved by Dioskourides, which his successors continued to use."""
salle = 2
mur = "sud"
place = 2
largeur = 0.75

[[oeuvres]]
titre = "Portable Altar of Countess Gertrude"
artiste = "Basse-Saxe, orfèvrerie du XIᵉ siècle"
annee = "c. 1045"
image = "autel-portatif-gertrude.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1931.462.jpg"
technique = "Gold, cloisonné enamel, porphyry, precious stones, pearls, niello, wooden core; 10.5 × 27.5 × 21 cm"
collection = "Cleveland Museum of Art"
note = "A gold travelling altar, commissioned by a countess of Brunswick: one of the oldest and most sumptuous pieces of the Guelph Treasure. It is 27.5 cm long."
description = """
It is a rectangular casket, a little over a span long, set on a plinth. \
On top, a plaque of dark red porphyry, flecked with white, forms the altar \
stone; the gold frame around it bears a Latin inscription. The four sides \
are galleries of arcades: beneath each arch, between twisted, niello-decorated \
colonnettes, stands a gold figure in relief, upright and nimbed. One recognizes \
Christ, the Virgin, apostles and archangels, but also figures of royal \
and imperial rank. The borders are strewn with coloured stones, pearls and \
small enamel plaques; beneath the altar, a trapdoor gave access to the relics."""
evocation = """
A portable altar made it possible to celebrate Mass outside a consecrated church, while \
travelling or in a private chapel: the bread and wine were placed on the stone, \
above the relics. The object also speaks of the ambition of the woman who gave it. The \
porphyry, a purple stone reserved in Antiquity for emperors, and the presence of \
sovereigns among the saints assert, according to the Cleveland Museum, the claims of \
Gertrude and her family to imperial descent. The inscription says it simply: \
“Gertrude offers to Christ, to live happily in Him, this stone that shines with \
gems and gold.” The precious gift is an exchange: gold given here below for eternal \
salvation."""
histoire = """
Countess Gertrude, widow of Count Liudolf of Brunswick, who died in 1038, had this \
altar made around 1045, together with two gold crosses, one in her own name and the other in her \
husband's, also preserved in Cleveland. It entered the treasury of the church of \
Saint Blaise in Brunswick, the future cathedral, which the Guelphs, dukes of Saxony and then of \
Brunswick, enriched over centuries: this is the Guelph Treasure, or \
Welfenschatz. In 1929, the House of Brunswick-Lüneburg sold the whole to a consortium \
of Frankfurt dealers, who exhibited it in the United States. The Cleveland Museum bought \
the altar in 1931. A large part of the rest, sold in 1935 to the Prussian state, is \
now in Berlin; the heirs of those Jewish dealers have claimed its \
restitution, without obtaining it."""
facture = """
The goldsmith worked the gold in repoussé: each figure is hammered from behind into \
a thin sheet, then reworked with the chaser on the front, before being fixed to the wooden \
core of the casket. The colonnettes are decorated with niello, a black mixture of sulphur \
and metal melted into the engraved hollows, which forms zigzag patterns. The gems \
are set as cabochons, simply polished and rounded: faceting of stones was not yet \
known. Small plaques of cloisonné enamel complete this \
decoration, in which the precious material makes the frame of the altar stone sparkle."""
details = [
  "The porphyry plaque, dark red flecked with white, on top.",
  "The niello colonnettes, twisted like barley sugar.",
  "The gold figures standing beneath the arcades, each with its halo.",
  "The red, blue and green cabochons set in the borders.",
]
themes = ["middle ages", "gold", "relics", "power", "romanesque art"]
anecdote = """
Beneath the altar, a small trapdoor opens onto a cavity in which relics of saints were found, \
wrapped in pieces of silk. The Cleveland Museum keeps them and \
inventories them one by one: relics of Saint Bartholomew, Saint Gregory, Saint \
Vincent or Saint Gertrude."""
salle = 3
mur = "nord"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "Chasse with the Crucifixion and Christ in Majesty"
artiste = "Limoges, ateliers d'émaillerie"
annee = "c. 1180–1190"
image = "chasse-limoges.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Chasse_with_the_Crucifixion_and_Christ_in_Majesty_MET_DT128.jpg"
technique = "Gilt copper, champlevé enamel; 26.2 × 30.2 × 11.6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A house-shaped reliquary shrine, meant to hold relics: the blue and green of Limoges enamel against the gleam of gilt copper. It is 30 cm long."
description = """
The chasse has the form of a house or a small church, set on four feet, with \
a gabled roof crowned by a ridge pierced with keyhole-shaped openings, adorned \
with a crystal cabochon and a sphere. On the front, at the centre, Christ on the cross, \
flanked by the Virgin and Saint John; above the cross, the inscription IHS XPS, \
an abbreviation of Jesus Christ, and two angels in bust form in medallions. On each \
side, beneath arcades, stand two apostles. On the roof, Christ in majesty \
is enthroned in a mandorla, the almond-shaped halo, between six other apostles. The \
figures, in blue and green garments, stand out against a gold ground engraved with scrolling foliage."""
evocation = """
In the Middle Ages, relics, remains or objects that had touched a saint, were at the heart of \
religious life: people came from far away to venerate them and asked of them healing and \
protection. The chasse gives them a dwelling worthy of them, made of gold and colours \
that evoke the heavenly Jerusalem described in the Apocalypse, a city of pure gold and precious \
stones. Its decoration links two moments: on the front, the sacrifice of Christ dead on \
the cross; on the roof, his return in glory at the end of time, surrounded by the apostles. \
Between the two, the relics of the saint, who followed Christ, await the promised \
resurrection."""
histoire = """
In the twelfth and thirteenth centuries, the workshops of Limoges produced enamels in such \
numbers that throughout Europe they were called “the work of Limoges,” opus lemovicense. \
Chasses, of all sizes, went off to churches in France, Spain, \
England or Scandinavia. It is not known for which sanctuary this one was made or \
what relics it contained. Like many church objects, it left its \
place of origin to join the collections of amateurs. The American financier J. \
Pierpont Morgan, one of the greatest collectors of his time, acquired it; after \
his death in 1913, his son gave it in 1917 to the Metropolitan Museum, along with thousands \
of other works from his collection."""
facture = """
Champlevé enamel, the specialty of Limoges, is made on a thick copper plate. \
The enameller gouges out the areas to be coloured with a burin, leaving the outlines in relief; \
he fills the hollows with glass powder coloured by metallic oxides, then fires \
the plate in the kiln, where the powder melts and vitrifies. After polishing, the copper that remains \
visible is gilded and engraved. Here, the figures are enamelled against a gold ground, whereas \
other chasses show gold figures against a blue ground; the faces and hands, \
left in metal, are simply engraved and gilded."""
details = [
  "The inscription IHS XPS above the cross.",
  "The two angels in bust form in the medallions, on either side of the cross.",
  "The mandorla of Christ in majesty, in the middle of the roof.",
  "The ridge pierced with keyhole-shaped openings and its crystal cabochon.",
  "The small blue and white rosettes that border the panels.",
]
themes = ["middle ages", "relics", "enamel", "crucifixion", "limoges"]
anecdote = """
After the murder of Thomas Becket, Archbishop of Canterbury, killed in his cathedral in \
1170, the workshops of Limoges made several dozen chasses illustrating his \
martyrdom, which spread his cult throughout Europe."""
salle = 3
mur = "sud"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Pendant: Cupid in a Niche"
artiste = "Allemagne, orfèvres de la Renaissance"
annee = "c. 1560–1580"
image = "pendentif-amour.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Hanger_in_de_vorm_van_Amor_in_een_nis_Hanger_met_Amor_in_een_nis,_BK-17058.jpg"
technique = "Partly enamelled gold, precious stones, pearls; 5.5 × 3.9 cm"
collection = "Rijksmuseum, Amsterdam"
note = "A Renaissance court jewel: a little Cupid enamelled in white stands in a portico with red columns, above a table-cut stone. It is 5.5 cm high."
description = """
The pendant is built like a small piece of architecture. At the centre, beneath an arch, a \
chubby Cupid, enamelled in white, stands on a green mound, holding his bow. He \
is framed by two columns enamelled in red, beneath a crowning of green and blue \
scrolls adorned with a rectangular green stone; on each side, a small \
fantastic creature enamelled in white leans outward. Beneath his feet, a \
colourless table-cut stone occupies the centre, flanked by two heart-shaped red stones \
and two round pearls. Clusters of gold grains and black and white \
scrollwork complete the whole. An enamelled ring allows it to be hung; an \
irregular pearl dangles beneath."""
evocation = """
Cupid, the god of love whose arrows give rise to passion, was an ideal subject \
for a jewel given as a token of affection or worn in gallantry; the two \
red heart-cut stones restate the theme. In the Renaissance, such pendants were \
worn on the chest, hung from a chain, or pinned to the bodice or the hat; \
they showed the rank, wealth and taste of their owner, man or woman. \
The architectural decoration, with its columns and arch, transposes into gold the \
vocabulary of the ancient monuments brought back into honour by the Italian Renaissance, which \
the northern goldsmiths adopted in the mid-sixteenth century."""
histoire = """
Neither the goldsmith nor the first owner of this jewel is known; it is attributed to a \
German workshop of the 1560s–1580s. At that time, the great cities of the \
Holy Roman Empire, Nuremberg and Augsburg foremost, counted hundreds of goldsmiths \
organized in guilds, and pendant designs circulated thanks to the engravings \
of ornament designers such as Virgil Solis or Erasmus Hornick, which workshops copied and \
combined. These jewels, often dismantled as fashions changed in order to recover the gold and \
stones, have become rare. This one entered the Rijksmuseum in 1960. \
Nineteenth-century collectors sought them so avidly that goldsmiths then made \
imitations, which makes the study of each piece delicate."""
facture = """
The goldsmith assembled numerous small pieces of gold, cast, chased and soldered, \
then covered them with enamel. On the figure of Cupid, a tiny sculpture in \
the round, the opaque white enamel is applied directly over the relief: this is the \
so-called “enamel en ronde bosse,” typical of Renaissance jewels. Elsewhere, the red of the \
columns and the green of the scrolls fill small hollows cut into the gold. The \
stones are set in gold collets. The colourless stone at the centre is table-cut, \
that is, flattened at the top, a cut much prized in the sixteenth century."""
details = [
  "Cupid enamelled in white, standing on his green mound.",
  "The two red stones cut in the shape of hearts.",
  "The clusters of gold grains, on either side of the central stone.",
  "The irregular pearl hanging beneath the jewel.",
  "The suspension ring, enamelled in blue and white.",
]
themes = ["renaissance", "love", "court jewel", "enamel", "pearls"]
anecdote = """
Many of the “Renaissance jewels” in the great museums are in fact nineteenth-century. This \
was realized through study of the drawings of the Aachen goldsmith Reinhold Vasters, \
preserved in the Victoria and Albert Museum in London: in them he prepared skilful \
pastiches, sold as antiques."""
salle = 4
mur = "sud"
place = 1
largeur = 0.75

[[oeuvres]]
titre = "The Crown of the Andes"
artiste = "Popayán, orfèvres de la Nouvelle-Grenade"
annee = "c. 1660 (diadem) and c. 1770 (arches)"
image = "couronne-des-andes.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Crown_of_the_Virgin_of_the_Immaculate_Conception,_known_as_the_Crown_of_the_Andes_MET_DP365520.jpg"
technique = "Gold, repoussé and chased, emeralds; height 34.3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The crown of a statue of the Virgin of the Immaculate Conception, in Popayán, in present-day Colombia: more than two kilos of gold and about 450 emeralds."
description = """
The crown consists of a wide openwork band, the diadem, from which arches rise \
and meet at the top beneath a globe and a cross. The gold, repoussé into thick \
foliage, scrolls and shells, forms a lace of metal in which hundreds of emeralds \
are set: square or rectangular, table-cut, they form \
flowers and crosses; others, drop-shaped, hang freely beneath the \
arches. A row of small aligned emeralds runs along the base. At the top, the openwork globe \
bears a cross covered with emeralds. Thirty-four centimetres high, the crown was \
made for a statue larger than life."""
evocation = """
The crown makes of the Virgin a queen, the queen of heaven, according to an image dear to the \
Catholic Church, and the richness of its materials speaks of the fervour of an entire \
city. In Spanish America, statues of the Virgin and the saints were \
dressed, adorned and crowned for feasts and processions; their jewels, \
given by the faithful and the confraternities, formed the community's common treasure. \
The crown also tells a colonial story: the region's gold was mined by \
enslaved Africans, and the emeralds came from the Colombian mines \
worked by the Spanish. Its decoration, Baroque and then Rococo, follows the fashions of \
Europe, as interpreted by local goldsmiths."""
histoire = """
According to tradition, the people of Popayán offered a crown to the Virgin after \
being spared by a smallpox epidemic in the 1590s. The object that has come down to \
us is composite: the globe and cross would date from the sixteenth century, the \
diadem from around 1660, and the arches were added around 1770. For \
centuries, the confraternity of the Immaculate Conception brought it out for Holy Week. In \
1914 it obtained from the pope permission to sell it for the benefit of charitable works, \
but the buyer, a group of American investors assembled by Warren J. Piper of \
Chicago, did not come forward until 1936. Exhibited in the United States and put up for \
sale several times, it entered the Metropolitan Museum in 2015; in Colombia, voices called for \
its return."""
facture = """
The goldsmiths worked 18- to 22-carat gold in repoussé, hammering it from \
behind to raise the reliefs, then chased it and pierced it so that \
light passes through the crown. The emeralds, of varied sizes and qualities, are \
set in gold bezels: many are table-cut, others pear-cut. The \
two campaigns of work can be read in the decoration: fleshy, symmetrical foliage \
on the diadem, lighter scrolls on the arches, in keeping with eighteenth-century taste."""
details = [
  "The drop-shaped emeralds hanging beneath the arches.",
  "The cross at the top, made of aligned rectangular emeralds.",
  "The openwork globe that bears the cross.",
  "The regular row of small emeralds at the base of the band.",
]
themes = ["emerald", "gold", "virgin mary", "spanish america", "baroque"]
anecdote = """
The largest emerald of the crown is nicknamed “the Atahualpa emerald”: it is said that it \
belonged to the last Inca emperor, captured by Francisco \
Pizarro in 1532. No document proves it."""
