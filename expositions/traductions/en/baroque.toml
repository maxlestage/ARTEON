[exposition]
ordre = 40
nom_court = "Baroque"
mouvement = "Baroque"
cadre = "baroque"
couleur = "#7a2e2a"
titre = "The Baroque, the Theater of Light"
artiste = "Caravaggio, Artemisia, Rubens, Velázquez, Poussin…"
dates = "1599–1678"
accroche = "Virtual exhibition · Prado Museum, Madrid"
introduction = """
In the 17th century, European painting sought to seize and to move: Caravaggio's dramatic light, Rubens's quivering flesh, Velázquez's unsettling truthfulness, but also the serene order of Poussin and Claude Lorrain. The visit brings together nine painters, from Rome to Seville and from Antwerp to Lorraine, in ten canvases. The building is inspired by the Prado Museum in Madrid: a long vaulted central gallery with dark red walls and, at its middle, the room where Las Meninas awaits the visitor."""
vitrine = "menines.jpg"

[musee]
nom = "Prado Museum"
ville = "Madrid, Spain"
architecte = "Juan de Villanueva"
construction = "1785–1819"
presentation = """
In 1785, Charles III entrusted Juan de Villanueva with the construction, on the Paseo del Prado, of a natural history cabinet, the centerpiece of a district devoted to the sciences together with the neighboring botanical garden. The works, interrupted by the war against Napoleon, were completed under Ferdinand VII, who installed in it the paintings of the royal collections: the Royal Museum of Painting and Sculpture opened on 19 November 1819. The neoclassical building, of brick and granite, stretches along the promenade; at the center of its façade, a columned portico forms the Velázquez Door. Inside, a long vaulted gallery, lit from above, distributes the rooms. The kings of Spain having collected Titian, Rubens, Bosch and their own court painters, the Prado holds the greatest ensembles of Velázquez and Goya, with Las Meninas and The Third of May 1808. Rafael Moneo enlarged it in 2007 around the cloister of the Jerónimos."""
ici = """
The ARTEON building takes up the layout of the Prado: an entrance in the middle of the façade and a long gallery running through it. One enters from the south into the Velázquez vestibule, then into the central gallery, forty meters long and twelve high, with dark red walls. Opposite, to the north, opens the room of Las Meninas, square, with gray-green walls. At the west end of the gallery, the room “Chiaroscuro”, red as well; at the east end, the room “The Classical Landscape”, in a pale green."""

