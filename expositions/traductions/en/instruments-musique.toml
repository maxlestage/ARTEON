note = "A thirteen-string zither adorned by Gotō Teijō, master metalworker of the Gotō family, presented with its lacquered case, its silk cover and its bridges."
description = """
Three elements are laid one beneath the other. At the top, a long case of black lacquer, with a slightly domed lid, decorated with golden cranes set within circles and with birds in flight, is tied with an orange cord. In the middle, the koto itself, nearly two meters long: a slightly arched body, whose wood shows an undulating grain, its ends ornamented with tortoiseshell, ivory and chased metal. At the bottom, the cover of blue silk brocaded with floral motifs, edged with red pompons, with its lining of gold brocade, and, in front of it, a small pouch and the thirteen bridges, lined up like tiny painter's easels."""
evocation = """
The koto, which came from China in the 7th or 8th century, is in Japan the instrument of the aristocracy, the one played by court ladies in the novels of the Heian period. This sumptuous koto belongs to the moment when warrior society adopted these refinements. The cranes, birds of long life, wish happiness and longevity to its owner; the lions and metal flowers that ornament its ends are motifs of prestige. The care devoted to the case, the cover and the bridges shows that the object was handed down like a family treasure, wrapped, stored and unwrapped according to a veritable ceremonial."""
histoire = """
According to a tradition reported by the museum, this koto was given by the lord Hosokawa Tadaoki to the court noble Karasumaru Mitsuhiro, to thank him for having helped, in 1600, to lift the siege of Tanabe Castle, where Tadaoki's father, Hosokawa Yūsai, was shut in. Its metal ornaments are attributed to Gotō Teijō, ninth master of the Gotō family. The lacquered case was made later, in the early 19th century, and the cover dates from the 18th and 19th centuries. The Metropolitan Museum bought it in 2007. The curator Ken Moore sees in it the witness of an important stage in the history of Japanese music."""
facture = """
The koto is a long hollow body, over which thirteen silk strings are stretched; each rests on a movable bridge that is shifted to tune the instrument. The musician, kneeling, plucks the strings with the right hand using picks worn on three fingers. Here, the ends are covered with geometric inlays of ivory, tortoiseshell, gold and silver, and with small metal sculptures, lions and flowers, framed with ivory. The thirteen bridges are fitted and capped with silver."""
details = [
  "The golden cranes in circles, on the lid of the case.",
  "The undulating grain of the wood of the koto's body.",
  "The ends of the koto, where the tortoiseshell and metal shine.",
  "The thirteen bridges lined up in the foreground.",
  "The red pompons that edge the blue silk cover.",
]
themes = ["Japan", "koto", "lacquer", "metalwork", "samurai", "crane"]
anecdote = """
The tradition attached to this koto states that it took a thousand days to complete. The figure is probably symbolic, but the profusion of its inlays and metal ornaments suggests several years of work."""
salle = 4
mur = "est"
place = 2
largeur = 2.9

[[oeuvres]]
titre = "Kora"
artiste = "Tradition mandingue"
annee = "before 1918"
image = "kora.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1918.352"
technique = "Gourd, wood, hide, strings and cords; height 111.8 cm, diameter of the gourd 32.4 cm"
collection = "Cleveland Museum of Art"
note = "The harp-lute of the griots of West Africa: it had twenty-one strings, of which only a few remain."
description = """
A large gourd cut in half, covered with a taut, yellowed hide, forms a round body some thirty centimeters across. A long wooden neck passes right through it: it emerges as a point under the body and rises, slightly curved, well above it. On the hide stands a tall wooden bridge, notched, which held the strings in two rows. On either side of the neck, two short wooden handles protrude from the body: the musician grasps them to hold the instrument in front of him. Only a few strings survive. The edge of the hide is fixed by small wooden pegs driven all around the gourd."""
evocation = """
Among the Mandinka peoples, the kora is the instrument of the griots, the jeli, keepers of memory. From generation to generation, these families of musicians transmit genealogies, the praises of lineages and the great epics, such as that of Sundiata Keita, founder of the empire of Mali. To play the kora is thus to make history speak. This worn kora, deprived of most of its strings, bears on its back stitches that repair old cracks: a sign that it served for a long time and that it was important to keep it in playing condition."""
histoire = """
The kora is played in Gambia, Senegal, Guinea, Guinea-Bissau and Mali; oral tradition places its origin in the former kingdom of Kaabu. At the end of the 18th century, the Scottish explorer Mungo Park already described a large harp with eighteen strings, which he called a korro. It is not known where or by whom this example was made, nor how it left West Africa, then under French and British colonial rule. It was given to the Cleveland Museum of Art in 1918 by Ralph King, with other musical instruments."""
facture = """
The body is a gourd, the dried fruit of a climbing plant, cut and covered with a stretched cowhide. The neck, of hard wood, passes through the gourd and serves as the axis of the whole instrument. The twenty-one strings, formerly of leather strips, today often of nylon line, start from a ring at the base, pass through the notches of the bridge in two rows, and are tied to the neck by leather rings that are slid to tune. The musician plucks the strings with the thumbs and index fingers, playing at once a bass line, a repeated pattern and improvisations."""
details = [
  "The tall notched bridge standing on the hide.",
  "The two wooden handles that flank the neck.",
  "The small pegs driven around the gourd.",
  "The tip of the neck, which emerges under the body.",
]
themes = ["West Africa", "griot", "memory", "kora", "epic"]
anecdote = """
The kora is today one of the best-known African instruments in the world. Since the 1970s, griots who play the kora have performed in the great concert halls and recorded with jazz, classical and blues musicians."""
salle = 5
mur = "ouest"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Harp with Human Head"
artiste = "Style mangbetu"
annee = "before 1928"
image = "harpe-mangbetu.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1929.344"
technique = "Wood, hide, plant fiber, metal, glass bead; neck: 36.9 cm"
collection = "Cleveland Museum of Art"
note = "A five-string harp whose neck ends in a head with an elongated skull, according to the Mangbetu ideal of beauty."
description = """
The resonating body, laid flat, has the shape of a boat or a large fish: a wooden hull covered with a dark hide, pierced with small holes, whose end tapers. From the other end rises the neck, which climbs in an arc and ends in a small carved human head. This face with half-closed eyes bears a very elongated skull, stretched backward, and at the ear a blue glass bead. Along the neck, five wooden pegs are set one above the other; five fine strings run from them, descending diagonally to the hide of the body. The wood, dark and patinated, has taken on the sheen of metal."""
evocation = """
Among the Mangbetu of northeastern Congo, the elongated head was a sign of beauty and rank: the skulls of infants were bound to stretch them, and this shape was emphasized by a fan-shaped hairstyle. By giving this face to his harp, the sculptor makes it a person, almost a portrait, who seems to sing with the musician. It has been shown that many of these figurative objects were made in the early 20th century for European visitors, soldiers and administrators, who sought them out: the harp also speaks of the unequal encounter between an African court and the colonial gaze."""
histoire = """
Five-string harps adorned with a human figure were played by several peoples of northern Congo, to accompany the songs of men or women; the elongated skull of this one is characteristic of the Mangbetu. It was acquired in 1928 at Ekibondo, then in the Belgian Congo, under colonization, by the Cleveland painter Paul Travis, during his journey in central Africa. He bought it on behalf of the association African Art Sponsors and of the Gilpin Players, Cleveland's African American theater company, who then gave it to the Cleveland Museum of Art."""
facture = """
The body is hollowed from a single piece of wood, then covered with a stretched hide, held by pegs or stitching. The neck, fitted into the body, is carved with the head from the same piece of wood. The strings, of plant fiber, wind around the pegs and are attached, at the bottom, as on most harps of the region, to a rod placed under the hide, which transmits their vibrations. The sculptor worked the head with great economy: a few clean planes for the forehead, the eyelids and the mouth, and the spectacular stretching of the skull."""
details = [
  "The blue glass bead hanging at the ear.",
  "The skull stretched backward, at the top of the neck.",
  "The five pegs lined up along the neck.",
  "The small holes pierced in the hide of the body.",
]
themes = ["central Africa", "Mangbetu", "harp", "portrait", "colonization"]
anecdote = """
The Gilpin Players, for whom this harp was bought, were the theater company of Karamu House, in Cleveland, one of the oldest African American theaters in the United States. Their African collection joined the Cleveland museum as early as 1929."""
salle = 5
mur = "est"
place = 2
largeur = 1.3

[[artistes]]
nom = "Michele Todini"
vie = "Saluzzo (Piedmont), baptized 1616 – Rome, 1690"
biographie = """
Born in Piedmont, Michele Todini settled in Rome in his youth and made a career there as a musician; he was connected with the congregation of Santa Cecilia, which brought together the city's musicians. But his passion lay elsewhere: mechanics applied to music. For years, he imagined and had built transforming instruments, keyboards that control several instruments at once, sound automata. From the 1650s, he gathered them in his Roman house, which he opened to visitors under the name Galleria Armonica. It was one of the first museums of musical instruments in the world. In 1676 he published its description, the Dichiaratione della Galleria Armonica, which today makes it possible to reconstruct what he displayed. To produce his machines, Todini surrounded himself with sculptors, gilders and painters, such as the landscape painter Gaspard Dughet. The undertaking, too ambitious, caused him serious financial difficulties. After his death, the collection was dispersed; of the entire Galleria, only the gilded harpsichord in the Metropolitan Museum has come down to us."""
style = """
Todini is not a maker in the usual sense: he is an inventor and a stage director. He combines music, sculpture, painting and mechanics in spectacular ensembles, inspired by mythology, which were meant to surprise the visitor as much as to charm him. His machines belong fully to the culture of Baroque Rome, fond of animated fountains, theater sets and cabinets of curiosities."""

[[artistes]]
nom = "Bartolomeo Cristofori"
vie = "Padua, 4 May 1655 – Florence, 27 January 1731"
biographie = """
Little is known of Bartolomeo Cristofori's early years in Padua, where he probably learned harpsichord making. In 1688, Grand Prince Ferdinando de' Medici, son of the Grand Duke of Tuscany and a passionate music lover, hired him in Florence to maintain and build the instruments of his court. Cristofori had a workshop, assistants and resources. He built harpsichords, spinets and stringed instruments, and invented several mechanisms. Around 1700, he developed a harpsichord whose strings are struck by hammers rather than plucked: a court inventory mentions it that year. In 1711, the writer Scipione Maffei published in a learned journal a description of the invention, with a drawing of the mechanism; translated into German, the article made the process known beyond the Alps. After the death of the Grand Prince, in 1713, Cristofori remained in the service of the Medici as curator of their collection of instruments. He continued to perfect his piano until the end of his life. Three of his pianos survive, in New York, Rome and Leipzig, along with a few harpsichords and spinets."""
style = """
Cristofori is an engineer as much as a craftsman. His instruments are sober on the outside, but their mechanism is astonishingly ingenious: the escapement, which releases the hammer after the blow, and the dampers have remained the principles of all pianos. He also designed sturdier cases to withstand more tightly stretched strings. Without him, neither Mozart's piano, nor Beethoven's, nor the modern piano would have existed."""

[[artistes]]
nom = "Andrea Amati"
vie = "Cremona, c. 1505 – Cremona, c. 1577"
biographie = """
Andrea Amati is the first great luthier of Cremona, a city of Lombardy then under Spanish rule. Little is known of his training; he was established in his own house and his own workshop in the 1530s. He first built lutes and viols, then devoted himself to a family of instruments still new: the violin, viola and cello. His talent brought him prestigious commissions, notably from the court of France, for which he made several sets of painted and gilded instruments, the most famous of which bears the arms of King Charles IX. His two sons, Antonio and Girolamo, took over the workshop; his grandson Nicolò Amati, in the 17th century, would be the most famous luthier of his time and would train, in all likelihood, Andrea Guarneri and perhaps Antonio Stradivari. Thus, from the workshop of Andrea Amati came the whole Cremonese school of violin making, which dominated Europe for nearly two centuries. His instruments, rare, are today among the most precious in the history of violin making."""
style = """
Andrea Amati gave the violin its almost definitive form: a body with two waists, pronounced arching, f-holes, carved scroll. His instruments, small in size, with a golden varnish, have a sweet, clear sound. He founded the Cremonese method, which rests on interior molds and on geometric proportions drawn with compasses, passed on to his descendants and then to their pupils."""

[[artistes]]
nom = "Antonio Stradivari"
vie = "Cremona (?), c. 1644 – Cremona, 18 December 1737"
biographie = """
The exact date and place of Antonio Stradivari's birth are unknown, probably Cremona, around 1644. A label of 1666 calls him a pupil of Nicolò Amati, though this training is not certain. Set up on his own, he first worked in the spirit of the Amatis, then experimented, in the 1690s, with a more elongated violin. Around 1700 began what specialists call his golden period, which lasted some twenty years: his violins then took on their most accomplished form. He lived and worked in a house on the Piazza San Domenico in Cremona, with his sons Francesco and Omobono, who helped him in the workshop. His clients were princes, courts and churches from all over Europe. He also built cellos, violas, guitars and harps. He worked until past the age of ninety. It is estimated that he made more than a thousand instruments, of which about six hundred survive. In the 19th century, virtuosos such as Paganini and Parisian dealers made his name a legend."""
style = """
Stradivari's violins are recognized by their elegance: a broad, balanced outline, arching lower than that of the Amatis, slender sound holes, a transparent orange-red varnish. Their sound, at once powerful and rich, suits the great concert halls. They have served as the model for almost all luthiers for two centuries, and remain sought after by the greatest soloists."""

[[artistes]]
nom = "Joseph Benedid"
vie = "Cádiz (Spain), 1760 – 1836"
biographie = """
The life of Joseph Benedid is poorly known. He worked in Cádiz, in Andalusia, in the second half of the 18th century and the early 19th. The city was then one of the richest in Spain: since 1717, it had concentrated trade with the colonies of America, and its merchant bourgeoisie frequented the theaters, salons and cafés where people sang and danced to the sound of the guitar. Cádiz became a center of guitar making, around the Pagés family and Benedid. These craftsmen took part in a decisive transformation of the instrument: they built six-course guitars, broader and sturdier, and reinforced the top with bars arranged in a fan. The guitar in the Metropolitan Museum, dated 1787, already shows these two novelties. In the early 19th century, the guitarist and composer Fernando Sor cites Benedid among the makers whose instruments he appreciates. In the following years, the double strings gave way to six single strings, and the Andalusian makers played a major role in the birth of the classical guitar."""
style = """
Benedid's guitars are light, with a narrow body and a pronounced waist, restrainedly decorated with dark inlays around the rosette and the bridge. Their fan bracing, still discreet, heralds that of Antonio de Torres, who would fix in the 19th century the form of the classical guitar still played today."""

[[artistes]]
nom = "Manol (Emmanuel Venios)"
vie = "Folegandros (Greece) or Istanbul, 1838 or 1845 – Istanbul, 1915 or 1916"
biographie = """
Emmanuel Venios, whom all of Istanbul called Manol, belonged to the Greek Orthodox community of the Ottoman capital. Sources disagree on his birth: the Metropolitan Museum has him born on the island of Folegandros in 1838, others in Istanbul in 1845. He is said to have been first a carpenter and cabinetmaker before devoting himself to instrument making, in the 1870s. In Constantinople, a city where Turks, Greeks, Armenians and Jews rubbed shoulders, he built ūds and lavtas for the musicians of all communities, those of the cafés as well as those of the salons. His workshop enjoyed great success, and his instruments were sought after for their sound, their lightness and the finesse of their decoration. He is credited with the invention of the modern Turkish ūd, smaller and tuned higher than the Arab ūd. He died in 1915 or 1916, during the First World War. His ūds are today collectors' pieces, played by the greatest musicians, and have been copied by generations of luthiers in Turkey, Greece and Armenia."""
style = """
Manol's ūds are recognizable by their light body made of very thin ribs, by their three finely pierced rosettes and by their mother-of-pearl decoration, restrained or lavish according to the commission. Their sound, clear and powerful, defined that of the Turkish ūd. They remain the reference model for luthiers who make ūds in the Ottoman style."""

[[artistes]]
nom = "Inde du Sud"
vie = "Tamil Nadu, Karnataka, Andhra Pradesh and Kerala; learned tradition from the Middle Ages to the present"
biographie = """
Southern India has its own tradition of classical music, Carnatic music, distinct from the Hindustani music of the North. It rests on ragas, melodic modes associated with emotions and moments, and on rhythmic cycles, the talas; it is above all vocal and largely religious, sung in honor of the gods. For centuries, it was cultivated in the temples and at the courts of rulers, in particular at Thanjavur, where the Nayaks and then the Marathas maintained musicians, poets and dancers. At the turn of the 18th and 19th centuries lived the three great composers of this tradition, Tyagaraja, Muthuswami Dikshitar and Syama Sastri, whose songs are still at the heart of the repertoire. The instruments of the South, vina, violin adopted in the 19th century, bamboo flute, mridangam drum, serve first to accompany or imitate the voice. The craftsmen who make them, often from families of carpenters and sculptors, work jackfruit wood, lacquer, gold leaf and paint, as for the objects of temples."""
style = """
The instruments of southern India are distinguished by their bodies carved from the solid, their heads sculpted with protective monsters, the yalis, and a decoration in which gilding, floral painting and ivory or bone are combined. Their form is designed for playing seated on the floor and for the glides between notes, the gamakas, that make Carnatic music expressive."""

[[artistes]]
nom = "Atelier des Gotō"
vie = "Kyoto, then Edo (Japan), from the late 15th to the 19th century"
biographie = """
The Gotō family is the most famous dynasty of metalworkers in Japan. Its founder, Gotō Yūjō, who died in 1512, served the shogun Ashikaga Yoshimasa in Kyoto and specialized in sword fittings: small metal ornaments, guards, hilts, which warriors wore like jewels. For seventeen generations, the Gotō masters passed down the name, the models and the secrets of the workshop. They worked for the shoguns and great lords, and one branch of the family was charged, from the end of the 16th century, with making the great official gold pieces, the ōban. In the 17th century, under the Tokugawa shogunate, the workshop was divided between Kyoto and the new capital, Edo. Gotō Teijō, ninth master, born in 1603 and died in 1673, is regarded as one of the most skilled of the line: it is to him that the metal ornaments of the koto in the Metropolitan Museum are attributed. The Gotō style, highly codified, became the official style of sword fittings for high-ranking samurai until the 19th century."""
style = """
The Gotō work small reliefs of gold, silver and shakudō, an alloy of copper and gold patinated black, on finely granulated grounds. Their favorite subjects, lions, dragons, flowers, animals and family emblems, are chased with meticulous precision and great restraint. Their art, conceived for ceremonial, favors technical perfection and respect for the models handed down."""

[[artistes]]
nom = "Tradition mandingue"
vie = "West Africa: Gambia, Senegal, Guinea, Guinea-Bissau, Mali; since the Middle Ages"
biographie = """
The Mandinka, or Mande, are a group of peoples of West Africa, Malinke, Mandinka, Bambara and others, who claim descent from the empire of Mali, founded in the 13th century by Sundiata Keita. Their society was long organized into hereditary groups, among them that of the jeli, the griots. These families of musicians, storytellers and genealogists are the keepers of memory: they transmit orally the history of lineages, the praises of great families and the epic of Sundiata. Griots serve as counselors, mediators and masters of ceremonies; their instruments, the kora, the balafon, a gourd xylophone, and the ngoni, a small lute, are passed from father to son along with the repertoire. The kora seems to have appeared in the west of the Mandinka world, in the former kingdom of Kaabu, on the borders of Gambia, Casamance and Guinea-Bissau. In the colonial period, the griot tradition endured despite upheavals. Since independence, it has enjoyed worldwide renown, thanks to kora players who have become international stars."""
style = """
The music of the Mandinka griots rests on repetition and variation: a basic pattern, played in a loop, serves as the ground for improvisations and for the song of praise or narrative. The instruments are made of natural materials, gourd, wood, hide, leather, and their making, simple in appearance, demands great knowledge of tuning and sound."""

[[artistes]]
nom = "Style mangbetu"
vie = "Northeastern Democratic Republic of the Congo, 19th – 20th century"
biographie = """
The Mangbetu live in the forest and savanna of the northeast of the present-day Democratic Republic of the Congo, near the Uele River. In the 19th century, they formed a powerful kingdom, whose rulers lived in vast courts surrounded by musicians, dancers and craftsmen. The first European travelers, in the 1870s, described these courts and their objects with admiration. At the end of the 19th century, the region was conquered and incorporated into the Congo Free State, the personal property of King Leopold II of the Belgians, then into the Belgian Congo from 1908. Administrators, soldiers and European travelers then sought out Mangbetu objects, particularly those bearing the characteristic elongated head: statuettes, pottery, boxes, knives and harps. Sculptors, Mangbetu but also Zande and other neighboring peoples, multiplied these figures, in part for this new public. Art historians have shown that a Mangbetu style was thus formed in the early 20th century, at the crossroads of court traditions and colonial demand."""
style = """
The Mangbetu style is recognized by its heads with skulls stretched backward, with fine, calm features, sometimes enhanced by a fan-shaped hairstyle or a bead. The sculptors apply it to utilitarian objects, harps, pottery, boxes, which they transform into human figures. The work of the wood, smooth and patinated, seeks elegance and economy of form."""
