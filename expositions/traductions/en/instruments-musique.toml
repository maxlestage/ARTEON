[[oeuvres]]
titre = "The Gilded Harpsichord"
artiste = "Michele Todini"
annee = "c. 1670"
image = "clavecin-todini.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Harpsichord_MET_DP204706a.jpg"
technique = "Carved and gilded wood, ebony, ivory, parchment; harpsichord case: 37.5 × 299.7 × 96.5 cm"
collection = "Metropolitan Museum of Art, New York (Crosby Brown Collection)"
note = "A harpsichord carried by tritons, between the Cyclops Polyphemus and the nymph Galatea: the only surviving object from the museum of instruments that Michele Todini had opened in Rome."
description = """
Everything is gold. At the center, the long case of the harpsichord, almost three meters, rests on the shoulders of two tritons, half men and half fish, whose tails coil in the waves. Between them, two nereids emerge from the water, arms outstretched, as if swimming. At the right, a fantastic fish with open jaws carries a large shell on which a small cupid sits. The curved base imitates a dark sea and rests on lion's paws. The side of the case is covered with a relief frieze in which chariots, sea horses and deities parade: the triumph of Galatea. On either side, on two black rocks, face one another the Cyclops Polyphemus, seated, blowing into a bagpipe, and Galatea, nude, a scarf fluttering in the wind."""
evocation = """
The scene comes from Ovid's Metamorphoses. The Cyclops Polyphemus loves the nymph Galatea, who prefers the young shepherd Acis; he sings of his love, in vain, then crushes his rival under a boulder. Here, Todini retains only the music: the giant plays to charm the nymph, and the harpsichord becomes the sea chariot on which she triumphs. At once instrument, sculpture and theater set, the object speaks of Baroque Rome's taste for the marvelous, for machines and effects of surprise, in the age of Bernini. It also tells what music was in the palaces: a spectacle as much as an art, made to dazzle visitors."""
histoire = """
A musician settled in Rome, Michele Todini opened in his house, from the 1650s, a Galleria Armonica, one of the first museums of musical instruments, which he described in a booklet published in 1676. This “machine” was its centerpiece. A payment document of 1672 names the sculptor Jacob Reiff; the gilding is attributed to Basilio Onofri. Behind the whole hung three seascapes painted by Gaspard Dughet, now lost. After Todini's death, the collection was dispersed; the harpsichord passed through several hands before entering the Metropolitan Museum with the instrument collection of Mary Elizabeth Adams Brown. Curators believe that the figure of Galatea may not be the original one."""
facture = """
The harpsichord proper is a classic Italian instrument, with a thin case, whose strings are plucked by small quills when the keys are pressed; it is housed in a second case, carved and gilded, which serves as its casket. The figures are carved in wood, then covered with a thin layer of ground and gold leaf. The gilder played on the contrast between the shining gold of the bodies and the dark green of the sea. The composition stretches out like a bas-relief: the figures lean on one another, and the eye glides from Polyphemus, at the left, to Galatea, at the right."""
details = [
  "Polyphemus, at the left, puffing his cheeks into his bagpipe.",
  "The little cupid seated on the shell, at the right, above the fish.",
  "The lion's paws that carry the base.",
  "The frieze of the triumph of Galatea, on the side of the case.",
  "The dark waves of the base, from which the nereids emerge.",
]
themes = ["mythology", "Baroque", "Rome", "gold", "harpsichord", "spectacle"]
anecdote = """
The ensemble was a true machine: Todini combined other sounds with the harpsichord, probably a small organ. The mechanism and the pipes have disappeared, and it is still debated whether they could have fitted inside Polyphemus's rock."""
salle = 1
mur = "ouest"
place = 2
largeur = 3.4

[[oeuvres]]
titre = "Pianoforte"
artiste = "Bartolomeo Cristofori"
annee = "1720"
image = "piano-cristofori.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Grand_Piano_MET_DP300941.jpg"
technique = "Cypress, boxwood, leather, fir, paint; height on its stand: 86.5 cm"
collection = "Metropolitan Museum of Art, New York (Crosby Brown Collection)"
note = "The oldest surviving piano in the world, built in Florence by the man who invented the instrument."
description = """
At first sight one would take it for a harpsichord. The wing-shaped case is painted black on the outside and shows, inside, the pale wood of the cypress. The lid, in two parts, is raised and held by a simple rod; it reveals the soundboard, over which the strings stretch from the keyboard toward the tip of the wing. The keyboard, at the front, lines up pale boxwood keys and dark keys for the sharps. The instrument rests on three turned legs, painted black, joined to feet. No ornament, no gilding: the invention is hidden inside the case, in the row of small hammers."""
evocation = """
This austere piece of furniture contains a revolution. On a harpsichord, whether the musician strikes hard or softly, the plucked string always sounds the same. Here, each key launches a hammer against the string: the harder the finger presses, the louder the sound. The keyboard becomes capable of nuance, of crescendos, of song. All piano music, from Mozart to Chopin and beyond, flows from this idea. Before this modest instrument, one measures how often great inventions have an ordinary appearance: nothing tells the visitor that this is where the history of the piano begins."""
histoire = """
A harpsichord maker born in Padua, Bartolomeo Cristofori entered the service of Grand Prince Ferdinando de' Medici in Florence in 1688 to maintain the instruments of the court. A Medici inventory of 1700 already mentions an “arpicimbalo”, newly invented by Cristofori, that plays soft and loud. In 1711, the writer Scipione Maffei published a description of it, with a drawing of the mechanism. Three Cristofori pianos survive: this one, dated 1720, and two others of 1722 and 1726, in Rome and Leipzig. The one in New York entered the Metropolitan Museum with the Crosby Brown collection. In the late 1930s, an unfortunate restoration replaced its soundboard, its bridge and other original parts."""
facture = """
Cristofori's genius lies in the mechanism. The key lifts an intermediate lever that throws the hammer, covered in leather, against the string; an escapement immediately releases the hammer, which falls back to let the string vibrate instead of stifling it. A check catches it on the fly so that it does not rebound, and a damper settles on the string when the key is released. These principles, escapement and dampers, are still those of today's pianos. The case takes up the light construction of Italian harpsichords, in cypress."""
details = [
  "Above the keyboard, a Latin inscription: Cristofori, of Padua, inventor, made it in Florence in 1720.",
  "The simple rod that holds the lid open.",
  "The pale boxwood keys and the dark sharps, as on our pianos.",
  "The curve of the wing, which follows the decreasing length of the strings.",
]
themes = ["invention", "piano", "Florence", "Medici", "mechanics"]
anecdote = """
Cristofori did not call his invention a “piano”. Court documents speak of a harpsichord that plays “piano e forte”, soft and loud. It is this expression, shortened to pianoforte, then to piano, that gave the instrument its name."""
salle = 1
mur = "est"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Violin, called the “Kurtz”"
artiste = "Andrea Amati"
annee = "c. 1560"
image = "violon-kurtz.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ex_%22Kurtz%22_Violin_MET_DP302645.jpg"
technique = "Spruce, maple, ebony, paint and gilding; height 57.4 cm"
collection = "Metropolitan Museum of Art, New York"
note = "One of the oldest known violins, from the workshop that gave the violin its form. 57 cm high, it is shown here enlarged."
description = """
The violin stands, slightly turned, in a beam of light that sets it off from the black background. Its golden-brown varnish, worn in places, lets the grain of the spruce show on the top. The two f-shaped sound holes open wide on either side of the bridge; higher up, the ebony fingerboard rises toward a finely carved scroll, flanked by turned and ornamented pegs. On the ribs, the strips of wood that form the sides of the violin, one reads capital letters painted in gold: a few letters of a Latin motto. On the back, invisible here, traces of a painted decoration survive: fleurs-de-lis in the corners, geometric and floral motifs, and at the center the remains of an effaced coat of arms."""
evocation = """
The motto on the ribs, “Quo unico propugnaculo stat stabitque religio”, can be translated: “by this one bulwark, religion stands and will stand”. The bulwark is the Catholic king, at the moment when the Wars of Religion are tearing France apart. The fleurs-de-lis designate the house of Valois. This violin is therefore not merely an instrument: it is a court emblem, painted with the arms of a sovereign. It also tells of the rise of the violin, then a recent instrument, played for dancing, which princes began to order by whole sets, and which would become in a century the king of the orchestra."""
histoire = """
Andrea Amati worked in Cremona, in Lombardy, in the middle of the 16th century. The court of France commissioned from him several sets of decorated violins, violas and cellos, the most famous of which bears the arms of Charles IX. The “Kurtz” violin belongs to another set, marked with the motto on its ribs; curators at the Met have proposed linking it to the marriage of Philip II of Spain with Elisabeth of Valois, daughter of Henri II, in 1559, without certainty. It owes its nickname to the violinist Arved Kurtz, who owned it from 1941 to 1991. The Metropolitan Museum bought it in 1999."""
facture = """
Amati builds his instruments from simple geometric proportions, drawn with compasses, which fixed the pattern of the violin for a long time: a body with two waists, a vaulted spruce top, a maple back and ribs, f-holes and a scroll. The top is carved from solid wood, then hollowed out; an inlaid purfling underlines the edges. The painted and gilded decoration, applied on the wood, made each instrument of a set a unique piece of a single service, like state tableware."""
details = [
  "On the rib, at the left, the gilded letters of a Latin word.",
  "The turned and ornamented pegs, on either side of the pegbox.",
  "The finely carved scroll, at the top of the neck.",
  "The wide, open sound holes, typical of the first violins.",
  "The wear of the varnish at the center of the top, under the bridge.",
]
themes = ["violin", "Cremona", "Renaissance", "court", "motto"]
anecdote = """
The instruments of Andrea Amati for the court of France are among the oldest datable violins. Before them, no surviving violin can be dated with certainty: it is in Cremona that the material history of the violin begins."""
salle = 2
mur = "nord"
place = 1
largeur = 1.2

[[oeuvres]]
titre = "Violin, called the “Antonius”"
artiste = "Antonio Stradivari"
annee = "1711"
image = "violon-antonius.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:%22The_Antonius%22_Violin_MET_DP105130.jpg"
technique = "Maple, spruce, ebony; height 58.4 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A violin from Stradivari's great period, whose date the museum was able to read thanks to ultraviolet light. 58 cm high, it is shown here enlarged."
description = """
Seen from the front, against a light gray background, the violin shows its spruce top, with a fine, tight grain at the center that widens toward the edges. The varnish, an orange-brown, is worn in several places, notably under the bridge, where the violinist's hand and chin rubbed it for generations. The sound holes, long and elegant, frame a pale bridge; below, the ebony tailpiece is held by a button. The black fingerboard rises to the pegbox, where four dark pegs hold the strings, then to the scroll. An inlaid purfling runs around the edge of the body."""
evocation = """
The name of Stradivari has become, in every language, synonymous with perfection. Before this violin, however, one understands that it is first of all a working tool: its worn varnish tells of two centuries of music, bowing and rehearsals. People have often sought a secret of Stradivari, in the varnish, the wood or a chemical treatment; specialists see in it rather the culmination of a long life of experiments, measurements and repeated gestures. The violin also tells the history of women musicians: it belonged to an American violinist, who played it until her death."""
histoire = """
Antonio Stradivari built it in Cremona in 1711, in the heart of what is called his golden period. Later it was sold in Geneva to an American woman, Anne Faye Matthews, who played it until her death in 1915. Her daughter, the Boston sculptor Annie Bolton Matthews Bryant, inherited it with another Stradivari, the “Francesca”, and bequeathed both violins to the Metropolitan Museum, where they arrived in the spring of 1934. Its date was long debated: the will spoke of 1721, a New York expert read 1717 in the 1950s. The museum's study established that the label reads “17ii”, that is, 1711."""
facture = """
After experiments with an elongated model in the 1690s, Stradivari adopted in the early 18th century a broader pattern, with a lower arching than that of the Amatis, which gives a more powerful sound. He chose wood of great quality, spruce for the top, maple for the back, ribs and scroll, and covered them with a warm, transparent varnish. Like almost all old violins still played in the 19th century, this one was probably adapted to modern playing, with a longer and more inclined neck."""
details = [
  "The worn varnish under the bridge, in a lighter tone.",
  "The inlaid purfling along the edge of the body.",
  "The f-holes, slender and elongated.",
  "The four dark pegs and the scroll at the top.",
]
themes = ["violin", "Cremona", "Stradivari", "virtuosity", "dating"]
anecdote = """
To the naked eye, the label glued inside the violin is hard to read. Under ultraviolet light, the figures “17ii” appear clearly: 1711, and not 1717 or 1721 as had been believed."""
salle = 2
mur = "nord"
place = 4
largeur = 1.1

[[oeuvres]]
titre = "Six-Course Guitar"
artiste = "Joseph Benedid"
annee = "1787"
image = "guitare-benedid.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Guitar_MET_DT6822a.jpg"
technique = "Pine, ebony, maple, bone, mahogany"
collection = "Metropolitan Museum of Art, New York"
note = "A guitar with six pairs of strings, made in Cádiz at the moment when the Spanish guitar gained its sixth string. It is shown here enlarged."
description = """
The guitar is smaller and slimmer than ours, with a narrow body and a pronounced waist. Its top, golden brown, is pierced by a round rosette surrounded by inlaid circles. Twelve strings, grouped in pairs, run from the pegbox to a low, narrow bridge; below it, dark inlays draw mustache-shaped arabesques. Above the rosette, the end of the fingerboard is ornamented with small inlaid bars. The neck, straight, carries frets; it ends in a flat, cut-out head, where the pegs are inserted from behind, and which is adorned with a pale oval plaque."""
evocation = """
This guitar tells of a moment of transition. In the 17th century, the Spanish guitar had five courses, that is, five pairs of strings, and served above all to accompany by strumming chords. At the end of the 18th century, a sixth pair was added, in the bass, which made it possible to play a bass line and a melody at once. Soon afterward, the double strings would give way to six single strings: the classical guitar was born. The instrument also evokes Cádiz, a port open to America, its fandangos, its seguidillas and its theaters, where the guitar accompanies the singers."""
histoire = """
Joseph Benedid worked in Cádiz, in Andalusia, then one of the richest ports in Europe, where ships arrived from the Americas. With the Pagés family, he was one of the first makers to build six-course guitars; this model, broader, had to withstand the tension of six pairs of strings. Cádiz guitars were then sought after by musicians: the great guitarist Fernando Sor cites Benedid among the makers whose instruments he prefers. The Metropolitan Museum bought it in 1992, thanks to the bequest of Clara Mertens, in memory of her husband André Mertens."""
facture = """
The top is of pine, a light wood that vibrates easily. Inside, Benedid reinforced it with two bars arranged in a fan under the bridge, in place of the simple transverse bars of older guitars: it is one of the first examples of the fan bracing that the luthier Antonio de Torres would perfect in the 19th century and that still equips classical guitars. The fingerboard is of ebony; the museum also notes maple, mahogany and bone. The strings, of gut, were plucked with the fingers."""
details = [
  "The twelve strings grouped in pairs.",
  "The dark mustache-shaped arabesques under the bridge.",
  "The inlaid circles around the rosette.",
  "The flat cut-out head, with its oval plaque.",
  "The small inlaid bars on the fingerboard, above the rosette.",
]
themes = ["guitar", "Spain", "Cádiz", "lutherie", "transition"]
anecdote = """
The two fan-shaped bars hidden under the top of this guitar herald the innovation that made Antonio de Torres famous, sixty years later. Guitarists today play instruments built on this principle."""
salle = 3
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Ūd"
artiste = "Manol (Emmanuel Venios)"
annee = "1916"
image = "oud-manol.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:%C5%AAd_MET_DP346448.jpg"
technique = "Spruce, mulberry, various woods, mother-of-pearl, mastic; 80 × 36.4 × 18.9 cm"
collection = "Metropolitan Museum of Art, New York"
note = "An ūd from the workshop of Manol, the Istanbul luthier whose instruments are still a reference among players of Ottoman music."
description = """
The ūd has the shape of a half pear. Its top, of pale spruce, is pierced by three openwork rosettes: a large one at the center, two small ones lower down, at the sides, cut into stars and interlace of great finesse. Below them, a wide oval plate of mother-of-pearl, engraved with floral motifs, protects the top from the blows of the plectrum. The strings, grouped in pairs, are attached to a tailpiece glued near the lower edge. The neck, short and fretless, is inlaid with mother-of-pearl scrolls; it ends in a pegbox sharply bent backward, bristling with dark pegs. On the side, one can make out the rounded body, made of ribs of dark wood underlined by pale fillets."""
evocation = """
The ūd is the king of Arab, Turkish and Persian music, and the ancestor of the European lute. Its fretless neck makes it possible to play all the intervals of the maqams, those modes that divide the octave more finely than the Western scale. Made in Istanbul by a Greek luthier for Turkish, Armenian, Jewish or Greek musicians, this instrument evokes a cosmopolitan capital where musics circulated from one community to another. Dated 1916, in the midst of the First World War, it also belongs to the last years of the Ottoman Empire, whose world was to disappear a few years later."""
histoire = """
Emmanuel Venios, known as Manol, was a Greek luthier of Constantinople, present-day Istanbul. His ūds and his lavtas, a small fretted lute of Ottoman music, were sought after in his lifetime by the best musicians of the city, and remain so today. This ūd bears the date 1916, whereas Manol died in 1915 or 1916: it is one of the last instruments to come out of his workshop. The Metropolitan Museum bought it in 2014. It has since been played by the American oud player Ara Dinkjian, in a video released by the museum."""
facture = """
The body is made of very thin ribs of mulberry, bent with heat then glued side by side on a mold, like the staves of a barrel. The thin spruce top is carved with its three rosettes before being glued. Manol is credited with developing an ūd somewhat smaller and tuned higher than Arab ūds, which became the model of the Turkish ūd. The museum also notes, among its materials, mastic, the aromatic resin of the mastic tree. The strings are plucked with a long plectrum, formerly a feather."""
details = [
  "The three openwork rosettes, cut like lace.",
  "The large engraved mother-of-pearl plate, under the rosettes.",
  "The fretless neck, inlaid with mother-of-pearl scrolls.",
  "The pegbox bent at almost a right angle.",
  "The dark ribs of the body, visible on the side.",
]
themes = ["ūd", "Istanbul", "Ottoman Empire", "maqam", "mother-of-pearl"]
anecdote = """
The Arabic word al-ʿūd, “the wood”, passed into Europe through Muslim Spain: it gave laúd in Spanish, liuto in Italian, luth in French and lute in English. The lute of the Renaissance is a direct descendant of the ūd."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Vina"
artiste = "Inde du Sud"
annee = "late 18th century"
image = "vina.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/506151"
technique = "Jackfruit wood, gold leaf, papier-mâché, bone, steel, brass; 37.5 × 121.5 × 34 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The great lute of the classical music of southern India, ending in a gilded monster's head."
description = """
The vina lies on its side, as the musician holds it. At the right, a large rounded body, of reddish-brown wood, is closed by a flat top on which the strings rest; gilded bands underline its edge. From it extends a long straight neck, along which twenty-four brass frets are lined up, set on ridges of black wax. At the end, the neck curves into the head of a yali, a mythical monster, gilded and highlighted in red. Under the neck, near this head, a second round resonator, of papier-mâché, is painted with flowers on a dark green ground and with red and gold bands. Four large black pegs hold the main strings; three others, at the side, tighten the drone strings."""
evocation = """
In India, the vina is the instrument of Sarasvati, goddess of knowledge, speech and the arts, who is almost always shown holding one. To play the vina is thus to practice a sacred art as much as a learned music. In Carnatic music, the classical music of the South, it is the reference instrument, the one whose slow, gliding sound imitates the human voice. The head of the yali, guardian of the temples of the South, symbolically protects the instrument. The gilded and painted decoration makes this vina a prestige object, worthy of a court or a great family of musicians."""
histoire = """
The word vina has designated in Sanskrit, since Antiquity, several stringed instruments. The form of this one, with twenty-four fixed frets, took shape in the South in the 17th century; its development is attributed to the court of the Nayaks of Thanjavur. At the end of the 18th century, the period of this instrument, the three great composers of Carnatic music lived, among them Muthuswami Dikshitar, himself a vina player. It is not known for whom this vina was made. It was given to the Metropolitan Museum in 2009 by Michael Pellettieri, in memory of Y. G. Srimati, musician and artist."""
facture = """
The large body, the neck and the head are traditionally carved from jackfruit wood, a fruit tree of southern India. The body is hollowed from the solid and then closed by a thin top. The brass frets rest on wax, which can be heated to move them and adjust the intonation. The musician plays seated on the floor, the instrument laid across the knees, the small resonator resting on the left thigh; the right hand plucks the strings, the left makes them glide over the frets to obtain the ornaments characteristic of Carnatic song."""
details = [
  "The gilded yali head, jaws open, at the end of the neck.",
  "The round papier-mâché resonator, painted with flowers.",
  "The brass frets set on ridges of black wax.",
  "The three lateral pegs of the drone strings.",
  "The gilded bands at the edge of the large body.",
]
themes = ["India", "Carnatic music", "Sarasvati", "sacred", "yali"]
anecdote = """
The frets of the vina are high: by pulling the string sideways, the musician raises the note without changing frets, like a singer sliding from one sound to another. It is this glide, called gamaka, that gives Carnatic music its character."""
salle = 4
mur = "nord"
place = 2
largeur = 2.4

