[exposition]
ordre = 67
nom_court = "Musical Instruments"
mouvement = "Musical instruments of the world"
cadre = "vitrine"
couleur = "#7d4320"
titre = "Musical Instruments of the World: The Art of Making Wood Sing"
artiste = "Todini, Cristofori, Amati, Stradivari, Manol, the Gotō, the griots…"
dates = "c. 1560–1928"
accroche = "Virtual exhibition · Metropolitan Museum of Art, New York"
introduction = """
A musical instrument is a tool, but also a sculpture, a prestige object and the memory of a culture. The visit brings together ten stringed instruments, from the violin of the Renaissance to the harp of central Africa: a gilded harpsichord from Baroque Rome, the oldest surviving piano, two violins from Cremona, a guitar from Cádiz, an ūd from Istanbul, a vina from southern India, a Japanese koto, a kora and an African harp. The building is inspired by the musical instrument galleries of the Metropolitan Museum in New York: an entrance salon for the keyboards, a central gallery for the violins, and three rooms opening onto the rest of the world."""
vitrine = "clavecin-todini.jpg"

[musee]
nom = "André Mertens Galleries for Musical Instruments, Metropolitan Museum of Art"
ville = "New York, United States"
construction = "Galleries renovated and reopened in 2018 and 2019"
presentation = """
Founded in 1870 and housed since 1880 on the edge of Central Park, the Metropolitan Museum of Art holds one of the great collections of musical instruments in the world. It owes almost all of it to one woman, Mary Elizabeth Adams Brown, wife of the banker John Crosby Brown: at the end of the 19th century she gathered more than three thousand six hundred instruments from every continent, and began giving them to the museum in 1889. The galleries that present them bear the name of André Mertens. Closed for a long renovation, they reopened in stages from March 2018, the last gallery in 2019. The exhibition “The Art of Music” shows there some eight hundred objects spanning four thousand years, arranged by period, to reveal the exchanges between cultures. One sees there the oldest piano in the world, violins by Stradivari, a wall of seventy-four brass instruments arranged around a conch, and recordings let visitors hear the displayed instruments being played."""
ici = """
The ARTEON building takes up the idea of a suite of intimate rooms with warm walls, where each instrument has its own display case. One enters from the south into “The Gilded Salon”, seven meters high, reserved for the two Italian keyboards. To the north, the gallery “Cremona, the Golden Age of the Violin” leads to all the rest: to the west “From Cádiz to Istanbul”, for the guitar and the ūd; to the east “From India to Japan”, for the vina and the koto; and to the north, finally, “Africa, the Kora and the Harp”."""

