[[oeuvres]]
titre = "Anti-Graceful (Antigrazioso)"
artiste = "Umberto Boccioni"
annee = "1913"
image = "antigracieux.jpg"
cadre = "noir"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/485518"
technique = "Bronze, cast in 1950; 58.4 × 53.3 × 41.9 cm, 47.6 kg"
collection = "Metropolitan Museum of Art, New York"
note = "His mother’s face, a house and light merge into a single block: Futurist sculpture according to Boccioni."
description = """
On a tall pillar of raw wood, split along its length, stands a bronze bust \
that is hard to read at first. One nevertheless recognises the head of an elderly woman, with \
squinting eyes, a strong nose, a twisted mouth, but all the features seem jostled, \
displaced, as if crumpled by a force from outside. The cheeks and chin \
swell into lobes. At the top of the head rise bulging forms, a bun \
or hat, one of them, pointed, resembling a bud. Behind, a \
geometric block with sharp edges, like a section of wall or the façade of a house, \
sinks into the skull. On the left, a kind of set square juts out into the void. The \
brown-green bronze gleams against a grey background."""
evocation = """
The model is the artist’s mother, whom he often painted. But Boccioni does not seek \
likeness: the title, Anti-Graceful, is a provocation against the amiable beauty \
of salon sculpture and against the imitation of the Greeks. The Futurists \
want to represent not an isolated object, but the object mingled with what surrounds it, with \
light, the house, the street, the movement of modern life. Here, the head and the \
house interpenetrate: the portrait becomes the experience of a person in her \
surroundings, as perceived by sight and memory. Beneath the violence of the forms \
there nevertheless shows a tenderness: that of a son who returns again and again to his \
mother’s face to test his new ideas on it."""
histoire = """
A painter, signatory in 1910 of the Manifesto of Futurist Painters, Umberto Boccioni \
turned to sculpture in 1912, after a stay in Paris where he discovered Cubist \
sculpture. On 11 April 1912, he published the Technical Manifesto of \
Futurist Sculpture, and in 1913 he presented his first sculptures in Paris, at the \
Galerie La Boétie. Anti-Graceful dates from this year of intense invention, the same as \
his celebrated Unique Forms of Continuity in Space. Boccioni died in 1916, \
at thirty-three, and a large part of his plasters disappeared after his death. This \
bronze was cast in 1950, more than thirty years later, from the artist’s \
model."""
facture = """
Boccioni models in plaster, a supple material that allows him to hollow, add and \
cut. In his manifesto, he called for abolishing the closed line of the statue and \
breaking the tradition of noble materials, marble and bronze, in favour of glass, \
wood, cardboard, iron, cement, leather, cloth, mirrors or \
electric light. The irony is that his work has reached us in bronze. The \
forms here alternate solid and hollow, convex and flat; the planes of the wall \
cut across those of the face, so that one no longer knows where the head ends and where \
space begins. The sculpture changes aspect with every step taken around it."""
details = [
  "The geometric block, like a wall or a house, that penetrates the head.",
  "The pointed form, like a bud, at the top of the skull.",
  "The squinting eyes, reduced to slits between the folds of the cheeks.",
  "The metal set square jutting out on the left side.",
  "The raw wooden pillar, split, that serves as a base.",
]
themes = ["Futurism", "mother", "portrait", "movement", "space"]
anecdote = """
Boccioni often took his mother as a model: she also sits enthroned, hands crossed, at the \
centre of his large painting Matter (1912), where her body merges with the city and the \
light that surround her."""
salle = 4
mur = "nord"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "The Gallic Cock"
artiste = "Raymond Duchamp-Villon"
annee = "model of 1916"
image = "coq-gaulois.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1972.227"
technique = "Painted bronze, relief; cast in 1919 from the plaster of 1916"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "Sculpted by a soldier-sculptor near the front, the Cubist cock stands before the rising sun of victory."
description = """
An oval medallion, bordered by a wide black frame of irregular relief, encloses a golden \
cock. The bird is constructed from geometric forms: a body like a cutting \
blade, a crest curled into volutes, wings and a tail made of flat ribbons \
stacked like steps, angular legs. It stands, its head raised \
towards the top of the medallion. Behind it, striated red rays shoot out across the \
black background; at lower left, a red ball represents the sun. The relief thus plays \
with three colours, gold, red and black. In the photograph, taken slightly at an \
angle against a grey background, the gilding gleams on the edges and wears away in places, \
letting the metal show."""
evocation = """
The cock is the emblem of France, thanks to a Latin pun: gallus means \
both cock and Gaul. During the war, it appeared everywhere, on posters, \
postcards, medals. According to the Cleveland museum, soldiers recognised in this cock and rising sun \
symbols of victory. Duchamp-Villon turns this patriotic image into a modern form, without \
sentimentality, yet legible to all: the cock crows at dawn, after the night of the \
trenches. Beside Barlach’s Avenger, the work shows the other face of war \
in art, no longer the surge of combat, but hope, sculpted by a man who \
would not see the peace."""
histoire = """
Mobilised in 1914 in the medical service, having himself begun medical \
studies, Raymond Duchamp-Villon continued to sculpt in his free hours. \
According to the Cleveland museum, he carved the plaster of this relief in 1916, while \
serving in the army: it was intended for the entrance of a temporary theatre built near \
the front for the soldiers. That same year, he contracted typhoid fever. He died \
at the military hospital in Cannes on 9 October 1918, a month before the Armistice. In \
1919, five bronzes were cast from his plaster, in memory of the artist; the one \
in Cleveland is one of them."""
facture = """
The plaster was not modelled but carved, hence these sharp edges and clean planes. \
The cock is reduced to simple forms, blade, volute, ribbon, which fit together like \
the parts of a machine: this is the principle Duchamp-Villon had pushed furthest \
in The Horse, in 1914, where the animal merges into mechanics. The bronze is \
painted, a rare thing: the gold, red and black recall the signs and theatre \
decors, made to be seen from afar, at the entrance to a hall. The medallion, with \
its thick frame, is conceived to be integrated into a façade: Duchamp-Villon was \
always interested in architecture."""
details = [
  "The tail and wing feathers, in flat ribbons stacked like steps.",
  "The red ball of the sun, at lower left.",
  "The striated red rays crossing the black background.",
  "The cock’s crest, curled into volutes.",
  "The wide black frame, of irregular relief, enclosing the medallion.",
]
themes = ["Cubism", "war", "France", "sun", "emblem"]
anecdote = """
Born Raymond Duchamp, the sculptor added to his name that of Villon, already chosen by \
his elder brother Gaston, who became the painter Jacques Villon in homage to the poet François \
Villon. Their younger brother, Marcel Duchamp, kept his name."""
salle = 4
mur = "nord"
place = 3
largeur = 2.6

[[oeuvres]]
titre = "The Jewish Child (Bambino ebreo)"
artiste = "Medardo Rosso"
annee = "c. 1892"
image = "enfant-juif.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1970.33"
technique = "Wax over plaster"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "In wax, Rosso captures a child’s face that seems at once to take form and to fade, like an impression."
description = """
A small child’s head, with the top of the shoulders, emerges from a mass of pale material, \
a cream white stained with brown. The features are barely fixed: the eyes, \
lowered or closed, are only two hollows of shadow; the small round nose and the \
tight lips are sensed more than seen. The cheeks are full, the \
chin round. The hair is not sculpted: an irregular flow covers the \
skull, and on one side the material forms a roll, like an ear or a \
curl. The head tilts slightly. The surface, smooth and shiny in places, \
rough elsewhere, has the look of translucent flesh. Against the dark grey background of the \
photograph, light from the left leaves part of the face \
blurred."""
evocation = """
Rosso wanted to capture an impression, like the Impressionist painters: the way \
a face appears to us for an instant, in a certain light, before \
fading. The Cleveland museum emphasises that he used the fluidity of wax \
to suggest the fleeting movement of a child’s expression and the fragility of \
childhood itself. Almost nothing is known of the model; the title alone designates him. \
But the essential lies elsewhere: this face dissolving into matter announces a \
sculpture made of light and atmosphere rather than contours. Rosso considered \
this head one of his most successful works, and the Futurists, Boccioni \
foremost, would see in him a precursor."""
histoire = """
After being expelled from the Brera Academy in Milan, Medardo Rosso settled in \
Paris in 1889. He frequented avant-garde circles and became friends with Rodin, \
before the two sculptors fell out. Around 1892, he modelled The Jewish Child, \
which he would take up many times, in wax, plaster or bronze, like most \
of his subjects: his oeuvre has few themes, endlessly repeated and varied. He \
exhibited his waxes in Paris, then throughout Europe. In 1912, in his Technical \
Manifesto of Futurist Sculpture, Boccioni hailed him as the only great modern \
sculptor to have tried to open sculpture to the space and light that \
surround it."""
facture = """
Rosso first casts a plaster, then covers it with a layer of hot wax, which he \
retouches until he obtains the desired effect. The wax, slightly translucent, takes \
light like skin; it allows imperceptible passages from relief to hollow, \
without edge or contour. According to the Cleveland museum, Rosso deliberately cultivated \
raw, unpolished surfaces, far from the finish of salon sculptures. The lower part of the \
bust is lost in a shapeless mass, without a base: the head does not detach itself from \
the material, it emerges from it. The work is conceived to be seen from the front, from a single \
viewpoint, like a painting. The brown stains that marble the wax add to \
the impression of flesh and time."""
details = [
  "The eyes, reduced to two hollows of shadow.",
  "The flow of wax covering the skull in place of hair.",
  "The brown stains that marble the pale wax.",
  "The lower part of the bust, lost in a shapeless mass.",
]
themes = ["childhood", "wax", "light", "impression", "face"]
anecdote = """
Rosso photographed his sculptures himself, choosing the angle and lighting, \
and sometimes retouched his prints: he wanted his works to be seen as he had \
conceived them, from a single viewpoint."""
salle = 5
mur = "nord"
place = 2
largeur = 2.4

[[oeuvres]]
titre = "Hieratic Head of Ezra Pound"
artiste = "Henri Gaudier-Brzeska"
annee = "1914"
image = "ezra-pound.jpg"
cadre = "noir"
credit = "Photo : National Gallery of Art"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.143144.html"
technique = "Marble, direct carving; 90.5 × 45.7 × 48.9 cm, approximately 310 kg"
collection = "National Gallery of Art, Washington"
note = "Carved from a block of marble weighing over 300 kilos, the poet’s head becomes an idol: a Vorticist portrait."
description = """
A head of pale marble, nearly a metre high, stands like a boundary stone or \
menhir. The face is reduced to a few cleanly carved geometric forms: a \
straight nose in a long prism, two horizontal arches beneath which the eyes are mere \
slits, a moustache with tips curving downwards, like a double \
hook, and a pointed triangular goatee. The hair forms at the top a \
rounded volume, hollowed with a kind of chevron. The rest of the block is almost smooth: no \
ears, no distinct neck, a base that flares like shoulders. The marble, \
a warm, slightly pinkish white, is traversed by fine grey veins and by a \
crack near the base. Seen in three-quarter view, the head seems to gaze into the distance, \
impassive."""
evocation = """
Hieratic: the word designates what is sacred, fixed in a solemn attitude, \
like the statues of ancient Egypt. Gaudier-Brzeska does not seek \
likeness; he makes of the poet a figure of authority, almost a god, something \
like a totem. One nevertheless recognises the goatee and moustache that Pound wore. \
The phallic silhouette of the block has also often been noted, a symbol of creative \
energy. The work is one of the manifestos of Vorticism, the movement named by \
Pound himself, which sought to capture the energy of the modern world in taut, \
concentrated forms, as at the centre of a whirlpool. A century later, \
it is one of the strongest images of the London avant-garde before 1914."""
histoire = """
Arriving in London in 1911, Henri Gaudier-Brzeska met the American poet Ezra \
Pound in 1913. The two men became friends, and Pound, who championed the young \
sculptor, procured for him the block of marble for his portrait. Gaudier carved it in early \
1914, at the age of twenty-two. That same year appeared the magazine Blast, manifesto of \
Vorticism, in which he published a resounding text on the history of sculpture. In \
August 1914, he returned to France to enlist; he was killed at the front, at \
Neuville-Saint-Vaast, on 5 June 1915. In 1916 Pound devoted to him a book of \
memories, and the marble head remained long in his possession, as the portrait \
of the departed friend."""
facture = """
Gaudier-Brzeska practises direct carving: he attacks the block himself, without a \
plaster model that assistants would enlarge, as Rodin did. He \
respects the mass of the stone, whose head keeps the compact form and weight \
of over three hundred kilos. The features are obtained by a few cuts and \
planes meeting at sharp angles: it is shadow, more than relief, that draws \
the eyes, moustache and mouth. The work is often compared to the great \
statues of Easter Island, such as the one Gaudier could see at the British Museum, \
which he frequented assiduously. The surface, slightly grainy, keeps the trace of \
the tool."""
details = [
  "The curved moustache, carved like a double hook.",
  "The triangular goatee, pointing downwards.",
  "The eyes reduced to slits beneath the horizontal arches.",
  "The chevron hollowed into the mass of the hair.",
  "The fine crack running near the base of the marble.",
]
themes = ["portrait", "poetry", "Vorticism", "direct carving", "idol"]
anecdote = """
According to Pound, Gaudier warned him before beginning: the head would not \
resemble him, it would be the expression of certain emotions that his \
character inspired in him."""
salle = 5
mur = "nord"
place = 3
largeur = 2.6

[[artistes]]
nom = "Auguste Rodin"
vie = "Paris, 12 November 1840 – Meudon, 17 November 1917"
biographie = """
The son of a clerk at the police prefecture, Auguste Rodin learned drawing at the \
Petite École, but failed the École des Beaux-Arts entrance competition three times. He \
worked for a long time for others, as an ornamentalist and assistant, in Paris and then in \
Brussels, where he settled after the war of 1870. A trip to Italy, in \
1875–1876, revealed Michelangelo to him. The Age of Bronze, exhibited in 1877, made him known \
through scandal. In 1880, the State commissioned from him The Gates of Hell, inspired by \
Dante, on which he would work until his death and from which Adam, The Thinker \
and The Kiss were born. There followed The Burghers of Calais, unveiled in 1895, and the Balzac, \
rejected by its patrons in 1898. The Exposition Universelle of 1900, where he \
presented his work in a personal pavilion, brought him international \
fame. In 1916, he gave his works and collections to the State; he died \
the following year at Meudon."""
style = """
Rodin frees sculpture from narrative and academic conventions: he models in \
bumps and hollows that make light vibrate, keeps the imprint of the fingers, dares the \
fragment, the unfinished, the repetition of a single figure. The body alone expresses \
thought and passion. Almost all the sculptors in this exhibition \
defined themselves with him or against him."""

[[artistes]]
nom = "Wilhelm Lehmbruck"
vie = "Meiderich (Duisburg), 4 January 1881 – Berlin, 25 March 1919"
biographie = """
The son of a Ruhr miner, Wilhelm Lehmbruck studied at the school of decorative arts \
and then at the Academy of Fine Arts in Düsseldorf. His early works owe much \
to Rodin and to the monumental sculpture of his time. In 1910, he settled in Paris, \
where he discovered Maillol and became friends with Brancusi, Archipenko and Modigliani. His Kneeling \
Woman, in 1911, with immoderately stretched limbs, was hailed as a major work \
and travelled to New York, to the Armory Show of 1913. The war brought him back to \
Germany: employed in a military hospital in Berlin, he was overwhelmed by the \
suffering of the wounded and sculpted The Fallen Man, a monument to the distress of \
soldiers. He took refuge in Zurich in 1916. Back in Berlin at the end of the war, elected to \
the Prussian Academy of Arts, he took his own life in March 1919, at thirty-eight. \
In 1937, the Nazis classed him among the “degenerate” artists."""
style = """
Lehmbruck starts from Maillol’s classical plenitude to move towards \
stretched, grave and melancholy figures, in which the lengthening of the limbs expresses contemplation \
or pain. Without spectacular gesture, his bodies express an inner state: he \
is one of the great sculptors of German Expressionism."""

[[artistes]]
nom = "Augustus Saint-Gaudens"
vie = "Dublin (Ireland), 1 March 1848 – Cornish (New Hampshire), 3 August 1907"
biographie = """
The son of a French shoemaker and an Irish mother, Augustus Saint-Gaudens was six \
months old when his family left Dublin for New York. At thirteen, he was \
apprenticed to a cameo cutter, while attending evening drawing classes. \
In 1867, he left for Paris and entered the École des Beaux-Arts, then settled in Rome. \
Back in the United States, he made his name with the monument to Admiral Farragut, \
unveiled in New York in 1881. There followed the standing Lincoln of Chicago, the Adams \
Memorial in Washington, a meditative veiled figure, and the memorial to Colonel Shaw and his \
regiment of Black soldiers, in Boston, in 1897. He lived in Paris from 1897 to 1900, then \
settled in Cornish, New Hampshire, where an artists’ colony formed around him. \
In 1907, the year of his death, he designed a twenty-dollar gold coin, \
often judged the most beautiful of American coins."""
style = """
Saint-Gaudens unites the academic knowledge learned in Paris with a direct, sensitive \
realism. His monuments, portraits and reliefs give allegory a human \
face. He is the greatest American sculptor of his time, the most \
accomplished heir to the Beaux-Arts tradition at the moment when the moderns were calling it \
into question."""

[[artistes]]
nom = "Ernst Barlach"
vie = "Wedel (Holstein), 2 January 1870 – Rostock, 24 October 1938"
biographie = """
The son of a physician, Ernst Barlach studied decorative arts in Hamburg, then \
sculpture at the Dresden Academy, and stayed in Paris in the mid-1890s. \
For several years, he sought his way among ceramics, illustration and \
decorative sculpture. A trip to Russia, in 1906, was a revelation: the peasants \
and beggars of the steppes inspired in him massive figures, wrapped in \
their clothing. Supported by the Berlin dealer Paul Cassirer, he settled in \
1910 in Güstrow, in Mecklenburg. He was also an acknowledged playwright and a \
woodcut artist. After the First World War, he created war memorials \
for Güstrow, Kiel, Magdeburg and Hamburg, works of mourning more than of glory. The \
Nazis judged him “degenerate”: his monuments were removed, hundreds of his \
works seized from museums. Isolated, he died in Rostock in 1938."""
style = """
Barlach sculpts wrapped bodies, reduced to simple, closed masses, \
carved in large planes like wood. An heir to German Gothic sculpture, \
he gives humble figures, beggars, peasants, women at prayer, a spiritual \
intensity: fear, expectation, surge, ecstasy or mourning."""

[[artistes]]
nom = "Umberto Boccioni"
vie = "Reggio Calabria, 19 October 1882 – Sorte, near Verona, 17 August 1916"
biographie = """
Umberto Boccioni grew up following the postings of his father, a civil servant, then \
settled in Rome in 1901. With his friend Gino Severini, he learned from Giacomo \
Balla Divisionist painting, made of touches of pure colour. After stays \
in Paris and Russia, he settled in Milan in 1907. In 1910, he met the poet \
Marinetti, founder of Futurism, and signed the Manifesto of Futurist Painters; his \
great canvas The City Rises celebrates the energy of the modern city. In 1912, he \
exhibited in Paris with the Futurists, discovered Cubist sculpture and published the \
Technical Manifesto of Futurist Sculpture. His Unique Forms of Continuity \
in Space, in 1913, became the icon of the movement. A supporter of Italy’s entry into the \
war, he enlisted in 1915. He died in August 1916, at thirty-three, \
after falling from a horse during a military exercise, near Verona."""
style = """
Boccioni wants to paint and sculpt movement, speed, modern life. In his \
sculptures, the object extends into space, mingles with its surroundings, bursts into \
interpenetrating planes. Dying young, he left few works, but his ideas have \
nourished all twentieth-century sculpture."""

[[artistes]]
nom = "Raymond Duchamp-Villon"
vie = "Damville (Eure), 5 November 1876 – Cannes, 9 October 1918"
biographie = """
The son of a Norman notary, Raymond Duchamp grew up in a family of artists: his \
elder brother became the painter Jacques Villon, his younger siblings Marcel and Suzanne Duchamp \
would be painters too. He began medical studies in Paris, but a \
severe attack of rheumatism forced him to abandon them; during his convalescence, he \
took up sculpture, self-taught, and soon exhibited in the Paris Salons. \
Around 1911, the Puteaux gatherings, at his brother Jacques’s home, brought him close to the \
Cubists. In 1912, he designed the façade of the “Cubist House” shown at the Salon \
d’Automne and took part in the Salon de la Section d’Or; in 1913, he exhibited at the Armory \
Show in New York. In 1914, he completed his masterpiece, The Horse; mobilised in the \
medical service, he still sculpted, near the front, The Gallic Cock. Struck by typhoid \
fever in 1916, he died in 1918 at the military hospital in Cannes."""
style = """
Duchamp-Villon is one of the first Cubist sculptors. He reduces the living to \
simple, taut forms, which fit together like mechanical parts, to express \
energy rather than appearance. A sculptor and architect at heart, he sought a \
synthesis between the organic and the machine."""

[[artistes]]
nom = "Medardo Rosso"
vie = "Turin, 21 June 1858 – Milan, 31 March 1928"
biographie = """
Medardo Rosso grew up in northern Italy, in Milan notably. In 1882 he entered the \
Brera Academy, from which he was expelled the following year for indiscipline. His early works showed \
popular subjects, children, concierges, street singers. In 1889, he \
settled in Paris, where he would live for a long time; he moved in Impressionist \
circles, became friends with Rodin, then fell out with him, convinced that his \
Balzac owed much to his own research. He exhibited his waxes in Paris and throughout \
Europe, and found defenders among critics and \
collectors. After Ecce Puer, in 1906, he scarcely created any new subjects \
and endlessly reworked his older works. Back in Italy, he was hailed by the \
Futurists as a precursor. He died in Milan in 1928."""
style = """
Rosso is the sculptor of impression: he wants to render what the eye perceives in an \
instant, a face in the light, a silhouette in the street. His waxes, with melting forms \
and no contour, are viewed from a single viewpoint, like paintings, and \
open sculpture to space and atmosphere."""

[[artistes]]
nom = "Henri Gaudier-Brzeska"
vie = "Saint-Jean-de-Braye (Loiret), 4 October 1891 – Neuville-Saint-Vaast (Pas-de-Calais), 5 June 1915"
biographie = """
The son of a carpenter from the Orléans area, Henri Gaudier was a brilliant pupil. \
Thanks to scholarships, he studied in England and travelled in Germany, where he drew \
tirelessly in museums. In Paris, in 1910, he met Sophie Brzeska, \
a Polish writer nearly twenty years his senior; they lived together, and he \
added her name to his. The couple left for London in 1911. Poor, Gaudier sculpted \
at night, drew the animals at the zoo and studied the antiquities of the British Museum. He \
became friends with Ezra Pound, the painter Wyndham Lewis and the sculptor Jacob Epstein, and \
took part in 1914 in Vorticism and its magazine, Blast. When war broke out, he \
returned to France to enlist. Noted for his courage, he was killed in Artois, at \
Neuville-Saint-Vaast, on 5 June 1915, at twenty-three. From the trenches, he \
had still sent Blast a final text on sculpture."""
style = """
Gaudier-Brzeska champions direct carving, the energy of volumes and the lesson of \
ancient and distant arts, from Egypt, Africa and Oceania. In only four years of work, \
he moves from the modelling inherited from Rodin to geometric, compact and \
powerful forms, which foretell twentieth-century English sculpture."""
