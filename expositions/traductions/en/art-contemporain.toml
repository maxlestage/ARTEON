[[oeuvres]]
titre = "The Age of Bronze"
artiste = "Auguste Rodin"
annee = "1875–1876"
image = "age-d-airain.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1918.328"
technique = "Bronze, life-size; cast commissioned in 1916 and supervised by the artist"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "A nude young man awakens, hand on head: so true to life that Rodin was accused of having cast him from a living model."
description = """
A life-size nude young man stands on a square base. His right arm \
is bent above his head, the hand resting on the top of the skull, as \
if emerging from sleep or from a dream. The left arm is raised too, bent at the \
elbow, the fist closed at face level around an object that is no longer there. The \
face, turned upwards, has half-closed eyes and a slightly open mouth. The legs \
are close together, one knee slightly bent, and the whole body seems to rise, from the \
feet to the raised elbow. Against the grey background of the photograph, the very \
dark bronze keeps reddish glints where the light catches the shoulders, torso \
and thighs, and a faint shadow stretches behind the statue."""
evocation = """
When he first showed it, in Brussels, Rodin called his figure The \
Vanquished, and the young man held a spear: some saw in it a wounded soldier, perhaps an \
echo of the French defeat of 1870. By removing the weapon, the sculptor erased \
the anecdote. The definitive title refers to the ages of mankind imagined by the ancient \
poets; one reads in it the awakening of man to consciousness, humanity emerging from \
the night. Rodin nevertheless leaves the meaning open: with no attribute or story, it is the body \
alone, its surge and its weariness, that carries the emotion. For the Cleveland museum, this \
enigmatic figure expresses the sensuality and psychological power of the male nude. \
This is where modern sculpture begins: a statue that no longer tells a story."""
histoire = """
Rodin, then living in Brussels, worked for many months on this figure from a \
young Belgian soldier, before and after a trip to Italy where he discovered Michelangelo. \
Shown in Brussels in early 1877, then at the Paris Salon the same year, the \
plaster caused a scandal: the modelling was so exact that the sculptor was suspected of having \
cast the body of his model directly, a cheat in the eyes of the Academy. Rodin \
defended himself with photographs and testimonies; in 1880, the State bought \
the work from him and had a bronze cast. The Cleveland cast has a history of its own: \
in 1916, Ralph King, a trustee of the museum, commissioned it from the artist to give it to \
the institution. Rodin, by then near the end of his life, himself supervised the casting, of an \
exceptional quality according to the museum."""
facture = """
Rodin models his figure in clay while circling his model, profile after \
profile, to grasp the body from every angle: he would keep this method all his \
life. The result is a surface of great finesse, where the muscles are not \
emphasised as in academic figures, but sensed beneath the skin, in the play \
of light. It was this very accuracy that gave rise to the suspicion of casting. The \
Cleveland cast received the patina the sculptor preferred, a dark red \
that he called, the museum reports, “crushed grape”; one can sense it in the \
photograph. Deprived of its spear, the left fist remains closed on emptiness, and this suspended gesture \
adds to the mystery of the figure."""
details = [
  "The right hand resting on the top of the skull, as if just waking from sleep.",
  "The left fist closed around a vanished spear.",
  "The half-closed eyes and slightly open mouth of the raised face.",
  "The reddish glints of the patina on the shoulders and torso.",
  "The square, bare base, with no rock or accessory.",
]
themes = ["awakening", "body", "youth", "bronze", "scandal"]
anecdote = """
To prove his good faith, Rodin had his model, a young Belgian soldier \
named Auguste Neyt, photographed so that the living body and the statue could be compared, and \
asked other sculptors to testify that he modelled without casting."""
salle = 2
mur = "ouest"
place = 3
largeur = 3.2

[[oeuvres]]
titre = "Adam"
artiste = "Auguste Rodin"
annee = "model of 1881"
image = "adam.jpg"
cadre = "noir"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/11320"
technique = "Bronze with dark brown patina, cast c. 1924; 198.1 × 73.7 cm, base 76.2 × 73.7 cm"
collection = "Art Institute of Chicago, Chicago"
note = "Conceived to stand before The Gates of Hell, the first man seems at once to be born and to collapse."
description = """
A powerfully muscled nude man stands on a rocky base, yet nothing in \
him is straight. His head falls heavily to one side, almost resting on the shoulder, \
as if the neck could no longer bear it. One leg is raised, the foot placed on a \
stone, the knee drawn forward; a hand grips it, at the end of a twisted arm that \
crosses the body. The other arm hangs along the flank, the index finger pointing at the ground. The \
shoulders, chest and forearms are knotted, hollowed with muscles and veins. \
In the photograph, taken in three-quarter view against a light grey background, the dark brown patina \
shines on the high points and leaves the hollows in shadow, so that the figure \
seems carved by light."""
evocation = """
Rodin drew on Michelangelo, as the Art Institute of Chicago points out. The pose \
comes from the Creation of Adam painted on the ceiling of the Sistine Chapel: Rodin raises \
the reclining figure of the fresco and transfers to the right arm of his statue the \
gesture by which Adam receives life. The twist of the left arm comes from another \
work by Michelangelo, the dead Christ of the Florentine Pietà. Rodin thus mingles \
birth and death: the first man, barely drawn from the earth, already bears the \
weight of the fault he will pass on to humanity. Before The Gates of Hell, he \
was to welcome the visitor together with Eve, the couple through whom, according to the Bible, evil \
enters the world."""
histoire = """
In 1880, the State commissioned from Rodin a bronze door for a future museum of decorative \
arts in Paris; the sculptor chose Dante’s Inferno. He planned to flank \
this Gates of Hell with two large figures, Adam and Eve, and modelled Adam in \
1881. But the museum was never built, the door was not cast in the artist’s lifetime, \
and the two statues became independent. Rodin nevertheless never stopped \
reusing his figure: he drew from it The Three Shades, which crown the Gates. In \
1916, he gave his work to the State with the right to make casts; this is how \
the Chicago bronze came to be cast c. 1924, a few years after his death, \
from his model."""
facture = """
Adam stands nearly two metres tall: he is larger than life, and Rodin exaggerates \
still further what nature offers. The hands are enormous, the neck breaks almost at a \
right angle, the torso twists one way and the legs the other. No model \
could hold this pose for long, which has nothing of a balance; it is the \
rock, under the raised foot, that seems to hold the figure. The modelling proceeds by bumps \
and hollows, accentuates tendons and veins, and leaves here and there the trace of the \
hand. The rocky base, barely roughed out, is part of the work: the first man \
is still emerging from the raw matter from which he was formed."""
details = [
  "The drooping head, almost at a right angle to the neck.",
  "The index finger pointing at the ground, taken from the gesture of Michelangelo’s Adam.",
  "The twisted arm that crosses the body to grasp the knee.",
  "The foot clenched on a stone, the toes gripping.",
  "The prominent veins of the forearms and hands.",
]
themes = ["creation", "Dante", "Michelangelo", "body", "fall from grace"]
anecdote = """
At the top of The Gates of Hell, The Three Shades are three casts of a single \
figure derived from Adam, arranged in a circle, heads bowed, like three damned souls \
pointing to the abyss. Rodin liked in this way to repeat and assemble a single form."""
salle = 2
mur = "est"
place = 3
largeur = 3.2

[[oeuvres]]
titre = "Standing Woman (Stehende weibliche Figur)"
artiste = "Wilhelm Lehmbruck"
annee = "model of 1910"
image = "femme-debout.jpg"
cadre = "noir"
credit = "Photo : National Gallery of Art"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.50290.html"
technique = "Bronze, cast in Munich in 1957; 191.2 × 54 × 39.9 cm"
collection = "National Gallery of Art, Washington"
note = "Tall, calm, eyes lowered, a woman holds her drapery: in 1910, in Paris, Lehmbruck seeks the peace of forms."
description = """
A nude woman stands almost motionless on a low base with irregular \
edges. Her right hand holds at the hip a sheet that slips and wraps her \
legs to the ankles, in long vertical folds. The left hand hangs, open, along \
the body. The head, small, tilts gently to the side and downwards; \
the eyelids lowered, the features regular, she seems absorbed in thought. The \
hair is pulled back. The body is solid, with broad hips and rounded shoulders, \
but the legs, sheathed by the cloth, lengthen it like a column. Against \
the white background of the photograph, the dark patina, greenish in places, is covered \
with pale reflections on the chest, belly and knees."""
evocation = """
Nothing here tells a story: no name of a goddess, no attribute. The gesture of holding \
drapery recalls ancient Venuses emerging from the bath, but Lehmbruck makes of it a \
moment of silent contemplation. The figure speaks of calm, restraint, a presence \
turned inward. This almost classical peace shows what the young German \
sculptor came to Paris to find: a sculpture founded on mass and \
balance, close to Maillol’s. But the inclined head and lowered gaze \
already foretell the melancholy of his later figures, increasingly elongated, which \
would make him one of the great sculptors of German Expressionism and one of the \
first to express, through the body alone, the distress of his time."""
histoire = """
Trained at the Academy of Fine Arts in Düsseldorf, Wilhelm Lehmbruck settled in Paris \
in 1910 with his family, and stayed until the war. He exhibited at the Salon \
d’Automne, studied Rodin and Maillol, and befriended artists from all over Europe, \
such as Brancusi, Archipenko and Modigliani. This Standing Woman belongs to his \
early Parisian years; the following year, his Kneeling Woman, with \
immoderately elongated limbs, marked a turning point. The Washington cast was made in Munich in 1957, nearly forty years after \
the artist’s death, from his model of 1910."""
facture = """
Lehmbruck models his figure at human scale: with its base, it measures 1.91 \
metres. He simplifies volumes, gives up anatomical detail and gives the body a \
broad, soft modelling, over which light glides without a hitch. The drapery plays a structural \
role: its vertical folds, tight around the legs, fuse the figure into \
a single block and give it the stability of a column. The head, a little small for \
the body, hints at the elongation of the works to come. The surface is not \
smooth everywhere: the hair, in particular, keeps a rougher grain, and the \
dark patina, mixed with green, catches the light in patches."""
details = [
  "The hand holding the drapery at the hip.",
  "The vertical folds of the cloth, like the fluting of a column.",
  "The inclined head and lowered eyelids.",
  "The hair pulled back, with a grainier modelling.",
  "The bare feet emerging from the drapery, on the irregular base.",
]
themes = ["woman", "calm", "drapery", "classicism", "melancholy"]
anecdote = """
In Duisburg, his home town, a museum has borne the name of Wilhelm Lehmbruck since 1964. Its \
glass and concrete building was designed by his son, the architect Manfred \
Lehmbruck."""
salle = 2
mur = "sud"
place = 4
largeur = 2.9

[[oeuvres]]
titre = "Victory"
artiste = "Augustus Saint-Gaudens"
annee = "1892–1903"
image = "victoire.jpg"
cadre = "noir"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/12019"
technique = "Gilt bronze, cast between 1914 and 1916; 96.5 × 24.1 × 47 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Wings spread, palm in hand: the gilded Victory who leads General Sherman in New York, in reduction."
description = """
A winged woman, dressed in a long gown that floats behind her, advances with a \
determined step over a rock. The whole bronze is gilded. Her right arm stretches forward and \
upward, as if to show the way; with the other hand, she clasps to her \
chest a long palm, of a darker metal. A laurel wreath holds back \
her knotted hair. Her great wings, with finely chased feathers, open at her \
back. The wind presses the gown against her legs and makes it flap behind, \
revealing a sandalled foot. Seen in profile in the photograph, the \
figure draws a great diagonal, from the outstretched fist to the tips of the wings. On \
the front of the base, an engraved inscription can be made out."""
evocation = """
Victory is a figure from Antiquity: the Nike of the Greeks, winged, messenger of \
triumph, of which the Victory of Samothrace, in the Louvre, is the most famous example. \
Saint-Gaudens has her walk before the horse of General William Tecumseh Sherman, \
one of the Union commanders of the Civil War. She does not fight: she guides, \
arm outstretched, and the palm she carries announces victory as much as restored \
peace. But her face is nothing like a conventional goddess: it is that of a real \
woman, attentive, almost grave. Amid the nude bodies of Rodin and Lehmbruck, \
she represents the other path of sculpture around 1900, that of monumental \
allegory, brought here to perfection just before disappearing."""
histoire = """
After General Sherman’s death, in 1891, Saint-Gaudens received the commission for an \
equestrian monument to his memory in New York. He worked on it for over ten years, \
partly in Paris, where he set up his studio in the late 1890s and where he presented \
the plaster at the Exposition Universelle of 1900. The monument, in gilt bronze, was \
unveiled in 1903 at the southeast entrance to Central Park, on Grand Army Plaza: the \
general on horseback follows Victory who walks before him. Reductions of \
Victory alone were then cast. The one at the Metropolitan Museum, a little under \
a metre high, was cast between 1914 and 1916, a few years after the \
sculptor’s death."""
facture = """
Saint-Gaudens, trained at the École des Beaux-Arts in Paris, has complete mastery of \
academic sculpture, but he puts it at the service of a living realism. The \
reduction keeps the precision of the large monument: every feather of the wings is \
chased, every fold of the gown follows the movement of the body and the push of the wind. The \
composition rests on the contrast between the vertical of the body and the diagonals of the \
arm, wings and drapery, which give the impression of a rapid walk. The uniform \
gilding, recalling the gold of the New York monument, makes of the figure a block of \
light; only the palm, in a darker tone, stands out against it and draws the \
eye to the heart of the composition."""
details = [
  "The laurel wreath in the knotted hair.",
  "The palm, of a metal darker than the gilding.",
  "The feathers of the wings, chased one by one.",
  "The sandal of the advancing foot, under the gown lifted by the wind.",
  "The inscription engraved on the front of the base.",
]
themes = ["victory", "allegory", "gold", "monument", "America"]
anecdote = """
For the face of Victory, Saint-Gaudens used as his model Hettie Anderson, a young \
African American woman who was one of his favourite models; she is also credited with \
the profile of the Liberty he designed in 1907 for a twenty-dollar gold coin."""
salle = 2
mur = "sud"
place = 10
largeur = 2.9

[[oeuvres]]
titre = "Head of Pierre de Wissant (The Burghers of Calais)"
artiste = "Auguste Rodin"
annee = "1886"
image = "pierre-de-wissant.jpg"
cadre = "noir"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1920.120"
technique = "Bronze; large-size head, known as “heroic”"
collection = "Cleveland Museum of Art, Cleveland (Ohio)"
note = "One of the six burghers who offered themselves to death to save Calais: Rodin isolates his head, ravaged by anguish."
description = """
A man’s head rises on a thick neck, without shoulders, detached from any body. \
It is slightly bowed and turned to the side. The heavy eyelids are almost \
closed; the mouth parts slightly, a little crooked, as in a sigh or a \
moan. The brows contract and the forehead creases. The short hair is not \
drawn lock by lock: it forms a rough mass, as if kneaded with great \
thumb strokes. The ears protrude, and a slight fold girdles the neck. The \
dark bronze, with green glints, is patinated and shiny: light glides over the \
cheekbones, nose and chin, while shadow floods the eye sockets. Against the dark \
grey background of the photograph, the head seems to emerge alone from the night."""
evocation = """
In 1347, after a long siege, Calais had to surrender to King Edward III of England. \
According to the chronicler Froissart, the king demanded that six notables leave the town, \
bareheaded and barefoot, a rope around their necks, to hand over the keys and be put to death. \
Eustache de Saint-Pierre volunteered first, and five others followed, among them \
Pierre de Wissant; Queen Philippa of Hainault would obtain their pardon. Rodin does not \
show triumphant heroes, but men walking towards death, each \
alone with his fear. In this face, as the Cleveland museum notes, anguish expresses \
an extreme moral suffering: the monument does not celebrate glory, it makes one feel \
the price of sacrifice."""
histoire = """
In 1884, the town of Calais commissioned from Rodin a monument to Eustache de Saint-Pierre. \
The sculptor proposed to represent the six burghers together, on the same level, without \
hierarchy, which disconcerted his patrons. He studied each man separately, \
first nude, then clothed, and modelled the heads apart. According to the Cleveland museum, he \
exhibited a life-size version of Pierre de Wissant as an independent work \
even before the monument was completed, then made numerous versions, in different \
sizes and materials. The group was unveiled in Calais in 1895, set on \
a high pedestal, whereas Rodin would have wanted to see it almost at ground level, among \
the passers-by."""
facture = """
Rodin isolates the head as a fragment: no more body, no more story, only \
expression. Detaching a part, enlarging it, reducing it, combining it with others: \
this procedure is at the heart of his work, and his heirs would make a rule of it. In the \
vocabulary of sculptors, an “heroic” head is larger than life. The \
modelling here is of great vigour: the hair keeps the imprint of the fingers, the \
cheeks and forehead hollow and swell to catch the light. The face \
is not symmetrical, the mouth slips to one side, one eyelid droops more than the other; \
it is this imbalance, more than any detail, that makes the anguish visible."""
details = [
  "The heavy eyelids, almost closed.",
  "The slightly open mouth, a little crooked.",
  "The rough hair, modelled with great thumb strokes.",
  "The thick neck, cut off cleanly, without shoulders.",
  "The green glints of the patina on the forehead and cheeks.",
]
themes = ["memory", "sacrifice", "anguish", "monument", "fragment"]
anecdote = """
The Burghers of Calais are also in London: a cast of the group has stood \
since 1915 in the Victoria Tower Gardens, at the foot of Parliament, a few \
kilometres upstream from Tate Modern, on the other bank of the Thames."""
salle = 3
mur = "nord"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "The Avenger (Der Rächer)"
artiste = "Ernst Barlach"
annee = "1914"
image = "le-vengeur.jpg"
cadre = "noir"
credit = "Photo : National Gallery of Art"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.206701.html"
technique = "Bronze"
collection = "National Gallery of Art, Washington"
note = "Wrapped in his cloak, a man brandishes a sword and charges forward: the warlike surge of 1914, captured by Barlach."
description = """
A man hurls himself forward, his body almost horizontal, as if launched in a \
furious run. He is entirely wrapped in an ample cloak that forms an \
angular block, with large flat panels, as if cut from wood. From this block emerge only \
the head, the arms and a bare foot, which finds purchase on a rectangular base. The \
arms, raised above the head, grip a sword whose blade arcs \
over the back, ready to strike. The face, small, with wide-open eyes, stares \
straight ahead. The brown bronze, with a finely hammered surface, bears here and there \
green patches. Against the light grey background of the photograph, the silhouette draws a \
wedge pointing forward, and its shadow lengthens on the ground."""
evocation = """
The title designates an avenger, one who returns blow for blow. Like many \
German artists and writers, Barlach at first shared the enthusiasm that \
seized the country in August 1914, and The Avenger bears the mark of that surge: war \
appears in it as a just revenge, a force that sweeps everything away. Yet the figure has \
no uniform or modern weapon; it is an elemental force, a gust of wind more than a \
soldier. Barlach would soon turn away from this exaltation: briefly mobilised, he \
became an opponent of the war, and his war memorials after 1918 would be \
works of mourning and contemplation. The Avenger remains the witness of a moment \
of collective blindness, on the threshold of disaster."""
histoire = """
In 1914, Ernst Barlach was forty-four. Since 1910, he had lived in Güstrow, a small \
town in Mecklenburg, and his Berlin dealer, Paul Cassirer, had supported him for \
several years. He had found his style after a trip to Russia, in 1906, from which he \
brought back figures of peasants and beggars, massive and wrapped. The \
Avenger was born in the first months of the war: Barlach applies to a topical subject this language of \
draped blocks. Twenty years later, his work would be judged \
“degenerate” by the Nazis, his war memorials, not heroic enough in their \
eyes, removed from churches and squares, and hundreds of his works seized \
from German museums."""
facture = """
Barlach is first of all a wood sculptor, and this shows even in the bronze: the \
forms are cut into large, clean planes with sharp edges, inherited from medieval German \
sculpture and folk figurines. The body disappears under the cloak, \
reduced to a geometric mass, a kind of wedge leaning forward. The only \
details are the face, the hands and the foot, which render the human figure. The \
movement arises from the diagonal and the folds swept back, as if by the wind \
of the charge. At the same time, the Italian Futurists sought to sculpt \
speed by bursting open form; Barlach obtains the surge by the opposite means, a \
compact, closed mass."""
details = [
  "The blade of the sword, curved in an arc above the back.",
  "The bare foot, sole support of the whole mass hurled forward.",
  "The large flat panels of the cloak, as if cut with an axe.",
  "The small face with wide-open eyes, caught in the collar.",
  "The green patches of the patina on the brown bronze.",
]
themes = ["war", "surge", "anger", "memory", "Expressionism"]
anecdote = """
For the hanging angel he created in 1927 in Güstrow Cathedral, in memory \
of the war dead, Barlach gave the face the features of Käthe Kollwitz. The \
Nazis had it melted down; a second cast, hidden during the war, made it possible to \
remake it."""
