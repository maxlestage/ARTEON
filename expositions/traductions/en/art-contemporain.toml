[exposition]
ordre = 210
nom_court = "Modern Sculpture"
mouvement = "Modern sculpture, from Rodin to Futurism"
cadre = "aucun"
couleur = "#9a4a2c"
titre = "At the Sources of Today’s Sculpture, from Rodin to Gaudier-Brzeska"
artiste = "Rodin, Lehmbruck, Saint-Gaudens, Barlach, Boccioni, Duchamp-Villon, Rosso, Gaudier-Brzeska"
dates = "1875–1916"
accroche = "Virtual exhibition · Tate Modern, London"
introduction = """
How did sculpture become modern? In some forty years, from Rodin’s \
The Age of Bronze to the heads carved by Gaudier-Brzeska on the eve of the \
Great War, sculptors gave up narrative and allegory to let \
the body, matter and movement speak. The visit brings together ten works by eight artists, \
French, German, Italian and American: great nude bodies, memorial monuments, Futurism \
seeking to sculpt speed, Cubism carving form \
into facets, faces that dissolve in light or turn into idols. \
Since today’s works are protected by copyright, the exhibition goes back \
to their sources: without these pioneers, neither Giacometti, nor Moore, nor Louise Bourgeois \
would have sculpted as they did. The building is inspired by Tate Modern in \
London: a hall, then the immense nave of the former Turbine Hall, and three \
galleries in enfilade to the north."""
vitrine = "age-d-airain.jpg"

[musee]
nom = "Tate Modern"
ville = "London, United Kingdom"
architecte = "Giles Gilbert Scott (the power station); Herzog & de Meuron (the museum)"
construction = "1947–1963 (the power station); museum opened in 2000"
presentation = """
On the south bank of the Thames, facing St Paul’s Cathedral, the Bankside power station \
was built in two stages, from 1947 to 1963, to the designs of Sir Giles \
Gilbert Scott, the architect of Battersea Power Station. This long brick building, \
dominated by a 99-metre chimney, ceased operating in 1981. In 1995, the Tate \
chose the Swiss architects Herzog & de Meuron to turn it into its museum of modern \
and contemporary art. They kept the brick shell, placed on the roof a \
long luminous glass box, and turned the former turbine hall, emptied of its \
machinery, into a 3,400-square-metre nave that runs through the whole building and which one \
enters by a gently sloping ramp. Queen Elizabeth II opened Tate Modern on \
11 May 2000. Each year, an artist is invited to occupy this nave: Louise \
Bourgeois opened the series in 2000. In 2016, an openwork brick tower, today the \
Blavatnik Building, extended the museum, whose permanent collections are \
free."""
ici = """
ARTEON’s building takes up the central idea of Tate Modern: an immense nave \
between the street and the galleries. One enters from the south into the south hall, then emerges \
into the Turbine Hall, 44 metres long and 20 high, with pale concrete walls, where \
the great bodies are hung: Rodin’s The Age of Bronze and Adam, Lehmbruck’s Standing \
Woman and Saint-Gaudens’s gilded Victory. To the north, like the galleries \
facing the Thames, three white rooms communicate in enfilade, from west to \
east: “Memory and Monuments”, with Rodin and Barlach, “Movement”, with \
Boccioni and Duchamp-Villon, then “New Faces”, with Medardo Rosso and \
Gaudier-Brzeska."""

