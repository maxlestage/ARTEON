[[oeuvres]]
titre = "Court Dress"
artiste = "Couturières anonymes"
annee = "c. 1750"
image = "robe-de-cour.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/82426"
technique = "Silk and metallic thread, worn over wide panniers (England)"
collection = "Metropolitan Museum of Art, New York (Costume Institute)"
note = "A dress wider than it is tall: at the English court, blue silk embroidered with silver spreads over enormous panniers."
description = """
Seen from the front, the dress forms an almost perfect rectangle, much wider than it \
is tall. Above it, a narrow bust: the very fitted bodice opens in a square across the \
chest, and its central piece is embroidered with a large star of silvery foliage. The \
sleeves end at the elbow on silver-edged cuffs, from which spill white lace ruffles. \
On each side of the waist, the skirt leaves horizontally, supported by panniers, then \
falls sheer to the floor. On the pale blue silk are scattered silver spots and \
sprigs. The whole lower part of the skirt is covered with a broad silver border, made \
of branches and flowers on a net ground, which ends in scallops at floor level."""
evocation = """
This dress is not made for everyday life, but for appearing before the king. At the \
English court, under George II, women presented themselves in a ceremonial dress whose \
panniers were wider than those of town fashion. The skirt becomes a great panel of \
display, a flat surface on which the fabric and its embroideries can be spread out like \
a painting. The silver, which shines in candlelight, speaks of the wealth of the woman \
who wears it. The body almost disappears: one sees only a slender bust set on an \
immense base. At the British court, these panniers remained obligatory until the \
early nineteenth century, long after fashion had abandoned them."""
histoire = """
Like almost all eighteenth-century dresses, this one is anonymous. It was made in \
England around the middle of the century, at a time when the London district of \
Spitalfields was the great centre of English silk weaving; a dressmaker sewed it, then \
adorned it with embroidery and metal lace. It is not known for which lady of the court \
it was made. It is preserved in several pieces: gown, skirt and stomacher. The \
Metropolitan Museum bought it in 1965 thanks to the bequest of Irene Lewisohn, one of \
the founders of the New York museum of costume art from which the Costume Institute \
grew. Court dresses of this period, often cut up so that their silk and silver could be \
reused, have rarely come down to us whole."""
facture = """
The silhouette depends on the framework hidden beneath the skirt: panniers, made of \
hoops of cane, whalebone or metal, tied at the waist and projecting on each side over \
the hips. To cover such a width, the skirt is made of many full widths of silk, sewn \
side by side: the vertical seams can be seen on the front. The metallic decoration \
combines two techniques. The small motifs are scattered on the fabric, while the great \
border at the bottom is a lace of silver thread, applied to the silk. The front of the \
bodice is a separate stomacher, pinned or laced onto the boned bodice."""
details = [
  "The great star of foliage embroidered on the stomacher.",
  "The white lace ruffles that emerge from the sleeves at the elbow.",
  "The vertical seams of the silk widths on the skirt.",
  "The scalloped silver border at the bottom of the skirt.",
  "The silver spots scattered regularly over the blue ground.",
]
themes = ["18th century", "court", "panniers", "silver", "england"]
anecdote = """
With such panniers, one had to go through doors sideways and sit down with care. Some \
panniers were hinged: the sides could be lifted to pass more easily."""
salle = 2
mur = "nord"
place = 1
largeur = 1.9

[[oeuvres]]
titre = "Striped Robe à l'Anglaise"
artiste = "Couturières anonymes"
annee = "1785–1787"
image = "robe-a-l-anglaise.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/81105"
technique = "Striped silk taffeta, with a gauze fichu (France)"
collection = "Metropolitan Museum of Art, New York (Costume Institute)"
note = "Pink and white stripes, a fitted back, no more panniers: on the eve of the Revolution, the dress becomes simpler."
description = """
The mannequin is seen in three-quarter view. The dress is cut from a silk with \
vertical stripes of salmon pink and cream, which follow the body from the bust to the \
floor. The well-fitted bodice descends to a point at the waist; the sleeves, long and \
narrow, stop a little above the wrist on a small cuff. Over the shoulders and chest, a \
large fichu of white gauze, trimmed with ruffles, puffs out like a ruff and crosses in \
front. The dress opens over a skirt of the same silk, trimmed at mid-height with two \
rows of gathered ruffles. Behind, the fullness is carried towards the lower back and \
the dress trails slightly on the floor, where a light leather shoe peeps out."""
evocation = """
In the 1780s, French fashion became passionate about England, its country life, its \
walks and its simple fabrics. The robe "à l'anglaise" is the sign of it: it abandons \
the wide panniers and the pleats floating at the back of robes à la française. The \
body becomes visible again, with a slim waist and a skirt rounded at the back by a \
small pad. Stripes, very fashionable on the eve of the Revolution, lengthen the \
silhouette. The large gauze fichu, puffed out over the chest, gives the rounded line of \
these years, the one seen in the portraits of Élisabeth Vigée Le Brun. It is a dress \
for town and walking, more supple than court dress."""
histoire = """
The dress was made in France between 1785 and 1787, at a time when the fashion \
merchants of Paris, such as Rose Bertin, supplier to Marie-Antoinette, were launching \
new trimmings. The name of the dressmaker and that of the client are not known. The \
dress and its skirt are preserved together. The Metropolitan Museum bought them in \
1966, thanks to the bequest of Irene Lewisohn, like the court dress shown beside it. \
The stripes of the silk are wide enough that one can easily follow the cut of each \
piece, which makes it a precious witness to how a dress was constructed at the end of \
the eighteenth century."""
facture = """
What distinguishes the robe à l'anglaise is its back: instead of falling freely from \
the shoulders, the silk is cut and sewn as close to the body as possible down to the \
waist, then opens into pleats to form the skirt. The dressmaker played with the \
stripes. On the bodice and sleeves, they follow the length of the body; on the \
ruffles of the skirt, tightly gathered, they bunch together and change rhythm. The taffeta, light and a little stiff, holds the shape of the ruffles well. \
Beneath, a boned bodice slims the waist, and a small pad tied at the small of the back \
supports the rear of the skirt."""
details = [
  "The salmon-pink and cream stripes, which follow the body.",
  "The large white gauze fichu, puffed out over the chest.",
  "The two rows of gathered ruffles on the skirt.",
  "The point of the bodice at the waist.",
  "The light leather shoe that peeks out beneath the hem.",
]
themes = ["18th century", "anglomania", "stripes", "taffeta", "promenade"]
anecdote = """
The puffed fichu of these years, which swelled the chest like a jabot, was nicknamed \
the "lying fichu": it gave the bust a fullness that it did not always have."""
salle = 2
mur = "nord"
place = 3
largeur = 1.4

[[oeuvres]]
titre = "Yellow Silk Evening Dress"
artiste = "Couturières anonymes"
annee = "c. 1810"
image = "robe-du-soir-empire.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/82154"
technique = "Silk (France)"
collection = "Metropolitan Museum of Art, New York (Costume Institute)"
note = "A column of dazzling yellow: under the Empire, the waist rises beneath the bust and silk returns to the drawing rooms."
description = """
The dress, in a deep golden yellow, falls almost straight from the top of the bust to \
the floor. The waist is placed very high, just beneath the breasts, and marked by a \
narrow pale band, worked like embroidery. Above, the small bodice is gathered into \
fine vertical ribs, interrupted by two paler braids; the neckline, wide and rounded, \
leaves the tops of the shoulders bare. The sleeves are short puffed balloons, made of \
two superimposed puffs. The skirt, smooth and without ornament, flares barely at the \
bottom and touches the floor. In the light, the silk shows faint horizontal stripes, \
due to the weaving, and a few stains due to time."""
evocation = """
Around 1800, elegant women adopted the column dress, inspired by ancient statues, most \
often in white cotton muslin. Around 1810, the line remains the same, but colour \
returns. Under the Empire, Napoleon encouraged the silks of Lyon, which had suffered \
during the Revolution, and the imperial court rediscovered luxurious fabrics. This \
bold yellow, worn in the evening, was meant to blaze in candlelight. The silhouette \
frees the body: no more panniers, no more strangled waist, a vertical line that \
lengthens the woman and lets her shape be guessed. Beneath the dress, a short corset \
supports only the bust."""
histoire = """
The dress was made in France around 1810, probably by a Parisian dressmaker whose name \
is not known. It consists of several pieces, preserved together. The Metropolitan \
Museum bought it in 1937 with the Rogers Fund, one of the museum's great acquisition \
funds, before the Costume Institute even joined the Metropolitan in 1946. Coloured \
silk dresses of this period are rarer than white muslin ones: their dyes, sensitive to \
light, have often faded, and many were recut to follow fashion. This one has kept a \
very vivid yellow."""
facture = """
The cut is simple and economical: a few straight widths of silk form the skirt, a \
little wider at the back, and are gathered beneath the bust onto the waistband. All the \
work is concentrated in the bodice. The silk is gathered there into parallel ribs, \
held by seams, which makes it cling to the bust without darts. The sleeves are made of \
two bands of silk gathered one above the other, to obtain two small puffs. The pale \
band at the waist, like the braids on the bodice, brings a touch of light to the plain \
yellow."""
details = [
  "The pale band of the waist, just beneath the bust.",
  "The fine gathered ribs of the bodice.",
  "The sleeves in two superimposed puffs.",
  "The faint stripes of the weave, visible in the skirt.",
  "The absence of any ornament on the skirt.",
]
themes = ["empire", "high waist", "silk", "yellow", "neoclassicism"]
anecdote = """
Dresses of this period, with their waists placed so high, are often called "Regency" \
in English, after the regency of the future George IV, from 1811 to 1820: these are \
the ones worn by Jane Austen's heroines in the rooms of Bath."""
salle = 3
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Dress with Leg-of-Mutton Sleeves"
artiste = "Couturières anonymes"
annee = "1832–1835"
image = "robe-a-manches-gigot.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/159123"
technique = "Printed cotton and linen (United States)"
collection = "Metropolitan Museum of Art, New York (Brooklyn Museum Costume Collection)"
note = "Immense shoulders and a waist returned to its place: the Romantic silhouette in cotton printed with bouquets."
description = """
The dress is made of a pale cotton printed with bouquets of pink, red and green \
flowers, scattered between large cream scrolls dotted with small spots. The very wide \
neckline leaves the tops of the shoulders bare; the bodice is gathered in pleats that \
converge towards the centre, then drawn in at the waist by a belt of the same fabric. \
The sleeves are enormous: puffed like balloons from the shoulder to the elbow, they \
then narrow along the forearm and close at the wrist with a small ruffle. The skirt, \
gathered at the waist, is broadly rounded and stops at ankle level. Seen from the \
front, the silhouette forms two triangles that meet at the waist."""
evocation = """
After the column of the Empire, the waist returned to its natural place around 1825, \
and everything widened around it: the shoulders, thanks to the sleeves, and the skirt, \
supported by petticoats. The waist thus seems slimmer still. This is the fashion of \
the Romantic years, that of Balzac's heroines and of the Paris fashion lithographs \
that circulated as far as America. The name "leg-of-mutton" comes from the shape of the \
sleeve, which recalls a leg of lamb. Around 1835, these sleeves reached their greatest \
fullness; from 1836, they collapsed and the fullness slid down the arm. This dress \
therefore catches fashion at its peak."""
histoire = """
This dress was made in the United States in the early 1830s, for a woman whose name is \
unknown. It shows that fashion from Europe was followed closely in America, where \
Parisian and London fashion journals were received. It was given in 1990 to the \
Brooklyn Museum by Mrs. Harold N. Weber. In 2009, the Brooklyn Museum entrusted its \
entire costume collection to the Metropolitan Museum, where it is now held at the \
Costume Institute. Cotton dresses of this kind, worn by day, were washed and worn out: \
fewer of them have come down to us than silk dresses for great occasions."""
facture = """
The fabric counts as much as the cut. In the early nineteenth century, copper-roller \
printing made it possible to print cotton continuously, much faster than with a wooden \
block: flowered cottons became affordable for a wide public. Here, the cream ground, \
the scrolls and the multicoloured bouquets imply several passes. The cut of the \
sleeves requires a great deal of cloth: each is cut from a wide piece, rounded at the \
top, gathered at the shoulder, then fitted over the forearm. To help them keep their \
shape, down-stuffed pads were sometimes slipped underneath."""
details = [
  "The sleeves puffed to the elbow, then tight on the forearm.",
  "The gathers of the bodice that converge towards the centre.",
  "The bouquets of pink and red flowers scattered over the pale ground.",
  "The cream scrolls dotted with small spots.",
  "The small ruffle that closes each wrist.",
]
themes = ["romanticism", "leg-of-mutton sleeves", "printed cotton", "flowers", "america"]
anecdote = """
The sleeves of these years were so wide that they were sometimes supported from inside \
by small pads or frames attached to the shoulder, to keep them from collapsing."""
salle = 3
mur = "nord"
place = 4
largeur = 1.25

[[oeuvres]]
titre = "Tulle Crinoline Ball Gown"
artiste = "Couturières anonymes"
annee = "1856–1859"
image = "robe-de-bal-a-crinoline.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/126927"
technique = "Silk and silk tulle, black lace, worn over a crinoline (America or Europe)"
collection = "Metropolitan Museum of Art, New York (Costume Institute)"
note = "A cloud of ivory tulle striped with black lace: the steel crinoline makes immense, light ball skirts possible."
description = """
The dress forms an enormous bell, whose skirt touches the floor all around. The \
bodice, tight and pointed at the waist, leaves the shoulders bare: it is crossed by \
bands of gathered tulle, each edged with fine black lace, which form a broad bertha. \
The sleeves are simple puffs of tulle. On the skirt, the ivory tulle falls in \
transparent veils over a silk ground. The bottom is covered with many tiered ruffles, \
also edged with black lace, which draw horizontal lines all around the dress. Over it, \
a broad band of tulle draws a zigzag in the shape of an M, like a garland laid on the \
skirt."""
evocation = """
Around 1856, an invention changed the silhouette: the cage crinoline, made of flexible \
steel hoops linked by tapes. It replaced the thick petticoats of horsehair and starch \
and made skirts wider than ever, but light. Ball gowns took advantage of it: metres of \
tulle and gauze were layered on it, which seem to float around the dancer. The \
contrast of ivory and black, the zigzag lace and the ruffles give movement to a form \
that is nonetheless fixed. This is the age of the Second Empire in France, of the balls \
of the Tuileries around the Empress Eugénie, and of Strauss's waltzes in Vienna: the \
bell skirt whirls at every step."""
histoire = """
The Metropolitan Museum describes this dress as American or European: its exact place \
of manufacture is not known, nor is the name of the dressmaker. Silk tulle was then \
made by machine in France and England, and ball gowns closely followed Paris fashion, \
on both sides of the Atlantic. The dress, in two pieces, bodice and skirt, was given \
to the Costume Institute in 1969 by Mary Pierrepont Beckwith, with other nineteenth-century \
ball gowns. Such fine tulle is very fragile: that it has reached us in such good \
condition is rare for a dress of this period."""
facture = """
Such a dress is built in layers. Beneath, the crinoline gives the shape; over it, a \
silk petticoat hides the hoops; then come the veils of tulle, gathered onto the waist. \
The ruffles at the bottom are made of bands of tulle gathered and sewn in tight rows, \
each edged with black bobbin or machine lace. The great zigzag is an applied band, \
pinned and then sewn onto the skirt. The bodice, for its part, is solid: lined and \
boned, it carries the tulle bertha like a collar and cinches the waist to a point, \
which makes the skirt look wider still."""
details = [
  "The gathered tulle bertha, edged with black lace, on the shoulders.",
  "The point of the bodice that dips into the skirt.",
  "The great zigzag of black lace laid on the skirt.",
  "The tiered ruffles at the bottom, like regular waves.",
  "The transparency of the ivory tulle over the silk ground.",
]
themes = ["second empire", "crinoline", "tulle", "ball", "lace"]
anecdote = """
The word "crinoline" comes from horsehair, which was woven with linen to stiffen \
petticoats. The name stuck to the steel cage that replaced them."""
salle = 3
mur = "nord"
place = 7
largeur = 1.5

[[oeuvres]]
titre = "Striped Bustle Dress"
artiste = "Couturières anonymes"
annee = "1885–1888"
image = "robe-a-tournure.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/157306"
technique = "Cotton and silk (United States)"
collection = "Metropolitan Museum of Art, New York (Brooklyn Museum Costume Collection)"
note = "Seen in profile, the dress throws all its volume to the back: the bustle of the 1880s, in navy-blue stripes."
description = """
The mannequin is seen in profile. The dress is cut from a fabric with broad navy-blue \
and cream stripes. The very fitted bodice rises to the neck, where a straight collar \
of plum silk closes with a bow; the long, narrow sleeves follow the arm. On the \
underskirt, pleated in flat pleats, the stripes run horizontally. Over it, a draped \
overskirt rises at the hip in large rounded folds, then joins the back. There, at the \
bottom of the back, the dress forms an almost horizontal projection, like a shelf, from \
which a long panel of vertical stripes falls to the floor. The front is flat; all the \
volume is behind."""
evocation = """
After the bell of the crinoline, the fullness of skirts shifted to the back from the \
late 1860s. In the 1880s, this "bustle" returned stiffer and more prominent than ever: \
the lower back juts out like a tray. In front, the skirt is flat and narrow; in \
profile, the woman draws an arched, almost architectural line. The stripes play on \
this: vertical on the bodice and the back panel, horizontal on the pleated skirt, they \
underline each volume. The navy blue and cream, the high collar and the tight sleeves \
give this day dress a neat, almost sporty look, suited to walks and holidays in the \
country."""
histoire = """
This dress was made in the United States between 1885 and 1888; neither the \
dressmaker nor the client is known. It consists of two pieces, the bodice and the \
skirt. It was given in 1960 to the Brooklyn Museum by H. Dunscombe Colt. In 2009, the \
Brooklyn Museum entrusted its entire costume collection to the Metropolitan Museum, \
where it is now held at the Costume Institute. At that time, the sewing patterns \
published by fashion journals and the sewing machine, widespread since the 1850s, \
allowed many women to follow fashion, whether through a dressmaker or at home."""
facture = """
The shape does not hold by itself: beneath the skirt, the woman tied at her waist a \
bustle, a small stuffed pad or a frame of steel strips, which projects the back of the \
dress. The dressmaker then draped the overskirt around this volume, raising the fabric \
with hidden stitches to form the large folds of the hip. The play of stripes demands a \
precise cut: the same fabric is cut on the straight grain for the bodice and the back \
panel, and across the grain for the pleated skirt, so that the stripes change \
direction from one piece to the next. The bodice, lined and boned, fastens at the \
front."""
details = [
  "The straight plum silk collar, closed with a bow.",
  "The projection of the bustle, at the bottom of the back.",
  "The horizontal stripes of the pleated skirt.",
  "The long panel of vertical stripes that falls behind.",
  "The large folds draped over the hip.",
]
themes = ["bustle", "stripes", "drapery", "1880s", "silhouette"]
anecdote = """
Some bustles of the 1880s were made of hinged steel strips, which folded up when one \
sat down and sprang back into shape when one stood."""
salle = 3
mur = "nord"
place = 9
largeur = 1.2

[[oeuvres]]
titre = "Tea Gown"
artiste = "Maison Worth"
annee = "1894"
image = "robe-de-the-worth.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/159189"
technique = "Figured silk, silk and cotton, lace; House of Worth, Paris"
collection = "Metropolitan Museum of Art, New York (Brooklyn Museum Costume Collection)"
note = "A dress for receiving at home at tea time: loose, with a train, in a silvery figured silk from the House of Worth."
description = """
The mannequin, her hair in upswept curls, stands in profile, holding a hand-painted \
fan. Her dress seems to fall from the shoulders to the floor in a single sheet, with no \
marked waist, and lengthens behind into a train that spreads in folds. The fabric, \
silver and cream, is covered with a repeated pattern of fan-shaped palmettes, woven \
into the silk. The shoulders are covered with a broad collar of ecru lace; the \
sleeves, very full to the elbow, are decorated with bows of pale green and cream \
ribbon. Through the opening at the front, a smooth water-green silk can be glimpsed. \
White gloves rise to the elbow."""
evocation = """
The tea gown appeared in the 1870s in England and France. It is a house dress worn in \
the late afternoon to receive close friends over tea, between the day toilette and the \
dinner one. Freer than town dresses, it is worn with a less tightly laced corset and \
falls softly from the shoulders: it evokes the loose gowns of the Pre-Raphaelite \
painters and the artistic taste of the time. Yet at Worth, it remains a luxury dress, \
made of a precious silk and adorned with lace. The puffed sleeves, fashionable in \
1894, remind us that it nevertheless follows the silhouette of its day."""
histoire = """
Charles Frederick Worth, an Englishman settled in Paris, founded his house on the rue \
de la Paix in 1858 and invented the profession of the couturier: he showed his designs \
on living models and signed his dresses with a label. In 1894, a year before his \
death, his sons Gaston and Jean-Philippe were already largely running the house. This \
dress was given to the Brooklyn Museum in 1931 by Princess Viggo, in accordance with \
the wishes of the Misses Hewitt, Sarah and Eleanor, founders of the design museum that \
became the Cooper Hewitt in New York. With the costume collection of the Brooklyn \
Museum, it has been held since 2009 at the Costume Institute of the Metropolitan \
Museum."""
facture = """
The House of Worth worked in close relation with the silk manufacturers of Lyon, who \
wove for it figured fabrics with motifs often designed specially. Here, the palmette \
pattern, in pale threads on a darker ground, is woven into the fabric and changes its \
sheen with the light. The cut in long panels, with no marked waist, lets the silk fall \
from the shoulders to the train, so that the pattern stays continuous. The water-green underlayer, visible in front, creates a contrast of \
colour. The sleeves are gathered onto the shoulder, and the lace of the collar is \
applied by hand."""
details = [
  "The pattern of fan-shaped palmettes, woven into the silk.",
  "The broad ecru lace collar on the shoulders.",
  "The pale green ribbon bows on the sleeves.",
  "The water-green silk glimpsed through the front opening.",
  "The train that spreads in folds on the floor.",
]
themes = ["house dress", "worth", "figured silk", "lace", "belle époque"]
anecdote = """
Afternoon tea spread in England in the middle of the nineteenth century. Its invention \
is often attributed to Anna, Duchess of Bedford, who found the time between lunch and \
dinner too long."""
