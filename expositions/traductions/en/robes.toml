[exposition]
ordre = 69
nom_court = "Dresses"
mouvement = "The Dress, from the Court of George II to the Roaring Twenties"
cadre = "vitrine"
couleur = "#9c4f6e"
titre = "Dresses, Silhouette and Fabric"
artiste = "House of Worth, anonymous dressmakers…"
dates = "c. 1750–c. 1926"
accroche = "Virtual exhibition · Fashion Museum, Assembly Rooms, Bath"
introduction = """
In less than two centuries, the dress changed shape completely several times. Around \
1750, set on panniers, it is wider than it is tall; around 1810, it falls straight from \
the bust; around 1835, it is the sleeves that swell; around 1858, the skirt becomes a \
bell; around 1886, all the fullness moves to the back; in 1926, the dress stops at the \
knee and no longer marks the waist. This exhibition follows ten dresses, from the \
English court dress to the sequinned dance dress of the Roaring Twenties, looking at \
what makes each silhouette: the hidden frameworks beneath, the cut, and the fabrics, \
brocaded silks, printed cottons, tulles, satins, crêpes. Eight come from the Costume \
Institute of the Metropolitan Museum in New York, two from the Rijksmuseum in \
Amsterdam. The building is inspired by the Assembly Rooms in Bath, eighteenth-century \
ballrooms that long housed the city's fashion museum."""
vitrine = "robe-de-cour.jpg"

[musee]
nom = "Fashion Museum, Assembly Rooms, Bath"
ville = "Bath, England"
architecte = "John Wood the Younger"
construction = "1769–1771"
presentation = """
In the eighteenth century, Bath, a spa town in the west of England, was the meeting \
place of fashionable society, which came to take the waters, dance, play cards and be \
seen. The architect John Wood the Younger, to whom we also owe the Royal Crescent, \
built there from 1769 to 1771 new public rooms, the Assembly Rooms, also called the \
"Upper Rooms". Behind a sober façade of honey-coloured stone come in succession an \
immense ballroom, a tea room, an octagonal drawing room and, a little later, a card \
room. Jane Austen leads the heroines of Northanger Abbey and Persuasion there. Set on \
fire in a bombing raid in 1942, the rooms were restored and reopened in 1963. The same \
year, the costume collection assembled by the fashion historian Doris Langley Moore \
moved into the basement: this was the Museum of Costume, later renamed the Fashion \
Museum, one of the great fashion collections of Europe. It has since left the Assembly \
Rooms to prepare a new venue in the city."""
ici = """
The ARTEON building takes up the sequence of the Assembly Rooms around their octagonal \
room. Visitors enter from the south into "The Vestibule", with its walls of \
honey-coloured stone, which leads to "The Octagon", where two eighteenth-century \
dresses welcome the visitor. To the west stretches "The Ballroom", thirty-four metres \
long and ten metres high, where four dresses tell the story of nineteenth-century \
silhouettes, from the Empire to the bustle. To the east, "The Tea Room" brings together \
two dresses by the House of Worth; to the north, "The Card Room", more intimate, \
shows two dresses of the Roaring Twenties."""

