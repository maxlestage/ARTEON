[[oeuvres]]
titre = "Ball Gown with Wheat Ears"
artiste = "Maison Worth"
annee = "1900"
image = "robe-de-bal-worth.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/155944"
technique = "Embroidered silk satin, rhinestones, lace and tulle; House of Worth, Paris"
collection = "Metropolitan Museum of Art, New York (Brooklyn Museum Costume Collection)"
note = "Pink satin up which climb embroidered, sequinned ears of wheat: a House of Worth ball gown in the year 1900."
description = """
The dress is in pale pink satin, smooth and glossy. The very fitted bodice descends to \
a point over the front of the skirt; the asymmetrical neckline is veiled with pale grey \
tulle and edged with ecru lace, which also forms the small sleeves. The skirt, smooth \
over the hips, flares at the bottom like a corolla and spreads behind in a long train. \
On the front, two large embroidered stems rise from the hem towards the waist, laden \
with golden ears of wheat; other ears cross the bodice on the diagonal and scatter over \
the train. The embroideries glitter: rhinestones are caught in the golden threads."""
evocation = """
In 1900, the year of the Paris Exposition Universelle, the ball gown was at the height \
of luxury. The silhouette is that of the Belle Époque: bust thrust forward, narrow \
waist, skirt clinging to the hips and flaring at the bottom, like an inverted flower. \
The ears of wheat, a motif of nature and harvest, respond to Art Nouveau's taste for \
plants, but are here drawn with great regularity. The pale pink and gold, under the \
electric lighting that was reaching the ballrooms, must have glittered brilliantly. \
Such a dress was worn for only a few evenings, for the great balls of the season, in \
Paris, London or New York."""
histoire = """
After the death of Charles Frederick Worth in 1895, the house passed to his sons: \
Gaston looked after management, Jean-Philippe design. The house then dressed the \
courts of Europe and American high society, whose clients crossed the Atlantic to \
order their wardrobes in Paris. This dress was given to the Brooklyn Museum in 1957 by \
the estate of Mrs. Arthur F. Schermerhorn, of a great New York family. It consists of \
two pieces, the bodice and the skirt. In 2009, with the entire costume collection of \
the Brooklyn Museum, it joined the Costume Institute of the Metropolitan Museum."""
facture = """
Satin, woven so that the silk floats on the surface, gives this smooth, continuous \
light, which the embroidery interrupts. The ears of wheat are embroidered by hand in \
golden threads, with rhinestones that catch the light; their stems, in long curved \
lines, guide the eye from the hem to the waist. The skirt is made of gores cut to a \
point, narrow at the top and wide at the bottom, to cling to the hips and then open \
out. The bodice is built on a boned lining. The grey tulle and the lace of the \
neckline, draped on the bias, soften the clean line of the satin."""
details = [
  "The two great stems of wheat ears embroidered on the front of the skirt.",
  "The ears laid on the diagonal across the bodice.",
  "The ecru lace of the small sleeves.",
  "The pale grey tulle that veils the neckline.",
  "The satin train, also scattered with ears of wheat.",
]
themes = ["belle époque", "ball", "worth", "embroidery", "satin"]
anecdote = """
The clients of the House of Worth sometimes came from very far: wealthy Americans made \
the journey to Paris to order the dresses for a whole season at once."""
salle = 4
mur = "nord"
place = 5
largeur = 1.2

[[oeuvres]]
titre = "Evening Dress with Geometric Decoration"
artiste = "Ateliers anonymes des années folles"
annee = "1920"
image = "robe-du-soir-1920.jpg"
licence = "Domaine public"
source = "https://www.rijksmuseum.nl/nl/collectie/BK-1973-364"
technique = "Crêpe de Chine and silk satin, embroidery in black, gold and silver soutache; length 107 cm (probably Paris)"
collection = "Rijksmuseum, Amsterdam"
note = "A straight dress, red and black, with no marked waist: in 1920, the evening dress becomes a geometric surface."
description = """
The dress is straight, with no marked waist, and stops below the knee. The top is in \
coral-red silk crêpe, with small short sleeves; a collar of black satin surrounds the \
round neckline and ties in front in a bow. On the chest, two embroidered ladder-shaped \
bands descend and end in a hook. Lower down, a large applied panel occupies the front: \
a lattice of black soutache covers a cream area, which ends in a crenellated edge, \
underlined in gold; beneath it comes a band of black satin. A red band, then a black \
skirt, finish the dress. At the sides, black panels hang freely."""
evocation = """
In the aftermath of the First World War, the dress changed logic. The body was no \
longer sculpted by a corset: the dress fell straight from the shoulders, like a tunic, \
and decoration replaced cut. Here, everything is a matter of surfaces and lines: \
ladders, lattice, crenellations, bands of bold colours, red, black, cream and gold. \
The Rijksmuseum links this decoration to a geometric Jugendstil, the one which, from \
Vienna to Paris, prepared the way for Art Deco. The dress is already shortening, \
revealing the lower legs. This style foreshadows the silhouette of the Roaring \
Twenties, flat and rectilinear, which we will find, shorter still, in the neighbouring \
dance dress."""
histoire = """
It is not known who made this dress: the Rijksmuseum attributes it to an anonymous \
workshop, perhaps Parisian, and dates it to 1920. The Amsterdam museum holds an \
important collection of costumes, largely Dutch, which it displays in rotation because \
light damages fabrics. The dress entered it in 1973, bought with the support of a \
foundation of patrons created to enrich the museum's collections. It is evidence of \
these evening dresses of the immediate post-war period, less well known than the great \
signed creations, but which show how a couture house or a dressmaker followed the new \
fashion."""
facture = """
The dress is built with very little cutting: according to the museum's catalogue entry, \
it is a straight model, without darts, made of a few large panels of fabric. The work \
lies in the assembly of materials and colours. The crêpe de Chine, supple and matte, \
contrasts with the black satin, smooth and shiny. The decoration is obtained by \
sewing flat onto the fabric soutaches, small cords of black silk, gold and silver, \
which draw the ladders, the lattice and the crenellated edge: it is a raised \
embroidery, quick to execute and very graphic. The front panel floats freely and moves \
with the walk."""
details = [
  "The black satin collar tied in front.",
  "The two embroidered ladders that descend over the chest.",
  "The black lattice on a cream ground.",
  "The crenellated edge, underlined with gold soutache.",
  "The black panels that fall at the sides.",
]
themes = ["1920s", "geometry", "crêpe de chine", "embroidery", "straight dress"]
anecdote = """
Crêpe de Chine, despite its name, does not need to come from China: it is a light silk \
with a fine grain, woven with very tightly twisted threads, which the silk \
manufacturers of Lyon notably produced."""
salle = 5
mur = "nord"
place = 1
largeur = 1.05

[[oeuvres]]
titre = "Sequinned Dance Dress"
artiste = "Ateliers anonymes des années folles"
annee = "c. 1926"
image = "robe-de-danse-paillettes.jpg"
licence = "Domaine public"
source = "https://www.rijksmuseum.nl/nl/collectie/BK-1973-370-A"
technique = "Black tulle, crêpe de Chine, sequins; length 110 cm (probably France)"
collection = "Rijksmuseum, Amsterdam"
note = "A short, sleeveless dress streaming with black sequins: the \"garçonne\" silhouette of the Roaring Twenties."
description = """
The dress stops at the knee. Sleeveless, it falls straight from narrow shoulders, with \
a deep round neckline. It is made of black tulle entirely covered with black and \
silver sequins, sewn in tight vertical lines, which stream like a rain of light. At \
hip level, where the waist of these years is placed, a broad belt of stylised flowers \
encircles the dress: large corollas in pink, gold and blue, outlined with coppery \
scrolls and yellow dots, all made of sequins. At the sides, below the hips, two panels \
of transparent tulle flare out. The hem is straight and underlined with a sequinned \
band."""
evocation = """
Around 1925, the woman of the Roaring Twenties, whom the French called the \
"garçonne", cut her hair, shortened her dress to the knee and erased her waist. The \
dress became a simple straight sheath, worn without a corset, leaving the arms and \
legs free to dance the Charleston and the foxtrot. What it loses in cut, it gains in \
brilliance: beads and sequins cover the fabric and glitter at every movement under the \
lights of the dance halls. The belt of flowers, with its outlined shapes and bright \
colours, belongs fully to Art Deco, celebrated in Paris at the International \
Exhibition of Decorative Arts in 1925."""
histoire = """
The Rijksmuseum describes this dress as the work of an anonymous workshop, perhaps \
French, and dates it to around 1926. The museum calls it a "short evening dress or \
dance dress": the knee length and the panels that open at the sides were made for \
dancing. It entered the Rijksmuseum in 1973, bought with the support of a foundation \
of patrons, at the same time as other dresses of the 1920s. These sequinned dresses \
were produced in large numbers, in Paris and elsewhere, often embroidered in \
specialised workshops. Their weight and the fragility of the tulle explain why few of \
them have come down to us in good condition."""
facture = """
The dress is almost a rectangle: the museum's entry describes it as a one-piece model, \
sleeveless, with a dropped waist, with a round neckline in front and a U-shaped one at \
the back. All the richness is in the embroidery. Thousands of sequins were sewn one by \
one onto the tulle, in vertical rows, to lengthen the silhouette. The flowers of the \
belt are built from sequins of several colours, laid in circles and scrolls. The \
museum notes sequins of synthetic material. Below the hips, two bands of gathered \
tulle, applied at the sides, give fullness to the bottom of the dress."""
details = [
  "The vertical rows of sequins, like rain.",
  "The belt of sequinned flowers, laid across the hips.",
  "The pink and gold corollas outlined with coppery scrolls.",
  "The panels of transparent tulle that flare at the sides.",
  "The round neckline and the narrow shoulders, without sleeves.",
]
themes = ["roaring twenties", "garçonne", "sequins", "art deco", "dance"]
anecdote = """
The word "garçonne" was popularised by Victor Margueritte's novel La Garçonne, \
published in 1922, whose heroine lives freely and wears her hair short. The book caused \
a scandal."""
salle = 5
mur = "nord"
place = 3
largeur = 1.05

[[artistes]]
nom = "Couturières anonymes"
vie = "England, France and the United States, 18th–19th century"
biographie = """
Until the middle of the nineteenth century, dresses did not bear the name of the person \
who made them. In Paris, Louis XIV granted dressmakers in 1675 the right to form their \
own guild and to dress women; in England, the "mantua-maker" played the same role. A \
dress was then born of the work of several trades: the merchant sold the silk, often \
woven in Lyon or Spitalfields, the dressmaker cut and assembled, the fashion merchant \
added ribbons, lace and braid. A few names have survived, such as Rose Bertin, fashion \
merchant to Marie-Antoinette. In the nineteenth century, dressmakers worked in \
workshops or at their clients' homes, from the engravings of fashion journals, which \
spread Paris fashion as far as America. The sewing machine, widespread from the 1850s, \
and the patterns published by journals sped up their work. Their names have almost all \
been lost: their dresses, kept in families and then given to museums, remain their only \
signature."""
style = """
Their art follows collective rules, set by the court and then by fashion journals, not \
by a single designer. It rests on an intimate knowledge of fabrics, which are cut as \
little as possible and remade as fashions change, and on a skill handed down from \
workshop to workshop: fitting a bodice, setting a skirt over panniers, a crinoline or a \
bustle, applying a trimming."""

[[artistes]]
nom = "Maison Worth"
vie = "Paris, 1858 – 1956"
biographie = """
The house was founded in 1858 at 7 rue de la Paix in Paris by Charles Frederick Worth, \
an Englishman born in 1825 in Lincolnshire, trained with London drapers and then with \
Gagelin in Paris, at first in partnership with the Swede Otto Bobergh. Thanks to \
Princess Metternich, he became the couturier of the Empress Eugénie and the court of \
the Second Empire, then of the courts of Europe, of actresses and of wealthy Americans. \
He showed his designs on living women and signed his dresses with a label: he thus \
invented the profession of the couturier. At his death, in 1895, his sons succeeded \
him: Gaston ran the business, Jean-Philippe designed the models. The next generation, \
with Jean-Charles Worth, took over the house in the twentieth century. Challenged by \
new couturiers, the house merged with Paquin in 1954 and closed shortly afterwards, in \
1956, after nearly a century of activity."""
style = """
The Worth style rests on sumptuous silks, often woven in Lyon from designs \
commissioned for the house, and on cuts of great precision. Worth changed the \
silhouette from season to season, from the crinoline to the bustle; his sons extended \
this luxury into the Belle Époque, with embroidered ball gowns and house dresses in \
figured fabrics."""

[[artistes]]
nom = "Ateliers anonymes des années folles"
vie = "France, 1920s"
biographie = """
In the 1920s, Paris remained the capital of fashion. Alongside the great couture \
houses, whose names are known, worked a multitude of small houses, dressmakers and \
specialised workshops, embroiderers, feather workers, makers of beads and sequins, \
which supplied the whole profession. After the First World War, the dress was \
simplified: straight, without a corset, shorter and shorter, it lent itself to \
decoration applied flat, geometric embroidery, beads or sequins. These dresses, often \
sold abroad or copied from Paris models, have rarely kept their labels. Museums, like \
the Rijksmuseum in Amsterdam, hold them under the name of anonymous workshops, \
indicating only their probable origin. They nevertheless show all the boldness of the \
fashion of the Roaring Twenties, that of the garçonne, of jazz and of Art Deco."""
style = """
Their style is that of Art Deco: straight lines, geometric motifs, bold colours, the \
sparkle of beads and sequins. The cut is reduced to a minimum, a few panels of fabric \
without darts, and all the richness goes into the decoration and the materials, crêpe \
de Chine, satin and tulle."""
