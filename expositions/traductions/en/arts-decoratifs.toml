[exposition]
ordre = 165
nom_court = "Decorative Arts"
mouvement = "Art Nouveau and Art Deco, the decorative arts"
cadre = "vitrine"
couleur = "#566b34"
titre = "From Art Nouveau to Art Deco: Art in the Home"
artiste = "Tiffany, Gallé, Daum, Guimard, Mackintosh, Ruhlmann, Lalique…"
dates = "1897–1926"
accroche = "Virtual exhibition · Musée des Arts décoratifs, Paris"
introduction = """
Around 1890, artists refused to copy the styles of the past and wanted to bring art into every corner of life: a lamp, a chair, a vase or a poster. Art Nouveau drew its lines from plants and insects, from Nancy to Glasgow and from Paris to New York; in the 1920s, Art Deco answered with geometry, precious woods and moulded glass. The visit brings together ten objects, from 1897 to 1926, shown in display cases. The building is inspired by the Musée des Arts décoratifs in Paris, housed in the Pavillon de Marsan at the Louvre: a great nave fourteen metres high, from which one reaches the galleries."""
vitrine = "magnolias-et-iris.jpg"

[musee]
nom = "Musée des Arts décoratifs"
ville = "Paris, France"
construction = "Opened in 1905 in the Pavillon de Marsan of the Louvre"
presentation = """
In 1864, manufacturers, artists and collectors founded the Union centrale des beaux-arts appliqués à l'industrie in Paris: they wanted objects made in France to remain beautiful in the age of the machine. Renamed the Union centrale des arts décoratifs in 1882, the association built up collections and obtained from the State the Pavillon de Marsan, at the western end of the Louvre wing that runs along the rue de Rivoli. The pavilion, burned in 1871 with the Tuileries Palace during the Commune, had been rebuilt soon afterwards. The museum opened there in 1905. At the heart of the building, a vast nave covered by a glass roof serves galleries on several levels. Visitors follow the history of objects from the Middle Ages to the present day: furniture, ceramics, glass, goldsmiths' work, wallpapers, toys, posters. The Art Nouveau and Art Deco rooms are renowned, with the pieces from the apartment of the couturière Jeanne Lanvin, designed by Armand-Albert Rateau. After ten years of renovation, the museum reopened in 2006."""
ici = """
ARTEON's building takes up the idea of the Parisian museum's nave. Visitors enter from the south into “The Nave”, twenty metres long and fourteen high, with stone-coloured walls, where a poster by Mucha and a large vase by Guimard welcome them. To the west opens the pale green gallery “Nancy, Glass and Nature”; to the east, “Tiffany, the Light of New York”, the colour of honey. To the north, the gallery “Paris and Glasgow, the Line” sets two seats face to face, then leads to the last room, “1925, Art Deco”."""

