[[oeuvres]]
titre = "Corner Cabinet with Vase of Flowers"
artiste = "Jacques-Émile Ruhlmann"
annee = "c. 1923"
image = "encoignure-ruhlmann.jpg"
credit = "Photo : Brooklyn Museum"
licence = "Aucune restriction connue (Brooklyn Museum)"
source = "https://commons.wikimedia.org/wiki/File:Emile-Jacques_Ruhlmann_(French,_1879-1933)._Corner_Cabinet,_ca._1923..jpg"
technique = "Amaranth veneer on mahogany, ivory inlay, 126.7 × 80.6 × 59.7 cm"
collection = "Brooklyn Museum, New York"
note = "A corner piece in precious wood, where an ivory bouquet bursts forth against the dark wood: Art Deco luxury."
description = """
This corner cabinet, 1.27 metres high, is made to fit into the corner of a room: its slightly bowed front consists of a single door. The wood, a deep reddish brown, is polished like lacquer. At the centre of the door, a large oval medallion contains a decoration inlaid with ivory and dark wood: a fluted, very elongated vase from which bursts a bouquet of stylised flowers with round corollas, so dense that it fills the whole oval. A band of tiny ivory dots underlines the edges of the door and the uprights. The cabinet rests on three slender, tapering legs, ending in ivory feet."""
evocation = """
Ruhlmann takes up a typical piece of eighteenth-century French furniture, the corner cabinet, and modernises it without losing any of its elegance. The vase of flowers, a classic motif, becomes a geometric and rhythmic image: the fluting of the vase, the symmetry, the contrast of black and white herald Art Deco. This piece addresses a very wealthy clientele, who wanted a discreet luxury made of rare woods and perfect finishes. One also reads in it the reverse of this luxury: ivory and exotic woods came in large part from the colonies, at a time when little thought was given to the human and natural cost of their exploitation."""
histoire = """
Ruhlmann returned several times to this model of corner cabinet with a vase of flowers, with variations: a similar piece preserved at the Art Institute of Chicago is dated to around 1916. This one dates from around 1923, two years before the 1925 Exposition internationale des arts décoratifs et industriels modernes, which consecrated Ruhlmann and whose name would later give its name to the Art Deco style. His furniture, executed with great care, was produced in small numbers and sold at very high prices. This piece was bought by the Brooklyn Museum in 1971, thanks to several donors, at a time when the taste of the 1920s was being rediscovered."""
facture = """
Veneering consists of gluing thin sheets of precious wood onto a plainer frame, here mahogany. Ruhlmann chose amaranth, a tropical wood with a purplish red tone, and had its surface polished until it was smooth as a mirror. The medallion is marquetry: numerous small pieces of ivory and dark wood, cut and assembled like a puzzle. The bands of ivory dots, the ivory feet and the tapering legs, which lighten the silhouette, are signatures of his style."""
details = [
  "The fluted vase of the medallion, from which the bouquet bursts.",
  "The band of ivory dots running along the door.",
  "The ivory feet at the ends of the tapering legs.",
  "The slightly bowed front, which catches the light.",
]
themes = ["furniture", "art deco", "cabinetmaking", "flowers", "luxury"]
anecdote = """
Ruhlmann did not want his firm to outlive him: he had asked that it be closed after his death. His workshops did indeed cease activity shortly after he died, in 1933."""
salle = 5
mur = "nord"
place = 2
