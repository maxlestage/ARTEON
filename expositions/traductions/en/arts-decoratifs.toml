[[artistes]]
nom = "Alphonse Mucha"
vie = "Ivančice (Moravia), 24 July 1860 – Prague, 14 July 1939"
biographie = """
Born in Moravia, then a province of the Austrian Empire, Alfons Mucha first worked as a theatre scene painter in Vienna, then decorated the castle of a count who paid for him to study at the Academy of Fine Arts in Munich. Arriving in Paris in 1887, he attended classes at the Académie Julian and the Académie Colarossi and lived by his illustrations. At the end of 1894, almost by chance, he designed the poster for Gismonda for Sarah Bernhardt: plastered across Paris in early 1895, it made him famous. The actress signed him to a six-year contract and the printer Champenois took him on. Posters, decorative panels, calendars, jewellery and a shop for the jeweller Georges Fouquet: he became one of the faces of Art Nouveau. After several stays in the United States, he returned to Bohemia in 1910 and devoted nearly twenty years to the Slav Epic, a cycle of twenty immense canvases on the history of the Slavic peoples. In 1918, he designed the first stamps and banknotes of independent Czechoslovakia. Arrested and interrogated by the Gestapo after the German invasion of 1939, he died a few months later."""
style = """
Mucha created an immediately recognisable image: a young woman with hair unfurled in arabesques, set within a circle or an arch, surrounded by flowers and repeated motifs. His outlined line, soft colours and highly ordered compositions owe much to Byzantine icons, to the folk art of his native Moravia and to Japanese prints. He made the poster an art in its own right and inspired illustration all the way to comics and the psychedelic graphics of the 1960s."""

[[artistes]]
nom = "Hector Guimard"
vie = "Lyon, 10 March 1867 – New York, 20 May 1942"
biographie = """
Hector Guimard was born in Lyon and studied in Paris, at the École nationale des arts décoratifs and then the École des beaux-arts. His first buildings remained marked by a mixture of historical styles. The turning point came in 1895, on a trip to Brussels where he discovered Victor Horta's Hôtel Tassel: an architecture in which structure and ornament are one. He then entirely reworked the project for the Castel Béranger, an apartment building in the 16th arrondissement for which he designed everything, from the façade to the wallpapers; completed in 1898, it won a prize in the City of Paris's first façade competition. In 1900, the Compagnie du chemin de fer métropolitain entrusted him with the station entrances: his kiosks and green cast-iron surrounds became the symbol of Paris 1900. He went on to build villas, townhouses and apartment buildings, including his own hôtel on the avenue Mozart, after his marriage in 1909 to the American painter Adeline Oppenheim. After the war, his style went out of fashion. In 1938, anxious about the rise of antisemitism, since his wife was Jewish, he left for New York, where he died in 1942, almost forgotten."""
style = """
Guimard is the great Parisian representative of Art Nouveau. He does not copy plants: he retains their growth, their tension, the curve that twists and coils, and draws from them an abstract language of “whiplash” lines. A total architect, he designed everything, from façades to furniture, from industrial cast iron to vases. His Métro entrances, assembled from standardised elements produced in series, show that he also wanted to bring art within everyone's reach."""

[[artistes]]
nom = "Émile Gallé"
vie = "Nancy, 4 May 1846 – Nancy, 23 September 1904"
biographie = """
The son of a Nancy dealer in faience and glassware, Émile Gallé received a very broad education: he studied botany, philosophy and drawing, then learned German and glassmaking technique in Weimar and at the Meisenthal glassworks in Lorraine. After the war of 1870, he took over the family business, which he gradually transformed into an art workshop. His glassware, his faience and soon his furniture adorned with plants brought him a triumph at the 1889 Exposition Universelle, then at that of 1900. A recognised botanist, he cultivated in his garden a great many species, which became the models for his work. A committed man, he publicly defended Captain Dreyfus, at the risk of losing clients. In 1901, he founded the École de Nancy, an alliance of the city's art industries, of which he was the first president. Stricken with leukaemia, he died in 1904, aged fifty-eight. His widow, Henriette, continued the firm, which would close in 1936."""
style = """
Gallé makes glass a means of poetic expression. He multiplies techniques, superimposed layers of colour, acid and wheel engraving, inclusions, glass marquetry, to obtain unprecedented effects of matter. His decorations of plants and insects, observed as a scientist would, are often accompanied by lines of poetry inscribed in the glass: these are his “speaking glassware”. He made Nancy one of the great centres of Art Nouveau."""

[[artistes]]
nom = "Daum frères"
vie = "Nancy (Lorraine), family glassworks; Auguste Daum (1853–1909) and Antonin Daum (1864–1930)"
biographie = """
Jean Daum, a notary in Bitche, in the Moselle, left the region annexed by Germany after 1871 and settled in Nancy. In the 1870s, he took control of a glassworks in which he had invested money, and which made tableware, bottles and everyday crockery. On his death in 1885, his sons took over the business: Auguste, the elder, trained in law, ran it; Antonin, an engineer, looked after design. After the 1889 Exposition Universelle, where Gallé triumphed, the two brothers launched into art glass and opened a decoration workshop, where the designer Henri Bergé in particular worked. Their success was rapid, and the firm was rewarded at the 1900 Exposition Universelle. Antonin Daum took part in the founding of the École de Nancy in 1901. Around 1906, the Daums revived pâte de verre with Amalric Walter. After the First World War, the firm moved to Art Deco, with thick vases, deeply etched with acid, in geometric forms. The company still bears the family name today."""
style = """
The Daums share with Gallé a taste for plants, Lorraine landscapes and insects, but their glass is distinguished by the richness of colours trapped in the mass, vitrified powders and acid-etched landscapes that change with the light. More industrial than Gallé's, their production combines unique pieces and large series. It knew how to pass through the styles, from Art Nouveau to Art Deco."""

[[artistes]]
nom = "Tiffany Studios"
vie = "New York, 1902–1932; founded by Louis Comfort Tiffany (New York, 1848 – New York, 1933)"
biographie = """
Louis Comfort Tiffany was born in New York in 1848, the son of Charles Lewis Tiffany, founder of the famous jewellers Tiffany & Co. Rather than take over his father's business, he became a painter, a pupil of George Inness and Samuel Colman, and travelled in Europe and North Africa. In the late 1870s, he turned to the decorative arts and to glass, which he judged capable of rendering light better than painting. His decorating firm fitted out several rooms of the White House in 1882 for President Chester Arthur. In 1894, he gave the name Favrile to his blown glasses. In Paris, the dealer Siegfried Bing, whose gallery L'Art nouveau opened in 1895, made him known in Europe. In 1902, his workshops took the name Tiffany Studios. Hundreds of craftsmen worked there, and women played a major role: Clara Driscoll designed many lamps, Agnes Northrop many stained-glass windows. Tiffany had a vast estate, Laurelton Hall, built on Long Island. His style went out of fashion after the war; Tiffany Studios went bankrupt in 1932, and Tiffany died the following year."""
style = """
Tiffany wanted to paint with glass itself, without covering it with paint. His workshops developed opalescent, mottled, rippled or iridescent glasses, with colours nuanced in the mass, which bring landscapes, flowers and skies to life. His lamps in copper-foiled glass and his iridescent Favrile vases became the symbol of American Art Nouveau, much imitated to this day."""

[[artistes]]
nom = "Charles Rennie Mackintosh"
vie = "Glasgow, 7 June 1868 – London, 10 December 1928"
biographie = """
The son of a Glasgow police officer, Charles Rennie Mackintosh was apprenticed to an architect at sixteen and attended evening classes at the Glasgow School of Art. With his friend Herbert MacNair and the sisters Margaret and Frances Macdonald, he formed the group nicknamed “the Four”, which invented a style of elongated lines and stylised figures. In 1896, he won the competition for the new building of the Glasgow School of Art, built in two phases until 1909: it is his masterpiece. The same year began his long collaboration with Kate Cranston, for whom he designed the decor and furniture of several tea rooms, including the Willow Tea Rooms in 1903. He married Margaret Macdonald in 1900 and exhibited with her at the Vienna Secession the same year. He also built Hill House, near Glasgow, for the publisher Walter Blackie. But commissions grew scarce: in 1914, he left Glasgow, settled in London and then, from 1923 to 1927, in the south of France, at Port-Vendres, where he painted watercolours. Ill, he died in London in 1928."""
style = """
Mackintosh combines the rigour of the straight line with the softness of highly stylised floral motifs, such as the celebrated “Glasgow rose”. His furniture, often very tall, painted white or stained black, is conceived as elements of architecture, in interiors entirely designed by him. Admired in Vienna and Germany more than in his own country during his lifetime, he is today regarded as one of the forerunners of modern design."""

[[artistes]]
nom = "Jacques-Émile Ruhlmann"
vie = "Paris, 28 August 1879 – Paris, 15 November 1933"
biographie = """
The son of a building-painting contractor of Alsatian origin, Jacques-Émile Ruhlmann took over the family business in 1907, on his father's death; it also sold wallpapers and mirrors. Without training as a cabinetmaker, he nevertheless designed furniture, which he had made by craftsmen, and exhibited it for the first time at the Salon d'automne of 1913. After the war, he founded with Pierre Laurent a firm that combined painting, decoration and cabinetmaking, and set up his own workshops. At the 1925 Exposition internationale des arts décoratifs et industriels modernes, his Hôtel du collectionneur, a pavilion for which he designed the decor and furniture, caused a sensation and established him as the greatest cabinetmaker of his time. His clients were great fortunes, bankers, industrialists or maharajas, and the State also commissioned furniture from him. He died in 1933, aged fifty-four, and his workshops closed according to his wishes."""
style = """
Ruhlmann is the great cabinetmaker of Art Deco. His furniture takes up the elegance and proportions of eighteenth-century French furniture, but simplified: pure lines, tapering legs, curved fronts. Decoration is reduced to the beauty of rare woods, Macassar ebony, amboyna, amaranth, and to fine ivory bands. His demand for perfection, even in the invisible parts, made his pieces among the most sought-after objects of the twentieth century."""

[[artistes]]
nom = "René Lalique"
vie = "Aÿ (Marne), 6 April 1860 – Paris, May 1945"
biographie = """
Born in Champagne, René Lalique was apprenticed at sixteen, after his father's death, to the Parisian jeweller Louis Aucoc. He then studied for two years in England, then designed jewellery for great houses before opening his own workshop in 1885. In the 1890s, he invented a new kind of jewel, in which humble materials, horn, enamel, glass, mingled with gold and stones. Sarah Bernhardt and the collector Calouste Gulbenkian admired him, and the 1900 Exposition Universelle consecrated him. But he soon turned to glass. From 1907, he designed bottles for the perfumer François Coty, then opened a glassworks at Combs-la-Ville in 1909 and another, larger one at Wingen-sur-Moder, in Alsace, in the early 1920s. Vases, statuettes, lighting, radiator mascots for automobiles, panels for trains and ocean liners: he made moulded glass an art of everyday life. At the 1925 Exposition, he presented his own pavilion and a monumental fountain. He died in Paris at the end of the Second World War, in 1945."""
style = """
A jeweller of Art Nouveau, Lalique became a glassmaker of Art Deco. His moulded glass, often satin-finished or opalescent, sometimes enhanced with enamel or patina, plays on the contrast of matt and shiny. Women, animals, plants and abstract motifs take on a sculptural relief. By producing objects of great quality in series, he showed that industry could serve beauty."""
