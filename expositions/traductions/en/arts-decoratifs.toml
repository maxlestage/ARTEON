[[oeuvres]]
titre = "“Tourbillons” (Whirlwinds) Vase"
artiste = "René Lalique"
annee = "1926"
image = "vase-tourbillons.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:%22Tourbillons%22_(Whirlwinds)_Vase_MET_DP108180.jpg"
technique = "Glass, black enamel highlights, 20 × 20.3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A vase of thick glass, carved with spirals picked out in black: movement frozen in matter."
description = """
The vase, 20 centimetres high, has the form of a large cylinder with slightly bowed sides. Its wall of colourless glass, very thick, is sculpted with broad relief motifs that coil like waves, crosiers or gusts of wind, hence its name. These volutes overlap and seem to turn around the vase. Their ridges are picked out in black enamel, which draws great dark curves on the transparent glass. Depending on the angle of view, the light passes through the glass, breaks in the reliefs and produces silvery reflections. The opening, wide and round, is cut cleanly. No motif is figurative: the decoration is pure movement."""
evocation = """
Twenty-five years earlier, Lalique had designed jewellery peopled with dragonfly women and flowers. With Tourbillons, he moves to an almost abstract language: nature is no longer represented, only its energy, that of wind or swirling water. The vase thus forms a link between Art Nouveau, whose curves it keeps, and Art Deco, whose geometric force and contrast of black and white it adopts. It also expresses the spirit of the 1920s, fascinated by speed and movement, and Lalique's wish to produce beautiful objects in series, accessible to a wider clientele than that of his unique pieces of jewellery."""
histoire = """
After 1900, Lalique, then the most famous jeweller in Paris, turned to glass. He first designed perfume bottles for François Coty, then opened his own glassworks at Combs-la-Ville, near Paris, in 1909, and in the early 1920s a large factory at Wingen-sur-Moder, in Alsace. The Tourbillons vase was created in 1926, a year after the 1925 Exposition des arts décoratifs, where Lalique had presented his own pavilion and a great glass fountain. The model was a great success and is among the best-known creations of the house. This example entered the Metropolitan Museum of Art in 2004."""
facture = """
To produce in series, Lalique moulds his glass: the molten material is blown or pressed into a metal mould that gives it its form and relief in one go. The very deep whirlwinds demand a thick wall: the vase weighs nearly five kilos. After cooling, the glass is polished, and the black enamel, laid in the hollows and on the ridges, is fired to fix it. The contrast between the clear glass, brilliant as crystal, and the matt black gives the object its graphic effect."""
details = [
  "The ridges of the volutes, picked out with a line of black enamel.",
  "The silvery reflections of the light in the thickness of the glass.",
  "The rhythm of the whirlwinds, which seem to turn around the vase.",
  "The round opening, clean, cut flat.",
]
themes = ["glass", "art deco", "movement", "abstraction", "series"]
anecdote = """
Lalique also decorated trains and ocean liners: he made glass panels for Orient Express carriages in 1929, then lighting for the dining room of the liner Normandie, which entered service in 1935."""
salle = 5
mur = "nord"
place = 3
