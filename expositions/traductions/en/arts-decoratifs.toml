[[oeuvres]]
titre = "Job"
artiste = "Alphonse Mucha"
annee = "1898"
image = "affiche-job.jpg"
cadre = "estampe"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Alphonse_Mucha_-_Job_-_Google_Art_Project.jpg"
technique = "Colour lithograph, 141 × 93.8 cm"
collection = "National Gallery of Australia, Canberra"
note = "A poster for Job cigarette papers: the smoker's hair spreads across the whole image."
description = """
A young woman sits facing us, wrapped in a long pink gown that leaves her shoulders bare. In one raised hand she holds a cigarette whose smoke rises in a bluish ribbon; in the other, resting on her knee, a small booklet of cigarette papers marked JOB. Her black hair, studded with red flowers, unfurls on either side of her body in coiling locks that fall to the bottom of the poster. Behind her, a large green circle forms a halo. At the top, the three letters JOB, huge and brown, stand out against a yellow ground scattered with a repeated monogram; the same monogram serves as the clasp of her gown. Beneath the image, a line of text names the Parisian printer, F. Champenois."""
evocation = """
Mucha does not show the product: he sells a dream. The smoker, her eyes half-closed, seems absorbed in a peaceful pleasure, and the smoke of her cigarette joins the swirls of her hair. This ideal woman, at once sensual and remote, fills the whole space, while the brand name, repeated everywhere, imprints itself on the passer-by's memory. The circle behind her head recalls the haloes of Byzantine icons, which Mucha admired: some have seen in it a way of sanctifying advertising. The poster also speaks of an age in which a woman smoking was still a daring image, one that attracted as much as it provoked."""
histoire = """
Job is a brand of cigarette papers founded in Perpignan by the Bardou family: its name comes from the initials of Jean Bardou, J and B, separated by a lozenge that the public read as an O. In the 1890s, the firm commissioned posters from fashionable artists. Mucha, who had become famous overnight with the poster for Gismonda, made for Sarah Bernhardt and plastered across Paris in early 1895, designed a first one for the firm in 1896, then this larger one in 1898. It was printed as a lithograph by Champenois, the printer to whom Mucha was bound by contract. Enthusiasts were then collecting posters with passion: people spoke of “affichomania”. This impression was acquired in 1974 by the National Gallery of Australia in Canberra."""
facture = """
The poster is a colour lithograph: each tint is drawn on a different stone, and the sheet passes successively under each one. Mucha outlines his forms with a brown or black line of varying thickness, like the leading of a stained-glass window, then fills them with soft, flat colours: pink, sea green, yellow. The modelling remains light, except in the face and hands. The composition is set within a frame of letters and circles, and the hair, turned into almost abstract arabesques, organises the whole space. One recognises the lesson of Japanese prints, then in fashion in Paris."""
details = [
  "The cigarette smoke, unfurling like a silk ribbon.",
  "The small booklet of papers marked JOB, in the hand resting on her knee.",
  "The clasp of the gown, which repeats the brand's monogram.",
  "The bare foot peeping out from the gown at the bottom of the image.",
  "Mucha's signature at lower left, and the printer's name beneath the image.",
]
themes = ["poster", "advertising", "hair", "woman", "lithograph"]
anecdote = """
Mucha's women with arabesque hair were so successful that, around 1900, people in Paris spoke of the “Mucha style” to mean Art Nouveau as a whole. The artist, who saw himself above all as a painter, ended up being irritated by it."""
salle = 1
mur = "nord"
place = 1
largeur = 1.3

[[oeuvres]]
titre = "Binelles Vase"
artiste = "Hector Guimard"
annee = "1903"
image = "vase-des-binelles.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Vase_des_Binelles_MET_DP324639.jpg"
technique = "Glazed stoneware, Manufacture nationale de Sèvres, 130.2 × 39.1 × 39.7 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A vase taller than a child, designed by the architect of the Paris Métro entrances and fired at Sèvres."
description = """
The vase, 1.30 metres high, has the silhouette of a column that widens towards the top. Its four corners form ribs that rise from the foot like stems, part near the summit and curl into hooks above the opening, like horns or buds. Between these ribs, the wall is pierced at the top by long almond-shaped openings. Near the foot, a relief spiral coils in on itself. The whole surface is covered with a greenish-beige glaze, speckled with blue spots that glitter like crystals. No flower, no animal is depicted: it is the form itself that seems alive. In the photograph, the vase stands on a grey plinth."""
evocation = """
Guimard does not copy nature: he retains its movement, the rising sap, the twisting stem. The vase seems to have grown rather than been made. Its name recalls the rue des Binelles in Sèvres, where the architect had just built the Castel Henriette, a villa made entirely of curves: the vase echoes some of its forms, like a fragment of a house turned into an object. It reflects Art Nouveau's ambition to unite all the arts, from the façade to the door handle, and Guimard's cherished idea that an architect should design every detail. The vase also expresses the determination of a state manufactory, Sèvres, to prove that it could be modern."""
histoire = """
Founded in the eighteenth century, first as a royal and then a national manufactory, Sèvres sought around 1900 to renew its models. Under the impetus of Alexandre Sandier, director of artistic works from 1897, it called on outside designers, among them Hector Guimard, who designed several vases for it. The Binelles Vase was issued in stoneware in only a few examples, five according to the Cleveland Museum of Art, which holds one. These spectacular pieces were intended for exhibitions and wealthy collectors. After the First World War, Guimard fell into oblivion; he was rediscovered only from the 1960s onwards. The Metropolitan Museum's example comes from the ceramics collection of Robert A. Ellison Jr. and was acquired by the museum in 2013."""
facture = """
The vase is made of stoneware, a clay fired at very high temperature that becomes hard and watertight. Its form, with its hollowed corners and hooks, has nothing of a thrown vase: it is an architect's volume, conceived as a small monument. The glaze owes its glittering spots to crystals that form in the enamel during firing and cooling: their pattern is never quite the same from one example to another. The ceramists of 1900 sought these partly unpredictable effects, which gave each piece a natural look, close to stone or lichen."""
details = [
  "The hooks at the top, curling above the opening.",
  "The spiral near the foot, like a fern crozier.",
  "The almond-shaped openings pierced between the ribs.",
  "The blue spots of the glaze, glittering like frost.",
]
themes = ["ceramics", "architecture", "line", "sèvres", "nature"]
anecdote = """
In 1900, Guimard designed entrances for the Paris Métro in cast iron painted green, with lamps shaped like buds. Several were given to foreign cities: one has adorned the Square-Victoria station in Montreal since 1967."""
salle = 1
mur = "nord"
place = 4
largeur = 1.2

[[oeuvres]]
titre = "Autumn Crocus Vase"
artiste = "Émile Gallé"
annee = "c. 1900"
image = "vase-crocus-automne.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:%22Autumn_Crocus%22_Vase_MET_DT1081.jpg"
technique = "Glass, height 44.1 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A long glass stem on which autumn flowers open: Gallé makes the vase the plant itself. Museum title: “Autumn Crocus”."
description = """
The vase, 44 centimetres high, is narrow and slender like a stem. It rests on a broad, low foot, dark and glossy, with undulating edges, which evokes a bulb or a tuft set on the ground. The body of the vase, almost white at the top, takes on red and violet tints towards the bottom, and its whole surface is streaked with fine vertical mauve lines, like the veins of a leaf. Long brown stems rise against this ground; they bear flowers in relief: a large orange corolla open to the sky, and around it, blue and violet flowers still half closed. Yellow stamens, made of thin threads of glass, emerge from the corollas."""
evocation = """
The colchicum, which the English call “autumn crocus”, blooms in meadows at the end of summer and in autumn, without leaves, when the rest of nature is fading. Late-season flowers, frequent in Gallé's work, have often been read as images of passing time and melancholy. The vase does not merely depict a flower: its very form, with its bulb-like foot and stem-like body, becomes the plant. This fusion of object and natural model lies at the heart of the Art Nouveau of Nancy. It expresses Gallé's conviction that the artist must observe nature as a scientist before interpreting it as a poet."""
histoire = """
Around 1900, Gallé was at the height of his fame. At the Paris Exposition Universelle that year, his glassware and furniture won his Nancy firm the highest awards. His workshops then employed several hundred workers and produced both unique, painstakingly worked pieces and more affordable series. This vase, with its flowers applied one by one, belongs to the carefully made pieces. After Gallé's death in 1904, the firm continued production until 1936. The vase entered the Metropolitan Museum of Art in 1984, a gift of Lloyd and Barbara Macklowe, New York dealers and collectors specialising in Art Nouveau."""
facture = """
The glass is blown in several layers, tinted in the mass with metallic oxides, which produces the gradation from milky white to purplish red. The fine mauve streaks are caught within the thickness. The flowers seem to be made of pieces of coloured glass applied hot to the wall, then modelled: a technique close to glass marquetry, which Gallé patented in 1898. The stamens are drawn-out threads of yellow glass. The dark foot, with its coppery gleams, contrasts with the clarity of the neck. The whole is as much sculpture as stained glass."""
details = [
  "The large orange flower at the top, with its yellow stamens.",
  "The fine mauve streaks running through all the glass.",
  "The dark foot with coppery gleams, evoking a bulb.",
  "The gradation from milky white at the top to purplish red at the bottom.",
]
themes = ["glass", "flowers", "autumn", "nancy", "botany"]
anecdote = """
On the door of his Nancy workshops, Gallé had his motto carved: “My root is deep in the woods”. The door is today preserved in the Musée de l'École de Nancy."""
salle = 2
mur = "ouest"
place = 1
largeur = 0.9

[[oeuvres]]
titre = "Gourd-Shaped Vase"
artiste = "Daum frères"
annee = "c. 1910"
image = "vase-calebasse-daum.jpg"
licence = "CC0"
source = "https://www.clevelandart.org/art/2018.259"
technique = "Blown and moulded glass, vitrified powders, applied decoration, wheel-engraved, height 34.9 cm"
collection = "Cleveland Museum of Art"
note = "A glass gourd, pierced like a gnawed fruit, on which two insects have settled: the humour and virtuosity of the Daum brothers."
description = """
The vase, 35 centimetres high, imitates a calabash, that fruit of the squash family with two swellings. Its stalk, at the top, rises in a loop of glass striped green and yellow. On the side, a large irregular opening with rolled edges suggests a hole gnawed in the rind. The skin of the fruit, yellow and green, is marbled with orange, red and blue patches and scattered with small raised grains. A long tendril of yellow glass winds around the belly. Near the opening, two small dark red insects, set in relief, seem to be heading for the hole. Nothing suggests an ordinary vase: the object passes itself off as a fruit found in the garden."""
evocation = """
In Nancy, the Art Nouveau artists drew their models from the vegetable patch as much as from the flower garden: gourds, mushrooms, umbels. This gnawed calabash speaks of the cycle of nature, in which the fruit ripens, decays and feeds the insects. One may see in it a meditation on passing time, but also a game: the object is a trompe-l'œil and amuses. The vase shows that the Daum brothers, who entered art glass in Gallé's wake, found their own path, more focused on effects of matter and colour. It also bears witness to the admiration of the artists of 1900 for Japan, whose art loves the gourd and small insects."""
histoire = """
The Daum glassworks began as a family affair: in the 1870s, the notary Jean Daum took over in Nancy a glassworks that made tableware and bottles. His sons Auguste and Antonin developed it after his death in 1885. Impressed by Gallé's success at the 1889 Exposition Universelle, they created in the early 1890s an art-glass workshop, soon rewarded at the 1900 Exposition. Around 1910, the firm multiplied its experiments with colours trapped in the glass, as on this vase. Having passed through several private collections and public sales, it was bought by the Cleveland Museum of Art in 2018 at an auction in New York."""
facture = """
The glassmaker blows the parison, the ball of molten glass, into a mould that gives it its double-swelling shape. He rolls it, still hot, in powders of coloured glass, which melt on the surface and create these orange, green and blue marblings: these are known as vitrified powders. The stalk, the tendril and the insects are added hot, then certain details are taken up on the wheel, a small grinding wheel that engraves cold glass. The rolled edges of the opening show that the glass was worked while still soft."""
details = [
  "The glass stalk striped green and yellow, curving at the top.",
  "The two dark red insects set near the hole.",
  "The yellow tendril that almost encircles the belly.",
  "The small coloured grains in relief, scattered over the whole skin.",
]
themes = ["glass", "fruit", "insects", "nancy", "japonisme"]
anecdote = """
In 1901, Antonin Daum founded the École de Nancy with Émile Gallé, Louis Majorelle and Victor Prouvé, an alliance of Lorraine artists and industrialists: despite their commercial rivalry, Gallé and the Daums defended their city's art together."""
salle = 2
mur = "ouest"
place = 3
largeur = 0.75

[[oeuvres]]
titre = "Magnolias and Irises"
artiste = "Tiffany Studios"
annee = "c. 1908"
image = "magnolias-et-iris.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Magnolias_and_Irises_MET_DT9363.jpg"
technique = "Stained glass, Favrile glass and lead, 153 × 106.7 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A stained-glass window without saint or angel: a landscape at sunset, seen through magnolia branches."
description = """
In the foreground, two young magnolias with slender trunks frame the scene; their branches, laden with large cream flowers, fill the whole upper part of the window. At the foot of the trees, clumps of violet, mauve and midnight-blue irises rise among long green leaves. Beyond stretches a lake or broad river, winding away between blue hills. The sky, streaked with clouds, passes from violet to pink and pale yellow: it is the hour of sunset, or of dawn. No figure appears. The leading that holds the pieces of glass traces the trunks, the branches and the outline of each petal, and a dark border frames the whole."""
evocation = """
In the nineteenth century, stained-glass windows usually depicted saints and scenes from the Bible. Tiffany Studios popularised in the United States another genre: the landscape window, often commissioned in memory of the departed, for a church or a mausoleum. Nature replaces the religious narrative. Opening flowers, water drifting towards the horizon, the evening light speak of peace and passage rather than death. One readily sees in the magnolia, which blooms in early spring, and in the iris emblems of renewal. In a house, such a window also turned a window into a perpetual garden."""
histoire = """
Louis Comfort Tiffany, at first a painter, turned to stained glass in the late 1870s. Thirty years later, his New York workshops, which had become Tiffany Studios in 1902, supplied a very large number of windows for churches, public buildings and private homes. Like most of these works, this window, made around 1908, is the fruit of collective work: designers composed a colour model, then craftsmen chose the glass piece by piece from immense stocks, cut it and assembled it. Forgotten after the First World War, these windows have been greatly admired again since the 1960s. This one entered the Metropolitan Museum of Art in 1981, an anonymous gift in memory of Mr. and Mrs. A. B. Frank."""
facture = """
Tiffany avoided painting on glass as far as possible, as traditional glaziers did for shadows and details. Almost everything is achieved by the glass itself: opalescent glass, milky and nuanced, of which he and John La Farge were among the great promoters, and mottled or rippled glass depending on the effects sought. To deepen a colour, several plates are sometimes layered. The name Favrile, chosen by Tiffany, designates his glasses coloured in the mass. The lead, of varying thickness, also serves as drawing, like a stroke of ink."""
details = [
  "The magnolia petals, cream and pinkish, cut one by one from the glass.",
  "The river winding between the hills to the horizon.",
  "The irises in the foreground, from mauve to almost black blue.",
  "The bands of cloud, made of glass in mingled colours.",
]
themes = ["stained glass", "landscape", "light", "flowers", "glass"]
anecdote = """
Tiffany long overshadowed his collaborators. Historians now credit Agnes Northrop, who joined his workshops in the 1880s, with a large share of the designs for his flower and landscape windows."""
salle = 3
mur = "est"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "“Wisteria” Lamp"
artiste = "Tiffany Studios"
annee = "c. 1902–1910"
image = "lampe-glycine.jpg"
licence = "CC0"
source = "https://www.clevelandart.org/art/2018.261"
technique = "Copper-foiled glass, bronze, height 43.2 cm, diameter 26.7 cm"
collection = "Cleveland Museum of Art"
note = "A lamp designed by Clara Driscoll: the base is a trunk, the shade a cascade of wisteria clusters."
description = """
The lamp, 43 centimetres high, resembles a small tree. Its bronze base, patinated green and brown, depicts a gnarled trunk rising from a round foot where roots spread out. At the top, openwork bronze branches form the crown of the shade. From there hang hundreds of small pieces of blue, mauve, white and turquoise glass: these are the flowers of the wisteria, grouped in clusters. Between them, a few green leaves. The lower edge of the shade is not straight: it ends in irregular points, where the clusters end, like a wisteria hanging from an arbour. When lit, the lamp makes all these flowers glow from within."""
evocation = """
Wisteria, which came from Asia, was fashionable in gardens around 1900, and its pendant clusters appealed to lovers of Japanese art. The lamp turns it into a poetic object: in the evening, in a drawing room, it recreates the flowering shade of a spring arbour. The trunk-shaped base and the foliage-shaped shade blur the boundary between the useful object and sculpture, as Art Nouveau wished. It also tells of the arrival of electricity in homes: light is no longer a flame that must be watched, but a source that can be dressed in colours."""
histoire = """
The Wisteria model was designed in the very early twentieth century by Clara Wolcott Driscoll, who headed at Tiffany the department of women responsible for selecting and cutting the glass. According to the Cleveland Museum of Art, it won Tiffany Studios a grand prize at the International Exhibition in Turin in 1902. The version shown here, smaller than the large model, is known as the “Pony”. These lamps, made by hand in series, were luxury objects. Out of fashion after the First World War, they have been highly sought after again since the 1960s. This one was bequeathed to the Cleveland museum by the collector Charles Maurer, who died in 2016."""
facture = """
Each piece of glass is chosen for its colour and transparency, cut to a template, then edged with a thin ribbon of copper. The pieces are assembled on a dome-shaped mould and soldered together with tin: this technique allows far smaller pieces and far freer forms than the lead of stained-glass windows. The base, in cast and patinated bronze, is made in Tiffany's workshops. The tints pass from deep blue to white, as on a real cluster lit by the sun."""
details = [
  "The roots of the base, spreading over the foot as over the ground.",
  "The openwork bronze branches at the top of the shade.",
  "The lower edge cut into points, following the rhythm of the clusters.",
  "The few green leaves hidden among the flowers.",
]
themes = ["lamp", "light", "wisteria", "glass", "electricity"]
anecdote = """
Clara Driscoll's role was revealed only in the mid-2000s: historians found her letters, which show that she and her team of women designed a number of lamps long attributed to Louis Comfort Tiffany himself."""
salle = 3
mur = "nord"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "Chair"
artiste = "Hector Guimard"
annee = "c. 1907"
image = "chaise-guimard.jpg"
licence = "CC0"
source = "https://www.clevelandart.org/art/1985.96"
technique = "Pearwood, tooled leather, 108 × 45.4 × 50.4 cm"
collection = "Cleveland Museum of Art"
note = "A chair in which the wood seems to flow like sap: Guimard's “whiplash” line."
description = """
The chair, 1.08 metres high, is carved from a warm, blond wood, pear. Its very tall back is made of two uprights that spread apart as they rise and then join again at the top, like two stems around a leaf. Between them, a panel of brown leather in the shape of an escutcheon, point downwards, is fixed by a row of gilt nails. Beneath the leather, the wood is hollowed into a long pointed slot. The seat, upholstered in leather, is also edged with nails. On the front rail, a small relief carving traces a scroll. The slightly arched legs flare at the bottom like hooves. There is hardly a right angle to be seen, nor any joint."""
evocation = """
Guimard wanted furniture that copied no earlier style: neither Louis XV nor Renaissance, but a language born of the observation of nature, not to depict its flowers but to recapture its forces. His lines tighten, stretch and coil like growing stems; people speak of the “whiplash” line. The chair seems to have grown in a single thrust, the wood passing from foot to back without a break. It expresses the ideal of the total architect: Guimard designed for his houses the façade, the railings, the wallpapers, the handles and the furniture, so that everything spoke the same language."""
histoire = """
Around 1907, Guimard was an acknowledged architect: he had built the Castel Béranger, a Parisian apartment building awarded a prize in the City of Paris's first façade competition, and designed the Métro entrances. He also designed furniture for his clients and for his own interiors. These hand-carved pieces were expensive and produced in small numbers. After the First World War, taste changed and Art Nouveau was judged old-fashioned, even ridiculous; Guimard fell into oblivion. His furniture returned to the market from the 1960s, when Art Nouveau was rediscovered. This chair was bought in 1985 by the Cleveland Museum of Art from a New York dealer."""
facture = """
Pear is a dense fruitwood with a fine grain, which can be carved in every direction without splitting. The uprights are not simply assembled: they are sculpted so that the joints vanish into fluid transitions. The mouldings thin and swell like muscles. The leather, tooled and nailed, adds a warm and supple note. The influence of the Belgian architect Victor Horta, whose work Guimard discovered in Brussels in 1895, can be read in this way of making the structure itself an ornament."""
details = [
  "The escutcheon-shaped leather panel, edged with gilt nails.",
  "The pointed slot hollowed beneath the back, like a leaf vein.",
  "The small carved scroll on the seat rail.",
  "The legs flaring into hooves at floor level.",
]
themes = ["furniture", "wood", "line", "whiplash", "paris"]
anecdote = """
Guimard turned his name into a brand: he had postcards of his buildings published under the title “Le Style Guimard”. His detractors, for their part, mocked Art Nouveau by calling it the “noodle style”."""
salle = 4
mur = "ouest"
place = 2
largeur = 0.85

[[oeuvres]]
titre = "Argyle Street Tea Rooms Armchair"
artiste = "Charles Rennie Mackintosh"
annee = "1897"
image = "fauteuil-argyle-street.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/156437"
technique = "Stained oak, modern horsehair upholstery, 96.4 × 57.2 × 45.8 cm"
collection = "Art Institute of Chicago"
note = "A tea-room armchair, dark and severe, which two cut-out crescents seem to send soaring."
description = """
The armchair, 96 centimetres high, is made of oak planks stained an almost black brown. The straight back consists of a broad solid board at the top, beneath which vertical uprights let the daylight through. The armrests rest on two solid sides, like two panels, each pierced with a crescent-shaped cut-out, or a bird with outspread wings. The bottom of the sides is hollowed into an arch. The seat is upholstered in a modern green fabric. At the bottom, a double horizontal stretcher links front to back. The whole is massive and geometric, almost without ornament: only the cut-outs and a few curves soften the severity of the lines."""
evocation = """
In Glasgow, tea rooms were fashionable places, where people met without alcohol, at a time when the temperance movement was fighting the drinking houses. Kate Cranston, who ran them, wanted modern interiors that would set her establishments apart. The armchair's cut-outs, which the Art Institute of Chicago compares to a bird in flight, show how Mackintosh draws poetry from an almost architectural structure. Opposite Guimard's chair, all curves, this armchair shows the other face of Art Nouveau: that of the straight line and geometry, which heralds twentieth-century design."""
histoire = """
In 1897, Catherine Cranston, known as Kate, opened a new tea room in Argyle Street, in the centre of Glasgow. She entrusted the decoration to the designer George Walton and the furniture to the young architect Charles Rennie Mackintosh, who had just painted wall friezes for her in her Buchanan Street tea room. This armchair belongs to that ensemble: a similar one can be seen in an old photograph of the luncheon room. It is not known how many examples were made. This one remained in the family of an employee of the establishment before being given to the Art Institute of Chicago in 2000 by Neville and John Bryan."""
facture = """
The armchair is built of oak, a robust wood, assembled from planks and straight uprights, without mouldings or carving. Mackintosh had it stained a very dark brown, which unifies the surfaces and emphasises the silhouette, like a cut-out shadow. He works in planes: the solid sides, the back board, the voids between the uprights. The crescent cut-outs play with the light that passes through them. This simplicity has been compared to the English Arts and Crafts movement, devoted to honest materials, and to Japanese art, which Mackintosh admired."""
details = [
  "The two crescent cut-outs on the sides, like birds in flight.",
  "The vertical uprights of the back, between which the light passes.",
  "The low double stretcher linking the legs.",
  "The bottom of the sides, hollowed into an arch.",
]
themes = ["furniture", "geometry", "glasgow", "tea room", "oak"]
anecdote = """
In 1900, Mackintosh and his wife Margaret Macdonald were invited to exhibit at the Vienna Secession. Their room caused a sensation and left a lasting mark on Josef Hoffmann and Koloman Moser, who three years later founded the Wiener Werkstätte."""
salle = 4
