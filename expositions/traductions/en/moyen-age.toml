[[oeuvres]]
titre = "The Trinity"
artiste = "Andreï Roublev"
annee = "c. 1411 or c. 1425–1427"
image = "trinite-roublev.jpg"
technique = "Tempera on wood panel, 142 × 114 cm"
collection = "Tretyakov Gallery, Moscow (entrusted since 2023 to the Russian Orthodox Church)"
note = "Three angels seated around a table: the most venerated icon in Russia, painted in honour of Saint Sergius of Radonezh."
description = """
Three angels with great golden wings are seated around a white table, on which stands a cup containing the head of a calf. Their faces are alike, inclined, and each holds a slender traveller’s staff. The one on the left, upright, wears a mantle with golden glints; the one at the centre, in a purple tunic and blue mantle, tilts his head towards him; the one on the right, in a pale green mantle, also bows. Behind them, barely indicated, appear a house on the left, a tree at the centre, a rock on the right. The gold ground has suffered greatly and the surface bears the traces of numerous losses."""
evocation = """
The icon represents the hospitality of Abraham: according to Genesis, three mysterious visitors appear to him at the oak of Mamre. Christians have seen in it an image of the Trinity. Rublev removes Abraham and Sarah to keep only the three angels, in silent dialogue: tradition often recognises the Father on the left, the Son at the centre, before the tree that evokes the Cross, and the Spirit on the right, but other readings exist. The cup on the table recalls sacrifice and the Eucharist. The circle in which the three figures are inscribed expresses unity and love. Painted to honour Saint Sergius, who preached unity in a divided Russia, the icon has become a symbol of peace and contemplation."""
histoire = """
The icon was painted for the Trinity Cathedral of the monastery founded by Saint Sergius of Radonezh, at Sergiev Posad, north-east of Moscow, doubtless at the request of his successor, the abbot Nikon. Its date is debated: around 1411 or around 1425–1427. In 1551 the Stoglav Council made it the model to follow for representing the Trinity. Long covered with a metal oklad and overpaint, it was uncovered from 1904, then more completely in 1918–1919. Entering the Tretyakov Gallery in 1929, it was handed over in 2023 to the Russian Orthodox Church, despite the concerns of restorers for its conservation."""
facture = """
Rublev paints in egg tempera on a lime-wood panel prepared with gesso. The composition is governed by geometry: the three angels are inscribed in a circle, the two lateral angels framing the central one like the sides of a cup. The perspective is what is called inverse: the footstool and the table widen towards the background, which draws the viewer into the image. The colours are clear and luminous, above all the lapis blue, called golubets, which links the three figures."""
details = [
  "The cup at the centre of the table, with the head of the sacrificed animal.",
  "The slender red staffs held by the three angels.",
  "The tree of Mamre, above the central angel.",
  "The small rectangle painted on the front of the table.",
  "The footstools drawn in inverse perspective, beneath the angels’ feet.",
]
themes = ["icon", "trinity", "angels", "hospitality", "orthodoxy"]
anecdote = """
Andrei Tarkovsky’s film Andrei Rublev, shot in black and white and completed in 1966, ends with long colour shots of the painter’s icons, including the Trinity."""
salle = 5
mur = "ouest"
