[exposition]
ordre = 10
nom_court = "Middle Ages"
mouvement = "Medieval and Gothic Art"
cadre = "dore"
couleur = "#2e4a8c"
titre = "The Middle Ages: Gold and Light"
artiste = "Cimabue, Duccio, Giotto, Rublev, the Limbourg Brothers, Fouquet…"
dates = "c. 1280–1500"
accroche = "Virtual exhibition · Musée de Cluny, Paris"
introduction = """
Gold grounds, icons, altarpieces and illuminated manuscripts: from the late thirteenth century to 1500, painting learns to give weight to bodies and depth to space without renouncing the splendour of the sacred. The visit brings together the three great Virgins in Majesty of Cimabue, Duccio and Giotto, Simone Martini’s Sienese Annunciation, Andrei Rublev’s Trinity, Fra Angelico, the Limbourg brothers, Jean Fouquet and Enguerrand Quarton. The building is inspired by the Musée de Cluny in Paris, housed in a Gothic town house with its chapel, and takes the form of a church: a narthex where the Lady and the Unicorn awaits, a lofty nave, two side chapels and an apse."""
vitrine = "trinite-roublev.jpg"

[musee]
nom = "Musée de Cluny"
ville = "Paris, France"
construction = "late fifteenth century"
presentation = """
In the heart of the Latin Quarter, the Musée de Cluny brings together two adjoining monuments: the Gallo-Roman baths of Lutetia, whose great cold room, the frigidarium, has kept its ancient vault, and the town house that the abbots of Cluny had built in the late fifteenth century for their stays in Paris. This Flamboyant Gothic residence, with its courtyard, its stair turret and its chapel whose vault descends onto a central pillar, is one of the few great medieval town houses preserved in the capital. In 1832 the collector Alexandre Du Sommerard moved in with his medieval objects; after his death the State bought the house and the collection, and the museum opened in 1844. Today one sees there sculptures, stained glass, goldsmiths’ work, ivories and tapestries, and above all the Lady and the Unicorn tapestries, acquired in 1882 and shown in a round room reserved for them. Renovated, the museum reopened in 2022."""
ici = """
The ARTEON building borrows from Cluny the Lady and the Unicorn and its Gothic spirit, and takes the plan of a church with light stone walls. Visitors enter from the south into the narthex, wide and shallow, where the tapestry is hung. To the north opens the nave, narrow and sixteen metres high: “The Nave · The Maestà of Florence”. Near its far end, two doors face each other: to the west the Chapel of France, to the east the Chapel of the Annunciation, two lower square rooms. At the end of the nave, on the axis, the apse, fourteen metres high, shows the Rucellai Madonna from the moment one enters."""

