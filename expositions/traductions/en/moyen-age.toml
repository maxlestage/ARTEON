[[oeuvres]]
titre = "The Lady and the Unicorn: “To My Only Desire”"
artiste = "Tapissiers anonymes"
annee = "c. 1500"
image = "mon-seul-desir.jpg"
cadre = "aucun"
technique = "Wool and silk tapestry, 377 × 473 cm"
collection = "Musée de Cluny – National Museum of the Middle Ages, Paris"
note = "The sixth and most mysterious of the Lady and the Unicorn tapestries, with her motto embroidered on a tent."
description = """
Against a red ground strewn with flowers, small trees and animals, a midnight-blue island, itself covered with flowers, carries the scene. At the centre, before a large blue tent sprinkled with golden flames, a richly dressed young woman stands. She holds a necklace in her hands, above an open casket presented to her by her maidservant. On either side, a lion and a unicorn, rearing, draw back the flaps of the tent and carry red banners crossed by a blue band with three silver crescents. Along the top of the tent runs the inscription “À mon seul désir”. A little dog sits on a cushion placed on a bench; rabbits, a dog, a monkey, birds and trees heavy with fruit fill the whole space, without perspective or shadow."""
evocation = """
The five other tapestries of the series illustrate the five senses: taste, hearing, sight, smell and touch. This one, the largest, remains an enigma. According to a widespread reading, the lady places her necklace in the casket: she would be renouncing the pleasures of the senses, mastered by free will. Other historians think on the contrary that she takes it up, and see in the scene a sixth sense, that of the heart, which governs the other five. The motto itself lends itself to both meanings, courtly love or spiritual desire. The lion and the unicorn, bearers of the coat of arms, recall nobility and purity; the flowering enclosed garden evokes paradise. The work sums up the refined culture of the late Middle Ages, between devotion and aristocratic art of living."""
histoire = """
The coat of arms, gules a bend azure charged with three crescents argent, is that of the Le Viste, a family of Lyon jurists risen to prominence in Paris; scholars hesitate between Jean Le Viste, who died in 1500, and one of his relatives as the patron. The cartoons are attributed to a Parisian painter, often called the Master of Anne of Brittany, and the weaving to a workshop in the southern Netherlands. In the nineteenth century the six pieces were at the Château de Boussac, in the Creuse, where the inspector of historic monuments Prosper Mérimée noticed them in 1841 and was alarmed at their condition. George Sand made them known in her writings. The State bought them in 1882 for the Musée de Cluny, where they are shown in a round room devoted to them."""
facture = """
The tapestry is woven in wool, with a few silk highlights, on a wool warp: the weaver reproduces, point by point, a full-scale painted cartoon. The so-called “millefleurs” ground, strewn with plants and animals evenly distributed, is typical of the late fifteenth century. The few colours come from plant dyes: madder for red, woad for blue, weld for yellow. The figures are arranged as on a stage, without shadow, so as to remain legible from afar on a castle wall."""
details = [
  "The letters “À mon seul désir” on the valance of the tent.",
  "The three silver crescents of the Le Viste on the two banners.",
  "The little white dog sitting on a cushion, to the left of the lady.",
  "A small monkey crouching at the lady’s feet, on the flowery island.",
  "The rabbits hiding all over the red ground.",
]
themes = ["tapestry", "unicorn", "desire", "millefleurs", "five senses"]
anecdote = """
The tapestries have reached an unexpected audience: in the Harry Potter films, the walls of the Gryffindor common room are hung with reproductions of the Lady and the Unicorn, whose red grounds match the colours of the house."""
salle = 1
mur = "ouest"
place = 1
largeur = 4.5

[[oeuvres]]
titre = "Maestà di Santa Trinita"
artiste = "Cimabue"
annee = "c. 1280–1290"
image = "maesta-santa-trinita.jpg"
technique = "Tempera and gold on panel, 385 × 223 cm"
collection = "Uffizi Gallery, Florence"
note = "The Virgin in majesty on an immense throne, surrounded by eight angels: Cimabue’s great altarpiece for the church of Santa Trinita."
description = """
Against a gold ground, beneath a pointed gable, the Virgin is seated on a monumental throne of gilded wood, inlaid and pierced like architecture. She holds the Child on her left knee and points to him with her right hand. Jesus, dressed like a small adult, blesses and holds a scroll. Eight angels, four on each side, are tiered one above another along the throne, their multicoloured wings forming something like curtains. Beneath the throne open three arcades: in them are four half-length prophets, two at the sides who raise their eyes, two at the centre, one a crowned king, each holding a scroll. Mary’s blue mantle is streaked with fine gold highlights."""
evocation = """
The image follows the Byzantine model of the Virgin Hodegetria, “she who shows the way”: Mary presents her son as the path to salvation. The prophets of the Old Testament, placed beneath the throne, are the foundations on which the coming of Christ rests; they are identified as Jeremiah, Abraham, David and Isaiah, whose scrolls bear verses announcing the Incarnation. The gold of the ground represents no place: it is divine light. But Cimabue begins to give the figures a new presence, gentler faces, a throne that recedes into space. Historians see in it a moment of transition, in which Italian painting still inherits from the icon while preparing the revolution of Giotto, his pupil according to tradition."""
histoire = """
The panel was painted for the high altar of the church of Santa Trinita in Florence, served by the Vallombrosan monks. Its date remains debated, between the 1280s and the 1290s. In the fifteenth century, taste having changed, it was replaced on the altar by an altarpiece by Alesso Baldovinetti and relegated to a chapel, then to the convent buildings. It entered the Florentine public collections in the nineteenth century and joined the Uffizi Gallery in 1919. It is now displayed there in the same room as the Virgins in Majesty of Duccio and Giotto, a juxtaposition that has become a lesson in art history: three ways of painting the same subject, within some thirty years."""
facture = """
Cimabue paints in tempera, pigments bound with egg yolk, on a wooden panel covered with gesso and glue. The gold is laid in leaf over a red bole and then burnished, and the haloes are engraved with small punches. The folds of the garments are traced by parallel gold lines, a Byzantine technique called chrysography. The throne, seen in slight perspective, creates a still uncertain space, but the faces are modelled by greenish shadows beneath the flesh tones, according to the practice of the time."""
details = [
  "The wings of the angels, with feathers coloured like scales from white to red.",
  "The fine gold strokes that streak the Virgin’s blue mantle.",
  "King David, crowned, at the centre beneath the throne, beside Abraham.",
  "The two lateral prophets who raise their heads towards the Virgin.",
]
themes = ["virgin in majesty", "gold ground", "angels", "prophets", "byzantine"]
anecdote = """
In 2019, a small panel by Cimabue, the Mocking of Christ, was discovered in the kitchen of a house in Compiègne, where it had passed for a worthless icon. Sold at auction in Senlis, it fetched 24 million euros."""
salle = 2
mur = "ouest"
place = 4
largeur = 2.23

[[oeuvres]]
titre = "Maestà di Ognissanti"
artiste = "Giotto"
annee = "c. 1306–1310"
image = "maesta-ognissanti.jpg"
technique = "Tempera and gold on panel, 325 × 204 cm"
collection = "Uffizi Gallery, Florence"
note = "A Virgin who at last weighs upon her throne: Giotto’s great altarpiece for the church of Ognissanti in Florence."
description = """
Beneath a gable with a gold ground, the Virgin is enthroned in a Gothic tabernacle of white marble, with pinnacles, gables and a trefoil arch. Massive, wrapped in a dark blue, almost black mantle over a white dress, she holds the Child seated on her knee. The infant Jesus, in a pink robe, blesses with his right hand and holds a scroll. On either side of the throne saints and angels press together, seen in profile, the furthest ones partly hidden by the uprights. In the foreground, two kneeling angels offer vases of flowers, lilies and roses; behind them, two others present a crown and a casket. The throne rests on steps of veined marble."""
evocation = """
With Giotto, the Virgin ceases to be a sacred image suspended in gold and becomes a physical presence: one feels her knees beneath the mantle, the weight of her body on the seat, and the Child has the build of a real baby. The angels and saints, who watch the scene, put the viewer in the same position as themselves. The flowers offered have a precise meaning: lilies evoke Mary’s purity, roses her love and the Passion to come. This panel has often been read as the birth certificate of modern Western painting, founded on the observation of reality. It nonetheless remains a devotional image, turned towards the worshipper, and gold retains all its value in it."""
histoire = """
Giotto painted this altarpiece around 1306–1310 for the Florentine church of Ognissanti, which then belonged to the religious order of the Humiliati. He had just finished the frescoes of the Scrovegni Chapel in Padua and was the most famous artist in Italy. The panel, placed on the church’s main altar, was cited with admiration in the fifteenth century by the sculptor Lorenzo Ghiberti in his Commentaries. In the nineteenth century it passed into the collections of the Florentine Academy, then entered the Uffizi Gallery in 1919. It is displayed beside the great Virgins in Majesty of Cimabue and Duccio, which allows one to measure at a glance everything that changed in a few decades."""
facture = """
Giotto works in tempera on a gold ground, like his predecessors, but he abandons the Byzantine gold lines of the drapery in favour of continuous modelling, through gradations of shadow and light. The throne is constructed with a coherent perspective: its sides can be seen in depth, through the openings. The figures partly overlap, which creates successive planes. The range is sober, dominated by the dark blue of the mantle and the white of the dress, and the light seems to come from a single source."""
details = [
  "The Virgin’s slightly parted lips, which reveal her teeth.",
  "The transparency of the white veil laid on her breast.",
  "The vases of lilies and roses held by the kneeling angels.",
  "The faces of the saints glimpsed through the openings of the Gothic throne.",
]
themes = ["virgin in majesty", "volume", "realism", "gold ground", "angels"]
anecdote = """
Dante devoted two lines to Giotto’s glory in the Purgatorio: Cimabue thought to hold the field in painting, he writes, and now Giotto has the renown, so that the fame of his master is obscured."""
salle = 2
mur = "est"
place = 4
largeur = 2.04

[[oeuvres]]
titre = "Virgin and Child Surrounded by Angels (Melun Diptych)"
artiste = "Jean Fouquet"
annee = "c. 1450–1455"
image = "vierge-de-melun.jpg"
technique = "Oil on oak panel, 92 × 83.5 cm"
collection = "Royal Museum of Fine Arts (KMSKA), Antwerp"
note = "The right wing of the diptych commissioned by Étienne Chevalier, treasurer of Charles VII: a Virgin-queen of strange pallor."
description = """
The Virgin, seated on a throne adorned with pearls and precious stones, occupies almost the whole height of the panel. She wears a tall crown of gold and pearls and a great ermine-lined mantle, open over a blue-grey bodice, unlaced, from which emerges a round white breast. Her eyes are lowered. On her knee, the Child, nude and plump, looks to the left with a grave air. All around, angels fill the space: bright red seraphim and blue cherubim, with bodies as smooth as wax statues, packed tightly against one another. The complexion of the Virgin and the Child is of porcelain whiteness, without any coloured shadow."""
evocation = """
The violent contrast between the pallor of the holy figures and the saturated red and blue of the angels gives the painting its unreal, almost modern character. The red seraphim, burning with divine love, and the blue cherubim, who symbolise knowledge, form a heavenly court. Mary appears as a court queen, in the fashion of the time: plucked forehead, high waist, laced bodice. A tradition attested since the seventeenth century holds that she has the features of Agnès Sorel, favourite of Charles VII, who died in 1450 and whose executor was Étienne Chevalier. Nothing proves it, but this idea has fed the image of a work in which the sacred and profane beauty mingle in a disquieting way."""
histoire = """
Étienne Chevalier, treasurer of France under Charles VII, commissioned this diptych for the collegiate church of Notre-Dame in Melun, his native town, where his wife Catherine Budé was buried in 1452. On the left wing he is shown kneeling, presented by his patron saint, Saint Stephen; on this one, he prays to the Virgin. The diptych remained in Melun until the end of the eighteenth century, when the chapter sold it. The two panels were then separated. This one joined the collection of the burgomaster of Antwerp Florent van Ertborn, bequeathed on his death in 1840 to the museum in Antwerp. The wing showing Étienne Chevalier is kept in the Gemäldegalerie in Berlin."""
facture = """
Fouquet paints in oil, a technique from the Netherlands, with a miniaturist’s precision: pearls, cut stones, ermine fur and laces are rendered one by one. But he simplifies volumes to the point of geometry: the Virgin’s head is an oval, her breast a sphere, the little angels forms as smooth as turned wood. This alliance of Flemish detail and monumental clarity, perhaps learned in Italy, is Fouquet’s hallmark. The three colours, white, red and blue, are laid on almost without transition."""
details = [
  "The pearls and cut stones of the throne and the crown.",
  "The golden lace of the bodice, undone over the chest.",
  "The red seraphim and the blue cherubim, without a fold of clothing.",
  "The transparent veil falling from the crown behind the head.",
]
themes = ["virgin and child", "angels", "french court", "portrait", "colour"]
anecdote = """
The diptych’s original frame was adorned with enamelled medallions. One of them, a self-portrait of Fouquet in painted enamel on copper, is now in the Louvre: it is one of the oldest independent self-portraits in Western art."""
salle = 3
mur = "sud"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "The Très Riches Heures of the Duke of Berry: January"
artiste = "Frères de Limbourg"
annee = "c. 1411–1416"
image = "tres-riches-heures-janvier.jpg"
technique = "Illumination on parchment, leaf approx. 29 × 21 cm"
collection = "Musée Condé, Chantilly"
note = "Duke John of Berry receives guests at his table for the New Year gifts: the January page of the most famous illuminated manuscript in the world."
description = """
In a great hall hung with a tapestry of a battle, Duke John of Berry sits at right, in profile, dressed in blue and wearing a fur hat. Behind him, a large round wicker fire screen forms something like a halo. Before him, a table covered with a white cloth bears dishes, small dogs and a large gold salt cellar in the form of a ship. A churchman in red sits at his side. A crowd of courtiers, valets, cupbearers and carvers bustles about. Above the scene, an officer invites visitors: the words “Aproche, aproche” can be read. At the top, a starry blue semicircle shows the chariot of the sun and the signs of Capricorn and Aquarius."""
evocation = """
The page celebrates the first month of the year, the season of New Year gifts, exchanged at court, and the duke appears in it as a generous and magnificent prince. Everything speaks of luxury: gold plate, fabrics embroidered with fleurs-de-lis and wounded swans, the duke’s emblem, little pet dogs even on the table. It has been seen as the portrait of a French court just before the disasters of the Hundred Years’ War, Agincourt in 1415. The astronomical calendar at the top recalls that human life is part of the order of the cosmos and of time. The Très Riches Heures is also a book of prayers: earthly beauty prepares for devotion."""
histoire = """
John of Berry, brother of King Charles V and a great collector, commissioned this book of hours around 1411 from the three Limbourg brothers, Paul, Jean and Herman. In 1416 the duke and the three painters died in the same year, doubtless of plague, leaving the work unfinished. It was completed around 1440 by an anonymous painter, often identified with Barthélemy d’Eyck, then around 1485–1489 by Jean Colombe for Duke Charles I of Savoy. In the nineteenth century the Duke of Aumale, son of Louis-Philippe, bought it in Italy in 1856 and placed it in his library at Chantilly, which he gave in 1884 to the Institut de France together with the château and all its collections."""
facture = """
The pigments are applied with gum on the parchment, with a very fine brush. The intense blue comes from lapis lazuli, a stone imported from Afghanistan and more expensive than gold; the gold, in leaf or powder, enhances the tableware and embroidery. The Limbourgs stack the planes as in a stage set: table, guests, tapestry, which itself opens onto a battle. The precision of the faces and fabrics, on the scale of a few millimetres, brings these pages close to easel painting."""
details = [
  "The words “Aproche, aproche” written in gold letters above the chamberlain.",
  "The gold salt cellar in the form of a ship, on the table, to the duke’s right.",
  "The small dogs wandering over the tablecloth, near the duke.",
  "The white greyhound lying in the foreground, at right.",
  "The chariot of the sun in the blue semicircle, between the signs of the zodiac.",
]
themes = ["illumination", "calendar", "court", "banquet", "zodiac"]
anecdote = """
The Duke of Aumale forbade his collections to be lent: the manuscript therefore never leaves Chantilly. Fragile, it is almost never displayed, and most visitors discover only a facsimile."""
salle = 3
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "The Coronation of the Virgin"
artiste = "Enguerrand Quarton"
annee = "1453–1454"
image = "couronnement-quarton.jpg"
technique = "Oil on panel, 183 × 220 cm"
collection = "Musée Pierre-de-Luxembourg, Villeneuve-lès-Avignon"
note = "All of creation, from heaven to hell, around the crowned Virgin: an altarpiece whose commission contract survives."
description = """
At the centre of the upper part, the Virgin, in a gold brocade dress, hands crossed on her breast, her great blue mantle spread over a cloud, is crowned by the Father and the Son, represented as identical, draped in red and gold. Between them hovers the dove of the Holy Spirit, whose wings touch their mouths. Around them, against a gold ground, crowd the choirs of angels, the patriarchs, the apostles, the saints, and a throng of the elect of all conditions, popes, kings, monks and simple faithful. Lower down, beneath a band of sky, stretches the earth: on the left Rome, on the right Jerusalem, at the centre a crucified Christ, before whom a Carthusian dressed in white prays on his knees. At the very bottom open purgatory, from which souls are delivered by angels, and hell."""
evocation = """
The altarpiece depicts the whole order of the Christian universe, from heaven to hell, like a cathedral in image form. The Trinity is at the summit; the Virgin, intercessor for mankind, is at the centre; the earthly Church, with its two capitals, Rome and Jerusalem, links the two worlds; the Cross is the axis of salvation. The representation of the Father and the Son with rigorously identical features asserts their equality within the Trinity: this is a point of doctrine required by the contract. The landscape in the lower part, with its sea and mountains, is one of the first great natural landscapes in French painting, and it has been thought to represent sites in Provence."""
histoire = """
On 24 April 1453, at Villeneuve-lès-Avignon, the priest Jean de Montagnac signed a contract with Enguerrand Quarton, a painter settled in Avignon, for an altarpiece destined for the altar of the Trinity chapel, in the church of the Charterhouse of Val-de-Bénédiction. This contract, which survives, is one of the most detailed of the Middle Ages: it lists the figures, their place, the cities to be represented, while leaving certain points to the painter’s choice. The work was to be delivered in September 1454. It remained with the Carthusians until the Revolution, then passed to the town’s hospice. It is now displayed in the Musée Pierre-de-Luxembourg at Villeneuve-lès-Avignon."""
facture = """
Quarton, who came from northern France, unites several traditions: Flemish precision and landscape, the monumentality and clarity of Italian forms, the brilliance of a Mediterranean light. The celestial figures are large simple forms, in pure colours, red, blue and gold, arranged symmetrically. The crowds of the elect are treated as tightly packed heads, clearly individualised. Below, the scale changes: the earth is seen from above, minuscule, with a distant horizon that is lost in a bluish haze."""
details = [
  "The Father and the Son, with identical faces and garments.",
  "The dove of the Holy Spirit, whose wings link the two mouths.",
  "The small Carthusian in a white robe kneeling before the cross.",
  "Rome on the left and Jerusalem on the right, in the earthly landscape.",
  "The souls drawn from purgatory by angels, at the very bottom.",
]
themes = ["trinity", "virgin", "paradise", "hell", "provence"]
anecdote = """
The contract specified that the Father and the Son were to be painted without any difference between them. Quarton obeyed to the letter: only their position, on either side of the Virgin, allows them to be told apart."""
salle = 3
mur = "ouest"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "The Annunciation between Saint Ansano and Saint Margaret"
artiste = "Simone Martini"
annee = "1333"
image = "annonciation-martini.jpg"
technique = "Tempera and gold on panel, 184 × 210 cm (305 × 265 cm with the frame)"
collection = "Uffizi Gallery, Florence"
note = "Painted with his brother-in-law Lippo Memmi for Siena Cathedral: the angel, the Virgin shrinking back, and golden words in relief."
description = """
Against an almost continuous gold ground, beneath scalloped Gothic arches surmounted by gables, the archangel Gabriel has just alighted at left, one knee still on the ground, his checked tartan mantle billowing from the impetus. He holds an olive branch and wears a wreath of foliage. From his mouth comes the salutation, inscribed in gold letters that cross the panel towards the Virgin. Mary, seated on a throne at right, turns away, her body twisted in a movement of recoil, drawing her blue mantle against her neck; she keeps her thumb in the book she was reading. Between them, a vase of lilies. At the top, the dove surrounded by angels. At the sides, Saint Ansano and Saint Margaret."""
evocation = """
The Gospel of Luke says that Mary was troubled by the angel’s word: Simone Martini renders this disquiet by a gesture of withdrawal that is almost fearful, of great human truth beneath the elegance of the lines. The angel’s words, “Ave gratia plena Dominus tecum”, made visible and in relief, turn the divine word into an object of light. The olive branch, a symbol of peace, replaces here the lily that Gabriel usually holds; it has been seen as an allusion to Siena, which avoided the lily, emblem of its rival Florence. Saint Ansano, the evangeliser of the city, recalls the altarpiece’s civic purpose. It is the very image of Sienese Gothic: courtly refinement and mystical fervour."""
histoire = """
The altarpiece was commissioned for the altar of Saint Ansano in Siena Cathedral, one of the four altars dedicated to the city’s patron saints. An inscription signs and dates it: Simone Martini and Lippo Memmi of Siena, 1333. Lippo, Simone’s brother-in-law, doubtless painted part of the lateral figures. Later moved to the oratory of Sant’Ansano in Castelvecchio, it went in 1799 to the Uffizi in Florence, in exchange for two paintings by Luca Giordano. Its original frame was replaced in the nineteenth century by the present neo-Gothic framing. Around 1336 Simone Martini would leave Siena for the papal court at Avignon, where he would die."""
facture = """
Everything rests on line: supple contours, elongated curves, folds that undulate like calligraphy. Gold occupies most of the surface and is worked in every way: burnished, punched with motifs, engraved, and even modelled in relief for the letters of the salutation. The colours are rare and precious: the lapis blue of Mary’s mantle, the pink and white, the angel’s tartan cloth. Space is barely suggested, by the throne and the marble floor, in favour of a goldsmith’s effect."""
details = [
  "The gold letters in relief running from the angel’s mouth to the Virgin.",
  "Gabriel’s checked tartan mantle, still lifted by his flight.",
  "The Virgin’s thumb slipped into her book to keep the page.",
  "The vase of lilies at the centre, on the marble floor.",
  "The prophets painted in the medallions of the gables, above the arches.",
]
themes = ["annunciation", "angel", "siena", "gold ground", "gothic"]
anecdote = """
In Avignon, Simone Martini became friends with Petrarch. He painted for him a portrait of Laura, now lost, whom the poet celebrates in two sonnets of the Canzoniere."""
salle = 4
mur = "est"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "The Annunciation"
artiste = "Fra Angelico"
annee = "c. 1425–1426"
image = "annonciation-fra-angelico.jpg"
technique = "Tempera and gold on panel, 194 × 194 cm with the predella"
collection = "Museo del Prado, Madrid"
note = "Beneath a Florentine portico, the angel greets Mary, while Adam and Eve leave the Garden of Eden: the Fall and salvation side by side."
description = """
At right, an open portico, with slender columns and midnight-blue vaults sprinkled with golden stars, shelters the scene. The angel Gabriel, in a pink robe embroidered with gold, his great striped wings raised, bows with his hands crossed on his breast. Facing him, the Virgin, seated, in a blue mantle over a pink dress, an open book on her lap, also crosses her arms and lowers her head. Behind, a small room with a bench. A golden ray descends diagonally from the upper left corner, where two hands appear, and carries the dove of the Holy Spirit. At left, in a garden teeming with flowers and fruit trees, an angel drives out Adam and Eve, dressed in skins, who walk away weeping."""
evocation = """
The painting unites in a single space the fault and the redress: Eve brought sin into the world, Mary, the “new Eve”, welcomes the one who is to redeem it. The ray that crosses the garden of lost paradise to reach the Virgin links the two episodes. The similar gestures of the angel and Mary, arms crossed, speak of humility and acceptance. A swallow perched on the iron tie-bar of the portico has been interpreted as the announcement of spring and of the Resurrection. The clear, measured architecture, inspired by Brunelleschi’s loggias, shows a Dominican painter who prays through the image but knows the novelties of the Florentine Renaissance."""
histoire = """
Fra Angelico painted this altarpiece around 1425–1426 for the church of the convent of San Domenico at Fiesole, in the hills above Florence, where he had taken his vows. The predella, beneath the main panel, recounts the life of the Virgin in five small scenes. In the early seventeenth century the convent parted with it and the work travelled to Spain, through intermediaries still debated; it ended up in the royal monastery of the Descalzas Reales in Madrid, from which it entered the Prado in 1861. A restoration completed in 2019 restored the brilliance of its colours and gold, on the occasion of a major exhibition devoted to it."""
facture = """
Fra Angelico combines the Gothic tradition, the gold of the haloes and rays, the preciousness of fabrics, with Brunelleschi’s new perspective: the columns, vaults and the room at the back are organised according to coherent receding lines. The light is clear and even, the shadows light. The colours are pure and luminous, pinks, blues and whites, laid on in thin layers. The garden of paradise, treated flower by flower, recalls the minuteness of the illuminators."""
details = [
  "The two divine hands in the upper left corner, from which the ray starts.",
  "The dove of the Holy Spirit gliding along the golden ray.",
  "The swallow perched on the iron bar, above the central column.",
  "The sculpted medallion of a bearded head, at the centre of the arcades.",
  "Adam and Eve dressed in skins, driven by an angel towards the left.",
]
themes = ["annunciation", "paradise", "perspective", "angel", "dominican"]
anecdote = """
“Fra Angelico” was not a nickname in his lifetime: he was called Brother John of Fiesole. Pope John Paul II beatified him in 1982, then proclaimed him patron of artists in 1984."""
salle = 4
mur = "nord"
place = 2
