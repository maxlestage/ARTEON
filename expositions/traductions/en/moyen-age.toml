[[oeuvres]]
titre = "The Rucellai Madonna"
artiste = "Duccio di Buoninsegna"
annee = "1285"
image = "madone-rucellai.jpg"
technique = "Tempera and gold on panel, 450 × 290 cm"
collection = "Uffizi Gallery, Florence"
note = "Commissioned from a Sienese by a Florentine confraternity in 1285: one of the largest painted panels of the thirteenth century."
description = """
In a tall gabled panel, surrounded by an original frame dotted with small medallions of saints, the Virgin is seated on a pierced wooden throne, seen obliquely, hung with a patterned cloth. She wears a dark blue mantle edged with a gold braid that winds down to her feet. The Child, on her lap, in a white tunic and pink drapery, reaches out his hand to his mother. Six kneeling angels, three on each side, are superimposed as if floating in the gold: they support the throne and raise their eyes to Mary. Their garments, pink, mauve, green and blue, in soft, shifting tones, contrast with the dark mass of the mantle."""
evocation = """
Duccio keeps the solemnity of the Byzantine icon, but he softens it: the Virgin’s face is touched with melancholy, the Child sketches a tender gesture, the angels seem young courtiers in adoration. Historians recognise in it the elegance that would be the hallmark of the Sienese school, more sensitive to the grace of lines and colours than to the mass of bodies. The gold border of the mantle, which draws a continuous arabesque, is often compared to French Gothic art, which Duccio may have known through manuscripts and precious objects. The work is also the image of a collective devotion: that of a lay confraternity which sang the praises of the Virgin."""
histoire = """
On 15 April 1285, the Compagnia dei Laudesi, a Florentine confraternity that met in the Dominican church of Santa Maria Novella to sing praises to the Virgin, signed a contract with the Sienese Duccio for a large panel. The painting later took the name of the Rucellai family chapel, where it was placed. Vasari, in the sixteenth century, attributed it to Cimabue, and this error lasted until the twentieth century, when comparison with the contract and analysis of the style established the name of Duccio. The panel entered the Uffizi in 1948. A restoration carried out at the end of the twentieth century recovered the blue of the mantle, darkened by overpainting."""
facture = """
Duccio paints in tempera on a burnished, punched gold ground. The flesh is modelled in thin layers over a green underpaint. The throne is shown in three-quarter view, which opens up a space, but the angels rest on no floor. The light, shifting colours of the garments, pink turning to mauve, green to blue, are a Sienese signature. The gold border of the mantle, with its sinuous folds, introduces a supple line of Gothic inspiration. The frame is original, with its painted medallions."""
details = [
  "The gold braid winding over the mantle, down to the Virgin’s feet.",
  "The gold star on Mary’s shoulder and on her veil.",
  "The medallions of saints painted on the original frame.",
  "The bare feet of the kneeling angels, set in empty space.",
]
themes = ["virgin in majesty", "siena", "angels", "gold ground", "confraternity"]
anecdote = """
In 1855, the English painter Frederic Leighton exhibited a painting showing this Madonna carried in triumph through the streets of Florence, after a legend recounted by Vasari; Queen Victoria bought it. The Madonna was then believed to be by Cimabue."""
salle = 5
