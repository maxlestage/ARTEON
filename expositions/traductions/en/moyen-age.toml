[[artistes]]
nom = "Tapissiers anonymes"
vie = "Cartoons painted in Paris, woven in the southern Netherlands, c. 1500"
biographie = """
The six Lady and the Unicorn tapestries are unsigned, like almost all late medieval hangings. They are the fruit of work by several hands. A painter first conceives the general design; one recognises here the style of a Parisian artist active around 1500, known by convention as the Master of Anne of Brittany, whom some historians identify with Jean d’Ypres, author of stained glass, miniatures and engravings for printed books. A cartoonist then enlarges this model to the actual size of the tapestry. Finally, weavers, doubtless in a workshop in the southern Netherlands, present-day Belgium, weave the piece. The patrons, the Le Viste, were a family of jurists from Lyon who became powerful in the king’s service in Paris. At that time tapestries were the most prestigious objects in a noble residence: they warmed the walls, travelled from château to château and displayed their owner’s wealth. Their price often exceeded that of paintings."""
style = """
These hangings belong to the “millefleurs” genre, characteristic of the late fifteenth and early sixteenth centuries: a plain ground strewn with flowering plants, birds and small animals, against which elegant figures stand out. The figures, in sumptuous costumes, are arranged without perspective, with great clarity. This style combines the observation of nature with the courtly taste for symbol and allegory."""

[[artistes]]
nom = "Cimabue"
vie = "Florence, c. 1240 – Pisa?, c. 1302"
biographie = """
Cenni di Pepo, known as Cimabue, was born in Florence around 1240. Little is known of his life: a few documents, and the reputation made for him by Dante, then Vasari, who in the sixteenth century made him the first of the modern painters. In 1272 he is mentioned in Rome. He then worked in Assisi, in the upper basilica of Saint Francis, where he painted in fresco a Crucifixion and scenes from the lives of the Virgin and the apostles, now badly damaged by the oxidation of the lead whites. He painted two large crucifixes for Florence, including that of Santa Croce, severely damaged by the Arno flood of 1966 and become the symbol of that disaster, and the Maestà of Santa Trinita. In 1301–1302 he was in Pisa, where he made the figure of Saint John in the apse mosaic of the cathedral, his only work documented with certainty. He died shortly afterwards. According to tradition, he discovered the young Giotto drawing a sheep on a stone and took him into his workshop."""
style = """
Cimabue starts from Byzantine painting, the maniera greca, with its gold grounds, frontal figures and gold-highlighted folds. But he gives it a new energy: expressive faces, more massive bodies, thrones constructed in space, dramatic emotion in his crucifixes. He opens the way for Giotto and Duccio."""

[[artistes]]
nom = "Giotto"
vie = "Colle di Vespignano (Tuscany), c. 1267 – Florence, 8 January 1337"
biographie = """
Giotto di Bondone was born around 1267 in the Mugello, north of Florence, into a peasant family. Tradition, reported by Vasari, tells that he was minding sheep when Cimabue discovered him. He doubtless trained in the latter’s workshop. In the 1290s he probably took part in the decoration of the upper basilica at Assisi, with the cycle of the life of Saint Francis, whose attribution remains debated. Around 1303–1305 he painted in Padua the frescoes of the Scrovegni Chapel, his masterpiece: the life of the Virgin and of Christ in nearly forty scenes, beneath a starry blue vault. He then worked in Florence, at Santa Croce for the Bardi and Peruzzi chapels, in Rome, and in Naples for King Robert of Anjou. The most famous painter of his time, head of a large workshop, he was also a shrewd businessman. In 1334 Florence named him architect of the cathedral: he designed the campanile that bears his name. He died in 1337 and was buried in the cathedral."""
style = """
Giotto breaks with Byzantine conventions: he gives his figures volume, weight and human emotions, places the characters in a coherent space and tells sacred stories with dramatic clarity. His frescoes served as a school for generations of painters, from Masaccio to Michelangelo, who copied him."""

[[artistes]]
nom = "Jean Fouquet"
vie = "Tours, c. 1420 – Tours, between 1478 and 1481"
biographie = """
Jean Fouquet was born in Tours around 1420, at the time when the court of Charles VII resided in the Loire valley. His training is poorly known; he may have worked in Paris, perhaps with the Bedford Master, an illuminator. Around 1445–1446 he stayed in Rome, where he painted the portrait of Pope Eugene IV, now lost, and discovered the architecture and painting of the Italian Renaissance. Back in Tours, he opened a workshop and worked for the king and for the great officers of the court: the portrait of Charles VII and that of Chancellor Guillaume Jouvenel des Ursins, in the Louvre, the Melun Diptych and the book of hours of Étienne Chevalier, whose miniatures are now dispersed, most of them at Chantilly. He also illustrated the Grandes Chroniques de France and the Jewish Antiquities of Flavius Josephus. In 1475 Louis XI gave him the title of painter to the king. He died in Tours before 1481, and his name fell into oblivion until its rediscovery in the nineteenth century."""
style = """
Fouquet unites two worlds: the minuteness and oil technique of the Flemish painters, and the geometric clarity, the perspective and the ancient architecture discovered in Italy. His figures are simple, monumental, his colours clean. He is the first great painter of the Renaissance in France and a major portraitist."""

[[artistes]]
nom = "Frères de Limbourg"
vie = "Nijmegen (Duchy of Guelders), born c. 1385–1390 – all three died in 1416"
biographie = """
Paul, Jean and Herman de Limbourg were born in Nijmegen, in present-day Holland, into a family of artists: their father was a wood sculptor and their uncle, Jean Malouel, was painter to the Duke of Burgundy. At a very young age, Jean and Herman were sent as apprentices to a Parisian goldsmith. Around 1402, Philip the Bold, Duke of Burgundy, employed Paul and Jean to illustrate a Bible moralisée. On Philip’s death in 1404, they entered the service of his brother John, Duke of Berry, one of the greatest collectors of his time. For him they illuminated the Belles Heures, now in the Metropolitan Museum in New York, then, from about 1411, the Très Riches Heures. The duke treated them with favour: Paul received a house in Bourges and the title of valet de chambre. In 1416 the three brothers died within a few months, perhaps of an epidemic of plague, in the same year as their patron, leaving their great manuscript unfinished."""
style = """
The Limbourgs bring international Gothic illumination to its peak: precious colours, elegance of silhouettes, a taste for luxury and costume. They add to it a new observation of nature and of real places, castles, landscapes, labours of the fields, which heralds the Flemish painting of Van Eyck. Their calendars fixed for centuries the image we have of the Middle Ages."""

[[artistes]]
nom = "Enguerrand Quarton"
vie = "Diocese of Laon (Picardy), c. 1415–1420 – Avignon?, after 1466"
biographie = """
Enguerrand Quarton, or Charonton, was born in the diocese of Laon, in northern France, around 1415–1420. He doubtless trained in the North, in contact with Flemish painting, before moving south to Provence. He is found in Aix-en-Provence in 1444, in Arles in 1446, then in Avignon from 1447, where he remained active until 1466. The city, former residence of the popes, was then a crossroads of artists from the North, Italy and Spain. Quarton is one of the few fifteenth-century painters whose work is documented by contracts: in 1452 he painted with Pierre Villate a Virgin of Mercy for the Cadard family, now at Chantilly; in 1453–1454, the Coronation of the Virgin of Villeneuve-lès-Avignon. He is also credited with the famous Pietà of Villeneuve-lès-Avignon, in the Louvre, and with miniatures. His trace is lost after 1466."""
style = """
Quarton is the principal master of the school of Avignon. He combines Flemish realism, Italian monumentality and a crisp southern light that cuts out forms with sharpness. His compositions are rigorous, symmetrical and of great spiritual intensity. His landscapes, bathed in a clear light, are among the first in French painting, and his figures, simplified into large forms, have a sculptural force."""

[[artistes]]
nom = "Simone Martini"
vie = "Siena, c. 1284 – Avignon, July 1344"
biographie = """
Simone Martini was born in Siena around 1284 and doubtless trained in Duccio’s circle. His first great known work is the Maestà painted in fresco in 1315 in the Council Chamber of the Palazzo Pubblico in Siena, which he retouched in 1321. He then worked for King Robert of Anjou in Naples, who knighted him in 1317, then in Pisa, in Orvieto, and in Assisi, where he decorated the Chapel of Saint Martin in the lower basilica. In the Palazzo Pubblico in Siena he is also credited with the famous equestrian portrait of Guidoriccio da Fogliano, whose attribution is debated. In 1324 he married Giovanna, sister of the painter Lippo Memmi, with whom he signed the Annunciation of 1333. Around 1335–1336 he settled in Avignon, then seat of the papacy, where he painted for the papal court and became friends with Petrarch, who entrusted him with illuminations for his manuscript of Virgil. He died in Avignon in 1344."""
style = """
Simone Martini is the great master of Sienese Gothic: supple and elegant lines, refined colours, gold worked like goldsmith’s work, figures of courtly grace. He knew nonetheless how to observe: true gestures, expressive faces, nuanced emotions. His stay in Avignon spread this style throughout Europe, where it nourished International Gothic."""

[[artistes]]
nom = "Fra Angelico"
vie = "Vicchio (Tuscany), c. 1395 – Rome, 18 February 1455"
biographie = """
Guido di Pietro was born around 1395 in the Mugello, north of Florence. Already a trained painter, he entered around 1420 the Dominican convent of San Domenico at Fiesole and took the name Brother John, Fra Giovanni. He then painted altarpieces for his convent and for the churches of Florence and Cortona. In 1436 the Dominicans moved into the convent of San Marco in Florence, rebuilt at the expense of Cosimo de’ Medici. Fra Angelico and his workshop covered its walls with frescoes, one in each monk’s cell, to aid meditation; the most famous is the Annunciation at the top of the stairs. From 1445 he worked in Rome for Popes Eugene IV and then Nicholas V, whose private chapel in the Vatican he decorated, and in Orvieto. From 1450 to 1452 he was prior of his convent at Fiesole. He died in Rome in 1455 and was buried in Santa Maria sopra Minerva, where his tombstone shows him in the Dominican habit."""
style = """
Fra Angelico reconciles the piety and splendour of Gothic, the gold, the clear and precious colours, with the discoveries of the Florentine Renaissance: perspective, ancient architecture, the volume of bodies. His even, serene light and his recollected figures are put at the service of prayer. Monk and artist at once, he has been seen as the model of the Christian painter, and his musician angels have been reproduced endlessly."""

[[artistes]]
nom = "Duccio di Buoninsegna"
vie = "Siena, c. 1255 – Siena, c. 1318–1319"
biographie = """
Duccio di Buoninsegna was born in Siena around 1255. He is first mentioned in 1278, for painting chests intended for the archives of the commune. In 1285 a Florentine confraternity commissioned from him the Rucellai Madonna, proof that his reputation already extended beyond his city. His private life was turbulent: the archives preserve the trace of numerous fines and debts. Between 1308 and 1311 he painted for the high altar of Siena Cathedral the Maestà, an immense altarpiece painted on both sides: the Virgin in majesty surrounded by saints on the front, and on the back dozens of scenes from the life of Christ. On 9 June 1311 it was carried in solemn procession from the workshop to the cathedral, to the sound of bells, by the whole city. The altarpiece was dismembered in the eighteenth century; most of it is kept in the Museo dell’Opera del Duomo in Siena. Duccio died around 1318–1319, leaving debts to his children."""
style = """
Duccio is the founder of the Sienese school. He humanises the Byzantine tradition: gentle, pensive faces, tender gestures, clear and shifting colours, supple lines coming from French Gothic. His small narrative scenes, on the back of the Maestà, are among the most inventive of his time, and his influence can be read in Simone Martini and the Lorenzetti brothers."""

[[artistes]]
nom = "Andreï Roublev"
vie = "c. 1360 – Moscow, Andronikov Monastery, c. 1428–1430"
biographie = """
Neither the date nor the place of birth of Andrei Rublev, monk and icon painter, born around 1360, is known. He is said to have been a monk at the Trinity Monastery founded by Saint Sergius of Radonezh, then at the Andronikov Monastery in Moscow. The first mention of his name dates from 1405: he worked with the famous Theophanes the Greek and another master, Prokhor of Gorodets, on the icons and frescoes of the Cathedral of the Annunciation in the Moscow Kremlin. In 1408, with the painter Daniil Chorny, he painted the frescoes of the Dormition Cathedral in Vladimir, part of whose Last Judgement is preserved. He then worked at the Trinity Monastery, for which he painted the Trinity, then at the Andronikov Monastery, where he died around 1428–1430. Venerated very early as a model, he was canonised by the Russian Orthodox Church in 1988. Few works are attributed to him with certainty."""
style = """
Rublev gives the Russian icon its purest form: elongated, graceful figures, gentle and recollected faces, compositions based on the circle, clear and luminous colours, dominated by a famous blue. To the dramatic tension of Theophanes the Greek, he opposes peace and harmony. His art remained the reference for Russian iconography for centuries."""
