[[sculptures]]
titre = "Old Arrow Maker"
artiste = "Edmonia Lewis"
annee = "1866–1872"
modele = "arrow-maker.stl"
technique = "Marble"
collection = "Smithsonian American Art Museum, Washington"
note = "By the first recognised African American and Native American woman sculptor: a father and his daughter, after Longfellow's poem."
description = """
On a single base, two figures sit side by side, forming a compact group. The old man, bent over his work, shapes an arrowhead from a flake of stone, absorbed in the precision of his gesture. Beside him, his daughter weaves a rush mat laid across her lap. The scene is set, according to the poem that inspired it, in the land of the Dakotas, before the arrow maker's tent, not far from the Falls of Minnehaha. The two figures, one concentrated on his work, the other more dreamy, fit within a pyramidal silhouette. The format is modest, about fifty centimetres high, which invites the viewer to come close to observe the hands and tools. Nothing dramatic: it is a scene of daily life, steeped in calm and tenderness."""
evocation = """
The work illustrates an episode from The Song of Hiawatha (1855) by Henry Wadsworth Longfellow, a poem then immensely popular: Minnehaha, “Laughing Water”, lives with her father, the old arrow maker, before the hero Hiawatha comes to ask for her hand in marriage. Lewis chooses a peaceful moment, without the hero, centred on the bond between a father and his daughter and on the work of hands. For an artist of Ojibwe descent through her mother, this subject was also a way of representing Indigenous peoples with dignity, far from images of menacing savages or dying warriors. Historians nevertheless point out that it passes through the filter of a poem written by a white man, with its thoroughly Romantic idealisation."""
histoire = """
Edmonia Lewis settled in Rome around 1865–1866 and opened her studio there. She quickly found in Longfellow's poem a source of inspiration and produced several busts and groups devoted to Hiawatha and Minnehaha, which particularly pleased American travellers and collectors passing through. The group of the Old Arrow Maker was conceived as early as 1866, then carved in marble several times; this version dates from 1872. The artist met Longfellow during her stay in Rome, in the late 1860s, and subsequently made his bust, now at Harvard University. These Native American subjects assured Lewis's studio of a loyal clientele for nearly two decades."""
facture = """
Unlike many sculptors settled in Rome, who entrusted the carving of their marbles to Italian assistants, Lewis insisted on carrying out a large part of the work herself, notably so that no one could dispute that her works were truly by her own hand. The group obeys the principles of Neoclassicism: white marble, smooth surfaces, measured gestures. But the artist introduces precise details, hairstyles, clothing and tools, that anchor the scene in a particular culture. The small format suits a private clientele."""
details = [
  "The old man's hands, busy chipping an arrowhead.",
  "The rush mat that the young woman weaves on her lap.",
  "The hairstyles and clothing, sculpted with great care for detail.",
  "The pyramidal form of the group, which unites father and daughter.",
]
themes = ["native americans", "family", "literature", "neoclassicism", "work"]
anecdote = """
The Death of Cleopatra, presented by Lewis in Philadelphia in 1876, had an astonishing fate: it long served as the funerary monument of a racehorse named Cleopatra, near Chicago, before being rediscovered and donated to the Smithsonian in 1994."""
