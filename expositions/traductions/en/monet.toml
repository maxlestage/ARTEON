[[oeuvres]]
titre = "Houses of Parliament, Sunset"
annee = "1903"
image = "parlement-londres.jpg"
technique = "Oil on canvas, 81 × 92 cm"
collection = "National Gallery of Art, Washington"
note = "Painted from St Thomas's Hospital: the silhouette of Parliament drowned in the orange fog of the Thames."
description = """
Across the Thames, the silhouette of the Palace of Westminster, seat of the British Parliament, stands in shadow against a blazing sky. Its neo-Gothic towers and spires, violet-blue, seem cut out of the mist, without any architectural detail. The setting sun, veiled by the fog, spreads an orange light behind the building that sets the whole sky ablaze. The river fills the lower half of the canvas; it returns these colours in long orange, pink and violet strokes that undulate on its surface. The boundary between bank and water is almost invisible, and the building seems to float. Everything is enveloped in the same heavy atmosphere, where air, water and stone seem made of the same luminous substance."""
evocation = """
Parliament, a symbol of British power and of parliamentary democracy, becomes in Monet's hands an almost unreal apparition, without weight or substance, dissolving in the fog. The architecture is no more than a pretext: the true subject is the atmosphere of London, that blend of mist, industrial smoke and filtered light that the painter judged unique. It has been seen as a tribute to Turner, whose paintings he had admired during his London exile, and as a dialogue with the Nocturnes of his friend Whistler. The picture also speaks of the fascination of Monet, then over sixty, with a city that he associated with his youth and with difficult years."""
histoire = """
Monet had stayed in London during the war of 1870, and had met there the dealer Paul Durand-Ruel, who would become his principal supporter. He returned in the autumn of 1899, then at the beginning of 1900 and 1901. Staying at the Savoy Hotel, he painted Waterloo Bridge and Charing Cross Bridge from his room; for Parliament, he obtained permission to work at St Thomas's Hospital, on the opposite bank. He undertook a very large number of canvases, which he completed at Giverny over several years. In May 1904, Durand-Ruel exhibited thirty-seven of these views of the Thames, with great success. This canvas, dated 1903, later belonged to the New York collector Chester Dale, whose collection entered the National Gallery of Art in 1963."""
facture = """
Monet paints in successive layers, first from the motif and then at length in the studio, seeking unity of colour rather than topographical fidelity. The picture rests on two families of complementary colours: blues and violets for the building and the shadows, oranges and pinks for the sky and its reflections. The silhouette of the palace has no sharp outlines; it is made of vertical touches that melt into the background. On the water, the brushwork becomes horizontal and broken to suggest the movement of the river. The whole, heavily worked, nevertheless keeps the appearance of a fleeting vision."""
details = [
  "The towers of the palace, reduced to violet silhouettes without detail.",
  "The orange reflections glittering on the Thames in horizontal touches.",
  "The sky where fog and the light of the setting sun mingle.",
  "The line of the bank, almost invisible, between the palace and the water.",
]
themes = ["london", "fog", "river", "sunset", "series"]
anecdote = """
The palace that Monet painted was then almost new: the old Parliament burned down in October 1834, a fire that Turner witnessed and painted, before it was rebuilt in the neo-Gothic style by Charles Barry and Augustus Pugin."""
