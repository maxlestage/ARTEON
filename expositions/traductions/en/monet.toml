ville = "Paris, France"
architecte = "Victor Laloux"
construction = "1898–1900"
presentation = """
For the Exposition Universelle of 1900, the Paris–Orléans railway company had a station and hotel designed by Victor Laloux built on the Left Bank, opposite the Tuileries. Behind its stone façades, the Gare d'Orsay concealed an immense hall of iron and glass; it was inaugurated on 14 July 1900. Its platforms soon proved too short for modern trains, and it ceased to serve main-line traffic in 1939. Saved from demolition, it was converted into a museum by the architects Renaud Bardon, Pierre Colboc and Jean-Paul Philippon, with interior designs by Gae Aulenti, and opened in December 1986. The central nave, beneath the glass roof, houses nineteenth-century sculpture, and the great clocks recall the station. Devoted to the arts from 1848 to 1914, Orsay holds the largest collection of Impressionist paintings in the world, including dozens of canvases by Monet, from the Gare Saint-Lazare to the Rouen Cathedrals."""
ici = """
ARTEON's building borrows from Orsay its nave beneath a glass roof, and from the Orangerie the white room of the Water Lilies. Visitors enter from the south into the sculpture nave, thirty-six metres long and ten metres high, where three nineteenth-century American sculptures stand. In its northern half, two doors face each other: to the west, Room I · The Birth of Impressionism; to the east, Room II · The City and the Series, with its blue-grey walls. At the end of the nave, Room III · The Water Lilies, wide and low, with white walls, concludes the visit."""

