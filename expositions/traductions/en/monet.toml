[[sculptures]]
titre = "The Greek Slave"
artiste = "Hiram Powers"
annee = "1843"
modele = "greek-slave.stl"
technique = "Plaster (original model)"
collection = "Smithsonian American Art Museum, Washington"
note = "The plaster model of the most famous sculpture of its day, modelled in Florence and exhibited in London in 1851."
description = """
A young nude woman, standing and life-size, adopts a calm pose, her weight on one leg, in the manner of ancient statues. Her wrists are bound by a chain: one hand rests on a pillar, the other, lowered, veils her nudity. The face, turned away, tilts to the side, the gaze lowered, with an expression of serene resignation. Draped over the pillar are her clothes, a fringed cloth, as well as a hanging cross and locket, signs of her Christian faith and her family ties. The body is smooth, the forms full and soft, the hair knotted in a chignon. The figure, conceived to be contemplated from all sides, invites the visitor to walk around it."""
evocation = """
Powers gave his work a precise subject: a young Greek woman captured by the Turks during the Greek War of Independence and exhibited naked in a slave market. Her nudity, in principle unacceptable to the American public of the day, is justified by this story: it is suffered, not offered, and the young woman remains pure through her faith, which the cross recalls. The sculptor himself insisted on this moral reading. In the United States, the work took on an unexpected resonance: while slavery was legal there, abolitionists saw in it the image of the condition of Black slaves, and turned it against those who admired the statue without seeing slavery at home. It thus concentrates the moral contradictions of its time."""
histoire = """
Powers modelled the statue in clay in Florence between 1841 and 1843, then made from it this plaster model, from which his assistants carved the marbles. The first version, completed in 1844, was bought by an English officer and remained in England. Another toured the United States from 1847 to 1849: more than a hundred thousand visitors paid to see it, and clergymen vouched for its morality. Shown at the Crystal Palace during the London Great Exhibition of 1851, it became one of the most famous sculptures in the world. Powers had six life-size marble versions made, and numerous reductions. The plaster, which had remained in the Florentine studio, was acquired with many other models by the Smithsonian in 1968."""
facture = """
Like most Neoclassical sculptors, Powers first modelled the figure in clay, took a plaster cast from it, then entrusted the carving of the marble to Italian assistants, reserving the finishing touches for himself. This plaster is therefore the original of the work, the matrix of all the versions. The small metal markers set into its surface allowed measurements to be transferred precisely to the block of marble by means of a pointing machine. The pose draws directly on the Medici Venus, which Powers could see in Florence, in the Uffizi, but the modelling is softer and more naturalistic."""
details = [
  "The chain that binds the young woman's two wrists.",
  "The cross and the locket hanging from the pillar, beside her clothes.",
  "The small metal points scattered over the plaster, traces of the pointing process.",
  "The face turned to the side, avoiding the viewer's gaze.",
]
themes = ["neoclassicism", "slavery", "nude", "captivity", "faith"]
anecdote = """
In 1851, in London, the African American abolitionist William Wells Brown, himself a former slave, placed beside the statue a caricature from the magazine Punch, “The Virginian Slave”, showing a chained Black woman in the same pose."""
