[[oeuvres]]
titre = "Women in the Garden"
annee = "1866"
image = "femmes-jardin.jpg"
technique = "Oil on canvas, 255 × 205 cm"
collection = "Musée d'Orsay, Paris"
note = "An immense canvas painted outdoors: Monet dug a trench in the garden so that he could reach the top of the picture."
description = """
Four young women in summer dresses stand in a corner of a garden flooded with sunlight. On the left, one sits in the grass, her vast pale patterned dress spread around her like a corolla; she holds a parasol that casts a coloured shadow over her face, and a bouquet rests in her lap. Behind her, two other women stand near a tree trunk, flowers in hand; one buries her face in the bouquet she is smelling. On the right, a fourth rushes towards a bed of rosebushes to pick a flower, caught in mid-movement. A sandy path curves across the foreground, barred by the shadow of the foliage. The background is closed off by a thick curtain of greenery: the whole gaze is drawn to the light falling on the white fabrics."""
evocation = """
The canvas tells no story: no anecdote, no historical episode, no allegory. This is precisely what made it disconcerting in 1867. Monet transposes here, onto a format so immense that it had until then been reserved for history subjects, a simple scene of modern life: young bourgeois women, dressed in the latest fashion, on a summer afternoon. The true subject is the light that filters through the leaves and settles on the fabrics. Historians see in it an ambitious response to Manet's Luncheon on the Grass and to Courbet's large figure paintings, with a new demand: to paint everything directly from the motif. The faces, barely individualised, matter less than the overall effect; Camille, the painter's companion, is said to have posed for several of the figures, so that the canvas seems to show one and the same young woman from various angles."""
histoire = """
Monet began the canvas in the spring of 1866 in the garden of a rented house at Ville-d'Avray, near Paris, after giving up on finishing his gigantic Luncheon on the Grass. Determined to execute everything outdoors, he continued it through the summer, then finished it at Honfleur, where he had withdrawn to escape his creditors. Submitted to the Salon of 1867, it was rejected by the jury. His friend Frédéric Bazille, who was better off, bought it to help him. After Bazille's death in battle in 1870, the canvas returned to Monet through Manet, and the painter kept it for half a century. In 1921, at the initiative of his friend Georges Clemenceau, the State bought it from him: a gesture of recognition towards the old master, so long rejected by the institutions. After a time at the Louvre, it has been displayed at the Musée d'Orsay since 1986."""
facture = """
Monet worked entirely from the motif, which obliged him to wait for the sun to return in order to recover the same effects. The light is built up through bold contrasts: dazzling whites of the dresses in the sun, shadows that are not grey but tinted with blue, green and mauve. On the seated woman's face, the shadow cast by the parasol takes on the colour of the fabric, an effect he would often return to. The figures, with a modelling that is still firm, owe much to the fashion plates of the day; the foliage, by contrast, is laid in with broad juxtaposed patches, without preliminary drawing."""
details = [
  "The coloured shadow that the parasol casts over the seated woman's face.",
  "The patches of sun breaking through the foliage and dappling the sandy path.",
  "The seated woman's patterned dress, spread out in the grass like a corolla.",
  "On the right, the hand reaching towards a rose, frozen in mid-motion.",
  "The bouquet raised to her face, almost hiding one young woman's features.",
]
themes = ["garden", "open air", "light", "fashion", "summer"]
anecdote = """
When the State bought the canvas in 1921, it paid 200,000 francs to a Monet who had become famous; fifty-five years earlier, Bazille had acquired it for 2,500 francs, paid in small monthly instalments in order to support his penniless friend."""
salle = 2
mur = "ouest"
place = 1
largeur = 1.8

[[oeuvres]]
titre = "The Magpie"
annee = "1868–1869"
image = "la-pie.jpg"
technique = "Oil on canvas, 89 × 130 cm"
collection = "Musée d'Orsay, Paris"
note = "A snow landscape near Étretat in which the shadows are blue: the Salon rejected it."
description = """
A snow-covered field stretches beneath a pale sky. A fence of woven branches crosses the canvas, interrupted on the left by a small wooden gate; perched on its post is a magpie, the only black spot in the entire composition. Behind the fence, on the right, stand low houses with snow-laden roofs, surrounded by trees whose branches bend under the weight. The sun, low on the horizon, lights the scene from behind: the hedge casts shadows on the snow that lengthen to the foreground. The lower part of the picture is nothing but a vast white expanse, barely modelled by hollows and tracks. No figure, no movement: only the landscape numbed by cold, the motionless trees and the watchful bird."""
evocation = """
The Magpie is a meditation on silence and cold, but also on the colour of light. Monet shows that snow is never simply white: it takes on yellow where the sun touches it, blue and violet in the shadow. This observation, which has since become commonplace, baffled a public used to the brown or grey shadows of studio painting. The magpie, a small black accent on the gate, holds the gaze and gives the scale of the white immensity; it has been seen as the discreet presence of life in a frozen world, like a single note in a score. The canvas also speaks of the young Monet's situation: a painter of precarious means, living far from Paris, seeking his path away from the subjects the Salon expected."""
histoire = """
Monet painted the canvas during the winter of 1868–1869, in the area around Étretat, where he had settled with Camille and their son Jean, born in August 1867. He was then benefiting from the support of a Le Havre shipowner, Louis-Joachim Gaudibert, who had commissioned a portrait of his wife. The snow landscape is a genre that Gustave Courbet had brought back into favour, and Monet devoted himself to it passionately during those Norman winters. Sent to the Salon of 1869, the canvas was rejected by the jury. It then remained for more than a century in private collections, little seen by the public and absent from the great narratives of Impressionism. It entered the national collections only in 1984, following a purchase by the State, and joined the Musée d'Orsay when it opened in 1986."""
facture = """
The whole canvas rests on a restricted range of whites, yet none is pure: Monet mixes them with yellow, pink, blue and lilac according to their exposure to the light. The shadows are laid in in plain blue, without black. The brushwork varies with the materials: thick and creamy for the packed snow of the foreground, finer and more nervous for the frost-covered branches. The composition, strongly horizontal, is given rhythm by the line of the fence and the vertical of the gate, against which the bird's single dark point stands out."""
details = [
  "The magpie, perched on the post of the gate, the only black element in the picture.",
  "The blue shadows of the fence, stretched across the snow.",
  "The golden light of the winter sun striking the tops of the hedges.",
  "The roofs of the houses, on the right, half buried under snow.",
]
themes = ["snow", "winter", "landscape", "coloured shadows", "normandy"]
anecdote = """
Monet painted more than a hundred snow landscapes over his lifetime. In January 1880, at Vétheuil, he even painted the Seine locked in ice, then the break-up, when the blocks cracked and drifted down the river."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Impression, Sunrise"
annee = "1872"
image = "impression-soleil-levant.jpg"
technique = "Oil on canvas, 48 × 63 cm"
collection = "Musée Marmottan Monet, Paris"
note = "The port of Le Havre in mist. A mocking critic took from its title the name “Impressionists”."
description = """
The port of Le Havre at early morning, wrapped in a blue-grey mist. At the centre, a small orange sun, sharp as a pastille, rises above the water; its reflection breaks into a column of short orange strokes that descends towards us. In the foreground, a dark boat carrying two figures glides over the water; two other, paler craft fade out behind it. In the background one can make out the masts of sailing ships, the port's cranes and chimneys whose smoke mingles with the fog. Sky and water almost merge, in the same tones of blue, grey and orange-pink: there is neither a clear horizon line nor precise detail, only forms gradually emerging from the dawning light."""
evocation = """
The canvas captures a fleeting moment, the one when the sun pierces the mist, and makes it the very subject of the picture. The title says so: this is not a view of Le Havre but an impression, that is, the sensation of an instant. For many historians, the work is also an image of modernity: an industrial port, its cranes and smoke, in the aftermath of the war of 1870, in a France that was rebuilding itself. It has been seen as a symbol of hope, the sun rising over a wounded country, even though Monet never presented it that way. Having become the emblem of an entire movement, it sums up the Impressionist ambition: to paint not things, but the light and air that envelop them, in the passing of time."""
histoire = """
Monet painted the canvas in 1872 from a hotel room overlooking the outer harbour of Le Havre, the city of his childhood. He exhibited it in Paris on 15 April 1874, on the boulevard des Capucines, in the former studio of the photographer Nadar, at the first exhibition of the group that would become the Impressionists. He would later recount that he was asked for a title for the catalogue and simply proposed “Impression”. On 25 April, Louis Leroy published his mocking article, “The Exhibition of the Impressionists”, in Le Charivari. The canvas then belonged to Ernest Hoschedé, at whose sale the physician and collector Georges de Bellio acquired it in 1878. His daughter and son-in-law, Victorine and Eugène Donop de Monchy, gave it to the Musée Marmottan in 1940. Stolen in 1985, it was recovered in Corsica in 1990."""
facture = """
The paint is laid on in thin, fluid layers, so diluted that the canvas shows through in places. A few brushstrokes suffice to depict a boat or a mast; the water is made of rapid horizontal touches, the sun's reflection of small orange commas, thicker in texture. Monet works fast, to fix an effect that lasts only a few minutes. The palette is reduced to blue-grey and orange, two complementary colours that heighten one another. It has been seen as recalling Turner, whose paintings Monet saw in London in 1870–1871, and Japanese prints in the simplification of forms."""
details = [
  "The orange disc of the sun, set almost flat against the grey sky.",
  "The sun's reflection, made of a few superimposed orange strokes on the water.",
  "The two figures in the foreground boat, reduced to dark patches.",
  "On the left, the masts and cranes dissolving in the mist.",
  "The signature and date, “Claude Monet 72”, at lower left.",
]
themes = ["port", "mist", "dawn", "sun", "modernity"]
anecdote = """
In 2014, the American astronomer Donald Olson, cross-referencing the height of the sun, tide tables and weather records, proposed dating the scene precisely to 13 November 1872, at around 7:35 in the morning."""
salle = 2
mur = "ouest"
place = 3
largeur = 1.3

[[oeuvres]]
titre = "Poppies"
annee = "1873"
image = "coquelicots.jpg"
technique = "Oil on canvas, 50 × 65 cm"
collection = "Musée d'Orsay, Paris"
note = "Near Argenteuil, Camille and their son Jean cross a field dotted with red."
description = """
On a summer's day, a rolling meadow slopes gently down towards us. On the left, a broad stream of red poppies crosses the grass on the diagonal. In the foreground, a woman in a dark dress, a parasol in her hand, walks along with a small boy in a straw hat, half sunk in the tall grass. Higher up, near the crest, a second pair, a woman with a parasol and a child, descends the hill. On the right, a row of trees closes the horizon, and a house can be glimpsed among their foliage. The sky, very wide, takes up nearly half of the canvas; it is crossed by white, cottony clouds. The whole scene breathes the warmth and slowness of an afternoon stroll in the countryside."""
evocation = """
The painting celebrates a simple happiness: a family walk in the countryside of Argenteuil, a few years after the war and the Commune. The two pairs, at the top and bottom of the hill, have often been read as the same walkers at two moments of their stroll; the picture would thus suggest the passing of time, in the manner of a sequence. The poppies, wild and ephemeral flowers, reinforce this impression of fleetingness. Monet seeks neither narrative nor heavy-handed symbol: the figures are almost patches of colour among others, blended into the landscape. What matters is the sensation of a luminous summer, and the image of the peaceful life that the painter, although often short of money, was then enjoying at Argenteuil."""
histoire = """
Monet settled at Argenteuil, on the banks of the Seine, at the end of 1871, after stays in London and the Netherlands. He lived there until 1878 with Camille and Jean, and this period was one of the most fruitful of his career; his friends Renoir, Sisley and Manet came to paint alongside him. Poppies was painted in the surrounding area in the summer of 1873. The following spring, the canvas appeared at the first Impressionist exhibition, in 1874, alongside Impression, Sunrise. It then passed through several collections, up to that of the painter, art historian and collector Étienne Moreau-Nélaton, who gave it to the Louvre in 1906 together with all his modern paintings. It has been displayed at the Musée d'Orsay since 1986."""
facture = """
Monet builds the canvas through colour oppositions rather than drawing. The poppies are simple patches of bright red laid on the green of the grass, its complementary colour, which makes them vibrate; their size diminishes with distance, which deepens the space. The diagonal of flowers, linking the two pairs, structures the whole composition. The figures are sketched in a few touches, the child's face reduced to a pale patch. The sky, painted with broad, mobile strokes of the brush, contrasts with the smaller, tighter touch of the meadow."""
details = [
  "The parasol of the woman in the foreground, standing out against the sky.",
  "The second pair, at the top of the slope, reduced to two silhouettes.",
  "The poppies, simple red dots, with no petals or stems drawn.",
  "The house glimpsed among the trees, on the right.",
]
themes = ["poppies", "countryside", "family", "summer", "stroll"]
anecdote = """
Étienne Moreau-Nélaton's 1906 donation to the Louvre also included Manet's Luncheon on the Grass: the scandalous canvas of the Salon des Refusés of 1863 and Monet's peaceful stroll entered the national collections together."""
salle = 2
mur = "ouest"
place = 4
largeur = 1.3

[[oeuvres]]
titre = "The Promenade, Woman with a Parasol"
annee = "1875"
image = "femme-ombrelle.jpg"
technique = "Oil on canvas, 100 × 81 cm"
collection = "National Gallery of Art, Washington"
note = "Camille and Jean seen from below, against the sky: the wind, the clouds and the green shadow of the parasol."
description = """
A young woman dressed in white stands at the top of a flowery bank, seen from below, as if the painter were sitting in the grass. She holds a tilted parasol and turns towards us a face half hidden by a veil. The wind lifts the veil and the folds of her dress, and bends the grasses at her feet. Slightly set back, behind the crest, a small boy in a round hat appears only from the waist up. The woman's silhouette stands out against the light, against a blue sky crossed by white clouds that fills almost the whole surface of the picture. Her dress, in shadow, takes on blues and yellows, and the green of the meadow rises in reflections in the fabric. The horizon line is so low that nothing of the surrounding landscape can be seen."""
evocation = """
The painting has the lightness of a family snapshot: Camille and Jean, the painter's wife and son, caught during a walk. The low viewpoint nevertheless gives the young woman an almost monumental presence, like a figure raised against the sky. Everything speaks of movement and the passing instant: the wind, the clouds, the gaze turned towards the painter. It has been seen as the expression of a peaceful marital happiness; what followed gives the canvas a melancholy resonance, since Camille died four years later, in 1879, at the age of thirty-two. The picture also speaks of Monet's ambition to paint the human figure outdoors, not posed in a studio, but bathed in, and almost dissolved by, light."""
histoire = """
Monet painted the canvas at Argenteuil in the summer of 1875, in the meadows near the house where he lived with Camille and Jean, then seven years old. He showed it in the spring of 1876 at the second Impressionist exhibition, organised at the dealer Paul Durand-Ruel's gallery on the rue Le Peletier. The press was still very hostile to these canvases, judged slapdash, but this type of outdoor figure became one of the painter's signatures. The painting later left France for the United States. It belonged to Paul Mellon, son of the banker Andrew Mellon, founder of the National Gallery of Art, and to his wife Rachel, known as Bunny; the couple gave it to the Washington museum in 1983, among many French works from their collection."""
facture = """
The canvas is painted with visible rapidity: broad, supple touches for the sky, small lively crisscrossing strokes for the grass shaken by the wind. Monet plays with backlighting: the figure, lit from behind, is never truly white, but nuanced with blues, yellows and greens reflected from the sky and the meadow. The face is merely sketched, barely distinct beneath the veil. The low angle and very low horizon isolate the silhouette against the sky, a bold framing for the period, recalling the choices of Japanese prints."""
details = [
  "The veil floating before Camille's face, lifted by the wind.",
  "Jean, half hidden behind the bank, looking towards the painter.",
  "The touches of yellow scattered in the grass at the young woman's feet.",
  "The green reflections of the meadow that colour the lower part of the white dress.",
]
themes = ["portrait", "wind", "sky", "family", "open air"]
anecdote = """
In 1886, eleven years later, Monet took up the same motif again at Giverny with Suzanne Hoschedé, the daughter of his companion Alice: he made two canvases from it, now in the Musée d'Orsay, in which the model's face remains almost erased."""
salle = 2
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "The Gare Saint-Lazare"
annee = "1877"
image = "gare-saint-lazare.jpg"
technique = "Oil on canvas, 75 × 104 cm"
collection = "Musée d'Orsay, Paris"
note = "Under the glass roof, the steam of the locomotives becomes light: Monet painted twelve versions."
description = """
We stand beneath the great hall of the Gare Saint-Lazare in Paris. A double-pitched iron framework, glazed with skylights, frames the scene like an immense triangle. At the centre, a black locomotive advances towards us, spewing a cloud of white and bluish steam that rises to the glass roof. On either side, other trains stand along the platforms, where small figures of travellers and railway staff move about. In the foreground, the rails converge towards the viewer. In the background, beyond the open end of the hall, the façades of the buildings of the Europe district appear in the light, half veiled by smoke. Everything contrasts: the shadow of the hall and the brilliance of daylight, the heaviness of the machines and the lightness of the steam."""
evocation = """
To paint a railway station in 1877 was to choose the most modern motif imaginable: the railway, a symbol of speed, industry and progress. Where Salon painters still sought beauty in Antiquity or mythology, Monet found it in the smoke of locomotives and the iron of glass roofs. Émile Zola, a defender of the Impressionists, praised these canvases and judged that artists should find the poetry of railway stations as their fathers had found that of forests and rivers. Steam plays here the role that clouds or mist play elsewhere: a changing, almost immaterial substance that catches the light. It is not the machine that we admire, but the atmosphere it creates, an urban landscape recomposed by light."""
histoire = """
At the beginning of 1877, Monet, who was still living at Argenteuil, rented a small pied-à-terre on the rue de Moncey, not far from the station, and obtained permission to paint inside it and along the tracks. Within a few months he produced a series of views, from the platforms, beneath the hall or at the foot of the Pont de l'Europe. In April he showed several at the third Impressionist exhibition, where they attracted the attention of the critics. This one was acquired by the painter and collector Gustave Caillebotte, a friend and financial supporter of the group. On his death in 1894, Caillebotte bequeathed his collection to the State; after long discussions only part of it was accepted, including this canvas, displayed at the Musée du Luxembourg from 1897, then at the Louvre and finally at the Musée d'Orsay."""
facture = """
Monet does not describe the station as an engineer would: the lines of the framework, clean and geometric, serve as a fixed frame for everything that moves. Within this triangle, the steam is painted in thick, swirling touches of white, blue, pink and grey, laid on in full impasto. The locomotives are dark masses without mechanical detail, the travellers mere commas. The contrast between the shadow of the hall and the dazzling light of the background creates depth, while the smoke unifies the whole."""
details = [
  "The bluish steam rising to the glass roof and making it almost transparent.",
  "The travellers and railway staff, reduced to a few dark touches on the platform.",
  "The sunlit buildings in the background, glimpsed through the smoke.",
  "The rails in the foreground, converging towards the viewer.",
]
themes = ["station", "steam", "modernity", "paris", "railway"]
anecdote = """
The Gare Saint-Lazare also inspired Monet's friends: Manet set The Railway (1873) in its surroundings, and Caillebotte painted The Pont de l'Europe (1876), which spans the tracks just outside the station."""
salle = 3
mur = "est"
place = 1
largeur = 1.6

[[oeuvres]]
titre = "Rue Montorgueil, Festival of 30 June 1878"
annee = "1878"
image = "rue-montorgueil.jpg"
technique = "Oil on canvas, 81 × 50 cm"
collection = "Musée d'Orsay, Paris"
note = "A Paris street decked with flags for the Exposition Universelle: a crowd and banners in vibrating touches."
description = """
Seen from above, from a balcony, a Paris street recedes towards the back of the picture, lined with tall façades. Dozens of tricolour flags hang from the windows on either side and seem to snap in the wind; their blues, whites and reds invade almost the entire surface. Below, the roadway is occupied by a dense crowd, rendered by a multitude of small dark and light touches. In the distance, the street is lost in a white light. The vertical format, tall and narrow, accentuates the impression of depth and the vertigo of the plunging gaze. No face or particular figure can be made out: the façades themselves almost disappear behind the fabrics, and the true subject is the festival, its movement and its brilliance."""
evocation = """
The canvas celebrates a moment of collective, patriotic jubilation. On 30 June 1878, Paris celebrated peace and the recovery of the country, seven years after the defeat of 1870 and the Commune. For the young and still fragile Third Republic, it was an occasion to assert its colours; the tricolour, omnipresent, takes on the value of a manifesto. Monet was hardly a political painter, but he captured the energy of a city in festival and of a nation rediscovering itself. The crowd, dissolved into touches of colour, becomes a collective being, and the fluttering flags make the street a living organism. It is often seen as one of the most joyful images of modern life left by the Impressionists."""
histoire = """
On 30 June 1878, in the midst of the Exposition Universelle, the government organised a great Festival of Peace; 14 July would not become the national holiday until 1880. Monet, who was then living in Paris in great financial difficulty, walked the streets with his equipment. He painted two canvases that day: this one, the rue Montorgueil, and a view of the rue Saint-Denis, now in the Musée des Beaux-Arts in Rouen. The same day, Manet painted the flag-decked rue Mosnier, which he could see from his studio. The canvas was shown the following year at the fourth Impressionist exhibition. Long in private hands, it is now held at the Musée d'Orsay, a few metro stops from the street it depicts."""
facture = """
Monet paints fast, in a few hours, to capture the festival before it disperses. The flags are made of juxtaposed touches, short and energetic, of blue, white and red, which vibrate against one another without ever forming a precise outline. The crowd is treated the same way, in small brushstrokes, like a swarming mass. The plunging perspective and tight vertical framing recall the urban views of Japanese prints. Almost abstract in places, the canvas has often been compared, for its freedom of colour, to the researches of the Fauves thirty years later."""
details = [
  "The flags in the foreground, so close that they seem to brush the viewer.",
  "The crowd, below, made of countless small faceless touches.",
  "The luminous background, where the street dissolves into a dazzling white.",
  "The façades almost entirely hidden by the tricolour fabrics.",
]
themes = ["festival", "paris", "flags", "crowd", "republic"]
anecdote = """
Monet would recount that he was walking that day with his equipment when he spotted a balcony: he went up to ask permission to paint there, obtained it, then came back down incognito once his work was finished."""
salle = 3
mur = "est"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "Wheatstacks (End of Summer)"
annee = "1890–1891"
image = "meules.jpg"
technique = "Oil on canvas, 60 × 100 cm"
collection = "Art Institute of Chicago"
note = "Two wheat stacks at Giverny: the first of the great series, in which only the time of day changes."
description = """
In a harvested field near Giverny, two wheat stacks stand side by side, one large, the other smaller. Their form is simple: a rounded base capped by a conical roof, like two small straw huts. The late-day sun lights them from the side and casts blue and violet shadows over the thatch. Behind them, a line of trees and a few houses close the horizon, at the foot of bluish hills. The sky, pale and veiled, fills a broad horizontal band. Nothing happens, no peasant, no animal, no cart: only two massive shapes set in the warm light of late summer, whose outlines vibrate slightly in the air."""
evocation = """
With the Wheatstacks, the subject becomes almost indifferent: what counts is time, the hour, the season, the atmosphere. By repeating the same motif under different lights, Monet shows that an object has no fixed appearance and that our perception is constantly changing. The stacks, grain reserves for a whole year, also evoke the nourishing earth, the cycle of the seasons and the permanence of the rural world, at a time when France was industrialising; some historians have seen in them a celebration of the national terroir. Through their pared-down form and massive presence they take on the look of rustic monuments, and herald the series that would follow."""
histoire = """
The stacks stood in a field next to the house at Giverny, where Monet had settled in 1883. He began painting them at the end of the summer of 1890 and continued through the autumn and winter, until the beginning of 1891, multiplying the canvases. He then wrote to his friend the critic Gustave Geffroy that he was working relentlessly on a series of different effects, that the sun was setting so fast he could not keep up with it, and that he had to work very hard to render instantaneity. In May 1891, the Durand-Ruel gallery exhibited fifteen Wheatstacks: the success was immediate and the canvases sold within days, notably to American collectors. The Art Institute of Chicago today holds one of the most important groups from this series."""
facture = """
Monet worked on several canvases at once, moving from one to another as the hours passed in order to follow the evolution of the light, then reworked them at length in the studio to harmonise the series. The brushwork is dense, crossed, layered in thick coats that give the surface a granular texture. No colour is local: the golden straw is mingled with orange, pink and violet, the shadows with blue and mauve. The framing, simple and almost frontal, leaves all the room to the variations of colour."""
details = [
  "The blue-violet shadows stretching at the foot of the stacks.",
  "The fringe of light that outlines the contour of the straw roofs.",
  "The houses and trees in the background, melting into the warm haze.",
  "The stubble of the harvested field, rendered in small crisscrossing touches.",
]
themes = ["series", "countryside", "light", "seasons", "giverny"]
anecdote = """
In 1896, in Moscow, the young Vassily Kandinsky came upon one of Monet's Haystacks. He would recount that he had at first not recognised the subject without the help of the catalogue, and that this shock revealed to him the power of colour alone, detached from the object."""
