[[sculptures]]
titre = "The Dying Tecumseh"
artiste = "Ferdinand Pettrich"
annee = "1856"
modele = "tecumseh.stl"
technique = "Marble"
collection = "Smithsonian American Art Museum, Washington"
note = "The Shawnee chief, killed in battle in 1813, stretched out like an ancient hero: a Neoclassical marble."
description = """
A Native American warrior lies on the ground, his upper body raised and leaning against a rock, as if in a final effort. His head bows; a wound marks his temple. His right hand still grips a tomahawk, as if he refused to let go of his weapon. The body, powerfully muscled and almost naked, is dressed only in a loincloth and a few ornaments. The figure extends in length, in the manner of the dying heroes that filled the corners of ancient pediments, and invites the viewer to walk around it to follow its lines. The white marble, carefully polished, gives the body a presence both sensual and idealised. No trace of the battle surrounds him: the hero is alone before his death."""
evocation = """
Pettrich represents Tecumseh according to the codes of the ancient hero, on the model of the dying warriors of Greek and Roman sculpture, such as the famous Dying Gaul of the Capitoline Museums. This choice makes the vanquished adversary a noble and tragic figure. The sculpture thus participates in the myth of the “noble savage” and in the idea, widespread in the nineteenth century, of the inevitable disappearance of Native American peoples. Historians stress an ambiguity here: the tribute paid to the courage of the Shawnee chief coexists with a vision that turns conquest into heroic fatality, at the very moment when the American government was deporting the Indian nations west of the Mississippi, in application of the Indian Removal Act of 1830."""
histoire = """
Tecumseh, a Shawnee chief, tried in the early nineteenth century to unite the Native American nations against the advance of American settlers, together with his brother Tenskwatawa, known as the Prophet. An ally of the British during the War of 1812, he was killed on 5 October 1813 at the Battle of the Thames, in what is now Ontario, and his body was never identified with certainty. Having arrived in the United States in 1835, the German sculptor Ferdinand Pettrich conceived the figure in the following years, while hoping to obtain official commissions in Washington. He had it carved in marble only in 1856, long after leaving America. The work was then kept for a long time in the Capitol, before being transferred to the national collections, today the Smithsonian American Art Museum."""
facture = """
Trained in the studio of Bertel Thorvaldsen in Rome, Pettrich applies here the Neoclassical lesson: idealised anatomy, smooth and polished surfaces, clean contours, restrained emotion. The white marble, without any colour, removes the subject from all documentary realism and ties it to the world of Antiquity. The elongated, diagonal composition leads the eye from the hand clenched on the weapon to the bowed head. The elements specific to Shawnee culture, ornaments or weapon, are reduced to a few attributes, subordinated to the beauty of the nude."""
details = [
  "The tomahawk that the warrior's right hand still grips.",
  "The wound at the temple, discreet, indicating the cause of death.",
  "The musculature of the torso, modelled like that of an ancient athlete.",
  "The rock on which the body rests, treated more summarily than the figure.",
]
themes = ["neoclassicism", "native americans", "hero", "death", "history"]
anecdote = """
Colonel Richard Mentor Johnson boasted of having killed Tecumseh at the Battle of the Thames; this claim to glory, never proven, helped him become Vice President of the United States from 1837 to 1841, under Martin Van Buren."""
