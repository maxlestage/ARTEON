dates = "1840–1926"
accroche = "Virtual exhibition · Claude Monet"
introduction = """
From the garden at Ville-d'Avray to the water lilies of Giverny, follow sixty years of painting in pursuit of light: the rising sun that gave Impressionism its name, railway stations and flag-draped streets, the series of haystacks and cathedrals, then the water and flowers of the garden, all the way to abstraction."""
