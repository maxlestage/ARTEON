[[oeuvres]]
titre = "The Japanese Footbridge"
annee = "1920–1922"
image = "pont-japonais.jpg"
technique = "Oil on canvas, 89 × 116 cm"
collection = "Museum of Modern Art, New York"
note = "Almost blind, Monet paints from memory the bridge in his garden: reds and golds that foreshadow abstraction."
description = """
At first glance, the subject can barely be made out: a tangle of red, orange, yellow and green touches invades the whole canvas. Gradually a shape emerges: the arch of a footbridge spanning the pond at Giverny, caught in a teeming vegetation. The wisteria that covers the bridge and the plants around it merge with it into a dense, blazing mass. At the bottom, a few darker tones suggest the water of the pond. There is no sky, no horizon, no marker of scale. The motif, painted twenty years earlier in a calm light and harmonies of greens and blues, appears here as a blaze of colours, almost unrecognisable."""
evocation = """
These last views of the bridge have often been read in light of Monet's illness: the cataract, which clouded his sight, altered his perception of colours, the blues fading in favour of yellows, reds and browns. But they also express a new freedom, a painting of gesture and memory, in which the motif matters less than emotion. They have been seen as the expression of anguish, that of an old man who feels his sight slipping away, and at the same time of a fierce energy. Long neglected, judged to be the works of a diminished painter, these canvases were rehabilitated after 1945, when the American Abstract Expressionist painters recognised in them a precursor."""
histoire = """
The wooden footbridge, painted green, was built in the water garden at Giverny shortly after the creation of the pond, in the 1890s; Monet conceived it inspired by the Japanese prints he collected. He first painted it as a series in 1899. Around 1918–1924, suffering from cataracts, he returned to it in a sequence of far more violent canvases, which he kept in his studio. Operated on in the right eye in 1923, he partly recovered his sight. After his death, these canvases remained at Giverny, with his son Michel, until the 1950s, when dealers and museums, notably American ones, began to take an interest in them. The Museum of Modern Art in New York acquired this one through the Mrs. Simon Guggenheim Fund."""
facture = """
The paint is applied in thick layers, rubbed, scratched, sometimes crushed, with an energy that leaves the trace and direction of each brushstroke visible. The tones, saturated and warm, are superimposed without blending, letting the lower layers show through. The drawing has almost disappeared: the arch of the bridge is suggested only by a lighter curve in the mass. The fairly large format and the tight framing, with no distance at all, plunge the viewer into the very substance of the paint."""
details = [
  "The pale curve of the arch, at mid-height, discernible within the coloured mass.",
  "The brush marks, left visible in the thick paste.",
  "The few dark tones, at the bottom, that suggest the water of the pond.",
  "The wisteria of the bridge, become a tangle of reds and oranges.",
]
themes = ["garden", "japonisme", "abstraction", "old age", "colour"]
anecdote = """
Left abandoned after the Second World War, the house and garden at Giverny were restored thanks to numerous patrons, largely American, and opened to the public in 1980; the Japanese bridge was rebuilt there exactly as it had been."""
salle = 4
mur = "nord"
