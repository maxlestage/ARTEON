[[artistes]]
nom = "Claude Monet"
vie = "Paris, 14 November 1840 – Giverny, 5 December 1926"
biographie = """
Born in Paris, Oscar-Claude Monet grew up in Le Havre, where he first became known for his caricatures. Around 1857–1858, the painter Eugène Boudin introduced him to open-air painting, which would become the rule of his entire life. In Paris, he frequented the Académie Suisse, where he met Camille Pissarro, then, after military service in Algeria, the studio of Charles Gleyre, where he became friends with Renoir, Sisley and Bazille. His first seascapes were accepted at the Salon in 1865, but his bolder canvases were often rejected, and poverty pursued him for twenty years. In 1870 he married Camille Doncieux, mother of his son Jean, then took refuge in London during the war, where he met the dealer Paul Durand-Ruel. Settled at Argenteuil, he organised with his friends the first Impressionist exhibition in 1874. Camille died in 1879, a year and a half after the birth of their second son, Michel. Monet then lived with Alice Hoschedé and her children, settled at Giverny in 1883 and married Alice in 1892. The series of the 1890s finally brought him success and comfort. He devoted his last thirty years to his water garden and the Water Lilies, despite the death of Alice in 1911, that of his son Jean in 1914 and a cataract that threatened his sight. In the aftermath of the armistice of 1918, he offered the State his Grandes Décorations; they were installed at the Orangerie in 1927, a few months after his death."""
style = """
Monet is the painter who pushed the Impressionist principle furthest: to paint not objects, but the light and atmosphere that envelop them at a given moment. His fragmented brushwork, made of juxtaposed commas of colour, his coloured shadows and his near-abandonment of black make his canvases immediately recognisable. From 1890, he invented the series, painting the same motif at different hours and seasons, to show that perception is constantly changing. In his last years, the Water Lilies, with no horizon or point of reference, opened the way to abstract painting; the American Abstract Expressionists, after 1945, would see in him a precursor."""

[[artistes]]
nom = "Hiram Powers"
vie = "Woodstock (Vermont), 29 July 1805 – Florence, 27 June 1873"
biographie = """
The son of Vermont farmers, Hiram Powers followed his family to Ohio and grew up in Cincinnati, then a booming pioneer town. Ingenious and skilled with his hands, he first worked as a mechanic, then at the Western Museum in Cincinnati, where he made and animated wax figures, including a striking evocation of Dante's Inferno. He learned modelling from a sculptor in the city and discovered a talent for portraiture. Supported by the wealthy patron Nicholas Longworth, he left in 1834 for Washington, where he made busts of many notable figures, including President Andrew Jackson. In 1837 he settled in Florence, a great centre of Neoclassical sculpture, where he would remain until his death. His studio became an essential stop for American and English travellers, and he became friends with the poets Elizabeth Barrett Browning and Robert Browning. The triumph of The Greek Slave, exhibited in Europe and the United States, made him the most famous American sculptor of his time. He subsequently produced many busts and ideal figures, such as the Fisher Boy, Proserpine, Eve and the allegorical figure of America. An inventor in his spare time, he devised tools for working marble. He died in Florence in 1873 and lies in the English Cemetery."""
style = """
Powers is one of the great representatives of American Neoclassicism. He borrows from Antiquity its ideals of beauty, calm and purity of form, but adds a supple, naturalistic modelling and an attention to the texture of skin that owes much to his practice of portraiture. His busts, of great likeness, were much sought after. His ideal figures combine the ancient nude with moral or Christian stories, which made them acceptable to the puritan public of his country. The Greek Slave largely contributed to the acceptance of sculpture and the nude in the United States, and opened the way for the many American sculptors who came to work in Italy."""

[[artistes]]
nom = "Ferdinand Pettrich"
vie = "Dresden, 1798 – Rome, 1872"
biographie = """
The son of the sculptor Franz Pettrich, Ferdinand Pettrich was born in Dresden, in Saxony, and trained at first with his father. He then left for Rome, where he became a pupil of the Danish sculptor Bertel Thorvaldsen, one of the major figures of European Neoclassicism. In 1835 he emigrated to the United States, hoping to find public commissions in a young nation that was then adorning its official buildings, beginning with the Capitol. He worked in Washington and Philadelphia, but his official projects came to little. During these years, he took an interest in the Native American delegations that came to negotiate in the capital and made portraits of their chiefs, as well as figures inspired by their history, including that of Tecumseh. Disappointed by America, he went to Brazil in the early 1840s and worked for the court of Emperor Pedro II, for whom he executed portraits and decorations. He finally returned to Rome in the 1850s and ended his days there. His work, divided among three continents, bears witness to the movement of European Neoclassical artists in the nineteenth century, to their quest for commissions in new nations and to the period's fascination with the peoples of the New World."""
style = """
A pupil of Thorvaldsen, Pettrich remains faithful to the Neoclassical ideal: idealised nudes, polished marble, poses inspired by ancient statuary, restrained emotion. His originality lies in the choice of his subjects: he represents Native Americans whom he was able to observe in Washington, applying to them the codes of the Greek or Roman hero. This blend of observation and idealisation, typical of his time, helped fix the Romantic image of the heroic and doomed “Indian”. His work, little known to the general public, today interests historians for what it reveals of the European view of America."""

[[artistes]]
nom = "Edmonia Lewis"
vie = "Probably Greenbush (New York State), c. 1844 – London, 17 September 1907"
biographie = """
Edmonia Lewis was born to a father of Afro-Haitian origin and a mother of Ojibwe and African descent. Orphaned very young, she was raised in part by her mother's family, who named her “Wildfire”. Thanks to the support of her brother, she entered Oberlin College, in Ohio, in 1859, one of the few institutions to admit women and Black students. In 1862 she was accused there of having poisoned two white classmates; defended by the Black lawyer John Mercer Langston, she was acquitted, but suffered a violent assault and had to leave the school without a degree. In Boston she trained with the sculptor Edward Brackett and became known for portraits of abolitionists, notably a bust of Colonel Robert Gould Shaw, the sale of whose copies financed her departure for Europe. In Rome, where she settled around 1865–1866, she joined the circle of American women sculptors gathered around Harriet Hosmer. There she created works inspired by African American history, such as Forever Free, which celebrates emancipation, and Native American subjects drawn from Longfellow. Her Death of Cleopatra was one of the sensations of the Centennial Exhibition in Philadelphia in 1876. Converted to Catholicism, she received commissions from wealthy visitors, until Neoclassical taste fell out of fashion. Her last years are poorly known; only in 2011 did research establish that she had died in London in 1907."""
style = """
Edmonia Lewis worked in the Neoclassical tradition then dominant in Rome: white marble, smooth surfaces, references to Antiquity and literature. But she brought into it subjects almost absent from the sculpture of her time: the emancipation of slaves, the dignity of Black women, the life of Native American peoples. By claiming mastery of the entire process, down to the carving of the marble, she fully asserted her status as an artist. The first sculptor of African and Native American descent to gain international recognition, long forgotten, she is today being rediscovered as a pioneering figure, whose work questions the relationships between art, identity and American history."""
