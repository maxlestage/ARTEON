[[oeuvres]]
titre = "Water Lilies"
annee = "1906"
image = "nympheas.jpg"
technique = "Oil on canvas, 89.9 × 94.1 cm"
collection = "Art Institute of Chicago"
note = "No more bank or sky: only the surface of the pond at Giverny, its flowers and the reflections of clouds."
description = """
The canvas shows only the surface of a pond, seen from close up and from above, with no bank or horizon. Islands of water-lily leaves, flat and rounded, float in irregular groups; a few pink and white flowers open among them like points of light. Between the leaves, the dark water reflects the sky and clouds in broad blue and white expanses, as well as the deep green of the trees and willows that edge the pool, outside the picture. Top and bottom merge: one can no longer quite tell what floats on the surface, what lies beneath the water and what is reflected from above. The eye wanders from one island to another without finding a foothold."""
evocation = """
With the Water Lilies, Monet makes of a corner of his garden a complete world. By removing the bank and the sky, he forces the gaze to plunge into the water, where surface, depth and reflection mingle. The painting becomes a place of contemplation, almost of meditation; it has often been compared to the Japanese sensibility that Monet admired. For many historians, these canvases mark the passage from the representation of a landscape to a painting of pure sensation, and prepare the great panels of the Orangerie. They also speak of the ageing painter's withdrawal into his garden, which he had shaped himself and which became for him the entire universe."""
histoire = """
In 1893, Monet bought a plot of land on the other side of the road and railway line that bordered his property at Giverny. He obtained permission to divert part of the Ru, an arm of the Epte, in order to dig a pond there, despite the concern of neighbouring peasants, who feared that these exotic plants would poison the water. He planted water lilies there, enlarged the pond in 1901, and made it his principal motif. In 1909, the Durand-Ruel gallery presented forty-eight of these canvases under the title “The Water Lilies, Series of Water Landscapes”. This one, painted in 1906, later belonged to the great Chicago collector Martin A. Ryerson, whose collection entered the Art Institute in 1933."""
facture = """
Monet abandons traditional perspective here: no more vanishing point, no more horizon line. The composition rests on the distribution of the islands of leaves, which seem to drift slowly, and on the verticals of the reflections. The brushwork varies with what it describes: small, dense, horizontal touches for the leaves, broader and more fluid strokes for the water and the reflections of the sky. The colours, very closely attuned, blues, greens and violets punctuated with pink, create an almost musical harmony. The near-square format, unusual for a landscape, accentuates the absence of orientation."""
details = [
  "The water-lily flowers, a few pink and white touches laid on in relief.",
  "The reflection of a white cloud crossing the dark water.",
  "The vertical reflections of the trees on the bank, themselves invisible.",
  "The leaves that shrink towards the top of the canvas and suggest depth.",
]
themes = ["water", "garden", "reflections", "giverny", "contemplation"]
anecdote = """
Monet bought his coloured water lilies from the horticulturist Joseph Bory Latour-Marliac, at Temple-sur-Lot, whose pink and yellow hybrids had caused a sensation at the Exposition Universelle of 1889 in Paris."""
salle = 4
