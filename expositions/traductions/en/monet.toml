[[oeuvres]]
titre = "Rouen Cathedral, Harmony in Blue"
annee = "1893"
image = "cathedrale-rouen.jpg"
technique = "Oil on canvas, 91 × 63 cm"
collection = "Musée d'Orsay, Paris"
note = "The portal in the morning sun, painted from a window opposite: the stone dissolves into light."
description = """
The west façade of Rouen Cathedral fills the whole canvas, seen from very close and cut off at the top by the frame: neither the tops of the towers nor the spire can be seen. At the centre, the great Gothic portal opens beneath a high, finely carved arcade; above it one can make out the galleries and the rose window. On the left, the Tour Saint-Romain rises in part. The sky appears only in a narrow strip, at the sides. The stone, still plunged in the morning shadow, is bathed in deep blues, while the first touches of sun, golden and rosy, catch the reliefs, pinnacles and sculptures. No passer-by, no life on the square: only the worked mass of the building, as if suspended in the air."""
evocation = """
By painting the same façade more than thirty times, Monet transforms a monument laden with history and faith into a mere screen on which light plays. The cathedral, a symbol of permanence, paradoxically becomes the image of instability: it changes colour, substance and almost shape from one hour to the next. It has been seen as a reflection on time and perception, and some have read in it a quasi-religious meditation on light, which seems to emanate from the stone itself. The choice of a Gothic masterpiece, an emblem of the national heritage, is not insignificant either in a France then rediscovering its Middle Ages. Monet nevertheless makes of it less a monument than a living substance."""
histoire = """
Monet worked at Rouen over two winters, from February to April 1892, then in 1893. He rented in succession rooms in buildings opposite the cathedral, above shops, from which he painted the façade at different times of day. Back at Giverny, he reworked the canvases at length to harmonise the whole, and dated several of them 1894. In May 1895 he exhibited about twenty of them at Durand-Ruel's. Georges Clemenceau devoted an enthusiastic article to them in La Justice, “Revolution of Cathedrals”, and wished the State to buy the entire series, which did not happen. Count Isaac de Camondo, a great collector, brought several together, including this one, and bequeathed them to the Louvre in 1911; they are now in the Musée d'Orsay."""
facture = """
The material is the most striking element of the series: Monet superimposes, layer after layer, a thick and rugged paste, worked with an almost dry brush, which ends up resembling the stone itself. The outlines of the architecture disappear beneath this coloured crust. The palette is deliberately limited, here dominated by blues and violets, set off with touches of ochre and orange, complementary colours that make the surface vibrate. The tight framing removes all context, like a close-up. The effect of light is only fully legible from a distance."""
details = [
  "The central portal, whose sculptures dissolve in the blue shadow.",
  "The first touches of sun, golden, on the pinnacles and reliefs.",
  "The rough surface of the paint, imitating the grain of the stone.",
  "The narrow strip of sky, almost the same colour as the façade.",
]
themes = ["series", "cathedral", "gothic", "light", "rouen"]
anecdote = """
During his stay in Rouen, Monet wrote to Alice Hoschedé that he had spent a night of nightmares: the cathedral was collapsing on top of him, and it appeared to him now blue, now pink, now yellow."""
