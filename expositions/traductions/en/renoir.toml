[[oeuvres]]
titre = "Dance in the City"
annee = "1883"
image = "danse-ville.jpg"
technique = "Oil on canvas, 180 × 90 cm"
collection = "Musée d'Orsay, Paris"
note = "The chic companion to Dance in the Country: white satin, long gloves and palm trees in a Parisian salon."
description = """
In a salon, a couple waltzes, almost life-size. The young woman, seen in three-quarter \
view, wears a long white satin ball gown whose train glides over the \
parquet, and long white gloves that rise above the elbow; her hair is \
pinned up in a chignon. Her eyes lowered, her face in profile, she rests a hand on \
her partner's shoulder. He, in black tails, holds her by the waist; his bearded \
face almost disappears behind his partner's head. In the background, potted green \
plants and a pale wall suggest a reception setting. The two figures \
occupy the whole height of the narrow canvas, with no other dancer around them."""
evocation = """
The scene breathes restraint: the bodies barely touch, the glances do not \
meet, the dancer seems absorbed in herself. It has been seen as the image of the codes of \
polite society, where dancing is a regulated ritual more than a pleasure. Conceived as a \
pendant to Dance in the Country, the canvas sets city against country, salon against \
dance garden, satin against printed cotton, reserve against gaiety. Some historians \
also read in it Renoir's turn towards a more classical, colder and more \
sculptural art, which marks these years of self-questioning."""
histoire = """
Renoir painted the two dances in 1883, the year when the dealer Paul Durand-Ruel, his \
main supporter, devoted a large solo exhibition to him in Paris. The models \
were two familiar figures: Suzanne Valadon for the dancer and Paul Lhote, a friend of the painter, \
for the partner, who also poses in Dance in the Country. Durand-Ruel acquired the \
two canvases, which remained nearly a century in the dealer's family. They entered \
the national collections in the late 1970s and have been exhibited at the Musée \
d'Orsay since its opening, united side by side as Renoir had conceived them."""
facture = """
The surface is smooth and polished, the contours sharply drawn: Renoir, on his return \
from Italy, seeks the firmness of Raphael and Ingres. The white satin is built up with \
greys, blues and pinks that convey its folds and reflections. The \
cool palette, dominated by white, black and the dark green of the plants, contrasts \
with the warm tones of its companion. The very elongated vertical format and the real size \
of the figures heighten their elegance."""
details = [
  "The dancer's long white gloves, rising above the elbow.",
  "The satin train spreading over the parquet.",
  "The grey and bluish reflections that model the folds of the white dress.",
  "The man's face, almost hidden behind his partner's head.",
  "The potted green plants of the salon, in the background.",
]
themes = ["dance", "ball", "elegance", "couple", "city"]
anecdote = """
The dancer, Suzanne Valadon, posed for Renoir, Puvis de Chavannes and \
Toulouse-Lautrec before becoming a painter herself. In 1894, she was the first \
woman admitted to exhibit at the Société nationale des beaux-arts."""
salle = 3
