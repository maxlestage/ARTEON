[[oeuvres]]
titre = "The Theatre Box"
annee = "1874"
image = "loge.jpg"
technique = "Oil on canvas, 80 × 63.5 cm"
collection = "The Courtauld, London"
note = "Shown at the first Impressionist exhibition: an elegant woman in a striped gown, and her brother Edmond, who scans the auditorium through opera glasses."
description = """
In a theatre box, a young woman stands in the foreground, her arms resting on \
the velvet ledge. She wears a gown with broad black and white stripes, a \
pearl necklace, earrings, flowers pinned in her hair and \
roses at her neckline. Her white-gloved hand grips a pair of opera glasses and \
a fan. She is not looking at the stage: her face, turned slightly towards us, \
seems to offer itself to the gaze of the audience. Behind her, in the half-light, a man in \
black tails and a white shirtfront raises his own glasses towards the upper part of the house. The \
framing is very tight: we see neither the stage nor the other boxes, only this \
couple cut out as in a snapshot."""
evocation = """
The painting shows the theatre as a place where one comes as much to be seen as to \
see. The young woman, motionless and adorned, lets herself be contemplated, while her \
companion trains his glasses elsewhere, perhaps on another box: it has been read as a \
small comedy of glances, typical of Parisian sociability in the 1870s. Her \
face, pleasant but absent, gives nothing away of what she thinks, and one cannot tell whether \
she is bored, waiting or posing. For historians, the work also asserts an ambition: to prove that a painter of modern life can equal the society portraits of the Salon, \
not by painting princesses, but present-day Parisians, caught in their \
evening pleasures."""
histoire = """
Renoir painted The Theatre Box in 1874 in his studio, with two close acquaintances as models: his \
younger brother Edmond, a journalist, posed for the man with the glasses, and a young woman from \
Montmartre known as Nini for the elegant lady. In April 1874, the canvas was included \
in the first exhibition of the group that would soon be called Impressionist, in \
the former studio of the photographer Nadar, on the boulevard des Capucines. It was rather well \
received by critics who were often hostile to the group. Renoir, always short of money, \
sold it soon afterwards to the small dealer nicknamed père Martin for 425 francs, enough to \
pay his rent. After several owners, the painting was bought in the 1920s \
by the British industrialist Samuel Courtauld, who then gave it to the \
art history institute he founded in London."""
facture = """
Everything rests on the contrast of the black and white stripes. Renoir uses a velvety black, \
shaded with blue, contrary to the idea that the Impressionists \
banished this colour. The face and throat are modelled in blended, almost smooth touches, \
while the flowers, lace and gloves are picked out in small, quick, \
brilliant strokes. The artificial light of the auditorium has no visible source: \
it settles on the skin, the pearls and the shirtfront. The framing, which cuts off \
the box and relegates the man to shadow, recalls the bold layouts of Degas \
and Japanese prints."""
details = [
  "The man's opera glasses, pointed towards the upper part of the house and not at the stage.",
  "The roses set at the neckline, echoing the flowers in her hair.",
  "The white-gloved hand holding both the glasses and the fan.",
  "The bluish reflections in the blacks of the gown and the tailcoat.",
  "The ledge of the box, cut off sharply by the bottom of the frame.",
]
themes = ["theatre", "gaze", "elegance", "Parisian life", "portrait"]
anecdote = """
The man with the opera glasses, Edmond Renoir, took charge of the catalogue of the \
first Impressionist exhibition the same year. According to Monet's account, it was because Edmond \
found his titles too monotonous that the painter proposed for a view of Le Havre the word \
"Impression", which would give the movement its name."""
salle = 1
mur = "gauche"
place = 1
largeur = 1.0

[[oeuvres]]
titre = "Girl with a Watering Can"
annee = "1876"
image = "arrosoir.jpg"
technique = "Oil on canvas, 100 × 73 cm"
collection = "National Gallery of Art, Washington"
note = "A little girl in blue velvet in a garden in bloom, painted in lively, light touches."
description = """
A very small girl stands upright in the middle of a garden path. \
She wears a dark blue velvet dress, trimmed with white lace at the collar and \
cuffs, and a red bow holds back her blond hair. In one hand, she holds a small \
metal watering can; in the other, a few picked flowers. Her pink cheeks and \
serious gaze are turned towards the viewer. Around her, the garden overflows: \
beds of red, white and yellow flowers, lawn, bushes of dense green. \
The sandy path winds away behind her and opens up depth. The \
horizon line is set very high, so that the child stands out against a background \
made almost entirely of greenery and flowers."""
evocation = """
Renoir makes childhood a moment of grace, and the garden a sort of little domestic \
paradise. The contrast is striking between the little girl, planted there with the gravity \
of a grown-up posing, and the nature quivering around her: it has been seen as both \
the innocence and the fragility of an age that passes quickly. The painting also speaks of the \
new place of the child in the bourgeois family of the late nineteenth century, cherished, \
carefully dressed and worthy of being painted for her own sake. For Renoir, these portraits \
of children, without drama or anecdote, were an occasion to celebrate what he most loved to \
paint: the freshness of skin, the softness of fabric and the light of a summer \
day."""
histoire = """
The canvas dates from 1876, the year when Renoir was also working on Dance at Le Moulin de la \
Galette and took part in the second Impressionist exhibition, at the dealer \
Durand-Ruel's. At that time, his large compositions sold poorly, and the portraits \
of children commissioned by well-off families provided an essential part of his \
income. The identity of the little girl is not established with certainty, and several \
names have been proposed without decisive proof. The painting then passed through various \
collections before crossing the Atlantic. It entered the collection of the New York \
banker Chester Dale, who with his wife Maud assembled a remarkable group of \
French painting. At his death, Dale bequeathed his paintings to the National Gallery of Art in \
Washington, which received them in 1963."""
facture = """
Renoir sets two manners against each other in the same canvas. The face and hands are painted in \
fine, blended touches, of great delicacy. The garden, by contrast, is made of \
commas of pure colour, red, yellow, white and green, laid side by side without \
outline, which vibrate at a distance. The dress plays on a whole range of blues and \
violets, and the lace is suggested by a few white impastos. The light is \
diffuse, without hard shadow: even the shaded areas remain coloured, bluish or \
greenish, following the Impressionist principle."""
details = [
  "The red bow in her hair, the only vivid note near the face.",
  "The little bunch of flowers clutched in one of the child's hands.",
  "The white lace of the collar and cuffs, laid in with a few thick touches.",
  "The path winding behind the little girl and drawing the eye towards the background.",
]
themes = ["childhood", "garden", "flowers", "portrait", "summer"]
anecdote = """
Chester Dale's bequest to the National Gallery of Art comes with a condition: \
the paintings of his collection must not be lent. To see the Girl with a \
Watering Can, one must therefore almost always make the journey to Washington."""
salle = 1
mur = "droite"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Dance at Le Moulin de la Galette"
annee = "1876"
image = "moulin-galette.jpg"
technique = "Oil on canvas, 131 × 175 cm"
collection = "Musée d'Orsay, Paris"
note = "A Sunday afternoon in Montmartre: light falls in patches through the acacias onto the dancers."
description = """
The courtyard of a dance garden at the top of Montmartre, on a sunny Sunday. On the left and in the \
centre, couples dance; on the right, in the foreground, a group of young people \
has settled on a bench and around a table where glasses glint. A young \
woman in a pink and blue striped dress leans towards a man seen from behind, wearing a \
boater, while another, standing behind her, rests a hand on her shoulder. At \
centre left, a dancer in a pink dress whirls with her partner. Further off, the crowd \
loses itself in a swarm of straw hats, top hats and light \
gowns. Globes of light, hung from slender posts, float above the \
heads. No building is visible: only trees and faces."""
evocation = """
The painting celebrates a collective joy: that of clerks, working girls, \
seamstresses and artists who gather on Sunday to dance. Classes \
brush against each other, glances cross, people flirt without gravity. Renoir gives of this ball an \
image that is happy, without drunkenness or misery, although the Montmartre of the time was a \
poor district and Zola, the same year, was publishing L'Assommoir. This \
element of idealisation has often been stressed: Renoir does not seek to denounce, but to show \
that ordinary happiness deserves a large canvas. His friend Georges Rivière, who posed \
for him, then defended the painting as a precise testimony of Parisian life, \
worthy of history paintings."""
histoire = """
The Moulin de la Galette, a dance hall set up near the last windmills of the Butte, \
took its name from the galettes served there. In 1876, Renoir rented on rue Cortot a \
studio with a garden, now the Musée de Montmartre, and according to Rivière's recollections, \
his friends helped him carry the large canvas to the dance every day. These \
friends served as his models, along with young women of the neighbourhood such as Estelle, on the \
bench, or Margot, who dances at the centre with the Cuban painter Pedro Vidal de Solares. The \
painting was shown at the third Impressionist exhibition, in 1877. The painter and \
collector Gustave Caillebotte bought it, then bequeathed it to the State at his death in 1894. \
Accepted after long discussions, it entered the Musée du Luxembourg, then the Louvre, \
and finally the Musée d'Orsay at its opening, in 1986."""
facture = """
Light is the true subject: the patches of sunlight filtered through the foliage are \
laid in touches of white, pink and yellow on the dark jackets, the dresses, the \
faces and the ground. The shadows are blue or violet, never black. The composition \
progresses on a diagonal, from the foreground group, cut off by the frame, towards the crowd \
dissolving in the background. No central point dominates: the eye travels from face to \
face, as one strolls through the dance. The black of the men's clothing gives the \
whole its rhythm and makes the light tones sing."""
details = [
  "The pink and yellow patches of sunlight on the dark jacket of the man seen from behind.",
  "The glasses on the foreground table, where the light plays.",
  "The couple dancing at centre left, the young woman in pink.",
  "The globes of light hanging above the crowd.",
  "In the background, the sea of boaters and top hats.",
]
themes = ["festival", "dance", "montmartre", "light", "youth", "sunday"]
anecdote = """
Renoir painted a smaller version of the same scene. Put up for auction in New York \
in May 1990, it was sold for 78.1 million dollars to the Japanese industrialist Ryoei \
Saito, one of the highest prices ever reached at the time for a painting."""
salle = 1
mur = "fond"
place = 1
largeur = 2.0

[[oeuvres]]
titre = "Luncheon of the Boating Party"
annee = "1880–1881"
image = "dejeuner-canotiers.jpg"
technique = "Oil on canvas, 130 × 173 cm"
collection = "The Phillips Collection, Washington"
note = "On the terrace of the Maison Fournaise, at Chatou: his friends, and Aline, his future wife, playing with a small dog."
description = """
On the balcony of a restaurant on the banks of the Seine, beneath a red and white striped awning, \
some fifteen people linger at the end of a lunch. The table, covered \
with a white cloth, holds bottles, glasses and bunches of grapes. On the \
left, a young woman in a flowered hat brings her face close to a small dog. \
Behind her, a big fellow in a white vest and boater leans on the \
balustrade. On the right, in the foreground, a young man seated astride a \
chair chats with a young woman and a man leaning towards her. At the centre, a woman \
drinks from her glass; in the background, men in boaters, bowler hats or \
top hats converse. Between the foliage, one glimpses the river and sails."""
evocation = """
The painting is a hymn to friendship and to the new leisure of Parisians, whom the \
railway carried in a few minutes from the Gare Saint-Lazare to the banks of the \
Seine. Around the same table mingle a wealthy collector, an actress, \
seamstresses, boaters and painters: it has been seen as the image of a freer society, \
where people meet out of inclination rather than rank. Every face is a \
portrait, and the whole resembles an album of memories. One also reads in it Renoir's personal \
happiness, as he places in the foreground the young woman with whom he had just fallen \
in love. The chosen moment, the end of the meal, when people chat without hurrying to \
leave, speaks of the value of free time."""
histoire = """
Renoir worked on this large canvas from the summer of 1880 to 1881, at the Maison Fournaise, \
a restaurant and boat rental on the island of Chatou, of which he was a regular. His friends \
came to pose one by one: the owner's son and daughter, Alphonse and Alphonsine \
Fournaise, Aline Charigot, the painter Gustave Caillebotte, the actress Ellen Andrée, the \
collector Charles Ephrussi, the actress Jeanne Samary and others besides. Analyses \
show that he altered the composition along the way. The dealer Paul \
Durand-Ruel bought the painting and showed it at the seventh Impressionist exhibition, \
in 1882. It remained in his family until 1923, when the American \
collector Duncan Phillips acquired it for 125,000 dollars. It became the centrepiece \
of his museum in Washington, the Phillips Collection."""
facture = """
Renoir unites in a single canvas the group portrait, the genre scene, the still life \
and the landscape. The table is a bravura passage: glasses, bottles and \
grapes sparkle on a cloth whose whites are tinged with blue and pink. The \
boaters' white vests likewise run through a whole range of whites. The \
balustrade, on the diagonal, leads the eye to the background, while the awning closes the \
composition at the top. The faces are more clearly drawn than in Dance at Le Moulin de la \
Galette, a sign that Renoir's manner is beginning to evolve."""
details = [
  "The little dog that Aline holds right up against her face, in the left foreground.",
  "The still life of the tablecloth: bottles, half-full glasses and grapes.",
  "The young woman drinking, her glass masking the lower part of her face.",
  "In the background, the top hat of the collector Charles Ephrussi.",
  "Between the foliage, white sails on the Seine.",
]
themes = ["friendship", "boating", "seine", "leisure", "meal", "summer"]
anecdote = """
The young woman drinking at the centre is Ellen Andrée, an actress and much-sought-after model. \
A few years earlier, she had posed for Degas in L'Absinthe, seated with a vacant look \
in a café on the place Pigalle, a far darker image of Parisian \
life."""
salle = 2
mur = "gauche"
place = 1
largeur = 1.9

[[oeuvres]]
titre = "Two Sisters (On the Terrace)"
annee = "1881"
image = "deux-soeurs.jpg"
technique = "Oil on canvas, 100.5 × 81 cm"
collection = "Art Institute of Chicago"
note = "A young woman and a little girl in a flowered hat, on the terrace of the Maison Fournaise, before the Seine."
description = """
On a terrace by the water, a young woman is seated, dressed in a dark blue gown \
and wearing a bright red hat. In front of her, a little girl in a white dress \
wears a hat covered with flowers of every colour. Her hands rest on the \
edge of a basket filled with balls of wool. The two faces, with pink cheeks, \
turn towards the viewer without really looking at him. Behind the balustrade, a \
curtain of foliage and flowering shrubs lets one glimpse, further off, the water of the \
Seine and the opposite bank. The two figures occupy the whole lower half of the \
canvas; the landscape above seems almost a backdrop stretched behind them."""
evocation = """
The painting sets two ages of life against each other: childhood, still round and naive, and \
youth in bloom. The flowers of the hats echo those of the garden, and it has \
often been remarked that Renoir assimilates his female models to nature, at once \
fresh, decorative and a little dreamy, a vision that some historians judge \
idealised today. The scene has no story to tell: it sets up a \
moment of calm, a pause in a summer day, far from Paris. The work also speaks of the \
bourgeoisie's taste for the banks of the Seine, which had become the Sunday \
playground."""
histoire = """
Renoir painted the canvas in the spring of 1881 on the terrace of the Maison Fournaise, at \
Chatou, just as he was finishing the Luncheon of the Boating Party in the same place. The \
dealer Paul Durand-Ruel bought it that very summer of 1881, a sign that Renoir's painting \
was beginning to find buyers. The painting was shown in 1882 at the seventh \
Impressionist exhibition, under the title "On the Terrace". It then left France for \
the United States and entered the Art Institute of Chicago in 1933, with the collection \
assembled by Annie Swan Coburn and bequeathed in memory of her and her husband, Lewis Larned \
Coburn. It has become one of the most popular works in the museum."""
facture = """
The faces and hands, smooth and pearly, recall that Renoir began as a \
painter on porcelain. The background, by contrast, is treated in broad strokes of the brush, \
in free touches of green, blue and white, so that the figures appear \
set before a backdrop. The colours are frank: the red of the hat, the \
blue of the dress, the white of the child and the vivid tones of the balls of wool form a dazzling \
chord. The two figures fit into a pyramid composition, stable \
and tight."""
details = [
  "The multicoloured balls of wool in the basket, in the foreground.",
  "The little girl's hat, covered with flowers of every colour.",
  "The bright red of the young woman's hat, the most intense spot in the painting.",
  "In the distance, through the leaves, the water of the Seine and the other bank.",
  "The abrupt shift between the smooth faces and the barely brushed background.",
]
themes = ["youth", "childhood", "chatou", "flowers", "terrace"]
anecdote = """
Despite its title, the painting does not depict two sisters: the young woman is Jeanne \
Darlot, who would become an actress, and the little girl has never been identified with \
certainty. The title "Two Sisters" came to prevail later, alongside the one chosen by \
Renoir."""
salle = 2
mur = "droite"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "The Umbrellas"
annee = "c. 1881–1886"
image = "parapluies.jpg"
technique = "Oil on canvas, 180 × 115 cm"
collection = "National Gallery, London"
note = "Begun in Impressionist touches, finished in cleaner lines: one sees Renoir's style change within a single painting."
description = """
A Paris street in a downpour. A crowd of passers-by presses beneath blue-grey umbrellas \
that form an irregular roof above them. On the right, an elegant woman \
accompanies two little girls; the smaller holds a hoop and its stick, and the \
older raises her eyes to us. On the left, in the foreground, a young woman bareheaded, \
without an umbrella, carries a hatbox on her arm and lifts her skirt slightly: no \
doubt a milliner or seamstress delivering her work. Behind her, a bearded man \
looks at her, as if about to offer her shelter. In the background, more \
umbrellas and more silhouettes overlap. The edges of the painting cut off the \
figures, as if the crowd continued beyond."""
evocation = """
The painting tells of the modern metropolis, that of the Haussmann boulevards, where \
strangers of every condition cross paths for an instant. The umbrella becomes a social \
sign: the bourgeois family on the right has one, the young working girl on the left \
has none. It has been read as a scene of encounter, even of gallantry, between the bearded man \
and the passer-by. But the work also evokes Renoir's crisis in the early 1880s: he would later tell the dealer Ambroise Vollard that he then felt \
he had reached the end of Impressionism and no longer knew how to paint or draw. \
The painting bears the trace of this doubt and this search."""
histoire = """
Renoir began the canvas around 1881 and first painted the right-hand part. He took it up again \
a few years later, around 1885–1886, and largely repainted the left-hand part. \
X-rays show that the young woman with the hatbox was at first dressed \
differently. The dealer Paul Durand-Ruel bought the painting in 1892. It later passed \
to the Irish collector Hugh Lane, who died in 1915 in the sinking of the Lusitania. His \
will bequeathed his collection to the National Gallery in London, but a codicil, \
signed without witnesses, destined it for Dublin. After decades of dispute, an agreement was \
reached: The Umbrellas, like other paintings from Lane's collection, is shown in turn \
in London and at the Hugh Lane Gallery in Dublin."""
facture = """
The two stages can be read with the naked eye. On the right, the faces and clothes are \
painted in light, blended touches, with soft contours, in the spirit of the Impressionist \
years. On the left, the young woman is circled by a clean outline, her face \
firmly modelled, under the influence of Raphael and Ingres whom Renoir studied \
after his trip to Italy in 1881. A harmony of blues and greys, almost \
monochrome, unifies the whole. The curves of the umbrellas, repeated and overlapping, \
create a rhythm recalling Japanese prints."""
details = [
  "The hoop and stick held by the little girl, at right.",
  "The hatbox on the arm of the young woman without an umbrella, at left.",
  "The bearded man's gaze resting on the passer-by.",
  "The difference of touch between the blurred faces on the right and the sharply defined one on the left.",
  "The overlapping umbrellas that hide the sky entirely.",
]
themes = ["rain", "city", "crowd", "fashion", "paris"]
anecdote = """
Historians have been able to date the two stages of the painting thanks to women's fashion: the \
dresses and hats of the figures on the right correspond to the early 1880s, \
while the outfit of the young woman on the left follows the fashion of 1885–1886."""
salle = 2
mur = "gauche"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Dance at Bougival"
annee = "1883"
image = "danse-bougival.jpg"
technique = "Oil on canvas, 181.9 × 98.1 cm"
collection = "Museum of Fine Arts, Boston"
note = "A dance garden on the banks of the Seine: the model is Suzanne Valadon, who would herself become a painter."
description = """
A couple dances in the foreground, almost life-size, beneath the trees of an \
open-air dance garden. The young woman, in a white flounced dress, wearing a red \
bonnet, lets herself be swept along, one hand on her partner's shoulder; her flushed face \
turns slightly away from him. The man, in a dark blue suit, leans towards \
her insistently; the wide brim of his boater hides almost all of his face, \
of which only the beard is seen. Behind them, others sit at tables and \
chat beneath the foliage, in a green and golden light. On the ground, in the \
foreground, lie matches and cigarette ends. The very tall, narrow format \
concentrates everything on the two entwined bodies."""
evocation = """
The painting captures a moment of seduction: the man draws near, almost pressing, \
while the young woman turns her head away, between modesty, play and abandon. Nothing is \
said, everything is suggested, and this ambiguity is the charm of the scene. One also sees in it \
the popular pleasures of the Seine banks, where Parisians come on Sundays to \
drink, boat and dance. The trivial details on the ground recall that the festivity has its \
morrow. Compared with Dance in the City, more stiff, Dance at Bougival expresses the \
momentum and freedom of modest youth, and the whirling motion of the waltz that Renoir manages to \
suggest has often been stressed."""
histoire = """
Renoir painted the canvas in 1883, the same year as the two dances in the Musée d'Orsay, of \
comparable size. Bougival, a village on the banks of the Seine west of Paris, was \
then renowned for its dance gardens, not far from La Grenouillère where Renoir and Monet \
had worked side by side in 1869. The male dancer is Paul Lhote, a friend of the painter and \
journalist; the dancer is Suzanne Valadon, a young Montmartre model. Renoir drew from \
the composition a drawing published the same year in the review La Vie moderne, to \
illustrate a short story by Lhote. After passing through several collections, the \
painting was bought in 1937 by the Museum of Fine Arts in Boston, of which it is \
now one of the most famous works."""
facture = """
Renoir builds the scene on the contrast of the dark blue of the man's suit and the \
white of the dress, enlivened by the red of the bonnet, placed almost at the centre. The \
contours of the figures are firmer than at the time of Dance at Le Moulin de la Galette, \
while the background remains treated in free, vibrant touches of green and \
yellow. Movement is born of the tilt of the bodies and the whirl of the dress's hem. \
The vertical format and the real size of the figures give the viewer \
the impression of being at the edge of the dance floor."""
details = [
  "The matches and cigarette ends thrown on the ground, in the foreground.",
  "The brim of the boater that almost entirely hides the man's face.",
  "The dancer's red bonnet, a burst of colour at the heart of the canvas.",
  "The hem of the dress swirling with the motion of the dance.",
  "In the background, patrons seated at tables beneath the trees.",
]
themes = ["dance", "dance garden", "couple", "seduction", "seine"]
anecdote = """
Suzanne Valadon had begun as a circus acrobat before a fall forced her to \
stop; she then became a model. In December 1883, the very year of the painting, she \
gave birth to a son, Maurice, who would become the painter Maurice Utrillo."""
