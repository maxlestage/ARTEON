[[oeuvres]]
titre = "Dance in the Country"
annee = "1883"
image = "danse-campagne.jpg"
technique = "Oil on canvas, 180 × 90 cm"
collection = "Musée d'Orsay, Paris"
note = "Aline Charigot, laughing, fan in hand: the simple joy of an open-air popular dance."
description = """
In the open air, beneath the trees of a dance garden, a couple dances in the foreground. The \
young woman, in a white dress sprinkled with small red flowers, wearing a red \
hat, holds an open fan; she turns towards us a laughing face, with \
round, rosy cheeks. Her partner, in a blue suit, holds her close and almost buries \
his bearded face against her. His straw hat has fallen to the ground, at \
their feet. On the left, on a table, remain a glass, a crumpled napkin and \
cutlery, traces of a meal drawing to a close. Behind them, the foliage forms a \
green and luminous background. As in its pendant, the two figures, almost life-size, \
fill the whole height of the canvas."""
evocation = """
Everything here speaks of abandon and gaiety: the dancer's laughter, the partner's frank \
embrace, the fallen hat that no one bothers to pick up. Compared with Dance in the \
City, stiff and silent, Dance in the Country expresses the simple joy of a \
Sunday dance. It has often been seen as a declaration of love: the dancer is Aline \
Charigot, Renoir's companion, who would become his wife. The painting also speaks of the \
painter's tenderness for popular pleasures and for the modest world from which he \
himself came, son of a tailor and a seamstress."""
histoire = """
Aline Charigot, a young seamstress from Essoyes, in the Aube, met Renoir \
around 1880; she had already posed, in the foreground, in the Luncheon of the Boating Party. In \
1883, he paints her here opposite Paul Lhote, who also serves as the partner in Dance in the \
City. The couple would have a first son, Pierre, in 1885, and marry in 1890. Like \
its pendant, the painting was acquired by Paul Durand-Ruel and remained in the dealer's family \
until the late 1970s, when it entered the national \
collections. It is now shown at the Musée d'Orsay alongside Dance in the \
City, from which it is inseparable."""
facture = """
Unlike its pendant, the canvas is built on warm tones: reds, \
yellows, oranges and luminous greens. The contours of the figures remain firm, a sign of \
Renoir's new manner, but the foliage of the background is brushed in free, \
light touches. Aline's face, in full light, immediately draws the \
eye, while the man's remains in shadow. The small red flowers \
of the dress, scattered like spots, enliven the large white surface."""
details = [
  "The partner's straw hat, fallen on the ground.",
  "The open fan that the dancer holds in her hand.",
  "On the table, at left, the remains of a meal: a glass and a crumpled napkin.",
  "The small red flowers scattered over the white dress.",
  "Aline's laughing face, turned towards the viewer.",
]
themes = ["dance", "dance garden", "joy", "couple", "love"]
anecdote = """
Aline Charigot came from Essoyes, a village in the Aube where the couple would spend \
many summers and where Renoir would buy a house. It is in the cemetery of Essoyes that \
the painter is buried, beside her."""
salle = 3
mur = "fond"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Girls at the Piano"
annee = "1892"
image = "jeunes-filles-piano.jpg"
technique = "Oil on canvas, 116 × 90 cm"
collection = "Musée d'Orsay, Paris"
note = "Acquired by the French State: the first work by Renoir to enter a national museum."
description = """
In a bourgeois interior, two young girls stand before an upright piano. \
One, blonde, in a white dress, is seated and rests her hands on the keyboard, her eyes \
fixed on the score. The other, dark-haired, in a pink dress, stands beside her, \
leaning, one elbow resting on the piano, and follows the music with her eyes. Their heads \
almost touch. On the piano, a vase of flowers; behind them, a heavy curtain and \
furniture melt into a warm half-light. No spectator, no open door: the scene is closed in on itself, entirely taken up by the attention that \
the two girls give to the music."""
evocation = """
The painting evokes the quiet happiness of bourgeois family life, in which the study of the \
piano is part of the education of young girls. What strikes one is the silent \
complicity of the two figures, united by the same concentration. No drama, no \
anecdote: Renoir seeks a harmony, between the figures, the colours and the music \
one can sense. The painting also marks a moment in his career: at fifty-one, \
the former rebel of Impressionism at last receives official recognition. \
Some modern critics have judged this sweetness too sugary; others see in it \
the culmination of a patient search for fullness, beyond the fleeting \
impression."""
histoire = """
In 1892, at the instigation of the poet Stéphane Mallarmé and the critic Roger Marx, Henry \
Roujon, director of Fine Arts, proposed to Renoir that the State buy a work from him \
for the Musée du Luxembourg, then devoted to living artists. Renoir took up the \
same subject on several canvases before delivering this one, chosen to enter the \
public collections. The recognition came late: the painter was over fifty \
and had a long career behind him. The painting remained at the Luxembourg, then joined \
the Louvre and, finally, the Musée d'Orsay, where it remains one of the best-known images \
of Renoir."""
facture = """
The touch is supple, blended, almost pearly: Renoir abandons the dryness of his \
years of doubt and recovers softened contours. The warm palette plays on white, \
pink, red, gold and the dark green of the background. The two interlocking figures \
form a balanced pyramid, and the diagonal of the piano structures the space. One \
senses Renoir's admiration for the French painters of the eighteenth century, Fragonard \
above all, whose grace and lightness he loved."""
details = [
  "The open score that the two girls follow.",
  "The standing girl's elbow, resting on the piano.",
  "The vase of flowers set on the piano.",
  "The two heads drawn close, one blonde, the other dark.",
  "The heavy curtain that closes off the background.",
]
themes = ["music", "interior", "youth", "intimacy", "bourgeoisie"]
anecdote = """
For this commission, Renoir painted several versions of the same subject, very close to one \
another. One is in the Metropolitan Museum in New York, another in the Musée de \
l'Orangerie, in Paris, on the other side of the Seine, a few minutes' walk from the Musée \
d'Orsay."""
salle = 3
mur = "gauche"
place = 1
largeur = 1.1

[[artistes]]
nom = "Pierre-Auguste Renoir"
vie = "Limoges, 25 February 1841 – Cagnes-sur-Mer, 3 December 1919"
biographie = """
Son of a tailor and a seamstress, Pierre-Auguste Renoir was born in Limoges in 1841 \
and grew up in Paris, near the Louvre, where his family settled when he was three. At \
thirteen, he was apprenticed to a porcelain painter, then decorated \
fans and blinds. In 1862, he was admitted to the École des Beaux-Arts and attended \
the studio of Charles Gleyre, where he became friends with Claude Monet, Alfred Sisley and Frédéric \
Bazille. In 1869, he painted with Monet at La Grenouillère, on the banks of the Seine: it is \
there that the Impressionist touch took shape for the two friends. After the war of \
1870, he took part in 1874 in the first exhibition of the group, then in the following ones, \
in great poverty. Success came gradually, thanks to portraits commissioned by \
the bourgeoisie, notably that of Madame Charpentier and Her Children, acclaimed at the Salon \
of 1879, and to the support of the dealer Paul Durand-Ruel. In 1881, a trip to Algeria \
and then to Italy, where he discovered Raphael and the frescoes of Pompeii, opened a period of \
doubt and of more severe drawing. In 1890 he married Aline Charigot, who gave him three \
sons: Pierre, an actor, Jean, the future filmmaker, and Claude. Struck from the 1890s \
onwards by a polyarthritis that deformed his hands, he acquired in 1907 the estate of \
Les Collettes, at Cagnes-sur-Mer, and continued to paint, a brush slipped between his \
fingers. Aline died in 1915. A few months before his death, in 1919, Renoir was able to see \
one of his canvases hanging in the Louvre."""
style = """
Renoir is the painter of happiness: balls, lunches, children, women and flowers, caught \
in a warm light that caresses skin and filters through foliage. His \
Impressionist touch, light and colourful, makes patches of sunlight and blue \
shadows vibrate. After 1881, he sought more drawing and solidity, before \
returning to a more blended, pearly manner, with red and golden tones, which culminates in \
his late nudes. Heir to Rubens and the painters of the eighteenth century, he influenced \
Bonnard, Matisse and the Picasso of the 1920s, who admired his sensuality of \
colour and form."""
