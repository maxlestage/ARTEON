introduction = """
The balls of Montmartre, lunches on the banks of the Seine, children and \
young girls: Renoir paints the joyous Paris of the late nineteenth century, in a \
light that dances through the foliage. Ten canvases, from The Theatre Box to Girls \
at the Piano, by way of his three great dances."""
vitrine = "moulin-galette.jpg"

[musee]
nom = "Musée d'Orsay"
ville = "Paris, France"
architecte = "Victor Laloux"
construction = "1898–1900"
presentation = """
The Musée d'Orsay occupies the former Gare d'Orsay, built by Victor Laloux for \
the Exposition Universelle of 1900 on the Left Bank of the Seine, facing the Tuileries \
garden. Its metal framework hides behind a stone façade, and an \
immense glass roof covers the train hall. Too short for modern trains, the \
station lost its long-distance lines as early as 1939; threatened with demolition, it was finally \
turned into a museum. The architects of the ACT agency and the Italian Gae Aulenti \
fitted out the great nave and its galleries, and the museum opened in December 1986. It presents \
art from 1848 to 1914, from painting to photography, and the richest Impressionist \
collection in the world. Renoir is at home here: Dance at Le Moulin de la Galette, bequeathed \
by Caillebotte, the two Dances and the Girls at the Piano, bought by the State in \
1892, are among the best-loved canvases in the museum."""
ici = """
Lacking a plan, the ARTEON building is only a simple evocation of Orsay: three rooms \
in a row, linked by corridors, which one walks through in the order of the painter's \
career. Room I · The Impressionist Years, with pinkish-beige walls, brings together The Theatre Box \
and the great Montmartre ball. Room II · Modern Life, with pale mauve walls, follows \
the boaters and the streets of Paris. Room III · Dances and Young Girls, with soft \
pink walls, presents at the end of the gallery the three great dances side by side."""

