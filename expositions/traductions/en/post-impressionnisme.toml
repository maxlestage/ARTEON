[exposition]
ordre = 130
nom_court = "Post-Impressionism"
mouvement = "Neo-Impressionism, Nabis and Naïve Art"
cadre = "blanc"
couleur = "#2f6b5a"
titre = "After Impressionism: Dots, Flat Colour and Dreams"
artiste = "Seurat, Signac, Toulouse-Lautrec, Douanier Rousseau, the Nabis…"
dates = "1884–1910"
accroche = "Virtual exhibition · Art Institute of Chicago"
introduction = """
After 1884, young painters set out to go beyond Impressionism: Seurat and Signac break \
colour down into dots, Toulouse-Lautrec captures the Montmartre night, Sérusier, Bonnard \
and Vuillard, the Nabis, lay down flat areas of colour and patterns as in a Japanese \
print, and the Douanier Rousseau paints jungle dreams. Ten works, from La Grande Jatte \
to The Dream. The building is inspired by the Art Institute of Chicago: one enters by \
the grand staircase, La Grande Jatte waits alone at the end of Gallery 240, and the \
Douanier Rousseau occupies a white, luminous room like those of the Modern Wing."""
vitrine = "grande-jatte.jpg"

[musee]
nom = "Art Institute of Chicago"
ville = "Chicago, United States"
architecte = "Shepley, Rutan and Coolidge"
construction = "1892–1893"
presentation = """
Founded in 1879 as a school and museum, the Art Institute moved in 1893 into a \
Beaux-Arts palace raised on Michigan Avenue, at the edge of Grant Park, by the Boston \
firm of Shepley, Rutan and Coolidge: the building first hosted the congresses of the \
World’s Columbian Exposition of 1893. Two bronze lions by Edward Kemeys have guarded its \
entrance since 1894. Inside, a grand stone staircase leads to the upper galleries, where \
one of the richest ensembles of Impressionist and Post-Impressionist art outside France \
is found, with Seurat’s La Grande Jatte, acquired in 1926, and Van Gogh’s Bedroom. In \
2009, the museum was enlarged by Renzo Piano’s Modern Wing, with white galleries lit by \
a roof that filters daylight. It is today one of the largest art museums in the United \
States."""
ici = """
ARTEON keeps its great rhythm. The grand staircase, a hall of pale stone twelve metres \
high, welcomes the visitor from the south and serves three rooms. To the north, Gallery \
240 · The Dot keeps La Grande Jatte alone at the middle of its back wall. To the west, \
Pont-Aven and the Nabis; to the east, The Nights of Montmartre, whose north door opens \
onto the last room, The Douanier Rousseau: the whitest and, at 7 metres under the \
ceiling, the highest of the galleries, as in the Modern Wing. The other rooms are 5.5 to \
6 metres high."""

