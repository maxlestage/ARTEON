[[oeuvres]]
titre = "Interior, the Artist’s Mother and Sister"
artiste = "Édouard Vuillard"
annee = "1893"
image = "mere-et-soeur.jpg"
technique = "Oil on canvas, 46.3 × 56.5 cm"
collection = "Museum of Modern Art, New York"
note = "The mother, massive and calm; the sister, as if sucked into the wallpaper: a family closed room."
description = """
In a small cluttered room, the painter’s mother sits bolt upright on a chair, at the \
centre, dressed in a black dress that forms a compact mass; her hands rest on her lap and \
she looks toward us. At left, her daughter Marie, in a checked dress, stands doubled \
over, awkwardly, her back bent against the wall: her dress almost merges with the \
wallpaper covered with brown and pale spots. Behind the mother, a reddish-brown piece of \
furniture; at the right edge, a small table on which a plate and a white cloth are set. \
The ochre floor rises in a steep slope toward the back."""
evocation = """
Beneath its appearance of an everyday scene, the painting expresses a tension. The \
mother, solid and motionless, occupies the central place; the daughter, pushed to the \
side, seems crushed, as if the room were pushing her away. It has been read as the power \
relations of a family turned in on itself, and an echo of the year 1893, when Marie \
married Ker-Xavier Roussel, Vuillard’s friend. The painter, who would always live with \
his mother, observes his loved ones with tenderness but without artifice. This is \
intimism according to Vuillard: small interiors where the patterns of fabrics and \
wallpapers tell as much as the faces."""
histoire = """
After his father’s death, Vuillard lived in Paris with his mother, who supported the \
family by running a dressmaking and corset workshop in the apartment, and with his sister \
Marie. This small female world, the seamstresses, the fabrics, the gestures of work, \
became his favourite subject. In 1893, the year of the painting, Marie married the \
painter Ker-Xavier Roussel, Vuillard’s schoolmate at the Lycée Condorcet and, like him, a \
member of the Nabis. Vuillard then exhibited with his friends and worked for Lugné-Poe’s \
Théâtre de l’Œuvre. The painting entered the Museum of Modern Art in New York in 1934."""
facture = """
Vuillard works on a small format, with a rather dry, matte paint layer. He almost \
eliminates space: the wallpaper, the checked dress and the furniture form a mosaic of \
patterns in which the figures are set. The colours are muted, browns, ochres, blacks, \
awakened by a few pale patches. The perspective is deliberately skewed, with a floor \
that tips toward the viewer, as in Japanese prints, which reinforces the impression of \
suffocation."""
details = [
  "The sister bent over at left, her checked dress almost melted into the wallpaper.",
  "The mother’s hands laid flat on her lap.",
  "The floor rising in a steep slope toward the back.",
  "The plate and the white cloth on the small table, at the right edge.",
]
themes = ["family", "interior", "intimism", "pattern", "Nabis"]
anecdote = """
Vuillard lived with his mother until her death, in 1928; he was then nearly sixty. She \
appears in hundreds of his paintings, drawings and photographs."""
salle = 3
mur = "sud"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "The Sleeping Gypsy"
artiste = "Henri Rousseau"
annee = "1897"
image = "bohemienne-endormie.jpg"
technique = "Oil on canvas, 129.5 × 200.7 cm"
collection = "Museum of Modern Art, New York"
note = "In the desert, under the moon, a lion sniffs a sleeping woman without devouring her: a suspended dream."
description = """
It is night, in a sandy desert. In the foreground, a dark-skinned woman sleeps stretched \
on the ground, dressed in a long multicoloured striped robe; she still holds a walking \
staff. Beside her are set a mandolin and a terracotta jug. A lion with a thick mane \
stands over her, its tail raised, and sniffs her without attacking; its eye gleams. \
Behind stretches an expanse of water bordered by pink and grey mountains. The immense \
midnight-blue sky occupies almost half of the canvas; at upper right, a full moon with a \
human face lights the scene, and a few stars twinkle."""
evocation = """
Rousseau himself described his subject: a wandering Black woman, a mandolin player, lies \
deeply asleep, her jug beside her; a lion passes by chance, sniffs her and does not \
devour her, in a very poetic moonlight effect. The painting rests entirely on this \
suspension. Nothing moves, there is no sound: threat and peace coexist. It has been seen \
as an image of the dream, the lion possibly being the one the sleeper sees in her sleep, \
or as a fable about the protection of innocence. The Surrealists admired this dream \
logic, which brings together, without explanation, elements foreign to one another."""
histoire = """
Rousseau exhibited the canvas at the Salon des Indépendants of 1897, where his works \
often made the public laugh. He then offered to sell it to the town of Laval, his \
birthplace, which refused. The painting then disappeared for more than twenty-five years. \
It resurfaced in Paris in 1923, just as the avant-gardes were discovering Rousseau and \
celebrating him as a precursor. It was bought by the great New York collector John \
Quinn, then, after his death, passed into other hands before being given in 1939 to the \
Museum of Modern Art in New York by Mrs. Simon Guggenheim."""
facture = """
Rousseau paints with a smooth meticulousness: no visible touch, crisp contours, colours \
laid in carefully graded flat areas. The perspective is simple and a little stiff, the \
proportions approximate, but the composition is very carefully studied: two broad \
horizontal bands, the ground and the sky, and at the centre the lion and the sleeper \
superimposed. The vivid stripes of the robe cut across the nocturnal range of blues and \
browns. The lion’s mane is rendered lock by lock."""
details = [
  "The moon with a human face, at upper right.",
  "The mandolin and the jug set beside the sleeper.",
  "The woman’s bare feet, at left, and her half-closed eyes.",
  "The lion’s raised tail, drawn in a single stroke against the sky.",
  "The signature and date, at lower right.",
]
themes = ["night", "desert", "dream", "lion", "naïve art"]
anecdote = """
Laval did not want the painting in 1897. Today, the town honours its painter: the \
Vieux-Château houses a museum devoted to naïve art, and one can still see the porte \
Beucheresse, the tower of the old ramparts where he was born."""
salle = 5
mur = "est"
place = 2
largeur = 2.0

[[oeuvres]]
titre = "The Dream"
artiste = "Henri Rousseau"
annee = "1910"
image = "le-reve.jpg"
technique = "Oil on canvas, 204.5 × 298.5 cm"
collection = "Museum of Modern Art, New York"
note = "His last great canvas: a nude woman on a sofa, transported in a dream into the heart of a jungle."
description = """
At left, a nude woman with long dark hair lies on a red velvet sofa, her arm stretched \
toward the forest. All around spreads a lush jungle: immense blue, pink and white \
flowers, leaves of every shade of green, a tree laden with orange fruit, birds and \
monkeys in the branches. At the centre, in the half-light, a dark-skinned snake charmer, \
dressed in a striped loincloth, plays the flute. Two round-eyed lions look out through \
the grasses; behind the foliage hides an elephant’s head, and an orange snake slithers \
through the grass at right. At the top, a full moon shines in a clear sky."""
evocation = """
Rousseau gave the key to the painting: the woman asleep on her sofa dreams that she is \
transported into this forest and hears the charmer’s music. He accompanies it with a \
short poem in which the sleeper bears the name Yadwigha. The drawing-room furniture lost \
in the middle of the jungle brings two worlds together, Parisian everyday life and \
imaginary exoticism, as the dream does. It has been seen as a celebration of sensuality \
and imagination, and a foreshadowing of Surrealism, which would make the dream a source \
of images. The wild beasts with wide-open eyes, more astonished than fierce, give the \
scene a calm strangeness, between paradise and menace."""
histoire = """
Rousseau showed The Dream at the Salon des Indépendants in March 1910, accompanied by his \
poem. This time he was no longer merely mocked: for some years, Picasso, Apollinaire, \
Delaunay and a whole young generation had admired him, and Apollinaire hailed the \
painting in the press. It is his last great work: Rousseau died a few months later, in \
September 1910, at the Necker hospital, of a badly treated leg wound. The dealer \
Ambroise Vollard acquired the canvas, which then passed through several collections \
before being given in 1954 to the Museum of Modern Art in New York by Nelson A. \
Rockefeller."""
facture = """
Rousseau builds his jungle like a theatre set, in superimposed planes of foliage cut out \
one by one. Each leaf is outlined, painted flat, in a range of greens of astonishing \
variety. He never saw a tropical forest: he drew the plants of the greenhouses of the \
Jardin des Plantes in Paris and copied animals from illustrated albums. The figures have \
the stiffness of popular images, but the whole is of a decorative precision and richness \
that fascinated modern painters."""
details = [
  "The red sofa, a Parisian drawing-room piece strayed into the jungle.",
  "The flute-playing charmer, almost invisible in the shadow, at the centre.",
  "The two round-eyed lions staring at the viewer.",
  "The elephant’s head half hidden in the foliage, to the left of the charmer.",
  "The orange snake slithering through the grass, at right.",
]
themes = ["jungle", "dream", "nude", "exoticism", "naïve art"]
anecdote = """
It was long said that Rousseau had seen the forests of Mexico during his military \
service. This is a legend, perhaps kept alive by himself: he never left France, and his \
jungles were born in the greenhouses of the Jardin des Plantes."""
salle = 5
mur = "nord"
place = 2
largeur = 3.0

[[artistes]]
nom = "Georges Seurat"
vie = "Paris, 2 December 1859 – Paris, 29 March 1891"
biographie = """
The son of a well-off Parisian family, Georges Seurat entered the École des Beaux-Arts in \
1878, in the studio of Henri Lehmann, a pupil of Ingres. There he learned classical \
drawing, but above all read the scientists of colour, Chevreul and Ogden Rood, and the \
critic Charles Blanc. After his military service in Brest, he devoted himself to powerful \
drawings in Conté crayon, all velvety shadows. In 1884, his large canvas Bathers at \
Asnières was rejected by the Salon: he exhibited it with other rejected artists and took \
part in the founding of the Société des artistes indépendants, where he met Paul Signac. \
La Grande Jatte, shown in 1886, made him the leader of a new movement, \
Neo-Impressionism, which Pissarro and young French and Belgian painters joined for a \
time. Discreet and methodical, he then painted the Models, Circus Sideshow, the Chahut, \
and spent his summers on the Channel coast. He died suddenly in March 1891, at thirty-one, \
while the unfinished Circus was being exhibited at the Indépendants. His family then \
discovered that he had been living with a young woman, Madeleine Knobloch, with whom he \
had a son."""
style = """
Seurat invents a painting based on science: small dots of pure colours, juxtaposed \
according to the laws of contrast, which the viewer’s eye mixes at a distance. His \
highly constructed compositions freeze modern life in a solemn immobility. His method, \
pursued by Signac, nourished Matisse’s Fauvism, Cubism and abstraction, which retained \
his lesson: a painting is a considered assembly of colours and lines."""

[[artistes]]
nom = "Paul Signac"
vie = "Paris, 11 November 1863 – Paris, 15 August 1935"
biographie = """
Born into a family of Parisian shopkeepers, Paul Signac gave up his architecture studies \
for painting after discovering Monet. Almost self-taught, he took part in 1884 in the \
founding of the Société des artistes indépendants, where he befriended Georges Seurat; he \
at once adopted his method of divided colour and became his most faithful ally. After \
Seurat’s death in 1891, it was he who defended and kept Neo-Impressionism alive. A \
passionate sailor, he sailed on many boats and in 1892 discovered the little harbour of \
Saint-Tropez, where he settled for part of the year. In 1899, he published From Eugène \
Delacroix to Neo-Impressionism, which set out the movement’s theory. He welcomed Matisse \
to Saint-Tropez in 1904 and directly influenced the beginnings of Fauvism. Close to \
anarchist circles, he gave drawings to their newspapers. For a long time president of \
the Société des artistes indépendants, from 1908, he also painted countless watercolours \
of ports, from Marseille to Venice and Constantinople. He died in Paris in 1935."""
style = """
Signac enlarges Seurat’s dot into square touches, larger and freer, laid like the tesserae \
of a mosaic. His colours become ever more brilliant and decorative. His harbours and \
seascapes, bathed in Mediterranean light, and his quick watercolours show a painter more \
lyrical than theorist. Through his book and through his example, he passed pure colour on \
to the Fauves."""

[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi, 24 November 1864 – château de Malromé (Gironde), 9 September 1901"
biographie = """
Henri de Toulouse-Lautrec was born into an old aristocratic family of the Midi; his \
parents were first cousins. As an adolescent, he broke both legs in 1878 and 1879: they \
stopped growing, probably because of a hereditary bone disease. Set apart from château \
life, he devoted himself to drawing, trained with Princeteau, then in Paris with Bonnat \
and in Cormon’s studio, where he met Émile Bernard, Louis Anquetin and Vincent van Gogh. \
Settled in Montmartre, he painted its cabarets, its dances and its performers: Aristide \
Bruant, La Goulue, Jane Avril, Yvette Guilbert. His poster for the Moulin Rouge, in 1891, \
made him famous; he drew some thirty, and hundreds of lithographs. He also observed, \
without judgement, life in the brothels. Undermined by alcohol, he was committed in 1899 \
to a clinic in Neuilly, where he drew from memory a series on the circus to prove his \
lucidity. He died at thirty-six at the château de Malromé, at his mother’s home. She and \
his friend Maurice Joyant gave his works to Albi, where the Musée Toulouse-Lautrec \
opened in 1922."""
style = """
Lautrec is first of all a draughtsman: a quick, nervous line that captures an attitude, a \
tic, a face in a few strokes. He borrows from Degas and Japanese prints the cropped \
framing and plunging views, and often paints with thinned oil paint, on cardboard, in \
hatched touches. His posters, with their frank flat areas and integrated lettering, \
founded the modern poster and inspired generations of graphic designers."""

[[artistes]]
nom = "Paul Sérusier"
vie = "Paris, 9 November 1864 – Morlaix, 7 October 1927"
biographie = """
The son of a well-off Parisian family, Paul Sérusier did solid studies at the Lycée \
Condorcet before entering the Académie Julian, where he became the massier, the student \
in charge of representing the others. In the summer of 1888, at Pont-Aven, he met Paul \
Gauguin, who had him paint the small landscape of the Bois d’Amour that would be called \
the Talisman. On his return, he founded with Maurice Denis, Pierre Bonnard, Paul Ranson \
and Henri-Gabriel Ibels the group of the Nabis, from a Hebrew word meaning prophets, \
suggested by the poet Henri Cazalis. In 1889 and 1890, he joined Gauguin at Le Pouldu. \
Curious about philosophy and theosophy, he befriended the Dutch painter Jan Verkade and \
discovered with him, at the Benedictine abbey of Beuron, in Germany, a theory of sacred \
proportions. He gradually settled in Brittany, at Châteauneuf-du-Faou, where he painted \
peasants and legends. He taught at the Académie Ranson and in 1921 published a short \
treatise, the ABC of Painting. He died in Morlaix in 1927."""
style = """
Sérusier is the theorist of the Nabis: he translates Gauguin’s lesson into principles, \
pure colours, simplified forms, rejection of imitation. His Breton canvases combine \
decorative flat areas and stylized figures, of an almost religious gravity. Later, he \
sought in geometry and numbers a universal harmony. His Talisman remains a decisive \
stage toward non-figurative painting."""

[[artistes]]
nom = "Émile Bernard"
vie = "Lille, 28 April 1868 – Paris, 16 April 1941"
biographie = """
Born in Lille, Émile Bernard came to Paris as a child and at sixteen entered Fernand \
Cormon’s studio, where he befriended Toulouse-Lautrec, Louis Anquetin and Vincent van \
Gogh; he was dismissed from it in 1886 for insubordination. He then set off on foot for \
Normandy and Brittany. With Anquetin, he developed in 1887 Cloisonnism, flat areas of \
colour outlined with dark strokes like stained glass. In 1888, at Pont-Aven, he painted \
the Breton Women in the Meadow and exchanged with Gauguin the ideas from which \
Synthetism was born; in 1889, they exhibited together at the Café Volpini, on the \
fringes of the Exposition Universelle. Bernard then fell out with Gauguin, whom he \
accused of having confiscated the invention. A devout believer, he turned to religious \
painting, travelled to Italy, then lived about ten years in Egypt, in Cairo. Back in \
France, he visited Cézanne in Aix in 1904 and published their conversations; he also \
published the letters Van Gogh had addressed to him. From then on he defended a return \
to the tradition of the old masters and died in Paris in 1941."""
style = """
In his decisive years, from 1887 to 1891, Bernard radically simplifies painting: large \
zones of pure colour, dark contours, abolished perspective, influences of stained glass, \
Japanese prints and popular imagery. This language, shared with Gauguin, opened the way \
to the Nabis and to Symbolism. His later painting, more classical, remained in the \
shadow of his beginnings."""

[[artistes]]
nom = "Pierre Bonnard"
vie = "Fontenay-aux-Roses, 3 October 1867 – Le Cannet, 23 January 1947"
biographie = """
The son of a senior official of the Ministry of War, Pierre Bonnard took his law degree \
to reassure his father, while attending the Académie Julian, where he met Sérusier, \
Maurice Denis and Ranson, then the École des Beaux-Arts, where he befriended Vuillard. He \
joined the Nabis, and his poster France-Champagne, in 1891, allowed him to devote himself \
to art. He drew for La Revue blanche, illustrated books for the dealer Ambroise Vollard, \
worked for the theatre and made screens and lithographs. In 1893, he met Marthe, whose \
real name was Maria Boursin, who would be his model for life and whom he married in \
1925. After 1900, his palette brightened: he painted the Seine at Vernon, not far from \
Monet at Giverny, then the light of the Midi. In 1926, he bought a villa at Le Cannet, \
above Cannes, where he worked until his death, in 1947. Discreet, little given to \
theory, he constantly retouched his canvases, even once they were hung."""
style = """
As a young Nabi, Bonnard composes decorative surfaces inspired by Japanese prints: flat \
areas, fabric patterns, bold framing, humour. He then becomes an immense colourist, \
painting from memory interiors, gardens and nudes bathed in a vibrating light. His \
freedom in colour and in composition counted for a great deal in twentieth-century \
painting."""

[[artistes]]
nom = "Édouard Vuillard"
vie = "Cuiseaux (Saône-et-Loire), 11 November 1868 – La Baule, 21 June 1940"
biographie = """
The son of a retired officer, Édouard Vuillard moved as a child to Paris with his family. \
At the Lycée Condorcet, he befriended Ker-Xavier Roussel, Maurice Denis and Aurélien \
Lugné-Poe, then joined the Nabis group at the Académie Julian. After his father’s death, \
his mother ran a dressmaking workshop in the family apartment: these interiors, these \
women at work and these fabrics became his first subjects. He designed sets and \
programmes for Lugné-Poe’s Théâtre de l’Œuvre and frequented the Natanson brothers, \
founders of La Revue blanche, and Misia, the wife of one of them. He painted large \
decorative panels, such as the Public Gardens commissioned in 1894 by Alexandre \
Natanson. Later, he became a sought-after portraitist of Parisian high society, often \
caught at home, in its setting. He lived with his mother until her death, in 1928, and \
entered the Académie des Beaux-Arts in 1937. He died in La Baule in June 1940, during \
the exodus."""
style = """
Vuillard is the painter of intimacy. In small formats with muted colours, he blends \
figures, wallpapers and fabrics in a mosaic of patterns in which space is lost. His \
silent scenes suggest feelings more than they show them. In his large decorative \
schemes, he recovers the matte softness of tapestry, thanks to distemper painting."""

[[artistes]]
nom = "Henri Rousseau"
vie = "Laval, 21 May 1844 – Paris, 2 September 1910"
biographie = """
The son of a Laval tinsmith, Henri Rousseau became a clerk for a solicitor, then enlisted \
in the army. In 1871, he joined the Paris octroi, the administration that collected \
taxes on goods entering the city: hence his nickname of Douanier, customs officer, \
although he never was one. He painted as a self-taught amateur in his leisure time and \
from 1886 exhibited at the Salon des Indépendants, open to all, without a jury. The \
public and the critics mocked his canvases, which he continued to send each year. In \
1893, he retired to devote himself to painting, gave violin and drawing lessons and \
lived in poverty. He befriended Alfred Jarry, also born in Laval, then Apollinaire, \
Robert Delaunay and Picasso, who organized in 1908 a banquet in his honour at the \
Bateau-Lavoir. After Surprised!, his first jungle, in 1891, he painted about twenty from \
1904 on. He died in September 1910 at the Necker hospital, shortly after exhibiting The \
Dream."""
style = """
Rousseau paints without academic training, with a meticulous application: crisp \
contours, smooth colours, naïve perspective, frontal figures. His jungles, invented from \
Parisian greenhouses and album illustrations, have a dreamlike strangeness. Admired by \
Picasso, Apollinaire and then the Surrealists, he opened the way to the recognition of \
naïve art."""
