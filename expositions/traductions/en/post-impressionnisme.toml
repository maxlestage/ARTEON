[[oeuvres]]
titre = "A Sunday Afternoon on the Island of La Grande Jatte"
artiste = "Georges Seurat"
annee = "1884–1886"
image = "grande-jatte.jpg"
technique = "Oil on canvas, 207.5 × 308.1 cm"
collection = "Art Institute of Chicago"
note = "Two years of work and dozens of studies for a Sunday stroll frozen like a frieze: the manifesto of Neo-Impressionism."
description = """
On an island in the Seine, at the gates of Paris, strollers enjoy a summer Sunday by the \
water. At right, in the foreground, a couple stands in profile: the woman, in a bustle \
dress and with a parasol, holds a small monkey on a leash; the man wears a top hat and \
carries a cane. At left, a boatman in a sleeveless jersey smokes a pipe, lying in the \
grass near a gentleman in a top hat and a seated woman. At the centre, a mother and her \
little girl in white walk toward us. Elsewhere, motionless silhouettes: a woman fishing \
at the water’s edge, two soldiers, a trumpeter, a child running. On the river glide \
sailboats, a rowing skiff and a steamboat, while the shadows of the trees stripe the \
lawn."""
evocation = """
Seurat paints a modern leisure in which all classes meet: bourgeois, boatmen, soldiers, \
nursemaids. But nothing moves. The figures, stiff and solemn, often seen in profile, seem \
to have stepped out of an ancient frieze; a friend of the painter reports that he wanted \
to make the people of today file past as on the friezes of the Parthenon. Historians have \
read different messages in it: a discreet satire of the Sunday bourgeoisie, in which the \
woman with the monkey would pass for a kept woman and the fishing woman for a pun on \
sin; an image of solitude in the crowd, each person isolated in a bubble; or, on the \
contrary, for his anarchist friends, the promise of a harmonious society. This ambiguity \
is its strength."""
histoire = """
Seurat began the canvas in 1884, after Bathers at Asnières, which showed workers on the \
other bank. For two years, he went to the island to observe the strollers and \
accumulated small studies painted on wood and drawings in Conté crayon, then composed the \
painting in the studio. In 1885, he reworked it entirely with his new technique of dots. \
Shown in May 1886 at the eighth and last Impressionist exhibition, it provoked laughter \
and scandal; the critic Félix Fénéon defended it and coined the word Neo-Impressionism. \
Exhibited next at the Indépendants, then in Brussels in 1887, it was bought in 1924 by \
the Chicago collector Frederic Clay Bartlett, who gave it to the Art Institute in 1926, \
in memory of his wife Helen."""
facture = """
On a first layer laid in broad crossed strokes, Seurat juxtaposes small dots of pure \
colour, instead of mixing them on the palette: seen from a distance, they blend in the \
viewer’s eye. He applies the laws of simultaneous contrast of Chevreul and the work of the \
American physicist Ogden Rood, placing beside each colour its complementary to make it \
vibrate. The composition is regulated like architecture, made of verticals, horizontals \
and parallel profiles. Around 1888–89, he added a painted border of dark dots to ensure \
the transition to the frame."""
details = [
  "The little monkey held on a leash by the woman with the parasol, at right.",
  "The little girl in white, at the centre, walking toward the viewer.",
  "The border of dark dots painted around the canvas, added afterward.",
  "The black dog sniffing in the grass, in the foreground.",
  "The steamboat and the sailboats on the Seine, in the background.",
]
themes = ["leisure", "Sunday", "Seine", "pointillism", "society"]
anecdote = """
The painting inspired Stephen Sondheim’s musical Sunday in the Park with George, which \
premiered on Broadway in 1984: Seurat is seen composing his canvas, and the first act \
ends with the actors frozen in the exact pose of the figures."""
salle = 2
mur = "nord"
place = 2
largeur = 3.0

[[oeuvres]]
titre = "Portrait of Félix Fénéon (Opus 217)"
artiste = "Paul Signac"
annee = "1890"
image = "portrait-feneon.jpg"
technique = "Oil on canvas, 73.5 × 92.5 cm"
collection = "Museum of Modern Art, New York"
note = "The critic who christened Neo-Impressionism, a flower in hand, before a whirlwind of colours."
description = """
Standing at right, a slim man is seen in profile, turned to the left: Félix Fénéon, with \
his pointed goatee, his orange coat, his white collar and red tie. In one hand he holds a \
top hat and a cane, and with the other extends, in a refined gesture, a small white \
flower. Behind him, the background is not a room but an abstract setting that spins: a \
large disc made of rays and circles of colour, green and red waves, yellow arabesques, \
stars on a blue ground, balls that suggest planets. In the lower left corner, the number \
“Op. 217”; at right, Signac’s signature."""
evocation = """
The portrait is at once a tribute and a wink. Fénéon, an impassive dandy and a \
feared critic, is presented as a magician or a tamer who conjures up colours. The \
whirling background illustrates the ideas of the scientist Charles Henry, a friend of the \
Neo-Impressionists, for whom lines and colours act on emotion: rising lines would cheer, \
falling ones would sadden. The full title, Against the Enamel of a Background Rhythmic \
with Beats and Angles, Tones and Tints, Portrait of M. Félix Fénéon in 1890, and the \
opus number, as for a musical score, bring painting close to music. A motif inspired by \
a Japanese textile has also been recognized in the background."""
histoire = """
Signac and Fénéon had known each other since the mid-1880s. An employee of the Ministry \
of War, Fénéon wrote in the small reviews; in 1886, in his pamphlet The Impressionists \
in 1886, he was the first to analyse Seurat’s method and coined the term \
Neo-Impressionism. In 1890, Signac proposed to make his portrait and composed this very \
elaborate canvas, which he showed at the Indépendants of 1891 under its long title. A \
few years later, in 1894, Fénéon, an anarchist sympathizer, was arrested and tried in the \
Trial of the Thirty, before being acquitted. The painting belongs today to the Museum of \
Modern Art in New York."""
facture = """
Signac pushes the divided touch here toward decoration. The dots, larger and more regular \
than Seurat’s, cover the whole surface with a tight network. The colours play on \
complementaries: the orange coat stands out against a starry blue, the green answers the \
red. The background seeks no depth: it is flat, rhythmed by curves and concentric bands \
that recall Charles Henry’s chromatic circle. The model’s crisp profile, almost cut out, \
contrasts with this whirlwind."""
details = [
  "The small white flower that Fénéon holds out at his fingertips.",
  "The yellow stars on a blue ground, behind the coat.",
  "The inscription “Op. 217”, in the lower left corner.",
  "The pointed goatee that prolongs the profile.",
]
themes = ["portrait", "art criticism", "spiral", "colour theory", "music"]
anecdote = """
Fénéon remains famous for his “three-line novels”: in 1906, he anonymously wrote for the \
newspaper Le Matin news items of ferocious concision, collected much later in a volume \
and admired as small masterpieces of black humour."""
salle = 2
mur = "est"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "At the Moulin Rouge"
artiste = "Henri de Toulouse-Lautrec"
annee = "1892–1895"
image = "au-moulin-rouge.jpg"
technique = "Oil on canvas, 123 × 141 cm"
collection = "Art Institute of Chicago"
note = "An evening at the cabaret: friends around a table, La Goulue at the mirror, and Lautrec himself passing in the background."
description = """
A wooden railing cuts diagonally across the lower left corner and places us at the edge \
of the floor. Around a table laden with glasses, a group chats: men in hats, including the \
writer Édouard Dujardin with his yellow beard, a woman in a flowered hat, and, from \
behind, a dancer with a red chignon. In the background, two men cross the room: a very \
tall one in a top hat and, beside him, a small bearded man in a bowler hat, Lautrec \
himself with his cousin Gabriel Tapié de Céleyran. Farther back, La Goulue arranges her \
chignon in front of a mirror. At the right edge, cut by the frame, there looms the face of \
a woman lit from below by a greenish light, like a mask."""
evocation = """
This is not the frenzied festivity one expects of the Moulin Rouge: no one is dancing, \
the faces are weary, each seems alone among the others. Lautrec shows the underside of \
nocturnal pleasure, its fatigue and its melancholy, with a gaze at once complicit and \
unindulgent. By painting himself in the background, small and passing through, he sets \
himself up as a witness rather than an actor. The green face of the foreground, often \
identified as that of the English dancer May Milton, transforms the scene into an almost \
disquieting vision: under artificial light, skin becomes make-up and the face becomes a \
mask. It has been seen as an image of urban modernity, brilliant and disenchanted."""
histoire = """
The Moulin Rouge opened in 1889 at the foot of Montmartre, place Blanche, and Lautrec \
became a regular at once; his Circus Rider at the Cirque Fernando hung in the venue’s \
foyer. He painted this large canvas in the early 1890s. The painting was enlarged by an \
L-shaped strip, at right and bottom, the one where the green face appears. This strip \
was for a time detached, no doubt to make the work easier to sell, then put back in \
place. The canvas entered the Art Institute of Chicago in 1928, with the collection \
formed by Frederic Clay Bartlett in memory of his wife Helen, the same one who brought La \
Grande Jatte there."""
facture = """
Lautrec draws with the brush: long hatchings, nervous contours, surfaces sometimes barely \
covered. The colours are acidic, greens and oranges, those of the gas and electric \
lighting that models faces from below. The composition owes much to Degas and Japanese \
prints: the diagonal of the railing, the figures cut by the frame, the empty foreground \
that draws the viewer in. The framing, close to a photographic snapshot, gives the \
impression of a scene caught in passing."""
details = [
  "Lautrec in person, small and bearded, in the background, beside his very tall cousin.",
  "The green, powdered face of the woman cut by the right edge.",
  "La Goulue arranging her chignon in front of a mirror, in the background.",
  "The diagonal railing that bars the lower left corner.",
  "The red chignon of the woman seen from behind, at the centre of the table.",
]
themes = ["cabaret", "night", "Montmartre", "self-portrait", "artificial light"]
anecdote = """
Lautrec stood barely more than one metre fifty: two leg fractures, in his adolescence, \
had stopped their growth. He liked to appear with his cousin Gabriel, very tall, and this \
ill-matched duo amused Montmartre as it amuses here."""
salle = 4
mur = "est"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Moulin Rouge – La Goulue"
artiste = "Henri de Toulouse-Lautrec"
annee = "1891"
image = "moulin-rouge-la-goulue.jpg"
cadre = "estampe"
technique = "Colour lithograph (poster), 191 × 117 cm"
collection = "Metropolitan Museum of Art, New York"
note = "His first poster: the dancer in white petticoats, and Valentin le Désossé as a shadow in the foreground."
description = """
At the top, the cabaret’s name is repeated three times, in red letters that share one \
giant M; at right are announced Concert, Bal tous les soirs, La Goulue. At the centre, the \
dancer, blond chignon and red bodice with white polka dots, lifts her leg in a cloud of \
white petticoats. Behind her, the spectators are no more than a frieze of black \
silhouettes, top hats and plumes, beneath a row of yellow lamps. In the foreground, cut \
by the edge, stands the grey profile of her partner, Valentin le Désossé, top hat on his \
head and hand extended toward us. The floor runs off on a diagonal; at the bottom, in \
large letters, the masked ball of Wednesdays and Saturdays is announced."""
evocation = """
With this poster, Lautrec brings art into the street. He does not describe the cabaret: \
he gives its shock, its energy and its promise, that of the naturalist quadrille, the \
dance in which petticoats fly and reveal what is beneath. Everything is said in a few \
shapes: the luminous star at the centre, the anonymous crowd reduced to shadows, and \
Valentin, half real and half caricature, who serves as a foil. The influence of the \
shadow theatre of the Montmartre cabarets, like that of the Chat Noir, has been seen in \
it. The poster also speaks of a world in which spectacle becomes merchandise, and in \
which the artist agrees to work for advertising without giving up his style."""
histoire = """
The Moulin Rouge opened in October 1889; its director, Charles Zidler, commissioned a \
new poster from Lautrec in 1891, whereas the cabaret’s advertising had until then been \
entrusted to Jules Chéret, the master of the genre. Printed by Charles Lévy and pasted \
on the walls of Paris at the end of the year, it made Lautrec famous almost overnight. \
It is his very first poster; some thirty others would follow, for Aristide Bruant, Jane \
Avril or the Divan japonais. Its large dimensions required it to be printed in several \
sheets, whose horizontal joins can be seen. The copy shown here belongs to the \
Metropolitan Museum of Art."""
facture = """
Lautrec draws his forms directly on the lithographic stones, one for each colour. The \
flat areas are frank and few: the black of the silhouettes, the yellow of the lamps, the \
red of the letters, the grey of Valentin and the white of the paper that makes the \
petticoats. Japonisme is everywhere: simple contours, cropped framing, diagonal floor, \
absence of modelling. The lettering, drawn by hand, is part of the composition just as \
the figures are."""
details = [
  "The giant M that serves the three “Moulin Rouge” at the top.",
  "The grey profile of Valentin le Désossé, cut by the edge, in the foreground.",
  "The crowd reduced to a frieze of black silhouettes.",
  "The yellow globes of the lamps, lined up above the spectators.",
  "The signature “HLautrec”, at lower left.",
]
themes = ["poster", "cabaret", "dance", "Montmartre", "lithography"]
anecdote = """
In 1895, La Goulue left the Moulin Rouge to dance in a fairground booth. Lautrec painted \
two large panels for her to adorn the entrance; later cut into pieces by a dealer, they \
have been reassembled and are today in the Musée d’Orsay."""
salle = 4
mur = "sud"
place = 2
largeur = 1.17

[[oeuvres]]
titre = "The Talisman (The Aven at the Bois d’Amour)"
artiste = "Paul Sérusier"
annee = "1888"
image = "le-talisman.jpg"
technique = "Oil on wood, 27 × 21.5 cm"
collection = "Musée d’Orsay, Paris"
note = "A landscape the size of a cigar-box lid, painted at Gauguin’s dictation: the birth certificate of the Nabis."
description = """
The small panel shows a corner of the river Aven, at the Bois d’Amour, near Pont-Aven, \
but it takes a moment to recognize it. In the upper half, the trees are patches of \
yellow, green and violet; a broad orange-red band, the bank, crosses the painting \
obliquely, bristling with vertical blue-grey strokes that stand for the trunks. At right, \
a house with a blue roof can be made out. The lower half is the reflection of all this in \
the water: large patches of yellow, violet and green, a dark mass at right, a light blue \
area in the corner. No detail, no modelling: only surfaces of colour set side by side."""
evocation = """
This tiny landscape has the value of a revelation: colour no longer has to imitate \
nature, it must translate what one feels before it, even at the cost of exaggeration. \
Sérusier’s friends kept it as a magical object, hence its name, the Talisman. In 1890, \
Maurice Denis drew the lesson of this discovery in a now famous sentence: remember that \
a picture, before being a battle horse, a nude woman or some anecdote, is essentially a \
flat surface covered with colours assembled in a certain order. This panel is often seen \
as one of painting’s first steps toward abstraction, a quarter of a century before it \
truly arrived there."""
histoire = """
In October 1888, Paul Sérusier, a student at the Académie Julian in Paris, stayed in \
Pont-Aven, where Gauguin was leading a group of young painters. According to the account \
Maurice Denis would give, Gauguin took him to the Bois d’Amour and asked him how he saw \
the trees: if they looked yellow to him, he should put yellow, the most beautiful; if the \
shadow was blue, ultramarine; if the leaves were red, vermilion. Back in Paris, Sérusier \
showed the panel to his comrades, Denis, Bonnard, Ranson, Ibels: they formed the group of \
the Nabis. Long kept by Maurice Denis and his family, the Talisman entered the Musée \
d’Orsay in 1985."""
facture = """
Sérusier paints fast, on the wooden lid of a cigar box, in broad flat touches of almost \
pure colour. He eliminates perspective, shadows and details, and reduces each element to \
a patch whose colour is heightened. One recognizes the lesson of the Synthetism of \
Gauguin and Émile Bernard: simplify, paint from memory and according to emotion. The \
touch nevertheless remains visible and lively, and the wood shows here and there \
between the colours."""
details = [
  "The orange-red band of the bank, crossing the top of the panel obliquely.",
  "The tree trunks reduced to simple vertical blue-grey strokes.",
  "The house with a blue roof, at right, barely sketched.",
  "The reflections in the water, turned into large patches of yellow, violet and green.",
]
themes = ["landscape", "pure colour", "Brittany", "abstraction", "Nabis"]
anecdote = """
On the back of the panel, an inscription states that it was made in October 1888, under \
Gauguin’s direction, by Sérusier, at Pont-Aven: a sort of birth certificate for the \
painting that would give impetus to all Nabi painting."""
salle = 3
mur = "nord"
place = 1
largeur = 0.8

[[oeuvres]]
titre = "Madeleine in the Bois d’Amour"
artiste = "Émile Bernard"
annee = "1888"
image = "madeleine-bois-d-amour.jpg"
technique = "Oil on canvas, 138 × 163 cm"
collection = "Musée d’Orsay, Paris"
note = "His seventeen-year-old sister, lying in the woods of Pont-Aven, dreamy as a recumbent effigy."
description = """
A young girl with red hair is stretched at full length at the bottom of the canvas, on \
grass sprinkled with small white flowers. She wears a long blue-grey dress, has slipped \
one hand under her head and placed the other on her chest; her eyes open, she stares into \
space. Behind her rises a sparse wood: thin, dark, vertical trunks planted on a pink and \
mauve ground. Farther back, between the trees, the pale reflections of the river shine, \
and green foliage closes off the top of the painting. At lower left, the painter signed \
and dated his work."""
evocation = """
Madeleine Bernard, the painter’s younger sister, is a muse to him, and he depicts her as \
an ideal figure rather than as a real girl. Lying still, her gaze lost, she recalls a \
recumbent effigy carved on a medieval tomb, or a legendary heroine asleep in an enchanted \
wood. Bernard’s taste for spirituality and Symbolism has been read in it: the girl seems \
in communion with nature, absorbed in an inner dream. The very name of the place, the \
Bois d’Amour, adds a note of romance. The painting takes on a melancholy resonance when \
one knows that Madeleine would die very young, before the age of twenty-five."""
histoire = """
Émile Bernard arrived in Pont-Aven in August 1888, with his mother and Madeleine, then \
seventeen, and there met Paul Gauguin again. That summer, the two painters exchanged \
ideas intensely: Bernard painted his Breton Women in the Meadow, Gauguin his Vision after \
the Sermon, and what would be called Synthetism was born. Madeleine fascinated the small \
group of artists; she would later become engaged to the painter Charles Laval, a friend of \
Gauguin. The two of them left for Egypt, where Laval died in 1894 and Madeleine the \
following year, of tuberculosis. The painting belongs today to the Musée d’Orsay."""
facture = """
The composition sets the long horizontal of the body against the regular verticals of the \
trunks, like a musical staff. Bernard simplifies forms and lays colours in broad zones: \
the blue of the dress, the pink of the ground, the green of the grass and foliage. The \
touch, made of small parallel hatchings, remains visible, softer than the black-outlined \
flat areas of his Breton Women of the same year. The soft, slightly muted range \
reinforces the atmosphere of reverie."""
details = [
  "The hand slipped under the head, a gesture of reverie.",
  "The thin trunks that rhythm the background like bars.",
  "The pale reflections of the river, between the trees.",
  "The small white flowers scattered in the grass, in the foreground.",
]
themes = ["portrait", "reverie", "Brittany", "forest", "Symbolism"]
anecdote = """
The Bois d’Amour, where Madeleine posed that summer, is also the place where, a few weeks \
later, Sérusier painted the Talisman under Gauguin’s direction: the two works, shown here \
side by side, were born on the banks of the same river, the Aven."""
salle = 3
mur = "nord"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "Twilight (The Croquet Game)"
artiste = "Pierre Bonnard"
annee = "1892"
image = "partie-de-croquet.jpg"
technique = "Oil on canvas, 130.5 × 162.5 cm"
collection = "Musée d’Orsay, Paris"
note = "A family evening in the Dauphiné, transformed into a tapestry of patterns and silhouettes."
description = """
Evening falls on a garden. In the foreground, a mass of dark foliage fills the bottom of \
the painting. In the middle, a few croquet players stand motionless: at left, a man in a \
light jacket and straw hat; at the centre, a woman in a patterned pale green dress, \
leaning on her mallet, near a white dog; beside her, another woman, seen from behind, in \
a dress of large dark checks that merges with the shadow. At right, on the still-lit \
lawn, a ring of girls in light dresses dances in the golden light. At the top, beneath a \
curtain of leaves, the sunset sky blazes with orange clouds. The small hoop of the game \
is planted in the grass."""
evocation = """
Bonnard starts from an ordinary moment, a family game of croquet, and makes of it a \
dreamlike image. The players, in whom one usually recognizes the painter’s father and \
sister, seem frozen in the evening, while the luminous ring at right seems to come from \
another world, like a dance of nymphs or a childhood memory. It has been seen as the \
passage from day to night, from the real to the imaginary. The painting also speaks of \
the Nabis’ taste for intimate and family life, far from great subjects, and their wish to \
make painting a decorative surface, like a screen or a tapestry."""
histoire = """
Bonnard painted the canvas at Le Grand-Lemps, in the Isère, where his family owned a \
property and where he spent his summers. He was then twenty-five and had just given up a \
legal career: in 1891, his poster France-Champagne, plastered across Paris, had brought \
him notice, and he shared a studio on the rue Pigalle with Vuillard, Maurice Denis and \
the theatre man Lugné-Poe. A member of the Nabis group since 1889, he was seeking a new \
painting, nourished by the example of Gauguin and Japanese prints. This large painting is \
one of his first ambitious compositions. It is today in the Musée d’Orsay, which holds a \
rich ensemble of Nabi works."""
facture = """
Bonnard flattens space: no clear perspective, planes superimposed like theatre sets. \
Fabrics become patterns, the checks and flowers of the dresses are treated flat, in the \
manner of the Japanese prints he admired. The foliage forms scalloped arabesques. The \
contrasts of light, thick shadow at left and dazzling green at right, structure the \
canvas. The figures are silhouettes without modelling, almost cut out."""
details = [
  "The checked dress of the woman seen from behind, treated as a flat pattern.",
  "The ring of girls, at right, in the golden light.",
  "The small croquet hoop planted in the grass.",
  "The orange clouds of the sunset, at upper right.",
  "The signature and date, at upper left.",
]
themes = ["family", "garden", "twilight", "Japonisme", "Nabis"]
anecdote = """
His Nabi friends nicknamed him “the very Japanese Nabi”. In 1890, the great exhibition of \
Japanese prints at the École des Beaux-Arts had overwhelmed him: there he discovered that \
space can be suggested without perspective, with flat areas of colour and patterns."""
