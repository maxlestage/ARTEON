[[oeuvres]]
titre = "Summer Evening on Skagen's Beach"
artiste = "Peder Severin Krøyer"
annee = "1893"
image = "soiree-ete-skagen.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:P.S._Krøyer_-_Summer_evening_on_Skagen's_Beach._Anna_Ancher_and_Marie_Krøyer_walking_together._-_Google_Art_Project.jpg"
technique = "Oil on canvas, 100 × 150 cm"
collection = "Skagens Museum, Skagen (Denmark)"
note = "Anna Ancher and Marie Krøyer, the painter's wife, walk arm in arm along the water's edge at the blue hour of a summer evening."
description = """
Two women in long white dresses walk side by side along the shore, arm in arm, moving \
away from us. One, bareheaded, wears her hair in a dark bun; the other wears a yellow \
straw hat. They advance over the wet sand, beside a perfectly calm sea whose ripples \
leave a thin fringe of foam. The rest of the canvas is almost empty: to the right, the \
broad pale beach, where the sand keeps the imprint of footsteps; to the left, the \
milky-blue water that merges with the sky, with no clear horizon line. Far off on the \
right, a band of green dunes closes the view. The two walkers, small in the immensity, \
are placed in the left third of the painting, where the eye finds them at once."""
evocation = """
Krøyer paints the blue hour, that moment on Scandinavian summer evenings when the set \
sun leaves sea and sky bathed in the same cool, soft light, and which fascinated the \
Skagen painters. The two women are two artists and friends, the wives of two painters \
of the colony: Anna Ancher, born in Skagen, and Marie Krøyer. The painting celebrates \
their closeness, but it also has something melancholy about it: they turn their backs \
to us, and the landscape seems suspended outside time. It has often been reread in the \
light of what followed, the estrangement of the Krøyers and the painter's illness. It \
has become the very image of the Danish summer and of Skagen, reproduced endlessly."""
histoire = """
Krøyer discovered Skagen, a fishing village at the northern tip of Jutland, in 1882; \
he settled there with Marie in 1891. For this painting, he photographed Anna Ancher and \
Marie walking arm in arm at the water's edge at least twice, and painted several \
sketches of the motif, two of which are in the Hirschsprung Collection in Copenhagen. \
The large canvas was bought in 1895, at an exhibition in Munich, by a German opera \
singer; it then spent years in a mountain chalet in Austria and fell into oblivion. \
When it reappeared, in 1978, at an auction in Copenhagen, the German press publisher \
Axel Springer bought it. His widow gave it to the Skagen museum, which received it in \
1986, in gratitude for the Danes' rescue of the Danish Jews in 1943."""
facture = """
Krøyer, trained in Paris under Léon Bonnat, took from the Impressionists a taste for \
painting outdoors, but he kept a precise drawing style. The palette is reduced to \
blues, mauves and whites, warmed by a few yellow touches on the sand. The composition \
rests on the great diagonal of the shoreline, which starts at the lower left and runs \
towards the back on the right, and on the contrast between the two sharply drawn \
figures and the hazy space around them. The white dresses, which catch the last light, \
are the brightest point of the painting."""
details = [
  "The footprints in the sand, in the right foreground.",
  "The yellow straw hat, the only warm colour in the pair.",
  "The thin fringe of foam following the line of the shore.",
  "The signature, at lower left: S. Krøyer, Skagen, 93.",
]
themes = ["beach", "blue hour", "friendship", "summer", "skagen"]
anecdote = """
When the painting was restored in 2005, grains of sand were found caught in the paint \
across the whole surface of the canvas: proof that Krøyer had painted it, at least in \
part, on the beach itself."""
salle = 2
mur = "nord"
place = 1
largeur = 2.4

[[oeuvres]]
titre = "Breakfast under the Big Birch"
artiste = "Carl Larsson"
annee = "1896"
image = "petit-dejeuner-bouleau.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Breakfast_under_the_Big_Birch._From_A_Home_(26_watercolours)_(Carl_Larsson)_-_Nationalmuseum_-_24220.tif"
technique = "Watercolour on paper, 32 × 43 cm"
collection = "Nationalmuseum, Stockholm"
note = "The Larsson family has breakfast in the garden of their house at Sundborn: one of the watercolours that made all of Sweden dream."
description = """
In a summer garden, a long wooden table is laid out in the grass, in the shade of a big \
birch whose white trunk fills the whole left side of the image. Around it sits a large \
family: two boys in striped shirts and caps, seen from behind on the bench, little \
girls in red dresses and white bonnets, a small girl in a red hat who turns towards us, \
and, at the end of the table, the mother in a grey dress and a feathered hat. A big \
russet dog rests its head on the table among the diners. Behind, the wooden house \
painted red, with a green window box under the window, and a grey fence. At left, an \
orange chair has been left empty; a hen pecks in the grass, and two bottles lie at the \
foot of the tree."""
evocation = """
Larsson paints his own family, his wife Karin and their children, at the house of \
Lilla Hyttnäs, in Sundborn, in Dalarna. The scene speaks of the simple happiness of the \
Swedish summer: eating outdoors, the children, the animals, the light filtered by the \
leaves. The empty chair in the foreground is often understood as the painter's own, \
as he has risen to show us his loved ones. But this idyll is also a programme: a \
healthy life, without luxury or pretence, close to nature and craftsmanship. Larsson, \
who had known a very poor and unhappy childhood in Stockholm, builds in these images \
the happy home he never had. They have shaped the idea that the Swedes, and many \
others, have of the ideal home."""
histoire = """
In 1888, Karin's father, Adolf Bergöö, gave the young couple a small wooden house at \
Sundborn, near Falun. Carl and Karin transformed and decorated it themselves, mixing \
Swedish peasant tradition with the new taste for Art Nouveau. In the 1890s, Larsson \
devoted a series of watercolours to the house and family life, including this one, now \
in the Nationalmuseum in Stockholm. In 1899, the publisher Bonnier published \
twenty-four of them, in colour, in an album entitled Ett hem (A Home). The book was an \
immense success and had a lasting influence on the furnishing of Swedish interiors. A \
German anthology, Das Haus in der Sonne (The House in the Sun), then spread its images \
throughout Europe."""
facture = """
Larsson, an illustrator by trade, outlines each form with a fine, supple line of ink, \
then applies the watercolour in light, transparent tints. The flat areas of colour, \
the strong outline and the framing, with the trunk cut off at the left edge and the \
large, almost empty foreground of grass, recall the Japanese prints that artists of his \
generation collected. The grass is made of long, rapid, almost calligraphic strokes. \
The red of the dresses and the house answers the tender green of the foliage."""
details = [
  "Two hearts, entwined initials and a date carved in the bark of the birch.",
  "The russet dog resting its head on the table among the children.",
  "The two bottles lying in the grass at the foot of the tree.",
  "The white hen pecking beside the empty chair.",
  "The painter's monogram, C L, at bottom centre.",
]
themes = ["family", "garden", "summer", "meal", "home"]
anecdote = """
Carl and Karin Larsson had eight children, who are the models for almost all of these \
watercolours. Their house at Sundborn, now known as Carl Larsson-gården, still belongs \
to their descendants, who open it to visitors every summer."""
salle = 2
mur = "nord"
place = 4
largeur = 1.3

[[oeuvres]]
titre = "Interior in Strandgade, Sunlight on the Floor"
artiste = "Vilhelm Hammershøi"
annee = "1901"
image = "strandgade-soleil.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Stue_i_Strandgade_med_solskin_på_gulvet.jpg"
technique = "Oil on canvas, 46.5 × 52 cm"
collection = "SMK – National Gallery of Denmark, Copenhagen"
note = "The painter's sitting room in Copenhagen, his wife Ida seen from behind, and the sun tracing the window on the floor."
description = """
An almost empty room, with panelled walls of a very pale grey. At left, a woman in a \
black dress sits with her back to us on a chair, bent over a small half-moon mahogany \
table; we see only the nape of her neck and the dark mass of her dress. On the wall \
above her, two small frames. At the centre, a tall window with small panes, veiled by \
white muslin curtains drawn back at the sides, lets in the sun, which casts the \
luminous shape of the panes onto the grey floor. At right, a large white panelled door, \
closed, fills a whole section of the wall. No object tells a story, no sound seems \
possible: light is the only event in the painting."""
evocation = """
The woman seen from behind is Ida, the painter's wife, whom he often depicts in this \
way, absorbed in an activity we cannot see. This elusive figure gives the painting its \
mystery: the viewer is admitted into the room without being welcomed. These interiors \
have often been compared to those of Vermeer and the Dutch painters of the seventeenth \
century, with their silent women beside a window; but in Hammershøi there is no letter \
and no musical instrument, nothing but waiting. He said he loved old houses, old \
furniture and the very particular atmosphere surrounding them, for their own sake. The \
poet Rainer Maria Rilke, who visited him, saw in him a painter one cannot speak of \
quickly."""
histoire = """
From 1898 to about 1908, Hammershøi and Ida lived at 30 Strandgade, in an old house in \
the Christianshavn district of Copenhagen. The apartment was both his studio and his \
motif: there he painted some sixty interiors, slightly varying the position of a piece \
of furniture, a door or the light. These paintings are not faithful records: he removes \
handles, cuts off furniture, leaves areas empty. For a long time, part of the public \
and of the institutions remained baffled by this art; as early as 1888, the jury of the \
Charlottenborg exhibition had refused to show his work. This painting entered the \
national museum in Copenhagen in 1924, by bequest. It is today among the museum's most \
famous works."""
facture = """
Hammershøi paints in thin layers, with a soft touch that lets the grain of the canvas \
show. His palette is limited to black, white, greys and browns, but it is extremely \
subtle: when the painting was cleaned in 2012, the conservator counted more than forty \
different whites. The composition is made of verticals and rectangles (doors, window, \
frames, panelling) and of the large luminous patch on the floor. The figure, pushed to \
the left edge, alone balances the pale mass of the door."""
details = [
  "On the floor, the image of the window panes, distorted by perspective.",
  "The two small frames hanging on the wall above the woman.",
  "Ida's bent neck, the only visible part of her face.",
  "The discreet monogram V H, at lower right.",
]
themes = ["interior", "silence", "light", "solitude", "copenhagen"]
anecdote = """
Asked in 1907 about his rare, muted colours, Hammershøi replied that he did not know \
why he chose them: it came naturally to him, and he thought that a painting works all \
the better, as far as colour is concerned, the less of it it contains."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Girl in the Kitchen"
artiste = "Anna Ancher"
annee = "1883–1886"
image = "fille-cuisine.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Girl_in_the_Kitchen_(Anna_Ancher).jpg"
technique = "Oil on canvas, 87.7 × 68.5 cm"
collection = "The Hirschsprung Collection, Copenhagen"
note = "A maid seen from behind, before the window of a Skagen kitchen: the sun passes through the yellow curtain and sets the room ablaze."
description = """
A young woman stands with her back to us before the worktop of a small kitchen. She \
wears a bright red skirt and a dark green bodice; her hair is pulled into a bun. In \
front of her, a small-paned window is half hidden by a pale yellow curtain through \
which the sun shines, making it almost incandescent. On the worktop, bowls and cloths; \
on the shelf below, a yellow mortar and its pestle. At right, a brown wooden door \
stands wide open onto another room, which is also bright. In the left foreground, on a \
bench, cabbages, carrots and flatfish lie on a dish. The wide-planked floor stretches \
out to us. At lower right, the painter has signed and inscribed two dates."""
evocation = """
Anna Ancher paints an ordinary gesture, performed by a woman whose face we cannot see, \
and turns it into a moment of contemplation. The real subject is light: that which sets \
the curtain ablaze, that which enters through the door, and that which settles on the \
wall at left. One thinks of the maids of Vermeer and Pieter de Hooch, whom the Danish \
painters admired. But the scene belongs to the modest life of Skagen, where the \
painter grew up. In an artistic world dominated by men, Anna Ancher, wife and mother, \
chooses to paint the world of women and domestic work, with gravity and without \
anecdote. The painting is among the works that mark, in Denmark, the breakthrough of a \
truer painting, attentive to everyday life."""
histoire = """
As the two dates in the signature indicate, Anna Ancher worked on this painting for \
several years, between 1883 and 1886, in Skagen, where she lived with her husband, the \
painter Michael Ancher. A preparatory study for this composition is kept in the Skagen \
museum. The canvas was acquired in 1904 by the collection assembled by Heinrich \
Hirschsprung, a Copenhagen tobacco manufacturer, patron and friend of the Danish \
painters of his time, who had also supported Krøyer from his beginnings. Hirschsprung \
gave his collection to the Danish state; it became a museum, housed in a small \
building at the edge of the Østre Anlæg park in Copenhagen, where the painting is \
still on display."""
facture = """
The painting is built in backlight: the figure stands out as a dark silhouette against \
the window, and the light comes towards us. Anna Ancher renders the sunlit curtain \
with thick touches of yellow, orange and white, almost in relief. The red of the skirt, \
the only saturated colour, draws the eye to the centre. The whitewashed walls take on \
grey, pink or bluish tones depending on the light: the painter studies, as a colourist, \
the way natural light changes the colours of a room."""
details = [
  "The yellow curtain pierced by the sun, above the maid's head.",
  "The yellow mortar and its pestle, on the lower shelf.",
  "The cabbages, carrots and flatfish placed on the bench, at left.",
  "The signature at lower right, with two dates: 1883 and 1886.",
]
themes = ["interior", "work", "backlight", "kitchen", "skagen"]
anecdote = """
Anna Ancher is the only one of the Skagen painters to have been born there: she was the \
daughter of the owner of the Brøndum hotel, where the artists who came from Copenhagen \
stayed. It was there that she discovered painting, and her future husband."""
salle = 3
mur = "nord"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "Blue Interior"
artiste = "Harriet Backer"
annee = "1883"
image = "interieur-bleu.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Harriet_Backer_-_Blue_Interior_-_NG.M.02582_-_National_Museum_of_Art,_Architecture_and_Design.jpg"
technique = "Oil on canvas, 84 × 66 cm"
collection = "Nasjonalmuseet, Oslo"
note = "The painter Asta Nørregaard, a friend of the artist, in a Paris apartment bathed in blue light."
description = """
In a bourgeois sitting room, a young woman in a dark dress sits in a blue armchair, \
absorbed in what she holds in her hands. The light comes from the right, through a \
window partly hidden by a heavy midnight-blue curtain. At the back, against the wall, \
an orange-red secretaire, topped by a small framed picture showing a sailing boat on a \
blue sea. At left, a large gilt-framed mirror reflects pots of pink flowers. At right, \
a green plant with broad leaves stands in a pale cache-pot, near two chairs with blue \
cushions. On the parquet floor in the foreground, a cushion and a few coloured objects \
seem to have been left behind. Everything is bathed in the same bluish atmosphere."""
evocation = """
The title speaks of a blue interior, but, as the Oslo museum points out, the room is \
not blue in itself: it is the daylight, softened by the curtain, that tints the walls, \
the furniture and the shadows. Harriet Backer is less interested in her sitter than in \
the way light brings a place into being. The painting also shows a world of women \
artists: the model is Asta Nørregaard, a Norwegian painter who, like Backer, lived in \
Paris. Backer compared the patches of colour in a painting to the stars of a \
constellation, which must hold together in perfect harmony, like the notes of a piece \
of music."""
histoire = """
Harriet Backer settled in Paris in 1878; she studied there with Léon Bonnat and \
Jean-Léon Gérôme, and discovered open-air painting and Impressionism. She then \
abandoned historical subjects for scenes of contemporary life: Blue Interior, painted \
in her friend's Paris apartment, is one of the earliest examples. The painting was \
exhibited the same year in Copenhagen and at the autumn exhibition in Kristiania, \
today's Oslo, where it was well received. It entered the collections of the National \
Gallery in Oslo, today the Nasjonalmuseet, in 1964. In 1982–1983, it travelled to the \
United States, to Washington, New York and Minneapolis, in the exhibition Northern \
Light, which introduced American audiences to Nordic painting."""
facture = """
Backer works slowly, in free, distinct touches, seeking the right harmony of each \
colour with its neighbours. Blue dominates, from the almost black curtain to the pale \
reflections on the ceiling, but it is enlivened by the red of the secretaire, the green \
of the plant and the gold of the mirror. She studies the contrast between the cold \
light coming from the window and the shadow of the room, and suggests depth through \
colour alone, without heavy drawing."""
details = [
  "The large gilt mirror, at left, in which pink flowers are reflected.",
  "The small picture of a sailing boat, hung above the red secretaire.",
  "The coloured objects resting on a cushion, on the parquet floor.",
  "The midnight-blue curtain that closes the painting on the right.",
]
themes = ["interior", "blue", "light", "women", "paris"]
anecdote = """
Harriet Backer, who worked very slowly, left only about one hundred and eighty \
paintings. From 1889 to 1912, she ran a painting school in Kristiania, where the young \
Nikolai Astrup, also present in this exhibition, studied among others."""
salle = 3
mur = "sud"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "Midsummer Dance"
artiste = "Anders Zorn"
annee = "1897"
image = "danse-saint-jean.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Midsummer_Dance_(Anders_Zorn)_-_Nationalmuseum_-_18607.tif"
technique = "Oil on canvas, 140 × 98 cm"
collection = "Nationalmuseum, Stockholm"
note = "In a village in Dalarna, couples dance all through Midsummer night, in the light that never fades."
description = """
In the grassy yard of a farm, couples are dancing. In the foreground, a young woman in \
a black skirt, white bodice with red straps and a white headscarf spins in the arms of \
a man in a black hat; their faces are almost hidden, everything is in the movement. \
Behind them, other couples and onlookers crowd together in half-darkness. At left, a \
grey log barn whose open door reveals more figures; at the back, a red-painted house \
with white windows, whose gable catches the light. At right, the Midsummer pole, \
decorated with wreaths, rises into a pale sky and bears the Swedish flag at its top. \
The ground is trampled, the skirts whirl."""
evocation = """
Midsummer, or Midsommar, is in Sweden the great festival of light: the shortest night \
of the year, when the day does not end. Zorn, who had grown up in Mora, saw in it the \
survival of a very ancient cult of nature, more pagan than Christian. As the \
Nationalmuseum points out, he does not place the pole at the centre: what he paints is \
the very experience of dancing, the scents of the summer night and the light. The \
painting is also a manifesto: in Dalarna, a religious revival movement had driven back \
popular festivities and music, and Zorn, rich and famous, set about defending them. \
The first ray of dawn, on the red gable, announces that the dance has lasted all \
night."""
histoire = """
In 1896, after years spent abroad, mainly in Paris, Zorn settled with his wife Emma in \
Mora, his native village. According to his notes, that year he visited the neighbouring \
village of Morkarlby with Prince Eugen of Sweden, himself a painter; Zorn brought in a \
fiddler, the dance began in a yard, and the prince, enthusiastic, urged him to paint \
the scene. Zorn painted it the following year, in June and part of July 1897, after \
sunset. The painting was given to the Nationalmuseum in 1903 by the Royal Academy of \
Fine Arts. Another version exists, painted at about the same time, in the Pushkin \
Museum in Moscow, as well as a smaller replica commissioned in 1903 by an American \
collector."""
facture = """
Zorn paints fast, with broad brushstrokes loaded with paint, which leave the forms \
blurred as if they were still moving. The whites of the bodices and headscarves catch \
the diffuse light of the bright night; the black of the skirts and hats gives the \
painting its structure. The large vertical format and the couple placed very close to \
us, cut off by the bottom of the frame, draw the viewer into the round. The very \
particular light was observed on the spot, at night, over several weeks."""
details = [
  "The Swedish flag at the top of the pole, at right.",
  "The gable of the red house, lit by the first light of morning.",
  "The open door of the barn, where onlookers stand.",
  "The red straps of the dancer's traditional costume.",
]
themes = ["dance", "midsummer", "bright night", "festival", "dalarna"]
anecdote = """
To keep the tradition alive, Zorn gave the village of Morkarlby a Midsummer pole, \
repainted red every year. He wrote that he considered it a sacred duty to be present to \
dress it in foliage, before it was raised at midnight."""
salle = 4
mur = "est"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Midsummer Bonfire"
artiste = "Nikolai Astrup"
annee = "1912 and 1926"
image = "feux-saint-jean.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Nikolai_Astrup_-_Bonfire_celebrating_Midsummer_Night_-_NG.M.03609_-_National_Museum_of_Art,_Architecture_and_Design.jpg"
technique = "Oil on paper mounted on fibreboard, 89 × 105 cm"
collection = "Nasjonalmuseet, Oslo"
note = "The great Midsummer bonfire on the shore of Lake Jølster, in western Norway, amid the mountains."
description = """
In the middle of a deep valley, an immense bonfire rises on a grassy mound. Its yellow \
and orange flames twist into curls, like the tongues or crests of fantastic animals, \
and an enormous column of grey smoke climbs to the top of the painting, where it \
spreads into clouds. In front of the blaze, a dark silhouette stands out, alone. \
Farther off, on the slope at right, a crowd of small figures stands in groups. All \
around, tall dark-green mountains close the horizon; their summits still carry snow, \
and a white waterfall descends on the right. Below, the water of the lake can be \
glimpsed. At lower left, a second, smaller fire smokes in the grass."""
evocation = """
On Midsummer night in Norway, bonfires are lit and people gather to play, dance and \
pick flowers. For Astrup, attached to the idea of a communion between humans and \
nature, these rites recalled the magical forces of nature: according to the Oslo \
museum, the fires, the dancing and the flowers served both to protect and to ward off \
evil. The painting contrasts the solitary figure, facing the fire, with the crowd \
chatting and flirting on the slope. The flames take on an almost animal life. The \
mixture of realism in the landscape and Romantic reverie in the fire is, according to \
the same museum, characteristic of his art."""
histoire = """
After his studies, Astrup returned in 1902 to the Jølster valley, where he had grown \
up at the Ålhus parsonage; in 1913, he settled with his family at Sandalstrand, on \
the south shore of Lake Jølstravatnet. He kept returning to his favourite motifs, in \
painting as in colour woodcuts: he painted several versions of the Midsummer bonfire \
at Sandalstrand. This one was begun in 1912 and taken up again in 1926, two years \
before his death. The Nasjonalmuseet in Oslo bought it in 1984. In 2015, it was shown \
in Oslo and Helsinki in the exhibition Magic North, devoted to Finnish and Norwegian \
art around 1900."""
facture = """
Astrup paints here in oil on paper, later mounted on a panel. He outlines the forms, \
simplifies the mountains into great dark masses and reserves the most vivid colours for \
the fire, whose flames are stylised into decorative arabesques. The paint is thick, \
worked in successive layers, for he reworked his paintings over years. The contrast \
between the deep greens of the bright night and the orange of the blaze makes the \
flame a source of light that radiates across the whole painting."""
details = [
  "The solitary black silhouette standing before the blaze.",
  "The flames curling into hooks, like dragons' heads.",
  "The white waterfall on the right-hand slope.",
  "The small fire smoking at lower left, set apart.",
]
themes = ["midsummer", "fire", "mountain", "festival", "norway"]
anecdote = """
A pastor's son, Astrup suffered from asthma and frail health. He died of pneumonia in \
1928, at the age of forty-seven. His farm at Sandalstrand, where he lived with his \
wife Engel and their eight children, is today known as Astruptunet."""
salle = 4
mur = "nord"
place = 2
largeur = 1.15

[[oeuvres]]
titre = "Riddarfjärden in Stockholm"
artiste = "Eugène Jansson"
annee = "1898"
image = "riddarfjarden.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Riddarfjärden,_Stockholm_(Eugène_Jansson)_-_Nationalmuseum_-_18703.tif"
technique = "Oil on canvas, 150 × 135 cm"
collection = "Nationalmuseum, Stockholm"
note = "Stockholm by night, seen from the heights of Södermalm: the bay of Riddarfjärden and the city lights, all in blue."
description = """
The view plunges from a height onto a vast expanse of night water, deep blue, which \
occupies almost the whole painting. In the distance, the city is only a dark band \
dotted with lights, whose reflections descend into the water in long vertical streaks. \
A few pointed steeples stand out against a thin band of glowing sky, the last remnant \
of dusk or the first sign of dawn. Above, the sky is a swirl of blue-grey strokes. In \
the foreground, below, a dark shore runs along the water; the street lamps form great \
spirals of white light, like galaxies. At far left, the silhouette of a building, with \
its roof and chimney, stands out against this halo. At lower right, the signature and \
the date."""
evocation = """
Jansson paints the city he sees from his home, but he makes of it an almost cosmic \
vision: the water becomes an abyss, the lamps become stars. The blue, which invades \
everything, speaks of the melancholy of Stockholm nights, their silence and their \
beauty. His contemporaries nicknamed him the “blue painter”. Historians stress the \
influence of Edvard Munch in these nocturnes, and compare the spirals of light with \
those of Van Gogh. Jansson, a committed socialist from a modest background, also shows \
a modern city, lit by its street lamps, quays and boats, where human activity can only \
be guessed at through light."""
histoire = """
For lack of money, Jansson did not make, like most painters of his generation, the \
study trip to Paris; he left the Nordic countries only in 1900. After his father's \
death, in 1891, he moved with his mother and brother to Södermalm, the working-class \
district of southern Stockholm, to an apartment on Bastugatan perched on the heights, \
with a view over the bay of Riddarfjärden and the old town. Until about 1904, most of \
his paintings are night views taken from his window or the neighbouring streets. In \
1898, the year of this painting, the banker and collector Ernest Thiel visited his \
studio and bought three canvases from him: it was the beginning of recognition."""
facture = """
The painting is almost monochrome: blues, black, a few whites and a single red note on \
the horizon. Jansson leaves his brushstrokes clearly visible, in long parallel strokes \
in the water and crossed curves in the sky, so that the whole surface vibrates. The \
reflections of the lights are laid down in vertical dashes, the halos of the street \
lamps in thick spirals. The composition is very simple, in horizontal bands, which \
gives the immensity of the water its full force, and anticipates the abstraction \
towards which his nocturnes tend."""
details = [
  "The reflections of the city lights, in long vertical streaks on the water.",
  "The steeples standing out against the thin band of red sky.",
  "The luminous spirals of the street lamps, on the shore in the foreground.",
  "The silhouette of a roof and chimney, at left, above the halo.",
]
themes = ["night", "city", "blue", "stockholm", "water"]
anecdote = """
His painter friends also called him “Jansson-kerosene”, because his blue paintings \
reminded them of the warm light of paraffin lamps, according to the Nationalmuseum."""
salle = 4
mur = "sud"
place = 2
largeur = 1.35

[[oeuvres]]
titre = "Lemminkäinen's Mother"
artiste = "Akseli Gallen-Kallela"
annee = "1897"
image = "mere-lemminkainen.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Akseli_Gallen-Kallela_-_Lemminkäisen_äiti_-_A_I_640_-_Finnish_National_Gallery.jpg"
technique = "Tempera on canvas, 85.5 × 108.5 cm"
collection = "Ateneum, Finnish National Gallery, Helsinki"
note = "On the bank of the river of the dead, a mother keeps watch over the body of her son, whom she has fished out and sewn back together, and implores the heavens: a scene from the Kalevala."
description = """
On a pebble shore, beside a black river, an elderly woman sits, wearing a white \
headscarf, one hand laid on the naked body of a young man lying on a white sheet. His \
eyes are closed and his face is turned towards the ground, his blond hair spread on \
the linen. She raises towards the sky a gaze full of anguish and expectation. At the \
top, at the centre, fine, wavy golden rays descend from the sky. Behind them, at the \
water's edge, a row of red stones, as if stained with blood; at upper left, on the dark \
river, a swan swims. In the foreground, among the pebbles, lie skulls and bones, and \
strange pale flowers grow."""
evocation = """
The Kalevala, the Finnish national epic compiled in the nineteenth century by Elias \
Lönnrot, tells that the hero Lemminkäinen was killed while trying to shoot the swan of \
Tuonela, the kingdom of the dead, and that his body was thrown in pieces into the \
river. His mother raked it out of the water, sewed the limbs back together, and waits \
for the bee that is to bring her honey from the dwellings of Ukko, the god of the sky, \
to bring him back to life. The painter composes a pagan pietà. For him, the heart of \
the painting was maternal love. Painted two years after the death of his eldest \
daughter, carried off by diphtheria, it is among the works in which his art has been \
seen to grow darker and more intense."""
histoire = """
Gallen-Kallela painted this picture in 1897, over about a year, at Kalela, the studio \
he had had built deep in the forest, on the shore of Lake Ruovesi. These were the years \
of his great Kalevala scenes, such as The Defence of the Sampo, at a time when Finland, \
a grand duchy of the Russian Empire, sought to assert its culture in the face of \
Russification. The painting entered the collections of the Ateneum as early as 1898, \
as part of the Antell collection, financed by a private bequest intended for Finnish \
art. It has not left the museum since, and is one of its emblematic works. A gouache \
version, long disputed, is kept at the Serlachius Museum in Mänttä."""
facture = """
Gallen-Kallela chooses tempera, more matte and muted than oil, which gives the colours \
the look of an ancient fresco. Since the early 1890s, he had abandoned the naturalism \
learned in Paris for a synthetic style inspired by Symbolism: drawn outlines, large \
areas of colour, frieze-like composition. The black background of the river brings out \
the white of the sheet and the pallor of the body. The pebbles in the foreground are \
painted one by one, with an almost obsessive precision."""
details = [
  "The swan of Tuonela, swimming on the black river, at upper left.",
  "The wavy golden rays descending from the sky, at the centre.",
  "The row of red stones, as if bloodied, along the water.",
  "The skulls and bones among the pebbles, in the foreground.",
  "The pale, stiff flowers, flowers of the land of the dead.",
]
themes = ["kalevala", "mother", "death", "myth", "finland"]
anecdote = """
According to a tradition reported in Finland, the painter had his own mother pose and, \
to obtain a genuine expression of despair on her face, told her sad and terrible \
stories during the sittings."""
salle = 5
mur = "ouest"
place = 2
largeur = 1.35

[[oeuvres]]
titre = "The Convalescent"
artiste = "Helene Schjerfbeck"
annee = "1888"
image = "convalescente.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Helene_Schjerfbeck_-_The_Convalescent.jpg"
technique = "Oil on canvas, 92 × 107 cm"
collection = "Ateneum, Finnish National Gallery, Helsinki"
note = "A little girl recovering from illness, propped in a wicker armchair, gazes at a budding branch: the return of life."
description = """
A little girl with tousled red hair sits in a large wicker armchair, propped against \
big white pillows and wrapped in a pale sheet or blanket that falls to the floor. She \
wears a dark bodice. Leaning forward towards a dark wooden table, she delicately holds \
a twig with tiny leaves, planted in a small blue and white cup. She looks at it with \
intense attention. On the table, books, a carafe and glass objects catch the light. \
Behind her, a window lights the scene from the left, and another light seems to come \
from the right. The dark back of the room is made of panelling. At lower left, the \
signature and the date."""
evocation = """
The sick child was a common subject in the painting of the 1880s, often treated \
pathetically. Schjerfbeck makes of it a painting of recovery: the budding twig, in \
spring, answers the life returning to the child's body, and the light flooding the \
whites speaks of returning strength. It has also been seen as a kind of symbolic \
self-portrait: the painter, lame since a fall in childhood, had just had her \
engagement to a Swedish painter broken off, partly because of her health. The girl's \
concentrated gaze, wholly turned towards this small miracle, gives the painting an \
emotion free of sentimentality."""
histoire = """
Schjerfbeck painted this picture at St Ives, in Cornwall, where a colony of artists \
from all over Europe had formed; she stayed there in 1887–1888. The model, whose name \
is unknown, was apparently a girl of about six, very lively, whom her governess \
willingly let pose for painters. The painting was exhibited at the Paris Salon of 1888 \
under the title First Greenery, then brought back to Finland, where the Finnish Art \
Society bought it the same year. Some critics found it too French at the time, others \
praised its freedom. The following year, at the Paris Exposition Universelle of 1889, \
it received a bronze medal. It is today one of the best-loved paintings in the \
Ateneum."""
facture = """
The touch is lively and free, particularly in the whites of the pillows and the sheet, \
made of grey, bluish and golden shades. Schjerfbeck, trained in Paris, shows here what \
she retained of open-air painting and Impressionism: light coming from two sides, \
reflections on glass, dissolving outlines. The weave of the wicker armchair is rendered \
with virtuosity. It is her last great painting in the realist spirit of the 1880s: she \
would afterwards simplify forms and colours more and more."""
details = [
  "The twig with its tiny leaves, in the blue and white cup.",
  "The girl's hair, lit from behind.",
  "The weave of the wicker armchair, at left.",
  "The signature H. Schjerfbeck and the date, at lower left.",
]
themes = ["childhood", "recovery", "spring", "light", "interior"]
anecdote = """
In 2006, the Ateneum asked the public to elect the painting of the Finnish nation. The \
Convalescent came second, just behind Simberg's The Wounded Angel, hung in this very \
room."""
salle = 5
mur = "est"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "The Wounded Angel"
artiste = "Hugo Simberg"
annee = "1903"
image = "ange-blesse.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hugo_Simberg_-_The_Wounded_Angel_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 127 × 154 cm"
collection = "Ateneum, Finnish National Gallery, Helsinki"
note = "Two solemn boys carry on a stretcher a blindfolded angel with an injured wing: Finland's best-loved painting."
description = """
Two boys walk from left to right along a dirt path, carrying between them a stretcher \
made of two poles. On it sits a young angel girl, in a white dress, with large white \
wings; a white bandage is wrapped around her head at eye level, and her left wing is \
stained with blood. Head bowed, barefoot, she clutches a small bunch of snowdrops. The \
boy on the left, all in black with a hat, looks at the ground; the one on the right, in \
a brown jacket, turns towards us a dark and serious gaze. The landscape is desolate: \
brown earth, a few dry bushes, small white flowers, then a bay with grey water and, in \
the distance, a low shore under a pale sky."""
evocation = """
Simberg always refused to explain this painting: he wanted it to awaken in everyone an \
emotion, whatever it might be. It is known, however, that he painted it after a \
serious illness, in 1902–1903, whose recovery he had experienced as a miracle, a \
rebirth; the wounded angel has often been read as an image of his own fragility. It has \
also been seen as the vulnerability of innocence and ideals, carried by children too \
solemn for their age. The snowdrops herald recovery and spring. The boy who looks at \
us takes us as a witness, as if to say that this scene concerns us all. The procession \
seems to be heading towards the charitable institutions that then bordered this park, \
including a school for blind girls."""
histoire = """
Simberg had been working on this subject since his return from Italy in 1898. His \
sketches and the photographs he took to prepare the painting show variants: the angel \
carried in a wheelbarrow, or borne by little devils. The landscape, however, does not \
change: it is Eläintarha park in Helsinki, on the edge of the bay of Töölönlahti, a \
popular place for walks. Presented at the Ateneum's autumn exhibition in 1903, the \
painting thrilled the painters, starting with Gallen-Kallela, as Simberg tells his \
sister in a letter; it earned him a state prize. In 1905–1906, Simberg painted a large \
fresco version in St John's Church in Tampere, today the cathedral. In 2006, the \
Ateneum's public elected it the national painting of Finland."""
facture = """
Simberg paints in a deliberately simple, almost naïve style, which recalls folk art \
and manuscript illumination. The figures are outlined, placed in profile as in a \
frieze, against a landscape background treated in broad horizontal bands. The palette \
is muted and earthy, browns, greys, ochres, from which stand out the luminous white of \
the angel and the black of the clothing. There are almost no shadows: Symbolism here \
works through the clarity of the drawing rather than through effects."""
details = [
  "The small spot of blood on the angel's left wing.",
  "The bunch of snowdrops the angel clutches in her hand.",
  "The angel's bare feet, hanging above the path.",
  "The gaze of the boy on the right, turned towards the viewer.",
  "The low shore of the bay of Töölönlahti, on the horizon.",
]
themes = ["angel", "childhood", "symbolism", "recovery", "mystery"]
anecdote = """
Simberg did not even give his painting a title: in the catalogue of the 1903 \
exhibition, he wrote only a dash in place of the name. The title The Wounded Angel \
took hold afterwards."""
salle = 5
mur = "nord"
place = 2
largeur = 1.6

[[artistes]]
nom = "Peder Severin Krøyer"
vie = "Stavanger (Norway), 23 July 1851 – Skagen (Denmark), 21 November 1909"
biographie = """
Born in Norway to a mother judged unable to raise him, Peder Severin Krøyer grew up in \
Copenhagen with his aunt and uncle, the zoologist Henrik Krøyer. Gifted from an early \
age, he entered the Royal Academy of Fine Arts at twelve. From 1874, the tobacco \
manufacturer Heinrich Hirschsprung bought his first works and became his patron and \
friend. From 1877 to 1881, he travelled in Europe, studied in Paris under Léon Bonnat \
and discovered the Impressionists. In 1882, he spent his first summer in Skagen, a \
fishing village at the northern tip of Denmark, where an artists' colony had formed \
around Michael and Anna Ancher. There he painted the fishermen, then the artists' \
festivities and evenings. In 1889, he married Marie Triepcke, also a painter, who \
became his favourite model; they settled in Skagen in 1891 and had a daughter, Vibeke. \
But Krøyer's health deteriorated: he made several stays in a psychiatric hospital, and \
the couple separated, before divorcing in 1905. His sight declined until blindness; he \
nevertheless painted almost to the end. He died in Skagen in 1909. His paintings are \
today among the most valuable in Danish painting."""
style = """
A brilliant portraitist and painter of large group compositions, Krøyer combines a \
precise drawing style, learned at the Academy and with Bonnat, with the clarity of \
Impressionist open-air painting. He is the painter of the light of Skagen: midday sun \
on the fishermen, then, from the 1890s, the blue hours of summer evenings, when sea \
and sky merge. He made of Skagen a myth of Danish art."""

[[artistes]]
nom = "Carl Larsson"
vie = "Stockholm, 28 May 1853 – Falun, 22 January 1919"
biographie = """
Carl Larsson was born in the old town of Stockholm into a very poor family; his father \
was violent, and his mother, a laundress, supported the family. At thirteen, a \
schoolteacher encouraged him to enter the Royal Academy of Fine Arts, where he \
gradually made his mark. He first earned his living as a newspaper draughtsman and \
illustrator. In 1877, he left for Paris, where he went through difficult years. In \
1882, he joined the Scandinavian artists' colony at Grez-sur-Loing, near Fontainebleau: \
there he met the painter Karin Bergöö, whom he married in 1883, and there he took up \
watercolour. Back in Sweden, he taught in Gothenburg, then settled with Karin at Lilla \
Hyttnäs, the house at Sundborn that Karin's father had given them in 1888. Their eight \
children became his models, and the illustrated albums of the house, beginning with \
Ett hem in 1899, made him famous throughout Europe. He also painted large decorative \
schemes, notably for the Nationalmuseum; the last, Midvinterblot, completed in 1915, \
was at first rejected. At the end of his life he suffered from depression and died in \
1919, shortly after a stroke."""
style = """
Larsson is the painter of domestic happiness: luminous watercolours, with an \
illustrator's line, in which family life, festivities and the interiors of Sundborn are \
described with humour and tenderness. His images, inspired by Japanese prints and the \
Arts and Crafts movement, helped define a clear, simple and colourful Swedish style, \
which still influences home decoration."""

[[artistes]]
nom = "Vilhelm Hammershøi"
vie = "Copenhagen, 15 May 1864 – Copenhagen, 13 February 1916"
biographie = """
The son of a Copenhagen merchant, Vilhelm Hammershøi learned drawing from the age of \
eight, then studied at the Royal Danish Academy of Fine Arts. From 1883 to 1885, he \
also attended the teaching of Peder Severin Krøyer at a free school. He made his debut \
at the Charlottenborg Salon in 1885 with the portrait of his sister Anna, but his art \
quickly unsettled the institutions: in 1888, the Charlottenborg jury refused to show \
his work. In 1891 he married Ida Ilsted, sister of his friend the painter Peter \
Ilsted; she became the figure, often seen from behind, of his interiors. Hammershøi \
lived almost always in Copenhagen, in old apartments he chose with care, notably at \
30 and then 25 Strandgade. He nevertheless travelled in Europe and was particularly \
fond of London, whose mists and British Museum he painted. Discreet and taciturn, he \
was admired by artists and writers such as Rainer Maria Rilke. He died of cancer in \
1916. Long forgotten, he was rediscovered at the end of the twentieth century, with \
retrospectives in Paris, New York and London."""
style = """
Hammershøi almost always paints the same subjects: rooms empty or inhabited by a \
single figure, façades without passers-by, deserted landscapes. His palette of greys, \
whites and browns, his geometric compositions and his soft light create an atmosphere \
of silence and strangeness. He has been compared to Vermeer and Whistler; he is today \
one of the best-known Danish painters in the world."""

[[artistes]]
nom = "Anna Ancher"
vie = "Skagen (Denmark), 18 August 1859 – Skagen, 15 April 1935"
biographie = """
Anna Brøndum was born in Skagen, at the northern tip of Jutland, where her father ran \
the Brøndum hotel. The painters staying there introduced her to their art very early. \
She then studied drawing for three years in Copenhagen, at the school of the landscape \
painter Vilhelm Kyhn, and later in Paris, in the studio of Pierre Puvis de Chavannes. \
In 1880, she married the painter Michael Ancher, who had come to Skagen; they had a \
daughter, Helga. At a time when a married woman was expected to give up her profession, \
she continued to paint all her life. She is the only one of the Skagen painters to have \
been born there, and she paints the people she knows: fishermen, old women, maids, \
children, and the rooms of her own house. Her paintings represented Danish art abroad, \
notably at the Chicago World's Fair in 1893. She received the Ingenio et Arti medal in \
1913. She died in Skagen in 1935. The Anchers' house, bequeathed by their daughter, \
became a museum, and the couple appeared on the Danish thousand-krone banknotes issued \
in 2004."""
style = """
Anna Ancher is a colourist attentive to natural light: sun entering a room, reflections \
on a wall, backlight behind a curtain. She paints the daily life of the women and the \
humble people of Skagen with gravity and without picturesqueness, in the spirit of the \
“modern breakthrough” of Nordic art. She is considered one of the greatest Danish \
artists."""

[[artistes]]
nom = "Harriet Backer"
vie = "Holmestrand (Norway), 21 January 1845 – Oslo, 25 March 1932"
biographie = """
Harriet Backer was born into a well-off family of shipowners in Holmestrand, in \
southern Norway; the family moved to Christiania, today's Oslo, in 1856. She took \
drawing lessons from the age of twelve, then studied with several Norwegian masters. \
She also accompanied her sister, the pianist and composer Agathe Backer Grøndahl, on \
her European tours. From 1874 to 1878, she worked in Munich with the painter Eilif \
Peterssen, then settled in Paris, where she studied with Léon Bonnat and Jean-Léon \
Gérôme and shared a studio with her friend Kitty Kielland. There she discovered \
open-air painting and moved on to subjects from contemporary life. In 1889, she \
received a silver medal at the Exposition Universelle. Having returned to Norway in \
1888, she ran from 1889 to 1912 a painting school that trained a generation of \
artists, including Nikolai Astrup. She painted slowly, completed only about one hundred \
and eighty paintings, and received the highest honours of her country. She died in \
Oslo in 1932."""
style = """
Harriet Backer is the great Norwegian painter of interiors: bourgeois sitting rooms, \
peasant rooms, country churches. Trained in realism, she departs from it through a free \
touch and a very advanced pursuit of colour, which she builds patch by patch, like a \
musical chord. A pioneer among the women artists of her time, she left a lasting mark \
on Norwegian art."""

[[artistes]]
nom = "Anders Zorn"
vie = "Mora (Sweden), 18 February 1860 – Mora, 22 August 1920"
biographie = """
Anders Zorn grew up on his grandparents' farm near Mora, in Dalarna. From 1875 to \
1880, he studied at the Royal Academy of Fine Arts in Stockholm, where his talent \
astonished his teachers; commissions soon followed. In 1885, he married Emma Lamm, \
from a wealthy Jewish merchant family of Stockholm, cultured and passionate about art, \
who supported him throughout his life. He travelled widely, to London, Spain, Italy \
and the United States, and lived for a long time in Paris, where he became friends with \
the Finnish painter Albert Edelfelt. At twenty-nine, he was made a Knight of the Legion \
of Honour at the Exposition Universelle of 1889. A sought-after portraitist, he \
painted King Oscar II and three American presidents, including Theodore Roosevelt. In \
1896, he returned to settle in Mora, in the house he enlarged, Zorngården; there he \
painted peasant life and bathers, and worked to preserve folk music and old wooden \
houses. A renowned etcher, he was also a sculptor. He died in Mora in 1920; with Emma, \
he bequeathed his property to the Swedish state."""
style = """
Zorn is a virtuoso of the brushstroke: a few broad, rapid strokes are enough for him to \
render a face, a fabric or a reflection on water. He excels in society portraits as \
well as in scenes of peasant life in Dalarna and open-air nudes. His etchings, made of \
free hatching, are among the most admired of his time."""

[[artistes]]
nom = "Nikolai Astrup"
vie = "Kalvåg (Norway), 30 August 1880 – Førde (Norway), 21 January 1928"
biographie = """
Nikolai Astrup was born on the west coast of Norway and grew up in Jølster, at the \
Ålhus parsonage, where his father was pastor; he was the eldest of eleven children. \
His father wanted to make him a pastor and sent him to the cathedral school in \
Trondheim, but the boy preferred drawing. In 1899, he left for Kristiania, today's \
Oslo, and soon entered Harriet Backer's painting school, where he studied until 1901. \
He then stayed in Paris, where he attended the Académie Colarossi, and travelled in \
Germany. From 1902, he returned to live in Jølster, which he would hardly leave again. \
In 1907, he married Engel Sunde, with whom he had eight children; in 1913, the family \
settled at Sandalstrand, on the shore of Lake Jølstravatnet, where he cultivated his \
garden and tirelessly painted the same landscapes. He exhibited in Kristiania and \
Bergen, and became one of the most original artists of his generation. Asthmatic and \
of frail health, he died of pneumonia in 1928, at the age of forty-seven."""
style = """
Astrup paints and engraves the landscapes and customs of Jølster in intense colours and \
simplified, strongly outlined forms. A neo-Romantic, he mixes precise observation of \
nature with an almost magical reverie. His colour woodcuts, which he reworked by hand, \
are highly inventive. He has often been compared to Munch, with paintings that are \
brighter and more serene."""

[[artistes]]
nom = "Eugène Jansson"
vie = "Stockholm, 18 March 1862 – Nacka (Sweden), 15 June 1915"
biographie = """
Eugène Jansson was born in Stockholm into a modest family passionate about music and \
art. A scarlet fever contracted at fourteen left him with fragile health, poor eyesight \
and poor hearing. He studied at the Tekniska skolan, under the painter Edvard Perséus, \
then at the Royal Academy of Fine Arts, but could not afford to go to Paris. A \
socialist, he took part in the “Opponents” movement, which challenged the Academy. \
After his father's death in 1891, he lived with his mother and his brother Adrian in \
Södermalm, on the heights overlooking the bay of Riddarfjärden. From it he drew, until \
about 1904, a long series of blue nocturnes. In 1898, the banker Ernest Thiel bought \
his first canvases and became his main collector; the Thiel Gallery in Stockholm still \
holds the largest group of his works. Exhausted by his city views, around 1907 he \
turned to the figure: a keen swimmer, he painted the sailors and athletes of the Navy \
baths. He died in 1915 of a cerebral haemorrhage."""
style = """
In his blue period, Jansson paints Stockholm by night in vast plunging views, \
dominated by blue, with crossed and visible brushstrokes, in which the city lights \
become halos and spirals. These nocturnes, close to Munch in their intensity, slide \
gradually towards abstraction. His later male nudes, powerful and luminous, are today \
being rediscovered."""

[[artistes]]
nom = "Akseli Gallen-Kallela"
vie = "Pori (Finland), 26 April 1865 – Stockholm, 7 March 1931"
biographie = """
Born Axel Gallén in Pori, into a Swedish-speaking family, he studied in Helsinki \
against his father's wishes, then in Paris, from 1884 to 1889, at the Académie Julian \
and with Cormon. There he first adopted the naturalism of Jules Bastien-Lepage. In \
1890, he married Mary Slöör; their honeymoon in Karelia, where he collected songs and \
images to illustrate the Kalevala, opened the way to “Karelianism”. In 1895, the death \
of his eldest daughter, Impi Marjatta, devastated him. From 1896 to 1899, he painted \
his great Kalevala scenes, such as The Defence of the Sampo and Lemminkäinen's Mother, \
in his studio at Kalela, in the forest. At the Paris Exposition Universelle of 1900, he \
decorated the Finnish pavilion with frescoes. In 1907, he Finnicised his name to \
Akseli Gallen-Kallela. He also lived for two years in Kenya, from 1909, then, after \
Finland's independence, designed flags and decorations for the new state. He died in \
1931 in Stockholm, on his return from a trip to Copenhagen."""
style = """
Gallen-Kallela moves from the realism learned in Paris to a synthetic, Symbolist style: \
firm outlines, bold colours, decorative compositions. He gave a face to the heroes of \
the Kalevala and became the painter of Finnish identity. Painter, printmaker, \
fresco painter, designer and architect of his own studios, he is the great figure of \
the golden age of Finnish art."""

[[artistes]]
nom = "Helene Schjerfbeck"
vie = "Helsinki, 10 July 1862 – Saltsjöbaden (Sweden), 23 January 1946"
biographie = """
At four, Helene Schjerfbeck fell down a staircase and injured her hip: she would limp \
all her life. Her talent was so precocious that she entered the drawing school of the \
Finnish Art Society at eleven. Thanks to scholarships, she left for Paris in 1880, \
worked at the Académie Colarossi and painted in Brittany, at Pont-Aven. In 1887–1888, \
at St Ives, in Cornwall, she painted The Convalescent, awarded a medal at the \
Exposition Universelle of 1889. Her engagement to a Swedish painter was broken off in \
1885. In the 1890s, she taught in Helsinki, then, ill, settled in 1902 with her mother \
in Hyvinkää, a small town far from the art world, where she lived for nearly twenty \
years. There she invented, almost alone, a modern and pared-down art. From 1913, the \
dealer Gösta Stenman made her known; her first solo exhibition took place in 1917. \
After her mother's death, she lived in Ekenäs. In 1944, she took refuge in Sweden, at \
Saltsjöbaden, where she painted her last self-portraits, and died in 1946."""
style = """
Schjerfbeck begins with a virtuoso realism, learned in Paris, then simplifies \
ceaselessly: forms reduced to the essential, muted colours, scraped and worn surfaces. \
Her portraits and her long series of self-portraits, up to the almost effaced faces of \
old age, are among the high points of modern Nordic painting. Long known mainly in \
Finland and Sweden, she is now celebrated around the world."""

[[artistes]]
nom = "Hugo Simberg"
vie = "Hamina (Finland), 24 June 1873 – Ähtäri (Finland), 12 July 1917"
biographie = """
The son of a colonel, Hugo Simberg was born in Hamina, in south-eastern Finland. An \
aunt, who ran a school in the family home and painted as an amateur, encouraged him to \
become an artist. He studied at the drawing school in Viipuri, then, from 1893 to 1895, \
at that of the Finnish Art Society, where Helene Schjerfbeck was one of his teachers. \
From 1895 to 1897, he became the private pupil of Akseli Gallen-Kallela, in his studio \
at Kalela, in the forest. He then travelled to London, Paris and Italy. His strange \
small works, peopled with devils, skeletons and angels, were well received at the \
autumn exhibitions. In the autumn of 1902, he fell gravely ill; after his recovery, he \
painted The Wounded Angel. From 1904 to 1906, he decorated St John's Church in Tampere \
with Magnus Enckell: his paintings, with the serpent and the naked boys carrying a \
garland, caused a scandal and were approved by only one vote. He then taught at the \
Ateneum, married Anni Bremer in 1910, and died in 1917, at the age of forty-four."""
style = """
Simberg is the great Finnish Symbolist: with very simple means, a naïve drawing style \
and muted colours, he creates a world both macabre and tender, where Death gardens, \
where devils play the fiddle and where angels are wounded. Without ever explaining his \
images, he gives them a melancholy depth that still touches a wide public."""
