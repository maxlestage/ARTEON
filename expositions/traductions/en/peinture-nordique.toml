[exposition]
ordre = 155
nom_court = "Nordic Painting"
mouvement = "The Light of the North, Scandinavian Painting"
cadre = "bois"
couleur = "#2f5470"
titre = "The Light of the North: Scandinavian and Finnish Painting"
artiste = "Krøyer, Hammershøi, Larsson, Zorn, Schjerfbeck, Gallen-Kallela, Simberg…"
dates = "1883–1926"
accroche = "Virtual exhibition · Ateneum, Helsinki"
introduction = """
Between 1880 and 1920, painters from Denmark, Sweden, Norway and Finland, trained in \
Paris, returned home to paint what belongs only to the North: summer evenings that \
never end, the raking light of winter interiors, Midsummer festivities and the myths of \
the Kalevala. The visit brings together eleven painters in eleven paintings, from the \
beach at Skagen to the shores of Lake Jølster. The building is inspired by the Ateneum \
in Helsinki, the neo-Renaissance palace of the arts on Railway Square: a vestibule, a \
tall, symmetrical central hall, two side galleries and, at the far end, a room devoted \
to the museum's Finnish treasures."""
vitrine = "soiree-ete-skagen.jpg"

[musee]
nom = "Ateneum"
ville = "Helsinki, Finland"
architecte = "Theodor Höijer"
construction = "1887"
presentation = """
In the nineteenth century, Finland's artistic circles fought for a long time to obtain \
a building that would house both their drawing school and their collections. The \
Ateneum, designed by the architect Theodor Höijer, was completed in 1887 on the edge of \
Railway Square, in the heart of Helsinki. Its name recalls the ancient Athenaeum, and \
its perfectly symmetrical neo-Renaissance façade is a sculpted programme: busts of the \
architect Bramante, the painter Raphael and the sculptor Phidias above the entrance, \
four caryatids representing the arts, and on the pediment the Latin motto Concordia res \
parvae crescunt, “through concord, small things grow”, all sculpted by Carl Eneas \
Sjöstrand; between the windows, sixteen medallions by Ville Vallgren. The building also \
housed art schools for many years. Renovated from 1985 to 1991, it is today one of the \
museums of the Finnish National Gallery and holds the great paintings of the Finnish \
Golden Age, by Gallen-Kallela, Schjerfbeck and Simberg. In 1903, the acquisition of \
Street in Auvers-sur-Oise made its collection the first in the world to include a canvas \
by Van Gogh."""
ici = """
ARTEON's building takes up the symmetry of the Ateneum around a central axis. Visitors \
enter from the south into the cream-walled vestibule, which opens onto the great hall, \
square and eleven metres high, devoted to Skagen and Sundborn. On either side open two \
twin galleries: to the west, “The Interiors”, with pearl-grey walls, devoted to the \
silent rooms of Copenhagen, Skagen and Paris; to the east, “The Bright Nights”, in pale \
blue, for the festivities and nights of the Nordic summer. At the far end, to the \
north, the Finnish room, with light ochre walls, brings together three landmark \
paintings from the Ateneum."""

