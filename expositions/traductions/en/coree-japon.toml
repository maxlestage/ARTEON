[exposition]
ordre = 27
nom_court = "Korea and Japan"
mouvement = "Korea and Japan, folding screens, celadons and scrolls"
cadre = "aucun"
couleur = "#3d6b5c"
titre = "Korea and Japan, the Green of Celadon and the Gold of the Screens"
artiste = "Goryeo, Joseon, Jeong Seon, Kim Hong-do, Sōtatsu, Kōrin, Tōhaku…"
dates = "12th–18th century"
accroche = "Virtual exhibition · Kyoto National Museum"
introduction = """
Six centuries of art on either side of the Korea Strait. On one side, the deep green of Goryeo celadons, the bare whiteness of Joseon moon jars, the mountains painted from nature by Jeong Seon and the village scenes of Kim Hong-do. On the other, the narrative scrolls of the Heian period, the gold-ground screens of Sōtatsu and Kōrin, Tōhaku's pines in the mist and a dish shaped by Kenzan and painted by his brother Kōrin. Ten works, gathered in a building inspired by the Heisei Chishinkan wing of the Kyoto National Museum, designed by Taniguchi Yoshio: a great luminous hall, a long gallery in which the screens unfold, and three rooms around it, for ceramics, Korean painting and scrolls."""
vitrine = "dieux-vent-tonnerre.jpg"

[musee]
nom = "Kyoto National Museum"
ville = "Kyoto, Japan"
architecte = "Katayama Tōkuma; Taniguchi Yoshio for the Heisei Chishinkan wing"
construction = "1895–1897; Heisei Chishinkan wing opened in 2014"
presentation = """
In 1889, the Meiji government decided to found three imperial museums, in Tokyo, Nara and Kyoto, to protect the treasures of temples and shrines, which had suffered in the upheavals of the early Meiji era. In Kyoto, the architect Katayama Tōkuma, one of the first Japanese trained in Western architecture, raised in the Higashiyama district, opposite the Sanjūsangen-dō temple, a red-brick pavilion in the French neo-Baroque style, completed in 1895: the Kyoto Imperial Museum opened there in May 1897. Made a national museum in 1952, it holds above all the art of the former capital, paintings, sculptures, calligraphy and ceramics, many of them entrusted on loan by the city's temples, such as Sōtatsu's Wind and Thunder Gods, the property of Kennin-ji. Since 2014, the collections have been displayed in the Heisei Chishinkan wing by Taniguchi Yoshio, the architect of the expansion of MoMA in New York: a long horizontal volume of stone and glass, whose great hall is bathed in light. The 1895 pavilion was then renamed Meiji Kotokan."""
ici = """
ARTEON's building borrows its sobriety from Taniguchi's wing: pale walls the color of paper and stone, long perspectives, even light. One enters from the south into the Great Hall, eighteen meters wide and nine meters high. To the north opens the Gallery of Screens, thirty meters long, where Kōrin, Tōhaku and Sōtatsu answer one another. From there one reaches, to the west, the Ceramics Room and its showcases, to the north the Korean Painting Room, and to the east the Scroll Room, devoted to the painted tales of the Heian period."""

