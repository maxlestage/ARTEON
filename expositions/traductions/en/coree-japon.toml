[[oeuvres]]
titre = "Maebyeong Vase with Cranes and Clouds"
artiste = "Corée, dynastie Goryeo"
annee = "second half of the 12th century"
image = "maebyeong-grues.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:청자_상감_구름_학_무늬_매병_고려-靑磁象嵌雲鶴文梅甁_高麗-Maebyeong_decorated_with_cranes_and_clouds_MET_DP240189.jpg"
technique = "Stoneware with inlaid decoration under celadon glaze, h. 33.5 cm"
collection = "Metropolitan Museum of Art, New York"
note = "White cranes fly among small clouds on the pale green of a celadon: the decoration is not painted but inlaid in the clay."
description = """
A vase a little over thirty centimeters high, with a broad, rounded shoulder that tapers downward then flares slightly at the foot; a very short neck with a rolled lip leaves only a small opening. The entire surface is covered with a pale green, translucent glaze, crossed by fine crackle. Against this ground, white cranes fly in every direction, wings spread, some rising toward the neck, others diving, necks outstretched. Between them float small white mushroom-shaped clouds, each prolonged by a long undulating tail. At the foot, a frieze of white key-fret closes the decoration. Photographed whole against a gray background, the vase is shown here enlarged more than threefold."""
evocation = """
Throughout East Asia, the crane is the bird of longevity and the mount of the Daoist immortals; the clouds evoke the heaven where they dwell. On a vase intended for wine, this flight of birds forms a wish for long life and serenity, addressed to refined guests. The maebyeong shape, borrowed from the Chinese meiping, means "plum vase": the name is often explained by the practice of placing a branch of flowering plum in it, but these vases were first used to store alcohol. The green of celadon sought to recall jade, the most precious of stones. This vase speaks of the taste of an aristocracy steeped in Buddhism and Chinese culture, which knew how to invent, with inlay, a decoration that belongs to Korea alone."""
histoire = """
The kingdom of Goryeo, which gave Korea its name, brought celadon to its height in the 12th century. The main kilns were in the southwest of the peninsula, at Gangjin and Buan, near the sea, from where the pieces traveled by boat to the capital, Kaesong. In 1123, an envoy of the Chinese emperor, Xu Jing, stayed at Kaesong; in his travel account, he praises the color of Korean celadons, which the inhabitants, he notes, compare to that of the kingfisher. In the early 20th century, many Goryeo tombs around Kaesong were excavated or looted, and their celadons reached the art market, in Japan and then in the West. It was in this context that the Japanese art dealer Yamanaka Sadajirō gave this vase to the Metropolitan Museum, in 1911."""
facture = """
The potter throws the stoneware vase then, while the clay is still damp but firm, cuts the cranes, clouds and frieze into it with a knife. He fills the hollows with white or black clay, scrapes off the excess so that the surface is smooth again, and gives a first firing. He then applies the glaze, charged with a little iron, and fires the vase in an oxygen-starved kiln: this is what produces the bluish green. This inlay technique, called sanggam, is peculiar to Korea. The cranes' legs and beaks, drawn in a black line finer than the white, are also inlaid."""
details = [
  "The cranes that rise and those that dive, head downward.",
  "The legs and beaks of the birds, in a fine inlaid black line.",
  "The undulating tail that extends each small cloud.",
  "The network of crackle in the glaze, visible on the shoulder.",
  "The frieze of white key-fret above the foot.",
]
themes = ["celadon", "crane", "longevity", "inlay", "Goryeo"]
anecdote = """
The most famous maebyeong with cranes and clouds, kept in the Kansong Museum in Seoul, is a National Treasure. The collector Jeon Hyeong-pil bought it in 1935 from a Japanese dealer, for a considerable sum, in order to keep this heritage in Korea."""
salle = 3
mur = "ouest"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Moon Jar"
artiste = "Corée, dynastie Joseon"
annee = "second half of the 18th century"
image = "jarre-lune.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:백자_달항아리_조선-白磁壺_朝鮮-Moon_Jar_MET_DP231899.jpg"
technique = "Porcelain, h. 38.7 cm, diam. 33 cm"
collection = "Metropolitan Museum of Art, New York"
note = "An almost round jar of white porcelain, without any decoration: its beauty lies in its form, its whiteness and its imperfections."
description = """
A large, almost spherical jar, a little taller than it is wide, resting on a small ring foot; a short, straight neck, barely flared, opens the body upward. It bears no painted or incised decoration, only a white, milky glaze, slightly bluish in places. The roundness is not perfect: the profile swells more on one side than on the other. Pinkish patches, the color of flesh or pale rust, spread in horizontal bands across the body; a few black specks dot the surface near the foot, where the glaze reveals the clay body. In reality thirty-nine centimeters high, the jar is shown here enlarged a little more than threefold."""
evocation = """
The name moon jar, which dates only from the 20th century, says exactly what one sees in it: a white, full, slightly irregular orb, like the rising moon. These jars reflect the ideal of the Joseon dynasty, governed according to Neo-Confucianism, which prized simplicity, frugality and the purity of white, the color that most Koreans also wore in their everyday clothing. In them has been seen the image of an unaffected beauty that accepts asymmetry and the accidents of firing. In the 20th century, Korean artists such as the painter Kim Whanki, who collected and painted them, made them an emblem of Korean identity; ceramists around the world imitate them today."""
histoire = """
Moon jars were produced mainly between the late 17th and the 18th century, in the official kilns of Gwangju, southeast of Seoul, which supplied the court's porcelain. The exact use of each is unknown: they may have held provisions or alcohol, or simply been admired. Their size posed a technical challenge, for so wide a form could not be thrown in one piece in porcelain clay. This one entered the Metropolitan Museum with the Asian art collection of the American collector Harry G. C. Packard, acquired by the museum in 1975, partly by gift, partly by purchase. Only a limited number of these large jars survive, preserved in Korea, Japan, Europe and the United States."""
facture = """
The potter threw two large hemispherical bowls separately, then joined them rim to rim before shaping the neck and the foot: the join, at mid-height, explains the slight bulge and the asymmetry of the profile. The clay, a very pure kaolin, is covered with a transparent glaze that takes on, at high temperature, this milky white. In the wood-fired kiln, the heat was never perfectly even, and the jar sagged a little. The pinkish patches are thought to come from the firing or from what the jar once contained, which may have seeped into the porcelain."""
details = [
  "The profile, more rounded on one side than the other.",
  "The pinkish bands that cross the body at mid-height.",
  "The short, barely flared neck, of a yellower white.",
  "The black specks and the bare clay near the foot.",
]
themes = ["porcelain", "white", "moon", "simplicity", "Joseon"]
anecdote = """
In 1935, the English potter Bernard Leach bought a moon jar in Seoul and brought it back to England, saying, it is told, that he was carrying happiness home with him. It is now in the British Museum in London."""
salle = 3
mur = "ouest"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Square Dish with Plovers over Waves"
artiste = "Ogata Kenzan"
annee = "c. 1700"
image = "plat-pluviers.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ogata_Korin_-_Square_Dish_with_Design_of_Plovers_over_Waves_-_1966.365_-_Cleveland_Museum_of_Art.tif"
technique = "Stoneware, iron-oxide decoration under glaze, 22 × 22 × 2.7 cm; decoration painted by Ogata Kōrin"
collection = "Cleveland Museum of Art"
note = "Kenzan shaped and fired this dish; his elder brother, the painter Kōrin, traced on it with a rapid brush plovers flying over waves."
description = """
A square, shallow dish, twenty-two centimeters on a side, with straight edges, photographed at an angle against a gray background. The cream-colored clay is covered with a transparent, finely crackled glaze. At the bottom of the dish, painted in blackish brown, a great wave curls at the left and its lines of foam unfurl toward the right; above, small birds with heart-shaped wings, plovers, fly in a flock. Near the right edge, a few characters traced with a brush form the painter's signature. Around the four outer edges runs a continuous decoration of scrolls and clouds, in which a large flower blooms in the foreground. The dish is shown here enlarged about fivefold."""
evocation = """
The plover, chidori in Japanese, is a shore bird sung for centuries by court poetry: its cries on the strand, on winter nights, speak of solitude and cold. Associated with waves, it forms a classic motif that the Ogata take up with new freedom. This dish illustrates an ideal in which painting, poetry and the object of use are not separate: a dish for the cakes of the tea ceremony becomes the support of a signed painting. It also bears witness to the complicity of two brothers, born into a wealthy family of Kyoto silk merchants, one a fashionable and famous painter, the other a potter and man of letters, in love with solitude."""
histoire = """
In 1699, Ogata Kenzan opened his own kiln at Narutaki, northwest of Kyoto; his artist name, which means "northwest mountain", comes from this location. His brother Kōrin, already an established painter, came to decorate some of his pieces. The work was shared: Kenzan shaped the dish, Kōrin painted his motif on it, Kenzan applied the glaze and saw to the firing. Each signed: Kōrin beside his design, Kenzan on the underside. This dish was part of a set meant to present the cakes that accompany tea. It belonged to the Ōkōchi collection in Tokyo before being sold by a Tokyo dealer to the Cleveland museum in 1966. Other square dishes painted by Kōrin are preserved in Japan."""
facture = """
A square dish is not thrown: it is built up from assembled slabs of clay. Kōrin paints on it in iron oxide, which turns blackish brown in firing, with a quick, sure brush: the wave in a few curves, the birds in simple double dabs. Kenzan then covers it all with a transparent glaze, which on cooling took on a fine network of crackle. The contrast between this free, almost calligraphic drawing at the bottom of the dish and the dense, regular frieze of the edges is characteristic of the two brothers' art."""
details = [
  "The great wave, at the left, whose foam unfurls in parallel lines.",
  "The plovers, each reduced to two heart-shaped dabs.",
  "Kōrin's signature, at the right, beside his drawing.",
  "The blooming flower on the outer edge, in the foreground.",
  "The fine network of crackle in the glaze.",
]
themes = ["ceramics", "plover", "wave", "tea", "Rinpa"]
anecdote = """
At about the age of seventy, Kenzan left Kyoto to settle in Edo, present-day Tokyo. There he continued to paint and make ceramics until his death in 1743, at the age of eighty."""
salle = 3
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Mount Inwang after Rain"
artiste = "Jeong Seon"
annee = "1751"
image = "inwang-apres-la-pluie.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Inwangjesaekdo.jpg"
technique = "Ink on paper, 79.2 × 138.2 cm"
collection = "National Museum of Korea, Seoul"
note = "The still-wet rocks of Mount Inwang, above Seoul, emerge from the mist rising from the valleys: the most famous work of Korean \"true-view\" landscape."
description = """
A mountain fills almost the whole width of the sheet. At the center, an enormous rounded wall of granite, painted a deep black, rises like a dome; around it, paler ridges, dotted with small ink spots that stand for trees, rise in tiers to the upper edge. Thin waterfalls, born of the rain, run down the ravines. The whole lower part is drowned in a white mist from which pine tops emerge. At the lower right, among the trees, the roof of a house appears; lower down, toward the left, hang the light branches of a willow. At the upper right, a short vertical inscription gives the title, the painter's brush name and the date, followed by two seals."""
evocation = """
The Korean title, Inwang jesaek do, means "Mount Inwang clearing after the rain": the painter captures the moment when the downpour stops, when the rock is still black with water and the mist is rising. Mount Inwang overlooks the royal palace of Seoul from the west, and Jeong Seon lived at its foot: he paints a landscape he saw every day. According to a widespread interpretation, the work is linked to his lifelong friend, the poet Yi Byeong-yeon, gravely ill that year and dead soon after; the house below would be his, and the clearing sky a wish for his recovery. Nothing proves it, but this reading expresses the emotion attributed to this painting, made by a man of seventy-five."""
histoire = """
Jeong Seon painted this landscape in 1751, as the inscription indicates, during an intercalary month of the lunar calendar. Until then, Korean painters mostly depicted imaginary mountains, in the Chinese manner; he made the capital and its surroundings a subject worthy of great painting. In the 20th century, the work belonged to the collection of Lee Kun-hee, chairman of the Samsung group, and it is a National Treasure of Korea. After Lee Kun-hee's death in 2020, his family donated thousands of works and objects from his collection to the state; in April 2021, the painting thus entered the National Museum of Korea in Seoul. Its exhibition, the same year, drew crowds of visitors."""
facture = """
Jeong Seon reverses the usual logic of ink: the great rock wall, which one would expect to be pale, is the darkest mass on the sheet, laid down in broad brushstrokes heavy with ink, repeated from top to bottom like running water. The neighboring ridges are modeled with drier strokes, and the trees reduced to horizontal dabs, in the manner of certain Chinese masters. The mist is not painted: it is the paper left in reserve, outlined with gray wash. The very tight framing cuts off the summit at the edge of the sheet, as if the mountain overflowed the picture."""
details = [
  "The great black wall at the center, painted in repeated vertical strokes.",
  "The thin white waterfalls that run down from the ravines.",
  "The roof of a house among the pines, at the lower right.",
  "The light branches of a willow, below, toward the left.",
  "The painter's inscription and two seals, at the upper right.",
]
themes = ["mountain", "rain", "mist", "Seoul", "landscape"]
anecdote = """
Mount Inwang can still be seen from the center of Seoul. A path today follows the old city wall, which runs along its ridges, and one can compare the real landscape with the painting made more than two and a half centuries ago."""
salle = 4
mur = "nord"
place = 2
largeur = 2.0

[[oeuvres]]
titre = "Wrestling (Ssireum)"
artiste = "Kim Hong-do"
annee = "late 18th century"
image = "lutte-ssireum.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Danwon_Ssireum.jpg"
technique = "Ink and light colors on paper, album leaf, approx. 27 × 22.7 cm"
collection = "National Museum of Korea, Seoul"
note = "Two wrestlers grapple in the middle of a circle of spectators: a page from the album of genre scenes by Kim Hong-do, the painter of everyday life in Joseon."
description = """
At the center of the sheet, against an empty ground, two men in cloth trousers and jackets grip one another: one has lifted the other, who tips over, one leg in the air. All around, seated on the ground, the spectators form an open circle. At the top, two tight groups watch, leaning forward; some, wearing the broad-brimmed black hat of married men and scholars, fan themselves, others have set their hats down beside them. At the left, standing, a boy holds a tray: he is a sweets vendor, who is looking elsewhere. At the lower right, two men throw themselves backward, mouths open, as if the wrestlers were about to fall on them. Pairs of shoes are set on the ground, at the right."""
evocation = """
Ssireum, a traditional wrestling in which each opponent seizes the band of cloth knotted around the other's waist and thigh, was the great entertainment of village festivals, in particular the Dano festival, in the fifth lunar month. Kim Hong-do makes of it a small human comedy: scholars and peasants, old and young share the same spectacle, each with his own reaction, tension, amusement or fright. The composition guides the eye: the spectators at the bottom, who throw themselves backward, announce on which side the wrestler will fall. These genre paintings, called pungsokhwa, show the new interest of 18th-century Korea in the life of ordinary people, which joins the search for a properly Korean painting, as in Jeong Seon."""
histoire = """
The leaf belongs to an album of twenty-five genre scenes, the Danwon pungsokdo cheop, preserved in the National Museum of Korea and designated a Treasure of Korea. It also shows a forge, a village school, a young dancer, women washing laundry by a stream, a ferry on a river. The album is not dated; it is generally placed in the late 18th century, when Kim Hong-do, a court painter, was at the height of his reputation under King Jeongjo. For whom it was made is unknown. These small images have become so familiar in Korea that they illustrate school textbooks and have been reproduced on countless objects, stamps and posters."""
facture = """
Kim Hong-do draws his figures with a supple, rapid ink line, heavier at the folds of the garments, then enhances them with light washes, gray, ochre or bluish. He eliminates all setting, no tree and no house: the bare ground of the sheet and the circle of spectators suffice to create space. The faces, round, with elongated eyes, are treated with humor and variety, each with its own expression. The ring composition concentrates attention on the wrestlers while letting the eye travel from one group to another."""
details = [
  "The young sweets vendor, tray in hand, who does not watch the match.",
  "The two spectators at the lower right, thrown backward, mouths open.",
  "The black hats set on the ground, at the left.",
  "The shoes set on the ground, at the right.",
  "The raised leg of the wrestler who tips over.",
]
themes = ["wrestling", "festival", "village", "everyday life", "Joseon"]
anecdote = """
It has long been noticed that one of the spectators has his hands drawn the wrong way round, the right in place of the left. Whether a simple slip or a wink from the painter, this detail has become one of the most commented-upon curiosities of Korean painting."""
salle = 4
mur = "nord"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Irises (Right Screen)"
artiste = "Ogata Kōrin"
annee = "c. 1701–1705"
image = "iris-korin.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:KORIN-Irises-R.jpg"
technique = "Six-panel folding screen, ink and colors on gold-leaf paper, approx. 151 × 360 cm (one of a pair)"
collection = "Nezu Museum, Tokyo"
note = "Clumps of blue irises follow one another on a gold ground, like a textile pattern: the most famous screen of the Rinpa school."
description = """
Six vertical panels, joined into a screen, form a single surface of gold. Against this plain ground, without horizon or earth, clumps of irises follow one another from left to right in an undulating frieze: long, bright green leaves, upright or slightly leaning, and deep blue flowers, almost black for some, paler for others. The groups rise then fall, leaving between them voids of gold. There is no water, no bridge, no figure. The ground is made of squares of gold leaf, whose joins can be made out. At the lower right, an ink signature and a round seal identify the painter. The second screen of the pair, not shown here, continues the frieze toward the left."""
evocation = """
The irises refer to a famous episode of the Tales of Ise, a collection of poetic tales of the 10th century: a nobleman who has left the capital arrives at Yatsuhashi, the "Eight Bridges", where irises bloom at the edge of a marsh; he composes a poem each line of which begins with a syllable of the word kakitsubata, iris, and his companions weep, thinking of Kyoto. Kōrin removes the bridge, the travelers, the landscape: only the flowers remain, and the cultivated viewer recognizes the story. Reducing a tale to a decorative motif, for an elite that loved such literary allusions, is at the heart of Rinpa aesthetics. The work also speaks of Kōrin's world, the son of textile merchants, for whom painting and textile design were close."""
histoire = """
Kōrin painted this pair of screens around 1701–1705, shortly after receiving the honorary title of hokkyō, which he mentions in his signature. For whom is unknown. The screens long belonged to Nishi Hongan-ji, one of the great temples of Kyoto, which preserved them for more than two centuries. They then entered the collection of the industrialist Nezu Kaichirō; after his death in 1940, his Tokyo residence and collections became the Nezu Museum, which opened to the public in 1941. Designated National Treasures, the two screens are so fragile that they are shown only once a year, in spring, at the season when the irises in the museum's garden bloom."""
facture = """
Kōrin lays down his colors in flat areas, without shadow or modeling: azurite blue for the flowers, malachite green for the leaves, two mineral pigments, ground, thick and matte, which stand out against the gold. Some clumps are repeated almost identically from one panel to another; it has been thought that he used stencils, as in the dyeing of the fabrics his family sold. The rhythm, regular but varied, recalls that of a kimono pattern. Unfolded in a zigzag, the screen also made the light play on the gold, panel after panel."""
details = [
  "The groups of flowers that repeat from one panel to the next, almost identical.",
  "The two blues of the flowers, one very dark, the other lighter.",
  "The squares of gold leaf and their joins, visible in the ground.",
  "Kōrin's signature and round seal, at the lower right.",
]
themes = ["iris", "gold", "poetry", "Rinpa", "pattern"]
anecdote = """
Later, Kōrin took up the subject again in another pair of screens, where this time he painted the zigzag wooden bridge that crosses the irises. These Irises at Yatsuhashi are now preserved in the Metropolitan Museum in New York."""
salle = 2
mur = "nord"
place = 2
largeur = 3.6

[[oeuvres]]
titre = "Pine Trees in the Mist (Right Screen)"
artiste = "Hasegawa Tōhaku"
annee = "late 16th century"
image = "pins-dans-la-brume.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hasegawa_Tohaku_-_Pine_Trees_(Shōrin-zu_byōbu)_-_right_hand_screen.jpg"
technique = "Six-panel folding screen, ink on paper, 156.8 × 356 cm (one of a pair)"
collection = "Tokyo National Museum"
note = "A few pines appear and fade in the fog: with ink alone and a great deal of empty paper, Tōhaku paints the dampness of the air."
description = """
On six panels of slightly beige paper, bordered with golden silk and a fine lacquered strip, pines emerge from the white. At the left, a group of close-set trunks: the sharpest, on the third panel, bears bushy branches of a deep black, while behind it other, paler pines dissolve into gray. At the center, two panels remain almost empty, crossed only by the shadow of a distant tree. At the right, an isolated pine leans, its long branches outstretched, accompanied by barely visible silhouettes. At the foot of the trees, a few strokes suggest the ground. Nothing else: no sky, no mountain, no horizon line."""
evocation = """
The screen does not describe a particular place but a state of the air: morning, perhaps, or a foggy day, when nearby trees stand out and the others fade. The emptiness is not a lack: it represents the mist itself and lets the viewer complete the scene. It has been thought to show the pine groves of the Noto coast, the painter's native region, or a moment of mourning after the death of his son in 1593; these readings remain hypotheses. The work is often linked to the sensibility of Zen Buddhism and to the Chinese painting of Muqi, whom Tōhaku admired. In contrast to the gold grounds of its time, it has become one of the best-loved paintings in Japan."""
histoire = """
Coming from the province of Noto, Hasegawa Tōhaku made his name in Kyoto in the 1590s in the face of the Kanō school, which dominated the major commissions. It is not known when or for whom he painted these pines, nor even whether this is a finished work: the sheets of paper are joined irregularly, and the seals are sometimes judged to be later. Some historians therefore see in it a sketch, perhaps preparatory to a decoration of sliding doors, later mounted as a screen. The pair now belongs to the Tokyo National Museum and is a National Treasure. Fragile, it is shown to the public only a few weeks a year, most often at New Year."""
facture = """
Everything is done in ink, more or less diluted, on unprepared paper. Tōhaku paints the pine needles with a rapid gesture, using a broad brush, perhaps made of straw, which leaves dry, nervous streaks. The trees in the foreground are drawn in almost pure ink; those at the back, in very pale wash, with contours that are lost in the paper. This work of values, from black to the palest gray, creates depth without perspective, with a single color."""
details = [
  "The blackest pine, on the third panel, and the pale trees behind it.",
  "The two central panels, almost empty.",
  "The leaning pine, at the right, and its long branches.",
  "The dry streaks of the brush in the needles.",
  "The few strokes of the ground at the foot of the trunks.",
]
themes = ["pines", "mist", "ink", "emptiness", "Zen"]
anecdote = """
Tōhaku presented himself as the heir, in the fifth generation, of the great ink painter Sesshū, who had died almost a century earlier. In this way he attached himself to the most prestigious Japanese tradition of monochrome painting."""
