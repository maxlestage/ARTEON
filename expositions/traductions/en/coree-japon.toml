[[oeuvres]]
titre = "The Wind and Thunder Gods"
artiste = "Tawaraya Sōtatsu"
annee = "early 17th century"
image = "dieux-vent-tonnerre.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Wind_God_and_Thunder_God_Screens_by_Tawaraya_Sotatsu_hi-res.png"
technique = "Pair of two-panel folding screens, ink and colors on gold-leaf paper, 154.5 × 169.8 cm each"
collection = "Kennin-ji Temple, Kyoto (on loan to the Kyoto National Museum)"
note = "Two gods burst from the clouds at the two ends of a golden sky: at left, the thunder god beats his drums; at right, the wind god opens his bag."
description = """
Two golden screens, of two panels each, are placed side by side. On the left one, the thunder god, Raijin, with a white body, surges at the top of a dark cloud: around him, a ring of small drums that he strikes with his sticks; his hair bristles, he wears a fierce grimace, and a scarf floats behind him. On the right one, the wind god, Fūjin, with a green body, rushes in from the edge on another cloud, holding above his head a long, inflated white bag, from which the winds escape. The two figures are pushed toward the edges; between them, a vast space of gold remains empty. The clouds, brown and gray, are made of diffuse blots."""
evocation = """
Fūjin and Raijin are ancient deities, come from India and China with Buddhism, who are also seen as statues in Japanese temples. Here, they seem to burst into the sky at the same instant, as if to unleash a storm. The two screens have been read as an image of the forces of nature, at once threatening and beneficent, since rain and wind also make the rice grow. The comedy of the faces, almost caricatured, tempers the terror. The golden void at the center, charged with tension between the two figures, is often cited as an example of the Japanese taste for open space."""
histoire = """
The work is neither signed nor dated; it is attributed to Sōtatsu, who ran in Kyoto a fan-painting workshop, the Tawaraya, and worked with the calligrapher Hon'ami Kōetsu. It is thought that he painted it late in his career, in the 1620s or 1630s. The screens belong to Kennin-ji, the oldest Zen temple in Kyoto, founded in 1202, which entrusted them to the Kyoto National Museum; the temple shows its visitors a faithful reproduction. Designated National Treasures, they are considered one of the founding works of the Rinpa school: Kōrin copied them nearly a century later, and Sakai Hōitsu, in the 19th century, in turn copied Kōrin's version."""
facture = """
On the ground of square gold leaves, Sōtatsu paints the bodies in thick flat areas, white for Raijin, green for Fūjin, outlined with supple ink contours. The clouds are painted with the technique of tarashikomi, which he helped to develop: one ink or color is laid over another still damp, and they blend into irregular, unpredictable halos. The figures, partly cut off by the edges of the screens, seem to enter and leave the frame, which gives an impression of movement."""
details = [
  "Raijin's ring of drums, cut by the upper edge of the screen.",
  "The white wind bag that Fūjin holds above his head.",
  "The dark clouds made of blots that melt into one another.",
  "The scarves that float behind the two gods.",
  "The great empty space of gold at the center of the pair.",
]
themes = ["gods", "storm", "gold", "Rinpa", "emptiness"]
anecdote = """
Sōtatsu's gods are often compared to the statues of Fūjin and Raijin carved in the 13th century for Sanjūsangen-dō, the temple located just across from the Kyoto National Museum: the painter may have taken inspiration from them."""
salle = 2
mur = "sud"
place = 2
largeur = 3.4

[[oeuvres]]
titre = "The Tale of Genji, Chapter \"Azumaya\""
artiste = "Japon, époque de Heian"
annee = "first half of the 12th century"
image = "genji-azumaya.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Genji_emaki_azumaya.jpg"
technique = "Painting from an illustrated handscroll (emaki), colors and ink on paper, h. approx. 22 cm"
collection = "Tokugawa Art Museum, Nagoya"
note = "In an apartment of the palace, ladies read, look at pictures and have their hair combed: a scene from the oldest illustrated scroll of the Tale of Genji."
description = """
One looks into the interior of an aristocratic residence from above and at an angle, as if the roof had been removed. Beams, bamboo blinds and sliding partitions decorated with landscapes cut the scene into diagonals. At the center, a mauve cloth screen, hung from a frame, separates two groups. At the left, a lady in gray garments tends the long black hair of another; farther on, a lady in a light robe holds an open booklet and reads. At the top, a young woman leaning on her elbow, in green and red garments, bends forward. At the right, a lady in a cream robe with circle patterns is seated, her black hair spread over her shoulders, near a pile of colored fabrics. The faces, pale, are reduced to a few strokes."""
evocation = """
The Tale of Genji, written around the year 1000 by Murasaki Shikibu, a lady-in-waiting at the imperial court, is often presented as one of the first novels in history. The chapter "Azumaya", "the Eastern Cottage", belongs to its last part. Tradition recognizes in this scene the young Ukifune, who looks at pictures while an attendant reads the text aloud, and her half-sister Naka no Kimi, whose hair is being combed. Nothing seems to happen; but the reader knows that Ukifune has just escaped the advances of a prince, and senses the anxiety beneath this moment of calm. These paintings express mono no aware, the melancholy sensitivity to the fragility of things that the Heian court cultivated."""
histoire = """
The illustrated scrolls of the Tale of Genji were made in the 12th century, more than a century after the novel, no doubt for the imperial court. They originally comprised several scrolls, in which passages of text calligraphed on decorated paper alternated with paintings. Only some twenty painted scenes remain, divided between the Tokugawa Art Museum in Nagoya, which holds the largest share, and the Gotoh Museum in Tokyo. To protect them, the sheets are now kept separately, flat. Long attributed to the court painter Fujiwara no Takayoshi, they are now considered the work of several anonymous painters and calligraphers. They are designated National Treasures."""
facture = """
The painters work by the method called tsukuri-e, "constructed painting": a first drawing in ink, then thick layers of opaque mineral pigments, and finally the contours and details retraced in ink. The roof is removed to show the interior, a device called fukinuki yatai, the "blown-off roof". The faces follow the convention of hikime kagibana, "line eyes, hook nose", which makes the figures almost interchangeable: emotion is conveyed through postures, fabrics and the diagonal composition. The colors have suffered greatly, and flaking reveals the underlying drawing in places."""
details = [
  "The lady who reads, at the center, an open booklet in her hands.",
  "The long black hair being combed, at the left.",
  "The mauve cloth screen, with floating ribbons, that divides the room.",
  "The white faces with eyes reduced to a line.",
  "The landscapes painted on the partitions, at the top.",
]
themes = ["novel", "court", "women", "reading", "Heian"]
anecdote = """
Another scene from these scrolls, taken from the chapter "Suzumushi", appears on the back of the Japanese 2,000-yen banknote, issued in 2000, beside a portrait of Murasaki Shikibu."""
salle = 5
mur = "nord"
place = 2
largeur = 1.8

[[oeuvres]]
titre = "Chōjū-giga, the Wrestling Match of the Frog and the Hare"
artiste = "Japon, époque de Heian"
annee = "12th century"
image = "choju-giga-sumo.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Chouju_1st_scroll-05.jpg"
technique = "Ink on paper, horizontal handscroll, h. approx. 30 cm (detail of the first scroll)"
collection = "Kōzan-ji Temple, Kyoto"
note = "A frog sends a hare to the mat before the eyes of the spectators: a scene from the most famous comic scroll in Japan, drawn in ink alone."
description = """
The scroll is read from right to left. At the right, at the edge of a meadow planted with grasses and bushes, two standing hares watch a frog and a hare grappling: the frog bites its opponent's ear. Farther left, the outcome of the fight: the hare, thrown, falls on its back, paws in the air, while the victorious frog, standing on its hind legs, opens its mouth wide; a curved line escapes from it, like a cry or a breath. At the far left, other frogs roll on the ground or pick themselves up. There is neither text nor color, only black ink on paper, with a few tufts of grass and the outline of a bank."""
evocation = """
The animals behave like humans: they wrestle, hold festivities, bathe and, farther along in the same scroll, celebrate a service in which a frog takes the role of the Buddha statue and a monkey that of the monk. In it has been seen a satire of the clergy and of the society of the time, but also a simple game, full of humor and observation. The vivacity of the line, the sequence of wordless scenes and the expressiveness of the attitudes mean that these scrolls are often presented as a distant ancestor of manga. The victory of the small frog over the large hare has become one of the most popular images in Japan."""
histoire = """
The Chōjū-jinbutsu-giga, "caricatures of animals and humans", form four scrolls preserved at Kōzan-ji, a mountain temple northwest of Kyoto, restored in the early 13th century by the monk Myōe. They are neither signed nor dated and do not form a homogeneous set: the first, that of the animals, the most famous, dates from the 12th century, others are later. Tradition attributes them to the monk-painter Toba Sōjō, without proof. The temple's seals, affixed at the joins of the sheets, attest to their presence at Kōzan-ji. Designated National Treasures, the scrolls are entrusted on loan to the national museums of Tokyo and Kyoto, and the temple displays copies of them."""
facture = """
The painter works in ink alone, with a supple brush that passes from fine line to heavy line in a single gesture. A few lines suffice for the musculature of a frog's thigh or the momentum of a falling hare; light gray washes mark the fur, the spots on the skin, the ground. The scroll is conceived as a continuous sequence, which the reader unrolls section by section: the scenes follow one another without separation, linked by the landscape, and the movement of the figures draws the eye from right to left, in the direction of reading."""
details = [
  "The frog biting the hare's ear, at the right.",
  "The thrown hare, paws in the air, at the center.",
  "The breath coming out of the victorious frog's mouth.",
  "The two spectator hares, standing at the right.",
  "The rectangular seals of the temple on the joins of the paper.",
]
themes = ["animals", "humor", "satire", "ink", "manga"]
anecdote = """
Unrolled in full, the first scroll, that of the animals, measures more than eleven meters in length, and it contains not a single line of text: the whole story is carried by the image."""
salle = 5
mur = "est"
