[[artistes]]
nom = "Corée, dynastie Goryeo"
vie = "Korea, 918–1392"
biographie = """
The kingdom of Goryeo was founded in 918 by General Wang Geon, who reunified the peninsula and established his capital at Kaesong; the Western name of Korea comes from its own. For nearly five centuries, a court aristocracy governed a deeply Buddhist state: the monasteries, rich and powerful, commissioned sutras copied in gold, religious paintings of great delicacy and bronze ritual objects. It was under Goryeo that Korea carved the some eighty thousand wooden printing blocks of the Buddhist canon, the Tripitaka Koreana, still preserved at Haein-sa temple, and that in 1377 it printed the oldest surviving book in movable metal type, the Jikji, now in the Bibliothèque nationale de France. The kingdom maintained close ties with Song China, whose culture and ceramics it admired. In the 13th century, it suffered the Mongol invasions and became a vassal of the Yuan empire. Weakened, it was overthrown in 1392 by General Yi Seong-gye, founder of the Joseon dynasty."""
style = """
The potters of Goryeo, at first inspired by Chinese celadons, freed themselves from them in the 12th century. They sought a bluish, translucent green, and supple forms, sometimes sculpted as a lotus, a melon or an animal. Their great invention is inlay, sanggam: a decoration incised then filled with white and black clay, under the glaze. Cranes, clouds, willows, reeds and water birds compose poetic landscapes. These celadons remain the symbol of Goryeo art and a reference for Korean ceramists today."""

[[artistes]]
nom = "Corée, dynastie Joseon"
vie = "Korea, 1392–1910"
biographie = """
Founded in 1392 by Yi Seong-gye, the Joseon dynasty reigned for more than five centuries over Korea from its new capital, Hanyang, present-day Seoul. It made Neo-Confucianism the doctrine of the state: civil service examinations, ancestor worship, respect for hierarchy and an ideal of frugality permeated the life of the court and of the scholars, the yangban. In the 15th century, King Sejong had the Korean alphabet, hangeul, created. The country then went through harsh trials: the Japanese invasions of 1592 to 1598, then the Manchu invasions of 1627 and 1636. The 18th century, under the kings Yeongjo and Jeongjo, was a time of renewal, in which scholars and artists took a greater interest in Korean reality, its landscapes and its customs. In the 19th century, Joseon closed itself to the world, then came under pressure from foreign powers; the kingdom became the Korean Empire in 1897, before being annexed by Japan in 1910."""
style = """
To the colorful ceramics of Goryeo, Joseon preferred white porcelain, produced for the court in the official kilns of Gwangju. It is often bare, or decorated in cobalt blue, imported at great cost, or in brown iron oxide. The forms are ample, sober, a little irregular, and the potters accept the accidents of firing. The moon jar is its most famous form. This aesthetic of the natural won over the Japanese tea masters, then, in the 20th century, Western ceramists."""

[[artistes]]
nom = "Jeong Seon"
vie = "Hanyang (Seoul), 1676 – Hanyang, 1759"
biographie = """
Jeong Seon, whose brush name is Gyeomjae, was born in 1676 in Hanyang, the capital of Joseon, into a scholar family of modest means. He studied the Confucian classics and trained in painting, which earned him a reputation very early. He held several official posts, including that of magistrate of Yangcheon, west of the capital. He moved in a circle of scholars and poets, among them Yi Byeong-yeon, his lifelong friend, with whom he exchanged poems and paintings. From his youth he traveled the Kumgang mountains, the "Diamond Mountains", in the northeast of the peninsula, which he painted all his life, notably in a great panoramic view dated 1734. He also depicted the environs of the capital, the banks of the Han River, the pavilions and valleys where he lived, at the foot of Mount Inwang. He died in 1759, at the age of eighty-three, after an exceptionally long and fruitful career. His works are now divided between Korean museums, including the National Museum of Korea and the Kansong Museum, and private collections."""
style = """
Jeong Seon is the master of jingyeong sansu, the "true-view landscape": instead of repeating the ideal mountains of Chinese painting, he paints precise Korean sites that he had traveled. To do so he adapts Chinese techniques: tight vertical strokes for granite cliffs, ink dabs for vegetation, strong contrasts of black and white. His compositions, often compressed and seen from above, give an impression of mass and physical presence. He inspired a whole generation of Korean painters."""

[[artistes]]
nom = "Kim Hong-do"
vie = "Korea, 1745 – c. 1806"
biographie = """
Kim Hong-do, known by his brush name Danwon, was born in 1745 into a family without noble title. Still a child, he studied painting with the scholar and painter Kang Sehwang, who would remain his patron. He entered the Dohwaseo, the royal painting bureau, while young, and became the favorite painter of King Jeongjo: he took part in the official portraits of King Yeongjo and then of Jeongjo, painted screens for the palace, and the king sent him to draw the Kumgang mountains to bring back images of them. As a reward, he received civil service posts, including that of magistrate of Yeonpung district. He excelled in every genre: landscapes, portraits, Buddhist painting, flowers and birds, animals, and above all scenes of daily life, which made his fame. After Jeongjo's death in 1800, his last years were harder, and documents become scarce; he is thought to have died around 1806, ill and without fortune."""
style = """
Kim Hong-do gave Korean genre painting its patent of nobility. His scenes of village, market or workshop, painted on small sheets, capture the gestures of work and leisure with a lively ink line, light colors and a great deal of humor. He eliminates the setting to concentrate attention on the figures, always sketched with accuracy. His influence was immense: his junior Shin Yun-bok and many popular painters followed the path he had opened."""

[[artistes]]
nom = "Ogata Kōrin"
vie = "Kyoto, 1658 – Kyoto, 1716"
biographie = """
Ogata Kōrin was born in 1658 in Kyoto, the second son of a rich silk merchant, the Kariganeya, supplier of luxury fabrics to the Empress Tōfukumon-in and the great families of the court. He grew up among fabrics and kimono patterns, and was initiated into Noh theater, calligraphy and the tea ceremony; his family was related to that of Hon'ami Kōetsu. At his father's death, in 1687, he inherited a fortune that he squandered within a few years through a taste for luxury. He then turned to painting to make a living, and in 1701 received the honorary title of hokkyō. He stayed in Edo from about 1704 to 1709, in the service of a lord and rich merchants, then returned to Kyoto, where he had a house-studio built. He painted screens, scrolls and fans, and designed decorations for the lacquers, fabrics and ceramics of his younger brother, Kenzan. He died in Kyoto in 1716. His motifs, spread by pattern books, nourished Japanese decorative arts, then European Japonisme."""
style = """
Kōrin brings to its height the decorative art inaugurated by Sōtatsu, whom he admired and copied. His forms are stylized, his colors laid in brilliant flat areas on gold, his compositions rhythmic like textile patterns; he can also paint in ink with spontaneity. His name gave the Rinpa school its own, and "Kōrin motifs" became, from the 18th century on, a common repertoire of Japanese craftsmen."""

[[artistes]]
nom = "Hasegawa Tōhaku"
vie = "Nanao (Noto Province), 1539 – Edo, 1610"
biographie = """
Hasegawa Tōhaku was born in 1539 at Nanao, in Noto Province, on the Sea of Japan, and was adopted by a family of dyers. He began by painting Buddhist images for the temples of his region. Around 1571, at over thirty, he settled in Kyoto, where he studied the Chinese paintings preserved in the Zen temples, notably those of Muqi, and frequented the tea master Sen no Rikyū. He rivaled the Kanō school, which dominated the major commissions. In the early 1590s, his workshop decorated a temple founded by Toyotomi Hideyoshi in memory of his son who died in infancy: the paintings of maples and cherry blossoms on a gold ground that survive from it are now at Chishaku-in, in Kyoto. His son and chief collaborator, Kyūzō, died in 1593. Tōhaku received the honorary titles of hokkyō and then of hōgen. Summoned to Edo by the shogun in 1610, he fell ill during the journey and died shortly after his arrival."""
style = """
Tōhaku mastered two opposite manners: decorative painting in bright colors on a gold ground, characteristic of the Momoyama period, and monochrome ink painting, inherited from the Chinese masters and from Sesshū. In the latter, he reaches a new freedom, in which emptiness, mist and gradations of gray count as much as forms. His Pine Trees in the Mist is regarded as the summit of Japanese ink painting."""

[[artistes]]
nom = "Tawaraya Sōtatsu"
vie = "Kyoto, c. 1570 – c. 1640"
biographie = """
Very little is known of Sōtatsu's life, whose exact dates of birth and death are not even known. In the early 17th century he ran in Kyoto a workshop called the Tawaraya, which produced painted fans, decorated papers and paintings for a well-off clientele. In 1602 he took part in the restoration of the illustrated sutras offered in the 12th century by the Taira clan to the Itsukushima shrine, which put him in contact with Heian art. He collaborated with Hon'ami Kōetsu, calligrapher, potter and lacquer designer, a major figure of Kyoto culture: Sōtatsu painted in gold and silver cranes, deer or flowers on long scrolls, on which Kōetsu calligraphed classical poems. His reputation grew: he received the honorary title of hokkyō and worked for court aristocrats and great temples. He died around 1640. His workshop survived him for some time, and the attributions between the master and his successors remain at times debated."""
style = """
Sōtatsu renewed Japanese decorative painting. He took up the subjects of classical literature and painting, but simplified them into large colored forms on gold or silver grounds, with bold framing and vast empty spaces. He developed the technique of tarashikomi, colors laid on a still-damp ground. Kōrin, in the following century, then Sakai Hōitsu took up his style: this current was given the name Rinpa, "the school of Kōrin"."""

[[artistes]]
nom = "Japon, époque de Heian"
vie = "Japan, 794–1185"
biographie = """
The Heian period began in 794, when the Emperor Kanmu established his capital at Heian-kyō, present-day Kyoto, and ended in 1185 with the victory of the Minamoto clan, which soon after founded the first shogunate. For nearly four centuries, a court aristocracy, dominated by the Fujiwara family, cultivated a refined art of living made of poetry, music, perfumes, calligraphy and etiquette. Japan distanced itself from China and invented its own forms: the kana syllabaries, which made it possible to write the Japanese language; a prose literature often by women, such as the Tale of Genji by Murasaki Shikibu or the Pillow Book of Sei Shōnagon; and yamato-e, painting "in the Japanese manner", devoted to the landscapes, seasons and life of the country. The powerful Buddhist monasteries also commissioned paintings and sculptures. At the end of the period, illustrated scrolls, the emaki, enjoyed their first golden age, before the civil wars closed the era."""
style = """
Narrative scrolls, or emaki, unroll from right to left, section by section, in the hands of a reader. They follow two manners: the colorful and meticulous painting of the Tale of Genji, with thick pigments, for court literature; and the ink drawing, lively and animated, full of humor, of the Chōjū-giga or the legends of temples. The painters almost always remain anonymous. These scrolls fixed for centuries the conventions of visual storytelling in Japan."""

[[artistes]]
nom = "Ogata Kenzan"
vie = "Kyoto, 1663 – Edo, 1743"
biographie = """
Ogata Kenzan was born in 1663 in Kyoto, the third son of the rich silk merchant who was also the father of Kōrin, his elder by five years. Unlike his brother, he led a withdrawn and studious life, devoted to the Chinese classics, Zen Buddhism, poetry and calligraphy. He learned ceramics in the circle of Nonomura Ninsei, the great potter of Kyoto. In 1699, he opened his own kiln at Narutaki, northwest of the capital, hence his artist name. There he produced dishes, bowls and vessels for tea and the table, whose decorations, painted by himself or by Kōrin, combine image and poetry. In 1712, he moved into the city of Kyoto itself, where his workshop served a wider clientele. Around 1731, he left for Edo, where he spent the end of his life, still painting and shaping ceramics. He died there in 1743. His name, taken up by successors, gave rise to a line of potters."""
style = """
Kenzan makes ceramics a support for painting and poetry. His pieces, of simple forms, square or flower-shaped, bear decorations painted in iron oxide, cobalt or enamels, with an unprecedented freedom of brush, sometimes accompanied by calligraphed poems. The dialogue with his brother Kōrin fixed an aesthetic that durably marked Japanese ceramics, down to the potters of the 20th century, such as the Englishman Bernard Leach, trained in Japan by a potter of the Kenzan line."""
