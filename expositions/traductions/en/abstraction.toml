[[oeuvres]]
titre = "Das Undbild (The And Picture)"
artiste = "Kurt Schwitters"
annee = "1919"
image = "das-undbild.jpg"
technique = "Assemblage: paper, cardboard, wood and metal, with gouache, on cardboard, 35.8 × 28 cm"
collection = "Staatsgalerie Stuttgart"
note = "Scraps of the city glued and nailed: one of Schwitters’s first Merz pictures, the art of connecting everything with a simple “and”."
description = """
The picture is an assemblage of found objects. At the top, on ochre paper, a large word stands out in black letters: und, that is, and. On the left, a vast white curved form, like a sail or a crescent moon, crosses the composition. At centre right, a bright blue triangle draws the eye. All around are piled fragments of labels, tickets and newspapers, including a commercial address, E. Sökeland & Söhne, Berlin N.W. 21, the number 97 and, at the bottom, the fragment of a word printed in large letters, ferde. Wooden slats, nails, a washer and pieces of metal are fixed to the support, and a large dark curve closes the lower right corner."""
evocation = """
The word und, and, gives the picture its title and states its principle: to connect what was not made to go together. For Schwitters, Merz art consists in combining every possible material, noble or not, and giving them equal value. In the defeated Germany of 1919, where everything seemed to need rebuilding, he gathered the debris of the city, tickets, wrappers, bits of wood, to make a new world from it. One often sees in it the Dada spirit, ironic and anti-bourgeois, but Schwitters remains above all a composer attentive to the balance of forms and colours: his Dada is constructive and poetic rather than destructive."""
histoire = """
During the war, Schwitters worked as an industrial draughtsman in a factory near Hanover. In 1919 he invented the word Merz and showed his first Merz pictures in Berlin, at Herwarth Walden’s Der Sturm gallery, a major venue of the avant-garde. Das Undbild dates from that decisive year. The Berlin Dada club refused to admit him, but he became close to Hans Arp, Raoul Hausmann and Tristan Tzara, and would make Hanover a Dada capital all on his own. Branded a degenerate artist by the Nazis, he left Germany in 1937. The picture now belongs to the Staatsgalerie in Stuttgart."""
facture = """
Schwitters glues, nails and paints. Printed papers, cardboard, wood and metal are assembled and then bound together by paint, which unifies the colours and softens the transitions. The composition radiates from the centre in large diagonals, in the manner of Cubist and Futurist paintings. The range, of browns, ochres and whites, is lifted by the brilliance of the blue. The printed letters are treated as forms in their own right, and the relief of the objects makes the picture leave the flat surface."""
details = [
  "The word und in large black letters, at the very top.",
  "The label E. Sökeland & Söhne, Berlin N.W. 21, on the left.",
  "The number 97, to the right of the blue triangle.",
  "The nails, the wooden slats and the large dark curve at lower right.",
]
themes = ["dada", "collage", "merz", "typography", "salvage"]
anecdote = """
The word Merz comes from a fragment of an advertisement for the Commerz- und Privatbank, a German bank, which Schwitters had cut out and glued into a picture in 1919. He made it the name of all his art, of his magazine and even of himself."""
salle = 5
mur = "nord"
place = 3
