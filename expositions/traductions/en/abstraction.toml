[[artistes]]
nom = "Hilma af Klint"
vie = "Solna (Sweden), 26 October 1862 – Djursholm (Sweden), 21 October 1944"
biographie = """
Born into a family of naval officers, Hilma af Klint studied from 1882 to 1887 at the Royal Academy of Fine Arts in Stockholm, one of the few art schools then open to women. She went on to have a respected career as a portraitist and landscape painter, and made botanical and scientific drawings. But she was also interested in spiritualism and theosophy: from 1896 she met with four friends, the group known as The Five, for séances in which they practised automatic drawing. In 1906 she began the Paintings for the Temple, 193 works completed in 1915, among the very first abstractions in history. The thinker Rudolf Steiner, whom she admired, saw her paintings in 1908 without encouraging them. She continued to paint and write until her death, following an accident, in 1944. She left more than a thousand works and thousands of pages of notebooks, and asked that her abstract work not be shown for twenty years. Revealed in 1986, she is now recognised as a major pioneer of abstraction."""
style = """
Hilma af Klint invents a painting of symbols: spirals, circles, shells, letters and coded words, colours charged with meaning, most often organised in series that tell of an evolution. Her large pastel-toned formats, painted in crisp flat areas, combine the precision of scientific drawing with spiritual imagery. Her rediscovery has forced a rewriting of the history of abstraction, long attributed to Kandinsky, Mondrian and Malevich alone."""

[[artistes]]
nom = "Vassily Kandinsky"
vie = "Moscow, 16 December 1866 – Neuilly-sur-Seine, 13 December 1944"
biographie = """
Kandinsky studied law and economics in Moscow and seemed destined for an academic career before abandoning everything, at thirty, for painting. He left in 1896 for Munich, where he founded a group of artists and lived with the painter Gabriele Münter, in Munich and Murnau. His landscapes gradually freed themselves from representation and, around 1910–1911, he painted his first large abstract canvases. In 1911 he published Concerning the Spiritual in Art and founded the Blaue Reiter, the Blue Rider, with Franz Marc. The war took him back to Russia, where he took part in the art institutions of the revolution. Returning to Germany at the end of 1921, he taught at the Bauhaus from 1922 until its closure by the Nazis in 1933, in Weimar, Dessau and then Berlin. He then settled in Neuilly-sur-Seine, near Paris, where he painted until his death in 1944. Collected very early in the United States by Solomon R. Guggenheim, he is one of the founding artists of the museum that bears his name."""
style = """
Kandinsky moves from the swirling patches of colour of his Munich years to the precise geometry of the Bauhaus period, then to the supple, almost biological forms of his last Parisian years. Throughout, he compares painting to music: colours and forms must act directly on the soul, like sounds. Painter and theorist, he gave abstract art its first founding texts."""

[[artistes]]
nom = "Robert Delaunay"
vie = "Paris, 12 April 1885 – Montpellier, 25 October 1941"
biographie = """
Raised in part by an uncle and aunt after his parents’ separation, Robert Delaunay trained with a theatre decorator before devoting himself to painting. He passed through Neo-Impressionism, admired Cézanne, then approached Cubism with his series devoted to the church of Saint-Séverin and the Eiffel Tower, from 1909. In 1910 he married the painter of Ukrainian origin Sonia Terk, with whom he pursued all his life a shared research on colour. In 1911 Kandinsky invited him to the first Blaue Reiter exhibition in Munich, where he was greatly admired. His Windows and his Circular Forms, from 1912, are among the first non-figurative paintings in France; Apollinaire christened his painting Orphism. After years spent in Spain and Portugal during the war, he returned to Paris, produced in 1937 immense decorations for the International Exposition, then died of cancer in Montpellier in 1941."""
style = """
Delaunay makes colour the true subject of the painting. Drawing on the chemist Chevreul’s theories of simultaneous contrast, he juxtaposes complementary colours that vibrate and create movement without resorting to drawing. His coloured discs and circles influenced the painters of the Blaue Reiter and opened the way to a luminous, joyful abstraction."""

[[artistes]]
nom = "Juan Gris"
vie = "Madrid, 23 March 1887 – Boulogne-sur-Seine, 11 May 1927"
biographie = """
José Victoriano González-Pérez studied engineering in Madrid, then turned to drawing. In 1906 he settled in Paris, at the Bateau-Lavoir in Montmartre, where he saw Cubism being born in the studio of his neighbour and compatriot Picasso. To live, he drew for satirical newspapers such as L’Assiette au beurre. He devoted himself to painting from 1910 and exhibited for the first time in 1912, at the Salon des Indépendants. The same year, he experimented with papiers collés and signed a contract with the dealer Daniel-Henry Kahnweiler. During the war he stayed in France, in great poverty, and became one of the most rigorous representatives of Cubism. In the 1920s he designed sets and costumes for Diaghilev’s Ballets Russes and set out his ideas in lectures. Ill, he died in 1927 at forty, in Boulogne-sur-Seine, leaving a body of still lifes of great clarity."""
style = """
Gris is the great architect of Cubism. He starts from an abstract structure, a grid of lines and coloured planes, and then makes objects appear within it: he said, in essence, that he made a bottle out of a cylinder, where Cézanne made a cylinder out of a bottle. His bold colours, calculated composition and crisp forms marked Purism and all the constructed painting of the 1920s."""

[[artistes]]
nom = "Umberto Boccioni"
vie = "Reggio Calabria, 19 October 1882 – Verona, 17 August 1916"
biographie = """
The son of a frequently transferred civil servant, Umberto Boccioni grew up in several Italian cities before settling in Rome at the turn of the century. There, with Giacomo Balla, he discovered Divisionist painting, made of touches of pure colour, and became friends with Gino Severini. After trips to Paris and Russia, he settled in Milan in 1907. In 1910 he met the poet Filippo Tommaso Marinetti, founder of Futurism, and drew up with Carrà, Russolo, Balla and Severini the manifesto of the Futurist painters. He became its principal painter and theorist, and in 1912 took part in the exhibition that made the movement known in Paris, London and Berlin. He also turned to sculpture, published a manifesto on the subject and in 1914 a book, Futurist Painting and Sculpture. He volunteered in 1915 and died in August 1916, aged thirty-three, from a fall from his horse during a military exercise near Verona."""
style = """
Boccioni wants to paint the movement and energy of modern life rather than motionless objects. He moves from the divided brushstroke, in long filaments of colour, to a construction in planes and lines of force inspired by Cubism. His states of mind, his cities under construction and his dynamic sculptures made Italian Futurism one of the major avant-gardes before 1914."""

[[artistes]]
nom = "Fernand Léger"
vie = "Argentan, 4 February 1881 – Gif-sur-Yvette, 17 August 1955"
biographie = """
The son of a Norman cattle breeder, Fernand Léger first trained as an architectural draughtsman, then settled in Paris in 1900. He discovered Cézanne, frequented La Ruche, the artists’ colony in Montparnasse, and around 1911–1913 invented a Cubism made of tubular forms and colour contrasts. Mobilised in 1914, he was gassed at Verdun in 1916. The experience of the front and of machines transformed his art: in the 1920s he painted the city, objects and workers in pure colours, made the film Ballet mécanique in 1924 and took part in the Esprit Nouveau movement with Le Corbusier and Ozenfant. He taught in his studio to many students from around the world. A refugee in the United States from 1940 to 1945, he returned to France, joined the Communist Party, produced many large compositions, mosaics, stained-glass windows and ceramics, and died in 1955 in Gif-sur-Yvette."""
style = """
Léger paints the modern world with simple, powerful forms: cylinders, black outlines, flat areas of bright colours. He treats man and machine with the same solidity and seeks a clear art, accessible to all, on the scale of the wall and the city. His language influenced poster art, design and the monumental art of the 20th century."""

[[artistes]]
nom = "Kasimir Malevitch"
vie = "Kyiv, 23 February 1879 – Leningrad, 15 May 1935"
biographie = """
Born in Kyiv into a family of Polish origin, Kasimir Malevich grew up in the Ukrainian countryside, whose icons and folk art left a lasting mark on him. Settled in Moscow in 1907, he moved very quickly from Impressionism to a Primitivism inspired by peasants, then to Cubo-Futurism. In 1913 he designed the sets for the Futurist opera Victory over the Sun. In December 1915, in Petrograd, he presented the Black Square and founded Suprematism, a painting of pure geometric forms on a white ground. After the revolution of 1917, he held official positions, taught at Vitebsk, where he founded the Unovis group, then directed a research institute in Leningrad. In 1927 he exhibited in Warsaw and Berlin and left part of his works there. Suspect in the eyes of the Stalinist regime, briefly arrested in 1930, he returned to figurative painting before dying of cancer in 1935."""
style = """
Malevich reduces painting to its first elements: the square, the circle, the cross, pure colour floating on an infinite white space. Suprematism seeks to express pure sensation, beyond any object. His Black Square has become the symbol of modern art’s radical break, and his work influenced Constructivism, design and Minimal art."""

[[artistes]]
nom = "Piet Mondrian"
vie = "Amersfoort (Netherlands), 7 March 1872 – New York, 1 February 1944"
biographie = """
The son of a Calvinist schoolteacher, Pieter Mondriaan trained at the Academy of Fine Arts in Amsterdam and at first painted Dutch landscapes, windmills, trees and polders. Close to theosophy, he discovered Cubism in Paris, where he lived from 1912 to 1914 and simplified the spelling of his name to Mondrian. Stuck in the Netherlands during the war, he founded in 1917, with Theo van Doesburg, the magazine De Stijl, which gave its name to the movement. Back in Paris in 1919, he worked out Neoplasticism: black lines, primary colours and white. His studio on the rue du Départ, arranged like one of his compositions, became a place of pilgrimage for artists. He fell out with Van Doesburg, who introduced the diagonal. In 1938, the threat of war drove him to London, then in 1940 to New York, whose jazz and rhythms inspired his last canvases. He died there of pneumonia in 1944."""
style = """
Mondrian took abstraction to its most pared-down point: only horizontal and vertical lines, the three primary colours, white, black and grey. His asymmetrical compositions seek a dynamic balance, the image of a universal harmony. They have lastingly marked architecture, design, typography and fashion."""

[[artistes]]
nom = "Paul Klee"
vie = "Münchenbuchsee (Switzerland), 18 December 1879 – Muralto (Switzerland), 29 June 1940"
biographie = """
The son of a German music teacher and a Swiss singer, Paul Klee grew up in Bern and long hesitated between music and painting. He studied in Munich, where he settled and became friends with Kandinsky and the artists of the Blaue Reiter. In 1914, a trip to Tunisia with August Macke and Louis Moilliet revealed colour to him: he then noted in his diary that colour and he were one. Mobilised during the war, he was called in 1921 to the Bauhaus, in Weimar and then Dessau, where he taught for ten years and lived next door to Kandinsky. A professor at the Düsseldorf Academy from 1931, he was dismissed by the Nazis in 1933 and returned to Bern. Stricken with a serious skin disease, scleroderma, he nevertheless painted hundreds of works with renewed energy in his last years, before dying in 1940 in Ticino."""
style = """
Klee invents a poetic universe where signs, writing, figures, landscapes and imaginary architectures mingle. He moves freely from abstraction to almost childlike drawing, with humour and fantasy, but relying on a very rigorous theoretical reflection on line, colour and rhythm, inspired by music. His immense oeuvre, of more than nine thousand numbered works, influenced Surrealism and post-war abstraction."""

[[artistes]]
nom = "Kurt Schwitters"
vie = "Hanover, 20 June 1887 – Kendal (England), 8 January 1948"
biographie = """
The son of well-off Hanover shopkeepers, Kurt Schwitters studied painting at the Dresden Academy. During the war he was employed as an industrial draughtsman in a factory. In 1919 he invented Merz, an art made of all materials, refuse included, and exhibited his first collage-pictures in Berlin at the Der Sturm gallery. Rejected by the Berlin Dadaists, he created his own Dada in Hanover with his magazine Merz, his poems, including the Ursonate, a sonata made of sounds without meaning, and his performances. In his house, he spent years building the Merzbau, an interior architecture that took over several rooms. Branded a degenerate artist by the Nazis, he fled to Norway in 1937, then to Britain in 1940, where he was interned for several months on the Isle of Man. He ended his life in the Lake District, where he began a last Merzbau in a barn, and died in Kendal in 1948. The Hanover Merzbau was destroyed by a bombing raid in 1943."""
style = """
Schwitters makes art from everything: tickets, labels, wood, string, words and sounds. But his collages remain rigorous compositions, in which each fragment counts for its colour and form, at the crossroads of Dada and Constructivism. His practice of assemblage and installation opened the way to Pop art, the Nouveaux Réalistes and today’s art."""
