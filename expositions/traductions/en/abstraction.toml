[exposition]
ordre = 190
nom_court = "Abstraction"
mouvement = "Avant-gardes and Abstraction"
cadre = "noir"
couleur = "#b8261b"
titre = "The Avant-Gardes, the Birth of Abstraction"
artiste = "Kandinsky, Mondrian, Malevich, Klee, af Klint…"
dates = "1907–1930"
accroche = "Virtual exhibition · Solomon R. Guggenheim Museum, New York"
introduction = """
Between 1907 and 1930, in Sweden, Paris, Milan, Moscow, Weimar and Hanover, painters gave up imitating the visible world: colour, line and form became their own subject. Cubism, Futurism, Orphism, Suprematism, De Stijl, the Bauhaus and Dada are brought together here in ten works, from the secret canvases of Hilma af Klint to Malevich’s black square and Mondrian’s black lines. The building is inspired by the Guggenheim Museum in New York, designed by Frank Lloyd Wright for a collection born of Solomon R. Guggenheim’s passion for Kandinsky: a low hall, a very tall white rotunda and exhibition bays all around."""
vitrine = "composition-viii.jpg"

[musee]
nom = "Solomon R. Guggenheim Museum"
ville = "New York, United States"
architecte = "Frank Lloyd Wright"
construction = "1956–1959"
presentation = """
The collector Solomon R. Guggenheim, advised by the painter Hilla Rebay, assembled in the 1930s a body of non-representational art centred on Kandinsky, shown from 1939 in a first Museum of Non-Objective Painting. In 1943 he commissioned Frank Lloyd Wright to design a building to house it; the project took sixteen years, and the architect died six months before the opening, in October 1959, on Fifth Avenue, opposite Central Park. The museum turns its back on Manhattan’s grid: a spiral of white concrete, wider at the top than at the bottom, wraps around a rotunda lit by a skylight. Visitors descend a continuous ramp while contemplating the works hung on the curving wall. Inscribed as a UNESCO World Heritage Site in 2019 along with other buildings by Wright, the Guggenheim holds one of the finest collections of Kandinsky in the world."""
ici = """
ARTEON follows the sequence Wright intended, but without the ramp. The entrance hall, only 4 metres high and narrow, leads north into The Rotunda · Towards Abstraction, a square 18 metres on each side beneath a skylight 18 metres high. From there, one reaches three more intimate bays, 5 metres high: the West Bay · Cubism and Futurism, the East Bay · Suprematism and De Stijl, then, at the far end, the North Bay · Dada and Bauhaus. All the walls are a warm white, as in the museum."""

