[[oeuvres]]
titre = "Senecio"
artiste = "Paul Klee"
annee = "1922"
image = "senecio.jpg"
technique = "Oil on gauze mounted on cardboard, 40.5 × 38 cm"
collection = "Kunstmuseum Basel, Basel"
note = "A head round as a moon, made of squares of colour: a mischievous old man, between theatre mask and child’s game."
description = """
Against an orange ground, a large, perfectly round head occupies almost the whole surface. It is cut into rectangles of soft colours: yellow, pink, white, ochre. Two round red eyes look at the viewer. They are not alike: above the left eye rises a white triangle, like a raised eyebrow, while the right eye is topped by a fine green arc. The nose is only a line, the mouth two small violet squares. The neck is a stack of coloured rectangles, and the shoulders, at the bottom, draw a large arc. On the left, one can read Klee’s signature and the year 1922."""
evocation = """
The title plays on words: senecio, groundsel, is a plant whose Latin name comes from senex, old man, and the German subtitle Baldgreis means roughly soon an old man. The face is part clown, part theatre mask and part puppet, which Klee liked to make for his son Felix. The asymmetry of the eyes gives it an expression at once astonished, sceptical and amused. It has sometimes been seen as a disguised self-portrait. Klee shows that a face can be born from a few geometric forms and that colour alone can express a character, with a humour and freedom close to a child’s drawing, but highly learned."""
histoire = """
Klee painted Senecio in 1922 in Weimar, where he had been teaching at the Bauhaus since 1921. He gave courses there on form and colour and met up again, in 1922, with Kandinsky, his friend since the time of the Blaue Reiter. Meticulous, Klee entered each of his works in a personal catalogue: this one bears the number 181 for the year 1922, visible near his signature. The painting is today one of the best known in the Kunstmuseum Basel. In 1933, the Nazis would drive Klee from his teaching post in Düsseldorf; he then took refuge in Bern, his native city, and several of his works would be shown as degenerate art in 1937."""
facture = """
Klee paints in oil on gauze, a light fabric, prepared and then glued onto cardboard. The rough surface, scraped in places, shows the weave and gives the colours a matte, powdery look, close to fresco. The circle of the face, drawn as if with a compass, is divided into an irregular checkerboard of warm, light tones, recalling his paintings of coloured squares. Colour is the true subject: at the Bauhaus, Klee studied the way neighbouring tones answer and modify one another."""
details = [
  "The white triangle above the left eye, like a raised eyebrow.",
  "The fine green eyebrow, in an arc, above the right eye.",
  "The two small violet squares that form the mouth.",
  "The signature and the number 1922 / 181, to the left of the face.",
]
themes = ["face", "mask", "humour", "colour", "bauhaus"]
anecdote = """
Klee was also an excellent violinist. As a young man he played in the Bern orchestra and hesitated between music and painting. He married a pianist, Lily Stumpf, and music nourished all his thinking about rhythm in painting."""
