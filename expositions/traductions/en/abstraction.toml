[[oeuvres]]
titre = "The Ten Largest, No. 7, Adulthood"
artiste = "Hilma af Klint"
annee = "1907"
image = "dix-plus-grandes-7.jpg"
technique = "Tempera on paper mounted on canvas, 315 × 235 cm"
collection = "Hilma af Klint Foundation, Stockholm"
note = "An abstraction over three metres tall, painted years before Kandinsky’s, and kept hidden for nearly eighty years."
description = """
Against a pale mauve ground rises an immense yellow form, made of two superimposed masses that touch at a single point, at the centre of the painting, like an hourglass or a seed splitting open. The upper mass, marked with the Roman numerals I and II, is crossed by spindles traced in red, pink, white and dotted black; the lower one, numbered III, is striped with black lines that tighten towards the bottom. All around float smaller motifs: green and yellow discs at the top, red clover-shaped leaves on the left, a black flower, eggs, spirals and white loops that resemble handwriting. At the very bottom, beneath a black frieze, a word is traced in cursive letters: vestalasket."""
evocation = """
The Ten Largest tell the ages of human life: two paintings for childhood, two for youth, four for adulthood and two for old age. This one belongs to maturity, and has been read as an image of flowering: forms that grow, divide and bloom like living organisms. The letters, invented words and colours belong to a personal symbolic vocabulary, nourished by theosophy and botany; historians read in it in particular the union of opposites, of masculine and feminine. For Hilma af Klint, painting was meant to make visible an invisible spiritual world. Her rediscovery, since the 1980s, has upset the history of abstraction, long told without her and without women."""
histoire = """
From the 1890s, Hilma af Klint took part with four friends, the group known as The Five, in spiritualist séances. In 1906 she began what she described as a commission received from spiritual guides: the Paintings for the Temple, a cycle of 193 works completed in 1915. The Ten Largest form its heart; she painted them in the autumn of 1907, at a very rapid pace, in her Stockholm studio. She showed them only to a few close friends and asked that her abstract works not be exhibited until twenty years after her death. Kept by her nephew and then by a foundation, they appeared in 1986 in Los Angeles, in the exhibition The Spiritual in Art, then triumphed at the Moderna Museet in Stockholm in 2013 and at the Guggenheim in New York in 2018."""
facture = """
The painting is made in tempera on large sheets of paper joined together, then mounted on canvas: a giant format that the artist worked on laid flat on the floor. The colours are spread in flat areas, without modelling or shadow, and ringed with crisp outlines. The palette, of mauve, golden yellow, green and pink, has nothing of the academic painting of her time. Trained at the Royal Academy of Fine Arts in Stockholm, Hilma af Klint was also a precise botanical draughtswoman: one senses this in the regularity of the curves and the symmetry of the composition, organised along a vertical axis."""
details = [
  "The Roman numerals I, II and III, placed on the large yellow forms.",
  "The single point where the two masses touch, at the centre of the painting.",
  "On the left, the red stem bearing clover-shaped leaves.",
  "On the right, white loops that seem to form an unknown script.",
  "At the very bottom, the word vestalasket traced in cursive letters.",
]
themes = ["ages of life", "spirituality", "botany", "symbols", "abstraction"]
anecdote = """
The Hilma af Klint exhibition shown at the Guggenheim in New York in 2018 and 2019, where the Ten Largest series was hung along the rotunda’s ramp, drew more than 600,000 visitors: it became the best-attended in the museum’s entire history."""
salle = 2
mur = "nord"
place = 4
largeur = 2.35

[[oeuvres]]
titre = "Composition VIII"
artiste = "Vassily Kandinsky"
annee = "1923"
image = "composition-viii.jpg"
technique = "Oil on canvas, 140 × 201 cm"
collection = "Solomon R. Guggenheim Museum, New York"
note = "Painted at the Weimar Bauhaus in July 1923: circles, triangles and straight lines play like the instruments of an orchestra."
description = """
Against a light ground, cream and bluish, with no horizon or recognisable object, dozens of geometric forms float. At upper left, a large black circle with a violet heart, surrounded by a pink halo, dominates the canvas, accompanied by a small red disc. At the centre stands a large triangle pointing upward, crossed by lines. Black-and-white or coloured checkerboards shoot out diagonally; a row of semicircles lines up beneath like a series of arches. On the right, bundles of parallel lines race upward, between small transparent circles, and a grid of fine lines stands out against the ground. Elsewhere, yellow, blue or violet discs, often haloed, punctuate the surface like notes."""
evocation = """
Kandinsky conceived painting as music for the eyes: he called his abstract canvases Impressions, Improvisations and Compositions, reserving the last title for his most considered works. Here each form has its own voice: the acute angle of the triangle, the tension of the straight lines, the calm of the circles. The large black and pink circle at upper left has often been compared to a star that governs the whole painting; Kandinsky would later write that the circle unites within itself the greatest oppositions. Compared with the whirlwinds of colour from before 1914, the canvas marks a turning point: in contact with Russian Constructivism and then the Bauhaus, emotion now passes through a precise geometry, without losing any of its lyricism."""
histoire = """
Having returned to Germany at the end of 1921 after seven years in Russia, Kandinsky was called in 1922 by the architect Walter Gropius to the Bauhaus in Weimar, the school that sought to unite art, craft and industry. He taught form and colour there and painted this eighth Composition in July 1923. From 1930, the American magnate Solomon R. Guggenheim, guided by the artist and adviser Hilla Rebay, visited Kandinsky and bought many of his canvases. Composition VIII entered his foundation, created in 1937, then the Museum of Non-Objective Painting opened in New York in 1939, forerunner of today’s Guggenheim: it has remained one of its emblems."""
facture = """
The forms are drawn with ruler and compass, then filled with colours laid in crisp flat areas, without impasto. The light, slightly nuanced ground creates a space without fixed depth in which the elements seem to float at different distances. The painter plays on contrasts: very fine black lines against broad surfaces, sharp edges against blurred halos, as around the large circle. There is neither a single centre nor symmetry: balance arises from tensions that offset one another, which Kandinsky would analyse in his book Point and Line to Plane, published by the Bauhaus in 1926."""
details = [
  "The soft pink halo surrounding the large black circle at upper left.",
  "The black-and-white checkerboards, set diagonally to the left of the central triangle.",
  "The row of semicircles lined up like arches, beneath the centre of the canvas.",
  "The small grid of fine lines, on the right, with its pink squares.",
]
themes = ["music", "geometry", "circle", "bauhaus", "abstraction"]
anecdote = """
Kandinsky painted ten large Compositions between 1910 and 1939. The first three were destroyed during the Second World War: they are known only through black-and-white photographs."""
salle = 2
mur = "nord"
place = 2
largeur = 2.0

[[oeuvres]]
titre = "The Red Eiffel Tower"
artiste = "Robert Delaunay"
annee = "1911–1912"
image = "tour-eiffel-rouge.jpg"
technique = "Oil on canvas, 125 × 90.3 cm"
collection = "Solomon R. Guggenheim Museum, New York"
note = "The symbol of modern Paris twists and fragments in the light: one of Delaunay’s Towers, between Cubism and pure colour."
description = """
The Eiffel Tower, painted a brick red, occupies the full height of the canvas. Its four piers splay widely at the bottom, as if seen from below, while the narrow summit touches the upper edge. Its silhouette is not straight: the first platform twists, the uprights bend, and the tower seems to totter. Around it, the buildings of Paris are reduced to grey, blue and white facets that interlock. On the right, big white clouds curl into balls; at the top, dark blue panels frame the scene like curtains drawn before a window. At lower right, a large pale yellow curve glides along the edge, near the painter’s signature."""
evocation = """
For Delaunay, the tower of 1889 is the emblem of the new world: iron, the engineer, the giant city, the wireless telegraphy whose antenna was installed at its summit. In breaking it up, he does not destroy it; he seeks to paint the experience of the person looking at it: vertigo, the head tilting up and down, viewpoints superimposed. The painter himself called this period destructive, when architecture breaks apart under the effect of light. It has been read as a joyful celebration of modernity, but also as a premonition of an unstable world on the eve of the Great War. His poet friends, Apollinaire and Blaise Cendrars, would also sing the tower."""
histoire = """
Delaunay painted the Eiffel Tower from 1909 and kept returning to it until the end of the 1920s. In 1910 he married the painter Sonia Terk, with whom he would pursue all his research on colour. In spring 1911, his Towers were hung at the Salon des Indépendants in the Cubists’ room; the same year, Kandinsky invited him to the first Blaue Reiter exhibition in Munich, where his canvases impressed the young German painters. In 1912, Apollinaire coined for him the word Orphism, which designates a painting in which colour alone becomes the subject. This red version, painted in 1911 and 1912, now belongs to the Guggenheim in New York, which holds several of Delaunay’s Towers."""
facture = """
Delaunay borrows from Cubism the fragmentation into facets and the multiplication of viewpoints, but he rejects the browns and greys of Picasso and Braque: the tower’s vivid red bursts against the blues and whites. The brushwork is free, visible, laid in short planes. The composition rests on a contrast of complementary colours and on a swirling movement, underlined by the curves of the clouds and the right edge. The legacy of Cézanne, whom Delaunay admired, can be read in the construction of the houses in small cubes."""
details = [
  "The tower’s first platform, twisted as if slipping away.",
  "The big white clouds in balls, on the right, above the rooftops.",
  "The dark blue panels at the top, which suggest curtains.",
  "The painter’s signature, at lower right, near the pale yellow curve.",
]
themes = ["paris", "eiffel tower", "modern city", "orphism", "movement"]
anecdote = """
Built for the Universal Exposition of 1889 and slated for demolition after twenty years, the Eiffel Tower was saved by radio: its wireless telegraphy antenna made it too useful. It remained the tallest structure in the world until 1930."""
salle = 2
mur = "sud"
place = 2
largeur = 1.05

[[oeuvres]]
titre = "Portrait of Pablo Picasso"
artiste = "Juan Gris"
annee = "1912"
image = "portrait-de-picasso.jpg"
technique = "Oil on canvas, 93.3 × 74.4 cm"
collection = "Art Institute of Chicago"
note = "The young Gris pays tribute to his elder and neighbour at the Bateau-Lavoir, palette in hand: his first major Cubist canvas."
description = """
A man with short black hair is seated, his torso turned to the left, his face in three-quarter view. His features are cut into facets: the nose, eyes and mouth are repeated slightly offset, as if seen from several angles. He wears a light shirt and a blue jacket, whose big round buttons stand out like small reliefs. In his right hand, at lower right, he holds a palette loaded with spots of blue, yellow, red and black: he is a painter at work. Behind him, the background is made only of grey, beige and blue triangles and lozenges, cut by large regular obliques. At lower right, an inscription dedicates the canvas to Pablo Picasso."""
evocation = """
This portrait is at once a tribute and a declaration. A tribute to Picasso, inventor of Cubism with Braque, whom Gris watched at work every day at the Bateau-Lavoir; a declaration of independence too, for Gris asserts in it a manner of his own, clearer, more ordered, almost mathematical. Historians stress how much this rigorous Cubism contrasts with the more intuitive one of his elders: where Picasso and Braque dissolve forms in a haze of facets, Gris builds a luminous grid. By showing his sitter palette in hand, he celebrates the painter as inventor of new forms, at the very moment when he himself was entering the history of the avant-garde."""
histoire = """
Born in Madrid, Gris arrived in Paris in 1906 and settled in the Bateau-Lavoir, the Montmartre studio complex where Picasso lived. He first earned his living by drawing for satirical newspapers and devoted himself fully to painting only from 1910. In spring 1912 he showed this portrait at the Salon des Indépendants: it was his first public appearance, and critics immediately noticed this newcomer to Cubism. Soon the dealer Daniel-Henry Kahnweiler, Picasso’s and Braque’s dealer, put him under contract. The painting is now at the Art Institute of Chicago, thanks to a gift from the collector Leigh B. Block."""
facture = """
The whole canvas rests on a network of large oblique lines, parallel and regularly spaced, which cut it into bands and lozenges. In each cell, Gris treats light and shadow separately, which makes the volumes vibrate like a crystal. The palette is restricted to blues, greys and browns, with a few warm notes on the face and the palette. The paint is applied in small, tight touches, almost pointillist, which give the surface a regular texture."""
details = [
  "The palette held at lower right, with its spots of pure colour.",
  "The shirt buttons, drawn as small circles in relief.",
  "The doubled face, whose eyes seem seen from two angles.",
  "The inscription at lower right, dedicating the painting to Pablo Picasso.",
]
themes = ["portrait", "cubism", "painter", "friendship", "geometry"]
anecdote = """
Juan Gris is a pseudonym: the painter’s name was José Victoriano González-Pérez. He died at forty, in 1927, of a kidney disease, after designing sets and costumes for Diaghilev’s Ballets Russes."""
salle = 3
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "The City Rises"
artiste = "Umberto Boccioni"
annee = "1910"
image = "ville-qui-monte.jpg"
technique = "Oil on canvas, 199.3 × 301 cm"
collection = "Museum of Modern Art, New York"
note = "One of the first great Futurist paintings: horses, workers and building sites swept up by the same energy, in the suburbs of Milan."
description = """
At the centre of the canvas, a gigantic red horse with a blue collar charges head down to the left, so large that it occupies almost the whole width. Tiny men cling to its reins and lean back with all their weight, arms outstretched, to hold it. On the left, another horse, white, rears up in an explosion of mane. In the background, beneath a pale sky, rise buildings under construction covered in scaffolding, smoking factory chimneys and silhouettes of trams. Men, beasts and setting dissolve into streaks of light: everything seems swept up in a single whirlwind, from bottom to top and from right to left."""
evocation = """
Boccioni explained that he wanted to make a great synthesis of labour, light and movement. The subject is the modern city in the process of being born: the outskirts of Milan, its building sites and factories. The horse, an ancient force, and the worker, a new hero, join together to build the future. The painting illustrates the Futurist cult of energy, speed and the machine, proclaimed by the poet Marinetti in 1909. It has been read as an optimistic hymn to progress; with hindsight one also reads in it the fascination with force and violence that would lead many Futurists to exalt war."""
histoire = """
Boccioni painted this canvas in Milan in 1910 and early 1911, a few months after signing, with Carrà, Russolo, Balla and Severini, the manifesto of the Futurist painters. The painting, first presented under the title Work, was exhibited in Milan in 1911, then in 1912 in the Futurists’ touring exhibition, which caused a scandal in Paris, London and Berlin. During this tour the composer Ferruccio Busoni bought it; Boccioni would make his portrait in 1916, a few weeks before dying. The Museum of Modern Art in New York acquired it in 1951."""
facture = """
Boccioni uses the divided brushstroke he learned in Rome from Giacomo Balla: long filaments of pure colour, laid side by side, that follow the lines of force of the movement rather than describing objects. The horse’s red is set against the blue of its collar and the luminous whites. The great diagonal rising from the bottom pulls the whole painting along. The format, three metres wide, is that of the great history paintings: figuration still survives, but it comes apart under the speed."""
details = [
  "The workers leaning back, arms outstretched, clinging to the reins.",
  "The blue collar of the red horse, at the centre of the canvas.",
  "The scaffolding and the smoking chimneys, at the very top right.",
  "The signature U. Boccioni, at lower right.",
]
themes = ["futurism", "city", "labour", "horses", "energy", "milan"]
anecdote = """
Boccioni’s most famous sculpture, Unique Forms of Continuity in Space, modelled in 1913, appears today on the Italian national face of the 20-cent euro coin."""
salle = 3
mur = "nord"
place = 2
largeur = 3.0

[[oeuvres]]
titre = "The City"
artiste = "Fernand Léger"
annee = "1919"
image = "la-ville.jpg"
technique = "Oil on canvas, 231.1 × 298.4 cm"
collection = "Philadelphia Museum of Art"
note = "The great post-war city in flat areas of pure colour: posters, girders, staircases and machine-men."
description = """
The canvas is cut into vertical bands of bold colours, like a street seen through a succession of posters and façades. At centre right stands a broad mauve column. At upper left and right, metal pylons draw their black lattices against the sky. Everywhere, stencilled letters, including a large B at lower left, recall advertising signs. In the middle, a staircase with black and white steps is climbed by two grey figures, their bodies made of cylinders like automatons. On the right, a panel framed in blue shows a green silhouette. Red, yellow, blue, green and black answer one another without ever mixing."""
evocation = """
Léger celebrates the modern city as a spectacle: posters, signals, metal and movement. There is no street in perspective, but a series of juxtaposed impressions, like those of the passer-by crossing the city at full speed, or like the montage of a film. The men, reduced to mechanical forms, are not crushed by the machine: they have the same dignity as the objects, the same solidity. Painted just after the Great War, the canvas expresses the confidence of reconstruction and the optimism of an industrial world. It nourished poster art, graphic design and mural painting of the 20th century."""
histoire = """
Mobilised in 1914, Léger spent two years at the front as a sapper before being gassed at Verdun in 1916. He came back fascinated by machines and by the simple men he had lived alongside. In 1919 he painted The City, the largest canvas of his so-called mechanical period, and exhibited it at the Salon des Indépendants of 1920. The painting was bought by the American painter and collector Albert Eugene Gallatin, who showed it in his Museum of Living Art, opened in 1927 at New York University, one of the first museums of modern art in the United States. It then entered the Philadelphia museum with his whole collection."""
facture = """
Léger lays his colours in pure, outlined flat areas, without gradation, in the manner of a poster. Only the figures are modelled in grey, like polished pieces of metal. The principle is that of contrast, which the painter theorised: contrast of colours, of straight and curved forms, of flat surfaces and volumes. The stencilled letters and the division into vertical panels give an impression of collage without being one. The format, nearly three metres wide, announces its mural ambition."""
details = [
  "The two grey figures, shaped like automatons, on the central staircase.",
  "The large stencilled B, at lower left.",
  "The mauve column that cuts across the canvas, at centre right.",
  "The signature F. Léger, Paris 19, at lower right.",
]
themes = ["city", "machine", "advertising", "colour", "modernity"]
anecdote = """
Léger recounted that it was at the front, before the open breech of a 75 mm gun in full sunlight, that he discovered the beauty of the mechanical object: a revelation stronger, he said, than all the museums."""
salle = 3
mur = "ouest"
place = 2
largeur = 2.95

[[oeuvres]]
titre = "Black Square"
artiste = "Kasimir Malevitch"
annee = "1915"
image = "carre-noir.jpg"
technique = "Oil on linen, 79.5 × 79.5 cm"
collection = "Tretyakov Gallery, Moscow"
note = "The zero point of painting: a black square on a white ground, hung in 1915 in the place of an icon."
description = """
On a square canvas, a large black quadrilateral is set at the centre of a white ground, which surrounds it with a wide margin. Nothing else: no object, no horizon, no shadow. Up close, however, the square is neither perfectly square nor perfectly black. Its sides are not quite parallel, its angles not quite right angles. Its surface is covered with a tight network of cracks, through which lighter colours, reddish or cream, show from the layers painted beneath. The white of the ground, also crazed, has taken on a grey and yellowed tint with time. The painting has aged like an ancient object."""
evocation = """
Malevich calls Suprematism the supremacy of pure sensation in art: painting frees itself from the obligation to represent. The black square is for him the zero point of forms, the origin from which everything can be rebuilt. By hanging it in the upper corner of the room, the place reserved for icons in Russian homes, he makes it a sacred image of a new kind. It has been read as a gesture of clean slate, even nihilism, but also as a mystical experience, a window opened onto the infinite. Painted in the middle of the war, two years before the revolution, the square has become the very icon of modern art."""
histoire = """
The painting was shown for the first time in December 1915 in Petrograd, at The Last Futurist Exhibition of Paintings 0.10, where Malevich presented his first Suprematist works. He would later date it to 1913, to tie it to the sets he had designed for the Futurist opera Victory over the Sun. He would paint other versions in the 1920s and early 1930s. At his death, in 1935, a black square was fixed to the hearse. Kept at the Tretyakov Gallery, this first square, very fragile, was studied with X-rays in 2015: two earlier compositions, one Cubo-Futurist, the other proto-Suprematist, lie hidden beneath the black."""
facture = """
Malevich painted his square freehand, without a strict ruler, over older compositions. The black is made of several layers, hence the cracking that now reveals the tones beneath. The white ground is not bare canvas but a painted layer, also worked with the brush. The irregularity of the edges, visible up close, gives the square a slight vibration: it is not a geometric figure, but a living form, set on a white space that seems limitless."""
details = [
  "The network of cracks covering the whole black surface.",
  "The light colours showing through the fissures in the black.",
  "The edges of the square, slightly irregular and not quite parallel.",
  "The white margin, also crazed and yellowed by time.",
]
themes = ["suprematism", "monochrome", "icon", "geometry", "revolution"]
anecdote = """
In 2015, researchers at the Tretyakov Gallery deciphered in the white margin a pencil inscription attributed to Malevich: an allusion to a joke by Alphonse Allais, who had published a humorous black rectangle in 1897."""
salle = 4
mur = "est"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Composition with Red, Blue and Yellow"
artiste = "Piet Mondrian"
annee = "1930"
image = "composition-rouge-bleu-jaune.jpg"
technique = "Oil on canvas, 45 × 45 cm"
collection = "Kunsthaus Zürich"
note = "Three primary colours, white and black lines: the most famous form of Neoplasticism, painted in Paris for an architect friend."
description = """
A large red square occupies almost the whole upper right quarter, extending well beyond the centre. It is bordered on the left and below by thick black lines, vertical and horizontal, which cut the rest of the canvas into rectangles. At lower left, a small blue rectangle; at lower right, tiny, a yellow rectangle, topped by a short black stroke. The other surfaces are white. Some black lines stop short of the edge, others touch it. There is no diagonal, no curve, no shadow: only straight lines crossing at right angles and three primary colours. At lower left, in the blue, one can make out the initials PM and the date 30."""
evocation = """
Mondrian seeks a universal harmony, beyond appearances: horizontal and vertical, colour and non-colour, large and small must balance one another. This balance is never symmetrical: the red mass is counterbalanced by the small blue and yellow rectangles, like weights on a scale. Steeped in theosophy, the painter saw in these pure relationships the image of a future, pacified society, in which art would merge with architecture and with life. His painting, of apparently extreme simplicity, has profoundly marked the architecture, design, fashion and graphic design of the 20th century."""
histoire = """
Mondrian painted this canvas in Paris, in his studio on the rue du Départ, at the request of the Zurich architect Alfred Roth, who had worked for Le Corbusier. On the back, he wrote a dedication dated 30 January 1930, in which he affirms that to reckon only with relationships, seeking their balance in art and in life, is to prepare the future. He then took up the same composition in other versions, enlarging it by five centimetres each time without changing the width of the black lines. Roth kept it for nearly sixty years before giving it to the Kunsthaus Zürich in 1987."""
facture = """
Despite its mechanical look, everything is painted by hand. Up close one sees the trace of the brush, the successive layers of white, slight cracks. The black lines do not all have the same thickness, and Mondrian long adjusted their position over the course of his trials. The colours are laid in pure flat areas, without mixing. The small format, 45 centimetres square, concentrates the tension between the large red surface and the other planes."""
details = [
  "The initials PM and the date 30, painted at lower left, in the blue.",
  "The small yellow rectangle, at lower right, topped by a black stroke.",
  "The black lines that stop short of the edge of the canvas.",
  "The fine cracks and the trace of the brush in the whites.",
]
themes = ["neoplasticism", "primary colours", "balance", "de stijl", "geometry"]
anecdote = """
