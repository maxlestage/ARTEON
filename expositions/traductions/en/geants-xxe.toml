[[oeuvres]]
titre = "Woman before an Aquarium"
artiste = "Henri Matisse"
annee = "1921–1923"
image = "femme-aquarium.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/27984"
technique = "Oil on canvas, 81.2 × 100.2 cm"
collection = "Art Institute of Chicago"
note = "Leaning on a table, chin on her arms, a young woman watches goldfish swim round: the calm, dreamy Matisse of the Nice years."
description = """
In a closed interior, a young woman with brown bobbed hair leans on a pale wooden \
table. She has crossed her arms and rests her chin on them; her slightly vague gaze \
settles on a round glass bowl, at left, in which a few goldfish swim. In front of the \
bowl, pine cones and a long fir branch lie on the table, not far from a small white \
card. The young woman wears a pink blouse and leans back against an upholstered \
armchair. Behind her, a blue screen covers almost the whole background with a pattern \
of interlocking rings; a band of bright green and, at left, a striped curtain hint at a \
window. The light is even, without dramatic shadow, and the lower edge of the canvas \
cuts the table as close to us as possible."""
evocation = """
The painting tells no story: it shows a suspended moment, that of reverie. The young \
woman watches the fish as one watches a fire or the sea, without quite seeing them. \
Goldfish recur often in Matisse from 1912, the year of his first stay in Morocco, \
where he had observed, it is said, men who dreamed for hours in front of a bowl: in his \
work they become an image of contemplation itself. As the museum points out, the \
deliberately muted pattern of the screen feeds the meditative atmosphere of the scene. \
Far from the outbursts of Fauvism, Matisse here pursues the ideal he had formulated as \
early as 1908: an art of balance and tranquillity, which would be for the mind like a \
good armchair that relieves fatigue."""
histoire = """
At the end of 1917, Matisse settled in Nice, where he would from then on spend most of \
the year. In his hotel rooms, then in the apartment he rented from 1921 on place \
Charles-Félix, he composed interiors filled with fabrics, rugs and screens. There he \
recalled the exhibitions of Islamic art he had visited and his journeys to Algeria and \
Morocco, from which he had brought back pottery, textiles and tiles. Completed in 1923, \
the canvas was sold on 12 June of that year to his Paris dealers, Bernheim-Jeune; two \
days later, the Chicago painter and collector Frederic Clay Bartlett bought it. In 1926 \
he gave it to the Art Institute, with other masterpieces, including Seurat's A Sunday \
on La Grande Jatte, in memory of his wife Helen Birch Bartlett."""
facture = """
Matisse paints here with a new restraint. The colours are muted: grey-blue of the \
screen, pale pink of the blouse, ochre of the table, brown of the ledge; only the \
bright green of the vertical band and the orange of the fish make a few bolder notes \
sing. The brushwork remains visible, quick, often fluid, and in places lets the canvas \
show through, notably in the bowl, rendered by a few white reflections and a light \
outline. The pattern of the screen is brushed in with a broad gesture, without concern \
for exactness: it works as a decorative ground that holds the whole space. Seen from a \
little above, the table tilts towards the viewer, as if we were seated opposite the \
model, on the other side of the bowl."""
details = [
  "The goldfish, reduced to a few orange touches in the bowl.",
  "The chin resting on the crossed arms, and the gaze that drifts away.",
  "The pine cones and the fir branch lying on the table.",
  "The small white card, the only pale spot at the right of the table.",
  "The interlocking rings of the blue screen, behind the model.",
]
themes = ["interior", "reverie", "nice", "goldfish", "ornament"]
anecdote = """
On 12 June 1923, Matisse sold the painting to Bernheim-Jeune; on the 14th, it was \
already bought by Frederic Clay Bartlett of Chicago, for 11,200 francs. Less than three \
years later, it was hanging at the Art Institute."""
salle = 2
mur = "nord"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Improvisation 30 (Cannons)"
artiste = "Vassily Kandinsky"
annee = "1913"
image = "improvisation-30.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/8991"
technique = "Oil on canvas, 111 × 111.3 cm"
collection = "Art Institute of Chicago"
note = "Cannons belching smoke, towers swaying: on the eve of 1914, Kandinsky lets colour improvise like music."
description = """
A square canvas, saturated with bright colours that collide. At lower right, two large \
black wheels and dark barrels pointing to the left form cannons; in front of them rise \
grey and white clouds, like smoke. At the centre floats a great mass of deep blue, \
outlined in brown, like a ship or a hill. Above, at right, leaning towers, one red and \
pierced with windows, the others white and barely drawn, seem about to collapse. At \
left, a kind of open-framed black tower stands before a white cloud, while at the \
bottom a row of small coloured spots suggests a crowd. Mountains in red, yellow and \
green close off the top of the painting. The signature and the date, 1913, are \
inscribed at lower left."""
evocation = """
Kandinsky called "improvisations" paintings born, he said, of spontaneous and largely \
unconscious impulses, as opposed to "compositions", which were long prepared. Here, the \
title in parentheses designates the only motif one recognises with certainty: the \
cannons. To his friend Arthur Jerome Eddy, a Chicago collector, he wrote that they \
could no doubt be explained by the incessant conversations about war that had filled \
the year, but that the true content of the painting was what the viewer feels under the \
effect of the forms and colour combinations. A year later the First World War broke \
out, and people have not failed to see a presentiment in these tottering towers."""
histoire = """
Kandinsky painted this canvas in Munich in 1913, at the moment when he was taking the \
step towards abstraction. Two years earlier, he had founded the Blaue Reiter with Franz \
Marc and published Concerning the Spiritual in Art, in which he draws painting closer \
to music, that art which imitates nothing and yet touches the soul directly. The lawyer \
Arthur Jerome Eddy was among the very first Americans to buy his works; he acquired \
this one, probably from the painter himself. In 1914, the war forced Kandinsky, a \
Russian subject, to leave Germany. After Eddy's death, in 1920, his widow and son kept \
the painting, then gave it in 1931 to the Art Institute of Chicago."""
facture = """
Kandinsky superimposes two languages. On one side, great fields of colour laid in broad \
and thick touches, ultramarine blue, yellow, red, emerald green, pink, which answer one \
another without forming objects. On the other, a network of black or brown lines, drawn \
with a fine, nervous brush, which outline the towers, the wheels and the barrels of the \
cannons, or run freely across the canvas. The colours do not stay within the outlines: \
they spill over, fringed with small jagged touches, like vibrations. The drawing, half \
erased, leaves things at the limit of the recognisable, so that each colour acts by \
itself, like a sound."""
details = [
  "The two black wheels and the barrels of the cannons, at lower right.",
  "The puffs of grey and white smoke in front of the cannons.",
  "The leaning towers, one of them red and pierced with windows.",
  "The large deep blue patch at the centre of the painting.",
  "The signature and the date, 1913, at lower left.",
]
themes = ["abstraction", "music", "war", "colour", "improvisation"]
anecdote = """
Kandinsky told how one evening, in Munich, he was struck by a painting of inexplicable \
beauty, with no recognisable subject: it was one of his own canvases, standing on its \
side. He concluded that the object harmed his painting."""
salle = 2
mur = "nord"
place = 3
largeur = 1.5

[[oeuvres]]
titre = "The Musician"
artiste = "Louis Marcoussis"
annee = "1914"
image = "le-musicien.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.46638.html"
technique = "Oil on canvas, 146 × 114.3 cm"
collection = "National Gallery of Art, Washington"
note = "A musician in tails, taken apart into grey and blue facets, in a drawing room where the score of a waltz lies about: Cubism according to Marcoussis."
description = """
A man in evening dress fills the full height of the canvas, broken down into \
overlapping planes of grey, blue and black. One makes out his narrow face, cut in two, \
with a small pink mouth, then a white shirt front and a bow tie. He holds upright in \
front of him a stringed instrument whose scroll, pegs and f-holes can be recognised, \
painted like veined wood. Around him a drawing room is reassembled in fragments: at \
right, the keyboard of a piano and a music stand bearing a score on which one reads \
"Malvina valse"; at left, a small vase of flowers on a console table; at the top, \
panels of red damask hangings; at the bottom, a floor with wood grain. The signature, \
"MARCOUSSIS 1914", is painted in capitals at lower left."""
evocation = """
The musician is one of Cubism's favourite subjects, along with the guitar and the café \
still life: it allows a figure, an instrument and the very idea of music, that art of \
time that cannot be seen, to be brought together in a single painting. Marcoussis \
treats it with elegance: the tails, the bow tie, the popular waltz speak of a world of \
drawing rooms and café-concerts, that of Paris on the eve of the war. The painted \
words, as in Braque and Picasso, anchor the image in the most banal reality, a score \
like those sold in any music shop, while reminding us that the painting remains a flat \
surface, on which letters hold as well as figures."""
histoire = """
Born Ludwik Markus in Warsaw, the painter arrived in Paris at the beginning of the \
century and soon frequented Apollinaire, Braque and Picasso. He adopted Cubism around \
1910 and in 1912 took part in the Salon de la Section d'Or, which brought together the \
Cubists on the margins of Picasso and Braque. The Musician was shown at the Salon des \
Indépendants in 1914, where the American Rodman Wanamaker bought it. Resold in New York \
in 1928, it was acquired the following year by the collector Chester Dale, whose \
immense collection of French painting entered the National Gallery of Art in \
Washington in 1963. Later, Marcoussis would devote himself more and more to engraving \
and to illustrating poets."""
facture = """
Marcoussis practises here a synthetic Cubism: instead of crumbling the object into \
minute facets, he rebuilds it in large, clean planes, cut like pasted papers. The range \
is muted, bluish greys, blacks and whites, warmed by the red of the hanging and the \
browns of the wood. Several surfaces imitate materials: the patterned red damask, the \
wood grain rendered in the manner of house painters, a technique that Braque had \
introduced into Cubism. In the grey planes, the brushwork remains visible, in small \
parallel hatchings that model the volumes. The letters of the score and of the \
signature, carefully painted, underline the flat surface of the canvas."""
details = [
  "The score on the music stand, on which one reads \"Malvina valse\".",
  "The scroll and pegs of the instrument, at the centre.",
  "The small white bow tie and the shirt front of the tails.",
  "The black keys of the keyboard, at right.",
  "The red damask hanging, at upper left.",
]
themes = ["cubism", "music", "portrait", "drawing room", "faux wood"]
anecdote = """
His artist's name was found for him by his friend Guillaume Apollinaire: Marcoussis is \
the name of a village in the Essonne, south of Paris."""
salle = 2
mur = "nord"
place = 4
largeur = 1.5

[[oeuvres]]
titre = "Tree and Architecture, Rhythms"
artiste = "Paul Klee"
annee = "1920"
image = "arbre-et-architecture.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.130844.html"
technique = "Oil on paper, 27.9 × 38.3 cm"
collection = "National Gallery of Art, Washington"
note = "Gridded houses, ball-shaped trees and a square that climbs towards a little tower: a dream city built like a musical score."
description = """
On a small sheet of paper, Klee builds a fragile city. At left and right, two tall \
houses with red roofs face each other, gridded with a network of black lines, like \
half-timbering or windows; one opens at the bottom onto an arcade. At the centre, a \
trapezoidal square climbs towards a green building, topped with a small pointed roof \
pierced by a black dot, like a clock or a nesting box. In the background, round trees, \
dark green, red or pink, set on thin stalks, float between the roofs. The colours, \
ochres, pinks, greens, yellows and a few thick whites, are laid in blurred patches \
that spill over the lines. At lower right, a small signature reads: "Klee"."""
evocation = """
The title brings together three words that recur constantly in Klee: the tree, which \
grows; architecture, which is built; rhythm, which links them as in music. The son of a \
music teacher and a singer, and himself a violinist, Klee thought of painting as a \
score, in which lines and patches of colour return at regular intervals. The city he \
paints exists nowhere: it is an old town passed through a dream, with its impossible \
perspectives and its balloon trees. The same year, he wrote that "art does not \
reproduce the visible; it makes visible". The Surrealists would soon recognise a \
brother in him: they exhibited him in Paris as early as 1925."""
histoire = """
In 1920, Klee was living in Munich. After the war, which he spent far from the front, \
his reputation grew very quickly: a major exhibition was devoted to him that year at \
the Hans Goltz gallery, and his text "Creative Credo" appeared in a collection of \
artists' writings. At the end of the year, Walter Gropius invited him to teach at the \
Bauhaus in Weimar, where he arrived at the beginning of 1921 and would stay for ten \
years. This small painting, in oil on paper, belongs to that moment of transition, \
between the luminous watercolours brought back from Tunisia in 1914 and the teaching at \
the Bauhaus. It entered the National Gallery of Art in 2004, the gift of the New York \
collectors Benjamin and Lillian Hertzberg."""
facture = """
Klee paints in oil on thin paper, which gives the colour a matte, velvety look. He \
lays down coloured patches, rubbed and softened, which blend into one another; a \
network of black lines, drawn with a fine brush, structures the image without ever \
quite enclosing the colours. One can still see the marks of the brush and the grain of \
the support. A few touches of white, thicker, placed on the central roof and along the \
building, make the light. This dialogue between a drawn framework and free colours, \
which Klee liked to compare to musical polyphony, is at the heart of his art."""
details = [
  "The two houses gridded in black, face to face.",
  "The small green tower at the centre, pierced by a black dot.",
  "The round trees, set like balloons on their stalks.",
  "The trapezoidal square that climbs towards the background.",
  "The small signature \"Klee\", at lower right.",
]
themes = ["city", "dream", "rhythm", "trees", "music"]
anecdote = """
From 1911, Klee kept a meticulous catalogue of his work, in which he recorded each \
piece with a year and a number: he listed more than nine thousand works in it."""
salle = 3
mur = "nord"
place = 1
largeur = 0.6

[[oeuvres]]
titre = "The Repast of the Lion"
artiste = "Henri Rousseau"
annee = "c. 1907"
image = "repas-du-lion.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/438822"
technique = "Oil on canvas, 113.7 × 160 cm"
collection = "Metropolitan Museum of Art, New York"
note = "In a jungle invented in Paris, beneath a pale disc, a lion devours its prey among giant flowers."
description = """
A tropical forest fills the whole canvas, up to the horizon. Immense leaves, dark \
green, soft green or bluish grey, overlap in tight layers; tall black trunks rise like \
stakes. Extraordinary flowers stand out from them: hanging yellow clusters, blue and \
pink lotuses, and, at left, a great white plant with drooping plumes. At the centre, \
through a gap, a white disc, sun or moon, sets between two hills, under a pale blue \
sky. At the bottom, half hidden in the grass, a lion with a tawny mane holds in its \
jaws a prey with a spotted coat, perhaps a leopard, and a thread of red blood runs. It \
stares at the viewer. The signature, "Henri Rousseau", is inscribed at lower right."""
evocation = """
Rousseau never saw a jungle. His forests are invented paradises, at once lush and \
menacing, where the motionless beauty of flowers sits beside the cruelty of wild \
beasts. The drama here is almost tiny, lost at the bottom of the canvas, as if all of \
nature remained indifferent to the struggle. This mixture of calm and violence, of \
precision and implausibility, gives the painting the strange logic of dreams. The \
poets and painters of the avant-garde, Apollinaire, Picasso, Robert Delaunay, admired \
and defended this self-taught painter, who painted his visions with the seriousness of \
a primitive; many artists of dreams, after him, owe him something."""
histoire = """
Born in Laval in 1844, Henri Rousseau worked for more than twenty years at the Paris \
octroi, the service that taxed goods entering the city: hence his nickname Le \
Douanier, "the customs officer". Self-taught, he exhibited from 1886 at the Salon des \
Indépendants, to mockery, then retired in 1893 to devote himself to painting. His first \
jungle, Surprised!, dates from 1891; they multiplied in the last years of his life, \
from 1904 to his death in 1910. In 1908, Picasso gave a banquet in his honour in his \
studio at the Bateau-Lavoir, which remained famous. The Repast of the Lion belonged to \
the New York collector Sam A. Lewisohn, who bequeathed it to the Metropolitan Museum \
in 1951."""
facture = """
Rousseau paints with a craftsman's patience. Each leaf is drawn, outlined, then filled \
with a flat colour, modelled with only a few shades; the countless greens range from \
almost black to water green. He superimposes the planes like the painted flats of a \
theatre set, from the dark foreground to the pale background, without true atmospheric \
perspective, so that everything is equally sharp, from nearest to farthest. The surface \
is smooth, almost without brushmarks. He worked from memory and from images, without \
ever leaving France: his enlarged flowers, bigger than the lion, obey only the \
decorative order of the painting."""
details = [
  "The lion, half hidden in the grass, staring at the viewer.",
  "The thread of red blood on the prey with the spotted coat.",
  "The white disc setting between the hills.",
  "The blue and pink lotuses, and the hanging yellow clusters.",
  "The signature \"Henri Rousseau\", at lower right.",
]
themes = ["jungle", "dream", "wild beast", "exoticism", "naive art"]
anecdote = """
"When I go into the hothouses and see those strange plants from exotic countries, it \
seems to me that I am entering a dream," Rousseau is said to have confided. His virgin \
forests were born beneath the glass roofs of the Jardin des Plantes in Paris."""
salle = 3
mur = "nord"
place = 2
largeur = 1.9

[[oeuvres]]
titre = "Pandora"
artiste = "Odilon Redon"
annee = "1910–1912"
image = "pandora.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.46531.html"
technique = "Oil on canvas, 143.5 × 62.9 cm"
collection = "National Gallery of Art, Washington"
note = "The first woman of Greek mythology holds the fatal casket amid unreal flowers: one of Redon's last dreams in colour."
description = """
On a tall, narrow canvas, a young woman stands, almost from behind, turned to the \
right. Her red hair is held by a golden headband; she wears a full turquoise-blue \
cloak, draped over a white dress, and lowers her eyes to a small dark casket that she \
holds before her. Behind her rise bluish mountains, barely sketched, under a pearly \
pink sky. At her feet and on the right teem flowers that resemble no known species: \
broad white patches like petals, bursts of yellow, orange, red, green and blue, \
scattered like a rain of colours. The whole top of the painting bathes in a powdery \
light. The signature, "Odilon Redon", is inscribed at lower right."""
evocation = """
According to the Greek poet Hesiod, Pandora is the first woman, fashioned by the gods \
and endowed with every gift, then sent to men with a vessel she was not to open; as she \
lifts the lid, she lets all evils escape, and only Hope remains at the bottom. Redon \
does not paint the catastrophe, but the instant before: a pensive young woman, absorbed \
in the casket, amid a nature still intact. Curiosity becomes reverie, and the myth a \
silent meditation. The dazzling flowers that surround her leave the viewer hesitating \
between threat and promise, between the paradise that is about to be lost and the hope \
that remains."""
histoire = """
Born in Bordeaux in 1840, Odilon Redon was for more than twenty years the master of \
"blacks": charcoals and lithographs peopled with floating eyes, smiling spiders and \
severed heads, which the Symbolist writers admired. In the 1890s, colour invaded his \
work, pastels and then oils, and until his death in 1916 he painted bouquets, boats \
and mythological figures bathed in light. Pandora dates from these last years; the \
subject occupied him several times. The painting came up for sale in Paris, at the \
Hôtel Drouot, in 1922, then crossed the Atlantic; the New York collector Chester Dale \
bought it in 1950, and it entered the National Gallery of Art in 1963."""
facture = """
Redon paints in oil as he worked in pastel: with light scumbles, transparent veils and \
small juxtaposed touches, letting the grain of the canvas show in places. The top of \
the painting, almost empty, is made of pink and grey layers rubbed over one another, \
from which a powdery light is born. The figure is barely outlined, her cloak modelled \
in transparent blues and greens. At the bottom, by contrast, the paint thickens and \
breaks up into bursts of pure colour, almost abstract, like a mosaic of precious \
stones. The very narrow format, that of a decorative panel, isolates the figure as in a \
niche."""
details = [
  "The small dark casket that Pandora looks at, eyes lowered.",
  "The golden headband in her red hair.",
  "The turquoise cloak draped over the white dress.",
  "The large white flowers, like petals of light, at right.",
  "The bluish mountains, barely drawn, behind the figure.",
]
themes = ["mythology", "symbolism", "dream", "flowers", "curiosity"]
anecdote = """
In Hesiod, Pandora opens a large jar, not a box: the "Pandora's box" comes from a Latin \
translation of the Renaissance, popularised by Erasmus. Yet it is this casket that Redon \
paints, like almost all artists."""
salle = 3
mur = "nord"
place = 3
largeur = 0.8

