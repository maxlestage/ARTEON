Gwen John almost always paints the same thing: a woman alone, seated in a room, or a \
corner of an empty interior, a chair, a window. Her paintings, often small, are made of \
dry, matte touches, on chalky grounds, in a range of very close tones, greys, beiges, \
faded pinks. She takes up the same motif in several versions, with slight variations, \
and gives these silent scenes an almost religious intensity."""
