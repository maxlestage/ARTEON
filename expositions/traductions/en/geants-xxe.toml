note = "The weary, grave face of a mother who has just lost her son in the war, drawn in lithographic crayon, without any complacency."
description = """
On a sheet of cream paper, a woman's face appears from the front, framed very close, \
with no body and no setting. The hair, pulled back, is indicated only by a few grey \
masses that fray at the edges. The face is plunged in a grainy shadow, made of \
countless small black dots; in places, the white of the paper, left in reserve, makes \
the light, on the forehead, around one eye, on the bridge of the nose and on the chin. \
The eyes, ringed with shadow and slightly asymmetrical, look straight ahead; the \
eyelids are heavy, the mouth closed, the cheeks hollow. The neck is lost at the bottom \
in a few rapid strokes. At lower right, the artist signed in pencil: "Käthe \
Kollwitz"."""
evocation = """
Käthe Kollwitz portrayed herself all her life, about a hundred times, in drawing, \
printmaking and sculpture. These self-portraits never flatter: they record fatigue, age \
and grief. This one was made the year after the death of her younger son, Peter, killed \
in Flanders in October 1914, at eighteen, in the first weeks of the war. There is no \
outward sign of mourning, no tear: only a gaze that holds ours, exhausted but lucid. \
This very sobriety makes the image, beyond the portrait of one woman, that of all the \
mothers whom war has deprived of their children."""
histoire = """
Born in Königsberg in 1867, Käthe Kollwitz settled in Berlin with her husband Karl, a \
doctor in a working-class district, whose patients became her models. Her engraved \
cycles, The Weavers' Revolt and then The Peasants' War, made her famous at the turn of \
the century. Peter's death transformed her work: for nearly eighteen years, she worked \
on a monument to her son, the Grieving Parents, installed in 1932 in a German military \
cemetery in Belgium, near his grave. In 1919, she became the first woman elected to the \
Prussian Academy of Arts. This impression has belonged to the Cleveland Museum of Art \
since 1941, with the collection of Mr and Mrs Lewis B. Williams."""
facture = """
Lithography allows one to draw with greasy crayon, on stone or on transfer paper, then \
to print the image with all the spontaneity of drawing. Kollwitz draws a striking \
effect from it here: the crayon, passed over a grainy surface, leaves a web of small \
dots and fine vertical streaks that give the shadow the texture of cloth or skin. She \
builds the face in masses rather than contours, and lets the edges dissolve into the \
white of the paper. The tight framing and the absence of any setting concentrate \
attention on the gaze. A few more nervous strokes, at the bottom, are enough to suggest \
the collar."""
details = [
  "The ringed, slightly asymmetrical eyes that stare at the viewer.",
  "The white of the paper left in reserve on the forehead and the bridge of the nose.",
  "The web of small dots and streaks of the lithographic crayon.",
  "The hair pulled back, indicated by simple grey masses.",
  "The pencil signature, at lower right.",
]
themes = ["self-portrait", "mourning", "war", "print", "motherhood"]
anecdote = """
In August 1914, it was Käthe Kollwitz who had persuaded her husband to let Peter enlist \
as a volunteer. Her diary, kept for more than thirty years, preserves the trace of this \
remorse and of her long work of mourning."""
salle = 4
mur = "nord"
place = 1
largeur = 0.4

[[oeuvres]]
titre = "Jacques and Berthe Lipchitz"
artiste = "Amedeo Modigliani"
annee = "1916"
image = "lipchitz.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/27987"
technique = "Oil on canvas, 81.3 × 54.3 cm"
collection = "Art Institute of Chicago"
note = "The wedding portrait of a Montparnasse sculptor and his young wife, painted by his friend Modigliani in 1916."
description = """
Against a grey-blue wall, a couple poses as for a wedding photograph. Standing at left, \
Jacques Lipchitz dominates the composition: a long oval face, small pale eyes, a thin \
mouth, a grey-green turtleneck sweater beneath a reddish-brown jacket. His arm passes \
behind his wife, and his hand reappears at right, resting near her shoulder. Seated \
lower down, Berthe gently tilts her head; her elongated face, with pink cheeks, has \
dark almond eyes and a small red mouth, and her black dress is adorned with a broad \
scalloped white collar. Behind them, a pale upright and a brown panel divide the \
background. At the top, the sculptor's name, "LIPCHITZ", is written in capitals, and \
the signature "modigliani" can be read in the right-hand corner."""
evocation = """
Modigliani does not seek photographic likeness: he lengthens faces, reduces eyes to \
almonds, simplifies forms until each sitter becomes a kind of icon. Yet the couple is \
indeed there, with their characters: the man, stiff and a little solemn, the young \
woman, softer and dreamy. The pose recalls the wedding portraits of photographers' \
studios, but tenderness comes through a discreet gesture, that arm around Berthe. The \
almond faces and elongated necks owe much to the African and archaic sculptures that \
both men admired, sculptors the one and the other, at a time when Montparnasse was \
inventing modern art."""
histoire = """
Trained in Italy, Modigliani settled in Paris in 1906 and soon lived in Montparnasse. \
There he met the sculptor Jacques Lipchitz, who had come from Lithuania and who, to \
help his ever penniless friend, commissioned this portrait on the occasion of his \
marriage to the Russian poet Berthe Kitrosser. Lipchitz kept the painting for a few \
years, then exchanged it around 1921 with the dealer Léonce Rosenberg; Frederic Clay \
and Helen Birch Bartlett bought it in 1922, and it entered the Art Institute of Chicago \
in 1926, in the collection given in memory of Helen Birch Bartlett. Despite his \
talent, Modigliani found buyers only after his death, in January 1920, hastened by \
tuberculosis and his legendary bohemian life."""
facture = """
The paint, rather thin, lets the weave of the canvas show. The backgrounds are brushed \
in broad flat areas of grey-blue, brown and ochre; the contours are drawn with the \
brush in a dark, supple, continuous line, which outlines the faces and clothes. The \
flesh tones, orange and pink, are modelled very lightly, almost flat; Berthe's cheeks \
are two rounded red patches. The composition is organised in verticals: the pale \
upright at the centre, the edge of the brown panel, the tall standing figure. The \
background, the clothes and the shadows share the same muted range, which makes the \
faces stand out. The capital letters of the name, drawn with the brush, recall the \
inscriptions of old portraits."""
details = [
  "The name \"LIPCHITZ\", written in capitals at the top of the canvas.",
  "The scalloped white collar of Berthe's dress.",
  "Berthe's cheeks, two rounded patches of pink.",
  "Jacques's hand reappearing at right, near his wife's shoulder.",
  "The signature \"modigliani\", in lower case, in the upper right corner.",
]
themes = ["portrait", "couple", "marriage", "montparnasse", "friendship"]
anecdote = """
According to Lipchitz, Modigliani had finished the portrait in two days. The sculptor \
persuaded him to go on working on it for two more weeks, so that he could pay him a \
higher fee."""
salle = 4
mur = "nord"
place = 2
largeur = 0.7

[[oeuvres]]
titre = "Old Factory"
artiste = "Paula Modersohn-Becker"
annee = "1900"
image = "vieille-usine.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.150903.html"
technique = "Oil on cardboard, 38.7 × 53.7 cm"
collection = "National Gallery of Art, Washington"
note = "An old building and its lone chimney at the edge of the meadows, under a grey sky: a quick study, painted in the year Paula Modersohn-Becker discovered Paris."
description = """
Under a grey and pale blue sky across which dark clouds pass, a long building occupies \
the left of the composition. Its great brown roof, almost black, streaked with red, \
descends to an orange-ochre wall pierced with small dark openings; the gable, turned to \
the right, is dotted with pale patches, like bricked-up windows or plaster fallen in \
patches. Behind the roof rises a tall chimney. In the foreground stretches a green \
meadow; bushes and young dark conifers stand at left and right, and a row of trees \
closes the horizon. No figure, no smoke: the place seems abandoned. At lower left, the \
date "1900" is traced in the paint."""
evocation = """
Paula Modersohn-Becker seeks here neither the picturesque nor social denunciation: the \
old factory is for her a form, a simple mass set in the landscape. The building, with \
its crushing roof and its lone chimney, has something grave and almost human about it, \
like a silhouette waiting. Under the heavy sky, the whole gives off a silent \
melancholy, that of things worn down by time. This way of reducing the motif to a few \
large masses, without anecdote, foreshadows the portraits, still lifes and \
self-portraits she would paint in the following years, among the newest of their time."""
histoire = """
Born in Dresden in 1876, Paula Becker joined in 1898 the artists' colony of \
Worpswede, a village on the moor near Bremen, where painters worked from the motif \
amid the peat bogs. At the beginning of 1900, she left for Paris: she studied at the \
Académie Colarossi, visited the Exposition Universelle and discovered Cézanne at the \
dealer Ambroise Vollard's. In 1901, she married the painter Otto Modersohn. She \
returned several times to Paris and died in 1907, at thirty-one, less than three weeks \
after the birth of her daughter. In her lifetime she sold very few paintings; she is \
now regarded as one of the pioneers of German Expressionism. This cardboard entered the \
National Gallery of Art in 2012, bequeathed by Ruth Cole Kainen."""
facture = """
The study is painted quickly, in thick, greasy oil, on a simple cardboard. The \
brushwork, very visible, changes with the surfaces: short and crossed in the sky, where \
white, blue and grey mingle without blending; broader and pressed on the wall and the \
roof; swirling in the bushes and trees. The colours are few and earthy, brown, ochre, \
deep green, warmed by a few red streaks on the roof. The forms are simplified into \
large masses, without needless detail: a few dark patches are enough to make windows, \
a few vertical strokes a row of trees. Nothing is finished, and everything is said."""
details = [
  "The tall chimney, the only vertical against the sky.",
  "The red streaks on the great dark roof.",
  "The small pale patches dotting the gable.",
  "The row of dark trees on the horizon, at right.",
  "The date \"1900\", traced in the paint at lower left.",
]
themes = ["landscape", "factory", "sky", "study", "simplicity"]
anecdote = """
The poet Rainer Maria Rilke, who had known her at Worpswede, dedicated to her in 1908, \
a year after her death, his "Requiem for a Friend"."""
salle = 4
mur = "est"
place = 2
largeur = 0.65

[[oeuvres]]
titre = "The Convalescent"
artiste = "Gwen John"
annee = "c. 1915–1925"
image = "la-convalescente.jpg"
credit = "Photo : National Gallery of Art, Washington"
licence = "CC0"
source = "https://www.nga.gov/collection/art-object-page.89676.html"
technique = "Oil on canvas, 41.3 × 33.8 cm"
collection = "National Gallery of Art, Washington"
note = "In a wicker armchair, a young woman in a dark dress reads a letter beside a pink cup: a silence painted in a low voice."
description = """
In a wicker armchair fitted with a white cushion, a young woman with long brown hair \
sits, slightly in three-quarter view. She wears a dark mauve dress, almost violet, \
which falls to the bottom of the canvas. Eyes lowered, she reads a white sheet, a \
letter perhaps, which she holds in both hands on her lap. At right, on a small round \
table covered with a white cloth, stand a pink cup on its saucer and a russet-brown \
teapot dotted with white spots. The back wall, a pale beige, is sprinkled with small \
golden spots, like wallpaper. All is calm, all is soft, without a marked shadow."""
evocation = """
The title speaks of convalescence, that suspended time between illness and ordinary \
life, when one stays seated, reading and waiting. Gwen John tells us no more: neither \
the content of the letter nor the illness is specified. The young woman, absorbed, \
seems unaware of being looked at; her pale face and lowered eyelids speak of a \
peaceful fatigue, almost a prayer. As often with this artist, the solitary figure in a \
room becomes the image of an inner life, made of withdrawal and attention. Gwen John \
painted this subject several times, with slight variations, as one returns to a \
meditation."""
histoire = """
Born in Wales in 1876, elder sister of the painter Augustus John, Gwen John studied at \
the Slade School in London, then settled in France in 1904. In Paris, she became \
Rodin's model and lover, then withdrew to Meudon, where she led an increasingly \
solitary life and converted to Catholicism. From 1910, the New York lawyer John Quinn \
became her principal supporter and bought her works regularly. This painting was \
acquired from her in November 1924 by Quinn's estate, he having died a few months \
earlier, then sold in 1927 in New York under the title Young Girl Reading a Letter. \
Paul Mellon and his wife bought it in 1986 and gave it in 1994 to the National Gallery \
of Art. Gwen John died in Dieppe in 1939."""
facture = """
Gwen John paints in small dry, matte touches, laid side by side like tesserae, on a \
chalky ground that soaks up the oil. The palette is deliberately reduced to a few \
neighbouring tones, beiges, greys, mauves and whites, lifted only by the pink of the \
cup and the russet of the teapot. The forms are simplified, the contours blurred, \
without cast shadows: the light is even, diffuse, as if filtered through a curtain. In \
places, small losses in the paint layer reveal the pale ground, which reinforces the \
look of an ancient fresco. The weave of the wicker armchair is only sketched, in a few \
ochre strokes."""
details = [
  "The white sheet that the young woman reads, eyes lowered.",
  "The pink cup on its saucer, at the edge of the table.",
  "The russet-brown teapot dotted with white spots.",
  "The wicker armchair, whose weave can be guessed at left.",
  "The small golden spots of the wallpaper.",
]
themes = ["intimacy", "reading", "convalescence", "silence", "room"]
anecdote = """
Gwen John posed for Rodin, notably for the Muse of his monument to Whistler, the \
American painter who had been her teacher in Paris."""
salle = 4
mur = "nord"
place = 3
largeur = 0.45

[[artistes]]
nom = "Henri Matisse"
vie = "Le Cateau-Cambrésis (Nord), 31 December 1869 – Nice, 3 November 1954"
biographie = """
The son of a grain merchant from the north of France, Henri Matisse at first intended \
to study law and worked as a solicitor's clerk. In 1890, laid up with appendicitis, he \
received a box of paints from his mother: it was a revelation. He left for Paris, \
entered the École des Beaux-Arts in 1895 in the studio of Gustave Moreau, discovered \
Impressionism and Cézanne, then the light of the Midi in Corsica. In 1898, he married \
Amélie Parayre. After a summer in Saint-Tropez with Signac in 1904, he painted at \
Collioure with Derain, in 1905, the canvases that caused a scandal at the Salon \
d'Automne and made him the leader of the "Fauves". Supported by the Steins, then by the \
Russian collectors Shchukin and Morozov, he opened an academy and travelled to Morocco. \
From 1917, he worked mainly in Nice, where he painted his odalisques. Gravely ill in \
1941, in his last years he invented the gouache cut-outs and designed the Chapel of the \
Rosary in Vence. He died in Nice in 1954."""
style = """
Matisse makes colour the engine of painting: laid in pure flat areas, it builds space, \
light and emotion without recourse to modelling or perspective. His drawing, of great \
economy, seeks the essential arabesque. He dreamed of an art of balance and serenity, \
decorative in the noblest sense. He is one of the great inventors of twentieth-century \
painting; his interiors, his paper cut-outs and his chromatic freedom have nourished \
American abstraction and generations of painters and designers."""

[[artistes]]
nom = "Vassily Kandinsky"
vie = "Moscow, 16 December 1866 – Neuilly-sur-Seine, 13 December 1944"
biographie = """
Kandinsky studied law and economics in Moscow and seemed destined for an academic \
career before abandoning everything, at thirty, for painting. He left in 1896 for \
Munich, where he founded a group of artists and lived with the painter Gabriele \
Münter, in Munich and in Murnau. His landscapes gradually freed themselves from \
representation and, around 1910–1911, he painted his first large abstract canvases. In \
1911, he published Concerning the Spiritual in Art and founded with Franz Marc the \
Blaue Reiter, the Blue Rider. The war brought him back to Russia, where he took part in \
the artistic institutions of the revolution. Returning to Germany at the end of 1921, \
he taught at the Bauhaus from 1922 until its closure by the Nazis in 1933, in Weimar, \
Dessau and then Berlin. He then settled in Neuilly-sur-Seine, near Paris, where he \
painted until his death in 1944. In the United States, he was collected very early, \
first by Arthur Jerome Eddy in Chicago, then by Solomon R. Guggenheim in New York."""
style = """
Kandinsky moves from the swirling patches of colour of his Munich years to the precise \
geometry of the Bauhaus period, then to the supple, almost biological forms of his \
last Parisian years. Throughout, he compares painting to music: colours and forms must \
act directly on the soul, like sounds. A painter and theorist, he gave abstract art its \
first founding texts."""

[[artistes]]
nom = "Louis Marcoussis"
vie = "Warsaw, 1878 – Cusset (Allier), 1941"
biographie = """
Born Ludwik Markus in Warsaw, then part of the Russian Empire, the future Marcoussis \
studied painting at the Academy of Fine Arts in Kraków, then settled in Paris in 1903 \
and attended the Académie Julian. To make a living, he drew caricatures for several \
years for humorous newspapers. Around 1910, he became friends with Guillaume \
Apollinaire, who found his artist's name for him, with Georges Braque and with Pablo \
Picasso, and adopted Cubism; he took part in 1912 in the Salon de la Section d'Or. In \
1913, he married the painter Alice Halicka. A volunteer in the French army during the \
First World War, he afterwards returned to painting and made in particular paintings \
on glass, inspired by Polish folk art. In the 1930s, he devoted himself mainly to \
engraving and illustrated poets, among them Apollinaire. A refugee in the Allier after \
the defeat of 1940, he died at Cusset, near Vichy, in 1941."""
style = """
Marcoussis practises an elegant and legible Cubism, made of large clean planes, muted \
ranges of greys and blues warmed with reds and browns, imitations of materials and \
painted letters. Less radical than Picasso or Braque, he seeks balance and clarity of \
composition. A remarkable engraver, he gave Cubism a poetic and precise version, which \
continues in his prints and illustrations."""

[[artistes]]
nom = "Paul Klee"
vie = "Münchenbuchsee (Switzerland), 18 December 1879 – Muralto (Switzerland), 29 June 1940"
biographie = """
The son of a German music teacher and a Swiss singer, Paul Klee grew up in Bern and \
hesitated for a long time between music and painting. He studied in Munich, where he \
settled and became friends with Kandinsky and the artists of the Blaue Reiter. In \
1914, a trip to Tunisia with August Macke and Louis Moilliet revealed colour to him: \
he then noted in his diary that colour and he were now one. Mobilised during the war, \
he was called in 1921 to the Bauhaus, in Weimar and then Dessau, where he taught for \
ten years and lived next door to Kandinsky. A professor at the Düsseldorf Academy from \
1931, he was dismissed by the Nazis in 1933 and returned to Bern. Afflicted by a grave \
skin disease, scleroderma, he nevertheless painted with new energy hundreds of works \
in his last years, before dying in 1940 in Ticino."""
style = """
Klee invents a poetic universe where signs, writing, figures, landscapes and imaginary \
architectures mingle. He moves freely from abstraction to almost childlike drawing, \
with humour and fantasy, but relying on a very rigorous theoretical reflection on line, \
colour and rhythm, inspired by music. His immense oeuvre, of more than nine thousand \
numbers, influenced Surrealism and postwar abstraction."""

[[artistes]]
nom = "Henri Rousseau"
vie = "Laval, 21 May 1844 – Paris, 2 September 1910"
biographie = """
The son of a tinsmith from Laval, Henri Rousseau became a clerk for a solicitor, then \
joined the army. In 1871, he entered the Paris octroi, the administration that \
collected taxes on goods entering the city: hence his nickname Le Douanier, "the \
customs officer", although he was never a customs officer. He painted as a self-taught \
artist in his spare time and exhibited from 1886 at the Salon des Indépendants, open to \
all, without a jury. The public and critics mocked his canvases, which he continued to \
send every year. In 1893, he retired to devote himself to painting, gave violin and \
drawing lessons and lived in poverty. He became friends with Alfred Jarry, also born in \
Laval, then with Apollinaire, Robert Delaunay and Picasso, who organised a banquet in \
his honour at the Bateau-Lavoir in 1908. After Surprised!, his first jungle, in 1891, he \
painted about twenty from 1904. He died in September 1910 at the Necker hospital, \
shortly after exhibiting The Dream."""
style = """
Rousseau paints without academic training, with meticulous application: clean \
outlines, smooth colours, naive perspective, frontal figures. His jungles, invented \
from the Paris hothouses and from album illustrations, have the strangeness of a \
dream. Admired by Picasso, Apollinaire and then the Surrealists, he opened the way to \
the recognition of naive art."""

[[artistes]]
nom = "Odilon Redon"
vie = "Bordeaux, 20 April 1840 – Paris, 6 July 1916"
biographie = """
Bertrand Jean Redon, known as Odilon, spent a solitary childhood on the family estate \
of Peyrelebade, in the Médoc. He studied architecture for a time, then painting in \
Paris in Gérôme's studio, without success. His true encounter was with the engraver \
Rodolphe Bresdin, in Bordeaux, who taught him etching and the freedom of imagination. \
For more than twenty years, Redon worked in black, in charcoal and lithography: the \
albums Dans le rêve, in 1879, À Edgar Poe, Les Origines or Hommage à Goya peopled his \
work with floating eyes, severed heads and monsters. Huysmans celebrated him in À \
rebours in 1884, and the Symbolist poets, Mallarmé foremost, became his friends. \
Around 1890, after the birth of his son Arï, he turned to colour, pastel and oil, and \
painted flowers, myths and large decorative schemes, such as those of Fontfroide Abbey. \
The Nabis revered him, and he exhibited at the Armory Show in New York in 1913."""
style = """
Redon wants, in his own words, to put the logic of the visible at the service of the \
invisible. His blacks, of a deep velvety quality, give life to creatures born of dream \
and of the science of his time, microbes and hybrid beings. His colours, later, are \
laid in precious touches that seem to radiate. Independent of any school, he opened \
the way to the Nabis, to Matisse and to the Surrealists, who saw in him a precursor."""

[[artistes]]
nom = "Käthe Kollwitz"
vie = "Königsberg (East Prussia), 8 July 1867 – Moritzburg, near Dresden, 22 April 1945"
biographie = """
Born Käthe Schmidt in Königsberg into a liberal and deeply religious family, she \
studied drawing and painting in Berlin and Munich, in the schools reserved for women, \
the academies being then closed to them. In 1891, she married the doctor Karl Kollwitz \
and settled with him in a working-class district of northern Berlin, where she found \
her models among her husband's patients. Her engraved cycle The Weavers' Revolt, \
inspired by a play by Gerhart Hauptmann, made her famous at the end of the 1890s, \
followed by The Peasants' War. In October 1914, her younger son Peter was killed in \
Flanders; this bereavement marked all her work, from the woodcuts of the cycle War to \
the monument of the Grieving Parents, completed in 1932. The first woman elected to the \
Prussian Academy of Arts, in 1919, she was expelled from it by the Nazis in 1933 and \
could no longer exhibit. Her husband died in 1940, her grandson Peter fell in Russia in \
1942, and her Berlin house was destroyed by bombs in 1943. A refugee in Moritzburg, she \
died there a few days before the end of the war."""
style = """
A printmaker and sculptor above all, Käthe Kollwitz worked almost exclusively in black \
and white, in etching, lithography and woodcut. She reduces the setting to nothing and \
concentrates everything on faces, hands and bodies tried by hardship: hunger, labour, \
revolt, death, motherhood. Her broad, grave line, of great economy, makes her one of \
the strongest voices of committed art and of German Expressionist realism."""

[[artistes]]
nom = "Amedeo Modigliani"
vie = "Livorno (Italy), 12 July 1884 – Paris, 24 January 1920"
biographie = """
Born in Livorno into a cultivated but ruined Sephardic Jewish family, Amedeo \
Modigliani, in fragile health, studied painting in Livorno, Florence and Venice, \
nourished by the masters of the Renaissance. In 1906, he settled in Paris, first in \
Montmartre and then in Montparnasse. Between 1909 and 1914, encouraged by the sculptor \
Constantin Brancusi, he devoted himself mainly to sculpture and carved elongated stone \
heads, before his health obliged him to give it up. Returning to painting, he made \
portraits of his friends, Soutine, Max Jacob, Cocteau, and a series of nudes; at their \
exhibition at the Galerie Berthe Weill, in 1917, the police demanded their removal on \
the very day of the opening. His dealers, Paul Guillaume and then Léopold Zborowski, \
supported him. In 1917, he met Jeanne Hébuterne, who gave him a daughter in 1918. \
Undermined by tuberculosis, alcohol and poverty, he died in 1920 at thirty-five, just \
as his painting was beginning to sell."""
style = """
Modigliani created an immediately recognisable human figure: oval face, stretched \
neck, long nose, almond eyes often without pupils, sloping shoulders. This canon unites \
the grace of the Sienese painters and of Botticelli, the simplification of African and \
archaic sculpture, and the construction of Cézanne. Neither Fauve nor Cubist, he \
remained on the margins of the movements of his time, but shares with the \
Expressionists the desire to convey an inner presence rather than a likeness."""

[[artistes]]
nom = "Paula Modersohn-Becker"
vie = "Dresden, 8 February 1876 – Worpswede (near Bremen), 20 November 1907"
biographie = """
Born in Dresden into a cultivated family that settled in Bremen in 1888, Paula Becker \
trained as a teacher, as her parents wished, while taking drawing and painting classes \
in London and Berlin. In 1898, she joined Worpswede, an artists' colony nestled in the \
peat bogs near Bremen, where she became friends with the sculptor Clara Westhoff, \
future wife of the poet Rilke. Between 1900 and 1907, she made four stays in Paris, \
where she discovered Cézanne, Gauguin, the Nabis and the Fayum portraits. In 1901, she \
married the painter Otto Modersohn, a widower and father of a little girl. Stifled by \
married life and by the Worpswede circle, which judged her painting clumsy, she left \
alone for Paris in 1906, where she painted self-portraits and still lifes of a new \
freedom. Back in Worpswede, she died in November 1907, eighteen days after the birth \
of her daughter Mathilde, at thirty-one. She had sold only a few paintings; she left \
more than seven hundred."""
style = """
Paula Modersohn-Becker moved beyond the sentimental realism of the Worpswede painters \
to a painting of simple, massive forms, with muted colours and a grainy surface. \
Inspired by Cézanne, Gauguin and archaic art, she painted peasant women, children, \
mothers and above all herself, with unprecedented gravity and frankness. A pioneer of \
German Expressionism, she is also one of the first women to have made her own body the \
subject of her art."""

[[artistes]]
nom = "Gwen John"
vie = "Haverfordwest (Wales), 22 June 1876 – Dieppe, 18 September 1939"
biographie = """
The daughter of a solicitor, Gwendolen Mary John grew up in Tenby, on the Welsh coast, \
with her younger brother Augustus, the future famous painter. From 1895 to 1898, she \
studied at the Slade School of Fine Art in London, then followed Whistler's teaching in \
Paris. In 1904, she settled in France, where she would live until her death. She became \
the model and lover of Auguste Rodin, then withdrew in 1911 to Meudon, where she \
converted to Catholicism and painted, for the nuns of the neighbouring convent, a \
series of portraits of their founder. From 1910, the New York collector John Quinn \
bought her works regularly and ensured her a precious independence. She had only one \
solo exhibition in her lifetime, in London, in 1926. After Quinn's death, she painted \
less and less and lived in great solitude. She died in Dieppe in 1939, long eclipsed by \
her brother's fame before being recognised as one of the great British painters of her \
century."""
