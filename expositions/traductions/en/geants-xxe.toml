[exposition]
ordre = 195
nom_court = "Giants of the 20th Century"
mouvement = "The Giants of the Early Twentieth Century: Matisse, Kandinsky, Klee, Rousseau, Redon, Modigliani…"
cadre = "noir"
couleur = "#9b2a1e"
titre = "The Giants of the Early Twentieth Century, from Matisse to Klee"
artiste = "Matisse, Kandinsky, Klee, Rousseau, Redon, Modigliani, Kollwitz…"
dates = "1900–1923"
accroche = "Virtual exhibition · Museo Reina Sofía, Madrid"
introduction = """
Between 1900 and 1923, a handful of artists changed the face of painting. Matisse made \
colour a subject in its own right, Kandinsky freed it from objects, the Cubists took \
figures apart into facets; Le Douanier Rousseau, Odilon Redon and Paul Klee opened the \
doors of dreams long before the Surrealists; Käthe Kollwitz, Modigliani, Paula \
Modersohn-Becker and Gwen John sought the truth of a face or the silence of a room. All \
have long been dead and their works are now free of rights: the ten paintings and \
prints of this visit come from museums in Chicago, Washington, New York and Cleveland, \
which publish their photographs without restriction. The giants who came after them, \
Picasso, Dalí or Frida Kahlo, are still protected by copyright: here they are only \
evoked, never shown. The building is inspired by the Museo Reina Sofía in Madrid, the \
former hospital turned museum of twentieth-century art: a vestibule, a great white \
room for the avant-gardes, and two more intimate rooms on either side, one for dreams, \
the other for faces."""
vitrine = "femme-aquarium.jpg"

[musee]
nom = "Museo Nacional Centro de Arte Reina Sofía"
ville = "Madrid, Spain"
architecte = "Francesco Sabatini; extension by Jean Nouvel"
construction = "late 18th century; art centre since 1986"
presentation = """
The Reina Sofía occupies the former General Hospital of Madrid, built in the eighteenth \
century, mostly under the reign of Charles III: an immense austere building arranged \
around inner courtyards, whose construction was directed by the architect Francesco \
Sabatini and of which only part of the project was built. The hospital closed in 1965; \
threatened with demolition, the building was protected and restored, and opened in 1986 \
as an art centre, before becoming in 1988 the national museum of modern art, under the \
name of Queen Sofía. Its two glass elevator towers, added to the façade, and Jean \
Nouvel's extension, inaugurated in 2005 beneath a great red roof, have made it a \
landmark of the Atocha district. The museum holds Picasso, Dalí, Miró and Juan Gris; \
its most famous room, on the second floor, is that of Guernica, which arrived in 1992 \
with its preparatory drawings."""
ici = """
The ARTEON building borrows from the Reina Sofía its white walls and the tall rooms of \
a former hospital. Visitors enter from the south into the Sabatini vestibule, seven \
metres high, then into the room of the avant-gardes, the largest, eighteen metres wide \
and nine metres high, where Matisse, Kandinsky and Marcoussis hang side by side. From \
there, a door to the west leads to the cabinet of dreams, that of Klee, Le Douanier \
Rousseau and Redon; a door to the east leads to the room of faces and intimacy, that of \
Käthe Kollwitz, Modigliani, Paula Modersohn-Becker and Gwen John. These are two rooms \
of twelve metres by ten with warm white walls, lower and more intimate."""

