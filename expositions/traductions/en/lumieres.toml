[exposition]
ordre = 60
nom_court = "Enlightenment"
mouvement = "Rococo and Neoclassicism"
cadre = "baroque"
couleur = "#8e3b4f"
titre = "The Age of Enlightenment, from Rococo to Neoclassicism"
artiste = "Watteau, Boucher, Fragonard, Chardin, David, Ingres…"
dates = "1717–1814"
accroche = "Virtual exhibition · Wallace Collection, London"
introduction = """
In the eighteenth century, painting moved from the grace of the Rococo, with its fêtes galantes, \
pearly nudes and amorous games, to the rigour of Neoclassicism, which extolled ancient \
virtue on the eve of the Revolution. Ten canvases follow this shift, from Watteau to \
Fragonard, from Chardin to Canaletto, Gainsborough and Vigée Le Brun, down to David and \
Ingres. The building is inspired by the Wallace Collection in London, the residence of \
Hertford House, where colourful salons are arranged around a courtyard \
covered by a glass roof. The last gallery, tall and solemn, evokes the Salle Daru \
of the Louvre and its very large canvases by David."""
vitrine = "escarpolette.jpg"

[musee]
nom = "Wallace Collection"
ville = "London, United Kingdom"
construction = "opened in 1900"
presentation = """
Hertford House, north of Oxford Street, is a town mansion of the late eighteenth \
century, built for the Duke of Manchester, who gave his name to the square it borders, \
Manchester Square. The Marquesses of Hertford made it their London home and, over \
four generations, accumulated paintings, furniture, Sèvres porcelain and armour there; \
the fourth Marquess, who lived in Paris, gathered most of the masterpieces of the French \
eighteenth century. His heir, Sir Richard Wallace, enlarged the house to install \
the collection, which his widow bequeathed to the nation in 1897. The museum opened in 1900, on \
condition that the collection remain intact and without additions. The salons, with walls hung \
with coloured fabrics, retain the atmosphere of a home, and the inner courtyard has been \
covered by a glass roof since 2000. Here one can see Fragonard's The Swing, Watteau, \
Boucher, Canaletto and Frans Hals's Laughing Cavalier."""
ici = """
ARTEON's building takes up the plan of Hertford House: a covered courtyard at the centre, with \
salons all around. One enters from the south into the covered courtyard, which is square and ten \
metres high beneath its glass roof. To the west opens Salon I · Les fêtes galantes, with pale \
pink walls; to the east, Salon II · Life and Faces, with soft green walls, two \
rooms six metres high. To the north, the great Neoclassical gallery, more than \
twenty-three metres wide and ten metres high, with pale red walls, evokes the Salle Daru of the Louvre \
and welcomes David and Ingres."""

