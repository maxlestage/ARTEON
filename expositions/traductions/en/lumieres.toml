[[oeuvres]]
titre = "The Oath of the Horatii"
artiste = "Jacques-Louis David"
annee = "1784–1785"
image = "serment-horaces.jpg"
technique = "Oil on canvas, 330 × 425 cm"
collection = "Musée du Louvre, Paris"
note = "Three brothers swear to conquer or die for Rome: shown at the Salon of 1785, the manifesto painting of Neoclassicism."
description = """
In a hall with bare stone walls, punctuated by three arches on \
Doric columns, three groups stand side by side. On the left, three helmeted brothers, pressed \
against one another, stretch out their arms in a single impulse. At the centre, their father, in a \
red cloak, holds up toward the sky the three swords they are about to receive. On the right, set apart, \
the women of the family collapse in grief: Camilla, sister of the Horatii and \
betrothed to one of the Curiatii, and Sabina, sister of the Curiatii and wife of one of the \
Horatii, bowed against one another; behind them, an older woman shelters two \
small children beneath her veil. The tiled floor, in perspective, extends the scene \
toward us. Neither furniture nor landscape distracts the eye."""
evocation = """
The subject comes from Roman history as told by Livy: under King Tullus \
Hostilius, Rome and Alba decide to settle their war by a combat between three \
champions from each side, the Horatii for Rome, the Curiatii for Alba. The two \
families are linked by marriages, hence the drama. The oath, absent from the ancient \
texts, is David's invention: it condenses into a single gesture the sacrifice of the \
individual to the fatherland. The opposition between the men, tense and rectilinear, and the \
women, bowed and overwhelmed, sets civic duty against private feeling. Commissioned \
for the king four years before the Revolution, the painting became after the fact a symbol of \
republican virtue."""
histoire = """
The canvas was commissioned in 1784 by the Direction des Bâtiments du roi, headed by \
the Comte d'Angiviller, who wished to encourage an edifying history painting. To \
recover the antique inspiration, David left for Rome with his wife and his pupil \
Jean-Germain Drouais, and painted the picture there. Exhibited first in his Roman studio, \
it attracted artists and connoisseurs, then travelled to Paris for the Salon of 1785, where it caused a \
sensation and secured its author's renown. Intended for the royal collections, it \
entered the Louvre at the Revolution. It now hangs there in the Salle Daru, alongside \
other very large canvases by David and his pupils."""
facture = """
David breaks with Rococo grace. The composition has a geometric rigour: three \
arches, three groups, three swords. The figures, arranged as in an ancient bas-relief, \
stand out against a dark, shallow background. The drawing is firm, the \
contours sharp, the musculature sculptural, studied from the live model and from ancient \
statuary. The colours, reds, whites and blues, are laid on frankly and \
the brushwork disappears beneath a smooth surface. A lateral light, coming from the left, \
strikes the figures and carves deep shadows, in the tradition of Caravaggio and \
Poussin, whom David had studied in Rome."""
details = [
  "The three swords held up by the father, at the point of convergence of the composition.",
  "The legs of the three brothers, taut as bows, in the same impulse.",
  "The distaff on the ground, at right, a symbol of the hearth and of women's work.",
  "The three arches of the background, one for each group of figures.",
  "The older woman, at back right, sheltering two children beneath her veil.",
]
themes = ["history", "antiquity", "fatherland", "sacrifice", "Neoclassicism"]
anecdote = """
A reduced replica of the painting, made in 1786 by David with the help of his pupil \
Anne-Louis Girodet for the Comte de Vaudreuil, is now kept on the other \
side of the Atlantic, at the Toledo Museum of Art, in Ohio."""
salle = 4
mur = "nord"
place = 4
largeur = 4.25

[[oeuvres]]
titre = "The Death of Marat"
artiste = "Jacques-Louis David"
annee = "1793"
image = "mort-de-marat.jpg"
technique = "Oil on canvas, 165 × 128 cm"
collection = "Royal Museums of Fine Arts of Belgium, Brussels"
note = "Painted in the months following the revolutionary's assassination on 13 July 1793: a secular martyr, in the manner of a Pietà."
description = """
Jean-Paul Marat has just died in his bath. His head, wrapped in a white cloth, \
falls onto his shoulder, his eyes closed. His right arm hangs out of the bath \
and still holds a quill; his left hand clutches a letter, resting on a board \
covered with a green cloth that serves him as a writing desk. On the chest, a wound from which \
a trickle of blood flows, staining the water and the white sheet. On the floor, the bloodied \
knife. In the right foreground, a wooden crate bears an inkwell, a quill, \
an assignat and a note, and the inscription \"À Marat, David\", like a dedication \
carved on a tomb. The whole upper half of the canvas is empty, a dark, \
vibrant brown."""
evocation = """
David turns an assassination into a political icon. Marat, a Montagnard deputy and \
journalist of L'Ami du peuple, is presented as a martyr of the Revolution: he \
dies poor, at work, quill in hand. The pose of the hanging arm recalls that \
of the dead Christ in the Entombments and Pietàs, in particular that of \
Caravaggio, which David knew; people have spoken of a \"revolutionary Pietà\". The note \
placed on the crate accompanies an assignat intended for a mother of a family whose husband \
died for the fatherland: against the murderess's letter, it underlines the generosity \
of the victim. The peaceful face erases the skin disease from which Marat suffered, and the \
emptiness of the background gives the scene an almost religious gravity."""
histoire = """
On 13 July 1793, Charlotte Corday, a young Norman woman close to the Girondins, had herself \
received at Marat's home, rue des Cordeliers, on the pretext of denouncing \
conspirators to him, and stabbed him in his bath. The next day, at the Convention, a deputy \
asked David, who had already painted the assassinated Le Peletier de Saint-Fargeau, \
to immortalise Marat; the painter accepted and also organised his funeral. The \
painting was presented to the Convention in November 1793 and hung in the \
assembly hall. After Robespierre's fall, it was returned to David in 1795. The painter, \
exiled in Brussels under the Restoration, died there in 1825; his descendants later gave \
the painting to that city's museum, which it entered at the end of the nineteenth century."""
facture = """
The composition is of extreme sobriety: one horizontal, that of the bath and \
the writing board, one vertical, that of the crate, and a great void above. Marat's \
body, brightly lit, is modelled like an ancient sculpture, with a marble \
pallor. The background, rubbed in with fine, tight touches, vibrates with a muted light, \
lighter on the right. The objects in the foreground, the crate with its veined wood, the \
paper, the quill, are painted with the meticulous realism of a still life, almost \
trompe-l'œil. The palette is reduced: whites, greens, browns and the red of blood."""
details = [
  "Charlotte Corday's letter, dated 13 July 1793, in Marat's hand.",
  "The quill still held by the hand hanging out of the bath.",
  "The white-handled knife, stained with blood, lying on the floor.",
  "The inscription \"À Marat, David\" on the crate, and below it \"L'an deux\".",
  "The wound beneath the collarbone, almost discreet, and the blood reddening the water.",
]
themes = ["revolution", "death", "martyr", "politics", "history"]
anecdote = """
Beneath the dedication, David dated his work \"L'an deux\" (Year Two): the Republican calendar, \
which began Year II on 22 September 1793, had only just been adopted \
by the Convention, in October, while he was painting the picture."""
salle = 4
mur = "ouest"
place = 2
largeur = 1.28

[[oeuvres]]
titre = "The Grande Odalisque"
artiste = "Jean-Auguste-Dominique Ingres"
annee = "1814"
image = "grande-odalisque.jpg"
technique = "Oil on canvas, 91 × 162 cm"
collection = "Musée du Louvre, Paris"
note = "Commissioned by the Queen of Naples, Napoleon's sister: a reclining, elongated nude, with a perfection of line that disconcerted his contemporaries."
description = """
A nude woman, lying on a blue velvet divan, turns her back to us and looks \
over her shoulder, impassive. Her hair is gathered in a striped silk turban, \
adorned with a jewel and a golden tassel. In her right hand she loosely holds a \
fan of peacock feathers; her crossed legs stretch to the right edge of the \
canvas. Around her, precious fabrics: a heavy embroidered blue curtain on the right, \
cushions, a yellow silk and a crumpled white sheet on the left, a fur beneath \
her legs. At lower right, an incense burner and a long pipe; at lower left, \
jewels. The background is dark, without window or depth."""
evocation = """
The odalisque, a woman of the harem, belongs to the Oriental imaginary that fascinated Europe \
in the early nineteenth century. Ingres never saw the Orient: he composes a dreamed world \
from travel accounts, engravings and objects. The ambiguity of this image has been \
stressed: the body is offered to the gaze, but the face remains cold and distant. \
The painting extends the tradition of the reclining nude, from Giorgione to Titian, and the pose of \
Madame Récamier painted by David, but it shifts the antique ideal toward the exotic. \
Feminist critics, from the 1970s on, have seen in it an example of the male gaze \
directed at women's bodies, while others stress Ingres's formal \
research: the beauty of line before anatomical truth."""
histoire = """
Established in Rome since 1806, Ingres received from Caroline Murat, Napoleon's sister and \
Queen of Naples, a commission for a nude to serve as a pendant to another nude by the painter, \
the Sleeping Woman of Naples, acquired by her husband. He painted the canvas in 1814, but the fall \
of the Empire and that of the Murats, in 1815, prevented its delivery. Ingres exhibited it at the \
Salon of 1819, in Paris, where it was poorly received: critics judged the proportions \
wrong, the back too long, the modelling too smooth and the colours cold. The painting \
then passed through several private collections. The Louvre acquired it in 1899, at \
a time when Ingres had become a reference for modern painters, from Degas to \
Matisse."""
facture = """
Ingres, a pupil of David, claims the primacy of drawing. The continuous line running \
from nape to toes counts for more than anatomy: the back is lengthened, the arm \
stretched, the hip widened, to create a perfect curve. The modelling is very soft, \
almost without shadows, and the skin seems polished like enamel. The brushwork is invisible, \
the surface smooth. The pearly skin stands out against the cold blue of the curtain and divan, \
warmed by the yellow silk and the stripes of the turban. The accessories, feathers, \
gems, fabrics, are painted with a meticulousness that owes much to the Flemish masters \
and to Raphael, his absolute model."""
details = [
  "The immoderately long back, forming a single curve from nape to hip.",
  "The peacock-feather fan, loosely held in the right hand.",
  "The striped silk turban, held by a jewel and extended by a golden tassel.",
  "On the right, the long pipe and the incense burner, accessories of the dreamed Orient.",
  "At lower right, Ingres's signature and the date, 1814, followed by the word \"Rom\".",
]
themes = ["nude", "Orientalism", "line", "harem", "Neoclassicism"]
anecdote = """
In 1989, the feminist artists' collective the Guerrilla Girls took the Grande \
Odalisque, topped with a gorilla's head, for a poster asking whether women \
had to be naked to get into the Metropolitan Museum in New York, where most \
nudes were female and very few artists were women."""
salle = 4
mur = "est"
place = 2
largeur = 1.62

[[artistes]]
nom = "Antoine Watteau"
vie = "Valenciennes, 10 October 1684 – Nogent-sur-Marne, 18 July 1721"
biographie = """
The son of a master roofer from Valenciennes, a town that had become French shortly before his \
birth, Antoine Watteau trained first with a local painter, then went to Paris \
around 1702. He lived there in poverty, copying devotional paintings by the dozen, before \
entering the studio of Claude Gillot, painter of theatre scenes and the commedia dell'arte, \
then that of the decorator Claude Audran, concierge of the Luxembourg Palace, where he \
discovered the Marie de' Medici cycle painted by Rubens. Runner-up for the Prix de Rome in \
1709, he never went to Italy. Approved by the Académie royale in 1712, he was received there \
only in 1717, with the Embarkation for Cythera. The financier Pierre Crozat \
housed him and opened his collection of drawings to him. Afflicted with tuberculosis and of restless \
temper, he constantly changed lodgings. He stayed in London in 1719–1720, then \
painted for his friend the dealer Edme-François Gersaint a celebrated shop \
sign. He died at thirty-six. His friend Jean de Jullienne then had \
most of his work engraved, and it spread throughout Europe."""
style = """
Watteau invented the fête galante: elegant couples in silk costumes, sometimes in \
theatre costume, converse, play music or court one another in dreamed-of parks. His quick, light touch, inherited from Rubens and the Venetians, makes \
the fabrics shimmer and melts the landscapes into a golden haze. His countless drawings in \
three chalks feed his compositions. Behind the grace lies a melancholy that \
makes him singular. He opens the way to the Rococo, from Boucher to Fragonard."""

[[artistes]]
nom = "François Boucher"
vie = "Paris, 29 September 1703 – Paris, 30 May 1770"
biographie = """
The son of a designer of embroidery patterns, François Boucher passed briefly through \
the studio of François Lemoyne and worked as an engraver, notably for the collection \
of Watteau's drawings published by Jean de Jullienne. Winner of the Academy's grand prix \
in 1723, he left at his own expense for Italy, where he stayed from 1728 to 1731. \
Back in Paris, he was received into the Académie royale in 1734. His career was then \
meteoric: he supplied designs to the Beauvais tapestry manufactory, then \
directed the Gobelins, designed opera sets and models for \
Vincennes and Sèvres porcelain, and decorated the royal residences of Versailles, \
Fontainebleau and Marly. The Marquise de Pompadour, Louis XV's favourite, became his \
patron; he painted her most famous portraits. In 1765, he was appointed \
First Painter to the King and director of the Academy. But taste changed, and Diderot \
attacked in his Salons an art he judged artificial and licentious. Boucher died in \
Paris in 1770, leaving an immense body of work."""
style = """
Boucher is the Rococo painter par excellence. He painted mythological scenes, \
pastorals and nudes with pearly flesh, in a light palette of pinks, \
blues and whites. His compositions, all curves and arabesques, have a \
decorative grace designed for interiors, wood panelling and tapestries. His virtuoso drawing \
spread across Europe through engraving. Criticised by Diderot and rejected \
by Neoclassicism, he was rehabilitated in the nineteenth century."""

[[artistes]]
nom = "Jean-Honoré Fragonard"
vie = "Grasse, 5 April 1732 – Paris, 22 August 1806"
biographie = """
Born in Grasse into a modest family of tradesmen, Jean-Honoré Fragonard arrived in \
Paris as a child. Placed with a notary, he showed such a taste for drawing that he was \
taken to Chardin, then to Boucher. Winner of the Academy's grand prix in 1752, he stayed \
at the Académie de France in Rome from 1756 to 1761; there he drew the gardens of the Villa \
d'Este, at Tivoli, alongside his friend Hubert Robert, and travelled with the Abbé de \
Saint-Non. His large history painting, Coresus and Callirhoe, earned him approval \
by the Academy in 1765 and was bought for the king. Yet he abandoned the \
official career to work for private collectors: gallant scenes, fantasy figures, \
landscapes. In 1769, he married Marie-Anne Gérard, a miniaturist from \
Grasse; her sister, Marguerite Gérard, became his pupil. The cycle of the \
Progress of Love, commissioned by Madame du Barry for her pavilion at Louveciennes, \
was returned to him. During the Revolution, supported by David, he took part in organising \
the Muséum, the future Louvre. Gone out of fashion, he died almost forgotten in 1806."""
style = """
Fragonard paints with astonishing virtuosity and speed. His free, \
fiery touch treats fabrics, foliage and faces in a few strokes of \
the brush, notably in his famous fantasy figures. An heir of Boucher, \
an admirer of Rubens and the Venetians, he gives the Rococo a more sensual and more \
lively impetus, between libertinism, family scenes and luminous landscapes. Forgotten in the nineteenth \
century and then rediscovered, he appears as a precursor of the free painting of the \
Impressionists."""

[[artistes]]
nom = "Jean Siméon Chardin"
vie = "Paris, 2 November 1699 – Paris, 6 December 1779"
biographie = """
The son of a Parisian cabinetmaker who made billiard tables, notably for the king, Jean \
Siméon Chardin trained with the history painters Pierre-Jacques Cazes and \
Noël-Nicolas Coypel, but quickly chose the genres considered minor. A member of the Académie \
de Saint-Luc, the painters' guild, he was received into the Académie royale in 1728 \
as a painter of animals and fruit. In the 1730s, he turned to \
genre scenes: bourgeois interiors, maidservants, children playing cards or \
blowing soap bubbles. In 1740, he presented The Blessing to King Louis XV. His \
paintings, circulated through engraving, became very popular. Widowed in 1735, he \
remarried in 1744. Lodged at the Louvre from 1757, he was treasurer of the Academy and, \
for more than ten years, responsible for hanging the paintings of the Salon. Late in life, \
as his sight failed, he turned to pastel and produced striking self-portraits, \
wearing a cap and spectacles. Diderot admired him without \
reservation. He died at the Louvre in 1779."""
style = """
Chardin paints humble objects, jugs, fruit, game, and silent domestic \
scenes, without anecdote or heavy-handed moral. His paint is thick, grainy, laid on \
in superimposed touches that give things an almost tactile presence. His \
compositions, simple and balanced, are bathed in a soft light that unifies the \
tones. Far from the decorative grace of the Rococo, his art of truth and contemplation \
profoundly marked Cézanne, Matisse and the modern still life."""

[[artistes]]
nom = "Giovanni Antonio Canal, dit Canaletto"
vie = "Venice, October 1697 – Venice, 19 April 1768"
biographie = """
The son of the theatre set painter Bernardo Canal, hence his nickname of \"little Canal\", \
Giovanni Antonio Canal first worked with his father for the operas of Venice and \
Rome. In Rome, around 1720, he discovered views of ruins and monuments and decided \
to devote himself to the veduta, the city view. Back in Venice, he painted for \
Venetian collectors and then, more and more, for the wealthy English travellers of the Grand \
Tour, who wanted to take home a souvenir of the city. The merchant Joseph \
Smith, later British consul in Venice, became his agent and chief \
collector; his collection was bought in 1762 by King George III. When \
the War of the Austrian Succession dried up the flow of visitors, Canaletto left for \
London in 1746 and stayed there nearly ten years, painting the Thames, Westminster and \
aristocratic residences. Back in Venice, he was admitted to the Venetian Academy \
only in 1763. His nephew and pupil Bernardo Bellotto carried his art on to Dresden and \
Warsaw."""
style = """
Canaletto is the master of the veduta. He combines a rigorous perspective, inherited \
from theatre sets, with a meticulous observation of buildings, boats and \
crowds. He probably used a camera obscura for his studies, but \
freely recomposed his views in the studio. His early canvases, with cloudy skies and \
contrasting shadows, are the freest; the later ones, of crystalline clarity, \
more systematic. He fixed forever the image of Venice."""

[[artistes]]
nom = "Thomas Gainsborough"
vie = "Sudbury (Suffolk), baptised 14 May 1727 – London, 2 August 1788"
biographie = """
The son of a cloth merchant of Sudbury, in Suffolk, Thomas Gainsborough left for \
London at about the age of thirteen to learn the trade. There he frequented the French \
engraver Hubert Gravelot and the artistic circle of St Martin's Lane, and restored \
Dutch landscapes for dealers. In 1746, he married Margaret Burr, then \
returned to Sudbury and later settled in Ipswich, where he painted the minor gentry of the \
region. In 1759, he moved to Bath, a fashionable spa town, where an \
aristocratic clientele commissioned large full-length portraits from him; there he studied the portraits of \
Van Dyck. A founding member of the Royal Academy in 1768, he settled in London in \
1774, at Schomberg House, on Pall Mall. He became one of the royal family's favourite portraitists and \
the great rival of Joshua Reynolds, president of the Academy. \
Having quarrelled with it over the hanging of his paintings, he stopped exhibiting there \
from 1784. He died of cancer in 1788. All his life, he preferred to paint \
landscapes, which nevertheless sold poorly."""
style = """
Gainsborough has a touch of exceptional lightness and freedom: quick, \
transparent hatching that makes silks and foliage vibrate. An admirer \
of Van Dyck, he gives his portraits an airy elegance and gladly places his \
sitters in nature. His landscapes, inspired by the Dutch and then by Rubens, open \
the way to Constable, his fellow Suffolk man, and to the great English landscape \
painting."""

[[artistes]]
nom = "Élisabeth Vigée Le Brun"
vie = "Paris, 16 April 1755 – Paris, 30 March 1842"
biographie = """
The daughter of the pastellist Louis Vigée, who died when she was only twelve, Élisabeth \
Vigée learned painting almost on her own, by copying the masters and thanks to the advice of \
artists who were friends of her father. As a teenager, she was already supporting her family with her \
portraits. In 1776, she married the picture dealer Jean-Baptiste-Pierre Le Brun. \
From 1778, she painted Queen Marie-Antoinette, of whom she made about \
thirty portraits. Thanks to the queen's intervention, she was received into the \
Académie royale in 1783, the same day as Adélaïde Labille-Guiard, although the \
number of women there was limited to four. Close to the court, she left Paris in \
October 1789. Her exile took her to Italy, Vienna and then Russia, where she stayed from \
1795 to 1801; everywhere, courts and academies welcomed her. Returning to France in \
1802, she travelled again to England and Switzerland. She published her Souvenirs late in \
life, from 1835 to 1837, and left about 660 portraits and nearly 200 \
landscapes."""
style = """
Vigée Le Brun is one of the great portraitists of her time. She flatters her \
sitters without stiffening them: natural poses, smiles, direct gazes, simple, \
supple clothing that she advises them to wear. Her fluid touch and luminous \
flesh tones owe much to Rubens and Van Dyck, whom she studied on \
a trip to Flanders. Between Rococo grace and Neoclassical simplicity, she \
invents a sensitive and intimate image of woman and motherhood."""

[[artistes]]
nom = "Jacques-Louis David"
vie = "Paris, 30 August 1748 – Brussels, 29 December 1825"
biographie = """
Fatherless at nine, Jacques-Louis David was raised by his uncles and entered \
the studio of Joseph-Marie Vien. After several failures, he won the Prix de Rome in 1774 and stayed in Italy from 1775 to 1780; the study of the antique and of Poussin \
there transformed his art. Back in Paris, he triumphed at the Salons with Belisarius in \
1781, the Oath of the Horatii in 1785, the Death of Socrates in 1787 and the Lictors \
Bringing Brutus the Bodies of His Sons in 1789. Committed to the Revolution, a deputy to \
the Convention in 1792, he voted for the death of Louis XVI, sat on the Committee of General \
Security and organised the great revolutionary festivals. Imprisoned after the fall of \
Robespierre, he then painted The Sabine Women, completed in 1799, and rallied to \
Bonaparte, who named him First Painter in 1804; he then painted The Coronation of Napoleon. \
Proscribed as a regicide on the return of the Bourbons, he went into exile in Brussels in 1816 and \
died there in 1825. His studio trained a whole generation: Gros, Girodet, Gérard, \
Ingres."""
style = """
David founded Neoclassical painting. Against Rococo grace, he imposed a \
firm drawing, sharp contours, clear compositions inspired by ancient bas-reliefs \
and by Poussin, and a smooth surface where the brushwork disappears. His subjects extol \
civic virtue, sacrifice and heroism. A committed painter, he put his art at the service \
of the Revolution and then of the Empire. Through his teaching and his pupils, he dominated \
European painting for half a century."""

[[artistes]]
nom = "Jean-Auguste-Dominique Ingres"
vie = "Montauban, 29 August 1780 – Paris, 14 January 1867"
biographie = """
The son of a decorative painter and sculptor from Montauban, who was also a musician, \
Jean-Auguste-Dominique Ingres studied at the academy of Toulouse and played the violin in \
the orchestra of the Capitole: the \"violon d'Ingres\" has become an expression. In 1797, \
he entered David's studio in Paris. Winner of the Prix de Rome in 1801, he left for \
Italy only in 1806, for lack of funds. He remained in Rome well beyond his \
official stay, living partly on portraits drawn in graphite, then settled in \
Florence. His submissions to the Salon, judged strange, were poorly received. Success came in 1824 \
with The Vow of Louis XIII: he returned to Paris, opened a well-attended studio and \
became the leader of the classical school against Delacroix and the Romantics. \
Wounded by the reception of The Martyrdom of Saint Symphorian in 1834, he directed the Académie \
de France in Rome from 1835 to 1841. Showered with honours, he painted The Turkish Bath at over \
eighty. He died in Paris in 1867 and bequeathed to his native town a large \
part of his drawings."""
style = """
Ingres places drawing above everything: \"drawing is the probity of art\", \
he said. His figures, of a pure and continuous line, are often distorted for the sake \
of harmony: elongated necks, stretched backs. The modelling is smooth, the brushwork invisible, \
and silks, jewels and hair are rendered with striking precision. \
