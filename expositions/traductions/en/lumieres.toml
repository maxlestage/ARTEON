[[oeuvres]]
titre = "The Embarkation for Cythera"
artiste = "Antoine Watteau"
annee = "1717"
image = "pelerinage-cythere.jpg"
technique = "Oil on canvas, 129 × 194 cm"
collection = "Musée du Louvre, Paris"
note = "Watteau's reception piece for the Académie royale, for which a new category was invented: the \"fête galante\"."
description = """
By a lake, beneath tall golden trees, about ten couples in silk finery are preparing to \
leave a hill. On the right, at the foot of a bust of Venus garlanded with roses, a \
seated couple still lingers: the man whispers in his companion's ear, while she lowers her eyes to her fan, as a little Cupid seated on \
a quiver tugs at her skirt. A little further on, a man helps a woman to her \
feet; then a pilgrim, staff in hand, leads off his companion in a yellow dress, who \
casts one last glance behind her. The couples thus descend toward the shore, on the \
left, where a gilded boat waits, surrounded by a cloud of Cupids. In the background, \
bluish mountains melt into a pearly sky."""
evocation = """
The subject comes from the theatre: in Dancourt's Les Trois Cousines, performed in 1700, \
young people set off on a pilgrimage to Cythera, the island of Venus, to find \
love. Watteau turns it into a reverie. Since a famous article by the historian Michael \
Levey, the scene has often been read as a departure: the pilgrims have honoured Venus and \
are leaving the island with regret, hence the young woman's backward glance. The three \
couples on the right would then become successive moments of a single story, from \
persuasion to departure. Beneath the elegance lies a melancholy: pleasure is fleeting, \
and the light is that of the end of the day. After the austerity of the last years of \
Louis XIV, who died in 1715, the painting embodies the new taste of the Régence for \
intimacy, music and amorous play."""
histoire = """
Approved by the Académie royale de peinture et de sculpture in 1712, Watteau was expected to deliver \
a reception piece whose subject he was free to choose. He kept the Academy waiting \
five years: the canvas was only presented on 28 August 1717. The Academy accepted it, but \
in the minutes the title \"le pèlerinage à l'isle de Cithère\" is struck out and \
replaced by \"une feste galante\": a category that did not exist was created for Watteau. \
The success was such that the painter soon produced a second version, more \
elaborate, later acquired by Frederick II of Prussia and now kept at \
Charlottenburg Palace in Berlin. The 1717 canvas remained in the Academy's collections, \
nationalised at the Revolution, and thus entered the Louvre."""
facture = """
Watteau paints quickly, in thin, transparent layers, with a light, \
quivering touch inherited from Rubens, whom he had studied at the Luxembourg Palace. The \
shimmering colours of the silks, pinks, yellows, blues, stand out against a landscape \
of soft ochres and greens. The composition follows a diagonal descending from right \
to left, from the bust of Venus to the boat, and the frieze of figures traces an \
undulating line. The figures come from his sketchbooks: Watteau drew \
ceaselessly, in red chalk and black chalk, and drew on these sheets to compose \
his paintings."""
details = [
  "On the right, the bust of Venus crowned with roses, half hidden in the foliage.",
  "The little Cupid seated on a quiver, tugging at the skirt of the young woman with the fan.",
  "The pilgrim's staff and the short pilgrim's cape of the man in pink, at the centre.",
  "The young woman in the yellow dress, turning back one last time toward the hill.",
  "On the left, the boat with its gilded prow and the ring of Cupids rising into the sky.",
]
themes = ["fête galante", "love", "journey", "melancholy", "theatre"]
anecdote = """
According to an oft-repeated anecdote, David's pupils, in the early nineteenth century, \
found Watteau's painting so frivolous that they amused themselves by pelting this canvas \
with pellets of breadcrumb."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.94

[[oeuvres]]
titre = "Diana Leaving Her Bath"
artiste = "François Boucher"
annee = "1742"
image = "diane-bain.jpg"
technique = "Oil on canvas, 57 × 73 cm"
collection = "Musée du Louvre, Paris"
note = "Shown at the Salon of 1742: the huntress goddess, resting after her bath, becomes a pretext for celebrating pearly flesh."
description = """
In a clearing, beside a stream, two nude young women rest on \
fabrics thrown down upon the grass. Seated on the right on a blue drapery, Diana, \
recognisable by the little crescent moon set in her hair, crosses her legs and \
looks at her foot; a string of pearls slips between her fingers. Beside her, a \
kneeling companion, a blue ribbon in her hair, leans toward the ground. Around \
them, the attributes of the hunt: a red quiver full of arrows at lower \
left, and on the right a bow and the slain game, birds and a hare. On the left, \
two hunting dogs approach the water. The reeds, the trees and a corner of pale \
sky form a background of bluish greenery."""
evocation = """
Diana is the virgin goddess of the hunt, fierce and feared: in mythology, the \
hunter Actaeon, who had surprised her bathing, was changed into a stag and devoured by his \
own hounds. Boucher retains nothing of this threat. He keeps only a \
few attributes of the myth and paints a moment of intimate repose, in which the viewer becomes a \
harmless Actaeon. The ancient subject serves as a pretext for the nude, which the \
aristocratic clientele appreciated in their cabinets and private apartments. It has been seen as the very \
essence of Rococo taste: grace rather than grandeur, the pleasure of the eye \
rather than the moral lesson. This is precisely what Diderot would reproach him for, denouncing \
in his Salons of the 1760s the artifice and affectation of Boucher."""
histoire = """
Boucher exhibited the painting at the Salon of 1742, at the Louvre, when he was already one of the \
most sought-after painters in Paris. Received into the Académie royale in 1734, he also worked \
for the Beauvais tapestry manufactory and for the royal residences; \
a few years later, he would become Madame de Pompadour's favourite painter. The \
small format of the canvas suited a private collector, and the painting then passed from \
collection to collection. After the Revolution, taste changed: Neoclassicism \
rejected Boucher as frivolous, and his works lost their value. The Louvre acquired \
this canvas only in the mid-nineteenth century, when collectors were rediscovering the art \
of the eighteenth century. It has become the painter's most famous work."""
facture = """
Boucher works the flesh in pearly tones, pinkish whites and ivory, which he sets \
off by contrast with the deep blue of the drapery and the dark greens of the \
background. The light comes from the left and glides over the bodies without hard shadows. The \
drawing is supple, all curves: the line of the crossed legs, the roundness of the \
shoulders, the folds of the fabric. The accessories, game, arrows, pearls, are painted \
with the precision of a still life. The landscape, by contrast, is treated more freely, \
almost like a theatre set, in the manner of the tapestry designs that Boucher \
drew for Beauvais."""
details = [
  "The little crescent moon, emblem of Diana, pinned in her hair.",
  "The string of pearls slipping between the goddess's fingers.",
  "At lower left, the red quiver full of arrows fletched in white.",
  "Boucher's signature, at bottom centre, on a stone at the water's edge.",
  "The game laid out on the right, painted with the precision of a still life.",
]
themes = ["mythology", "nude", "hunt", "bathing", "Rococo"]
anecdote = """
Pierre-Auguste Renoir, who had begun as a porcelain painter, loved this \
painting above all others: he said it was the first canvas that had \
captivated him at the Louvre, and that he had remained faithful to it all his life."""
salle = 2
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "The Swing"
artiste = "Jean-Honoré Fragonard"
annee = "1767–1768"
image = "escarpolette.jpg"
technique = "Oil on canvas, 81 × 64.2 cm"
collection = "Wallace Collection, London"
note = "Commissioned by a gallant patron, the most famous image of the Rococo: a young woman on a swing, and a lover hidden in the rose bushes."
description = """
In a leafy park, beneath a vault of trees shot through with golden light, a young \
woman in a pink silk dress swings out on a swing. The movement lifts her \
petticoats and sends one of her slippers flying off to the left. At lower left, \
half reclining in a clump of rose bushes, a young man stretches out his arm and his hat \
toward her, his gaze raised beneath her skirts. On the right, in the shadows, an older man \
pulls the ropes of the swing, seeing nothing of the scene. Two statues seem to \
look on: on the left, a Cupid on a pedestal, a finger pressed to his lips; beneath the \
swing, two little cupids clasped against a dolphin. At lower right, a little white \
dog barks."""
evocation = """
The whole painting is an amorous wink. The slipper flying off, the outstretched hat, \
the crumpled flowers: art historians have identified a series of gallant symbols here, \
and the swing itself had long evoked inconstancy and the game of \
seduction. The Cupid asking for silence makes the viewer an accomplice. \
The older man pushing the swing, seeing nothing, whom one often takes for the \
husband, is the classic dupe of the comedies of the day. This canvas has been seen as the \
pinnacle of the elegant libertinism of the end of Louis XV's reign, an art of pleasure and of \
connivance, conceived for a private patron and not for the Salon public. It is also what \
David's generation, in the name of virtue, would condemn."""
histoire = """
The painting's origin is known from the Journal of the playwright Charles Collé, \
who in 1767 recounts the story told by the painter Gabriel-François Doyen: a man of the court \
had asked him to paint his mistress on a swing pushed by a bishop, \
himself placed so as to see the beauty's legs. Doyen, a history painter, \
declined and suggested Fragonard, who accepted. The patron is traditionally \
identified as the Baron de Saint-Julien, receiver general of the clergy. In the painting, \
the bishop has become an elderly man in dark clothes. After passing through several collections, the \
canvas was bought in 1865 by the fourth Marquess of Hertford, in Paris. It forms \
part of Lady Wallace's bequest to the British nation in 1897, the origin of the \
Wallace Collection."""
facture = """
Fragonard, a pupil of Chardin and then of Boucher, paints with astonishing freedom of \
brushwork. The pink dress, at the centre of the composition, is made of lively, \
light touches that make the silk quiver; it receives all the light, while the two \
men remain in a greenish chiaroscuro. The foliage is brushed in frothy masses, \
almost abstract up close. The composition rests on a diagonal running from the young man on the left to the old man \
on the right, passing through the swing, like \
the arc of a pendulum. A restoration completed in 2021 gave the painting back its \
vivid colours and the depth of its sky."""
details = [
  "The pink slipper flying off to the left, above the clump of flowers.",
  "The statue of Cupid, finger to his lips, inspired by a sculpture by Falconet.",
  "The hat that the young man holds out toward the young woman.",
  "The old man in the shadows, on the right, holding the ropes and seeing nothing.",
  "The little white dog, at lower right, barking.",
]
themes = ["love", "play", "garden", "libertinism", "Rococo"]
anecdote = """
The title under which the painting is known in France comes from the engraving made after it by \
Nicolas de Launay, published in 1782 under the name \"Les Hasards heureux de l'escarpolette\" \
(The Happy Accidents of the Swing): it was this print that made the image famous well beyond the patron's circle."""
salle = 2
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "The Ray"
artiste = "Jean Siméon Chardin"
annee = "c. 1725–1726"
image = "raie.jpg"
technique = "Oil on canvas, 114.5 × 146 cm"
collection = "Musée du Louvre, Paris"
note = "A gutted ray, a watchful cat, oysters: the still life that brought Chardin into the Académie royale in 1728."
description = """
On a stone table, in a dark kitchen, a ray hangs from a hook at the \
centre, its white face turned toward us and its belly laid open, red and pearly. Its \
mouth and nostrils form a strange, almost human face. On the left, a cat \
with bristling fur rests its paws on a heap of open oysters, drawn by the \
food, near a bunch of spring onions. Beneath the ray, two fish. On the right, a \
crumpled white cloth, a copper saucepan, a bottle, a jug of dark green glazed \
stoneware, a skimmer and a knife whose handle juts out over the edge of the table. The background \
is a brown stone wall, without window or decoration, where the light catches in \
places."""
evocation = """
The painting plays on a striking contrast between the beauty of the painting and the \
rawness of the subject. The eviscerated ray, which seems to stare at us with a grimace, has something \
disquieting about it; it has been seen as a meditation on flesh and death, in the \
tradition of Flemish kitchen still lifes, but also as a realism of a new \
frankness. The cat, alive and nervous, introduces a slight tension: it \
eyes the oysters and may be about to knock everything over. For a young painter from the Parisian \
artisan class, the canvas is also a demonstration: it proves that a humble subject, placed at the very bottom of the hierarchy of genres, can rival great \
painting."""
histoire = """
In 1728, Chardin, still unknown, exhibited several paintings at the Exposition de la \
Jeunesse, an open-air exhibition held in the place Dauphine, in Paris, on the day of \
Corpus Christi. Academicians noticed them. On 25 September 1728, Chardin presented The \
Ray and The Buffet to the Académie royale de peinture et de sculpture, which approved him and \
received him the same day as a \"painter with a talent for animals and fruit\", a \
very rare favour. The two canvases became his reception pieces. They remained \
hung in the rooms of the Academy, then housed in the Louvre, where \
generations of students could study them, and joined the museum at the Revolution."""
facture = """
Chardin builds his forms in thick layers, laid down and reworked, without \
smoothing the surface: the matter remains visible, granular, almost modelled in the \
flesh of the ray. He borrows the kitchen subject from the Flemish and the Dutch, but \
he refines it: few objects, chosen and arranged in a pyramid around the ray. The \
colours are muted, browns, greys, ochres, enlivened by the reds of the fish and the \
dazzling white of the cloth. The light unifies the whole and makes the textures vibrate: \
the cat's coat, copper, stoneware, the moist oyster."""
details = [
  "The ray's \"face\", formed by its mouth and nostrils.",
  "The bristling cat, on the left, resting a paw on the oysters.",
  "The knife whose handle juts over the edge of the table, toward us.",
  "The reflections in the copper of the saucepan, behind the white cloth.",
  "The perforated skimmer, at far right, half cut off by the edge of the painting.",
]
themes = ["still life", "kitchen", "animals", "realism", "cat"]
anecdote = """
More than a century and a half after Chardin, the young Henri Matisse, then a student in Paris, \
copied The Ray at the Louvre. This copy is now kept at the Musée Matisse in \
Le Cateau-Cambrésis, his native town."""
salle = 3
mur = "nord"
place = 2
largeur = 1.46

[[oeuvres]]
titre = "The Stonemason's Yard"
artiste = "Giovanni Antonio Canal, dit Canaletto"
annee = "c. 1725"
image = "cour-tailleurs-pierre.jpg"
technique = "Oil on canvas, 123.8 × 162.9 cm"
collection = "National Gallery, London"
note = "Neither palace nor festival: a building site in an ordinary Venetian neighbourhood, painted with an almost photographic truthfulness."
description = """
In the foreground stretches the campo San Vidal, a Venetian square turned into a \
building site: blocks of white stone, rough or already cut, litter the ground around \
a timber shed where stonemasons are working. Beyond flows the Grand \
Canal, crossed by gondolas, and on the far bank rise the church of Santa Maria \
della Carità and its tall, pointed bell tower. To right and left, tall houses of \
red brick, with open shutters, laundry at the windows and flowerpots on the \
balconies. The life of the neighbourhood can be sensed everywhere: a woman leaning from a balcony, another \
at her window, and at lower left a mother running to a small child who has fallen \
to the ground."""
evocation = """
Canaletto paints here a Venice without pomp, far from ceremonies and from Piazza \
San Marco. It has been seen as one of his most personal works: the eye lingers \
on daily labour, the disorder of a building site and the familiar life of a neighbourhood, \
with a tenderness reminiscent of Dutch genre painting. The building site itself \
tells of a city in perpetual reconstruction: the stones are probably \
intended for the nearby church of San Vidal, whose façade was then being rebuilt. The \
contrast between the cold light of the sky and the warmth of the bricks, between the bustle \
of the foreground and the calm of the far bank, gives the scene a discreet poetry, \
without forced picturesqueness."""
histoire = """
The painting dates from Canaletto's early years, before English Grand Tour travellers \
asked of him chiefly the city's famous monuments; it is not known for whom it \
was painted. The viewpoint is taken from the campo San Vidal, where the Accademia bridge \
did not yet exist. On the far bank, the bell tower of the Carità collapsed \
in 1744, and the buildings of the former confraternity have housed the Gallerie dell'Accademia since the early \
nineteenth century. The canvas belonged to the English collector Sir George Beaumont, an amateur painter and patron of young artists, who \
gave his collection to the nation to help found the National Gallery \
in London; the painting entered it in 1828."""
facture = """
Canaletto, the son of a theatre set painter, had a perfect command of \
perspective. He prepared his views with drawings made on the spot, perhaps with the aid \
of a camera obscura, then recomposed them in the studio. The touch is precise but \
lively: the blocks of stone are modelled by the light, the wood of the shed is rendered \
plank by plank, the small figures are set down with a brisk brush. The sky occupies \
nearly half the canvas, laden with grey clouds pierced by a raking light. \
The cast shadows, sharp and long, cross the square diagonally."""
details = [
  "At lower left, a mother running to her child who has fallen to the ground.",
  "The tall pointed bell tower of the Carità, which would collapse in 1744.",
  "The stonemasons at work in the timber shed, on the right.",
  "The white laundry drying at the windows of the house on the right.",
  "The gondolas moored along the Grand Canal, at the centre.",
]
themes = ["Venice", "city", "work", "daily life", "veduta"]
anecdote = """
The Accademia bridge, built in 1854, now links the campo San Vidal to the \
far bank, roughly where Canaletto painted the gondolas: the square, \
cleared of its building site, has become one of the busiest thoroughfares in \
Venice."""
salle = 3
mur = "est"
place = 2
largeur = 1.63

[[oeuvres]]
titre = "Mr and Mrs Andrews"
artiste = "Thomas Gainsborough"
annee = "c. 1750"
image = "mr-mrs-andrews.jpg"
technique = "Oil on canvas, 69.8 × 119.4 cm"
collection = "National Gallery, London"
note = "A young couple, landowners from Suffolk, pose before their fields: portrait and landscape united in a single canvas."
description = """
Beneath a great oak, on the left, a young couple pose in the open air. Robert Andrews, \
standing, in a tricorn hat and light coat, a gun under his arm, leans nonchalantly on the \
back of a wrought-iron bench with green scrolls; his hunting dog raises its head \
toward him. On the bench, his wife Frances, in a pale blue silk dress and straw \
hat, sits very upright, her hands in her lap. On the right, a whole half of \
the canvas is occupied by their lands: a field of reaped wheat with golden sheaves, \
meadows where sheep graze, hedges, copses, and in the distance, between the \
trees, a church tower. The summer sky fills with heavy grey and white clouds."""
evocation = """
The painting celebrates a marriage and a property. The Andrewses are shown not in a \
drawing room, but amid the fields that make their fortune: the reaped wheat, the \
sheep, the hedges of a well-kept estate. It has been seen as an image of the English landed gentry \
and of the agricultural revolution, with its wheat sown in regular rows. In Ways of Seeing \
(1972), the critic John Berger made it the very example of \
painting as an assertion of property, a reading that other historians have \
qualified. The gun and the dog also recall the right to hunt, reserved for \
landowners. Gainsborough, who preferred landscape to portraiture, finds here a way \
of uniting the two genres."""
histoire = """
Robert Andrews and Frances Carter married in November 1748 at Sudbury, Gainsborough's \
native town, in Suffolk. The portrait was painted shortly afterwards, around 1750, \
when the young painter, back from London, was seeking clients among the families of \
the region. The estate depicted is Auberies, near Sudbury, the property of \
Robert Andrews. The painting then remained in the family for two centuries, almost \
unknown to the public. Revealed at an exhibition devoted to Gainsborough in Ipswich in \
1927, it was sold by the descendants in 1960 and acquired by the National Gallery in \
London, where it has become one of the most familiar images of English \
painting."""
facture = """
Gainsborough combines two traditions. The figures, small and somewhat stiff, belong to \
the \"conversation piece\", the small-format full-length group portrait, fashionable \
in England at the time, which the painter had come to know in London through the French \
engraver Hubert Gravelot. The landscape is observed with a care derived from \
the Dutch, such as Jacob van Ruisdael, whom Gainsborough had copied. The colours are \
fresh: the blue of the dress answers the blue-grey of the sky, the gold of the sheaves the green of \
the meadows. The touch is fine and meticulous in the faces and fabrics, freer \
in the clouds."""
details = [
  "On Frances's lap, an area left unfinished, a simple brown sketch.",
  "The wrought-iron bench, its Rococo scrolls painted in green.",
  "The golden sheaves of wheat, in the right foreground.",
  "The hunting dog looking up at its master.",
  "The tiny sheep grazing in the meadow, in the background.",
]
themes = ["portrait", "landscape", "countryside", "marriage", "property"]
anecdote = """
No one knows what Gainsborough meant to paint on Frances Andrews's lap, \
left in the state of a sketch: a book, a fan, a bird shot by her husband, or even a child \
to come have all been proposed."""
salle = 3
mur = "sud"
place = 1
largeur = 1.2

[[oeuvres]]
titre = "Madame Vigée Le Brun and Her Daughter Julie"
artiste = "Élisabeth Vigée Le Brun"
annee = "1789"
image = "vigee-le-brun-fille.jpg"
technique = "Oil on panel, 130 × 94 cm"
collection = "Musée du Louvre, Paris"
note = "Painted a few months before the Revolution: the embrace of a mother and her daughter, dressed \"à la grecque\"."
description = """
Against a plain grey-brown background, a seated young woman holds in her arms a little girl \
who nestles against her, cheek to cheek. The mother, the artist herself, \
wears a simple white dress in the antique style that leaves one shoulder bare, a red and gold shawl \
knotted at the waist and a red band in her curly brown hair. Across her lap \
spreads an olive-green drapery. Her daughter Julie, in a blue dress, puts an arm \
around her mother's neck. The two faces touch and look at the viewer: \
the mother's calm and smiling, the child's more mischievous. No \
accessory, no setting: everything is concentrated on the embrace."""
evocation = """
The painting celebrates maternal tenderness, a value held in honour in the late eighteenth \
century, notably under the influence of Rousseau, who urged mothers to raise \
their children themselves. Vigée Le Brun portrays herself not as a painter, without \
brushes or palette, but as a mother, a bold choice for an artist who had constantly \
to defend her professional status. It has often been seen as an echo of Raphael's Madonnas \
and Child, which she admired: the embrace and the pyramidal composition \
recall the Madonna della Seggiola. The white dress and the headband follow the \"à la \
grecque\" fashion that the painter helped to launch, in keeping with the nascent \
Neoclassical taste."""
histoire = """
Vigée Le Brun painted this second double portrait with her daughter in 1789, three years after \
a first version, also in the Louvre, which had caused a sensation at the Salon of 1787. \
She was then at the height of her career: official portraitist of Marie-Antoinette, \
a member of the Académie royale since 1783. But her closeness to the queen made her \
suspect. In early October 1789, as the royal family was forcibly brought back \
from Versailles to Paris, she left the capital with Julie, in disguise, in \
a stagecoach for Italy. A twelve-year exile began, from Rome to \
Saint Petersburg. The painting, which remained in France, now belongs to the Louvre, which \
holds both versions."""
facture = """
The painter builds a pyramidal composition, closed in on itself by the \
interlaced arms. The neutral background, without depth, sets off the pale flesh tones, \
softly modelled, without hard contours. The colours are few and \
frank: the white of the dress, the red of the headband and shawl, the blue of \
Julie's dress, the olive green of the drapery. The smooth wooden panel allows a very \
careful finish. The simplicity of the clothing, inspired by the antique, breaks with the silks and \
powders of the Rococo and heralds the Neoclassical aesthetic."""
details = [
  "The red band knotted in the mother's brown curls.",
  "The red and gold fringed shawl, falling over the green drapery.",
  "The two cheeks touching, and the two gazes turned toward us.",
  "The mother's bare shoulder, as on an ancient statue.",
  "The fine vertical lines of the background: the joins between the planks of the panel.",
]
themes = ["portrait", "motherhood", "self-portrait", "tenderness", "antiquity"]
anecdote = """
In 1787, the first version of this double portrait set tongues wagging over one detail: the \
painter smiles in it, showing her teeth, which a Salon chronicler judged an \
affectation contrary to all the rules of painting and good manners."""
salle = 3
