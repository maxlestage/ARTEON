[[oeuvres]]
titre = "Folio from the Blue Qur'an"
artiste = "Ifriqiya"
annee = "second half of the 9th – mid-10th century"
image = "coran-bleu.jpg"
cadre = "estampe"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Folio_from_the_%22Blue_Qur%27an%22_MET_DP167100.jpg"
technique = "Gold and silver on indigo-dyed parchment, 30.4 × 40.2 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Gold on midnight-blue parchment: a page from one of the most famous manuscripts of Islamic art."
description = """
The page is wider than it is tall. On the deep blue parchment, fifteen lines of gold writing are aligned with perfect regularity. The letters, angular and stretched horizontally, belong to Kufic, the oldest of the great scripts of the Qur'an. They are spaced so as to fill each line exactly, even if it means breaking a word from one line to the next. There is neither title nor image. On the right, in the margin, a round silver medallion, now blackened by oxidation, marked a division of the text. The edge of the folio, worn and irregular, bears the traces of the centuries and of successive mountings."""
evocation = """
The page reproduces a passage from Sura 30, ar-Rum, the Romans. But it is looked at as much as it is read: Kufic without dots or vowels addressed readers who already knew the text by heart, and the beauty of the script celebrated the divine word. Gold on a blue ground evokes a night sky or precious stones. This luxury has often been compared to the Byzantine imperial manuscripts, written in gold and silver on purple parchment: the Blue Qur'an would have been a dazzling response, in the Islamic world, to these books of prestige."""
histoire = """
The manuscript, whose folios are now dispersed, is neither signed nor dated. Its origin remains debated: it has been attributed to Baghdad, to Umayyad Spain or to Iran, but most specialists now think of North Africa, and more precisely of Kairouan, in Tunisia. The majority of the known folios are kept in Tunisia, and an old inventory of the library of the Great Mosque of Kairouan seems to describe a Qur'an written in gold on blue parchment. The other pages were scattered in museums and collections around the world."""
facture = """
The parchment, made of animal skin, was dyed with indigo, a rare technique. The letters are drawn in gold, and the signs that separated the verses were laid in silver; this metal has blackened with time, like the medallion in the margin. The calligrapher draws the letters with a qalam, a cut reed, respecting precise proportions: short vertical strokes, elongated horizontal ligatures. The width of the page, greater than its height, is typical of Kufic Qur'ans of this period."""
details = [
  "The large blackened silver medallion, in the right margin.",
  "The very elongated horizontal ligatures between certain letters.",
  "The small round gilded sign that separates two verses, towards the bottom left.",
  "The irregular edges of the parchment and the traces of old mountings.",
]
themes = ["qur'an", "calligraphy", "gold", "manuscript", "kairouan"]
anecdote = """
The Blue Qur'an is one of the rare Qur'anic manuscripts on dyed parchment. Its folios very rarely come onto the market: the Metropolitan Museum of New York was able to acquire its own only in 2004."""
salle = 5
mur = "nord"
position = -2.2
largeur = 1.2

[[oeuvres]]
titre = "Pyxis of al-Mughira"
artiste = "Califat de Cordoue"
annee = "968 (357 AH)"
image = "pyxide-al-mughira.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Pyxide_d'al-Mughira_-_Musée_du_Louvre_Arts_de_l'Islam_OA_4068.jpg"
technique = "Carved elephant ivory, height approximately 15 cm"
collection = "Musée du Louvre, Paris"
note = "An ivory box about fifteen centimetres high, shown enlarged, carved for a son of the caliph of Cordoba."
description = """
The box is a cylinder closed by a domed lid. Its whole surface is carved in deep relief. On the body, four large eight-lobed medallions, bordered with pearls, each enclose a scene. The one seen here shows two horsemen, on either side of a palm tree, picking dates; eagles perch in the palm fronds. The other medallions depict a court scene, with a lute player, lions attacking bulls and young men taking eggs from a nest. Between the medallions teem animals, birds and foliage. On the rim of the lid, an inscription in Kufic letters runs around the box."""
evocation = """
The inscription calls down the blessing of God, joy and happiness upon al-Mughira, son of the commander of the faithful, and gives the date 357 AH. Al-Mughira was the youngest son of the caliph Abd al-Rahman III. Historians have proposed reading the images as a political message: the palm tree, emblem of the Umayyads who came from Syria, the court scene, the beasts of prey overpowering their victims. It has been seen as a reminder of the young prince's rights to the succession, or on the contrary as a warning. These readings remain debated; the box, made to hold perfumes or jewels, is in any case a gift of the very highest rank."""
histoire = """
The pyxis was carved in 968, probably in the workshops of Madinat al-Zahra, the palace-city founded near Cordoba by Abd al-Rahman III. Its recipient met a tragic end: at the death of his half-brother, the caliph al-Hakam II, in 976, al-Mughira was put to death by the supporters of the young Hisham II, who feared he would claim the throne. This fate gives a particular poignancy to the wishes of happiness engraved on the lid. The box now belongs to the Department of Islamic Art of the Louvre, which holds one of the finest groups of Andalusian ivories."""
facture = """
The box is cut from a section of elephant tusk, an ivory that came from Africa along the trade routes. The sculptor hollows out the cylinder, then frees the figures in relief so deep that some parts are almost detached from the ground. The beaded medallions, the foliage and the animals interlock without leaving any void. The relief has lost the colours or inlays that perhaps once enlivened it. The workshops of the caliphate of Cordoba produced, in a few decades, a group of pyxides and carved caskets for the family and entourage of the caliphs."""
details = [
  "The two horsemen picking dates on either side of the palm tree.",
  "The eagles perched in the palm fronds, above the horsemen.",
  "The Kufic inscription around the lid, which names al-Mughira.",
  "The beasts and animals carved on the dome of the lid.",
]
themes = ["ivory", "al-andalus", "court", "palm tree", "umayyads"]
anecdote = """
The palm tree recalls Abd al-Rahman I, the founder of the Umayyad dynasty of Spain, who came from Syria: according to tradition, he composed a poem to a palm tree in his garden at Cordoba, exiled like him far from its native land."""
salle = 5
mur = "nord"
position = 2.2
