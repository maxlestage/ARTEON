licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Dish_Depicting_Two_Birds_among_Flowering_Plants_MET_DP131621.jpg"
technique = "Fritware painted under a transparent glaze, diameter 28.4 cm"
collection = "Metropolitan Museum of Art, New York"
note = "An Iznik dish 28 cm in diameter, shown enlarged: two birds in a bouquet of carnations, tulips and hyacinths."
description = """
On the white ground of the dish, a bouquet springs from a tuft of long green leaves. One recognises a large red flower in full bloom, a red carnation, blue hyacinths and a blue tulip, and a branch of plum blossom. Two blue and green birds, with long tails, have alighted among the stems: one, at the top, leans towards a flower, the other, below, stands on a large serrated leaf. The marli, the rim of the dish, is covered with a scattering of white spirals on a blue ground, interrupted by white reserves ornamented with small red flowers. The scalloped edge is outlined with a brown line."""
evocation = """
The flowers of Iznik are those of Ottoman gardens: the tulip, the carnation, the hyacinth and the rose, which the court loved to cultivate and which are found on tiles, textiles and bookbindings. The decoration is not a bouquet copied from nature, but an ideal garden, where stems bend without breaking and each flower keeps its pure colour. The birds, rare on these dishes, add movement and life. The border of spirals is a memory of the borders of waves and rocks on Chinese porcelains, much collected at the court of Istanbul."""
histoire = """
The city of Iznik, ancient Nicaea, in north-western Anatolia, produced from the end of the 15th century a fine ceramic, at first blue and white in imitation of Chinese porcelain. In the middle of the 16th century, its workshops worked for the court and for the great mosques of Istanbul, which were covered with thousands of tiles. This dish dates from the great period of Iznik, under the reign of Murad III, from 1574 to 1595. It was given to the Metropolitan Museum in 1959 by James J. Rorimer, then director of the museum, in homage to the curator Maurice S. Dimand."""
facture = """
The dish is made of fritware, covered with a very pure white slip that serves as a ground. The painter draws the outlines in black, then lays on the cobalt blue, the turquoise, the green and the red, before covering the whole with a transparent, shining glaze. The red, perfected around the middle of the 16th century, is made from an iron-rich earth; laid on thickly, it forms a slight relief to the touch. Mastering this red without its running or turning black in the firing was one of the great feats of the Iznik potters."""
details = [
  "The raised red of the carnation and the large flower, at the top of the bouquet.",
  "The upper bird leaning towards a flower.",
  "The white spirals on a blue ground of the marli.",
  "The blue tulip, at the foot of the bouquet.",
]
themes = ["ceramic", "flowers", "birds", "ottomans", "iznik"]
anecdote = """
In the 19th century, European collectors called these ceramics "Rhodes ware", because many had been bought on the island of Rhodes. They were only later restored to Iznik, when their true origin was recognised."""
salle = 4
mur = "sud"
