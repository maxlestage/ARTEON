[exposition]
ordre = 22
nom_court = "Arts of Islam"
mouvement = "Arts of Islam"
cadre = "vitrine"
couleur = "#1d5e6b"
titre = "The Arts of Islam, from Cordoba to Isfahan"
artiste = "Cordoba, Kairouan, Cairo, Kashan, Isfahan, Iznik…"
dates = "9th–16th century"
accroche = "Virtual exhibition · Museum of Islamic Art, Doha"
introduction = """
From the shores of the Atlantic to Iran, the lands of Islam made writing, geometry and plant ornament a common language, rendered on parchment, wool, glass, metal, ivory and ceramic. The visit brings together ten objects, from the blue Qur'an of Kairouan to the carpets of the Safavid, Mamluk and Ottoman courts, from the mosque lamp of Cairo to the dish of Iznik. The building draws its inspiration from the Museum of Islamic Art in Doha, designed by I. M. Pei: a vestibule, then a lofty atrium where the great carpets are displayed, around which three galleries open."""
vitrine = "tapis-ardabil.jpg"

[musee]
nom = "Museum of Islamic Art"
ville = "Doha, Qatar"
architecte = "Ieoh Ming Pei"
construction = "inaugurated in 2008"
presentation = """
To build in Doha a museum devoted to the arts of Islam, the emirate of Qatar turned to the Chinese-American architect I. M. Pei, the designer of the Louvre pyramid. He travelled to study Islamic architecture and found his model in Cairo, in the ablution fountain of the Mosque of Ibn Tulun, a stripped-down geometric structure dating from the 13th century. The museum, inaugurated at the end of 2008, stands on an island reclaimed from the sea, at the end of the Corniche: a stack of cubic volumes of pale limestone, which narrow in steps up to a central tower. Inside, a multi-storey atrium rises to a dome pierced by an oculus, where the square turns into an octagon and then a circle; an immense glass wall opens onto the sea and the city. The galleries, designed by Jean-Michel Wilmotte, are plunged in half-light: each object glows in its case. The collections cover Islamic art from Spain to Central Asia and India."""
ici = """
The ARTEON building takes up the layout of the Doha museum: a vestibule, then a very tall atrium from which the galleries lead off. You enter from the south into "The Corniche Vestibule", with its walls of pale stone. To the north opens "The Atrium · The Great Carpets", sixteen metres high, where the Ardabil carpet and an Ottoman carpet are stretched. Three galleries six metres high surround it: to the west "Cairo of the Mamluks", to the east "From Kashan to Iznik · Earth and Fire", and to the north, on the axis, "Kairouan and Cordoba · Writing and Ivory"."""

