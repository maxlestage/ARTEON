[[artistes]]
nom = "Iran safavide"
vie = "Iran, 1501–1736"
biographie = """
The Safavid dynasty takes its name from the sheikh Safi al-Din, a Sufi master who died in 1334, whose brotherhood, based at Ardabil in north-western Iran, gained military power over the generations. In 1501, his descendant Ismail, barely fourteen years old, had himself proclaimed shah at Tabriz and imposed Twelver Shiism as the state religion, which durably marked Iran. His son Tahmasp, who reigned from 1524 to 1576, protected the arts: his royal workshop brought together calligraphers, painters, bookbinders and designers, who also supplied models to the weavers of carpets and silks. The capital moved from Tabriz to Qazvin, then, under Abbas I, to Isfahan, which the shah transformed from 1598 around an immense square lined with mosques and palaces. Safavid carpets, with medallions, gardens or animals, woven of wool and sometimes of silk, gold and silver thread, were given to foreign sovereigns and exported as far as Europe. The dynasty weakened in the 17th century; in 1722, Afghan troops took Isfahan, and the last Safavid ruler was set aside in 1736."""
style = """
Safavid art loves ample, ordered compositions: a central medallion, spandrels, a field covered with flowering scrolls, cloud bands and palmettes that coil with suppleness. The same designs pass from manuscript to carpet, from binding to ceramic, thanks to the models of the royal workshop. Court carpets, of extreme fineness, fixed for centuries the image of the "Persian carpet"."""

[[artistes]]
nom = "Sultanat mamelouk"
vie = "Egypt and Syria, 1250–1517"
biographie = """
The Mamluks were originally slave soldiers, bought as children in the steppes of Central Asia or the Caucasus, converted and trained in the profession of arms. In 1250, those of the Ayyubid dynasty seized power in Egypt. Ten years later, in 1260, they stopped the Mongols at Ayn Jalut, in Palestine, then drove out the last Crusader states with the capture of Acre in 1291. Their sultanate stretched from Egypt to Syria and protected the holy cities of Mecca and Medina. Power was not always handed from father to son there: the emirs, military leaders, disputed the throne. Cairo became one of the greatest cities in the world, and the sultans and emirs covered it with mosques, madrasas, mausolea and hospitals, often gathered in complexes. The reign of al-Nasir Muhammad, in the first half of the 14th century, marked a peak. Each emir bore an emblem recalling his office at court: the cup of the cupbearer, the sword of the sword-bearer. In 1516 and 1517, the Ottoman armies of Selim I conquered Syria and then Egypt, and put an end to the sultanate."""
style = """
Mamluk art is an art of commission, in the service of a military elite that asserted its rank through pious foundations. It excels in precious objects: enamelled and gilded glass, metal inlaid with silver and gold, large-format Qur'ans, then carpets. The large inscriptions, with tall, slender letters, gradually become the principal decoration, alongside emblems and a rigorous geometry."""

[[artistes]]
nom = "Empire ottoman"
vie = "Anatolia, the Balkans and the Near East, c. 1300–1922"
biographie = """
The Ottoman Empire was born around 1300 from a small Turkish principality in north-western Anatolia, led by Osman, who gave it his name. His successors expanded in Anatolia and the Balkans. In 1453, Mehmed II took Constantinople, which became, under the name of Istanbul, the capital of the empire. In the 16th century, Selim I conquered Syria and Egypt in 1516–1517, and his son Suleiman the Magnificent, who reigned from 1520 to 1566, brought the empire to its peak, from Hungary to Iraq and North Africa. The court organised artistic creation: the imperial design workshop, the nakkaşhane, supplied the models for manuscripts, textiles, carpets and ceramics, and the architect Sinan built in Istanbul and Edirne mosques covered with Iznik tiles. The carpet workshops of Anatolia, such as those of Ushak, exported their products to Europe, where painters depicted them in their pictures. The empire, weakened from the 18th century, disappeared after the First World War, in 1922."""
style = """
The style of the Ottoman court, fixed in the middle of the 16th century, is an art of the flower: tulips, carnations, hyacinths, roses and plum blossoms, mixed with long serrated sabre-shaped leaves. The colours are vivid, with blue, turquoise, green and a dazzling red. The same repertoire passes from the drawing of the imperial workshop to tiles, dishes, silks and carpets."""

[[artistes]]
nom = "Céramistes de Kashan et d'Ispahan"
vie = "Iran, 12th–14th century"
biographie = """
From the 12th century, Kashan, a city in central Iran at the foot of the mountains, became the great centre of luxury ceramics in the Iranian world. Its potters devised or perfected fritware, white and fine, and applied to it every technique: underglaze painted decoration, metallic lustre with golden glints, overglaze enamels. Certain families of potters are known from their signatures on tiles and vases, such as that of Abu Tahir, one of whose members, Abu'l-Qasim, wrote in 1301 a treatise on the making of ceramics. The Kashan workshops supplied lustred facings for shrines throughout Iran, mihrabs and friezes of star and cross tiles. The Mongol invasions, from 1219, ravaged the country, but production resumed under the Mongol dynasty of the Ilkhanids, who commissioned great ceramic decorations. In the 14th century, at Isfahan, Yazd or Kerman, ceramic mosaic developed, made of cut pieces, which would later cover the façades of Timurid and Safavid mosques."""
style = """
The Iranian ceramists of this period sought the brilliance of Chinese porcelain and surpassed it in colour: turquoise, cobalt blue, golden lustre. Their decorations combine Persian poetry, court figures, fantastic creatures and Qur'anic calligraphy. The ceramic mosaic of the 14th century brought the art of facing to a new geometric precision."""

[[artistes]]
nom = "Ifriqiya"
vie = "present-day Tunisia and eastern Algeria, 9th–10th century"
biographie = """
Ifriqiya is the Arabic name of the province that corresponds roughly to present-day Tunisia. Conquered at the end of the 7th century, it had Kairouan, founded in 670, as its capital. In 800, the Abbasid caliph of Baghdad entrusted its government to Ibrahim ibn al-Aghlab, whose descendants, the Aghlabids, ruled for a century while recognising the caliph's authority. They rebuilt the Great Mosque of Kairouan, whose mihrab is adorned with lustred tiles from Iraq, and conquered Sicily. The city was then a great centre of religious studies, and the library of the Great Mosque has preserved to this day Qur'ans and books on parchment. In 909, the Fatimids, a Shiite dynasty claiming descent from Fatima, the daughter of the Prophet, overthrew the Aghlabids and founded the city of Mahdia, on the coast. In 969, they conquered Egypt and founded Cairo, where they settled a few years later, leaving Ifriqiya to their governors."""
style = """
The Qur'ans of Ifriqiya of this period are copied on parchment, in a format wider than tall, in Kufic script: angular letters, with elongated ligatures, few lines per page, often without dots or vowels. Gold, silver and colours serve to mark the verses and the suras. The Blue Qur'an pushes this luxury to the extreme, with its gold letters on a dyed ground."""

[[artistes]]
nom = "Califat de Cordoue"
vie = "Al-Andalus (Iberian Peninsula), 929–1031"
biographie = """
In 756, Abd al-Rahman, an Umayyad prince who had escaped the massacre of his family in Damascus, founded in Cordoba an emirate independent of Baghdad. In 929, his descendant Abd al-Rahman III proclaimed himself caliph, commander of the faithful, in the face of the Abbasid caliphs of Baghdad and the Fatimids of North Africa. He had a palace-city, Madinat al-Zahra, built near Cordoba, where the best craftsmen of the country worked. His son al-Hakam II, who reigned from 961 to 976, a learned prince who assembled an immense library, enlarged the Great Mosque of Cordoba and had gold mosaics laid there by a craftsman sent from Byzantium. After his death, power passed to the vizier al-Mansur, the Almanzor of the Christian chronicles, who governed in the name of the young caliph Hisham II. At the beginning of the 11th century, a civil war broke out, Madinat al-Zahra was sacked, and the caliphate was abolished in 1031; al-Andalus divided into small kingdoms. Many ivories of the caliphate later joined the treasuries of Christian churches."""
style = """
The workshops of the caliphate of Cordoba carved in ivory round boxes, the pyxides, and rectangular caskets, covered with scrolls, animals and court scenes, often with an inscription in the name of their recipient. The decoration, dense and symmetrical, blends inheritances from the Umayyad East, Byzantium and Antiquity."""
