[[oeuvres]]
titre = "The Ardabil Carpet"
artiste = "Iran safavide"
annee = "1539–1540"
image = "tapis-ardabil.jpg"
cadre = "aucun"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Ardabil_Carpet_-_Google_Art_Project.jpg"
technique = "Wool pile knotted on a silk warp and weft, 1044 × 535.5 cm"
collection = "Victoria and Albert Museum, London"
note = "One of the oldest dated carpets: a golden sun on a midnight-blue field, signed and dated in the year 946 of the Hijra."
description = """
More than ten metres long, the carpet unfolds a midnight-blue field covered with a fine network of spiralling stems, strewn with flowers and palmettes. At the centre, a great yellow star-shaped medallion, with a pale blue heart, radiates like a sun; it is surrounded by a crown of oval medallions, cream, red and green. On either side, along the axis of the carpet, hangs a mosque lamp suspended from chains: one is larger than the other. In the four corners, a quarter of the central medallion is repeated in yellow. A wide border, in which elongated cartouches alternate with lobed medallions, frames the whole. At one end, a small pale cartouche bears three lines of Persian writing: a couplet of poetry, a signature and a date."""
evocation = """
The inscription gives the key to the carpet. Its first two lines quote the poet Hafez: "I have no refuge in the world other than your threshold; my head has no shelter other than this door." The third signs: "The work of the slave of the threshold, Maqsud of Kashan, 946". The threshold here is that of a shrine, and Maqsud calls himself a humble servant, not a slave in the literal sense. The medallion has often been read as a dome seen from below, from which the lamps hang, and the flowered field as a garden of paradise. The difference in size between the two lamps remains debated: an effect of perspective, according to some; according to others, a deliberate imperfection, since perfection belongs to God alone."""
histoire = """
The carpet is thought to have been commissioned by the court of Shah Tahmasp for the shrine of Ardabil, in north-western Iran, where the Sufi sheikh Safi al-Din, who died in 1334 and was the ancestor of the Safavid dynasty, lies buried. British travellers still saw it there in 1843. After an earthquake that damaged the shrine, it was sold, with a twin carpet, to a Manchester firm which put it up for sale in 1892. William Morris, consulted by the museum, judged it of "singular perfection": the South Kensington Museum, the future Victoria and Albert Museum, bought it in March 1893 for 2,000 pounds. Its twin, smaller and deprived of its border, which was used to repair it, is today in the Los Angeles County Museum of Art."""
facture = """
The pile is made of wool knotted, strand by strand, on a framework of silk threads, at a rate of about 5,300 knots for a square of ten centimetres on a side. The field uses around ten colours drawn from natural dyes, such as indigo or pomegranate rind. Such a design presupposes a model prepared by the artists of the court, then years of work: up to ten weavers could work at once on the loom. The composition is symmetrical in both directions, around the medallion, but the network of scrolls in the background repeats endlessly, as if it continued beneath the border."""
details = [
  "The cartouche at one end, with the verses of Hafez, the signature and the date.",
  "The two lamps hanging on the axis, of different sizes.",
  "The small pale blue heart at the centre of the great yellow medallion.",
  "The yellow quarter-medallions that occupy the four corners of the field.",
  "The worn areas near the edges, where the pile has disappeared.",
]
themes = ["carpet", "safavids", "poetry", "shrine", "light"]
anecdote = """
At the Victoria and Albert Museum, the carpet lies flat, as on the floor of a shrine, in a large case installed in 2006 in the centre of the Jameel Gallery. To preserve its colours, it is lit for only ten minutes, on every hour and half-hour."""
salle = 2
mur = "nord"
position = -5.8
largeur = 4.5

[[oeuvres]]
titre = "Triple-Arch Carpet"
artiste = "Empire ottoman"
annee = "c. 1575–1590"
image = "tapis-ottoman-arcades.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Carpet_with_Triple-arch_Design_MET_DP166876.jpg"
technique = "Silk warp and weft, wool and cotton pile, asymmetrical knot, 172.7 × 127 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A prayer carpet of the Ottoman court: three arches on columns, a mosque lamp and flowers at the foot of the columns."
description = """
At the centre of the carpet, three pointed arches rest on paired, slender, twisted columns, set on stepped bases. The middle arch, wider, reveals a dark blue ground; the two side arches, a red ground. From the top of the central arch hangs a mosque lamp, on three small chains. At the foot of the columns grow bunches of flowers, tulips and carnations. Above the arches, a frieze runs from one edge to the other, in which a row of small domed buildings can be made out. A wide light-blue border encloses the scene: long serrated leaves coil around large blossoms in full bloom, red and brown."""
evocation = """
The prayer carpet bears the image of that towards which the worshipper turns: the arch represents the mihrab, the niche that indicates the direction of Mecca, and the lamp recalls the Qur'anic verse that compares the light of God to a lamp placed in a niche. Here, the single niche becomes an arcade of three arches, like the interior of a mosque; it has been seen as the evocation of a sanctuary, even of Mecca or Jerusalem, though no reading imposes itself. The flowers at the foot of the columns, tulips and carnations, are those of Ottoman gardens, and turn the space of prayer into a garden."""
histoire = """
This carpet belongs to a small group of arched prayer carpets woven for the Ottoman court in the second half of the 16th century. Its designs come from the imperial design workshop, the nakkaşhane, which supplied the models for ceramics, textiles and bookbindings. After the conquest of Egypt in 1517, the weavers of Cairo worked for the Ottomans, and orders from Sultan Murad III, in the 1580s, brought some of them to Istanbul: scholars hesitate between the two cities for these carpets, the Met leaning towards Istanbul. The carpet belonged to the American collector James F. Ballard, who gave it to the Metropolitan Museum in 1922 with a large part of his carpet collection."""
facture = """
The carpet combines three fibres: silk for the warp and weft, which gives a fine and solid base, wool for most of the pile, and cotton for the whites, which are more brilliant. The asymmetrical knot and the great density of the weave allow supple curves, far from the geometric designs of village carpets. The floral style of the court, with its serrated sabre-shaped leaves and its tulips, is the same as on the Iznik tiles of the same period. The red and blue grounds, worn, reveal the variations of the dye baths."""
details = [
  "The mosque lamp hanging beneath the central arch, on three small chains.",
  "The paired, twisted columns on their stepped bases.",
  "The tulips and carnations growing at the foot of the columns.",
  "The row of domed buildings in the frieze above the arches.",
]
themes = ["carpet", "prayer", "ottomans", "flowers", "architecture"]
anecdote = """
The lamps depicted on Ottoman prayer carpets are those, of glass or ceramic, that actually hung in mosques. The Cairo gallery presents one, made for the emir Qawsun two and a half centuries earlier."""
salle = 2
mur = "nord"
position = 5.0
largeur = 1.6

[[oeuvres]]
titre = "Mamluk Carpet"
artiste = "Sultanat mamelouk"
annee = "early 16th century"
image = "tapis-mamelouk.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Mamluk_Carpet_MET_DP168735.jpg"
technique = "Wool (warp, weft and pile), asymmetrical knot, 213.4 × 266.7 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Red, blue and green: a kaleidoscope of stars and octagons woven in Cairo, on the eve of the Ottoman conquest."
description = """
The carpet, wider than it is tall, is entirely geometric. At the centre, a large bluish-green octagonal medallion encloses a red rosette in which stars and knots interlace. Around it, a larger octagon is divided into compartments: eight-pointed stars, small octagons, green triangles with their points turned towards the centre. The whole is inscribed in a square, flanked on the left and right by two red bands strewn with small motifs. The border alternates long rounded cartouches, blue and green, with round red medallions. Not a single human or animal figure: only forms that fit together, as far as the eye can see. The frayed edges bear the trace of five centuries of use."""
evocation = """
This design without beginning or end can be viewed from every side, like a carpet laid on the floor. These compositions have been compared to the coloured marble pavements and painted ceilings that adorned the palaces and madrasas of the Mamluks: the carpet extended, in wool, the decoration of the architecture. Its geometry, made of stars born from one another, illustrates an idea dear to Islamic art: an order that repeats and could extend to infinity. The limited range of colours, cherry red, blue and green, was so characteristic that it formed a kind of trademark of the Cairo workshops."""
histoire = """
The so-called Mamluk carpets appeared in Cairo in the second half of the 15th century, and their production continued for some time after the Ottoman conquest of 1517. They were sought after as far as Europe, in Italy as in Spain, where they covered the floors and tables of palaces. After the conquest, the workshops gradually adopted the floral style favoured by Istanbul, as the arched carpet in the atrium shows. This example belonged to the collector James F. Ballard, who gave it to the Metropolitan Museum of New York in 1922, together with the Ottoman carpet shown in this exhibition."""
facture = """
Everything is wool: the warp, the weft and the pile, knotted with the asymmetrical knot. The wool of Mamluk carpets is renowned for its lustre, which makes the reds shimmer. The weavers content themselves with three principal colours, enhanced with touches of yellow and white, but play on their nuances: in the side bands and around the medallion, one sees passages from blue to green due to different dye baths. The design rests on a rigorous geometric layout, built from the octagon and the eight-pointed star."""
details = [
  "The interlaced rosette at the heart of the central medallion.",
  "The green triangles that point towards the centre, like arrows.",
  "The small stylised plants, in pairs, in the side bands.",
  "The shifts from blue to green, from one band to another.",
]
themes = ["carpet", "geometry", "mamluks", "cairo", "star"]
anecdote = """
On 11 June 1489, Pope Innocent VIII bought seven carpets, which the papal documents say were shipped from Cairo, "where they are made". A Mamluk carpet also appears in a painting made in Venice by Paris Bordone in 1534."""
salle = 3
mur = "ouest"
position = 0.0
largeur = 2.6

[[oeuvres]]
titre = "Mosque Lamp of Emir Qawsun"
artiste = "Sultanat mamelouk"
annee = "c. 1329–1335"
image = "lampe-qawsun.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Mosque_Lamp_of_Amir_Qawsun_MET_DP214293.jpg"
technique = "Blown glass, enamelled and gilded, height 35.9 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A glass lamp 36 cm high, shown enlarged, in the name of an emir who was the sultan's cupbearer: the cup, his emblem, appears on it six times."
description = """
The lamp has the form of a large vase: a neck flaring like a funnel, a round body and a tall, wide foot. On the body, glass handles allowed the suspension chains to be attached. The glass, transparent and slightly brown, is covered with enamels. On the neck, a band of blue writing unfolds around large round medallions: at the centre of each, on a yellow ground, stands out a dark red cup. On the body, immense blue letters, outlined in red, rise upwards between the handles; they name the emir who gave the lamp. Very fine scrolls, painted in red and heightened with gold, fill the spaces between the bands and cover the foot."""
evocation = """
A mosque lamp is a light that speaks. A small oil night-light, placed inside, made the glass glow; the enamel letters then stood out as shadow against the light. The neck bears a passage from Sura 24 of the Qur'an, the Sura of Light, in which the light of God is compared to a lamp placed in a niche, in a glass like a sparkling star. The object thus illustrates the text it carries. The inscription on the body and the cup, emblem of the office of cupbearer, also recall the generosity of the emir: to provide the lighting of a mosque was a pious work and a sign of prestige."""
histoire = """
Sayf al-Din Qawsun was one of the most powerful emirs of Sultan al-Nasir Muhammad, whose cupbearer he was. He founded in Cairo a mosque around 1329–1330 and a palace; the lamp, dated to those years, was probably intended for one of his foundations. After the sultan's death in 1341, Qawsun was for a time the strongman of the regime, before being arrested, then put to death in 1342. Hundreds of lamps of this type hung in the mosques, madrasas and mausolea of Cairo. Sought after by European collectors in the 19th century, many left Egypt: this one was given to the Metropolitan Museum in 1917 by the banker J. Pierpont Morgan."""
facture = """
The lamp is blown with the pipe, then the foot and the handles are added hot. The decoration is painted with enamels, that is, coloured glass ground and mixed with a binder, then the object is fired again at a temperature low enough to melt the enamel without deforming the lamp. The gold is applied in the same way. Blue, red, white, yellow and gold form a restricted palette, laid on with great precision: the red outlines of the letters and the scrolls, drawn with a brush, are as thick as a hair."""
details = [
  "The red cup on a yellow ground, emblem of the cupbearer, in the medallions of the neck.",
  "The large blue letters of the body, rising between the handles.",
  "The glass handles to which the chains were fixed.",
  "The very fine red and gold scrolls on the foot.",
]
themes = ["glass", "light", "calligraphy", "mamluks", "mosque"]
anecdote = """
The foot of the lamp bears the signature of Ali ibn Muhammad al-Barmaki: it is one of the only artisans' names known for all the enamelled and gilded glass of the Mamluk period, which is almost always anonymous."""
salle = 3
mur = "nord"
position = 0.0
largeur = 0.8

[[oeuvres]]
titre = "The Baptistery of Saint Louis"
artiste = "Sultanat mamelouk"
annee = "c. 1330–1340"
image = "baptistere-saint-louis.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Baptistère_de_Saint_Louis_-_Musée_du_Louvre_Arts_de_l'Islam_LP_16.jpg"
technique = "Copper alloy, hammered, chased and inlaid with silver, gold and black paste, 23.2 × 50 cm"
collection = "Musée du Louvre, Paris"
note = "A Mamluk basin signed six times by Muhammad ibn al-Zayn, which was used for the baptism of the children of France: 50 cm in diameter, shown enlarged."
description = """
The basin, wide and flaring, is entirely covered with a decoration of silver and gold on the dark brass. On the outer wall, a frieze of standing figures runs around the object: dignitaries and servants in long robes, carrying weapons, vases or animals. Four round medallions interrupt it, in which horsemen hunt. The inner wall repeats the same arrangement: two medallions show a prince on his throne, two others escutcheons. At the bottom, which can be glimpsed at the centre, fish and other aquatic animals swim. The faces, round, with elongated eyes, are engraved with the precision of a miniature."""
evocation = """
The decoration unrolls the pleasures and duties of a court: hunting, combat, service of the prince. It is not known for whom the basin was made, but these scenes are addressed to the military elites of the sultanate, those emirs of Turkish origin who saw themselves in their costumes and weapons. The drawing recalls the painting of manuscripts of the period: a battle scene compares with an illustration of the Shahnameh painted in Tabriz around 1330. The bottom, peopled with fish, makes the basin a small sea, an image that takes on a new meaning when the object becomes, in France, a basin for baptismal water."""
histoire = """
The basin is signed in six places: "the work of the master Muhammad ibn al-Zayn". It is not known how it came to France; it was long kept in the treasury of the Sainte-Chapelle of the Château de Vincennes. It was used for the baptism of the future Louis XIII in 1606, then for that of the comte de Chambord in 1821, for which two coats of arms of France were added in the inner medallions. In 1856, it was used again for the baptism of the Prince Imperial, son of Napoleon III. It now belongs to the Department of Islamic Art of the Louvre, of which it is one of the most famous objects."""
facture = """
The basin is hammered from a sheet of copper alloy. The decoration is then chased: the craftsman hollows out the metal, sets in it fine sheets of silver and gold which he hammers to fix them, then fills the background with black paste to make the figures stand out. The details of the faces and garments are engraved in the silver. This technique, which appeared in Khorasan, in north-eastern Iran, passed through Mosul before reaching Damascus and Cairo. The figures, which cover the whole object, became rarer in the course of the 14th century, gradually replaced by large inscriptions."""
details = [
  "The horsemen hunting in the medallions of the outer wall.",
  "The fleur-de-lis coats of arms added in 1821 in two inner medallions.",
  "The fish and aquatic animals engraved on the bottom.",
  "The round faces, with elongated eyes, engraved in the silver.",
]
themes = ["metal", "court", "hunting", "mamluks", "baptism"]
anecdote = """
Its name is an anachronism: Louis IX, Saint Louis, died in 1270, several decades before the basin was made. Yet this traditional name has stuck to it, and it is under this name that it is exhibited at the Louvre."""
salle = 3
mur = "sud"
position = 0.0
largeur = 1.2

[[oeuvres]]
titre = "Pierced Jug with Harpies and Sphinxes"
artiste = "Céramistes de Kashan et d'Ispahan"
annee = "1215–1216 (612 AH)"
image = "cruche-kashan.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Pierced_Jug_with_Harpies_and_Sphinxes_MET_DP170372.jpg"
technique = "Pierced fritware, painted under a transparent turquoise glaze, height 20.8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A jug 21 cm high, shown enlarged, with a double wall: the outer wall, pierced like lace, shelters harpies and sphinxes."
description = """
The jug has a round body, a straight neck and a handle. Its outer wall is pierced right through: between coiling stems, one makes out harpies, birds with human heads, sphinxes and spotted quadrupeds running. Behind this lace, a second, solid wall holds the liquid. The decoration is painted in black and cobalt blue, then covered with a transparent turquoise glaze that gives the whole object its sea colour. Beneath the rim of the neck and at the bottom of the body, two bands bear Persian inscriptions in black letters on a turquoise ground."""
evocation = """
The inscriptions are poems. Around the neck run verses by the Persian poet Rukn al-Din Qummi; near the base, an anonymous love poem, in which the lover laments having bound his soul to the curls of his beloved, contains the date of manufacture. The jug belongs to the refined world of banquets and poetry. Hybrid creatures, harpies and sphinxes, are frequent in the art of Iran at this period; they have been seen as good-luck figures or as images of a paradise peopled with marvellous beings, rather than the monsters of Greek mythology whose names they bear."""
histoire = """
Dated 612 AH, that is 1215–1216, the jug was made a few years before the Mongol invasions that ravaged Iran from 1219. It is attributed to Kashan, a city in central Iran that was then the great centre of luxury ceramics: painted, lustred or enamelled tableware, and tiles for shrines, were produced there. Several pierced jugs of this type are known, some of which bear a date, making them precious landmarks for historians. This one was bought in 1932 by the Metropolitan Museum of New York."""
facture = """
The jug is made of fritware, a mixture of ground quartz, glass frit and a little white clay, devised to imitate the whiteness and fineness of Chinese porcelain. The potter first builds the inner wall, then the outer wall, which he pierces with a knife when the paste is not yet quite dry. He then paints the decoration in black and blue, and covers the whole with a turquoise glaze. The work demands great skill: the pierced wall, very fragile, breaks at the slightest false movement."""
details = [
  "The two human faces of the harpies, at the middle of the body.",
  "The inner wall, paler, glimpsed through the openings.",
  "The spotted quadrupeds running around the neck.",
  "The bands of Persian poetry, beneath the rim and near the base.",
]
themes = ["ceramic", "poetry", "creatures", "iran", "turquoise"]
anecdote = """
Kashan gave its name to ceramics: in Persian, the word kashi denotes the enamelled facing tile. In 1301, Abu'l-Qasim, a member of a family of potters in the city, wrote a treatise describing the making of fritware."""
salle = 4
mur = "nord"
position = 0.0
largeur = 0.75

[[oeuvres]]
titre = "Mihrab from the Madrasa Imami, Isfahan"
artiste = "Céramistes de Kashan et d'Ispahan"
annee = "1354–1355 (755 AH)"
image = "mihrab-isfahan.jpg"
cadre = "aucun"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Mihrab_(Prayer_Niche)_MET_DP235035.jpg"
technique = "Mosaic of monochrome-glazed ceramic tiles, cut and assembled, 343.1 × 288.7 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The prayer niche of a Qur'anic school in Isfahan, made of thousands of fragments of ceramic: an architectural facing more than three metres high."
description = """
A niche with a pointed arch sinks into a large rectangular frame. The frame is bordered by a wide band of writing: tall white letters on a dark blue ground, which rise along the sides and run across the top. Closer to the arch, a white band bears an angular script, Kufic, in dark blue letters. Above the arch, white and turquoise scrolls intertwine on a blue ground. In the hollow of the niche, a network of stars and hexagons covers the half-dome, then a scattering of flowers and lattice work lines the back, interrupted by a rectangular panel: an inscription in cursive script, white and gold. Everything is made of small pieces of ceramic."""
evocation = """
The mihrab indicates to the faithful the direction of Mecca, towards which they pray; it is the heart of every mosque and every prayer hall. Its inscriptions explain its meaning. The great band quotes verses from Sura 9 of the Qur'an, which speak of those who maintain the mosques of God; the arch bears sayings of the Prophet, and the central panel a maxim according to which the mosque is the dwelling of the pious. The sunlight, sliding over the uneven facets of the ceramic, made the whole niche sparkle."""
histoire = """
This mihrab adorned a madrasa, a school of theology, founded in 755 AH, that is in 1354, in Isfahan, and today called the Madrasa Imami. Iran was then living under local dynasties, after the collapse of the Mongol empire of the Ilkhanids. Dismantled at the end of the 1920s, the mihrab was shipped to Philadelphia, where the university museum kept it, then the Metropolitan Museum of New York bought it in 1939. In the mid-1920s, potters of Isfahan had restored part of it: the lower part of the niche and the beginning and end of the great inscription band."""
facture = """
It is a ceramic mosaic. The tiles are first fired, each covered with a single colour: dark blue, turquoise, white, ochre yellow, green. They are then cut into small pieces following the design, then assembled face down, before mortar is poured on the back to form large panels. The technique, slower than painting on tile, gives vivid colours and outlines of perfect sharpness. It developed in Iran in the 14th century and in the following centuries would cover the domes and façades of the great mosques."""
details = [
  "The central panel of the niche, with its white and gold inscription.",
  "The tall white letters of the great band on a dark blue ground.",
  "The white band with Kufic script that follows the line of the arch.",
  "The stars and hexagons of the half-dome.",
  "The fine bands of lozenges that separate each part of the decoration.",
]
themes = ["ceramic", "architecture", "prayer", "calligraphy", "iran"]
anecdote = """
The mihrab weighs more than two tonnes. Dismantled into panels in Isfahan, it crossed the Atlantic before being reassembled in New York, where it forms one of the landmarks of the Islamic art galleries of the Metropolitan Museum."""
salle = 4
mur = "est"
position = 0.0
largeur = 2.88

