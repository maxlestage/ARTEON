[[oeuvres]]
titre = "Flaming June"
artiste = "Frederic Leighton"
annee = "1895"
image = "flaming-june.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Frederic_Leighton_-_Flaming_June_(1895)_-_Museo_de_Arte_de_Ponce.jpg"
technique = "Oil on canvas, 120 × 120 cm"
collection = "Museo de Arte de Ponce, Puerto Rico"
note = "A sleeping woman, wrapped in a transparent orange gown, at the edge of a sea glittering in the June sun: the most famous image of Victorian painting."
description = """
On a marble bench covered with dark fabrics, a young woman sleeps, \
curled up on herself: her head resting on her folded arm, her knees drawn \
up to her chest, a bare foot protruding from her gown. An orange gown, so fine that it \
reveals the body beneath, envelops her in countless folds, and her red hair \
spreads over the cushions. Behind her, beyond a marble balustrade, the sea \
glitters under a high-summer sun, and a coast is outlined on the horizon. At the top, \
an ornamental frieze closes the composition; on the right, a flowering oleander branch \
rises above the balustrade. On the floor, on the pale paving, trails the edge of a \
red fabric."""
evocation = """
Leighton tells no story: no myth, no hero, only sleep, heat and \
colour. The figure has often been compared to the Night sculpted by Michelangelo for the \
Medici tomb in Florence, which the painter admired: a powerful body curled in \
rest. The oleander branch, a toxic plant, has been read as an allusion to the fragile border between sleep and \
death. The title evokes the burning light of June, which seems to pass into the orange \
fabric. Painted a few months before Leighton's death, the picture has sometimes been seen \
as a farewell, an image of voluptuous oblivion proper to the aestheticism of the late \
century, in which beauty is sufficient unto itself."""
histoire = """
The motif was born of a detail: Leighton had imagined this sleeper to adorn a \
marble bath in another painting, Summer Slumber, and made of it a subject in its \
own right. Exhibited at the Royal Academy in 1895, Flaming June was bought by the \
illustrated magazine The Graphic, which offered a reproduction to its readers at Christmas. \
After Leighton's death in January 1896, the canvas disappeared from view, then suffered \
the disrepute of all Victorian painting. Found in the early 1960s in \
a London house, it found no buyer at auction. In 1963, the Puerto Rican \
industrialist Luis A. Ferré, who was assembling the collections of the museum he had founded in Ponce, \
bought it in Amsterdam for less than a thousand dollars. It has become the emblem of the museum."""
facture = """
The square format, a rare one, encloses the figure as in a case: the body, folded into a \
series of curves, fills almost the whole space. Leighton prepared the pose with \
several studies, first nude, then draped, to find the exact position of the \
limbs. He then paints the fabric in transparent layers that let the \
flesh show through in places, and gives the canvas a warm dominant, from red to golden yellow. \
The sea, in the background, is made of thin luminous strokes, like molten metal. The \
marble, the frieze and the paving recall his classical culture, nourished on Greek \
sculpture."""
details = [
  "The flowering oleander branch, a poisonous plant, at upper right.",
  "The bare foot protruding from the gown, at the bottom of the painting.",
  "The band of sea glittering behind the balustrade.",
  "The transparency of the fabric, which reveals the leg and the breast.",
  "The edge of the red fabric trailing on the paving, at lower left.",
]
themes = ["sleep", "summer", "colour", "aestheticism", "woman"]
anecdote = """
As a teenager, the composer Andrew Lloyd Webber saw the painting in a London shop, \
shortly after its rediscovery, and asked his grandmother to lend him the 50 \
pounds being asked for it. She refused: she did not want, she said, this \
Victorian junk in her house."""
salle = 4
mur = "nord"
position = -3.0
largeur = 1.2

[[oeuvres]]
titre = "David the Shepherd"
artiste = "Elizabeth Jane Gardner"
annee = "c. 1895"
image = "berger-david.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:David_the_Shepherd,_Elizabeth_Jane_Gardner.jpg"
technique = "Oil on canvas, 153.7 × 105.1 cm"
collection = "National Museum of Women in the Arts, Washington"
note = "Kneeling on the lion he has just killed, the young shepherd clasps the rescued lamb and raises his arm to the sky: the best-known work of an American woman who made her name at the Salon."
description = """
In an arid landscape, at the foot of tall bluish cliffs, a teenager with curly \
black hair kneels on the body of a dead lion. He wears a simple \
white tunic knotted at the waist, and his feet are bare. With his right arm, he clasps \
a white lamb to himself, which looks at the viewer. He raises his left arm to the sky, \
the hand open, and turns a solemn gaze upwards. Beneath his knee, the lion's \
head, jaws open, still shows its fangs; its tawny mane and paws \
spread over the pale earth. In the background, the sky brightens behind the mountains; \
a few dry grasses grow among the stones. The painter's signature is \
inscribed at lower left."""
evocation = """
The first book of Samuel relates that the young David, a shepherd before he was king, \
snatched a lamb from the jaws of a lion and killed the beast: he reminds King Saul of it \
to win the right to face Goliath. Gardner paints the moment after the \
victory, when the shepherd gives thanks. The image combines strength and gentleness, the beast \
struck down and the lamb protected; one may read in it the figure of the Good Shepherd, which \
Christian tradition links to the line of David. For a woman painter, this choice \
was not trivial: religious and history painting, the most prestigious genres, \
were in practice the preserve of men, and Gardner measures herself against them on their \
own ground."""
histoire = """
Born in New Hampshire, Elizabeth Jane Gardner settled in Paris in 1864. The École \
des Beaux-Arts being closed to women, she trained in private studios, then, \
from 1873, at the Académie Julian, under Jules Lefebvre and William \
Bouguereau. She exhibited at the Salon from 1868 and would be admitted more than twenty times. \
Painted around 1895, David the Shepherd ranks among her most admired works in \
her lifetime; the following year, she married Bouguereau. The painting was given to the National \
Museum of Women in the Arts in Washington by its founders, Wallace and Wilhelmina \
Holladay, who opened in 1987 this museum devoted to women artists."""
facture = """
Gardner made Bouguereau's manner her own: rigorous drawing, smooth modelling, \
luminous flesh standing out against a dark background. She takes care over the texture of \
each material: the curly wool of the lamb, the cloth of the tunic, the lion's mane, \
the boy's skin. The composition is pyramidal, from the raised arm to the lion's \
paws spread on the ground, and the diagonal of the arm directs the gaze to the sky. The \
colours are sober, whites, ochres and bluish greys, to concentrate the light on the \
group of the child and the lamb."""
details = [
  "The lamb's gaze, turned towards the viewer.",
  "The open jaws of the dead lion, beneath David's knee.",
  "The shepherd's bare foot, in the foreground at left.",
  "The bluish cliffs, at upper left, beneath a brightening sky.",
  "David's left hand, open towards the sky.",
]
themes = ["bible", "shepherd", "innocence", "women painters", "courage"]
anecdote = """
Like Rosa Bonheur, Elizabeth Jane Gardner asked the police prefecture for \
permission to wear men's clothing. Dressed thus, she is said to have attended \
the drawing classes at the Gobelins manufactory, reserved for men."""
salle = 5
mur = "est"
place = 2
largeur = 1.05

[[oeuvres]]
titre = "Haymaking"
artiste = "Jules Bastien-Lepage"
annee = "1877"
image = "les-foins.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jules_Bastien-Lepage_-_Hay_making_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 160 × 195 cm"
collection = "Musée d'Orsay, Paris"
note = "An exhausted haymaker, seated in the cut grass, stares into space while her companion sleeps: naturalism enters the Salon of 1878."
description = """
In a freshly mown meadow, beneath a pale sky, two peasants rest after the \
midday meal. In the foreground, a young woman sits in the grass, her legs \
stretched out before her, her hands resting on her knees, open, inert. She wears \
a white shirt, a grey bodice and a canvas apron; her heavy shoes are \
covered in dust. She stares into space, her mouth slightly open, her face tanned, as if \
stupefied with fatigue. Behind her, a man lies in the hay, his straw hat pulled down over \
his face. A tin mess-tin sits near the young woman's feet. In the background, the meadow stretches to hills, dotted with haystacks, spindly trees \
and tiny haymakers."""
evocation = """
The painting tells almost nothing, and that is its strength: a pause in the middle of a \
working day, the body drained by effort. Bastien-Lepage, a child of a Lorraine village, \
shows the countryside without embellishing or dramatising it, far from the \
graceful shepherdesses of academic painting as from the biblical grandeur of Millet's peasants. \
The haymaker's vacant gaze disconcerted part of the critics, who judged \
her ugly or dull-witted; others saw in it a new truth, the very weariness of \
work in the fields. The work shows that the Salon could accommodate modernity: the \
technique is academic, but the subject, the light and the framing look towards \
photography and open-air painting."""
histoire = """
A pupil of Cabanel at the École des Beaux-Arts, Bastien-Lepage failed the Prix de Rome, \
but made his name at the Salon with portraits of striking truth. In \
1877, he painted Haymaking at Damvillers, his native village in the Meuse, in the meadows \
he had known since childhood. Exhibited at the Salon of 1878, the painting made him the \
leader of a new painting, naturalism, which reconciles the craft taught \
at the École with the observation of rural life. After the painter's premature death in \
1884, the canvas was bought in 1885, at the sale of his studio, for the Musée du \
Luxembourg; it is now in the Musée d'Orsay."""
facture = """
Bastien-Lepage combines two manners. The faces and hands are painted with the \
precision of a portraitist; the grass, hay and meadow are brushed in long, \
lively, free strokes, in a pale range of silvery greens, straw-blondes and \
greys. The horizon is set very high: the meadow rises like a wall behind the \
figures and pushes them towards the viewer, a framing that almost eliminates the sky \
and recalls photography. The light is diffuse, without marked shadows, that of a \
hazy summer day. The large format, that of a history painting, gives the peasants \
a monumental presence."""
details = [
  "The haymaker's open hands, resting loosely on her knees.",
  "The straw hat pulled down over the face of the sleeping mower.",
  "The tin mess-tin set in the grass, on the right.",
  "The little haystacks and the haymakers in the distance, at the foot of the hills.",
  "The inscription \"Damvillers\" and the signature, at lower left.",
]
themes = ["peasants", "labour", "naturalism", "countryside", "fatigue"]
anecdote = """
Bastien-Lepage's manner had followers well beyond France: Scottish painters, \
the "Glasgow Boys", English painters settled at Newlyn in Cornwall, and \
many Scandinavians adopted his life-size peasants and grey open-air \
light."""
salle = 5
mur = "nord"
