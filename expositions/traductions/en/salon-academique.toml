[[artistes]]
nom = "Thomas Couture"
vie = "Senlis, 21 December 1815 – Villiers-le-Bel, 30 March 1879"
biographie = """
Born in Senlis, Thomas Couture grew up in Paris, where he trained in the studio of \
Antoine-Jean Gros, then in that of Paul Delaroche. In 1837 he won the second \
Grand Prix de Rome, but never the first, a failure he felt as an injustice. \
He made his name at the Salon with genre paintings and portraits, before the \
triumph of Romans of the Decadence in 1847. He then opened an independent studio, \
free of the École des Beaux-Arts, which attracted very many pupils, French, \
German and American: Édouard Manet stayed there six years, Puvis de Chavannes and Anselm \
Feuerbach passed through. The State then commissioned large compositions from him, such as \
The Enrolment of the Volunteers of 1792, which he failed to complete; disappointed by \
official commissions and quarrels, he gradually withdrew from the Paris scene. \
In 1867, he published Méthode et entretiens d'atelier, a collection of practical advice \
that was very successful, particularly in the United States. He spent his last years at \
Villiers-le-Bel, north of Paris, where he died in 1879."""
style = """
Couture wanted to reconcile the classical tradition with colour: solid drawing \
inherited from David and Gros, a theatrical composition, but rapid execution, with \
frank tones and a sometimes visible touch, inspired by the Venetians. His teaching, \
freer than that of the École, valued the sketch and the freshness of the first attempt. \
He thus forms the link between grand history painting and Manet's generation."""

[[artistes]]
nom = "Paul Delaroche"
vie = "Paris, 17 July 1797 – Paris, 4 November 1856"
biographie = """
Hippolyte, known as Paul Delaroche, was born in Paris and trained in the studio of Antoine-Jean \
Gros. He made his debut at the Salon in 1822 and within a few years established himself with \
history scenes, often English, of great dramatic power: The Princes \
in the Tower, now in the Louvre, Cromwell and Charles I, The Execution of Lady Jane \
Grey. Elected to the Académie des Beaux-Arts in 1832, he became professor at the École des \
Beaux-Arts. In 1835, he married Louise Vernet, daughter of the painter Horace Vernet; her \
death, ten years later, affected him deeply. From 1837 to 1841, he painted the Hemicycle \
of the lecture hall of the École des Beaux-Arts, an immense composition bringing together the great \
artists of all time. His studio, one of the busiest in Paris, trained \
Jean-Léon Gérôme, Jean-François Millet, Thomas Couture and several pioneers of \
photography, such as Gustave Le Gray. After 1843, he ceased to work for the Salon \
and devoted himself to more intimate paintings, religious or Napoleonic, such as Napoleon \
at Fontainebleau. He died in Paris in 1856."""
style = """
Delaroche invented a new kind of history painting, between the classicism of David and \
Romanticism: subjects drawn from modern history, English and French, treated \
with the exactness of a theatre designer and the smooth finish of the École. He chooses \
the moment before the drama rather than the action itself, and appeals to the emotion \
of the viewer. Spread by engraving, his art was immensely popular; it is \
often seen as a forerunner of the staging of historical cinema."""

[[artistes]]
nom = "Ernest Meissonier"
vie = "Lyon, 21 February 1815 – Paris, 31 January 1891"
biographie = """
Jean-Louis-Ernest Meissonier was born in Lyon into a family of tradespeople and grew up in \
Paris. He trained largely on his own, after a brief stay in the studio of Léon \
Cogniet, and at first earned his living illustrating books. At the Salon, where he exhibited from \
1834, he made a speciality of small genre paintings, readers, \
smokers or chess players in seventeenth- and eighteenth-century costume, painted with a \
minuteness recalling the Dutch masters. The success was immense, and his canvases \
reached prices never before seen for a living painter. A witness of the June Days of \
1848, he painted The Barricade, a striking memory of the repression. He followed Napoleon \
III during the Italian campaign of 1859, then undertook the Napoleonic cycle that \
includes 1814 and Friedland, 1807. During the siege of Paris, in 1870, he served as an \
officer in the National Guard. In 1889, he presided over the fine arts jury of the \
Exposition Universelle; the following year, he took the lead of the Société nationale \
des beaux-arts, which organised a Salon rival to the official Salon. He died in Paris in \
1891."""
style = """
Meissonier is the master of the small format: tiny scenes, painted with a fine brush \
on wood, in which every button, every harness, every fold is exact. This goldsmith's \
precision, served by obsessive documentation, also applies to military history \
and to the horse, which he studied tirelessly. Realist critics \
reproached him for a miniaturist's perfection; his admirers compared him to the \
Dutch little masters. His market value, the highest of his day, collapsed in the twentieth \
century."""

[[artistes]]
nom = "Lawrence Alma-Tadema"
vie = "Dronrijp (Netherlands), 8 January 1836 – Wiesbaden (Germany), 25 June 1912"
biographie = """
Lourens Alma Tadema was born in a village in Friesland, in the Netherlands, the son of a notary. He \
studied at the Academy of Fine Arts in Antwerp, then worked under Baron Henri \
Leys, a painter of Flemish history. His first successes were scenes of ancient \
Egypt and of the Merovingian era. A trip to Italy in 1863, during which he \
visited Pompeii, determined his career: from then on, he would paint the daily life of \
ancient Greece and Rome. The dealer Ernest Gambart, who bought many \
canvases from him, made him known in England. A widower, he settled in London in 1870 with \
his two daughters, married the painter Laura Epps the following year and became a \
British subject in 1873. A member of the Royal Academy, knighted in 1899, awarded the Order of \
Merit in 1905, he led a lavish life in a house-studio that he decorated \
himself. He numbered his works in Roman numerals, like opuses, up to more than \
four hundred. He died in 1912 during a cure at Wiesbaden and is buried in \
St Paul's Cathedral in London."""
style = """
Alma-Tadema brings Antiquity back to life in its everyday setting: baths, banquets, gardens, \
lovers' trysts by the sea, peopled with figures who resemble the English \
of his day. His reputation rests on the virtuosity of his textures, above all \
marble, and on an archaeological erudition nourished by photographs. Scorned after his \
death, he is said to have inspired the sets of the great Hollywood historical films."""

[[artistes]]
nom = "Jean-Léon Gérôme"
vie = "Vesoul, 11 May 1824 – Paris, 10 January 1904"
biographie = """
Son of a goldsmith from Vesoul, Jean-Léon Gérôme entered Paul \
Delaroche's studio in Paris at sixteen, and accompanied him to Italy in 1843. He made his debut at the Salon of 1847 with \
Young Greeks Attending a Cock Fight, which made him instantly famous and the \
leader of the "Neo-Greeks", painters of an amiable, familiar Antiquity. In \
1853, he discovered Constantinople, then Egypt in 1856: the "Orient" became one of \
his favourite subjects, alongside Roman history and the history of France. In \
1863, he married Marie Goupil, daughter of the great dealer Adolphe Goupil, whose firm \
distributed his works as engravings and photographs throughout the world. Appointed \
professor at the École des Beaux-Arts in 1864, he taught there for nearly forty years and \
trained hundreds of pupils, including the American Thomas Eakins. A member of the Institut, \
covered in honours, he took up sculpture late in life. A resolute opponent of \
Impressionism, he protested in 1894 against the entry of the Caillebotte collection into the \
Musée du Luxembourg. He died in Paris in 1904."""
style = """
Gérôme pushes the École's smooth finish to the extreme: invisible touch, precise drawing, \
details of an archaeological or ethnographic exactness that give his scenes \
the appearance of documents. He composes like a stage director, often choosing \
the moment after the action. His Orientalist paintings, widely circulated, fixed for \
a long time the European image of the "Orient"; his ancient scenes, such as Pollice \
Verso, inspired the cinema, up to Ridley Scott's Gladiator."""

[[artistes]]
nom = "Alexandre Cabanel"
vie = "Montpellier, 28 September 1823 – Paris, 23 January 1889"
biographie = """
Born in Montpellier into a modest family, Alexandre Cabanel showed very early a gift \
for drawing and left to study in Paris. A pupil of François-Édouard Picot at the École des \
Beaux-Arts, he won in 1845 a second Grand Prix de Rome which nonetheless opened \
the doors of the Villa Medici to him. Back in Paris, he pursued an exemplary career: \
religious and mythological paintings, large decorative schemes, such as the Life of Saint Louis at the \
Panthéon, and above all portraits of French and American high society, of which he \
became one of the favourite painters. The triumph of The Birth of Venus, in 1863, \
coincided with his election to the Académie des Beaux-Arts and his appointment as \
professor at the École. For more than twenty-five years, he ran there one of the most \
sought-after studios, through which passed Jules Bastien-Lepage, Henri Gervex and many \
foreigners. Often a member of the Salon jury, he embodied in the eyes of the Impressionists \
the official art that rejected them. He died in Paris in 1889; the Musée Fabre in \
Montpellier, his native city, holds a major group of his works."""
style = """
Cabanel is the academic painter par excellence: impeccable drawing, smooth modelling, \
soft colours, noble subjects borrowed from mythology, the Bible and \
literature. His nudes, their sensuality tempered by the alibi of fable, won \
him the favour of Napoleon III and of the public; his portraits flattered the elegance of their \
sitters. For Zola and the defenders of Manet, he became the symbol of a conventional \
painting."""

[[artistes]]
nom = "William Bouguereau"
vie = "La Rochelle, 30 November 1825 – La Rochelle, 19 August 1905"
biographie = """
William-Adolphe Bouguereau was born in La Rochelle into a family of merchants. Destined \
for trade, he took drawing lessons in Bordeaux, then went to Paris in 1846 and entered \
the École des Beaux-Arts, in the studio of François-Édouard Picot. In 1850, he \
won the Grand Prix de Rome and stayed at the Villa Medici, where he studied Raphael and \
ancient paintings. Back in Paris, he received commissions for decorative schemes, then \
established himself at the Salon, where for half a century he exhibited almost every year mythological \
and religious subjects and scenes of idealised young peasant girls. His paintings, \
distributed by the dealers Paul Durand-Ruel and then Goupil, sold at very high prices, in \
particular to American collectors. A professor at the Académie Julian, then at \
the École des Beaux-Arts, he trained hundreds of pupils, many of them women. \
A member of the Institut from 1876, he was one of the pillars of the official Salon. He \
lost several of his children and his first wife; in 1896, he married Elizabeth \
Jane Gardner. He died in his native city in 1905."""
style = """
Bouguereau brings to perfection the technique taught by the École: drawing of \
absolute assurance, porcelain modelling, a smooth surface from which every trace of brush has \
vanished. His nymphs, his Venuses and his little peasant girls obey a single ideal of \
beauty, sentimental and without roughness. Adulated in his lifetime, he became for the moderns \
the symbol of the official art to be fought; rediscovered since the 1980s, he \
remains admired for his virtuosity and debated for his ideal."""

[[artistes]]
nom = "Frederic Leighton"
vie = "Scarborough (England), 3 December 1830 – London, 25 January 1896"
biographie = """
The son of a physician, Frederic Leighton grew up travelling across Europe with his \
family and received a cosmopolitan education. He studied painting in Frankfurt, at the \
Städel Institute, under Edward von Steinle, then in Brussels, Paris and Rome. \
In 1855, his first major painting, Cimabue's Celebrated Madonna Carried in Procession through the \
Streets of Florence, was exhibited at the Royal Academy and bought by Queen Victoria. \
Settled in London in the late 1850s, he became the central figure of \
Victorian classicism, with subjects drawn from Greek mythology and the Bible. \
He had a house-studio built in Holland Park, whose Arab Hall, lined with \
ceramic tiles brought back from the Near East, is now a museum. Elected \
President of the Royal Academy in 1878, he was knighted, then made a baronet in 1886, \
and finally a peer of the realm in January 1896: he died the next day, which makes his \
peerage the shortest in British history. He never married. He is \
buried in St Paul's Cathedral in London."""
style = """
Leighton is the great classicist of Victorian painting: rigorous drawing \
learned in Germany and Italy, sculptural figures inspired by Greek statuary \
and by Michelangelo, draperies with countless folds and warm, saturated colours. \
Close to the Aesthetic movement, he seeks beauty for its own sake \
rather than the moral lesson. A sculptor too, he produced the Athlete Wrestling with a \
Python, which renewed English sculpture."""

[[artistes]]
nom = "Elizabeth Jane Gardner"
vie = "Exeter (New Hampshire, United States), 4 October 1837 – Paris, 28 January 1922"
biographie = """
Elizabeth Jane Gardner grew up in New England and studied art and languages \
at Lasell Seminary, near Boston, graduating in 1856. In 1864, she \
left for Paris with her former teacher Imogene Robinson. The École des Beaux-Arts \
then refused women, who would not be admitted until 1897: Gardner copied \
paintings at the Louvre and the Musée du Luxembourg for American clients, then \
attended private studios and, from 1873, the Académie Julian, where she studied \
with Jules Lefebvre and William Bouguereau. In 1868, she was one of the first \
American women exhibited at the Salon, where she would be admitted more than twenty times and win a \
medal. A polyglot and shrewd businesswoman, she wrote for American newspapers \
and acted as an intermediary between American collectors and French \
artists. Linked for nearly twenty years to Bouguereau, her neighbour, she married him \
only in 1896, after the death of the painter's mother. Widowed in 1905, she continued to \
paint in Paris, where she died in 1922."""
style = """
Gardner adopted Bouguereau's manner: precise drawing, smooth modelling, mythological \
and biblical subjects and idealised scenes of childhood. Critics long \
reduced her to the role of imitator of her master, and she said she preferred to be the best \
imitator of Bouguereau rather than to be nobody. Her path, that of an \
American woman who established herself in the closed world of official Parisian art, interests \
people today as much as her paintings."""

[[artistes]]
nom = "Jules Bastien-Lepage"
vie = "Damvillers (Meuse), 1 November 1848 – Paris, 10 December 1884"
biographie = """
Jules Bastien-Lepage was born in Damvillers, a village in the Meuse, into a family of \
farmers who encouraged his artistic tastes. After school in Verdun, he left \
for Paris, worked for a time in the postal administration, then entered the École \
des Beaux-Arts in the studio of Alexandre Cabanel. Wounded during the war of 1870, \
he afterwards resumed his studies. He failed the Prix de Rome, but gained fame at the \
Salon of 1874 with the Portrait of My Grandfather, of striking truth. From then on he divided \
his life between Paris, where he painted portraits of notable figures, and \
Damvillers, where he painted the peasants of his village: Haymaking, then a Joan of Arc \
Listening to the Voices, now in the Metropolitan Museum in New York. He also worked \
in London and travelled in Italy and Algeria. Gravely ill, he died in Paris in \
1884, at thirty-six, and is buried in Damvillers. The young painter Marie \
Bashkirtseff, who admired him and was his friend, had died a few weeks \
earlier."""
style = """
Bastien-Lepage invents a Salon naturalism: life-size peasants, painted \
in their real setting, with a portraitist's precision for the faces and a \
freer touch for the backgrounds. His grey, diffuse light, his very high horizon \
and his figures caught without posing marked a whole European generation. He \
proves that one can be modern without giving up academic craft."""
