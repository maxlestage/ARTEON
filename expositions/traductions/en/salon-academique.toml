[exposition]
ordre = 112
nom_court = "Academic Art"
mouvement = "The Salon and Academic Art"
cadre = "baroque"
couleur = "#7a5418"
titre = "The Salon, Triumph of Academic Art"
artiste = "Bouguereau, Cabanel, Gérôme, Alma-Tadema, Leighton…"
dates = "1833–1895"
accroche = "Virtual exhibition · Petit Palais, Paris"
introduction = """
In the nineteenth century, the Paris Salon, the great official exhibition whose jury \
was dominated by the Académie des Beaux-Arts, made and unmade careers; the Royal Academy \
played the same role in London. It imposed an ideal: flawless drawing, polished surfaces, \
and grand subjects drawn from mythology, the Bible and history. The visit brings together \
ten canvases by its stars, French, English and American, from Delaroche to \
Leighton, without glossing over what this painting reveals about its age, its view of \
the female body and of the "Orient". The building is modelled on the Petit Palais, built \
in Paris for the 1900 Exposition Universelle: a domed porch, two long \
galleries running along the façade and, at their ends, two pavilions."""
vitrine = "naissance-de-venus-bouguereau.jpg"

[musee]
nom = "Petit Palais"
ville = "Paris, France"
architecte = "Charles Girault"
construction = "1897–1900"
presentation = """
For the Exposition Universelle of 1900, the old Palais de l'Industrie, demolished in \
1896, was replaced by two palaces facing each other on either side of a new avenue \
opening towards the Pont Alexandre-III and the Invalides: the Grand Palais and the Petit \
Palais. Winner of the competition, Charles Girault raised the latter from autumn 1897 to \
spring 1900. Its façade, about 125 metres long, is centred on a monumental porch \
crowned by a dome; behind it, the galleries enclose a semicircular garden bordered by a \
peristyle. Girault intended them to be lit by daylight alone, thanks to skylights, \
transparent domes and tall windows. Having become the Musée des Beaux-Arts de la Ville de Paris, the Petit Palais opens \
on 11 December 1902 and receives the immense Dutuit collection that same year. Renovated from \
2001 to 2005, it offers free admission to its permanent collections, from Antiquity to the \
early twentieth century; its largest canvases have a gallery of their own for large formats."""
ici = """
The ARTEON building takes up the layout of the Petit Palais: a central porch from which \
two long galleries extend, and two pavilions that return northwards like the \
wings around the garden. Visitors enter from the south beneath "The Domed Porch", sixteen \
metres high. To the west stretches "The Gallery of Large Formats", thirty-two metres long, with \
Salon-red walls; north of its far end opens the ochre \
pavilion "Antiquity and the Orient Imagined". To the east, "The Gallery of the Ideal", \
grey-green, leads to the pale pavilion "Shepherds and Haymakers"."""

