[[oeuvres]]
titre = "Romans of the Decadence"
artiste = "Thomas Couture"
annee = "1847"
image = "romains-de-la-decadence.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Thomas_Couture_-_Romans_during_the_Decadence_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 472 × 772 cm"
collection = "Musée d'Orsay, Paris"
note = "An orgy beneath the columns of a temple, under the stony gaze of the great ancestors: the triumph of the Salon of 1847. The canvas, nearly eight metres long, is shown here reduced."
description = """
In a vast hall with Corinthian colonnades, open at the back onto the sky and onto \
marble buildings, a crowd of Romans is bringing a night of revelry to its close. On couches \
draped with fabrics, half-naked men and women embrace, drink or collapse. \
At the centre, a woman dressed in white, reclining, stares into space wearily. In the \
foreground, a drunken man has fallen onto the paving, his head thrown back; higher up, on the \
right, another, climbing on a plinth, holds a cup to the lips of a statue. \
Everywhere, statues of heroes and sages dominate the scene with their motionless \
whiteness. On the right, two draped men stand watching the orgy without taking part; \
on the left, a young man seated on a high plinth keeps apart, looking sombre. On the \
ground lie amphorae, flowers and linens."""
evocation = """
Couture placed as an epigraph, in the Salon booklet, lines by the Latin poet Juvenal: \
more cruel than arms, luxury has fallen upon Rome and avenges the conquered world. The \
painting is a moral lesson: a people that has conquered the world loses itself in \
pleasure, under the eyes of its stone ancestors, images of the forgotten virtues of the \
Republic. The critics of 1847 saw in it an allusion to their own time: the \
France of Louis-Philippe, dominated by an enriched bourgeoisie and shaken by \
scandals, a few months before the February Revolution of 1848. One can also read in it \
the ambiguity of many academic paintings: the canvas condemns debauchery while \
complacently offering to the eye the very bodies it denounces."""
histoire = """
Thomas Couture had won only a second Grand Prix de Rome and was looking for a coup. \
He worked for several years on this immense canvas, which he presented at the Salon of 1847. \
The success was considerable: critics hailed a new master, able to unite the \
rigour of classical drawing with the colour of the Venetians, and the painting entered the \
State collections. It is now in the Musée d'Orsay, where its width of nearly \
eight metres makes it one of the largest canvases in the museum. This triumph also made \
Couture a sought-after teacher: in the independent studio he opened soon afterwards, \
free of the École des Beaux-Arts, he trained Édouard Manet and received Puvis de \
Chavannes, the German Anselm Feuerbach and many pupils from America."""
facture = """
Couture composes like a stage director: a symmetrical architecture, columns \
that give the canvas its rhythm, an opening of sky at the centre, and figures arranged as a \
frieze, as on an ancient bas-relief. From the Venetians, and above all from Veronese's \
great banquets, he borrows the breadth of the setting and the richness of the fabrics. But his \
execution is personal: frankly laid tones, a sometimes visible touch, \
light glazes over a rapid underpainting. He set out this method in a book, \
Méthode et entretiens d'atelier, published in 1867. The palette remains restrained: ivory, \
ochres, marble greys, enlivened by a few deep reds and blues."""
details = [
  "At upper right, the reveller climbing on a plinth, holding a cup to the mouth of a statue.",
  "The two draped men standing at the far right, who watch the feast without taking part.",
  "The young man seated on a high plinth at left, wrapped in his cloak, keeping apart.",
  "The woman in white at the centre, leaning on her elbow, whose weary gaze seems to see nothing.",
  "In the foreground, the amphora, flowers and linens abandoned on the paving.",
]
themes = ["antiquity", "decadence", "morality", "feast", "history painting"]
anecdote = """
Édouard Manet spent six years in Thomas Couture's studio. Relations were \
stormy: the master thought his pupil too daring, the pupil mocked the affected poses \
of the models. Fifteen years after the triumph of the Romans, Manet would be the most \
contested painter of the Salon."""
salle = 2
mur = "sud"
position = 0.0
largeur = 4.5

[[oeuvres]]
titre = "The Execution of Lady Jane Grey"
artiste = "Paul Delaroche"
annee = "1833"
image = "execution-de-lady-jane-grey.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:PAUL_DELAROCHE_-_Ejecución_de_Lady_Jane_Grey_(National_Gallery_de_Londres,_1834).jpg"
technique = "Oil on canvas, 246 × 297 cm"
collection = "National Gallery, London"
note = "Blindfolded, the nine-day queen gropes for the block: Delaroche turns English history into a stage drama."
description = """
In a dark hall with massive pillars, a young woman in a white satin gown is \
kneeling on a cushion, her eyes bound with a cloth. She stretches her hands out before her, \
groping towards the wooden block set on the straw. An elderly man, in a black fur-lined \
coat, leans over her and gently guides her hand. On the right, standing, \
the executioner waits, in a brown doublet and red hose, a rope and a dagger at \
his belt, his hand resting on the handle of his axe. On the left, two ladies-in-waiting \
collapse: one, seated against a pillar, has fainted, clothes and \
jewels in her lap; the other, standing, hides her face against the wall. \
The scaffold is hung with black cloth."""
evocation = """
Great-granddaughter of King Henry VII, Lady Jane Grey was proclaimed Queen of England \
in July 1553 by Protestant nobles who wished to keep the Catholic Mary Tudor from the throne. \
Nine days later she was deposed, then imprisoned in the Tower of \
London; she was beheaded on 12 February 1554, at sixteen or seventeen. Delaroche makes \
of her the very image of innocence sacrificed to politics: the whiteness of the gown, \
the blindness of the blindfold, the hesitant hands. For the Parisian public of 1834, the scene \
also awakened recent memories: the scaffolds of the Revolution, \
Marie-Antoinette, and, four years after the revolution of 1830, the fall of another \
dynasty. The painting has often been compared to a melodramatic scene, frozen just before \
the blow."""
histoire = """
Delaroche, then at the height of his fame, had made a speciality of English \
history, with The Princes in the Tower or Cromwell and Charles I. Completed in 1833, \
the canvas caused a sensation at the Salon of 1834. Bought by the Russian prince Anatole \
Demidoff, it then passed to England to Lord Cheylesmore, whose son \
bequeathed it to the National Gallery in 1902. Kept at the Tate Gallery, it was believed \
destroyed in the Thames flood of 1928, which swamped the storerooms. In 1973, \
a Tate curator, Christopher Johnstone, found it rolled up, damaged but \
saved, while looking for a canvas by John Martin that had been rolled up inside it. Restored, it \
was on view again from 1975 and is now among the most \
beloved paintings in the museum."""
facture = """
Delaroche paints with a smooth finish, almost without a trace of the brush. The painting is \
built on the contrast of shadow and light: the satin gown, rendered with \
an illusionist's virtuosity, gathers the brightness at the centre, while the backgrounds, \
the black cloth and the dark clothing close in around it. A few warm notes revive the \
eye: the orange fur, the executioner's red hose, the gold of the hair picked up \
by the straw. The figures, almost life-size, are lined up on a narrow platform \
before a setting of arcades, like actors on a stage."""
details = [
  "The white blindfold, the brightest spot in the painting.",
  "The iron rings fixed to the block, and the fresh straw spread to soak up the blood.",
  "The axe with its worn blade, propped on the ground beside the executioner.",
  "The hand of Sir John Brydges, Lieutenant of the Tower, guiding Jane's.",
  "The clothes and jewels laid in the lap of the fainting lady-in-waiting.",
]
themes = ["history", "england", "execution", "innocence", "theatre"]
anecdote = """
Delaroche took liberties with history: Jane Grey was executed in the open air, \
within the precincts of the Tower of London, near the chapel of St Peter ad Vincula, and \
not in a hall with Romanesque pillars. The painter preferred the dimness of an \
interior, more suited to drama."""
salle = 2
mur = "ouest"
place = 2
largeur = 2.97

[[oeuvres]]
titre = "1814, The Campaign of France"
artiste = "Ernest Meissonier"
annee = "1864"
image = "campagne-de-france-1814.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Meissonier_-_1814,_Campagne_de_France.jpg"
technique = "Oil on panel, 51.5 × 76.5 cm"
collection = "Musée d'Orsay, Paris"
note = "Napoleon, sombre, on his white horse at the head of his staff in the muddy snow: a small panel 76 cm wide, shown here enlarged."
description = """
On a rutted country road, where snow mingles with frozen mud, a column \
of horsemen advances towards the viewer beneath a low grey sky. At the head, slightly \
apart, Napoleon rides a white horse. He wears his buttoned grey greatcoat and his \
black bicorne; his face is set, his gaze fixed, his body slumped in the saddle. \
Behind him, in close file, his marshals and officers, in dark coats and \
bicornes, ride in silence; one of them, wrapped in a brown cape, seems to \
sleep on his mount. On the right, in the distance, a long column of infantry stands out \
against the white plain. In the foreground, deep ruts cut into the road."""
evocation = """
At the start of 1814, France is invaded by the Allied armies. Napoleon, with \
exhausted troops and very young conscripts, still wins victories in \
Champagne, but cannot prevent the fall of Paris at the end of March, followed by his abdication. \
Meissonier paints neither a battle nor a triumph, but a moment of doubt: \
the emperor, alone with his thoughts, leads towards defeat the men who still \
follow him. The frozen landscape and leaden sky speak of the end of the epic. Under the Second \
Empire, ruled by Napoleon's nephew, the image took on a particular resonance: \
a legend seen in its grandeur and in its solitude. It has been read as the portrait of a \
man rather than of a hero."""
histoire = """
Famous for his tiny genre scenes, Meissonier undertook in the 1860s a cycle devoted \
to the Napoleonic epic, of which this panel, dated 1864, and \
Friedland, 1807, now in the Metropolitan Museum in New York, are the \
masterpieces. Maniacally exact, he borrowed the emperor's saddle from Prince \
Napoleon, cousin of Napoleon III, and had a copy made of the famous grey \
greatcoat, which he put on himself to pose before a mirror. Sold in 1866 to a banker, \
the painting changed hands several times at rising prices, until it reached the \
collector Alfred Chauchard, co-founder of the Grands Magasins du Louvre, who \
bequeathed it to the Louvre; it entered there in 1909 and joined the Musée d'Orsay in 1986."""
facture = """
Meissonier paints on a wood panel, with a fine brush, with a precision that allows one \
to count the buttons on the uniforms and the buckles on the harnesses. Each horse has its \
coat, its character, its gait: passionate about the anatomy and movement of the horse, \
the painter multiplied studies from life and small sculpted models. His \
virtuosity does not preclude a genuine atmosphere: the cold, sunless light, the \
grey and ochre mud and the overcast sky unify the scene. The composition, a diagonal \
running from the background at left to the white horse, gives the procession a \
slow, inexorable movement."""
details = [
  "Napoleon's set face, in the shadow of the bicorne.",
  "The emperor's white horse, advancing at an even pace through the slush.",
  "The rider wrapped in a brown cape behind the emperor, his head sunk between his shoulders.",
  "The column of infantry on the horizon at right.",
  "The signature and date, at lower right.",
]
themes = ["napoleon", "history", "winter", "defeat", "horses"]
anecdote = """
In 1890, Alfred Chauchard paid 850,000 francs for this small painting, a record for the work \
of a living painter. The same year, he had acquired Millet's The Angelus for a \
comparable sum: the two canvases entered the Louvre together with his bequest."""
salle = 2
mur = "nord"
position = 3.0
largeur = 1.4

[[oeuvres]]
titre = "The Roses of Heliogabalus"
artiste = "Lawrence Alma-Tadema"
annee = "1888"
image = "roses-d-heliogabale.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Roses_of_Heliogabalus.jpg"
technique = "Oil on canvas, 132.7 × 214.4 cm"
collection = "Juan Antonio Pérez Simón Collection, Mexico City"
note = "The emperor Heliogabalus watches his guests vanish beneath a rain of rose petals: a Roman banquet of poisonous beauty."
description = """
The lower half of the painting disappears under thousands of pink petals, which \
are still raining down from a great canvas stretched across the ceiling, at upper left, that has just \
been opened. Guests crowned with flowers, reclining on cushions, are half \
buried in them: a pale-faced woman, a man crowned with foliage, a young woman \
in a sea-green gown who, on the right, looks at the viewer. Above them, on a \
marble dais, the emperor, in a golden robe, reclines at table with his companions \
before the fruits of dessert; they contemplate the scene, amused. On the left, near a \
column, a musician plays the double flute; in the background, a bronze statue of \
Dionysus stands out against the sky and blue mountains."""
evocation = """
The episode comes from the Historia Augusta, a late and unreliable collection of lives of \
emperors: Heliogabalus, emperor from 218 to 222, is said to have had so many violets and flowers \
dropped from a movable ceiling onto his guests that some, unable to \
free themselves, were smothered to death. Alma-Tadema replaces the violets with roses and \
turns a cruelty into enchantment: nothing shows death, only beauty and \
the indifference of the powerful who look on. The painting takes up the old theme of \
Roman decadence, but without Couture's moral lesson: it seduces before \
disturbing. It has been read as a mirror of Victorian society, fascinated by luxury, and as \
a meditation on beauty that smothers."""
histoire = """
The canvas was commissioned in 1888 by Sir John Aird, a public-works \
contractor, for 4,000 pounds, and exhibited the same year at the Royal Academy in London. \
After the painter's death in 1912, Victorian painting went out of fashion: the Aird \
family sold the painting in 1935 for 483 guineas, and in 1960, at auction, it did not \
even find a buyer. The American television producer Allen Funt, creator of \
the programme Candid Camera and a collector of Alma-Tadema when nobody wanted him, \
then acquired it, before selling it in 1973. Sold for 1.5 million pounds in \
London in 1993, it now belongs to the Spanish-Mexican collector Juan \
Antonio Pérez Simón."""
facture = """
Alma-Tadema paints with an archaeologist's minuteness: the veined marble of the columns, the \
bronze of the statue, the silver of the tripod, the embroidered fabrics are rendered with a \
precision that makes the scene credible, like a photograph of Antiquity. The \
composition is bold: the emperor, the subject of the painting, is pushed into the middle ground, \
and the foreground is given over to an almost abstract mass of petals, painted one by one \
in every shade from pink to white. The clear, even light of the \
Mediterranean replaces the chiaroscuro of the old masters."""
details = [
  "The canvas opened in the ceiling, at upper left, from which the petals continue to rain.",
  "The double-flute player, dressed in a panther skin like a maenad.",
  "The bronze statue of Dionysus, god of wine, in the background, inspired by the Ludovisi Dionysus.",
  "The bearded man in a green tunic, on the right, standing by a column of pink marble.",
  "The young woman on her cushions, at lower right, the only one who looks at the viewer.",
]
themes = ["antiquity", "rome", "flowers", "decadence", "luxury"]
anecdote = """
There were no roses in England during the winter when Alma-Tadema painted the \
picture: according to the account handed down, he had them sent from the south of France every \
week, for four months, so as to paint his petals from life."""
salle = 3
mur = "nord"
place = 2
largeur = 2.14

[[oeuvres]]
titre = "The Snake Charmer"
artiste = "Jean-Léon Gérôme"
annee = "c. 1879"
image = "charmeur-de-serpents.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jean-Léon_Gérôme_-_Le_charmeur_de_serpents.jpg"
technique = "Oil on canvas, 82.2 × 121 cm"
collection = "Clark Art Institute, Williamstown (Massachusetts)"
note = "Before a wall of blue tiles, a naked boy shows a snake to armed men: an image that passes itself off as a document and is composed entirely in the studio."
description = """
In a hall whose walls are covered with blue and white ceramic tiles, beneath a \
long frieze of Arabic inscriptions, a young naked boy, seen from behind, stands \
on a small rug. A large snake coils around his waist and \
shoulders; he holds its head out at arm's length. On the right, a bearded old man, seated \
on the ground, plays the flute. Facing them, backed against the wall, a dozen men armed with \
spears and sabres, in varied costumes, watch the scene, seated on the floor; in \
the middle, an old man in a green turban, leaning on cushions, seems to preside. On the \
worn paving in the foreground, two wicker baskets and a small gourd. On the wall \
hang a round shield and spears."""
evocation = """
The painting presents itself as a scene witnessed, in Egypt or Istanbul. In reality, \
Gérôme composed it in Paris by assembling elements of diverse origins, and could not \
have been a witness to it. It embodies what has been called, since the 1970s, \
Orientalism: an image of the "Orient" fabricated by and for Europeans, in which the \
peoples of North Africa and the Near East appear exotic, sensual or \
threatening, at the very moment when France and Britain were extending their rule over \
those regions. In 1978, Edward Said had it reproduced on the cover of his book \
Orientalism; in 1983, the art historian Linda Nochlin showed how its meticulous realism \
makes an imaginary Orient credible, with no Europeans in sight and as if outside \
time. The boy's nakedness, offered to the viewer, has also been read as an \
erotic undertone."""
histoire = """
A pupil of Delaroche, Gérôme discovered Constantinople in 1853, then spent eight months in \
Egypt in 1856, bringing back sketches, costumes and weapons; he returned there often, \
with other artists and photographers. The Snake Charmer was painted around \
1879. His dealer and father-in-law, Adolphe Goupil, sold it in 1880 to a \
New York collector, Albert Spencer; in 1888, Alfred Corning Clark bought it at auction and \
lent it in 1893 to the World's Columbian Exposition in Chicago. Sold again by his widow, the \
painting resurfaced in 1942 at a sale in New York: Alfred's son, Sterling \
Clark, who had admired it as a child in the family home, then acquired it. It entered \
in 1955 the museum that Sterling Clark and his wife Francine founded in Williamstown."""
facture = """
Gérôme paints with a smooth, precise, almost photographic finish that gives every \
detail the authority of a document. But this document is a montage. The tiles in the background \
copy, probably from photographs, panels from the "Golden Way" of the \
harem of Topkapi Palace in Istanbul; the frieze mixes these tiles with a band of \
Qur'anic verses from the Baghdad Kiosk, in the same palace, and some \
inscriptions, faithful in places, elsewhere become meaningless signs. \
The paving comes from a mosque in Cairo, and the snake charmer belongs to \
Egyptian, not Ottoman, traditions. The cold, bluish light unifies this collage."""
details = [
  "The tiles fallen from the wall, at left, which Linda Nochlin read as a sign of the negligence attributed to the inhabitants.",
  "The frieze of inscriptions at the top of the painting, partly copied faithfully, partly illegible.",
  "The spiked helmet of one of the spectators, a Persian object that Gérôme painted in several pictures.",
  "The snake coiled around the boy, whose species cannot be identified with certainty.",
  "The old flautist on the right, the flute at his lips, beside his drum.",
]
themes = ["orientalism", "gaze", "staging", "colonialism", "nudity"]
anecdote = """
In 1888, Alfred Corning Clark had paid 19,500 dollars for this painting; in 1942, Gérôme \
was so unfashionable that his son Sterling obtained it for 500 dollars. Sterling Clark \
nonetheless considered it a masterpiece of its kind."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.45

[[oeuvres]]
titre = "The Birth of Venus"
artiste = "Alexandre Cabanel"
annee = "1863"
image = "naissance-de-venus-cabanel.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Alexandre_Cabanel_-_The_Birth_of_Venus_-_Google_Art_Project_2.jpg"
technique = "Oil on canvas, 130 × 225 cm"
collection = "Musée d'Orsay, Paris"
note = "The canvas triumphed at the Salon of 1863 and Napoleon III bought it, the very year Manet's Luncheon on the Grass caused a scandal at the Salon des Refusés."
description = """
Lying on the crest of a wave, a naked woman stretches, as if waking from sleep. \
Her body, of a pearly whiteness, fills almost the whole width of the painting, from her \
feet grazing the foam to the arm folded over her brow. Her eyes are half-closed; \
her long red hair spreads out in the water. The sea, a dark blue-green, \
undulates gently, and the white foam lifts the goddess like a bed. Above her, \
in a pale blue sky crossed by light clouds, five little winged cupids fly in a \
farandole; some blow into conch shells. On the horizon, at left, a distant \
coast can be made out. The signature, Alex. Cabanel, is inscribed at lower left."""
evocation = """
According to myth, Venus, goddess of love, is born from the foam of the sea. Cabanel shows \
neither shell nor divine retinue: a languid woman, offered to the gaze, whose abandon \
suggests pleasure more than birth. Here lies the whole paradox of the academic nude: \
the alibi of fable makes acceptable at the Salon a body that the modesty of the age \
would refuse were it that of a contemporary woman. Critics were not fooled: \
Émile Zola, in 1867, saw in the goddess a Parisian lorette, made of "a sort \
of white and pink almond paste". Today, the work is often cited to \
question the male gaze directed at female bodies, which dominated the official \
exhibitions."""
histoire = """
The Salon of 1863 went down as the Salon of the Venuses: Cabanel, Paul Baudry and \
Amaury-Duval each exhibited a large mythological nude. Cabanel's triumphed, and \
the emperor Napoleon III bought it for his personal collection. The same year, the \
jury rejected so many works that the emperor authorised an exhibition of the rejected, the Salon \
des Refusés, where Manet's Luncheon on the Grass caused a scandal. Cabanel, for his part, was elected \
to the Académie des Beaux-Arts and appointed professor at the École des Beaux-Arts. He painted \
in 1875 a reduced replica of the picture, now in the Metropolitan Museum in New \
York; the original is in the Musée d'Orsay."""
facture = """
Trained at the École des Beaux-Arts in the studio of François-Édouard Picot, Cabanel \
takes great care over drawing and modelling: the skin is smooth, polished, without a trace of brush, a \
porcelain pink barely shaded. This licked surface, the ideal of the École's pupils, \
is the opposite of the visible brushwork that the Impressionists would champion. The composition \
rests on a long horizontal, the goddess's body, which doubles the line of \
the horizon, and on the curve of the cupids that answers it in the sky. The colours are \
few and soft: blues of sea and sky, ivory of flesh, russet of the \
hair."""
details = [
  "The goddess's eyes, half-closed beneath her arm: is she sleeping or looking?",
  "The red hair that mingles with the foam and the waves.",
  "The cupids blowing into conch shells, like miniature tritons.",
  "Venus's feet, at left, grazing the crest of a wave.",
  "The signature \"Alex. Cabanel\", at lower left.",
]
themes = ["mythology", "nude", "venus", "sea", "gaze"]
anecdote = """
When Manet exhibited Olympia at the Salon of 1865, two years after Cabanel's triumph, it was \
often seen as a reply to the Venuses of 1863: a naked woman, very real and of her \
own time, who looks the viewer straight in the eye. The public was outraged."""
