[[oeuvres]]
titre = "The Birth of Venus"
artiste = "William Bouguereau"
annee = "1879"
image = "naissance-de-venus-bouguereau.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:William-Adolphe_Bouguereau_(1825-1905)_-_The_Birth_of_Venus_(1879).jpg"
technique = "Oil on canvas, 300 × 218 cm"
collection = "Musée d'Orsay, Paris"
note = "Standing on her shell, the goddess wrings her hair amid nymphs, tritons and cupids: Bouguereau's great canvas at the Salon of 1879."
description = """
In the middle of a rough sea, Venus, naked, stands on a great shell. \
Her weight on one leg, she raises both arms to wring her long chestnut \
hair, her head inclined, her eyes lowered. Around her, a retinue swirls: \
on the right, a triton blows into a conch, a reclining nymph reaches out her arm towards the \
goddess, another, crowned with foliage, raises her eyes to the sky; on the left, a \
bearded triton embraces a nymph seen from behind. In the foreground, a man in the water, seen \
from behind, brandishes a conch, and two little cupids play on a dolphin. In the sky, \
a cloud of winged cupids, some armed with arrows, forms a crown above the \
goddess."""
evocation = """
Bouguereau takes up a subject treated by Botticelli and above all by Raphael, whose \
Triumph of Galatea at the Villa Farnesina he had been able to admire in Rome: the same figure at the \
centre, the same ring of nymphs, tritons and cupids. He gives an extremely idealised \
version of it, in which the female body, without the slightest flaw, becomes a living \
statue. For his admirers, it was the very perfection of art; for the \
avant-garde painters, beginning with the Impressionists, the symbol of a conventional, \
pleasing and empty painting. Today, one sees in it as much the virtuosity of an \
exceptional draughtsman as the staging of a feminine ideal conceived by and for the \
men of his time."""
histoire = """
Bouguereau was fifty-three and counted among the most honoured painters in \
France when he presented The Birth of Venus at the Salon of 1879. The State bought it for \
the Musée du Luxembourg, then devoted to living artists. His paintings sold \
for very high prices, notably to American collectors, and his teaching at the Académie \
Julian attracted pupils from all over the world. After his death in 1905, his work fell \
into long disrepute. The opening of the Musée d'Orsay in 1986, which chose to \
show academic art alongside the Impressionists, contributed to his rediscovery: The \
Birth of Venus has become one of the best-known images of Salon painting."""
facture = """
Bouguereau prepares his large canvases with many drawings and studies from the \
model, then paints in thin, smooth layers, erasing every trace of brush. The \
modelling of the bodies, with a porcelain softness, contrasts with the tanned complexion of the \
tritons. The composition is skilfully regulated: the goddess forms a vertical axis at the \
centre, extended by her raised arms, and the other figures coil around her \
up to the crown of cupids in the sky. The pearly, cool colours, blues and \
mauves of sea and clouds, pinks of the flesh, heighten the unreal character of the \
scene. Three metres high: this is the format of the great history paintings."""
details = [
  "The open shell beneath Venus's feet, barely visible in the foam.",
  "The black dolphin, in the foreground, on which two cupids play.",
  "The nymph crowned with foliage, on the right, who raises her eyes to the sky.",
  "The cupids armed with arrows, at upper right.",
  "The signature and date, at lower left, almost drowned in the water.",
]
themes = ["mythology", "nude", "venus", "ideal", "sea"]
anecdote = """
In 1896, Bouguereau married one of his former pupils from the Académie Julian, the \
American painter Elizabeth Jane Gardner, one of whose canvases is exhibited further on in \
this visit. They had been together for nearly twenty years, but married only after \
the death of the painter's mother."""
