[exposition]
ordre = 28
nom_court = "Africa, Oceania, the Americas"
mouvement = "Arts of Africa, Oceania and the Americas"
cadre = "vitrine"
couleur = "#8a4b2a"
titre = "Faces of the Ancestors: Arts of Africa, Oceania and the Americas"
artiste = "Ife, Benin, Dan, Fang, Māori, Elema, Olmec, Tairona, Lakota…"
dates = "900 BC – c. 1900"
accroche = "Virtual exhibition · Musée du quai Branly – Jacques Chirac, Paris"
introduction = """
Long called “primitive art” or “first arts”, the arts of Africa, Oceania and the Americas are those of kingdoms, cities and societies that each have their own history, their own workshops and their own masters. The visit brings together ten objects, from an Olmec jade face more than two thousand years old to a Lakota shirt painted around 1890: royal heads from Ife and Benin, masks and reliquaries from West and Central Africa, a Māori pendant, a sacred board from Papua, gold from Colombia. Several left their countries during colonial conquests, and their histories say so. The building is inspired by Jean Nouvel’s musée du quai Branly – Jacques Chirac in Paris: an entrance ramp, then a long plateau in earth colours where the continents follow one another without closed partitions."""
vitrine = "masque-idia.jpg"

[musee]
nom = "Musée du quai Branly – Jacques Chirac"
ville = "Paris, France"
architecte = "Jean Nouvel"
construction = "opened in 2006"
presentation = """
The museum grew out of the determination of President Jacques Chirac and his friend the collector Jacques Kerchache, who wanted to give the arts of Africa, Asia, Oceania and the Americas the place they deserved in French museums. A first selection of masterpieces entered the Louvre, in the Pavillon des Sessions, in 2000; the new museum, which brings together the collections of the Musée de l’Homme and of the Musée national des Arts d’Afrique et d’Océanie, opened in June 2006 on the banks of the Seine. Jean Nouvel designed it as a long building raised on stilts in the middle of a garden laid out by Gilles Clément; a living wall by Patrick Blanc covers one of the façades, and coloured boxes jut out from the north façade. Inside, a long white ramp climbs to the collections plateau, a single dark space where the continents succeed one another. The museum has borne the name of Jacques Chirac since 2016. In 2021, France drew from it twenty-six objects from the royal treasure of Abomey, taken in 1892, to return them to the Republic of Benin."""
ici = """
The ARTEON building keeps the promenade of the Paris museum: a climb, then a long plateau where the continents follow one another. You enter from the south into “The Ramp”, eight metres high, which opens to the north onto the plateau, an east–west enfilade of four rooms seven metres high with earth-coloured walls. At the centre lies the room “Africa · Ife and the Kingdom of Benin”; to the west, “Oceania”; to the east, “Africa · Masks and Reliquaries”, then, at the end of the plateau, “The Americas”. The objects are shown in deep wall display cases, against a backdrop of dark velvet."""

