[[oeuvres]]
titre = "Royal Head from Ife"
artiste = "Ifé, royaume yoruba"
annee = "14th – early 15th century"
image = "tete-ife.jpg"
credit = "Photo : Sailko"
licence = "CC BY-SA 3.0"
source = "https://commons.wikimedia.org/wiki/File:Arte_yoruba,_nigeria,_testa_da_ife,_12-15mo_secolo.JPG"
technique = "Copper alloy (brass) cast by the lost-wax method, height approx. 35 cm"
collection = "British Museum, London"
note = "A crowned, life-size head cast in metal at Ife, the holy city of the Yoruba: most likely the idealised portrait of a king, the ooni. About 35 cm high, it is shown here enlarged."
description = """
A man’s head, roughly life-size, rises on a cylindrical neck. The face, oval and full, is perfectly calm: heavy eyelids, a broad, straight nose, full, well-drawn lips, closed. Its whole surface is covered with fine vertical lines, close and parallel, running from the forehead down to the chin. Around the mouth and along the jaw, a row of small holes pierces the metal. The head wears a tall crown made of rows of tubular beads, decorated at the front with a rosette and surmounted by a braided plume ending in a button-shaped point. The patinated metal has taken on a dark green tint, which lets reddish glints show through in places."""
evocation = """
The crown of beads, reserved for the king, very probably designates an ooni, the sacred ruler of Ife, the city that the Yoruba regard as the place where the world was created. The face is not that of an individual captured from life, but an ideal image: young, serene, flawless. Historians see in it the expression of a kingship beyond time, rather than the portrait of a man. The fine striations have been read as scarification or as the memory of a veil of beads covering the king’s face, which was not to be seen; the small holes probably served to attach beads, a beard or that veil. It is thought that such heads were dressed with headgear or garments during funerary or commemorative rites."""
histoire = """
In 1938, workmen digging foundations in the Wunmonije compound, near the ooni’s palace at Ife, unearthed a group of metal heads. Their discovery astounded European scholars. Most stayed in Nigeria, then a British colony, and are today held by the country’s national museums. This one left Ife and entered the British Museum as early as 1939, under inventory number Af1939,34.1. Its departure is still debated in Nigeria, which wishes to see the works that left the country during the colonial period returned. The head has become the emblem of Ife art: it has appeared in major exhibitions devoted to the city and ranks among the most famous pieces in the London museum."""
facture = """
The head is cast by the lost-wax method: the sculptor models the face in wax over a clay core, encases it in a mould, then melts out the wax and replaces it with molten metal. The walls are thin and even, a sign of great technical mastery. The very soft modelling of the flesh, the rimmed eyelids and the sharply defined lips attest to close observation of the human face, which Ife artists also practised in terracotta. The striations were engraved in the wax before casting, one by one."""
details = [
  "The fine vertical striations covering the whole face.",
  "The small holes around the mouth and along the jaw.",
  "The rosette at the centre of the crown of beads.",
  "The braided plume rising from the top of the head.",
  "The heavy, half-lowered eyelids, finely rimmed.",
]
themes = ["kingship", "portrait", "yoruba", "bronze", "nigeria"]
anecdote = """
When the German ethnologist Leo Frobenius saw heads of this style at Ife in 1910, he refused to see in them the work of African artists and imagined that they came from Atlantis or from Greek colonists: a prejudice that archaeology has since entirely disproved."""
salle = 2
mur = "nord"
place = 2
largeur = 0.7

[[oeuvres]]
titre = "Pendant Mask of the Queen Mother Idia"
artiste = "Royaume du Bénin, Edo"
annee = "16th century"
image = "masque-idia.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Queen_Mother_Pendant_Mask-_Iyoba_MET_DP231460.jpg"
technique = "Ivory, iron and brass inlays, 23.8 × 12.7 × 6.4 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A small ivory mask that the oba of Benin wore at his belt, in the likeness of his mother, Idia, the kingdom’s first queen mother. 24 cm high, it is shown here enlarged."
description = """
A woman’s face, carved in ivory, looks straight ahead. The features are fine and regular: a straight nose, full lips, almond-shaped eyes whose pupils are inlaid with iron. On the forehead, two vertical bands of iron mark the position of scarification. The hair, braided into small curls, is rendered by a scattering of circles. At the top, a sort of openwork diadem lines up tiny heads of bearded men, wearing European-style hats, alternating with fish. An openwork collar of the same kind encircles the chin. The ivory, yellowed by time, is crossed by fine cracks, and green traces of metal can be made out around the mouth."""
evocation = """
In the early sixteenth century, the oba Esigie defeated the neighbouring kingdom of Igala thanks, tradition says, to the counsel and powers of his mother, Idia. He created for her the title of iyoba, queen mother, with her own palace. The mask celebrates this woman of power. The little bearded heads are Portuguese, who arrived by sea in the late fifteenth century: for the Edo, these strangers from the ocean were associated with Olokun, god of the waters and of wealth. The mudfish, able to survive out of water, evoke the passage between two worlds, and the power of the oba, the divine king. The oba wore this pendant at his hip during ceremonies to purify the kingdom."""
histoire = """
The mask was carved for the court of Benin City, in present-day Nigeria, by the guild of ivory carvers, who worked exclusively for the oba. In February 1897, a British military expedition took and burned the city, exiled the oba Ovonramwen and carried off several thousand objects from the palace. This one was part of the loot; it then passed through British collections before being acquired by Nelson Rockefeller, who gave it to the Met in 1972. Nigeria and the royal family of Benin have for decades asked for the return of these works. Since 2021, museums and universities in Germany, the United States and the United Kingdom have begun to restitute objects looted in 1897; this mask, for its part, is still in New York."""
facture = """
Ivory, the royal material in Benin, is carved with extreme delicacy: the heads of the diadem, a few millimetres high, each have their own beard and hat. The sculptor plays on contrasts: the smooth surfaces of the face, the granular relief of the hair, the openwork of the crown and collar. The iron, inlaid in the eyes and on the forehead, darkens the gaze and makes the presence more intense. On the back, loops allowed the mask to be attached to the belt."""
details = [
  "The little heads of bearded Portuguese forming the crown.",
  "The mudfish that alternate with them.",
  "The two vertical iron bands in the middle of the forehead.",
  "The iron pupils, one of which has kept all its dark lustre.",
]
themes = ["queen mother", "power", "ivory", "portuguese", "restitution"]
anecdote = """
The twin of this mask, in the British Museum, became the emblem of FESTAC 77, the great festival of African arts held in Lagos in 1977. Nigeria had asked to borrow it; unable to obtain it, it had a copy made, and the mask became a symbol of demands for restitution."""
salle = 2
mur = "nord"
place = 3
largeur = 0.8

[[oeuvres]]
titre = "Plaque of a Warrior Chief"
artiste = "Royaume du Bénin, Edo"
annee = "c. 1540–1570"
image = "plaque-chef-guerrier.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Plaque-_Warrior_Chief_MET_1979.206.98.jpeg"
technique = "Brass cast by the lost-wax method, 47.4 × 21.5 × 6.1 cm"
collection = "Metropolitan Museum of Art, New York"
note = "One of the hundreds of brass plaques that covered the pillars of the royal palace of Benin: a war chief in full regalia."
description = """
On a rectangular metal plaque, a standing man stands out in high relief, frontal, almost like a statue. He wears a tall helmet, braided and studded with spikes and a curved feather, and his neck disappears into a high collar of beads. The torso is bare; a wrapper with patterned borders, knotted at the hip, falls to his knees, and bracelets circle his wrists and ankles. In his left hand he holds a long, vertical spear. The background is engraved with four-lobed leaf motifs, barely visible. Along the edges of the plaque, several round holes show where the nails that fixed it to the wood passed."""
evocation = """
The plaques formed a kind of archive in images of the court: the oba and his dignitaries, warriors, musicians, rites, the Portuguese strangers. This chief, stiff and frontal, is not an individual but a rank: the helmet, the collar of coral beads and the spear speak of his status and his military function, in the service of the king. In the sixteenth century, Benin was a powerful, expanding kingdom, trading with the Portuguese. The metal itself tells of this trade: brass arrived in part in the form of manillas, metal bracelets that Europeans exchanged for ivory, pepper, cloth and, later, captives. The engraved leaves of the background are often linked to the cult of Olokun."""
histoire = """
The plaque was cast by the guild of Benin City founders, settled in a street reserved for them and working for the oba alone. Nailed to a palace pillar, it was later taken down and stored with the others. In February 1897, after the deaths of members of a British expedition, a force of more than a thousand men took the city, burned it and carried off the palace treasures, including about nine hundred plaques, sold to pay for the operation and scattered among the museums of Europe and America. Since 2021, institutions in Germany, the United States and the United Kingdom have returned hundreds of objects to Nigeria, or their ownership; in 2021, the Met itself returned to Nigeria two plaques illegally removed from the Nigerian national collections. This one entered the Met in 1979 with the Nelson Rockefeller collection."""
facture = """
The plaque is cast in a single pour, by the lost-wax method, figure and background together. The relief is very high: the head and shoulders stand almost entirely free of the background. The founder worked the wax with care to render the beads of the collar one by one, the braids of the helmet and the patterns of the wrapper. The flat background is punched with tiny dots and engraved with leaves, which makes it shimmer in the light. The symmetrical, frontal composition was conceived to be read from a distance, on the pillars."""
details = [
  "The high collar of beads that hides the warrior’s neck.",
  "The braided helmet, bristling with spikes, and its curved feather.",
  "The four-lobed leaves engraved in the background, on either side.",
  "The nail holes, at the corners and along the edges of the plaque.",
]
themes = ["warrior", "royal court", "brass", "plunder", "restitution"]
anecdote = """
The founders of Benin City are still at work: the Igun Eronmwon guild, settled in the same street for centuries, still casts brass objects today by the lost-wax method, following the methods of its ancestors."""
salle = 2
mur = "sud"
place = 4
largeur = 0.9

[[oeuvres]]
titre = "Runner’s Mask (gunyege)"
artiste = "Dan"
annee = "early 20th century (?)"
image = "masque-dan.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1972.331"
technique = "Wood, metal, leather and organic materials, height 22.9 cm"
collection = "Cleveland Museum of Art"
note = "A mask of the Dan of Côte d’Ivoire or Liberia, with a high forehead and metal-rimmed eyes, worn by a runner during masked races. 23 cm high, it is shown here enlarged."
description = """
The mask, of dark, polished wood, has the shape of an elongated, slightly convex oval. The forehead, very high and smooth, takes up almost half of the face. The eyes are two large round holes, rimmed with rings of pale metal that give them a fixed, luminous gaze. The nose is short, the nostrils well marked. The mouth, slightly open, shows a row of teeth. All around the face, a line of small holes follows the edge of the mask. The brown surface, patinated by use, is streaked with fine lines and marked with paler patches where the wood has been worn or rubbed."""
evocation = """
Among the Dan, a mask is not a mere sculpture: it is the dwelling of a forest spirit, which manifests itself in the village when the mask is worn, with its costume, by a dancer whose identity remains secret. Each mask has a role and a name. This type with a high forehead, from the north of Dan country, is called sagbwe or gunyege. The gunyege is a “running mask”: it took part in races held every week during the dry season. Its large, round eyes, it is said, allowed the wearer to see well while running. The mask could also watch over the village against fire, when the harmattan blows, the dry and dangerous wind from the Sahara."""
histoire = """
The Cleveland Museum of Art knows neither the name of the sculptor nor the village of origin of the mask: all that is known is that it was carved by an artist of the Dan style, in the region that today straddles Côte d’Ivoire and Liberia, probably in the early twentieth century. Like many Dan objects, it was bought by Western collectors at a time when the context of objects was hardly recorded. It belonged to Katherine White, a great collector of African art from Cleveland, who gave it to the museum in 1972. Specialists have noticed that its eyes were altered: originally they were slits, later turned into circles, a sign that the mask changed function over the course of its life."""
facture = """
The sculptor carved the mask from a single block of wood, with an adze and then a knife, hollowing out the inside so that it fits the face. The surface was blackened and polished; use and repeated care gave it its shiny patina. The northern Dan style is recognised by the high, rounded forehead, the regular oval and the simple, taut volumes. The holes around the edge served to attach a headdress of fibres and the costume that hid the wearer; the metal rings were added around the eyes."""
details = [
  "The metal rings surrounding the round eyes.",
  "On the mask’s right eye, the trace of the former slit, before it was enlarged.",
  "The row of small holes following the edge of the face.",
  "The teeth visible in the slightly open mouth.",
]
themes = ["mask", "spirit", "race", "forest", "côte d’ivoire"]
anecdote = """
Among the Dan, one does not say that a man wears a mask: it is the spirit of the mask that appears. Revealing who was under the costume was a grave taboo, and women and children were not supposed to know."""
salle = 3
mur = "nord"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Head of a Reliquary Guardian (nlô byeri)"
artiste = "Fang"
annee = "19th century"
image = "tete-byeri-fang.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Sculptural_Element_from_a_Reliquary_Ensemble-_Head_(The_Great_Bieri)_MET_DT1238.jpg"
technique = "Wood, copper alloy, palm oil, 46.5 × 24.8 × 16.8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A Fang head from Gabon, known by the nickname “The Great Bieri”: it watched over a box containing the relics of a family’s ancestors."
description = """
A large head of black, shining wood rises on a long cylindrical neck, set into a modern base. The face, in the shape of an elongated heart, is dominated by an enormous, domed forehead that descends in two arcs towards the eyes. These are two discs of metal, tarnished, set at the bottom of cavities. The long, narrow nose joins a small, tight-lipped mouth, thrust forward above a pointed chin. On each side, a long flat braid frames the face and runs down the neck, adorned with two discs. A deep crack runs through the wood from the top of the skull to the chin. The glossy surface seems still damp in places."""
evocation = """
Among the Fang, the bones of important ancestors, and above all their skulls, were kept in cylindrical bark boxes, guarded by the head of the family. On the lid, a statue or, as here, a head, the byeri, watched over these relics and protected them from the gaze of the uninitiated. The face is not a portrait. With its large forehead and newborn’s proportions, it has been seen as the union of ancestor and child, of death and rebirth. Its calm, its almost meditative concentration, has often been remarked. For European artists of the early twentieth century, such heads were a revelation: a sculpture that simplifies forms without losing any of its force."""
histoire = """
The head was carved in the nineteenth century by a Betsi artist, one of the Fang groups of Gabon. The byeri cult declined from the late nineteenth century, under pressure from missionaries and the French colonial administration, who fought it: many reliquaries were then destroyed, separated from their boxes or sold. Heads and statues thus arrived in Europe, where dealers and collectors sought them out, without the relics they had guarded. This one, which became one of the most famous, entered the collection of Nelson Rockefeller, who bequeathed it to the Met in 1979 with his group of art from Africa, Oceania and the Americas."""
facture = """
The sculptor carved the head and neck from a single piece of wood. The volumes are reduced to a few full forms: the shell of the forehead, the hollowed planes of the cheeks, the projection of the mouth. The flat braids form a frame that balances the composition. The wood was regularly rubbed with palm oil during rites: as it accumulated, the material formed this black, glossy crust, which still seeps. The metal eyes catch the light in the half-dark."""
details = [
  "The two metal discs of the eyes, deep in their sockets.",
  "The crack running from the top of the forehead to the chin.",
  "The flat braids, on either side, adorned with two round discs.",
  "The glossy surface, thickened by accumulated palm oil.",
  "The long neck, which sank into the relic box.",
]
themes = ["ancestors", "reliquary", "gabon", "wood", "cult"]
anecdote = """
During the initiation of young men, the Fang took the byeri out of their boxes and made them dance behind a curtain, like puppets, to present the ancestors to the new generation."""
salle = 3
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Hei-tiki Pendant"
artiste = "Māori"
annee = "19th century"
image = "hei-tiki.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Unknown_artist_-_Pendant_(Hei-tiki)_-_1969.107_-_Cleveland_Museum_of_Art.jpg"
technique = "Nephrite (pounamu, New Zealand jade), 16.9 × 10.2 cm"
collection = "Cleveland Museum of Art"
note = "A green jade pendant in the form of a human figure, worn around the neck by the Māori and handed down from generation to generation. 17 cm high, it is shown here enlarged."
description = """
A small human figure, carved from a deep green stone, sits with its legs folded and spread, forming a broad rounded base at the bottom. Its head, enormous, takes up nearly half the height and tilts to one side. Two large round eyes, each made of a raised ring around a central button, thus lie at different heights; beside them, a mouth and a hand are reduced to incised curves. The bent arms form two handles on either side of the flat torso. Between the limbs, openwork lets the light through. The stone is polished until it shines; its green, almost black in the hollows, lightens on the edges and is flecked in places with paler veins."""
evocation = """
Hei means “worn around the neck” and tiki designates a human figure. For the Māori, these pendants are taonga, treasures charged with mana, the prestige and spiritual power of those who have worn them. They are handed down in chiefly families, through the generations, and link the living to their ancestors. What does the figure represent? It has been seen as Tiki, the first man of Māori accounts, or as an ancestor; the Cleveland Museum of Art also recalls the hypothesis of Hine-te-iwaiwa, a legendary ancestor, model of womanhood and protector of births. The tilted head and the folded posture have sometimes been compared to those of an embryo."""
histoire = """
Pounamu, this green jade, is found only on the South Island of New Zealand, chiefly on the west coast and in the rivers; the Māori in fact call the island Te Wai Pounamu, “the waters of greenstone”. The stone circulated by exchange throughout the country. In the nineteenth century, many hei-tiki left New Zealand, colonised by the British from 1840, bought or collected by travellers, sailors and collectors. This one passed through the collection of the Englishman Harry Beasley, a great collector of Pacific objects, and then through that of John Wise. It entered the Cleveland Museum of Art in 1969, given by Mr. and Mrs. James B. Wadhams."""
facture = """
Nephrite is a very hard stone, which cannot be cut with a knife. Before the arrival of European metal tools, Māori sculptors cut it by sawing with sandstone blades and water, then hollowed and pierced it with stone drills and polished it for hours with sand: making a hei-tiki could take months. The full, rounded forms follow the thickness of the original slab of stone. The polish, carried to the extreme, brings out the depth of the colour."""
details = [
  "The large head tilted to one side.",
  "The round eye, ringed with a thick bead of stone.",
  "The arms bent into handles on either side of the torso.",
  "The openwork between the arms, the legs and the torso.",
  "The shades of green, darker in the hollows.",
]
themes = ["jade", "ancestors", "adornment", "polynesia", "new zealand"]
anecdote = """
The eyes of hei-tiki were often inlaid with paua shell, New Zealand’s abalone with its blue-green iridescence, or with red wax. On this one, the eyes are cut in the stone itself, in concentric rings."""
salle = 4
mur = "nord"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Spirit Board (hohao)"
artiste = "Elema, golfe de Papouasie"
annee = "before 1930"
image = "planche-esprit-elema.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1971.154"
technique = "Painted wood, height 123.2 cm"
collection = "Cleveland Museum of Art"
note = "A sacred board from Papua New Guinea, inhabited by a spirit of the bush whose name it bore, and kept in the men’s house."
description = """
An oval board of wood, more than a metre high, ends at top and bottom in a short tenon. On a whitened ground, a figure is engraved and painted in reddish brown. It is almost all face: two large almond-shaped eyes, with pupils made of concentric circles, frame a long, pointed nose, carved in relief, and a wide mouth bristling with zigzag teeth. Above, chevrons and sawtooth lines form a kind of headdress. Beneath the face, two small arms rise, hands open, on either side of an egg-shaped body, painted red, at the centre of which a circle marks the navel. Two thin, bent legs descend towards the bottom. Bands of chevrons follow the edges of the board."""
evocation = """
Among the Elema, who live on the coast of the Gulf of Papua, in the south of New Guinea, each board was inhabited by a spirit of the bush, whose name it bore. The boards were kept in the great men’s house, at the heart of the village, with other sacred objects, out of sight of women and children. Observers of the early twentieth century report that they were asked for protection and success, in hunting as in war. The painted face is not that of a man: it is the presence of the spirit, made visible. The geometric motifs repeat forms found on the great masks of Elema ceremonies."""
histoire = """
The board was carved and painted before 1930 in the Gulf of Papua region, then administered by Australia. At that time, the arrival of missionaries and administrators upset religious life: the great ceremonies became rarer, men’s houses were abandoned and many sacred objects were sold or taken away by Western collectors and museums. The Australian anthropologist Francis Edgar Williams then studied the Orokolo region and described Elema ceremonies. The board entered the Cleveland Museum of Art in 1971, given by Dr. and Mrs. Thomas Munro."""
facture = """
The board is cut from a single panel of wood, thinned and rounded, with its two tenons. Only the nose is carved in relief; everything else is obtained by engraving shallow grooves, then by painting. The colours are natural pigments: red ochre and white lime or clay, on the brown of the wood. The almost symmetrical decoration is organised around the axis of the nose."""
details = [
  "The pupils made of concentric circles.",
  "The pointed nose, the only element carved in relief.",
  "The mouth with its zigzag teeth.",
  "The small raised hands on either side of the red body.",
  "The circle of the navel at the centre of the body.",
]
themes = ["spirit", "men’s house", "painting", "papua", "sacred"]
anecdote = """
The Elema gave each board the name of the spirit that inhabited it: for them, these boards were not interchangeable images, but individual beings, known and named like people."""
salle = 4
mur = "nord"
place = 3
largeur = 0.6

