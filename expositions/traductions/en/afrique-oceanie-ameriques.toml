note = "A human face carved from dark green jadeite by the Olmecs of the Gulf of Mexico, the earliest great civilisation of Mesoamerica. 15 cm high, it is shown here enlarged."
description = """
A man’s face, seen from the front, is carved from a green stone, dark and veined with paler patches. The features are full and powerful: broad cheekbones, a short, flattened nose, heavy eyelids, almond-shaped eyes barely open, hollowed into slight slits. The mouth, with thick lips, is slightly parted, its corners turning down a little. The face is cut cleanly above the forehead, as if by a headband, and at the sides; small holes pierce the edges, near the ears. The polished surface catches the light on the raised areas and holds it in the hollows. Neither neck nor hair is visible: it is a mask rather than a head."""
evocation = """
The Olmecs, who lived on the coast of the Gulf of Mexico, in the present-day states of Veracruz and Tabasco, are known for their colossal basalt heads and their jade objects. For them, as later for the Maya and the Aztecs, green stone was more precious than gold: it evoked water, young maize, life and breath. This ideal face, calm and grave, has been compared with those of rulers and their ancestors. The mouth with its downturned corners recalls the Olmec figures said to have a “jaguar face”, beings mingling man and animal. It is not known whether such masks were worn, attached to a costume, or placed in tombs."""
histoire = """
The face was carved between 900 and 400 BC, at the time when La Venta, in present-day Tabasco, was the great Olmec centre. Neither its findspot nor its early history is known: like most Olmec jades in museums, it appeared on the art market with no record of excavation. These precious objects were already circulating in Antiquity: the Maya and the Aztecs found them, kept them and reused them as relics, several centuries after they were made. This one belonged to the New York collector Alice K. Bache, who bequeathed it to the Met in 1977."""
facture = """
Jadeite is a stone so hard that it cannot be cut with ordinary metal tools; the Olmecs, in any case, had none. The sculptor wore it down patiently with abrasives, sand and water, cords and drills of wood or bone, then polished it at length. The work shows in the softness of the transitions between volumes: the cheeks, eyelids and lips seem modelled like wax. The side perforations, made with a drill, probably allowed the face to be fastened."""
details = [
  "The half-closed eyes, simple slits in the stone.",
  "The slightly open mouth, its corners gently downturned.",
  "The paler veins running through the jadeite.",
  "The small holes drilled along the edges, near the ears.",
]
themes = ["jade", "mesoamerica", "face", "ruler", "mexico"]
anecdote = """
The Aztecs were already collecting Olmec antiquities: a green stone mask in the Olmec style, more than two thousand years old at the time, was found among the offerings buried at the Templo Mayor of Tenochtitlan."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Pendant of a Masked Figure"
artiste = "Tairona"
annee = "900–1600"
image = "pendentif-tairona.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Masked_Figure_Pendant_MET_DP215717.jpg"
technique = "Gold cast by the lost-wax method, 13.3 × 14.6 × 5.1 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A gold pendant of the Tairona, a people of the Sierra Nevada de Santa Marta in northern Colombia: a masked man beneath an immense headdress. 15 cm wide, it is shown here enlarged."
description = """
A small, stocky man stands upright, facing forward, on short, massive legs. His arms hang along his body and his hands grip two objects ending in spirals, at hip height. A braided belt cinches his waist. His face disappears behind an animal mask with a wide, toothed mouth. Above rises an immense headdress, much wider than he is: two small bird heads with curved beaks lean over the top of the skull; on each side, two large flat elements, in the form of wings or of bird heads with an eye, extend like ears; higher still, two arcs of braided gold wire coil into volutes, accompanied by spiral discs. The gold, a warm yellow, gleams on the raised areas."""
evocation = """
The figure is probably a man of high rank, chief or priest, adorned for a ceremony. The mask and the headdress with bird heads suggest a transformation: during the rite, the man takes on the strength of the animal. For the peoples of Colombia, gold was not a currency but a sacred material, linked to the sun and to fertility, which made its wearer shine. The Kogi, the Arhuaco and the Wiwa, descendants of the Tairona who still live in the Sierra Nevada, consider themselves the guardians of the balance of the world."""
histoire = """
The Tairona built stone villages, linked by stairways and paved paths, on the slopes of the Sierra Nevada de Santa Marta, above the Caribbean Sea. Their goldsmiths produced many pendants of this type between the tenth and sixteenth centuries. From 1525, the Spanish founded Santa Marta and sought the region’s gold; after decades of war, the Tairona withdrew into the heights of the mountain. A large part of the Amerindian gold seized by the conquerors was melted into ingots; the surviving pieces come mostly from tombs. This one was given to the Met in 1991 by the collector Jan Mitchell."""
facture = """
The pendant is cast by the lost-wax method: the goldsmith modelled each element in wax, rolled fine threads of wax for the spirals and twists, coated the whole with clay, then poured molten metal in place of the wax. The Tairona often used an alloy of gold and copper, called tumbaga, whose gold they brought to the surface by a chemical treatment, to give it the lustre of pure gold. The work combines solid parts, such as the body, and very light openwork parts."""
details = [
  "The two small bird heads with hooked beaks, at the top of the skull.",
  "The arcs of braided gold wire coiling into volutes.",
  "The mask with its wide toothed mouth, hiding the face.",
  "The spiral objects the figure holds in each hand.",
  "The toes, finely indicated, beneath the stocky feet.",
]
themes = ["gold", "goldsmithing", "colombia", "mask", "transformation"]
anecdote = """
The “Ciudad Perdida”, the Lost City of the Tairona, with its stone terraces hidden in the forest of the Sierra Nevada, was revealed to the general public only in the 1970s, after its discovery by tomb robbers."""
salle = 5
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Painted Chief’s Shirt"
artiste = "Lakota"
annee = "c. 1890"
image = "chemise-lakota.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:America,_Native_North_American,_Central_Plains,_Lakota_Sioux,_19th_century_-_Hide_Shirt_-_1984.1046_-_Cleveland_Museum_of_Art.tif"
technique = "Hide, pigments, glass beads, human hair, 97.8 × 150 cm"
collection = "Cleveland Museum of Art"
note = "A painted hide shirt of the Lakota of the Great Plains, adorned with bands of beads and locks of hair: each lock recalls a feat of war."
description = """
The shirt, spread with arms open, measures one metre fifty from sleeve to sleeve. It is made of tanned hides, simply cut. The upper part and the sleeves are painted a slightly bluish green, the lower part a bright yellow: the two colours blend into one another at waist height. At the neck, a small beaded bib is striped with horizontal bands. Across the shoulders and along the sleeves run broad bands embroidered with glass beads, on a white ground, decorated with lozenges and small red, blue and green crosses. Along these bands hang long locks of dark hair, tied at the top with red bands. The bottom of the shirt and the cuffs end in fringes of cut hide."""
evocation = """
Among the Lakota, one of the nations that Europeans called Sioux, painted shirts were at first the privilege of the great chiefs, the “shirt wearers”. This rank was won through courage and sacrifice, and lost if one failed in one’s duties. The two colours have often been read as sky and earth. The locks of hair, given by members of the family, each represented a feat of war. Around 1890, when this shirt was made, the Lakota were confined to reservations; the painted shirt had become the honour of old warriors, a memory of the free life of the Plains."""
histoire = """
The shirt was made around 1890, at the darkest moment of Lakota history. The bison had been exterminated, the lands of the Black Hills, sacred to the Lakota, had been taken by the United States after the discovery of gold, and families lived on reservations. On 29 December 1890, the American army massacred several hundred Lakota, men, women and children, at Wounded Knee, on the Pine Ridge reservation. Who made and wore this shirt, and how it left its family, is not known. It belonged to David S. McMillan of Cleveland, who bequeathed it to the museum in 1984."""
facture = """
The shirt is made of tanned deer hides, sewn with sinew. The colours are applied with a brush, over large areas, with mineral pigments or, already at that time, colours bought at trading posts. The bands are embroidered with small glass beads imported from Europe, sewn in tight rows: this was women’s work, highly esteemed, which gradually replaced traditional porcupine-quill embroidery. The fringes and locks give movement to the garment as the man walks or dances."""
details = [
  "The locks of black hair hanging along the beaded bands.",
  "The small red crosses embroidered on a ground of white beads.",
  "The gradation where the green of the top blends into the yellow of the bottom.",
  "The fringes of cut hide at the bottom of the shirt and at the cuffs.",
]
themes = ["plains", "chief", "beads", "honour", "reservations"]
anecdote = """
The glass beads that Lakota women embroidered came in large part from Venice and Bohemia: they crossed the Atlantic and then went up the Missouri to the trading posts of the Great Plains."""
salle = 5
mur = "est"
place = 2
largeur = 1.8

[[artistes]]
nom = "Ifé, royaume yoruba"
vie = "Ife (south-west of present-day Nigeria), 12th–15th century"
biographie = """
Ife, or Ilé-Ifẹ̀, is for the Yoruba the holy city par excellence: it is there, according to their accounts, that the gods created the earth and that the first king, Oduduwa, founded the dynasty from which the rulers of the other Yoruba kingdoms descend. Between roughly the twelfth and the fifteenth century, Ife was a great walled city, at the heart of trade networks linking it to the River Niger and, beyond, to the Saharan routes. Its streets were paved with potsherds set on edge, and its workshops made glass beads, a royal material. Its artists, whose names we do not know, left heads and figures in terracotta and copper alloy of a naturalism without equal in Africa at that time, linked to the cult of kings and to their funerals. After the fifteenth century, Ife’s political influence declined in favour of Oyo and Benin, but the city kept its religious prestige. Its ruler, the ooni, is still counted among Nigeria’s great traditional chiefs. Twentieth-century excavations, from Leo Frobenius in 1910 to the discovery at Wunmonije in 1938, revealed this heritage to the world."""
style = """
Ife art is striking for its idealised naturalism: calm faces, full flesh, correct proportions, but features without age or flaw. The founders mastered lost-wax casting of pieces with very thin walls, and the terracotta modellers ranged from portraiture to the freest expressiveness. This art deeply influenced that of neighbouring Benin, whose tradition holds that a founder from Ife taught metal casting to the court artists."""

[[artistes]]
nom = "Royaume du Bénin, Edo"
vie = "Benin City (south of present-day Nigeria), 13th century – present"
biographie = """
The Kingdom of Benin, not to be confused with the neighbouring Republic of Benin, is the state of the Edo, in the south of present-day Nigeria. Its capital, Benin City, is surrounded by long earthen ramparts. At its head reigns the oba, the sacred king, whose dynasty goes back, according to tradition, to a prince from Ife. In the fifteenth and sixteenth centuries, under the obas Ewuare, Ozolua and Esigie, the kingdom expanded and became a regional power. The Portuguese arrived there in the 1480s and traded with the court: ivory, pepper, cloth and, later, captives, in exchange for brass, cloth and weapons. At the palace, guilds of artists, brass founders and carvers of ivory and wood, worked for the oba alone: they produced commemorative heads, plaques, statues and adornments. In February 1897, a British expedition took the city, burned it, exiled the oba Ovonramwen and carried off thousands of objects, now scattered among the museums of the world. The monarchy was restored in 1914; the present oba, Ewuare II, is asking, together with Nigeria, for the return of these works, some of which began to come back in 2021."""
style = """
The court art of Benin is an art of state, in the service of the king’s memory. It is recognised by its frontal, hierarchical figures, the precision of its adornments, coral beads, necklaces, weapons, and the virtuosity of its lost-wax casting. The plaques and ivories tell of court life and of the encounter with Europeans, who themselves became motifs. The founders of Benin City perpetuate this know-how today."""

[[artistes]]
nom = "Dan"
vie = "Western Côte d’Ivoire and Liberia, 19th–20th century"
biographie = """
The Dan live in the forest and wooded savannah regions that extend on either side of the border between Côte d’Ivoire and Liberia, around the town of Man. Rice cultivators, they live in independent villages, without a king, where authority is shared among elders, heads of families and men’s associations. Masks hold an essential place there: they are the manifestations of forest spirits, who appear in the village to judge disputes, accompany the initiation of boys, entertain, sing, dance or run. A mask may change role over its lifetime, rise in prestige and end as a respected judge’s mask. Dan sculptors, some of whom were famous in their lifetimes, like Zlan in the early twentieth century, worked on commission and were known for their personal manner. Dan masks entered Western collections in great numbers in the twentieth century, and the ethnologists Hans Himmelheber and Eberhard Fischer gathered from the Dan themselves part of their history and uses."""
style = """
The Dan style is recognised by its oval masks, with smooth, taut volumes, a domed forehead, a full mouth and eyes that are slits or round. The blackened, polished surface takes on a deep patina. Their simplicity and balance have made Dan masks models admired by twentieth-century artists and collectors."""

[[artistes]]
nom = "Fang"
vie = "Gabon, Equatorial Guinea and southern Cameroon, 19th century"
biographie = """
The Fang are a group of Bantu-speaking peoples settled in the forests of Gabon, Equatorial Guinea and southern Cameroon. In the nineteenth century, they migrated south and west and reached the region of the Gabon estuary and the Ogooué, where European explorers and traders met them. Their society, without central power, rests on lineages whose unity is guaranteed by the cult of the ancestors, the byeri: the skulls and bones of important dead are kept in bark boxes, surmounted by statues or protective heads. Several groups, such as the Betsi, the Ntumu or the Okak, each have their own style. With French colonisation and Christianisation, from the late nineteenth century, the byeri cult was fought and declined; many sculptures were destroyed or sold. The Fang also have masks, such as those of the ngil association, which dispensed justice. Arriving in Paris in the early twentieth century, Fang sculptures are among those that most struck the avant-garde artists, Derain, Vlaminck and Picasso."""
style = """
Fang sculpture seeks balance among full volumes: a large domed forehead, a concave heart-shaped face, a projecting mouth, powerful limbs. The black, glossy surface is nourished with oil over the course of the rites. Sculptors aim at an impression of calm and self-mastery, qualities that the Fang attributed to the ancestors."""

[[artistes]]
nom = "Māori"
vie = "Aotearoa – New Zealand, 13th century – present"
biographie = """
The Māori are the Polynesian people who settled in New Zealand, which they call Aotearoa, around the thirteenth century, after long canoe voyages from eastern Polynesia. Organised in tribes, the iwi, and in clans, they developed in these cold islands an original culture: great carved meeting houses, war canoes, facial tattooing, the moko, flax weaving, weapons and adornments of jade. Greenstone, pounamu, is one of the most precious materials; it is used to make adzes, clubs and pendants. The first European to reach these coasts was the Dutchman Abel Tasman in 1642, followed by James Cook in 1769. In the nineteenth century came whalers, missionaries and settlers; in 1840, the Treaty of Waitangi placed the country under British sovereignty, and the wars and loss of land that followed upended Māori society. Ancient objects, now taonga, treasures, are today at the heart of demands for return and of the Māori cultural revival."""
style = """
Māori art covers surfaces with spirals, curves and repeated motifs, carved in wood, bone or stone. Human figures, often stylised to the extreme, represent ancestors and carry the mana of those who owned them. The working of jade, slow and patient, gives full forms, polished to translucency."""

[[artistes]]
nom = "Elema, golfe de Papouasie"
vie = "Coast of the Gulf of Papua (Papua New Guinea), 19th – early 20th century"
biographie = """
The Elema live on the eastern coast of the Gulf of Papua, in the south of the great island of New Guinea, in a region of deltas, mangroves and beaches, around Orokolo Bay. Their villages are organised around great men’s houses, the eravo, with very tall façades, where boys are initiated and where sacred objects are kept, including the spirit boards. Religious life there was punctuated by great cycles of ceremonies, which could last years and ended with the appearance of dozens of immense masks, the hevehe, made of painted bark cloth stretched over a rattan frame. In the early twentieth century, the region was placed under Australian administration; missions and changes in economic life caused these great cycles to decline, then disappear, over the course of the twentieth century. The anthropologist Francis Edgar Williams described them in detail in his book Drama of Orokolo, published in 1940. Many Elema objects then left for museums in Australia, Europe and America."""
style = """
Elema art combines low-relief carving, engraving and painting. Its highly stylised figures are reduced to a face with large, ringed eyes, a prominent nose and a toothed mouth, surrounded by chevrons and zigzags. The colours, red, white and black, are drawn from earth and charcoal."""

[[artistes]]
nom = "Olmèques"
vie = "Coast of the Gulf of Mexico (Veracruz and Tabasco), c. 1500–400 BC"
biographie = """
The Olmecs are the earliest of the great civilisations of Mesoamerica. They lived in the humid, marshy lowlands of the southern Gulf of Mexico, in the present-day states of Veracruz and Tabasco. We do not know what name they gave themselves: that of Olmecs, “people of the rubber country”, was assigned to them by archaeologists from an Aztec term. Around 1200 BC, San Lorenzo became a great centre, with its terraces and basalt monuments, including colossal heads of rulers more than two metres high. Around 900 BC, La Venta succeeded it, with its earthen pyramid and its buried offerings of jade and serpentine. The Olmecs brought green stones, obsidian and shells from very far away, and their images spread across a large part of Mexico. Around 400 BC, La Venta was abandoned. But many Olmec traits, the cult of green stones, the ball game, certain deities, are found among the Maya and the peoples who followed."""
style = """
Olmec art is an art of mass and hard stone: colossal basalt heads, axes, masks and figurines of polished jade. The faces have full features, heavy eyelids and a thick mouth with downturned corners, sometimes mingled with jaguar traits. Their gravity and technical perfection made Olmec jades prestige objects down to the Aztec period."""

[[artistes]]
nom = "Tairona"
vie = "Sierra Nevada de Santa Marta (northern Colombia), c. 900–1600"
biographie = """
The Tairona occupied the Sierra Nevada de Santa Marta, an isolated massif in northern Colombia that rises within a few dozen kilometres from the Caribbean shore to snow-capped peaks of more than 5,000 metres. Between the tenth and sixteenth centuries, they built there hundreds of villages and small towns, with terraces, stairways, canals and stone-paved paths, the most famous of which is Teyuna, the “Lost City”. Farmers, they grew maize, manioc and fruit on the slopes and traded with the coast. Their goldsmiths produced pendants, nose and lip ornaments, beads and figurines of gold and tumbaga. From 1525, the founding of Santa Marta by the Spanish opened a long period of conflict; the Tairona, defeated at the end of the sixteenth century, withdrew into the heights. Their descendants, the Kogi, the Arhuaco, the Wiwa and the Kankuamo, still live in the Sierra and maintain their traditions there."""
style = """
Tairona goldwork is recognised by its stocky human figures, crowned with enormous headdresses peopled with birds and spirals, and by the use of braided gold wire imitated in wax. Cast by the lost-wax method, often in tumbaga gilded at the surface, it ranks among the most inventive of ancient America, alongside that of the Muisca, the Quimbaya or the Sinú."""

[[artistes]]
nom = "Lakota"
vie = "Great Plains of North America (the Dakotas, Nebraska, Wyoming, Montana), 18th century – present"
biographie = """
The Lakota are the westernmost of the three great divisions of the nation that Europeans called Sioux, alongside the Dakota and the Nakota. Coming from the Great Lakes region, they settled in the Great Plains in the eighteenth century, adopted the horse and lived by hunting bison, following the herds. Organised in seven tribes, including the Oglala and the Sicangu, they made the Black Hills their sacred territory. In the nineteenth century, the advance of settlers, railways and the United States army drew them into a series of wars: under the leadership of chiefs such as Red Cloud, Sitting Bull and Crazy Horse, they won victories, among them that of Little Bighorn in 1876. But the destruction of the bison and the loss of the Black Hills forced them to live on reservations, where their religion and language were suppressed. In December 1890, the Wounded Knee massacre marked the end of this period. The Lakota today live mostly on the reservations of South and North Dakota, such as Pine Ridge and Standing Rock."""
style = """
Lakota art is first of all an art of clothing and everyday objects: painted hides, embroidery of porcupine quills and then of glass beads, with geometric motifs of lozenges, triangles and crosses. Women were its great artists; men painted accounts of their exploits on hides and shirts."""
