titre = "Russian Painting, from the Wanderers to the Silver Age"
artiste = "Repin, Aivazovsky, Surikov, Levitan, Vrubel, Serov…"
dates = "1850–1898"
accroche = "Virtual exhibition · Tretyakov Gallery, Moscow"
introduction = """
In the nineteenth century, Russian painting freed itself from the Imperial Academy: in 1870, the \
Wanderers founded a society of travelling exhibitions and painted the life of the people, \
the nation’s history and the Russian landscape, while at the end of the century the \
Abramtsevo circle opened the way to dreams and legends. The visit brings together nine painters, \
from Aivazovsky to Vrubel, in ten canvases from the Tretyakov Gallery in Moscow and the \
Russian Museum in Saint Petersburg. The building is inspired by the Tretyakov Gallery: one \
enters through a vestibule that evokes the façade designed by Viktor Vasnetsov, then follows \
a suite of tall rooms, from the great hall of the Wanderers to the hall of \
legends."""
vitrine = "bogatyrs.jpg"

[musee]
nom = "Tretyakov Gallery"
ville = "Moscow, Russia"
architecte = "Viktor Vasnetsov (façade)"
construction = "1902–1904 (façade)"
presentation = """
In 1856, Pavel Tretyakov, a wealthy Moscow textile merchant, bought his first \
paintings by contemporary Russian painters, with the idea of founding a national \
gallery. For forty years, he supported the Wanderers, commissioned portraits \
of writers and ceaselessly enlarged his house in the Zamoskvorechye district, south of the \
Kremlin, with rooms lit by skylights. In 1892, he gave the city of Moscow \
his collection and that of his brother Sergei; the municipal gallery opened to the public \
the following year. In the early twentieth century, the painter Viktor Vasnetsov designed the \
façade that made it famous: a gable in the shape of a kokoshnik, the headdress of Russian \
women, a bas-relief of Saint George, emblem of Moscow, and a frieze of colourful ornaments \
in the style of old Russian churches. The gallery today holds \
Russian art from icons to the early twentieth century; more recent art is displayed \
in a second building, on Krymsky Val."""
ici = """
The ARTEON building takes up the idea of the Tretyakov: a collector’s house \
turned into a suite of tall rooms. One enters from the south into Vasnetsov’s vestibule, \
with cream walls, then into the Hall of the Wanderers, the largest, nine metres high, with \
light ochre walls. To the west opens the room “The Sea and the Night,” \
with beige walls; to the east, the room “The Forest and the Plain,” in pale green. To the north \
of the latter, one ends with the room “The Abramtsevo Circle,” with powder-pink walls."""

