[[oeuvres]]
titre = "Barge Haulers on the Volga"
artiste = "Ilia Répine"
annee = "1870–1873"
image = "haleurs-volga.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Ilya_Repin_-_Barge_Haulers_on_the_Volga_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 131.5 × 281 cm"
collection = "Russian Museum, Saint Petersburg"
note = "Eleven men harnessed with leather straps pull a barge along the Volga: the canvas that made Repin famous at twenty-nine."
description = """
On a bank of yellow sand, at the edge of an immense, calm river, eleven men \
advance toward us, bent over, attached by leather straps to a long cable that \
links them to a sailing vessel. They form a single line, a kind of human frieze stretching \
from left to right. At the head, a bearded man with a rag tied around his forehead looks straight \
ahead with gravity. Behind him, a tall hauler smokes a pipe; others, beside \
him, lower their heads toward the sand. In the middle of the line, a young boy in a pink \
shirt, straighter than the others, pulls on his strap as if wanting to be rid of it. \
The last, head bowed, seems at the end of his strength. In the distance, under a clear sky, a \
steamboat leaves a thin plume of smoke."""
evocation = """
The painting shows the hardest labour in nineteenth-century Russia, that of the \
burlaks, day labourers who towed by sheer arm strength the barges going upstream \
against the current. Repin does not paint a speech: he portrays eleven individuals, from \
resignation to revolt, and each has his own character. The contrast between the dazzling \
light of summer and the men’s dejection makes their fate all the more striking. People have seen \
in the young man in pink, who straightens up, the image of a generation that refuses its \
condition, and in the little steamer on the horizon the announcement of the end of a trade that \
machines would replace. The work quickly became, in Russia as abroad, \
the emblem of a painting that looks the people in the face."""
histoire = """
In 1868, still a student at the Imperial Academy of Fine Arts, Repin caught sight on the \
Neva, near Saint Petersburg, of a team of haulers, whose wretchedness struck him amid \
strollers in summer dress. In the summer of 1870, he travelled down the Volga \
with the landscape painter Fyodor Vasilyev and stayed in the village of Shiryaevo, near \
Samara, where he drew the haulers, their faces and their rags. Grand Duke \
Vladimir Alexandrovich, brother of the future Alexander III, commissioned the canvas, completed \
in 1873. It was shown the same year at the Vienna World’s Fair, then at \
the Paris one in 1878. After the revolution, it entered the Russian Museum in \
Saint Petersburg."""
facture = """
Repin composes his picture like a bas-relief: the line of haulers occupies a horizontal \
band, and the eye travels along it from face to face. The ochre sand, the pale blue sky \
and the silvery water form a luminous background against which the brown, grey and red clothes stand out. \
The brushwork, precise on faces and hands, grows broader in the landscape. \
The many studies made on the Volga give each figure its truth of type and bearing."""
details = [
  "The leader of the line, with the face of a sage, whose gaze fixes the viewer.",
  "The young boy in the pink shirt, trying to loosen his strap.",
  "The pipe of the hauler walking just behind the first.",
  "The little steamboat and its smoke, on the horizon, at right.",
  "The wicker basket abandoned on the sand, in the foreground.",
]
themes = ["labour", "people", "Volga", "realism", "river"]
anecdote = """
The leader of the line had a known model: Kanin, a hauler whom Repin met on the \
Volga and who, according to the painter, was a former defrocked priest. In his memoirs, \
Repin tells how much this face, of profound wisdom, had struck him from their \
first meeting."""
salle = 2
mur = "sud"
place = 2
largeur = 2.8

[[oeuvres]]
titre = "Zaporozhian Cossacks Writing a Letter to the Turkish Sultan"
artiste = "Ilia Répine"
annee = "1880–1891"
image = "cosaques-zaporogues.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Repin_Cossacks.jpg"
technique = "Oil on canvas, 203 × 358 cm"
collection = "Russian Museum, Saint Petersburg"
note = "Gathered around a table, the Cossacks laughingly dictate an insult-filled reply to the sultan who had summoned them to submit."
description = """
Some twenty Cossacks crowd around a rustic table set in the open air, \
in a camp bristling with lances. At the centre, a young scribe in black, pen in \
hand, writes what the others dictate to him. Everyone is laughing, each in his own way: \
a giant in a red caftan and white cap holds his belly, a bald old man with a \
shaven skull leans forward, hilarious, another, bare-chested and seen from behind, leans on the table. \
The chief, wearing a fur cap, smokes his pipe with a mocking smile as \
he dictates the next sentence. In the foreground, seen from behind, a Cossack with a bare skull and \
another in a white coat, at right, close the scene. Everywhere lie weapons, \
sabres, rifles, a bandura."""
evocation = """
According to tradition, the Cossacks of the Zaporozhian Sich, a community of free \
warriors settled on the Dnieper, replied in 1676 to an ultimatum from the Ottoman \
sultan Mehmed IV with a letter larded with insults. The text, known from \
late copies, is probably apocryphal, but Repin sees in it the image of a joyous, insolent \
freedom. The painting is a study of laughter: it shows all its shades, from \
chuckle to guffaw. It also celebrates the fraternity of a community that \
recognizes no master but itself. The work has often been read as a hymn to \
the Cossacks’ spirit of independence, which Russian and Ukrainian \
memory now contest."""
histoire = """
Repin heard the text of the letter read in the late 1870s, in the circle of the \
patron Savva Mamontov. In 1880, he made a first sketch, then left in the summer for \
Ukraine with his young pupil Valentin Serov to draw types, costumes and \
weapons. The historian Dmytro Yavornytsky, a specialist on the Cossacks, advised him and \
posed for the scribe; General Mikhail Dragomirov lent his features to the chief, the ataman \
Ivan Sirko. After more than ten years of work, the canvas was completed in 1891. Tsar \
Alexander III bought it for 35,000 roubles, the largest sum paid until then for a \
Russian painting. A second version, begun in 1889, is in the art museum in \
Kharkiv."""
facture = """
The composition is built as a pyramid around the table, with the scribe at the centre \
and a ring of faces around him. Repin treats each head as a portrait. \
The white light of an overcast day unifies the scene, and the patches of bright colour, the \
red of a caftan, the blue of a jacket, the white of a coat, give rhythm to the crowd. The \
objects, weapons, pipes, caps, are painted from authentic pieces studied \
in museums and among collectors."""
details = [
  "The scribe at the centre, pen in hand, smiling as he writes.",
  "The chief smoking his pipe, chin raised, as he dictates.",
  "The giant in the red caftan and white cap holding his belly.",
  "The shaven skull, with its long lock of hair, of the bare-chested Cossack.",
  "The lances and standards rising into the white sky.",
]
themes = ["laughter", "Cossacks", "history", "freedom", "Ukraine"]
anecdote = """
The Cossacks’ letter inspired French poetry: Guillaume Apollinaire gave \
his own version, insults included, in The Song of the Ill-Beloved, published in the \
collection Alcools in 1913, under the title Reply of the Zaporozhian Cossacks to the Sultan of \
Constantinople."""
salle = 2
mur = "sud"
place = 4
largeur = 3.5

[[oeuvres]]
titre = "Boyarina Morozova"
artiste = "Vassili Sourikov"
annee = "1887"
image = "boyarine-morozova.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Surikov_Boyarynya_Morozova_gtg.jpg"
technique = "Oil on canvas, 304 × 587.5 cm"
collection = "Tretyakov Gallery, Moscow"
note = "Chained on a sledge, a noblewoman faithful to the old faith is carried through Moscow and raises two fingers in defiance."
description = """
In a snowy street in Moscow, a sledge crosses the crowd from left to right. A \
woman dressed in black sits on it, chained, her face pale and gaunt; she raises her \
right hand, two fingers stretched toward the sky. Around her, the crowd reacts: at \
left, a priest sneers, a boy runs beside the sledge laughing; at right, \
women in rich coats and embroidered shawls lower their eyes, weep or bow. \
An old beggar woman, kneeling, holds out her hand to her. In the foreground at right, a \
nearly naked holy fool, sitting barefoot in the snow, a chain around his neck, \
answers with the same two-finger gesture. In the background, one sees snow-covered roofs, \
domes and an icon on a façade."""
evocation = """
The painting evokes the schism that tore the Russian Church apart in the seventeenth century. Patriarch \
Nikon reformed the rites, and notably required making the sign of the cross with three fingers instead of \
two. Those who refused, the Old Believers, were persecuted. The boyarina Feodosia \
Morozova, one of the greatest ladies of the court, remained faithful to the old faith: \
arrested in 1671, she would die of hunger in 1675 in a pit of the prison at Borovsk. \
Surikov chooses not the torture but the moment when she passes before the people, and \
makes the crowd the real subject: mockery, fear, pity, admiration. The two-finger \
gesture, repeated by the holy fool, becomes a sign of resistance."""
histoire = """
Surikov heard in his childhood, in Krasnoyarsk, the story of Morozova’s life \
told by an aunt. He made a first sketch in 1881, then worked for several \
years, seeking in the streets of Moscow the faces of the crowd. For the boyarina, \
he took a long time to find the right face; he was inspired, it is said, by an \
Old Believer woman from the Urals and by a relative. He painted the snow from nature, \
studying the tracks of sledge runners. Presented in 1887 at the fifteenth \
exhibition of the Wanderers, the canvas created a sensation; Pavel Tretyakov bought it for his \
gallery, where it has since occupied an entire wall."""
facture = """
The canvas is very wide, and the sledge, which crosses it diagonally, draws the \
eye from left to right like the movement of the procession. Surikov places the black patch \
of the boyarina at the centre of a crowd of sumptuous colours: brocades, flowered shawls, \
furs, deep reds and blues. The snow is never white: it \
reflects blues, pinks, violets, observed in the open air. The painter alternates \
figures in profile, from the front and from behind to give the impression of a real \
crowd."""
details = [
  "The boyarina’s raised hand, two fingers outstretched.",
  "The holy fool sitting in the snow, barefoot, repeating her gesture.",
  "The sneering priest, at left, in his fur coat.",
  "The boy running beside the sledge, in the slush.",
  "The icon under its small canopy, on the façade, at upper right.",
]
themes = ["faith", "history", "crowd", "snow", "resistance"]
anecdote = """
Surikov used to say that the idea for the figure had come to him from a crow: he had \
once seen the bird perched on the snow, one wing spread, making a black patch that he \
could not forget for years, before finding it again in the boyarina in black on \
the snow."""
salle = 2
mur = "nord"
place = 3
largeur = 4.5

[[oeuvres]]
titre = "The Ninth Wave"
artiste = "Ivan Aïvazovski"
annee = "1850"
image = "neuvieme-vague.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hovhannes_Aivazovsky_-_The_Ninth_Wave_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 221 × 332 cm"
collection = "Russian Museum, Saint Petersburg"
note = "At daybreak, shipwreck survivors clinging to a mast face the strongest of the waves: the most famous seascape in Russian painting."
description = """
The night’s storm has just ended, but the sea is still raging. In the foreground, \
a few castaways cling to a piece of mast, all that remains of their ship. \
One of them waves a red cloth toward the sky. Before them, at left, an immense wave \
rises and begins to break, its crest covered with foam. Other waves, further \
off, roll toward the horizon. At the centre of the sky, the rising sun pierces the clouds and \
floods the scene with golden light, yellow, orange and pink. Its light passes through the \
waves, which turn green and transparent, and makes the surface of the \
water glitter. No coast is seen, no other boat: only the sea and the sky."""
evocation = """
Sailors believed that, in a storm, the ninth wave was the strongest and \
most fearsome: it is the one that threatens the castaways here. The painting contrasts the fury \
of the sea with the promise of light: the rising sun can be read as a \
sign of hope, and the men, tiny, do not give up. People have seen in it a Romantic \
meditation on man’s weakness and courage in the face of nature. The subject, the \
struggle of men against the elements, recurs throughout Aivazovsky’s work, \
who had himself known storms at sea and made the battle with the ocean the great \
theme of his life."""
histoire = """
Aivazovsky painted The Ninth Wave in 1850, when he was already the official painter \
of the Imperial Navy’s general staff and a much sought-after artist, whose large \
seascapes drew crowds to the exhibitions in Saint Petersburg. The painting was \
at once an immense success and Emperor Nicholas I acquired it for the imperial \
collections. It was first kept in the Hermitage museum, then passed in 1897 to \
the Russian Museum, which had just been created in Saint Petersburg to gather national \
art. It has remained one of its most popular works, reproduced in \
countless books and images."""
facture = """
Aivazovsky painted in the studio, from memory, and worked fast. He laid down thin \
transparent layers, which give the water its depth, then heightened the foam and reflections \
with small light touches. The light comes from the back of the picture, which makes the \
waves translucent and lights the figures from behind. The palette, very warm \
for a storm, moves from violet to emerald green and gold. The composition, with the \
sun at the centre and the great wave at left, recalls the shipwrecks of the Romantic \
painters."""
details = [
  "The red cloth that a castaway waves to call for help.",
  "The green transparency of the waves pierced by the sun.",
  "The foam flying from the crest of the great wave, at left.",
  "The ropes still floating around the broken mast.",
]
themes = ["sea", "storm", "shipwreck", "light", "hope"]
anecdote = """
Aivazovsky never painted the sea on the spot: he observed at length, then \
painted in the studio, from memory, convinced that the movement of waves and clouds cannot \
be copied. He is said to have produced some six thousand paintings over \
his lifetime."""
salle = 3
mur = "ouest"
place = 2
largeur = 3.3

[[oeuvres]]
titre = "Moonlit Night on the Dnieper"
artiste = "Arkhip Kouïndji"
annee = "1880"
image = "nuit-lune-dniepr.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Kuindzhi_Moonlit_night_on_the_Dnieper_1880_grm_x2.jpg"
technique = "Oil on canvas, 105 × 144 cm"
collection = "Russian Museum, Saint Petersburg"
note = "The full moon is reflected in the river: in 1880, the public queued to see this single painting shown in a darkened room."
description = """
Night covers almost the whole picture. At the top, amid dark clouds, the \
full moon shines with a pale green light and lights the edges of the clouds. Below, the \
Dnieper, broad and calm, crosses the canvas; the moon traces on it a long luminous reflection \
of phosphorescent green. On the bank, in the foreground, one can barely make out \
village huts and the silhouette of a small mill. All the rest, the land, the \
sky, the horizon, melts into shadow. No figure appears: nothing moves, \
only the light lives. Today, the canvas is much darker than originally, \
and one must come close to make out the details of the bank."""
evocation = """
Kuindzhi makes light the sole subject of his painting. The moonlight, so intense \
that it seems to emanate from the canvas, gives the Ukrainian landscape an almost \
magical dimension, between reality and dream. Contemporaries saw in it a tour de force, some \
a kind of marvel; others, painters above all, wondered whether the effect \
was not rather illusion than painting. People have also seen in it a meditation \
on the silence and immensity of the night, and a foretaste of the Symbolist explorations of \
the end of the century, where landscape becomes a state of mind. The Dnieper, river of the painter’s \
native Ukraine, takes on here a solemn grandeur."""
histoire = """
Kuindzhi completed the canvas in 1880, shortly after leaving the Wanderers, and decided to \
exhibit it alone, in Saint Petersburg, in a room of the Society for the Encouragement of \
Artists, on Bolshaya Morskaya Street. The windows were covered, and a beam of \
electric light lit the painting in the darkness. For weeks, a crowd \
queued in the street. Even before the exhibition, Grand Duke Konstantin \
Konstantinovich bought the canvas; he then took it with him on his sea voyages, and \
the salt air is said to have helped damage it. It later entered the Russian Museum."""
facture = """
Kuindzhi obtains his effect through contrast: large dark masses, almost \
uniform, and a few zones of very light, saturated colours, laid on in thick \
layers. He studied the properties of pigments and the effect of complementary \
colours, which he juxtaposed to make the moon’s green vibrate. But he also \
used bitumen, a brown pigment that darkens and cracks with time: \
it explains the painting’s present darkening."""
details = [
  "The moon, a small pale green disc, at the edge of a gap in the clouds.",
  "The moon’s reflection, a green streak, on the river.",
  "The silhouette of the small mill on the bank, in front of the reflection.",
  "The rooftops of the houses, barely visible in the shadow, at right.",
]
themes = ["night", "moon", "river", "light", "Ukraine"]
anecdote = """
In 1880, the light of the painting was so intense that visitors, convinced that a \
lamp was hidden behind it, went to look at the back of the canvas. Kuindzhi had \
used only paint, and a lighting directed on the picture in the \
darkened room."""
salle = 3
mur = "nord"
place = 2
largeur = 1.45

[[oeuvres]]
titre = "Morning in a Pine Forest"
artiste = "Ivan Chichkine"
annee = "1889"
image = "matin-foret-pins.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Shishkin,_Ivan_-_Morning_in_a_Pine_Forest.jpg"
technique = "Oil on canvas, 139 × 213 cm"
collection = "Tretyakov Gallery, Moscow"
note = "A she-bear and her cubs play on a fallen pine in the morning mist; the bears are by Konstantin Savitsky."
description = """
In a forest of tall pines, the early-morning mist lifts and the sunlight \
filters between the trunks, at upper right. At the centre, a pine broken by the storm has \
fallen across, its split trunk showing the pale wood. Four bears play \
around it: two cubs climb on the trunk, a third stands on its \
hind legs at right, on another broken branch, while the mother, below, \
keeps watch. In the foreground, the ground is covered with moss, grasses and roots. At \
left, the firs remain in a bluish shade; at right, the pine tops \
take on a golden colour. In the background, the trunks fade into the fog."""
evocation = """
The painting celebrates the Russian forest, immense, ancient, still wild, which Shishkin \
painted all his life and knew as a botanist. The scene of the bears adds a note \
of tenderness and almost of humour: nature is not only grand, it is \
alive and full of play. The morning, the mist, the rising light make the canvas \
a hymn to nature’s awakening. It is one of the most beloved and most \
reproduced paintings in Russia, so much so that one often forgets the gravity of the uprooted pine \
at the centre, which recalls the violence of storms and the cycle of life and death \
in the forest."""
histoire = """
Shishkin prepared the painting from studies made in the forests of the Tver region, \
around Lake Seliger. He entrusted the bears to his friend Konstantin Savitsky, a painter \
of genre scenes and animals, who had probably had the idea for this group. The \
painting was presented in 1889 at the seventeenth exhibition of the Wanderers with both \
signatures. Pavel Tretyakov bought it but, according to the account handed down, he had \
Savitsky’s signature erased, judging that the conception and most of the execution \
belonged to Shishkin. Since then, the work has been presented under Shishkin’s name alone, \
with a mention of Savitsky’s participation."""
facture = """
Shishkin paints with almost scientific precision the bark, needles, \
mosses and broken branches. He builds depth through the mist: the \
trunks in the background grow paler and bluer. The golden light, which enters diagonally \
from upper right, contrasts with the cold greens of the left. Savitsky’s \
bears, painted with a softer touch, blend into the whole through \
the harmony of the browns."""
details = [
  "The cub standing on its hind legs, at right, looking into the distance.",
  "The split trunk of the fallen pine, with its pale, jagged wood.",
  "The golden light that lights the pine tops, at upper right.",
  "The trunks in the background vanishing in the bluish mist.",
]
themes = ["forest", "bears", "morning", "mist", "nature"]
anecdote = """
In Russia, this painting is often called “The Three Bears,” though it shows \
four. Its popularity also owes something to a sweet: from the early twentieth century, a \
Moscow chocolate factory reproduced the bears on the wrapper of its candies, \
still sold today."""
salle = 4
mur = "est"
place = 2
largeur = 2.1

[[oeuvres]]
titre = "Above Eternal Peace"
artiste = "Isaac Levitan"
annee = "1894"
image = "repos-eternel.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Levitan_nad_vech_pok28.jpg"
technique = "Oil on canvas, 150 × 206 cm"
collection = "Tretyakov Gallery, Moscow"
note = "A small wooden church and a cemetery overlook an immense river under a stormy sky: Levitan’s most meditative landscape."
description = """
From the top of a green promontory, one looks out over an immense, silver-grey expanse of water \
stretching to the horizon. On the promontory, in the foreground at left, a \
small wooden church with a steep roof is surrounded by trees bent by the wind. A \
light shines in its window. Close by, one can make out the leaning crosses of an old \
cemetery, almost effaced in the grass. In the distance, a low, elongated island floats \
on the water, and flat shores are lost in the mist. The sky takes up more than \
half of the picture: heavy grey and white clouds pile up, a storm approaches, \
while a pale light still pierces through at left."""
evocation = """
The title states the meaning of the painting: above the cemetery, the “eternal peace,” \
unfold the immensity of water and sky, indifferent to the life of men. The \
tiny church, with its small light, is like a fragile human presence before \
the eternity of nature. People have seen in it a meditation on death, on the brevity of \
life and on solitude, themes that haunted Levitan, often melancholy and already \
ill with heart disease. The painter wrote to Pavel Tretyakov that he had put his whole self into it, \
his whole soul. It is the Russian landscape transformed into philosophical meditation, \
in the manner of a poem."""
histoire = """
Levitan painted the canvas in 1893–1894, after a summer spent on the shores of Lake Udomlya, in \
the province of Tver, whose landscape supplied him with the expanse of water. For the church, he \
reused a study made a few years earlier at Plyos, on the Volga, where he had \
stayed several summers: a small wooden church that he had painted in the evening \
light. The painting was shown in 1894 and Pavel Tretyakov bought it at once for his \
gallery, where it is still on display. Levitan, who was then going through a period of doubt \
and melancholy, considered it one of his most personal works."""
facture = """
Levitan simplifies the landscape into large masses: the green of the promontory, the silvery \
grey of the water, the cloudy sky. The elevated viewpoint and the horizon line \
placed in the middle give the impression of a limitless space. The brushwork, broad in \
the sky, grows finer in the trees stirred by the wind. The palette, almost \
monochrome, plays on shades of grey, green and white, which the \
church’s small light barely warms."""
details = [
  "The light shining in the window of the small church.",
  "The leaning crosses of the cemetery, at lower left.",
  "The trees bending in the wind, beside the church.",
  "The long, flat island, in the middle of the expanse of water.",
]
themes = ["landscape", "river", "death", "sky", "solitude"]
anecdote = """
Levitan was a close friend of the writer Anton Chekhov, whom he had met young, in \
the milieu of the Moscow art schools; Chekhov’s brother, Nikolai, was his \
fellow student. The two men shared the same vision of the melancholy of the \
Russian landscape."""
salle = 4
mur = "sud"
place = 2
largeur = 2.05

[[oeuvres]]
titre = "Bogatyrs"
artiste = "Viktor Vasnetsov"
annee = "1881–1898"
image = "bogatyrs.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Viktor_Vasnetsov_-_Богатыри_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 295.3 × 446 cm"
collection = "Tretyakov Gallery, Moscow"
note = "Three heroes of Russian legend stand guard at the frontiers: Dobrynya Nikitich, Ilya Muromets and Alyosha Popovich."
description = """
On a grassy steppe, under a cloudy sky, three armoured horsemen stand \
side by side, facing us. At the centre, on an enormous black horse, the eldest, Ilya \
Muromets, grey-bearded, shades his eyes with his hand to scan the horizon; a \
mace hangs from his wrist, and he holds a lance. At left, on a white horse with a flowing \
mane, Dobrynya Nikitich, with a long beard, is already drawing his sword and carries \
a red shield. At right, on a chestnut horse that lowers its head, the young Alyosha \
Popovich, beardless, holds his bow and arrows. The three warriors wear mail \
coats and pointed helmets. In the foreground, young firs rise from the grass."""
evocation = """
The bogatyrs are the heroes of the byliny, the epic songs of old Russia: they \
defend the Russian land against the nomads of the steppe. Vasnetsov shows them as \
sentinels, watching for the enemy at the edges of the country. The three figures embody \
complementary qualities: Ilya’s quiet strength and wisdom, Dobrynya’s nobility and \
courage, Alyosha’s skill and cunning. At a time when the Russian Empire \
was seeking its national roots, the painting became an image of Russia itself, \
solid and vigilant, rooted in its landscape. It has been reproduced endlessly, even \
in school books, and remains one of the most familiar images of Russian \
culture."""
histoire = """
Vasnetsov drew a first sketch of the painting in Paris, in 1876, while staying there \
with Repin and Vasily Polenov. He finished the large canvas only in 1898, \
after nearly twenty years of work, carried out mostly in Moscow, where he frequented the \
circle of the patron Savva Mamontov. Throughout those years, he studied ancient arms and \
costumes and looked for models. Pavel Tretyakov bought the work in 1898, \
the year of his death; it was one of his last acquisitions. It has remained \
since one of the gallery’s most famous works."""
facture = """
Vasnetsov gives his three horsemen a monumental presence: the low viewpoint, \
at the level of the grass, makes them stand out against the sky. The composition is \
symmetrical and stable, like an icon or an altarpiece, with Ilya at the centre. The arms and \
harnesses are painted with great precision, based on the study of ancient \
pieces. The palette, dominated by greens, greys and browns, is lifted by \
the red of the shield and the brilliance of the white horse."""
details = [
  "Ilya Muromets’s hand shading his eyes.",
  "The mace hanging from Ilya’s wrist.",
  "The sword that Dobrynya half draws from its scabbard.",
  "Alyosha’s chestnut horse lowering its head toward the grass.",
  "The young firs of the foreground, at the horses’ feet.",
]
themes = ["legend", "heroes", "horses", "Russia", "epic"]
anecdote = """
Vasnetsov gave his heroes the faces of people around him: Alyosha \
Popovich is said to have the features of Andrei Mamontov, son of the Abramtsevo patron, and \
Dobrynya to resemble the painter himself."""
salle = 5
mur = "nord"
place = 2
largeur = 4.4

[[oeuvres]]
titre = "Demon Seated"
artiste = "Mikhaïl Vroubel"
annee = "1890"
image = "demon-assis.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Mikhail_Vrubel_-_Демон_(сидящий)_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 114 × 211 cm"
collection = "Tretyakov Gallery, Moscow"
note = "Inspired by Lermontov’s poem, a pensive young giant sits in a garden of stone flowers at sunset."
description = """
A powerful young man, with abundant black hair, sits, his arms wrapped around \
his drawn-up knees, his hands clasped. His bare torso is muscular, but his face, \
turned to the side, is sad and absent. A blue cloth drapes his legs. He is so \
large that the top of his head extends beyond the frame. Around him, a strange garden of \
flowers with angular petals, like crystals or cut stones, pink, \
violet, grey and blue, covers the right of the picture. At left, the evening sky is \
purple, and clouds reddened by the sunset stretch above a line \
of gold on the horizon. All the space seems pressed against the figure."""
evocation = """
The painting is inspired by The Demon, the poem by Mikhail Lermontov: a fallen spirit, weary \
of a world he despises, falls in love with a Georgian princess. Vrubel wrote to \
his sister that his Demon is a spirit less malevolent than suffering and sad, yet \
powerful and majestic. He shows him young, beautiful, lost in his solitude, at once \
god and prisoner. This figure has often been compared to Vrubel himself, a misunderstood \
and tormented artist. The Demon became the great subject of his life: he returned to it in \
many works up to the Demon Downcast of 1902. This figure heralds Russian \
Symbolism and the Silver Age, in which art explores dreams and inner \
anxiety."""
histoire = """
In 1890, Vrubel, recently settled in Moscow and welcomed into the circle of the patron \
Savva Mamontov, received a commission for illustrations for an edition of Lermontov’s works, \
published in 1891 for the fiftieth anniversary of the poet’s death. His drawings \
for The Demon baffled critics, who judged them clumsy. Demon Seated, \
painted the same year, is the first large canvas he devoted to the subject. Long \
misunderstood, Vrubel was recognized only at the end of his life; the painting is today \
one of the highlights of the Tretyakov Gallery, which holds a vast body of his \
work."""
facture = """
Vrubel paints in facets, with the palette knife as much as the brush, with \
flat, angular touches that recall mosaic or stained glass. He had \
studied Byzantine mosaics in Kiev and Venice, and this influence can be seen in \
the crystalline flowers and the sky. The very tight framing cuts off the figure’s head \
and gives an impression of confinement. The colours, deep blues, violets, pinks, \
gold, create an unreal atmosphere of dusk."""
details = [
  "The top of the Demon’s head, cut off by the edge of the picture.",
  "The clasped hands, with interlaced fingers, beneath the knees.",
  "The angular flowers, as if cut from stone, at right.",
  "The golden line of the sunset, at left.",
]
themes = ["demon", "solitude", "poetry", "Symbolism", "dusk"]
anecdote = """
The Demon haunted Vrubel to the point of madness: in 1902, when his Demon Downcast was \
already on show in Saint Petersburg, he came each morning to retouch it before the public, \
changing its face and colours, shortly before his mental illness forced him to be \
institutionalized."""
salle = 5
mur = "ouest"
place = 2
largeur = 2.1

[[oeuvres]]
titre = "Girl with Peaches"
artiste = "Valentin Serov"
annee = "1887"
image = "jeune-fille-peches.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Valentin_Serov_-_Девочка_с_персиками._Портрет_В.С.Мамонтовой_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 91 × 85 cm"
collection = "Tretyakov Gallery, Moscow"
note = "Vera Mamontova, twelve years old, daughter of the patron Savva Mamontov, seated at the dining-room table at Abramtsevo."
description = """
In a bright dining room, a girl with brown hair, in a pink blouse \
tied with a black bow adorned with a red flower, sits at a table covered with a white \
cloth. She holds a peach in her hands and looks at the viewer with a \
serious, slightly sulky air. On the table before her lie three more peaches, \
yellowed maple leaves and a knife. Behind her, against the white wall, dark wooden \
chairs are lined up; a blue faience plate hangs on the \
wall, and a small colourful figurine stands on a piece of furniture. At right, through a large \
window, one glimpses the yellow foliage of late summer."""
evocation = """
The painting captures an ordinary moment and makes of it an image of happiness: youth, \
light, the freshness of a country house. Serov, who was then returning from Italy, \
wrote to his fiancée that he wanted to paint only what is joyful. He would say later \
that he had sought above all freshness, the kind one feels in nature and \
does not see in paintings. Vera’s direct gaze, at once childlike and \
grave, gives the portrait its life. The work is often considered a manifesto \
of a new painting, freer and more luminous, which opens the way to \
Russian Impressionism."""
histoire = """
Serov was twenty-two when he painted, in late summer 1887, the portrait of Vera \
Mamontova on the Abramtsevo estate, near Moscow, where he had spent part of \
his childhood. The estate belonged to Savva Mamontov, railway industrialist and \
great patron, who welcomed there Repin, Vasnetsov, Polenov, then Vrubel. Vera posed for \
long sessions in the dining room. Shown soon after in Moscow, the painting made \
the young painter known. It is today one of the best-known portraits in \
the Tretyakov Gallery."""
facture = """
Serov paints in full light, with a free, visible brushstroke reminiscent of the \
French Impressionists, but he keeps the solidity of drawing learned from Repin \
and Pavel Chistyakov. The light, coming from the window, slides over the tablecloth, the blouse \
and the face, and is coloured with reflections. The pink of the blouse, the white of the cloth and \
the yellow-green of the foliage form a clear harmony. The slightly off-centre framing \
gives an impression of naturalness."""
details = [
  "The peach Vera holds in her hands, set against the tablecloth.",
  "The red flower pinned on the black polka-dot bow of the blouse.",
  "The blue faience plate hanging on the wall, at upper left.",
  "The signature “Серов 87,” at lower right.",
  "The yellow foliage glimpsed through the window.",
]
themes = ["portrait", "childhood", "light", "Abramtsevo", "fruit"]
anecdote = """
Vera Mamontova married Alexander Samarin in 1903 and died of pneumonia in \
1907, at thirty-two. Serov, who had known her as a child at Abramtsevo, had painted her \
as the very image of youth."""
salle = 5
mur = "est"
place = 2
largeur = 1.0

[[artistes]]
nom = "Ilia Répine"
vie = "Chuhuiv (Ukraine), 5 August 1844 – Kuokkala (Finland), 29 September 1930"
biographie = """
The son of a military settler from the Kharkiv region, Ilya Repin first learned \
icon painting. In 1863, he left for Saint Petersburg and the following year entered \
the Imperial Academy of Fine Arts. Barge Haulers on the Volga made him famous in \
1873. A fellow of the Academy, he then stayed in Paris from 1873 to 1876, then \
joined in 1878 the Wanderers, the society of artists who wanted to show the life of the Russian \
people. Settled for a time in Moscow, he frequented the circle of Savva Mamontov at \
Abramtsevo. He painted history scenes, such as Ivan the Terrible and His Son (1885), \
scenes of contemporary life, such as They Did Not Expect Him, and many \
portraits, including those of Leo Tolstoy and Mussorgsky. A professor at the Academy from \
1894, he trained many pupils, among them Valentin Serov. In 1899, \
he settled in his house, the Penaty, at Kuokkala, on the Gulf of Finland. After \
the revolution, Finland became independent: Repin remained there and did not return to \
Soviet Russia. He died at Kuokkala in 1930."""
style = """
Repin is the greatest Russian realist painter. He excels at bringing a crowd to life, at \
giving each face its character and at capturing the emotion of a moment. His brushwork, \
vigorous and sure, his command of drawing and his dramatic sense make him the master \
of the Wanderers. He was held up as a model by Soviet art, but his influence \
goes beyond that framework: he remains the reference painter of nineteenth-century Russian life."""

[[artistes]]
nom = "Vassili Sourikov"
vie = "Krasnoyarsk, 24 January 1848 – Moscow, 19 March 1916"
biographie = """
Vasily Surikov was born in Krasnoyarsk, in Siberia, into a Cossack family \
settled there since the seventeenth century. Noticed for his talent as a draughtsman, he \
obtained the support of a wealthy merchant of the town, Pyotr Kuznetsov, who paid for his \
studies: in 1869 he entered the Imperial Academy of Fine Arts in Saint Petersburg. \
After taking part in the decoration of the Cathedral of Christ the Saviour in Moscow, he \
settled in that city, whose old architecture fascinated him. He then devoted himself \
to history painting: The Morning of the Execution of the Streltsy (1881), \
Menshikov in Berezovo (1883), Boyarina Morozova (1887). His wife’s death, in \
1888, plunged him into a deep crisis; he recovered in Siberia and painted The Taking \
of the Snow Fortress. Large compositions followed devoted to Yermak’s conquest of \
Siberia, to Suvorov’s crossing of the Alps and to Stepan Razin. A member of the \
Wanderers, he had become the great painter of Russian history. He died in Moscow in \
1916."""
style = """
Surikov invented a history painting in which the people play the leading role: his \
immense canvases are peopled with crowds in which each face was studied from \
life. He seeks less to illustrate an event than to make its collective drama \
felt. His sense of colour, rich and deep, and his art of composition, \
which organizes the chaos of a crowd, made him a model for Russian \
history painters."""

[[artistes]]
nom = "Ivan Aïvazovski"
vie = "Feodosia (Crimea), 29 July 1817 – Feodosia, 2 May 1900"
biographie = """
Ivan Aivazovsky was born in Feodosia, a port in Crimea, into a modest Armenian family. \
His gift for drawing was noticed very early, and patrons enabled him \
to enter in 1833 the Imperial Academy of Fine Arts in Saint Petersburg, in the \
landscape class. He left it with a gold medal that earned him a long stay in \
Italy, where his seascapes enjoyed great success. Back in Russia, he became in \
1844 painter to the Navy’s general staff. He then settled permanently in \
Feodosia, where he built a house, a studio and a gallery. He worked there without \
respite, travelling often in Europe, the East and even to America, in 1892. He \
devoted part of his fortune to his native town, where he notably financed \
the water supply. Showered with honours, he exhibited throughout Europe and produced \
thousands of paintings. He died in Feodosia in 1900, leaving an unfinished canvas on \
his easel."""
style = """
Aivazovsky is the great painter of the sea. He painted from memory, in the studio, \
storms, shipwrecks, naval battles and moonlit nights. His mastery of \
the transparency of water and of light, often spectacular, makes him an \
heir of Romanticism. Very popular, he fixed for a long time the image of the Russian \
navy."""

[[artistes]]
nom = "Arkhip Kouïndji"
vie = "Mariupol, 1841 or 1842 – Saint Petersburg, 24 July 1910"
biographie = """
Arkhip Kuindzhi was born in Mariupol, on the Sea of Azov, into a poor Greek family. \
Orphaned very young, he tended geese and worked for merchants. He trained \
almost entirely on his own in painting; according to his biographers, he went to Feodosia to seek \
Aivazovsky’s advice, without much success. After several failures, he became a \
free auditor at the Imperial Academy of Fine Arts in Saint Petersburg in the late \
1860s. He joined the Wanderers in 1875, then left them in 1880, the year \
of Moonlit Night on the Dnieper, which he exhibited alone. After a last exhibition in \
1882, he stopped showing his works for some twenty years, while \
continuing to paint. A professor at the Academy from 1894, he was dismissed in \
1897 for having supported protesting students. Among his pupils were \
Nicholas Roerich and Arkady Rylov. Having become rich, he created in 1909 a society of artists \
to which he bequeathed his fortune. He died in Saint Petersburg in 1910."""
style = """
Kuindzhi is the painter of effects of light: moonlight, sunsets, \
rays piercing a birch grove. He simplifies the landscape into large masses \
to make a few zones of intense colour burst forth. His research on pigments and \
complementary colours foreshadows the boldness of Symbolism and of decorative \
painting."""

[[artistes]]
nom = "Ivan Chichkine"
vie = "Yelabuga, 25 January 1832 – Saint Petersburg, 20 March 1898"
biographie = """
Ivan Shishkin was born in Yelabuga, on the Kama, into a merchant family. He studied \
at the Moscow School of Painting, then at the Imperial Academy of Fine Arts in \
Saint Petersburg, from 1856 to 1860. A scholarship enabled him to stay in Germany and \
Switzerland, notably in Düsseldorf, where he perfected his landscape painting and \
engraving. Back in Russia, he devoted himself almost exclusively to the forests and \
fields of his country. A founding member of the Wanderers in 1870, he exhibited regularly \
with them. He married the sister of the landscape painter Fyodor Vasilyev, who died a few years \
later, then remarried a pupil, the painter Olga Lagoda, whom he also lost. \
These bereavements marked him deeply. He headed the landscape studio of the Academy from \
1894. He died in 1898 in Saint Petersburg, in his studio, before his \
easel."""
style = """
Shishkin is the painter of the Russian forest, which he knew as a naturalist: he drew \
each tree, each fern, each stone with photographic precision. His \
large composed landscapes, in clear light, unite this exactness with an emotion \
before the immensity of nature. He deeply marked the image Russians \
have of their country."""

[[artistes]]
nom = "Isaac Levitan"
vie = "Kybartai (Lithuania), 30 August 1860 – Moscow, 4 August 1900"
biographie = """
Isaac Levitan was born into a poor Jewish family in Lithuania, then in the Russian \
Empire. In 1873, he entered the Moscow School of Painting, Sculpture and Architecture, \
where his teachers were Alexei Savrasov and Vasily Polenov. The death of his \
parents left him without resources; he lived in poverty during his studies. In 1879, \
Pavel Tretyakov bought one of his paintings, Autumn Day in Sokolniki. He became \
friends with Anton Chekhov and spent several summers on the Volga, at Plyos. In 1892, \
the expulsion of Jews from Moscow forced him to leave the city for a time. His great \
landscapes, such as The Vladimirka, Above Eternal Peace, March or Golden Autumn, \
made him famous. He was elected an academician in 1898 and taught landscape at the \
Moscow school. Ill with heart disease, he died at thirty-nine, in 1900."""
style = """
Levitan is the painter of the “mood landscape”: he seeks in the Russian countryside, \
often modest, a field, a road, a river, the expression of a feeling, from \
melancholy to joy. His free brushwork, his art of light and his simplicity made \
him the master of Russian landscape in the late nineteenth century."""

[[artistes]]
nom = "Viktor Vasnetsov"
vie = "Lopyal (Vyatka Governorate), 15 May 1848 – Moscow, 23 July 1926"
biographie = """
The son of a village priest, Viktor Vasnetsov studied at the Vyatka seminary, then \
gave up the priesthood and left in 1867 for Saint Petersburg, where he entered the Imperial \
Academy of Fine Arts. He first painted scenes of popular life and exhibited \
with the Wanderers. In 1876, he stayed in Paris, with Repin and Polenov. Settled in \
Moscow in 1878, he frequented the Abramtsevo estate, at Savva Mamontov’s, where he \
designed a small church and theatre sets. He then turned to the tales \
and legends of old Russia: After Igor’s Battle, Alyonushka, Ivan Tsarevich \
on the Grey Wolf, Bogatyrs. From 1885 to 1896, he decorated the Saint Vladimir \
Cathedral in Kiev. He also designed buildings, among them the façade of the Tretyakov Gallery and his \
own house-studio in Moscow, now a museum. He died in Moscow in 1926."""
style = """
Vasnetsov is the painter of Russian legends. He gives the heroes of the byliny and \
tales a monumental presence, with simple, symmetrical compositions drawn \
from icons. His taste for ancient ornament and folk art fed the \
Neo-Russian style in architecture and decoration, as well as the illustration of Russian \
tales."""

[[artistes]]
nom = "Mikhaïl Vroubel"
vie = "Omsk, 17 March 1856 – Saint Petersburg, 14 April 1910"
biographie = """
The son of a military jurist, Mikhail Vrubel studied law in \
Saint Petersburg before entering, in 1880, the Imperial Academy of Fine Arts, where \
he followed the teaching of Pavel Chistyakov. In 1884, he went to Kiev to restore and \
complete the medieval frescoes of Saint Cyril’s Church, and stayed in Venice to \
study Byzantine art. Settled in Moscow in 1889, he entered the circle of Savva \
Mamontov, for whom he created ceramics, opera sets and large panels. \
In 1896, he married the singer Nadezhda Zabela, whom he often painted. His works \
baffled critics, but the World of Art movement ended up defending him. The \
birth of his son Savva, in 1901, then his death in 1903, tried him severely. From \
1902, he suffered from serious mental disorders and spent his last years \
in clinics. Having gone blind in 1906, he died in Saint Petersburg in 1910."""
style = """
Vrubel invented a painting made of facets, like a mosaic or a crystal, in which \
colour vibrates in shards. Nourished by Byzantine art and legends, he created a world of \
dream inhabited by demons, princesses and fantastic creatures. He is the \
great forerunner of Russian Symbolism and the Silver Age."""

[[artistes]]
nom = "Valentin Serov"
vie = "Saint Petersburg, 19 January 1865 – Moscow, 5 December 1911"
biographie = """
Valentin Serov was the son of the composer Alexander Serov and of the composer \
Valentina Bergman. After his father’s death, in 1871, he travelled widely with his \
mother, to Munich and Paris, where he began drawing with Repin. He then followed \
his teacher to Moscow, then entered in 1880 the Imperial Academy of Fine Arts, in \
the studio of Pavel Chistyakov. A friend of the Mamontov family, he spent part of his \
youth at Abramtsevo, where he painted Girl with Peaches in 1887. He became the \
most sought-after portraitist in Russia, painting industrialists and \
artists as well as the imperial family. He taught at the Moscow School of Painting from 1897 \
to 1909 and took part in the World of Art movement. In 1905, after Bloody Sunday, \
he left the Academy in protest. In 1909 he designed the poster for the \
Ballets Russes featuring the dancer Anna Pavlova. He died in Moscow in 1911."""
style = """
Serov is the great Russian portraitist of his time. He combines the solidity of drawing \
learned from Repin with a free, luminous brushwork close to Impressionism. His \
portraits capture the character of his sitters, often with a discreet irony. \
In his last years, he moved toward a more synthetic and decorative manner."""
