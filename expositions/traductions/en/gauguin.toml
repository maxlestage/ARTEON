titre = "Gauguin, the Elsewhere in Colour"
artiste = "Paul Gauguin"
dates = "1848–1903"
accroche = "Virtual exhibition · Paul Gauguin"
introduction = """
From Pont-Aven to Tahiti, Gauguin leaves everything behind to find a freer kind of painting: flat areas of pure colour outlined in black, impossible reds and yellows, visions and myths. Nine canvases, from The Vision after the Sermon to his great testament, Where Do We Come From?"""
vitrine = "nafea.jpg"

[musee]
nom = "Ny Carlsberg Glyptotek"
ville = "Copenhagen, Denmark"
architecte = "Vilhelm Dahlerup"
construction = "opened in 1897"
presentation = """
The brewer Carl Jacobsen, heir to the Carlsberg beer fortune, collected ancient and French sculpture; he gave it to the public, and Copenhagen built him a museum facing the Tivoli Gardens. Vilhelm Dahlerup's building opened in 1897; Hack Kampmann enlarged it in 1906 and, in 1996, Henning Larsen added a wing for French painting. At the heart of the museum, the winter garden brings together palm trees and statues beneath a glass dome. The Glyptotek, which owes its name to sculpture, also holds a rich body of French painting and one of the most important Gauguin collections outside France. The painter had lived in Copenhagen in 1884–1885, with the family of his Danish wife, Mette Gad, and many canvases from his early years and from Tahiti remained in Denmark, where Mette sold them to raise their children."""
ici = """
ARTEON's building is only a simple evocation of it: three rooms in an enfilade, linked by corridors, with no drawn plan, following the painter's journey. Room I · Pont-Aven, with light beige walls, shows the Brittany of Synthetism. A corridor leads to Room II · The First Stay in Tahiti, the richest, with golden sand walls, then to Room III · The Testament, with pale green walls, where the great frieze of Where Do We Come From? closes the visit."""

