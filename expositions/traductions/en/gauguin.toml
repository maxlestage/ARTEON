technique = "Oil on canvas, 139 × 374.6 cm"
collection = "Museum of Fine Arts, Boston"
note = "His largest canvas, to be read from right to left: from birth to death. He intended it as his testament."
description = """
On a frieze nearly four metres long, a dozen figures unfold in a riverside landscape of blue-green tones. On the right, an infant sleeps on the ground, watched over by three crouching women. In the centre, a large standing figure, arms raised, picks a fruit. Further left, a child eats a fruit near two cats and a goat. Behind, a blue idol with raised arms dominates the left part. At the far left, an old woman curled up on herself holds her head in her hands; at her feet, a strange white bird holds a lizard. In the background, two figures draped in purple pass by in conversation. The two upper corners, golden yellow, bear the title at left and the signature at right."""
evocation = """
Gauguin wanted to sum up in it his thinking on the human condition. The canvas is read from right to left, like a life cycle: birth with the sleeping child, youth and maturity in the centre, with the fruit-picker evoking the tree of knowledge, then the resigned old age of the woman close to death. The idol would represent the beyond, and the white bird, according to Gauguin himself, the futility of vain words. The title, three unanswered questions, places the whole under the sign of anxiety rather than faith. The canvas mingles biblical references, Polynesian beliefs and memories: the old woman is inspired by a Peruvian mummy that Gauguin had seen in Paris."""
histoire = """
The year 1897 was the darkest of his life: he learned of the death of his favourite daughter, Aline, carried off at nineteen by pneumonia; he was ill, in debt, isolated at Punaauia. He painted this immense canvas at the end of the year, in about a month according to him, on a coarse jute canvas, and regarded it as his testament. In 1898, it left for Paris, where the dealer Ambroise Vollard showed it at the end of the year with eight related paintings. Bought afterwards by a Bordeaux collector, Gabriel Frizeau, it passed through other hands in France and then in the United States, before being acquired in 1936 by the Museum of Fine Arts in Boston, which has kept it since."""
facture = """
Gauguin treats the canvas like a fresco: the yellow corners imitate, he says, a mural damaged at the corners, and the thin, matte paint follows the coarse weave of the jute. The range is dominated by deep blues and greens, warmed by the coppery tones of the bodies. There is no single perspective: the figures, of different scales, are distributed in groups as on a bas-relief, linked by the curves of the landscape. The very elongated format forces the eye to travel across the work as one follows a story. Several figures take up characters from earlier canvases."""
details = [
  "The sleeping infant, at lower right, the beginning of the story.",
  "The central figure picking a fruit, arms raised.",
  "The blue idol with raised arms, on the left.",
  "The white bird holding a lizard, at the old woman's feet.",
  "The title painted in the yellow corner at upper left.",
]
themes = ["life", "death", "destiny", "spirituality", "tahiti"]
anecdote = """
Gauguin tells Daniel de Monfreid that after finishing the canvas, he went off into the mountains to swallow arsenic in order to die. The dose, too strong, made him vomit: he survived after a night of suffering."""
salle = 3
mur = "fond"
place = 2
largeur = 2.6

[[artistes]]
nom = "Paul Gauguin"
vie = "Paris, 7 June 1848 – Atuona (Hiva Oa, Marquesas Islands), 8 May 1903"
biographie = """
Born in Paris in 1848, Paul Gauguin spent his first years in Lima, Peru, with the family of his mother, daughter of the socialist and feminist activist Flora Tristan. Back in France, he joined the merchant navy, then the national navy. In 1871, he entered a stockbroker's firm in Paris and succeeded in finance; in 1873, he married a Dane, Mette Gad, who would give him five children. A Sunday painter, collector of the Impressionists, pupil and friend of Camille Pissarro, he took part in their exhibitions from 1879 to 1886. After the crash of 1882, he left the Bourse to devote himself to painting, at the cost of poverty and separation from his family, who remained in Copenhagen. He stayed at Pont-Aven from 1886, left in 1887 for Panama and Martinique with Charles Laval, then worked out Synthetism in Brittany with Émile Bernard. At the end of 1888, he spent two months at Arles with Van Gogh, a stay that ended in the drama of the severed ear. In 1891, he left for Tahiti, returned in 1893 to exhibit at Durand-Ruel without great success, then left again for good in 1895. Ill, in debt, in conflict with the colonial administration and the Catholic mission, he settled in 1901 in the Marquesas, at Atuona, where he died in 1903. The great retrospective at the Salon d'Automne of 1906 revealed the scale of his work."""
style = """
Gauguin broke with Impressionism, which he judged too attached to observation. He simplified forms, outlined them with dark contours and filled them with pure colours, laid in flat areas and chosen for their expressive force rather than their likeness: a dog may be red, a field vermilion. His canvases, nourished by Japanese prints, Breton folk art, and the arts of Java, Egypt or Polynesia, seek to express ideas, dreams and beliefs. A painter, but also a sculptor, ceramicist and woodcut artist, he opened the way for the Nabis, to whom Paul Sérusier passed on his lessons from 1888, for the Fauves, for Picasso and for the German Expressionists. His view of Polynesia and of the very young companions he took there is today the subject of a critical reappraisal."""
