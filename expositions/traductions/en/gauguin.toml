[[oeuvres]]
titre = "The Vision after the Sermon"
annee = "1888"
image = "vision-sermon.jpg"
technique = "Oil on canvas, 72.2 × 91 cm"
collection = "National Galleries of Scotland, Edinburgh"
note = "Breton women in white caps see Jacob wrestling with the angel, on an entirely red field."
description = """
In the foreground, a row of Breton women in starched white caps, seen from behind or in profile, lower their eyes or clasp their hands. Their prayer has just ended: the priest has read them the episode from Genesis in which Jacob wrestles all night with an angel. This struggle appears at upper right, small, on a field of uniform vermilion red, without horizon or shadow: the angel with golden-yellow wings and Jacob grapple like two wrestlers. An apple tree trunk cuts the canvas diagonally and separates the women's real world from the world of the vision. To the left of the trunk, a tiny cow crosses the red meadow. At the far right, cut off by the edge, appears the face of a priest with closed eyes."""
evocation = """
Gauguin no longer paints what he sees but what others imagine: he writes to Van Gogh that, for him, the landscape and the struggle exist only in the minds of the praying peasant women. The unreal red signals that we have left the visible world. It has been seen as the manifesto of a painting that prefers idea, dream and symbol to observation, what critics would soon call Symbolism. Brittany becomes there a land of simple, archaic faith, which Gauguin, coming from Paris, partly idealises. Some historians recognise his own features in the priest at the right edge, as if he were placing himself as officiant of this vision. Jacob's struggle with the angel has also been read as an image of the artist's struggle with his art."""
histoire = """
Gauguin painted the canvas at Pont-Aven in September 1888, shortly after the arrival of the young Émile Bernard, whose Breton Women in the Meadow, made of outlined flat areas, had struck him forcefully. The pardons, those Breton religious festivals where the parishioners gather in costume, provided his subject. Aware that he was at a turning point, he described its composition in a letter to Van Gogh, accompanied by a sketch. A few weeks later, in October, he left to join Vincent at Arles. The canvas, which the artist at first kept with him, then passed through several private collections before being bought in 1925 by the National Galleries of Scotland, in Edinburgh. There it has become one of the museum's most famous works and one of the founding images of modern art."""
facture = """
It is the first great example of Cloisonnism, or Synthetism: surfaces of pure colour, laid in flat areas and outlined with dark contours, like the lead of a stained-glass window or the partitions of an enamel. Perspective disappears: the red field rises like a wall, and the scale changes abruptly between the giant caps of the foreground and the miniature wrestlers. The diagonal trunk and the figures cut off by the frame come from Japanese prints, as does the pose of the wrestlers, which has been compared to Hokusai's sketchbooks. The caps, simplified into almost abstract shapes, pace the composition like white wings."""
details = [
  "The apple tree trunk crossing the canvas diagonally, between reality and vision.",
  "The little cow, to the left of the trunk, as if lost in the red field.",
  "The angel's yellow wings, the only golden note on the red.",
  "The profile of the priest with closed eyes, cut off by the right edge.",
  "The caps and the large white collars, drawn like cut-out shapes.",
]
themes = ["religion", "brittany", "vision", "synthetism", "japonisme"]
anecdote = """
Gauguin wanted to offer the painting to a church. With Émile Bernard and Charles Laval, he carried it to the one at Nizon, near Pont-Aven, but the rector refused it, no doubt disconcerted by this sacred subject treated in such a strange way."""
salle = 1
mur = "gauche"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Self-Portrait with Halo and Snake"
annee = "1889"
image = "autoportrait-aureole.jpg"
technique = "Oil on wood, 79.2 × 51.3 cm"
collection = "National Gallery of Art, Washington"
note = "Half saint, half devil: a halo, a snake and apples, painted on an inn cupboard door at Le Pouldu."
description = """
Gauguin's bust stands out against two large flat areas, one bright red, the other golden yellow. His face, in three-quarter view, has heavy eyelids and a sidelong glance, at once weary and mocking. Above his head floats a yellow halo, set askew like a hat. At upper left hang two red apples on a branch. Lower down, his hand holds a small snake between index and middle fingers, like a cigarette. At the bottom of the panel rise stylised green stems, ending in flowers, which undulate like arabesques. The head, the hand and the snake seem to float in a space without depth, with neither ground nor setting, like signs placed on a coloured surface."""
evocation = """
Gauguin portrays himself as a double being, at once saint and tempter: the halo of the elect on one side, the serpent and apples of Genesis on the other. One often reads in it a caricature of himself, half serious, half ironic: the master revered by the small circle of young painters around him in Brittany, and the seducer who mocks bourgeois morality. Historians also see in it the assertion of an artist who wants to stand apart, above the rules, almost a magus or prophet, at a time when Symbolism makes the artist a seer. The tone remains deliberately ambiguous, between provocation and confession. This double face announces the persona that Gauguin would cultivate all his life: that of the savage, the accursed and the chosen one at once."""
histoire = """
In autumn 1889, Gauguin settled at Le Pouldu, a small hamlet in Finistère more isolated than Pont-Aven, at the inn kept by Marie Henry. With the Dutch painter Jacob Meyer de Haan, who was then helping him financially, and other friends, he decorated its dining room. This self-portrait is painted on one of the doors of a cupboard; the other bears a portrait of Meyer de Haan, pensive, before a lamp and books. Marie Henry kept the panels after the painters left. The self-portrait later entered the collection of Chester Dale, a great New York collector, whose group of French paintings joined the National Gallery of Art in Washington in 1963, after his death."""
facture = """
The wooden panel is treated like a sign or a stained-glass window: two flat areas of frank colour, without modelling or depth, against which the forms stand out sharply. The sinuous contours of the stems, the hand and the snake create a decorative rhythm close to the Art Nouveau then being born. The face, on the contrary, keeps a slight modelling that makes it stand out. One recognises the influence of Japanese prints and popular imagery, which Gauguin and his friends admired for their simplicity. The tight framing and frontality also recall religious icons."""
details = [
  "The yellow halo, set at an angle like a hat.",
  "The small snake held between two fingers, like a cigarette.",
  "The two red apples hanging at upper left.",
  "The stylised green stems undulating at the bottom of the panel.",
]
themes = ["self-portrait", "religion", "temptation", "irony", "brittany"]
anecdote = """
In 1894, back from Tahiti, Gauguin wanted to recover the works left at the inn at Le Pouldu. Marie Henry refused to return them to him, and the painter lost the lawsuit he brought against her."""
salle = 1
mur = "droite"
place = 3
largeur = 0.85

[[oeuvres]]
titre = "Tahitian Women"
annee = "1891"
image = "femmes-tahiti.jpg"
technique = "Oil on canvas, 69 × 91.5 cm"
collection = "Musée d'Orsay, Paris"
note = "Two women seated on the sand, one in a pareo, the other in a pink dress: Polynesia as Gauguin discovers it."
description = """
Two young women sit on the sand, so close to the lower edge that they seem to fill the whole space. The one on the left wears a red pareo with white flowers; her head bent, her gaze lost, she leans on one hand. The one on the right wears a pink long-sleeved dress, of the kind imposed by the missionaries; she braids leaves, looking absent. Behind them, the golden sand gives way to a band of green sea, then to a line of white foam. No sky appears. The two figures, massive, almost sculpted, neither speak nor look at each other: each seems enclosed in her own reverie, in the still heat of an afternoon."""
evocation = """
Gauguin sought in Tahiti an intact world, far from industrial Europe. What he paints here is more ambiguous: one of the women wears the traditional pareo, the other the dress that came from the missions, a sign that colonisation has already transformed the island. The painting juxtaposes these two garments without comment. The stillness of the two women, their weary or dreamy air, have been read as the expression of the mystery and melancholy that Gauguin attributed to Tahitian women, a vision partly dreamed, nourished by reading such as Pierre Loti's The Marriage of Loti. Today, one also questions this European male gaze on colonised women, reduced to silent presences."""
histoire = """
Gauguin landed at Papeete in June 1891, with an unpaid official mission from the Ministry of Public Instruction. Disappointed by the colonial capital, too European for his taste, he settled in the autumn at Mataiea, on the island's south coast. This canvas is among the first he painted there. He took up its composition in 1892 in a second version, Parau api (What News?), now in Dresden. The Orsay canvas was given to the national museums in 1923 by the Vicomte Guy du Cholet. Exhibited at the Louvre, then at the Jeu de Paume museum devoted to Impressionism, it joined the Musée d'Orsay when it opened in 1986."""
facture = """
The composition rests on superimposed horizontal bands, sand, sea, foam, like a frieze. The two bodies, broad and sculptural, occupy almost the entire surface and are cut off by the bottom of the frame, which brings the viewer closer. Gauguin lays the colours in broad, barely modulated zones, but the modelling of the faces and arms, in coppery tones, is softer than at Pont-Aven. The pink of the dress, the red of the pareo and the green of the sea play on contrasts of complementary colours. The paint, often thin and matte, lets the weave of the canvas show through in places."""
details = [
  "The contrast of garments: pareo on the left, missionary dress on the right.",
  "The hands of the woman on the right, busy braiding.",
  "The line of white foam, at the top, closing the horizon.",
  "The closed faces, which do not turn towards each other.",
]
themes = ["tahiti", "women", "beach", "colonisation", "melancholy"]
anecdote = """
To pay for his journey, Gauguin put some thirty of his works up for sale at the Hôtel Drouot in February 1891. An enthusiastic article by Octave Mirbeau, published in the press, served as a preface to the catalogue."""
salle = 2
mur = "gauche"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Ia Orana Maria (Hail Mary)"
annee = "1891"
image = "ia-orana-maria.jpg"
technique = "Oil on canvas, 113.7 × 87.6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A Tahitian Annunciation: the Virgin and Child in a red pareo, haloed, among the fruit."
description = """
At the centre, a Tahitian woman dressed in a red pareo carries a naked little boy on her shoulder. Both have their heads ringed with a fine golden halo: they are the Virgin and Child. Behind them, two bare-chested women, girded with pareos, step forward, their hands joined before their chests, in a gesture of greeting. On the left, half hidden by a flowering shrub, an angel with yellow wings points out the mother and child to them. In the foreground, on a kind of wooden altar, fruit is piled up, including bananas, like an offering. The background is made of a path, hills, trees and palms, beneath a barely visible sky. At lower left, the painter inscribed the Tahitian title in capitals."""
evocation = """
The title is the Tahitian greeting “Ia ora na” addressed to Mary: the first words of the Ave Maria, those of the angel Gabriel. Gauguin thus transposes the Christian scene into the setting and with the faces of Tahiti. One has seen in it an echo of the Christianity brought by the missionaries, who profoundly transformed Polynesian society. One has also seen in it Gauguin's dear dream of a universal religion in which beliefs meet: the two praying women are borrowed from a Buddhist temple in Java. The work finally makes Polynesia an original paradise, where the sacred mingles effortlessly with daily life, fruit and light, in contrast to a Europe the painter judged corrupt."""
histoire = """
This is the first great canvas of the first Tahitian stay, painted at Mataiea between the end of 1891 and the beginning of 1892. Gauguin describes it proudly to his friend Daniel de Monfreid, detailing the angel, the two women, the Virgin and Child. Back in Paris, he showed it in November 1893 at the Durand-Ruel gallery, among his Tahitian works; critics were divided and sales disappointing. From collector to collector, the painting then reached New York, where it belonged to Sam A. Lewisohn, heir to a family of modern-art collectors. He bequeathed it to the Metropolitan Museum of Art in 1951, which has made it one of the masterpieces of its Post-Impressionist galleries."""
facture = """
Gauguin composes the canvas like an altarpiece, in superimposed registers: the still life in the foreground, the figures in the middle, the landscape at the top. The colours are saturated and laid in flat areas: the red of the Virgin's pareo answers the yellow of the wings and the deep green of the vegetation. The two praying women take up almost identically a relief from the temple of Borobudur, in Java, known from a photograph the painter had brought with him. The contours are sharp, the modelling of the bodies soft and coppery. The painted inscription, as on a sign or an icon, is part of the composition."""
details = [
  "The angel with yellow wings, almost hidden by the flowers on the left.",
  "The discreet haloes of the mother and child.",
  "The joined hands of the two women, a gesture borrowed from a Javanese relief.",
  "The fruit piled in the foreground, like an offering.",
  "The inscription “IA ORANA MARIA” at lower left.",
]
themes = ["religion", "tahiti", "motherhood", "syncretism", "offering"]
anecdote = """
Before choosing Tahiti, Gauguin had thought of Tonkin, where he requested a post in 1889, then of Madagascar. That same year, at the Exposition Universelle in Paris, he had been fascinated by the reconstructed Javanese village."""
salle = 2
mur = "droite"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Arearea (Joyousness)"
annee = "1892"
image = "arearea.jpg"
technique = "Oil on canvas, 75 × 94 cm"
collection = "Musée d'Orsay, Paris"
note = "A red dog in the foreground, a flute player, and in the distance women dancing before an idol."
description = """
In the foreground, two women sit at the foot of a large tree whose trunk crosses the canvas diagonally. One wears a white dress, the other a blue one; one plays a flute, the other stares at the viewer. In front of them, an orange-red dog, head lowered, sniffs the ground. The ground is made of broad areas of bright colour. Higher up in the canvas, in the middle distance, a few half-clad women dance or pray before a large statue of a deity, raised on a pedestal. The tree's foliage occupies the right side. No horizon, no sky: the scene rises towards the top of the picture like a stage set, and the eye passes from the dog to the musicians, then to the distant rite."""
evocation = """
The Tahitian title means “amusement” or “joyousness”: Gauguin paints a golden age in which people live to the rhythm of music, rest and rites. The flute and the dance evoke a time freed from work, the opposite of the industrial Europe he fled. This idyllic vision is partly invented: the old Polynesian religions had by then been largely erased by the missions, and the idol in the background is largely imaginary, composed from various sources. The painting thus speaks less of the reality of Tahiti than of the dream of a lost paradise, which Gauguin strives to revive through painting and myth."""
histoire = """
Gauguin painted the canvas in 1892 at Mataiea, in the heart of his first stay. Returning to France at the end of August 1893, ill and penniless, he staked everything on a large exhibition at Durand-Ruel in November, whose catalogue was prefaced by the poet Charles Morice. Arearea was among the works shown. The red dog provoked the mockery of visitors and critics, who saw in it the height of arbitrariness: a colour unrelated to nature. A few artists and enthusiasts, on the other hand, hailed the boldness of these canvases. After passing through several collections, the work entered the French national collections and now belongs to the Musée d'Orsay, in Paris."""
facture = """
Gauguin organises the canvas in planes stacked upwards, without perspective or horizon. Colours no longer describe nature, they build the image: the dog is red and the ground multicoloured because the composition demands it. These juxtaposed flat areas, outlined with supple contours, inherit the Synthetism of Pont-Aven but gain in softness and brilliance. The oblique trunk, which structures the surface, recalls Japanese prints. The paint is thin, laid on a coarse-weave canvas that gives the colour a matte look, close to fresco."""
details = [
  "The red dog in the foreground, which made visitors laugh in 1893.",
  "The flute held by one of the two seated women.",
  "The direct gaze of the second woman, turned towards us.",
  "The idol and the dancers, in the distance, at the top of the canvas.",
  "The tree trunk cutting the composition diagonally.",
]
themes = ["tahiti", "music", "paradise", "rite", "colour"]
anecdote = """
The Tahitian titles that Gauguin painted on his canvases often contain mistakes: he mastered the language only imperfectly. They nevertheless contributed to the intended effect, a mystery the Parisian public could not decipher."""
salle = 2
mur = "gauche"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Nafea Faa Ipoipo? (When Will You Marry?)"
annee = "1892"
image = "nafea.jpg"
technique = "Oil on canvas, 101 × 77 cm"
collection = "Private collection"
note = "Two young Tahitian women, one in a missionary dress, the other with a flower in her ear, before a yellow and green landscape."
description = """
Two young Tahitian women sit one behind the other in an open landscape. The one in the foreground, seated directly on the ground, wears a pareo and a light top, a white flower tucked behind her ear; her face is calm, almost impassive. Just behind her, the second, dressed in a pink high-necked, long-sleeved dress, typical of the missions, raises a hand in a gesture that looks like a warning or a question. Around them stretch fields of vivid yellow, greens and blues, a tree, mountains in the background and, in the distance, tiny silhouettes. The two figures, pressed against each other, form a single block in the foreground."""
evocation = """
The title poses a question, “When will you marry?”, to which the scene gives no clear answer. The flower worn at the ear has often been interpreted as the sign, in Tahiti, of a young girl in search of a husband, and the second woman's gesture as a warning or a piece of advice. The two women would embody two worlds: Polynesian tradition and Christian education. The painting thus speaks of marriage, youth and the future, but also of the island's transformation by colonisation. Their seriousness, almost grave, contradicts the gaiety one would expect from such a subject and gives the work a muted tension, between expectation and unease."""
histoire = """
Gauguin painted the canvas in Tahiti in 1892 and brought it back to France the following year; it was shown in the Durand-Ruel exhibition of November 1893. In the early twentieth century, it entered the collection of the Basel businessman Rudolf Staechelin. The family foundation lent it for nearly half a century to the Kunstmuseum in Basel, where it became one of the museum's flagship works. In 2015, the family sold it to a private buyer, said by the press to be Qatari, for a sum that places it among the most expensive paintings ever sold. After a last display in Basel, at the Fondation Beyeler, in a major Gauguin exhibition the same year, it left Switzerland and disappeared from public walls."""
facture = """
Gauguin superimposes the two figures into a single block, a frequent device in his Tahitian canvases, which gives the scene the stability of a bas-relief. The colours are laid in broad contrasting flat areas: the pink of the dress against the intense yellow of the field, the greens and blues of the background. The contours are supple, the modelling of the faces and arms reduced to a few coppery shades. Perspective is flattened: the landscape rises in bands towards the top of the canvas, and the distances are signalled only by the small size of the figures."""
details = [
  "The white flower tucked behind the ear of the young woman in the foreground.",
  "The raised hand of the woman in the pink dress, a gesture that has remained enigmatic.",
  "The Tahitian title painted on the canvas, with the signature and the date.",
  "The tiny silhouettes in the distance, in the fields.",
]
themes = ["tahiti", "marriage", "youth", "colonisation", "waiting"]
anecdote = """
The price of the 2015 sale remains shrouded in mystery: the press first announced it at around 300 million dollars, then court documents linked to a dispute reported an amount close to 210 million."""
salle = 2
mur = "droite"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Manaò tupapaú (The Spirit of the Dead Keeps Watch)"
annee = "1892"
image = "manao-tupapau.jpg"
technique = "Oil on canvas, 73 × 92 cm"
collection = "Buffalo AKG Art Museum"
note = "His young companion, frightened, lying in the dark: behind her, the spirit of the dead keeps watch."
description = """
A naked young woman lies on her stomach on a bed covered with a blue pareo and a light sheet. Her face turned towards us, her eyes wide open, she keeps her hands near her face, frozen with fear. On the left, behind the bed, a dark hooded figure stands in profile, with a large round eye: the spirit of the dead, the tupapau. The background, violet and midnight blue, is scattered with pale flowers, like sparks. The whole scene is bathed in a half-light in which the young woman's coppery body and the white of the sheet stand out. The reclining body occupies the whole width of the picture, parallel to the lower edge, while the spectre remains apart, motionless."""
evocation = """
Gauguin himself proposed a reading of the painting: the young woman's fear of the tupapau, spirits of the dead which the Tahitians believed wandered at night and which were kept at bay by leaving a lamp burning. The luminous flowers of the background would be the glimmers that signal their presence. The canvas thus unites the spirit of the living woman who imagines and the spirit of the dead who watches. It also takes up, reversing it, the pose of Manet's Olympia, making it a reflection on the European nude. Today, the work provokes unease: the model, Teha'amana, Gauguin's companion, was thirteen according to his own account, and this fear is now reread as that of an adolescent facing an adult man."""
histoire = """
According to Gauguin, the painting was born of an evening in 1892 at Mataiea: returning late from Papeete, he found his hut in darkness, the lamp out, and Teha'amana lying there, terrified. He recounts this scene and explains the construction of the canvas in a manuscript intended for his daughter, the Cahier pour Aline, then in Noa Noa, the account of his stay. He regarded it as one of his major works and showed it at the Durand-Ruel exhibition of 1893. He also made prints from it, a lithograph and woodcuts. After several owners, the canvas entered in 1965, with the collection of A. Conger Goodyear, the Albright-Knox Art Gallery in Buffalo, renamed the Buffalo AKG Art Museum in 2023."""
facture = """
Gauguin explains that he built the canvas on a dark harmony of violets, muted blues and oranges, to suggest night and dread: the “musical part” of the painting, in his words. The forms are simplified and outlined, the background treated like a flat tapestry in which the flowers float without depth. The figure of the spectre, stiff and in profile, recalls archaic sculptures, in contrast to the young woman's supple modelling. The light comes from no visible source: it seems to emanate from the sheet and the body."""
details = [
  "The large open eye of the spirit, on the left.",
  "The young woman's wide eyes, turned towards us.",
  "The pale flowers of the background, like glimmers in the night.",
  "The clenched hands near the face.",
]
themes = ["night", "fear", "spirits", "nude", "beliefs"]
anecdote = """
In his Self-Portrait with Hat, painted in Paris around 1893–1894 and kept at the Musée d'Orsay, Gauguin portrayed himself in front of Manaò tupapaú hanging on the wall of his studio. The canvas appears reversed there, because he was painting himself in a mirror."""
salle = 2
mur = "gauche"
place = 3
largeur = 1.4

[[oeuvres]]
titre = "The White Horse"
annee = "1898"
image = "cheval-blanc.jpg"
technique = "Oil on canvas, 140 × 91.5 cm"
collection = "Musée d'Orsay, Paris"
note = "A horse drinking, in a river where white turns green beneath the foliage: refused by the man who commissioned it."
description = """
In a clearing at the water's edge, a white horse, head lowered, drinks from a river. It occupies the bottom and centre of the canvas, its coat tinted with green and blue by the reflections of the foliage. Higher up, two naked riders ride bareback, one of them on a chestnut horse. All around, tropical vegetation invades everything: trunks, foliage, flowers, and a long branch that winds across the top of the composition. The water itself is covered with arbitrary colours that are no longer realistic. The sky does not appear: the composition, very vertical, closes on this peaceful scene like an enclosed garden. No sound seems to disturb this suspended moment, where men and animals share the coolness of the undergrowth."""
evocation = """
At first sight, it is a scene of daily life, a moment of coolness and silence. But the horse, isolated and luminous, takes on an almost supernatural presence: it has been linked to Polynesian beliefs associating the white horse with the sacred, even with the world of the dead, without knowing whether Gauguin was thinking of this. Painted shortly after the great canvas Where Do We Come From?, in a period of illness and despair, the painting offers a peaceful vision of harmony between man, animal and nature, a paradise the painter could scarcely find any more in his life. It also asserts the freedom of colour: white can become green if the eye and the composition demand it."""
histoire = """
In 1898, Gauguin was living at Punaauia, on Tahiti's west coast, ill and riddled with debts; to survive, he accepted a job as a draughtsman in the Public Works department in Papeete. A pharmacist in the town then commissioned a painting from him, but the deal fell through. Gauguin shipped the canvas to France to his friend the painter Daniel de Monfreid, who received his shipments, kept his works and sought buyers for him. The canvas remained for a long time with Monfreid, who finally ceded it to the French state in 1927. It thus entered the national collections and, after the Louvre, joined the Musée d'Orsay when it opened in 1986."""
facture = """
The vertical format and the plunging viewpoint, which removes the sky and the horizon, come from Japanese prints, which Gauguin admired and collected. The composition is built in arabesques: the sinuous branch at the top, the curve of the horse's neck, the outlines of the riders. The colours are freed from any description: the horse's white takes on green and blue, the water adorns itself with unexpected tones. The thin paint lets the texture of the canvas play. The riders have been compared to the Parthenon frieze, of which Gauguin owned reproductions."""
details = [
  "The green and blue reflections on the horse's white coat.",
  "The naked rider on his chestnut horse, at the top of the canvas.",
  "The branch winding at the top, like a liana.",
  "The total absence of sky and horizon.",
]
themes = ["horse", "river", "nature", "colour", "japonisme"]
anecdote = """
The Papeete pharmacist who had commissioned the canvas, Ambroise Millaud, refused it: he found the horse too green. It was this refusal that led Gauguin to send it to France."""
salle = 3
mur = "gauche"
place = 1
largeur = 1.1

