[exposition]
ordre = 158
nom_court = "Posters & Comics"
mouvement = "Posters, Prints and Comics"
cadre = "estampe"
couleur = "#a3352b"
titre = "The Printed Image, from Engraving to Poster and Comic Strip"
artiste = "Hogarth, Goya, Hokusai, Töpffer, Tenniel, Doré, Chéret, Steinlen, McCay…"
dates = "1751–1916"
accroche = "Virtual Exhibition · Forney Library, Hôtel de Sens, Paris"
introduction = """
Before cinema and television, the great popular image was printed: an engraving \
sold for a shilling, an illustrated book, a Sunday newspaper page, a poster pasted on \
the walls of the city. The visit follows this history from 1751 to 1916, from the engraved \
satires of Hogarth and Goya to the posters of Chéret, Steinlen and Cappiello, by way of \
Hokusai's sketchbooks, Töpffer's first picture stories, \
Tenniel's Alice and Winsor McCay's Little Nemo. The building is inspired by the Hôtel \
de Sens, the Gothic mansion in the Marais in Paris that houses the Forney Library and its \
collection of posters: a porch, a great hall, a square tower, a library \
and a cabinet. The prints and book pages, often small, are shown here \
enlarged."""
vitrine = "tournee-chat-noir.jpg"

[musee]
nom = "Hôtel de Sens · Bibliothèque Forney"
ville = "Paris, France"
construction = "Late 15th and early 16th century; Forney Library since 1961"
presentation = """
Until 1622, Paris came under the archbishopric of Sens, in Burgundy. To house its \
archbishops during their stays in the capital, Archbishop Tristan de Salazar \
had this mansion built, from the end of the 15th century, on the edge of the Marais, near the \
Seine. It is one of the few great medieval residences preserved in Paris: a \
pointed-arch porch between two turrets, steep roofs, ornate dormer windows, \
a square tower housing the spiral staircase. Queen Margot lived here in 1605 and 1606. \
Later occupied by craftsmen and shops, the building was bought by the City \
of Paris in 1911 and extensively restored. Since 1961, it has housed the Forney \
Library, founded in 1886 thanks to a bequest from the industrialist Samuel-Aimé Forney for the \
craftsmen of the Faubourg Saint-Antoine. Devoted to the decorative arts, the crafts \
and the graphic arts, it holds one of the most important public collections \
of posters in France. On the façade, a cannonball remains embedded, with the date \
of 28 July 1830."""
ici = """
ARTEON's building borrows from the Hôtel de Sens its porch, its square tower and its walls \
of pale stone. One enters from the south into “The Porch,” which opens onto “The Great \
Hall · The Poster,” sixteen metres long and eight high, where the posters face \
each other on the north and south walls. To the west, “The Tower · Satire and Nightmares,” square \
and nine metres high, gathers the engravings. To the north, “The Library · The Illustrated \
Book”; to the east, “The Cabinet · Line and Panel,” lower and more intimate, \
ends the visit."""

