[[oeuvres]]
titre = "Thermogène Generates Heat"
artiste = "Leonetto Cappiello"
annee = "1909"
image = "thermogene.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Leonetto_Cappiello_-_Thermogène_warms_you_up_-_Google_Art_Project.jpg"
technique = "Colour lithograph, 159.5 × 114.5 cm"
collection = "Poster Museum at Wilanów, National Museum in Warsaw"
note = "A pierrot spits fire while clutching a ball of cotton wool: to sell a remedy, Cappiello invents a figure one never forgets."
description = """
Against a plain black ground, a strange character advances with a dancing step, one leg \
thrown back. He wears a brilliant green leotard, with blue highlights, white \
gloves, and has a pallid, bald clown's head, his mouth wide open. From \
this mouth shoots upward a great orange and yellow flame. Against his \
chest, he clasps with both arms a big pink, downy cloud. The text occupies the \
edges of the poster in capital letters: at the top, in yellow, “Le Thermogène,” then, \
in red, “engendre la chaleur”; on the right, “et guérit :” ; at the bottom, in red, “toux, \
rhumatismes, points de côté, etc.” (cough, rheumatism, stitches in the side, etc.). Cappiello's signature, drawn in green, \
is on the left, at knee height."""
evocation = """
Thermogène was a medicated cotton wool, impregnated with a product that warms the skin, \
which was applied to the chest or back against colds and aches. \
Rather than showing the product or a sick person, Cappiello invents an absurd and \
unforgettable image: a pierrot so hot that he spits fire, hugging his cotton wool \
like a treasure. The idea is simple and reads in one second, even from a streetcar. \
This is the principle of the modern poster, which Cappiello established in the early 20th century: \
a single figure, striking, often funny, associated forever with a brand. The \
Thermogène pierrot in fact served as the product's emblem for decades, \
even on its packaging."""
histoire = """
Born in Livorno, Leonetto Cappiello arrived in Paris in 1898 and first made his name there \
as a caricaturist, notably in Le Rire. He drew his first poster in 1899 and \
soon worked under contract with the printer Pierre Vercasson, whose stamp \
appears on this poster. Thermogène was commissioned from him in 1909; the poster was printed \
in many copies and reprinted, with variations in text and format. \
It immediately ranked among his most famous images, along with the Chocolat Klaus of \
1903 or the Cinzano of 1910. This copy belongs to the Poster Museum at \
Wilanów, near Warsaw, part of the National Museum in Warsaw: opened in 1968, \
it is often presented as the first museum in the world devoted entirely to \
the poster."""
facture = """
Cappiello breaks with Art Nouveau posters laden with ornament. He sets a single \
vividly coloured figure against a black ground that makes it leap out, like an actor in \
the spotlight. The acid green of the leotard, with its blue highlights, contrasts with \
the orange of the flames and the pink of the cotton wool: opposing colours, chosen to \
be seen from afar. The drawing, coming from caricature, is supple and quick, and the \
movement of the figure, one leg thrown back, gives the impression that it \
is striding across the poster. The text is relegated to the edges, in plain, \
legible capitals."""
details = [
  "The flame shooting from the pierrot's open mouth.",
  "The blue highlights that model the green leotard.",
  "The printer Vercasson's small round blue stamp, on the right, on the black ground.",
  "Cappiello's signature, drawn in green on the left.",
]
themes = ["advertising", "humour", "colour", "remedy", "poster"]
anecdote = """
Before designing posters, Cappiello had made himself famous in Paris with an album \
of caricatures, Nos actrices, published in 1899, in which he sketched with an affectionate \
drollery the stars of the Parisian stage."""
salle = 2
mur = "sud"
place = 1
largeur = 1.15

[[oeuvres]]
titre = "On les aura! (We'll Get Them!), Second National Defence Loan"
artiste = "Abel Faivre"
annee = "1916"
image = "on-les-aura.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:2e_Emprunt_de_la_Défense_nationale._Souscrivez_(1916)_On_les_aura_!_-_affiche_-_Abel_Faivre_-_btv1b9013991f.jpg"
technique = "Colour lithograph, approximately 120 × 80 cm, printed by Devambez, Paris"
collection = "Bibliothèque nationale de France, Paris"
note = "A young helmeted soldier charges forward, arm raised, shouting “On les aura!”: the most famous poster of the Great War in France."
description = """
A young French soldier, seen at half length, bursts from the left edge of the poster. He wears \
the steel helmet and greatcoat of the poilus, grips his rifle in one hand, the barrel pointed \
forward, and raises the other arm very high, the hand wide open, as if to rally \
his comrades. His face, turned sideways, is open in a shout; his \
wide eyes shine with enthusiasm. The background remains almost empty, a pale beige. At \
upper left, drawn by hand like spontaneous writing: “On les aura !” At \
lower right, in capital letters, “2ᵉ Emprunt de la Défense nationale” (Second National Defence Loan), and, in \
large slanting script, “Souscrivez” (Subscribe). At the very bottom, in small type, the name of \
the printer Devambez, in Paris."""
evocation = """
“Courage! On les aura!” (Courage! We'll get them!): the phrase concludes an order of the day from General Pétain \
to the defenders of Verdun, on 10 April 1916, and immediately became a \
national watchword. Faivre takes it up for a poster that shows neither the enemy nor death, \
only the dash and confidence of a very young soldier. The message is twofold: \
to support the fighters, and to subscribe to the loan, that is, to lend one's money to \
the State to finance the war. The poster makes every saver a fighter on the \
home front. This heroic, almost smiling face contrasts with the reality of Verdun, \
where hundreds of thousands of men were killed or wounded in 1916: it is an image \
of propaganda, designed to sustain the country's morale."""
histoire = """
To pay for a war far longer and more costly than expected, the French State \
launched several large loans from private individuals. The second National \
Defence Loan was opened in the autumn of 1916. As for the first, a vast \
poster campaign accompanied it: images were requested from well-known artists, and \
their posters were plastered across France. Abel Faivre, a noted caricaturist, \
had already drawn in 1915 a poster calling on the French to deposit their gold \
at the Banque de France, in which a Gallic cockerel strikes down a German soldier. This one, \
printed by the Devambez house, met with considerable success and remains the \
best-known image of French propaganda of the war. This copy is held in the \
Prints department of the Bibliothèque nationale de France."""
facture = """
Faivre, a press illustrator, works here like a painter: the soldier is modelled \
in lithographic crayon, with vigorous hatching and deep blacks, in \
a sober range of browns, greys and beige, barely enhanced with colour on the \
face and hands. The figure, cut off by the left edge and thrown on the diagonal, \
seems to emerge from the poster toward the viewer. The raised arm and the rifle form two \
diagonals that give the momentum. The hand-drawn text, “On les aura !” and \
“Souscrivez,” gives the impression of spontaneous speech, while the name of \
the loan is set in official capitals."""
details = [
  "The raised hand, fingers spread, which seems to call to the other soldiers.",
  "The light sleeve rolled up at the wrist of the raised arm.",
  "The flourish of “Souscrivez,” which dives toward the bottom of the poster.",
  "The name of the printer Devambez, very small, at the foot of the poster.",
]
themes = ["war", "propaganda", "Verdun", "patriotism", "poster"]
anecdote = """
The steel helmet worn by the soldier, the Adrian helmet, was issued to \
French troops only from the autumn of 1915: at the start of the war, infantrymen \
went into battle in kepis and madder-red trousers."""
salle = 2
mur = "sud"
place = 4
largeur = 0.9

[[artistes]]
nom = "William Hogarth"
vie = "London, 10 November 1697 – London, 26 October 1764"
biographie = """
The son of a schoolmaster who tried to open a coffee house where only Latin would be spoken and \
ended up imprisoned for debt, William Hogarth grew up in London in straitened circumstances. Apprenticed \
to a silver engraver, he set up on his own around 1720 as an engraver, then \
learned painting. In 1729, he secretly married the daughter of the painter James Thornhill. \
Success came in 1732 with A Harlot's Progress, a series of six paintings \
which he engraved and sold himself by subscription: these are his “modern moral subjects.” \
There followed A Rake's Progress, Marriage A-la-Mode, Industry and Idleness, \
then Gin Lane and Beer Street. To protect his prints from copying, he obtained in \
1735 a law on engravers' rights. A noted portraitist, he was also one of the \
governors of the Foundling Hospital in London, which he made one of the \
first places where the public could see works by English artists. In 1753, he \
published a treatise, The Analysis of Beauty, and in 1757 became Sergeant Painter to the King. \
He died in London in 1764."""
style = """
Hogarth invented serial satire: stories in several images, to be read in \
order, full of details, signs and inscriptions that comment on the action. He \
blends in caricature, theatre and moral sermon. A popular engraver as much as a \
painter, he gave English the adjective “Hogarthian” and opened the way for \
English caricaturists, from Gillray to Cruikshank, and then for the picture stories of the 19th \
century."""

[[artistes]]
nom = "Francisco de Goya"
vie = "Fuendetodos (Aragon), 30 March 1746 – Bordeaux, 16 April 1828"
biographie = """
The son of a gilder, Francisco de Goya trained in Zaragoza, failed twice the competition \
of the Royal Academy in Madrid, then travelled to Italy. Settled in Madrid in 1775, he \
painted for the Royal Tapestry Factory cartoons full of popular life, \
which made him known. A member of the Academy of San Fernando in 1780, painter to the king in \
1786, he became the portraitist of the court and the enlightened aristocracy. In \
1792–1793, a serious illness left him completely deaf. He then turned to \
more personal works: the Caprichos appeared in 1799, the year he was named \
First Court Painter. The French invasion and the War of Independence, from \
1808, inspired him to make the Disasters of War and the paintings of the Second and \
Third of May 1808. Withdrawn into his house, the Quinta del Sordo, he covered its walls \
with the Black Paintings. Uneasy at the return of absolutism under Ferdinand VII, he \
went into exile in 1824 in Bordeaux, where he still practised lithography, and died there in 1828."""
style = """
Goya moves from the bright, graceful scenes of his youth to a painting that grows \
ever freer, darker and more visionary. A printmaker of genius, he makes of etching and \
aquatint a means of expressing the satire, violence and nightmares of his time, \
embellishing nothing. His printed series, from the Caprichos to the Disasters of War, \
marked Delacroix, Manet, the Romantics and the Surrealists; he is often held \
to be the first of the modern painters."""

[[artistes]]
nom = "Katsushika Hokusai"
vie = "Edo (now Tokyo), 1760 – Edo, 10 May 1849"
biographie = """
Born in a craftsmen's district of Edo, Hokusai learned woodblock carving very young, \
then entered around 1778 the studio of the painter Katsukawa Shunshō, a specialist in \
actor portraits. He broke away and explored every school, Japanese, \
Chinese and even Western, whose perspective he studied. Over his long \
life, he changed his artist's name more than thirty times and moved, it is said, more than \
ninety times. He illustrated novels, designed surimono, those luxury prints given at \
New Year, and published model books, including the Manga from \
1814. Around 1830–1832, at over seventy, he had his greatest success \
with the Thirty-six Views of Mount Fuji, which includes the Great Wave. He continued with \
series of waterfalls, bridges and flowers, then devoted himself mainly to painting. \
Poor to the end, helped by his daughter Ōi, herself a painter, he died at \
eighty-eight, regretting, it is said, that he had not had a few more \
years to become a true painter."""
style = """
Hokusai is an insatiable draughtsman, capable of depicting everything: the wave and the \
drop of water, the ghost and the craftsman, the mountain and the insect. His lively line, his \
sense of movement and his bold framing, nourished by Western perspective, \
renewed the Japanese print. Discovered in Europe in the mid-19th century, he \
became the great figure of Japonisme and influenced Degas, Van Gogh, Monet and the \
Art Nouveau artists."""

[[artistes]]
nom = "Rodolphe Töpffer"
vie = "Geneva, 31 January 1799 – Geneva, 8 June 1846"
biographie = """
The son of the Genevan painter Wolfgang-Adam Töpffer, Rodolphe at first wanted to become a painter \
in his turn, but an eye disease obliged him to give it up. He turned to \
letters, stayed in Paris to study, then in 1824 opened in Geneva a boarding school for \
boys, which he ran with his wife. To entertain his pupils, he drew comic \
stories, and took them each year on walking excursions in the Alps: he \
made from these illustrated accounts, the Voyages en zigzag. In 1832, he became professor of \
rhetoric and belles-lettres at the Academy of Geneva. Encouraged by Goethe, who had \
admired his albums, he published from 1833 his stories in prints: Monsieur \
Jabot, Monsieur Crépin, Monsieur Vieux Bois, Monsieur Pencil, Doctor Festus, \
Monsieur Cryptogame. He also wrote short stories, collected under the title Nouvelles \
genevoises, and essays on art, including an Essai de physiognomonie devoted to his \
way of drawing. A conservative in politics, he sat on the Representative Council of \
Geneva. In poor health, he died at forty-seven."""
style = """
Töpffer invented what he called “literature in prints”: a story \
told by a sequence of drawings, each accompanied by a caption, in which meaning arises from \
the sequence. His quick and deliberately clumsy line favours expression \
and movement. He reflected as a theorist on this new language, and many \
historians today consider him the father of the comic strip."""

[[artistes]]
nom = "John Tenniel"
vie = "London, 28 February 1820 – London, 25 February 1914"
biographie = """
The son of a fencing and dancing master of Huguenot descent, John Tenniel taught himself in \
large part, by copying the antique sculptures in the British Museum. At twenty, \
he lost the sight of one eye almost entirely in a fencing accident. He exhibited very \
early at the Royal Academy and, in 1845, won a prize in the competition for the decoration of the \
new Palace of Westminster, where he later painted a fresco. In 1850, he joined \
Punch, the great London satirical weekly; after the death of John Leech in \
1864, he became its principal political cartoonist and published there over half a \
century more than two thousand drawings, including “Dropping the Pilot,” in 1890, on the \
dismissal of Bismarck. A sought-after illustrator, he drew for Aesop's Fables and for \
Thomas Moore's Lalla Rookh, but it was Alice's Adventures in Wonderland, in 1865, then \
Through the Looking-Glass, in 1871, that assured him lasting fame. Knighted in \
1893, he retired in 1901 and died in London shortly before his \
ninety-fourth birthday."""
style = """
Tenniel has a precise, almost sculptural drawing style, inherited from the study of the antique, put at the \
service of humour. His characters, firmly set down, with strongly \
characterised faces, come from political caricature. His illustrations for Lewis \
Carroll fixed forever the appearance of Alice, the Hatter or the Cheshire \
Cat: almost all the adaptations that followed are inspired by them."""

[[artistes]]
nom = "Gustave Doré"
vie = "Strasbourg, 6 January 1832 – Paris, 23 January 1883"
biographie = """
A child prodigy, Gustave Doré drew from his earliest age. At fifteen, passing through \
Paris with his parents, he obtained a contract from the publisher Charles Philipon and \
published the same year an album of caricatures, Les Travaux d'Hercule. He contributed to the \
Journal pour rire and, in 1854, published the Histoire de la Sainte Russie, a satire in \
pictures often counted among the ancestors of the comic strip. He then threw himself \
into illustrating the great texts: Rabelais, Balzac's Contes drolatiques, \
Dante's Inferno in 1861, Perrault's Tales, Don Quixote, the Bible, La Fontaine's \
Fables. He employed dozens of engravers. Adored in Great Britain, \
he saw the Doré Gallery, devoted to his paintings, open in London in 1869, and there \
published with Blanchard Jerrold London: A Pilgrimage. He aspired nonetheless to be \
recognised as a painter and sculptor, and suffered from the indifference of French \
critics. He lived with his mother, whose death in 1879 affected him deeply, and \
died in Paris in 1883, at fifty-one."""
style = """
Doré is a visionary of black and white: immense crowds, vertiginous landscapes, \
violent contrasts of light and shadow. He composed his images like theatre or opera \
sets, with a sense of the spectacular that marked the popular imagination. \
His illustrations of Dante, the Bible or Perrault were reproduced across the \
world, and their echo is found in many sets of fantasy \
cinema."""

[[artistes]]
nom = "Jules Chéret"
vie = "Paris, 31 May 1836 – Nice, 23 September 1932"
biographie = """
The son of a typesetter, Jules Chéret entered at thirteen an apprenticeship with a \
lithographer and took evening drawing classes. In 1858, he designed a poster for \
Orphée aux Enfers, Offenbach's opéra-bouffe. Settled in London from 1859 to 1866, he \
discovered there the large English colour posters and worked notably for the \
perfumer Eugène Rimmel. On his return, he founded in Paris his own printing house, equipped \
with English presses, and revolutionised the French poster: large colour \
lithographs, figures in motion, lettering integrated into the image. In 1881, he sold his \
workshop to the Chaix printing house, of which he remained artistic director. He designed for \
theatres, music halls, dances, aperitifs, soaps, lamp oil \
or skating rinks, more than a thousand posters in all. He received the \
Légion d'honneur in 1890. Around 1900, he devoted himself more to decorative \
painting. Retired to Nice, he died there at ninety-six; the city's Musée des \
Beaux-Arts bears his name."""
style = """
Chéret is the father of the modern illustrated poster. His compositions, made for the \
street, rest on a few bright superimposed colours, a light and \
dancing female figure, and drawn letters that are one with the image. An admirer of Watteau \
and Tiepolo, he gives advertising the grace of the fête galante. He opened the way for \
Toulouse-Lautrec, Mucha and the whole generation of Belle Époque poster artists."""

[[artistes]]
nom = "Aubrey Beardsley"
vie = "Brighton, 21 August 1872 – Menton, 16 March 1898"
biographie = """
Afflicted with tuberculosis from childhood, Aubrey Beardsley grew up in Brighton in a \
modest family and was passionate about music, literature and drawing. At sixteen, \
he became an office clerk in London, first with a surveyor, then at an insurance \
company. In 1891, the painter Edward Burne-Jones, to whom he showed his \
drawings, encouraged him. The publisher J. M. Dent entrusted him with illustrating Thomas Malory's Le \
Morte d'Arthur, then the magazine The Studio revealed him to the public in 1893. His \
illustrations for Oscar Wilde's Salome, in 1894, made him famous and scandalous. \
Art editor of the magazine The Yellow Book, he was dismissed in 1895 at the time of \
Wilde's trial, although Wilde had never written for the magazine. He then contributed \
to The Savoy and illustrated Aristophanes' Lysistrata and Alexander Pope's The Rape of the \
Lock. Exhausted by illness, he converted to Catholicism in \
1897 and went in search of the sun on the Côte d'Azur, where he died at twenty-five."""
style = """
Beardsley created in a few years a style of absolute originality: a pure black and \
white, without half-tones, made of large black areas, lines of extreme \
fineness and refined ornaments. He blends in Japanese prints, Greek ceramics, \
the Rococo and an often provocative irony. His art, conceived for photomechanical \
reproduction, marked Art Nouveau, 20th-century illustration and graphic design."""

[[artistes]]
nom = "Théophile-Alexandre Steinlen"
vie = "Lausanne, 10 November 1859 – Paris, December 1923"
biographie = """
Born in Lausanne, Théophile-Alexandre Steinlen studied for a time at the university of his \
city, then worked as a pattern designer for a textile factory in \
Mulhouse. In 1881, he moved to Paris, to Montmartre, where he frequented the \
Chat Noir cabaret of Rodolphe Salis. He contributed to the cabaret's newspaper, then illustrated the \
songs of Aristide Bruant and drew for years for the Gil Blas illustré, in which \
hundreds of his images of the street, workers and humble trades appeared. \
He became one of the great poster artists of his time, with the Tournée du Chat Noir, the \
Lait pur stérilisé de la Vingeanne and the large poster La Rue, drawn for \
the printer Charles Verneau. Close to anarchist and socialist circles, he gave \
many drawings to the committed press, such as L'Assiette au beurre. Naturalised \
French in 1901, he bore witness during the Great War to the suffering of soldiers, \
refugees and civilians. He died in Paris in 1923."""
style = """
Steinlen is a draughtsman of modern life: he observes workers, \
laundresses, children, cats and the poverty of the suburbs with deep \
sympathy. His supple, powerful line, his simplified silhouettes and his frank colours, \
nourished by the Japanese print, give his posters great strength. \
His committed art marked the young Picasso and the press cartoonists of the 20th century."""

[[artistes]]
nom = "Winsor McCay"
vie = "Canada or Michigan, c. 1867 – New York, 26 July 1934"
biographie = """
The origins of Zenas Winsor McCay remain uncertain: he was born in Canada or \
in Michigan, between 1867 and 1871. He grew up in Michigan, where he received the \
only real lessons of his life from a perspective-drawing teacher. He \
first worked for circuses and popular curiosity museums, painting their posters and sets, \
notably in Chicago and then Cincinnati, where he became a \
newspaper illustrator. In 1903, he joined the New York Herald. There he created Little Sammy \
Sneeze and Dream of the Rarebit Fiend, then, in 1905, Little Nemo in Slumberland. \
A pioneer of animation, he made a first film after Little Nemo in 1911, then \
Gertie the Dinosaur in 1914, which he presented on music-hall stages, and The \
Sinking of the Lusitania in 1918. Having entered the service of the press magnate William Randolph \
Hearst, he devoted his last years mainly to editorial cartoons. He died in \
New York, in Brooklyn, in 1934."""
style = """
McCay is the first great virtuoso of the comic strip: he exploits the whole \
surface of the page, varies the size of the panels with the narrative and draws \
architecture of stunning precision. His clear line, marked by Art Nouveau, \
serves an imagination of dreams and metamorphosis. He influenced generations \
of authors, from Maurice Sendak to European cartoonists, and opened the way for \
animation."""

[[artistes]]
nom = "Leonetto Cappiello"
vie = "Livorno, 9 April 1875 – Cannes, 2 February 1942"
biographie = """
Born in Livorno, in Tuscany, into a family of merchants, Leonetto Cappiello learned \
to draw practically on his own. He settled in Paris in 1898, where his caricature portraits \
of stage stars, collected in the album Nos actrices in 1899, and his drawings \
for Le Rire quickly made him famous. The same year, he designed his first poster, \
for the newspaper Frou-Frou. Soon working under contract with the printer Pierre \
Vercasson, he became the master of the advertising poster: Chocolat Klaus in 1903, Le \
Thermogène in 1909, then Cinzano, Campari, Bouillon Kub and Bally shoes. He \
designed for all sorts of products, and his whimsical figures became \
familiar to millions of passers-by. He was also a painter and decorator. Naturalised \
French in 1930, he left Paris during the Second World War for the Côte \
d'Azur and died in Cannes in 1942."""
style = """
Cappiello is regarded as the father of the modern advertising poster. He replaces \
the decorative compositions of Art Nouveau with a single figure, often \
whimsical, in bright colours, set against a dark or plain ground, and which stays in \
memory associated with the brand. Coming from caricature, he has a sense of synthesis and \
movement. His method inspired the Art Deco poster artists, from Cassandre to Paul \
Colin."""

[[artistes]]
nom = "Abel Faivre"
vie = "Lyon, 30 March 1867 – Nice, 13 August 1945"
biographie = """
Jules-Abel Faivre first studied at the École des Beaux-Arts in Lyon, his native city, \
then in Paris, at the Académie Julian. He exhibited portraits and genre scenes at the \
Salon, but made his name above all as a humorous illustrator in the illustrated press, \
then in full expansion: Le Rire, Le Journal, L'Assiette au beurre and \
many others published his drawings, often devoted to the foibles of the bourgeoisie and to \
drawing-room conversations. His captions, highly polished, are as funny as his \
images. During the First World War, he put his talent at the service of \
propaganda: he drew patriotic caricatures for the press and signed several \
posters for the National Defence loans and the gold collection, among them On les \
aura!, in 1916, the most famous. After the war, he continued to draw for the \
press and to paint. He died in Nice in 1945, at seventy-eight."""
style = """
Faivre is above all a caricaturist with a keen eye and a sure line, who sketches in quick \
drawings the absurdities of Belle Époque society. In his war posters, \
he adopts a graver, almost painterly manner, in lithographic crayon, \
and knows how to condense a collective emotion into a single figure. His press drawings \
make him a precious witness to the manners of his time."""
