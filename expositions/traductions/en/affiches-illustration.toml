[[oeuvres]]
titre = "Gin Lane"
artiste = "William Hogarth"
annee = "1751"
image = "gin-lane.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:William_Hogarth,_Gin_Lane,_1751,_NGA_30433.jpg"
technique = "Etching and engraving on paper"
collection = "National Gallery of Art, Washington (Rosenwald Collection)"
note = "In a wretched London street, gin destroys everything: a drunken mother lets her child fall, the houses collapse, only the pawnbroker prospers."
description = """
The print shows a ruined London street, seen from above. In the foreground, seated \
on steps, a dazed woman, her legs covered in sores, takes a pinch of snuff \
while her baby slips from her arms and falls down the stairwell of \
a cellar. At lower right, a skeletal ballad-seller, asleep against the wall, still holds \
a glass; a pamphlet against gin sticks out of his basket. On the left, in front of \
the pawnbroker's shop, a carpenter and a housewife come to pawn their saw and \
saucepans. In the background, the street is coming apart: a house is collapsing, a barber \
has hanged himself in the attic, a madman gesticulates, a child is impaled on the end of \
a pike, and a dead woman is being lowered into a coffin. Above the rooftops rises a \
steeple. Beneath the image, three stanzas in English curse gin."""
evocation = """
Hogarth pairs Gin Lane with another plate, Beer Street, in which \
well-fed Londoners drink English beer, work and prosper. Here, \
by contrast, cheap gin ruins bodies, families and the city itself: \
only the moneylender, the distiller and the undertaker do business. The unworthy mother \
at the centre has been linked to a news item that had shocked London in 1734: a \
woman, Judith Defour, had strangled her little daughter to sell her clothes and \
buy gin. The steeple of the church of St George, Bloomsbury seems to watch the \
scene from afar, powerless. It has been seen as a sermon in pictures, but also as a document on \
the poverty of the St Giles district, one of the poorest in the city. Horror here is \
mixed with a black humour that still gives it its effectiveness."""
histoire = """
In the first half of the 18th century, London went through what has been called the “gin \
craze”: grain spirit, distilled everywhere and sold for a few pennies, caused \
misery, crime and death. In 1751, Parliament was preparing a law to limit its \
sale. Hogarth then published, on 1 February, Gin Lane and Beer Street, followed the same \
year by The Four Stages of Cruelty. His friend the writer and magistrate Henry Fielding \
had just published an essay on the increase in robberies, which also blamed gin. \
The verses engraved beneath the image are by the Reverend James Townley. To reach a \
popular audience, Hogarth sold these prints for a shilling each. The Gin Act was passed the \
same year, and consumption fell in the following years. This impression belongs \
to the National Gallery of Art in Washington."""
facture = """
Hogarth, trained as a silver engraver, engraved the copper plate himself, combining \
etching, for freedom of drawing, and engraving, for clean, \
regular lines. He announced that he had published these plates in the cheapest manner \
possible, for a popular audience: heavy strokes, frank contrasts, characters \
expressive to the point of caricature. The composition, built in deep perspective, \
leads the eye from the foreground, where everything falls, toward the background, where everything collapses. The \
signboards, shop signs and verses engraved beneath the image are part of the narrative, to be read \
like the captions of a comic strip."""
details = [
  "The sign above the cellar, at lower left: drunk for a penny, dead drunk for two, straw for nothing.",
  "The pawnbroker's sign, S. Gripe, a name that evokes greed.",
  "The barber hanged in the attic of the ruined house, at upper right.",
  "The steeple topped with a statue of King George I, in the background.",
  "The price, “Price 1s,” engraved at the very bottom right.",
]
themes = ["satire", "alcohol", "London", "poverty", "morality"]
anecdote = """
Since his successful prints were immediately copied and sold more cheaply, Hogarth obtained from \
Parliament, in 1735, a law nicknamed “Hogarth's Act,” which protected for the \
first time in England engravers against counterfeits of their works."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "The Sleep of Reason Produces Monsters (Los Caprichos, Plate 43)"
artiste = "Francisco de Goya"
annee = "1799"
image = "sommeil-raison.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Francisco_José_de_Goya_y_Lucientes_-_The_sleep_of_reason_produces_monsters_(No._43),_from_Los_Caprichos_-_Google_Art_Project.jpg"
technique = "Etching and aquatint, approximately 21.5 × 15 cm"
collection = "Nelson-Atkins Museum of Art, Kansas City (first edition)"
note = "A man has fallen asleep at his worktable; behind him rise owls, bats and a lynx: the most famous plate of the Caprichos."
description = """
A man dressed in the fashion of the late 18th century has collapsed on a table, his \
head buried in his arms. Papers and a pencil holder lie near him. \
Behind his back, a swarm of nocturnal creatures rises from the darkness: owls \
with round eyes, one of which seems to hand him a pencil, \
bats flying toward the top of the image, a crouching black cat of which only the \
eyes can be seen. On the right, lying on the ground, a lynx with pointed ears stares at the \
sleeper without moving. On the side of the table, pale letters give the title: \
El sueño de la razón produce monstruos. The background, a grainy grey, darkens as \
the beasts multiply, down to the black silhouettes that lose themselves in \
the sky."""
evocation = """
In Spanish, sueño means both sleep and dream: reason asleep, or \
reason dreaming. Historians first see in it a manifesto of the Enlightenment, which \
Goya shared with his reformist friends: when reason drowses, \
superstition, ignorance and vice, figured by the night birds, regain \
the upper hand. An early manuscript commentary, kept in the Prado, explains that \
imagination abandoned by reason produces impossible monsters, but that united \
with it, it is the mother of the arts. The plate can thus also be read as a \
portrait of the artist, assailed by the visions that feed his work. The lynx, \
an animal of piercing sight, stays awake while the man sleeps. Two centuries later, \
the image has become the very emblem of nightmare."""
histoire = """
Goya worked on the Caprichos from 1797, a few years after the serious illness \
that left him deaf. This plate was at first meant to open the series: a \
preparatory drawing, kept in the Prado, shows the same sleeper with an inscription \
presenting him as the author dreaming. In the final version, it \
takes its place in the middle of the series, as number 43, and it is a self-portrait of Goya, in \
profile, that opens the eighty plates. On 6 February 1799, the Diario de Madrid \
announced the sale of the Caprichos in a perfume and liquor shop on \
Calle del Desengaño, on the ground floor of the painter's house. The sale stopped after \
a few days, probably out of fear of the Inquisition. In 1803, Goya gave up \
the plates and the unsold copies to the king, in exchange for a pension for his \
son."""
facture = """
Goya combines two techniques of intaglio engraving on copper. Etching allows him to \
draw freely with a needle in a varnish, as with a pen: the contours of \
the man, the feathers of the owls, the wings of the bats. Aquatint, a fine resin \
dusted onto the plate and then bitten with acid, creates the grainy-looking grey grounds \
and the gradations of shadow, like a wash. By protecting certain areas from the acid, he \
brings out the title in pale letters on the table and the white wings of the central \
owl. Impressions of the first edition, like this one, keep a fine grain and \
deep greys."""
details = [
  "The owl handing a pencil holder to the sleeper, as if to oblige him to draw.",
  "The shining eyes of a black cat, crouching just behind the man's back.",
  "The lynx lying on the right, the only animal to remain motionless.",
  "The title engraved in pale letters on the side of the table.",
  "The bats losing themselves in the grey of the sky, at the top.",
]
themes = ["dream", "reason", "Enlightenment", "nightmare", "satire"]
anecdote = """
The original copper plates of the Caprichos still exist. Entering the royal collections \
in 1803, they are kept at the Calcografía Nacional in Madrid, which has pulled \
numerous posthumous editions from them up to the 20th century."""
salle = 3
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "The Bathers, Double Page from the Hokusai Manga (Volume IV)"
artiste = "Katsushika Hokusai"
annee = "1816"
image = "hokusai-manga.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hokusai-MangaBathingPeople.jpg"
technique = "Woodblock print in black and grey, double page of a book"
collection = "Hokusai Manga, Volume IV; copies in many museums"
note = "Swimmers, divers, a horseman in the water: a page from Hokusai's sketchbooks, an illustrated encyclopedia of Japanese life published in fifteen volumes."
description = """
Across two facing pages, some twenty bathers frolic in water \
rendered by fine wavy lines. On the left, a man climbs up a large \
pole, others dive headfirst or flounder, and, at the bottom, a horseman \
swims across, lying along the neck of his horse, whose legs stretch out. On the right, \
the swimmers take every posture: one floats with a large ring around his \
body, another carries a big bundle on his shoulder, others turn over, dive or \
seem to walk along the bottom, among water plants, small turtles and \
black fish. The bodies, barely clad in a loincloth, are caught in full \
motion, with no setting or landscape. At upper right, a few characters give the \
subject of the page."""
evocation = """
The word manga, which Hokusai chose for these volumes, means roughly “drawings \
at the whim of the brush” or “miscellaneous sketches.” It does not yet denote Japanese \
comics, even though these later borrowed its name in the 20th century. These pages are \
first of all models: repertories of forms intended for pupils and craftsmen, \
who could copy a gesture, an animal or a tool from them. But above all one senses \
Hokusai's insatiable curiosity about the human body in motion, and his humour: the \
swimmers wear expressions that are intent, frightened or blissful. The double page works \
like a study sheet, almost a breakdown of movement, long before \
photography. It has been recognised as showing swimming techniques practised in Japan in the \
Edo period, including by warriors."""
histoire = """
During a stay in Nagoya in 1812, Hokusai made hundreds of sketches for his \
pupils. A publisher in the city produced a first volume from them, published in 1814, whose \
success was such that the series continued: this fourth volume appeared in 1816. The first twelve \
volumes came out between 1814 and 1834; the last three, composed partly \
of previously unpublished drawings, appeared much later, the fifteenth in 1878, nearly \
thirty years after the artist's death. The whole gathers thousands of figures: \
tradespeople, gods, animals, plants, landscapes, ghosts. Printed in quantity and \
sold at moderate prices, the volumes circulated throughout Japan. In the 19th century, they \
reached Europe, where artists discovered them with passion: the Manga became one \
of the most admired Japanese books in Paris, in the age of Japonisme."""
facture = """
Each page is a woodblock print: Hokusai draws with a brush on thin paper, \
which the carver pastes face down on a cherrywood block before cutting the wood \
away around the lines. A second block prints the grey tints, here the water and a few \
shadows. The line is quick, supple, very economical: a few curves \
suffice for an arching back or a leg beating the water. The figures are \
scattered across the page without frame or ground, as on a sketch sheet, and the eye \
passes freely from one to another. The water, rendered by parallel wavy lines, \
unifies the whole."""
details = [
  "The horseman stretched out on his horse, swimming with legs extended, at lower left.",
  "The bather climbing the large pole, on the left.",
  "The small turtles and the black fish, at lower right.",
  "The swimmer floating with a large ring around his body, at upper right.",
]
themes = ["body", "movement", "water", "Japan", "sketch", "manga"]
anecdote = """
According to a famous but disputed account, the engraver Félix Bracquemond discovered a \
volume of the Manga in 1856 at his Paris printer's, where it had been used to wrap \
porcelain from Japan. He is said to have then shown it with enthusiasm to his \
artist friends."""
salle = 3
mur = "sud"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "The Story of Monsieur Jabot, One Plate"
artiste = "Rodolphe Töpffer"
annee = "1833"
image = "histoire-de-m-jabot.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Histoire_de_Mr_Jabot_-_par_Rodolphe_Töpffer_-_btv1b8529023n_(44_of_70).jpg"
technique = "Autography (lithograph after a pen drawing), oblong album of approximately 16 × 25 cm"
collection = "Bibliothèque nationale de France, Paris"
note = "Three panels, three captions: Monsieur Jabot, who wants to enter high society, struggling with his dogs. One of the very first comic albums."
description = """
The page is divided into three rectangular panels, drawn in pen, with beneath \
each a handwritten caption. In the first, Monsieur Jabot, his hat flying off, \
thin legs bent at right angles, struggles amid three little dogs leaping \
at him; the caption explains that the dogs are so friendly that he finds them almost \
too familiar. In the second, he is no longer there: the three dogs, tied to the \
foot of his bed at the hotel, wait, lying near a chair. In the third, \
wearing a tall, straight hat, he hands visiting cards to a stiff servant \
at a door: he is taking fifteen cards to Monsieur du Bocage, says the caption, the \
family consisting of fifteen persons. The line is quick, almost scribbled, and \
the settings are reduced to a few strokes."""
evocation = """
Monsieur Jabot is a vain bourgeois who dreams of entering good society and clumsily \
imitates its customs: the calls, the balls, the fine manners. Töpffer \
mocks him with a tender irony, showing the gap between his pretensions \
and his puppet-like gestures. The comedy here lies in the rhythm: repetition, the ellipsis \
between panels, the punchline of the third caption, of a very serious absurdity. \
This is exactly what the comic strip would later do: make meaning arise from \
the passage from one image to the next. Töpffer was aware of this; he explained that his \
drawings, without the text, would have only an obscure meaning, and that the text, without \
the drawings, would mean nothing. For many historians, this is the birth of a \
new language."""
histoire = """
The son of a Genevan painter, Töpffer ran a boarding school for boys in Geneva. From \
1827, he drew picture stories to amuse them, with no thought of publishing them. \
His manuscript albums nonetheless circulated and reached, around 1830, Goethe, in \
Weimar, who read them with enthusiasm and wished to see them printed. Encouraged, \
Töpffer published in 1833 the Histoire de Monsieur Jabot, the first of his stories to \
appear, reproduced by the Genevan printer Freydig. Monsieur Crépin and \
Monsieur Vieux Bois followed in 1837, then Monsieur Pencil and Doctor Festus. Its success \
quickly spread beyond Switzerland: pirated editions appeared in Paris, and Töpffer's stories \
were copied and imitated across Europe. This copy of the album is \
held in the Prints department of the Bibliothèque nationale de France."""
facture = """
Töpffer draws with a pen, in a deliberately free, almost childlike line, which \
favours expression over exactness. He uses autography, a variant of \
lithography: he draws and writes in greasy ink on special paper, whose \
image is then transferred to the lithographic stone for printing. The process \
allowed him to work quickly and to write his own captions, without going through \
an engraver. The panels, of varying width, are separated by a simple line; the text, \
always beneath the image, advances at the same pace as the drawing. He himself theorised this \
manner in his Essai de physiognomonie, in 1845."""
details = [
  "The hat flying off above Monsieur Jabot's head, in the first panel.",
  "Töpffer's RT monogram, beneath the middle panel.",
  "The page number, 34, at upper right.",
  "The servant, stiff as a post at the door, in the last panel.",
]
themes = ["comics", "humour", "vanity", "bourgeoisie", "dogs"]
anecdote = """
In 1842, Monsieur Vieux Bois, translated into English under the title The Adventures of Mr. \
Obadiah Oldbuck, appeared in New York: it is often considered the first comic \
published in the United States."""
salle = 4
mur = "ouest"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "A Mad Tea-Party (Alice's Adventures in Wonderland)"
artiste = "John Tenniel"
annee = "1865"
image = "the-du-chapelier-fou.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Alice_par_John_Tenniel_25.png"
technique = "Wood engraving by the Dalziel brothers, after Tenniel's drawing"
collection = "Alice's Adventures in Wonderland, Macmillan, London, 1865"
note = "Alice, the March Hare, the sleeping Dormouse and the Hatter: the illustration that fixed forever the faces of Lewis Carroll's characters."
description = """
Under a tree, in front of a house, a long table covered with a white cloth is laden with \
cups and saucers. On the left, Alice, her long fair hair on her shoulders, is \
sunk in a large armchair and looks at her hosts with a sulky air. In the centre, the \
March Hare, in jacket and bow tie, has his ears pricked. Next to him, \
the Dormouse, a small sleeping rodent, is wedged between the Hare and the Hatter, who \
lean on him as on a cushion. The Hatter, on the right, wears an immense \
top hat with a label giving a price: “In this style 10/6.” He has \
a big polka-dot bow tie and his hand rests near a plate. A decorated teapot \
sits in the middle of the table. At lower left, the artist's monogram."""
evocation = """
In Chapter VII of the book, Alice stumbles on a tea party that never ends: the Hatter \
explains that he quarrelled with Time, and that it is now always six o'clock, \
tea-time. They move round the table instead of washing the cups, ask riddles \
without answers, interrupt one another. Lewis Carroll, a mathematics lecturer \
at Oxford, mocks in it the absurd rules of Victorian politeness and the sacred ritual \
of tea. The English expression “mad as a hatter” is often linked to \
hatters poisoned by the mercury used to treat felt, and “mad as a march \
hare” to the frenzied behaviour of hares in spring. Tenniel's drawing gives \
this madness a perfectly serious air: it is this contrast that makes one laugh."""
histoire = """
Lewis Carroll, whose real name was Charles Dodgson, had first illustrated himself the \
manuscript given to the little Alice Liddell. For the published edition, he turned to John \
Tenniel, the famous Punch cartoonist, and followed his work closely, discussing \
each drawing. The forty-two illustrations were engraved on wood by the brothers \
Dalziel. In 1865, Tenniel judged the printing of the first run too poor: Carroll \
had the copies recalled and the book reprinted, which appeared dated 1866. Only about twenty \
copies of the withdrawn printing survive. The success was immense, and \
Tenniel also illustrated the sequel, Through the Looking-Glass, published at the end of 1871. His images \
have since been reused in countless editions and translations of the book, in \
English and in every language."""
facture = """
Tenniel drew with great precision directly on the prepared wood block; \
the engravers of the Dalziel workshop then cut away the wood around each line. \
End-grain wood engraving, cut from a very hard wood sawn across the trunk, \
allows lines of great fineness, and above all makes it possible to print the image at the same time \
as the text, on the same page. Tenniel builds the image like a newspaper cartoon: \
tight framing, cross-hatching for the shadows, characters set \
in profile, with expressive faces. His practice of political caricature shows in the \
Hatter, with his pronounced features."""
details = [
  "The hat label: “In this style 10/6,” ten shillings and sixpence, the price of the model.",
  "The sleeping Dormouse, wedged between the Hare and the Hatter.",
  "The teapot in the middle, into which the two friends will eventually try to stuff the Dormouse.",
  "Tenniel's monogram, at lower left.",
]
themes = ["childhood", "absurd", "tea", "literature", "nonsense"]
anecdote = """
At twenty, Tenniel lost the sight of one eye almost entirely in a fencing bout \
with his father, whose foil had lost its button. He long hid it \
from his father and drew throughout his career with only one good eye."""
salle = 4
mur = "nord"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "London Seen from the Railway (Over London – by Rail)"
artiste = "Gustave Doré"
annee = "1872"
image = "londres-chemin-de-fer.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:YCBA_London_a_Pilgrimage_06_(cropped).jpg"
technique = "Wood engraving by Adolphe Pannemaker after Gustave Doré, plate from the book London: A Pilgrimage"
collection = "Yale Center for British Art, New Haven (Paul Mellon Collection)"
note = "From a viaduct, the gaze plunges onto the little yards of London's workers' houses: the most famous image of Doré's London."
description = """
The view is framed by a brick arch, as if one were leaning out from a railway \
viaduct. Below, workers' houses line up as far as the eye can see, \
all alike, packed against one another, with their brick chimneys and \
tiled roofs. Behind each is a tiny yard fenced with planks, \
where the inhabitants crowd: women seated, children, a barrel, washing. Others \
lean out of windows. In the background, another arched viaduct closes off the perspective, and \
a train passes along it, releasing a plume of smoke that merges with the grey sky. In the \
right foreground, chimney stacks and very dark roofs. Light falls \
from above, between the walls, onto the yards lined up like panels."""
evocation = """
Doré shows the London of the poor in the industrial age, which the railway strides over \
without stopping. The houses repeated to infinity, the yards narrow as \
cells, the people crammed together speak of the poverty and anonymity of the great modern city. \
The train traveller sees everything and shares nothing: the arch that frames the image places him \
above, as a spectator. Part of the English criticism of the time reproached \
Doré for having blackened the city and for seeing it through the eyes of a French Romantic; \
others recognised in it a truth that well-off Londoners preferred to ignore. \
The image remains today one of the most reproduced of Victorian London, and one of the \
great visual testimonies to the industrial city."""
histoire = """
In 1868, the English journalist Blanchard Jerrold proposed to Doré, then immensely \
popular in Great Britain, a great book on London. Over several stays, \
the two men roamed the city, from the docks to the Epsom races, from the drawing rooms \
of the aristocracy to the night shelters, sometimes escorted by policemen in the \
most dangerous districts. Doré took few sketches on the spot and composed his drawings afterward \
from memory. London: A Pilgrimage appeared in 1872 from Grant & Co., first in \
instalments and then as a volume, with some one hundred and eighty engravings. The work was \
expensive and critical reception was divided, but it established itself as a \
major testimony on the Victorian city. This copy belongs to the Yale Center for British \
Art in New Haven."""
facture = """
Doré drew directly on the wood block, in wash and pencil, in graded tones \
rather than lines. The engravers who worked for him, here Adolphe \
Pannemaker, had to translate these greys into a tight network of fine parallel cuts: \
this is so-called “tint” engraving, which imitates painting. Hence this atmosphere of \
mist and soot, in which black dominates. The composition plays on a \
vertiginous perspective, a plunging view receding toward the viaduct in the background, and on the almost \
mechanical repetition of chimneys and yards. The arch in the foreground gives the \
viewer his place."""
details = [
  "The train and its plume of smoke, on the viaduct in the background.",
  "The barrels and plank fences that separate the yards.",
  "The inhabitants leaning on their elbows at the windows, on the left.",
  "Doré's signature, tiny, at lower left.",
]
themes = ["city", "London", "industry", "poverty", "railway"]
anecdote = """
Vincent van Gogh admired this book. In 1890, at the asylum of Saint-Rémy, he painted, \
after another of its engravings, the yard of Newgate Prison, his Prisoners' Round, \
now in the Pushkin Museum in Moscow."""
