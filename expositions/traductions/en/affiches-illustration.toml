[[oeuvres]]
titre = "Bal du Moulin Rouge"
artiste = "Jules Chéret"
annee = "1889"
image = "bal-moulin-rouge.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Bal_au_Moulin_Rouge,_by_Jules_Chéret.jpg"
technique = "Colour lithograph, poster printed by Chaix, Paris"
collection = "Hessisches Landesmuseum, Darmstadt"
note = "The poster for the opening of the Moulin Rouge, place Blanche, in 1889: laughing dancers ride donkeys at the foot of the windmill."
description = """
Against a pale ground, a large bright red windmill with wooden sails stands in the centre. \
In front of it, a young blonde woman in a low-cut yellow dress, wearing a flowered \
hat, rides a black donkey, laughing; she holds the reins in one hand and a sprig \
in the other. Behind her, another dancer, arms raised, adjusts her hair. On the \
left, in greys, blues and pinks, as if caught in a whirlwind, other \
women pass on donkeys or dance. At the top, large red letters shaded in \
blue form an arch: Bal du Moulin Rouge, place Blanche. At the bottom, the programme: \
every evening and Sunday afternoons, grand festivities on Wednesdays and Saturdays. Chéret's signature \
is on the left, near the border."""
evocation = """
Chéret invents here an image of Parisian festivity that would endure: a young woman, \
free, laughing, in motion, soon to be called a “chérette.” She is \
neither a goddess nor a courtesan, but a Parisienne out on the town, and her radiance serves to \
sell a place of pleasure. The donkeys and the windmill recall that Montmartre was \
still, not long before, a village of windmills and fields. Everything breathes the lightness \
of the Paris of the 1889 Exposition Universelle, that of the Eiffel Tower. Critics \
liked to compare Chéret's flying figures and light colours to those \
of Watteau and Tiepolo, whom he admired. For many contemporaries, his posters \
transformed the street into a museum open to all."""
histoire = """
The Moulin Rouge opened its doors on 6 October 1889, at the foot of the Montmartre hill, \
place Blanche, during the Exposition Universelle. Its founders, Joseph Oller and \
Charles Zidler, wanted it as a place of dancing and entertainment where all \
social classes would mix, and commissioned the opening poster from Chéret, the undisputed master \
of the genre, who was then working for the large printing house Chaix. The poster announced the \
ball and its festive evenings on the walls of Paris. Two years later, in 1891, the \
Moulin Rouge would commission a new poster from a young painter, Henri de \
Toulouse-Lautrec, who would make the dancer La Goulue famous in it. Chéret's image was \
reproduced in reduced size in the journal Les Maîtres de l'affiche, which circulated the finest \
posters among collectors. This copy is held at the Hessisches \
Landesmuseum in Darmstadt."""
facture = """
Chéret drew his posters himself on the lithographic stone, one stone for each \
colour. He deliberately reduced his palette to a few hues, red, yellow, \
blue and black, which he superimposed and made vibrate with hatching and stippling. \
The optical mixtures obtained give this luminous blur around the figures. The \
composition is made to be read from afar, in an instant: a main figure \
on the diagonal, in full motion, and hand-drawn letters that are part of \
the image. The secondary figures, almost transparent, suggest the crowd and \
the music."""
details = [
  "The sails of the windmill, drawn in red against the blue sky.",
  "The pink flowers scattered over the rider's yellow dress.",
  "The dancer with raised arms, behind, arranging her hair.",
  "The printer's address, “Imp. Chaix (Ateliers Chéret), 20 rue Bergère,” along the left edge.",
]
themes = ["festivity", "Paris", "Montmartre", "dance", "advertising"]
anecdote = """
In 1890, Chéret received the Légion d'honneur for having created a new branch of \
art, by applying art to commercial and industrial printing. The Musée des \
Beaux-Arts in Nice, the city where he died, now bears his name."""
salle = 2
mur = "nord"
place = 1
