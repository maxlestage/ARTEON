[[oeuvres]]
titre = "I Have Kissed Thy Mouth, Jokanaan (Salome)"
artiste = "Aubrey Beardsley"
annee = "1893–1894"
image = "salome-climax.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Aubrey_Beardsley's_Illustrations_to_Salome_by_Oscar_Wilde_MET_DP863674.jpg"
technique = "Photomechanical line block after an India ink drawing"
collection = "Metropolitan Museum of Art, New York (portfolio published by John Lane, 1906–1907)"
note = "Salome floats in the air and contemplates the severed head of Saint John the Baptist: the final scene of Oscar Wilde's play, in absolute black and white."
description = """
Against a ground divided between white and black, Salome floats in the air, \
kneeling on the void, her hair standing up in curled locks like horns or \
serpents. She holds in her hands the severed head of Saint John the Baptist, \
Jokanaan, and looks him straight in the eyes, her face very close to his. From the head, \
with its long tangled hair, a thin trickle of blood falls to the bottom of \
the image, into a black pool; from this pool rises a tall lily. At upper \
left, a mass of circles and crescents, like bubbles or scales, forms \
an almost abstract setting. A great white curve, in the centre, cuts a crescent \
of light from the black. Everything is drawn in line, with no grey at all."""
evocation = """
Oscar Wilde's play ends on this moment: Salome, who has obtained from King Herod the \
head of the prophet who had rejected her, at last kisses that dead mouth and says to it: \
“I have kissed thy mouth, Jokanaan.” Beardsley makes of it an image of unheard-of audacity \
for Victorian England: desire and death united, without pathos, with an \
icy elegance. The lily, flower of purity, springs from the saint's blood, like an \
ironic symbol. The image embodies the decadent aesthetic of the end of the century, fascinated by \
the femme fatale and by a dreamed-of Orient. The style, nourished by Japanese prints and Greek \
vases, caused as much scandal as the play itself, whose performance had been \
banned in London in 1892."""
histoire = """
Beardsley, twenty years old, drew a first version of this scene in 1893, after having \
read Salome, which Wilde had just published in French. The drawing was reproduced in April \
1893 in the first issue of the magazine The Studio, in an article that revealed the \
young artist to the public. The publisher John Lane then commissioned him to illustrate \
the English translation of the play, published in 1894. Beardsley redrew the scene, \
more stripped down, under the title The Climax. Several of his drawings for the book, \
judged indecent, were refused or altered before publication. After the artist's \
death, Lane reissued the illustrations as a portfolio, in 1906–1907: this sheet comes from that \
collection, now in the Metropolitan Museum in New York."""
facture = """
Beardsley draws with pen and India ink on white paper, with a \
goldsmith's precision. He refuses modelling and hatching: the image knows only two \
values, solid black and bare white, separated by lines of extreme fineness, \
sometimes bordered with little strokes like eyelashes. The large black areas, the white \
voids and the arabesques of the hair balance as in a Japanese print. \
The drawing is reproduced by a photomechanical process, the line block, which prints \
the artist's line exactly, with no intermediary engraver. Beardsley conceived his \
style for this new process."""
details = [
  "The trickle of blood falling from the head to the pool, at the bottom.",
  "The lily growing in the pool of blood.",
  "Salome's hair, standing up in curled locks.",
  "The border of little strokes, like eyelashes, along the great white curve.",
  "The clusters of circles and crescents, at upper left.",
]
themes = ["decadence", "femme fatale", "theatre", "black and white", "Japonisme"]
anecdote = """
Beardsley died of tuberculosis at twenty-five, in Menton. A few days before his \
death, he begged his publisher Leonard Smithers by letter to destroy his \
obscene drawings; Smithers did nothing of the kind."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Tour of Rodolphe Salis's Chat Noir"
artiste = "Théophile-Alexandre Steinlen"
annee = "1896"
image = "tournee-chat-noir.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Théophile-Alexandre_Steinlen_-_Tournée_du_Chat_Noir_de_Rodolphe_Salis_(Tour_of_Rodolphe_Salis'_Chat_Noir)_-_Google_Art_Project.jpg"
technique = "Colour lithograph, 135.9 × 95.9 cm"
collection = "Zimmerli Art Museum, Rutgers University, New Brunswick (New Jersey)"
note = "A seated black cat, haloed like a saint, announces the tour of the troupe of the famous Montmartre cabaret: Steinlen's most famous poster."
description = """
A large black cat, seated, its body in profile and its head turned toward us, fills \
the whole left half of the poster. Its silhouette is edged with a golden line, its \
pale almond eyes fix the passer-by, its whiskers stretch out like threads. \
Behind its head shines a red halo, ornamented like a Gothic rose window, in which \
letters can be made out. The cat sits on a red banner on which the name of Rodolphe Salis \
is inscribed in large letters; on the right, on the ochre ground, the words “Tournée du \
Chat Noir,” in red and black hand-drawn letters. At the top, a discreet \
“Prochainement.” Along the right edge runs the address of the printer Charles Verneau; \
at lower left, Steinlen's signature."""
evocation = """
The black cat was the emblem of Rodolphe Salis's cabaret, and Steinlen makes of it a \
kind of idol. The halo, which recalls the saints of stained glass, is a joke \
typical of the spirit of the place, a mixture of parodic devotion and mockery: the cabaret \
gave itself the airs of an old tavern, with a décor of fake antiques and \
waiters dressed as academicians. In the letters of the halo some have read the motto \
“Montjoye Montmartre,” a pastiche of the war cry of the kings of France, “Montjoie \
Saint-Denis.” The cat, mysterious, independent, a little disquieting, also embodies the \
artistic bohemia of Montmartre, insolent toward the bourgeois. Steinlen, who adored \
cats, drew them all his life."""
histoire = """
Rodolphe Salis opened in 1881, on boulevard de Rochechouart, at the foot of Montmartre, the \
Chat Noir cabaret, which became the meeting place of poets, songwriters and \
painters. In 1885, he moved to rue de Laval, now rue Victor-Massé, into a \
larger house where famous shadow-theatre shows were given. Salis \
also published a weekly newspaper, Le Chat Noir, to which Steinlen contributed. In \
1896, he took his troupe on tour in the provinces and commissioned this poster from Steinlen, \
printed by Charles Verneau, to announce it from town to town. Salis died the following \
year, in 1897, and the cabaret closed soon afterward. The poster, for its part, has never ceased \
to be reproduced. This copy belongs to the Zimmerli Art Museum of Rutgers \
University, in the United States."""
facture = """
Steinlen simplifies the cat's form until it becomes a silhouette, a large cut-out \
black flat area, enhanced only by a few golden lines that suggest the fur and \
the paws. This way of outlining forms and laying down frank colours without \
modelling comes from Japanese prints, much admired in Paris. The palette is limited to \
a few tones: black, red, the ochre of the ground and gold. The letters, drawn by \
hand, are part of the composition: the C of “Chat” curves round, the cat's tail \
curls amid the letters of Rodolphe. The whole is designed to be legible from \
very far away."""
details = [
  "The red halo, drawn like a stained-glass rose window, behind the cat's head.",
  "The tail curling among the letters of Rodolphe.",
  "The word “Prochainement,” alone at upper right.",
  "Steinlen's signature, at lower left, and the address of the printer Verneau, along the right edge.",
]
themes = ["cat", "Montmartre", "cabaret", "bohemia", "advertising"]
anecdote = """
There are two states of this poster: on one, one reads “Tournée du Chat Noir de \
Rodolphe Salis” (Tour of the Chat Noir of Rodolphe Salis), on the other, “Tournée du Chat Noir avec Rodolphe Salis” (Tour of the Chat Noir with Rodolphe Salis). It is the \
first version that is exhibited here."""
