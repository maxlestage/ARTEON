[[oeuvres]]
titre = "Little Nemo in Slumberland, Page of 29 September 1907"
artiste = "Winsor McCay"
annee = "1907"
image = "little-nemo.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Little_Nemo_1907-09-29_(borderless).jpg"
technique = "Colour printing on newsprint, a full page of the Sunday supplement"
collection = "Published in the New York Herald, 29 September 1907"
note = "Grown into a giant, Little Nemo wanders among the skyscrapers of New York before waking in his bed: a page from the most sumptuous comic strip of the early 20th century."
description = """
The page is cut into seven panels of different sizes. At the top, across the whole \
width, Nemo, a little boy in white pyjamas, and the Imp, a little savage dressed in a \
grass skirt, crouch at night on the roof of a skyscraper: a searchlight \
sweeps the sky and writes there that King Morpheus offers nine trillion dollars to whoever \
finds Nemo. In the next three panels, tall and narrow, the two children, \
grown into giants, climb down the façades; at their feet, in the street, a tiny crowd \
and a yellow streetcar. Lower down, Nemo reaches the river where steamships are moored \
and wades in up to his knees, while Flip, their prankster companion, \
runs across the rooftops calling to him. In the last panel, very small, Nemo is \
in his bed, shaken by his mother."""
evocation = """
Every Sunday, Little Nemo, whose name means “nobody” in Latin, sets off in dream \
for Slumberland, the land of sleep, where King Morpheus's daughter awaits him; every \
Sunday, the adventure ends in a rude awakening, often a fall from the bed. McCay \
thus explores every logic of dreams: changes of size, cities that \
warp, impossible perspectives. This page also shows the New York of 1907, \
that of the first skyscrapers, steamships and crowds, seen as a setting at once \
marvellous and crushing. The giant little boy, lost in a city too large, \
simply looks for his way. It has been seen as an image of childhood facing the modern world; \
the comic strip here becomes an art of dreaming."""
histoire = """
Winsor McCay began Little Nemo in Slumberland on 15 October 1905, in the \
Sunday colour supplement of the New York Herald, one of the city's great \
dailies. The series appeared weekly as a full page, an immense format that left \
the artist total freedom of layout. The success was considerable: a Broadway \
musical was made of it in 1908, along with toys and postcards. In \
1911, McCay moved to the press magnate William Randolph Hearst and continued the \
series under another title, before briefly resuming it at the Herald in the \
1920s. Printed on fragile newsprint, these pages were long neglected; \
they have since been the subject of many reissues, some in the original format."""
facture = """
McCay, who had learned perspective drawing, builds his panels like theatre sets: \
the façades of the skyscrapers, with their hundreds of windows, are \
drawn with an architect's precision. He varies the size and shape of the \
panels according to the action: very tall and narrow when Nemo climbs down \
the buildings, wide when the city spreads out, tiny for the return to bed. His very fine \
ink drawings were coloured at the printing house, in flat \
pastel tones. The hand lettering of the speech balloons is part of the image. The influence of \
Art Nouveau can be read in the decorative title at the top of the page."""
details = [
  "King Morpheus's message written by the searchlight in the sky, in the first panel.",
  "The yellow streetcar and the tiny crowd at the foot of the skyscrapers, in the fourth panel.",
  "The steamships moored at the quays, smaller than Nemo.",
  "Winsor McCay's signature, in the last panel, near the bed.",
  "The New York Herald copyright notice, at lower left.",
]
themes = ["dream", "childhood", "New York", "comics", "skyscraper"]
anecdote = """
McCay was also a pioneer of animation. In 1914, he presented on stage Gertie \
the Dinosaur: standing before the screen, he gave orders to the drawn animal, which \
seemed to obey him, then he disappeared behind the screen to reappear in the \
film, on Gertie's back."""
