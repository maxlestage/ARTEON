accroche = "Virtual exhibition · Vincent van Gogh"
introduction = """
From the potato eaters of Nuenen to the last wheat field at Auvers, \
walk in 3D through five years of painting that changed colour for ever. \
Every canvas is rebuilt brushstroke by brushstroke, in relief, in three galleries \
arranged around a tall, bright atrium."""
vitrine = "nuit-etoilee.jpg"

[musee]
nom = "Van Gogh Museum"
ville = "Amsterdam, Netherlands"
architecte = "Gerrit Rietveld"
construction = "opened in 1973"
presentation = """
When Vincent died in 1890, his paintings passed to his brother Theo, then to Theo’s widow, \
Johanna van Gogh-Bonger, who devoted her life to making them known. Their son, \
Vincent Willem, transferred the collection to a foundation, and the Dutch state built \
a museum for it on Amsterdam’s Museumplein. Designed by Gerrit Rietveld, a leading figure of the \
De Stijl movement, and completed after his death in 1964, the building opened in \
1973: a simple volume of concrete and glass, organised around a tall central space \
bathed in overhead light, from which a staircase serves the upper floors. In 1999 an oval \
wing by Kisho Kurokawa was added for temporary exhibitions. The museum holds the \
largest collection of Van Gogh’s work in the world: more than two hundred paintings, some \
five hundred drawings and most of his letters, from The Potato Eaters to \
the Sunflowers."""
ici = """
The ARTEON building takes up Rietveld’s guiding idea. The atrium, a square \
10 metres on each side and 9 metres high, with almost white walls, entered from the south, \
leads to all the galleries. The visit follows the painter’s life: to the west, \
Room I · Nuenen and Paris, with beige walls; you return to the atrium to reach, to the \
north, Room II · Arles, the largest, in a pale straw yellow; finally, to the east, \
Room III · Saint-Rémy and Auvers, with blue-grey walls. Five metres high, the three \
galleries feel intimate after the soaring atrium."""

