[[oeuvres]]
titre = "The Night Café"
annee = "1888"
image = "cafe-de-nuit.jpg"
technique = "Oil on canvas, 72.4 × 92.1 cm"
collection = "Yale University Art Gallery, New Haven"
note = "Blood red and bitter green: a café where “one can ruin oneself, go mad, commit crimes”."
description = """
We discover the room of an almost deserted café, shortly after midnight, as the \
clock on the back wall shows. In the centre, a green billiard table casts a \
long shadow on the floor. Four hanging lamps, surrounded by yellow and orange halos, \
light the room harshly. Along the red walls, a few solitary customers are \
slumped at tables, drowsing or with their heads in their arms. Near the billiard table, a \
man in a light suit, the proprietor, stands looking towards us. At the back, a counter laden with \
bottles and a door veiled by a curtain, opening onto a brighter room. The \
yellow floor seems to tip towards the viewer, and empty chairs wait in the \
foreground."""
evocation = """
Van Gogh meant to make this café a place of desolation: he wrote to Theo that he had \
tried to express the terrible human passions with red and green. The \
colours clash instead of harmonising, and the raw light of the lamps, \
without warmth, heightens the unease. The isolated drinkers and the night prowlers, who \
come here because they cannot pay for lodgings, compose an image of urban loneliness. \
The proprietor, standing motionless, seems to rule over this space like a disquieting \
guardian. This is no longer the social realism of Nuenen, but a painting in which \
colour directly carries emotion, which would make this canvas a reference for \
the Expressionists of the twentieth century."""
histoire = """
The Café de la Gare, place Lamartine, was run by Joseph and Marie Ginoux; Van Gogh \
lodged there for several months before moving in next door, at the Yellow House. In early September \
1888, he spent three nights painting the room, sleeping during the day. He wrote to Theo that \
it was one of the ugliest canvases he had done, but that he judged it \
equivalent, though different, to The Potato Eaters. In November, Gauguin \
in turn painted the same café, with Marie Ginoux in the foreground. The canvas was acquired \
by the great Moscow collector Ivan Morozov, nationalised after the Revolution, \
then sold by the Soviet government in 1933. The American Stephen C. Clark \
bequeathed it in 1961 to Yale University."""
facture = """
Van Gogh plays on dissonances: blood-red walls, green ceiling and \
billiard table, yellow floor. He sets complementaries against each other not to soothe them but \
to make them scream. The halos of the lamps, made of concentric circles of yellow \
and orange touches, anticipate the swirling stars of Saint-Rémy. The plunging perspective, \
very pronounced, stretches the room and gives the feeling that the floor is giving way. \
The dark contours and flat tints owe much to Japanese prints, but the \
thick paint remains very present."""
details = [
  "The clock at the back, showing a little past midnight.",
  "The long, dark shadow cast by the billiard table on the yellow floor.",
  "The concentric halos around the four lamps.",
  "The proprietor in white, standing near the billiard table, looking towards us.",
  "The curtain over the back door, opening onto a brighter room.",
]
themes = ["night", "café", "solitude", "colour", "unease"]
anecdote = """
At the beginning of the twenty-first century, a descendant of Ivan Morozov claimed the painting in \
American courts, arguing that it had been despoiled by the Soviet state. The \
courts ruled in favour of Yale University, which still holds it."""
salle = 3
mur = "est"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Irises"
annee = "1889"
image = "iris.jpg"
technique = "Oil on canvas, 74.3 × 94.3 cm"
collection = "J. Paul Getty Museum, Los Angeles"
note = "Painted in the garden of the Saint-Rémy asylum in his first week: a single white iris among the blue ones."
description = """
The gaze plunges into a bed of irises in bloom, seen from very close, with no horizon or \
sky. The blue-violet flowers, with undulating petals, rise on long \
blade-like green leaves that cross one another. They occupy almost the whole width \
of the canvas, each with its own form, some fully open, others still in \
bud. Among them a single white iris stands out. In the foreground, the earth is \
a reddish brown; at the back, the garden grass and a clump of orange flowers \
light up the composition. The framing cuts the plants at the edges, as if the \
bed continued beyond the painting. The eye moves from one flower to another without \
ever finding a centre, as in a garden one wanders through."""
evocation = """
Painted in the very first days of his voluntary confinement, Irises testify \
to a renewed vital impulse: painting is for Van Gogh a way of holding illness \
at bay. The walled garden of the asylum becomes a world in itself, teeming and luminous. \
Each flower seems to have its own personality, twisting, bending or standing tall like \
a living being. The isolated white iris has often been interpreted as a figure of \
solitude, even as a symbolic self-portrait of the painter among others, but this \
is only one reading among others. What strikes most is the absence \
of apparent anguish: the canvas celebrates spring, growth and the simple beauty \
of plants."""
histoire = """
On 8 May 1889, after several crises, Van Gogh entered the Saint-Paul-de-Mausole asylum \
at Saint-Rémy-de-Provence of his own free will. He was allowed to paint in the \
garden, and he at once set about the irises in bloom. He regarded the canvas as a \
study, but Theo sent it to the Salon des Indépendants in September 1889. In 1892, the \
critic Octave Mirbeau, one of the painter’s first champions, bought it for 300 \
francs. In November 1987, it was sold at auction in New York for 53.9 million \
dollars to the Australian businessman Alan Bond, a world record at the time. \
Unable to pay for it in full, he had to part with it, and the J. Paul Getty \
Museum in Los Angeles acquired it in 1990."""
facture = """
Irises owes much to Japanese prints: emphatic contours, flat areas of \
colour, close, cropped framing, absence of deep perspective. Van Gogh combines this with \
his own thick, nervous brushwork, which follows the movement of the leaves and \
petals. He plays the complementaries against each other, the blue-violet of the flowers against \
the orange of the background flowers and the reddish brown of the earth. Research has shown \
that the irises were originally more violet: the red pigment mixed with the blue faded \
over time."""
details = [
  "The single white iris, isolated among the blue flowers.",
  "The blade-like leaves, crossing like swords.",
  "The reddish-brown earth of the foreground.",
  "The orange flowers in the background, a counterpoint to the blue of the irises.",
  "The dark contours around each petal, in the Japanese manner.",
]
themes = ["flowers", "garden", "japonisme", "spring", "asylum"]
anecdote = """
In 1987, the buyer of Irises was able to bid only thanks to a loan provided half \
by Sotheby’s, the auction house itself. Revealed afterwards, this practice \
caused a scandal and cast doubt on the soaring prices of the period."""
salle = 4
mur = "nord"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "The Starry Night"
annee = "1889"
image = "nuit-etoilee.jpg"
technique = "Oil on canvas, 73.7 × 92.1 cm"
collection = "Museum of Modern Art, New York"
note = "The view from his asylum window before dawn: a sky swirling above the sleeping village."
description = """
Beneath an immense sky, a small village sleeps at the foot of blue hills. The sky occupies \
most of the canvas: great swirls of light coil like \
waves, and a double spiral rolls at its centre. Eleven stars blaze, \
surrounded by yellow and white halos, and at upper right shines a crescent moon, \
orange and ringed with light. Near the cypress, a star larger and brighter than \
the others: the morning star. In the foreground, on the left, a dark cypress leaps \
like a flame to the top of the picture. In the village, houses with lit windows \
surround a church with a slender steeple, and the hills undulate, \
echoing the movement of the sky."""
evocation = """
The Starry Night has become the very image of Van Gogh, and one often reads in it the \
torments of his illness. But the painter also expresses in it a long-standing fascination with \
the stars, which he associated with infinity and the beyond. The cypress, a tree of \
cemeteries in Provence, links earth to sky: it has been seen as a symbol of death as much as \
a surge towards eternity. The church, which looks more like those of Brabant, has \
been interpreted as a memory of his native land. The contrast between the \
peaceful village and the seething sky suggests a nature traversed by energies that the sleeping \
human does not perceive. In 1971, Don McLean’s song Vincent, which begins with “\
Starry, starry night”, further increased the painting’s fame."""
histoire = """
Van Gogh painted the canvas around mid-June 1889 at the Saint-Rémy asylum. From the barred \
window of his room, facing east, he saw a walled wheat field and, \
beyond it, hills. He was not allowed to paint in his room: he worked \
by day in a ground-floor studio, relying on his studies and his \
memory, and added the village and the cypress. He wrote to Theo that he had seen the countryside before \
sunrise, with the morning star, very large. Not very satisfied, he later confided \
to Émile Bernard that he had let himself go and made the stars too large. After \
several owners, including the poet Julien Leclercq, the canvas entered the \
Museum of Modern Art in New York in 1941, through an exchange of works bequeathed by Lillie P. Bliss."""
facture = """
Everything is movement: Van Gogh paints in thick, curving, rhythmic touches that \
follow the forms and draw the eye into a continuous whirl. The sky is \
built with deep blues, against which the yellows of the stars burst. The \
cypress, almost black, is modelled in long, undulating vertical strokes that \
oppose the horizontals of the village and the spirals of the sky. The village, drawn more \
rectilinearly, provides a calm counterpoint. The strongly marked relief of the \
paint catches the light and gives the sky an almost physical presence."""
details = [
  "The orange crescent moon, at upper right, wrapped in a halo.",
  "The great double spiral rolling at the centre of the sky.",
  "The morning star, larger and brighter, near the cypress.",
  "The slender steeple of the church, rising above the rooftops.",
  "The yellow windows of the houses, the only traces of human life.",
]
themes = ["night", "sky", "stars", "cypress", "village"]
anecdote = """
Astronomers have verified that in spring 1889, the planet Venus did shine at \
dawn in the sky over Saint-Rémy: the morning star that Van Gogh says he saw from his \
window is very probably she."""
salle = 4
mur = "nord"
place = 3
largeur = 1.5

[[oeuvres]]
titre = "Almond Blossom"
annee = "1890"
image = "amandier.jpg"
technique = "Oil on canvas, 73.3 × 92.4 cm"
collection = "Van Gogh Museum, Amsterdam"
note = "A gift for the birth of his nephew: blossoming branches against a blue sky, in the Japanese manner."
description = """
Branches of almond in blossom stand out against a turquoise-blue sky, with no ground or \
horizon. Seen from below, as if one were lying beneath the tree, they spread across \
the whole surface of the canvas and divide into ever finer twigs. The \
flowers, white tinged with pink, are shown at different stages: some \
wide open, revealing their centres, others still in pink buds. The branches, \
a greenish brown, are ringed with dark contours and twist supplely. The \
framing cuts the twigs at the edges, so that the scene seems a fragment of a \
larger tree. Nothing disturbs this dialogue between the blue of the sky and the \
fragility of the flowers."""
evocation = """
The almond is the first tree to flower, at the end of winter: it symbolises \
renewal and life beginning again. By choosing it to greet the birth of his \
nephew, Van Gogh gives the newborn an emblem of hope and growth. The \
painting, conceived to hang in the parents’ bedroom, also speaks of the deep affection \
that binds him to Theo and his wife Johanna. Painted in a period of relative calm, \
just before a new crisis, it takes on the value of a fragile promise. The \
serenity of the image, its luminous sky and its decorative elegance testify to an \
appeasement rarely found to this degree in his Saint-Rémy work."""
histoire = """
On 31 January 1890, Johanna, Theo’s wife, gave birth to a boy, whom his parents \
named Vincent Willem, after his uncle. Touched, Vincent immediately set about painting \
this picture at the Saint-Rémy asylum, in February 1890; he told his mother that he \
intended it for their bedroom. Soon afterwards, he was struck by a severe crisis that \
prevented him from working for almost two months. Theo and Jo eventually hung the \
canvas above the piano in their Paris drawing room. It stayed in the family after the death \
of the two brothers, belongs to the Vincent van Gogh Foundation and has become one \
of the best-loved works in the Van Gogh Museum."""
facture = """
The influence of Japanese prints is at its height here: clean contours, flat areas of \
colour, a motif seen close up and cut by the frame, a plain ground without perspective. Van Gogh, \
who had collected these prints since Antwerp and Paris, makes their language his own. The \
blue of the sky, laid on in tight touches, acts as a setting for the white of the flowers, itself \
nuanced with pink and green. The flowers are painted in thick paste, which gives them \
relief, while the branches are traced with a supple line. The reduced range \
creates a luminous, calm harmony."""
details = [
  "The pink buds, next to the flowers already open.",
  "The dark contours that outline the branches, as in a print.",
  "The relief of the white flowers, painted in thick paste.",
  "The twigs cut by the edges of the painting, in the Japanese manner.",
]
themes = ["flowers", "birth", "spring", "japonisme", "family"]
anecdote = """
The nephew for whom this almond tree was painted, Vincent Willem van Gogh, who became an engineer, \
created the foundation behind the Van Gogh Museum. He died in 1978, having seen the \
museum open in 1973 that now displays his birth gift."""
salle = 4
mur = "sud"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "Wheatfield with Crows"
annee = "1890"
image = "champ-ble-corbeaux.jpg"
technique = "Oil on canvas, 50.5 × 103 cm"
collection = "Van Gogh Museum, Amsterdam"
note = "Auvers-sur-Oise, July 1890: a stormy sky, three paths and a flight of crows. He dies a few weeks later."
description = """
A field of ripe wheat stretches across the whole width of this very elongated canvas, beneath a \
stormy dark-blue sky, almost black in the heights, where two paler clouds float. \
Three paths cross it: the central one, reddish brown and edged with green grass, \
advances towards the back and breaks off abruptly in the midst of the wheat; the other two \
lead off to the left and right and leave the frame. Above the field, a \
flock of black crows, painted with a single stroke, flies up or dives towards the ears. The \
golden-yellow wheat, stirred, seems to bend under the wind. No human figure, no \
house: nothing but earth, sky and birds."""
evocation = """
Because it was painted shortly before his death, this painting has long been read as a \
testament. The threatening sky, the crows and the path that breaks off have been \
interpreted as ill omens, perhaps more than is warranted. Van Gogh then wrote \
to Theo and Johanna that he had painted immense stretches of wheat under troubled skies, \
and that he had had no trouble expressing in them sadness and extreme loneliness. \
But he adds that he hopes to show in them also what he sees of the healthy and fortifying \
in the countryside. The work lies in this fragile balance between anguish and vitality, \
between the menace of the sky and the fullness of the ripe wheat."""
histoire = """
On 20 May 1890, Van Gogh left Saint-Rémy for Auvers-sur-Oise, north of Paris, where \
he was looked after by Dr Paul Gachet, a physician and art lover. He lodged at the Ravoux \
inn and painted at a frenzied pace: more than seventy paintings in barely over \
two months. In early July, back from a tense visit to Theo in Paris, he painted this \
field under the storm. On 27 July, he shot himself with a revolver, in \
circumstances never entirely clarified, and died two days later at the inn, \
Theo at his bedside. The painting, which stayed in the family, belongs to the Vincent \
van Gogh Foundation."""
facture = """
At Auvers, Van Gogh adopts a double-square format, very elongated, which he uses for \
a series of panoramic landscapes. The paint is laid on quickly, in thick, broad touches, often \
into still-wet colour. Complementaries clash: the yellow of the wheat against the blue of the sky, the \
red of the path against the green of the grass. The crows are reduced to signs, simple black Vs \
traced in a single gesture. Rather than leading the eye to a vanishing point, the \
paths open out towards the viewer, which makes the space unstable."""
details = [
  "The central path, which stops dead in the midst of the wheat.",
  "The crows, reduced to black V-shaped signs.",
  "The two pale clouds, isolated in the dark sky.",
  "The bands of green grass edging the red path.",
]
themes = ["landscape", "wheat", "storm", "crows", "solitude"]
anecdote = """
Contrary to a persistent legend, this is probably not his last canvas. Researchers at the \
Van Gogh Museum attribute that role instead to Tree Roots, an unfinished \
painting he was working on in the very last days of his life."""
salle = 4
mur = "est"
place = 2
largeur = 2.4

[[artistes]]
nom = "Vincent van Gogh"
vie = "Groot-Zundert (Netherlands), 30 March 1853 – Auvers-sur-Oise, 29 July 1890"
biographie = """
The son of a Protestant pastor, Vincent van Gogh grew up in Dutch Brabant. At \
sixteen he joined Goupil & Cie, art dealers, and worked in The Hague, \
London and Paris, before being dismissed in 1876. He then turned to religion, \
failed to become a pastor and preached among the miners of the Borinage in Belgium. It was \
there, in 1880, at twenty-seven, that he decided to become an artist. His younger brother Theo, \
an art dealer in Paris, supported him financially to the end and received from him \
hundreds of letters, an irreplaceable testimony to his thought. After years of \
apprenticeship in Brussels, The Hague and Nuenen, where he painted peasants, he passed through \
Antwerp and then joined Theo in Paris in 1886: there he discovered Impressionism, \
Neo-Impressionism and Japanese prints, and his palette brightened. In February \
1888, he left for Arles, where he dreamed of founding a studio of the South. Gauguin joined \
him there, but the cohabitation was short-lived: in December 1888, during a crisis, Van \
Gogh mutilated his left ear. Subject to crises whose nature is still debated, \
he entered the Saint-Rémy-de-Provence asylum in 1889, where he painted tirelessly, then \
settled in May 1890 at Auvers-sur-Oise. On 27 July, shot and wounded, he died \
two days later. He sold very few canvases in his lifetime, even though the \
critic Albert Aurier was beginning to notice him. Thanks to Johanna van Gogh-Bonger, \
Theo’s widow, who published his letters and had his works exhibited, his fame became \
worldwide in the early twentieth century."""
style = """
Van Gogh’s painting is recognisable at first glance: a thick, visible brushstroke, \
in short strokes, hatching or swirls, which gives each surface, \
sky, field or face, a movement of its own. He uses colour freely and \
expressively, playing on contrasts of complementaries, not to copy nature \
but to convey emotions. From Japanese prints, he retains the emphatic contours, \
flat areas and bold framing. His work, some 850 paintings and nearly \
1,300 drawings made in ten years, opened the way to the Fauvism of Matisse, Derain \
and Vlaminck, and to German Expressionism, which owe him this freedom of \
colour and gesture."""
