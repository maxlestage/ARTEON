cadre = "vitrine"
couleur = "#6b4f2e"
titre = "Sculpture, from Michelangelo’s Marble to Rodin’s Bronze"
artiste = "Michelangelo, Bernini, Canova, Carpeaux, Rodin, Claudel, Degas…"
dates = "1513–1909"
accroche = "Virtual exhibition · Musée Rodin, Paris"
introduction = """
Four centuries of sculpture, from the marble that Michelangelo wrests from the block to the bronze of Rodin, who turns matter into drama and surface into vibration. The visit brings together ten works by nine sculptors, from Bernini to Maillol, presented through photographs in display cases, as in a connoisseur’s cabinet. The building is inspired by the Hôtel Biron, where Rodin settled in 1908 and which has become the Musée Rodin: a vestibule where The Thinker waits, then an enfilade of four salons with light wood panelling, lined up as if along the garden."""
vitrine = "baiser.jpg"

[musee]
nom = "Musée Rodin (Hôtel Biron)"
ville = "Paris, France"
architecte = "Jean Aubert"
construction = "1727–1732"
presentation = """
The Hôtel Biron was built between 1727 and 1732, on the rue de Varenne, for Abraham Peyrenc de Moras, an enriched financier. It later took the name of the Maréchal de Biron, who occupied it from 1753 and had its gardens laid out. In the nineteenth century, the nuns of the Sacré-Cœur ran a boarding school for girls there. When the law forbade them to teach, in 1904, they had to leave, and the state rented the rooms to artists: Matisse, Cocteau, the dancer Isadora Duncan, the poet Rilke, who introduced the place to Rodin. The sculptor rented salons there from 1908. In 1916, he gave his works and collections to the state, on condition that they be shown here: the museum opened in 1919, two years after his death. In the salons with their rocaille panelling, lit by tall windows, one sees today his marbles, his plasters and the room of Camille Claudel; the garden shelters The Thinker, The Gates of Hell and The Burghers of Calais."""
ici = """
The ARTEON building evokes the ground floor of the Hôtel Biron. You enter from the south into the vestibule, where The Thinker welcomes the visitor. To the north opens the grand salon, seven and a half metres high, devoted to The Gates of Hell. It commands an enfilade of salons lined up from west to east, like those that overlook the garden: to the west, the gallery of the Old Masters, from Michelangelo to Canova; to the east, the Claudel and Degas room, then, at the end of the enfilade, the room “After Rodin”. The walls, cream, pearl grey or pale green, recall the painted panelling of the hôtel."""

