[[artistes]]
nom = "Michel-Ange"
vie = "Caprese (Tuscany), 6 March 1475 – Rome, 18 February 1564"
biographie = """
Michelangelo Buonarroti was born into a Florentine family of minor nobility. An apprentice of the painter Domenico Ghirlandaio, he was soon noticed by Lorenzo de’ Medici, who took him into his palace and his garden of antique sculptures. In Rome, at twenty-four, he carved the Pietà of Saint Peter’s; returning to Florence, he carved the David, completed in 1504, which made him the foremost sculptor in Italy. Pope Julius II called him to Rome for his tomb, then imposed on him the painting of the vault of the Sistine Chapel (1508–1512). The tomb, scaled down year after year, occupied him for four decades. In Florence, he designed for the Medici the New Sacristy of San Lorenzo and its tombs. Settled permanently in Rome in 1534, he painted the Last Judgment of the Sistine, wrote poems, and became architect of Saint Peter’s Basilica, whose dome he designed. He died at nearly eighty-nine, still working on a Pietà left unfinished. His contemporaries called him “the divine”."""
style = """
Michelangelo thought of himself above all as a sculptor: he said he freed the figure imprisoned in the block. His heroic bodies, muscular, often twisting, express the strength and anguish of the soul. Many of his statues remain unfinished, and this non finito, in which the figure seems to emerge from the stone, fascinated the following centuries, down to Rodin. His influence on European sculpture and painting is immense."""

[[artistes]]
nom = "Le Bernin"
vie = "Naples, 7 December 1598 – Rome, 28 November 1680"
biographie = """
Gian Lorenzo Bernini was the son of the Florentine sculptor Pietro Bernini, who settled in Rome when the boy was seven or eight. Trained in his father’s workshop, he was noticed very early by the great Roman collectors, in particular Cardinal Scipione Borghese, for whom he sculpted in the 1620s the Rape of Proserpina, the David and Apollo and Daphne. Pope Urban VIII, elected in 1623, made him the official artist of Rome: he designed the bronze baldachin of Saint Peter’s, then, under Alexander VII, the colonnade of Saint Peter’s Square. He also created the Cornaro Chapel with its Ecstasy of Saint Teresa, and the Fountain of the Four Rivers in Piazza Navona. Sculptor, architect, town planner, theatre designer, he dominated Roman artistic life for half a century. In 1665, Louis XIV invited him to Paris for the Louvre project; his plans were not adopted, but he sculpted a famous bust of the king, now at Versailles. He died in Rome at eighty-one."""
style = """
Bernini makes marble a living material: flesh that yields beneath the fingers, hair, foliage, fabrics that fly. He seizes the instant of an action, like a stage director, and unites sculpture, architecture and light in a total spectacle. His art defines the Roman Baroque and was imitated throughout Catholic Europe."""

[[artistes]]
nom = "Antonio Canova"
vie = "Possagno (Veneto), 1 November 1757 – Venice, 13 October 1822"
biographie = """
The son of a stonecutter, raised by his grandfather, Antonio Canova trained in Venice, where he opened his own workshop at a very young age. In 1781, he settled in Rome, which he would hardly leave again. The group of Theseus and the Minotaur, then the tombs of Popes Clement XIV and Clement XIII, made him famous throughout Europe. Sovereigns and collectors vied for his works: Psyche and Cupid, Hebe, the Three Graces. Napoleon summoned him to Paris and commissioned his portrait as Mars the Peacemaker; his sister Pauline Borghese posed for the Venus Victrix. After the fall of the Empire, in 1815, Canova was sent to Paris by the pope to recover the works of art taken from Rome by the French armies, and he brought back a large part of them. Showered with honours, he had a temple inspired by the Pantheon built in his native village of Possagno, where he is buried. His plaster studio there has become a museum."""
style = """
Canova is the master of Neoclassicism: ideal forms, inspired by the antique, clear compositions, a calm beauty in which emotion remains contained. He worked the surface of the marble with extreme care, until he gave it the softness of skin. For his contemporaries, he was the new Phidias; the Romantics reproached him for his coldness."""

[[artistes]]
nom = "Jean-Baptiste Carpeaux"
vie = "Valenciennes, 11 May 1827 – Courbevoie, 12 October 1875"
biographie = """
The son of a mason, Jean-Baptiste Carpeaux followed his family to Paris, where he studied at the Petite École de dessin, then at the École des beaux-arts, in the studio of François Rude. After several failures, he won the Prix de Rome in 1854. At the Villa Medici, he studied Michelangelo and composed, despite the Academy’s reluctance, his group of Ugolino. Back in Paris, he became the favourite sculptor of the Second Empire: he portrayed the Prince Imperial and Princess Mathilde, and decorated the Pavillon de Flore, at the Louvre. For the façade of Charles Garnier’s new Opéra, he sculpted The Dance, unveiled in 1869: the joyful nudity of his dancers caused a scandal, and an unknown person threw a bottle of ink at the group. He then made the Observatory fountain, with the Four Parts of the World. Ill with cancer, in conflict with his wife, he died at forty-eight. His studio circulated numerous reductions of his works."""
style = """
Carpeaux breaks with Neoclassical restraint: his figures laugh, dance, suffer, and the modelling keeps the liveliness of the sketch. An heir of Rude and an admirer of Michelangelo, he seeks movement and expression. His busts capture the personality of his sitters, often caught with a smile. By the energy of his modelling and his taste for drama, he opens the way to Rodin."""

[[artistes]]
nom = "Auguste Rodin"
vie = "Paris, 12 November 1840 – Meudon, 17 November 1917"
biographie = """
The son of a clerk at the police prefecture, Auguste Rodin learned drawing at the Petite École, but failed three times the entrance competition of the École des beaux-arts. For a long time he worked as an ornamentalist and assistant for other sculptors, in Paris and then in Brussels. In 1864, he met Rose Beuret, his companion for a lifetime. A trip to Italy, in 1875–1876, revealed Michelangelo to him. His Age of Bronze, exhibited in 1877, was so true to life that he was accused of having cast it from a living model. In 1880, the state commissioned from him The Gates of Hell, inspired by Dante, on which he would work until his death, and from which The Thinker and The Kiss were born. There followed The Burghers of Calais and the Balzac, rejected by its patrons in 1898. From 1883 to about 1892, he had a passionate affair with the sculptor Camille Claudel. The Universal Exposition of 1900, where he showed his works in a pavilion of his own, brought him international fame. Settled at Meudon and at the Hôtel Biron, he gave his work to the state in 1916; he married Rose in January 1917 and died a few months after her."""
style = """
Rodin frees sculpture from academic conventions: he models by bumps and hollows that make the light vibrate, keeps the imprint of the fingers, dares the fragment, the unfinished, the assemblage of figures. The body expresses thought and passion. Regarded as the father of modern sculpture, he trained or influenced Claudel, Bourdelle, Brancusi and many others."""

[[artistes]]
nom = "Camille Claudel"
vie = "Fère-en-Tardenois (Aisne), 8 December 1864 – Montfavet (Vaucluse), 19 October 1943"
biographie = """
The elder sister of the poet Paul Claudel, Camille Claudel modelled clay from childhood. At Nogent-sur-Seine, the sculptor Alfred Boucher encouraged her; in Paris, she attended classes at the Académie Colarossi. Boucher introduced her to Rodin, who brought her into his studio around 1884: she worked on the hands and feet of the figures of The Gates of Hell and The Burghers of Calais. She became his pupil, his collaborator, his model and his lover. She sculpted Sakuntala, The Waltz, striking portraits. The break with Rodin, in the 1890s, left her alone, without protector or money; she then created her most personal works, The Age of Maturity, The Gossips, The Wave. Little by little, she isolated herself, believed herself persecuted by Rodin and destroyed part of her works. In March 1913, a week after her father’s death, her family had her committed. She spent the last thirty years of her life in asylums, at Ville-Évrard and then at Montdevergues, near Avignon, never sculpting again. A museum has been devoted to her at Nogent-sur-Seine since 2017."""
style = """
Trained alongside Rodin, Camille Claudel distinguishes herself from him by her taste for narrative, for compositions in movement and for small groups from daily life, sometimes inspired by Japanese art. She works marble, onyx and bronze with virtuosity. Long reduced to her role beside Rodin, she is recognised today as a major sculptor."""

[[artistes]]
nom = "Edgar Degas"
vie = "Paris, 19 July 1834 – Paris, 27 September 1917"
biographie = """
The son of a banker, Edgar Degas gave up law for painting. He briefly entered the École des beaux-arts, admired Ingres, and spent three years in Italy, from 1856 to 1859, copying the masters. He began with history paintings and portraits, then turned to modern life: horse races, café-concerts, laundresses, and above all Opéra dancers, whom he observed in rehearsal and backstage. He took part in organising the Impressionist exhibitions from 1874, while refusing the label and open-air painting. He practised pastel, printmaking, monotype, photography. As his sight failed, he worked more and more in sculpture, in the secrecy of his studio, modelling in wax dancers, horses and women at their toilette. He showed the public only one sculpture, the Little Dancer Aged Fourteen, in 1881. At his death, more than a hundred and fifty waxes were found in the studio, many of which were then cast in bronze."""
style = """
Degas composes like a photographer: cropped framings, plunging viewpoints, gestures caught in flight. An outstanding draughtsman, he seeks the truth of movement and of the profession. In sculpture, he works wax freely, like a study, and dares to mix real materials. His waxes, discovered after his death, were a revelation for the sculptors of the twentieth century."""

[[artistes]]
nom = "Antoine Bourdelle"
vie = "Montauban, 30 October 1861 – Le Vésinet, 1 October 1929"
biographie = """
The son of a cabinetmaker, Antoine Bourdelle learned to carve wood in his father’s workshop, then studied at the École des beaux-arts in Toulouse, and at the one in Paris, which he soon left, put off by academic teaching. He settled in the Montparnasse district, where he would keep his studio all his life. His monument to the dead of the war of 1870, at Montauban, completed at the beginning of the century, surprises by its expressive violence. From 1893 to 1908, he worked as an assistant for Rodin, who thought highly of him. He freed himself from him with the Herakles the Archer, in 1909, then with the reliefs of the Théâtre des Champs-Élysées, inspired by Isadora Duncan. He produced great monuments, among them that of General Alvear in Buenos Aires and that of the poet Adam Mickiewicz in Paris. A professor at the Académie de la Grande Chaumière, he trained many pupils, among them Alberto Giacometti and Germaine Richier. His studio became the Musée Bourdelle in 1949."""
style = """
Bourdelle seeks in archaic Greek sculpture and in Romanesque art an architectural grandeur: sharply cut planes, simplified volumes, constructed compositions. He keeps from Rodin the sense of drama and energy, but subjects them to structure. His art forms the link between Rodin and the monumental sculpture of the twentieth century."""

[[artistes]]
nom = "Aristide Maillol"
vie = "Banyuls-sur-Mer, 8 December 1861 – Banyuls-sur-Mer, 27 September 1944"
biographie = """
Born on the Mediterranean shore, in the Pyrénées-Orientales, Aristide Maillol went up to Paris to become a painter and entered the École des beaux-arts. He became close to the Nabis, painted decorative canvases and founded a tapestry workshop at Banyuls. Around 1900, an eye disease forced him to give up this meticulous work: he devoted himself to sculpture, at first in wood and terracotta, then in stone and bronze. The Mediterranean, shown at the Salon d’Automne of 1905, made him famous. Count Harry Kessler became his patron, took him to Greece in 1908 and published books illustrated with his woodcuts. Maillol divided his life between Marly-le-Roi and Banyuls, and sculpted almost exclusively the female body, as well as war memorials for the towns of his region. From 1934, Dina Vierny became his model; she would found the Musée Maillol in Paris. He died in 1944, as a result of a car accident."""
style = """
Maillol opposes to Rodin a sculpture of calm and plenitude: women with full forms, simple poses, closed volumes and smooth surfaces. He rediscovers the spirit of classical Greece without copying it. His modern classicism deeply marked European sculpture in the first half of the twentieth century."""
