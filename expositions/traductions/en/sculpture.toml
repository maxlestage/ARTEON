[[oeuvres]]
titre = "The Thinker"
artiste = "Auguste Rodin"
annee = "model c. 1880"
image = "penseur.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:The_Thinker_MET_DP-13618-011.jpg"
technique = "Bronze, in its original size (approx. 72 cm high)"
collection = "Metropolitan Museum of Art, New York"
note = "Conceived to preside over The Gates of Hell, the poet seated before his work has become the very image of thought."
description = """
A nude man sits on a rock, leaning forward. His chin rests on the back of his right hand, whose elbow, curiously, rests on his left thigh: the whole torso twists to achieve this gesture. The left hand hangs, relaxed, over the knee. The powerful feet grip the rock, the toes curled. The back is rounded, the shoulders massive, the neck thick; the face, in shadow, looks downward, as if into an abyss. No attribute, no garment, no inscription says who he is. In the photograph, the dark patina of the bronze catches the light on the ridges of the muscles and leaves the hollows in blackness."""
evocation = """
Rodin was thinking first of Dante, seated above the Gates of Hell and meditating on his poem before the damned swarming at his feet. On leaving the Gates, the figure loses its name: it becomes “the Thinker”, the man who reflects, and, for many, the image of intellectual effort. Rodin explained that his figure does not think only with his furrowed brow but with all his muscles, down to the clenched toes: thought here is physical labour, almost suffering. This athlete’s body, inherited from Michelangelo, has also been read as that of the labourer or of the creator, and the artist himself chose it to watch over his grave."""
histoire = """
In 1880, the state commissioned from Rodin a monumental door for a future museum of decorative arts. The sculptor chose Dante’s Inferno and placed at the centre of the tympanum a seated figure, about 70 cm high, which he called “the Poet”. The museum never came into being, but Rodin went on working on the Gates and drew independent figures from them. The Thinker was exhibited alone from the late 1880s, then enlarged in 1902–1904 to nearly two metres. This large bronze, given by subscription, was installed in front of the Panthéon in 1906, before joining the garden of the Musée Rodin in 1922. The bronze in the Metropolitan Museum in New York, shown here, takes up the figure’s original size, the one it has on the Gates."""
facture = """
Rodin first models in clay, then the figure is moulded in plaster and cast in bronze by the lost-wax or sand-casting method; each cast receives its patina. The modelling is never smooth: small bumps and hollows make the light vibrate on the skin. The closed pose, folded in on itself, gives the figure the compactness of a block, which Rodin admired in Michelangelo. The hands and feet, deliberately large, concentrate the strength. The enlarged version was made with the help of a specialist in mechanical reduction and enlargement, Henri Lebossé."""
details = [
  "The right elbow resting on the left thigh, which twists the whole torso.",
  "The toes of the right foot, curled over the edge of the rock.",
  "The left hand, left slack, in contrast with the tension of the right.",
  "The overhanging brow ridges, which plunge the gaze into shadow.",
]
themes = ["thought", "dante", "body", "bronze", "meditation"]
anecdote = """
Rodin lies with his companion Rose Beuret in the garden of his house at Meudon, near Paris. Over their grave, both having died in 1917, a large cast of The Thinker keeps watch, as the sculptor wished."""
salle = 1
mur = "ouest"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "The Dying Slave"
artiste = "Michel-Ange"
annee = "1513–1516"
image = "esclave-mourant.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Dying_slave_Louvre_MR_1590,_Louvre.jpg"
technique = "Marble, 2.28 m high"
collection = "Musée du Louvre, Paris"
note = "Carved for the tomb of Pope Julius II and then set aside from the project, the figure seems to slip between sleep and agony."
description = """
A nude young man, larger than life, stands with his weight on his right leg, the left bent. His right arm is folded across his chest, where a thin band of cloth binds his torso; the left arm, raised, passes behind his head. The head is thrown back, the eyes closed, the mouth slightly open. The body seems to slide, as if seized by sleep or by death. Behind him, against the left leg, a barely roughed-out block hints at the silhouette of an ape. The polished marble of the skin contrasts with the parts left rough, streaked by tools, at the bottom of the statue. In the photograph, the white figure stands out against the half-light of a room in the Louvre."""
evocation = """
The title “Dying Slave” is not Michelangelo’s: it is not known exactly what these captives were meant to represent. They have been seen as the provinces subjugated by the pope, as the liberal arts deprived of their protector at the death of Julius II, or, in the Neoplatonic reading, as the soul imprisoned in the body, longing to be freed from it. The ape, a traditional symbol of imitation, would then make this figure an allegory of painting or sculpture. But the work speaks first through the body: ideal beauty, the sensuality of surrender, the band that encircles the chest. The contrast between the abandon of this captive and the violent twisting of his companion, the Rebellious Slave, was no doubt part of the plan."""
histoire = """
In 1505, Pope Julius II commissioned from Michelangelo a colossal tomb, peopled with dozens of statues. The project, constantly interrupted, was scaled down after the pope’s death in 1513; it was then that the artist carved the two Slaves of the Louvre. They ultimately found no place in the tomb, completed in 1545 in the church of San Pietro in Vincoli in Rome, around the Moses. Michelangelo gave them to Roberto Strozzi, a Florentine exile who had taken him in during an illness; Strozzi gave them to King Francis I. They passed to the Constable Anne de Montmorency, at the château of Écouen, then to Cardinal Richelieu, at his château in Poitou. Seized during the Revolution, they entered the Louvre in 1794."""
facture = """
Michelangelo carves the block of Carrara marble directly, attacking the figure from one face, as if freeing it from the stone. The marks of the gradine, the toothed chisel, are still visible on the unfinished parts, while the torso and legs have been polished. This contrast, called the non finito, fascinated the sculptors of the following centuries, Rodin first among them. The spiral pose, the sway of the hip and the thrown-back head derive from the antique, in particular from the Laocoön, discovered in Rome in 1506, which Michelangelo had seen come out of the ground."""
details = [
  "The band of cloth stretched across the chest, the only sign of captivity.",
  "The barely sketched ape, in the block behind the left leg.",
  "The toothed-chisel marks on the marble left rough, at the bottom.",
  "The closed eyelids and slightly open mouth of the thrown-back face.",
]
themes = ["renaissance", "captivity", "marble", "unfinished", "body"]
anecdote = """
Michelangelo spoke all his life of the “tragedy of the tomb”: the tomb of Julius II, commissioned in 1505, occupied him, with successive contracts and lawsuits, for forty years."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.7

[[oeuvres]]
titre = "Bacchanal: A Faun Teased by Children"
artiste = "Le Bernin"
annee = "c. 1616–1617"
image = "bacchanale-faune.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Bacchanal-_A_Faun_Teased_by_Children_MET_DP248148.jpg"
technique = "Marble, carved with his father, Pietro Bernini"
collection = "Metropolitan Museum of Art, New York"
note = "A youthful work, carved at eighteen alongside his father: Bernini’s virtuosity is already announced."
description = """
A young nude faun, crowned with vine shoots, climbs a tree trunk. His body arched backward, he stretches his right arm towards the bunches of grapes and fruit hanging from a branch above. Two chubby children, pressed against one another, have hoisted themselves up near the fruit and push him away or tease him; one of them laughs openly. At the foot of the tree, a third child has fallen over backwards, legs in the air. The trunk, entwined with a vine, carries an animal skin whose head hangs at the bottom of the composition. The whole forms an ascending spiral, discovered by walking around the sculpture: each side offers a different scene."""
evocation = """
The faun and the children belong to the retinue of Bacchus, god of wine: the scene is a celebration, an image of abundance and joyful intoxication. The faun’s desire for the fruit, which the children contest with him, can be read as a play on temptation, or simply as a pastoral comedy, in the manner of the ancient poets. For historians, the work shows above all a young man who wants to prove that he can rival the sculptors of Antiquity, whose works filled Roman collections. The movement, the captured instant and the gaiety announce the style that Bernini would impose on Rome a few years later."""
histoire = """
Bernini grew up in the workshop of his father, Pietro Bernini, a Florentine sculptor settled in Rome. Around 1616–1617, father and son worked together on this group, probably intended for a garden or a collector’s gallery. The share of each is debated: the bold conception and the execution of the figures are often attributed to the son, then about eighteen, while the father is thought to have guided the whole. The group long remained little known to the public. It is today one of the masterpieces of Baroque sculpture in the Metropolitan Museum of Art in New York, where its different sides are discovered by walking around it."""
facture = """
The group is carved from a single block of marble, boldly hollowed out: the outstretched arms, the bunches of grapes and the children’s feet stand free in space. Bernini varies the surfaces to imitate materials: polished, shining skin, hair hollowed with the drill, grooved bark, cut vine leaves, the fur of the animal skin. This ability to make one forget the stone would become his signature, in the Apollo and Daphne or the Rape of Proserpina in the Villa Borghese. The spiral composition invites the viewer to walk around the work."""
details = [
  "The laughing child, at the top, cheek against his companion’s.",
  "The bunches of grapes, hollowed out one by one in the marble.",
  "The child fallen over backwards, at the foot of the tree.",
  "The head of the animal skin, hanging along the trunk.",
  "The faun’s pointed ears and crown of vine shoots.",
]
themes = ["baroque", "bacchus", "childhood", "virtuosity", "marble"]
anecdote = """
Bernini was reputed a child prodigy: according to his first biographers, while still a child he drew, before Pope Paul V, a head of Saint Paul, and the pope is said to have predicted that he would be the Michelangelo of his age."""
salle = 2
mur = "nord"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Psyche Revived by Cupid’s Kiss"
artiste = "Antonio Canova"
annee = "1787–1793"
image = "psyche-ranimee.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Psyche_revived_Louvre_MR1777.jpg"
technique = "Marble, 1.55 × 1.68 m"
collection = "Musée du Louvre, Paris"
note = "Cupid bends down to wake Psyche from a deadly sleep: two bodies seeking one another, forming an X."
description = """
A young woman half-reclining on a rock sits up and raises her arms to embrace the face of a winged young man. He, one knee on the ground behind her, supports her with one arm passed beneath her shoulders and lays his other hand on her breast. Their faces brush, about to kiss. Cupid’s great wings rise towards the sky, while Psyche’s legs stretch out to the right: the two bodies draw an X, whose centre is the circle formed by the arms around the two heads. A drapery slips over Psyche’s hips. In the photo, taken at the Louvre, the white marble stands out against a stone wall turned golden by the light."""
evocation = """
The subject comes from The Golden Ass, the Latin novel by Apuleius. Psyche, a mortal loved by Cupid, must bring back from the Underworld a box of beauty that she must not open; curious, she opens it and falls into a deathlike sleep, until Cupid wakes her. Canova chooses the most tender moment: the return to life through love. Psyche means “soul” in Greek; the myth has been read as the story of the human soul which, after trials, is united with divine love. For many the sculpture was the model of Neoclassicism: a serene sensuality, without violence, frozen on the threshold of the kiss."""
histoire = """
In 1787, in Rome, a Scottish collector, Colonel John Campbell, commissioned from Canova a group after Apuleius. The sculptor worked on it until 1793, but the work was not delivered to its patron. It was bought in the early nineteenth century by Joachim Murat, Napoleon’s brother-in-law, and entered the Louvre in 1824. Canova carved a second version, kept in the Hermitage Museum in Saint Petersburg. The Louvre group is today one of the most admired sculptures in the museum, in the Michelangelo Gallery, not far from the two Slaves, where natural light glides over the polished marble."""
facture = """
Canova first modelled a sketch in clay, then a life-size plaster model, studded with metal reference points; his assistants roughed out the marble from these points, and he reserved the finishing for himself. He polished the surfaces with care and applied to them, it is said, a light wax patina to soften the whiteness and give the stone the warmth of skin. The very finely carved wings and the hollowed-out arms testify to extreme technical virtuosity. The composition is conceived to be seen from several viewpoints."""
details = [
  "The circle of Psyche’s arms around Cupid’s head.",
  "The two raised wings, fine as real feathers.",
  "Cupid’s hand laid beneath Psyche’s breast.",
  "The drapery that slips over the hips and falls onto the rock.",
]
themes = ["neoclassicism", "love", "mythology", "kiss", "marble"]
anecdote = """
In The Golden Ass, Cupid wakes Psyche not with a kiss but with a harmless prick from his arrow; Canova preferred, for his sculpture, the image of a suspended kiss."""
salle = 2
mur = "nord"
place = 3
largeur = 2.0

[[oeuvres]]
titre = "Ugolino and His Sons"
artiste = "Jean-Baptiste Carpeaux"
annee = "1865–1867"
image = "ugolin.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Ugolino_and_His_Sons_MET_DP247545.jpg"
technique = "Marble, nearly two metres high, after the model of 1857–1861"
collection = "Metropolitan Museum of Art, New York"
note = "A father walled up with his children, biting his fingers in despair: Dante’s Inferno in marble."
description = """
On a rock, an elderly man, nude and muscular, sits with his feet clenched one over the other. He raises his hands to his mouth and bites his fingers; his fixed gaze, beneath furrowed brows, is lost in the void. Four boys press around him. One, kneeling, raises a pleading face to him and clings to his leg. Another, younger, nestles against his knee. The smallest is already collapsed, stretched across his brother’s thighs. The bodies pile up in a pyramid, from the father’s leg to his head. The group rests on an octagonal base; in the photograph, the white marble stands out against a plain grey background."""
evocation = """
In Canto XXXIII of the Inferno, Dante meets Count Ugolino della Gherardesca, a Pisan lord walled up in a tower with his sons and grandsons, and condemned to die of hunger. His children offer him their own flesh to feed him. Carpeaux captures the moment when the father, seeing their suffering, gnaws his hands in grief, while they think he is hungry. The poem’s darkest lines, which hint at a terrible outcome, nourished the Romantic imagination. The work expresses the distress of a helpless father, and the intensity of a sculpture that wishes to move as much as history painting."""
histoire = """
A Prix de Rome winner in 1854, Carpeaux had to send from the Villa Medici works proving his progress. Against the advice of the Academy, he chose a subject taken from Dante rather than from Antiquity, and a complex group where a single figure was expected. Modelled in Rome between 1857 and 1861, the plaster was finally accepted and cast in bronze; shown in Paris, it established its author’s reputation. This bronze is today in the Musée d’Orsay. A marble version, of the same size, was then carved in 1865–1867: it is the one kept by the Metropolitan Museum in New York, where it holds pride of place in the great court of European sculpture."""
facture = """
Carpeaux seeks the lesson of Michelangelo, whose figures in the Sistine Chapel he studied in Rome, and of the antique Laocoön, another drama of a father and his sons. The bodies, highly anatomical, interlock in a tight pyramid, which one must walk around to understand its structure. The surfaces keep the energy of the modelling: taut muscles, protruding veins, dishevelled locks. The marble was carved by assistants after the artist’s model, who supervised the finishing."""
details = [
  "The father’s fingers, raised to his mouth and bitten.",
  "The father’s toes, clenched one over the other.",
  "The face of the kneeling son, raised towards his father.",
  "The youngest child, collapsed, already without strength.",
]
themes = ["dante", "hell", "fatherhood", "despair", "romanticism"]
anecdote = """
Rodin, who admired Carpeaux, also placed Ugolino and his children in The Gates of Hell: the father, on all fours, crawls over the bodies of his sons, like a beast."""
salle = 3
mur = "nord"
place = 1
largeur = 1.6

[[oeuvres]]
titre = "The Kiss"
artiste = "Auguste Rodin"
annee = "1882–1898"
image = "baiser.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Rodin_TheKiss_20050609.JPG"
technique = "Marble, 1.82 m high"
collection = "Musée Rodin, Paris"
note = "Paolo and Francesca, the lovers of Dante’s Inferno, caught at the moment of their first kiss."
description = """
On a block of marble left rough, a nude man and woman sit, entwined. The woman has put her arm around the man’s neck and raises her face to him; one of her legs rests on her companion’s. The man leans in to kiss her; his hand, placed on the woman’s thigh, seems to hesitate to touch her, and the other holds a book, almost hidden. The faces, half hidden, meet at the top of the group. The bodies are smooth and polished, the rock rough. The photograph shows the work in a salon of the Hôtel Biron, before dark panelling, on a patterned parquet floor."""
evocation = """
The group represents first of all Paolo Malatesta and Francesca da Rimini, whom Dante meets in the circle of the lustful: reading together the story of Lancelot and Guinevere, they kissed, and Francesca’s husband killed them. Rodin shows them before the fault and the punishment, in the surge of desire. Once out of the Gates of Hell, the group loses its narrative and becomes “the Kiss”, a universal image of carnal love, tender and shared. It has often been pointed out that the woman takes the initiative as much as the man. For Rodin himself, the work remained more traditional than his boldest explorations."""
histoire = """
Rodin modelled the couple around 1882 for The Gates of Hell, then withdrew it from the composition, perhaps because its happiness sat ill with the despair of the other figures. The group quickly enjoyed success in plaster and bronze. In 1888, the state commissioned an enlargement in marble; Rodin had it carved by assistants and showed it at the Salon of 1898, beside the plaster of his Balzac. Exhibited afterwards at the Musée du Luxembourg, then the museum of living artists, it joined the Musée Rodin, at the Hôtel Biron, when the latter opened in 1919. The Kiss is today the most famous work in the museum, shown on the ground floor."""
facture = """
Like most sculptors of his time, Rodin did not carve his marbles himself: he modelled in clay, and assistants transferred the model into stone by pointing, under his supervision. Here he demands a very soft polish on the bodies, which seem bathed in light, and keeps the block on which they sit rough: life is born from formless matter, in the manner of Michelangelo’s non finito. The composition is closed, almost cubic, and the two bodies answer each other in diagonals."""
details = [
  "The man’s hand, laid on the woman’s thigh, barely pressing.",
  "The woman’s arm, passed behind her lover’s neck.",
  "The contrast between the polished skin and the rock left rough.",
  "The book the man holds, a reminder of the reading that doomed the lovers.",
]
themes = ["love", "dante", "kiss", "marble", "desire"]
anecdote = """
There are three great marbles of The Kiss carved in Rodin’s lifetime: that of the French state, in the Musée Rodin; the one commissioned by the collector Edward Perry Warren, now at Tate in London; and that of Carl Jacobsen, in the Ny Carlsberg Glyptotek in Copenhagen."""
salle = 3
mur = "nord"
place = 2
largeur = 1.8

[[oeuvres]]
titre = "The Age of Maturity"
artiste = "Camille Claudel"
annee = "1899 (second version)"
image = "age-mur.jpg"
credit = "Photo : Jean-Pierre Dalbéra"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Lâge_mur_(Musée_Rodin)_(4921654776).jpg"
technique = "Bronze, cast c. 1913"
collection = "Musée Rodin, Paris (gift of Paul Claudel, 1952)"
note = "A mature man walks away, drawn along by an old woman, while a young woman on her knees stretches out her arms to him."
description = """
On an elongated base, undulating like a wave or a sloping terrain, three nude figures follow one another. On the left, an emaciated old woman, wrapped in a large drapery that streams behind her like wings, draws a middle-aged man along, holding him by the shoulders. He advances stumbling, knees bent, his left arm stretched out behind him. On the right, a young woman kneeling holds out both arms to him; their hands no longer touch. The whole group leans to the left, as if swept away. In the photograph, taken at the Musée Rodin, the dark bronze stands out against the pink walls and the large mirror of a salon."""
evocation = """
The work has been read as an allegory of passing time: the man leaves youth to follow old age, or death, which carries him off. But almost always one also sees in it the artist’s own story: Rodin, torn between Camille Claudel, the young suppliant, and his companion Rose Beuret, to whom he remained attached. Paul Claudel, Camille’s brother, saw in it his sister on her knees, begging, abandoned. Claudel nevertheless goes beyond the personal narrative: the emptiness between the hands, the movement of the drapery, the slope of the ground make separation a universal drama, sculpted with a force that belongs to her alone."""
histoire = """
Camille Claudel conceived the group in 1893–1894, at the time she was separating from Rodin. The state commissioned a bronze of it in 1895, but the commission was cancelled in 1899, a decision in which the sculptor saw Rodin’s hand. She then took up the composition again, made a second version of it and had it cast in 1902 for a collector, Captain Tissier: this bronze is in the Musée d’Orsay. The Musée Rodin’s cast, made around 1913, the year Camille Claudel was committed, was given in 1952 by Paul Claudel. It is shown at the Hôtel Biron in the room devoted to the sculptor."""
facture = """
Claudel builds her group on a diagonal that starts from the young woman and rises towards the old woman’s drapery, following the outstretched arms. The drapery, swollen like a sail, is a piece of virtuosity: it carries the composition away. The bodies, modelled with precision, keep the lessons of Rodin’s studio, but the sculptor adds to them a narrative in the manner of a frieze, to be read from right to left. In the first version, the man still held the young woman’s hand; in the second, the hands have parted."""
details = [
  "The emptiness between the young woman’s hands and the man’s.",
  "The old woman’s drapery, swollen like wings.",
  "The man’s bent knees, as he advances in spite of himself.",
  "The sloping base, which draws the whole group to the left.",
]
themes = ["separation", "old age", "fate", "autobiography", "bronze"]
anecdote = """
The kneeling young woman was also issued alone in bronze, under the title The Implorer, by the founder and dealer Eugène Blot, who supported Camille Claudel in her difficult years."""
salle = 4
mur = "nord"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "Little Dancer Aged Fourteen"
artiste = "Edgar Degas"
annee = "1878–1881"
image = "petite-danseuse.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Edgar_Degas,_Little_Dancer_Aged_Fourteen,_1878-1881,_NGA_110292.jpg"
technique = "Wax, hair, silk ribbon, tutu and fabric slippers; nearly one metre high"
collection = "National Gallery of Art, Washington"
note = "The only sculpture Degas ever exhibited: a little Opéra dancer, in wax, dressed in a real tutu."
description = """
A thin adolescent stands with her head raised, her eyes half-closed. Her hands are clasped behind her back, her arms stretched back, and her right leg is advanced, the foot turned outward, in a dancer’s position of rest. She wears a fitted bodice, a tulle tutu and slippers; her hair, real hair, is tied in a braid by a ribbon. The face, with its pointed chin and tight lips, is not idealised. In the photograph, the browned wax of the skin contrasts with the yellowed fabric of the bodice and the grey of the tutu, against a plain grey background."""
evocation = """
Degas shows a “petit rat” of the Opéra, one of those girls from poor families who entered the dance school very young. The proud pose, chin lifted, speaks at once of the discipline of the profession and of a form of defiance. In 1881, critics were shocked: they spoke of ugliness, of vice, of the criminal type, which says much about how these children were then viewed. Today one sees rather a figure of startling truth, and one of the most modern works of its time: sculpture leaves marble and myth behind for the reality of modern life."""
histoire = """
The model was Marie van Goethem, a young pupil of the Paris Opéra dance school, from a family of Belgian origin. Degas worked on the figure from 1878, drawing his model from every angle and first modelling a nude version. Announced in 1880, the sculpture was shown only at the sixth Impressionist exhibition, in 1881, in a glass case. It never left the studio afterwards. After Degas’s death in 1917, the wax was found and cast in bronze, from 1922, in about thirty examples. The original wax, acquired by the collector Paul Mellon, entered the National Gallery of Art with his collection."""
facture = """
Degas models the figure in coloured wax over a metal armature, using salvaged materials to fill it out. Then he dresses it in real clothes: bodice, tulle tutu, canvas slippers, a wig of real hair and a silk ribbon. He partly covers the fabrics with wax to blend them into the figure. This mixture of materials, unprecedented at the time in fine-art sculpture, recalls dolls and anatomical wax figures; it foreshadows the assemblages of the twentieth century."""
details = [
  "The ribbon tied on the braid of real hair.",
  "The hands clasped behind the back, arms stretched.",
  "The right foot advanced and turned outward.",
  "The lifted chin and half-closed eyes.",
]
themes = ["dance", "opera", "childhood", "wax", "modern life"]
anecdote = """
At the 1881 exhibition, the dancer was shown in a glass case, like a museum specimen: a choice made by Degas, which heightened the unease of many visitors."""
salle = 4
mur = "nord"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Herakles the Archer"
artiste = "Antoine Bourdelle"
annee = "1909"
image = "herakles-archer.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Herakles_the_Archer_-_MET_-_24.232.jpg"
technique = "Bronze with gilded patina"
collection = "Metropolitan Museum of Art, New York"
note = "The hero, bow drawn, aims at the birds of Lake Stymphalus: a line of force that breaks with Rodin’s modelling."
description = """
A nude man, with knotted muscles, draws a great bow. His right foot rests very high on a rock, the leg folded horizontally, while the left, stretched out behind, bears on the ground. The torso leans forward; the left arm, extended, holds the bow, whose curve rises above him, and the right arm pulls the string. The head, in profile, aims at an invisible target. The body and the bow form a geometric figure, made of straight lines and angles. In the photograph, the gilded bronze is silhouetted against a large bay window opening onto trees."""
evocation = """
The subject is one of the twelve labours of Hercules: killing the monstrous birds of Lake Stymphalus, with their bronze feathers. Bourdelle makes of it a symbol of human energy concentrated on a goal. The work was hailed as a manifesto: after Rodin’s quivering modelling, it rediscovers the rigour of archaic Greek sculpture, which Bourdelle admired, and construction by large planes. It expresses an extreme tension, yet controlled, almost architectural. In the early twentieth century, it opened the way to a sculpture that sought structure rather than life."""
histoire = """
Bourdelle, after fifteen years as Rodin’s assistant, was seeking his own path. In 1909, he modelled the Herakles after a sporting officer, Commandant Doyen-Parigot, who posed for him in this difficult position. The work was exhibited at the Salon of the Société nationale des beaux-arts in 1910 and met with immediate success. The collector Gabriel Thomas financed the first cast. The sculptor then made several versions of it, in different sizes. The example in the Metropolitan Museum in New York entered it in 1924, in the artist’s lifetime. Others are in the Musée Bourdelle in Paris, the Musée d’Orsay and at Montauban, his native town."""
facture = """
Bourdelle builds the figure in clean planes, like an architect: the muscles are simplified into angular masses, the contours are sharply cut. The composition rests on triangles and diagonals, in the very plane of the bow, so that the sculpture reads almost like a relief, from the front. The rock, treated in rough blocks, serves as a counterweight. The head, with its stylised face, recalls the warriors of the pediments of the temple of Aegina, which can be seen in Munich."""
details = [
  "The right foot, set very high on the rock.",
  "The immense bow, whose curve dominates the whole figure.",
  "The muscles of the back, treated in angular planes.",
  "The face in profile, straining towards the target.",
]
themes = ["mythology", "hero", "tension", "archaism", "bronze"]
anecdote = """
Bourdelle’s studio, in the Montparnasse district, has become the Musée Bourdelle, opened in 1949; the street where it stands, the former impasse du Maine, now bears his name."""
salle = 5
mur = "nord"
