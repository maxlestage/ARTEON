[[oeuvres]]
titre = "The Mediterranean"
artiste = "Aristide Maillol"
annee = "1902–1905"
image = "mediterranee.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:La_Méditerranée_-_Aristide_Maillol_-_Musée_du_Louvre_Sculptures_des_jardins_FNAC_9492_-_TU_254.jpg"
technique = "Bronze"
collection = "Jardin des Tuileries, Paris (Musée du Louvre)"
note = "A seated woman, her head in her hand: neither story nor drama, only volumes in balance."
description = """
A nude woman sits on a low base. Her right leg is folded and raised, the knee high; the left lies beneath her. Her right elbow rests on this knee and her hand supports her inclined head, while the left hand bears on the base. The face, calm, with regular features, looks downward. The forms are full, the shoulders broad, the thighs powerful; the whole body fits within a compact volume. The photograph shows the bronze, with its verdigris patina, set on a stone pedestal in an alley of the Tuileries, before clipped trees."""
evocation = """
Maillol gave his statue the name of the sea of his childhood, at Banyuls: it tells no story, it embodies a land, a light, a balance. After Rodin, who sculpted movement and passion, it offers calm and measure, in the spirit of Greek sculpture. The pose of the head in the hand, the traditional image of meditation, here refers to no narrative. It has been seen as the starting point of a modern classicism, attentive to forms alone, which marked all the sculpture of the interwar period."""
histoire = """
Maillol, who had just left painting and tapestry for sculpture, worked on this figure at the beginning of the century, after his wife, Clotilde. The plaster, shown at the Salon d’Automne of 1905, caused a sensation. The German count Harry Kessler, his patron, commissioned a version in stone. Much later, in 1923, the state commissioned a marble, completed in 1927, now in the Musée d’Orsay. The Maillol bronzes installed in the Carrousel and Tuileries gardens come from the donation of Dina Vierny, his last model, accepted in 1964 by André Malraux, then Minister of Cultural Affairs."""
facture = """
Maillol models simple, closed volumes: the body fits within a cube, with almost no void between the limbs. The surfaces are smooth, without the accidents of light dear to Rodin; details fade before the mass. The robust proportions refuse the elongated elegance of academic nudes. This taste for full form comes from Greek Antiquity, from Egyptian sculpture and from the Romanesque art of his native Roussillon, but also from the work of Gauguin, whom he knew in the time of the Nabis."""
details = [
  "The head, resting on the hand, inclined downward.",
  "The raised right knee, which serves as a support for the elbow.",
  "The left hand, flat on the base.",
  "The compact profile of the body, with no arm detached into the void.",
]
themes = ["classicism", "mediterranean", "nude", "calm", "bronze"]
anecdote = """
At the Salon d’Automne of 1905, the writer André Gide wrote of the statue: “It is beautiful; it means nothing; it is a silent work.” The same Salon caused a scandal with the canvases of Matisse and his friends, the Fauves."""
salle = 5
