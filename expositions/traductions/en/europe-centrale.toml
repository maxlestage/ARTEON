[[oeuvres]]
titre = "Stańczyk"
artiste = "Jan Matejko"
annee = "1862"
image = "stanczyk.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Jan_Matejko_-_Stańczyk_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 88 × 120 cm"
collection = "National Museum in Warsaw"
note = "During a ball at court, the king's jester remains alone, overwhelmed: he has just learned of the loss of Smolensk."
description = """
In a dark room of the royal castle, a man dressed in red from head to foot, wearing a jester's cap with bells, is slumped in a large wooden armchair. His legs stretched out, his hands folded over his stomach, he stares at the floor, his face closed. On the table to his left, covered with an embroidered cloth, an opened letter lies among other papers. Behind him, a window opens onto the night: one can make out the towers of Wawel Cathedral and, in the sky, a comet. On the right, through an open door, a brightly lit hall: courtiers in festive dress dance and laugh. On the floor, in front of the jester, lies his bauble, the fool's-head sceptre he has let fall."""
evocation = """
Stańczyk, jester to the Jagiellonian kings in the early sixteenth century, had remained in Polish memory as a sage disguised as a fool. Matejko makes him the only clear-sighted man at court: while the others dance, he has understood that the loss of Smolensk, taken by Moscow in 1514, foretells the kingdom's decline. The comet, an omen of misfortune, and the abandoned bauble say the same thing. Painted in 1862, when Poland was partitioned among its neighbours, on the eve of the January Uprising of 1863, the picture addresses its contemporaries: it sets the carelessness of the elites against a painful awareness of history. Matejko gave the jester his own features, as if he recognised himself in this powerless witness."""
histoire = """
Matejko was twenty-four when he painted this canvas in Kraków; it made him famous. Its full title places it during a ball at the court of Queen Bona, which is inaccurate: in 1514, Bona Sforza had not yet married King Sigismund I, and the letter on the table bears the date 1533, a contradiction that historians still debate. The Society of Friends of Fine Arts in Kraków bought the painting for its lottery; a winner named Korytko kept it. The National Museum in Warsaw acquired it in 1924. Looted by the Nazis during the Second World War, then seized by the Soviet Union, it returned to Poland only around 1956. In 2024–2025, the Louvre showed it in the exhibition “Figures of the Fool”."""
facture = """
Matejko builds his picture in two opposing spaces: on the left, the gloom in which the jester sits; on the right, the ballroom, bright and blurred. The red of the costume, almost monochrome, stands out against the deep green of the curtain and the brown of the panelling. The painter describes the materials with care, the embroidered tablecloth, the carved wood of the armchair, the crumpled paper, but leaves the dancers in a hazy blur. This theatrical staging, inherited from Munich history painting, aims to make one think as much as to move."""
details = [
  "The letter with the red seal on the table, announcing the bad news.",
  "The comet in the night sky, near the cathedral towers.",
  "The jester's bauble, abandoned on the floor at right.",
  "Stańczyk's folded hands, inert, at the exact centre of the picture.",
  "The blurred dancers of the neighbouring hall, in a golden light.",
]
themes = ["history", "jester", "poland", "omen", "solitude"]
anecdote = """
In 1869, young conservatives in Kraków published satirical pamphlets under the title “Stańczyk's Portfolio” (Teka Stańczyka). Their political camp, influential in Galicia for decades, would keep the name “Stańczycy”."""
salle = 2
mur = "ouest"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "At the Grave of a Warrior of God (The Last Taborite)"
artiste = "Mikoláš Aleš"
annee = "1877"
image = "dernier-taborite.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Ales_U_hrobu.jpg"
technique = "Oil on canvas, 48 × 75.5 cm"
collection = "National Gallery in Prague"
note = "In the snow, an old Hussite horseman halts before a grave, while in the distance a village burns."
description = """
A snow-covered plain stretches beneath a low sky, grey and gold. In the centre, a horseman on a brown horse has come to a halt. He wears a cuirass, a worn cloak and a fur cap; his long lance, adorned with a pennant, rises towards the sky. His hands clasped on the pommel of the saddle, he bows his head, and so does his horse, its nose almost in the snow. Before him, a large snow-covered rock and two leaning wooden crosses mark graves. On the left, in the distance, an armed troop passes; on the right, behind him, houses burn and smoke rises. Black birds wheel above the plain. The painting is signed and dated at lower right."""
evocation = """
The “warriors of God” are the Hussites, followers of the reformer Jan Hus, burned at Constance in 1415; the Taborites were their most radical wing, defeated in 1434 at the Battle of Lipany. The title makes this horseman the last survivor of a lost cause, come to pay his respects at a companion's grave. In the Bohemia of 1877, governed from Vienna, the Hussite past had become a national symbol, that of a people able to rise up for its faith and its language. Aleš shows not its glory but its mourning: the image of a fidelity that survives defeat, in a winter landscape where everything seems over."""
histoire = """
Aleš painted this small picture in 1877, shortly after leaving the Academy of Fine Arts in Prague, at a time when he was living in poverty. It was also the year in which he prepared, with František Ženíšek, his designs for the decoration of the National Theatre, the great undertaking of Czech artists of his generation. His history paintings, dark and meditative, then found few buyers, and Aleš would turn more and more to drawing and illustration, which would make him popular. The work now belongs to the National Gallery in Prague, which holds a large body of his paintings and drawings."""
facture = """
On this modest format, Aleš works with a restricted range: the bluish white of the snow, the greys and golds of the sky, the browns of the horse and the rider. The sky is brushed in broad visible strokes, almost like a sketch, while the harness, the cuirass and the lance are described with precision. The dark silhouette of the horse, cut out against the snow, carries all the emotion. One senses the draughtsman, who thinks in clean outlines, and the Romantic heritage of winter landscapes."""
details = [
  "The horse's lowered head, which seems to share its master's grief.",
  "The two leaning wooden crosses, half buried in the snow.",
  "The burning village on the horizon, at right.",
  "The armed troop moving away in the distance, at left.",
  "The signature “M. Aleš 1877”, at lower right.",
]
themes = ["hussites", "winter", "mourning", "bohemia", "horseman"]
anecdote = """
The Hussite chorale, “Ye Who Are Warriors of God” (Ktož jsú boží bojovníci), also resounds in Bedřich Smetana's My Country: the composer quotes it in the symphonic poems Tábor and Blaník, written at the same time as this painting."""
salle = 2
mur = "sud"
place = 4
largeur = 1.1

[[oeuvres]]
titre = "The Slavs in Their Original Homeland (The Slav Epic, I)"
artiste = "Alfons Mucha"
annee = "1912"
image = "slaves-patrie-origine.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Slovane_v_pravlasti_81x61m.jpg"
technique = "Egg tempera and oil on canvas, 610 × 810 cm"
collection = "City of Prague"
note = "The first of the twenty canvases of the Slav Epic: a Slavic couple hides in the night while a village burns."
description = """
Beneath an immense starry sky, a plain stretches into the night. In the foreground, at lower left, a man and a woman dressed in white crouch in the undergrowth: they cling to each other, and one of them stares at the viewer with eyes widened by fear. Behind them, armed horsemen drive stolen herds before them, and on the horizon, at left, a village is in flames. On the right, like an apparition hanging in the sky, a bearded pagan priest, bare-chested and crowned, spreads his arms wide. A golden sword hangs from his belt. He is supported by two figures: a young man on one side, and a girl with blue flowers on the other. Their long white robes fall down to the undergrowth."""
evocation = """
The painting's subtitle, “Between the Turanian Whip and the Sword of the Goths”, sums up Mucha's vision: the first Slavs, a peaceful people of farmers and shepherds, caught between the nomads from the east and the Germanic warriors. The hidden couple, who have been called the Adam and Eve of the Slavs, embody the suffering of an entire people. In the sky, the priest implores the gods; according to the usual interpretation, the young man represents just, defensive war, and the girl peace. Mucha, who had become famous in Paris through his posters, wanted to tell the history of the Slavic peoples in order to give them confidence in their future. The work thus combines realism and mystical vision."""
histoire = """
The idea of a great epic of the Slavs matured in Mucha in the early twentieth century. In 1909 he obtained the support of the American patron Charles Richard Crane, and in 1910 he rented part of Zbiroh Castle in Bohemia to paint his giant canvases there. This one, the first of the cycle, was completed in 1912. The first eleven canvases were shown at the Clementinum in Prague in 1919; the complete cycle of twenty canvases was presented in 1928 at the Exhibition Palace and given to the city of Prague, on condition that it build a pavilion to house it. Hidden during the war, the Epic was exhibited from 1963 at Moravský Krumlov Castle, then in Prague and abroad."""
facture = """
Mucha paints in egg tempera, with highlights in oil, on a canvas of more than six metres by eight. He adopts a muted range of blues, greys and mauves, in which the whites of the garments and the orange of the fire burst out. The composition superimposes two worlds: below, a realistic scene, painted from models he had pose and photographed; above, a luminous, almost transparent vision. The stars, placed in small touches, give the sky its depth. One recognises the Art Nouveau draughtsman in the long robes that fall like ribbons."""
details = [
  "The wide-open eyes of one of the two fugitives, looking straight at us.",
  "The burning village, on the left horizon.",
  "The horsemen leading away the herds, in the centre.",
  "The priest suspended in the sky, arms open, at right.",
  "The golden sword hanging from the priest's belt.",
]
themes = ["epic", "slavs", "night", "mythology", "nation"]
anecdote = """
The twenty canvases of the Slav Epic occupied Mucha for nearly eighteen years, from 1910 to 1928. As the promised pavilion was never built in his lifetime, the cycle has since undergone numerous moves between Prague and Moravia."""
salle = 2
mur = "nord"
place = 3
largeur = 4.5

[[oeuvres]]
titre = "The Condemned Cell I"
artiste = "Mihály Munkácsy"
annee = "1870"
image = "cellule-du-condamne.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Munkácsy,_Mihály_-_Condemned_Cell_I_-_Google_Art_Project.jpg"
technique = "Oil on panel, 139 × 193.5 cm"
collection = "Hungarian National Gallery, Budapest"
note = "On the eve of his execution, a Hungarian outlaw receives a visit from villagers: the picture that made Munkácsy famous at the Paris Salon."
description = """
In a vaulted cell with bare stone walls, light falls from a small barred window. At centre right, a moustached man in a white shirt and dark waistcoat sits at a table covered with a white cloth, on which two candles burn. His elbow resting on the table, he looks ahead with a hard, absent expression. Behind him, a soldier stands guard, a fixed-bayonet rifle in hand. On the right, a woman in black weeps, her forehead against the wall, and a little girl in a red skirt stands beside her. On the left, villagers have come to see the condemned man: men in hats, an old woman, a young girl with a basket, a mother and her baby. In the foreground, a boy approaches, his hands clasped; a bowl lies on the floor."""
evocation = """
The main figure is a betyár, one of those outlaws of the Great Hungarian Plain. After the failure of the War of Independence of 1848–1849, many young men had taken to the bush, and the people often saw them as heroes rather than criminals. The law allowed the condemned man to receive his relatives and the curious before the execution. Munkácsy does not say whether this man is innocent or guilty: the whole force of the picture lies in this uncertainty, and in the variety of reactions, pity, curiosity, prayer, despair. It has been seen as a social critique, nourished by French realism, and as a meditation on death and justice."""
histoire = """
Munkácsy painted this picture in Düsseldorf, where he was studying with the genre painter Ludwig Knaus; it was his first important work. Exhibited at the Paris Salon in 1870, it was widely noticed there and earned the twenty-six-year-old painter a medal, then immediate fame. An American collector bought it shortly after its completion, and the canvas left for the United States. Munkácsy, settled in Paris from 1871, took up the subject again in other versions. Nearly a century later, the Hungarian state acquired this first version from a private collector; it is displayed at the Hungarian National Gallery, in Buda Castle."""
facture = """
Munkácsy paints on a wooden panel, on a very dark ground from which the figures emerge in touches of light: white shirts, tablecloth, faces. His brown, almost black palette is typical of his early years; he liked bitumen, a pigment that gives the shadows a deep velvet. The composition arranges the figures as on a theatre stage, in a semicircle around the condemned man, each with a gesture that tells of his or her emotion. The broad, vigorous brushwork breaks with the smooth finish of academic painters."""
details = [
  "The two lit candles on the white cloth, beside the condemned man.",
  "The woman in black weeping against the wall, at right.",
  "The boy with clasped hands, in the foreground.",
  "The bowl on the floor, perhaps to collect alms.",
  "The light falling from the barred window, at top centre.",
]
themes = ["realism", "prison", "death", "hungary", "people"]
anecdote = """
Bitumen, which Munkácsy readily used for his shadows, never truly dries: over time, it darkens and causes the paint to crack. Many of his canvases have thus grown darker, and now pose difficult restoration problems."""
salle = 3
mur = "sud"
place = 2
largeur = 1.95

[[oeuvres]]
titre = "The Attack at Smârdan"
artiste = "Nicolae Grigorescu"
annee = "1885"
image = "attaque-smardan.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Nicolae_Grigorescu_-_Atacul_de_la_Smardan_-_Muzeul_National_de_Arta_al_Romaniei.jpg"
technique = "Oil on canvas, 295 × 388 cm"
collection = "National Museum of Romanian History, Bucharest"
note = "January 1878: in snow and smoke, the Romanian infantry storms an Ottoman redoubt."
description = """
A snowy plain disappears beneath a grey sky and thick gunpowder smoke. From right to left, a line of Romanian infantrymen surges forward, bayonets fixed, bent forward. They wear grey greatcoats and black caps with red pompoms. In the right foreground, a soldier taller than the others advances with a determined step, his rifle held tight against him. In the distance, at left, through the smoke, one can make out the red patches of the fezzes of the Ottoman soldiers defending the position. In the foreground, a dead soldier lies on his back in the snow, his rifle beside him; farther off, a fallen cap and another body. No general, no flag: only men in the cold."""
evocation = """
The taking of Smârdan, near Vidin in Bulgaria, on 12 January 1878 according to the Julian calendar then in use (24 January by ours), was one of the last battles of the Romanian War of Independence against the Ottoman Empire. Romania had proclaimed its independence in May 1877; it would be recognised at the Congress of Berlin in 1878. Grigorescu makes it a founding image of the nation, but an image without emphasis: the hero is collective and anonymous, and death is in the foreground. The soldiers' charge and the body lying in the snow together speak of the price of freedom. The painting has become an icon of Romanian national memory."""
histoire = """
In 1877, Grigorescu was one of the four official painters sent to the front with the Romanian army, alongside Carol Popp de Szathmari, Sava Henția and George Demetrescu Mirea. There he filled sketchbooks with soldiers, wounded men and prisoners. Back in the studio, he drew from them several battle paintings, including this large canvas completed in 1885. Later replicas exist. The original belongs to the National Museum of Romanian History in Bucharest. Absent from the walls for more than twenty years, the canvas was shown there again in 2023–2024, after a major restoration, in an exhibition devoted to the painters of the War of Independence."""
facture = """
Grigorescu, trained among the Barbizon painters, treats the battle as an atmospheric landscape: snow, smoke and sky merge into a single range of bluish greys, in which only the pompoms and the fezzes add red points. Movement is given by the diagonal of the line of soldiers, rising from right to left, and by the silhouette of the tall infantryman in the foreground. The brushwork is rapid, almost sketched in the distance, more precise in the nearer figures, nourished by the sketches made at the front."""
details = [
  "The dead soldier in the foreground, lying on his back, his rifle beside him.",
  "The black cap with a red pompom fallen in the snow.",
  "The red fezzes of the Ottoman defenders, barely visible in the smoke.",
  "The tall infantryman on the right, bayonet raised towards the sky.",
  "The painter's signature and the date, at lower left.",
]
themes = ["war", "independence", "romania", "snow", "soldiers"]
anecdote = """
Grigorescu had begun his career as an icon painter: as a teenager, he painted holy images and, in the late 1850s, decorated the church of Agapia Monastery, in Moldavia, before leaving to study in France."""
salle = 3
mur = "nord"
place = 3
largeur = 3.9

[[oeuvres]]
titre = "Indian Summer (Babie lato)"
artiste = "Józef Chełmoński"
annee = "1875"
image = "babie-lato.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Józef_Chełmoński_-_Indian_summer_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 119.7 × 156.5 cm"
collection = "National Museum in Warsaw"
note = "Lying in an autumn meadow, a young shepherdess plays with the gossamer threads floating in the air."
description = """
A young peasant girl lies on her back in a meadow of short grass, on a linen cloth. She wears a long white skirt and shirt, a yellow headscarf, a necklace on a dark cord and a ring. Barefoot, her eyes half closed, she raises her right arm and holds between her fingertips long silvery spider threads that the wind carries away. Near her left hand lies her shepherd's whip, a stick fitted with a cord. Behind her, a black dog sits watching the herd. The very low horizon cuts across the picture: one sees spotted cows, brown and white, and a few peasant silhouettes. Above, a great grey-blue sky, partly overcast, occupies more than half of the canvas."""
evocation = """
In Polish, babie lato means both Indian summer, those last fine days of autumn, and gossamer, the filaments that young spiders let float in the air at this season. Chełmoński captures a moment of idleness and reverie: the shepherdess forgets the herd, and the world seems suspended. The painting grew out of the painter's journey to Ukraine, on the eastern borders of the former Poland, in the spring and summer of 1874. It shows the countryside without idealising it: the girl is a real peasant, with dirty feet, caught in an almost sensual abandon. It was this frankness that shocked part of the public of the time."""
histoire = """
Chełmoński painted the picture in Warsaw and submitted it for sale in early 1875 at the Society for the Encouragement of Fine Arts, the Zachęta. The critic Lucjan Siemieński mocked it in the newspaper Czas: the gossamer scene is poetic, he wrote, but the girl's feet ought to have been washed. The painter took the canvas to Paris, then probably sold it around 1885 to Count Ignacy Korwin-Milewski. The National Museum in Warsaw bought it in 1924. Carried off by the Germans to Austria at the end of the war, it was found in 1945 at Fischhorn Castle and returned to Warsaw in 1946."""
facture = """
Chełmoński, trained in Warsaw and then in Munich, paints in a naturalist vein. His palette is muted, made of browns, greys and subdued greens; only the white of the skirt, worked in thick impasto, and the yellow of the headscarf light up the canvas. The very low horizon leaves an immense place for the sky, brushed in light touches. The figure, seen foreshortened, feet towards us, stretches diagonally across the whole width of the picture. The spider threads are traced with a very fine brush, almost invisible."""
details = [
  "The gossamer threads, almost invisible, between the girl's fingers.",
  "The seated black dog, watching the herd in her place.",
  "The bare, dusty feet, in the foreground at left.",
  "The shepherd's whip lying near her left hand.",
  "The signature “Józef Chełmoński 1875”, at lower left.",
]
themes = ["autumn", "peasant", "reverie", "countryside", "realism"]
anecdote = """
On 29 September 1944, during the Warsaw Uprising, the painting was for a time used to block a window of the museum. The director Stanisław Lorentz, who noted it in his diary, had it taken down and put in a safe place."""
salle = 3
mur = "sud"
place = 4
largeur = 1.6

[[oeuvres]]
titre = "Picnic in May (Majális)"
artiste = "Pál Szinyei Merse"
annee = "1873"
image = "pique-nique-en-mai.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Szinyei_Merse,_Pál_-_Picnic_in_May_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 127 × 162.5 cm"
collection = "Hungarian National Gallery, Budapest"
note = "Young people picnic on a hillside in the May sun: an open-air scene painted a year before the first Impressionist exhibition."
description = """
On the slope of a brilliantly green hill, partly in shade, six young people have settled down for a lunch on the grass. On a large red blanket, a man in a black hat leans on his elbow, beside a young woman in a white dress with purple bows. Next to them, a man in a dark coat holds the hand of a red-haired young woman in a pink dress, a fan in her hand. Another man, lying on his stomach, seen from behind, leans over the remains of the meal: a basket, a bottle, plates on a white cloth. In the foreground, a man wearing a straw boater bends down to pick a flower. The grass is strewn with poppies and wildflowers; at the top of the hill, two women strollers with parasols are silhouetted against the sky."""
evocation = """
The painting celebrates spring, youth and the pleasure of being together in the sun, in a happy harmony between people and nature. Szinyei drew on the picnics of the Munich artists, where he was living at the time. He arrived at open-air painting and clear colour at the same time as the French Impressionists, but without knowing them: the first Impressionist exhibition took place in Paris only in 1874. For Hungarians, Majális has become the very image of carefreeness and light, and a symbol of the modernity of their painting. The title refers to the May festival, a traditional country outing in spring."""
histoire = """
Szinyei painted the canvas in Munich in 1873, on his return from a stay in his native Upper Hungary. His contemporaries, accustomed to dark, polished history painting, ridiculed it: these raw greens and coloured shadows seemed unfinished to them. Discouraged by the critics and by family worries, the painter stopped painting in the early 1880s and withdrew to his estate. It took a retrospective organised by his friends in 1894 for his work to be finally recognised. Szinyei later became president of the Hungarian Royal Academy of Fine Arts in Budapest. It is today one of the best-loved paintings in the Hungarian National Gallery."""
facture = """
Szinyei paints in pure, saturated colours: frank greens for the grass, which the light turns from yellow to blue, and the bright red of the blanket, the complementary colour, which makes the whole vibrate. The shadows are no longer brown but green or violet. The very balanced composition places the group in an oval at the centre of a diagonal slope. The brushwork remains more constructed and smoother than that of the Impressionists, heir to the teaching of Munich. A fine network of cracks can be made out today in the sky."""
details = [
  "The man lying on his stomach, seen from behind: it is the painter himself.",
  "The large red blanket, answering the green of the hill.",
  "The two tiny parasol-bearing strollers at the top of the hill.",
  "The poppies scattered in the grass around the group.",
  "The man in the boater picking a flower, in the foreground.",
]
themes = ["spring", "open air", "youth", "picnic", "colour"]
anecdote = """
Szinyei recounts in his memoirs that he painted himself into the picture: he is the young man lying flat on his stomach, seen from behind, busy eating, at the centre of the group."""
salle = 4
mur = "sud"
place = 3
largeur = 1.65

[[oeuvres]]
titre = "Ruins of the Greek Theatre at Taormina"
artiste = "Tivadar Csontváry Kosztka"
annee = "1904–1905"
image = "theatre-taormine.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Csontváry_Kosztka,_Tivadar_-_Ruins_of_the_Greek_Theatre_at_Taormina_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 302 × 570 cm"
collection = "Hungarian National Gallery, Budapest"
note = "The ancient theatre of Taormina, in Sicily, facing the sea and snow-capped Etna, beneath a golden-yellow sky: a gigantic vision."
description = """
In the foreground stretches the ancient theatre of Taormina, seen from the tiers of seats: the brick stage wall, pierced with arches and adorned with a few columns, is in ruins, and blocks of white marble lie in the grass-grown orchestra. Through the gaps in the wall, one sees the intensely blue sea, a bay with a curved beach and a village at the water's edge. Beyond, a long chain of dark mountains rises to the right up to the snow-capped cone of Etna, from which a plume of smoke escapes. On the right, on the hill, stand the houses of Taormina. The sky is strange: a band of luminous golden yellow on the left, topped by mauve clouds and a green streak. Through an arch, at right, one glimpses a flowering tree."""
evocation = """
Csontváry claimed to be called to become the greatest “painter of the sun route”; he sought out places where light and history meet. At Taormina, he found everything at once: the ruins of a vanished civilisation, the sea, the volcano and the sun. The painting sets collapsing human work against eternal nature, the time of men against that of the earth. Its unreal colours and obsessive precision give it the character of a vision, between landscape and apparition. His art has often been compared to naive painting and to Expressionism, but he belongs to no school."""
histoire = """
Csontváry, a former pharmacist who became a painter at over forty, travelled to Italy and stayed at Taormina in 1904. There he painted this immense canvas, nearly six metres wide, from a viewpoint already chosen by the Romantic painters, and completed it in 1905. He exhibited his large canvases in Paris in 1907, then in Budapest, where they were misunderstood. At his death in 1919, his work was almost unknown. Saved by an admirer, his canvases were gradually recognised as a national treasure. This one, among the most famous in Hungarian painting, is displayed at the Hungarian National Gallery, in a cabinet devoted to the painter."""
facture = """
Csontváry paints in oil in broad flat areas of saturated colour, set side by side without transition: the yellow of the sky, the blue of the sea, the white of Etna. He almost entirely gives up atmospheric perspective, so that the distances are as sharp as the foreground. The ruins, by contrast, are described brick by brick, with meticulous care. The very elongated format, twice as wide as high, unfolds the landscape like a panorama. The lines of the drawing remain visible in places."""
details = [
  "The plume of smoke escaping from snow-capped Etna, at right.",
  "The flowering tree glimpsed through an arch of the stage wall.",
  "The blocks of white marble scattered in the orchestra.",
  "The houses of Taormina, on the hill at right.",
  "The band of golden-yellow sky, beneath the mauve clouds.",
]
themes = ["ruins", "volcano", "sicily", "sun", "vision"]
anecdote = """
According to an often-repeated story, after the painter's death in 1919, his large canvases were nearly sold as covers for carts; the young architect Gedeon Gerlóczy bought them at auction and saved them."""
salle = 4
mur = "nord"
