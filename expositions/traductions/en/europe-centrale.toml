[exposition]
ordre = 128
nom_court = "Central Europe"
mouvement = "Central and Eastern Europe, 19th century"
cadre = "dore"
couleur = "#7d2f3a"
titre = "Central and Eastern Europe, Painters of the Nations"
artiste = "Matejko, Mucha, Munkácsy, Boznańska, Csontváry, Osman Hamdi…"
dates = "1862–1912"
accroche = "Virtual exhibition · Sukiennice Gallery, Kraków"
introduction = """
From Kraków to Budapest, from Prague to Bucharest and Istanbul, nineteenth-century painters trained in Munich, Vienna or Paris return home with a mission: to give an image to peoples without a state or to brand-new states. The visit brings together eleven Polish, Czech, Hungarian, Romanian and Ottoman artists, from the great history painting of Matejko and Mucha to peasant realism, the open-air painting of Szinyei Merse and the visions of Malczewski and Csontváry. The building is inspired by the gallery of nineteenth-century Polish painting on the upper floor of Kraków's cloth hall, the Sukiennice: a vestibule, then four large rooms in an enfilade, with walls coloured like those of a drawing room of former times."""
vitrine = "stanczyk.jpg"

[musee]
nom = "Gallery of 19th-Century Polish Painting in the Sukiennice"
ville = "Kraków, Poland"
architecte = "Tomasz Pryliński (restoration of 1875–1879)"
construction = "Medieval hall; gallery opened in 1879"
presentation = """
In the middle of Kraków's great Market Square, the Sukiennice, the cloth hall, has housed merchants' stalls since the Middle Ages. After a fire in 1555, the Gothic building received a Renaissance crown, an attic decorated with mascarons. From 1875 to 1879, under Mayor Mikołaj Zyblikiewicz, the city had it restored by the architect Tomasz Pryliński, who blended the Gothic and the Renaissance. On 7 October 1879, the city council founded the National Museum in Kraków there; the painter Henryk Siemiradzki gave his giant canvas Nero's Torches to start the collection. The four large rooms on the upper floor are now named after Bacciarelli, Michałowski, Siemiradzki and Chełmoński, and trace Polish painting from the Enlightenment to Symbolism, each around a central painting, as in a nineteenth-century salon. Closed from 2006 to 2010 for a major renovation, the gallery reopened in 2010."""
ici = """
ARTEON's building takes up the idea of the Sukiennice's upper floor: four identical large rooms, eighteen metres by fourteen and nine metres high, in an enfilade from west to east, each with a masterpiece at the centre of the north wall. One enters from the south into a stone-coloured vestibule, then into the room “History and Legend”, Pompeian red, where Mucha's Slav Epic awaits. One then passes, from door to door, through the room “The People and War”, grey-green, the room “Open Air”, ochre, and finally the room “Enigmas and Symbols”, a greyed mauve."""

