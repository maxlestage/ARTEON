[[oeuvres]]
titre = "Melancholy"
artiste = "Jacek Malczewski"
annee = "1890–1894"
image = "melancolie.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Malczewski_Jacek_Melancholia.jpg"
technique = "Oil on canvas, 139 × 240 cm"
collection = "Raczyński Foundation, National Museum in Poznań (Rogalin Gallery)"
note = "From a canvas on an easel bursts a crowd of insurgents, priests and children, rushing towards a window guarded by Melancholy."
description = """
In a painter's studio with greenish walls, a man sits before his easel, at top left, tiny and pale. From his canvas a human flood seems to emerge, crossing the whole room diagonally: insurgents armed with scythes and pikes, priests, soldiers of the Napoleonic era, women in mourning, chained prisoners, children. Some brandish sabres and a red flag, others hold violins, books or brushes. The farther the crowd advances to the right, the older the faces grow; only a few old men reach the sill of the large window. Behind it, in the sunlit garden, a woman draped in black stands motionless, seen from behind: it is Melancholy, who guards the passage."""
evocation = """
The full title, “Melancholy. Prologue. Vision. The Last Century in Poland”, announces a meditation on history. The crowd sums up a century of hopes and defeats, from the partitions of Poland to the uprisings of 1830 and 1863: its generations press towards the window, symbol of freedom, but none manages to cross it. Melancholy bars their way. The painter in the studio, from whom everything seems to be born, also questions the artist's role: is it he who brings these ghosts back to life, or they who haunt him? The painting is often regarded as the manifesto of Polish Symbolism."""
histoire = """
Malczewski worked on this large canvas in Kraków from 1890 to 1894. A professor, then rector of the city's Academy of Fine Arts, he would take up the theme of the human round a few years later in The Vicious Circle, and Stanisław Wyspiański would make a similar dance the symbol of Polish society in his play The Wedding, in 1901. The painting belonged to the collection of Count Edward Aleksander Raczyński, who assembled for his gallery at Rogalin Palace a fine group of Malczewski's paintings; it is now the property of the Raczyński Foundation, on deposit at the National Museum in Poznań."""
facture = """
Malczewski, a pupil of Matejko, keeps from his master the solid drawing and the taste for crowds, but puts them at the service of a vision. Each figure is painted realistically, from a model, while the whole scene is impossible. The composition rests on a great diagonal, starting from the easel at top left and descending towards the window at right, like a wave. The green and golden light of the studio contrasts with the brightness of the garden behind the glass and with the black silhouette of Melancholy."""
details = [
  "The tiny painter at his easel, at top left, from which the crowd emerges.",
  "The woman in black behind the window, seen from behind, guarding the passage.",
  "The old men clinging to the window sill, at right.",
  "The violin and the books held by some figures, instead of weapons.",
  "The red flag and the sabres at the centre of the throng.",
]
themes = ["symbolism", "poland", "memory", "uprising", "artist"]
anecdote = """
It is reported that Malczewski asked his students at the Kraków Academy to “paint so that Poland rises again”: for him, painting had to keep alive a nation erased from the map."""
