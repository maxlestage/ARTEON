[[artistes]]
nom = "Jan Matejko"
vie = "Kraków, 24 June 1838 – Kraków, 1 November 1893"
biographie = """
Born in Kraków, then a free city soon to be annexed by Austria, Jan Matejko was the son of a Czech music teacher and a mother of German-Polish origin. He studied at the School of Fine Arts in Kraków, then briefly in Munich and Vienna. Back in his native city, he would hardly leave it again. Stańczyk, in 1862, made him known; there followed The Sermon of Skarga (1864) and Rejtan (1866), which caused a scandal by showing the nobility's responsibility for the partitions of Poland. In 1873, he took over the direction of the School of Fine Arts in Kraków, where he trained, among others, Jacek Malczewski and Stanisław Wyspiański. His immense canvases, The Battle of Grunwald (1878) and The Prussian Homage (1882), which he gave to the nation, made him the painter of Polish history, at a time when the country had vanished from the map. He died in Kraków in 1893."""
style = """
Matejko invented a history painting that was at once spectacular and reflective: immense crowds, costumes and objects described with an archaeologist's precision, intense colours, and faces that judge history as much as they live it. He enlivens his canvases with deliberate anachronisms in order to convey a message to the Poles of his time. His imagery shaped Polish national memory for generations."""

[[artistes]]
nom = "Mikoláš Aleš"
vie = "Mirotice (Bohemia), 18 November 1852 – Prague, 10 July 1913"
biographie = """
Born into a modest family in southern Bohemia, Mikoláš Aleš entered the Academy of Fine Arts in Prague in the late 1860s and left it in the mid-1870s, without much support. He lived for a long time in poverty. In 1877, together with František Ženíšek, he won the competition for the decoration of the foyer of the National Theatre, a symbol of the Czech awakening; he designed the cycle The Homeland there, but the project brought him many setbacks. His history paintings sold poorly, and he turned to drawing: illustrations of folk songs, tales and children's books, drawings for satirical newspapers, cartoons for the sgraffiti and paintings that adorn many façades in Prague and Bohemia. Gradually, his Hussite horsemen, his peasants and his legendary heroes became familiar to all Czechs. He died in Prague in 1913."""
style = """
Aleš is above all a draughtsman: a lively, supple line, clean silhouettes, a stylisation that borrows from folk art. His paintings, often small in format, are meditative and melancholy. He forged a Czech national imagery, from Hussites to shepherds, found in books, on the walls of houses and even in schools."""

[[artistes]]
nom = "Alfons Mucha"
vie = "Ivančice (Moravia), 24 July 1860 – Prague, 14 July 1939"
biographie = """
Born in Moravia, Alfons Mucha first worked as a theatre scene painter in Vienna, then studied in Munich thanks to a patron. In 1887, he settled in Paris, attended classes at the Académie Julian and lived by illustration. At the end of 1894, the poster he designed for Gismonda, starring Sarah Bernhardt, made him famous overnight; the actress put him under contract. His posters, decorative panels and jewellery made him one of the leading figures of Art Nouveau. At the Exposition Universelle of 1900, he decorated the Bosnia and Herzegovina Pavilion. He then stayed several times in the United States, where he found the patron for his great project, the Slav Epic, which he painted in Bohemia from 1910 to 1928. After 1918, he designed the first stamps and banknotes of Czechoslovakia. Arrested and interrogated by the Gestapo in 1939, he died a few months later in Prague."""
style = """
Mucha is known for his women with flowing hair, surrounded by haloes and arabesques, drawn with a supple line and coloured in soft tones: the “Mucha style” of Art Nouveau. In the Slav Epic, he puts this decorative sense at the service of a monumental, visionary history painting, in which light and symbol count as much as narrative."""

[[artistes]]
nom = "Mihály Munkácsy"
vie = "Munkács (now Mukachevo, Ukraine), 20 February 1844 – Endenich (Bonn), 1 May 1900"
biographie = """
Born Michael Lieb into a family of German origin, Munkácsy later took the name of his native town. Orphaned very young, he was an apprentice carpenter before being able to learn painting, in Pest, then in Vienna, Munich and Düsseldorf. The Condemned Cell, awarded a medal at the Paris Salon in 1870, made him famous. Settled in Paris in 1871, he married a baron's widow and held a salon on Avenue de Villiers frequented by all of fashionable Paris. The dealer Charles Sedelmeyer organised the international success of his large canvases: Milton Dictating Paradise Lost (1878), then the Christ trilogy, Christ before Pilate (1881), Golgotha (1884) and Ecce Homo (1896), which toured Europe and America. He also painted The Conquest of Hungary for the new Parliament in Budapest. Struck by a serious nervous illness, he died in an asylum near Bonn in 1900."""
style = """
Munkácsy combines the realism of Courbet with the Düsseldorf tradition of genre painting: popular or biblical scenes staged as in the theatre, dark backgrounds from which expressive faces emerge. His brown palette, often made with bitumen, lightens in his landscapes and Parisian interiors. He was the most famous Hungarian painter of his century."""

[[artistes]]
nom = "Nicolae Grigorescu"
vie = "Pitaru (Wallachia), 15 May 1838 – Câmpina, 21 July 1907"
biographie = """
Born in a village in Wallachia, Nicolae Grigorescu learned the trade of icon painter in Bucharest. Still a teenager, he painted images for churches and monasteries, notably that of Agapia, in Moldavia. In 1861, a scholarship allowed him to leave for Paris. He spent little time at the School of Fine Arts and preferred the forest of Fontainebleau, where he discovered the Barbizon painters and open-air painting. Back in Romania, he exhibited with success and travelled widely. In 1877, he followed the Romanian army during the War of Independence as official painter, and brought back sketches and battle paintings. He then divided his life between France and Romania, before settling in Câmpina, at the foot of the Carpathians, where he died in 1907. The Romanian Academy had elected him an honorary member in 1899. He is regarded as the founder of modern Romanian painting."""
style = """
Grigorescu learned at Barbizon to paint light and air. His peasant women, his shepherds, his ox carts on dusty roads, painted with a rapid, clear touch, fixed the image of the Romanian countryside. His war paintings keep the same sensitivity to atmosphere. His portrait now appears on the Romanian ten-lei banknote."""

[[artistes]]
nom = "Józef Chełmoński"
vie = "Boczki, near Łowicz, 7 November 1849 – Kuklówka, 6 April 1914"
biographie = """
Born into a family of the lesser nobility in Mazovia, Józef Chełmoński grew up in the countryside, among the horses and peasants he would paint all his life. He studied in Warsaw with Wojciech Gerson, then at the Munich Academy, from 1872. Back in Warsaw, he shared a studio at the Europejski Hotel with other young painters and travelled to Ukraine, whose steppes inspired him. In 1875, he left for Paris, where he stayed more than ten years: his scenes of the Polish and Ukrainian countryside, his galloping teams, such as The Four-in-Hand (Czwórka, 1881), were successful at the Salon and with dealers. In 1887, he returned to Poland and soon settled at Kuklówka, a village in Mazovia, where he lived in seclusion and from then on painted landscapes, birds and skies. He died there in 1914."""
style = """
Chełmoński is the great realist painter of the Polish countryside: spirited horses, peasants at work or at rest, immense plains beneath great skies. His painting, at first brown and energetic, grows calmer in his last years into contemplative landscapes, partridges in the snow, cranes and storks, where nature becomes almost sacred."""

[[artistes]]
nom = "Pál Szinyei Merse"
vie = "Szinyeújfalu (now Slovakia), 4 July 1845 – Jernye, 2 February 1920"
biographie = """
Born into an old noble family of Upper Hungary, Pál Szinyei Merse entered the Academy of Fine Arts in Munich in 1864, where he studied with Alexander von Wagner and then Karl von Piloty. There he became friends with Wilhelm Leibl, who encouraged him to paint in the open air, and left the Academy in 1869 to work alone. Picnic in May, painted in 1873, was met with incomprehension. Married the same year, absorbed by money and family worries, discouraged by the critics, he stopped painting in 1882 and resumed only about ten years later. In 1894, a retrospective organised by his friends finally revealed his importance. Elected a deputy in 1896, he defended the reform of art education, then from 1905 presided over the Hungarian Royal Academy of Fine Arts in Budapest, where he supported the young painters of the Nagybánya colony. He died at Jernye in 1920."""
style = """
Szinyei is the first Hungarian painter of the open air: he sets pure, luminous colours side by side, frank greens and reds, to render the brilliance of the sun. Having reached this clear painting at the same time as the Impressionists, but independently of them, he keeps a more constructed drawing, inherited from Munich. He is the forerunner of modern painting in Hungary."""

[[artistes]]
nom = "Tivadar Csontváry Kosztka"
vie = "Kisszeben (now Sabinov, Slovakia), 5 July 1853 – Budapest, 20 June 1919"
biographie = """
Tivadar Kosztka, son of a physician and pharmacist, himself became a pharmacist. In 1880, he recounts, a voice told him he would be the greatest painter of the sun route, greater than Raphael. He worked for many more years in his own pharmacy to gather the necessary money, then, at over forty, left to study painting in Munich, at Simon Hollósy's school, in 1894, and briefly in Paris. He then travelled ceaselessly in search of grandiose subjects: Dalmatia, Italy, Greece, Egypt, Palestine and Lebanon, where he painted Baalbek and the Solitary Cedar in 1906 and 1907. He took the name Csontváry. His exhibitions in Paris in 1907 and then in Budapest met with little but mockery. Isolated, increasingly strange, he almost ceased painting after 1910 and died in Budapest in 1919."""
style = """
Csontváry is unclassifiable: his giant canvases, painted in saturated, unreal colours, with obsessive precision, are visions of sacred places or places charged with history. Neither Impressionist nor academic, he has been compared to naive painters and to the Expressionists. Rediscovered after his death, he is today one of the best-loved painters in Hungary; a museum is devoted to him in Pécs."""

[[artistes]]
nom = "Jacek Malczewski"
vie = "Radom, 15 July 1854 – Kraków, 8 October 1929"
biographie = """
Born in Radom, in Russian-ruled Poland, Jacek Malczewski spent part of his youth in the countryside, at an uncle's home. In 1873, he entered the School of Fine Arts in Kraków, where he was a pupil of Jan Matejko, then stayed in Paris in 1876–1877 and attended the École des Beaux-Arts. His first large paintings tell of the fate of the Polish deportees in Siberia, inspired by Juliusz Słowacki's poem Anhelli. In 1884, he took part in an archaeological expedition to Asia Minor. Around 1890, his art shifted into Symbolism: Melancholy, then The Vicious Circle, and a host of paintings peopled with chimeras, fauns, angels and figures of death, in which he often portrays himself. A professor at the Academy of Fine Arts in Kraków, he became its rector in 1912. He died in Kraków in 1929; his son Rafał Malczewski would also become a painter."""
style = """
Malczewski is the great master of Polish Symbolism. He mixes figures painted with meticulous realism, peasants, insurgents, self-portraits, with mythological creatures, in luminous landscapes of the Polish countryside. His bright colours and solid drawing serve allegories of the homeland, art and death, often enigmatic."""

[[artistes]]
nom = "Olga Boznańska"
vie = "Kraków, 15 April 1865 – Paris, 26 October 1940"
biographie = """
Daughter of a Polish engineer and a French mother, Olga Boznańska learned painting in Kraków in private classes, since the School of Fine Arts did not admit women. In 1886, she left for Munich, where she studied in private studios and soon opened her own. Her portraits were noticed there and exhibited across Europe. In 1898, she settled in Paris, in a studio on Boulevard du Montparnasse that she would never leave. A member of the Société nationale des beaux-arts, she exhibited throughout Europe and in the United States, and received the Legion of Honour. She nonetheless remained attached to Poland and regularly sent her works to the exhibitions in Kraków and Warsaw. She painted mainly portraits, but also interiors, flowers and views of Paris from her window. Her last years, in a cluttered studio, were marked by solitude and material hardship. She died in Paris in 1940."""
style = """
Boznańska is above all a portraitist. She often paints on cardboard, in fine, matte touches, in a range of greys, browns and veiled tones that owes much to Whistler. Her sitters, wrapped in a soft light, seem lost in thought. Her portraits, of great psychological intensity, make her one of the great European women painters of her time."""

[[artistes]]
nom = "Osman Hamdi Bey"
vie = "Constantinople, 30 December 1842 – Constantinople, 24 February 1910"
biographie = """
Son of the grand vizier İbrahim Edhem Pasha, Osman Hamdi was sent to Paris in 1860 to study law; there he developed a passion for painting and frequented the studios of Orientalist painters. Returning to Constantinople in 1869, he held various administrative posts, notably in Baghdad, and in 1873 organised the Ottoman participation in the Vienna World's Fair, for which he published, with Marie de Launay, an album on the popular costumes of Turkey. In 1881, he became director of the Imperial Museum, the future Istanbul Archaeological Museum. He founded the city's School of Fine Arts, had a law adopted banning the export of antiquities, and himself directed excavations, notably at Sidon, where in 1887 he discovered the royal necropolis and the so-called Alexander Sarcophagus. At the same time, he never stopped painting, exhibiting notably at the Paris Salon. He died in his house at Kuruçeşme, on the Bosphorus, in 1910."""
style = """
Osman Hamdi takes up the precise, luminous manner of the French Orientalists, but turns it around: instead of an East dreamed by the West, he paints scenes from his own culture, often with dignity and sometimes with irony, using his own photographs and his entourage as models. He is regarded as a pioneer of modern painting in Turkey."""
