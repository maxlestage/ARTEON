[[oeuvres]]
titre = "Girl with Chrysanthemums"
artiste = "Olga Boznańska"
annee = "1894"
image = "fillette-chrysanthemes.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Olga_Boznańska_-_Girl_with_Chrysanthemums_-_MNK_II-b-1032_-_National_Museum_Kraków.jpg"
technique = "Oil on cardboard, 88.5 × 69 cm"
collection = "National Museum in Kraków"
note = "A pale little girl with red hair holds white chrysanthemums and stares at us with large dark eyes."
description = """
A little girl stands, facing us, against a light grey wall. She wears an anthracite-grey dress with puffed sleeves and, against her side, a bouquet of large white chrysanthemums with dishevelled petals. Her long, tousled red hair frames a very pale face in which two large black eyes and a red mouth stand out. Her hands, with interlaced fingers, hold the long green stems at waist height. Behind her, at right, her shadow falls on the wall, and brown patches appear in the background, where the priming of the cardboard shows through. At lower right, the painter signed and dated: “Boznańska 94”."""
evocation = """
The child's fixed, grave gaze, which nothing softens, gives the portrait something unsettling. The chrysanthemums, flowers of All Saints' Day in Poland as in France, associate the girl with the idea of death and the passing of time. It has been seen as the image of a melancholy childhood, too serious for her age, and an echo of the Symbolism then spreading across Europe. But Boznańska tells no story: she captures a presence, an inner tension. It is this psychological force that has made this painting her most famous work."""
histoire = """
Boznańska painted this portrait in 1894 in Munich, where she had settled to study painting, the academies then being closed to women. She kept a studio there and began to exhibit in Germany and Poland. Four years later, she left for Paris, where she would live for more than forty years. The painting was bought by the National Museum in Kraków in 1950. Regarded as the artist's masterpiece, it was recently restored thanks to the patronage of the BNP Paribas foundation, and is displayed in the museum's main building, in Kraków."""
facture = """
Boznańska paints on cardboard, in thin, matte layers, with a reduced range of greys, browns and whites. She admired Whistler and Manet, from whom she took the harmony of muted tones and the frontal pose against a neutral background. The dress and the wall are brushed in rapid broad strokes, while the chrysanthemums are laid in thick, nervous touches of pure white. The face, by contrast, is modelled with delicacy. The background left bare in places is part of the effect."""
details = [
  "The large black eyes, which follow the visitor.",
  "The white chrysanthemums, painted in thick touches.",
  "The girl's shadow on the wall, at right.",
  "The interlaced fingers gripping the stems.",
  "The signature “Boznańska 94”, at lower right.",
]
themes = ["portrait", "childhood", "melancholy", "flowers", "gaze"]
anecdote = """
The National Museum in Kraków was the first Polish institution to buy a painting by Boznańska for the national collections: in 1896, it acquired her Portrait of the Painter Paweł Nauen, painted in 1893."""
salle = 5
