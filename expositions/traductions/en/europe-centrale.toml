[[oeuvres]]
titre = "The Tortoise Trainer"
artiste = "Osman Hamdi Bey"
annee = "1906"
image = "dresseur-de-tortues.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Osman_Hamdi_Bey_-_The_Tortoise_Trainer_-_Google_Art_Project.jpg"
technique = "Oil on canvas, 221.5 × 120 cm"
collection = "Pera Museum, Istanbul"
note = "An old man in a red robe, a flute behind his back, tries in vain to train tortoises: an ironic smile at the Ottoman Empire."
description = """
In an upper hall of a dilapidated mosque, before a pointed-arch window, a bearded old man stands in profile, leaning slightly. He wears a long red robe with an embroidered hem, belted at the waist, and a large turban with yellow and purple bands. His hands, clasped behind his back, hold a reed flute, the ney; a small drum, the nakkare, hangs at his back. At his feet, five tortoises graze on green leaves scattered over the flagstones, paying him not the slightest attention. Around the window, the walls are covered with blue and turquoise ceramic tiles and a calligraphic inscription; in places, the facing has fallen away and reveals the brick."""
evocation = """
The painting is most often read as a satire: of the slow and ineffective reforms of the Ottoman Empire, in particular the Tanzimat, which the old trainer, with his methods from another age, fails to advance. His costume, predating the fez and European dress, and his dervish instruments tie him to a vanished world. It has been seen as a self-portrait, since Osman Hamdi often photographed himself in costume to prepare his paintings. Little understood at its creation, the painting took on a new meaning after the Young Turk Revolution of 1908. The inscription above the window reads: “The healing of hearts is the meeting with the Beloved”."""
histoire = """
Osman Hamdi painted this first version in 1906 and sent it to the Paris Salon, at the Grand Palais, under the title The Man with the Tortoises. The setting is inspired by an upper hall of the Green Mosque in Bursa, the former Ottoman capital. A second, smaller version, dated 1907, is held in a private collection. The first belonged to the Turkish businessman Erol Aksoy; in December 2004, it was sold at auction in Istanbul for about five million Turkish lira, then a record for a Turkish painter. Acquired by the Suna and İnan Kıraç Foundation, it is the most famous work of the Pera Museum, opened in 2005."""
facture = """
Osman Hamdi, trained in Paris among the Orientalist painters, applies their academic precision to a scene from his own culture. He describes with minute care the ceramic tiles, the calligraphy, the silk of the robe, the scales of the tortoises. The very narrow, tall format accentuates the verticality of the figure and of the window. The red of the robe, at the centre, stands out against the deep blues of the setting. The light, coming from the window at the back, illuminates the flagstones and the flaking walls."""
details = [
  "The five tortoises grazing, indifferent to the trainer.",
  "The ney flute held behind the back, and the drum hanging from the shoulder.",
  "The fallen ceramic tiles, revealing the brick.",
  "The calligraphic inscription above the window.",
  "The painter's signature and the date, at lower right.",
]
themes = ["satire", "orient", "tortoises", "reform", "costume"]
anecdote = """
Osman Hamdi is said to have found the idea in an article in the magazine Le Tour du monde, read years earlier, describing trainers making their tortoises walk in line to the beat of a drum. Herpetologists have identified his tortoises as Testudo graeca ibera."""
salle = 5
