[[artistes]]
nom = "Égypte, Nouvel Empire"
vie = "Nile valley, c. 1550–1070 B.C."
biographie = """
The New Kingdom begins around 1550 B.C., when the kings of Thebes drove out the Hyksos, who had come from Asia and ruled over the north of the country. Under the 18th Dynasty, that of the Thutmoses and the Amenhoteps, Egypt became an empire stretching from Nubia to the Euphrates. The military campaigns of Thutmose III brought the country into close contact with the Near East, where glass was already being made: it was at this time that the first glass vessels appeared in Egypt. Under Amenhotep III, the country enjoyed unprecedented prosperity; his son Akhenaten imposed the cult of the solar disc Aten and founded a new capital, Amarna. The royal workshops there produced coloured glass for vessels, inlays and jewellery. The New Kingdom is also the age of Tutankhamun, Ramesses II and the great temples of Karnak and Luxor."""
style = """
The Egyptian glass of the New Kingdom is a coloured glass, opaque or nearly so, which imitates precious stones: the dark blue of lapis lazuli, turquoise, white, yellow. The vessels, small, are shaped around a core and decorated with glass threads drawn into festoons, zigzags or feathers. Their forms often take up those of stone or ceramic vessels, in miniature."""

[[artistes]]
nom = "Empire romain, Méditerranée orientale"
vie = "Syria, Palestine, Egypt and Asia Minor, 1st century B.C. – 4th century"
biographie = """
The eastern provinces of the Roman Empire, Syria, Judaea, Egypt, had for centuries been the great centres of glass in the Mediterranean. It was on the Syro-Palestinian coast that glassblowing was invented, in the 1st century B.C., transforming the craft: a vessel that had required hours of work was now made in a few minutes. The glassmakers, often itinerant, spread the technique throughout the Empire, in Italy, Gaul and the Rhineland, around Cologne. Some signed their works, such as Ennion, active at Sidon in the 1st century. Glass became a common material: it was used for flasks, bottles, cups, tableware and even window panes. Tombs from all over the Roman world have yielded thousands of these objects, often iridescent from their long stay in the ground."""
style = """
Roman glass is above all blown glass, thin and light, of a natural bluish green or coloured blue, amber or violet. Blowing into a mould makes it possible to repeat forms in relief: human heads, fruit, plant motifs, inscriptions. The glassmakers play with transparency and colour more than with painted decoration."""

[[artistes]]
nom = "Alexandrie, Égypte romaine"
vie = "Alexandria, Egypt, 3rd century"
biographie = """
Founded by Alexander the Great in 331 B.C., Alexandria was the capital of Ptolemaic Egypt, then, after the Roman conquest in 30 B.C., one of the greatest cities of the Empire. A Greek-speaking city, populated by Greeks, Egyptians and Jews, it was famous for its lighthouse, its library, its scholars and its trade. Its craftsmen worked for a rich and refined clientele: goldsmiths, gem engravers, painters and glassmakers. The Alexandrian workshops had a reputation for producing glass of great luxury, mosaic glass, cut glass and gold glass. In the 3rd century, they made small portraits in gold leaf on blue glass, of exceptional finesse, showing men, women and families of the city, sometimes named by a Greek inscription."""
style = """
The gold-glass portraits of Alexandria are true drawings in gold: the modelling is born of very fine hatching, scratched with a point in the metal leaf, as in an engraving. The faces, individualised and expressive, recall the painted portraits of the Fayum. The dark blue ground makes the gold shine as against a night sky."""

[[artistes]]
nom = "Égypte, sultanat mamelouk"
vie = "Egypt and Syria, 1250–1517"
biographie = """
The Mamluks were military slaves, bought young in the steppes of present-day southern Russia or in the Caucasus, converted to Islam and trained in the profession of arms. In 1250, they seized power in Egypt and founded a sultanate that soon extended to Syria. Their sultan Baybars halted the Mongols and gradually drove the Crusaders out of the Levant. For more than two and a half centuries, Cairo was the greatest city of the Islamic world: sultans and emirs had mosques, madrasas, hospitals and mausolea built there, which they endowed with precious furnishings, enamelled glass lamps, candlesticks and basins of inlaid metal, illuminated Qurans. The workshops of Syria and Egypt then brought the art of enamelled and gilded glass to perfection. The sultanate fell in 1517 to the blows of the Ottomans."""
style = """
Mamluk art loves large Arabic inscriptions, in slender letters, which bear the names and titles of sultans and emirs, and blazons, emblems linked to their office. On glass, the blue, red and white enamel and the gold stand out against a transparent glass, often lightly tinted, which lets the light through."""

[[artistes]]
nom = "Venise, verreries de Murano"
vie = "Murano, Venetian lagoon, since the 13th century"
biographie = """
Glass has been worked in Venice since the early Middle Ages. In 1291, the Republic required its glassmakers to move their furnaces to the neighbouring island of Murano, to protect the city from fires and to keep the secrets of the trade under control. The glassmakers, organised in a guild, enjoyed important privileges there, but were forbidden to practise outside the lagoon. In the 15th century, Angelo Barovier and his contemporaries perfected cristallo, an almost colourless glass; enamel was soon added, along with the opaque white glass called lattimo, crackled glass and filigree glass. In the 16th and 17th centuries, Murano dominated the European market for luxury glass, and its emigrant glassmakers spread the "façon de Venise" as far as England and the Netherlands. The island has remained a great glassmaking centre to this day."""
style = """
Murano glass is a soda glass, light, which remains malleable for a long time: the glassmakers stretch it, pinch it and blow it into very thin walls. Rather than engraving it, they decorate it in the mass, with threads of white or coloured glass, or hot, with applied wings, cords and knops."""

[[artistes]]
nom = "Hermann Schwinger"
vie = "Nuremberg, 1640 – Nuremberg, 1683"
biographie = """
Hermann Schwinger was a glass engraver of Nuremberg, active in the second half of the 17th century. His city was then the principal centre of glass engraving in Germany. This art had been introduced there by Georg Schwanhardt the Elder, a pupil of Caspar Lehmann, the gem engraver of Emperor Rudolf II in Prague, who had applied the techniques of glyptics to glass. Around Schwanhardt and his sons a school of engravers formed, of which Schwinger is one of the best representatives. The Nuremberg engravers decorated tall goblets with stems adorned with collars and hollow swellings, often made of Bohemian glass or local glass. Schwinger engraved on them landscapes, views of towns, allegorical scenes and inscriptions, with great finesse, and signed some of his works."""
style = """
Schwinger engraves on the wheel, in matte hollow, landscapes of a draughtsman's precision: houses, trees with dense foliage, tiny figures. His scenes unfold all around the bowl, like a panorama, and are often accompanied by mottoes in Gothic script that give them their meaning."""

[[artistes]]
nom = "Jacob Sang (gravure), verrerie anglaise"
vie = "Jacob Sang: Netherlands, c. 1720 – 1786, active in Amsterdam in the 1750s"
biographie = """
Jacob Sang was a glass engraver of Amsterdam, active in the mid-18th century, probably of German origin. He is counted among the most skilled and renowned engravers of the city. In the Netherlands, the demand for personalised glasses was immense: they were commissioned for weddings, births, commercial successes, ships or political events. Sang engraved coats of arms, genre scenes, allegories and inscriptions, and signed some of his works. Like many Dutch engravers, he worked on glasses blown in England. Since George Ravenscroft patented in 1674 a glass containing lead oxide, English glasshouses had produced a heavy, very clear and brilliant glass, softer than others, which the engravers of the Netherlands particularly appreciated."""
style = """
Sang combines the clarity of English lead glass with very careful wheel engraving, in which matte and polished surfaces combine to model volumes. His scenes, clearly composed, are often accompanied by inscriptions in Dutch, toasts and mottoes, which recall the function of the glass at family celebrations."""

[[artistes]]
nom = "Émile Gallé"
vie = "Nancy, 1846 – Nancy, 1904"
biographie = """
The son of a dealer in earthenware and glassware in Nancy, Émile Gallé studied botany, mineralogy and drawing, spent time in Germany, then learned the glassmaker's trade at Meisenthal, in Lorraine. He took over the family business, which he transformed into an art workshop, and added a cabinetmaking workshop in 1885. His entries at the Paris World's Fairs, in 1878, in 1889 and in 1900, made him famous. A passionate botanist, he observed the plants and insects of Lorraine, and also drew inspiration from Japanese art. A committed man, he publicly took up the defence of Captain Dreyfus. In 1901, he founded with other artists the École de Nancy, of which he was the first president. He died of leukaemia in 1904; after him, his workshops continued to produce vases signed with his name."""
style = """
Gallé makes of glass a poetic material. He superimposes layers of colour, encloses in them inclusions, bubbles and metal foils, then carves the decoration with acid and on the wheel, like a cameo. His vases show flowers, foliage and insects, sometimes accompanied by engraved verses: these are his "speaking glassworks"."""

[[artistes]]
nom = "Louis Comfort Tiffany"
vie = "New York, 1848 – New York, 1933"
biographie = """
The son of Charles Lewis Tiffany, founder of the famous New York jeweller, Louis Comfort Tiffany first trained as a painter and travelled in Europe and North Africa. He then turned to interior decoration, then to stained glass, in which he invented glasses of nuanced colour throughout the mass, without paint. In 1893, he opened his own glasshouse at Corona, in the New York borough of Queens, with the English glassmaker Arthur J. Nash, and launched Favrile glass, with its iridescent surfaces. His workshops, which became Tiffany Studios in 1902, produced vases, stained glass, mosaics, lamps and jewellery. Exhibited in Paris by the dealer Siegfried Bing and rewarded at the 1900 World's Fair, he became the great American representative of Art Nouveau. After the war, his style went out of fashion; he died in 1933."""
style = """
Tiffany thinks of glass as a painter: he seeks colour and light in the material itself. His Favrile vases, with the supple forms of flowers or gourds, are decorated hot with threads and spots of glass drawn into feathers, leaves or waves, and covered with a shifting iridescence inspired by ancient glass."""

[[artistes]]
nom = "René Lalique"
vie = "Aÿ (Marne), 1860 – Paris, 1945"
biographie = """
Born in Champagne, René Lalique served his apprenticeship with a Parisian jeweller and studied drawing in Paris and London. He opened his own workshop in 1885 and became, in the 1890s, the most inventive of the Art Nouveau jewellers: he combined gold, enamel, horn and glass with stones chosen for their colour more than for their price, and triumphed at the 1900 World's Fair. He then turned to glass. Around 1907, he designed perfume bottles for François Coty; in 1909, he rented and then bought a glasshouse at Combs-la-Ville, near Paris, and founded another in 1921 at Wingen-sur-Moder, in Alsace. His vases, flasks, chandeliers and radiator mascots in moulded glass, produced in series, made him one of the great names of Art Deco."""
style = """
Lalique plays on the contrast of matte and polished glass, of transparent and opalescent, and on patinas that emphasise the relief. Moulded glass allows him to reproduce his designs in quantity, without losing the sharpness of the drawing. His motifs come from nature: flowers, birds, fish, insects, frogs."""
