[[oeuvres]]
titre = "Amphora-Shaped Perfume Flask"
artiste = "Égypte, Nouvel Empire"
annee = "c. 1386–1330 B.C."
image = "amphore-egyptienne.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/544828"
technique = "Core-formed glass, decoration of glass threads drawn into festoons; height 15.3 cm, diameter 6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A miniature amphora in midnight-blue glass, striped with white, yellow and turquoise festoons, made to hold a scented oil in the time of Amenhotep III and Akhenaten."
description = """
The flask takes up in miniature the form of an amphora, the great storage jar of Antiquity, but it would fit in the hand: it measures barely fifteen centimetres. Its egg-shaped body, a deep midnight blue, rests on a small flaring foot. Two ring handles, of the same blue, curve over the shoulders. The decoration is made of threads of white, orange-yellow and turquoise glass, which form bands of zigzag festoons, like waves or feathers, separated by straight lines. The long neck is entirely covered with tight chevrons. The edge of the mouth and that of the foot are picked out with a twisted cord, striped blue and white. In places, the surface shows small pale patches, traces of the weathering of the glass."""
evocation = """
In Egypt, glass was first of all a royal material. It was compared to precious stones: the dark blue imitated lapis lazuli, the turquoise the stone of Sinai. The first glass vessels appeared in the Nile valley around 1500 B.C., in the time of Thutmose III, perhaps thanks to craftsmen who came from the Near East after his military campaigns. They remained rare and costly, reserved for the palace, the temples and the great dignitaries. These small flasks held scented oils and ointments, indispensable to the toilette of the living, but also to funerary rites. To give a glass flask the form of an amphora was to play with scale: the storehouse jar becomes a toilet jewel."""
histoire = """
The flask dates from the end of the 18th Dynasty, under the reigns of Amenhotep III and Akhenaten, the golden age of Egyptian glass. Archaeologists have found glassmakers' workshops in the great royal residences of this period, at the palace of Malqata, near Thebes, and at Amarna, the capital founded by Akhenaten. It is not known where this flask was discovered. The Metropolitan Museum bought it in 1926 thanks to a gift from the patron Edward S. Harkness, one of the great benefactors of its Egyptian department. After the end of the New Kingdom, the production of glass vessels declined in Egypt for several centuries; the core technique would be reborn later in Mesopotamia, then in the Greek world."""
facture = """
Glassblowing did not yet exist. The glassmaker first modelled a core of clay mixed with sand or organic matter, in the shape of the interior of the flask, around a metal rod. He covered it with molten blue glass, then wound coloured glass threads around it, which he drew upwards and downwards with a point to form the festoons. By rolling the still-hot object on a flat stone, he pressed the threads into the wall. He then added the handles, the foot and the cords. Once the glass had cooled, he removed the rod and scraped out the core. The blue comes from cobalt, the white and the yellow from antimony compounds."""
details = [
  "The zigzag festoons, white, yellow and turquoise, on the midnight-blue body.",
  "The tight chevrons covering the whole neck.",
  "The two ring handles set on the shoulders.",
  "The twisted blue and white cords of the rim and foot.",
]
themes = ["egypt", "perfume", "core-formed glass", "amphora", "blue"]
anecdote = """
The same process, glass threads drawn into feathers, reappears more than three thousand years later on the vases of Louis Comfort Tiffany, shown in the last room of this exhibition."""
salle = 2
mur = "nord"
place = 1
largeur = 0.9

[[oeuvres]]
titre = "Double-Faced Flask (Janiform Flask)"
artiste = "Empire romain, Méditerranée orientale"
annee = "2nd–4th century"
image = "flacon-janus.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1923.945"
technique = "Mould-blown glass; height 6.4 cm, diameter 4.6 cm"
collection = "Cleveland Museum of Art"
note = "A flask six centimetres high, blown in a mould in the form of a double head, whose surface, iridescent with age, hides the original violet colour."
description = """
The small flask has the form of two heads joined at the back of the skull, surmounted by a long cylindrical neck with a rolled mouth. Here we see one of the two faces, frontally: a full, youthful face, with large almond-shaped eyes, a straight nose and a small mouth. A head of hair in thick wavy locks frames it and falls at the sides to the level of the cheeks. The second face, turned to the back, is almost identical. The whole surface is covered with a shifting iridescence, in which glints of silver, mauve, green and gold mingle; in places, small flakes have come away. The flask fits entirely in the hollow of the hand."""
evocation = """
These flasks are called janiform, after Janus, the two-faced Roman god, guardian of doors and beginnings, who looks both forwards and backwards. The Cleveland Museum notes, however, that these faces, beardless and of uncertain sex, hardly resemble Janus, who is usually bearded: other flasks pair a solemn face with a smiling one. These objects therefore did not necessarily celebrate a god; they amused the eye and made a simple container for scented oil precious. Above all they speak of the great novelty of Roman glass: thanks to glassblowing, what had been a luxury became an everyday object, which could be made in series and sold throughout the Empire."""
histoire = """
Flasks with human heads were very widespread in the Roman world from the 2nd to the 4th century; they were made in the eastern Mediterranean, where this one probably comes from, but also in the Rhineland. Most have been found in tombs, where they were placed with their contents. The flask entered the Cleveland Museum of Art in 1923, given by Jeptha H. Wade, one of the museum's founders, who gave it many objects. Like many ancient glasses, it spent centuries in the ground, and it is this burial that gave it its present appearance: according to the museum, the iridescence covering the surface masks an original colour close to violet."""
facture = """
Glassblowing was invented in the 1st century B.C. on the Syro-Palestinian coast: the glassmaker gathers a ball of molten glass at the end of a hollow pipe and inflates it with his breath. Very soon, glass was also blown into moulds, of terracotta or stone, made of two halves bearing the relief in hollow. Here, the parison, the bubble of hot glass, was blown into a mould in the form of a double head, which imprinted the faces and the locks of hair in one stroke; the neck was then drawn out and rolled, outside the mould. Over time, moisture in the soil altered the surface into very fine layers, which break up light like a soap bubble."""
details = [
  "The large almond-shaped eyes of the face turned towards us.",
  "The wavy locks framing the face, imprinted by the mould.",
  "The profile of the second face, which can be made out on the right side.",
  "The mauve, green and golden glints of the iridescence.",
  "The rolled mouth, folded back on itself while hot.",
]
themes = ["rome", "blown glass", "janus", "iridescence", "perfume"]
anecdote = """
The iridescence of ancient glass fascinated the Art Nouveau glassmakers: Louis Comfort Tiffany, a collector of ancient glass, sought to obtain in his furnace the glints that centuries of burial had given to Roman glass."""
salle = 2
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Medallion with a Portrait of Gennadios"
artiste = "Alexandrie, Égypte romaine"
annee = "250–300"
image = "medaillon-gennadios.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/466645"
technique = "Glass, gold leaf and touches of colour; diameter 4.1 cm, thickness 0.6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The portrait of a young man drawn with a point in gold leaf, on a disc of blue glass four centimetres across: one of the masterpieces of ancient gold glass."
description = """
On a small disc of almost black blue glass, a young man appears in bust, in three-quarter view, his gaze turned to our left. He is drawn entirely in gold: thick hair in tight curls, large eyes with an intense gaze, full cheeks, a closed mouth. The modelling of the face and shoulders is rendered by thousands of very fine hatchings, as in an engraving. He wears a tunic and a cloak thrown over the shoulder. Around him, a gold line follows the edge of the medallion, and a Greek inscription in gold letters can be read in three pieces: ΓΕΝΝΑΔΙ on the left, ΧΡΩΜΑΤΙ on the right, ΠΑΜΜΟΥϹΙ at the bottom. The edge of the disc is chipped in places."""
evocation = """
The portrait has the presence of a living face: nothing idealised in this young man with his singular features, who brings to mind the portraits painted on wood on the mummies of the Fayum, made in Egypt at the same time. The inscription gives his name, Gennadios, and praises him; it is usually understood as a tribute to his talent, that of a man accomplished in the art of the Muses, probably a musician. These precious, intimate medallions preserved the image of a loved one or honoured a success; they could be mounted as jewellery or given as gifts. They also bear witness to Alexandria, the great Greek metropolis of Roman Egypt, renowned for its glassmaking workshops and its taste for refined luxury."""
histoire = """
The medallion was made between 250 and 300, probably in Alexandria, where most portraits of this type come from. Only a small number are known, all of great finesse, which suggests a single workshop or a small group of highly specialised craftsmen. Some were preserved for centuries as relics or jewels: the most famous, which shows a mother and her two children, was set in the Middle Ages in the Cross of Desiderius, in Brescia, among precious stones. The history of Gennadios's medallion before its arrival at the Metropolitan Museum, which bought it in 1926 thanks to the Fletcher Fund, is unknown. It is kept with the museum's medieval art collections, alongside the early Christian gold glasses."""
facture = """
Gold glass, which the Italians call fondo d'oro, encloses a gold leaf between two layers of glass. The craftsman first laid a very thin gold leaf on the disc of blue glass. With a fine point, he scratched the design into it: he removed the gold around the figure and drew in the face, hair and clothing networks of hatchings, more or less tight, which let the dark ground show through and create the shadows. A few touches of colour completed the portrait. The whole was then protected by a layer of glass, fused over it, which seals the gold and keeps it from wearing away. The work, done under a magnifying glass or nearly so, demanded an extraordinarily steady hand."""
details = [
  "The tight curls of the hair, drawn one by one in the gold.",
  "The very fine hatching that models the cheeks and neck.",
  "The gaze turned to the side, with dark pupils.",
  "The three Greek words of the inscription, on the left, on the right and at the bottom.",
  "The gold line that follows the edge of the medallion.",
]
themes = ["portrait", "gold", "alexandria", "music", "gold glass"]
anecdote = """
The medallion measures barely four centimetres: in the case, Gennadios's face is no larger than a fingernail, and it is only with a magnifying glass that one discovers the fineness of the hatching."""
salle = 2
mur = "ouest"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Mosque Lamp for the Mausoleum of Emir Aydakin al-Bunduqdar"
artiste = "Égypte, sultanat mamelouk"
annee = "shortly after 1285"
image = "lampe-aydakin.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/447000"
technique = "Blown glass, applied handles, folded foot, enamelled and gilded; height 26.4 cm, diameter of the opening 21 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A glass lamp enamelled in blue, red and gold, made for the tomb of an emir of Cairo, the former master of Sultan Baybars, whose arms it bears: two bows back to back."
description = """
The lamp has the form of a large vase: a low foot, a swelling body and a wide neck flaring like a funnel. The glass, lightly tinted brown, is transparent. Around the body runs a wide blue band on which an Arabic inscription stands out in reserve, in large, slender letters outlined in red and heightened with gold. It is interrupted by red medallions bearing two bows back to back, drawn in gold. Small glass handles, set on the body, served to suspend it. The neck bears a second inscription, in blue letters on a ground of scrolling foliage, between other medallions with bows. Friezes of small red motifs pick out the rim and the base of the neck."""
evocation = """
A mosque lamp did not merely give light: it gave form to divine light. Many bear a verse of the Quran, the Sura of Light, which compares God to a lamp in a niche, "the lamp is in a glass, and the glass is like a shining star". Hung by the dozen in mosques, madrasas and tombs, they made the inscriptions glow in the dimness. This one also honours a man. The medallions bear the emir's arms, for the Mamluks, former military slaves who became masters of Egypt, distinguished themselves by emblems linked to their office at court. The two bows are those of a bunduqdar, the bearer of the sultan's bow."""
histoire = """
Aydakin al-Bunduqdar was an emir of the Cairo court in the 13th century. He had bought as a military slave a young Turk, Baybars, who became one of the greatest Mamluk sultans and kept all his life the nickname al-Bunduqdari, "the man of al-Bunduqdar". Aydakin died in 1285; he was buried in Cairo in a mausoleum for which this lamp was made, shortly after his death. It is not known when it left Cairo; in the 19th century, European collectors sought out these lamps. The financier J. Pierpont Morgan acquired it; it was given in 1917 to the Metropolitan Museum, with a large part of his collection. In the neighbouring exhibition devoted to the arts of Islam, one can see another lamp from the Met, that of the emir Qawsun."""
facture = """
The lamp is blown, then shaped with the pipe: the foot is an edge of glass folded back on itself, the handles are drops of glass drawn out and attached while hot. The decoration is then painted with enamels, powders of glass coloured by metal oxides and mixed with a binder, and with gold. The glassmaker returned the lamp to the furnace, at a temperature high enough to melt the enamels onto the glass, but low enough not to deform the object: a delicate operation, often repeated for each colour. The glassmakers of Syria and Egypt brought this technique to perfection in the 13th and 14th centuries; those of Venice would take it up at the end of the Middle Ages."""
details = [
  "The two bows back to back, in gold, in the red medallions.",
  "The large letters of the inscription, in reserve on the blue band.",
  "The small glass handles that allowed the lamp to be suspended.",
  "The blue inscription of the neck, on a ground of fine scrolling foliage.",
  "The folded foot, with its thick edge, beneath the body.",
]
themes = ["islam", "mamluks", "light", "enamel", "calligraphy"]
anecdote = """
In the 19th century, these lamps were so sought after that European glassmakers, such as the Parisian Philippe-Joseph Brocard, began to imitate them. The Cleveland Museum holds an enamelled mosque lamp made in France at the end of the 19th century."""
salle = 3
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Filigree Glass Goblet (vetro a reticello)"
artiste = "Venise, verreries de Murano"
annee = "c. 1600"
image = "gobelet-reticello.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/223422"
technique = "Colourless blown glass with white lattice filigree (vetro a reticello); height 17.2 cm"
collection = "Art Institute of Chicago"
note = "A Murano goblet woven with a fine network of white glass threads, so regular that it might be taken for lace or basketwork."
description = """
The goblet flares widely, like a corolla, above a flattened knop and a bell-shaped foot, edged with a rolled rim. The glass, colourless and very thin, is traversed from end to end by a network of opaque white threads that cross diagonally and form small regular lozenges, a lattice that covers the bowl, the knop and the foot. Towards the top, the threads spread apart and tilt, following the flare of the wall; near the rim, two series of spirals turning in opposite directions can be clearly made out. At the centre of each lozenge, a tiny air bubble has remained trapped. Against the grey background of the photograph, the object seems almost immaterial."""
evocation = """
This goblet has no decoration other than the material itself: it is glass that becomes lace. In the 16th and 17th centuries, Murano dominated the European market for luxury glass, and the tables of princes and wealthy merchants were adorned with these light, fragile and costly objects. According to the Art Institute, these lattice goblets were much sought after by the nobility to adorn festive tables, as a sign of wealth and good taste. They answer the Renaissance taste for virtuosity: one admires the difficulty overcome as much as the beauty of the object. Their fineness also speaks of their fragility, and it is almost a miracle that such glasses have come down to us."""
histoire = """
As early as 1291, Venice required its glassmakers to set up their furnaces on the island of Murano, to keep the risk of fire away from the city and to guard the secrets of the trade better. In the 15th century, they perfected cristallo, an almost colourless glass, clear as rock crystal, then, in the first decades of the 16th century, filigree glass, decorated with threads of white glass. Despite the laws forbidding them to leave the lagoon, many Venetian glassmakers left to work abroad: their manner, the "façon de Venise", spread throughout Europe. Nothing is known of this goblet's first owner. The Art Institute of Chicago acquired it through the Mary Swissler Oldberg fund; it is displayed in its decorative arts galleries."""
facture = """
The Art Institute describes the process. The glassmaker lays fine rods of white glass side by side and encases them in a mass of molten colourless glass; he rolls the whole, blows it into a tube and twists it so that the threads wind into a spiral. He prepares a second tube, whose threads turn in the other direction, and blows it inside the first: the two walls fuse, and the crossed spirals form the lattice. At each crossing, a small air bubble remains enclosed between the two layers. The glass is then shaped into a goblet, with its knop and foot, without the pattern becoming blurred: work of great mastery."""
details = [
  "The small regular lozenges of the white lattice.",
  "The air bubble trapped at the centre of each lozenge.",
  "The two series of crossed spirals, clearly visible near the rim.",
  "The flattened knop connecting the bowl to the foot.",
  "The rolled rim of the foot, folded back while hot.",
]
themes = ["venice", "murano", "filigree", "renaissance", "virtuosity"]
anecdote = """
The glassmakers of Murano enjoyed rare privileges: their daughters could marry Venetian nobles without the children losing their rank. But anyone who left to practise his art abroad risked heavy penalties."""
salle = 3
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Goblet with a View of the Panierplatz, Nuremberg"
artiste = "Hermann Schwinger"
annee = "c. 1680"
image = "gobelet-schwinger.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1950.389"
technique = "Blown glass, wheel-engraved; height 31.1 cm, diameter 13.5 cm"
collection = "Cleveland Museum of Art"
note = "A tall goblet with a stem adorned with collars, on which the Nuremberg engraver Hermann Schwinger depicted a square in his city and two porters sharing a load."
description = """
The goblet, thirty-one centimetres tall, consists of a bell-shaped bowl, a long stem and a wide flat foot. The stem alternates stacked flat discs, collars, and hollow swellings, one round, the other pear-shaped. On the bowl, engraved in matte grey in the transparent glass, extends a view of a town: half-timbered houses, roofs, a gate, large trees with dense foliage, a palisade. In the foreground, on the square, two men walk one behind the other, together carrying on their shoulders a long beam on which an inscription can be read. Beneath the scene, a band of Gothic script runs around the bowl. The foot is engraved with leafy sprays."""
evocation = """
The scene is at once a view of Nuremberg, the Panierplatz, and an allegory, as the Cleveland Museum indicates. The inscriptions give its meaning. On the beam one reads: "Es ruhet auf beiden", "it rests on both of them"; and around the bowl: "Deine Last ist meine Last. Ruhest du, so hab ich Rast", "Your burden is my burden. If you rest, then I rest". It is an image of friendship, or perhaps of marriage, in which each bears his share of the common load. One imagines this goblet raised at a meal, and the motto read aloud. Engraved goblets thus served as gifts and keepsakes, laden with wishes, mottoes and images."""
histoire = """
Hermann Schwinger (1640–1683) is one of the best glass engravers of Nuremberg. The city had become, in the 17th century, the great centre of this art in Germany, after Georg Schwanhardt, a pupil of Caspar Lehmann, engraver to the Emperor Rudolf II in Prague, settled there. The Cleveland Museum classifies the glass of the goblet as Bohemian production, whose glasshouses supplied the engravers. The goblet is signed and dated. At the beginning of the 20th century, it belonged to the Viennese collector Max Strauss, whose collection was sold at auction in Vienna in 1922. It then passed to the dealers Rosenberg and Stiebel, in New York, before being bought in 1950 by the Cleveland Museum through the John L. Severance Fund."""
facture = """
Wheel engraving takes up the tools of the engravers of semi-precious stones. The craftsman uses small copper wheels, of varying diameters, mounted on a lathe and coated with a mixture of oil and abrasive powder. He does not move the tool: it is the glass that he presents against the turning wheel, guiding it with extreme precision. The wheel wears away the surface and leaves a matte, grey hollow, more or less deep, which reads like a drawing in grisaille; some parts remain polished to catch the light. This technique requires thick, hard glass; the Nuremberg goblets, with their stems with hollow swellings and collars, set off the engraved bowl."""
details = [
  "The two porters sharing the same beam on their shoulders.",
  "The small inscription engraved on the beam.",
  "The half-timbered houses and the dense foliage of the trees.",
  "The stacked collars of the stem, around the hollow swelling.",
  "The sprays engraved on the foot.",
]
themes = ["engraving", "nuremberg", "friendship", "motto", "baroque"]
anecdote = """
The engraver worked "in reverse" of the light: an engraved hollow appears light on a dark ground and dark on a light ground. Museum photographers therefore light these glasses against a black background, to bring out the design."""
salle = 4
mur = "nord"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Covered Goblet with a Lying-In Scene"
artiste = "Jacob Sang (gravure), verrerie anglaise"
annee = "1750–1770"
image = "gobelet-jacob-sang.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/266209"
technique = "Blown lead glass, wheel-engraved; height 25.8 cm, diameter 11.5 cm"
collection = "Art Institute of Chicago"
note = "An English lead-glass goblet, engraved in Amsterdam with a lying-in chamber, and a toast to the health of mother and child."
description = """
The goblet, topped with its lid, stands against a black ground that brings out the engraving. The bell-shaped bowl rests on a short foot whose knop is scattered with air bubbles arranged in a ring. On the front, a large scene occupies the bowl: a canopied bed, its curtains drawn back, in which a woman sits, propped against her pillows; beside it, a nurse stands near a cradle. The floor is a tiled pavement in perspective. Along the rim runs an inscription in capital letters. The domed lid is engraved with a garland of foliage; it ends in a knop with twisted bubbles and a faceted point."""
evocation = """
The goblet belongs to the ritual of birth in the 18th-century United Provinces. According to the Art Institute, it served the kandeel, a nourishing drink of eggs, alcohol and cinnamon, offered to the new mother and her visitors. The engraving shows precisely this chamber: the young mother in bed, the nurse rocking the child, a drying rack for nappies, chairs and a table laid with sweetmeats and two goblets similar to this one. The inscription bears the toast: "'t Welvaaren van de Kraamvrouw en Kindje", "to the health of the new mother and her child". In an age when childbirth remained dangerous, the goblet celebrates a happy birth and gathers the family around the mother."""
histoire = """
The engraving is attributed to Jacob Sang, active in Amsterdam in the 1750s, one of the most skilled and renowned engravers of the city according to the Art Institute. In the Netherlands, the demand for personalised glasses was immense: they were engraved for weddings, births, commercial successes or political events. The glass itself comes from England, whose lead glasses were highly appreciated by Dutch engravers. The goblet was commissioned by the family of the barons van Slingelandt and was passed down in the family until the 21st century. It then passed to the dealer Frides Laméris, in Amsterdam, before being bought in 2023 by the Art Institute of Chicago."""
facture = """
In 1674, the Englishman George Ravenscroft patented a glass in which lead oxide replaced part of the potash. This lead glass, the future crystal, is heavy, very clear, and strongly refracts light; it is also softer, hence ideal for wheel engraving, which can cut very fine reliefs and subtle shadows into it. Sang makes the most of this material: the bed curtains, the folds of the sheets and the tiled floor are modelled by hollows of varying depth. The English glassblower, for his part, left in the knop of the stem a ring of air bubbles, obtained by pricking the hot glass and then covering it with a new layer of glass: an ornament typical of English glasses of the 18th century."""
details = [
  "The young mother seated in the canopied bed with its curtains drawn back.",
  "The nurse seated near the cradle.",
  "The tiled floor, engraved in perspective.",
  "The ring of air bubbles in the knop of the foot.",
  "The garland of foliage engraved on the lid.",
]
themes = ["birth", "engraving", "amsterdam", "lead glass", "toast"]
anecdote = """
Dutch engravers bought English glasses so readily that they made them their favourite support: collections often contain glasses blown in Newcastle or London and engraved in the Netherlands."""
