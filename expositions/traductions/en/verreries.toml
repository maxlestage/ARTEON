[[oeuvres]]
titre = "Orchid Vase"
artiste = "Émile Gallé"
annee = "c. 1900"
image = "vase-orchidees-galle.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/45125"
technique = "Cased glass, acid-etched and wheel-engraved; 29.4 × 14.3 × 11.8 cm"
collection = "Art Institute of Chicago"
note = "Lady's slipper orchids emerge from the thickness of amber and purple glass: Gallé carves glass like a stone of many layers."
description = """
The vase is a simple cylinder, thirty centimetres tall, with a slightly thickened rim. Its ground is an amber glass, a honey yellow that shades to orange and, in places, to red. Over it stand out in relief, in a very dark purple, the stems and flowers of orchids. One recognises their petals streaked with fine veins, their upper sepal raised like a hood and, at the centre, their swollen lip in the form of a small slipper. Some flowers open wide, others are still only buds. Below, long veined leaves rise from the foot and curve over. The top of the vase is darker, as if the flowers were emerging from shadow into light."""
evocation = """
Gallé was at once a glassmaker, a cabinetmaker and a passionate botanist, a member of the Société centrale d'horticulture de Nancy; he cultivated and studied the plants he depicted. Orchids, which came from the greenhouses where the Belle Époque collected them at fabulous prices, fascinated his contemporaries with their strange, almost animal forms: the lady's slipper looks like a little shoe. Gallé does not content himself with copying them. By making them emerge from the depth of the glass, half-immersed in shadow, he gives them a mysterious life, close to the Symbolist poems he loved. For him, the work of art should speak of nature, but also of the soul: this vase is a greenhouse in miniature, and a reverie."""
histoire = """
Born in Nancy in 1846, the son of a dealer in earthenware and glassware, Émile Gallé studied botany and chemistry, then learned the glassmaker's trade at Meisenthal, in Lorraine. He took over the family business, which his entries at the Paris World's Fairs made famous, in 1878, in 1889 and then in 1900, where he triumphed. In 1901, he founded with other artists the École de Nancy, of which he was the first president. He died in 1904; his glassworks continued for nearly thirty years to produce vases signed with his name. This one, dated around 1900, entered the Art Institute of Chicago through the gift of Mrs. Cyrus Bentley. Another piece by Gallé, the colchicum vase in the Metropolitan Museum, is shown in the exhibition devoted to the decorative arts."""
facture = """
The vase is made of superimposed glasses: the glassmaker blows a first amber parison, then covers it with one or more layers of coloured glass. The decoration is then carved into this thickness, as in a cameo. Gallé uses hydrofluoric acid, which eats away the glass: the motif is protected with a varnish, then the vase is immersed in the bath, which dissolves the upper layer around the flowers. The details, the veins of the petals and leaves, are reworked on the wheel. Depending on the thickness of purple glass left in place, the colour ranges from transparent red to almost black: it is this play of depths that gives the decoration its modelling and its light."""
details = [
  "The swollen slipper-shaped lip at the heart of each orchid.",
  "The fine streaks of the petals, reworked on the wheel.",
  "The still-closed buds at the ends of the stems.",
  "The long veined leaves rising from the foot.",
  "The amber ground that passes from honey yellow to red.",
]
themes = ["art nouveau", "orchids", "nancy", "nature", "cameo"]
anecdote = """
On the door of his Nancy workshops, Gallé had had a motto engraved: "My root is deep in the woods". It sums up his art, in which each object is born of the observation of plants."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Peacock Feather Vase"
artiste = "Louis Comfort Tiffany"
annee = "1893–1896"
image = "vase-paon-tiffany.jpg"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/9480"
technique = "Blown Favrile glass; 35.9 × 29.2 cm"
collection = "Metropolitan Museum of Art, New York"
note = "One of Tiffany's first Favrile glass vases: a flower of iridescent glass opening like a fan, covered with peacock feathers."
description = """
The vase has the form of a flower or an open fan. From a round, low body rises a long narrow neck, which suddenly widens into a vast undulating corolla, pinched at the sides and falling in two points. The whole object is an olive green, traversed by fine darker lines that start from the foot, rise along the neck and spread out in the corolla like the barbs of a feather. At the top, these lines wind around four peacock "eyes", midnight-blue spots ringed with violet and gold. The surface is iridescent: depending on the angle, it is covered with pink, violet, blue and golden glints. The rim of the corolla, a lighter green, is slightly rolled."""
evocation = """
The peacock is one of the emblems of Aestheticism and Art Nouveau, from Whistler's Peacock Room in London to Lalique's jewels. It speaks of the taste of the age for pure beauty, for colour and luxury, and for the Orient too, from which the bird came. Tiffany, a painter by training, found in it an ideal motif for his glass, whose colours change with the light like those of a feather. He does not depict the bird: he turns the vase itself into a peacock's tail, and the material into plumage. This fusion of form and decoration, inspired by nature, is at the heart of Art Nouveau, and makes this vase a sculpture as much as a vessel."""
histoire = """
Louis Comfort Tiffany (1848–1933), son of the founder of the famous New York jeweller, had first made his name as a painter, then as a decorator and designer of stained glass. In 1893, he opened his own glasshouse at Corona, in Queens, with the English glassmaker Arthur J. Nash, and launched Favrile glass. This vase is among the first productions of the workshop. As early as 1896, the sugar magnate Henry O. Havemeyer, a great collector and client of Tiffany, who had decorated his New York house, gave the Metropolitan Museum a group of Favrile vases, including this one. In Paris, the dealer Siegfried Bing exhibited Tiffany's glass from 1895 in his gallery, the Maison de l'Art Nouveau."""
facture = """
Favrile is a name invented by Tiffany, after an old English word, fabrile, "of the craftsman"; according to the Cleveland Museum, it was meant to sound French, precious and artisanal. The feather decoration is obtained hot: the glassblower lays threads of coloured glass on the parison, then draws them with a hook to form the barbs and the eyes, before giving the vase its final shape. The iridescence comes from metallic salts applied to the still-hot glass, which form on the surface a very thin film in which light is broken up. Tiffany thus sought to recapture the brilliance of ancient glasses iridescent from burial, which he collected."""
details = [
  "The four midnight-blue peacock \"eyes\", at the top of the corolla.",
  "The fine lines rising from the foot like the barbs of a feather.",
  "The pink and violet glints of the iridescence.",
  "The pinched corolla falling in two points.",
  "The round, low body, of a deeper green.",
]
themes = ["art nouveau", "peacock", "iridescence", "new york", "favrile glass"]
anecdote = """
Tiffany also created stained glass, mosaics and lamps: his window "Magnolias and Irises" and the "Wisteria" lamp from his workshops are shown in the exhibition devoted to the decorative arts."""
salle = 5
mur = "est"
place = 2
