[exposition]
ordre = 57
nom_court = "Glassware"
mouvement = "The Art of Glass, from Antiquity to Art Nouveau"
cadre = "vitrine"
couleur = "#2a7280"
titre = "Glassware: Thirty-Five Centuries of Glass Art"
artiste = "Gallé, Tiffany, Lalique, Hermann Schwinger, Jacob Sang, glassmakers of Egypt, Rome, Cairo and Murano…"
dates = "c. 1386 B.C. – 1912"
accroche = "Virtual exhibition · Corning Museum of Glass, Corning (New York)"
introduction = """
Glass is born of sand, soda or potash, and fire: an ordinary material that becomes, in the hands of glassmakers, one of the most precious there is. The visit follows ten objects across more than three thousand years, from a perfume flask made in Egypt in the time of Akhenaten to the vases of Gallé, Tiffany and Lalique. Along the way, you will meet the golden portrait of a young Alexandrian, a mosque lamp enamelled for an emir of Cairo, a Murano goblet woven with white threads, and the scenes wheel-engraved by the masters of Nuremberg and Amsterdam. The building draws its inspiration from the Corning Museum of Glass, in New York State, the largest museum in the world devoted to glass: you enter through an all-white wing, bathed in light, before moving on through the historical galleries."""
vitrine = "vase-paon-tiffany.jpg"

[musee]
nom = "Corning Museum of Glass"
ville = "Corning, New York, United States"
architecte = "Harrison & Abramovitz (1951), Gunnar Birkerts (1980), Thomas Phifer and Partners (2015)"
construction = "1951–2015"
presentation = """
Corning, a small town in upstate New York, has lived by glass since the Corning Glass Works glasshouse settled there in 1868. In 1951, for its centennial, the company founded a museum devoted to the art and history of glass, housed in a glass-and-steel building designed by the firm Harrison & Abramovitz. In June 1972, the flooding of the Chemung River, swollen by Hurricane Agnes, inundated the galleries and damaged hundreds of objects, which were patiently restored. A new building, by the architect Gunnar Birkerts, opened in 1980. In 2015, Thomas Phifer's Contemporary Art + Design Wing added a wing clad in white glass panels: a vast all-white gallery, lit by diffuse natural light falling from the ceiling, and an amphitheatre-style studio where glass is blown before the public. The historical galleries trace thirty-five centuries of glass; the neighbouring Rakow Library is the world's great library of glass."""
ici = """
The ARTEON building borrows both faces of the Corning Museum. You enter from the south into "The White Wing", a great volume sixteen metres by twelve, eight metres high, with white walls like Thomas Phifer's gallery: it is left empty, so that you look first at the light. To the north begin the historical galleries, four rooms in a row from west to east, like a chronological journey: Antiquity, with sand-grey walls; Islam and Venice, in a pale lagoon blue; engraved glass, pearl grey; and finally the Art Nouveau room, larger and taller, in a water green. The objects, often only a few centimetres tall, are presented enlarged in wall cases on a light background."""

