[[oeuvres]]
titre = "“Frogs and Water Lilies” Vase"
artiste = "René Lalique"
annee = "1909–1912"
image = "vase-grenouilles-lalique.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/2007.180"
technique = "Moulded, cast and applied glass, patinated; 21 × 29.8 cm"
collection = "Cleveland Museum of Art"
note = "One of René Lalique's first vases: on glass frosted like cloudy water, deep green frogs huddle on water lily leaves."
description = """
The vase has a low, squat form, a wide, angular body topped by a short, flaring neck. The glass is colourless, but frosted and satiny, like cloudy water. On the shoulder, large water lily leaves, patinated in grey, spread out in relief; their long wavy stems descend to the foot, and flower buds can be made out. On the leaves, about ten frogs press against one another, crouching. They are an intense, shining green, from emerald green to almost black, with their legs folded and their backs marked with lines. On the lower part of the body, the moulded signature "R. LALIQUE" can be read."""
evocation = """
The Cleveland Museum sees in it the image of a misty marsh, a typical Art Nouveau motif. The pond, with its aquatic plants and its small animals, is one of the favourite themes of the artists of the period, nourished on Japanese prints: a hidden, humid world, between water and air, where life teems. Lalique draws an almost theatrical effect from it: the veiled transparency of the glass suggests the depth of the water, while the frogs, in a dazzling colour, seem to emerge from the surface. The contrast between matte and shining glass, between grey and green, animates the object. Humour is not absent: these frogs crowded together as on a raft have something lively and comic about them."""
histoire = """
René Lalique (1860–1945), first famous as a jeweller, turned to glass at the beginning of the 20th century. Around 1907, he designed perfume bottles for François Coty; in 1909, he rented and then bought a glasshouse at Combs-la-Ville, near Paris. This vase, according to the Cleveland Museum, is an early witness to his research on art glass, before the mass production of his famous moulded vases of the 1920s. In the 20th century, it passed through several collections, in America and Japan, and through sales at Phillips and Christie's in New York. The Cleveland Museum bought it in 2007 through the John L. Severance Fund. The "Tourbillons" vase, of 1926, is shown in the exhibition devoted to the decorative arts."""
facture = """
Lalique combines several techniques here, as the Cleveland Museum explains: the body of the vase is moulded, the frogs are made of green glass cast and applied to the wall. The colourless glass is then frosted, probably with acid, to give it its satiny appearance, and a grey patina is deposited in the hollows of the leaves and stems to emphasise the relief. In an ingenious detail, Lalique placed small sheets of metal behind the frogs: they send back towards the viewer a dark, deep green light. The artist, who was accustomed to enamel and coloured stones, transposes into glass his research as a jeweller."""
details = [
  "The crouching green frogs, pressed against one another.",
  "The water lily leaves patinated in grey, on the shoulder.",
  "The long wavy stems descending towards the foot.",
  "The frosted glass, matte and satiny, like cloudy water.",
  "The moulded signature \"R. LALIQUE\", on the lower body.",
]
themes = ["art nouveau", "frogs", "pond", "moulded glass", "lalique"]
anecdote = """
The glassworks that Lalique founded in 1921 at Wingen-sur-Moder, in Alsace, still makes crystal under his name. He died in 1945: the vases he created before 1931 are now in the public domain."""
salle = 5
mur = "sud"
place = 3
