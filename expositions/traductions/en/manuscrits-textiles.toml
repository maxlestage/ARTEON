titre = "Manuscripts and Tapestries, the Middle Ages in Pages and Threads"
artiste = "Monks of Iona, Eadfrith, Jean de Bruges, Bourdichon, Cresques…"
dates = "8th–16th century"
accroche = "Virtual exhibition · Bibliothèque nationale de France, Richelieu site, Paris"
introduction = """
Before printing, books were copied and painted by hand, page by page, and great images were woven or embroidered to dress the walls. This exhibition brings together ten of these treasures: the gospel books of Ireland and Northumbria, a Romanesque Apocalypse, a giant Bible, an Aztec calendar, a world map of 1375, a royal book of hours, the Bayeux Tapestry and two of the most famous hangings of the Middle Ages. The building is inspired by the Richelieu site of the Bibliothèque nationale de France in Paris: the manuscripts are displayed in a square room evoking the Labrouste Reading Room and in a tall room recalling the Oval Room, the tapestries in a long gallery inspired by the Mazarine Gallery."""
vitrine = "kells-chi-rho.jpg"

[musee]
nom = "Bibliothèque nationale de France, Richelieu site"
ville = "Paris, France"
architecte = "François Mansart, Henri Labrouste, Jean-Louis Pascal"
construction = "17th–20th century"
presentation = """
In the heart of Paris, between the Palais-Royal and the Bourse, the Richelieu quadrangle brings together buildings raised over nearly four centuries. In the 1640s, Cardinal Mazarin installed his palace and collections there; François Mansart built him the Mazarine Gallery, whose ceiling was painted by Giovanni Francesco Romanelli. From 1721, the King's Library established itself within these walls. In the nineteenth century, Henri Labrouste built the great reading room for printed books, opened in 1868: sixteen slender cast-iron columns carry nine domes, each pierced by an oculus. Jean-Louis Pascal then undertook the Oval Room, completed by Alfred Recoura and opened in the 1930s beneath an immense glass roof. After the printed books moved to the François-Mitterrand site in the late 1990s, Richelieu kept the manuscripts, prints, maps, coins and medals. Renovated by Bruno Gaudin and Virginie Brégal, it reopened in 2022 with a museum and an Oval Room open to all."""
ici = """
ARTEON's building brings together three famous spaces of Richelieu around a central room. One enters from the south into the vestibule, with cream walls, then into the Labrouste Room, square, eighteen metres on a side and ten high, with ivory walls, where the insular gospel books, the Saint-Sever Apocalypse and the Souvigny Bible are displayed. To the west stretches the Mazarine Gallery, thirty metres long, reserved for the Bayeux Tapestry and the tapestries. To the east, the Oval Room, rectangular here but fourteen metres high, holds the book of hours, the Aztec codex and the Catalan Atlas."""

