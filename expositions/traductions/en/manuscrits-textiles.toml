[[oeuvres]]
titre = "Book of Kells: the Chi Rho Monogram"
artiste = "Moines d'Iona et de Kells"
annee = "c. 800"
image = "kells-chi-rho.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:KellsFol034rChiRhoMonogram.jpg"
technique = "Inks and pigments on vellum, folio 34 recto; leaf approx. 33 × 25 cm"
collection = "Trinity College, Dublin"
note = "The most famous page of the Book of Kells: the Greek initials of Christ's name overrun the whole leaf, which measures about 33 cm high."
description = """
The page is almost entirely taken up by three giant letters. An immense X, the Greek chi, starts from the upper left corner, its branches curved like blades. Beneath it stands the P, the rho, and a more discreet I, barely recognisable: together they form XPI, the abbreviation of Christ's name. Every centimetre is covered with spirals, braids, discs and interlace, in yellow, purple, green and red. At lower right, in smaller letters, one reads h generatio: the Gospel sentence resumes. In the margins and between the letters hide angels, a man's head at the end of the loop of the rho, cats, mice and an otter holding a fish in its mouth."""
evocation = """
The page marks the place where the Gospel of Matthew, after the long genealogy of Jesus, begins the account of his birth: “Now the birth of Jesus Christ was on this wise”. For the monks, this is the moment when God enters human history, and they devote an entire page to it, like an icon made of letters. The animals slipped into the decoration have received several readings: the otter and its fish, an ancient symbol of Christ, and the mice fighting over a host beneath the gaze of the cats have been seen as images of the Eucharist, but also as winks at the daily life of the monastery. The page finally expresses the pride of an art that fuses the Celtic heritage, Germanic ornament and the Latin culture of the Church."""
histoire = """
The Book of Kells contains the four Gospels in Latin, preceded by tables and painted pages. It is thought to have been begun around 800 at the monastery on the island of Iona, in Scotland, founded by Saint Columba, then completed or at least preserved at Kells, in Ireland, where part of the monks withdrew after the Viking raids of the early ninth century. The Irish annals report that in 1007 the great gospel book of Columba was stolen from the church at Kells, then found under a sod of earth, stripped of its gold cover. In the seventeenth century, the Bishop of Meath gave it to Trinity College Dublin, where it is still kept. Bound today in four volumes, it is displayed in the college library, where the pages shown are changed regularly."""
facture = """
The text and decoration are painted on vellum, a finely prepared calfskin. The colours come from minerals and plants: orpiment yellow, reds, copper green, purples and blues of vegetable origin. There is almost no gold: the brilliance comes from the yellow and the density of the patterns. The spirals and interlace were constructed with compass and ruler, then filled in freehand with such precision that some details can be seen only with a magnifying glass. Specialists distinguish several illuminators' hands in the manuscript."""
details = [
  "The man's head that ends the loop of the rho, at the centre of the page.",
  "The letters h generatio, at lower right: the text resumes after the monogram.",
  "At the foot of the letters, two cats watching mice holding a round host.",
  "The otter holding a fish in its mouth, near the bottom of the page.",
  "The angels with folded wings, along the left edge of the great X.",
]
themes = ["gospel", "letter", "interlace", "celtic art", "christ"]
anecdote = """
In 1007, the manuscript was stolen at night from the church at Kells. According to the Irish annals, it was found a few months later buried under a sod of turf: the thieves had wanted only its cover of gold and precious stones, which never reappeared."""
salle = 2
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Lindisfarne Gospels: the Carpet Page of Saint Matthew"
artiste = "Eadfrith de Lindisfarne"
annee = "c. 715–720"
image = "lindisfarne-page-tapis.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:F26v.jpg"
technique = "Inks and pigments on vellum, folio 26 verso"
collection = "British Library, London (Cotton MS Nero D IV)"
note = "A cross drowned in a carpet of interlace opens the Gospel of Matthew, in a manuscript painted in Northumbria in the early eighth century."
description = """
No figure, no word: the whole page is a carpet of patterns. At the centre, a great cross with bell-shaped arms stands out, outlined in red, against a background teeming with lines. Small pale discs punctuate its centre and arms. In the compartments around it, blue, pink, green and golden ribbons coil endlessly; following them, one discovers that they are the bodies of stretched birds and quadrupeds, intertwining and biting one another. A stepped frame, green and gold, surrounds the whole, and small knotted ornaments project from it at the middle of each side. The parchment, yellowed at the edges, bears the traces of thirteen centuries of reading."""
evocation = """
Carpet pages, characteristic of the manuscripts of Ireland and Britain, precede each of the Gospels like a threshold. Before entering the sacred text, the reader contemplates a cross hidden in a labyrinth and must search to see it: this has been seen as a form of meditation, the page preparing the mind for reading. Their modern name comes from their resemblance to Oriental carpets, and some historians have compared these patterns to the precious fabrics that came from the Mediterranean. One can also read in them an image of the world: the tangled animals, inherited from Anglo-Saxon metalwork, are caught in the order of the cross, like wild nature in God's design."""
histoire = """
The manuscript was made at the monastery of Lindisfarne, on an island off the Northumbrian coast, in honour of Saint Cuthbert, who died in 687 and whose relics were venerated there. In the tenth century, the priest Aldred added a note at the end of the book: according to him, Eadfrith, Bishop of Lindisfarne, wrote it, Æthelwald bound it and the hermit Billfrith adorned it with gems. Aldred also slipped between the Latin lines a translation into Old English, the oldest surviving version of the Gospels in the English language. After the Viking raids, the monks left the island with Cuthbert's body and the book, which reached Durham. It later entered the collection of Sir Robert Cotton, one of the founding collections of the British Museum, and today belongs to the British Library."""
facture = """
Eadfrith seems to have worked almost alone, which explains the unity of the decoration. The patterns were carefully prepared: on the reverse of some leaves, one can make out preparatory lines, grids and the small holes left by the point of the compass. The colours, of great variety, are drawn from minerals and plants. The interlace obeys a strict rule: each ribbon passes alternately over and under, never breaking the rhythm. The stepped frame and the ornaments projecting from it recall cloisonné metalwork plaques."""
details = [
  "The small pale discs that punctuate the cross, like set stones.",
  "The arms of the cross, widened at their ends into a bell shape.",
  "The ribbons at the bottom of the page, which become animal bodies when one follows their loops.",
  "The four knotted ornaments that project beyond the frame, at the middle of each side.",
]
themes = ["cross", "interlace", "gospel", "meditation", "insular art"]
anecdote = """
In the early twelfth century, the chronicler Symeon of Durham relates that a precious gospel book, carried off by the monks in their flight, fell into the sea and was found intact on the shore at low tide. It is often identified with the Lindisfarne Gospels, but the account is the stuff of legend."""
salle = 2
mur = "nord"
place = 4
largeur = 1.2

[[oeuvres]]
titre = "Saint-Sever Apocalypse: the Four Horsemen"
artiste = "Scriptorium de Saint-Sever"
annee = "mid-11th century"
image = "beatus-quatre-cavaliers.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:ApocalypseStSeverFol108v109r4Horsemen.jpg"
technique = "Paint on parchment, double page (folios 108 verso and 109 recto); leaf approx. 36 × 28 cm"
collection = "Bibliothèque nationale de France, Paris (Latin 8878)"
note = "The four horsemen of the Apocalypse gallop across bands of colour, in the only great Beatus painted in France."
description = """
On two facing pages, the decoration is divided into broad horizontal bands: blue, red, dark green, pale yellow. At the top, a crowned horseman on a white horse draws a bow; another, on a red horse, brandishes a long sword. Below, a third, mounted on a black horse, raises a balance; the last, on a pale horse, has hair standing up like flames, and the word MORS, Death, is written above his head. In medallions, the Lamb opens one after another the seals of a book. Beside each horseman, one of the four Living Creatures, angel, winged ox, lion or eagle, addresses Saint John, who stands at the edge of the page, haloed."""
evocation = """
Chapter 6 of the Apocalypse describes the opening of the first four seals: each time a horseman appears, whom tradition associates with conquest, war, famine and death. In the Beatus manuscripts, these visions are not there to frighten: they accompany a learned commentary that explains them line by line. The first horseman, crowned, is understood there as the victorious Christ, or as the Church proclaiming the Gospel. The coloured bands remove the scenes from any real landscape: we are in the time of vision, outside the world. For the monks of the eleventh century, who read the Apocalypse as a book about the history of the Church and the end of time, these images called for vigilance."""
histoire = """
Around 776, Beatus, a monk of Liébana, in the mountains of northern Spain, composed a commentary on the Apocalypse drawn from the writings of the Church Fathers. The text, copied and illustrated for centuries in the Christian kingdoms of Spain, gives its name to a family of manuscripts, the Beatus manuscripts, of which more than twenty have survived with their paintings. This one is an exception: it was made in Gascony, at the abbey of Saint-Sever, under Abbot Gregory of Montaner, who ruled it from 1028 to 1072. Its paintings follow a Spanish model, but with figures marked by the nascent Romanesque art of south-western France. It is kept in the Manuscripts Department of the Bibliothèque nationale de France, at the Richelieu site."""
facture = """
The painter works in flat areas of pure, thick, brilliant colours, without shadow or perspective. The banded backgrounds, inherited from the Mozarabic Beatus manuscripts of Spain, organise the double page like a musical score. The horses, by contrast, are more lively than in the Spanish models: legs stretched in the gallop, manes and tails flowing. The human figures, with drapery picked out in dark lines, recall the Romanesque sculpture of the region. Latin inscriptions in capitals, traced within the image, name the figures and quote the text."""
details = [
  "The word MORS, Death, above the last horseman with flame-like hair.",
  "The balance raised by the rider of the black horse, a sign of famine.",
  "The eagle covered with eyes, at lower right, one of the four Living Creatures.",
  "The four small figures of Saint John watching the vision from the edges.",
  "The Lamb in its medallions, one paw placed on the sealed book.",
]
themes = ["apocalypse", "horsemen", "romanesque art", "vision", "end times"]
anecdote = """
The manuscript preserves the name of Stephanus Garsia, inscribed in its pages. He is often considered one of the book's painters, perhaps the principal one, but his exact role is not established: the monks of the eleventh century rarely signed their works."""
salle = 2
mur = "nord"
place = 3
largeur = 2.2

[[oeuvres]]
titre = "Souvigny Bible: the Creation"
artiste = "Enlumineurs de la Bible de Souvigny"
annee = "late 12th century"
image = "souvigny-creation.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Bible_de_Souvigny_-_Bibliothèque_de_Moulins_f4v.jpg"
technique = "Paint and gold on parchment, folio 4 verso"
collection = "Médiathèque de Moulins (MS 1), Moulins"
note = "Eight small scenes on a gold ground tell of the Creation and the fall of Adam and Eve, at the head of a giant Romanesque Bible."
description = """
On the left of the page, eight panels bordered in blue and red form a column of images; on the right, a column of text opens with the words IN PRINCIPIO, “In the beginning”. The first six panels show the days of Creation. In each, the Creator, in the likeness of Christ, appears half-length within an arc of sky: he hovers above the waters where the dove of the Spirit stands, separates the waters, makes the trees grow, holds the sun and the moon, then brings forth the birds, the fish and the animals of the earth. The last two panels tell of man: God draws Eve from the side of the sleeping Adam, then Adam and Eve, naked, stand on either side of the tree around which the serpent coils."""
evocation = """
Placed at the opening of Genesis, the page sums up in a few images the whole account of origins, from the chaos of the waters to the fall. Giving the Creator the face of Christ follows the Gospel of John, for whom in the beginning was the Word, through whom all things were made: the image thus links the first book of the Bible to the New Testament. The order in panels, read from left to right and top to bottom, gives the world a regular construction, like an edifice. The last image, the fall, announces what follows in the book: all the sacred history that follows, up to the coming of Christ, was understood as the repair of this fault."""
histoire = """
This single-volume Bible, of very large format, was copied and painted in the late twelfth century. It belonged to the priory of Souvigny, in the Bourbonnais, one of the most important monasteries of the Cluniac order, where the holy abbots Mayeul and Odilo were venerated. The exact place of its making remains debated. These giant Bibles, placed on a lectern, served for solemn reading and asserted the wealth of the community. At the Revolution, the property of monasteries was confiscated: the manuscript joined the library of Moulins, chief town of the new département of the Allier, where it is still kept, with its numerous painted initials and scenes."""
facture = """
The figures stand out against a ground of gold leaf, burnished to shine, which makes each panel a small stained-glass window. The drapery is drawn with tight folds and double lines, typical of late Romanesque art. The waters are rendered by wavy white lines on blue, the trees by supple trunks ending in a fan. The borders, blue and red, are punctuated by white pearls and small rosettes at the intersections. The text of Genesis, on the right, is paced by painted initials and by the numbers of the days, in red Roman numerals."""
details = [
  "The Creator holding the sun and the moon, in the fourth panel.",
  "The concentric arcs of sky of the second and fourth days.",
  "The small bestiary of the sixth day, gathered on green hills.",
  "Eve emerging from the side of the sleeping Adam, drawn out by the hand of God.",
  "The red Roman numerals that number the days in the text, on the right.",
]
themes = ["creation", "genesis", "adam and eve", "gold ground", "romanesque art"]
anecdote = """
In the church of Souvigny, where this Bible comes from, rest Saint Mayeul and Saint Odilo, two of the most famous abbots of Cluny, who died in 994 and 1049. Their tombs made the priory a place of pilgrimage, and a source of wealth."""
salle = 2
mur = "sud"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "Codex Borbonicus: the Trecena of Tlazolteotl"
artiste = "Peintres-scribes aztèques"
annee = "early 16th century"
image = "codex-borbonicus.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Borbonicus_Codex_p13_Wiki.png"
technique = "Paint on bark paper (amate), page 13; page approx. 39 × 39 cm"
collection = "Library of the Assemblée nationale, Paris"
note = "A page from the Aztec divinatory calendar: the goddess Tlazolteotl presides over a period of thirteen days, whose signs line up along two sides."
description = """
The square page reads like a table. In the large box at upper left, a goddess with a red face, wearing white cotton and feathers, crouches in the position of childbirth: beneath her appears a small god, the child she is bringing into the world. Beside her, a second deity, dressed in a bird costume with large brown wings, holds ritual objects. Around them float symbols: a serpent, footprints, offerings, a small stepped platform. On the right and at the bottom, two rows of boxes contain the thirteen days of the period, each with its sign, its number in red dots, a night god and a bird. Annotations in Spanish, in ink, name certain days."""
evocation = """
The Aztecs counted time with two interlocking calendars: a solar year of 365 days and a divinatory cycle of 260 days, the tonalpohualli, divided into twenty periods of thirteen days. Each period was placed under the protection of a god, and each day carried a destiny, good or bad, which the priests consulted for a birth, a marriage, a journey or a war. Tlazolteotl, goddess of fertility, sexuality and purification, also received the confession of sins and erased them. By showing her giving birth to a young god, often identified with the maize god, the page associates human birth with the renewal of the harvests. The codex was a working tool as much as a sacred book."""
histoire = """
The Codex Borbonicus was painted in the region of Mexico City, at the time of the Spanish conquest or shortly after: specialists still debate whether it predates or postdates 1521. It consists of a long strip of paper folded like an accordion, whose first and last pages are missing. After the divinatory calendar, it shows the cycle of festivals of the solar year. The Spanish annotations were added after the conquest. Like most Aztec manuscripts, it left Mexico in unknown circumstances. In 1826, the library of the Chamber of Deputies bought it, and it owes its name to the Palais Bourbon, where it is still kept. The image shown here reproduces the colour facsimile published in Paris in 1899."""
facture = """
The painter-scribe, the tlacuilo, works on amate paper, made by beating the inner bark of wild fig trees. The figures are first outlined with a regular black line, then filled with flat colours, without shadow: red, turquoise blue, yellow, green, brown. The figures are built from juxtaposed signs, each element of the costume, hairstyle or face paint making it possible to identify the god. The page ignores perspective: the size of a figure tells its importance. The red lines that divide the page into boxes guide the reading."""
details = [
  "The small god who appears beneath the crouching goddess, at upper left.",
  "The red dots that count the days from 1 to 13, beside each sign.",
  "The birds of the right-hand column, one per day: parrots and an owl can be recognised.",
  "The Spanish annotations, such as segundo dia pedernal, “second day: flint”.",
  "The footprints rising towards the top of the page, near the goddess.",
]
themes = ["calendar", "aztecs", "divination", "birth", "mexico"]
anecdote = """
Folded like an accordion, the Codex Borbonicus is shelved like a book; unfolded, it forms a strip of more than fourteen metres, which one could take in at a glance to follow the cycle of days and festivals."""
salle = 4
mur = "nord"
place = 3
largeur = 1.4

[[oeuvres]]
titre = "The Bayeux Tapestry: Halley's Comet"
artiste = "Atelier anglo-saxon"
annee = "c. 1070"
image = "bayeux-comete.jpg"
cadre = "aucun"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Bayeux_Tapestry_32-33_comet_Halley_Harold.jpg"
technique = "Wool embroidery on linen, scenes 32 and 33; height approx. 50 cm (total length: nearly 70 m)"
collection = "Bayeux Tapestry Museum, Bayeux"
note = "A comet crosses the sky: men point at it, while Harold, just crowned King of England, receives the news. The embroidery is about 50 cm high."
description = """
The scene reads from left to right, like a comic strip. Beneath the Latin inscription ISTI MIRANT STELLA, “these men marvel at the star”, a group of men huddled near a building point towards the sky, where a comet with a flaming tail streaks by. Another man, standing apart, also raises his hand. On the right, beneath the arcade of a palace crowned with turrets and birds, King Harold, crowned, seated on his throne, leans towards a man who has come to speak to him. Beneath the palace, in the lower border, empty ships appear, like ghostly silhouettes. The colours are few, brown, green, dark blue, ochre, on the unbleached ground of the linen."""
evocation = """
Halley's Comet passed through the skies of Europe in the spring of 1066, a few months after the coronation of Harold Godwinson in January. In the Middle Ages, a comet announced an upheaval: the death of a king, the fall of a kingdom. Placed here, it prepares the viewer for what follows, the defeat and death of Harold at Hastings, in October. The ghost ships of the border, which one reads as the announcement of the Norman invasion or as the king's foreboding, show the authors' talent as storytellers. Made for the victors, the embroidery presents Harold as a perjurer who betrayed his oath to William; but it also shows him with a certain dignity, which fuels many debates."""
histoire = """
The embroidery recounts, in 58 scenes according to the modern numbering, the conquest of England by William, Duke of Normandy, from Harold's journey to the Continent up to the Battle of Hastings. Most historians think it was commissioned by Odo, Bishop of Bayeux and half-brother of William, and made in England in the years following 1066. An inventory of 1476 mentions it in the treasury of Bayeux Cathedral, which displayed it on certain days of the year. Threatened during the Revolution, exhibited in Paris under Napoleon, sheltered during the Second World War, it has been displayed since 1983 in a museum in Bayeux. In 2025, France and the United Kingdom announced its loan to the British Museum during the renovation of that museum."""
facture = """
This is not a tapestry, woven on a loom, but an embroidery: dyed wool threads were sewn onto a long linen cloth, made of several pieces joined together. The outlines are worked in stem stitch, and the surfaces filled in laid work, now called Bayeux stitch: long threads laid side by side, held down by small transverse stitches. The reduced palette was obtained with three dye plants, madder, weld and woad. The colours do not seek verisimilitude: a horse may be blue, and a face is often only an outline."""
details = [
  "The inscription ISTI MIRANT STELLA, embroidered in wool at upper left.",
  "The comet, with its round nucleus and flaming tail.",
  "The ghost ships, without sails or crew, in the lower border.",
  "The two birds perched on the roof of Harold's palace.",
  "The outstretched fingers of the men, guiding the gaze towards the sky.",
]
themes = ["history", "conquest", "comet", "omen", "embroidery"]
anecdote = """
The end of the embroidery is lost: the last surviving scene shows the flight of the English after the battle. We do not know how it ended, perhaps with William's coronation at Westminster, on Christmas Day 1066."""
salle = 3
mur = "sud"
place = 2
largeur = 2.8

[[oeuvres]]
titre = "Apocalypse Tapestry: Saint Michael Fights the Dragon"
artiste = "Jean de Bruges et Nicolas Bataille"
annee = "c. 1375–1382"
image = "apocalypse-saint-michel.jpg"
cadre = "aucun"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Hennequin_de_Bruges_-_Saint_Michael_fighting_the_Dragon_-_WGA24178.jpg"
technique = "Wool tapestry, one scene from the third piece of the hanging"
collection = "Château d'Angers, Angers"
note = "Saint Michael and his angels pierce the seven-headed dragon with their lances, under the gaze of Saint John: a scene from the greatest surviving medieval hanging."
description = """
On a midnight-blue ground strewn with lozenge patterns, the scene plays out on a diagonal. At the top, Saint Michael, in a golden robe, with great red wings, plunges from the sky with his angels; all hold long lances. Below, on a green ground, the great red seven-headed dragon writhes under the blows, while a second, smaller winged monster rears up towards the assailants. On the left, in a small Gothic shrine, Saint John, dressed in red, observes the vision, one hand against his face. At upper right, white, curly clouds border the sky. At the foot of the scene runs a strip of earth strewn with flowers."""
evocation = """
Chapter 12 of the Apocalypse tells of the war in heaven: Michael and his angels fight the dragon, the ancient serpent, and cast him down to the earth. Here, no lone hero: it is a heavenly army that strikes in a single impulse, and the parallel lances give the composition the rhythm of a cavalry charge. For contemporaries, the scene had a concrete echo: the hanging was woven in the midst of the Hundred Years' War, for Louis of Anjou, brother of King Charles V, and one could read in it the hope of a victory of good over the disorders of the time. Saint John, a witness standing apart, reminds us that all this is a vision, to be meditated upon rather than feared."""
histoire = """
Louis I, Duke of Anjou, commissioned this immense hanging around 1375. The cartoons were drawn by Jean de Bruges, painter to his brother King Charles V, who lent for the occasion an illuminated manuscript of the Apocalypse from his library. The weaving was entrusted to the Parisian merchant Nicolas Bataille. The whole comprised six pieces about six metres high, for a total length of about 140 metres. Bequeathed to Angers Cathedral at the end of the fifteenth century, the hanging was displayed there on major feasts. Neglected at the end of the eighteenth century, cut up and partly lost, it was recovered and restored in the nineteenth century. Since 1954, it has been displayed at the Château d'Angers, in a gallery built for it: more than a hundred metres of it survive."""
facture = """
The hanging is woven in wool, in a restricted range of colours: deep blues and reds for the grounds, which alternate from one scene to the next, white, ochre, green. Jean de Bruges's drawing, nervous and elegant, is recognisable by its fine faces and supple drapery, close to the Parisian illumination of his time. The weavers translated this drawing into surfaces of colour and hatching that give the modelling. Remarkably, the back of the hanging is almost as carefully finished as the front; long protected from light, it has kept far brighter colours."""
details = [
  "Saint John observing the scene from his small shrine, at left.",
  "The seven heads of the dragon, gathered in a cluster at right, beneath the lance points.",
  "The second, smaller winged monster, rearing up towards the angels.",
  "The white, curly clouds bordering the sky, at upper right.",
  "Saint Michael's red wings, at the centre of the melee.",
]
themes = ["apocalypse", "angels", "dragon", "combat", "tapestry"]
anecdote = """
According to a tradition reported in the nineteenth century, pieces of the hanging were used, after the Revolution, to cover horses, protect trees from frost or block windows. The detail is uncertain, but the loss of several scenes is very real."""
