[[oeuvres]]
titre = "The Unicorn in Captivity (The Hunt of the Unicorn)"
artiste = "Ateliers des Pays-Bas du Sud"
annee = "c. 1495–1505"
image = "licorne-captive.jpg"
cadre = "aucun"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Unicorn_in_Captivity_-_Google_Art_Project.jpg"
technique = "Wool, silk, silver and silver-gilt threads, 368 × 251.5 cm"
collection = "Metropolitan Museum of Art, The Cloisters, New York"
note = "Last piece of the famous Hunt of the Unicorn: the animal, tied to a pomegranate tree, rests in an enclosure in the middle of a flowering meadow."
description = """
On a dark green, almost black ground, a meadow is covered with plants drawn one by one: hundreds of stems and flowers, red, white, yellow and blue. At the centre, a white unicorn lies in a small circular enclosure, closed by a wooden fence. It wears a precious collar, linked by a chain to the trunk of a pomegranate tree that rises behind it, laden with fruit. It turns its head to the left, its long twisted horn raised towards the sky. Streaks of red run down its white coat. In three corners and on the trunk of the tree, the letters A and E, tied by a cord, repeat a monogram. The weaving is so fine that each petal can be distinguished."""
evocation = """
According to the bestiaries of the Middle Ages, the unicorn, fierce and elusive, could be captured only by a young virgin: it was seen as an image of the Incarnation, Christ coming to take refuge in the womb of Mary. The enclosed unicorn, alive after having been hunted and killed in the preceding pieces, has been read as the risen Christ. But the scene also belongs to the language of courtly love: the lover captive of his lady, chained of his own free will in an enclosed garden. According to a frequently advanced reading, the red streaks are not blood but the juice of ripe pomegranates, fruits of fertility and marriage. The two readings, sacred and amorous, are not mutually exclusive."""
histoire = """
The Hunt of the Unicorn comprises seven pieces, probably designed in Paris and woven around 1500 in the Southern Netherlands. The patron, who may be indicated by the monogram AE, remains unknown, and the pieces perhaps did not originally belong to a single series. They are mentioned in 1680 in an inventory of the La Rochefoucauld family, who then kept them at the Château de Verteuil, in Charente. Plundered at the Revolution, they are said to have been used to protect crops from frost before being recovered. In 1922, John D. Rockefeller Jr. bought them; in 1937 he gave them to the Metropolitan Museum, which displays them at The Cloisters, its museum of medieval art opened in 1938 in northern Manhattan."""
facture = """
The tapestry is woven in wool and silk, with silver and silver-gilt threads that shimmered in candlelight. The millefleurs ground, very fashionable around 1500, is not mere decoration: botanists have identified most of the plants, such as the carnation, the orchid or the lily, often chosen for their symbolic meaning linked to marriage and fertility. The unicorn is modelled by fine hatching of pale wools. The enclosure, seen slightly from above, gives a depth that the meadow, without horizon, refuses."""
details = [
  "The AE monogram tied with a cord, in the corners and on the trunk.",
  "The ripe pomegranates in the branches, above the unicorn.",
  "The chain linking the unicorn's collar to the tree.",
  "The low fence of the enclosure, which the animal could easily cross.",
]
themes = ["unicorn", "love", "christ", "millefleurs", "garden"]
anecdote = """
The Cloisters, where the hanging is displayed, is itself a museum made of fragments: parts of medieval cloisters from France, such as Saint-Michel-de-Cuxa or Saint-Guilhem-le-Désert, were reassembled there in the 1930s."""
salle = 3
mur = "ouest"
place = 5
largeur = 2.5

[[oeuvres]]
titre = "Great Hours of Anne of Brittany: the Queen at Prayer"
artiste = "Jean Bourdichon"
annee = "1503–1508"
image = "heures-anne-de-bretagne.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:BNF_-_Latin_9474_-_Jean_Bourdichon_-_Grandes_Heures_d'Anne_de_Bretagne_-_f._3r_-_Anne_de_Bretagne_entre_trois_saintes.jpg"
technique = "Paint and gold on parchment, folio 3 recto; leaf approx. 30 × 19 cm"
collection = "Bibliothèque nationale de France, Paris (Latin 9474)"
note = "The Queen of France, kneeling before her book of hours, is presented by Saint Anne, Saint Ursula and Saint Helena. The leaf measures about 30 cm high."
description = """
In a gilded frame, a young woman kneels before a prie-dieu covered with purple velvet, her hands joined. She wears a gold brocade dress with fur-trimmed sleeves and a black headdress edged with gems: this is Anne of Brittany, Queen of France. Before her, an open book, in which one can make out a tiny painting, evokes the book of hours itself. Behind her stand three saints. On the left, the aged Saint Anne, her patron, veiled in white, holds out her hands to her. In the centre, Saint Ursula, crowned, places a hand on her shoulder and holds arrows and a banner strewn with ermines. On the right, Saint Helena, in an ermine mantle, holds a great cross. In the distance, bluish hills and a castle."""
evocation = """
The book of hours was the prayer book of the laity: it marked the day with prayers to be recited at the canonical hours. This one opens with the portrait of the queen at devotion, following a common formula: the donor, presented by saints, prays before the book that the reader holds in his hands. The choice of saints is no accident: Anne is her patron; Ursula, a Breton princess according to legend, bears the banner of the duchy; Helena, mother of the Emperor Constantine, is the model of the Christian queen. The portrait thus asserts at once a personal piety, a Breton identity and a royal dignity. The smooth, idealised face speaks of rank more than likeness."""
histoire = """
Anne, Duchess of Brittany, twice Queen of France through her marriages to Charles VIII and then Louis XII, commissioned this book from Jean Bourdichon, court painter based in Tours. A document of 14 March 1508 orders the payment to him of 1,050 livres tournois for having richly historiated and illuminated these Hours. The manuscript contains nearly fifty large paintings and, in the margins, more than three hundred plants painted from life, with their names in Latin and French. The queen died in 1514, a few years after the book was completed. The Great Hours are today one of the jewels of the Manuscripts Department of the Bibliothèque nationale de France, at the Richelieu site."""
facture = """
Bourdichon paints like a painter of panel pictures: his figures, large and close to the viewer, are modelled with soft shadows, in the Italian manner, and placed before a landscape receding into a blue haze. He inherited from Jean Fouquet this taste for volume and light. The fabrics are rendered with a wealth of detail: the brocade of the dress heightened with fine gold lines, ermines, gems. The gilded frame, painted in trompe l'œil like a moulding, makes the miniature a veritable small picture. The smooth faces, with heavy eyelids, are typical of his style."""
details = [
  "The small open book on the prie-dieu, with its tiny painting: a book within the book.",
  "The banner strewn with ermines, emblem of Brittany, held by Saint Ursula.",
  "Saint Ursula's arrows, instrument of her martyrdom.",
  "The castle perched on a rock, at right, in the distance.",
  "The golden reflections on the queen's brocade dress.",
]
themes = ["prayer", "queen", "portrait", "brittany", "book of hours"]
anecdote = """
In the flowering margins of the manuscript, Bourdichon also painted insects: caterpillars, butterflies, bees. One recognises, for example, the xylocopa, the large carpenter bee with violet reflections, resting on a flower near the text of the Gospel of John."""
salle = 4
mur = "est"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "Catalan Atlas: from the Atlantic to the Red Sea"
artiste = "Abraham Cresques"
annee = "1375"
image = "atlas-catalan.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:1375_Atlas_Catalan_Abraham_Cresques.jpg"
technique = "Inks, colours and gold on parchment mounted on wooden panels; two of the four panels of the map, each approx. 65 × 50 cm"
collection = "Bibliothèque nationale de France, Paris (Espagnol 30)"
note = "The western half of the finest map of the Middle Ages: the Atlantic, Europe, the Mediterranean and Africa, where the King of Mali, Mansa Musa, sits enthroned."
description = """
Four long sheets of parchment, side by side, form this half of the map. On the left stretches the Atlantic Ocean, with a large compass rose with coloured points and, at the bottom, the Canary Islands and a small ship. Then come the Iberian Peninsula, then the Mediterranean, its islands painted in gold and its coasts bristling with port names, as far as the Black Sea. Everything is covered with a network of crossing straight lines: the sailors' rhumb lines. At the bottom, Africa is barred by the golden chain of the Atlas. Below, a veiled rider on a camel advances towards a crowned black king, seated on a throne, who holds a gold nugget: Mansa Musa, King of Mali. At the far right, the Red Sea is painted red."""
evocation = """
The Catalan Atlas blends two ways of seeing the world. On one side, the precision of marine charts, the portolans, which describe coasts port by port for navigators. On the other, the heritage of medieval mappae mundi, with their kings, wonders and tales. The interior of the continents is peopled with sovereigns and caravans, and legends in Catalan tell of the riches of each country. The portrait of Mansa Musa, whose pilgrimage to Mecca in 1324 had struck minds by the abundance of his gold, expresses the interest of the merchants of Majorca in the caravan routes of the Sahara. The map is an encyclopedia of the known world, serving commerce as much as knowledge."""
histoire = """
The atlas was made in Majorca, a great Mediterranean port where a school of cartographers, often Jewish, worked. It is attributed to Abraham Cresques, master of world maps and compasses in the service of the King of Aragon, who worked with his son Jafuda. Its date, 1375, is deduced from the calendar that accompanies it. It consists of six sheets of parchment mounted on wooden panels: the first two carry texts and tables of cosmography and astronomy, the other four the map, from the Atlantic to China. Shortly after its making, it entered the library of the kings of France, probably as a gift from the court of Aragon. It is kept in the Manuscripts Department of the Bibliothèque nationale de France."""
facture = """
The cartographer first traces the network of rhumb lines, in black, green and red ink according to the usage of portolans, then the outline of the coasts. The names of ports are written perpendicular to the shore, inland, so as not to clutter the sea: they are read by turning around the map, laid flat on a table. Cities are marked by small castles topped with banners that indicate to whom they belong. The figures and legends, painted with gold and bright colours, bring the map close to illumination."""
details = [
  "Mansa Musa, King of Mali, crowned, holding a gold nugget, at bottom centre.",
  "The Red Sea, painted bright red, at the right edge.",
  "The compass rose of the Atlantic, often presented as the oldest known on a map.",
  "The small ship off Africa, at lower left: that of the Majorcan Jaume Ferrer, who left in 1346 for the River of Gold.",
  "The banners planted on the cities, which tell who rules them.",
]
themes = ["map", "world", "navigation", "trade", "africa"]
anecdote = """
The Catalan legend written near Mansa Musa presents him as the richest and noblest lord of the whole region, because of the abundance of gold gathered in his lands. Half a century after his pilgrimage, his reputation remained intact."""
salle = 4
mur = "nord"
place = 2
largeur = 3.4

[[artistes]]
nom = "Moines d'Iona et de Kells"
vie = "Iona (Scotland) and Kells (Ireland), c. 800"
biographie = """
The monastery of Iona, on a small island of the Inner Hebrides, was founded around 563 by the Irish monk Columba, Columcille in Irish, who came with twelve companions. It became the head of a vast network of monasteries in Ireland and Scotland, and a centre of culture: books were copied and decorated there, lives of saints and chronicles were written. From 795, the Vikings attacked the island several times; in 806, sixty-eight monks were killed. The monks then founded a new monastery at Kells, in County Meath, Ireland, where part of the community withdrew with the relics of Columba. The Book of Kells is the fruit of this world: the names of its scribes and painters are unknown, but specialists distinguish at least three major illuminators and several scribes, trained in a tradition in which writing, prayer and art were one."""
style = """
The Book of Kells is the summit of so-called insular art, born in Ireland and Britain between the seventh and ninth centuries. It fuses the spirals and triskeles of Celtic art, the animal interlace of Germanic metalwork and the Christian models that came from the Mediterranean. Letters become images, pages surfaces saturated with ornament, and the human figures, stylised, obey geometry. This style still marks the Irish imagination."""

[[artistes]]
nom = "Eadfrith de Lindisfarne"
vie = "Northumbria (England), died 721"
biographie = """
Almost nothing is known of Eadfrith before he became Bishop of Lindisfarne, in 698. The monastery, founded in 635 by the Irish monk Aidan, who came from Iona, on an island linked to the Northumbrian coast at low tide, was then the religious heart of the kingdom. Its most famous bishop, Cuthbert, who died in 687, was venerated as a saint, and his body, found intact in 698, attracted pilgrims. It was in this context that Eadfrith, according to the note added by the priest Aldred in the tenth century, wrote and painted the Gospels, probably for the cult of Cuthbert. He also had restored the hermitage on the island of Farne where the saint had lived, and the monk Bede dedicated to him his life of Saint Cuthbert. He died in 721. If Aldred's attribution is correct, he would have devoted several years of his life to this single book, working almost alone, as the unity of the decoration suggests."""
style = """
The decoration of the Lindisfarne Gospels unites geometric rigour and animal fantasy. Eadfrith blends the interlace and animals of Anglo-Saxon metalwork, Celtic spirals and Mediterranean models: his portraits of the evangelists are inspired by manuscripts that came from Italy. His construction with the compass, of rare precision, gives the carpet pages their perfect order. The manuscript is one of the great models of insular art, before the more exuberant Book of Kells."""

[[artistes]]
nom = "Scriptorium de Saint-Sever"
vie = "Abbey of Saint-Sever (Gascony), mid-11th century"
biographie = """
The Benedictine abbey of Saint-Sever, on the banks of the Adour, in what is now the département of the Landes, was refounded at the end of the tenth century by the Duke of Gascony. It knew its golden age under Abbot Gregory of Montaner, who ruled it from 1028 to 1072: it was he who had the great manuscript of the Apocalypse made, whose first pages celebrate his name. The text copied is the commentary on the Apocalypse composed around 776 by Beatus, a monk of Liébana, in northern Spain, which Spanish monasteries had been copying and illustrating since the tenth century. The monks of Saint-Sever worked from a model that came from Spain, a sign of the close ties between the two sides of the Pyrenees. The name of Stephanus Garsia, inscribed in the book, may be that of one of the painters. The rest of the team, scribes and illuminators, remains anonymous. The Romanesque abbey church of Saint-Sever, heavily altered, can still be visited."""
style = """
The Saint-Sever style forms a bridge between Spain and Romanesque France. It keeps from the Mozarabic Beatus manuscripts the backgrounds in bands of bright colours, the flat figures and the spectacular double-page compositions. But its more supple figures, with articulated drapery, and its lively animals foretell the Romanesque sculpture of south-western France. The decorative force and the brilliance of the colours make it one of the most admired Romanesque manuscripts."""

[[artistes]]
nom = "Enlumineurs de la Bible de Souvigny"
vie = "France, late 12th century"
biographie = """
Neither the names nor the place of work of the scribes and painters of the Souvigny Bible are known. The manuscript belonged to the priory of Souvigny, in the Bourbonnais, founded in the early tenth century on lands given to the abbey of Cluny, and which became one of its most important establishments thanks to the cult of the holy abbots Mayeul and Odilo. In the twelfth century, the great monasteries had giant Bibles copied, in one or several volumes, for solemn reading: long and costly undertakings that mobilised scribes, rubricators and painters for years, and required skins in great numbers. The decoration of the Souvigny Bible, with its gold grounds and its elongated figures, belongs to the end of the Romanesque period, but its workshop has not been identified with certainty. The book remained at the priory until the Revolution, before joining the library of Moulins, where its dozens of painted initials and scenes make it one of the great Romanesque manuscripts preserved in France."""
style = """
The decoration of the Souvigny Bible belongs to the last phase of Romanesque art. The figures are elongated, the drapery drawn with multiple, almost metallic folds, and the gold grounds give the scenes the brilliance of goldsmiths' work. The compositions in superimposed panels, which tell a story image by image, recall the stained glass and frontispieces of the great twelfth-century Bibles. The painted initials mingle foliate scrolls, animals and figures."""

[[artistes]]
nom = "Peintres-scribes aztèques"
vie = "Central Mexico, c. 1500"
biographie = """
In ancient Mexico, writing and painting were one: the same Nahuatl word, tlacuilo, designated the painter and the scribe. These painter-scribes, trained notably in the temple schools, worked for the priests, the nobles and the administration of the Aztec empire, whose capital, Tenochtitlan, rose on an island in Lake Texcoco, on the site of present-day Mexico City. They produced books of divination and ritual, genealogies, maps and tribute registers, painted on deerskin or bark paper and folded like accordions. The Spanish conquest, completed in 1521, then the missionaries' struggle against the ancient religions, led to the destruction of most of these books: only a handful of manuscripts painted before the conquest have survived. Tlacuilos continued to work after 1521, sometimes for the Spanish, blending their art with European practices. The authors of the Codex Borbonicus remain anonymous."""
style = """
The art of the tlacuilos is a writing in images. The figures, outlined with a black line of equal thickness and filled with pure colours, are composed of codified signs: hairstyles, face paint, ornaments and held objects make it possible to identify each god. Space has neither perspective nor shadow, and size tells importance. Pages are organised in boxes, bands or paths that guide the reading. This great graphic clarity fascinated Mexican artists of the twentieth century."""

[[artistes]]
nom = "Atelier anglo-saxon"
vie = "England, perhaps Canterbury, c. 1070"
biographie = """
It is not known who drew and embroidered the Bayeux Tapestry. Most historians think it was made in England, shortly after the conquest of 1066, at the request of Odo, Bishop of Bayeux and half-brother of William the Conqueror, who became Earl of Kent after the victory. Several clues point towards Canterbury, in Kent: certain figures seem taken from illuminated manuscripts kept in the abbeys of the city, and the spelling of several embroidered names betrays English habits. The Anglo-Saxons were renowned throughout Europe for their embroideries, in which women excelled, but nothing makes it possible to identify the hands that worked here. The design, probably due to a single designer, was transferred onto the cloth, then embroidered by several people, perhaps in several places. Other, minority hypotheses place the making in Normandy or in the Loire valley."""
style = """
The Bayeux Tapestry narrates like a frieze: the scenes follow one another without a frame, separated by a tree or a building, and are read from left to right, with Latin inscriptions. The figures, clear silhouettes with expressive gestures, stand out against the bare linen. The borders, peopled with animals, fables and scenes of daily life, sometimes comment on the main action. This continuous narration often leads the embroidery to be presented as a distant ancestor of the comic strip."""

[[artistes]]
nom = "Jean de Bruges et Nicolas Bataille"
vie = "Jean de Bruges, active c. 1368–1381; Nicolas Bataille, died c. 1400"
biographie = """
Jean de Bruges, also called Hennequin de Bruges or Jean Bondol, was a Flemish painter who came to work in Paris, where he became painter to King Charles V. To him we owe the miniature that opens a Bible presented to the king in 1371, now in The Hague: Charles V receives the book there from the hands of his counsellor Jean de Vaudetar, in one of the first realistic portraits in French painting. Around the mid-1370s, Duke Louis of Anjou, the king's brother, entrusted him with the design of the great Apocalypse hanging. His cartoons were handed to the Parisian merchant-tapestry dealer Nicolas Bataille, one of the most important of his time, who supplied the princes of the house of France with costly hangings. Bataille organised the weaving, probably in several workshops, with the help of the tapestry weaver Robert Poisson. The duke's accounts preserve the record of payments made to the two men in the late 1370s. Bataille died around 1400, at a time when Paris still dominated European tapestry."""
style = """
Jean de Bruges's drawing combines the elegance of Parisian art with a Flemish sense of observation: lively faces, apt gestures, ample drapery that falls with weight. In the hanging, each scene is organised with clarity, on alternately red and blue grounds, and the visions of the Apocalypse take on the presence of a spectacle. Nicolas Bataille's workshop knew how to translate this drawing into wool on a monumental scale."""

[[artistes]]
nom = "Ateliers des Pays-Bas du Sud"
vie = "Southern Netherlands (present-day Belgium), c. 1500"
biographie = """
Around 1500, the towns of the Southern Netherlands, possessions of the Dukes of Burgundy and then of the Habsburgs, were the great European centres of tapestry: Brussels, Tournai, Oudenaarde, Enghien. The workshops employed numerous weavers, who worked from cartoons supplied by painters. Tapestries, luxury objects carried from one castle to another, protected against the cold, divided rooms and displayed the prestige of their owners, and the workshops exported their hangings throughout Europe. The Hunt of the Unicorn illustrates this organisation: the designs are attributed to an artist active in Paris, the weaving to workshops of the Southern Netherlands. The weavers are anonymous, but their mastery is dazzling: the finesse of the faces, the modelling of the animals, plants so exact that botanists recognise them. The patron, who may be indicated by the monogram AE, has never been identified with certainty."""
style = """
The tapestries of the Southern Netherlands around 1500 are distinguished by the density of their compositions, the richness of their materials, in which silk and metal threads light up the wool, and a taste for detail inherited from the Flemish primitives. The millefleurs ground, a close scattering of plants on a dark ground, turns the wall into a garden. The figures, modelled by hatching, gain a new relief. These hangings fixed for centuries the image we have of the end of the Middle Ages."""

[[artistes]]
nom = "Jean Bourdichon"
vie = "Tours, c. 1457 – Tours, 1521"
biographie = """
Jean Bourdichon was born in Tours around 1457, in the city of Jean Fouquet, the great painter of Charles VII and Louis XI, of whom he was probably the pupil or continuator. He worked for Louis XI from the late 1470s, and remained in the service of the crown for more than forty years, under Charles VIII, Louis XII and Francis I. As painter to the king, he did not make only books: he painted portraits, banners, decorations for festivals and royal entries, and drew designs for precious objects. His books of hours, for the royal family and for princes such as King Frederick of Aragon of Naples, are among the most luxurious of his time. The Great Hours of Anne of Brittany, completed in 1508, are his most famous work. He died in Tours in 1521, as printing and Italian taste were transforming the book and painting."""
style = """
Bourdichon transposes easel painting onto the page. His miniatures, often full-page and surrounded by a gilded trompe-l'œil frame, present large, close figures, modelled by a soft light and blended shadows, before bluish landscapes. Heir to Fouquet, attentive to Italian art, he seeks the ideal more than character: smooth faces, calm gestures, deep colours. His margins of plants painted from life foreshadow botanical illustration."""

[[artistes]]
nom = "Abraham Cresques"
vie = "Palma de Majorca, c. 1325 – Palma, 1387"
biographie = """
Abraham Cresques was born in Majorca around 1325, in the Jewish community of Palma. The island, conquered by the kings of Aragon in the thirteenth century, was then a hub of Mediterranean trade, where Christian, Jewish and Muslim sailors, merchants and scholars met. Cresques practised there the trades of cartographer and instrument maker: documents designate him as master of world maps and compasses in the service of King Peter IV of Aragon. He worked with his son Jafuda, and it is to their workshop that the Catalan Atlas of 1375, the most sumptuous of the Majorcan maps, is attributed. Several marine-chart workshops were then at work on the island, and their maps circulated in the ports of the whole Mediterranean. Abraham died in 1387. In 1391, anti-Jewish riots struck the community of Palma; Jafuda converted to Christianity under the name Jaume Ribes and continued his trade as cartographer, notably in Barcelona. The Majorcan school left a lasting mark on European cartography."""
style = """
Cresques's workshop brings Majorcan cartography to its peak. To the precision of marine charts, with their detailed coasts and networks of rhumb lines, it adds the knowledge of geographers and travellers, from Marco Polo to the merchants of the Sahara. The lands are covered with cities, kings, caravans and legends. This union of practical science and image makes his maps both tools and works of art."""
