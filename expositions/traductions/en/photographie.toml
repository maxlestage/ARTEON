[exposition]
ordre = 115
nom_court = "Photography"
mouvement = "The Beginnings of Photography"
cadre = "noir"
couleur = "#6b4f35"
titre = "The Beginnings of Photography, the Imprint of Light"
artiste = "Niépce, Daguerre, Talbot, Nadar, Cameron, Le Gray, Muybridge, Atget, Stieglitz…"
dates = "1827–1911"
accroche = "Virtual exhibition · George Eastman Museum, Rochester"
introduction = """
In less than a century, photography moved from laboratory experiment to modern \
art: a pewter plate exposed for days on end, the first passer-by caught on \
a Paris boulevard, the paper negative, the portrait, the seascape, movement \
broken down into stages, the street and, finally, colour. The visit brings together ten pioneers, from Niépce to \
Prokudin-Gorskii, in ten images. The building is inspired by the George Eastman Museum in \
Rochester, the oldest museum of photography, housed in the home of the \
founder of Kodak: a vestibule, a winter garden at the centre and three salons around it."""
vitrine = "grande-vague.jpg"

[musee]
nom = "George Eastman Museum"
ville = "Rochester, New York, United States"
architecte = "J. Foster Warner"
construction = "1902–1905 (the house); museum opened in 1949"
presentation = """
George Eastman, the founder of the Kodak company, had built from 1902 to 1905, at \
900 East Avenue in Rochester, a vast Georgian Revival mansion designed by the architect \
J. Foster Warner: some fifty rooms on a fireproof reinforced-concrete \
structure, surrounded by gardens, greenhouses and a small farm. Behind the \
classical façade, the house was of a modernity rare for its time: an electric \
generator, an internal telephone, an elevator, central vacuum cleaning and a great organ, \
around which Eastman animated the city's musical life until his death in 1932. \
Bequeathed to the University of Rochester, the property was transferred in 1948 to the museum founded \
the previous year, which opened on 9 November 1949 in the former salons. It is the \
oldest museum devoted to photography. It holds more than 400,000 \
photographs and negatives, thousands of cameras and a large film archive, which \
can be discovered at the Dryden Theatre. The historian Beaumont Newhall directed it from 1958 to \
1971."""
ici = """
ARTEON's building borrows from the Eastman house its living rooms with light, warm \
walls and its winter garden, placed here at the heart of the plan. One enters from the south \
into \"The Vestibule\", low-ceilinged, where the first photograph in \
history awaits. It opens to the north onto \"The Winter Garden\", a square room twelve \
metres on each side and nine metres high, with pale green walls. To the west opens the \
room \"The Inventors\", to the east \"The Portrait\", and to the north \"The New Century\", \
where photography becomes modern and turns to colour."""

