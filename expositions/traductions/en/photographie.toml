[[oeuvres]]
titre = "View from the Window at Le Gras"
artiste = "Nicéphore Niépce"
annee = "1827"
image = "point-de-vue-du-gras.jpg"
cadre = "vitrine"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Untitled_(point_de_vue),_Niépce_1827_—_HRC_2020_(cropped).jpg"
technique = "Heliograph: bitumen of Judea on pewter plate, 16.7 × 20.3 cm"
collection = "Harry Ransom Center, University of Texas, Austin"
note = "The oldest surviving photograph: the view Niépce had from a window of his house in Burgundy, fixed after an exposure of several days."
description = """
A grey metal plate with rounded corners, scratched and pitted, on which one must \
search for the image. Gradually, a view emerges: the one Niépce had from an \
upstairs window of his house at Le Gras, in Saint-Loup-de-Varennes, near \
Chalon-sur-Saône. On the left stands a tall, dark building, usually identified \
as the dovecote; on the right, another wing of the house; at the centre, a sloping roof, \
the round mass of a tree and, in the distance, a pale horizon line beneath a clear \
sky. Nothing moves, no one appears. The walls on the left and those on the right are \
lit at the same time, as if the sun had struck the scene from both sides. At the \
corners, bumps in the metal catch the light."""
evocation = """
This ordinary landscape of rooftops and walls is the first piece of the world fixed by the action of light \
alone, without the hand of a draughtsman. Niépce called his process \
heliography, writing with the sun. The image has something ghostly about it: it \
barely holds on the plate, and its light coming from both sides recalls that it \
records not an instant but a duration, the passage of the sun from east to west. One sees in it \
the starting point of a revolution in seeing: for the first time, a \
machine keeps the exact trace of a place. It also speaks of the tenacity of a provincial \
inventor, who had been seeking since 1816 to fix the image of the camera obscura, and of the \
modesty of his beginnings: a view from home, the simplest there could be."""
histoire = """
According to his correspondence, Niépce made the image in the summer of 1827. In the autumn, he \
travelled to England and showed it to the botanist Francis Bauer, who encouraged him to \
present his invention to the Royal Society; but Niépce refused to reveal its \
secret, and the society took no action. He left the plate with Bauer. When Daguerre \
and Talbot announced their processes in 1839, Bauer had it exhibited at the Royal Society \
to recall Niépce's priority. It then passed from hand to hand, and fell \
into oblivion after 1898. In 1952, the historians Helmut and Alison Gernsheim \
found it again; their collection was bought in 1963 by the University of Texas. The plate \
is displayed in the hall of the Harry Ransom Center in Austin, in a sealed case that \
protects it from the air."""
facture = """
Niépce coated a pewter plate, alloyed with lead, with a thin layer of bitumen of Judea, \
a natural asphalt that hardens in light. Placed at the back of a camera obscura \
facing the courtyard, the plate remained exposed for a very long time: eight hours was long \
cited, but the researcher Jean-Louis Marignier, who repeated the experiment, estimates \
that it took several days. A bath of oil of lavender and white petroleum then dissolved \
the bitumen that had remained soft. Where it had hardened, it forms the highlights; the bare metal \
gives the shadows. The image is unique, without a negative, and can only be read well under \
raking light."""
details = [
  "The two dark buildings that frame the view, on the left and on the right.",
  "The sloping roof, at the centre, which draws a broad pale diagonal.",
  "The round silhouette of a tree, just left of centre.",
  "The shiny bumps at the corners of the plate, traces of knocks sustained after 1952.",
  "The scratches and pitting of the metal, which merge with the image.",
]
themes = ["invention", "light", "window", "countryside", "heliography"]
anecdote = """
For a quarter of a century, this image was known only through a copy heavily \
retouched by hand by Helmut Gernsheim to make it legible. It was only from \
the late 1970s that the plate itself was reproduced as it is."""
salle = 1
mur = "ouest"
place = 1
largeur = 1.2

[[oeuvres]]
titre = "Boulevard du Temple"
artiste = "Louis Daguerre"
annee = "1838"
image = "boulevard-du-temple.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Boulevard_du_Temple_by_Daguerre.jpg"
technique = "Daguerreotype, silvered copper plate, approximately 13 × 16 cm"
collection = "Munich (original plate badly damaged); image known from copies by Beaumont Newhall"
note = "A Paris boulevard seen from a window, on a spring morning: on the pavement, a man having his boots polished is probably the first human being ever photographed."
description = """
Seen from above, a great tree-lined Paris boulevard runs diagonally toward the \
background, between multi-storey buildings bristling with chimneys. In the foreground, \
on the right, a pale building and rooftops; on the left, the façades, the shop awnings \
and the tree-planted pavement. The roadway seems empty: not a carriage, not a \
horse, not a passer-by. Yet, at lower left, at the corner of the pavement, stands a \
small dark silhouette: a man standing, one leg resting on a support, before \
another, bent form, probably a bootblack. The detail is tiny, but the eye, \
once it has found it, sees nothing else. The white sky is streaked with marks \
left on the plate."""
evocation = """
The Boulevard du Temple was one of the liveliest streets in Paris, that of the \
melodrama theatres, nicknamed the Boulevard of Crime. On the plate, all \
that crowd has vanished: pedestrians and cabs moved too fast to leave a trace \
during the minutes of exposure. Only those who stood still remain. The image \
thus expresses the paradox of nascent photography: it records what is \
motionless and erases movement, to the point of turning a living city into a \
deserted one. The little man with the boots, who entered history by chance, has become the \
symbol of the anonymous person whom photography makes lasting. It also recalls that the image \
is condensed time, not an instant."""
histoire = """
Daguerre, a set painter and the inventor of the Diorama, had been pursuing since 1829 the process \
begun with Niépce. In the spring of 1838, he photographed the boulevard from a \
window near his Diorama, at several hours of the day; the morning view and \
the midday one survive. In January 1839, Arago announced the invention to the Académie \
des sciences; in March, Daguerre showed the plate to the American Samuel Morse, who \
described it in a letter published in New York. In October, he offered it, in a triptych, \
to King Ludwig I of Bavaria. Kept in Munich, the plates deteriorated, and a \
restoration attempted around 1970 ruined them. They are known thanks to copies made around \
1937 by Beaumont Newhall, future director of George Eastman House."""
facture = """
The daguerreotype is a copper plate covered with silver polished like a mirror, \
made sensitive by iodine vapours. After exposure in the camera obscura, the still \
invisible image is developed by mercury vapours, then fixed in a salt bath. \
The result is a unique image of extraordinary fineness, which can only be \
reproduced by rephotographing it and which must be tilted to be seen as a positive. \
Like almost all daguerreotypes, it is reversed left to right, as \
in a mirror. Here, the exposure lasted several minutes, long enough to erase everything that \
moved."""
details = [
  "At lower left, the motionless man having his boots polished, one leg raised.",
  "The bent form in front of him, that of the bootblack, blurrier.",
  "The countless chimneys bristling on the rooftops, on the right.",
  "The aligned trees of the boulevard, which fade into the haze toward the background.",
  "The scratches and stains of the plate, visible in the sky.",
]
themes = ["Paris", "street", "invention", "daguerreotype", "exposure time"]
anecdote = """
The French state bought the process in 1839 and declared it free to the whole world. \
But a few days earlier, Daguerre's agent had had it patented in England \
: the United Kingdom was thus almost the only country where a licence had to be paid to \
make daguerreotypes."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "The Open Door"
artiste = "William Henry Fox Talbot"
annee = "1844"
image = "porte-ouverte.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:The_Open_Door_MET_DP148629.jpg"
technique = "Salted paper print from a paper negative (calotype), 14.3 × 19.4 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A broom propped against a door of Lacock Abbey: plate VI of The Pencil of Nature, the first book illustrated with photographs sold to the public."
description = """
A studded wooden door opens inward, in a stone wall, onto a dark \
room. Against the leaf, a brushwood broom is propped at an angle, its \
long handle crossing the image. Above, hanging from the door, hangs a harness. On \
the right, on the stone pillar, a lantern is suspended from a hook; leafless stems \
of climbing vine twine on either side of the entrance. In the \
shadow, at the back, one makes out a small-paned window letting in a little \
daylight. On the ground, the sun sharply draws the shadow of the broom. The whole image is bathed in \
a golden brown tone, characteristic of salted paper."""
evocation = """
Talbot accompanies the plate with a short text in which he invokes the example of Dutch painting, \
which took scenes of daily life as its subjects, and remarks \
that a painter's eye often stops where ordinary people see nothing \
remarkable. The Open Door is one of the first photographs conceived as a \
work of art rather than as a document. The threshold between light and darkness, the humble object \
left there, the absence of any figure give the scene a silent poetry: \
it has been read as an invitation to enter, or as the discreet presence of the servants who \
have just left the place. It heralds a photography that knows how to look at \
simple things."""
histoire = """
A scholar and the owner of Lacock Abbey, in Wiltshire, Talbot had been seeking since \
1834 to fix images on paper. In 1841, he patented the calotype, which \
allows as many positives as one likes to be printed from a single negative. To show its \
uses, he published from 1844 to 1846, in six parts, The Pencil of Nature: twenty-four \
prints pasted in by hand, each accompanied by a \
text. The Open Door appears in it as plate VI; there are several variants. The \
book was a commercial failure, but it marks a date in the history of the book. This \
print comes from the Gilman collection, bought by the Metropolitan Museum in 2005."""
facture = """
The calotype relies on a sheet of writing paper impregnated with silver iodide. \
After an exposure of a minute or two in the sun, the still invisible image is developed with \
gallic acid: this is the decisive discovery of the latent image. The result is a \
paper negative, which is then contact-printed onto a sheet of salted paper. \
The paper fibres soften the contours and give the images a velvety grain, \
less precise than the daguerreotype but closer to drawing. Talbot frames here as a \
painter would, with a great diagonal and a strong contrast of shadow and light."""
details = [
  "The twig broom, whose shadow is cast sharply on the ground.",
  "The metal lantern hanging from the pillar on the right.",
  "The harness hanging at upper left, above the door leaf.",
  "The small-paned window glowing at the back of the dark room.",
  "The rows of nail heads on the wood of the door.",
]
themes = ["calotype", "everyday", "threshold", "light", "still life"]
anecdote = """
In October 1833, on the shores of Lake Como, Talbot struggled to draw the landscape with the help \
of a camera lucida. From this failure was born his idea: to have the images of nature \
imprint themselves, durably, on paper."""
salle = 3
mur = "nord"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Sarah Bernhardt"
artiste = "Nadar"
annee = "c. 1864"
image = "sarah-bernhardt.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Sarah_Bernhardt,_par_Nadar,_1864.jpg"
technique = "Gelatin silver print from a glass negative, 21.1 × 16.2 cm"
collection = "J. Paul Getty Museum, Los Angeles"
note = "The young Sarah Bernhardt, twenty years old, draped in velvet in Nadar's studio: a portrait of thoroughly modern sobriety, before fame."
description = """
A young woman, leaning on a wooden pedestal, has her face turned in profile to the \
left, her gaze lost in the distance. Her dark, curly hair forms a thick mass \
around the face; a small earring glints at the lobe. She is wrapped \
in a full black velvet coat, slipped over a shoulder that it leaves bare, and whose \
heavy folds, glossy in places, fill the whole lower part of the image. The background is \
a plain grey wall, without decor or accessory. The light, coming from the left, gently models \
the forehead, cheek, neck and collarbone, the only bright areas amid \
the blacks and greys."""
evocation = """
Nadar wrote that the most difficult thing in photography is not technique but \
capturing the character of the person one photographs. Here, no columns or painted \
curtains as at the makers of visiting cards: nothing but the young woman, the velvet and the light. The grave profile, the bare shoulder, the absent gaze compose \
an image at once sensual and melancholy. One already glimpses the tragedienne who \
was to become the most famous actress of her time. The portrait also shows how \
photography quickly freed itself from society portraiture to seek, in a \
face, an inner presence."""
histoire = """
Around 1864, Sarah Bernhardt was about twenty. Trained at the Conservatoire, she had \
made her debut at the Comédie-Française in 1862, but left it after a quarrel, and her \
career was still seeking its course. She posed at Nadar's, who had worked since 1860 in a \
vast glass-roofed studio at 35 boulevard des Capucines, where all Paris of the arts \
and letters came and went. During the session, several shots were taken, with different poses and \
drapery; they are now among the most famous images by \
Nadar. The studio's negatives now belong to the French state; this \
print, made later from the negative, belongs to the J. Paul Getty Museum."""
facture = """
Nadar used the wet-collodion glass negative, which gives sharp images rich in \
halftones at the cost of an exposure of several seconds: the sitter must \
lean on something to stay still, which the pedestal justifies here. He worked by \
daylight, in a glass-roofed studio. The neutral background, the half-length framing and the \
play of the dark masses of velvet against the pale skin concentrate attention on the \
face. This sobriety, inherited from his trade as a caricaturist attentive to \
physiognomy, is his signature."""
details = [
  "The round earring that catches the light.",
  "The satiny reflections on the folds of the velvet.",
  "The bare shoulder, the only pale patch in the dark mass of the coat.",
  "The panelled wooden pedestal, at lower left, on which she leans.",
]
themes = ["portrait", "theatre", "woman", "profile", "velvet"]
anecdote = """
On 15 April 1874, Nadar's former studio, at 35 boulevard des Capucines, hosted \
the first exhibition of the painters soon to be called Impressionists, including Monet, \
Renoir, Degas and Berthe Morisot. Nadar had merely rented out the premises."""
salle = 4
mur = "est"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Julia Jackson"
artiste = "Julia Margaret Cameron"
annee = "1867"
image = "julia-jackson.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Julia_Jackson_MET_DT1121.jpg"
technique = "Albumen silver print from a collodion glass negative, 27.4 × 20.6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The photographer's niece, future mother of Virginia Woolf: a face half in shadow, caught from very close."
description = """
A young woman's face fills almost the whole image, seen from the front and very close. The \
light comes from the right and illuminates only one half of the face: the forehead, the eye, the \
cheek and the wing of the nose emerge from the shadow, while the other side melts into \
black. The long, loosened hair falls in waves over the shoulders and is lost in \
the dark background. The large eyes fix the viewer without smiling. No setting, no \
jewellery, no legible clothing: only the face, the neck and a mass of shadow. \
The focus is soft and the contours float slightly, as if the image were breathing."""
evocation = """
Julia Margaret Cameron sought less likeness than the beauty and inner life \
of her sitters. This frontal, unadorned portrait has an almost sacred intensity: \
the face emerges from the shadow like an apparition. Her contemporaries, accustomed \
to sharp, posed portraits, reproached her for this blur and these tight framings; one now \
sees in it an astonishing modernity, a way of making one feel a presence \
rather than a surface. Julia Jackson was famous for her beauty. The image takes on \
an added meaning when one knows that she would be the mother of Virginia Woolf and of the painter \
Vanessa Bell: dying in 1895, she would inspire in her daughter the character of Mrs Ramsay \
in To the Lighthouse."""
histoire = """
In 1867, Julia Jackson was twenty-one; she was the daughter of Maria Pattle, one \
of the photographer's sisters, who was also her godmother. Cameron, settled since 1860 \
at Freshwater, on the Isle of Wight, photographed her several times that year, \
the year in which the young woman married the barrister Herbert Duckworth. Widowed three years later, \
she remarried in 1878 the writer Leslie Stephen. Cameron, who sold her \
prints through London dealers, made her niece one of her favourite \
models. This print was bought by the Metropolitan Museum in \
1996."""
facture = """
Cameron worked in wet collodion, on large glass plates, with \
lenses that required long exposures in her studio, a former glazed henhouse. \
She related that she stopped focusing as soon as the image seemed beautiful to her, \
instead of pushing it to the perfect sharpness demanded by other photographers. \
She also accepted the accidents of printing, stains, streaks or scratches. The very \
tight framing, like a detail from a painting, and the side lighting that plunges half of the \
face into shadow recall the Italian painters she admired."""
details = [
  "The line of shadow dividing the face, from forehead to chin.",
  "The glint of light in the lit eye.",
  "The lighter strands of hair standing out on the right.",
  "The small stains and scratches of the print, left as they were.",
]
themes = ["portrait", "beauty", "shadow", "family", "blur"]
anecdote = """
In 1926, Virginia Woolf and the critic Roger Fry published at the Hogarth Press, the \
Woolfs' publishing house, a collection of Cameron's photographs, Victorian \
Photographs of Famous Men and Fair Women: the great-niece pays tribute to her \
great-aunt."""
salle = 4
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "The Great Wave, Sète"
artiste = "Gustave Le Gray"
annee = "1857"
image = "grande-vague.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:-The_Great_Wave,_Sète-_MET_DT1167.jpg"
technique = "Albumen silver print from a collodion glass negative, 33.7 × 41.4 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A wave breaks before the breakwater of the port of Sète, beneath a stormy sky pierced by the sun: the photographic seascape that dazzled the Second Empire."
description = """
The sea fills the whole lower half of the image. In the foreground, black, glistening \
rocks on which the foam breaks in white streaks. Farther out, a \
long horizontal wave rolls toward the shore, a white crest on dark water. On the left, \
the black, rectangular mass of the breakwater bars the horizon; a spray of foam \
leaps up at its end. Above, the sky is immense: heavy clouds, almost \
black on the right, torn and luminous at the centre, where the hidden sun casts a \
silvery light that is reflected on the sea. At lower right, the photographer's signature can be read."""
evocation = """
Le Gray here rivals the marine painters. Photography, reputed to be cold and \
documentary, becomes a Romantic spectacle: the power of the sea, the dramatic light, the \
contrast between the ephemeral wave and the motionless mass of the jetty. It \
has been seen as a meditation on time, the fleeting instant of the wave beneath a sky that \
seems eternal. These images struck contemporaries because they seemed to \
do the impossible: freeze moving water while keeping a sky with detailed \
clouds, whereas the photographs of the day usually showed \
white, empty skies. They gave back to photography the ambition of great paintings."""
histoire = """
A painter trained in Paul Delaroche's studio, Le Gray became one of the great \
photographers of the Second Empire. Around 1856–1857, he made a series of seascapes in \
Normandy and then on the Mediterranean, at Sète, where in 1857 he photographed the port and its \
breakwater under different skies. These large prints, exhibited and sold in Paris \
and London, enjoyed considerable success. But his Paris studio, luxurious \
and badly managed, collapsed in 1860; Le Gray left France and ended his life in Egypt. \
His seascapes, long forgotten by the general public, were rediscovered in the late twentieth \
century. This print was given to the Metropolitan Museum in 1976."""
facture = """
Le Gray, the inventor of a waxed-paper negative, here uses collodion on glass, \
more sensitive and more precise. The difficulty of seascapes is well known: the sky, far \
brighter than the sea, is already overexposed when the sea is barely beginning to \
appear. For several of his views, Le Gray printed two negatives together, one for \
the sky, the other for the sea, carefully joining the horizon. The exposure, short \
enough to catch the wave, leaves the foam on the rocks in silky streaks. The large \
format and the warm tone of the albumen give the image the presence of a painting."""
details = [
  "The spray of foam leaping up at the end of the breakwater, on the left.",
  "The crest of the great wave, sharp from one edge of the image to the other.",
  "The rocks of the foreground, glistening with water.",
  "The hidden sun, whose light pierces the clouds at the centre.",
  "Le Gray's signature, at lower right.",
]
themes = ["sea", "sky", "seascape", "light", "port"]
anecdote = """
In October 1999, in Paris, at the Sotheby's sale of the collection of André and \
Marie-Thérèse Jammes, a print of The Great Wave, Sète was sold for 5.5 million \
francs: then a world record for a photograph sold at auction."""
salle = 2
mur = "nord"
place = 1
largeur = 2.0

[[oeuvres]]
titre = "The Horse in Motion (Sallie Gardner at a Gallop)"
artiste = "Eadweard Muybridge"
annee = "1878"
image = "cheval-en-mouvement.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Horse_in_Motion_high_res.jpg"
technique = "Photographic card combining twelve instantaneous views, approximately 14 × 22 cm"
collection = "Library of Congress, Washington"
note = "Twelve images taken in under a second show what the eye could not see: a galloping horse leaves the ground entirely, its legs gathered beneath it."
description = """
On a printed card, twelve small images are arranged in three rows of four. \
Each shows the same black mare, Sallie Gardner, ridden by a jockey, galloping \
from left to right before a white background streaked with numbered vertical lines. From \
one image to the next, the position of the legs changes: folded under the belly, thrown \
forward, set down one by one. In the second and third images, no hoof \
touches the ground. The last frame, at lower right, shows the horse at a standstill. Beneath the \
images, a text printed in English gives the mare's name, that of her \
owner, Leland Stanford, the Palo Alto track and the date: 19 June 1878."""
evocation = """
For centuries, painters had depicted the galloping horse with its legs spread \
forward and backward, in the pose known as the flying gallop. Muybridge's images \
show that this is false: the horse does leave the ground, but when its \
legs are gathered beneath it. Photography becomes an instrument of \
knowledge that corrects the human eye. These vignettes fascinated scientists and \
artists alike; Degas, notably, drew on them for his horses. Above all, by cutting \
movement into successive instants, they open the way to cinema: one need only \
run them past quickly to see the mare gallop."""
histoire = """
Leland Stanford, a railway magnate and former governor of California, bred \
racehorses on his Palo Alto estate. Convinced that painters were wrong about the horse's gaits, he called in, in the early 1870s, Eadweard \
Muybridge, known for his views of the Yosemite Valley. The first attempts remained \
blurred. In June 1878, Muybridge lined up twelve cameras along the track; threads \
stretched across it triggered the shutters as the horse passed. The cards, \
published by a San Francisco gallery, were immediately reproduced in the press around \
the world. It is often said that Stanford had bet a large sum on the \
question; nothing attests to it."""
facture = """
To obtain sharp images of a horse at full speed, very brief exposure times \
are needed, which Muybridge estimated at less than a two-thousandth of a second. He \
set up along the track a white background marked with vertical lines spaced 27 \
inches apart, and spring-loaded shutters triggered electrically. The collodion negatives, \
exposed in full California sun, gave little more than silhouettes. \
On this edition of the card, the contours were retouched and the background redrawn \
to make the whole more legible."""
details = [
  "The second and third images, where all four hooves are in the air, legs folded.",
  "The numbered vertical lines of the background, spaced about 69 cm apart.",
  "The jockey's silhouette, almost motionless from one image to the next.",
  "The last vignette, where the mare has stopped.",
  "The 1878 copyright notice, at lower left.",
]
themes = ["movement", "horse", "science", "instant", "cinema"]
anecdote = """
In 1874, Muybridge shot dead his wife's lover with a revolver. Tried the following year, \
he was acquitted by a jury that judged the killing justified, then left for \
several months to photograph Central America."""
salle = 2
mur = "nord"
place = 3
largeur = 2.4

[[oeuvres]]
titre = "Avenue des Gobelins"
artiste = "Eugène Atget"
annee = "1925"
image = "avenue-des-gobelins.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Avenue_des_Gobelins_MET_DP105534.jpg"
technique = "Gelatin silver print from a glass negative, 21.9 × 17.3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A tailor's shop window, where smiling mannequins and price-tagged trousers mingle with the reflections of the street: the most ordinary Paris made strange."
description = """
Behind a large pane of glass, men's clothes are displayed for sale. In the \
foreground, striped trousers, folded over supports, bear large price \
tags; at the centre, a headless tweed jacket holds out wax hands. Higher up, \
mannequin busts with powdered, moustached faces, wearing boaters or \
soft hats, look in every direction. But over the glass are superimposed the \
reflections of the street: the trees of the avenue, the façades of the buildings opposite, the \
pavement. Mannequins and façades merge, to the point that one no longer knows what is \
inside and what is outside. On the left, a upright of the shop window is decorated with a \
lozenge pattern."""
evocation = """
Atget presented himself as a mere supplier of \"documents for artists\". \
Yet his shop windows, with their mannequins frozen in wax smiles and their \
ghostly reflections, fascinated the Surrealists, who saw in them strangeness arising \
from the everyday. The image superimposes two worlds: merchandise, with its prices and \
conventional poses, and the real city, which passes through it in transparency. One also reads in it \
the end of an era: Atget, at nearly seventy, photographs a Paris \
of small shops that modernity is beginning to erase. The philosopher Walter Benjamin \
wrote that he photographed streets as one photographs the scene of a crime."""
histoire = """
A former sailor and actor, Atget set up as a photographer in Paris around 1890 and sold \
his images to painters and decorators, then to the city's libraries and museums. \
In the 1920s, he increasingly photographed shopfronts and \
shop windows, including those of the avenue des Gobelins. In 1925, the young \
American Berenice Abbott, then Man Ray's assistant, visited him and bought \
prints from him. After Atget's death in 1927, she acquired a large part of his \
archive, made it known through books and exhibitions, and sold it in 1968 to the \
Museum of Modern Art in New York. This print entered the Metropolitan Museum in \
1987."""
facture = """
Atget worked to the end with a heavy wooden bellows camera, on a tripod, \
and 18 × 24 cm glass plates, equipment already outdated in the 1920s. \
His fairly long exposures required quiet streets, which he often photographed early in the \
morning. Facing a shop window, he did not try to eliminate reflections as a \
catalogue photographer would: he let them invade the image and composed with them. The \
frontal framing, tight on the glass, flattens the space and puts on the same plane the \
mannequin, the price tag and the tree of the avenue."""
details = [
  "The mannequin on the left, with its frozen smile, turned toward its neighbours.",
  "The price tags: 42 F, 35, 49 F, 32…",
  "The reflection of the avenue's trees in the upper part of the glass.",
  "The wax hands emerging from the sleeves of the central jacket.",
  "The upright decorated with lozenges, on the left.",
]
themes = ["Paris", "shop window", "reflection", "mannequin", "Surrealism"]
anecdote = """
In 1926, Man Ray published in La Révolution surréaliste a photograph by Atget \
showing Parisians watching an eclipse. Atget reportedly asked that his name not be \
put to it: they were, he said, only documents that he made."""
salle = 5
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "The Steerage"
artiste = "Alfred Stieglitz"
annee = "1907"
image = "entrepont.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:The_Steerage_MET_DP232922.jpg"
technique = "Photogravure printed in 1913 or earlier, 32.2 × 25.8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The poorest passengers of an ocean liner, seen from above: a scene caught on the fly, at once document and composition of forms, and one of the first modern photographs."
description = """
The image is cut in two by a white gangway that crosses it obliquely. At \
the top, on the upper deck, a crowd of men in caps and hats presses \
against a chain railing; in the middle, a young man in a light straw boater \
looks down. Below, on the lower deck, women in shawls and \
headscarves, children, a man with suspenders crossed on his back, laundry drying, \
a large cooking pot. On the left, a cylindrical mast; on the right, a metal ladder \
climbs to the upper deck. The two groups, very close, do not meet: \
the empty gangway separates them."""
evocation = """
Stieglitz related that he had seen there a set of shapes linked to one another \
: the circle of the straw hat, the slant of the mast, the diagonal of the ladder, the white \
of the gangway, and, beneath these shapes, his feeling about life. The Steerage \
is thus at once a document about the migrants of his time and an almost \
abstract composition, cut into planes like a Cubist canvas. Picasso, to whom it was \
shown, is said to have recognised in this photographer someone working in the same \
spirit as himself. It has often been taken for an image of immigrants arriving in America \
; the ship, in reality, was sailing for Europe."""
histoire = """
In June 1907, Stieglitz left for Europe with his wife and daughter aboard the Kaiser \
Wilhelm II, one of the largest liners of the day. Travelling first class, \
he discovered from the deck the section reserved for the poorest passengers, ran to \
fetch his camera and took a single shot. He nevertheless set the negative aside \
for four years, occupied notably with the autochrome, the Lumière brothers' new colour \
process. He published it only in October 1911, in his journal Camera Work, \
exhibited it in 1913 in his gallery 291 and devoted to it in 1915 an entire issue of the \
journal 291. This print belongs to the Stieglitz collection that entered the Metropolitan \
Museum in 1933."""
facture = """
Stieglitz used a hand-held glass-plate camera, an Auto-Graflex, which \
allowed him to catch the scene without a tripod; he had, he said, only a single \
plate ready. The image is presented here as a photogravure, an ink printing \
from a copper plate photographically etched, a process he used for \
Camera Work and for his large prints, and whose deep blacks he loved. The \
composition rests on opposing diagonals, gangway, mast and ladder, and on \
a framing that cuts the figures at the edges, with no centre or vanishing point."""
details = [
  "The round, pale boater of the young man leaning at the top, at the centre.",
  "The chains of the railing, which draw regular festoons.",
  "The crossed suspenders on a man's back, at lower right.",
  "The laundry hanging on the left, beneath the gangway.",
  "The metal ladder rising diagonally, on the right.",
]
themes = ["migration", "ocean liner", "crowd", "modernity", "geometry"]
anecdote = """
With no darkroom on board, Stieglitz could only develop his plate in Paris, nearly \
a week later, in the darkroom of an anonymous photographer, who is said to \
have told him it was an honour to welcome him."""
salle = 5
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Alim Khan, Emir of Bukhara"
artiste = "Sergueï Prokoudine-Gorski"
annee = "1911"
image = "emir-de-boukhara.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Alim_Khan_(1880–1944),_Emir_of_Bukhara,_photographed_by_S.M._Prokudin-Gorskiy_in_1911.jpg"
technique = "Three glass negatives taken behind blue, green and red filters; colours recomposed digitally"
collection = "Library of Congress, Washington"
note = "The last emir of Bukhara poses in his blue silk robe: one of the first great colour photographs, taken three times in black and white."
description = """
A corpulent man with a black beard, wearing a white turban, sits, legs \
apart, before a grey mud wall. He wears a long silk robe of an intense blue, \
scattered with large mauve, pink and green flowers and edged with red braid. \
On his chest gleam decoration plaques and an aiguillette; a wide \
belt of chased gold cinches his waist. In one hand, he holds the gilded hilt of a \
sabre whose scabbard descends to the ground, near his black boots. On \
either side, two carved wooden doors, of a warm orange, frame the scene. The gaze \
is grave, a little weary."""
evocation = """
The portrait shows a Central Asian sovereign on the eve of the disappearance of his \
world. Alim Khan, who came to the throne in early 1911, ruled an emirate under \
Russian protectorate; the European-style decorations on his chest sit beside the \
silk and gold of the court of Bukhara. Nine years later, the Red Army would take the \
city and the emir would flee to Afghanistan, where he would die in exile. For us, accustomed to \
the black and white of the early days of photography, colour comes as a shock: it abolishes \
the distance of a century and makes the scene suddenly close, almost contemporary."""
histoire = """
A chemist trained in Saint Petersburg, Prokudin-Gorskii became passionate about \
colour photography. In 1909, Tsar Nicholas II gave him his support and a \
railway car fitted out as a laboratory to photograph the Russian Empire in all its \
diversity. In 1911, he travelled in Central Asia and photographed the emir at Bukhara. His \
views were intended to be projected in colour before an audience. After the \
revolution, he left Russia in 1918 and settled in Paris in 1922. In 1948, four \
years after his death, the Library of Congress bought from his heirs nearly 1,900 \
negatives. Digitised from 2000, they have been recomposed in colour and are \
freely accessible."""
facture = """
The method, proposed by the physicist James Clerk Maxwell as early as 1855, consists of taking \
three black-and-white photographs in succession, through a blue, a green \
and a red filter. Prokudin-Gorskii recorded them on a single elongated glass plate, \
which the camera slid between exposures. Projected together through the same \
filters and superimposed, the three images reconstitute the colours. Since the exposures \
follow one another over several seconds, anything that moves is doubled into \
coloured fringes: the emir had to remain perfectly still. The image shown is a \
digital recomposition of the three negatives."""
details = [
  "The large mauve and pink flowers scattered over the blue silk.",
  "The belt of chased gold, made of domed plaques.",
  "The stars of the decorations, on the chest.",
  "The wooden doors carved with geometric motifs, on either side.",
  "The cracks in the mud wall behind the emir.",
]
themes = ["colour", "portrait", "Central Asia", "power", "Russian Empire"]
anecdote = """
Before this journey, Prokudin-Gorskii had caused a sensation with a colour portrait of \
Leo Tolstoy, taken in 1908 at Yasnaya Polyana and circulated as postcards: it was this \
success that opened the doors of the imperial family to him."""
salle = 5
mur = "est"
place = 2
largeur = 1.6

[[artistes]]
nom = "Nicéphore Niépce"
vie = "Chalon-sur-Saône, 7 March 1765 – Saint-Loup-de-Varennes, 5 July 1833"
biographie = """
Joseph Niépce, who would take the first name Nicéphore, was born into a well-to-do family of \
Chalon-sur-Saône. After studies with the Oratorians, he served in the army of the \
Revolution, then became an administrator in Nice, before returning to Burgundy at the beginning \
of the nineteenth century. With his brother Claude, he invented the pyreolophore, an internal \
combustion engine that propelled a boat on the Saône and received a patent in 1807. From \
1816, on his estate at Le Gras, in Saint-Loup-de-Varennes, he sought to \
fix the image of the camera obscura. Around 1822 he succeeded in copying an engraving by \
the action of light, then in 1827 obtained the view from his window, the oldest surviving \
photograph. Lacking support in England, he went into partnership in 1829 with Louis \
Daguerre, who was working on the same research. He died suddenly in 1833, ruined by \
his inventions, without having seen the success of the process. In 1839, the state granted a \
pension to his son Isidore, in recognition of his father's part in the invention."""
style = """
Niépce is an inventor more than an artist: he seeks a process, not a style. His \
images, heliographs on metal, glass or stone, are rare, blurred and almost \
illegible. Their importance lies elsewhere: they prove that an image can be durably fixed \
by light alone, an idea from which the daguerreotype and, step by step, all of \
photography would emerge."""

[[artistes]]
nom = "Louis Daguerre"
vie = "Cormeilles-en-Parisis, 18 November 1787 – Bry-sur-Marne, 10 July 1851"
biographie = """
Louis Jacques Mandé Daguerre began as an apprentice architectural draughtsman, then \
worked for the panorama painter Pierre Prévost and became a sought-after theatre \
designer in Paris. In 1822, he opened with Charles Bouton the Diorama, a \
spectacle of large transparent paintings whose lighting changed before the eyes of the \
public. Interested in the camera obscura, he learned of Niépce's research and \
went into partnership with him in 1829. After his partner's death, he discovered that an \
invisible image could be developed by mercury vapours, then found a way to \
fix it. On 7 January 1839, the scientist François Arago announced the invention to the Académie \
des sciences; the state bought the process in exchange for pensions paid to Daguerre and to \
Niépce's son, and made it public in August. The daguerreotype conquered the world in \
a few months. That same year, a fire destroyed the Diorama. Daguerre retired to \
Bry-sur-Marne, where he still painted a trompe-l'œil for the village church."""
style = """
Daguerre came to photography through spectacle: he knew light and \
the illusion of scenery. The daguerreotype he perfected gives unique images on \
metal, of stunning sharpness, but impossible to multiply. It dominated \
portrait photography for twenty years and made photography a popular phenomenon, \
before being supplanted by negative-based processes."""

[[artistes]]
nom = "William Henry Fox Talbot"
vie = "Melbury (Dorset), 11 February 1800 – Lacock (Wiltshire), 17 September 1877"
biographie = """
The son of an English aristocratic family, Talbot grew up at Lacock Abbey, \
in Wiltshire. A pupil at Harrow and then at Trinity College, Cambridge, he became a \
mathematician, a Fellow of the Royal Society and, from 1832 to 1835, Member of Parliament for Chippenham. In \
1833, his difficulties in drawing at Lake Como gave him the idea of fixing images \
on paper. By 1834–1835, he obtained \"photogenic drawings\" and a small \
negative of a window at Lacock. The announcement of the daguerreotype, in January 1839, \
prompted him to present his work in London. In 1841, he patented the calotype, a \
process using a paper negative that allows several prints to be made, then published The \
Pencil of Nature, the first book illustrated with photographs put on sale. His \
patents, which he defended in court, slowed the spread of the process in England \
until a lawsuit lost in 1854. A universal mind, he also studied light, invented \
a process of photographic engraving and took part in deciphering cuneiform \
scripts."""
style = """
Talbot invented the principle that dominated photography until the digital age: a \
negative from which one can print as many positives as one likes. His calotypes, with their soft grain and \
brown tones, have the poetry of drawing. He photographed his house, his objects, the \
people of Lacock, and foresaw all the uses of the medium, from art to document."""

[[artistes]]
nom = "Nadar"
vie = "Paris, 6 April 1820 – Paris, 20 March 1910"
biographie = """
Gaspard-Félix Tournachon began medical studies in Lyon, which he abandoned on his \
father's death, in 1837, to support his family. A journalist and caricaturist \
of Parisian bohemia, he signed himself Nadar and published in 1854 the Panthéon Nadar, an \
immense lithograph featuring hundreds of celebrities. That same year, he opened \
a photography studio in the rue Saint-Lazare and photographed Baudelaire, Delacroix, \
George Sand and Gérard de Nerval. In 1858, he made the first aerial \
photograph from a balloon. In 1860, he moved to 35 boulevard des Capucines, then \
photographed the catacombs and sewers of Paris by artificial light. In 1863, \
he had the Géant built, a gigantic balloon; Jules Verne drew on him for \
Michel Ardan, an anagram of Nadar. During the siege of Paris, in 1870, he organised \
balloons to carry the mail. His son Paul took over the studio; Nadar died at \
nearly ninety."""
style = """
Nadar made the photographic portrait an art. Neutral background, daylight, half-length \
framing, rejection of accessories: everything is done to reveal the sitter's character, \
which his caricaturist's eye knows how to read. His portraits of writers and artists \
make up the great gallery of his century. Curious about everything, he was also a pioneer \
of aerial photography and of artificial lighting."""

[[artistes]]
nom = "Julia Margaret Cameron"
vie = "Calcutta, 11 June 1815 – Kalutara (Ceylon), 26 January 1879"
biographie = """
Julia Margaret Pattle was born in Calcutta into a family connected with the East India Company. \
During a stay at the Cape of Good Hope, she became friends with the astronomer John \
Herschel, who would introduce her to photography. Married in 1838 to Charles Hay \
Cameron, a jurist, she kept a prominent salon in Calcutta, then settled in \
England. In 1860, the family bought a house at Freshwater, on the Isle of Wight, \
next to that of the poet Alfred Tennyson. Toward the end of 1863, at forty-eight, \
she received from her daughter and son-in-law a camera. She turned \
a henhouse into a studio, the coal shed into a darkroom, and produced in a \
dozen years some nine hundred photographs: portraits of Tennyson, of \
Herschel, of Darwin, of Carlyle, scenes inspired by the Bible and by poetry. As early as \
1865, the South Kensington Museum, now the Victoria and Albert Museum, bought her \
works. In 1875, she left with her husband for Ceylon, where she died four years \
later."""
style = """
Cameron rejected the sharpness and polish of the commercial portrait. She framed very \
close, accepted blur, stains and accidents, and sought in faces \
beauty and moral grandeur. Long mocked as an amateur, she is \
now regarded as one of the great portraitists in the history of \
photography."""

[[artistes]]
nom = "Gustave Le Gray"
vie = "Villiers-le-Bel, 30 August 1820 – Cairo, 30 July 1884"
biographie = """
The only son of a haberdasher, Gustave Le Gray was first a notary's clerk, then studied \
painting in the studio of Paul Delaroche, in Paris, and stayed in Italy. He made \
his first daguerreotypes around 1847, but it was paper photography that \
interested him: he perfected a waxed-paper negative, which he published in 1851. He \
taught photography to many pupils, including Charles Nègre, Henri Le Secq and \
Maxime Du Camp. In 1851, he took part in the Mission héliographique, charged with \
photographing the monuments of France, and helped found the Société \
héliographique. He opened in 1855 a luxurious studio in Paris, became Napoleon III's photographer and \
made his celebrated seascapes and his views of the forest of Fontainebleau. \
But his business, badly managed, went bankrupt. In 1860, he left for the Mediterranean with \
Alexandre Dumas, photographed Garibaldi and Palermo, then settled in Egypt, where he \
taught drawing in Cairo until his death."""
style = """
Le Gray is both an inventive technician and an artist trained in painting. He \
sought in photography the effects of great landscape painting: dramatic \
skies, backlighting, masses of shadow. His seascapes and forests gave \
French photography of the Second Empire its artistic ambition."""

[[artistes]]
nom = "Eadweard Muybridge"
vie = "Kingston upon Thames, 9 April 1830 – Kingston upon Thames, 8 May 1904"
biographie = """
Born Edward James Muggeridge near London, he left young for the United States and \
became a bookseller in San Francisco. Seriously injured in a stagecoach accident in \
1860, he returned to England, where he learned photography. Back in California, \
he made his name, under the name Eadweard Muybridge, with large views of the \
Yosemite Valley. In the early 1870s, Leland Stanford asked him to \
photograph his horses in motion. In 1874, he killed his wife's lover; \
acquitted, he travelled in Central America. In 1878, at Palo Alto, his series of galloping \
horses went around the world. He then invented the zoopraxiscope, which projected his \
images in motion, and gave lectures in America and Europe. From 1884 to \
1886, at the University of Pennsylvania, he photographed thousands of movements \
of men, women and animals, published in 1887 under the title Animal Locomotion. He \
ended his life in his native town."""
style = """
Muybridge turned photography into an instrument of analysis: his series \
break movement down into instants that the eye cannot seize. His grids of images, \
against a gridded background, fed scientists, painters, from Degas to Marcel Duchamp and \
Francis Bacon, and the inventors of cinema. He also showed, with his zoopraxiscope, \
that a sequence of still images projected rapidly recreates the illusion of movement."""

[[artistes]]
nom = "Eugène Atget"
vie = "Libourne, 12 February 1857 – Paris, 4 August 1927"
biographie = """
Orphaned very young, Jean-Eugène-Auguste Atget was raised by his grandparents in \
Bordeaux, then joined the merchant navy. He then became an actor in a \
travelling troupe, where he met Valentine Delafosse Compagnon, his companion until \
her death, in 1926. A throat ailment forced him to leave the stage; \
after a brief attempt at painting, he turned to photography. Around 1890, he \
settled in Paris and hung on his door the sign \"Documents pour artistes\". \
For more than thirty years, he methodically photographed old Paris: streets, \
courtyards, staircases, shops, small trades, the gardens of Versailles and Saint-Cloud. \
The Carnavalet museum and the Bibliothèque historique de la Ville de Paris bought \
thousands of images from him. Late in life, he was noticed by Man Ray, his neighbour on \
the rue Campagne-Première, and by Berenice Abbott, who would save and publicise his \
work after his death."""
style = """
Atget photographs without effect, with a view camera and in natural light, streets often \
empty. His aim was to document, and his some ten thousand images form an \
immense inventory of Paris. But the precision of his gaze, his shop windows and \
reflections seduced the Surrealists, then the American documentary photographers, \
who saw in him a father of modern photography."""

[[artistes]]
nom = "Alfred Stieglitz"
vie = "Hoboken (New Jersey), 1 January 1864 – New York, 13 July 1946"
biographie = """
The son of German immigrants, Alfred Stieglitz went to study in Berlin in the \
1880s, first engineering, then photochemistry, and began to photograph. Returning to \
New York in 1890, he fought to have photography recognised as an art. In \
1902, he founded the Photo-Secession, then launched in 1903 the journal Camera Work, printed \
in photogravure with extreme care. In 1905, he opened at 291 Fifth Avenue a small \
gallery, called 291, where he exhibited photographers but also, among the first in the \
United States, Matisse, Rodin, Picasso and Cézanne. His own photography evolved from a \
Pictorialist style toward sharp, constructed images, such as The Steerage. In 1924, \
he married the painter Georgia O'Keeffe, whom he photographed for years. In the \
1920s, he made his Equivalents, photographs of clouds, then ran \
other galleries until his death, in 1946."""
style = """
Stieglitz was at once photographer, editor and dealer. His work follows the evolution \
of photography: first hazy images imitating painting, then a frank \
photography that embraces the sharpness, the framing and the geometry of the real. Through \
his journal and his galleries, he brought photography and European modern art \
into American museums."""

[[artistes]]
nom = "Sergueï Prokoudine-Gorski"
vie = "Funikova Gora (Vladimir Governorate), 30 August 1863 – Paris, 27 September 1944"
biographie = """
Of Russian noble descent, Sergei Mikhailovich Prokudin-Gorskii studied chemistry in \
Saint Petersburg, under Dmitri Mendeleev according to his biographers, as well as \
music and painting. He ran his father-in-law's metallurgical works and became an \
active member of the photographic section of the Imperial Russian Technical Society. In \
1901, he opened a studio and a laboratory in Saint Petersburg; the following year, he \
studied three-colour photography in Berlin under Professor Adolf Miethe. \
His colour portrait of Tolstoy, in 1908, made him famous. In 1909, Nicholas II \
entrusted him with the mission of photographing the Russian Empire: for years he travelled across \
Russia, the Caucasus and Central Asia. After the revolution, he left the country in 1918 \
with part of his plates and settled in Paris in 1922, where he opened a studio \
with his children. He died a few weeks after the liberation of Paris."""
style = """
Prokudin-Gorskii did not invent colour photography, but he took it to a \
level of quality and ambition hitherto unknown. His thousands of views, of striking precision and \
freshness, form a unique portrait of the Russian Empire on the eve of the \
revolution: landscapes, churches, peasants, workers, the peoples of Central Asia."""
