[[oeuvres]]
titre = "Luxe, calme et volupté"
artiste = "Henri Matisse"
annee = "1904"
image = "luxe-calme-volupte.jpg"
technique = "Oil on canvas, 98.5 × 118.5 cm"
collection = "Centre Pompidou, Musée national d’art moderne, Paris (on deposit at the Musée d’Orsay)"
note = "A picnic by the sea at Saint-Tropez, painted in small touches of pure colour: the title comes from a poem by Baudelaire."
description = """
On the shore of a bay, at the hour when the setting sun sets the sky ablaze, a small group \
has settled on the beach. On the left, a woman in a dark dress and a hat sits \
beside a white cloth set with cups and a \
teapot. Around her, nude bathers rest, lie down or dry themselves; \
one, standing on the right, lets her long hair hang in front of her. At the centre, the \
mast of a boat drawn up on the sand traces a great diagonal. A slender pine closes the \
composition on the right, its branches drawing arabesques in a pink and yellow sky. \
In the background, blue hills line the far shore of the bay. The whole scene is made \
of small touches of pure colour, red, orange, blue and green, that shimmer \
like a mosaic."""
evocation = """
The title takes up the refrain of Baudelaire’s “L’Invitation au voyage”, which dreams of a \
land where “all is order and beauty, luxury, calm and pleasure”. Matisse transposes this \
dream into a modern scene: a family tea party rubs shoulders with nude nymphs, as if \
everyday life opened onto a golden age. It has been seen as a response to the great pastorals \
of Puvis de Chavannes and to the bathers of Cézanne, whom Matisse admired. The clothed \
woman, usually identified as Amélie, the painter’s wife, ties the myth \
to his own life. This peaceful paradise announces a theme that Matisse would never leave: \
the joy of living, the delight of light and of bodies at rest, which he would develop from the \
following year in The Joy of Life."""
histoire = """
In the summer of 1904, Matisse stayed at Saint-Tropez, where Paul Signac, leader \
of Neo-Impressionism, owned a house, La Hune. In the company of Signac and \
Henri-Edmond Cross, he tried his hand at the divided brushstroke. Back in Paris, he composed in \
the studio, from a sketch painted on the spot, this large picture, which he exhibited at the \
Salon des Indépendants in spring 1905. Signac bought it and hung it in his home at \
Saint-Tropez. The canvas, which made a strong impression on young painters such as Raoul \
Dufy, remained for a long time in Signac’s family before entering the national \
collections in the early 1980s. Owned by the Centre Pompidou, it is shown at the \
Musée d’Orsay, where it marks the turning point between Neo-Impressionism and Fauvism."""
facture = """
Matisse adopts the method of Seurat and Signac: colour is applied in separate touches, \
unmixed on the palette, so that the eye recomposes the tones. But he makes very free \
use of it. His touches are broader, almost like mosaic tesserae, and his colours more violent than \
those of his elders: oranges, pinks and bright blues. Above all, he outlines the bodies with a continuous blue or red \
line, which contradicts the very principle of division. This conflict between line and colour will lead him \
the following summer, at Collioure, to abandon the divided brushstroke for the dazzling flat areas of \
Fauvism."""
details = [
  "On the left, the woman in a dark dress and hat, the only clothed figure in the scene.",
  "On the white cloth, the cups and little teapot of the tea party.",
  "The great diagonal of the boat’s mast, at the centre of the picture.",
  "The blue and red contours that outline the bathers’ bodies.",
  "The signature, at lower right, almost drowned among the touches.",
]
themes = ["bathers", "sea", "golden age", "Neo-Impressionism", "poetry"]
anecdote = """
In 1899, almost penniless, Matisse bought from the dealer Vollard a small painting \
by Cézanne, Three Bathers. He kept it for thirty-seven years before giving it in 1936 to \
the City of Paris, explaining that it had sustained him morally in the \
critical moments of his life as an artist."""
salle = 2
mur = "nord"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Woman with a Hat"
artiste = "Henri Matisse"
annee = "1905"
image = "femme-au-chapeau.jpg"
technique = "Oil on canvas, 80.7 × 59.7 cm"
collection = "San Francisco Museum of Modern Art"
note = "The portrait of Amélie Matisse that caused a scandal at the Salon d’Automne of 1905, the one where the word “Fauves” was born."
description = """
A woman is seen half-length, her torso turned to the left and her face towards us. \
She holds a fan in front of her and wears an enormous hat laden with flowers, \
feathers and ribbons, painted in blues, violets, greens and touches of orange. Her narrow face \
is streaked with green on the forehead and the bridge of the nose, and with yellow and pink on the \
cheeks; her black eyebrows and red lips stand out forcefully. Her hair is \
an orangey red. The background depicts no recognisable room: it consists of free \
areas of green, pink, mauve and yellow, laid down with broad strokes of the brush, with \
parts where the canvas is left bare. At upper left, the signature Henri-Matisse is \
written in green letters."""
evocation = """
The sitter is Amélie Matisse, the painter’s wife, and yet the picture expresses a \
sensation rather than a likeness. Matisse does not seek to reproduce the real colour of \
the skin or the dress: he chooses each hue for its force and for its harmony with \
the others. The green on the face, which shocked so many, is not gratuitous provocation \
but a way of building volume and light through colour alone. To the \
public of 1905, accustomed to polished society portraits, this daubed face \
looked like a caricature, even an insult. Historians see in it, on the contrary, \
the birth certificate of a painting in which colour becomes autonomous. The \
extravagant hat, fashionable at the time, itself becomes a bouquet of pure colours."""
histoire = """
The portrait was painted in Paris in autumn 1905, on his return from the summer spent at Collioure. \
Matisse sent it to the Salon d’Automne, where it was hung in Room VII with the \
canvases of Derain, Manguin, Camoin, Marquet and their friends. The public burst out laughing, and \
the critic Louis Vauxcelles, noticing in the midst of these violent colours some classically \
modelled busts, wrote in the newspaper Gil Blas: “Donatello among the wild beasts!” \
The phrase stuck. The picture nevertheless found a buyer: Leo and Gertrude Stein, two \
young Americans living in Paris, hung it in their apartment on the rue de \
Fleurus, where the avant-garde came and went. It then passed to Michael and Sarah Stein, who \
took it to California, and was later bequeathed to the San Francisco museum by the \
collector Elise S. Haas."""
facture = """
Matisse lays on colour with broad, rapid, visible strokes of the brush, sometimes \
juxtaposed without touching, letting the bare canvas breathe between them. There is no \
traditional modelling and no cast shadow: volume arises from the contrast between warm and \
cool tones, the green of the bridge of the nose set against the pink and yellow of the cheeks. The drawing, \
reduced to a few dark strokes for the eyebrows, eyes and the outline of the shoulder, \
remains free. The brushwork still derives from the Neo-Impressionist experiments of the \
previous year, but burst open, widened, almost savage. The background, treated with the same \
energy as the figure, refuses any depth."""
details = [
  "The green band that runs down from the forehead along the bridge of the nose.",
  "The black eyebrows, drawn in a single gesture above the dark eyes.",
  "The fan, a simple flash of white, pink and green in the foreground.",
  "The areas where the canvas is left bare, notably in the background.",
  "The signature Henri-Matisse, in green, in the upper left corner.",
]
themes = ["portrait", "pure colour", "scandal", "fashion", "Fauvism"]
anecdote = """
According to a frequently repeated recollection, someone once asked Matisse what colour \
the dress his wife wore during the sittings really was. He is said to have \
replied: “Black, of course.”"""
salle = 2
mur = "sud"
place = 1
largeur = 0.8

[[oeuvres]]
titre = "The Red Room (Harmony in Red)"
artiste = "Henri Matisse"
annee = "1908"
image = "desserte-rouge.jpg"
technique = "Oil on canvas, 180 × 220 cm"
collection = "The State Hermitage Museum, Saint Petersburg"
note = "Commissioned by the Moscow collector Sergei Shchukin, the canvas was first painted in blue, then entirely repainted in red."
description = """
A maid, in a midnight-blue blouse and white apron, arranges fruit in a \
bowl on a laid table. The red tablecloth and the red wall merge into a \
single plane, covered with the same pattern: great blue arabesques and baskets of \
flowers. On the table stand two decanters, one of red wine, the other of a golden liqueur, a \
footed fruit bowl, a vase of flowers, and scattered lemons and oranges. On the left, \
a chair with a slatted back and a yellow straw seat. At upper left, a \
window opens onto a green garden where white trees are in blossom, under a blue sky, \
with the roof of a small pink house. The signature and date, at lower left, are \
discreetly inscribed."""
evocation = """
The subject is almost banal, a maid preparing the dessert, but Matisse turns it into \
a demonstration: colour alone can organise an entire picture. The saturated red \
abolishes the distinction between wall and table, between top and bottom, and \
transforms the room into a decorative surface. The blue arabesques seem to escape from \
the tablecloth and climb the wall, like living plants. The window provides a counterpoint: \
a springtime garden, fresh and green, sets nature against the decor. In the same year, in his \
“Notes of a Painter”, Matisse says he dreams of an art of balance and serenity, restful \
to the mind. It has been seen as one of the first great achievements of this ideal, and the \
starting point of the decorative interiors that mark his whole career."""
histoire = """
The picture was commissioned by Sergei Shchukin, a wealthy Moscow textile merchant and \
one of Matisse’s first great collectors, who intended it for the \
dining room of his town house. Matisse painted it in 1908 in a blue-green \
harmony, then repainted it entirely in red; the collector accepted this \
change and received the canvas in Moscow. It takes up a subject that Matisse had treated \
in 1897 in The Dinner Table, a picture still marked by Impressionism. After the \
Revolution of 1917, the Shchukin collection was nationalised and became a museum \
of modern Western art. When the latter was dissolved in 1948, its works were divided \
between the Pushkin Museum in Moscow and the Hermitage in Saint Petersburg, where the Red \
Room has hung ever since."""
facture = """
Matisse removes almost all depth: no perspective and no shadow, the red plane \
runs from the bottom to the top of the canvas. Space is suggested only by a few clues, the \
chair, the edge of the table, the window. The blue motif, enlarged and simplified, comes \
from a printed fabric that the painter owned. The colours are laid down in frank flat areas, \
outlined with dark strokes, in the manner of the decorative fabrics and ceramics he \
loved. The red, blue and green, almost pure, balance one another through their surfaces, \
and the supple line of the arabesques answers the curve of the maid’s back."""
details = [
  "The pattern of the tablecloth, which continues without a break onto the wall.",
  "The two glass decanters, one red, the other golden yellow.",
  "The bending maid, whose bun echoes the curves of the arabesques.",
  "The white flowering trees of the garden, behind the window.",
  "The signature and the date 1908, at lower left.",
]
themes = ["interior", "decor", "red", "still life", "collector"]
anecdote = """
The fabric printed with blue motifs, a toile de Jouy, Matisse is said, \
so the story goes, to have spotted from the top deck of an omnibus, in a Parisian shop. He \
kept it all his life and made it appear in several other paintings."""
salle = 2
mur = "ouest"
place = 2
largeur = 2.2

[[oeuvres]]
titre = "Mountains at Collioure"
artiste = "André Derain"
annee = "1905"
image = "montagnes-collioure.jpg"
technique = "Oil on canvas, 81.3 × 100.3 cm"
collection = "National Gallery of Art, Washington"
note = "In the summer of 1905, Derain painted alongside Matisse at Collioure: trees with red trunks, blue foliage, orange mountains."
description = """
In the foreground, a field of yellow-green grass is crossed by a purple path. In the \
middle, a grove of small Mediterranean trees raises twisting trunks of a bright \
red and blue and green foliage, laid down in short touches arranged like \
fans. Behind, the hills rise in great orange, yellow and red bands, \
and the mountains in the background, ultramarine blue and violet, cut their ridges against a \
sea-green sky streaked with pale clouds. No figure, no house: only \
vegetation and relief, under a light that seems to come from everywhere at once and \
casts no shadow. Derain’s signature appears at lower left, half \
lost in the grass."""
evocation = """
For Derain, colour does not copy nature: it conveys the sensation of the \
light of the South, so intense that it seems to devour shadows. In a letter to his \
friend Vlaminck, he evokes this golden, blond light that does away with shadows, and his \
desire to render it through pure colour. The picture is its realisation: the red trunks, \
the blue foliage and the orange mountains do not exist as such, but together they convey the \
dazzle of a summer afternoon. One can also read in it the \
jubilation of a shared discovery: during these weeks at Collioure, Derain and \
Matisse urged each other on towards a boldness that neither would \
perhaps have dared alone. The work sums up the summer in which Fauvism was born."""
histoire = """
In May 1905, Matisse settled at Collioure, a small Catalan port in the \
Pyrénées-Orientales, and invited Derain to join him. Derain arrived at the start of the \
summer, and the two friends painted side by side the harbour, the boats, the roofs and the \
hills planted with vines and olive trees. Derain, then twenty-five years old, \
brought back to Paris numerous canvases, drawings and sketches. Several landscapes of \
Collioure were shown at the Salon d’Automne of 1905, in Room VII, which earned its \
occupants the nickname “Fauves”. The dealer Ambroise Vollard, who was then supporting the \
young painter, would soon afterwards send him to paint London. The picture belonged to the American \
collector John Hay Whitney, before entering the National Gallery \
of Art in Washington in 1982 with the Whitney collection."""
facture = """
Derain combines two manners. In the foliage and the grass, he keeps from the \
Neo-Impressionist lesson the separate touch, but lengthens it into commas and nervous \
hatching reminiscent of Van Gogh, whose retrospective he had seen in Paris in 1901. \
In the mountains and the sky, on the other hand, he spreads colour in broad, \
sinuous flat areas, outlined in blue. Complementaries collide without transition: red against \
green, orange against blue. In places, the canvas left bare between the touches adds \
its white light to the whole. The result is something between tapestry and \
stained glass."""
details = [
  "The red, sinuous tree trunks, twisting like flames.",
  "The blue foliage, made of small touches arranged like fans.",
  "The purple path that crosses the grass in the foreground.",
  "The orange and red hills, outlined with a blue stroke.",
  "Derain’s signature, at lower left.",
]
themes = ["landscape", "Mediterranean", "light", "Fauvism", "Collioure"]
anecdote = """
At Collioure, a marked “Fauvism trail” through the town displays \
reproductions of the paintings of Matisse and Derain at the very spots where they set \
up their easels in 1905. One can thus compare their colours with the real landscape."""
salle = 2
mur = "sud"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Blue Horse I"
artiste = "Franz Marc"
annee = "1911"
image = "cheval-bleu.jpg"
technique = "Oil on canvas, 112 × 84.5 cm"
collection = "Städtische Galerie im Lenbachhaus, Munich"
note = "A young blue horse, head bowed, before red and yellow hills: the very image of the Blue Rider."
description = """
A young blue horse stands, almost facing us, filling the whole height of the \
canvas. Its head, lowered towards the ground and turned to the left, is framed by a \
midnight-blue mane; its long, slender, slightly stiff legs are those of a \
foal. Its body passes from the palest blue, almost white on the chest and \
neck, to the deep blue of the flanks and hooves. Around it, the landscape is \
made of great rounded hills: pink and violet on the right, yellow at the centre, blue \
at the top, under a pink sky. In the foreground, the ground is red and green, and a plant \
with broad green leaves rises on the right, as if answering the curve of the \
animal."""
evocation = """
For Franz Marc, the animal is purer than man and closer to the harmony of the \
world: to paint a horse is to attempt to see nature through its eyes. In a \
letter to August Macke of December 1910, he sets out his symbolism of colours: blue \
is the masculine principle, austere and spiritual, yellow the feminine principle, gentle and \
sensual, and red matter, brutal and heavy, which the other two must \
fight. The blue horse, amid yellow and red hills, thus becomes \
the image of a young, meditative soul in a world laden with matter. It has been seen as a \
kind of spiritual self-portrait of the painter, and as a manifesto of the Blue Rider, the group \
he founded that same year with Kandinsky."""
histoire = """
Marc painted this picture in 1911 at Sindelsdorf, a village in Upper Bavaria where he had \
settled with Maria Franck at the foot of the Alpine foothills, and where he observed \
horses in the meadows at length. That same year, with Vassily Kandinsky, he founded the Blue \
Rider, Der Blaue Reiter, whose first exhibition opened in Munich in December 1911, \
and prepared the almanac that appeared in spring 1912. The picture entered the collection \
of Bernhard Koehler, a Berlin industrialist and patron of Marc and Macke. In 1965, the \
Bernhard Koehler Foundation gave it to the Lenbachhaus, which had received in 1957 the donation \
of Gabriele Münter, painter and companion of Kandinsky. This is how Munich \
became the great home of the Blue Rider."""
facture = """
Marc long studied and taught animal anatomy, but here he simplifies \
form into great curves. The horse’s body is modelled by gradations of blue, from \
white to dark blue, while the landscape is treated in almost pure flat areas. The \
hills echo the rounded outline of the neck and back, so that the animal and \
the landscape form a single rhythmic composition. The low, close viewpoint \
makes the young horse monumental. The colour, freed from any plausibility, owes \
much to Gauguin and Fauvism, but here it is charged with symbolic meaning."""
details = [
  "The bowed head and lowered gaze, as if lost in thought.",
  "The almost white chest, which catches the light.",
  "The foal’s long, slender, slightly awkward legs.",
  "The green plant on the right, whose leaves answer the curve of the horse.",
  "The yellow, pink and violet hills undulating behind it.",
]
themes = ["animal", "horse", "spirituality", "symbolic colour", "Blue Rider"]
anecdote = """
Marc’s most famous painting of horses, The Tower of Blue Horses (1913), was \
confiscated by the Nazis in 1937 from the Nationalgalerie in Berlin as “degenerate art”. \
Its trace was lost at the end of the Second World War: it is still being sought."""
salle = 3
mur = "nord"
place = 2
largeur = 0.85

[[oeuvres]]
titre = "Promenade"
artiste = "August Macke"
annee = "1913"
image = "promenade.jpg"
technique = "Oil on cardboard, 51 × 57 cm"
collection = "Städtische Galerie im Lenbachhaus, Munich"
note = "Faceless strollers under the trees of a park: the peaceful, luminous world of August Macke, a year before his death."
description = """
Beneath tall trees with violet and blue trunks, a couple strolls in a park. \
The man, in profile, wears a straw boater and a dark suit; the woman, seen from behind, dressed \
in a long blue and red dress and a red hat, holds a white parasol. Further off, two figures leaning on a low wall gaze into the distance. On the right, \
a woman in a white headdress, her face barely indicated, is cut off by the edge of the \
picture. Above them the foliage forms a vault of luminous greens, and the yellow \
and pink ground seems bathed in sunlight. No one looks at us: each is absorbed \
in walking or contemplation, and the scene breathes the calm of a summer afternoon."""
evocation = """
Macke paints a world without drama: Sunday strollers, women with parasols, \
children before shop windows or beside lakes. Where Kirchner sees the city as \
a place of anguish, he sees a place of harmony, where man lives in accord with \
nature. The faceless figures are not disquieting: they become \
universal types, coloured forms among the trees, in which everyone can recognise themselves. It has \
been seen as an almost idyllic vision of bourgeois life before 1914, a kind of secular paradise. This quiet happiness takes on in hindsight a poignant value: a year later, \
war broke out and Macke was killed in the first weeks, at the age of twenty-seven."""
histoire = """
In 1913, Macke was at the height of his art. Linked since 1910 to Franz Marc, he had taken part in \
the adventure of the Blue Rider and its almanac, before distancing himself from \
Kandinsky’s mysticism. In Paris, in 1912, he had met Robert Delaunay, whose \
research on colour had deeply marked him. In autumn 1913, he settled \
with his family at Hilterfingen, on Lake Thun in Switzerland, where he painted \
many scenes of strollers, lakes and shop windows. Like Marc’s Blue Horse, \
this picture belonged to Bernhard Koehler, uncle of the painter’s wife and patron of the \
group; it entered the Lenbachhaus in 1965 with the donation from his foundation."""
facture = """
Macke simplifies forms into large coloured planes, outlined with supple contours. \
Faces are suppressed or reduced to a patch, bodies to silhouettes. He borrows \
from Cubism the geometry of forms and from Delaunay the idea that colour, through its \
contrasts, creates light and movement by itself: the red of the dress vibrates \
against the green of the foliage, the blue against the yellow of the ground. The brushwork remains visible and \
rapid, but the composition is rigorously constructed, the trunks framing the \
scene like theatre wings. On the cardboard, the paint has cracked in \
places."""
details = [
  "The woman’s white parasol, the lightest patch in the picture.",
  "The man’s boater, banded with a black ribbon.",
  "The two figures leaning on the low wall, at centre right.",
  "The violet and blue trunks that frame the scene like a curtain.",
  "The fine cracks in the paint, visible on the cardboard.",
]
themes = ["promenade", "park", "leisure", "harmony", "Blue Rider"]
anecdote = """
On learning of his friend’s death, Franz Marc wrote a tribute in which he asserted that, deprived \
of Macke’s harmonies, the colour of German art would grow paler by several tones. \
Marc himself was killed eighteen months later, before Verdun."""
salle = 3
mur = "ouest"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Potsdamer Platz"
artiste = "Ernst Ludwig Kirchner"
annee = "1914"
image = "potsdamer-platz.jpg"
technique = "Oil on canvas, 200 × 150 cm"
collection = "Neue Nationalgalerie, Berlin"
note = "Two prostitutes on an island in the busiest square in Berlin, on the eve of the Great War."
description = """
In the foreground, two elegant women stand on a circular island, in the middle of \
the green roadway of the square. The one on the right, in a blue coat with a white collar, wears a \
feathered hat and looks straight ahead, her face greenish and her lips red. \
The one on the left, in profile, is wrapped in black and veiled. Behind \
them, the square opens out in plunging perspective: passers-by in black, angular silhouettes, \
cross the roadway or walk along the pavements. In the background, on the left, rise \
a domed building and the pink arcaded façade of the Potsdam station; on the \
right, a row of white houses. The two women seem isolated on their \
pedestal, while the men circle around them."""
evocation = """
The two women are prostitutes, figures whom Kirchner painted ceaselessly in his \
Berlin street scenes: objects of desire and transaction, they embody for him \
the modern city, fascinating and disquieting. Isolated on their island as on a stage \
or a pedestal, they offer themselves to the gaze of the men in black who brush past them. The \
tilted perspective, the stretched bodies and the acid colours convey the nervousness, \
the anonymity and the speed of the metropolis. In the black veil of the woman on the \
left, some have seen a widow’s disguise, used by certain prostitutes to evade the \
police, which takes on a sinister resonance in 1914, the year war broke out. The \
picture expresses the anguish of a world on the brink of collapse."""
histoire = """
Kirchner left Dresden for Berlin in autumn 1911. The group Die Brücke, which he had \
founded in 1905 with Erich Heckel, Karl Schmidt-Rottluff and Fritz Bleyl, dissolved in \
1913. Left to himself, he undertook a series of about ten large street scenes, \
painted between 1913 and 1915, of which Potsdamer Platz is one of the most ambitious. The \
square, a crossroads of tram lines and railway stations, was then one of the busiest places in Europe. Mobilised in 1915, Kirchner collapsed physically and morally, and \
went to Switzerland for treatment, where he would spend the rest of his life. Declared “degenerate” by \
the Nazis, he took his own life in 1938. The picture is today in the Neue \
Nationalgalerie, a few hundred metres from the square it depicts."""
facture = """
Kirchner paints fast, in long, jagged, angular strokes that give forms a \
nervous energy. Figures lengthen, faces become masks. The \
perspective is deliberately distorted: the square tilts towards the viewer, while \
the circular island, seen from above, contradicts the frontal view of the two women. The \
palette is dominated by cold greens and blues, enlivened by the pink of the station and \
the white of the collars. One recognises the influence of the woodcut, which Kirchner \
practised intensely, with its sharp contours, and that of the \
African and Oceanic sculptures he had studied at the ethnographic museum in Dresden."""
details = [
  "The greenish faces and red lips of the two women, like masks.",
  "The black veil covering the face of the woman on the left.",
  "The circular island, seen from above, on which they stand.",
  "The black silhouettes of the passers-by, stretched like shadows.",
  "In the background, the pink arcaded façade of the Potsdam station.",
]
themes = ["city", "prostitution", "modernity", "Berlin", "anguish"]
anecdote = """
Traffic on Potsdamer Platz was such that in 1924 one of the first \
traffic lights in Europe was installed there, a tower topped by a clock. A replica \
of this tower stands today on the rebuilt square."""
salle = 4
mur = "nord"
place = 2
largeur = 1.5

[[oeuvres]]
titre = "Self-Portrait on the Sixth Wedding Anniversary"
artiste = "Paula Modersohn-Becker"
annee = "1906"
image = "sixieme-anniversaire.jpg"
technique = "Oil on cardboard, 101.8 × 70.2 cm"
collection = "Paula Modersohn-Becker Museum, Bremen"
note = "Paula paints herself nude to the hips, hands on a rounded belly: a gesture of unheard-of audacity for a woman painter in 1906."
description = """
The young woman stands in three-quarter view, nude to the hips, a white sheet \
knotted at the waist. She wears a long amber necklace of large oval beads. Her \
hands encircle her rounded belly, as if to support or protect it. She turns \
her head towards us, her gaze direct but gentle, a faint smile on her lips; her \
chestnut-red hair, parted in the middle, is pulled back. The pale green background \
is scattered with small green and yellow spots, like flowered wallpaper. At lower right, an inscription in German, signed with her initials, states \
that she painted this picture at thirty, on the day of her sixth wedding \
anniversary."""
evocation = """
This picture is often considered the first nude self-portrait painted by a woman \
in the history of Western art. Paula shows herself neither as muse nor as object of \
desire, but as subject: she looks at herself and at us, serene and self-assured. The \
rounded belly has intrigued many, since she was not pregnant at the time. It has been \
seen as the expression of a longing for a child, or else as a metaphor for creation: in \
leaving her husband for Paris, she felt she was at last becoming herself and bearing her \
work. The picture thus unites the intimate and self-assertion, fertility and \
freedom. It anticipates by several decades the questions that feminist art would raise about \
women’s bodies and the gaze directed at them."""
histoire = """
In February 1906, after five years of marriage to the painter Otto Modersohn, Paula left \
Worpswede, the artists’ colony near Bremen where the couple lived, to settle \
alone in Paris. She wanted to work, to study the modern masters and to live by her \
painting. It was there, in spring 1906, that she painted this self-portrait. The inscription \
speaks of a sixth anniversary, although the couple had married in May 1901, which \
has caused much ink to flow. Otto joined her in Paris in autumn, and she agreed to \
return with him to Worpswede in spring 1907. The picture is today kept in \
Bremen, at the Paula Modersohn-Becker Museum, opened in 1927 in the Böttcherstraße on the \
initiative of the coffee merchant Ludwig Roselius, and considered the first museum \
in the world devoted to a woman painter."""
facture = """
Paula simplifies forms into large, calm volumes, in the manner of Gauguin and \
Cézanne, whom she had studied in Paris. The body is modelled in warm, matte tones, ochre pink and pale yellow, with no shine or anecdotal detail. The paint, laid \
on the cardboard in dry, grainy layers, evokes fresco or distemper. The \
contours are outlined with a dark stroke. The decorative background, treated in regular spots, \
flattens space and makes the figure stand out like an icon. One also thinks of the \
Fayum funerary portraits, painted on wood in Roman Egypt, which she had \
admired at the Louvre."""
details = [
  "The long amber necklace of large beads, her only adornment.",
  "The two hands resting on the rounded belly.",
  "The white sheet knotted at the hips, painted in broad strokes of the brush.",
  "The pale green background scattered with small spots, like wallpaper.",
  "The handwritten inscription in German, at lower right, signed P. B.",
]
themes = ["self-portrait", "nude", "motherhood", "woman artist", "freedom"]
anecdote = """
The poet Rainer Maria Rilke, her friend since Worpswede, dedicated to her in 1908, a year \
after her death, one of his most beautiful poems, Requiem for a Friend."""
salle = 4
mur = "sud"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Self-Portrait with Physalis"
artiste = "Egon Schiele"
annee = "1912"
image = "autoportrait-physalis.jpg"
technique = "Oil and gouache on wood, 32.2 × 39.8 cm"
collection = "Leopold Museum, Vienna"
note = "Schiele at twenty-two, his face tormented and his gaze sidelong, beside a branch of physalis with red lanterns."
description = """
The young painter shows himself in bust form, dressed in a black waistcoat buttoned to the neck, his \
body turned to the right and his head slightly thrown back. He looks at us \
sidelong, eyebrows raised, with an expression at once haughty, anxious and \
provocative. His dark hair stands up in unruly locks. His face, painted in \
flesh tones, greys, blues and reds, seems bruised. On the left, a branch of \
physalis, a plant whose fruits are wrapped in a bright red lantern, spreads its \
thin stems and withered leaves against a white background. A grey shape, like a shadow, \
extends behind the head. At lower right, the signature and date are inscribed in \
capitals within a square block."""
evocation = """
Schiele painted and drew more than a hundred self-portraits, in which he stages himself \
without complacency, thin, tense, sometimes nude. This is one of the most famous. The \
sidelong gaze, at once wary and defiant, seems to size up the viewer. It has been seen as \
the image of the artist as a being apart, misunderstood by society, fragile and \
proud at once. The physalis, autumn fruits with red husks, \
introduce a note of vivid colour, which some interpret as an allusion to the \
passing of time. Painted as a pendant to a portrait of his companion Wally Neuzil, of the same \
format, the picture forms with it a couple that remains one of the strongest images \
of the Vienna of 1912, anxious and sensual."""
histoire = """
In 1912, Schiele was twenty-two. He had left the Academy of Fine Arts in Vienna in \
1909 and freed himself from the influence of Klimt, who nevertheless supported him. That year \
was also one of trial: settled at Neulengbach, west of Vienna, with Wally \
Neuzil, he was arrested in spring, accused of abducting a minor; the charge \
was dropped, but he was convicted of leaving erotic drawings within sight of children \
and spent twenty-four days in prison. The picture later belonged to the \
Viennese collector Rudolf Leopold, an ophthalmologist, who assembled from the \
1950s onwards the largest collection of Schiele’s works in the world. It is today \
one of the masterpieces of the Leopold Museum, opened in 2001."""
facture = """
Schiele works on a small wooden panel with a smooth surface, where every stroke of the \
brush remains visible. The face is built up with nervous touches of unexpected colours, \
blues, reds, violets, which give it the look of raw flesh. The \
drawing, his favourite domain, remains predominant: angular contours, taut \
lines of the neck and shoulders. The white background, worked in broad strokes of the brush, \
isolates the figure as on a sheet of paper. The composition is off-centre: the \
body is pushed to the right and cut by the edge, leaving the branch to occupy the \
left half, a framing reminiscent of Japanese prints."""
details = [
  "The eyes turned to one side, beneath raised eyebrows.",
  "The blue and red touches that marble the face.",
  "The little red lanterns of the physalis, at upper and lower left.",
  "The grey shape floating behind the head, like a shadow.",
  "The signature EGON SCHIELE 1912, inscribed in a square at lower right.",
]
themes = ["self-portrait", "identity", "Vienna", "anguish", "physalis"]
anecdote = """
Its pendant, the Portrait of Wally Neuzil, was seized in New York in 1998, at the end of a \
loan to MoMA, at the request of the heirs of an art dealer despoiled under the Nazis. \
After twelve years of proceedings, a settlement allowed its return to Vienna in 2010."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Jeanne Hébuterne"
artiste = "Amedeo Modigliani"
annee = "1919"
image = "jeanne-hebuterne.jpg"
technique = "Oil on canvas, 91.4 × 73 cm"
collection = "Metropolitan Museum of Art, New York"
note = "Modigliani’s companion, seated, her cheek resting on her hand: one of the last portraits he made of her."
description = """
A young woman with long auburn hair sits in three-quarter view, her elbow resting \
on the back of an ochre armchair, her head tilted slightly against her folded hand. \
She wears a loose white chemise with thin straps, which leaves her shoulders and \
arms bare. Her neck is very long, her face oval, her nose straight and elongated, her mouth small \
and red. Her almond-shaped, pale blue eyes have no pupils. Her other arm drops \
along her body to the bottom of the picture. The background is made of two planes of colour, \
one brown-green on the left, the other blue-grey on the right, laid down in free touches. At upper \
right, the painter signed modigliani, in lower case."""
evocation = """
Modigliani painted Jeanne Hébuterne more than twenty times, and none of these \
portraits seeks photographic likeness. The elongation of the neck and face, \
the empty eyes and the pensive pose make her an almost timeless figure, between the icon \
and the Renaissance Madonna, which the painter, born in Livorno, had known since \
childhood. The pupil-less eyes, frequent in his work, give the sitter an air of inner \
reverie, as if she were looking within herself. The melancholy \
gentleness of this portrait has often been linked to the couple’s tragic fate: in 1919, Jeanne \
was expecting their second child, and neither would live beyond January 1920. The \
picture speaks of tenderness, but also of a kind of withdrawal."""
histoire = """
Jeanne Hébuterne, a student at the Académie Colarossi, met Modigliani in 1917; she \
was not yet twenty, he was thirty-two. Despite the opposition of her Catholic, bourgeois \
family, she moved in with him. In 1918, the couple left for Nice, where their daughter, also named Jeanne, was born in \
November. Back in Paris in 1919, they lived \
on the rue de la Grande-Chaumière, in Montparnasse. Consumed by tuberculosis, Modigliani died \
on 24 January 1920 at the Hôpital de la Charité. The next day, Jeanne, eight months \
pregnant, threw herself from the window of her parents’ apartment. The picture belonged \
to the New York collectors Nate B. Spingold and his wife, who gave it to the \
Metropolitan Museum in 1956."""
facture = """
Modigliani simplifies forms according to a very personal canon: oval face, column-like neck, \
sloping shoulders, tapering hands. This vocabulary comes from his practice of \
sculpture, between 1909 and 1914, when, encouraged by Brancusi, he carved in \
stone elongated heads inspired by African masks and archaic art. The \
colour is applied in thin, muted layers, ochres, whites, blue-greys, without Fauve \
brilliance. The supple, continuous contour envelops the figure like a drawn line. \
Cézanne’s influence can be read in the construction of the background in juxtaposed planes of colour \
and in the sitter’s inclined pose."""
details = [
  "The pale blue eyes, without pupils.",
  "The hand folded against the cheek, with very long fingers.",
  "The stretched neck, almost like a column.",
  "The background divided into two planes of colour, brown-green and blue-grey.",
  "The signature modigliani, in lower case, at upper right.",
]
themes = ["portrait", "love", "melancholy", "Montparnasse", "tragedy"]
anecdote = """
First buried at Bagneux by her family, Jeanne Hébuterne was not reunited with Modigliani \
in the Père-Lachaise cemetery until 1930. On their shared tomb, an epitaph in \
Italian hails her as his companion devoted to the point of the ultimate sacrifice."""
salle = 5
mur = "est"
place = 2
largeur = 0.8

[[artistes]]
nom = "Henri Matisse"
vie = "Le Cateau-Cambrésis (Nord), 31 December 1869 – Nice, 3 November 1954"
biographie = """
The son of a grain merchant from the North, Henri Matisse at first intended to study law and \
worked as a lawyer’s clerk. In 1890, immobilised by appendicitis, he received from his \
mother a box of paints: it was a revelation. He left for Paris, entered the \
École des Beaux-Arts in 1895 in the studio of Gustave Moreau, discovered Impressionism and \
Cézanne, then the light of the South in Corsica. In 1898, he married Amélie Parayre. After a \
summer at Saint-Tropez with Signac in 1904, he painted at Collioure with Derain, in 1905, \
the canvases that caused a scandal at the Salon d’Automne and made him the leader of the “Fauves”. \
Supported by the Steins, then by the Russian collectors Shchukin and Morozov, he \
opened an academy and travelled to Morocco. From 1917, he worked mainly in Nice, \
where he painted his odalisques. Gravely ill in 1941, he invented in his last \
years the gouache cut-outs and designed the Chapelle du Rosaire in Vence. He died in \
Nice in 1954."""
style = """
Matisse makes colour the engine of painting: laid down in pure flat areas, it \
builds space, light and emotion without recourse to modelling or \
perspective. His drawing, of great economy, seeks the essential arabesque. He \
dreamed of an art of balance and serenity, decorative in the noblest sense. He is \
one of the great inventors of twentieth-century painting; his interiors, his paper \
cut-outs and his chromatic freedom have nourished American abstraction and \
generations of painters and designers."""

[[artistes]]
nom = "André Derain"
vie = "Chatou (Yvelines), 10 June 1880 – Garches (Hauts-de-Seine), 8 September 1954"
biographie = """
The son of a well-off tradesman from Chatou, André Derain gave up engineering studies for \
painting. In 1900, he met Maurice de Vlaminck, with whom he shared a studio \
in Chatou, then Henri Matisse, who persuaded his parents to let him paint. After his \
military service, he spent the summer of 1905 with Matisse at Collioure and exhibited at the Salon \
d’Automne among the “Fauves”. The dealer Ambroise Vollard sent him to paint London: \
his views of the Thames rank among the high points of Fauvism. From 1907, close to \
Picasso, he turned to a more constructed painting, inspired by Cézanne and \
African art, then to a return to the tradition of the old masters. Mobilised \
throughout the Great War, he then enjoyed great success and created sets \
for the Ballets Russes. His trip to Germany in 1941, at the invitation of the Nazi \
authorities, lastingly tarnished his reputation. He died in 1954 from the effects of a \
road accident."""
style = """
Derain is, with Matisse, the inventor of Fauvism: pure, arbitrary colours, \
broad or fragmented touches, contrasts of complementaries that convey the \
dazzle of light. But he did not stop there: curious about everything, he went on \
through a Cézannian geometry, then sought in the primitives, icons and \
classical masters a graver, more solid art. His canvases of 1905 and 1906, at \
Collioure and in London, remain the most famous and rank among the most \
vivid images of the early century."""

[[artistes]]
nom = "Ernst Ludwig Kirchner"
vie = "Aschaffenburg (Bavaria), 6 May 1880 – Frauenkirch, near Davos (Switzerland), 15 June 1938"
biographie = """
The son of a chemist specialising in paper, Ernst Ludwig Kirchner studied architecture at \
the Technical University of Dresden, where he became friends with Erich Heckel, Karl \
Schmidt-Rottluff and Fritz Bleyl. Together, in 1905, they founded the group Die Brücke, “the \
bridge”, which wanted to build a bridge to the art of the future. In their studios and on the \
shores of the Moritzburg lakes, they painted nudes in the open air, made woodcuts and \
lived as a community. Kirchner discovered African and Oceanic art at the ethnographic \
museum in Dresden. In 1911, he settled in Berlin, where he painted the street \
scenes that made him famous. His Chronicle of Die Brücke, judged too personal by his \
comrades, led to the dissolution of the group in 1913. Mobilised in 1915, he collapsed \
and in 1917 went for treatment in Switzerland, near Davos, where he painted the mountains and \
peasants. In 1937, the Nazis removed more than six hundred of his \
works from German museums. The following year, he took his own life at Frauenkirch."""
style = """
Kirchner is the central figure of German Expressionism. His painting rests on \
an angular, rapid line, stretched forms and raw, often acid colours, \
which convey psychological tension rather than appearance. The woodcut, \
which he practised with passion, feeds his sharp contrasts. His Berlin \
street scenes have become the very image of the modern metropolis, nervous and \
disquieting, and have lastingly marked German figurative art, down to the \
Neo-Expressionists of the 1980s."""

[[artistes]]
nom = "Franz Marc"
vie = "Munich, 8 February 1880 – Braquis, near Verdun, 4 March 1916"
biographie = """
The son of the landscape painter Wilhelm Marc, Franz Marc at first considered theology before \
entering the Academy of Fine Arts in Munich in 1900. Two stays in Paris, in 1903 \
and 1907, introduced him to Impressionism and then Van Gogh and Gauguin. He went through a \
long period of doubt and lived partly from lessons in animal anatomy. In 1910, he \
met August Macke, then Vassily Kandinsky, and settled at Sindelsdorf, in \
Upper Bavaria, with Maria Franck, whom he married in 1911. That year, he founded with \
Kandinsky the Blue Rider and prepared the exhibition and almanac that bear that name. \
His horses, deer, tigers and cows in symbolic colours \
established him as one of the great painters of his generation. In contact with Delaunay and \
the Futurists, his compositions fragmented into prisms, up to abstraction in \
1914. Mobilised at the very start of the war, he was killed by a shell fragment near Verdun \
in March 1916, at the age of thirty-six."""
style = """
Marc wished to paint the world as animals perceive it, whom he judged purer \
and closer to the harmony of nature than men. His colours do not \
describe: they signify, according to a precise symbolism in which blue is spirit, \
yellow gentleness and red matter. His compositions, rhythmic with curves, then \
prismatic planes, lead from figuration to abstraction. A major figure of the \
Blue Rider, he helped make colour a spiritual language."""

[[artistes]]
nom = "August Macke"
vie = "Meschede (Westphalia), 3 January 1887 – Perthes-lès-Hurlus (Marne), 26 September 1914"
biographie = """
Born in Westphalia and raised in Cologne and then Bonn, August Macke studied at the Academy of \
Fine Arts and the School of Applied Arts in Düsseldorf. He travelled to Italy, the \
Netherlands, Belgium and Paris, where he discovered the Impressionists in 1907. In 1909 he \
married Elisabeth Gerhardt, whose uncle, the Berlin industrialist Bernhard \
Koehler, became his patron. During a stay on the Tegernsee, he met Franz \
Marc in 1910; the friendship of the two painters would be one of the most fruitful of the era. He \
took part in the Blue Rider and its almanac, before distancing himself from Kandinsky’s \
mysticism. In 1912, with Marc, he visited Robert Delaunay in Paris, \
a decisive meeting. In 1913 he organised in Bonn an exhibition of Rhenish \
Expressionists, then spent a few months by Lake Thun. In April 1914, he travelled to \
Tunisia with Paul Klee and Louis Moilliet and brought back dozens of watercolours. \
Mobilised in August, he was killed in Champagne a few weeks later, at the age of twenty-seven."""
style = """
Macke is the most luminous of the German Expressionists. Less tormented than \
Kirchner, less mystical than Kandinsky or Marc, he paints a world of strollers, \
parks, shop windows and gardens, where vivid colour expresses the joy of living. He \
synthesises Fauvism, Cubism and Delaunay’s simultaneous contrasts: transparent \
coloured planes, simplified figures, colours that create light. His \
Tunisian watercolours, of great freedom, rank among the high points of modern \
watercolour."""

[[artistes]]
nom = "Egon Schiele"
vie = "Tulln (Lower Austria), 12 June 1890 – Vienna, 31 October 1918"
biographie = """
The son of a station master from Tulln, Egon Schiele lost his father at fourteen and at \
sixteen entered the Academy of Fine Arts in Vienna, which he left in 1909, tired of its \
conservatism. Gustav Klimt, who admired him, introduced him to collectors and to the \
workshops of the Wiener Werkstätte. Schiele soon broke free of Klimtian ornament in favour of \
a painting of the body and of anguish. In 1911, he settled with Wally Neuzil in \
Krumau, in Bohemia, then in Neulengbach, from which rumours drove them out; in 1912, he \
spent twenty-four days there in prison for drawings judged immoral. In 1915, he married \
Edith Harms and was mobilised, assigned most often to the rear. In 1918, the Secession \
exhibition, where he occupied the main room, at last brought him success. But \
Spanish flu carried off Edith, six months pregnant, on 28 October 1918, then Schiele \
himself three days later. He was twenty-eight."""
style = """
Schiele is first of all a virtuoso draughtsman: his taut, angular, sometimes \
broken line is enough to conjure up a body and a torment. In his portraits, \
self-portraits and nudes, he shows bodies thin, tense, exposed without disguise, with \
a frankness that caused scandal. His colours, often earthy and heightened with reds \
and oranges, accentuate the impression of raw flesh. A major figure of \
Viennese Expressionism, he has seen his influence grow steadily since the \
1960s."""

[[artistes]]
nom = "Amedeo Modigliani"
vie = "Livorno (Italy), 12 July 1884 – Paris, 24 January 1920"
biographie = """
Born in Livorno into a cultured but ruined Sephardic Jewish family, Amedeo Modigliani, \
of fragile health, studied painting in Livorno, Florence and Venice, nourished by the masters \
of the Renaissance. In 1906, he settled in Paris, first in Montmartre and then in \
Montparnasse. Between 1909 and 1914, encouraged by the sculptor Constantin Brancusi, he \
devoted himself mainly to sculpture and carved elongated stone heads, until his \
health forced him to give it up. Back to painting, he made portraits of his \
friends, Soutine, Max Jacob, Cocteau, and a series of nudes; when these were shown at the \
Galerie Berthe Weill, in 1917, the police demanded their removal on the very day of the opening. \
His dealers, Paul Guillaume and then Léopold Zborowski, supported him. In 1917, he \
met Jeanne Hébuterne, who gave him a daughter in 1918. Undermined by tuberculosis, \
alcohol and poverty, he died in 1920 at thirty-five, just as his painting \
was beginning to sell."""
style = """
Modigliani created an immediately recognisable human figure: oval face, stretched \
neck, long nose, almond eyes often without pupils, sloping shoulders. This canon unites \
the grace of the Sienese painters and Botticelli, the simplification of African and \
archaic sculpture, and the construction of Cézanne. Neither Fauve nor Cubist, he remained on the \
margins of the movements of his time, but shared with the Expressionists the desire to \
convey an inner presence rather than a likeness."""

[[artistes]]
nom = "Paula Modersohn-Becker"
vie = "Dresden, 8 February 1876 – Worpswede (near Bremen), 20 November 1907"
biographie = """
Born in Dresden into a cultured family that moved to Bremen in 1888, Paula Becker trained as \
a schoolteacher, as her parents wished, while taking drawing and painting \
lessons in London and Berlin. In 1898, she joined Worpswede, an artists’ colony nestled in the \
peat bogs near Bremen, where she became friends with the sculptor \
Clara Westhoff, future wife of the poet Rilke. Between 1900 and 1907, she made four \
stays in Paris, where she discovered Cézanne, Gauguin, the Nabis and the Fayum portraits. \
In 1901, she married the painter Otto Modersohn, a widower and father of a little \
girl. Stifling in married life and in the Worpswede circle, which judged her \
painting clumsy, she left alone for Paris in 1906, where she painted \
self-portraits and still lifes of a new freedom. Back in Worpswede, she \
died in November 1907, eighteen days after the birth of her daughter Mathilde, at \
thirty-one. She had sold only a few paintings; she left more than \
seven hundred."""
style = """
Paula Modersohn-Becker moved beyond the sentimental realism of the Worpswede painters towards \
a painting of simple, massive forms, with muted colours and a grainy surface. \
Inspired by Cézanne, Gauguin and archaic art, she paints peasant women, \
children, mothers and above all herself, with an unprecedented gravity and frankness. \
A pioneer of German Expressionism, she is also one of the first women to \
have made her own body the subject of her art."""
