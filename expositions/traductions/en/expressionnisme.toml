[exposition]
ordre = 180
nom_court = "Expressionism"
mouvement = "Fauvism and Expressionism"
cadre = "bois"
couleur = "#2b4c9b"
titre = "Fauves and Expressionists: Colour Set Free"
artiste = "Matisse, Derain, Kirchner, Marc, Macke, Schiele, Modigliani…"
dates = "1904–1919"
accroche = "Virtual exhibition · Lenbachhaus, Munich"
introduction = """
At the beginning of the twentieth century, a generation of painters freed colour from its \
descriptive role: in Paris, the “Fauves” Matisse and Derain painted green faces and \
orange mountains; in Germany and Austria, Kirchner, Marc, Macke and Schiele made it the \
language of emotion, anguish and the spirit. The visit follows this shock wave from \
Collioure to Berlin, from Munich to Vienna and Montparnasse, with Modigliani and \
Paula Modersohn-Becker. The building is inspired by the Lenbachhaus in Munich, home of the \
Blue Rider: a tall contemporary foyer like that of the wing designed by Norman \
Foster, white galleries bathed in light, and the enfilade of the painter Franz von \
Lenbach’s villa."""
vitrine = "cheval-bleu.jpg"

[musee]
nom = "Lenbachhaus"
ville = "Munich, Germany"
architecte = "Gabriel von Seidl"
construction = "1887–1891"
presentation = """
The Lenbachhaus began as the villa of the painter Franz von Lenbach, favourite portraitist of \
Imperial Germany, built for him by Gabriel von Seidl in the manner of a Tuscan \
villa, with ochre façades and a garden. After the painter’s death, the City \
of Munich bought it in 1924 and opened its municipal gallery there in 1929. Everything changed in \
1957: for her eightieth birthday, Gabriele Münter, Kandinsky’s companion, gave the \
museum hundreds of Blue Rider works that she had hidden under the Nazi regime. \
The Lenbachhaus became the home of the Blaue Reiter, of Kandinsky, Marc, Macke, Jawlensky \
and Münter. Renovated from 2009 to 2013, it received from Norman Foster a new wing clad \
in brass-coloured tubes, whose tall foyer, where Olafur Eliasson’s Wirbelwerk turns, \
links the historic villa to the contemporary galleries."""
ici = """
ARTEON blends the two eras. The foyer, 11 metres high and almost white, welcomes \
visitors from the south, like Foster’s wing. To the west lies Room I · The Fauves; to the \
north, Room II · The Blue Rider, the whitest of all, bathed in light like the new \
galleries. To the east begins the villa’s enfilade: Room III · Worpswede and \
Berlin, with its cream walls, opens through a door on its east side onto Room IV · Vienna and \
Montparnasse, where the visit ends. Square, measuring 10 metres on each side and 5 metres \
high, these two rooms are the most intimate."""

