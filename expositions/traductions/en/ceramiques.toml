[[oeuvres]]
titre = "The King's Tureen"
artiste = "Manufacture de Sèvres"
annee = "1756–1757"
image = "terrine-du-roi.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1949.15.jpg"
technique = "Soft-paste porcelain, green ground, painted and gilded decoration, h. 24.2 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "A footed tureen on a green ground, adorned with cupids painted in gilded cartouches: the luxury of the early years of Sèvres. It stands 24.2 cm high."
description = """
The tureen, oval and swelling, rests on four curved feet, ornamented with gilded acanthus leaves, and extends at the sides into pierced handles shaped like twisted branches. Its domed lid is surmounted by an orange-yellow fruit surrounded by green leaves, which serves as a knob. The ground is a bright, luminous green, framed by gold scrollwork. On the body, a large white cartouche shows two plump cupids, seated on clouds, playing with a garland of flowers, beside a quiver and arrows. On the lid, another cartouche presents a small trophy of attributes resting on a cloud."""
evocation = """
Cupids, flowers and clouds belong to the repertoire of the rococo, the art of grace and pleasure that triumphed in France under Louis XV, and of which François Boucher is the most famous painter. A tureen was used to present stews and soups at table; but so precious a piece was made to be admired as much as to be used. It speaks of the art of living of an elite for whom the meal was a spectacle, and of the ambition of a manufactory supported by the king and by Madame de Pompadour, which wished to surpass Meissen. The cupids playing in the sky turn a kitchen vessel into a small scene of amiable mythology."""
histoire = """
Founded at Vincennes around 1740, the manufactory moved in 1756 to Sèvres, halfway between Paris and Versailles. This tureen is among its first productions there: the letter D painted under the piece, between the two interlaced Ls of Louis XV's cipher, corresponds to the year 1756. The cartouches are associated with the painter Charles-Nicolas Dodin, a specialist in figures, who joined the manufactory in 1754 and would work there for nearly fifty years. The model bears the name "the king's tureen". The Cleveland museum bought the piece in 1949, through the John L. Severance Fund."""
facture = """
Before 1770, Sèvres did not have the kaolin needed for hard-paste porcelain: it produced a so-called soft-paste porcelain, made of a glassy frit mixed with clay, fired at a lower temperature. More fragile and harder to work, it offers in return a glaze in which the colours melt slightly, producing tones of particular softness and brilliance. The green ground is laid in an even coat, leaving white cartouches that are then painted with a fine brush, in the manner of miniatures. The gold, applied as a powder and then burnished, draws the scrollwork and picks out the reliefs of the feet and handles."""
details = [
  "The two cupids seated on the clouds, with their garland of flowers.",
  "The fruit surrounded by leaves that serves as the lid's knob.",
  "The scrolled feet, covered with gilded acanthus leaves.",
  "The pierced handles shaped like twisted branches.",
  "The gold scrollwork framing the cartouches on the green ground.",
]
themes = ["porcelain", "sèvres", "rococo", "cupids", "tableware"]
anecdote = """
Each piece of Sèvres bears a letter that gives its year: A for 1753, B for 1754, and so on. Having reached Z in 1777, the manufactory began again with doubled letters, AA, BB… Thanks to this system, Sèvres porcelains can be dated to the year."""
