[[oeuvres]]
titre = "Meiping Vase"
artiste = "Chine, fours de Longquan"
annee = "13th century"
image = "meiping-longquan.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1957.52.jpg"
technique = "Porcelaneous stoneware with celadon glaze, h. 23.5 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "A vase with a rounded shoulder, covered in a bluish-green glaze that imitates jade: the celadon of the Southern Song. It stands 23.5 cm high."
description = """
The vase rises from a narrow foot, swells into a broad, rounded shoulder, then narrows abruptly into a tiny neck, barely wider than a spout. This is the meiping form, the "plum vase". There is no painted or incised decoration: the whole surface is covered with a single thick glaze, a pale green shading into blue, milky and soft as polished stone. Wide, regular horizontal fluting girdles the body from shoulder to foot; the glaze pools in the hollows and takes on a deeper tone there. The slightly elongated silhouette stands alone, without any ornament: form and colour are enough."""
evocation = """
The potters of Longquan sought to imitate jade, the most precious stone in China, a symbol of purity and virtue for the literati. Under the Song, the cultivated elite preferred the beauty of a just form and a single colour to elaborate decoration: this taste for restraint, which has been compared to monochrome painting and to the thought of Chan Buddhism, made reserve a mark of refinement. The name meiping, given later, recalls the practice of displaying in such vases a single branch of plum blossom, the first flowering at the end of winter and the emblem of the scholar who withstands adversity; originally, however, these vases served mainly to store wine. In it one sees the ideal of an art that withdraws behind its material."""
histoire = """
The kilns of Longquan, in the hills of south-western Zhejiang, had produced green-glazed stoneware since the Northern Song period. When the Song court, driven out of Kaifeng by the Jurchen in 1127, settled in Hangzhou, in the same province, their production gained in refinement: it was in the 13th century that these thick bluish-green glazes appeared. Long tunnel kilns, built along the hillsides, fired thousands of pieces in each load, sold throughout the empire and exported by sea to Japan, Southeast Asia, the Middle East and the coast of East Africa. This vase was purchased in 1957 by the Cleveland museum, through the John L. Severance Fund, from the dealer Men-Chu Wang."""
facture = """
The vase is thrown in a pale, hard body close to porcelain, then covered with several successive layers of glaze: the Longquan potters fired the piece lightly, dipped it again, and repeated the process until the glaze was sometimes thicker than the wall itself. Fired at high temperature in an oxygen-starved kiln, the small amount of iron contained in the glaze takes on this green tint, while the bubbles and crystals left in suspension give it its milky depth. The Chinese call this tone fenqing, "powdered green"."""
details = [
  "The tiny neck, almost a simple spout, at the top of a very broad shoulder.",
  "The horizontal fluting that marks the whole height of the body.",
  "The darker streaks of glaze where it thickens in the hollows.",
  "The complete absence of painted decoration: colour alone is the ornament.",
]
themes = ["celadon", "jade", "china", "song", "monochrome"]
anecdote = """
The word "celadon" is French. It is said to come from Céladon, the shepherd in love in L'Astrée, the novel by Honoré d'Urfé published from 1607 onwards, who wore pale green ribbons: the colour of Chinese stoneware reminded 17th-century collectors of this hero."""
salle = 2
mur = "nord"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Dragon Jar"
artiste = "Chine, fours impériaux de Jingdezhen"
annee = "reign of Xuande (1426–1435)"
image = "jarre-dragon-xuande.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DT5083.jpg"
technique = "Porcelain with underglaze cobalt-blue decoration, h. 48.3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A great dragon winds around this imperial jar, which bears the mark of the Xuande emperor on its shoulder. It stands 48.3 cm high."
description = """
The jar, as wide as it is tall, has a powerful shoulder, a short neck and a narrow base. All around the body runs a blue dragon on a white ground: with open jaws and flowing mane, its scaly body unfolds in a long undulation, and its clawed feet grasp at the void. Around it float clouds with curled heads. On the shoulder, a line of small characters inscribes the reign mark of Xuande. The neck is encircled by a frieze of clouds, and the lower body by a crown of stylised lotus petals, standing like a palisade. The cobalt ranges from a deep blue, almost black in the scales, to lighter tones on the dragon's belly."""
evocation = """
In China the dragon is a beneficent creature, master of waters and rain, and has long been the emblem of the emperor, the Son of Heaven. On a piece from the imperial kilns, it asserts the power of the Ming dynasty, which drove out the Mongols in 1368 and now ruled over a prosperous empire. Its body in motion, among the clouds, speaks of the energy that links heaven and earth. Blue-and-white, produced mainly for export under the Mongols, became under the first Ming emperors a court art: Chinese connoisseurs have always ranked the porcelains of the Xuande reign among the finest ever made."""
histoire = """
Under the Ming, the city of Jingdezhen, in Jiangxi province, housed kilns under the control of the court, which supplied the palace in Beijing with tableware and ceremonial vases. Pieces were ordered in series and inspected one by one; excavations have uncovered, broken and buried, those that had been rejected. The Xuande emperor, who reigned from 1426 to 1435, was a scholar, himself a painter, attentive to the arts: it was during his reign that the inscription of the imperial mark on porcelain became systematic. It is not known when the jar left China; it was given to the Metropolitan Museum in 1937 by Robert E. Tod."""
facture = """
Jingdezhen porcelain combines two materials: kaolin, a white clay, and a ground feldspathic stone. The decoration is painted with a brush in cobalt oxide on the unfired piece, then covered with a transparent glaze: a single firing, at around 1,300 °C, fixes everything. The cobalt used at the time, imported from the Persian world, gives an intense blue, dotted with almost black spots where the pigment has concentrated: Chinese connoisseurs learned to love these accidents, the sign of pieces of this period. Large jars of this type were built in several parts thrown separately, then joined before firing."""
details = [
  "The Xuande reign mark, in small characters aligned on the shoulder.",
  "The dragon's scales, drawn one by one, in an almost black blue.",
  "The dragon's feet, claws outstretched.",
  "The crown of lotus petals at the base of the body.",
  "The frieze of clouds around the neck.",
]
themes = ["porcelain", "blue and white", "dragon", "emperor", "ming"]
anecdote = """
Chinese blue-and-white travelled the world: imitated in Iran, Turkey and Japan, then in Delft and England, it is among the most copied ceramic decorations in history. The Delft pyramid, in a neighbouring room, is one of its heirs."""
salle = 2
mur = "nord"
place = 7
largeur = 1.2

[[oeuvres]]
titre = "Vase with Peaches"
artiste = "Chine, fours impériaux de Jingdezhen"
annee = "reign of Qianlong (1736–1795)"
image = "vase-aux-peches.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1944.184.1.jpg"
technique = "Porcelain with famille rose enamel decoration, h. 51.4 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "On this large imperial vase, a peach tree in flower and fruit winds around the body: a wish for long life. It stands 51.4 cm high."
description = """
The vase has the shape known as tianqiuping, the "celestial globe vase": an almost spherical body topped by a long straight neck. On the white ground, an old gnarled peach tree rises from the base of the body and throws its branches all around the vase. Large peaches, of a deep pink fading to yellow, hang in clusters among soft green and turquoise leaves. The painter has brought together on the tree both blossoms and fruit: white and pink flowers, buds, ripe peaches. A lighter branch climbs to the neck, where it blooms once more. The trunk, grey and brown, is rendered with its knots and bark, as in a painting on silk."""
evocation = """
In China the peach is the fruit of immortality: according to legend, the Queen Mother of the West cultivates in her garden on Mount Kunlun peach trees whose fruits, ripening every three thousand years, give eternal life. A vase covered with peaches is therefore a wish for longevity, given for a birthday, for example. Vases of this type often bear nine peaches: in Chinese, jiu means "nine" and, pronounced the same, "long-lasting". In this decoration where flower and fruit stand side by side, one also reads the cycle of the seasons gathered into a single image of abundance, in the heart of the long reign of Qianlong, one of the most prosperous in Chinese history."""
histoire = """
The famille rose owes its name, given in the 19th century by the French collector Albert Jacquemart, to a pink enamel obtained from gold, which arrived in China around 1720 through Europeans, probably Jesuits in the service of the Kangxi emperor. Under Yongzheng and then Qianlong, the workshops of Jingdezhen and those of the Beijing palace mastered these enamels perfectly and produced pieces of extreme finesse for the court. This vase belonged to Elisabeth Severance Prentiss, a Cleveland philanthropist, who bequeathed it to the museum in 1944 together with its pair."""
facture = """
The famille rose enamels are painted on porcelain that has already been fired and glazed, then fixed by a second firing, at low temperature, in a small muffle kiln. Their novelty lies in the opaque white, arsenic-based, that the painter mixes with the colours: he can thus grade the tones, from deep pink to pale pink, and model the volume of the fruit. The leaves are laid in flat areas of green and turquoise, the veins and trunk outlined with a fine line. The regularity of the globe and the flawless whiteness of the ground bear witness to the mastery of the imperial kilns."""
details = [
  "The peaches, whose pink melts into pale yellow, as on a real fruit.",
  "The gnarled trunk rising from the base of the body.",
  "The flowering branch climbing along the neck.",
  "The flowers and buds alongside the ripe fruit on the same tree.",
]
themes = ["porcelain", "famille rose", "peach", "longevity", "qing"]
anecdote = """
The Qianlong emperor, a great collector, had poems he had composed himself in their honour engraved on ancient ceramics in his collections. Under his reign, imperial porcelain imitated everything: bronze, jade, wood, lacquer."""
salle = 2
mur = "sud"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "Black Raku Tea Bowl"
artiste = "Japon, céramique raku"
annee = "early 17th century"
image = "bol-raku-noir.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:MET_DP247421.jpg"
technique = "Earthenware with black raku glaze, 9.2 × 9.5 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A bowl modelled by hand, without a wheel, for the tea ceremony: the art of deliberate irregularity. It stands 9.2 cm high and is shown here greatly enlarged."
description = """
The bowl is almost cylindrical, barely wider than it is tall, with straight walls that swell slightly towards the bottom and a short foot. Its rim is not quite round: it undulates and flattens in places, and the wall retains slight facets, traces of the spatula that formed it. The whole surface is covered with a black glaze, matte and grainy, in which reddish-brown glints appear. Nothing is decorated: form, weight, material and colour are everything. The bowl is made to be held in both hands, at face height, while one drinks the whisked green tea."""
evocation = """
This bowl belongs to the world of the tea ceremony as shaped by the master Sen no Rikyū in the 16th century: an art of hospitality founded on simplicity, restraint and attention to the present moment. The taste known as wabi prefers the rustic to the sumptuous, the irregular to the perfect, the worn to the new. The black of the bowl, which sets off the bright green of the tea, invites contemplation. Its asymmetry is not clumsiness: it makes each bowl unique, and, in the Japanese tradition, a bowl may be given a name, a history, a line of owners. It has been seen as the exact opposite of smooth, perfect Chinese imperial porcelain."""
histoire = """
Raku was born in Kyoto in the 1570s–1580s, when the potter Chōjirō, who until then had made roof tiles, produced for Sen no Rikyū the first hand-formed tea bowls. According to tradition, the regent Toyotomi Hideyoshi later gave the family a seal bearing the character raku, "joy, ease", taken from the name of his palace, the Jurakudai: the word remained with the family and its ceramics. This bowl, from the Momoyama period or the very first years of the Edo period, is not attributed to any particular potter. The Metropolitan Museum acquired it in 1917, from the Rogers Fund."""
facture = """
The bowl is not thrown: it is modelled by hand from a ball of clay, then thinned and hollowed with a spatula. After a first firing, it receives several coats of a glaze made from a ground black stone, rich in iron and manganese. Firing is done piece by piece, in a small kiln heated with charcoal and fanned with bellows; when the glaze has melted, the potter removes the glowing bowl with long tongs and lets it cool abruptly in the air. This shock gives the black its deep, slightly rough appearance."""
details = [
  "The irregular rim, which undulates and flattens in places.",
  "The slight facets left by the spatula on the wall.",
  "The reddish-brown glints in the black of the glaze.",
  "The low, narrow foot, on which the bowl seems to sit set back.",
]
themes = ["tea ceremony", "wabi", "raku", "japan", "imperfection"]
anecdote = """
The Raku family of Kyoto has perpetuated this art for more than four centuries: its successive heads bear the name Raku Kichizaemon, and the present heir is the sixteenth in the line. In the West, the word also designates a rapid firing technique inspired by this tradition."""
salle = 3
mur = "nord"
place = 2
largeur = 0.7

[[oeuvres]]
titre = "Water Jar with Rain-Bird Design"
artiste = "Pueblo de Zuni"
annee = "1850–1860"
image = "jarre-zuni-oiseau-de-pluie.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1937.898.jpg"
technique = "Earthenware with white slip, painted decoration in black and red, 25.5 × 33 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "A water jar painted by a Zuni potter of New Mexico, where scrolls and hooks represent the bird that brings the rain. It is 33 cm wide."
description = """
The jar is wide and squat: a round body, a pronounced shoulder, a short straight neck. On a creamy white ground, a black design covers almost the entire surface. On the body, large stepped forms, filled with fine oblique hatching, interlock with one another; at the centre, a large circle outlined in black, extended by a hook, draws the eye. Fringes of vertical lines hang like the teeth of a comb. The neck bears another frieze, where an oval form and stepped motifs reappear. Small touches of reddish brown enliven the black. The base, coated in dark brown, has been left undecorated."""
evocation = """
In the arid lands of the American Southwest, rain is the very condition of life, and a large part of Zuni religious life is turned towards it. The "rain bird", which specialists recognise in these scrolls and hooks, associates the bird, messenger between earth and sky, with water-laden clouds; the stepped forms often evoke, in Pueblo art, terraced clouds. Painted on a jar used to carry and keep water, this decoration is both ornament and prayer. The precise meaning of each motif, transmitted within the community, is however not always known to researchers."""
histoire = """
The jar was made around 1850–1860 at Zuni Pueblo, in western New Mexico, a territory the United States had just annexed after the war with Mexico. Among the Zuni, pottery is women's work, and they pass on techniques and motifs to one another; the potter did not leave her name. From 1879, expeditions of the Smithsonian Institution carried thousands of Zuni pots off to Washington, and collectors began to seek them out. This one was given in 1937 to the Cleveland museum by Amelia Elizabeth White, a collector based in Santa Fe and a defender of Native American arts. It is not known in what circumstances it had left the pueblo."""
facture = """
The jar is built without a wheel, by coiling: the potter stacks ropes of clay, then smooths and thins the wall with a piece of gourd. She then covers it with a white slip, a fine clay diluted in water, applied in several coats. The decoration is painted with a brush cut from a chewed yucca leaf: the black is drawn from plants and minerals, the red from an ochre earth. Firing is done in the open air, the jar placed under a shelter of fuel, often sheep dung, which burns for a few hours."""
details = [
  "The large circle at the centre of the body, outlined in black and extended by a hook.",
  "The fine oblique hatching that fills the stepped forms.",
  "The fringes of vertical lines, like curtains of rain.",
  "The small red touches set among the black.",
  "The dark, undecorated base on which the jar rests.",
]
themes = ["pueblo", "rain", "bird", "water", "native american"]
anecdote = """
Zuni women carried these jars full of water on their heads, resting on a small ring woven from yucca. The base of these jars is, moreover, slightly concave, so that they sit firmly on this ring."""
salle = 3
mur = "est"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Dish with the Three Graces"
artiste = "Maestro Giorgio Andreoli"
annee = "c. 1525"
image = "plat-trois-graces.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1945.2.jpg"
technique = "Painted maiolica (tin-glazed earthenware) with metallic lustre, diam. 44.8 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "The Three Graces, nude beneath palm trees in an Italian landscape: a show dish from Gubbio, enhanced with golden glints. It is 44.8 cm in diameter."
description = """
At the centre of the dish, in a medallion, three nude young women stand entwined on a meadow: the one in the middle, seen from behind, rests her hands on the shoulders of her companions, who face the viewer and are shown in three-quarter view. They wear red necklaces and have their hair pinned up. Behind them rise three palm trees; in the distance stretch hills, a river and, on the left, a town with red roofs. On either side, two fountains pour blue water beside draperies laid on pedestals. The wide rim of the dish, the marli, bears a frieze of foliage and lozenges set in medallions, on a blue ground. Everywhere, golden and iridescent glints play across the surface."""
evocation = """
The Three Graces, daughters of Zeus in Greek mythology, personify beauty, joy and abundance; ancient authors also saw in them the benefits that one gives, receives and returns. Their group, with the central figure seen from behind, takes up a famous antique composition, rediscovered in the Renaissance and spread by engraving. On a large show dish, displayed on a sideboard rather than used at table, this secular subject speaks of the taste of the Italian courts for Antiquity and humanist culture. The lustre, which makes the piece shine in candlelight, gives plain earthenware the brilliance of a precious metal."""
histoire = """
Gubbio, a small town in Umbria then belonging to the duchy of Urbino, owes its ceramic fame to the workshop of Maestro Giorgio Andreoli, a specialist in metallic lustre. In the early 16th century, this workshop lustred its own pieces and also received others, painted elsewhere, to add these glints. The dish bore a signature and a date, recorded in the 19th century, but it was broken, and they disappeared during the repair. It belonged to the Russian collector Alexandre Basilewsky, in Paris, whose collection was bought in 1884 by Tsar Alexander III for the Hermitage in Saint Petersburg. Later leaving that museum, it passed through the New York dealer Rosenberg & Stiebel before entering the Cleveland museum in 1945."""
facture = """
Maiolica is earthenware covered with an opaque white tin glaze, on which one paints with metallic oxides: cobalt blue, copper green, antimony yellow, iron orange, manganese purple. After the firing of this decoration, the Gubbio workshop adds the lustre: a mixture of silver and copper compounds, applied with a brush to certain areas, then fixed by a further firing, at low temperature, in a thick smoke. The metals are then deposited in a very thin film that returns the light in glints of gold and ruby. This technique, which came from the Islamic world via Spain, was a jealously guarded workshop secret."""
details = [
  "The middle Grace, seen from behind, who embraces her two companions.",
  "The red necklaces at the throats of the three young women.",
  "The small town with red roofs, in the distance on the left.",
  "The two fountains whose blue water flows beside the draperies.",
  "The golden glints of the lustre on the marli and the rim of the dish.",
]
themes = ["maiolica", "mythology", "renaissance", "lustre", "beauty"]
anecdote = """
The word "maiolica" is said to come from Majorca: the lustred earthenwares of Spain reached Italy aboard ships calling at that island, and the Italians gave this name to the ceramics they admired, before applying it to their own production."""
salle = 4
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Flower Pyramid"
artiste = "Faïencerie De Metaale Pot"
annee = "c. 1692–1700"
image = "pyramide-a-fleurs-delft.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Bloempiramide,_BK-2004-4-A.jpg"
technique = "Blue-painted tin-glazed earthenware, eleven elements, h. 156 cm"
collection = "Rijksmuseum, Amsterdam"
note = "A tiered tower of blue earthenware, bristling with spouts into which cut flowers were placed: the luxury of Holland at the end of the 17th century. It stands 1.56 m high."
description = """
More than a metre and a half tall, the pyramid rises like a pagoda. It rests on a square pedestal carried by four recumbent lions. On the face of the pedestal, in an interior opening onto a garden, figures dressed in Chinese fashion converse, one of them playing a stringed instrument. Above, figures with women's busts, ending in scrolls, support a platform from which nine square tiers rise, ever smaller. Each tier is fitted at the corners with tubular spouts into which the flower stems were slipped, and painted with small scenes, figures and vases of flowers. At the summit, a woman's bust crowns the whole. Everything is painted in cobalt blue on a white ground."""
evocation = """
In the 17th century, flowers, and tulips above all, were in the United Provinces an object of passion, knowledge and speculation: during the "tulip mania" of 1636–1637, the bulb of a rare variety could sell for the price of a house. A pyramid like this one made it possible to compose a spectacular bouquet, each flower isolated in its spout, and to display at once one's wealth and one's taste. Its decoration also speaks of Europe's fascination with China, known through the porcelains brought back by the East India Company: pagoda, figures and landscapes are imagined after them, by painters who had never seen Asia."""
histoire = """
In the 17th century, Delft saw many of its old breweries, in decline, converted into earthenware factories. When the troubles at the end of the Ming disrupted the arrival of Chinese porcelain, in the middle of the century, the Delft potters took over and imitated blue-and-white. Flower pyramids were fashionable at the end of the century, particularly at the court of William III of Orange and his wife Mary II, queen of England, who filled her residences with them. This pyramid is attributed to the De Metaale Pot factory, then directed by Lambertus van Eenhoorn. It forms a pair with a second pyramid; the Rijksmuseum bought them together in 2004, with the help of several foundations and patrons."""
facture = """
Delftware is earthenware covered with a white tin glaze, which imitates the whiteness of porcelain without having its hardness or translucency. The decoration is painted in cobalt on the still-raw glaze, which drinks up the colour like paper: the painter must work quickly and without second thoughts. Each tier is shaped and fired separately, then the elements are stacked one on top of another. The hollow tiers served as water reservoirs, in which the stems were steeped. The design, in a blue shaded from the lightest to the darkest, is inspired by Chinese porcelains of the late 17th century."""
details = [
  "The woman's bust that crowns the top of the pyramid.",
  "The tubular spouts at the corners of each tier, intended for flower stems.",
  "The musician playing a stringed instrument, on the face of the pedestal.",
  "The four recumbent lions that serve as feet.",
  "The figures with women's busts and scrolls that carry the platform.",
]
themes = ["earthenware", "delft", "flowers", "tulip", "chinoiserie"]
anecdote = """
Of the many earthenware factories active in Delft in the 17th century, only one has survived to the present day: De Porceleyne Fles, founded in 1653 and known as Royal Delft, where earthenware is still painted by hand."""
