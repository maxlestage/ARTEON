[[oeuvres]]
titre = "Portland Vase"
artiste = "Josiah Wedgwood"
annee = "c. 1790"
image = "vase-portland.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1918.823.jpg"
technique = "Fine stoneware known as jasper, black, with applied white reliefs, h. 26.4 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "The copy in \"jasper\" stoneware of a famous Roman cameo-glass vase: Wedgwood's great technical challenge. It stands 26.4 cm high."
description = """
The vase has the shape of a squat amphora: an ovoid body, a narrow neck, two handles falling from the shoulders. On the black ground, white figures in relief stand out like cameos. On the left, a draped man emerges from a portico; at the centre, a young woman seated on a rock holds on her lap a serpent, or a sea monster, which rears up towards her; above, a small Cupid armed with a bow flies; on the right, a bearded man gazes at her, leaning on a rock. A tree with fine branches spreads its foliage above the scene. The foot is picked out with a thin white line."""
evocation = """
The meaning of the scene, already mysterious on the ancient vase, has never been established with certainty. The most frequent interpretations see in it the wedding of the hero Peleus and the sea nymph Thetis, future parents of Achilles, or an allegory of love and death; others have read in it an episode from the story of Augustus. For Wedgwood and his contemporaries, the essential lay elsewhere: to reproduce the most admired vase of Antiquity was to show that English industry could equal the art of the Ancients. This vase became one of the emblems of neoclassicism, that return to Antiquity which swept all of Europe at the end of the 18th century."""
histoire = """
The original vase, in cameo glass, was made in Rome around the beginning of our era. In the 17th century it belonged to the Barberini family, then to the diplomat and collector William Hamilton, who sold it to the Duchess of Portland; it keeps her name. In 1786, her son, the third Duke of Portland, lent it to Josiah Wedgwood. It took the potter nearly four years to achieve a satisfactory copy, at the price of countless trials: pieces cracked or warped, reliefs came away in the firing. The first edition, completed around 1790, comprised only a few dozen examples. This vase was given to the Cleveland museum in 1918 by Mrs. L. E. Holden. The original is preserved in the British Museum."""
facture = """
Jasper, perfected by Wedgwood around 1774–1775 after thousands of trials noted in his notebooks, is a fine, unglazed stoneware, based on barium sulphate, which can be tinted throughout: blue, green, lilac, yellow or, as here, black. The figures are moulded separately in a white paste, then applied one by one to the still-damp vase, before firing. To imitate the cameo glass of the original, in which the dark ground shows through the thinnest parts of the white glass, the reliefs were retouched by hand, thinned and chiselled, to create shadows and transparencies."""
details = [
  "The small Cupid flying above the scene, bow in hand.",
  "The seated woman holding on her lap a serpent or a sea monster.",
  "The man emerging from a portico, on the left.",
  "The white reliefs thinned to the point of letting the black ground show through.",
]
themes = ["neoclassicism", "antiquity", "jasper", "wedgwood", "cameo"]
anecdote = """
In 1845, a visitor to the British Museum smashed the ancient vase into a great many pieces. Patiently glued back together, it was restored again in 1948, then in the late 1980s. Wedgwood's copies preserve the memory of its state before the disaster."""
