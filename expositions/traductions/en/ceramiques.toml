[exposition]
ordre = 24
nom_court = "Ceramics"
mouvement = "Ceramics and Porcelain of the World"
cadre = "vitrine"
couleur = "#2f4f7f"
titre = "Ceramics and Porcelain of the World: Earth and Fire"
artiste = "Jingdezhen, Longquan, raku, Zuni, Gubbio, Delft, Meissen, Sèvres, Wedgwood…"
dates = "13th–19th century"
accroche = "Virtual exhibition · Musée national de Céramique, Sèvres"
introduction = """
Ceramics is the most universal of the arts: everywhere, people have shaped clay and hardened it in fire. The visit takes you around the world in ten pieces, from the celadon of the Song and the blue-and-white of the Ming to the famille rose enamels of the Qing, from a Japanese tea bowl to a Zuni water jar, from Italian maiolica to Delftware, and on to the porcelains of Meissen and Sèvres and Wedgwood's stoneware. The building draws its inspiration from the Musée national de Céramique at Sèvres, born of the collections assembled by Alexandre Brongniart: a vestibule opens onto a long gallery devoted to China, from which three rooms lead off, devoted to hand-modelled clay, to the tin-glazed earthenwares and to the manufactories of Europe."""
vitrine = "jarre-dragon-xuande.jpg"

[musee]
nom = "Musée national de Céramique"
ville = "Sèvres, France"
construction = "1876"
presentation = """
In 1740, a porcelain manufactory was established at the Château de Vincennes; it moved in 1756 to Sèvres, into a vast building constructed for it, and Louis XV bought it in 1759 to make it a royal manufactory. In 1800, the scholar Alexandre Brongniart took over its direction, which he would keep for nearly half a century. A mineralogist and chemist, he gathered ceramics from every country and every period in order to study clays, glazes and firings, and in 1824 he founded a museum of ceramics and glass, open to scholars and craftsmen alike. In 1876, the manufactory and its museum left their old premises for new buildings, raised on the banks of the Seine, at the entrance to the park of Saint-Cloud. The collections present the terracottas of Antiquity, the stoneware and porcelain of Asia, the earthenware of Europe and the output of Sèvres itself. Since 2010, museum and manufactory have formed a single institution, Sèvres – Cité de la céramique, where craftsmen still throw and paint porcelain by hand."""
ici = """
The ARTEON building borrows its principle from the Sèvres museum: to classify ceramics by great families, as Brongniart wished, and to show them in display cases. You enter from the south into the Brongniart vestibule, with its cream walls, then into the Gallery of China, thirty metres long and eight metres high, with walls of pale celadon green. To the north opens the room "Clay Modelled by Hand", the colour of clay, where a Japanese bowl stands beside a Zuni jar; to the west, the room of European earthenware; to the east, that of the European manufactories, from Meissen to Wedgwood."""

