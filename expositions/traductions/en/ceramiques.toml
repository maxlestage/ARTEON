[[oeuvres]]
titre = "Plate from the Swan Service"
artiste = "Johann Joachim Kändler"
annee = "1737–1741"
image = "assiette-service-aux-cygnes.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Clevelandart_1951.103.jpg"
technique = "Hard-paste porcelain with relief decoration, enamels and gilding, diam. 42 cm"
collection = "Cleveland Museum of Art, Cleveland"
note = "Two swans and a heron in relief in a shell-shaped dish, bearing the arms of Count Brühl: the most famous porcelain service of the 18th century. It is 42 cm in diameter."
description = """
The dish, with its undulating rim, is almost entirely white. Its whole hollow is sculpted in relief: broad ribs radiate from the top like those of a scallop shell. At the centre, two swans swim face to face among the reeds, on water stirred by eddies; above them, a heron takes flight, wings spread. On the marli, bouquets of flowers and small insects are painted in bright colours, and the rim is picked out with a fine gold scallop. At the top, a coat of arms surmounted by crowns and supported by two lions bears the combined arms of Count Heinrich von Brühl and his wife, born Countess Kolowrat-Krakowsky."""
evocation = """
The whole service is a hymn to water: swans, herons, shells, reeds, fish and sea deities answer one another from piece to piece. The theme is said to play on the name of the patron: in German, Brühl denotes a damp meadow, a marshy pasture. For the minister of the Elector of Saxony, this service was an instrument of prestige: great court dinners, with their hundreds of matching pieces, were a staging of power. The almost bare white of the reliefs, barely enlivened with flowers, also speaks of the pride of Meissen, the first European manufactory to master true porcelain, able to rival China and Japan."""
histoire = """
Count Heinrich von Brühl, favourite and then prime minister of Augustus III, Elector of Saxony and King of Poland, became director of the Meissen manufactory in 1733. Between 1737 and 1741 he had made for himself a dinner service of more than two thousand pieces, modelled by Johann Joachim Kändler with his collaborator Johann Friedrich Eberlein. The service remained in the Brühl family until the 20th century; since dispersed, it is shared among many museums and collections. This plate, which passed through the Brühl palace in Warsaw and through Count Szembek, a descendant of the family, was given to the Cleveland museum in 1951 by the firm of Rosenberg & Stiebel, for the museum's thirty-fifth anniversary."""
facture = """
Meissen hard-paste porcelain is made of kaolin, feldspar and quartz, fired at about 1,400 °C: it is white, hard, translucent in thin section. For a service of this scale, Kändler first sculpted an original model, from which plaster moulds were taken; the paste was pressed into them, so that each plate faithfully reproduces the relief, like a small sculpture. The reliefs remain white, to let the light play over the ripples of the water and the feathers of the birds. The flowers on the marli, painted in enamel, are inspired by the porcelains of the Far East, much sought after at the Saxon court."""
details = [
  "The two swans facing each other amid the reeds.",
  "The heron taking flight, wings open, above them.",
  "The radiating ribs of the shell sculpted into the bottom of the dish.",
  "The Brühl coat of arms, supported by two lions, at the top of the marli.",
  "The small insects painted among the flowers.",
]
themes = ["porcelain", "meissen", "swan", "water", "rococo"]
anecdote = """
The secret of hard-paste porcelain was unlocked in Saxony around 1708 by the alchemist Johann Friedrich Böttger, whom King Augustus the Strong held prisoner so that he would make gold for him. He did not find gold, but the "white gold" that made the fortune of Saxony."""
salle = 5
mur = "nord"
place = 2
