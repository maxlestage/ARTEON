[[artistes]]
nom = "Chine, fours de Longquan"
vie = "Longquan region, Zhejiang province (China), 10th–17th century"
biographie = """
Longquan is a region of wooded hills in south-western Zhejiang, rich in clay, wood and watercourses: everything potters need. Green-glazed stoneware was fired there from the Northern Song period, in the line of the Yue celadons, produced further north in the same province. Production took off in the 12th century, when the Song court, driven out of Kaifeng by the Jurchen, settled in Hangzhou: demand from the elites of the South and from maritime trade never ceased to grow. The potters built so-called "dragon" kilns along the hillsides, long brick tunnels in which thousands of pieces were fired at once. In the 13th century, they perfected the thick bluish-green glazes that made their fame. Under the Yuan and in the early Ming, Longquan still supplied the court and exported massively, from Japan to Egypt and the coasts of East Africa; then the blue-and-white of Jingdezhen gradually supplanted it. Archaeologists have identified a very large number of kiln sites in the region."""
style = """
Longquan celadon is recognised by its simple, full forms, often borrowed from ancient bronzes or ritual objects, and by its thick glaze, a soft, milky green reminiscent of jade. The decoration, when there is any, remains restrained: a few flutes, incised petals, fish moulded in relief. This taste for discreet perfection profoundly marked the ceramics of East Asia, and the Longquan celadons, preserved as treasures in Japan, were imitated as far as Europe."""

[[artistes]]
nom = "Chine, fours impériaux de Jingdezhen"
vie = "Jingdezhen, Jiangxi province (China), since the 11th century"
biographie = """
Jingdezhen, a city in north-eastern Jiangxi, owes its name to the Jingde era (1004–1007) of the Song emperor Zhenzong, who had porcelain made there for the palace. The neighbouring mountains supply kaolin and porcelain stone, the forests the wood for the kilns, and the river allows the pieces to be shipped. Under the Yuan, the potters perfected there the underglaze cobalt-blue decoration. From the beginning of the Ming dynasty, imperial kilns were established there: they worked for the court according to precise orders, under the supervision of officials. Under the Qing, the manufactory enjoyed a new golden age thanks to learned directors such as Tang Ying, in post under Yongzheng and Qianlong, who multiplied technical inventions. The city, where thousands of specialised workers laboured, also exported all over the world: it was through Jingdezhen that Europe discovered porcelain. The French Jesuit François-Xavier d'Entrecolles described its secrets in two famous letters, in 1712 and 1722. Jingdezhen remains today the Chinese capital of porcelain."""
style = """
The imperial porcelains of Jingdezhen are distinguished by the perfection of their white, fine paste and by the rigour of their decoration, often drawn from models designed at court: dragons, phoenixes, flowers and fruits bearing wishes. The cobalt blue of the Ming, then the famille verte and famille rose enamels under the Qing, fixed for the whole world the image of Chinese porcelain. Their forms and motifs were copied from Iran to Japan, and from Delft to Meissen."""

[[artistes]]
nom = "Japon, céramique raku"
vie = "Kyoto (Japan), since the late 16th century"
biographie = """
Raku ceramics were born in Kyoto in the Momoyama period, in the circle of the tea master Sen no Rikyū (1522–1591). In the service of the warlords Oda Nobunaga and then Toyotomi Hideyoshi, he led the tea ceremony towards extreme simplicity, and sought bowls that answered this ideal. He had them made by Chōjirō, a craftsman who made roof tiles and terracotta figures. Chōjirō shaped by hand, without a wheel, black or red bowls, sober and grave, fired one at a time. After his death, his workshop was handed down from generation to generation in a family that took the name Raku, according to tradition thanks to a seal given by Hideyoshi. In the 17th century, other artists appropriated the technique, such as Hon'ami Kōetsu, a calligrapher and man of letters, whose bowls are among the most admired. Tea masters give the bowls poetic names and keep them in inscribed wooden boxes, handed down with their history. The Raku family continues its work in Kyoto today."""
style = """
Raku is recognised by its light, porous clay, its irregular hand-modelled forms, and its thick black or red glazes. The bowl is conceived for the hand and for the lips as much as for the eye. This aesthetic of wabi, made of simplicity and accepted imperfection, nourished all of Japanese ceramics, and then, in the 20th century, that of Western potters, from Bernard Leach to the American ceramists who invented a "raku" of their own."""

[[artistes]]
nom = "Pueblo de Zuni"
vie = "Zuni River valley, New Mexico (United States)"
biographie = """
The Zuni, who call themselves A:shiwi, live in the valley of the Zuni River, in western New Mexico, on lands inhabited by their ancestors for centuries. Like the other Pueblo peoples, Hopi, Acoma or Laguna, they live in villages of multi-storey houses of stone and adobe, and grow corn in a dry country. In 1540, the Spanish expedition of Francisco Vásquez de Coronado, in search of the legendary "seven cities of Cibola", reached their villages. Then came the missionaries, the Pueblo Revolt of 1680 against the Spanish, and, in 1848, annexation by the United States. Despite these upheavals, the Zuni have kept their language, their ceremonies and their arts: pottery, silver and turquoise jewellery, carved fetishes. Ceramics, made by women for water, grain and ceremonies, transmit an ancient repertoire of motifs. At the end of the 19th century, scholars such as Frank Hamilton Cushing, who lived several years among them, and many collectors made this pottery known far beyond the pueblo."""
style = """
Zuni pottery is recognised by its cream-white slip, on which the potter paints in black and reddish brown all-over designs: rosettes, stepped forms, hatching, the scrolls of the "rain bird", and sometimes deer with a line linking the mouth to the heart. The jars have a wide body and a short neck. This style, still alive, is practised today by Zuni potters, women and men."""

[[artistes]]
nom = "Maestro Giorgio Andreoli"
vie = "Intra, on Lake Maggiore, c. 1465 – Gubbio, 1553"
biographie = """
Giorgio Andreoli was born around 1465 at Intra, on the shore of Lake Maggiore. He settled with his brothers in Gubbio, a small town in Umbria dependent on the Dukes of Urbino, and obtained citizenship there at the end of the 15th century. There he directed a ceramics workshop whose renown rested on one speciality: metallic lustre, that iridescent film which gives earthenware its glints of gold and ruby. His ruby red, in particular, was highly renowned. The workshop reached its peak between about 1515 and 1540: it lustred its own pieces, but also dishes painted by other workshops, notably in Urbino, which were sent to it to receive this decoration. Many pieces bear on the reverse his abbreviated signature, "M° G°", and a date, traced in lustre. His sons, including Vincenzo, known as Maestro Cencio, continued his activity. The maiolica of Gubbio, already sought after by Renaissance princes, was passionately collected in the 19th century and now figures in the greatest museums."""
style = """
Maestro Giorgio is first of all a master of lustre rather than a painter of scenes: his art consists in making the surface of the maiolica shimmer. His dishes combine the ornamental borders of the Renaissance, scrollwork, grotesques, trophies, with mythological or biblical subjects often taken from engravings, enhanced with golden and red glints. This shimmering luxury, inherited from Hispano-Moresque earthenware, made Gubbio, with Deruta, the great centre of Italian lustred maiolica."""

[[artistes]]
nom = "Faïencerie De Metaale Pot"
vie = "Delft (United Provinces), 17th–18th century"
biographie = """
The De Metaale Pot factory, "the Metal Pot", is one of the many manufactories that made Delft famous in the 17th and 18th centuries. The town, in the heart of Holland, between The Hague and Rotterdam, was then prosperous: it housed one of the chambers of the East India Company, whose ships brought back cargoes of Chinese porcelain from Asia. When the war accompanying the fall of the Ming, in the middle of the 17th century, disrupted the Chinese kilns, shipments became scarce: the Delft potters seized the opportunity and imitated blue-and-white. Many settled in former breweries, numerous in a town where beer-making was in decline. Each factory had its sign and its mark: the Porcelain Axe, the Rose, the Peacock, the Porcelain Claw, the Metal Pot. At the end of the 17th century, under the direction of Lambertus van Eenhoorn, De Metaale Pot produced pieces of great luxury, including flower pyramids, like its rival De Grieksche A of Adrianus Kocx, supplier to Queen Mary II. In the 18th century, competition from European porcelain and English creamware led to the decline of Delft."""
style = """
Delftware is recognised by its milky white glaze and its cobalt-blue decoration, sometimes polychrome, of great freedom of brush. Its painters borrow from China pagodas, figures and flowers, which they mingle with Dutch landscapes, biblical scenes and coats of arms. Its show pieces, pyramids, tulip vases, plaques, spread throughout Europe, and "Delft blue" was imitated from London to Frankfurt."""

[[artistes]]
nom = "Johann Joachim Kändler"
vie = "Fischbach (Saxony), 15 June 1706 – Meissen, 18 May 1775"
biographie = """
The son of a pastor, Johann Joachim Kändler was born in 1706 at Fischbach, near Dresden. He learned sculpture from Benjamin Thomae, court sculptor, and took part in the decoration of the palaces of Augustus the Strong, Elector of Saxony and King of Poland. Noticed by the prince, he entered the Meissen porcelain manufactory, founded some twenty years earlier, in 1731, and became its master modeller as early as 1733. Augustus the Strong first commissioned from him large animals, eagles, peacocks, monkeys, for the Japanese Palace in Dresden, a technical challenge: these pieces often cracked in the firing. Kändler understood that porcelain lent itself better to small scale: he created figurines, characters from the commedia dell'arte, shepherds, ladies in crinolines, musicians, birds, often intended to adorn the tables of feasts. For Count Brühl, he designed the swan service, the most ambitious work of his career. Over more than forty years, he modelled a considerable number of designs, and remained in the service of the manufactory until his death, at Meissen, in 1775."""
style = """
Kändler thinks as a Baroque sculptor: his figures are in motion, caught in a gesture, a twist, an exchanged glance, and his reliefs, like those of the swan service, transform everyday objects into sculptures. He established porcelain as an art in its own right in Europe, and his figurines, copied by every manufactory, from Chelsea to Nymphenburg, fixed for a long time the genre of the porcelain statuette."""

[[artistes]]
nom = "Manufacture de Sèvres"
vie = "Vincennes, c. 1740 – Sèvres, since 1756"
biographie = """
The manufactory was born around 1740 at the Château de Vincennes, where workmen from the Chantilly manufactory tried to unlock the secret of porcelain. Supported by financiers, then by Louis XV and Madame de Pompadour, it moved in 1756 to Sèvres, near the Château de Bellevue which belonged to the marquise. In 1759, the king bought it: it became a royal manufactory, and its pieces served as diplomatic gifts throughout Europe. It surrounded itself with artists: the goldsmith Jean-Claude Duplessis designed the forms, the sculptor Étienne Maurice Falconet directed the sculpture workshop, François Boucher supplied models. From 1770, it also produced hard-paste porcelain, thanks to the kaolin discovered near Limoges. The Revolution, then Napoleon, maintained the manufactory, which from 1800 was directed by the scholar Alexandre Brongniart. In the 19th and 20th centuries, it welcomed new artists and new techniques, from Art Nouveau stoneware to contemporary creations. Still in operation, it produces by hand, in its buildings of 1876, pieces commissioned by the State and works by guest artists."""
style = """
The Sèvres style of the 18th century is recognised by its intense colour grounds, sky blue, lapis blue, green, pink, framed by chased gold, and by its cartouches painted like miniatures: cupids, landscapes, birds, flowers. Its forms, often designed by Duplessis, follow the suppleness of the rococo before bending to neoclassical taste. Imitated throughout Europe, the manufactory long embodied French luxury."""

[[artistes]]
nom = "Josiah Wedgwood"
vie = "Burslem (Staffordshire), 1730 – Etruria (Staffordshire), 3 January 1795"
biographie = """
Josiah Wedgwood was born in 1730 at Burslem, in Staffordshire, into a family of potters. He began working at the age of nine, after his father's death, in the family workshop. Struck by smallpox in childhood, he was left with a diseased leg, which was amputated in 1768. No longer able to work the wheel, he devoted himself to experimentation: he noted in his notebooks thousands of trials of clay bodies and glazes. Setting up on his own in 1759, he perfected a cream-coloured fine earthenware, adopted by Queen Charlotte, who allowed him to call it "Queen's ware". In 1769, with his partner Thomas Bentley, he opened near Stoke a model manufactory named Etruria, in homage to the Etruscans, to whom Greek vases were then attributed. There he created black basalt, then jasper. A pioneer of industry, he divided labour, opened showrooms in London, published catalogues, supported the building of canals. A member of the Royal Society, he fought the slave trade and circulated a famous medallion bearing the inscription "Am I not a man and a brother?" His grandson was the naturalist Charles Darwin."""
style = """
Wedgwood knew how to combine art and industry: simple, elegant forms, reproducible in large numbers, consistent quality, and decoration entrusted to artists such as the sculptor John Flaxman. His pale blue jasper with white reliefs, inspired by ancient cameos, became the very image of English neoclassicism. His methods of manufacture and sale made him one of the fathers of modern industry."""
