[[oeuvres]]
titre = "West Wall of Room L of the Villa of Publius Fannius Synistor at Boscoreale"
artiste = "Rome, fin de la République"
annee = "c. 50–40 BC"
image = "boscoreale-salle-l.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/247008"
technique = "Fresco, 195.6 × 271.8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A heavy garland of foliage and fruit, a mask, a snake: the decoration of a Roman villa room, buried by Vesuvius in AD 79."
description = """
On a pinkish-red wall, divided by tall yellow pilasters, a thick garland \
of leaves, fruit and ears of grain runs from one edge to the other. On the left, it is \
hung from a gilded bull’s head, adorned with fillets and strings of pearls; \
pale ribbons wind around the foliage. Beneath the garland hang \
objects: a gilded mask of an old silenus, bald and bearded, staring at the \
viewer; a wicker basket from which a snake rears up, in front of a dark \
disc; on the right, a small bronze bell-shaped object. Above, a \
leafy cornice supports a band of green and yellow panels, then a purple frieze \
sprinkled with fine green stems and a second cornice, sculpted in trompe l’œil."""
evocation = """
Everything here speaks of Dionysus, god of wine and theatre, whose festivals \
brought together songs, dances and masks. The silenus is one of his companions; the \
basket with the snake recalls the mystic cista, the sacred basket of his mysteries; \
the disc and the bell probably evoke the tambourine and cymbals that \
set the rhythm of his processions. The bull’s head adorned with fillets is that of a \
sacrificial victim. The garland laden with fruit of every season speaks of the \
abundance of the countryside. For the wealthy owner, this decoration turned a \
room of his villa into a sanctuary in festival dress, like the real garlands \
that were hung on the walls on days of celebration."""
histoire = """
The villa of Publius Fannius Synistor stood at Boscoreale, on the slopes of Vesuvius, a few kilometres north \
of Pompeii. Its walls were painted around 50–40 BC, then the house was \
buried by the eruption of AD 79. Uncovered in 1900, it was stripped of its \
frescoes, cut into panels and sold at auction in Paris in 1903. The \
Metropolitan Museum then acquired an important group, including this wall of the \
room that archaeologists designate by the letter L, and an entire chamber, \
reassembled in its galleries. The villa’s other panels are now scattered \
among several museums, in Italy and across Europe."""
facture = """
It is a fresco: the colours, diluted in water, are laid on a still-damp lime \
plaster, into which they are incorporated as it dries. The decoration belongs to the \
Second Pompeian Style, which imitates architecture in relief: the cornices, \
pilasters and panels of coloured marble are painted in trompe l’œil, with their \
shadows and highlights. Upon this rigorous framework, the painter flings a garland \
treated in rapid, almost Impressionist touches, where each leaf is laid on \
with a single stroke of the brush. The pale areas, at upper left and at the bottom, are \
gaps filled in during restoration."""
details = [
  "The gilded silenus mask, with its bald forehead and curly beard.",
  "The snake emerging from the wicker basket and stretching its head to the left.",
  "The bull’s head adorned with strings of pearls, from which the garland hangs.",
  "The small bronze bell hanging on the right, against the red background.",
  "The leafy cornice, painted in trompe l’œil above the pilasters.",
]
themes = ["fresco", "dionysus", "garland", "trompe l’œil", "pompeii"]
anecdote = """
The houses of the Vesuvius region were not painted only inside: on the \
façades of Pompeii, specialist painters traced in large red letters \
calls to vote for this or that candidate, and passers-by scratched messages, \
drawings and insults into them."""
salle = 2
mur = "nord"
place = 5
largeur = 2.75

[[oeuvres]]
titre = "Perseus and Andromeda in a Landscape"
artiste = "Rome impériale"
annee = "last decade of the 1st century BC"
image = "persee-andromede.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/250945"
technique = "Fresco, 159.4 × 118.8 cm"
collection = "Metropolitan Museum of Art, New York"
note = "The hero Perseus flies to the rescue of Andromeda, chained to a rock: a legend painted on the wall of an imperial villa."
description = """
Within a large black frame ending in a point, like a pediment, opens a \
seascape bathed in blue-green light. At the centre rises a tall purplish rock; \
halfway up, a young woman dressed in yellow, arms outstretched, is chained to it: \
this is Andromeda. On the left, Perseus arrives flying, naked beneath a red cloak \
that flutters in the wind, his weapon raised. At lower left, the sea monster rises from \
the water, its head bristling with crests. On the right, before a palace with columns, we \
find Perseus again, shaking the hand of a king in a long robe. At lower right, a \
draped woman sits on a rock. In the background, trees and buildings fade \
into the mist."""
evocation = """
The myth is told by Greek and Latin poets, and by Ovid in the \
Metamorphoses. Queen Cassiopeia having boasted of being more beautiful than the \
Nereids, the gods send a monster to ravage the kingdom; to appease it, King \
Cepheus must surrender his daughter Andromeda. Perseus, returning from slaying the Gorgon \
Medusa, sees her, kills the monster and marries her. The painter gathers several moments \
in a single image: the hero’s arrival, the maiden offered up, the monster, then the \
agreement reached with Cepheus. Lost in the immensity of the landscape, the figures \
seem tiny: the legend becomes a reverie, a view of a shoreline over which the \
gaze wanders."""
histoire = """
The painting adorned a room of the imperial villa at Boscotrecase, at the foot of \
Vesuvius, which probably belonged to Agrippa, friend and son-in-law of the emperor Augustus, \
then to his son Agrippa Postumus. It was a pendant to another mythological \
landscape, Polyphemus and Galatea, also kept in the Metropolitan Museum. The \
villa, buried by the eruption of AD 79, was discovered in the early twentieth century during \
work on a railway line; its frescoes were then detached from the \
walls, and the site disappeared again soon after beneath the ashes of an eruption of \
Vesuvius. The Metropolitan Museum acquired several of its paintings in 1920."""
facture = """
The picture belongs to the Third Pompeian Style, which appeared under Augustus: the wall no longer \
opens onto trompe-l’œil architecture, it becomes a flat surface, \
often dark, at the centre of which a painting is placed like a hung \
picture. The landscape is almost monochrome, treated in light touches of blue and \
green; the distances fade into mist, which gives an impression of \
depth. The figures are set down in a few strokes of the brush, with pale \
highlights. This taste for sacred and mythological landscapes, very fashionable in the age \
of Augustus, came from Hellenistic painting."""
details = [
  "Andromeda, arms outstretched, chained halfway up the rock.",
  "Perseus in flight, on the left, his red cloak billowing in the wind.",
  "The white crests of the sea monster, at lower left.",
  "On the right, Perseus shaking the hand of King Cepheus before the palace.",
  "The draped woman seated on a rock, at lower right.",
]
themes = ["mythology", "landscape", "hero", "sea", "fresco"]
anecdote = """
To approach Medusa, whose gaze turned men to stone, Perseus had received from the \
gods winged sandals and a shield polished like a mirror: he looked at the \
monster only in its reflection."""
salle = 2
mur = "sud"
place = 2
largeur = 1.25

[[oeuvres]]
titre = "Griffin on an Entablature"
artiste = "Rome impériale"
annee = "1st century AD"
image = "griffon-pompei.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1981.20"
technique = "Fresco fragment"
collection = "Cleveland Museum of Art, Cleveland"
note = "A fragment of a Pompeii wall: a winged griffin stands guard on a painted cornice against a white ground."
description = """
Against a creamy white ground, crossed by fine cracks, a griffin stands upright, in \
profile, facing left. It has the body and paws of a lion, painted in bluish \
grey, the head and beak of a bird of prey, and two raised wings, one grey, the \
other ochre and pink; its slender tail falls behind it. It stands on the edge \
of a gilded entablature, painted like a wooden or stone moulding, beneath which \
runs a pink and purple frieze decorated with small motifs. On the left, a red \
stem ending in scrolls advances towards it, like a branch of a candelabrum or \
scrollwork. The irregular edges of the fragment reveal the thickness of the plaster."""
evocation = """
A fabulous animal from the East, the griffin unites the strength of the lion, king of \
beasts, with the keen sight of the eagle, king of birds. The Greeks and then the Romans \
made it a guardian: it watches over treasures and tombs, and accompanies \
Apollo or the goddess Nemesis. Painted on a house wall, it protects and amuses at \
once. Standing on a cornice suspended in empty space, it belongs to those \
fantasy architectures, light and impossible, that the painters of Pompeii \
liked to float against pale grounds. One imagines, beyond the fragment, an entire \
wall peopled with slender columns, candelabra, birds and small creatures."""
histoire = """
The museum’s record links this fragment to Pompeii, without specifying the house it \
came from. Buried in AD 79 beneath the ashes of Vesuvius, the city has been excavated since the \
eighteenth century. For a long time, the pieces of painting judged most beautiful were cut from the walls, \
for the collections of the King of Naples and then for \
those of collectors around the world; many isolated fragments, like this one, \
thus lost their context. The Cleveland Museum of Art acquired it in 1981. It \
bears witness to a common domestic painting, made by workshops that decorated \
the houses of a prosperous city in series."""
facture = """
The plain white ground lets the motifs breathe, which is frequent in the decorations \
of the 1st century AD. The griffin is painted with a rapid, almost \
sketched hand: a few touches of grey, ochre and pink suffice to model the \
body, feathers and mane. The entablature, by contrast, is built with \
care, in parallel bands of yellow, ochre and brown that imitate the relief of a \
moulding lit from above. The red stem, drawn with a supple line, shows \
the ease with which painters traced ornaments without a model. The fragment has been remounted \
on a modern support."""
details = [
  "The griffin’s open beak and round eye.",
  "The two raised wings, one grey, the other ochre and pink.",
  "The lion’s paws resting on the gilded edge of the cornice.",
  "The red scrolled stem advancing from the left.",
  "The network of cracks running across the white ground.",
]
themes = ["griffin", "fabulous animal", "pompeii", "decoration", "fresco"]
anecdote = """
The word graffiti was born at Pompeii: it is what nineteenth-century Italian archaeologists \
called the thousands of inscriptions scratched into the plaster of the city’s walls, \
from the verb graffiare, “to scratch”."""
salle = 2
mur = "sud"
place = 8
largeur = 1.3

[[oeuvres]]
titre = "Mural Fragment: Maguey Autosacrifice Rite"
artiste = "Teotihuacan"
annee = "AD 500–600"
image = "teotihuacan-maguey.jpg"
credit = "Photo : Art Institute of Chicago"
licence = "CC0"
source = "https://www.artic.edu/artworks/14968"
technique = "Lime plaster and mineral pigments, 63.8 × 95 cm"
collection = "Art Institute of Chicago, Chicago"
note = "A priest in splendid regalia advances, praying for rain. Enlarged photograph: the fragment measures 64 × 95 cm."
description = """
Against a dark red ground, a richly dressed man advances in profile towards the \
left. He wears an immense headdress, made of long feathers that spread \
out behind his head, a necklace of large round beads and, at the waist, a circular \
ornament. In front of his face unfurls a large scroll decorated with shells and \
plants: it is his speech, his prayer, made visible. To left and right \
rise triangular forms ending in dark points: leaves \
of maguey, a kind of agave, planted in striped objects. At the top, a band of \
chevrons runs along the edge. The figures are drawn in pale pink and darker \
red on the red ground."""
evocation = """
According to the museum, the man is a rain priest, and the scroll issuing from his \
mouth, decorated with shells and plants, indicates that he prays for water and for \
the prosperity of the harvests, so precious on this dry high plateau. Maguey \
thorns were used to pierce the skin and offer one’s blood to the gods, a rite widespread \
in ancient Mexico: hence the title given to the fragment. Repeated along a wall, \
this figure formed an endless procession, accompanying those who passed \
through the room. The image tells no story: it fixes on the wall a perpetual \
prayer, like an inscription."""
histoire = """
Teotihuacan, north-east of present-day Mexico City, was between AD 200 and 650 the \
largest city in the Americas, with a population of over a hundred thousand; the \
Aztecs, who discovered its ruins centuries later, called it “the place \
of the gods”. Its pyramids, temples, palaces and houses were covered \
with paintings. This fragment belonged to a cycle painted on the interior walls of an \
aristocratic palace, the Tlacuilapaxco residential compound. Like many \
paintings from Teotihuacan, it was detached from its wall before entering a museum. \
The Cleveland fragment, shown opposite, depicts an almost identical figure, \
which is thought to come from the same compound."""
facture = """
The painters of Teotihuacan worked on a fine, smoothed lime plaster, \
which they burnished after applying the colours to give it a slight sheen. \
Their palette rests on mineral pigments, foremost among them an iron-oxide red, \
hematite, in several tones. The drawing is first traced in outline, then filled with \
flat colour; there is neither shadow nor perspective. The figures, stylised and codified, \
repeat almost identically, as if transferred from a model. This manner recalls a \
textile pattern or a stencil, and gives the wall the unity of a tapestry."""
details = [
  "The headdress of long feathers fanning out behind the head.",
  "The speech scroll, decorated with shells, in front of the face.",
  "The necklace of large round beads and the circular ornament at the belt.",
  "The maguey leaves with dark points, left and right.",
  "The band of chevrons running along the upper edge.",
]
themes = ["procession", "prayer", "rain", "ancient mexico", "red"]
anecdote = """
The maguey sustained ancient Mexico in many ways: its fibres provided \
thread and paper, its thorns needles, and its fermented sap pulque, a \
ritual drink far older than tequila."""
salle = 3
mur = "ouest"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "Mural Fragment: Dignitary and Maguey Leaves"
artiste = "Teotihuacan"
annee = "AD 500–550"
image = "tlacuilapaxco.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1963.252"
technique = "Fresco on wall fragment"
collection = "Cleveland Museum of Art, Cleveland"
note = "A dignitary in ceremonial dress sings and pours an offering: he belonged to a line of identical figures that paraded around a patio."
description = """
In a frame bordered with chevrons, against a dark red ground, a man in grand \
costume advances in profile towards the left. His small face almost disappears beneath \
a monumental headdress: a stylised animal head, with a round eye, from which a \
plume of long feathers springs. He wears a necklace of round beads, a large \
circular ornament at the waist, a belt and tied sandals. In front of him unfurls a \
large decorated scroll; from his outstretched hand pours a stream of offerings. On each side \
rise maguey leaves, triangular, bristling with points. Above the \
frame, a wider frieze shows an undulating ribbon sprinkled with dots, between \
star-shaped motifs."""
evocation = """
The museum sees in it a man of the elite who sings or prays, his speech materialised by \
the scroll, and who pours with one hand a libation filled with flowers, while \
the other holds a bag of incense. The maguey thorns, in front of and behind him, \
may evoke the blood offered to the gods and pulque, the ritual drink made from \
the sap of the plant. The figure has no name: he embodies a function, a \
rank, a sacred gesture. Repeated identically all around a patio, he formed an \
immobile procession, which told visitors of the piety and wealth of the family \
who lived there."""
histoire = """
According to the Cleveland Museum of Art, this figure was part of a row of \
identical figures that paraded along the walls of a patio, in one of the wealthy \
residential compounds of Teotihuacan, probably that of Tlacuilapaxco. These \
large compounds, surrounded by high blank walls, housed several families \
around interior courtyards, and their walls were often covered with paintings. \
Like many paintings from the city, this fragment was detached from its wall in the \
twentieth century, under poorly known circumstances; the museum acquired it in 1963. It is \
a pendant to the Chicago fragment shown opposite, almost identical."""
facture = """
Like all Teotihuacan painting, the image is built in a camaïeu of reds, \
from pale pink to brown, on a hematite ground. The drawing, of great precision, \
details each feather of the headdress, each bead of the necklace, each maguey thorn, \
without ever seeking relief. The painter organises the surface like a textile: \
bands of chevrons, a frieze of repeated motifs, then the main register, set to a rhythm by \
the pointed leaves. The cracks and gaps, visible on the right, show \
that the painted layer, very thin, suffered during removal. The fragment is \
now fixed on a modern support."""
details = [
  "The dignitary’s small face, almost hidden beneath the headdress.",
  "The round eye of the animal head forming the top of the headdress.",
  "The stream of offerings falling from the outstretched hand.",
  "The maguey leaves bristling with points, left and right.",
  "The dotted ribbon undulating in the upper frieze.",
]
themes = ["procession", "offering", "costume", "ancient mexico", "repetition"]
anecdote = """
The Aztecs, arriving centuries after the city was abandoned, visited its \
ruins as a sacred place: according to their myths, it was at Teotihuacan that the gods, \
by throwing themselves into a blaze, gave birth to the sun and the moon."""
salle = 3
mur = "est"
place = 2
largeur = 2.8

[[oeuvres]]
titre = "The Bill-Poster (Afficheur)"
artiste = "Carle Vernet"
annee = "c. 1820"
image = "colleur-d-affiches.jpg"
credit = "Photo : Cleveland Museum of Art"
licence = "CC0"
source = "https://clevelandart.org/art/1966.352"
technique = "Hand-coloured lithograph"
collection = "Cleveland Museum of Art, Cleveland"
note = "Perched on his ladder, a bill-poster pastes theatre programmes onto a Paris wall. Print shown enlarged."
description = """
Against the corner of a stone wall, a man climbing a wooden ladder pastes up a \
poster. Seen in profile, he wears a dented top hat, a blue jacket, \
brown trousers and, tucked into his belt, a striped rag. With one hand he \
presses the sheet flat, with the other he smooths it with a large brush. The wall is already \
covered with coloured posters, blue, pink, yellow, overlapping: one can \
make out “Théâtre royal de l’Opéra-Comique”, the title “Raoul, sire de C…” and \
other theatre names. At the foot of the ladder wait the paste bucket and \
a stone post. Beneath the image one reads “Afficheur”, Carle Vernet’s signature and \
the name of the printer Delpech; at upper right, “N° 84”."""
evocation = """
Carle Vernet observes a street trade with a reporter’s curiosity. \
The bill-poster is the direct ancestor of today’s paste-up artists and graffiti writers: \
it is he who makes the city wall a support for images and words, renewed \
every day. The sheets pasted one over another announce the evening’s shows \
and turn the street corner into a public newspaper, which everyone reads in \
passing. Vernet makes him a picturesque figure, in worn clothes but with a \
confident, almost elegant pose, like a painter before his canvas. The scene, without \
caricature, preserves the memory of a gesture that would be repeated millions of times \
in nineteenth-century Paris."""
histoire = """
The plate is part of a series of Cris de Paris, those images of the little trades \
of the street, itinerant vendors, water carriers or knife grinders, which artists and \
publishers had been issuing since the sixteenth century. Carle Vernet drew a long series \
from life, numbered and published in the early 1820s by François-Séraphin Delpech, \
one of the first great lithographic printers in Paris. Lithography, \
invented in Bavaria at the end of the eighteenth century, had just arrived in France, and \
Vernet was one of the first painters to adopt it. Impressions were sold in \
black or, at a higher price, hand-coloured, like this one. The Cleveland Museum of Art \
acquired it in 1966."""
facture = """
Lithography allows one to draw directly on the stone with a greasy crayon, \
then to print the drawing without engraving. Vernet draws from it a supple line, \
velvety blacks and nuanced greys, visible in the stones of the wall and \
the man’s cast shadow. The colours, applied afterwards in watercolour, are reserved \
for the posters and the clothing: they stand out against a setting left almost \
in black and white. The figure, isolated at the centre of the sheet, with no background, \
resembles a catalogue plate, which suits a series of Parisian \
types."""
details = [
  "The paste brush the bill-poster holds in his right hand.",
  "The title “Raoul, sire de C…” on the blue Opéra-Comique poster.",
  "The paste bucket set at the foot of the ladder.",
  "The striped rag tucked into his belt.",
  "The number “N° 84”, at upper right, which places the plate in the series.",
]
themes = ["poster", "trade", "paris", "street", "lithograph"]
anecdote = """
Since the Revolution, white paper had been reserved for the official posters of the \
authorities: announcements by private individuals and theatres had to be printed \
on coloured paper. That is why Carle Vernet’s wall is blue, pink and \
yellow."""
salle = 4
mur = "ouest"
place = 2
largeur = 1.2

