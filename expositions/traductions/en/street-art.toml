note = "A dancer in a yellow tutu whirls beneath a giant title: the ballet poster according to Chéret, made to be seen from afar, in the street."
description = """
At the top, in black capitals, “Eden-Théâtre”; below, in enormous red letters \
shaded with white, “Viviane”. At the centre, a young blonde dancer, in a pale \
yellow tutu, spins on one point, one arm raised above her head, her skirt lifted by \
the movement. Behind her, a figure in a black costume, with curly hair, \
seems to dance with her; on the right, a crowned woman, in a long golden gown, \
advances. At lower left, in an orange-red triangle, small horsemen in \
armour gallop. At the bottom, in red, the text announces a “ballet in 5 acts and 9 \
tableaux” by Edmond Gondinet, with music by Raoul Pugno and Clément Lippacher. \
Chéret’s signature is on the right."""
evocation = """
Viviane is the fairy of the King Arthur legends, the Lady of the Lake who enchanted \
the enchanter Merlin: the knights in the red corner and the crowned lady refer to \
this world of chivalric romance. But Chéret does not seek to tell the ballet’s story. \
He gives its momentum, its light, its promise of pleasure: a laughing young woman in \
full motion, who seems to step out of the poster. This type of figure, gay, light, \
forever dancing, became his trademark, so much so that his heroines would be called “\
chérettes”. On the grey walls of Paris, the poster brought a burst of \
colour and festivity that passers-by had never seen in the street."""
histoire = """
The Eden-Théâtre, a large theatre opened in 1883 near the Opéra, was \
famous for its spectacular ballets, with sumptuous sets and hundreds of \
extras. Viviane was created there in 1886. Chéret, who was then directing the poster studio \
of the Chaix printing house, designed the announcement: in the left margin one reads “Imprimerie \
Chaix (succursale Chéret), 18, rue Brunel”. The music publisher Heugel, whose \
address appears at the bottom, published the score. Posted by the hundreds on \
walls, columns and hoardings, these posters were meant to last \
a few weeks; this one escaped paste and rain, and the Cleveland \
Museum of Art acquired it in 1972."""
facture = """
Chéret prints his posters in lithography, with one stone per colour: here, the \
black of the drawing, the red, the yellow and the blue, which overlap to give \
other shades. He lays in the grounds with gradients and spatter, fine \
sprays of ink that give a vibrant grain, visible in the sky and around \
the dancer. The drawing, nervous, leaves the contours open, like a sketch. \
The lettering is not stuck onto the image: it is part of the composition, and \
the great red title, in perspective, can be read from dozens of metres away. The orange \
triangle, on the diagonal, energises the whole sheet."""
details = [
  "The great title “Viviane” in red letters shaded with white.",
  "The dancer’s yellow tutu, lifted by the pirouette.",
  "The little knights galloping in the red triangle, at lower left.",
  "The crowned lady, in a long golden gown, on the right.",
  "In the left margin, the address of the Chaix printing house.",
]
themes = ["poster", "dance", "theatre", "colour", "arthurian legend"]
anecdote = """
In the 1890s, Chéret’s posters became so sought after that \
collectors peeled them off walls, or paid bill-posters to obtain \
copies: people spoke of “affichomanie”. Street-art works suffer \
the same fate today."""
salle = 4
mur = "est"
place = 2
largeur = 1.4

[[oeuvres]]
titre = "The Medicine Buddha Bhaishajyaguru (Yaoshi fo)"
artiste = "Chine, dynastie Yuan"
annee = "c. 1319"
image = "bouddha-de-medecine.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/42716"
technique = "Water-based pigments on clay plaster mixed with straw, 7.52 × 15.11 m"
collection = "Metropolitan Museum of Art, New York"
note = "A mural of more than fifteen metres, from a monastery in Shanxi: the healing Buddha, surrounded by his celestial court."
description = """
At the centre of this immense wall, taller than its two wings, the Medicine Buddha \
sits facing us, dressed in a red robe, before a large pale nimbus; one hand \
raised, the other resting on his knee, he looks straight ahead. On either side \
sit two great crowned bodhisattvas, also haloed, surrounded by \
standing figures with joined hands or bearing offerings. At the sides \
stand armoured guardians, armed, with sometimes menacing faces. At the top, \
celestial beings float on blue and green clouds. At the bottom, three large pale \
discs and small figures occupy the foreground. The colours, \
muted by time, blend green, red, ochre and white."""
evocation = """
Bhaishajyaguru, Yaoshi fo in Chinese, is the Medicine Buddha: he vowed \
to heal the illnesses of body and mind, and reigns over a pure land \
of the East, made of lapis lazuli. The two bodhisattvas who flank him are \
traditionally those of sunlight and moonlight, and the \
armoured guardians are the celestial generals who protect his devotees. Placed \
in the hall of a monastery, the image greeted monks and visitors like \
an apparition: a celestial court, ordered and serene, filling the whole field \
of vision. Before it, people came to pray for health and long life."""
histoire = """
The painting was made around 1319 for the Lower Guangsheng Monastery, at \
Hongtong, in Shanxi province, in northern China, under the Mongol \
Yuan dynasty. In the early twentieth century, the monastery’s murals were sold: \
this one was cut into panels to be transported, then reassembled. The \
collector Arthur M. Sackler gave it to the Metropolitan Museum in 1965; it has \
since occupied an entire wall of a gallery devoted to Chinese art. Another great \
painting from the same monastery is kept at the Nelson-Atkins Museum of Art in Kansas \
City. Like many street-art murals cut out and sold, it left the \
place for which it was made."""
facture = """
The painting is not a fresco in the strict sense: the colours, bound with water, were \
laid on a dry plaster, made of clay mixed with straw to hold better on the wall. \
Such a decoration was the work of a workshop of professional painters, who \
worked from models and pounce patterns, and shared the labour. The \
drawing, in ink, is extremely supple in the drapery and the floating scarves; \
the mineral colours, greens, reds, ochres and whites, then fill \
the forms. The composition, strictly symmetrical and hierarchical, places the \
principal figures at the centre and makes them larger than the others."""
details = [
  "The large pale nimbus behind the Buddha’s head.",
  "The Buddha’s red robe, the only patch of bright colour at the centre.",
  "The elaborate crowns of the two seated bodhisattvas.",
  "The armoured guardians, on the left and right wings.",
  "The celestial beings floating on clouds, at the very top.",
]
themes = ["buddhism", "healing", "monastery", "china", "monumental"]
anecdote = """
The Medicine Buddha is also venerated in Japan under the name Yakushi: the \
Yakushi-ji, one of the great temples of Nara, is dedicated to him and bears his name."""
salle = 5
mur = "nord"
place = 3
largeur = 15.6

[[oeuvres]]
titre = "Lion from the Monastery of San Pedro de Arlanza"
artiste = "Espagne, art roman"
annee = "after 1200"
image = "lion-arlanza.jpg"
credit = "Photo : Metropolitan Museum of Art"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/471061"
technique = "Fresco transferred to canvas, in two panels, 332.7 × 335.3 cm"
collection = "Metropolitan Museum of Art, New York"
note = "A grimacing lion, larger than life, painted on the wall of a Castilian monastery: one of the fabulous animals of Romanesque art."
description = """
Against a ground divided into ochre and blue-grey bands, an immense lion advances to the \
left, in profile, but turns its head towards us full face. Its big round eyes \
stare at us beneath furrowed brows, and its mouth shows two rows of teeth. Its \
mane is made of flame-shaped locks; its pink body is crossed by supple \
lines that delineate the muscles. Its long tail forms a loop \
above its back and ends in a leaf-shaped tuft. On the left \
rises a stylised tree with scaly leaves; on the right, an arcade with two \
columns opens onto a dark ground. Below, a frieze of red and \
white scrollwork is partly effaced."""
evocation = """
In Romanesque art, the lion is an image with a double meaning: a symbol of strength and \
vigilance, it can represent the risen Christ or the guardian of the holy place, but \
also the threat of evil. Painted larger than life on a monastery wall, this \
staring lion watches those who pass. Its bearing, at once fierce and \
comic, shows that the painters knew the animal mostly from images, \
textiles, ivories or manuscripts, rather than from life. The tree and the arcade \
evoke a garden or a palace. These great animals were part of a decoration of \
real and fabulous beasts, dragons and other creatures, that peopled the walls."""
histoire = """
The lion comes from the Benedictine monastery of San Pedro de Arlanza, near Burgos, in \
Castile, linked to the memory of Count Fernán González, founding hero of Castile, \
who was buried there. It was painted after 1200 in one of the monastery’s halls. \
Abandoned in the nineteenth century, after the suppression of religious orders in Spain, the \
monastery fell into ruin; in the early twentieth century, its paintings were detached from the \
walls and sold. Part of them is now in the National Art Museum of \
Catalonia, in Barcelona; the lion crossed the Atlantic to join the \
medieval collections of the Metropolitan Museum in New York."""
facture = """
The painting was probably detached from the wall by the strappo technique: a canvas coated with strong glue is stuck onto the \
painted surface, then torn off, taking away the \
thin layer of colour, which is then transferred to a new support. That is \
why the work is now a fresco on canvas. The Romanesque painter works \
in large flat areas, outlined with a sure, rhythmic red-brown line; the hair, \
muscles and claws become ornamental motifs. The colour bands of the \
ground, with no landscape or depth, and the zigzag border, on the left, recall the \
patterns of precious textiles, notably those of Muslim Spain."""
details = [
  "The lion’s big round eyes and furrowed brows, turned towards us.",
  "The two rows of teeth in the grimacing mouth.",
  "The looped tail, ending in a leaf-shaped tuft.",
  "The tree with scaly leaves, on the left.",
  "The arcade with two columns, on the right, against a dark ground.",
]
themes = ["lion", "romanesque art", "monastery", "animal", "castile"]
anecdote = """
The fate of the Arlanza paintings is nothing exceptional: even today, \
street-art works, some by Banksy, are cut out with their wall to \
be sold at auction, often against their creators’ wishes."""
salle = 5
mur = "nord"
place = 7
largeur = 3.6

[[artistes]]
nom = "Rome, fin de la République"
vie = "Roman Italy, 2nd–1st century BC"
biographie = """
In the 2nd and 1st centuries BC, Rome, mistress of Italy, conquered \
Greece and the Hellenistic East. Greek works of art and artists poured in, and \
the Roman aristocracy embraced Greek culture with passion. Wealthy families \
had luxurious country and seaside villas built in the Bay of Naples and around Vesuvius, \
to which they withdrew far from the affairs of Rome. \
Boscoreale, Oplontis, Pompeii and Herculaneum have preserved many examples. \
Their walls are entirely painted by teams of anonymous craftsmen, who \
work from Greek models and pass on their skills. \
The eruption of Vesuvius in AD 79 froze these decorations beneath the ash, \
and they were rediscovered from the eighteenth century onwards."""
style = """
The wall painting of this period belongs to the Second Pompeian Style: the wall is no longer \
content to imitate slabs of marble, it opens in trompe l’œil onto \
colonnades, cornices, gardens or large figures. The colours are \
intense, red dominates, and the modelling by light comes from Greek \
painting. These frescoes are almost all that remains to us of the great painting \
of antiquity."""

[[artistes]]
nom = "Rome impériale"
vie = "Rome and the Roman Empire, late 1st century BC – 1st century AD"
biographie = """
In 27 BC, Octavian received the name Augustus and became the first Roman \
emperor. The peace he established fostered an unprecedented surge in \
building: in Rome, temples and forums; in Campania, villas of the imperial family \
and houses of notables. Painters, organised in workshops, decorated the \
walls room by room, with specialists for the grounds, ornaments and \
figures. Taste changed several times in a century: after the trompe-l’œil \
architecture of the late Republic came more sober walls, then, under \
Nero and his successors, teeming decorations. At Pompeii, badly hit by an \
earthquake in AD 62, many houses were being redecorated \
when the eruption of 79 buried them."""
style = """
Under Augustus, the Third Pompeian Style closes the wall again: large plain grounds, \
black, red or white, thin purely decorative architecture, and at the centre \
a picture of myth or landscape. The Fourth Style, in the 1st century AD, \
reintroduces depth in fantasy architecture, light and \
impossible, peopled with figures, animals and fabulous creatures."""

[[artistes]]
nom = "Teotihuacan"
vie = "Central highlands of Mexico, c. 1st century BC – 7th century AD"
biographie = """
Teotihuacan rises in a valley north-east of present-day Mexico City. A modest \
settlement in the 1st century BC, it became in a few centuries a metropolis \
laid out on a regular plan, around a great avenue lined by the \
Pyramid of the Sun and the Pyramid of the Moon. Between AD 200 and 650, it was the largest \
city in the Americas, with over a hundred thousand inhabitants, a religious, \
military and commercial centre whose influence extended as far as the Maya region. Its inhabitants \
lived in vast residential compounds, with walls covered in paintings. We \
do not know the language they spoke or the name they gave their city. Around the \
6th or 7th century, the centre was burned and the city declined; the Aztecs, \
who revered its ruins, called it Teotihuacan, “the place of the gods”."""
style = """
Teotihuacan painting is one of the great mural traditions of the ancient world. \
It rests on a smoothed lime plaster and on a palette of mineral pigments, in which \
red dominates. The figures, gods, priests, animals, plants, are seen in profile, \
stylised and repeated in processions or patterns, without perspective or shadow, in \
an order reminiscent of writing and textile."""

[[artistes]]
nom = "Carle Vernet"
vie = "Bordeaux, 14 August 1758 – Paris, 17 November 1836"
biographie = """
Antoine Charles Horace Vernet, known as Carle Vernet, was the son of Claude Joseph \
Vernet, a celebrated marine painter, and the father of Horace Vernet, future painter of \
battles: three generations of painters in a century. Trained by his father \
and the painter Lépicié, he won the Prix de Rome in 1782. During the \
Revolution, he lost his sister, guillotined in 1794. He made his name with his \
horses, which he drew and painted with rare knowledge, his hunting and \
racing scenes, and his caricatures of the Incroyables and Merveilleuses, the young \
dandies of the Directory. Under the Empire, he painted Napoleon’s campaigns. From \
the 1810s, he took up lithography, newly arrived in France, and \
produced numerous plates of horses, soldiers and Parisian types, including a \
series of Cris de Paris."""
style = """
Carle Vernet is a lively and precise observer, more at ease in drawing and \
printmaking than in grand history painting. His horses, slender and nervous, \
made his reputation; his street scenes, caught from life, combine \
documentary exactness and light humour. He is among the artists who made \
lithography a popular art in the early nineteenth century."""

[[artistes]]
nom = "Jules Chéret"
vie = "Paris, 31 May 1836 – Nice, 23 September 1932"
biographie = """
The son of a typesetter, Jules Chéret was apprenticed at thirteen to \
a lithographer and attended evening drawing classes. Living in London from 1859 to \
1866, he discovered the great English colour posters there. On his return, he \
founded his own printing house in Paris, equipped with English presses, and revolutionised \
the French poster: large colour lithographs, figures in motion, \
lettering integrated into the image. In 1881, he ceded his studio to the Chaix printing house, of which \
he remained artistic director. He designed for theatres, music halls, \
dances, aperitifs or lamp oil, more than a thousand posters in \
all, and received the Legion of Honour in 1890. Around 1900, he devoted himself more to \
decorative painting. Retiring to Nice, he died there at ninety-six; the \
city’s fine arts museum bears his name."""
style = """
Chéret is the father of the modern illustrated poster. His compositions, made for the \
street, rest on a few bright overlapping colours, a light, \
dancing female figure, and drawn letters that become one with the image. He gives \
advertising the grace of the fête galante, and opens the way for Toulouse-Lautrec, Mucha \
and all the poster artists of the Belle Époque."""

[[artistes]]
nom = "Chine, dynastie Yuan"
vie = "China, 1271–1368"
biographie = """
A grandson of Genghis Khan, Kublai Khan founded the Yuan dynasty in 1271 and \
completed the conquest of China a few years later: for the first time, \
the whole country was governed by Mongol rulers, from their capital at \
Dadu, present-day Beijing. The Yuan broadly protected religions, and \
Buddhism, in its Chinese and Tibetan forms, enjoyed great favour. In \
the northern provinces, and notably in Shanxi, temples and monasteries were \
built or restored, and their halls covered with murals by \
itinerant workshops of professional painters, of whom only a few names \
have reached us through inscriptions. In 1368, a revolt drove out the Mongols and \
founded the Ming dynasty."""
style = """
Yuan religious mural painting continues the traditions of the Tang and \
Song: monumental, symmetrical compositions, hieratic deities at the centre, \
processions of figures at the sides, ink drawing of great suppleness, enhanced \
with mineral colours. It is distinct from the literati painting, in ink on \
silk or paper, that flourished at the same time."""

[[artistes]]
nom = "Espagne, art roman"
vie = "Christian kingdoms of the northern Iberian Peninsula, 11th–13th century"
biographie = """
In the 11th and 12th centuries, the Christian kingdoms of northern Spain, Castile, \
León, Aragon, the Catalan counties, expanded southwards at the expense of Muslim Spain. \
Along the pilgrimage routes to Santiago de Compostela, \
churches and monasteries multiplied, and their walls were covered with paintings: \
apses where Christ in Majesty is enthroned, naves where biblical narratives unfold, \
monastic halls adorned with animals and patterns. The painters, often itinerant, \
worked from one site to another and spread models from France, \
Italy or Byzantium, but also from the art of Muslim Spain. In the twentieth century, \
many of these paintings were detached from the walls to be saved or sold, \
and are now found in Barcelona, Madrid or the United States."""
style = """
Spanish Romanesque painting is recognisable by its large flat areas of bright colour, \
outlined with a thick line, by its stylised figures with large eyes and by its grounds in \
horizontal bands, without landscape or depth. Men and animals become \
powerful ornaments, made to be read from afar, in the dimness of churches."""
