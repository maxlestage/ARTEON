[exposition]
ordre = 220
nom_court = "The Art of Walls"
mouvement = "Mural painting and street art"
cadre = "aucun"
couleur = "#b23a12"
titre = "Before Street Art, the Art of Walls"
artiste = "Rome, Teotihuacan, Carle Vernet, Jules Chéret, Yuan-dynasty China, Romanesque Spain…"
dates = "1st century BC – 1886"
accroche = "Virtual exhibition · Urban Nation Museum, Berlin"
introduction = """
People did not wait for New York graffiti, the Berlin Wall or Banksy to paint \
walls and turn the street into a gallery. The Romans covered the rooms of their villas with \
frescoes, and wrote on the façades of Pompeii election slogans and \
scribbled words, which Italian archaeologists called graffiti. The inhabitants of \
Teotihuacan painted the walls of their palaces red; the monks of China and \
Castile had the walls of their temples covered with immense images; in the nineteenth \
century, the colourful poster invaded the streets of Paris. Today’s street art is \
protected by its creators’ copyright: the visit therefore shows its ancestors, \
nine works fallen into the public domain, from the 1st century BC to 1886. The \
building is inspired by the Urban Nation Museum in Berlin: a welcoming façade, a \
long gallery of painted walls, and rooms as tall as the gable ends of apartment buildings."""
vitrine = "boscoreale-salle-l.jpg"

[musee]
nom = "Urban Nation Museum for Urban Contemporary Art"
ville = "Berlin, Germany"
architecte = "GRAFT (transformation of the building)"
construction = "Late nineteenth-century building; museum opened in 2017"
presentation = """
The Museum for Urban Contemporary Art, known as Urban Nation, occupies a \
late nineteenth-century building at 7 Bülowstraße, in the district of \
Schöneberg, near Nollendorfplatz. The project began in 2013 on the initiative of \
the Stiftung Berliner Leben, a foundation created by the municipal housing company \
Gewobag: first murals commissioned from artists on façades across the city, \
then a museum, opened to the public in September 2017. The Berlin architectural firm \
GRAFT transformed the building and linked its rooms with walkways. The façade, at \
the corner of Zietenstraße, is conceived as a modular surface: guest artists \
repaint it at regular intervals, so that the building changes \
its face. The opening exhibition brought together more than 150 artists, from Shepard Fairey to \
the photographer Martha Cooper, whose library, devoted to street photography \
and the history of graffiti, is housed in the museum. Urban Nation thus asserts that an \
art born on the margins, often illegally, now has its place in an institution."""
ici = """
The ARTEON building takes up the idea of a welcoming façade and of rooms with light concrete \
walls, but dedicates them to the ancestors of street art. You enter from the south \
into “The Façade”, a wide, low hall, then pass north into “The Painted Walls \
of Rome”, a thirty-metre gallery where you walk alongside the frescoes of the villas of Vesuvius. \
Two doors open to the north: to the west, “The Walls of Teotihuacan”, ten \
metres high, for the painted processions of the great Mexican city; to the east, “Paris: \
The Poster in the Street”, for Carle Vernet’s bill-poster and Jules Chéret’s \
Viviane. Both lead to “The Great Temple Murals”, a long hall \
twelve metres high where the Medicine Buddha unfolds across more than fifteen metres."""

