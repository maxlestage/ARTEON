[[artistes]]
nom = "Mosaïstes de Ravenne"
vie = "Ravenna (Italy), 5th–6th century"
biographie = """
Ravenna, on the Adriatic coast, became in 402 the capital of the Western Roman Empire, sheltered by its marshes. Empress Galla Placidia had a small mausoleum built there, covered with midnight-blue mosaics. After the fall of the Western Empire, the city was the capital of the Ostrogothic king Theodoric, who ruled Italy from 493 to 526 and had the church of Sant’Apollinare Nuovo decorated. In 540 the armies of the Byzantine emperor Justinian took the city: San Vitale, then Sant’Apollinare in Classe, consecrated in 549, received the finest decorations of their time. Ravenna then remained the seat of the Byzantine governor of Italy, the exarch, until its capture by the Lombards in 751. The mosaicists who worked on these building sites are anonymous. Historians debate whether they came from Constantinople or formed a local workshop trained in the models of the capital; it is likely that the two mingled. Eight monuments of the city have been inscribed together as a UNESCO World Heritage Site since 1996."""
style = """
The mosaics of Ravenna show the passage from Roman to Byzantine art: figures lose their volume and shadow, are placed frontally against a ground of gold or deep blue, and line up in solemn rows. The colour is dazzling, yet the faces with their large eyes are individualised. This language of gold and frontality, which makes the image a presence rather than a scene, would mark all Eastern Christian art and, later, the Italian Primitives."""

[[artistes]]
nom = "Byzance"
vie = "Byzantine Empire, Constantinople, 330–1453"
biographie = """
In 330 Emperor Constantine inaugurated his new capital on the site of ancient Byzantium, on the Bosphorus: Constantinople. When the Western Roman Empire disappeared in 476, the Eastern one continued for nearly a thousand years; it is now called the Byzantine Empire, but its inhabitants called themselves Romans. Under Justinian, in the 6th century, it reached its greatest extent and built Hagia Sophia. From about 726 to 843 the Iconoclast controversy divided the Empire: the iconoclasts had representations of Christ and the saints destroyed, before the veneration of icons was definitively restored. Under the Macedonian dynasty, in the 10th and 11th centuries, the capital’s workshops produced ivories, manuscripts, enamels and luxury silks. In 1204 the crusaders sacked Constantinople; the city was retaken in 1261 by Michael VIII Palaiologos, and art enjoyed a last flowering. On 29 May 1453 the Ottomans of Mehmed II took the city. Byzantine art survived in the Orthodox countries, from Greece to Russia, and in the workshops of Venetian Crete."""
style = """
Byzantine art is first of all a religious and imperial art. It favours frontality, the gold ground that places figures outside time, and types fixed by tradition so that each image remains faithful to its model. The icon is not a mere picture: according to theologians, the respect paid to the image passes to the person represented. Yet from century to century artists renewed these formulas, from the ancient elegance of the year 1000 to the moving humanity of the faces of the 13th century."""

[[artistes]]
nom = "Angelos Akotantos"
vie = "Candia (Crete), active in the first half of the 15th century"
biographie = """
Angelos Akotantos lived in Candia, present-day Heraklion, the capital of Crete, then a possession of Venice. In the 15th century the city housed an important guild of Greek painters, who worked for the island’s Orthodox churches, for Catholic clients and for export. Akotantos was one of the most renowned. He is known from Venetian archival documents, including a will dated 1436, and from icons signed in Greek “by the hand of Angelos”. Among these, a Virgin Kardiotissa, kept in the Byzantine and Christian Museum in Athens, is one of the most famous. He died in the middle of the 15th century, shortly before or after the fall of Constantinople, which drove many Byzantine artists to take refuge in Crete. His models, copied and copied again, fixed for a long time the types of the Cretan school, followed by Andreas Ritzos at the end of the century and, in the next, by the young Doménikos Theotokópoulos, the future El Greco, born in Candia."""
style = """
Akotantos combines the tradition of Constantinople with a new precision: crisp outlines, flesh modelled with fine parallel pale touches, angular, rhythmic folds, abundant gold. His Virgins have a grave, restrained gentleness. This elegant manner, easy to transmit through pattern drawings, became the signature of the Cretan school, whose icons spread from Venice to Ethiopia."""

[[artistes]]
nom = "Égypte copte"
vie = "Christian Egypt, from the 4th century"
biographie = """
According to tradition, the evangelist Mark founded the Church of Alexandria. Christianity spread in Egypt from the earliest centuries, and in the 4th century the country became the cradle of Christian monasticism, with Saint Anthony, hermit of the desert, and Saint Pachomius, who founded the first communities of monks. At the Council of Chalcedon, in 451, a large part of Egypt’s Christians rejected the definition of Christ’s nature adopted by the Empire: their Church separated from that of Constantinople. The word Copt comes from the Arabic qubt, itself derived from the Greek Aiguptios, Egyptian. The Arab conquest, between 639 and 642, brought Egypt under Muslim rule, but the Copts remained numerous and still form the largest Christian community in the Near East today. Their art, known through churches and monasteries, wall paintings, sculptures and above all textiles preserved by the dry sand, blends the heritage of Greco-Roman Egypt with Christian themes."""
style = """
Coptic art loves bold colours, round faces with large fixed eyes, frontal and simplified figures, and teeming decoration of foliage, fruit and animals. It inherits from the Fayum portraits and the Hellenistic art of Alexandria, but moves towards an ever more marked stylisation. Its wool and linen fabrics, often woven as tapestry, rank among the finest textiles of Late Antiquity."""

[[artistes]]
nom = "Arménie"
vie = "Armenia, Cilicia and the Armenian diaspora, from the 4th century"
biographie = """
According to tradition, King Tiridates III, converted by Saint Gregory the Illuminator, made Christianity the official religion of Armenia in the early 4th century. Around 405, the monk Mesrop Mashtots invented an alphabet specific to the Armenian language, which made it possible to translate the Bible and gave birth to a rich literature. Placed between Byzantium, Persia, and then the Arab and Turkish world, Armenia often lost its independence. At the end of the 12th century, Armenian princes founded in Cilicia, in the south-east of Asia Minor, a kingdom that lasted until 1375: its monasteries produced the finest Armenian illuminated manuscripts, including those of the painter Toros Roslin in the 13th century. After its fall, the Armenians dispersed across the Ottoman Empire, Persia, Crimea, Poland and as far as India. Great merchants, they financed churches, manuscripts and liturgical objects, and fervently preserved old books, which they had rebound or bought back when they had been taken."""
style = """
Armenian illumination is distinguished by its vivid, saturated colours, its canon tables adorned with birds and plants, its margins peopled with ornaments, and a personal reading of Byzantine models. Armenian goldsmiths, for their part, excel in repoussé silver, enamels and the gemwork of bindings and reliquaries. The carved stone crosses, the khachkars, are another creation unique to Armenian art."""

[[artistes]]
nom = "Éthiopie chrétienne"
vie = "Kingdom of Aksum, then Ethiopian empire, from the 4th century"
biographie = """
In the 4th century, King Ezana of Aksum, in what is now northern Ethiopia, converted to Christianity under the influence of Frumentius, a Christian from Tyre whom Athanasius of Alexandria consecrated bishop. The Ethiopian Church thereafter remained tied to that of Alexandria, which sent it its bishops until the 20th century. Its liturgical language is Ge’ez, the ancient language of Aksum, written in its own alphabet. In the 12th or 13th century, under King Lalibela, the famous churches that bear his name were carved out of the rock. In the 15th century, Emperor Zara Yaqob, who reigned from 1434 to 1468, reformed the Church and encouraged the copying and illustration of sacred books in the monasteries. Ties with the Mediterranean were then strengthened: Cretan icons arrived in Ethiopia, and a Venetian painter, Nicolò Brancaleon, worked at court at the end of the century. Ethiopian churches and monasteries still preserve thousands of illuminated manuscripts today."""
style = """
Ethiopian painting, on parchment, on wood or on church walls, favours the black ink line, pure colours laid in flat areas, yellow, red, green, and large almond-shaped eyes turned towards the viewer. Folds become patterns, borders are covered with interlace and chevrons. Heir to Coptic, Syriac and Byzantine models, it transforms them into a very recognisable graphic language."""
