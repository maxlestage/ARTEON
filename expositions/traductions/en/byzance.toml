[[oeuvres]]
titre = "Saint Luke, Leaf from a Gospel Book"
artiste = "Éthiopie chrétienne"
annee = "c. 1440–1480"
image = "evangeliaire-ethiopien-saint-luc.jpg"
licence = "CC0"
source = "https://www.clevelandart.org/art/1999.212"
technique = "Ink and tempera on vellum, 37 × 25 cm"
collection = "Cleveland Museum of Art"
note = "The evangelist Luke and his ox, painted in Tigray, in northern Ethiopia, in bright colours and geometric patterns."
description = """
Saint Luke sits in three-quarter view, on a block decorated with a lattice pattern, beneath an arch. He has long grey hair and a grey beard drawn line by line. In his left hand he holds an open white book, and in his right a long reed pen with which he writes. His robe is entirely covered with wavy orange and red lines, which draw the folds like contour lines. His halo stands out against a green ground, and the lower part of the ground is striped with orange. Above, in the curve of the arch, an ox leaps beside a few lines of Ge’ez script. A border of geometric patterns surrounds the page, whose parchment is browned and worn at the edges."""
evocation = """
The ox is the symbol of Luke, one of the four animals that have represented the evangelists since the early Christian centuries. The portrait follows a model that came down from Antiquity through Coptic, Syriac and Byzantine books: the seated author writing. But the Ethiopian painter transforms it into a colourful drawing, with rhythmic lines and large almond-shaped eyes, very far from Greek modelling. The text in Ge’ez, the liturgical language of the Ethiopian Church, is a prayer whose meaning is roughly: “Make this image of Saint Luke with this ox; may his prayer and his blessings be with us. Amen.”"""
histoire = """
The leaf comes from a Gospel book made in the Tigray region, in northern Ethiopia, around 1440–1480, under the reign of Zara Yaqob or his successors, a time of great activity for the monasteries and their copying workshops. The book was later dismembered, and its pages entered the art market. This one was bought in 1999 by the Cleveland museum from an Ohio dealer in rare books. Like many Ethiopian manuscripts that have left the country, the book was cut up to be sold page by page, a practice now widely criticised."""
facture = """
The painter first traces all the outlines in ink, with a sure line, then fills the surfaces with bold colours, without shadow or gradation: yellow, green, orange, red. Volume is replaced by the rhythm of the lines, which cover the robe with an undulating network. The page border, made of chevrons and interlace, recalls the patterns of weavings and Ethiopian crosses. The support is a thick parchment, which has darkened and frayed with use."""
details = [
  "The ox, symbol of Luke, at the top in the arch.",
  "The lines of Ge’ez script beside the ox.",
  "The long reed pen that the evangelist rests on his book.",
  "The wavy orange lines that draw the folds of the robe.",
  "The orange bands striping the ground, on the left, beneath the saint’s arm.",
]
themes = ["evangelist", "manuscript", "ethiopia", "ge'ez", "colour"]
anecdote = """
Christianity became the official religion of the kingdom of Aksum, in what is now northern Ethiopia, around the middle of the 4th century, under King Ezana: well before the evangelisation of most countries of northern Europe."""
