[[oeuvres]]
titre = "Armenian Gospel Book with Silver Cover"
artiste = "Arménie"
annee = "manuscript: 13th century; binding: 1691"
image = "evangeliaire-armenien.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://www.metmuseum.org/art/collection/search/446861"
technique = "Ink and tempera on parchment; binding of embossed silver gilt, enamel, coloured stones and glass, 26 × 18.7 cm"
collection = "Metropolitan Museum of Art, New York"
note = "An Armenian Gospel book, clothed four centuries later in a goldsmith’s binding: the book is 26 cm high."
description = """
The book is shown closed, upright, seen from the front. Its silver-gilt cover is worked in relief. At the centre, a plaque shows the Nativity: the Virgin reclining beside the Child swaddled in his manger, Joseph standing, the ox and the ass above, and shepherds approaching. In the upper part of the scene, flocks, horsemen following a star, the Magi, and a row of angels’ heads. The ground is turquoise-blue enamel. Beneath the scene runs an inscription. Around it, a broad border of green enamel is covered with vine scrolls, bunches of grapes and coloured stones: garnets, turquoises, blue cabochons. At the side one glimpses the spine of the book, covered in green velvet."""
evocation = """
For the Armenians, the Gospel book is more than a text: it is a sacred object, carried in procession, kissed, sometimes regarded as protective. It was handed down from generation to generation, bought back when it had been stolen, and rebound when it wore out. Here, a 13th-century manuscript receives in 1691 a goldsmith’s garment worthy of its value. The Nativity recalls that the Gospel announces the birth of the Saviour; the vine, image of Christ and of the Eucharistic wine, surrounds it. The book links two eras of Armenian history, the kingdom of Cilicia and the diaspora."""
histoire = """
The manuscript was copied and painted in the 13th century, probably in Cilicia, the Armenian kingdom founded in the south-east of Asia Minor, whose illumination workshops were then enjoying their golden age. The museum does not specify where the binding, dated 1691, was made; the Armenian inscription shows that it was commissioned by Armenians. At the end of the 17th century, Armenian communities were scattered between the Ottoman Empire, Persia and Europe, and their merchants financed such works for their churches. The book entered the Metropolitan Museum of Art in 1916, a gift of Mrs Edward S. Harkness."""
facture = """
The cover is made of silver sheets worked in repoussé: the goldsmith strikes the metal from the back to make the figures stand out, then refines the details with a chasing tool from the front. Some parts are gilded. The grounds are covered with coloured enamels, powdered glass fused in hollows of the metal, blue for the sky of the Nativity, green for the border. Stones and coloured glass, set in bezels, punctuate the frame. Inside, the parchment pages are written in ink and painted in tempera."""
details = [
  "The star, at upper right, followed by the Magi on horseback.",
  "The ox and the ass leaning over the manger.",
  "The row of angels’ heads in the clouds at the top of the scene.",
  "The bunches of grapes in relief in the green enamel border.",
  "The large turquoise and the garnets set in the frame.",
]
themes = ["gospel", "nativity", "goldsmithing", "enamel", "armenia"]
anecdote = """
Armenia is traditionally considered the first kingdom to have adopted Christianity as its official religion, in the early 4th century. Its alphabet, created around 405 by the monk Mesrop Mashtots, was first used to translate the Bible."""
