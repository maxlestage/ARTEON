[exposition]
ordre = 8
nom_court = "Byzantium"
mouvement = "Byzantium and the Christian East"
cadre = "dore"
couleur = "#7d5a12"
titre = "Byzantium and the Christian East, Heaven in Gold"
artiste = "Ravenna, Constantinople, Angelos Akotantos, Coptic Egypt, Armenia, Ethiopia…"
dates = "6th–17th century"
accroche = "Virtual exhibition · Hagia Sophia, Istanbul"
introduction = """
For a thousand years, from Justinian to the fall of Constantinople in 1453, the Byzantine Empire developed an art of gold and presence: mosaics in which the emperor stands beside the saints, icons that the faithful pray to and kiss, and ivories and Gospel books as precious as reliquaries. The visit follows this art from Ravenna to Crete, then to the other Eastern Christians, in Egypt, Armenia and Ethiopia, across eleven works. The building is inspired by Hagia Sophia in Istanbul: an elongated narthex, a very tall square nave beneath the dome, two side aisles and, at the far end, an apse."""
vitrine = "vierge-de-vladimir.jpg"

[musee]
nom = "Hagia Sophia"
ville = "Istanbul, Turkey"
architecte = "Anthemius of Tralles and Isidore of Miletus"
construction = "532–537"
presentation = """
In 532 the Nika riot ravaged Constantinople, and the basilica of Divine Wisdom, Hagia Sophia, went up in smoke. Emperor Justinian had it rebuilt at once by two scholars, the mathematician Anthemius of Tralles and Isidore of Miletus: the new church was consecrated in 537. Its dome, about thirty-one metres wide, seems to float above the nave thanks to the ring of forty windows pierced at its base. It collapsed in 558 after earthquakes and was rebuilt higher. For nine centuries Hagia Sophia was the cathedral of the Empire, where emperors were crowned. After Mehmed II took the city in 1453, it became a mosque: minarets were added and the figural mosaics were gradually covered with plaster. A museum from 1934, it was returned to Muslim worship in 2020. One can still see Justinian’s marbles and, in the galleries, the mosaics uncovered in the 20th century, including the Deësis."""
ici = """
ARTEON’s building takes up the layout of Hagia Sophia. One enters from the south into the narthex, a long vestibule twenty-four metres wide. It opens onto the nave beneath the dome, a square hall twenty-four metres on each side and twenty metres high, with gold-coloured walls, where the mosaics are gathered. To the west lies the aisle of the icons; to the east, the aisle of the treasury, lower and more intimate. To the north, at the far end of the nave, the apse presents the Christian East: Egypt, Armenia and Ethiopia."""

