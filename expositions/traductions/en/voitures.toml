[[oeuvres]]
titre = "Bugatti Type 41 Royale, “Coupé Napoléon”"
artiste = "Ettore Bugatti"
annee = "c. 1929"
image = "bugatti-royale-napoleon.jpg"
credit = "Photo : Aurélien Boffy"
licence = "CC BY 3.0"
source = "https://commons.wikimedia.org/wiki/File:Bugatti_Royale_Coup%C3%A9_Napol%C3%A9on.jpg"
technique = "12.7-litre straight-eight engine; wheelbase 4.30 m, length approximately 6.40 m; town coupé body"
collection = "Cité de l'Automobile – Musée national, Schlumpf Collection, Mulhouse"
note = "Ettore Bugatti's personal car, on the prototype chassis of the Royale: the largest and most luxurious automobile of its time."
description = """
The immense Royale is seen from the front three-quarter view on a red carpet, in an aisle of the Mulhouse museum lit by globe lamp-posts. Its bodywork is black and blue: a long black bonnet, light blue sides and a closed roof over the rear, while the chauffeur's place, at the front, is open. Large black wings stretch in a curve from the front wheels to the running boards. The chromed horseshoe radiator is flanked by two enormous headlamps; at the top, a small statuette of an elephant rearing on its hind legs serves as the mascot. The wheels have solid hubcaps. Behind, other cars from the collection."""
evocation = """
Ettore Bugatti wanted to build the car of kings. The Royale was to rival the greatest Rolls-Royces and attract the sovereigns of Europe; it arrived at the moment of the 1929 crisis, and only six were built, of which three were sold. It has remained the symbol of a luxury without measure, that of the waning Roaring Twenties. The Coupé Napoléon, which Bugatti used himself, also has a family dimension: the elephant on the radiator cap takes up a sculpture by his brother Rembrandt Bugatti, an animal sculptor who died in 1916. The car thus combines art and mechanics, as their father Carlo, a designer of furniture, had done."""
histoire = """
Ettore Bugatti, an Italian settled in Molsheim, in Alsace, conceived the Royale in the mid-1920s. The prototype, on chassis 41100, was running by 1926 and received several successive bodies; the town coupé body, known as the “Coupé Napoléon”, dates from the late 1920s. Bugatti kept it for his personal use, and it remained in the family after his death in 1947. In 1963, the Schlumpf brothers bought a group of cars kept at Molsheim by the Bugatti family, including this one. Discovered with the rest of their collection in 1977, it is today one of the two Royales on display at the Cité de l'Automobile in Mulhouse."""
facture = """
Everything about the Royale is outsized. Its eight-cylinder in-line engine, of nearly 13 litres, derives from an aircraft-engine project; cast in one piece with its cylinders and head, it is carved from blocks machined with the watchmaker's precision that made Bugatti's reputation. The wheels, in cast alloy, carry the brake drums. The body of the Coupé Napoléon takes up the form of chauffeur-driven cars: the driver in the open air, the owner in a closed saloon, lit by windows at the rear. The taut lines of the bonnet and wings announce the style of Jean Bugatti, Ettore's son."""
details = [
  "The rearing elephant on the radiator cap, after Rembrandt Bugatti.",
  "The chromed horseshoe radiator, signature of the marque.",
  "The two enormous headlamps on either side of the radiator.",
  "The light blue sides between the bonnet and the black wings.",
  "The globe lamp-posts of the museum aisle.",
]
themes = ["luxury", "roaring twenties", "alsace", "excess", "collection"]
anecdote = """
The Royale's engine had a second life: for lack of buyers for the car, Bugatti used it to power railcars, fast trains that ran in France until the 1950s."""
salle = 4
mur = "nord"
position = 0
largeur = 7.5

[[oeuvres]]
titre = "The Motorist (L'Automobiliste)"
artiste = "Henri de Toulouse-Lautrec"
annee = "1896–1898"
image = "lautrec-automobiliste.jpg"
licence = "CC0"
cadre = "estampe"
source = "https://commons.wikimedia.org/wiki/File:Henri_de_Toulouse-Lautrec,_The_Motorist_(L%27automobiliste),_1896,_NGA_33915.jpg"
technique = "Lithograph in black on paper"
collection = "National Gallery of Art, Washington (Rosenwald Collection, 1947.7.157)"
note = "A driver wrapped in fur races down the road in a cloud of dust: Lautrec captures in a few strokes the new figure of the motorist."
description = """
In the foreground, at left, a massive man sits at the wheel of a car of which we see only the front, at the bottom of the image, and the spoked steering wheel. He is wrapped in an enormous fur coat, its hairs drawn with nervous hatching; a flat cap and round goggles frame his moustached face. His gloved right hand grips a lever. Behind him, a great cloud of dust or smoke rises towards the sky. At right, barely sketched in line, an elegant woman in a long dress walks away at the roadside, followed by a small dog. In the margin, at the bottom, a handwritten pencil inscription."""
evocation = """
Lautrec, painter of cabarets and circuses, took an interest in every novelty of modern life: the bicycle, the theatre, and now the automobile. He shows less the machine than the man it transforms. His driver, almost a caricature, is no more than a mass of fur, goggles and determination, launched into a whirlwind of dust. The contrast with the lady walking with her small dog, light, drawn in a fine line, is full of irony: the old world, that of strolling, watches the new one go by. The driver is traditionally identified as the artist's cousin, Dr Gabriel Tapié de Céleyran."""
histoire = """
Henri de Toulouse-Lautrec practised lithography intensively from 1891, for posters, music-sheet covers and prints sold to collectors. The Motorist dates from the late 1890s, as the first cars were beginning to circulate on the roads of France; the National Gallery of Art dates it to 1896, other catalogues to 1898. The plate, issued in a small edition, appears in the catalogue of Lautrec's printed work compiled by Loys Delteil. This impression is part of the immense print collection of the American collector Lessing J. Rosenwald, given to the National Gallery of Art in Washington, and entered the museum in 1947."""
facture = """
Lithography allows Lautrec to draw directly on the stone, with a greasy crayon, with the same freedom as on a sheet of paper. He contrasts two manners here: tight, vigorous hatching, almost black, for the fur coat and the dust, and a fine, barely pressed line for the walker and the landscape. The whites of the paper become the road and the sky. The framing, cut off sharply at the steering wheel and the edge of the car, comes from Japanese prints and from photography, which Lautrec admired: it gives the viewer the impression of sitting next to the driver."""
details = [
  "The round goggles and flat cap of the driver.",
  "The nervous hatching of the fur coat.",
  "The spoked steering wheel, cut by the edge of the image.",
  "The walker sketched in line, and her small dog.",
  "The artist's monogram in a circle, at lower left.",
]
themes = ["print", "modern life", "speed", "caricature", "belle époque"]
anecdote = """
Lautrec also loved cycling: in 1896, he drew for Simpson cycles the poster “La Chaîne Simpson”, for which the racer Constant Huret posed."""
salle = 5
mur = "est"
position = 0
largeur = 0.6

[[oeuvres]]
titre = "Nunc est bibendum!!… The Michelin Tyre Drinks Up Obstacles!"
artiste = "O'Galop (Marius Rossillon)"
annee = "1898"
image = "michelin-nunc-est-bibendum.jpg"
licence = "Domaine public"
cadre = "noir"
source = "https://commons.wikimedia.org/wiki/File:Michelin_Poster_1898.jpg"
technique = "Colour lithographed poster (reproduction)"
collection = "Advertising poster for Michelin; examples in several collections"
note = "The first appearance of Bibendum, the man made of tyres, raising his cup of nails and shards of glass."
description = """
Against a blue-green background, a white figure made of a stack of tyres, a pince-nez on his nose, sits at a table covered with a white cloth. With his right hand he raises a cup filled with nails and pieces of glass, ready to be drunk. On either side, two other figures made of tyres, deflated and grimacing, one of them marked “Pneu X”, seem in a bad way. At the top, in large red letters, one reads “Nunc est bibendum!!…”, then “that is to say:”. At the bottom, on the cloth: “To your health, the Michelin tyre drinks up obstacles!”. O'Galop's signature is at right."""
evocation = """
The poster turns a technical argument into an unforgettable image. The road of 1898 was strewn with horseshoe nails and shards: the Michelin tyre, it says, swallows them without puncturing, whereas competing tyres, deflated, cut a sorry figure. The Latin phrase comes from an ode by Horace, “now is the time to drink”, and the man of tyres takes his name from it: Bibendum. He would become one of the most famous advertising characters in the world. The poster also shows that the automobile creates a whole trade around itself, tyres, fuel, guides and road maps, which advertising immediately seized upon."""
histoire = """
The brothers André and Édouard Michelin took over a rubber company in Clermont-Ferrand in 1889. They developed a removable bicycle tyre, then in 1895 entered in the Paris–Bordeaux–Paris race a car fitted with pneumatic tyres, the Éclair. According to the company's tradition, the sight of a stack of tyres at the Lyon exhibition of 1894 gave Édouard the idea of a character. In 1898, the illustrator O'Galop took up for Michelin a poster project rejected by a brewery, in which a drinker raises his tankard: Bibendum was born. This reproduction was digitised from a calendar."""
facture = """
O'Galop, a humorous illustrator, builds the poster like a newspaper cartoon: clean outlines, flat areas of colour, expressive characters. Bibendum is made of stacked bicycle tyres, white as rubber then was, before carbon black was added. The red of the letters and the blue-green of the background stand out vividly, as a street poster, made to be read from afar, requires. The text, mixing Latin and French, is integrated into the image: it reads from top to bottom, like a funny story with its punchline, “the Michelin tyre drinks up obstacles”."""
details = [
  "The cup of nails and shards of glass raised by Bibendum.",
  "The pince-nez perched on the nose of the man of tyres.",
  "The deflated competitor marked “Pneu X”.",
  "The large red letters of the Latin phrase.",
  "O'Galop's signature, at right above the text.",
]
themes = ["poster", "advertising", "tyre", "humour", "belle époque"]
anecdote = """
Bibendum is white because tyres were: it was not until the 1910s that carbon black was added to rubber, making it more durable and giving tyres their present colour."""
salle = 5
mur = "nord"
position = 0
largeur = 1.3

[[artistes]]
nom = "Nicolas-Joseph Cugnot"
vie = "Void (Lorraine), 26 February 1725 – Paris, 2 October 1804"
biographie = """
Born in Lorraine, Nicolas-Joseph Cugnot became a military engineer and served in the Austrian army, where he took an interest in fortifications and machines. Returning to Paris around 1763, he published works on the military art and fortification. He became passionate about the power of steam, then used mainly to pump water from mines, and proposed using it to haul cannon. With the support of the Duc de Choiseul, Minister of War, and General Gribeauval, he built a first model in 1769, then in 1770 the great fardier now in the Conservatoire des arts et métiers. The project was abandoned after Choiseul's fall from favour. Cugnot received a pension from the king, lost during the Revolution and then reinstated by Bonaparte shortly before his death."""

[[artistes]]
nom = "Carl Benz"
vie = "Mühlburg (Karlsruhe), 25 November 1844 – Ladenburg, 4 April 1929"
biographie = """
The son of a locomotive driver who died when he was two, Carl Benz studied mechanical engineering at the polytechnic school in Karlsruhe. After several jobs, he founded a workshop in Mannheim where he developed two-stroke gas engines, then a four-stroke petrol engine. In 1885, he built a tricycle around this engine and in January 1886 filed the patent for the Motorwagen. His wife Bertha, who had invested her dowry in the business, made in 1888 the first long journey by automobile. Benz & Cie became in the 1890s one of the first great manufacturers in the world, with the Velo, a small car sold in series. In 1926, the firm merged with the Daimler-Motoren-Gesellschaft to form Daimler-Benz, the house of Mercedes-Benz cars."""

[[artistes]]
nom = "Panhard et Levassor"
vie = "Paris, 1886 (partnership); René Panhard, 1841–1908; Émile Levassor, 1843–1897"
biographie = """
René Panhard and Émile Levassor, both engineers who had graduated from the École centrale, ran a woodworking-machinery firm on the avenue d'Ivry in Paris. Through Édouard Sarazin, Gottlieb Daimler's representative in France, they discovered the petrol engine; after Sarazin's death, his widow Louise, who held the licence, married Levassor in 1890. The firm then built Daimler engines and, from 1891, cars sold to private customers, with the engine at the front. Levassor, an excellent driver, won the Paris–Bordeaux–Paris race in 1895, but died in 1897 of the effects of a racing accident. The company Panhard et Levassor remained for decades one of the great names of French motoring, before being absorbed by Citroën in 1965."""

[[artistes]]
nom = "De Dion-Bouton"
vie = "Paris and Puteaux, 1883–1932; Albert de Dion, 1856–1946; Georges Bouton, 1847–1938"
biographie = """
The Comte Albert de Dion, a wealthy young aristocrat passionate about mechanics, went into partnership in 1883 with Georges Bouton, a maker of mechanical toys, and his brother-in-law Charles Trépardoux. The workshop first built steam cars and tractors, then, from 1895, small high-speed petrol engines that powered tricycles and light cars. These engines, sold to dozens of manufacturers in France and abroad, made the Puteaux factory one of the most important in the world around 1900. The Comte de Dion founded in 1895 the Automobile Club de France with Baron de Zuylen and the journalist Paul Meyan, and later became a deputy and senator. The marque declined after the First World War and ceased producing cars in the early 1930s."""

[[artistes]]
nom = "Rolls-Royce"
vie = "Manchester then Derby (England), founded in 1906; Charles Rolls, 1877–1910; Henry Royce, 1863–1933"
biographie = """
Henry Royce, the son of a ruined miller, learned engineering in the railway workshops and founded in Manchester a firm making electrical equipment. Dissatisfied with his French car, he built his own automobiles in 1904, of remarkable quality. Charles Rolls, the son of a lord, a driver and car dealer in London, undertook to sell all of his output: Rolls-Royce Limited was founded in 1906. The commercial director Claude Johnson made the 40/50 HP Silver Ghost the showcase of the marque. Rolls died in 1910 in an aeroplane accident; Royce, ill, directed design from his home in the south of England. During the war, the firm also built aircraft engines, which became, along with luxury cars, its great speciality."""

[[artistes]]
nom = "Ford Motor Company"
vie = "Detroit (Michigan), founded in 1903; Henry Ford, 1863–1947"
biographie = """
Henry Ford, the son of Michigan farmers, worked as a mechanic and then as an engineer at the Edison Illuminating Company in Detroit. He built his first car, the Quadricycle, in 1896. After two failures, he founded in 1903 the Ford Motor Company, which launched the Model T in 1908. To produce it at a low price, Ford organised the Highland Park plant around the moving assembly line, put into service in 1913, and sharply raised wages in 1914 to retain his workers. The success was immense: by the late 1910s, one car in two in the United States was a Model T. The Model T was replaced in 1927 by the Model A. Henry Ford, a controversial figure for his political positions and his antisemitism, ran the company until 1945."""

[[artistes]]
nom = "Hispano-Suiza"
vie = "Barcelona, founded in 1904, and Bois-Colombes (France); Marc Birkigt, 1878–1953"
biographie = """
Hispano-Suiza, “the Spanish-Swiss”, was founded in Barcelona in 1904 by the businessman Damián Mateu and the Swiss engineer Marc Birkigt, born in Geneva. King Alfonso XIII of Spain, a great enthusiast, gave his name to a sports model of 1911. The marque then opened a factory in France, at Levallois and then at Bois-Colombes. During the First World War, Birkigt's V8 aircraft engine powered thousands of Allied fighters, including the SPADs of Georges Guynemer. After the war, the French branch produced cars of the greatest luxury, the H6 and then the twelve-cylinder J12, famous for their engineering and their coachwork. In the 1930s, the company abandoned the automobile to devote itself to aircraft engines."""

[[artistes]]
nom = "Ettore Bugatti"
vie = "Milan, 15 September 1881 – Paris, 21 August 1947"
biographie = """
The son of Carlo Bugatti, a Milanese designer of furniture and objets d'art, and brother of the animal sculptor Rembrandt Bugatti, Ettore Bugatti grew up in an artistic milieu. He designed tricycles and cars very young for several manufacturers, then founded in 1909 his own marque at Molsheim, in Alsace, then German. His cars, light, powerful and perfectly finished, won hundreds of races, like the Type 35, one of the most victorious racing cars in history. He also designed cars of the greatest luxury, including the Royale, as well as railcars and aircraft engines. His son Jean designed in the 1930s the marque's most beautiful bodies, before killing himself testing a car in 1939."""

[[artistes]]
nom = "Henri de Toulouse-Lautrec"
vie = "Albi, 24 November 1864 – Château de Malromé (Gironde), 9 September 1901"
biographie = """
Born into an old aristocratic family of the South of France, Henri de Toulouse-Lautrec broke both legs in adolescence; they stopped growing. He then devoted himself to drawing and painting, studied in Paris in the studios of Bonnat and Cormon, and settled in Montmartre. He became the painter of cabarets, dance halls, circuses and brothels, and befriended the stage artists Aristide Bruant, Jane Avril and Yvette Guilbert. From 1891, with the Moulin Rouge poster, he renewed the art of the poster and of colour lithography, influenced by Japanese prints. Worn out by alcohol, he died at 36, leaving more than 700 paintings, thousands of drawings and some 350 prints and posters."""

[[artistes]]
nom = "O'Galop (Marius Rossillon)"
vie = "Lyon, 1867 – Carnac, 1946"
biographie = """
Marius Rossillon, who signed O'Galop, was a French humorous cartoonist and illustrator. He contributed to many satirical and illustrated newspapers of the late nineteenth and early twentieth centuries, and drew children's books, postcards and posters. In 1898, he created for the Michelin brothers the character of Bibendum, the man made of tyres, who would remain associated with the marque and its guides. He went on drawing him for years for Michelin's advertisements. Curious about new techniques, he also made animated films in the 1910s and 1920s, notably educational cartoons and public-health films, which makes him one of the French pioneers of animated cinema."""
