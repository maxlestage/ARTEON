[exposition]
ordre = 172
nom_court = "Cars"
mouvement = "The automobile, from its origins to the Roaring Twenties"
cadre = "vitrine"
couleur = "#4b5d6e"
titre = "Cars: The Automobile from the Pioneers to the Roaring Twenties"
artiste = "Cugnot, Benz, Panhard et Levassor, De Dion-Bouton, Rolls-Royce, Ford, Hispano-Suiza, Bugatti…"
dates = "1770–1929"
accroche = "Virtual exhibition · Cité de l'Automobile – Musée national, Schlumpf Collection, Mulhouse"
introduction = """
In a century and a half, the car passes from an engineer's dream to an everyday object. The visit brings together ten pieces, from Cugnot's steam fardier, built for the army of Louis XV, to Ettore Bugatti's Bugatti Royale, by way of Carl Benz's tricycle, the first Panhard et Levassor cars, the little De Dion-Bouton of 1900, the Rolls-Royce Silver Ghost, the Ford Model T and Dubonnet's wooden Hispano-Suiza. Two images complete the route: a print by Toulouse-Lautrec and the Michelin Bibendum poster. The building is inspired by the Cité de l'Automobile in Mulhouse, housed in a former spinning mill: a series of workshops leads to a great hall whose aisles are lined with lamp-posts, where the luxury cars of the Roaring Twenties shine."""
vitrine = "bugatti-royale-napoleon.jpg"

[musee]
nom = "Cité de l'Automobile – Musée national, Schlumpf Collection"
ville = "Mulhouse, France"
construction = "Former nineteenth-century spinning mill; museum opened in 1982"
presentation = """
The Mulhouse museum was born of a secret passion. The brothers Hans and Fritz Schlumpf, textile manufacturers, owned wool spinning mills in Alsace. From the late 1950s, Fritz bought old cars without counting the cost, above all Bugattis, and had them restored in the buildings of one of their factories in Mulhouse, away from prying eyes. In 1976, the company collapsed and the brothers left for Switzerland; in early 1977, the workers occupying the factory discovered the immense collection. The State had it listed as a historic monument, then an association bought it and in 1982 opened the Musée national de l'automobile, which became the Cité de l'Automobile in 2006. More than four hundred cars are displayed there, including two Bugatti Royales, in an immense hall lit by hundreds of lamp-posts inspired by those of the Pont Alexandre-III in Paris."""
ici = """
ARTEON's building takes up the idea of the spinning mill turned into a museum. Visitors enter from the south into the Pioneers' Workshop, with pale brick walls, 7 metres high, then pass to the Belle Époque room, cream-coloured, and to the workshop of the car for everyone, grey like a factory shed. Next comes the great hall, 28 metres long and 10 high, with midnight-blue walls like the aisles of Mulhouse, where the luxury cars are lined up as under the lamp-posts of the Alsatian museum. The visit ends in a small salon the colour of old paper, devoted to the image of the automobile. The cars are shown at their real size, in large wall display cases."""

