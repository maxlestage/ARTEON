[exposition]
ordre = 5
nom_court = "Antiquity"
mouvement = "Antiquity: Egypt, the Near East, Greece, Rome"
cadre = "vitrine"
couleur = "#8a5416"
titre = "Antiquity, from the Banks of the Nile to the Bay of Naples"
artiste = "Egypt, Sumer, Assyria, Greece, Rome…"
dates = "c. 2090 BC – AD 120"
accroche = "Virtual exhibition · British Museum, London"
introduction = """
Two thousand years of art around the Mediterranean and the Near East: a blue faience \
hippopotamus and an Egyptian Book of the Dead, a Sumerian prince at prayer and a winged \
genius from the palace at Nimrud, Greek black- and red-figure vases, a bronze dancer, a \
fresco painted near Pompeii, a signed glass jug and a Fayum portrait. These ten objects, \
made by craftsmen who were most often anonymous, tell of death and the afterlife, the \
power of kings, music and festivities. The building is inspired by the British Museum in \
London: you pass through a portico and then step out into a vast covered court, the \
Great Court, onto which open the galleries of Egypt, Greece and Rome."""
vitrine = "hippopotame-william.jpg"

[musee]
nom = "British Museum"
ville = "London, United Kingdom"
architecte = "Robert Smirke; Foster + Partners for the Great Court"
construction = "1823–1852; Great Court opened in 2000"
presentation = """
The British Museum was born in 1753, by Act of Parliament, from the collections \
bequeathed by the physician Hans Sloane, and opened in 1759 in a town house in \
Bloomsbury. Acquisitions poured in, from the Rosetta Stone to the Parthenon sculptures: \
from 1823 the architect Robert Smirke raised a vast Greek Revival quadrangle, whose \
south façade lines up an Ionic colonnade, around an inner courtyard. In 1857 his \
brother Sydney built the round Reading Room there, beneath a dome, soon surrounded by \
book stacks. After the departure of the British Library, Norman Foster’s practice \
cleared the courtyard and covered it with a glass roof of more than three thousand \
triangular panes: the Great Court, opened in 2000, is presented as the largest covered \
public square in Europe. All around, the Egyptian, Assyrian, Greek and Roman galleries \
rank among the richest in the world, and admission is free."""
ici = """
The ARTEON building follows the sequence of the British Museum: a portico, then a great \
covered court from which the galleries lead off. You enter from the south into the \
Portico, with its pale stone walls, then into the Great Court, square and sixteen \
metres high, where the reliefs of the Near East await. To the west, the Egyptian \
Gallery, twenty-four metres long and sand-coloured; to the north, the Greek Room, with \
its pinkish-ochre walls; to the east, the Roman Room, in a softened Pompeiian red."""

