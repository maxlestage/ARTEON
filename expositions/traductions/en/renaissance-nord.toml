[[oeuvres]]
titre = "The Arnolfini Portrait"
artiste = "Jan van Eyck"
annee = "1434"
image = "epoux-arnolfini.jpg"
technique = "Oil on oak panel, 82.2 × 60 cm"
collection = "National Gallery, London"
note = "A merchant from Lucca and his wife in their bedchamber in Bruges: a mirror, a dog, a signature on the wall, and one of the most enigmatic portraits in history."
description = """
In a narrow chamber, a man and a woman stand hand in hand. He, dressed in a full dark coat edged with fur and wearing an enormous straw hat dyed black, raises his right hand. She, in a green gown lined with white fur, holds the heavy folds of her skirt with her other hand and lowers her eyes. All around them everything is described with a goldsmith’s minuteness: the copper chandelier in which a single candle burns in broad daylight, the oranges set near the window, the wooden clogs left on the floor, the bed hung with red, the little dog with its tousled coat. At the back, a convex mirror reflects the entire room, seen from behind, and two visitors standing on the threshold."""
evocation = """
This painting was long read as the scene of a wedding of which the painter was the witness: this was Erwin Panofsky’s famous hypothesis of 1934, which saw a symbol in every object, the single candle for the eye of God, the dog for fidelity, the removed shoes for holy ground. Historians are more cautious today. The solemn gesture resembles an oath, but nothing proves that a ceremony is taking place, and the woman’s rounded belly does not signal a pregnancy: it follows the fashion of the time. What remains is the image of a prosperity proud of itself, imported oranges, rugs, chandelier, furs, that of a world in which merchants vied in luxury with princes."""
histoire = """
The painting is signed and dated on the wall above the mirror. The man is almost certainly Giovanni di Nicolao Arnolfini, a merchant from Lucca settled in Bruges, where Van Eyck was then working. As his first wife, Costanza Trenta, had died in 1433, the identity of the woman remains debated: an unknown second wife, or a portrait in memory of a deceased one. In the early sixteenth century the panel belonged to Margaret of Austria, governor of the Netherlands, who had received it from a Spanish courtier, Diego de Guevara. It then passed to Mary of Hungary, and afterwards to the kings of Spain. After the Battle of Vitoria in 1813, a British officer, James Hay, brought it back to England; the National Gallery bought it in 1842."""
facture = """
Van Eyck did not invent oil painting, but he exploited it in an unprecedented way: by layering thin translucent coats of colour, the glazes, he obtained deep greens, saturated reds and passages of light of a new softness. Daylight enters through the window on the left and glides over every material, polished copper, fur, the wood of the floor. The perspective obeys not a single vanishing point, as in Italy, but a patient, almost tactile observation. The mirror, only a few centimetres wide, shows the virtuosity of a painter able to represent the world in miniature."""
details = [
  "Above the mirror: Johannes de eyck fuit hic 1434, “Jan van Eyck was here”.",
  "Around the mirror, ten tiny medallions recount the Passion of Christ.",
  "In the reflection, two figures on the threshold, one of whom may be the painter.",
  "A single candle burns in the chandelier, in broad daylight.",
  "On the chair, a carved saint, perhaps Margaret, patron saint of women in childbirth.",
]
themes = ["portrait", "couple", "mirror", "interior", "symbols", "bruges"]
anecdote = """
In the seventeenth century the painting was in the royal collections in Madrid, where Velázquez may have seen it. Its mirror has often been compared with that of Las Meninas (1656), in the depths of which the King and Queen of Spain appear in reflection."""
salle = 2
mur = "nord"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "The Descent from the Cross"
artiste = "Rogier van der Weyden"
annee = "before 1443"
image = "descente-de-croix.jpg"
technique = "Oil on panel, 204.5 × 261.5 cm"
collection = "Museo del Prado, Madrid"
note = "Ten almost life-size figures packed into a gilded box: the most intense grief in Netherlandish painting."
description = """
Christ’s body, waxen in its pallor, has just been taken down from the cross. Two elderly men, Nicodemus and Joseph of Arimathea, support it, one beneath the shoulders, the other by the legs, while a young servant, still perched on the ladder, holds his arm. On the left, the Virgin swoons: her body falls in a curve that echoes that of her son, held by Saint John, dressed in red, and by a holy woman in green. On the right, Mary Magdalene wrings her hands. The almost life-size figures press together on a narrow floor where a skull and a bone lie, before a gold ground without depth: they look like painted statues arranged in the case of a carved altarpiece."""
evocation = """
Rogier does not seek to narrate but to make one feel. The parallel between the body of Christ and that of his mother expresses an idea dear to the devotion of his time, compassion in the strong sense: Mary suffers with her son to the point of sharing his death. The tears painted one by one, the reddened eyelids and the clenched hands invite the faithful to weep in their turn. The skull at the foot of the scene recalls that Golgotha was, according to tradition, the place where Adam lay: Christ’s sacrifice redeems the sin of the first man. Finally, the staging in an altarpiece case brings painting close to sculpture, which it claims to equal, and then to surpass through colour and life."""
histoire = """
The panel was commissioned by the Great Guild of Crossbowmen of Leuven, a brotherhood of marksmen, for their chapel of Our Lady Without the Walls. Its success was immediate: it was copied and imitated throughout the century. Around the middle of the sixteenth century, Mary of Hungary, sister of Charles V and governor of the Netherlands, obtained it from the guild, which received in exchange an organ and a painted copy by Michiel Coxcie. The work then travelled to Spain, where Philip II, Mary’s nephew, had it placed in the monastery of El Escorial. It remained there for nearly four centuries before joining the Prado in 1939. It is today one of the masterpieces of its collection of Early Netherlandish paintings."""
facture = """
Rogier composes in a frieze, like a sculptor: the ten figures fill the whole width of the panel, with no landscape or sky, before a gilded ground that closes off the space. The bodies interlock in one long curve running from the Virgin to Christ, then to Magdalene. The colours, the intense blue of Mary’s mantle, the red of Saint John, the gold brocade of the old man who carries the legs, are laid on in brilliant glazes, in the manner of Van Eyck. But where Van Eyck observes, Rogier dramatises: the angular drawing of the drapery and the expression of the faces serve above all emotion."""
details = [
  "In the gilded upper corners, tiny crossbows recall the patrons.",
  "The transparent tears running down the cheeks of the Virgin and Saint John.",
  "Near the Virgin’s hand, Adam’s skull and a bone, at the foot of Golgotha.",
  "The curve of Mary’s body, which echoes that of Christ just above.",
  "The gold brocade, woven with plant motifs, of the old man to the right of Christ.",
]
themes = ["passion", "grief", "compassion", "religion", "altarpiece"]
anecdote = """
The panel is not rectangular: a projection at the centre of the upper edge shelters the top of the cross and the ladder, hence the black corners in the reproduction. This shape, common in the carved altarpieces of the period, reinforces the illusion of a group of statues in their case."""
salle = 2
mur = "sud"
place = 2
largeur = 2.6

[[oeuvres]]
titre = "Portrait of a Man with a Roman Medal"
artiste = "Hans Memling"
annee = "c. 1474–1480"
image = "homme-medaille.jpg"
technique = "Oil on panel, 31 × 23.2 cm"
collection = "Royal Museum of Fine Arts (KMSKA), Antwerp"
note = "An Italian in Flanders displays a coin bearing the effigy of Nero before a peaceful landscape: a humanist portrait by the most sought-after painter in Bruges."
description = """
A man dressed in black, wearing a dark cap, stands in three-quarter view, very close to us, as if behind a window. His curly brown hair frames a calm face, its gaze turned towards the viewer. The collar of his white shirt, gathered, is fastened with a lace. In the lower right corner, his hand holds between its fingers a bronze coin in which one recognises the laureate profile of the Emperor Nero. Behind him opens a peaceful landscape: wooded hills, a pond where swans glide, a small rider on a white horse, a palm tree, and in the distance a castle on a height, beneath a clear sky dotted with light clouds."""
evocation = """
The medal is the key to the painting. To hold an ancient coin is to present oneself as a humanist, a lover of that Antiquity which Italy was then rediscovering with passion. The Italian-style clothing and this taste for antiquities have led scholars to look for the sitter among the Italians present in Flanders. The Venetian diplomat Bernardo Bembo, on embassy to Charles the Bold in the early 1470s, has been proposed, whose emblems were precisely the laurel and the palm, both present in the painting; others have thought of a medallist or a collector. No hypothesis is proven. The portrait in any case expresses the meeting of two worlds: Flemish precision in the service of Italian humanist culture."""
histoire = """
Settled in Bruges since 1465, Memling counted among his clients many Italians: bankers of the Medici branch, merchants, visiting diplomats, who took his portraits back to their own country. This small panel, painted to be held in the hand or placed on a piece of furniture, doubtless belongs to this clientele. Its early history is poorly known: it is found in Lyon at the beginning of the nineteenth century, before entering the museum in Antwerp, which holds it under inventory number 5. The museum now displays it under the name of Bernardo Bembo, with caution. It is among Memling’s most studied portraits, for it illustrates the close ties between Flemish painters and their Italian patrons."""
facture = """
The painter brings together two traditions. From Flemish portraiture he keeps the three-quarter pose, the precision of the flesh tones and the almost tangible rendering of the hand that holds out the medal at the edge of the picture, as on a window ledge. But instead of the usual black background, he opens behind the sitter a luminous landscape, painted in aerial perspective: the greens grow paler and bluer as they recede. The range is restrained, black, white, flesh, against the azure of the sky, and the tracing of the curls, lock by lock, shows the finesse of the oil brush."""
details = [
  "On the coin, the Latin inscription bearing Nero’s name surrounds his laureate profile.",
  "At the very bottom, in the centre, two laurel leaves, perhaps an emblem of the sitter.",
  "On the right, a palm tree, hardly a Flemish tree, at the edge of the pond.",
  "On the water, swans, and on the bank a tiny rider on a white horse.",
  "The fine network of cracks in the paint, clearly visible on the face.",
]
themes = ["portrait", "humanism", "antiquity", "landscape", "italy"]
anecdote = """
Memling is regarded as the first painter north of the Alps to have placed a portrait before an open landscape. The idea was a great success in Italy: it soon appears in the work of the portraitists of Florence and Venice, from Perugino to the young Raphael."""
salle = 2
mur = "est"
place = 1
largeur = 0.75

[[oeuvres]]
titre = "The Garden of Earthly Delights"
artiste = "Jérôme Bosch"
annee = "c. 1490–1500"
image = "jardin-des-delices.jpg"
technique = "Oil on oak panels, triptych open, 205.5 × 384.9 cm"
collection = "Museo del Prado, Madrid"
note = "Paradise, a garden of strange pleasures, then hell: the most mysterious of triptychs, to be read from left to right like a history of humanity."
description = """
Open, the triptych is read from left to right. The left wing shows the earthly paradise: God presents Eve, just created, to the awakening Adam, among animals both familiar and exotic, a giraffe, an elephant, near a strange pink fountain. The large central panel is an immense garden peopled by hundreds of nude bodies, men and women, who bathe, embrace, ride in a ring around a pool, and slip into shells, glass bubbles and giant fruits, strawberries, cherries, blackberries. On the right, hell, plunged in night and fires: musical instruments turned into instruments of torture, a bird-headed monster devouring the damned, and a tree-man whose body is a broken eggshell."""
evocation = """
The meaning of the triptych has been debated for centuries. The most widespread reading sees in it a warning: between the creation of the first couple and damnation, the central garden would show humanity given over to the pleasures of the senses, a voluptuousness as fragile as the ripe fruits and the glass bubbles that shelter it. Others have seen in it a paradise of lost innocence, or, in the twentieth century, the secret ideal of a sect. Fruits, birds and fish then carried erotic connotations that the educated public knew how to read. Bosch, a fervent Catholic and member of a religious confraternity in his town, paints less a dream than a sermon, but a sermon of such unbridled invention that the Surrealists adopted him as an ancestor."""
histoire = """
In 1517, a year after Bosch’s death, Antonio de Beatis, secretary to a cardinal on a journey, described the painting in the palace of the Counts of Nassau in Brussels: it was no doubt a commission from this great family of the Burgundian court, perhaps from Henry III of Nassau. In 1568 the Duke of Alba confiscated it from William of Orange, heir of the Nassaus and leader of the revolt of the Netherlands, and it passed to a natural son of the duke, Fernando de Toledo. On the latter’s death, Philip II bought it and sent it in 1593 to the monastery of El Escorial. It joined the Prado in 1939. Its present title is modern: the Spanish inventories called it, among other names, the painting of the strawberry tree, whose red fruits dot the garden."""
facture = """
Bosch paints quickly and lightly, in thin layers over a pale ground that makes the colours glow: tender pinks, porcelain blues, acid greens in the garden, blacks and the red glow of fire in hell. The underdrawing, revealed by infrared imaging, shows that he altered his figures as he worked. The composition, with its very high horizon, stacks the planes without a unified perspective, which allows a host of episodes to be displayed, legible one by one. When closed, the wings show in grisaille the world on the third day of Creation: a transparent globe in which the earth emerges from the waters."""
details = [
  "In hell, a line of music on the buttocks of a damned man crushed beneath a lute.",
  "The tree-man of hell, with his melancholy face, sometimes taken for a self-portrait.",
  "An owl keeps watch in the round opening of the fountain in paradise.",
  "At the centre, a ring of nude riders circles a pool of bathing women.",
  "In hell, two giant ears, pierced by an arrow, push along a knife blade.",
]
themes = ["paradise", "hell", "sin", "fantastic", "triptych", "desire"]
anecdote = """
In 2014, an American student transcribed the short melody painted on the buttocks of a damned soul in hell, then played it and put it online: this five-hundred-year-old music of hell went around the Internet."""
salle = 2
mur = "ouest"
place = 2
largeur = 3.6

[[oeuvres]]
titre = "Self-Portrait in a Fur-Collared Robe"
artiste = "Albrecht Dürer"
annee = "1500"
image = "autoportrait-durer.jpg"
technique = "Oil on lime panel, 67.1 × 48.9 cm"
collection = "Alte Pinakothek, Munich"
note = "At twenty-eight, Dürer paints himself full-face, in the manner of an image of Christ: the artist proclaims himself a creator."
description = """
Against an almost black background, a man of twenty-eight faces the viewer, in almost perfect symmetry. His long curly hair, a golden brown, falls in regular ringlets over his shoulders; a neat beard frames a grave face with fixed eyes. He wears a brown coat edged with thick fur, with slashed sleeves, whose collar his hand, at the bottom of the picture, brushes. On the left, at eye level, the date 1500 surmounts his famous monogram, a large A straddling a D. On the right, a Latin inscription in gold letters states who he is, where he comes from, and at what age he portrayed himself. Nothing else: no setting, no object, no attribute of his trade."""
evocation = """
Never before had a painter portrayed himself in this way. The frontal pose, until then reserved for images of Christ, the symmetry, the hair falling like that of the Saviour in icons: everything invites us to see Dürer in the likeness of Christ. This is not blasphemy but an idea of his time: man is created in the image of God, and the artist, through his gift, participates in the divine creative power. The hand, at the centre of the lower edge of the picture, is the instrument of this gift. The work also expresses the ambition of a goldsmith’s son who wants painting to be recognised as a liberal art, worthy of a scholar and a humanist, and no longer as a mere manual trade."""
histoire = """
Dürer painted this panel in Nuremberg in 1500, a year full of expectation, which many believed to be close to the end of time. It had no patron: it is an affirmation of self, made at a moment when, back from Venice, he measured the gap between the prestige of Italian painters and the condition of craftsman of those in the North. The portrait remained for a long time in Nuremberg, where it eventually entered the city’s collections and was displayed in the town hall. In 1805 it was bought for the Bavarian collections and came to Munich; it has hung since 1836 in the Alte Pinakothek, of which it has become one of the most famous works."""
facture = """
Dürer builds his face on a geometric framework, seeking the ideal proportions that he would study all his life. The triangle of the hair, the vertical axis of the nose and the strict frontality give the image the stability of a statue. Against the dark ground, the light comes from the left and models the face gently. Every lock of hair, every hair of the fur is drawn with the finest brush, with the precision of an engraver accustomed to the burin. The few brown and golden tones unify the whole."""
details = [
  "On the left, the date 1500 above the AD monogram, famous throughout Europe.",
  "On the right, in Latin: Dürer of Nuremberg portrayed himself thus, in his own colours, at the age of 28.",
  "The hand with its slender fingers, pinching the fur collar at the bottom of the picture.",
  "The curls, painted one by one, which catch the light like threads of gold.",
  "On the left shoulder of the picture, the slashed sleeve revealing a striped lining.",
]
themes = ["self-portrait", "artist", "humanism", "christ", "identity"]
anecdote = """
Dürer had already drawn himself in silverpoint at the age of thirteen, in 1484. This drawing, often considered the oldest self-portrait of a child in European art, is kept in the Albertina in Vienna, a stone’s throw from the Kunsthistorisches Museum."""
salle = 3
mur = "nord"
place = 2
largeur = 0.85

[[oeuvres]]
titre = "Judith with the Head of Holofernes"
artiste = "Lucas Cranach l'Ancien"
annee = "c. 1530"
image = "judith-cranach.jpg"
technique = "Oil on lime panel, 87.7 × 58.1 cm"
collection = "Kunsthistorisches Museum, Vienna"
note = "The biblical heroine, dressed like a princess of the Saxon court, rests her hand on the head of the general she has just beheaded."
description = """
A young woman, seen half-length, stands behind a stone parapet against a black background. She wears a vast red velvet hat, behind which white feathers float, a red dress with an embroidered bodice and puffed sleeves tied with black laces, and several necklaces worn one over another. Her long red hair falls to her waist. In her right hand, gloved and covered with rings, she holds a great sword upright; with her left she rests her fingers on the bearded head of Holofernes, placed on the parapet, mouth half open and eyes rolled back. Her pale, smooth face betrays no emotion: she gazes into the distance, as if indifferent to her deed."""
evocation = """
The Book of Judith tells how a widow of Bethulia, a city besieged by the Assyrian army, seduces the general Holofernes and then beheads him in his sleep, saving her people. Judith embodies virtue and courage triumphing over brute force; in the age of the Reformation she was also read as the image of the weak who, with God’s help, strike down the tyrant. But Cranach also makes her a figure of seduction: dressed in the latest fashion of the German courts, she joins the gallery of ambiguous heroines, Salome, Lucretia, Venus, that his workshop multiplied for a princely clientele. The contrast between her impassive calm and the severed head creates a disquiet that is at once moral and erotic."""
histoire = """
Around 1530, Cranach had been for a quarter of a century the painter of the Electors of Saxony at Wittenberg, where he ran a vast workshop. The theme of Judith enjoyed great success there in the 1530s: numerous versions are known, in bust or half-length, sometimes paired with a Salome. This panel is mentioned in the imperial collections in Vienna as early as the 1610s, at the time when the Habsburgs, beginning with Emperor Rudolf II, were avidly seeking the German painting of the generation of Dürer. It now belongs to the rich group of works by Cranach in the Kunsthistorisches Museum, which makes it possible to follow the development of the painter and his workshop."""
facture = """
Cranach paints on lime wood with great sharpness: precise contours, smooth surfaces, frank colours without pronounced gradations. Red dominates, from the hat to the sleeves, and stands out against the black ground that cuts out the silhouette like an emblem. The figure, brought close and cropped at the waist, stands behind a parapet that serves both as a table and as a boundary between the image and ourselves. The face, with barely indicated modelling, follows a female type that is almost identical from one painting to another, almond eyes, high forehead, small chin, which the workshop reproduced from models."""
details = [
  "On the left, near the head, the painter’s tiny signature: a winged serpent.",
  "The slashed gloves, over which gold rings are slipped.",
  "The sword blade, held upright, which borders the picture like a column.",
  "The white feathers floating in the black behind the hat.",
  "Holofernes’ severed neck, at the bottom of the picture, of raw realism.",
]
themes = ["bible", "heroine", "seduction", "fashion", "court"]
anecdote = """
The winged serpent that signs the painting comes from the coat of arms granted to Cranach in 1508 by Elector Frederick the Wise. Around 1537 its wings, previously raised, droop like those of a bird: a valuable clue for dating the workshop’s works."""
salle = 3
mur = "sud"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "The Ambassadors"
artiste = "Hans Holbein le Jeune"
annee = "1533"
image = "ambassadeurs.jpg"
technique = "Oil on oak panel, 207 × 209.5 cm"
collection = "National Gallery, London"
note = "Two young Frenchmen in London, surrounded by the instruments of learning, and a distorted skull floating at their feet."
description = """
Two life-size men, shown full-length, flank a two-tiered shelf before a green damask curtain. On the left, Jean de Dinteville, ambassador of Francis I to Henry VIII, wears a pink satin doublet, a wide black coat lined with fur and the medallion of the Order of Saint Michael. On the right, his friend Georges de Selve, Bishop of Lavaur, is dressed in a plainer long brown robe. On the upper shelf, covered with an Oriental carpet, are astronomical instruments: a celestial globe, sundials, a torquetum. On the lower shelf are a terrestrial globe, an arithmetic book, a lute, a case of flutes and a hymn book. In the foreground, a whitish, elongated shape cuts obliquely across the pavement."""
evocation = """
The painting celebrates two cultivated men at the height of their youth and learning: sciences of the heavens above, sciences of the earth, of number and of music below. But everything in it is undermined. A string of the lute is broken, a possible image of discord; the book lies open at Lutheran hymns, while Europe is tearing itself apart between Catholics and Reformers and England is that year starting its break with Rome. The oblique shape in the foreground is a skull, visible only from the side: a memento mori reminding us that death effaces all glory. In the upper left corner, half hidden by the curtain, a small crucifix seems to offer the only recourse."""
histoire = """
In the spring of 1533, Georges de Selve visited Jean de Dinteville in London, where he was on a mission to Henry VIII at the time of the king’s marriage to Anne Boleyn. Dinteville commissioned from Holbein, who had returned to settle in England the previous year, this life-size double portrait, which he took back to his château at Polisy, in Champagne. The painting left the family in the seventeenth century, passed through several sales and reached England at the end of the eighteenth century. The National Gallery acquired it in 1890 from the Earl of Radnor. For a long time the identity of the two men was unknown: they were identified with certainty only around 1900, notably thanks to the name Polisy inscribed on the terrestrial globe."""
facture = """
Holbein unites Flemish precision with Italian monumentality. Every material is rendered with astonishing exactness: the silk, the velvet, the fur, the brass of the instruments, the patterns of the carpet. The skull is an anamorphosis, an image deliberately distorted by a perspective calculation, which resolves itself only when seen at a raking angle. The pavement reproduces the design of the marble floor of the sanctuary of Westminster Abbey. The almost square composition rests on a stable symmetry that the oblique of the skull breaks."""
details = [
  "On the scabbard of Dinteville’s dagger, his age: 29.",
  "On the edge of the book on which Georges de Selve leans, his age: 25.",
  "In the upper left corner, half hidden by the curtain, a small crucifix.",
  "On the lute, a broken string.",
  "On the terrestrial globe, in France, the name Polisy, Dinteville’s château.",
]
themes = ["portrait", "knowledge", "vanity", "death", "diplomacy", "anamorphosis"]
anecdote = """
It has been supposed that the painting hung near a door or a staircase: passing at an angle, the visitor would suddenly see the skull straighten itself. At the National Gallery, people still press themselves against the wall, at the edge of the painting, to see it appear."""
salle = 3
mur = "est"
place = 2
largeur = 2.1

