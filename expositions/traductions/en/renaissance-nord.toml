[[oeuvres]]
titre = "The Hunters in the Snow (Winter)"
artiste = "Pieter Bruegel l'Ancien"
annee = "1565"
image = "chasseurs-dans-la-neige.jpg"
technique = "Oil on oak panel, 116.5 × 162 cm"
collection = "Kunsthistorisches Museum, Vienna"
note = "Three hunters return almost empty-handed, the frozen valley at their feet: one of the most famous winter landscapes in the world."
description = """
In the foreground, three weary hunters climb a snow-covered hill, followed by their dogs with drooping heads; one carries a meagre fox on his back. On the left, in front of an inn whose sign hangs crookedly, villagers keep up a great fire to singe a pig. A row of bare black trees punctuates the descent towards the valley, where frozen ponds extend, covered with tiny skaters and players. Further off, a village, a church, a mill gripped by ice, then, on the horizon, improbable Alpine peaks beneath a green-grey sky. Crows perch on the branches; a magpie hovers above the void."""
evocation = """
The painting captures winter as it was lived: the cold, the hunger, the weariness of the return, but also the play and communal life that carry on. It has often been read as the unchanging cycle of the seasons and the modest place of man in nature. The hunters’ meagre catch, a single fox, contrasts with the joyful bustle of the skaters: hardship and joy coexist. The painting has also been linked to the harsh winters of those years, at the heart of what is called the Little Ice Age, even though Bruegel composes an ideal landscape rather than a faithful view: his mountains are nothing like Flanders."""
histoire = """
The panel belongs to a series of six paintings devoted to the times of the year, commissioned by the Antwerp merchant Niclaes Jongelinck for his residence. Five survive: three are in Vienna, The Hunters in the Snow, The Gloomy Day and The Return of the Herd, one in Prague, The Hay Harvest, and one in New York, The Harvesters. In 1594 the city of Antwerp presented the series to Archduke Ernest of Austria, governor of the Netherlands. On his death the following year, the paintings passed to his brother, Emperor Rudolf II, and then joined the collection of Archduke Leopold Wilhelm and the imperial collections in Vienna."""
facture = """
The composition rests on a great diagonal: the line of trees and hunters leads the eye from the left corner into the depths, in a single sweep, as far as the mountains. The palette is reduced to three registers: the white of the snow, the browns and blacks of the figures and trees, the cold, bluish green of the ice and sky. This economy is enough to convey the silence of the frozen air. The dark silhouettes against a white ground and the plunging view recall the print. Bruegel, who had crossed the Alps, recomposes his memories of mountains in an imaginary valley."""
details = [
  "The inn sign, half unhooked: a stag and a kneeling saint.",
  "The meagre fox carried by one of the hunters, the only game of the day.",
  "The footprints of men and dogs in the fresh snow.",
  "At lower right, the mill wheel, frozen by the ice.",
  "The magpie hovering above the valley, the only moving speck in the sky.",
]
themes = ["winter", "landscape", "seasons", "hunting", "village", "snow"]
anecdote = """
The filmmaker Andrei Tarkovsky admired this painting: in Solaris (1972), his camera lingers over its details, like a memory of Earth for a hero lost in space, and he recaptures its atmosphere in a snowy landscape in The Mirror (1975)."""
salle = 4
mur = "nord"
