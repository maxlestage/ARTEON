[[artistes]]
nom = "Jan van Eyck"
vie = "Maaseik (?), c. 1390 – Bruges, 1441"
biographie = """
Jan van Eyck first appears in documents in 1422, in The Hague, in the service of John of Bavaria, Count of Holland. In 1425 he became painter and valet de chambre to Philip the Good, Duke of Burgundy, one of the richest princes in Europe, who paid him a pension and entrusted him with secret missions. In 1428–1429 he accompanied the embassy sent to Portugal to negotiate the duke’s marriage to the Infanta Isabella, whose portrait he painted. Around 1430 he settled in Bruges, where he married; the duke held one of his children at the baptismal font. In 1432 he completed the great polyptych of the Ghent Altarpiece, begun by his brother Hubert, who died in 1426. There followed some twenty signed or attributed paintings: portraits of striking presence, such as Man in a Red Turban or The Arnolfini Portrait, and altarpieces such as The Madonna of Chancellor Rolin. He died in Bruges in 1441, celebrated as the foremost painter of his time."""
style = """
Van Eyck brought oil painting to a perfection never before attained: through superimposed glazes, he renders the light, transparency and texture of every material, from brocade to wrinkled skin. His gaze embraces both the immense and the minute, a distant landscape and a reflection in a pearl. His realism, laden with religious symbols, founded the school of the Early Netherlandish painters and fascinated Italy, which sought out his paintings. His motto, Als ich can, “as best I can”, displays a purely rhetorical modesty."""

[[artistes]]
nom = "Rogier van der Weyden"
vie = "Tournai, c. 1399–1400 – Brussels, 18 June 1464"
biographie = """
Born in Tournai as Rogier de le Pasture, he trained in the workshop of Robert Campin, where he is recorded as an apprentice in 1427, and became a master in 1432. Around 1435 he settled in Brussels, of which he became the official painter, and translated his name into Flemish. For the town hall he painted large panels on justice, now destroyed, which were admired by travellers. He ran a very active workshop and received commissions from across Europe: from Chancellor Nicolas Rolin, for whom he painted the Last Judgement of the Hospices de Beaune, from the Burgundian court, from Italian merchants and princes. In 1450, a jubilee year, he travelled to Rome. Rich and respected, he died in Brussels in 1464. His influence, spread by his pupils and by countless copies, dominated Flemish, German and Spanish painting until the early sixteenth century."""
style = """
Rogier van der Weyden takes up Van Eyck’s precision but puts it in the service of emotion. His compositions, often in a frieze, have the clarity of sculpted reliefs; his angular lines, broken drapery and tearful faces give grief a new intensity. A refined portraitist, he created a type of aristocratic portrait, elegant and restrained, against a neutral ground. Copied for decades, his models made him the most imitated painter in northern Europe in the fifteenth century."""

[[artistes]]
nom = "Hans Memling"
vie = "Seligenstadt (Hesse), c. 1430–1440 – Bruges, 11 August 1494"
biographie = """
Hans Memling was born in Germany, at Seligenstadt, near Frankfurt. Nothing is known of his training, but his art suggests a period in the workshop of Rogier van der Weyden in Brussels. In 1465 he obtained citizenship of Bruges, one of the great commercial centres of Europe, where he spent the rest of his life. There he became the most sought-after painter in the city: his clients were Italian bankers and merchants, such as Tommaso Portinari, representative of the Medici, as well as Englishmen, members of the Burgundian court and religious institutions. His great Last Judgement, destined for Florence, was captured at sea in 1473 by a privateer from Danzig and is still in Gdańsk. For the Hospital of Saint John in Bruges he painted several altarpieces and the Shrine of Saint Ursula, completed in 1489, still preserved there. In 1480 he was among the city’s largest taxpayers. On his death in 1494, a Bruges notary noted that he was reputed to be the most skilful painter in all Christendom."""
style = """
Memling softens the legacy of Van Eyck and Rogier: his calm figures, with oval, serene faces, are bathed in an even light and peaceful landscapes. His drawing is limpid, his colour fresh, his compositions balanced and symmetrical. A sought-after portraitist, he places his sitters before windows or open landscapes, a formula that Italian painters adopted with enthusiasm. Long neglected, he was rediscovered in the nineteenth century by the Romantics, who saw in him the purest of the Early Netherlandish painters."""

[[artistes]]
nom = "Jérôme Bosch"
vie = "’s-Hertogenbosch, c. 1450 – ’s-Hertogenbosch, August 1516"
biographie = """
Jheronimus van Aken was born around 1450 in ’s-Hertogenbosch, a prosperous town in the Duchy of Brabant, into a family of painters: his grandfather, his father and his uncles practised the trade. He signed his works with a name drawn from that of his town, Jheronimus Bosch. Around 1480 he married Aleid van de Meervenne, from a well-to-do family, who brought him fortune and land. He was a member of the Illustrious Brotherhood of Our Lady, an influential religious association for which he carried out various works. He seems scarcely to have left his town, but his reputation spread far: Philip the Handsome, Duke of Burgundy, commissioned from him a large Last Judgement in 1504, and his paintings were sought after by collectors in the Netherlands, Italy and Spain. He died in 1516; the brotherhood celebrated his funeral on 9 August. After his death his inventions were imitated and copied in profusion. King Philip II of Spain, his most fervent admirer, gathered his works at El Escorial, from which come those now kept in the Prado."""
style = """
Bosch invented a world without equivalent: hybrid creatures, half men and half objects, demons, giant fruits, organic architecture. Beneath the fantasy lies a moralist who denounces the sins and folly of mankind, with a vocabulary nourished by proverbs, sermons and popular beliefs. His painting, quick and fluid, in bright colours on light grounds, breaks with the meticulous finish of his predecessors. Imitated from the sixteenth century, notably by Bruegel, he was hailed in the twentieth century as a forerunner of Surrealism."""

[[artistes]]
nom = "Albrecht Dürer"
vie = "Nuremberg, 21 May 1471 – Nuremberg, 6 April 1528"
biographie = """
The son of a Hungarian goldsmith settled in Nuremberg, Albrecht Dürer first learned his father’s trade, then in 1486 entered the workshop of the painter Michael Wolgemut. After four years of travel in the Rhineland, he married Agnes Frey in 1494 and left at once for Venice, where he discovered Italian painting. Back in Nuremberg, he published in 1498 the Apocalypse, a series of large woodcuts that made him famous throughout Europe. He returned to Venice from 1505 to 1507 and painted there the Feast of the Rosary for the city’s German merchants. From 1512 he worked for Emperor Maximilian I, who granted him a pension. His three most famous engravings, including Melencolia I, date from 1513–1514. In 1520–1521 he travelled to the Netherlands, where the artists of Antwerp received him like a prince, and met Erasmus. He devoted his last years to treatises on geometry, fortification and human proportions, and died in Nuremberg in 1528."""
style = """
Dürer combines Northern precision with the Italian science of perspective and proportion, which he was the first German to study as a theorist. An unequalled printmaker, he brought woodcut and copper engraving to a fineness never seen before, and thus spread his art throughout Europe. His watercolours of plants, animals and landscapes are among the first independent studies of nature. Through his self-portraits, he also imposed a new image of the artist, as scholar and creator."""

[[artistes]]
nom = "Lucas Cranach l'Ancien"
vie = "Kronach (Franconia), c. 1472 – Weimar, 16 October 1553"
biographie = """
Lucas Cranach takes his name from his native town, Kronach, in Franconia, where he trained under his father, a painter. Around 1501 he was in Vienna, where he painted portraits of humanists and religious scenes set in great forest landscapes. In 1505 Elector Frederick the Wise of Saxony called him to Wittenberg as court painter, a post he held under three successive electors. In 1508 he received a coat of arms bearing a winged serpent, which became his signature. He ran a highly productive workshop, with his sons Hans and Lucas, and became one of the richest men in the town: he owned a pharmacy, a printing house, houses, and he was several times burgomaster. A friend of Martin Luther, he made numerous portraits of him and illustrated his writings: he became the painter of the Reformation. After the defeat of the Protestant princes in 1547, he joined Elector John Frederick in his captivity, then followed him to Weimar, where he died in 1553."""
style = """
Cranach invented an appealing and immediately recognisable court art: clean contours, bright colours laid on in flat areas, dark or plain grounds, slender female bodies with small faces. His Venuses, Judiths and Lucretias, as elegant as they are ambiguous, mingle morality and eroticism. An efficient portraitist, he fixed the image of Luther and the Protestant princes, circulated in series by his workshop. His style, long judged mannered, has fascinated modern artists, Picasso foremost among them."""

[[artistes]]
nom = "Hans Holbein le Jeune"
vie = "Augsburg, c. 1497–1498 – London, 1543"
biographie = """
The son of the painter Hans Holbein the Elder, he learned the craft in Augsburg before settling in Basel around 1515. There he drew for the town’s great printers, painted façades and altarpieces, and made several portraits of Erasmus, the most famous humanist of his time. His engravings of The Dance of Death, designed in the 1520s, made him known throughout Europe. When the Reformation reached Basel and religious commissions became scarce, he left for London in 1526, armed with a recommendation from Erasmus to Thomas More, whose family he painted. Returning to Basel in 1528, he went back to England for good in 1532. There he portrayed the German merchants of the Hanseatic League, then entered the service of Henry VIII, whose painter he became around 1536: he fixed the image of the king, his wives and his ministers. In 1539 he was sent to paint Anne of Cleves, whom the king married before repudiating her a few months later. He died in London in the autumn of 1543."""
style = """
Holbein is the most precise portraitist of the Renaissance: his preparatory drawings, executed in a few sittings, capture a face with an unflattering objectivity, then the painting renders every fabric and every jewel with a goldsmith’s sharpness. He combines Flemish realism with the breadth and clarity of composition learned from Italy. His portraits of Henry VIII and his court have shaped the image we keep of Tudor England."""

[[artistes]]
nom = "Pieter Bruegel l'Ancien"
vie = "Brabant (?), c. 1525–1530 – Brussels, 9 September 1569"
biographie = """
Almost nothing is known of his youth, nor even his exact place of birth. In 1551 he was admitted as a master to the Guild of Saint Luke in Antwerp. He soon left for Italy, where he stayed notably in Rome, until about 1554; he crossed the Alps on the way there and back and brought back drawings of mountains. In Antwerp he worked for the print publisher Hieronymus Cock, at the sign of the Four Winds, who engraved and circulated his compositions: landscapes, proverbs, deadly sins in the manner of Bosch. From the late 1550s he devoted himself more to painting. In 1563 he married in Brussels Mayken Coecke, daughter of the painter Pieter Coecke van Aelst, and settled in that city. There he painted, for wealthy patrons such as Niclaes Jongelinck or Cardinal Granvelle, the series of the Seasons, the peasant scenes and the parables of his last years. He died in 1569, leaving two sons still children, Pieter and Jan, who founded a dynasty of painters. About forty of his paintings are known, twelve of them in the Kunsthistorisches Museum."""
style = """
Bruegel looks at the world from above, in vast panoramas peopled with minute crowds, or from very close, among the peasants. An heir of Bosch in his taste for proverbs and satire, he makes nature and simple people true subjects of painting. His stocky figures, frank colours and diagonal compositions are of exemplary legibility. He opened the way for genre painting and for Dutch landscape of the seventeenth century."""
