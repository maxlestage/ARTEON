[exposition]
ordre = 30
nom_court = "Northern Renaissance"
mouvement = "Early Netherlandish Painting and the Northern Renaissance"
cadre = "ebene"
couleur = "#3e4f6a"
titre = "Early Netherlandish Painting and the Northern Renaissance: The World Up Close"
artiste = "Van Eyck, Van der Weyden, Memling, Bosch, Dürer, Cranach, Holbein, Bruegel"
dates = "1434–1568"
accroche = "Virtual exhibition · Kunsthistorisches Museum, Vienna"
introduction = """
In Bruges, Brussels, Nuremberg and Antwerp, the painters of the North developed in the fifteenth and sixteenth centuries an oil painting of unprecedented precision, in which every reflection, every strand of fur, every blade of grass counts. The visit follows this thread across more than a century, from Van Eyck’s Arnolfini Portrait to Bosch’s Garden of Earthly Delights, and from the portraits of Dürer, Cranach and Holbein to Bruegel’s landscapes and village feasts. The building is modelled on the Kunsthistorisches Museum in Vienna: visitors enter beneath a tall domed hall, then pass into galleries with fabric-covered walls, including a great Bruegel room, like the one in which Vienna brings together the richest collection of his paintings in the world."""
vitrine = "chasseurs-dans-la-neige.jpg"

[musee]
nom = "Kunsthistorisches Museum"
ville = "Vienna, Austria"
architecte = "Gottfried Semper and Carl von Hasenauer"
construction = "1871–1891"
presentation = """
On Vienna’s Ringstrasse, Emperor Franz Joseph had two twin palaces built facing one another, one for the natural sciences, the other for the art collections amassed by the Habsburgs over the centuries. Designed by Gottfried Semper and Carl von Hasenauer, the Kunsthistorisches Museum was built between 1871 and 1891 and opened in the latter year. Behind its neo-Renaissance façades crowned by a dome, a grand marble staircase, decorated with paintings by Hans Makart and Gustav Klimt, leads to the domed hall and then to the picture galleries, lit by skylights and hung with fabric-covered walls. Here one finds the Titians, Rubenses and Velázquezes of the Habsburgs, Dürer’s portraits and above all a dozen paintings by Pieter Bruegel the Elder, the richest collection of his work in the world, gathered in a single room. The museum also holds the Habsburg Kunstkammer, with Benvenuto Cellini’s gold salt cellar."""
ici = """
The ARTEON building recreates the heart of the Viennese museum: a tall domed hall from which one reaches the picture galleries. Visitors enter from the south into the square domed hall, sixteen metres high. To the west opens Room I · The Early Netherlandish Painters, with warm beige walls; to the east, Room II · The German Renaissance, with pale green walls, two square rooms twelve metres on each side and seven metres high. To the north, on the central axis, the Bruegel room, the largest, eighteen metres wide, with pinkish-beige walls, brings the visit to a close."""

