titre = "The Tower of Babel"
artiste = "Pieter Bruegel l'Ancien"
annee = "1563"
image = "tour-de-babel.jpg"
technique = "Oil on oak panel, 114 × 155 cm"
collection = "Kunsthistorisches Museum, Vienna"
note = "A colossal tower, inspired by the Colosseum, rises beside a Flemish harbour: humanity’s dream of pride, already cracking."
description = """
An immense tower, round and tiered, occupies the centre of the picture and rises above the clouds. Built around a rocky outcrop, it combines the arcades of an ancient amphitheatre with scaffolding, cranes and ramps along which carts travel. The lower storeys, in pale stone, already seem worn, while the summit, in red brick, is still under construction. At its foot stretches a Flemish town with tightly packed roofs and, on the right, a harbour where ships and wooden rafts are moored. In the left foreground, King Nimrod, in a light cloak, inspects the site with his retinue; before him, stonemasons kneel and prostrate themselves."""
evocation = """
Genesis tells how men, all speaking one language, wished to build a tower whose summit would touch heaven; God confounded their tongues and scattered them. Bruegel makes of it a meditation on pride. King Nimrod, to whom tradition attributes the undertaking, has himself venerated as an absolute sovereign, while the storeys, which are not horizontal, and the foundations laid directly on the rock seem to condemn the structure in advance. It has been seen as an allusion to Antwerp, a mercantile metropolis where all the languages of Europe then mingled, and to the vanity of great human projects. The Colosseum model evokes Rome, a symbol of power, but also of persecution for many contemporaries."""
histoire = """
Bruegel signed and dated the panel in 1563, the year of his marriage and of his settling in Brussels. He had seen the Colosseum during his journey to Italy about ten years earlier. In 1566 the painting belonged to the wealthy Antwerp merchant Niclaes Jongelinck, a great collector of his works. It later entered the collections of Emperor Rudolf II in Prague, a passionate lover of Flemish painting, and then the imperial collections in Vienna. Bruegel painted at least one other Tower of Babel, smaller and darker, now in the Museum Boijmans Van Beuningen in Rotterdam, where the tower, much taller, already pierces the clouds."""
facture = """
Bruegel describes the building site as an engineer would: treadwheel cranes driven by men walking inside, scaffolding, hoists, workmen’s huts, everything is observed with exactness, on a minuscule scale. The plunging view and the high horizon unite the tower, the town and the harbour in a single panorama. The light, coming from the left, gives relief to the pale mass of the tower, which stands out against the pale sky and the sea. The contrast between the monumental block and the multitude of small figures makes one feel the unmeasured scale of the undertaking."""
details = [
  "In the foreground, King Nimrod, crowned, and the kneeling stonemasons.",
  "To the right of the tower, a treadwheel crane driven by men walking inside.",
  "At the very top, a cloud already clings to the uppermost storeys.",
  "The storeys that are not parallel to the ground: the tower already seems to lean.",
  "In the harbour, ships unload materials and a wooden raft comes alongside.",
]
themes = ["bible", "pride", "architecture", "city", "building site"]
anecdote = """
Bruegel painted a third Tower of Babel, on ivory, mentioned in 1577 in the inventory of the famous miniaturist Giulio Clovio, whom he had known in Rome. It is now lost."""
salle = 4
mur = "ouest"
place = 2
