[[oeuvres]]
titre = "The Peasant Wedding"
artiste = "Pieter Bruegel l'Ancien"
annee = "1568"
image = "repas-de-noces.jpg"
technique = "Oil on oak panel, 113 × 164 cm"
collection = "Kunsthistorisches Museum, Vienna"
note = "In a barn, a village wedding banquet: the bride sits enthroned beneath her paper crown, and the dishes arrive on a door taken off its hinges."
description = """
The scene takes place in a barn whose back wall is made of piled sheaves of wheat. A long table, set diagonally, accommodates guests packed onto benches. At the centre, the bride, eyes half closed and hands clasped, sits before a green hanging from which a paper crown hangs. In the foreground, two men in aprons carry plates of porridge on a door taken off its hinges. On the left, a man pours beer into jugs; two bagpipers wait, one eyeing the dishes greedily; a child in an oversized cap licks his plate, sitting on the floor. At the far right, a Franciscan friar speaks to a man dressed in black, his sword at his side."""
evocation = """
Bruegel observes the peasant world without contempt or idealisation. The joy is simple, the food modest, the feast at once noisy and laborious. The groom himself cannot be found: according to a Flemish custom, he did not sit at the table of honour, and it has been suggested that he be recognised in the man who pours the drink or in the one who passes the dishes. Some see in the painting a criticism of gluttony; others read in it a real sympathy for the communal life of the village. The presence of the friar and the nobleman, come from other worlds, shows a whole society gathered around a table, with its hierarchies and exchanges."""
histoire = """
Painted in Brussels the year before Bruegel’s death, the painting belongs to the peasant scenes of his last years, along with The Wedding Dance and The Peasant Dance. It was bought in 1594 in Brussels by Archduke Ernest of Austria, governor of the Netherlands, then entered the collection of Archduke Leopold Wilhelm, himself governor of the Netherlands in the seventeenth century and a great collector, before joining the imperial collections in Vienna. The lower edge of the panel was trimmed, then completed with a five-centimetre strip. The composition was copied many times, notably by Pieter Brueghel the Younger, the painter’s son."""
facture = """
The table, set diagonally, creates immediate depth and leads the eye from the foreground to the back of the barn. The front figures, massive and almost cut off by the frame, are painted on a large scale, as if the viewer had just walked in. Bruegel distributes frank colours in a regular rhythm: reds of the caps and doublets, whites of the aprons and headdresses, the green of the hanging that sets off the bride. The gestures, the postures, the step of the bearers are observed with an accuracy that makes each guest a character."""
details = [
  "The paper crown hanging above the bride, before the green hanging.",
  "The bagpiper eyeing the plates of porridge.",
  "The child sitting on the floor, under an oversized red cap, licking his plate.",
  "The plates carried on a door taken off its hinges.",
  "At the back left, the crowd of guests pressing at the entrance to the barn.",
]
themes = ["feast", "peasants", "wedding", "meal", "village", "music"]
anecdote = """
According to the biographer Karel van Mander, writing in 1604, Bruegel and his friend the merchant Hans Franckert would disguise themselves as peasants to mingle at village fairs and weddings, bringing gifts as if they were part of the family."""
