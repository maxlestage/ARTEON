[exposition]
ordre = 120
nom_court = "Cézanne"
mouvement = "Post-Impressionism"
cadre = "dore"
couleur = "#b8642a"
titre = "Cézanne, the Construction of Colour"
artiste = "Paul Cézanne"
dates = "1839–1906"
accroche = "Virtual exhibition · Paul Cézanne"
introduction = """
Apples that seem carved from stone, motionless card players, the sea at L'Estaque and \
Mont Sainte-Victoire painted again and again: Cézanne builds the world with colour. \
Picasso called him “the father of us all”."""
vitrine = "panier-pommes.jpg"

[musee]
nom = "Musée Granet"
ville = "Aix-en-Provence, France"
presentation = """
In Aix-en-Provence, Cézanne's native town, the Musée Granet occupies the former priory \
of the Knights of Malta, a seventeenth-century building next to the church of \
Saint-Jean-de-Malte, in the Mazarin district. The town's museum moved in during the \
nineteenth century and took the name of the Aix painter François Marius Granet, who \
bequeathed it his collections. The young Cézanne attended the drawing school housed \
within the same walls, but the town long ignored his genius: its curator, Henri \
Pontier, is said to have sworn that no Cézanne would enter the museum in his lifetime. \
The museum today owns about ten works by the painter, largely on deposit from the \
State. Renovated and enlarged in 2006, for the centenary of Cézanne's death, it also \
displays, in the nearby chapel of the Pénitents blancs, the modern art collection \
assembled by Jean Planque, a friend of Picasso and Dubuffet."""
ici = """
ARTEON's building is only a simple evocation of it: three rooms in a row, connected by \
corridors, with no drawn plan. The visit begins with Room I · People and Things, with \
stone-beige walls, containing the portraits, the card players and the apples. A \
corridor leads to Room II · Provence, with pale grey-green walls, before the sea at \
L'Estaque and Sainte-Victoire, then to Room III · The Large Bathers, with bluish-grey \
walls, where the painter's last great canvas closes the visit."""

[[salles]]
nom = "Room I · People and Things"
theme = "1877–1895: portraits, card players and still lifes, built up touch by touch."
murs = "#ece4d6"

[[salles]]
nom = "Room II · Provence"
theme = "1885–1904: the sea at L'Estaque, the Château Noir and Mont Sainte-Victoire."
murs = "#e6e8df"

[[salles]]
nom = "Room III · The Large Bathers"
theme = "1900–1906: the last great canvas, unfinished, which opens the way to Cubism."
murs = "#e3e4ea"

[[oeuvres]]
titre = "Self-Portrait"
annee = "1878–1880"
image = "autoportrait.jpg"
technique = "Oil on canvas, 60.3 × 46.9 cm"
collection = "The Phillips Collection, Washington"
note = "A sidelong gaze, a head as solid as a block: Cézanne paints himself as he paints a mountain."
description = """
The painter shows himself in bust form, in three-quarter view, his body turned to the \
right and his head slightly turned towards us. The bald, brightly lit skull forms a \
broad pink and white dome; a fringe of brown hair curls at the nape and a bushy, dark \
beard eats into the lower face. The half-narrowed eyes observe us sideways, without a \
shadow of a smile. He wears a dark, brownish-green jacket whose collar forms sharp \
angles beneath the beard. Behind him, no setting, no painter's attribute: an olive \
background, brushed in uneven touches, darker on the left, more golden on the right. \
The figure fills almost the whole canvas, and the left edge lets the bare canvas \
show."""
evocation = """
Nothing here of the inspired or society artist: Cézanne observes himself with the same \
neutrality as an apple or a rock. Art historians have seen in it the moment when he \
gives up the dramatic effects of his early work for a patient, almost impersonal \
observation. The sidelong, slightly wary gaze fits what we know of the man: touchy, \
shy, easily offended, more and more withdrawn in Aix and fleeing the Paris of the \
salons. The face does not convey a passing emotion but an enduring presence, built up \
in masses. Around forty, still unknown to the public and mocked by critics, he \
represents himself as a stubborn worker rather than a recognised painter: a man who \
doubts everything except his method."""
histoire = """
Cézanne painted more than twenty self-portraits in oil, partly for lack of other \
models: he worked slowly, demanded long sittings, and few people agreed to pose for \
him. This one dates from 1878–1880. The painter was then dividing his time between \
Paris, L'Estaque and Aix; he had exhibited with the Impressionists in 1874 and 1877, \
amid the sarcasm of the press, then stopped taking part in their exhibitions. He lived \
frugally on the allowance paid by his father. Long held in private collections, the \
painting was acquired in the late 1920s by Duncan Phillips, a Washington collector who \
was among the first Americans to champion Cézanne and who had opened his own \
house-museum to the public in 1921."""
facture = """
The touch, still broad and thick, is laid down in parallel brushstrokes that follow \
the planes of the face: forehead, cheekbone, bridge of the nose. The modelling is \
achieved not through gradations of shadow but through the juxtaposition of pinks, \
ochres and cool greens. This way of building up with directed touches, matured through \
contact with Pissarro at Pontoise and Auvers, is what historians call his “constructive \
touch”. The restricted palette rests on the harmony of the olive green of the \
background and the rosy flesh. The outline of the jacket, reinforced with dark strokes, \
closes the form like a block."""
details = [
  "The top of the skull, laid in with almost white touches, catches all the light.",
  "The reddened ear, a small warm spot in the dark mass of the hair.",
  "The heavy, half-lowered eyelids, which give the gaze its suspicious air.",
  "On the left edge, a strip of bare canvas that the colour has not covered.",
]
themes = ["self-portrait", "gaze", "solitude", "construction"]
anecdote = """
A childhood friend of Émile Zola at the Aix school, Cézanne was often recognised in \
Claude Lantier, the failed painter of the novel L'Œuvre (1886). The polite letter in \
which he thanks Zola for sending the book is the last known between the two men."""
salle = 1
mur = "gauche"
place = 1
largeur = 0.85

[[oeuvres]]
titre = "Madame Cézanne in a Red Armchair"
annee = "c. 1877"
image = "madame-cezanne.jpg"
technique = "Oil on canvas, 72.4 × 56 cm"
collection = "Museum of Fine Arts, Boston"
note = "Hortense Fiquet, his companion, posed like a still life in the big red armchair."
description = """
Hortense Fiquet sits facing us in an ample, bright red upholstered armchair, whose \
arms curl on either side and from which passementerie tassels hang. She wears a \
grey-blue jacket with wide sleeves, closed at the neck by a large pale blue ribbon bow, \
and a long flounced skirt, striped with green, blue and mauve, which descends to the \
bottom of the painting. Her hands are crossed on her lap. Her oval face, framed by \
brown hair gathered in a bun, remains calm, with no marked expression. Behind her, a \
golden ochre wallpaper is strewn with small blue four-petalled flower motifs; at lower \
left, a dark green band marks the skirting board. The framing cuts off the armchair and \
the dress."""
evocation = """
The title speaks of the armchair as much as of the woman, and this is no accident: \
Cézanne looks at his companion with the same attention as at an object, without trying \
to flatter her or to tell her character. A coldness has often been read in these \
portraits, even the trace of a difficult couple; others see above all the patience of a \
model who accepted hours of motionless posing. The painting also evokes an almost \
clandestine life: in 1877, Cézanne was still hiding from his father the existence of \
Hortense and of their son. The great red mass that envelops the figure nevertheless \
gives her a monumental warmth and stability, like a casket, and the face-off between \
red and green makes this motionless scene vibrate."""
histoire = """
Cézanne met Hortense Fiquet, a young woman born in the Jura who worked as an artist's \
model, in Paris around 1869; their son Paul was born in 1872. He would paint her nearly \
thirty times, more than any other model. This portrait dates from about 1877, the year \
he exhibited for the last time with the Impressionists. The couple did not marry until \
April 1886, in Aix, a few months before the death of Louis-Auguste Cézanne, the \
painter's father. After the artist's death, the painting was among the works gathered \
at the Salon d'Automne of 1907 for the great retrospective that revealed Cézanne to a \
whole generation of painters. It entered the Museum of Fine Arts in Boston in 1944, \
bequeathed by the collector Robert Treat Paine II."""
facture = """
The stripes of the skirt are rendered with long juxtaposed vertical touches, green, \
blue and mauve, without blending: pure colour builds the volume and the movement of the \
folds. The red of the armchair and the green of the dress, complementary colours, \
heighten each other. The armchair itself is modelled not by shadow but by reds that are \
warmer or cooler, pinker or darker. Blue outlines encircle the forms in places. The \
almost symmetrical composition sets the figure in a pyramid at the centre of the \
canvas, firmly wedged against the flat ground of the wallpaper."""
details = [
  "The red tassels hanging on either side of the armchair.",
  "The big pale blue bow, the brightest point of the dress.",
  "The small blue wallpaper motifs, like four-petalled flowers.",
  "The crossed hands, reduced to a few planes of flesh.",
  "The dark green band at lower left, which anchors the composition.",
]
themes = ["portrait", "interior", "couple", "colour", "woman"]
anecdote = """
In October 1907, the poet Rainer Maria Rilke discovered this painting at the Salon \
d'Automne and devoted a long description to it in a letter to his wife, Clara, in which \
he analyses the dialogue of the reds and blues. His Letters on Cézanne have become a \
classic."""
salle = 1
mur = "droite"
place = 3
largeur = 0.9

[[oeuvres]]
titre = "Boy in a Red Waistcoat"
annee = "1888–1890"
image = "gilet-rouge.jpg"
technique = "Oil on canvas, 89.5 × 72.4 cm"
collection = "National Gallery of Art, Washington"
note = "Michelangelo di Rosa, a young Italian model, wearing a hat, hand on hip: Cézanne painted him at least four times."
description = """
A teenager stands in three-quarter view before a heavy drapery with vertical folds. He \
wears a broad-brimmed brown hat, a light shirt, a blue tie, a bright red waistcoat \
with lapels, a grey-blue jacket and brown-green trousers held by a dark blue belt. At \
left, his bent arm rests the hand on his hip; at right, the other arm hangs along his \
body, very long, the hand falling almost to the bottom of the painting. The pale face, \
with rosy cheeks, is turned towards us, the expression vague and a little absent. At \
lower left, the back of a wooden chair can be made out; behind, the hanging alternates \
leafy motifs, ochres and grey-green."""
evocation = """
The boy is not a character whose story one could tell: his name or his mood matter \
little. Cézanne turns this young man in picturesque costume into a motif of colours and \
lines, of which the red waistcoat is the glowing heart. The pose, hand on hip, recalls \
the formal portraits of tradition, but applied to a model of modest condition, it loses \
all arrogance. A teenage melancholy has often been read in it, a weary reverie \
reinforced by the faraway gaze. Above all, the liberty taken with the proportions of \
the body, for the sake of the canvas's balance, fascinated twentieth-century painters: \
painting no longer has to copy nature, it obeys its own laws."""
histoire = """
Cézanne painted this picture in Paris, around 1888–1890. His model was a young \
Italian, Michelangelo di Rosa, who posed for artists. The painter made at least four \
canvases from him, in different poses, as well as watercolours: they are now in \
Zurich, New York, Philadelphia and Washington. The Washington version belonged to the \
banker Jakob Goldschmidt. At the sale of his collection at Sotheby's in London, in \
October 1958, it was bought by the American collector Paul Mellon for £220,000, a \
record at the time for a painting sold at auction. This spectacular price made the \
front pages. Paul Mellon and his wife gave it to the National Gallery of Art in 1995."""
facture = """
The paint is laid on in broad flat touches that cut each surface into planes: the \
jacket in grey-blue facets, the drapery in oblique bands, the face in a few panels of \
pink and green flesh. The red of the waistcoat, placed at the centre, is the most \
intense note; all around, the blues and greens set it off. The outlines, reinforced \
with dark blue strokes, often remain open. Cézanne freely lengthens and deforms the \
limbs to balance the vertical composition. Certain areas, such as the trousers or the \
chair, are barely sketched, which lets the construction of the painting show."""
details = [
  "The broad-brimmed brown hat, set like a disc above the face.",
  "The blue tie, which answers the dark blue of the belt.",
  "On the right, the hand that hangs almost to the lower edge of the canvas.",
  "At lower left, the wooden chair back, barely sketched.",
  "The folds of the hanging, cut into broad bands of colour.",
]
themes = ["portrait", "youth", "model", "red", "colour"]
anecdote = """
Another version of the painting, held by the Bührle Foundation in Zurich, was stolen \
by armed men in February 2008, together with three other canvases. It was recovered \
only in 2012, in Serbia, during a police operation."""
salle = 1
mur = "gauche"
place = 2
largeur = 0.95

[[oeuvres]]
titre = "The Card Players"
annee = "1890–1895"
image = "joueurs-cartes.jpg"
technique = "Oil on canvas, 47.5 × 57 cm"
collection = "Musée d'Orsay, Paris"
note = "Two Aix peasants face to face, absorbed and motionless: a game that seems to last for eternity."
description = """
In a dark room, two men face each other on either side of a small table covered with \
an orange cloth whose corner hangs down towards us. At left, wearing a brown bowler \
hat, a white clay pipe in his mouth, a player in a purplish jacket holds his cards \
close to his body, sitting bolt upright. At right, his partner, in a soft hat and pale \
yellow jacket, with a drooping moustache, leans a little further forward, his gaze \
lowered on his hand. Neither speaks or raises his eyes to the other. Between them, a \
dark bottle stands in the middle of the table, almost at the centre of the painting. \
At the back, a brown-red wall and panelling; at left, the upright of a chair."""
evocation = """
Nothing happens, and that is what strikes us: no cheating, no quarrel, no visible \
stakes, unlike the gambling-den scenes of Dutch or Caravaggesque painting. One has seen \
in it the silent dignity of Provençal peasants, whom Cézanne, a banker's son, observes \
with respect and without picturesqueness. Others read in it the face-off of two \
temperaments, one stiff and dark, the other bent and light. The bottle, like an axis, \
both separates and links the two men. The players' concentration echoes that of the \
painter, who demanded from his models long hours without moving: the game becomes a \
form of meditation, and the genre scene takes on the gravity of a portrait."""
histoire = """
In the early 1890s, Cézanne undertook in Aix a series of five paintings of card \
players, prepared by numerous studies of individual peasants. His models were farm \
labourers and day workers from the Jas de Bouffan, the family estate, and not costumed \
actors. The two largest versions, with four and five figures, now in the Metropolitan \
Museum in New York and the Barnes Foundation in Philadelphia, are thought to have been \
painted first; the following three keep only two players. A painting of card players \
attributed to the Le Nain brothers, kept in the museum at Aix, is often cited as a \
source. This version, the smallest, entered the Louvre in 1911 with the bequest of \
Count Isaac de Camondo, then joined the Musée d'Orsay in 1986."""
facture = """
The composition is almost symmetrical, organised around the vertical bottle, and the \
two silhouettes form two arches that answer each other. Cézanne simplifies the \
volumes: hats, arms and torsos become full, firm forms. The colours are set against \
each other in warm and cool harmonies, the orange of the cloth against the violets and \
yellows of the jackets. The visible, directed touch builds the folds of the clothing \
plane by plane. The light does not come from a precise source: it is born of the \
colours themselves. The slightly tilted edge of the table betrays the liberty taken \
with perspective."""
details = [
  "The white clay pipe of the left-hand player, the only light note in his face.",
  "The reflection of light on the bottle, which marks the axis of the painting.",
  "The cards, simple whitish and bluish spots, impossible to read.",
  "The corner of the orange cloth hanging towards us beneath the table.",
  "The legs and chair at left, barely sketched in the half-light.",
]
themes = ["peasants", "game", "silence", "provence", "face-off"]
anecdote = """
Another two-player version, larger, from a Greek collection, was bought in 2011 by \
the ruling family of Qatar, for more than 250 million dollars according to the press: \
a record at the time for a work of art."""
salle = 1
mur = "droite"
place = 2
largeur = 1.3

[[oeuvres]]
titre = "Basket of Apples"
annee = "c. 1893"
image = "panier-pommes.jpg"
technique = "Oil on canvas, 65 × 80 cm"
collection = "Art Institute of Chicago"
note = "The table tilts, the bottle too: Cézanne shows objects from several points of view at once."
description = """
On a brown wooden table, a basket filled with green, yellow and red apples tips \
forward, set crookedly on a small block that lifts it at the back. Several fruits have \
spilled out and rest on a crumpled white cloth, with thick folds, that covers the \
centre of the table and hangs down towards us. Behind, a dark green wine bottle stands, \
slightly tilted. At right, a plate holds a pile of elongated biscuits, stacked in a \
criss-cross. A single apple, at far right, waits at the edge of the table. The \
background is a grey-blue wall, plain and smooth, which sets off the warm colours of \
the fruit. At lower left, the signature “P. Cézanne”."""
evocation = """
It is an ordinary domestic scene, but the stability one expects of a still life is \
disturbed here: everything seems about to slide, and yet everything holds. One has seen \
in it the trace of the time of perception, the eye moving from one object to another \
over the course of the sittings, rather than an image caught at a glance. Still life, a \
genre considered minor by the Academy, becomes in Cézanne a laboratory as ambitious as \
great history painting. The apples, everyday fruit, have no symbolic meaning here: no \
sin, no vanity, only weight, volume and colour. This shift of the subject towards \
painting itself heralds the art of the twentieth century, from Braque to Morandi."""
histoire = """
Cézanne painted this picture around 1893, at a time when he lived mainly in Provence \
and hardly exhibited any more; he remained unknown to the general public. Two years \
later, in 1895, the young dealer Ambroise Vollard gave him, in his gallery on rue \
Laffitte in Paris, his first solo exhibition: it revealed his still lifes and \
landscapes to young painters, and at last launched his commercial career. Basket of \
Apples later joined the collection of the Chicago painter and patron Frederic Clay \
Bartlett. In 1926, he gave it to the Art Institute of Chicago as part of the \
collection created in memory of his wife, Helen Birch Bartlett, which also includes \
Seurat's A Sunday on La Grande Jatte."""
facture = """
Cézanne builds the apples with small touches of colour laid side by side, from warm \
reds and yellows towards cooler greens, instead of modelling them with shadow and \
light. The outlines are reinforced with blue or brown strokes, sometimes doubled. The \
whites of the cloth are made of bluish greys and mauves. The tight framing and the \
slightly plunging viewpoint bring the objects closer to the viewer. It is reported that \
the painter wedged his fruit and plates with coins or pieces of wood to obtain exactly \
the tilt he wanted."""
details = [
  "The front edge of the table, which does not line up on either side of the cloth.",
  "The small block slipped under the basket to make it lean towards us.",
  "The bottle, whose two sides are not symmetrical.",
  "The pile of biscuits, seen almost from above while the plate is seen from the side.",
  "The signature at lower left, rare in a painter who seldom signed.",
]
themes = ["still life", "apples", "perspective", "balance", "table"]
anecdote = """
The critic Gustave Geffroy, one of his first defenders, reports that Cézanne confided \
to him that he wanted to “astonish Paris with an apple”. The phrase has remained \
attached to all his still lifes."""
salle = 1
mur = "gauche"
place = 3
largeur = 1.3

[[oeuvres]]
titre = "The Bay of Marseille, Seen from L'Estaque"
annee = "c. 1885"
image = "estaque.jpg"
technique = "Oil on canvas, 80.2 × 100.6 cm"
collection = "Art Institute of Chicago"
note = "Ochre roofs, the dense blue of the sea and the hills: a landscape built from planes of colour."
description = """
From the heights of the village of L'Estaque, the gaze plunges over orange-tiled roofs \
towards the vast bay of Marseille. In the foreground, houses with ochre walls and dark \
windows fit together like blocks, surrounded by a few trees. Several factory chimneys \
rise between the roofs, one of which, at right, releases a plume of white smoke. At \
left, a tongue of ochre and green land juts into the water. The sea, deep blue and \
almost uniform, occupies the whole centre of the painting, without a single boat. In \
the distance, a thin jetty, then the line of grey and mauve hills that close the bay, \
under a pale sky streaked with light clouds."""
evocation = """
Cézanne paints neither the bustling port of Marseille nor the agitation of the waves: \
he fixes an image of permanence, a motionless, almost mineral Mediterranean. Where the \
Impressionists sought the fleeting instant, he seeks what endures. The small factory \
smoke, the only sign of movement, nevertheless recalls that L'Estaque was then an \
industrial village, living off its tileworks. The place also had an intimate value for \
him: it was a family refuge, where his mother rented a house and where he could live \
out of his father's sight. It has been seen as a landscape both real and reconstructed, \
ordered like an architecture. Twenty years later, Braque would come to paint his first \
Cubist landscapes here, directly in Cézanne's wake."""
histoire = """
L'Estaque is a fishing and tile-making village west of Marseille. Cézanne took refuge \
there in 1870 with Hortense to escape conscription during the Franco-Prussian War, then \
returned many times until the mid-1880s. He painted more than a dozen views of the bay \
there, from similar angles. In 1882, Renoir visited him; having fallen ill, he was \
nursed by Cézanne and his mother. This canvas, painted around 1885, belongs to the \
mature series, in which the landscape is simplified into great planes. It was acquired \
by Martin A. Ryerson, a Chicago industrialist and patron, one of the great benefactors \
of the Art Institute, who bequeathed it to the museum with his collection in 1933."""
facture = """
The painting is built in three horizontal bands, village, sea and hills, superimposed \
rather than nested by perspective. Depth is born mainly of colour: the warm ochres and \
oranges of the foreground advance, the cold blue of the sea recedes. Yet the hills in \
the background are painted with as much sharpness as the roofs, so that the sea seems \
to rise up like a wall. The touch of the water, dense and regular, in horizontal \
strokes, contrasts with the freer hatching of the sky. The houses are reduced to \
simple geometric volumes."""
details = [
  "The plume of white smoke, at right, the only moving element.",
  "The fine jetty that cuts the sea diagonally, on the left.",
  "The walls of the houses, reduced to patches of colour without detail.",
  "The hills in the background, as sharp as the roofs in the foreground.",
  "The small bright green meadows on the tongue of land, at left.",
]
themes = ["sea", "provence", "landscape", "village", "mediterranean"]
anecdote = """
In a letter to Pissarro of July 1876, Cézanne describes L'Estaque in these terms: \
“It is like a playing card. Red roofs against the blue sea.” The phrase already sums \
up what he is seeking: sharp forms and bold colours."""
salle = 2
mur = "gauche"
place = 1
largeur = 1.5

[[oeuvres]]
titre = "The Château Noir"
annee = "1900–1904"
image = "chateau-noir.jpg"
technique = "Oil on canvas, 73.7 × 96.6 cm"
collection = "National Gallery of Art, Washington"
note = "An ochre building amid the pines, near Aix, under an ultramarine sky."
description = """
Above a dense mass of pines and holm oaks, a building with orange-ochre walls stands \
on a height, lit as if in full sunlight. Tall pointed-arch windows, Gothic in \
appearance, can be made out, a small reddish door and, at right, a lower wing capped \
by a dark blue roof. The sky, an intense blue, is animated by green and violet touches \
that bring it closer to the foliage. At left, a thin, pale trunk rises obliquely. \
Vegetation occupies the whole lower half of the painting, in deep greens, blues and \
blacks; at lower left, an ochre patch signals the rocky ground. No figure, no path \
leads to the building."""
evocation = """
The place bears a legendary name, and the painting sustains this mystery: a half-hidden, \
inaccessible dwelling, as if risen from the forest. The dramatic, almost uneasy tone \
of the last views of the Château Noir has often been stressed, with the dark sky \
seeming to weigh on the building. Some see in it a return of Cézanne's youthful \
Romanticism, others the echo of his last years, solitary and darkened by diabetes. \
Human architecture and wild nature mingle without merging: the warm, solid, \
geometric stone is set against the cold profusion of the vegetation. Beyond the motif, \
the painting speaks of the painter's attachment to this countryside around Aix that he \
had walked all his life."""
histoire = """
The Château Noir is a large neo-Gothic residence, built in the nineteenth century on \
the road leading from Aix to the village of Le Tholonet, east of the town. Despite its \
name, it is built of ochre stone; its name has fed many local legends. Cézanne walked \
these wooded hills from the 1880s. After the sale of the Jas de Bouffan, the family \
estate, in 1899, he tried in vain to buy the château; he rented a room there to store \
his equipment and painted in the surroundings until the end of his life. This canvas \
belongs to the series of views painted in the early 1900s. It entered the National \
Gallery of Art in Washington in 1958, a gift of Eugene and Agnes Meyer."""
facture = """
The whole surface is covered with short touches, in oblique hatching, which give the \
same texture to sky and trees and bind the planes together. The major contrast sets \
the orange ochre of the building against the blue of the sky, two complementary colours \
that reinforce each other. The paint is laid on in successive layers, sometimes thin, \
sometimes thick, in a freer manner than in the 1880s. The outlines dissolve, the forms \
join in places: historians speak of “passage”. This freedom would fascinate the \
Fauves and the Cubists."""
details = [
  "The pointed windows, a few dark strokes on the ochre façade.",
  "The red door, a small warm note at the heart of the building.",
  "The pale trunk at left, which crosses the composition obliquely.",
  "The green touches laid into the sky, as if the foliage were rising into it.",
  "The blue roof of the right wing, which almost merges with the sky.",
]
themes = ["architecture", "forest", "provence", "mystery", "solitude"]
anecdote = """
Picasso also owned a Château Noir by Cézanne, painted around 1904–1906. It entered the \
national collections with the donation of Picasso's personal collection after his \
death, and is now kept in the Musée Picasso in Paris."""
salle = 2
mur = "droite"
place = 3
largeur = 1.45

