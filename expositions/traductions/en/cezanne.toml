image = "sainte-victoire.jpg"
technique = "Oil on canvas"
note = "View from Les Lauves, his last studio: Cézanne painted the mountain more than eighty times."
description = """
The mountain occupies the top of the painting: a blue-violet mass whose ridge rises to \
a sharp summit, before stretching into a long plateau towards the right. Beneath it \
extends the plain, made of a mosaic of small ochre, orange, green and blue patches in \
which fields, groves and a few houses can be made out. In the foreground, a broad band \
of light green grass crosses the whole canvas; trees with thin trunks stand there, \
left and right. The sky, far from plain, is brushed with large blue, green and grey \
touches, similar to those of the landscape. In places, the canvas appears bare, \
without any colour."""
evocation = """
Sainte-Victoire is the mountain of Cézanne's childhood, that of his walks with Zola in \
the countryside around Aix. To return endlessly to the same motif is, for him, to seek \
what remains beneath the changing light: he often speaks, in his letters, of \
“realising” his sensations before nature. An almost spiritual quest has been seen in \
this series, pursued by an ageing, ailing man who feels time running short. The \
mountain becomes the symbol of a rooted, solid and timeless Provence. In the last \
versions, plain and sky dissolve into patches of colour, on the verge of abstraction, \
which would make these canvases touchstones for twentieth-century abstract painters."""
histoire = """
Cézanne painted Sainte-Victoire from the 1870s, then above all from the 1880s, from \
the Jas de Bouffan or the surroundings of Bellevue. In 1902, he had a studio built on \
the hill of Les Lauves, north of Aix. He climbed almost every day, by the path, to a \
viewpoint overlooking the plain, facing the mountain: it was there that the last \
series was born, painted between 1902 and 1906. The young painter Émile Bernard \
visited him in 1904 and recorded his remarks on painting; in January 1906, Maurice \
Denis and Ker-Xavier Roussel came in their turn and photographed him at work before the \
motif. These late views are now scattered between Europe, the United States and \
Russia."""
facture = """
The canvas is built from juxtaposed patches of colour, often rectangular, laid down \
without preliminary drawing. The same touch serves for earth and sky, which unifies the \
whole surface. The warm colours, ochres and oranges, bring the plain forward, while \
the blues and violets push the mountain into the distance. The paint, often thin and \
almost transparent, lets the canvas show in places, as in the watercolours that \
Cézanne practised a great deal at the same period. The apparent unfinished state is \
part of the method: each touch answers the others rather than the detail of the \
landscape."""
details = [
  "The summit, laid in with blue and mauve touches without a continuous outline.",
  "The small orange patches, at the centre, that suggest roofs.",
  "The thin trunks of the foreground, traced with a single dark stroke.",
  "The areas of bare canvas, in the sky and at lower left.",
]
themes = ["mountain", "provence", "landscape", "abstraction", "permanence"]
anecdote = """
Tradition links the mountain's name to the victory of the Roman general Marius over \
the Teutons, in 102 BC, in the Aix region. Picasso, a great admirer of Cézanne, bought \
in 1958 the château of Vauvenargues, at the foot of its northern slope; he is buried \
there."""
salle = 2
mur = "gauche"
place = 3
largeur = 1.5

[[oeuvres]]
titre = "The Large Bathers"
annee = "1900–1906"
image = "grandes-baigneuses.jpg"
technique = "Oil on canvas, 210.5 × 250.8 cm"
collection = "Philadelphia Museum of Art"
note = "Bodies and trees forming a cathedral: the last great canvas, left unfinished."
description = """
On a sandy bank, more than a dozen nude women are divided into two groups, left and \
right, framed by tall tree trunks that lean towards each other until they form a high \
arch open to the sky. At left, a standing bather leans against a tree; others are \
seated, crouching or reclining. At right, a seated woman dominates her group, facing \
us. At the centre, a small stretch of water in which a figure swims; on the far bank, \
two standing figures and, in the distance, a village with a bell tower, under a blue \
sky crossed by white clouds. In the foreground, a bather bending over picks up a white \
cloth lying on the ground."""
evocation = """
Cézanne takes up a very ancient theme, that of nudes in an ideal landscape, dear to \
Titian and Poussin: a golden age in which humanity lives in harmony with nature. But \
his bathers have neither name nor mythological story, and their bodies, without \
allure, are treated as elements of the landscape, on a par with the trees and the \
water. It has been seen as the synthesis of all his research: uniting the human figure \
and nature in a stable, monumental construction. For many historians, this last great \
canvas opens the way to the art of the twentieth century: Picasso and Matisse \
meditated on its lesson, and Les Demoiselles d'Avignon, painted in 1907, is often \
compared to these angular nudes."""
histoire = """
In the last ten years of his life, Cézanne worked in parallel on three large bather \
compositions, now in London, at the Barnes Foundation and in Philadelphia; this one is \
the largest. He worked on it for several years, notably in the Les Lauves studio, built \
in 1902. Shy and modest, he did not have nude models pose: he relied on old drawings \
and memories of sculptures and paintings seen at the Louvre. The canvas was still \
unfinished at his death, in October 1906. It then passed into Paris collections, as the \
painter's posthumous fame kept growing. The Philadelphia Museum of Art bought it in \
1937 thanks to the Wilstach fund."""
facture = """
The paint is highly diluted, laid on in thin, transparent layers that often let the \
white canvas show. A restricted palette, blues, ochres and flesh tones, unifies \
bodies, trees and sky. The bodies, elongated and simplified, are encircled with blue \
outlines. The composition rests on a great triangle formed by the trunks, which frames \
the two groups of figures leaning in the same direction. The sky, made of rectangular \
touches, is treated as a material as solid as the earth. The deformations are \
deliberate and serve the overall architecture."""
details = [
  "The tiny bell tower, in the distance, between the trunks at left.",
  "The swimmer in the middle of the water, barely indicated.",
  "The blue outlines that encircle the bodies.",
  "The faces without features, reduced to ovals.",
  "The areas where the white canvas remains visible, proof of the unfinished state.",
]
themes = ["bathers", "nude", "nature", "arcadia", "geometry"]
anecdote = """
So that he could take his very large canvases out of the Les Lauves studio, Cézanne \
had a tall, narrow slot cut in a wall. It can still be seen today in the studio, now a \
museum open to visitors."""
salle = 3
mur = "fond"
place = 2
largeur = 2.6

[[artistes]]
nom = "Paul Cézanne"
vie = "Aix-en-Provence, 19 January 1839 – Aix-en-Provence, 22 October 1906"
biographie = """
The son of Louis-Auguste Cézanne, a hatter who grew rich and became a banker, Paul \
grew up in Aix-en-Provence. At the Collège Bourbon, he formed a deep friendship with \
Émile Zola, with whom he roamed the countryside around Aix. To please his father, he \
began studying law, then obtained permission to leave for Paris in 1861. He attended \
the Académie Suisse, copied at the Louvre, met Pissarro, Monet and Renoir, but the \
Salon rejected him almost every year. His first canvases, dark and violent, \
disconcerted. During the war of 1870, he hid at L'Estaque with Hortense Fiquet, who \
gave him a son, Paul, in 1872. Alongside Pissarro, at Pontoise and Auvers-sur-Oise, he \
lightened his palette. He exhibited with the Impressionists in 1874 and 1877, amid the \
mockery of the critics, then withdrew from Paris. The year 1886 was decisive: the \
publication of L'Œuvre ended his friendship with Zola, he married Hortense, and his \
father's death put him beyond want. Withdrawn in Aix, he worked with obstinacy, far \
from the art world. In 1895, his first solo exhibition at Ambroise Vollard's revealed \
him to young painters, who began to regard him as a master. After the sale of the Jas \
de Bouffan, the family home, he had his Les Lauves studio built in 1902. Suffering from \
diabetes, he kept painting from the motif to the very end: caught in a storm in October \
1906, he died a few days later. The retrospective at the Salon d'Automne of 1907 \
confirmed his influence."""
style = """
Cézanne wanted to make of Impressionism “something solid and durable like the art of \
the museums”, according to a phrase attributed to him. He builds forms through colour \
itself, in juxtaposed and directed touches, rather than through drawing and shadow. He \
simplifies objects into volumes, combines several viewpoints and accepts the \
deformations that serve the balance of the painting. In 1904, he advised Émile Bernard \
to treat nature “by the cylinder, the sphere, the cone”. This lesson directly nourished \
the Cubism of Braque and Picasso, but also Matisse and a large part of abstract art: he \
is considered one of the fathers of modern painting."""
