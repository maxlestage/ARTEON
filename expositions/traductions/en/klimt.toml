[musee]
nom = "Upper Belvedere"
ville = "Vienna, Austria"
architecte = "Johann Lukas von Hildebrandt"
construction = "1717–1723"
presentation = """
The Belvedere is the summer residence that Prince Eugene of Savoy, victor over the \
Ottomans, had built at the gates of Vienna by Johann Lukas von Hildebrandt: two \
Baroque palaces face each other at opposite ends of a terraced garden. The Upper \
Belvedere, completed in 1723, was used for festivities and receptions; its centrepiece is \
the Marble Hall, two storeys high, with a ceiling painted by Carlo Carlone. It was here \
that the State Treaty restoring Austria's sovereignty was signed in 1955. Having passed to the \
Habsburgs, the palace housed the imperial picture gallery from 1781, open to the \
public. Today it presents Austrian art and the largest collection in the world \
of paintings by Klimt, including The Kiss, bought by the state as early as 1908, and Judith."""
ici = """
ARTEON retains the Marble Hall and its height. The vestibule, a low passage without \
works, opens to the north onto The Marble Hall, 18 metres long and 9 high, with pale lilac-grey \
walls. One crosses it to reach, to the west, Room I · The Secession, \
then, to the east, Room II · The Golden Period, two twin galleries 6 metres high. \
The visit ends in the Marble Hall itself, where The Kiss waits at the far end, on \
the north wall."""

