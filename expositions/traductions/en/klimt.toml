nom = "Gustav Klimt"
vie = "Baumgarten, near Vienna, 14 July 1862 – Vienna, 6 February 1918"
biographie = """
Gustav Klimt was born in 1862 in Baumgarten, at the gates of Vienna, the second of seven \
children of Ernst Klimt, a gold engraver from Bohemia, and Anna Finster. The family \
was modest. At fourteen he entered the Vienna School of Arts and Crafts, where his \
brother Ernst joined him. With him and their friend Franz Matsch, he founded a company \
of decorators that won major official commissions: ceilings of the staircases \
of the Burgtheater, paintings for the grand staircase of the Kunsthistorisches Museum. In 1892, the \
death of his father and then of his brother Ernst shook him profoundly. In 1897 he founded with \
other artists the Vienna Secession, of which he was the first president, to \
open Austria to modern European art. The large canvases commissioned for \
the University of Vienna, Philosophy, Medicine and Jurisprudence, set off \
a scandal: Klimt abandoned the commission in 1905 and left the Secession. These canvases \
would be destroyed in a fire in 1945. The golden period then began, with The Kiss \
and the portraits of upper-middle-class women, then the mosaic frieze of the \
Palais Stoclet in Brussels. He never married, had several illegitimate children and \
shared his life with the fashion designer Emilie Flöge, with whom he spent his summers on the \
Attersee. He supported young artists, foremost among them Egon \
Schiele. Struck by a stroke in January 1918, he died in Vienna on 6 February."""
style = """
Trained in a very assured academic painting, Klimt soon moved beyond historical realism \
to a painting in which the human body, finely modelled, stands out against flat \
decorative surfaces. His most recognizable mark is the use of gold leaf \
and of ornaments borrowed from Byzantium, Egypt, archaic Greece and Japanese \
art. Women, sensual or disquieting, and the great themes of love, \
life and death dominate his work; his square landscapes, meanwhile, verge on \
abstraction. By erasing the boundary between painting and decorative arts, he \
embodied Viennese Art Nouveau and opened the way for the Expressionism of Schiele and \
Kokoschka."""
