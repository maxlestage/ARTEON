introduction = """
In the Vienna of 1900, Gustav Klimt founded the Secession and covered his canvases \
with gold, spirals and mosaics. The Kiss, Adele Bloch-Bauer, the allegories \
of life and death: seven paintings, from the landscapes of Lake Attersee to the \
last great compositions."""
