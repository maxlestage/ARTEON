[[oeuvres]]
titre = "Slice of the Gibeon Meteorite"
artiste = "Gibeon, Namibie"
annee = "Formed about 4.5 billion years ago"
image = "meteorite-gibeon.jpg"
credit = "Photo : Kevin Walsh"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Gibeon_meteorite_slice.jpg"
technique = "Meteoritic iron (iron-nickel alloy), fine octahedrite of group IVA; slice sawn, polished and etched with acid"
collection = "Collection not specified (photograph by Kevin Walsh, 2002)"
note = "A slice of iron fallen from the sky, sawn, polished and then etched with acid: an interlacing of metal blades appears, the Widmanstätten pattern, which forms only in the core of an asteroid."
description = """
Against a black background stands out a metal plate with an irregular outline, cut with \
a saw from a larger block. Its silvery grey surface is not smooth: it is entirely \
covered with a network of straight, narrow bands that cross in three or four \
directions. They draw triangles, lozenges and parallelograms, like threads pulled from \
a fabric or the twigs of a bundle of kindling. Some bands shine, others appear darker \
depending on how they reflect the light; the small spaces they enclose have a finer, \
almost granular texture. At the edges, the slice frays into points and notches, where \
the raw surface of the meteorite once lay."""
evocation = """
This geometric pattern is the archive of a vanished world. About 4.5 billion years ago, \
at the birth of the solar system, small planets formed around the young Sun; in some, \
the molten metal sank to the centre and formed a core. Widmanstätten patterns form only \
if this metal cools with extreme slowness, a few degrees per million years, in a body \
buried beneath kilometres of rock. A collision later shattered this asteroid, and one \
of its fragments eventually crossed the path of the Earth. To touch such a slice is to \
touch the heart of a celestial body, which no drilling will ever allow us to reach on \
our own planet."""
histoire = """
The Gibeon meteorites fell long before written history, in a shower of fragments \
scattered over hundreds of kilometres in southern Namibia, around the small town of \
Gibeon, which gave them their name. The Nama, who live in the region, drew iron from \
them to make tools and weapon tips. Europeans discovered them in the nineteenth \
century: in the 1830s, samples brought back by a British explorer were recognised in \
London as iron from space. Hundreds of masses, from a few grams to several hundred \
kilos, have been collected since. Namibia now protects them as a national heritage, and \
about thirty of the largest are displayed in the open air, on a square in the capital, \
Windhoek."""
facture = """
Gibeon iron contains about 8% nickel. As it cooled, it separated into two alloys: \
kamacite, poor in nickel, in broad blades, and taenite, richer, in thin borders. To \
reveal them, the meteorite is sawn, the slice is polished like a mirror, then etched \
with dilute acid, which eats away the two metals at different rates. The blades are \
oriented along the faces of an octahedron, hence the name octahedrite. Those of Gibeon \
are very narrow, less than half a millimetre, which places it among the fine \
octahedrites."""
details = [
  "The parallel bands that recur in only three or four directions.",
  "The small triangles between the blades, filled with a finer texture.",
  "The contrast between bright and matte blades, which changes with the light.",
  "The jagged outline, which follows the shape of the original block.",
]
themes = ["meteorite", "space", "iron", "crystal", "solar system"]
anecdote = """
They are called “Widmanstätten patterns”, after the Austrian count Alois von \
Beckh-Widmanstätten, who observed them in Vienna in 1808. But the Briton William \
Thomson had already described them a few years earlier, in Naples: for this reason they \
are sometimes called “Thomson structures”."""
salle = 1
mur = "est"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "The Hope Diamond"
artiste = "Mines de Golconde, Inde"
annee = "Indian diamond known since the seventeenth century; present cut attested in 1812; photograph of 1974"
image = "diamant-hope.jpg"
credit = "Photo : Smithsonian Institution Archives"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:The_Hope_Diamond_-_SIA.jpg"
technique = "Blue diamond of 45.52 carats (25.6 × 21.8 mm), set in a pendant surrounded by sixteen white diamonds"
collection = "National Museum of Natural History, Smithsonian Institution, Washington"
note = "The world's most famous blue diamond: 45.52 carats for a little over 2.5 cm in length, shown here greatly enlarged. It was cut from the “French Blue” of Louis XIV, stolen in 1792."
description = """
At the centre of a pendant, an oval stone of deep blue, almost black in its dark \
areas, throws back the light through its facets: paler triangles and lozenges, steel \
blue, light up on its surface. Its outline is not quite regular, slightly swollen on \
one side. Around it, a crown of sixteen colourless diamonds, cut some in pear shapes, \
others in cushion shapes, sparkles with white and violet reflections. At the top, a \
bail connects the jewel to a chain of diamonds, blurred in the background; at the \
bottom hangs a small ring. The photograph, taken in 1974 by the Smithsonian's staff, \
shows the gem resting on a grey-blue fabric background."""
evocation = """
Few stones have inspired so much dreaming. The Hope Diamond sums up three centuries of \
history: the splendour of Louis XIV, the fall of the monarchy, the fortunes of bankers \
and American heiresses. Newspapers of the early twentieth century invented a curse for \
it, said to have struck all its owners; it is thought to have been fostered by the \
dealers themselves, to make the stone more desirable. It also embodies a democratic \
idea: the most famous diamond in the world now belongs to the public and can be viewed \
free of charge, in a national museum. Finally, it poses a puzzle of physics: a diamond \
is pure carbon, and its blue colour is due to only a few foreign atoms."""
histoire = """
In 1668, the French merchant Jean-Baptiste Tavernier sold Louis XIV a large blue \
diamond bought in India, of more than 110 carats. In 1673, the court jeweller, Jean \
Pittan, recut it into a stone of about 69 carats, the “French Blue”. Louis XV had it \
set in 1749 in an insignia of the Order of the Golden Fleece. In September 1792, it was \
stolen with the Crown Jewels from the Garde-Meuble in Paris. A blue stone of 45 carats \
reappeared in London in 1812, then entered the collection of the banker Henry Philip \
Hope, whose name it kept. Pierre Cartier sold it in 1911 to Evalyn Walsh McLean; after \
her death, Harry Winston bought it and gave it to the Smithsonian in 1958. In 2007, a \
lead cast of the French Blue, found at the Muséum in Paris, confirmed that the Hope \
was cut from it."""
facture = """
The Hope Diamond is cushion-cut, with a crown of facets above and a deeper pavilion \
below, which sends the light back towards the eye. Its colour comes from traces of \
boron, a few atoms per million carbon atoms: they absorb part of the red and yellow \
light and let only the blue through. It is a so-called type IIb diamond, a very rare \
category. It has another astonishing property: lit by ultraviolet rays, then plunged \
back into darkness, it glows for a few seconds with a red-orange light. The jewel \
surrounding it, a setting of sixteen white diamonds and a chain of forty-five \
diamonds, sets off its dark colour."""
details = [
  "The slightly asymmetrical outline of the blue stone.",
  "The facets of the pavilion, lighting up in triangles of a paler blue.",
  "The sixteen white diamonds, alternating pear and cushion cuts.",
  "The bail, at the top, which attaches the pendant to the chain.",
]
themes = ["diamond", "blue", "louis xiv", "legend", "gem"]
anecdote = """
In 1958, Harry Winston sent the diamond to the Smithsonian by mail, registered, in a \
simple brown-paper parcel insured for one million dollars. The packaging, with its \
stamps and postmark, is today kept in the National Postal Museum in Washington."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.2

[[oeuvres]]
titre = "Pink Fluorite on Smoky Quartz"
artiste = "Massif du Mont-Blanc, France"
annee = "Crystallised in a fissure in the granite, during the uplift of the Alps"
image = "fluorite-aiguille-verte.jpg"
credit = "Photo : Marie-Lan Taÿ Pamart"
licence = "CC BY 4.0"
source = "https://commons.wikimedia.org/wiki/File:Fluorite_on_smoky_quartz_Aiguille_Verte_MNHN_Minéralogie.jpg"
technique = "Fluorite (calcium fluoride) in octahedra, on a smoky quartz crystal; from the Aiguille Verte (Haute-Savoie)"
collection = "Galerie de Minéralogie et de Géologie, Muséum national d'Histoire naturelle, Paris"
note = "Octahedra of orange-pink fluorite resting on a smoky quartz crystal: one of the treasures of the crystal fissures of the Mont Blanc massif, collected on the Aiguille Verte."
description = """
A cluster of salmon-pink, almost orange crystals clings to a darker, grey-brown \
crystal that rises at the top of the composition: a smoky quartz, whose flat face and \
point can be seen. The pink crystals have sharply defined triangular faces; several are \
almost perfect octahedra, like two pyramids joined at their bases. They pile up and \
overlap, in various sizes, the largest at the centre, the smallest clustered at the \
edges. Their surface is not polished: it looks frosted, finely striated or hollowed \
into small steps. Traversed by the light of the display case, the edges of the \
crystals become translucent and glow a more vivid pink on the pale grey base."""
evocation = """
This object tells of the high mountains. It comes from a fissure in the granite, at \
several thousand metres of altitude, where one had to climb, dig and come back down \
with the stone on one's back. For the crystal hunters of Chamonix, pink fluorite is \
the finest treasure of the massif, far rarer than quartz. Its geometry also fascinates: \
the octahedron, with its eight equal triangular faces, is one of the five regular \
solids that Plato associated with the elements of the world, and nature produces it \
here without the aid of any hand. The contrast between the soft pink and the dark \
quartz, finally, has something of a painter's composition, like a flower set on a \
rock."""
histoire = """
The Aiguille Verte, 4,122 metres high, overlooks the Chamonix valley; the Englishman \
Edward Whymper made the first ascent in 1865, with two Swiss guides. Long before the \
mountaineers, crystal hunters, the cristalliers, were already roaming the glaciers and \
rock faces of the massif in search of “fours”: cavities in the granite lined with \
quartz, which can be spotted by a white vein in the rock. Pink fluorites are rare and \
sought-after there. This specimen belongs to the collections of the Muséum national \
d'Histoire naturelle and is displayed in its Galerie de Minéralogie et de Géologie, in \
the Jardin des Plantes, alongside other minerals from the French Alps."""
facture = """
Fluorite is a calcium fluoride. In the fissures of the Alps, it often crystallises in \
octahedra rather than cubes. Its rare pink colour is attributed to tiny defects in the \
crystal lattice, linked to traces of rare earths and to the natural radioactivity of \
the granite. Smoky quartz also owes its brown tint to this radioactivity, which acts on \
traces of aluminium. Both minerals grew slowly in hot waters laden with dissolved \
elements that circulated in the fractured rock, while the Alpine chain was rising."""
details = [
  "The triangular faces of the pink octahedra, sharp as cut facets.",
  "The frosted, striated surface of the crystals, which has never been polished.",
  "The grey-brown smoky quartz crystal that supports the whole.",
  "The translucent edges where the light turns the pink to orange.",
]
themes = ["mineral", "crystal", "mountain", "alps", "colour"]
anecdote = """
Fluorite gave its name to fluorescence. In 1852, the British physicist George Gabriel \
Stokes coined the word while studying the glow that some fluorites emit when lit with \
ultraviolet light."""
salle = 3
mur = "nord"
place = 3
largeur = 1.3

[[oeuvres]]
titre = "Amethyst Geode"
artiste = "Coulées de lave de la Serra Geral, Brésil"
annee = "Early Cretaceous, about 130 million years ago"
image = "geode-amethyste.jpg"
credit = "Photo : James St. John"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Amethyst_geode_(Serra_Geral_Formation,_Lower_Cretaceous;_southeastern_Brazil)_1_(32934451701).jpg"
technique = "Quartz (amethyst variety) and chalcedony, in a cavity of a basalt flow"
collection = "Mineral Museum, Montana Bureau of Mines and Geology, Butte (Montana)"
note = "A gas bubble trapped in a lava flow, gradually lined with thousands of violet crystals: the amethyst geodes of southern Brazil are among the largest in the world."
description = """
The geode has been opened and appears as a large hollow oval, lying on its base. On \
the outside, a crust of greenish-grey rock forms the shell. Just inside runs a smooth \
white and grey border, like a porcelain edging. Then come the crystals: thousands of \
small tightly packed pyramids, pointing towards the centre, pale violet near the edge, \
growing darker towards the back of the cavity, where some areas look grey or almost \
black. At upper right, a small group of white, shining crystals, probably calcite, \
stands out against the violet. The light catches the points and makes the whole wall \
sparkle."""
evocation = """
The geode is the hidden treasure par excellence: an ordinary grey stone on the \
outside, a cave of crystals within. It has fed legends of marvellous caverns and of \
stones that contain a world. Its colour, violet, was long that of power and of the \
Church: bishops wore an amethyst ring. But the geode speaks above all of time: each \
crystal grew atom by atom, from water seeping through the cooled lava, over spans of \
time beyond imagination. It also recalls that mineral beauty is sometimes born of \
cataclysms: here, of one of the greatest eruptions in the history of the Earth."""
histoire = """
About 130 million years ago, when South America and Africa began to separate, immense \
basalt flows spread over the south of the continent, in successive layers that today \
form the Serra Geral. In the still-liquid lava, gas bubbles remained trapped; much \
later, waters laden with silica seeped in and filled them with crystals. In the state \
of Rio Grande do Sul, in Brazil, and in the neighbouring region of Artigas, in Uruguay, \
miners follow the geode-rich lava layer by digging galleries into the hillsides. The \
geodes, freed with jackhammers, are sawn and sold around the world. This one is \
displayed in the mineralogy museum at Butte, in Montana."""
facture = """
The growth follows a precise order. The waters circulating in the cavity first deposit \
a thin layer of chalcedony, a silica whose crystals are invisible to the naked eye: \
this is the white border. Then quartz crystallises in prisms of which only the tip \
protrudes, all turned towards the central void. The colour of amethyst comes from \
traces of iron, transformed by the natural radioactivity of the rocks. It is fragile: \
heated to a few hundred degrees, amethyst turns orange-yellow, and a large proportion \
of the “citrines” sold in jewellery are heated amethysts."""
details = [
  "The grey-green basalt crust, which formed the wall of the gas bubble.",
  "The white chalcedony edging, the first layer deposited in the cavity.",
  "The points of the crystals, all directed towards the centre.",
  "The small group of white crystals, at upper right.",
  "The violet that darkens towards the back of the geode.",
]
themes = ["mineral", "geode", "crystal", "violet", "volcano"]
anecdote = """
The word amethyst comes from the Greek amethystos, “not intoxicated”. The Greeks \
believed this stone protected against drunkenness, and it is said that they drank wine \
from amethyst cups."""
salle = 3
mur = "sud"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "Trilobite Elrathia kingii"
artiste = "Schistes de Wheeler, Utah"
annee = "Middle Cambrian, a little over 500 million years ago"
image = "trilobite-elrathia.jpg"
credit = "Photo : James St. John"
licence = "CC BY 2.0"
source = "https://commons.wikimedia.org/wiki/File:Elrathia_kingii_(fossil_trilobite)_(Wheeler_Formation,_Middle_Cambrian;_House_Range,_western_Utah,_USA)_3.jpg"
technique = "Fossilised carapace (calcite) in a clay shale; about 2.6 cm wide"
collection = "Collection not specified (photograph by James St. John)"
note = "Barely 2.6 cm wide, shown here greatly enlarged, this trilobite lived on the floor of a Cambrian sea more than 500 million years ago. It is one of the most widespread fossils in the world."
description = """
On the grey stone, a small oval animal, shiny black, seems still to rest on the sea \
floor. Its body is divided into three bands lengthwise: a raised central axis and two \
flatter side lobes, hence the name trilobite, “three-lobed”. At the top, the head forms \
a broad crescent; in its middle rises an elongated swelling, the glabella. The body is \
made of a dozen articulated rings, packed tight like the plates of armour, each ending \
at the side in a rounded point. At the bottom, a small shield-shaped tail closes the \
whole. The black carapace stands out sharply against the paler, slightly cracked \
rock."""
evocation = """
The trilobite is one of the first great successes of animal life. It appeared in the \
Cambrian, when the oceans were filling with a sudden diversity of forms, and it was \
one of the first animals to possess true eyes. Trilobites lived for nearly 270 million \
years before disappearing in the great extinction at the end of the Permian. This one \
is nothing exceptional: no spines, no giant eyes. American palaeontologists \
affectionately nickname it “Joe Trilobite”, the ordinary trilobite. That is precisely \
what makes it moving: it lets us see the daily life of a sea floor, more than two \
hundred million years before the first dinosaurs."""
histoire = """
Elrathia kingii was described in 1870 by the American palaeontologist Fielding Meek, \
who named it after Clarence King, the geologist then leading the Fortieth Parallel \
Survey across the American West. It comes from the Wheeler Shale, in the House Range \
mountains, in western Utah. The quarries of the region have yielded considerable \
quantities: operators split the rock into slabs and extract thousands of specimens \
each year. This is why Elrathia is the trilobite most often found in fossil shops and \
amateur collections around the world. This specimen was photographed by the geologist \
James St. John."""
facture = """
Like insects and crabs, trilobites were arthropods: their bodies were protected by an \
articulated carapace, reinforced with calcite, which they had to shed in order to \
grow. Many fossils are in fact moults, not dead animals. Only this mineralised \
carapace has been preserved; the legs, antennae and gills have vanished. In the \
Wheeler Shale, a fine mud deposited in calm, oxygen-poor water covered the carapaces \
without scattering them. The rock splits along its layers and reveals the intact \
fossil, often black against the grey of the shale."""
details = [
  "The three lobes along the length of the body, which gave the group its name.",
  "The glabella, the elongated swelling in the middle of the head.",
  "The articulated rings of the thorax, ending in rounded points.",
  "The small shield-shaped tail, at the bottom of the fossil.",
]
themes = ["fossil", "cambrian", "sea", "trilobite", "arthropod"]
anecdote = """
According to accounts gathered in the twentieth century, the Utes of Utah wore \
trilobites as amulets, to protect themselves from illness. The name they gave them \
evoked little water bugs living in a stone house."""
salle = 4
mur = "nord"
place = 2
largeur = 0.8

[[oeuvres]]
titre = "Ammonite Dactylioceras commune"
artiste = "Falaises de Whitby, Angleterre"
annee = "Early Jurassic, about 180 million years ago"
image = "ammonite-whitby.jpg"
credit = "Photo : Fred Cherrygarden"
licence = "CC BY-SA 4.0"
source = "https://commons.wikimedia.org/wiki/File:Dactylioceras_commune.jpg"
technique = "Fossilised shell in a clay rock; 7 cm in diameter"
collection = "Private collection (Cherrygarden collection)"
note = "A 7 cm ammonite, shown here enlarged, found at Whitby, on the Yorkshire coast. For the townspeople, these coiled shells were snakes turned to stone."
description = """
A shell coiled in a flat spiral, anthracite grey, stands out against a white \
background. Several whorls can be counted, wider and wider from the centre outwards, \
nested one within the other like a coiled rope. Each whorl is adorned with fine, \
closely spaced ribs, regular as the teeth of a comb, which radiate from the centre \
towards the edge; near the outside, they split in two. The centre of the spiral, tiny, \
forms a small hollow. On the right, the shell partly disappears into the rock that \
still envelops it, a smooth grey matrix; at the bottom, the last whorl, more worn, \
shows the relief of the ribs in profile."""
evocation = """
The ammonite is one of the most familiar forms in palaeontology, and one of the most \
mysterious for those who found it without understanding it. Its spiral has evoked a \
coiled snake, a ram's horn, a wheel. For geologists, it is also a clock: ammonite \
species succeeded one another so quickly and were so widespread that they make it \
possible to date rocks to within a million years. Their disappearance, 66 million years \
ago, at the same time as that of the great dinosaurs, finally recalls the fragility of \
the most prosperous groups: ammonites had populated the seas for more than three \
hundred million years."""
histoire = """
The cliffs of Whitby, on the North Yorkshire coast, have yielded ammonites for \
centuries: storms and landslides detach them from the rock, and they are picked up on \
the beach. A legend links them to Saint Hilda, the abbess who founded Whitby Abbey in \
the seventh century: she is said to have turned to stone the snakes that infested the \
place. Merchants sometimes carved a snake's head at the end of the spiral to sell \
these “snakestones” to visitors, and three ammonites appear on the town's coat of \
arms. This specimen, found at Whitby, belongs to a private collection and was \
photographed by its owner."""
facture = """
The ammonite was a cephalopod mollusc, cousin of the octopus, the cuttlefish and the \
nautilus. Its shell was divided into chambers by partitions; the animal lived in the \
last, the largest, and regulated its buoyancy by filling the others with gas or \
liquid. The name Dactylioceras means roughly “ringed horn”: it alludes to the close \
ribs that encircle each whorl. At Whitby, ammonites are often preserved in nodules, \
balls of harder rock formed around them in the mud of the sea floor, which protected \
them from crushing."""
details = [
  "The close ribs radiating over each whorl of the spiral.",
  "The splitting of the ribs near the outer edge.",
  "The tiny hollow at the centre, where the animal began its shell.",
  "The matrix of grey rock, still attached on the right.",
]
themes = ["fossil", "jurassic", "sea", "spiral", "legend"]
anecdote = """
The word ammonite comes from the Egyptian god Amun, depicted with ram's horns. The \
Roman writer Pliny the Elder called these fossils “horns of Ammon”, because of their \
resemblance to a coiled horn."""
salle = 4
mur = "sud"
place = 2
largeur = 1.0

