[exposition]
ordre = 300
nom_court = "Treasures of the Earth"
mouvement = "Natural history: minerals, fossils and meteorites"
cadre = "vitrine"
couleur = "#5b4b78"
titre = "Treasures of the Earth: Minerals, Fossils and Meteorites"
artiste = "Golconda, Mont Blanc, Solnhofen, Whitby, the Baltic Sea, Gibeon…"
dates = "4.5 billion years ago – today"
accroche = "Virtual exhibition · Muséum national d'Histoire naturelle, Paris"
introduction = """
Here the artist is nature, and each work bears the name of the place that yielded it: \
the mines of Golconda, the fissures of Mont Blanc, the quarries of Solnhofen, the \
cliffs of Whitby, the beaches of the Baltic. The visit brings together ten treasures, \
from a meteorite older than the Earth to the Hope Diamond, from a trilobite more than \
500 million years old to Archaeopteryx, half bird, half dinosaur. The building is \
inspired by the Muséum national d'Histoire naturelle, in the Jardin des Plantes in \
Paris: a tall nave under a glass roof, like that of the Grande Galerie de l'Évolution, \
opens to the west onto a mineralogy gallery and to the east onto the hall of the \
ancient seas. Each object is presented in a deep display case, often enlarged so that \
the eye can take in its details."""
vitrine = "diamant-hope.jpg"

[musee]
nom = "Grande Galerie de l'Évolution"
ville = "Paris, France (Jardin des Plantes)"
architecte = "Jules André; renovation: Paul Chemetov and Borja Huidobro"
construction = "1877–1889; reopened in 1994"
presentation = """
The Muséum national d'Histoire naturelle was born in 1793 from the former Jardin royal \
des plantes médicinales, founded in the seventeenth century on the left bank of the \
Seine. For its zoology collections, the architect Jules André built a vast gallery \
between 1877 and 1889: a nave covered by an immense glass roof, lined with superimposed \
balconies carried on cast-iron columns. Closed in 1965 for lack of maintenance, it was \
renovated by Paul Chemetov and Borja Huidobro and reopened in 1994 as the Grande \
Galerie de l'Évolution. In the nave, a procession of mounted animals from the African \
savannah parades beneath a light that changes like that of the sky. The garden has \
other galleries: the Galerie de Minéralogie et de Géologie, built under the July \
Monarchy by Charles Rohault de Fleury, which displays meteorites, gems and giant \
crystals, and the Galerie de Paléontologie et d'Anatomie comparée, opened in 1898, \
where the Diplodocus given by Andrew Carnegie in 1908 still stands."""
ici = """
ARTEON's building brings the galleries of the Jardin des Plantes together in a single \
edifice. Visitors enter from the south into the stone-coloured vestibule, where a \
meteorite waits. It opens to the north onto the great nave, 24 metres long and 14 \
metres high, like the glass-roofed nave of the Grande Galerie de l'Évolution. To the \
west, a door leads to the Mineralogy Gallery, lower, with pearl-grey walls, where gems \
and crystals shine. To the east, the hall of the ancient seas, in pale water green, \
gathers trilobite, ammonite and nautilus. Visitors finally return to the nave, where \
the Diplodocus, Archaeopteryx and amber await."""

