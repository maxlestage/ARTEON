[[oeuvres]]
titre = "The Nightmare"
artiste = "Johann Heinrich Füssli"
annee = "1781"
image = "cauchemar.jpg"
technique = "Oil on canvas, 101.6 × 127 cm"
collection = "Detroit Institute of Arts, Detroit"
note = "A demon crouching on a sleeping woman, a horse’s head with empty eyes: the painting that made London shudder in 1782."
description = """
A young woman dressed in white is thrown back across a bed, her head and one arm hanging \
into the void, her eyes closed, as if in a faint. Crouching on her chest is a small hairy \
demon, an incubus with a grimacing face, who stares at the viewer. At left, between the \
dark red curtains of the alcove, a horse’s head with blank white eyes looms out. In the \
foreground, a small round table holds a mirror, a flask and a pot. Everything else is \
plunged into shadow. Light falls on the sleeper’s body, on the silk of her chemise and on \
the yellow and red drapery sliding from the bed to the floor, and brings out the diagonal \
of her abandoned body."""
evocation = """
The painting tells no story drawn from the Bible or mythology: it shows a state, the bad \
dream, and the anguish of a sleeper who cannot wake. The demon sitting on the chest takes \
up an ancient belief in a spirit that comes to crush sleepers; the horse’s head plays on \
the English word nightmare, whose second half evokes the mare. Some have also seen an \
erotically charged scene, with this offered body and this nocturnal intruder. At the end \
of the Age of Enlightenment, which wanted to illuminate everything by reason, Füssli \
opened painting to the world of dreams, fear and the unconscious, which the Romantics and \
then the Surrealists would explore."""
histoire = """
Füssli, a native of Zurich settled in London, exhibited the canvas at the Royal Academy in \
the spring of 1782. Its success was immediate and made his reputation. The publisher John \
Raphael Smith at once had Thomas Burke engrave a print of it, in 1783, which sold widely \
and earned far more than the painting itself. The painter would produce several other \
versions, one of which, c. 1790–91, is in the Goethe-Haus in Frankfurt. The subject was \
promptly parodied by English political caricaturists, who replaced the sleeper with the \
statesmen of the day. On the back of the Detroit canvas is an unfinished portrait of a \
young woman, in whom it has been proposed to recognize Anna Landolt, niece of his friend \
Lavater, with whom he was in love. The painting entered the Detroit Institute of Arts in \
1955."""
facture = """
Füssli composes as in the theatre: a narrow space closed off by curtains, footlight \
illumination cutting the figures out against an almost black ground. The woman’s body \
traces a long curve across the whole canvas, in counterpoint to the compact mass of the \
demon. The drawing of the bodies, with their stretched limbs and forced poses, comes from \
his study of Michelangelo in Rome, where he spent eight years. The paint, fairly fluid, \
plays on a few chords: the pearly white of the chemise, the red of the hangings, the ochre \
of the drapery."""
details = [
  "The eyes of the horse’s head, round and white, with no pupil at all.",
  "The demon’s gaze, turned not toward the sleeper but toward us.",
  "The young woman’s arm hanging to the floor, the hand open.",
  "On the table, the little mirror and the flasks, ordinary toilet objects.",
]
themes = ["dream", "night", "demon", "anguish", "fantastic"]
anecdote = """
It is said that Sigmund Freud had hung an engraving of The Nightmare in his Vienna \
apartment at 19 Berggasse. The painting, which shows the dream as an inner drama, has \
often been linked to The Interpretation of Dreams."""
salle = 2
mur = "nord"
place = 1
largeur = 1.27

[[oeuvres]]
titre = "Newton"
artiste = "William Blake"
annee = "1795–c. 1805"
image = "newton.jpg"
technique = "Colour print, ink and watercolour on paper, 46 × 60 cm"
collection = "Tate Britain, London"
note = "The scientist, naked on the sea floor, sees only the figure he traces with his compass: for Blake, reason is a prison."
description = """
A naked, muscular young man with curly hair sits on a rock covered with lichens and \
corals, at the bottom of what looks like a dark sea. Leaning forward, he bends his back \
until it almost touches his knees. With his right hand he sets the points of a compass on \
a scroll of paper unrolled on the ground, where a triangle and an arc of a circle can be \
made out; with his left hand he holds the other end of the scroll. A white drapery hangs \
from his shoulder. His very pure profile is turned entirely toward the drawing. Behind him, \
the rock forms a teeming mass of colours, reds, ochres and greens; in front, the blue-black \
ground is empty."""
evocation = """
For Blake, Isaac Newton embodies the reason that measures the world and shuts it up in \
laws. His hero has the beauty of a Greek athlete, but he is bent over, his eyes fixed on \
the paper: he sees neither the prodigious rock behind him nor the immensity around him. \
The poet-painter sets this single, purely calculating vision against the imagination, \
which alone gives access to the spirit. The compass recalls that of the creator god, \
Urizen, in his prophetic books. It is often read as a critique of the Enlightenment and \
the science of his day, but the figure remains so beautiful that some have also seen an \
ambivalent admiration for the scientist’s genius."""
histoire = """
The image belongs to the series of twelve Large Colour Prints that Blake conceived in \
1795, in Lambeth, with subjects taken from the Bible, Shakespeare, Milton and his own \
mythology. Each subject was printed in only a few copies, retouched one by one. This \
impression was pulled and reworked later, around 1805, hence its double date. It is often \
compared with Nebuchadnezzar, the king turned beast: two figures of diminished man, one by \
reason alone, the other by madness. Blake sold these sheets to his chief patron, Thomas \
Butts. Long kept out of public view, the print entered the Tate in 1939, given by the \
collector W. Graham Robertson, a great champion of the artist."""
facture = """
Blake invents here a process close to monotype. He first paints the motif in thick colours \
on a rigid support, then presses a sheet of paper against it: as it peels away, the \
colour leaves a grainy, marbled texture, very visible in the rock. He then reworks each \
impression in ink and watercolour, sharpening the contours and the modelling of the body. \
The firm, linear drawing comes from his training as an engraver and his admiration for \
Michelangelo."""
details = [
  "The marbled texture of the rock, obtained by peeling the paper off the paint.",
  "The points of the compass resting on the scroll, at his fingertips.",
  "The scientist’s toes spilling over onto the paper.",
  "Beneath the rock, near the leg, a pale shape suggesting a sea creature.",
]
themes = ["science", "reason", "imagination", "nude", "vision"]
anecdote = """
In front of the British Library in London, a large bronze statue by Eduardo Paolozzi, \
Newton, after Blake (1995), takes up the pose of this print: the scientist bent over, \
compass in hand, measuring the ground."""
salle = 2
mur = "nord"
place = 3
largeur = 1.1

[[oeuvres]]
titre = "The Third of May 1808"
artiste = "Francisco de Goya"
annee = "1814"
image = "tres-de-mayo.jpg"
technique = "Oil on canvas, 268 × 347 cm"
collection = "Museo del Prado, Madrid"
note = "The night after the Madrid uprising, patriots are shot by Napoleon’s soldiers: the first great modern image of war."
description = """
The scene takes place at night, at the foot of a bare hill, on the outskirts of Madrid, \
whose steeple and rooftops can be glimpsed. At right, a row of French soldiers, seen from \
behind, their faces hidden, shoulder their rifles. At left, facing them, a group of \
Madrileños awaits death. At the centre, a man in a white shirt and yellow trousers, \
kneeling, spreads his arms in the form of a cross, his eyes bulging. Around him, a monk \
prays with clasped hands, others cover their faces. On the ground, bloodied bodies already \
lie; behind, a line of condemned men climbs toward the place of execution. A large \
cubic lantern set on the ground lights the victim harshly."""
evocation = """
Goya overturns history painting: there is no victorious hero and no general, only \
anonymous people facing a killing machine. The soldiers, faceless, form a single \
mechanical block; the victims each have their own fear. The man in white, arms \
outstretched, recalls Christ on the cross, and a mark on his hand, evoking the stigmata, \
has been noted. The lantern, which should illuminate, here serves to take aim. The \
painting, made after Napoleon’s defeat in Spain, pays homage to the people of Madrid, but \
above all it speaks of the horror of war, without glory or consolation. Manet and then \
Picasso, with his Massacre in Korea, would remember it."""
histoire = """
On 2 May 1808, the people of Madrid rose up against the French troops occupying the city; \
during the night and the next day, Murat had many prisoners shot, notably on the hill of \
Príncipe Pío. Six years later, in February 1814, when the French had left Spain, Goya \
proposed to the Regency government to perpetuate the heroic episodes of the uprising with \
his brush. He painted two large canvases, the Second of May, the charge against the \
Mamelukes, and this Third of May. King Ferdinand VII, restored to the throne, hardly \
showcased them: they remained in storage for a long time and appeared in the Prado \
catalogue only in 1872. During the Civil War, they were evacuated with the museum’s \
collections."""
facture = """
The composition sets two masses against each other: at right, the soldiers on a diagonal, \
lined up like a single weapon; at left, a disordered group of bodies and gestures. Between \
them, a narrow gap, which the rifle barrels almost cross. All the light comes from the \
lantern, set on the ground, and is concentrated on the white shirt. Goya paints fast, in \
broad strokes of the brush, leaving blurred contours and barely sketched faces. The range \
is dark, brown and black, relieved by the white, the yellow and the red of the blood."""
details = [
  "The lantern set on the ground, the scene’s only source of light.",
  "The open palms of the man in white, like those of a crucified figure.",
  "The tonsured monk praying, kneeling beside him.",
  "In the background, the steeple and houses of Madrid, extinguished in the night.",
  "The blood running on the ground, in the left foreground.",
]
themes = ["war", "execution", "night", "people", "history"]
anecdote = """
Kneeling, the man in the white shirt already looks as tall as the standing soldiers: if \
he stood up, he would tower over them all. Goya enlarged the victim, no doubt so that he \
would dominate the scene."""
salle = 3
mur = "ouest"
place = 2
largeur = 3.47

[[oeuvres]]
titre = "Saturn Devouring His Son"
artiste = "Francisco de Goya"
annee = "1820–1823"
image = "saturne.jpg"
technique = "Mural painting in oil transferred to canvas, 143.5 × 81.4 cm"
collection = "Museo del Prado, Madrid"
note = "One of the Black Paintings that Goya made for himself alone on the walls of his house near Madrid."
description = """
Against an entirely black ground looms a giant with dishevelled grey hair, crouching, his \
knees bent. His eyes are wide, a frightening white, and his gaping mouth bites into a \
human body. He grips in his two enormous fists this naked body, whose head has already \
disappeared; bright red blood runs over the white flesh. The victim’s body, with an \
adult’s hips and legs, hangs downward. The rest of the god’s figure, his shoulders, his \
thighs, his pallid knee at lower right, is lost in the darkness. There is no setting, no \
place, no floor: only this apparition that seems to emerge from the night."""
evocation = """
The ancient myth tells that Saturn, the Greek Cronus, devoured his children so that none \
of them would take his throne. Goya turns it into a scene of madness and dread: the god \
seems himself terrified by his act, as if he could not stop. Since Saturn was also the \
god of time, some have seen time consuming everything; others read an image of Spain \
devouring its own children in war and repression, or of the absolute power of Ferdinand \
VII. Saturn was, finally, the planet of melancholy: painted by an old, deaf and ailing \
man, the scene has been linked to his private anxieties. Goya left no explanation."""
histoire = """
In 1819, Goya, who was over seventy and had long been deaf, bought a country house on the \
banks of the Manzanares, near Madrid, known as the Quinta del Sordo, the House of the Deaf \
Man. He covered the walls of two rooms directly with fourteen large oil paintings, with no \
commission and no audience, which are now called the Black Paintings. Saturn was on the \
ground floor, in the dining room. The current titles are not his. In 1873, Baron Émile \
d’Erlanger bought the house; the paintings were detached from the walls and transferred \
to canvas, shown at the Exposition Universelle in Paris in 1878, then given to the Prado \
in 1881."""
facture = """
Goya paints in oil directly on the wall plaster, with a palette reduced to black, ochres, \
greys and white, relieved only by the red of the blood. The touch is rapid, broad, \
sometimes brutal: he probably worked with the brush and perhaps with the knife, leaving \
the paint substance visible. The figure, framed too large for the space, almost touches \
the edges and seems to want to break out. He knew Rubens’s Saturn, kept in the royal \
collections, but he strips it of all elegance."""
details = [
  "The round white eyes, in which one reads as much fear as rage.",
  "The giant’s fingers digging into the victim’s back.",
  "The red of the blood, the only bright colour in the whole painting.",
  "The pale knee at lower right, emerging from the shadow.",
]
themes = ["mythology", "madness", "time", "violence", "black paintings"]
anecdote = """
A photograph taken by Jean Laurent around 1874, before the transfer to canvas, shows a \
slightly different state of the painting: certain parts of the figure, now lost in the \
shadow, are more legible in it. The transfer damaged and altered the work."""
salle = 3
mur = "nord"
place = 3
largeur = 0.85

[[oeuvres]]
titre = "The Raft of the Medusa"
artiste = "Théodore Géricault"
annee = "1818–1819"
image = "radeau-meduse.jpg"
technique = "Oil on canvas, 491 × 716 cm"
collection = "Musée du Louvre, Paris"
note = "Thirteen days adrift after the wreck of a French frigate: a news story turned history painting, which caused a scandal at the Salon of 1819."
description = """
On a makeshift raft tossed by a heaving sea, some twenty men are crowded together, dead, \
dying or surviving. In the foreground, corpses slip into the water; at left, an old man \
draped in red holds a young man’s body on his knees and stares into space. Behind, a \
swollen sail, a mast held by ropes. The bodies rise toward the right in a pyramid of \
outstretched arms, up to a Black man perched on a barrel, who waves a cloth toward the \
horizon. Out there, tiny, the silhouette of a ship can be made out. The sky is laden with \
dark clouds, torn by a yellow glow, and an enormous wave rises at left."""
evocation = """
Géricault turns a recent news story into a tragic epic, on the scale of history painting. \
The painting speaks of despair and hope intermingled: from death, below, to the call for \
help, above, the whole canvas strains toward this almost invisible ship. At the chosen \
moment, the castaways do not yet know whether they will be seen. For the public of 1819, \
the work was also an accusation: the wreck was blamed on a captain appointed through \
political favour under the Restoration. By placing a Black man at the top of the pyramid, \
at a time when the abolition of the slave trade was being debated, Géricault took a \
stand that has often been stressed. The raft has become an image of humanity left to \
itself."""
histoire = """
In July 1816, the frigate Méduse, carrying settlers to Senegal, ran aground off \
Mauritania. For lack of boats, about one hundred and fifty people were abandoned on a \
raft; rescued thirteen days later by the brig Argus, only about fifteen survived. The \
account by two survivors, the surgeon Savigny and the engineer Corréard, published in \
1817, revealed the killings and the cannibalism. Géricault met them, had a model of the \
raft built, and studied severed limbs and dying patients at the Beaujon hospital. \
Exhibited at the Salon of 1819 under the title Scene of Shipwreck, the painting divided \
the critics. It was then shown in London in 1820, with great success. After the painter’s \
death, in 1824, it entered the Louvre."""
facture = """
The composition rests on two pyramids: that of the sail and mast, at left, and that of \
the bodies, culminating with the man holding the cloth, at right. The crossing diagonals \
give the movement of the swell. Géricault models the bodies like sculptures, with a hard \
light coming from the left, in the spirit of Michelangelo and Caravaggio. The palette is \
dark, made of browns, ochres and greens. He used bitumen, a pigment that darkens and \
cracks over time: the painting has darkened considerably."""
details = [
  "On the horizon, at right, the tiny silhouette of the brig Argus.",
  "The old man in the red cloak keeping watch over a young man’s body.",
  "The Black man at the top, waving a red and white cloth.",
  "The bodies of the dead, below, already slipping into the water.",
  "The enormous wave rising at left, behind the sail.",
]
themes = ["shipwreck", "death", "hope", "current events", "sea"]
anecdote = """
The young Eugène Delacroix, a friend of Géricault, posed for one of the castaways: he is \
traditionally recognized in the body stretched face down on the raft, in the foreground, \
his arm outstretched. He was overwhelmed by the unfinished painting."""
salle = 4
mur = "est"
place = 2
largeur = 4.5

[[oeuvres]]
titre = "Liberty Leading the People"
artiste = "Eugène Delacroix"
annee = "1830"
image = "liberte.jpg"
technique = "Oil on canvas, 260 × 325 cm"
collection = "Musée du Louvre, Paris"
note = "On 28 July 1830, on a Parisian barricade: an allegory in flesh and blood leads the insurgents against Charles X."
description = """
A woman in a Phrygian cap, her breast bare, climbs a barricade of paving stones and \
beams, brandishing the tricolour flag in one hand and a bayonet-fitted rifle in the \
other. She turns toward those following her. At left, a man in a frock coat and top hat \
holds a shotgun; beside him, a workman armed with a sabre. At right, a street urchin in a \
beret brandishes two pistols, shouting. At the foot of the barricade, a wounded man \
raises himself toward her; in the foreground lie corpses, a half-naked insurgent and \
soldiers in uniform. In the background, in the smoke, the towers of Notre-Dame can be \
glimpsed."""
evocation = """
Delacroix blends allegory and reportage. Liberty is not an ancient statue but a woman of \
the people, vigorous, barefoot, marching into battle; around her, insurgents of all \
conditions, bourgeois, workers, a child, embody the union of the people during the Three \
Glorious Days. The tricolour flag, banned under the Restoration, regains its place at the \
summit of the composition. The dead in the foreground recall the price of victory. The \
painting has become the very image of the Republic and of revolt: the boy with the \
pistols has been seen as a model for Gavroche in Les Misérables, and the figure of \
Liberty has inspired countless posters."""
histoire = """
On 27, 28 and 29 July 1830, Paris rose up against the ordinances of Charles X, who had \
to abdicate. Delacroix, who had not fought, began the canvas in the autumn; he wrote to \
his brother that if he had not conquered for the fatherland, he would at least paint for \
it. The painting was exhibited at the Salon of 1831 and bought by the State under \
Louis-Philippe. But the image, judged too revolutionary, was soon taken off the walls and \
returned to the artist. It reappeared at the Exposition Universelle of 1855 and entered \
the Louvre in 1874. A restoration completed in 2024 removed the yellowed varnishes that \
had darkened it and restored the colours’ original brilliance."""
facture = """
The composition is a pyramid, whose base is made of the stretched-out bodies and whose \
apex is the flag. Liberty seems to step out of the painting and walk toward the viewer. \
Delacroix concentrates the light on Liberty and on the flag, whose blue, white and red \
are echoed in the clothing of the wounded man and of several figures. The touch is lively \
and visible, the smoke broadly brushed. He remembers Géricault’s Raft of the Medusa, his \
elder, for the composition and for the bodies of the foreground."""
details = [
  "The signature and date, Eug. Delacroix 1830, in red on a beam at right.",
  "The towers of Notre-Dame in the smoke, to the right of Liberty.",
  "The wounded man in a blue smock, red sash and white shirt, in the colours of the flag.",
  "The boy with the two pistols, shouting as he advances.",
  "The dead soldier at right, in uniform, his shako fallen beside him.",
]
themes = ["revolution", "liberty", "allegory", "Paris", "flag"]
anecdote = """
From 1979, the hundred-franc note reproduced Liberty Leading the People, together with \
Delacroix’s portrait: for nearly twenty years, the French carried the painting in their \
pockets."""
salle = 4
mur = "nord"
place = 3
largeur = 3.25

[[oeuvres]]
titre = "Wanderer above the Sea of Fog"
artiste = "Caspar David Friedrich"
annee = "c. 1817"
image = "voyageur.jpg"
technique = "Oil on canvas, 94.8 × 74.8 cm"
collection = "Hamburger Kunsthalle, Hamburg"
note = "A man seen from behind, on the summit of a rock, facing a landscape drowned in mist: the very image of German Romanticism."
description = """
At the centre of the painting, a man stands on a point of dark rock, seen from behind, \
facing the landscape. He wears a dark green frock coat and leans on a cane; the wind \
lifts his red hair. Before him and below him stretches a sea of fog from which rocky \
crests, pine-clad summits and, in the distance, a cone-shaped mountain emerge. At right, \
a tall rock formation stands out against the horizon. Farther still, bluish mountain \
ranges are lost in a cloudy sky, pale and milky. The traveller’s silhouette occupies \
exactly the vertical axis of the canvas, and his head lies at the point where the lines \
of the mountains cross."""
evocation = """
Friedrich places the viewer just behind the traveller: we see what he sees, without \
knowing his face or his thoughts. This figure seen from behind, his favourite, invites \
contemplation. The landscape, partly hidden by the clouds, suggests the infinite, the \
grandeur of nature before man, what the philosophers called the sublime. It has been read \
as a meditation on solitude, on the place of the individual in the world, or as a \
religious experience. The costume, a German-style frock coat, has led some to suppose a \
tribute to a fighter of the wars of liberation against Napoleon. The painting has become \
the emblem of Romanticism, to the point of illustrating countless book covers."""
histoire = """
The exact date of the painting is unknown; it is placed around 1817, when Friedrich, \
settled in Dresden, was recognized but still debated. The rocks and summits come from the \
Elbe Sandstone massif, Saxon Switzerland, which the painter roamed on foot, drawing. He \
did not paint from the motif: in the studio, from these sketches, he recomposed a \
landscape that does not exist as such. Forgotten, like its author, for decades after his \
death, the painting became famous only in the twentieth century, with the rediscovery of \
Friedrich. The Hamburger Kunsthalle acquired it in 1970; it is today its best-known \
work."""
facture = """
Friedrich builds the painting with rigour: the figure is placed on the central axis, the \
slopes of the mountains converge on his head. The contrast is sharp between the dark \
rock, crisp and detailed, of the foreground, and the pale, blurred, almost immaterial \
distance, which gives the impression of depth. The paint is smooth, with no visible \
brushwork, laid on in thin layers. The cold tones, greys, blues, whites, convey the \
dampness of the air and the diffuse light of the fog."""
details = [
  "The traveller’s hair, lifted by the wind.",
  "The cane on which he leans, barely visible at right.",
  "The small pines on the crests emerging from the mist, at right.",
  "The cone-shaped mountain, at left, almost erased by the fog.",
]
themes = ["landscape", "mountain", "fog", "solitude", "sublime"]
anecdote = """
The figure seen from behind is so typical of Friedrich that German historians gave it a \
name, the Rückenfigur, the figure from behind. The painter uses it in many paintings to \
draw the viewer into the landscape."""
salle = 5
mur = "nord"
