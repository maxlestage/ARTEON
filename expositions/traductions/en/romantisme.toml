[exposition]
ordre = 70
nom_court = "Romanticism"
mouvement = "Romanticism"
cadre = "baroque"
couleur = "#8e2a2a"
titre = "Romanticism: Storm and Dream"
artiste = "Füssli, Blake, Goya, Friedrich, Turner, Constable, Géricault, Delacroix"
dates = "1781–1839"
accroche = "Virtual exhibition · Musée du Louvre, Paris"
introduction = """
Between the late eighteenth century and the middle of the nineteenth, the Romantic painters \
preferred emotion to rules, and dreams, wild nature and burning current events to the \
models of antiquity. From Füssli’s Nightmare to Turner’s Temeraire, the visit brings together \
ten works by eight artists from England, Spain, Germany and France: visions, wars, \
shipwrecks, revolutions and infinite landscapes. The building is inspired by the great red \
galleries of the Louvre, the Daru and Mollien rooms, very high-ceilinged, where the immense \
formats of nineteenth-century French painting hang, and by a more intimate cabinet \
reserved for landscape."""
vitrine = "radeau-meduse.jpg"

[musee]
nom = "Musée du Louvre"
ville = "Paris, France"
construction = "museum opened in 1793"
presentation = """
A fortress built by Philip Augustus around 1200, then a palace of the kings of France \
enlarged reign after reign, the Louvre became a museum during the Revolution: the Muséum \
central des arts opened on 10 August 1793 in the Grande Galerie. Napoleon III completed the \
palace by having Louis Visconti and then Hector Lefuel build, from 1852 to 1857, the wings \
of the Nouveau Louvre, including the Denon wing, named after Vivant Denon, the museum’s \
first director under Napoleon I. Visitors climb the Daru staircase, at the top of which \
stands the Winged Victory of Samothrace. On the first floor, the red-walled Daru and Mollien \
rooms, lit by high skylights, house the very large formats of nineteenth-century French \
painting, from David’s Coronation of Napoleon to Géricault’s Raft of the Medusa and \
Delacroix’s Liberty Leading the People. Since 1989, visitors have entered the museum \
through Ieoh Ming Pei’s glass pyramid."""
ici = """
ARTEON’s building takes up the sequence of red rooms of the Denon wing. You enter from \
the south onto the Daru landing, then into “The Denon Salon · Visions and Nightmares”, \
square, with dusty-pink walls. From there, in enfilade, two great galleries twelve metres \
high, painted the same red, open out: to the west “The Daru Room · Goya”, to the east \
“The Mollien Room · History on the March”, where the Raft of the Medusa and Liberty \
await. To the north of the salon, the small, low cabinet of landscapes, with pale walls, \
brings together Friedrich, Turner and Constable."""

