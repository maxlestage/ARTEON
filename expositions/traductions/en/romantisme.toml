[[oeuvres]]
titre = "The Monk by the Sea"
artiste = "Caspar David Friedrich"
annee = "1808–1810"
image = "moine-mer.jpg"
technique = "Oil on canvas, 110 × 171.5 cm"
collection = "Alte Nationalgalerie, Berlin"
note = "A tiny silhouette before a black sea and an immense sky: the most radical landscape of its time."
description = """
The canvas is almost empty. At the bottom, a band of pale, sandy dune undulates from left \
to right. Above, a thin band of very dark, almost black sea, dotted with a few crests of \
foam and white gulls. All the rest, more than three quarters of the painting, is taken up \
by the sky: below, a heavy sheet of grey-blue mist rising from the sea; higher up, a few \
lit white clouds, then a blue that lightens toward the top. On the dune, left of centre, \
stands a small figure dressed in dark clothes, a monk seen from behind, gazing at the \
sea. There is no boat, no tree, no distant shore."""
evocation = """
Nothing guides the eye: no foreground, no path, no object by which to measure distance. \
The viewer finds himself, like the monk, facing the void. It has been seen as man alone \
before the infinite, before God or before death, and often as a spiritual self-portrait of \
the painter. The writer Heinrich von Kleist described the feeling of standing before this \
painting as if one’s eyelids had been cut away. For many historians, it is one of the \
first works in which painting abandons classical composition; it has been compared, much \
later, with the great colour fields of Mark Rothko."""
histoire = """
Friedrich painted the canvas between 1808 and 1810 in Dresden, from memories of the \
island of Rügen, on the Baltic, which he had travelled several times. He exhibited it at \
the Berlin Academy in autumn 1810, with its pendant, Abbey in an Oak Forest. The public \
was baffled, but King Frederick William III of Prussia bought both canvases, at the \
request of his fifteen-year-old son, the crown prince. That same year, Friedrich was \
elected a member of the Berlin Academy. The two paintings have remained together in the \
Prussian collections, today in the Alte Nationalgalerie, where they were restored from \
2013 to 2016."""
facture = """
The composition, made entirely of horizontal bands, is of an unheard-of simplicity for \
the period. Friedrich removed, as he worked, whatever might have reassured the eye: \
scientific examination has revealed sailing ships on the sea, which he later painted \
out. The paint is applied in thin, numerous, smoothed layers, with no trace of the brush, \
which produces these very soft passages from grey to blue. The tiny figure alone gives \
the scale of the immensity."""
details = [
  "The monk, tiny, the only vertical in the whole painting.",
  "The gulls, mere white dots above the sea.",
  "The crests of foam on the black sea.",
  "The lit white clouds in the middle of the sky, the only luminous note.",
]
themes = ["sea", "solitude", "infinity", "sky", "meditation"]
anecdote = """
Scientific imaging has shown that Friedrich had first painted two sailing ships on the \
sea. He covered them over, preferring to leave the monk absolutely alone before the \
horizon."""
salle = 5
mur = "ouest"
place = 1
largeur = 1.7

[[oeuvres]]
titre = "The Fighting Temeraire Tugged to Her Last Berth"
artiste = "Joseph Mallord William Turner"
annee = "1839"
image = "temeraire.jpg"
technique = "Oil on canvas, 90.7 × 121.6 cm"
collection = "National Gallery, London"
note = "A hero of Trafalgar, towed by a small steam tug toward the breaker’s yard, beneath a blazing sunset."
description = """
On the Thames, at sunset, a great three-masted warship, ghostly white, glides over the \
calm water. She is pulled by a small steam tug, dark and squat, whose tall funnel belches \
russet smoke. At right, the sun sets in an explosion of reds, oranges and yellows that \
sets the clouds ablaze and is reflected in the river. A black buoy floats in the \
foreground at right. At left, the sky is colder, bluish, and a thin crescent moon can be \
made out. In the distance, other sailing ships and the low shore, barely visible. The \
great ship and her tug are reflected together in the still water."""
evocation = """
The painting sets two worlds against each other: the old sailing ship, pale as a spectre, \
and the steam tug, black and busy, which leads her to her end. One reads in it the end of \
a heroic era, that of Nelson’s navy, and the arrival of the industrial age. The setting \
sun on one side, and the rising moon on the other, redouble the idea of a day coming to \
a close. Turner does not take sides in any simple way: the machine is ugly, but powerful \
and alive. Nostalgia, glory and death mingle in this twilight. For many Britons, it is an \
image of national greatness and of its decline."""
histoire = """
HMS Temeraire, a ship of 98 guns, distinguished herself at the Battle of Trafalgar in \
1805, just behind Nelson’s Victory. Decommissioned, she was sold in 1838 and towed from \
Sheerness to Rotherhithe, on the Thames, to be broken up. Turner drew from this the \
painting, exhibited at the Royal Academy in 1839 under a long title, The Fighting \
Temeraire, tugged to her last berth to be broken up. It was acclaimed by the critics. The \
painter refused to sell it and kept it in his studio; at his death, he bequeathed it to \
the nation with hundreds of other works. It entered the National Gallery as part of the \
Turner Bequest."""
facture = """
Turner took liberties with reality: the ship had been stripped of her masts before her \
last voyage, and he gives them back to her for the beauty of the image. The ship is \
painted in thin, transparent, almost translucent layers, while the sunset sky is worked \
in thick paste, almost in relief. The composition plays on the opposition of cold colours, \
at left, and warm ones, at right. The low horizon line leaves the sky most of the canvas."""
details = [
  "The thin crescent moon in the bluish sky, at upper left.",
  "The tug’s funnel and its orange smoke.",
  "The black buoy floating in the foreground at right.",
  "The small white flag fluttering above the smoke.",
  "The thick paste of the setting sun, almost in relief.",
]
themes = ["sea", "twilight", "industry", "nostalgia", "ship"]
anecdote = """
In 2005, a BBC poll named this painting the most beloved of the British. Since 2020, it \
has appeared, with a self-portrait of Turner, on the Bank of England’s twenty-pound \
note."""
salle = 5
mur = "est"
place = 1
largeur = 1.22

[[oeuvres]]
titre = "The Hay Wain"
artiste = "John Constable"
annee = "1821"
image = "charrette-foin.jpg"
technique = "Oil on canvas, 130.2 × 185.4 cm"
collection = "National Gallery, London"
note = "A wagon crosses a ford on the Stour, in the Suffolk of his childhood: the English countryside, painted as never before."
description = """
An empty wooden wagon, drawn by horses, slowly crosses the ford of a shallow river. Two \
men drive it. At left, a small house of brick and timber with a red roof, surrounded by \
trees, is reflected in the water; a woman draws water at the bank. In the foreground, on \
the path, a small black and white dog watches the wagon. At the centre, tall trees with \
dense foliage; at right, a sunlit meadow stretches to a distant edge where haymakers at \
work can be made out. A fisherman hides in the reeds at right. A great summer sky, \
crossed by white and grey clouds, covers the whole upper half."""
evocation = """
Constable paints the countryside of his childhood, around his father’s mill, with no hero \
and no ancient ruin: an ordinary scene of rural labour, on a summer day. This choice, in \
1821, is almost a manifesto: the simplest landscape deserves a large format, formerly \
reserved for history. One feels the painter’s deep attachment to these places, which he \
said were the origin of his vocation. In an England that was industrializing, the \
painting gradually took on the value of a symbol: that of an ideal countryside, peaceful \
and unchanging, which has become one of the country’s most popular images."""
histoire = """
The site is real: the Stour, near Flatford Mill, in Suffolk, which Constable’s father \
owned; the house at left belonged to a neighbouring farmer, Willy Lott. The painter, \
settled in London, worked from studies he had made there. He first made a full-size oil \
sketch, now in the Victoria and Albert Museum. The painting was exhibited at the Royal \
Academy in 1821 under the title Landscape: Noon, without finding a buyer. In 1824, the \
dealer John Arrowsmith bought it and exhibited it at the Paris Salon, where it received a \
gold medal from King Charles X and impressed the young French painters. It was given to \
the National Gallery in 1886."""
facture = """
Constable observes nature with an almost scientific precision, in particular the clouds, \
which he was studying systematically at that time. His touch is fragmented, lively, with \
small flecks of pure white laid on the leaves and the water to render the reflections of \
light, which critics called Constable’s snow. The greens, varied, are those of nature and \
not the conventional browns of studio landscapes. These daring choices would impress \
Delacroix and then the Barbizon school."""
details = [
  "The little dog on the bank, watching the wagon.",
  "The woman drawing water in front of Willy Lott’s house.",
  "The fisherman half hidden in the reeds, at right.",
  "The touches of pure white on the leaves and on the water.",
]
themes = ["countryside", "river", "sky", "labour", "summer"]
anecdote = """
Willy Lott’s cottage still exists, at Flatford, on the banks of the Stour. The site, \
owned by the National Trust, attracts visitors every year who come to find the painting’s \
viewpoint, almost unchanged two centuries later."""
salle = 5
mur = "sud"
place = 1
largeur = 1.85

[[artistes]]
nom = "Johann Heinrich Füssli"
vie = "Zurich, 7 February 1741 – Putney Hill (London), 16 April 1825"
biographie = """
The son of a Zurich painter, Johann Heinrich Füssli first studied theology and became a \
pastor, together with his friend Johann Kaspar Lavater. In 1762 the two publicly \
denounced the abuses of a city magistrate; the scandal drove them to leave Switzerland. \
After a stay in Germany, Füssli settled in London in 1764, where he lived by translation \
and writing. Encouraged by Joshua Reynolds, he turned to painting and left for Rome in \
1770. There he spent eight years studying Michelangelo and antiquity. Back in London, he \
achieved fame in 1782 with The Nightmare. Under the anglicized name of Henry Fuseli, he \
undertook a Milton Gallery, inspired by Paradise Lost, and illustrated Shakespeare for \
the publisher Boydell’s gallery. Elected to the Royal Academy in 1790, he became its \
professor of painting and then Keeper of the schools, and trained a whole generation of \
artists. A friend of the feminist Mary Wollstonecraft and admired by William Blake, he \
died at the age of eighty-four and was buried in St Paul’s Cathedral in London."""
style = """
Füssli paints scenes of dream, terror and visions drawn from Shakespeare, Milton or Nordic \
legends. His figures, with stretched bodies and exaggerated gestures, come from \
Michelangelo and Mannerism; his compositions, lit like a theatre stage, isolate a few \
actors against dark backgrounds. He brought the fantastic and the unconscious into \
painting, and anticipated Romanticism, then Symbolism and Surrealism."""

[[artistes]]
nom = "William Blake"
vie = "London, 28 November 1757 – London, 12 August 1827"
biographie = """
The son of a Soho hosier, William Blake claimed to have had visions from childhood. At \
fourteen, he was apprenticed to the engraver James Basire, who sent him to draw the tombs \
of Westminster Abbey; there he discovered Gothic art. He then attended classes at the \
Royal Academy and in 1782 married Catherine Boucher, who would help him throughout his \
life in his printing work. Around 1788, he invented a relief-etching process that allowed \
him to print his poems and his images together, which he then coloured by hand: these are \
the Songs of Innocence and of Experience, then his prophetic books, peopled with gods of \
his own invention. From 1800 to 1803 he lived at Felpham, by the sea, with the poet \
William Hayley; there he was accused of sedition by a soldier, then acquitted. His solo \
exhibition of 1809 was a failure. Supported by a few faithful followers, Thomas Butts and \
then the young painter John Linnell, he illustrated the Book of Job and the Divine \
Comedy at the end of his life. He died poor, almost forgotten."""
style = """
Blake is at once poet, engraver and painter. His drawing, linear and firm, inherited from \
engraving, Gothic art and Michelangelo, counts for more than colour, which he applies in \
watercolour or through printing processes of his own invention. He rejects the imitation \
of nature and paints his visions: idealized bodies, cosmic figures, symbols of a personal \
mythology. Rediscovered by the Pre-Raphaelites, he fascinated the Symbolists and the \
twentieth-century counterculture."""

[[artistes]]
nom = "Francisco de Goya"
vie = "Fuendetodos (Aragon), 30 March 1746 – Bordeaux, 16 April 1828"
biographie = """
Born in an Aragonese village, Francisco de Goya y Lucientes trained in Zaragoza, then \
travelled to Italy in 1771. Settled in Madrid, from 1775 he drew cartoons for the Royal \
Tapestry Factory, scenes of festivities and popular games. A member of the San Fernando \
Academy and a sought-after portraitist, he became painter to the king’s chamber in 1789. \
In 1792–93, a serious illness left him permanently deaf. His art then became freer and \
darker: in 1799 he published the Caprichos, etchings that mock superstition and the vices \
of society, and in 1800 painted The Family of Charles IV. The Napoleonic invasion of 1808 \
and the war that followed inspired the Disasters of War and the two great canvases of 2 \
and 3 May 1808. Under the absolutist reign of Ferdinand VII, he withdrew to his house \
near the Manzanares, which he covered with the Black Paintings. In 1824 he went into \
exile in France and settled in Bordeaux, where he continued to paint and to experiment \
with lithography until his death, at the age of eighty-two."""
style = """
Goya moves from the Rococo grace of the tapestry cartoons to a painting ever freer, \
quicker and more expressive. An heir of Velázquez, whose paintings he engraved, he paints \
in broad strokes, with a striking economy of means, and dares to show violence, madness \
and cruelty without embellishing them. Court painter and critical witness of his time, \
brilliant printmaker, he opens the way to Delacroix, to Manet, then to Expressionism."""

[[artistes]]
nom = "Théodore Géricault"
vie = "Rouen, 26 September 1791 – Paris, 26 January 1824"
biographie = """
Born in Rouen into a well-off family, Théodore Géricault grew up in Paris. Passionate \
about horses, he trained with Carle Vernet, a painter of equestrian scenes, then with \
Pierre-Narcisse Guérin, and tirelessly copied the masters at the Louvre. At the Salon of \
1812, at twenty-one, he triumphed with an Officer of the Imperial Guard’s Chasseurs \
Charging, a canvas of unprecedented dash. Two years later, his Wounded Cuirassier \
Leaving the Field, painted at the moment of the fall of the Empire, was less well \
received. In 1816–17 he stayed in Italy, where he discovered Michelangelo and prepared a \
great Race of the Riderless Horses in Rome. Back in Paris, he devoted more than a year to \
The Raft of the Medusa, exhibited at the Salon of 1819. He took the painting to England, \
where he discovered English painting and painted the Epsom Derby. Weakened by several \
falls from horses and by illness, he still produced a series of portraits of the insane \
for a physician, then died at thirty-two, after a long agony."""
style = """
Géricault gives current events and modern life the grandeur of history painting. His \
powerful drawing, nourished by Michelangelo and by the study of the body and of horses, \
is allied to a dark, contrasted painting in full impasto. He seeks truth even in \
suffering, madness and death, without idealizing. His very short career opened the way to \
French Romanticism and deeply marked Delacroix, and then Courbet."""

[[artistes]]
nom = "Eugène Delacroix"
vie = "Charenton-Saint-Maurice, 26 April 1798 – Paris, 13 August 1863"
biographie = """
Eugène Delacroix grew up in a family of notables of the Empire. A pupil of \
Pierre-Narcisse Guérin and a friend of Géricault, he made his debut at the Salon of 1822 \
with The Barque of Dante. Two years later, Scenes from the Massacres at Chios, inspired \
by the Greek War of Independence, made him the leader of the Romantic school, in \
opposition to the heirs of David and to Ingres. The Death of Sardanapalus, in 1827, \
caused a scandal by its violence and sensuality. In 1830 he celebrated the July \
Revolution with Liberty Leading the People. In 1832 he accompanied a diplomatic mission \
to Morocco: the colours, light and costumes of North Africa would nourish all his work. \
He then received major commissions for decorative schemes, at the Palais-Bourbon, at the \
Senate, on the ceiling of the Galerie d’Apollon at the Louvre and in the Chapel of the \
Holy Angels in the church of Saint-Sulpice. Elected to the Académie des Beaux-Arts in \
1857, after several failures, he kept a famous Journal. He died in his apartment on the \
rue de Furstenberg, now the Musée national Eugène-Delacroix."""
style = """
For Delacroix, colour takes precedence over drawing. An admirer of Rubens and the \
Venetians, he builds his paintings through contrasts of complementary tones, lively and \
visible touches, and compositions in motion. He draws his subjects from history, \
literature, current events and the Orient. His freedom of touch and his reflection on \
colour opened the way to the Impressionists and the Neo-Impressionists, who regarded him \
as a precursor."""

[[artistes]]
nom = "Caspar David Friedrich"
vie = "Greifswald, 5 September 1774 – Dresden, 7 May 1840"
biographie = """
Born in Greifswald, a small Baltic port then under Swedish rule, Caspar David Friedrich \
was the son of a candle and soap maker. His childhood was marked by bereavements: his \
mother died when he was seven, and in 1787 his brother Christoffer drowned trying to \
rescue him after he fell through the ice. He studied at the Copenhagen Academy from 1794 \
to 1798, then settled in Dresden, where he would live all his life. He travelled on foot \
through the island of Rügen, the Harz mountains and Saxon Switzerland, filling his \
sketchbooks with drawings. In 1808, his Tetschen Altarpiece, a cross in the mountains \
conceived as an altarpiece, set off a fierce controversy. In 1810, Prussia bought The Monk \
by the Sea and Abbey in an Oak Forest, and he was elected to the Berlin Academy. He \
married Caroline Bommer in 1818. A professor at the Dresden Academy, he gradually lost \
the public’s favour; a stroke, in 1835, almost prevented him from painting. Forgotten at \
his death, he was rediscovered in the early twentieth century."""
style = """
Friedrich paints meditative landscapes, charged with spiritual meaning: mists, seas, \
ruins, mountains, moonlit nights, often contemplated by figures seen from behind. His \
compositions, symmetrical and spare, set a precise foreground against infinite distances. \
His smooth painting, with very gentle transitions, renders the light of dawn and dusk. He \
made landscape an inner experience, and his radicalism was hailed by the Symbolists and \
then by abstract painters."""

[[artistes]]
nom = "Joseph Mallord William Turner"
vie = "London, 23 April 1775 – London, 19 December 1851"
biographie = """
The son of a Covent Garden barber, Joseph Mallord William Turner entered the Royal \
Academy Schools at fourteen. An early watercolourist, he exhibited from 1790 and \
travelled through England and Wales drawing landscapes and monuments, which engravers \
circulated. Elected an academician in 1802, at twenty-six, he measured himself in his \
canvases against Claude Lorrain and the great landscape painters, and became professor of \
perspective there. A great traveller, he discovered the Alps in 1802, Italy in 1819, then \
Venice, whose light transformed his painting. His canvases became ever freer, made of \
light, vapour and storms, and baffled part of the critics, while the young John Ruskin \
came to his defence in Modern Painters, in 1843. Rich and secretive, he lived in \
retirement at the end of his life in Chelsea, under an assumed name. He bequeathed to the \
nation the bulk of his work, several hundred paintings and thousands of drawings and \
watercolours, today divided between the Tate and the National Gallery. He is buried in \
St Paul’s Cathedral."""
style = """
Turner starts from a classical landscape, in the manner of Claude Lorrain, and moves \
toward a painting of light and the elements. His canvases, in which form dissolves in \
sun, mist, snow or steam, combine transparent glazes and impasto. Watercolour, practised \
all his life, taught him fluidity and effects of light. Admired by the Impressionists, he \
is often considered a precursor of abstraction."""

[[artistes]]
nom = "John Constable"
vie = "East Bergholt (Suffolk), 11 June 1776 – London, 31 March 1837"
biographie = """
The son of a wealthy Suffolk miller and corn merchant, John Constable grew up in the \
Stour valley, between the mills of Flatford and Dedham. Destined for the family business, \
he obtained permission in 1799 to go and study at the Royal Academy Schools in London. \
The beginnings were slow: he rejected the fashionable idealized landscape and painted \
what he knew, the countryside of his childhood, often in the open air. In 1816, after \
seven years of engagement thwarted by the young woman’s family, he married Maria \
Bicknell. From 1819 he exhibited at the Royal Academy each year large landscapes nearly \
two metres wide, his six-footers, including The Hay Wain. The Paris Salon of 1824 won \
him a gold medal and the admiration of French painters, while in England recognition was \
slow in coming. Settled in Hampstead, he studied the clouds tirelessly there. Maria’s \
death, in 1828, overwhelmed him. Elected an academician only in 1829, he published with \
the engraver David Lucas mezzotints of his landscapes and died suddenly in London."""
style = """
Constable wants to paint nature as he sees it, with the freshness of a study made on the \
spot. His oil sketches, quick and free, and his sky studies, annotated with the time and \
the wind, are among the most modern of their day. In his large paintings, he keeps this \
liveliness through broken touches and flashes of white. He marked Delacroix, the Barbizon \
school and, through them, Impressionism."""
