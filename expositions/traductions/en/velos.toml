[exposition]
ordre = 168
nom_court = "Bicycles"
mouvement = "The bicycle, from the draisine to the Belle Époque"
cadre = "vitrine"
couleur = "#2e6b7a"
titre = "The Little Queen, a Century of the Bicycle"
artiste = "Drais, Michaux, Starley, Marey, Béraud, Toulouse-Lautrec, Mucha…"
dates = "c. 1820 – 1902"
accroche = "Virtual exhibition · Musée d’Art et d’Industrie, Saint-Étienne"
introduction = """
In 1817, a Baden baron straddles a wooden two-wheeled machine and pushes it along \
with his feet: this is the draisine. Half a century later, pedals fixed to the front \
wheel give birth to the velocipede, then the wheel grows until it is taller than a man: \
here is the penny-farthing. In the 1880s, the chain and two almost equal wheels at last \
produce the safety bicycle, which conquers cities, women and racetracks. The visit \
follows ten stages of this history, from the machines themselves to the images they \
inspired: Marey’s chronophotography, Jean Béraud’s Bois de Boulogne, the posters of \
Toulouse-Lautrec and Mucha. The building is inspired by the Musée d’Art et d’Industrie \
in Saint-Étienne, the city of the cycle, whose old machines rest beneath vaults of \
brick and stone."""
vitrine = "chaine-simpson.jpg"

[musee]
nom = "Musée d’Art et d’Industrie"
ville = "Saint-Étienne, France"
architecte = "Étienne Boisson (Palais des Arts)"
construction = "from 1846"
presentation = """
In 1833, the municipality of Saint-Étienne created a fund for a future museum, \
without yet giving it walls. From 1846, the architect Étienne Boisson raised a \
building intended for the sub-prefecture; it became the Palais des Arts, which housed \
the museum and the municipal library. In 1851, the city bought a large part of Marshal \
Oudinot’s collection of arms. In 1889 the Musée d’Art et d’Industrie was born, bringing \
together the fine arts and the industrial arts; Marius Vachon was its first curator. \
The museum today presents the three industries that made the city: arms, ribbons and \
cycles. According to the museum, the first French bicycle was made in Saint-Étienne in \
1886. Its collection of cycles was formed mainly after the Second World War, thanks to \
donations from the Saint-Étienne cycle trade association and from the Manufacture \
française d’armes et cycles, the future Manufrance, and to purchases by the curator \
Maurice Allemand, who dreamed of a national cycle museum."""
ici = """
The ARTEON building retains from the Saint-Étienne museum its low rooms with walls of \
pale stone and brick, where the old machines line up as in a workshop. You enter from \
the south into the stone-coloured room of the pioneers, where the draisine and the \
velocipede await. Next come, from west to east, the room of the velocipede and the \
penny-farthing, taller to accommodate its giant wheels, then that of the safety \
bicycle, with its walls of light brick. The larger room of racing and the Belle Époque \
brings together science and painting; the visit ends in the poster gallery, as on a \
Parisian hoarding of 1900."""

