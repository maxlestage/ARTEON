[[oeuvres]]
titre = "In Brittany"
artiste = "Robert Demachy"
annee = "1904"
image = "en-bretagne.jpg"
licence = "Domaine public"
source = "https://www.rijksmuseum.nl/nl/collectie/object/RP-F-2005-107-229--f163ce745e2e020104f624607e8dc96e"
technique = "Photogravure after a photograph, signed by hand; image 12.9 × 19.8 cm, sheet 20.1 × 29.4 cm"
collection = "Rijksmuseum, Amsterdam"
note = "A woman in a large white headdress, seated on the rocks facing a coastal village: a photograph that looks like a drawing."
description = """
In the foreground, on dark rocks, a woman sits seen from behind in three-quarter view. She bows her head; a vast white headdress, edged with lace and crossed by a dark ribbon, hides her face, and a broad white collar covers her shoulders. Her hand rests on her lap. Before her stretches an inlet of pale, almost smooth water. On the other side, a line of white houses with dark roofs runs along the shore, dominated by a factory chimney. The sky is not uniform: it is streaked with great oblique marks, like strokes of a brush or pencil. The rocks below, grainy, seem rubbed with charcoal. A dark line frames the image, and at the foot of the sheet Demachy has signed his name."""
evocation = """
The image is constructed like a genre painting: a solitary figure, a headdress that speaks of Brittany, a landscape that extends it. But nothing is told. The woman turns her back on the village and seems lost in a reverie that we shall not share. The painters of Pont-Aven had made Brittany a land of tradition and melancholy; Demachy takes up the motif with the means of photography. The marks in the sky above all show his programme: to prove that the photographer, like the engraver, intervenes on his image and leaves his hand upon it. For the Pictorialists, it is this intervention, not exactness, that makes photography an art."""
histoire = """
Around 1900, Demachy was the major figure of French Pictorialism. In 1894, he took part in the founding of the Photo-Club de Paris, whose annual salons showed photography as painting is shown. He was also a member of the Linked Ring in London and of the Photo-Secession in New York, where Stieglitz published his images in Camera Work. His prints, made in gum bichromate, are unique; to circulate them, he had them reproduced as photogravures, an engraving printed in ink that preserves their nuances. This impression, dated 1904 and signed by hand, was bought by the Rijksmuseum in Amsterdam with the help of several funds, for its collection of early photographs."""
facture = """
Demachy popularised the gum bichromate print, which he presented in 1897 with the Englishman Alfred Maskell under the name “photo-aquatint”. The paper is coated with a mixture of gum arabic, pigment and potassium bichromate, which hardens under light beneath the negative. In development, in water, the gum that has stayed soft washes away: with a brush or a jet of water, the photographer can then lighten an area, erase a detail, soften a contour. The streaks of the sky and the grain of the rocks come from this work. The photogravure faithfully reproduces these effects, down to the brush marks, in a grey-brown tone close to that of the original."""
details = [
  "The white headdress edged with lace, crossed by a dark ribbon.",
  "The hand resting on her lap, lit in the shadow of the collar.",
  "The factory chimney rising above the village roofs.",
  "The oblique marks that streak the sky like brushstrokes.",
  "The signature “Demachy”, beneath the image, at right.",
]
themes = ["brittany", "pictorialism", "gum bichromate", "reverie", "shore"]
anecdote = """
Demachy noted down his failures: on the back of one of his prints preserved in Cleveland, he wrote in English that the coating was too thick, the bichromate insufficient and the development of the highlights overdone. In 1914, he abruptly abandoned photography and never returned to it."""
salle = 1
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "The Arbor (Julia Hall McCune)"
artiste = "Clarence H. White"
annee = "1906"
image = "la-tonnelle.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/1980.159"
technique = "Platinum print, 23.8 × 19.3 cm"
collection = "Cleveland Museum of Art"
note = "A young woman beneath a vine arbour, her face half in shadow: the intimate, quietly spoken portrait of American Pictorialism."
description = """
A young woman with short dark hair stands beneath an arbour. She turns her head to the right and gazes into the distance, lips closed; a shadow cuts across her face, of which only the left half receives the light. She wears a white collar fastened by a small brooch, a dark garment and a band of cloth that crosses her chest diagonally. Her hands, at the bottom of the image, hold a bunch of what can be made out as grapes. At upper left hang broad vine leaves, in dark silhouette; at right, a wooden post. Behind her, the background is pale and blurred, like a veiled sky. The whole image bathes in very soft browns and greys, with no deep black or pure white."""
evocation = """
White photographs above all those close to him, at home or in nature, at dawn or dusk. Here, the setting is almost nothing, an arbour and a pale sky, and everything rests on the sitter's averted gaze. The Cleveland Museum of Art sees in her a young woman lost in thought, and the soft light that bathes part of her face accentuates this meditative mood. The bunch and the vine leaves evoke autumn, the season of ripe fruit, and perhaps the passing of time. One thinks of the American painters of the same period, such as Thomas Dewing, who painted dreamy women in silent interiors or gardens. Photography here is no longer a document: it is a state of mind."""
histoire = """
Julia Hall McCune, a friend of the White family and his pupil, was one of his favourite models. He photographed her in 1906, the year he left Newark, Ohio, where he had been a bookkeeper in a trading firm, to settle in New York. A founding member of the Photo-Secession in 1902, White then exhibited in all the great salons of Europe and America. He later became an influential teacher, at Columbia University and then in his own school. The print belonged to the sitter herself, who had become Julia McCune Flory, before entering the Cleveland Museum of Art in 1980; the museum holds other White prints of the same provenance."""
facture = """
White, self-taught, makes his prints on platinum paper, which he prized for the richness of its halftones. In this process, the sensitive emulsion is absorbed by the paper fibres: the image forms within the paper itself, with a matt look, without gloss, and a very wide range of greys. The focus is deliberately soft, without aggressive sharpness, and the backlighting envelops the silhouette. The composition is carefully calibrated: the diagonal of the cloth, the vertical of the post, the leaves at upper left answering the bunch below. After 1906, White also turned to palladium paper, with similar effects."""
details = [
  "The shadow that divides the face in two.",
  "The small brooch fastening the white collar.",
  "The vine leaves, in silhouette, at upper left.",
  "The bunch held in both hands, at the bottom of the image.",
  "The dark post of the arbour, at the right edge.",
]
themes = ["portrait", "pictorialism", "platinum", "reverie", "autumn"]
anecdote = """
The photography school White opened in New York in 1914 trained students who would become famous, such as Dorothea Lange and Margaret Bourke-White. White died in 1925 in Mexico City, where he had taken his students to photograph."""
salle = 1
mur = "est"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "Brigitta"
artiste = "Frank Eugene"
annee = "c. 1906"
image = "brigitta.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/66703"
technique = "Platinum print, 12.2 × 16.7 cm"
collection = "Art Institute of Chicago (Alfred Stieglitz Collection)"
note = "A little girl in a silk dress, leaning on a table covered with brocade: a child's portrait composed like an old master painting."
description = """
A little girl with dark hair, held back by a bow, leans against a table in profile, her head turned towards us. She wears a pale silk dress, very full, with puffed sleeves, its front embroidered with flowers; the skirt spreads over the floor like a corolla. The table is covered with a cloth with large patterns of foliage and flowers. On it, a small bouquet and a few round objects, fruit or balls, gleam in the half-light; the girl holds a pale object in her hands. At right, a Japanese-style picture, with irises and a bird, hangs on the dark wall. The background is lost in deep browns, from which the dress stands out in full light."""
evocation = """
The large stiff dress, the table with its precious cloth, the solemn child observing us: one thinks of Velázquez's portraits of infantas, which the painters of the late nineteenth century admired so much. But Brigitta's gaze is that of a real child, a little intimidated by the pose. Eugene, trained as a painter, composes the image with the freedom of a painting, combining fabrics, flowers and a Japanese print, like the aesthetes of his day. Photography here borrows from painting its vocabulary, the setting, the golden light, the pose, to prove that it too can produce a work of art and not a mere family souvenir."""
histoire = """
Born in New York to German parents, Frank Eugene studied painting at the Academy of Fine Arts in Munich, then made a name in New York for his photographs. In 1902, he was one of the founding members of the Photo-Secession. Around 1906, he left the United States for Germany, where he would spend the rest of his life. An inscription on the back of this print gives the sitter's name, “Brigitta Wenz”. The print was part of Alfred Stieglitz's personal collection; after his death in 1946, Georgia O'Keeffe distributed his collection among several American museums, and the Art Institute of Chicago received in 1949 an important group of photographs, including this one."""
facture = """
Eugene prints on platinum paper, with velvety blacks and soft transitions. He is above all known for a practice that shocked purists: he did not hesitate to engrave his negatives with a needle, to hatch or scratch them, in order to darken a background, soften a contour or remove an unwanted detail. Here, the intervention remains discreet: the light is concentrated on the dress and the face, while the background and edges sink into shadow. The horizontal format, rare for a portrait, leaves full room for the setting: the table at left, the skirt at centre, the print at right form a frieze, in the manner of a decorative painting."""
details = [
  "The bow in the girl's hair.",
  "The flowers embroidered on the front of the dress.",
  "The cloth with large foliage that covers the table.",
  "The small bouquet and the round objects set on the table.",
  "The picture of irises and a bird, hanging at right.",
]
themes = ["childhood", "portrait", "photo-secession", "japonisme", "platinum"]
anecdote = """
In 1913, Frank Eugene was appointed professor of artistic photography at the Academy of Graphic Arts in Leipzig, where he had been teaching since 1907: it is considered the first chair of its kind in the world."""
salle = 1
mur = "sud"
place = 4
largeur = 1.3

[[oeuvres]]
titre = "Blessed Art Thou Among Women"
artiste = "Gertrude Käsebier"
annee = "1899"
image = "benie-entre-toutes-les-femmes.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/103529"
technique = "Photogravure, published in 1901 in the portfolio American Pictorial Photography, Series II (copy 34/150); 23.7 × 14.1 cm"
collection = "Art Institute of Chicago"
note = "A mother dressed in white gently pushes her daughter towards the threshold: Gertrude Käsebier's most famous image."
description = """
The image, tall and narrow, is framed by the jambs of a doorway. In the opening, a little girl stands facing us, her arms at her sides. She wears a dark dress cinched by a buckled belt, white cuffs and collar, and a large bow under her chin; her hair is cut in a bob, and she looks straight at us, gravely. Behind her, a woman in a long, loose white gown leans towards her and places a hand on her shoulder; we see only her profile, half lost. In the background, on the wall, a framed picture hints at draped figures. The plank floor in the foreground leads to the threshold."""
evocation = """
The title takes up the words of the Ave Maria, “Blessed art thou among women”, and gives a domestic scene the dignity of a religious painting: the mother in white, bending, recalls a Virgin or an angel of the Annunciation. But the image also speaks of the moment when the child leaves her mother's protection to cross the threshold and enter the world. The contrast is striking between the mother, all in white and gentleness, and the little girl, dark, upright, already a little stiffened before what awaits her. Käsebier, herself a mother, made motherhood the great subject of her work, without sentimentality, with this mixture of tenderness and gravity."""
histoire = """
Käsebier made the image in 1899, shortly after opening her portrait studio in New York. Her models are identified as Agnes Lee and her daughter Peggy. Stieglitz soon noticed her work: in 1902, she was a founding member of the Photo-Secession, and the first issue of Camera Work, in January 1903, was largely devoted to her photographs. This photogravure comes from the portfolio American Pictorial Photography, published in New York in 1901, in the circle of the Camera Club, whose journal Camera Notes Stieglitz was then editing. Printed in one hundred and fifty copies, it circulated the works of the American Pictorialists."""
facture = """
Käsebier first studied painting, and it shows in the construction of the image: the door jambs form a frame within the frame, the picture hanging in the background answers the figures, and the great white of the mother's gown balances the black of the little dress. The light, coming from behind, haloes the mother and leaves the child in soft modelling. The focus, without hardness, melts the contours. Photogravure, an intaglio process printed in ink, made it possible to reproduce these nuances with great fidelity: for the Pictorialists, it was a fully fledged way of publishing a photograph, not a mere copy."""
details = [
  "The door jambs, framing the scene.",
  "The large bow under the girl's chin.",
  "The pale buckle of her belt.",
  "The mother's hand resting on the child's shoulder.",
  "The framed picture on the back wall, with its draped figures.",
]
themes = ["motherhood", "threshold", "childhood", "photo-secession", "sacred"]
anecdote = """
In 1899, another of Käsebier's images of mother and child, The Manger, sold for one hundred dollars: it was then the highest price ever paid for a photograph."""
salle = 2
mur = "nord"
place = 1
largeur = 0.9

[[oeuvres]]
titre = "The Hand of Man"
artiste = "Alfred Stieglitz"
annee = "1902"
image = "la-main-de-l-homme.jpg"
licence = "CC0"
source = "https://www.artic.edu/artworks/66749"
technique = "Photogravure, 24.2 × 31.8 cm"
collection = "Art Institute of Chicago (Alfred Stieglitz Collection)"
note = "A locomotive belches black smoke in the midst of a bundle of gleaming rails: the industrial city becomes a subject for art."
description = """
At the centre of the image, a locomotive advances towards us, spewing an enormous plume of black smoke that rises straight into a grey, cloudy sky. Around it, dozens of rails cross, part and curve; wet, they shine like silver threads in the low light. At left stand telegraph poles and their wires, at right large dark buildings, warehouses or tanks, and in the distance factory chimneys drowned in mist. No human being is visible. The tones range from the deep black of the smoke to the silvery greys of the rails, in a brown-green printer's-ink hue. A thin pale border frames the image."""
evocation = """
The title is at once ironic and grave: the “hand of man” is not a craftsman, it is the entire landscape shaped by industry, rails, wires and smoke. Yet Stieglitz denounces nothing. A note in Camera Work presented the image as an attempt to treat as an artist a subject so present in everyday life that we forget it can be beautiful. The solitary locomotive, the plume, the glimmer of the rails turn the rail yard into a romantic landscape, comparable to the Pictorialists' seascapes or forests. At the turn of the century, the image announces the great concern of modern photography: to find art in the city, the machine and the ordinary world."""
histoire = """
Stieglitz took the photograph in 1902, from the back of a moving train; the scene is placed in the rail yards of Long Island City, facing Manhattan. The same year, he founded the Photo-Secession in New York, a group of photographers who wanted their art to be recognised. In January 1903, the image appeared in the first issue of Camera Work, the luxurious journal he would direct until 1917. This photogravure belonged to Stieglitz himself; Georgia O'Keeffe, his widow, gave it in 1949 to the Art Institute of Chicago with much of his collection. It was shown in 2000 at the Grand Palais in Paris, in the exhibition “1900”."""
facture = """
To capture the scene from the train, Stieglitz uses a hand-held camera, lighter than the tripod-mounted view camera. The raking light, taken against the sun, makes the rails shine and sets the smoke off against the sky. The composition rests on the perspective of the tracks, which converge on the locomotive, and on the opposition between the black mass of the smoke and the fine network of rails. Photogravure, an intaglio engraving printed in ink, was for Stieglitz a fully fledged means of expression: he closely supervised the printing, and the plates of Camera Work were regarded as original works."""
details = [
  "The plume of black smoke, at centre, rising to the top of the image.",
  "The wet rails shining in the foreground.",
  "The telegraph poles and their wires, at left.",
  "The large dark buildings, at right.",
  "The factory chimneys lost in the mist, in the distance.",
]
themes = ["railway", "industry", "new york", "smoke", "modernity"]
anecdote = """
In Camera Work, the photogravures were not printed on the page: each was printed separately, on very thin paper, then pasted by hand into the journal, issue after issue."""
salle = 2
mur = "nord"
place = 4
largeur = 1.6

[[oeuvres]]
titre = "Sadie Pfeifer, Spinner at the Lancaster Cotton Mills"
artiste = "Lewis Hine"
annee = "1908"
image = "sadie-pfeifer.jpg"
licence = "Domaine public"
source = "https://www.loc.gov/pictures/item/2018674894/"
technique = "Period photographic print from the National Child Labor Committee collection, with cut corners"
collection = "Library of Congress, Washington (National Child Labor Committee collection)"
note = "A girl 1.22 metres tall before a spinning frame that seems never to end: photography as a weapon against child labour."
description = """
A long aisle leads deep into a factory hall. At left, a spinning frame stretches to the back of the image: rows of white bobbins, threads, metal rollers. At right, a brick wall is pierced by tall windows with raised blinds, through which a milky light enters. In the middle of the aisle, a little girl in a long dress and apron, her fair hair falling on her shoulders, reaches both hands towards the machine. She wears ankle boots, and one pocket of her apron is bulging. At the back, another child stands, very small. Bare bulbs hang from the ceiling. The corners of the print are cut at an angle."""
evocation = """
The image is simple and implacable: the machine, immense and repetitive, fills the whole left half; the child, tiny, is attached to it like one more part. Hine shows neither tears nor spectacular misery. He lets perspective do the work: the frame receding out of sight speaks of the length of the days, the monotony of the gesture and the absurdity of entrusting an adult's task to a child. The caption completes the demonstration, with Sadie's height, one hundred and twenty-two centimetres, and the length of her employment, six months already. Hine called this interpretive photography: an exact image, but composed to move and to convince."""
histoire = """
Hine took this photograph on 30 November 1908 at the Lancaster Cotton Mills in South Carolina. A sociologist by training, he was then working for the National Child Labor Committee, an association fighting for the prohibition of child labour. For about ten years, he travelled across the United States, from mills to mines and canneries, and brought back thousands of images published in pamphlets, journals and exhibitions. They weighed in the passing of the federal laws that finally regulated child labour. The committee's archives, negatives and captioned prints, entered the Library of Congress, which has digitised them."""
facture = """
Hine works with a tripod-mounted view camera and magnesium flash when light is lacking. Here, the light from the windows is enough: it glides along the aisle and cuts out the child's silhouette. The vanishing point, almost at the centre, hollows out the space; the girl is placed at a third of the image, where machine and light meet. Hine carefully noted the name, age, height and place of each child: his captions, copied onto cards, are part of the work. This period print, with cut corners, belongs to the committee's albums, in which the images were classified by industry."""
details = [
  "The rows of white bobbins of the spinning frame, at left.",
  "The girl's hands, reaching towards the threads.",
  "The bulging pocket of her apron.",
  "The other child, very small, at the end of the aisle.",
  "The bare bulbs hanging from the ceiling.",
]
themes = ["child labour", "factory", "childhood", "documentary", "social reform"]
anecdote = """
To enter factories, Hine passed himself off, as the case required, as an inspector, a salesman or a photographer come for the machines. He measured the children's height using the buttons of his jacket, whose height he knew."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "A Sewing Class, Hampton Institute"
artiste = "Frances Benjamin Johnston"
annee = "1899"
image = "cours-de-couture.jpg"
licence = "Domaine public"
source = "https://www.loc.gov/pictures/item/98502966/"
technique = "Period photographic print, mounted on card"
collection = "Library of Congress, Washington (Frances Benjamin Johnston collection)"
note = "Eight women learn to cut, fit and sew a dress: a classroom photographed like a tableau vivant."
description = """
In a large, bright room, eight women are busy. At left, one sits at a treadle sewing machine, near a window with lace curtains and two dressed mannequins. Another, kneeling, adjusts the hem of the long skirt of a young woman who stands motionless; a third stands before a large three-panel mirror. At the back, a student draws a pattern on the blackboard, covered with measurements, “Neck 12½, Bust 36, Waist 22”, and diagrams of dress pieces. At right, three women in aprons work around a table; one wears a white cap. A patterned rug covers the floor, and a bare bulb hangs from the ceiling."""
evocation = """
The image does not show exhausted workers, but students learning a trade, with order, seriousness and dignity. This is what the school wanted to show, and what Johnston conveys through a tightly ordered composition in which each gesture, measuring, drawing, pinning, sewing, has its place, as in a frieze. In 1899, the stakes were considerable: in an America where segregation was hardening, these images assert the ability and respectability of African Americans. Today, we also look at them with a critical eye, since the school mostly prepared its students for manual jobs. The photograph remains a rare testimony to their faces and presence."""
histoire = """
Hampton Institute, in Virginia, was founded in 1868 to educate former slaves and their children; it also admitted Native American students from 1878. In 1899, the school commissioned Frances Benjamin Johnston, a photographer based in Washington, to make a series of images of its classes and workshops. She brought back a vast set of views, part of which was shown at the Paris Exposition Universelle in 1900, in the section devoted to African Americans. Johnston's prints and negatives entered the Library of Congress with her archive. An album of these images, found later, was published in 1966 by the Museum of Modern Art in New York."""
facture = """
Johnston works with a large tripod-mounted camera and glass plates, which give perfect sharpness from edge to edge. She arranges her sitters with care: the poses are held, the gestures suspended, and no one looks at the lens. The light, coming from the windows at left, is soft and even, without harsh shadows, and allows even the figures written on the blackboard to be read. The viewpoint, slightly raised, takes in the whole room and gives each group its place. The print, with its nuanced greys and creamy whites, is mounted on a pale card whose edge is still visible."""
details = [
  "The treadle sewing machine, at left, and its openwork cast-iron stand.",
  "The kneeling student pinning the hem of a skirt.",
  "The measurements chalked on the blackboard: “Neck 12½, Bust 36, Waist 22”.",
  "The large three-panel mirror, at centre left.",
  "The white cap of the woman working at the right of the table.",
]
themes = ["school", "sewing", "african americans", "documentary", "apprenticeship"]
anecdote = """
Johnston had studied painting at the Académie Julian in Paris. It is said that her first camera was given to her by George Eastman, the founder of Kodak, a friend of her family."""
salle = 3
mur = "nord"
place = 2
largeur = 1.6

[[oeuvres]]
titre = "Equisetum hyemale, Rough Horsetail (Plate 1 of Art Forms in Nature)"
artiste = "Karl Blossfeldt"
annee = "1928"
image = "equisetum-hyemale.jpg"
licence = "Domaine public"
source = "https://www.rijksmuseum.nl/nl/collectie/object/RP-F-2008-51-2170-1--ee765997f7a974327839ab7914b9aa30"
technique = "Rotary photogravure, plate 1 of the book Urformen der Kunst (Berlin, Ernst Wasmuth, 1928); sheet 31.2 × 24.2 cm"
collection = "Rijksmuseum, Amsterdam"
note = "A young horsetail shoot, magnified twenty-five times, standing like a fluted column or a tower."
description = """
Against a plain grey ground, a vertical form fills the whole height of the image. It looks like a column or a tower: a shaft striated with fine parallel flutes, divided into storeys by serrated rings, tapering towards the top into a rounded dome. At the summit, a small frayed point stands out against the grey sky. Each storey overlaps slightly the one below, like the drums of a column or the roofs of a pagoda. The light comes from the side and models the relief: the flutes alternate dark hollows and pale ridges. It is in fact a young shoot of rough horsetail, a plant of damp places, photographed from very close and enlarged twenty-five times."""
evocation = """
Blossfeldt was a teacher of modelling from living plants at an applied arts school in Berlin. For him, nature is the first of architects: it invented, before man, the column, the flute, the capital, the volute. The title of the book, Art Forms in Nature, expresses this conviction. Placed at the head of the book, the horsetail serves as a demonstration: seen at this scale, an ordinary grass becomes a monument. The image also fascinates by its ambiguity, between scientific precision and strangeness. In 1928, the philosopher Walter Benjamin hailed the book, which according to him reveals a world of forms that the naked eye had never suspected."""
histoire = """
Blossfeldt had been photographing plants since the 1890s, at first for his classes, to show his students the structure of stems, buds and leaves. For more than thirty years, he accumulated thousands of negatives, without thinking of exhibiting them. The Berlin gallery owner Karl Nierendorf discovered them, exhibited them in 1926, then published in 1928, with the publisher Ernst Wasmuth, Urformen der Kunst, a book of one hundred and twenty plates for which he wrote the preface. Success was immediate, and the book was quickly translated. This plate, the first in the book, comes from an edition in loose sheets bought by the Rijksmuseum in Amsterdam with the help of several funds."""
facture = """
Blossfeldt built his own cameras himself, capable of magnifying plants up to thirty times. He prepares each specimen with care, cuts away leaves that get in the way, fixes it on a support and places it before a neutral ground, grey or white. The light, lateral and even, casts no shadow and brings out the relief. The frontal, symmetrical framing isolates the form like a museum object. These principles, total sharpness, frontality, absence of setting, align with those of the German New Objectivity of the 1920s. Rotary photogravure, a high-quality intaglio printing process, renders the fineness of the stem's grain."""
details = [
  "The fine parallel flutes that striate the stem.",
  "The serrated rings that separate the storeys.",
  "The frayed point at the summit.",
  "The lateral light that makes the ridges stand out.",
  "The plain grey ground, without any setting.",
]
themes = ["plant", "botany", "architecture", "new objectivity", "enlargement"]
anecdote = """
Blossfeldt never claimed the title of art photographer: his images were for him teaching tools. It was at over sixty, four years before his death, that he became famous, with this first book."""
salle = 4
mur = "est"
place = 2
largeur = 0.9

[[oeuvres]]
titre = "Water Lily"
artiste = "Eugène Atget"
annee = "1922–1923"
image = "nymphea.jpg"
licence = "CC0"
source = "https://clevelandart.org/art/2002.69"
technique = "Albumen print, gold-toned, 22.2 × 17.6 cm"
collection = "Cleveland Museum of Art"
note = "A pond covered with water lilies, between shadow and reflections: Atget, at the end of his life, at the height of his art."
description = """
A pond occupies almost the whole image. In the foreground, large round water-lily leaves float on the dark water, split to the centre, some curled up at the edges; between them open pale flowers with pointed petals. Further off, other islands of leaves and flowers make pale patches on the water, ever smaller. At right, the water reflects the sky and becomes almost white. At the back, a grassy bank, clumps of irises and masses of dark trees close the horizon, beneath a corner of pale sky. Among the leaves, a small white botanical-garden label stands on a stem. The whole print has a purplish-brown tint."""
evocation = """
Monet was painting his Water Lilies at Giverny at the same time; Atget, for his part, photographs a park pond, without seeking to imitate painting. His view nonetheless has something meditative about it: the eye glides from the large leaves of the foreground to the background, in a calm depth, punctuated by white flowers. The Cleveland Museum of Art stresses how the morning light, with its shadows and reflections, allows Atget to isolate flat, almost abstract forms while keeping a deep space. The tiny botanical label reminds us that the photographer always documents the real, even when the image tends towards reverie."""
histoire = """
After thirty years spent photographing the streets, shops and old residences of Paris, Atget devoted his last years to parks: Versailles, Saint-Cloud, Sceaux. This pond was probably photographed in the park of Bagatelle, on the edge of the Bois de Boulogne, famous for its plant collections. Atget sold his prints to artists, libraries and museums in Paris. Little known in his lifetime, he was revealed after his death, in 1927, by the American Berenice Abbott, who saved a large part of his archive. This print passed through a New York dealer before being bought by the Cleveland Museum of Art in 2002."""
facture = """
Atget works with a heavy wooden camera on a tripod and 18 × 24 cm glass plates. He makes his prints by contact, on albumen paper, a paper based on egg white already out of fashion in the 1920s, then tones them with gold, which gives them these purple and brown tones. The focus, sharp on the floating leaves, details their veins and tears. The rather high viewpoint tilts the plane of the water towards us and makes the pond an almost vertical surface, like a carpet. The small black notches on the edges probably come from the clips that held the plate in its holder."""
details = [
  "The large split leaves of the foreground, with curled edges.",
  "The water-lily flowers, with pointed petals, at centre.",
  "The small white label standing among the leaves, at left.",
  "The reflection of the sky that whitens the water, at right.",
  "The masses of dark trees that close the background.",
]
themes = ["garden", "water", "water lilies", "reflection", "paris"]
anecdote = """
On the door of his studio, rue Campagne-Première, Atget had written “Documents for artists”: he saw himself as a supplier of images for painters and decorators, rather than as an artist."""
salle = 4
mur = "nord"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Kitty Stieglitz"
artiste = "Alfred Stieglitz"
annee = "c. 1907"
image = "kitty-stieglitz.jpg"
cadre = "noir"
licence = "CC0"
source = "https://www.artic.edu/artworks/77269"
technique = "Autochrome (positive colour glass plate), 17.9 × 12.7 cm (view)"
collection = "Art Institute of Chicago (Alfred Stieglitz Collection)"
note = "The photographer's daughter, red apples in her lap: colour enters photography, thanks to the Lumière brothers."
description = """
A girl of about ten sits in a wooden armchair with turned arms. Her long brown hair falls over her shoulders, held by a large dark bow at the top of her head. She wears a finely striped dress, trimmed with braided galloon, with a high collar and white sleeves. In her lap lie a dozen red apples, which she holds with her right hand; in the other arm she holds a branch of hydrangea with white flowers and green leaves. A ring shines on her finger. She looks at us, serious, almost sulky. The indistinct background passes from bluish grey to mauve. A few pale specks, dust, dot the plate."""
evocation = """
After nearly seventy years of black-and-white photography, here suddenly is a photographic portrait in colour: the red of the apples, the green of the leaves, the child's complexion. The effect must have been striking for Stieglitz, who here photographs his daughter Kitty, born in 1898. The apples and flowers, arranged as in a still life, show that he seeks colours for their own sake, as a painter would. Yet the soft light and the grain of the plate give the image the blurred tenderness of a pastel. One also senses the intimacy of a family album: the child's slightly constrained pose, the armchair, the everyday dress."""
histoire = """
The brothers Auguste and Louis Lumière, in Lyon, patented the autochrome in 1903 and put it on sale in 1907. That summer, Stieglitz, who was in Europe, discovered the process in Paris, where Edward Steichen was also trying it, then experimented with it in Bavaria with his friends Frank Eugene and Heinrich Kühn. Back in New York, he hailed the process with enthusiasm in Camera Work and showed autochromes in his Fifth Avenue gallery. This plate belonged to his personal collection, divided after his death among several American museums: the Art Institute of Chicago received it in 1949 with a group of Stieglitz autochromes."""
facture = """
The autochrome is a glass plate covered with millions of potato-starch grains dyed orange, green and violet, which serve as coloured filters. The gaps are filled with carbon black, then a sensitive emulsion is spread on top. After exposure, made through the glass, a reversal development gives a unique positive image, which is viewed by transmitted light, before a lamp or in a viewer. Exposures are long, several seconds at least, hence the sitter's stillness. Seen up close, the autochrome resolves into a dust of coloured dots, which gives the colours their characteristic softness."""
details = [
  "The large dark bow in the hair.",
  "The red apples heaped on the striped dress.",
  "The branch of white hydrangea, at left.",
  "The ring on the finger of the right hand.",
  "The turned arms of the wooden armchair.",
]
themes = ["colour", "autochrome", "childhood", "family", "still life"]
anecdote = """
An autochrome cannot be printed on paper: each plate is unique. To show these images to an audience, Stieglitz and his friends had to display them lit from behind, or have them reproduced in colour by printers, at the cost of great difficulties."""
salle = 5
mur = "nord"
place = 2
largeur = 0.9

[[artistes]]
nom = "Robert Demachy"
vie = "Saint-Germain-en-Laye, 1859 – Hennequeville (Trouville), 1936"
biographie = """
The son of a banker, Robert Demachy had a fortune that allowed him to devote himself to his passions: music, automobiles, literature, art and, from the 1870s, photography. In 1894, he took part in the founding of the Photo-Club de Paris, which organised an annual salon of artistic photography. A member of the Linked Ring in London, then of the Photo-Secession in New York, he exhibited throughout Europe and in the United States. He was also a tireless theorist: he published five books and more than a thousand articles to defend photography as an art. In 1914, he abruptly stopped photographing and devoted himself to drawing until his death."""
style = """
Demachy is the master of the so-called pigment processes, which allow hand intervention on the print: gum bichromate, then the oil print. He erases, lightens and softens with a brush, to the point that his images resemble red-chalk drawings, charcoals or aquatints. His subjects, dancers, nudes, portraits, landscapes of Brittany and Normandy, are treated in a spirit close to the painting of his time."""

[[artistes]]
nom = "Clarence H. White"
vie = "Carlisle, Ohio, 1871 – Mexico City, 1925"
biographie = """
Clarence Hudson White grew up in Ohio, in Newark, where he was a bookkeeper. He began photographing as an amateur in 1893 and, with no training at all, established himself within a few years: noticed by Stieglitz in Philadelphia in 1898, he exhibited at the Linked Ring salon in London as early as 1899, then in all the great international exhibitions. A founding member of the Photo-Secession in 1902, he moved to New York in 1906 and became a sought-after teacher, at Columbia University and in Brooklyn. In 1914, he founded his own photography school, which trained a generation of photographers. He died in 1925 in Mexico, on a trip with his students."""
style = """
White photographs above all his family and friends, in peaceful interiors, near a window, or outdoors at dawn and dusk. His images, printed in platinum or palladium, have a great softness of tone and are built with rigour, often against the light. They express a poetry of daily life, calm and meditative, which marks all of American Pictorialism."""

[[artistes]]
nom = "Frank Eugene"
vie = "New York, 1865 – Munich, 1936"
biographie = """
Frank Eugene Smith, the son of German immigrants, was born in New York and left to study painting at the Academy of Fine Arts in Munich in the 1880s. Back in the United States, he pursued painting and photography side by side, and his portraits attracted Stieglitz's attention. A founding member of the Photo-Secession in 1902, he settled in Germany around 1906. He taught photography in Leipzig from 1907 and was appointed professor there in 1913. He spent his last years in Munich, where he died in 1936."""
style = """
Eugene is the most painterly of the Secession photographers. He does not merely blur his images: he engraves and hatches his negatives with a needle, to obtain backgrounds as vibrant as engravings. His portraits and allegorical scenes, printed in platinum, mingle costumes, fabrics and old-fashioned settings in the spirit of Art Nouveau and Symbolism."""

[[artistes]]
nom = "Gertrude Käsebier"
vie = "Des Moines, Iowa, 1852 – New York, 1934"
biographie = """
Born Gertrude Stanton, she spent part of her childhood in Colorado, married a businessman, Eduard Käsebier, in 1874, and raised three children in Brooklyn. At nearly forty, she entered the Pratt Institute to study painting, then turned to photography. Around 1897, she opened a portrait studio in New York that enjoyed great success. Stieglitz supported her: she was a founding member of the Photo-Secession in 1902, and the first issue of Camera Work was largely devoted to her. She distanced herself from Stieglitz around 1912 and in 1916 founded, with Clarence White, the association of the Pictorial Photographers of America."""
style = """
Käsebier rejects the painted backdrops and props of the studios of her time: she places her sitters in natural, simple light. Her portraits of artists, such as Rodin, and her images of mothers and children, of great tenderness, are composed with a sense of painting and printed in platinum or gum, in soft tones."""

[[artistes]]
nom = "Alfred Stieglitz"
vie = "Hoboken, New Jersey, 1864 – New York, 1946"
biographie = """
The son of German immigrants, Alfred Stieglitz studied engineering in Berlin, where he discovered photography in the 1880s. Returning to New York in 1890, he became the great champion of photography as an art: he edited the journal Camera Notes, founded the Photo-Secession in 1902, then published Camera Work from 1903 to 1917. In 1905, he opened with Edward Steichen a gallery at 291 Fifth Avenue, where he also showed the first Matisse and Picasso exhibited in America. In 1924 he married the painter Georgia O'Keeffe, of whom he made hundreds of portraits. He died in New York in 1946."""
style = """
At first a Pictorialist, Stieglitz sought in the streets of New York, in snow, rain and machines, subjects for a modern photography. He moved towards direct photography, sharp and without manipulation, as in The Steerage in 1907, then towards the series of clouds he called “Equivalents”. He was also one of the first to be enthusiastic about the autochrome."""

[[artistes]]
nom = "Lewis Hine"
vie = "Oshkosh, Wisconsin, 1874 – Dobbs Ferry, New York, 1940"
biographie = """
After a youth as a labourer, Lewis Wickes Hine studied sociology and became a teacher at the Ethical Culture School in New York, where he took up photography for his classes. Around 1905, he began photographing the immigrants landing at Ellis Island. From 1908 to about 1918, he worked for the National Child Labor Committee and travelled the whole country to show children at work. After the First World War, he photographed for the Red Cross in Europe, then made his “work portraits”, which culminated with the construction of the Empire State Building in 1930–1931. He died in poverty in 1940."""
style = """
Hine called himself an interpretive photographer: his images are exact, but composed to move. He looks at workers, children or adults, straight on, at their level, with respect, and accompanies each photograph with a precise caption. His work founded American documentary and social photography."""

[[artistes]]
nom = "Frances Benjamin Johnston"
vie = "Grafton, West Virginia, 1864 – New Orleans, 1952"
biographie = """
Frances Benjamin Johnston studied drawing and painting at the Académie Julian in Paris, from 1883 to 1885, then became an illustrator and journalist in Washington. She turned to photography and opened her studio in the early 1890s. She photographed miners, women workers, schools, and successive presidents at the White House. In 1900, she organised in Paris an exhibition devoted to American women photographers. Later, she specialised in architecture and devoted the 1930s to a vast photographic survey of the old houses of the American South. She died in 1952 in New Orleans."""
style = """
Johnston is one of the first professional women photographers in the United States and one of the first reporters. Her images, sharp and meticulously composed, arrange figures as in tableaux vivants. They combine concern for the document with great formal elegance."""

[[artistes]]
nom = "Karl Blossfeldt"
vie = "Schielo, Harz, 1865 – Berlin, 1932"
biographie = """
Born in a village in the Harz, Karl Blossfeldt learned the trade of modeller in an art foundry, then studied at the school of decorative arts in Berlin. From 1890 to 1896, he worked in Italy, Greece and North Africa with Professor Moritz Meurer, who had plant models made for the teaching of ornament. From 1898, he himself taught modelling from living plants in Berlin, until 1930. His photographs, made for his classes, were revealed in 1926 by the gallery owner Karl Nierendorf, and the book Urformen der Kunst made him famous in 1928. He died in Berlin in December 1932."""
style = """
Blossfeldt photographs stems, buds, leaves and seeds, isolated against a neutral ground and greatly enlarged, with perfect sharpness. His images reveal in plants forms of architecture and ornament: columns, crosiers, rosettes. Their rigour brings them close to the German New Objectivity, and the Surrealists saw in them strange and fascinating forms."""

[[artistes]]
nom = "Eugène Atget"
vie = "Libourne, 1857 – Paris, 1927"
biographie = """
Orphaned young, Eugène Atget was a sailor, then an actor in provincial troupes, before trying his hand at painting. Around 1890, he settled in Paris as a photographer and sold artists “documents”: streets, façades, shops, small trades, architectural details. For nearly forty years, he built up an immense inventory of old Paris, which he sold to the libraries and museums of the city, then photographed the parks of Versailles, Saint-Cloud and Sceaux. Little known in his lifetime, he was discovered at the end of his life by Man Ray and Berenice Abbott, who saved his archive after his death in 1927."""
style = """
Atget works with heavy, outmoded equipment, a wooden camera and glass plates, and prints on albumen paper. His frontal images, often taken early in the morning in deserted streets, seem simple documents; but their silence, their reflections and their sense of place have made them one of the models of modern photography."""
