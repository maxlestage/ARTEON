[exposition]
ordre = 116
nom_court = "Photography as Art"
mouvement = "Pictorialism, the Photo-Secession and documentary photography"
cadre = "blanc"
couleur = "#4a4640"
titre = "Photography Becomes an Art, 1880–1930"
artiste = "Demachy, White, Eugene, Käsebier, Stieglitz, Hine, Johnston, Blossfeldt, Atget…"
dates = "1899–1928"
accroche = "Virtual exhibition · Maison européenne de la photographie, Paris"
introduction = """
Around 1890, anyone can take a photograph: the Kodak camera and ready-made plates have put the process in everyone's hands. To set themselves apart, passionate amateurs in Paris, London, Vienna and New York want to make photography an art in its own right, the equal of painting and engraving: this is Pictorialism. In New York, Alfred Stieglitz rallies this fight around the Photo-Secession and its journal Camera Work. At the same time, others turn the camera into an instrument of truth, to denounce child labour or to reveal the hidden forms of plants, while the Lumière brothers' autochrome at last brings colour. The visit follows this path in ten images, from 1899 to 1928. The building is inspired by the Maison européenne de la photographie, housed in a private mansion in the Marais district of Paris."""
vitrine = "la-main-de-l-homme.jpg"

[musee]
nom = "Maison européenne de la photographie (MEP)"
ville = "Paris, France"
architecte = "Yves Lion (restoration and contemporary wing)"
construction = "Early eighteenth century (the Hôtel Hénault de Cantobre); museum opened in 1996"
presentation = """
The Maison européenne de la photographie occupies, on the rue de Fourcy in the Marais district, the Hôtel Hénault de Cantobre, a private mansion of the early eighteenth century. The City of Paris had it restored and extended to house a venue devoted to photography: the architect Yves Lion preserved the old residence and added a contemporary wing, sober and luminous. The museum opened its doors in 1996, under the direction of Jean-Luc Monterosso, who had already launched the Mois de la Photo in Paris. It now holds a collection of more than twenty thousand prints, mostly contemporary photography since the 1950s, a specialised library and an auditorium. Each season, several exhibitions present both the great names of the century and young photographers."""
ici = """
ARTEON's building borrows from the MEP its double face, an old residence extended by a modern wing. Visitors enter from the south into “The Salons of the Mansion”, with ivory walls, where the Pictorialism of Demachy, White and Eugene imitates engraving and painting. To the north opens “The Secession Gallery”, grey and seven metres high, where Käsebier and Stieglitz represent New York. To the west, “The World at Work” brings together Hine and Frances Benjamin Johnston; to the east, “Nature and Science” pairs Blossfeldt and Atget. Finally, to the north, in the modern wing, a small cabinet with dark walls, “Colour”, houses an autochrome by Stieglitz."""

