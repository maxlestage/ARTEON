[[oeuvres]]
titre = "The Flea (Micrographia, Scheme XXXIV)"
artiste = "Robert Hooke"
annee = "1665"
image = "puce-micrographia.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:HookeFlea01.jpg"
technique = "Copper engraving, large folding plate from the book Micrographia"
collection = "National Library of Wales, Aberystwyth"
note = "A flea seen under the microscope and enlarged on an immense folding plate: for the public of 1665, the revelation of an invisible world."
description = """
A flea, seen in profile, fills the whole sheet. Its oval body is made of rings that \
overlap like the plates of a suit of armour, bristling with stiff spines set in rows. \
The head, small, bears a round eye and pointed mouthparts; the jointed legs are covered \
with hairs and end in curved claws. The hind legs, very long and folded beneath the \
body, hint at the power of its jump. Capital letters, from A to L, are placed on the \
different parts of the body and refer to the description in the text. There is no cast \
shadow and no setting: the insect is alone, as if suspended on the white page."""
evocation = """
For readers in 1665, the flea was the vilest of parasites, crushed without a glance. \
Hooke makes it an object of admiration: in his text he marvels at its strength and at \
the beauty of its armour, and the plate gives it the dignity of a portrait. The image \
conveys the shock of the microscope: under the lens, the minute becomes monumental, and \
nature reveals everywhere an unsuspected order and fineness. For the scholars of the \
Royal Society, who wanted to found knowledge on experiment and observation, such images \
were proofs as much as illustrations: they let everyone see what only a few had been \
able to observe."""
histoire = """
Robert Hooke was the Curator of Experiments of the Royal Society of London, founded in \
1660, which asked him to present, session after session, observations made under the \
microscope. He gathered them in Micrographia, published in January 1665 with the \
Society's approval and illustrated with 38 engraved plates: the eye of a fly, the point \
of a needle, snowflakes, moulds, a slice of cork. The book was a great success with the \
educated public. In his diary, Samuel Pepys relates that he stayed up until two in the \
morning to read it, and considered it the most ingenious book he had ever read. This \
plate comes from the copy in the National Library of Wales."""
facture = """
Hooke drew his observations himself. The microscope of the time shows only a small area \
clearly at a time, and the living insect moves: he therefore reconstructed the whole \
animal from numerous successive views, under different lighting. The engraving \
translates these drawings into a very dense network of fine, parallel lines that follow \
the curve of each segment, and give the plates a glossy, almost metallic look. The \
large format of the plate, which unfolds out of the book, is part of the effect: the \
reader physically experiences the enlargement."""
details = [
  "The flea's round eye, on the side of the small head.",
  "The curved claws at the ends of the legs, which allow it to cling.",
  "The stiff spines set in rows on each ring of the body.",
  "The letters from A to L, which refer to Hooke's text.",
]
themes = ["microscope", "insects", "invisible", "engraving", "royal society"]
anecdote = """
It is in Micrographia that Hooke, observing a thin slice of cork, describes its small \
cavities under the name of cells, little chambers: the word has stuck, and biology \
made it the cell."""
