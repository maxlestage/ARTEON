[[oeuvres]]
titre = "Astrolabe of the Rasulid Prince ʿUmar"
artiste = "Yémen, dynastie rasoulide"
annee = "1291 (AH 690)"
image = "astrolabe-rasoulide.jpg"
cadre = "vitrine"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Astrolabe_of_‘Umar_ibn_Yusuf_ibn_‘Umar_ibn_‘Ali_ibn_Rasul_al-Muzaffari_MET_DP170386.jpg"
technique = "Cast and hammered brass, pierced, chased and inlaid with silver; diameter 15.6 cm"
collection = "Metropolitan Museum of Art, New York"
note = "An instrument for reading the sky, made in Yemen by a learned prince, a future sultan. Actual diameter: 15.6 cm."
description = """
A thick disc of gilded brass stands upright, surmounted by a small pediment pierced \
with scrollwork, the throne, from which hangs a suspension ring. The wide graduated \
rim is covered with numerals and inscriptions in Arabic. At the centre, a plate \
engraved with a network of circles and lines, the plate, or tympan, is overlaid with a \
lace of cut metal, the rete, whose flame- and hook-shaped points designate stars. A \
central axis holds all the pieces together, and a rule pivots around it. The metal \
bears traces of wear and a few chips: the object was used. Its back, invisible here, \
carries an alidade, the sighting rule."""
evocation = """
The astrolabe is a map of the sky that one holds in the hand. By sighting the sun or a \
star, then turning the rete on the plate, one could read the time, by day or by night, \
find the position of the stars, measure the height of a building and, in the Islamic \
world, determine the hours of prayer. Conceived in the Greek world and perfected by \
Arabic-speaking scholars, the instrument then passed to Europe through Spain. This one \
tells of the place of science at the Rasulid court: a prince himself handles the \
calculation and the tool, at once craftsman and astronomer. Its beauty is not an added \
ornament: it arises from precision."""
histoire = """
The inscriptions indicate that the astrolabe was made by ʿUmar ibn Yusuf, son of the \
Rasulid sultan al-Muzaffar Yusuf, and dated to the year 690 of the Hijra, that is, \
1291. The prince, a lover of the sciences, became in 1295 the third sultan of the \
dynasty, under the name al-Ashraf ʿUmar, but died the following year. He is the author \
of works on astronomy and of a treatise on the construction of astrolabes. It is not \
known when the instrument left Yemen. It belonged to the New Yorker Edward C. Moore, \
silversmith and designer for the house of Tiffany, whose collection was bequeathed to \
the Metropolitan Museum of Art in 1891; the museum now publishes its photographs \
freely."""
facture = """
The body of the astrolabe, the mater, is cast in brass and then hammered; its rim forms \
a recess in which the plates fit, four plates engraved for different latitudes. The \
rete, cut with a saw and a file, must be openwork enough to let the plate show through \
and solid enough not to warp: its scrolls are both ornament and structure. Graduations \
and inscriptions are engraved with a burin, with silver inlays. The layout of the \
circles, calculated by geometry and transferred with a compass, determines the \
accuracy of the instrument."""
details = [
  "The openwork throne, at the top, and its suspension ring.",
  "The points of the rete, each of which marks a star.",
  "The graduations of the rim, all around the disc.",
  "The network of circles on the plate, visible beneath the rete.",
]
themes = ["astronomy", "instrument", "islam", "yemen", "measurement"]
anecdote = """
The word astrolabe comes from Greek and means roughly "star-taker". Around 1391, the \
English poet Geoffrey Chaucer wrote for a child, his son Lewis, a Treatise on the \
Astrolabe, one of the first scientific texts in the English language."""
