[[artistes]]
nom = "Albrecht Dürer"
vie = "Nuremberg, 21 May 1471 – Nuremberg, 6 April 1528"
biographie = """
The son of a goldsmith from Hungary, Albrecht Dürer first learned his father's trade, \
then in 1486 entered the workshop of the painter Michael Wolgemut in Nuremberg, where \
books were also illustrated. After a journeyman's trip towards the Rhine, he married \
Agnes Frey in 1494 and left the same year for Venice, where he discovered Italian \
painting. On his return, he opened his own workshop and in 1498 published the \
Apocalypse, a series of large woodcuts that made him famous throughout Europe. He \
painted self-portraits of a new assurance and studies of nature of unprecedented \
precision, such as the Hare of 1502 or the Great Piece of Turf of 1503. A second stay \
in Venice, from 1505 to 1507, confirmed his reputation, and Emperor Maximilian I \
granted him a pension. His copper engravings of 1513–1514, Knight, Death and the Devil, \
Saint Jerome in His Study and Melencolia I, are among the most famous in history. After \
a journey to the Netherlands in 1520–1521, he rallied to Luther's ideas and devoted his \
last years to treatises on geometry and human proportions."""
style = """
Dürer combines the rigour of German Gothic drawing with the lessons of the Italian \
Renaissance: perspective, proportions, modelling. A printmaker above all, he brought \
woodcut and copper engraving to a degree of fineness never before reached, making the \
print an art in its own right, distributed across Europe. His studies of animals and \
plants, in watercolour and gouache, observe nature with a naturalist's exactness. His \
AD monogram, present on almost all his works, was known throughout the continent and \
widely copied."""

[[artistes]]
nom = "John James Audubon"
vie = "Les Cayes (Saint-Domingue), 26 April 1785 – New York, 27 January 1851"
biographie = """
The natural son of a French naval officer and planter, Jean Audubon, and of a young \
chambermaid, Jeanne Rabin, who died a few months after his birth, he was raised at \
Couëron, near Nantes. In 1803, to spare him conscription, his father sent him to \
America, to a family property in Pennsylvania, Mill Grove, where he developed a passion \
for birds. Married in 1808 to Lucy Bakewell, he tried his luck as a merchant in \
Kentucky, where he owned slaves. Ruined in 1819, he lived on portraits and drawing \
lessons, then set himself a goal: to paint all the birds of North America. He roamed \
forests, marshes and coasts, from Louisiana to Labrador. Unable to find a publisher in \
the United States, he left in 1826 for England and Scotland, where his backwoodsman's \
bearing caused a sensation. There he published The Birds of America, from 1827 to 1838, \
accompanied by an Ornithological Biography written with the Scotsman William \
MacGillivray. Back in America, he undertook a work on the mammals of North America, \
completed with the Reverend John Bachman and his own sons. He died in New York in \
1851."""
style = """
Audubon broke with stiff birds perched in profile on a branch: he shows them life-size \
and in action, hunting, feeding, fighting, in their habitat. His dramatic and often \
decorative compositions owe much to his talent as a draughtsman and to his experience \
as a hunter and field observer. His plates shaped the image of American nature; the \
bird protection societies founded in the United States from 1886 onwards took his \
name."""

[[artistes]]
nom = "Ernst Haeckel"
vie = "Potsdam, 16 February 1834 – Jena, 9 August 1919"
biographie = """
The son of a Prussian jurist, Ernst Haeckel studied medicine in Würzburg, Berlin and \
Vienna, and in Berlin followed the teaching of the zoologist Johannes Müller, who \
introduced him to the study of marine animals. After a stay in Messina in 1859–1860, \
he published a monograph on the radiolarians, microscopic organisms with silica \
skeletons, illustrated with his own drawings. In 1862, he became a professor at the \
University of Jena, where he would teach until 1909. Reading Darwin overwhelmed him: \
he became the most ardent propagator of the theory of evolution in Germany and drew \
the first genealogical trees of living things. He coined words destined for a great \
future, such as ecology, in 1866. In 1864, the death of his young wife, Anna Sethe, \
plunged him into despair. A tireless traveller, from the Canary Islands to Ceylon, he \
described thousands of new species. His work also has dark sides: some of his drawings \
of embryos, too schematic, were accused of forcing resemblances, and his theories \
ranked the peoples of the world in a racial hierarchy now rejected. He died in Jena in \
1919."""
style = """
Haeckel drew as he thought: in search of order, symmetry and the kinship of forms. His \
plates, very precise but arranged like ornaments, bring out the rays, spirals and \
repeated structures of living things. He wanted to prove that nature is itself an \
artist. His Art Forms in Nature supplied the architects, glassmakers and decorators of \
Art Nouveau with an immense repertoire of motifs, and continue to inspire graphic \
artists and designers."""

[[artistes]]
nom = "Maria Sibylla Merian"
vie = "Frankfurt am Main, 2 April 1647 – Amsterdam, 13 January 1717"
biographie = """
The daughter of the publisher and engraver Matthäus Merian the Elder, who died when she \
was three, Maria Sibylla grew up in Frankfurt in the workshop of her stepfather, the \
flower painter Jacob Marrel, who taught her drawing and painting. As a teenager, she \
raised silkworms and caterpillars to observe their transformation, at a time when many \
still believed that insects were born from mud. Married in 1665 to the painter Johann \
Andreas Graff, she settled in Nuremberg, published a flower book and then, in 1679, a \
first book on caterpillars and their food plants. In 1685, she joined, with her mother \
and her two daughters, a religious community, the Labadists, in Friesland, and \
separated from her husband. Settled in Amsterdam in 1691, she sold paintings and \
specimens there and frequented collectors. In 1699, she left for Suriname with her \
younger daughter, Dorothea Maria, and returned two years later to prepare her great \
book, published in 1705. Struck by a stroke in 1715, she died in Amsterdam in 1717. \
Linnaeus cited her plates to describe numerous species."""
style = """
Merian combines the precision of the naturalist with the grace of German and Dutch \
flower painting. Her great innovation is to bring together in a single image the cycle \
of an insect, egg, caterpillar, chrysalis and adult, with the plant on which it feeds: \
an image of living things in relation, and not a catalogue of isolated species. Her \
compositions, elegant and lively, influenced naturalist illustration for more than a \
century."""

[[artistes]]
nom = "Pierre-Joseph Redouté"
vie = "Saint-Hubert (present-day Belgium), 10 July 1759 – Paris, 19 June 1840"
biographie = """
Born in the Ardennes, into a family of painters, Pierre-Joseph Redouté left home very \
young to work as an itinerant painter. In 1782, he joined his elder brother \
Antoine-Ferdinand, a theatre decorator, in Paris. He met the botanist Charles-Louis \
L'Héritier de Brutelle, who introduced him to botany and entrusted him with the \
illustration of his books, as well as the painter Gerard van Spaendonck, master of \
flower painting on vellum. He received the title of draughtsman to the cabinet of Queen \
Marie-Antoinette and, after the Revolution, worked for the Muséum d'histoire \
naturelle. Empress Joséphine made him her flower painter: he published Les Liliacées, \
from 1802 to 1816, then Les Roses, from 1817 to 1824. A professor of drawing at the \
Muséum, he counted princesses and women of good society among his pupils. Despite his \
fame, his expenses and the difficulties of the illustrated book market left him in \
straitened circumstances at the end of his life. He died in Paris in 1840."""
style = """
Redouté combines the exactness demanded by botanists, who must be able to recognise \
each species, with an elegance of composition and a delicacy of colour that make his \
plates works of art. He brought to perfection stipple engraving printed in colour, \
which renders the transparency of watercolour. Nicknamed the Raphael of flowers, he \
remains the benchmark of botanical illustration, and his roses and lilies have never \
ceased to be reproduced."""

[[artistes]]
nom = "André Vésale"
vie = "Brussels, 31 December 1514 – island of Zakynthos (Greece), 15 October 1564"
biographie = """
Born in Brussels into a family of apothecaries and physicians in the service of the \
emperors, Andries van Wesel, known as Vesalius, studied at Leuven and then in Paris, \
where he followed the lessons of the anatomists Jacques Dubois and Johann Winter of \
Andernach. There, anatomy was taught as read in the books of Galen, while a barber took \
care of the dissection. For want of bodies, the young Vesalius went to fetch bones at \
the gibbet of Montfaucon. Granted his doctorate at Padua in 1537, he immediately became \
professor of surgery and anatomy there, and dissected himself in front of his students. \
He gradually found that many of Galen's descriptions applied to animals, not to man. In \
1543, at twenty-eight, he published the Fabrica in Basel, accompanied by an abridgement, \
the Epitome. The same year, he became physician to the Emperor Charles V, then to his \
son Philip II of Spain. In 1564, he undertook a pilgrimage to Jerusalem; on the way \
back, he died on the island of Zakynthos, in Greece, before reaching the age of fifty."""
style = """
Vesalius was not an artist, but he conceived his books as works of art: he directed \
their illustration, chose the draughtsmen, and supervised the engraving and layout. His \
principle is simple and revolutionary: see before believing, and show what one has \
seen. His écorchés and skeletons posed in landscapes, elegant and melancholy, were \
copied throughout Europe and fixed for a long time the image of the body in medical \
books."""

[[artistes]]
nom = "Léonard de Vinci"
vie = "Vinci (Tuscany), 15 April 1452 – Amboise, 2 May 1519"
biographie = """
The illegitimate son of a Florentine notary, Leonardo grew up in Vinci, in Tuscany, \
then around 1469 entered the workshop of Andrea del Verrocchio in Florence, where he \
learned painting, sculpture and mechanics. In 1482, he left for Milan in the service of \
Ludovico Sforza, as an engineer, organiser of festivities and painter: there he painted \
the Virgin of the Rocks and the Last Supper. After Ludovico's fall, in 1499, he passed \
through Mantua and Venice, then returned to Florence, where he began the Mona Lisa \
around 1503 and for a time served Cesare Borgia as a military engineer. He returned to \
Milan, then settled in Rome in 1513. In 1516, King Francis I invited him to France and \
housed him at the manor of Cloux, near Amboise, where he died in 1519. All his life, he \
filled thousands of notebook pages: machines, the flight of birds, the movement of \
water, botany, geology and above all anatomy. He dissected human bodies in Florence, at \
the hospital of Santa Maria Nuova, and in Pavia with the physician Marcantonio della \
Torre. His anatomical drawings, which remained unpublished, are now for the most part \
in the Royal Collection at Windsor."""
style = """
Leonardo grounds painting in observation and knowledge: anatomy, optics, botany. He \
invented sfumato, that hazy modelling that melts outlines into shadow, and an \
atmospheric perspective in which distant things turn blue. A prodigious draughtsman, \
he uses pen, black chalk, red chalk and metalpoint to think as much as to represent. \
His notebooks, in which image mingles with mirror writing, make him the very figure of \
Renaissance genius, at once artist and scientist."""

[[artistes]]
nom = "Yémen, dynastie rasoulide"
vie = "Yemen (Taʿizz, Zabid, Aden), 1229–1454"
biographie = """
The Rasulids are a family of Turkmen origin, according to most historians, although \
they claimed Arab descent. They arrived in Yemen in the service of the Ayyubids, the \
dynasty of Saladin, who had conquered the country in 1174. In 1229, their governor, Nur \
al-Din ʿUmar ibn ʿAli ibn Rasul, took power for himself and founded a sultanate that \
would last until 1454. From their capitals of Taʿizz and Zabid, the sultans held the \
port of Aden, a crossroads of trade between India, East Africa, Egypt and the \
Mediterranean. This wealth financed mosques, madrasas and a learned court. Several \
sultans wrote themselves: al-Muzaffar Yusuf, who reigned from 1250 to 1295, composed \
notably a treatise on remedies; his son al-Ashraf ʿUmar, the maker of the astrolabe \
exhibited here, wrote on the stars and on instruments. The Rasulids also commissioned \
in Egypt and Syria enamelled glass and copperware inlaid with their emblem, a \
five-petalled rose."""
style = """
The Rasulid court was one of the great centres of science and art in the medieval \
Islamic world. Astronomers, physicians and agronomists worked there under the \
protection of sultans who were themselves scholars. Court objects, engraved and inlaid \
brass instruments, enamelled glass, basins and candlesticks, often bear inscriptions in \
the name of the sultan and the dynasty's five-petalled rose, and combine technical \
precision with a refined calligraphic and floral decoration."""

[[artistes]]
nom = "Abraham Ortelius"
vie = "Antwerp, 14 April 1527 – Antwerp, 28 June 1598"
biographie = """
Born in Antwerp into a family that had come from Augsburg, Abraham Ortelius lost his \
father early. In 1547, he was enrolled in the Guild of Saint Luke as a map illuminator: \
he coloured printed maps by hand, which he sold along with books, prints and \
antiquities. His business trips, to the Frankfurt fairs, to France, Italy and England, \
allowed him to gather the best maps of his time and to form ties with scholars, notably \
Gerard Mercator, who became his friend. He had the idea of gathering maps of the same \
format in a single volume: the Theatrum Orbis Terrarum appeared in 1570 and made his \
fortune. In 1575, he received the title of geographer to King Philip II of Spain. A \
lover of Antiquity, he also published historical maps, collections of ancient images \
and a dictionary of ancient place names, which he never stopped enriching. He kept up \
a vast correspondence with humanists throughout Europe. He died in Antwerp in 1598, \
having never ceased to expand his atlas."""
style = """
Ortelius was not a field cartographer but an editor, a critical compiler and a man of \
taste. For each region he chose the best available map, had it redrawn in a common \
format and cited his sources, a new practice. His maps, engraved with clarity and \
adorned with cartouches and clouds in the taste of the Flemish Renaissance, combine \
information and beauty. His atlas served as a model for European cartography until the \
seventeenth century."""

[[artistes]]
nom = "Robert Hooke"
vie = "Freshwater (Isle of Wight), 18 July 1635 – London, 3 March 1703"
biographie = """
The son of a clergyman on the Isle of Wight, Robert Hooke showed an early talent for \
mechanics and drawing; on his father's death, he was briefly placed, it is said, with \
the painter Peter Lely in London, then entered Westminster School and the University of \
Oxford. There he became the assistant of the chemist Robert Boyle, for whom he built an \
air pump. In 1662, the very young Royal Society appointed him Curator of Experiments: \
he had to present new ones at every meeting. He published Micrographia in 1665 and \
became professor of geometry at Gresham College in London. After the Great Fire of \
1666, he was one of the surveyors in charge of rebuilding the city and worked with the \
architect Christopher Wren, notably on the Monument commemorating the fire. He is \
credited with the law of elasticity that bears his name and with work on light, \
fossils, watches and gravitation, which brought him into bitter conflict with Isaac \
Newton. He died in London in 1703. No authenticated portrait of him is known."""
style = """
Hooke was not a professional artist, but he was an exceptional draughtsman. His plates, \
of a precision and scale never seen before, show the invisible with the means of fine \
engraving: large format, rigorous modelling, controlled light. Micrographia founded \
scientific illustration with the microscope, and its images, the flea and the louse \
foremost among them, have never ceased to be copied and reproduced to this day."""
