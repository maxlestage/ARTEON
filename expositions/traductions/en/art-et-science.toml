[[oeuvres]]
titre = "The Rhinoceros"
artiste = "Albrecht Dürer"
annee = "1515"
image = "rhinoceros.jpg"
licence = "CC0"
source = "https://commons.wikimedia.org/wiki/File:Albrecht_Dürer,_The_Rhinoceros,_1515,_NGA_47903.jpg"
technique = "Woodcut, with a text printed in German"
collection = "National Gallery of Art, Washington"
note = "Dürer never saw the animal: he engraved it from a sketch and a letter that came from Lisbon, and his image remained authoritative for more than two centuries."
description = """
A massive rhinoceros, seen in profile, advances to the right and fills almost the whole \
sheet. Its skin does not look like skin: it is made of rigid plates, riveted and edged \
like the pieces of a suit of armour, scattered with circles, scales and small rosettes. \
Its legs are sheathed in scales, its neck is pleated like a ruff and, above the great \
horn on its nose, a small twisted horn grows on its shoulder. The ground is a single \
line, with a few pebbles. At upper right, the date 1515, the word RHINOCERUS and the \
artist's monogram; at the very top, a German text in five lines tells of the beast's \
arrival in Portugal."""
evocation = """
For Europeans in 1515, the rhinoceros was an almost legendary creature, known from \
ancient authors: none had been seen in Europe since Roman times. Dürer turns it into a \
living war machine, whose carapace recalls the armour forged in Nuremberg. The text \
reports that the beast is the mortal enemy of the elephant, that it attacks with its \
head lowered to rip open the elephant's belly, and that it is swift, bold and cunning. \
It is a perfect example of an image that mingles observation and imagination: extreme \
precision of detail, placed in the service of a partly invented animal that everyone \
nevertheless took to be real."""
histoire = """
The animal, an Indian rhinoceros, was a gift from the Sultan of Gujarat to the governor \
of Portuguese India, Afonso de Albuquerque, who sent it to King Manuel I. Landed in \
Lisbon in May 1515, it caused a sensation. The king then offered it to Pope Leo X, but \
the ship carrying it was wrecked off the Ligurian coast in early 1516, and the beast \
drowned. In the meantime, a letter accompanied by a sketch had reached Nuremberg. Dürer \
made a pen drawing from it, now in the British Museum, and then this woodcut, printed \
in very large numbers and reissued several times after his death. This impression is \
held by the National Gallery of Art in Washington, which makes its reproduction freely \
available."""
facture = """
Woodcut is worked in relief: everything that is to remain white is cut away with a \
knife, and only the lines left standing receive the ink. Dürer drew his compositions \
and probably entrusted the cutting to a specialist, but he pushes the technique to a \
rare fineness: parallel hatching to model the flanks, cross-hatching for the shadows, a \
scattering of small circles for the grain of the skin. The tight framing, where the \
horn and the tail almost touch the edges, gives the animal a monumental presence. \
Without colour or setting, the whole gaze is concentrated on the texture of the \
carapace."""
details = [
  "The small twisted horn on the shoulder, which real rhinoceroses do not have.",
  "The German text at the top, which wrongly dates the beast's arrival to 1513.",
  "Dürer's monogram, a large A sheltering a D, beneath the word RHINOCERUS.",
  "The legs covered in scales, like those of a reptile.",
  "The edge of the plates, at the shoulder and the rump, like the rim of a suit of armour.",
]
themes = ["animal", "exoticism", "woodcut", "imagination", "renaissance"]
anecdote = """
Despite its errors, Dürer's image remained a reference for a very long time: natural \
history books copied it until the eighteenth century, dorsal horn included, even though \
other living rhinoceroses had by then been seen in Europe."""
salle = 2
mur = "ouest"
place = 3
largeur = 1.6

[[oeuvres]]
titre = "American Flamingo (Plate 431)"
artiste = "John James Audubon"
annee = "1838"
image = "flamant-rose.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:431_American_Flamingo.jpg"
technique = "Hand-coloured etching and aquatint, engraved by Robert Havell; sheet nearly one metre high"
collection = "University of Pittsburgh Library"
note = "To show the bird life-size on the page, Audubon makes it bend its neck down to the ground: the format of the book dictates the pose."
description = """
An immense flamingo leans over the edge of a grassy bank. Its long neck forms a loop \
that descends to the ground, and its bent beak, black and yellow, almost brushes the \
grass. The plumage is coral red, deeper on the folded wings, where black feathers peek \
through. The endless pale pink legs end in webbed feet planted on the edge of the bank. \
Below, on a stretch of calm water bordered by a flat shore, other flamingos, tiny, walk \
or feed. At the top of the sheet, line drawings show the beak separately, seen from \
several angles, and a foot, as in an anatomical treatise."""
evocation = """
Audubon wanted to show every bird of America at its real size, and this rule produces a \
striking image here: the bird seems too large for the page and has to fold itself into \
it. The pose, which borrows the gesture of a flamingo probing the mud, is at once exact \
and theatrical. The contrast between the giant bird in the foreground and its distant \
fellows creates the depth of the landscape. The studies of the beak remind us that the \
book also meant to be a work of science. The Birds of America has often been seen as \
the portrait of a nature still wild and an abundance that seemed inexhaustible; several \
of the species painted by Audubon, such as the passenger pigeon and the Carolina \
parakeet, have since vanished."""
histoire = """
Unable to find a publisher in the United States, Audubon left for Great Britain in \
1826. The Birds of America appeared there in instalments, sold by subscription, from \
1827 to 1838: 435 plates in the format known as "double elephant", engraved and \
coloured for the most part in London by Robert Havell Jr., from the painter's \
watercolours. The flamingo belongs to the last instalments, in 1838. The original \
watercolours, sold by Audubon's widow, are held by the New-York Historical Society. It \
is estimated that about two hundred complete copies were assembled, of which a little \
more than a hundred survive; this one belongs to the University of Pittsburgh, and the \
Natural History Museum in London owns another."""
facture = """
Audubon worked from birds he had just shot: he fixed them, still supple, with wires on \
a gridded board to give them a lifelike attitude, then painted them in watercolour, \
heightened with pastel and gouache. Havell transferred the drawing to copper, combining \
etching and engraving, for the outlines and feathers, with aquatint, which gives the \
backgrounds their grainy tones. Each sheet was then coloured by hand by a team of \
colourists. The landscape, often entrusted to assistants or to the engraver, remains \
simple so as to let the bird dominate."""
details = [
  "The numbered studies of the beak and the foot, at the top of the sheet.",
  "The black feathers of the wings, barely visible beneath the red of the plumage.",
  "The distant flamingos, in the water, which give the scale of the landscape.",
  "The engraved caption at the bottom: American Flamingo, with the bird's Latin name.",
]
themes = ["birds", "america", "life-size", "ornithology", "aquatint"]
anecdote = """
In December 2010, a complete copy of The Birds of America was sold at Sotheby's in \
London for more than 7.3 million pounds sterling, making it at the time the most \
expensive printed book ever sold at auction."""
salle = 2
mur = "nord"
place = 1
largeur = 1.4

[[oeuvres]]
titre = "Discomedusae (Plate 8 of Art Forms in Nature)"
artiste = "Ernst Haeckel"
annee = "1899–1904"
image = "discomedusae.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Haeckel_Discomedusae_8.jpg"
technique = "Colour lithograph after a drawing by Haeckel"
collection = "Plate from the volume Kunstformen der Natur, Leipzig and Vienna"
note = "Jellyfish drawn like chandeliers or jewels: Haeckel sets out to prove that nature invents art forms by itself."
description = """
Four jellyfish, numbered and arranged as on a museum plate, float on a white ground. \
The largest, at upper right, opens a blue umbrella with scalloped edges, from which \
hang pleated orange arms, a mass of pale blue fringes and a head of red filaments so \
long that they snake down to the bottom of the sheet. At upper left, a blue-mauve \
jellyfish trails corkscrew tentacles. At right, a yellow umbrella streaked with brown, \
like a lampshade, carries pink arms and yellow threads. At the bottom, a jellyfish seen \
from below forms a blue rosette with an orange heart."""
evocation = """
Haeckel, an ardent disciple of Darwin, saw in nature a single great whole governed by \
laws, in which beauty arises of its own accord: symmetries, rays, spirals. The title of \
the volume, Art Forms in Nature, states his aim: to offer artists and the public a \
repertoire of real forms, more inventive than any ornament. The great jellyfish carries \
a more intimate charge: Haeckel had named it Desmonema annasethe, in memory of his \
first wife, Anna Sethe, who died in 1864, and its long filaments have been read as the \
image of a head of hair. These plates fed Art Nouveau, which was seeking its motifs in \
plants and animals."""
histoire = """
Haeckel published the Kunstformen der Natur in instalments of ten plates, from 1899 to \
1904, with the publisher Bibliographisches Institut, in Leipzig and Vienna. He made the \
drawings himself, from his observations under the microscope, his stays by the sea and \
the specimens brought back by the great scientific expeditions, such as that of the \
British ship Challenger, whose radiolarians he had studied. Most of the plates were \
lithographed by Adolf Giltsch. The volume of one hundred plates was a great success, in \
Germany and then across Europe. The jellyfish on this plate take up species that \
Haeckel had described in his great monograph, Das System der Medusen, which began to \
appear in 1879."""
facture = """
Haeckel composes each plate like an ornament: the organisms are arranged in arabesques \
on a white ground, without any setting. The drawing, of great anatomical precision, \
emphasises the repeated elements: the scallops of the umbrella, the folds of the arms, \
the radiating canals. Colour lithography, which requires one stone per tint, allows \
bold colours and delicate transitions: the cool blues of the umbrellas, the reds and \
oranges of the filaments. The long undulating lines of the tentacles, which cross the \
whole sheet, foreshadow the whiplash curves of Art Nouveau."""
details = [
  "The red filaments of the great jellyfish, which descend to the bottom of the plate.",
  "The jellyfish seen from below, at the bottom, whose umbrella forms a rosette.",
  "The corkscrew tentacles of the blue-mauve jellyfish, at upper left.",
  "The small numbers, from 1 to 4, which refer to the explanations in the text.",
]
themes = ["jellyfish", "sea", "symmetry", "art nouveau", "zoology"]
anecdote = """
For the monumental gate of the Paris Exposition Universelle in 1900, the architect René \
Binet drew direct inspiration from the radiolarians drawn by Haeckel, those microscopic \
marine organisms with openwork silica skeletons."""
salle = 2
mur = "nord"
place = 4
largeur = 1.2

[[oeuvres]]
titre = "Pineapple and Cockroaches (Plate 1 of Metamorphosis insectorum Surinamensium)"
artiste = "Maria Sibylla Merian"
annee = "1705"
image = "ananas-merian.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Metamorphosis_insectorum_Surinamensium_-_KW_1792_A_19_-_plaat01.jpg"
technique = "Hand-coloured copper engraving, engraved by Joseph Mulder after Merian"
collection = "Koninklijke Bibliotheek, The Hague"
note = "The first plate of the book Merian brought back from Suriname: a flowering pineapple overrun by cockroaches at several stages of their lives."
description = """
A pineapple stands at the centre of the sheet, still on its plant, surrounded by long \
verdigris-green leaves edged with spines, which fan outwards. The fruit, topped with a \
tuft of leaves, is covered in bluish and golden scales; at its base spring large red \
leaves spotted with yellow. Around it are cockroaches: two adults with spread brown \
wings fly at the top, another, wings folded, rests on a leaf, and a pale young \
cockroach with long antennae climbs on the right. At the bottom, a small brown sphere \
and two smaller insects complete the scene. There is no setting: the plant and its \
guests stand out against the pale paper."""
evocation = """
Merian does not sort insects into boxes: she shows them alive, on the plant that feeds \
them, at several stages of their metamorphosis. This way of linking the animal, its \
food and its life cycle makes her a pioneer of what would later be called ecology. \
Opening the book with the pineapple is no accident: this fruit of the Americas, rare \
and expensive in Europe, was the very symbol of exotic luxury. But Merian unabashedly \
installs the cockroaches that devour it. Her book has also been read as testimony to \
the Dutch colony of Suriname, founded on the labour of enslaved people, whom she \
mentions several times in her texts."""
histoire = """
In 1699, at the age of fifty-two, Merian sailed for Suriname, a Dutch colony in South \
America, with her daughter Dorothea Maria, to study insects. She worked there for \
nearly two years, helped by enslaved Africans and Amerindians who brought her specimens \
and information, before illness forced her to return in 1701. In Amsterdam, she \
prepared a large book of sixty plates, the Metamorphosis insectorum Surinamensium, \
which she published in 1705 at her own expense, by subscription, in Latin and Dutch. \
The plates were engraved by several engravers, including Joseph Mulder, who signed this \
one; deluxe copies were coloured by hand. This copy belongs to the Royal Library of the \
Netherlands, in The Hague."""
facture = """
Merian painted from life, in watercolour and gouache on vellum, following the \
development of the caterpillars and larvae she raised herself. The engravers \
transposed her studies onto copper in a fine, light line, which the colourists' \
watercolour covers almost entirely: colour prevails over the black of the engraving. \
The composition is built like a portrait: the plant, seen from the front, fills the \
page, and the insects are distributed around it like satellites. The greens, reds and \
browns are laid in bold tints, with darker highlights for volume."""
details = [
  "The engraver's signature, J. Mulder sculp., at lower left.",
  "The two cockroaches in flight, at the top, brown wings wide open.",
  "The pale young cockroach, wingless, with long antennae, on a leaf at right.",
  "The tiny spines that edge each leaf of the pineapple.",
]
themes = ["insects", "metamorphosis", "suriname", "fruit", "women scientists"]
anecdote = """
After Merian's death in 1717, Tsar Peter the Great bought a large part of her \
watercolours and studies. They are still kept in Saint Petersburg, in the collections \
of the Russian Academy of Sciences."""
salle = 3
mur = "ouest"
place = 2
largeur = 1.1

[[oeuvres]]
titre = "Foliaceous Cabbage Rose (Rosa centifolia foliacea)"
artiste = "Pierre-Joseph Redouté"
annee = "1817–1824"
image = "rosier-a-cent-feuilles.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Redoute_-_Rosa_centifolia_foliacea.jpg"
technique = "Stipple engraving printed in colour and retouched in watercolour, engraved by Langlois"
collection = "Plate from the book Les Roses, Paris"
note = "The portrait of a variety of rose, flowers, buds and leaves, by the painter nicknamed the Raphael of flowers."
description = """
A rose branch unfolds on the white paper, from the thorny stem at the bottom to the \
buds at the top. At the summit open two large soft pink roses, with tight petals curled \
into a cup, one in full bloom, the other still half closed. Around them are buds at \
different stages, held in their green sepals, whose tips are cut into small leaves. The \
abundant foliage shows toothed leaflets of a deep green, seen sometimes from above, \
sometimes from below, paler. At the bottom, two engraved captions in italic give the \
Latin name, Rosa centifolia foliacea, and the French name, Rosier à cent feuilles \
foliacé."""
evocation = """
The rose is the most symbol-laden flower in the West: love, beauty, the flight of time. \
Redouté, however, seeks neither allegory nor bouquet: he makes the portrait of a \
precise variety, such that a botanist or a gardener can recognise it. The detail that \
gives it its name, the sepals transformed into small leaves, is carefully brought out. \
The book was born in the Paris of the Empire and the Restoration, where rose growing \
was fashionable: Empress Joséphine had assembled a famous collection at Malmaison, and \
horticulturists were multiplying new varieties. These plates preserve the memory of \
this, and some of the roses painted by Redouté are hard to find in gardens today."""
histoire = """
Les Roses appeared in Paris in instalments, from 1817 to 1824, and make up three \
volumes of 168 plates. The texts are by the botanist Claude-Antoine Thory, who \
describes each variety. Empress Joséphine, who had been Redouté's patron, had died in \
1814: the book is often associated with her rose garden at Malmaison, but the models \
came from several gardens and nurseries in the Paris region. Its success was such that \
a smaller-format edition followed as early as the 1820s. Sought after by collectors, \
the plates were often detached from the volumes to be framed, and they are now among \
the most reproduced images of flowers in the world."""
facture = """
Redouté perfected stipple engraving printed in colour. Instead of lines, the engraver \
digs into the copper a multitude of dots, more or less tightly spaced, which render \
the modelling without hard outlines. The colours are applied to the same plate with \
small fabric pads, the poupées, and printed in a single pass; the impression is then \
retouched by hand in watercolour. The result imitates the transparency of watercolour \
on vellum, in which Redouté excelled. The white ground, without cast shadow, isolates \
the plant as in a herbarium."""
details = [
  "The sepals of the buds, cut like small leaves: this is the meaning of the word foliaceous.",
  "The fine thorns of the stem, at the very bottom.",
  "The pale underside of certain leaves, which turn towards us.",
  "The engraved inscriptions at the bottom: P. J. Redouté pinx., the printer Rémond and the engraver Langlois.",
]
themes = ["roses", "botany", "flowers", "colour", "gardens"]
anecdote = """
Redouté painted for decades for the vélins of the Muséum d'histoire naturelle in \
Paris, a collection of paintings of plants and animals on parchment begun in the \
seventeenth century for Gaston d'Orléans, and still being added to today."""
salle = 3
mur = "ouest"
place = 3
largeur = 1.0

[[oeuvres]]
titre = "First Plate of the Muscles (De humani corporis fabrica)"
artiste = "André Vésale"
annee = "1543"
image = "premiere-planche-des-muscles.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:De_humani_corporis_fabrica_(27).jpg"
technique = "Woodcut, page of the book printed in Basel by Johannes Oporinus"
collection = "Special Collections, University of Amsterdam"
note = "An écorché walks through an Italian landscape: the first plate of the muscles from the great treatise that refounded anatomy."
description = """
A man stripped of his skin stands facing us in the middle of a landscape. He advances \
one step, his head thrown back towards the sky, his arms spread and his hands open, as \
in a gesture of lamentation. All the superficial muscles are exposed: the pectorals, \
the abdominals cut into squares, the long muscles of the thighs and arms, marked with \
small letters that refer to the text. Behind him stretches a rolling countryside, with \
hills, houses, ancient ruins, obelisks, a pyramid and arcades. At the top, the Latin \
title PRIMA MUSCULORUM TABULA, the running head of the book in Vesalius's name and the \
page number."""
evocation = """
Vesalius poses his écorchés like ancient statues, alive and in motion, instead of \
showing them lying on the dissecting table. Some have seen in this an echo of \
meditations on death, but also the pride of a new science that dares to look beneath \
the skin. The landscape strewn with ruins recalls Renaissance Italy, where Antiquity \
was being rediscovered. The book's message is clear: anatomy must no longer be read in \
the texts of Galen, the Greek physician whose authority had reigned for thirteen \
centuries, but learned from the human body itself. Vesalius shows that Galen had often \
described animals, monkeys or pigs, rather than men."""
histoire = """
Vesalius was only twenty-eight when, in 1543, in Basel, from the printer Johannes \
Oporinus, there appeared the De humani corporis fabrica libri septem, "Seven Books on \
the Structure of the Human Body". A professor at Padua, he based his teaching there on \
dissection, which he performed himself. The engravings were drawn in Venice, in the \
circle of Titian; they are often attributed, at least in part, to Jan Steven van \
Calcar, but the question remains debated. The wooden blocks were shipped from Venice to \
Basel across the Alps. The book, dedicated to the Emperor Charles V, scandalised the \
followers of Galen before establishing itself as the foundation of modern anatomy. A \
second edition appeared in 1555."""
facture = """
Woodcut reaches here a fineness rarely equalled. The cuts follow the form of the \
muscles, like the fibres themselves, and the hatching models the volumes. The drawing \
combines anatomical exactness, controlled by Vesalius, with a Venetian way of placing \
the figure in space, with a hip-shot stance inspired by ancient sculpture. The \
landscape, treated more lightly, recedes to the horizon. Small letters engraved in the \
muscles refer to a legend: the image is read together with the text, like a map with \
its key."""
details = [
  "The small letters scattered over the muscles, which refer to the explanations in the text.",
  "The obelisks and the pyramid, at right, in the landscape.",
  "The ruined arcades, at the foot of the hills, at right.",
  "The head thrown back, almost like that of a martyr.",
  "The page number, 170, at upper left.",
]
themes = ["anatomy", "body", "medicine", "renaissance", "landscape"]
anecdote = """
The woodblocks of the Fabrica were used for printings for nearly four centuries, up to \
an edition of 1934. Kept in the library of the University of Munich, they were \
destroyed in the bombing of the city in 1944."""
salle = 4
mur = "est"
place = 2
largeur = 1.0

[[oeuvres]]
titre = "The Vitruvian Man"
artiste = "Léonard de Vinci"
annee = "c. 1490"
image = "homme-de-vitruve.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:Da_Vinci_Vitruve_Luc_Viatour.jpg"
technique = "Pen and brown ink over metalpoint, on paper, about 34 × 25 cm"
collection = "Gallerie dell'Accademia, Venice"
note = "A man inscribed in a circle and a square: Leonardo gives image to the ideal proportions of the body described by the Roman architect Vitruvius."
description = """
At the centre of a sheet covered in writing, a nude man is drawn twice, superimposed: \
once with arms horizontal and feet together, once with arms raised and legs apart. In \
the first position, he is inscribed in a square; in the second, his hands and feet \
touch a circle whose centre is the navel. The face, framed by curls, looks straight \
ahead, solemn. Small marks on the body indicate the divisions of the proportions, at \
the chest, the knees, along the arms. Beneath the figure runs a graduated scale; above \
and below, lines of text are written backwards, from right to left."""
evocation = """
The Roman architect Vitruvius asserted that a well-proportioned man, with arms and legs \
spread, can be inscribed at once in a circle and in a square, the two perfect figures, \
and that architecture should imitate these proportions. In the Renaissance, the idea \
was fascinating: the human body would be a miniature of the universe. Other artists of \
the time tried their hand at this figure, often clumsily. Leonardo solves the problem \
by not giving the two shapes the same centre: the circle turns around the navel, the \
square around the groin. The drawing has become the very symbol of the alliance \
between art and science, and of the humanism that places man at the centre of the \
world."""
histoire = """
Leonardo made this drawing in Milan, around 1490, when he was in the service of \
Ludovico Sforza and was studying architecture, anatomy and proportions all at once. \
The text that accompanies it paraphrases the third book of Vitruvius's treatise De \
architectura, then lists, measure after measure, the relationships between the parts \
of the body and its height: the span of the arms, for example, equals the man's \
height. The sheet later passed into the collection of the Milanese painter Giuseppe \
Bossi, then entered the Gallerie dell'Accademia in Venice in 1822. Highly sensitive to \
light, it is shown only rarely and for short periods."""
facture = """
Leonardo first lays out the construction in metalpoint, with compass and ruler, then \
goes over the outlines in pen and brown ink, in a sure, light line. Fine hatching, \
typical of his left hand, models the musculature economically. The double pose gives \
an impression of movement, almost of animation, at the heart of a motionless geometric \
figure. As in all of Leonardo's notebooks, image and text form a whole: his mirror \
writing, traced from right to left, frames the drawing."""
details = [
  "The navel, the exact centre of the circle.",
  "The graduated scale drawn beneath the figure.",
  "The small marks that divide the body into fractions of its height.",
  "Leonardo's mirror writing, which has to be read in a looking glass.",
  "The four arms and four legs, which suggest movement.",
]
themes = ["proportions", "body", "geometry", "humanism", "renaissance"]
anecdote = """
The Vitruvian Man appears on the Italian side of the one-euro coin. In 2019, its loan \
to the Louvre for the Leonardo da Vinci exhibition was first suspended by an Italian \
court, to which a heritage protection association had appealed, before being \
authorised."""
salle = 4
