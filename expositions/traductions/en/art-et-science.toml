[[oeuvres]]
titre = "Typus Orbis Terrarum (World Map)"
artiste = "Abraham Ortelius"
annee = "1570"
image = "typus-orbis-terrarum.jpg"
licence = "Domaine public"
source = "https://commons.wikimedia.org/wiki/File:OrteliusWorldMap1570.jpg"
technique = "Hand-coloured copper engraving, engraved by Frans Hogenberg"
collection = "Library of Congress, Washington"
note = "The world map that opens the Theatrum Orbis Terrarum, regarded as the first modern atlas."
description = """
The whole world fits into a great oval gridded with meridians and parallels, \
surrounded by blue clouds that curl in the corners. Europe, Africa and Asia occupy the \
right, the Americas the left, with a swollen South America and a North America \
excessively wide. The whole bottom of the map is taken up by an immense southern \
continent, inscribed TERRA AUSTRALIS NONDUM COGNITA, the southern land not yet known. \
On the seas sail a ship and sea monsters. At the top, a cartouche gives the title; at \
the bottom, a second cartouche bears a Latin sentence by Cicero. The lands are \
heightened with yellows, pinks and pale greens."""
evocation = """
The map shows the world as Europeans knew it nearly eighty years after Christopher \
Columbus's first voyage: the coasts of the Atlantic and of Africa are traced with \
confidence, but the Pacific, the interior of the continents and the polar regions \
remain uncertain, and the great southern continent is a matter of hypothesis. Cicero's \
sentence, taken from the Tusculan Disputations, asks what can seem great in human \
affairs to one who knows the eternity and immensity of the world. It invites modesty: \
seen from above, the Earth makes human ambitions look paltry. The title of the book, \
Theatre of the World, says the same thing: the Earth is a stage taken in at a single \
glance."""
histoire = """
Abraham Ortelius, a dealer in maps and antiquities in Antwerp, published on 20 May \
1570 the Theatrum Orbis Terrarum, a collection of maps of uniform format and style, \
engraved for the occasion and accompanied by texts, with the list of the cartographers \
he had used. This was the invention of the modern atlas, even if the word came only \
later, with Mercator. This world map, engraved by Frans Hogenberg, draws notably on the \
great wall map published by Mercator in 1569. The book was an immediate success: it \
was reissued and expanded some thirty times in forty years, in Latin and then in \
several other languages. This coloured copy belongs to the Library of Congress in \
Washington."""
facture = """
The map is engraved with a burin on copper, in a clean line that allows hundreds of \
names to be inscribed in small capitals and italics. The oval projection spreads the \
whole surface of the globe over the sheet, curving the meridians towards the poles. The \
ornaments, curling clouds, cartouches with scrolls and ribbons, belong to the \
decorative vocabulary of the Flemish Renaissance. The colour was not printed but \
applied by hand, in watercolour: the buyer could order a coloured copy, at a higher \
price, from map illuminators, the trade Ortelius himself practised in his early years."""
details = [
  "The cartouche at the bottom, with Cicero's sentence in capitals.",
  "The words TERRA AUSTRALIS NONDUM COGNITA, on the imaginary southern continent.",
  "The mention of Christopher Columbus and the year 1492, on North America.",
  "The bulge of the west coast of South America, corrected in later editions.",
  "The sea monster in the Indian Ocean, at lower right.",
]
themes = ["cartography", "world", "discoveries", "atlas", "antwerp"]
anecdote = """
In his geographical dictionary, the Thesaurus geographicus of 1596, Ortelius suggests \
that the Americas were torn away from Europe and Africa by earthquakes and floods: this \
has been seen as one of the first intuitions of continental drift."""
