[exposition]
ordre = 65
nom_court = "Art and Science"
mouvement = "Art and Science: Nature Drawn"
cadre = "estampe"
couleur = "#2f5d50"
titre = "Art and Science, Nature Drawn"
artiste = "Leonardo, Dürer, Vesalius, Merian, Audubon, Haeckel…"
dates = "1291–1904"
accroche = "Virtual exhibition · Natural History Museum, London"
introduction = """
For centuries, scholars and artists needed one another: to describe a plant, an insect, \
a muscle or the outline of a continent, one first had to know how to draw it. The visit \
brings together ten images in which observation becomes art, from Dürer's rhinoceros to \
Haeckel's jellyfish, from Leonardo's Vitruvian Man to Audubon's flamingo, with a Yemeni \
astrolabe and the world map from the first modern atlas. The building is inspired by the \
Natural History Museum in London: behind a porch, a tall nave, the Hintze Hall, opens to \
the west and east onto two galleries and, at the far end, onto a cabinet."""
vitrine = "flamant-rose.jpg"

[musee]
nom = "Natural History Museum"
ville = "London, United Kingdom"
architecte = "Alfred Waterhouse"
construction = "1873–1881"
presentation = """
In the mid-nineteenth century, the natural history collections of the British Museum, \
which had grown from the bequest of the physician Hans Sloane, were overflowing their \
rooms in Bloomsbury. The naturalist Richard Owen, who directed them, secured the \
construction of a separate building in South Kensington, a "cathedral to nature". After \
the death of Francis Fowke, winner of the competition, Alfred Waterhouse took over the \
project in a Romanesque style: building work began in 1873 and the museum opened on 18 \
April 1881. The façade is entirely clad in buff and blue-grey terracotta, a material \
that withstands London soot, and adorned with sculpted plants and animals: living \
species on the west side, extinct species on the east. At the centre, the great nave, \
renamed the Hintze Hall in 2014, has a ceiling of panels painted with plants; since \
2017, the skeleton of a blue whale has hung there, in place of the famous \
diplodocus cast. The museum, which took its present name only in 1992, is free to \
enter."""
ici = """
The ARTEON building follows the axis of Waterhouse's museum: a porch, then a very tall \
nave onto which the galleries open. Visitors enter from the south through the Cromwell \
Road porch, with its walls of pale stone, and then the Hintze Hall, twenty-eight metres \
long and eighteen metres high, terracotta in colour, where the animals are gathered. To \
the west lies the gallery of plants and insects, in soft green; to the east, the gallery \
of the human body, in pale pink. At the far end of the nave, to the north, the square \
cabinet of the world holds the instruments and maps."""

