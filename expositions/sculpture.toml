cadre = "vitrine"
couleur = "#6b4f2e"
titre = "La sculpture, du marbre de Michel-Ange au bronze de Rodin"
artiste = "Michel-Ange, Bernin, Canova, Carpeaux, Rodin, Claudel, Degas…"
dates = "1513–1909"
accroche = "Exposition virtuelle · Musée Rodin, Paris"
introduction = """
Quatre siècles de sculpture, du marbre que Michel-Ange arrache au bloc jusqu'au \
bronze de Rodin, qui fait de la matière un drame et de la surface une vibration. \
La visite réunit dix œuvres de neuf sculpteurs, du Bernin à Maillol, présentées par \
des photographies dans des vitrines, comme dans un cabinet d'amateur. Le bâtiment \
s'inspire de l'hôtel Biron, où Rodin s'installa en 1908 et qui est devenu le musée \
Rodin : un vestibule où attend Le Penseur, puis une enfilade de quatre salons aux \
boiseries claires, alignés comme sur le jardin."""
vitrine = "baiser.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Musée Rodin (hôtel Biron)"
ville = "Paris, France"
architecte = "Jean Aubert"
construction = "1727–1732"
presentation = """
L'hôtel Biron est construit de 1727 à 1732, rue de Varenne, pour Abraham Peyrenc de \
Moras, un financier enrichi. Il prend plus tard le nom du maréchal de Biron, qui \
l'occupe à partir de 1753 et en fait dessiner les jardins. Au XIXᵉ siècle, les \
religieuses du Sacré-Cœur y tiennent un pensionnat de jeunes filles. Quand la loi \
leur interdit d'enseigner, en 1904, elles doivent partir, et l'État loue les pièces \
à des artistes : Matisse, Cocteau, la danseuse Isadora Duncan, le poète Rilke, qui \
fait découvrir le lieu à Rodin. Le sculpteur y loue des salons à partir de 1908. En \
1916, il donne à l'État ses œuvres et ses collections, à condition qu'elles soient \
présentées ici : le musée ouvre en 1919, deux ans après sa mort. Dans les salons aux \
boiseries rocaille, éclairés par de hautes fenêtres, on voit aujourd'hui ses \
marbres, ses plâtres et la salle de Camille Claudel ; le jardin abrite Le Penseur, \
La Porte de l'Enfer et Les Bourgeois de Calais."""
ici = """
Le bâtiment d'ARTEON évoque le rez-de-chaussée de l'hôtel Biron. On entre par le sud \
dans le vestibule, où Le Penseur accueille le visiteur. Au nord s'ouvre le grand \
salon, haut de sept mètres et demi, consacré à la Porte de l'Enfer. Il commande une \
enfilade de salons alignés d'ouest en est, comme ceux qui donnent sur le jardin : à \
l'ouest, la galerie des maîtres anciens, de Michel-Ange à Canova ; à l'est, la salle \
Claudel et Degas, puis, au bout de l'enfilade, la salle « Après Rodin ». Les murs, \
crème, gris perle ou vert pâle, rappellent les boiseries peintes de l'hôtel."""

