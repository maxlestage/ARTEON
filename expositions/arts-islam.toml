[exposition]
ordre = 22
nom_court = "Arts de l'Islam"
mouvement = "Arts de l'Islam"
cadre = "vitrine"
couleur = "#1d5e6b"
titre = "Les arts de l'Islam, de Cordoue à Ispahan"
artiste = "Cordoue, Kairouan, Le Caire, Kashan, Ispahan, Iznik…"
dates = "IXᵉ–XVIᵉ siècle"
accroche = "Exposition virtuelle · Musée d'Art islamique, Doha"
introduction = """
Des bords de l'Atlantique à l'Iran, les terres d'Islam ont fait de l'écriture, de la \
géométrie et du décor végétal un langage commun, décliné sur le parchemin, la laine, \
le verre, le métal, l'ivoire et la céramique. La visite réunit dix objets, du Coran \
bleu de Kairouan aux tapis des cours safavide, mamelouke et ottomane, de la lampe de \
mosquée du Caire au plat d'Iznik. Le bâtiment s'inspire du musée d'Art islamique de \
Doha, dessiné par I. M. Pei : un vestibule, puis un haut atrium où sont présentés les \
grands tapis, autour duquel s'ouvrent trois galeries."""
vitrine = "tapis-ardabil.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Musée d'Art islamique"
ville = "Doha, Qatar"
architecte = "Ieoh Ming Pei"
construction = "inauguré en 2008"
presentation = """
Pour bâtir à Doha un musée consacré aux arts de l'Islam, l'émirat du Qatar fait appel \
à l'architecte sino-américain I. M. Pei, l'auteur de la pyramide du Louvre. Celui-ci \
voyage pour étudier l'architecture islamique et trouve son modèle au Caire, dans la \
fontaine aux ablutions de la mosquée d'Ibn Tulun, une construction du XIIIᵉ siècle \
d'une géométrie dépouillée. Le musée, inauguré à la fin de 2008, se dresse sur une île \
gagnée sur la mer, au bout de la corniche : un empilement de volumes cubiques de \
calcaire clair, qui se resserrent en gradins jusqu'à une tour centrale. À l'intérieur, \
un atrium de plusieurs étages monte jusqu'à une coupole percée d'un oculus, où le \
carré se change en octogone puis en cercle ; une immense baie vitrée ouvre sur la mer \
et la ville. Les galeries, aménagées par Jean-Michel Wilmotte, sont plongées dans la \
pénombre : chaque objet y brille dans sa vitrine. Les collections couvrent l'art \
islamique de l'Espagne à l'Asie centrale et à l'Inde."""
ici = """
Le bâtiment d'ARTEON reprend la disposition du musée de Doha : un vestibule, puis un \
atrium très haut d'où partent les galeries. On entre par le sud dans « Le vestibule de \
la corniche », aux murs de pierre claire. Au nord s'ouvre « L'atrium · Les grands \
tapis », haut de seize mètres, où sont tendus le tapis d'Ardabil et un tapis ottoman. \
Trois galeries de six mètres de haut l'entourent : à l'ouest « Le Caire des Mamelouks \
», à l'est « De Kashan à Iznik · La terre et le feu », et au nord, dans l'axe, « \
Kairouan et Cordoue · L'écriture et l'ivoire »."""

