# ─────────────────────────────────────────────────────────────────────────────
#  EXPOSITION « BYZANCE » D'ARTEON
#
#  Une exposition = ce fichier (expositions/<nom>.toml) + les images de ses
#  œuvres dans public/tableaux/<nom>/ (ici public/tableaux/byzance/). Le nom du
#  fichier donne l'adresse de l'exposition sur le site : /byzance.
#
#  Le cadre par défaut est doré (icônes, manuscrits) ; les objets (ivoire,
#  reliure d'orfèvrerie) sont présentés en vitrine, et les mosaïques murales et la
#  tapisserie sans cadre. Les mosaïques de Ravenne, les icônes du Sinaï et de
#  Vladimir sont des reproductions du domaine public ; la photographie de la
#  Déisis de Sainte-Sophie est publiée par son auteur sous CC0 ; les autres
#  œuvres sont photographiées par le Cleveland Museum of Art et le Metropolitan
#  Museum of Art, qui les publient en CC0.
#
#  Le mode d'emploi complet est sur la page « Ajouter une œuvre » du site.
# ─────────────────────────────────────────────────────────────────────────────

[exposition]
ordre = 8
nom_court = "Byzance"
mouvement = "Byzance et l'Orient chrétien"
cadre = "dore"
couleur = "#7d5a12"
titre = "Byzance et l'Orient chrétien, le ciel en or"
artiste = "Ravenne, Constantinople, Angelos Akotantos, Égypte copte, Arménie, Éthiopie…"
dates = "VIᵉ–XVIIᵉ siècle"
accroche = "Exposition virtuelle · Sainte-Sophie, Istanbul"
introduction = """
Pendant mille ans, de Justinien à la chute de Constantinople en 1453, l'Empire byzantin \
invente un art de l'or et de la présence : des mosaïques où l'empereur côtoie les \
saints, des icônes que l'on prie et que l'on embrasse, des ivoires et des livres \
d'Évangiles précieux comme des reliquaires. La visite suit cet art de Ravenne à la \
Crète, puis chez les autres chrétiens d'Orient, en Égypte, en Arménie et en Éthiopie, en \
onze œuvres. Le bâtiment s'inspire de Sainte-Sophie à Istanbul : un narthex en longueur, \
une nef carrée très haute sous la coupole, deux bas-côtés et, au fond, une abside."""
vitrine = "vierge-de-vladimir.jpg"

# ─── Le bâtiment ─────────────────────────────────────────────────────────────

[musee]
nom = "Sainte-Sophie"
ville = "Istanbul, Turquie"
architecte = "Anthémius de Tralles et Isidore de Milet"
construction = "532–537"
presentation = """
En 532, l'émeute Nika ravage Constantinople et la basilique de la Sagesse divine, Hagia \
Sophia, part en fumée. L'empereur Justinien la fait aussitôt reconstruire par deux \
savants, le mathématicien Anthémius de Tralles et Isidore de Milet : la nouvelle église \
est consacrée en 537. Sa coupole, large d'environ trente et un mètres, semble flotter \
au-dessus de la nef grâce à la couronne de quarante fenêtres percée à sa base. Effondrée \
en 558 après des séismes, elle est reconstruite plus haute. Pendant neuf siècles, \
Sainte-Sophie est la cathédrale de l'Empire, où l'on couronne les empereurs. Après la \
prise de la ville par Mehmed II en 1453, elle devient mosquée : on y ajoute des minarets \
et l'on recouvre peu à peu les mosaïques figurées d'enduit. Musée à partir de 1934, elle \
a été rendue au culte musulman en 2020. On y voit toujours les marbres de Justinien et, \
dans les tribunes, les mosaïques dégagées au XXᵉ siècle, dont la Déisis."""
ici = """
Le bâtiment d'ARTEON reprend l'ordonnance de Sainte-Sophie. On entre par le sud dans le \
narthex, long vestibule de vingt-quatre mètres. Il ouvre sur la nef sous la coupole, une \
salle carrée de vingt-quatre mètres de côté et de vingt mètres de haut, aux murs couleur \
d'or, où sont réunies les mosaïques. À l'ouest, le bas-côté des icônes ; à l'est, le \
bas-côté du trésor, plus bas et plus intimes. Au nord, au fond de la nef, l'abside \
présente les chrétientés d'Orient : Égypte, Arménie et Éthiopie."""

