# ─── Les artistes ────────────────────────────────────────────────────────────

[[artistes]]
nom = "Mosaïstes de Ravenne"
vie = "Ravenne (Italie), Vᵉ–VIᵉ siècle"
biographie = """
Ravenne, sur la côte adriatique, devient en 402 la capitale de l'Empire romain \
d'Occident, à l'abri de ses marais. L'impératrice Galla Placidia y fait construire un \
petit mausolée couvert de mosaïques bleu nuit. Après la chute de l'Empire d'Occident, la \
ville est la capitale du roi ostrogoth Théodoric, qui règne sur l'Italie de 493 à 526 et \
fait décorer l'église Saint-Apollinaire-le-Neuf. En 540, les armées de l'empereur \
byzantin Justinien prennent la ville : San Vitale, puis Saint-Apollinaire-in-Classe, \
consacrée en 549, reçoivent les plus beaux décors de leur temps. Ravenne reste ensuite \
le siège du gouverneur byzantin d'Italie, l'exarque, jusqu'à sa prise par les Lombards \
en 751. Les mosaïstes qui ont travaillé sur ces chantiers sont anonymes. Les historiens \
discutent pour savoir s'ils venaient de Constantinople ou s'ils formaient un atelier \
local, formé aux modèles de la capitale ; il est probable que les deux se sont mêlés. \
Huit monuments de la ville sont inscrits ensemble au patrimoine mondial de l'Unesco \
depuis 1996."""
style = """
Les mosaïques de Ravenne montrent le passage de l'art romain à l'art byzantin : les \
figures perdent leur volume et leur ombre, se placent de face sur un fond d'or ou de \
bleu profond, et s'alignent en rangées solennelles. La couleur est éclatante, les \
visages aux grands yeux sont pourtant individualisés. Ce langage de l'or et de la \
frontalité, qui fait de l'image une présence plutôt qu'une scène, marquera tout l'art \
chrétien d'Orient et, plus tard, les primitifs italiens."""

[[artistes]]
nom = "Byzance"
vie = "Empire byzantin, Constantinople, 330–1453"
biographie = """
En 330, l'empereur Constantin inaugure sa nouvelle capitale sur le site de l'antique \
Byzance, au bord du Bosphore : Constantinople. Quand l'Empire romain d'Occident \
disparaît en 476, celui d'Orient continue pendant près de mille ans ; on l'appelle \
aujourd'hui l'Empire byzantin, mais ses habitants se disaient Romains. Sous Justinien, \
au VIᵉ siècle, il atteint sa plus grande étendue et construit Sainte-Sophie. De 726 \
environ à 843, la querelle des images divise l'Empire : les iconoclastes font détruire \
les représentations du Christ et des saints, avant que le culte des icônes soit \
définitivement rétabli. Sous la dynastie macédonienne, aux Xᵉ et XIᵉ siècles, les \
ateliers de la capitale produisent ivoires, manuscrits, émaux et soieries de luxe. En \
1204, les croisés pillent Constantinople ; la ville est reprise en 1261 par Michel VIII \
Paléologue, et l'art connaît un dernier essor. Le 29 mai 1453, les Ottomans de Mehmed II \
prennent la ville. L'art byzantin survit dans les pays orthodoxes, de la Grèce à la \
Russie, et dans les ateliers de la Crète vénitienne."""
style = """
L'art byzantin est d'abord un art religieux et impérial. Il privilégie la frontalité, le \
fond d'or qui place les figures hors du temps, des types fixés par la tradition pour que \
chaque image reste fidèle à son modèle. L'icône n'est pas un simple tableau : le respect \
rendu à l'image passe, selon les théologiens, à la personne représentée. Pourtant, de \
siècle en siècle, les artistes renouvellent ces formules, de l'élégance antique de l'an \
mil à l'humanité émue des visages du XIIIᵉ siècle."""

[[artistes]]
nom = "Angelos Akotantos"
vie = "Candia (Crète), actif dans la première moitié du XVᵉ siècle"
biographie = """
Angelos Akotantos vit à Candia, l'actuelle Héraklion, capitale de la Crète, alors \
possession de Venise. La ville abrite au XVᵉ siècle une importante corporation de \
peintres grecs, qui travaillent pour les églises orthodoxes de l'île, pour des clients \
catholiques et pour l'exportation. Akotantos en est l'un des plus réputés. On le connaît \
par des documents d'archives vénitiens, dont un testament daté de 1436, et par des \
icônes signées en grec « de la main d'Angelos ». Parmi celles-ci, une Vierge \
Kardiotissa, conservée au musée byzantin et chrétien d'Athènes, est l'une des plus \
célèbres. Il meurt au milieu du XVᵉ siècle, peu avant ou peu après la chute de \
Constantinople, qui pousse de nombreux artistes byzantins à se réfugier en Crète. Ses \
modèles, copiés et recopiés, fixent pour longtemps les types de l'école crétoise, que \
suivront Andreas Ritzos à la fin du siècle et, au siècle suivant, le jeune Domínikos \
Theotokópoulos, futur Greco, né à Candia."""
style = """
Akotantos réunit la tradition de Constantinople et une précision nouvelle : contours \
nets, chairs modelées par de fines touches claires parallèles, plis anguleux et rythmés, \
or abondant. Ses Vierges ont une douceur grave et retenue. Cette manière élégante, \
facile à transmettre par des dessins de modèles, devient la signature de l'école \
crétoise, dont les icônes se diffusent de Venise à l'Éthiopie."""

[[artistes]]
nom = "Égypte copte"
vie = "Égypte chrétienne, depuis le IVᵉ siècle"
biographie = """
Selon la tradition, l'évangéliste Marc aurait fondé l'Église d'Alexandrie. Le \
christianisme se répand en Égypte dès les premiers siècles, et le pays devient, au IVᵉ \
siècle, le berceau du monachisme chrétien, avec saint Antoine, ermite du désert, et \
saint Pacôme, qui fonde les premières communautés de moines. Au concile de Chalcédoine, \
en 451, une grande partie des chrétiens d'Égypte refuse la définition de la nature du \
Christ adoptée par l'Empire : leur Église se sépare de celle de Constantinople. Le mot \
copte vient de l'arabe qubt, lui-même tiré du grec Aiguptios, égyptien. La conquête \
arabe, entre 639 et 642, fait passer l'Égypte sous la domination musulmane, mais les \
coptes restent nombreux et forment encore aujourd'hui la plus importante communauté \
chrétienne du Proche-Orient. Leur art, connu par les églises et les monastères, les \
peintures murales, les sculptures et surtout les textiles conservés par le sable sec, \
mêle l'héritage de l'Égypte gréco-romaine et les thèmes chrétiens."""
style = """
L'art copte aime les couleurs franches, les visages ronds aux grands yeux fixes, les \
figures frontales et simplifiées, et les décors foisonnants de feuillages, de fruits et \
d'animaux. Il hérite des portraits du Fayoum et de l'art hellénistique d'Alexandrie, \
mais va vers une stylisation de plus en plus marquée. Ses tissus de laine et de lin, \
souvent tissés en tapisserie, comptent parmi les plus beaux textiles de l'Antiquité \
tardive."""

[[artistes]]
nom = "Arménie"
vie = "Arménie, Cilicie et diaspora arménienne, depuis le IVᵉ siècle"
biographie = """
Selon la tradition, le roi Tiridate III, converti par saint Grégoire l'Illuminateur, \
fait du christianisme la religion officielle de l'Arménie au début du IVᵉ siècle. Vers \
405, le moine Mesrop Machtots invente un alphabet propre à la langue arménienne, qui \
permet de traduire la Bible et donne naissance à une riche littérature. Placée entre \
Byzance, la Perse, puis le monde arabe et turc, l'Arménie perd souvent son indépendance. \
À la fin du XIIᵉ siècle, des princes arméniens fondent en Cilicie, au sud-est de l'Asie \
Mineure, un royaume qui dure jusqu'en 1375 : ses monastères produisent les plus beaux \
manuscrits enluminés arméniens, dont ceux du peintre Toros Roslin au XIIIᵉ siècle. Après \
sa chute, les Arméniens se dispersent dans l'Empire ottoman, en Perse, en Crimée, en \
Pologne et jusqu'en Inde. Grands marchands, ils financent églises, manuscrits et objets \
liturgiques, et conservent avec ferveur les livres anciens, qu'ils font relier à nouveau \
ou rachètent quand ils ont été pris."""
style = """
L'enluminure arménienne se distingue par ses couleurs vives et saturées, ses tables des \
canons ornées d'oiseaux et de plantes, ses marges peuplées d'ornements, et une lecture \
personnelle des modèles byzantins. Les orfèvres arméniens, eux, excellent dans l'argent \
repoussé, les émaux et les pierreries des reliures et des reliquaires. Les croix de \
pierre sculptées, les khatchkars, sont une autre création propre à l'art arménien."""

[[artistes]]
nom = "Éthiopie chrétienne"
vie = "Royaume d'Aksoum puis empire d'Éthiopie, depuis le IVᵉ siècle"
biographie = """
Au IVᵉ siècle, le roi Ezana d'Aksoum, dans le nord de l'Éthiopie actuelle, se convertit \
au christianisme sous l'influence de Frumentius, un chrétien de Tyr qu'Athanase \
d'Alexandrie consacre évêque. L'Église éthiopienne reste ensuite liée à celle \
d'Alexandrie, qui lui envoie ses évêques jusqu'au XXᵉ siècle. Sa langue liturgique est \
le guèze, l'ancienne langue d'Aksoum, écrite dans un alphabet propre. Au XIIᵉ ou au \
XIIIᵉ siècle, sous le roi Lalibela, sont creusées dans le rocher les célèbres églises \
qui portent son nom. Au XVᵉ siècle, l'empereur Zara Yaqob, qui règne de 1434 à 1468, \
réforme l'Église et encourage la copie et l'illustration des livres sacrés dans les \
monastères. Les liens avec la Méditerranée se renforcent alors : des icônes crétoises \
arrivent en Éthiopie, et un peintre vénitien, Nicolò Brancaleon, travaille à la cour à \
la fin du siècle. Les églises et les monastères éthiopiens conservent encore aujourd'hui \
des milliers de manuscrits enluminés."""
style = """
La peinture éthiopienne, sur parchemin, sur bois ou sur les murs des églises, privilégie \
le trait d'encre noir, les couleurs pures posées en aplats, le jaune, le rouge, le vert, \
et les grands yeux en amande tournés vers le spectateur. Les plis deviennent des motifs, \
les bordures se couvrent d'entrelacs et de chevrons. Héritière des modèles coptes, \
syriaques et byzantins, elle les transforme en un langage graphique très \
reconnaissable."""
