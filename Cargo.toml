[package]
name = "arteon"
version = "0.1.0"
edition = "2024"
publish = false
description = "ARTEON : une galerie d'art en 3D, écrite uniquement en Rust avec Paquets."
license = "MIT"

# Une crate, deux cibles : le serveur (src/main.rs) et, compilés en WebAssembly par
# `paquets build`, les îlots 3D de src/lib.rs (la galerie et la vitrine).
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
paquets = { git = "https://github.com/maxlestage/Paquets" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
paquets = { git = "https://github.com/maxlestage/Paquets", default-features = false, features = ["client"] }
wasm-bindgen = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Le bundle du navigateur : le plus petit possible.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"
