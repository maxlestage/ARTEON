[package]
name = "arteon"
version = "0.1.0"
edition = "2024"
publish = false
description = "ARTEON : une exposition virtuelle en 3D, écrite uniquement en Rust avec Paquets."
license = "MIT"

# Une crate, deux cibles : le serveur (src/main.rs) et, compilés en WebAssembly par
# `paquets build`, les îlots 3D de src/lib.rs (la galerie et la vitrine).
[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
paquets = { git = "https://github.com/maxlestage/Paquets" }
# Le runtime de l'export statique (`cargo run -- export dist`).
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
paquets = { git = "https://github.com/maxlestage/Paquets", default-features = false, features = ["client"] }
wasm-bindgen = "0.2"

# build.rs : lit exposition.toml et transforme les images en mosaïques.
[build-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# build.rs décode les images et calcule leurs palettes : compilé optimisé, il reste rapide.
[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Le bundle du navigateur : le plus petit possible.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"
# Garde la section `target_features` dont wasm-bindgen a besoin (`strip = true`
# l'enlèverait) ; seules les informations de débogage sont retirées.
strip = "debuginfo"
